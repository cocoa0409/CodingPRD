              captures: { err: $.data.error_id }
            - { call: "POST /api/partnerships/${p_id}/follow-ups", payload: { due_on: "2027-01-21" }, as: TrainingDirector, captures: { fu_id: $.data.id } }
          assert:
            - "due 2027-01-19 rejected: error_id == ERR_FOLLOWUP_TOO_SOON (gap 5 days < 7 from auto follow-up 2027-01-14)"
            - "due 2027-01-21 accepted: FollowUp.${fu_id} SCHEDULED (gap exactly 7 days satisfies >= 7)"

  # ---------------------------------------------------------------------
  # Rule 9: compensating_invariant — different conserved quantities
  # ---------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: fundraising_ledger_conservation
        grounds:
          - calculations.refund_clawback
          - entities.WaitlistEntry.fields.raised_cents
          - state_machines.Contribution.RECEIVED_to_REFUNDED
        distinguishing_aspect: "Conserved quantity is the fundraising ledger: invariant raised_cents == SUM(amount_cents over RECEIVED contributions) holds after every forward (receive) and compensating (refund) action — receive 400000 + 200000 -> 600000; refund 400000 -> 200000; refund 200000 -> 0; no drift at any step."
        test_recipe:
          setup:
            - "FACILITY applicant approved (requirement 765000); two contributions recorded by coord-a"
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Ledger Len", email: "ledger.l@x.com", placement_track: FACILITY, household_income_cents: 12000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [GUIDE_NAVIGATION], task_urgency_tier: STANDARD, home_environment_score: 5 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/contributions", payload: { donor_name: "Donor L1", amount_cents: 400000 }, as: IntakeCoordinator, as_user_id: "coord-a", captures: { c1_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/contributions", payload: { donor_name: "Donor L2", amount_cents: 200000 }, as: IntakeCoordinator, as_user_id: "coord-a", captures: { c2_id: $.data.id } }
            - { call: "GET /api/applicants/${a_id}/waitlist-entries", as: IntakeCoordinator, captures: { entry_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/contributions/${c1_id}/receive", as: IntakeCoordinator, as_user_id: "coord-b" }
            - { call: "POST /api/contributions/${c2_id}/receive", as: IntakeCoordinator, as_user_id: "coord-b" }
            - { call: "GET /api/waitlist-entries/${entry_id}", as: IntakeCoordinator, captures: { r_mid: $.data.raised_cents } }
            - { call: "POST /api/contributions/${c1_id}/refund", as: IntakeCoordinator }
            - { call: "GET /api/waitlist-entries/${entry_id}", as: IntakeCoordinator, captures: { r_post: $.data.raised_cents } }
            - { call: "POST /api/contributions/${c2_id}/refund", as: IntakeCoordinator }
            - { call: "GET /api/waitlist-entries/${entry_id}", as: IntakeCoordinator, captures: { r_zero: $.data.raised_cents } }
          assert:
            - "after both receives: raised_cents == 600000 == 400000 + 200000 (sum over RECEIVED)"
            - "after refunding c1: raised_cents == 200000 == remaining RECEIVED sum"
            - "after refunding c2: raised_cents == 0 == sum over empty RECEIVED set"
            - "entry never left PENDING (600000 < 765000 at all times)"

      - name: raiser_capacity_conservation
        grounds:
          - entities.PuppyRaiser.fields.current_dog_count
          - state_machines.RaiserPlacement.ACTIVE_to_EARLY_RETURN
          - state_machines.RaiserPlacement.ACTIVE_to_COMPLETED
        distinguishing_aspect: "Conserved quantity is foster occupancy: invariant SUM(current_dog_count over all raisers) == COUNT(Dog with status RAISER_PLACED) holds across placement (1 == 1), early-return compensation (0 == 0), and re-placement (1 == 1)."
        test_recipe:
          setup:
            - "Raiser R APPROVED with foster_capacity 2 in region NW; two DONATED dogs health-cleared and CLEARED"
          setup_api_calls:
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser Cap", region: NW, foster_capacity: 2, experience_score: 75 }, as: ProgramAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/puppy-raisers/${r_id}/vet", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers/${r_id}/approve", as: ProgramAdmin }
            - { call: "POST /api/dogs", payload: { name: "CapOne", origin: DONATED, breed: "Labrador", sex: MALE, born_on: "2024-01-01", region: NW, donor_name: "Donor C1" }, as: ProgramAdmin, captures: { d1_id: $.data.id } }
            - { call: "POST /api/dogs/${d1_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d1_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc1_id: $.data.id } }
            - { call: "POST /api/screenings/${sc1_id}/submit", as: Veterinarian }
            - { call: "POST /api/dogs", payload: { name: "CapTwo", origin: DONATED, breed: "Poodle", sex: FEMALE, born_on: "2024-02-01", region: NW, donor_name: "Donor C2" }, as: ProgramAdmin, captures: { d2_id: $.data.id } }
            - { call: "POST /api/dogs/${d2_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d2_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc2_id: $.data.id } }
            - { call: "POST /api/screenings/${sc2_id}/submit", as: Veterinarian }
          trigger:
            - { call: "POST /api/dogs/${d1_id}/raiser-placements", payload: { puppy_raiser_id: "${r_id}" }, as: TrainingDirector, captures: { pl1_id: $.data.id } }
            - { call: "GET /api/puppy-raisers/${r_id}", as: ProgramAdmin, captures: { cnt1: $.data.current_dog_count } }
            - { call: "POST /api/raiser-placements/${pl1_id}/early-return", as: TrainingDirector }
            - { call: "GET /api/puppy-raisers/${r_id}", as: ProgramAdmin, captures: { cnt0: $.data.current_dog_count, st0: $.data.status } }
            - { call: "POST /api/dogs/${d2_id}/raiser-placements", payload: { puppy_raiser_id: "${r_id}" }, as: TrainingDirector, captures: { pl2_id: $.data.id } }
            - { call: "GET /api/puppy-raisers/${r_id}", as: ProgramAdmin, captures: { cnt1b: $.data.current_dog_count, st1b: $.data.status } }
          assert:
            - "after placing d1: PuppyRaiser.${r_id}.current_dog_count == 1 == count(dogs RAISER_PLACED) and raiser status == ACTIVE"
            - "after early-return: current_dog_count == 0 == count(dogs RAISER_PLACED) and raiser status reverted ACTIVE -> APPROVED; Dog.${d1_id}.status == RECALLED"
            - "after placing d2: current_dog_count == 1 == count(dogs RAISER_PLACED) again — forward + compensating actions leave zero drift"

      - name: match_pairing_conservation
        grounds:
          - state_machines.MatchRecord.PROPOSED_to_ACCEPTED
          - state_machines.MatchRecord.ACCEPTED_to_DISSOLVED
          - entities.WaitlistEntry.fields.dissolved_match_count
        distinguishing_aspect: "Conserved quantity is the 1:1 pairing count: invariant COUNT(Dog MATCHED) == COUNT(MatchRecord ACCEPTED) == COUNT(WaitlistEntry MATCHED) holds at 0 before, 1 after accept, and 0 after dissolve — the accept/dissolve pair leaves the pairing counts unchanged while dissolved_match_count ratchets to 1 (monotone audit field, not part of the invariant)."
        test_recipe:
          setup:
            - "Eligible entry (MOBILITY, income 12000000, requirement 1350000 met) and MATCH_READY dog with certified task RETRIEVE_ITEMS"
          setup_api_calls:
            - { call: "POST /api/trainers", payload: { full_name: "Trainer Inv", pat_certified: false }, as: ProgramAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/trainers/${t_id}/certify", as: ProgramAdmin }
            - { call: "POST /api/dogs", payload: { name: "Invariant", origin: DONATED, breed: "Labrador", sex: MALE, born_on: "2024-01-08", region: NW, donor_name: "Donor Fifteen" }, as: ProgramAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /api/dogs/${d_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc_id: $.data.id } }
            - { call: "POST /api/screenings/${sc_id}/submit", as: Veterinarian }
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser Fifteen", region: NW, foster_capacity: 1, experience_score: 50 }, as: ProgramAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/puppy-raisers/${r_id}/vet", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers/${r_id}/approve", as: ProgramAdmin }
            - { call: "POST /api/dogs/${d_id}/raiser-placements", payload: { puppy_raiser_id: "${r_id}" }, as: TrainingDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /api/raiser-placements/${pl_id}/complete", payload: { primary_trainer_id: "${t_id}" }, as: TrainingDirector }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: RETRIEVE_ITEMS, score: 95 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: OPEN_DOORS, score: 90 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: PUBLIC_MANNERS, score: 88 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: OBEDIENCE, score: 85 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: SOCIALIZATION, score: 82 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: RETRIEVE_ITEMS, score: 84 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/applicants", payload: { full_name: "Inv Applicant", email: "inv.a@x.com", placement_track: MOBILITY, household_income_cents: 12000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [RETRIEVE_ITEMS], task_urgency_tier: STANDARD, home_environment_score: 6 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/contributions", payload: { donor_name: "Donor K", amount_cents: 1350000 }, as: IntakeCoordinator, as_user_id: "coord-a", captures: { c_id: $.data.id } }
            - { call: "POST /api/contributions/${c_id}/receive", as: IntakeCoordinator, as_user_id: "coord-b" }
            - { call: "GET /api/applicants/${a_id}/waitlist-entries", as: IntakeCoordinator, captures: { entry_id: "$.data[0].id" } }
            - { call: "GET /api/dogs/${d_id}", as: TrainingDirector, captures: { d_v: $.data.version } }
          trigger:
            - { call: "POST /api/dogs/${d_id}/match-proposals", payload: { waitlist_entry_id: "${entry_id}", expected_dog_version: "${d_v}" }, as: IntakeCoordinator, captures: { m_id: $.data.id } }
            - { call: "POST /api/matches/${m_id}/accept", as: IntakeCoordinator }
            - { call: "GET /api/dogs/${d_id}", as: TrainingDirector, captures: { st_mid: $.data.status } }
            - { call: "POST /api/matches/${m_id}/dissolve", as: IntakeCoordinator }
            - { call: "GET /api/dogs/${d_id}", as: TrainingDirector, captures: { st_post: $.data.status } }
            - { call: "GET /api/waitlist-entries/${entry_id}", as: IntakeCoordinator, captures: { e_post: $.data.status, diss: $.data.dissolved_match_count } }
          assert:
            - "before accept: COUNT(Dog MATCHED) == 0 == COUNT(MatchRecord ACCEPTED) == COUNT(entry MATCHED)"
            - "after accept: all three counts == 1 (Dog.${d_id} MATCHED, MatchRecord.${m_id} ACCEPTED, entry MATCHED)"
            - "after dissolve: all three counts == 0 again (Dog MATCH_READY, MatchRecord DISSOLVED, entry ELIGIBLE)"
            - "WaitlistEntry.${entry_id}.dissolved_match_count == 1 (audit ratchet outside the conserved set)"
