      - name: clock_driven_edges_do_not_settle_on_their_own_and_wait_for_an_explicit_capacity_sweep
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model=immediate
          - endpoints[POST /obstetric-units/{unitId}/capacity-sweep]
          - endpoints[GET /obstetric-units/{unitId}/capacity-summary]
          - state_machines[InductionBooking].CAPACITY_HELD->EXPIRED
          - state_machines[SupportPersonPass].{ISSUED|CHECKED_OUT}->EXPIRED
          - entities.ObstetricUnit.last_capacity_sweep_at
          - calculations[induction_capacity_projection]
        distinguishing_aspect: |
          `immediate` does not mean "everything is instantly true"; it means nothing is EVENTUAL. The
          scaffold has a whole class of edges whose actor is `system` and whose trigger is literally
          POST /obstetric-units/{unitId}/capacity-sweep, and the temptation is to implement them lazily —
          as read-time derivations, or as background settling. This instance rules both out from opposite
          sides on one unit that has a CAPACITY_HELD booking whose 120-minute TTL lapsed 22 hours ago and an
          ISSUED support pass that reached its 24-hour valid_until instant exactly.
          FIRST: with the clock moved a full day past both deadlines and NO sweep called, every read is
          required to still show the stale-looking-but-correct state — booking CAPACITY_HELD, its bed HELD,
          the pass ISSUED, 675 held bed-minutes still committed against the 2026-08-02 budget and
          last_capacity_sweep_at still null. An implementation that expires on read (or on a timer) fails
          here, and this is the arm that most such implementations fail.
          SECOND: the sweep call itself does all of it inside ONE request and reports exactly what it did in
          its own response body (holds_expired_booking_ids and expired_pass_ids each naming their row), and
          the immediately following reads are already final — booking EXPIRED, bed AVAILABLE, pass EXPIRED,
          held bed-minutes back to 0, available_ldr_beds back to 2. There is no intermediate state visible
          between the sweep and the read.
          THIRD: a second identical sweep is a documented no-op rather than a double-credit — every counter
          0, every array empty, no error, and the booking still EXPIRED — which is the property that
          separates "the sweep applies what is due" from "the sweep replays what it already applied" and
          protects the induction_bed_minute_conservation invariant from being credited twice.
        test_recipe:
          setup: |
            Clock starts at 2026-08-01T05:45:00Z. One unit "Kestrel Hollow Birthing Center LDR" with two
            LDR beds LDR-01 and LDR-02. An ANESTHESIOLOGIST and an OB_ATTENDING exist only to staff a
            DECISION_TO_INCISION drill scheduled for 05:50, which is started at 05:50, documented at 06:00
            with a passing 3-minute interval and validated by the PerinatalSafetyOfficer — needed because a
            unit still on the NOT_READY default sits in INDUCTION_FROZEN and could not take a hold at all.
            At 06:00 one walk-in encounter PRC-KEST-5101 (39 weeks, parity 1) is admitted; it is TIER_I /
            ANTEPARTUM with required_coverage_units 0.5 and no coverage, so the unit sits at RATIO_STRAINED
            with turnover_buffer_minutes 75 for the whole run — which is exactly what makes the hold's
            frozen projection 600 + 75 = 675 rather than 645. A PARTNER SupportPersonPass is issued on that
            encounter at 06:00, so valid_until is 06:00 + PASS_VALID_HOURS (24) = 2026-08-02T06:00:00Z. One
            InductionBooking for 2026-08-02T08:00:00Z (41 weeks, POST_DATES_41W, therefore
            MEDICALLY_INDICATED, which RATIO_STRAINED permits) with expected_labor_minutes 600 is filed and
            then holds LDR-01 at 06:00, so hold_expires_at is 06:00 + HOLD_TTL_MINUTES (120) =
            2026-08-01T08:00:00Z and 675 held bed-minutes land on the 2026-08-02 budget. Nothing else exists
            on the unit: no bundles, no assessments, no shifts, no other bookings — so the only work the
            sweep can possibly find is the pair of lapsed deadlines this instance planted.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T05:45:00Z" }
              as: PerinatalSafetyOfficer
