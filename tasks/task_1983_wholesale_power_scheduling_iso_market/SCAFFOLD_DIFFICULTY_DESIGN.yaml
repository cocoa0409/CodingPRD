              captures: { d1_id: $.data.id }
            - { call: "POST /market/disputes/${d1_id}/withdraw", as: SettlementAnalyst, as_user_id: "${p_id}" }
            - call: "POST /market/statements/${s_id}/disputes"
              payload: { dispute_reason: "METER_DATA_ERROR", disputed_line_ids: ["${ln_id}"] }
              as: SettlementAnalyst
              as_user_id: "${p_id}"
              captures: { d2_id: $.data.id }
            - { call: "POST /market/disputes/${d2_id}/start-review", as: IsoOperator }
            - { call: "POST /market/disputes/${d2_id}/resolve", payload: { outcome: "REJECTED" }, as: IsoOperator }
            - call: "GET /market/statements/${s_id}"
              as: SettlementAnalyst
              as_user_id: "${p_id}"
              captures: { s_final_status: $.data.status }
          assert:
            - "Statement ISSUED → UNDER_DISPUTE on file, → ISSUED on withdraw, → UNDER_DISPUTE on refile (cycle, no ERR_DISPUTE_ALREADY_OPEN after withdrawal), → ISSUED on REJECTED"
            - "SettlementDispute.${d1_id}.status == WITHDRAWN; SettlementDispute.${d2_id}.status == REJECTED"
            - "SettlementStatement.${s_id}.status == ISSUED at the end and net_amount_cents == -1128000 (unchanged through the cycle)"

      - name: outage_denied_resubmission_cycle
        grounds:
          - state_machines.OutageReport.ACKNOWLEDGED_to_DENIED
          - state_machines.OutageReport.DENIED_to_SUBMITTED
        distinguishing_aspect: |
          Third non-linear machine on a third entity: OutageReport DENIED →
          SUBMITTED resubmission loop (SUBMITTED → ACKNOWLEDGED → DENIED →
          SUBMITTED → ACKNOWLEDGED → APPROVED) exercises a revision cycle with
          overlap re-validation on each loop.
        test_recipe:
          setup:
            - "Participant with 10 MW generator; logical clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Out Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - call: "POST /market/generators/${g_id}/outages"
              payload: { outage_type: "PARTIAL", derate_pct: 40, start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-06T00:00:00Z", reason: "boiler tube leak" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { out_id: $.data.id }
            - { call: "POST /market/outages/${out_id}/acknowledge", as: IsoOperator }
            - { call: "POST /market/outages/${out_id}/deny", payload: { denial_reason: "insufficient notice" }, as: IsoOperator }
          trigger:
            - call: "POST /market/outages/${out_id}/resubmit"
              payload: { derate_pct: 30, reason: "boiler tube leak — revised scope" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { out_st: $.data.status, out_derate: $.data.derate_pct }
            - { call: "POST /market/outages/${out_id}/acknowledge", as: IsoOperator }
            - { call: "POST /market/outages/${out_id}/approve", as: IsoOperator }
            - call: "GET /market/outages/${out_id}"
              as: IsoOperator
              captures: { out_final: $.data.status }
            - call: "GET /market/generators/${g_id}"
              as: IsoOperator
              captures: { g_avail: $.data.availability_mw, g_status: $.data.status }
          assert:
            - "OutageReport.${out_id}.status sequence SUBMITTED → ACKNOWLEDGED → DENIED → SUBMITTED (resubmit with derate_pct 30) → ACKNOWLEDGED → APPROVED"
            - "denial_reason 'insufficient notice' was recorded on the DENIED hop and OutageReport.${out_id}.derate_pct == 30 after resubmission"
            - "GeneratorAsset.${g_id}.status == AVAILABLE and availability_mw == 10 after approval because logical clock 2026-08-01 is outside the [2026-08-05, 2026-08-06) window — approval registers the outage without an immediate derate"

  - rule_id: transitive_cascade
    instances:
      - name: outage_approval_cascades_to_margin_call
        grounds:
          - state_machines.OutageReport.ACKNOWLEDGED_to_APPROVED
          - state_machines.CapacityObligation.ACTIVE_to_AT_RISK
          - state_machines.MarketParticipant.ACTIVE_to_MARGIN_CALL
          - calculations.availability_recompute
          - calculations.credit_posture_evaluation
        distinguishing_aspect: |
          Depth-3 cascade from the outage-approve trigger: approve mutates
          GeneratorAsset (link 1), the availability mutation forces
          CapacityObligation ACTIVE → AT_RISK (link 2), and the AT_RISK
          transition itself injects the capacity risk adder that creates a
          MarginCall and moves the participant to MARGIN_CALL (link 3).
        test_recipe:
          setup:
            - "BELOW_INVESTMENT_GRADE participant (allowance 0, posted 0) with 10 MW generator and obligation 10 MW @ 1000000 for 2026-08"
            - "Logical clock 2026-08-05T00:00:00Z; full outage window [2026-08-05, 2026-08-06) covers the clock"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Casc Co", credit_rating_tier: "BELOW_INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - call: "POST /market/obligations"
              payload: { generator_asset_id: "${g_id}", delivery_period: "2026-08", obligated_mw: 10, capacity_rate_cents_per_mw: 1000000 }
              as: IsoOperator
              captures: { ob_id: $.data.id, ob_st0: $.data.status }
            - call: "POST /market/generators/${g_id}/outages"
              payload: { outage_type: "FULL", derate_pct: 100, start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-06T00:00:00Z", reason: "forced outage" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { out_id: $.data.id }
            - { call: "POST /market/outages/${out_id}/acknowledge", as: IsoOperator }
          trigger:
            - { call: "POST /market/outages/${out_id}/approve", as: IsoOperator }
            - call: "GET /market/generators/${g_id}"
              as: IsoOperator
              captures: { g_avail: $.data.availability_mw, g_status: $.data.status }
            - call: "GET /market/obligations/${ob_id}"
              as: IsoOperator
              captures: { ob_st: $.data.status, ob_exp: $.data.expected_output_mw }
            - call: "GET /market/participants/${p_id}"
              as: IsoOperator
              captures: { p_st: $.data.status, p_req: $.data.collateral_requirement_cents }
            - call: "GET /market/margin-calls"
              payload: { market_participant_id: "${p_id}", status: "OPEN" }
              as: IsoOperator
              captures: { mc_id: "$.data[0].id", mc_amt: "$.data[0].required_additional_cents" }
          assert:
            - "LINK 1: GeneratorAsset.${g_id}.availability_mw == 0 and status == ON_OUTAGE"
            - "LINK 2: CapacityObligation.${ob_id}.expected_output_mw == 0 and status == AT_RISK (was ACTIVE)"
            - "LINK 3: MarketParticipant.${p_id}.collateral_requirement_cents == 500000 (10 × 50000 risk adder), status == MARGIN_CALL"
            - "MarginCall.${mc_id}.required_additional_cents == 500000 and status == OPEN — created by the cascade, not by the original trigger directly"

      - name: dispute_upheld_cascades_to_margin_cure
        grounds:
          - state_machines.SettlementDispute.UNDER_REVIEW_to_UPHELD
          - state_machines.SettlementStatement.ISSUED_to_SUPERSEDED
          - state_machines.MarginCall.OPEN_to_CURED
          - calculations.resettlement_recompute
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (dispute resolve, not outage
          approve): UPHELD supersedes the statement and issues a RESETTLEMENT
          (link 1); the resettlement's reduced net re-runs credit evaluation
          which CUREs the open margin call and returns the participant to
          ACTIVE (link 2).
        test_recipe:
          setup:
            - "INVESTMENT_GRADE participant; 10 MW generator; obligation 10 MW @ 1000000; day 2026-08-10 event intervals 1-2 with telemetry 6 MW → capacity charge 400000"
            - "FINAL statement net +400000 → margin call 300000 OPEN (effective 400000 − 100000 allowance), participant MARGIN_CALL"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Cure Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id, g_v: $.data.version }
            - { call: "POST /market/obligations", payload: { generator_asset_id: "${g_id}", delivery_period: "2026-08", obligated_mw: 10, capacity_rate_cents_per_mw: 1000000 }, as: IsoOperator }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-10", da_gate_close_at: "2026-08-09T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id }
            - { call: "POST /market/operating-days/${d_id}/run-day-ahead-market", payload: { node_prices: [] }, as: IsoOperator }
            - call: "POST /market/generators/${g_id}/telemetry"
              payload: { operating_day_id: "${d_id}", expected_generator_asset_version: "${g_v}", readings: [ { interval_index: 1, actual_mw: 6 }, { interval_index: 2, actual_mw: 6 } ] }
              as: Trader
              as_user_id: "${p_id}"
            - call: "POST /market/operating-days/${d_id}/performance-events"
              payload: { start_interval: 1, end_interval: 2 }
              as: IsoOperator
              captures: { ev_id: $.data.id }
            - { call: "POST /market/events/${ev_id}/activate", as: IsoOperator }
            - { call: "POST /market/events/${ev_id}/complete", as: IsoOperator }
            - { call: "POST /market/operating-days/${d_id}/close-real-time", payload: { rt_node_prices_prelim: [] }, as: IsoOperator }
            - { call: "POST /market/operating-days/${d_id}/run-preliminary-settlement", as: IsoOperator }
            - { call: "POST /market/operating-days/${d_id}/run-final-settlement", payload: { rt_node_prices_final: [] }, as: IsoOperator }
            - call: "GET /market/statements"
              payload: { operating_day_id: "${d_id}", market_participant_id: "${p_id}", run_type: "FINAL" }
              as: SettlementAnalyst
              as_user_id: "${p_id}"
              captures: { s_id: "$.data[0].id" }
            - call: "GET /market/statements/${s_id}/lines"
              as: SettlementAnalyst
              as_user_id: "${p_id}"
              captures: { ln_cap: "$.data[0].id" }
            - call: "GET /market/margin-calls"
              payload: { market_participant_id: "${p_id}", status: "OPEN" }
              as: IsoOperator
              captures: { mc_id: "$.data[0].id" }
            - call: "POST /market/statements/${s_id}/disputes"
              payload: { dispute_reason: "CALCULATION_ERROR", disputed_line_ids: ["${ln_cap}"] }
              as: SettlementAnalyst
              as_user_id: "${p_id}"
              captures: { disp_id: $.data.id }
            - { call: "POST /market/disputes/${disp_id}/start-review", as: IsoOperator }
          trigger:
            - { call: "POST /market/disputes/${disp_id}/resolve", payload: { outcome: "UPHELD" }, as: IsoOperator }
            - call: "GET /market/statements"
              payload: { market_participant_id: "${p_id}", run_type: "RESETTLEMENT" }
              as: IsoOperator
              captures: { s_re: "$.data[0].id", s_re_net: "$.data[0].net_amount_cents", s_re_sup: "$.data[0].supersedes_statement_id" }
            - call: "GET /market/statements/${s_id}"
              as: IsoOperator
              captures: { s_old_st: $.data.status }
            - call: "GET /market/margin-calls/${mc_id}"
              as: IsoOperator
              captures: { mc_st: $.data.status }
            - call: "GET /market/participants/${p_id}"
              as: IsoOperator
              captures: { p_st: $.data.status, p_req: $.data.collateral_requirement_cents }
          assert:
            - "LINK 1: SettlementStatement.${s_id}.status == SUPERSEDED; RESETTLEMENT ${s_re} ISSUED with supersedes_statement_id == ${s_id} and net_amount_cents == 0 (400000 − disputed capacity line 400000)"
            - "LINK 2: MarginCall.${mc_id}.status == CURED and MarketParticipant.${p_id}.status == ACTIVE with collateral_requirement_cents == 0"
            - "The cure was caused by the resettlement (link 2), not by the resolve call touching the margin call directly"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: generator_outage_state_beats_credit_headroom
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_GENERATOR_NOT_AVAILABLE]
          - errors[ERR_CREDIT_HEADROOM_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): the submit violates
          BOTH the cross-entity state rule (generator ON_OUTAGE) and the fiscal
          rule (BELOW_INVESTMENT_GRADE participant with 0 posted and 0
          allowance lacks headroom for 5000 risk) — priority 8 must win over
          priority 12.
        test_recipe:
          setup:
            - "BELOW_INVESTMENT_GRADE participant, posted 0; 10 MW generator; offer 10 MW @ 5000 created DRAFT while healthy"
