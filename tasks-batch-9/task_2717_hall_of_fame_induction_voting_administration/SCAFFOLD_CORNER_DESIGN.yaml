  - section: rbac
    instances:
      - name: credentialing_is_exclusive_to_the_election_administrator
        claim_type: exclusive_operation_permitted
        grounds:
          - rbac.ElectionAdministrator.exclusive_operations
          - endpoints[POST /electors/{id}/credential]
          - state_machines.Elector.PROVISIONAL_to_CREDENTIALED
        distinguishing_aspect: |
          Credentialing the voter body is listed among ElectionAdministrator's exclusive operations and
          nowhere else. Performed by that role it works end to end: the elector leaves PROVISIONAL for
          CREDENTIALED and the bloc's seats_filled counter takes the seat, which is what later gates
          both the seat cap and the participation quorum.
        test_recipe:
          setup:
            - "One VoterBloc WRITERS with seat_cap 10 and seats_filled 0."
            - "One PROVISIONAL elector whose credential runs to 2027-12-31."
          setup_api_calls:
            - call: "POST /voter-blocs"
              payload: { bloc_code: "WRITERS", name: "Baseball Writers", seat_cap: 10, min_participation_pct: 0.50 }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { bloc: "$.data.id" }
            - call: "POST /electors"
              payload: { full_name: "Elector One", bloc_id: "${bloc}", credential_expires_on: "2027-12-31T00:00:00Z", is_screening_member: false }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { e1: "$.data.id" }
          trigger:
            - call: "POST /electors/${e1}/credential"
              payload: {}
              as: ElectionAdministrator
              as_user_id: "admin-1"
          assert:
            - "HTTP 200"
            - "Elector.${e1}.status == CREDENTIALED"
            - "Elector.${e1}.consecutive_missed_cycles == 0"
            - "VoterBloc.${bloc}.seats_filled == 1"

      - name: credentialing_by_an_elector_role_is_unauthorized
        claim_type: exclusive_operation_denied
        grounds:
          - rbac.ElectionAdministrator.exclusive_operations
          - rbac.Elector
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          The same call from the Elector role - using an X-User-ID that really does resolve to the
          elector row being credentialed, so the entity_backed identity check would pass - is refused
          403 ERR_UNAUTHORIZED at priority 2. Electors cannot credential themselves, and the bloc seat
          stays free.
        test_recipe:
          setup:
            - "The same WRITERS bloc and the same PROVISIONAL elector."
            - "The request carries X-User-Role: Elector with that elector's own id."
          setup_api_calls:
            - call: "POST /voter-blocs"
              payload: { bloc_code: "WRITERS", name: "Baseball Writers", seat_cap: 10, min_participation_pct: 0.50 }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { bloc: "$.data.id" }
            - call: "POST /electors"
              payload: { full_name: "Elector One", bloc_id: "${bloc}", credential_expires_on: "2027-12-31T00:00:00Z", is_screening_member: false }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { e1: "$.data.id" }
          trigger:
            - call: "POST /electors/${e1}/credential"
              payload: {}
              as: Elector
              as_user_id: "${e1}"
              captures: { err_cr: "$.data.error_id" }
          assert:
            - "HTTP 403"
            - "${err_cr} == ERR_UNAUTHORIZED"
            - "Elector.${e1}.status == PROVISIONAL"
            - "VoterBloc.${bloc}.seats_filled == 0"

