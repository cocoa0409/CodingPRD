      - name: repeating_decannulation_and_incident_submission_is_rejected
        claim_type: idempotency
        grounds:
          - validations[priority=38]
          - validations[priority=36]
          - errors.ERR_ECMO_RUN_STATE_INVALID
          - errors.ERR_INCIDENT_STATE_INVALID
          - state_machines.EcmoRun.RUNNING_to_DECANNULATED
          - state_machines.IncidentReport.DRAFT_to_SUBMITTED
          - calculations.ecmo_run_billing
        distinguishing_aspect: |
          The clinical half of the replay claim, on the two machines whose replays would corrupt
          money and audit trails: a second decannulation would recompute ecmo_run_billing against a
          later clock and inflate billable_hours, and a second submission would reset an audit trail
          that reviewers have already picked up. A handoff against the same DECANNULATED run is also
