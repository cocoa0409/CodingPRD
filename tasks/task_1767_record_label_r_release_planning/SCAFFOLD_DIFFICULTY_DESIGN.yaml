            - { call: "POST /api/tour-expenses/${exp_x}/approve", payload: {}, as: FinanceController }
            - { call: "POST /api/contracts/${contract_m}/recording-projects", payload: { title: "P-M", project_type: "SINGLE", budget_cents: 100000 }, as: AnRManager, captures: { proj_m: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_m}/start", payload: {}, as: AnRManager }
