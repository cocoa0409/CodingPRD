      - name: assurance_requirement_reconciles_when_a_batch_reserves_treatment_liability
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.financial_assurance_requirement
          - calculations.treatment_liability
          - state_machines.treatment_batch_lifecycle.transitions
        distinguishing_aspect: |
          A PLANNED batch adds a liability of round_half_up(200.0 * 220) = 44,000 cents on top of the
          closure estimate that already prices the same 200.0 kg as stored waste. The two figures answer
          different questions and are both live at once, so required_assurance_cents must read
          34,672,000 while reserved_kg reads 200.0 — and aborting the batch must restore both exactly.
