# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >= 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7. Formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: proration_provisional_vs_final
        grounds:
          - calculations.prorated_first_period_rent
          - entities.Settlement.fields.prorated_first_rent_cents
          - entities.Settlement.fields.final_prorated_first_rent_cents
          - state_machines.Settlement.FUNDED_to_HANDED_OFF
        distinguishing_aspect: "Same Settlement, same base rent 300000: PROVISIONAL from occupancy_start 2026-06-10 = 210000, FINAL from handoff 2026-06-15 = 160000 (differs because the move-in date differs)."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Verified lease (rent 300000, deposit 500000, allows_sublet). SUBLET listing (asking 300000) OPEN. Applicant (income 15000000) matched with occupancy 2026-06-10..2026-08-31. Agreement executed, settlement funded (746000), agreement ACTIVE."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /applicants", payload: { name: "AP", email: "ap@x.com", annual_income_cents: 15000000, monthly_debt_cents: 100000, credit_score: 720 }, as: PlatformAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300000, security_deposit_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_sublet: true, allows_assignment: false }, as: Landlord, as_user_id: "${ll_id}", captures: { lease_id: $.data.id } }
            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /leases/${lease_id}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /listings", payload: { lease_id: "${lease_id}", listing_type: "SUBLET", asking_rent_cents: 300000, available_from: "2026-06-01", available_to: "2026-12-31", min_term_months: 2, screening_policy: "STANDARD" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { listing_id: $.data.id } }
            - { call: "POST /listings/${listing_id}/request-approval", payload: {}, as: Leaseholder, as_user_id: "${lh_id}" }
            - { call: "POST /listings/${listing_id}/approve", payload: {}, as: Landlord, as_user_id: "${ll_id}", captures: { listing_v: $.data.version } }
            - { call: "POST /applications", payload: { listing_id: "${listing_id}", applicant_id: "${ap_id}", proposed_move_in_date: "2026-06-10", proposed_move_out_date: "2026-08-31" }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/start-screening", payload: {}, as: ComplianceOfficer }
            - { call: "POST /applications/${app_id}/screening-report", payload: { credit_score: 720, income_verified: true }, as: ComplianceOfficer }
            - { call: "POST /applications/${app_id}/match", payload: {}, as: ComplianceOfficer }
            - { call: "POST /agreements", payload: { application_id: "${app_id}", expected_listing_version: "${listing_v}", occupancy_start_date: "2026-06-10", occupancy_end_date: "2026-08-31" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { agr_id: $.data.id } }
            - { call: "GET /settlements", payload: { agreement_id: "${agr_id}" }, as: Leaseholder, captures: { sett_id: "$.data[0].id", prov: "$.data[0].prorated_first_rent_cents" } }
            - { call: "POST /agreements/${agr_id}/send-for-signature", payload: {}, as: Leaseholder, as_user_id: "${lh_id}" }
            - { call: "POST /agreements/${agr_id}/signatures", payload: { signer_role: "LANDLORD" }, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /agreements/${agr_id}/signatures", payload: { signer_role: "LEASEHOLDER" }, as: Leaseholder, as_user_id: "${lh_id}" }
            - { call: "POST /agreements/${agr_id}/signatures", payload: { signer_role: "APPLICANT" }, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /settlements/${sett_id}/fund", payload: { funded_amount_cents: 746000 }, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /agreements/${agr_id}/activate", payload: {}, as: Leaseholder, as_user_id: "${lh_id}" }
          trigger:
            - { call: "POST /settlements/${sett_id}/handoff", payload: { handoff_date: "2026-06-15" }, as: Leaseholder, as_user_id: "${lh_id}" }
          assert:
            - "Settlement.${sett_id}.prorated_first_rent_cents == 210000"
            - "Settlement.${sett_id}.final_prorated_first_rent_cents == 160000"
            - "Settlement.${sett_id}.status == HANDED_OFF"

      - name: income_qualification_ratio_vs_multiple
        grounds:
          - calculations.income_qualification
          - entities.ScreeningReport.fields.qualification_result
          - entities.Listing.fields.screening_policy
        distinguishing_aspect: "Same applicant income 11000000 and effective rent 300000: STANDARD ratio 0.3273<=0.35 -> PASS, STRICT multiple 36.6667<40 -> FAIL (ScreeningReport domain, distinct from the Settlement proration variant)."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Verified lease (rent 300000, allows_sublet). Two SUBLET listings on it, asking 300000, one STANDARD one STRICT, both OPEN. One applicant income 11000000 applies to both; both screened."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /applicants", payload: { name: "AP", email: "ap@x.com", annual_income_cents: 11000000, monthly_debt_cents: 0, credit_score: 700 }, as: PlatformAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300000, security_deposit_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_sublet: true }, as: Landlord, as_user_id: "${ll_id}", captures: { lease_id: $.data.id } }
            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /leases/${lease_id}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /listings", payload: { lease_id: "${lease_id}", listing_type: "SUBLET", asking_rent_cents: 300000, available_from: "2026-06-01", available_to: "2026-12-31", min_term_months: 2, screening_policy: "STANDARD" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { listing_std: $.data.id } }
            - { call: "POST /listings/${listing_std}/request-approval", payload: {}, as: Leaseholder, as_user_id: "${lh_id}" }
            - { call: "POST /listings/${listing_std}/approve", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /listings", payload: { lease_id: "${lease_id}", listing_type: "SUBLET", asking_rent_cents: 300000, available_from: "2026-06-01", available_to: "2026-12-31", min_term_months: 2, screening_policy: "STRICT" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { listing_strict: $.data.id } }
            - { call: "POST /listings/${listing_strict}/request-approval", payload: {}, as: Leaseholder, as_user_id: "${lh_id}" }
            - { call: "POST /listings/${listing_strict}/approve", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /applications", payload: { listing_id: "${listing_std}", applicant_id: "${ap_id}", proposed_move_in_date: "2026-06-01", proposed_move_out_date: "2026-08-31" }, as: Applicant, as_user_id: "${ap_id}", captures: { app_std: $.data.id } }
            - { call: "POST /applications/${app_std}/start-screening", payload: {}, as: ComplianceOfficer }
            - { call: "POST /applications", payload: { listing_id: "${listing_strict}", applicant_id: "${ap_id}", proposed_move_in_date: "2026-06-01", proposed_move_out_date: "2026-08-31" }, as: Applicant, as_user_id: "${ap_id}", captures: { app_strict: $.data.id } }
            - { call: "POST /applications/${app_strict}/start-screening", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /applications/${app_std}/screening-report", payload: { credit_score: 700, income_verified: true }, as: ComplianceOfficer, captures: { sr_std: $.data.id, res_std: $.data.qualification_result } }
            - { call: "POST /applications/${app_strict}/screening-report", payload: { credit_score: 700, income_verified: true }, as: ComplianceOfficer, captures: { sr_strict: $.data.id, res_strict: $.data.qualification_result } }
          assert:
            - "ScreeningReport.${sr_std}.qualification_result == PASS"
            - "ScreeningReport.${sr_strict}.qualification_result == FAIL"
            - "ScreeningReport.${sr_std}.affordability_ratio == 0.3273"
            - "ScreeningReport.${sr_strict}.income_multiple == 36.6667"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: total_move_in_takeover_deposit_cap
        grounds:
          - calculations.total_move_in_amount
          - entities.Settlement.fields.deposit_amount_cents
          - entities.Settlement.fields.total_move_in_cents
          - entities.Settlement.fields.last_month_rent_cents
        distinguishing_aspect: "Mode (a): >=3 inputs with a conditional branch and a nested cap. TAKEOVER, rent 400000, deposit 1000000 -> deposit capped at min(1000000, 2*400000)=800000; last_month=400000; full-month prorate=400000; fee 64000 => total 1664000."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Verified lease (rent 400000, deposit 1000000, allows_assignment). TAKEOVER listing OPEN. Applicant matched, occupancy 2026-07-01..2026-09-30. Agreement drafted (auto-creates Settlement)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /applicants", payload: { name: "AP", email: "ap@x.com", annual_income_cents: 30000000, monthly_debt_cents: 0, credit_score: 760 }, as: PlatformAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 400000, security_deposit_cents: 1000000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_assignment: true }, as: Landlord, as_user_id: "${ll_id}", captures: { lease_id: $.data.id } }
            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /leases/${lease_id}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /listings", payload: { lease_id: "${lease_id}", listing_type: "TAKEOVER", asking_rent_cents: 400000, available_from: "2026-06-01", available_to: "2026-12-31", min_term_months: 2, screening_policy: "STANDARD" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { listing_id: $.data.id } }
            - { call: "POST /listings/${listing_id}/request-approval", payload: {}, as: Leaseholder, as_user_id: "${lh_id}" }
            - { call: "POST /listings/${listing_id}/approve", payload: {}, as: Landlord, as_user_id: "${ll_id}", captures: { listing_v: $.data.version } }
            - { call: "POST /applications", payload: { listing_id: "${listing_id}", applicant_id: "${ap_id}", proposed_move_in_date: "2026-07-01", proposed_move_out_date: "2026-09-30" }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/start-screening", payload: {}, as: ComplianceOfficer }
            - { call: "POST /applications/${app_id}/screening-report", payload: { credit_score: 760, income_verified: true }, as: ComplianceOfficer }
            - { call: "POST /applications/${app_id}/match", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /agreements", payload: { application_id: "${app_id}", expected_listing_version: "${listing_v}", occupancy_start_date: "2026-07-01", occupancy_end_date: "2026-09-30" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { agr_id: $.data.id } }
            - { call: "GET /settlements", payload: { agreement_id: "${agr_id}" }, as: Leaseholder, captures: { sett_id: "$.data[0].id" } }
          assert:
            - "Settlement.${sett_id}.deposit_amount_cents == 800000"
            - "Settlement.${sett_id}.last_month_rent_cents == 400000"
            - "Settlement.${sett_id}.platform_fee_cents == 64000"
            - "Settlement.${sett_id}.total_move_in_cents == 1664000"

      - name: platform_fee_round_each_term_then_sum
        grounds:
          - calculations.platform_fee
          - entities.Settlement.fields.platform_fee_cents
        distinguishing_aspect: "Mode (b): rounding order pinned. prorated 300005 -> round(30000.5)=30001; deposit 500050 -> round(15001.5)=15002; per-term sum 45003. Sum-then-round would give round(45002.0)=45002; the pinned per-term order yields 45003."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Verified lease (rent 300005, deposit 500050, allows_sublet). SUBLET listing asking 300005 OPEN. Applicant matched, full-month occupancy 2026-06-01..2026-08-31 so prorated equals asking 300005. Agreement drafted (auto Settlement)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /applicants", payload: { name: "AP", email: "ap@x.com", annual_income_cents: 30000000, monthly_debt_cents: 0, credit_score: 760 }, as: PlatformAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300005, security_deposit_cents: 500050, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_sublet: true }, as: Landlord, as_user_id: "${ll_id}", captures: { lease_id: $.data.id } }
            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /leases/${lease_id}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /listings", payload: { lease_id: "${lease_id}", listing_type: "SUBLET", asking_rent_cents: 300005, available_from: "2026-06-01", available_to: "2026-12-31", min_term_months: 2, screening_policy: "STANDARD" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { listing_id: $.data.id } }
            - { call: "POST /listings/${listing_id}/request-approval", payload: {}, as: Leaseholder, as_user_id: "${lh_id}" }
            - { call: "POST /listings/${listing_id}/approve", payload: {}, as: Landlord, as_user_id: "${ll_id}", captures: { listing_v: $.data.version } }
            - { call: "POST /applications", payload: { listing_id: "${listing_id}", applicant_id: "${ap_id}", proposed_move_in_date: "2026-06-01", proposed_move_out_date: "2026-08-31" }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/start-screening", payload: {}, as: ComplianceOfficer }
            - { call: "POST /applications/${app_id}/screening-report", payload: { credit_score: 760, income_verified: true }, as: ComplianceOfficer }
            - { call: "POST /applications/${app_id}/match", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /agreements", payload: { application_id: "${app_id}", expected_listing_version: "${listing_v}", occupancy_start_date: "2026-06-01", occupancy_end_date: "2026-08-31" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { agr_id: $.data.id } }
            - { call: "GET /settlements", payload: { agreement_id: "${agr_id}" }, as: Leaseholder, captures: { sett_id: "$.data[0].id" } }
          assert:
            - "Settlement.${sett_id}.prorated_first_rent_cents == 300005"
            - "Settlement.${sett_id}.deposit_amount_cents == 500050"
            - "Settlement.${sett_id}.platform_fee_cents == 45003"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: application_screening_revision_cycle
        grounds:
          - state_machines.Application.SCREENING_to_INFO_REQUESTED
          - state_machines.Application.INFO_REQUESTED_to_SCREENING
        distinguishing_aspect: "Application forms a cycle SCREENING<->INFO_REQUESTED: after resubmit-info it returns to SCREENING and can be sent to INFO_REQUESTED again (revisitable), unlike a linear pipeline."
        test_recipe:
          setup:
            - "Clock 2026-06-01. OPEN SUBLET listing; one application in SCREENING then INFO_REQUESTED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /applicants", payload: { name: "AP", email: "ap@x.com", annual_income_cents: 15000000, monthly_debt_cents: 0, credit_score: 720 }, as: PlatformAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300000, security_deposit_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_sublet: true }, as: Landlord, as_user_id: "${ll_id}", captures: { lease_id: $.data.id } }
            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /leases/${lease_id}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /listings", payload: { lease_id: "${lease_id}", listing_type: "SUBLET", asking_rent_cents: 300000, available_from: "2026-06-01", available_to: "2026-12-31", min_term_months: 2, screening_policy: "STANDARD" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { listing_id: $.data.id } }
            - { call: "POST /listings/${listing_id}/request-approval", payload: {}, as: Leaseholder, as_user_id: "${lh_id}" }
            - { call: "POST /listings/${listing_id}/approve", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /applications", payload: { listing_id: "${listing_id}", applicant_id: "${ap_id}", proposed_move_in_date: "2026-06-10", proposed_move_out_date: "2026-08-31" }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/start-screening", payload: {}, as: ComplianceOfficer }
            - { call: "POST /applications/${app_id}/request-info", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /applications/${app_id}/resubmit-info", payload: {}, as: Applicant, as_user_id: "${ap_id}", captures: { st_after_resubmit: $.data.status } }
            - { call: "POST /applications/${app_id}/request-info", payload: {}, as: ComplianceOfficer, captures: { st_second_loop: $.data.status } }
          assert:
            - "Application.${app_id}.status after resubmit-info == SCREENING"
            - "Application.${app_id}.status after the second request-info == INFO_REQUESTED"

      - name: dispute_branching_fork_resolution
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_APPLICANT
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_LEASEHOLDER
          - entities.Dispute.fields.outcome
        distinguishing_aspect: "Dispute UNDER_REVIEW forks to {RESOLVED_APPLICANT, RESOLVED_LEASEHOLDER, RESOLVED_SPLIT, DISMISSED} with divergent side-effects (RESOLVED_APPLICANT terminates the agreement + refunds; DISMISSED leaves it ACTIVE) — non-linear on Dispute, a different entity than Application."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Full flow to an ACTIVE agreement (funded 746000), a Dispute filed by applicant and moved UNDER_REVIEW."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /applicants", payload: { name: "AP", email: "ap@x.com", annual_income_cents: 15000000, monthly_debt_cents: 0, credit_score: 720 }, as: PlatformAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300000, security_deposit_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_sublet: true }, as: Landlord, as_user_id: "${ll_id}", captures: { lease_id: $.data.id } }
            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /leases/${lease_id}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /listings", payload: { lease_id: "${lease_id}", listing_type: "SUBLET", asking_rent_cents: 300000, available_from: "2026-06-01", available_to: "2026-12-31", min_term_months: 2, screening_policy: "STANDARD" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { listing_id: $.data.id } }
            - { call: "POST /listings/${listing_id}/request-approval", payload: {}, as: Leaseholder, as_user_id: "${lh_id}" }
            - { call: "POST /listings/${listing_id}/approve", payload: {}, as: Landlord, as_user_id: "${ll_id}", captures: { listing_v: $.data.version } }
