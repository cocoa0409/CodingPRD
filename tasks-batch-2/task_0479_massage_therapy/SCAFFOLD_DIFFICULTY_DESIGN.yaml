              payload: { full_name: "T5", license_number: "LMT-700001", license_expiry: "2027-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { t1: $.data.id }
            - call: "POST /practice/tables"
              payload: { label: "R7-A", room: "R7" }
              as: PracticeAdmin
              captures: { tbl: $.data.id, tbl_v: $.data.version }
            - call: "POST /practice/clients"
              payload: { full_name: "Client MEM", email: "mem@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2026-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk: $.data.id }
            - call: "POST /practice/intakes/${itk}/sign"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/consent-records"
              payload: { client_id: "${cli}", draping_policy: "FULL_DRAPE" }
              as: FrontDesk
              captures: { con: $.data.id }
            - call: "POST /practice/plans"
              payload: { name: "Plan1", monthly_fee_cents: 9000, included_sessions: 1, member_discount_pct: 0.20, rollover_cap_sessions: 1 }
              as: PracticeAdmin
              captures: { plan: $.data.id }
            - call: "POST /practice/packages"
              payload: { client_id: "${cli}", plan_id: "${plan}", cycle_anchor_day: 1 }
              as: FrontDesk
              captures: { pkg: $.data.id }
            # complete + price the membership appointment so the credit is REDEEMED (balance 0), still SCHEDULED is impossible after complete;
            # so we build a SCHEDULED membership appointment WITHOUT pricing -> credit not yet debited (balance 1).
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t1}", table_id: "${tbl}", modality_id: "${mod_sw}", consent_id: "${con}", package_id: "${pkg}", start_at: "2026-03-02T10:00:00Z", duration_minutes: 60, payer: "MEMBERSHIP", expected_table_version: "${tbl_v}" }
              as: FrontDesk
              captures: { ap: $.data.id }
          trigger:
            - call: "POST /practice/consent-records/${con}/revoke"
              payload: {}
              as: Client
              as_user_id: "${cli}"
          assert:
            - "ConsentRecord.${con}.consent_status == REVOKED"
            - "Appointment.${ap}.scheduling_status == CANCELLED"
            - "Appointment.${ap}.cancel_reason == CONSENT_REVOKED"
            - "Package.${pkg}.credit_balance_sessions == 1"

      - name: void_priced_membership_cascade_depth3
        grounds:
          - state_machines.Appointment.PRICED_to_VOID
          - calculations.package_rollover
          - entities.CreditLedgerEntry.fields.balance_after
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (VOID): void a PRICED membership appointment (A) -> the
          redeemed credit is refunded, writing CreditLedgerEntry(REFUND) (B, caused by A) -> Package.credit_balance_sessions
          recomputes and the latest ledger balance_after updates to match (C, caused by B). Different
          origin transition than the consent-revoke cascade.
        test_recipe:
          setup:
            - "A MEMBERSHIP appointment completed and PRICED (credit redeemed, balance 0 of 1), then voided by admin."
          setup_api_calls:
