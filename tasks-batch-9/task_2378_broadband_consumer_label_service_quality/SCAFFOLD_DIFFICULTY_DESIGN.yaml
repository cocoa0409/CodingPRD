      - name: void_credit_restores_account_ledger_invariant
        grounds:
          - state_machines.RemediationCredit.ISSUED_to_VOIDED
          - entities.SubscriberAccount.fields.credit_balance_cents
          - entities.SubscriberAccount.fields.remediation_count
          - endpoints.POST_remediation_credits_id_void
