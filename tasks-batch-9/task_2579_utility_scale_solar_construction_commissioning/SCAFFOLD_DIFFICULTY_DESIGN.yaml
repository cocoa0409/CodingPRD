              payload: { actual_embedment_mm: 3050, plumb_deviation_mm: 6.0, blow_count: 45, refusal: false }
              as: InstallationForeman
            - call: "POST /solar/blocks/${blk}/mechanical-completion"
              payload: { modules_installed_qty: 50, max_torque_tube_deviation_mm: 18.0 }
              as: InstallationForeman
            - call: "POST /solar/blocks/${blk}/string-circuits"
              payload: { circuit_code: "C1", modules_in_series: 15 }
              as: InstallationForeman
              captures: { cir: $.data.id }
            - call: "POST /solar/string-circuits/${cir}/wiring"
              payload: { combiner_position: "CB1-01" }
              as: InstallationForeman
            - call: "POST /solar/string-circuits/${cir}/test-results"
              payload: { insulation_resistance_mohm: 55.0, measured_voc_v: 705.00, ambient_c: 40, polarity_ok: true }
              as: InstallationForeman
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: CommissioningEngineer
              captures: { pv: $.data.version }
            - call: "POST /solar/commissioning-tests"
              payload: { project_id: "${proj}", test_type: "CAPACITY", correction_variant: "AS_MEASURED", scheduled_at: "2026-08-12T15:00:00Z", expected_project_version: "${pv}" }
              as: CommissioningEngineer
              captures: { test: $.data.id }
          trigger:
            - call: "POST /solar/piles/${p3}/drive-results"
              payload: { actual_embedment_mm: 2600, plumb_deviation_mm: 3.0, blow_count: 120, refusal: true }
              as: InstallationForeman
              captures: { pst: $.data.status, rf: $.data.refusal_flag }
          assert:
            - "hop 1 — ${pst} == REFUSED and ${rf} == true (2600 mm is below the 2700 mm refusal floor of 0.90 x 3000)"
            - "hop 2 — Block.${blk}.mechanical_status == HOLD, electrical_status still TESTED, mc_ready == false, piles_refused_count == 1, piles_accepted_count == 2"
            - "hop 3 — Project.${proj}.mc_readiness == BLOCKED and blocks_mc_ready_count == 0"
            - "hop 4 — CommissioningTest.${test}.status == SUSPENDED with suspend_reason == MC_READINESS_LOST"
            - "Project.${proj}.milestone_state == PRECONSTRUCTION and last_milestone_rejection_reason == null — no claim was outstanding, so the milestone hop does not fire"
            - "a follow-up POST /solar/piles/${p3}/remediations with actual_embedment_mm 2800 and plumb_deviation_mm 8.0 sets Pile.${p3}.status == ACCEPTED, returns Block.${blk}.mechanical_status to PILES_COMPLETE and leaves Project.${proj}.mc_readiness == BLOCKED (mc_ready needs MECH_COMPLETE again)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: payroll_week_lock_outranks_below_prevailing_wage
        grounds:
          - validations[priority=8]
          - validations[priority=28]
          - state_machines.PayrollWeek.OPEN_to_CERTIFIED
          - entities.Project.fields.prevailing_wage_election
        distinguishing_aspect: |
          The conflicting pair is state (priority 8, ERR_PAYROLL_WEEK_LOCKED,
          409) versus business_fiscal (priority 28, ERR_BELOW_PREVAILING_WAGE,
          422): one request violates both and the state error must win, while the
          identical payload against an OPEN week proves the fiscal rule is live.
        test_recipe:
          setup:
            - "One project with prevailing_wage_election STRICT"
            - "Payroll week A (2026-08-03) holds one compliant POSTED entry and has been CERTIFIED by user LCO-2 (poster was LCO-9, so segregation of duties was satisfied)"
            - "Payroll week B (2026-08-10) is OPEN and empty"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Basin Mesa", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69, prevailing_wage_election: "STRICT" }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/payroll-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { wk_a: $.data.id }
            - call: "POST /solar/payroll-weeks/${wk_a}/labor-entries"
              payload: { worker_ref: "W-301", classification: "ELECTRICIAN", is_apprentice: false, hours: 8.00, paid_rate_cents: 4500, fringe_rate_cents: 500, prevailing_rate_cents: 5000, work_date: "2026-08-03" }
              as: LaborComplianceOfficer
              as_user_id: "LCO-9"
            - call: "POST /solar/payroll-weeks/${wk_a}/certification"
              payload: { note: "week closed" }
              as: LaborComplianceOfficer
              as_user_id: "LCO-2"
            - call: "POST /solar/projects/${proj}/payroll-weeks"
              payload: { week_start_date: "2026-08-10" }
              as: LaborComplianceOfficer
              captures: { wk_b: $.data.id }
          trigger:
            - call: "POST /solar/payroll-weeks/${wk_a}/labor-entries"
              payload: { worker_ref: "W-302", classification: "ELECTRICIAN", is_apprentice: false, hours: 6.00, paid_rate_cents: 4000, fringe_rate_cents: 500, prevailing_rate_cents: 5000, work_date: "2026-08-04" }
              as: LaborComplianceOfficer
              as_user_id: "LCO-9"
            - call: "POST /solar/payroll-weeks/${wk_b}/labor-entries"
              payload: { worker_ref: "W-302", classification: "ELECTRICIAN", is_apprentice: false, hours: 6.00, paid_rate_cents: 4000, fringe_rate_cents: 500, prevailing_rate_cents: 5000, work_date: "2026-08-10" }
              as: LaborComplianceOfficer
              as_user_id: "LCO-9"
          assert:
            - "the week-A post returns 409 with error_id == ERR_PAYROLL_WEEK_LOCKED, NOT 422 ERR_BELOW_PREVAILING_WAGE, even though paid 4000 + fringe 500 is 500 cents/hour under the 5000 determination"
            - "the week-B post returns 422 with error_id == ERR_BELOW_PREVAILING_WAGE"
            - "PayrollWeek.${wk_a}.entry_count == 1 and total_hours == 8.00 — the rejected post left no trace"
            - "PayrollWeek.${wk_b}.entry_count == 0 and total_hours == 0"
            - "Project.${proj}.wage_restitution_owed_cents == 0 — a STRICT project never accrues restitution"

      - name: rain_blackout_outranks_earthwork_window_conflict
        grounds:
          - validations[priority=12]
          - validations[priority=14]
          - calculations.earthwork_window_conflict_check
          - entities.GradingArea.fields.rain_blackout_until
        distinguishing_aspect: |
          A different error-category pair: business_safety (priority 12,
          ERR_RAIN_EVENT_BLACKOUT, 422) versus business_temporal (priority 14,
          ERR_EARTHWORK_WINDOW_CONFLICT, 409). One request sits inside the
          post-rain blackout AND collides with an existing window, and the safety
          error must win; a second request outside the blackout but still
          colliding proves the temporal rule is live.
        test_recipe:
          setup:
            - "One grading area with disturbed_acreage_limit 40.00 and bmp_inspection_interval_days 14, created at clock 2026-08-01T00:00:00Z"
            - "Three logged earthwork windows: 2026-08-05 08:00-16:00Z, 2026-08-06 08:00-16:00Z and 2026-08-08 08:00-16:00Z (5.00 acres each, 15.00 acres disturbed)"
            - "A RAIN_EVENT of 0.50 inches at 2026-08-05T18:00:00Z, so rain_blackout_until == 2026-08-07T18:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CivilSuperintendent
            - call: "POST /solar/projects"
              payload: { name: "Pinto Flat", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/grading-areas"
              payload: { area_code: "A1", permit_number: "CGP-2026-118", disturbed_acreage_limit: 40.00, bmp_inspection_interval_days: 14 }
              as: CivilSuperintendent
              captures: { ga: $.data.id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "CLEARING", work_start_at: "2026-08-05T08:00:00Z", work_end_at: "2026-08-05T16:00:00Z", acreage_disturbed_delta: 5.00 }
              as: CivilSuperintendent
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "GRADING", work_start_at: "2026-08-06T08:00:00Z", work_end_at: "2026-08-06T16:00:00Z", acreage_disturbed_delta: 5.00 }
              as: CivilSuperintendent
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "DRAINAGE", work_start_at: "2026-08-08T08:00:00Z", work_end_at: "2026-08-08T16:00:00Z", acreage_disturbed_delta: 5.00 }
              as: CivilSuperintendent
            - call: "POST /solar/grading-areas/${ga}/site-events"
              payload: { event_type: "RAIN_EVENT", occurred_at: "2026-08-05T18:00:00Z", rainfall_inches: 0.50, note: "monsoon cell" }
              as: CivilSuperintendent
          trigger:
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "GRADING", work_start_at: "2026-08-06T12:00:00Z", work_end_at: "2026-08-06T20:00:00Z", acreage_disturbed_delta: 3.00 }
              as: CivilSuperintendent
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "DRAINAGE", work_start_at: "2026-08-08T12:00:00Z", work_end_at: "2026-08-08T20:00:00Z", acreage_disturbed_delta: 3.00 }
              as: CivilSuperintendent
          assert:
            - "the 2026-08-06 request returns 422 with error_id == ERR_RAIN_EVENT_BLACKOUT, NOT 409 ERR_EARTHWORK_WINDOW_CONFLICT, although it also overlaps the 08:00-16:00Z window of that day"
            - "the 2026-08-08 request returns 409 with error_id == ERR_EARTHWORK_WINDOW_CONFLICT — it starts after rain_blackout_until (2026-08-07T18:00:00Z) but still collides"
            - "GradingArea.${ga}.rain_blackout_until == 2026-08-07T18:00:00Z"
            - "GradingArea.${ga}.disturbed_acreage_current == 15.00 and earthwork_windows has exactly 3 entries — neither rejected request appended anything"
            - "GradingArea.${ga}.status == GRADED (the DRAINAGE log left the civil status untouched)"

  - rule_id: boundary_precision_check
    instances:
      - name: apprentice_percentage_qualifies_exactly_at_fifteen_percent
        grounds:
          - calculations.apprenticeship_compliance
          - entities.Project.fields.apprenticeship_min_pct
          - entities.Project.fields.tax_credit_status
          - entities.PayrollWeek.fields.apprentice_pct
        distinguishing_aspect: |
          The boundary metric is the apprentice labor-hour PERCENTAGE at its
          inclusive endpoint on POST /solar/projects/{project_id}/labor-compliance-runs:
          15.00 exactly qualifies (>=) and 14.90 does not, with the percentage
          rounded to 2 decimals before the comparison.
        test_recipe:
          setup:
            - "One project with apprenticeship_min_pct 15.00, basis PROJECT_AGGREGATE and prevailing_wage_election REMEDIABLE"
            - "One OPEN payroll week 2026-08-03 with a 15.00-hour apprentice entry and an 85.00-hour journeyworker entry, all paid at the determination"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Cinder Cone", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69, prevailing_wage_election: "REMEDIABLE", apprenticeship_basis: "PROJECT_AGGREGATE", apprenticeship_min_pct: 15.00 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/payroll-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { wk: $.data.id }
            - call: "POST /solar/payroll-weeks/${wk}/labor-entries"
              payload: { worker_ref: "W-401", classification: "ELECTRICIAN", is_apprentice: true, hours: 15.00, paid_rate_cents: 4500, fringe_rate_cents: 500, prevailing_rate_cents: 5000, work_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { le_appr: $.data.id }
            - call: "POST /solar/payroll-weeks/${wk}/labor-entries"
              payload: { worker_ref: "W-402", classification: "ELECTRICIAN", is_apprentice: false, hours: 85.00, paid_rate_cents: 4500, fringe_rate_cents: 500, prevailing_rate_cents: 5000, work_date: "2026-08-04" }
              as: LaborComplianceOfficer
          trigger:
            - call: "POST /solar/projects/${proj}/labor-compliance-runs"
              payload: {}
              as: LaborComplianceOfficer
              captures: { pct_at: $.data.apprentice_hours_pct, credit_at: $.data.tax_credit_status }
            - call: "POST /solar/labor-entries/${le_appr}/void"
              payload: { void_reason: "reclassified to journeyworker overtime" }
              as: LaborComplianceOfficer
            - call: "POST /solar/payroll-weeks/${wk}/labor-entries"
              payload: { worker_ref: "W-401", classification: "ELECTRICIAN", is_apprentice: true, hours: 14.90, paid_rate_cents: 4500, fringe_rate_cents: 500, prevailing_rate_cents: 5000, work_date: "2026-08-03" }
              as: LaborComplianceOfficer
            - call: "POST /solar/payroll-weeks/${wk}/labor-entries"
              payload: { worker_ref: "W-403", classification: "LABORER", is_apprentice: false, hours: 0.10, paid_rate_cents: 4500, fringe_rate_cents: 500, prevailing_rate_cents: 5000, work_date: "2026-08-05" }
              as: LaborComplianceOfficer
            - call: "POST /solar/projects/${proj}/labor-compliance-runs"
              payload: {}
              as: LaborComplianceOfficer
              captures: { pct_below: $.data.apprentice_hours_pct, credit_below: $.data.tax_credit_status }
          assert:
            - "${pct_at} == 15.00 and ${credit_at} == QUALIFIED (the comparison is >=, so the endpoint value qualifies)"
            - "${pct_below} == 14.90 and ${credit_below} == DISQUALIFIED"
            - "PayrollWeek.${wk}.total_hours == 100.00 in both states, apprentice_hours 15.00 then 14.90, apprentice_pct 15.00 then 14.90"
            - "Project.${proj}.wage_restitution_owed_cents == 0 in both runs, so only the apprenticeship endpoint moved tax_credit_status"
            - "LaborEntry.${le_appr}.status == VOIDED and restitution_cents == 0"

      - name: capacity_finalization_at_weather_filter_endpoints
        grounds:
          - calculations.capacity_test_result
          - entities.TestInterval.fields.is_valid
          - entities.CommissioningTest.fields.valid_interval_count
          - validations[priority=22]
        distinguishing_aspect: |
          A different metric at different endpoints: the weather-filter endpoints
          on POST /solar/commissioning-tests/{test_id}/finalization — irradiance
          exactly 600 W/m2, wind exactly 8.0 m/s and ambient exactly 45 C are all
          INSIDE the valid set (>=, <=, <=), so a test whose only samples sit just
          outside them has an empty valid set and is refused, while one endpoint
          sample makes the same finalization succeed.
        test_recipe:
          setup:
            - "One project with guaranteed_capacity_kw_ac 100 and an energized substation, logical clock at 2026-08-10T02:00:00Z"
            - "One IN_PROGRESS AS_MEASURED CAPACITY test holding two intervals, both invalid: one at 599 W/m2 and one at 8.1 m/s wind"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CommissioningEngineer
            - call: "POST /solar/projects"
              payload: { name: "Thistle Draw", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/substations"
              payload: { substation_code: "S1", interconnection_voltage_kv: 138.0, mv_collection_km: 12.5 }
              as: UtilityCoordinator
              captures: { sub: $.data.id }
            - call: "POST /solar/substations/${sub}/outage-windows"
              payload: { start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-10T04:00:00Z", purpose: "BACKFEED" }
              as: UtilityCoordinator
              captures: { ow: $.data.id }
            - call: "POST /solar/outage-windows/${ow}/utility-response"
              payload: { decision: "APPROVE", utility_reference: "SO-4471" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "STEEL_ERECTED", utility_witness_ref: "W-1" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "EQUIPMENT_SET", utility_witness_ref: "W-2" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "BACKFEED_REQUESTED", utility_witness_ref: "W-3" }
              as: UtilityCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-10T02:00:00Z" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "ENERGIZED", utility_witness_ref: "W-4" }
              as: UtilityCoordinator
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: CommissioningEngineer
              captures: { pv: $.data.version }
            - call: "POST /solar/commissioning-tests"
              payload: { project_id: "${proj}", test_type: "CAPACITY", correction_variant: "AS_MEASURED", scheduled_at: "2026-08-10T02:30:00Z", expected_project_version: "${pv}" }
              as: CommissioningEngineer
              captures: { test: $.data.id }
            - call: "POST /solar/commissioning-tests/${test}/intervals"
              payload: { sampled_at: "2026-08-10T02:35:00Z", irradiance_w_m2: 599, measured_kw_ac: 58.70, ambient_c: 30, wind_m_s: 3.0 }
              as: CommissioningEngineer
              captures: { iv1_valid: $.data.is_valid }
            - call: "POST /solar/commissioning-tests/${test}/intervals"
              payload: { sampled_at: "2026-08-10T02:40:00Z", irradiance_w_m2: 700, measured_kw_ac: 65.00, ambient_c: 30, wind_m_s: 8.1 }
              as: CommissioningEngineer
              captures: { iv2_valid: $.data.is_valid }
          trigger:
            - call: "POST /solar/commissioning-tests/${test}/finalization"
              payload: {}
              as: CommissioningEngineer
            - call: "POST /solar/commissioning-tests/${test}/intervals"
              payload: { sampled_at: "2026-08-10T02:45:00Z", irradiance_w_m2: 600, measured_kw_ac: 58.80, ambient_c: 45, wind_m_s: 8.0 }
              as: CommissioningEngineer
              captures: { iv3_valid: $.data.is_valid }
            - call: "POST /solar/commissioning-tests/${test}/finalization"
              payload: {}
              as: CommissioningEngineer
              captures: { rep: $.data.reported_kw_ac, st: $.data.status, vc: $.data.valid_interval_count, ic: $.data.interval_count }
          assert:
            - "${iv1_valid} == false (599 < 600) and ${iv2_valid} == false (8.1 > 8.0)"
            - "the first finalization returns 422 with error_id == ERR_NO_VALID_TEST_INTERVALS and leaves CommissioningTest.${test}.status == IN_PROGRESS"
            - "${iv3_valid} == true — 600 W/m2, 8.0 m/s and 45 C are all inside their inclusive endpoints"
            - "${vc} == 1 and ${ic} == 3"
            - "${rep} == 58.80 (the single valid sample) and ${st} == FAILED against pass_threshold_kw_ac == 98.00"

