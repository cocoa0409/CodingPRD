              as: Client
              as_user_id: "${c_id}"
              captures: { ls2_id: $.data.id }
          assert:
            - "response.status == 201"
            - "LiveSession.${ls2_id}.status == SCHEDULED"
      - name: therapist_double_book_buffer_adjacency_rejected
        grounds:
          - validations[priority=13]
          - entities.Therapist.fields.active_caseload
          - state_machines.LiveSession.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "Therapist-scoped interval semantics with a 15-min BUFFER across different matches: a session on a second client's match starting 10:10 (only 10 min after a 09:00-10:00 session on the first client) violates the buffer and is rejected ERR_THERAPIST_DOUBLE_BOOKED — buffered adjacency, unlike the match-scoped closed adjacency."
