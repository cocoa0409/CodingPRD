          Days are ingested out of chronological order (2026-08-05 first, then 2026-08-03) and the
          replay still orders by usage_date ASC with ingest_sequence only as the tie-break: the
          running total reaches 650.0 GB, which is STRICTLY above the 600.0 soft cap, so the account
