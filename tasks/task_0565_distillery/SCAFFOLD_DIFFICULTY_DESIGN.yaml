          - entities.LabelApplication.fields.status
          - validations[priority=7]
        distinguishing_aspect: "BottlingRun.SCHEDULED->BOTTLING depends on LabelApplication.status == APPROVED (pair BottlingRun->LabelApplication): SUBMITTED blocks, APPROVED permits."
        test_recipe:
          setup:
            - "A SCHEDULED run with an AGING barrel and a SUBMITTED (not yet APPROVED) label."
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CA-14", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
