      - name: batch_recipe_out_of_range_and_bad_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.BatchRecipe.fields.color
          - entities.BatchRecipe.fields.cullet_ratio_pct
          - validations.priority_4
          - errors.ERR_VALIDATION
        distinguishing_aspect: |
          Field-level type checks return 400 ERR_VALIDATION - an unknown colour BLUE and a
          cullet_ratio_pct of 95.01 above the declared 95.00 ceiling - and are distinct from the 422
          colour-purity rule at priority 24, which only fires for in-range values.
        test_recipe:
          setup:
            - "Furnace FUR-E10 exists"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-E10", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
          trigger:
            - call: "POST /glass-plant/batch-recipes"
              payload: { furnace_id: "${f}", code: "BR-E10A", color: "BLUE", cullet_ratio_pct: 40.00, soda_ash_kg_per_ton: 180.00, colorant_kg_per_ton: 0.00 }
              as: BatchHouseTech
          assert:
            - "HTTP 400 and data.error_id == ERR_VALIDATION"
            - "a create with color AMBER and cullet_ratio_pct 95.01 also returns 400 ERR_VALIDATION (above the declared 95.00 range), not 422"
            - "a create with color AMBER and cullet_ratio_pct 95.00 returns 201 with cullet_stress_factor == 0.5000"
            - "GET /glass-plant/furnaces/${f}/batch-recipes reports total_count == 1 (only the accepted recipe persisted)"

      - name: campaign_create_with_unknown_furnace_rejected
        claim_type: parent_relationships
        grounds:
          - entities.Campaign.fields.furnace_id
          - validations.priority_6
          - errors.ERR_FURNACE_NOT_FOUND
        distinguishing_aspect: |
          A body foreign key that does not resolve returns 404 ERR_FURNACE_NOT_FOUND before any
          business rule runs, so the deliberately illegal target_pull_tpd of 900.00 never reaches the
          422 check at priority 46.
        test_recipe:
          setup:
            - "Furnace FUR-E11 exists but is not the furnace referenced by the create"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-E11", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
          trigger:
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "00000000-0000-4000-8000-000000000000", code: "CMP-E11", target_pull_tpd: 900.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
          assert:
            - "HTTP 404 and data.error_id == ERR_FURNACE_NOT_FOUND"
            - "the response is NOT 422 ERR_TARGET_PULL_EXCEEDS_DESIGN"
            - "Furnace.${f}.campaign_count == 0 and Furnace.${f}.version == 1"
            - "GET /glass-plant/furnaces/${f}/campaigns reports total_count == 0"

      - name: job_create_with_machine_from_another_furnace_rejected
        claim_type: cross_reference_integrity
        grounds:
