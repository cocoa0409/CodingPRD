              as: LabTechnician
              captures: { unit_status: $.data.status }
            - call: "GET /blood-bank/deferrals?donor_id=${donor_id}"
              payload: {}
              as: IntakeNurse
              captures: { defcat: "$.data[0].category" }
          assert:
            - "Donation.${don_id}.status == DISCARDED (hop1)"
            - "BloodUnit.${unit_id}.status == DISCARDED (hop2)"
            - "Donor.${donor_id}.eligibility_status == PERM_DEFERRED (hop3)"
            - "A Deferral exists for the donor with category == INFECTIOUS_RISK and kind == PERMANENT (hop3)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: checkin_state_before_eligibility
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_APPOINTMENT_NOT_SCHEDULED]
          - errors[ERR_DONOR_NOT_ELIGIBLE]
        distinguishing_aspect: >
          A check-in on an already-CANCELLED appointment of a DEFERRED donor
          violates both the state rule (priority 6, category state) and the
          eligibility rule (priority 7, category business_safety); the state
          error wins. Category pair = state vs business_safety.
        test_recipe:
          setup:
            - "Donor is TEMP_DEFERRED (manual deferral) AND the appointment is CANCELLED. A check-in violates both; expect the state error."
          setup_api_calls:
            - call: "POST /blood-bank/centers"
