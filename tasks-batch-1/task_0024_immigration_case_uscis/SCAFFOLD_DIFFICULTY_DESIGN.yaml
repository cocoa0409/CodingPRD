              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-485" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { officer_id: $.data.assigned_officer_id }
            - call: "POST /uscis/cases/${case_id}/biometrics"
              payload: { scheduled_at: "2026-06-25T15:00:00Z", asc_location_code: "ASC-SF-02" }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { biom_id: $.data.id }
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-26T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /uscis/biometrics/${biom_id}/complete"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
          assert:
            - "BiometricsAppointment.${biom_id}.status == 'COMPLETED'"
            - "Case.${case_id}.status == 'BIOMETRICS_COMPLETED'"
            - "CaseEvent count for ${case_id} where event_type=='BIOMETRICS_COMPLETED' == 1"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥ 2 instances, different category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_constraint_biometrics_on_i130_in_draft
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[id=ERR_INVALID_STATE]
          - errors[id=ERR_CASE_TYPE_NOT_APPLICABLE]
          - endpoints."POST /uscis/cases/{id}/biometrics"
        distinguishing_aspect: |
          One request violates BOTH (a) priority-7 'state - ERR_INVALID_STATE' (case is in DRAFT,
          but POST /uscis/cases/{id}/biometrics requires Case.status == FILED) AND (b) priority-9
          'business_constraint - ERR_CASE_TYPE_NOT_APPLICABLE' (the case_type is I-130, but
          biometrics applies only to {I-485, I-765, I-131}). The two checks SIMULTANEOUSLY have
          their conditions true; priority ordering yields ERR_INVALID_STATE (priority 7) before
          ERR_CASE_TYPE_NOT_APPLICABLE (priority 9). Category pair: (state, business_constraint).
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z; one I-130 case exists in DRAFT (never filed). Applicant exists."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A888888881", full_name: "H Pair", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "h1@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-130", preference_category: "IR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /uscis/cases/${case_id}/biometrics"
              payload: { scheduled_at: "2026-07-25T15:00:00Z", asc_location_code: "ASC-SF-99" }
              as: Officer
              as_user_id: "officer-pair-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == 'ERR_INVALID_STATE'"
            - "response.error_id != 'ERR_CASE_TYPE_NOT_APPLICABLE'"
            - "Case.${case_id}.status == 'DRAFT'"

      - name: existence_beats_business_referential_decide_unknown_case_with_wrong_owner_intent
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[id=ERR_NOT_FOUND]
          - errors[id=ERR_OWNERSHIP_VIOLATION]
        distinguishing_aspect: |
          Different category pair from instance #1. One request violates BOTH (a) priority-4
          'existence - ERR_NOT_FOUND' (the case id in the path does NOT exist) AND (b)
          priority-6 'business_referential - ERR_OWNERSHIP_VIOLATION' (the acting Applicant
          is not even the owner — they couldn't be, since the case doesn't exist; the role
          alone presupposes ownership of SOME case). Priority ordering: existence fires first
          (ERR_NOT_FOUND, 404), not ownership (403). Category pair: (existence, business_referential).
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z; one Applicant exists who is NOT linked to the non-existent case id under test."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A888888882", full_name: "I Pair2", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "i@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "GET /uscis/cases/00000000-0000-0000-0000-000000000999"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == 'ERR_NOT_FOUND'"
            - "response.error_id != 'ERR_OWNERSHIP_VIOLATION'"
            - "response.http_status == 404"

  # =========================================================================
  # Rule 6 — boundary_precision_check (≥ 2 instances, different metrics + endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: visa_priority_date_strictly_less_than_cutoff_metric_numeric
        grounds:
          - calculations.visa_availability
          - validations[priority=11]
          - errors[id=ERR_VISA_RETROGRESSED]
          - endpoints."POST /uscis/cases/{id}/interviews"
        distinguishing_aspect: |
          Numeric-date metric: visa CURRENT iff priority_date STRICTLY less than cutoff_date.
          Tested at exact equality: priority_date == cutoff_date == 2026-06-15 -> RETROGRESSED
          (interview scheduling rejected with ERR_VISA_RETROGRESSED). Single value change
          to priority_date 2026-06-14 (one day earlier) would flip to CURRENT. Reached via
          POST /uscis/cases/{id}/interviews.
        test_recipe:
          setup:
            - "I-485 case advanced to UNDER_REVIEW with priority_date stamped at 2026-06-15."
            - "VisaBulletinEntry for (F2A, WORLDWIDE, FINAL_ACTION, 2026-06) has cutoff_date=2026-06-15 (exact equality with priority_date)."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/visa-bulletin"
