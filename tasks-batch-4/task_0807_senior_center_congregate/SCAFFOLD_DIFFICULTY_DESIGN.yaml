      - name: bp_oaa_report_zero_units_no_division
        grounds:
          - calculations.oaa_units_report
          - endpoints[GET /reports/oaa-units]
        distinguishing_aspect: "Empty-collection boundary on GET /reports/oaa-units: with zero matching FundedService rows, total_units == 0 and cost_per_unit_cents == 0 (guarded division), a different metric and endpoint than the meal-capacity threshold."
        test_recipe:
          setup:
            - "Empty database (no funded services in the TRANSPORTATION category)."
          setup_api_calls: []
          trigger:
            - call: "GET /reports/oaa-units"
              payload: { category: "TRANSPORTATION", from: "2026-03-01T00:00:00Z", to: "2026-03-31T23:59:59Z" }
              as: Auditor
          assert:
            - "response.data.total_units == 0"
            - "response.data.total_billable_cents == 0"
            - "response.data.cost_per_unit_cents == 0"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ce_transport_approve_requires_session_scheduled
        grounds:
          - state_machines.TransportationRequest.PENDING_to_APPROVED
          - state_machines.ActivitySession.SCHEDULED_to_CANCELLED
          - errors[ERR_SESSION_NOT_SCHEDULED]
        distinguishing_aspect: "TransportationRequest.approve depends on the linked ActivitySession's state: once the session is CANCELLED, approving the still-PENDING request returns ERR_SESSION_NOT_SCHEDULED (TransportationRequest->ActivitySession pair)."
        test_recipe:
          setup:
            - "Participant, room, vehicle, a SCHEDULED session, and a PENDING transportation request linked to it; then the session is CANCELLED."
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "CE1", birth_date: "1947-06-06T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "AT_OR_ABOVE", lives_alone: true, rural: true, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /rooms"
              payload: { name: "Studio B", capacity: 15 }
              as: CenterAdmin
              captures: { room: "$.data.id" }
            - call: "POST /vehicles"
              payload: { name: "Van 1", seat_capacity: 8 }
              as: CenterAdmin
              captures: { veh: "$.data.id" }
            - call: "POST /activity-sessions"
              payload: { title: "Bingo", room_id: "${room}", starts_at: "2026-03-18T13:00:00Z", ends_at: "2026-03-18T15:00:00Z", capacity: 20 }
              as: Coordinator
              captures: { sess: "$.data.id" }
            - call: "POST /transportation-requests"
              payload: { participant_id: "${p}", vehicle_id: "${veh}", linked_session_id: "${sess}", starts_at: "2026-03-18T12:00:00Z", ends_at: "2026-03-18T12:45:00Z" }
              as: Coordinator
              captures: { tr: "$.data.id" }
            - call: "POST /activity-sessions/${sess}/cancel"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /transportation-requests/${tr}/approve"
              payload: {}
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SESSION_NOT_SCHEDULED"
      - name: ce_funded_service_requires_grant_active
        grounds:
          - validations[priority=5]
          - errors[ERR_GRANT_NOT_ACTIVE]
          - concurrency_rules[funded-service-create-stale-grant]
        distinguishing_aspect: "FundedService creation depends on GrantAward.status: against a DRAFT (never-activated) grant the create returns ERR_GRANT_NOT_ACTIVE (FundedService->GrantAward pair, distinct from Transport->Session)."
        test_recipe:
          setup:
            - "Participant and a DRAFT grant (not activated)."
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "CE2", birth_date: "1946-07-07T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "ASIAN", poverty_status: "BELOW", lives_alone: false, rural: false, veteran: true }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /grant-awards"
              payload: { title: "Title IIIC1", oaa_title: "IIIC1", category: "CONGREGATE_MEAL", authorized_cents: 3000 }
              as: CenterAdmin
              captures: { g: "$.data.id", g_v: "$.data.version" }
          trigger:
            - call: "POST /funded-services"
              payload: { participant_id: "${p}", category: "CONGREGATE_MEAL", quantity: 1, service_date: "2026-03-02T00:00:00Z", grant_award_id: "${g}", expected_grant_award_version: "${g_v}" }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_GRANT_NOT_ACTIVE"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rt_room_half_open_adjacency_allowed
        grounds:
          - validations[priority=7]
          - errors[ERR_ROOM_DOUBLE_BOOKED]
          - entities.ActivitySession.fields.room_id
        distinguishing_aspect: "Room uses half-open [start,end) semantics with ZERO buffer: a back-to-back session [11:00,12:00) after [10:00,11:00) is accepted, but an interior overlap [10:30,11:30) is rejected with ERR_ROOM_DOUBLE_BOOKED."
        test_recipe:
          setup:
            - "One room with a session [10:00,11:00) and an adjacent session [11:00,12:00) both SCHEDULED; a third session [10:30,11:30) is attempted."
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Studio C", capacity: 30 }
              as: CenterAdmin
              captures: { room: "$.data.id" }
            - call: "POST /activity-sessions"
              payload: { title: "Yoga", room_id: "${room}", starts_at: "2026-03-11T10:00:00Z", ends_at: "2026-03-11T11:00:00Z", capacity: 10 }
              as: Coordinator
              captures: { s1: "$.data.id" }
            - call: "POST /activity-sessions"
              payload: { title: "Chair Aerobics", room_id: "${room}", starts_at: "2026-03-11T11:00:00Z", ends_at: "2026-03-11T12:00:00Z", capacity: 10 }
              as: Coordinator
              captures: { s2: "$.data.id" }
          trigger:
            - call: "POST /activity-sessions"
              payload: { title: "Overlap", room_id: "${room}", starts_at: "2026-03-11T10:30:00Z", ends_at: "2026-03-11T11:30:00Z", capacity: 10 }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ROOM_DOUBLE_BOOKED"
      - name: rt_vehicle_buffered_turnaround
        grounds:
          - validations[priority=7]
          - errors[ERR_VEHICLE_UNAVAILABLE]
          - entities.TransportationRequest.fields.vehicle_id
        distinguishing_aspect: "Vehicle uses a 15-minute turnaround BUFFER: a second trip [10:40,11:00] only 10 minutes after a [10:00,10:30] trip is rejected with ERR_VEHICLE_UNAVAILABLE even though the raw windows do not overlap, unlike the zero-buffer room rule."
        test_recipe:
          setup:
            - "One vehicle with a trip [10:00,10:30] on it, and a linked SCHEDULED session covering the window."
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "RV1", birth_date: "1945-08-08T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "AT_OR_ABOVE", lives_alone: true, rural: true, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /rooms"
              payload: { name: "Studio D", capacity: 30 }
              as: CenterAdmin
              captures: { room: "$.data.id" }
            - call: "POST /vehicles"
              payload: { name: "Van 2", seat_capacity: 6 }
              as: CenterAdmin
              captures: { veh: "$.data.id" }
            - call: "POST /activity-sessions"
              payload: { title: "Lunch Outing", room_id: "${room}", starts_at: "2026-03-14T09:00:00Z", ends_at: "2026-03-14T12:00:00Z", capacity: 20 }
              as: Coordinator
              captures: { sess: "$.data.id" }
            - call: "POST /transportation-requests"
              payload: { participant_id: "${p}", vehicle_id: "${veh}", linked_session_id: "${sess}", starts_at: "2026-03-14T10:00:00Z", ends_at: "2026-03-14T10:30:00Z" }
              as: Coordinator
              captures: { t1: "$.data.id" }
          trigger:
            - call: "POST /transportation-requests"
              payload: { participant_id: "${p}", vehicle_id: "${veh}", linked_session_id: "${sess}", starts_at: "2026-03-14T10:40:00Z", ends_at: "2026-03-14T11:00:00Z" }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_VEHICLE_UNAVAILABLE"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_grant_funds_conservation
        grounds:
          - state_machines.FundedService.APPLIED_to_REVERSED
          - entities.GrantAward.fields.committed_cents
          - entities.GrantAward.fields.available_cents
        distinguishing_aspect: "Conserved quantity = grant money: authorized_cents == committed_cents + available_cents == 2000 both after the apply (1500+500) and after the reverse (0+2000); the compensating reverse leaves the invariant unchanged."
        test_recipe:
          setup:
            - "ACTIVE WELLNESS grant authorized 2000c with one APPLIED FundedService funded 1500c (committed 1500, available 500)."
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "CI1", birth_date: "1944-09-09T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "BLACK", poverty_status: "BELOW", lives_alone: false, rural: false, veteran: true }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /grant-awards"
              payload: { title: "Title IIID", oaa_title: "IIID", category: "WELLNESS", authorized_cents: 2000 }
              as: CenterAdmin
              captures: { g: "$.data.id" }
            - call: "POST /grant-awards/${g}/activate"
              payload: {}
              as: CenterAdmin
              captures: { g_v: "$.data.version" }
            - call: "POST /funded-services"
              payload: { participant_id: "${p}", category: "WELLNESS", quantity: 1, service_date: "2026-03-02T00:00:00Z", grant_award_id: "${g}", expected_grant_award_version: "${g_v}" }
              as: Coordinator
              captures: { fs: "$.data.id" }
          trigger:
            - call: "POST /funded-services/${fs}/reverse"
              payload: {}
              as: Coordinator
          assert:
            - "FundedService.${fs}.status == REVERSED"
            - "GrantAward.${g}.committed_cents == 0"
            - "GrantAward.${g}.available_cents == 2000"
            - "GrantAward.${g}.authorized_cents == 2000"
      - name: ci_meal_seat_conservation
        grounds:
          - state_machines.MealReservation.CONFIRMED_to_CANCELLED
          - entities.MealServiceDay.fields.reserved_count
          - entities.MealServiceDay.fields.available_seats
        distinguishing_aspect: "Conserved quantity = meal seats: capacity == reserved_count + available_seats == 5 both after the reserve (1+4) and after the cancel (0+5); a different conserved quantity than grant money."
        test_recipe:
          setup:
            - "OPEN day capacity 5 with one CONFIRMED reservation (reserved_count 1, available_seats 4)."
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "CI2", birth_date: "1943-10-10T00:00:00Z", gender: "FEMALE", ethnicity: "HISPANIC", race: "MULTI", poverty_status: "DECLINED", lives_alone: true, rural: true, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /meal-service-days"
              payload: { service_date: "2026-03-25T12:00:00Z", site_name: "Main Hall", capacity: 5 }
              as: CenterAdmin
              captures: { sd: "$.data.id", sdv: "$.data.version" }
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p}", expected_service_day_version: "${sdv}" }
              as: Coordinator
              captures: { r: "$.data.id" }
          trigger:
            - call: "POST /meal-reservations/${r}/cancel"
              payload: {}
              as: Coordinator
          assert:
            - "MealReservation.${r}.status == CANCELLED"
            - "MealServiceDay.${sd}.reserved_count == 0"
            - "MealServiceDay.${sd}.available_seats == 5"
            - "MealServiceDay.${sd}.capacity == 5"
