            - "LabResult.${r_q2_id}.status == SUPERSEDED"
            - "LabResult.${r_q1_id}.status == ACCEPTED"
            - "EntryPoint.${ep_id}.accepted_result_count == 3"
            - "EntryPoint.${ep_id}.max_compliance_ratio == 0.7500"
            - "EntryPoint.${ep_id}.compliance_posture == TRIGGERED"
            - "EntryPoint.${ep_id}.consecutive_invalidated_samples == 1"
            - "EntryPoint.${ep_id}.monitoring_status == QUARTERLY"
            - "GET /treatment-evaluations?entry_point_id=${ep_id} still returns total_count 1 with mandated == true and status == SCREENING"
            - "Immediately before the trigger: EntryPoint.${ep_id}.accepted_result_count == 4, max_compliance_ratio == 1.1250, compliance_posture == VIOLATION_PENDING, consecutive_invalidated_samples == 0"

  # ===========================================================================
  # §0.5 rule 5 — priority_pair_validation_conflict
  # Instance (a) pits category state (20) against business_safety (60);
  # instance (b) pits business_safety (62) against business_fiscal (110).
  # Different category pairs, different endpoints, both with the LOWER-numbered
  # rule winning by design.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: suspended_monitoring_outranks_the_prohibited_sampling_kit_check
        grounds:
          - validations[priority=20]
          - validations[priority=60]
          - validations[priority=61]
          - errors.ERR_MONITORING_SUSPENDED
          - errors.ERR_PROHIBITED_SAMPLING_MATERIAL
          - state_machines.EntryPoint.any_state_to_SUSPENDED
        distinguishing_aspect: |
          The winning rule is a STATE rule (priority 20, ERR_MONITORING_SUSPENDED) and the losing rules
          are BUSINESS_SAFETY rules (priority 60 ERR_PROHIBITED_SAMPLING_MATERIAL and priority 61
          ERR_FIELD_BLANK_REQUIRED) on POST /samples: a suspended entry point refuses the collection
          before anyone inspects the kit. Three rules are violated by one request and the lowest
          priority number must be reported. Instance (b) uses a different pair of categories
          (business_safety over business_fiscal) on a different endpoint.
        test_recipe:
          setup:
            - "Contaminant PFOA: mcl 4.00, trigger 2.00, required_mrl 2.00."
            - "EntryPoint EPTDS-01, population 45000, then SUSPENDED by the UtilityAdmin, so monitoring_status is SUSPENDED and no sample has ever been collected."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00, hazard_index_member: false }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /entry-points/${ep_id}/monitoring-status"
              payload: { action: "SUSPEND", reason: "Wellhead rehabilitation." }
              as: UtilityAdmin
          trigger:
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: false, field_blank_included: false, preservative_lot: "LOT-BAD" }
              as: SamplingTechnician
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 422"
            - "error_id == ERR_MONITORING_SUSPENDED"
            - "error_id != ERR_PROHIBITED_SAMPLING_MATERIAL"
            - "error_id != ERR_FIELD_BLANK_REQUIRED"
            - "GET /samples?entry_point_id=${ep_id} returns total_count 0 — no Sample row was created"
            - "EntryPoint.${ep_id}.monitoring_status == SUSPENDED"
            - "EntryPoint.${ep_id}.accepted_result_count == 0"
            - "After POST /entry-points/${ep_id}/monitoring-status with action RESUME, the identical POST /samples body now reports ERR_PROHIBITED_SAMPLING_MATERIAL (priority 60), proving the priority-20 rule was masking it"

      - name: prohibited_disposal_route_outranks_the_exhausted_residuals_budget
        grounds:
          - validations[priority=62]
          - validations[priority=110]
          - errors.ERR_DISPOSAL_METHOD_PROHIBITED
          - errors.ERR_RESIDUALS_BUDGET_EXCEEDED
          - calculations.waste_classification
          - global_constants.PERMITTED_DISPOSAL_BY_CLASSIFICATION
          - global_constants.DISPOSAL_RATE_CENTS_PER_KG
          - state_machines.ResidualsManifest.CLASSIFIED_to_SHIPPED
        distinguishing_aspect: |
          Here the winner is a BUSINESS_SAFETY rule (priority 62, ERR_DISPOSAL_METHOD_PROHIBITED) and
          the loser is a BUSINESS_FISCAL rule (priority 110, ERR_RESIDUALS_BUDGET_EXCEEDED) on
          POST /residuals-manifests/{id}/ship. Both are violated by the same body: LANDFILL is not in
          PERMITTED_DISPOSAL_BY_CLASSIFICATION[HAZARDOUS], and 800.00 kg at the LANDFILL rate of 12
          cents/kg costs 9600 cents against a 0 cent residuals budget. The category pair and the
          endpoint are both different from instance (a), and neither of the two rules here belongs to
          the state category.
        test_recipe:
          setup:
            - "EntryPoint EPTDS-01, population 45000."
            - "A voluntary TreatmentEvaluation created with residuals_budget_cents 0, so residuals_spent_cents is 0 and any positive disposal cost breaches the budget."
            - "A GAC pilot started and completed with spent_media_kg 800.00, so unmanifested_media_kg is 800.00."
            - "A ResidualsManifest for the full 800.00 kg of GAC_CARBON, classified by the StateRegulator at leachate_pfas_ng_per_l 500.0, which is at the LEACHATE_HAZARDOUS_NG_PER_L boundary and therefore HAZARDOUS."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}", residuals_budget_cents: 0 }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 2550000000, capital_cost_estimate_cents: 680000000, annual_om_estimate_cents: 31000000, residuals_burden_score: 62.00, footprint_score: 71.00, om_complexity_score: 83.00 }
              as: TreatmentEngineer
              captures: { gac_id: "$.data.id" }
            - call: "POST /pilot-tests/${gac_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${gac_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 1.85, bed_volumes_treated: 25000, spent_media_kg: 800.00 }
              as: TreatmentEngineer
            - call: "POST /residuals-manifests"
              payload: { pilot_test_id: "${gac_id}", media_type: "GAC_CARBON", mass_kg: 800.00 }
              as: TreatmentEngineer
              captures: { man_id: "$.data.id" }
            - call: "POST /residuals-manifests/${man_id}/classify"
              payload: { leachate_pfas_ng_per_l: 500.0 }
              as: StateRegulator
          trigger:
            - call: "POST /residuals-manifests/${man_id}/ship"
              payload: { disposal_method: "LANDFILL", carrier_ref: "HAUL-0001" }
              as: TreatmentEngineer
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 422"
            - "error_id == ERR_DISPOSAL_METHOD_PROHIBITED"
            - "error_id != ERR_RESIDUALS_BUDGET_EXCEEDED"
            - "ResidualsManifest.${man_id}.waste_classification == HAZARDOUS"
            - "ResidualsManifest.${man_id}.status == CLASSIFIED"
            - "ResidualsManifest.${man_id}.disposal_method == null"
            - "ResidualsManifest.${man_id}.disposal_cost_cents == null"
            - "ResidualsManifest.${man_id}.carrier_ref == null"
            - "TreatmentEvaluation.${eval_id}.residuals_spent_cents == 0"
            - "PilotTest.${gac_id}.unmanifested_media_kg == 0.00"
            - "Re-shipping the same manifest with disposal_method INCINERATION_1100C (permitted for HAZARDOUS, 800.00 * 340 = 272000 cents) now reports ERR_RESIDUALS_BUDGET_EXCEEDED (priority 110), proving the priority-62 rule was masking it"

  # ===========================================================================
  # §0.5 rule 6 — boundary_precision_check
  # Instance (a) is a NUMERIC THRESHOLD (elapsed holding-time hours) on
  # POST /lab-results; instance (b) is an EMPTY-SET / ZERO-COUNT edge
  # (quarters_used) on POST /compliance-determinations/{id}/issue.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: holding_time_of_exactly_336_hours_is_accepted_and_337_hours_is_refused
        grounds:
          - validations[priority=80]
          - errors.ERR_HOLDING_TIME_EXCEEDED
          - global_constants.HOLDING_TIME_HOURS_BY_METHOD
          - calculations.sample_integrity_evaluation
          - entities.LabResult.fields.analyzed_at
        distinguishing_aspect: |
          A numeric threshold on a continuous metric: elapsed hours between Sample.collected_at and
          LabResult.analyzed_at against HOLDING_TIME_HOURS_BY_METHOD[METHOD_533] = 336. Exactly 336.0 h
          (2026-04-10T08:00:00.000Z -> 2026-04-24T08:00:00.000Z) is INSIDE the limit and 337.0 h
          (one hour later) is outside it, so the comparison must be `>` and not `>=`. The endpoint is
          POST /lab-results and the metric is a duration; instance (b) tests a cardinality of zero on a
          different endpoint, where no continuous quantity exists at all.
        test_recipe:
          setup:
            - "Contaminant PFOA: mcl 4.00, trigger 2.00, required_mrl 2.00."
            - "Laboratory certified for METHOD_533, lowest achievable detection limit 1.00, daily_analysis_capacity 5 (so the capacity rule at priority 94 cannot interfere)."
            - "EntryPoint EPTDS-01, population 45000."
            - "One 2026Q2 sample collected exactly at 2026-04-10T08:00:00.000Z, shipped and received clean, so it is RECEIVED and awaiting results."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00, hazard_index_member: false }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-04-10T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-HT" }
              as: SamplingTechnician
              captures: { s_id: "$.data.id" }
            - call: "POST /samples/${s_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
          trigger:
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-04-24T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { ok_result_id: "$.data.id" }
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-04-24T09:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "The first call returns HTTP 201"
            - "LabResult.${ok_result_id}.status == SUBMITTED"
            - "LabResult.${ok_result_id}.analyzed_at == \"2026-04-24T08:00:00.000Z\""
            - "LabResult.${ok_result_id}.censored == false"
            - "LabResult.${ok_result_id}.compliance_value_ng_per_l == 3.00"
            - "The second call returns HTTP 422"
            - "error_id == ERR_HOLDING_TIME_EXCEEDED"
            - "Sample.${s_id}.status == RECEIVED — neither call moved the sample, because no result has been accepted yet"
            - "GET /lab-results?sample_id=${s_id} returns total_count 1"

      - name: issuing_a_determination_built_from_zero_quarters_is_refused
        grounds:
          - validations[priority=97]
          - errors.ERR_NO_QUALIFYING_RESULTS
          - calculations.locational_running_annual_average
          - calculations.violation_determination
          - entities.ComplianceDetermination.fields.quarters_used
          - state_machines.ComplianceDetermination.DRAFT_to_ISSUED
          - concurrency_rules[entry-point-determination-supersede]
        distinguishing_aspect: |
          The boundary here is a CARDINALITY of zero, not a numeric threshold: an entry point with no
          ACCEPTED results at all still yields a creatable DRAFT determination whose lraa_ng_per_l is
          0.00 and quarters_used is 0, and the empty input set must NOT be read as a compliant average
          of zero — the issue endpoint refuses it with ERR_NO_QUALIFYING_RESULTS at priority 97. The
          metric (count of contributing periods), the endpoint and the failure mode all differ from
          instance (a); an implementation that only guards durations passes (a) and fails this one.
        test_recipe:
          setup:
            - "Contaminant PFOA: mcl 4.00, trigger 2.00, required_mrl 2.00."
            - "EntryPoint EPTDS-01, population 45000, with NO samples and NO lab results, so monitoring_status is still INITIAL, accepted_result_count is 0 and compliance_posture is COMPLIANT."
            - "The ComplianceOfficer reads the entry point's current version and creates a DRAFT determination for period_end 2026Q2."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00, hazard_index_member: false }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "GET /entry-points/${ep_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ep_v: "$.data.version" }
            - call: "POST /compliance-determinations"
              payload: { entry_point_id: "${ep_id}", contaminant_id: "${pfoa_id}", period_end: "2026Q2", expected_entry_point_version: "${ep_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { det_id: "$.data.id" }
          trigger:
            - call: "POST /compliance-determinations/${det_id}/issue"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 422"
            - "error_id == ERR_NO_QUALIFYING_RESULTS"
            - "ComplianceDetermination.${det_id}.quarters_used == 0"
            - "ComplianceDetermination.${det_id}.lraa_ng_per_l == 0.00"
            - "ComplianceDetermination.${det_id}.planning_lraa_ng_per_l == 0.00"
            - "ComplianceDetermination.${det_id}.hazard_index == 0.00"
            - "ComplianceDetermination.${det_id}.determination == NO_VIOLATION"
            - "ComplianceDetermination.${det_id}.violation_type == NONE"
            - "ComplianceDetermination.${det_id}.status == DRAFT"
            - "ComplianceDetermination.${det_id}.issued_at == null"
            - "GET /public-notifications?determination_id=${det_id} returns total_count 0"
            - "EntryPoint.${ep_id}.open_violation_count == 0"
            - "EntryPoint.${ep_id}.max_compliance_ratio == 0.0"
            - "EntryPoint.${ep_id}.monitoring_status == INITIAL"

  # ===========================================================================
  # §0.5 rule 7 — cross_entity_state_dependency
  # Instance (a) is the pair (LabResult -> Sample); instance (b) is the pair
  # (ResidualsManifest -> PilotTest). Different entity pairs, different
  # validation categories (state vs business_referential).
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: lab_result_creation_reads_the_parent_sample_state_not_its_own
        grounds:
          - validations[priority=34]
          - errors.ERR_SAMPLE_NOT_RECEIVED
          - state_machines.Sample.IN_TRANSIT_to_RECEIVED
          - entities.LabResult.parent
          - endpoints[POST /lab-results]
        distinguishing_aspect: |
          The subject entity does not exist yet, so the gate cannot be a self-state check: POST
          /lab-results is refused with ERR_SAMPLE_NOT_RECEIVED purely because the PARENT Sample is
          IN_TRANSIT, and the very same body succeeds the moment the laboratory records receipt. The
          dependency direction is child-creation-on-parent-state over the pair (LabResult, Sample), in
          the state category; instance (b) uses a different pair and a business_referential rule.
        test_recipe:
          setup:
            - "Contaminant PFOA: mcl 4.00, trigger 2.00, required_mrl 2.00."
            - "Laboratory certified for METHOD_533, lowest achievable detection limit 1.00, capacity 5."
            - "EntryPoint EPTDS-01, population 45000."
            - "One 2026Q2 sample collected 2026-05-15T08:00:00.000Z and shipped to that laboratory, so its status is IN_TRANSIT and received_at is null."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00, hazard_index_member: false }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-XE" }
              as: SamplingTechnician
              captures: { s_id: "$.data.id" }
            - call: "POST /samples/${s_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
          trigger:
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { result_id: "$.data.id" }
          assert:
            - "The first call returns HTTP 422 with error_id == ERR_SAMPLE_NOT_RECEIVED"
            - "After the first call, GET /lab-results?sample_id=${s_id} returns total_count 0"
            - "After the first call, Sample.${s_id}.status == IN_TRANSIT and Sample.${s_id}.received_at == null"
            - "The third call returns HTTP 201"
            - "LabResult.${result_id}.status == SUBMITTED"
            - "LabResult.${result_id}.sample_id == ${s_id}"
            - "LabResult.${result_id}.laboratory_id == ${lab_id}"
            - "Sample.${s_id}.status == RECEIVED"
            - "Sample.${s_id}.chain_of_custody_intact == true"
            - "GET /lab-results?sample_id=${s_id} returns total_count 1"

      - name: residuals_manifest_creation_reads_the_pilot_state_not_its_own
        grounds:
          - validations[priority=76]
          - errors.ERR_PILOT_NOT_COMPLETED
          - state_machines.PilotTest.RUNNING_to_COMPLETED
          - entities.ResidualsManifest.parent
          - entities.PilotTest.fields.unmanifested_media_kg
          - endpoints[POST /residuals-manifests]
        distinguishing_aspect: |
          A different entity pair (ResidualsManifest, PilotTest) and a different validation category:
          priority 76 is business_referential, and the state it reads is the pilot's, because
          spent_media_kg does not exist until the pilot is completed. The identical manifest body flips
          from ERR_PILOT_NOT_COMPLETED to a 201 the moment the pilot is completed, and the created
          manifest immediately reduces unmanifested_media_kg from 800.00 to 500.00. Nothing about a
          Sample or a LabResult is involved, so instance (a) cannot substitute for it.
        test_recipe:
          setup:
            - "EntryPoint EPTDS-01, population 45000, and a voluntary TreatmentEvaluation."
            - "A GAC pilot whose window is 2026-05-01 to 2026-05-15, started (RUNNING) but not completed, so spent_media_kg and unmanifested_media_kg are both null."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}" }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 2550000000, capital_cost_estimate_cents: 680000000, annual_om_estimate_cents: 31000000, residuals_burden_score: 62.00, footprint_score: 71.00, om_complexity_score: 83.00 }
              as: TreatmentEngineer
              captures: { gac_id: "$.data.id" }
            - call: "POST /pilot-tests/${gac_id}/start"
              payload: {}
              as: TreatmentEngineer
          trigger:
            - call: "POST /residuals-manifests"
              payload: { pilot_test_id: "${gac_id}", media_type: "GAC_CARBON", mass_kg: 300.00 }
              as: TreatmentEngineer
              captures: { err_id: "$.data.error_id" }
            - call: "POST /pilot-tests/${gac_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 1.85, bed_volumes_treated: 25000, spent_media_kg: 800.00 }
              as: TreatmentEngineer
            - call: "POST /residuals-manifests"
              payload: { pilot_test_id: "${gac_id}", media_type: "GAC_CARBON", mass_kg: 300.00 }
              as: TreatmentEngineer
              captures: { man_id: "$.data.id" }
          assert:
            - "The first call returns HTTP 422 with error_id == ERR_PILOT_NOT_COMPLETED"
            - "After the first call, GET /residuals-manifests?pilot_test_id=${gac_id} returns total_count 0"
            - "After the first call, PilotTest.${gac_id}.status == RUNNING and PilotTest.${gac_id}.spent_media_kg == null"
            - "The third call returns HTTP 201"
            - "ResidualsManifest.${man_id}.status == DRAFT"
            - "ResidualsManifest.${man_id}.mass_kg == 300.00"
            - "ResidualsManifest.${man_id}.waste_classification == null"
            - "PilotTest.${gac_id}.status == COMPLETED"
            - "PilotTest.${gac_id}.spent_media_kg == 800.00"
            - "PilotTest.${gac_id}.unmanifested_media_kg == 500.00"
            - "GET /residuals-manifests?pilot_test_id=${gac_id} returns total_count 1"

  # ===========================================================================
  # §0.5 rule 8 — resource_temporal_overlap
  # Instance (a) is PAIRWISE half-open interval overlap on the EntryPoint pilot
  # skid, widened by a decontamination buffer. Instance (b) is an AGGREGATE
  # count inside a UTC calendar-day bucket on a Laboratory. Different resource
  # entities, different interval semantics.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: pilot_windows_conflict_inside_the_decontamination_buffer_and_pass_at_exactly_48_hours
        grounds:
          - validations[priority=86]
          - errors.ERR_PILOT_WINDOW_CONFLICT
          - global_constants.PILOT_DECONTAMINATION_BUFFER_HOURS
          - entities.PilotTest.fields.window_start_at
          - entities.PilotTest.fields.window_end_at
          - endpoints[POST /pilot-tests]
        distinguishing_aspect: |
          Pairwise interval overlap on a single physical resource (the entry point's pilot skid), where
          each existing half-open window [start, end) is widened by
          PILOT_DECONTAMINATION_BUFFER_HOURS = 48 on BOTH sides before comparison. The GAC window
          [2026-05-01, 2026-05-15) therefore blocks a second window starting 2026-05-16 (a 24-hour gap)
          but not one starting 2026-05-17 (exactly 48 hours), so touching the widened boundary is legal
          and crossing it by one hour is not. This is a two-interval comparison; instance (b) counts
          rows in a bucket and never compares two intervals to each other.
        test_recipe:
          setup:
            - "EntryPoint EPTDS-01, population 45000, and a voluntary TreatmentEvaluation."
            - "One PLANNED GAC pilot occupying the half-open window [2026-05-01T00:00:00.000Z, 2026-05-15T00:00:00.000Z), which the 48-hour buffer widens to [2026-04-29T00:00:00.000Z, 2026-05-17T00:00:00.000Z)."
            - "The clock stays at its default 2026-08-01T00:00:00.000Z, so window comparisons are the only thing under test."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}" }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 2550000000, capital_cost_estimate_cents: 680000000, annual_om_estimate_cents: 31000000, residuals_burden_score: 62.00, footprint_score: 71.00, om_complexity_score: 83.00 }
              as: TreatmentEngineer
              captures: { gac_id: "$.data.id" }
          trigger:
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "IX", window_start_at: "2026-05-16T00:00:00.000Z", window_end_at: "2026-05-30T00:00:00.000Z", ebct_min: 3.00, lifecycle_cost_cents: 1800000000, capital_cost_estimate_cents: 900000000, annual_om_estimate_cents: 40000000, residuals_burden_score: 40.00, footprint_score: 85.00, om_complexity_score: 70.00 }
              as: TreatmentEngineer
              captures: { err_id: "$.data.error_id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "IX", window_start_at: "2026-05-17T00:00:00.000Z", window_end_at: "2026-05-31T00:00:00.000Z", ebct_min: 3.00, lifecycle_cost_cents: 1800000000, capital_cost_estimate_cents: 900000000, annual_om_estimate_cents: 40000000, residuals_burden_score: 40.00, footprint_score: 85.00, om_complexity_score: 70.00 }
              as: TreatmentEngineer
              captures: { ix_id: "$.data.id" }
          assert:
            - "The first call returns HTTP 422 with error_id == ERR_PILOT_WINDOW_CONFLICT"
            - "After the first call, GET /pilot-tests?treatment_evaluation_id=${eval_id} returns total_count 1"
            - "The second call returns HTTP 201"
            - "PilotTest.${ix_id}.status == PLANNED"
            - "PilotTest.${ix_id}.window_start_at == \"2026-05-17T00:00:00.000Z\""
            - "PilotTest.${ix_id}.window_end_at == \"2026-05-31T00:00:00.000Z\""
            - "PilotTest.${ix_id}.technology == IX"
            - "PilotTest.${gac_id}.status == PLANNED"
            - "PilotTest.${gac_id}.window_end_at == \"2026-05-15T00:00:00.000Z\""
            - "GET /pilot-tests?treatment_evaluation_id=${eval_id} returns total_count 2"

      - name: laboratory_capacity_counts_a_utc_calendar_day_bucket_rather_than_a_rolling_window
        grounds:
          - validations[priority=94]
          - errors.ERR_LAB_DAILY_CAPACITY_EXCEEDED
          - entities.Laboratory.fields.daily_analysis_capacity
          - entities.LabResult.fields.analyzed_at
          - endpoints[POST /lab-results]
        distinguishing_aspect: |
          An AGGREGATE cardinality inside a fixed UTC calendar-day bucket on a different resource
          entity (Laboratory, not EntryPoint): with daily_analysis_capacity 2, two results dated
          2026-04-20T01:00:00.000Z and 2026-04-20T23:59:59.000Z fill that day, so a third dated
          2026-04-20T12:00:00.000Z is refused even though the day is 23 hours wide, while
          2026-04-21T00:00:00.000Z succeeds one second after the blocking pair. A rolling 24-hour window
          would reject the 2026-04-21T00:00:00.000Z call, and pairwise interval logic (instance a) would
          never reject anything here because none of these instants overlaps another.
        test_recipe:
          setup:
            - "Three Contaminants PFOA, PFHXS and PFNA, each mcl 4.00, trigger 2.00, required_mrl 2.00, not hazard-index members."
            - "Laboratory certified for METHOD_533 with lowest achievable detection limit 1.00 and daily_analysis_capacity 2."
            - "EntryPoint EPTDS-01, population 45000."
            - "One 2026Q2 sample collected 2026-04-10T08:00:00.000Z whose panel is all three contaminants, shipped and received clean (so every analyzed_at below is inside the 336-hour holding time for METHOD_533)."
            - "Two SUBMITTED results already occupy the 2026-04-20 UTC day: PFOA analysed 2026-04-20T01:00:00.000Z and PFHXS analysed 2026-04-20T23:59:59.000Z."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00, hazard_index_member: false }
              as: UtilityAdmin
              captures: { c1_id: "$.data.id" }
            - call: "POST /contaminants"
              payload: { code: "PFHXS", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00, hazard_index_member: false }
              as: UtilityAdmin
              captures: { c2_id: "$.data.id" }
            - call: "POST /contaminants"
              payload: { code: "PFNA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00, hazard_index_member: false }
              as: UtilityAdmin
              captures: { c3_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 2 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${c1_id}", "${c2_id}", "${c3_id}"], monitoring_period: "2026Q2", collected_at: "2026-04-10T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-CAP" }
              as: SamplingTechnician
              captures: { s_id: "$.data.id" }
            - call: "POST /samples/${s_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${c1_id}", method: "METHOD_533", reported_ng_per_l: 1.50, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-04-20T01:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r1_id: "$.data.id" }
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${c2_id}", method: "METHOD_533", reported_ng_per_l: 1.50, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-04-20T23:59:59.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r2_id: "$.data.id" }
          trigger:
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${c3_id}", method: "METHOD_533", reported_ng_per_l: 1.50, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-04-20T12:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${c3_id}", method: "METHOD_533", reported_ng_per_l: 1.50, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-04-21T00:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r3_id: "$.data.id" }
          assert:
            - "The first call returns HTTP 422 with error_id == ERR_LAB_DAILY_CAPACITY_EXCEEDED"
            - "After the first call, GET /lab-results?laboratory_id=${lab_id} returns total_count 2"
            - "The second call returns HTTP 201"
            - "LabResult.${r3_id}.status == SUBMITTED"
            - "LabResult.${r3_id}.analyzed_at == \"2026-04-21T00:00:00.000Z\""
            - "LabResult.${r3_id}.laboratory_id == ${lab_id}"
            - "LabResult.${r2_id}.analyzed_at == \"2026-04-20T23:59:59.000Z\""
            - "GET /lab-results?laboratory_id=${lab_id} returns total_count 3"
            - "Sample.${s_id}.status == RECEIVED"
            - "EntryPoint.${ep_id}.accepted_result_count == 0"

  # ===========================================================================
  # §0.5 rule 9 — compensating_invariant
  # Instance (a) conserves MASS in kilograms across PilotTest/ResidualsManifest;
  # instance (b) conserves an integer CENTS ledger across
  # CapitalProject/FundingApplication. Two different conserved quantities, each
  # pinned as an explicit equality that must hold before and after the undo.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: residuals_mass_identity_is_restored_exactly_when_a_manifest_is_voided
        grounds:
          - state_machines.ResidualsManifest.CLASSIFIED_to_VOIDED
          - entities.PilotTest.fields.spent_media_kg
          - entities.PilotTest.fields.unmanifested_media_kg
          - entities.ResidualsManifest.fields.mass_kg
          - entities.ResidualsManifest.fields.void_reason_code
          - calculations.waste_classification
          - validations[priority=101]
        distinguishing_aspect: |
          The conserved quantity is MASS in kilograms, pinned as the explicit identity
          PilotTest.spent_media_kg == PilotTest.unmanifested_media_kg + sum(mass_kg of that pilot's
          manifests whose status is not VOIDED). It holds as 800.00 == 500.00 + 300.00 before the void
          and as 800.00 == 800.00 + 0.00 after it, to the cent of a kilogram with no drift, and the
          void deliberately does NOT erase the classification evidence (waste_classification
          NON_HAZARDOUS_SOLID and leachate_pfas_ng_per_l 49.99 survive). Instance (b) conserves integer
          cents through a completely different pair of entities.
        test_recipe:
          setup:
            - "EntryPoint EPTDS-01, population 45000, and a voluntary TreatmentEvaluation with the default residuals_budget_cents 250000."
            - "A GAC pilot started and completed with spent_media_kg 800.00, so unmanifested_media_kg starts at 800.00."
            - "A ResidualsManifest for 300.00 kg of GAC_CARBON, which drops unmanifested_media_kg to 500.00."
            - "The StateRegulator classifies it at leachate_pfas_ng_per_l 49.99, one hundredth below LEACHATE_SPECIAL_NG_PER_L, so waste_classification is NON_HAZARDOUS_SOLID and the manifest is CLASSIFIED but never shipped (residuals_spent_cents stays 0)."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}" }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 2550000000, capital_cost_estimate_cents: 680000000, annual_om_estimate_cents: 31000000, residuals_burden_score: 62.00, footprint_score: 71.00, om_complexity_score: 83.00 }
              as: TreatmentEngineer
              captures: { gac_id: "$.data.id" }
            - call: "POST /pilot-tests/${gac_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${gac_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 1.85, bed_volumes_treated: 25000, spent_media_kg: 800.00 }
              as: TreatmentEngineer
            - call: "POST /residuals-manifests"
              payload: { pilot_test_id: "${gac_id}", media_type: "GAC_CARBON", mass_kg: 300.00 }
              as: TreatmentEngineer
              captures: { man_id: "$.data.id" }
            - call: "POST /residuals-manifests/${man_id}/classify"
              payload: { leachate_pfas_ng_per_l: 49.99 }
              as: StateRegulator
          trigger:
            - call: "POST /residuals-manifests/${man_id}/void"
              payload: { void_reason_code: "MASS_CORRECTION" }
              as: TreatmentEngineer
          assert:
            - "Immediately before the trigger: PilotTest.${gac_id}.unmanifested_media_kg == 500.00 and 800.00 == 500.00 + 300.00"
            - "ResidualsManifest.${man_id}.status == VOIDED"
            - "ResidualsManifest.${man_id}.void_reason_code == MASS_CORRECTION"
            - "ResidualsManifest.${man_id}.mass_kg == 300.00"
            - "ResidualsManifest.${man_id}.waste_classification == NON_HAZARDOUS_SOLID"
            - "ResidualsManifest.${man_id}.leachate_pfas_ng_per_l == 49.99"
            - "ResidualsManifest.${man_id}.disposal_method == null"
            - "ResidualsManifest.${man_id}.disposal_cost_cents == null"
            - "PilotTest.${gac_id}.spent_media_kg == 800.00"
            - "PilotTest.${gac_id}.unmanifested_media_kg == 800.00"
            - "The identity holds again exactly: 800.00 == 800.00 + 0.00 (voided manifests contribute nothing)"
            - "TreatmentEvaluation.${eval_id}.residuals_spent_cents == 0"
            - "TreatmentEvaluation.${eval_id}.residuals_budget_cents == 250000"

      - name: capital_funding_ledger_identity_is_restored_when_an_award_is_withdrawn
        grounds:
          - state_machines.FundingApplication.AWARDED_to_WITHDRAWN
          - state_machines.CapitalProject.AWARDED_to_DENIED
          - calculations.funding_forgiveness
          - calculations.rate_impact_analysis
          - entities.CapitalProject.fields.local_share_cents
          - entities.CapitalProject.fields.funding_awarded_cents
          - entities.CapitalProject.fields.grant_equivalent_cents
          - concurrency_rules[capital-project-funding-supersede]
        distinguishing_aspect: |
          The conserved quantity is an INTEGER CENTS ledger, pinned as
          capital_cost_cents == funding_awarded_cents + recovered_cents + local_share_cents. It holds as
          680000000 == 400000000 + 0 + 280000000 while the disadvantaged-community SRF loan is awarded
          (196000000 of it forgiven, borrowed_cents 484000000, rate_impact_pct 6.00) and as
          680000000 == 0 + 0 + 680000000 after the withdrawal, with every rung of the rate ladder back
          to its exact pre-award value (41586568 / 72586568 / 7.07 / 150 bp / 73675367 / 7.18 / 341
          cents). Unlike instance (a) the undo must reverse a derived money cascade, not a mass split,
          and the reversal is only correct if forgiveness is unwound as well.
        test_recipe:
          setup:
            - "EntryPoint EPTDS-01, population 45000 (18000 accounts, 1080000 kgal, baseline revenue 1026000000)."
            - "GAC and IX pilots completed and the SELECT decision taken, so a CapitalProject exists at capital_cost_cents 680000000, annual_om_cost_cents 31000000, rate_design UNIFORM, funding_status NOT_APPLIED, construction_status PLANNED, local_share_cents 680000000 and rate_impact_pct 7.18."
            - "The FinanceOfficer reads the project's current version and files an SRF_LOAN application for 400000000 with disadvantaged_community true (forgiveness_pct 49.00)."
            - "The StateRegulator awards the full 400000000, so forgiven_cents is 196000000, grant_equivalent_cents 196000000, loan_principal_cents 204000000, local_share_cents 280000000, borrowed_cents 484000000, annual_debt_service_cents 29599852, base_annual_requirement_cents 60599852, provisional_rate_impact_pct 5.91, surcharge_bp 150, final_annual_requirement_cents 61508850, rate_impact_pct 6.00 and uniform_monthly_increase_cents 285."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}" }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 2550000000, capital_cost_estimate_cents: 680000000, annual_om_estimate_cents: 31000000, residuals_burden_score: 62.00, footprint_score: 71.00, om_complexity_score: 83.00 }
              as: TreatmentEngineer
              captures: { gac_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "IX", window_start_at: "2026-05-17T00:00:00.000Z", window_end_at: "2026-05-31T00:00:00.000Z", ebct_min: 3.00, lifecycle_cost_cents: 1800000000, capital_cost_estimate_cents: 900000000, annual_om_estimate_cents: 40000000, residuals_burden_score: 40.00, footprint_score: 85.00, om_complexity_score: 70.00 }
              as: TreatmentEngineer
              captures: { ix_id: "$.data.id" }
            - call: "POST /pilot-tests/${gac_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${gac_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 1.85, bed_volumes_treated: 25000, spent_media_kg: 800.00 }
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ix_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ix_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 4.00, bed_volumes_treated: 20000, spent_media_kg: 400.00 }
              as: TreatmentEngineer
            - call: "POST /treatment-evaluations/${eval_id}/decision"
              payload: { action: "SELECT" }
              as: TreatmentEngineer
            - call: "GET /capital-projects?treatment_evaluation_id=${eval_id}"
              payload: {}
              as: FinanceOfficer
              captures: { proj_id: "$.data[0].id", proj_v: "$.data[0].version" }
            - call: "POST /capital-projects/${proj_id}/funding-applications"
              payload: { program: "SRF_LOAN", amount_requested_cents: 400000000, disadvantaged_community: true, expected_capital_project_version: "${proj_v}" }
              as: FinanceOfficer
              captures: { app_id: "$.data.id" }
            - call: "POST /funding-applications/${app_id}/decision"
              payload: { action: "AWARD", awarded_cents: 400000000, decision_note: "Disadvantaged community set-aside, full award." }
              as: StateRegulator
          trigger:
            - call: "POST /funding-applications/${app_id}/withdraw"
              payload: { withdraw_reason: "The state reallocated the SRF set-aside to another system." }
              as: FinanceOfficer
          assert:
            - "Immediately before the trigger the identity holds with the award: 680000000 == 400000000 + 0 + 280000000, with grant_equivalent_cents 196000000, loan_principal_cents 204000000, borrowed_cents 484000000, annual_debt_service_cents 29599852, final_annual_requirement_cents 61508850, rate_impact_pct 6.00 and uniform_monthly_increase_cents 285"
            - "FundingApplication.${app_id}.status == WITHDRAWN"
            - "FundingApplication.${app_id}.awarded_cents == null"
            - "FundingApplication.${app_id}.forgiven_cents == null"
            - "FundingApplication.${app_id}.withdraw_reason == \"The state reallocated the SRF set-aside to another system.\""
            - "FundingApplication.${app_id}.amount_requested_cents == 400000000"
            - "FundingApplication.${app_id}.forgiveness_pct == 49.00"
            - "CapitalProject.${proj_id}.funding_status == DENIED"
            - "CapitalProject.${proj_id}.construction_status == PLANNED"
            - "CapitalProject.${proj_id}.funding_awarded_cents == 0"
            - "CapitalProject.${proj_id}.grant_equivalent_cents == 0"
            - "CapitalProject.${proj_id}.loan_principal_cents == 0"
            - "CapitalProject.${proj_id}.recovered_cents == 0"
            - "CapitalProject.${proj_id}.local_share_cents == 680000000"
            - "CapitalProject.${proj_id}.borrowed_cents == 680000000"
            - "The identity holds again exactly: 680000000 == 0 + 0 + 680000000"
            - "CapitalProject.${proj_id}.annual_debt_service_cents == 41586568"
            - "CapitalProject.${proj_id}.base_annual_requirement_cents == 72586568"
            - "CapitalProject.${proj_id}.provisional_rate_impact_pct == 7.07"
            - "CapitalProject.${proj_id}.surcharge_bp == 150"
