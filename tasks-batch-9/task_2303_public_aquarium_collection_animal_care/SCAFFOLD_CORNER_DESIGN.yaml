    grounds:
    - §1.3 permit_document_requirement (BASE_DOCUMENTS IMPORT, the CITES_PERMIT clause and the ESA_AUTHORIZATION clause)
    - §1.4 priority 29 (ERR_MISSING_DOCUMENTS)
    - §1.6 ERR_MISSING_DOCUMENTS (422)
    - §1.1 Permit.missing_document_codes / submission_round
    - §1.2 Permit DRAFT -> SUBMITTED precondition 'document set complete'
    - §1.5 POST /aquarium/permits/{id}/submission (optional document_codes replacement)
