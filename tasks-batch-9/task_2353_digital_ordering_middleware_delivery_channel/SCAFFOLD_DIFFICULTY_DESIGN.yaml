  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: store_hour_window_half_open_adjacency_allowed
        grounds:
          - validations[priority=14]
          - entities.StoreHourWindow.fields.opens_at_minute
          - endpoints["POST /stores/{id}/hour-windows"]
        distinguishing_aspect: |
          Interval semantics are half-open local-minute ranges [opens_at_minute,
          closes_at_minute) on the StoreHourWindow resource, so a window that
          starts exactly where another ends is accepted while a one-minute
          encroachment is rejected; there is no buffer and no aggregate
          capacity in this geometry.
        test_recipe:
          setup:
            - "Store S1 exists with exactly one hour window for Monday, 600..1320"
            - "No clock dependency: hour windows are stored in local minutes of the day"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { win_a_id: "$.data.id" }
          trigger:
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 1320, closes_at_minute: 1400 }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { win_b_id: "$.data.id" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 1319, closes_at_minute: 1400 }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 1, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
          assert:
            - "The adjacent window 1320..1400 returns 201: StoreHourWindow.${win_b_id}.window_minutes == 80"
            - "StoreHourWindow.${win_a_id}.window_minutes == 720"
            - "The window 1319..1400 returns 409 ERR_HOUR_WINDOW_OVERLAP because it encroaches by exactly one minute"
            - "The Tuesday window 600..1320 returns 201: overlap is scoped per day_of_week"
            - "GET /stores/${store_id}/hour-windows with day_of_week 0 returns total_count 2"

      - name: courier_network_closed_occupancy_interval_with_buffer
        grounds:
          - calculations.courier_network_selection
          - entities.DeliveryAssignment.fields.occupancy_until
          - entities.CourierNetwork.fields.max_concurrent_assignments
        distinguishing_aspect: |
          Interval semantics on the CourierNetwork resource are different in
          three ways: the occupied interval is CLOSED on both ends, it is
          extended past the SLA deadline by dispatch_buffer_seconds, and the
          conflict is an aggregate capacity count against
          max_concurrent_assignments rather than a pairwise clash. At the
          closing instant 16:12 the network is still occupied and dispatch
          falls through to the second-ranked network; one minute later the top
          network is selectable again.
        test_recipe:
          setup:
            - "Clock 2026-08-03T16:00:00Z; Store S1 published with prep_capacity_per_bucket 3; Channel MARKETMAX (MARKETPLACE)"
            - "CourierNetwork N_FAST: COURIER, rank 1, fee 650, handoff_sla 600 s, buffer 120 s, max_concurrent_assignments 1"
            - "CourierNetwork N_ECON: COURIER, rank 2, fee 450, handoff_sla 900 s, buffer 180 s, max_concurrent_assignments 2"
            - "Three DELIVERY orders OB1, OB2, OB3 all created at 16:00 and injected ACCEPTED"
            - "OB1 is dispatched at 16:00 and its offer is accepted by N_FAST, so occupancy_until is 16:12"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /courier-networks"
              payload: { code: "N_FAST", name: "FastCourier", network_type: "COURIER", priority_rank: 1, per_delivery_fee_cents: 650, handoff_sla_seconds: 600, dispatch_buffer_seconds: 120, max_concurrent_assignments: 1, is_active: true }
              as: PlatformAdmin
              captures: { net_fast_id: "$.data.id" }
            - call: "POST /courier-networks"
              payload: { code: "N_ECON", name: "EconCourier", network_type: "COURIER", priority_rank: 2, per_delivery_fee_cents: 450, handoff_sla_seconds: 900, dispatch_buffer_seconds: 180, max_concurrent_assignments: 2, is_active: true }
              as: PlatformAdmin
              captures: { net_econ_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 3, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-2001", fulfillment_mode: "DELIVERY", lines: [{ sku: "BURGER", quantity: 1 }] }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { ob1_id: "$.data.id" }
            - call: "POST /orders/${ob1_id}/inject"
              payload: { pos_result_code: "OK" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-2002", fulfillment_mode: "DELIVERY", lines: [{ sku: "BURGER", quantity: 1 }] }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { ob2_id: "$.data.id" }
            - call: "POST /orders/${ob2_id}/inject"
              payload: { pos_result_code: "OK" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-2003", fulfillment_mode: "DELIVERY", lines: [{ sku: "BURGER", quantity: 1 }] }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { ob3_id: "$.data.id" }
            - call: "POST /orders/${ob3_id}/inject"
              payload: { pos_result_code: "OK" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders/${ob1_id}/dispatch"
              payload: {}
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { asg1_id: "$.data.id" }
            - call: "POST /delivery-assignments/${asg1_id}/accept"
              payload: {}
              as: CourierNetworkAgent
              as_user_id: "${net_fast_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:12:00Z" }
              as: PlatformAdmin
            - call: "POST /orders/${ob2_id}/dispatch"
              payload: {}
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { asg2_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:13:00Z" }
              as: PlatformAdmin
            - call: "POST /orders/${ob3_id}/dispatch"
              payload: {}
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { asg3_id: "$.data.id" }
          assert:
            - "DeliveryAssignment.${asg1_id}.courier_network_id == ${net_fast_id}, accepted_at == 2026-08-03T16:00:00Z, handoff_deadline_at == 2026-08-03T16:10:00Z, occupancy_until == 2026-08-03T16:12:00Z, delivery_fee_cents == 650"
            - "At 16:12 the closed interval [16:00:00Z, 16:12:00Z] still contains the clock, so N_FAST occupancy 1 == max_concurrent_assignments 1 and it is filtered out"
            - "DeliveryAssignment.${asg2_id}.courier_network_id == ${net_econ_id} and occupancy_until == 2026-08-03T16:30:00Z (900 + 180 seconds past 16:12)"
            - "At 16:13 the interval no longer contains the clock, so the rank-1 network is selectable again: DeliveryAssignment.${asg3_id}.courier_network_id == ${net_fast_id} and occupancy_until == 2026-08-03T16:25:00Z"
            - "CourierNetwork.${net_fast_id}.open_assignment_count == 2 and CourierNetwork.${net_econ_id}.open_assignment_count == 1"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: refund_reversal_restores_order_money_identity
        grounds:
          - calculations.order_channel_totals
          - state_machines.Adjustment.ACCEPTED_to_REVERSED
          - endpoints["POST /adjustments/{id}/reverse"]
        distinguishing_aspect: |
          Conserved quantity is money on the Order, pinned as the identity
          channel_collected_cents == brand_net_cents + commission_cents +
          service_fee_cents + refunded_total_cents. Acceptance moves three of
          the four terms and reversal, performed by a second analyst, must
          restore every term exactly with no cent of drift.
        test_recipe:
          setup:
            - "Clock 2026-08-03T16:00:00Z; Store S1 published; Channel MARKETMAX (commission 2500 bps, service fee 299)"
            - "Order O1 injected ACCEPTED: collected 3750, brand_net 2629, commission 822, service_fee 299, refunded_total 0"
            - "A 1000 REFUND adjustment proposed by analyst-1, submitted, sitting in CHANNEL_REVIEW with commission_relief_cents 250"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "FRIES", name: "Fries", base_price_cents: 399, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-1001", fulfillment_mode: "DELIVERY", lines: [{ sku: "BURGER", quantity: 2 }, { sku: "FRIES", quantity: 1 }], tip_cents: 200 }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { o1_id: "$.data.id", o1_v: "$.data.version" }
            - call: "POST /orders/${o1_id}/inject"
              payload: { pos_result_code: "OK" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "GET /orders/${o1_id}"
              payload: {}
              as: SettlementAnalyst
              captures: { o1_v2: "$.data.version" }
            - call: "POST /adjustments"
              payload: { order_id: "${o1_id}", adjustment_type: "REFUND", amount_cents: 1000, reason_code: "MISSING_ITEM", expected_order_version: "${o1_v2}" }
              as: SettlementAnalyst
              as_user_id: "analyst-1"
              captures: { adj_id: "$.data.id" }
            - call: "POST /adjustments/${adj_id}/submit"
              payload: {}
              as: SettlementAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /adjustments/${adj_id}/accept"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
            - call: "POST /adjustments/${adj_id}/reverse"
              payload: { reason_code: "RAISED_IN_ERROR" }
              as: SettlementAnalyst
              as_user_id: "analyst-2"
          assert:
            - "Before acceptance the identity holds: 3750 == 2629 + 822 + 299 + 0"
            - "After acceptance: Order.${o1_id}.refunded_total_cents == 1000, commission_cents == 572, brand_net_cents == 1879, and the identity still holds: 3750 == 1879 + 572 + 299 + 1000"
            - "After reversal: Adjustment.${adj_id}.state == REVERSED with reversed_at == 2026-08-03T16:00:00Z"
            - "After reversal every term is restored exactly: Order.${o1_id}.refunded_total_cents == 0, commission_cents == 822, brand_net_cents == 2629, channel_collected_cents == 3750"
            - "A reversal attempted by analyst-1 (the proposer) instead returns 403 ERR_SEGREGATION_OF_DUTIES and leaves the accepted figures untouched"

      - name: prep_slot_conservation_across_hold_and_resume
        grounds:
          - endpoints["POST /orders/{id}/resume-injection"]
          - state_machines.Order.INJECTION_HELD_to_PENDING
          - entities.Store.fields.reserved_prep_slots
        distinguishing_aspect: |
          Conserved quantity is a physical kitchen resource rather than money:
          reserved_prep_slots + (number of the store's INJECTION_HELD orders)
          must always equal the number of open orders in PREPARING. An 86 hold
          moves one unit from reserved to held and resume-injection moves it
          back, with Store.open_order_count never moving.
        test_recipe:
          setup:
            - "Clock 2026-08-03T16:00:00Z; Store S1 published; Channel MARKETMAX is HONOR_86"
            - "Order O1 contains a BURGER line and is PENDING/PREPARING, so reserved_prep_slots is 1, open_order_count is 1 and no order is held"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
              captures: { item_burger_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-1001", fulfillment_mode: "PICKUP", lines: [{ sku: "BURGER", quantity: 1 }] }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { o1_id: "$.data.id" }
          trigger:
            - call: "POST /availability-events"
              payload: { store_id: "${store_id}", menu_item_id: "${item_burger_id}", event_type: "EIGHTY_SIX" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders/${o1_id}/resume-injection"
              payload: {}
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /availability-events"
              payload: { store_id: "${store_id}", menu_item_id: "${item_burger_id}", event_type: "RESTORE" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders/${o1_id}/resume-injection"
              payload: {}
              as: StoreOperator
              as_user_id: "${store_id}"
          assert:
            - "Before the 86: Store.${store_id}.reserved_prep_slots == 1, held orders 0, open_order_count 1, so the invariant reads 1 + 0 == 1"
            - "After the 86: Order.${o1_id}.injection_status == INJECTION_HELD and Store.${store_id}.reserved_prep_slots == 0, so the invariant reads 0 + 1 == 1"
            - "The first resume-injection returns 409 ERR_ITEM_STILL_UNAVAILABLE and changes nothing: the invariant still reads 0 + 1 == 1"
            - "After the RESTORE event the listing is AVAILABLE again while Order.${o1_id}.injection_status is still INJECTION_HELD"
            - "After the second resume-injection: Order.${o1_id}.injection_status == PENDING and Store.${store_id}.reserved_prep_slots == 1, so the invariant is back to 1 + 0 == 1"
            - "Store.${store_id}.open_order_count == 1 at every step and no prep slot is created or destroyed"
