              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /notice-packets/${np3_id}/transitions"
              payload: { to_status: "PUBLISHED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
          assert:
            - "Straddling window: the first trigger call returns 409 with error_id ERR_NOTICE_WINDOW_OVERLAP and NoticePacket.${np2_id}.status remains DRAFT with published_at null"
            - "Abutting window: the second trigger call returns 200 because [2026-09-01, +infinity) does not intersect [2026-08-01, 2026-09-01) under half-open semantics"
            - "NoticePacket.${np3_id}.status == PUBLISHED, published_at == 2026-08-01T00:00:00.000Z and consent_eligible_from == 2026-08-15T00:00:00.000Z"
