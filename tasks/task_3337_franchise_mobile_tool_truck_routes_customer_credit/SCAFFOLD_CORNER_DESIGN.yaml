          setup: ["Franchisee F CERTIFIED; route R1 (visit_weekday 1) IN_SERVICE; shop S1; technician T; approved account A1 (limit 50000); product P1; a 3 x P1 order DELIVERED in the week of 2026-09-07; clock then advanced to 2026-09-14"]
