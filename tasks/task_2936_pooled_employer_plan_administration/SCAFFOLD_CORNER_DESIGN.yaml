          assert:
            - "both batches exist with batch_total_cents 8500000, but only batch A is VALIDATED; batch B is still RECEIVED with validated_at null"
            - "the plan read shows total_validated_contributions_cents == 8500000 and aggregate_receivable_cents == 8500000 — batch B contributes to neither"
            - "the plan read shows total_assets_cents == 0 (nothing posted) and contribution_control_delta_cents == 0"
            - "the employer read shows contribution_receivable_cents == 8500000 and account_balance_cents == 0"
            - "the adjacent pay periods [2026-07-16, 2026-07-31) and [2026-07-31, 2026-08-15) both persisted: touching half-open intervals are not an overlap"

      - excluded_because:
          difficulty_instance: deposit_timeliness_seventh_versus_eighth_business_day
          rationale: "The `threshold` boundary claims for the deposit-timeliness rule — value at threshold-1, at threshold and at threshold+1, and the calculation that splits on crossing — are asserted there across business_days_elapsed 7, 8 and 9 with late_by_business_days 0, 1 and 2."

      - excluded_because:
          difficulty_instance: match_tier_nesting_capped_by_plan_wide_six_percent
          rationale: "The `tiered_pricing` claims — every tier boundary tested, marginal versus average rate, cross-tier straddling — are asserted there on employer_match_amount, including the plan-wide 6.0% cap that binds after per-tier rounding."

      - excluded_because:
          difficulty_instance: lost_earnings_vfcp_recovery_date_segments_by_quarter
          rationale: "The `chronological` claims — processing order matters and the segmented result is order-independent — are asserted there: the lost-earnings period is split at quarter boundaries with each segment rounded on its own quarter rate."

      - excluded_because:
          difficulty_instance: lost_earnings_irs_6621_single_rate_to_deposit_date
          rationale: "The variant_selection claim — the correct variant is applied in the correct context — is asserted there against its sibling VFCP instance: the same deposit yields 4192 under IRS_6621_UNDERPAYMENT and 139260 under VFCP_RECOVERY_DATE, and recovery_date is stored but unused by the former."

      - excluded_because:
          difficulty_instance: excise_tax_de_minimis_at_ten_thousand_cents
          rationale: "The `precision` claim — decimal places and rounding mode honoured at the cent — is asserted there on excise_tax_5330 at exactly EXCISE_TAX_DE_MINIMIS_CENTS and one cent below it."

      - excluded_because:
          difficulty_instance: exit_settlement_supersedes_election_closes_tests_and_retotals_plan
          rationale: "The `waterfall_allocation` claims — first bucket fills before the second, overflow handled, remainder written off — are asserted there on exit_settlement_waterfall including the unrecovered_deduction_cents write-off path."

      - excluded_because:
          difficulty_instance: deposit_reversal_restores_contribution_control_delta_to_zero
          rationale: "The `aggregation` claims — running total correct after an add and correct again after a reversal — are asserted there on plan_control_totals, field by field, with both control deltas back at 0."

  - section: validations
    instances:

      - name: corner_duplicate_provider_ein_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=52]
          - errors.ERR_DUPLICATE_PROVIDER_EIN
        distinguishing_aspect: "Provider EIN uniqueness is global rather than scoped to any parent, and the refused create leaves no row: the second provider with the same EIN is rejected even though its legal name differs, while a third with a different EIN succeeds."
        test_recipe:
          setup:
            - "One provider already carries ein 410000001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegulatorOps
            - call: "POST /pep/plan-providers"
              payload: { legal_name: "Meridian Pooled Plan Services LLC", ein: "410000001", fidelity_bond_amount_cents: 100000000 }
              as: RegulatorOps
              captures: { ppp_id: $.data.id }
          trigger:
            - call: "POST /pep/plan-providers"
              payload: { legal_name: "Westvale Pooled Administration Inc", ein: "410000001", fidelity_bond_amount_cents: 50000000 }
              as: RegulatorOps
              expect_error: ERR_DUPLICATE_PROVIDER_EIN
            - call: "POST /pep/plan-providers"
              payload: { legal_name: "Westvale Pooled Administration Inc", ein: "410000002", fidelity_bond_amount_cents: 50000000 }
              as: RegulatorOps
              captures: { ppp2_id: $.data.id }
            - call: "GET /pep/plan-providers/${ppp_id}"
              as: RegulatorOps
          diagnostic_notes: "Satisfaction-to-pass and violation-to-error are probed on the same rule so a blanket rejection of every second provider cannot pass."
          assert:
            - "the duplicate EIN returns 409 ERR_DUPLICATE_PROVIDER_EIN"
            - "the different EIN returns 201 with a new id distinct from ${ppp_id}"
            - "the original provider row is unchanged: legal_name Meridian..., fidelity_bond_amount_cents 100000000, version 1"

      - name: corner_low_fidelity_bond_at_registration_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors.ERR_FIDELITY_BOND_BELOW_FLOOR
        distinguishing_aspect: "The ERISA 412 floor is enforced at registration rather than at creation, so a provider may be created with any bond and only fails when it seeks the register; the boundary is inclusive at exactly 100000 cents."
        test_recipe:
          setup:
            - "Two providers created with bonds of 99999 and 100000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegulatorOps
            - call: "POST /pep/plan-providers"
              payload: { legal_name: "Thinbond Pooled Services LLC", ein: "410000003", fidelity_bond_amount_cents: 99999 }
              as: RegulatorOps
              captures: { ppp_low_id: $.data.id }
            - call: "POST /pep/plan-providers"
              payload: { legal_name: "Exactbond Pooled Services LLC", ein: "410000004", fidelity_bond_amount_cents: 100000 }
              as: RegulatorOps
              captures: { ppp_exact_id: $.data.id }
          trigger:
            - call: "POST /pep/plan-providers/${ppp_low_id}/register"
              payload: { registration_effective_date: "2026-08-03" }
              as: RegulatorOps
              expect_error: ERR_FIDELITY_BOND_BELOW_FLOOR
            - call: "POST /pep/plan-providers/${ppp_exact_id}/register"
              payload: { registration_effective_date: "2026-08-03" }
              as: RegulatorOps
          assert:
            - "both creates returned 201: the floor is not checked at creation"
            - "registering the 99999 provider returns 422 ERR_FIDELITY_BOND_BELOW_FLOOR and leaves registration_status PENDING_REGISTRATION with registration_number null"
            - "registering the 100000 provider returns 200 with registration_status REGISTERED: the floor comparison is inclusive"

      - name: corner_affiliation_across_plans_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=38]
          - errors.ERR_INVALID_AFFILIATION
          - endpoints[GET /pep/service-providers/{id}/affiliates]
        distinguishing_aspect: "The self-referential affiliation link is confined to one plan: naming a provider engaged on the sponsor's OTHER plan is a 422 even though the id resolves and both plans share a sponsor, and the accepted same-plan link is visible from the affiliates listing."
        test_recipe:
          setup:
            - "One registered provider sponsoring two DRAFT plan documents, 001 and 002; plan 002 has one engaged provider."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
