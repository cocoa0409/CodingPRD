            - "Two RETAINED orders of 1 car each complete on 2026-09-12, producing HELD car K1 of type CT-W1 and HELD car K2 of type CT-W2, both with regulatory_life_end_date 2051-09-12."
            - "Program MAND-W (PLANNED, deadline 2026-12-31, 3 shop days per car) is attached to CT-W1 only, so CT-W2 is deliberately uncovered."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "CT-W1", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "LINE-W1" }
              as: ProductionPlanner
              captures: { ct1_id: $.data.id }
            - call: "POST /api/v1/car-types"
              payload: { model_code: "CT-W2", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "LINE-W2" }
              as: ProductionPlanner
              captures: { ct2_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-W1", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5 }
              as: SupplyChainCoordinator
              captures: { ws1_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-W2", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5 }
              as: SupplyChainCoordinator
              captures: { ws2_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct1_id}", component_id: "${ws1_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct2_id}", component_id: "${ws2_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/component-purchase-orders"
              payload: { component_id: "${ws1_id}", qty_ordered: 100, unit_cost_cents: 1000, order_date: "2026-09-01", expected_receipt_date: "2026-09-06" }
              as: SupplyChainCoordinator
              captures: { po1_id: $.data.id }
            - call: "POST /api/v1/component-purchase-orders/${po1_id}/confirm"
              payload: {}
              as: SupplyChainCoordinator
            - call: "POST /api/v1/component-receipts"
              payload: { component_purchase_order_id: "${po1_id}", component_id: "${ws1_id}", qty_received: 100, receipt_date: "2026-09-06" }
              as: SupplyChainCoordinator
              captures: { rc1_id: $.data.id }
            - call: "POST /api/v1/component-receipts/${rc1_id}/receive"
              payload: {}
              as: SupplyChainCoordinator
            - call: "POST /api/v1/component-purchase-orders"
              payload: { component_id: "${ws2_id}", qty_ordered: 100, unit_cost_cents: 1000, order_date: "2026-09-01", expected_receipt_date: "2026-09-06" }
              as: SupplyChainCoordinator
              captures: { po2_id: $.data.id }
            - call: "POST /api/v1/component-purchase-orders/${po2_id}/confirm"
              payload: {}
              as: SupplyChainCoordinator
            - call: "POST /api/v1/component-receipts"
              payload: { component_purchase_order_id: "${po2_id}", component_id: "${ws2_id}", qty_received: 100, receipt_date: "2026-09-06" }
              as: SupplyChainCoordinator
              captures: { rc2_id: $.data.id }
            - call: "POST /api/v1/component-receipts/${rc2_id}/receive"
              payload: {}
              as: SupplyChainCoordinator
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct1_id}", quantity: 1, planned_shop_days: 1, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-12-01" }
              as: ProductionPlanner
              captures: { o1_id: $.data.id }
            - call: "POST /api/v1/production-orders/${o1_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${o1_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/LINE-W1-1/changeover"
              payload: { production_order_id: "${o1_id}", scheduled_start_date: "2026-09-11", scheduled_end_date: "2026-09-12" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${o1_id}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-12" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct2_id}", quantity: 1, planned_shop_days: 1, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-12-01" }
              as: ProductionPlanner
              captures: { o2_id: $.data.id }
            - call: "POST /api/v1/production-orders/${o2_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${o2_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/LINE-W2-1/changeover"
              payload: { production_order_id: "${o2_id}", scheduled_start_date: "2026-09-11", scheduled_end_date: "2026-09-12" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${o2_id}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-12" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?car_type_id=${ct1_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { car_covered: "$.data[0].id" }
            - call: "GET /api/v1/lease-fleet-cars?car_type_id=${ct2_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { car_uncovered: "$.data[0].id" }
            - call: "POST /api/v1/retrofit-programs"
              payload: { mandate_code: "MAND-W", description: "Partially covering mandate", compliance_deadline_date: "2026-12-31", required_shop_days_per_car: 3 }
              as: RegulatoryRetrofitist
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/retrofit-program-car-types"
              payload: { retrofit_program_id: "${prog_id}", car_type_id: "${ct1_id}" }
              as: RegulatoryRetrofitist
          trigger:
            - call: "POST /api/v1/retrofit-work-orders"
              payload: { retrofit_program_id: "${prog_id}", lease_fleet_car_id: "${car_uncovered}", shop_line: "SHOP-W1", scheduled_start_date: "2026-10-01", scheduled_end_date: "2026-10-04", component_qty_consumed: 1 }
              as: ProductionPlanner
              captures: { err_capacity: $.data.error_id }
            - call: "GET /api/v1/lease-fleet-cars/${car_uncovered}"
              payload: {}
              as: PlatformAdmin
              captures: { uncovered_after: $.data.status }
            - call: "POST /api/v1/retrofit-work-orders"
              payload: { retrofit_program_id: "${prog_id}", lease_fleet_car_id: "${car_covered}", shop_line: "SHOP-W2", scheduled_start_date: "2026-10-01", scheduled_end_date: "2026-10-04", component_qty_consumed: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_status: $.data.status }
          assert:
            - "The uncovered car is refused: HTTP 409 with data.error_id == ${err_capacity} == \"ERR_CAPACITY_EXCEEDED\""
            - "The rejection is atomic: LeaseFleetCar.${car_uncovered}.status == ${uncovered_after} == \"HELD\" and no work-order row was written"
            - "The covered car is accepted: HTTP 201 with RetrofitWorkOrder.${wo_id}.status == ${wo_status} == \"SCHEDULED\""
            - "Coverage is read through the junction: both cars are HELD and both windows end before the 2026-12-31 deadline, so priorities 8, 9, 10 and 21 are all satisfied and the sole difference is the RetrofitProgramCarType row"
            - "The rule is checked last in the ladder (priority 24), after the free-car and temporal rules, so it is the coverage gate rather than a state or slot failure"
            - "Only one coverage row exists for this program — car type CT-W1 — which is exactly why CT-W2's car is refused"
