  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers fails 401 ERR_UNAUTHENTICATED before role, existence, or business checks — priority 1 beats everything."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /launch-seasons"
              payload: { season_code: "FW26" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the trigger is sent WITHOUT X-User-Role and X-User-ID headers; response status is 401 and err == ERR_UNAUTHENTICATED"

      - name: media_buyer_cannot_create_concept
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - roles[MediaBuyer]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "A fully authenticated MediaBuyer calling the ProductLead-only POST /concepts fails 403 ERR_FORBIDDEN — authorization is per-endpoint role membership, not authentication alone."
        test_recipe:
          setup: ["Season FW26 with category (existence would pass)."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
          trigger:
            - call: "POST /concepts"
              payload: { category_id: "${cat_id}", title: "Sneaky media concept" }
              as: MediaBuyer
              captures: { err: $.data.error_id }
          assert:
            - "response status is 403 and err == ERR_FORBIDDEN (role check precedes the body's existence validation only for auth; category exists so 403 is the operative failure)"

      - name: advance_without_insights_rejected
        claim_type: Violation → Error
        grounds:
          - state_machines.ProductConcept.IDENTIFIED_to_RESEARCHING
          - errors[ERR_NO_RESEARCH_INSIGHTS]
        distinguishing_aspect: "Advance on a concept with zero research insights fails 422 ERR_NO_RESEARCH_INSIGHTS — the consumer-problem-identification step cannot be skipped."
        test_recipe:
          setup: ["Concept created, no insights."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
          trigger:
            - call: "POST /concepts/${concept_id}/advance"
              payload: {}
              as: ProductLead
              captures: { err: $.data.error_id }
          assert:
            - "response status is 422 and err == ERR_NO_RESEARCH_INSIGHTS"
            - "the concept remains IDENTIFIED"

      - name: frozen_season_blocks_all_child_mutations
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - errors[ERR_SEASON_FROZEN]
        distinguishing_aspect: "While FROZEN, both an insight append on an existing concept and a new concept create fail 409 ERR_SEASON_FROZEN — the posture gate blankets season-scoped mutations regardless of entity type."
        test_recipe:
          setup: ["Season FW26 FROZEN; category and concept pre-exist."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - call: "POST /launch-seasons/${season_id}/freeze"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /concepts/${concept_id}/insights"
              payload: { points: 10, observed_at: "2026-09-01T00:00:00Z" }
              as: ProductLead
              captures: { err1: $.data.error_id }
            - call: "POST /concepts"
              payload: { category_id: "${cat_id}", title: "Frozen concept" }
              as: ProductLead
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_SEASON_FROZEN and err2 == ERR_SEASON_FROZEN"

      - name: guarded_season_still_allows_research_ops
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=4]
        distinguishing_aspect: "GUARDED throttles only the launch throttle points (media air); insight appends and concept creation continue to succeed — the gate is scoped, not a blanket freeze."
        test_recipe:
          setup: ["Season GUARDED (two filed cases pushed exposure to 20); concept pre-exists."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - call: "POST /patent-cases"
              payload: { category_id: "${cat_id}", case_number: "PT-8001", claim_cents: 2000000, severity: "HIGH" }
              as: LegalCounsel
              as_user_id: "lc-jane"
            - call: "POST /patent-cases"
              payload: { category_id: "${cat_id}", case_number: "PT-8002", claim_cents: 500000, severity: "MED" }
              as: LegalCounsel
              as_user_id: "lc-jane"
          trigger:
            - call: "POST /concepts/${concept_id}/insights"
              payload: { points: 10, observed_at: "2026-09-01T00:00:00Z" }
              as: ProductLead
              captures: { momentum: $.data.research_momentum }
            - call: "GET /launch-seasons/${season_id}"
              payload: {}
              as: ProductLead
              captures: { posture: $.data.posture }
          assert:
            - "the insight append returned 201 and momentum == 10.0"
            - "posture == SEASON_GUARDED (research proceeds under guard)"

      - name: closed_season_blocks_categories_and_review
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - errors[ERR_SEASON_CLOSED]
        distinguishing_aspect: "A CLOSED season rejects even the admin-repair category create and the run-review checkpoint with ERR_SEASON_CLOSED — CLOSED is absorbing."
        test_recipe:
          setup: ["Season FW26 CLOSED (empty pipeline)."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - call: "POST /launch-seasons/${season_id}/close"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /categories"
              payload: { season_id: "${season_id}", name: "Late Category", crowding_base: 1 }
              as: PlatformAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /launch-seasons/${season_id}/run-review"
              payload: {}
              as: PlatformAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_SEASON_CLOSED (category creation is exempt from FROZEN but not from CLOSED)"
            - "err2 == ERR_SEASON_CLOSED (no reviews after close)"

      - name: commitment_need_by_outside_agreement_window_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors[ERR_COMMITMENT_OUTSIDE_WINDOW]
        distinguishing_aspect: "need_by 2027-02-01 lies outside the SIGNED agreement's [2026-10-01, 2027-01-01) window and fails 409 ERR_COMMITMENT_OUTSIDE_WINDOW — with variant readiness, OCC, and capacity all satisfied, the temporal rule is the operative failure."
        test_recipe:
          setup: ["Variant DR_TESTING with DECIDED_SCALE media; agreement window [2026-10-01, 2027-01-01) SIGNED."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - *c_ins_a
            - *c_ins_b
            - *c_clock0910
            - *c_advance
            - *c_advance
            - *c_advance
            - *c_round
            - *c_round_pass
            - *c_advance
            - *c_partner
            - *c_variant
            - *c_tool
            - *c_study
            - *c_complete
            - *c_substantiate
            - *c_media
            - *c_air
            - *c_decide_scale
            - *c_agr
            - *c_sign
          trigger:
            - call: "POST /launch-commitments"
              payload: { agreement_id: "${agr_id}", variant_id: "${variant_id}", committed_units: 100, need_by_date: "2027-02-01T00:00:00Z", expected_agreement_version: "${agr_v}" }
              as: SourcingManager
              captures: { err: $.data.error_id }
          assert:
            - "response status is 409 and err == ERR_COMMITMENT_OUTSIDE_WINDOW"

      - name: sign_elapsed_window_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - state_machines.RetailAgreement.DRAFT_to_SIGNED
          - errors[ERR_WINDOW_ELAPSED]
        distinguishing_aspect: "An agreement drafted with window [2026-09-01, 2026-09-05) cannot be signed at 2026-09-10 — window_end <= now fails 409 ERR_WINDOW_ELAPSED."
        test_recipe:
          setup: ["Season OPEN; category CLEAR; agreement drafted with an already-elapsed window."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - call: "POST /retail-agreements"
              payload: { category_id: "${cat_id}", retailer_name: "BigBoxCo", exclusive: false, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-05T00:00:00Z", min_launch_units: 100 }
              as: RetailExec
              captures: { agr_id: $.data.id }
            - *c_clock0910
          trigger:
            - call: "POST /retail-agreements/${agr_id}/sign"
              payload: {}
              as: RetailExec
              captures: { err: $.data.error_id }
          assert:
            - "response status is 409 and err == ERR_WINDOW_ELAPSED"
            - "the agreement remains DRAFT"

      - name: litigation_block_on_sign_is_safety_priority
        claim_type: Priority Ordering
        grounds:
          - validations[priority=7]
        excluded_because:
          difficulty_instance: litigation_block_beats_window_conflict_on_agreement_sign
          rationale: "ERR_CATEGORY_LITIGATION_BLOCKED is the winning side of the difficulty instance's p7-vs-p8 race."

      - name: frozen_posture_outranks_capacity_failure
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
        excluded_because:
          difficulty_instance: frozen_season_beats_capacity_on_commitment_create
          rationale: "ERR_SEASON_FROZEN over ERR_CAPACITY_EXCEEDED is the difficulty instance's core assertion."

