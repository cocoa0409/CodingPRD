  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: create_requires_listing_active
        grounds:
          - "validations[priority=7]"
          - state_machines.Listing
        distinguishing_aspect: |
          Pair ShowingRequest -> Listing: creating a request on a PAUSED listing
          is rejected with ERR_LISTING_NOT_ACTIVE; after resume the identical
          payload succeeds. (The showing's valid creation depends on the
          Listing's state.)
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; LA; VACANT auto-approve listing L, then paused"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "LA Thirteen", license_number: "LIC-LA-13", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Thirteen", license_number: "LIC-BA-13", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ba-13" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SB13", contact_email: "sb13@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "80 Pause Pl", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/listings/${l_id}/pause", payload: {}, as: ListingAgent, as_user_id: "${la_id}" }
          trigger:
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { err: $.data.error_id } }
            - { call: "POST /showing-desk/listings/${l_id}/resume", payload: {}, as: ListingAgent, as_user_id: "${la_id}" }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r_st: $.data.status } }
          assert:
            - "while PAUSED: error_id == ERR_LISTING_NOT_ACTIVE"
            - "after resume: identical payload succeeds with status APPROVED"
      - name: credential_issue_requires_confirmed
        grounds:
          - state_machines.AccessCredential
          - "validations[priority=7]"
        distinguishing_aspect: |
          Different entity pair AccessCredential -> ShowingRequest: issuing a
          credential while the request is merely APPROVED (not CONFIRMED) fails
          with ERR_SHOWING_NOT_CONFIRMED; after confirm, issuance succeeds and
          the credential is born ISSUED.
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; LA; VACANT auto-approve listing L"
            - "R1 2026-05-01T10:00-10:30 auto-APPROVED (not yet confirmed)"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
