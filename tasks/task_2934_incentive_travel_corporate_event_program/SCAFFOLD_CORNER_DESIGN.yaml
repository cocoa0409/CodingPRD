      - 'The two rules are independent: a POST /activity-signups carrying a correct expected_activity_version
        succeeds regardless of how far Program.version has moved, because §1.2.1 declares no program-level
        guard on that endpoint.'
  - name: cascade_layer_end_to_end_and_ordering
    claim_type: cascading_side_effects
    grounds:
    - §1.0 complexity_layers cascading_side_effects
    - §1.2 Registration CONFIRMED -> CANCELLED side effects
    - §0.5 transitive_cascade
    distinguishing_aspect: |
      The claims this layer asks for — an N-level chain verified end to end, and sensitivity to the order the hops run in — are the whole substance of the registration-cancellation cascade instance, which walks seat -> room-night ledger and budget rollup -> waitlist promotion and asserts that the promotion is chosen after the seat is released rather than before. The five-level execution cascade is covered by its own §1.8 instance and by the two consistency_model instances below.
    excluded_because:
      difficulty_instance: registration_cancel_cascades_three_levels_into_waitlist_promotion
      rationale: |
        That instance asserts every hop of the chain in one request and pins the ordering by showing the promoted signup is the chronologically first waitlisted row evaluated against the post-release seat count, which is exactly the ordering-sensitivity claim for this layer.
  - name: dual_variant_layer_both_branches_and_switch_delta
    claim_type: dual_variant_calculation
    grounds:
    - §1.0 complexity_layers dual_variant_calculation
    - §1.3 taxable_award_gross_up variants, cancellation_exposure_projection variants
    - §0.5 dual_variant_calc
    distinguishing_aspect: |
      This layer asks for both branches to produce their expected results and for the delta on switching to be correct. Both scaffold calculations that carry variants are already driven by §1.8 dual-variant instances, and the flat-versus-full gross-up pair is the one where the switch delta is a single exact figure (117350 cents on the same 443198-cent award), so it is the stronger of the two for this claim. The exposure-basis pair is covered by the companion §1.8 instance and by the computed_read stub in the endpoints section.
    excluded_because:
      difficulty_instance: gross_up_flat_supplemental_variant_on_travelled_winner
      rationale: |
        That instance and its full-gross-up sibling compute the same award under both variants, assert each figure independently, and state the delta between them, which is precisely the pair of claims this layer generates.
  - name: rate_threshold_layer_boundary_and_trigger
    claim_type: rate_threshold_triggers
    grounds:
    - §1.0 complexity_layers rate_threshold_triggers
    - §1.3 program_budget_rollup budget_posture thresholds (8500 / 10000 bp)
    - §1.1 DepositMilestone.requires_finance_review
    distinguishing_aspect: |
      The boundary claims for this layer are the utilization_bp thresholds that flip budget_posture and, one hop further, stamp requires_finance_review on every SCHEDULED deposit milestone. The five-level execution cascade instance is the only place where a threshold crossing is both reached at its exact boundary and observed to trigger a write on a different entity, which is what separates this layer from plain arithmetic. The running-total crossing at each successive qualifier review is additionally covered by a full recipe in the calculations section.
    excluded_because:
      difficulty_instance: contract_execution_cascades_five_levels_into_deposit_finance_review
      rationale: |
        That instance crosses BUDGET_POSTURE_OVER_BP inside the cascade and asserts the resulting requires_finance_review stamp, covering both the boundary claim and the trigger claim for this layer in one recipe.
- section: consistency_model
  instances:
  - name: the_five_level_execution_cascade_is_fully_readable_on_the_first_read_after_it
    claim_type: immediate
    grounds:
    - §1.0 consistency_model immediate
    - §1.2 SupplierContract PROPOSED -> EXECUTED side effects and the SOURCING -> CONTRACTED cascade
    - §1.3 qualifier_committed_cost, program_budget_rollup, room_night_ledger, cancellation_exposure_projection
    distinguishing_aspect: |
      The consistency model declared in §1.0 is immediate, and the claim it generates is that all changes are visible in the same request. This instance takes the widest write in the whole scaffold — the execution cascade, which touches five entity kinds in one call — and asserts that the response body already carries the acting entity's new state and that the very first read of every other affected row is already correct. No retry, no delay and no second read is permitted anywhere in the assertions, which is what makes this an immediate-consistency claim rather than a restatement of the cascade's arithmetic. Its sibling covers the read-your-writes direction on derived rollup fields.
    test_recipe:
      setup: Empty database. A 5000000-cent program sits at SOURCING with two tiers, two destinations
        (Lisbon SHORTLISTED and inspected 82, Seville CANDIDATE), two reviewed qualifiers, and hotel contract
        ${c1_id} PROPOSED at 12 rooms x 5 nights x 38500 with three SCHEDULED deposit milestones totalling
        2310000. Nothing has been executed, so per_person_cost_basis_cents is 0, both qualifiers have
        committed_cost_cents of only their tier upgrade allowance, and room_nights_blocked is 0.
