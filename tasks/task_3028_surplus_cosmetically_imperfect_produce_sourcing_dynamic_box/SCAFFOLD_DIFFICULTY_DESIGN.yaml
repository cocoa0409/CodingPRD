scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: box_pricing_provisional_line_major_vs_final_box_major
    grounds:
    - calculations.advance_box_order_pricing
    - calculations.allocate_box_lines
    - calculations.billing_weight_apportion
    - state_machines.BoxOrder.pricing_status.UNPRICED_to_PRICED
    - entities.BoxOrder.fields.lines_total_cents
    distinguishing_aspect: 'Two valid readings of one pricing pass produce different numbers for identical data: the provisional line-major reading rounds each line before summing, the final box-major reading rounds exactly once on the whole box, and the retention rule turns those two readings into two observable states of the same order.'
    test_recipe:
      setup:
      - 'Logical clock default 2026-09-01T00:00:00Z. Demos: centers DEMO-NE and DEMO-SO (both region NE, is_active true, insulation LIGHT, so the regional rule winner by code ASC is DEMO-NE), one supplier, one customer with no allergies registering at DEMO-NE, one ACTIVE WEEKLY subscription.'
      - 'Lots: L-POS (FRUIT, unit_weight 120, unit_cost 300, quantity 200, PASS, READY), L-NEG (VEGETABLE, unit_weight 120, unit_cost 300, quantity 200, PASS, READY), L-ROUND (PANTRY, unit_weight 120, unit_cost 300, quantity 200, PASS, READY). Every display_price_cents is 375.'
      - 'Two box orders for serving_cycle_index 1, one per subscription: order A (customer ALLERGY with dietary_allergy_codes [PEANUT]) and order B (customer PLAIN, no allergies). Both DRAFT.'
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
          code: DEMO-NE
          name: Demo Northeast
          region: NE
          insulation_profile: LIGHT
        as: PlatformAdmin
        captures:
          cne_id: $.data.id
      - call: POST /produce/fulfillment-centers
        payload:
          code: DEMO-SO
          name: Demo South
          region: NE
          insulation_profile: LIGHT
        as: PlatformAdmin
        captures:
          cso_id: $.data.id
      - call: POST /produce/suppliers
        payload:
          name: Aurora Surplus Co
          region: NE
        as: PlatformAdmin
        captures:
          sup_id: $.data.id
      - call: POST /produce/suppliers/${sup_id}/lots
        payload:
          fulfillment_center_id: ${cne_id}
          product_name: L-POS
          category: FRUIT
          procurement_grade: OFF_SPEC
          unit_weight_grams: 120
          quantity_available: 200
          unit_cost_cents: 300
          harvest_date: '2026-09-05T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          allergen_codes:
          - PEANUT
          preference_tags:
          - FRUIT_FORWARD
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          b_lot_pos: $.data.id
          b2v_lot_pos: $.data.version
      - call: POST /produce/suppliers/${sup_id}/lots
        payload:
          fulfillment_center_id: ${cne_id}
          product_name: L-NEG
          category: VEGETABLE
          procurement_grade: OFF_SPEC
          unit_weight_grams: 120
          quantity_available: 200
          unit_cost_cents: 300
          harvest_date: '2026-09-05T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          preference_tags:
          - VEGGIE_FORWARD
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          b_lot_neg: $.data.id
          b2v_lot_neg: $.data.version
      - call: POST /produce/suppliers/${sup_id}/lots
        payload:
          fulfillment_center_id: ${cne_id}
          product_name: L-ROUND
          category: PANTRY
          procurement_grade: OFF_SPEC
          unit_weight_grams: 120
          quantity_available: 200
          unit_cost_cents: 300
          harvest_date: '2026-09-05T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          preference_tags:
          - PANTRY_FORWARD
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          b_lot_round: $.data.id
          b2v_lot_round: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${b_lot_pos}
          supplier_id: ${sup_id}
          bid_unit_cost_cents: 280
          quantity_offered: 200
        as: Supplier
        as_user_id: ${sup_id}
      - call: POST /produce/suppliers/${sup_id}/lots
        payload:
          fulfillment_center_id: ${cne_id}
          product_name: FD1
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 200
          quantity_available: 100
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          b_fd1: $.data.id
          b2v_fd1: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${b_fd1}
          supplier_id: ${sup_id}
          bid_unit_cost_cents: 100
          quantity_offered: 100
        as: Supplier
        as_user_id: ${sup_id}
      - call: POST /produce/suppliers/${sup_id}/lots
        payload:
          fulfillment_center_id: ${cne_id}
          product_name: FD2
          category: DAIRY
          procurement_grade: SURPLUS
          unit_weight_grams: 200
          quantity_available: 100
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          b_fd2: $.data.id
          b2v_fd2: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${b_fd2}
          supplier_id: ${sup_id}
          bid_unit_cost_cents: 100
          quantity_offered: 100
        as: Supplier
        as_user_id: ${sup_id}
      - call: POST /produce/suppliers/${sup_id}/lots
        payload:
          fulfillment_center_id: ${cne_id}
          product_name: FB1
          category: BAKERY
          procurement_grade: SURPLUS
