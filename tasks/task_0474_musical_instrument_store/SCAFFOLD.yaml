  - method: GET
    path: "/lesson-enrollments/{enrollment_id}"
    description: "Get a lesson enrollment"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: LessonEnrollment
    side_effects: []

  - method: GET
    path: "/lesson-enrollments"
    description: "List lesson enrollments (filter by student_id or rental_agreement_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: ["student_id?", "rental_agreement_id?", "status?", "limit?", "offset?"]
    output: LessonEnrollment[]
    side_effects: []

  - method: POST
    path: "/lesson-enrollments/{enrollment_id}/pause"
    description: "Pause a lesson enrollment"
    roles: [Customer, SalesAssociate]
    code: 200
    input: []
    output: LessonEnrollment
    side_effects: ["ACTIVE -> PAUSED", "increments LessonEnrollment.version by 1"]

  - method: POST
    path: "/lesson-enrollments/{enrollment_id}/resume"
    description: "Resume a paused enrollment (recomputes tuition; bundle discount may have lapsed)"
    roles: [Customer, SalesAssociate]
    code: 200
    input: []
    output: LessonEnrollment
    side_effects: ["PAUSED -> ACTIVE", "recomputes monthly_tuition_cents", "increments LessonEnrollment.version by 1"]

  - method: POST
    path: "/lesson-enrollments/{enrollment_id}/end"
    description: "End a lesson enrollment"
    roles: [Customer, SalesAssociate]
    code: 200
    input: []
    output: LessonEnrollment
    side_effects: ["{ACTIVE,PAUSED} -> ENDED", "increments LessonEnrollment.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or body FK) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, numeric range violation" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "serial_number already used by another InventoryUnit with the same model_name" }
  - { id: ERR_RESERVATION_MISMATCH, http: 409, condition: "Agreement/layaway create on a unit not RESERVED for the given customer" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the resource's current version" }
  - { id: ERR_PLAN_NOT_RENT_TO_OWN, http: 409, condition: "Buyout attempted on a plain RENTAL agreement" }
  - { id: ERR_PAYOFF_MISMATCH, http: 422, condition: "Buyout amount_cents != current payoff_quote_cents" }
  - { id: ERR_OUTSTANDING_LATE_FEES, http: 409, condition: "Return blocked while late_fee_balance_cents > 0" }
  - { id: ERR_CREDIT_TOO_LOW, http: 422, condition: "Financing approval blocked: applicant credit_score < MIN_FINANCE_SCORE" }
  - { id: ERR_DEPOSIT_INSUFFICIENT, http: 422, condition: "Special-order deposit payment < required_deposit_cents" }
  - { id: ERR_LAYAWAY_NOT_PAID, http: 422, condition: "Layaway completion attempted while remaining_cents > 0" }
  - { id: ERR_TICKET_NOT_ASSIGNED, http: 403, condition: "Luthier acting on a ticket not assigned to them" }
  - { id: ERR_VALIDATION, http: 400, condition: "Pagination params out of range (limit/offset)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SalesAssociate
    description: "Floor sales staff: manages inventory, reservations, rentals, layaway, consignment sales, special orders, repair intake/close."
    identity: "opaque"
    exclusive_operations:
      - "POST /units/{id}/reserve — reserve a unit"
      - "POST /units/{id}/release — release a reservation"
      - "POST /rental-agreements — open an agreement"
      - "POST /layaway-plans — open a layaway plan"
      - "POST /layaway-plans/{id}/complete — complete a layaway"
      - "POST /layaway-plans/{id}/cancel — cancel a layaway"
      - "POST /repair-tickets — open a repair ticket"
      - "POST /repair-tickets/{id}/close — close a repair ticket"
      - "POST /repair-tickets/{id}/cancel — cancel a repair ticket"
      - "POST /consignment-listings/{id}/sell — sell a consignment"
      - "POST /special-orders/{id}/place — place a special order"
      - "POST /special-orders/{id}/receive — receive a special order"
      - "POST /special-orders/{id}/fulfill — fulfill a special order"
    shared_operations:
      - "POST /customers, POST /units, POST /consignment-listings, POST /consignment-listings/{id}/withdraw (with StoreManager)"
      - "POST /rental-agreements/{id}/payments, /buyout, /return (with Customer)"
      - "POST /rental-agreements/{id}/advance-cycle (with StoreManager)"
      - "POST /financing-applications, /special-orders, /lesson-enrollments and their pause/resume/end/pay-deposit/cancel (with Customer)"
      - "All GET reads"

  - name: Luthier
    description: "Bench technician: claims and works repair tickets through the luthier workflow."
    identity: "opaque"
    exclusive_operations:
      - "POST /repair-tickets/{id}/claim — claim an INTAKE ticket"
      - "POST /repair-tickets/{id}/await-parts — move to AWAITING_PARTS"
      - "POST /repair-tickets/{id}/resume — resume work"
      - "POST /repair-tickets/{id}/ready — mark repair ready"
    shared_operations:
      - "GET /repair-tickets, GET /repair-tickets/{id}"

  - name: StoreManager
    description: "Manager: approves financing, values and accepts trade-ins, repossesses defaulted units, sets the logical clock, withdraws consignments."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc — set logical clock"
      - "POST /trade-ins — create a trade-in offer"
      - "POST /trade-ins/{id}/accept — accept a trade-in"
      - "POST /financing-applications/{id}/approve — approve financing"
      - "POST /financing-applications/{id}/deny — deny financing"
      - "POST /rental-agreements/{id}/repossess — repossess a defaulted unit"
    shared_operations:
      - "POST /customers, POST /units, POST /consignment-listings, POST /consignment-listings/{id}/withdraw (with SalesAssociate)"
      - "POST /rental-agreements/{id}/advance-cycle (with SalesAssociate)"
      - "All GET reads"

  - name: Customer
    description: "End customer: views own resources, makes rent/layaway/deposit payments, exercises buyout/return, manages own financing/lessons/special orders."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /rental-agreements/{id}/payments, /buyout, /return (with SalesAssociate)"
      - "POST /layaway-plans/{id}/payments (with SalesAssociate)"
      - "POST /financing-applications, /financing-applications/{id}/cancel"
      - "POST /trade-ins/{id}/decline (with StoreManager)"
      - "POST /special-orders, /special-orders/{id}/pay-deposit, /special-orders/{id}/cancel (with SalesAssociate)"
      - "POST /lesson-enrollments and pause/resume/end (with SalesAssociate)"
      - "GET reads on own resources"
