      - name: corner_fulfill_accommodation_on_remediation_route_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=71]
          - entities.Complaint.fields.route
        distinguishing_aspect: "fulfill-accommodation on a complaint triaged to the REMEDIATION route returns ERR_COMPLAINT_ROUTE_MISMATCH 409 rather than a state error: the complaint IS in TRIAGED, only the branch is wrong."
        test_recipe:
          setup: ["One complaint on a product with one component, TRIAGED with route REMEDIATION"]
          setup_api_calls:
