scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (two different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ahi_inlab_vs_rei_hst_identical_event_counts
        grounds:
          - calculations.ahi_rdi_rei_computation
          - calculations.severity_classification
          - entities.ScoringTask.fields.ahi
          - entities.ScoringTask.fields.rei
        distinguishing_aspect: |
          Same raw event counts (30 obstructive + 60 hypopneas = 90 events) yield AHI 15.0
          (MODERATE) on an in-lab PSG with TST 360 but REI 11.3 (MILD) on an HST with
          recording time 480 — the two variants live on the ScoringTask/SleepStudy domain
          and diverge purely by denominator choice (sleep time vs recording time).
        test_recipe:
          setup:
            - "PSG study P scored with O=30,C=0,M=0,H=60,RERAs=30,TST=360,TRT=420; report signed"
            - "HST study H scored with identical counts, TRT=480; report signed"
            - "Logical clock default 2026-08-01T00:00:00Z; both studies scheduled 2026-08-01"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-D1A-01", full_name: "Pat One", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "RPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /scorers", payload: { full_name: "Scorer One", credential: "RPSGT", npi: "NPI-S1" }, as: LabDirector, captures: { s1: $.data.id } }
            - { call: "POST /physicians", payload: { full_name: "Doc One", npi: "NPI-P1", board_certified: true }, as: LabDirector, captures: { dr1: $.data.id } }
            - { call: "POST /beds", payload: { room_label: "B1", titration_capable: false }, as: LabDirector, captures: { bed1: $.data.id } }
            - { call: "POST /staffing-assignments", payload: { technologist_id: "${t1}", shift_date: "2026-08-01", patient_capacity: 2 }, as: LabDirector, captures: { st_a1: $.data.id } }
            - { call: "POST /staffing-assignments/${st_a1}/confirm", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            # --- PSG leg ---
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "PSG_DIAGNOSTIC", icd10_primary: "G47.33", priority: "ROUTINE" }, as: Scheduler, captures: { o_psg: $.data.id, o_psg_v: $.data.version } }
            - { call: "POST /referral-orders/${o_psg}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-PSG-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o_psg_v}" }, as: Scheduler, captures: { a_psg: $.data.id } }
            - { call: "POST /authorizations/${a_psg}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o_psg}", study_type: "PSG_DIAGNOSTIC", scheduled_date: "2026-08-01", bed_id: "${bed1}" }, as: Scheduler, captures: { st_psg: $.data.id } }
            - { call: "POST /sleep-studies/${st_psg}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /sleep-studies/${st_psg}/complete-acquisition", payload: { total_recording_time_minutes: 420 }, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st_psg}", scorer_id: "${s1}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tk_psg: $.data.id } }
            - { call: "POST /scoring-tasks/${tk_psg}/start", payload: {}, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk_psg}/submit", payload: { obstructive_apneas: 30, central_apneas: 0, mixed_apneas: 0, hypopneas: 60, reras: 30, epochs_total: 720, total_sleep_time_minutes: 360, total_recording_time_minutes: 420 }, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk_psg}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "GET /sleep-studies/${st_psg}", payload: {}, as: LabDirector, captures: { st_psg_v: $.data.version } }
            - { call: "POST /interpretation-reports", payload: { study_id: "${st_psg}", primary_scoring_task_id: "${tk_psg}", diagnosis_code: "G47.33", expected_sleep_study_version: "${st_psg_v}" }, as: InterpretingPhysician, as_user_id: "${dr1}", captures: { r_psg: $.data.id } }
            - { call: "POST /interpretation-reports/${r_psg}/sign", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            # --- HST leg ---
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33", priority: "ROUTINE" }, as: Scheduler, captures: { o_hst: $.data.id, o_hst_v: $.data.version } }
            - { call: "POST /referral-orders/${o_hst}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-HST-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o_hst_v}" }, as: Scheduler, captures: { a_hst: $.data.id } }
            - { call: "POST /authorizations/${a_hst}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o_hst}", study_type: "HST", scheduled_date: "2026-08-01" }, as: Scheduler, captures: { st_hst: $.data.id } }
            - { call: "POST /sleep-studies/${st_hst}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /sleep-studies/${st_hst}/complete-acquisition", payload: { total_recording_time_minutes: 480 }, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st_hst}", scorer_id: "${s1}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tk_hst: $.data.id } }
            - { call: "POST /scoring-tasks/${tk_hst}/start", payload: {}, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk_hst}/submit", payload: { obstructive_apneas: 30, central_apneas: 0, mixed_apneas: 0, hypopneas: 60, reras: 30, epochs_total: 960, total_recording_time_minutes: 480 }, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk_hst}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "GET /sleep-studies/${st_hst}", payload: {}, as: LabDirector, captures: { st_hst_v: $.data.version } }
            - { call: "POST /interpretation-reports", payload: { study_id: "${st_hst}", primary_scoring_task_id: "${tk_hst}", diagnosis_code: "G47.33", expected_sleep_study_version: "${st_hst_v}" }, as: InterpretingPhysician, as_user_id: "${dr1}", captures: { r_hst: $.data.id } }
            - { call: "POST /interpretation-reports/${r_hst}/sign", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
          trigger:
            - { call: "GET /scoring-tasks/${tk_psg}", payload: {}, as: LabDirector }
            - { call: "GET /scoring-tasks/${tk_hst}", payload: {}, as: LabDirector }
            - { call: "GET /interpretation-reports/${r_psg}", payload: {}, as: LabDirector }
            - { call: "GET /interpretation-reports/${r_hst}", payload: {}, as: LabDirector }
          assert:
            - "ScoringTask.${tk_psg}.ahi == 15.0 and .rdi == 20.0 and .rei is null"
            - "ScoringTask.${tk_hst}.rei == 11.3 (round_half_up of 11.25, not 11.2) and .ahi is null and .rdi is null"
            - "InterpretationReport.${r_psg}.severity == MODERATE and .index_at_interpretation == 15.0"
            - "InterpretationReport.${r_hst}.severity == MILD and .index_at_interpretation == 11.3"

      - name: turnaround_business_vs_calendar_weekend_span
        grounds:
          - calculations.interpretation_turnaround
          - entities.InterpretationReport.fields.turnaround_business_hours
          - entities.InterpretationReport.fields.turnaround_calendar_hours
          - entities.InterpretationReport.fields.sla_breached
        distinguishing_aspect: |
          Same acquisition->sign interval (Fri 22:00 to Mon 10:00) yields calendar 60.0h but
          business 2.0h on the InterpretationReport domain; the ROUTINE breach verdict (false)
          follows the business variant while the stored calendar variant crosses the STAT
          threshold — a different entity domain than the AHI/REI scoring variant.
        test_recipe:
          setup:
            - "HST study scheduled Friday 2026-08-07, acquisition completed Fri 22:00Z, scored and accepted"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-D1B-01", full_name: "Pat Two", date_of_birth: "1971-02-02" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "RPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /scorers", payload: { full_name: "Scorer One", credential: "RPSGT", npi: "NPI-S1" }, as: LabDirector, captures: { s1: $.data.id } }
            - { call: "POST /physicians", payload: { full_name: "Doc One", npi: "NPI-P1" }, as: LabDirector, captures: { dr1: $.data.id } }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33", priority: "ROUTINE" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "HST", scheduled_date: "2026-08-07" }, as: Scheduler, captures: { st1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sleep-studies/${st1}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T22:00:00Z" }, as: LabDirector }
            - { call: "POST /sleep-studies/${st1}/complete-acquisition", payload: { total_recording_time_minutes: 480 }, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st1}", scorer_id: "${s1}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tk1: $.data.id } }
            - { call: "POST /scoring-tasks/${tk1}/start", payload: {}, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/submit", payload: { obstructive_apneas: 20, central_apneas: 0, mixed_apneas: 0, hypopneas: 28, reras: 0, epochs_total: 960, total_recording_time_minutes: 480 }, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "GET /sleep-studies/${st1}", payload: {}, as: LabDirector, captures: { st1_v: $.data.version } }
            - { call: "POST /interpretation-reports", payload: { study_id: "${st1}", primary_scoring_task_id: "${tk1}", diagnosis_code: "G47.33", expected_sleep_study_version: "${st1_v}" }, as: InterpretingPhysician, as_user_id: "${dr1}", captures: { r1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: LabDirector }
          trigger:
            - { call: "POST /interpretation-reports/${r1}/sign", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
          assert:
            - "InterpretationReport.${r1}.turnaround_calendar_hours == 60.0"
            - "InterpretationReport.${r1}.turnaround_business_hours == 2.0"
            - "InterpretationReport.${r1}.sla_breached == false (ROUTINE uses the business variant)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) multi-input gate vs (b) pinned rounding order)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: split_night_multi_input_gate_override_band
        grounds:
          - calculations.split_night_eligibility
          - state_machines.SleepStudy.IN_PROGRESS_to_IN_PROGRESS
        distinguishing_aspect: |
          Mode (a) combinatorial gate with four interacting inputs: partial_ahi 35.0 sits in
          the [20,40) override band, so the SAME minutes (130) and remaining time (200) are
          rejected without override_reason (ERR_SPLIT_AHI_THRESHOLD_NOT_MET) yet accepted with
          it — the outcome is a non-linear function of the flag, not of any single threshold.
        test_recipe:
          setup:
            - "SPLIT_NIGHT study IN_PROGRESS on 2026-08-01 with titration-capable bed and confirmed staffing"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-D2A-01", full_name: "Pat Three", date_of_birth: "1972-03-03" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "RPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /beds", payload: { room_label: "B1", titration_capable: true }, as: LabDirector, captures: { bed1: $.data.id } }
            - { call: "POST /staffing-assignments", payload: { technologist_id: "${t1}", shift_date: "2026-08-01", patient_capacity: 2 }, as: LabDirector, captures: { sa1: $.data.id } }
            - { call: "POST /staffing-assignments/${sa1}/confirm", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "SPLIT_NIGHT", icd10_primary: "G47.33", priority: "ROUTINE" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "SPLIT_NIGHT", scheduled_date: "2026-08-01", bed_id: "${bed1}" }, as: Scheduler, captures: { st1: $.data.id } }
            - { call: "POST /sleep-studies/${st1}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
          trigger:
            - call: "POST /sleep-studies/${st1}/split-decision"
              payload: { intended_outcome: "CONVERT_TO_TITRATION", diagnostic_minutes_observed: 130, partial_ahi_observed: 35.0, central_predominance_flag: false, remaining_minutes_available: 200 }
              as: SleepTechnologist
              as_user_id: "${t1}"
              captures: { err1: $.data.error_id }
            - call: "POST /sleep-studies/${st1}/split-decision"
              payload: { intended_outcome: "CONVERT_TO_TITRATION", diagnostic_minutes_observed: 130, partial_ahi_observed: 35.0, central_predominance_flag: false, remaining_minutes_available: 200, override_reason: "clinical judgment documented" }
              as: SleepTechnologist
              as_user_id: "${t1}"
          assert:
            - "First trigger rejected with error_id ERR_SPLIT_AHI_THRESHOLD_NOT_MET (422); study.split_outcome remains null"
            - "Second trigger succeeds: SleepStudy.${st1}.split_outcome == CONVERT_TO_TITRATION, split_diagnostic_minutes == 130, split_partial_ahi == 35.0"

      - name: rolling_agreement_per_case_then_mean_rounding_order
        grounds:
          - calculations.inter_rater_agreement
          - entities.Scorer.fields.rolling_agreement_index
        distinguishing_aspect: |
          Mode (b) nested rounding: per-case percent_agreement is rounded to 2 decimals at
          case level (86.30, 85.67, 87.67 from 863/1000, 257/300, 789/900) and the rolling
          index then averages the STORED rounded values and rounds once more -> 86.55;
          averaging raw ratios first would yield 86.54 — the pinned order is observable.
        test_recipe:
          setup:
            - "Three HST studies, each with ACCEPTED PRIMARY by scorer S1 (REI 10.0) and ACCEPTED RELIABILITY_RESCORE by pool scorer S2 (REI 9.5)"
            - "Three OPEN InterRaterCases pairing them, epochs_total 1000/300/900 on the rescore tasks"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-D2B-01", full_name: "Pat Four", date_of_birth: "1973-04-04" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "RPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /scorers", payload: { full_name: "Scorer Ref", credential: "RPSGT", npi: "NPI-S1" }, as: LabDirector, captures: { s1: $.data.id } }
            - { call: "POST /scorers", payload: { full_name: "Scorer Subj", credential: "RST", npi: "NPI-S2", reliability_pool: true }, as: LabDirector, captures: { s2: $.data.id } }
            - { call: "POST /physicians", payload: { full_name: "Doc One", npi: "NPI-P1" }, as: LabDirector, captures: { dr1: $.data.id } }
            # --- study A (epochs 1000) ---
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { oa: $.data.id, oa_v: $.data.version } }
            - { call: "POST /referral-orders/${oa}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-A", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${oa_v}" }, as: Scheduler, captures: { aa: $.data.id } }
            - { call: "POST /authorizations/${aa}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${oa}", study_type: "HST", scheduled_date: "2026-08-01" }, as: Scheduler, captures: { sta: $.data.id } }
            - { call: "POST /sleep-studies/${sta}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /sleep-studies/${sta}/complete-acquisition", payload: { total_recording_time_minutes: 360 }, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${sta}", scorer_id: "${s1}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tka: $.data.id } }
            - { call: "POST /scoring-tasks/${tka}/start", payload: {}, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tka}/submit", payload: { obstructive_apneas: 30, central_apneas: 0, mixed_apneas: 0, hypopneas: 30, reras: 0, epochs_total: 1000, total_recording_time_minutes: 360 }, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tka}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${sta}", scorer_id: "${s2}", assignment_kind: "RELIABILITY_RESCORE" }, as: LabDirector, captures: { rta: $.data.id } }
            - { call: "POST /scoring-tasks/${rta}/start", payload: {}, as: Scorer, as_user_id: "${s2}" }
            - { call: "POST /scoring-tasks/${rta}/submit", payload: { obstructive_apneas: 27, central_apneas: 0, mixed_apneas: 0, hypopneas: 30, reras: 0, epochs_total: 1000, total_recording_time_minutes: 360 }, as: Scorer, as_user_id: "${s2}" }
            - { call: "POST /scoring-tasks/${rta}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "POST /inter-rater-cases", payload: { study_id: "${sta}", primary_task_id: "${tka}", rescore_task_id: "${rta}" }, as: LabDirector, captures: { ca: $.data.id } }
            - { call: "POST /inter-rater-cases/${ca}/adjudicate", payload: { epochs_concordant: 863 }, as: LabDirector }
            # --- study B (epochs 300) ---
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { ob: $.data.id, ob_v: $.data.version } }
            - { call: "POST /referral-orders/${ob}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-B", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${ob_v}" }, as: Scheduler, captures: { ab: $.data.id } }
            - { call: "POST /authorizations/${ab}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${ob}", study_type: "HST", scheduled_date: "2026-08-01" }, as: Scheduler, captures: { stb: $.data.id } }
            - { call: "POST /sleep-studies/${stb}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /sleep-studies/${stb}/complete-acquisition", payload: { total_recording_time_minutes: 360 }, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${stb}", scorer_id: "${s1}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tkb: $.data.id } }
            - { call: "POST /scoring-tasks/${tkb}/start", payload: {}, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tkb}/submit", payload: { obstructive_apneas: 30, central_apneas: 0, mixed_apneas: 0, hypopneas: 30, reras: 0, epochs_total: 1000, total_recording_time_minutes: 360 }, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tkb}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${stb}", scorer_id: "${s2}", assignment_kind: "RELIABILITY_RESCORE" }, as: LabDirector, captures: { rtb: $.data.id } }
            - { call: "POST /scoring-tasks/${rtb}/start", payload: {}, as: Scorer, as_user_id: "${s2}" }
            - { call: "POST /scoring-tasks/${rtb}/submit", payload: { obstructive_apneas: 27, central_apneas: 0, mixed_apneas: 0, hypopneas: 30, reras: 0, epochs_total: 300, total_recording_time_minutes: 360 }, as: Scorer, as_user_id: "${s2}" }
            - { call: "POST /scoring-tasks/${rtb}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "POST /inter-rater-cases", payload: { study_id: "${stb}", primary_task_id: "${tkb}", rescore_task_id: "${rtb}" }, as: LabDirector, captures: { cb: $.data.id } }
            - { call: "POST /inter-rater-cases/${cb}/adjudicate", payload: { epochs_concordant: 257 }, as: LabDirector }
            # --- study C (epochs 900) ---
