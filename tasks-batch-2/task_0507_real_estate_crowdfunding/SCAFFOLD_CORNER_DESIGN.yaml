  # =========================================================================
  # Section: cross_cutting_complexity_layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_fund_version_on_subscription_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[subscription-create-stale-fund]", "errors[ERR_STALE_FUND_VERSION]"]
        distinguishing_aspect: "After a first subscription create bumps Fund.version, a second create still carrying the pre-bump expected_fund_version is rejected ERR_STALE_FUND_VERSION (412)."
        test_recipe:
          setup: ["Fund OPEN; approved investor; client observes fund_v0 then creates one subscription (Fund.version advances)."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Fund OCC", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "occ@x.com", full_name: "OCC", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub1: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_FUND_VERSION"

      - name: occ_correct_holding_version_on_redemption_create_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[redemption-create-stale-holding]", entities.Holding.fields.version]
        distinguishing_aspect: "Creating a RedemptionRequest with the holding's current version succeeds (201, QUEUED), confirming the OCC happy path and that Holding.version increments on the create."
        test_recipe:
          setup: ["Settled holding of 1000 shares; client reads current holding version."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Fund OK", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "ok@x.com", full_name: "OK", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id }
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
              captures: { holding: $.data.holding_id }
            - call: "GET /holdings/${holding}"
              payload: {}
              as: Operator
              captures: { hv: $.data.version }
          trigger:
            - call: "POST /redemption-requests"
              payload: { holding_id: "${holding}", shares_requested: 100, expected_holding_version: "${hv}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { rr: $.data.id, st: $.data.status }
          assert:
            - "RedemptionRequest.${rr}.status == QUEUED"

      - name: derived_field_ytd_invested_reconciled_after_settle
        claim_type: derived_field_reconciliation
        grounds: [calculations.ytd_invested, entities.Investor.fields.ytd_invested_cents]
        distinguishing_aspect: "After a single 700000 settle, investor.ytd_invested_cents == 700000 (derived field recomputed on settle from SETTLED subscriptions in the tax year)."
        test_recipe:
          setup: ["Non-accredited investor cap 1200000; one 700000 subscription settled."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Operator
            - call: "POST /funds"
              payload: { name: "Fund YT", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "yt@x.com", full_name: "YT", accredited_status: "NON_ACCREDITED", annual_income_cents: 8000000, net_worth_cents: 12000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 700000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
            - call: "GET /investors/${inv}"
              payload: {}
              as: Operator
              captures: { ytd: $.data.ytd_invested_cents }
          assert:
            - "Investor.${inv}.ytd_invested_cents == 700000"

      - name: tax_year_threshold_excludes_other_year_distributions
        claim_type: rate_threshold_triggers
        grounds: [calculations.tax_document_totals, entities.TaxDocument.fields.ordinary_dividends_cents]
        distinguishing_aspect: "A 1099-DIV for tax_year 2026 sums only CASH allocations from PAID distributions whose period_label year is 2026; the holding's single 2026 CASH dividend of 2500 yields ordinary_dividends_cents==2500 and doc_type==FORM_1099_DIV."
        test_recipe:
          setup: ["REIT fund; one settled CASH holding 1000 shares; NAV 1000; one PAID distribution 2026-Q1 at 2.5c/share (2500 cents)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Operator
            - call: "POST /funds"
              payload: { name: "Fund TX", vehicle_type: "REIT", gross_asset_value_cents: 1000000, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "tx@x.com", full_name: "TX", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, drip_elected: false, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id }
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
            - call: "POST /funds/${fund_id}/valuations"
              payload: { period_label: "2026-Q1", gross_asset_value_cents: 1000000, total_liabilities_cents: 0 }
              as: FundManager
            - call: "POST /funds/${fund_id}/distributions"
              payload: { period_label: "2026-Q1", dividend_per_share_cents: 2.5 }
              as: FundManager
              captures: { dist_id: $.data.id }
            - call: "POST /distributions/${dist_id}/pay"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /investors/${inv}/tax-documents"
              payload: { fund_id: "${fund_id}", tax_year: 2026 }
              as: ComplianceOfficer
              captures: { dt: $.data.doc_type, ord: $.data.ordinary_dividends_cents }
          assert:
            - "TaxDocument.ordinary_dividends_cents == 2500"
            - "TaxDocument.doc_type == FORM_1099_DIV"

      - name: partnership_fund_generates_k1_tax_document
        claim_type: conditional_feature_flags
        grounds: [calculations.tax_document_totals, entities.Fund.fields.vehicle_type, entities.TaxDocument.fields.doc_type]
        distinguishing_aspect: "For a PARTNERSHIP-vehicle fund the generated tax document doc_type == FORM_K1 (vs FORM_1099_DIV for REIT), behavior keyed on Fund.vehicle_type."
        test_recipe:
