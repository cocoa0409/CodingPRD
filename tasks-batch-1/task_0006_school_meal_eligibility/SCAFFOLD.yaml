scenario: |
  K-12 School Meal Eligibility Review: Free/Reduced Lunch (FRL) application,
  household income review, automatic renewal, allergy profile, menu nutrition
  labeling, USDA reimbursement, parent account top-up

domain_name: "school-meal-eligibility"
api_prefix: "/school-meals"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_actions
    - optimistic_concurrency
    - rate_threshold_triggers
    - cascading_side_effects

  entity_topology: flat
  state_machine_shape: branching          # MealApplication: branching+revert+cycle; EligibilityDetermination: parallel dimensions
  relationship_patterns:
    - one_to_many                          # Household -> Students; ParentAccount -> LedgerEntries
    - cross_aggregate                      # ServiceTransaction references EligibilityDetermination AND MenuItem AND ParentAccount
  role_model: approval_chain               # Parent -> SchoolStaff -> DistrictReviewer -> USDAAuditor
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: primary_parent_name
        type: string
        source: input
        description: "Full name of the responsible parent/guardian"
      - name: family_size
        type: integer
        source: input
        description: "Number of household members including dependents; integer >= 1"
        constraints: ">= 1, <= 20"
      - name: annual_income_cents
        type: integer
        source: input
        description: "Reported gross annual household income, in whole US cents; integer >= 0"
        constraints: ">= 0"
      - name: address_state
        type: enum
        source: input
        description: "Two-letter US state code (uppercase). Determines which FPL table applies (CONTIGUOUS, ALASKA, HAWAII)."
        constraints: "two-letter uppercase US state code"
      - name: direct_certification_flag
        type: boolean
        source: input
        description: "True if the household is enrolled in SNAP/TANF/FDPIR and eligible for automatic FREE certification without an application"
        default: false

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household this student belongs to"
      - name: full_name
        type: string
        source: input
        description: "Student's full legal name"
      - name: school_code
        type: string
        source: input
        description: "School identifier code (e.g., 'ELEM-101'); used to scope menu items and reimbursement claims"
      - name: grade_level
        type: integer
        source: input
        description: "Grade 0 (K) through 12"
        constraints: ">= 0, <= 12"

  - name: AllergyProfile
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; one AllergyProfile per Student (1:1)"
      - name: allergens
        type: array
        source: input
        description: "Array of allergen codes (uppercase). Enum members: PEANUT, TREE_NUT, MILK, EGG, SOY, WHEAT, FISH, SHELLFISH"
        default: []
        constraints: "values from {PEANUT, TREE_NUT, MILK, EGG, SOY, WHEAT, FISH, SHELLFISH}; no duplicates"
      - name: severity
        type: enum
        source: input
        description: "Overall severity classification: MILD, MODERATE, SEVERE_ANAPHYLACTIC"
        default: MILD
        constraints: "enum: MILD | MODERATE | SEVERE_ANAPHYLACTIC"

  - name: MealApplication
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household applying for FRL"
      - name: status
        type: enum
        source: system
        description: "Lifecycle status. Enum: DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, DENIED, APPEALED, WITHDRAWN"
        default: DRAFT
      - name: snapshot_family_size
        type: integer
        source: system
        description: "Family size snapshotted at SUBMITTED transition; pinned so later edits to Household.family_size do not retroactively change this application's tier"
      - name: snapshot_annual_income_cents
        type: integer
        source: system
        description: "Household income snapshotted at SUBMITTED transition; pinned for the same reason"
      - name: snapshot_address_state
        type: string
        source: system
        description: "Address state snapshotted at SUBMITTED transition; selects which FPL table is used for tier determination"
      - name: school_year
        type: string
        source: input
        description: "School year label, e.g. '2025-2026'; determines which FPL table revision applies"
      - name: decision_reason
        type: string
        source: system
        description: "Free-form reason text recorded at APPROVED/DENIED transition; required for DENIED"
        default: null
      - name: appeal_reason
        type: string
        source: system
        description: "Free-form reason text recorded at APPEALED transition (parent's appeal)"
        default: null

  - name: EligibilityDetermination
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household this eligibility applies to"
      - name: source_application_id
        type: string
        source: input
        description: "FK -> MealApplication.id; the application that produced this determination (null when source=DIRECT_CERTIFICATION)"
        default: null
      - name: source
        type: enum
        source: system
        description: "How this determination arose. Enum: APPLICATION (created from an APPROVED MealApplication), DIRECT_CERTIFICATION (created from Household.direct_certification_flag=true), AUTO_RENEWAL (created at start of new school year carrying prior tier)"
      - name: tier
        type: enum
        source: system
        description: "Granted eligibility tier. Enum: FREE, REDUCED, PAID. Determined by §1.3 calc determine_tier_from_income or pinned to FREE for DIRECT_CERTIFICATION."
      - name: lifecycle_status
        type: enum
        source: system
        description: "Lifecycle dimension. Enum: ACTIVE, SUPERSEDED, EXPIRED, REVOKED. Independent of verification_status."
        default: ACTIVE
      - name: verification_status
        type: enum
        source: system
        description: "Verification dimension. Enum: UNVERIFIED, VERIFIED, DEFERRED. Independent of lifecycle_status."
        default: UNVERIFIED
      - name: valid_from_utc
        type: datetime
        source: system
        description: "Closed start of validity window (inclusive). ISO 8601 UTC."
      - name: valid_to_utc
        type: datetime
        source: system
        description: "Open end of validity window (exclusive). ISO 8601 UTC. Set to school year end + 30 days carryover at creation; advanced on SUPERSEDED transition."

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - name: school_code
        type: string
        source: input
        description: "School identifier code this menu item belongs to; must match a Student.school_code value"
      - name: name
        type: string
        source: input
        description: "Menu item name (e.g., 'Cheese Pizza Slice')"
      - name: list_price_cents
        type: integer
        source: input
        description: "Paid-tier list price in whole US cents (charged to PAID-tier students)"
        constraints: ">= 0"
      - name: federal_reimbursement_free_cents
        type: integer
        source: input
        description: "USDA per-meal reimbursement rate (cents) when served to a FREE-tier student"
        constraints: ">= 0"
      - name: federal_reimbursement_reduced_cents
        type: integer
        source: input
        description: "USDA per-meal reimbursement rate (cents) when served to a REDUCED-tier student"
        constraints: ">= 0"
      - name: federal_reimbursement_paid_cents
        type: integer
        source: input
        description: "USDA per-meal reimbursement rate (cents) when served to a PAID-tier student"
        constraints: ">= 0"
      - name: allergens_present
        type: array
        source: input
        description: "Array of allergen codes contained in this item. Same enum domain as AllergyProfile.allergens."
        default: []
      - name: calories
        type: integer
        source: input
        description: "Calories per serving (label requirement)"
        constraints: ">= 0"

  - name: ParentAccount
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; one ParentAccount per Household (1:1)"
      - name: balance_cents
        type: integer
        source: computed
        description: "Current account balance in cents. Derived field equal to sum(CREDIT ledger entries) - sum(DEBIT ledger entries) for this account. Updated on every ledger entry creation."
        default: 0
      - name: daily_topup_total_cents
        type: integer
        source: computed
        description: "Sum of TOPUP CREDIT entries created today (UTC calendar day at server clock). Recomputed on every TOPUP attempt. Used to enforce DAILY_TOPUP_CAP_CENTS."
        default: 0
      - name: daily_topup_window_date
        type: string
        source: computed
        description: "ISO 8601 date (YYYY-MM-DD, UTC) of the calendar day daily_topup_total_cents covers. Reset to current day on each TOPUP attempt before the cap check."

  - name: LedgerEntry
    parent: null
    common_fields: false                  # immutable audit row: only id + created_at
    fields:
      - name: parent_account_id
        type: string
        source: input
        description: "FK -> ParentAccount.id; the account this entry affects"
      - name: entry_type
        type: enum
        source: input
        description: "Enum: TOPUP (CREDIT), MEAL_CHARGE (DEBIT), MEAL_REFUND (CREDIT), ADJUSTMENT (CREDIT or DEBIT depending on amount sign)"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed integer cents: positive for CREDIT, negative for DEBIT"
      - name: linked_transaction_id
        type: string
        source: input
        description: "FK -> ServiceTransaction.id when entry_type ∈ {MEAL_CHARGE, MEAL_REFUND}; null otherwise"
        default: null
      - name: idempotency_key
        type: string
        source: input
        description: "Client-supplied idempotency key (required for TOPUP only; unique per ParentAccount)"
        default: null

  - name: ServiceTransaction
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student being served"
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the meal being served"
      - name: eligibility_determination_id
        type: string
        source: system
        description: "FK -> EligibilityDetermination.id; the determination chosen by the server at PENDING creation per §1.3 select_active_determination (tied to the student's household, lifecycle_status==ACTIVE, server_clock within [valid_from_utc, valid_to_utc))"
      - name: applied_tier
        type: enum
        source: system
        description: "Tier copied from the chosen EligibilityDetermination at PENDING creation. Enum: FREE, REDUCED, PAID."
      - name: status
        type: enum
        source: system
        description: "Enum: PENDING, SETTLED, REJECTED, REFUNDED, DISPUTED"
        default: PENDING
      - name: paid_charge_cents
        type: integer
        source: computed
        description: "Amount charged to the parent account, in cents. Determined by §1.3 compute_paid_charge per applied_tier × MenuItem.list_price_cents."
      - name: federal_reimbursement_cents
        type: integer
        source: computed
        description: "USDA reimbursement portion in cents, copied from MenuItem.federal_reimbursement_<tier>_cents at SETTLED transition. Zero while PENDING."
        default: 0
      - name: rejection_reason
        type: enum
        source: system
        description: "Enum: ALLERGEN_CONFLICT, INELIGIBLE_STATE, INSUFFICIENT_FUNDS, MANUAL. Null while not REJECTED."
        default: null
      - name: served_at_utc
        type: datetime
        source: system
        description: "Server clock at PENDING creation (ISO 8601 UTC). Used to select active EligibilityDetermination and to bucket into reimbursement claims."

  - name: ReimbursementClaim
    parent: null
    common_fields: true
    fields:
      - name: school_code
        type: string
        source: input
        description: "School identifier code this claim aggregates for"
      - name: period_start_utc
        type: datetime
        source: input
        description: "Closed start of claim period (inclusive, ISO 8601 UTC)"
      - name: period_end_utc
        type: datetime
        source: input
        description: "Closed end of claim period (inclusive, ISO 8601 UTC). Two claims for the same school_code MUST be separated by a gap of at least 1 calendar day per §1.4 priority 11."
      - name: status
        type: enum
        source: system
        description: "Enum: DRAFT, SUBMITTED, FINALIZED, REJECTED"
        default: DRAFT
      - name: accounting_basis
        type: enum
        source: input
        description: "Enum: CASH (only SETTLED transactions in window count) | ACCRUAL (SETTLED + DISPUTED + REFUNDED net out). Pinned at claim creation; determines which §1.3 reimbursement variant runs."
      - name: total_reimbursement_cents
        type: integer
        source: computed
        description: "Sum over included ServiceTransactions of federal_reimbursement_cents per the chosen accounting_basis. Computed at SUBMITTED transition; immutable afterward."
        default: 0
      - name: included_transaction_count
        type: integer
        source: computed
        description: "Count of ServiceTransactions actually summed at SUBMITTED transition"
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MealApplication
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /school-meals/applications/{id}/submit"
        actor: Parent
        preconditions:
          - "MealApplication.status == DRAFT"
          - "Parent X-User-ID equals MealApplication.household_id (Parent is entity-backed by Household)"
          - "Household.annual_income_cents and family_size are present (non-null)"
        side_effects:
          - "Snapshot Household.family_size into MealApplication.snapshot_family_size"
          - "Snapshot Household.annual_income_cents into MealApplication.snapshot_annual_income_cents"
          - "Snapshot Household.address_state into MealApplication.snapshot_address_state"
          - "Increment MealApplication.version by 1; refresh updated_at"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /school-meals/applications/{id}/start-review"
        actor: SchoolStaff
        preconditions:
          - "MealApplication.status == SUBMITTED"
        side_effects:
          - "Increment MealApplication.version by 1; refresh updated_at"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /school-meals/applications/{id}/approve"
        actor: DistrictReviewer
        preconditions:
          - "MealApplication.status == UNDER_REVIEW"
          - "decision_reason payload field present (non-empty)"
        side_effects:
          - "Run §1.3 calc determine_tier_from_income using snapshot_* fields"
          - "Create a new EligibilityDetermination with source=APPLICATION, source_application_id=this.id, tier=<computed tier>, lifecycle_status=ACTIVE, verification_status=UNVERIFIED, valid_from_utc=server_clock_utc, valid_to_utc=school_year_end + 30 days (carryover)"
          - "For every prior EligibilityDetermination of the same household with lifecycle_status==ACTIVE, flip lifecycle_status to SUPERSEDED and set valid_to_utc=server_clock_utc (cascade depth 2)"
          - "For every ServiceTransaction with status==PENDING tied to any superseded determination, recompute paid_charge_cents using the NEW determination's tier (cascade depth 3) and update applied_tier + eligibility_determination_id"
          - "Set decision_reason on the MealApplication; increment MealApplication.version by 1; refresh updated_at"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /school-meals/applications/{id}/deny"
        actor: DistrictReviewer
        preconditions:
          - "MealApplication.status == UNDER_REVIEW"
          - "decision_reason payload field present (non-empty)"
        side_effects:
          - "Set decision_reason; increment MealApplication.version by 1; refresh updated_at"
          - "No EligibilityDetermination created"
      - from: DENIED
        to: APPEALED
        trigger: "POST /school-meals/applications/{id}/appeal"
        actor: Parent
        preconditions:
          - "MealApplication.status == DENIED"
          - "Parent X-User-ID equals MealApplication.household_id"
          - "appeal_reason payload field present (non-empty)"
          - "expected_mealapplication_version equals MealApplication.version (OCC)"
        side_effects:
          - "Set appeal_reason; increment MealApplication.version by 1; refresh updated_at"
      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /school-meals/applications/{id}/start-review"
        actor: SchoolStaff
        preconditions:
          - "MealApplication.status == APPEALED"
        side_effects:
          - "Increment MealApplication.version by 1; refresh updated_at (cyclic re-review path)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /school-meals/applications/{id}/withdraw"
        actor: Parent
        preconditions:
          - "MealApplication.status == DRAFT"
          - "Parent X-User-ID equals MealApplication.household_id"
        side_effects:
          - "Increment MealApplication.version by 1; refresh updated_at"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /school-meals/applications/{id}/withdraw"
        actor: Parent
        preconditions:
          - "MealApplication.status == SUBMITTED"
          - "Parent X-User-ID equals MealApplication.household_id"
        side_effects:
          - "Increment MealApplication.version by 1; refresh updated_at"

  - entity: EligibilityDetermination
    initial_state: "(lifecycle_status=ACTIVE, verification_status=UNVERIFIED)"
    terminal_states: ["(lifecycle_status=REVOKED)", "(lifecycle_status=EXPIRED)"]
    transitions:
      # Parallel dimensions: lifecycle_status × verification_status evolve independently.
      - from: "lifecycle_status=ACTIVE"
        to: "lifecycle_status=SUPERSEDED"
        trigger: "Side-effect of MealApplication APPROVED transition (newer determination created for same household)"
        actor: system
        preconditions:
          - "A newer EligibilityDetermination is being created for the same household_id"
          - "this.lifecycle_status == ACTIVE"
        side_effects:
          - "Set valid_to_utc = server_clock_utc"
          - "Increment EligibilityDetermination.version by 1; refresh updated_at"
      - from: "lifecycle_status=ACTIVE"
        to: "lifecycle_status=EXPIRED"
        trigger: "POST /school-meals/_clock/advance_and_expire"
        actor: system
        preconditions:
          - "server_clock_utc >= valid_to_utc"
          - "this.lifecycle_status == ACTIVE"
        side_effects:
          - "Increment EligibilityDetermination.version by 1; refresh updated_at"
      - from: "lifecycle_status=ACTIVE"
        to: "lifecycle_status=REVOKED"
        trigger: "POST /school-meals/eligibility-determinations/{id}/revoke"
        actor: USDAAuditor
        preconditions:
          - "this.lifecycle_status == ACTIVE"
          - "expected_eligibilitydetermination_version equals this.version (OCC)"
        side_effects:
          - "Set valid_to_utc = server_clock_utc"
          - "Increment EligibilityDetermination.version by 1; refresh updated_at"
      - from: "verification_status=UNVERIFIED"
        to: "verification_status=VERIFIED"
        trigger: "POST /school-meals/eligibility-determinations/{id}/verify"
        actor: USDAAuditor
        preconditions:
          - "this.verification_status == UNVERIFIED"
          - "this.lifecycle_status == ACTIVE"
        side_effects:
          - "Increment EligibilityDetermination.version by 1; refresh updated_at"
      - from: "verification_status=UNVERIFIED"
        to: "verification_status=DEFERRED"
        trigger: "POST /school-meals/eligibility-determinations/{id}/defer"
        actor: USDAAuditor
        preconditions:
          - "this.verification_status == UNVERIFIED"
          - "this.lifecycle_status == ACTIVE"
        side_effects:
          - "Increment EligibilityDetermination.version by 1; refresh updated_at"

  - entity: ServiceTransaction
    initial_state: PENDING
    terminal_states: [SETTLED, REJECTED, REFUNDED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /school-meals/service-transactions/{id}/settle"
        actor: SchoolStaff
        preconditions:
          - "ServiceTransaction.status == PENDING"
          - "EligibilityDetermination referenced by eligibility_determination_id has lifecycle_status==ACTIVE (cross-entity dependency)"
          - "ParentAccount(household_id).balance_cents >= ServiceTransaction.paid_charge_cents (sufficient funds)"
        side_effects:
          - "Create LedgerEntry: parent_account_id=<household account>, entry_type=MEAL_CHARGE, amount_cents=-paid_charge_cents, linked_transaction_id=this.id"
          - "Recompute ParentAccount.balance_cents from the ledger (derived-field reconciliation)"
          - "Set federal_reimbursement_cents to MenuItem.federal_reimbursement_<applied_tier>_cents"
          - "Increment ServiceTransaction.version by 1; refresh updated_at"
      - from: PENDING
        to: REJECTED
        trigger: "POST /school-meals/service-transactions/{id}/reject"
        actor: SchoolStaff
        preconditions:
          - "ServiceTransaction.status == PENDING"
          - "rejection_reason payload field present"
        side_effects:
          - "Set rejection_reason"
          - "Increment ServiceTransaction.version by 1; refresh updated_at"
      - from: SETTLED
        to: REFUNDED
        trigger: "POST /school-meals/service-transactions/{id}/refund"
        actor: SchoolStaff
        preconditions:
          - "ServiceTransaction.status == SETTLED"
          - "expected_servicetransaction_version equals ServiceTransaction.version (OCC)"
        side_effects:
          - "Create LedgerEntry: parent_account_id=<household account>, entry_type=MEAL_REFUND, amount_cents=+paid_charge_cents, linked_transaction_id=this.id (compensating-action: net ledger delta = 0)"
          - "Recompute ParentAccount.balance_cents from the ledger"
          - "Set federal_reimbursement_cents = 0 (USDA reimbursement reversed)"
          - "Increment ServiceTransaction.version by 1; refresh updated_at"
      - from: SETTLED
        to: DISPUTED
        trigger: "POST /school-meals/service-transactions/{id}/dispute"
        actor: Parent
        preconditions:
          - "ServiceTransaction.status == SETTLED"
          - "Parent X-User-ID equals Student.household_id of the transaction's student"
        side_effects:
          - "Increment ServiceTransaction.version by 1; refresh updated_at"
          - "No ledger movement at this hop"
      - from: DISPUTED
        to: REFUNDED
        trigger: "POST /school-meals/service-transactions/{id}/resolve-dispute"
        actor: DistrictReviewer
        preconditions:
          - "ServiceTransaction.status == DISPUTED"
          - "resolution payload field == 'REFUND'"
        side_effects:
          - "Create LedgerEntry: parent_account_id=<household account>, entry_type=MEAL_REFUND, amount_cents=+paid_charge_cents, linked_transaction_id=this.id"
          - "Recompute ParentAccount.balance_cents"
          - "Set federal_reimbursement_cents = 0"
          - "Increment ServiceTransaction.version by 1; refresh updated_at"
      - from: DISPUTED
        to: SETTLED
        trigger: "POST /school-meals/service-transactions/{id}/resolve-dispute"
        actor: DistrictReviewer
        preconditions:
          - "ServiceTransaction.status == DISPUTED"
          - "resolution payload field == 'UPHOLD'"
        side_effects:
          - "Increment ServiceTransaction.version by 1; refresh updated_at"
          - "No ledger movement (UPHOLD restores SETTLED with no compensation)"

  - entity: ReimbursementClaim
    initial_state: DRAFT
    terminal_states: [FINALIZED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /school-meals/reimbursement-claims/{id}/submit"
        actor: SchoolStaff
        preconditions:
          - "ReimbursementClaim.status == DRAFT"
          - "Every ServiceTransaction with served_at_utc ∈ [period_start_utc, period_end_utc] for any student of this school_code has status ∈ {SETTLED, REJECTED, REFUNDED} (NO PENDING, NO DISPUTED) — cross-entity dependency"
        side_effects:
          - "Run §1.3 calc compute_claim_reimbursement using ReimbursementClaim.accounting_basis"
          - "Set total_reimbursement_cents, included_transaction_count"
          - "Increment ReimbursementClaim.version by 1; refresh updated_at"
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /school-meals/reimbursement-claims/{id}/finalize"
        actor: USDAAuditor
        preconditions:
          - "ReimbursementClaim.status == SUBMITTED"
        side_effects:
          - "Increment ReimbursementClaim.version by 1; refresh updated_at"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /school-meals/reimbursement-claims/{id}/reject"
        actor: USDAAuditor
        preconditions:
          - "ReimbursementClaim.status == SUBMITTED"
          - "rejection_reason payload field present"
        side_effects:
          - "Increment ReimbursementClaim.version by 1; refresh updated_at"

# =============================================================================
# §1.2.1 Concurrency Rules — true OCC races only (see SKILL.md §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: appeal-stale-application
    parent_entity: MealApplication
    write_endpoint: "POST /school-meals/applications/{id}/appeal"
    occ_field: "expected_mealapplication_version"
    description: |
      Submitting an appeal against a DENIED MealApplication whose version has
      advanced since the client last observed it is rejected. Captures the case
      where another process (e.g., an administrator's clarification edit that
      bumped the application's version) has changed the application between
      the parent's last read and the appeal submission; the parent's view is
      stale, and OCC rejects the appeal so the parent can re-read before
      re-submitting.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: revoke-stale-determination
    parent_entity: EligibilityDetermination
    write_endpoint: "POST /school-meals/eligibility-determinations/{id}/revoke"
    occ_field: "expected_eligibilitydetermination_version"
    description: |
      Revoking an EligibilityDetermination whose version has advanced since
      the auditor last observed it is rejected. Captures the case where a
      verification or defer transition on the same determination has occurred
      since the auditor's read; the auditor must re-read before revoking.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: refund-stale-transaction
    parent_entity: ServiceTransaction
    write_endpoint: "POST /school-meals/service-transactions/{id}/refund"
    occ_field: "expected_servicetransaction_version"
    description: |
      Refunding a SETTLED ServiceTransaction whose version has advanced since
      the staff last observed it is rejected. Captures the case where the
      transaction has since transitioned to DISPUTED (which bumps version);
      a refund against the stale SETTLED view would double-compensate.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: determine_tier_from_income
    trigger: "Side-effect of MealApplication APPROVED transition (POST /school-meals/applications/{id}/approve)"
    algorithm: threshold
    formula: |
      # Household monthly income (cents), compared to FPL_MONTHLY (cents) for family_size.
      # Rounding order is pinned (combinatorial Rule 2 mode b):
      #   step 1: household_monthly_cents = round_half_up(snapshot_annual_income_cents / 12)
      #           (annual ÷ 12 then rounded BEFORE the comparison; sum-then-round vs round-then-compare
      #            yields different tiers at exact boundaries.)
      #   step 2: select FPL_MONTHLY row for region(snapshot_address_state) ∈ {CONTIGUOUS, ALASKA, HAWAII}
      #   step 3: fpl_monthly_cents = FPL_MONTHLY_<region>[snapshot_family_size] * 100
      #   step 4: threshold_free_cents    = floor(fpl_monthly_cents * FREE_PCT)        # integer cents, floored
      #           threshold_reduced_cents = floor(fpl_monthly_cents * REDUCED_PCT)
      #   step 5: compare household_monthly_cents (integer) against thresholds with <= (inclusive)
      if Household.direct_certification_flag == true:
          return FREE
      household_monthly_cents = round_half_up(snapshot_annual_income_cents / 12)
      fpl_monthly_cents = FPL_MONTHLY_<region>[snapshot_family_size] * 100
      threshold_free_cents    = floor(fpl_monthly_cents * FREE_PCT)
      threshold_reduced_cents = floor(fpl_monthly_cents * REDUCED_PCT)
      if household_monthly_cents <= threshold_free_cents:
          return FREE
      elif household_monthly_cents <= threshold_reduced_cents:
          return REDUCED
      else:
          return PAID
    input_set: "MealApplication.snapshot_family_size, snapshot_annual_income_cents, snapshot_address_state (all pinned at SUBMITTED); FPL_MONTHLY_* constants selected by region(state)"
    constants:
      FREE_PCT: 1.30                       # 130% of FPL — FREE if household_monthly_income <= 130% * FPL_MONTHLY
      REDUCED_PCT: 1.85                    # 185% of FPL — REDUCED if 130% < household_monthly_income <= 185% * FPL_MONTHLY
      FPL_MONTHLY_CONTIGUOUS:              # dollars per month, by family_size; 2025 SY values
        1: 1255
        2: 1704
        3: 2152
        4: 2600
        5: 3049
        6: 3497
        7: 3946
        8: 4394
      FPL_MONTHLY_ALASKA:
        1: 1569
        2: 2129
        3: 2690
        4: 3251
        5: 3811
        6: 4372
        7: 4933
        8: 5494
      FPL_MONTHLY_HAWAII:
        1: 1443
        2: 1960
        3: 2476
        4: 2993
        5: 3509
        6: 4026
        7: 4543
        8: 5059
      REGION_MAP:                          # snapshot_address_state -> region key
        AK: ALASKA
        HI: HAWAII
        _default: CONTIGUOUS               # all other states map to CONTIGUOUS
    precision: "household_monthly_cents uses round_half_up at the divide-by-12 step; thresholds use floor (integer truncation). All comparisons are integer-vs-integer cents."

  - name: compute_paid_charge
    trigger: "Side-effect of ServiceTransaction PENDING creation (POST /school-meals/service-transactions) AND on tier re-binding cascade from MealApplication APPROVED (depth-3 link)"
    algorithm: tiered_pricing
    formula: |
      # Tiered pricing with conditional surcharge — Rule 2 mode (a), non-linear combination of 3+ inputs.
      base_cents = MenuItem.list_price_cents
      if applied_tier == FREE:
          tier_cents = 0
      elif applied_tier == REDUCED:
          tier_cents = min(REDUCED_PRICE_CAP_CENTS, round_half_up(base_cents * REDUCED_DISCOUNT_FACTOR))
      else:  # PAID
          tier_cents = base_cents
      # Allergen-substitution surcharge: applied only if MenuItem.allergens_present intersects AllergyProfile.allergens
      # AND a substitution is requested in the payload AND the student has a recorded allergy profile.
      if request.substitute_for_allergen == true and intersect(MenuItem.allergens_present, AllergyProfile.allergens) and applied_tier != FREE:
          tier_cents = tier_cents + ALLERGEN_SUB_SURCHARGE_CENTS
      return tier_cents
    input_set: "applied_tier (from chosen EligibilityDetermination), MenuItem.list_price_cents, MenuItem.allergens_present, AllergyProfile.allergens for student, request.substitute_for_allergen flag"
    constants:
      REDUCED_DISCOUNT_FACTOR: 0.10        # REDUCED-tier students pay 10% of list_price (capped at REDUCED_PRICE_CAP_CENTS=40 cents per USDA rule)
      REDUCED_PRICE_CAP_CENTS: 40
      ALLERGEN_SUB_SURCHARGE_CENTS: 25
    precision: "round_half_up at the discount multiplication step; integer cents thereafter"
    variants:
      - name: standard_application_based
        when: "applied_tier was determined via APPLICATION-source EligibilityDetermination (Household completed a MealApplication that APPROVED)"
        difference: "applied_tier reflects calculated tier from snapshot income (FREE/REDUCED/PAID per §1.3 determine_tier_from_income)"
      - name: direct_certification
        when: "applied_tier was determined via DIRECT_CERTIFICATION-source EligibilityDetermination (Household.direct_certification_flag==true at the time the determination was created — no application required)"
        difference: "applied_tier is pinned to FREE regardless of income; tier_cents is ALWAYS 0; surcharge never applies because applied_tier==FREE"

  - name: compute_claim_reimbursement
    trigger: "Side-effect of ReimbursementClaim SUBMITTED transition (POST /school-meals/reimbursement-claims/{id}/submit)"
    algorithm: aggregation
    formula: |
      # Sum of federal_reimbursement_cents over included transactions, basis-dependent.
      # Included set defined explicitly per variant; tie-break by ServiceTransaction.created_at ASC (NEVER by id).
      included = filter ServiceTransaction WHERE served_at_utc IN [period_start_utc, period_end_utc]
                                              AND Student.school_code == ReimbursementClaim.school_code
      if accounting_basis == CASH:
          included = [t for t in included if t.status == SETTLED]
          total = sum(t.federal_reimbursement_cents for t in included)
      elif accounting_basis == ACCRUAL:
          # ACCRUAL includes SETTLED at full reimbursement, DISPUTED at full reimbursement (not yet refunded),
          # and REFUNDED at ZERO (refund already reversed federal_reimbursement_cents).
          included = [t for t in included if t.status in {SETTLED, DISPUTED, REFUNDED}]
          total = sum(t.federal_reimbursement_cents for t in included)
      return {total_cents: total, count: len(included)}
    input_set: "ServiceTransactions in [period_start_utc, period_end_utc] for students at school_code, filtered by accounting_basis"
    constants: {}
    precision: "All values are integer cents; sum is integer-exact (no rounding)"
    variants:
      - name: cash_basis
        when: "ReimbursementClaim.accounting_basis == CASH"
        difference: "Only status==SETTLED transactions are summed; DISPUTED and REFUNDED contribute zero"
      - name: accrual_basis
        when: "ReimbursementClaim.accounting_basis == ACCRUAL"
        difference: "SETTLED and DISPUTED contribute full federal_reimbursement_cents; REFUNDED contributes zero (because federal_reimbursement_cents was zeroed at REFUND)"

  - name: select_active_determination
    trigger: "Server selection at ServiceTransaction PENDING creation (POST /school-meals/service-transactions) — picks which EligibilityDetermination governs the student's tier"
    algorithm: chronological
    formula: |
      # Selector with eligibility, ranking, tie-break, and empty-pool fallback (§Quality Selector determinism).
      candidates = filter EligibilityDetermination WHERE
          household_id == Student(student_id).household_id
          AND lifecycle_status == ACTIVE
          AND valid_from_utc <= server_clock_utc < valid_to_utc      # half-open interval
      if len(candidates) == 0:
          REJECT with ERR_NO_ACTIVE_ELIGIBILITY (422)
      # Ranking: tier-priority then recency. NEVER id.
      rank = sort_by (tier_priority DESC, valid_from_utc DESC, created_at DESC)
          where tier_priority = {FREE: 3, REDUCED: 2, PAID: 1}
      return candidates[0]   # most generous tier wins; recency breaks ties; created_at last (NEVER id)
    input_set: "All EligibilityDetermination rows for the student's household_id at server_clock_utc"
    constants: {}
    precision: "Integer comparisons; created_at compared at millisecond precision (ISO 8601 with three fractional digits)"

  - name: recompute_topup_window
    trigger: "Side-effect of POST /school-meals/parent-accounts/{id}/topup (BEFORE the cap check)"
    algorithm: aggregation
    formula: |
      today_utc = date(server_clock_utc)
      if ParentAccount.daily_topup_window_date != today_utc:
          ParentAccount.daily_topup_total_cents = 0
          ParentAccount.daily_topup_window_date = today_utc
      # cap check (in validation §1.4 priority 8):
      # if daily_topup_total_cents + payload.amount_cents > DAILY_TOPUP_CAP_CENTS: reject ERR_TOPUP_CAP_EXCEEDED
      # After successful TOPUP:
      # daily_topup_total_cents += payload.amount_cents
    input_set: "ParentAccount.daily_topup_total_cents, daily_topup_window_date, server_clock_utc, payload.amount_cents"
    constants:
      DAILY_TOPUP_CAP_CENTS: 20000         # $200 max top-up per UTC calendar day per account

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and matches a declared role in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all (except POST /school-meals/_clock/* which still requires PlatformAdmin)"

  - priority: 2
    category: auth
    check: "Role permitted to invoke this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For entity_backed roles acting on an owned resource (Parent on Household, Parent on MealApplication, Parent on ParentAccount), X-User-ID equals the resource's household_id (or its primary household_id field)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: ["POST /school-meals/applications/{id}/submit", "POST /school-meals/applications/{id}/appeal", "POST /school-meals/applications/{id}/withdraw", "POST /school-meals/parent-accounts/{id}/topup", "POST /school-meals/service-transactions/{id}/dispute"]

  - priority: 4
    category: existence
    check: "All path-templated resource IDs (left-to-right) resolve to an existing entity"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with {id} segments"

  - priority: 5
    category: state
    check: "State-machine precondition: from-state matches the entity's current status (or current parallel-dimension value)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-mutating endpoints"

  - priority: 6
    category: business_safety
    check: "Allergen safety: at ServiceTransaction PENDING creation, if MenuItem.allergens_present ∩ AllergyProfile.allergens (for the student) is non-empty AND AllergyProfile.severity == SEVERE_ANAPHYLACTIC AND payload.substitute_for_allergen != true, reject"
    error_id: ERR_ALLERGEN_CONFLICT
    http_status: 422
    applies_to: ["POST /school-meals/service-transactions"]

  - priority: 7
    category: business_referential
    check: "Reimbursement-claim window integrity: no two ReimbursementClaim for the same school_code may overlap, AND consecutive claim periods must be separated by at least 1 calendar day gap (period_start_utc of new >= period_end_utc of prior + 1 day)"
    error_id: ERR_CLAIM_PERIOD_OVERLAP
    http_status: 409
    applies_to: ["POST /school-meals/reimbursement-claims"]

  - priority: 8
    category: business_referential
    check: "Eligibility-determination window integrity: no two EligibilityDetermination for the same household_id may have overlapping [valid_from_utc, valid_to_utc) intervals (half-open; adjacency at the exact boundary is allowed)"
    error_id: ERR_ELIGIBILITY_OVERLAP
    http_status: 409
    applies_to: ["POST /school-meals/eligibility-determinations", "POST /school-meals/applications/{id}/approve (cascade)"]

  - priority: 9
    category: business_fiscal
    check: "Daily top-up cap: ParentAccount.daily_topup_total_cents + payload.amount_cents must be <= DAILY_TOPUP_CAP_CENTS (after recompute_topup_window has rolled the window forward if needed)"
    error_id: ERR_TOPUP_CAP_EXCEEDED
    http_status: 422
    applies_to: ["POST /school-meals/parent-accounts/{id}/topup"]

  - priority: 10
    category: business_fiscal
    check: "Insufficient funds: at ServiceTransaction SETTLED transition, ParentAccount.balance_cents (recomputed from ledger) must be >= ServiceTransaction.paid_charge_cents"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 422
    applies_to: ["POST /school-meals/service-transactions/{id}/settle"]

  - priority: 11
    category: business_constraint
    check: "Idempotency: TOPUP LedgerEntry creation requires a non-null idempotency_key unique per ParentAccount; duplicate key returns the prior entry (200 + original response body), not a new entry"
    error_id: ERR_DUPLICATE_IDEMPOTENCY_KEY
    http_status: 409
    applies_to: ["POST /school-meals/parent-accounts/{id}/topup"]

  - priority: 12
    category: business_constraint
    check: "Reimbursement-claim closure: ReimbursementClaim SUBMITTED requires every ServiceTransaction with served_at_utc ∈ [period_start_utc, period_end_utc] for any student at school_code to be in {SETTLED, REJECTED, REFUNDED}; any PENDING or DISPUTED transaction rejects"
    error_id: ERR_PERIOD_NOT_SETTLED
    http_status: 409
    applies_to: ["POST /school-meals/reimbursement-claims/{id}/submit"]

  - priority: 13
    category: business_constraint
    check: "MealApplication submission: snapshot fields must be derivable (Household.annual_income_cents and family_size non-null)"
    error_id: ERR_HOUSEHOLD_INCOMPLETE
    http_status: 422
    applies_to: ["POST /school-meals/applications/{id}/submit"]

  - priority: 14
    category: business_constraint
    check: "Required-field shape: request body has all required fields for the endpoint with valid types per §1.5 input; unknown extra fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 15
    category: business_constraint
    check: "Pagination params: limit ∈ [1, 100]; offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Households ---------------------------------------------------------
  - method: POST
    path: "/school-meals/households"
    description: "Create a Household record"
    roles: [SchoolStaff, DistrictReviewer]
    code: 201
    input: [primary_parent_name, family_size, annual_income_cents, address_state, "direct_certification_flag?"]
    output: Household
    side_effects: ["creates ParentAccount with balance_cents=0 for this Household"]

  - method: GET
    path: "/school-meals/households/{id}"
    description: "Read a Household"
    roles: [Parent, SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: GET
    path: "/school-meals/households"
    description: "List Households (filter optional)"
    roles: [SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: ["limit?", "offset?", "address_state?"]
    output: Household[]
    side_effects: []

  - method: PATCH
    path: "/school-meals/households/{id}"
    description: "Update mutable Household fields (income, family_size, address_state, direct_certification_flag)"
    roles: [Parent, SchoolStaff]
    code: 200
    input: ["primary_parent_name?", "family_size?", "annual_income_cents?", "address_state?", "direct_certification_flag?"]
    output: Household
    side_effects: ["increments Household.version by 1"]

  - method: GET
    path: "/school-meals/households/{id}/students"
    description: "List Students of a Household (FK reverse-reachability for Student.household_id)"
    roles: [Parent, SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Student[]
    side_effects: []

  - method: GET
    path: "/school-meals/households/{id}/applications"
    description: "List MealApplications of a Household (FK reverse-reachability for MealApplication.household_id)"
    roles: [Parent, SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: MealApplication[]
    side_effects: []

  - method: GET
    path: "/school-meals/households/{id}/eligibility-determinations"
    description: "List EligibilityDeterminations of a Household (FK reverse-reachability for EligibilityDetermination.household_id)"
    roles: [Parent, SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: ["limit?", "offset?", "lifecycle_status?"]
    output: EligibilityDetermination[]
    side_effects: []

  - method: GET
    path: "/school-meals/households/{id}/parent-account"
    description: "Read the (single) ParentAccount for this Household (FK reverse-reachability for ParentAccount.household_id; 1:1 returns array of 0 or 1)"
    roles: [Parent, SchoolStaff, DistrictReviewer]
    code: 200
    input: []
    output: ParentAccount[]
    side_effects: []

  # --- Students -----------------------------------------------------------
  - method: POST
    path: "/school-meals/students"
    description: "Create a Student"
    roles: [SchoolStaff]
    code: 201
    input: [household_id, full_name, school_code, grade_level]
    output: Student
    side_effects: []

  - method: GET
    path: "/school-meals/students/{id}"
    description: "Read a Student"
    roles: [Parent, SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/school-meals/students"
    description: "List Students (filtered)"
    roles: [SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: ["limit?", "offset?", "household_id?", "school_code?"]
    output: Student[]
    side_effects: []

  - method: GET
    path: "/school-meals/students/{id}/allergy-profile"
    description: "Read the AllergyProfile for this Student (FK reverse-reachability for AllergyProfile.student_id; 1:1 returns array of 0 or 1)"
    roles: [Parent, SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: []
    output: AllergyProfile[]
    side_effects: []

  # --- AllergyProfile -----------------------------------------------------
  - method: POST
    path: "/school-meals/allergy-profiles"
    description: "Create an AllergyProfile for a Student (one per student)"
    roles: [SchoolStaff, Parent]
    code: 201
    input: [student_id, "allergens?", "severity?"]
    output: AllergyProfile
    side_effects:
      - "For every PENDING ServiceTransaction tied to this student involving a MenuItem with allergens_present ∩ allergens != ∅ AND severity == SEVERE_ANAPHYLACTIC, transition that transaction to REJECTED with rejection_reason=ALLERGEN_CONFLICT (cascade depth 2)"
      - "For each such auto-rejected transaction, if the transaction had been SETTLED-then-back-to-PENDING (not applicable in v1; PENDING only) — N/A"

  - method: PATCH
    path: "/school-meals/allergy-profiles/{id}"
    description: "Update an AllergyProfile's allergen list or severity"
    roles: [Parent, SchoolStaff]
    code: 200
    input: ["allergens?", "severity?"]
    output: AllergyProfile
    side_effects:
      - "Recompute allergen safety for ALL PENDING ServiceTransactions tied to this profile's student (cascade depth 2): each transaction whose MenuItem.allergens_present intersects the NEW allergens AND severity==SEVERE_ANAPHYLACTIC transitions to REJECTED with rejection_reason=ALLERGEN_CONFLICT"
      - "Increments AllergyProfile.version by 1"

  # --- MealApplication ----------------------------------------------------
  - method: POST
    path: "/school-meals/applications"
    description: "Create a MealApplication in DRAFT for a Household"
    roles: [Parent, SchoolStaff]
    code: 201
    input: [household_id, school_year]
    output: MealApplication
    side_effects: []

  - method: GET
    path: "/school-meals/applications/{id}"
    description: "Read a MealApplication"
    roles: [Parent, SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: []
    output: MealApplication
    side_effects: []

  - method: GET
    path: "/school-meals/applications"
    description: "List MealApplications (filterable by status/household)"
    roles: [SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "household_id?"]
    output: MealApplication[]
    side_effects: []

  - method: POST
    path: "/school-meals/applications/{id}/submit"
    description: "Parent submits an application; snapshots Household income/family_size"
    roles: [Parent]
    code: 200
    input: []
    output: MealApplication
    side_effects: ["snapshots Household fields into MealApplication.snapshot_*; increments MealApplication.version by 1"]

  - method: POST
    path: "/school-meals/applications/{id}/start-review"
    description: "Reviewer starts reviewing a SUBMITTED or APPEALED application"
    roles: [SchoolStaff, DistrictReviewer]
    code: 200
    input: []
    output: MealApplication
    side_effects: ["increments MealApplication.version by 1"]

  - method: POST
    path: "/school-meals/applications/{id}/approve"
    description: "Reviewer approves a UNDER_REVIEW application; creates EligibilityDetermination, supersedes prior actives, cascades to pending transactions"
    roles: [DistrictReviewer]
    code: 200
    input: [decision_reason]
    output: MealApplication
    side_effects:
      - "creates a new EligibilityDetermination (source=APPLICATION) for the household (cascade depth 1)"
      - "supersedes prior ACTIVE EligibilityDeterminations for the household (cascade depth 2)"
      - "re-binds PENDING ServiceTransactions for any student in the household to the new determination and recomputes paid_charge_cents (cascade depth 3)"
      - "increments MealApplication.version by 1"

  - method: POST
    path: "/school-meals/applications/{id}/deny"
    description: "Reviewer denies an UNDER_REVIEW application"
    roles: [DistrictReviewer]
    code: 200
    input: [decision_reason]
    output: MealApplication
    side_effects: ["increments MealApplication.version by 1"]

  - method: POST
    path: "/school-meals/applications/{id}/appeal"
    description: "Parent appeals a DENIED application; OCC-guarded"
    roles: [Parent]
    code: 200
    input: [appeal_reason, expected_mealapplication_version]
    output: MealApplication
    side_effects: ["increments MealApplication.version by 1"]

  - method: POST
    path: "/school-meals/applications/{id}/withdraw"
    description: "Parent withdraws a DRAFT or SUBMITTED application"
    roles: [Parent]
    code: 200
    input: []
    output: MealApplication
    side_effects: ["increments MealApplication.version by 1"]

  # --- EligibilityDetermination -------------------------------------------
  - method: POST
    path: "/school-meals/eligibility-determinations"
    description: "Operator-initiated determination creation (used for DIRECT_CERTIFICATION and AUTO_RENEWAL flows); subject to overlap rule"
    roles: [SchoolStaff, DistrictReviewer]
    code: 201
    input: [household_id, source, tier, valid_from_utc, valid_to_utc]
    output: EligibilityDetermination
    side_effects:
      - "If source==AUTO_RENEWAL and a prior ACTIVE determination exists for the household with lifecycle_status==ACTIVE and valid_to_utc <= server_clock_utc, transition that prior determination to EXPIRED (cascade depth 1)"
      - "Enforces validation priority 8 — no overlapping [valid_from_utc, valid_to_utc) for same household_id"

  - method: GET
    path: "/school-meals/eligibility-determinations/{id}"
    description: "Read an EligibilityDetermination"
    roles: [Parent, SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: []
    output: EligibilityDetermination
    side_effects: []

  - method: GET
    path: "/school-meals/eligibility-determinations"
    description: "List EligibilityDeterminations"
    roles: [SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: ["limit?", "offset?", "household_id?", "lifecycle_status?", "source_application_id?"]
    output: EligibilityDetermination[]
    side_effects: []

  - method: POST
    path: "/school-meals/eligibility-determinations/{id}/verify"
    description: "USDA auditor sets verification_status=VERIFIED"
    roles: [USDAAuditor]
    code: 200
    input: []
    output: EligibilityDetermination
    side_effects: ["increments EligibilityDetermination.version by 1"]

  - method: POST
    path: "/school-meals/eligibility-determinations/{id}/defer"
    description: "USDA auditor sets verification_status=DEFERRED"
    roles: [USDAAuditor]
    code: 200
    input: []
    output: EligibilityDetermination
    side_effects: ["increments EligibilityDetermination.version by 1"]

  - method: POST
    path: "/school-meals/eligibility-determinations/{id}/revoke"
    description: "USDA auditor revokes an ACTIVE determination; OCC-guarded"
    roles: [USDAAuditor]
    code: 200
    input: [expected_eligibilitydetermination_version]
    output: EligibilityDetermination
    side_effects: ["sets lifecycle_status=REVOKED; sets valid_to_utc=server_clock_utc; increments EligibilityDetermination.version by 1"]

  # --- MenuItems ----------------------------------------------------------
  - method: POST
    path: "/school-meals/menu-items"
    description: "Create a MenuItem"
    roles: [SchoolStaff]
    code: 201
    input: [school_code, name, list_price_cents, federal_reimbursement_free_cents, federal_reimbursement_reduced_cents, federal_reimbursement_paid_cents, "allergens_present?", calories]
    output: MenuItem
    side_effects: []

  - method: GET
    path: "/school-meals/menu-items/{id}"
    description: "Read a MenuItem"
    roles: [Parent, SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: []
    output: MenuItem
    side_effects: []

  - method: GET
    path: "/school-meals/menu-items"
    description: "List MenuItems (filter by school_code)"
    roles: [Parent, SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: ["limit?", "offset?", "school_code?"]
    output: MenuItem[]
    side_effects: []

  # --- ParentAccount + Top-up ---------------------------------------------
  - method: GET
    path: "/school-meals/parent-accounts/{id}"
    description: "Read a ParentAccount (returns balance_cents from ledger; reconciles derived field on read)"
    roles: [Parent, SchoolStaff, DistrictReviewer]
    code: 200
    input: []
    output: ParentAccount
    side_effects: []

  - method: POST
    path: "/school-meals/parent-accounts/{id}/topup"
    description: "Parent tops up their account; idempotency_key required; daily cap enforced"
    roles: [Parent]
    code: 201
    input: [amount_cents, idempotency_key]
    output: LedgerEntry
    side_effects:
      - "Rolls daily_topup_window if needed (recompute_topup_window)"
      - "Creates a LedgerEntry entry_type=TOPUP amount_cents=+amount_cents"
      - "Increments ParentAccount.balance_cents by amount_cents (derived-field reconciliation)"
      - "Increments daily_topup_total_cents by amount_cents"
      - "Increments ParentAccount.version by 1"

  - method: GET
    path: "/school-meals/parent-accounts/{id}/ledger"
    description: "List LedgerEntries for this account (FK reverse-reachability for LedgerEntry.parent_account_id)"
    roles: [Parent, SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: ["limit?", "offset?", "entry_type?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/school-meals/ledger-entries/{id}"
    description: "Read a single LedgerEntry"
    roles: [Parent, SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  - method: GET
    path: "/school-meals/ledger-entries"
    description: "List all LedgerEntries (filterable by linked_transaction_id for reverse-reachability of LedgerEntry.linked_transaction_id)"
    roles: [SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: ["limit?", "offset?", "parent_account_id?", "linked_transaction_id?", "entry_type?"]
    output: LedgerEntry[]
    side_effects: []

  # --- ServiceTransaction --------------------------------------------------
  - method: POST
    path: "/school-meals/service-transactions"
    description: "Create a PENDING ServiceTransaction (server selects eligibility determination, computes paid_charge_cents)"
    roles: [SchoolStaff]
    code: 201
    input: [student_id, menu_item_id, "substitute_for_allergen?"]
    output: ServiceTransaction
    side_effects:
      - "Server runs select_active_determination; rejects ERR_NO_ACTIVE_ELIGIBILITY if pool empty"
      - "Sets eligibility_determination_id, applied_tier; runs compute_paid_charge"
      - "Stamps served_at_utc = server_clock_utc"
      - "Runs allergen safety check (validation priority 6)"

  - method: GET
    path: "/school-meals/service-transactions/{id}"
    description: "Read a ServiceTransaction"
    roles: [Parent, SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: []
    output: ServiceTransaction
    side_effects: []

  - method: GET
    path: "/school-meals/service-transactions"
    description: "List ServiceTransactions"
    roles: [SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: ["limit?", "offset?", "student_id?", "menu_item_id?", "eligibility_determination_id?", "status?", "school_code?"]
    output: ServiceTransaction[]
    side_effects: []

  - method: POST
    path: "/school-meals/service-transactions/{id}/settle"
    description: "Settle a PENDING transaction; charges account, stamps federal_reimbursement_cents"
    roles: [SchoolStaff]
    code: 200
    input: []
    output: ServiceTransaction
    side_effects:
      - "Creates LedgerEntry entry_type=MEAL_CHARGE amount_cents=-paid_charge_cents linked_transaction_id={id}"
      - "Recomputes ParentAccount.balance_cents (derived-field reconciliation)"
      - "Sets federal_reimbursement_cents from MenuItem"
      - "Increments ServiceTransaction.version by 1"

  - method: POST
    path: "/school-meals/service-transactions/{id}/reject"
    description: "Reject a PENDING transaction"
    roles: [SchoolStaff]
    code: 200
    input: [rejection_reason]
    output: ServiceTransaction
    side_effects: ["Increments ServiceTransaction.version by 1"]

  - method: POST
    path: "/school-meals/service-transactions/{id}/refund"
    description: "Refund a SETTLED transaction; OCC-guarded; compensating LedgerEntry"
    roles: [SchoolStaff]
    code: 200
    input: [expected_servicetransaction_version]
    output: ServiceTransaction
    side_effects:
      - "Creates LedgerEntry entry_type=MEAL_REFUND amount_cents=+paid_charge_cents linked_transaction_id={id}"
      - "Recomputes ParentAccount.balance_cents"
      - "Zeros federal_reimbursement_cents"
      - "Increments ServiceTransaction.version by 1"

  - method: POST
    path: "/school-meals/service-transactions/{id}/dispute"
    description: "Parent disputes a SETTLED transaction"
    roles: [Parent]
    code: 200
    input: []
    output: ServiceTransaction
    side_effects: ["Increments ServiceTransaction.version by 1"]

  - method: POST
    path: "/school-meals/service-transactions/{id}/resolve-dispute"
    description: "Reviewer resolves a DISPUTED transaction (REFUND or UPHOLD)"
    roles: [DistrictReviewer]
    code: 200
    input: [resolution]
    output: ServiceTransaction
    side_effects:
      - "If resolution==REFUND: creates LedgerEntry entry_type=MEAL_REFUND amount_cents=+paid_charge_cents, recomputes balance, zeros federal_reimbursement_cents"
      - "If resolution==UPHOLD: no ledger movement; transaction returns to SETTLED"
      - "Increments ServiceTransaction.version by 1"

  # --- ReimbursementClaim --------------------------------------------------
  - method: POST
    path: "/school-meals/reimbursement-claims"
    description: "Create a ReimbursementClaim in DRAFT"
    roles: [SchoolStaff]
    code: 201
    input: [school_code, period_start_utc, period_end_utc, accounting_basis]
    output: ReimbursementClaim
    side_effects: ["Enforces validation priority 7 (no overlap, 1-day gap)"]

  - method: GET
    path: "/school-meals/reimbursement-claims/{id}"
    description: "Read a ReimbursementClaim"
    roles: [SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: []

  - method: GET
    path: "/school-meals/reimbursement-claims"
    description: "List ReimbursementClaims"
    roles: [SchoolStaff, DistrictReviewer, USDAAuditor]
    code: 200
    input: ["limit?", "offset?", "school_code?", "status?"]
    output: ReimbursementClaim[]
    side_effects: []

  - method: POST
    path: "/school-meals/reimbursement-claims/{id}/submit"
    description: "Submit a DRAFT claim; computes total_reimbursement_cents per accounting_basis"
    roles: [SchoolStaff]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects:
      - "Runs compute_claim_reimbursement"
      - "Sets total_reimbursement_cents, included_transaction_count"
      - "Increments ReimbursementClaim.version by 1"

  - method: POST
    path: "/school-meals/reimbursement-claims/{id}/finalize"
    description: "USDA auditor finalizes a SUBMITTED claim"
    roles: [USDAAuditor]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["Increments ReimbursementClaim.version by 1"]

  - method: POST
    path: "/school-meals/reimbursement-claims/{id}/reject"
    description: "USDA auditor rejects a SUBMITTED claim"
    roles: [USDAAuditor]
    code: 200
    input: [rejection_reason]
    output: ReimbursementClaim
    side_effects: ["Increments ReimbursementClaim.version by 1"]

  # --- Test-driving endpoints (under /_<name> namespace) ------------------
  - method: POST
    path: "/school-meals/_clock/set_current_utc"
    description: "Test-driving endpoint: pin server clock to a specific UTC instant. Used by tests to drive time-gated behaviors deterministically."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Server clock used by served_at_utc, valid_from/valid_to comparisons, and daily_topup_window_date is set to to_iso8601"]

  - method: POST
    path: "/school-meals/_clock/advance_and_expire"
    description: "Test-driving endpoint: advance server clock to a specific UTC instant AND run the EXPIRY sweep: every EligibilityDetermination with lifecycle_status==ACTIVE and valid_to_utc <= new clock is transitioned to EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_count: integer }"
    side_effects: ["Server clock advanced; ACTIVE→EXPIRED transitions executed for all newly-past determinations"]

  - method: POST
    path: "/school-meals/_renewal/run_auto_renewal"
    description: "Test-driving endpoint: trigger the AUTO_RENEWAL sweep for a school_year. For every household that had an ACTIVE/SUPERSEDED EligibilityDetermination in the prior school year and no DENIED MealApplication in the current school_year, create a new EligibilityDetermination with source=AUTO_RENEWAL carrying the most-recent tier."
    roles: [PlatformAdmin]
    code: 200
    input: [school_year, valid_from_utc, valid_to_utc]
    output: "{ renewed_count: integer, renewed_household_ids: string[] }"
    side_effects: ["For each renewed household, creates a new EligibilityDetermination (source=AUTO_RENEWAL) with carried-forward tier; subject to validation priority 8 (overlap)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not a declared role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted to invoke this endpoint per §1.7"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Entity-backed role acting on a resource they do not own (X-User-ID != owning household_id)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-templated resource ID does not resolve to an existing entity"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Request body shape invalid: required field missing, unknown field present, or type mismatch"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit out of [1,100] or offset < 0"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity not in the expected from-state for this transition"
  - id: ERR_HOUSEHOLD_INCOMPLETE
    http: 422
    condition: "MealApplication submit attempted while Household.annual_income_cents or family_size is null"
  - id: ERR_ALLERGEN_CONFLICT
    http: 422
    condition: "ServiceTransaction creation: MenuItem contains an allergen in student's profile AND severity==SEVERE_ANAPHYLACTIC AND substitution not requested"
  - id: ERR_NO_ACTIVE_ELIGIBILITY
    http: 422
    condition: "ServiceTransaction creation: no ACTIVE EligibilityDetermination covers server_clock_utc for the student's household"
  - id: ERR_INSUFFICIENT_FUNDS
    http: 422
    condition: "ServiceTransaction settle: ParentAccount.balance_cents < paid_charge_cents"
  - id: ERR_TOPUP_CAP_EXCEEDED
    http: 422
    condition: "ParentAccount topup: daily_topup_total_cents + amount_cents > DAILY_TOPUP_CAP_CENTS (20000)"
  - id: ERR_DUPLICATE_IDEMPOTENCY_KEY
    http: 409
    condition: "Topup idempotency_key collides with an existing LedgerEntry; on collision return the original entry (200), not a new one — this error fires only if amount_cents differs from the original"
  - id: ERR_CLAIM_PERIOD_OVERLAP
    http: 409
    condition: "ReimbursementClaim creation: period overlaps an existing claim for same school_code OR gap from prior < 1 day"
  - id: ERR_ELIGIBILITY_OVERLAP
    http: 409
    condition: "EligibilityDetermination creation: [valid_from_utc, valid_to_utc) overlaps an existing ACTIVE determination for the same household_id"
  - id: ERR_PERIOD_NOT_SETTLED
    http: 409
    condition: "ReimbursementClaim submit: at least one ServiceTransaction in [period_start_utc, period_end_utc] is PENDING or DISPUTED"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_*_version != current entity version (covers MealApplication appeal, EligibilityDetermination revoke, ServiceTransaction refund)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Parent
    description: "Guardian acting on behalf of their own Household. Submits applications, appeals, disputes transactions, tops up account."
    identity: "entity_backed:Household"           # X-User-ID == Household.id
    exclusive_operations:
      - "POST /school-meals/applications/{id}/submit"
      - "POST /school-meals/applications/{id}/appeal"
      - "POST /school-meals/applications/{id}/withdraw"
      - "POST /school-meals/parent-accounts/{id}/topup"
      - "POST /school-meals/service-transactions/{id}/dispute"
    shared_operations:
      - "POST /school-meals/applications (with SchoolStaff)"
      - "POST /school-meals/allergy-profiles (with SchoolStaff)"
      - "PATCH /school-meals/allergy-profiles/{id} (with SchoolStaff)"
      - "PATCH /school-meals/households/{id} (with SchoolStaff)"
      - "GET endpoints scoped to the parent's own Household: households/{id}, students/{id}, applications/{id}, eligibility-determinations/{id}, menu-items, parent-accounts/{id}, parent-accounts/{id}/ledger, service-transactions/{id}"

  - name: SchoolStaff
    description: "School-level staff. Creates students, registers AllergyProfiles, processes ServiceTransactions, prepares ReimbursementClaims."
    identity: "opaque"
    exclusive_operations:
      - "POST /school-meals/students"
      - "POST /school-meals/menu-items"
      - "POST /school-meals/service-transactions"
      - "POST /school-meals/service-transactions/{id}/settle"
      - "POST /school-meals/service-transactions/{id}/reject"
      - "POST /school-meals/service-transactions/{id}/refund"
      - "POST /school-meals/reimbursement-claims"
      - "POST /school-meals/reimbursement-claims/{id}/submit"
    shared_operations:
      - "POST /school-meals/households (with DistrictReviewer)"
      - "POST /school-meals/applications/{id}/start-review (with DistrictReviewer)"
      - "POST /school-meals/eligibility-determinations (with DistrictReviewer)"
      - "POST /school-meals/applications (with Parent)"
      - "POST /school-meals/allergy-profiles (with Parent)"
      - "PATCH /school-meals/allergy-profiles/{id} (with Parent)"
      - "PATCH /school-meals/households/{id} (with Parent)"

  - name: DistrictReviewer
    description: "District-level reviewer responsible for approving/denying MealApplications and resolving disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /school-meals/applications/{id}/approve"
      - "POST /school-meals/applications/{id}/deny"
      - "POST /school-meals/service-transactions/{id}/resolve-dispute"
    shared_operations:
      - "POST /school-meals/households (with SchoolStaff)"
      - "POST /school-meals/applications/{id}/start-review (with SchoolStaff)"
      - "POST /school-meals/eligibility-determinations (with SchoolStaff)"

  - name: USDAAuditor
    description: "USDA auditor responsible for verifying eligibility determinations, revoking, and finalizing reimbursement claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /school-meals/eligibility-determinations/{id}/verify"
      - "POST /school-meals/eligibility-determinations/{id}/defer"
      - "POST /school-meals/eligibility-determinations/{id}/revoke"
      - "POST /school-meals/reimbursement-claims/{id}/finalize"
      - "POST /school-meals/reimbursement-claims/{id}/reject"
    shared_operations: []

  - name: PlatformAdmin
    description: "Operations / test-driving role for clock control and auto-renewal sweeps."
    identity: "opaque"
    exclusive_operations:
      - "POST /school-meals/_clock/set_current_utc"
      - "POST /school-meals/_clock/advance_and_expire"
      - "POST /school-meals/_renewal/run_auto_renewal"
    shared_operations: []
