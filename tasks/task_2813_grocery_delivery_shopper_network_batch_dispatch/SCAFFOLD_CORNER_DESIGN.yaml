      - name: dispatch_by_a_shopper_on_an_unknown_batch_is_rejected_on_role_first
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors.ERR_UNAUTHORIZED_ROLE
        distinguishing_aspect: "Authorization (priority 2) is evaluated before path-id existence (priority 3): a Shopper calling dispatch on a batch id that does not exist gets ERR_UNAUTHORIZED_ROLE (403), not ERR_BATCH_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "One Shopper S1 exists; no batch is created, and the id used in the trigger is a syntactically valid UUID that was never minted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /shoppers"
              payload: { display_name: "Sam Reyes", service_area_code: "SF-32", vehicle_capacity_units: 10 }
              as: DispatchAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /batches/00000000-0000-4000-8000-00000000dead/dispatch"
              payload: {}
              as: Shopper
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status is 403 with error_id ERR_UNAUTHORIZED_ROLE (dispatch is DispatchAdmin-exclusive)"
            - "The response is NOT ERR_BATCH_NOT_FOUND, so no existence lookup leaks to an unauthorized caller"
            - "GET /batches as DispatchAdmin still returns total_count == 0"

