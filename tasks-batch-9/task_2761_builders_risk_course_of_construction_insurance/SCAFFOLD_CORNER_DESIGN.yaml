# Scaffold Corner Design (SKILL.md 1.9) - breadth probe over the claim-extraction guide's nine
# sections. Every instance is replayable from an empty database using only endpoints declared in
# SCAFFOLD.yaml 1.5; every money/score literal below was computed by executing the corresponding
# 1.3 formula with its declared constants.
#
# Canonical actors used throughout:
#   Underwriter          uw-001, uw-002
#   UnderwritingManager  um-001, um-002
#   RiskEngineer         re-001
#   ClaimAdjuster        ca-001, ca-002
#   ProjectContact       X-User-ID is the ConstructionProject id
#   LossPayee            X-User-ID is the NamedInsuredInterest id
#
# Canonical fixture FX-A (reused by many instances, always spelled out in full):
#   ConstructionProject  NON_COMBUSTIBLE / NEW_CONSTRUCTION / WIND_TIER_2, hard_cost 2000000000,
#                        planned 2026-09-01, projected completion 2027-06-01, grade B
#                        -> submission_risk_score 28, status ELIGIBLE
#   BuildersRiskPolicy   term 2026-09-01 .. 2027-06-30 (original_term_days 302), ELEVATED_100K
#                        (occurrence_deductible_cents 10000000), limit 2500000000,
#                        daily_delay_rate_cents 1200000, insured_tiv_cents 2000000000
#   CoverageParts        MATERIALS_ON_SITE 1000000000, SOFT_COST 300000000,
#                        DELAY_IN_COMPLETION 250000000  -> quoted_premium_cents 2750440
#   daily_base_cents     round_half_up(2750440 / 302) == 9107

scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_project_creation_returns_submitted_row_with_system_defaults
        claim_type: creation
        grounds:
          - entities.ConstructionProject
          - endpoints[POST /builders-risk/projects]
        distinguishing_aspect: "A POST with every required input field returns 201 and a row whose eight input fields echo the request while status is SUBMITTED, version is 1, both risk scores are null, engineering_grade is null and in_force_policy_count is 0."
        test_recipe:
          setup:
            - "Empty database; no clock call, so the logical clock still reads 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Terminal Expansion", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, existing_structure_value_cents: 0, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id, v1: $.data.version, st1: $.data.status }
          assert:
            - "HTTP 201 and ConstructionProject.${p1}.name == 'Harborline Terminal Expansion'"
            - "ConstructionProject.${p1}.construction_type == NON_COMBUSTIBLE, project_kind == NEW_CONSTRUCTION, cat_zone == WIND_TIER_2, hard_cost_value_cents == 2000000000"
            - "st1 == SUBMITTED and v1 == 1"
            - "ConstructionProject.${p1}.submission_risk_score == null, audit_risk_score == null, engineering_grade == null, loss_control_report_ref == null, screened_by_user_id == null"
            - "ConstructionProject.${p1}.actual_substantial_completion_date == null and in_force_policy_count == 0"
            - "the success envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == 'object'"

      - name: corner_project_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /builders-risk/projects/{id}]
          - entities.ConstructionProject
        distinguishing_aspect: "GET /projects/{id} after a screen returns the same id and the post-screen values (engineering_grade B, submission_risk_score 28, status ELIGIBLE, version 2), not the creation-time snapshot."
        test_recipe:
          setup:
            - "One project created and screened with engineering_grade B; SUBMISSION_BASIS score is 12 (NON_COMBUSTIBLE) + 12 (WIND_TIER_2) + 4 (value) + 0 (duration) == 28."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Terminal Expansion", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "B", loss_control_report_ref: "LC-2761-A" }
              as: RiskEngineer
              as_user_id: "re-001"
          trigger:
            - call: "GET /builders-risk/projects/${p1}"
              payload: {}
              as: ClaimAdjuster
              as_user_id: "ca-001"
              captures: { got_id: $.data.id, got_status: $.data.status, got_score: $.data.submission_risk_score, got_grade: $.data.engineering_grade, got_v: $.data.version }
          assert:
            - "HTTP 200 and got_id == ${p1}"
            - "got_status == ELIGIBLE, got_grade == B, got_score == 28, got_v == 2"
            - "ConstructionProject.${p1}.loss_control_report_ref == 'LC-2761-A' and screened_by_user_id == 're-001'"
            - "ConstructionProject.${p1}.audit_risk_score == null - the AUDIT_BASIS variant has not run yet"

      - name: corner_project_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /builders-risk/projects]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With exactly 3 projects stored, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and limit=2&offset=2 returns 1 row with has_more false; the unpaginated call applies the declared default limit of 10."
        test_recipe:
          setup:
            - "Three projects created, two INLAND and one WIND_TIER_2, none screened."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Terminal Expansion", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pa: $.data.id }
            - call: "POST /builders-risk/projects"
              payload: { name: "Cedar Mills Warehouse", site_address: "12 Mill Rd, Cedar", construction_type: "FIRE_RESISTIVE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 400000000, cat_zone: "INLAND", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-03-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pb: $.data.id }
            - call: "POST /builders-risk/projects"
              payload: { name: "Fifth Avenue Renovation", site_address: "5 Fifth Ave, Rockvale", construction_type: "JOISTED_MASONRY", project_kind: "RENOVATION", hard_cost_value_cents: 1500000000, existing_structure_value_cents: 500000000, cat_zone: "INLAND", planned_start_date: "2026-10-01T00:00:00Z", projected_completion_date: "2027-04-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pc: $.data.id }
          trigger:
            - call: "GET /builders-risk/projects?limit=2&offset=0"
              payload: {}
              as: UnderwritingManager
              as_user_id: "um-001"
            - call: "GET /builders-risk/projects?limit=2&offset=2"
              payload: {}
              as: UnderwritingManager
              as_user_id: "um-001"
            - call: "GET /builders-risk/projects?cat_zone=INLAND"
              payload: {}
              as: UnderwritingManager
              as_user_id: "um-001"
            - call: "GET /builders-risk/projects?project_kind=RENOVATION"
              payload: {}
              as: UnderwritingManager
              as_user_id: "um-001"
          assert:
            - "first call: HTTP 200, response_type == 'array', 2 rows, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "second call: 1 row, offset == 2, total_count == 3, has_more == false"
            - "third call: total_count == 2 and the returned ids are exactly {${pb}, ${pc}}"
            - "fourth call: total_count == 1 and the single row's id == ${pc}"

      - name: corner_project_get_with_unknown_uuid_returns_project_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PROJECT_NOT_FOUND]
          - validations[priority=30].ERR_PROJECT_NOT_FOUND
        distinguishing_aspect: "A syntactically valid UUID that no ConstructionProject row carries returns ERR_PROJECT_NOT_FOUND with HTTP 404 on both the read and the screen action, never 200 with an empty body."
        test_recipe:
          setup:
            - "One unrelated project exists, so the collection is non-empty and the 404 cannot come from an empty store."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Terminal Expansion", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
          trigger:
            - call: "GET /builders-risk/projects/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e_get: $.data.error_id }
            - call: "POST /builders-risk/projects/00000000-0000-4000-8000-000000000001/screen"
              payload: { engineering_grade: "B" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { e_screen: $.data.error_id }
          assert:
            - "e_get == ERR_PROJECT_NOT_FOUND with HTTP 404 and response_type == 'error'"
            - "e_screen == ERR_PROJECT_NOT_FOUND with HTTP 404 - existence (priority 30) is checked before any state rule"
            - "ConstructionProject.${p1} is untouched: status == SUBMITTED and version == 1"

      - name: corner_project_creation_missing_required_fields_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=40].ERR_INVALID_REQUEST
          - entities.ConstructionProject
        distinguishing_aspect: "Omitting cat_zone (an input field with no default) returns ERR_INVALID_REQUEST 400, and so does omitting hard_cost_value_cents; omitting only existing_structure_value_cents succeeds because that field declares a default."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /builders-risk/projects"
              payload: { name: "No Zone Project", site_address: "1 Nowhere St", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e_zone: $.data.error_id }
            - call: "POST /builders-risk/projects"
              payload: { name: "No Value Project", site_address: "2 Nowhere St", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", cat_zone: "INLAND", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e_value: $.data.error_id }
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Terminal Expansion", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p_ok: $.data.id }
          assert:
            - "e_zone == ERR_INVALID_REQUEST with HTTP 400"
            - "e_value == ERR_INVALID_REQUEST with HTTP 400"
            - "the third call returns HTTP 201 and GET /builders-risk/projects returns total_count == 1, so neither rejected request persisted a row"

      - name: corner_project_existing_structure_value_defaults_to_zero
        claim_type: defaults
        grounds:
          - entities.ConstructionProject.existing_structure_value_cents
          - endpoints[POST /builders-risk/projects]
        distinguishing_aspect: "Omitting existing_structure_value_cents on a NEW_CONSTRUCTION submission stores 0 rather than null, and the stored 0 is what the SUBMISSION_BASIS score's tiv_cents reads: score 28 for hard_cost 2000000000 alone."
        test_recipe:
          setup:
            - "One project submitted without existing_structure_value_cents and then screened, so the default participates in a computed field."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Terminal Expansion", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id, esv: $.data.existing_structure_value_cents }
          trigger:
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "B" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { sc: $.data.submission_risk_score, grade_ref: $.data.loss_control_report_ref }
          assert:
            - "esv == 0 (not null) immediately in the creation response"
            - "sc == 28 - value_pts == min(20, floor(2000000000 / 500000000)) == 4, so the defaulted 0 contributed nothing"
            - "grade_ref == null because loss_control_report_ref was omitted at screening"

      - name: corner_policy_computed_fields_derive_term_days_tiv_and_deductible
        claim_type: computed_fields
        grounds:
          - entities.BuildersRiskPolicy.original_term_days
          - entities.BuildersRiskPolicy.insured_tiv_cents
          - entities.BuildersRiskPolicy.occurrence_deductible_cents
          - entities.BuildersRiskPolicy.adjusted_completion_date
          - endpoints[POST /builders-risk/policies]
        distinguishing_aspect: "POST /policies computes original_term_days == 302 from the submitted term, insured_tiv_cents == 2000000000 from the FK project, occurrence_deductible_cents == 10000000 from deductible_tier ELEVATED_100K and adjusted_completion_date == the project's projected completion date, with cumulative_extension_days 0 - none of the four is an input field."
        test_recipe:
          setup:
            - "FX-A project screened to ELIGIBLE with version 2."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Terminal Expansion", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "B" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { p1v: $.data.version }
          trigger:
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", includes_existing_structure: false, deductible_tier: "ELEVATED_100K", limit_cents: 2500000000, daily_delay_rate_cents: 1200000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id, otd: $.data.original_term_days, tiv: $.data.insured_tiv_cents, ded: $.data.occurrence_deductible_cents, adj: $.data.adjusted_completion_date }
          assert:
            - "otd == 302 - whole days in the half-open interval [2026-09-01, 2027-06-30)"
            - "tiv == 2000000000 - hard_cost only, because includes_existing_structure is false"
            - "ded == 10000000 for ELEVATED_100K"
            - "adj == 2027-06-01T00:00:00Z and BuildersRiskPolicy.${pl1}.cumulative_extension_days == 0"
            - "BuildersRiskPolicy.${pl1}.quoted_premium_cents == null, written_premium_cents == 0, eroded_total_cents == 0, return_premium_cents == null"

      - name: corner_policy_system_fields_are_server_stamped_not_client_supplied
        claim_type: system_fields
        grounds:
          - entities.BuildersRiskPolicy.status
          - entities.BuildersRiskPolicy.quoted_by_user_id
          - entities.BuildersRiskPolicy.bound_at
          - endpoints[POST /builders-risk/policies/{id}/quote]
          - endpoints[POST /builders-risk/policies/{id}/bind]
        distinguishing_aspect: "status, quoted_by_user_id and bound_at are absent from every input schema and appear only as server stamps: DRAFT/null/null at creation, QUOTED/'uw-002'/null after the quote, BOUND/'uw-002'/2026-09-01T00:00:00Z after the clock is set and the bind runs."
        test_recipe:
          setup:
            - "FX-A policy with a MATERIALS_ON_SITE part of 1000000000 and an acknowledged OWNER interest at 100 pct, quoted by uw-002 rather than the creating user uw-001."
            - "Logical clock moved to 2026-09-01T00:00:00Z before the bind so bound_at is a pinned literal."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Terminal Expansion", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "B" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { p1v: $.data.version }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", includes_existing_structure: false, deductible_tier: "ELEVATED_100K", limit_cents: 2500000000, daily_delay_rate_cents: 1200000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id, st_draft: $.data.status, qb0: $.data.quoted_by_user_id, ba0: $.data.bound_at }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "MATERIALS_ON_SITE", sublimit_cents: 1000000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/named-insured-interests"
              payload: { policy_id: "${pl1}", party_name: "Harborline Owner LLC", party_role: "OWNER", insurable_interest_pct: 100 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { int1: $.data.id }
            - call: "POST /builders-risk/named-insured-interests/${int1}/acknowledge"
              payload: {}
              as: LossPayee
              as_user_id: "${int1}"
            - call: "POST /builders-risk/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
          trigger:
            - call: "POST /builders-risk/policies/${pl1}/quote"
              payload: {}
              as: Underwriter
              as_user_id: "uw-002"
              captures: { st_quoted: $.data.status, qb1: $.data.quoted_by_user_id }
            - call: "POST /builders-risk/policies/${pl1}/bind"
              payload: {}
              as: Underwriter
              as_user_id: "uw-002"
              captures: { st_bound: $.data.status, ba1: $.data.bound_at }
          assert:
            - "st_draft == DRAFT, qb0 == null, ba0 == null"
            - "st_quoted == QUOTED and qb1 == 'uw-002' - the stamp follows X-User-ID of the quoting call, not of the creating call"
            - "st_bound == BOUND and ba1 == 2026-09-01T00:00:00Z - taken from the logical clock, never from wall-clock time"
            - "BuildersRiskPolicy.${pl1}.version == 5 (create, part, interest, quote, bind)"

      - name: corner_enum_and_numeric_type_constraints_are_rejected_at_the_edge
        claim_type: type_constraints
        grounds:
          - entities.ConstructionProject.construction_type
          - entities.BuildersRiskPolicy.deductible_tier
          - entities.CoveragePart.sublimit_cents
          - validations[priority=40].ERR_INVALID_REQUEST
        distinguishing_aspect: "Four separate shape violations all collapse to ERR_INVALID_REQUEST 400: an out-of-enum construction_type, an out-of-enum deductible_tier, a negative hard_cost_value_cents and a zero sublimit_cents (constraint is > 0), while the legal enum member from the same field list succeeds."
        test_recipe:
          setup:
            - "One DRAFT policy on an ELIGIBLE project so that the coverage-part shape check has a live parent."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Terminal Expansion", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "B" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { p1v: $.data.version }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", includes_existing_structure: false, deductible_tier: "ELEVATED_100K", limit_cents: 2500000000, daily_delay_rate_cents: 1200000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id }
          trigger:
            - call: "POST /builders-risk/projects"
              payload: { name: "Bad Type", site_address: "9 Bad St", construction_type: "STEEL_FRAME", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 100000000, cat_zone: "INLAND", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-01-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e_ctype: $.data.error_id }
            - call: "POST /builders-risk/projects"
              payload: { name: "Negative Value", site_address: "9 Bad St", construction_type: "FIRE_RESISTIVE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: -1, cat_zone: "INLAND", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-01-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e_neg: $.data.error_id }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", deductible_tier: "MEGA_500K", limit_cents: 2500000000, daily_delay_rate_cents: 1200000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e_tier: $.data.error_id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "MATERIALS_ON_SITE", sublimit_cents: 0 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e_zero: $.data.error_id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "MATERIALS_ON_SITE", sublimit_cents: 1000000000 }
              as: Underwriter
