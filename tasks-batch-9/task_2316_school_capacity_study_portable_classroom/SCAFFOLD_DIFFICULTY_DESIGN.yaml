          entities: [School, PortableUnit, PlacementRequest, InstallationSchedule, CapitalBudget, PlacementSite]
          endpoints: ["POST /facilities/installation-schedules/{id}/complete", "POST /facilities/placement-requests/{id}/complete-decommission"]
        invariant: "sum over schools of School.hosted_portable_seats == sum of PortableUnit.rated_seats over units whose allocation_status == INSTALLED, and every INSTALLED unit's current_school_id matches the school whose ledger counts it"
        compensating_pair:
          forward: "completing the installation moves the unit to INSTALLED, adds its 24 rated seats to School.hosted_portable_seats and converts the 7,741,440 cent encumbrance into expenditure"
          reverse: "POST /facilities/placement-requests/{id}/complete-decommission removes exactly those 24 seats, returns the unit to IN_STORAGE with current_school_id null and charges the 1,600,000 cent removal cost"
        distinguishing_aspect: >
          A seat ledger is a different conserved quantity from money and it is
          conserved across a different pair of transitions. The campus reads 24
          hosted seats and a 30.0 percent portable share while the unit is
          installed, and 0 seats with a 0.0 percent share and reliance_flag NONE
          once it is removed, with no residual pointer left on the pad or on the
          unit. Money is conserved simultaneously but asymmetrically: the
          encumbrance becomes an expenditure at installation and the removal adds a
          further 1,600,000 cents, so uncommitted lands at 490,658,560 rather than
          back at the authorised amount. An implementation that decrements the
          ledger by a constant portable seat count instead of the unit's own
          rated_seats, or that forgets to clear current_school_id, breaks the
          equality on the second campus-level read.
