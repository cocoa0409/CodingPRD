              payload: { protocol_number: "AMC-2390-C54", title: "Corner effective-analysis probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
