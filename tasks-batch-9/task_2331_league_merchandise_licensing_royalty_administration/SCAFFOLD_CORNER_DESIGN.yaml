              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { auth_j3: $.data.id }
            - call: "POST /licensing/retailer-authorizations/${auth_j3}/status"
              payload: { action: "APPROVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/agreements/${agr_j3}"
              as: FinanceController
