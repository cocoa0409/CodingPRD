  - section: rbac
    instances:
      - name: cross_role_exclusive_ops_forbidden
        claim_type: rbac_denial
        grounds: ["errors[ERR_FORBIDDEN]", roles]
        distinguishing_aspect: "Five exclusive operations each reject the wrong role with 403 ERR_FORBIDDEN: OrgRequester cannot approve, ServiceCoordinator cannot create rooms, FacilitiesManager cannot waive, FinanceAdmin cannot finalize, Scheduler cannot quote."
        test_recipe:
          setup: ["Term SCHEDULING with a DRAFT run; org, room; REQUESTED event; event approved (by Scheduler) with a REQUESTED service order and a PROVISIONAL invoice"]
          setup_api_calls:
            - { call: "POST /campus/terms", payload: { name: "Fall 2026", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2026-12-15T00:00:00Z", priority_open_at: "2026-08-10T00:00:00Z", general_open_at: "2026-09-01T00:00:00Z" }, as: Scheduler, captures: { term_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
            - { call: "GET /campus/terms/${term_id}", payload: {}, as: Scheduler, captures: { term_v: $.data.version } }
            - { call: "POST /campus/scheduling-runs", payload: { term_id: "${term_id}", expected_term_version: "${term_v}" }, as: Scheduler, captures: { run_id: $.data.id } }
            - { call: "POST /campus/organizations", payload: { name: "Dept AE", org_type: "INTERNAL_DEPARTMENT", contact_email: "ae@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "RBAC-1", building_code: "RB", capacity: 30, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-12-20T14:00:00Z", end_at: "2026-12-20T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
          trigger:
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: OrgRequester, as_user_id: "${org_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /campus/rooms", payload: { name: "RBAC-2", building_code: "RB", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: ServiceCoordinator, captures: { err2: $.data.error_id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/service-orders", payload: { event_id: "${ev_id}", category: "AV", quantity: 1, service_start_at: "2026-12-20T13:30:00Z", service_end_at: "2026-12-20T15:30:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { so_id: $.data.id } }
            - { call: "POST /campus/service-orders/${so_id}/quote", payload: { unit_cost_cents: 1000 }, as: Scheduler, captures: { err3: $.data.error_id } }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_id: "$.data[0].id" } }
            - { call: "POST /campus/invoices/${inv_id}/waive", payload: { amount_cents: 100, reason: "x" }, as: FacilitiesManager, captures: { err4: $.data.error_id } }
            - { call: "POST /campus/scheduling-runs/${run_id}/finalize", payload: {}, as: FinanceAdmin, captures: { err5: $.data.error_id } }
          assert:
            - "${err1} == ERR_FORBIDDEN and ${err2} == ERR_FORBIDDEN and ${err3} == ERR_FORBIDDEN and ${err4} == ERR_FORBIDDEN and ${err5} == ERR_FORBIDDEN (all http 403)"
            - "Event stayed APPROVED after the Scheduler's later approve; order stayed REQUESTED; run stayed DRAFT; invoice unwaived"

  # =========================================================================
  # Section: cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_term_version_on_run_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[run-create-stale-term]"]
        distinguishing_aspect: "Creating run1 advances TermWindow.version 1->2 and points current_draft_run_id at run1; a second create carrying expected_term_version 1 gets 412 ERR_STALE_VERSION; retrying with version 2 succeeds and SUPERSEDES run1."
        test_recipe:
          setup: ["Term exists at version 1"]
          setup_api_calls:
            - { call: "POST /campus/terms", payload: { name: "Fall 2026", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2026-12-15T00:00:00Z", priority_open_at: "2026-08-10T00:00:00Z", general_open_at: "2026-09-01T00:00:00Z" }, as: Scheduler, captures: { term_id: $.data.id, term_v1: $.data.version } }
            - { call: "POST /campus/scheduling-runs", payload: { term_id: "${term_id}", expected_term_version: "${term_v1}" }, as: Scheduler, captures: { run1: $.data.id } }
          trigger:
            - { call: "POST /campus/scheduling-runs", payload: { term_id: "${term_id}", expected_term_version: "${term_v1}" }, as: Scheduler, captures: { err: $.data.error_id } }
            - { call: "GET /campus/terms/${term_id}", payload: {}, as: Scheduler, captures: { term_v2: $.data.version, cur_run: $.data.current_draft_run_id } }
            - { call: "POST /campus/scheduling-runs", payload: { term_id: "${term_id}", expected_term_version: "${term_v2}" }, as: Scheduler, captures: { run2: $.data.id } }
          assert:
            - "${err} == ERR_STALE_VERSION (http 412); no second run created by the stale call"
            - "${term_v2} == 2 and ${cur_run} == ${run1}"
            - "SchedulingRun.${run2} created; SchedulingRun.${run1}.status == SUPERSEDED and term.current_draft_run_id == ${run2} and term.version == 3"

      - name: occ_stale_room_version_on_reservation_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reservation-create-stale-room]"]
        distinguishing_aspect: "A reservation create carrying the room's pre-PATCH version gets 412 ERR_STALE_VERSION even though the new capacity still fits — the client's quoted configuration is stale; re-reading and retrying succeeds."
        test_recipe:
          setup: ["Org; room at version 1; PATCH bumps the room to version 2 (capacity 30 -> 40)"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept AF", org_type: "INTERNAL_DEPARTMENT", contact_email: "af@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "OCC-1", building_code: "OCC", capacity: 30, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v1: $.data.version } }
            - { call: "PATCH /campus/rooms/${room_id}", payload: { capacity: 40 }, as: FacilitiesManager, captures: { room_v2: $.data.version } }
          trigger:
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Stale", expected_attendance: 20, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v1}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { err: $.data.error_id } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Fresh", expected_attendance: 20, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
          assert:
            - "${err} == ERR_STALE_VERSION (http 412) despite attendance 20 fitting both capacities"
            - "EventReservation.${ev_id} created on retry; only one event persisted"

      - name: rate_pin_freezes_approved_pricing_after_room_rate_edit
        claim_type: version_pinning_on_approval
        grounds: [entities.EventReservation.fields.pinned_hourly_rate_cents, calculations.room_charge_cents]
        distinguishing_aspect: "Approving at internal rate 5000 pins it: a later PATCH to 7000 leaves the first event's invoice at 10000, while a second event approved after the edit pins 7000 and prices at 14000 — two identical bookings, different frozen prices."
        test_recipe:
          setup: ["INTERNAL org; room internal 5000; E1 approved (2 off-peak buckets on 2026-09-14 14:00-16:00); PATCH rate to 7000; E2 created and approved for 2026-09-15 14:00-16:00"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept AG", org_type: "INTERNAL_DEPARTMENT", contact_email: "ag@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "PIN-1", building_code: "PIN", capacity: 30, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E1", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T16:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e1: $.data.id } }
            - { call: "POST /campus/event-reservations/${e1}/approve", payload: {}, as: Scheduler }
            - { call: "PATCH /campus/rooms/${room_id}", payload: { internal_hourly_rate_cents: 7000 }, as: FacilitiesManager, captures: { room_v2: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E2", expected_attendance: 5, start_at: "2026-09-15T14:00:00Z", end_at: "2026-09-15T16:00:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e2: $.data.id } }
            - { call: "POST /campus/event-reservations/${e2}/approve", payload: {}, as: Scheduler }
          trigger:
            - { call: "GET /campus/invoices", payload: { event_id: "${e1}" }, as: FinanceAdmin, captures: { tot1: "$.data[0].total_cents", pin1: "$.data[0].room_charge_cents" } }
            - { call: "GET /campus/invoices", payload: { event_id: "${e2}" }, as: FinanceAdmin, captures: { tot2: "$.data[0].total_cents" } }
            - { call: "GET /campus/event-reservations/${e1}", payload: {}, as: Scheduler, captures: { pinned: $.data.pinned_hourly_rate_cents } }
          assert:
            - "${pinned} == 5000 and ${pin1} == 10000 and ${tot1} == 10000 (rate frozen at approval)"
            - "${tot2} == 14000 (E2 pinned the new 7000 rate: 2 buckets x 7000)"

      - name: standing_threshold_two_strikes_probation_not_suspended
        claim_type: rate_threshold_triggers
        grounds: [calculations.standing_threshold]
        distinguishing_aspect: "Strike boundary at 2: after exactly two no-shows the org is PROBATION (not SUSPENDED) — its REQUESTED events are NOT auto-declined and it may still create and confirm (with prepayment)."
        test_recipe:
          setup: ["Org with two CONFIRMED adjacent no-show events on 2026-09-10 (room buffer 0); a third event left REQUESTED"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept AH", org_type: "INTERNAL_DEPARTMENT", contact_email: "ah@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "THR-1", building_code: "THR", capacity: 30, turnaround_buffer_minutes: 0, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "N1", expected_attendance: 5, start_at: "2026-09-10T08:00:00Z", end_at: "2026-09-10T09:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e1: $.data.id } }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v2: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "N2", expected_attendance: 5, start_at: "2026-09-10T09:00:00Z", end_at: "2026-09-10T10:00:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e2: $.data.id } }
            - { call: "POST /campus/event-reservations/${e1}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e2}/approve", payload: {}, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e1}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/event-reservations/${e2}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T11:00:00Z" }, as: Scheduler }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v3: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Pending", expected_attendance: 5, start_at: "2026-09-21T14:00:00Z", end_at: "2026-09-21T15:00:00Z", expected_room_version: "${room_v3}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T12:00:00Z" }, as: Scheduler }
          trigger:
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler, captures: { noshows: $.data.no_shows_marked, suspended: $.data.orgs_suspended } }
          assert:
            - "${noshows} == 2 and ${suspended} == 0"
            - "Organization.${org_id}.no_show_count == 2 and standing == PROBATION (not SUSPENDED)"
            - "EventReservation.${e3}.status == REQUESTED (created 2026-09-10T11:00, decision_deadline 2026-09-13 survives expiry; PROBATION triggers no decline cascade)"

      - name: client_cancel_cascades_order_and_grant_without_waiver
        claim_type: cascading_side_effects
        grounds: [state_machines.EventReservation.CONFIRMED_to_CANCELLED, state_machines.ServiceOrder, state_machines.AccessGrant.REQUESTED_to_REVOKED]
        distinguishing_aspect: "A CLIENT cancel inside 24h finalizes the invoice with fee == full provisional base (11500 over room 10000 + quoted-but-unapproved order 1500), cancels the order with fee_waived == false, and revokes the REQUESTED grant — contrast with bump/ADMIN cascades where fee_waived == true."
        test_recipe:
          setup: ["CONFIRMED event 2026-09-16 14:00-16:00 (INTERNAL, room 2 buckets x 5000); QUOTED AV order 1500 (never approved); REQUESTED card grant; clock 2026-09-15T15:00 (notice 23h < 24h)"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept AI", org_type: "INTERNAL_DEPARTMENT", contact_email: "ai@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "CSC-1", building_code: "CSC", capacity: 30, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-16T14:00:00Z", end_at: "2026-09-16T16:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/service-orders", payload: { event_id: "${ev_id}", category: "AV", quantity: 1, service_start_at: "2026-09-16T13:30:00Z", service_end_at: "2026-09-16T14:30:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { so_id: $.data.id } }
            - { call: "POST /campus/service-orders/${so_id}/quote", payload: { unit_cost_cents: 1500 }, as: ServiceCoordinator }
            - { call: "POST /campus/access-grants", payload: { event_id: "${ev_id}", grant_type: "CARD_ACCESS" }, as: OrgRequester, as_user_id: "${org_id}", captures: { grant_id: $.data.id } }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T15:00:00Z" }, as: Scheduler }
          trigger:
            - { call: "POST /campus/event-reservations/${ev_id}/cancel", payload: {}, as: OrgRequester, as_user_id: "${org_id}", captures: { fee: $.data.cancellation_fee_cents } }
          assert:
            - "${fee} == 11500 (100% tier over provisional base room 10000 + quoted service 1500)"
            - "Invoice.${inv_id}.status == FINALIZED and total_cents == 11500 and insurance_surcharge_cents == 0"
            - "ServiceOrder.${so_id}.status == CANCELLED and fee_waived == false (CLIENT-cancel cascade)"
            - "AccessGrant.${grant_id}.status == REVOKED"

  # =========================================================================
  # Section: consistency model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_on_cancel
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the cancel response itself reports CANCELLED with the computed fee, and a same-instant GET of the invoice shows FINALIZED — no asynchronous reconciliation window."
        test_recipe:
          setup: ["INTERNAL org; APPROVED event 2026-09-14 14:00-15:00 (provisional total 1000); clock 2026-09-13T14:00 (notice exactly 24h -> 50% tier)"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept AJ", org_type: "INTERNAL_DEPARTMENT", contact_email: "aj@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "IMM-1", building_code: "IMM", capacity: 30, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-13T14:00:00Z" }, as: Scheduler }
          trigger:
            - { call: "POST /campus/event-reservations/${ev_id}/cancel", payload: {}, as: OrgRequester, as_user_id: "${org_id}", captures: { st: $.data.status, fee: $.data.cancellation_fee_cents } }
            - { call: "GET /campus/invoices/${inv_id}", payload: {}, as: FinanceAdmin, captures: { inv_st: $.data.status, inv_total: $.data.total_cents } }
          assert:
            - "${st} == CANCELLED and ${fee} == 500 (50% of 1000 at exactly 24h notice)"
            - "${inv_st} == FINALIZED and ${inv_total} == 500 in the immediately following read"
