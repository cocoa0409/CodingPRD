  - section: calculations
    instances:

      - name: engagement_score_is_the_rounded_mean_of_this_months_events
        claim_type: Correct Result
        grounds:
          - calculations.engagement_score
          - entities.Subscription.fields.engagement_score
          - entities.Subscription.fields.monthly_engaged_hours_avg
        distinguishing_aspect: "With a 60.0-hour June session at multiplier 1.5 and an 80.0-hour June session at multiplier 1.5, the exact mean is 105.00 hours and the score is 100.00 — the ceiling bites, so the assertion is on the capped value rather than the mean."
        test_recipe:
          setup:
            - "Logical clock 2026-06-10T00:00:00Z; one Subscriber with a paid MONTHLY PREMIUM subscription."
          setup_api_calls:
            - *a_clock
            - *a_region
            - *a_tier_prem
            - call: "POST /catalog/subscribers"
              payload: { email: "eng@example.com", display_name: "Eng", home_region_code: "NA", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_eng_id: $.data.id }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_eng_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { sub_eng_id: $.data.id }
            - call: "POST /catalog/subscriptions/${sub_eng_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_eng_id}"
          trigger:
            - call: "POST /catalog/subscriptions/${sub_eng_id}/engagement-events"
              payload: { title_id: "${title_id}", session_hours: 60.0, channel: "CONSOLE", engagement_multiplier: 1.5 }
              as: Subscriber
              as_user_id: "${subr_eng_id}"
              captures: { ev_first_norm: $.data.normalized_hours }
            - call: "POST /catalog/subscriptions/${sub_eng_id}/engagement-events"
              payload: { title_id: "${title_id}", session_hours: 80.0, channel: "PC", engagement_multiplier: 1.5 }
              as: Subscriber
              as_user_id: "${subr_eng_id}"
              captures: { ev_second_norm: $.data.normalized_hours }
            - call: "GET /catalog/subscriptions/${sub_eng_id}"
              payload: {}
              as: CatalogAdmin
              captures: { mean_hours: $.data.monthly_engaged_hours_avg, score: $.data.engagement_score }
          assert:
            - "ev_first_norm == 90.0000 and ev_second_norm == 120.0000"
            - "mean_hours == 105.00, the exact unrounded mean of the two normalized values"
            - "score == 100.00, the ceiling — not 105.00"
            - "GET /catalog/engagement-events?subscription_id=${sub_eng_id} returns exactly 2 rows"

      - name: engagement_score_excludes_events_from_earlier_months
        claim_type: Input Set Filtering
        grounds:
          - calculations.engagement_score
          - entities.Subscription.fields.engagement_score
        distinguishing_aspect: "The window is the current calendar month only, so a 200.0-hour event recorded in June stops contributing once the clock rolls into July and the score falls back to the July-only mean."
        test_recipe:
          setup:
            - "Logical clock 2026-06-10T00:00:00Z; one Subscriber with a paid MONTHLY PREMIUM subscription and one 200.0-hour June event."
          setup_api_calls:
            - *a_clock
            - *a_tier_prem
            - *a_region
            - call: "POST /catalog/subscribers"
              payload: { email: "win@example.com", display_name: "Win", home_region_code: "NA", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_win_id: $.data.id }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_win_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { sub_win_id: $.data.id }
            - call: "POST /catalog/subscriptions/${sub_win_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_win_id}"
            - call: "POST /catalog/subscriptions/${sub_win_id}/engagement-events"
              payload: { title_id: "${title_id}", session_hours: 200.0, channel: "PC", engagement_multiplier: 1.0 }
              as: Subscriber
              as_user_id: "${subr_win_id}"
          trigger:
            - call: "GET /catalog/subscriptions/${sub_win_id}"
              payload: {}
              as: CatalogAdmin
              captures: { score_in_june: $.data.engagement_score, mean_in_june: $.data.monthly_engaged_hours_avg }
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: CatalogAdmin
            - call: "GET /catalog/subscriptions/${sub_win_id}"
              payload: {}
              as: CatalogAdmin
              captures: { score_in_july: $.data.engagement_score, mean_in_july: $.data.monthly_engaged_hours_avg }
            - call: "POST /catalog/subscriptions/${sub_win_id}/engagement-events"
              payload: { title_id: "${title_id}", session_hours: 20.0, channel: "PC", engagement_multiplier: 1.0 }
              as: Subscriber
              as_user_id: "${subr_win_id}"
            - call: "GET /catalog/subscriptions/${sub_win_id}"
              payload: {}
              as: CatalogAdmin
              captures: { score_july_after: $.data.engagement_score }
          assert:
            - "mean_in_june == 200.00 and score_in_june == 100.00 (the exact 200.00 is capped at the ceiling)"
            - "mean_in_july == 0.00 and score_in_july == 0.00 — the June event left the window and the empty mean is 0.00, not an error"
            - "score_july_after == 20.00, the July-only mean"
            - "GET /catalog/engagement-events?subscription_id=${sub_win_id} still returns 2 rows, so the June event was filtered out of the aggregate, not deleted"

      - name: catalog_removal_notice_minimum_is_inclusive_at_the_day_one_boundary
        claim_type: Constants Applied
        grounds:
          - calculations.catalog_removal_notice
          - errors.ERR_INSUFFICIENT_REMOVAL_NOTICE
        distinguishing_aspect: "The DAY_ONE notice constant is 14 days and the comparison is inclusive: a removal date exactly 14 days after the announced add date is accepted, while 13 days is refused with ERR_INSUFFICIENT_REMOVAL_NOTICE."
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z; NA region, PREMIUM tier, publisher, day-one-eligible title (CONSOLE in its platform set), HYBRID deal LIVE."
          setup_api_calls:
            - *a_clock
            - *a_region
            - *a_tier_prem
            - call: "POST /catalog/tiers"
              payload: { tier_code: "ESSENTIAL", monthly_price_cents: 999, console_access: true, pc_access: false, cloud_access: false, online_play_bundle: false, member_discount_pct: 0.0, discount_retention_days: 0, annual_prepay_credit_ratio: 0.25 }
              as: CatalogAdmin
            - *a_pub
            - *a_title
            - *a_deal
            - call: "POST /catalog/licensing-deals/${deal_id}/sign"
              payload: { expected_title_version: "${title_v}" }
              as: CatalogAdmin
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-06-02T00:00:00Z" }
              as: CatalogAdmin
          trigger:
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-06-16T00:00:00Z", release_class: "DAY_ONE", popularity_index_cents: 6000, popularity_index_cents_30d_avg: 3000 }
              as: CatalogAdmin
              captures: { entry_at_boundary: $.data.id, notice_at_boundary: $.data.removal_notice_days }
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-06-15T00:00:00Z", release_class: "DAY_ONE", popularity_index_cents: 6000, popularity_index_cents_30d_avg: 3000 }
              as: CatalogAdmin
              captures: { err_thirteen_days: $.data.error_id }
          assert:
            - "notice_at_boundary == 14 and the create returns 201"
            - "the 13-day create returns 409 with err_thirteen_days == ERR_INSUFFICIENT_REMOVAL_NOTICE"
            - "GET /catalog/catalog-entries?title_id=${title_id} returns exactly 1 row"
            - "the same 13-day window under release_class CATALOG_ADD would be accepted, because its minimum is 7 days"

      - name: regional_price_precision_never_drifts_on_read
        claim_type: Precision
        grounds:
          - calculations.regional_monthly_price
          - entities.Subscription.fields.monthly_bill_cents
        distinguishing_aspect: "The billed figure is quantised to two decimal places with round_half_up and is stable across repeated reads and across a subscription opened at the same tier in the same region later."
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z; EU region at multiplier 1.015 and PREMIUM tier at a global 1799; two Subscribers in EU."
          setup_api_calls:
            - *a_clock
            - call: "POST /catalog/regions"
              payload: { region_code: "EU", currency_code: "EUR", price_multiplier: 1.015, availability_ceiling_titles: 4000, catalog_tier_floor: "ESSENTIAL" }
              as: CatalogAdmin
            - *a_tier_prem
            - call: "POST /catalog/subscribers"
              payload: { email: "p1@example.com", display_name: "P1", home_region_code: "EU", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_p1: $.data.id }
            - call: "POST /catalog/subscribers"
              payload: { email: "p2@example.com", display_name: "P2", home_region_code: "EU", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_p2: $.data.id }
          trigger:
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_p1}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { sub_p1_id: $.data.id, bill_first: $.data.monthly_bill_cents }
            - call: "GET /catalog/subscriptions/${sub_p1_id}"
              payload: {}
              as: CatalogAdmin
              captures: { bill_reread: $.data.monthly_bill_cents }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_p2}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { bill_second_sub: $.data.monthly_bill_cents }
          assert:
            - "bill_first == 1826.00 (1799 * 1.015 rounded half-up to the cent)"
            - "bill_reread == bill_first"
            - "bill_second_sub == bill_first, so no accumulated rounding drift appears on a later subscription"
            - "GET /catalog/regions/EU still reports price_multiplier == 1.015, since the calculation never writes back"

      - name: cloud_capacity_drops_when_an_entry_leaves_the_active_interval
        claim_type: Input Set Filtering
        grounds:
          - calculations.cloud_capacity_allocation
          - entities.Region.fields.capacity_required_slots
        distinguishing_aspect: "Capacity counts only entries whose half-open active interval contains the clock, so advancing past an entry's removal date removes its whole popularity contribution and the region's status flips back below the ceiling."
        test_recipe:
          setup:
            - "Logical clock 2026-06-04T00:00:00Z; JP region at ceiling 400, PREMIUM tier, publisher, title, HYBRID deal LIVE, and two published entries — one 6000-popularity CATALOG_ADD with removal date 2026-08-31 and one 8000-popularity BACK_CATALOG with removal date 2026-08-10."
