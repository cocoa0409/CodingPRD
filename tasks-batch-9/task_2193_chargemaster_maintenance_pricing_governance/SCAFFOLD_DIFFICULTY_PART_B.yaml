      - name: cross_entity_state_dependency__transparency_publish_gated_by_mapping_code_update_cycle
        grounds:
          - state_machines.TransparencyFile.VALIDATED_to_PUBLISHED
          - state_machines.CodeUpdateCycle.LOADED_to_MAPPING
          - state_machines.CodeUpdateCycle.MAPPING_to_CANCELLED
          - state_machines.CodeUpdateEntry.MAPPED_to_DEFERRED
          - state_machines.ChargeItem.PRICE_FROZEN_to_PRICED_CURRENT
          - state_machines.Facility.chargemaster_posture
          - entities.CodeUpdateCycle.fields.status
          - entities.TransparencyFile.fields.validation_errors
          - validations[priority=20]
          - errors.ERR_TRANSPARENCY_BLACKOUT
          - calculations.transparency_file_build
          - calculations.code_update_crosswalk_price_carry
          - concurrency_rules[transparency-build-stale-facility]
        distinguishing_aspect: |
          The dependency crosses the TransparencyFile -> CodeUpdateCycle pair — a different pair from
          the ChargeItem -> RevenueCode instance — and it is proved by outcome inversion on the
          identical call: VALIDATED -> PUBLISHED is rejected with ERR_TRANSPARENCY_BLACKOUT while the
          facility's CodeUpdateCycle sits in MAPPING, and the very same PUBLISH succeeds once that
          cycle alone moves MAPPING -> CANCELLED, with the blocking facility posture staying FROZEN
          across both attempts (derivation rule 1 outranks the cycle's own RESTRICTED rule 2).
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00Z."
            - "Facility with rounding_mode NEAREST_CENT and aggregate_markup_limit_bp 40000."
            - "RevenueCode 0300, unrestricted Clinical Lab department, one ACTIVE COST_PLUS_MARKUP PriceRule with the default three tiers, one ACTIVE PayerContract covering 2026."
            - "ChargeItem CDM-40001 with code_type CPT / code_value 80053 driven to lifecycle ACTIVE at gross_charge_cents 144000 (version 5)."
            - "TransparencyFile built with the OCC-observed Facility.version and then VALIDATEd, which froze the item to PRICE_FROZEN (item version 6) and derived Facility.chargemaster_posture = FROZEN."
            - "CodeUpdateCycle 2027/CPT created, one CROSSWALK entry 80053 -> 80053A added, cycle moved to MAPPING and the entry MAPPED (carried_gross_charge_cents 144000, unmapped_entry_count 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Northgate General", cms_certification_number: "CCN-2193-F", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000 }
              as: SystemAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory - general", requires_hcpcs: false, allowed_code_types: ["CPT", "HCPCS", "REV_ONLY", "CDM_INTERNAL"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              captures: { rc_lab_id: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac_id}", name: "Clinical Lab", cost_center_code: "CC-7100", manager_user_id: "mgr_lab_01", allowed_revenue_code_values: [] }
              as: SystemAdmin
              captures: { dept_lab_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc_lab_id}", pricing_method: "COST_PLUS_MARKUP", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000, effective_from: "2026-01-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { pr_lab_id: $.data.id }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac_id}", payer_code: "BCBS_STATE", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", percent_of_charge_bp: 4500, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", trailing_units: 100, renegotiation_notice_days: 30 }
              as: ContractManager
              captures: { pc_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_lab_id}", revenue_code_id: "${rc_lab_id}", cdm_number: "CDM-40001", description: "Comprehensive metabolic panel", code_type: "CPT", code_value: "80053", cost_basis_cents: 60000, medicare_rate_cents: 18000, market_p75_cents: 200000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item1_id: $.data.id }
            - call: "POST /chargemaster/charge-items/${item1_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
            - call: "POST /chargemaster/charge-items/${item1_id}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
            - call: "POST /chargemaster/charge-items/${item1_id}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_01"
            - call: "POST /chargemaster/charge-items/${item1_id}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_01"
              captures: { item1_active_version: $.data.version }
            - call: "GET /chargemaster/facilities/${fac_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { fac_v_before_build: $.data.version }
            - call: "POST /chargemaster/transparency-files"
              payload: { facility_id: "${fac_id}", file_format: "JSON", expected_facility_version: "${fac_v_before_build}" }
              as: ComplianceOfficer
              captures: { tf_id: $.data.id, tf_payer_cols: $.data.payer_column_count, tf_included_at_build: $.data.included_item_count }
            - call: "GET /chargemaster/facilities/${fac_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture_after_build: $.data.chargemaster_posture }
            - call: "POST /chargemaster/transparency-files/${tf_id}/lifecycle"
              payload: { action: "VALIDATE" }
              as: ComplianceOfficer
              captures: { tf_status_validated: $.data.status, tf_total_gross: $.data.total_gross_charge_cents, tf_errors: $.data.validation_errors }
            - call: "POST /chargemaster/code-update-cycles"
              payload: { facility_id: "${fac_id}", cycle_year: 2027, code_set: "CPT", cost_inflator_bp: 10300 }
              as: RevenueIntegrityAnalyst
              captures: { cycle_id: $.data.id }
            - call: "POST /chargemaster/code-update-cycles/${cycle_id}/entries"
              payload: { action: "CROSSWALK", old_code_value: "80053", new_code_value: "80053A" }
              as: RevenueIntegrityAnalyst
              captures: { entry_id: $.data.id }
            - call: "POST /chargemaster/code-update-cycles/${cycle_id}/lifecycle"
              payload: { action: "START_MAPPING" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
              captures: { cycle_status_mapping: $.data.status }
            - call: "POST /chargemaster/code-update-entries/${entry_id}/disposition"
              payload: { action: "MAP" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_02"
              captures: { entry_carried: $.data.carried_gross_charge_cents, entry_target: $.data.target_charge_item_id }
            - call: "GET /chargemaster/facilities/${fac_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture_during_blackout: $.data.chargemaster_posture }
          trigger:
            - call: "POST /chargemaster/transparency-files/${tf_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: ComplianceOfficer
            - call: "POST /chargemaster/code-update-cycles/${cycle_id}/lifecycle"
              payload: { action: "CANCEL", note: "2027 crosswalk deferred to the next release window" }
              as: ComplianceOfficer
              as_user_id: "co_01"
              captures: { cycle_status_cancelled: $.data.status }
            - call: "POST /chargemaster/transparency-files/${tf_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: ComplianceOfficer
              captures: { tf_status_published: $.data.status, tf_published_at: $.data.published_at }
          assert:
            - "${item1_active_version} == 5"
            - "${tf_payer_cols} == 1"
            - "${tf_included_at_build} == 1"
            - "${posture_after_build} == FROZEN"
            - "${tf_status_validated} == VALIDATED"
            - "${tf_total_gross} == 144000"
            - "${tf_errors} == []"
            - "${cycle_status_mapping} == MAPPING"
            - "${entry_carried} == 144000"
            - "${entry_target} == ${item1_id}"
            - "${posture_during_blackout} == FROZEN"
            - "The first trigger call returns HTTP 409 with data.error_id == ERR_TRANSPARENCY_BLACKOUT"
            - "After the first trigger call TransparencyFile.${tf_id}.status == VALIDATED and TransparencyFile.${tf_id}.published_at == null"
            - "${cycle_status_cancelled} == CANCELLED"
            - "${tf_status_published} == PUBLISHED"
            - "${tf_published_at} == 2026-09-01T00:00:00Z"
            - "CodeUpdateCycle.${cycle_id}.status == CANCELLED"
            - "CodeUpdateCycle.${cycle_id}.applied_entry_count == 0"
            - "CodeUpdateCycle.${cycle_id}.unmapped_entry_count == 0"
            - "CodeUpdateEntry.${entry_id}.status == DEFERRED"
            - "CodeUpdateEntry.${entry_id}.defer_reason == CYCLE_CANCELLED"
            - "CodeUpdateEntry.${entry_id}.target_charge_item_id == null"
            - "TransparencyFile.${tf_id}.status == PUBLISHED"
            - "TransparencyFile.${tf_id}.included_item_count == 1"
            - "TransparencyFile.${tf_id}.total_gross_charge_cents == 144000"
            - "ChargeItem.${item1_id}.price_status == PRICED_CURRENT"
            - "ChargeItem.${item1_id}.code_value == 80053"
            - "ChargeItem.${item1_id}.gross_charge_cents == 144000"
            - "ChargeItem.${item1_id}.version == 7"
            - "Facility.${fac_id}.published_transparency_file_id == ${tf_id}"
            - "Facility.${fac_id}.transparency_status == CURRENT"
            - "Facility.${fac_id}.chargemaster_posture == OPEN"
            - "Facility.${fac_id}.stale_price_item_count == 0"

      - name: cross_entity_state_dependency__batch_close_gated_by_derived_department_capture_hold
        grounds:
          - state_machines.ChargeCaptureBatch.RECONCILED_to_CLOSED
          - state_machines.MissingChargeFinding.OPEN_to_CONFIRMED
          - state_machines.MissingChargeFinding.CONFIRMED_to_RESOLVED
          - entities.Department.fields.capture_hold
          - entities.Department.fields.unresolved_finding_amount_cents
          - entities.Department.fields.recovered_charge_cents
          - validations[priority=44]
          - errors.ERR_DEPARTMENT_CAPTURE_HOLD
          - calculations.missing_charge_detection
          - calculations.charge_capture_variance_summary
        distinguishing_aspect: |
          The dependency crosses the ChargeCaptureBatch -> Department pair — a third distinct pair,
          different from ChargeItem -> RevenueCode and TransparencyFile -> CodeUpdateCycle — and the
          blocking field is itself derived: RECONCILED -> CLOSED is rejected with
          ERR_DEPARTMENT_CAPTURE_HOLD only because confirming the missing-charge finding pushed
          Department.unresolved_finding_amount_cents to 600000, over the 500000 threshold that
          derives capture_hold = true, and the identical CLOSE succeeds once the finding is RESOLVED
          and that derived flag falls back to false.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-10T00:00:00Z."
            - "Facility with rounding_mode NEAREST_CENT; RevenueCode 0300; Clinical Lab department managed by mgr_lab_01; one ACTIVE FLAT_FEE PriceRule at 300000 cents."
            - "Two ACTIVE ChargeItems: TRIGGER item CDM-50001 (companion_required_item_id = the COMPANION item, companion_window_hours 24) and COMPANION item CDM-50002; both repriced to gross_charge_cents 300000 by the FLAT_FEE rule."
            - "One ChargeCaptureBatch over 2026-09-01..2026-09-30 with two posted lines on encounter ENC-9001: 2 units of CDM-50001 at 600000 cents dated 2026-09-05T08:00:00Z, and 2 units of CDM-50002 at 600000 cents dated 2026-09-08T08:00:00Z — 72 hours later, i.e. OUTSIDE the 24-hour companion window, so missing_charge_detection still opens one MissingChargeFinding with estimated_lost_charge_cents 600000 (300000 * 2) while the CDM-50002 line remains available as the RESOLVE recovery line."
            - "Both lines reconcile to MATCHED (posted == expected == 600000, line_variance_bp 0), and the batch is FINALIZEd to RECONCILED with the finding still OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Northgate General", cms_certification_number: "CCN-2193-G", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000 }
              as: SystemAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory - general", requires_hcpcs: false, allowed_code_types: ["CPT", "HCPCS", "REV_ONLY", "CDM_INTERNAL"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              captures: { rc_lab_id: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac_id}", name: "Clinical Lab", cost_center_code: "CC-7100", manager_user_id: "mgr_lab_01", allowed_revenue_code_values: [] }
              as: SystemAdmin
              captures: { dept_lab_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc_lab_id}", pricing_method: "FLAT_FEE", flat_fee_cents: 300000, min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000, effective_from: "2026-01-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { pr_flat_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_lab_id}", revenue_code_id: "${rc_lab_id}", cdm_number: "CDM-50002", description: "Interpretation and report", code_type: "CDM_INTERNAL", cost_basis_cents: 100000, medicare_rate_cents: 200000, market_p75_cents: 400000, effective_from: "2026-09-10T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { comp_item_id: $.data.id }
            - call: "POST /chargemaster/charge-items/${comp_item_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
              captures: { comp_gross: $.data.gross_charge_cents }
            - call: "POST /chargemaster/charge-items/${comp_item_id}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
            - call: "POST /chargemaster/charge-items/${comp_item_id}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_01"
            - call: "POST /chargemaster/charge-items/${comp_item_id}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_01"
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_lab_id}", revenue_code_id: "${rc_lab_id}", cdm_number: "CDM-50001", description: "Complex assay with interpretation", code_type: "CDM_INTERNAL", cost_basis_cents: 100000, medicare_rate_cents: 200000, market_p75_cents: 400000, effective_from: "2026-09-10T00:00:00Z", companion_required_item_id: "${comp_item_id}", companion_window_hours: 24 }
              as: RevenueIntegrityAnalyst
              captures: { trig_item_id: $.data.id }
            - call: "POST /chargemaster/charge-items/${trig_item_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
              captures: { trig_gross: $.data.gross_charge_cents }
            - call: "POST /chargemaster/charge-items/${trig_item_id}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
            - call: "POST /chargemaster/charge-items/${trig_item_id}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_01"
            - call: "POST /chargemaster/charge-items/${trig_item_id}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_01"
            - call: "POST /chargemaster/charge-capture-batches"
              payload: { facility_id: "${fac_id}", department_id: "${dept_lab_id}", window_start_date: "2026-09-01T00:00:00Z", window_end_date: "2026-09-30T00:00:00Z" }
              as: DepartmentManager
              as_user_id: "mgr_lab_01"
              captures: { batch_id: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/lines"
              payload: { submitted_cdm_number: "CDM-50001", encounter_id: "ENC-9001", payer_code: "BCBS_STATE", service_datetime: "2026-09-05T08:00:00Z", quantity: 2, posted_charge_cents: 600000 }
              as: DepartmentManager
              as_user_id: "mgr_lab_01"
              captures: { line_trig_id: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/lines"
              payload: { submitted_cdm_number: "CDM-50002", encounter_id: "ENC-9001", payer_code: "BCBS_STATE", service_datetime: "2026-09-08T08:00:00Z", quantity: 2, posted_charge_cents: 600000 }
              as: DepartmentManager
              as_user_id: "mgr_lab_01"
              captures: { line_recovery_id: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/reconcile"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
              captures: { batch_open_findings: $.data.open_finding_count, batch_matched: $.data.matched_line_count }
            - call: "GET /chargemaster/missing-charge-findings?batch_id=${batch_id}&status=OPEN"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { finding_id: "$.data[0].id", finding_amount: "$.data[0].estimated_lost_charge_cents", finding_expected_item: "$.data[0].expected_charge_item_id" }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/lifecycle"
              payload: { action: "FINALIZE" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
              captures: { batch_status_reconciled: $.data.status }
          trigger:
            - call: "POST /chargemaster/missing-charge-findings/${finding_id}/disposition"
              payload: { action: "CONFIRM", disposition_note: "companion interpretation was genuinely never posted" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
              captures: { finding_status_confirmed: $.data.status }
            - call: "GET /chargemaster/departments/${dept_lab_id}"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { dept_hold_on: $.data.capture_hold, dept_unresolved_on: $.data.unresolved_finding_amount_cents }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
            - call: "POST /chargemaster/missing-charge-findings/${finding_id}/disposition"
              payload: { action: "RESOLVE", disposition_note: "late-posted companion line accepted", recovery_captured_charge_id: "${line_recovery_id}" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
              captures: { finding_status_resolved: $.data.status }
            - call: "GET /chargemaster/departments/${dept_lab_id}"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { dept_hold_off: $.data.capture_hold, dept_unresolved_off: $.data.unresolved_finding_amount_cents, dept_recovered: $.data.recovered_charge_cents }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
              captures: { batch_status_closed: $.data.status }
          assert:
            - "${comp_gross} == 300000"
            - "${trig_gross} == 300000"
            - "${batch_matched} == 2"
            - "${batch_open_findings} == 1"
            - "${finding_amount} == 600000"
            - "${finding_expected_item} == ${comp_item_id}"
            - "${batch_status_reconciled} == RECONCILED"
            - "${finding_status_confirmed} == CONFIRMED"
            - "${dept_unresolved_on} == 600000"
            - "${dept_hold_on} == true"
            - "The third trigger call (CLOSE while capture_hold is true) returns HTTP 409 with data.error_id == ERR_DEPARTMENT_CAPTURE_HOLD"
            - "${finding_status_resolved} == RESOLVED"
            - "${dept_unresolved_off} == 0"
            - "${dept_recovered} == 600000"
            - "${dept_hold_off} == false"
            - "${batch_status_closed} == CLOSED"
            - "ChargeCaptureBatch.${batch_id}.status == CLOSED"
            - "ChargeCaptureBatch.${batch_id}.open_finding_count == 0"
            - "ChargeCaptureBatch.${batch_id}.reconcile_pass_count == 1"
            - "ChargeCaptureBatch.${batch_id}.line_count == 2"
            - "ChargeCaptureBatch.${batch_id}.exception_line_count == 0"
            - "ChargeCaptureBatch.${batch_id}.mean_line_variance_bp == 0"
            - "ChargeCaptureBatch.${batch_id}.total_expected_charge_cents == 1200000"
            - "ChargeCaptureBatch.${batch_id}.total_posted_charge_cents == 1200000"
            - "MissingChargeFinding.${finding_id}.status == RESOLVED"
            - "MissingChargeFinding.${finding_id}.estimated_lost_charge_cents == 600000"
            - "MissingChargeFinding.${finding_id}.recovery_captured_charge_id == ${line_recovery_id}"
            - "Department.${dept_lab_id}.unresolved_finding_amount_cents + Department.${dept_lab_id}.recovered_charge_cents == 600000"
            - "Department.${dept_lab_id}.capture_hold == false"

