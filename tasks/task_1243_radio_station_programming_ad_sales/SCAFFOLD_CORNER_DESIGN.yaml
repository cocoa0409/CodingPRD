          trigger:
            - { call: "POST /logs/${lg}/music-placements", payload: { song_id: "${s1}", hour: 12 }, as: TrafficDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CATEGORY_SPIN_CAP_EXCEEDED, HTTP 422"]

