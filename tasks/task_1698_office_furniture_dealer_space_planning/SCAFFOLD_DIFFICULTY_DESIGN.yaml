  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_tentative_nonblocking_exclusive_window
        grounds:
          - validations[priority=8]
          - state_machines.InstallEvent.TENTATIVE_to_CONFIRMED
          - errors[ERR_CREW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: exclusive half-open occupation plus a turnover buffer,
          evaluated only against CONFIRMED/IN_PROGRESS events on the Crew resource —
          two overlapping TENTATIVE events coexist, the first confirm wins the slot,
          and the second confirm fails. Resource: Crew; semantics differ from the
          staging aggregate-capacity rule.
