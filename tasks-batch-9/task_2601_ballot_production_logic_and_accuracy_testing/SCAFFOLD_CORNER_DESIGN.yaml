      - name: calc_contest_ordering_excludes_draft_and_withdrawn_contests
        claim_type: input_set_filtering
        grounds:
          - calculations.contest_ballot_ordering
          - state_machines.Contest.CERTIFIED_to_WITHDRAWN
          - entities.Contest.fields.ballot_order_index
        distinguishing_aspect: "A DRAFT contest whose (type, district, title) would sort FIRST is excluded from the input set entirely - it neither takes index 1 nor shifts the certified contests - and a contest withdrawn after ordering leaves a visible gap because the survivors are deliberately NOT renumbered."
        test_recipe:
          setup:
            - "The three certified contests of the ordering example plus one DRAFT contest CANDIDATE/D-01/Aardvark Advisory Board that would sort ahead of all of them; certify-ballot-order already run."
          setup_api_calls:
