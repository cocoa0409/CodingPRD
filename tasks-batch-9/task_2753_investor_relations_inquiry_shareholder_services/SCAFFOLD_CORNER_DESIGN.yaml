  - section: cross_cutting_complexity_layers
    instances:
      - name: estimate_write_refuses_a_stale_contact_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[estimate-create-stale-contact]
          - endpoints[POST /estimates]
          - errors[ERR_STALE_CONTACT_VERSION]
        distinguishing_aspect: "The version the client read before the model-access grant is no longer current: the estimate is refused with ERR_STALE_CONTACT_VERSION (412) at priority 7, and re-reading the contact makes the identical body succeed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One company with one SELL_SIDE_ANALYST contact, nda_on_file true, coverage_status INITIATED; its version is read before access is granted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "OCC", legal_name: "Contact Version Corp", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "SELL_SIDE_ANALYST", display_name: "Stale Version Analyst", email: "occ@bank.test", nda_on_file: true, coverage_status: "INITIATED" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { c_id: "$.data.id", c_v1: "$.data.version" }
            - call: "POST /contacts/${c_id}/servicing"
              payload: { action: "GRANT_MODEL_ACCESS" }
              as: DisclosureOfficer
              as_user_id: "u_do_1"
          trigger:
            - call: "POST /estimates"
              payload: { contact_id: "${c_id}", metric: "REVENUE", period_label: "FY2026", value: 1500.0000, expected_contact_version: "${c_v1}" }
              as: Investor
              as_user_id: "${c_id}"
            - call: "GET /contacts/${c_id}"
              payload: {}
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { c_v2: "$.data.version" }
            - call: "POST /estimates"
              payload: { contact_id: "${c_id}", metric: "REVENUE", period_label: "FY2026", value: 1500.0000, expected_contact_version: "${c_v2}" }
              as: Investor
              as_user_id: "${c_id}"
            - call: "GET /contacts/${c_id}"
              payload: {}
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { c_v3: "$.data.version" }
          assert:
            - "trigger step 1 responds HTTP 412 with $.data.error_id == ERR_STALE_CONTACT_VERSION and no EstimateSubmission row is created"
            - "the captured ${c_v1} is 1 and ${c_v2} is 2 — the grant advanced the contact"
            - "trigger step 3 responds HTTP 201 with status ACCEPTED"
            - "${c_v3} is 3 — the accepted estimate bumped the contact version again, so ${c_v2} would now itself be stale"

