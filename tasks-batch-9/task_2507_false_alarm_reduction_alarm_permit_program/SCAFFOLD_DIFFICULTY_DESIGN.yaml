            - {call: "POST /false-alarm-program/alarm-sites", payload: {address_key: "2507-CAP-400-SCHOOLHOUSE-RD", street_address: "400 Schoolhouse Rd", city: "Fairview", zip_code: "44014", occupancy_class: "SCHOOL", police_beat: "B05"}, as: PermitClerk, captures: {site_cap: $.data.id}}
