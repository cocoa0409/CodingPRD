      - name: consent_pending_prior_firm_client_is_off_limits_while_the_approach_is_confidential
        claim_type: conditional_validation
        grounds:
          - validations[priority=12]
          - errors[ERR_CONFIDENTIAL_APPROACH_RESTRICTION]
          - entities.Candidate.fields.approach_confidential
          - entities.ClientBookEntry.fields.client_consent_status
        distinguishing_aspect: |
          A CONDITIONAL rule with a two-factor guard: it engages only when
          Candidate.approach_confidential is true AND the named client matches an ACTIVE
          ClientBookEntry still sitting at CONSENT_PENDING. The two introductions in this
          probe differ ONLY in target_client_name, and both slots are identical and legal,
          so the divergence isolates the consent factor: 'Calder Manufacturing'
          (CONSENT_PENDING) is refused while 'Northwind Holdings' (CONSENT_CONFIRMED) on the
          exact same slot is created. Note that the constraint is keyed on a string field of
          a sibling aggregate, not on any foreign key.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup and one ACTIVE SearchFirmEngagement."
            - "One Candidate with approach_confidential == true, HIRED on 2026-08-01 with notice_period_days 45, so earliest_start_date == 2026-09-15 and the 30-day non-solicit embargo ended on 2026-08-31."
            - "The AB BOOK: entry A 'Northwind Holdings' with client_consent_status CONSENT_CONFIRMED and entry B 'Calder Manufacturing' with client_consent_status CONSENT_PENDING, both ACTIVE."
            - "One ACTIVE IntegrationPlan over [2026-10-01, 2027-06-30] with zero introductions."
