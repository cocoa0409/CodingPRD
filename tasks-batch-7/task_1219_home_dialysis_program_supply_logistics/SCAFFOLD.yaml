# =============================================================================
# Task 1219 — Home Dialysis Program & Supply Logistics — SCAFFOLD (§1.0–§1.7)
# Difficulty target: beyond Expert (user request: "hard than expert level")
# =============================================================================

scenario: |
  generate task hard than expert level! 1219. Home Dialysis Program & Supply Logistics (home dialysis program): patient training program & home assessment, monthly supply order & delivery scheduling with storage limits, water/electrical setup & home modification, treatment log collection & clinical review cadence, machine maintenance & backup/emergency plan, in-center backup slot availability, supply waste & inventory return, transition/home-to-center reason coding

domain_name: home-dialysis-supply-logistics
api_prefix: /api
list_ordering: "All list endpoints return rows ordered by created_at ASC (the deterministic common-field fallback); pagination slices that order via limit/offset."

complexity_profile:
  primary_archetype: "quota / allocation"
  secondary_archetype: "posture-driven gating"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_note: |
    Calibrated beyond the Expert band per explicit request: 16 entities, 8 state
    machines (4 cyclic, 1 parallel-axis, 1 branching), 3 OCC create-with-supersede
    rules, 2 dual-variant calculation pairs on different domains, 3 combinatorial
    formulas covering modes (a)/(b)/(c), 2 depth-3 transitive cascades, 2 temporal
    overlap semantics (half-open chair intervals vs closed machine intervals),
    2 compensating invariants, segregation-of-duties on training and assessment.

# =============================================================================
# §1.1 Entity-Relationship Table
# (common_fields: true => id, created_at, updated_at, version per spec)
# =============================================================================
entities:
  - name: DialysisProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: review_cadence_treatments, type: integer, source: input, description: "A CADENCE ClinicalReview is auto-opened when a patient's unreviewed (SUBMITTED|FLAGGED) log count reaches this", constraints: ">= 1" }
      - { name: max_missed_log_streak, type: integer, source: input, description: "missed_log_streak >= this value contributes posture AT_RISK", constraints: ">= 1" }
      - { name: waste_ratio_alert_threshold, type: number, source: input, description: "Monthly WASTE ratio >= threshold triggers escalation review + waste_alert_active latch", constraints: "0 < t <= 1" }
      - { name: supply_catalog, type: array, source: input, description: "Catalog entries {sku, name, unit_price_cents, handling_rate_cents, unit_credit_cents}; sku unique within program; handling_rate_cents may be fractional (e.g. 10.5)" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> DialysisProgram.id" }
      - { name: full_name, type: string, source: input, description: "Patient name" }
      - { name: prescription_treatments_per_week, type: integer, source: input, description: "Prescribed treatments per week (Nephrologist-managed)", constraints: "1..7" }
      - { name: prescription_units_per_treatment, type: integer, source: input, description: "Prescribed supply units consumed per treatment", constraints: ">= 1" }
      - { name: program_status, type: enum, source: system, description: "TRAINING | ACTIVE_HOME | SUSPENDED | TRANSITIONED_OUT", default: TRAINING }
      - { name: ever_home_ready, type: boolean, source: system, default: false, description: "Latched true on first successful /activate; never returns to false" }
      - { name: retraining_required, type: boolean, source: system, default: false, description: "Set by ClinicalReview sign-off outcome REQUIRE_RETRAINING; cleared by any subsequent passing SIGNED_OFF TrainingAttempt" }
      - { name: waste_alert_active, type: boolean, source: system, default: false, description: "Latched when monthly waste ratio crosses threshold; cleared on any ClinicalReview SIGNED_OFF" }
      - { name: posture, type: enum, source: computed, description: "NOT_READY | HOME_READY | AT_RISK | BLOCKED — see calculations.posture_derivation" }
      - { name: storage_cap_units, type: integer, source: computed, description: "From latest ACCEPTED HomeAssessment (see calculations.home_assessment_evaluation); 0 when none" }
      - { name: on_hand_units, type: integer, source: computed, description: "Delivered minus logged consumption minus verified/credited waste-return units (see calculations.on_hand_units)" }
      - { name: missed_log_streak, type: integer, source: computed, description: "Consecutive expected-interval misses; see calculations.missed_log_streak" }
      - { name: no_show_count, type: integer, source: computed, description: "Count of BackupSlotReservation in NO_SHOW status", default: 0 }

  - name: TrainingAttempt
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: module_code, type: enum, source: input, description: "WATER_HANDLING | MACHINE_OPERATION | ASEPTIC_TECHNIQUE | EMERGENCY_RESPONSE | SUPPLY_STORAGE" }
      - { name: score_pct, type: integer, source: input, description: "Attempt score", constraints: "0..100" }
      - { name: trainer_user_id, type: string, source: system, description: "X-User-ID of the recording HomeNurse" }
      - { name: is_passing, type: boolean, source: computed, description: "score_pct >= MODULE_PASS_PCT (80)" }
      - { name: signed_off_by_user_id, type: string, source: system, description: "X-User-ID of sign-off nurse; null until SIGNED_OFF" }
      - { name: signed_off_at, type: datetime, source: system, description: "Logical-clock timestamp of sign-off; null until SIGNED_OFF" }
      - { name: status, type: enum, source: system, description: "RECORDED | SIGNED_OFF", default: RECORDED }

  - name: HomeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: assessment_kind, type: enum, source: input, description: "INITIAL | REASSESSMENT | POST_MODIFICATION" }
      - { name: water_chloramine_ppm, type: number, source: input, description: "Measured chloramine ppm", constraints: ">= 0" }
      - { name: electrical_dedicated_circuit, type: boolean, source: input, description: "Dedicated circuit present" }
      - { name: electrical_voltage_verified, type: boolean, source: input, description: "Voltage verified" }
      - { name: storage_area_sqft, type: number, source: input, description: "Certified storage area", constraints: "> 0" }
      - { name: storage_cap_units, type: integer, source: computed, description: "min(400, floor(storage_area_sqft * 4))" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL per calculations.home_assessment_evaluation" }
      - { name: assessed_by_user_id, type: string, source: system, description: "X-User-ID of creating nurse (refreshed on resubmit)" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock timestamp of acceptance; null until ACCEPTED" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REMEDIATION_REQUIRED | SUPERSEDED", default: SUBMITTED }

  - name: HomeModificationWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: assessment_id, type: string, source: input, description: "FK -> HomeAssessment.id (the REMEDIATION_REQUIRED assessment this order remediates)" }
      - { name: work_type, type: enum, source: input, description: "PLUMBING | ELECTRICAL | STORAGE_BUILDOUT" }
      - { name: cost_estimate_cents, type: integer, source: input, description: "Estimated cost", constraints: ">= 0" }
      - { name: scheduled_window_start, type: datetime, source: system, description: "Set at approve" }
      - { name: scheduled_window_end, type: datetime, source: system, description: "Set at approve" }
      - { name: final_cost_cents, type: integer, source: system, description: "Set at complete" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | COMPLETED | INSPECTED_PASS | INSPECTED_FAIL | CANCELLED", default: REQUESTED }

  - name: DialysisMachine
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> DialysisProgram.id" }
      - { name: serial_number, type: string, source: input, description: "Unique within program" }
      - { name: model, type: string, source: input, description: "Machine model" }
      - { name: status, type: enum, source: system, description: "IN_STOCK | ASSIGNED | UNDER_MAINTENANCE | DECOMMISSIONED", default: IN_STOCK }
      - { name: assigned_patient_id, type: string, source: system, description: "FK -> Patient.id; null when unassigned (retained while UNDER_MAINTENANCE)" }
      - { name: total_runtime_hours, type: number, source: computed, description: "sum(duration_minutes)/60 over TreatmentLog with machine_id = this machine, all statuses; 2 decimal places" }
      - { name: runtime_hours_at_last_service, type: number, source: computed, description: "runtime_hours_at_service of latest COMPLETED MaintenanceEvent (by updated_at, tie-break created_at); 0 if none" }
      - { name: maintenance_due, type: boolean, source: computed, description: "(total_runtime_hours - runtime_hours_at_last_service) >= 500" }

  - name: MaintenanceEvent
    parent: null
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> DialysisMachine.id" }
      - { name: event_type, type: enum, source: input, description: "PREVENTIVE | REPAIR | DECONTAMINATION" }
      - { name: window_start, type: datetime, source: input, description: "Service window start (closed interval)" }
      - { name: window_end, type: datetime, source: input, description: "Service window end (closed interval); must be > window_start" }
      - { name: runtime_hours_at_service, type: number, source: system, description: "Snapshot of machine.total_runtime_hours at completion" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED", default: SCHEDULED }

  - name: EmergencyBackupPlan
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: plan_mode, type: enum, source: input, description: "IN_CENTER_CHAIR | BACKUP_MACHINE | BOTH" }
      - { name: backup_machine_id, type: string, source: input, description: "FK -> DialysisMachine.id; required unless plan_mode == IN_CENTER_CHAIR; referenced machine must be IN_STOCK" }
      - { name: last_drill_at, type: datetime, source: system, description: "Logical-clock timestamp of creation or latest drill" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | SUPERSEDED | CLOSED; EXPIRED applied lazily when now >= last_drill_at + 90 days", default: ACTIVE }

  - name: SupplyOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: order_month, type: string, source: input, description: "Month bucket, format YYYY-MM" }
      - { name: lines, type: array, source: input, description: "[{sku, quantity}] — sku must exist in program supply_catalog, quantity >= 1" }
      - { name: provisional_total_units, type: integer, source: computed, description: "sum of line quantities" }
      - { name: subtotal_cents, type: integer, source: computed, description: "sum(quantity * catalog unit_price_cents)" }
      - { name: handling_fee_cents, type: integer, source: computed, description: "500 + per-line round_half_up(quantity * handling_rate_cents), summed (see calculations.handling_fee)" }
      - { name: discount_cents, type: integer, source: computed, description: "round_half_up(subtotal * 0.05) when subtotal >= 20000 else 0 (keyed on subtotal)" }
      - { name: grand_total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents + handling_fee_cents" }
      - { name: standard_allowance_units, type: integer, source: computed, description: "Evaluated and stored at submit: tpw * 4 * units_per_treatment" }
      - { name: carried_adjustment_units, type: integer, source: computed, description: "adjustment_units of patient's CLOSED order for the immediately preceding month; 0 if none" }
      - { name: actualized_units, type: integer, source: computed, description: "Set at close: sum of consumption_units of patient's logs dated inside order_month" }
      - { name: adjustment_units, type: integer, source: computed, description: "Set at close: actualized_units - standard_allowance_units" }
      - { name: delivered_units_total, type: integer, source: computed, description: "sum(delivered_units) over this order's DELIVERED appointments", default: 0 }
      - { name: review_note, type: string, source: system, description: "Note from latest review decision" }
      - { name: order_status, type: enum, source: system, description: "DRAFT | SUBMITTED | CHANGES_REQUESTED | APPROVED | CLOSED | SUPERSEDED | CANCELLED", default: DRAFT }
      - { name: fulfillment_status, type: enum, source: system, description: "UNFULFILLED | PARTIALLY_DELIVERED | DELIVERED — independent axis from order_status", default: UNFULFILLED }

  - name: DeliveryAppointment
    parent: null
    common_fields: true
    fields:
      - { name: supply_order_id, type: string, source: input, description: "FK -> SupplyOrder.id" }
      - { name: window_start, type: datetime, source: input, description: "Delivery window start; must be >= now and its date inside order_month" }
      - { name: window_end, type: datetime, source: input, description: "Delivery window end; duration 120..720 minutes" }
      - { name: delivered_units, type: integer, source: system, description: "Set at complete; 1..remaining undelivered units" }
      - { name: failure_reason, type: string, source: system, description: "Set at fail" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DELIVERED | FAILED | CANCELLED", default: SCHEDULED }

  - name: TreatmentLog
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: machine_id, type: string, source: input, description: "FK -> DialysisMachine.id; machine must be ASSIGNED to this patient" }
      - { name: treatment_date, type: string, source: input, description: "YYYY-MM-DD; not in the future; unique per patient" }
      - { name: duration_minutes, type: integer, source: input, description: "Session length", constraints: "30..600" }
      - { name: consumption, type: array, source: input, description: "[{sku, units}] — sku in program catalog, units >= 1; may be empty" }
      - { name: consumption_units, type: integer, source: computed, description: "sum of consumption units" }
      - { name: flag_note, type: string, source: system, description: "Nurse note set at flag" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | REVIEWED | FLAGGED", default: SUBMITTED }

  - name: ClinicalReview
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id (reviews are system-created)" }
      - { name: period_start, type: string, source: system, description: "First treatment_date covered (YYYY-MM-DD)" }
      - { name: period_end, type: string, source: system, description: "Last treatment_date covered (YYYY-MM-DD)" }
      - { name: due_reason, type: enum, source: system, description: "CADENCE | ESCALATION" }
      - { name: due_at, type: datetime, source: system, description: "created_at + 5 days (REVIEW_SLA_DAYS)" }
      - { name: outcome, type: enum, source: system, description: "CONTINUE | MODIFY_PRESCRIPTION | REQUIRE_RETRAINING | RECOMMEND_TRANSITION; null until sign-off" }
      - { name: adherence_rolling_pct, type: number, source: computed, description: "Computed at sign-off per calculations.adherence_rolling_pct; null until SIGNED_OFF" }
      - { name: signed_off_at, type: datetime, source: system, description: "Null until SIGNED_OFF" }
      - { name: status, type: enum, source: system, description: "PENDING | SIGNED_OFF | ESCALATED", default: PENDING }

  - name: InCenterChair
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> DialysisProgram.id" }
      - { name: chair_code, type: string, source: input, description: "Unique within program" }
      - { name: in_service, type: boolean, source: input, default: true, description: "Out-of-service chairs reject new reservations" }

  - name: BackupSlotReservation
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: chair_id, type: string, source: input, description: "FK -> InCenterChair.id" }
      - { name: slot_start, type: datetime, source: input, description: "Half-open interval start; must be >= now" }
      - { name: slot_end, type: datetime, source: input, description: "Half-open interval end; duration 60..480 minutes" }
      - { name: status, type: enum, source: system, description: "RESERVED | COMPLETED | CANCELLED | NO_SHOW (NO_SHOW applied lazily when now > slot_end)", default: RESERVED }

  - name: WasteReturnRecord
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: record_type, type: enum, source: input, description: "WASTE | RETURN" }
      - { name: activity_month, type: string, source: input, description: "YYYY-MM bucket for ratio/credit accounting" }
      - { name: lines, type: array, source: input, description: "[{sku, units, expired}] — sku in catalog; units >= 1; expired boolean (expired RETURN lines earn zero credit)" }
      - { name: total_units, type: integer, source: computed, description: "sum of line units" }
      - { name: credit_cents, type: integer, source: computed, description: "Computed at verify per calculations.return_credit; 0 for WASTE and REJECTED" }
      - { name: status, type: enum, source: system, description: "REPORTED | VERIFIED | CREDITED | REJECTED", default: REPORTED }

  - name: TransitionRecord
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: reversal_of_id, type: string, source: input, description: "FK -> TransitionRecord.id; required iff direction == CENTER_TO_HOME" }
      - { name: direction, type: enum, source: input, description: "HOME_TO_CENTER | CENTER_TO_HOME" }
      - { name: reason_code, type: enum, source: input, description: "PATIENT_CHOICE | MEDICAL_COMPLICATION | SUPPLY_FAILURE | MACHINE_FAILURE | HOME_UNSUITABLE | TRAINING_INCOMPLETE | NON_ADHERENCE" }
      - { name: effective_from, type: string, source: input, description: "YYYY-MM-DD activation date" }
      - { name: effective_to, type: string, source: input, description: "YYYY-MM-DD end date; null = permanent; required > effective_from for temporary HOME_TO_CENTER; must be null for CENTER_TO_HOME" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | ACTIVE | COMPLETED | REVERSED; COMPLETED applied lazily when now > effective_to", default: REQUESTED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Patient
    initial_state: TRAINING
    terminal_states: [TRANSITIONED_OUT]
    note: "program_status is the stored axis; posture is a derived gate (calculations.posture_derivation) re-evaluated on every Patient read and on every mutation of its inputs."
    transitions:
      - from: TRAINING
        to: ACTIVE_HOME
        trigger: "POST /api/patients/{id}/activate"
        actor: Nephrologist
        preconditions:
          - "Every module_code has a SIGNED_OFF passing TrainingAttempt with signed_off_at > now - 365 days (ERR_TRAINING_INCOMPLETE — checked first)"
          - "Latest ACCEPTED HomeAssessment has accepted_at > now - 730 days (ERR_ASSESSMENT_NOT_CURRENT)"
          - "A DialysisMachine with status ASSIGNED and assigned_patient_id == patient exists (ERR_NO_MACHINE_ASSIGNED)"
          - "An EmergencyBackupPlan with status ACTIVE exists (ERR_NO_ACTIVE_PLAN)"
        side_effects:
          - "ever_home_ready = true"
          - "posture recomputed (expected HOME_READY)"
      - from: ACTIVE_HOME
        to: SUSPENDED
        trigger: "POST /api/patients/{id}/suspend"
        actor: Nephrologist
        preconditions:
          - "reason is a non-empty string (ERR_INVALID_REQUEST)"
        side_effects:
          - "Machine assignment, plans, orders are NOT touched by a manual suspend (contrast with transition-driven suspension)"
      - from: SUSPENDED
        to: ACTIVE_HOME
        trigger: "POST /api/patients/{id}/reinstate"
        actor: Nephrologist
        preconditions:
          - "No TransitionRecord for this patient with direction HOME_TO_CENTER and status ACTIVE (ERR_ACTIVE_TRANSITION_BLOCKS_REINSTATE — checked first)"
          - "All four readiness gates pass (certification current, assessment current, machine assigned, plan ACTIVE) else ERR_READINESS_GATES_NOT_MET"
        side_effects:
          - "posture recomputed"
      - from: ACTIVE_HOME
        to: SUSPENDED
        trigger: "system (POST /api/transition-records/{id}/activate on a temporary HOME_TO_CENTER transition)"
        actor: system
        preconditions: []
        side_effects:
          - "Assigned machine: ASSIGNED -> IN_STOCK, assigned_patient_id = null (link 1 of cascade)"
          - "That machine's SCHEDULED MaintenanceEvents -> CANCELLED (link 2, caused by machine status change)"
          - "Open SupplyOrders (DRAFT | SUBMITTED | CHANGES_REQUESTED | APPROVED) -> CANCELLED; their SCHEDULED DeliveryAppointments -> CANCELLED"
          - "Future BackupSlotReservations in RESERVED -> CANCELLED"
          - "EmergencyBackupPlan is retained (drill clock keeps running)"
      - from: ACTIVE_HOME
        to: TRANSITIONED_OUT
        trigger: "system (POST /api/transition-records/{id}/activate on a permanent HOME_TO_CENTER transition, effective_to null)"
        actor: system
        preconditions: []
        side_effects:
          - "Assigned machine: ASSIGNED -> IN_STOCK, assigned_patient_id = null (link 1 of cascade)"
          - "That machine's SCHEDULED MaintenanceEvents -> CANCELLED (link 2, caused by machine status change)"
          - "EmergencyBackupPlan ACTIVE|EXPIRED -> CLOSED"
          - "Open SupplyOrders (DRAFT | SUBMITTED | CHANGES_REQUESTED | APPROVED) -> CANCELLED; their SCHEDULED DeliveryAppointments -> CANCELLED"
          - "Future BackupSlotReservations in RESERVED -> CANCELLED"
      - from: SUSPENDED
        to: TRANSITIONED_OUT
        trigger: "system (POST /api/transition-records/{id}/activate on a permanent HOME_TO_CENTER transition while SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "Same cascade set as ACTIVE_HOME -> TRANSITIONED_OUT (machine may already be IN_STOCK; then only plan/order/slot cascades fire)"
      - from: SUSPENDED
        to: ACTIVE_HOME
        trigger: "system (POST /api/transition-records/{id}/activate on a CENTER_TO_HOME reversal)"
        actor: system
        preconditions:
          - "All four readiness gates pass (ERR_READINESS_GATES_NOT_MET) — machine must have been re-assigned and plan re-drilled first"
        side_effects:
          - "The reversed HOME_TO_CENTER TransitionRecord: ACTIVE -> REVERSED"
      - from: SUSPENDED
        to: ACTIVE_HOME
        trigger: "system (lazy completion: now > effective_to of the ACTIVE temporary transition)"
        actor: system
        preconditions: []
        side_effects:
          - "TransitionRecord ACTIVE -> COMPLETED"
          - "No readiness-gate recheck on lazy completion; posture recompute may yield AT_RISK"

  - entity: TrainingAttempt
    initial_state: RECORDED
    terminal_states: [SIGNED_OFF]
    transitions:
      - from: RECORDED
        to: SIGNED_OFF
        trigger: "POST /api/training-attempts/{id}/sign-off"
        actor: HomeNurse
        preconditions:
          - "Attempt is RECORDED (ERR_ATTEMPT_NOT_RECORDED)"
          - "is_passing == true (ERR_ATTEMPT_NOT_PASSING)"
          - "X-User-ID != trainer_user_id (ERR_SOD_SIGNOFF_BY_TRAINER — segregation of duties)"
        side_effects:
          - "signed_off_by_user_id = X-User-ID; signed_off_at = now"
          - "If patient.retraining_required == true: retraining_required = false (any passing sign-off clears it)"
          - "posture recomputed"

  - entity: HomeAssessment
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/home-assessments/{id}/accept"
        actor: HomeNurse
        preconditions:
          - "Status SUBMITTED (ERR_ASSESSMENT_INVALID_STATE)"
          - "result == PASS (ERR_ASSESSMENT_RESULT_FAIL)"
          - "X-User-ID != assessed_by_user_id (ERR_SOD_ASSESSOR_SELF_ACCEPT — segregation of duties)"
        side_effects:
          - "accepted_at = now"
          - "Any other ACCEPTED assessment for this patient -> SUPERSEDED (link 1)"
          - "patient.storage_cap_units recomputed from this assessment (link 2)"
          - "Cap-shrink cascade (link 3): for each open SupplyOrder (DRAFT | SUBMITTED | CHANGES_REQUESTED) with on_hand_units + provisional_total_units > new storage_cap_units: order -> CANCELLED and its SCHEDULED DeliveryAppointments -> CANCELLED"
          - "posture recomputed"
      - from: SUBMITTED
        to: REMEDIATION_REQUIRED
        trigger: "POST /api/home-assessments/{id}/require-remediation"
        actor: HomeNurse
        preconditions:
          - "Status SUBMITTED (ERR_ASSESSMENT_INVALID_STATE)"
          - "X-User-ID != assessed_by_user_id (ERR_SOD_ASSESSOR_SELF_ACCEPT)"
        side_effects:
          - "posture recomputed (assessment gate unchanged until an ACCEPTED exists/expires)"
      - from: REMEDIATION_REQUIRED
        to: SUBMITTED
        trigger: "POST /api/home-assessments/{id}/resubmit"
        actor: HomeNurse
        preconditions:
          - "Status REMEDIATION_REQUIRED (ERR_ASSESSMENT_INVALID_STATE)"
          - "Every HomeModificationWorkOrder with assessment_id == this assessment is INSPECTED_PASS or CANCELLED (ERR_WORK_ORDERS_OUTSTANDING)"
        side_effects:
          - "Measurement fields replaced by payload; result and storage_cap_units recomputed"
          - "assessed_by_user_id = X-User-ID of resubmitting nurse (a fresh accept must again come from a different nurse)"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (another assessment for the same patient is accepted)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HomeModificationWorkOrder
    initial_state: REQUESTED
    terminal_states: [INSPECTED_PASS, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /api/home-modification-work-orders/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "Status REQUESTED or INSPECTED_FAIL (ERR_WORK_ORDER_INVALID_STATE)"
          - "scheduled_window_start < scheduled_window_end (ERR_INVALID_REQUEST)"
        side_effects: ["scheduled_window_start/end stored"]
      - from: INSPECTED_FAIL
        to: SCHEDULED
        trigger: "POST /api/home-modification-work-orders/{id}/approve (rework cycle)"
        actor: ProgramAdmin
        preconditions:
          - "Status REQUESTED or INSPECTED_FAIL (ERR_WORK_ORDER_INVALID_STATE)"
        side_effects: ["scheduled_window_start/end stored"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/home-modification-work-orders/{id}/complete"
        actor: BiomedTechnician
        preconditions:
          - "Status SCHEDULED (ERR_WORK_ORDER_INVALID_STATE)"
          - "final_cost_cents >= 0 (ERR_INVALID_REQUEST)"
        side_effects: ["final_cost_cents stored"]
      - from: COMPLETED
        to: INSPECTED_PASS
        trigger: "POST /api/home-modification-work-orders/{id}/inspect {passed: true}"
        actor: BiomedTechnician
        preconditions:
          - "Status COMPLETED (ERR_WORK_ORDER_INVALID_STATE)"
        side_effects: []
      - from: COMPLETED
        to: INSPECTED_FAIL
        trigger: "POST /api/home-modification-work-orders/{id}/inspect {passed: false}"
        actor: BiomedTechnician
        preconditions:
          - "Status COMPLETED (ERR_WORK_ORDER_INVALID_STATE)"
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/home-modification-work-orders/{id}/cancel"
        actor: HomeNurse | ProgramAdmin
        preconditions:
          - "Status REQUESTED or SCHEDULED (ERR_WORK_ORDER_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/home-modification-work-orders/{id}/cancel"
        actor: HomeNurse | ProgramAdmin
        preconditions:
          - "Status REQUESTED or SCHEDULED (ERR_WORK_ORDER_INVALID_STATE)"
        side_effects: []

  - entity: DialysisMachine
    initial_state: IN_STOCK
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IN_STOCK
        to: ASSIGNED
        trigger: "POST /api/dialysis-machines/{id}/assign"
        actor: BiomedTechnician
        preconditions:
          - "OCC: expected_machine_version == current version (ERR_STALE_VERSION, 412 — see concurrency_rules.machine-assign-stale-machine)"
          - "Machine status IN_STOCK or ASSIGNED (ERR_MACHINE_INVALID_STATE)"
          - "maintenance_due == false (ERR_MACHINE_MAINTENANCE_DUE)"
          - "Patient exists and program_status != TRANSITIONED_OUT (ERR_PATIENT_NOT_ACTIVE_HOME)"
        side_effects:
          - "assigned_patient_id = patient_id; machine.version += 1"
          - "posture recomputed for the patient"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /api/dialysis-machines/{id}/assign (reassignment to a different patient — create-with-supersede)"
        actor: BiomedTechnician
        preconditions:
          - "OCC: expected_machine_version == current version (ERR_STALE_VERSION, 412)"
          - "maintenance_due == false (ERR_MACHINE_MAINTENANCE_DUE)"
          - "New patient program_status != TRANSITIONED_OUT (ERR_PATIENT_NOT_ACTIVE_HOME)"
          - "patient_id != assigned_patient_id (ERR_INVALID_REQUEST — same-patient reassign is a no-op rejection)"
        side_effects:
          - "assigned_patient_id = new patient; machine.version += 1"
          - "posture recomputed for BOTH the old patient (loses machine gate) and the new patient"
      - from: ASSIGNED
        to: IN_STOCK
        trigger: "POST /api/dialysis-machines/{id}/unassign"
        actor: BiomedTechnician
        preconditions:
          - "Status ASSIGNED (ERR_MACHINE_INVALID_STATE)"
        side_effects:
          - "assigned_patient_id = null; posture recomputed for the former patient"
      - from: ASSIGNED
        to: IN_STOCK
        trigger: "system (cascade from TransitionRecord activation — see Patient transitions)"
        actor: system
        preconditions: []
        side_effects:
          - "assigned_patient_id = null"
          - "This machine's SCHEDULED MaintenanceEvents -> CANCELLED"
      - from: IN_STOCK
        to: UNDER_MAINTENANCE
        trigger: "system (POST /api/maintenance-events/{id}/start)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: UNDER_MAINTENANCE
        trigger: "system (POST /api/maintenance-events/{id}/start; assigned_patient_id retained)"
        actor: system
        preconditions: []
        side_effects:
          - "posture of assigned patient recomputed (machine gate requires status ASSIGNED, so UNDER_MAINTENANCE degrades HOME_READY to AT_RISK)"
      - from: UNDER_MAINTENANCE
        to: ASSIGNED
        trigger: "system (POST /api/maintenance-events/{id}/complete when assigned_patient_id != null)"
        actor: system
        preconditions: []
        side_effects: ["posture of assigned patient recomputed"]
      - from: UNDER_MAINTENANCE
        to: IN_STOCK
        trigger: "system (POST /api/maintenance-events/{id}/complete when assigned_patient_id == null)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_STOCK
        to: DECOMMISSIONED
        trigger: "POST /api/dialysis-machines/{id}/decommission"
        actor: ProgramAdmin
        preconditions:
          - "Status IN_STOCK (ERR_MACHINE_INVALID_STATE)"
          - "No EmergencyBackupPlan with backup_machine_id == this machine and status ACTIVE or EXPIRED (ERR_MACHINE_REFERENCED_BY_PLAN)"
        side_effects:
          - "This machine's SCHEDULED MaintenanceEvents -> CANCELLED"

  - entity: MaintenanceEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/maintenance-events/{id}/start"
        actor: BiomedTechnician
        preconditions:
          - "Status SCHEDULED (ERR_EVENT_INVALID_STATE)"
          - "Machine status IN_STOCK or ASSIGNED (ERR_EVENT_INVALID_STATE if UNDER_MAINTENANCE/DECOMMISSIONED)"
          - "No other IN_PROGRESS MaintenanceEvent on the same machine (ERR_MACHINE_BUSY_MAINTENANCE)"
          - "now <= window_end (ERR_EVENT_WINDOW_PASSED)"
        side_effects:
          - "Machine -> UNDER_MAINTENANCE (assigned_patient_id retained if any)"
          - "posture of assigned patient recomputed"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/maintenance-events/{id}/complete"
        actor: BiomedTechnician
        preconditions:
          - "Status IN_PROGRESS (ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "runtime_hours_at_service = machine.total_runtime_hours (snapshot)"
          - "Machine -> ASSIGNED if assigned_patient_id != null else IN_STOCK"
          - "maintenance_due recomputed (now false until another 500 hours accrue)"
          - "posture of assigned patient recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/maintenance-events/{id}/cancel"
        actor: BiomedTechnician
        preconditions:
          - "Status SCHEDULED (ERR_EVENT_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade: machine decommissioned or transition-driven unassignment)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EmergencyBackupPlan
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, CLOSED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: now >= last_drill_at + 90 days, applied whenever the plan is read or its patient is read/mutated)"
        actor: system
        preconditions: []
        side_effects:
          - "posture recomputed (plan gate lost)"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /api/emergency-backup-plans/{id}/drill"
        actor: HomeNurse
        preconditions:
          - "Status ACTIVE or EXPIRED (ERR_PLAN_NOT_ACTIVE for SUPERSEDED/CLOSED)"
        side_effects:
          - "last_drill_at = now"
          - "posture recomputed"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /api/emergency-backup-plans/{id}/drill (drill refresh)"
        actor: HomeNurse
        preconditions:
          - "Status ACTIVE or EXPIRED (ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "last_drill_at = now"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (POST /api/emergency-backup-plans creates a newer plan for the same patient)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXPIRED
        to: SUPERSEDED
        trigger: "system (POST /api/emergency-backup-plans creates a newer plan for the same patient)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "system (patient reaches TRANSITIONED_OUT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXPIRED
        to: CLOSED
        trigger: "system (patient reaches TRANSITIONED_OUT)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SupplyOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, SUPERSEDED, CANCELLED]
    note: "Two independent axes on one row: order_status (lifecycle) x fulfillment_status (delivery progress). fulfillment transitions never change order_status and vice versa; both are readable on the same entity."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/supply-orders/{id}/submit"
        actor: Patient
        preconditions:
          - "order_status DRAFT or CHANGES_REQUESTED (ERR_ORDER_INVALID_STATE — state check outranks all business checks)"
          - "order_month >= current clock month (ERR_ORDER_MONTH_IN_PAST)"
          - "patient.posture in {HOME_READY, AT_RISK} (ERR_POSTURE_NOT_ORDERABLE)"
          - "lines non-empty, every sku in program catalog, every quantity >= 1 (ERR_INVALID_REQUEST)"
          - "No other order for same patient + order_month in {SUBMITTED, APPROVED, CLOSED} (ERR_MONTH_ORDER_EXISTS)"
          - "on_hand_units + provisional_total_units <= storage_cap_units (ERR_STORAGE_CAPACITY_EXCEEDED — storage bound evaluated first)"
          - "provisional_total_units <= standard_allowance_units + carried_adjustment_units (ERR_ALLOWANCE_EXCEEDED)"
        side_effects:
          - "standard_allowance_units and carried_adjustment_units computed and stored at this moment (calculations.monthly_supply_allowance STANDARD variant + calculations.order_capacity_gate)"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /api/supply-orders/{id}/submit"
        actor: Patient
        preconditions: ["Same as DRAFT -> SUBMITTED"]
        side_effects: ["Same as DRAFT -> SUBMITTED"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/supply-orders/{id}/review {decision: APPROVE}"
        actor: SupplyCoordinator
        preconditions:
          - "order_status SUBMITTED (ERR_ORDER_INVALID_STATE)"
          - "decision in {APPROVE, REQUEST_CHANGES} (ERR_INVALID_REQUEST)"
        side_effects: ["review_note stored"]
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /api/supply-orders/{id}/review {decision: REQUEST_CHANGES}"
        actor: SupplyCoordinator
        preconditions:
          - "order_status SUBMITTED (ERR_ORDER_INVALID_STATE)"
        side_effects: ["review_note stored"]
      - from: CHANGES_REQUESTED
        to: DRAFT
        trigger: "PATCH /api/supply-orders/{id} (patient edits lines)"
        actor: Patient
        preconditions:
          - "order_status DRAFT or CHANGES_REQUESTED (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "All money fields recomputed (calculations.handling_fee, calculations.order_grand_total)"
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /api/supply-orders/{id}"
        actor: Patient
        preconditions:
          - "order_status DRAFT or CHANGES_REQUESTED (ERR_ORDER_INVALID_STATE)"
        side_effects: ["Money fields recomputed"]
      - from: APPROVED
        to: CLOSED
        trigger: "POST /api/supply-orders/{id}/close"
        actor: SupplyCoordinator
        preconditions:
          - "order_status APPROVED (ERR_ORDER_INVALID_STATE)"
          - "First day of the month after order_month <= current clock date (ERR_MONTH_NOT_ENDED)"
          - "No DeliveryAppointment of this order in SCHEDULED (ERR_OPEN_APPOINTMENTS_EXIST)"
        side_effects:
          - "actualized_units computed (ACTUALIZED variant over the month's logs, all log statuses)"
          - "adjustment_units = actualized_units - standard_allowance_units (may be negative; carries into next month's gate)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/supply-orders/{id}/cancel"
        actor: Patient | SupplyCoordinator
        preconditions:
          - "order_status in {DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED} (ERR_ORDER_INVALID_STATE)"
        side_effects: ["SCHEDULED DeliveryAppointments -> CANCELLED"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/supply-orders/{id}/cancel"
        actor: Patient | SupplyCoordinator
        preconditions: ["order_status in {DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED} (ERR_ORDER_INVALID_STATE)"]
        side_effects: ["SCHEDULED DeliveryAppointments -> CANCELLED"]
      - from: CHANGES_REQUESTED
        to: CANCELLED
        trigger: "POST /api/supply-orders/{id}/cancel"
        actor: Patient | SupplyCoordinator
        preconditions: ["order_status in {DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED} (ERR_ORDER_INVALID_STATE)"]
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /api/supply-orders/{id}/cancel"
        actor: Patient | SupplyCoordinator
        preconditions: ["order_status in {DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED} (ERR_ORDER_INVALID_STATE)"]
        side_effects: ["SCHEDULED DeliveryAppointments -> CANCELLED"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (POST /api/supply-orders creates a new DRAFT for the same patient + order_month)"
        actor: system
        preconditions: []
        side_effects: []
      # --- fulfillment_status axis (independent) ---
      - from: UNFULFILLED
        to: PARTIALLY_DELIVERED
        trigger: "system (POST /api/delivery-appointments/{id}/complete with delivered_units < remaining undelivered units)"
        actor: system
        preconditions: []
        side_effects: ["delivered_units_total += delivered_units; patient.on_hand_units += delivered_units"]
      - from: UNFULFILLED
        to: DELIVERED
        trigger: "system (complete with delivered_units == provisional_total_units)"
        actor: system
        preconditions: []
        side_effects: ["delivered_units_total += delivered_units; patient.on_hand_units += delivered_units"]
      - from: PARTIALLY_DELIVERED
        to: PARTIALLY_DELIVERED
        trigger: "system (another partial complete)"
        actor: system
        preconditions: []
        side_effects: ["delivered_units_total += delivered_units; patient.on_hand_units += delivered_units"]
      - from: PARTIALLY_DELIVERED
        to: DELIVERED
        trigger: "system (complete brings delivered_units_total == provisional_total_units)"
        actor: system
        preconditions: []
        side_effects: ["delivered_units_total += delivered_units; patient.on_hand_units += delivered_units"]

  - entity: DeliveryAppointment
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /api/delivery-appointments/{id}/complete"
        actor: SupplyCoordinator
        preconditions:
          - "Status SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)"
          - "delivered_units >= 1 and <= order.provisional_total_units - order.delivered_units_total (ERR_DELIVERED_UNITS_INVALID)"
        side_effects:
          - "order.delivered_units_total += delivered_units"
          - "patient.on_hand_units += delivered_units"
          - "order.fulfillment_status updated per SupplyOrder fulfillment axis"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /api/delivery-appointments/{id}/fail"
        actor: SupplyCoordinator
        preconditions:
          - "Status SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)"
          - "failure_reason non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["failure_reason stored"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/delivery-appointments/{id}/cancel"
        actor: SupplyCoordinator
        preconditions:
          - "Status SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (order cancelled, assessment cap-shrink cascade, or transition activation cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TreatmentLog
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: REVIEWED
        trigger: "POST /api/treatment-logs/{id}/mark-reviewed"
        actor: HomeNurse
        preconditions:
          - "Status SUBMITTED (ERR_LOG_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: FLAGGED
        trigger: "POST /api/treatment-logs/{id}/flag"
        actor: HomeNurse
        preconditions:
          - "Status SUBMITTED (ERR_LOG_INVALID_STATE)"
          - "flag_note non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["flag_note stored"]
      - from: FLAGGED
        to: SUBMITTED
        trigger: "POST /api/treatment-logs/{id}/amend"
        actor: Patient
        preconditions:
          - "Status FLAGGED (ERR_LOG_INVALID_STATE)"
          - "New consumption_units - old consumption_units <= patient.on_hand_units (ERR_QUANTITY_EXCEEDS_ON_HAND)"
        side_effects:
          - "patient.on_hand_units += old consumption_units, then -= new consumption_units (restore-then-subtract)"
          - "machine.total_runtime_hours recomputed from the amended duration"
          - "flag_note cleared"

  - entity: ClinicalReview
    initial_state: PENDING
    terminal_states: [SIGNED_OFF, ESCALATED]
    transitions:
      - from: PENDING
        to: SIGNED_OFF
        trigger: "POST /api/clinical-reviews/{id}/sign-off"
        actor: Nephrologist
        preconditions:
          - "Status PENDING (ERR_REVIEW_NOT_PENDING)"
          - "outcome in enum (ERR_INVALID_REQUEST)"
          - "No TreatmentLog of this patient with treatment_date inside [period_start, period_end] and status SUBMITTED or FLAGGED (ERR_UNREVIEWED_LOGS_REMAIN)"
        side_effects:
          - "signed_off_at = now; adherence_rolling_pct computed (calculations.adherence_rolling_pct)"
          - "patient.waste_alert_active = false"
          - "If outcome == REQUIRE_RETRAINING: patient.retraining_required = true (posture -> BLOCKED on next evaluation)"
          - "posture recomputed"
      - from: PENDING
        to: ESCALATED
        trigger: "POST /api/clinical-reviews/{id}/escalate"
        actor: HomeNurse | Nephrologist
        preconditions:
          - "Status PENDING (ERR_REVIEW_NOT_PENDING)"
        side_effects:
          - "Open-escalation condition now holds: posture recomputes to BLOCKED"
          - "Cascade: open SupplyOrders in {DRAFT, SUBMITTED, CHANGES_REQUESTED} -> CANCELLED (APPROVED orders are untouched)"

  - entity: BackupSlotReservation
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: RESERVED
        to: COMPLETED
        trigger: "POST /api/backup-slot-reservations/{id}/complete"
        actor: HomeNurse
        preconditions:
          - "Status RESERVED (ERR_SLOT_INVALID_STATE)"
        side_effects: []
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /api/backup-slot-reservations/{id}/cancel"
        actor: Patient
        preconditions:
          - "Status RESERVED (ERR_SLOT_INVALID_STATE)"
          - "now < slot_start (ERR_SLOT_TOO_LATE_TO_CANCEL)"
        side_effects: []
      - from: RESERVED
        to: CANCELLED
        trigger: "system (transition activation cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: NO_SHOW
        trigger: "system (lazy: now > slot_end and still RESERVED; applied whenever the reservation or its patient is read)"
        actor: system
        preconditions: []
        side_effects: ["patient.no_show_count += 1"]

  - entity: WasteReturnRecord
    initial_state: REPORTED
    terminal_states: [CREDITED, VERIFIED, REJECTED]
    transitions:
      - from: REPORTED
        to: CREDITED
        trigger: "POST /api/waste-return-records/{id}/verify {approved: true} when record_type == RETURN"
        actor: SupplyCoordinator
        preconditions:
          - "Status REPORTED (ERR_WASTE_RECORD_NOT_REPORTED)"
        side_effects:
          - "credit_cents computed (calculations.return_credit)"
          - "patient.on_hand_units -= total_units"
      - from: REPORTED
        to: VERIFIED
        trigger: "POST /api/waste-return-records/{id}/verify {approved: true} when record_type == WASTE"
        actor: SupplyCoordinator
        preconditions:
          - "Status REPORTED (ERR_WASTE_RECORD_NOT_REPORTED)"
        side_effects:
          - "patient.on_hand_units -= total_units"
          - "calculations.waste_ratio re-evaluated for activity_month; on threshold crossing: patient.waste_alert_active = true and an ESCALATION ClinicalReview is created if no PENDING review exists"
      - from: REPORTED
        to: REJECTED
        trigger: "POST /api/waste-return-records/{id}/verify {approved: false}"
        actor: SupplyCoordinator
        preconditions:
          - "Status REPORTED (ERR_WASTE_RECORD_NOT_REPORTED)"
        side_effects: ["No on-hand change; no credit"]

  - entity: TransitionRecord
    initial_state: REQUESTED
    terminal_states: [DENIED, COMPLETED, REVERSED]
    note: "Permanent transitions (effective_to null) remain ACTIVE indefinitely; temporary ones complete lazily. A CENTER_TO_HOME reversal links via reversal_of_id (self-referential)."
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/transition-records/{id}/approve"
        actor: Nephrologist
        preconditions:
          - "Status REQUESTED (ERR_TRANSITION_INVALID_STATE)"
        side_effects: []
      - from: REQUESTED
        to: DENIED
        trigger: "POST /api/transition-records/{id}/deny"
        actor: Nephrologist
        preconditions:
          - "Status REQUESTED (ERR_TRANSITION_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /api/transition-records/{id}/activate"
        actor: Nephrologist
        preconditions:
          - "Status APPROVED (ERR_TRANSITION_INVALID_STATE)"
          - "effective_from <= current clock date (ERR_TRANSITION_EFFECTIVE_IN_FUTURE)"
          - "For HOME_TO_CENTER: patient program_status in {ACTIVE_HOME, SUSPENDED} (ERR_PATIENT_STATE_BLOCKS_TRANSITION)"
          - "For CENTER_TO_HOME: patient program_status == SUSPENDED (ERR_PATIENT_STATE_BLOCKS_TRANSITION)"
        side_effects:
          - "HOME_TO_CENTER: patient -> SUSPENDED (temporary) or TRANSITIONED_OUT (permanent) with full cascade set per Patient transitions"
          - "CENTER_TO_HOME: readiness gates re-checked (ERR_READINESS_GATES_NOT_MET); patient SUSPENDED -> ACTIVE_HOME; reversed record ACTIVE -> REVERSED"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (lazy: now > effective_to of a temporary transition; applied on any read of the record or its patient)"
        actor: system
        preconditions: []
        side_effects:
          - "Patient SUSPENDED -> ACTIVE_HOME (no readiness-gate recheck; posture recompute applies)"
      - from: ACTIVE
        to: REVERSED
        trigger: "system (a CENTER_TO_HOME reversal referencing this record is activated)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; serially testable)
# =============================================================================
concurrency_rules:
  - rule_id: supply-order-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /api/supply-orders"
    occ_field: expected_patient_version
    description: |
      Creating a SupplyOrder against a Patient whose version has advanced since
      the client last observed it is rejected. Creating legitimately supersedes
      an existing DRAFT order for the same patient + order_month (that DRAFT
      becomes SUPERSEDED), so a client holding a stale patient version must not
      be allowed to supersede on the basis of an outdated view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: emergency-plan-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /api/emergency-backup-plans"
    occ_field: expected_patient_version
    description: |
      Creating an EmergencyBackupPlan against a Patient whose version has
      advanced since the client last observed it is rejected. Creation
      legitimately supersedes the patient's prior ACTIVE/EXPIRED plan, so a
      stale view of the patient must not drive a supersede.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: machine-assign-stale-machine
    parent_entity: DialysisMachine
    write_endpoint: "POST /api/dialysis-machines/{id}/assign"
    occ_field: expected_machine_version
    description: |
      Assigning a DialysisMachine whose version has advanced since the client
      last observed it is rejected. Assignment legitimately supersedes the
      machine's current assignment (the machine moves to a new patient), so a
      stale view of the machine must not drive a reassignment.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: home_assessment_evaluation
    trigger: "HomeAssessment create and resubmit"
    algorithm: threshold
    formula: |
      storage_cap_units = min(MAX_STORAGE_UNITS, floor(storage_area_sqft * SQFT_TO_UNITS))
      result = PASS iff (water_chloramine_ppm <= CHLORAMINE_MAX_PPM)
                        AND electrical_dedicated_circuit == true
                        AND electrical_voltage_verified == true
                        AND storage_area_sqft >= MIN_STORAGE_SQFT
                else FAIL
    input_set: "The assessment row being written"
    constants:
      SQFT_TO_UNITS: 4
      MAX_STORAGE_UNITS: 400
      MIN_STORAGE_SQFT: 25
      CHLORAMINE_MAX_PPM: 0.1
    precision: "storage_cap_units integer (floor); chloramine compared at full float precision — exactly 0.1 PASSES (<=)"

  - name: monthly_supply_allowance
    trigger: "STANDARD variant evaluated and stored at SupplyOrder submit; ACTUALIZED variant evaluated at SupplyOrder close"
    algorithm: forward_looking
    formula: |
      STANDARD (forward-looking, at submit):
        standard_allowance_units = prescription_treatments_per_week * WEEKS_PER_MONTH * prescription_units_per_treatment
        Uses the patient's CURRENT prescription values at submit time (a later PATCH /prescription does not retroactively change a stored value).
      ACTUALIZED (chronological replay, at close):
        actualized_units = sum(consumption_units) over the patient's TreatmentLog rows
          with treatment_date inside [order_month first day, order_month last day] inclusive,
          including ALL log statuses (SUBMITTED, REVIEWED, FLAGGED).
        adjustment_units = actualized_units - standard_allowance_units   (may be negative)
    input_set: "STANDARD: patient prescription fields. ACTUALIZED: all of the patient's TreatmentLog rows dated in the order month, regardless of status."
    constants:
      WEEKS_PER_MONTH: 4
    precision: "integer units"
    variants:
      - name: STANDARD
        when: "SupplyOrder submit (gate evaluation)"
        difference: "Forward-looking from prescription; ignores what actually happened"
      - name: ACTUALIZED
        when: "SupplyOrder close (month-end reconciliation)"
        difference: "Chronological replay of logged consumption; for identical month data the two variants diverge whenever actual usage differs from the prescription-derived plan, and the delta (adjustment_units) carries into next month's gate"

  - name: order_capacity_gate
    trigger: "SupplyOrder submit"
    algorithm: aggregation
    formula: |
      carried_adjustment_units = adjustment_units of the patient's CLOSED SupplyOrder whose
        order_month is the calendar month immediately preceding this order_month; 0 if none exists.
        (Recurrence base case: the patient's first order month carries 0.)
      storage_room = storage_cap_units - on_hand_units
      allowance_room = standard_allowance_units + carried_adjustment_units
      max_orderable = min(storage_room, allowance_room)
      Rejection ordering is pinned: if on_hand_units + provisional_total_units > storage_cap_units
        -> ERR_STORAGE_CAPACITY_EXCEEDED
      elif provisional_total_units > allowance_room -> ERR_ALLOWANCE_EXCEEDED
    input_set: "Patient storage_cap_units, on_hand_units, stored standard_allowance_units, prior month's CLOSED order adjustment_units"
    precision: "integer units"

  - name: handling_fee
    trigger: "SupplyOrder create and PATCH (lines change)"
    algorithm: tiered_pricing
    formula: |
      handling_fee_cents = BASE_HANDLING_CENTS + sum over lines of round_half_up(quantity * catalog[sku].handling_rate_cents)
      ROUNDING ORDER PINNED (mode b): round each line HALF-UP to integer cents FIRST, then sum the rounded line
      amounts, then add BASE_HANDLING_CENTS. The sum-then-round order is forbidden — the two orders diverge
      whenever fractional .5 line amounts pair up (e.g. 10.5 + 12.5 rounds to 11 + 13 = 24 per-line vs 23 summed).
    input_set: "The order's lines and the program supply_catalog handling rates"
    constants:
      BASE_HANDLING_CENTS: 500
    precision: "integer cents, round_half_up per line"

  - name: order_grand_total
    trigger: "SupplyOrder create and PATCH (lines change)"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER PINNED (mode c — circular-looking discount keyed on the total):
      1. subtotal_cents  = sum(quantity * catalog[sku].unit_price_cents)            (exact integer)
      2. discount_cents  = round_half_up(subtotal_cents * VOLUME_DISCOUNT_RATIO)
                           IF subtotal_cents >= VOLUME_DISCOUNT_THRESHOLD_CENTS ELSE 0
                           Eligibility is keyed on subtotal_cents — NEVER on grand_total_cents.
      3. grand_total_cents = subtotal_cents - discount_cents + handling_fee_cents
      An implementation that keys the discount on the post-discount total diverges exactly at the threshold band.
    input_set: "The order's lines, program supply_catalog prices, handling_fee_cents from calculations.handling_fee"
    constants:
      VOLUME_DISCOUNT_THRESHOLD_CENTS: 20000
      VOLUME_DISCOUNT_RATIO: 0.05
    precision: "integer cents, round_half_up"

  - name: return_credit
    trigger: "WasteReturnRecord verify with approved=true and record_type == RETURN"
    algorithm: tiered_pricing
    formula: |
      Delivered attribution (order-sensitive, pinned): a DELIVERED appointment's delivered_units are allocated
      to its order's lines in stored line order, each line filled up to its quantity before the next line.
      delivered_sku_month(sku) = allocated units of sku over the patient's DELIVERED appointments whose
      window_start date falls inside activity_month.
      For each line of this record, in request order:
        if line.expired == true: credit_line = 0
        else:
          returned_prior = sum(units) over the patient's CREDITED RETURN records with the same activity_month and sku
          eligible = max(0, min(line.units, delivered_sku_month(sku) - returned_prior))
          full_credit_used_prior = min(returned_prior, RETURN_FULL_CREDIT_LIMIT)
          full_portion = min(eligible, RETURN_FULL_CREDIT_LIMIT - full_credit_used_prior)
          overage = eligible - full_portion
          credit_line = full_portion * unit_credit_cents
                        + round_half_up(overage * unit_credit_cents * RETURN_OVERAGE_CREDIT_RATIO)
      credit_cents = sum(credit_line)   (per-line rounding, then sum — same discipline as handling_fee)
    input_set: "This record's lines; patient's CREDITED RETURN records in the same activity_month; delivered attribution of the month's DELIVERED appointments; program catalog unit_credit_cents"
    constants:
      RETURN_FULL_CREDIT_LIMIT: 10
      RETURN_OVERAGE_CREDIT_RATIO: 0.5
    precision: "integer cents, round_half_up per line"
    note: "Mode (a): >= 3 inputs (line units, delivered attribution, prior returns, expiry flag) with nested min/max, a tiered full/half credit rate, and a conditional zero on expiry."

  - name: on_hand_units
    trigger: "DeliveryAppointment complete; TreatmentLog create and amend; WasteReturnRecord verify (approved)"
    algorithm: aggregation
    formula: |
      on_hand_units = sum(delivered_units over the patient's DELIVERED DeliveryAppointments)
                    - sum(consumption_units over the patient's TreatmentLog rows, ALL statuses)
                    - sum(total_units over the patient's CREDITED or VERIFIED WasteReturnRecords)
      Amended logs adjust by restore-then-subtract (old consumption_units credited back, new subtracted).
      REJECTED records contribute nothing. Mutation-time guards keep the value from going negative:
      log create requires consumption_units <= on_hand_units; waste create requires total_units <= on_hand_units
      (ERR_QUANTITY_EXCEEDS_ON_HAND).
    input_set: "Patient's DELIVERED appointments, all TreatmentLog rows, CREDITED/VERIFIED waste-return records"
    precision: "integer units"

  - name: missed_log_streak
    trigger: "Evaluated at every Patient read and posture evaluation (logical clock)"
    algorithm: threshold
    formula: |
      expected_interval_days = max(1, floor(7 / prescription_treatments_per_week))
      anchor = treatment_date of the patient's latest TreatmentLog (any status); if none, date of patient.created_at
      silence_days = (current clock date) - anchor, in whole days, floored at 0
      missed_log_streak = floor(silence_days / expected_interval_days)
      AT_RISK contribution: missed_log_streak >= program.max_missed_log_streak   (>=, not >)
    input_set: "Patient's TreatmentLog rows (all statuses), prescription, program.max_missed_log_streak, logical clock"
    precision: "integer days"
    variants:
      - name: STREAK
        when: "posture_derivation (instantaneous, cautious)"
        difference: "Measures only the CURRENT silence run; a patient who logged today has streak 0 even after a bad month"

  - name: adherence_rolling_pct
    trigger: "ClinicalReview sign-off"
    algorithm: aggregation
    formula: |
      window = [current clock date - 27 days, current clock date] inclusive (28 calendar days)
      scheduled = prescription_treatments_per_week * 4
      actual = count of the patient's TreatmentLog rows (all statuses) with treatment_date inside window
      adherence_rolling_pct = round_half_up(min(actual, scheduled) / scheduled * 100, to 1 decimal place)
    input_set: "Patient's TreatmentLog rows in the trailing 28-day window, prescription"
    constants:
      ROLLING_WINDOW_DAYS: 28
    precision: "1 decimal place, round_half_up"
    variants:
      - name: ROLLING_28
        when: "ClinicalReview sign-off reporting"
        difference: "Measures the trailing-window ratio; a single good day does not erase a bad month — for identical log data STREAK and ROLLING_28 disagree (e.g. 5 logs early in the window then silence: STREAK escalates, ROLLING still reports 41.7)"

  - name: maintenance_due
    trigger: "DialysisMachine read; TreatmentLog create/amend; MaintenanceEvent complete"
    algorithm: threshold
    formula: |
      runtime_hours_at_last_service = runtime_hours_at_service of the machine's latest COMPLETED
        MaintenanceEvent (ordered by updated_at, tie-break created_at); 0 if none.
      total_runtime_hours = sum(duration_minutes)/60 over TreatmentLog rows with machine_id = this machine (all statuses)
      maintenance_due = (total_runtime_hours - runtime_hours_at_last_service) >= MAINTENANCE_INTERVAL_HOURS
      Boundary: exactly 500.0 hours IS due (>=).
    input_set: "Machine's TreatmentLog rows and COMPLETED MaintenanceEvents"
    constants:
      MAINTENANCE_INTERVAL_HOURS: 500
    precision: "hours at 2 decimal places"

  - name: waste_ratio
    trigger: "WasteReturnRecord verify (approved, record_type == WASTE)"
    algorithm: threshold
    formula: |
      waste_units_month = sum(total_units) over the patient's VERIFIED WASTE records with this activity_month (including this one)
      delivered_month = sum(delivered_units) over the patient's DELIVERED appointments whose window_start date is inside activity_month
      ratio = 0 if delivered_month == 0 else waste_units_month / delivered_month
      Crossing rule: ratio >= program.waste_ratio_alert_threshold (>=, not >) latches patient.waste_alert_active = true
      and creates an ESCALATION ClinicalReview if no PENDING review exists for the patient.
    input_set: "Patient's VERIFIED WASTE records and DELIVERED appointments in the activity month"
    precision: "ratio at full float precision; threshold comparison is >="

  - name: posture_derivation
    trigger: "Every Patient read, and after every mutation touching an input (training sign-off, assessment accept, machine assign/unassign, maintenance start/complete, plan create/drill/expiry, review sign-off/escalate, waste verify, log create, clock-driven lazy evaluation)"
    algorithm: constraint_propagation
    formula: |
      PRECEDENCE PINNED — evaluate top-down, first match wins:
      1. program_status == TRAINING          -> NOT_READY
      2. program_status == TRANSITIONED_OUT  -> BLOCKED
      3. ever_home_ready == false:           -> HOME_READY if all four readiness gates hold else NOT_READY
      4. BLOCKED if any of:
           cert_expired  (some module_code lacks a SIGNED_OFF passing attempt with signed_off_at > now - 365 days)
           OR assessment_expired (no ACCEPTED assessment with accepted_at > now - 730 days)
           OR review_overdue (a PENDING ClinicalReview with due_at < now)
           OR escalation_open (an ESCALATED review with created_at after the latest SIGNED_OFF review's created_at, or any ESCALATED review when none was ever signed off)
           OR retraining_required == true
      5. AT_RISK if any of:
           no machine with status ASSIGNED assigned to the patient
           OR the assigned machine has maintenance_due == true or status UNDER_MAINTENANCE
           OR no EmergencyBackupPlan with status ACTIVE (plan EXPIRED/missing)
           OR missed_log_streak >= program.max_missed_log_streak
           OR waste_alert_active == true
      6. otherwise                           -> HOME_READY
      Readiness gates (used by /activate, /reinstate, reversal activation):
        cert_current AND assessment_current AND machine_assigned AND plan_active (all four).
    input_set: "Patient's attempts, assessments, machines, plans, reviews, logs, latches, logical clock"
    precision: "enum; date comparisons are strict (>) per constants"
    constants:
      RECERT_DAYS: 365
      ASSESSMENT_VALIDITY_DAYS: 730
      DRILL_VALIDITY_DAYS: 90
      REVIEW_SLA_DAYS: 5

  - name: review_cadence_trigger
    trigger: "TreatmentLog create"
    algorithm: threshold
    formula: |
      unreviewed = count of the patient's TreatmentLog rows with status SUBMITTED or FLAGGED (after inserting the new log)
      if unreviewed >= program.review_cadence_treatments AND no PENDING ClinicalReview exists for the patient:
        create ClinicalReview(status PENDING, due_reason CADENCE,
          period_start = day after the latest prior review's period_end, else date of patient.created_at,
          period_end = the new log's treatment_date,
          due_at = now + REVIEW_SLA_DAYS)
    input_set: "Patient's TreatmentLog rows and ClinicalReview rows"
    constants:
      REVIEW_SLA_DAYS: 5

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and non-empty", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is listed in the endpoint's roles", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Patient-role caller: X-User-ID equals the patient_id of the resource being created/acted on (own orders, logs, slots, waste records, transition requests)", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "POST /api/supply-orders, PATCH /api/supply-orders/{id}, POST /api/supply-orders/{id}/submit, POST /api/supply-orders/{id}/cancel (Patient caller), POST /api/treatment-logs, POST /api/treatment-logs/{id}/amend, POST /api/backup-slot-reservations, POST /api/backup-slot-reservations/{id}/cancel, POST /api/waste-return-records, POST /api/transition-records (Patient caller)" }
  - { priority: 4, category: existence, check: "Path ids exist, validated left-to-right; body FK references exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 5, category: state, check: "Target resource is in a state from which the requested transition exists (per-entity state machines); OCC version match on the three concurrency-rule endpoints is evaluated here as ERR_STALE_VERSION", error_id: "ERR_ORDER_INVALID_STATE | ERR_ASSESSMENT_INVALID_STATE | ERR_WORK_ORDER_INVALID_STATE | ERR_MACHINE_INVALID_STATE | ERR_EVENT_INVALID_STATE | ERR_APPOINTMENT_INVALID_STATE | ERR_LOG_INVALID_STATE | ERR_REVIEW_NOT_PENDING | ERR_SLOT_INVALID_STATE | ERR_WASTE_RECORD_NOT_REPORTED | ERR_TRANSITION_INVALID_STATE | ERR_ATTEMPT_NOT_RECORDED | ERR_PLAN_NOT_ACTIVE | ERR_PATIENT_INVALID_STATE | ERR_STALE_VERSION", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: business_safety, check: "Segregation of duties and clinical safety gates: sign-off nurse != trainer (ERR_SOD_SIGNOFF_BY_TRAINER); assessment accept/remediation nurse != assessor (ERR_SOD_ASSESSOR_SELF_ACCEPT); order submit requires posture in {HOME_READY, AT_RISK} (ERR_POSTURE_NOT_ORDERABLE); MEDICAL_COMPLICATION reason requires Nephrologist caller (ERR_REASON_REQUIRES_PHYSICIAN)", error_id: "ERR_SOD_SIGNOFF_BY_TRAINER | ERR_SOD_ASSESSOR_SELF_ACCEPT | ERR_POSTURE_NOT_ORDERABLE | ERR_REASON_REQUIRES_PHYSICIAN", http_status: 403, applies_to: "sign-off, accept, require-remediation, submit, transition create" }
  - { priority: 7, category: business_temporal, check: "Clock-relative rules: order_month not before current month (ERR_ORDER_MONTH_IN_PAST); slot_start >= now (ERR_SLOT_IN_PAST); treatment_date not in the future (ERR_LOG_DATE_IN_FUTURE); close requires order_month fully elapsed (ERR_MONTH_NOT_ENDED); maintenance start requires now <= window_end (ERR_EVENT_WINDOW_PASSED); transition activate requires effective_from reached (ERR_TRANSITION_EFFECTIVE_IN_FUTURE); slot cancel requires now < slot_start (ERR_SLOT_TOO_LATE_TO_CANCEL)", error_id: "ERR_ORDER_MONTH_IN_PAST | ERR_SLOT_IN_PAST | ERR_LOG_DATE_IN_FUTURE | ERR_MONTH_NOT_ENDED | ERR_EVENT_WINDOW_PASSED | ERR_TRANSITION_EFFECTIVE_IN_FUTURE | ERR_SLOT_TOO_LATE_TO_CANCEL", http_status: 422, applies_to: "submit, close, reservation create/cancel, log create, event start, transition activate" }
  - { priority: 8, category: business_constraint, check: "Uniqueness and overlap: one log per patient per treatment_date (ERR_DUPLICATE_TREATMENT_DATE); serial_number unique per program (ERR_SERIAL_NUMBER_EXISTS); chair_code unique per program (ERR_INVALID_REQUEST); one non-terminal order per patient+month (ERR_MONTH_ORDER_EXISTS); one SCHEDULED appointment per order (ERR_ACTIVE_APPOINTMENT_EXISTS); close blocked while a SCHEDULED appointment exists (ERR_OPEN_APPOINTMENTS_EXIST); chair half-open overlap (ERR_CHAIR_SLOT_OVERLAP); machine closed-interval maintenance overlap (ERR_EVENT_WINDOW_OVERLAP); one IN_PROGRESS event per machine (ERR_MACHINE_BUSY_MAINTENANCE); slot daily cap 2 (ERR_SLOT_DAILY_CAP_EXCEEDED); open HOME_TO_CENTER transition blocks a new one (ERR_OPEN_TRANSITION_EXISTS)", error_id: "ERR_DUPLICATE_TREATMENT_DATE | ERR_SERIAL_NUMBER_EXISTS | ERR_MONTH_ORDER_EXISTS | ERR_ACTIVE_APPOINTMENT_EXISTS | ERR_CHAIR_SLOT_OVERLAP | ERR_EVENT_WINDOW_OVERLAP | ERR_MACHINE_BUSY_MAINTENANCE | ERR_SLOT_DAILY_CAP_EXCEEDED | ERR_OPEN_TRANSITION_EXISTS | ERR_OPEN_APPOINTMENTS_EXIST", http_status: 409, applies_to: "log create, machine create, chair create, order create, order submit, order close, appointment create, reservation create, event create/start, transition create" }
  - { priority: 9, category: business_referential, check: "Cross-entity referenced state: activate gates (ERR_TRAINING_INCOMPLETE, ERR_ASSESSMENT_NOT_CURRENT, ERR_NO_MACHINE_ASSIGNED, ERR_NO_ACTIVE_PLAN, ERR_READINESS_GATES_NOT_MET, ERR_ACTIVE_TRANSITION_BLOCKS_REINSTATE); log machine assigned to patient (ERR_MACHINE_NOT_ASSIGNED_TO_PATIENT); reservation requires plan ACTIVE (ERR_PLAN_NOT_ACTIVE) and chair in service (ERR_CHAIR_OUT_OF_SERVICE); plan backup machine IN_STOCK (ERR_BACKUP_MACHINE_NOT_IN_STOCK); assign blocked when maintenance due (ERR_MACHINE_MAINTENANCE_DUE); decommission blocked by plan reference (ERR_MACHINE_REFERENCED_BY_PLAN); resubmit requires work orders settled (ERR_WORK_ORDERS_OUTSTANDING); assessment accept requires result PASS (ERR_ASSESSMENT_RESULT_FAIL); sign-off requires passing attempt (ERR_ATTEMPT_NOT_PASSING); review sign-off requires period logs reviewed (ERR_UNREVIEWED_LOGS_REMAIN); reason substantiation (ERR_REASON_NOT_SUBSTANTIATED); reversal target validity (ERR_REVERSAL_TARGET_INVALID); appointment requires order APPROVED (ERR_ORDER_INVALID_STATE); patient must be ACTIVE_HOME for logs/slots (ERR_PATIENT_NOT_ACTIVE_HOME)", error_id: "ERR_TRAINING_INCOMPLETE | ERR_ASSESSMENT_NOT_CURRENT | ERR_NO_MACHINE_ASSIGNED | ERR_NO_ACTIVE_PLAN | ERR_READINESS_GATES_NOT_MET | ERR_ACTIVE_TRANSITION_BLOCKS_REINSTATE | ERR_MACHINE_NOT_ASSIGNED_TO_PATIENT | ERR_PLAN_NOT_ACTIVE | ERR_CHAIR_OUT_OF_SERVICE | ERR_BACKUP_MACHINE_NOT_IN_STOCK | ERR_MACHINE_MAINTENANCE_DUE | ERR_MACHINE_REFERENCED_BY_PLAN | ERR_WORK_ORDERS_OUTSTANDING | ERR_ASSESSMENT_RESULT_FAIL | ERR_ATTEMPT_NOT_PASSING | ERR_UNREVIEWED_LOGS_REMAIN | ERR_REASON_NOT_SUBSTANTIATED | ERR_REVERSAL_TARGET_INVALID | ERR_PATIENT_NOT_ACTIVE_HOME", http_status: 409, applies_to: "activate, reinstate, transition create/activate, log create, reservation create, plan create, machine assign/decommission, assessment accept/resubmit, attempt sign-off, review sign-off, appointment create" }
  - { priority: 10, category: business_fiscal, check: "Quota checks last: storage capacity (ERR_STORAGE_CAPACITY_EXCEEDED, evaluated before allowance per calculations.order_capacity_gate), allowance + carry (ERR_ALLOWANCE_EXCEEDED), on-hand sufficiency for logs/waste (ERR_QUANTITY_EXCEEDS_ON_HAND), delivered_units within remaining (ERR_DELIVERED_UNITS_INVALID)", error_id: "ERR_STORAGE_CAPACITY_EXCEEDED | ERR_ALLOWANCE_EXCEEDED | ERR_QUANTITY_EXCEEDS_ON_HAND | ERR_DELIVERED_UNITS_INVALID", http_status: 422, applies_to: "order submit, log create/amend, waste create, appointment complete" }

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# (role list anchor: ALL = every authenticated role; Patient-role write
#  endpoints additionally enforce ownership per validations priority 3)
# =============================================================================
endpoints:
  # --- Programs & clock ---
  - { method: POST, path: "/api/dialysis-programs", description: "Create a dialysis program with cadence/threshold config and supply catalog", roles: [ProgramAdmin], code: 201, input: [name, review_cadence_treatments, max_missed_log_streak, waste_ratio_alert_threshold, supply_catalog], output: DialysisProgram, side_effects: [] }
  - { method: GET, path: "/api/dialysis-programs/{id}", description: "Get a program", roles: &ALL_ROLES [ProgramAdmin, HomeNurse, Nephrologist, SupplyCoordinator, BiomedTechnician, Patient], code: 200, input: [], output: DialysisProgram, side_effects: [] }
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Startup default before any call: 2026-05-01T00:00:00Z; the server MUST NOT fall back to wall-clock time. All lazy evaluations (plan expiry, review overdue, NO_SHOW, streak, transition completion) read this clock.", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["Lazy evaluations re-applied on subsequent reads/mutations"] }
  - { method: GET, path: "/api/dialysis-programs/{id}/patients", description: "List patients of a program", roles: *ALL_ROLES, code: 200, input: ["posture?", "program_status?"], output: "Patient[]", side_effects: ["posture re-evaluated per row"] }
  - { method: GET, path: "/api/dialysis-programs/{id}/dialysis-machines", description: "List machines of a program", roles: *ALL_ROLES, code: 200, input: ["status?", "assigned_patient_id?"], output: "DialysisMachine[]", side_effects: [] }
  - { method: GET, path: "/api/dialysis-programs/{id}/in-center-chairs", description: "List chairs of a program", roles: *ALL_ROLES, code: 200, input: ["in_service?"], output: "InCenterChair[]", side_effects: [] }

  # --- Patients ---
  - { method: POST, path: "/api/patients", description: "Enroll a patient (intake with initial prescription)", roles: [HomeNurse], code: 201, input: [program_id, full_name, prescription_treatments_per_week, prescription_units_per_treatment], output: Patient, side_effects: ["program_status = TRAINING; posture = NOT_READY"] }
  - { method: GET, path: "/api/patients/{id}", description: "Get a patient (posture, missed_log_streak, maintenance/plan/review lazy states re-evaluated at read)", roles: *ALL_ROLES, code: 200, input: [], output: Patient, side_effects: ["posture re-evaluated; lazy plan expiry / review overdue / streak recomputed"] }
  - { method: PATCH, path: "/api/patients/{id}/prescription", description: "Update prescription (affects FUTURE submit-time allowance evaluations only)", roles: [Nephrologist], code: 200, input: ["prescription_treatments_per_week?", "prescription_units_per_treatment?"], output: Patient, side_effects: ["increments Patient.version by 1"] }
  - { method: POST, path: "/api/patients/{id}/activate", description: "TRAINING -> ACTIVE_HOME (four readiness gates)", roles: [Nephrologist], code: 200, input: [], output: Patient, side_effects: ["ever_home_ready = true", "increments Patient.version by 1"] }
  - { method: POST, path: "/api/patients/{id}/suspend", description: "ACTIVE_HOME -> SUSPENDED (manual; keeps machine/plan/orders)", roles: [Nephrologist], code: 200, input: [reason], output: Patient, side_effects: ["increments Patient.version by 1"] }
  - { method: POST, path: "/api/patients/{id}/reinstate", description: "SUSPENDED -> ACTIVE_HOME (no ACTIVE HOME_TO_CENTER transition; readiness gates re-checked)", roles: [Nephrologist], code: 200, input: [], output: Patient, side_effects: ["increments Patient.version by 1"] }

  # --- Training ---
  - { method: POST, path: "/api/training-attempts", description: "Record a training attempt (trainer = X-User-ID)", roles: [HomeNurse], code: 201, input: [patient_id, module_code, score_pct], output: TrainingAttempt, side_effects: ["is_passing computed (>= 80)"] }
  - { method: POST, path: "/api/training-attempts/{id}/sign-off", description: "Sign off a passing attempt; signer must differ from trainer (SoD)", roles: [HomeNurse], code: 200, input: [], output: TrainingAttempt, side_effects: ["signed_off_at = now", "clears patient.retraining_required if set", "posture recomputed"] }
  - { method: GET, path: "/api/patients/{id}/training-attempts", description: "List a patient's training attempts", roles: *ALL_ROLES, code: 200, input: ["module_code?", "status?"], output: "TrainingAttempt[]", side_effects: [] }

  # --- Home assessments ---
  - { method: POST, path: "/api/home-assessments", description: "Submit a home assessment (result + storage_cap_units computed; assessor = X-User-ID)", roles: [HomeNurse], code: 201, input: [patient_id, assessment_kind, water_chloramine_ppm, electrical_dedicated_circuit, electrical_voltage_verified, storage_area_sqft], output: HomeAssessment, side_effects: ["result and storage_cap_units computed"] }
  - { method: GET, path: "/api/home-assessments/{id}", description: "Get an assessment", roles: *ALL_ROLES, code: 200, input: [], output: HomeAssessment, side_effects: [] }
  - { method: GET, path: "/api/patients/{id}/home-assessments", description: "List a patient's assessments", roles: *ALL_ROLES, code: 200, input: ["status?"], output: "HomeAssessment[]", side_effects: [] }
  - { method: POST, path: "/api/home-assessments/{id}/accept", description: "Accept a PASS assessment; supersedes prior ACCEPTED; cap-shrink cascade cancels over-cap open orders", roles: [HomeNurse], code: 200, input: [], output: HomeAssessment, side_effects: ["prior ACCEPTED -> SUPERSEDED", "patient.storage_cap_units recomputed", "over-cap open SupplyOrders -> CANCELLED (+ their SCHEDULED appointments)", "posture recomputed"] }
  - { method: POST, path: "/api/home-assessments/{id}/require-remediation", description: "SUBMITTED -> REMEDIATION_REQUIRED (SoD: not the assessor)", roles: [HomeNurse], code: 200, input: [], output: HomeAssessment, side_effects: [] }
  - { method: POST, path: "/api/home-assessments/{id}/resubmit", description: "REMEDIATION_REQUIRED -> SUBMITTED with new measurements; requires linked work orders INSPECTED_PASS or CANCELLED", roles: [HomeNurse], code: 200, input: [water_chloramine_ppm, electrical_dedicated_circuit, electrical_voltage_verified, storage_area_sqft], output: HomeAssessment, side_effects: ["result and storage_cap_units recomputed", "assessed_by_user_id refreshed to caller"] }

  # --- Home modification work orders ---
  - { method: POST, path: "/api/home-modification-work-orders", description: "Open a remediation work order against a REMEDIATION_REQUIRED assessment", roles: [HomeNurse], code: 201, input: [patient_id, assessment_id, work_type, cost_estimate_cents], output: HomeModificationWorkOrder, side_effects: [] }
  - { method: GET, path: "/api/patients/{id}/home-modification-work-orders", description: "List a patient's work orders", roles: *ALL_ROLES, code: 200, input: ["status?", "work_type?"], output: "HomeModificationWorkOrder[]", side_effects: [] }
  - { method: GET, path: "/api/home-assessments/{id}/home-modification-work-orders", description: "List work orders linked to an assessment", roles: *ALL_ROLES, code: 200, input: ["status?"], output: "HomeModificationWorkOrder[]", side_effects: [] }
  - { method: POST, path: "/api/home-modification-work-orders/{id}/approve", description: "Approve + schedule (REQUESTED -> SCHEDULED; also INSPECTED_FAIL -> SCHEDULED rework)", roles: [ProgramAdmin], code: 200, input: [scheduled_window_start, scheduled_window_end], output: HomeModificationWorkOrder, side_effects: ["window stored"] }
  - { method: POST, path: "/api/home-modification-work-orders/{id}/complete", description: "SCHEDULED -> COMPLETED with final cost", roles: [BiomedTechnician], code: 200, input: [final_cost_cents], output: HomeModificationWorkOrder, side_effects: [] }
  - { method: POST, path: "/api/home-modification-work-orders/{id}/inspect", description: "COMPLETED -> INSPECTED_PASS (passed=true) | INSPECTED_FAIL (passed=false)", roles: [BiomedTechnician], code: 200, input: [passed], output: HomeModificationWorkOrder, side_effects: [] }
  - { method: POST, path: "/api/home-modification-work-orders/{id}/cancel", description: "REQUESTED|SCHEDULED -> CANCELLED", roles: [HomeNurse, ProgramAdmin], code: 200, input: [], output: HomeModificationWorkOrder, side_effects: [] }

  # --- Machines & maintenance ---
  - { method: POST, path: "/api/dialysis-machines", description: "Register a machine (IN_STOCK)", roles: [BiomedTechnician], code: 201, input: [program_id, serial_number, model], output: DialysisMachine, side_effects: [] }
  - { method: GET, path: "/api/dialysis-machines/{id}", description: "Get a machine (runtime/maintenance_due recomputed at read)", roles: *ALL_ROLES, code: 200, input: [], output: DialysisMachine, side_effects: ["total_runtime_hours, runtime_hours_at_last_service, maintenance_due recomputed"] }
  - { method: POST, path: "/api/dialysis-machines/{id}/assign", description: "Assign to a patient; from ASSIGNED reassigns (supersedes prior assignment); OCC on machine version", roles: [BiomedTechnician], code: 200, input: [patient_id, expected_machine_version], output: DialysisMachine, side_effects: ["increments DialysisMachine.version by 1", "posture recomputed for old and new patient"] }
  - { method: POST, path: "/api/dialysis-machines/{id}/unassign", description: "ASSIGNED -> IN_STOCK", roles: [BiomedTechnician], code: 200, input: [], output: DialysisMachine, side_effects: ["assigned_patient_id = null", "former patient's posture recomputed", "increments DialysisMachine.version by 1"] }
  - { method: POST, path: "/api/dialysis-machines/{id}/decommission", description: "IN_STOCK -> DECOMMISSIONED; SCHEDULED events cancelled; blocked while referenced by an ACTIVE/EXPIRED backup plan", roles: [ProgramAdmin], code: 200, input: [], output: DialysisMachine, side_effects: ["SCHEDULED MaintenanceEvents -> CANCELLED"] }
  - { method: GET, path: "/api/dialysis-machines/{id}/maintenance-events", description: "List a machine's maintenance events", roles: *ALL_ROLES, code: 200, input: ["status?", "event_type?"], output: "MaintenanceEvent[]", side_effects: [] }
  - { method: GET, path: "/api/dialysis-machines/{id}/treatment-logs", description: "List treatment logs recorded on a machine", roles: *ALL_ROLES, code: 200, input: ["status?"], output: "TreatmentLog[]", side_effects: [] }
  - { method: GET, path: "/api/dialysis-machines/{id}/emergency-backup-plans", description: "List backup plans referencing a machine", roles: *ALL_ROLES, code: 200, input: ["status?"], output: "EmergencyBackupPlan[]", side_effects: [] }
  - { method: GET, path: "/api/patients/{id}/dialysis-machines", description: "List machines currently/previously assigned to a patient (filter status=ASSIGNED for current)", roles: *ALL_ROLES, code: 200, input: ["status?"], output: "DialysisMachine[]", side_effects: [] }
  - { method: POST, path: "/api/maintenance-events", description: "Schedule a maintenance event (closed-interval overlap check on the machine)", roles: [BiomedTechnician], code: 201, input: [machine_id, event_type, window_start, window_end], output: MaintenanceEvent, side_effects: [] }
  - { method: POST, path: "/api/maintenance-events/{id}/start", description: "SCHEDULED -> IN_PROGRESS; machine -> UNDER_MAINTENANCE", roles: [BiomedTechnician], code: 200, input: [], output: MaintenanceEvent, side_effects: ["machine -> UNDER_MAINTENANCE", "assigned patient's posture recomputed"] }
  - { method: POST, path: "/api/maintenance-events/{id}/complete", description: "IN_PROGRESS -> COMPLETED; runtime snapshot; machine returns to ASSIGNED or IN_STOCK", roles: [BiomedTechnician], code: 200, input: [], output: MaintenanceEvent, side_effects: ["runtime_hours_at_service snapshot", "machine status restored", "maintenance_due recomputed", "posture recomputed"] }
  - { method: POST, path: "/api/maintenance-events/{id}/cancel", description: "SCHEDULED -> CANCELLED", roles: [BiomedTechnician], code: 200, input: [], output: MaintenanceEvent, side_effects: [] }

  # --- Emergency backup plans ---
  - { method: POST, path: "/api/emergency-backup-plans", description: "Create a plan (ACTIVE); supersedes the patient's prior ACTIVE/EXPIRED plan; OCC on patient version", roles: [HomeNurse], code: 201, input: [patient_id, plan_mode, "backup_machine_id?", expected_patient_version], output: EmergencyBackupPlan, side_effects: ["prior ACTIVE|EXPIRED plan -> SUPERSEDED", "last_drill_at = now", "increments Patient.version by 1", "posture recomputed"] }
  - { method: POST, path: "/api/emergency-backup-plans/{id}/drill", description: "Record an emergency drill; EXPIRED -> ACTIVE or ACTIVE refresh", roles: [HomeNurse], code: 200, input: [], output: EmergencyBackupPlan, side_effects: ["last_drill_at = now", "posture recomputed"] }
  - { method: GET, path: "/api/patients/{id}/emergency-backup-plans", description: "List a patient's plans (lazy EXPIRED applied)", roles: *ALL_ROLES, code: 200, input: ["status?"], output: "EmergencyBackupPlan[]", side_effects: ["lazy expiry applied"] }

  # --- Supply orders & delivery ---
  - { method: POST, path: "/api/supply-orders", description: "Create a DRAFT monthly order; supersedes existing DRAFT for same patient+month; rejected with ERR_MONTH_ORDER_EXISTS when a SUBMITTED|APPROVED|CLOSED order exists for that patient+month; OCC on patient version; money fields computed", roles: [Patient], code: 201, input: [patient_id, order_month, lines, expected_patient_version], output: SupplyOrder, side_effects: ["existing DRAFT for same patient+month -> SUPERSEDED", "provisional_total_units/subtotal/handling_fee/discount/grand_total computed", "increments Patient.version by 1"] }
  - { method: GET, path: "/api/supply-orders/{id}", description: "Get an order (both status axes)", roles: *ALL_ROLES, code: 200, input: [], output: SupplyOrder, side_effects: [] }
  - { method: GET, path: "/api/patients/{id}/supply-orders", description: "List a patient's orders", roles: *ALL_ROLES, code: 200, input: ["order_month?", "order_status?"], output: "SupplyOrder[]", side_effects: [] }
  - { method: PATCH, path: "/api/supply-orders/{id}", description: "Edit lines in DRAFT or CHANGES_REQUESTED (latter returns to DRAFT); money recomputed", roles: [Patient], code: 200, input: [lines], output: SupplyOrder, side_effects: ["money fields recomputed", "CHANGES_REQUESTED -> DRAFT"] }
  - { method: POST, path: "/api/supply-orders/{id}/submit", description: "DRAFT|CHANGES_REQUESTED -> SUBMITTED with the full gate ladder (state > month > posture > lines > uniqueness > storage > allowance)", roles: [Patient], code: 200, input: [], output: SupplyOrder, side_effects: ["standard_allowance_units and carried_adjustment_units computed and stored"] }
  - { method: POST, path: "/api/supply-orders/{id}/review", description: "SUBMITTED -> APPROVED (decision=APPROVE) | CHANGES_REQUESTED (decision=REQUEST_CHANGES)", roles: [SupplyCoordinator], code: 200, input: [decision, "note?"], output: SupplyOrder, side_effects: ["review_note stored"] }
  - { method: POST, path: "/api/supply-orders/{id}/cancel", description: "Cancel from DRAFT|SUBMITTED|CHANGES_REQUESTED|APPROVED; SCHEDULED appointments cancelled", roles: [Patient, SupplyCoordinator], code: 200, input: [], output: SupplyOrder, side_effects: ["SCHEDULED DeliveryAppointments -> CANCELLED"] }
  - { method: POST, path: "/api/supply-orders/{id}/close", description: "APPROVED -> CLOSED after month end; ACTUALIZED reconciliation computes actualized_units/adjustment_units", roles: [SupplyCoordinator], code: 200, input: [], output: SupplyOrder, side_effects: ["actualized_units, adjustment_units computed"] }
  - { method: POST, path: "/api/delivery-appointments", description: "Schedule a delivery for an APPROVED order (one SCHEDULED per order; window date inside order_month)", roles: [SupplyCoordinator], code: 201, input: [supply_order_id, window_start, window_end], output: DeliveryAppointment, side_effects: [] }
  - { method: GET, path: "/api/supply-orders/{id}/delivery-appointments", description: "List an order's delivery appointments", roles: *ALL_ROLES, code: 200, input: ["status?"], output: "DeliveryAppointment[]", side_effects: [] }
  - { method: POST, path: "/api/delivery-appointments/{id}/complete", description: "SCHEDULED -> DELIVERED with delivered_units; on-hand and fulfillment updated", roles: [SupplyCoordinator], code: 200, input: [delivered_units], output: DeliveryAppointment, side_effects: ["order.delivered_units_total += delivered_units", "patient.on_hand_units += delivered_units", "fulfillment_status updated"] }
  - { method: POST, path: "/api/delivery-appointments/{id}/fail", description: "SCHEDULED -> FAILED", roles: [SupplyCoordinator], code: 200, input: [failure_reason], output: DeliveryAppointment, side_effects: [] }
  - { method: POST, path: "/api/delivery-appointments/{id}/cancel", description: "SCHEDULED -> CANCELLED", roles: [SupplyCoordinator], code: 200, input: [], output: DeliveryAppointment, side_effects: [] }

  # --- Treatment logs & clinical reviews ---
  - { method: POST, path: "/api/treatment-logs", description: "Submit a treatment log; consumption debited from on-hand; cadence review auto-created when due", roles: [Patient], code: 201, input: [patient_id, machine_id, treatment_date, duration_minutes, consumption], output: TreatmentLog, side_effects: ["consumption_units computed", "patient.on_hand_units -= consumption_units", "machine.total_runtime_hours recomputed", "review_cadence_trigger evaluated", "posture recomputed"] }
  - { method: GET, path: "/api/patients/{id}/treatment-logs", description: "List a patient's treatment logs", roles: *ALL_ROLES, code: 200, input: ["status?", "treatment_date?"], output: "TreatmentLog[]", side_effects: [] }
  - { method: POST, path: "/api/treatment-logs/{id}/mark-reviewed", description: "SUBMITTED -> REVIEWED", roles: [HomeNurse], code: 200, input: [], output: TreatmentLog, side_effects: [] }
  - { method: POST, path: "/api/treatment-logs/{id}/flag", description: "SUBMITTED -> FLAGGED", roles: [HomeNurse], code: 200, input: [flag_note], output: TreatmentLog, side_effects: [] }
  - { method: POST, path: "/api/treatment-logs/{id}/amend", description: "FLAGGED -> SUBMITTED with corrected fields; on-hand restore-then-subtract", roles: [Patient], code: 200, input: ["duration_minutes?", "consumption?"], output: TreatmentLog, side_effects: ["on_hand adjusted by delta", "machine runtime recomputed", "flag_note cleared"] }
  - { method: GET, path: "/api/patients/{id}/clinical-reviews", description: "List a patient's clinical reviews (system-created)", roles: *ALL_ROLES, code: 200, input: ["status?", "due_reason?"], output: "ClinicalReview[]", side_effects: ["lazy overdue evaluation"] }
  - { method: POST, "path": "/api/clinical-reviews/{id}/sign-off", description: "PENDING -> SIGNED_OFF (all period logs must be REVIEWED); computes rolling adherence; REQUIRE_RETRAINING sets retraining_required", roles: [Nephrologist], code: 200, input: [outcome], output: ClinicalReview, side_effects: ["adherence_rolling_pct computed", "waste_alert_active cleared", "outcome side effects", "posture recomputed"] }
  - { method: POST, path: "/api/clinical-reviews/{id}/escalate", description: "PENDING -> ESCALATED; posture BLOCKED; open non-approved orders cancelled", roles: [HomeNurse, Nephrologist], code: 200, input: [], output: ClinicalReview, side_effects: ["posture -> BLOCKED (open escalation)", "open SupplyOrders in {DRAFT, SUBMITTED, CHANGES_REQUESTED} -> CANCELLED"] }

  # --- Chairs & backup slots ---
  - { method: POST, path: "/api/in-center-chairs", description: "Register an in-center chair", roles: [ProgramAdmin], code: 201, input: [program_id, chair_code], output: InCenterChair, side_effects: [] }
  - { method: GET, path: "/api/in-center-chairs/{id}", description: "Get a chair", roles: *ALL_ROLES, code: 200, input: [], output: InCenterChair, side_effects: [] }
  - { method: PATCH, path: "/api/in-center-chairs/{id}", description: "Toggle in_service", roles: [ProgramAdmin], code: 200, input: [in_service], output: InCenterChair, side_effects: [] }
  - { method: POST, path: "/api/backup-slot-reservations", description: "Book an in-center backup slot (plan ACTIVE + chair in service + half-open overlap + daily cap 2)", roles: [Patient], code: 201, input: [patient_id, chair_id, slot_start, slot_end], output: BackupSlotReservation, side_effects: [] }
  - { method: GET, path: "/api/patients/{id}/backup-slot-reservations", description: "List a patient's reservations (lazy NO_SHOW applied)", roles: *ALL_ROLES, code: 200, input: ["status?"], output: "BackupSlotReservation[]", side_effects: ["lazy NO_SHOW applied; no_show_count updated"] }
  - { method: GET, path: "/api/in-center-chairs/{id}/backup-slot-reservations", description: "List a chair's reservations", roles: *ALL_ROLES, code: 200, input: ["status?"], output: "BackupSlotReservation[]", side_effects: ["lazy NO_SHOW applied"] }
  - { method: POST, path: "/api/backup-slot-reservations/{id}/cancel", description: "RESERVED -> CANCELLED (before slot_start)", roles: [Patient], code: 200, input: [], output: BackupSlotReservation, side_effects: [] }
  - { method: POST, path: "/api/backup-slot-reservations/{id}/complete", description: "RESERVED -> COMPLETED (nurse marks attendance)", roles: [HomeNurse], code: 200, input: [], output: BackupSlotReservation, side_effects: [] }

  # --- Waste & returns ---
  - { method: POST, path: "/api/waste-return-records", description: "Report waste or a return (total_units <= on_hand; no on-hand change until verified)", roles: [Patient], code: 201, input: [patient_id, record_type, activity_month, lines], output: WasteReturnRecord, side_effects: ["total_units computed"] }
  - { method: GET, path: "/api/patients/{id}/waste-return-records", description: "List a patient's waste/return records", roles: *ALL_ROLES, code: 200, input: ["record_type?", "status?", "activity_month?"], output: "WasteReturnRecord[]", side_effects: [] }
  - { method: POST, path: "/api/waste-return-records/{id}/verify", description: "REPORTED -> CREDITED (RETURN) | VERIFIED (WASTE) | REJECTED (approved=false)", roles: [SupplyCoordinator], code: 200, input: [approved], output: WasteReturnRecord, side_effects: ["on approval: on_hand_units -= total_units", "RETURN: credit_cents computed", "WASTE: waste_ratio evaluated; threshold crossing latches waste_alert_active and may create ESCALATION review", "posture recomputed"] }

  # --- Transitions (home-to-center reason coding) ---
  - { method: POST, path: "/api/transition-records", description: "Request a transition with reason coding (conditional substantiation per reason_code)", roles: [Patient, Nephrologist], code: 201, input: [patient_id, direction, reason_code, effective_from, "effective_to?", "reversal_of_id?"], output: TransitionRecord, side_effects: [] }
  - { method: GET, path: "/api/transition-records/{id}", description: "Get a transition record (lazy COMPLETED applied)", roles: *ALL_ROLES, code: 200, input: [], output: TransitionRecord, side_effects: ["lazy COMPLETED applied"] }
  - { method: GET, path: "/api/patients/{id}/transition-records", description: "List a patient's transitions", roles: *ALL_ROLES, code: 200, input: ["status?", "direction?"], output: "TransitionRecord[]", side_effects: ["lazy COMPLETED applied"] }
  - { method: GET, path: "/api/transition-records/{id}/reversals", description: "List CENTER_TO_HOME reversals referencing this transition", roles: *ALL_ROLES, code: 200, input: [], output: "TransitionRecord[]", side_effects: [] }
  - { method: POST, path: "/api/transition-records/{id}/approve", description: "REQUESTED -> APPROVED", roles: [Nephrologist], code: 200, input: [], output: TransitionRecord, side_effects: [] }
  - { method: POST, path: "/api/transition-records/{id}/deny", description: "REQUESTED -> DENIED", roles: [Nephrologist], code: 200, input: [], output: TransitionRecord, side_effects: [] }
  - { method: POST, path: "/api/transition-records/{id}/activate", description: "APPROVED -> ACTIVE once effective_from reached; fires the full patient/machine/plan/order/slot cascade", roles: [Nephrologist], code: 200, input: [], output: TransitionRecord, side_effects: ["Patient status transition with cascades per §1.2", "CENTER_TO_HOME additionally flips reversed record ACTIVE -> REVERSED"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Patient-role caller's X-User-ID does not match the target patient" }
  # --- existence / request shape ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist (left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum, bad YYYY-MM format, empty lines, quantity < 1, unknown sku, non-monotone windows, duplicate chair_code, empty reason/note, same-patient machine reassign" }
  - { id: ERR_INVALID_EFFECTIVE_RANGE, http: 400, condition: "effective_to <= effective_from, or effective_to supplied for a CENTER_TO_HOME reversal" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  # --- patient lifecycle / readiness ---
  - { id: ERR_TRAINING_INCOMPLETE, http: 409, condition: "Activate: some module lacks a current SIGNED_OFF passing attempt" }
  - { id: ERR_ASSESSMENT_NOT_CURRENT, http: 409, condition: "Activate: no ACCEPTED assessment within 730 days" }
  - { id: ERR_NO_MACHINE_ASSIGNED, http: 409, condition: "Activate: no ASSIGNED machine for the patient" }
  - { id: ERR_NO_ACTIVE_PLAN, http: 409, condition: "Activate: no ACTIVE emergency backup plan" }
  - { id: ERR_READINESS_GATES_NOT_MET, http: 409, condition: "Reinstate / reversal activation: one or more readiness gates fail" }
  - { id: ERR_ACTIVE_TRANSITION_BLOCKS_REINSTATE, http: 409, condition: "Reinstate while an ACTIVE HOME_TO_CENTER transition exists" }
  - { id: ERR_PATIENT_NOT_ACTIVE_HOME, http: 409, condition: "Log/slot create or machine assign requires the patient in ACTIVE_HOME (assign: not TRANSITIONED_OUT)" }
  - { id: ERR_PATIENT_INVALID_STATE, http: 409, condition: "Activate/suspend/reinstate requested from a program_status without that transition (e.g. suspend from TRAINING, activate twice, any lifecycle action after TRANSITIONED_OUT)" }
  # --- training / assessment / work orders ---
  - { id: ERR_ATTEMPT_NOT_RECORDED, http: 409, condition: "Sign-off on a non-RECORDED attempt" }
  - { id: ERR_ATTEMPT_NOT_PASSING, http: 409, condition: "Sign-off on an attempt with is_passing == false" }
  - { id: ERR_SOD_SIGNOFF_BY_TRAINER, http: 403, condition: "Sign-off nurse is the attempt's trainer (segregation of duties)" }
  - { id: ERR_SOD_ASSESSOR_SELF_ACCEPT, http: 403, condition: "Accept/require-remediation nurse is the assessment's assessor (segregation of duties)" }
  - { id: ERR_ASSESSMENT_RESULT_FAIL, http: 409, condition: "Accept on an assessment whose computed result is FAIL" }
  - { id: ERR_ASSESSMENT_INVALID_STATE, http: 409, condition: "Accept/require-remediation/resubmit from a state without that transition" }
  - { id: ERR_WORK_ORDERS_OUTSTANDING, http: 409, condition: "Resubmit while a linked work order is neither INSPECTED_PASS nor CANCELLED" }
  - { id: ERR_WORK_ORDER_INVALID_STATE, http: 409, condition: "Approve/complete/inspect/cancel from a state without that transition" }
  # --- machines / maintenance ---
  - { id: ERR_MACHINE_INVALID_STATE, http: 409, condition: "Assign/unassign/decommission from a machine state without that transition" }
  - { id: ERR_MACHINE_MAINTENANCE_DUE, http: 409, condition: "Assign a machine with maintenance_due == true" }
  - { id: ERR_MACHINE_REFERENCED_BY_PLAN, http: 409, condition: "Decommission a machine referenced by an ACTIVE/EXPIRED backup plan" }
  - { id: ERR_SERIAL_NUMBER_EXISTS, http: 409, condition: "serial_number already used within the program" }
  - { id: ERR_EVENT_WINDOW_OVERLAP, http: 409, condition: "New maintenance window CLOSED-interval overlaps another SCHEDULED/IN_PROGRESS event on the same machine (touching endpoints conflict)" }
  - { id: ERR_EVENT_INVALID_STATE, http: 409, condition: "Start/complete/cancel from an event (or machine) state without that transition" }
  - { id: ERR_MACHINE_BUSY_MAINTENANCE, http: 409, condition: "Start while another event is IN_PROGRESS on the same machine" }
  - { id: ERR_EVENT_WINDOW_PASSED, http: 422, condition: "Start when now > window_end" }
  # --- emergency plans ---
  - { id: ERR_BACKUP_MACHINE_REQUIRED, http: 400, condition: "plan_mode BACKUP_MACHINE or BOTH without backup_machine_id" }
  - { id: ERR_BACKUP_MACHINE_NOT_IN_STOCK, http: 409, condition: "backup_machine_id references a machine not IN_STOCK" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Slot booking requires an ACTIVE plan; drill on SUPERSEDED/CLOSED plan" }
  # --- orders / delivery ---
  - { id: ERR_ORDER_MONTH_IN_PAST, http: 422, condition: "order_month before the current clock month (create or submit)" }
  - { id: ERR_MONTH_ORDER_EXISTS, http: 409, condition: "Submit while another order for the same patient+month is SUBMITTED/APPROVED/CLOSED" }
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "Submit/review/cancel/close/PATCH from an order state without that transition; also appointment create against a non-APPROVED order" }
  - { id: ERR_POSTURE_NOT_ORDERABLE, http: 403, condition: "Submit while posture is NOT_READY or BLOCKED" }
  - { id: ERR_STORAGE_CAPACITY_EXCEEDED, http: 422, condition: "on_hand_units + provisional_total_units > storage_cap_units (checked before the allowance bound)" }
  - { id: ERR_ALLOWANCE_EXCEEDED, http: 422, condition: "provisional_total_units > standard_allowance_units + carried_adjustment_units" }
  - { id: ERR_MONTH_NOT_ENDED, http: 422, condition: "Close before the first day of the month after order_month" }
  - { id: ERR_OPEN_APPOINTMENTS_EXIST, http: 409, condition: "Close while a SCHEDULED appointment exists for the order" }
  - { id: ERR_ACTIVE_APPOINTMENT_EXISTS, http: 409, condition: "Appointment create while another SCHEDULED appointment exists for the order" }
  - { id: ERR_APPOINTMENT_OUTSIDE_ORDER_MONTH, http: 422, condition: "window_start date outside the order's order_month" }
  - { id: ERR_APPOINTMENT_INVALID_STATE, http: 409, condition: "Complete/fail/cancel from a non-SCHEDULED appointment" }
  - { id: ERR_DELIVERED_UNITS_INVALID, http: 422, condition: "delivered_units < 1 or > remaining undelivered units" }
  # --- logs / reviews ---
  - { id: ERR_DUPLICATE_TREATMENT_DATE, http: 409, condition: "A log already exists for this patient and treatment_date" }
  - { id: ERR_LOG_DATE_IN_FUTURE, http: 422, condition: "treatment_date after the current clock date" }
  - { id: ERR_MACHINE_NOT_ASSIGNED_TO_PATIENT, http: 409, condition: "Log's machine is not ASSIGNED with assigned_patient_id == log patient" }
  - { id: ERR_LOG_INVALID_STATE, http: 409, condition: "Mark-reviewed/flag from non-SUBMITTED, or amend from non-FLAGGED" }
  - { id: ERR_UNREVIEWED_LOGS_REMAIN, http: 409, condition: "Review sign-off while a period log is SUBMITTED or FLAGGED" }
  - { id: ERR_REVIEW_NOT_PENDING, http: 409, condition: "Sign-off/escalate on a non-PENDING review" }
  # --- chairs / slots ---
  - { id: ERR_CHAIR_OUT_OF_SERVICE, http: 409, condition: "Reservation on a chair with in_service == false" }
  - { id: ERR_SLOT_IN_PAST, http: 422, condition: "slot_start before now" }
  - { id: ERR_SLOT_DURATION_INVALID, http: 400, condition: "Slot duration outside 60..480 minutes" }
  - { id: ERR_CHAIR_SLOT_OVERLAP, http: 409, condition: "Half-open [slot_start, slot_end) intersects another RESERVED reservation on the same chair (adjacency allowed)" }
  - { id: ERR_SLOT_DAILY_CAP_EXCEEDED, http: 422, condition: "Patient already has 2 RESERVED reservations on the same calendar service day" }
  - { id: ERR_SLOT_INVALID_STATE, http: 409, condition: "Cancel/complete from a non-RESERVED reservation" }
  - { id: ERR_SLOT_TOO_LATE_TO_CANCEL, http: 422, condition: "Cancel at or after slot_start" }
  # --- waste / returns ---
  - { id: ERR_QUANTITY_EXCEEDS_ON_HAND, http: 422, condition: "Log consumption or waste/return total exceeds patient.on_hand_units (amend: net delta exceeds on-hand)" }
  - { id: ERR_WASTE_RECORD_NOT_REPORTED, http: 409, condition: "Verify on a non-REPORTED record" }
  # --- transitions ---
  - { id: ERR_REVERSAL_TARGET_REQUIRED, http: 400, condition: "CENTER_TO_HOME without reversal_of_id" }
  - { id: ERR_REVERSAL_TARGET_INVALID, http: 409, condition: "reversal_of_id does not reference an ACTIVE HOME_TO_CENTER transition of the same patient" }
  - { id: ERR_REASON_REQUIRES_PHYSICIAN, http: 403, condition: "MEDICAL_COMPLICATION reason requested by a non-Nephrologist" }
  - { id: ERR_REASON_NOT_SUBSTANTIATED, http: 409, condition: "MACHINE_FAILURE without a REPAIR event (IN_PROGRESS|COMPLETED, window_end within last 30 days) on the patient's assigned machine; SUPPLY_FAILURE without a FAILED appointment (window_start within last 30 days); TRAINING_INCOMPLETE while posture != NOT_READY" }
  - { id: ERR_OPEN_TRANSITION_EXISTS, http: 409, condition: "New HOME_TO_CENTER while one is REQUESTED/APPROVED/ACTIVE (non-reversed) for the patient" }
  - { id: ERR_TRANSITION_INVALID_STATE, http: 409, condition: "Approve/deny/activate from a transition state without that transition" }
  - { id: ERR_PATIENT_STATE_BLOCKS_TRANSITION, http: 409, condition: "Activate: HOME_TO_CENTER requires ACTIVE_HOME|SUSPENDED; CENTER_TO_HOME requires SUSPENDED" }
  - { id: ERR_TRANSITION_EFFECTIVE_IN_FUTURE, http: 409, condition: "Activate before effective_from" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Patient
    description: "Enrolled home-dialysis patient acting on their own records; X-User-ID must equal the Patient id for write operations (ownership, validations priority 3)"
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /api/supply-orders — create own monthly DRAFT order"
      - "PATCH /api/supply-orders/{id} — edit own order lines"
      - "POST /api/supply-orders/{id}/submit — submit own order"
      - "POST /api/treatment-logs — submit own treatment logs"
      - "POST /api/treatment-logs/{id}/amend — amend own flagged log"
      - "POST /api/backup-slot-reservations — book own backup slot"
      - "POST /api/backup-slot-reservations/{id}/cancel — cancel own reservation"
      - "POST /api/waste-return-records — report own waste/returns"
    shared_operations:
      - "POST /api/supply-orders/{id}/cancel — shared with SupplyCoordinator"
      - "POST /api/transition-records — shared with Nephrologist (non-medical reasons only for Patient)"
      - "All GET endpoints — shared with all roles"

  - name: HomeNurse
    description: "Home-dialysis nurse: intake, training delivery and sign-off (never both on one attempt), home assessments (never accepting own), work-order creation, backup plans and drills, log review, slot attendance"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/patients — enroll patient"
      - "POST /api/training-attempts — record attempt (becomes trainer_user_id)"
      - "POST /api/training-attempts/{id}/sign-off — sign off another nurse's attempt"
      - "POST /api/home-assessments — submit assessment (becomes assessed_by_user_id)"
      - "POST /api/home-assessments/{id}/accept — accept another nurse's PASS assessment"
      - "POST /api/home-assessments/{id}/require-remediation — send another nurse's assessment to remediation"
      - "POST /api/home-assessments/{id}/resubmit — resubmit after remediation"
      - "POST /api/home-modification-work-orders — open remediation work order"
      - "POST /api/emergency-backup-plans — create plan"
      - "POST /api/emergency-backup-plans/{id}/drill — record drill"
      - "POST /api/treatment-logs/{id}/mark-reviewed — review a log"
      - "POST /api/treatment-logs/{id}/flag — flag a log"
      - "POST /api/backup-slot-reservations/{id}/complete — mark attendance"
    shared_operations:
      - "POST /api/home-modification-work-orders/{id}/cancel — shared with ProgramAdmin"
      - "POST /api/clinical-reviews/{id}/escalate — shared with Nephrologist"
      - "All GET endpoints — shared with all roles"

  - name: Nephrologist
    description: "Physician: prescription management, patient lifecycle decisions, clinical review sign-off, transition approval/activation"
    identity: "opaque"
    exclusive_operations:
      - "PATCH /api/patients/{id}/prescription"
      - "POST /api/patients/{id}/activate"
      - "POST /api/patients/{id}/suspend"
      - "POST /api/patients/{id}/reinstate"
      - "POST /api/clinical-reviews/{id}/sign-off"
      - "POST /api/transition-records/{id}/approve"
      - "POST /api/transition-records/{id}/deny"
      - "POST /api/transition-records/{id}/activate"
    shared_operations:
      - "POST /api/transition-records — shared with Patient (MEDICAL_COMPLICATION reason restricted to Nephrologist)"
      - "POST /api/clinical-reviews/{id}/escalate — shared with HomeNurse"
      - "All GET endpoints — shared with all roles"

  - name: SupplyCoordinator
    description: "Supply chain operator: order review/close, delivery scheduling and completion, waste/return verification and crediting"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/supply-orders/{id}/review"
      - "POST /api/supply-orders/{id}/close"
      - "POST /api/delivery-appointments — schedule delivery"
      - "POST /api/delivery-appointments/{id}/complete"
      - "POST /api/delivery-appointments/{id}/fail"
      - "POST /api/delivery-appointments/{id}/cancel"
      - "POST /api/waste-return-records/{id}/verify"
    shared_operations:
      - "POST /api/supply-orders/{id}/cancel — shared with Patient"
      - "All GET endpoints — shared with all roles"

  - name: BiomedTechnician
    description: "Biomedical technician: machine registry and assignment, maintenance events, work-order execution and inspection"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/dialysis-machines — register machine"
      - "POST /api/dialysis-machines/{id}/assign"
      - "POST /api/dialysis-machines/{id}/unassign"
      - "POST /api/maintenance-events — schedule event"
      - "POST /api/maintenance-events/{id}/start"
      - "POST /api/maintenance-events/{id}/complete"
      - "POST /api/maintenance-events/{id}/cancel"
      - "POST /api/home-modification-work-orders/{id}/complete"
      - "POST /api/home-modification-work-orders/{id}/inspect"
    shared_operations:
      - "All GET endpoints — shared with all roles"

  - name: ProgramAdmin
    description: "Program administrator: program config, logical clock, chairs, work-order approval, machine decommission"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/dialysis-programs"
      - "POST /api/_clock/set_current_utc"
      - "POST /api/in-center-chairs"
      - "PATCH /api/in-center-chairs/{id}"
      - "POST /api/home-modification-work-orders/{id}/approve"
      - "POST /api/dialysis-machines/{id}/decommission"
    shared_operations:
      - "POST /api/home-modification-work-orders/{id}/cancel — shared with HomeNurse"
      - "All GET endpoints — shared with all roles"
