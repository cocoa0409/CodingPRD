            - call: "POST /retail-agreements"
              payload: { category_id: "${cat_id}", retailer_name: "SpecialtyCo", exclusive: true, window_start: "2027-01-01T00:00:00Z", window_end: "2027-04-01T00:00:00Z", min_launch_units: 50 }
              as: RetailExec
              captures: { agr3_id: $.data.id }
          trigger:
            - call: "POST /retail-agreements/${agr2_id}/sign"
              payload: {}
              as: RetailExec
              captures: { err2: $.data.error_id }
            - call: "POST /retail-agreements/${agr3_id}/sign"
              payload: {}
              as: RetailExec
              captures: { agr3_status: $.data.status }
          assert:
            - "err2 == ERR_EXCLUSIVE_WINDOW_CONFLICT (A2 [2026-12-01, 2027-02-01) strictly overlaps A1 [2026-10-01, 2027-01-01))"
            - "agr3_status == SIGNED (A3.window_start == A1.window_end is adjacency, not intersection, under half-open semantics)"
            - "A2 remaining DRAFT does not block A3 (only SIGNED exclusives participate in the overlap set)"

      - name: tooling_slots_aggregate_capacity_not_interval_exclusion
        grounds:
          - state_machines.ModelVariant.lifecycle.DRAFT_to_TOOLED
          - errors[ERR_TOOLING_SLOTS_FULL]
          - constants.TOOLING_PARALLEL_SLOTS
        distinguishing_aspect: |
          Resource: FactoryPartner tooling capacity; interval semantics:
          AGGREGATE CONCURRENCY (count of overlapping 14-day tooling windows
          capped at TOOLING_PARALLEL_SLOTS 2), not pairwise interval exclusion —
          two simultaneous engagements are fine, a third overlapping one fails,
          and after the earliest window elapses a new engagement fits even
          though intervals are on the same partner. Different semantics and
          different resource than the category-window instance.
