            - "the captured ${b_days} == 15 with ${b_fee} == 50000 and ${b_status} == LOST: the same due instant returned one millisecond later crosses SAMPLE_LOST_THRESHOLD_DAYS, and the fee becomes the whole replacement value"
            - "the captured ${c_days} == 7 with ${c_fee} == 5000 and ${c_status} == RETURNED: 750 x 7 = 5250 is clipped by min(fee, replacement_value_cents) to the kit's own 5000"
