  - rule_id: transitive_cascade
    instances:
      - name: reopen_drives_five_hop_decertification_chain
        grounds:
          - state_machines.Application.stage.REGISTER_LOCKED_to_DECISIONED
          - state_machines.EditException.VERIFIED_to_OPEN
          - state_machines.EditRun.CLEARED_ALL_to_INVALIDATED
          - state_machines.FilingSubmission.CERTIFIED_to_DRAFT
          - entities.Institution.fields.filing_posture
        distinguishing_aspect: |
          Depth 5, all links causal: reopening the Application drops it out of
          CLEARED (hop 1); that lar_status change is what reverts its VERIFIED
          EditException to OPEN and decrements the run's cleared_record_count
          (hop 2); that ledger movement is what INVALIDATES the EditRun (hop 3);
          the run's invalidation is what returns the CERTIFIED FilingSubmission to
          DRAFT (hop 4); and the submission leaving CERTIFIED is what returns
          Institution.filing_posture to OPEN (hop 5). The trigger is
          POST /hmda/applications/{id}/reopen, different from the filing trigger
          of the second cascade instance.
        test_recipe:
          setup:
            - "One non partial-exempt Institution, one CensusTract."
            - "One Application with a 196-day decision lag, REGISTER_LOCKED, flagged by edit run 1 with a single Q615 quality exception."
            - "analyst-nova verifies that exception, so the record becomes CLEARED and run 1 becomes CLEARED_ALL."
            - "officer-alpha opens a FilingSubmission, attaches run 1 and certifies it, so Institution.filing_posture is LOCKED_FOR_FILING."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/census-tracts"
              payload: { tract_code: "06075010100", county_fips: "06075", state_code: "CA", msa_md_code: "41860", minority_population_pct: 42.5, tract_to_msa_income_pct: 88.4, owner_occupied_units: 1200, median_family_income_cents: 9500000 }
              as: SystemAdmin
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000061", application_date: "2026-01-05T00:00:00Z", application_channel: "FACE_TO_FACE", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, income_thousands: 120 }
              as: LoanOfficer
              captures: { app_id: $.data.id, app_v1: $.data.version }
            - call: "POST /hmda/geocode-assignments"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v1}", street_address: "1 Market St", city: "San Francisco", state_code: "CA", zip_code: "94105", county_fips: "06075", submitted_tract_code: "06075010100" }
              as: LoanOfficer
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_id}", applicant_role: "APPLICANT", collection_method: "VISUAL_OBSERVATION_OR_SURNAME", ethnicity_codes: ["NOT_HISPANIC_OR_LATINO"], race_codes: ["WHITE"], sex_code: "MALE", observation_basis: "VISUAL" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "UNDERWRITING" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "DECISIONED" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/action-taken"
              payload: { action_taken: "ORIGINATED", action_taken_date: "2026-07-20T00:00:00Z", rate_spread: 1.75, purchaser_type: "NOT_APPLICABLE" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "REGISTER_LOCKED" }
              as: LoanOfficer
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst_id}", scope: "FULL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { run_id: $.data.id }
            - call: "GET /hmda/edit-runs/${run_id}/exceptions"
              payload: {}
              as: ComplianceAnalyst
              captures: { exc_id: "$.data[0].id" }
            - call: "POST /hmda/edit-exceptions/${exc_id}/verify"
              payload: { verification_note: "Lag verified against the underwriting file." }
              as: ComplianceAnalyst
              as_user_id: "analyst-nova"
            - call: "GET /hmda/institutions/${inst_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { inst_v: $.data.version }
            - call: "POST /hmda/submissions"
              payload: { institution_id: "${inst_id}", expected_institution_version: "${inst_v}" }
              as: ComplianceOfficer
