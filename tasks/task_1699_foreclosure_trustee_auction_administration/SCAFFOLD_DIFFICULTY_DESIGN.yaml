          assert:
            - "AuctionSale.${sale_a}.winner_type == THIRD_PARTY and winning_bid_cents == 43000000"
            - "AuctionSale.${sale_b}.winner_type == BENEFICIARY and winning_bid_cents == 42000000"
            - "${fee_a} == 215000 (min(475000, max(75000, round_half_up(0.005*43000000))))"
            - "${fee_b} == 205720 (base is total_debt_at_close 41144050, NOT opening bid 42000000 which would yield 210000)"
            - "AuctionSale.${sale_b}.total_debt_at_close_cents == 41144050"

      - name: quote_per_diem_round_then_multiply_order
        grounds:
          - calculations.per_diem_interest
          - calculations.quote_amounts
        distinguishing_aspect: |
          Mode (b) nested rounding: round per-diem FIRST then multiply gives
          interest 27126 (1233 x 22 days); multiply-then-round would give 27123.
          The scaffold pins round-then-multiply; an implementation using the
          other order is off by exactly 3 cents. Distinct mode from the
          min/max branch instance.
        test_recipe:
          setup:
            - "Case LN-R2: principal 10000000, rate 4.5, interest paid through 2026-07-20, no penalty, no costs, still REFERRED (payoff issuable pre-NOD)"
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary Delta", reference_code: "BEN-R2", contact_email: "delta@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-R2", borrower_name: "Borrower R", property_address: "6 Round Rd", county_code: "CC01", unpaid_principal_balance_cents: 10000000, monthly_payment_cents: 100000, months_in_arrears: 1, late_fee_per_month_cents: 5000, note_rate_pct: 4.5, last_interest_paid_date: "2026-07-20", distribution_method: "STATUTORY_PRIORITY", prepayment_penalty_applies: false }, as: CaseManager, captures: { case_id: $.data.id, case_v: $.data.version } }
          trigger:
            - { call: "POST /api/foreclosure-cases/${case_id}/quotes", payload: { quote_type: "PAYOFF", good_through_date: "2026-08-11", expected_foreclosure_case_version: "${case_v}" }, as: CaseManager, captures: { q_id: $.data.id } }
          assert:
            - "Quote.${q_id}.interest_cents == 27126 (per-diem round_half_up(10000000*4.5/100/365) == 1233, then x 22 days; multiply-then-round would give 27123)"
            - "Quote.${q_id}.total_cents == 10052126 (10000000 + 27126 + 0 costs + 25000 fee + 0 penalty)"
            - "Quote.${q_id}.costs_cents == 0 (no APPROVED advances)"

  - rule_id: non_linear_state_machine
    instances:
