              payload: { security_id: "${sec_id}", event_type: "MERGER", election_required: true, election_deadline: "2026-05-20T16:00:00Z", terms: { cash_per_share_cents: 5000, cash_pool_cents: 900000, new_security_id: "${newco_id}", ratio_num: 1, ratio_den: 1, default_option: "STOCK" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2", captures: { ev_v: $.data.version } }
            - { call: "POST /api/events/${ev_id}/amendments", payload: { amended_terms: { cash_per_share_cents: 5100, cash_pool_cents: 900000, new_security_id: "${newco_id}", ratio_num: 1, ratio_den: 1, default_option: "STOCK" }, reason: "cash consideration raised", expected_event_version: "${ev_v}" }, as: EventAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /api/events/${ev_id}", payload: {}, as: OperationsManager, captures: { ev_v: $.data.version, ev_status: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DeskAdministrator }
          trigger:
            - { call: "POST /api/events/${ev_id}/elections", payload: { account_id: "${a1}", option_code: "CASH", expected_event_version: "${ev_v}" }, as: AccountHolder, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "Event status == AMENDED (captured ${ev_status})"
            - "error_id == ERR_EVENT_NOT_ACCEPTING_ELECTIONS (409): the Election's validity depends on the CorporateActionEvent's state"

      - name: complete_blocked_by_open_recon_break
        grounds:
          - state_machines.CorporateActionEvent.BOOKED_to_COMPLETED
          - errors[ERR_OPEN_RECON_BREAKS_EXIST]
          - calculations.custodian_position_reconciliation
        distinguishing_aspect: |
          Entity pair CorporateActionEvent -> ReconBreak (different pair than
          Election -> Event): completing a BOOKED event is gated on the absence
          of OPEN recon breaks linked to it; resolving the break unblocks it.
        test_recipe:
          setup:
            - "ACME; account A1 (1000 sh); SPLIT 2:1 event BOOKED at 2026-05-15 (entitlement SETTLED, 2000 shares, no cash movement)"
            - "Custodian statement reports 2000 shares (matches) but cash_cents 5000 for the event (books show 0) -> OPEN CASH_MISMATCH break linked to the event"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSP001401", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One" }, as: DeskAdministrator, captures: { a1: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 1000, acquisition_date: "2026-04-01", cost_basis_total_cents: 10000000 }, as: DeskAdministrator }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Custodian Prime", source_type: "CUSTODIAN", reliability_weight: 20 }, as: DeskAdministrator, captures: { cust_id: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DeskAdministrator }
            - { call: "POST /api/events/${ev_id}/capture-record-position", payload: {}, as: OperationsManager }
            - { call: "POST /api/events/${ev_id}/book", payload: {}, as: OperationsManager }
            - { call: "POST /api/custodian-statements", payload: { source_id: "${cust_id}", coverage_start_date: "2026-05-16", coverage_end_date: "2026-05-31", lines: [{ account_id: "${a1}", security_id: "${sec_id}", event_id: "${ev_id}", quantity: 2000, cash_cents: 5000 }] }, as: CustodianFeed, captures: { stmt_id: $.data.id } }
            - { call: "GET /api/recon-breaks?statement_id=${stmt_id}", payload: {}, as: OperationsManager, captures: { brk_id: "$.data[0].id", brk_type: "$.data[0].break_type"} }
          trigger:
            - { call: "POST /api/events/${ev_id}/complete", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/recon-breaks/${brk_id}/resolve", payload: { resolution: "RESOLVED", resolution_note: "custodian acknowledged fee reclass" }, as: OperationsManager }
            - { call: "POST /api/events/${ev_id}/complete", payload: {}, as: OperationsManager, captures: { ev_status: $.data.status } }
          assert:
            - "First complete: error_id == ERR_OPEN_RECON_BREAKS_EXIST (break type ${brk_type} == CASH_MISMATCH is OPEN and event-linked)"
            - "After resolving break ${brk_id}: event status == COMPLETED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: mandatory_event_half_open_window_adjacency
        grounds:
          - validations[priority=9]
          - errors[ERR_EVENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the Security resource: mandatory event
          windows [record_date, payable_date) may TOUCH (EV2 record 2026-05-29
          == EV1 payable 2026-05-29 is accepted) but a true overlap
          (EV3 record 2026-05-20 < EV1 payable) is rejected.
        test_recipe:
          setup:
            - "ACME security; two vendor sources; EV1 SPLIT window [2026-05-15, 2026-05-29) created"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSP001501", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1a: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1b: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1a}", "${n1b}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev1: $.data.id }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "STOCK_DIVIDEND", record_date: "2026-05-29", announced_terms: { ratio_num: 11, ratio_den: 10, price_per_share_cents: 1000, fractional_policy: "ROUND_DOWN" } }, as: VendorFeed, captures: { n2a: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "STOCK_DIVIDEND", record_date: "2026-05-29", announced_terms: { ratio_num: 11, ratio_den: 10, price_per_share_cents: 1000, fractional_policy: "ROUND_DOWN" } }, as: VendorFeed, captures: { n2b: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-20", announced_terms: { ratio_num: 3, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n3a: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-20", announced_terms: { ratio_num: 3, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n3b: $.data.id } }
          trigger:
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "STOCK_DIVIDEND", terms: { ratio_num: 11, ratio_den: 10, price_per_share_cents: 1000, fractional_policy: "ROUND_DOWN" }, record_date: "2026-05-29", payable_date: "2026-06-05", source_notification_ids: ["${n2a}", "${n2b}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev2: $.data.id }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 3, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-20", payable_date: "2026-06-02", source_notification_ids: ["${n3a}", "${n3b}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent window accepted: EV2 (record == EV1.payable == 2026-05-29) created with id ${ev2} (half-open semantics)"
            - "Overlapping window rejected: error_id == ERR_EVENT_WINDOW_OVERLAP for EV3 [2026-05-20, 2026-06-02)"

      - name: statement_coverage_closed_interval_shared_day
        grounds:
          - validations[priority=9]
          - errors[ERR_STATEMENT_COVERAGE_OVERLAP]
        distinguishing_aspect: |
          Different resource (EventSource) and different interval semantics
          (CLOSED intervals): statements [2026-05-01, 2026-05-31] and
          [2026-05-31, 2026-06-15] share the single day 2026-05-31 and CONFLICT,
          whereas [2026-06-01, ...] is accepted — adjacency that the half-open
          event-window rule would permit is a conflict here.
        test_recipe:
          setup:
            - "CUSTODIAN source; statement S1 covering [2026-05-01, 2026-05-31] ingested"
          setup_api_calls:
            - { call: "POST /api/event-sources", payload: { name: "Custodian Prime", source_type: "CUSTODIAN", reliability_weight: 20 }, as: DeskAdministrator, captures: { cust_id: $.data.id } }
            - { call: "POST /api/custodian-statements", payload: { source_id: "${cust_id}", coverage_start_date: "2026-05-01", coverage_end_date: "2026-05-31", lines: [] }, as: CustodianFeed, captures: { st1: $.data.id } }
          trigger:
            - { call: "POST /api/custodian-statements", payload: { source_id: "${cust_id}", coverage_start_date: "2026-05-31", coverage_end_date: "2026-06-15", lines: [] }, as: CustodianFeed, captures: { err: $.data.error_id } }
            - { call: "POST /api/custodian-statements", payload: { source_id: "${cust_id}", coverage_start_date: "2026-06-01", coverage_end_date: "2026-06-15", lines: [] }, as: CustodianFeed, captures: { st3: $.data.id, st3_status: $.data.status } }
          assert:
            - "Shared-day statement rejected: error_id == ERR_STATEMENT_COVERAGE_OVERLAP (closed intervals share 2026-05-31)"
            - "Day-after statement accepted: ${st3} created with status == RECONCILED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: split_booking_reversal_restores_shares_and_basis
        grounds:
          - state_machines.CorporateActionEvent.BOOKED_to_CONFIRMED
          - calculations.split_cost_basis_adjustment
          - state_machines.Booking.POSTED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantities: total share quantity and total cost basis.
          book (2:1 split: 1250 -> 2500 shares) followed by reverse MUST restore
          SUM(quantity) == 1250 and SUM(cost_basis_total_cents) == 12500000
          exactly, using BookingLine prior_* values rather than recomputation.
        test_recipe:
          setup:
            - "ACME; account A1 (opening cash 50000) with lots 1000 sh (basis 10000000) and 250 sh (basis 2500000), both acq <= 2026-04-02"
            - "SPLIT 2:1 event CONFIRMED + captured at 2026-05-15"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSP001601", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One", opening_cash_cents: 50000 }, as: DeskAdministrator, captures: { a1: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 1000, acquisition_date: "2026-04-01", cost_basis_total_cents: 10000000 }, as: DeskAdministrator, captures: { l1: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 250, acquisition_date: "2026-04-02", cost_basis_total_cents: 2500000 }, as: DeskAdministrator, captures: { l2: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DeskAdministrator }
            - { call: "POST /api/events/${ev_id}/capture-record-position", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /api/events/${ev_id}/book", payload: {}, as: OperationsManager, captures: { bk_id: $.data.id, bk_sh: $.data.total_whole_shares_credited } }
            - { call: "GET /api/position-lots/${l1}", payload: {}, as: OperationsManager, captures: { l1_post: $.data.quantity } }
            - { call: "POST /api/bookings/${bk_id}/reverse", payload: {}, as: OperationsManager, captures: { bk_status: $.data.status } }
            - { call: "GET /api/position-lots/${l1}", payload: {}, as: OperationsManager, captures: { l1_qty: $.data.quantity, l1_basis: $.data.cost_basis_total_cents } }
            - { call: "GET /api/position-lots/${l2}", payload: {}, as: OperationsManager, captures: { l2_qty: $.data.quantity, l2_basis: $.data.cost_basis_total_cents } }
            - { call: "GET /api/accounts/${a1}", payload: {}, as: OperationsManager, captures: { a1_cash: $.data.cash_balance_cents, a1_basis: $.data.total_cost_basis_cents } }
            - { call: "GET /api/events/${ev_id}", payload: {}, as: OperationsManager, captures: { ev_status: $.data.status } }
          assert:
            - "Forward action booked 2500 whole shares (captured ${bk_sh}); lot L1 was 2000 post-book"
            - "After reverse: L1.quantity == 1000 AND L1.cost_basis_total_cents == 10000000; L2.quantity == 250 AND L2.cost_basis_total_cents == 2500000"
            - "INVARIANT: SUM(quantity) == 1250 and SUM(basis) == 12500000 — identical to pre-booking values"
            - "Account.${a1}.cash_balance_cents == 50000 (unchanged); event back to CONFIRMED; booking REVERSED"

      - name: dividend_booking_reversal_restores_cash
        grounds:
          - state_machines.CorporateActionEvent.BOOKED_to_CONFIRMED
          - calculations.account_derived_balances
          - state_machines.Booking.POSTED_to_REVERSED
        distinguishing_aspect: |
          Different conserved quantity than shares/basis: ACCOUNT CASH. A
          CASH_DIVIDEND booking credits 250000 cents (250 x 1000 settled
          shares); the compensating reversal MUST return cash_balance_cents to
          exactly the opening 50000 — net cash drift == 0.
        test_recipe:
          setup:
            - "ACME; account A1 (opening cash 50000) with 1000 sh lot acq 2026-04-01"
            - "CASH_DIVIDEND event 250 cps, CONFIRMED + captured at 2026-05-15 (FIRM cash_amount_cents == 250000)"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSP001701", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One", opening_cash_cents: 50000 }, as: DeskAdministrator, captures: { a1: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 1000, acquisition_date: "2026-04-01", cost_basis_total_cents: 10000000 }, as: DeskAdministrator }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "CASH_DIVIDEND", record_date: "2026-05-15", announced_terms: { cash_per_share_cents: 250 } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "CASH_DIVIDEND", record_date: "2026-05-15", announced_terms: { cash_per_share_cents: 250 } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "CASH_DIVIDEND", terms: { cash_per_share_cents: 250 }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DeskAdministrator }
            - { call: "POST /api/events/${ev_id}/capture-record-position", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /api/events/${ev_id}/book", payload: {}, as: OperationsManager, captures: { bk_id: $.data.id, bk_cash: $.data.total_cash_credited_cents } }
            - { call: "GET /api/accounts/${a1}", payload: {}, as: OperationsManager, captures: { cash_post: $.data.cash_balance_cents } }
            - { call: "POST /api/bookings/${bk_id}/reverse", payload: {}, as: OperationsManager }
            - { call: "GET /api/accounts/${a1}", payload: {}, as: OperationsManager, captures: { cash_final: $.data.cash_balance_cents } }
            - { call: "GET /api/entitlements?event_id=${ev_id}&account_id=${a1}", payload: {}, as: OperationsManager, captures: { ent_status: "$.data[0].status"} }
          assert:
            - "Forward booking: Booking.total_cash_credited_cents == 250000; Account cash was 300000 post-book (captured ${cash_post})"
            - "INVARIANT: after reverse, Account.${a1}.cash_balance_cents == 50000 — net cash drift == 0 across book + reverse"
            - "Entitlement reverted to FIRM (captured ${ent_status}); event CONFIRMED; booking REVERSED"
