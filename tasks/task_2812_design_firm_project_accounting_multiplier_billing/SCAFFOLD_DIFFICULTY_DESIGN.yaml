            - "the 2025 row certifies successfully with provisional_overhead_rate 1.5000 and final_overhead_rate 1.4500, yet attempt 2 still returns 409 ERR_OVERHEAD_RATE_NOT_CERTIFIED — the year must match the logical clock's calendar year"
            - "OverheadRateCertification.${cert_a} is created with provisional_overhead_rate 1.6500 (annualization cancels out) and final_overhead_rate null, and attempt 3 still returns 409 ERR_OVERHEAD_RATE_NOT_CERTIFIED because SUBMITTED is not CERTIFIED"
            - "the second 2026 submission while ${cert_a} is SUBMITTED returns 409 ERR_CERTIFICATION_YEAR_DUPLICATE"
            - "return-findings moves ${cert_a} to REJECTED with findings recorded and final_overhead_rate still null; attempt 4 returns 409 ERR_OVERHEAD_RATE_NOT_CERTIFIED"
            - "${cert_b} is accepted for 2026 precisely because the incumbent row is REJECTED and no longer occupies the year"
            - "after ${cert_b} certifies: final_overhead_rate == 1.5750, certified_multiplier_ceiling == 2.8325, Project.${p_pub}.billing_posture == OPEN and Project.${p_pub}.certified_multiplier_ceiling == 2.8325"
            - "attempt 5 returns 201 with labor_billed 1562.50, gross_billed 1562.50, retainage_amount 78.13 and net_due 1484.37"
            - "exactly one Invoice row exists for Project.${p_pub} after the whole sequence"

  - rule_id: resource_temporal_overlap
    instances:
      - name: labor_rate_half_open_window_adjacency_versus_overlap
        grounds:
          - validations[priority=56]
          - calculations.effective_rate_lookup
          - endpoints.POST_labor_rates
          - entities.LaborRate.fields.effective_to
        distinguishing_aspect: |
          LaborRate windows are half-open [effective_from, effective_to), so two windows sharing
          a single date are adjacent, not overlapping, and the shared date belongs to the LATER
          window. The same calendar boundary therefore accepts an insert and resolves a charge
          dated on it to the new rate, while a window that straddles the boundary is refused —
          and the whole rule is scoped per role_code, so an identical straddling window for a
          different role is legal.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z"
            - "private client; project activated with multiplier 3.0500 effective 2026-01-01"
            - "DESIGNER rate 45.00 over [2026-01-01, 2026-04-01) and DESIGNER rate 48.00 over [2026-04-01, open)"
            - "two DESIGNER timesheet lines of 8.00 h, one dated 2026-03-31 and one dated 2026-04-01, straddling the boundary"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /clients"
              payload: { name: "Northside Development", is_public_agency: false, retainage_pct: 0.0500, expense_markup_pct: 0.1000, disallowed_categories: ["ENTERTAINMENT"], receipt_required_above: 75.00, review_cycle_days: 30 }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /labor-rates"
              payload: { role_code: "DESIGNER", raw_cost_rate: 45.00, effective_from: "2026-01-01", effective_to: "2026-04-01" }
              as: Controller
              captures: { lr_early: $.data.id }
            - call: "POST /labor-rates"
              payload: { role_code: "DESIGNER", raw_cost_rate: 48.00, effective_from: "2026-04-01" }
              as: Controller
              captures: { lr_late: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl_id}", name: "Riverside Library", contract_type: "TIME_AND_MATERIALS", contract_amount: 800000.00, project_manager_user_id: "pm-001", percent_complete_method: "EFFORT_BASED", target_multiplier: 3.0000 }
              as: Controller
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /phases"
              payload: { project_id: "${p_id}", wbs_code: "02-DD", fee_basis: "LUMP_SUM", lump_sum_fee: 200000.00, budget_labor_cost: 60000.00, consultant_budget: 0.00 }
              as: Controller
              captures: { ph_id: $.data.id }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_id}", multiplier: 3.0500, effective_from: "2026-01-01", expected_project_version: "${p_v0}" }
              as: Controller
            - call: "POST /projects/${p_id}/activate"
              payload: {}
              as: Controller
            - call: "POST /time-entries"
              payload: { project_id: "${p_id}", phase_id: "${ph_id}", role_code: "DESIGNER", work_date: "2026-03-31", hours: 8.00 }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { te_before: $.data.id }
            - call: "POST /time-entries"
              payload: { project_id: "${p_id}", phase_id: "${ph_id}", role_code: "DESIGNER", work_date: "2026-04-01", hours: 8.00 }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { te_on: $.data.id }
          trigger:
            - call: "POST /labor-rates"
              payload: { role_code: "DESIGNER", raw_cost_rate: 50.00, effective_from: "2026-03-01", effective_to: "2026-05-01" }
              as: Controller
            - call: "POST /labor-rates"
              payload: { role_code: "DESIGNER", raw_cost_rate: 52.00, effective_from: "2026-09-01" }
              as: Controller
            - call: "POST /labor-rates"
              payload: { role_code: "PROJECT_ARCHITECT", raw_cost_rate: 62.50, effective_from: "2026-03-01", effective_to: "2026-05-01" }
              as: Controller
            - call: "GET /labor-rates"
              payload: { role_code: "DESIGNER", effective_on: "2026-03-31" }
              as: Controller
            - call: "GET /labor-rates"
              payload: { role_code: "DESIGNER", effective_on: "2026-04-01" }
              as: Controller
            - call: "POST /time-entries/${te_before}/approve"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "POST /time-entries/${te_on}/approve"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
          assert:
            - "the two adjacent DESIGNER windows both persisted: ${lr_early} covers [2026-01-01, 2026-04-01) and ${lr_late} covers [2026-04-01, null)"
            - "the straddling DESIGNER window [2026-03-01, 2026-05-01) returns 409 ERR_RATE_PERIOD_OVERLAP and creates nothing"
            - "the DESIGNER window [2026-09-01, open) also returns 409 ERR_RATE_PERIOD_OVERLAP because the incumbent open-ended window has no end date to be adjacent to"
            - "the identical straddling window for PROJECT_ARCHITECT returns 201 — the overlap rule is scoped per role_code"
            - "GET /labor-rates with effective_on 2026-03-31 resolves raw_cost_rate 45.00 and with effective_on 2026-04-01 resolves 48.00, so the shared boundary date belongs to the later window"
            - "TimeEntry.${te_before}: raw_cost == 360.00, applied_multiplier == 3.0500, billable_amount == 1098.00"
            - "TimeEntry.${te_on}: raw_cost == 384.00, applied_multiplier == 3.0500, billable_amount == 1171.20"
            - "Project.${p_id}.raw_labor_cost_to_date == 744.00, unbilled_wip == 2269.20, net_multiplier_achieved == 3.0500"

      - name: consultant_commitment_closed_window_aggregate_capacity
        grounds:
          - validations[priority=80]
          - calculations.subcontract_commitment_rollup
          - entities.ConsultantSubcontract.fields.commitment_end
          - state_machines.ConsultantSubcontract.DRAFT_to_EXECUTED
        distinguishing_aspect: |
          Subcontract commitment windows are CLOSED intervals, the mirror image of the labor-rate
          rule: two subcontracts that merely touch on one date DO overlap and their commitments
          are summed against Phase.consultant_budget. Each subcontract is individually within
          budget and the cap is only breached collectively, exactly at the touching date, while a
          window that starts one day later intersects only one incumbent and executes even though
          its own amount is far larger than the refused one.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z"
            - "private client; project activated; phase with consultant_budget exactly 100000.00 and no labor charges, so billing_posture stays OPEN"
            - "four DRAFT subcontracts: A 60000.00 [2026-04-01, 2026-06-30]; B 40000.00 [2026-06-30, 2026-09-30]; C 1.00 [2026-06-30, 2026-07-01]; D 50000.00 [2026-07-01, 2026-08-01]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /clients"
              payload: { name: "Northside Development", is_public_agency: false, retainage_pct: 0.0500, expense_markup_pct: 0.1000, disallowed_categories: ["ENTERTAINMENT"], receipt_required_above: 75.00, review_cycle_days: 30 }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl_id}", name: "Lakeshore Pavilion", contract_type: "TIME_AND_MATERIALS", contract_amount: 800000.00, project_manager_user_id: "pm-001", percent_complete_method: "EFFORT_BASED", target_multiplier: 3.0000 }
              as: Controller
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /phases"
              payload: { project_id: "${p_id}", wbs_code: "02-DD", fee_basis: "LUMP_SUM", lump_sum_fee: 200000.00, budget_labor_cost: 60000.00, consultant_budget: 100000.00 }
              as: Controller
              captures: { ph_id: $.data.id }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_id}", multiplier: 3.0500, effective_from: "2026-01-01", expected_project_version: "${p_v0}" }
              as: Controller
            - call: "POST /projects/${p_id}/activate"
              payload: {}
              as: Controller
            - call: "POST /consultant-subcontracts"
              payload: { project_id: "${p_id}", phase_id: "${ph_id}", consultant_name: "Halcyon MEP", committed_amount: 60000.00, pay_when_paid: false, commitment_start: "2026-04-01", commitment_end: "2026-06-30" }
              as: Controller
              captures: { sc_a: $.data.id }
            - call: "POST /consultant-subcontracts"
              payload: { project_id: "${p_id}", phase_id: "${ph_id}", consultant_name: "Cedar Structural", committed_amount: 40000.00, pay_when_paid: false, commitment_start: "2026-06-30", commitment_end: "2026-09-30" }
              as: Controller
              captures: { sc_b: $.data.id }
            - call: "POST /consultant-subcontracts"
              payload: { project_id: "${p_id}", phase_id: "${ph_id}", consultant_name: "Verdant Landscape", committed_amount: 1.00, pay_when_paid: false, commitment_start: "2026-06-30", commitment_end: "2026-07-01" }
              as: Controller
              captures: { sc_c: $.data.id }
            - call: "POST /consultant-subcontracts"
              payload: { project_id: "${p_id}", phase_id: "${ph_id}", consultant_name: "Aster Acoustics", committed_amount: 50000.00, pay_when_paid: false, commitment_start: "2026-07-01", commitment_end: "2026-08-01" }
              as: Controller
              captures: { sc_d: $.data.id }
          trigger:
            - call: "POST /consultant-subcontracts/${sc_a}/execute"
              payload: {}
              as: Controller
            - call: "POST /consultant-subcontracts/${sc_b}/execute"
              payload: {}
              as: Controller
            - call: "POST /consultant-subcontracts/${sc_c}/execute"
              payload: {}
              as: Controller
            - call: "POST /consultant-subcontracts/${sc_d}/execute"
              payload: {}
              as: Controller
          assert:
            - "A executes: ConsultantSubcontract.${sc_a}.status == EXECUTED, committed_remaining == 60000.00, Phase.${ph_id}.consultant_committed_open == 60000.00"
            - "B executes on the touching date: exposure over the intersecting window becomes exactly 60000.00 + 40000.00 == 100000.00, equal to consultant_budget, and the <= comparison admits it; Phase.${ph_id}.consultant_committed_open == 100000.00"
            - "C is refused with 409 ERR_CONSULTANT_BUDGET_OVERCOMMIT even though its committed_amount is only 1.00, because [2026-06-30, 2026-07-01] intersects BOTH A (closed end 2026-06-30) and B"
            - "ConsultantSubcontract.${sc_c}.status stays DRAFT and Phase.${ph_id}.consultant_committed_open is still 100000.00 — the refusal consumed no capacity"
            - "D executes despite being 50000 times larger than C: [2026-07-01, 2026-08-01] misses A entirely and intersects only B, so exposure is 40000.00 + 50000.00 == 90000.00"
