            - "after terminate Facility.${fac}.units_available == 1 and units_occupied == 0 (sum == 1)"
            - "the occupy+release pair restored units_available to its pre-occupy value (1)"

      - name: member_balance_conserved_on_issue_then_void
        grounds:
          - calculations.member_account_balance
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOID
          - entities.Member.fields.account_balance_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY (charged_cents / account_balance_cents), different from the unit
          count: issuing an Invoice (total 54000) raises charged_cents to 54000, and voiding it
          restores charged_cents and account_balance_cents to their pre-issue value 0.
        test_recipe:
          setup:
            - "BRONZE member; STANDARD unit rate 50000; agreement created; a DRAFT invoice (total 54000)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault O", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "O1", unit_class: "STANDARD", monthly_rate_cents: 50000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Inv2 M", email: "inv2@x.com", membership_tier: "BRONZE" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "Mitsubishi", model: "Evo", model_year: 2015, vin: "VIN-IN2", fuel_type: "ICE", declared_value_cents: 3000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
            - { call: "POST /invoices/generate", payload: { member_id: "${mem}", agreement_id: "${agr}", period_start_at: "2026-06-01T00:00:00Z", period_end_at: "2026-07-01T00:00:00Z" }, as: BillingAdmin, captures: { inv: $.data.id } }
          trigger:
            - { call: "GET /members/${mem}", payload: {}, as: BillingAdmin, captures: { cb0: $.data.charged_cents, bal0: $.data.account_balance_cents } }
            - { call: "POST /invoices/${inv}/issue", payload: {}, as: BillingAdmin }
            - { call: "GET /members/${mem}", payload: {}, as: BillingAdmin, captures: { cb1: $.data.charged_cents, bal1: $.data.account_balance_cents } }
            - { call: "POST /invoices/${inv}/void", payload: {}, as: BillingAdmin }
            - { call: "GET /members/${mem}", payload: {}, as: BillingAdmin, captures: { cb2: $.data.charged_cents, bal2: $.data.account_balance_cents } }
          assert:
            - "Invoice.${inv}.total_cents == 54000"
            - "after issue Member.${mem}.charged_cents == 54000 and account_balance_cents == 54000"
            - "after void Member.${mem}.charged_cents == 0 and account_balance_cents == 0 (restored to pre-issue)"


