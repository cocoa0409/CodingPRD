  - section: errors
    instances:
      - name: unauthenticated_request_without_valid_identity_headers_is_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - roles
        distinguishing_aspect: |
          Authentication is the very first gate: a request with no identity headers, one with a
          declared role but an empty X-User-ID, and one naming a role outside the five declared roles
          must all return 401 ERR_UNAUTHENTICATED - never 403 ERR_UNAUTHORIZED and never the 404 the
          addressed resource would produce if it did not exist.
        test_recipe:
          setup:
            - "One Buyer row exists so the addressed path parameter resolves and the outcome can only come from the identity gate"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Auth Gate Buyer", tax_id: "337778889", credit_limit_cents: 100000000, self_funding_enabled: true }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
          trigger:
            - call: "GET /buyers/${buyer_id}"
              payload: {}
              as: "no identity headers at all - X-User-Role and X-User-ID both omitted"
              captures: { err_no_headers: "$.data.error_id" }
            - call: "GET /buyers/${buyer_id}"
              payload: {}
              as: "X-User-Role BuyerAdmin with an empty X-User-ID header"
              captures: { err_empty_id: "$.data.error_id" }
            - call: "GET /buyers/${buyer_id}"
              payload: {}
              as: "X-User-Role Auditor - a role outside {BuyerAdmin, BuyerTreasury, Supplier, Funder, PlatformOps} - with X-User-ID set to the buyer"
              captures: { err_unknown_role: "$.data.error_id" }
          assert:
            - "err_no_headers == ERR_UNAUTHENTICATED with HTTP 401"
            - "err_empty_id == ERR_UNAUTHENTICATED with HTTP 401 (a present role does not compensate for a missing subject)"
            - "err_unknown_role == ERR_UNAUTHENTICATED with HTTP 401, not ERR_UNAUTHORIZED 403 - an unrecognised role fails authentication, not authorisation"
            - "the Buyer row is untouched: a subsequent GET /buyers/${buyer_id} as PlatformOps returns status ACTIVE and the same version"

      - name: invalid_request_shape_is_rejected_before_any_lookup
        claim_type: error_triggerable
        grounds:
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
          - entities.Buyer.fields.tax_id
          - entities.BuyerProgram.fields.max_acceptable_apr_bps
          - entities.AuctionSession
        distinguishing_aspect: |
          Shape validation runs before any database lookup, so a session request whose window is
          inverted AND whose program_id does not exist reports 400 ERR_INVALID_REQUEST rather than
          the 404 the unresolvable foreign key would otherwise produce. The same 400 covers a
          malformed tax_id (5 digits where exactly 9 are declared), an out-of-range
          max_acceptable_apr_bps (100 against the declared 200..5000) and an enum value outside
          program_type.
        test_recipe:
          setup:
            - "One Buyer with one DRAFT programme so the valid parts of each request body resolve"
            - "The sentinel id 00000000-0000-0000-0000-000000009999 is never created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
