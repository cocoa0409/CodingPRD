            - "de-escalation restores nothing: PlaylistItem.${it1_id} is still TRUNCATED and items 2 and 3 are still PREEMPTED with the credit intact"
            - "the re-escalation to CUT_IN succeeds (the cycle repeats), re-runs hops 2-5 and now also PREEMPTS item 4 whose window lies inside [12:31:00, 12:36:00): preempted_item_count == 3"
            - "the release succeeds at dwell 120 s from the original activated_utc: state == RELEASED, released_utc == 2026-08-01T12:31:00Z, active_mode is null, air_status == ON_AIR, posture recomputes to NORMAL"
            - "COMPENSATION semantics: the release does not reverse the credits — the PREEMPTED-filtered listing returns total_count 3 and credit_accrued_cents is unchanged"

      - name: fault_escalation_dwell_and_minor_auto_clear_boundaries
        claim_type: Valid Transition
        grounds: "§1.2 TechnicalFault DETECTED -> ACKNOWLEDGED -> ESCALATED (FAULT_ESCALATION_SECONDS 120, inclusive), DETECTED -> AUTO_CLEARED (MINOR only, never acknowledged, FAULT_AUTO_CLEAR_SECONDS 900); §1.3 fault_severity_derivation (FAULT_SEVERITY map, one-step raise at duration >= 120 or on ESCALATED); §1.4 priority 47 ERR_FAULT_ESCALATION_TOO_EARLY"
        distinguishing_aspect: "Both fault clocks are inclusive and independent: escalation is refused at duration 119 and permitted at exactly 120, while a MINOR never-acknowledged fault auto-clears at exactly 900 s and an acknowledged one never does. The derived severity is a function of fault_code plus dwell, so CAPTION_LOSS (MINOR) becomes MAJOR at 120 s without any client input."
        test_recipe:
          setup: "Base graph through ch2. Two faults are raised at 09:00:00Z: CAPTION_LOSS (MINOR) on ch1, and a second CAPTION_LOSS (MINOR) on ch2 that is never acknowledged."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
            - *ch2
            - call: "POST /technical-faults"
              payload: { fault_code: CAPTION_LOSS, severity: CRITICAL, detected_utc: "2026-08-01T09:00:00Z", channel_id: "${ch1_id}" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { flt_a_id: "$.data.id" }
            - call: "POST /technical-faults"
              payload: { fault_code: CAPTION_LOSS, severity: MINOR, detected_utc: "2026-08-01T09:00:00Z", channel_id: "${ch2_id}" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { flt_b_id: "$.data.id" }
          trigger:
            - call: "POST /technical-faults/${flt_a_id}/state"
              payload: { target_state: ACKNOWLEDGED }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:01:59Z" }
              as: StationAdmin
            - call: "POST /technical-faults/${flt_a_id}/state"
              payload: { target_state: ESCALATED }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_too_early: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:02:00Z" }
              as: StationAdmin
            - call: "POST /technical-faults/${flt_a_id}/state"
              payload: { target_state: ESCALATED }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:14:59Z" }
              as: StationAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:15:00Z" }
              as: StationAdmin
            - call: "POST /technical-faults/${flt_a_id}/state"
              payload: { target_state: MITIGATED, mitigation_code: "CAPTION_ENCODER_RESET" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "POST /technical-faults/${flt_a_id}/state"
              payload: { target_state: RESOLVED, cleared_utc: "2026-08-01T09:15:00Z" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
          assert:
            - "both faults are created with severity == MINOR: FAULT_SEVERITY[CAPTION_LOSS] wins and the client-sent CRITICAL on ${flt_a_id} is ignored (severity is a derived field)"
            - "${e_too_early} == ERR_FAULT_ESCALATION_TOO_EARLY with status 409 at duration_seconds 119"
            - "at exactly duration_seconds 120 the escalation succeeds: TechnicalFault.${flt_a_id}.state == ESCALATED and severity == MAJOR (one step up from MINOR)"
            - "while ${flt_a_id} is MAJOR and open, Channel.${ch1_id}.posture is NORMAL — channel_posture clause 4 needs major_count >= 2, so a single MAJOR does not degrade"
            - "at 09:14:59 (899 s) TechnicalFault.${flt_b_id}.state is still DETECTED; at exactly 09:15:00 (900 s) it is AUTO_CLEARED with cleared_utc == 2026-08-01T09:15:00Z"
            - "${flt_a_id} does NOT auto-clear at 900 s — it was acknowledged, and its severity is no longer MINOR"
            - "the MITIGATED transition requires mitigation_code and the RESOLVED transition writes cleared_utc; after MITIGATED the fault leaves the open set so Channel.${ch1_id}.open_major_fault_count == 0"
            - "TechnicalFault.${flt_b_id}.duration_seconds == 900 and severity == MINOR the whole time — the one-step raise happens on the ESCALATED edge only, which is why the MINOR auto-clear path stays reachable at 900 s"

