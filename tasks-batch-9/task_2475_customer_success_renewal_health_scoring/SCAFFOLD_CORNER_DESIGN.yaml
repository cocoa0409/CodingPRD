            - "Csm.${csm_lt_id}.capacity_units_committed == 0 and capacity_units_available == 40."
            - "GET /coverage-assignments?account_id=${acct_id} returns 0 items."

      - name: lowering_csm_capacity_below_committed_returns_capacity_exhausted
        claim_type: error_triggerability
        grounds:
          - errors.ERR_CSM_CAPACITY_EXHAUSTED
          - validations[priority=31]
          - calculations.csm_capacity_conservation
        distinguishing_aspect: "With 19 units COMMITTED, PATCH /csms/{id} to capacity_units_total 16 returns ERR_CSM_CAPACITY_EXHAUSTED (409); the same PATCH to exactly 19 succeeds and drives capacity_units_available to 0."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account with no signals (health_tier RED), segmented to HIGH_TOUCH, with one COMMITTED CoverageAssignment of 19 load_units."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/segmentation"
              payload: {}
              as: CsOpsAdmin
              captures: { acct_v_seg: $.data.version }
            - call: "POST /coverage-assignments"
              payload: { account_id: "${acct_id}", expected_account_version: "${acct_v_seg}", csm_id: "${csm_a_id}" }
              as: CsOpsAdmin
              captures: { ca1_id: $.data.id }
          trigger:
            - call: "PATCH /csms/${csm_a_id}"
              payload: { capacity_units_total: 16 }
              as: CsOpsAdmin
              captures: { err_id: $.data.error_id }
            - call: "PATCH /csms/${csm_a_id}"
              payload: { capacity_units_total: 19 }
              as: CsOpsAdmin
          assert:
            - "The first trigger call returns HTTP 409 with data.error_id == \"ERR_CSM_CAPACITY_EXHAUSTED\"."
            - "After the first call Csm.${csm_a_id}.capacity_units_total == 40 (rejected write) and capacity_units_committed == 19."
            - "The second trigger call returns HTTP 200: capacity_units_total == 19, capacity_units_committed == 19, capacity_units_available == 0."
            - "CoverageAssignment.${ca1_id}.state == \"COMMITTED\" and load_units == 19 throughout."

      - name: save_play_with_inverted_window_returns_invalid_engagement_interval
        claim_type: error_triggerability
        grounds:
          - errors.ERR_INVALID_ENGAGEMENT_INTERVAL
          - validations[priority=6]
        distinguishing_aspect: "window_end_date 2026-08-05 before window_start_date 2026-08-20 returns ERR_INVALID_ENGAGEMENT_INTERVAL (400) on POST /save-plays, the same rule that guards engagement and contract intervals."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40 and one ENTERPRISE Account."
