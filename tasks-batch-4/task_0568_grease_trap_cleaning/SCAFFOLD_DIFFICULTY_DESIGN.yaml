          trigger:
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T20:00:00Z", planned_end: "2026-05-10T22:00:00Z" }
              as: Dispatcher
