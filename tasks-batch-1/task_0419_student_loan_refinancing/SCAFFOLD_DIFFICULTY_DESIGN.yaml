            - call: "POST /offers/${offer17_id}/lock"
              payload: { expected_application_version: "${app17_ver}", autopay_elected: true }
              as: Borrower
              as_user_id: "${b17_id}"
            - call: "POST /applications/${app17_id}/approve"
              payload: {}
              as: Underwriter
