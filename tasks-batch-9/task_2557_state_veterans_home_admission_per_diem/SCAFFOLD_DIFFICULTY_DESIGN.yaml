      - name: survey_score_24_conditional_versus_25_decertified
        grounds:
          - calculations.survey_compliance_score
          - state_machines.CareUnit.CERTIFIED_to_CONDITIONAL
          - state_machines.CareUnit.CONDITIONAL_to_DECERTIFIED
          - calculations.care_unit_operational_posture
          - entities.VeteransHome.fields.recognition_status
        distinguishing_aspect: |
          CERTIFICATION_DECERTIFY_THRESHOLD is 25 with an inclusive lower edge, so a survey scoring
          exactly 24 lands CONDITIONAL / RESTRICTED with the home still RECOGNIZED, while adding a
          single ISOLATED+MINIMAL deficiency worth 1 point reaches exactly 25 and lands DECERTIFIED
          / FROZEN with the home SUSPENDED. The two surveys differ by one point and by three
          observable fields on two entities.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with decertified_unit_count 0 and one CERTIFIED NURSING CareUnit."
            - "No residents, so bed counts cannot influence posture."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Two Harbors State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 4, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
          trigger:
            - call: "POST /svh/care-units/${nu_id}/survey-result"
              payload: { survey_date: "2026-09-01", deficiencies: [{ scope: "ISOLATED", severity: "ACTUAL_HARM" }, { scope: "WIDESPREAD", severity: "MINIMAL_HARM" }, { scope: "PATTERN", severity: "MINIMAL" }, { scope: "PATTERN", severity: "MINIMAL" }] }
              as: SurveyAgency
              captures: { score_24: "$.data.last_survey_compliance_score", status_24: "$.data.certification_status", posture_24: "$.data.operational_posture" }
            - call: "GET /svh/veterans-homes/${home_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { home_status_24: "$.data.recognition_status" }
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/care-units/${nu_id}/survey-result"
              payload: { survey_date: "2026-09-02", deficiencies: [{ scope: "ISOLATED", severity: "ACTUAL_HARM" }, { scope: "WIDESPREAD", severity: "MINIMAL_HARM" }, { scope: "PATTERN", severity: "MINIMAL" }, { scope: "PATTERN", severity: "MINIMAL" }, { scope: "ISOLATED", severity: "MINIMAL" }] }
              as: SurveyAgency
              captures: { score_25: "$.data.last_survey_compliance_score", status_25: "$.data.certification_status", posture_25: "$.data.operational_posture" }
          assert:
            - "score_24 == 24"
            - "status_24 == CONDITIONAL"
            - "posture_24 == RESTRICTED"
            - "home_status_24 == RECOGNIZED"
            - "score_25 == 25"
            - "status_25 == DECERTIFIED"
            - "posture_25 == FROZEN"
            - "VeteransHome.${home_id}.recognition_status == SUSPENDED"
            - "VeteransHome.${home_id}.recognition_suspended_reason == UNIT_DECERTIFIED"
            - "VeteransHome.${home_id}.decertified_unit_count == 1"

