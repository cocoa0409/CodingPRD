  - rule_id: compensating_invariant
    instances:
      - name: overturned_appeal_reverses_points_exactly_without_reviving_suspensions
        grounds:
          - state_machines.MemberComplaint.status.APPEALED_to_OVERTURNED
          - calculations.supplier_performance_score
          - state_machines.Supplier.qualification_status.SUSPENDED_to_QUALIFIED
          - state_machines.MasterContract.status.SUSPENDED_to_ACTIVE
          - validations.priority_10
          - validations.priority_30
          - errors.ERR_CONTRACT_NOT_ACTIVE
          - errors.ERR_PIGGYBACK_NOT_AUTHORIZED
        distinguishing_aspect: |
          OVERTURN must compensate the arithmetic EXACTLY - deduction_points_total back to 20.00,
          substantiated_complaint_count back to 1, performance_score back to 80.00 and tier back to
          STANDARD, with points_reversed true - while deliberately compensating NOTHING downstream: the
          supplier stays SUSPENDED, the contract stays SUSPENDED and the analysis stays VOIDED. The chain
          then walks the two explicit reinstatements and shows the residue: usage is refused with
          ERR_CONTRACT_NOT_ACTIVE first and with ERR_PIGGYBACK_NOT_AUTHORIZED afterwards, because a voided
          authority is never revived. An over-eager compensation that unwinds the whole cascade produces a
          successful usage instead.
        test_recipe:
          setup:
            - "Contract COOP-MC-2026-001 is ACTIVE for Acme with line JAN-DISP-500; member Riverside (CA) is ACTIVE with a DETERMINED analysis."
