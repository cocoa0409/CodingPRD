            - "other-account read: error_id == ERR_FORBIDDEN; HTTP 403"
            - "own-account read succeeds: id == ${a1_id}"

      - name: broker_channel_vote_role_matrix
        claim_type: role_denial
        grounds: ["roles[Broker]", "roles[Shareholder]", "errors[ERR_FORBIDDEN]", entities.VoteInstruction.fields.channel]
        distinguishing_aspect: "Channel-role matrix: Shareholder using channel BROKER is ERR_FORBIDDEN; a Broker casting a BROKER-channel omnibus vote needs no control_number and succeeds."
        test_recipe:
          setup: ["meeting VOTING_OPEN; a1 6000 COMMON; p1 ACTIVE"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Omnibus Co", ticker: "OMN", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Omnibus Acct", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
          trigger:
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "BROKER", choice: "FOR" }
              as: Shareholder
              as_user_id: "${a1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "BROKER", choice: "FOR" }
              as: Broker
              captures: { v_status: $.data.status }
          assert:
            - "Shareholder with channel BROKER: error_id == ERR_FORBIDDEN; HTTP 403"
            - "Broker with channel BROKER and no control_number: status == VALIDATED (control-number exemption)"

  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: meeting_patch_occ_success_then_stale_rejection
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[meeting-amend-stale-version]", "errors[ERR_STALE_VERSION]", "endpoints[PATCH /proxy/meetings/{id}]"]
        distinguishing_aspect: "OCC on Meeting.version: PATCH carrying the observed version succeeds and increments version to 2; replaying the same observed version is then rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["DRAFT meeting, version 1 as observed at creation"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Occ Co", ticker: "OCC", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id, m_v: $.data.version }
          trigger:
            - call: "PATCH /proxy/meetings/${m_id}"
              payload: { quorum_threshold_pct: 0.6, expected_meeting_version: "${m_v}" }
              as: ProxyAdministrator
              captures: { m_v2: $.data.version, m_q: $.data.quorum_threshold_pct }
            - call: "PATCH /proxy/meetings/${m_id}"
              payload: { outstanding_shares: 12000, expected_meeting_version: "${m_v}" }
              as: ProxyAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH: quorum_threshold_pct == 0.6 and version == 2 (incremented from 1)"
            - "second PATCH with the stale observed version: error_id == ERR_STALE_VERSION; HTTP 412"
            - "GET /proxy/meetings/${m_id} shows outstanding_shares still == 10000 (rejected write applied nothing)"

      - name: certification_sign_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[certification-sign-stale-version]", "errors[ERR_STALE_VERSION]", "endpoints[POST /proxy/inspector-certifications/{id}/sign]"]
        distinguishing_aspect: "OCC on the sign endpoint: expected_meeting_version one behind the current Meeting.version is rejected with ERR_STALE_VERSION even when every other precondition (DRAFT, no OPEN challenges, SoD) passes."
        test_recipe:
          setup: ["meeting MEETING_HELD with quorum met; DRAFT certification created by insp-1; signer insp-2"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Stale Co", ticker: "STL", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
            - call: "POST /proxy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T16:00:00Z" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/convene"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/conclude"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/inspector-certifications"
              payload: { meeting_id: "${m_id}" }
              as: InspectorOfElection
              as_user_id: "insp-1"
              captures: { cert_id: $.data.id }
            - call: "GET /proxy/meetings/${m_id}"
              as: InspectorOfElection
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /proxy/inspector-certifications/${cert_id}/sign"
              payload: { expected_meeting_version: "${m_v} - 1" }
              as: InspectorOfElection
              as_user_id: "insp-2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION; HTTP 412"
            - "GET /proxy/inspector-certifications/${cert_id} still shows status == DRAFT"
            - "GET /proxy/meetings/${m_id} still shows status == MEETING_HELD"

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds: [calculations.quorum_calculation, calculations.weighted_tabulation]
        excluded_because:
          difficulty_instance: quorum_provisional_includes_open_challenged_final_excludes
          rationale: "Both variants of both calculations are exercised with pinned literals by the two §1.8 dual_variant_calc instances."

      - name: scheduled_actions_layer
        claim_type: scheduled_actions
        grounds: [entities.MeetingPlatformSession, entities.SolicitationCampaign]
        excluded_because:
          difficulty_instance: platform_session_half_open_overlap_adjacency_allowed
          rationale: "Future-window booking, window validity, and cancellation-free immutability of scheduled sessions/campaigns are exercised by the two §1.8 resource_temporal_overlap instances plus §1.9 window-validation instances."

      - name: derived_field_reconciliation_layer
        claim_type: derived_field_reconciliation
        grounds: [calculations.quorum_calculation, calculations.weighted_tabulation]
        excluded_because:
          difficulty_instance: vote_revoke_cascade_recomputes_tabulation_and_quorum
          rationale: "Derived shares_present and tabulation totals recomputed on source mutations (create/supersede/revoke/invalidate) are asserted by the §1.8 cascade and compensating-invariant instances."

  # ===========================================================================
  # Section: consistency model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
