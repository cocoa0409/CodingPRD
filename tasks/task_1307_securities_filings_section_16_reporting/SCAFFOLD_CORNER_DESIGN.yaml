        claim_type: priority_ordering
        grounds: ["concurrency_rules[issuer-update-stale-version]", "validations[priority=4]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A PUT carrying the pre-update version is rejected with ERR_STALE_VERSION (412) after a successful PUT advanced Issuer.version to 2 — OCC resolved purely by sequential requests."
        test_recipe:
          setup: ["Issuer I created; its version captured at 1"]
