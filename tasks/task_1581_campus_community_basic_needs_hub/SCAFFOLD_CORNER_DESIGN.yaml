  # ---------------------------------------------------------------------------
  # Section: consistency_model (immediate)
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: writes_visible_in_same_request_and_next_read
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the checkout response itself carries points_spent == 20, and the very next GET /clients reflects pantry_points_spent_settled == 20 with no delay or reconciliation window."
        test_recipe:
          setup: ["ACTIVE client hh=2 (allotment 40); PantryStaff; item cost 20 stock 3; visit with 1 unit"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "P Pa", email: "pantry@hub.test", staff_role: "PANTRY_STAFF" }
              as: HubAdmin
              captures: { ps_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "ic", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 2, monthly_income_cents: 100000, housing_status: "STABLE", dependents_under_18: 1, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 1, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /pantry-items"
              payload: { item_name: "IC", category: "SHELF_STABLE", point_cost: 20, quantity_on_hand: 3, reorder_threshold: 0, per_visit_limit: 2 }
              as: HubAdmin
              captures: { i_id: $.data.id }
            - call: "POST /clients/${c_id}/pantry-visits"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { v_id: $.data.id }
            - call: "POST /pantry-visits/${v_id}/line-items"
              payload: { item_id: "${i_id}", quantity: 1 }
              as: PantryStaff
              as_user_id: "${ps_id}"
          trigger:
            - call: "POST /pantry-visits/${v_id}/checkout"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { spent: $.data.points_spent, st: $.data.status }
            - call: "GET /clients/${c_id}"
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { settled: $.data.pantry_points_spent_settled, reserved: $.data.pantry_points_spent_reserved }
            - call: "GET /pantry-items"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { qoh: "$.data[0].quantity_on_hand" }
          assert:
            - "checkout response: status COMPLETED and points_spent == 20 in the same envelope"
            - "immediate GET: pantry_points_spent_settled == 20 == pantry_points_spent_reserved"
            - "immediate GET: item quantity_on_hand == 2"

      - name: referral_and_screening_not_actionable_batch
        claim_type: invalid_transition
        grounds: ["errors[ERR_REFERRAL_NOT_ACTIONABLE]", "errors[ERR_SCREENING_NOT_ACTIONABLE]", "state_machines.Referral.SENT_to_ACKNOWLEDGED", "state_machines.BenefitsScreening.SCREENED_to_APPLICATION_ASSISTED"]
        distinguishing_aspect: "Two machine-specific state errors: acknowledging an INITIATED (never sent) referral, and assisting a screening whose band came back NOT_ELIGIBLE."
        test_recipe:
          setup:
            - "ACTIVE client with VERIFIED assessment (hh=1, income 400000 -> ratio 3.1873, STABLE, food 0, receives_snap true -> SNAP score 0 NOT_ELIGIBLE)"
            - "IntakeCoordinator, BenefitsCounselor; agency; referral created (INITIATED, never sent); SNAP screening scored"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "B Be", email: "bene@hub.test", staff_role: "BENEFITS_COUNSELOR" }
              as: HubAdmin
              captures: { couns_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "na", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 400000, housing_status: "STABLE", dependents_under_18: 0, receives_snap: true, receives_childcare_subsidy: false, food_insecurity_score: 0, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /partner-agencies"
              payload: { agency_name: "NA Agency", service_categories: ["LEGAL_AID"], weekly_capacity: 3 }
              as: HubAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /clients/${c_id}/referrals"
              payload: { agency_id: "${ag_id}", service_category: "LEGAL_AID" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { r_id: $.data.id }
            - call: "POST /clients/${c_id}/screenings"
              payload: { program: "SNAP" }
              as: BenefitsCounselor
              as_user_id: "${couns_id}"
              captures: { s_id: $.data.id }
            - call: "POST /screenings/${s_id}/score"
              payload: {}
              as: BenefitsCounselor
              as_user_id: "${couns_id}"
              captures: { band: $.data.result_band }
          trigger:
            - call: "POST /referrals/${r_id}/acknowledge"
              payload: {}
              as: PartnerAgencyRep
              as_user_id: "${ag_id}"
              captures: { e_ref: $.data.error_id }
            - call: "POST /screenings/${s_id}/assist"
              payload: {}
              as: BenefitsCounselor
              as_user_id: "${couns_id}"
              captures: { e_scr: $.data.error_id }
          assert:
            - "acknowledge on INITIATED referral -> 409 ERR_REFERRAL_NOT_ACTIONABLE (send never happened)"
            - "screening scored NOT_ELIGIBLE (receives_snap gate -> score 0); assist -> 409 ERR_SCREENING_NOT_ACTIONABLE"

  - section: rbac
    instances:
      - name: pantry_staff_cannot_create_grant_fund_returns_403
        claim_type: rbac_denial
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]", "roles"]
        distinguishing_aspect: "Role-list denial distinct from identity failure: a valid ACTIVE PANTRY_STAFF identity calling POST /grant-funds (HubAdmin-only) gets 403 ERR_FORBIDDEN_ROLE — authentication passed, authorization failed."
        test_recipe:
          setup: ["one ACTIVE PANTRY_STAFF member"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "P Pa", email: "pantry@hub.test", staff_role: "PANTRY_STAFF" }
              as: HubAdmin
              captures: { ps_id: $.data.id }
          trigger:
            - call: "POST /grant-funds"
              payload: { fund_name: "Nope", fiscal_year: 2026, allocated_cents: 1000 }
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { err: $.data.error_id }
          assert:
            - "403 ERR_FORBIDDEN_ROLE (not 401 — the identity itself is valid)"

