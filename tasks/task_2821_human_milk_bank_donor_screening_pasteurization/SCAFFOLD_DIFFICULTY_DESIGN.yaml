            - { call: "POST /milk-bank/pasteurization-runs", payload: { pool_id: "${p}", pasteurizer_id: "PAST-02", scheduled_start_at: "2026-08-10T10:14:00Z", cycle_minutes: 60 }, as: ProcessingTechnician, as_user_id: "u-tech-1", captures: { r2: "$.data.id" } }
            - { call: "POST /milk-bank/pasteurization-runs", payload: { pool_id: "${p}", pasteurizer_id: "PAST-01", scheduled_start_at: "2026-08-10T10:15:00Z", cycle_minutes: 60 }, as: ProcessingTechnician, as_user_id: "u-tech-1", captures: { r3: "$.data.id" } }
          assert:
            - "${err} == ERR_PASTEURIZER_SLOT_CONFLICT and HTTP status == 409 for the 10:14 request on PAST-01 (10:14 < 10:15 = 09:00 + 60 min cycle + 15 min buffer)"
            - "PasteurizationRun.${r2}.pasteurizer_id == PAST-02 and scheduled_start_at == 2026-08-10T10:14:00Z and run_status == SCHEDULED (the same instant is free on a different pasteurizer)"
            - "PasteurizationRun.${r3}.pasteurizer_id == PAST-01 and scheduled_start_at == 2026-08-10T10:15:00Z and run_status == SCHEDULED (the buffer end is an OPEN endpoint)"
            - "PasteurizationRun.${r1}.run_status == SCHEDULED and reading_count == 0 (the refused request left the incumbent untouched)"
            - "GET /milk-bank/pasteurization-runs?pasteurizer_id=PAST-01 returns total_count == 2"
            - "Pool.${p}.status == COMMITTED (scheduling a run does not move the pool; only bottling does)"

      - name: deferral_lookback_closed_closed_window
        grounds:
          - entities.DeferralEvent.fields.lookback_days
          - entities.DeferralEvent.fields.effective_from
          - entities.DeferralEvent.fields.recalled_donation_count
          - state_machines.Donor.QUALIFIED_to_TEMPORARILY_DEFERRED
          - state_machines.Donation.ELIGIBLE_to_RECALLED
          - endpoints[POST /milk-bank/donors/{id}/deferrals]
        distinguishing_aspect: |
          A different interval semantics from the pasteurizer probe: the recall lookback is a
          CLOSED-CLOSED date window [effective_from - lookback_days, effective_from] over
          Donation.expressed_on, not a half-open instant window over a resource timeline. Both
          endpoints are therefore inclusive: a donation expressed exactly on effective_from and
          one expressed exactly lookback_days earlier are BOTH recalled, while the donation one
          day older is untouched — so an off-by-one or half-open reading changes
          recalled_donation_count from 2 to 1 or 3.
        test_recipe:
          setup:
            - "Logical clock is 2026-08-05T08:00:00Z."
            - "Donor DNR-1001 is QUALIFIED with screening_risk_score 50 and no deferrals."
            - "Shipment TRK-1001 is ACCEPTED with three ELIGIBLE donations of 700 ml expressed on 2026-07-05, 2026-06-05 and 2026-06-04; none is pooled."
