  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_locked_review_commitment
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - errors.ERR_INVALID_STATE
          - errors.ERR_SHELF_OVERFLOW
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: a commitment that
          would both violate the review lifecycle (LOCKED) and overflow the
          shelf must fail with ERR_INVALID_STATE, not ERR_SHELF_OVERFLOW.
        test_recipe:
          setup:
            - "Retailer R1, CONFIRMED review LR1 with shelf_slots_total 2; clock advanced past commitment_deadline so lifecycle == LOCKED; evergreen sku SK1."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-01-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Block Bucket", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/retailers"
              payload: { name: "ToyBox", region: "NA" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /toy-licensing/line-reviews"
              payload: { retailer_id: "${r1}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-15T00:00:00Z", commitment_deadline: "2026-10-15T00:00:00Z", shelf_slots_total: 2 }
              as: RetailerOps
              as_user_id: "${r1}"
              captures: { lr1: $.data.id }
            - call: "POST /toy-licensing/line-reviews/${lr1}/approve"
              payload: {}
              as: BrandManager
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toy-licensing/assortment-commitments"
              payload: { line_review_id: "${lr1}", sku_id: "${sk1}", committed_units: 100, unit_price_cents: 500, shelf_slots: 5 }
              as: BrandManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409) — the LOCKED review is reported, not the 5-slot overflow against total 2"
      - name: safety_beats_temporal_on_record_result
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors.ERR_INVALID_STATE
          - errors.ERR_SAFETY_GATE
        distinguishing_aspect: |
          Different error-category pair state vs business_safety: recording a
          result on an already-PASSED SafetyTest while ALSO supplying an
          out-of-range result_age_grade_months must fail with
          ERR_INVALID_STATE (priority 4), not ERR_SAFETY_GATE (priority 5).
        test_recipe:
          setup:
            - "Evergreen line EL, sku SK1 age 48; safety test ST1 already PASSED (terminal)."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-01-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Block Bucket", age_grade_months: 48, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/safety-tests"
              payload: { sku_id: "${sk1}", test_type: "MECHANICAL", lab_name: "LabA", claimed_age_grade_months: 48 }
              as: SafetyEngineer
              captures: { st1: $.data.id }
            - call: "POST /toy-licensing/safety-tests/${st1}/record_result"
              payload: { outcome: "PASS", result_age_grade_months: 48, validated_claims: ["BPA_FREE"] }
              as: SafetyEngineer
          trigger:
            - call: "POST /toy-licensing/safety-tests/${st1}/record_result"
              payload: { outcome: "PASS", result_age_grade_months: 20, validated_claims: ["BPA_FREE"] }
              as: SafetyEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409) — terminal-state violation outranks the out-of-range safety value"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: factory_utilization_tier_boundary_at_exactly_080
        grounds:
          - calculations.factory_capacity_allocation
          - constants.TIER0_UTILIZATION_MAX
        distinguishing_aspect: |
          Numeric threshold boundary on the utilization tier: exactly 0.80
          utilization is tier 0 (no overtime), 0.80+epsilon is tier 1 — a
          >= vs > trap on the factory_capacity_allocation metric, reachable
          through POST /tooling-orders.
        test_recipe:
          setup:
            - "Factory F1 capacity 1000. Sku SK1 moq 1, unit_cost 100c, tooling_cost 10000c."
            - "Existing APPROVED order for 600 units in 2027-01 (month_load 600)."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/factories"
              payload: { name: "F1", capacity_units_per_month: 1000, tooling_lead_weeks: 4 }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-06-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Block Bucket", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 10000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/tooling-orders"
              payload: { toy_line_id: "${el}", sku_id: "${sk1}", factory_id: "${f1}", production_month: "2027-01", units: 600 }
              as: BrandManager
          trigger:
            - call: "POST /toy-licensing/tooling-orders"
              payload: { toy_line_id: "${el}", sku_id: "${sk1}", factory_id: "${f1}", production_month: "2027-01", units: 200 }
              as: BrandManager
              captures: { charge_080: $.data.tooling_charge_cents }
            - call: "POST /toy-licensing/tooling-orders"
              payload: { toy_line_id: "${el}", sku_id: "${sk1}", factory_id: "${f1}", production_month: "2027-01", units: 1 }
              as: BrandManager
              captures: { charge_081: $.data.tooling_charge_cents }
          assert:
            - "First trigger tooling_charge_cents == 30000  # (600+200)/1000 = 0.80 exactly -> tier 0: 10000 + 200*100*1.00"
            - "Second trigger tooling_charge_cents == 10115  # (800+1)/1000 = 0.801 -> tier 1: 10000 + round_half_up(1*100*1.15) = 10000+115"
      - name: closeout_empty_commitment_set_yields_zero_recovery
        grounds:
          - calculations.markdown_recovery
          - entities.ToyLine.fields.closeout_recovery_cents
        distinguishing_aspect: |
          Empty-collection boundary on a different metric and endpoint: a line
          entering closeout with zero commitments yields
          closeout_recovery_cents == 0 (no division by zero in the average
          price step), reachable through POST /toy-lines/{id}/enter_closeout.
        test_recipe:
