  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (≥2 instances, DIFFERENT entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: immunization_record_void_gated_by_registry_submission_state
        grounds:
          - state_machines.ImmunizationRecord.COMPLETED_to_VOIDED
          - state_machines.RegistrySubmission.PENDING_to_SUBMITTED
          - errors[ERR_SUBMISSION_ALREADY_TRANSMITTED]
        distinguishing_aspect: |
          Entity pair ImmunizationRecord → RegistrySubmission: the record's
          COMPLETED → VOIDED transition is permitted while its submission is
          PENDING but forbidden once that submission advances to SUBMITTED —
          the parent entity's valid transition set is decided by the child
          entity's current state.
        test_recipe:
          setup:
            - "Two full administrations at store S (records R1 and R2 for patients P9a and P9b, two separate appointments, each with own submission)"
            - "R1's submission left PENDING; R2's submission advanced to SUBMITTED"
