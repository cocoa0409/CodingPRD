  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_insufficient_allocation_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_ALLOCATION]"]
        excluded_because:
          difficulty_instance: order_quantity_exactly_equals_available
          rationale: "Asserted as the failure path of the named 1.8 boundary instance (0.08 af against 0.00 available)."

      - name: error_window_overlap_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: maintenance_window_half_open_adjacency
          rationale: "The 13:00-15:00 window overlapping window1 is asserted rejected with ERR_WINDOW_OVERLAP in the named 1.8 instance."

      - name: error_turnaround_conflict_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_ORDER_TURNAROUND_CONFLICT]"]
        excluded_because:
          difficulty_instance: account_order_turnaround_buffer
          rationale: "The 5-hour-gap order is asserted rejected with ERR_ORDER_TURNAROUND_CONFLICT in the named 1.8 instance."

      - name: error_window_time_conflict_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: schedule_temporal_beats_capacity
          rationale: "Asserted as the winning error of the named 1.8 priority-conflict instance."

      - name: error_account_not_active_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACCOUNT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: order_create_state_beats_fiscal
          rationale: "Asserted as the winning error of the named 1.8 priority-conflict instance."

      - name: error_transfer_blocked_drought_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRANSFER_BLOCKED_DROUGHT]"]
        excluded_because:
          difficulty_instance: transfer_blocked_by_effective_drought
          rationale: "Asserted as the failure path of the named 1.8 cross-entity instance."

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: role_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without a recognized X-User-Role/X-User-ID pair is rejected with ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /district/water-accounts"
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with http 401"

      - name: wateruser_cannot_create_season_forbidden
        claim_type: role_denial
        grounds: ["validations[priority=3]", roles.DistrictAdmin, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Season administration is DistrictAdmin-exclusive; a WaterUser role is rejected with ERR_FORBIDDEN (403) even with a well-formed body."
        test_recipe:
          setup: ["Account exists so a WaterUser identity is valid"]
          setup_api_calls:
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Role R", parcel_number: "APN-136", irrigated_acres: 5.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id" }
          trigger:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN with http 403; no season persisted"

      - name: wateruser_cannot_pay_others_invoice_forbidden
        claim_type: role_denial
        grounds: ["validations[priority=3]", roles.WaterUser, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Entity-backed ownership: a WaterUser paying an invoice whose water_account_id differs from X-User-ID is rejected with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Season; account A (invoice ISSUED) and account B (the caller)"]
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Owner A", parcel_number: "APN-137", irrigated_acres: 10.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_a: "$.data.id" }
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Caller B", parcel_number: "APN-138", irrigated_acres: 10.0, water_right_priority_date: "1890-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_b: "$.data.id" }
            - call: "POST /district/assessment-invoices"
              payload: { water_account_id: "${acct_a}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { inv_id: "$.data.id" }
            - call: "POST /district/assessment-invoices/${inv_id}/issue"
              payload: { due_date: "2026-08-10T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /district/assessment-invoices/${inv_id}/pay"
              payload: {}
              as: WaterUser
              as_user_id: "${acct_b}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN (403): caller B does not own account A's invoice"
            - "AssessmentInvoice.${inv_id}.status remains ISSUED"

      - name: ditchrider_cannot_verify_own_measurement
        claim_type: role_denial
        grounds: [roles.DitchRider, roles.DistrictAdmin, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Segregation of duties: the rider who submitted a measurement cannot verify it; verification is DistrictAdmin-exclusive and a DitchRider call is rejected with ERR_FORBIDDEN."
        test_recipe:
          setup: ["Season OPEN; account 5 acres; order FLOWING; work order MEASUREMENT_SUBMITTED by rider-1"]
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "SoD S", parcel_number: "APN-139", irrigated_acres: 5.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_id: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach SD", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z", expected_water_account_version: "${acct_v}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /district/turnout-orders/${order_id}/schedule"
              payload: { rider_user_id: "rider-1" }
              as: DistrictAdmin
            - call: "GET /district/rider-work-orders?turnout_order_id=${order_id}"
              as: DistrictAdmin
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/turnout-orders/${order_id}/start"
              payload: {}
              as: DitchRider
              as_user_id: "rider-1"
            - call: "POST /district/rider-work-orders/${wo_id}/submit-measurement"
              payload: { measured_cfs: 5.0, measured_hours: 10.0 }
              as: DitchRider
              as_user_id: "rider-1"
          trigger:
            - call: "POST /district/rider-work-orders/${wo_id}/verify"
              payload: {}
              as: DitchRider
              as_user_id: "rider-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN (403): verify is DistrictAdmin-exclusive"
            - "RiderWorkOrder.${wo_id}.status remains MEASUREMENT_SUBMITTED"

  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_order_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-create-stale-account]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential order creates: the first bumps WaterAccount.version to 2; the second, still carrying the pre-create version 1, is rejected with ERR_STALE_VERSION (412) even though water remains available."
        test_recipe:
          setup: ["Season OPEN announced 2.0; account 10 acres -> entitlement 20.00; reach exists; account version 1 after creation"]
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "OCC O", parcel_number: "APN-140", irrigated_acres: 10.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_id: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach OC", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
          trigger:
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T10:00:00Z", expected_water_account_version: "${acct_v}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { order1_id: "$.data.id" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-06-02T08:00:00Z", requested_end_at: "2026-06-02T10:00:00Z", expected_water_account_version: "${acct_v}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "First create succeeds with expected version ${acct_v} (== 1) and bumps WaterAccount.version to 2"
            - "Second create with the same stale expected version is rejected: error_id == ERR_STALE_VERSION (412)"
            - "Only one order exists for the account afterwards"

      - name: occ_stale_version_on_transfer_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[transfer-create-stale-allocation]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential transfer creates: the first bumps the source SeasonAllocation.version to 2; the second, still carrying version 1, is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Season OPEN; accounts A (5 acres) and B (1 acre) with allocations; source allocation version 1 after creation"]
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "OCC A", parcel_number: "APN-141", irrigated_acres: 5.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_a: "$.data.id" }
            - call: "POST /district/water-accounts"
              payload: { holder_name: "OCC B", parcel_number: "APN-142", irrigated_acres: 1.0, water_right_priority_date: "1890-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_b: "$.data.id" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_a}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_a: "$.data.id", alloc_a_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_b}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_b: "$.data.id" }
          trigger:
            - call: "POST /district/transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", season_id: "${season_id}", quantity_af: 1.0, expected_source_allocation_version: "${alloc_a_v}" }
              as: WaterUser
              as_user_id: "${acct_a}"
              captures: { t1: "$.data.id" }
            - call: "POST /district/transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", season_id: "${season_id}", quantity_af: 1.0, expected_source_allocation_version: "${alloc_a_v}" }
              as: WaterUser
              as_user_id: "${acct_a}"
              captures: { err: "$.data.error_id" }
          assert:
            - "First create succeeds with expected source allocation version ${alloc_a_v} (== 1) and bumps SeasonAllocation.${alloc_a}.version to 2"
            - "Second create with the same stale version is rejected: error_id == ERR_STALE_VERSION (412)"

      - name: derived_fields_reconcile_on_verify_and_cancel
        claim_type: derived_field_reconciliation
        grounds: [calculations.available_balance, entities.SeasonAllocation.fields.committed_af]
        excluded_because:
          difficulty_instance: committed_water_schedule_cancel_conservation
          rationale: "Committed/available reconciliation across create, schedule, and cancel is asserted step-by-step in the named 1.8 instance; the verify-time swap of committed into delivered is asserted in rider_measurement_rework_cycle."

  # ===========================================================================
  # Section: consistency model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_cascade_visibility
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.MaintenanceWindow.PLANNED_to_ACTIVE]
        excluded_because:
          difficulty_instance: maintenance_window_activation_cascade
          rationale: "The activation cascade (reach SHUTDOWN, order CANCELLED, work order CANCELLED, committed released) is asserted visible on immediate follow-up GETs in the named 1.8 instance."
