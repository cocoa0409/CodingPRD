      # SCAFFOLD CONFLICT (reported): §1.7 lists POST /molding-cycles/{id}/abort
      # as a PlantAdmin shared_operation and §1.5 lists roles
      # [MoldingOperator, PlantAdmin], but every SCHEDULED/OVEN_RUNNING/COOLING
      # -> ABORTED transition in §1.2 carries the unconditional precondition
      # "acting X-User-ID == cycle.operator_technician_id ->
      # ERR_ROLE_IDENTITY_MISMATCH", which the opaque audit id admin-1 can never
      # satisfy. This instance therefore exercises the abort under the role that
      # is unambiguously able to perform it and does not claim an outcome for the
      # PlantAdmin leg.
      - name: rbac_positive_matrix_every_role_performs_its_own_and_its_shared_operations
        claim_type: "Can perform all exclusive_operations and shared_operations"
        grounds:
          - roles.PlantAdmin.shared_operations
          - roles.LogisticsPlanner.shared_operations
          - roles.ResinTechnician.shared_operations
          - roles.MoldingOperator.exclusive_operations
          - roles.Customer.shared_operations
        distinguishing_aspect: |
          Each shared operation is exercised by MORE THAN ONE of its declared
          sharers in the same run — customers by LogisticsPlanner and by
          PlantAdmin, an order released by LogisticsPlanner and cancelled by
          PlantAdmin, a resin lot created by ResinTechnician, and storage
          guidance acknowledged once by the Customer itself and once by
          LogisticsPlanner on a different customer — so a permissive-to-one,
          denying-to-the-other implementation fails.
        test_recipe:
          setup:
            - "Reference data only: PM-CD-KM, MLD-CD-1 (AVAILABLE, cycles_since_service 0), OVN-CD-1, BAY-CD-1, Technicians T-CD-RES-1 and T-CD-OPR-1 ACTIVE, WH-CD NORMAL and empty, LOT-CD-1 AVAILABLE with 500.000 kg."
            - "Logical clock at 2026-08-01T00:00:00Z, so a 09:00 oven start is in the future."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_wh
            - *cd2_lot
          trigger:
            - call: "POST /customers"
              payload: { customer_code: "CUS-CD-P1", email: "p1@dealer.example", region_code: "Z1" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { custp: $.data.id }
            - call: "POST /customers"
              payload: { customer_code: "CUS-CD-P2", email: "p2@dealer.example", region_code: "Z1" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { custp2: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WH-CD-P", footprint_capacity_cube_m3: 30.0000, zones: [{ zone_code: "Z-P", capacity_cube_m3: 30.0000 }], restricted_threshold_pct: 85.00, frozen_threshold_pct: 95.00 }
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { whp: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-CD-P", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 100.000, expires_on: "2027-12-31" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "POST /production-orders"
              payload: { order_code: "PO-CD-P", product_model_id: "${pm}", target_warehouse_id: "${whp}", ordered_qty: 2 }
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { pop: $.data.id }
            - call: "POST /production-orders/${pop}/release"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { pop_v1: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${pop}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${pop_v1}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cycp: $.data.id }
            - call: "POST /molding-cycles/${cycp}/abort"
              payload: { abort_reason: "OPERATOR_ABORT" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /production-orders/${pop}/cancel"
              payload: { cancel_reason: "demand pulled" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /customers/${custp}/acknowledge-storage-guidance"
              payload: { acknowledged_at: "2026-08-01T00:00:00Z" }
              as: Customer
              as_user_id: "${custp}"
            - call: "POST /customers/${custp2}/acknowledge-storage-guidance"
              payload: { acknowledged_at: "2026-08-01T00:00:00Z" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${whp}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${whp}/footprint-summary"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /resin-charges"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
          assert:
            - "both customer creates return status 201 — POST /customers is shared by LogisticsPlanner and PlantAdmin"
            - "the warehouse create returns 201 and the resin lot create returns 201 under ResinTechnician"
            - "the order create returns 201 with status 'DRAFT' and the release returns 200 with status 'READY_TO_SCHEDULE' — both performed by LogisticsPlanner"
            - "the cycle create returns 201 with status 'SCHEDULED' and operator_technician_id == ${t_op}"
            - "the abort returns 200 with status 'ABORTED' and abort_reason 'OPERATOR_ABORT', and ResinLot.${lot}.available_kg is unchanged at 500.000 because no charge was ever reserved on that cycle"
            - "the cancel returns 200 with status 'CANCELLED' under PlantAdmin, even though the order was created and released by LogisticsPlanner"
            - "the self-acknowledgement returns 200 with Customer.${custp}.storage_guidance_acknowledged_at == '2026-08-01T00:00:00Z'"
            - "the LogisticsPlanner acknowledgement on ${custp2} also returns 200 — the endpoint is shared by PlantAdmin, LogisticsPlanner and the Customer itself"
            - "both footprint-summary reads return 200 with identical bodies apart from meta, and the ResinTechnician read of /resin-charges returns 200 with total_count 0"

