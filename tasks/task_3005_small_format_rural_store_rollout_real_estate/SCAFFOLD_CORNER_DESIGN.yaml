      - name: study_references_cross_program_store_rejected
        claim_type: cross_entity
        grounds:
          - validations[priority=8]
          - errors[ERR_BAD_REFERENCE]
        distinguishing_aspect: "An overlap entry pointing at an EXISTING store registered in a DIFFERENT program fails with ERR_BAD_REFERENCE — overlap stores must live in the same program."
        test_recipe:
          setup: ["two ACTIVE programs P1/P2; EXISTING store X in P2; store S in P1 (DG_FRESH, 145600000)"]
          setup_api_calls:
