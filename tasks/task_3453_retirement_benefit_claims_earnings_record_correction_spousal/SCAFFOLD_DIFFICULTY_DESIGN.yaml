      - 'After approve and after the 30-day waiver window: begin-recovery returns 200, OverpaymentCase.${oco}.status == RECOVERY_ACTIVE'
      - BenefitClaim.${co}.recovery_mode == FULL
- rule_id: resource_temporal_overlap
  instances:
  - name: marriage_interval_half_open_overlap
    grounds:
    - validations[priority=9]
    - entities.Relationship.fields.marriage_date
    - errors[ERR_RELATIONSHIP_OVERLAP]
    distinguishing_aspect: 'Half-open interval semantics on the Relationship resource: [marriage_date, divorce_date) — a new marriage beginning
      exactly on the previous divorce_date is ADJACENT, not overlapping, and verifies; an interval with divorce_date null extends indefinitely
      and rejects any later marriage. Geometric adjacency treatment, unlike the payee capacity rule.'
    test_recipe:
      setup:
      - Worker wm with three spouses p1, p2, p3
      - 'R1: marriage 2000-01-01, divorce 2010-06-15 (VERIFIED)'
      - 'R2: marriage 2010-06-15 exactly at R1''s divorce date (adjacent — must verify)'
      - 'R3: marriage 2011-01-01 while R2''s interval is still open (must conflict)'
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Married Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wm: $.data.id
          wm_ver: $.data.version
      - call: POST /ssa/workers
        payload:
          full_name: Spouse One
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          p1: $.data.id
          p1_ver: $.data.version
      - call: POST /ssa/workers
        payload:
          full_name: Spouse Two
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          p2: $.data.id
          p2_ver: $.data.version
      - call: POST /ssa/workers
        payload:
          full_name: Spouse Three
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          p3: $.data.id
          p3_ver: $.data.version
      - call: POST /ssa/relationships
        payload:
          worker_id: ${wm}
          spouse_worker_id: ${p1}
          relationship_type: DIVORCED_SPOUSE
          marriage_date: '2000-01-01'
          divorce_date: '2010-06-15'
        as: ClaimsSpecialist
        captures:
          r1: $.data.id
      - call: POST /ssa/relationships/${r1}/verify
        payload: {}
        as: ClaimsSpecialist
      - call: POST /ssa/relationships
        payload:
          worker_id: ${wm}
          spouse_worker_id: ${p2}
          relationship_type: CURRENT_SPOUSE
          marriage_date: '2010-06-15'
        as: ClaimsSpecialist
        captures:
          r2: $.data.id
      trigger:
      - call: POST /ssa/relationships/${r2}/verify
        payload: {}
        as: ClaimsSpecialist
      - call: POST /ssa/relationships
        payload:
          worker_id: ${wm}
          spouse_worker_id: ${p3}
          relationship_type: CURRENT_SPOUSE
          marriage_date: '2011-01-01'
        as: ClaimsSpecialist
        captures:
          r3: $.data.id
      - call: POST /ssa/relationships/${r3}/verify
        payload: {}
        as: ClaimsSpecialist
        captures:
          err: $.data.error_id
      assert:
      - Relationship.${r1}.status == VERIFIED
      - Relationship.${r2}.status == VERIFIED (adjacency at 2010-06-15 is not an overlap under half-open semantics)
      - 'Third verify: 409 ERR_RELATIONSHIP_OVERLAP; Relationship.${r3} remains ASSERTED'
  - name: payee_capacity_one_exclusivity
    grounds:
    - validations[priority=9]
    - state_machines.PayeeCase.INVESTIGATING_to_ACTIVE
    - errors[ERR_ACTIVE_PAYEE_EXISTS]
    distinguishing_aspect: 'Aggregate-capacity semantics on the PayeeCase resource: at most one ACTIVE payee per claim at any moment — no interval
      arithmetic at all, unlike the half-open marriage overlap rule. Approving a second payee while one is ACTIVE is rejected regardless of dates.'
    test_recipe:
      setup:
      - 'Worker wp2: born 1964-06, 5 earnings years; RETIREMENT claim ENTITLED'
      - Payee case one decided APPROVED (ACTIVE); payee case two INVESTIGATING
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Payee Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wp2: $.data.id
          wp2_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wp2}
          employer_name: Acme Corp
          tax_year: 2019
          amount_cents: 1825000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wp2}
          employer_name: Acme Corp
          tax_year: 2020
          amount_cents: 1850000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wp2}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wp2}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wp2}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1925000
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${wp2}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wp2}
        captures:
          cp2: $.data.id
      - call: POST /ssa/claims/${cp2}/approve
        payload: {}
        as: ClaimsSpecialist
      - call: POST /ssa/payee-cases
        payload:
          claim_id: ${cp2}
          payee_name: Payee One
          determination_basis: court order
        as: ClaimsSpecialist
        as_user_id: spec-5
        captures:
          pc1: $.data.id
      - call: POST /ssa/payee-cases/${pc1}/decide
        payload:
          outcome: APPROVED
        as: SeniorAdjudicator
        as_user_id: sen-1
      - call: POST /ssa/payee-cases
        payload:
          claim_id: ${cp2}
          payee_name: Payee Two
          determination_basis: family request
        as: ClaimsSpecialist
        as_user_id: spec-5
        captures:
          pc2: $.data.id
      trigger:
      - call: POST /ssa/payee-cases/${pc2}/decide
        payload:
          outcome: APPROVED
        as: SeniorAdjudicator
        as_user_id: sen-1
        captures:
          err: $.data.error_id
      assert:
      - Second decide returns 409 ERR_ACTIVE_PAYEE_EXISTS
      - PayeeCase.${pc1}.status == ACTIVE; PayeeCase.${pc2}.status remains INVESTIGATING
      - BenefitClaim.${cp2}.has_active_payee == true (exactly one active payee)
- rule_id: compensating_invariant
  instances:
  - name: withdrawal_full_repayment_zero_net_invariant
    grounds:
    - state_machines.BenefitClaim.ENTITLED_to_WITHDRAWN
    - state_machines.BenefitPayment.PAID_to_REPAYED
    - entities.BenefitClaim.fields.total_paid_cents
    - validations[priority=12]
    distinguishing_aspect: 'Conserved quantity: lifetime net cash disbursed on the claim. Forward action (two payments of 14610) paired with its
      compensating action (withdrawal with repaid_amount_cents == total_paid) leaves sum(net_paid) - repaid == 0, every payment REPAYED, and the
      worker free to re-file — the withdrawal erases the entitlement as if never filed.'
    test_recipe:
      setup:
      - 'Worker wz: born 1964-06, 5 earnings years; RETIREMENT entitled 2026-06, monthly 14610'
      - Batches 2026-06 and 2026-07 generated two payments (total_paid 29220)
      - Clock at 2027-05-15 — month 11 after entitlement, inside the withdrawal window
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Withdrawer
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wz: $.data.id
          wz_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wz}
          employer_name: Acme Corp
          tax_year: 2019
          amount_cents: 1825000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wz}
          employer_name: Acme Corp
          tax_year: 2020
          amount_cents: 1850000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wz}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wz}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wz}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1925000
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${wz}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wz}
        captures:
          cz: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-06-20T00:00:00Z'
        as: ProgramAdministrator
      - call: POST /ssa/claims/${cz}/approve
        payload: {}
        as: ClaimsSpecialist
      - call: POST /_batch/run-monthly-cycle
        payload:
          run_month: 2026-06
        as: ProgramAdministrator
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-07-01T00:00:00Z'
        as: ProgramAdministrator
      - call: POST /_batch/run-monthly-cycle
        payload:
          run_month: 2026-07
        as: ProgramAdministrator
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2027-05-15T00:00:00Z'
        as: ProgramAdministrator
      trigger:
      - call: POST /ssa/claims/${cz}/withdraw
        payload:
          repaid_amount_cents: 29220
        as: Claimant
        as_user_id: ${wz}
      - call: POST /ssa/claims
        payload:
          worker_id: ${wz}
          claim_type: RETIREMENT
          entitlement_month: 2027-06
        as: Claimant
        as_user_id: ${wz}
        captures:
          cz2: $.data.id
      assert:
      - BenefitClaim.${cz}.status == WITHDRAWN and total_paid_cents == 0
      - Both BenefitPayment rows have status == REPAYED
      - 'Invariant: 29220 (net disbursed) - 29220 (repaid) == 0 net cash on the withdrawn claim'
      - Worker.${wz}.withdrawal_used == true
      - Re-filed claim ${cz2} is created with status FILED (prior WITHDRAWN does not block re-filing)
  - name: recomputation_ledger_conservation_invariant
    grounds:
    - calculations.recomputation_delta
    - calculations.overpayment_withholding
    - entities.BenefitClaim.fields.underpayment_credit_cents
    - entities.BenefitPayment.fields.net_paid_cents
    distinguishing_aspect: 'Conserved quantity: the lifetime benefit ledger — sum(net_paid) + outstanding underpayment credit must equal sum of
      what the corrected monthly benefit owed for each paid month. Two payments at the old rate 8750 plus the 5800 retro credit equal 2 x 11650
      = 23300; after the next payment drains the credit, cumulative net 34950 == 3 x 11650. A different conserved quantity than the withdrawal
      zero-net-cash invariant.'
    test_recipe:
      setup:
      - 'Worker wl: born 1964-06, wage reports 2020-2022 at AWI; no 2023 row'
      - 'RETIREMENT entitled 2026-06: AIME 13900, PIA 12510, monthly 8750'
      - Batches 2026-06 and 2026-07 -> two payments of 8750
      - 'Correction approves 2023 at 1925000 (indexed 1950000): AIME 18500, PIA 16650, monthly 11650'
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Ledger Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wl: $.data.id
          wl_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wl}
          employer_name: Acme Corp
          tax_year: 2020
          amount_cents: 1850000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wl}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wl}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${wl}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wl}
        captures:
          cl: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-06-20T00:00:00Z'
        as: ProgramAdministrator
      - call: POST /ssa/claims/${cl}/approve
        payload: {}
        as: ClaimsSpecialist
      - call: POST /_batch/run-monthly-cycle
        payload:
          run_month: 2026-06
        as: ProgramAdministrator
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-07-01T00:00:00Z'
        as: ProgramAdministrator
      - call: POST /_batch/run-monthly-cycle
        payload:
          run_month: 2026-07
        as: ProgramAdministrator
      - call: POST /ssa/correction-requests
        payload:
          worker_id: ${wl}
          tax_year: 2023
          claimed_earnings_cents: 1925000
          evidence_type: EMPLOYER_LETTER
        as: Claimant
        as_user_id: ${wl}
        captures:
          corl: $.data.id
      trigger:
      - call: POST /ssa/correction-requests/${corl}/approve
        payload: {}
        as: ClaimsSpecialist
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ProgramAdministrator
      - call: POST /_batch/run-monthly-cycle
        payload:
          run_month: 2026-08
        as: ProgramAdministrator
      assert:
      - 'Immediately after approval: sum(net_paid) 17500 + underpayment_credit_cents 5800 == 23300 == 2 x 11650'
      - RecomputationEvent retro_delta_cents == 5800, resolution == UNDERPAYMENT_CREDIT
      - 'Payment 2026-08: gross 11650, underpayment_credit_cents 5800, net_paid_cents 17450'
      - 'After the August payment: cumulative net 34950 == 3 x 11650 (credit drained, ledger conserved)'
