              captures: { status_after_cascade: $.data.status, reason_after_cascade: $.data.blocked_reason }
            - call: "PUT /design-system/component-dependencies/${dep_id}"
              payload: { pinned_provider_major: 2 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { dep_state_repinned: $.data.compatibility_state }
          trigger:
            - call: "POST /design-system/platform-implementations/${impl_id}/ship"
              payload: { package_version: "2.0.0", token_compliance_ratio: 0.98 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { status_reship: $.data.status, reason_reship: $.data.blocked_reason }
          assert:
            - "${dep_state_0} == COMPATIBLE"
            - "${status_after_first_ship} == SHIPPED"
            - "${status_after_cascade} == BLOCKED and ${reason_after_cascade} == UPSTREAM_BREAKING_CHANGE"
            - "${dep_state_repinned} == COMPATIBLE"
            - "${status_reship} == SHIPPED and ${reason_reship} == NONE"
            - "Component.${c_cons}.blocked_dependency_count == 0"
            - "Component.${c_cons}.shipped_platform_count == 1 and Component.${c_cons}.coverage_state == WEB_ONLY"
            - "Team.${team_id}.blocked_implementation_count == 0"
            - "PlatformImplementation.${impl_id}.package_version == \"2.0.0\""

  # =========================================================================
  # RULE 4 — transitive_cascade
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: breaking_change_accept_cascades_four_hops_to_team_counter
        grounds:
          - state_machines.ContributionProposal.READY_FOR_ACCEPTANCE_to_ACCEPTED
          - state_machines.PlatformImplementation.SHIPPED_to_BLOCKED
          - entities.ComponentDependency.fields.compatibility_state
          - entities.Component.fields.blocked_dependency_count
          - entities.Component.fields.coverage_state
          - entities.Team.fields.blocked_implementation_count
        distinguishing_aspect: |
          FOUR hops, each caused by the previous hop's mutation and never by the accept call:
          hop 1 Component.current_major_version 1->2 on the provider, hop 2 ComponentDependency
          COMPATIBLE->INCOMPATIBLE plus consumer blocked_dependency_count 0->1, hop 3 the
          consumer's SHIPPED implementation -> BLOCKED with coverage_state WEB_ONLY->NONE, hop 4
          Team.blocked_implementation_count 0->1 on a team that owns neither the accepted
          proposal's evidence nor the dependency row.
