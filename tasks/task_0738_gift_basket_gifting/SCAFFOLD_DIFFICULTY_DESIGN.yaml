scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (>= 2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_total_cost_provisional_vs_final_diverge_on_catalog_price_edit
        grounds:
          - calculations.order_total_cost
          - state_machines.CorporateOrder.PENDING_APPROVAL_to_APPROVED
        distinguishing_aspect: |
          For the identical recipient/quantity data (1 recipient, quantity=10, unbranded), the
          provisional variant (computed at submit-for-approval using the template's price at that
          moment) yields total_cost_cents=40000, while the final variant (computed at APPROVE, using
          the template price snapshot pinned by locked_template_version AFTER an intervening catalog
          price edit) yields total_cost_cents=45000 — a different numeric result for the same order
          from the same recipient data, driven purely by the variant's price-snapshot timing.
        test_recipe:
          setup:
            - "CorporateAccount with monthly_budget_cents=100000, approval_threshold_cents=1000."
            - "GiftBasketTemplate 'Starter Basket' base_price_cents=4000, one non-perishable ComponentSKU line, quantity 1."
            - "AssemblyStation with daily_capacity=1000."
            - "CorporateOrder created against the template (no branding, no scheduled_send_date)."
            - "One Recipient imported with quantity=10 (ACCEPTED); order submitted for approval, producing provisional order.total_cost_cents=40000 and requires_approval=true (BudgetApproval PENDING)."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Acme Corp", billing_email: "ap@acme.example", monthly_budget_cents: 100000, approval_threshold_cents: 1000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Choc Box", unit_cost_cents: 500, is_perishable: false, on_hand_qty: 1000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Starter Basket", category: "CORPORATE_WELCOME", base_price_cents: 4000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /assembly-stations"
              payload: { name: "Station A", daily_capacity: 1000 }
              as: PlatformAdmin
              captures: { station_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "ONBOARDING", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Jane Doe", email: "jane@example.com", shipping_address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "73301", country_code: "US", quantity: 10 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-1" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { provisional_total: $.data.total_cost_cents }
          trigger:
            - call: "PATCH /gift-basket-templates/${template_id}"
              payload: { base_price_cents: 4500 }
              as: PlatformAdmin
            - call: "POST /orders/${order_id}/budget-decision"
              payload: { decision: "APPROVE", approver_user_id: "fin-appr-1", station_id: "${station_id}", scheduled_date: "2026-03-05T00:00:00Z" }
              as: FinanceApprover
          assert:
            - "provisional_total (captured at submit-for-approval) == 40000"
            - "CorporateOrder.${order_id}.total_cost_cents == 45000"
            - "CorporateOrder.${order_id}.total_cost_cents != 40000 (final differs numerically from the earlier provisional figure for the identical recipient/quantity data)"

      - name: component_available_qty_forward_looking_accepts_but_chronological_rejects
        grounds:
          - calculations.component_available_qty
          - validations[priority=25]
          - validations[priority=17]
        distinguishing_aspect: |
          For the identical pair of RESERVED reservations on the same SKU (on_hand_qty=5), the
          forward_looking variant (used at CSV import) excludes the earlier reservation because it
          projects it will have expired by the new order's scheduled_send_date, and so ACCEPTS the
          new 5-unit row; the chronological variant (used at APPROVE) ignores that future expiry and
          FIFO-sums both reservations against on_hand_qty, and so REJECTS the same order's approval
          with ERR_INSUFFICIENT_INVENTORY_CHRONOLOGICAL — different outcomes from the same stock data.
        test_recipe:
          setup:
            - "CorporateAccount with monthly_budget_cents=1000000, approval_threshold_cents=1000 (low threshold guarantees Order_B requires an explicit, separate FinanceApprover decision rather than auto-approving inside submit-for-approval)."
            - "ComponentSKU is_perishable=true, shelf_life_days=3, on_hand_qty=5."
            - "GiftBasketTemplate composed of 1 unit of that SKU per basket."
            - "AssemblyStation with daily_capacity=1000."
            - "Order_A (no scheduled_send_date) has an existing Recipient (quantity=5) imported at clock 2026-03-01T00:00:00Z, creating InventoryReservation R_old (RESERVED, reserved_qty=5, expires_at=2026-03-04T00:00:00Z); clock is never advanced, so R_old remains RESERVED (not auto-expired) throughout."
            - "Order_B has scheduled_send_date=2026-03-10T00:00:00Z (well after R_old's expiry)."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Beta Corp", billing_email: "ap@beta.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Fresh Truffles", unit_cost_cents: 800, is_perishable: true, shelf_life_days: 3, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Truffle Box", category: "CLIENT_APPRECIATION", base_price_cents: 3000, is_perishable: true, shelf_life_days: 3, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /assembly-stations"
              payload: { name: "Station B", daily_capacity: 1000 }
              as: PlatformAdmin
              captures: { station_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "THANK_YOU", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_a_id: $.data.id }
            - call: "POST /orders/${order_a_id}/recipients/import"
              payload: { rows: [ { full_name: "Old Recipient", email: "old@example.com", shipping_address_line1: "2 Elm St", city: "Dallas", state_code: "TX", postal_code: "75201", country_code: "US", quantity: 5 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { old_recipient_id: "$.data[0].id" }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "THANK_YOU", scheduled_send_date: "2026-03-10T00:00:00Z", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_b_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_b_id}/recipients/import"
              payload: { rows: [ { full_name: "New Recipient", email: "new@example.com", shipping_address_line1: "3 Oak St", city: "Houston", state_code: "TX", postal_code: "77001", country_code: "US", quantity: 5 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { new_recipient_id: "$.data[0].id", new_row_status: "$.data[0].import_row_status" }
            - call: "POST /orders/${order_b_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-2" }
              as: AccountManager
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_b_id}/budget-decision"
              payload: { decision: "APPROVE", approver_user_id: "fin-appr-2", station_id: "${station_id}", scheduled_date: "2026-03-02T00:00:00Z" }
              as: FinanceApprover
          assert:
            - "new_row_status == 'ACCEPTED' (forward_looking excluded R_old, projecting it expired by 2026-03-10, so 5 units were available)"
            - "the budget-decision call returns error_id == 'ERR_INSUFFICIENT_INVENTORY_CHRONOLOGICAL' with http_status 409 (chronological ignores future expiry and sums R_old(5) + the new reservation(5) = 10 > on_hand_qty(5))"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (>= 2 instances, different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_total_cost_tier_boundary_waives_rush_fee_mode_a
        grounds:
          - calculations.order_total_cost
        distinguishing_aspect: |
          Mode (a): a nonlinear formula with >= 3 interacting inputs (branding surcharge flag, volume
          tier crossed at exactly 25 units, and rush-window eligibility) where the tier crossing
          SUPPRESSES the rush fee via a nested conditional, even though the order independently
          qualifies for the rush window — the rush fee is not a simple additive term.
        test_recipe:
          setup:
            - "CorporateAccount with monthly_budget_cents=100000000, approval_threshold_cents=100000000 (never requires approval; isolates the formula from the budget calc; auto-approval fires inside submit-for-approval)."
            - "GiftBasketTemplate base_price_cents=4000, one non-perishable SKU line quantity 1."
            - "BrandingProfile created for the account and marked approved (surcharge applies without also tripping ERR_BRANDING_PROFILE_NOT_APPROVED on the auto-approval cascade)."
            - "AssemblyStation with daily_capacity=1000 (needed by the auto-approval cascade's AssemblyTask creation)."
            - "Order created with that branding_profile_id and scheduled_send_date 2 days after clock.now_utc (within the 3-day rush window)."
            - "Exactly 25 recipients' worth of quantity imported (total_units=25, crossing into TIER_1 at the >= 25 boundary)."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Gamma Corp", billing_email: "ap@gamma.example", monthly_budget_cents: 100000000, approval_threshold_cents: 100000000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Mug", unit_cost_cents: 300, is_perishable: false, on_hand_qty: 1000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Welcome Mug Set", category: "CORPORATE_WELCOME", base_price_cents: 4000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /assembly-stations"
              payload: { name: "Station G", daily_capacity: 1000 }
              as: PlatformAdmin
              captures: { station_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/branding-profiles"
              payload: { name: "Q3 Kit", logo_url: "https://cdn.example/logo.png", accent_color: "#112233", card_stock: "MATTE", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { branding_id: $.data.id }
            - call: "POST /branding-profiles/${branding_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", branding_profile_id: "${branding_id}", occasion: "ONBOARDING", scheduled_send_date: "2026-03-03T00:00:00Z", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Bulk Recipient", email: "bulk@example.com", shipping_address_line1: "4 Pine St", city: "Denver", state_code: "CO", postal_code: "80201", country_code: "US", quantity: 25 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_id: "$.data[0].id" }
          trigger:
            - call: "POST /orders/${order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-3", station_id: "${station_id}", scheduled_date: "2026-03-02T00:00:00Z" }
              as: AccountManager
              as_user_id: "${acct_id}"
          assert:
            - "CorporateOrder.${order_id}.total_cost_cents == 98563 (per_unit=4150 x 25 = 103750; TIER_1 5% discount -> round_half_up(98562.5) = 98563; rush_fee_cents == 0 because tier != TIER_0)"

      - name: shipping_cost_round_per_shipment_then_sum_mode_b
        grounds:
          - calculations.shipping_cost_total
        distinguishing_aspect: |
          Mode (b): rounding order is pinned as round-per-shipment-then-sum. Two shipments each raise
          a raw cost of 664.4 cents; rounding each first gives 664+664=1328, whereas summing the raw
          fractional costs first and rounding once (664.4+664.4=1328.8 -> 1329) would produce a
          different total cents figure — the scaffold's pinned order (1328) must be the one observed.
        test_recipe:
          setup:
            - "CorporateAccount, GiftBasketTemplate (1 SKU, quantity 1), ShippingZone base_rate_cents=500, per_kg_rate_cents=137."
            - "One Order with two Recipients, each quantity=1 (so each basket's estimated weight is 1.2kg, giving a raw per-shipment cost of 664.4 cents before rounding)."
            - "Both recipients' MessageProof rows are created and LOCKED so shipment creation is unblocked."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Delta Corp", billing_email: "ap@delta.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Candle", unit_cost_cents: 400, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Candle Box", category: "CLIENT_APPRECIATION", base_price_cents: 2500, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "US-CENTRAL", country_codes: ["US"], carrier: "SwiftShip", base_rate_cents: 500, per_kg_rate_cents: 137, transit_days_min: 2, transit_days_max: 5, blackout_dates: [] }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "HOLIDAY", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Recipient One", email: "one@example.com", shipping_address_line1: "5 Cedar St", city: "Phoenix", state_code: "AZ", postal_code: "85001", country_code: "US", quantity: 1 }, { full_name: "Recipient Two", email: "two@example.com", shipping_address_line1: "6 Birch St", city: "Tucson", state_code: "AZ", postal_code: "85701", country_code: "US", quantity: 1 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { r1_id: "$.data[0].id", r2_id: "$.data[1].id" }
            - call: "POST /recipients/${r1_id}/message-proof"
              payload: { message_text: "Happy Holidays!", submitted_by_user_id: "emp-msg-1" }
              as: AccountManager
              captures: { proof1_id: $.data.id }
            - call: "POST /message-proofs/${proof1_id}/decision"
              payload: { decision: "APPROVE", decided_by_user_id: "proof-appr-1" }
              as: ProofApprover
            - call: "POST /recipients/${r2_id}/message-proof"
              payload: { message_text: "Happy Holidays!", submitted_by_user_id: "emp-msg-1" }
              as: AccountManager
              captures: { proof2_id: $.data.id }
            - call: "POST /message-proofs/${proof2_id}/decision"
              payload: { decision: "APPROVE", decided_by_user_id: "proof-appr-1" }
              as: ProofApprover
          trigger:
            - call: "POST /recipients/${r1_id}/shipments"
              payload: { zone_id: "${zone_id}", ship_date: "2026-03-05T00:00:00Z" }
              as: ShippingOps
              captures: { shipment1_id: $.data.id }
            - call: "POST /recipients/${r2_id}/shipments"
              payload: { zone_id: "${zone_id}", ship_date: "2026-03-05T00:00:00Z" }
              as: ShippingOps
              captures: { shipment2_id: $.data.id }
          assert:
            - "Shipment.${shipment1_id}.shipping_cost_cents == 664"
            - "Shipment.${shipment2_id}.shipping_cost_cents == 664"
            - "(Shipment.${shipment1_id}.shipping_cost_cents + Shipment.${shipment2_id}.shipping_cost_cents) == 1328, NOT 1329 (the sum-then-round alternative)"

      - name: budget_utilization_evaluation_order_pins_loyalty_tier_before_total_mode_c
        grounds:
          - calculations.budget_utilization_and_approval_trigger
          - calculations.order_total_cost
        distinguishing_aspect: |
          Mode (c): order.total_cost_cents depends on loyalty_discount_pct, which is picked from
          remaining_budget_cents computed purely from CorporateAccount fields BEFORE this order's own
          cost exists; the scaffold pins this evaluation order (remaining_budget -> tier -> total_cost)
          so total_cost_cents cannot feed back into the tier decision that produced it.
        test_recipe:
          setup:
            - "CorporateAccount created with monthly_budget_cents=200000 (kept low so the seed order's own remaining_budget_cents=200000 is below SILVER_THRESHOLD_CENTS, giving the seed order itself a STANDARD 0% loyalty tier — no compounding discount to reason about)."
            - "A seed order for exactly 1,000,000 cents (base_price_cents=100000 x 10 units, TIER_0, 0% volume discount, 0% loyalty) is approved, so ytd_spend_cents becomes exactly 1000000."
            - "The account's monthly_budget_cents is then raised to 2000000 via PATCH /corporate-accounts/{id}/budget, so remaining_budget_cents = 2000000 - 1000000 = 1000000, exactly meeting GOLD_THRESHOLD_CENTS for the NEXT order."
            - "A second order (10 units of a 4000-cent template, unbranded, no rush) is prepared, whose discounted_subtotal_cents=40000 before loyalty."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Epsilon Corp", billing_email: "ap@epsilon.example", monthly_budget_cents: 200000, approval_threshold_cents: 50000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Notebook", unit_cost_cents: 350, is_perishable: false, on_hand_qty: 1000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Premium Seed Basket", category: "CORPORATE_WELCOME", base_price_cents: 100000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { seed_template_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Standard Seed Basket", category: "CORPORATE_WELCOME", base_price_cents: 4000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /assembly-stations"
              payload: { name: "Station E", daily_capacity: 1000 }
              as: PlatformAdmin
              captures: { station_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${seed_template_id}", occasion: "ONBOARDING", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { seed_order_id: $.data.id }
            - call: "POST /orders/${seed_order_id}/recipients/import"
              payload: { rows: [ { full_name: "Seed Recipient", email: "seed@example.com", shipping_address_line1: "7 Aspen St", city: "Boise", state_code: "ID", postal_code: "83701", country_code: "US", quantity: 10 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { seed_recipient_id: "$.data[0].id" }
            - call: "POST /orders/${seed_order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-4" }
              as: AccountManager
              as_user_id: "${acct_id}"
            - call: "POST /orders/${seed_order_id}/budget-decision"
              payload: { decision: "APPROVE", approver_user_id: "fin-appr-4", station_id: "${station_id}", scheduled_date: "2026-03-02T00:00:00Z" }
              as: FinanceApprover
            - call: "PATCH /corporate-accounts/${acct_id}/budget"
              payload: { monthly_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { acct_v_after_budget_raise: $.data.version }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "ONBOARDING", expected_corporate_account_version: "${acct_v_after_budget_raise}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Loyalty Recipient", email: "loyalty@example.com", shipping_address_line1: "8 Spruce St", city: "Reno", state_code: "NV", postal_code: "89501", country_code: "US", quantity: 10 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_id: "$.data[0].id" }
          trigger:
            - call: "POST /orders/${order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-5", station_id: "${station_id}", scheduled_date: "2026-03-03T00:00:00Z" }
              as: AccountManager
              as_user_id: "${acct_id}"
          assert:
            - "CorporateAccount.${acct_id}.ytd_spend_cents == 1000000 immediately before this trigger (seed order: 10 units x 100000 = 1000000 subtotal, TIER_0 0% volume discount, STANDARD 0% loyalty since the seed order's OWN remaining_budget_cents was 200000 < SILVER_THRESHOLD_CENTS)"
            - "CorporateOrder.${order_id}.total_cost_cents == 38800 (discounted_subtotal_cents=40000; loyalty_discount_pct=0.03 because remaining_budget_cents=2000000-1000000=1000000 meets GOLD_THRESHOLD_CENTS; round_half_up(40000*0.97)=38800; rush_fee_cents=0)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (>= 2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: corporate_order_reject_then_resubmit_closes_the_approval_cycle
        grounds:
          - state_machines.CorporateOrder.PENDING_APPROVAL_to_REJECTED
          - state_machines.CorporateOrder.DRAFT_to_PENDING_APPROVAL
        distinguishing_aspect: |
          CorporateOrder's approval_status dimension is a cycle, not a linear pipeline: PENDING_APPROVAL
          -> REJECTED -> PENDING_APPROVAL is reachable by a plain resubmission, re-entering a state the
          order already visited, and the SAME BudgetApproval row is reset (not duplicated).
        test_recipe:
          setup:
            - "CorporateAccount approval_threshold_cents=1000 (forces an explicit human decision, no auto-approve)."
            - "GiftBasketTemplate base_price_cents=4000, non-perishable SKU, 1 recipient quantity=5 (subtotal=20000, over threshold)."
            - "Order submitted for approval (PENDING_APPROVAL) and then REJECTED by a FinanceApprover."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Zeta Corp", billing_email: "ap@zeta.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Pen Set", unit_cost_cents: 200, is_perishable: false, on_hand_qty: 1000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Pen Basket", category: "CORPORATE_WELCOME", base_price_cents: 4000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "THANK_YOU", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Cycle Recipient", email: "cycle@example.com", shipping_address_line1: "9 Fir St", city: "Salem", state_code: "OR", postal_code: "97301", country_code: "US", quantity: 5 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-1" }
              as: AccountManager
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/budget-decision"
              payload: { decision: "REJECT", approver_user_id: "fin-appr-6", decision_reason: "Needs revised recipient count" }
              as: FinanceApprover
          trigger:
            - call: "POST /orders/${order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-6" }
              as: AccountManager
              as_user_id: "${acct_id}"
          assert:
            - "CorporateOrder.${order_id}.approval_status == 'PENDING_APPROVAL' (re-entered from REJECTED, closing the cycle)"
            - "the order's single BudgetApproval row now has decision == 'PENDING' and requested_by_user_id == 'emp-req-6' (the SAME row was reset, not a second row created; GET /orders/${order_id}/budget-approvals returns exactly 1 entry)"

      - name: message_proof_revision_loop_returns_to_submitted
        grounds:
          - state_machines.MessageProof.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.MessageProof.REVISION_REQUESTED_to_DRAFT
        distinguishing_aspect: |
          MessageProof (a different entity than CorporateOrder) is a cyclic revision loop: SUBMITTED
          -> REVISION_REQUESTED -> DRAFT -> SUBMITTED is reachable by one revision request followed by
          one resubmission, re-entering SUBMITTED with revision_count incremented.
        test_recipe:
          setup:
            - "CorporateAccount, GiftBasketTemplate, one Recipient imported (message proof not yet created)."
            - "MessageProof submitted, then sent back for revision by a ProofApprover (auto-advances to DRAFT)."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Eta Corp", billing_email: "ap@eta.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Journal", unit_cost_cents: 250, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Journal Basket", category: "CLIENT_APPRECIATION", base_price_cents: 3500, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "THANK_YOU", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Proof Recipient", email: "proof@example.com", shipping_address_line1: "10 Willow St", city: "Eugene", state_code: "OR", postal_code: "97401", country_code: "US", quantity: 1 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_id: "$.data[0].id" }
            - call: "POST /recipients/${recipient_id}/message-proof"
              payload: { message_text: "Congrats!", submitted_by_user_id: "emp-msg-2" }
              as: AccountManager
              captures: { proof_id: $.data.id }
            - call: "POST /message-proofs/${proof_id}/decision"
              payload: { decision: "REQUEST_REVISION", decided_by_user_id: "proof-appr-2" }
              as: ProofApprover
          trigger:
            - call: "POST /recipients/${recipient_id}/message-proof"
              payload: { message_text: "Congrats again!", submitted_by_user_id: "emp-msg-2" }
              as: AccountManager
          assert:
            - "MessageProof.${proof_id}.proof_status == 'SUBMITTED' (re-entered from DRAFT, closing the cycle)"
            - "MessageProof.${proof_id}.revision_count == 1"
            - "MessageProof.${proof_id}.message_text == 'Congrats again!'"

  # ===========================================================================
  # Rule 4 — transitive_cascade (>= 2 instances, depth>=3 and depth>=2, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: approve_cascade_reservation_to_assembly_task_to_production_status_depth3
        grounds:
          - state_machines.CorporateOrder.PENDING_APPROVAL_to_APPROVED
          - state_machines.InventoryReservation.RESERVED_to_ALLOCATED
        distinguishing_aspect: |
          Depth-3 chain, all caused transitively by ONE APPROVE call: (1) InventoryReservation
          RESERVED -> ALLOCATED is caused directly by APPROVE; (2) AssemblyTask QUEUED is created
          because hop (1)'s reservation became ALLOCATED, not directly by APPROVE; (3) CorporateOrder
          production_status DRAFT -> ASSEMBLING happens because hop (2)'s AssemblyTask rows now exist,
          not directly by APPROVE. Each link is caused by the previous link, not by the original call.
        test_recipe:
          setup:
            - "CorporateAccount approval_threshold_cents=1000 (forces explicit APPROVE)."
            - "GiftBasketTemplate base_price_cents=4000, non-perishable SKU on_hand_qty=100."
            - "AssemblyStation daily_capacity=1000."
            - "Order with 1 recipient quantity=5, submitted for approval (PENDING_APPROVAL, InventoryReservation RESERVED, no AssemblyTask yet, production_status DRAFT)."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Theta Corp", billing_email: "ap@theta.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Tote Bag", unit_cost_cents: 600, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Tote Basket", category: "CORPORATE_WELCOME", base_price_cents: 4000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /assembly-stations"
              payload: { name: "Station T", daily_capacity: 1000 }
              as: PlatformAdmin
              captures: { station_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "ONBOARDING", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Cascade Recipient", email: "cascade@example.com", shipping_address_line1: "11 Maple St", city: "Tacoma", state_code: "WA", postal_code: "98401", country_code: "US", quantity: 5 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-7" }
              as: AccountManager
              as_user_id: "${acct_id}"
            - call: "GET /inventory-reservations"
              payload: { recipient_id: "${recipient_id}" }
              as: WarehouseOps
              captures: { reservation_id: "$.data[0].id" }
          trigger:
            - call: "POST /orders/${order_id}/budget-decision"
              payload: { decision: "APPROVE", approver_user_id: "fin-appr-7", station_id: "${station_id}", scheduled_date: "2026-03-04T00:00:00Z" }
              as: FinanceApprover
          assert:
            - "InventoryReservation.${reservation_id}.status == 'ALLOCATED' (hop 1, direct effect of APPROVE)"
            - "exactly one AssemblyTask exists with recipient_id == '${recipient_id}', station_id == '${station_id}', scheduled_date == '2026-03-04T00:00:00Z', status == 'QUEUED' (hop 2, caused by hop 1's reservation becoming ALLOCATED)"
            - "CorporateOrder.${order_id}.production_status == 'ASSEMBLING' (hop 3, caused by hop 2's AssemblyTask existing, not directly by the APPROVE call)"

      - name: last_assembly_task_complete_cascades_to_ready_to_ship_and_bulk_assembled_depth2
        grounds:
          - state_machines.AssemblyTask.IN_PROGRESS_to_COMPLETE
          - state_machines.CorporateOrder.ASSEMBLING_to_READY_TO_SHIP
        distinguishing_aspect: |
          Depth-2 chain triggered by a DIFFERENT transition than Rule 4's other instance (an
          AssemblyTask reaching COMPLETE, not a budget-decision APPROVE): (1) CorporateOrder
          production_status ASSEMBLING -> READY_TO_SHIP is caused directly by the last task completing;
          (2) InventoryReservation ALLOCATED -> ASSEMBLED (bulk, for the order's recipients) is caused
          because hop (1)'s READY_TO_SHIP was reached, not directly by the AssemblyTask completion.
        test_recipe:
          setup:
            - "Same fixture shape as the depth-3 instance, but with exactly ONE recipient so its single AssemblyTask is the order's last remaining task; order already APPROVED (production_status=ASSEMBLING, AssemblyTask QUEUED, InventoryReservation ALLOCATED)."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Iota Corp", billing_email: "ap@iota.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Scarf", unit_cost_cents: 900, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Scarf Basket", category: "CLIENT_APPRECIATION", base_price_cents: 4000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /assembly-stations"
              payload: { name: "Station I", daily_capacity: 1000 }
              as: PlatformAdmin
              captures: { station_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "ONBOARDING", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Last Task Recipient", email: "lasttask@example.com", shipping_address_line1: "12 Cherry St", city: "Bellevue", state_code: "WA", postal_code: "98004", country_code: "US", quantity: 3 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-8" }
              as: AccountManager
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/budget-decision"
              payload: { decision: "APPROVE", approver_user_id: "fin-appr-8", station_id: "${station_id}", scheduled_date: "2026-03-04T00:00:00Z" }
              as: FinanceApprover
            - call: "GET /assembly-tasks"
              payload: { recipient_id: "${recipient_id}" }
              as: WarehouseOps
              captures: { task_id: "$.data[0].id" }
            - call: "GET /inventory-reservations"
              payload: { recipient_id: "${recipient_id}" }
              as: WarehouseOps
              captures: { reservation_id: "$.data[0].id" }
            - call: "POST /assembly-tasks/${task_id}/advance"
              payload: { target_status: "IN_PROGRESS" }
              as: WarehouseOps
          trigger:
            - call: "POST /assembly-tasks/${task_id}/advance"
              payload: { target_status: "COMPLETE" }
              as: WarehouseOps
          assert:
            - "CorporateOrder.${order_id}.production_status == 'READY_TO_SHIP' (hop 1, caused directly by this being the order's last remaining AssemblyTask reaching COMPLETE)"
            - "InventoryReservation.${reservation_id}.status == 'ASSEMBLED' (hop 2, caused by hop 1's READY_TO_SHIP being reached, not directly by the AssemblyTask completion)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (>= 2 instances, different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancelled_order_with_zero_recipients_fails_state_before_business_constraint
        grounds:
          - validations[priority=11]
          - validations[priority=22]
        distinguishing_aspect: |
          Error-category pair (state, business_constraint): a submit-for-approval call on an order
          that is BOTH production_status==CANCELLED (state, priority 11) AND has zero ACCEPTED
          recipients (business_constraint, priority 22) must fail with ERR_INVALID_ORDER_STATE, not
          ERR_EMPTY_RECIPIENT_LIST, because priority 11 is checked before priority 22.
        test_recipe:
          setup:
            - "CorporateAccount, GiftBasketTemplate; an order is created but never has any recipients imported, then is cancelled while still DRAFT (production_status DRAFT is a legal cancel source), leaving production_status=CANCELLED and approval_status=DRAFT."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Kappa Corp", billing_email: "ap@kappa.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Keychain", unit_cost_cents: 150, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Keychain Basket", category: "CORPORATE_WELCOME", base_price_cents: 2000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "CUSTOM", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: AccountManager
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-9" }
              as: AccountManager
              as_user_id: "${acct_id}"
          assert:
            - "the call returns error_id == 'ERR_INVALID_ORDER_STATE' with http_status 409, NOT 'ERR_EMPTY_RECIPIENT_LIST' (both checks fail together; priority 11 precedes priority 22)"

      - name: expired_perishable_and_unapproved_branding_fails_safety_before_referential
        grounds:
          - validations[priority=16]
          - validations[priority=18]
        distinguishing_aspect: |
          Error-category pair (business_safety, business_referential): a budget-decision APPROVE call
          where BOTH the basket's ComponentSKU would spoil before the requested assembly date
          (business_safety, priority 16) AND the order's branding_profile is unapproved
          (business_referential, priority 18) must fail with ERR_PERISHABLE_SAFETY_VIOLATION, not
          ERR_BRANDING_PROFILE_NOT_APPROVED, because priority 16 is checked before priority 18.
        test_recipe:
          setup:
            - "CorporateAccount approval_threshold_cents=1000; ComponentSKU is_perishable=true, shelf_life_days=5, on_hand_qty=100 (ample stock so the chronological inventory check, priority 17, passes cleanly)."
            - "BrandingProfile created but never approved (approved stays false)."
            - "Order created with that branding_profile_id; 1 recipient quantity=2 imported and submitted for approval (PENDING_APPROVAL)."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Lambda Corp", billing_email: "ap@lambda.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Fresh Cheese Wedge", unit_cost_cents: 700, is_perishable: true, shelf_life_days: 5, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
