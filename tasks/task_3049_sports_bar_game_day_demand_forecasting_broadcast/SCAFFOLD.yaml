    roles: [PlatformAdmin, VenueManager]
    code: 200
    input: []
    output: StaffingPlan
    side_effects: []

  - method: GET
    path: "/api/venues/{id}/staffing-plans"
    description: "List staffing plans for a venue"
    roles: [PlatformAdmin, VenueManager]
    code: 200
    input: ["status?"]
    output: StaffingPlan[]
    side_effects: []

  - method: POST
    path: "/api/staffing-plans/{plan_id}/shifts"
