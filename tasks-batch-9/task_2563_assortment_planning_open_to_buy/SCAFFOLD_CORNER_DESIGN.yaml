          rationale: "The §1.8 instance already drives open-season against a DRAFT and a SUBMITTED plan for ERR_CATEGORY_PLAN_NOT_APPROVED and then succeeds on the same month once the plan is APPROVED, which is exactly the conditional-action claim for this endpoint."

  # === 6. From Table 6 (Errors) ===
  - section: errors
    instances:
      - name: every_addressed_id_has_its_own_not_found_code
        claim_type: violation_to_error
        grounds:
          - errors.ERR_DEPARTMENT_NOT_FOUND
          - errors.ERR_STORE_CLUSTER_NOT_FOUND
          - errors.ERR_VENDOR_AUTHORIZATION_NOT_FOUND
          - errors.ERR_OPTION_PLAN_NOT_FOUND
          - errors.ERR_RECEIPT_COMMITMENT_NOT_FOUND
          - errors.ERR_REFORECAST_CYCLE_NOT_FOUND
          - errors.ERR_CHASE_CANCEL_DECISION_NOT_FOUND
          - errors.ERR_LOCALIZATION_OVERLAY_NOT_FOUND
        distinguishing_aspect: "The catalog declares a SEPARATE 404 code per entity, so a single generic ERR_NOT_FOUND (or reusing the nearest neighbour's code) fails: eight GETs against eight unknown ids must return eight distinct error_id values, all 404. The sweep also pins that a 404 is decided per addressed id and not per existing sibling - the same request path with a real id returns 200 for three of the eight, so the codes are not statically wired to the route."
        test_recipe:
          setup:
            - "one Department, one StoreCluster, one Vendor and one VendorAuthorization exist; no OptionPlan, ReceiptCommitment, ReforecastCycle, ChaseCancelDecision or LocalizationOverlay has ever been created"
          setup_api_calls:
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
