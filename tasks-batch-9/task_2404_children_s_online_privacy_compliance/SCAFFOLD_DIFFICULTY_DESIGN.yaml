              as: ComplianceOfficer
              captures: { notice_2: $.data.id }
            - call: "POST /parental-notices/${notice_2}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /third-party-integrations/${intg_id}/status"
              payload: { to_status: "APPROVED", audit_note: "attempt 3 after disclosure" }
