# =============================================================================
# PRD Benchmark Seed Tables — Student Government Election Management
# Sections §1.0 – §1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!! 2119. Student Government Election Management (student council advisor): candidate eligibility & petition signatures, campaign rules & spending/poster limits, ballot construction & voting window, voter eligibility by class year & one-vote enforcement, runoff/tie rules, results certification & appeal, officer transition & training, constitution amendment referenda

domain_name: student-government-election

# Flat topology: every entity is a top-level collection linked by foreign keys.
# There is no nesting namespace, so the api_prefix is the bare root.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection (/elections, /candidacies, /votes, ...).
  # Ownership is expressed only through FK fields, never through URL nesting.

  state_machine_shape: parallel
  # Candidacy carries two independent axes (status x transition_status) and
  # Referendum carries two more (drafting_status x outcome_status). Election is
  # additionally branching (TALLYING forks to CERTIFIED or RUNOFF_SCHEDULED with
  # divergent side-effect sets) and cyclic (RUNOFF_SCHEDULED -> BALLOT_BUILDING,
  # CERTIFIED -> TALLYING on a sustained appeal).

  relationship_patterns:
    - one_to_many          # Election -> Office / Candidacy / Referendum / Ballot
    - many_to_many         # Ballot <-> Candidacy through BallotLine
    - self_referential     # Candidacy.slate_leader_candidacy_id -> Candidacy.id
    - polymorphic          # BallotLine references either a Candidacy or a Referendum
    - cross_aggregate      # Vote references Ballot, Student and Election

  role_model: segregation_of_duties
  # The FacultyAdvisor user id stamped on Election.certified_by_user_id may not
  # resolve an Appeal against that election; the FacultyAdvisor who upheld a
  # ComplianceCase may not resolve an Appeal that cites it.

  consistency_model: immediate
  difficulty_level: expert
  notes: |
    Endpoint and error-code counts sit above the nominal Expert band because §1.5
    must expose a single-resource GET plus one filtered list GET for every entity
    that carries a foreign key (FK reverse-reachability). The additional surface
    is mechanical read surface; the difficulty is concentrated in the ten
    calculations, the frozen-snapshot certification order, and the four-hop
    disqualification cascade.

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Election
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Human-readable name of the election cycle"
        constraints: "1..200 chars"
      - name: academic_year
        type: string
        source: input
        description: "Academic year label the election belongs to; scopes the voting-window overlap rule"
        constraints: "pattern YYYY-YYYY, e.g. 2026-2027"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Lifecycle phase of the election"
        constraints: "DRAFT | PETITIONING | BALLOT_BUILDING | BALLOT_PUBLISHED | VOTING_OPEN | VOTING_CLOSED | TALLYING | CERTIFIED | RUNOFF_SCHEDULED | CLOSED"
      - name: current_round
        type: integer
        source: system
        default: 1
        description: "Round currently being administered; 1 = general, 2 = runoff"
      - name: petition_deadline
        type: datetime
        source: input
        description: "Instant after which no candidacy may be approved onto the ballot (ISO 8601 UTC)"
      - name: quiet_period_hours
        type: integer
        source: input
        default: 24
        description: "Length of the pre-poll campaign blackout measured backwards from voting_opens_at"
        constraints: ">= 0"
      - name: voting_opens_at
        type: datetime
        source: system
        default: null
        description: "Start of the current round's voting window; set by POST /elections/{election_id}/open-voting"
      - name: voting_closes_at
        type: datetime
        source: system
        default: null
        description: "End of the current round's voting window; the window is half-open [opens, closes)"
      - name: spending_cap_cents
        type: integer
        source: input
        description: "Per-candidacy campaign spending cap in cents"
        constraints: ">= 0"
      - name: poster_cap
        type: integer
        source: input
        description: "Maximum number of physical posters a single candidacy may print"
        constraints: ">= 0"
      - name: quorum_pct
        type: number
        source: input
        description: "Minimum turnout_pct required for any referendum on this ballot to be decided"
        constraints: "0.00..100.00, 2 decimal places"
      - name: runoff_threshold_pct
        type: number
        source: input
        description: "Certified vote share a leader must reach to win outright; below it the office goes to a runoff"
        constraints: "0.00..100.00, 2 decimal places"
      - name: eligible_voter_count
        type: integer
        source: computed
        default: 0
        description: "Frozen electorate size; computed by calculations.election_turnout at open-voting for round 1"
      - name: ballots_cast_count
        type: integer
        source: computed
        default: 0
        description: "Number of Vote rows with status CAST for this election and current_round"
      - name: turnout_pct
        type: number
        source: computed
        default: 0.00
        description: "100 * ballots_cast_count / eligible_voter_count, round_half_up to 2 dp"
      - name: runoff_required_office_count
        type: integer
        source: computed
        default: 0
        description: "Number of Offices whose certified leader failed to reach runoff_threshold_pct; drives the certify fork"
      - name: ballot_integrity_status
        type: enum
        source: computed
        default: INTACT
        description: "Set to RECOUNT_REQUIRED by the fourth hop of the disqualification cascade when a BallotLine on a LOCKED or PUBLISHED ballot is voided"
        constraints: "INTACT | RECOUNT_REQUIRED"
      - name: certified_by_user_id
        type: string
        source: system
        default: null
        description: "Opaque X-User-ID of the FacultyAdvisor who certified the results; barred from resolving appeals on this election"
      - name: certified_at
        type: datetime
        source: system
        default: null
        description: "Instant of certification, stamped from the logical clock"

  - name: Office
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: "FK -> Election.id; the election in which this seat is contested"
      - name: name
        type: string
        source: input
        description: "Seat title, e.g. President or Junior Class Representative"
      - name: seat_count
        type: integer
        source: input
        default: 1
        description: "Number of winners this office elects"
        constraints: ">= 1"
      - name: eligible_class_years
        type: array
        source: input
        description: "Class years permitted to run for and to vote on this office"
        constraints: "non-empty subset of {FRESHMAN, SOPHOMORE, JUNIOR, SENIOR, GRADUATE}"
      - name: required_signature_count
        type: integer
        source: input
        description: "Valid petition signatures a candidacy must reach to be approved onto the ballot"
        constraints: ">= 0"
      - name: min_gpa
        type: number
        source: input
        default: 2.00
        description: "Minimum Student.gpa required to file a candidacy for this office"
        constraints: "0.00..4.00, 2 decimal places"
      - name: min_credits
        type: integer
        source: input
        default: 0
        description: "Minimum Student.credits_completed required to file a candidacy for this office"
      - name: required_training_modules
        type: integer
        source: input
        default: 3
        description: "Training modules a winner must record before the officer transition may be activated"
        constraints: ">= 0"
      - name: term_start_date
        type: datetime
        source: input
        description: "First instant of the term this office confers"
      - name: term_end_date
        type: datetime
        source: input
        description: "Last instant of the term this office confers"
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: "Derived posture of the seat"
        constraints: "OPEN | CONTESTED | RUNOFF_REQUIRED | DECIDED | VACANT_SEAT"
      - name: filled_seat_count
        type: integer
        source: computed
        default: 0
        description: "Number of seats currently held by a Candidacy in status ELECTED"
      - name: valid_votes_count
        type: integer
        source: computed
        default: 0
        description: "Denominator of the CERTIFIED share variant; see calculations.office_result_share"
      - name: abstain_votes_count
        type: integer
        source: computed
        default: 0
        description: "Ballots that selected this office with candidacy_id null"
      - name: invalidated_votes_count
        type: integer
        source: computed
        default: 0
        description: "Ballots naming a candidacy whose status is DISQUALIFIED at STEP 5 of calculations.certification_evaluation_order"

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Student's display name"
      - name: student_number
        type: string
        source: input
        description: "Registrar identifier; unique across all Student rows"
        constraints: "unique, 1..32 chars"
      - name: class_year
        type: enum
        source: input
        description: "Class standing used for both candidate and voter eligibility"
        constraints: "FRESHMAN | SOPHOMORE | JUNIOR | SENIOR | GRADUATE"
      - name: enrollment_status
        type: enum
        source: input
        default: ENROLLED
        description: "Registrar enrollment state; only ENROLLED students may run, sign or vote"
        constraints: "ENROLLED | LEAVE | WITHDRAWN"
      - name: gpa
        type: number
        source: input
        description: "Cumulative grade point average"
        constraints: "0.00..4.00, 2 decimal places"
      - name: credits_completed
        type: integer
        source: input
        default: 0
        description: "Credits earned to date"
        constraints: ">= 0"
      - name: disciplinary_hold
        type: boolean
        source: input
        default: false
        description: "When true the student may neither run nor vote"

  - name: Candidacy
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: "FK -> Election.id; the election this candidacy runs in"
      - name: office_id
        type: string
        source: input
        description: "FK -> Office.id; the seat being sought"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student running, and the owner for Candidate-role ownership checks"
      - name: slate_leader_candidacy_id
        type: string
        source: input
        default: null
        description: "FK -> Candidacy.id; self-reference naming the slate this candidacy belongs to; null for an independent run"
      - name: statement
        type: string
        source: input
        default: null
        description: "Candidate statement printed on the ballot"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Primary lifecycle axis; see state_machines[entity=Candidacy, state_field=status]"
        constraints: "DRAFT | UNDER_REVIEW | RETURNED | ELIGIBLE | PETITION_DEFICIENT | SLATE_SUSPENDED | ON_BALLOT | RUNOFF_QUALIFIED | ELECTED | ELIMINATED | VACATED | WITHDRAWN | DISQUALIFIED"
      - name: transition_status
        type: enum
        source: system
        default: NOT_APPLICABLE
        description: "Independent officer-transition axis; evolves separately from status"
        constraints: "NOT_APPLICABLE | PENDING | TRAINING_COMPLETE | ACTIVE | LAPSED"
      - name: training_modules_completed
        type: integer
        source: computed
        default: 0
        description: "Running count of modules recorded through POST /candidacies/{candidacy_id}/record-training"
      - name: ballot_position
        type: integer
        source: computed
        default: null
        description: "1-based print order within the office, assigned at ballot publish by created_at ASC"
      - name: petition_signature_total_count
        type: integer
        source: computed
        default: 0
        description: "Count of every PetitionSignature row pointing at this candidacy, in any status; conserved quantity of calculations.petition_ledger_conservation"
      - name: petition_signature_valid_count
        type: integer
        source: computed
        default: 0
        description: "Deduplicated count of VERIFIED signatures from eligible signers; see calculations.petition_signature_valid_count"
      - name: petition_signature_ineligible_count
        type: integer
        source: computed
        default: 0
        description: "VERIFIED signatures excluded by the eligibility or dedupe filters"
      - name: petition_signature_pending_count
        type: integer
        source: computed
        default: 0
        description: "Signatures still in status SUBMITTED"
      - name: petition_signature_rejected_count
        type: integer
        source: computed
        default: 0
        description: "Signatures adjudicated REJECTED"
      - name: petition_signature_voided_count
        type: integer
        source: computed
        default: 0
        description: "Signatures voided after adjudication"
      - name: spending_reported_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of amount_cents over every CampaignExpense row of this candidacy in any status; conserved quantity of calculations.spend_ledger_conservation"
      - name: spending_committed_cents
        type: integer
        source: computed
        default: 0
        description: "PROVISIONAL variant of calculations.campaign_spend_assessment; joint-and-several slate pool"
      - name: spending_reversed_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of amount_cents over CampaignExpense rows in status REVERSED"
      - name: spending_final_cents
        type: integer
        source: computed
        default: null
        description: "FINAL variant of calculations.campaign_spend_assessment; written in STEP 2 of the certification order"
      - name: poster_count
        type: integer
        source: computed
        default: 0
        description: "Sum of quantity over CampaignExpense rows with category POSTER and status in {REPORTED, APPROVED}"
      - name: penalty_points_total
        type: integer
        source: computed
        default: 0
        description: "Sum of penalty_points over ComplianceCase rows of this candidacy in status UPHELD"
      - name: slate_snapshot_member_ids
        type: array
        source: computed
        default: []
        description: "Candidacy id values frozen in STEP 1 of calculations.certification_evaluation_order, ordered created_at ASC; never re-derived afterwards"
      - name: raw_votes_count
        type: integer
        source: computed
        default: 0
        description: "Ballots naming this candidacy for its office in the current round, before any exclusion"
      - name: certified_votes_count
        type: integer
        source: computed
        default: 0
        description: "raw_votes_count, or 0 when the candidacy was disqualified in STEP 4"
      - name: provisional_share_pct
        type: number
        source: computed
        default: 0.00
        description: "PROVISIONAL variant of calculations.office_result_share"
      - name: certified_share_pct
        type: number
        source: computed
        default: 0.00
        description: "CERTIFIED variant of calculations.office_result_share; the only variant the runoff rule reads"
      - name: disqualified_reason
        type: string
        source: system
        default: null
        description: "Free text stamped when the candidacy is disqualified"
      - name: term_start_date
        type: datetime
        source: computed
        default: null
        description: "Copied from Office.term_start_date when the candidacy becomes ELECTED"
      - name: term_end_date
        type: datetime
        source: computed
        default: null
        description: "Copied from Office.term_end_date when the candidacy becomes ELECTED"
      - name: activated_at
        type: datetime
        source: system
        default: null
        description: "Instant the officer transition moved to ACTIVE"

  - name: PetitionSignature
    parent: null
    common_fields: true
    fields:
      - name: candidacy_id
        type: string
        source: input
        description: "FK -> Candidacy.id; the petition being signed"
      - name: signer_student_id
        type: string
        source: input
        description: "FK -> Student.id; the signing student, and the owner for StudentVoter-role ownership checks"
      - name: signed_at
        type: datetime
        source: input
        description: "Instant the paper petition was signed; the dedupe rule keeps the earliest signed_at per signer"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Adjudication state of the signature"
        constraints: "SUBMITTED | VERIFIED | REJECTED | VOIDED"
      - name: eligibility_result
        type: enum
        source: computed
        default: UNKNOWN
        description: "Why a VERIFIED signature does or does not count toward petition_signature_valid_count; re-evaluated whenever the signer's Student row changes"
        constraints: "UNKNOWN | ELIGIBLE | INELIGIBLE_NOT_ENROLLED | INELIGIBLE_CLASS_YEAR | INELIGIBLE_HOLD"
      - name: reject_reason
        type: string
        source: system
        default: null
        description: "Text supplied by the commissioner when the outcome is REJECTED"
      - name: verified_by_user_id
        type: string
        source: system
        default: null
        description: "Opaque X-User-ID of the ElectionCommissioner who adjudicated this signature"

  - name: CampaignExpense
    parent: null
    common_fields: true
    fields:
      - name: candidacy_id
        type: string
        source: input
        description: "FK -> Candidacy.id; the candidacy that reported the spend"
      - name: category
        type: enum
        source: input
        description: "Spend category; POSTER rows also feed the poster cap"
        constraints: "POSTER | DIGITAL | MERCH | EVENT"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount spent, in cents"
        constraints: ">= 0"
      - name: quantity
        type: integer
        source: input
        default: 0
        description: "Physical unit count; only POSTER rows contribute to Candidacy.poster_count"
        constraints: ">= 0"
      - name: shared_with_slate
        type: boolean
        source: input
        default: false
        description: "When true the line is pooled across the slate and split per calculations.slate_expense_allocation"
      - name: incurred_at
        type: datetime
        source: input
        description: "Instant the spend was incurred; must fall outside the pre-poll quiet period"
      - name: venue_code
        type: string
        source: input
        default: null
        description: "Campus venue booked for a campaign rally; required when category == EVENT, otherwise null"
      - name: event_starts_at
        type: datetime
        source: input
        default: null
        description: "First instant of the venue occupation; required when category == EVENT"
      - name: event_ends_at
        type: datetime
        source: input
        default: null
        description: "Last instant of the venue occupation; the interval is closed and is widened by TEARDOWN_BUFFER_MINUTES on both sides before the collision test"
      - name: status
        type: enum
        source: system
        default: REPORTED
        description: "Ledger state of the expense"
        constraints: "REPORTED | APPROVED | REVERSED"
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: "Opaque X-User-ID of the ElectionCommissioner who approved the line"

  - name: ComplianceCase
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: "FK -> Election.id; the election whose campaign rules were allegedly broken"
      - name: candidacy_id
        type: string
        source: input
        description: "FK -> Candidacy.id; the respondent candidacy"
      - name: rule_code
        type: string
        source: input
        description: "Campaign-rule clause cited, e.g. C-4.2"
      - name: severity
        type: enum
        source: input
        description: "Severity band feeding PENALTY_BASE in calculations.compliance_penalty_points"
        constraints: "MINOR | MAJOR | SEVERE"
      - name: description
        type: string
        source: input
        description: "Narrative of the alleged violation"
      - name: status
        type: enum
        source: system
        default: FILED
        description: "Adjudication state"
        constraints: "FILED | UPHELD | DISMISSED"
      - name: penalty_points
        type: integer
        source: computed
        default: 0
        description: "Points assessed when the case is upheld; see calculations.compliance_penalty_points"
      - name: prior_upheld_count
        type: integer
        source: computed
        default: 0
        description: "Number of earlier UPHELD cases against the same candidacy, used for repeat_multiplier"
      - name: timing_factor_applied
        type: number
        source: computed
        default: 1.0
        description: "1.5 when upheld inside the voting window, otherwise 1.0"
      - name: overspend_points_applied
        type: integer
        source: computed
        default: 0
        description: "Surcharge derived from the respondent's spend over the election cap, capped at 25"
      - name: filed_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ElectionCommissioner who filed the case"
      - name: adjudicated_by_user_id
        type: string
        source: system
        default: null
        description: "Opaque X-User-ID of the FacultyAdvisor who upheld or dismissed the case; barred from resolving an appeal that cites it"
      - name: upheld_at
        type: datetime
        source: system
        default: null
        description: "Instant the case was upheld; orders prior_upheld_count with created_at ASC as tie-break"

  - name: Referendum
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: "FK -> Election.id; the election whose ballot may carry this amendment"
      - name: title
        type: string
        source: input
        description: "Short title of the constitutional amendment"
      - name: article_reference
        type: string
        source: input
        description: "Constitution article being amended, e.g. Art. VII Sec. 3"
      - name: body_text
        type: string
        source: input
        description: "Full amendment text presented to voters"
      - name: approval_threshold_pct
        type: number
        source: input
        default: 66.67
        description: "Yes share of decisive votes required to pass, evaluated with >="
        constraints: "0.00..100.00, 2 decimal places"
      - name: drafting_status
        type: enum
        source: system
        default: DRAFT
        description: "First independent axis: how far the amendment has moved toward the ballot"
        constraints: "DRAFT | SUBMITTED | RETURNED | APPROVED_FOR_BALLOT | ON_BALLOT"
      - name: outcome_status
        type: enum
        source: system
        default: PENDING
        description: "Second independent axis: how the electorate decided it"
        constraints: "PENDING | PASSED | FAILED | QUORUM_NOT_MET"
      - name: yes_votes_count
        type: integer
        source: computed
        default: 0
        description: "Ballots selecting YES on this referendum"
      - name: no_votes_count
        type: integer
        source: computed
        default: 0
        description: "Ballots selecting NO on this referendum"
      - name: abstain_votes_count
        type: integer
        source: computed
        default: 0
        description: "Ballots selecting ABSTAIN on this referendum; excluded from the approval denominator"
      - name: approval_pct
        type: number
        source: computed
        default: 0.00
        description: "100 * yes_votes_count / (yes_votes_count + no_votes_count), round_half_up 2 dp"
      - name: return_reason
        type: string
        source: system
        default: null
        description: "Commissioner note recorded when the amendment is returned for redrafting"

  - name: Ballot
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: "FK -> Election.id; the election this ballot serves"
      - name: round
        type: integer
        source: input
        default: 1
        description: "1 for the general ballot, 2 for the runoff ballot"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Construction state of the ballot"
        constraints: "DRAFT | LOCKED | PUBLISHED | CLOSED | VOIDED"
      - name: line_count
        type: integer
        source: computed
        default: 0
        description: "Total BallotLine rows on this ballot in any status"
      - name: active_line_count
        type: integer
        source: computed
        default: 0
        description: "BallotLine rows in status ACTIVE; decremented by the third hop of the disqualification cascade"
      - name: locked_at
        type: datetime
        source: system
        default: null
        description: "Instant the ballot was locked; STEP 1 of the certification order freezes slate membership as of this instant"
      - name: published_at
        type: datetime
        source: system
        default: null
        description: "Instant the ballot became visible to voters"

  - name: BallotLine
    parent: null
    common_fields: true
    fields:
      - name: ballot_id
        type: string
        source: input
        description: "FK -> Ballot.id; the ballot this line prints on"
      - name: office_id
        type: string
        source: input
        default: null
        description: "FK -> Office.id; set on CANDIDATE lines, null on REFERENDUM lines"
      - name: candidacy_id
        type: string
        source: input
        default: null
        description: "FK -> Candidacy.id; set on CANDIDATE lines, null on REFERENDUM lines"
      - name: referendum_id
        type: string
        source: input
        default: null
        description: "FK -> Referendum.id; set on REFERENDUM lines, null on CANDIDATE lines"
      - name: line_type
        type: enum
        source: input
        description: "Discriminator for the polymorphic reference"
        constraints: "CANDIDATE | REFERENDUM"
      - name: position
        type: integer
        source: computed
        description: "1-based print order within (ballot_id, office_id) for CANDIDATE lines, or within the ballot for REFERENDUM lines; assigned created_at ASC"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE until the referenced candidacy is disqualified, then VOIDED"
        constraints: "ACTIVE | VOIDED"

  - name: Vote
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: computed
        description: "FK -> Election.id; copied from the ballot at cast time"
      - name: ballot_id
        type: string
        source: input
        description: "FK -> Ballot.id; the published ballot the voter marked"
      - name: student_id
        type: string
        source: computed
        description: "FK -> Student.id; taken from the X-User-ID of the casting StudentVoter"
      - name: round
        type: integer
        source: computed
        description: "Copied from Ballot.round; one vote per student per election per round"
      - name: selections
        type: array
        source: input
        description: "Array of marks; a CANDIDATE mark is {office_id, candidacy_id} with candidacy_id null meaning abstain, a REFERENDUM mark is {referendum_id, choice} with choice in {YES, NO, ABSTAIN}"
      - name: status
        type: enum
        source: system
        default: CAST
        description: "CAST until voided by a FacultyAdvisor"
        constraints: "CAST | VOIDED"
      - name: cast_at
        type: datetime
        source: system
        description: "Logical-clock instant the vote was accepted"
      - name: void_reason
        type: string
        source: system
        default: null
        description: "Advisor note recorded when a vote is voided"

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: "FK -> Election.id; the election whose result or ruling is challenged"
      - name: candidacy_id
        type: string
        source: input
        description: "FK -> Candidacy.id; the appellant candidacy, and the owner for Candidate-role ownership checks"
      - name: compliance_case_id
        type: string
        source: input
        default: null
        description: "FK -> ComplianceCase.id; the ruling being appealed, or null for a pure results appeal"
      - name: grounds
        type: string
        source: input
        description: "Narrative grounds for the appeal"
      - name: remedy_requested
        type: enum
        source: input
        description: "Relief sought"
        constraints: "RECOUNT | REINSTATEMENT | VOID_ELECTION"
      - name: status
        type: enum
        source: system
        default: FILED
        description: "Resolution state"
        constraints: "FILED | SUSTAINED | DENIED"
      - name: resolved_by_user_id
        type: string
        source: system
        default: null
        description: "Opaque X-User-ID of the FacultyAdvisor who resolved the appeal"
      - name: resolution_note
        type: string
        source: system
        default: null
        description: "Advisor note recorded at resolution"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the appeal was filed"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Election
  # Shape: linear spine with a fork at TALLYING (CERTIFIED vs RUNOFF_SCHEDULED,
  # divergent side-effect sets) and two cycles (RUNOFF_SCHEDULED ->
  # BALLOT_BUILDING, CERTIFIED -> TALLYING).
  - entity: Election
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PETITIONING
        trigger: "POST /elections/{election_id}/open-petitioning"
        actor: ElectionCommissioner
        preconditions:
          - "at least one Office row exists with election_id == this election"
          - "logical clock now < Election.petition_deadline"
        side_effects:
          - "increments Election.version by 1"

      - from: PETITIONING
        to: BALLOT_BUILDING
        trigger: "POST /ballots with round == 1"
        actor: ElectionCommissioner
        preconditions:
          - "logical clock now >= Election.petition_deadline"
          - "payload expected_election_version == Election.version"
        side_effects:
          - "creates Ballot(round=1) in status DRAFT"
          - "any pre-existing Ballot for the same election and round in status DRAFT transitions DRAFT -> VOIDED"
          - "increments Election.version by 1"

      - from: RUNOFF_SCHEDULED
        to: BALLOT_BUILDING
        trigger: "POST /ballots with round == 2"
        actor: ElectionCommissioner
        preconditions:
          - "Election.runoff_required_office_count >= 1"
          - "payload expected_election_version == Election.version"
        side_effects:
          - "creates Ballot(round=2) in status DRAFT"
          - "sets Election.current_round = 2"
          - "increments Election.version by 1"
        note: "Cycle: the runoff re-enters ballot construction."

      - from: BALLOT_BUILDING
        to: BALLOT_BUILDING
        trigger: "POST /ballots for the round already under construction"
        actor: ElectionCommissioner
        preconditions:
          - "payload expected_election_version == Election.version"
          - "the existing Ballot for this election and round is in status DRAFT"
        side_effects:
          - "the existing DRAFT ballot transitions DRAFT -> VOIDED together with all of its lines"
          - "creates a replacement Ballot in status DRAFT"
          - "increments Election.version by 1"
        note: "Self-loop: a replacement ballot legitimately supersedes the prior draft, which is exactly why POST /ballots carries the OCC guard."

      - from: BALLOT_BUILDING
        to: BALLOT_PUBLISHED
        trigger: "POST /ballots/{ballot_id}/publish"
        actor: ElectionCommissioner
        preconditions:
          - "Ballot.status == LOCKED"
          - "Ballot.round == Election.current_round"
        side_effects:
          - "Ballot LOCKED -> PUBLISHED and Ballot.published_at stamped from the logical clock"
          - "assigns Candidacy.ballot_position per office, 1-based, ordered by Candidacy.created_at ASC over ACTIVE CANDIDATE lines"
          - "increments Election.version by 1"

      - from: BALLOT_PUBLISHED
        to: VOTING_OPEN
        trigger: "POST /elections/{election_id}/open-voting"
        actor: ElectionCommissioner
        preconditions:
          - "a Ballot with round == Election.current_round exists in status PUBLISHED"
          - "payload voting_opens_at < payload voting_closes_at"
          - "no other Election with the same academic_year has a half-open window [voting_opens_at, voting_closes_at) intersecting the payload window"
        side_effects:
          - "sets Election.voting_opens_at and Election.voting_closes_at from the payload"
          - "when Election.current_round == 1, freezes Election.eligible_voter_count per calculations.election_turnout"
          - "increments Election.version by 1"

      - from: VOTING_OPEN
        to: VOTING_CLOSED
        trigger: "POST /elections/{election_id}/close-voting"
        actor: ElectionCommissioner
        preconditions:
          - "logical clock now >= Election.voting_closes_at"
        side_effects:
          - "Ballot(round=current_round) PUBLISHED -> CLOSED"
          - "recomputes Election.ballots_cast_count and Election.turnout_pct per calculations.election_turnout"
          - "increments Election.version by 1"

      - from: VOTING_CLOSED
        to: TALLYING
        trigger: "POST /elections/{election_id}/tally"
        actor: ElectionCommissioner
        preconditions:
          - "Election.status == VOTING_CLOSED"
        side_effects:
          - "executes calculations.certification_evaluation_order STEP 1 (freeze Candidacy.slate_snapshot_member_ids from Ballot.locked_at state)"
          - "STEP 2 writes Candidacy.spending_final_cents per calculations.campaign_spend_assessment variant FINAL"
          - "STEP 3 recomputes ComplianceCase.penalty_points and Candidacy.penalty_points_total per calculations.compliance_penalty_points variant AT_CERTIFICATION"
          - "STEP 4 disqualification sweep: every ON_BALLOT candidacy with penalty_points_total >= DISQUALIFICATION_POINT_THRESHOLD transitions ON_BALLOT -> DISQUALIFIED"
          - "STEP 5 writes Candidacy.raw_votes_count, Candidacy.certified_votes_count, Office.valid_votes_count, Office.abstain_votes_count, Office.invalidated_votes_count"
          - "STEP 6 writes Candidacy.provisional_share_pct and Candidacy.certified_share_pct per calculations.office_result_share, Election.runoff_required_office_count, and Referendum.outcome_status per calculations.referendum_outcome"
          - "increments Election.version by 1"

      - from: TALLYING
        to: CERTIFIED
        trigger: "POST /elections/{election_id}/certify"
        actor: FacultyAdvisor
        preconditions:
          - "Election.runoff_required_office_count == 0"
        side_effects:
          - "for every Office, the top seat_count candidacies by (certified_votes_count DESC, petition_signature_valid_count DESC, created_at ASC) transition ON_BALLOT -> ELECTED; their term_start_date and term_end_date are copied from the Office"
          - "each newly ELECTED candidacy transitions transition_status NOT_APPLICABLE -> PENDING"
          - "every remaining ON_BALLOT candidacy transitions ON_BALLOT -> ELIMINATED"
          - "Office.status -> DECIDED and Office.filled_seat_count set to the number of ELECTED candidacies"
          - "stamps Election.certified_by_user_id from X-User-ID and Election.certified_at from the logical clock"
          - "increments Election.version by 1"
        note: "Fork arm A. Complementary to the RUNOFF_SCHEDULED arm below; the two arms share a trigger and differ only in the runoff_required_office_count precondition."

      - from: TALLYING
        to: RUNOFF_SCHEDULED
        trigger: "POST /elections/{election_id}/certify"
        actor: FacultyAdvisor
        preconditions:
          - "Election.runoff_required_office_count >= 1"
        side_effects:
          - "for every Office with status RUNOFF_REQUIRED, the top (seat_count + 1) candidacies by (certified_votes_count DESC, petition_signature_valid_count DESC, created_at ASC), plus every candidacy tied on certified_votes_count with the last of them, transition ON_BALLOT -> RUNOFF_QUALIFIED"
          - "every other ON_BALLOT candidacy of a RUNOFF_REQUIRED office transitions ON_BALLOT -> ELIMINATED"
          - "for every Office with status DECIDED nothing changes; its winners were already resolved in STEP 6"
          - "Election.certified_by_user_id and Election.certified_at are NOT stamped"
          - "increments Election.version by 1"
        note: "Fork arm B. No officer transition rows are opened and no certification identity is recorded — the divergent side-effect set relative to arm A."

      - from: CERTIFIED
        to: TALLYING
        trigger: "POST /appeals/{appeal_id}/sustain with remedy_requested == RECOUNT"
        actor: FacultyAdvisor
        preconditions:
          - "Appeal.status == FILED and Appeal.election_id == this election"
          - "Appeal.remedy_requested == RECOUNT"
        side_effects:
          - "clears Election.certified_by_user_id and Election.certified_at"
          - "every ELECTED candidacy of this election transitions ELECTED -> ON_BALLOT and its transition_status returns to NOT_APPLICABLE"
          - "every ELIMINATED candidacy of this election transitions ELIMINATED -> ON_BALLOT"
          - "increments Election.version by 1"
        note: "Cycle: a sustained recount re-opens the tally."

      - from: CERTIFIED
        to: CLOSED
        trigger: "POST /elections/{election_id}/run-transition-checkpoint"
        actor: ElectionCommissioner
        preconditions:
          - "every Candidacy of this election in status ELECTED has transition_status == ACTIVE"
          - "logical clock now >= the maximum Office.term_start_date across the election's offices"
        side_effects:
          - "increments Election.version by 1"

  # ------------------------------------------------- Candidacy — axis 1 of 2
  # Shape: cyclic. UNDER_REVIEW <-> RETURNED, ELIGIBLE -> PETITION_DEFICIENT ->
  # UNDER_REVIEW, ELIGIBLE <-> SLATE_SUSPENDED, RUNOFF_QUALIFIED -> ON_BALLOT,
  # DISQUALIFIED -> ON_BALLOT and ELIMINATED -> ELECTED.
  - entity: Candidacy
    state_field: status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, VACATED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /candidacies/{candidacy_id}/submit-petition"
        actor: Candidate
        preconditions:
          - "Election.status == PETITIONING"
          - "logical clock now < Election.petition_deadline"
          - "Student.enrollment_status == ENROLLED, Student.disciplinary_hold == false, Student.class_year IN Office.eligible_class_years, Student.gpa >= Office.min_gpa, Student.credits_completed >= Office.min_credits"
        side_effects:
          - "increments Candidacy.version by 1"

      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /candidacies/{candidacy_id}/return"
        actor: ElectionCommissioner
        preconditions:
          - "Election.status == PETITIONING"
        side_effects:
          - "increments Candidacy.version by 1"

      - from: RETURNED
        to: UNDER_REVIEW
        trigger: "POST /candidacies/{candidacy_id}/submit-petition"
        actor: Candidate
        preconditions:
          - "Election.status == PETITIONING"
          - "logical clock now < Election.petition_deadline"
        side_effects:
          - "increments Candidacy.version by 1"
        note: "Revision loop."

      - from: UNDER_REVIEW
        to: ELIGIBLE
        trigger: "POST /candidacies/{candidacy_id}/approve"
        actor: ElectionCommissioner
        preconditions:
          - "Election.status == PETITIONING"
          - "logical clock now <= Election.petition_deadline"
          - "Candidacy.petition_signature_valid_count >= Office.required_signature_count"
        side_effects:
          - "every Candidacy whose slate_leader_candidacy_id equals this candidacy and whose status is SLATE_SUSPENDED transitions SLATE_SUSPENDED -> ELIGIBLE"
          - "increments Candidacy.version by 1"

      - from: ELIGIBLE
        to: PETITION_DEFICIENT
        trigger: "system: recomputation of Candidacy.petition_signature_valid_count after POST /petition-signatures/{petition_signature_id}/void"
        actor: system
        preconditions:
          - "the recomputed Candidacy.petition_signature_valid_count < Office.required_signature_count"
        side_effects:
          - "hop 3 of the petition-void cascade: every Candidacy whose slate_leader_candidacy_id equals this candidacy and whose status is ELIGIBLE transitions ELIGIBLE -> SLATE_SUSPENDED"
          - "increments Candidacy.version by 1"

      - from: PETITION_DEFICIENT
        to: UNDER_REVIEW
        trigger: "POST /candidacies/{candidacy_id}/submit-petition"
        actor: Candidate
        preconditions:
          - "Election.status == PETITIONING"
          - "logical clock now < Election.petition_deadline"
        side_effects:
          - "increments Candidacy.version by 1"
        note: "Cycle back into review after a deficiency."

      - from: ELIGIBLE
        to: SLATE_SUSPENDED
        trigger: "system: hop 3 of the petition-void cascade on this candidacy's slate leader"
        actor: system
        preconditions:
          - "Candidacy.slate_leader_candidacy_id points at a candidacy that just entered PETITION_DEFICIENT"
        side_effects:
          - "increments Candidacy.version by 1"

      - from: SLATE_SUSPENDED
        to: ELIGIBLE
        trigger: "system: the slate leader is re-approved via POST /candidacies/{candidacy_id}/approve"
        actor: system
        preconditions:
          - "the leader named by Candidacy.slate_leader_candidacy_id is in status ELIGIBLE"
        side_effects:
          - "increments Candidacy.version by 1"

      - from: ELIGIBLE
        to: ON_BALLOT
        trigger: "POST /ballots/{ballot_id}/lock"
        actor: ElectionCommissioner
        preconditions:
          - "a BallotLine with status ACTIVE, line_type CANDIDATE and candidacy_id == this candidacy exists on the ballot being locked"
        side_effects:
          - "Office.status OPEN -> CONTESTED"
          - "increments Candidacy.version by 1"

      - from: RUNOFF_QUALIFIED
        to: ON_BALLOT
        trigger: "POST /ballots/{ballot_id}/lock with Ballot.round == 2"
        actor: ElectionCommissioner
        preconditions:
          - "a BallotLine with status ACTIVE, line_type CANDIDATE and candidacy_id == this candidacy exists on the round-2 ballot"
        side_effects:
          - "increments Candidacy.version by 1"
        note: "Cycle: runoff qualifiers return to the ballot."

      - from: ON_BALLOT
        to: ELECTED
        trigger: "POST /elections/{election_id}/certify (fork arm A)"
        actor: FacultyAdvisor
        preconditions:
          - "this candidacy is within the top Office.seat_count by (certified_votes_count DESC, petition_signature_valid_count DESC, created_at ASC)"
          - "Election.runoff_required_office_count == 0"
        side_effects:
          - "copies Office.term_start_date and Office.term_end_date onto the candidacy"
          - "transition_status NOT_APPLICABLE -> PENDING"
          - "increments Office.filled_seat_count by 1"
          - "increments Candidacy.version by 1"

      - from: ON_BALLOT
        to: ELIMINATED
        trigger: "POST /elections/{election_id}/certify"
        actor: FacultyAdvisor
        preconditions:
          - "this candidacy is not among the winners of fork arm A nor among the runoff qualifiers of fork arm B"
        side_effects:
          - "increments Candidacy.version by 1"

      - from: ON_BALLOT
        to: RUNOFF_QUALIFIED
        trigger: "POST /elections/{election_id}/certify (fork arm B)"
        actor: FacultyAdvisor
        preconditions:
          - "Office.status == RUNOFF_REQUIRED"
          - "this candidacy is within the top (Office.seat_count + 1) by certified_votes_count, or is tied on certified_votes_count with the last of them"
        side_effects:
          - "increments Candidacy.version by 1"

      - from: ON_BALLOT
        to: DISQUALIFIED
        trigger: "system: hop 2 of the compliance cascade after POST /compliance-cases/{compliance_case_id}/uphold, or STEP 4 of the certification order"
        actor: system
        preconditions:
          - "the recomputed Candidacy.penalty_points_total >= DISQUALIFICATION_POINT_THRESHOLD"
        side_effects:
          - "stamps Candidacy.disqualified_reason"
          - "hop 3: every BallotLine with candidacy_id == this candidacy and status ACTIVE transitions ACTIVE -> VOIDED and Ballot.active_line_count is decremented by 1"
          - "increments Candidacy.version by 1"

      - from: ELIGIBLE
        to: DISQUALIFIED
        trigger: "system: hop 2 of the compliance cascade after POST /compliance-cases/{compliance_case_id}/uphold"
        actor: system
        preconditions:
          - "the recomputed Candidacy.penalty_points_total >= DISQUALIFICATION_POINT_THRESHOLD"
        side_effects:
          - "stamps Candidacy.disqualified_reason"
          - "increments Candidacy.version by 1"

      - from: DISQUALIFIED
        to: ON_BALLOT
        trigger: "POST /appeals/{appeal_id}/sustain with remedy_requested == REINSTATEMENT"
        actor: FacultyAdvisor
        preconditions:
          - "Appeal.candidacy_id == this candidacy and Appeal.status == FILED"
          - "Appeal.compliance_case_id is not null"
        side_effects:
          - "the cited ComplianceCase transitions UPHELD -> DISMISSED and its penalty_points is reset to 0"
          - "Candidacy.penalty_points_total is recomputed and Candidacy.disqualified_reason cleared"
          - "every BallotLine with candidacy_id == this candidacy and status VOIDED transitions VOIDED -> ACTIVE and Ballot.active_line_count is incremented by 1"
          - "increments Candidacy.version by 1"
        note: "Cycle: a sustained reinstatement puts the candidacy back on the ballot."

      - from: ELIMINATED
        to: ELECTED
        trigger: "system: hop 3 of the officer-transition cascade after POST /elections/{election_id}/run-transition-checkpoint"
        actor: system
        preconditions:
          - "the candidacy's Office is in status VACANT_SEAT"
          - "the candidacy ranks first among that office's ELIMINATED candidacies by (certified_votes_count DESC, petition_signature_valid_count DESC, created_at ASC)"
        side_effects:
          - "copies Office.term_start_date and Office.term_end_date onto the candidacy"
          - "transition_status NOT_APPLICABLE -> PENDING"
          - "Office.filled_seat_count incremented by 1 and Office.status VACANT_SEAT -> DECIDED"
          - "increments Candidacy.version by 1"

      - from: ELECTED
        to: VACATED
        trigger: "system: hop 2 of the officer-transition cascade after POST /elections/{election_id}/run-transition-checkpoint"
        actor: system
        preconditions:
          - "the candidacy's transition_status has just moved PENDING -> LAPSED"
        side_effects:
          - "Office.filled_seat_count decremented by 1 and Office.status DECIDED -> VACANT_SEAT"
          - "increments Candidacy.version by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /candidacies/{candidacy_id}/withdraw"
        actor: Candidate
        preconditions:
          - "Election.status IN {PETITIONING, BALLOT_BUILDING}"
        side_effects:
          - "increments Candidacy.version by 1"

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /candidacies/{candidacy_id}/withdraw"
        actor: Candidate
        preconditions:
          - "Election.status IN {PETITIONING, BALLOT_BUILDING}"
        side_effects:
          - "increments Candidacy.version by 1"

      - from: RETURNED
        to: WITHDRAWN
        trigger: "POST /candidacies/{candidacy_id}/withdraw"
        actor: Candidate
        preconditions:
          - "Election.status IN {PETITIONING, BALLOT_BUILDING}"
        side_effects:
          - "increments Candidacy.version by 1"

      - from: ELIGIBLE
        to: WITHDRAWN
        trigger: "POST /candidacies/{candidacy_id}/withdraw"
        actor: Candidate
        preconditions:
          - "Election.status IN {PETITIONING, BALLOT_BUILDING}"
        side_effects:
          - "every BallotLine with candidacy_id == this candidacy and status ACTIVE transitions ACTIVE -> VOIDED"
          - "increments Candidacy.version by 1"

      - from: PETITION_DEFICIENT
        to: WITHDRAWN
        trigger: "POST /candidacies/{candidacy_id}/withdraw"
        actor: Candidate
        preconditions:
          - "Election.status IN {PETITIONING, BALLOT_BUILDING}"
        side_effects:
          - "increments Candidacy.version by 1"

      - from: SLATE_SUSPENDED
        to: WITHDRAWN
        trigger: "POST /candidacies/{candidacy_id}/withdraw"
        actor: Candidate
        preconditions:
          - "Election.status IN {PETITIONING, BALLOT_BUILDING}"
        side_effects:
          - "increments Candidacy.version by 1"

  # ------------------------------------------------- Candidacy — axis 2 of 2
  # Parallel dimension: transition_status evolves independently of status.
  - entity: Candidacy
    state_field: transition_status
    initial_state: NOT_APPLICABLE
    terminal_states: [ACTIVE, LAPSED]
    transitions:
      - from: NOT_APPLICABLE
        to: PENDING
        trigger: "system: the candidacy enters status ELECTED (certify fork arm A, or hop 3 of the officer-transition cascade)"
        actor: system
        preconditions:
          - "Candidacy.status == ELECTED"
        side_effects:
          - "increments Candidacy.version by 1"

      - from: PENDING
        to: TRAINING_COMPLETE
        trigger: "POST /candidacies/{candidacy_id}/record-training"
        actor: Candidate
        preconditions:
          - "Candidacy.training_modules_completed after this call >= Office.required_training_modules"
        side_effects:
          - "adds the payload modules_completed to Candidacy.training_modules_completed"
          - "increments Candidacy.version by 1"
        note: "When the running total is still short of the requirement the call succeeds, the counter advances and transition_status stays PENDING."

      - from: TRAINING_COMPLETE
        to: ACTIVE
        trigger: "POST /candidacies/{candidacy_id}/activate-officer"
        actor: FacultyAdvisor
        preconditions:
          - "Election.status == CERTIFIED"
          - "logical clock now >= Candidacy.term_start_date"
        side_effects:
          - "stamps Candidacy.activated_at from the logical clock"
          - "increments Candidacy.version by 1"
        note: "transition_status PENDING is NOT treated as an invalid from-state for this endpoint; the request passes the priority-9 state gate and is refused at priority 31 with ERR_TRAINING_INCOMPLETE so the officer learns why."

      - from: PENDING
        to: LAPSED
        trigger: "POST /elections/{election_id}/run-transition-checkpoint"
        actor: ElectionCommissioner
        preconditions:
          - "logical clock now > Candidacy.term_start_date"
          - "Candidacy.training_modules_completed < Office.required_training_modules"
        side_effects:
          - "hop 2 of the officer-transition cascade: Candidacy.status ELECTED -> VACATED"
          - "increments Candidacy.version by 1"

  # --------------------------------------------------- Referendum — axis 1/2
  - entity: Referendum
    state_field: drafting_status
    initial_state: DRAFT
    terminal_states: [ON_BALLOT]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /referenda/{referendum_id}/submit"
        actor: StudentVoter
        preconditions:
          - "Election.status == PETITIONING"
        side_effects:
          - "increments Referendum.version by 1"
      - from: SUBMITTED
        to: APPROVED_FOR_BALLOT
        trigger: "POST /referenda/{referendum_id}/review with outcome == APPROVE"
        actor: ElectionCommissioner
        preconditions:
          - "Election.status IN {PETITIONING, BALLOT_BUILDING}"
        side_effects:
          - "increments Referendum.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /referenda/{referendum_id}/review with outcome == RETURN"
        actor: ElectionCommissioner
        preconditions:
          - "Election.status IN {PETITIONING, BALLOT_BUILDING}"
        side_effects:
          - "stamps Referendum.return_reason from the payload"
          - "increments Referendum.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /referenda/{referendum_id}/submit"
        actor: StudentVoter
        preconditions:
          - "Election.status == PETITIONING"
        side_effects:
          - "clears Referendum.return_reason"
          - "increments Referendum.version by 1"
        note: "Redraft loop."
      - from: APPROVED_FOR_BALLOT
        to: ON_BALLOT
        trigger: "POST /ballots/{ballot_id}/lock"
        actor: ElectionCommissioner
        preconditions:
          - "a BallotLine with status ACTIVE, line_type REFERENDUM and referendum_id == this referendum exists on the ballot being locked"
        side_effects:
          - "increments Referendum.version by 1"

  # --------------------------------------------------- Referendum — axis 2/2
  - entity: Referendum
    state_field: outcome_status
    initial_state: PENDING
    terminal_states: [PASSED, FAILED, QUORUM_NOT_MET]
    transitions:
      - from: PENDING
        to: QUORUM_NOT_MET
        trigger: "POST /elections/{election_id}/tally (STEP 6)"
        actor: ElectionCommissioner
        preconditions:
          - "Election.turnout_pct < Election.quorum_pct"
        side_effects:
          - "writes Referendum.yes_votes_count, no_votes_count, abstain_votes_count and approval_pct"
          - "increments Referendum.version by 1"
      - from: PENDING
        to: PASSED
        trigger: "POST /elections/{election_id}/tally (STEP 6)"
        actor: ElectionCommissioner
        preconditions:
          - "Election.turnout_pct >= Election.quorum_pct"
          - "yes_votes_count + no_votes_count > 0"
          - "Referendum.approval_pct >= Referendum.approval_threshold_pct"
        side_effects:
          - "increments Referendum.version by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /elections/{election_id}/tally (STEP 6)"
        actor: ElectionCommissioner
        preconditions:
          - "Election.turnout_pct >= Election.quorum_pct"
          - "yes_votes_count + no_votes_count == 0, or Referendum.approval_pct < Referendum.approval_threshold_pct"
        side_effects:
          - "increments Referendum.version by 1"

  # ------------------------------------------------------- PetitionSignature
  - entity: PetitionSignature
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /petition-signatures/{petition_signature_id}/adjudicate with outcome == VERIFIED"
        actor: ElectionCommissioner
        preconditions:
          - "Election.status == PETITIONING"
        side_effects:
          - "stamps PetitionSignature.verified_by_user_id and PetitionSignature.eligibility_result"
          - "recomputes the five Candidacy petition counters per calculations.petition_signature_valid_count"
          - "increments PetitionSignature.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /petition-signatures/{petition_signature_id}/adjudicate with outcome == REJECTED"
        actor: ElectionCommissioner
        preconditions:
          - "Election.status == PETITIONING"
        side_effects:
          - "stamps PetitionSignature.reject_reason and PetitionSignature.verified_by_user_id"
          - "recomputes the five Candidacy petition counters"
          - "increments PetitionSignature.version by 1"
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /petition-signatures/{petition_signature_id}/void"
        actor: ElectionCommissioner
        preconditions:
          - "Election.status IN {PETITIONING, BALLOT_BUILDING}"
        side_effects:
          - "hop 1 of the petition-void cascade; recomputes the five Candidacy petition counters"
          - "hop 2: when the recomputed valid count drops below Office.required_signature_count and the candidacy is ELIGIBLE, Candidacy ELIGIBLE -> PETITION_DEFICIENT"
          - "increments PetitionSignature.version by 1"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /petition-signatures/{petition_signature_id}/void"
        actor: ElectionCommissioner
        preconditions:
          - "Election.status IN {PETITIONING, BALLOT_BUILDING}"
        side_effects:
          - "recomputes the five Candidacy petition counters"
          - "increments PetitionSignature.version by 1"

  # ---------------------------------------------------------- CampaignExpense
  - entity: CampaignExpense
    state_field: status
    initial_state: REPORTED
    terminal_states: [REVERSED]
    transitions:
      - from: REPORTED
        to: APPROVED
        trigger: "POST /campaign-expenses/{campaign_expense_id}/approve"
        actor: ElectionCommissioner
        preconditions:
          - "Candidacy.status NOT IN {WITHDRAWN, DISQUALIFIED, VACATED}"
        side_effects:
          - "stamps CampaignExpense.approved_by_user_id"
          - "recomputes Candidacy.spending_committed_cents for every slate member per calculations.campaign_spend_assessment variant PROVISIONAL"
          - "increments CampaignExpense.version by 1"
      - from: REPORTED
        to: REVERSED
        trigger: "POST /campaign-expenses/{campaign_expense_id}/reverse"
        actor: ElectionCommissioner
        preconditions: []
        side_effects:
          - "recomputes Candidacy.spending_committed_cents and Candidacy.spending_reversed_cents for every slate member"
          - "recomputes Candidacy.poster_count when category == POSTER"
          - "increments CampaignExpense.version by 1"
      - from: APPROVED
        to: REVERSED
        trigger: "POST /campaign-expenses/{campaign_expense_id}/reverse"
        actor: ElectionCommissioner
        preconditions: []
        side_effects:
          - "recomputes Candidacy.spending_committed_cents and Candidacy.spending_reversed_cents for every slate member, preserving calculations.spend_ledger_conservation"
          - "recomputes Candidacy.poster_count when category == POSTER"
          - "increments CampaignExpense.version by 1"

  # ----------------------------------------------------------- ComplianceCase
  - entity: ComplianceCase
    state_field: status
    initial_state: FILED
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: FILED
        to: UPHELD
        trigger: "POST /compliance-cases/{compliance_case_id}/uphold"
        actor: FacultyAdvisor
        preconditions:
          - "Candidacy.status NOT IN {WITHDRAWN, VACATED}"
        side_effects:
          - "hop 1: writes ComplianceCase.penalty_points, prior_upheld_count, timing_factor_applied and overspend_points_applied per calculations.compliance_penalty_points variant AT_ADJUDICATION, stamps adjudicated_by_user_id and upheld_at"
          - "hop 2: recomputes Candidacy.penalty_points_total; when it reaches DISQUALIFICATION_POINT_THRESHOLD the candidacy transitions to DISQUALIFIED"
          - "hop 3 (caused by hop 2): every ACTIVE BallotLine of that candidacy transitions ACTIVE -> VOIDED and Ballot.active_line_count is decremented"
          - "hop 4 (caused by hop 3): because a line was voided on a Ballot in status LOCKED, PUBLISHED or CLOSED, Election.ballot_integrity_status -> RECOUNT_REQUIRED, and when Election.status == CERTIFIED it also transitions CERTIFIED -> TALLYING with certified_by_user_id and certified_at cleared"
          - "increments ComplianceCase.version by 1"
      - from: FILED
        to: DISMISSED
        trigger: "POST /compliance-cases/{compliance_case_id}/dismiss"
        actor: FacultyAdvisor
        preconditions: []
        side_effects:
          - "stamps ComplianceCase.adjudicated_by_user_id; penalty_points stays 0"
          - "increments ComplianceCase.version by 1"
      - from: UPHELD
        to: DISMISSED
        trigger: "POST /appeals/{appeal_id}/sustain with remedy_requested == REINSTATEMENT"
        actor: FacultyAdvisor
        preconditions:
          - "the appeal cites this case through Appeal.compliance_case_id"
        side_effects:
          - "resets ComplianceCase.penalty_points to 0 and recomputes Candidacy.penalty_points_total"
          - "increments ComplianceCase.version by 1"

  # -------------------------------------------------------------------- Ballot
  - entity: Ballot
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /ballots/{ballot_id}/lock"
        actor: ElectionCommissioner
        preconditions:
          - "Election.status == BALLOT_BUILDING"
          - "every Office of the election has at least one ACTIVE CANDIDATE BallotLine on this ballot"
        side_effects:
          - "stamps Ballot.locked_at from the logical clock"
          - "every referenced ELIGIBLE candidacy transitions ELIGIBLE -> ON_BALLOT (round 1) or RUNOFF_QUALIFIED -> ON_BALLOT (round 2)"
          - "every referenced APPROVED_FOR_BALLOT referendum transitions to ON_BALLOT"
          - "increments Ballot.version by 1"
      - from: LOCKED
        to: PUBLISHED
        trigger: "POST /ballots/{ballot_id}/publish"
        actor: ElectionCommissioner
        preconditions:
          - "Election.status == BALLOT_BUILDING"
        side_effects:
          - "Election BALLOT_BUILDING -> BALLOT_PUBLISHED"
          - "increments Ballot.version by 1"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /elections/{election_id}/close-voting"
        actor: ElectionCommissioner
        preconditions:
          - "Ballot.round == Election.current_round"
        side_effects:
          - "increments Ballot.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /ballots — a replacement ballot is created for the same election and round"
        actor: ElectionCommissioner
        preconditions:
          - "the incoming create carries expected_election_version == Election.version"
        side_effects:
          - "every BallotLine of the superseded ballot transitions ACTIVE -> VOIDED"
          - "increments Ballot.version by 1"

  # ---------------------------------------------------------------- BallotLine
  - entity: BallotLine
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "system: hop 3 of the compliance cascade, candidacy withdrawal, or supersession of a DRAFT ballot"
        actor: system
        preconditions:
          - "the referenced Candidacy left the set {ELIGIBLE, ON_BALLOT, RUNOFF_QUALIFIED}, or the parent ballot was superseded"
        side_effects:
          - "decrements Ballot.active_line_count by 1"
          - "increments BallotLine.version by 1"
      - from: VOIDED
        to: ACTIVE
        trigger: "POST /appeals/{appeal_id}/sustain with remedy_requested == REINSTATEMENT"
        actor: FacultyAdvisor
        preconditions:
          - "the referenced Candidacy returns to ON_BALLOT and the parent Ballot.status != VOIDED"
        side_effects:
          - "increments Ballot.active_line_count by 1"
          - "increments BallotLine.version by 1"

  # ---------------------------------------------------------------------- Vote
  - entity: Vote
    state_field: status
    initial_state: CAST
    terminal_states: [VOIDED]
    transitions:
      - from: CAST
        to: VOIDED
        trigger: "POST /votes/{vote_id}/void"
        actor: FacultyAdvisor
        preconditions:
          - "Election.status IN {VOTING_OPEN, VOTING_CLOSED, TALLYING}"
        side_effects:
          - "recomputes Election.ballots_cast_count and Election.turnout_pct"
          - "releases the one-vote-per-round lock so the student may cast again while the window is open"
          - "increments Vote.version by 1"

  # -------------------------------------------------------------------- Appeal
  - entity: Appeal
    state_field: status
    initial_state: FILED
    terminal_states: [SUSTAINED, DENIED]
    transitions:
      - from: FILED
        to: SUSTAINED
        trigger: "POST /appeals/{appeal_id}/sustain"
        actor: FacultyAdvisor
        preconditions:
          - "X-User-ID != Election.certified_by_user_id"
          - "X-User-ID != ComplianceCase.adjudicated_by_user_id of the cited case, when Appeal.compliance_case_id is not null"
        side_effects:
          - "remedy RECOUNT: Election CERTIFIED -> TALLYING with certification identity cleared"
          - "remedy REINSTATEMENT: cited ComplianceCase UPHELD -> DISMISSED, Candidacy DISQUALIFIED -> ON_BALLOT, its VOIDED BallotLines return to ACTIVE"
          - "remedy VOID_ELECTION: Election.ballot_integrity_status -> RECOUNT_REQUIRED"
          - "stamps Appeal.resolved_by_user_id and Appeal.resolution_note"
          - "increments Appeal.version by 1"
        note: "Branching resolution: each remedy carries a different side-effect set."
      - from: FILED
        to: DENIED
        trigger: "POST /appeals/{appeal_id}/deny"
        actor: FacultyAdvisor
        preconditions:
          - "X-User-ID != Election.certified_by_user_id"
          - "X-User-ID != ComplianceCase.adjudicated_by_user_id of the cited case, when Appeal.compliance_case_id is not null"
        side_effects:
          - "stamps Appeal.resolved_by_user_id and Appeal.resolution_note; no other entity changes"
          - "increments Appeal.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's version — only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: ballot-create-stale-election
    parent_entity: Election
    write_endpoint: "POST /ballots"
    occ_field: "expected_election_version"
    description: |
      Creating a Ballot for an election whose version has advanced since the
      client last read it is rejected. A ballot create legitimately supersedes
      any existing DRAFT ballot for the same round, so the operation would
      otherwise succeed against a stale view and silently discard construction
      work the client never saw.
    error_id: ERR_STALE_ELECTION_VERSION
    http_status: 412

  - rule_id: slate-membership-stale-candidacy
    parent_entity: Candidacy
    write_endpoint: "POST /candidacies/{candidacy_id}/slate-membership"
    occ_field: "expected_candidacy_version"
    description: |
      Re-pointing a candidacy at a slate leader while the candidacy's version is
      stale is rejected. Slate membership legitimately supersedes whatever
      leader was recorded before, so without the version check a client holding
      an out-of-date view would overwrite a membership decision it never read.
    error_id: ERR_STALE_CANDIDACY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: petition_signature_valid_count
    trigger: "POST /petition-signatures, POST /petition-signatures/{petition_signature_id}/adjudicate, POST /petition-signatures/{petition_signature_id}/void, PATCH /students/{student_id}"
    algorithm: aggregation
    formula: |
      rows           = PetitionSignature WHERE candidacy_id == C.id            # every status
      total_count    = count(rows)
      pending_count  = count(rows WHERE status == 'SUBMITTED')
      rejected_count = count(rows WHERE status == 'REJECTED')
      voided_count   = count(rows WHERE status == 'VOIDED')

      verified       = rows WHERE status == 'VERIFIED'
      # eligibility_result is (re)stamped on every VERIFIED row, evaluated in this
      # exact order so exactly one verdict applies; rows are visited in
      # (signed_at ASC, created_at ASC) order for deterministic re-scoring.
      #   Student.enrollment_status != 'ENROLLED'                      -> INELIGIBLE_NOT_ENROLLED
      #   Student.disciplinary_hold == true                            -> INELIGIBLE_HOLD
      #   Student.class_year NOT IN Office(C.office_id).eligible_class_years
      #                                                                -> INELIGIBLE_CLASS_YEAR
      #   otherwise                                                    -> ELIGIBLE
      # Validation priority 23 already guarantees at most one non-VOIDED signature
      # per (candidacy, signer), so no further de-duplication is required.
      eligible       = verified WHERE eligibility_result == 'ELIGIBLE'
      valid_count      = count(eligible)
      ineligible_count = count(verified) - valid_count
    input_set: "All PetitionSignature rows of the candidacy regardless of status; only status == VERIFIED rows can reach valid_count, and only when their re-evaluated eligibility_result is ELIGIBLE. A later PATCH /students that changes enrollment_status, disciplinary_hold or class_year re-stamps eligibility_result on every VERIFIED signature that student holds and moves the affected candidacies' counters."
    constants: {}
    precision: "integer counts"
    variants: []

  - name: petition_ledger_conservation
    trigger: "invariant re-asserted after every PetitionSignature mutation"
    algorithm: aggregation
    formula: |
      # Conserved quantity #1: the signature row count of a candidacy.
      INVARIANT_A:
        C.petition_signature_valid_count
      + C.petition_signature_ineligible_count
      + C.petition_signature_pending_count
      + C.petition_signature_rejected_count
      + C.petition_signature_voided_count
      == C.petition_signature_total_count

      # Forward action     : POST /petition-signatures/{id}/adjudicate {outcome: VERIFIED}
      # Compensating action: POST /petition-signatures/{id}/void
      INVARIANT_B:
        after the forward action followed by its compensating action on the same
        signature, C.petition_signature_valid_count equals its value before the
        forward action, and C.petition_signature_total_count is unchanged
        throughout (voiding never deletes a row).
    input_set: "Every PetitionSignature row pointing at the candidacy."
    constants: {}
    precision: "integer counts; no drift permitted"
    variants: []

  - name: slate_expense_allocation
    trigger: "STEP 2 of calculations.certification_evaluation_order"
    algorithm: waterfall_allocation
    formula: |
      # Rounding order is PINNED: allocate and round PER EXPENSE LINE first,
      # then sum the rounded per-line charges. Summing the pool first and
      # rounding once at the end is NOT the specified behaviour and produces
      # different cents.
      members = C.slate_snapshot_member_ids           # frozen in STEP 1, created_at ASC
      N       = len(members)                          # N >= 1; an independent run has N == 1
      earliest_member = members[0]                    # smallest created_at

      shared_lines = every CampaignExpense e WHERE e.candidacy_id IN members
                     AND e.status == 'APPROVED' AND e.shared_with_slate == true

      charge(C) = 0
      for each line e in shared_lines ordered by (e.incurred_at ASC, e.created_at ASC):
          per_member = round_half_up(e.amount_cents / N)          # integer cents
          remainder  = e.amount_cents - per_member * N            # may be negative
          charge(C) += per_member
          if C.id == earliest_member: charge(C) += remainder
      return charge(C)
    input_set: "APPROVED CampaignExpense rows with shared_with_slate == true owned by any member of the frozen slate snapshot. REPORTED and REVERSED lines are excluded."
    constants: {}
    precision: "integer cents, round_half_up per line, remainder assigned to the member with the earliest created_at"
    variants: []

  - name: campaign_spend_assessment
    trigger: "PROVISIONAL on POST /campaign-expenses and on the approve/reverse transitions; FINAL in STEP 2 of calculations.certification_evaluation_order"
    algorithm: aggregation
    formula: |
      own_reported(M) = sum(e.amount_cents for e in CampaignExpense[candidacy_id=M]
                            WHERE e.status IN {'REPORTED','APPROVED'})
      own_approved(M) = sum(e.amount_cents for e in CampaignExpense[candidacy_id=M]
                            WHERE e.status == 'APPROVED')
      own_solo_approved(M) = sum(e.amount_cents for e in CampaignExpense[candidacy_id=M]
                            WHERE e.status == 'APPROVED' AND e.shared_with_slate == false)

      # ---- variant PROVISIONAL (writes Candidacy.spending_committed_cents)
      live_root(C)    = C.slate_leader_candidacy_id if not null else C.id
      live_members(C) = every Candidacy M WHERE M.id == live_root(C)
                                            OR M.slate_leader_candidacy_id == live_root(C)
      spending_committed_cents(C) = sum(own_reported(M) for M in live_members(C))

      # ---- variant FINAL (writes Candidacy.spending_final_cents)
      spending_final_cents(C) = own_solo_approved(C) + slate_expense_allocation(C)

      # ---- always-maintained ledger fields
      spending_reported_cents(C) = sum(e.amount_cents for e in CampaignExpense[candidacy_id=C]) # any status
      spending_reversed_cents(C) = sum(e.amount_cents for e in CampaignExpense[candidacy_id=C]
                                       WHERE e.status == 'REVERSED')
      poster_count(C)            = sum(e.quantity for e in CampaignExpense[candidacy_id=C]
                                       WHERE e.category == 'POSTER'
                                       AND e.status IN {'REPORTED','APPROVED'})
    input_set: "PROVISIONAL reads live slate membership and both REPORTED and APPROVED lines. FINAL reads the frozen snapshot from STEP 1 and only APPROVED lines."
    constants: {}
    precision: "integer cents"
    variants:
      - name: PROVISIONAL
        when: "Every time an expense is reported, approved or reversed, and whenever the spending cap is checked before certification."
        difference: "Joint-and-several: the entire live slate pool (REPORTED + APPROVED, every member) is charged in full to each member, so the same line is counted once per member. Live membership is read at call time."
      - name: FINAL
        when: "STEP 2 of the certification order, after the slate snapshot is frozen."
        difference: "Pro-rata: only APPROVED lines count, each member pays its own solo lines plus a per-line rounded share of the shared pool, and membership is the frozen snapshot rather than the live set. The two variants therefore return different cents for the same expense rows."

  - name: spend_ledger_conservation
    trigger: "invariant re-asserted after every CampaignExpense mutation"
    algorithm: aggregation
    formula: |
      # Conserved quantity #2: money in cents reported by a candidacy.
      INVARIANT_A:
        C.spending_reported_cents
        == sum(e.amount_cents for e in CampaignExpense[candidacy_id=C])   # all statuses
      INVARIANT_B:
        own_reported(C) + C.spending_reversed_cents == C.spending_reported_cents

      # Forward action     : POST /campaign-expenses/{id}/approve
      # Compensating action: POST /campaign-expenses/{id}/reverse
      INVARIANT_C:
        after the forward action followed by its compensating action on the same
        expense line e, C.spending_committed_cents has fallen by exactly
        e.amount_cents relative to its value before the forward action,
        C.spending_reversed_cents has risen by exactly e.amount_cents, and
        C.spending_reported_cents is unchanged.
    input_set: "Every CampaignExpense row of the candidacy, in any status."
    constants: {}
    precision: "integer cents; no drift permitted"
    variants: []

  - name: compliance_penalty_points
    trigger: "POST /compliance-cases/{compliance_case_id}/uphold (AT_ADJUDICATION); STEP 3 of calculations.certification_evaluation_order (AT_CERTIFICATION)"
    algorithm: weighted_scoring
    formula: |
      base            = PENALTY_BASE[case.severity]
      prior_upheld    = count(ComplianceCase X WHERE X.candidacy_id == case.candidacy_id
                              AND X.status == 'UPHELD'
                              AND (X.upheld_at, X.created_at) < (case.upheld_at, case.created_at))
      repeat_multiplier = 1 + REPEAT_STEP * prior_upheld
      timing_factor   = VOTING_WINDOW_FACTOR
                        if Election.voting_opens_at <= case.upheld_at <= Election.voting_closes_at
                        else 1.0
      spend_basis     = Candidacy.spending_committed_cents      # AT_ADJUDICATION
                        or Candidacy.spending_final_cents       # AT_CERTIFICATION
      overspend_cents = max(0, spend_basis - Election.spending_cap_cents)
      overspend_points= min(OVERSPEND_POINTS_CAP, ceil(overspend_cents / OVERSPEND_CENTS_PER_POINT))
      raw             = base * repeat_multiplier * timing_factor + overspend_points
      penalty_points  = min(PENALTY_POINTS_MAX, round_half_up(raw))       # integer

      Candidacy.penalty_points_total = sum(penalty_points for UPHELD cases of that candidacy)
      Candidacy is disqualified when penalty_points_total >= DISQUALIFICATION_POINT_THRESHOLD
    input_set: "The case's severity, the candidacy's earlier UPHELD cases ordered by (upheld_at ASC, created_at ASC), the logical clock position relative to the voting window, and the candidacy's spend basis for the active variant."
    constants:
      PENALTY_BASE: { MINOR: 5, MAJOR: 15, SEVERE: 40 }
      REPEAT_STEP: 0.5
      VOTING_WINDOW_FACTOR: 1.5
      OVERSPEND_CENTS_PER_POINT: 1000
      OVERSPEND_POINTS_CAP: 25
      PENALTY_POINTS_MAX: 100
      DISQUALIFICATION_POINT_THRESHOLD: 60
    precision: "integer points, round_half_up applied once to the whole raw expression"
    variants:
      - name: AT_ADJUDICATION
        when: "The advisor upholds the case through the API."
        difference: "The overspend surcharge reads Candidacy.spending_committed_cents (PROVISIONAL, joint-and-several)."
      - name: AT_CERTIFICATION
        when: "STEP 3 of the certification order re-scores every UPHELD case."
        difference: "The overspend surcharge reads Candidacy.spending_final_cents (FINAL, pro-rata), so an identical case can carry a different point value in the two contexts."

  - name: certification_evaluation_order
    trigger: "POST /elections/{election_id}/tally"
    algorithm: constraint_propagation
    formula: |
      # The dependency graph is circular on its face: FINAL spend depends on slate
      # membership, membership depends on which candidacies are still ON_BALLOT,
      # ON_BALLOT depends on disqualification, disqualification depends on penalty
      # points, and penalty points depend on FINAL spend. The cycle is broken by
      # freezing membership FIRST, from the ballot-lock snapshot, and never
      # re-deriving it. Steps MUST run in exactly this order.

      STEP 1 — freeze slate membership
        L = the Ballot of this election whose round == Election.current_round; snapshot instant = L.locked_at
        For every Candidacy C that was in status ON_BALLOT at instant L.locked_at:
          root = C.slate_leader_candidacy_id at L.locked_at, else C.id
          C.slate_snapshot_member_ids = ids of every Candidacy M that was ON_BALLOT at L.locked_at
                                        AND (M.id == root OR M.slate_leader_candidacy_id == root),
                                        ordered created_at ASC

      STEP 2 — FINAL spend
        For every such C: C.spending_final_cents = campaign_spend_assessment variant FINAL,
        evaluated over C.slate_snapshot_member_ids only.

      STEP 3 — re-score compliance
        For every ComplianceCase in status UPHELD: recompute penalty_points using
        compliance_penalty_points variant AT_CERTIFICATION; then recompute
        Candidacy.penalty_points_total.

      STEP 4 — disqualification sweep
        Every Candidacy still ON_BALLOT with penalty_points_total >= 60 transitions to
        DISQUALIFIED, in ascending created_at order. Membership from STEP 1 is NOT
        re-derived, and STEP 2 is NOT re-run.

      STEP 5 — raw counting
        For every Office O and the current round:
          ballots_cast_for_office = count of Vote V (status CAST, this election, this round)
                                    whose selections contain a mark with office_id == O.id
          raw_votes(C)            = count of those V whose mark for O names candidacy_id == C.id
          O.abstain_votes_count   = count of those V whose mark for O has candidacy_id == null
          O.invalidated_votes_count = sum(raw_votes(C) for C WHERE C.status == 'DISQUALIFIED')
          O.valid_votes_count     = ballots_cast_for_office - O.abstain_votes_count
                                                            - O.invalidated_votes_count
          C.certified_votes_count = 0 if C.status == 'DISQUALIFIED' else raw_votes(C)

      STEP 6 — outcomes
        office_result_share for every Office; referendum_outcome for every Referendum
        whose drafting_status == ON_BALLOT; then
        Election.runoff_required_office_count = count of Offices set to RUNOFF_REQUIRED.
    input_set: "Every Vote with status CAST for the election's current round, every UPHELD ComplianceCase, every APPROVED CampaignExpense of the frozen members, and the ballot-lock snapshot of candidacy statuses."
    constants:
      DISQUALIFICATION_POINT_THRESHOLD: 60
    precision: "steps execute exactly once, in the listed order, within the single tally request"
    variants: []

  - name: office_result_share
    trigger: "STEP 6 of calculations.certification_evaluation_order"
    algorithm: threshold
    formula: |
      ballots_cast_for_office = O.valid_votes_count + O.abstain_votes_count
                                                     + O.invalidated_votes_count

      # ---- variant PROVISIONAL (writes Candidacy.provisional_share_pct)
      denominator_provisional = ballots_cast_for_office
      provisional_share_pct(C) = 0.00 if denominator_provisional == 0
                                 else round_half_up(100 * raw_votes(C)
                                                    / denominator_provisional, 2)

      # ---- variant CERTIFIED (writes Candidacy.certified_share_pct)
      denominator_certified = O.valid_votes_count
      certified_share_pct(C) = 0.00 if denominator_certified == 0
                               else round_half_up(100 * C.certified_votes_count
                                                  / denominator_certified, 2)

      # ---- runoff rule — reads the CERTIFIED variant ONLY
      rank(C) = (C.certified_votes_count DESC,
                 C.petition_signature_valid_count DESC,
                 C.created_at ASC)
      leader  = first candidacy by rank(C) among the office's ON_BALLOT candidacies
      if leader.certified_share_pct >= Election.runoff_threshold_pct:
          O.status = 'DECIDED'; the top O.seat_count candidacies by rank(C) win
      else:
          O.status = 'RUNOFF_REQUIRED'
          qualifiers = top (O.seat_count + 1) candidacies by rank(C),
                       plus every candidacy whose certified_votes_count equals the
                       certified_votes_count of the last of them (ties all advance)
    input_set: "Votes with status CAST for the current round that carry a mark for this office. Abstentions and ballots naming a STEP 4 disqualified candidacy are inside the PROVISIONAL denominator and outside the CERTIFIED denominator."
    constants: {}
    precision: "percentages to 2 decimal places, round_half_up; comparison against runoff_threshold_pct uses >="
    variants:
      - name: PROVISIONAL
        when: "Reported on the results screen immediately after the tally call."
        difference: "Denominator is every ballot that touched the office, including explicit abstentions and ballots for disqualified candidacies; numerator is raw_votes, so a disqualified candidacy still shows a non-zero share."
      - name: CERTIFIED
        when: "The legally operative figure; the only variant the runoff threshold reads."
        difference: "Denominator excludes abstentions and invalidated ballots; numerator is 0 for disqualified candidacies. The same ballots therefore yield a strictly larger share for surviving candidacies and can flip an office from RUNOFF_REQUIRED to DECIDED."

  - name: referendum_outcome
    trigger: "STEP 6 of calculations.certification_evaluation_order"
    algorithm: threshold
    formula: |
      yes     = count of Vote V (status CAST, current round) whose selections contain
                {referendum_id: RF.id, choice: 'YES'}
      no      = same with choice 'NO'
      abstain = same with choice 'ABSTAIN'
      decisive = yes + no                              # abstentions excluded
      approval_pct = 0.00 if decisive == 0 else round_half_up(100 * yes / decisive, 2)

      if Election.turnout_pct < Election.quorum_pct : outcome_status = 'QUORUM_NOT_MET'
      elif decisive == 0                            : outcome_status = 'FAILED'
      elif approval_pct >= RF.approval_threshold_pct: outcome_status = 'PASSED'
      else                                          : outcome_status = 'FAILED'
    input_set: "Votes with status CAST for the current round carrying a mark for this referendum. Quorum is evaluated on Election.turnout_pct, which counts every cast ballot, not only the ones that marked this referendum."
    constants: {}
    precision: "percentages to 2 decimal places, round_half_up; both comparisons use >="
    variants: []

  - name: election_turnout
    trigger: "POST /elections/{election_id}/open-voting (freeze), POST /votes, POST /votes/{vote_id}/void, POST /elections/{election_id}/close-voting"
    algorithm: aggregation
    formula: |
      # frozen once, at open-voting for round 1 only
      eligible_voter_count = count of Student S WHERE S.enrollment_status == 'ENROLLED'
                             AND S.disciplinary_hold == false
                             AND S.class_year IN (union of Office.eligible_class_years
                                                  over every Office of this election)

      ballots_cast_count = count of Vote WHERE election_id == E.id
                           AND round == E.current_round AND status == 'CAST'
      turnout_pct = 0.00 if eligible_voter_count == 0
                    else round_half_up(100 * ballots_cast_count / eligible_voter_count, 2)
    input_set: "Student rows as they stand at the open-voting call; later registrar changes do not move the frozen electorate size. Vote rows are counted live for the current round only."
    constants: {}
    precision: "integer counts; turnout_pct to 2 decimal places, round_half_up"
    variants: []

  - name: voting_window_occupation
    trigger: "POST /elections/{election_id}/open-voting"
    algorithm: interval_merge
    formula: |
      # Geometry A — HALF-OPEN intervals, no buffer, adjacency ACCEPTED.
      # Resource: the academic-year polling calendar. Occupant: an Election.
      candidates = every Election X WHERE X.id != E.id
                   AND X.academic_year == E.academic_year
                   AND X.voting_opens_at IS NOT NULL
      collides(X) = (new_opens_at < X.voting_closes_at)
                    AND (X.voting_opens_at < new_closes_at)
      # Touching endpoints do NOT collide: new_opens_at == X.voting_closes_at is accepted,
      # and so is new_closes_at == X.voting_opens_at.
      if any collides(X): reject with ERR_VOTING_WINDOW_OVERLAP
    input_set: "Every other Election of the same academic_year that already has a voting window, regardless of that election's status."
    constants: {}
    precision: "instant comparison at full ISO 8601 millisecond resolution; both bounds compared with strict <"
    variants: []

  - name: venue_booking_occupation
    trigger: "POST /campaign-expenses with category == EVENT"
    algorithm: interval_merge
    formula: |
      # Geometry B — CLOSED intervals widened by a teardown buffer on BOTH sides,
      # adjacency REJECTED. Resource: a campus venue. Occupant: a CampaignExpense.
      B = TEARDOWN_BUFFER_MINUTES
      widen(a, b) = [a - B minutes, b + B minutes]
      new_iv = widen(new.event_starts_at, new.event_ends_at)
      candidates = every CampaignExpense X WHERE X.category == 'EVENT'
                   AND X.venue_code == new.venue_code
                   AND X.status IN {'REPORTED', 'APPROVED'}
                   AND Candidacy(X.candidacy_id).election_id == Candidacy(new.candidacy_id).election_id
      collides(X) = new_iv.start <= widen(X.event_starts_at, X.event_ends_at).end
                    AND widen(X.event_starts_at, X.event_ends_at).start <= new_iv.end
      # Closed comparison: a booking whose widened interval merely touches another's
      # widened interval DOES collide, so back-to-back rallies are rejected.
      if any collides(X): reject with ERR_VENUE_DOUBLE_BOOKED
    input_set: "Non-REVERSED EVENT expenses on the same venue_code within the same election. REVERSED bookings free the slot."
    constants:
      TEARDOWN_BUFFER_MINUTES: 30
    precision: "instant comparison at full ISO 8601 millisecond resolution; both bounds compared with <=, unlike the half-open voting-window geometry"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the first failing rule decides the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles listed for the endpoint in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path-parameter resource exists, validated left to right"
    error_id: "ERR_ELECTION_NOT_FOUND | ERR_OFFICE_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_CANDIDACY_NOT_FOUND | ERR_SIGNATURE_NOT_FOUND | ERR_EXPENSE_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_REFERENDUM_NOT_FOUND | ERR_BALLOT_NOT_FOUND | ERR_BALLOT_LINE_NOT_FOUND | ERR_VOTE_NOT_FOUND | ERR_APPEAL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the order the fields appear in the endpoint's input list"
    error_id: "ERR_ELECTION_NOT_FOUND | ERR_OFFICE_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_CANDIDACY_NOT_FOUND | ERR_REFERENDUM_NOT_FOUND | ERR_BALLOT_NOT_FOUND | ERR_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /offices, POST /candidacies, POST /petition-signatures, POST /campaign-expenses, POST /compliance-cases, POST /referenda, POST /ballots, POST /ballots/{ballot_id}/lines, POST /votes, POST /appeals, POST /candidacies/{candidacy_id}/slate-membership"

  - priority: 5
    category: business_constraint
    check: "every required body field is present and every value satisfies its declared type, enum domain and numeric range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 6
    category: business_constraint
    check: "pagination limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 7
    category: auth
    check: "for entity_backed roles the acting X-User-ID owns the target row: Candidate must equal Candidacy.student_id, StudentVoter must equal PetitionSignature.signer_student_id, Vote.student_id or the Referendum proposer"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /candidacies, POST /candidacies/{candidacy_id}/submit-petition, POST /candidacies/{candidacy_id}/withdraw, POST /candidacies/{candidacy_id}/slate-membership, POST /candidacies/{candidacy_id}/record-training, POST /campaign-expenses, POST /petition-signatures, POST /appeals, POST /referenda/{referendum_id}/submit"

  - priority: 8
    category: auth
    check: "segregation of duties: the acting FacultyAdvisor X-User-ID differs from Election.certified_by_user_id, and from ComplianceCase.adjudicated_by_user_id of the case cited by Appeal.compliance_case_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appeals/{appeal_id}/sustain, POST /appeals/{appeal_id}/deny"

  - priority: 9
    category: state
    check: "the target row — or, for a child create, the parent row the new child hangs from — is in a state from which the requested operation is declared in §1.2. For POST /campaign-expenses the referenced Candidacy.status must not be in {WITHDRAWN, DISQUALIFIED, VACATED}; for POST /petition-signatures it must not be in {WITHDRAWN, DISQUALIFIED, VACATED}; for POST /ballots/{ballot_id}/lines the Ballot.status must be DRAFT; for POST /votes the Ballot.status must be PUBLISHED; for POST /candidacies/{candidacy_id}/activate-officer transition_status IN {PENDING, TRAINING_COMPLETE} is accepted here and a PENDING officer is rejected later, at priority 31, with ERR_TRAINING_INCOMPLETE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints, plus POST /campaign-expenses, POST /petition-signatures, POST /ballots/{ballot_id}/lines and POST /votes"

  - priority: 10
    category: state
    check: "the owning Election is in the phase the operation requires"
    error_id: ERR_ELECTION_PHASE_INVALID
    http_status: 409
    applies_to: "POST /candidacies, POST /candidacies/{candidacy_id}/submit-petition, POST /candidacies/{candidacy_id}/approve, POST /candidacies/{candidacy_id}/return, POST /petition-signatures, POST /petition-signatures/{petition_signature_id}/adjudicate, POST /referenda, POST /referenda/{referendum_id}/submit, POST /referenda/{referendum_id}/review, POST /ballots/{ballot_id}/lines, POST /ballots/{ballot_id}/lock, POST /candidacies/{candidacy_id}/activate-officer"

  - priority: 11
    category: state
    check: "expected_election_version equals Election.version"
    error_id: ERR_STALE_ELECTION_VERSION
    http_status: 412
    applies_to: "POST /ballots"

  - priority: 12
    category: state
    check: "expected_candidacy_version equals Candidacy.version"
    error_id: ERR_STALE_CANDIDACY_VERSION
    http_status: 412
    applies_to: "POST /candidacies/{candidacy_id}/slate-membership"

  - priority: 13
    category: business_temporal
    check: "the logical clock is inside the half-open voting window [Election.voting_opens_at, Election.voting_closes_at) and Election.status == VOTING_OPEN"
    error_id: ERR_VOTING_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /votes"

  - priority: 14
    category: business_temporal
    check: "the logical clock is strictly before Election.petition_deadline for petition submission, and at or before it for petition approval"
    error_id: ERR_PETITION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /candidacies/{candidacy_id}/submit-petition, POST /candidacies/{candidacy_id}/approve, POST /petition-signatures"

  - priority: 15
    category: business_temporal
    check: "CampaignExpense.incurred_at falls outside the pre-poll blackout [Election.voting_opens_at - quiet_period_hours, Election.voting_closes_at]"
    error_id: ERR_QUIET_PERIOD_ACTIVE
    http_status: 422
    applies_to: "POST /campaign-expenses"

  - priority: 16
    category: business_temporal
    check: "for an EVENT expense, the closed interval [event_starts_at, event_ends_at] widened by TEARDOWN_BUFFER_MINUTES = 30 on both sides must not intersect the identically widened interval of any other CampaignExpense with category EVENT, the same venue_code, the same election and status in {REPORTED, APPROVED}. Back-to-back bookings that merely touch are therefore rejected, unlike the half-open voting-window rule"
    error_id: ERR_VENUE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /campaign-expenses"

  - priority: 17
    category: business_temporal
    check: "the requested voting window does not intersect the half-open window [voting_opens_at, voting_closes_at) of any other Election sharing this academic_year; two windows that merely touch at an endpoint are accepted"
    error_id: ERR_VOTING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /elections/{election_id}/open-voting"

  - priority: 18
    category: business_safety
    check: "candidate eligibility: Student.enrollment_status == ENROLLED, disciplinary_hold == false, class_year IN Office.eligible_class_years, gpa >= Office.min_gpa, credits_completed >= Office.min_credits"
    error_id: ERR_CANDIDATE_INELIGIBLE
    http_status: 422
    applies_to: "POST /candidacies, POST /candidacies/{candidacy_id}/submit-petition"

  - priority: 19
    category: business_safety
    check: "voter eligibility: the acting Student is ENROLLED, has disciplinary_hold == false, and their class_year appears in the eligible_class_years of at least one Office on the ballot being voted"
    error_id: ERR_VOTER_INELIGIBLE
    http_status: 403
    applies_to: "POST /votes"

  - priority: 20
    category: business_constraint
    check: "at most one Vote with status CAST exists per (election_id, round, student_id)"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /votes"

  - priority: 21
    category: business_constraint
    check: "a student holds at most one Candidacy per election whose status is not in {WITHDRAWN, VACATED}"
    error_id: ERR_DUPLICATE_CANDIDACY
    http_status: 409
    applies_to: "POST /candidacies"

  - priority: 22
    category: business_constraint
    check: "a student has at most one PetitionSignature row per candidacy whose status is not VOIDED"
    error_id: ERR_DUPLICATE_SIGNATURE
    http_status: 409
    applies_to: "POST /petition-signatures"

  - priority: 23
    category: business_constraint
    check: "signer_student_id differs from Candidacy.student_id"
    error_id: ERR_SELF_SIGNATURE
    http_status: 422
    applies_to: "POST /petition-signatures"

  - priority: 24
    category: business_constraint
    check: "Candidacy.petition_signature_valid_count >= Office.required_signature_count, evaluated with >="
    error_id: ERR_INSUFFICIENT_SIGNATURES
    http_status: 422
    applies_to: "POST /candidacies/{candidacy_id}/approve"

  - priority: 25
    category: business_constraint
    check: "every Office of the election has at least one BallotLine with status ACTIVE and line_type CANDIDATE on the ballot being locked"
    error_id: ERR_OFFICE_HAS_NO_CANDIDATE
    http_status: 409
    applies_to: "POST /ballots/{ballot_id}/lock"

  - priority: 26
    category: business_constraint
    check: "a CANDIDATE line supplies office_id and candidacy_id and omits referendum_id; a REFERENDUM line supplies referendum_id and omits office_id and candidacy_id; the referenced candidacy is ELIGIBLE or RUNOFF_QUALIFIED and the referenced referendum is APPROVED_FOR_BALLOT"
    error_id: ERR_INVALID_BALLOT_LINE
    http_status: 400
    applies_to: "POST /ballots/{ballot_id}/lines"

  - priority: 27
    category: business_constraint
    check: "every mark in selections resolves to a BallotLine with status ACTIVE on the ballot being voted, carries at most one mark per office_id and at most one per referendum_id, and referendum marks carry choice IN {YES, NO, ABSTAIN}"
    error_id: ERR_INVALID_SELECTION
    http_status: 422
    applies_to: "POST /votes"

  - priority: 28
    category: business_constraint
    check: "the slate leader belongs to the same election, is not the candidacy itself, and has slate_leader_candidacy_id == null so that slates are exactly one level deep"
    error_id: ERR_INVALID_SLATE
    http_status: 422
    applies_to: "POST /candidacies, POST /candidacies/{candidacy_id}/slate-membership"

  - priority: 29
    category: business_referential
    check: "Appeal.compliance_case_id, when supplied, names a ComplianceCase whose election_id and candidacy_id match the appeal's own"
    error_id: ERR_APPEAL_SCOPE_INVALID
    http_status: 422
    applies_to: "POST /appeals"

  - priority: 30
    category: business_constraint
    check: "Candidacy.training_modules_completed >= Office.required_training_modules"
    error_id: ERR_TRAINING_INCOMPLETE
    http_status: 422
    applies_to: "POST /candidacies/{candidacy_id}/activate-officer"

  - priority: 31
    category: business_fiscal
    check: "Candidacy.poster_count after the new line <= Election.poster_cap"
    error_id: ERR_POSTER_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /campaign-expenses"

  - priority: 32
    category: business_fiscal
    check: "the REPORTING Candidacy.spending_committed_cents after the new line <= Election.spending_cap_cents. The check is scoped to the candidacy named in the request only; joining a slate later through POST /candidacies/{candidacy_id}/slate-membership pools the members' spend and can legitimately push a candidacy over the cap without any expense being rejected — that overrun is caught by the compliance overspend surcharge instead"
    error_id: ERR_SPENDING_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /campaign-expenses"

# =============================================================================
# §1.5 API Endpoint Table
# Flat topology: every collection is a top-level path. Every FK declared in §1.1
# is reverse-reachable through the filtered-list form of its child collection.
# =============================================================================
endpoints:

  # ------------------------------------------------------------- Election
  - method: POST
    path: "/elections"
    description: "Open a new election cycle in status DRAFT"
    roles: [ElectionCommissioner]
    code: 201
    input: ["title", "academic_year", "petition_deadline", "spending_cap_cents", "poster_cap", "quorum_pct", "runoff_threshold_pct", "quiet_period_hours?"]
    output: Election
    side_effects: ["creates Election in status DRAFT, current_round 1, version 1, ballot_integrity_status INTACT"]

  - method: GET
    path: "/elections"
    description: "List elections with pagination and optional filters"
    roles: [ElectionCommissioner, FacultyAdvisor, Registrar, Candidate, StudentVoter]
    code: 200
    input: ["academic_year?", "status?", "limit?", "offset?"]
    output: Election[]
    side_effects: []

  - method: GET
    path: "/elections/{election_id}"
    description: "Read one election, including its computed turnout, runoff counter and version"
    roles: [ElectionCommissioner, FacultyAdvisor, Registrar, Candidate, StudentVoter]
    code: 200
    input: []
    output: Election
    side_effects: []

  - method: POST
    path: "/elections/{election_id}/open-petitioning"
    description: "Move the election DRAFT -> PETITIONING so candidacies and referenda may be filed"
    roles: [ElectionCommissioner]
    code: 200
    input: []
    output: Election
    side_effects: ["Election DRAFT -> PETITIONING", "increments Election.version by 1"]

  - method: POST
    path: "/elections/{election_id}/open-voting"
    description: "Open the voting window for the current round; the window is half-open [voting_opens_at, voting_closes_at)"
    roles: [ElectionCommissioner]
    code: 200
    input: [round, voting_opens_at, voting_closes_at]
    output: Election
    side_effects: ["Election BALLOT_PUBLISHED -> VOTING_OPEN", "freezes Election.eligible_voter_count on round 1 per calculations.election_turnout", "increments Election.version by 1"]

  - method: POST
    path: "/elections/{election_id}/close-voting"
    description: "Close the voting window and the published ballot"
    roles: [ElectionCommissioner]
    code: 200
    input: []
    output: Election
    side_effects: ["Election VOTING_OPEN -> VOTING_CLOSED", "Ballot PUBLISHED -> CLOSED", "recomputes Election.ballots_cast_count and Election.turnout_pct", "increments Election.version by 1"]

  - method: POST
    path: "/elections/{election_id}/tally"
    description: "Run calculations.certification_evaluation_order STEP 1 through STEP 6 exactly once"
    roles: [ElectionCommissioner]
    code: 200
    input: []
    output: Election
    side_effects: ["Election VOTING_CLOSED -> TALLYING", "freezes Candidacy.slate_snapshot_member_ids", "writes Candidacy.spending_final_cents", "re-scores ComplianceCase.penalty_points and Candidacy.penalty_points_total", "disqualification sweep", "writes Candidacy.raw_votes_count, certified_votes_count, provisional_share_pct, certified_share_pct", "writes Office.valid_votes_count, abstain_votes_count, invalidated_votes_count and Office.status", "writes Referendum outcome fields", "writes Election.runoff_required_office_count", "increments Election.version by 1"]

  - method: POST
    path: "/elections/{election_id}/certify"
    description: "Fork: certify the results, or schedule a runoff when at least one office fell short of runoff_threshold_pct"
    roles: [FacultyAdvisor]
    code: 200
    input: []
    output: Election
    side_effects: ["arm A — TALLYING -> CERTIFIED: winners ELECTED with transition_status PENDING, losers ELIMINATED, Office DECIDED, certified_by_user_id and certified_at stamped", "arm B — TALLYING -> RUNOFF_SCHEDULED: qualifiers RUNOFF_QUALIFIED, others ELIMINATED, Office RUNOFF_REQUIRED, no certification identity stamped", "increments Election.version by 1"]

  - method: POST
    path: "/elections/{election_id}/run-transition-checkpoint"
    description: "Advance the officer-transition epoch: lapse untrained officers, vacate their seats and promote the ranking alternate"
    roles: [ElectionCommissioner]
    code: 200
    input: []
    output: Election
    side_effects: ["hop 1 transition_status PENDING -> LAPSED", "hop 2 Candidacy ELECTED -> VACATED and Office DECIDED -> VACANT_SEAT", "hop 3 the ranking ELIMINATED candidacy of that office -> ELECTED with transition_status PENDING and Office VACANT_SEAT -> DECIDED", "Election CERTIFIED -> CLOSED when every ELECTED candidacy is ACTIVE", "increments Election.version by 1"]

