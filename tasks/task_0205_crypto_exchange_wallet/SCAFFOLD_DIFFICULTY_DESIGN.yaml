  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_conserves_quote_spendable_plus_reserved
        grounds:
          - state_machines.Order.OPEN_to_CANCELLED
          - entities.Balance.fields.available_amount
          - entities.Balance.fields.reserved_amount
          - calculations.order_reserve_amount
        distinguishing_aspect: |
          Conserved quantity #1 (balance buckets): for the quote asset,
          available_amount + reserved_amount is invariant across place-order (forward) and
          cancel-order (compensation). Reserve of 40120.00 USD moves available->reserved on place
          and reserved->available on cancel; the sum 50000 is unchanged with zero drift.
        test_recipe:
          setup:
            - "USD/BTC, TIER_BASE fees; account TIER_1 with 50000 USD available, no orders yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "USD", decimals: 2, required_confirmations: 0, is_fiat: true, min_withdrawal_amount: 1, network_fee: 0, spot_price_usd: 1 }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "BTC", decimals: 8, required_confirmations: 1, is_fiat: false, min_withdrawal_amount: 0.0001, network_fee: 0.0001, spot_price_usd: 40000 }
              as: Operator
            - call: "POST /fee-schedules"
              payload: { tier_name: "TIER_BASE", min_taker_volume_30d_usd: 0, maker_fee_bps: 10, taker_fee_bps: 30 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "ci1@x.com", full_name: "CI1", residence_country: "US" }
              as: Anonymous
              captures: { acc_ci: $.data.id }
            - call: "POST /accounts/${acc_ci}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_ci}"
            - call: "POST /accounts/${acc_ci}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_ci}", asset: "USD", amount: 50000, unit_cost_usd: 1 }
              as: Operator
              captures: { dep_ci: $.data.id }
            - call: "POST /deposits/${dep_ci}/confirmations"
              payload: { delta: 0 }
              as: Operator
            - call: "GET /accounts/${acc_ci}"
              as: Trader
              as_user_id: "${acc_ci}"
              captures: { v_ci: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_ci}", base_asset: "BTC", quote_asset: "USD", side: "BUY", order_type: "LIMIT", quantity: 1.0, limit_price: 40000, time_in_force: "GTC", expected_account_version: "${v_ci}" }
              as: Trader
              as_user_id: "${acc_ci}"
              captures: { cancel_oid: $.data.id }
          trigger:
            - call: "GET /balances"
              payload: { account_id: "${acc_ci}", asset: "USD" }
              as: Trader
              as_user_id: "${acc_ci}"
            - call: "DELETE /orders/${cancel_oid}"
              payload: {}
              as: Trader
              as_user_id: "${acc_ci}"
            - call: "GET /balances"
              payload: { account_id: "${acc_ci}", asset: "USD" }
              as: Trader
              as_user_id: "${acc_ci}"
          assert:
            - "After place: USD available_amount == 9880.00 and reserved_amount == 40120.00 (sum 50000)"
            - "After cancel: USD available_amount == 50000 and reserved_amount == 0 (sum 50000, zero drift)"

      - name: withdrawal_reject_conserves_asset_total_holdings
        grounds:
          - state_machines.Withdrawal.SCREENING_to_REJECTED
          - entities.Balance.fields.held_amount
          - entities.Balance.fields.available_amount
          - entities.Balance.fields.total_amount
        distinguishing_aspect: |
          Conserved quantity #2 (asset total holdings, a different conserved quantity than the
          quote available+reserved bucket sum): for BTC, total_amount == available + reserved +
          held is invariant across submit-withdrawal (available->held, forward) and reject
          (held->available, compensation). 0.5+0.0001 BTC moves out and back; total stays 1.0.
        test_recipe:
          setup:
            - "BTC spot 40000; account TIER_2 holds 1.0 BTC; ACTIVE BTC address; one withdrawal 0.5 BTC SUBMITTED->SCREENING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "BTC", decimals: 8, required_confirmations: 1, is_fiat: false, min_withdrawal_amount: 0.0001, network_fee: 0.0001, spot_price_usd: 40000 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "ci2@x.com", full_name: "CI2", residence_country: "US" }
              as: Anonymous
              captures: { acc_ci2: $.data.id }
            - call: "POST /accounts/${acc_ci2}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_ci2}"
            - call: "POST /accounts/${acc_ci2}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /accounts/${acc_ci2}/kyc-applications"
              payload: { requested_tier: "TIER_2" }
              as: Trader
              as_user_id: "${acc_ci2}"
            - call: "POST /accounts/${acc_ci2}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_ci2}", asset: "BTC", amount: 1.0, unit_cost_usd: 30000 }
              as: Operator
              captures: { dep_ci2: $.data.id }
            - call: "POST /deposits/${dep_ci2}/confirmations"
              payload: { delta: 1 }
              as: Operator
            - call: "GET /accounts/${acc_ci2}"
              as: Trader
              as_user_id: "${acc_ci2}"
              captures: { v_ci2: $.data.version }
            - call: "POST /withdrawal-addresses"
              payload: { account_id: "${acc_ci2}", asset: "BTC", chain_address: "0xCI2", label: "out", expected_account_version: "${v_ci2}" }
              as: Trader
              as_user_id: "${acc_ci2}"
              captures: { addr_ci2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-02T01:00:00Z" }
              as: Operator
            - call: "POST /withdrawal-addresses/${addr_ci2}/activate"
              payload: {}
              as: Trader
              as_user_id: "${acc_ci2}"
            - call: "POST /withdrawals"
              payload: { account_id: "${acc_ci2}", withdrawal_address_id: "${addr_ci2}", amount: 0.5 }
              as: Trader
              as_user_id: "${acc_ci2}"
              captures: { wd_ci2: $.data.id }
            - call: "POST /withdrawals/${wd_ci2}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-15"
          trigger:
            - call: "GET /balances"
              payload: { account_id: "${acc_ci2}", asset: "BTC" }
              as: Trader
              as_user_id: "${acc_ci2}"
            - call: "POST /withdrawals/${wd_ci2}/screen-result"
              payload: { result: "REJECT" }
              as: ComplianceOfficer
              as_user_id: "co-15"
            - call: "GET /balances"
              payload: { account_id: "${acc_ci2}", asset: "BTC" }
              as: Trader
              as_user_id: "${acc_ci2}"
          assert:
            - "While SCREENING: BTC held_amount == 0.5001 (0.5 + 0.0001 fee), available_amount == 0.4999, total_amount == 1.0"
            - "After REJECT: BTC held_amount == 0, available_amount == 1.0, total_amount == 1.0 (total conserved, zero drift)"
