            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY", "STEAM_PREVAC"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Sup S", certification_level: 3, certified_methods: ["STEAM_PREVAC"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_s: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "ST-P1", method: "STEAM_PREVAC", chamber_capacity: 4, cycle_minutes: 45, required_certification_level: 1 }, as: FacilityAdmin, captures: { ster: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "P1" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { p1: "$.data.id" } }
            - { call: "POST /spd/trays/${p1}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${p1}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${p1}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${p1}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "P2" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { p2: "$.data.id" } }
            - { call: "POST /spd/trays/${p2}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${p2}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${p2}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${p2}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "P3" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { p3: "$.data.id" } }
            - { call: "POST /spd/trays/${p3}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${p3}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${p3}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${p3}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { lp: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${lp}/trays", payload: { tray_id: "${p1}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lp}/trays", payload: { tray_id: "${p2}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lp}/trays", payload: { tray_id: "${p3}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lp}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lp}/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T03:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/biological-indicators?load_id=${lp}", as: Any, captures: { bip: "$.data[0].id" } }
            - { call: "POST /spd/biological-indicators/${bip}/record-result", payload: { result: "NEGATIVE" }, as: QualityAuditor }
            - { call: "POST /spd/sterilization-loads/${lp}/release", as: SpdSupervisor, as_user_id: "${tech_s}" }
          trigger:
            - { call: "GET /spd/sterilization-loads/${lp}", as: Any }
          assert:
            - "data.total_chargeback_cents == 3714 (3 trays x round_half_up(1000 * 1.2375) = 3 x 1238)"
            - "3714 != 3713 — the forbidden sum-then-round order (round_half_up(3712.5)) is observably rejected"
            - "data.status == RELEASED and all three trays are STERILE with cycles_completed == 1"

  - rule_id: non_linear_state_machine
    instances:
      - name: tray_cyclic_loop_repeated_cycle
        grounds:
          - state_machines.Tray.IN_USE_to_AWAITING_DECONTAMINATION
          - state_machines.Tray.AWAITING_DECONTAMINATION_to_IN_DECONTAMINATION
          - state_machines.Tray.IN_LOAD_to_STERILE
        distinguishing_aspect: |
          The Tray machine is cyclic (AWAITING_DECONTAMINATION -> ... -> IN_USE ->
          AWAITING_DECONTAMINATION), not a linear pipeline: one physical tray runs
          the full loop twice, and cycles_completed increments 1 -> 2 across the
          loop boundary while status returns to STERILE.
        test_recipe:
          setup:
            - "Template (WRAPPED, SCALPEL x2); sterilizer ST-G1; technicians A and S"
            - "Tray tz completed one full loop: sterilized in load LZ1 (released 2026-05-01T03:00:00Z), reserved for case CZ (2026-05-10T09:00-11:00), case started (tz -> IN_USE) and completed (tz -> AWAITING_DECONTAMINATION, cycles_completed == 1)"
            - "Tray tz reprocessed: IN_DECONTAMINATION -> DECONTAMINATED -> IN_ASSEMBLY -> ASSEMBLED"
            - "Logical clock at 2026-05-01T03:00:00Z throughout the case operations (no time gate on case start/complete)"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "ENT-01", name: "ENT Set", specialty: "ENT", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 12 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Sup S", certification_level: 3, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_s: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "ST-G1", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { ster: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TZ" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { tz: "$.data.id" } }
            - { call: "POST /spd/trays/${tz}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tz}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tz}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tz}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { lz1: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${lz1}/trays", payload: { tray_id: "${tz}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lz1}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lz1}/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T03:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/biological-indicators?load_id=${lz1}", as: Any, captures: { biz1: "$.data[0].id" } }
            - { call: "POST /spd/biological-indicators/${biz1}/record-result", payload: { result: "NEGATIVE" }, as: QualityAuditor }
            - { call: "POST /spd/sterilization-loads/${lz1}/release", as: SpdSupervisor, as_user_id: "${tech_s}" }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-Z", surgeon: "Dr Z", scheduled_start_at: "2026-05-10T09:00:00Z", scheduled_end_at: "2026-05-10T11:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { cz: "$.data.id", cz_v: "$.data.version" } }
            - { call: "POST /spd/or-cases/${cz}/reservations", payload: { tray_id: "${tz}", expected_or_case_version: "${cz_v}" }, as: OrScheduler, captures: { rz: "$.data.id" } }
            - { call: "POST /spd/or-cases/${cz}/start", as: OrScheduler }
            - { call: "POST /spd/or-cases/${cz}/complete", as: OrScheduler }
            - { call: "POST /spd/trays/${tz}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tz}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tz}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tz}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
          trigger:
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-01T03:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { lz2: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${lz2}/trays", payload: { tray_id: "${tz}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lz2}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lz2}/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T06:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/biological-indicators?load_id=${lz2}", as: Any, captures: { biz2: "$.data[0].id" } }
            - { call: "POST /spd/biological-indicators/${biz2}/record-result", payload: { result: "NEGATIVE" }, as: QualityAuditor }
            - { call: "POST /spd/sterilization-loads/${lz2}/release", as: SpdSupervisor, as_user_id: "${tech_s}" }
            - { call: "GET /spd/trays/${tz}", as: Any }
            - { call: "GET /spd/tray-reservations/${rz}", as: Any }
          assert:
            - "the loop closed once already: before the trigger chain, tray tz was AWAITING_DECONTAMINATION with cycles_completed == 1 and reservation RZ status == USED"
            - "after the trigger chain: Tray.${tz}.status == STERILE again (second pass through the cycle)"
            - "Tray.${tz}.cycles_completed == 2 (incremented once per release)"
            - "Tray.${tz}.sterility_expires_at == 2026-05-31T06:00:00Z (released at 2026-05-01T06:00:00Z + 720h WRAPPED)"

      - name: load_branching_divergent_side_effects
        grounds:
          - state_machines.SterilizationLoad.RUNNING_to_COMPLETED
          - state_machines.SterilizationLoad.RUNNING_to_FAILED_CYCLE
          - state_machines.Tray.IN_LOAD_to_STERILE
          - state_machines.Tray.IN_LOAD_to_ASSEMBLED
        distinguishing_aspect: |
          The SterilizationLoad machine forks from RUNNING with divergent
          side-effect sets: the COMPLETED branch creates a BiologicalIndicator and
          (after release) flips its tray to STERILE with a chargeback, while the
          FAILED_CYCLE branch creates no BI, demotes its tray back to ASSEMBLED,
          idles the sterilizer and debits the operator's competency — a fork with
          observably different outcomes per branch, on a different entity than the
          Tray cycle.
        test_recipe:
          setup:
            - "Template, sterilizer ST-G1 (60min), technicians A (operator) and S (supervisor)"
            - "Load LA with tray ta went RUNNING -> COMPLETED -> (BI NEGATIVE) -> RELEASED"
