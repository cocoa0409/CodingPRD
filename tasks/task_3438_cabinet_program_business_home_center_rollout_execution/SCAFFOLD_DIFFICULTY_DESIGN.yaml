              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
          trigger:
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W30", lines: [{ family_code: "GHOST", finish_code: "OAK", quantity: 1 }] }
