      - name: outreach_accepts_exactly_sixty_minute_gap_and_rejects_fifty_nine_minute_gap
        grounds:
          - calculations.outreach_travel_conflict
          - validations[priority=67]
          - errors[ERR_REPRESENTATIVE_TRAVEL_CONFLICT]
          - state_machines.OutreachEvent
        distinguishing_aspect: |
          A different resource (the Representative's own time) with different semantics: a CLOSED base
          interval plus a SYMMETRIC 30-minute travel buffer on both sides and a capacity of exactly one.
          Against a PLANNED event at 09:00-11:00 on 2026-09-10 (block [08:30,11:30]), a second event at
          12:00-13:00 leaves a 60-minute gap so the buffered blocks touch at 11:30 and the strict <
          comparison admits it, while an event at 07:00-08:01 leaves a 59-minute gap on the LEADING side
          (block ends 08:31 > 08:30) and is refused. An implementation that buffers only the trailing side
          accepts the 59-minute case, and one that uses <= rejects the 60-minute case.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "PLANNED OutreachEvent ev_a assigned to rep_a on 2026-09-10 from 09:00 to 11:00, whose travel-buffered block is 08:30 to 11:30."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-211", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/outreach-events"
              payload: { assigned_representative_id: "${rep_a}", event_type: "STAND_DOWN", location_name: "Riverside Armory", starts_at: "2026-09-10T09:00:00.000Z", ends_at: "2026-09-10T11:00:00.000Z", underserved_flag: true }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { ev_a: $.data.id }
          trigger:
            - call: "POST /cvso/outreach-events"
              payload: { assigned_representative_id: "${rep_a}", event_type: "MOBILE_CLINIC", location_name: "Northline Shelter", starts_at: "2026-09-10T12:00:00.000Z", ends_at: "2026-09-10T13:00:00.000Z", underserved_flag: true }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { ev_b: $.data.id, ev_b_status: $.data.status }
            - call: "POST /cvso/outreach-events"
              payload: { assigned_representative_id: "${rep_a}", event_type: "MOBILE_CLINIC", location_name: "Westgate Encampment", starts_at: "2026-09-10T07:00:00.000Z", ends_at: "2026-09-10T08:01:00.000Z", underserved_flag: true }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { travel_err: $.data.error_id }
          assert:
            - "HTTP status of the first trigger call == 201"
            - "${ev_b_status} == PLANNED"
            - "${travel_err} == ERR_REPRESENTATIVE_TRAVEL_CONFLICT"
            - "HTTP status of the second trigger call == 409"
            - "OutreachEvent.${ev_a}.status == PLANNED"
            - "exactly two OutreachEvent rows exist for ${rep_a}"
            - "Representative.${rep_a}.caseload_weight == 4"

  # =====================================================================
  # RULE 9 — compensating_invariant
  # Two instances over DIFFERENT conserved quantities:
  #   program_pool_ledger  monetary cents on StateProgram.allocated_cents
  #   exam_slot_ledger     discrete slots on ExamSite.booked_slot_count
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: clawback_returns_program_allocation_to_zero_so_the_next_approval_allocates_exactly_its_own_award
        grounds:
          - calculations.program_pool_ledger
          - calculations.state_benefit_award_cents
          - state_machines.StateBenefitApplication.SUBMITTED_to_APPROVED
          - state_machines.StateBenefitApplication.PENDING_to_CLAWED_BACK
          - endpoints[POST /cvso/state-benefit-applications/{id}/disbursement]
        distinguishing_aspect: |
          The conserved quantity is money. Approving app1 raises StateProgram.allocated_cents by exactly its
          540000 award; the compensating CLAW_BACK removes that row from the {PENDING, ISSUED} input set and
          must return allocated_cents to exactly 0, not to some residue; the next approval then allocates
          exactly its own 450000 and never 990000. An implementation that decrements by a recomputed award,
          that leaves the clawed-back row in the ledger set, or that never decrements at all produces
          540000, 990000 or a negative figure at one of the three checkpoints.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "StateProgram prog TUITION_WAIVER fiscal_year 2026 with annual_pool_cents 990000, max_award_cents 900000, min_rating_pct 0, requires_wartime false; allocated_cents starts at 0."
            - "Veteran vet1 and Veteran vet2, each with discharge VERIFIED and intake_status SCREENED."
            - "SUBMITTED application app1 for vet1 requesting 12 credits (540000) and SUBMITTED application app2 for vet2 requesting 10 credits (450000); the veteran_ids differ so validations[priority=73] does not fire."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-221", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/state-programs"
              payload: { program_code: "TUI-2026-LEDGER", program_name: "Tuition Waiver Ledger Pool", program_type: "TUITION_WAIVER", fiscal_year: 2026, annual_pool_cents: 990000, min_rating_pct: 0, requires_wartime: false, max_award_cents: 900000 }
              as: SystemAdmin
              captures: { prog: $.data.id }
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet1: $.data.id }
            - call: "POST /cvso/veterans/${vet1}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc1: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc1}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/veterans/${vet1}/screen"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/veterans"
              payload: { full_name: "Nora Whitfield", date_of_birth: "1983-07-19", service_start_date: "2003-01-06", service_end_date: "2007-01-05", household_income_cents: 1200000, net_worth_cents: 900000, dependent_count: 1, homeless_status: "NOT_HOMELESS", referral_source: "OUTREACH_EVENT" }
              as: IntakeClerk
              captures: { vet2: $.data.id }
            - call: "POST /cvso/veterans/${vet2}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2003-01-06", claimed_service_end: "2007-01-05", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc2: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc2}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/veterans/${vet2}/screen"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "GET /cvso/state-programs/${prog}"
              payload: {}
              as: SystemAdmin
              captures: { pv1: $.data.version }
            - call: "POST /cvso/state-benefit-applications"
              payload: { veteran_id: "${vet1}", program_id: "${prog}", fiscal_year: 2026, expected_program_version: "${pv1}", tuition_credits_requested: 12 }
              as: IntakeClerk
              captures: { app1: $.data.id }
            - call: "GET /cvso/state-programs/${prog}"
              payload: {}
              as: SystemAdmin
              captures: { pv2: $.data.version }
            - call: "POST /cvso/state-benefit-applications"
              payload: { veteran_id: "${vet2}", program_id: "${prog}", fiscal_year: 2026, expected_program_version: "${pv2}", tuition_credits_requested: 10 }
              as: IntakeClerk
              captures: { app2: $.data.id }
          trigger:
            - call: "POST /cvso/state-benefit-applications/${app1}/determination"
              payload: { action: "APPROVE" }
              as: StateAuditor
              captures: { award1: $.data.benefit_amount_cents }
            - call: "GET /cvso/state-programs/${prog}"
              payload: {}
              as: SystemAdmin
              captures: { alloc_after_approve: $.data.allocated_cents }
            - call: "POST /cvso/state-benefit-applications/${app1}/disbursement"
              payload: { action: "CLAW_BACK", reason: "county audit found the enrolment was withdrawn" }
              as: SystemAdmin
              captures: { app1_disb: $.data.disbursement_status }
            - call: "GET /cvso/state-programs/${prog}"
              payload: {}
              as: SystemAdmin
              captures: { alloc_after_clawback: $.data.allocated_cents }
            - call: "POST /cvso/state-benefit-applications/${app2}/determination"
              payload: { action: "APPROVE" }
              as: StateAuditor
              captures: { award2: $.data.benefit_amount_cents }
            - call: "GET /cvso/state-programs/${prog}"
              payload: {}
              as: SystemAdmin
              captures: { alloc_final: $.data.allocated_cents }
          assert:
            - "${award1} == 540000"
            - "${alloc_after_approve} == 540000"
            - "${app1_disb} == CLAWED_BACK"
            - "${alloc_after_clawback} == 0"
            - "${award2} == 450000"
            - "${alloc_final} == 450000"
            - "StateBenefitApplication.${app1}.determination_status == APPROVED"
            - "StateBenefitApplication.${app1}.benefit_amount_cents == 540000"
            - "StateBenefitApplication.${app2}.disbursement_status == PENDING"

      - name: cancelling_an_appointment_frees_the_slot_so_the_same_window_can_be_rebooked_and_closed_out
        grounds:
          - calculations.exam_slot_ledger
          - calculations.exam_site_interval_conflict
          - state_machines.ExamAppointment.SCHEDULED_to_CANCELLED
          - state_machines.ExamAppointment.SCHEDULED_to_COMPLETED
          - state_machines.ExamAppointment.SCHEDULED_to_SCHEDULED
          - errors[ERR_EXAM_SITE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          The conserved quantity is a discrete slot count rather than money. At a concurrent_capacity 1 site
          booked_slot_count goes 0 -> 1 on scheduling, the identical window is refused while that slot is
          held, the compensating CANCEL returns it to exactly 0 which makes the very same window bookable
          again, and the terminal COMPLETE releases it once more to exactly 0 - never to -1 and never
          staying at 1. An implementation that counts all rows rather than SCHEDULED rows, or that
          decrements on CANCEL but not on COMPLETE, drifts at one of the four checkpoints.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z and is later moved to 2026-08-20T12:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "ExamSite site_one with concurrent_capacity 1 and buffer_minutes 15; booked_slot_count starts at 0."
            - "Veteran vet with discharge VERIFIED, intake_status SCREENED, ACTIVE PowerOfAttorney designating rep_a."
            - "Claim claim_s in EVIDENCE_DEVELOPMENT with one claimed condition, so required_points is 55 and it holds no evidence yet."
