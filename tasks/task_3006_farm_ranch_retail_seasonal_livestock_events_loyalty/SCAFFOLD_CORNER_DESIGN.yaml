  # ===========================================================================
  - section: calculations
    instances:

      - name: chick_volume_discount_tier_boundary_quantities
        claim_type: Correct Result
        grounds:
          - calculations.chick_order_total
        distinguishing_aspect: "Quantity 24 prices with 0% discount (24 x 349 = 8376) while quantity 25 drops into the 10% bracket (round_half_up(25 x 349 x 0.9) = 7853) — the 25th bird makes the whole order cheaper, pinning the bracket boundary exactly."
        test_recipe:
          setup:
            - "Spring store; schedule min 6 price 349, daily_capacity 500; lot 100 ON_SALE; two accounts; clock 2026-03-10T10:00:00Z."
          setup_api_calls:
            - *k_clock_mar10
            - *k_spring_store
            - *k_spring_campaign
            - *k_spring_teardown
            - *k_spring_reset
            - *k_spring_verify
            - *k_spring_activate
            - *k_spring_schedule
            - *k_spring_publish
            - *k_spring_lot
            - *k_spring_open_sale
            - *k_spring_account
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Kit Bulk", phone: "555-0222" }
              as: Anonymous
              captures: { bulk_acct: $.data.id }
          trigger:
            - call: "POST /chick-orders"
              payload: { store_id: "${k_store_id}", livestock_lot_id: "${k_lot_id}", loyalty_account_id: "${k_acct_id}", quantity: 24, pickup_date: "2026-03-12T10:00:00Z", expected_livestock_lot_version: "${k_lot_v}" }
              as: Customer
              as_user_id: "${k_acct_id}"
              captures: { o24_total: $.data.total_cents, o24_disc: $.data.discount_pct }
            - call: "GET /livestock-lots/${k_lot_id}"
              payload: {}
              as: StoreManager
              captures: { lot_v2: $.data.version }
            - call: "POST /chick-orders"
              payload: { store_id: "${k_store_id}", livestock_lot_id: "${k_lot_id}", loyalty_account_id: "${bulk_acct}", quantity: 25, pickup_date: "2026-03-12T10:00:00Z", expected_livestock_lot_version: "${lot_v2}" }
              as: Customer
              as_user_id: "${bulk_acct}"
              captures: { o25_total: $.data.total_cents, o25_disc: $.data.discount_pct }
          assert:
            - "o24_total == 8376 and o24_disc == 0.0"
            - "o25_total == 7853 and o25_disc == 0.1 (round_half_up(8725 x 0.9) = 7853)"

      - name: mortality_rate_exactly_at_threshold_does_not_quarantine
        claim_type: Constants Applied
        grounds:
          - calculations.care_log_mortality_rate
        distinguishing_aspect: "mortality_rate exactly 0.05 (5 deaths of 100) does NOT quarantine — the rule is strictly greater; the 6th death (0.06) suspends the lot."
        test_recipe:
          setup:
            - "Spring store; lot 100 ON_SALE; clock 2026-03-10T10:00:00Z."
          setup_api_calls:
            - *k_clock_mar10
