      - name: adjacent_bench_intervals_both_provision_while_a_one_day_overlap_is_refused
        claim_type: interval_merge
        grounds:
          - calculations.lab_bench_occupancy
          - validations.priority_28_ERR_LAB_CAPACITY_EXCEEDED
          - entities.Laboratory.decontamination_buffer_days
        distinguishing_aspect: "On a single-bench laboratory with a zero-day buffer, a grant ending 2027-03-31 and a grant starting 2027-04-01 are adjacent with a gap of zero days and must both provision, because the capacity test is per calendar day over inclusive endpoints. A third request starting on 2027-03-31 shares exactly one day with the first grant and must be refused with ERR_LAB_CAPACITY_EXCEEDED - so the boundary is the shared day itself, not a fuzzy proximity window."
