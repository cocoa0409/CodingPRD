              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-INDEX", description: "Indexed Flour 50#", product_class_code: "DRY_GROCERY", manufacturer_id: "${mfg_id}", pack_size: 1, last_cost_cents: 1234, avg_cost_cents: 1234, replacement_cost_cents: 1234, is_market_indexed: true, index_baseline_value: 100.00, index_baseline_cost_cents: 1234 }
              as: SystemAdmin
              captures: { idx_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-HALF", description: "Indexed Semolina 50#", product_class_code: "DRY_GROCERY", manufacturer_id: "${mfg_id}", pack_size: 1, last_cost_cents: 1000, avg_cost_cents: 1000, replacement_cost_cents: 1000, is_market_indexed: true, index_baseline_value: 100.00, index_baseline_cost_cents: 1000 }
              as: SystemAdmin
              captures: { half_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "INDEX-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z", notice_period_days: 30 }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "DRY_GROCERY", cost_basis: "LAST_COST", markup_type: "DOLLARS_PER_CASE", markup_value: 0, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /nac/price-change-notices"
              payload: { contract_id: "${ct_id}", product_id: "${idx_id}", cost_basis: "LAST_COST", effective_at: "2026-08-08T00:00:00Z", published_index_value: 107.75 }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { pcn_idx: $.data.id, new_cost_idx: $.data.new_cost_cents }
            - call: "POST /nac/price-change-notices"
              payload: { contract_id: "${ct_id}", product_id: "${half_id}", cost_basis: "LAST_COST", effective_at: "2026-08-08T00:00:00Z", published_index_value: 100.05 }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { pcn_half: $.data.id, new_cost_half: $.data.new_cost_cents }
          assert:
            - "${new_cost_idx} == 1330"
            - "${new_cost_idx} != 1329"
            - "PriceChangeNotice.${pcn_idx}.delta_pct == 7.78"
            - "PriceChangeNotice.${pcn_idx}.notice_required_days == 7"
            - "PriceChangeNotice.${pcn_idx}.earliest_effective_at == 2026-08-08T00:00:00Z"
            - "PriceChangeNotice.${pcn_idx}.status == PENDING"
            - "${new_cost_half} == 1001"
            - "${new_cost_half} != 1000"
            - "PriceChangeNotice.${pcn_half}.delta_pct == 0.10"
            - "PriceChangeNotice.${pcn_half}.notice_required_days == 7"
            - "Product.${idx_id}.last_cost_cents == 1234 (a PENDING notice does not move the cost)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies on different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: manufacturer_decision_requires_active_manufacturer
        grounds:
          - validations[priority=16]
          - errors.ERR_MANUFACTURER_SUSPENDED
          - entities.Manufacturer.fields.status
          - state_machines.DeviationAgreement.SUBMITTED_to_MANUFACTURER_APPROVED
          - roles.ManufacturerRep
        distinguishing_aspect: |
          Entity pair DeviationAgreement depends on Manufacturer: the identical
          SUBMITTED -> MANUFACTURER_APPROVED transition succeeds on the deviation
          whose manufacturer is ACTIVE and fails with ERR_MANUFACTURER_SUSPENDED on
          the deviation whose manufacturer is SUSPENDED, with nothing differing but
          the counterparty's status.
        test_recipe:
          setup:
            - "Operator HLG, manufacturer CPC with status ACTIVE and manufacturer NWB created directly with status SUSPENDED, DC-SEA."
            - "Products P-CHKN owned by CPC (last_cost 4200) and P-BEEF owned by NWB (last_cost 6000), both PROTEIN."
            - "Contract HLG-2026 ACTIVE with one unbounded PROTEIN LAST_COST PERCENT_OF_COST 12.50 tier and one IN_MARKET coverage."
            - "Two FIXED_NET_PRICE deviations, one per product/manufacturer pair, both advanced to SUBMITTED; the contract version is re-read before the second create so the OCC check passes."
            - "Logical clock left at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC", status: "ACTIVE" }
              as: SystemAdmin
              captures: { cpc_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Northwest Beef", manufacturer_code: "NWB", status: "SUSPENDED" }
              as: SystemAdmin
              captures: { nwb_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10#", product_class_code: "PROTEIN", manufacturer_id: "${cpc_id}", pack_size: 4, last_cost_cents: 4200, avg_cost_cents: 4100, replacement_cost_cents: 4300 }
              as: SystemAdmin
              captures: { chkn_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-BEEF", description: "Beef Chuck 4/10#", product_class_code: "PROTEIN", manufacturer_id: "${nwb_id}", pack_size: 4, last_cost_cents: 6000, avg_cost_cents: 5900, replacement_cost_cents: 6100 }
              as: SystemAdmin
              captures: { beef_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${cpc_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ct_ver1: $.data.version }
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${beef_id}", manufacturer_id: "${nwb_id}", bill_back_basis: "FIXED_NET_PRICE", requested_net_price_cents: 5800, max_operator_price_cents: 6200, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", expected_contract_version: "${ct_ver1}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { dev_susp_id: $.data.id }
            - call: "GET /nac/contracts/${ct_id}"
              payload: {}
              as: PricingAnalyst
              captures: { ct_ver2: $.data.version }
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${chkn_id}", manufacturer_id: "${cpc_id}", bill_back_basis: "FIXED_NET_PRICE", requested_net_price_cents: 3900, max_operator_price_cents: 4500, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", expected_contract_version: "${ct_ver2}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { dev_ok_id: $.data.id }
            - call: "POST /nac/deviation-agreements/${dev_susp_id}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nac/deviation-agreements/${dev_ok_id}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /nac/deviation-agreements/${dev_susp_id}/manufacturer-decision"
              payload: { decision: "APPROVE", decision_note: "Funded" }
              as: ManufacturerRep
              as_user_id: "${nwb_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /nac/deviation-agreements/${dev_ok_id}/manufacturer-decision"
              payload: { decision: "APPROVE", decision_note: "Funded" }
              as: ManufacturerRep
              as_user_id: "${cpc_id}"
              captures: { ok_status: $.data.status }
          assert:
            - "Manufacturer.${nwb_id}.status == SUSPENDED and Manufacturer.${cpc_id}.status == ACTIVE"
            - "the first trigger call returns HTTP 409 and ${err_id} == ERR_MANUFACTURER_SUSPENDED"
            - "DeviationAgreement.${dev_susp_id}.status == SUBMITTED (unchanged)"
            - "DeviationAgreement.${dev_susp_id}.version is unchanged by the refused call"
            - "${ok_status} == MANUFACTURER_APPROVED"
            - "DeviationAgreement.${dev_ok_id}.deviated_price_cents == 3900"

      - name: dispute_audit_requires_closed_rebate_period
        grounds:
          - validations[priority=37]
          - errors.ERR_REBATE_PERIOD_NOT_CLOSED
          - entities.RebatePeriod.fields.status
          - state_machines.PricingDispute.OPEN_to_UNDER_AUDIT
          - calculations.dispute_audit_repricing
        distinguishing_aspect: |
          A different entity pair than the first instance: PricingDispute depends on
          RebatePeriod, not on Manufacturer. The OPEN -> UNDER_AUDIT transition is
          refused with ERR_REBATE_PERIOD_NOT_CLOSED while the covering period is
          still OPEN and succeeds unchanged after the very same period is closed,
          proving the gate reads the other entity's status rather than any field of
          the dispute itself.
        test_recipe:
          setup:
            - "Operator HLG, manufacturer CPC, DC-SEA, product P-CHKN at last_cost 4200."
            - "Contract HLG-2026 ACTIVE with one unbounded PROTEIN LAST_COST PERCENT_OF_COST 12.50 tier and one IN_MARKET coverage."
            - "Rebate period 2026-08-01 .. 2026-09-01 left OPEN, one invoiced 300-case line at 4725 ordered 2026-08-10, and one OPEN PricingDispute on that line."
            - "Logical clock at 2026-08-10 for the first attempt, then advanced to 2026-09-01 so the period may be closed for the second attempt."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10#", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4200, avg_cost_cents: 4100, replacement_cost_cents: 4300 }
              as: SystemAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
            - call: "POST /nac/rebate-periods"
              payload: { contract_id: "${ct_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: RebateAccountant
              captures: { rp_id: $.data.id }
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", distribution_center_id: "${dc_id}", quantity_cases: 300 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ln_id: $.data.id }
            - call: "POST /nac/order-lines/${ln_id}/invoice"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/pricing-disputes"
              payload: { order_line_id: "${ln_id}", claimed_correct_unit_price_cents: 4578, dispute_reason: "TIER_MISAPPLIED" }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /nac/pricing-disputes/${disp_id}/start-audit"
              payload: {}
              as: ContractAuditor
              as_user_id: "auditor-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /nac/rebate-periods/${rp_id}/close"
              payload: {}
              as: RebateAccountant
            - call: "POST /nac/pricing-disputes/${disp_id}/start-audit"
              payload: {}
              as: ContractAuditor
              as_user_id: "auditor-1"
              captures: { second_status: $.data.status }
          assert:
            - "RebatePeriod.${rp_id}.status == OPEN at the time of the first trigger call"
            - "the first trigger call returns HTTP 409 and ${err_id} == ERR_REBATE_PERIOD_NOT_CLOSED"
            - "PricingDispute.${disp_id}.status == OPEN after the refused call"
            - "PricingDispute.${disp_id}.audited_correct_unit_price_cents == null after the refused call"
            - "RebatePeriod.${rp_id}.status == CLOSED after the close call"
            - "${second_status} == UNDER_AUDIT"
            - "PricingDispute.${disp_id}.audited_correct_unit_price_cents == 4725"
            - "PricingDispute.${disp_id}.variance_cents_per_case == 0"
            - "PricingDispute.${disp_id}.variance_pct == 0.00"

  # ===========================================================================
  # Rule 8 — Resource temporal overlap with different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: deviation_windows_half_open_touching_endpoints_allowed
        grounds:
          - validations[priority=18]
          - errors.ERR_DEVIATION_PERIOD_OVERLAP
          - entities.DeviationAgreement.fields.effective_from
          - entities.DeviationAgreement.fields.effective_to
          - concurrency_rules.deviation-create-stale-contract
          - endpoints["POST /nac/deviation-agreements"]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_from, effective_to) on the
          DeviationAgreement resource, so a window starting exactly where the
          incumbent ends (2026-09-01) is accepted while a window starting one day
          earlier (2026-08-31) is rejected — adjacency is legal here, which is the
          opposite of the DcCoverage buffer rule.
        test_recipe:
          setup:
            - "Operator HLG, manufacturer CPC, DC-SEA, product P-CHKN at last_cost 4200 owned by CPC."
            - "Contract HLG-2026 ACTIVE with one unbounded PROTEIN LAST_COST PERCENT_OF_COST 12.50 tier and one IN_MARKET coverage."
            - "One ACTIVE FIXED_NET_PRICE deviation on (HLG-2026, P-CHKN) with requested_net_price_cents 3900 over the half-open window 2026-08-01 .. 2026-09-01; the activating manager uses a different X-User-ID than the submitting analyst so segregation of duties passes."
            - "The contract version is re-read immediately before every create so no attempt can be short-circuited by the priority 8 OCC check."
            - "Logical clock left at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10#", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4200, avg_cost_cents: 4100, replacement_cost_cents: 4300 }
              as: SystemAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ct_ver1: $.data.version }
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", manufacturer_id: "${mfg_id}", bill_back_basis: "FIXED_NET_PRICE", requested_net_price_cents: 3900, max_operator_price_cents: 4500, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_contract_version: "${ct_ver1}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { dev1_id: $.data.id }
            - call: "POST /nac/deviation-agreements/${dev1_id}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nac/deviation-agreements/${dev1_id}/manufacturer-decision"
              payload: { decision: "APPROVE", decision_note: "Funded for August" }
              as: ManufacturerRep
              as_user_id: "${mfg_id}"
            - call: "POST /nac/deviation-agreements/${dev1_id}/activate"
              payload: {}
              as: NationalAccountManager
              as_user_id: "nam-1"
            - call: "GET /nac/contracts/${ct_id}"
              payload: {}
              as: PricingAnalyst
              captures: { ct_ver2: $.data.version }
          trigger:
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", manufacturer_id: "${mfg_id}", bill_back_basis: "FIXED_NET_PRICE", requested_net_price_cents: 3950, max_operator_price_cents: 4500, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", expected_contract_version: "${ct_ver2}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { dev2_id: $.data.id }
            - call: "GET /nac/contracts/${ct_id}"
              payload: {}
              as: PricingAnalyst
              captures: { ct_ver3: $.data.version }
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", manufacturer_id: "${mfg_id}", bill_back_basis: "FIXED_NET_PRICE", requested_net_price_cents: 3975, max_operator_price_cents: 4500, effective_from: "2026-08-31T00:00:00Z", effective_to: "2026-09-30T00:00:00Z", expected_contract_version: "${ct_ver3}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "DeviationAgreement.${dev1_id}.status == ACTIVE with effective_to 2026-09-01T00:00:00Z"
            - "the first trigger call returns HTTP 201 and DeviationAgreement.${dev2_id}.status == DRAFT"
            - "DeviationAgreement.${dev2_id}.effective_from == 2026-09-01T00:00:00Z (touching the incumbent's effective_to is accepted)"
            - "DeviationAgreement.${dev2_id}.deviated_price_cents == 3950"
            - "the third trigger call returns HTTP 409 and ${err_id} == ERR_DEVIATION_PERIOD_OVERLAP"
            - "GET /nac/deviation-agreements?contract_id=${ct_id}&product_id=${prod_id} returns exactly 2 rows"

      - name: dc_coverage_intervals_closed_with_fourteen_day_changeover_buffer
        grounds:
          - validations[priority=19]
          - errors.ERR_DC_COVERAGE_BUFFER_CONFLICT
          - entities.DcCoverage.fields.coverage_from
          - entities.DcCoverage.fields.coverage_to
          - entities.DcCoverage.fields.status
          - endpoints["POST /nac/dc-coverages"]
        distinguishing_aspect: |
          Different resource entity and different interval semantics: DcCoverage uses
          CLOSED [coverage_from, coverage_to] intervals plus a mandatory 14-day
          changeover gap measured as later.coverage_from - earlier.coverage_to, so a
          5-day gap and even an exactly-14-day gap are rejected while a 15-day gap is
          accepted — disjointness alone is not sufficient here, unlike the deviation
          window rule.
        test_recipe:
          setup:
            - "Operator HLG, manufacturer CPC, one DC DC-SEA, product P-CHKN so the contract can be constructed."
            - "Contract HLG-2026 with one unbounded PROTEIN tier and one IN_MARKET coverage over the closed interval 2026-08-01 .. 2026-08-31, then signed to ACTIVE."
            - "No further coverage exists for that (contract, DC) pair, so every trigger call is measured against the single 2026-08-31 end date."
            - "Logical clock left at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10#", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4200, avg_cost_cents: 4100, replacement_cost_cents: 4300 }
              as: SystemAdmin
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2026-08-31T00:00:00Z" }
              as: NationalAccountManager
              captures: { cov1_id: $.data.id }
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-09-05T00:00:00Z", coverage_to: "2026-10-31T00:00:00Z" }
              as: NationalAccountManager
              captures: { err_gap5: $.data.error_id }
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-09-14T00:00:00Z", coverage_to: "2026-10-31T00:00:00Z" }
              as: NationalAccountManager
              captures: { err_gap14: $.data.error_id }
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-09-15T00:00:00Z", coverage_to: "2026-10-31T00:00:00Z" }
              as: NationalAccountManager
              captures: { cov_ok_id: $.data.id }
          assert:
            - "DcCoverage.${cov1_id}.status == ACTIVE with coverage_to 2026-08-31T00:00:00Z"
            - "the first trigger call (gap 5 days) returns HTTP 409 and ${err_gap5} == ERR_DC_COVERAGE_BUFFER_CONFLICT"
            - "the second trigger call (gap exactly 14 days) returns HTTP 409 and ${err_gap14} == ERR_DC_COVERAGE_BUFFER_CONFLICT because the comparison is strictly greater than"
            - "the third trigger call (gap 15 days) returns HTTP 201 and DcCoverage.${cov_ok_id}.status == ACTIVE"
            - "DcCoverage.${cov_ok_id}.coverage_from == 2026-09-15T00:00:00Z"
            - "GET /nac/dc-coverages?contract_id=${ct_id}&distribution_center_id=${dc_id} returns exactly 2 rows"

  # ===========================================================================
  # Rule 9 — Compensating invariants over different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: manufacturer_remitted_cash_conserved_across_apply_and_reverse
        grounds:
          - calculations.manufacturer_recovery_conservation
          - calculations.bill_back_remittance_waterfall
          - entities.Manufacturer.fields.total_remitted_cents
          - entities.Manufacturer.fields.unapplied_credit_cents
          - entities.Manufacturer.fields.open_claim_exposure_cents
          - entities.BillBackClaim.fields.recovered_amount_cents
          - state_machines.BillBackRemittance.APPLIED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity: REMITTED CASH held for one manufacturer, pinned as
          Manufacturer.total_remitted_cents == SUM(claim.recovered_amount_cents) +
          Manufacturer.unapplied_credit_cents. A 450000 remittance against claims of
          247500 and 165000 must satisfy 450000 == 412500 + 37500, and reversing it
          must drive every one of those three terms back to 0 with no drift.
        test_recipe:
          setup:
            - "Operator HLG, manufacturer CPC, DC-SEA, product P-CHKN at last_cost 4200."
            - "Contract HLG-2026 ACTIVE with one unbounded PROTEIN LAST_COST PERCENT_OF_COST 12.50 tier (list price 4725) and one IN_MARKET coverage."
            - "An ACTIVE FIXED_NET_PRICE deviation with requested_net_price_cents 3900 covering 2026-08-01 .. 2026-11-01, giving an 825 cent per case bill-back delta."
            - "Two OPEN rebate periods 2026-08-01 .. 2026-09-01 and 2026-09-01 .. 2026-10-01 so both lines can be booked."
            - "Two invoiced lines: 300 cases on 2026-08-05 and 200 cases on 2026-09-05."
            - "Two SUBMITTED bill-back claims on disjoint windows: K1 over 2026-08-01 .. 2026-09-01 for 247500 and K2 over 2026-09-01 .. 2026-10-01 for 165000; the deviation version is re-read before the second claim so the OCC check passes."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10#", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4200, avg_cost_cents: 4100, replacement_cost_cents: 4300 }
              as: SystemAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ct_ver: $.data.version }
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", manufacturer_id: "${mfg_id}", bill_back_basis: "FIXED_NET_PRICE", requested_net_price_cents: 3900, max_operator_price_cents: 4500, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", expected_contract_version: "${ct_ver}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { dev_id: $.data.id }
            - call: "POST /nac/deviation-agreements/${dev_id}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nac/deviation-agreements/${dev_id}/manufacturer-decision"
              payload: { decision: "APPROVE", decision_note: "Funded through October" }
              as: ManufacturerRep
              as_user_id: "${mfg_id}"
            - call: "POST /nac/deviation-agreements/${dev_id}/activate"
              payload: {}
              as: NationalAccountManager
              as_user_id: "nam-1"
              captures: { dev_ver1: $.data.version }
            - call: "POST /nac/rebate-periods"
              payload: { contract_id: "${ct_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: RebateAccountant
            - call: "POST /nac/rebate-periods"
              payload: { contract_id: "${ct_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: RebateAccountant
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", distribution_center_id: "${dc_id}", quantity_cases: 300 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ln1_id: $.data.id }
            - call: "POST /nac/order-lines/${ln1_id}/invoice"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", distribution_center_id: "${dc_id}", quantity_cases: 200 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ln2_id: $.data.id }
            - call: "POST /nac/order-lines/${ln2_id}/invoice"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/bill-back-claims"
              payload: { deviation_agreement_id: "${dev_id}", claim_period_start: "2026-08-01T00:00:00Z", claim_period_end: "2026-09-01T00:00:00Z", expected_deviation_agreement_version: "${dev_ver1}" }
              as: RebateAccountant
              as_user_id: "acct-1"
              captures: { k1_id: $.data.id }
            - call: "GET /nac/deviation-agreements/${dev_id}"
              payload: {}
              as: RebateAccountant
              captures: { dev_ver2: $.data.version }
            - call: "POST /nac/bill-back-claims"
              payload: { deviation_agreement_id: "${dev_id}", claim_period_start: "2026-09-01T00:00:00Z", claim_period_end: "2026-10-01T00:00:00Z", expected_deviation_agreement_version: "${dev_ver2}" }
              as: RebateAccountant
              as_user_id: "acct-1"
              captures: { k2_id: $.data.id }
            - call: "POST /nac/bill-back-claims/${k1_id}/submit"
              payload: {}
              as: RebateAccountant
              as_user_id: "acct-1"
            - call: "POST /nac/bill-back-claims/${k2_id}/submit"
              payload: {}
              as: RebateAccountant
              as_user_id: "acct-1"
          trigger:
            - call: "POST /nac/bill-back-remittances"
              payload: { manufacturer_id: "${mfg_id}", remitted_amount_cents: 450000, remittance_reference: "CPC-WIRE-0007" }
              as: RebateAccountant
              as_user_id: "acct-1"
              captures: { rem_id: $.data.id, applied: $.data.applied_amount_cents, unapplied: $.data.unapplied_amount_cents }
            - call: "POST /nac/bill-back-remittances/${rem_id}/reverse"
              payload: { reason: "Wire recalled by manufacturer treasury" }
              as: RebateAccountant
              as_user_id: "acct-1"
              captures: { reversed_status: $.data.status }
          assert:
            - "BillBackClaim.${k1_id}.claimed_amount_cents == 247500 and BillBackClaim.${k2_id}.claimed_amount_cents == 165000"
            - "Manufacturer.${mfg_id}.open_claim_exposure_cents == 412500 before the trigger"
            - "${applied} == 412500 and ${unapplied} == 37500"
            - "BillBackClaim.${k1_id}.recovered_amount_cents == 247500 and BillBackClaim.${k1_id}.status == RECOVERED"
            - "BillBackClaim.${k2_id}.recovered_amount_cents == 165000 and BillBackClaim.${k2_id}.status == RECOVERED"
            - "Manufacturer.${mfg_id}.total_remitted_cents == 450000"
            - "Manufacturer.${mfg_id}.unapplied_credit_cents == 37500"
            - "INVARIANT after apply: 450000 == 247500 + 165000 + 37500"
            - "Manufacturer.${mfg_id}.open_claim_exposure_cents == 0 after apply"
            - "OrderLine.${ln1_id}.billback_status == RECOVERED and OrderLine.${ln2_id}.billback_status == RECOVERED"
            - "${reversed_status} == REVERSED"
            - "BillBackClaim.${k1_id}.recovered_amount_cents == 0 and BillBackClaim.${k1_id}.status == SUBMITTED after reverse"
            - "BillBackClaim.${k2_id}.recovered_amount_cents == 0 and BillBackClaim.${k2_id}.status == SUBMITTED after reverse"
            - "Manufacturer.${mfg_id}.total_remitted_cents == 0 and Manufacturer.${mfg_id}.unapplied_credit_cents == 0 after reverse"
            - "INVARIANT after reverse: 0 == 0 + 0 + 0"
            - "Manufacturer.${mfg_id}.open_claim_exposure_cents == 412500 after reverse (exactly its pre-apply value)"
            - "OrderLine.${ln1_id}.billback_status == CLAIMED and OrderLine.${ln2_id}.billback_status == CLAIMED after reverse"

      - name: rebate_liability_conserved_across_settle_and_reversal
        grounds:
          - calculations.rebate_liability_conservation
          - calculations.rebate_accrual_split
          - entities.Contract.fields.rebate_payable_cents
          - entities.Contract.fields.rebate_settled_total_cents
          - entities.Manufacturer.fields.rebate_funding_payable_cents
          - state_machines.RebatePeriod.CLOSED_to_SETTLED
          - state_machines.RebatePeriod.SETTLED_to_CLOSED
        distinguishing_aspect: |
          A different conserved quantity than the cash invariant: REBATE LIABILITY on
          one contract, pinned as Contract.rebate_payable_cents +
          Contract.rebate_settled_total_cents == SUM(operator_rebate_cents of CLOSED
          and SETTLED periods). The sum must stay exactly 56700 across close, settle
          and reverse-settlement even though the two terms swap between 56700/0 and
          0/56700, and the manufacturer mirror must return to 34020.
        test_recipe:
          setup:
            - "Operator HLG, manufacturer CPC, DC-SEA, product P-CHKN at last_cost 4200."
            - "Contract HLG-2026 ACTIVE, DOLLAR_WEIGHTED, with one unbounded PROTEIN LAST_COST PERCENT_OF_COST 12.50 tier (list 4725) counting as contracted, and one IN_MARKET coverage."
            - "Rebate period 2026-08-01 .. 2026-09-01 with a single invoiced 300-case line (extended 1417500), giving compliance 100.00, rate 4.00 and an operator rebate of 56700 split 34020 manufacturer / 22680 distributor."
            - "Logical clock advanced to 2026-09-01 so the period may be closed; no dispute exists so settlement is not blocked."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10#", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4200, avg_cost_cents: 4100, replacement_cost_cents: 4300 }
              as: SystemAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z", compliance_basis: "DOLLAR_WEIGHTED" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 0, counts_as_contracted: true }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
            - call: "POST /nac/rebate-periods"
              payload: { contract_id: "${ct_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: RebateAccountant
              captures: { rp_id: $.data.id }
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", distribution_center_id: "${dc_id}", quantity_cases: 300 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ln_id: $.data.id }
            - call: "POST /nac/order-lines/${ln_id}/invoice"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /nac/rebate-periods/${rp_id}/close"
              payload: {}
              as: RebateAccountant
              captures: { accrued: $.data.operator_rebate_cents }
            - call: "POST /nac/rebate-periods/${rp_id}/settle"
              payload: { settlement_reference: "ACH-HLG-2026-08" }
              as: RebateAccountant
              as_user_id: "acct-1"
              captures: { settled: $.data.settled_amount_cents }
            - call: "POST /nac/rebate-periods/${rp_id}/reverse-settlement"
              payload: { reason: "Operator remit instructions incorrect" }
              as: ContractAuditor
              as_user_id: "auditor-1"
              captures: { reopened_status: $.data.status }
          assert:
            - "OrderLine.${ln_id}.extended_price_cents == 1417500 and OrderLine.${ln_id}.is_contracted_item == true"
            - "RebatePeriod.${rp_id}.compliance_pct == 100.00 and RebatePeriod.${rp_id}.rebate_rate_pct == 4.00"
            - "${accrued} == 56700"
            - "RebatePeriod.${rp_id}.manufacturer_funded_cents == 34020 and RebatePeriod.${rp_id}.distributor_funded_cents == 22680"
            - "after close: Contract.${ct_id}.rebate_payable_cents == 56700 and Contract.${ct_id}.rebate_settled_total_cents == 0"
            - "after close: Manufacturer.${mfg_id}.rebate_funding_payable_cents == 34020"
            - "INVARIANT after close: 56700 + 0 == 56700"
            - "${settled} == 56700 and RebatePeriod.${rp_id}.status == SETTLED"
