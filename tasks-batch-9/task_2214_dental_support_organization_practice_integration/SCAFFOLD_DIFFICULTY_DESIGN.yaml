  - rule_id: transitive_cascade
    instances:

      - name: affiliation_close_five_hop_cascade_to_payer_contract
        grounds:
          - state_machines.Affiliation.SIGNED_to_CLOSED
          - state_machines.Practice.PRE_CLOSE_to_STABILIZING
          - state_machines.DoctorEmployment.OFFERED_to_ACTIVE
          - state_machines.DoctorEmployment.OFFERED_to_LAPSED
          - state_machines.PayerContract.LEGACY_to_PENDING_CREDENTIALING
          - calculations.practice_posture
        distinguishing_aspect: |
          Depth 5: closing the affiliation (hop 1) flips the practice to
          AFFILIATED and STABILIZING (hop 2, caused by hop 1), which activates
          the accepted employment and lapses the unaccepted one (hop 3, caused by
          hop 2), which creates one PayerEnrollment dated close_date + 90 days
          (hop 4, caused by hop 3), which drives the PayerContract from LEGACY to
          PENDING_CREDENTIALING (hop 5, caused by hop 4) — the contract is two
          entities away from any field the request body mentions.
        test_recipe:
          setup:
            - "One Affiliation SIGNED at logical clock 2026-09-01T00:00:00Z with one Practice in IL, one EFFECTIVE ServiceAgreement and one LEGACY PayerContract."
            - "Two OFFERED DoctorEmployments at that practice: doctor A has accepted the offer while affiliation.status was SIGNED (offer_accepted true) and doctor B never accepted (offer_accepted false)."
          setup_api_calls:
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
