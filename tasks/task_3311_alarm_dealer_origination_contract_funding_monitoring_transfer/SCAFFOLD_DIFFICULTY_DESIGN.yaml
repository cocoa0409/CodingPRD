              payload: { contract_id: "${kok_id}" }
              as: MonitoringOperator
              captures: { ma_ok_id: "$.data[0].id" }
            - call: "POST /alarm-funding/monitoring-transfers/${ma_ok_id}/trigger"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-funding/dealer-packages/${p7_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${d1_id}"
            - call: "GET /alarm-funding/dealer-packages/${p7_id}"
              payload: {}
              as: FundingAnalyst
              captures: { p7_v: $.data.version }
            - call: "POST /alarm-funding/dealer-packages/${p7_id}/approve"
