    side_effects: ["shoot_duration_minutes + scheduled_end_utc computed; client_agent_id := X-User-ID"]

  - method: GET
    path: "/shoot-bookings"
    description: "List ShootBookings"
    roles: [ClientAgent, Photographer, Coordinator, OpsAdmin]
