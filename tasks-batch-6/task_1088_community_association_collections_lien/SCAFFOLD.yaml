# =============================================================================
# task_1088 — Community-Association Collections & Lien (Expert)
# Seed tables (§1.0–§1.7). Difficulty (§1.8) and Corner (§1.9) designs live in
# their own sibling files.
# =============================================================================

scenario: "Community-Association Collections & Lien: delinquent-assessment & aging, notice & demand (FDCPA), payment plan & agreement, lien & foreclosure referral, attorney & cost, bankruptcy & payoff, trust-accounting & remittance, reporting"

domain_name: community-association-collections-lien
api_prefix: /collections

complexity_profile:
  primary_archetype: compliance_audit          # FDCPA-constrained collection lifecycle with audit trail
  secondary_archetype: ledger_reconciliation    # aging + payoff + trust-accounting reconciliation
  complexity_layers:
    - optimistic_concurrency        # OCC on Account.version (plan create) and Association.version (remittance create)
    - cascading_side_effects        # bankruptcy stay + foreclosure charge-off + payment reversal chains
    - dual_variant_calculation      # payoff PROVISIONAL vs BINDING; remittance CASH vs NET
    - rate_threshold_triggers       # lien-minimum balance, validation-period elapse, plan-breach count
  entity_topology: flat             # peer collections under a shared /collections mount, FK links in body
  state_machine_shape: cyclic       # Notice SENT<->DISPUTED, PaymentPlan ACTIVE<->BREACHED
  relationship_patterns:
    - one_to_many                   # Association->Account->(Assessment,Payment,Notice,PaymentPlan,Lien,...)
    - cross_aggregate               # ForeclosureReferral.lien_id references a Lien; cascades cross entities
  role_model: segregation_of_duties # CollectionsAgent vs ComplianceOfficer vs TrustAccountant; maker-checker on legal escalation
  consistency_model: immediate      # all cascades applied atomically within the triggering request

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Association
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Community association (HOA/condo) legal name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code governing FDCPA/lien statutes" }
      - { name: interest_rate_annual_pct, type: number, source: input, default: 12.0, description: "Annual simple-interest rate on delinquent principal, percent" }
      - { name: late_fee_cents, type: integer, source: input, default: 2500, description: "Flat late fee amount in cents" }
      - { name: management_fee_pct, type: number, source: input, default: 20.0, description: "Collections management fee percent, applied per remittance" }
      - { name: trust_balance_cents, type: integer, source: computed, description: "Trust cash held for this association: sum(Payment.amount_cents where status=POSTED for its accounts) - sum(Remittance.gross_amount_cents where status=REMITTED). Conserved quantity." }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id; the association this delinquent account belongs to" }
      - { name: unit_number, type: string, source: input, description: "Unit / lot identifier within the association" }
      - { name: owner_name, type: string, source: input, description: "Delinquent owner full name (also the FDCPA consumer)" }
      - { name: status, type: enum, source: system, description: "CURRENT | DELINQUENT | PAYMENT_PLAN | LIEN | FORECLOSURE | BANKRUPTCY | CHARGED_OFF | CLOSED — collection-stage state machine" }
      - { name: total_balance_cents, type: integer, source: computed, description: "sum(Assessment.balance_cents where status in {OPEN,PARTIAL}) for this account. Conserved receivable quantity." }
      - { name: aging, type: object, source: computed, description: "Aging buckets in cents by days_overdue at logical-clock now: {bucket_current, bucket_1_30, bucket_31_60, bucket_61_90, bucket_91_plus}" }

  - name: Assessment
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account charged" }
      - { name: charge_type, type: enum, source: input, description: "REGULAR | SPECIAL | LATE_FEE | INTEREST | ATTORNEY_COST | FINE" }
      - { name: amount_cents, type: integer, source: input, description: "Original charge amount in cents; must be > 0" }
      - { name: due_date, type: datetime, source: input, description: "ISO8601 date the charge is due; drives aging and delinquency" }
      - { name: balance_cents, type: integer, source: computed, description: "Unpaid remainder = amount_cents - sum(applied payment allocations). Starts equal to amount_cents." }
      - { name: status, type: enum, source: system, description: "OPEN | PARTIAL | PAID | WAIVED" }

  - name: Payment
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account credited" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; must be > 0" }
      - { name: received_date, type: datetime, source: input, description: "ISO8601 date funds received; drives remittance period inclusion" }
      - { name: allocations, type: array, source: computed, description: "Ordered list of {assessment_id, applied_cents} produced by the waterfall at POST time" }
      - { name: unapplied_cents, type: integer, source: computed, description: "Overpayment remainder not applied to any assessment (unapplied credit)" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED" }
      - { name: reversal_reason, type: enum, source: input, description: "NSF | ADJUSTMENT — supplied only on reverse; null otherwise", default: null }

  - name: Notice
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account/consumer noticed" }
      - { name: notice_type, type: enum, source: input, description: "VALIDATION | DEMAND | INTENT_TO_LIEN | INTENT_TO_FORECLOSE" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | DISPUTED | EXPIRED | VOID" }
      - { name: sent_date, type: datetime, source: computed, description: "Logical-clock now stamped on DRAFT->SENT (and reset on DISPUTED->SENT). Null while DRAFT." }
      - { name: dispute_date, type: datetime, source: computed, description: "Logical-clock now stamped on SENT->DISPUTED; null otherwise" }

  - name: PaymentPlan
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account under agreement" }
      - { name: total_amount_cents, type: integer, source: input, description: "Total amount financed by the plan in cents; must be > 0" }
      - { name: installment_cents, type: integer, source: input, description: "Per-installment amount in cents" }
      - { name: num_installments, type: integer, source: input, description: "Number of monthly installments; must be >= 1" }
      - { name: first_due_date, type: datetime, source: input, description: "ISO8601 date of first installment" }
      - { name: final_due_date, type: datetime, source: computed, description: "first_due_date + (num_installments-1)*30 days; used for plan-overlap interval [first_due_date, final_due_date]" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Cumulative payments credited to this plan's account since activation" }
      - { name: missed_count, type: integer, source: computed, description: "Count of installment due dates <= now whose cumulative-expected exceeds amount_paid_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | BREACHED | SUSPENDED | COMPLETED | CANCELLED" }

  - name: Lien
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account liened" }
      - { name: recorded_amount_cents, type: integer, source: computed, description: "Snapshot of Account.total_balance_cents at the instant the lien is recorded" }
      - { name: recorded_date, type: datetime, source: computed, description: "Logical-clock now at recording" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who recorded the lien; used for maker-checker SoD against ForeclosureReferral.referred_by_user_id" }
      - { name: status, type: enum, source: system, description: "RECORDED | STAYED | FORECLOSING | RELEASED" }

  - name: ForeclosureReferral
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account referred for foreclosure" }
      - { name: lien_id, type: string, source: input, description: "FK -> Lien.id; the recorded lien being foreclosed" }
      - { name: attorney_name, type: string, source: input, description: "Referred attorney / firm name" }
      - { name: referred_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who created the referral; must differ from Lien.recorded_by_user_id (SoD)" }
      - { name: referred_date, type: datetime, source: computed, description: "Logical-clock now at referral" }
      - { name: status, type: enum, source: system, description: "REFERRED | FILED | STAYED | SALE_COMPLETED | WITHDRAWN" }

  - name: BankruptcyCase
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the debtor account" }
      - { name: chapter, type: enum, source: input, description: "CH7 | CH13" }
      - { name: case_number, type: string, source: input, description: "Court case number" }
      - { name: filed_date, type: datetime, source: input, description: "ISO8601 petition date; imposes the automatic stay" }
      - { name: status, type: enum, source: system, description: "FILED | DISCHARGED | DISMISSED" }

  - name: Remittance
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id; the association being remitted to" }
      - { name: period_start, type: datetime, source: input, description: "ISO8601 inclusive start of the collection period" }
      - { name: period_end, type: datetime, source: input, description: "ISO8601 inclusive end of the collection period" }
      - { name: basis, type: enum, source: input, description: "CASH | NET — dual-variant selector for gross computation", default: CASH }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Collected funds in period per basis (see remittance_amounts calc)" }
      - { name: management_fee_cents, type: integer, source: computed, description: "sum over included payments of round(payment.amount_cents * management_fee_pct/100) — round-per-payment then sum" }
      - { name: net_amount_cents, type: integer, source: computed, description: "gross_amount_cents - management_fee_cents" }
      - { name: status, type: enum, source: system, description: "PENDING | REMITTED | VOID" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: CURRENT
    terminal_states: [CLOSED]
    transitions:
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /collections/accounts/{accountId}/transition (to_status=DELINQUENT)"
        actor: CollectionsAgent
        preconditions:
          - "total_balance_cents > 0 (ERR_INVALID_AMOUNT if zero balance)"
          - "at least one Assessment with status in {OPEN,PARTIAL} and due_date <= now (ERR_NOT_DELINQUENT)"
        side_effects: []
      - from: DELINQUENT
        to: CURRENT
        trigger: "system: payment allocation drives total_balance_cents to 0"
        actor: system
        preconditions: ["total_balance_cents == 0 after allocation"]
        side_effects: ["any RECORDED/FORECLOSING Lien on the account -> RELEASED (see Lien cascade)"]
      - from: LIEN
        to: CURRENT
        trigger: "system: payment allocation drives total_balance_cents to 0"
        actor: system
        preconditions: ["total_balance_cents == 0 after allocation"]
        side_effects: ["RECORDED Lien on the account -> RELEASED"]
      - from: DELINQUENT
        to: PAYMENT_PLAN
        trigger: "system: PaymentPlan DRAFT->ACTIVE"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAYMENT_PLAN
        to: DELINQUENT
        trigger: "system: PaymentPlan ACTIVE->BREACHED"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELINQUENT
        to: LIEN
        trigger: "system: Lien recorded (POST /collections/liens)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LIEN
        to: FORECLOSURE
        trigger: "system: ForeclosureReferral REFERRED->FILED"
        actor: system
        preconditions: []
        side_effects: []
      - from: FORECLOSURE
        to: CHARGED_OFF
        trigger: "system: ForeclosureReferral FILED->SALE_COMPLETED"
        actor: system
        preconditions: []
        side_effects: ["all Assessments in {OPEN,PARTIAL} -> WAIVED"]
      - from: DELINQUENT
        to: BANKRUPTCY
        trigger: "system: BankruptcyCase created (FILED)"
        actor: system
        preconditions: []
        side_effects: ["cascade L2/L3: RECORDED Liens -> STAYED, then their FILED/REFERRED ForeclosureReferrals -> STAYED; ACTIVE PaymentPlan -> SUSPENDED"]
      - from: PAYMENT_PLAN
        to: BANKRUPTCY
        trigger: "system: BankruptcyCase created (FILED)"
        actor: system
        preconditions: []
        side_effects: ["ACTIVE PaymentPlan -> SUSPENDED"]
      - from: LIEN
        to: BANKRUPTCY
        trigger: "system: BankruptcyCase created (FILED)"
        actor: system
        preconditions: []
        side_effects: ["RECORDED Liens -> STAYED (L2)"]
      - from: FORECLOSURE
        to: BANKRUPTCY
        trigger: "system: BankruptcyCase created (FILED)"
        actor: system
        preconditions: []
        side_effects: ["FORECLOSING Liens -> STAYED (L2); FILED ForeclosureReferrals -> STAYED (L3)"]
      - from: BANKRUPTCY
        to: DELINQUENT
        trigger: "system: BankruptcyCase FILED->DISMISSED"
        actor: system
        preconditions: []
        side_effects: ["STAYED Liens -> RECORDED; STAYED ForeclosureReferrals -> REFERRED; SUSPENDED PaymentPlan -> ACTIVE"]
      - from: BANKRUPTCY
        to: CHARGED_OFF
        trigger: "system: BankruptcyCase FILED->DISCHARGED"
        actor: system
        preconditions: []
        side_effects: ["all Assessments in {OPEN,PARTIAL} -> WAIVED; STAYED/RECORDED Liens -> RELEASED"]
      - from: CURRENT
        to: CLOSED
        trigger: "POST /collections/accounts/{accountId}/transition (to_status=CLOSED)"
        actor: CollectionsAgent
        preconditions: ["total_balance_cents == 0 (ERR_INVALID_STATE otherwise)", "no Lien in {RECORDED,STAYED,FORECLOSING} and no non-terminal ForeclosureReferral (ERR_INVALID_STATE)"]
        side_effects: []
      - from: CHARGED_OFF
        to: CLOSED
        trigger: "POST /collections/accounts/{accountId}/transition (to_status=CLOSED)"
        actor: ComplianceOfficer
        preconditions: ["no BankruptcyCase in FILED (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: Assessment
    initial_state: OPEN
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: OPEN
        to: PARTIAL
        trigger: "system: payment allocation applies part of balance_cents"
        actor: system
        preconditions: ["0 < applied_cents < balance_cents"]
        side_effects: ["balance_cents decremented by applied_cents; Account.total_balance_cents recomputed"]
      - from: OPEN
        to: PAID
        trigger: "system: payment allocation covers full balance_cents"
        actor: system
        preconditions: ["applied_cents == balance_cents"]
        side_effects: ["balance_cents -> 0; Account.total_balance_cents recomputed"]
      - from: PARTIAL
        to: PAID
        trigger: "system: payment allocation covers remaining balance_cents"
        actor: system
        preconditions: ["applied_cents == balance_cents"]
        side_effects: ["balance_cents -> 0; Account.total_balance_cents recomputed"]
      - from: PARTIAL
        to: OPEN
        trigger: "system: Payment POSTED->REVERSED un-applies its allocations"
        actor: system
        preconditions: []
        side_effects: ["balance_cents restored by un-applied amount; Account.total_balance_cents recomputed"]
      - from: PAID
        to: PARTIAL
        trigger: "system: Payment POSTED->REVERSED partially restores balance"
        actor: system
        preconditions: []
        side_effects: ["balance_cents restored by un-applied amount"]
      - from: PAID
        to: OPEN
        trigger: "system: Payment POSTED->REVERSED fully restores balance"
        actor: system
        preconditions: []
        side_effects: ["balance_cents restored to amount_cents"]
      - from: OPEN
        to: WAIVED
        trigger: "POST /collections/assessments/{assessmentId}/waive"
        actor: CollectionsAgent
        preconditions: []
        side_effects: ["balance_cents -> 0; Account.total_balance_cents recomputed (compensating action for a prior charge)"]
      - from: PARTIAL
        to: WAIVED
        trigger: "POST /collections/assessments/{assessmentId}/waive"
        actor: CollectionsAgent
        preconditions: []
        side_effects: ["balance_cents -> 0; Account.total_balance_cents recomputed"]

  - entity: Payment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /collections/payments/{paymentId}/reverse"
        actor: CollectionsAgent
        preconditions: ["payment currently POSTED (ERR_INVALID_STATE if already REVERSED)"]
        side_effects:
          - "each allocation un-applied: target Assessment balance_cents restored, status reverts PAID/PARTIAL -> PARTIAL/OPEN"
          - "Account.total_balance_cents recomputed; if it becomes > 0 and Account was CURRENT via this payment, Account -> DELINQUENT"
          - "Association.trust_balance_cents decreased by amount_cents (conserves trust cash: post + reverse nets to zero)"

  - entity: Notice
    initial_state: DRAFT
    terminal_states: [EXPIRED, VOID]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /collections/notices/{noticeId}/transition (to_status=SENT)"
        actor: CollectionsAgent
        preconditions:
          - "no prior SENT/DISPUTED Notice of same notice_type on the account whose window [sent_date, sent_date + NOTICE_COOLDOWN_DAYS) (NOTICE_COOLDOWN_DAYS = 30) contains now (ERR_NOTICE_COOLDOWN)"
        side_effects: ["sent_date = now"]
      - from: SENT
        to: DISPUTED
        trigger: "POST /collections/notices/{noticeId}/transition (to_status=DISPUTED)"
        actor: CollectionsAgent
        preconditions:
          - "now - sent_date < VALIDATION_PERIOD_DAYS (VALIDATION_PERIOD_DAYS = 30; dispute must fall inside the validation window; ERR_INVALID_STATE otherwise)"
        side_effects: ["dispute_date = now; account escalation to lien/foreclosure blocked while any Notice is DISPUTED (ERR_ACTIVE_DISPUTE)"]
      - from: DISPUTED
        to: SENT
        trigger: "POST /collections/notices/{noticeId}/transition (to_status=SENT)"
        actor: CollectionsAgent
        preconditions: []
        side_effects: ["verification mailed; sent_date reset to now (validation clock restarts); dispute_date cleared"]
        note: "cyclic edge SENT<->DISPUTED (Rule 3 non-linear shape on Notice)"
      - from: SENT
        to: EXPIRED
        trigger: "POST /collections/notices/{noticeId}/transition (to_status=EXPIRED)"
        actor: CollectionsAgent
        preconditions: ["now - sent_date >= VALIDATION_PERIOD_DAYS (VALIDATION_PERIOD_DAYS = 30)"]
        side_effects: []
      - from: DRAFT
        to: VOID
        trigger: "POST /collections/notices/{noticeId}/transition (to_status=VOID)"
        actor: CollectionsAgent
        preconditions: []
        side_effects: []
      - from: SENT
        to: VOID
        trigger: "POST /collections/notices/{noticeId}/transition (to_status=VOID)"
        actor: CollectionsAgent
        preconditions: []
        side_effects: []

  - entity: PaymentPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /collections/payment-plans/{planId}/transition (to_status=ACTIVE)"
        actor: CollectionsAgent
        preconditions: ["Account.status in {DELINQUENT,PAYMENT_PLAN} (ERR_INVALID_STATE)"]
        side_effects: ["Account DELINQUENT -> PAYMENT_PLAN"]
      - from: ACTIVE
        to: BREACHED
        trigger: "POST /collections/payment-plans/{planId}/transition (to_status=BREACHED)"
        actor: CollectionsAgent
        preconditions: ["missed_count >= PLAN_MISSED_BREACH_THRESHOLD (ERR_PLAN_NOT_BREACHABLE otherwise)"]
        side_effects: ["Account PAYMENT_PLAN -> DELINQUENT"]
      - from: BREACHED
        to: ACTIVE
        trigger: "POST /collections/payment-plans/{planId}/transition (to_status=ACTIVE)"
        actor: CollectionsAgent
        preconditions: ["missed_count < PLAN_MISSED_BREACH_THRESHOLD (caught up)"]
        side_effects: ["Account DELINQUENT -> PAYMENT_PLAN"]
        note: "cyclic edge ACTIVE<->BREACHED (Rule 3 non-linear shape on PaymentPlan)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /collections/payment-plans/{planId}/transition (to_status=COMPLETED)"
        actor: CollectionsAgent
        preconditions: ["amount_paid_cents >= total_amount_cents (ERR_INVALID_STATE otherwise)"]
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: BankruptcyCase created (FILED) on the account"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: BankruptcyCase FILED->DISMISSED"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /collections/payment-plans/{planId}/transition (to_status=CANCELLED)"
        actor: CollectionsAgent
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /collections/payment-plans/{planId}/transition (to_status=CANCELLED)"
        actor: CollectionsAgent
        preconditions: []
        side_effects: ["Account PAYMENT_PLAN -> DELINQUENT"]

  - entity: Lien
    initial_state: RECORDED
    terminal_states: [RELEASED]
    transitions:
      - from: RECORDED
        to: STAYED
        trigger: "system: BankruptcyCase created (FILED) — cascade L2"
        actor: system
        preconditions: []
        side_effects: []
      - from: FORECLOSING
        to: STAYED
        trigger: "system: BankruptcyCase created (FILED) — cascade L2"
        actor: system
        preconditions: []
        side_effects: []
      - from: STAYED
        to: RECORDED
        trigger: "system: BankruptcyCase FILED->DISMISSED"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECORDED
        to: FORECLOSING
        trigger: "system: ForeclosureReferral REFERRED->FILED"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECORDED
        to: RELEASED
        trigger: "POST /collections/liens/{lienId}/transition (to_status=RELEASED) OR system on full payment / discharge"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: FORECLOSING
        to: RELEASED
        trigger: "system: ForeclosureReferral FILED->SALE_COMPLETED or ->WITHDRAWN"
        actor: system
        preconditions: []
        side_effects: []
      - from: STAYED
        to: RELEASED
        trigger: "system: BankruptcyCase FILED->DISCHARGED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ForeclosureReferral
    initial_state: REFERRED
    terminal_states: [SALE_COMPLETED, WITHDRAWN]
    transitions:
      - from: REFERRED
        to: FILED
        trigger: "POST /collections/foreclosure-referrals/{referralId}/transition (to_status=FILED)"
        actor: ComplianceOfficer
        preconditions: ["referenced Lien.status == RECORDED (ERR_INVALID_STATE)", "Account.status != BANKRUPTCY (ERR_AUTOMATIC_STAY)"]
        side_effects: ["Account LIEN -> FORECLOSURE; referenced Lien RECORDED -> FORECLOSING"]
      - from: FILED
        to: SALE_COMPLETED
        trigger: "POST /collections/foreclosure-referrals/{referralId}/transition (to_status=SALE_COMPLETED)"
        actor: ComplianceOfficer
        preconditions: ["Account.status != BANKRUPTCY (ERR_AUTOMATIC_STAY)"]
        side_effects: ["Account FORECLOSURE -> CHARGED_OFF (which itself WAIVES open Assessments); referenced Lien FORECLOSING -> RELEASED"]
      - from: REFERRED
        to: STAYED
        trigger: "system: BankruptcyCase created (FILED) — cascade L3"
        actor: system
        preconditions: []
        side_effects: []
      - from: FILED
        to: STAYED
        trigger: "system: BankruptcyCase created (FILED) — cascade L3"
        actor: system
        preconditions: []
        side_effects: []
      - from: STAYED
        to: REFERRED
        trigger: "system: BankruptcyCase FILED->DISMISSED"
        actor: system
        preconditions: []
        side_effects: []
      - from: REFERRED
        to: WITHDRAWN
        trigger: "POST /collections/foreclosure-referrals/{referralId}/transition (to_status=WITHDRAWN)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["referenced Lien FORECLOSING -> RELEASED if applicable"]
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /collections/foreclosure-referrals/{referralId}/transition (to_status=WITHDRAWN)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Account FORECLOSURE -> DELINQUENT; referenced Lien FORECLOSING -> RECORDED"]

  - entity: BankruptcyCase
    initial_state: FILED
    terminal_states: [DISCHARGED, DISMISSED]
    transitions:
      - from: FILED
        to: DISCHARGED
        trigger: "POST /collections/bankruptcy-cases/{caseId}/transition (to_status=DISCHARGED)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Account BANKRUPTCY -> CHARGED_OFF (open Assessments WAIVED); STAYED/RECORDED Liens -> RELEASED"]
      - from: FILED
        to: DISMISSED
        trigger: "POST /collections/bankruptcy-cases/{caseId}/transition (to_status=DISMISSED)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Account BANKRUPTCY -> DELINQUENT; STAYED Liens -> RECORDED; STAYED ForeclosureReferrals -> REFERRED; SUSPENDED PaymentPlan -> ACTIVE"]

  - entity: Remittance
    initial_state: PENDING
    terminal_states: [REMITTED, VOID]
    transitions:
      - from: PENDING
        to: REMITTED
        trigger: "POST /collections/remittances/{remittanceId}/transition (to_status=REMITTED)"
        actor: TrustAccountant
        preconditions: ["Association.trust_balance_cents >= gross_amount_cents (ERR_INVALID_AMOUNT otherwise)"]
        side_effects: ["Association.trust_balance_cents decreased by gross_amount_cents"]
      - from: PENDING
        to: VOID
        trigger: "POST /collections/remittances/{remittanceId}/transition (to_status=VOID)"
        actor: TrustAccountant
        preconditions: []
        side_effects: []

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC — true CREATE-with-supersede races only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: plan-create-stale-account
    parent_entity: Account
    write_endpoint: "POST /collections/payment-plans"
    occ_field: "expected_account_version"
    description: |
      Creating a PaymentPlan against an Account whose version has advanced since
      the client last observed it is rejected. A new DRAFT plan legitimately
      supersedes prior planning, but a stale view means another writer already
      changed the account (posted a payment, recorded a lien, drafted a
      superseding plan) — the create is refused on the stale version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: remittance-create-stale-association
    parent_entity: Association
    write_endpoint: "POST /collections/remittances"
    occ_field: "expected_association_version"
    description: |
      Creating a Remittance against an Association whose version has advanced
      since the client last observed it is rejected. A remittance draft snapshots
      the trust balance for a period; a stale association version means another
      writer changed the trust position (a payment posted or a prior remittance
      remitted), so the create is refused on the stale version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: account_balance
    trigger: "any Assessment status/balance change, payment allocation, or reversal"
    algorithm: aggregation
    formula: |
      Account.total_balance_cents = sum(a.balance_cents
        for a in Assessments where a.account_id == account.id
        and a.status in {OPEN, PARTIAL})
    input_set: "Assessments of the account with status in {OPEN, PARTIAL}; PAID and WAIVED excluded"
    precision: "integer cents (exact)"

  - name: aging_buckets
    trigger: "read of Account.aging or GET aging-report; evaluated at logical-clock now"
    algorithm: chronological
    formula: |
      for each Assessment a with a.status in {OPEN, PARTIAL}:
        d = floor((now_date - a.due_date) in whole days)   # negative if not yet due
        if d <= 0:            bucket_current   += a.balance_cents
        elif 1 <= d <= 30:    bucket_1_30      += a.balance_cents
        elif 31 <= d <= 60:   bucket_31_60     += a.balance_cents
        elif 61 <= d <= 90:   bucket_61_90     += a.balance_cents
        else (d >= 91):       bucket_91_plus   += a.balance_cents
    input_set: "OPEN/PARTIAL assessments only; boundaries inclusive at 30/60/90"
    constants:
      DELINQUENCY_GRACE_DAYS: 30
    precision: "integer cents; day count is whole-day floor of (now - due_date)"

  - name: payment_allocation
    trigger: "POST /collections/payments (status POSTED)"
    algorithm: waterfall_allocation
    formula: |
      remaining = payment.amount_cents
      candidates = Assessments where account_id == payment.account_id
                   and status in {OPEN, PARTIAL}
      order candidates by charge_type priority:
        ATTORNEY_COST(0) < FINE(1) < LATE_FEE(2) < INTEREST(3) < SPECIAL(4) < REGULAR(5)
        then due_date ASC, then created_at ASC   # NEVER id
      for a in ordered candidates:
        if remaining <= 0: break
        applied = min(remaining, a.balance_cents)
        record allocation {assessment_id: a.id, applied_cents: applied}
        a.balance_cents -= applied
        a.status = PAID if a.balance_cents == 0 else PARTIAL
        remaining -= applied
      payment.unapplied_cents = remaining   # overpayment credit, may be 0
    input_set: "OPEN/PARTIAL assessments of the account; empty set -> whole amount becomes unapplied_cents"
    precision: "integer cents; allocation order fully pinned (charge_type, then due_date, then created_at)"

  - name: payoff_amount
    trigger: "GET /collections/accounts/{accountId}/payoff-quote"
    algorithm: forward_looking
    formula: |
      T = now                    if variant == PROVISIONAL
      T = now + PAYOFF_GOOD_THROUGH_DAYS days  if variant == BINDING
      accrued_interest_cents = 0
      for each Assessment a where a.status in {OPEN, PARTIAL}
              and a.charge_type in {REGULAR, SPECIAL}:          # principal only, no interest-on-interest
        days = max(0, floor((T - a.due_date) in whole days))
        raw = a.balance_cents * (assoc.interest_rate_annual_pct/100) * (days / INTEREST_DAY_COUNT)
        interest_a = round_half_up(raw)                          # round PER assessment
        interest_a = min(interest_a, a.balance_cents)            # per-assessment usury cap
        accrued_interest_cents += interest_a                     # then sum
      payoff_amount_cents = total_balance_cents + accrued_interest_cents
    input_set: "OPEN/PARTIAL principal assessments (REGULAR, SPECIAL); LATE_FEE/INTEREST/ATTORNEY_COST/FINE excluded from interest base but included in total_balance_cents"
    constants:
      PAYOFF_GOOD_THROUGH_DAYS: 15
      INTEREST_DAY_COUNT: 365
    precision: "2 decimals internally, round_half_up per assessment to whole cents, then integer sum"
    variants:
      - name: PROVISIONAL
        when: "variant=PROVISIONAL (default): interest accrued through today (now)"
        difference: "T = now"
      - name: BINDING
        when: "variant=BINDING: interest projected through the good-through date"
        difference: "T = now + PAYOFF_GOOD_THROUGH_DAYS; larger day count -> higher payoff"

  - name: remittance_amounts
    trigger: "POST /collections/remittances"
    algorithm: aggregation
    formula: |
      accounts = Accounts where association_id == association.id
      pool = Payments p where p.account_id in accounts
             and period_start <= p.received_date <= period_end   # inclusive-inclusive
      if basis == CASH:   included = { p in pool : p was POSTED at least once }  # includes later-reversed
      if basis == NET:    included = { p in pool : p.status == POSTED now }      # excludes currently REVERSED
      gross_amount_cents = sum(p.amount_cents for p in included)
      management_fee_cents = sum( round_half_up(p.amount_cents * assoc.management_fee_pct/100)
                                  for p in included )              # round PER payment then sum
      net_amount_cents = gross_amount_cents - management_fee_cents
    input_set: "Payments of the association's accounts with received_date in [period_start, period_end]; CASH vs NET differ on inclusion of currently-reversed payments"
    precision: "management fee: round_half_up per payment to whole cents, then integer sum"
    variants:
      - name: CASH
        when: "basis=CASH (default): estimate — every payment received in period counts, even if later reversed"
        difference: "included = payments ever POSTED in window"
      - name: NET
        when: "basis=NET: actual — only payments still POSTED count"
        difference: "included excludes currently-REVERSED payments -> lower gross when a period payment was reversed"

  - name: lien_recorded_amount
    trigger: "POST /collections/liens"
    algorithm: aggregation
    formula: |
      Lien.recorded_amount_cents = Account.total_balance_cents (snapshot at recording instant)
    input_set: "Account.total_balance_cents evaluated after all prior mutations"
    precision: "integer cents (exact snapshot)"

  - name: plan_breach_evaluation
    trigger: "POST /collections/payment-plans/{planId}/transition (to_status=BREACHED) and read of missed_count"
    algorithm: threshold
    formula: |
      installments_due = count of k in [1..num_installments] where
                         (first_due_date + (k-1)*30 days) <= now
      expected_paid_cents = min(installments_due, num_installments) * installment_cents
      missed_count = 0
      if amount_paid_cents < expected_paid_cents:
        # number of whole installments the payments fall short by
        missed_count = ceil((expected_paid_cents - amount_paid_cents) / installment_cents)
      breach allowed iff missed_count >= PLAN_MISSED_BREACH_THRESHOLD
    input_set: "installment schedule vs amount_paid_cents at logical-clock now"
    constants:
      PLAN_MISSED_BREACH_THRESHOLD: 2
    precision: "integer cents; installment spacing is 30 days; missed_count is a ceil of the shortfall in installments"

  - name: trust_balance
    trigger: "payment POSTED, payment REVERSED, remittance REMITTED"
    algorithm: aggregation
    formula: |
      Association.trust_balance_cents =
          sum(p.amount_cents for p in Payments where p.status == POSTED
              and p.account_id in accounts_of(association))
        - sum(r.gross_amount_cents for r in Remittances where r.status == REMITTED
              and r.association_id == association.id)
    input_set: "POSTED payments of the association's accounts, minus REMITTED remittance gross amounts"
    precision: "integer cents (exact); conserved: post+reverse of the same payment nets to zero change"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this operation; for AssociationManager (entity_backed:Association) the resource's association_id must equal X-User-ID"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_safety
    check: "Maker-checker SoD: ForeclosureReferral.referred_by_user_id (this X-User-ID) must differ from the referenced Lien.recorded_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /collections/foreclosure-referrals"
  - priority: 4
    category: existence
    check: "All path ids and FK body ids reference existing resources (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: business_constraint
    check: "Optimistic concurrency: expected_<parent>_version equals current parent version on OCC-guarded creates"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /collections/payment-plans, POST /collections/remittances"
  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition/action"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 7
    category: business_safety
    check: "Automatic bankruptcy stay: while Account.status == BANKRUPTCY (a FILED BankruptcyCase exists), no lien recording, foreclosure referral/advance, or notice send is permitted"
    error_id: ERR_AUTOMATIC_STAY
    http_status: 403
    applies_to: "POST /collections/liens, POST /collections/foreclosure-referrals, POST /collections/foreclosure-referrals/{id}/transition, POST /collections/notices/{id}/transition"
  - priority: 8
    category: business_safety
    check: "FDCPA dispute pause: while any Notice on the account is DISPUTED, lien recording and foreclosure referral are blocked"
    error_id: ERR_ACTIVE_DISPUTE
    http_status: 409
    applies_to: "POST /collections/liens, POST /collections/foreclosure-referrals"
  - priority: 9
    category: business_referential
    check: "Predecessor existence, checked BEFORE the temporal elapse: a Notice of type INTENT_TO_LIEN in status SENT must exist for lien recording (ERR_DEMAND_NOTICE_REQUIRED); a Lien in RECORDED must exist for foreclosure referral (ERR_LIEN_REQUIRED)"
    error_id: ERR_DEMAND_NOTICE_REQUIRED
    http_status: 409
    applies_to: "POST /collections/liens, POST /collections/foreclosure-referrals"
  - priority: 10
    category: business_temporal
    check: "FDCPA validation period: given a SENT INTENT_TO_LIEN Notice, (now - sent_date) >= VALIDATION_PERIOD_DAYS (VALIDATION_PERIOD_DAYS = 30) must hold before a lien may be recorded"
    error_id: ERR_VALIDATION_PERIOD_ACTIVE
    http_status: 409
    applies_to: "POST /collections/liens"
  - priority: 11
    category: business_constraint
    check: "Interval-overlap: a new PaymentPlan's [first_due_date, final_due_date] must not strictly overlap any non-terminal plan on the account; notice cooldown window collision"
    error_id: ERR_PLAN_OVERLAP
    http_status: 409
    applies_to: "POST /collections/payment-plans, POST /collections/notices/{id}/transition"
  - priority: 12
    category: business_constraint
    check: "Lien minimum: Account.total_balance_cents must be >= LIEN_MINIMUM_BALANCE_CENTS (LIEN_MINIMUM_BALANCE_CENTS = 180000) to record a lien"
    error_id: ERR_LIEN_MINIMUM_NOT_MET
    http_status: 422
    applies_to: "POST /collections/liens"
  - priority: 13
    category: business_fiscal
    check: "Monetary inputs (amount_cents) > 0; remittance period_end >= period_start; plan totals positive"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /collections/assessments, POST /collections/payments, POST /collections/payment-plans"
  - priority: 14
    category: business_temporal
    check: "Remittance period_end must be >= period_start"
    error_id: ERR_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /collections/remittances"
  - priority: 15
    category: business_constraint
    check: "Enum fields carry a declared member; unknown members rejected"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all endpoints with enum inputs"
  - priority: 16
    category: business_constraint
    check: "Required input fields present and well-typed"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving: logical clock ---
  - method: POST
    path: "/collections/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock. All aging/validation-period/cooldown/payoff computations read this clock."
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock now = to_iso8601"]

  # --- Association ---
  - method: POST
    path: "/collections/associations"
    description: "Onboard a community association"
    roles: [CollectionsAgent]
    code: 201
    input: [name, state_code, "interest_rate_annual_pct?", "late_fee_cents?", "management_fee_pct?"]
    output: Association
    side_effects: ["status=ACTIVE; trust_balance_cents=0; version=1"]
  - method: GET
    path: "/collections/associations/{associationId}"
    description: "Read an association (includes trust_balance_cents)"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: []
    output: Association
    side_effects: []
  - method: GET
    path: "/collections/associations/{associationId}/aging-report"
    description: "Delinquency/aging summary aggregated across the association's accounts at logical-clock now"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: []
    output: "{ association_id: string, total_delinquent_cents: integer, bucket_current_cents: integer, bucket_1_30_cents: integer, bucket_31_60_cents: integer, bucket_61_90_cents: integer, bucket_91_plus_cents: integer, account_count: integer }"
    side_effects: []

  # --- Account ---
  - method: POST
    path: "/collections/accounts"
    description: "Create a delinquent-collections account"
    roles: [CollectionsAgent]
    code: 201
    input: [association_id, unit_number, owner_name]
    output: Account
    side_effects: ["status=CURRENT; total_balance_cents=0"]
  - method: GET
    path: "/collections/accounts/{accountId}"
    description: "Read an account (includes total_balance_cents and aging)"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: GET
    path: "/collections/accounts"
    description: "List accounts, optionally filtered by association_id (reverse-reachability for Account.association_id)"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: ["association_id?", "status?", "limit?", "offset?"]
    output: Account[]
    side_effects: []
  - method: POST
    path: "/collections/accounts/{accountId}/transition"
    description: "Manual account transition (to_status in {DELINQUENT, CLOSED}; CHARGED_OFF->CLOSED for ComplianceOfficer). Other statuses are system/cascade-driven and rejected here."
    roles: [CollectionsAgent, ComplianceOfficer]
    code: 200
    input: [to_status]
    output: Account
    side_effects: ["state transition per Account state machine"]

  # --- Assessment ---
  - method: POST
    path: "/collections/assessments"
    description: "Post a charge (assessment) to an account"
    roles: [CollectionsAgent]
    code: 201
    input: [account_id, charge_type, amount_cents, due_date]
    output: Assessment
    side_effects: ["status=OPEN; balance_cents=amount_cents; Account.total_balance_cents recomputed"]
  - method: GET
    path: "/collections/assessments/{assessmentId}"
    description: "Read an assessment"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: []
    output: Assessment
    side_effects: []
  - method: GET
    path: "/collections/assessments"
    description: "List assessments filtered by account_id (reverse-reachability for Assessment.account_id)"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []
  - method: POST
    path: "/collections/assessments/{assessmentId}/waive"
    description: "Waive an OPEN/PARTIAL assessment (compensating action for a prior charge)"
    roles: [CollectionsAgent]
    code: 200
    input: []
    output: Assessment
    side_effects: ["status=WAIVED; balance_cents=0; Account.total_balance_cents recomputed"]

  # --- Payment ---
  - method: POST
    path: "/collections/payments"
    description: "Record a payment; runs the waterfall allocation and credits trust"
    roles: [CollectionsAgent]
    code: 201
    input: [account_id, amount_cents, received_date]
    output: Payment
    side_effects:
      - "status=POSTED; allocations + unapplied_cents computed via payment_allocation"
      - "Assessments advance OPEN->PARTIAL/PAID; Account.total_balance_cents recomputed; Account may -> CURRENT if balance 0"
      - "Association.trust_balance_cents increased by amount_cents"
  - method: GET
    path: "/collections/payments/{paymentId}"
    description: "Read a payment (includes allocations)"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/collections/payments"
    description: "List payments filtered by account_id (reverse-reachability for Payment.account_id)"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/collections/payments/{paymentId}/reverse"
    description: "Reverse a POSTED payment (NSF/adjustment); un-applies allocations and debits trust"
    roles: [CollectionsAgent]
    code: 200
    input: [reversal_reason]
    output: Payment
    side_effects:
      - "status=REVERSED; allocations un-applied; target Assessments restored PAID/PARTIAL->PARTIAL/OPEN"
      - "Account.total_balance_cents recomputed; Account CURRENT->DELINQUENT if balance becomes > 0"
      - "Association.trust_balance_cents decreased by amount_cents"

  # --- Notice ---
  - method: POST
    path: "/collections/notices"
    description: "Draft an FDCPA notice/demand for an account"
    roles: [CollectionsAgent]
    code: 201
    input: [account_id, notice_type]
    output: Notice
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/collections/notices/{noticeId}"
    description: "Read a notice"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: []
    output: Notice
    side_effects: []
  - method: GET
    path: "/collections/notices"
    description: "List notices filtered by account_id (reverse-reachability for Notice.account_id)"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: ["account_id?", "notice_type?", "status?", "limit?", "offset?"]
    output: Notice[]
    side_effects: []
  - method: POST
    path: "/collections/notices/{noticeId}/transition"
    description: "Transition a notice (SEND/DISPUTE/re-SEND/EXPIRE/VOID) per Notice state machine"
    roles: [CollectionsAgent]
    code: 200
    input: [to_status]
    output: Notice
    side_effects: ["state transition per Notice state machine; sent_date/dispute_date stamped from logical clock"]

  # --- PaymentPlan ---
  - method: POST
    path: "/collections/payment-plans"
    description: "Create a payment-plan agreement (OCC-guarded on Account.version). Overlap-checked against non-terminal plans."
    roles: [CollectionsAgent]
    code: 201
    input: [account_id, total_amount_cents, installment_cents, num_installments, first_due_date, expected_account_version]
    output: PaymentPlan
    side_effects: ["status=DRAFT; final_due_date computed; increments Account.version by 1"]
  - method: GET
    path: "/collections/payment-plans/{planId}"
    description: "Read a payment plan (includes missed_count, amount_paid_cents)"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: []
  - method: GET
    path: "/collections/payment-plans"
    description: "List payment plans filtered by account_id (reverse-reachability for PaymentPlan.account_id)"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: PaymentPlan[]
    side_effects: []
  - method: POST
    path: "/collections/payment-plans/{planId}/transition"
    description: "Transition a payment plan (ACTIVATE/BREACH/reinstate/COMPLETE/CANCEL) per PaymentPlan state machine"
    roles: [CollectionsAgent]
    code: 200
    input: [to_status]
    output: PaymentPlan
    side_effects: ["state transition per PaymentPlan state machine; cascades Account status"]

  # --- Lien ---
  - method: POST
    path: "/collections/liens"
    description: "Record a lien on an account (ComplianceOfficer). Enforces stay, dispute, validation-period, predecessor-notice, and minimum-balance gates."
    roles: [ComplianceOfficer]
    code: 201
    input: [account_id]
    output: Lien
    side_effects: ["status=RECORDED; recorded_amount_cents snapshots total_balance_cents; recorded_by_user_id=X-User-ID; Account DELINQUENT->LIEN"]
  - method: GET
    path: "/collections/liens/{lienId}"
    description: "Read a lien"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: []
    output: Lien
    side_effects: []
  - method: GET
    path: "/collections/liens"
    description: "List liens filtered by account_id (reverse-reachability for Lien.account_id)"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: Lien[]
    side_effects: []
  - method: POST
    path: "/collections/liens/{lienId}/transition"
    description: "Manually release a RECORDED lien (ComplianceOfficer)"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_status]
    output: Lien
    side_effects: ["state transition per Lien state machine"]

  # --- ForeclosureReferral ---
  - method: POST
    path: "/collections/foreclosure-referrals"
    description: "Refer an account to foreclosure counsel (ComplianceOfficer). SoD: referrer must differ from the lien recorder."
    roles: [ComplianceOfficer]
    code: 201
    input: [account_id, lien_id, attorney_name]
    output: ForeclosureReferral
    side_effects: ["status=REFERRED; referred_by_user_id=X-User-ID"]
  - method: GET
    path: "/collections/foreclosure-referrals/{referralId}"
    description: "Read a foreclosure referral"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: []
    output: ForeclosureReferral
    side_effects: []
  - method: GET
    path: "/collections/foreclosure-referrals"
    description: "List foreclosure referrals filtered by account_id and/or lien_id (reverse-reachability for both FKs)"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: ["account_id?", "lien_id?", "status?", "limit?", "offset?"]
    output: ForeclosureReferral[]
    side_effects: []
  - method: POST
    path: "/collections/foreclosure-referrals/{referralId}/transition"
    description: "Advance a referral (FILE/SALE_COMPLETED/WITHDRAW) per ForeclosureReferral state machine"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_status]
    output: ForeclosureReferral
    side_effects: ["state transition per ForeclosureReferral state machine; cascades Account and Lien"]

  # --- BankruptcyCase ---
  - method: POST
    path: "/collections/bankruptcy-cases"
    description: "Record a bankruptcy filing (ComplianceOfficer). Imposes the automatic stay cascade."
    roles: [ComplianceOfficer]
    code: 201
    input: [account_id, chapter, case_number, filed_date]
    output: BankruptcyCase
    side_effects: ["status=FILED; Account->BANKRUPTCY; cascade L2 Liens->STAYED, L3 ForeclosureReferrals->STAYED; ACTIVE PaymentPlan->SUSPENDED"]
  - method: GET
    path: "/collections/bankruptcy-cases/{caseId}"
    description: "Read a bankruptcy case"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: []
    output: BankruptcyCase
    side_effects: []
  - method: GET
    path: "/collections/bankruptcy-cases"
    description: "List bankruptcy cases filtered by account_id (reverse-reachability for BankruptcyCase.account_id)"
    roles: [CollectionsAgent, ComplianceOfficer, TrustAccountant, AssociationManager]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: BankruptcyCase[]
    side_effects: []
  - method: POST
    path: "/collections/bankruptcy-cases/{caseId}/transition"
    description: "Discharge or dismiss a bankruptcy case per BankruptcyCase state machine"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_status]
    output: BankruptcyCase
    side_effects: ["state transition per BankruptcyCase state machine; lifts or finalizes the stay cascade"]

  # --- Remittance ---
  - method: POST
    path: "/collections/remittances"
    description: "Draft a trust remittance to an association (OCC-guarded on Association.version). Computes gross/fee/net per basis."
    roles: [TrustAccountant]
    code: 201
    input: [association_id, period_start, period_end, "basis?", expected_association_version]
    output: Remittance
    side_effects: ["status=PENDING; gross/fee/net computed via remittance_amounts; increments Association.version by 1"]
  - method: GET
    path: "/collections/remittances/{remittanceId}"
    description: "Read a remittance"
    roles: [TrustAccountant, ComplianceOfficer, AssociationManager]
    code: 200
    input: []
    output: Remittance
    side_effects: []
  - method: GET
    path: "/collections/remittances"
    description: "List remittances filtered by association_id (reverse-reachability for Remittance.association_id)"
    roles: [TrustAccountant, ComplianceOfficer, AssociationManager]
    code: 200
    input: ["association_id?", "status?", "limit?", "offset?"]
    output: Remittance[]
    side_effects: []
  - method: POST
    path: "/collections/remittances/{remittanceId}/transition"
    description: "Remit (execute) or void a PENDING remittance per Remittance state machine"
    roles: [TrustAccountant]
    code: 200
    input: [to_status]
    output: Remittance
    side_effects: ["REMITTED decreases Association.trust_balance_cents by gross_amount_cents"]

  # --- Payoff (computed read; dual-variant) ---
  - method: GET
    path: "/collections/accounts/{accountId}/payoff-quote"
    description: "Compute a payoff statement for an account. variant=PROVISIONAL (default, interest through now) or BINDING (interest through now+PAYOFF_GOOD_THROUGH_DAYS)."
    roles: [CollectionsAgent, ComplianceOfficer, AssociationManager]
    code: 200
    input: ["variant?"]
    output: "{ account_id: string, variant: string, quote_date: datetime, good_through_date: datetime, total_balance_cents: integer, accrued_interest_cents: integer, payoff_amount_cents: integer }"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or AssociationManager acting outside its own association_id scope" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Foreclosure referral attempted by the same X-User-ID that recorded the lien (maker-checker SoD)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or FK body id) does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the current parent version on an OCC-guarded create" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is not in a valid state for the requested transition/action (includes reversing an already-REVERSED payment)" }
  - { id: ERR_AUTOMATIC_STAY, http: 403, condition: "Collection action blocked by an active bankruptcy automatic stay (Account in BANKRUPTCY)" }
  - { id: ERR_ACTIVE_DISPUTE, http: 409, condition: "Lien recording or foreclosure referral blocked because a Notice on the account is DISPUTED" }
  - { id: ERR_VALIDATION_PERIOD_ACTIVE, http: 409, condition: "FDCPA validation period (VALIDATION_PERIOD_DAYS = 30) has not elapsed since the INTENT_TO_LIEN notice was sent" }
  - { id: ERR_NOTICE_COOLDOWN, http: 409, condition: "A same-type notice is still inside its half-open cooldown window [sent_date, sent_date + NOTICE_COOLDOWN_DAYS) (NOTICE_COOLDOWN_DAYS = 30)" }
  - { id: ERR_DEMAND_NOTICE_REQUIRED, http: 409, condition: "Required predecessor notice/lien missing (no SENT INTENT_TO_LIEN notice for lien; no RECORDED lien for referral)" }
  - { id: ERR_LIEN_REQUIRED, http: 409, condition: "Foreclosure referral requires a RECORDED lien on the account" }
  - { id: ERR_LIEN_MINIMUM_NOT_MET, http: 422, condition: "Account.total_balance_cents is below LIEN_MINIMUM_BALANCE_CENTS (LIEN_MINIMUM_BALANCE_CENTS = 180000) at recording" }
  - { id: ERR_PLAN_OVERLAP, http: 409, condition: "New payment plan's [first_due_date, final_due_date] strictly overlaps a non-terminal plan on the account" }
  - { id: ERR_PLAN_NOT_BREACHABLE, http: 409, condition: "Plan breach attempted while missed_count < PLAN_MISSED_BREACH_THRESHOLD" }
  - { id: ERR_NOT_DELINQUENT, http: 409, condition: "Mark-delinquent attempted with no overdue OPEN/PARTIAL assessment" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "Monetary input <= 0, or remittance gross exceeds available trust balance" }
  - { id: ERR_PERIOD_INVALID, http: 422, condition: "Remittance period_end is earlier than period_start" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum input carries a value outside the declared member set" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing or mistyped required input field" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CollectionsAgent
    description: "Day-to-day collections operator: onboards associations/accounts, posts assessments, records payments and reversals, drafts/sends FDCPA notices, and manages payment plans."
    identity: opaque
    exclusive_operations:
      - "POST /collections/associations"
      - "POST /collections/accounts"
      - "POST /collections/accounts/{id}/transition (DELINQUENT, and CLOSED from CURRENT)"
      - "POST /collections/assessments"
      - "POST /collections/assessments/{id}/waive"
      - "POST /collections/payments"
      - "POST /collections/payments/{id}/reverse"
      - "POST /collections/notices"
      - "POST /collections/notices/{id}/transition"
      - "POST /collections/payment-plans"
      - "POST /collections/payment-plans/{id}/transition"
    shared_operations:
      - "GET reads across accounts/assessments/payments/notices/plans/liens/referrals/bankruptcy"
      - "POST /collections/_clock/set_current_utc"
      - "GET /collections/accounts/{id}/payoff-quote"
      - "GET /collections/associations/{id}/aging-report"
  - name: ComplianceOfficer
    description: "Legal-escalation authority: records liens, refers/advances foreclosures, handles bankruptcy, and charges off/closes accounts. Maker-checker SoD prevents the same officer who recorded a lien from referring its foreclosure."
    identity: opaque
    exclusive_operations:
      - "POST /collections/liens"
      - "POST /collections/liens/{id}/transition"
      - "POST /collections/foreclosure-referrals"
      - "POST /collections/foreclosure-referrals/{id}/transition"
      - "POST /collections/bankruptcy-cases"
      - "POST /collections/bankruptcy-cases/{id}/transition"
      - "POST /collections/accounts/{id}/transition (CHARGED_OFF -> CLOSED)"
    shared_operations:
      - "GET reads across all resources"
      - "POST /collections/_clock/set_current_utc"
      - "GET /collections/accounts/{id}/payoff-quote"
      - "GET /collections/associations/{id}/aging-report"
  - name: TrustAccountant
    description: "Trust-accounting authority: drafts and executes remittances of collected funds to associations, net of the management fee."
    identity: opaque
    exclusive_operations:
      - "POST /collections/remittances"
      - "POST /collections/remittances/{id}/transition"
    shared_operations:
      - "GET reads across accounts/payments/remittances/associations"
      - "POST /collections/_clock/set_current_utc"
      - "GET /collections/associations/{id}/aging-report"
  - name: AssociationManager
    description: "The association's own manager (client). Read-only, scoped to resources whose association_id equals X-User-ID."
    identity: "entity_backed:Association"
    exclusive_operations: []
    shared_operations:
      - "GET /collections/associations/{id} (own only)"
      - "GET /collections/associations/{id}/aging-report (own only)"
      - "GET /collections/accounts (own association_id) and reads of its child resources"
      - "GET /collections/accounts/{id}/payoff-quote (own only)"
      - "GET /collections/remittances (own association_id)"
