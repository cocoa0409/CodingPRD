          trigger:
            - call: "POST /fiscal-note-requests/${n1_id}/cost-estimates"
              payload: { expected_fiscal_note_request_version: "${nv1}", fiscal_year: 2027, scenario: "BASELINE", personnel_cost_cents: 5000000, operating_cost_cents: 1000000, one_time_cost_cents: 0, fte_count: 1.0, revenue_impact_cents: 0, assumption_note: "Year one, filed against a fresh view." }
              as: AgencyAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /fiscal-note-requests/${n1_id}/cost-estimates"
              payload: { expected_fiscal_note_request_version: "${nv1}", fiscal_year: 2028, scenario: "BASELINE", personnel_cost_cents: 3000000, operating_cost_cents: 1000000, one_time_cost_cents: 0, fte_count: 1.0, revenue_impact_cents: 0, assumption_note: "Year two, filed against the SAME stale view." }
              as: AgencyAnalyst
              as_user_id: "${a1_id}"
            - call: "GET /fiscal-note-requests/${n1_id}"
              payload: {}
              as: AgencyAnalyst
              as_user_id: "${a1_id}"
              captures: { nv2: $.data.version }
            - call: "POST /fiscal-note-requests/${n1_id}/cost-estimates"
