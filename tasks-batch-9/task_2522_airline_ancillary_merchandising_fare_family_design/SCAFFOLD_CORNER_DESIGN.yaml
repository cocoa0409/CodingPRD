          - entities.Flight.fields.active_waiver_count
          - entities.Flight.fields.ticketed_booking_count
        distinguishing_aspect: "A freshly created Flight reports both declared initial states at once - sales_phase PRESALE and irops_state NORMAL - with booked_load_factor_pct 0, demand_tier LOW and both counters at 0."
