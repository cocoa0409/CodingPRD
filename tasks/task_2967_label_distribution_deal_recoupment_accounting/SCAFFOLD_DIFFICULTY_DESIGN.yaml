              as_user_id: "${dist_id}"
          assert:
            - "AT the ceiling: the first ship returns 200 and PhysicalRun.${run_pass_id}.status == SHIPPED, units_shipped == 1000, manufacturing_cost_cents == 262500, effective_reserve_pct == 0.1000 (the distributor default), reserve_initial_cents == 90000, physical_net_receipts_cents == 637500"
            - "ONE UNIT OVER: the second ship returns 422 with error.code == ERR_INVENTORY_OBLIGATION_BREACH because ceil(1001 * 0.0500) == 51 > 1050 - 1001 == 49"
