          - errors[ERR_MAPPING_WINDOW_CONFLICT]
        distinguishing_aspect: "mapping_window_conflict is CLOSED on both ends with a 14-day cooldown appended after the incumbent's end, so a candidate starting exactly at 2026-06-14T23:59:59.999Z conflicts while one starting 1ms later is accepted - the opposite convention to the half-open exclusivity window."
        test_recipe:
          setup:
            - "One RESELLER partner and one account at clock 2026-03-01T00:00:00.000Z."
            - "Incumbent PROPOSED mapping over [2026-05-01T00:00:00.000Z, 2026-05-31T23:59:59.999Z] with exclusivity_scope FULL, created with the account's observed version."
            - "Its blocked band is [2026-05-01T00:00:00.000Z, 2026-06-14T23:59:59.999Z] (effective_until + 14 x 24h)."
            - "A rejected create does not bump Account.version, so the same captured version is reused for the second attempt."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
