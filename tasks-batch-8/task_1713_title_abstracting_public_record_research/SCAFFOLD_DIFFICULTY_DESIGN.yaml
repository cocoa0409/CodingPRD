  # =====================================================================
  # Rule 9 — compensating_invariant
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_post_then_reverse_conserves_accrued_fees
        grounds:
          - calculations.order_fee_actualization
          - state_machines.CountyRetrieval.REQUESTED_to_FEE_POSTED
          - state_machines.CountyRetrieval.FEE_POSTED_to_FEE_REVERSED
          - entities.AbstractOrder.fields.accrued_fees_cents
        distinguishing_aspect: |
          Conserved quantity is MONEY: accrued_fees_cents == 40000 + SUM(fee_cents of
          retrievals IN {FEE_POSTED, INVOICED}) + rush premium on that subtotal. The
          forward post (50000 -> 53125) paired with its compensating reverse restores
          exactly 50000 — no drift.
        test_recipe:
          setup:
            - "RUSH order (initial accrued 50000), one assignment, one document, one PER_DOCUMENT retrieval in REQUESTED"
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_781", property_address: "1500 Barton Springs", county: "Travis", state_code: "TX", legal_description_text: "LOT 19 BLK R", search_period_years: 30, effective_date: "2026-01-15", sla_tier: "RUSH" }
              as: Client
              as_user_id: client_781
              captures: { ord: $.data.id, acc0: $.data.accrued_fees_cents }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_781", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A Smith", grantee_name: "B Jones", instrument_number: "INST-781-A", recording_date: "2010-01-01" }
              as: Abstracter
              as_user_id: abs_781
              captures: { doc: $.data.id }
            - call: "POST /api/county-retrievals"
              payload: { order_id: "${ord}", record_document_id: "${doc}", county: "Travis", fee_mode: "PER_DOCUMENT" }
              as: Abstracter
              as_user_id: abs_781
              captures: { ret: $.data.id }
          trigger:
            - call: "POST /api/county-retrievals/${ret}/post-fee"
              payload: {}
              as: OperationsManager
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { acc_posted: $.data.accrued_fees_cents, cap_posted: $.data.liability_cap_cents }
            - call: "POST /api/county-retrievals/${ret}/reverse-fee"
              payload: { reason: "county rejected the pull" }
              as: OperationsManager
              captures: { rst: $.data.status }
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { acc_rev: $.data.accrued_fees_cents, cap_rev: $.data.liability_cap_cents }
          assert:
            - "captured acc0 == 50000"
            - "captured acc_posted == 53125 (40000+2500=42500; premium round_half_up(42500*0.25)=10625)"
            - "captured rst == FEE_REVERSED"
            - "captured acc_rev == 50000 and acc_rev == acc0 (post + reverse conserves the fee total exactly)"
            - "captured cap_posted == 159375 (min(3*53125, 200000)) and cap_rev == 150000 (cap tracks the conserved quantity)"

      - name: document_create_then_void_conserves_assignment_document_count
        grounds:
          - state_machines.RecordDocument.REPORTED_to_VOID
          - entities.SearchAssignment.fields.document_count
        distinguishing_aspect: |
          Conserved quantity is a CARDINAL COUNT (documents), not money:
          document_count == count(RecordDocument rows with assignment_id and
          status != VOID). Create (0 -> 1) paired with its compensating void
          (1 -> 0) restores the exact prior count.
        test_recipe:
          setup:
            - "Order with one IN_PROGRESS assignment (document_count 0)"
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_782", property_address: "1600 Enfield Rd", county: "Travis", state_code: "TX", legal_description_text: "LOT 20 BLK S", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_782
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_782", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id, cnt0: $.data.document_count }
          trigger:
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "EASEMENT", grantor_name: "B Jones", grantee_name: "City of Austin", instrument_number: "INST-782-A", recording_date: "2005-06-30", exception_applies: true }
              as: Abstracter
              as_user_id: abs_782
              captures: { doc: $.data.id }
            - call: "GET /api/search-assignments/${asg}"
              as: OperationsManager
              captures: { cnt1: $.data.document_count }
            - call: "POST /api/record-documents/${doc}/void"
              payload: { reason: "duplicate entry, wrong instrument" }
              as: Abstracter
              as_user_id: abs_782
              captures: { dst: $.data.status }
            - call: "GET /api/search-assignments/${asg}"
              as: OperationsManager
              captures: { cnt2: $.data.document_count }
          assert:
            - "captured cnt0 == 0"
            - "captured cnt1 == 1 (create moved the count)"
            - "captured dst == VOID"
            - "captured cnt2 == 0 and cnt2 == cnt0 (create + void conserves the document count exactly)"
