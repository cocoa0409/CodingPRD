            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${p}", lessor_name: "L", start_date: "2026-01-01", end_date: "2027-12-31", aum_allotment: 500, rate_per_aum_cents: 2500, minimum_commit_aum: 100, overage_tier1_cap_aum: 50, overage_tier1_rate_cents: 3000, overage_tier2_rate_cents: 3750, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { lease: $.data.id } }
