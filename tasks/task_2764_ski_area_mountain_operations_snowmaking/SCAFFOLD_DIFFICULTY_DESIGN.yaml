          setup:
            - "Open-mountain bootstrap with lift L1 at hourly_capacity_pph 20, so raw_ccc is floor(20 * 0.6) = 12, crowding_density 12 / 18.0 = 0.667 is below the 25.0 threshold, guest_capacity is 12 and non_season_pool is floor(12 * 0.7) = 8."
