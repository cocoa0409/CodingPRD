            - call: "GET /installments"
              payload: { parcel_id: "${per3}", installment_year: 1 }
              as: Auditor
              captures: { ier3: "$.data[0].id" }
          trigger:
            - call: "POST /installments/${ier3}/payments"
              payload: { amount_cents: 500000, payment_date: "2027-07-01T00:00:00Z", paid_by: "O" }
