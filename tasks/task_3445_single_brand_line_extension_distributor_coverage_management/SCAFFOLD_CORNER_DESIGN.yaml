        distinguishing_aspect: "Half-open windows: at exactly the shared boundary instant the NEWER list governs (L1 ends exclusive, L2 begins inclusive); a channel with no covering list yields 404 ERR_NO_EFFECTIVE_PRICE."
        test_recipe:
          setup:
            - "Brand with PILOT core line; pack TOOLED; L1 499 over [2026-08-01, 2026-12-01) and L2 520 over [2026-12-01, 2027-04-01)."
          setup_api_calls:
