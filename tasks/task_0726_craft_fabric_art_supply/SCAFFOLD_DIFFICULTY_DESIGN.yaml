      - name: submit_empty_order_zero_lines_boundary
        grounds:
          - validations[priority=12]
          - errors[ERR_EMPTY_ORDER]
          - state_machines.Order.BUILDING_to_SUBMITTED
        distinguishing_aspect: "Empty-collection edge (distinct metric): submitting an order with zero OrderLines is rejected with ERR_EMPTY_ORDER via POST /orders/{id}/submit."
        test_recipe:
