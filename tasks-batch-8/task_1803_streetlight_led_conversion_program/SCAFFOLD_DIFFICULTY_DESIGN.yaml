    test_recipe:
      setup:
      - ACTIVE program, RESIDENTIAL district; one UTILITY_OWNED pole 250W attested
      - UTILITY_OWNED schedule {T1 900, T2 1300, T3 1800, T4 2400, T5 3000} EFFECTIVE from 2026-01-01; account AC-U (current_period 2026-08); generate-lines created one ESTIMATED line (1800)
      - Account then FROZEN
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: LED-X2
          program_budget_cents: 10000000
          fy_rebate_cap_cents: 100000
          rebate_cents_per_kwh: 50
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: D1
          zone: RESIDENTIAL
        as: ProgramManager
        captures:
          dist: $.data.id
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: W-01
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
        captures:
          pole: $.data.id
      - call: POST /streetlights/poles/${pole}/attest-nameplate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/rate-schedules
        payload:
          program_id: ${pgm}
          ownership_class: UTILITY_OWNED
          effective_from: '2026-01-01'
          tier_rates:
            T1: 900
            T2: 1300
            T3: 1800
            T4: 2400
            T5: 3000
        as: BillingAnalyst
        captures:
          rs: $.data.id
      - call: POST /streetlights/rate-schedules/${rs}/file
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/rate-schedules/${rs}/activate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/tariff-accounts
        payload:
          district_id: ${dist}
          account_number: AC-U
          ownership_class: UTILITY_OWNED
        as: BillingAnalyst
        captures:
          acct: $.data.id
      - call: POST /streetlights/tariff-accounts/${acct}/generate-lines
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/tariff-accounts/${acct}/freeze
        payload: {}
        as: BillingAnalyst
      trigger:
      - call: POST /streetlights/tariff-accounts/${acct}/close-period
        payload: {}
        as: BillingAnalyst
        captures:
          err: $.data.error_id
      - call: POST /streetlights/tariff-accounts/${acct}/unfreeze
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/tariff-accounts/${acct}/close-period
        payload: {}
        as: BillingAnalyst
      assert:
      - '${err} == ERR_ACCOUNT_NOT_OPEN   # BillingLine lifecycle gated by TariffAccount posture'
      - 'While frozen: BillingLine remains ESTIMATED AND TariffAccount.${acct}.current_period == 2026-08'
      - 'After unfreeze + close: TariffAccount.${acct}.current_period == 2026-09 AND ytd_billed_cents == 1800'
      - 'BillingLine status == BILLED AND charge_cents == 1800 (utility whole-month: no conversion, full T3 rate)'
- rule_id: resource_temporal_overlap
  instances:
  - name: rate_schedule_half_open_window_adjacency
    grounds:
    - validations[priority=13]
    - state_machines.TariffRateSchedule
    distinguishing_aspect: 'Interval semantics: HALF-OPEN [effective_from, effective_until). Schedule A covers

      [2026-01-01, 2026-07-01); schedule B starting exactly 2026-07-01 is ADJACENT and files

      cleanly; schedule C starting 2026-06-15 overlaps A''s interior and is rejected with

      ERR_RATE_WINDOW_OVERLAP. Resource: the (program, ownership_class) rate series.

      '
    test_recipe:
      setup:
      - ACTIVE program; MUNICIPAL schedule A [2026-01-01, 2026-07-01) FILED
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: LED-T1
          program_budget_cents: 10000000
          fy_rebate_cap_cents: 100000
          rebate_cents_per_kwh: 50
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/rate-schedules
        payload:
          program_id: ${pgm}
          ownership_class: MUNICIPAL
          effective_from: '2026-01-01'
          effective_until: '2026-07-01'
          tier_rates:
            T1: 700
            T2: 1100
            T3: 1500
            T4: 2000
            T5: 2600
        as: BillingAnalyst
        captures:
          rs_a: $.data.id
      - call: POST /streetlights/rate-schedules/${rs_a}/file
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/rate-schedules
        payload:
          program_id: ${pgm}
          ownership_class: MUNICIPAL
          effective_from: '2026-07-01'
          tier_rates:
            T1: 720
            T2: 1120
            T3: 1520
            T4: 2020
            T5: 2620
        as: BillingAnalyst
        captures:
          rs_b: $.data.id
      - call: POST /streetlights/rate-schedules/${rs_b}/file
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/rate-schedules
        payload:
          program_id: ${pgm}
          ownership_class: MUNICIPAL
          effective_from: '2026-06-15'
          tier_rates:
            T1: 710
            T2: 1110
            T3: 1510
            T4: 2010
            T5: 2610
        as: BillingAnalyst
        captures:
          rs_c: $.data.id
      trigger:
      - call: POST /streetlights/rate-schedules/${rs_c}/file
        payload: {}
        as: BillingAnalyst
        captures:
          err: $.data.error_id
      assert:
      - 'TariffRateSchedule.${rs_b}.status == FILED   # adjacency until==from is NOT an overlap under half-open semantics'
      - '${err} == ERR_RATE_WINDOW_OVERLAP           # 2026-06-15 < 2026-07-01 intersects A''s interior'
      - 'TariffRateSchedule.${rs_c}.status == DRAFT   # rejected file leaves the schedule in place, unfiled'
  - name: crew_route_closed_interval_shared_day_conflict
    grounds:
    - validations[priority=12]
    - entities.ConversionRoute.fields.window_start_date
    distinguishing_aspect: 'Interval semantics: CLOSED intervals (both endpoints INCLUSIVE) on a DIFFERENT resource

      (crew assignment days vs rate-class windows). Route A [08-03, 08-05] and route B

      [08-06, 08-08] are disjoint and both create cleanly, but route C [08-05, 08-07] shares

      the single calendar day 08-05 with A and is rejected with ERR_ROUTE_WINDOW_OVERLAP —

      adjacency on the same day IS a conflict here, the opposite of the half-open rate rule.

      '
    test_recipe:
      setup:
      - ACTIVE program, ARTERIAL district, crew; route A for the crew [2026-08-03, 2026-08-05] PLANNED
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: LED-T2
          program_budget_cents: 10000000
          fy_rebate_cap_cents: 100000
          rebate_cents_per_kwh: 50
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: DA
          zone: ARTERIAL
        as: ProgramManager
        captures:
          dist: $.data.id
      - call: POST /streetlights/crews
        payload:
          program_id: ${pgm}
          crew_name: Crew-1
          base_stops_per_shift: 6
          hourly_rate_cents: 6000
        as: ProgramManager
        captures:
          crew: $.data.id
      - call: POST /streetlights/conversion-routes
        payload:
          district_id: ${dist}
          crew_id: ${crew}
          window_start_date: '2026-08-03'
          window_end_date: '2026-08-05'
          traffic_control_required: false
        as: ProgramManager
        captures:
          route_a: $.data.id
      - call: POST /streetlights/conversion-routes
        payload:
          district_id: ${dist}
          crew_id: ${crew}
          window_start_date: '2026-08-06'
          window_end_date: '2026-08-08'
          traffic_control_required: false
        as: ProgramManager
        captures:
          route_b: $.data.id
      trigger:
      - call: POST /streetlights/conversion-routes
        payload:
          district_id: ${dist}
          crew_id: ${crew}
          window_start_date: '2026-08-05'
          window_end_date: '2026-08-07'
          traffic_control_required: false
        as: ProgramManager
        captures:
          err: $.data.error_id
      assert:
      - 'ConversionRoute.${route_a}.status == PLANNED AND ConversionRoute.${route_b}.status == PLANNED   # back-to-back days 05|06 do NOT conflict'
      - '${err} == ERR_ROUTE_WINDOW_OVERLAP   # 08-05 is inside BOTH closed windows'
      - No third route exists for the crew (creation rejected atomically)
- rule_id: compensating_invariant
  instances:
  - name: budget_invariant_dispatch_cancel_exact_refund
    grounds:
    - calculations.budget_balance_ledger
    - state_machines.WorkOrder.DISPATCHED_to_CANCELLED
    distinguishing_aspect: 'Conserved quantity: program budget dollars. Forward action dispatch (from PENDING)

      debits the straight-time estimate 12000 cents (COMPLEX stop at 6000c/hr); the

      compensating cancel from DISPATCHED refunds the SAME estimate — the invariant

      budget_balance_cents == 80000 holds EXACTLY, with zero drift, and the route''s pole

      and stop unwind with it (stop SKIPPED, pole AUDIT_CLEARED).

      '
    test_recipe:
      setup:
      - Program budget 80000 cents, ACTIVE; ARTERIAL district; crew (6000c/hr); one UTILITY_OWNED pole 250W attested
      - Route 2026-08-03..2026-08-03 with one COMPLEX stop (120 min), RELEASED
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: LED-I1
          program_budget_cents: 80000
          fy_rebate_cap_cents: 100000
          rebate_cents_per_kwh: 50
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: DA
          zone: ARTERIAL
        as: ProgramManager
        captures:
          dist: $.data.id
      - call: POST /streetlights/crews
        payload:
          program_id: ${pgm}
          crew_name: Crew-1
          base_stops_per_shift: 6
          hourly_rate_cents: 6000
        as: ProgramManager
        captures:
          crew: $.data.id
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: B-01
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
        captures:
          pole: $.data.id
      - call: POST /streetlights/poles/${pole}/attest-nameplate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/conversion-routes
        payload:
          district_id: ${dist}
          crew_id: ${crew}
          window_start_date: '2026-08-03'
          window_end_date: '2026-08-03'
          traffic_control_required: false
        as: ProgramManager
        captures:
          route: $.data.id
      - call: POST /streetlights/conversion-routes/${route}/stops
        payload:
          pole_id: ${pole}
          sequence_number: 1
          difficulty_class: COMPLEX
        as: ProgramManager
        captures:
          stop: $.data.id
      - call: POST /streetlights/conversion-routes/${route}/release
        payload: {}
        as: ProgramManager
      - call: GET /streetlights/work-orders
        payload:
          route_id: ${route}
        as: ProgramManager
        captures:
          wo: $.data.0.id
      trigger:
      - call: POST /streetlights/work-orders/${wo}/dispatch
        payload:
          new_fixture_wattage: 90
          new_cct_kelvin: 3000
          shielding: SEMI_CUTOFF
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: GET /streetlights/programs/${pgm}
        payload: {}
        as: ProgramManager
        captures:
          bal_mid: $.data.budget_balance_cents
      - call: POST /streetlights/work-orders/${wo}/cancel
        payload: {}
        as: ProgramManager
      assert:
      - '${bal_mid} == 68000   # 80000 - estimate 12000 (120 min * 6000c/60min)'
      - 'ConversionProgram.${pgm}.budget_balance_cents == 80000   # EXACT restoration — compensating pair conserves dollars'
      - WorkOrder.${wo}.execution_status == CANCELLED AND RouteStop.${stop}.status == SKIPPED AND Pole.${pole}.status == AUDIT_CLEARED
  - name: fixture_count_invariant_batch_reject_returns_pool
    grounds:
    - entities.SalvageItem.fields.batch_id
    - entities.ConversionProgram.fields.pending_salvage_item_count
    - state_machines.SalvageBatch.MANIFESTED_to_REJECTED
    distinguishing_aspect: 'Conserved quantity: removed-fixture COUNT (not dollars). Two conversions create two

      unbatched salvage items; batching moves them (unbatched 2 -> 0, batched 0 -> 2); the

      compensating REJECT returns them (batched 2 -> 0, unbatched 0 -> 2) — at every step

      unbatched + batched == 2 == the number of completed work orders, and the rejected

      batch''s settlement is erased rather than posted.

      '
    test_recipe:
      setup:
      - ACTIVE program, RESIDENTIAL district, crew; two UTILITY_OWNED poles 250W attested, converted on route 2026-08-02 (two completions -> two unbatched SalvageItems)
      - Batch BATCH-R created; both items added (weights 20.0 and 30.0); sealed (not contaminated); manifested
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: LED-I2
          program_budget_cents: 10000000
          fy_rebate_cap_cents: 100000
          rebate_cents_per_kwh: 50
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: D1
          zone: RESIDENTIAL
        as: ProgramManager
        captures:
          dist: $.data.id
      - call: POST /streetlights/crews
        payload:
          program_id: ${pgm}
          crew_name: Crew-1
          base_stops_per_shift: 6
          hourly_rate_cents: 6000
        as: ProgramManager
        captures:
          crew: $.data.id
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: F-01
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
        captures:
          p1: $.data.id
      - call: POST /streetlights/poles/${p1}/attest-nameplate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: F-02
          ownership_type: UTILITY_OWNED
          fixture_class: POST_TOP
          nameplate_wattage: 250
        as: ProgramManager
        captures:
          p2: $.data.id
      - call: POST /streetlights/poles/${p2}/attest-nameplate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/conversion-routes
        payload:
          district_id: ${dist}
          crew_id: ${crew}
          window_start_date: '2026-08-02'
          window_end_date: '2026-08-02'
          traffic_control_required: false
        as: ProgramManager
        captures:
          route: $.data.id
      - call: POST /streetlights/conversion-routes/${route}/stops
        payload:
          pole_id: ${p1}
          sequence_number: 1
          difficulty_class: STANDARD
        as: ProgramManager
      - call: POST /streetlights/conversion-routes/${route}/stops
        payload:
          pole_id: ${p2}
          sequence_number: 2
          difficulty_class: STANDARD
        as: ProgramManager
      - call: POST /streetlights/conversion-routes/${route}/release
        payload: {}
        as: ProgramManager
      - call: GET /streetlights/work-orders
        payload:
          route_id: ${route}
        as: ProgramManager
        captures:
          wo1: $.data.0.id
          wo2: $.data.1.id
      - call: POST /streetlights/work-orders/${wo1}/dispatch
        payload:
          new_fixture_wattage: 90
          new_cct_kelvin: 2700
          shielding: FULL_CUTOFF
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: POST /streetlights/work-orders/${wo1}/complete
        payload: {}
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: POST /streetlights/work-orders/${wo2}/dispatch
        payload:
          new_fixture_wattage: 90
          new_cct_kelvin: 2700
          shielding: FULL_CUTOFF
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: POST /streetlights/work-orders/${wo2}/complete
        payload: {}
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: GET /streetlights/programs/${pgm}
        payload: {}
        as: ProgramManager
        captures:
          pending_after_complete: $.data.pending_salvage_item_count
      - call: GET /streetlights/salvage-items
        payload:
          pole_id: ${p1}
        as: ProgramManager
        captures:
          it1: $.data.0.id
      - call: GET /streetlights/salvage-items
        payload:
          pole_id: ${p2}
        as: ProgramManager
        captures:
          it2: $.data.0.id
      - call: POST /streetlights/salvage-batches
        payload:
          program_id: ${pgm}
          batch_label: BATCH-R
        as: ProgramManager
        captures:
          batch: $.data.id
      - call: POST /streetlights/salvage-batches/${batch}/items
        payload:
          salvage_item_id: ${it1}
          weight_lbs: 20.0
          mercury_flag: false
        as: ProgramManager
      - call: POST /streetlights/salvage-batches/${batch}/items
        payload:
          salvage_item_id: ${it2}
          weight_lbs: 30.0
          mercury_flag: false
        as: ProgramManager
      - call: POST /streetlights/salvage-batches/${batch}/seal
        payload:
          contaminated_flag: false
        as: ComplianceOfficer
      - call: POST /streetlights/salvage-batches/${batch}/manifest
        payload: {}
        as: ComplianceOfficer
      trigger:
      - call: POST /streetlights/salvage-batches/${batch}/reject
        payload: {}
        as: ComplianceOfficer
      assert:
      - '${pending_after_complete} == 2   # forward action: each completion added one unbatched fixture'
      - 'ConversionProgram.${pgm}.pending_salvage_item_count == 2   # compensating reject restored the unbatched pool exactly'
      - 'SalvageItem.${it1}.batch_id == null AND SalvageItem.${it2}.batch_id == null   # batched+unbatched == 2 conserved at every step'
      - SalvageBatch.${batch}.status == REJECTED AND settlement_value_cents == null AND item_count == 0
      - 'ConversionProgram.${pgm}.budget_balance_cents == 9991000   # 10000000 - 2 x 4500; the rejected batch posted NO settlement credit'
