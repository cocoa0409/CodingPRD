            - { call: "POST /infusion/patients", payload: { member_id: "M1142", full_name: "DS P", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_ds: $.data.id } }
