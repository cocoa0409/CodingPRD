endpoints:
  # ---- system clock (test-driving, declared per §1.5 ladder rung 3) ----
  - method: POST
    path: "/fire-compliance/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the logical clock reads this default and never falls back to wall-clock."
    roles: [FireMarshal]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Runs daily-sweep logic for the new date: license expiry, permit expiry, plan lapse, late-fee accrual, impairment OUT_OF_SERVICE promotion"]

  # ---- Contractor ----
  - method: POST
    path: "/fire-compliance/contractors"
    description: "Register a contractor"
