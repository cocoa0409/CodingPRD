# =============================================================================
# SCAFFOLD: OSHA Recordkeeping & Workplace Safety Management (employer safety office)
# Task 1808
# =============================================================================

scenario: |
  1808. OSHA Recordkeeping & Workplace Safety Management (employer safety office):
  injury intake & recordability determination, 300/300A/301 log generation & posting
  window, restricted/lost-day counting & case updates, incident investigation & root
  cause, corrective-action tracking & verification, rate calculation (TRIR/DART) by
  establishment, inspection/citation & abatement, severe-injury reporting clock

domain_name: osha-recordkeeping
api_prefix: /safety

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Establishment is the aggregate root for cases/summaries/hour-logs/inspections;
  # Employee and CorrectiveAction form flat cross-cutting references.

  state_machine_shape: hybrid_compound
  # IncidentCase uses a CYCLIC classification loop (RECORDABLE -> RECLASSIFIED ->
  # RECORDABLE ... -> FINALIZED) plus parallel privacy dimension;
  # Citation uses BRANCHING fork (CONTESTED vs UNCONTESTED) joining into
  # ABATEMENT_PENDING -> ABATED;
  # Establishment posture is posture_driven (derived from open overdue items).
  # (Emitted as a single shape label; per-entity machines carry the real shape.)

  relationship_patterns:
    - one_to_many        # Establishment -> IncidentCase, AnnualSummary, HourLog, Inspection
    - cross_aggregate    # IncidentCase.employee_id -> Employee (flat peer)
    - cross_aggregate    # CorrectiveAction.case_id -> IncidentCase; CorrectiveAction.citation_id -> Citation

  role_model: segregation_of_duties
  # The SafetyOfficer who owns a case's investigation may NOT verify that case's
  # CorrectiveActions; the RecordkeepingCoordinator who prepares an AnnualSummary
  # may NOT certify it. Enforced by comparing X-User-ID against stored fields.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Company
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: fein, type: string, source: input, description: "Federal Employer Identification Number; unique across companies", constraints: "unique" }

  - name: Establishment
    parent: Company
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id; owning employer" }
      - { name: site_name, type: string, source: input, description: "Establishment (single physical location) name" }
      - { name: naics_code, type: string, source: input, description: "6-digit NAICS industry code", constraints: "exactly 6 digits" }
      - { name: state_code, type: string, source: input, description: "2-letter US state code" }
      - { name: size_class, type: enum, source: input, description: "SMALL (1-19 employees) | STANDARD (20-249) | LARGE (250+); drives electronic-submission duty" }
      - { name: is_partially_exempt, type: boolean, source: input, default: false, description: "Low-hazard industry exemption; exempt establishments do not maintain logs but still must report severe injuries" }
      - { name: posture, type: enum, source: computed, default: CLEAR, description: "CLEAR | WATCH | ELEVATED — derived from overdue CorrectiveActions + affirmed Citations + risk_score" }
      - { name: risk_score, type: number, source: computed, default: 0, description: "Weighted risk index (see calculation establishment_risk_score)" }
      - { name: current_year_hours, type: integer, source: computed, default: 0, description: "Sum of approved HourLog.hours_worked for the calendar year of the logical clock" }

  - name: Employee
    parent: Company
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: full_name, type: string, source: input, description: "Employee legal name" }
      - { name: job_title, type: string, source: input, description: "Job title used on the 300 log" }
      - { name: hire_date, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: employment_status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | SEPARATED" }

  - name: IncidentCase
    parent: Establishment
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; the establishment whose 300 log carries this case" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; injured worker (must belong to the same Company as the establishment)" }
      - { name: case_number, type: string, source: system, description: "Server-minted, per-establishment sequential 'CASE-<establishment_seq>-<yyyy>-<nnn>'; assigned at intake" }
      - { name: occurred_at, type: datetime, source: input, description: "UTC instant of injury/illness onset" }
      - { name: reported_at, type: datetime, source: system, description: "UTC instant of intake (server logical clock)" }
      - { name: description, type: string, source: input, description: "What happened" }
      - { name: body_part, type: string, source: input, description: "Affected body part" }
      - { name: event_type, type: enum, source: input, description: "INJURY | SKIN_DISORDER | RESPIRATORY | POISONING | HEARING_LOSS | OTHER_ILLNESS" }
      - { name: is_privacy_case, type: boolean, source: input, default: false, description: "Privacy-concern case: employee name withheld from 300 log ('PRIVACY CASE' substituted)" }
      - { name: is_severe_event, type: enum, source: input, default: NONE, description: "NONE | FATALITY | INPATIENT_HOSPITALIZATION | AMPUTATION | EYE_LOSS" }
      - { name: status, type: enum, source: system, description: "INTAKE | PENDING_REVIEW | RECORDABLE | NOT_RECORDABLE | RECLASSIFIED | FINALIZED", default: INTAKE }
      - { name: classification, type: enum, source: system, default: NONE, description: "NONE | FIRST_AID_ONLY | MEDICAL_TREATMENT | JOB_TRANSFER_RESTRICTION | DAYS_AWAY | DEATH; recordability class" }
      - { name: is_recordable, type: boolean, source: computed, default: false, description: "true when classification in {MEDICAL_TREATMENT, JOB_TRANSFER_RESTRICTION, DAYS_AWAY, DEATH}" }
      - { name: is_dart, type: boolean, source: computed, default: false, description: "true when classification in {JOB_TRANSFER_RESTRICTION, DAYS_AWAY, DEATH}" }
      - { name: days_away_count, type: integer, source: computed, default: 0, description: "Calendar days away from work — RECORDED variant (full entry spans, combined-capped; see day_count_rollup). Stored; this is what summary_rollup consumes." }
      - { name: restricted_days_count, type: integer, source: computed, default: 0, description: "Calendar days of restriction/transfer — RECORDED variant (stored). summary_rollup consumes these stored values, never the projected variant." }
      - { name: projected_days_away_count, type: integer, source: computed, default: 0, description: "PROJECTED_FINAL variant of days-away: ACTIVE entries truncated at logical clock date, then combined-capped. Read-time only; never stored, never consumed by summary_rollup." }
      - { name: projected_restricted_days_count, type: integer, source: computed, default: 0, description: "PROJECTED_FINAL variant of restricted days (read-time only)" }
      - { name: day_count_closed, type: boolean, source: computed, default: false, description: "true once day entries stop accruing (worker returned full duty, separated, or 180-day cap hit)" }
      - { name: recordability_deadline, type: datetime, source: computed, description: "occurred_at + 7 calendar days (inclusive); determination must exist by then" }
      - { name: log_year, type: integer, source: computed, description: "Calendar year of occurred_at; which 300 log carries the case" }
      - { name: revision_index, type: integer, source: system, default: 0, description: "Increments on every RECORDABLE -> RECLASSIFIED -> RECORDABLE cycle" }

  - name: CaseDayCountEntry
    parent: IncidentCase
    common_fields: false
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> IncidentCase.id" }
      - { name: day_type, type: enum, source: input, description: "DAYS_AWAY | RESTRICTED" }
      - { name: start_date, type: string, source: input, description: "ISO date; interval start (inclusive)" }
      - { name: end_date, type: string, source: input, description: "ISO date; interval end (inclusive)" }
      - { name: calendar_days, type: integer, source: computed, description: "end_date - start_date + 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED", default: ACTIVE }

  - name: IncidentInvestigation
    parent: IncidentCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> IncidentCase.id; exactly one investigation per case" , constraints: "unique per case_id" }
      - { name: lead_supervisor_id, type: string, source: input, description: "Opaque operator id of the InvestigatingSupervisor who leads the investigation (also used for segregation-of-duties checks)" }
      - { name: opened_at, type: datetime, source: system, description: "Server logical clock at opening" }
      - { name: root_cause, type: enum, source: input, description: "Set at closure: HUMAN_FACTOR | EQUIPMENT | PROCESS | ENVIRONMENT | TRAINING | INDETERMINATE" }
      - { name: contributing_factors, type: string, source: input, description: "Free text; required non-empty at closure" }
      - { name: status, type: enum, source: system, description: "OPEN | ROOT_CAUSE_SUBMITTED | CLOSED", default: OPEN }
      - { name: closed_at, type: datetime, source: system, description: "Set on CLOSED" }

  - name: CorrectiveAction
    parent: Establishment
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id" }
      - { name: case_id, type: string, source: input, description: "FK -> IncidentCase.id; optional link — nullable when the action arises from a Citation instead", constraints: "nullable" }
      - { name: citation_id, type: string, source: input, description: "FK -> Citation.id; nullable; exactly one of case_id / citation_id must be non-null", constraints: "nullable" }
      - { name: description, type: string, source: input, description: "Hazard abatement action" }
      - { name: assigned_to, type: string, source: input, description: "Opaque operator id responsible for completion" }
      - { name: due_date, type: string, source: input, description: "ISO date; must be strictly after creation date" }
      - { name: priority, type: enum, source: input, description: "LOW | MEDIUM | HIGH | IMMINENT_DANGER" }
      - { name: status, type: enum, source: system, description: "OPEN | COMPLETED | VERIFIED | OVERDUE | REOPENED | CANCELLED", default: OPEN }
      - { name: completed_at, type: datetime, source: system, description: "Set on COMPLETED" }
      - { name: verified_by, type: string, source: system, description: "Operator id who verified; MUST differ from the linked case's investigation lead and from completed_by" }
      - { name: completed_by, type: string, source: system, description: "Operator id who completed" }

  - name: AnnualSummary
    parent: Establishment
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id" }
      - { name: year, type: integer, source: input, description: "Calendar year summarized (300A)", constraints: "unique per establishment" }
      - { name: status, type: enum, source: system, description: "DRAFT | PREPARED | CERTIFIED | POSTED | AMENDED", default: DRAFT }
      - { name: total_recordable_cases, type: integer, source: computed, default: 0, description: "Count of recordable cases with log_year == year" }
      - { name: total_dart_cases, type: integer, source: computed, default: 0, description: "Count of DART cases" }
      - { name: total_days_away, type: integer, source: computed, default: 0, description: "Sum of per-case capped days_away_count" }
      - { name: total_restricted_days, type: integer, source: computed, default: 0, description: "Sum of per-case capped restricted_days_count" }
      - { name: annual_avg_employment, type: integer, source: computed, default: 0, description: "Round-half-up of mean of 12 monthly employment figures" }
      - { name: total_hours_worked, type: integer, source: computed, default: 0, description: "Sum of approved HourLog.hours_worked for the year" }
      - { name: trir, type: number, source: computed, description: "Total Recordable Incident Rate for the year; null until certified" }
      - { name: dart_rate, type: number, source: computed, description: "DART rate for the year; null until certified" }
      - { name: prepared_by, type: string, source: system, description: "Operator id of preparer" }
      - { name: certified_by, type: string, source: system, description: "Operator id of certifying company executive; MUST differ from prepared_by" }
      - { name: certified_at, type: datetime, source: system, description: "Set at certification" }
      - { name: posting_window_open, type: datetime, source: computed, description: "Feb 1 00:00:00Z of year+1" }
      - { name: posting_window_close, type: datetime, source: computed, description: "Apr 30 23:59:59Z of year+1" }
      - { name: posted_at, type: datetime, source: system, description: "Set when posted; must fall inside [posting_window_open, posting_window_close]" }

  - name: EstablishmentHourLog
    parent: Establishment
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id" }
      - { name: year, type: integer, source: input, description: "Calendar year" }
      - { name: month, type: integer, source: input, description: "1..12", constraints: "1..12" }
      - { name: hours_worked, type: integer, source: input, description: "Employee hours in month; >= 0" }
      - { name: employment_count, type: integer, source: input, description: "Average employment in month; >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | LOCKED", default: DRAFT, constraints: "unique (establishment_id, year, month)" }
      - { name: approved_by, type: string, source: system, description: "Operator id approving the log" }

  - name: SevereInjuryReport
    parent: IncidentCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> IncidentCase.id; one report per case", constraints: "unique per case_id" }
      - { name: report_kind, type: enum, source: input, description: "FATALITY | INPATIENT_HOSPITALIZATION | AMPUTATION | EYE_LOSS" }
      - { name: occurred_at, type: datetime, source: input, description: "Must equal case.occurred_at" }
      - { name: reported_to_agency_at, type: datetime, source: input, description: "When the employer notified the agency" }
      - { name: deadline, type: datetime, source: computed, description: "occurred_at + 8h for FATALITY; occurred_at + 24h otherwise" }
      - { name: within_clock, type: boolean, source: computed, description: "reported_to_agency_at <= deadline" }
      - { name: status, type: enum, source: system, description: "TIMELY | LATE", default: TIMELY }

  - name: Inspection
    parent: Establishment
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id" }
      - { name: opened_on, type: string, source: input, description: "ISO date the inspection opened" }
      - { name: inspection_type, type: enum, source: input, description: "PROGRAMMED | COMPLAINT | REFERRAL | FATALITY_CATASTROPHE | FOLLOW_UP" }
      - { name: scope, type: enum, source: input, description: "COMPREHENSIVE | PARTIAL | RECORDS_ONLY" }
      - { name: status, type: enum, source: system, description: "OPEN | CITATIONS_ISSUED | CLOSED_NO_CITATION", default: OPEN }
      - { name: closed_on, type: string, source: system, description: "ISO date closed" }

  - name: Citation
    parent: Inspection
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id" }
      - { name: standard_cited, type: string, source: input, description: "e.g. '29 CFR 1910.134'" }
      - { name: violation_type, type: enum, source: input, description: "OTHER_THAN_SERIOUS | SERIOUS | WILLFUL | REPEAT | FAILURE_TO_ABATE" }
      - { name: proposed_penalty_usd, type: number, source: input, description: "Proposed penalty; >= 0" }
      - { name: abatement_due_date, type: string, source: input, description: "ISO date by which hazard must be abated" }
      - { name: status, type: enum, source: system, description: "ISSUED | CONTESTED | FINAL_ORDER | ABATEMENT_PENDING | ABATED | VACATED | OVERDUE", default: ISSUED }
      - { name: contested_at, type: datetime, source: system, description: "Set on contest; must be <= issued + 15 working days" }
      - { name: contest_deadline, type: datetime, source: computed, description: "created_at + 15 working days (Mon-Fri), 23:59:59Z" }
      - { name: final_penalty_usd, type: number, source: system, description: "Set at FINAL_ORDER; defaults to proposed unless modified on contest resolution" }
      - { name: abated_at, type: datetime, source: system, description: "Set when abatement verified" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: IncidentCase
    initial_state: INTAKE
    terminal_states: [NOT_RECORDABLE, FINALIZED]
    transitions:
      - from: INTAKE
        to: PENDING_REVIEW
        trigger: "system (automatic at intake once required intake fields validated)"
        actor: system
        preconditions: []
        side_effects:
          - "case_number assigned; reported_at stamped from logical clock"
          - "recordability_deadline = occurred_at + 7 days computed"
      - from: PENDING_REVIEW
        to: RECORDABLE
        trigger: "POST /safety/cases/{caseId}/classify with classification in {MEDICAL_TREATMENT, JOB_TRANSFER_RESTRICTION, DAYS_AWAY, DEATH}"
        actor: SafetyOfficer
        preconditions:
          - "establishment.is_partially_exempt == false (ERR_ESTABLISHMENT_EXEMPT)"
          - "logical clock <= case.recordability_deadline OR classification == DEATH (ERR_RECORDABILITY_WINDOW_PASSED)"
          - "case.is_privacy_case does not block classification"
        side_effects:
          - "is_recordable = true; is_dart per classification"
          - "recompute AnnualSummary (DRAFT/PREPARED for log_year) totals; mark matching summary STALE via amendment_required flag on Establishment posture recompute"
      - from: PENDING_REVIEW
        to: NOT_RECORDABLE
        trigger: "POST /safety/cases/{caseId}/classify with classification == FIRST_AID_ONLY"
        actor: SafetyOfficer
        preconditions:
          - "logical clock <= case.recordability_deadline (ERR_RECORDABILITY_WINDOW_PASSED)"
        side_effects:
          - "is_recordable = false; is_dart = false"
      - from: RECORDABLE
        to: RECLASSIFIED
        trigger: "POST /safety/cases/{caseId}/reclassify"
        actor: SafetyOfficer
        preconditions:
          - "at least one non-VOIDED CaseDayCountEntry exists OR a later discovered fact is supplied (payload must include new_classification)"
          - "summary for log_year (if any) not in POSTED status unless amendment flow (ERR_SUMMARY_LOCKED)"
        side_effects:
          - "revision_index += 1"
          - "existing ACTIVE day entries remain; new entries may be attached while RECLASSIFIED"
      - from: RECLASSIFIED
        to: RECORDABLE
        trigger: "POST /safety/cases/{caseId}/classify"
        actor: SafetyOfficer
        preconditions:
          - "new classification differs from current (ERR_INVALID_STATE)"
        side_effects:
          - "is_recordable / is_dart recomputed; day-count rollup recomputed with 180-day combined cap"
      - from: RECORDABLE
        to: FINALIZED
        trigger: "POST /safety/cases/{caseId}/finalize"
        actor: SafetyOfficer
        preconditions:
          - "linked IncidentInvestigation.status == CLOSED (ERR_INVESTIGATION_OPEN)"
          - "day_count_closed == true (ERR_DAY_COUNT_OPEN)"
          - "all linked CorrectiveActions in {VERIFIED, CANCELLED} (ERR_CORRECTIVE_ACTION_OPEN)"
        side_effects:
          - "case locked; no further day entries or reclassification"
      - from: RECLASSIFIED
        to: NOT_RECORDABLE
        trigger: "POST /safety/cases/{caseId}/classify with classification == FIRST_AID_ONLY"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "is_recordable = false; all ACTIVE day entries auto-VOIDED; days counts zeroed"
      - from: RECORDABLE
        to: NOT_RECORDABLE
        trigger: "POST /safety/cases/{caseId}/classify with classification == FIRST_AID_ONLY (line-of-duty correction)"
        actor: SafetyOfficer
        preconditions:
          - "revision_index == 0 (a previously reclassified case must round-trip via RECLASSIFIED)"
        side_effects:
          - "is_recordable = false; all ACTIVE day entries auto-VOIDED; day counts zeroed"

  - entity: IncidentInvestigation
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ROOT_CAUSE_SUBMITTED
        trigger: "POST /safety/investigations/{id}/submit-root-cause"
        actor: InvestigatingSupervisor
        preconditions:
          - "root_cause and contributing_factors non-empty"
          - "acting supervisor id == investigation.lead_supervisor_id (ERR_NOT_INVESTIGATION_LEAD)"
        side_effects: []
      - from: ROOT_CAUSE_SUBMITTED
        to: OPEN
        trigger: "POST /safety/investigations/{id}/reopen"
        actor: InvestigatingSupervisor
        preconditions:
          - "acting supervisor id == investigation.lead_supervisor_id"
        side_effects: ["root_cause retained; contributing_factors cleared is forbidden — retained"]
      - from: ROOT_CAUSE_SUBMITTED
        to: CLOSED
        trigger: "POST /safety/investigations/{id}/close"
        actor: SafetyOfficer
        preconditions:
          - "root_cause != INDETERMINATE OR case.classification == DEATH (a non-death case may not close on INDETERMINATE)"
        side_effects:
          - "closed_at stamped"
          - "unblocks IncidentCase.finalize"

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /safety/corrective-actions/{id}/complete"
        actor: SafetyOfficer
        preconditions:
          - "payload completed_by == assigned_to (ERR_NOT_ASSIGNEE)"
        side_effects: ["completed_at stamped; completed_by recorded"]
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /safety/corrective-actions/{id}/verify"
        actor: SafetyOfficer
        preconditions:
          - "acting operator id != linked case's IncidentInvestigation.lead_supervisor_id (segregation of duties; ERR_DUTY_SEGREGATION)"
          - "acting operator id != corrective_action.completed_by (ERR_DUTY_SEGREGATION)"
        side_effects:
          - "verified_by stamped"
          - "Establishment.posture recompute (removes one overdue/open item)"
      - from: COMPLETED
        to: REOPENED
        trigger: "POST /safety/corrective-actions/{id}/reject-verification"
        actor: SafetyOfficer
        preconditions:
          - "acting operator id != completed_by"
        side_effects: ["completed_at cleared; completed_by cleared"]
      - from: REOPENED
        to: COMPLETED
        trigger: "POST /safety/corrective-actions/{id}/complete"
        actor: SafetyOfficer
        preconditions: ["payload completed_by == assigned_to"]
        side_effects: ["completed_at re-stamped"]
      - from: OPEN
        to: OVERDUE
        trigger: "system (automatic on POST /safety/_clock/set_current_utc sweep when due_date < logical clock date)"
        actor: system
        preconditions: []
        side_effects: ["Establishment.posture recompute; risk_score += OVERDUE_CA_WEIGHT"]
      - from: REOPENED
        to: OVERDUE
        trigger: "system (clock sweep)"
        actor: system
        preconditions: []
        side_effects: ["Establishment.posture recompute"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /safety/corrective-actions/{id}/cancel"
        actor: SafetyOfficer
        preconditions: []
        side_effects: ["Establishment.posture recompute"]

  - entity: AnnualSummary
    initial_state: DRAFT
    terminal_states: [POSTED]
    transitions:
      - from: DRAFT
        to: PREPARED
        trigger: "POST /safety/summaries/{id}/prepare"
        actor: RecordkeepingCoordinator
        preconditions:
          - "every IncidentCase for establishment with log_year == year has status != PENDING_REVIEW and != INTAKE (ERR_CASES_UNRESOLVED)"
          - "all 12 EstablishmentHourLog rows for (establishment, year) exist and status in {APPROVED, LOCKED} (ERR_HOURS_INCOMPLETE)"
        side_effects:
          - "totals recomputed (see summary_rollup); prepared_by stamped; trir/dart computed as PROVISIONAL variant and stored"
      - from: PREPARED
        to: CERTIFIED
        trigger: "POST /safety/summaries/{id}/certify"
        actor: SafetyOfficer
        preconditions:
          - "acting operator id != prepared_by (segregation of duties; ERR_DUTY_SEGREGATION)"
          - "no IncidentCase for (establishment, log_year) mutated since prepare (version-pinning: summary.prepared_version_pin vs establishment case aggregate version; ERR_SUMMARY_STALE)"
        side_effects:
          - "certified_by, certified_at stamped"
          - "trir/dart frozen as CERTIFIED variant (snapshot; later case changes do NOT alter certified summary)"
      - from: CERTIFIED
        to: POSTED
        trigger: "POST /safety/summaries/{id}/post"
        actor: RecordkeepingCoordinator
        preconditions:
          - "logical clock within [posting_window_open, posting_window_close] inclusive (ERR_POSTING_WINDOW)"
        side_effects: ["posted_at stamped"]
      - from: CERTIFIED
        to: AMENDED
        trigger: "POST /safety/summaries/{id}/amend"
        actor: RecordkeepingCoordinator
        preconditions:
          - "logical clock AFTER posting_window_close OR a newly reclassified case changed totals"
        side_effects:
          - "status AMENDED; totals recomputed; must re-run certify then post inside window or keep as AMENDED record"
      - from: PREPARED
        to: DRAFT
        trigger: "system (automatic when any linked case for the year mutates: classify/reclassify/day-entry change)"
        actor: system
        preconditions: []
        side_effects: ["prepared_by cleared; provisional rates discarded"]

  - entity: EstablishmentHourLog
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /safety/hour-logs/{id}/approve"
        actor: RecordkeepingCoordinator
        preconditions:
          - "hours_worked >= 0 and employment_count >= 0"
        side_effects: ["approved_by stamped; Establishment.current_year_hours recompute if year == clock year"]
      - from: APPROVED
        to: DRAFT
        trigger: "POST /safety/hour-logs/{id}/reopen"
        actor: RecordkeepingCoordinator
        preconditions:
          - "no AnnualSummary for (establishment, year) in {PREPARED, CERTIFIED, POSTED} (ERR_SUMMARY_LOCKED)"
        side_effects: ["Establishment.current_year_hours recompute"]
      - from: APPROVED
        to: LOCKED
        trigger: "system (automatic when AnnualSummary for (establishment, year) reaches CERTIFIED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SevereInjuryReport
    initial_state: TIMELY
    terminal_states: [TIMELY, LATE]
    transitions: []
    note: "status is assigned atomically at creation by the severe_injury_clock calculation (TIMELY when within_clock else LATE); both values are terminal — the report is an immutable record. A LATE creation fires Establishment.posture recompute as a creation side effect (see POST /safety/cases/{id}/severe-reports)."

  - entity: Inspection
    initial_state: OPEN
    terminal_states: [CITATIONS_ISSUED, CLOSED_NO_CITATION]
    transitions:
      - from: OPEN
        to: CITATIONS_ISSUED
        trigger: "system (automatic when first Citation created under the inspection)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED_NO_CITATION
        trigger: "POST /safety/inspections/{id}/close"
        actor: SafetyOfficer
        preconditions: ["no Citation exists for the inspection (ERR_CITATIONS_EXIST)"]
        side_effects: ["closed_on stamped"]

  - entity: Citation
    initial_state: ISSUED
    terminal_states: [ABATED, VACATED]
    transitions:
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /safety/citations/{id}/contest"
        actor: SafetyOfficer
        preconditions:
          - "logical clock <= contest_deadline (ERR_CONTEST_WINDOW_PASSED)"
        side_effects: ["contested_at stamped"]
      - from: ISSUED
        to: FINAL_ORDER
        trigger: "POST /safety/citations/{id}/accept-final-order"
        actor: SafetyOfficer
        preconditions:
          - "logical clock <= contest_deadline OR contest window lapsed"
        side_effects:
          - "final_penalty_usd = proposed_penalty_usd"
          - "abatement clock starts"
      - from: CONTESTED
        to: FINAL_ORDER
        trigger: "POST /safety/citations/{id}/resolve-contest"
        actor: SafetyOfficer
        preconditions: ["payload outcome in {AFFIRMED, MODIFIED}"]
        side_effects:
          - "final_penalty_usd = payload.final_penalty_usd when MODIFIED else proposed_penalty_usd"
          - "abatement clock starts from resolution date"
      - from: CONTESTED
        to: VACATED
        trigger: "POST /safety/citations/{id}/resolve-contest with outcome == VACATED"
        actor: SafetyOfficer
        preconditions: []
        side_effects: ["citation removed from penalty totals; any linked CorrectiveActions auto-CANCELLED"]
      - from: FINAL_ORDER
        to: ABATEMENT_PENDING
        trigger: "system (automatic immediately after FINAL_ORDER when abatement_due_date is set)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ABATEMENT_PENDING
        to: ABATED
        trigger: "POST /safety/citations/{id}/abate"
        actor: SafetyOfficer
        preconditions:
          - "payload abatement_evidence non-empty"
          - "logical clock date <= abatement_due_date (else OVERDUE first; abatement from OVERDUE allowed but records late_abatement)"
        side_effects:
          - "abated_at stamped"
          - "linked CorrectiveActions (citation_id == this) auto-VERIFIED bypass of segregation check is FORBIDDEN — they remain in their own machine; only a flag abatement_satisfied set"
          - "Establishment.posture recompute"
      - from: ABATEMENT_PENDING
        to: OVERDUE
        trigger: "system (clock sweep when abatement_due_date < clock date and not abated)"
        actor: system
        preconditions: []
        side_effects: ["Establishment.posture recompute; risk_score += OVERDUE_CITATION_WEIGHT"]
      - from: OVERDUE
        to: ABATED
        trigger: "POST /safety/citations/{id}/abate"
        actor: SafetyOfficer
        preconditions: ["payload abatement_evidence non-empty"]
        side_effects: ["abated_at stamped; late_abatement flag = true; FAILURE_TO_ABATE exposure recorded on Inspection"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: case-classify-stale-case
    parent_entity: IncidentCase
    write_endpoint: "POST /safety/cases/{caseId}/classify"
    occ_field: "expected_case_version"
    description: |
      Classifying a case whose version has advanced since the client last read
      it is rejected. A second sequential classify that legitimately supersedes
      the earlier determination (reclassification flow) must reference the
      current version; a stale expected_case_version indicates the client's
      view of the case predates another writer's update.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: summary-prepare-stale-establishment
    parent_entity: AnnualSummary
    write_endpoint: "POST /safety/summaries/{summaryId}/certify"
    occ_field: "expected_summary_version"
    description: |
      Certifying an AnnualSummary whose version has advanced since the client
      last read it is rejected. Case mutations after prepare bounce the summary
      back to DRAFT and bump its version, so a client certifying against the
      pre-mutation version observes a stale summary.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: day_count_rollup
    trigger: "any CaseDayCountEntry create/void on the case, or case reclassification"
    algorithm: aggregation
    formula: |
      days_away_raw    = sum(calendar_days of ACTIVE entries with day_type == DAYS_AWAY)
      restricted_raw   = sum(calendar_days of ACTIVE entries with day_type == RESTRICTED)
      combined_cap     = 180
      # Cap applies to the COMBINED total; days-away takes precedence when capping:
      if days_away_raw + restricted_raw <= combined_cap:
        days_away_count      = days_away_raw
        restricted_days_count = restricted_raw
      else:
        days_away_count      = min(days_away_raw, combined_cap)
        restricted_days_count = combined_cap - days_away_count
      day_count_closed = (worker_returned_full_duty flag set via close-day-count)
                         OR (days_away_count + restricted_days_count == combined_cap)
                         OR (employee.employment_status == SEPARATED)
    constants:
      COMBINED_DAY_CAP: 180
    precision: "integer calendar days; no rounding"
    variants:
      - name: RECORDED
        when: "Stored fields days_away_count / restricted_days_count; recomputed on every entry create/void and on reclassification; consumed by summary_rollup"
        difference: "Counts each ACTIVE entry's full recorded span (end_date - start_date + 1) regardless of clock position; combined 180 cap with days-away precedence."
      - name: PROJECTED_FINAL
        when: "Read-time fields projected_days_away_count / projected_restricted_days_count on GET /safety/cases/{caseId}"
        difference: "For any ACTIVE entry whose end_date lies strictly AFTER the logical clock date, counts only days from start_date through the clock date (inclusive) — an accrual projection; combined cap applied after truncation. Identical stored entries therefore yield projected != recorded while the case is open and an entry end lies in the future; the variants agree once all entry ends are in the past."
    # NOTE on counting convention: intervals count CALENDAR days (not scheduled
    # work days) per formula above; the cap is on the COMBINED total with
    # days-away precedence.

  - name: trir_rate
    trigger: "AnnualSummary prepare (PROVISIONAL) and certify (CERTIFIED); Establishment live-rate read endpoint (LIVE variant)"
    algorithm: aggregation
    formula: |
      TRIR = (total_recordable_cases * 200000) / total_hours_worked
      Rounding: round_half_up to 1 decimal place.
      If total_hours_worked == 0 -> rate is null (ERR_HOURS_INCOMPLETE on prepare).
    input_set: "IncidentCase with establishment_id == est, log_year == year, is_recordable == true (status NOT_RECORDABLE excluded; FINALIZED included)"
    constants:
      HOURS_BASE: 200000
    precision: "1 decimal place, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "summary.status == PREPARED; computed live from current case rows"
        difference: "reflects later case mutations until summary is certified or bounced to DRAFT"
      - name: CERTIFIED
        when: "summary.status in {CERTIFIED, POSTED}"
        difference: "frozen snapshot taken at certification; identical inputs later produce the ORIGINAL certified value, not the recomputed value"
      - name: LIVE
        when: "GET /safety/establishments/{id}/rates?year=Y"
        difference: "always recomputed from current data, includes RECLASSIFIED-not-yet-redetermined cases using their latest classification; uses only APPROVED/LOCKED hour logs"

  - name: dart_rate
    trigger: "same points as trir_rate"
    algorithm: aggregation
    formula: |
      DART = (total_dart_cases * 200000) / total_hours_worked
      Rounding: round_half_up to 1 decimal place.
    input_set: "IncidentCase with is_dart == true, same filters as trir_rate"
    constants:
      HOURS_BASE: 200000
    precision: "1 decimal place, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "PREPARED summary"
        difference: "live"
      - name: CERTIFIED
        when: "CERTIFIED/POSTED summary"
        difference: "frozen snapshot"

  - name: summary_rollup
    trigger: "AnnualSummary prepare / amend"
    algorithm: aggregation
    formula: |
      total_recordable_cases  = count(cases: is_recordable, log_year == year)
      total_dart_cases        = count(cases: is_dart, log_year == year)
      total_days_away         = sum(days_away_count)      # per-case already capped at 180 combined
      total_restricted_days   = sum(restricted_days_count)
      annual_avg_employment   = round_half_up_to_integer( sum(employment_count over 12 months) / 12 )
      total_hours_worked      = sum(hours_worked over 12 months)
      # ROUNDING ORDER PINNED: each per-case day count is capped FIRST (see
      # day_count_rollup), THEN summed. Never sum raw entries then cap.
    precision: "integers; employment average round_half_up to integer"
    variants: []

  - name: contest_deadline_calc
    trigger: "Citation creation"
    algorithm: chronological
    formula: |
      Start at citation.created_at (date part, UTC).
      Walk forward counting Mon..Fri days only; the created date itself is day 0.
      contest_deadline = (created_date + 15 working days) at 23:59:59Z.
      # Example: created 2026-08-03 (Mon) -> deadline date 2026-08-24 (Mon).
      # created 2026-08-01 (Sat) -> day count starts Mon 2026-08-03 -> deadline 2026-08-21? NO:
      # pinned rule: if created on weekend, day 0 is the following Monday.
    constants:
      WORKING_DAYS: 15
    precision: "date precision; 23:59:59Z time component"
    variants: []

  - name: establishment_risk_score
    trigger: "CorrectiveAction OVERDUE transition, Citation OVERDUE transition, SevereInjuryReport LATE creation, verify/abate completions"
    algorithm: weighted_scoring
    formula: |
      risk_score = 2.0 * live_trir + 3.0 * live_dart
                 + 5.0 * count(CorrectiveAction in OVERDUE)
                 + 8.0 * count(Citation in OVERDUE)
                 + 10.0 * count(SevereInjuryReport LATE within trailing 365 days)
      posture = ELEVATED if risk_score >= 50
              = WATCH    if risk_score >= 25
              = CLEAR    otherwise
      Boundary is INCLUSIVE at >=.
      live_trir/live_dart use the LIVE variant over the clock's current year; when
      hours == 0 in current year, live rates count as 0.0 (NOT null) in this formula.
    constants:
      W_TRIR: 2.0
      W_DART: 3.0
      W_OVERDUE_CA: 5.0
      W_OVERDUE_CITATION: 8.0
      W_LATE_SEVERE: 10.0
      WATCH_THRESHOLD: 25
      ELEVATED_THRESHOLD: 50
    precision: "1 decimal place, round_half_up"
    variants: []

  - name: severe_injury_clock
    trigger: "SevereInjuryReport creation"
    algorithm: threshold
    formula: |
      if report_kind == FATALITY:  deadline = occurred_at + 8 hours
      else:                        deadline = occurred_at + 24 hours
      within_clock = (reported_to_agency_at <= deadline)   # boundary INCLUSIVE
      status = TIMELY if within_clock else LATE
    constants:
      FATALITY_HOURS: 8
      STANDARD_HOURS: 24
    precision: "timestamp comparison to the second"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resources exist and belong to the declared parent chain (establishment scope)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Target entity in a from-state that allows the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Severe-injury clock fields consistent: reported_to_agency_at present when is_severe_event != NONE; deadline math per severe_injury_clock"
    error_id: ERR_SEVERE_REPORT_REQUIRED
    http_status: 422
    applies_to: "POST /safety/cases/{caseId}/severe-reports, POST /safety/cases/{caseId}/finalize"

  - priority: 6
    category: business_temporal
    check: "Recordability determination within 7-day window (inclusive of deadline day); posting within Feb 1 - Apr 30 window; contest within 15 working days"
    error_id: "ERR_RECORDABILITY_WINDOW_PASSED | ERR_POSTING_WINDOW | ERR_CONTEST_WINDOW_PASSED"
    http_status: 422
    applies_to: "classify, post, contest"

  - priority: 7
    category: business_referential
    check: "Cross-entity references valid: employee belongs to same Company as establishment; case_id/citation_id XOR on CorrectiveAction; investigation exists before finalize"
    error_id: "ERR_CROSS_COMPANY_REFERENCE | ERR_LINKAGE_XOR | ERR_INVESTIGATION_OPEN"
    http_status: 422
    applies_to: "case create, corrective-action create, finalize"

  - priority: 8
    category: business_constraint
    check: "Uniqueness: (establishment,year) summary, (establishment,year,month) hour log, one investigation per case, one severe report per case, company fein unique"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "create endpoints"

  - priority: 9
    category: business_constraint
    check: "Segregation of duties: certifier != preparer; verifier != completed_by and != investigation lead; root-cause submitter == lead"
    error_id: ERR_DUTY_SEGREGATION
    http_status: 422
    applies_to: "certify, verify, submit-root-cause"

  - priority: 10
    category: business_constraint
    check: "Day-count intervals: end_date >= start_date; intervals for the same case do not overlap within the same day_type; combined ACTIVE calendar_days may exceed 180 only transiently (cap applied at rollup)"
    error_id: ERR_DAY_INTERVAL_INVALID
    http_status: 422
    applies_to: "day-entry create"

  - priority: 11
    category: business_fiscal
    check: "Hour-log completeness and approval before summary prepare; hours > 0 for rate publication"
    error_id: ERR_HOURS_INCOMPLETE
    http_status: 422
    applies_to: "summary prepare"

  - priority: 12
    category: business_fiscal
    check: "Penalty fields: proposed_penalty_usd >= 0; MODIFIED contest outcome requires explicit final_penalty_usd >= 0"
    error_id: ERR_PENALTY_INVALID
    http_status: 422
    applies_to: "citation create, resolve-contest"

  - priority: 13
    category: existence
    check: "Body shape: required fields present, enum values in declared sets, ISO date/datetime formats parse"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body (evaluated after auth, before business rules; malformed JSON and schema violations)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/safety/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock. Side-effect: sweeps OVERDUE transitions for CorrectiveAction (due_date < clock date) and Citation (abatement_due_date < clock date)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["OVERDUE sweeps; Establishment.posture recompute"]

  # --- Company ---
  - method: POST
    path: "/safety/companies"
    description: "Create company"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, fein]
    output: Company
    side_effects: []

  - method: GET
    path: "/safety/companies/{companyId}"
    description: "Get company"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator, InvestigatingSupervisor]
    code: 200
    input: []
    output: Company
    side_effects: []

  # --- Establishment ---
  - method: POST
    path: "/safety/establishments"
    description: "Create establishment"
    roles: [PlatformAdmin]
    code: 201
    input: [company_id, site_name, naics_code, state_code, size_class, "is_partially_exempt?"]
    output: Establishment
    side_effects: ["posture=CLEAR, risk_score=0, current_year_hours=0"]

  - method: GET
    path: "/safety/establishments/{establishmentId}"
    description: "Get establishment"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator, InvestigatingSupervisor]
    code: 200
    input: []
    output: Establishment
    side_effects: []

  - method: GET
    path: "/safety/establishments/{establishmentId}/rates"
    description: "Live TRIR/DART for a year (LIVE variant, recomputed)"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: [year]
    output: "{ trir: number|null, dart_rate: number|null, total_recordable_cases: integer, total_dart_cases: integer, total_hours_worked: integer }"
    side_effects: []

  - method: GET
    path: "/safety/establishments/{id}/cases"
    description: "List cases of establishment (FK reverse reachability)"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator, InvestigatingSupervisor]
    code: 200
    input: ["status?", "log_year?"]
    output: "IncidentCase[]"
    side_effects: []

  - method: GET
    path: "/safety/establishments/{id}/summaries"
    description: "List annual summaries of establishment"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: ["year?", "status?"]
    output: "AnnualSummary[]"
    side_effects: []

  - method: GET
    path: "/safety/establishments/{id}/hour-logs"
    description: "List hour logs of establishment"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: ["year?", "status?"]
    output: "EstablishmentHourLog[]"
    side_effects: []

  - method: GET
    path: "/safety/establishments/{id}/inspections"
    description: "List inspections of establishment"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: ["status?"]
    output: "Inspection[]"
    side_effects: []

  - method: GET
    path: "/safety/establishments/{id}/corrective-actions"
    description: "List corrective actions of establishment"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: ["status?"]
    output: "CorrectiveAction[]"
    side_effects: []

  # --- Employee ---
  - method: POST
    path: "/safety/employees"
    description: "Create employee"
    roles: [PlatformAdmin, RecordkeepingCoordinator]
    code: 201
    input: [company_id, full_name, job_title, hire_date, "employment_status?"]
    output: Employee
    side_effects: []

  - method: GET
    path: "/safety/employees/{employeeId}"
    description: "Get employee"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator, InvestigatingSupervisor]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: PATCH
    path: "/safety/employees/{employeeId}"
    description: "Update employee (e.g. employment_status -> SEPARATED, which closes open day counts)"
    roles: [PlatformAdmin, RecordkeepingCoordinator]
    code: 200
    input: ["full_name?", "job_title?", "employment_status?"]
    output: Employee
    side_effects: ["if employment_status -> SEPARATED: day_count_closed = true on all non-FINALIZED cases of the employee"]

  # --- IncidentCase ---
  - method: POST
    path: "/safety/cases"
    description: "Injury intake — create case"
    roles: [SafetyOfficer, RecordkeepingCoordinator]
    code: 201
    input: [establishment_id, employee_id, occurred_at, description, body_part, event_type, "is_privacy_case?", "is_severe_event?"]
    output: IncidentCase
    side_effects: ["status INTAKE -> PENDING_REVIEW; case_number assigned; recordability_deadline computed"]

  - method: GET
    path: "/safety/cases/{caseId}"
    description: "Get case"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator, InvestigatingSupervisor]
    code: 200
    input: []
    output: IncidentCase
    side_effects: []

  - method: POST
    path: "/safety/cases/{caseId}/classify"
    description: "Recordability determination / re-determination (OCC-guarded)"
    roles: [SafetyOfficer]
    code: 200
    input: [classification, expected_case_version, "is_privacy_case?"]
    output: IncidentCase
    side_effects:
      - "status transition per state machine"
      - "increments IncidentCase.version by 1"
      - "PREPARED summary for log_year -> DRAFT (bounce)"
      - "Establishment.posture recompute"

  - method: POST
    path: "/safety/cases/{caseId}/reclassify"
    description: "Open reclassification loop (RECORDABLE -> RECLASSIFIED)"
    roles: [SafetyOfficer]
    code: 200
    input: [expected_case_version]
    output: IncidentCase
    side_effects: ["revision_index += 1", "increments IncidentCase.version by 1"]

  - method: POST
    path: "/safety/cases/{caseId}/close-day-count"
    description: "Mark day counting closed (worker returned to full duty)"
    roles: [SafetyOfficer]
    code: 200
    input: [expected_case_version]
    output: IncidentCase
    side_effects: ["day_count_closed = true", "increments IncidentCase.version by 1"]

  - method: POST
    path: "/safety/cases/{caseId}/finalize"
    description: "Finalize case (locks it)"
    roles: [SafetyOfficer]
    code: 200
    input: [expected_case_version]
    output: IncidentCase
    side_effects: ["status -> FINALIZED", "increments IncidentCase.version by 1"]

  - method: GET
    path: "/safety/cases/{id}/day-entries"
    description: "List day-count entries of a case"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: ["status?"]
    output: "CaseDayCountEntry[]"
    side_effects: []

  - method: POST
    path: "/safety/cases/{id}/day-entries"
    description: "Add restricted/lost-day interval"
    roles: [SafetyOfficer]
    code: 201
    input: [day_type, start_date, end_date]
    output: CaseDayCountEntry
    side_effects: ["day_count_rollup recompute", "PREPARED summary bounce"]

  - method: POST
    path: "/safety/cases/{caseId}/day-entries/{entryId}/void"
    description: "Void a day entry"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: CaseDayCountEntry
    side_effects: ["day_count_rollup recompute", "PREPARED summary bounce"]

  - method: GET
    path: "/safety/cases/{id}/investigation"
    description: "Get the case's investigation (0-or-1; returns array)"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator, InvestigatingSupervisor]
    code: 200
    input: []
    output: "IncidentInvestigation[]"
    side_effects: []

  - method: GET
    path: "/safety/cases/{id}/severe-reports"
    description: "Get the case's severe injury report (0-or-1; returns array)"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: []
    output: "SevereInjuryReport[]"
    side_effects: []

  # --- Investigation ---
  - method: POST
    path: "/safety/investigations"
    description: "Open investigation for a case"
    roles: [SafetyOfficer]
    code: 201
    input: [case_id, lead_supervisor_id]
    output: IncidentInvestigation
    side_effects: ["status OPEN"]

  - method: GET
    path: "/safety/investigations/{investigationId}"
    description: "Get investigation"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator, InvestigatingSupervisor]
    code: 200
    input: []
    output: IncidentInvestigation
    side_effects: []

  - method: POST
    path: "/safety/investigations/{investigationId}/submit-root-cause"
    description: "Submit root cause (lead only)"
    roles: [InvestigatingSupervisor]
    code: 200
    input: [root_cause, contributing_factors]
    output: IncidentInvestigation
    side_effects: ["status -> ROOT_CAUSE_SUBMITTED"]

  - method: POST
    path: "/safety/investigations/{investigationId}/reopen"
    description: "Reopen investigation"
    roles: [InvestigatingSupervisor]
    code: 200
    input: []
    output: IncidentInvestigation
    side_effects: ["status -> OPEN"]

  - method: POST
    path: "/safety/investigations/{investigationId}/close"
    description: "Close investigation"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: IncidentInvestigation
    side_effects: ["status -> CLOSED; closed_at stamped"]

  # --- CorrectiveAction ---
  - method: POST
    path: "/safety/corrective-actions"
    description: "Create corrective action (linked to exactly one of case or citation)"
    roles: [SafetyOfficer]
    code: 201
    input: [establishment_id, "case_id?", "citation_id?", description, assigned_to, due_date, priority]
    output: CorrectiveAction
    side_effects: ["status OPEN"]

  - method: GET
    path: "/safety/corrective-actions/{actionId}"
    description: "Get corrective action"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator, InvestigatingSupervisor]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: []

  - method: POST
    path: "/safety/corrective-actions/{actionId}/complete"
    description: "Mark completed"
    roles: [SafetyOfficer]
    code: 200
    input: [completed_by]
    output: CorrectiveAction
    side_effects: ["status -> COMPLETED"]

  - method: POST
    path: "/safety/corrective-actions/{actionId}/verify"
    description: "Verify completion (segregation of duties enforced)"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: ["status -> VERIFIED", "Establishment.posture recompute"]

  - method: POST
    path: "/safety/corrective-actions/{actionId}/reject-verification"
    description: "Reject and reopen"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: ["status -> REOPENED"]

  - method: POST
    path: "/safety/corrective-actions/{actionId}/cancel"
    description: "Cancel"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: ["status -> CANCELLED", "Establishment.posture recompute"]

  # --- AnnualSummary ---
  - method: POST
    path: "/safety/summaries"
    description: "Create draft annual summary (300A) for (establishment, year)"
    roles: [RecordkeepingCoordinator]
    code: 201
    input: [establishment_id, year]
    output: AnnualSummary
    side_effects: ["posting window dates computed"]

  - method: GET
    path: "/safety/summaries/{summaryId}"
    description: "Get summary"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: []
    output: AnnualSummary
    side_effects: []

  - method: POST
    path: "/safety/summaries/{summaryId}/prepare"
    description: "Run rollup + provisional rates"
    roles: [RecordkeepingCoordinator]
    code: 200
    input: []
    output: AnnualSummary
    side_effects: ["status -> PREPARED", "trir/dart PROVISIONAL stored"]

  - method: POST
    path: "/safety/summaries/{summaryId}/certify"
    description: "Certify summary (OCC-guarded; segregation of duties)"
    roles: [SafetyOfficer]
    code: 200
    input: [expected_summary_version]
    output: AnnualSummary
    side_effects: ["status -> CERTIFIED", "trir/dart frozen (CERTIFIED variant)", "hour logs LOCKED", "increments AnnualSummary.version by 1"]

  - method: POST
    path: "/safety/summaries/{summaryId}/post"
    description: "Post 300A during Feb 1 - Apr 30 window"
    roles: [RecordkeepingCoordinator]
    code: 200
    input: []
    output: AnnualSummary
    side_effects: ["status -> POSTED"]

  - method: POST
    path: "/safety/summaries/{summaryId}/amend"
    description: "Amend a certified summary"
    roles: [RecordkeepingCoordinator]
    code: 200
    input: []
    output: AnnualSummary
    side_effects: ["status -> AMENDED", "totals recomputed"]

  # --- HourLog ---
  - method: POST
    path: "/safety/hour-logs"
    description: "Create monthly hour log"
    roles: [RecordkeepingCoordinator]
    code: 201
    input: [establishment_id, year, month, hours_worked, employment_count]
    output: EstablishmentHourLog
    side_effects: []

  - method: GET
    path: "/safety/hour-logs/{hourLogId}"
    description: "Get hour log"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: []
    output: EstablishmentHourLog
    side_effects: []

  - method: POST
    path: "/safety/hour-logs/{hourLogId}/approve"
    description: "Approve hour log"
    roles: [RecordkeepingCoordinator]
    code: 200
    input: []
    output: EstablishmentHourLog
    side_effects: ["status -> APPROVED", "Establishment.current_year_hours recompute"]

  - method: POST
    path: "/safety/hour-logs/{hourLogId}/reopen"
    description: "Reopen approved log (blocked while summary PREPARED+)"
    roles: [RecordkeepingCoordinator]
    code: 200
    input: []
    output: EstablishmentHourLog
    side_effects: ["status -> DRAFT"]

  # --- SevereInjuryReport ---
  - method: POST
    path: "/safety/cases/{id}/severe-reports"
    description: "File severe-injury agency report for a case"
    roles: [SafetyOfficer]
    code: 201
    input: [report_kind, occurred_at, reported_to_agency_at]
    output: SevereInjuryReport
    side_effects: ["within_clock computed", "status TIMELY|LATE", "Establishment.posture recompute"]

  # --- Inspection / Citation ---
  - method: POST
    path: "/safety/inspections"
    description: "Open inspection"
    roles: [SafetyOfficer, PlatformAdmin]
    code: 201
    input: [establishment_id, opened_on, inspection_type, scope]
    output: Inspection
    side_effects: []

  - method: GET
    path: "/safety/inspections/{inspectionId}"
    description: "Get inspection"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: POST
    path: "/safety/inspections/{inspectionId}/close"
    description: "Close with no citation"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status -> CLOSED_NO_CITATION"]

  - method: GET
    path: "/safety/inspections/{id}/citations"
    description: "List citations of inspection"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: ["status?"]
    output: "Citation[]"
    side_effects: []

  - method: POST
    path: "/safety/citations"
    description: "Issue citation under an inspection"
    roles: [SafetyOfficer]
    code: 201
    input: [inspection_id, standard_cited, violation_type, proposed_penalty_usd, abatement_due_date]
    output: Citation
    side_effects: ["contest_deadline computed (15 working days)", "Inspection -> CITATIONS_ISSUED"]

  - method: GET
    path: "/safety/citations/{citationId}"
    description: "Get citation"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: []
    output: Citation
    side_effects: []

  - method: POST
    path: "/safety/citations/{citationId}/contest"
    description: "Contest citation (15-working-day window)"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: Citation
    side_effects: ["status -> CONTESTED"]

  - method: POST
    path: "/safety/citations/{citationId}/accept-final-order"
    description: "Accept as final order without contest"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: Citation
    side_effects: ["status -> FINAL_ORDER -> ABATEMENT_PENDING (system)"]

  - method: POST
    path: "/safety/citations/{citationId}/resolve-contest"
    description: "Resolve a contest"
    roles: [SafetyOfficer]
    code: 200
    input: [outcome, "final_penalty_usd?"]
    output: Citation
    side_effects: ["AFFIRMED/MODIFIED -> FINAL_ORDER -> ABATEMENT_PENDING; VACATED -> VACATED + linked CA auto-CANCELLED"]

  - method: POST
    path: "/safety/citations/{citationId}/abate"
    description: "Certify abatement"
    roles: [SafetyOfficer]
    code: 200
    input: [abatement_evidence]
    output: Citation
    side_effects: ["status -> ABATED", "Establishment.posture recompute"]

  # --- Employees of a company (FK reverse reachability for Employee.company_id) ---
  - method: GET
    path: "/safety/companies/{id}/employees"
    description: "List employees of company"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator, InvestigatingSupervisor]
    code: 200
    input: ["employment_status?"]
    output: "Employee[]"
    side_effects: []

  - method: GET
    path: "/safety/companies/{id}/establishments"
    description: "List establishments of company"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator, InvestigatingSupervisor]
    code: 200
    input: []
    output: "Establishment[]"
    side_effects: []

  - method: GET
    path: "/safety/citations/{id}/corrective-actions"
    description: "List corrective actions linked to a citation"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: []
    output: "CorrectiveAction[]"
    side_effects: []

  - method: GET
    path: "/safety/cases/{id}/corrective-actions"
    description: "List corrective actions linked to a case"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: []
    output: "CorrectiveAction[]"
    side_effects: []

  - method: GET
    path: "/safety/employees/{id}/cases"
    description: "List cases for an employee (FK reverse reachability for IncidentCase.employee_id)"
    roles: [PlatformAdmin, SafetyOfficer, RecordkeepingCoordinator]
    code: 200
    input: ["log_year?"]
    output: "IncidentCase[]"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Resource id not found in declared scope" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current entity version (OCC)" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation: fein / (establishment,year) summary / (establishment,year,month) hour log / one investigation per case / one severe report per case" }
  - { id: ERR_ESTABLISHMENT_EXEMPT, http: 422, condition: "Establishment is partially exempt; 300-log classification not permitted (severe-injury reporting still required)" }
  - { id: ERR_RECORDABILITY_WINDOW_PASSED, http: 422, condition: "Classification attempted after occurred_at + 7 days (non-fatal classifications)" }
  - { id: ERR_POSTING_WINDOW, http: 422, condition: "300A post attempted outside [Feb 1, Apr 30] of year+1" }
  - { id: ERR_CONTEST_WINDOW_PASSED, http: 422, condition: "Contest attempted after 15-working-day deadline" }
  - { id: ERR_SEVERE_REPORT_REQUIRED, http: 422, condition: "Case has is_severe_event != NONE but no SevereInjuryReport exists (finalize blocked) or report timestamps inconsistent" }
  - { id: ERR_CASES_UNRESOLVED, http: 422, condition: "Summary prepare blocked: cases still in INTAKE/PENDING_REVIEW for the year" }
  - { id: ERR_HOURS_INCOMPLETE, http: 422, condition: "Summary prepare blocked: missing or unapproved month logs, or total hours == 0" }
  - { id: ERR_SUMMARY_LOCKED, http: 422, condition: "Operation blocked because summary is POSTED (reclassify) or PREPARED+ (hour-log reopen)" }
  - { id: ERR_SUMMARY_STALE, http: 422, condition: "Certify blocked: a case for the year mutated after prepare (version pin mismatch)" }
  - { id: ERR_INVESTIGATION_OPEN, http: 422, condition: "Finalize blocked: investigation not CLOSED (or missing)" }
  - { id: ERR_DAY_COUNT_OPEN, http: 422, condition: "Finalize blocked: day_count_closed == false" }
  - { id: ERR_CORRECTIVE_ACTION_OPEN, http: 422, condition: "Finalize blocked: linked corrective actions not VERIFIED/CANCELLED" }
  - { id: ERR_DUTY_SEGREGATION, http: 422, condition: "Same operator attempted both sides of a segregated duty (prepare/certify, complete/verify, investigate/verify)" }
  - { id: ERR_NOT_INVESTIGATION_LEAD, http: 422, condition: "Root-cause submission by operator other than lead_supervisor_id" }
  - { id: ERR_NOT_ASSIGNEE, http: 422, condition: "completed_by does not match corrective action assigned_to" }
  - { id: ERR_DAY_INTERVAL_INVALID, http: 422, condition: "Day entry end < start, or overlapping same-type ACTIVE interval on the case" }
  - { id: ERR_CROSS_COMPANY_REFERENCE, http: 422, condition: "Employee and establishment belong to different companies" }
  - { id: ERR_LINKAGE_XOR, http: 422, condition: "CorrectiveAction must reference exactly one of case_id, citation_id" }
  - { id: ERR_CITATIONS_EXIST, http: 422, condition: "Inspection close blocked: citations already issued" }
  - { id: ERR_PENALTY_INVALID, http: 422, condition: "Penalty negative, or MODIFIED contest outcome without explicit final_penalty_usd" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body / missing required field / invalid enum" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator provisioning companies/establishments and driving the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /safety/companies"
      - "POST /safety/establishments"
      - "POST /safety/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: SafetyOfficer
    description: "Employer safety office staff; owns case classification, investigations close, corrective actions, citations"
    identity: opaque
    exclusive_operations:
      - "POST /safety/cases/{id}/classify, /reclassify, /close-day-count, /finalize"
      - "POST /safety/cases/{id}/day-entries (+void)"
      - "POST /safety/investigations (+/close)"
      - "POST /safety/corrective-actions (+complete/verify/reject-verification/cancel)"
      - "POST /safety/cases/{id}/severe-reports"
      - "POST /safety/inspections/{id}/close"
      - "POST /safety/citations (+contest/accept-final-order/resolve-contest/abate)"
      - "POST /safety/summaries/{id}/certify"
    shared_operations:
      - "POST /safety/cases (intake, shared with RecordkeepingCoordinator)"
      - "POST /safety/inspections (shared with PlatformAdmin)"
      - "All GET endpoints"

  - name: RecordkeepingCoordinator
    description: "Maintains logs, hour logs, employees, prepares and posts 300A summaries"
    identity: opaque
    exclusive_operations:
      - "POST /safety/employees, PATCH /safety/employees/{id}"
      - "POST /safety/hour-logs (+approve, +reopen)"
      - "POST /safety/summaries (+prepare, +post, +amend)"
    shared_operations:
      - "POST /safety/cases (intake, shared with SafetyOfficer)"
      - "All GET endpoints"

  - name: InvestigatingSupervisor
    description: "Line supervisor leading an investigation; submits root cause"
    identity: opaque
    exclusive_operations:
      - "POST /safety/investigations/{id}/submit-root-cause"
      - "POST /safety/investigations/{id}/reopen"
    shared_operations:
      - "All GET endpoints"
