      - name: roles_outside_an_endpoints_role_list_are_rejected
        claim_type: Cannot perform other roles exclusive_operations
        grounds:
          - errors.ERR_ROLE_NOT_PERMITTED
          - validations[priority=20]
          - roles.ProgramAdmin.exclusive_operations
          - roles.OrderDesk.exclusive_operations
        distinguishing_aspect: "The deny half of the matrix, in BOTH directions: OrderDesk and PayrollProcessor cannot touch ProgramAdmin's employer/category creates, AND ProgramAdmin - the most privileged operator - cannot touch OrderDesk's catalogue or batch creates. Every attempt is a well-formed payload, so the only cause of the 403 ERR_ROLE_NOT_PERMITTED is the role, and nothing may be persisted."
        test_recipe:
          setup:
