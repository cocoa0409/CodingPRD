          Depth-3 cascade triggered by AthleteEntry -> SCRATCHED: (1) entry
          scratches -> DRAFT Score rows for that entry transition to VOID;
          (2) entry scratching -> parent Squad.athlete_count recomputed;
          (3) squad athlete_count change -> all PanelAssignment.conflict_flag
          recomputed for the session (eligibility pool shrinks).
        test_recipe:
          setup:
            - "Session with Squad of 3 athletes; 1 athlete E1 COMPETING with 1 DRAFT Score"
            - "JudgePanel with PanelAssignment conflict_flag == false (no home_gym overlap)"
            - "After scratch: E1's DRAFT Score -> VOID; Squad.athlete_count 3 -> 2"
