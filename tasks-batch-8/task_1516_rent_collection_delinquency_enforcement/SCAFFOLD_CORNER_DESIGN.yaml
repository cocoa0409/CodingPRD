  - section: calculations
    instances:
      - name: waterfall_due_date_order_within_fee_class
        claim_type: correct_result
        grounds: ["calculations.payment_waterfall_allocation"]
        distinguishing_aspect: "Within the fee class, earlier due_date wins: a 4000 payment fills DAMAGE_FEE 3000 due 2026-08-01 before DAMAGE_FEE 4000 due 2026-08-02, leaving the latter PARTIALLY_PAID at 3000 and rent untouched."
