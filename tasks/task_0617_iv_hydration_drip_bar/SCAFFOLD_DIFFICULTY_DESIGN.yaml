          - state_machines.Appointment.IN_PROGRESS_to_COMPLETED
          - entities.DispatchRoute.fields.status
        distinguishing_aspect: >
          A LOCKED DispatchRoute cannot move LOCKED->CLOSED while its single assigned
          mobile appointment is still DISPATCHED (not COMPLETED/CANCELLED) — DispatchRoute's
          transition depends on Appointment.status, the (DispatchRoute, Appointment)
