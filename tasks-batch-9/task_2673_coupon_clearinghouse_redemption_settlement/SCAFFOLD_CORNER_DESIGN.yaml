      - name: submission_close_fraud_branch_fires_only_when_every_lot_is_rejected
        claim_type: conditional_cascade
        grounds:
          - state_machines.Submission.transitions.SORTED_to_CLOSED
          - state_machines.Submission.transitions.PENDING_to_HELD
          - calculations.retailer_fraud_score
        distinguishing_aspect: |
          Two submissions close on the same retailer minutes apart. The mixed one
          (one VALIDATED lot, one LOT_REJECTED lot) closes to PENDING and leaves
          rejected_submission_count and the fraud score alone; the all-rejected
          one closes to HELD / FRAUD_REVIEW, increments the counter and forces a
          rescore. The rescore then lands at 66.67, below the watchlist
          threshold, so the cascade fires without changing Retailer.status —
          proving the conditional cascade and the threshold ladder are separate
          gates.
        test_recipe:
          setup:
            - "one retailer on the STANDARD base tier, one offer (face 50, fee 7), one POS basket POS-1 with qualifying_units 1"
