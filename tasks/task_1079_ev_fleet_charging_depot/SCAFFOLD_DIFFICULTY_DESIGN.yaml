              payload: { depot_id: "${d_id}", vehicle_id: "${v_id}", driver_id: "${dr_id}", route_name: "R", distance_km: 50, required_soc_pct: 40, scheduled_departure: "2026-05-12T06:00:00Z" }
              as: DepotOperator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /fleet/route-assignments/${r_id}/assign"
              payload: {}
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VEHICLE_NOT_READY (HTTP 409)"
            - "RouteAssignment.${r_id}.status == PLANNED (unchanged)"

      - name: start_requires_charger_operational
        grounds:
          - state_machines.ChargeSession.SCHEDULED_to_ACTIVE
          - entities.Charger.fields.service_status
          - errors[ERR_CHARGER_DOWN]
        distinguishing_aspect: "Entity pair ChargeSession->Charger (different pair): start is gated on Charger.service_status. A SCHEDULED session whose charger was downed by a work order cannot start => ERR_CHARGER_DOWN."
        test_recipe:
          setup:
            - "Depot D; Charger C1; Vehicle V SOC 40. Session SCHEDULED. A charger work order downs C1 (session stays SCHEDULED, not ACTIVE, so no interrupt)."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "C1", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { c_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 40 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${c_id}", vehicle_id: "${v_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z", target_soc_pct: 80, power_kw: 100, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { s_id: $.data.id }
            - call: "POST /fleet/work-orders"
              payload: { asset_type: "CHARGER", charger_id: "${c_id}", issue: "display fault", severity: "MEDIUM" }
              as: MaintenanceTech
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /fleet/charge-sessions/${s_id}/start"
              payload: { actual_start: "2026-05-10T10:00:00Z" }
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CHARGER_DOWN (HTTP 409)"
            - "ChargeSession.${s_id}.status == SCHEDULED (unchanged)"

  # =================================================================
  # RULE 8 — resource_temporal_overlap  (≥2, different interval semantics)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: charger_buffered_halfopen_conflict
        grounds:
          - calculations.charger_slot_geometry
          - validations[priority=9]
          - errors[ERR_CHARGER_TIME_CONFLICT]
        distinguishing_aspect: "Charger resource, half-open intervals PLUS COOLDOWN_BUFFER_MINUTES=30 buffer: existing [10:00,11:00) and new [11:15,12:00) do NOT raw-overlap but the 15-min gap (< 30) collides => ERR_CHARGER_TIME_CONFLICT."
        test_recipe:
          setup:
            - "Depot D; Charger C1; Vehicles VA/VB. Existing session E on C1 [10:00,11:00) power 50."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
