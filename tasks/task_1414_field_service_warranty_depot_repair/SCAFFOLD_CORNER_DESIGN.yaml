            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${u2}", reported_issue: "d2", service_option: "LOANER" }, captures: { rma2: $.data.id } }
            - { call: "POST /depot/rmas/${rma2}/authorize", as: IntakeAgent, payload: {} }
          trigger:
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "00000000-0000-0000-0000-000000000000" }, captures: { e1: $.data.error_id } }
