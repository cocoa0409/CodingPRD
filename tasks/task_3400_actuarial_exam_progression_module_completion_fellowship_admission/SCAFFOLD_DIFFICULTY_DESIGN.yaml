            - call: "GET /actuarial/exam-windows/${win_id}"
              as: Registrar
              captures: { seats: $.data.seats_held, waitl: $.data.waitlist_count }
          assert:
            - "${case_status} == RESOLVED and ${case_until} == 2026-10-05T00:00:00Z (2026-09-05 + 30 days)"
            - "${candA_status} == SUSPENDED and ${candA_until} == 2026-10-05T00:00:00Z (link 1)"
            - "${regA_logi} == CANCELLED and ${regA_reason} == DISCIPLINE_SUSPENSION and ${regA_refund} == 30450 (link 2: full refund, timing-independent)"
            - "${regB_logi} == REGISTERED and ${regB_fee} == 30450 (link 3-4: promotion fired, fee at early tier)"
            - "${regB_logi} before sanction was WAITLISTED: setup capture ${regB_logi} == WAITLISTED"
            - "${seats} == 1 and ${waitl} == 0 (seat handed over, not freed)"
      - name: syllabus_activation_retires_windows_and_refunds
        grounds:
          - state_machines.SyllabusVersion.DRAFT_to_ACTIVE
          - state_machines.Exam.ACTIVE_to_RETIRED
          - state_machines.ExamWindow.REGISTRATION_OPEN_to_CANCELLED
          - state_machines.ExamRegistration.REGISTERED_to_CANCELLED
