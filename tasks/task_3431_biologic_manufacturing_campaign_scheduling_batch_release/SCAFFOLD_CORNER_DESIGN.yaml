              payload: { product_id: "${prod_m}", demand_type: "CLINICAL", planned_start_utc: "2026-10-01T00:00:00Z", planned_end_utc: "2026-10-20T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
