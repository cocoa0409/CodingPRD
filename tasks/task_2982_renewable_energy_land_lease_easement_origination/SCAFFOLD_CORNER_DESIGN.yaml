          - roles.TitleCounsel.shared_operations
          - endpoints[POST /land-origination/site-access-bookings]
        distinguishing_aspect: "The booking endpoint is the only write shared by two operator roles, so both must succeed on the same parcel and their crews must aggregate against the shared limit: 2 crews booked by the land agent plus 1 by title counsel reaches exactly PARCEL_MAX_CONCURRENT_CREWS 3 without tripping it."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre parcel in county 48451. Clock at its 2026-08-01T00:00:00Z default, so both windows are in the future."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
            - call: "POST /land-origination/site-access-bookings"
              payload: { parcel_id: "${p_id}", purpose: "CONSTRUCTION_STAGING", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-10T00:00:00Z", crew_count: 2 }
              as: LandAgent
