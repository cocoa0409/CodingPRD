              as: TalentAdmin
              captures: { r4: $.data.reserved_cents, s4: $.data.spent_cents, m4: $.data.remaining_cents, st4: $.data.status }
          assert:
            - "After submit: reserved 200000, spent 0, remaining 0 (sum == budget 200000)"
            - "After hire: reserved 140000, spent 60000, remaining 0 (sum == 200000)"
            - "After retention sweep: reserved 0, spent 200000, remaining 0, status EXHAUSTED (sum == 200000)"
            - "After abuse forfeiture: reserved 0, spent 0, remaining 200000 (sum == 200000 — fully restored)"
            - "Campaign flips EXHAUSTED -> ACTIVE when spent drops back below budget"

      - name: payroll_batch_total_conservation_through_add_remove_cancel
        grounds:
          - entities.PayrollBatch.fields.total_gross_cents
          - state_machines.PayrollBatch.OPEN_to_CANCELLED
          - state_machines.BonusMilestone.BATCHED_to_APPROVED
        distinguishing_aspect: |
          Conserved quantity: payroll batch money (distinct from campaign
          budget). Batch totals always equal the signed sum of attached lines:
          two 45000 lines give gross 90000 / withholding 19800 / net 70200;
          removing one halves it; cancelling the batch zeroes it and returns
          milestones to APPROVED — no drift at any step.
        test_recipe:
          setup:
            - "Default policy ACTIVE; one referrer with VERIFIED FLAT tax profile"
            - "Two IC referrals (different candidates) on an openings=5 requisition, both hired; both HIRE milestones (45000, withholding 9900 each) APPROVED"
