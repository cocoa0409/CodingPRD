            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-11", night_count: 1, payment_mode: "FLEET_BILL", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { err: $.data.error_id } }
