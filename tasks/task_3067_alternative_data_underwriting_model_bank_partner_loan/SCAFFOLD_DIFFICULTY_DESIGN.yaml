  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: credit_box_activation_gated_by_partner_state
        grounds:
          - state_machines.CreditBox.DRAFT_to_ACTIVE
          - state_machines.Partner.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair CreditBox -> Partner: activating a DRAFT credit box requires
          the OWNING partner to be ACTIVE. Suspending the partner after the box is
          created (box untouched, still DRAFT) makes the identical activation call
          fail with ERR_PARTNER_INVALID_STATE — the box's own state is unchanged, so
          the rejection is purely cross-entity.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Bank P created and ACTIVE, then SUSPENDED. DRAFT credit box B exists under P with a valid window."
          setup_api_calls:
            - call: "POST /platform/partners"
              payload: { legal_name: "Gate Bank", partner_type: "BANK", home_state: "TX" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /platform/partners/${p_id}/activate"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners/${p_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 10, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { b_id: $.data.id }
            - call: "POST /platform/partners/${p_id}/suspend"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-one"
          trigger:
            - call: "POST /platform/partners/${p_id}/credit-boxes/${b_id}/activate"
              payload: { expected_partner_version: "${p_v0} + 2" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PARTNER_INVALID_STATE"
            - "CreditBox.${b_id}.status is still DRAFT"
            - "Partner.${p_id}.active_credit_box_id is null"

      - name: manual_decision_gated_by_application_state
        grounds:
          - state_machines.Application.VERIFICATION_PENDING_to_DOCS_REQUIRED
          - state_machines.Application.DOCS_REQUIRED_to_UNDERWRITTEN
        distinguishing_aspect: |
          Entity pair Verification -> Application: manual-decision is legal only
          while the parent application sits in DOCS_REQUIRED. Calling manual-decision
          on a PENDING verification of a VERIFICATION_PENDING application fails with
          ERR_APPLICATION_INVALID_STATE even though the verification's own state
          would otherwise admit an instant-check — the application's aggregate state
          gates the child operation.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Model ACTIVE (bureau-only). Applicant TX clean flags; application DIRECT is VERIFICATION_PENDING with both verifications PENDING (no instant-check run yet)."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-B-8", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "bureau only", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m1_id: $.data.id }
            - call: "POST /platform/model-versions/${m1_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m1_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr1_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr1_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m1_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/applicants"
              payload: { full_name: "Gate Gail", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap_id: $.data.id }
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_id}", channel: "DIRECT", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { app_id: $.data.id }
            - call: "GET /platform/applications/${app_id}/verifications"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
              captures: { v_inc: "$.data[0].id" }
          trigger:
            - call: "POST /platform/applications/${app_id}/verifications/${v_inc}/manual-decision"
              payload: { outcome: "PASS" }
              as: VerificationOfficer
              as_user_id: "vo-two"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_APPLICATION_INVALID_STATE"
            - "Verification.${v_inc}.status is still PENDING"
            - "Application.${app_id}.status is still VERIFICATION_PENDING"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: credit_box_activation_window_rejects_outside_clock
        grounds:
          - state_machines.CreditBox.DRAFT_to_ACTIVE
          - validations[priority=10]
        distinguishing_aspect: |
          Interval semantics: half-open instant-in-window check [effective_from,
          effective_to] read against the logical clock, on the CreditBox resource.
          Setting the clock one second past effective_to makes activation fail with
          ERR_CREDIT_BOX_NOT_IN_WINDOW; at exactly effective_to it succeeds —
          the window boundary is inclusive at both ends.
        test_recipe:
          setup:
            - "Bank P ACTIVE with a DRAFT credit box B whose window is [2026-01-01T00:00:00Z, 2026-09-01T00:00:00Z]."
            - "Logical clock first advanced to 2026-09-01T00:00:01Z (one second past effective_to)."
          setup_api_calls:
            - call: "POST /platform/partners"
              payload: { legal_name: "Window Bank", partner_type: "BANK", home_state: "TX" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /platform/partners/${p_id}/activate"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners/${p_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 10, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { b_id: $.data.id }
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: PlatformAdmin
              as_user_id: "pad-one"
          trigger:
            - call: "POST /platform/partners/${p_id}/credit-boxes/${b_id}/activate"
              payload: { expected_partner_version: "${p_v0} + 1" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { err_late: $.data.error_id }
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pad-one"
            - call: "POST /platform/partners/${p_id}/credit-boxes/${b_id}/activate"
              payload: { expected_partner_version: "${p_v0} + 1" }
              as: PartnerAdmin
              as_user_id: "pa-one"
          assert:
            - "the first activation returns 409 and err_late == ERR_CREDIT_BOX_NOT_IN_WINDOW (clock one second past effective_to)"
            - "the second activation at exactly effective_to succeeds (boundary inclusive): CreditBox.${b_id}.status == ACTIVE"
            - "Partner.${p_id}.active_credit_box_id == ${b_id}"

      - name: volume_cap_counts_per_calendar_month_window
        grounds:
          - calculations.allocation_selector
          - entities.Partner.fields.originated_this_month_count
