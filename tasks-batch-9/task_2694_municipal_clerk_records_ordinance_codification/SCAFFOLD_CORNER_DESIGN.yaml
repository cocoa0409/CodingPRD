      - name: the_officer_who_proposed_a_destruction_batch_cannot_certify_it
        claim_type: segregation_of_duties
        grounds: ["validations[priority=45]", "errors[ERR_SEGREGATION_OF_DUTIES]", "state_machines[DestructionBatch].PROPOSED->CERTIFIED", "roles[RecordsOfficer]", "roles[CityClerk]"]
        distinguishing_aspect: "The refusal keys on X-User-ID, not on role: ro-01 holds a role that IS listed on the certify endpoint and the batch is otherwise certifiable, yet certification by the proposer returns ERR_SEGREGATION_OF_DUTIES, and the identical call from cc-01 succeeds and moves the custody counters."
        test_recipe:
          setup: ["A five-year series with 40 items accessioned 2019-06-15 (eligible_through_on 2024-06-15, before the 2026-08-01 clock) and a PROPOSED batch of 10 filed by ro-01."]
          setup_api_calls:
            - call: "POST /clerk/record-series"
              payload: { series_code: "CC-08", name: "Utility billing files", retention_years: 5, retention_trigger: "CREATION" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { series: $.data.id }
            - call: "POST /clerk/record-series/${series}/accessions"
              payload: { item_count: 40, accessioned_on: "2019-06-15" }
              as: RecordsOfficer
              as_user_id: "ro-01"
            - call: "POST /clerk/destruction-batches"
              payload: { series_id: "${series}", item_count: 10, cutoff_on: "2019-06-15" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { batch: $.data.id }
          trigger:
            - call: "POST /clerk/destruction-batches/${batch}/certify"
              payload: { certified_on: "2026-08-01" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { err: $.data.error_id }
            - call: "POST /clerk/destruction-batches/${batch}/certify"
              payload: { certified_on: "2026-08-01" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { st: $.data.status, certifier: $.data.certifying_officer_id }
          assert:
            - "the first certify returns HTTP status 403 and ${err} == ERR_SEGREGATION_OF_DUTIES"
            - "immediately after the refusal DestructionBatch.${batch}.status == PROPOSED, certified_on == null and RecordSeries.${series}.active_item_count == 40"
            - "the second certify returns HTTP 200 with ${st} == CERTIFIED and ${certifier} == cc-01"
            - "RecordSeries.${series}.active_item_count == 30 and destroyed_item_count == 10"
            - "total_accessioned_count (40) == active_item_count + destroyed_item_count"

      - name: the_editor_who_resolved_the_conflict_cannot_certify_that_supplement_cycle
        claim_type: segregation_of_duties
        grounds: ["validations[priority=45]", "errors[ERR_SEGREGATION_OF_DUTIES]", "endpoints[POST /clerk/supplement-cycles/{cycle_id}/certify]", "endpoints[POST /clerk/codification-submissions/{submission_id}/resolve-conflict]"]
        distinguishing_aspect: "The paired earlier step here is a conflict resolution recorded on a CHILD row, not on the cycle: because ce-05 appears as resolved_by_user_id on one of the cycle's submissions, ce-05 cannot certify the cycle, while ce-06 — who filed both submissions and locked the cycle — can."
        test_recipe:
          setup: ["A LOCKED cycle on title 12 whose two submissions collided on 12.04.030 and were resolved by ce-05."]
          setup_api_calls:
            - call: "POST /clerk/number-series"
              payload: { series_year: 2026, instrument_class: "ORDINANCE", prefix: "ORD" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns: $.data.id }
            - call: "POST /clerk/code-titles"
              payload: { title_number: 12, name: "Streets, Sidewalks and Public Places" }
              as: CodificationEditor
              as_user_id: "ce-06"
              captures: { ct: $.data.id, ctv0: $.data.version }
            - call: "POST /clerk/code-titles/${ct}/supplement-cycles"
              payload: { supplement_number: 9, window_open_on: "2026-07-01", window_close_on: "2026-09-30" }
              as: CodificationEditor
              as_user_id: "ce-06"
              captures: { cyc: $.data.id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "ORDINANCE", ordinance_category: "CODE_AMENDMENT", title: "Amending 12.04.030 (parking)", full_text_length: 1500, number_series_id: "${ns}", code_title_id: "${ct}", code_section_ref: "12.04.030" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { i1: $.data.id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "ORDINANCE", ordinance_category: "ZONING", title: "Amending 12.04.030 (setbacks)", full_text_length: 1500, number_series_id: "${ns}", code_title_id: "${ct}", code_section_ref: "12.04.030" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { i2: $.data.id }
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "${cyc}", instrument_id: "${i1}", code_section_ref: "12.04.030", action: "AMEND", expected_code_title_version: "${ctv0}" }
              as: CodificationEditor
              as_user_id: "ce-06"
              captures: { s1: $.data.id }
            - call: "GET /clerk/code-titles/${ct}"
              payload: {}
              as: CodificationEditor
              as_user_id: "ce-06"
              captures: { ctv1: $.data.version }
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "${cyc}", instrument_id: "${i2}", code_section_ref: "12.04.030", action: "AMEND", expected_code_title_version: "${ctv1}" }
              as: CodificationEditor
              as_user_id: "ce-06"
              captures: { s2: $.data.id }
            - call: "POST /clerk/supplement-cycles/${cyc}/lock"
              payload: {}
              as: CodificationEditor
              as_user_id: "ce-06"
            - call: "POST /clerk/codification-submissions/${s2}/resolve-conflict"
              payload: { resolution_basis: "SPECIFIC_OVER_GENERAL" }
              as: CodificationEditor
              as_user_id: "ce-05"
              captures: { resolver: $.data.resolved_by_user_id }
          trigger:
            - call: "POST /clerk/supplement-cycles/${cyc}/certify"
              payload: { certified_on: "2026-09-30" }
              as: CodificationEditor
              as_user_id: "ce-05"
              captures: { err: $.data.error_id }
            - call: "POST /clerk/supplement-cycles/${cyc}/certify"
              payload: { certified_on: "2026-09-30" }
              as: CodificationEditor
              as_user_id: "ce-06"
              captures: { st: $.data.status, cert_on: $.data.certified_on }
          assert:
            - "${resolver} == ce-05 and SupplementCycle.${cyc}.conflict_count == 0"
            - "the first certify returns HTTP status 403 and ${err} == ERR_SEGREGATION_OF_DUTIES"
            - "immediately after the refusal SupplementCycle.${cyc}.status == LOCKED and certified_on == null"
            - "the second certify returns HTTP 200 with ${st} == CERTIFIED and ${cert_on} == 2026-09-30"
            - "exactly one of CodificationSubmission.${s1} and CodificationSubmission.${s2} is ACCEPTED and the other is REJECTED"

      - name: a_requester_cannot_read_or_withdraw_a_different_requesters_request
        claim_type: peer_roles
        grounds: ["validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]", "roles[Requester]", "endpoints[GET /clerk/records-requests/{request_id}]", "endpoints[POST /clerk/records-requests/{request_id}/withdraw]"]
        distinguishing_aspect: "The Requester role is entity-backed, so authorisation compares X-User-ID against the request id in the PATH, not against a stored owner column: r1's own id reads r1 but is refused on r2 with ERR_NOT_RESOURCE_OWNER (403, not 404), and the clerk — whose role is listed without the ownership clause — reads both."
        test_recipe:
          setup: ["Two records requests filed anonymously by two different members of the public."]
          setup_api_calls:
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "M. Rivera", requester_email: "m.rivera@example.org", subject_description: "Council correspondence 2025" }
              as: Anonymous
              as_user_id: "anon-01"
              captures: { r1: $.data.id }
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "T. Okafor", requester_email: "t.okafor@example.org", subject_description: "Planning commission packets 2025" }
              as: Anonymous
              as_user_id: "anon-02"
              captures: { r2: $.data.id }
          trigger:
            - call: "GET /clerk/records-requests/${r1}"
              payload: {}
              as: Requester
              as_user_id: "${r1}"
              captures: { own_status: $.data.fulfillment_status }
            - call: "GET /clerk/records-requests/${r2}"
              payload: {}
              as: Requester
              as_user_id: "${r1}"
              captures: { e_read: $.data.error_id }
            - call: "POST /clerk/records-requests/${r2}/withdraw"
              payload: {}
              as: Requester
              as_user_id: "${r1}"
              captures: { e_withdraw: $.data.error_id }
            - call: "GET /clerk/records-requests/${r2}"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { clerk_read: $.data.fulfillment_status }
          assert:
            - "${own_status} == RECEIVED"
            - "the second and third calls return HTTP status 403"
            - "${e_read} == ERR_NOT_RESOURCE_OWNER and ${e_withdraw} == ERR_NOT_RESOURCE_OWNER"
            - "neither error is ERR_REQUEST_NOT_FOUND (the row exists; the caller is simply not its owner)"
            - "${clerk_read} == RECEIVED — the withdraw was not applied"

  # ===================================================================
  # SECTION 8 — cross_cutting_complexity_layers (§1.2.1 / complexity_profile)
  # ===================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: filing_a_revision_against_the_pre_posting_meeting_version_is_rejected_as_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[packet-revision-create-stale-meeting]", "errors[ERR_STALE_MEETING_VERSION]", "endpoints[POST /clerk/meetings/{meeting_id}/agenda-packets]"]
        distinguishing_aspect: "The clerk reads Meeting.version 1 at creation, then two accepted writes (the first revision and its posting) advance it; replaying the original expected_meeting_version returns ERR_STALE_MEETING_VERSION with 412 — not 409 or 422 — and the re-read version is accepted immediately afterwards, superseding the posted packet and pulling the meeting back to SCHEDULED."
        test_recipe:
          setup: ["A meeting whose version was captured at creation and has since been advanced twice by a packet filing and a posting."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mtgv_old: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv_old}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { p1: $.data.id }
            - call: "POST /clerk/agenda-packets/${p1}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${p1}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv_old}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err: $.data.error_id }
            - call: "GET /clerk/meetings/${mtg}"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtgv_now: $.data.version, st_before: $.data.status }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv_now}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { p2: $.data.id, rev2: $.data.revision_number }
          assert:
            - "the stale filing returns HTTP status 412 and ${err} == ERR_STALE_MEETING_VERSION"
            - "${mtgv_now} == ${mtgv_old} + 2 and ${st_before} == NOTICED"
            - "GET /clerk/agenda-packets?meeting_id=${mtg} returns total_count == 1 immediately after the refusal"
            - "the re-read filing returns HTTP 201 with ${rev2} == 2"
            - "AgendaPacket.${p1}.status == SUPERSEDED and AgendaPacket.${p2}.status == DRAFT"
            - "Meeting.${mtg}.status == SCHEDULED and Meeting.${mtg}.version == ${mtgv_now} + 1"

      - name: a_second_submission_carrying_the_first_submissions_code_title_version_is_rejected_as_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[submission-create-stale-code-title]", "errors[ERR_STALE_CODE_TITLE_VERSION]", "endpoints[POST /clerk/codification-submissions]"]
        distinguishing_aspect: "Filing a submission is itself a write on the CodeTitle, so the version the editor read before the first filing is already stale for the second one even though the two touch different sections; the 412 is ERR_STALE_CODE_TITLE_VERSION, and no counters move until the re-read succeeds."
        test_recipe:
          setup: ["Code title 12 with an OPEN cycle and two CODE_AMENDMENT ordinances on 12.04.030 and 12.04.040."]
          setup_api_calls:
            - call: "POST /clerk/number-series"
              payload: { series_year: 2026, instrument_class: "ORDINANCE", prefix: "ORD" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns: $.data.id }
            - call: "POST /clerk/code-titles"
              payload: { title_number: 12, name: "Streets, Sidewalks and Public Places" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { ct: $.data.id, ctv_old: $.data.version }
            - call: "POST /clerk/code-titles/${ct}/supplement-cycles"
              payload: { supplement_number: 10, window_open_on: "2026-07-01", window_close_on: "2026-09-30" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { cyc: $.data.id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "ORDINANCE", ordinance_category: "CODE_AMENDMENT", title: "Amending 12.04.030", full_text_length: 1500, number_series_id: "${ns}", code_title_id: "${ct}", code_section_ref: "12.04.030" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { i1: $.data.id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "ORDINANCE", ordinance_category: "CODE_AMENDMENT", title: "Adding 12.04.040", full_text_length: 1200, number_series_id: "${ns}", code_title_id: "${ct}", code_section_ref: "12.04.040" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { i2: $.data.id }
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "${cyc}", instrument_id: "${i1}", code_section_ref: "12.04.030", action: "AMEND", expected_code_title_version: "${ctv_old}" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "${cyc}", instrument_id: "${i2}", code_section_ref: "12.04.040", action: "ADD", expected_code_title_version: "${ctv_old}" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { err: $.data.error_id }
            - call: "GET /clerk/code-titles/${ct}"
              payload: {}
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { ctv_now: $.data.version }
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "${cyc}", instrument_id: "${i2}", code_section_ref: "12.04.040", action: "ADD", expected_code_title_version: "${ctv_now}" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { s2: $.data.id, s2_status: $.data.status }
          assert:
            - "the stale filing returns HTTP status 412 and ${err} == ERR_STALE_CODE_TITLE_VERSION"
            - "${ctv_now} == ${ctv_old} + 1"
            - "immediately after the refusal SupplementCycle.${cyc}.submission_count == 1 and client_submission_count == 1"
            - "the re-read filing returns HTTP 201 with ${s2_status} == PENDING"
            - "SupplementCycle.${cyc}.submission_count == 2 and client_submission_count == 2 and conflict_count == 0"
            - "CodeTitle.${ct}.version == ${ctv_now} + 1"
            - "CodificationSubmission.${s1}.status == PENDING — the refused filing left it untouched"

      - name: opening_a_correction_against_a_pre_approval_minutes_version_is_rejected_as_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[minutes-correction-create-stale-minutes]", "errors[ERR_STALE_MINUTES_VERSION]", "endpoints[POST /clerk/minutes/{minutes_id}/corrections]"]
        distinguishing_aspect: "By the time minutes are APPROVED their version has been advanced by the narrative write, the submission and the approval cascade, so the version read at creation is three or more behind: the correction is refused with ERR_STALE_MINUTES_VERSION (412) and the record stays APPROVED with pending_correction_text null and correction_count 0 until the current version is presented."
        test_recipe:
          setup: ["Minutes of a September meeting approved at an October meeting, with the version captured at their creation still held by the caller."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
