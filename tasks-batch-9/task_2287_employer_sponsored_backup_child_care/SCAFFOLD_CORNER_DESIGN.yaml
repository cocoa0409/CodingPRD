      - name: corner_network_domain_state_and_terminal_error_battery
        claim_type: error_triggerable
        grounds:
          - validations[priority=400]
          - validations[priority=405]
          - validations[priority=423]
          - errors[ERR_PROVIDER_STATE_INVALID]
          - errors[ERR_PROVIDER_TERMINAL]
          - errors[ERR_CREDENTIAL_TERMINAL]
          - errors[ERR_PROVIDER_FIELD_IMMUTABLE]
          - errors[ERR_INCIDENTREPORT_STATE_INVALID]
          - errors[ERR_INCIDENTREPORT_TERMINAL]
        distinguishing_aspect: "Six network-side codes are separated on one provider pair: PENDING -> PROBATION gives ERR_PROVIDER_STATE_INVALID (400) while DEPROVISIONED gives ERR_PROVIDER_TERMINAL (405); a second revoke of a REVOKED credential gives ERR_CREDENTIAL_TERMINAL because rule 400 stands down for terminal states; substantiating an OPEN report gives ERR_INCIDENTREPORT_STATE_INVALID but reviewing a DISMISSED one gives ERR_INCIDENTREPORT_TERMINAL; and PATCHing care_mode gives ERR_PROVIDER_FIELD_IMMUTABLE while re-sending the identical care_mode succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Provider P1 CENTER_BASED in MKT-SLC, left PENDING at first; Provider P2 CENTER_BASED in MKT-BOI, fully credentialed."
