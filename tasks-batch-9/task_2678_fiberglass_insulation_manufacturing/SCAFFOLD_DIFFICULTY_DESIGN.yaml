            - "after the trigger — ThermalTest.${test_1}.mean_r_value == 12.900, byte-identical to attempt 1, so the mean cannot explain the flip"
            - "ThermalTest.${test_1}.specimen_count == 3, declared_r_value_at_test == 13.0, conformance_basis == PER_SPECIMEN, status == COMPLETED, attempt_number == 2"
            - "ProductionRun.${run_a}.qc_status == CONFORMING and run_status == PACKAGED"
