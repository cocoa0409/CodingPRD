      - name: simulation_of_two_disconnected_sources_takes_the_system_minimum
        claim_type: correct_result
        grounds:
          - calculations.line_throughput_simulation
          - complexity_profile.primary_archetype
          - entities.SimulationRun.fields.shortfall_cph
        distinguishing_aspect: |
          With two unlinked sources splitting the inbound mix 5000/5000, each segment's system rate is its
          capacity grossed up to 100% of flow (3000 and 1200), so the disconnected graph's
          effective_throughput_cph is 1200 with bottleneck S-02 and shortfall_cph 50 — a per-segment maximum
          (1500) or a sum of capacities (2100) would both be wrong.
        test_recipe:
          setup:
            - "A project with required_throughput_cph 1250 and two source segments and no flow links: S-01 BELT 1500 cph / 100% share 5000, S-02 ROLLER 600 cph / 100% share 5000."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Harbourline Foods", facility_code: "DC-MEM-02", customer_rep_user_id: "cust-rep-81", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "BASIC" }
              as: ProjectDirector
              as_user_id: "pd-031"
              captures: { proj_c2: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_c2}", segment_code: "S-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 100, source_share_bps: 5000 }
              as: DesignEngineer
              captures: { seg_c2a: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_c2}", segment_code: "S-02", equipment_class: "ROLLER", rated_capacity_cph: 600, availability_pct: 100, source_share_bps: 5000 }
              as: DesignEngineer
              captures: { seg_c2b: $.data.id }
          trigger:
            - call: "POST /projects/${proj_c2}/simulations"
              payload: { method: "DETERMINISTIC_STEADY_STATE" }
              as: DesignEngineer
              captures: { sim_c2: $.data.id }
          assert:
