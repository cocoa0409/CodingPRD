  # =========================================================================
  # Section: cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: supersede_cascade_increments_version
        claim_type: derived_field_reconciliation
        grounds: [state_machines.PricingAgreement.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "Activating a fully-covering agreement bumps the old one's version (side effect observable)"
        test_recipe:
          setup: ["PA_old ACTIVE; PA_new DRAFT with fully-covering window"]
          setup_api_calls:
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Supersede Co" }
              as: QualityManager
              captures: { c: $.data.id }
            - call: "POST /toll-operations/customers/${c}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 1, tolling_per_kg_cents: 1, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: QualityManager
              captures: { pa_old: $.data.id, pa_old_v: $.data.version }
            - call: "POST /toll-operations/customers/${c}/pricing-agreements/${pa_old}/activate"
              payload: { expected_pricing_agreement_version: "${pa_old_v}" }
              as: QualityManager
              captures: { pa_old_v_after_act: $.data.version }
            - call: "POST /toll-operations/customers/${c}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 2, tolling_per_kg_cents: 2, formulated_price_per_kg_cents: 0, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa_new: $.data.id, pa_new_v: $.data.version }
          trigger:
            - call: "POST /toll-operations/customers/${c}/pricing-agreements/${pa_new}/activate"
              payload: { expected_pricing_agreement_version: "${pa_new_v}" }
              as: QualityManager
            - call: "GET /toll-operations/customers/${c}/pricing-agreements/${pa_old}"
              as: Any
              captures: { old_status: $.data.status, old_version: $.data.version }
          assert:
            - "PricingAgreement.${pa_old}.status == SUPERSEDED"
            - "PricingAgreement.${pa_old}.version == ${pa_old_v_after_act} + 1 (cascade bumped)"

      - name: partial_overlap_pricing_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_AGREEMENT_WINDOW_OVERLAP]"]
        distinguishing_aspect: "Partial overlap (not full coverage) is rejected; full coverage supersedes"
        test_recipe:
          setup: ["PA1 ACTIVE [Aug 1, Sep 30); PA2 DRAFT with window [Sep 1, Oct 31) — partial overlap, not full coverage"]
          setup_api_calls:
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Overlap Co" }
              as: QualityManager
              captures: { c: $.data.id }
            - call: "POST /toll-operations/customers/${c}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 1, tolling_per_kg_cents: 1, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: QualityManager
              captures: { pa1: $.data.id, pa1_v: $.data.version }
            - call: "POST /toll-operations/customers/${c}/pricing-agreements/${pa1}/activate"
              payload: { expected_pricing_agreement_version: "${pa1_v}" }
              as: QualityManager
            - call: "POST /toll-operations/customers/${c}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 2, tolling_per_kg_cents: 2, formulated_price_per_kg_cents: 0, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-31T00:00:00Z" }
              as: QualityManager
              captures: { pa2: $.data.id, pa2_v: $.data.version }
          trigger:
            - call: "POST /toll-operations/customers/${c}/pricing-agreements/${pa2}/activate"
              payload: { expected_pricing_agreement_version: "${pa2_v}" }
              as: QualityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_AGREEMENT_WINDOW_OVERLAP (partial overlap, not full coverage)"
            - "PricingAgreement.${pa1}.status == ACTIVE (unchanged)"
            - "PricingAgreement.${pa2}.status == DRAFT (unchanged)"

