  - { method: GET, path: "/vendor-office/sterilizer-units", description: "List sterilizer units", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: ["limit?", "offset?"], output: "SterilizerUnit[]", side_effects: [] }
  - { method: GET, path: "/vendor-office/sterilizer-units/{id}", description: "Get sterilizer unit", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: [], output: SterilizerUnit, side_effects: [] }

  # --- SurgicalCase ---
  - { method: POST, path: "/vendor-office/cases", description: "Create case; room buffered-overlap check (conflict iff NOT (new_start >= existing_end + buffer OR existing_start >= new_end + buffer))", roles: [ORScheduler], code: 201, input: [case_number, or_room_id, procedure_type, surgeon_name, scheduled_start_at, scheduled_end_at], output: SurgicalCase, side_effects: ["status SCHEDULED; delay fields default"] }
  - { method: GET, path: "/vendor-office/cases", description: "List cases (FK reverse for or_room_id)", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: ["or_room_id?", "status?", "limit?", "offset?"], output: "SurgicalCase[]", side_effects: [] }
  - { method: GET, path: "/vendor-office/cases/{id}", description: "Get case (delay attribution fields)", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: [], output: SurgicalCase, side_effects: [] }
  - { method: POST, path: "/vendor-office/cases/{id}/reschedule", description: "OCC-guarded reschedule; re-derives request deadlines, tray windows, pass windows; readiness recompute + flip escalations", roles: [ORScheduler], code: 200, input: [scheduled_start_at, scheduled_end_at, expected_case_version], output: SurgicalCase, side_effects: ["case.version +1", "linked APPROVED requests required_delivery_by recomputed", "tray required/projected sterile-ready recomputed + readiness recompute + flip escalation", "pass windows recomputed"] }
  - { method: POST, path: "/vendor-office/cases/{id}/start", description: "Start case; readiness gate with override; provisional delay attribution; STAGED trays -> IN_USE; override auto-escalations", roles: [ORScheduler], code: 200, input: ["override_readiness?", "override_reason?"], output: SurgicalCase, side_effects: ["actual_start_at = clock; provisional delay fields computed", "STAGED trays -> IN_USE", "override -> auto Escalation OPEN per deficient APPROVED request", "case.version +1"] }
  - { method: POST, path: "/vendor-office/cases/{id}/complete", description: "Complete case; final delay attribution; tray cascade to AWAITING_PICKUP/CANCELLED", roles: [ORScheduler], code: 200, input: [], output: SurgicalCase, side_effects: ["actual_end_at = clock; vendor_delay_minutes_final computed", "tray cascade per §1.2", "readiness recompute per request", "case.version +1"] }
  - { method: POST, path: "/vendor-office/cases/{id}/cancel", description: "Cancel case with full cascade (requests, trays, penalties VOID, passes, escalations)", roles: [ORScheduler], code: 200, input: [], output: SurgicalCase, side_effects: ["cascade per §1.2 SurgicalCase SCHEDULED -> CANCELLED"] }
  - { method: POST, path: "/vendor-office/cases/{id}/delay-events", description: "Record a delay event; vendor causes require attributable_request_id of this case; cumulative vendor minutes <= delay_minutes_provisional", roles: [ORScheduler, ORCirculatorNurse], code: 201, input: [cause, minutes, "attributable_request_id?"], output: CaseDelayEvent, side_effects: ["recorded_by_role stamped"] }
  - { method: GET, path: "/vendor-office/delay-events", description: "List delay events (FK reverse for case_id, attributable_request_id)", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: ["case_id?", "attributable_request_id?", "limit?", "offset?"], output: "CaseDelayEvent[]", side_effects: [] }
  - { method: GET, path: "/vendor-office/delay-events/{id}", description: "Get a delay event", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: [], output: CaseDelayEvent, side_effects: [] }

