        test_recipe:
          setup:
            - "Wheel WH-3 with initial_life_units 100000 and product EM-10-1 with grind_units_per_tool 20"
            - "Four non-overlapping windows on four distinct cells so no buffer or double-booking rule interferes, each with planned_units 1"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
