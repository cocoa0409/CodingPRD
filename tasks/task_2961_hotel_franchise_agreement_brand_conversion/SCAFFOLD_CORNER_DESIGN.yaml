      - name: application_review_cycle_loops_back
        claim_type: cyclic
        excluded_because:
          difficulty_instance: application_revision_cycle_resets_both_review_axes_twice
          rationale: "That instance already walks UNDER_REVIEW -> REVISION_REQUESTED -> UNDER_REVIEW twice, asserting revision_round climbs to 2 while both independent review axes are reset to NOT_STARTED on each loop."

      - name: compliance_sweep_cascade_down_to_children
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: compliance_sweep_cascades_item_to_plan_to_agreement_to_transfer_request
          rationale: "That transitive_cascade instance already verifies the four-level downstream cascade from an overdue scope line through the plan, the agreement's compliance axis and the pending transfer request."

      - name: revenue_report_ledger_sync_to_the_agreement
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: revenue_correction_conserves_the_fee_ledger
          rationale: "That compensating_invariant instance already reconciles the agreement's four ledger totals and reported_period_count before and after a superseding correction, which is exactly the ledger-sync claim."

      - name: approval_guarded_by_claim_state
        claim_type: guarded_transitions
        excluded_because:
