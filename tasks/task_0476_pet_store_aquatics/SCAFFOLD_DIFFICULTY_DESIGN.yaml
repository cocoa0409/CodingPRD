            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 50, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity: 3, deposit_pct: 0.25 }
              as: StoreClerk
              captures: { so_id: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${p_id}", severity: "MANDATORY" }
              as: InventoryManager
          trigger:
            - call: "POST /special-orders/${so_id}/allocate"
              payload: {}
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PRODUCT_RECALLED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: clinic_room_half_open_overlap_rejected
        grounds:
          - validations[priority=10]
          - entities.ClinicAppointment.fields.room
          - entities.ClinicAppointment.fields.start_at
          - entities.ClinicAppointment.fields.end_at
        distinguishing_aspect: |
          A second appointment in the same store+room whose [start_at,end_at) half-open
          interval overlaps an existing BOOKED appointment is rejected with
          ERR_ROOM_DOUBLE_BOOKED; the interval semantics are half-open so a touching
          appointment (start == prior end) does NOT overlap.
        test_recipe:
          setup:
            - "Store S, room R1 has a BOOKED appointment 09:00–10:00."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /clinic-appointments"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", service_type: "GROOMING", room: "R1", start_at: "2026-01-05T09:00:00Z", end_at: "2026-01-05T10:00:00Z", fee_cents: 5000 }
              as: ClinicVet
          trigger:
            - call: "POST /clinic-appointments"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", service_type: "VACCINE", room: "R1", start_at: "2026-01-05T09:30:00Z", end_at: "2026-01-05T10:30:00Z", fee_cents: 6000 }
              as: ClinicVet
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ROOM_DOUBLE_BOOKED"

      - name: adoption_event_capacity_aggregate_overlap_rejected
        grounds:
          - validations[priority=16]
          - state_machines.LivestockBatch.sale=ON_FLOOR_to_sale=RESERVED
          - entities.AdoptionEvent.fields.capacity
          - entities.AdoptionEvent.fields.placed_head
        distinguishing_aspect: |
          AdoptionEvent occupancy uses AGGREGATE-capacity interval semantics on a different
          resource (the event's head capacity), not pairwise time overlap: a placement
          whose head would push placed_head over capacity is rejected with
          ERR_EVENT_CAPACITY_EXCEEDED even though no two placements share a time window.
        test_recipe:
          setup:
            - "Store S, OPEN event E capacity=5 with placed_head=4 (one prior placement of a 4-head batch); a second healthy ON_FLOOR batch with 2 head."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "rabbit", animal_class: "SMALL_ANIMAL", head_count: 4, unit_price_cents: 3000, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b1_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "rabbit", animal_class: "SMALL_ANIMAL", head_count: 2, unit_price_cents: 3000, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b1_id}/clear-quarantine"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b1_id}/list-on-floor"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b2_id}/clear-quarantine"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b2_id}/list-on-floor"
              payload: {}
              as: LivestockKeeper
            - call: "POST /adoption-events"
              payload: { store_id: "${s_id}", partner_name: "Rescue", event_date: "2026-01-15T00:00:00Z", capacity: 5 }
              as: StoreClerk
              captures: { e_id: $.data.id }
            - call: "POST /adoption-events/${e_id}/open"
              payload: {}
              as: StoreClerk
            - call: "POST /adoption-placements"
              payload: { event_id: "${e_id}", batch_id: "${b1_id}", head: 4 }
              as: LivestockKeeper
          trigger:
            - call: "POST /adoption-placements"
              payload: { event_id: "${e_id}", batch_id: "${b2_id}", head: 2 }
              as: LivestockKeeper
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EVENT_CAPACITY_EXCEEDED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: special_order_allocate_then_cancel_conserves_free_units
        grounds:
          - state_machines.SpecialOrder.REQUESTED_to_ALLOCATED
          - state_machines.SpecialOrder.ALLOCATED_to_CANCELLED
          - entities.InventoryLot.fields.quantity_reserved
          - entities.InventoryLot.fields.quantity_on_hand
        distinguishing_aspect: |
          Conserved quantity = lot free units (quantity_on_hand - quantity_reserved).
          allocate reserves 3 units (free 50→47) and the compensating cancel releases
          them (free 47→50): free-unit count returns to its pre-allocation value with zero
          drift, while quantity_on_hand never changes.
        test_recipe:
          setup:
            - "Store S, Product P, one AVAILABLE lot with quantity_on_hand=50, reserved=0; REQUESTED special order qty=3."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-INV", name: "InvProd", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 50, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
              captures: { lot_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity: 3, deposit_pct: 0.25 }
              as: StoreClerk
              captures: { so_id: $.data.id }
            - call: "POST /special-orders/${so_id}/allocate"
              payload: {}
              as: InventoryManager
          trigger:
            - call: "POST /special-orders/${so_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "InventoryLot.${lot_id}.quantity_reserved == 0"
            - "InventoryLot.${lot_id}.quantity_on_hand == 50"
            - "SpecialOrder.${so_id}.status == CANCELLED"

      - name: adoption_place_then_return_conserves_event_placed_head
        grounds:
          - state_machines.LivestockBatch.sale=ON_FLOOR_to_sale=RESERVED
          - state_machines.LivestockBatch.sale=RESERVED_to_sale=ON_FLOOR
          - entities.AdoptionEvent.fields.placed_head
          - entities.AdoptionPlacement.fields.status
        distinguishing_aspect: |
          Conserved quantity = event.placed_head (a head-count, distinct from lot free
          units). Placing 4 head raises placed_head 0→4 and the compensating return drops
          it 4→0 with zero drift, and the batch sale_state returns RESERVED→ON_FLOOR.
        test_recipe:
          setup:
            - "Store S, OPEN event E (capacity 10, placed_head 0), healthy ON_FLOOR batch B (4 head) placed (RESERVED)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "ferret", animal_class: "SMALL_ANIMAL", head_count: 4, unit_price_cents: 9000, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/clear-quarantine"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/list-on-floor"
              payload: {}
              as: LivestockKeeper
            - call: "POST /adoption-events"
              payload: { store_id: "${s_id}", partner_name: "Rescue", event_date: "2026-01-15T00:00:00Z", capacity: 10 }
              as: StoreClerk
              captures: { e_id: $.data.id }
            - call: "POST /adoption-events/${e_id}/open"
              payload: {}
              as: StoreClerk
            - call: "POST /adoption-placements"
              payload: { event_id: "${e_id}", batch_id: "${b_id}", head: 4 }
              as: LivestockKeeper
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /adoption-placements/${pl_id}/return"
              payload: {}
              as: LivestockKeeper
          assert:
            - "AdoptionEvent.${e_id}.placed_head == 0"
            - "AdoptionPlacement.${pl_id}.status == RETURNED"
            - "LivestockBatch.${b_id}.sale_state == ON_FLOOR"
