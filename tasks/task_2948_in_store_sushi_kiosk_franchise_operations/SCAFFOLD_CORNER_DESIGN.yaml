      - name: license_agreement_activate_without_space_attestation_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.LicenseAgreement.DRAFT_to_ACTIVE"
          - "errors[ERR_SPACE_OBLIGATION_DEFICIENT]"
          - "entities.HostStore.fields.space_compliance_state"
        distinguishing_aspect: |
          The DRAFT -> ACTIVE precondition requires the host store's space_compliance_state to be COMPLIANT or DEFICIENT, never UNVERIFIED: with no attestation on file the activate returns ERR_SPACE_OBLIGATION_DEFICIENT with HTTP 422 and the agreement stays DRAFT.
        test_recipe:
          setup:
            - "clock at 2026-08-03T11:00:00Z (the mandatory logical clock default is 2026-08-01T00:00:00Z)"
            - "one HostStore whose manager has never attested the space, so last_attested_on is null and space_compliance_state is UNVERIFIED"
            - "one DRAFT license agreement over that store"
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: FranchisorOps
            - call: "POST /kiosk-ops/host-stores"
              payload: { name: "Northgate Market 418", banner_chain: "Northgate", store_number: "418", state_code: "CA", weekly_traffic_count: 63000, sushi_space_sqft: 240, refrigerated_case_linear_ft: 20.0, refrigerated_case_capacity_packs: 400 }
              as: FranchisorOps
              captures: { hs_id: $.data.id }
            - call: "POST /kiosk-ops/license-agreements"
              payload: { host_store_id: "${hs_id}", revenue_share_model: "GROSS_SALES", markdown_policy: "PRORATED_REMAINING_LIFE", min_space_sqft_obligation: 220, min_case_linear_ft_obligation: 18.0, space_credit_cents_per_sqft: 1250, effective_from: "2026-08-01", effective_to: "2027-07-31" }
              as: FranchisorOps
              captures: { la_id: $.data.id }
          trigger:
            - call: "POST /kiosk-ops/license-agreements/${la_id}/activate"
              as: FranchisorOps
              captures: { act_err: $.data.error_id }
          assert:
            - "the response status is 422 and data.error_id == ERR_SPACE_OBLIGATION_DEFICIENT"
