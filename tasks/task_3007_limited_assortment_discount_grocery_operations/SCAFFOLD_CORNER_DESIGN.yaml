      - name: duplicate_bid_same_supplier_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_BID_DUPLICATE]"]
        distinguishing_aspect: "Second bid by the same supplier on the same OPEN tender -> 409 ERR_BID_DUPLICATE (one bid per supplier per tender)."
