scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_order_returns_201_with_computed_sla_and_provisional_feesplit
        claim_type: Creation
        grounds:
          - entities.Order
          - entities.Order.fields.sla_hours
          - entities.Order.fields.status
        distinguishing_aspect: "POST /amc/orders with all required fields returns 201, status PLACED, sla_hours computed to 120 (URAR no rush), version 1."
        test_recipe:
          setup:
            - "Lender with budget and empty panel; CA property."
          setup_api_calls:
            - call: "POST /amc/lenders"
              payload: { name: "L Create", approved_panel_appraiser_ids: [], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "40 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, sla: $.data.sla_hours, st: $.data.status, v: $.data.version }
          assert:
            - "POST /amc/orders HTTP 201"
            - "POST /amc/orders .status == PLACED"
            - "POST /amc/orders .sla_hours == 120"
            - "POST /amc/orders .version == 1"

      - name: order_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Order
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /amc/orders/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /amc/orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AMCCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "GET /amc/orders/00000000-0000-0000-0000-000000000000 .error_id == ERR_NOT_FOUND"
            - "GET /amc/orders/00000000-0000-0000-0000-000000000000 HTTP 404"

      - name: create_order_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Order.fields.order_fee_cents
          - validations[priority=14]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /amc/orders omitting order_fee_cents (required, no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Lender + property exist."
          setup_api_calls:
            - call: "POST /amc/lenders"
              payload: { name: "L Miss", approved_panel_appraiser_ids: [], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "41 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "POST /amc/orders .error_id == ERR_INVALID_REQUEST"
            - "POST /amc/orders HTTP 422"

      - name: order_rush_default_false_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Order.fields.rush
          - calculations.turnaround_sla
        distinguishing_aspect: "Omitting rush defaults it to false; sla_hours computes to the non-rush base of 120 for URAR_1004."
        test_recipe:
          setup:
            - "Lender + CA property exist."
          setup_api_calls:
            - call: "POST /amc/lenders"
              payload: { name: "L Def", approved_panel_appraiser_ids: [], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "42 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { rush: $.data.rush, sla: $.data.sla_hours }
          assert:
            - "POST /amc/orders .rush == false"
            - "POST /amc/orders .sla_hours == 120"

      - name: appraiser_id_system_minted_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Appraiser
        distinguishing_aspect: "id, created_at, version are server-minted; appraiser create returns a UUID id with no type prefix and version 1; client cannot set them."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Sys A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id, v: $.data.version }
          assert:
            - "POST /amc/appraisers HTTP 201"
            - "POST /amc/appraisers .version == 1"
            - "POST /amc/appraisers .status == ACTIVE"

      - name: order_invalid_product_type_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Order.fields.product_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /amc/orders with product_type outside {URAR_1004, CONDO_1073, EXTERIOR_2055} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Lender + CA property exist."
          setup_api_calls:
            - call: "POST /amc/lenders"
              payload: { name: "L Enum", approved_panel_appraiser_ids: [], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "43 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "FHA_9999" }
              as: AMCCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "POST /amc/orders .error_id == ERR_INVALID_REQUEST"
            - "POST /amc/orders HTTP 422"

      - name: firewall_event_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.FirewallEvent
        distinguishing_aspect: "FirewallEvent has common_fields false: it carries id + created_at only, no version, and is append-only (no update endpoint)."
        test_recipe:
          setup:
            - "A LenderUser firewall violation has been recorded against an order (see firewall section)."
          setup_api_calls:
            - call: "POST /amc/lenders"
              payload: { name: "L FE", approved_panel_appraiser_ids: [], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "44 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: LenderUser
              as_user_id: "${l_id}"
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: LenderUser
              as_user_id: "${l_id}"
              captures: { blocked_err: $.data.error_id }
          trigger:
            - call: "GET /amc/orders/${o_id}/firewall-events"
              payload: {}
              as: AMCCoordinator
              captures: { fe0: "$.data[0].blocked_operation" }
          assert:
            - "GET /amc/orders/${o_id}/firewall-events HTTP 200"
            - "GET /amc/orders/${o_id}/firewall-events [0].blocked_operation == SELECT_APPRAISER"
            - "GET /amc/orders/${o_id}/firewall-events [0].error_id == ERR_AIR_FIREWALL_VIOLATION"

      - name: orders_list_pagination_total_count_has_more
        claim_type: Listing
        grounds:
          - entities.Order
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /amc/orders?limit=1 over 2 orders for one lender returns 1 item with total_count 2 and has_more true."
        test_recipe:
          setup:
            - "Lender L with two placed orders on two CA properties."
          setup_api_calls:
            - call: "POST /amc/lenders"
              payload: { name: "L Page", approved_panel_appraiser_ids: [], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "45 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "46 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p1_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p2_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
          trigger:
            - call: "GET /amc/orders?lender_id=${l_id}&limit=1&offset=0"
              payload: {}
              as: AMCCoordinator
          assert:
            - "GET /amc/orders?lender_id=${l_id}&limit=1&offset=0 returns exactly 1 item"
            - "GET /amc/orders?lender_id=${l_id}&limit=1&offset=0 meta total_count == 2"
            - "GET /amc/orders?lender_id=${l_id}&limit=1&offset=0 has_more == true"

      - name: order_requires_existing_property_parent_reference
        claim_type: Parent Relationships
        grounds:
          - entities.Order.fields.property_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /amc/orders with a non-existent property_id returns ERR_NOT_FOUND (404); the FK is validated."
        test_recipe:
          setup:
            - "Lender exists; property_id is bogus."
          setup_api_calls:
            - call: "POST /amc/lenders"
              payload: { name: "L FK", approved_panel_appraiser_ids: [], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "00000000-0000-0000-0000-000000000000", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "POST /amc/orders .error_id == ERR_NOT_FOUND"
            - "POST /amc/orders HTTP 404"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: accept_already_accepted_assignment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Assignment.OFFERED_to_ACCEPTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second accept on an ACCEPTED assignment is not a defined transition; returns ERR_INVALID_STATE (409), no side effects."
        test_recipe:
          setup:
            - "Order assigned and accepted once."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Idem A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "L Idem", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "50 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /amc/assignments/${asg_id}/accept"
              payload: { inspection_start: "2026-06-02T15:00:00Z", inspection_end: "2026-06-02T17:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /amc/assignments/${asg_id}/accept"
              payload: { inspection_start: "2026-06-04T15:00:00Z", inspection_end: "2026-06-04T17:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /amc/assignments/${asg_id}/accept .error_id == ERR_INVALID_STATE"
            - "POST /amc/assignments/${asg_id}/accept HTTP 409"

      - name: complete_from_placed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Order.DELIVERED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_budget_on_complete
          rationale: "The state-precondition rejection of completing a PLACED order is asserted as the winning error of the named §1.8 priority-conflict instance."

      - name: cancel_completed_order_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Order.PLACED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From terminal COMPLETED, cancel is not defined; returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Order driven to COMPLETED (assigned, accepted, report PASS, delivered, completed)."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Term A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "L Term", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "51 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /amc/assignments/${asg_id}/accept"
              payload: { inspection_start: "2026-06-02T15:00:00Z", inspection_end: "2026-06-02T17:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
            - call: "POST /amc/assignments/${asg_id}/reports"
              payload: { opinion_of_value_cents: 500000, uad_condition_rating: "C3", uad_quality_rating: "Q4", comparable_count: 5 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /amc/reports/${rpt_id}/compliance-reviews"
              payload: {}
              as: ComplianceReviewer
              captures: { cr_id: $.data.id }
            - call: "POST /amc/compliance-reviews/${cr_id}/finalize"
              payload: {}
              as: ComplianceReviewer
            - call: "GET /amc/orders/${o_id}"
              payload: {}
              as: AMCCoordinator
              captures: { o_v1: $.data.version }
            - call: "POST /amc/orders/${o_id}/complete"
              payload: { expected_order_version: "${o_v1}" }
              as: AMCCoordinator
          trigger:
            - call: "GET /amc/orders/${o_id}"
              payload: {}
              as: AMCCoordinator
              captures: { o_v2: $.data.version }
            - call: "POST /amc/orders/${o_id}/cancel"
              payload: { expected_order_version: "${o_v2}" }
              as: AMCCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "POST /amc/orders/${o_id}/cancel .error_id == ERR_INVALID_STATE"
            - "POST /amc/orders/${o_id}/cancel HTTP 409"

      - name: order_cancel_cascades_assignment_and_report_terminal
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Order.PLACED_to_CANCELLED
          - state_machines.Assignment.ACCEPTED_to_CANCELLED
          - state_machines.Report.SUBMITTED_to_REJECTED
        distinguishing_aspect: "Cancelling an IN_QC order cascades the accepted Assignment to CANCELLED and the SUBMITTED report to REJECTED; FeeSplit zeroed."
        test_recipe:
          setup:
            - "Order IN_QC: assigned, accepted, report submitted, compliance opened (PENDING)."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Cx A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "L Cx", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "52 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /amc/assignments/${asg_id}/accept"
              payload: { inspection_start: "2026-06-02T15:00:00Z", inspection_end: "2026-06-02T17:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
            - call: "POST /amc/assignments/${asg_id}/reports"
              payload: { opinion_of_value_cents: 500000, uad_condition_rating: "C3", uad_quality_rating: "Q4", comparable_count: 5 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /amc/reports/${rpt_id}/compliance-reviews"
              payload: {}
              as: ComplianceReviewer
              captures: { cr_id: $.data.id }
          trigger:
            - call: "GET /amc/orders/${o_id}"
              payload: {}
              as: AMCCoordinator
              captures: { o_v1: $.data.version }
            - call: "POST /amc/orders/${o_id}/cancel"
              payload: { expected_order_version: "${o_v1}" }
              as: AMCCoordinator
            - call: "GET /amc/assignments/${asg_id}"
              payload: {}
              as: AMCCoordinator
              captures: { astat: $.data.status }
            - call: "GET /amc/reports/${rpt_id}"
              payload: {}
              as: AMCCoordinator
              captures: { rstat: $.data.status }
            - call: "GET /amc/orders/${o_id}/fee-split"
              payload: {}
              as: AMCCoordinator
              captures: { ap: "$.data[0].appraiser_fee_cents" }
          assert:
            - "GET /amc/assignments/${asg_id} .status == CANCELLED"
            - "GET /amc/reports/${rpt_id} .status == REJECTED"
            - "GET /amc/orders/${o_id}/fee-split [0].appraiser_fee_cents == 0"

      - name: new_assignment_starts_in_offered_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.Assignment.initial_state
        distinguishing_aspect: "A freshly created Assignment via POST assignments starts in OFFERED."
        test_recipe:
          setup:
            - "Order assigned to an eligible appraiser."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Init A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "L Init", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "53 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
          trigger:
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
              captures: { asg_id: $.data.id, st: $.data.status }
          assert:
            - "POST /amc/orders/${o_id}/assignments .status == OFFERED"
            - "POST /amc/orders/${o_id}/assignments .appraiser_id == ${a_id}"

      - name: reassign_after_decline_supersedes_prior_assignment
        claim_type: Valid Transition
        grounds:
          - state_machines.Order.ASSIGNED_to_ASSIGNED
          - state_machines.Assignment.OFFERED_to_DECLINED
          - entities.Assignment.fields.supersedes_assignment_id
        distinguishing_aspect: "After the first appraiser declines, a second POST assignments creates a superseding Assignment whose supersedes_assignment_id points to the declined one; only one other eligible appraiser exists."
        test_recipe:
          setup:
            - "Two eligible CA appraisers A1,A2 on lender panel; A1 gets the first offer (higher panel_score by created_at tie-break — both fresh 0.3000, A1 older) and declines."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Sup A1", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a1_id: $.data.id }
            - call: "POST /amc/appraisers"
              payload: { full_name: "Sup A2", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a2_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "L Sup", approved_panel_appraiser_ids: ["${a1_id}", "${a2_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "54 CA St", state_code: "CA" }
