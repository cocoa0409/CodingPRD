            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng2}", auditor_id: "${a2}", role_in_engagement: "STAFF", start_date: "2026-03-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 10 }, as: AuditManager, as_user_id: "${mgr1}", captures: { e2: "$.data.error_id" } }
