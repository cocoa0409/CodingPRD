# ---------------------------------------------------------------------------
# 1.9 Scaffold Corner Design - Coverage Index for Non-Difficulty Tests
# ---------------------------------------------------------------------------
# Breadth probe for task 2722 (Charity Golf Outing Operations). One instance per
# applicable row of references/claim-extraction-guide.md, walked against this
# scaffold's own §1.1-§1.7. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# appear as excluded_because stubs naming the covering §1.8 instance.
#
# Conventions used by every test_recipe below:
#   * the logical clock is set explicitly as the first call; the server default is
#     2026-08-01T00:00:00Z and never falls back to wall-clock time
#   * every request carries X-User-Id and X-User-Role; `as:` names the role
#   * "the canonical open outing" means: POST /outing-ops/outings, POST
#     /outing-ops/contracts, SIGN it, POST /outing-ops/package-tiers, then
#     play-transition OPEN_REGISTRATION - the shortest chain that reaches a
#     sellable outing, spelled out call by call in each instance that needs it
# ---------------------------------------------------------------------------
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_outing_returns_201_with_success_envelope_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Outing
          - endpoints[POST /outing-ops/outings]
          - response_envelope.success
        distinguishing_aspect: "All required inputs supplied -> 201, envelope has meta.api_request_id / meta.api_request_timestamp / response_type object / data, and every §1.1 default is materialised on the response body rather than left absent."
        test_recipe:
          setup: ["Empty database; the logical clock is pinned to the default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
          trigger:
            - call: "POST /outing-ops/outings"
              payload: { name: "Envelope Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 20, prize_pool_cents: 250000 }
              as: TournamentDirector
              captures: { o_id: $.data.id, o_v: $.data.version }
          assert:
            - "HTTP 201 and response_type == 'object'"
            - "meta.api_request_id and meta.api_request_timestamp are both present and non-empty"
            - "data.id is a bare UUID with no type prefix, data.version == 1, data.created_at == data.updated_at == 2026-08-01T00:00:00.000Z"
            - "data.play_status == 'DRAFT', data.finance_status == 'COLLECTING', data.proceeds_variant == 'PROVISIONAL', data.reopen_count == 0"
            - "data.confirmed_player_slots == 0, data.waitlisted_registration_count == 0, data.reserved_asset_slot_count == 0, data.gross_revenue_cents == 0, data.net_proceeds_cents == 0"
            - "data.rain_date == null, data.wave_b_start == null, data.wave_b_end == null"

      - name: read_package_tier_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - entities.PackageTier
          - endpoints[GET /outing-ops/package-tiers/{id}]
        distinguishing_aspect: "A single-resource GET echoes exactly what was written, including the enum and the money field, and reports sold_count 0 for a tier nobody has bought yet."
        test_recipe:
          setup: ["One DRAFT outing with one SPONSOR tier."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Read Back Open", beneficiary_name: "Northside Youth Fund", format: "BEST_BALL", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 10, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "PLATINUM", kind: "SPONSOR", price_cents: 500000, player_slots: 4, gsv_cents: 24000, inventory_cap: 2, entitled_asset_type: "CONTEST", entitled_asset_count: 1 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /outing-ops/package-tiers/${t_id}"
              payload: {}
              as: SponsorshipManager
          assert:
            - "HTTP 200 with data.id == ${t_id} and data.outing_id == ${o_id}"
            - "data.code == 'PLATINUM', data.kind == 'SPONSOR', data.price_cents == 500000, data.player_slots == 4, data.gsv_cents == 24000, data.inventory_cap == 2"
            - "data.entitled_asset_type == 'CONTEST', data.entitled_asset_count == 1, data.sold_count == 0"

      - name: list_registrations_filtered_by_outing_paginates_with_total_count
        claim_type: Listing
        grounds:
          - endpoints[GET /outing-ops/registrations]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit 2 over three registrations of one outing returns response_type array, total_count 3, has_more true, and the outing_id filter excludes the fourth registration that belongs to a second outing."
        test_recipe:
          setup:
            - "Two OPEN outings, each with a TEAM tier."
            - "Three PENDING_PAYMENT registrations on outing A and one on outing B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Page One Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 20, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { oa_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${oa_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500 }
              as: CourseOperations
              captures: { ca_id: $.data.id }
            - call: "POST /outing-ops/contracts/${ca_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${oa_id}", code: "TEAM4", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 24000, inventory_cap: 50 }
              as: TournamentDirector
              captures: { ta_id: $.data.id }
            - call: "POST /outing-ops/outings/${oa_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${oa_id}", package_tier_id: "${ta_id}", buyer_name: "Buyer One", player_count: 4 }
              as: TournamentDirector
              captures: { r1_id: $.data.id }
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${oa_id}", package_tier_id: "${ta_id}", buyer_name: "Buyer Two", player_count: 4 }
              as: TournamentDirector
              captures: { r2_id: $.data.id }
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${oa_id}", package_tier_id: "${ta_id}", buyer_name: "Buyer Three", player_count: 4 }
              as: TournamentDirector
              captures: { r3_id: $.data.id }
            - call: "POST /outing-ops/outings"
              payload: { name: "Page Two Open", beneficiary_name: "Southside Literacy Trust", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-26T12:00:00Z", wave_a_start: "2026-09-26T12:00:00Z", wave_a_end: "2026-09-26T16:30:00Z", field_capacity_teams: 20, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { ob_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${ob_id}", course_name: "Birch Hollow GC", rate_per_player_cents: 8000 }
              as: CourseOperations
              captures: { cb_id: $.data.id }
            - call: "POST /outing-ops/contracts/${cb_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${ob_id}", code: "TEAM4", kind: "TEAM", price_cents: 100000, player_slots: 4, gsv_cents: 20000, inventory_cap: 50 }
              as: TournamentDirector
              captures: { tb_id: $.data.id }
            - call: "POST /outing-ops/outings/${ob_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${ob_id}", package_tier_id: "${tb_id}", buyer_name: "Other Outing Buyer", player_count: 4 }
              as: TournamentDirector
              captures: { r4_id: $.data.id }
          trigger:
            - call: "GET /outing-ops/registrations"
              payload: { outing_id: "${oa_id}", limit: 2, offset: 0 }
              as: CharityTreasurer
            - call: "GET /outing-ops/registrations"
              payload: { outing_id: "${oa_id}", limit: 2, offset: 2 }
              as: CharityTreasurer
          assert:
            - "first page: HTTP 200, response_type == 'array', 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: 1 row, total_count == 3, has_more == false, offset == 2"
            - "${r4_id} appears on neither page - the outing_id filter is applied before pagination"
            - "the three returned ids are exactly ${r1_id}, ${r2_id} and ${r3_id} in created_at ascending order"

      - name: read_team_with_unknown_uuid_returns_team_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors.ERR_TEAM_NOT_FOUND
          - endpoints[GET /outing-ops/teams/{id}]
        distinguishing_aspect: "A syntactically valid UUID that no Team row carries returns 404 ERR_TEAM_NOT_FOUND - the entity-specific code, not a generic ERR_OUTING_NOT_FOUND or a 422."
        test_recipe:
          setup: ["Empty database apart from the clock call."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
          trigger:
            - call: "GET /outing-ops/teams/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: TournamentDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == 'ERR_TEAM_NOT_FOUND' and a non-empty data.message"
            - "response_type == 'error'"

      - name: create_outing_missing_required_scheduled_date_returns_422
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /outing-ops/outings]
        distinguishing_aspect: "scheduled_date has source input and no default, so omitting it is a schema failure (422) reported before any business rule; nothing is persisted."
        test_recipe:
          setup: ["Empty database apart from the clock call."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
          trigger:
            - call: "POST /outing-ops/outings"
              payload: { name: "No Date Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 10, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /outing-ops/outings returns total_count == 0"

      - name: create_contract_omitting_optional_fields_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.CourseContract.fields.course_rating
          - entities.CourseContract.fields.slope_rating
          - entities.CourseContract.fields.par
          - entities.CourseContract.fields.tee_interval_minutes
          - entities.CourseContract.fields.cart_allowance_count
          - entities.CourseContract.fields.cancellation_notice_days
        distinguishing_aspect: "Only outing_id, course_name and rate_per_player_cents are required; every other CourseContract input must fall back to its §1.1 default rather than null, because the handicap and tee-sheet calculations read those fields unconditionally."
        test_recipe:
          setup: ["One DRAFT outing."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CourseOperations
            - call: "POST /outing-ops/outings"
              payload: { name: "Defaults Open", beneficiary_name: "Northside Youth Fund", format: "STROKE_PLAY", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 10, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500 }
              as: CourseOperations
              captures: { c_id: $.data.id }
          assert:
            - "HTTP 201 with data.status == 'DRAFT', data.signed_at == null, data.amendment_count == 0, data.version == 1"
            - "data.guaranteed_player_count == 72, data.fnb_minimum_cents == 0, data.fnb_per_player_cents == 4500"
            - "data.course_rating == 71.4, data.slope_rating == 128, data.par == 72"
            - "data.tee_interval_minutes == 10, data.cart_allowance_count == 40, data.cancellation_notice_days == 30"
            - "data.rain_date_terms == 'NONE', data.rain_date_credit_pct == 0.5, data.rain_credit_cents == 0, data.settled_charge_cents == 0"

      - name: computed_tier_sold_count_ignores_a_client_supplied_value
        claim_type: Computed Fields
        grounds:
          - entities.PackageTier.fields.sold_count
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "sold_count has source computed, so a request that tries to write it is a 422 (writing a computed field is named in ERR_INVALID_REQUEST's condition), and the field only ever moves as a consequence of a payment reaching CONFIRMED."
        test_recipe:
          setup: ["The canonical open outing with a TEAM tier priced 120000 and field_capacity_teams 5."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Computed Field Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 5, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
          trigger:
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TEAM4", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 24000, inventory_cap: 50, sold_count: 7 }
              as: TournamentDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == 'ERR_INVALID_REQUEST' - sold_count is not an accepted input key"
            - "GET /outing-ops/package-tiers?outing_id=${o_id} returns total_count == 0"
            - "re-sending the identical payload WITHOUT sold_count returns 201 with data.sold_count == 0"

      - name: receipt_number_and_issued_at_are_server_minted_not_client_supplied
        claim_type: System Fields
        grounds:
          - entities.CharitableReceipt.fields.receipt_number
          - entities.CharitableReceipt.fields.issued_at
          - entities.CharitableReceipt.fields.issued_by_user_id
          - endpoints[POST /outing-ops/receipts]
        distinguishing_aspect: "The receipt endpoint accepts only outing_id, receipt_kind and one subject id; receipt_number is minted per outing in created_at order as GR-0001, issued_at comes from the logical clock (not wall clock) and issued_by_user_id from the X-User-Id header."
        test_recipe:
          setup:
            - "The canonical open outing with a TEAM tier priced 120000 and gsv_cents 24000."
            - "One CONFIRMED registration paid in full; the clock is then advanced to 2026-08-05T09:30:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CharityTreasurer
            - call: "POST /outing-ops/outings"
              payload: { name: "System Field Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 5, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TEAM4", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 24000, inventory_cap: 50 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Stamped Co", player_count: 4 }
              as: TournamentDirector
              captures: { r_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r_id}/payment"
              payload: { amount_cents: 120000 }
              as: CharityTreasurer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:30:00Z" }
              as: CharityTreasurer
          trigger:
            - call: "POST /outing-ops/receipts"
              payload: { outing_id: "${o_id}", receipt_kind: "REGISTRATION", registration_id: "${r_id}" }
              as: CharityTreasurer
              captures: { rec_id: $.data.id }
          assert:
            - "HTTP 201 with data.receipt_number == 'GR-0001' and data.issued_at == 2026-08-05T09:30:00.000Z"
            - "data.issued_by_user_id equals the X-User-Id sent on the trigger call"
            - "data.created_at == 2026-08-05T09:30:00.000Z and the row exposes no version field"
            - "data.payment_cents == 120000, data.gsv_cents == 24000, data.deductible_amount_cents == 96000"

      - name: enum_and_numeric_type_constraints_are_rejected_with_422
        claim_type: Type Constraints
        grounds:
          - entities.Outing.fields.format
          - entities.PackageTier.fields.price_cents
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Two different constraint kinds on two different entities: an unknown value for the format enum and a negative price_cents both fail the schema tier with ERR_INVALID_REQUEST, never a 409 business code."
        test_recipe:
          setup: ["One DRAFT outing exists for the second trigger call."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Type Guard Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 5, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /outing-ops/outings"
              payload: { name: "Match Play Open", beneficiary_name: "Northside Youth Fund", format: "MATCH_PLAY", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 5, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { err_enum: $.data.error_id }
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "NEGATIVE", kind: "TEAM", price_cents: -1, player_slots: 4, gsv_cents: 0, inventory_cap: 10 }
              as: TournamentDirector
              captures: { err_money: $.data.error_id }
          assert:
            - "the first trigger returns HTTP 422 with data.error_id == 'ERR_INVALID_REQUEST' (MATCH_PLAY is not in {SCRAMBLE, BEST_BALL, STROKE_PLAY})"
            - "the second trigger returns HTTP 422 with data.error_id == 'ERR_INVALID_REQUEST' (price_cents violates >= 0)"
            - "GET /outing-ops/outings returns total_count == 1 and GET /outing-ops/package-tiers?outing_id=${o_id} returns total_count == 0"

      - name: charitable_receipt_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds:
          - entities.CharitableReceipt
          - validations[priority=10]
          - errors.ERR_RECEIPT_IMMUTABLE
        distinguishing_aspect: "CharitableReceipt is declared common_fields false: it exposes id and created_at only, has no PUT/PATCH/DELETE anywhere in §1.5, and the only way to negate it is to append a REVERSAL - which itself may not be reversed."
        test_recipe:
          setup:
            - "A registration receipt GR-0001 and its REVERSAL GR-0002 both exist for one paid registration."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CharityTreasurer
            - call: "POST /outing-ops/outings"
              payload: { name: "Append Only Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 5, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TEAM4", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 24000, inventory_cap: 50 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
