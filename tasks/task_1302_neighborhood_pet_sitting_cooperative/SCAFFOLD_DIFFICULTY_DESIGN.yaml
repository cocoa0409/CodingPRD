            - "SittingRequest.${req_id}.status == COMPLETED (unchanged by the dispute detour)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (3 instances, distinct pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: posting_fiscal_beats_constraint_duration
        grounds:
          - validations[priority=14]
          - validations[priority=17]
          - calculations.credit_hours_offered
        distinguishing_aspect: |
          Error-category pair {business_fiscal, business_constraint}: one POST
          violates both priority 14 (offered 100.00 vs balance 10.00 -> margin
          -90.00 < -5.00) and priority 17 (duration 100h outside [1, 72]). Priority
          14 < 17, so the response must be 402 ERR_INSUFFICIENT_CREDIT, never
          ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Founders VETTED; F1 owns pet; F1 balance 10.00; no holiday windows"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
          trigger:
            - call: "POST /coop/sitting-requests"
              payload: { pet_profile_id: "${pet1_id}", start_at: "2026-09-05T10:00:00Z", end_at: "2026-09-09T14:00:00Z", instructions: "100h marathon sit" }
              as: Member
              as_user_id: "${f1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 402 and error_id == ERR_INSUFFICIENT_CREDIT (priority 14 business_fiscal wins)"
            - "error_id != ERR_INVALID_REQUEST despite duration 100h violating priority 17"
            - "No SittingRequest persisted (GET /coop/sitting-requests?owner_member_id=${f1_id} returns empty array)"

      - name: accept_state_beats_sitter_overlap
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - calculations.sitter_overlap_check
          - state_machines.SittingClaim.transitions.PENDING_to_ACCEPTED
        distinguishing_aspect: |
          Error-category pair {state, business_temporal}: the accept violates both
          priority 5 (request CANCELLED, claim REJECTED by the cancel cascade) and
          priority 10 (sitter F2 has overlapping CONFIRMED assignment 10:00-14:00 vs
          request window 12:00-16:00). Priority 5 < 10, so the response must be 409
          ERR_INVALID_STATE, never ERR_SITTER_OVERLAP.
        test_recipe:
          setup:
            - "Founders VETTED; F1 owns pet1 and posts canonical sit 2026-09-10T10:00-14:00; F2 accepted as sitter (CONFIRMED assignment occupies F2 10:00-14:00)"
            - "F3 owns pet3 and posts R2 2026-09-10T12:00-16:00; F2 claims R2 (PENDING); F3 cancels R2 -> claim REJECTED, request CANCELLED, version advanced"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
            - *accept_a
            - call: "POST /coop/members/${f3_id}/pet-profiles"
              payload: { pet_name: "Kiwi", species: "BIRD", routine_notes: "Cover cage at night.", medical_notes: "None.", emergency_vet_name: "Maple Vet Clinic", emergency_vet_phone: "+15550911", emergency_vet_address: "12 Maple St", liability_waiver_accepted: true }
              as: Member
              as_user_id: "${f3_id}"
              captures: { pet3_id: $.data.id }
            - call: "POST /coop/sitting-requests"
              payload: { pet_profile_id: "${pet3_id}", start_at: "2026-09-10T12:00:00Z", end_at: "2026-09-10T16:00:00Z", instructions: "Overlapping afternoon sit" }
              as: Member
              as_user_id: "${f3_id}"
              captures: { req2_id: $.data.id }
            - call: "POST /coop/sitting-requests/${req2_id}/claims"
              payload: { message: "F2 double-books" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { claim2_id: $.data.id }
            - call: "POST /coop/sitting-requests/${req2_id}/cancel"
              payload: { cancelled_reason: "F3 changed plans" }
