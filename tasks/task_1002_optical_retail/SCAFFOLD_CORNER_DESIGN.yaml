              payload: { code: "M150", category: "MATERIAL", base_price_cents: 0, material_index: 1.50 }
              as: PlatformAdmin
              captures: { m150_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Wide Pupil", email: "wide@x.com", dob: "1990-10-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -1.00, od_cylinder: 0.00, os_sphere: -1.00, os_cylinder: 0.00, pd_mm: 72.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
          trigger:
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m150_id}", delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_PD_OUT_OF_RANGE"
            - "GET /optical/orders?customer_id=${cust_id} returns total_count == 0"

      - name: incompatible_coating_pair_rejected
        claim_type: Conditional validation
