          - calculations.discipline_inclusion_set.variants.RESPONDING_STATE
          - calculations.discipline_inclusion_set.variants.REQUESTING_STATE
        excluded_because:
          difficulty_instance: dual_variant_calc / discipline_inclusion_responding_vs_requesting_state
          rationale: "Both passes are run over the same incident set and their differing counts asserted by the named §1.8 instance."

