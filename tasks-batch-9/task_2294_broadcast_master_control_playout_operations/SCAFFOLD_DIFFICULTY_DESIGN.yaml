  # ===========================================================================
  # RULE 6 — Boundary / precision checks
  # Three different measured quantities, each reached through a different
  # endpoint: commercial SECONDS per clock hour (POST /playlists), encoder UNITS
  # of aggregate occupancy (POST /network-feed-windows) and quality POINTS
  # (POST /assets/{id}/qc-waivers). Each instance pins the last accepted value
  # and the first rejected value one unit away.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: commercial_inventory_960_seconds_accepted_961_rejected
        grounds:
          - calculations.commercial_inventory_by_hour
          - validations[priority=63]
          - errors[ERR_COMMERCIAL_INVENTORY_EXCEEDED]
          - entities.Playlist.fields.commercial_seconds_by_hour
        distinguishing_aspect: |
          Metric: COMMERCIAL SECONDS attributed to hour bucket 0, whose half-open
          window is [schedule_start_utc, schedule_start_utc + 3600). A day whose
          hour 0 holds exactly 960 seconds (480 + 480) is ingested and validated,
          while an otherwise identical day holding 961 seconds (480 + 481) is
          refused, because the rule rejects only when the total is strictly
          greater than MAX_COMMERCIAL_SECONDS_PER_HOUR 960.
        test_recipe:
          setup:
            - "Transmitter FAC-1 FULL_POWER, MUX-A (total 20000, pilot 500), one ACTIVE channel 12.1 (SD_480I, floor 2000, requested 6000, priority_rank 1)."
