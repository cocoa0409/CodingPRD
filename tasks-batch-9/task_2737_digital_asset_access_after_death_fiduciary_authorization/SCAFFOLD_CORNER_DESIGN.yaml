      - name: document_verification_and_revocation_are_each_single_shot
        claim_type: Idempotency
        grounds:
          - validations[priority=29]
          - state_machines.Document.transitions[VERIFIED->REVOKED]
          - state_machines.Document.transitions[PENDING->REVOKED]
        distinguishing_aspect: |
          A second VERIFY on an already VERIFIED document is ERR_INVALID_DOCUMENT_STATE (409), and
          REVOKED is terminal for both entry paths — a PENDING document may be revoked directly
          (with no cascade at all, because it never conferred anything) and afterwards refuses both
          VERIFY and a second REVOKE.
        test_recipe:
          setup:
            - "one Estate with a Fiduciary"
            - "one DEATH_CERTIFICATE document and one spare COURT_ORDER document, both PENDING"
          setup_api_calls:
