              payload: {release_note: "Released against the approved proof."}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "POST /error-escapes"
              payload: {artwork_version_id: "${v1_id}", printer_id: "${printer_id}", defect_code: "WRONG_ALLERGEN", discovered_stage: "PACKING", units_affected: 13000, discovery_note: "Allergen panel mis-printed on the packing line."}
              as: QualityReviewer
              as_user_id: "u_qa"
              captures: { escape_id: "$.data.id" }
            - call: "POST /error-escapes/${escape_id}/root-cause"
              payload: {root_cause_party: "PRINTER", printer_share_pct: 1.00, investigation_note: "First pass: plate swapped by the printer."}
              as: QualityReviewer
              as_user_id: "u_qa"
              captures: { escape_v1: "$.data.version" }
            - call: "POST /error-escapes/${escape_id}/recovery-claim"
              payload: {expected_error_escape_version: "${escape_v1}"}
              as: QualityReviewer
              as_user_id: "u_qa"
          trigger:
            - call: "POST /error-escapes/${escape_id}/dispute"
              payload: {dispute_reason: "The brand supplied the wrong allergen copy in the approved artwork."}
              as: PrinterRep
              as_user_id: "${printer_id}"
            - call: "POST /error-escapes/${escape_id}/root-cause"
              payload: {root_cause_party: "SHARED", printer_share_pct: 0.50, investigation_note: "Revised: shared fault between brand copy and press make-ready."}
              as: QualityReviewer
              as_user_id: "u_qa"
              captures: { escape_v2: "$.data.version" }
            - call: "POST /error-escapes/${escape_id}/recovery-claim"
              payload: {expected_error_escape_version: "${escape_v2}"}
              as: QualityReviewer
              as_user_id: "u_qa"
            - call: "POST /error-escapes/${escape_id}/settle"
              payload: {resolution: "WRITTEN_OFF", settlement_note: "Claim abandoned as a goodwill concession."}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "GET /printers/${printer_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "GET /error-escapes/${escape_id}"
              payload: {}
              as: QualityReviewer
              as_user_id: "u_qa"
          assert:
            - "the setup left provisional_recovery_cents == 697000 with liability_cap_applied == false and state == RECOVERY_CLAIMED"
            - "the dispute returns 200 with state == DISPUTED, dispute_count == 1 and dispute_reason stored verbatim"
            - "the revised root-cause returns 200 with state == ROOT_CAUSE_ASSIGNED, root_cause_party == SHARED and printer_share_pct == 0.50"
            - "that same response reports provisional_recovery_cents == null and liability_cap_applied == null (or false) - the prior claim basis is cleared, not carried forward"
            - "the re-raised recovery-claim returns 200 with provisional_recovery_cents == 348500, being round_half_up(546000*0.50) == 273000 plus round_half_up(91000*0.50) == 45500 plus 0 freight plus round_half_up(60000*0.50) == 30000, and state == RECOVERY_CLAIMED"
            - "the settle call returns 200 with state == WRITTEN_OFF, resolution == WRITTEN_OFF, final_recovery_cents == 0, recovery_variance_cents == -348500 and settled_at == 2026-08-01T00:00:00Z"
            - "the settle response leaves performance_penalty_points unpopulated (null) - no scorecard penalty is computed for a write-off"
            - "GET /printers/${printer_id} returns performance_score == 100.0, certification_status == CERTIFIED, recovery_balance_cents == 0 and escape_count == 1"
            - "GET /error-escapes/${escape_id} agrees with the settle response on state, final_recovery_cents and recovery_variance_cents"

      - name: depletion_batch_is_all_or_nothing_and_is_replayed_in_one_chronological_order
        claim_type: bulk_action
        grounds:
          - endpoints[POST /inventory-runouts/{id}/depletion-records]
          - validations[priority=54]
          - errors[ERR_DEPLETION_RECORD_OUT_OF_ORDER]
          - calculations.runout_projection.variants.CHRONOLOGICAL
          - calculations.runout_projection.variants.FORWARD_LOOKING
          - entities.InventoryRunout.fields.depletion_records
          - entities.InventoryRunout.fields.remaining_qty
          - entities.InventoryRunout.fields.trailing_avg_usage_qty
          - entities.InventoryRunout.fields.actual_runout_date
          - state_machines.InventoryRunout.PLANNED_to_MONITORING
        distinguishing_aspect: |
          The batch endpoint has to be atomic in both directions. A three-record
          batch is accepted as one unit and moves four derived fields at once
          (remaining_qty 8900, trailing_avg 3700, actual_runout_date 2026-09-14,
          state MONITORING) while projected_runout_date stays at the planning figure
          2026-09-21 - an implementation that re-runs the FORWARD_LOOKING variant
          overwrites it. Then two rejected batches probe both halves of the ordering
          rule (descending WITHIN the batch, and a week that is merely not greater
          than the stored maximum); after both, the row must be bit-for-bit what it
          was, including a version that advanced exactly once in total. An
          implementation that appends record-by-record leaves the 2026-08-31 record
          behind from the failed batch and reports 4 records with remaining_qty 7700.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "A US CARTON asset whose v1 was approved and then superseded by an approved v2, so v1 is OBSOLETE_PENDING and the asset is SUPERSEDE_PENDING."
            - "A runout is opened over v1 with on_hand_qty 20000, weekly_usage_qty 3000 and runout_start_utc 2026-08-03T00:00:00Z, so it is PLANNED with remaining_qty 20000 and projected_runout_date 2026-08-03 + 7*ceil(20000/3000) == 7 weeks == 2026-09-21."
