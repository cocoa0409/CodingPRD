            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dkt}", water_right_id: "${wr}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: BasinAdjudicator, captures: {clm: "$.data.id"}}
