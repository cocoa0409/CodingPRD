            - "OnlineOrder.${ox_id}: artist_royalty_final_cents == 1000 (FULFILLED, counted)"
            - "OnlineOrder.${oy_id}: status == PLACED with artist_royalty_provisional_cents == 500 (excluded from rollup)"
            - "Tour.${t_id}.royalty_payable_cents == 2360 (1360 + 1000; the PLACED order contributes nothing)"

      - name: register_excludes_voided_sales
        claim_type: input_set_filtering
        grounds: [calculations.venue_commission]
        excluded_because:
          difficulty_instance: settlement_dispute_reconcile_cycle_recomputes
          rationale: "Asserted there directly: after the audit void, resolve recomputes final_gross_cents to 0 while the provisional snapshot stays 400000."

      - name: provisional_snapshot_never_recomputed
        claim_type: variant_selection
        grounds: [calculations.venue_commission]
        excluded_because:
          difficulty_instance: venue_commission_provisional_vs_final
          rationale: "The provisional fields (797000 / 119550) are asserted unchanged after the final variant computes 800000 / 120000."

      - name: size_split_exact_total_conservation
        claim_type: precision
        grounds: [calculations.size_curve_split]
        excluded_because:
          difficulty_instance: size_curve_largest_remainder_tie_order
          rationale: "The 101-unit split asserts the 26/25/25/25 distribution and exact 101-unit conservation, covering both rounding order and the zero-drift property."

