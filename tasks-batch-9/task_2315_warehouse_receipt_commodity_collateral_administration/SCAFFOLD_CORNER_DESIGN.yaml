        claim_type: invalid_transition
        grounds: ["state_machines.Warehouse.license_state", "validations[priority 55]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SUSPEND is only defined on the LICENSED edge; issuing it against an APPLIED warehouse returns 409 ERR_INVALID_STATE and leaves license_state APPLIED at version 1."
        test_recipe:
          setup: ["APPLIED warehouse, never licensed."]
          setup_api_calls:
            - *b_clock
            - *b_wh
          trigger:
