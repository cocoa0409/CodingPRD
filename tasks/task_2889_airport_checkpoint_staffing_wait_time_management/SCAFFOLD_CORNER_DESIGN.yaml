# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# task 2889 — Airport Checkpoint Staffing & Wait Time Management
#
# Walked row-by-row against references/claim-extraction-guide.md. `section:`
# values and `claim_type:` values come from that guide only. Corners already
# asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as excluded_because
# stubs with no test_recipe. Every name here is unique across BOTH design files.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: checkpoint_create_returns_201_with_computed_and_system_fields
        claim_type: creation
        grounds:
          - entities.Checkpoint
          - endpoints.POST_checkpoints
        distinguishing_aspect: "A brand-new checkpoint must come back with every computed counter seeded from its own inputs — available_lane_positions equal to total_lane_positions, not 0 and not null — and with version 1."
        test_recipe:
          setup:
            - "empty database, logical clock pinned"
          setup_api_calls:
            - &c_clock08
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_cp
              call: "POST /checkpoints"
              payload: { name: "T1 Main", terminal_code: "T1", total_lane_positions: 6, wait_threshold_minutes_standard: 15, wait_threshold_minutes_expedited: 8, connecting_pax_discount_pct: 0, secondary_slot_capacity: 2, plan_cost_cap_cents: 10000000 }
              as: PlatformAdmin
              captures: { cp_id: $.data.id, cp_avail: $.data.available_lane_positions, cp_posture: $.data.posture, cp_version: $.data.version }
          assert:
            - "HTTP 201 and ${cp_id} is non-empty"
            - "${cp_avail} == 6 — available_lane_positions is seeded from total_lane_positions, not 0"
            - "${cp_posture} == NORMAL and suspended == false"
            - "${cp_version} == 1 and created_at == updated_at == 2026-09-10T08:00:00Z"
            - "open_lane_count == 0, secondary_slots_in_use == 0, consecutive_breach_count_standard == 0, consecutive_breach_count_expedited == 0, diverted_pax_total == 0, leo_referral_count == 0, denied_entry_count == 0, cleared_referral_count == 0"
            - "the response envelope carries meta.api_request_id and meta.api_request_timestamp with response_type == \"object\""

      - name: checkpoint_get_by_id_returns_stored_entity_unchanged
        claim_type: retrieval
        grounds:
          - endpoints.GET_checkpoints_by_id
          - entities.Checkpoint
        distinguishing_aspect: "A read must be side-effect free: the same version and the same computed counters come back, and updated_at does not move."
        test_recipe:
          setup: ["one checkpoint created at 08:00 with version 1"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: StaffingPlanner
              captures: { read_version: $.data.version, read_updated: $.data.updated_at, read_name: $.data.name }
          assert:
            - "HTTP 200, ${read_name} == \"T1 Main\" and terminal_code == \"T1\""
            - "${read_version} == 1 — a GET never bumps version"
            - "${read_updated} == 2026-09-10T08:00:00Z even though the logical clock has advanced to 09:00"
            - "wait_threshold_minutes_standard == 15, wait_threshold_minutes_expedited == 8, secondary_slot_capacity == 2, plan_cost_cap_cents == 10000000"

      - name: lanes_filtered_list_orders_by_position_index_and_paginates
        claim_type: listing
        grounds:
          - endpoints.GET_lanes
          - response_envelope.pagination_fields
        distinguishing_aspect: "The lane list must be ordered by position_index ASC — the order calculations.lane_requirement waterfalls through — and never by id or creation order; the fixture creates the lanes out of order to prove it."
        test_recipe:
          setup:
            - "one checkpoint with three STANDARD lanes created in position order 3, 1, 2"
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "STANDARD", position_index: 3, required_officer_count: 1, max_concurrent_officers: 2, secondary_positions: 0 }
              as: CheckpointManager
              captures: { lane_p3: $.data.id }
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "STANDARD", position_index: 1, required_officer_count: 1, max_concurrent_officers: 2, secondary_positions: 0 }
              as: CheckpointManager
              captures: { lane_p1: $.data.id }
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "EXPEDITED", position_index: 2, required_officer_count: 1, max_concurrent_officers: 2, secondary_positions: 0 }
              as: CheckpointManager
              captures: { lane_p2: $.data.id }
          trigger:
            - call: "GET /lanes"
              payload: { checkpoint_id: "${cp_id}" }
              as: StaffingPlanner
              captures: { first_lane: "$.data[0].id", first_pos: "$.data[0].position_index" }
            - call: "GET /lanes"
              payload: { checkpoint_id: "${cp_id}", limit: 2, offset: 1 }
              as: StaffingPlanner
              captures: { page_first_pos: "$.data[0].position_index" }
            - call: "GET /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "EXPEDITED" }
              as: StaffingPlanner
              captures: { filtered_id: "$.data[0].id" }
          assert:
            - "the unpaginated read returns 3 rows with total_count == 3 and has_more == false; ${first_lane} == ${lane_p1} and ${first_pos} == 1"
            - "the rows are ordered position_index 1, 2, 3 — creation order was 3, 1, 2, so insertion order is not the sort key"
            - "the limit 2 / offset 1 read returns 2 rows with total_count == 3 and has_more == false, and ${page_first_pos} == 2"
            - "the lane_type EXPEDITED read returns exactly 1 row and ${filtered_id} == ${lane_p2}"
            - "response_type == \"array\" on all three reads"

      - name: officer_get_with_unknown_id_returns_officer_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_OFFICER_NOT_FOUND]
          - endpoints.GET_officers_by_id
        distinguishing_aspect: "A syntactically valid but unknown identifier must produce the entity-specific 404 code, not a generic 400 and not an empty 200."
        test_recipe:
          setup: ["empty database apart from the logical clock"]
          setup_api_calls:
            - *c_clock08
          trigger:
            - call: "GET /officers/off_does_not_exist"
              payload: {}
              as: StaffingPlanner
              expect_status: 404
              captures: { nf_error: $.data.error_id }
          assert:
            - "${nf_error} == ERR_OFFICER_NOT_FOUND with HTTP 404"
            - "the envelope has response_type == \"error\" and data.message is a non-empty string"

      - name: lane_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_lanes
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Every field in POST /lanes input is required and none has a default, so omitting max_concurrent_officers must be a 400 before any checkpoint lookup or position-uniqueness check runs."
        test_recipe:
          setup: ["one checkpoint"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
          trigger:
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "STANDARD", position_index: 1, required_officer_count: 1, secondary_positions: 0 }
              as: CheckpointManager
              expect_status: 400
              captures: { missing_error: $.data.error_id }
          assert:
            - "${missing_error} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /lanes?checkpoint_id=${cp_id} returns an empty list — the rejected create persisted nothing"
            - "Checkpoint.${cp_id}.version == 1 — a rejected lane create does not bump the parent version"

      - name: time_band_omitting_seasonal_multiplier_applies_default_one
        claim_type: defaults
        grounds:
          - entities.TimeBand.fields.seasonal_multiplier
          - entities.ScreeningReferral.fields.requires_private_screening
          - endpoints.POST_time-bands
        distinguishing_aspect: "seasonal_multiplier is the only optional numeric on POST /time-bands and its declared default is 1.00; omitting it must store 1.00 rather than null or 0, otherwise the CURVE_BLENDED forecast would collapse to zero."
        test_recipe:
          setup: ["one checkpoint"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
          trigger:
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T10:00:00Z", expedited_share_pct: 0 }
              as: StaffingPlanner
              captures: { def_band_id: $.data.id, def_mult: $.data.seasonal_multiplier }
          assert:
            - "HTTP 201 and ${def_mult} == 1.00 (serialized with exactly 2 decimals), not null and not 0"
            - "TimeBand.${def_band_id}.band_end_utc == 2026-09-10T10:30:00Z"
            - "forecast_variant, forecast_pax_count, forecast_computed_at_utc, required_standard_lanes, required_expedited_lanes, unmet_standard_demand and unmet_expedited_demand are all null before any forecast run"

      - name: time_band_end_utc_is_computed_and_client_value_is_ignored
        claim_type: computed_fields
        grounds:
          - entities.TimeBand.fields.band_end_utc
          - endpoints.POST_time-bands
        distinguishing_aspect: "band_end_utc is source: computed and is not in the endpoint's input list, so it is always band_start_utc + BAND_MINUTES regardless of what the caller sends; sending it must be rejected as an undeclared key rather than silently honoured."
        test_recipe:
          setup: ["one checkpoint"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
          trigger:
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T10:30:00Z", expedited_share_pct: 40, seasonal_multiplier: 1.25 }
              as: StaffingPlanner
              captures: { comp_band_id: $.data.id, comp_end: $.data.band_end_utc }
          assert:
            - "${comp_end} == 2026-09-10T11:00:00Z — exactly band_start_utc plus BAND_MINUTES (30)"
            - "TimeBand.${comp_band_id}.expedited_share_pct == 40 and seasonal_multiplier == 1.25 were stored verbatim"
            - "a second POST /time-bands carrying an extra band_end_utc key returns ERR_INVALID_REQUEST (400) because band_end_utc is not a declared input field"

      - name: officer_system_fields_are_server_generated
        claim_type: system_fields
        grounds:
          - entities.Officer.fields.duty_status
          - entities.Officer.fields.committed_duty_minutes
          - endpoints.POST_officers
        distinguishing_aspect: "id, created_at, updated_at, version, duty_status, committed_duty_minutes and approved_detail_minutes are all server-owned on Officer; a create must seed them from the state machine's initial_state and the ledger defaults, never from the request."
        test_recipe:
          setup: ["logical clock at 2026-09-10T08:00:00Z"]
          setup_api_calls:
            - *c_clock08
          trigger:
            - &c_officer
              call: "POST /officers"
              payload: { badge_number: "B-1001", full_name: "Ada Lane", certifications: ["STANDARD_LANE", "ADVANCED_IMAGING"], base_rate_cents_per_minute: 100, weekly_regular_minutes_cap: 45, weekly_overtime_minutes_cap: 600 }
              as: PlatformAdmin
              captures: { off_id: $.data.id, off_duty: $.data.duty_status, off_committed: $.data.committed_duty_minutes, off_version: $.data.version }
          assert:
            - "HTTP 201, ${off_duty} == OFF_DUTY (the state machine's initial_state), ${off_committed} == 0 and approved_detail_minutes == 0"
            - "${off_version} == 1 and created_at == 2026-09-10T08:00:00Z from the logical clock, not from wall-clock time"
            - "${off_id} is server-generated and is not the badge_number"
            - "certifications came back as the exact two-element array that was sent"

      - name: time_band_start_off_the_half_hour_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.TimeBand.fields.band_start_utc
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "band_start_utc is constrained to a minute component of exactly 00 or 30 with zero seconds. 10:15 and 10:00:30 are both well-formed ISO-8601 instants, so only the declared alignment constraint rejects them — and that alignment is what makes every band interval exactly BAND_MINUTES long."
        test_recipe:
          setup: ["one checkpoint"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
          trigger:
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T10:15:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              expect_status: 400
              captures: { align_error: $.data.error_id }
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T10:00:30Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              expect_status: 400
              captures: { seconds_error: $.data.error_id }
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T10:00:00Z", expedited_share_pct: 140, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              expect_status: 400
              captures: { range_error: $.data.error_id }
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T10:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 4.0 }
              as: StaffingPlanner
              expect_status: 400
              captures: { mult_error: $.data.error_id }
          assert:
            - "${align_error} == ERR_INVALID_REQUEST (400) — minute 15 is neither 00 nor 30"
            - "${seconds_error} == ERR_INVALID_REQUEST (400) — a non-zero seconds component is rejected even on an aligned minute"
            - "${range_error} == ERR_INVALID_REQUEST (400) — expedited_share_pct 140 is outside 0..100"
            - "${mult_error} == ERR_INVALID_REQUEST (400) — seasonal_multiplier 4.0 is outside 0.50..3.00"
            - "GET /time-bands?checkpoint_id=${cp_id} returns an empty list after all four rejections"

      - name: show_up_curve_is_immutable_with_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.ShowUpCurve
          - entities.WaitTimeObservation
        distinguishing_aspect: "ShowUpCurve and WaitTimeObservation are the scaffold's only common_fields: false entities. §1.5 declares no PATCH and no action endpoint for either, so a historical curve or a recorded sample can never be edited — which is what makes a stored forecast reproducible."
        test_recipe:
          setup: ["one checkpoint and one show-up curve"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - &c_curve
              call: "POST /show-up-curves"
              payload:
                name: "Late Domestic 30-0"
                carrier_type: "DOMESTIC"
                season_code: "PEAK"
                window_start_minutes_before: 30
                window_end_minutes_before: 0
                buckets:
                  - { minutes_before_start: 30, minutes_before_end: 0, share_pct: 100 }
              as: PlatformAdmin
              captures: { curve_id: $.data.id }
          trigger:
            - call: "GET /show-up-curves/${curve_id}"
              payload: {}
              as: StaffingPlanner
              captures: { curve_name: $.data.name, curve_window: $.data.window_start_minutes_before }
          assert:
            - "${curve_name} == \"Late Domestic 30-0\" and ${curve_window} == 30"
            - "the ShowUpCurve response carries no version field and no updated_at field — §1.1 declares common_fields: false"
            - "§1.5 declares exactly two ShowUpCurve endpoints (POST /show-up-curves and GET /show-up-curves/{show_up_curve_id}): there is no PATCH, no DELETE and no action endpoint"
            - "the same holds for WaitTimeObservation: only POST /checkpoints/{checkpoint_id}/wait-observations, GET /wait-observations/{wait_time_observation_id} and GET /wait-observations exist"

      - name: lane_create_with_unknown_checkpoint_returns_checkpoint_not_found
        claim_type: foreign_key_integrity
        grounds:
          - complexity_profile.entity_topology
          - errors[ERR_CHECKPOINT_NOT_FOUND]
          - errors[ERR_SHOW_UP_CURVE_NOT_FOUND]
        distinguishing_aspect: "The topology is flat, so every parent link travels in the request body and must be validated there. The fixture proves the body-borne FK is checked on two different entities and that a valid-looking id belonging to the WRONG entity type is still a 404."
        test_recipe:
          setup: ["one checkpoint and one show-up curve"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_curve
          trigger:
            - call: "POST /lanes"
              payload: { checkpoint_id: "cp_does_not_exist", lane_type: "STANDARD", position_index: 1, required_officer_count: 1, max_concurrent_officers: 2, secondary_positions: 0 }
              as: CheckpointManager
              expect_status: 404
              captures: { bad_parent_error: $.data.error_id }
            - call: "POST /flight-schedule-entries"
              payload: { checkpoint_id: "${cp_id}", show_up_curve_id: "curve_does_not_exist", flight_number: "AA100", scheduled_departure_utc: "2026-09-10T10:30:00Z", seats_sold: 10, load_factor_pct: 100, carrier_type: "DOMESTIC" }
              as: StaffingPlanner
              expect_status: 404
              captures: { bad_curve_error: $.data.error_id }
            - call: "POST /flight-schedule-entries"
              payload: { checkpoint_id: "${cp_id}", show_up_curve_id: "${cp_id}", flight_number: "AA101", scheduled_departure_utc: "2026-09-10T10:30:00Z", seats_sold: 10, load_factor_pct: 100, carrier_type: "DOMESTIC" }
              as: StaffingPlanner
              expect_status: 404
              captures: { wrong_type_error: $.data.error_id }
          assert:
            - "${bad_parent_error} == ERR_CHECKPOINT_NOT_FOUND (404)"
            - "${bad_curve_error} == ERR_SHOW_UP_CURVE_NOT_FOUND (404)"
            - "${wrong_type_error} == ERR_SHOW_UP_CURVE_NOT_FOUND (404) — a checkpoint id in the show_up_curve_id slot resolves against the ShowUpCurve collection only"
            - "GET /flight-schedule-entries?checkpoint_id=${cp_id} returns an empty list"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: lane_starts_closed_with_equipment_state_out_of_service
        claim_type: initial_state
        grounds:
          - state_machines.Lane.initial_state
          - entities.Lane.fields.equipment_state
        distinguishing_aspect: "A fresh lane is CLOSED and its derived equipment_state is OUT_OF_SERVICE — not SERVICEABLE — because 'no EquipmentUnit rows at all' and 'a required type is OUT_OF_SERVICE' are deliberately the same derived outcome. Only after all three required types exist does it read SERVICEABLE."
        test_recipe:
          setup: ["one checkpoint"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
          trigger:
            - &c_lane
              call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "STANDARD", position_index: 1, required_officer_count: 1, max_concurrent_officers: 2, secondary_positions: 1 }
              as: CheckpointManager
              captures: { lane_id: $.data.id, lane_state0: $.data.lane_state, eq_state0: $.data.equipment_state }
            - &c_eq_wtmd
              call: "POST /equipment-units"
              payload: { lane_id: "${lane_id}", equipment_type: "WTMD", serial_number: "WT-1", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
              captures: { eq_wtmd_id: $.data.id, eq_wtmd_state: $.data.state }
            - call: "GET /lanes/${lane_id}"
              payload: {}
              as: CheckpointManager
              captures: { eq_state_partial: $.data.equipment_state }
            - &c_eq_xray
              call: "POST /equipment-units"
              payload: { lane_id: "${lane_id}", equipment_type: "AT_XRAY", serial_number: "XR-1", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
              captures: { eq_xray_id: $.data.id }
            - &c_eq_ai
              call: "POST /equipment-units"
              payload: { lane_id: "${lane_id}", equipment_type: "ADVANCED_IMAGING", serial_number: "AI-1", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
              captures: { eq_ai_id: $.data.id }
            - call: "GET /lanes/${lane_id}"
              payload: {}
              as: CheckpointManager
              captures: { eq_state_full: $.data.equipment_state }
          assert:
            - "${lane_state0} == CLOSED (Lane.initial_state) and ${eq_state0} == OUT_OF_SERVICE with zero equipment rows"
            - "${eq_wtmd_state} == SERVICEABLE — EquipmentUnit.initial_state, even though its lane still reads OUT_OF_SERVICE"
            - "${eq_state_partial} == OUT_OF_SERVICE — WTMD alone does not satisfy REQUIRED_EQUIPMENT_BY_LANE_TYPE.STANDARD = [WTMD, AT_XRAY, ADVANCED_IMAGING]"
            - "${eq_state_full} == SERVICEABLE once all three required types exist"
            - "paused_reason_code and opened_at_utc are null throughout; Checkpoint.available_lane_positions stayed 6 — creating a lane reserves nothing"

      - name: officer_duty_status_valid_transition_off_duty_to_on_duty
        claim_type: valid_transition
        grounds:
          - state_machines.Officer
          - endpoints.POST_officers_duty-status
        distinguishing_aspect: "The duty-status action is the only caller-driven edge on the Officer machine (ON_BREAK edges are system-driven from the break axis), and each accepted edge bumps Officer.version — the value the SurgeDetail OCC field is compared against."
        test_recipe:
          setup: ["one officer"]
          setup_api_calls:
            - *c_clock08
            - *c_officer
          trigger:
            - &c_on_duty
              call: "POST /officers/${off_id}/duty-status"
              payload: { duty_status: "ON_DUTY" }
              as: CheckpointManager
              captures: { duty_after: $.data.duty_status, ver_after: $.data.version }
            - call: "POST /officers/${off_id}/duty-status"
              payload: { duty_status: "OFF_DUTY" }
              as: CheckpointManager
              captures: { duty_back: $.data.duty_status, ver_back: $.data.version }
          assert:
            - "${duty_after} == ON_DUTY with ${ver_after} == 2 — the create left version 1"
            - "${duty_back} == OFF_DUTY with ${ver_back} == 3; the OFF_DUTY edge is permitted because the officer holds no CHECKED_IN or REASSIGN_PENDING assignment"
            - "committed_duty_minutes stayed 0 across both edges — duty status is not the ledger"

      - name: officer_separated_is_terminal_and_rejects_further_duty_status
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Officer.terminal_states
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "SEPARATED is terminal, so even the edge that would normally be legal from OFF_DUTY (OFF_DUTY -> ON_DUTY) must fail, and re-sending SEPARATED must fail too rather than being a silent no-op."
        test_recipe:
          setup: ["one officer moved to SEPARATED from OFF_DUTY"]
          setup_api_calls:
            - *c_clock08
            - *c_officer
            - call: "POST /officers/${off_id}/duty-status"
              payload: { duty_status: "SEPARATED" }
              as: CheckpointManager
              captures: { sep_state: $.data.duty_status }
          trigger:
            - call: "POST /officers/${off_id}/duty-status"
              payload: { duty_status: "ON_DUTY" }
              as: CheckpointManager
              expect_status: 409
              captures: { term_error: $.data.error_id }
            - call: "POST /officers/${off_id}/duty-status"
              payload: { duty_status: "SEPARATED" }
              as: CheckpointManager
              expect_status: 409
              captures: { repeat_error: $.data.error_id }
          assert:
            - "${sep_state} == SEPARATED and the setup edge was allowed only because the officer held no SCHEDULED/CHECKED_IN/REASSIGN_PENDING assignment and no REQUESTED/APPROVED detail"
            - "${term_error} == ERR_INVALID_STATE_TRANSITION (409) — SEPARATED has no outbound edges"
            - "${repeat_error} == ERR_INVALID_STATE_TRANSITION (409) — re-asserting the terminal state is an error, not idempotent success"
            - "Officer.version is unchanged by both rejected calls"

      - name: second_open_on_an_already_open_lane_returns_invalid_state_transition
        claim_type: idempotency
        grounds:
          - state_machines.Lane
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "POST /lanes/{lane_id}/open is not idempotent by design: the second call must be rejected, because a silent no-op would decrement Checkpoint.available_lane_positions twice and break invariant lane_position_conservation."
        test_recipe:
          setup: ["one open STANDARD lane on a fully equipped checkpoint"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - &c_open
              call: "POST /lanes/${lane_id}/open"
              payload: {}
              as: CheckpointManager
              captures: { open_state: $.data.lane_state, open_at: $.data.opened_at_utc }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { avail_after_open: $.data.available_lane_positions, open_count: $.data.open_lane_count }
          trigger:
            - call: "POST /lanes/${lane_id}/open"
              payload: {}
              as: CheckpointManager
              expect_status: 409
              captures: { dup_open_error: $.data.error_id }
            - call: "GET /checkpoints/${cp_id}"
