              payload: {}
              as: DispositionOfficer
              as_user_id: "disp-1"
            - call: "POST /land-bank/disposition-applications/${app_id}/recommend"
              payload: { recommendation_memo: "Sole responsive RFP offer." }
              as: DispositionOfficer
              as_user_id: "disp-2"
            - call: "POST /land-bank/disposition-applications/${app_id}/board-decision"
              payload: { decision: "APPROVE", resolution_no: "R-2026-202" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/development-agreements"
              payload: { application_id: "${app_id}", performance_deadline: "2026-09-01T00:00:00Z", milestone_count: 2, reverter_clause_active: true, abatement_years: 3, discharge_mode: "STATUTORY", projected_improved_value_cents: 10000000 }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { ag_id: $.data.id }
            - call: "GET /land-bank/inventory-summary"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { inv2: $.data.inventory_area_sqft, conv2: $.data.conveyed_area_sqft, count2: $.data.inventory_property_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: InventoryManager
              as_user_id: "inv-1"
            - call: "POST /land-bank/compliance-sweeps"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: InventoryManager
              as_user_id: "inv-1"
          trigger:
            - call: "POST /land-bank/compliance-sweeps"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { restored_sqft: $.data.restored_inventory_sqft }
            - call: "GET /land-bank/inventory-summary"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { inv3: $.data.inventory_area_sqft, conv3: $.data.conveyed_area_sqft, count3: $.data.inventory_property_count }
          assert:
            - "${inv1} == 8500 and ${conv1} == 0 and ${count1} == 1  # LISTED counts as inventory"
            - "${inv2} == 0 and ${conv2} == 8500 and ${count2} == 0  # conveyance moves the whole parcel across, not part of it"
            - "${restored_sqft} == 8500"
            - "${inv3} == 8500 and ${conv3} == 0 and ${count3} == 1  # REVERTED counts as inventory again"
            - "${inv1} + ${conv1} == 8500 and ${inv2} + ${conv2} == 8500 and ${inv3} + ${conv3} == 8500  # conserved at every observation"
            - "DevelopmentAgreement.${ag_id}.status == REVERTED and Property.${p_id}.lot_area_sqft == 8500"
