          trigger:
            - { call: "POST /pyro/magazines/${mag}/batches", payload: { product_name: "Cake B", un_number: "UN0335", shell_diameter_in: 2, quantity_units: 40, new_per_unit_lbs: 1.00, lot_number: "LB" }, as: Operator, as_user_id: "${op}", captures: { bb: $.data.id } }
            - { call: "POST /pyro/magazines/${mag}/batches", payload: { product_name: "Cake C", un_number: "UN0335", shell_diameter_in: 2, quantity_units: 1, new_per_unit_lbs: 0.01, lot_number: "LC" }, as: Operator, as_user_id: "${op}", captures: { err: $.data.error_id } }
