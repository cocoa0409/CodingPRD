            - "An empty submission for period 2026-01-01..2026-06-30 (deadline 2026-12-31) was created while the posture was still OPEN, so it is DRAFT."
            - "The clock then moved to 2026-09-20, making both open cases LATE: overdue_backlog_count == 2 froze the registry and pushed the submission to HOLD with pre_hold_state DRAFT."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Fairhaven Cancer Program", coc_program_id: "COC-14557", annual_analytic_caseload: 620, reference_year: 2018, timeliness_standard_days: 180 }
