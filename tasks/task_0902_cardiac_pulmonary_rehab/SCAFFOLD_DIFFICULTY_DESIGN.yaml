            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 18000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 300 }, as: RehabClinician, as_user_id: "${clinA}", captures: { base_out: $.data.id } }
            - { call: "POST /rehab/outcomes/${base_out}/finalize", payload: {}, as: RehabClinician, as_user_id: "${clinA}" }
            - { call: "POST /rehab/programs/${prog}/activate", payload: {}, as: RehabCoordinator, captures: { pv1: $.data.version } }
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clinA}", station_id: "${st}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T09:00:00Z", scheduled_end: "2026-05-04T10:00:00Z", expected_program_version: "${pv1}" }, as: RehabCoordinator, captures: { s1: $.data.id } }
            - { call: "GET /rehab/programs/${prog}", payload: {}, as: RehabCoordinator, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clinB}", station_id: "${st}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T09:30:00Z", scheduled_end: "2026-05-04T10:30:00Z", expected_program_version: "${pv2}" }, as: RehabCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger response data.error_id == ERR_STATION_OVERLAP"
            - "trigger HTTP status == 409"

      - name: clinician_turnover_buffer_overlap
        grounds:
          - validations[priority=9]
          - entities.Clinician.fields.full_name
          - errors[ERR_CLINICIAN_UNAVAILABLE]
        distinguishing_aspect: "On Clinician: buffered interval semantics — a session starting only 10 minutes after the same clinician's prior session ends is rejected because it violates CLINICIAN_TURNOVER_BUFFER_MINUTES=15, even on a DIFFERENT station (distinct interval arithmetic and resource from station half-open overlap)."
        test_recipe:
          setup:
            - "ACTIVE MODERATE program; two TELEMETRY stations; clinician A has a SCHEDULED session [09:00,10:00) on station 1"
          setup_api_calls:
