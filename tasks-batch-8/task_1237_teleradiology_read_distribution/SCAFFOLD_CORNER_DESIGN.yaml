            - { call: "POST /telerad/assignments/${asg2}/accept", payload: {}, as: Radiologist, as_user_id: "${rad2}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg2}", report_type: "FINAL", findings_text: "f2", impression_text: "i2", discrepancy_grade: 2 }, as: Radiologist, as_user_id: "${rad2}", captures: { rep2: $.data.id } }
            - { call: "POST /telerad/reports/${rep2}/sign", payload: {}, as: Radiologist, as_user_id: "${rad2}" }
