# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Enumerative walk of claim-extraction-guide sections against §1.1–§1.7.
# Corners already exercised by §1.8 are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: entity_event_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.MutualAidEvent.fields.status"
          - "entities.MutualAidEvent.fields.intake_posture"
          - "entities.MutualAidEvent.fields.open_request_count"
        distinguishing_aspect: "Fresh event: system fields status=OPEN, intake_posture=ACCEPTING, open_request_count=0, version=1 without any client input for them."
        test_recipe:
          setup: ["One host company exists"]
          setup_api_calls:
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
          trigger:
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
          assert:
            - "MutualAidEvent.${ev_id}.status == OPEN"
            - "MutualAidEvent.${ev_id}.intake_posture == ACCEPTING"
            - "MutualAidEvent.${ev_id}.open_request_count == 0"
            - "MutualAidEvent.${ev_id}.version == 1"

      - name: entity_company_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - "entities.UtilityCompany.fields.company_code"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /utility-companies without company_code is rejected; the other three required fields are present."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "No Code Co", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: entity_company_duplicate_code_rejected
        claim_type: type_constraints
        grounds:
          - "entities.UtilityCompany.fields.company_code"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "company_code uniqueness: second registration with the same code fails even though every other field differs."
        test_recipe:
          setup: ["One company with company_code HST exists"]
          setup_api_calls:
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Copycat", company_code: "HST", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: entity_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but unknown crew id returns 404 ERR_NOT_FOUND (not 400, not empty object)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /mutual-aid/crews/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: entity_crew_computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.Crew.fields.roster_size"
          - "entities.Crew.fields.equipment_daily_total_cents"
        distinguishing_aspect: "Client-supplied roster_size is ignored; server computes roster_size=2 and equipment_daily_total_cents=45000 from the roster/equipment arrays."
        test_recipe:
          setup: ["Event ACTIVE; ACCEPTED request to RSP (schedule published)"]
          setup_api_calls:
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12000 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { sch_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${sch_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rsp_id}", requested_crews: [{ crew_type: "LINE", count: 2 }], required_minimum_crews: 1, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/submit", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/accept", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
          trigger:
            - { call: "POST /mutual-aid/crews", payload: { request_id: "${req_id}", crew_type: "LINE", home_base: "Depot 7", roster: [{ member_ref: "M1", member_role: "foreman" }, { member_ref: "M2", member_role: "lineman" }], equipment_units: [{ unit_type: "bucket_truck", unit_ref: "BT-1", daily_rate_cents: 20000 }, { unit_type: "digger", unit_ref: "DG-2", daily_rate_cents: 25000 }], roster_size: 99 }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { crew_id: "$.data.id", rs: "$.data.roster_size", eq: "$.data.equipment_daily_total_cents" } }
          assert:
            - "Crew.${crew_id}.roster_size == 2 (capture rs; client-sent 99 ignored)"
            - "Crew.${crew_id}.equipment_daily_total_cents == 45000 (capture eq)"
            - "Crew.${crew_id}.mobility_status == COMMITTED and readiness_status == AWAITING_BRIEFING"

      - name: entity_timesheet_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - "entities.TimeSheet.fields.day_classification"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "day_classification 'HOLIDAY' is not in {TRAVEL, WORK, STANDBY, REST} — rejected before any state change."
        test_recipe:
          setup: ["Crew committed under an ACCEPTED request"]
          setup_api_calls:
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12000 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { sch_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${sch_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rsp_id}", requested_crews: [{ crew_type: "LINE", count: 2 }], required_minimum_crews: 1, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/submit", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/accept", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/crews", payload: { request_id: "${req_id}", crew_type: "LINE", home_base: "Depot 7", roster: [{ member_ref: "M1", member_role: "foreman" }], equipment_units: [] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { crew_id: "$.data.id" } }
          trigger:
            - { call: "POST /mutual-aid/timesheets", payload: { crew_id: "${crew_id}", work_date: "2026-05-04", day_classification: "HOLIDAY", reported_work_minutes: 480 }, as: CrewSupervisor, as_user_id: "${crew_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: entity_list_envelope_pagination_fields
        claim_type: listing
        grounds:
          - "response_envelope.pagination_fields"
          - "endpoints[GET /mutual-aid/crews]"
        distinguishing_aspect: "List responses carry limit/offset/total_count/has_more; with two crews and default pagination total_count == 2 and has_more == false."
        test_recipe:
          setup: ["ACCEPTED request with two committed crews"]
          setup_api_calls:
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12000 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { sch_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${sch_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rsp_id}", requested_crews: [{ crew_type: "LINE", count: 2 }], required_minimum_crews: 1, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/submit", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/accept", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/crews", payload: { request_id: "${req_id}", crew_type: "LINE", home_base: "Depot 7", roster: [{ member_ref: "M1", member_role: "foreman" }], equipment_units: [] }, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/crews", payload: { request_id: "${req_id}", crew_type: "TREE", home_base: "Depot 9", roster: [{ member_ref: "M2", member_role: "foreman" }], equipment_units: [] }, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
          trigger:
            - { call: "GET /mutual-aid/crews?request_id=${req_id}", payload: {}, as: ProgramAdmin }
          assert:
            - "response contains pagination fields limit/offset/total_count/has_more with total_count == 2 and has_more == false"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: sm_request_initial_state_draft
        claim_type: initial_state
        grounds:
          - "state_machines.AssistanceRequest"
        distinguishing_aspect: "A newly created request sits in DRAFT with amendment_round == 0 and no counter_terms; it does not count toward open_request_count until submitted."
        test_recipe:
          setup: ["Event OPEN (fresh, not activated)"]
          setup_api_calls:
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
          trigger:
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rsp_id}", requested_crews: [{ crew_type: "LINE", count: 2 }], required_minimum_crews: 1, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { req_id: "$.data.id", st: "$.data.status", round: "$.data.amendment_round" } }
          assert:
            - "AssistanceRequest.${req_id}.status == DRAFT (capture st)"
            - "AssistanceRequest.${req_id}.amendment_round == 0 (capture round)"
            - "AssistanceRequest.${req_id}.counter_terms == null"

      - name: sm_declined_request_cannot_be_accepted
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.AssistanceRequest"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "DECLINED is terminal: accept after decline is rejected even though the schedule precondition would pass."
        test_recipe:
          setup: ["Request DECLINED (schedule published for the responding utility)"]
          setup_api_calls:
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12000 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { sch_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${sch_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rsp_id}", requested_crews: [{ crew_type: "LINE", count: 2 }], required_minimum_crews: 1, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/submit", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/decline", payload: { reason: "mutual fatigue" }, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
          trigger:
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/accept", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (http 409)"

      - name: sm_release_before_arrival_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Crew"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "release on a COMMITTED (never ARRIVED) crew is rejected; only ARRIVED -> DEMOBILIZING exists."
        test_recipe:
          setup: ["ACCEPTED request with one COMMITTED crew"]
          setup_api_calls:
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12000 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { sch_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${sch_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rsp_id}", requested_crews: [{ crew_type: "LINE", count: 2 }], required_minimum_crews: 1, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/submit", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/accept", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/crews", payload: { request_id: "${req_id}", crew_type: "LINE", home_base: "Depot 7", roster: [{ member_ref: "M1", member_role: "foreman" }], equipment_units: [] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { crew_id: "$.data.id" } }
          trigger:
            - { call: "POST /mutual-aid/crews/${crew_id}/release", payload: {}, as: HostCoordinator, as_user_id: "${host_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "Crew.${crew_id}.mobility_status == COMMITTED (unchanged)"

      - name: sm_event_close_blocked_without_aar
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.MutualAidEvent.DEMOBILIZING_to_CLOSED"
          - "errors[ERR_EVENT_CLOSE_BLOCKED]"
        distinguishing_aspect: "Close is rejected when no ACCEPTED after-action report exists — cross-entity gate MutualAidEvent -> AfterActionReport."
        test_recipe:
          setup: ["Event DEMOBILIZING; no after-action report created"]
          setup_api_calls:
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
