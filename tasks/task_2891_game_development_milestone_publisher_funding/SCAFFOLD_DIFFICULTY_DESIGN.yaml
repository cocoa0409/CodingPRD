# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2891_game_development_milestone_publisher_funding
# 9 rule_ids x 2 instances = 18 instances. Every literal in `assert:` was
# computed against the §1.3 formulas and their constants before being written.
# Logical clock default: 2026-08-01T00:00:00Z (no clock call = that instant).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_provisional_period_basis_vs_final_life_to_date_basis
        grounds:
          - calculations.royalty_settlement
          - entities.RoyaltyStatement.fields.provisional_royalty_payable_cents
          - entities.RoyaltyStatement.fields.final_royalty_payable_cents
          - entities.DevelopmentAgreement.fields.unrecouped_advance_cents
          - entities.DevelopmentAgreement.fields.royalties_paid_to_date_cents
          - state_machines.RoyaltyStatement.DRAFT_to_FINALIZED
          - validations[priority=64]
        distinguishing_aspect: |
          On one identical statement the PROVISIONAL variant pro-rates the royalty across revenue
          lines and rounds PER LINE (209001 cents) while the FINAL variant rounds ONCE on the
          cumulative royalty base (209000 cents), so the two variants of the same calculation
          differ by exactly 1 cent on the same input data.
        test_recipe:
          setup:
            - "Studio + publisher + one REVIEW and one FINANCE publisher user exist."
            - "Agreement Aurora Drift: advance_total_cents 12000000, royalty_rate_bps 2500, platform_fee_bps 3000, recoupable_cost_cap_bps 2000, ship_date_original 2027-03-31, status ACTIVE."
            - "Milestones M1 ALPHA 3600000, M2 BETA 5400000 (depends on M1), M3 GOLD 3000000 (depends on M2); committed_cents == funding_pool_cents == 12000000."
            - "M1 accepted on build 1 and its payment authorized, so advance_disbursed_cents == 3420000 and unrecouped_advance_cents == 3420000."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Rae Reviewer", function: "REVIEW" }
              as: PlatformAdmin
              captures: { reviewer_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Aurora Drift", advance_total_cents: 12000000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 500000, ship_date_original: "2027-03-31", recoupable_cost_cap_bps: 2000, platform_fee_bps: 3000 }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", gate_profile: "ALPHA", funded_amount_cents: 3600000, contractor_budget_cents: 800000, acceptance_criteria: ["Core loop playable", "Two biomes complete", "Save and load"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 2, title: "Beta", gate_profile: "BETA", funded_amount_cents: 5400000, contractor_budget_cents: 600000, acceptance_criteria: ["All biomes complete", "Online co-op", "Localization pass"], depends_on_milestone_id: "${m1_id}" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m2_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 3, title: "Gold", gate_profile: "GOLD", funded_amount_cents: 3000000, contractor_budget_cents: 400000, acceptance_criteria: ["Zero blockers", "Cert submission ready"], depends_on_milestone_id: "${m2_id}" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m3_id: $.data.id }
            - call: "POST /development-agreements/${agreement_id}/activate"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "POST /milestone-builds"
              payload: { milestone_id: "${m1_id}", build_number: 1, feature_completeness_pct: 92.00, crash_free_sessions_pct: 96.50, content_completeness_pct: 61.00, known_blocker_count: 3, release_notes: "Alpha candidate 1" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /publisher-reviews"
              payload: { build_id: "${b1_id}", verdict: "ACCEPTED", review_window_start_at: "2026-08-01T09:00:00.000Z", review_window_end_at: "2026-08-01T13:00:00.000Z", notes: "Alpha accepted" }
              as: PublisherReviewer
              as_user_id: "${reviewer_id}"
            - call: "GET /milestone-payments"
              payload: { milestone_id: "${m1_id}" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { p1_id: "$.data[0].id" }
            - call: "POST /milestone-payments/${p1_id}/authorize"
              payload: { memo: "M1 disbursement" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "GET /development-agreements/${agreement_id}"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /royalty-statements"
              payload: { agreement_id: "${agreement_id}", period_label: "2027-Q3", revenue_lines: [{ platform_code: "PC", gross_cents: 5000000, returns_cents: 125000 }, { platform_code: "CONSOLE", gross_cents: 2725000, returns_cents: 0 }], recoupable_cost_cents: 1200000, expected_agreement_version: "${agr_v}" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /royalty-statements/${s1_id}/finalize"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
          assert:
            - "MilestonePayment.${p1_id}.net_amount_cents == 3420000 (holdback_cents 180000 at 500 bps on gross 3600000)"
            - "RoyaltyStatement.${s1_id}.distributable_total_cents == 5320000"
            - "RoyaltyStatement.${s1_id}.cost_deduction_cents == 1064000 (claim 1200000 capped at 20% of 5320000)"
            - "RoyaltyStatement.${s1_id}.recoupment_base_cents == 4256000"
            - "RoyaltyStatement.${s1_id}.recoup_applied_cents == 3420000"
            - "RoyaltyStatement.${s1_id}.royalty_base_cents == 836000"
            - "RoyaltyStatement.${s1_id}.provisional_royalty_payable_cents == 209001"
            - "RoyaltyStatement.${s1_id}.final_royalty_payable_cents == 209000"
            - "RoyaltyStatement.${s1_id}.provisional_royalty_payable_cents - RoyaltyStatement.${s1_id}.final_royalty_payable_cents == 1"
            - "RoyaltyStatement.${s1_id}.state == FINALIZED"
            - "DevelopmentAgreement.${agreement_id}.advance_recouped_cents == 3420000"
            - "DevelopmentAgreement.${agreement_id}.unrecouped_advance_cents == 0"
            - "DevelopmentAgreement.${agreement_id}.recoupment_state == RECOUPED"
            - "DevelopmentAgreement.${agreement_id}.royalties_paid_to_date_cents == 209000"

      - name: contractor_budget_committed_basis_vs_incurred_basis
        grounds:
          - calculations.contractor_budget_utilization
          - entities.Milestone.fields.contractor_budget_cents
          - entities.ContractorEngagement.fields.committed_cents
          - entities.ContractorInvoice.fields.amount_cents
          - state_machines.ContractorInvoice.SUBMITTED_to_APPROVED
          - validations[priority=61]
        distinguishing_aspect: |
          In the Milestone/ContractorEngagement domain (not the royalty ledger) the same milestone
          reports committed_basis_cents 800000 and incurred_basis_cents 1000000 at the same instant:
          the COMMITTED variant is capped by the contractor budget while the INCURRED variant is
          capped only by the 125% invoice tolerance, so the incurred figure legally exceeds both the
          committed figure and the budget itself, producing overrun_cents 200000.
        test_recipe:
          setup:
            - "Solo agreement Rift Runner: advance_total_cents 3600000, one ALPHA milestone funded 3600000 with contractor_budget_cents 800000, status ACTIVE, milestone IN_DEVELOPMENT."
            - "One ContractorEngagement VFX-ORBIT with committed_cents 800000 (COMMITTED basis exactly exhausted, available_committed_cents 0), status ACTIVE."
            - "Two invoices of that engagement approved: 600000 and 400000, total 1000000 == 125% of committed_cents (the INVOICE_TOLERANCE_BPS boundary)."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Rae Reviewer", function: "REVIEW" }
              as: PlatformAdmin
              captures: { reviewer_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Rift Runner", advance_total_cents: 3600000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 200000, ship_date_original: "2027-03-31", recoupable_cost_cap_bps: 2000, platform_fee_bps: 3000 }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", gate_profile: "ALPHA", funded_amount_cents: 3600000, contractor_budget_cents: 800000, acceptance_criteria: ["Core loop playable", "Two biomes complete"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /development-agreements/${agreement_id}/activate"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "POST /contractor-engagements"
              payload: { milestone_id: "${m1_id}", vendor_code: "VFX-ORBIT", scope_summary: "Cinematic VFX pass", committed_cents: 800000, start_date: "2026-08-05", end_date: "2026-09-30" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /contractor-invoices"
              payload: { engagement_id: "${e1_id}", invoice_number: "ORB-001", amount_cents: 600000, period_end_date: "2026-08-31", description: "August VFX" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { i1_id: $.data.id }
            - call: "POST /contractor-invoices/${i1_id}/decide"
              payload: { decision: "APPROVE" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "POST /contractor-invoices"
              payload: { engagement_id: "${e1_id}", invoice_number: "ORB-002", amount_cents: 400000, period_end_date: "2026-09-30", description: "September VFX" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { i2_id: $.data.id }
            - call: "POST /contractor-invoices/${i2_id}/decide"
              payload: { decision: "APPROVE" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
          trigger:
            - call: "GET /milestones/${m1_id}/budget-summary"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
          assert:
            - "budget-summary.committed_basis_cents == 800000"
            - "budget-summary.incurred_basis_cents == 1000000"
            - "budget-summary.available_committed_cents == 0"
            - "budget-summary.overrun_cents == 200000"
            - "budget-summary.contractor_budget_cents == 800000"
            - "ContractorEngagement.${e1_id}.approved_invoice_total_cents == 1000000"
            - "ContractorEngagement.${e1_id}.status == ACTIVE"

  - rule_id: combinatorial_formula
    instances:
      - name: gate_threshold_shape_selected_by_profile_status_relief_and_stability_combination
        mode: a
        grounds:
          - calculations.build_gate_evaluation
          - calculations.build_gate_evaluation.constants.GATE_THRESHOLDS
          - calculations.build_gate_evaluation.constants.STABILITY_SURPLUS_PCT
          - calculations.build_gate_evaluation.constants.FEATURE_RELAXATION_PCT
          - calculations.build_gate_evaluation.constants.CURE_CONTENT_UPLIFT_PCT
          - entities.Milestone.fields.content_threshold_relief_pct
          - state_machines.Milestone.CURE_PENDING_to_UNDER_REVIEW
        distinguishing_aspect: |
          Byte-identical build payloads (88.00 / 98.50 / 75.00 / 5 blockers) are accepted on one
          milestone and rejected on another in the same agreement, because the effective thresholds
          are assembled from a four-way combination (gate_profile BETA x milestone.status
          CURE_PENDING vs IN_DEVELOPMENT x content_threshold_relief_pct 10.00 vs 0.00 x stability
          surplus present): 90.00/98.00/75.00 for M1 versus 88.00/98.00/80.00 for M2. An
          implementation that hardcodes the profile row, or applies relief and the cure uplift
          unconditionally, flips one of the two outcomes.
        test_recipe:
          setup:
            - "Agreement Nova Tide: advance_total_cents 6000000, ship_date_original 2027-06-30, ACTIVE."
            - "M1 BETA funded 5400000 (3 acceptance criteria) and M2 BETA funded 600000, neither with depends_on, so both enter IN_DEVELOPMENT at activation."
            - "M1 build 1 (95.00 / 98.00 / 85.00 / 2) passes the unmodified BETA gate and receives a CONDITIONAL review with conditions [0, 2] and cure_days 14, so M1 is CURE_PENDING with cure_deadline_at 2026-08-15T00:00:00.000Z."
            - "An approved FEATURE_CUT change order on M1 carries content_threshold_relief_pct 10.00 and ship_date_delta_days 0."
            - "Logical clock left at its 2026-08-01T00:00:00Z default, so the cure window is still open."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Kelpline Interactive", contact_email: "dev@kelpline.example", country_code: "CA" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Rae Reviewer", function: "REVIEW" }
              as: PlatformAdmin
              captures: { reviewer_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Nova Tide", advance_total_cents: 6000000, royalty_rate_bps: 2000, live_ops_quarterly_funding_cents: 300000, ship_date_original: "2027-06-30", recoupable_cost_cap_bps: 2000, platform_fee_bps: 3000 }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Beta Main", gate_profile: "BETA", funded_amount_cents: 5400000, contractor_budget_cents: 600000, acceptance_criteria: ["Online co-op stable", "All biomes complete", "Localization pass"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 2, title: "Beta Companion App", gate_profile: "BETA", funded_amount_cents: 600000, contractor_budget_cents: 0, acceptance_criteria: ["Companion app parity", "Push notifications"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m2_id: $.data.id }
            - call: "POST /development-agreements/${agreement_id}/activate"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "POST /milestone-builds"
              payload: { milestone_id: "${m1_id}", build_number: 1, feature_completeness_pct: 95.00, crash_free_sessions_pct: 98.00, content_completeness_pct: 85.00, known_blocker_count: 2, release_notes: "Beta candidate 1" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /publisher-reviews"
              payload: { build_id: "${b1_id}", verdict: "CONDITIONAL", review_window_start_at: "2026-08-01T09:00:00.000Z", review_window_end_at: "2026-08-01T13:00:00.000Z", conditions: [0, 2], cure_days: 14, notes: "Co-op desync and localization gaps" }
              as: PublisherReviewer
              as_user_id: "${reviewer_id}"
              captures: { r1_id: $.data.id }
            - call: "GET /development-agreements/${agreement_id}"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agr_v: $.data.version }
            - call: "POST /change-orders"
              payload: { agreement_id: "${agreement_id}", target_milestone_id: "${m1_id}", order_type: "FEATURE_CUT", requested_amount_cents: 400000, ship_date_delta_days: 0, rationale: "Cut the second biome to protect the ship date", expected_agreement_version: "${agr_v}", content_threshold_relief_pct: 10.00 }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { co1_id: $.data.id }
            - call: "POST /change-orders/${co1_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Scope reduction accepted" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
          trigger:
            - call: "POST /milestone-builds"
              payload: { milestone_id: "${m1_id}", build_number: 2, feature_completeness_pct: 88.00, crash_free_sessions_pct: 98.50, content_completeness_pct: 75.00, known_blocker_count: 5, addressed_condition_indexes: [0, 2], release_notes: "Cure resubmission" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /milestone-builds"
              payload: { milestone_id: "${m2_id}", build_number: 1, feature_completeness_pct: 88.00, crash_free_sessions_pct: 98.50, content_completeness_pct: 75.00, known_blocker_count: 5, release_notes: "Identical numbers, different milestone" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { blocked_error_id: "$.data.error_id" }
          assert:
            - "Milestone.${m1_id}.content_threshold_relief_pct == 10.00 and Milestone.${m1_id}.uplift_cents == -400000"
            - "Milestone.${m1_id}.cure_count == 1 and Milestone.${m1_id}.cure_deadline_at was 2026-08-15T00:00:00.000Z before the resubmission"
            - "trigger call 1 -> 201; MilestoneBuild.${b2_id}.gate_state == PASSED"
            - "MilestoneBuild.${b2_id}.readiness_score == 89.08"
            - "Milestone.${m1_id}.status == UNDER_REVIEW, latest_build_number == 2, open_condition_indexes == [], cure_deadline_at == null"
            - "MilestoneBuild.${b1_id}.gate_state == SUPERSEDED"
            - "trigger call 2 -> 422 ERR_BUILD_GATE_NOT_MET (effective content threshold 80.00, no relief and no cure uplift)"
            - "Milestone.${m2_id}.status == IN_DEVELOPMENT and Milestone.${m2_id}.latest_build_number == 0"
            - "GET /milestones/${m2_id}/builds returns an empty list (the rejected build is not persisted)"

      - name: holdback_tier_selected_after_overrun_deduction_pinned_step_order
        mode: c
        grounds:
          - calculations.payment_disbursement
          - calculations.payment_disbursement.constants.HOLDBACK_TIER_1_MAX_CENTS
          - calculations.contractor_budget_utilization.variants.INCURRED_BASIS
          - calculations.contractor_budget_utilization.constants.INVOICE_TOLERANCE_BPS
          - state_machines.MilestonePayment.PENDING_AUTHORIZATION_to_AUTHORIZED
        distinguishing_aspect: |
          The step order is observable: scheduled_amount_cents 2600000 is above the tier-1 ceiling
          of 2500000, but the contractor overrun of 140000 is subtracted FIRST, so the tier is read
          from gross 2460000 and lands on 0 bps -> holdback_cents 0 and net_amount_cents 2460000.
          Selecting the tier from scheduled_amount_cents (or deducting the overrun after the
          holdback) yields 500 bps and holdback_cents 123000, a different persisted payment row.
        test_recipe:
          setup:
            - "Agreement Tidewalker: advance_total_cents 2600000, one ALPHA milestone funded 2600000 with contractor_budget_cents 560000, ACTIVE."
            - "One engagement AUDIO-KELP committed 560000 (born ACTIVE on the IN_DEVELOPMENT milestone)."
            - "Two approved invoices 560000 + 140000 = 700000, exactly 125% of committed_cents, so incurred_basis_cents 700000 and overrun_cents 140000."
            - "Build 1 (75.00 / 96.00 / 60.00 / 5) clears the ALPHA gate and is ACCEPTED, minting one PENDING_AUTHORIZATION payment with scheduled_amount_cents 2600000."
            - "The authorizing FINANCE user is not the accepting reviewer, so segregation of duties is satisfied."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Tidewalker Games", contact_email: "dev@tidewalker.example", country_code: "PL" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Rae Reviewer", function: "REVIEW" }
              as: PlatformAdmin
              captures: { reviewer_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Tidewalker", advance_total_cents: 2600000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 100000, ship_date_original: "2027-03-31", recoupable_cost_cap_bps: 2000, platform_fee_bps: 3000 }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", gate_profile: "ALPHA", funded_amount_cents: 2600000, contractor_budget_cents: 560000, acceptance_criteria: ["Core loop playable", "Audio pass"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /development-agreements/${agreement_id}/activate"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "POST /contractor-engagements"
              payload: { milestone_id: "${m1_id}", vendor_code: "AUDIO-KELP", scope_summary: "Adaptive music and SFX", committed_cents: 560000, start_date: "2026-08-05", end_date: "2026-09-15" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /contractor-invoices"
