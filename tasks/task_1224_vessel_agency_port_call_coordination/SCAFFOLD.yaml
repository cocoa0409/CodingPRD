          - "no other ServiceOrder with same resource_unit in {CONFIRMED, IN_PROGRESS} whose buffer-inflated closed interval [window_start - 45m, window_end + 45m] intersects this one: conflict iff (other.window_start - 45m) <= (this.window_end + 45m) AND (this.window_start - 45m) <= (other.window_end + 45m); touching endpoints DO conflict (else ERR_RESOURCE_UNIT_OVERLAP)"
        side_effects: []
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: POST /service-orders/{id}/start
        actor: AgencyOps
        preconditions:
          - "status == CONFIRMED (else ERR_INVALID_STATE)"
          - "current_utc >= window_start - 60m (else ERR_WINDOW_NOT_STARTED)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /service-orders/{id}/complete
        actor: AgencyOps
        preconditions: ["status == IN_PROGRESS (else ERR_INVALID_STATE)"]
        side_effects:
          - "actual_cents = payload.actual_cents"
          - "DALine mirror (source_type SERVICE_ORDER, category mapped: PILOT->PILOTAGE, TUG->TOWAGE, LINEBOAT->BERTH_HIRE, LAUNCH->CREW_COSTS) actual_cents = actual_cents, status -> ACTUALIZED when the DA is in {PRO_FORMA, SENT_TO_PRINCIPAL, FUNDED}; otherwise the line keeps the value for the next refinalize"
          - "DA totals recomputed via da_totals_calc when the DA is in {PRO_FORMA, SENT_TO_PRINCIPAL, FUNDED}"
      - from: ORDERED
        to: CANCELLED
        trigger: POST /service-orders/{id}/cancel OR system via PortCall cancel cascade
        actor: AgencyOps
        preconditions: ["status in {ORDERED, CONFIRMED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "cancellation_fee_cents = round_half_up(0.25 * estimated_cents) when cancelled via POST /service-orders/{id}/cancel AND current_utc > window_start - 2h, else 0; cascade cancellations are always 0"
          - "DALine mirror: estimated_cents -> 0 (reversal); when cancellation_fee_cents > 0 a CANCELLATION_FEE DALine with actual_cents = cancellation_fee_cents, status ACTUALIZED is appended to the DA when it is in {PRO_FORMA, SENT_TO_PRINCIPAL, FUNDED}"
          - "DA totals recomputed via da_totals_calc"
      - from: CONFIRMED
        to: CANCELLED
        trigger: POST /service-orders/{id}/cancel OR system via PortCall cancel cascade
        actor: AgencyOps
        preconditions: ["status in {ORDERED, CONFIRMED} (else ERR_INVALID_STATE)"]
        side_effects: ["as ORDERED -> CANCELLED"]

