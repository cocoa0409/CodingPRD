            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cr3}", account_number: "A-R003", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { ar3: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cr3}", name: "RBAC Ben3", bank_name: "RBACBank3", account_number: "B-R003", country_code: "US" }, as: WireOperator, captures: { br3: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-30" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ar3}", beneficiary_id: "${br3}", amount_cents: 100000, method: "Fedwire", purpose: "rbac repair" }, as: WireOperator, as_user_id: "op-1", captures: { wr3: $.data.id } }
            - { call: "POST /wire-ops/wires/${wr3}/submit", payload: { business_date: "2026-09-30" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wr3}", as: WireOperator, captures: { r3_v: $.data.version } }
          trigger:
            - { call: "POST /wire-ops/wires/${wr3}/repair", payload: { expected_wire_version: "${r3_v}", purpose: "operator overreach" }, as: WireOperator, as_user_id: "op-1", captures: { r3_err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (${r3_err}), HTTP 403; repair_attempts remains 0"

