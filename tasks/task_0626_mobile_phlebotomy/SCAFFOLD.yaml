# =============================================================================
# PRD Benchmark Scaffold — Mobile Phlebotomy & At-Home Lab Draw (Getlabs style)
# Difficulty band: Expert
# =============================================================================

scenario: |
  626. Mobile Phlebotomy & At-Home Lab Draw (Getlabs style): order & test panel,
  appointment & route/territory, phlebotomist dispatch & kit, specimen labeling &
  chain-of-custody, lab partner (Quest/Labcorp) routing & courier, result routing
  to provider/portal, insurance/self-pay & convenience fee, redraw/QNS

domain_name: mobile-phlebotomy
api_prefix: ""   # flat topology: many top-level collections (/lab-orders, /route-days, /specimens, ...)

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: hybrid
  # LabOrder is the aggregate root (tree: Order -> Specimen -> CustodyEvent),
  # with cross-aggregate flat references to Appointment, RouteDay, Phlebotomist,
  # LabPartner, CourierManifest as peer resources linked by foreign keys.

  state_machine_shape: branching
  # LabOrder branches DRAW_COMPLETED -> {RESULTED | REDRAW_REQUIRED} with divergent
  # side-effect sets; Specimen branches COLLECTED -> {ACCESSIONED | QNS_REJECTED};
  # Appointment carries a revert (DISPATCHED -> SCHEDULED on phlebotomist recall).

  relationship_patterns:
    - one_to_many        # LabOrder -> Specimen; RouteDay -> Appointment
    - cross_aggregate    # Appointment.route_day_id, LabOrder.appointment_id, CourierManifest.lab_partner_id
    - self_referential   # ChainOfCustodyEvent.prior_event_id forms a per-specimen custody chain

  role_model: peer_roles
  # OrderingProvider owns LabOrder lifecycle; Dispatcher owns scheduling/dispatch;
  # Phlebotomist owns the on-site draw + custody; LabOps owns accessioning/results;
  # BillingAgent owns invoicing.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: TestPanel
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: panel_code, type: string, source: input, description: "Unique short code, e.g. CMP14, LIPID, CBC" }
      - { name: name, type: string, source: input, description: "Human-readable panel name" }
      - { name: required_tube_count, type: integer, source: input, description: "Number of specimen tubes required for a valid draw (>= 1)" }
      - { name: base_lab_fee_cents, type: integer, source: input, description: "Lab-side processing fee in cents (>= 0)" }
      - { name: fasting_required, type: boolean, source: input, default: false, description: "Whether patient must be fasting at draw time" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED — RETIRED panels cannot be ordered" }

  - name: LabPartner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Partner name, e.g. Quest, Labcorp" }
      - { name: courier_sla_hours, type: integer, source: input, description: "Max hours from manifest pickup to accession SLA (>= 1)" }
      - { name: accepted_panel_codes, type: array, source: input, description: "List of TestPanel.panel_code strings this partner processes" }
      - { name: stat_surcharge_cents, type: integer, source: input, default: 0, description: "Extra lab fee added when an order is STAT priority (>= 0)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED partners cannot accept new manifests" }

  - name: Phlebotomist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Phlebotomist name" }
      - { name: territory_code, type: string, source: input, description: "Service territory the phlebotomist is certified for, e.g. SF_BAY" }
      - { name: certification_active, type: boolean, source: input, default: true, description: "Whether the phlebotomist may be dispatched" }
      - { name: redraw_strike_count, type: integer, source: computed, default: 0, description: "Cumulative count of QNS-attributable redraws caused by this phlebotomist" }
      - { name: status, type: enum, source: computed, default: AVAILABLE, description: "AVAILABLE | SUSPENDED — SUSPENDED when redraw_strike_count >= 3" }

  - name: RouteDay
    parent: Phlebotomist
    common_fields: true
    fields:
      - { name: phlebotomist_id, type: string, source: input, description: "FK -> Phlebotomist.id; the phlebotomist running this route" }
      - { name: territory_code, type: string, source: input, description: "Territory served by this route day, e.g. SF_BAY" }
      - { name: service_date, type: string, source: input, description: "Calendar date of the route, YYYY-MM-DD" }
      - { name: shift_start_utc, type: datetime, source: input, description: "Earliest bookable appointment start (inclusive), ISO 8601 UTC" }
      - { name: shift_end_utc, type: datetime, source: input, description: "Latest bookable appointment end (inclusive), ISO 8601 UTC" }
      - { name: stop_capacity, type: integer, source: input, description: "Max number of booked appointments on this route day (>= 1)" }
      - { name: booked_stop_count, type: integer, source: computed, default: 0, description: "Count of appointments in {SCHEDULED, DISPATCHED, ARRIVED, DRAW_COMPLETED} on this route day" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED — CLOSED route days reject new bookings" }

  - name: LabOrder
    parent: null
    common_fields: true
    fields:
      - { name: ordering_provider_id, type: string, source: system, description: "X-User-ID of the OrderingProvider who created the order" }
      - { name: patient_full_name, type: string, source: input, description: "Patient name" }
      - { name: patient_territory_code, type: string, source: input, description: "Patient's service territory, e.g. SF_BAY" }
      - { name: panel_code, type: string, source: input, description: "TestPanel.panel_code being ordered" }
      - { name: lab_partner_id, type: string, source: input, description: "FK -> LabPartner.id; partner that will process specimens" }
      - { name: priority, type: enum, source: input, default: ROUTINE, description: "ROUTINE | STAT — STAT adds the partner stat surcharge" }
      - { name: billing_mode, type: enum, source: input, description: "INSURANCE | SELF_PAY — selects the billing variant" }
      - { name: insurance_member_id, type: string, source: input, required: false, description: "Required when billing_mode == INSURANCE; member id string" }
      - { name: appointment_id, type: string, source: computed, required: false, description: "FK -> Appointment.id; set when an appointment is booked for this order" }
      - { name: specimens_required_count, type: integer, source: computed, description: "Mirror of the ordered TestPanel.required_tube_count at creation time" }
      - { name: specimens_accessioned_count, type: integer, source: computed, default: 0, description: "Count of this order's Specimens in ACCESSIONED status" }
      - { name: redraw_count, type: integer, source: computed, default: 0, description: "Number of times this order has been sent back for redraw" }
      - { name: total_due_cents, type: integer, source: computed, default: 0, description: "Patient/insurer amount due, computed by the active billing variant (see calculations)" }
      - { name: status, type: enum, source: system, default: ORDERED, description: "ORDERED | SCHEDULED | DRAW_COMPLETED | REDRAW_REQUIRED | RESULTED | CANCELLED" }

  - name: Appointment
    parent: LabOrder
    common_fields: true
    fields:
      - { name: lab_order_id, type: string, source: input, description: "FK -> LabOrder.id; the order this appointment fulfills" }
      - { name: route_day_id, type: string, source: input, description: "FK -> RouteDay.id; the route day this stop is booked on" }
      - { name: phlebotomist_id, type: string, source: computed, description: "Denormalized from the route day's phlebotomist at booking time" }
      - { name: window_start_utc, type: datetime, source: input, description: "Requested draw window start (inclusive), ISO 8601 UTC" }
      - { name: window_end_utc, type: datetime, source: input, description: "Requested draw window end (exclusive), ISO 8601 UTC; must be > window_start_utc" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | DISPATCHED | ARRIVED | DRAW_COMPLETED | CANCELLED" }

  - name: DrawKit
    parent: Appointment
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; the appointment this kit was assigned to" }
      - { name: kit_lot_number, type: string, source: input, description: "Manufacturer lot number of the kit" }
      - { name: tube_count, type: integer, source: input, description: "Number of empty tubes loaded in the kit (>= 1)" }
      - { name: status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED | CONSUMED — CONSUMED once the draw is completed" }

  - name: Specimen
    parent: LabOrder
    common_fields: true
    fields:
      - { name: lab_order_id, type: string, source: input, description: "FK -> LabOrder.id; the order this specimen belongs to" }
      - { name: appointment_id, type: string, source: system, description: "FK -> Appointment.id; the appointment at which it was collected" }
      - { name: tube_label, type: string, source: input, description: "Unique-per-order label printed on the tube, e.g. T1, T2" }
      - { name: collected_at_utc, type: datetime, source: system, description: "Server clock at collection time, ISO 8601 UTC" }
      - { name: courier_manifest_id, type: string, source: computed, required: false, description: "FK -> CourierManifest.id; set when batched onto a manifest" }
      - { name: status, type: enum, source: system, default: COLLECTED, description: "COLLECTED | MANIFESTED | ACCESSIONED | QNS_REJECTED" }

  - name: ChainOfCustodyEvent
    parent: Specimen
    common_fields: false   # id, created_at only — append-only log, immutable
    fields:
      - { name: specimen_id, type: string, source: input, description: "FK -> Specimen.id; the specimen this custody hop concerns" }
      - { name: prior_event_id, type: string, source: input, required: false, description: "FK -> ChainOfCustodyEvent.id; the previous custody event for this specimen, null for the first" }
      - { name: event_type, type: enum, source: input, description: "COLLECTED | MANIFESTED | ACCESSIONED | REJECTED_QNS" }
      - { name: actor_role, type: string, source: system, description: "Role recorded from X-User-Role at the hop" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID recorded at the hop" }
      - { name: sequence_index, type: integer, source: system, description: "0-based position of this event in the specimen's custody chain" }

  - name: CourierManifest
    parent: null
    common_fields: true
    fields:
      - { name: lab_partner_id, type: string, source: input, description: "FK -> LabPartner.id; partner the manifest is routed to" }
      - { name: territory_code, type: string, source: input, description: "Territory the manifest's specimens were collected in" }
      - { name: picked_up_at_utc, type: datetime, source: system, required: false, description: "Server clock when courier pickup recorded, ISO 8601 UTC" }
      - { name: accession_due_utc, type: datetime, source: computed, required: false, description: "picked_up_at_utc + LabPartner.courier_sla_hours; null until pickup" }
      - { name: specimen_count, type: integer, source: computed, default: 0, description: "Count of Specimens in MANIFESTED or ACCESSIONED status on this manifest" }
      - { name: status, type: enum, source: system, default: BUILDING, description: "BUILDING | IN_TRANSIT | DELIVERED — DELIVERED once all specimens accessioned/rejected" }

  - name: LabResult
    parent: LabOrder
    common_fields: true
    fields:
      - { name: lab_order_id, type: string, source: input, description: "FK -> LabOrder.id; the order these results belong to" }
      - { name: lab_partner_id, type: string, source: system, description: "FK -> LabPartner.id; copied from the order at result time" }
      - { name: result_value, type: string, source: input, description: "Encoded result payload string" }
      - { name: released_to_provider, type: boolean, source: computed, default: false, description: "True once routed to the OrderingProvider" }
      - { name: released_to_portal, type: boolean, source: computed, default: false, description: "True once routed to the patient portal" }
      - { name: status, type: enum, source: system, default: PENDING_RELEASE, description: "PENDING_RELEASE | RELEASED" }

  - name: Invoice
    parent: LabOrder
    common_fields: true
    fields:
      - { name: lab_order_id, type: string, source: input, description: "FK -> LabOrder.id; the order being billed" }
      - { name: billing_mode, type: enum, source: system, description: "INSURANCE | SELF_PAY — copied from the order at invoice time" }
      - { name: lab_fee_cents, type: integer, source: computed, description: "Lab-side fee component (panel base + STAT surcharge)" }
      - { name: convenience_fee_cents, type: integer, source: computed, description: "Mobile-draw convenience fee component per the billing variant" }
      - { name: redraw_waiver_cents, type: integer, source: computed, default: 0, description: "Credit applied for QNS-attributable redraws" }
      - { name: total_cents, type: integer, source: computed, description: "lab_fee_cents + convenience_fee_cents - redraw_waiver_cents (floored at 0)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | VOID" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: LabOrder
    initial_state: ORDERED
    terminal_states: [RESULTED, CANCELLED]
    transitions:
      - from: ORDERED
        to: SCHEDULED
        trigger: "POST /lab-orders/{orderId}/appointments (booking succeeds)"
        actor: Dispatcher
        preconditions:
          - "LabOrder.status == ORDERED (ERR_ORDER_NOT_SCHEDULABLE)"
          - "Referenced RouteDay.status == OPEN (ERR_ROUTE_DAY_CLOSED)"
          - "RouteDay.territory_code == LabOrder.patient_territory_code (ERR_TERRITORY_MISMATCH)"
          - "RouteDay.booked_stop_count < RouteDay.stop_capacity (ERR_ROUTE_DAY_FULL)"
          - "No existing appointment on the same RouteDay whose [window_start_utc, window_end_utc) overlaps the requested window (ERR_APPOINTMENT_WINDOW_CONFLICT)"
        side_effects:
          - "Create Appointment in SCHEDULED, denormalize phlebotomist_id from RouteDay"
          - "LabOrder.appointment_id set to the new appointment"
          - "RouteDay.booked_stop_count += 1 (bubble-up to route day)"
          - "increments RouteDay.version by 1"

      - from: SCHEDULED
        to: DRAW_COMPLETED
        trigger: "POST /appointments/{apptId}/complete-draw"
        actor: Phlebotomist
        preconditions:
          - "Appointment.status == ARRIVED (ERR_APPOINTMENT_NOT_ARRIVED)"
          - "Exactly LabOrder.specimens_required_count Specimens exist for the order, all in COLLECTED status (ERR_SPECIMEN_COUNT_MISMATCH)"
        side_effects:
          - "Appointment.status -> DRAW_COMPLETED"
          - "DrawKit for the appointment -> CONSUMED"
          - "LabOrder.status -> DRAW_COMPLETED"

      - from: DRAW_COMPLETED
        to: RESULTED
        trigger: "POST /lab-orders/{orderId}/results"
        actor: LabOps
        preconditions:
          - "LabOrder.status == DRAW_COMPLETED (ERR_ORDER_NOT_RESULTABLE)"
          - "LabOrder.specimens_accessioned_count == LabOrder.specimens_required_count (ERR_SPECIMENS_NOT_ACCESSIONED)"
        side_effects:
          - "Create LabResult in PENDING_RELEASE, lab_partner_id copied from order"
          - "LabOrder.status -> RESULTED"

      - from: DRAW_COMPLETED
        to: REDRAW_REQUIRED
        trigger: "system (automatic when a Specimen on a DRAW_COMPLETED order transitions to QNS_REJECTED)"
        actor: system
        preconditions:
          - "LabOrder.status == DRAW_COMPLETED"
        side_effects:
          - "LabOrder.redraw_count += 1"
          - "LabOrder.total_due_cents recomputed via order_total_due_estimate (now includes redraw waiver)"
          - "LabOrder.specimens_accessioned_count recomputed (excludes QNS_REJECTED)"
          - "Owning Appointment.status -> CANCELLED; RouteDay.booked_stop_count -= 1; RouteDay.version += 1 (cascade: order redraw -> appointment cancel -> route day decrement)"
          - "Phlebotomist.redraw_strike_count += 1; if it reaches 3, Phlebotomist.status -> SUSPENDED (cascade continues phlebotomist)"

      - from: REDRAW_REQUIRED
        to: SCHEDULED
        trigger: "POST /lab-orders/{orderId}/appointments (re-book after redraw)"
        actor: Dispatcher
        preconditions:
          - "LabOrder.status == REDRAW_REQUIRED (ERR_ORDER_NOT_SCHEDULABLE)"
          - "Referenced RouteDay.status == OPEN (ERR_ROUTE_DAY_CLOSED)"
          - "RouteDay.territory_code == LabOrder.patient_territory_code (ERR_TERRITORY_MISMATCH)"
          - "RouteDay.booked_stop_count < RouteDay.stop_capacity (ERR_ROUTE_DAY_FULL)"
          - "No window overlap on the RouteDay (ERR_APPOINTMENT_WINDOW_CONFLICT)"
        side_effects:
          - "Create new Appointment in SCHEDULED; LabOrder.appointment_id updated"
          - "RouteDay.booked_stop_count += 1; increments RouteDay.version by 1"

      - from: ORDERED
        to: CANCELLED
        trigger: "POST /lab-orders/{orderId}/cancel"
        actor: OrderingProvider
        preconditions:
          - "LabOrder.status IN {ORDERED, SCHEDULED, REDRAW_REQUIRED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "If an active Appointment exists: Appointment -> CANCELLED; RouteDay.booked_stop_count -= 1; RouteDay.version += 1 (compensation)"
          - "LabOrder.status -> CANCELLED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /lab-orders/{orderId}/cancel"
        actor: OrderingProvider
        preconditions:
          - "LabOrder.status IN {ORDERED, SCHEDULED, REDRAW_REQUIRED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Active Appointment -> CANCELLED; RouteDay.booked_stop_count -= 1; RouteDay.version += 1 (compensation)"
          - "LabOrder.status -> CANCELLED"

      - from: REDRAW_REQUIRED
        to: CANCELLED
        trigger: "POST /lab-orders/{orderId}/cancel"
        actor: OrderingProvider
        preconditions:
          - "LabOrder.status IN {ORDERED, SCHEDULED, REDRAW_REQUIRED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "No active appointment after a redraw; LabOrder.status -> CANCELLED"

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [DRAW_COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /appointments/{apptId}/dispatch"
        actor: Dispatcher
        preconditions:
          - "Appointment.status == SCHEDULED (ERR_APPOINTMENT_NOT_DISPATCHABLE)"
          - "Phlebotomist.certification_active == true AND Phlebotomist.status == AVAILABLE (ERR_PHLEBOTOMIST_UNAVAILABLE)"
          - "A DrawKit with tube_count >= LabOrder.specimens_required_count is assigned to this appointment (ERR_KIT_NOT_ASSIGNED)"
        side_effects:
          - "Appointment.status -> DISPATCHED"

      - from: DISPATCHED
        to: SCHEDULED
        trigger: "POST /appointments/{apptId}/recall"
        actor: Dispatcher
        preconditions:
          - "Appointment.status == DISPATCHED (ERR_APPOINTMENT_NOT_RECALLABLE)"
        side_effects:
          - "Appointment.status -> SCHEDULED (revert; dispatch can be retried)"
        note: "Branching-with-revert: dispatch is reversible before arrival."

      - from: DISPATCHED
        to: ARRIVED
        trigger: "POST /appointments/{apptId}/arrive"
        actor: Phlebotomist
        preconditions:
          - "Appointment.status == DISPATCHED (ERR_APPOINTMENT_NOT_ARRIVABLE)"
          - "X-User-ID == Appointment.phlebotomist_id (ERR_NOT_ASSIGNED_PHLEBOTOMIST)"
        side_effects:
          - "Appointment.status -> ARRIVED"

      - from: ARRIVED
        to: DRAW_COMPLETED
        trigger: "POST /appointments/{apptId}/complete-draw"
        actor: Phlebotomist
        preconditions:
          - "Appointment.status == ARRIVED (ERR_APPOINTMENT_NOT_ARRIVED)"
          - "Exactly LabOrder.specimens_required_count Specimens in COLLECTED status for the order (ERR_SPECIMEN_COUNT_MISMATCH)"
        side_effects:
          - "Appointment.status -> DRAW_COMPLETED; DrawKit -> CONSUMED; LabOrder -> DRAW_COMPLETED (bubble-up)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from LabOrder cancel or redraw)"
        actor: system
        preconditions:
          - "Owning LabOrder transitions to CANCELLED or REDRAW_REQUIRED"
        side_effects:
          - "RouteDay.booked_stop_count -= 1; RouteDay.version += 1"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "system (cascade from LabOrder cancel)"
        actor: system
        preconditions:
          - "Owning LabOrder transitions to CANCELLED"
        side_effects:
          - "RouteDay.booked_stop_count -= 1; RouteDay.version += 1"

  - entity: Specimen
    initial_state: COLLECTED
    terminal_states: [ACCESSIONED, QNS_REJECTED]
    transitions:
      - from: COLLECTED
        to: MANIFESTED
        trigger: "POST /courier-manifests/{manifestId}/add-specimen"
        actor: Phlebotomist
        preconditions:
          - "Specimen.status == COLLECTED (ERR_SPECIMEN_NOT_MANIFESTABLE)"
          - "CourierManifest.status == BUILDING (ERR_MANIFEST_NOT_BUILDING)"
          - "CourierManifest.territory_code == collection territory of the specimen's order (ERR_TERRITORY_MISMATCH)"
          - "CourierManifest.lab_partner_id == Specimen's LabOrder.lab_partner_id (ERR_LAB_PARTNER_MISMATCH)"
        side_effects:
          - "Specimen.courier_manifest_id set; Specimen.status -> MANIFESTED"
          - "CourierManifest.specimen_count += 1"
          - "Append ChainOfCustodyEvent(event_type=MANIFESTED) linked to the specimen's prior event"

      - from: MANIFESTED
        to: ACCESSIONED
        trigger: "POST /specimens/{specimenId}/accession"
        actor: LabOps
        preconditions:
          - "Specimen.status == MANIFESTED (ERR_SPECIMEN_NOT_ACCESSIONABLE)"
          - "Parent CourierManifest.status == IN_TRANSIT (ERR_MANIFEST_NOT_IN_TRANSIT)"
        side_effects:
          - "Specimen.status -> ACCESSIONED"
          - "LabOrder.specimens_accessioned_count += 1 (ledger sync to order)"
          - "Append ChainOfCustodyEvent(event_type=ACCESSIONED)"
          - "If all of the manifest's specimens are ACCESSIONED or QNS_REJECTED: CourierManifest.status -> DELIVERED (bubble-up)"

      - from: MANIFESTED
        to: QNS_REJECTED
        trigger: "POST /specimens/{specimenId}/reject-qns"
        actor: LabOps
        preconditions:
          - "Specimen.status == MANIFESTED (ERR_SPECIMEN_NOT_REJECTABLE)"
          - "Parent CourierManifest.status == IN_TRANSIT (ERR_MANIFEST_NOT_IN_TRANSIT)"
        side_effects:
          - "Specimen.status -> QNS_REJECTED (quantity-not-sufficient)"
          - "Append ChainOfCustodyEvent(event_type=REJECTED_QNS)"
          - "If owning LabOrder.status == DRAW_COMPLETED: order -> REDRAW_REQUIRED (cascade: specimen QNS -> order redraw -> appointment cancel -> route day decrement; and phlebotomist strike)"
          - "If all of the manifest's specimens are ACCESSIONED or QNS_REJECTED: CourierManifest.status -> DELIVERED (bubble-up)"

  - entity: CourierManifest
    initial_state: BUILDING
    terminal_states: [DELIVERED]
    transitions:
      - from: BUILDING
        to: IN_TRANSIT
        trigger: "POST /courier-manifests/{manifestId}/pickup"
        actor: Dispatcher
        preconditions:
          - "CourierManifest.status == BUILDING (ERR_MANIFEST_NOT_BUILDING)"
          - "CourierManifest.specimen_count >= 1 (ERR_MANIFEST_EMPTY)"
          - "LabPartner.status == ACTIVE (ERR_LAB_PARTNER_SUSPENDED)"
        side_effects:
          - "CourierManifest.picked_up_at_utc set to server clock"
          - "CourierManifest.accession_due_utc = picked_up_at_utc + LabPartner.courier_sla_hours"
          - "CourierManifest.status -> IN_TRANSIT"

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "system (automatic when every specimen on the manifest is ACCESSIONED or QNS_REJECTED)"
        actor: system
        preconditions:
          - "CourierManifest.status == IN_TRANSIT"
          - "Every Specimen with this courier_manifest_id is in {ACCESSIONED, QNS_REJECTED}"
        side_effects:
          - "CourierManifest.status -> DELIVERED"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [ISSUED, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{invoiceId}/issue"
        actor: BillingAgent
        preconditions:
          - "Invoice.status == DRAFT (ERR_INVOICE_NOT_ISSUABLE)"
          - "Owning LabOrder.status == RESULTED (ERR_ORDER_NOT_RESULTED)"
        side_effects:
          - "Recompute lab_fee_cents, convenience_fee_cents, redraw_waiver_cents, total_cents via the active billing variant"
          - "Invoice.status -> ISSUED"

      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{invoiceId}/void"
        actor: BillingAgent
        preconditions:
          - "Invoice.status == DRAFT (ERR_INVOICE_NOT_VOIDABLE)"
        side_effects:
          - "Invoice.status -> VOID"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: appointment-book-stale-routeday
    parent_entity: RouteDay
    write_endpoint: "POST /lab-orders/{orderId}/appointments"
    occ_field: "expected_route_day_version"
    description: |
      Booking an Appointment onto a RouteDay whose version has advanced since the
      client last observed it is rejected with a stale-version error. A prior
      successful booking on the same route day legitimately bumps the route day's
      version (booked_stop_count increment); the current booking carries a stale
      expected_route_day_version and is refused before it can over-subscribe the
      route day's stop_capacity.
    error_id: ERR_ROUTE_DAY_VERSION_STALE
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: invoice_self_pay_total
    trigger: "Invoice issue on a SELF_PAY order (POST /invoices/{invoiceId}/issue)"
    algorithm: tiered_pricing
    formula: |
      lab_fee_cents       = TestPanel.base_lab_fee_cents
                          + (LabOrder.priority == STAT ? LabPartner.stat_surcharge_cents : 0)
      # Mobile-draw convenience fee for self-pay: a flat base plus a per-extra-tube
      # surcharge, where "extra tubes" are required tubes beyond the first.
      extra_tubes         = max(0, TestPanel.required_tube_count - 1)
      convenience_fee_cents = SELF_PAY_BASE_CONVENIENCE_CENTS
                            + extra_tubes * SELF_PAY_PER_TUBE_CENTS
      # Redraw waiver: each QNS-attributable redraw waives one convenience-fee unit,
      # capped at the convenience fee (waiver never exceeds the convenience component).
      redraw_waiver_cents = min(convenience_fee_cents,
                                LabOrder.redraw_count * SELF_PAY_REDRAW_WAIVER_UNIT_CENTS)
      total_cents         = max(0, lab_fee_cents + convenience_fee_cents - redraw_waiver_cents)
    input_set: "The order's TestPanel (by panel_code), its LabPartner, and the LabOrder's priority and redraw_count at issue time."
    constants:
      SELF_PAY_BASE_CONVENIENCE_CENTS: 3500
      SELF_PAY_PER_TUBE_CENTS: 500
      SELF_PAY_REDRAW_WAIVER_UNIT_CENTS: 1000
    precision: "integer cents; all arithmetic in cents, no fractional rounding"
    variants:
      - name: self_pay
        when: "LabOrder.billing_mode == SELF_PAY"
        difference: "Patient bears the full lab fee plus the convenience fee minus redraw waiver."

  - name: invoice_insurance_total
    trigger: "Invoice issue on an INSURANCE order (POST /invoices/{invoiceId}/issue)"
    algorithm: tiered_pricing
    formula: |
      lab_fee_cents       = TestPanel.base_lab_fee_cents
                          + (LabOrder.priority == STAT ? LabPartner.stat_surcharge_cents : 0)
      # Insurance covers the lab fee; the patient owes only the convenience fee,
      # which under insurance is a flat amount (no per-tube surcharge) because the
      # insurer reimburses processing per panel, not per tube.
      convenience_fee_cents = INSURANCE_FLAT_CONVENIENCE_CENTS
      redraw_waiver_cents = min(convenience_fee_cents,
                                LabOrder.redraw_count * INSURANCE_REDRAW_WAIVER_UNIT_CENTS)
      # Under insurance the patient-due total excludes the lab fee entirely.
      total_cents         = max(0, convenience_fee_cents - redraw_waiver_cents)
    input_set: "Same order/panel/partner inputs as the self-pay variant; lab_fee_cents is still computed and stored on the Invoice but excluded from total_cents."
    constants:
      INSURANCE_FLAT_CONVENIENCE_CENTS: 2500
      INSURANCE_REDRAW_WAIVER_UNIT_CENTS: 2500
    precision: "integer cents"
    variants:
      - name: insurance
        when: "LabOrder.billing_mode == INSURANCE"
        difference: "lab_fee excluded from patient total; convenience fee is flat (tube count ignored); a single redraw fully waives the convenience fee."

  - name: order_total_due_estimate
    trigger: "LabOrder create (POST /lab-orders) and on every redraw_count change"
    algorithm: forward_looking
    formula: |
      # Provisional patient-due estimate stamped on LabOrder.total_due_cents. It runs
      # the SAME billing-variant arithmetic as the Invoice calc but is FORWARD-LOOKING:
      # at order creation redraw_count is 0, so the estimate carries NO redraw waiver.
      # The final Invoice.total_cents (computed at issue) is CHRONOLOGICAL — it reflects
      # the redraws that actually accrued between order creation and issue.
      if billing_mode == SELF_PAY:
        lab_fee = base_lab_fee_cents + (priority==STAT ? stat_surcharge_cents : 0)
        conv    = SELF_PAY_BASE_CONVENIENCE_CENTS + max(0, required_tube_count-1) * SELF_PAY_PER_TUBE_CENTS
        waiver  = min(conv, redraw_count * SELF_PAY_REDRAW_WAIVER_UNIT_CENTS)
        total_due_cents = max(0, lab_fee + conv - waiver)
      else: # INSURANCE
        conv    = INSURANCE_FLAT_CONVENIENCE_CENTS
        waiver  = min(conv, redraw_count * INSURANCE_REDRAW_WAIVER_UNIT_CENTS)
        total_due_cents = max(0, conv - waiver)
    input_set: "The order's TestPanel, LabPartner, billing_mode, priority, and CURRENT redraw_count. At creation redraw_count=0; after a QNS-driven redraw it is the order's live redraw_count."
    constants:
      SELF_PAY_BASE_CONVENIENCE_CENTS: 3500
      SELF_PAY_PER_TUBE_CENTS: 500
      SELF_PAY_REDRAW_WAIVER_UNIT_CENTS: 1000
      INSURANCE_FLAT_CONVENIENCE_CENTS: 2500
      INSURANCE_REDRAW_WAIVER_UNIT_CENTS: 2500
    precision: "integer cents"
    variants:
      - name: estimate_at_order_time
        when: "Computed at order creation (redraw_count == 0)"
        difference: "Excludes any redraw waiver because no redraw has occurred yet — forward-looking projection."
      - name: estimate_after_redraw
        when: "Recomputed after a redraw bumps redraw_count"
        difference: "Now reflects accrued redraw waiver; diverges from the at-order estimate for the same panel/partner inputs."
    note: "Estimate-vs-final dual variant on the LabOrder.total_due_cents metric — a different entity domain (LabOrder) than the Invoice billing-mode divergence."

  - name: phlebotomist_redraw_strike
    trigger: "Specimen QNS rejection that drives its order into REDRAW_REQUIRED (POST /specimens/{specimenId}/reject-qns)"
    algorithm: aggregation
    formula: |
      # Strike accrues to the phlebotomist denormalized on the order's CURRENT
      # owning appointment (the one whose draw produced the QNS specimen).
      phlebotomist = Phlebotomist of LabOrder.appointment_id's denormalized phlebotomist_id
      phlebotomist.redraw_strike_count += 1
      if phlebotomist.redraw_strike_count >= SUSPENSION_THRESHOLD:
        phlebotomist.status = SUSPENDED
      else:
        phlebotomist.status = AVAILABLE
    input_set: "Single phlebotomist per QNS event; the strike count is a running aggregate over QNS-attributable redraws."
    constants:
      SUSPENSION_THRESHOLD: 3
    precision: "integer count"
    note: "Risk-scoring style accumulation on the Phlebotomist entity — a different entity domain than the cost calculations above."

  - name: route_day_booked_stop_count
    trigger: "Appointment create (booking), cancel, recall-driven decrement"
    algorithm: aggregation
    formula: |
      booked_stop_count = count of Appointments whose route_day_id == this RouteDay.id
                          AND status IN {SCHEDULED, DISPATCHED, ARRIVED, DRAW_COMPLETED}
      # Recomputed on every booking (+1) and every cancellation/redraw (-1).
      # Capacity guard at booking: booked_stop_count (pre-increment) < stop_capacity.
    input_set: "All Appointments on the route day filtered to the four non-CANCELLED statuses."
    precision: "integer count"

  - name: manifest_accession_due
    trigger: "Courier pickup (POST /courier-manifests/{manifestId}/pickup)"
    algorithm: interval_merge
    formula: |
      accession_due_utc = picked_up_at_utc + (LabPartner.courier_sla_hours hours)
      # picked_up_at_utc is the server logical clock at the pickup call.
    input_set: "The manifest's LabPartner.courier_sla_hours and the pickup timestamp."
    precision: "whole hours added to an ISO 8601 UTC instant"

  - name: order_specimens_accessioned_count
    trigger: "Specimen accession (+1) and QNS rejection of a previously-counted specimen (recompute)"
    algorithm: aggregation
    formula: |
      specimens_accessioned_count = count of Specimens whose lab_order_id == LabOrder.id
                                    AND status == ACCESSIONED
    input_set: "The order's specimens filtered to ACCESSIONED only; QNS_REJECTED never counted."
    precision: "integer count"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for the requested operation per the RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path exists (validated left-to-right)"
    error_id: "ERR_*_NOT_FOUND (resource-specific)"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: existence
    check: "Referenced foreign keys in the body exist (panel_code, lab_partner_id, route_day_id, lab_order_id)"
    error_id: "ERR_*_NOT_FOUND (resource-specific)"
    http_status: 404
    applies_to: "POST /lab-orders, POST /lab-orders/{orderId}/appointments, POST /courier-manifests, POST /appointments/{apptId}/kit, POST /appointments/{apptId}/specimens"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers non-negative, window_end_utc > window_start_utc, billing_mode==INSURANCE requires insurance_member_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/mutation endpoints"

  - priority: 6
    category: concurrency
    check: "expected_route_day_version (when the booking endpoint requires it) equals current RouteDay.version"
    error_id: ERR_ROUTE_DAY_VERSION_STALE
    http_status: 412
    applies_to: "POST /lab-orders/{orderId}/appointments"
    note: "OCC check runs before business preconditions on the route day."

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is legal"
    error_id: "ERR_*_NOT_* (transition-specific, e.g. ERR_ORDER_NOT_SCHEDULABLE, ERR_APPOINTMENT_NOT_DISPATCHABLE)"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_referential
    check: "panel_code is ACTIVE and accepted by the chosen LabPartner.accepted_panel_codes"
    error_id: ERR_PANEL_NOT_ACCEPTED_BY_PARTNER
    http_status: 409
    applies_to: "POST /lab-orders"

  - priority: 9
    category: business_safety
    check: "On dispatch, the assigned Phlebotomist is certification_active AND status==AVAILABLE"
    error_id: ERR_PHLEBOTOMIST_UNAVAILABLE
    http_status: 409
    applies_to: "POST /appointments/{apptId}/dispatch"

  - priority: 10
    category: business_referential
    check: "RouteDay.territory_code matches LabOrder.patient_territory_code (booking); CourierManifest.territory_code matches the specimen's order territory (manifesting)"
    error_id: ERR_TERRITORY_MISMATCH
    http_status: 409
    applies_to: "POST /lab-orders/{orderId}/appointments, POST /courier-manifests/{manifestId}/add-specimen"

  - priority: 11
    category: business_referential
    check: "CourierManifest.lab_partner_id matches the specimen's LabOrder.lab_partner_id when adding a specimen"
    error_id: ERR_LAB_PARTNER_MISMATCH
    http_status: 409
    applies_to: "POST /courier-manifests/{manifestId}/add-specimen"

  - priority: 12
    category: business_temporal
    check: "Requested appointment [window_start_utc, window_end_utc) lies within [RouteDay.shift_start_utc, RouteDay.shift_end_utc] and does not overlap another booked appointment's half-open window on the same RouteDay. Half-open semantics: appointment A's end == appointment B's start is NOT a conflict (back-to-back stops allowed)."
    error_id: ERR_APPOINTMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /lab-orders/{orderId}/appointments"

  - priority: 12.5
    category: business_temporal
    check: "A new RouteDay's [shift_start_utc, shift_end_utc] must not overlap another OPEN RouteDay of the SAME phlebotomist. Closed-interval semantics: touching endpoints DO conflict (shift A's end == shift B's start is a conflict — a phlebotomist cannot run two shifts that abut)."
    error_id: ERR_ROUTE_DAY_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /phlebotomists/{phlebId}/route-days"

  - priority: 13
    category: business_constraint
    check: "RouteDay.booked_stop_count < RouteDay.stop_capacity at booking time"
    error_id: ERR_ROUTE_DAY_FULL
    http_status: 409
    applies_to: "POST /lab-orders/{orderId}/appointments"

  - priority: 14
    category: business_constraint
    check: "On complete-draw, exactly specimens_required_count specimens exist in COLLECTED status; on result, specimens_accessioned_count == specimens_required_count"
    error_id: ERR_SPECIMEN_COUNT_MISMATCH
    http_status: 409
    applies_to: "POST /appointments/{apptId}/complete-draw, POST /lab-orders/{orderId}/results"

  - priority: 15
    category: business_constraint
    check: "Specimen tube_label is unique within its LabOrder"
    error_id: ERR_DUPLICATE_TUBE_LABEL
    http_status: 409
    applies_to: "POST /appointments/{apptId}/specimens"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test Panels (configuration) ---
  - method: POST
    path: "/test-panels"
    description: "Create a test panel"
    roles: [LabOps]
    code: 201
    input: [panel_code, name, required_tube_count, base_lab_fee_cents, "fasting_required?"]
    output: TestPanel
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/test-panels"
    description: "List test panels (paginated; optional panel_code filter)"
    roles: [OrderingProvider, Dispatcher, Phlebotomist, LabOps, BillingAgent]
    code: 200
    input: ["panel_code?", "limit?", "offset?"]
    output: "TestPanel[]"
    side_effects: []

  - method: GET
    path: "/test-panels/{id}"
    description: "Get a test panel"
    roles: [OrderingProvider, Dispatcher, Phlebotomist, LabOps, BillingAgent]
    code: 200
    input: []
    output: TestPanel
    side_effects: []

  - method: POST
    path: "/test-panels/{id}/retire"
    description: "Retire a panel so it can no longer be ordered"
    roles: [LabOps]
    code: 200
    input: []
    output: TestPanel
    side_effects: ["status -> RETIRED"]

  # --- Lab Partners (configuration) ---
  - method: POST
    path: "/lab-partners"
    description: "Create a lab partner (Quest/Labcorp)"
    roles: [LabOps]
    code: 201
    input: [name, courier_sla_hours, accepted_panel_codes, "stat_surcharge_cents?"]
    output: LabPartner
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/lab-partners"
    description: "List lab partners"
    roles: [OrderingProvider, Dispatcher, Phlebotomist, LabOps, BillingAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "LabPartner[]"
    side_effects: []

  - method: GET
    path: "/lab-partners/{id}"
    description: "Get a lab partner"
    roles: [OrderingProvider, Dispatcher, Phlebotomist, LabOps, BillingAgent]
    code: 200
    input: []
    output: LabPartner
    side_effects: []

  - method: POST
    path: "/lab-partners/{id}/suspend"
    description: "Suspend a lab partner so it stops accepting new manifests"
    roles: [LabOps]
    code: 200
    input: []
    output: LabPartner
    side_effects: ["status -> SUSPENDED"]

  # --- Phlebotomists & Route Days ---
  - method: POST
    path: "/phlebotomists"
    description: "Register a phlebotomist"
    roles: [Dispatcher]
    code: 201
    input: [full_name, territory_code, "certification_active?"]
    output: Phlebotomist
    side_effects: ["status = AVAILABLE; redraw_strike_count = 0"]

  - method: GET
    path: "/phlebotomists"
    description: "List phlebotomists (optional territory_code filter)"
    roles: [Dispatcher, LabOps]
    code: 200
    input: ["territory_code?", "limit?", "offset?"]
    output: "Phlebotomist[]"
    side_effects: []

  - method: GET
    path: "/phlebotomists/{id}"
    description: "Get a phlebotomist"
    roles: [Dispatcher, LabOps, Phlebotomist]
    code: 200
    input: []
    output: Phlebotomist
    side_effects: []

  - method: POST
    path: "/phlebotomists/{id}/route-days"
    description: "Open a route day for a phlebotomist in a territory (rejects shift overlap with the phlebotomist's other OPEN route days, closed-interval)"
    roles: [Dispatcher]
    code: 201
    input: [territory_code, service_date, shift_start_utc, shift_end_utc, stop_capacity]
    output: RouteDay
    side_effects: ["status = OPEN; booked_stop_count = 0; phlebotomist_id set from path"]

  - method: GET
    path: "/phlebotomists/{id}/route-days"
    description: "List a phlebotomist's route days (reverse-reachability for RouteDay.phlebotomist_id)"
    roles: [Dispatcher, LabOps]
    code: 200
    input: ["service_date?", "limit?", "offset?"]
    output: "RouteDay[]"
    side_effects: []

  - method: GET
    path: "/route-days/{id}"
    description: "Get a route day (exposes version for OCC booking)"
    roles: [Dispatcher, LabOps]
    code: 200
    input: []
    output: RouteDay
    side_effects: []

  - method: GET
    path: "/route-days/{id}/appointments"
    description: "List appointments booked on a route day (reverse-reachability for Appointment.route_day_id)"
    roles: [Dispatcher, LabOps]
    code: 200
    input: ["limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  - method: POST
    path: "/route-days/{id}/close"
    description: "Close a route day to new bookings"
    roles: [Dispatcher]
    code: 200
    input: []
    output: RouteDay
    side_effects: ["status -> CLOSED"]

  # --- Lab Orders ---
  - method: POST
    path: "/lab-orders"
    description: "Create a lab order for a patient & panel"
    roles: [OrderingProvider]
    code: 201
    input: [patient_full_name, patient_territory_code, panel_code, lab_partner_id, billing_mode, "priority?", "insurance_member_id?"]
    output: LabOrder
    side_effects:
      - "status = ORDERED; ordering_provider_id set from X-User-ID"
      - "specimens_required_count mirrored from TestPanel.required_tube_count"
      - "total_due_cents stamped via order_total_due_estimate (redraw_count=0)"
      - "A DRAFT Invoice is created for the order"

  - method: GET
    path: "/lab-orders"
    description: "List lab orders (optional status, lab_partner_id, appointment_id filters — reverse-reachability for LabOrder.lab_partner_id and LabOrder.appointment_id)"
    roles: [OrderingProvider, Dispatcher, LabOps, BillingAgent]
    code: 200
    input: ["status?", "lab_partner_id?", "appointment_id?", "limit?", "offset?"]
    output: "LabOrder[]"
    side_effects: []

  - method: GET
    path: "/lab-orders/{id}"
    description: "Get a lab order with computed fields"
    roles: [OrderingProvider, Dispatcher, Phlebotomist, LabOps, BillingAgent]
    code: 200
    input: []
    output: LabOrder
    side_effects: []

  - method: POST
    path: "/lab-orders/{id}/appointments"
    description: "Book (or re-book after redraw) an appointment for the order on a route day"
    roles: [Dispatcher]
    code: 201
    input: [route_day_id, window_start_utc, window_end_utc, expected_route_day_version]
    output: Appointment
    side_effects:
      - "Create Appointment in SCHEDULED; phlebotomist_id denormalized from RouteDay"
      - "LabOrder.appointment_id set; LabOrder.status -> SCHEDULED"
      - "RouteDay.booked_stop_count += 1"
      - "increments RouteDay.version by 1"

  - method: GET
    path: "/lab-orders/{id}/appointments"
    description: "List appointments for an order (reverse-reachability for Appointment.lab_order_id)"
    roles: [OrderingProvider, Dispatcher, Phlebotomist, LabOps]
    code: 200
    input: ["limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/lab-orders/{id}/specimens"
    description: "List specimens for an order (reverse-reachability for Specimen.lab_order_id)"
    roles: [OrderingProvider, Dispatcher, Phlebotomist, LabOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Specimen[]"
    side_effects: []

  - method: GET
    path: "/lab-orders/{id}/results"
    description: "List results for an order (reverse-reachability for LabResult.lab_order_id)"
    roles: [OrderingProvider, LabOps, BillingAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "LabResult[]"
    side_effects: []

  - method: GET
    path: "/lab-orders/{id}/invoices"
    description: "List invoices for an order (reverse-reachability for Invoice.lab_order_id)"
    roles: [OrderingProvider, BillingAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/lab-orders/{id}/results"
    description: "Route results to provider/portal once specimens are accessioned"
    roles: [LabOps]
    code: 201
    input: [result_value]
    output: LabResult
    side_effects:
      - "Create LabResult in PENDING_RELEASE; lab_partner_id copied from order"
      - "LabOrder.status -> RESULTED"

  - method: POST
    path: "/lab-orders/{id}/cancel"
    description: "Cancel an order and compensate any active appointment/route day"
    roles: [OrderingProvider]
    code: 200
    input: []
    output: LabOrder
    side_effects:
      - "Active Appointment -> CANCELLED; RouteDay.booked_stop_count -= 1; RouteDay.version += 1"
      - "LabOrder.status -> CANCELLED"

  # --- Appointments (dispatch, kit, arrival, draw) ---
  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment"
    roles: [OrderingProvider, Dispatcher, Phlebotomist, LabOps]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/appointments/{id}/kit"
    description: "Assign a draw kit to a scheduled appointment"
    roles: [Dispatcher]
    code: 201
    input: [kit_lot_number, tube_count]
    output: DrawKit
    side_effects: ["DrawKit created in ASSIGNED for the appointment"]

  - method: GET
    path: "/appointments/{id}/kit"
    description: "List the appointment's draw kits (reverse-reachability for DrawKit.appointment_id)"
    roles: [Dispatcher, Phlebotomist, LabOps]
    code: 200
    input: []
    output: "DrawKit[]"
    side_effects: []

  - method: POST
    path: "/appointments/{id}/dispatch"
    description: "Dispatch the assigned phlebotomist"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> DISPATCHED"]

  - method: POST
    path: "/appointments/{id}/recall"
    description: "Recall a dispatched appointment back to SCHEDULED"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> SCHEDULED"]

  - method: POST
    path: "/appointments/{id}/arrive"
    description: "Phlebotomist marks arrival on-site"
    roles: [Phlebotomist]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> ARRIVED"]

  - method: POST
    path: "/appointments/{id}/specimens"
    description: "Label and collect a specimen tube during the draw"
    roles: [Phlebotomist]
    code: 201
    input: [tube_label]
    output: Specimen
    side_effects:
      - "Create Specimen in COLLECTED; collected_at_utc = server clock; lab_order_id and appointment_id denormalized"
      - "Append first ChainOfCustodyEvent(event_type=COLLECTED, sequence_index=0)"

  - method: GET
    path: "/appointments/{id}/specimens"
    description: "List specimens collected at an appointment (reverse-reachability for Specimen.appointment_id)"
    roles: [Dispatcher, Phlebotomist, LabOps]
    code: 200
    input: ["limit?", "offset?"]
    output: "Specimen[]"
    side_effects: []

  - method: POST
    path: "/appointments/{id}/complete-draw"
    description: "Complete the draw once all required tubes are collected"
    roles: [Phlebotomist]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "Appointment.status -> DRAW_COMPLETED; DrawKit -> CONSUMED"
      - "LabOrder.status -> DRAW_COMPLETED (bubble-up)"

  # --- Specimens & Chain of Custody ---
  - method: GET
    path: "/specimens/{id}"
    description: "Get a specimen"
    roles: [Dispatcher, Phlebotomist, LabOps]
    code: 200
    input: []
    output: Specimen
    side_effects: []

  - method: GET
    path: "/specimens/{id}/custody-events"
    description: "List a specimen's chain-of-custody events (reverse-reachability for ChainOfCustodyEvent.specimen_id)"
    roles: [Dispatcher, Phlebotomist, LabOps, OrderingProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: "ChainOfCustodyEvent[]"
    side_effects: []

  - method: GET
    path: "/custody-events/{id}"
    description: "Get a single custody event by id"
    roles: [Dispatcher, Phlebotomist, LabOps, OrderingProvider]
    code: 200
    input: []
    output: ChainOfCustodyEvent
    side_effects: []

  - method: GET
    path: "/custody-events"
    description: "List custody events, filterable by specimen_id or prior_event_id (reverse-reachability for ChainOfCustodyEvent.specimen_id and the self-referential ChainOfCustodyEvent.prior_event_id)"
    roles: [Dispatcher, Phlebotomist, LabOps, OrderingProvider]
    code: 200
    input: ["specimen_id?", "prior_event_id?", "limit?", "offset?"]
    output: "ChainOfCustodyEvent[]"
    side_effects: []

  - method: POST
    path: "/specimens/{id}/accession"
    description: "Lab accessions a manifested specimen"
    roles: [LabOps]
    code: 200
    input: []
    output: Specimen
    side_effects:
      - "status -> ACCESSIONED; LabOrder.specimens_accessioned_count += 1"
      - "Append ChainOfCustodyEvent(event_type=ACCESSIONED)"
      - "If all manifest specimens terminal: CourierManifest -> DELIVERED"

  - method: POST
    path: "/specimens/{id}/reject-qns"
    description: "Lab rejects a manifested specimen for quantity-not-sufficient"
    roles: [LabOps]
    code: 200
    input: []
    output: Specimen
    side_effects:
      - "status -> QNS_REJECTED; append ChainOfCustodyEvent(event_type=REJECTED_QNS)"
      - "If owning order is DRAW_COMPLETED: order -> REDRAW_REQUIRED (cascade to appointment, route day, phlebotomist strike)"
      - "If all manifest specimens terminal: CourierManifest -> DELIVERED"

  # --- Courier Manifests ---
  - method: POST
    path: "/courier-manifests"
    description: "Open a courier manifest for a lab partner and territory"
    roles: [Dispatcher]
    code: 201
    input: [lab_partner_id, territory_code]
    output: CourierManifest
    side_effects: ["status = BUILDING; specimen_count = 0"]

  - method: GET
    path: "/courier-manifests"
    description: "List courier manifests (reverse-reachability for CourierManifest.lab_partner_id)"
    roles: [Dispatcher, LabOps]
    code: 200
    input: ["lab_partner_id?", "status?", "limit?", "offset?"]
    output: "CourierManifest[]"
    side_effects: []

  - method: GET
    path: "/courier-manifests/{id}"
    description: "Get a courier manifest"
    roles: [Dispatcher, LabOps]
    code: 200
    input: []
    output: CourierManifest
    side_effects: []

  - method: GET
    path: "/courier-manifests/{id}/specimens"
    description: "List specimens on a manifest (reverse-reachability for Specimen.courier_manifest_id)"
    roles: [Dispatcher, LabOps]
    code: 200
    input: ["limit?", "offset?"]
    output: "Specimen[]"
    side_effects: []

  - method: POST
    path: "/courier-manifests/{id}/add-specimen"
    description: "Batch a collected specimen onto a building manifest"
    roles: [Phlebotomist]
    code: 200
    input: [specimen_id]
    output: Specimen
    side_effects:
      - "Specimen.courier_manifest_id set; status -> MANIFESTED; CourierManifest.specimen_count += 1"
      - "Append ChainOfCustodyEvent(event_type=MANIFESTED)"

  - method: POST
    path: "/courier-manifests/{id}/pickup"
    description: "Record courier pickup; manifest goes IN_TRANSIT and SLA clock starts"
    roles: [Dispatcher]
    code: 200
    input: []
    output: CourierManifest
    side_effects:
      - "picked_up_at_utc = server clock; accession_due_utc = picked_up_at_utc + partner SLA hours"
      - "status -> IN_TRANSIT"

  # --- Lab Results ---
  - method: GET
    path: "/lab-results/{id}"
    description: "Get a single lab result by id"
    roles: [OrderingProvider, LabOps, BillingAgent]
    code: 200
    input: []
    output: LabResult
    side_effects: []

  - method: GET
    path: "/lab-results"
    description: "List lab results, filterable by lab_partner_id or lab_order_id (reverse-reachability for LabResult.lab_partner_id and LabResult.lab_order_id)"
    roles: [OrderingProvider, LabOps, BillingAgent]
    code: 200
    input: ["lab_partner_id?", "lab_order_id?", "limit?", "offset?"]
    output: "LabResult[]"
    side_effects: []

  # --- Invoices ---
  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice with computed fee breakdown"
    roles: [OrderingProvider, BillingAgent]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue the invoice; recomputes fees via the active billing variant"
    roles: [BillingAgent]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "Recompute lab_fee_cents, convenience_fee_cents, redraw_waiver_cents, total_cents"
      - "status -> ISSUED"

  - method: POST
    path: "/invoices/{id}/void"
    description: "Void a draft invoice"
    roles: [BillingAgent]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> VOID"]

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock used for collected_at_utc, picked_up_at_utc, and accession_due_utc. Default at startup is 2026-01-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time."
    roles: [LabOps, Dispatcher]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }

  # --- Not found ---
  - { id: ERR_PANEL_NOT_FOUND, http: 404, condition: "Test panel id or panel_code not found" }
  - { id: ERR_LAB_PARTNER_NOT_FOUND, http: 404, condition: "Lab partner not found" }
  - { id: ERR_PHLEBOTOMIST_NOT_FOUND, http: 404, condition: "Phlebotomist not found" }
  - { id: ERR_ROUTE_DAY_NOT_FOUND, http: 404, condition: "Route day not found" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Lab order not found" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Appointment not found" }
  - { id: ERR_SPECIMEN_NOT_FOUND, http: 404, condition: "Specimen not found" }
  - { id: ERR_CUSTODY_EVENT_NOT_FOUND, http: 404, condition: "Chain-of-custody event not found" }
  - { id: ERR_MANIFEST_NOT_FOUND, http: 404, condition: "Courier manifest not found" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice not found" }
  - { id: ERR_KIT_NOT_FOUND, http: 404, condition: "Draw kit not found" }

  # --- Request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, negative integer, window_end <= window_start, or INSURANCE order missing insurance_member_id" }
  - { id: ERR_DUPLICATE_TUBE_LABEL, http: 409, condition: "tube_label already used within the same lab order" }

  # --- Concurrency ---
  - { id: ERR_ROUTE_DAY_VERSION_STALE, http: 412, condition: "expected_route_day_version does not match the RouteDay's current version at booking" }

  # --- Order state ---
  - { id: ERR_ORDER_NOT_SCHEDULABLE, http: 409, condition: "Booking attempted on an order not in ORDERED or REDRAW_REQUIRED" }
  - { id: ERR_ORDER_NOT_RESULTABLE, http: 409, condition: "Results posted on an order not in DRAW_COMPLETED" }
  - { id: ERR_ORDER_NOT_RESULTED, http: 409, condition: "Invoice issue attempted while owning order is not RESULTED" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted on an order not in {ORDERED, SCHEDULED, REDRAW_REQUIRED}" }
  - { id: ERR_SPECIMENS_NOT_ACCESSIONED, http: 409, condition: "Results posted before specimens_accessioned_count == specimens_required_count" }

  # --- Appointment state ---
  - { id: ERR_APPOINTMENT_NOT_DISPATCHABLE, http: 409, condition: "Dispatch attempted on an appointment not in SCHEDULED" }
  - { id: ERR_APPOINTMENT_NOT_RECALLABLE, http: 409, condition: "Recall attempted on an appointment not in DISPATCHED" }
  - { id: ERR_APPOINTMENT_NOT_ARRIVABLE, http: 409, condition: "Arrive attempted on an appointment not in DISPATCHED" }
  - { id: ERR_APPOINTMENT_NOT_ARRIVED, http: 409, condition: "Complete-draw attempted on an appointment not in ARRIVED" }
  - { id: ERR_NOT_ASSIGNED_PHLEBOTOMIST, http: 403, condition: "Acting phlebotomist (X-User-ID) is not the appointment's assigned phlebotomist" }
  - { id: ERR_KIT_NOT_ASSIGNED, http: 409, condition: "Dispatch attempted without a kit whose tube_count covers specimens_required_count" }
  - { id: ERR_SPECIMEN_COUNT_MISMATCH, http: 409, condition: "Collected specimen count does not equal specimens_required_count at complete-draw" }

  # --- Booking constraints ---
  - { id: ERR_ROUTE_DAY_CLOSED, http: 409, condition: "Booking attempted on a CLOSED route day" }
  - { id: ERR_ROUTE_DAY_FULL, http: 409, condition: "RouteDay.booked_stop_count would meet or exceed stop_capacity" }
  - { id: ERR_TERRITORY_MISMATCH, http: 409, condition: "Territory mismatch between order/route day or order/manifest" }
  - { id: ERR_APPOINTMENT_WINDOW_CONFLICT, http: 409, condition: "Requested window falls outside the shift or overlaps (half-open) another booked window on the route day" }
  - { id: ERR_ROUTE_DAY_SHIFT_OVERLAP, http: 409, condition: "New route day's shift window overlaps (closed-interval, touching endpoints conflict) an existing OPEN route day of the same phlebotomist" }

  # --- Specimen / manifest state ---
  - { id: ERR_SPECIMEN_NOT_MANIFESTABLE, http: 409, condition: "Add-specimen attempted on a specimen not in COLLECTED" }
  - { id: ERR_SPECIMEN_NOT_ACCESSIONABLE, http: 409, condition: "Accession attempted on a specimen not in MANIFESTED" }
  - { id: ERR_SPECIMEN_NOT_REJECTABLE, http: 409, condition: "QNS rejection attempted on a specimen not in MANIFESTED" }
  - { id: ERR_MANIFEST_NOT_BUILDING, http: 409, condition: "Add-specimen or pickup attempted on a manifest not in BUILDING" }
  - { id: ERR_MANIFEST_NOT_IN_TRANSIT, http: 409, condition: "Accession or QNS rejection attempted while parent manifest is not IN_TRANSIT" }
  - { id: ERR_MANIFEST_EMPTY, http: 409, condition: "Pickup attempted on a manifest with specimen_count == 0" }
  - { id: ERR_LAB_PARTNER_SUSPENDED, http: 409, condition: "Pickup routed to a SUSPENDED lab partner" }
  - { id: ERR_LAB_PARTNER_MISMATCH, http: 409, condition: "Specimen's order lab_partner_id differs from the manifest's lab_partner_id" }

  # --- Business referential ---
  - { id: ERR_PANEL_NOT_ACCEPTED_BY_PARTNER, http: 409, condition: "Ordered panel is RETIRED or not in the lab partner's accepted_panel_codes" }
  - { id: ERR_PHLEBOTOMIST_UNAVAILABLE, http: 409, condition: "Assigned phlebotomist is not certification_active or status != AVAILABLE at dispatch" }

  # --- Invoice state ---
  - { id: ERR_INVOICE_NOT_ISSUABLE, http: 409, condition: "Issue attempted on an invoice not in DRAFT" }
  - { id: ERR_INVOICE_NOT_VOIDABLE, http: 409, condition: "Void attempted on an invoice not in DRAFT" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: OrderingProvider
    description: "Clinician who creates lab orders, cancels them, and views results/invoices for their patients"
    identity: "opaque"
    exclusive_operations:
      - "POST /lab-orders — create order"
      - "POST /lab-orders/{orderId}/cancel — cancel order"
    shared_operations:
      - "GET /lab-orders, GET /lab-orders/{orderId}"
      - "GET /lab-orders/{orderId}/appointments, /specimens, /results, /invoices"
      - "GET /test-panels, /test-panels/{panelId}, /lab-partners, /lab-partners/{partnerId}"
      - "GET /appointments/{apptId}, /specimens/{specimenId}/custody-events, /custody-events/{eventId}"
      - "GET /invoices/{invoiceId}"

  - name: Dispatcher
    description: "Operations coordinator who manages phlebotomists, route days, appointment booking/dispatch/recall, kit assignment, and courier manifests"
    identity: "opaque"
    exclusive_operations:
      - "POST /phlebotomists, POST /phlebotomists/{phlebId}/route-days"
      - "POST /route-days/{routeDayId}/close"
      - "POST /lab-orders/{orderId}/appointments — book/re-book"
      - "POST /appointments/{apptId}/kit — assign kit"
      - "POST /appointments/{apptId}/dispatch, /appointments/{apptId}/recall"
      - "POST /courier-manifests, POST /courier-manifests/{manifestId}/pickup"
    shared_operations:
      - "GET endpoints across orders, appointments, route-days, phlebotomists, specimens, manifests, panels, partners"

  - name: Phlebotomist
    description: "Field collector who arrives on-site, labels/collects specimens, completes the draw, and batches specimens onto a manifest"
    identity: "entity_backed:Phlebotomist"
    exclusive_operations:
      - "POST /appointments/{apptId}/arrive — must be the assigned phlebotomist"
      - "POST /appointments/{apptId}/specimens — collect & label tube"
      - "POST /appointments/{apptId}/complete-draw"
      - "POST /courier-manifests/{manifestId}/add-specimen"
    shared_operations:
      - "GET /appointments/{apptId}, /lab-orders/{orderId}, /specimens/{specimenId}, custody-events, /appointments/{apptId}/kit"

  - name: LabOps
    description: "Lab-side operator who configures panels/partners, accessions or QNS-rejects specimens, and routes results"
    identity: "opaque"
    exclusive_operations:
      - "POST /test-panels, /test-panels/{panelId}/retire"
      - "POST /lab-partners, /lab-partners/{partnerId}/suspend"
      - "POST /specimens/{specimenId}/accession, /specimens/{specimenId}/reject-qns"
      - "POST /lab-orders/{orderId}/results"
    shared_operations:
      - "GET endpoints across orders, specimens, manifests, route-days, phlebotomists, panels, partners, custody-events"
      - "POST /_clock/set_current_utc (shared with Dispatcher)"

  - name: BillingAgent
    description: "Revenue-cycle operator who issues and voids invoices"
    identity: "opaque"
    exclusive_operations:
      - "POST /invoices/{invoiceId}/issue, /invoices/{invoiceId}/void"
    shared_operations:
      - "GET /invoices/{invoiceId}, GET /lab-orders/{orderId}/invoices"
      - "GET /lab-orders, /lab-orders/{orderId}, /test-panels, /lab-partners, /lab-orders/{orderId}/results"
