        grounds:
          - validations[priority=31]
          - errors.ERR_REAPPLICATION_INTERVAL_CONFLICT
        excluded_because:
          difficulty_instance: field_reapplication_symmetric_twenty_one_day_buffer
          rationale: "That §1.8 resource-overlap instance drives priority 31 forward and backward across the buffer and asserts the first accepted event outside it."
