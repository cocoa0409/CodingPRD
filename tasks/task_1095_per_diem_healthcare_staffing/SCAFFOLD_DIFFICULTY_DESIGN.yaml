  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_state_beats_credential_safety_on_claim
        grounds:
          - validations[priority=65]
          - validations[priority=75]
          - errors[ERR_CLINICIAN_SUSPENDED]
          - errors[ERR_CREDENTIAL_MISSING]
          - state_machines.Clinician.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Category pair `state` (priority 65, ERR_CLINICIAN_SUSPENDED) versus `business_safety`
          (priority 75, ERR_CREDENTIAL_MISSING): a suspended clinician whose licence has also
          been revoked gets the STATE error, proving the suspension gate runs before the
          compliance gate.
        test_recipe:
          setup:
            - "Clock at 2026-06-09T15:30Z."
            - "Clinician Ivo Marek was suspended by two PENDING NO_SHOW events (provisional score 40 < 60) and his RN_LICENSE has since been REVOKED by a ComplianceOfficer."
            - "A fresh OPEN Shift 2026-06-16T07:00Z..19:00Z exists under a second order at the same facility."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/facilities"
              payload: { name: "North Vale", unit_name: "ICU", unit_capacity: 2, required_credential_types: ["RN_LICENSE"] }
              as: PlatformAdmin
