              payload: {}
              as: Underwriter
              captures: { err_state: $.data.error_id }
            - call: "GET /open-policies/${pol_id}"
              payload: {}
              as: Underwriter
          assert:
            - "${err_state} == \"ERR_INVALID_STATE\" with HTTP 409"
            - "OpenPolicy.${pol_id}.status == \"ACTIVE\" and version == 2 — the rejected activate did not bump the version"

