  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: vehicle_operability_restored_after_recovery_compensation
        grounds:
          - state_machines.StolenVehicleCase
          - state_machines.Vehicle
          - concurrency_rules[subscription-convert-stale-version]
        distinguishing_aspect: |
          Conserved quantity: the count of non-terminal StolenVehicleCase rows
          with Vehicle.status == STOLEN_REPORTED for a vehicle. Forward action
          (verify) raises it to 1; the compensating close-recovered returns it
          to 0 AND restores Vehicle.status to an operable state — no drift in
          the vehicle's operability invariant after the full cycle.
        test_recipe:
          setup:
            - "Clock 2026-09-01. SAFETY tier, zone TX, account A1, gen-5 vehicle V1 ACTIVE, TRIAL subscription. Stolen case K1 reported (officer LE-1)."
          setup_api_calls:
            - *t_safety
            - *z_tx
            - *acct_a1
            - *veh_v1
            - *sub_s1
            - call: "POST /vehicles/${veh_v1}/stolen-cases"
              payload: { police_report_number: "TX-2026-0042", reporting_agency: "Austin PD" }
              as: LawEnforcement
              as_user_id: "le-officer-1"
              captures: { svc_i1: $.data.id }
          trigger:
            - call: "POST /vehicles/${veh_v1}/stolen-cases/${svc_i1}/verify"
              payload: {}
              as: LawEnforcement
              as_user_id: "le-officer-2"
            - call: "POST /vehicles/${veh_v1}/stolen-cases/${svc_i1}/arm-slowdown"
              payload: {}
              as: EmergencyOperator
              as_user_id: "eo-ops-1"
            - call: "POST /vehicles/${veh_v1}/stolen-cases/${svc_i1}/execute-slowdown"
              payload: {}
              as: EmergencyOperator
              as_user_id: "eo-ops-1"
            - call: "POST /vehicles/${veh_v1}/stolen-cases/${svc_i1}/close-recovered"
              payload: {}
              as: LawEnforcement
              as_user_id: "le-officer-2"
            - call: "PATCH /vehicles/${veh_v1}"
              payload: { status: "ACTIVE" }
              as: Account
              as_user_id: "${acct_a1}"
          assert:
            - "mid-cycle: Vehicle.${veh_v1}.status == STOLEN_REPORTED and StolenVehicleCase.${svc_i1}.status == SLOWDOWN_EXECUTED (invariant violated = 1 open impaired vehicle)"
            - "after compensation: StolenVehicleCase.${svc_i1}.status == CLOSED_RECOVERED and Vehicle.${veh_v1}.status == RECOVERED, then ACTIVE"
            - "end-state invariant: count(open stolen cases impairing V1) == 0 and Vehicle.${veh_v1}.status == ACTIVE — exactly the pre-cycle operability"
            - "StolenVehicleCase.${svc_i1}.slowdown_executed_at is non-null (compensation does not erase history)"

      - name: appointment_cancel_compensates_report_schedule_pointer
        grounds:
          - state_machines.ServiceAppointment.REQUESTED_to_CONFIRMED
          - state_machines.ServiceAppointment.CONFIRMED_to_CANCELLED
          - entities.DiagnosticReport.fields.status
        distinguishing_aspect: |
          Different conserved quantity: the number of DiagnosticReport rows in
          SERVICE_SCHEDULED without a live (non-cancelled) appointment must be
          zero. Confirm raises the pointer count; cancel of the only
          referencing appointment must return the report to GENERATED —
          conserved count of orphaned SERVICE_SCHEDULED reports stays 0.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Zone TX. Dealer D1 capacity 3. Account A1, vehicle V1, report R1. Appointment AP1 on D1 for 2026-09-15 confirmed."
          setup_api_calls:
            - *t_safety
            - *z_tx
            - *acct_a1
            - *veh_v1
            - *sub_s1
            - call: "POST /dealers"
              payload: { name: "Capitol Chevrolet", region_code: "TX", service_capacity_per_day: 3 }
              as: PlatformAdmin
              captures: { dl_d1: $.data.id }
            - call: "POST /vehicles/${veh_v1}/diagnostic-reports"
              payload: { odometer_km: 40000, engine_hours: 1600, dtc_codes: ["P0300"], oil_life_pct: 20 }
              as: SystemIngestion
              captures: { dr_j1: $.data.id }
            - call: "POST /dealers/${dl_d1}/appointments"
              payload: { vehicle_id: "${veh_v1}", diagnostic_report_id: "${dr_j1}", scheduled_date: "2026-09-15" }
              as: DealerService
              captures: { ap_j1: $.data.id }
            - call: "POST /dealers/${dl_d1}/appointments/${ap_j1}/confirm"
              payload: {}
              as: DealerService
          trigger:
            - call: "POST /dealers/${dl_d1}/appointments/${ap_j1}/cancel"
              payload: {}
              as: DealerService
          assert:
            - "before cancel: DiagnosticReport.${dr_j1}.status == SERVICE_SCHEDULED"
            - "after cancel: ServiceAppointment.${ap_j1}.status == CANCELLED and DiagnosticReport.${dr_j1}.status == GENERATED (compensation reverts the report)"
            - "invariant: no DiagnosticReport sits in SERVICE_SCHEDULED with zero live referencing appointments"
            - "a second confirm attempt on ${ap_j1} now fails with ERR_INVALID_STATE (CANCELLED is terminal)"
