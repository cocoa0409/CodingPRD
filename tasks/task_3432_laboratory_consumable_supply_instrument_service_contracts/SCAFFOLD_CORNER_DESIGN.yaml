            - "Order.${o2} remains DRAFT"

      - name: pm_without_contract_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=7]", "errors[ERR_CONTRACT_REQUIRED]"]
        distinguishing_aspect: "The PM entitlement check is conditional on contract presence: a PREVENTIVE_MAINTENANCE request on an instrument with no live contract fails 422 ERR_CONTRACT_REQUIRED while a BREAK_FIX on the same instrument succeeds."
        test_recipe:
