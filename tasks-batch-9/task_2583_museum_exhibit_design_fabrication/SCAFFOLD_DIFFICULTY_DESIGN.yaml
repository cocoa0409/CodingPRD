  - rule_id: boundary_precision_check
    instances:
      - name: three_simultaneous_inclusive_equalities_keep_the_case_envelope_feasible
        grounds:
          - calculations.case_environmental_envelope
          - validations.priority_66
          - entities.ArtifactCase.fields.case_volume_m3
          - entities.ArtifactCase.fields.silica_gel_kg
        distinguishing_aspect: |
          The feasibility test has four inclusive comparisons and this case sits
          exactly on three of them at once: target_rh - tolerance == 50.0 - 2.0
          == 48.0 == required_rh_min_pct, target_rh + tolerance == 52.0 ==
          required_rh_max_pct, and target_lux == 50.0 == allowed_lux. Every one
          must use >= / <= rather than > / <, so a single strict comparison
          anywhere in the chain flips the case to infeasible. Adding a third
          object whose max_lux is 49.0 - one lux below the case setting - then
          has to fail, which proves the check is genuinely evaluated on the
          strictest member rather than on the case's own numbers. The derived
          geometry fields carry their own rounding boundary: 0.648 m3 stored at
          four decimals and 0.9072 kg of silica gel rounded half-up to 0.91.
        test_recipe:
