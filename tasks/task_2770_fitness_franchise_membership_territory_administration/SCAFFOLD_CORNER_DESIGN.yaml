          - state_machines.RelocationRequest.initial_state
          - entities.RelocationRequest.fields.revision_count
          - entities.RelocationRequest.fields.encroachment_km
          - endpoints[POST /franchise/relocation-requests]
        distinguishing_aspect: "A newly created relocation request is DRAFT with revision_count 0, encroachment_km still null and submitted_by_user_id null - the encroachment geometry is deliberately NOT evaluated at draft time, only on submit, so a draft may legally hold coordinates that would be rejected."
        test_recipe:
          setup:
            - "One franchisee with one OPEN CA club at 34.0 / -118.0."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harborline Fitness LLC", contact_email: "ops@harborlinefit.example" }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t1_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t1_id}", name: "Harborline Downtown", opened_on: "2024-05-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /franchise/clubs/${c1_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
          trigger:
            - call: "POST /franchise/relocation-requests"
              payload: { club_id: "${c1_id}", requested_lat: 34.02, requested_lng: -118.02, requested_radius_km: 5.0, justification: "Anchor tenant lease not renewed; moving two miles north." }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { rr_id: $.data.id }
          assert:
            - "response status == 201"
            - "RelocationRequest.${rr_id}.status == DRAFT"
            - "RelocationRequest.${rr_id}.revision_count == 0"
            - "RelocationRequest.${rr_id}.encroachment_km == null"
            - "RelocationRequest.${rr_id}.submitted_by_user_id == null"
            - "RelocationRequest.${rr_id}.decided_by_user_id == null"
            - "RelocationRequest.${rr_id}.version == 1"
            - "Territory.${t1_id}.center_lat == 34.0"
            - "Territory.${t1_id}.relocation_count == 0"

      - name: corner_territory_bubbles_up_to_active_when_its_first_club_opens
        claim_type: bubble_up
        grounds:
          - state_machines.Territory.RESERVED_to_ACTIVE
          - state_machines.Club.PRE_OPENING_to_OPEN
        distinguishing_aspect: "Opening the club is what promotes the parent territory: before the call the territory is RESERVED at version 1, after it the territory is ACTIVE at version 2 even though no request touched the territory endpoint - and the club's own version also advances to 2."
        test_recipe:
          setup:
            - "One franchisee with one RESERVED CA territory holding one PRE_OPENING club."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harborline Fitness LLC", contact_email: "ops@harborlinefit.example" }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t1_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t1_id}", name: "Harborline Downtown", opened_on: "2024-05-01", guest_fee_cents: 1250 }
