              as_user_id: "ca-reviewer-1"
              captures: { det_a_id: $.data.id, det_a_initial_state: $.data.determination_state }
            - call: "POST /pbra/restructuring-determinations"
              payload: { renewal_case_id: "${case_b_id}" }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
              captures: { det_b_id: $.data.id }
          trigger:
            - call: "POST /pbra/restructuring-determinations/${det_a_id}/evaluate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
              captures: { det_a_state: $.data.determination_state, det_a_reason: $.data.eligibility_reason_code }
            - call: "POST /pbra/restructuring-determinations/${det_b_id}/evaluate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
