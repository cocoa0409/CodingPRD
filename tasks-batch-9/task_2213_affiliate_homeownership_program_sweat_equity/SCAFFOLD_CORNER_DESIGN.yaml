            - { call: "POST /homeownership/shift-assignments/${asg_b}/confirm", payload: {}, as: Volunteer, as_user_id: "${vol_b}" }
            - { call: "GET /homeownership/construction-shifts/${shift_id}", as: ConstructionManager, as_user_id: "cm-1", captures: { sv3: $.data.version } }
            - { call: "POST /homeownership/shift-assignments", payload: { shift_id: "${shift_id}", expected_shift_version: "${sv3}", role: "GENERAL_VOLUNTEER", volunteer_id: "${vol_c}" }, as: ConstructionManager, as_user_id: "cm-1", captures: { asg_c: $.data.id } }
