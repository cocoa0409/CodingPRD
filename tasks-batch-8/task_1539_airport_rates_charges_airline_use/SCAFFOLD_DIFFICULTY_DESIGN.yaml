            - "FiscalYear.${fy_cas_id}.status == CLOSED (cascade hop 2)"
            - "RatesSetting.${rs_cas_draft_id}.status == EXPIRED (cascade hop 3 — triggered by FY closure, not by finalize directly)"

      - name: airline_decline_renewal_cascade_to_mii_tally_exclusion
        grounds:
          - state_machines.AirlineAgreement
          - calculations.mii_tally
        distinguishing_aspect: |
          Cascade of depth 2 from decline-renewal trigger:
          decline → AirlineAgreement.signature_status=NON_SIGNATORY →
          recomputation of in-flight CapitalProject votes_for_count and
          votes_for_weight_kg excluding this airline's previously-cast APPROVE
