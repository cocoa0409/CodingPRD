          - validations.priority_20
          - validations.priority_27
          - errors.ERR_FACILITY_AUDIT_NOT_PASSED
        distinguishing_aspect: |
          Sanitation (19) is deliberately satisfied and everything after 20 is deliberately
          broken - the product has no ingredients, no testing plan and no approved label - so
          the response pins the ordering: the audit gate must win over ERR_INGREDIENT_NOT_APPROVED
          (25), ERR_TESTING_PLAN_NOT_ACTIVE (27) and ERR_LABEL_NOT_APPROVED (28). NONE (never
          audited) fails the same way CLOSED_FAIL does.
        test_recipe:
          setup:
            - "One applicant and one facility whose sanitation is VALIDATED but which has never been audited, so last_closed_audit_outcome is NONE."
            - "One product on that facility with no ingredients, no testing plan and label NOT_SUBMITTED."
