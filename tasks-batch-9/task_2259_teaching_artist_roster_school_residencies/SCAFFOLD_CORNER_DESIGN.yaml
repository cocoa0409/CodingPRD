            - call: "POST /teaching-artists/${a2_id}/vetting"
              payload: { to_vetting_status: "DEMO_SCHEDULED" }
              as: RosterCoordinator
              captures: { e_threshold: $.data.error_id }
            - call: "POST /teaching-artists/${a2_id}/portfolio-reviews"
              payload: { reviewer_user_id: "panelist-3", artistic_quality_score: 4.0, pedagogical_clarity_score: 3.8, cultural_responsiveness_score: 3.6 }
              as: CurriculumSpecialist
              captures: { c3: $.data.composite_score }
