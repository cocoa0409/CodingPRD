  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: finalize_wrong_state_beats_workers_comp_safety
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WORKERS_COMP_REQUIRED]
        distinguishing_aspect: |
          Category pair state vs business_safety: finalizing an OPEN pay run
          for an employer whose posture is RESTRICTED (workers' comp mandate
          uncovered) returns ERR_INVALID_STATE (priority 6), never
          ERR_EMPLOYER_RESTRICTED or ERR_WORKERS_COMP_REQUIRED (priority 7).
        test_recipe:
          setup:
            - "Employer in state EE (workers_comp_required true), only NEW_HIRE registration ACTIVE, status ACTIVE"
            - "Worker ACTIVE (classification EMPLOYEE, agreement 3000/h guarantee 2400); no workers-comp policy -> posture RESTRICTED"
            - "Pay run 2026-01-05..2026-01-12 created, left OPEN (never calculated)"
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "EE", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.0, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: true, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
