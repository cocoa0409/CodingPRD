              captures: { err2: $.data.error_id }
            - call: "POST /nature-center/trail-segments/${trail_id}/set-status"
              payload: { status: "RESTORATION_REST" }
              as: StewardshipManager
              as_user_id: "sm-01"
              captures: { err3: $.data.error_id }
          assert:
            - "${err1} == ERR_INVALID_PERMIT_STATE"
            - "${err2} == ERR_INVALID_ANIMAL_STATE"
            - "${err3} == ERR_INVALID_TRAIL_STATE"
            - "HTTP status == 409 on all three calls"
            - "Permit.${lap_permit}.status == LAPSED"
            - "AnimalAmbassador.${an_id}.status == VET_HOLD"
            - "AnimalAmbassador.${an_id}.welfare_posture == BLOCKED"
            - "TrailSegment.${trail_id}.status == CLOSED"
