              captures: { app1_id: "$.data.id" }
            - call: "POST /installations/${inst_id}/waitlist-offer-run"
              payload: {}
              as: PropertyManager
            - call: "GET /waitlist-applications/${app1_id}"
              payload: {}
              as: PropertyManager
              captures: { w_exp: "$.data.offer_expires_at", w_status: "$.data.status" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-28T00:00:01Z" }
