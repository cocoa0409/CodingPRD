            - call: "POST /warewashing/service-visits/${visit_id}/verify"
              payload: { decision: "VERIFIED" }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { vst_2: $.data.visit_status, verifier: $.data.verified_by_user_id }
            - call: "GET /warewashing/dispensers/${disp_id}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { disp_st2: $.data.dispenser_status, reason_2: $.data.lockout_reason, dose: $.data.calibrated_dose_ml_per_rack, prior: $.data.prior_dose_ml_per_rack, last_drift: $.data.last_drift_pct, last_cal: $.data.last_calibrated_at }
            - call: "GET /warewashing/machine-placements/${pl_id}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { pop: $.data.operational_status, csc: $.data.cycles_since_calibration }
          assert:
            - "${disp_st0} == ACTIVE and ${score} == 100 with ${dl} == 2026-08-01T18:00:00Z (480-minute band from the 10:00 clock)"
            - "${drift_1} == 0.00 yet ${eff_1} == FAIL (contact_seconds 5 < min_contact_seconds 7) and ${verdict_1} == FAIL - branch 1 of the verdict ladder, not a drift threshold"
            - "${disp_st1} == LOCKED_OUT with ${reason_1} == EFFICACY_FAILURE and the placement health axis is DOWN"
            - "${err} == ERR_EFFICACY_FAILURE_UNRESOLVED (409) - the visit cannot leave IN_PROGRESS yet"
            - "the second record is accepted even though the dispenser is LOCKED_OUT: ${eff_2} == PASS, ${drift_2} == 0.00, ${verdict_2} == PASS"
            - "${vst} == SUBMITTED with ${crc} == 2, then ${vst_2} == VERIFIED and ${verifier} == auditor-1"
            - "${disp_st2} == ACTIVE with ${reason_2} == null - the loop is closed by the later PASS on the same dispenser"
            - "${dose} == 2.00, ${prior} == 2.00, ${last_drift} == 0.00 and ${last_cal} == the verify instant - the dispenser was updated from the LAST record of the visit, not the first"
            - "both records now have applied == true, and ${csc} == 0 with ${pop} == UP; the ticket is CLOSED and the technician's open_ticket_count is back to 0"

  - section: calculations
    instances:
      - name: delivery_tiers_round_the_discounted_unit_price_before_multiplying
        claim_type: tiered_pricing
        grounds:
          - calculations.delivery_amount
          - endpoints[POST /warewashing/chemical-deliveries]
        distinguishing_aspect: |
          Four deliveries of a product priced at 9605 cents straddle both tier boundaries and the odd
          price makes the rounding ORDER observable: at 10 units round_half_up(9605 x 0.95) = 9125 gives
          91250 while the wrong "multiply then round" order gives 91248, and at 25 units
          round_half_up(9605 x 0.88) = 8452 gives 211300 against 211310. The 24-unit and 25-unit rows
          also show the tier is marginal-free - 25 units costs less in total than 24.
        test_recipe:
          setup:
            - "One customer with one ACTIVE agreement covering DET-105 (unit_price_cents 9605, unit_size_ml 20000) and one site."
            - "Each delivery bumps Site.version, so the site is re-read before every create to supply a fresh OCC token."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-105", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9605 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Grill Main Line", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id, sv1: $.data.version }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-C1", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /warewashing/chemical-deliveries"
              payload: { site_id: "${site_id}", product_id: "${det_id}", delivered_at: "2026-08-01T00:00:00Z", unit_count: 9, expected_site_version: "${sv1}" }
              as: AccountManager
              captures: { amt_9: $.data.amount_cents, qty_9: $.data.quantity_ml, dstat: $.data.status }
            - call: "GET /warewashing/sites/${site_id}"
              payload: {}
              as: AccountManager
              captures: { sv2: $.data.version }
            - call: "POST /warewashing/chemical-deliveries"
              payload: { site_id: "${site_id}", product_id: "${det_id}", delivered_at: "2026-08-01T00:00:00Z", unit_count: 10, expected_site_version: "${sv2}" }
              as: AccountManager
              captures: { amt_10: $.data.amount_cents, qty_10: $.data.quantity_ml }
            - call: "GET /warewashing/sites/${site_id}"
              payload: {}
              as: AccountManager
              captures: { sv3: $.data.version }
            - call: "POST /warewashing/chemical-deliveries"
              payload: { site_id: "${site_id}", product_id: "${det_id}", delivered_at: "2026-08-01T00:00:00Z", unit_count: 24, expected_site_version: "${sv3}" }
              as: AccountManager
              captures: { amt_24: $.data.amount_cents }
            - call: "GET /warewashing/sites/${site_id}"
              payload: {}
              as: AccountManager
              captures: { sv4: $.data.version }
            - call: "POST /warewashing/chemical-deliveries"
              payload: { site_id: "${site_id}", product_id: "${det_id}", delivered_at: "2026-08-01T00:00:00Z", unit_count: 25, expected_site_version: "${sv4}" }
              as: AccountManager
              captures: { amt_25: $.data.amount_cents, qty_25: $.data.quantity_ml }
          assert:
            - "${amt_9} == 86445 and ${qty_9} == 180000 - below TIER_1_MIN_UNITS there is no discount"
            - "${amt_10} == 91250 and ${qty_10} == 200000 - the 5% tier opens AT 10 units and the unit price is rounded first (91248 is the wrong order)"
            - "${amt_24} == 219000 - still the 5% tier one unit below the next boundary"
            - "${amt_25} == 211300 and ${qty_25} == 500000 - the 12% tier opens AT 25 units (211310 is the wrong order), and 25 units costs LESS in total than 24"
            - "${dstat} == DELIVERED for every row"

      - name: rack_counts_exclude_manual_audit_readings_and_the_closing_boundary
        claim_type: Input Set Filtering
        grounds:
          - calculations.rack_count_in_period
          - entities.TelemetryReading.fields.source
          - entities.TelemetryReading.fields.cycle_delta
        distinguishing_aspect: |
          A MANUAL_AUDIT reading sits between two DEVICE readings: it contributes no racks AND it is not
          the predecessor of the next DEVICE reading, so that reading's cycle_delta is measured from the
          earlier DEVICE row (1000 - 400 = 600, not 1000 - 900 = 100). The window is half-open, so the
          same data yields 300 racks up to period_end 2026-08-10T00:00:00Z and 900 racks when the window
          is widened past that reading - attribution is by reading_at with no interpolation.
        test_recipe:
          setup:
            - "One INSTALLED DT-88 placement with initial_cycle_count 100, installed at 2026-08-01T00:00:00Z."
            - "The clock is advanced to 2026-08-10T00:00:00Z before the readings are posted, because reading_at must be <= current_utc."
            - "All temperatures and pressures are compliant so no alert interferes."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
