            - "2026-10-31, one day BEFORE the due date: ${r0_past_due} == 0, ${r0_fees} == 0, ${r0_late} == 0 — the past-due comparison is due_date < clock_date, so an installment due today is not yet late"
            - "2026-11-11, exactly due_date + grace_period_days: ${r1_past_due} == 2 and ${r1_late} == 2, but ${r1_fees} == 0; ${r1_g1_stage} == 'LATE', ${r1_g1_fee_bal} == 0 and ${r1_g1_count} == 0 — ON the grace boundary nothing is charged"
            - "2026-11-12, one day past the boundary: ${r2_past_due} == 0 (both installments are already PAST_DUE) and ${r2_fees} == 2, ${r2_late} == 0"
            - "${g1_fee_amount} == 7738 with ${g1_fee_date} == '2026-11-12' and ${g1_fee_installment} == 1 — round_half_up(154761 * 500 / 10000) == round_half_up(7738.05); truncation would report 7738 too, but round-half-down on the .05 would not, and the clamp leaves it untouched because 500 <= 7738 <= 10000"
            - "${g2_fee_amount} == 500 with ${g2_fee_date} == '2026-11-12' — the raw fee is round_half_up(9083 * 500 / 10000) == round_half_up(454.15) == 454, which the late_fee_min_cents floor then lifts to 500; clamping before rounding, or forgetting the floor, reports 454"
            - "a fourth servicing run on 2026-11-13 adds nothing: late_fees_assessed == 0, because a non-REVERSED LateFeeAssessment already exists for each (agreement, installment_number) pair"

      - name: minimum_down_payment_exact_equality_on_submit
        grounds:
          - validations.priority_26_ERR_DOWN_PAYMENT_BELOW_MINIMUM
          - entities.StateRateRule.fields.min_down_payment_bps
          - endpoints.POST_agreements_agreement_id_submit
          - errors.ERR_DOWN_PAYMENT_BELOW_MINIMUM
        distinguishing_aspect: |
          A DIFFERENT metric on a DIFFERENT endpoint: a basis-point ratio between two money amounts,
          checked by POST /agreements/{agreement_id}/submit, rather than a calendar-day count checked
          by the servicing run. The rule is stated as the cross-multiplication
          down_payment_cents * 10000 >= total_premium_cents * min_down_payment_bps with equality
          passing, so the interesting point is the exact 20 percent of 600000 and the single cent
          below it. An implementation that divides into a float percentage, or that uses a strict
          greater-than, fails on the equality note.
        test_recipe:
          setup:
            - "logical clock at 2026-08-15; one CA StateRateRule (min_down_payment_bps 2000, service-fee cap 1500, max_term_months 8) with an effective License; one Insured; one ProducerAgent; one Insurer"
            - "three DRAFT agreements identical except for down_payment_cents (119999, 120000, 120001), each carrying one policy quoted at exactly 600000, service fee 1500, 6 installments, first due 2026-10-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "CA", finance_charge_method: "SIMPLE_INTEREST", max_annual_rate_bps: 1200, max_service_fee_cents: 1500, min_down_payment_bps: 2000, max_term_months: 8, late_fee_bps: 1000, late_fee_min_cents: 1000, late_fee_max_cents: 1500, grace_period_days: 7, noic_notice_days: 15, unearned_premium_method: "SHORT_RATE", short_rate_penalty_bps: 1000, rebate_method: "ACTUARIAL", max_late_fees_per_agreement: 2, license_required: true }
              as: ComplianceOfficer
              captures: { rule_ca: "$.data.id" }
            - call: "POST /state-rate-rules/${rule_ca}/licenses"
              payload: { license_number: "PFC-CA-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Pacific Cartage Inc", mailing_state_code: "CA", email: "ap@pacific.example" }
              as: FinanceAnalyst
              captures: { insured_2: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Golden Gate Brokers", state_code: "CA", agent_commission_bps: 1000, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { agent_2: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { insurer_1: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${insured_2}", producer_agent_id: "${agent_2}", state_rule_id: "${rule_ca}", down_payment_cents: 119999, service_fee_cents: 1500, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { agr_low: "$.data.id" }
            - call: "POST /agreements/${agr_low}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-CA-8001", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
            - call: "POST /agreements"
              payload: { insured_id: "${insured_2}", producer_agent_id: "${agent_2}", state_rule_id: "${rule_ca}", down_payment_cents: 120000, service_fee_cents: 1500, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { agr_eq: "$.data.id" }
            - call: "POST /agreements/${agr_eq}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-CA-8002", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
            - call: "POST /agreements"
              payload: { insured_id: "${insured_2}", producer_agent_id: "${agent_2}", state_rule_id: "${rule_ca}", down_payment_cents: 120001, service_fee_cents: 1500, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { agr_high: "$.data.id" }
            - call: "POST /agreements/${agr_high}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-CA-8003", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
          trigger:
            - call: "POST /agreements/${agr_low}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { low_error: "$.data.error_id" }
            - call: "POST /agreements/${agr_eq}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { eq_status: "$.data.status", eq_af: "$.data.amount_financed_cents", eq_rate: "$.data.effective_annual_rate_bps", eq_fc: "$.data.finance_charge_cents", eq_top: "$.data.total_of_payments_cents" }
            - call: "POST /agreements/${agr_high}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { high_status: "$.data.status", high_af: "$.data.amount_financed_cents", high_fc: "$.data.finance_charge_cents" }
            - call: "GET /agreements/${agr_low}"
              payload: {}
              as: FinanceAnalyst
              captures: { low_status: "$.data.status", low_basis: "$.data.quote_basis" }
          assert:
            - "threshold-1: ${low_error} == 'ERR_DOWN_PAYMENT_BELOW_MINIMUM' with HTTP 422 — 119999 * 10000 == 1199990000 < 600000 * 2000 == 1200000000, ten thousand short of the line"
            - "AT the threshold: 200 with ${eq_status} == 'PENDING_VERIFICATION' — 120000 * 10000 == 1200000000 == 600000 * 2000, and equality PASSES; a strict > comparison rejects this note"
            - "threshold+1: 200 with ${high_status} == 'PENDING_VERIFICATION'"
            - "${eq_af} == 481500 (600000 - 120000 + 1500), ${eq_rate} == 1200, ${eq_fc} == 16854, ${eq_top} == 498354"
            - "${high_af} == 481499 and ${high_fc} == 16854 — one more cent of down payment does not change the rounded per-period interest sum here, so the boundary really is about the ratio test and not about pricing"
            - "the rejected note is untouched: ${low_status} == 'DRAFT' and ${low_basis} is null, and StateRateRule.${rule_ca}.active_agreement_count == 2 (only the two accepted submissions counted)"

  - rule_id: resource_temporal_overlap
    instances:

      - name: policy_term_half_open_overlap_and_adjacency
        grounds:
          - validations.priority_32_ERR_POLICY_TERM_OVERLAP
          - errors.ERR_POLICY_TERM_OVERLAP
          - entities.FinancedPolicy.fields.effective_date
          - entities.FinancedPolicy.fields.expiration_date
          - endpoints.POST_agreements_agreement_id_policies
        distinguishing_aspect: |
          Resource entity: FinancedPolicy, keyed by the (insurer_id, policy_number) pair. Interval
          semantics: HALF-OPEN [effective_date, expiration_date), so a renewal whose effective_date
          equals the prior term's expiration_date merely touches and is accepted, while one day of
          genuine overlap is rejected. The constraint is scoped to one carrier's policy number, so an
          unrelated policy number may occupy exactly the same dates.
        test_recipe:
          setup:
            - "logical clock at 2026-08-15; one TX StateRateRule with an effective License; one Insured; one ProducerAgent; one Insurer"
            - "three DRAFT agreements A1, A2, A3 under that rule (down 100000, service fee 2000, 6 installments, first due 2026-10-01), so each policy attachment is a separate request against the same (insurer, policy number) space"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { rule_tx: "$.data.id" }
            - call: "POST /state-rate-rules/${rule_tx}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Northwind Freight LLC", mailing_state_code: "TX", email: "ap@northwind.example" }
              as: FinanceAnalyst
              captures: { insured_1: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { agent_1: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { insurer_1: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${insured_1}", producer_agent_id: "${agent_1}", state_rule_id: "${rule_tx}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { agr_t1: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${insured_1}", producer_agent_id: "${agent_1}", state_rule_id: "${rule_tx}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { agr_t2: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${insured_1}", producer_agent_id: "${agent_1}", state_rule_id: "${rule_tx}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { agr_t3: "$.data.id" }
          trigger:
            - call: "POST /agreements/${agr_t1}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-TX-3001", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { base_pol: "$.data.id", base_status: "$.data.status" }
            - call: "POST /agreements/${agr_t2}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-TX-3001", gross_premium_cents: 620000, effective_date: "2027-09-01", expiration_date: "2028-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { touch_pol: "$.data.id", touch_status: "$.data.status" }
            - call: "POST /agreements/${agr_t3}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-TX-3001", gross_premium_cents: 640000, effective_date: "2027-08-31", expiration_date: "2028-08-31", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { overlap_error: "$.data.error_id" }
            - call: "POST /agreements/${agr_t3}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-TX-3001", gross_premium_cents: 640000, effective_date: "2028-09-01", expiration_date: "2029-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { chain_pol: "$.data.id", chain_status: "$.data.status" }
            - call: "POST /agreements/${agr_t3}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-TX-9999", gross_premium_cents: 300000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { other_pol: "$.data.id", other_status: "$.data.status" }
            - call: "POST /agreements/${agr_t3}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-TX-3001", gross_premium_cents: 640000, effective_date: "2026-08-31", expiration_date: "2026-09-02", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { straddle_error: "$.data.error_id" }
            - call: "GET /policies"
              payload: { insurer_id: "${insurer_1}", limit: 50 }
              as: ComplianceOfficer
          assert:
            - "the anchor term is accepted: 201 with ${base_status} == 'PENDING_VERIFICATION' for [2026-09-01, 2027-09-01)"
            - "ADJACENCY IS ALLOWED: 201 with ${touch_status} == 'PENDING_VERIFICATION' for [2027-09-01, 2028-09-01) — the new effective_date equals the anchor's expiration_date, and under half-open semantics the two terms share no day"
            - "ONE DAY OF REAL OVERLAP IS REJECTED: ${overlap_error} == 'ERR_POLICY_TERM_OVERLAP' with HTTP 409 for [2027-08-31, 2028-08-31), which shares exactly 2027-08-31 with the anchor term"
            - "the chain may keep extending: 201 with ${chain_status} == 'PENDING_VERIFICATION' for [2028-09-01, 2029-09-01), adjacent to the second term"
            - "SCOPE: 201 with ${other_status} == 'PENDING_VERIFICATION' for policy_number MC-TX-9999 over the identical [2026-09-01, 2027-09-01) dates — the exclusion is keyed on (insurer_id, policy_number), not on the carrier alone"
            - "a term that STRADDLES an existing effective_date is also rejected: ${straddle_error} == 'ERR_POLICY_TERM_OVERLAP' with HTTP 409 for [2026-08-31, 2026-09-02), so the check is a real interval intersection and not a start-date equality test"
            - "GET /policies?insurer_id=${insurer_1} returns total_count == 4 — the two rejected attachments created nothing, and PremiumFinanceAgreement.${agr_t3}.policy_count == 2"

      - name: renotice_blackout_closed_window_on_agreement
        grounds:
          - validations.priority_35_ERR_NOTICE_BLACKOUT_ACTIVE
          - errors.ERR_NOTICE_BLACKOUT_ACTIVE
          - entities.CancellationNotice.fields.cured_date
          - entities.StateRateRule.fields.noic_notice_days
          - endpoints.POST_agreements_agreement_id_cancellation_notices
        distinguishing_aspect: |
          A DIFFERENT resource entity — the PremiumFinanceAgreement's statutory notice slot, not a
          policy term — occupied by a window with DIFFERENT semantics: the cure blackout
          [cured_date, cured_date + noic_notice_days] is CLOSED at both ends, so unlike the half-open
          policy term above, the day that equals the upper bound is still blocked and only the day
          after is free. The interval is also derived rather than supplied: it is computed from the
          cured notice plus the state rule, and it keeps running even after a payment reversal drags
          the account back into delinquency.
        test_recipe:
          setup:
            - "FIXTURE-TX9 driven to a cured notice: TX StateRateRule (noic_notice_days 10) with an effective License, one Insured, one ProducerAgent, one Insurer, one ACTIVE agreement with amount_financed 1252000 and finance charge 140850"
