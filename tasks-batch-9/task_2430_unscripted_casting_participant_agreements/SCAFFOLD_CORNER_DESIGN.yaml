      # ---- stubs: violations already exercised by a §1.8 difficulty instance ----
      - name: restricted_posture_blocks_publish_returns_casting_restricted
        claim_type: violation_to_error
        grounds:
          - validations.priority_12
          - errors.ERR_CASTING_RESTRICTED
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / restricted_posture_beats_venue_capacity_on_publish"
          rationale: |
            That instance already drives ERR_CASTING_RESTRICTED on publish and, in the same
            recipe, proves it outranks the venue-capacity error, so a standalone
            violation_to_error case for priority 12 would be a strict subset of it.

      - name: open_call_over_venue_capacity_returns_capacity_exceeded
        claim_type: violation_to_error
        grounds:
          - validations.priority_43
          - errors.ERR_VENUE_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / open_call_venue_attendance_aggregate_over_closed_windows"
          rationale: |
            The aggregate-overlap instance already publishes calls until the venue's
            capacity is exceeded and asserts the 409, including which sibling windows are
            counted; the isolated violation case adds no independent signal.

      - name: overlapping_block_at_one_location_returns_block_conflict
        claim_type: violation_to_error
        grounds:
          - validations.priority_42
          - errors.ERR_LOCATION_BLOCK_CONFLICT
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / shoot_block_halfopen_interval_with_trailing_turnaround_buffer"
          rationale: |
            That instance already asserts the 409 for an overlapping block and additionally
            pins the half-open comparison and the trailing turnaround buffer, which a plain
            violation case would leave untested.

      - name: expired_work_permit_at_send_returns_work_permit_expired
        claim_type: violation_to_error
        grounds:
          - validations.priority_26
          - errors.ERR_WORK_PERMIT_EXPIRED
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / expired_work_permit_beats_location_block_conflict"
          rationale: |
            ERR_WORK_PERMIT_EXPIRED is only reachable once the packet has been COMPLETE and
            lapsed; that conflict instance sets exactly that state and asserts the error,
            and the neighbouring corner case above already proves priority 25 shadows it.

      - name: minor_over_daily_hours_returns_daily_hours_exceeded
        claim_type: violation_to_error
        grounds:
          - validations.priority_28
          - errors.ERR_MINOR_DAILY_HOURS_EXCEEDED
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / minor_daily_onset_hours_aggregate_over_utc_date_bucket"
          rationale: |
            The aggregate instance already trips the error and, unlike a standalone case,
            fixes the bucketing question (which blocks fall in the same UTC date) that the
            error depends on.

      - name: roll_without_active_duty_of_care_returns_duty_uncovered
        claim_type: violation_to_error
        grounds:
          - validations.priority_29
          - errors.ERR_DUTY_OF_CARE_UNCOVERED
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / shoot_block_roll_blocked_by_planned_duty_of_care_protocol"
          rationale: |
            That instance already asserts the 422 on roll and distinguishes the PLANNED from
            the ACTIVE protocol state, which is the discriminating part of the rule.

      - name: send_without_medical_clearance_returns_clearance_missing
        claim_type: violation_to_error
        grounds:
          - validations.priority_22
          - errors.ERR_MEDICAL_CLEARANCE_MISSING
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / agreement_send_blocked_by_applicant_medical_deferred"
          rationale: |
            The cross-entity instance already asserts ERR_MEDICAL_CLEARANCE_MISSING on send
            for a DEFERRED medical dimension while the screening dimension is CLEARED, which
            strictly contains the plain violation case.
  # ===========================================================================
  - section: rbac
    instances:

      - name: casting_director_cannot_create_a_production_forbidden
        claim_type: exclusive_operations
        grounds:
          - roles.ProductionAdmin.exclusive_operations
          - validations.priority_3
          - errors.ERR_ROLE_FORBIDDEN
          - endpoints.POST_/casting/productions
        distinguishing_aspect: |
          Exclusivity claim proved by exhaustion rather than by a single denial: all four
          non-owning staff roles are refused ERR_ROLE_FORBIDDEN at 403 on
          POST /casting/productions, and only ProductionAdmin succeeds. The Applicant role
          is refused too even though it is entity-backed, so the denial is not an ownership
          question. A build that guarded only one role, or that returned 401 instead of 403
          for an authenticated-but-unprivileged caller, fails.
        test_recipe:
          setup:
            - "Empty database; the same well-formed production body is submitted under six different roles."
          setup_api_calls: []
          trigger:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: CastingDirector
              captures: { e_cd: $.data.error_id }
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { e_co: $.data.error_id }
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { e_ba: $.data.error_id }
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: WelfareOfficer
              as_user_id: "wo_1"
              captures: { e_wo: $.data.error_id }
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
