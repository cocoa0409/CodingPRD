              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rep_old: $.data.id }
            - call: "POST /usage-reports/${rep_old}/play-lines"
              payload: { isrc: "NO-MATCH-P", track_title: "TP", artist_name: "AP", performance_count: 10000 }
