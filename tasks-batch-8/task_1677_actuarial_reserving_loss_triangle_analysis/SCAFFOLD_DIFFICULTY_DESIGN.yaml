            - "err == ERR_SOD_SIGNER_CONFLICT (priority 7 business_safety beats priority 8 referential ERR_OPINION_NO_STUDIES)"
            - "ActuarialOpinion.${op}.status == DRAFT (unchanged)"
  - rule_id: boundary_precision_check
    instances:
      - name: large_loss_threshold_exact_equality_segregates
        grounds:
          - entities.Claim.fields.is_large_loss
          - entities.ReservingSegment.fields.large_loss_threshold_cents
          - calculations.triangle_aggregation
        distinguishing_aspect: |
          Numeric threshold boundary (metric: reported_incurred_cents): the pinned
          operator is >=, so a claim landing exactly on the 400000 threshold IS
          segregated; reachable via the transaction endpoint, and observable in the
          re-aggregated triangle's layer split.
        test_recipe:
          setup:
            - "Main Book segment (threshold 400000); claim C-B paid 300000 cumulative (200000@2025-05-15, 100000@2025-08-10); then CASE_RESERVE_SET 100000 on 2025-08-20 brings reported incurred to exactly 400000"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Main Book", line_of_business: "COMMERCIAL_AUTO", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-B", accident_date: "2025-04-10", report_date: "2025-04-12" }
              as: ClaimsExaminer
              captures: { cl_b: $.data.id }
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-15T00:00:00Z", amount_cents: 200000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-08-10T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
          trigger:
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "CASE_RESERVE_SET", transaction_date: "2025-08-20T00:00:00Z", case_value_cents: 100000 }
              as: ClaimsExaminer
            - call: "GET /actuarial/claims/${cl_b}"
              as: ActuarialAnalyst
              captures: { inc: $.data.reported_incurred_cents, large: $.data.is_large_loss, seg_flag: $.data.is_segregated }
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3" }
              as: ActuarialAnalyst
              captures: { tri: $.data.id, cells: $.data.cells, large_cells: $.data.large_loss_cells }
          assert:
            - "Claim.${cl_b}.reported_incurred_cents == 400000 == segment.large_loss_threshold_cents exactly"
            - "Claim.${cl_b}.is_large_loss == true and is_segregated == true (>= boundary, not >)"
            - "LossTriangle.${tri}.cells == [] (bulk layer empty: the only claim is segregated)"
            - "LossTriangle.${tri}.large_loss_cells == exactly [{accident_quarter: 2025-Q2, dev_quarter: 0, amount_cents: 200000}, {accident_quarter: 2025-Q2, dev_quarter: 1, amount_cents: 300000}]"
      - name: tail_factor_defaults_when_zero_developed_periods
        grounds:
          - calculations.tail_factor_estimation
          - calculations.development_factor_selection
          - entities.DevelopmentPattern.fields.tail_factor
        distinguishing_aspect: |
          Empty-set boundary (metric: count of fully-developed accident-quarter pairs
          == 0), reached through the development-pattern endpoint rather than the
          transaction endpoint: with a single accident quarter at dev 0 only, no link
          ratio is computable, so selected_factors is the empty array and tail_factor
          must be exactly 1.0000 — and a chain-ladder run then yields IBNR 0.
        test_recipe:
          setup:
            - "Fresh segment; single claim E-1 (AQ 2025-Q1) with one 100000 payment at dev0; triangle aggregated at 2025-Q1 (only one accident quarter exists, one dev column)"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Tail Book", line_of_business: "WORKERS_COMP", large_loss_threshold_cents: 400000, max_range_width_pct: 1.0, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "E-1", accident_date: "2025-01-15", report_date: "2025-01-18" }
              as: ClaimsExaminer
              captures: { cl_e: $.data.id }
            - call: "POST /actuarial/claims/${cl_e}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q1" }
              as: ActuarialAnalyst
              captures: { tri: $.data.id }
          trigger:
            - call: "POST /actuarial/development-patterns"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q1", effective_from_quarter: "2025-Q1", effective_to_quarter: "2025-Q3" }
              as: ActuarialAnalyst
              captures: { pat: $.data.id, factors: $.data.selected_factors, tail: $.data.tail_factor }
            - call: "POST /actuarial/development-patterns/${pat}/select"
              as: ActuarialAnalyst
            - call: "POST /actuarial/reserve-runs"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q1", method: "CHAIN_LADDER", basis: "PAID" }
              as: ActuarialAnalyst
              captures: { run_e: $.data.id, ult: $.data.ultimate_cents, ibnr: $.data.ibnr_cents }
          assert:
            - "DevelopmentPattern.${pat}.selected_factors == [] (zero eligible accident-quarter pairs)"
            - "DevelopmentPattern.${pat}.tail_factor == 1.0 exactly (no extrapolation with fewer than 3 factors)"
            - "ReserveRun.${run_e}.ultimate_cents == 100000 and ibnr_cents == 0 (CDF(0) == tail == 1.0)"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: study_submit_gated_on_run_freshness
        grounds:
          - state_machines.ReservingStudy.DRAFT_to_IN_REVIEW
          - validations[priority=8]
          - errors[ERR_RUN_STALE]
        distinguishing_aspect: |
          Entity pair ReservingStudy -> ReserveRun: submit is legal only while the
          matched run (same segment, quarter, method, basis) exists and is not stale;
          a payment posted after the run flips run.is_stale and the very same submit
          that would have succeeded is now rejected with ERR_RUN_STALE.
        test_recipe:
