    instances:
      - name: job_close_cascade_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ProductionJob.RUNNING_to_COMPLETED
          - calculations.refractory_wear
        distinguishing_aspect: |
          Every derived value written by job close is readable immediately and with no second call: the close
          response already carries refractory_wear_units 600.00, and the very next reads show the furnace
          charged (consumed 600.00, remaining 99.40), the reservation converted (reserved 0.00,
          melt_tons_charged 600.00) and the lot created with provisional_yield_pct 95.00.
        test_recipe:
          setup:
            - "The FUR-CM1 / CMP-CM1 chain with RUNNING job PJ-CM1 (2026-08-01..2026-08-03 at 300.00 tpd, FLINT recipe at 40.00 percent cullet) reserving 600.00 tons"
