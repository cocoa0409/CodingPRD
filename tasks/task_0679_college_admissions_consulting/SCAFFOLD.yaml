# =============================================================================
# Scaffold: College Admissions Consulting (independent counselor)
# Difficulty: Expert
# Topology: FLAT (peer top-level collections with FK references)
# =============================================================================

scenario: |
  College Admissions Consulting (independent counselor): student intake & profile/timeline,
  school-list & reach-safety strategy, essay-coaching workflow & version,
  application-task tracker & deadlines (ED/EA/RD), recommendation & activity résumé,
  package/hourly billing & contract, scholarship/financial-aid guidance, decision/appeal support

domain_name: college-admissions-consulting
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_deferred_actions

  entity_topology: flat
  # Peer top-level collections (/students, /contracts, /applications, /essays, ...) linked by
  # foreign keys; no nesting in URL paths. Discovery of children is via filtered-list GETs.

  state_machine_shape: cyclic
  # Essay is a cyclic revision loop (DRAFTING -> IN_REVIEW -> REVISION_REQUESTED -> DRAFTING);
  # Application carries parallel dimensions (prep_status x decision_status) that evolve
  # independently; EngagementContract is branching (DRAFT -> {ACTIVE, VOID}).

  relationship_patterns:
    - one_to_many        # Student has many Applications, Essays, Tasks, etc. (via FK)
    - cross_aggregate    # Application references EngagementContract domain; Essay references Application
    - polymorphic        # BillingEntry.source_kind references TASK | APPOINTMENT | ESSAY | MANUAL

  role_model: peer_roles
  # Counselor owns the consulting surface for students assigned to them (Student.counselor_id ==
  # X-User-ID); Student owns their own intake/profile/essay-submission (Student.id == X-User-ID);
  # PlatformAdmin (opaque) owns clock + counselor registry.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Counselor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Counselor full name" }
      - { name: email, type: string, source: input, description: "Counselor contact email" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Default hourly rate in cents, used for HOURLY contracts and time-logged billing", constraints: "> 0" }
      - { name: weekly_review_capacity, type: integer, source: input, description: "Max essay reviews this counselor will accept per ISO week across all students", default: 10, constraints: ">= 0" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: counselor_id, type: string, source: input, description: "FK -> Counselor.id; the assigned counselor who owns this student" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: email, type: string, source: input, description: "Student contact email" }
      - { name: grad_year, type: integer, source: input, description: "Expected high-school graduation year", constraints: ">= 2026" }
      - { name: gpa, type: number, source: input, description: "Unweighted GPA on a 0.0-4.0 scale", constraints: "0.0 <= gpa <= 4.0" }
      - { name: sat_total, type: integer, source: input, description: "Best total SAT score (400-1600); 0 means not yet submitted", default: 0, constraints: "0 or 400 <= sat_total <= 1600" }
      - { name: intake_status, type: enum, source: system, description: "PROSPECT -> ONBOARDED -> ACTIVE -> GRADUATED / WITHDRAWN", default: PROSPECT, constraints: "PROSPECT|ONBOARDED|ACTIVE|GRADUATED|WITHDRAWN" }
      - { name: profile_strength, type: number, source: computed, description: "Weighted 0-100 score from gpa, sat_total, and activity résumé; see calc student_profile_strength", default: 0 }
      - { name: list_locked, type: boolean, source: computed, description: "True once the SELECTED school list satisfies the balance rule (>=1 SAFETY, total>=3, ED<=1); see calc list_balance_lock", default: false }

  - name: EngagementContract
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the student this contract covers" }
      - { name: counselor_id, type: string, source: system, description: "FK -> Counselor.id; copied from the student at contract creation" }
      - { name: billing_model, type: enum, source: input, description: "PACKAGE (flat fee, amortized over milestones) or HOURLY (time-and-materials)", constraints: "PACKAGE|HOURLY" }
      - { name: package_fee_cents, type: integer, source: input, description: "Total flat package fee in cents; required >0 when PACKAGE, must be 0 for HOURLY", default: 0, constraints: ">= 0" }
      - { name: package_milestones, type: integer, source: input, description: "Number of equal milestones a PACKAGE fee amortizes across; required >0 for PACKAGE, 0 for HOURLY", default: 0, constraints: ">= 0" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Hourly rate in cents for HOURLY contracts; required >0 for HOURLY, 0 for PACKAGE", default: 0, constraints: ">= 0" }
      - { name: retainer_deposit_cents, type: integer, source: input, description: "Up-front retainer paid into the ledger at activation", default: 0, constraints: ">= 0" }
      - { name: coverage_start_utc, type: datetime, source: input, description: "Start of the engagement coverage window (closed boundary)" }
      - { name: coverage_end_utc, type: datetime, source: input, description: "End of the engagement coverage window (closed boundary); must be strictly after coverage_start_utc" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> CLOSED; DRAFT -> VOID", default: DRAFT, constraints: "DRAFT|ACTIVE|CLOSED|VOID" }
      - { name: charged_cents, type: number, source: computed, description: "Sum of BillingEntry.amount_cents for CHARGE entries on this contract; see calc retainer_ledger", default: 0 }
      - { name: credited_cents, type: number, source: computed, description: "Sum of BillingEntry.amount_cents for CREDIT entries (deposits, refunds) on this contract", default: 0 }
      - { name: retainer_balance_cents, type: number, source: computed, description: "= credited_cents - charged_cents; negative means student owes money", default: 0 }
      - { name: projected_balance_cents, type: number, source: computed, description: "Forward-looking balance assuming all pending billable tasks bill at estimated cost; see calc projected_retainer_balance", default: 0 }

  - name: BillingEntry
    parent: null
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> EngagementContract.id; the contract this entry posts against" }
      - { name: entry_type, type: enum, source: input, description: "CHARGE (debit) or CREDIT (deposit/refund)", constraints: "CHARGE|CREDIT" }
      - { name: source_kind, type: enum, source: input, description: "What generated this entry: TASK | APPOINTMENT | ESSAY | MANUAL", constraints: "TASK|APPOINTMENT|ESSAY|MANUAL" }
      - { name: source_id, type: string, source: input, description: "Optional id of the originating ApplicationTask/Appointment; null for MANUAL", default: null }
      - { name: amount_cents, type: integer, source: input, description: "Positive magnitude of this entry in cents", constraints: "> 0" }
      - { name: minutes, type: integer, source: input, description: "Billable minutes when source_kind=APPOINTMENT under an HOURLY contract; 0 otherwise", default: 0, constraints: ">= 0" }
      - { name: memo, type: string, source: input, description: "Free-text note", default: "" }

  - name: SchoolListItem
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the student whose list this belongs to" }
      - { name: school_name, type: string, source: input, description: "Target school name" }
      - { name: admit_rate, type: number, source: input, description: "Published overall admit rate, 0.0-1.0", constraints: "0.0 < admit_rate <= 1.0" }
      - { name: median_sat, type: integer, source: input, description: "Median admitted SAT (400-1600)", constraints: "400 <= median_sat <= 1600" }
      - { name: round, type: enum, source: input, description: "Intended application round: ED | EA | RD | NONE (not yet decided)", default: NONE, constraints: "ED|EA|RD|NONE" }
      - { name: admit_probability, type: number, source: computed, description: "Estimated personal admit probability 0.0-1.0; see calc admit_probability", default: 0 }
      - { name: classification, type: enum, source: computed, description: "REACH | TARGET | SAFETY derived from admit_probability thresholds; see calc school_classification", default: REACH }
      - { name: status, type: enum, source: system, description: "CANDIDATE -> SELECTED -> DROPPED; SELECTED is the list-membership state", default: CANDIDATE, constraints: "CANDIDATE|SELECTED|DROPPED" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the applicant" }
      - { name: school_list_item_id, type: string, source: input, description: "FK -> SchoolListItem.id; the SELECTED school this application targets" }
      - { name: round, type: enum, source: input, description: "Application round: ED | EA | RD", constraints: "ED|EA|RD" }
      - { name: deadline_utc, type: datetime, source: input, description: "Hard submission deadline for this application's round" }
      - { name: prep_status, type: enum, source: system, description: "Preparation dimension: NOT_STARTED -> IN_PROGRESS -> READY -> SUBMITTED", default: NOT_STARTED, constraints: "NOT_STARTED|IN_PROGRESS|READY|SUBMITTED" }
      - { name: decision_status, type: enum, source: system, description: "Outcome dimension: PENDING -> {ADMITTED, DENIED, WAITLISTED, DEFERRED}; DENIED -> APPEALING -> {ADMITTED, DENIED}", default: PENDING, constraints: "PENDING|ADMITTED|DENIED|WAITLISTED|DEFERRED|APPEALING" }
      - { name: open_task_count, type: integer, source: computed, description: "Count of ApplicationTask in OPEN or BLOCKED for this application; gates READY", default: 0 }

  - name: ApplicationTask
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the application this task belongs to" }
      - { name: title, type: string, source: input, description: "Task title (e.g., 'Submit transcript')" }
      - { name: task_type, type: enum, source: input, description: "ESSAY | RECOMMENDATION | FORM | FEE | TRANSCRIPT", constraints: "ESSAY|RECOMMENDATION|FORM|FEE|TRANSCRIPT" }
      - { name: due_utc, type: datetime, source: input, description: "Task due date; must be on or before the parent application deadline" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Estimated billable cost if completed by the counselor; feeds projected_retainer_balance", default: 0, constraints: ">= 0" }
      - { name: blocks_submission, type: boolean, source: input, description: "Whether this task must be DONE/WAIVED before the application can reach READY", default: true }
      - { name: status, type: enum, source: system, description: "OPEN -> IN_PROGRESS -> DONE; OPEN/IN_PROGRESS -> BLOCKED -> OPEN; any non-DONE -> WAIVED", default: OPEN, constraints: "OPEN|IN_PROGRESS|BLOCKED|DONE|WAIVED" }

  - name: Essay
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the author" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the application this essay supports", default: null }
      - { name: prompt, type: string, source: input, description: "Essay prompt text" }
      - { name: word_limit, type: integer, source: input, description: "Maximum allowed word count", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "DRAFTING -> IN_REVIEW -> REVISION_REQUESTED -> DRAFTING (cycle); DRAFTING/IN_REVIEW -> APPROVED; any non-APPROVED -> ABANDONED", default: DRAFTING, constraints: "DRAFTING|IN_REVIEW|REVISION_REQUESTED|APPROVED|ABANDONED" }
      - { name: revision_round, type: integer, source: computed, description: "Number of completed review cycles; increments each time a review sends the essay back toward DRAFTING", default: 0 }
      - { name: latest_version_no, type: integer, source: computed, description: "Highest version_no among this essay's EssayVersion rows; 0 if none", default: 0 }

  - name: EssayVersion
    parent: null
    common_fields: false
    fields:
      - { name: essay_id, type: string, source: input, description: "FK -> Essay.id; the essay this version snapshots" }
      - { name: version_no, type: integer, source: system, description: "Monotonic per-essay version number starting at 1" }
      - { name: word_count, type: integer, source: input, description: "Word count of the submitted draft", constraints: ">= 0" }
      - { name: body, type: string, source: input, description: "Full draft text" }
      - { name: submitted_by_role, type: enum, source: system, description: "Role that submitted this version: Student or Counselor", constraints: "Student|Counselor" }

  - name: RecommendationRequest
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the requesting student" }
      - { name: recommender_name, type: string, source: input, description: "Recommender's name" }
      - { name: recommender_email, type: string, source: input, description: "Recommender's email" }
      - { name: rec_type, type: enum, source: input, description: "TEACHER | COUNSELOR | OTHER", constraints: "TEACHER|COUNSELOR|OTHER" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> ACCEPTED -> SUBMITTED; REQUESTED/ACCEPTED -> DECLINED", default: REQUESTED, constraints: "REQUESTED|ACCEPTED|SUBMITTED|DECLINED" }

  - name: ActivityEntry
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the student whose résumé this entry belongs to" }
      - { name: title, type: string, source: input, description: "Activity title" }
      - { name: category, type: enum, source: input, description: "ACADEMIC | ATHLETIC | ARTS | SERVICE | WORK | LEADERSHIP", constraints: "ACADEMIC|ATHLETIC|ARTS|SERVICE|WORK|LEADERSHIP" }
      - { name: hours_per_week, type: integer, source: input, description: "Hours committed per week", constraints: ">= 0" }
      - { name: weeks_per_year, type: integer, source: input, description: "Weeks per year", constraints: ">= 0 and <= 52" }
      - { name: tier, type: integer, source: input, description: "Selectivity tier 1 (national) to 4 (local), weights the résumé score", constraints: "1 <= tier <= 4" }

  - name: ScholarshipAward
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the student receiving guidance on this award" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the application this award is tied to (null for external scholarships)", default: null }
      - { name: award_name, type: string, source: input, description: "Award/scholarship name" }
      - { name: award_type, type: enum, source: input, description: "MERIT | NEED | EXTERNAL", constraints: "MERIT|NEED|EXTERNAL" }
      - { name: gross_amount_cents, type: integer, source: input, description: "Sticker award amount in cents", constraints: "> 0" }
      - { name: net_amount_cents, type: number, source: computed, description: "Award net of stacking/coordination rules; see calc net_aid_amount", default: 0 }
      - { name: status, type: enum, source: system, description: "OFFERED -> ACCEPTED; OFFERED -> DECLINED", default: OFFERED, constraints: "OFFERED|ACCEPTED|DECLINED" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the student being met" }
      - { name: counselor_id, type: string, source: system, description: "FK -> Counselor.id; the counselor on the appointment (copied from student)" }
      - { name: start_utc, type: datetime, source: input, description: "Appointment start (inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "Appointment end (exclusive); must be strictly after start_utc" }
      - { name: meeting_type, type: enum, source: input, description: "STRATEGY | ESSAY_REVIEW | CHECK_IN", constraints: "STRATEGY|ESSAY_REVIEW|CHECK_IN" }
      - { name: status, type: enum, source: system, description: "BOOKED -> COMPLETED; BOOKED -> CANCELLED", default: BOOKED, constraints: "BOOKED|COMPLETED|CANCELLED" }
      - { name: billed_minutes, type: integer, source: computed, description: "Whole minutes between start_utc and end_utc, billed on COMPLETED under HOURLY contracts", default: 0 }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- EngagementContract: branching (DRAFT -> ACTIVE -> CLOSED; DRAFT -> VOID) ----
  - entity: EngagementContract
    initial_state: DRAFT
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{contractId}/activate"
        actor: Counselor
        preconditions:
          - "Student.intake_status IN {ONBOARDED, ACTIVE} (ERR_STUDENT_NOT_ONBOARDED) — cross-entity dependency"
          - "No other EngagementContract for this student is in ACTIVE (ERR_CONTRACT_ALREADY_ACTIVE)"
        side_effects:
          - "If retainer_deposit_cents > 0, append BillingEntry{entry_type=CREDIT, source_kind=MANUAL, amount_cents=retainer_deposit_cents}"
          - "Recompute contract credited_cents, charged_cents, retainer_balance_cents, projected_balance_cents (calc retainer_ledger, projected_retainer_balance)"
          - "If Student.intake_status == ONBOARDED, set Student.intake_status = ACTIVE (bubble-up); increments Student.version by 1"
          - "increments EngagementContract.version by 1"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /contracts/{contractId}/close"
        actor: Counselor
        preconditions:
          - "No Application for this student has prep_status IN {NOT_STARTED, IN_PROGRESS, READY} (ERR_OPEN_APPLICATIONS) — cross-entity dependency"
          - "retainer_balance_cents >= 0 (ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "Recompute retainer_ledger and projected_retainer_balance one final time"
          - "increments EngagementContract.version by 1"

      - from: DRAFT
        to: VOID
        trigger: "POST /contracts/{contractId}/void"
        actor: Counselor
        preconditions:
          - "Contract has zero BillingEntry rows (ERR_CONTRACT_HAS_ENTRIES)"
        side_effects:
          - "increments EngagementContract.version by 1"

  # ---- Student intake: linear with terminal branches; ACTIVE reached via contract bubble-up ----
  - entity: Student
    initial_state: PROSPECT
    terminal_states: [GRADUATED, WITHDRAWN]
    transitions:
      - from: PROSPECT
        to: ONBOARDED
        trigger: "POST /students/{studentId}/transition (to_status=ONBOARDED)"
        actor: Counselor
        preconditions:
          - "Student has at least one ActivityEntry (ERR_INTAKE_INCOMPLETE)"
          - "Student.sat_total != 0 (ERR_INTAKE_INCOMPLETE)"
        side_effects:
          - "Recompute Student.profile_strength (calc student_profile_strength)"

      - from: ONBOARDED
        to: ACTIVE
        trigger: "system: EngagementContract activation (bubble-up)"
        actor: system
        preconditions:
          - "An EngagementContract for this student transitioned to ACTIVE"
        side_effects: []

      - from: ACTIVE
        to: GRADUATED
        trigger: "POST /students/{studentId}/transition (to_status=GRADUATED)"
        actor: Counselor
        preconditions:
          - "Every Application for this student has decision_status != PENDING OR prep_status == SUBMITTED (ERR_APPLICATIONS_IN_FLIGHT)"
          - "No EngagementContract for this student is in ACTIVE (ERR_CONTRACT_ALREADY_ACTIVE)"
        side_effects: []

      - from: PROSPECT
        to: WITHDRAWN
        trigger: "POST /students/{studentId}/transition (to_status=WITHDRAWN)"
        actor: Counselor
        preconditions: []
        side_effects: []

      - from: ONBOARDED
        to: WITHDRAWN
        trigger: "POST /students/{studentId}/transition (to_status=WITHDRAWN)"
        actor: Counselor
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /students/{studentId}/transition (to_status=WITHDRAWN)"
        actor: Counselor
        preconditions:
          - "No EngagementContract for this student is in ACTIVE (ERR_CONTRACT_ALREADY_ACTIVE)"
        side_effects: []

  # ---- Essay: cyclic revision loop ----
  - entity: Essay
    initial_state: DRAFTING
    terminal_states: [APPROVED, ABANDONED]
    transitions:
      - from: DRAFTING
        to: IN_REVIEW
        trigger: "POST /essays/{essayId}/submit-version"
        actor: Student
        preconditions:
          - "Submitted word_count <= Essay.word_limit (ERR_WORD_LIMIT_EXCEEDED)"
          - "Counselor reviews already submitted in the current ISO week < Counselor.weekly_review_capacity (ERR_REVIEW_CAPACITY_EXCEEDED) — cross-entity dependency"
        side_effects:
          - "Append EssayVersion{version_no = Essay.latest_version_no + 1, submitted_by_role=acting role}"
          - "Set Essay.latest_version_no = new version_no"
          - "increments Essay.version by 1"

      - from: IN_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /essays/{essayId}/request-revision"
        actor: Counselor
        preconditions:
          - "Essay has at least one EssayVersion (ERR_NO_VERSION_TO_REVIEW)"
        side_effects:
          - "Set Essay.revision_round = Essay.revision_round + 1"
          - "If Essay.application_id set and that Application.prep_status == READY, demote it READY -> IN_PROGRESS and recompute open_task_count (cross-entity cascade)"
          - "increments Essay.version by 1"

      - from: REVISION_REQUESTED
        to: DRAFTING
        trigger: "POST /essays/{essayId}/resume-drafting"
        actor: Student
        preconditions: []
        side_effects:
          - "increments Essay.version by 1"

      - from: DRAFTING
        to: APPROVED
        trigger: "POST /essays/{essayId}/approve"
        actor: Counselor
        preconditions:
          - "Essay.latest_version_no >= 1 (ERR_NO_VERSION_TO_REVIEW)"
          - "Essay.revision_round >= 1 (ERR_REVISION_REQUIRED) — at least one review cycle must have completed"
        side_effects:
          - "If Essay.application_id set, mark any ApplicationTask{task_type=ESSAY, status IN {OPEN,IN_PROGRESS,BLOCKED}} on that application as DONE and recompute Application.open_task_count (cross-entity cascade)"
          - "increments Essay.version by 1"

      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /essays/{essayId}/approve"
        actor: Counselor
        preconditions:
          - "Essay.latest_version_no >= 1 (ERR_NO_VERSION_TO_REVIEW)"
          - "Essay.revision_round >= 1 (ERR_REVISION_REQUIRED)"
        side_effects:
          - "If Essay.application_id set, mark any ApplicationTask{task_type=ESSAY, status IN {OPEN,IN_PROGRESS,BLOCKED}} on that application as DONE and recompute Application.open_task_count (cross-entity cascade)"
          - "increments Essay.version by 1"

      - from: DRAFTING
        to: ABANDONED
        trigger: "POST /essays/{essayId}/abandon"
        actor: Counselor
        preconditions: []
        side_effects:
          - "increments Essay.version by 1"

      - from: REVISION_REQUESTED
        to: ABANDONED
        trigger: "POST /essays/{essayId}/abandon"
        actor: Counselor
        preconditions: []
        side_effects:
          - "increments Essay.version by 1"

      - from: IN_REVIEW
        to: ABANDONED
        trigger: "POST /essays/{essayId}/abandon"
        actor: Counselor
        preconditions: []
        side_effects:
          - "increments Essay.version by 1"

  # ---- Application: parallel dimensions prep_status x decision_status ----
  - entity: Application
    initial_state: NOT_STARTED   # prep_status dimension; decision_status starts PENDING
    terminal_states: []
    transitions:
      # ----- prep_status dimension -----
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /applications/{applicationId}/start-prep"
        actor: Counselor
        preconditions:
          - "SchoolListItem referenced by school_list_item_id is in status SELECTED (ERR_SCHOOL_NOT_SELECTED) — cross-entity dependency"
        side_effects:
          - "Recompute Application.open_task_count"

      - from: IN_PROGRESS
        to: READY
        trigger: "POST /applications/{applicationId}/mark-ready"
        actor: Counselor
        preconditions:
          - "Application.open_task_count == 0 (ERR_OPEN_TASKS_REMAIN) — every blocking task DONE or WAIVED"
        side_effects:
          - "Recompute Application.open_task_count"

      - from: READY
        to: SUBMITTED
        trigger: "POST /applications/{applicationId}/submit"
        actor: Counselor
        preconditions:
          - "Logical clock now < Application.deadline_utc (ERR_DEADLINE_PASSED) — boundary: now must be strictly before deadline"
          - "Application.open_task_count == 0 (ERR_OPEN_TASKS_REMAIN)"
        side_effects: []

      - from: READY
        to: IN_PROGRESS
        trigger: "system: essay revision requested demotes a READY application (cross-entity cascade)"
        actor: system
        preconditions:
          - "An Essay with this application_id transitioned IN_REVIEW -> REVISION_REQUESTED"
        side_effects:
          - "Recompute Application.open_task_count"

      # ----- decision_status dimension (independent of prep_status) -----
      - from: PENDING
        to: ADMITTED
        trigger: "POST /applications/{applicationId}/record-decision (decision=ADMITTED)"
        actor: Counselor
        preconditions:
          - "Application.prep_status == SUBMITTED (ERR_NOT_SUBMITTED) — cross-dimension guard on same entity"
        side_effects: []

      - from: PENDING
        to: DENIED
        trigger: "POST /applications/{applicationId}/record-decision (decision=DENIED)"
        actor: Counselor
        preconditions:
          - "Application.prep_status == SUBMITTED (ERR_NOT_SUBMITTED)"
        side_effects: []

      - from: PENDING
        to: WAITLISTED
        trigger: "POST /applications/{applicationId}/record-decision (decision=WAITLISTED)"
        actor: Counselor
        preconditions:
          - "Application.prep_status == SUBMITTED (ERR_NOT_SUBMITTED)"
        side_effects: []

      - from: PENDING
        to: DEFERRED
        trigger: "POST /applications/{applicationId}/record-decision (decision=DEFERRED)"
        actor: Counselor
        preconditions:
          - "Application.prep_status == SUBMITTED (ERR_NOT_SUBMITTED)"
          - "Application.round IN {ED, EA} (ERR_DEFER_NOT_ALLOWED) — RD rounds cannot defer"
        side_effects: []

      - from: DENIED
        to: APPEALING
        trigger: "POST /applications/{applicationId}/appeal"
        actor: Counselor
        preconditions:
          - "Logical clock now < Application.deadline_utc + APPEAL_WINDOW_DAYS (=30 days) (ERR_APPEAL_WINDOW_CLOSED) — boundary: appeal allowed only strictly within 30 days after the deadline"
        side_effects:
          - "Append a system ApplicationTask{task_type=FORM, title='Appeal letter', blocks_submission=false, status=OPEN} and recompute open_task_count"

      - from: APPEALING
        to: ADMITTED
        trigger: "POST /applications/{applicationId}/record-decision (decision=ADMITTED)"
        actor: Counselor
        preconditions: []
        side_effects: []

      - from: APPEALING
        to: DENIED
        trigger: "POST /applications/{applicationId}/record-decision (decision=DENIED)"
        actor: Counselor
        preconditions: []
        side_effects: []

  # ---- ApplicationTask: branching with BLOCKED revert and WAIVED escape ----
  - entity: ApplicationTask
    initial_state: OPEN
    terminal_states: [DONE, WAIVED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /application-tasks/{taskId}/transition (to_status=IN_PROGRESS)"
        actor: Counselor
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /application-tasks/{taskId}/transition (to_status=DONE)"
        actor: Counselor
        preconditions: []
        side_effects:
          - "If task_type != ESSAY and estimated_cost_cents > 0 and the student has an ACTIVE contract: append BillingEntry{entry_type=CHARGE, source_kind=TASK, source_id=taskId, amount_cents=estimated_cost_cents} and recompute retainer_ledger + projected_retainer_balance on that contract (cross-entity ledger sync)"
          - "Recompute parent Application.open_task_count (bubble-up)"

      - from: OPEN
        to: BLOCKED
        trigger: "POST /application-tasks/{taskId}/transition (to_status=BLOCKED)"
        actor: Counselor
        preconditions: []
        side_effects:
          - "Recompute parent Application.open_task_count"

      - from: IN_PROGRESS
        to: BLOCKED
        trigger: "POST /application-tasks/{taskId}/transition (to_status=BLOCKED)"
        actor: Counselor
        preconditions: []
        side_effects:
          - "Recompute parent Application.open_task_count"

      - from: BLOCKED
        to: OPEN
        trigger: "POST /application-tasks/{taskId}/transition (to_status=OPEN)"
        actor: Counselor
        preconditions: []
        side_effects:
          - "Recompute parent Application.open_task_count"

      - from: OPEN
        to: WAIVED
        trigger: "POST /application-tasks/{taskId}/transition (to_status=WAIVED)"
        actor: Counselor
        preconditions: []
        side_effects:
          - "Recompute parent Application.open_task_count"

      - from: IN_PROGRESS
        to: WAIVED
        trigger: "POST /application-tasks/{taskId}/transition (to_status=WAIVED)"
        actor: Counselor
        preconditions: []
        side_effects:
          - "Recompute parent Application.open_task_count"

      - from: BLOCKED
        to: WAIVED
        trigger: "POST /application-tasks/{taskId}/transition (to_status=WAIVED)"
        actor: Counselor
        preconditions: []
        side_effects:
          - "Recompute parent Application.open_task_count"

  # ---- RecommendationRequest: linear with decline branch ----
  - entity: RecommendationRequest
    initial_state: REQUESTED
    terminal_states: [SUBMITTED, DECLINED]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /recommendations/{recId}/transition (to_status=ACCEPTED)"
        actor: Counselor
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: SUBMITTED
        trigger: "POST /recommendations/{recId}/transition (to_status=SUBMITTED)"
        actor: Counselor
        preconditions: []
        side_effects:
          - "Mark any ApplicationTask{task_type=RECOMMENDATION, status IN {OPEN,IN_PROGRESS,BLOCKED}} across the student's applications as DONE and recompute those Application.open_task_count (cross-entity cascade)"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /recommendations/{recId}/transition (to_status=DECLINED)"
        actor: Counselor
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: DECLINED
        trigger: "POST /recommendations/{recId}/transition (to_status=DECLINED)"
        actor: Counselor
        preconditions: []
        side_effects: []

  # ---- ScholarshipAward: linear with decline branch ----
  - entity: ScholarshipAward
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /scholarships/{awardId}/transition (to_status=ACCEPTED)"
        actor: Counselor
        preconditions:
          - "If award_type IN {MERIT, NEED}, the tied Application.decision_status == ADMITTED (ERR_AWARD_NOT_ADMITTED) — cross-entity dependency"
        side_effects:
          - "Recompute net_amount_cents for all ScholarshipAward on this student (calc net_aid_amount) — coordination/stacking cascade"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /scholarships/{awardId}/transition (to_status=DECLINED)"
        actor: Counselor
        preconditions: []
        side_effects:
          - "Recompute net_amount_cents for all ScholarshipAward on this student (calc net_aid_amount)"

  # ---- Appointment: linear with cancel branch; COMPLETED triggers billing ----
  - entity: Appointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /appointments/{appointmentId}/complete"
        actor: Counselor
        preconditions:
          - "Logical clock now >= Appointment.start_utc (ERR_APPOINTMENT_NOT_STARTED)"
        side_effects:
          - "Set billed_minutes = floor(whole minutes between start_utc and end_utc)"
          - "If the student has an ACTIVE HOURLY contract: append BillingEntry{entry_type=CHARGE, source_kind=APPOINTMENT, source_id=appointmentId, minutes=billed_minutes, amount_cents = round_half_up(billed_minutes/60 * contract.hourly_rate_cents)} and recompute retainer_ledger + projected_retainer_balance (cross-entity ledger sync)"
          - "increments Appointment.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /appointments/{appointmentId}/cancel"
        actor: Counselor
        preconditions: []
        side_effects:
          - "increments Appointment.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: contract-activate-stale-student
    parent_entity: Student
    write_endpoint: "POST /contracts/{contractId}/activate"
    occ_field: "expected_student_version"
    description: |
      Activating an EngagementContract requires the client to pin the Student version it last
      observed. A contract activation legitimately supersedes the student's onboarding view (it
      bubbles Student.intake_status ONBOARDED -> ACTIVE and appends a retainer CREDIT). If the
      student's version has advanced since the client read it — e.g., a school selection already
      mutated the student — the stale activation is rejected so the bubble-up is computed against an
      up-to-date student snapshot.
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412

  - rule_id: school-select-stale-student
    parent_entity: Student
    write_endpoint: "POST /school-list-items/{itemId}/select"
    occ_field: "expected_student_version"
    description: |
      Selecting a SchoolListItem into the locked list recomputes Student.list_locked and is gated on
      the Student version the client last observed. If the student's version advanced since that read
      (another selection already mutated the list and flipped list_locked), the stale selection is
      rejected, preventing two selections from each computing list_locked against an out-of-date list
      snapshot.
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: student_profile_strength
    trigger: "POST /students/{studentId}/transition (to_status=ONBOARDED); POST /activities (create); recomputed on those"
    algorithm: weighted_scoring
    formula: |
      # Combines academics and résumé into a 0-100 score. Evaluation order is pinned.
      # Step 1 (academics, 0-70):
      gpa_component   = (gpa / 4.0) * 40                         # 0-40
      sat_component   = 0 if sat_total == 0 else ((sat_total - 400) / 1200.0) * 30   # 0-30
      academics       = gpa_component + sat_component            # 0-70
      # Step 2 (résumé, 0-30) — weighted by tier then capped:
      #   tier_weight: tier1=1.0, tier2=0.7, tier3=0.4, tier4=0.2
      #   raw_activity = sum over ActivityEntry of
      #                  (hours_per_week * weeks_per_year / 100.0) * tier_weight(tier)
      #   resume       = min(30, raw_activity)                   # cap at 30
      # Step 3 (pin rounding ORDER — round each component to 2dp BEFORE summing):
      profile_strength = round_half_up(round_half_up(academics,2) + round_half_up(resume,2), 2)
    input_set: "All ActivityEntry rows for the student (no status filter — ActivityEntry has no status). gpa, sat_total from Student."
    constants:
      GPA_MAX: 4.0
      GPA_WEIGHT: 40
      SAT_MIN: 400
      SAT_RANGE: 1200
      SAT_WEIGHT: 30
      TIER1_WEIGHT: 1.0
      TIER2_WEIGHT: 0.7
      TIER3_WEIGHT: 0.4
      TIER4_WEIGHT: 0.2
      RESUME_CAP: 30
    precision: "round each component to 2 decimal places, THEN sum, THEN round to 2 dp, round_half_up"

  - name: admit_probability
    trigger: "POST /school-list-items (create); recomputed when Student.profile_strength changes for that student's items"
    algorithm: threshold
    formula: |
      # Personal admit probability for one school. Non-linear, >=3 inputs with conditional branches.
      base = admit_rate
      sat_gap = student.sat_total - median_sat        # student.sat_total==0 treated as no signal -> gap 0
      if student.sat_total == 0:
          sat_gap = 0
      if sat_gap >= 100:
          mult = 1.6
      elif sat_gap >= 0:
          mult = 1.0 + (sat_gap / 100.0) * 0.6        # interpolate 1.0..1.6 across 0..100
      elif sat_gap > -100:
          mult = 1.0 + (sat_gap / 100.0) * 0.5        # interpolate 0.5..1.0 across -100..0
      else:
          mult = 0.5
      strength_bonus = (student.profile_strength - 50) / 100.0 * 0.3   # +/-0.15 around strength 50
      raw = base * mult + strength_bonus
      admit_probability = round_half_up(max(0.0, min(1.0, raw)), 4)    # clamp to [0,1]
    input_set: "SchoolListItem.admit_rate, median_sat; Student.sat_total, profile_strength"
    constants:
      GAP_HIGH: 100
      MULT_HIGH: 1.6
      MULT_FLOOR: 0.5
      STRENGTH_PIVOT: 50
      STRENGTH_WEIGHT: 0.3
    precision: "4 decimal places, round_half_up; clamp to [0.0, 1.0]"

  - name: school_classification
    trigger: "recomputed whenever admit_probability is recomputed for a SchoolListItem"
    algorithm: threshold
    formula: |
      # Boundary precision: SAFETY at >= 0.60; REACH below 0.20; else TARGET.
      if admit_probability >= 0.60:
          classification = SAFETY
      elif admit_probability < 0.20:
          classification = REACH
      else:
          classification = TARGET            # 0.20 <= p < 0.60
    input_set: "SchoolListItem.admit_probability"
    constants:
      SAFETY_THRESHOLD: 0.60
      REACH_THRESHOLD: 0.20
    precision: "comparison on the 4-dp admit_probability; >= for SAFETY, < for REACH"

  - name: list_balance_lock
    trigger: "POST /school-list-items/{itemId}/select; POST /school-list-items/{itemId}/drop"
    algorithm: aggregation
    formula: |
      # Determines Student.list_locked from the SELECTED SchoolListItem set.
      selected = SchoolListItem where status == SELECTED
      n_safety = count(selected where classification == SAFETY)
      n_total  = count(selected)
      n_ed     = count(selected where round == ED)
      list_locked = (n_safety >= 1) AND (n_total >= 3) AND (n_ed <= 1)
    input_set: "All SchoolListItem rows for the student with status == SELECTED"
    constants:
      MIN_SAFETY: 1
      MIN_TOTAL: 3
      MAX_ED: 1
    precision: "integer counts; boolean output"

  - name: retainer_ledger
    trigger: "any BillingEntry append; contract activate/close; appointment complete; task DONE"
    algorithm: aggregation
    formula: |
      # Chronological actual ledger over posted BillingEntry rows (order-independent: pure sums).
      charged_cents  = sum(amount_cents for BillingEntry where entry_type == CHARGE)
      credited_cents = sum(amount_cents for BillingEntry where entry_type == CREDIT)
      retainer_balance_cents = credited_cents - charged_cents
    input_set: "All BillingEntry rows on the contract (append-only; none excluded)."
    constants: {}
    precision: "integer cents; sums are exact"
    variants:
      - name: actual_chronological
        when: "retainer_balance_cents — reflects only entries already posted"
        difference: "Counts only posted CHARGE/CREDIT entries; ignores not-yet-billed pending tasks"

  - name: projected_retainer_balance
    trigger: "recomputed alongside retainer_ledger on every ledger-affecting event"
    algorithm: forward_looking
    formula: |
      # Forward-looking variant: assumes every still-billable pending task WILL bill.
      # pending_task_cost = sum over ApplicationTask where:
      #     status IN {OPEN, IN_PROGRESS, BLOCKED}  AND  task_type != ESSAY  AND  estimated_cost_cents > 0
      #   across all Applications of the contract's student
      # (ESSAY tasks never bill; matches retainer_ledger which never charges ESSAY tasks)
      pending_task_cost = sum(estimated_cost_cents for qualifying ApplicationTask)
      projected_balance_cents = retainer_balance_cents - pending_task_cost
    input_set: "ApplicationTask rows in {OPEN, IN_PROGRESS, BLOCKED} with task_type != ESSAY and estimated_cost_cents > 0, for the contract's student; plus retainer_balance_cents from retainer_ledger"
    constants: {}
    precision: "integer cents"
    variants:
      - name: forward_looking_projected
        when: "projected_balance_cents — anticipates all pending billable tasks"
        difference: "Subtracts estimated cost of pending (not-yet-DONE) billable tasks; the same task set is INCLUDED here but EXCLUDED from retainer_ledger, so the two balances diverge for identical data"

  - name: appointment_billed_amount
    trigger: "POST /appointments/{appointmentId}/complete (HOURLY contract)"
    algorithm: tiered_pricing
    formula: |
      billed_minutes = floor((end_utc - start_utc) total seconds / 60)   # whole minutes, truncated
      amount_cents = round_half_up((billed_minutes / 60.0) * contract.hourly_rate_cents, 0)
      # Single rounding at the END (sum-then-round). Do NOT round per-minute then multiply.
    input_set: "Appointment.start_utc, end_utc; the student's ACTIVE HOURLY EngagementContract.hourly_rate_cents"
    constants:
      SECONDS_PER_MINUTE: 60
      MINUTES_PER_HOUR: 60
    precision: "billed_minutes truncated to whole minutes; amount_cents round_half_up to whole cents (sum-then-round, single rounding step)"

  - name: net_aid_amount
    trigger: "POST /scholarships/{awardId}/transition (ACCEPT/DECLINE); recomputed for all of the student's awards"
    algorithm: waterfall_allocation
    formula: |
      # Coordination/stacking: awards fill a fixed family coordination cap in a pinned order.
      # Pinned processing order: award_type rank MERIT(0) < EXTERNAL(1) < NEED(2), then created_at ASC.
      # Only ACCEPTED awards consume the cap; OFFERED nets to gross (informational); DECLINED nets 0.
      COORDINATION_CAP_CENTS = 4000000
      running = 0
      for award in (ACCEPTED awards sorted by [type_rank, created_at ASC]):
          allow = min(award.gross_amount_cents, COORDINATION_CAP_CENTS - running)
          if allow < 0: allow = 0
          award.net_amount_cents = allow
          running = running + allow
      # OFFERED award: net_amount_cents = gross_amount_cents; DECLINED: net_amount_cents = 0
    input_set: "All ScholarshipAward rows for the student; only status==ACCEPTED rows consume the cap, processed by [type_rank MERIT<EXTERNAL<NEED, created_at ASC]"
    constants:
      COORDINATION_CAP_CENTS: 4000000
      TYPE_RANK_MERIT: 0
      TYPE_RANK_EXTERNAL: 1
      TYPE_RANK_NEED: 2
    precision: "integer cents; waterfall fills in pinned order, remainder to 0 once cap reached"

  - name: appointment_overlap_check
    trigger: "POST /appointments (create)"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals with a symmetric BUFFER. Resource = the counselor's calendar
      # (Appointment.counselor_id). Candidate set: existing appointments for the same counselor with
      # status IN {BOOKED, COMPLETED}.
      buffer = APPOINTMENT_BUFFER_MIN minutes
      new_lo  = new.start_utc - buffer
      new_hi  = new.end_utc   + buffer
      # Each existing appointment occupies the HALF-OPEN interval [e.start_utc, e.end_utc).
      # Conflict iff new_lo < e.end_utc AND e.start_utc < new_hi  (strict; touching at the buffered
      # boundary does NOT conflict).
      conflict = any(existing where new_lo < existing.end_utc and existing.start_utc < new_hi)
      if conflict: reject ERR_APPOINTMENT_OVERLAP
    input_set: "Appointment rows with counselor_id == new.counselor_id and status IN {BOOKED, COMPLETED}"
    constants:
      APPOINTMENT_BUFFER_MIN: 15
    precision: "datetime arithmetic at second resolution; strict inequalities (half-open + buffer)"

  - name: contract_coverage_overlap_check
    trigger: "POST /contracts (create)"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals, NO buffer, adjacency allowed. Resource = the student's coverage timeline
      # (EngagementContract per student). Candidate set: contracts for the same student status != VOID.
      # Each contract occupies the CLOSED interval [coverage_start_utc, coverage_end_utc].
      # Conflict iff new.coverage_start_utc < e.coverage_end_utc AND e.coverage_start_utc < new.coverage_end_utc
      #   (strict interior overlap; equality at a single endpoint => ADJACENT => allowed).
      conflict = any(existing where new.coverage_start_utc < existing.coverage_end_utc
                                and existing.coverage_start_utc < new.coverage_end_utc)
      if conflict: reject ERR_CONTRACT_COVERAGE_OVERLAP
    input_set: "EngagementContract rows with student_id == new.student_id and status != VOID"
    constants: {}
    precision: "datetime arithmetic at second resolution; strict interior overlap, no buffer, adjacency permitted"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; Counselor may only act on students they own (Student.counselor_id == X-User-ID); Student may only act on own resources (Student.id == X-User-ID)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "FK body fields (student_id, counselor_id, contract_id, school_list_item_id, application_id, essay_id, source_id) reference existing rows; cross-student references are rejected"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "creation and reference endpoints"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges satisfied"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: business_constraint
    check: "EngagementContract billing-model coherence: PACKAGE requires package_fee_cents>0 and package_milestones>0 and hourly_rate_cents==0; HOURLY requires hourly_rate_cents>0 and package_fee_cents==0 and package_milestones==0"
    error_id: ERR_BILLING_MODEL_INCOHERENT
    http_status: 422
    applies_to: "POST /contracts"

  - priority: 7
    category: state
    check: "Optimistic concurrency: expected_student_version must equal current Student.version on OCC-guarded writes"
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412
    applies_to: "POST /contracts/{contractId}/activate; POST /school-list-items/{itemId}/select"

  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_temporal
    check: "Appointment cannot be completed before it starts: now >= start_utc"
    error_id: ERR_APPOINTMENT_NOT_STARTED
    http_status: 409
    applies_to: "POST /appointments/{appointmentId}/complete"

  - priority: 10
    category: business_temporal
    check: "Appointment overlap (HALF-OPEN + BUFFER): the new appointment's interval [start_utc, end_utc) expanded by APPOINTMENT_BUFFER_MIN minutes on EACH side must not intersect the half-open interval of any other BOOKED/COMPLETED appointment for the SAME counselor. Touching exactly at the buffered boundary does NOT conflict; anything closer does."
    error_id: ERR_APPOINTMENT_OVERLAP
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 10.5
    category: business_temporal
    check: "Contract coverage overlap (CLOSED + ADJACENCY-ALLOWED, distinct geometry from appointment overlap): the new contract's closed window [coverage_start_utc, coverage_end_utc] must not interpenetrate any non-VOID EngagementContract window for the SAME student. NO buffer; windows sharing a single endpoint instant are ADJACENT and permitted; only strict interior overlap is rejected."
    error_id: ERR_CONTRACT_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /contracts"

  - priority: 11
    category: business_temporal
    check: "ApplicationTask.due_utc must be <= parent Application.deadline_utc (closed boundary; equal allowed)"
    error_id: ERR_TASK_DUE_AFTER_DEADLINE
    http_status: 422
    applies_to: "POST /application-tasks"

  - priority: 12
    category: business_temporal
    check: "Application submit requires now strictly before deadline_utc"
    error_id: ERR_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /applications/{applicationId}/submit"

  - priority: 13
    category: business_constraint
    check: "An ED Application can only be created if the student has no other Application with round==ED in prep_status IN {NOT_STARTED, IN_PROGRESS, READY, SUBMITTED} (single binding ED rule)"
    error_id: ERR_ED_CONFLICT
    http_status: 409
    applies_to: "POST /applications"

  - priority: 14
    category: business_constraint
    check: "Essay version submission word_count must not exceed Essay.word_limit"
    error_id: ERR_WORD_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /essays/{essayId}/submit-version"

  - priority: 15
    category: business_constraint
    check: "Essay submit-version blocked when the counselor's reviews already submitted in the current ISO week >= Counselor.weekly_review_capacity"
    error_id: ERR_REVIEW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /essays/{essayId}/submit-version"

  - priority: 15.5
    category: business_constraint
    check: "Essay approve requires revision_round >= 1 (at least one completed review cycle)"
    error_id: ERR_REVISION_REQUIRED
    http_status: 409
    applies_to: "POST /essays/{essayId}/approve"

  - priority: 16
    category: business_referential
    check: "Application mark-ready / submit require open_task_count == 0"
    error_id: ERR_OPEN_TASKS_REMAIN
    http_status: 409
    applies_to: "POST /applications/{applicationId}/mark-ready; POST /applications/{applicationId}/submit"

  - priority: 17
    category: business_referential
    check: "start-prep requires the referenced SchoolListItem.status == SELECTED"
    error_id: ERR_SCHOOL_NOT_SELECTED
    http_status: 409
    applies_to: "POST /applications/{applicationId}/start-prep"

  - priority: 18
    category: business_referential
    check: "Accepting a MERIT/NEED ScholarshipAward requires the tied Application.decision_status == ADMITTED"
    error_id: ERR_AWARD_NOT_ADMITTED
    http_status: 409
    applies_to: "POST /scholarships/{awardId}/transition"

  - priority: 19
    category: business_referential
    check: "record-decision requires prep_status == SUBMITTED before a PENDING decision may be set"
    error_id: ERR_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /applications/{applicationId}/record-decision"

  - priority: 20
    category: business_fiscal
    check: "Closing a contract requires retainer_balance_cents >= 0 (no money owed)"
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 409
    applies_to: "POST /contracts/{contractId}/close"

# =============================================================================
# §1.5 API Endpoint Table  (FLAT: top-level collections + filtered-list GETs)
# =============================================================================
endpoints:
  # ---------- Counselor ----------
  - method: POST
    path: "/counselors"
    description: "Create a counselor (operator self-registration)"
    roles: [PlatformAdmin, Counselor]
    code: 201
    input: [full_name, email, hourly_rate_cents, "weekly_review_capacity?"]
    output: Counselor
    side_effects: []

  - method: GET
    path: "/counselors/{counselorId}"
    description: "Get a counselor"
    roles: [PlatformAdmin, Counselor]
    code: 200
    input: []
    output: Counselor
    side_effects: []

  # ---------- Student ----------
  - method: POST
    path: "/students"
    description: "Create (intake) a student assigned to a counselor; starts in PROSPECT"
    roles: [Counselor]
    code: 201
    input: [counselor_id, full_name, email, grad_year, gpa, "sat_total?"]
    output: Student
    side_effects: ["intake_status=PROSPECT, profile_strength=0, list_locked=false"]

  - method: GET
    path: "/students/{studentId}"
    description: "Get a student with computed profile_strength and list_locked"
    roles: [Counselor, Student]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/students"
    description: "List students; filterable by counselor_id (reverse-reachability for Student.counselor_id)"
    roles: [Counselor, PlatformAdmin]
    code: 200
    input: ["counselor_id?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  - method: POST
    path: "/students/{studentId}/transition"
    description: "Transition the student intake lifecycle (to_status one of ONBOARDED, GRADUATED, WITHDRAWN); ONBOARDED recomputes profile_strength"
    roles: [Counselor]
    code: 200
    input: [to_status]
    output: Student
    side_effects: ["On ONBOARDED recompute profile_strength", "Enforce intake/graduation/withdraw preconditions per state machine"]

  # ---------- EngagementContract ----------
  - method: POST
    path: "/contracts"
    description: "Create an EngagementContract in DRAFT; rejects a coverage window that interpenetrates a non-VOID contract for the same student"
    roles: [Counselor]
    code: 201
    input: [student_id, billing_model, coverage_start_utc, coverage_end_utc, "package_fee_cents?", "package_milestones?", "hourly_rate_cents?", "retainer_deposit_cents?"]
    output: EngagementContract
    side_effects: ["status=DRAFT, copy counselor_id from student, all computed balances=0"]

  - method: GET
    path: "/contracts/{contractId}"
    description: "Get a contract with computed ledger balances"
    roles: [Counselor, Student]
    code: 200
    input: []
    output: EngagementContract
    side_effects: []

  - method: GET
    path: "/contracts"
    description: "List contracts; filterable by student_id (reverse-reachability for EngagementContract.student_id and counselor_id)"
    roles: [Counselor, Student]
    code: 200
    input: ["student_id?", "counselor_id?", "limit?", "offset?"]
    output: EngagementContract[]
    side_effects: []

  - method: POST
    path: "/contracts/{contractId}/activate"
    description: "Activate a DRAFT contract; OCC-guarded on student version; bubbles student to ACTIVE and posts retainer deposit"
    roles: [Counselor]
    code: 200
    input: [expected_student_version]
    output: EngagementContract
    side_effects: ["Post retainer deposit CREDIT if any", "Recompute ledger", "Bubble Student ONBOARDED->ACTIVE", "increments Student.version by 1", "increments EngagementContract.version by 1"]

  - method: POST
    path: "/contracts/{contractId}/close"
    description: "Close an ACTIVE contract"
    roles: [Counselor]
    code: 200
    input: []
    output: EngagementContract
    side_effects: ["Recompute ledger", "increments EngagementContract.version by 1"]

  - method: POST
    path: "/contracts/{contractId}/void"
    description: "Void a DRAFT contract with no billing entries"
    roles: [Counselor]
    code: 200
    input: []
    output: EngagementContract
    side_effects: ["increments EngagementContract.version by 1"]

  # ---------- BillingEntry ----------
  - method: POST
    path: "/billing-entries"
    description: "Append a manual BillingEntry (CHARGE or CREDIT) to an ACTIVE contract"
    roles: [Counselor]
    code: 201
    input: [contract_id, entry_type, source_kind, amount_cents, "source_id?", "minutes?", "memo?"]
    output: BillingEntry
    side_effects: ["Recompute retainer_ledger + projected_retainer_balance on the contract"]

  - method: GET
    path: "/billing-entries/{entryId}"
    description: "Get a billing entry"
    roles: [Counselor, Student]
    code: 200
    input: []
    output: BillingEntry
    side_effects: []

  - method: GET
    path: "/billing-entries"
    description: "List billing entries; filterable by contract_id (reverse-reachability for BillingEntry.contract_id)"
    roles: [Counselor, Student]
    code: 200
    input: ["contract_id?", "limit?", "offset?"]
    output: BillingEntry[]
    side_effects: []

  # ---------- SchoolListItem ----------
  - method: POST
    path: "/school-list-items"
    description: "Add a candidate school; computes admit_probability and classification"
    roles: [Counselor]
    code: 201
    input: [student_id, school_name, admit_rate, median_sat, "round?"]
    output: SchoolListItem
    side_effects: ["status=CANDIDATE", "Recompute admit_probability + classification"]

  - method: GET
    path: "/school-list-items/{itemId}"
    description: "Get a school-list item"
    roles: [Counselor, Student]
    code: 200
    input: []
    output: SchoolListItem
    side_effects: []

  - method: GET
    path: "/school-list-items"
    description: "List school-list items; filterable by student_id (reverse-reachability for SchoolListItem.student_id)"
    roles: [Counselor, Student]
    code: 200
    input: ["student_id?", "status?", "limit?", "offset?"]
    output: SchoolListItem[]
    side_effects: []

  - method: POST
    path: "/school-list-items/{itemId}/select"
    description: "Select a CANDIDATE into the list (CANDIDATE->SELECTED); OCC-guarded on student version; recomputes list_locked"
    roles: [Counselor]
    code: 200
    input: [expected_student_version]
    output: SchoolListItem
    side_effects: ["status=SELECTED", "Recompute Student.list_locked (calc list_balance_lock)", "increments Student.version by 1"]

  - method: POST
    path: "/school-list-items/{itemId}/drop"
    description: "Drop a school-list item (CANDIDATE/SELECTED -> DROPPED); recomputes list_locked"
    roles: [Counselor]
    code: 200
    input: []
    output: SchoolListItem
    side_effects: ["status=DROPPED", "Recompute Student.list_locked"]

  # ---------- Application ----------
  - method: POST
    path: "/applications"
    description: "Create an Application against a SELECTED school-list item"
    roles: [Counselor]
    code: 201
    input: [student_id, school_list_item_id, round, deadline_utc]
    output: Application
    side_effects: ["prep_status=NOT_STARTED, decision_status=PENDING, open_task_count=0"]

  - method: GET
    path: "/applications/{applicationId}"
    description: "Get an application with computed open_task_count"
    roles: [Counselor, Student]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/applications"
    description: "List applications; filterable by student_id and school_list_item_id (reverse-reachability for both FKs)"
    roles: [Counselor, Student]
    code: 200
    input: ["student_id?", "school_list_item_id?", "round?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/applications/{applicationId}/start-prep"
    description: "prep_status NOT_STARTED -> IN_PROGRESS"
    roles: [Counselor]
    code: 200
    input: []
    output: Application
    side_effects: ["Recompute open_task_count"]

  - method: POST
    path: "/applications/{applicationId}/mark-ready"
    description: "prep_status IN_PROGRESS -> READY (requires open_task_count==0)"
    roles: [Counselor]
    code: 200
    input: []
    output: Application
    side_effects: ["Recompute open_task_count"]

  - method: POST
    path: "/applications/{applicationId}/submit"
    description: "prep_status READY -> SUBMITTED (requires now < deadline_utc)"
    roles: [Counselor]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/applications/{applicationId}/record-decision"
    description: "Record/advance the decision_status dimension (ADMITTED/DENIED/WAITLISTED/DEFERRED, or appeal outcome)"
    roles: [Counselor]
    code: 200
    input: [decision]
    output: Application
    side_effects: []

  - method: POST
    path: "/applications/{applicationId}/appeal"
    description: "decision_status DENIED -> APPEALING; appends an appeal-letter task"
    roles: [Counselor]
    code: 200
    input: []
    output: Application
    side_effects: ["Append appeal-letter ApplicationTask", "Recompute open_task_count"]

  # ---------- ApplicationTask ----------
  - method: POST
    path: "/application-tasks"
    description: "Create a task under an application"
    roles: [Counselor]
    code: 201
    input: [application_id, title, task_type, due_utc, "estimated_cost_cents?", "blocks_submission?"]
    output: ApplicationTask
    side_effects: ["status=OPEN", "Recompute parent Application.open_task_count"]

  - method: GET
    path: "/application-tasks/{taskId}"
    description: "Get a task"
    roles: [Counselor, Student]
    code: 200
    input: []
    output: ApplicationTask
    side_effects: []

  - method: GET
    path: "/application-tasks"
    description: "List tasks; filterable by application_id (reverse-reachability for ApplicationTask.application_id)"
    roles: [Counselor, Student]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: ApplicationTask[]
    side_effects: []

  - method: POST
    path: "/application-tasks/{taskId}/transition"
    description: "Transition a task status per the ApplicationTask state machine"
    roles: [Counselor]
    code: 200
    input: [to_status]
    output: ApplicationTask
    side_effects: ["Possible billing CHARGE on DONE", "Recompute parent Application.open_task_count"]

  # ---------- Essay ----------
  - method: POST
    path: "/essays"
    description: "Create an essay in DRAFTING"
    roles: [Counselor, Student]
    code: 201
    input: [student_id, prompt, word_limit, "application_id?"]
    output: Essay
    side_effects: ["status=DRAFTING, revision_round=0, latest_version_no=0"]

  - method: GET
    path: "/essays/{essayId}"
    description: "Get an essay with computed revision_round and latest_version_no"
    roles: [Counselor, Student]
    code: 200
    input: []
    output: Essay
    side_effects: []

  - method: GET
    path: "/essays"
    description: "List essays; filterable by student_id and application_id (reverse-reachability for both FKs)"
    roles: [Counselor, Student]
    code: 200
    input: ["student_id?", "application_id?", "limit?", "offset?"]
    output: Essay[]
    side_effects: []

  - method: POST
    path: "/essays/{essayId}/submit-version"
    description: "Submit a new draft version (DRAFTING -> IN_REVIEW); enforces word limit and weekly review capacity"
    roles: [Student, Counselor]
    code: 200
    input: [word_count, body]
    output: Essay
    side_effects: ["Append EssayVersion", "Set latest_version_no", "increments Essay.version by 1"]

  - method: POST
    path: "/essays/{essayId}/request-revision"
    description: "Counselor sends essay back (IN_REVIEW -> REVISION_REQUESTED); may demote a READY application"
    roles: [Counselor]
    code: 200
    input: []
    output: Essay
    side_effects: ["Increment revision_round", "Demote READY application -> IN_PROGRESS (cascade)", "increments Essay.version by 1"]

  - method: POST
    path: "/essays/{essayId}/resume-drafting"
    description: "Student resumes editing (REVISION_REQUESTED -> DRAFTING)"
    roles: [Student, Counselor]
    code: 200
    input: []
    output: Essay
    side_effects: ["increments Essay.version by 1"]

  - method: POST
    path: "/essays/{essayId}/approve"
    description: "Counselor approves essay (-> APPROVED); marks the linked essay task DONE"
    roles: [Counselor]
    code: 200
    input: []
    output: Essay
    side_effects: ["Mark linked ESSAY task DONE (cascade)", "increments Essay.version by 1"]

  - method: POST
    path: "/essays/{essayId}/abandon"
    description: "Abandon an essay (-> ABANDONED)"
    roles: [Counselor]
    code: 200
    input: []
    output: Essay
    side_effects: ["increments Essay.version by 1"]

  # ---------- EssayVersion ----------
  - method: GET
    path: "/essay-versions/{versionId}"
    description: "Get an essay version snapshot"
    roles: [Counselor, Student]
    code: 200
    input: []
    output: EssayVersion
    side_effects: []

  - method: GET
    path: "/essay-versions"
    description: "List essay versions; filterable by essay_id (reverse-reachability for EssayVersion.essay_id)"
    roles: [Counselor, Student]
    code: 200
    input: ["essay_id?", "limit?", "offset?"]
    output: EssayVersion[]
    side_effects: []

  # ---------- RecommendationRequest ----------
  - method: POST
    path: "/recommendations"
    description: "Create a recommendation request"
    roles: [Counselor, Student]
    code: 201
    input: [student_id, recommender_name, recommender_email, rec_type]
    output: RecommendationRequest
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/recommendations/{recId}"
    description: "Get a recommendation request"
    roles: [Counselor, Student]
    code: 200
    input: []
    output: RecommendationRequest
    side_effects: []

  - method: GET
    path: "/recommendations"
    description: "List recommendation requests; filterable by student_id (reverse-reachability for RecommendationRequest.student_id)"
    roles: [Counselor, Student]
    code: 200
    input: ["student_id?", "status?", "limit?", "offset?"]
    output: RecommendationRequest[]
    side_effects: []

  - method: POST
    path: "/recommendations/{recId}/transition"
    description: "Transition a recommendation status (ACCEPT/SUBMIT/DECLINE)"
    roles: [Counselor]
    code: 200
    input: [to_status]
    output: RecommendationRequest
    side_effects: ["On SUBMITTED, recompute affected Application.open_task_count"]

  # ---------- ActivityEntry ----------
  - method: POST
    path: "/activities"
    description: "Add an activity-résumé entry; recompute profile_strength"
    roles: [Counselor, Student]
    code: 201
    input: [student_id, title, category, hours_per_week, weeks_per_year, tier]
    output: ActivityEntry
    side_effects: ["Recompute Student.profile_strength (calc student_profile_strength)"]

  - method: GET
    path: "/activities/{activityId}"
    description: "Get an activity entry"
    roles: [Counselor, Student]
    code: 200
    input: []
    output: ActivityEntry
    side_effects: []

  - method: GET
    path: "/activities"
    description: "List activity entries; filterable by student_id (reverse-reachability for ActivityEntry.student_id)"
    roles: [Counselor, Student]
    code: 200
    input: ["student_id?", "category?", "limit?", "offset?"]
    output: ActivityEntry[]
    side_effects: []

  # ---------- ScholarshipAward ----------
  - method: POST
    path: "/scholarships"
    description: "Record a scholarship/aid award (OFFERED); computes informational net_amount_cents"
    roles: [Counselor]
    code: 201
    input: [student_id, award_name, award_type, gross_amount_cents, "application_id?"]
    output: ScholarshipAward
    side_effects: ["status=OFFERED", "Recompute net_amount_cents for the student's awards"]

  - method: GET
    path: "/scholarships/{awardId}"
    description: "Get a scholarship award"
    roles: [Counselor, Student]
    code: 200
    input: []
    output: ScholarshipAward
    side_effects: []

  - method: GET
    path: "/scholarships"
    description: "List scholarship awards; filterable by student_id and application_id (reverse-reachability for both FKs)"
    roles: [Counselor, Student]
    code: 200
    input: ["student_id?", "application_id?", "status?", "limit?", "offset?"]
    output: ScholarshipAward[]
    side_effects: []

  - method: POST
    path: "/scholarships/{awardId}/transition"
    description: "Accept or decline a scholarship award; recomputes net amounts via waterfall"
    roles: [Counselor]
    code: 200
    input: [to_status]
    output: ScholarshipAward
    side_effects: ["Recompute net_amount_cents for all the student's awards (calc net_aid_amount)"]

  # ---------- Appointment ----------
  - method: POST
    path: "/appointments"
    description: "Book a counselor appointment for a student; rejects buffered overlaps"
    roles: [Counselor]
    code: 201
    input: [student_id, start_utc, end_utc, meeting_type]
    output: Appointment
    side_effects: ["status=BOOKED, copy counselor_id from student"]

  - method: GET
    path: "/appointments/{appointmentId}"
    description: "Get an appointment"
    roles: [Counselor, Student]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: GET
    path: "/appointments"
    description: "List appointments; filterable by student_id and counselor_id (reverse-reachability for both FKs)"
    roles: [Counselor, Student]
    code: 200
    input: ["student_id?", "counselor_id?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: POST
    path: "/appointments/{appointmentId}/complete"
    description: "Complete an appointment (>= start); bills minutes on HOURLY contracts"
    roles: [Counselor]
    code: 200
    input: []
    output: Appointment
    side_effects: ["Set billed_minutes", "Possible HOURLY billing CHARGE", "increments Appointment.version by 1"]

  - method: POST
    path: "/appointments/{appointmentId}/cancel"
    description: "Cancel a BOOKED appointment"
    roles: [Counselor]
    code: 200
    input: []
    output: Appointment
    side_effects: ["increments Appointment.version by 1"]

  # ---------- Test-driving: logical clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock used for all deadline/appeal/appointment time checks. Server startup default is 2026-04-01T00:00:00Z; before any set_current_utc call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Sets the logical clock to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or acting on a resource the caller does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource missing" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "FK body field references a non-existent or cross-student row" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, out-of-range number" }
  - { id: ERR_BILLING_MODEL_INCOHERENT, http: 422, condition: "Contract billing-model fields inconsistent (PACKAGE vs HOURLY)" }
  - { id: ERR_STALE_STUDENT_VERSION, http: 412, condition: "expected_student_version != current Student.version on an OCC-guarded write" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_STUDENT_NOT_ONBOARDED, http: 409, condition: "Contract activation requires Student.intake_status IN {ONBOARDED, ACTIVE}" }
  - { id: ERR_CONTRACT_ALREADY_ACTIVE, http: 409, condition: "Another EngagementContract for the student is already ACTIVE (also blocks graduate/withdraw)" }
  - { id: ERR_CONTRACT_HAS_ENTRIES, http: 409, condition: "Cannot void a contract that has billing entries" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 409, condition: "Cannot close a contract while retainer_balance_cents < 0" }
  - { id: ERR_OPEN_APPLICATIONS, http: 409, condition: "Cannot close a contract while an application is in prep NOT_STARTED/IN_PROGRESS/READY" }
  - { id: ERR_INTAKE_INCOMPLETE, http: 409, condition: "Onboard requires >=1 activity and sat_total != 0" }
  - { id: ERR_APPLICATIONS_IN_FLIGHT, http: 409, condition: "Graduate requires every application to have a decision or be SUBMITTED" }
  - { id: ERR_SCHOOL_NOT_SELECTED, http: 409, condition: "start-prep requires the SchoolListItem to be SELECTED" }
  - { id: ERR_OPEN_TASKS_REMAIN, http: 409, condition: "mark-ready/submit require open_task_count == 0" }
  - { id: ERR_DEADLINE_PASSED, http: 409, condition: "Application submit attempted at or after deadline_utc" }
  - { id: ERR_TASK_DUE_AFTER_DEADLINE, http: 422, condition: "Task due_utc later than parent application deadline_utc" }
  - { id: ERR_ED_CONFLICT, http: 409, condition: "A second binding ED application would violate the single-ED rule" }
  - { id: ERR_DEFER_NOT_ALLOWED, http: 409, condition: "DEFERRED decision attempted on an RD-round application" }
  - { id: ERR_NOT_SUBMITTED, http: 409, condition: "record-decision attempted before prep_status == SUBMITTED" }
  - { id: ERR_WORD_LIMIT_EXCEEDED, http: 422, condition: "Essay version word_count exceeds word_limit" }
  - { id: ERR_REVIEW_CAPACITY_EXCEEDED, http: 409, condition: "Counselor's weekly review capacity reached for the current ISO week" }
  - { id: ERR_REVISION_REQUIRED, http: 409, condition: "Essay approve attempted with revision_round < 1" }
  - { id: ERR_NO_VERSION_TO_REVIEW, http: 409, condition: "Essay action requires at least one submitted version" }
  - { id: ERR_AWARD_NOT_ADMITTED, http: 409, condition: "Accepting a MERIT/NEED award before the tied application is ADMITTED" }
  - { id: ERR_APPOINTMENT_NOT_STARTED, http: 409, condition: "Appointment complete attempted before start_utc" }
  - { id: ERR_APPOINTMENT_OVERLAP, http: 409, condition: "Booked appointment overlaps another (half-open, buffered) appointment for the counselor" }
  - { id: ERR_CONTRACT_COVERAGE_OVERLAP, http: 409, condition: "New contract coverage window interpenetrates a non-VOID contract window for the same student (closed, adjacency-allowed)" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "Appeal attempted after deadline_utc + APPEAL_WINDOW_DAYS" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Counselor
    description: "Independent admissions counselor. Owns the consulting surface for students assigned to them (Student.counselor_id == X-User-ID): strategy, school list, applications, tasks, essay reviews, recommendations, scholarships, appointments, billing."
    identity: "entity_backed:Counselor"
    exclusive_operations:
      - "POST /students — intake a student"
      - "POST /students/{id}/transition — student lifecycle (ONBOARDED|GRADUATED|WITHDRAWN)"
      - "POST /contracts and /contracts/{id}/activate|close|void — contract lifecycle"
      - "POST /billing-entries — manual billing"
      - "POST /school-list-items and /school-list-items/{id}/select|drop — school strategy"
      - "POST /applications and /applications/{id}/start-prep|mark-ready|submit|record-decision|appeal"
      - "POST /application-tasks and /application-tasks/{id}/transition"
      - "POST /essays/{id}/request-revision|approve|abandon — essay coaching control"
      - "POST /recommendations/{id}/transition"
      - "POST /scholarships and /scholarships/{id}/transition"
      - "POST /appointments and /appointments/{id}/complete|cancel"
    shared_operations:
      - "POST /counselors — create counselor (with PlatformAdmin)"
      - "POST /essays — create essay (with Student)"
      - "POST /essays/{id}/submit-version|resume-drafting (with Student)"
      - "POST /recommendations — create (with Student)"
      - "POST /activities — add activity (with Student)"
      - "All GET reads on their own students' resources (with Student)"

  - name: Student
    description: "The applicant. Acts only on their own resources (Student.id == X-User-ID): intake profile, activity résumé, essay drafting/submission, recommendation requests, and reads."
    identity: "entity_backed:Student"
    exclusive_operations: []
    shared_operations:
      - "POST /essays — create own essay (with Counselor)"
      - "POST /essays/{id}/submit-version — submit own draft (with Counselor)"
      - "POST /essays/{id}/resume-drafting (with Counselor)"
      - "POST /recommendations — request own recommendation (with Counselor)"
      - "POST /activities — add own activity (with Counselor)"
      - "All GET reads scoped to own resources (with Counselor)"

  - name: PlatformAdmin
    description: "Operational role for platform administration: counselor registry and the logical clock. Not tied to any persisted business entity; never asserts ownership over students."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc — set the logical clock"
    shared_operations:
      - "POST /counselors — create counselor (with Counselor)"
      - "GET /counselors/{id}"
      - "GET /students — list across counselors"
