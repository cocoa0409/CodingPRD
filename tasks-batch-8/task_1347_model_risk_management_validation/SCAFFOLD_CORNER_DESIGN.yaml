              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /mrm/models/${m_id}/findings"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { s_at_due: "$.data[0].status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:01Z" }
              as: PlatformAdmin
            - call: "GET /mrm/models/${m_id}/findings"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { s_past_due: "$.data[0].status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /mrm/models/${m_id}/findings"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { s_at_grace: "$.data[0].status" }
            - call: "POST /_clock/set_current_utc"
