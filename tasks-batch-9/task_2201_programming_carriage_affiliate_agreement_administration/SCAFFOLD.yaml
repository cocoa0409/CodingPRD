    roles: [RightsAdministrator]
    code: 201
    input: [title, home_territory_code, linear_premiere_at]
    output: ContentTitle
    side_effects: ["rights_status = PENDING_CLEARANCE, cleared_window_count = 0, distribution_coverage_status = UNDISTRIBUTED, version = 1"]

  - method: GET
    path: "/carriage/content-titles"
    description: "List titles with rights and coverage filters"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, RightsAdministrator, DistributorLiaison]
    code: 200
    input: ["rights_status?", "distribution_coverage_status?", "home_territory_code?", "limit?", "offset?"]
    output: ContentTitle[]
    side_effects: []

  - method: GET
    path: "/carriage/content-titles/{titleId}"
    description: "Read one title including derived coverage status"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, RightsAdministrator, DistributorLiaison]
    code: 200
    input: []
    output: ContentTitle
    side_effects: []

  - method: POST
    path: "/carriage/content-titles/{titleId}/rights-status"
    description: "Set the title's rights_status to OWNED_CLEARED | THIRD_PARTY_LICENSED | EXPIRED_RIGHTS | PENDING_CLEARANCE"
    roles: [RightsAdministrator]
    code: 200
    input: [rights_status]
    output: ContentTitle
    side_effects:
      - "moving to EXPIRED_RIGHTS transitions every RightsWindow of this title with status IN {CLEARED, ACTIVE} to BLOCKED with block_reason = RIGHTS_LAPSED, then re-derives cleared_window_count and distribution_coverage_status"
      - "increments ContentTitle.version by 1"

  # ---------------- RightsWindow ----------------
  - method: POST
    path: "/carriage/rights-windows"
    description: "Plan a platform/territory licensing window for a title under an agreement"
    roles: [RightsAdministrator]
    code: 201
    input: [agreement_id, content_title_id, platform, territory_code, window_start, window_end, exclusivity]
    output: RightsWindow
    side_effects:
      - "status = PLANNED, block_reason = NONE, concurrent_licensee_count = 0, version = 1"
      - "windowing_holdback_days stamped from the title's linear_premiere_at; a PLANNED window occupies nothing, so no occupancy check runs at creation"

  - method: GET
    path: "/carriage/rights-windows"
    description: "List windows, filterable by agreement, title, platform, territory or status"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, RightsAdministrator, DistributorLiaison]
    code: 200
    input: ["agreement_id?", "content_title_id?", "platform?", "territory_code?", "status?", "exclusivity?", "limit?", "offset?"]
    output: RightsWindow[]
    side_effects: []

  - method: GET
    path: "/carriage/rights-windows/{windowId}"
    description: "Read one window including its concurrency count and block reason"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, RightsAdministrator, DistributorLiaison]
    code: 200
    input: []
    output: RightsWindow
    side_effects: []

  - method: POST
    path: "/carriage/rights-windows/{windowId}/lifecycle"
    description: "Window action: CLEAR | BLOCK | UNBLOCK"
    roles: [RightsAdministrator]
    code: 200
    input: [action, "block_reason?"]
    output: RightsWindow
    side_effects:
      - "CLEAR / UNBLOCK: run calculations.rights_window_occupancy (half-open interval, exclusivity and aggregate cap), then increment ContentTitle.cleared_window_count and re-derive distribution_coverage_status"
      - "BLOCK: decrement ContentTitle.cleared_window_count and re-derive distribution_coverage_status"
      - "increments RightsWindow.version by 1 and ContentTitle.version by 1"

  # ---------------- BlackoutRule ----------------
  - method: POST
    path: "/carriage/blackout-rules"
    description: "Schedule a territorial blackout with optional program substitution; runs the closed-interval separation and monthly-cap checks"
    roles: [RightsAdministrator]
    code: 201
    input: [agreement_id, territory_code, blackout_start, blackout_end, "substitution_required?", "substitute_content_title_id?"]
    output: BlackoutRule
    side_effects:
      - "status = SCHEDULED, enforced_at = null, version = 1"
      - "blackout_hours and monthly_blackout_hours stamped by calculations.blackout_separation"

  - method: GET
    path: "/carriage/blackout-rules"
    description: "List blackout rules, filterable by agreement, substitution title, territory or status"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, RightsAdministrator, DistributorLiaison]
    code: 200
    input: ["agreement_id?", "substitute_content_title_id?", "territory_code?", "status?", "limit?", "offset?"]
    output: BlackoutRule[]
    side_effects: []

  - method: GET
    path: "/carriage/blackout-rules/{blackoutRuleId}"
    description: "Read one blackout rule with its hour accounting"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, RightsAdministrator, DistributorLiaison]
    code: 200
    input: []
    output: BlackoutRule
    side_effects: []

  - method: POST
    path: "/carriage/blackout-rules/{blackoutRuleId}/lifecycle"
    description: "Blackout action: ENFORCE | WAIVE"
    roles: [RightsAdministrator]
    code: 200
    input: [action]
    output: BlackoutRule
    side_effects:
      - "ENFORCE: status SCHEDULED -> ENFORCED, enforced_at = LogicalClock.current_utc, then every RightsWindow of the same agreement and territory_code with status IN {CLEARED, ACTIVE} whose half-open interval intersects the closed blackout interval transitions to BLOCKED with block_reason = BLACKOUT_CONFLICT, then each affected ContentTitle re-derives cleared_window_count and distribution_coverage_status"
      - "WAIVE: status SCHEDULED -> WAIVED; the rule stops conflicting and stops counting toward monthly_blackout_hours"
      - "increments BlackoutRule.version by 1"

  # ---------------- MarketingCommitment ----------------
  - method: POST
    path: "/carriage/marketing-commitments"
    description: "Open a marketing, co-op advertising or launch-fee commitment line under an agreement"
    roles: [AffiliateSalesExec]
    code: 201
    input: [agreement_id, commitment_type, committed_cents, performance_deadline]
    output: MarketingCommitment
    side_effects: ["status = OPEN, earned_cents = 0, earned_unbilled_cents = 0, billed_cents = 0, forfeited_cents = 0, remaining_cents = committed_cents, version = 1"]

  - method: GET
    path: "/carriage/marketing-commitments"
    description: "List commitment lines, filterable by agreement, type or status"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: ["agreement_id?", "commitment_type?", "status?", "limit?", "offset?"]
    output: MarketingCommitment[]
    side_effects: []

  - method: GET
    path: "/carriage/marketing-commitments/{commitmentId}"
    description: "Read one commitment line with its full conserved-quantity ledger"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: []
    output: MarketingCommitment
    side_effects: []

  - method: POST
    path: "/carriage/marketing-commitments/{commitmentId}/earn"
    description: "Record accepted proof of performance, moving dollars from remaining to earned"
    roles: [AffiliateSalesExec]
    code: 200
    input: [earned_cents, proof_reference]
    output: MarketingCommitment
    side_effects:
      - "runs calculations.marketing_commitment_ledger EARN branch; committed_cents == earned_cents + remaining_cents + forfeited_cents is preserved"
      - "increments MarketingCommitment.version by 1"

  # ---------------- Invoice ----------------
  - method: POST
    path: "/carriage/invoices"
    description: "Draft a LICENSE_FEE or AUDIT_RECOVERY invoice; OCC-guarded on the distributor"
    roles: [RevenueAccountant]
    code: 201
    input: [distributor_id, agreement_id, period_month, invoice_kind, "audit_engagement_id?", expected_distributor_version]
    output: Invoice
    side_effects:
      - "status = DRAFT, paid_cents = 0, issued_at = null, version = 1"
      - "runs calculations.invoice_net_due in the pinned six-step order and stamps gross_license_fee_cents, coop_cap_pct, coop_offset_cents, launch_fee_offset_cents, recovery_adjustment_cents, net_due_cents and carryforward_cents"
      - "for invoice_kind == AUDIT_RECOVERY the named AuditEngagement transitions FINDINGS_ISSUED -> RECOVERY_INVOICED and its recovery_invoice_id is set"
      - "increments Distributor.version by 1"

  - method: GET
    path: "/carriage/invoices"
    description: "List invoices, filterable by distributor, agreement, engagement, kind or status"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: ["distributor_id?", "agreement_id?", "audit_engagement_id?", "invoice_kind?", "status?", "period_month?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/carriage/invoices/{invoiceId}"
    description: "Read one invoice with the full six-step net-due breakdown"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/carriage/invoices/{invoiceId}/lifecycle"
    description: "Invoice action: ISSUE | RECORD_PAYMENT | WRITE_OFF | VOID"
    roles: [RevenueAccountant]
    code: 200
    input: [action, "amount_cents?"]
    output: Invoice
    side_effects:
      - "ISSUE: runs the five-link cascade declared on SM6's DRAFT -> ISSUED transition (receivable increase, possible operator CREDIT_HOLD, agreement suspension, window blocking, title coverage re-derivation) and consumes MarketingCommitment offsets"
      - "RECORD_PAYMENT: applies amount_cents, reduces the operator receivable, and on full settlement of an AUDIT_RECOVERY invoice moves the engagement RECOVERY_INVOICED -> COLLECTED"
      - "VOID: runs the compensating restoration declared on SM6, leaving Distributor.receivable_balance_cents and every touched MarketingCommitment ledger identical to their pre-issue values"
      - "increments Invoice.version by 1 and Distributor.version by 1 whenever the receivable moves"

  # ---------------- RenewalAnalysis ----------------
  - method: POST
    path: "/carriage/renewal-analyses"
    description: "Run the negotiation-leverage and distribution-loss model for one agreement under a chosen variant"
    roles: [AffiliateSalesExec]
    code: 201
    input: [agreement_id, variant]
    output: RenewalAnalysis
    side_effects:
      - "runs calculations.renewal_leverage_model and stamps every computed field; immutable once created (no version field, no update endpoint)"
      - "does NOT change the agreement's renewal_status — that requires POST /carriage/agreements/{agreementId}/renewal"

  - method: GET
    path: "/carriage/renewal-analyses"
    description: "List renewal analyses, filterable by agreement, variant or the report that drove them"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: ["agreement_id?", "variant?", "latest_accepted_report_id?", "limit?", "offset?"]
    output: RenewalAnalysis[]
    side_effects: []

  - method: GET
    path: "/carriage/renewal-analyses/{analysisId}"
    description: "Read one renewal analysis"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: []
    output: RenewalAnalysis
    side_effects: []

  # ---------------- Test-driving logical clock ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical now. The startup default is exactly 2026-08-01T00:00:00Z and the clock NEVER falls back to real wall-clock time; every deadline, expiry, window-activation, interest-accrual and holdback rule reads this value. Time may only move forward."
    roles: [NetworkAdmin]
    code: 200
    input: [to_iso8601]
    output: LogicalClock
    side_effects:
      - "set_count += 1"
      - "SWEEP ORDER IS PINNED and runs once per call: (1) CarriageAgreement rows with lifecycle_status IN {EXECUTED, SUSPENDED} and term_end_date <= current_utc transition to EXPIRED, in term_end_date ASC then created_at ASC order, forcing renewal_status to LAPSED when it was RENEWAL_ANALYSIS or RENEWAL_OFFERED; (2) RightsWindow rows with status == CLEARED and window_start <= current_utc < window_end transition to ACTIVE, in window_start ASC then created_at ASC order; (3) RightsWindow rows with status IN {CLEARED, ACTIVE} and window_end <= current_utc transition to EXPIRED; (4) BlackoutRule rows with status == SCHEDULED and blackout_end < current_utc transition to EXPIRED; (5) MarketingCommitment rows with current_utc > performance_deadline and remaining_cents > 0 forfeit their remainder, in performance_deadline ASC then created_at ASC order; (6) every ContentTitle touched by steps 2-3 re-derives cleared_window_count and distribution_coverage_status"
      - "rejected with ERR_CLOCK_MUST_MOVE_FORWARD when to_iso8601 <= the current logical time"

  - method: GET
    path: "/_clock"
    description: "Read the server's logical now and how many times it has been advanced"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, RightsAdministrator, DistributorLiaison]
    code: 200
    input: []
    output: LogicalClock
    side_effects: []

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # ---- authentication / authorization / request shape ----
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "The acting role is not listed in the called endpoint's roles" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The same X-User-ID that executed an agreement attempts to accept one of its SubscriberReport rows, or the X-User-ID that issued an engagement's findings attempts to create its AUDIT_RECOVERY invoice" }
  - { id: ERR_DISTRIBUTOR_SCOPE_VIOLATION, http: 403, condition: "A DistributorLiaison acts on a resource whose resolved Distributor.id differs from its X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, undeclared enum member, wrong type, negative money or subscriber value, malformed period_month or territory_code, or term_end_date <= term_start_date" }

  # ---- existence ----
  - { id: ERR_DISTRIBUTOR_NOT_FOUND, http: 404, condition: "distributorId path parameter or distributor_id body field names no Distributor" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "agreementId path parameter or agreement_id body field names no CarriageAgreement" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "reportId path parameter, subscriber_report_id or restatement_of_report_id names no SubscriberReport" }
  - { id: ERR_ENGAGEMENT_NOT_FOUND, http: 404, condition: "engagementId path parameter or audit_engagement_id body field names no AuditEngagement" }
  - { id: ERR_FINDING_NOT_FOUND, http: 404, condition: "findingId path parameter names no AuditFinding" }
  - { id: ERR_TITLE_NOT_FOUND, http: 404, condition: "titleId, content_title_id or substitute_content_title_id names no ContentTitle" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "windowId path parameter names no RightsWindow" }
  - { id: ERR_BLACKOUT_NOT_FOUND, http: 404, condition: "blackoutRuleId path parameter names no BlackoutRule" }
  - { id: ERR_COMMITMENT_NOT_FOUND, http: 404, condition: "commitmentId path parameter names no MarketingCommitment" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoiceId path parameter names no Invoice" }
  - { id: ERR_MFN_CLAUSE_NOT_FOUND, http: 404, condition: "mfnClauseId path parameter names no MfnClause" }
  - { id: ERR_ANALYSIS_NOT_FOUND, http: 404, condition: "analysisId path parameter names no RenewalAnalysis" }
  - { id: ERR_RATE_CARD_ENTRY_NOT_FOUND, http: 404, condition: "rateCardEntryId path parameter names no RateCardEntry" }

  # ---- optimistic concurrency ----
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version does not equal the current CarriageAgreement.version on POST /carriage/subscriber-reports or POST /carriage/mfn-clauses/{mfnClauseId}/reset" }
  - { id: ERR_STALE_DISTRIBUTOR_VERSION, http: 412, condition: "expected_distributor_version does not equal the current Distributor.version on POST /carriage/invoices" }

  # ---- own-entity state ----
  - { id: ERR_INVALID_AGREEMENT_STATE, http: 409, condition: "The requested lifecycle action is not a declared SM1 transition out of the agreement's current lifecycle_status, or a PATCH is attempted once lifecycle_status IN {EXECUTED, SUSPENDED, EXPIRED, TERMINATED}" }
  - { id: ERR_INVALID_RENEWAL_STATE, http: 409, condition: "The requested renewal action is not a declared SM2 transition out of the agreement's current renewal_status" }
  - { id: ERR_INVALID_REPORT_STATE, http: 409, condition: "The requested review action is not a declared SM3 transition out of the report's current status" }
  - { id: ERR_INVALID_ENGAGEMENT_STATE, http: 409, condition: "The requested engagement action is not a declared SM4 transition, or a finding is recorded while the engagement is not in FIELDWORK" }
  - { id: ERR_INVALID_WINDOW_STATE, http: 409, condition: "The requested window action is not a declared SM5 transition out of the window's current status" }
  - { id: ERR_INVALID_INVOICE_STATE, http: 409, condition: "The requested invoice action is not a declared SM6 transition, or VOID is attempted from ISSUED with paid_cents > 0" }
  - { id: ERR_INVALID_BLACKOUT_STATE, http: 409, condition: "ENFORCE or WAIVE is attempted on a BlackoutRule whose status is not SCHEDULED" }
  - { id: ERR_INVALID_MFN_STATE, http: 409, condition: "RESET or WAIVE is attempted on an MfnClause whose status is not ACTIVE" }

  # ---- cross-entity state ----
  - { id: ERR_AGREEMENT_NOT_EXECUTED, http: 409, condition: "The operation requires the referenced CarriageAgreement.lifecycle_status == EXECUTED but it is DRAFT, NEGOTIATING, SUSPENDED, EXPIRED or TERMINATED" }
  - { id: ERR_DISTRIBUTOR_CREDIT_HOLD, http: 409, condition: "The operation requires Distributor.status == ACTIVE but the operator is CREDIT_HOLD, SUSPENDED or TERMINATED" }
  - { id: ERR_TITLE_RIGHTS_NOT_CLEARED, http: 409, condition: "The RightsWindow's ContentTitle.rights_status is not OWNED_CLEARED" }

  # ---- territorial / blackout compliance ----
  - { id: ERR_BLACKOUT_SEPARATION_VIOLATION, http: 409, condition: "The proposed closed blackout interval, expanded by BLACKOUT_MIN_SEPARATION_HOURS on both sides, touches an existing SCHEDULED or ENFORCED rule of the same (Distributor, territory_code)" }
  - { id: ERR_BLACKOUT_MONTHLY_CAP_EXCEEDED, http: 422, condition: "monthly_blackout_hours for the (Distributor, territory_code) calendar month would exceed MAX_BLACKOUT_HOURS_PER_MONTH" }
  - { id: ERR_BLACKOUT_WINDOW_CONFLICT, http: 409, condition: "A SCHEDULED or ENFORCED BlackoutRule of the same agreement and territory intersects the RightsWindow being cleared or unblocked" }
  - { id: ERR_SUBSTITUTION_TITLE_REQUIRED, http: 422, condition: "substitution_required is true but substitute_content_title_id is absent or names a title whose rights_status is not OWNED_CLEARED" }

  # ---- rights, packaging, uniqueness ----
  - { id: ERR_WINDOW_EXCLUSIVITY_CONFLICT, http: 409, condition: "An EXCLUSIVE window overlaps any CLEARED/ACTIVE window on the same (content_title_id, platform, territory_code), or a NON_EXCLUSIVE window overlaps an EXCLUSIVE one" }
  - { id: ERR_WINDOW_CONCURRENCY_CAP_EXCEEDED, http: 422, condition: "Clearing a NON_EXCLUSIVE window would put more than MAX_CONCURRENT_NONEXCLUSIVE overlapping non-exclusive licensees on the same key" }
  - { id: ERR_HOLDBACK_NOT_SATISFIED, http: 422, condition: "windowing_holdback_days is below PLATFORM_HOLDBACK_DAYS for the window's platform" }
  - { id: ERR_DUPLICATE_ACCEPTED_PERIOD, http: 409, condition: "Another SubscriberReport for the same (agreement_id, period_month) already has status IN {ACCEPTED, AUDIT_ADJUSTED}" }
  - { id: ERR_MULTIPLE_ACTIVE_MFN_CLAUSES, http: 409, condition: "The agreement already has an MfnClause with status == ACTIVE" }
  - { id: ERR_DUPLICATE_CONTRACT_CODE, http: 409, condition: "contract_code is already used by another CarriageAgreement of the same distributor_id" }
  - { id: ERR_RESTATEMENT_TARGET_INVALID, http: 422, condition: "restatement_of_report_id names a report of a different agreement or period_month, or whose status is not RESTATED" }

  # ---- temporal ----
  - { id: ERR_PERIOD_OUTSIDE_TERM, http: 422, condition: "The report's period_month lies outside [month of term_start_date, month of term_end_date]" }
  - { id: ERR_WINDOW_OUTSIDE_TERM, http: 422, condition: "The window's half-open interval is not contained in [term_start_date, term_end_date)" }
  - { id: ERR_RENEWAL_WINDOW_NOT_OPEN, http: 422, condition: "term_end_date is more than RENEWAL_WINDOW_DAYS days away when START_ANALYSIS is attempted" }
  - { id: ERR_WRITE_OFF_TOO_EARLY, http: 422, condition: "WRITE_OFF attempted before issued_at + WRITE_OFF_AGE_DAYS days" }
  - { id: ERR_AUDIT_RIGHTS_EXPIRED, http: 422, condition: "Fieldwork on an EXPIRED agreement starts more than AUDIT_RIGHTS_SURVIVAL_MONTHS months after term_end_date, or sample_period_end is past the month of term_end_date" }
  - { id: ERR_COMMITMENT_DEADLINE_PASSED, http: 422, condition: "An earn is recorded after the commitment's performance_deadline" }
  - { id: ERR_CLOCK_MUST_MOVE_FORWARD, http: 422, condition: "to_iso8601 is less than or equal to the current logical time" }

  # ---- referential / billing integrity ----
  - { id: ERR_AUDIT_PERIOD_NOT_REPORTED, http: 422, condition: "The finding's subscriber_report_id is not an ACCEPTED/AUDIT_ADJUSTED report of the engagement's agreement inside the sample period" }
  - { id: ERR_REPORT_ALREADY_BILLED, http: 409, condition: "A report the LICENSE_FEE invoice would bill already carries a non-null invoice_id" }
  - { id: ERR_NO_BILLABLE_REPORTS, http: 422, condition: "A LICENSE_FEE invoice finds no unbilled ACCEPTED/AUDIT_ADJUSTED report for (agreement_id, period_month), or an AUDIT_RECOVERY invoice names an engagement whose status is not FINDINGS_ISSUED" }
  - { id: ERR_RECOVERY_ALREADY_INVOICED, http: 409, condition: "The named AuditEngagement already has a non-null recovery_invoice_id" }
  - { id: ERR_NO_AUDIT_FINDINGS, http: 422, condition: "ISSUE_FINDINGS attempted with no AuditFinding of positive variance_subscribers" }
  - { id: ERR_FINDINGS_PRESENT_CANNOT_CLOSE, http: 409, condition: "CLOSE_NO_FINDING attempted while at least one AuditFinding has variance_subscribers > 0" }
  - { id: ERR_RENEWAL_REQUIRES_ANALYSIS, http: 422, condition: "OFFER attempted with no RenewalAnalysis row for the agreement" }
  - { id: ERR_OPEN_RECEIVABLE_BLOCKS_TERMINATION, http: 409, condition: "TERMINATE attempted while an Invoice in scope has status IN {ISSUED, PARTIALLY_PAID}" }
  - { id: ERR_BREACH_COUNT_NOT_CLEARED, http: 409, condition: "REINSTATE attempted on an agreement suspended for PENETRATION_BREACH while penetration_breach_count > 0" }

  # ---- fiscal ----
  - { id: ERR_MARKETING_OVEREARN, http: 422, condition: "earned_cents + requested amount would exceed committed_cents" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "amount_cents is <= 0 or exceeds net_due_cents - paid_cents" }
  - { id: ERR_INVOICE_ZERO_NET_DUE, http: 422, condition: "ISSUE attempted on an invoice whose net_due_cents is 0" }
  - { id: ERR_PENETRATION_FLOOR_UNENFORCEABLE, http: 422, condition: "penetration_floor_pct * Distributor.total_subscribers < 1 at execution" }

# =============================================================================
# Table 1.7: RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: AffiliateSalesExec
    description: "Negotiates and executes carriage agreements, attaches MFN clauses, opens marketing commitments and runs renewal models. Never touches subscriber-report acceptance or money movement."
    identity: opaque
    exclusive_operations:
      - "POST /carriage/agreements"
      - "PATCH /carriage/agreements/{agreementId}"
      - "POST /carriage/agreements/{agreementId}/lifecycle"
      - "POST /carriage/agreements/{agreementId}/renewal"
      - "POST /carriage/mfn-clauses"
      - "POST /carriage/mfn-clauses/{mfnClauseId}/reset"
      - "POST /carriage/marketing-commitments"
      - "POST /carriage/marketing-commitments/{commitmentId}/earn"
      - "POST /carriage/renewal-analyses"
    shared_operations:
      - "POST /carriage/distributors (with NetworkAdmin)"
      - "every GET endpoint under /carriage and GET /_clock"

  - name: DistributorLiaison
    description: "Acts on behalf of one distributing operator. Files that operator's monthly subscriber reports and reads that operator's own agreements, invoices and commitments."
    identity: "entity_backed:Distributor"
    exclusive_operations: []
    shared_operations:
      - "POST /carriage/subscriber-reports (with RevenueAccountant), restricted by validations priority 4 to its own Distributor.id"
      - "every GET endpoint under /carriage and GET /_clock, restricted to its own operator's resources by validations priority 4"

  - name: RevenueAccountant
    description: "Owns revenue recognition and receivables: accepts, disputes and restates subscriber reports, drafts and moves invoices, and can place or release credit holds. May never negotiate terms or clear rights."
    identity: opaque
    exclusive_operations:
      - "POST /carriage/subscriber-reports/{reportId}/review"
      - "POST /carriage/invoices"
      - "POST /carriage/invoices/{invoiceId}/lifecycle"
    shared_operations:
      - "POST /carriage/subscriber-reports (with DistributorLiaison)"
      - "POST /carriage/distributors/{distributorId}/credit-review (with NetworkAdmin)"
      - "every GET endpoint under /carriage and GET /_clock"

  - name: AuditManager
    description: "Exercises the network's audit rights: opens engagements, records findings and issues them. Barred from raising the recovery invoice, which is the RevenueAccountant's act."
    identity: opaque
    exclusive_operations:
      - "POST /carriage/audit-engagements"
      - "POST /carriage/audit-engagements/{engagementId}/lifecycle"
      - "POST /carriage/audit-engagements/{engagementId}/findings"
    shared_operations:
      - "every GET endpoint under /carriage and GET /_clock"

  - name: RightsAdministrator
    description: "Administers content rights: registers titles, sets their rights status, plans and clears platform windows, and schedules and enforces territorial blackouts."
    identity: opaque
    exclusive_operations:
      - "POST /carriage/content-titles"
      - "POST /carriage/content-titles/{titleId}/rights-status"
      - "POST /carriage/rights-windows"
      - "POST /carriage/rights-windows/{windowId}/lifecycle"
      - "POST /carriage/blackout-rules"
      - "POST /carriage/blackout-rules/{blackoutRuleId}/lifecycle"
    shared_operations:
      - "GET /carriage/distributors, GET /carriage/agreements, GET /carriage/content-titles, GET /carriage/rights-windows, GET /carriage/blackout-rules, GET /carriage/rate-card-entries and their single-resource forms; GET /_clock"

  - name: NetworkAdmin
    description: "Platform operator: onboards distributors, publishes rate cards, adjusts subscriber bases and credit limits, and drives the logical clock. Deliberately NOT granted agreement, report, audit, rights or invoice write powers."
    identity: opaque
    exclusive_operations:
      - "PATCH /carriage/distributors/{distributorId}"
      - "POST /carriage/rate-card-entries"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /carriage/distributors (with AffiliateSalesExec)"
      - "POST /carriage/distributors/{distributorId}/credit-review (with RevenueAccountant)"
      - "every GET endpoint under /carriage and GET /_clock"

