              payload: { reservation_id: "${res1_id}", reason_code: "MEDICAL", requested_cents: 6292 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /refund-exceptions/${rx_id}/decide"
              payload: { decision: "APPROVED", decision_note_code: "PARTIAL_GOODWILL", approved_cents: 3000 }
              as: GuestServices
              as_user_id: "cs_1"
            - call: "POST /goodwill-credits"
              payload: { refund_exception_id: "${rx_id}", issued_cents: 3292, expires_at_utc: "2027-01-01T00:00:00Z" }
              as: GuestServices
              as_user_id: "cs_2"
              captures: { gc_id: $.data.id }
            - call: "GET /ticket-classes/${tc_id}"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { v2: $.data.version }
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc_id}", guest_id: "${g_id}", party_size: 2, primary_guest_name: "Liability Guest", expected_ticket_class_version: "${v2}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res2_id: $.data.id }
            - call: "GET /goodwill-credits/${gc_id}"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { gc_v: $.data.version }
          trigger:
            - call: "POST /goodwill-credits/${gc_id}/redemptions"
              payload: { reservation_id: "${res2_id}", amount_cents: 1000, expected_goodwill_credit_version: "${gc_v}" }
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /goodwill-credits/${gc_id}/revoke"
              payload: { reason_code: "POLICY_REVIEW" }
              as: GuestServices
              as_user_id: "cs_3"
          assert:
            - "RefundException.${rx_id}.requested_cents == 6292, which is exactly amount_paid 11583 minus refunded 5291, and shortfall_cents == 3292"
            - "at issue GoodwillCredit.${gc_id}: issued 3292, redeemed 0, revoked 0, remaining 3292, status ISSUED, and 3292 == 0 + 0 + 3292"
            - "after the redemption: redeemed_cents == 1000, revoked_cents == 0, remaining_cents == 2292, status == PARTIALLY_REDEEMED, and 3292 == 1000 + 0 + 2292"
            - "a GOODWILL_REDEMPTION PaymentTransaction of 1000 exists with goodwill_credit_id == ${gc_id} and memo_code CREDIT_APPLIED"
            - "Reservation.${res2_id}.goodwill_applied_cents == 1000, amount_paid_cents == 1000 and balance_due_cents == 37610"
            - "Reservation.${res2_id}.payment_status is still UNPAID, because 1000 is below the 11583 deposit"
            - "after the revoke: redeemed_cents == 1000, revoked_cents == 2292, remaining_cents == 0, status == REVOKED, and 3292 == 1000 + 2292 + 0"
            - "the revoke wrote no PaymentTransaction: Reservation.${res2_id}.amount_paid_cents is still 1000 and goodwill_applied_cents still 1000"
            - "GoodwillCredit.${gc_id}.status == REVOKED and not EXHAUSTED, because a positive revoked_cents outranks a zero remainder in the pinned status precedence"
