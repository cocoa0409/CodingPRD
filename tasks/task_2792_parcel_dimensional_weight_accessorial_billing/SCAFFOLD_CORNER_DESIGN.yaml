scaffold_corner_design:

  # =====================================================================
  # SECTION 1 — ENTITIES (§1.1 surface: creation, retrieval, listing,
  # not-found, required fields, defaults, computed/system fields, type
  # constraints, immutability, parent relationships, flat topology)
  # =====================================================================
  - section: entities
    instances:
      - name: shipper_account_creation_returns_server_minted_ledger_defaults
        claim_type: creation
        grounds:
          - entities.ShipperAccount.fields.account_number
          - entities.ShipperAccount.fields.status
          - entities.ShipperAccount.fields.total_shipment_count
          - entities.ShipperAccount.fields.credit_balance_cents
          - entities.ShipperAccount.fields.open_charges_cents
        distinguishing_aspect: |
          A brand-new ShipperAccount is born ACTIVE with all five ledger aggregates at
          exactly 0 and version 1; every one of those numbers is server-minted from an
          empty database rather than echoed from the request body.
        test_recipe:
          setup:
            - "Empty database. The logical clock still reads its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel", billing_email: "ap@acme.example" }
              as: CarrierAdmin
              as_user_id: "admin.one"
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: CarrierAdmin
              as_user_id: "admin.one"
          assert:
            - "The create call returns HTTP 201 with response_type == object and a meta block carrying api_request_id and api_request_timestamp"
            - "ShipperAccount.${sh}.account_number == SH-2001 and name == Acme Parcel and billing_email == ap@acme.example"
            - "ShipperAccount.${sh}.status == ACTIVE"
            - "ShipperAccount.${sh}.total_shipment_count == 0"
            - "ShipperAccount.${sh}.unbilled_shipment_count == 0"
            - "ShipperAccount.${sh}.billed_shipment_count == 0"
            - "ShipperAccount.${sh}.credit_balance_cents == 0"
            - "ShipperAccount.${sh}.open_charges_cents == 0"
            - "ShipperAccount.${sh}.version == 1"
            - "ShipperAccount.${sh}.id is a bare 36-character UUID with no type prefix, and created_at / updated_at are ISO 8601 UTC with three fractional digits"
            - "The follow-up GET returns byte-identical field values to the create response"

      - name: rate_contract_retrieval_round_trips_the_rate_and_tier_tables
        claim_type: retrieval
        grounds:
          - entities.RateContract.fields.rate_table
          - entities.RateContract.fields.tier_discount_table
          - entities.RateContract.fields.accessorial_rate_overrides
          - entities.RateContract.fields.residential_waived
          - entities.RateContract.fields.status
        distinguishing_aspect: |
          A DRAFT RateContract's three structured payloads (rate_table, tier_discount_table,
          accessorial_rate_overrides) come back from GET exactly as submitted, row order
          included, while status is DRAFT and activated_at is null because creation alone
          never activates.
        test_recipe:
          setup:
            - "ShipperAccount SH-2001 is ACTIVE."
            - "One RateContract has been drafted for it with three zone-2 rate rows, two tier rows and a RESIDENTIAL override of 540, and has NOT been activated."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}, {min_transportation_subtotal_cents: 250000, discount_bps: 1250}]
                accessorial_rate_overrides: { RESIDENTIAL: 540 }
              as: CarrierAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "GET /rate-contracts/${c1}"
              payload: {}
              as: BillingOps
          assert:
            - "RateContract.${c1}.status == DRAFT and activated_at == null"
            - "RateContract.${c1}.shipper_id == ${sh} and supersedes_contract_id == null"
            - "RateContract.${c1}.dim_divisor == 139 and min_charge_cents == 1195"
            - "RateContract.${c1}.rate_table has exactly 3 rows in submitted order: (2, 1, 20, 380), (2, 21, 70, 340), (2, 71, 9999, 305)"
            - "RateContract.${c1}.tier_discount_table has exactly 2 rows: (50000, 550) and (250000, 1250)"
            - "RateContract.${c1}.accessorial_rate_overrides == { RESIDENTIAL: 540 }"
            - "RateContract.${c1}.residential_waived == false — the omitted optional defaulted to false"
            - "RateContract.${c1}.version == 1"

      - name: shipment_listing_reports_total_count_and_has_more_across_pages
        claim_type: listing
        grounds:
          - entities.Shipment.fields.tracking_number
          - entities.Shipment.fields.billing_status
        distinguishing_aspect: |
          With three shipments in the database, GET /shipments with limit 2 / offset 0
          returns 2 rows, total_count 3 and has_more true, and offset 2 returns the
          remaining 1 row with has_more false — total_count counts the whole filtered set,
          never the page.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with an ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305)."
            - "ServiceLevel EXPRESS exists (24 h, guaranteed)."
            - "Three shipments 1Z-L-0001, 1Z-L-0002 and 1Z-L-0003 are inducted, each 12 x 10 x 8 in at 6.0 lb, zone 2, non-residential."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-L-0001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-L-0002", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-L-0003", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
          trigger:
            - call: "GET /shipments"
              payload: { shipper_id: "${sh}", limit: 2, offset: 0 }
              as: BillingOps
            - call: "GET /shipments"
              payload: { shipper_id: "${sh}", limit: 2, offset: 2 }
              as: BillingOps
            - call: "GET /shipments"
              payload: { shipper_id: "${sh}", billing_status: "BILLED" }
              as: BillingOps
          assert:
            - "The first page has response_type == array, exactly 2 data rows, limit == 2, offset == 0, total_count == 3 and has_more == true"
            - "The second page has exactly 1 data row, limit == 2, offset == 2, total_count == 3 and has_more == false"
            - "The two pages together cover the three distinct tracking numbers 1Z-L-0001, 1Z-L-0002 and 1Z-L-0003 with no row repeated"
            - "The billing_status == BILLED filter returns 0 rows with total_count == 0 and has_more == false — all three shipments are still UNBILLED"

      - name: unknown_shipment_id_returns_the_not_found_error_envelope
        claim_type: not_found
        grounds:
          - validations[priority=9]  # ERR_SHIPMENT_NOT_FOUND
          - errors[ERR_SHIPMENT_NOT_FOUND]
        distinguishing_aspect: |
          A GET against a well-formed but unknown Shipment id returns HTTP 404 with
          response_type error and a data object holding exactly error_id
          ERR_SHIPMENT_NOT_FOUND and a message — no partial entity is leaked.
        test_recipe:
          setup:
            - "Empty database; no Shipment rows exist at all."
          setup_api_calls: []
          trigger:
            - call: "GET /shipments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BillingOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and ${err} == ERR_SHIPMENT_NOT_FOUND"
            - "response_type == error and data carries exactly the two keys error_id and message"
            - "meta.api_request_id and meta.api_request_timestamp are present on the error envelope too"

      - name: shipment_induction_without_declared_weight_is_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=16]  # ERR_INVALID_REQUEST
          - entities.Shipment.fields.declared_weight_lbs
        distinguishing_aspect: |
          Omitting the required declared_weight_lbs field rejects the induction with HTTP
          400 ERR_INVALID_REQUEST before any pricing runs, and leaves the shipper's
          total_shipment_count at 0.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with an ACTIVE contract C1 and ServiceLevel EXPRESS."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-R-0001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8 }
              as: CarrierOps
              captures: { err: $.data.error_id }
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: CarrierAdmin
          assert:
            - "HTTP status is 400 and ${err} == ERR_INVALID_REQUEST"
            - "ShipperAccount.${sh}.total_shipment_count == 0 and unbilled_shipment_count == 0"
            - "GET /shipments with shipper_id ${sh} returns total_count == 0 — no partial Shipment row was written"

      - name: omitted_shipment_options_fall_back_to_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Shipment.fields.delivery_area_class
          - entities.Shipment.fields.non_conveyable_declared
          - entities.Shipment.fields.measurement_status
          - entities.Shipment.fields.movement_status
          - entities.Shipment.fields.billing_status
        distinguishing_aspect: |
          Inducting a parcel without delivery_area_class or non_conveyable_declared yields
          delivery_area_class NONE and non_conveyable_declared false, which in turn means
          zero AccessorialCharge rows and accessorial_total_cents 0, while the three status
          axes start at PENDING_SCAN / IN_TRANSIT / UNBILLED and every final_* field is null.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with an ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-D-0001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id }
            - call: "GET /shipments/${p}/accessorials"
              payload: {}
              as: BillingOps
          assert:
            - "Shipment.${p}.delivery_area_class == NONE and non_conveyable_declared == false"
            - "Shipment.${p}.measurement_status == PENDING_SCAN, movement_status == IN_TRANSIT, billing_status == UNBILLED"
            - "Shipment.${p}.scanned_cube_in3 == null, final_dim_weight_lbs == null, final_billable_weight_lbs == null, final_basis == null, dim_variance_pct == null, weight_variance_lbs == null"
            - "Shipment.${p}.delivered_at == null and Shipment.${p}.accessorial_total_cents == 0"
            - "GET /shipments/${p}/accessorials returns total_count == 0 — NONE is not a billable delivery area"
            - "Shipment.${p}.guarantee_deadline_utc == 2026-08-02T00:00:00Z (pickup 2026-08-01T00:00:00Z plus the EXPRESS 24 h commitment)"

      - name: shipment_computed_pricing_fields_are_input_ignored
        claim_type: computed_fields
        grounds:
          - calculations.billable_weight
          - entities.Shipment.fields.declared_cube_in3
          - entities.Shipment.fields.billable_weight_lbs
          - entities.Shipment.fields.contract_id
        distinguishing_aspect: |
          A client that smuggles declared_cube_in3, billable_weight_lbs and contract_id into
          the induction body is ignored: the server returns cube 960, billable weight 7 and
          the ACTIVE contract's own id, never the 1 / 999 / "not-a-contract" the caller sent.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with an ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-C-0001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0, declared_cube_in3: 1, billable_weight_lbs: 999, divisor_used: 250, contract_id: "00000000-0000-0000-0000-000000000000", accessorial_total_cents: 5000 }
              as: CarrierOps
              captures: { p: $.data.id }
          assert:
            - "HTTP status is 201 — undeclared body keys are ignored, not rejected"
            - "Shipment.${p}.declared_cube_in3 == 960 (12 x 10 x 8), NOT the 1 that was sent"
            - "Shipment.${p}.divisor_used == 139, NOT the 250 that was sent"
            - "Shipment.${p}.preliminary_dim_weight_lbs == 7 (ceil(960 / 139)) and preliminary_billable_weight_lbs == 7 with preliminary_basis == DIMENSIONAL"
            - "Shipment.${p}.billable_weight_lbs == 7, NOT the 999 that was sent"
            - "Shipment.${p}.contract_id == ${c1}, NOT the zero UUID that was sent"
            - "Shipment.${p}.accessorial_total_cents == 0, NOT the 5000 that was sent"

      - name: manual_accessorial_system_fields_are_input_ignored
        claim_type: system_fields
        grounds:
          - entities.AccessorialCharge.fields.source
          - entities.AccessorialCharge.fields.status
          - entities.AccessorialCharge.fields.amount_cents
          - calculations.accessorial_assessment
        distinguishing_aspect: |
          A hand-assessed AccessorialCharge always comes back source MANUAL, status ASSESSED
          and amount_cents resolved from the contract override table or the default rate
          (2200 for ADDRESS_CORRECTION), regardless of the source, status and amount_cents
          the caller tried to dictate.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with an ACTIVE contract C1 that overrides only RESIDENTIAL to 540, so ADDRESS_CORRECTION falls back to the 2200 default."
            - "Shipment 1Z-S-0001 (12 x 10 x 8 in, 6.0 lb, zone 2, non-residential) is IN_TRANSIT and UNBILLED."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
                accessorial_rate_overrides: { RESIDENTIAL: 540 }
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-S-0001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id }
          trigger:
            - call: "POST /shipments/${p}/accessorials"
              payload: { code: "ADDRESS_CORRECTION", reason: "consignee moved", source: "AUTO", status: "WAIVED", amount_cents: 1, assessed_basis: "client says so" }
              as: BillingOps
              captures: { ac: $.data.id }
            - call: "GET /shipments/${p}"
              payload: {}
              as: BillingOps
          assert:
            - "HTTP status is 201 and AccessorialCharge.${ac}.source == MANUAL, NOT the AUTO that was sent"
            - "AccessorialCharge.${ac}.status == ASSESSED, NOT the WAIVED that was sent"
            - "AccessorialCharge.${ac}.amount_cents == 2200 (the ADDRESS_CORRECTION default rate), NOT the 1 that was sent"
            - "AccessorialCharge.${ac}.shipment_id == ${p} and assessed_basis is a server-written non-null string"
            - "AccessorialCharge.${ac}.id, created_at, updated_at and version == 1 are all server-minted"
            - "Shipment.${p}.accessorial_total_cents == 2200 — the recomputation used the server-resolved rate"

      - name: shipment_zone_and_decimal_precision_violations_are_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Shipment.fields.zone
          - entities.Shipment.fields.declared_weight_lbs
          - entities.Shipment.fields.delivery_area_class
          - validations[priority=16]  # ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Three distinct declared-type violations on the same endpoint all collapse to HTTP
          400 ERR_INVALID_REQUEST: zone 9 outside the declared [2, 8] range, a weight with
          two decimal places, and a delivery_area_class that is not a declared enum member.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with an ACTIVE contract C1 and ServiceLevel EXPRESS."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-T-0001", zone: 9, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { err_zone: $.data.error_id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-T-0002", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.05 }
              as: CarrierOps
