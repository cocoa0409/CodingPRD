scenario: |
  Generate task harder than expert level!

  2724. Travel Rewards Portal & Transfer Partner Administration (card issuer travel rewards
  program): points earning categories with merchant classification mapping and bonus category
  rotation, redemption channels across travel portal booking, statement credit and transfer to
  partner programs at set ratios, portal inventory sourcing through a travel agency partner with
  markup and availability parity, transfer partner agreements with ratio terms, transfer timing
  and promotional bonus events, redemption fraud controls with account takeover detection and
  transfer holds, points liability and breakage accounting with redemption cost estimation,
  cardholder benefit administration including travel insurance and lounge access, program change
  communication and grandfathering
domain_name: travel-rewards-portal-transfer-administration
api_prefix: /rewards

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Fifteen peer entities linked by explicit foreign keys; every collection is a top-level
  # path under /rewards (no parent-id nesting in URLs except for the two action endpoints
  # that operate on an offer). Chosen over `hybrid` for structural diversity per §0.3.

  state_machine_shape: parallel
  # RedemptionOrder carries two independent dimensions on one row
  # (fulfillment_status x settlement_status). TransferRequest is cyclic
  # (SUBMITTED -> HELD -> SUBMITTED). PortalInventoryOffer is cyclic
  # (OPEN -> SUSPENDED -> OPEN). FraudCase and ProgramChangeNotice branch with
  # divergent side-effect sets. Account is posture-driven on a derived field.

  relationship_patterns:
    - one_to_many          # Account -> Transaction / RedemptionOrder / TransferRequest
    - self_referential     # ProgramChangeNotice.supersedes_notice_id -> ProgramChangeNotice.id
    - polymorphic          # PointsLedgerEntry.source_entity_type + source_entity_id
    - cross_aggregate      # RedemptionOrder -> PortalInventoryOffer -> TravelAgencyPartner

  role_model: segregation_of_duties
  # ProgramAdmin drafts, ProgramApprover approves, and the acting X-User-ID may not be the
  # same operator id on both halves of a draft/approve or hold/release pair.

  consistency_model: immediate

difficulty_level: expert_plus
# 15 entities / 81 endpoints / 41 error codes / 41 validation rules / 10 calculations /
# 12 state machines / 2 OCC rules. Density target: every calculation reads fields owned by at least two
# other entities, and every cascade crosses at least three entity types.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: cardholder_name
        type: string
        source: input
        description: Legal name on the card account.
      - name: email
        type: string
        source: input
        description: Contact address used for program change communication.
      - name: card_product_code
        type: enum
        source: input
        description: Card product that fixes the earn multiplier and the redemption cents-per-point.
        constraints: "one of {PREMIER, CORE, LEGACY_GOLD}"
      - name: enrolled_at
        type: datetime
        source: input
        description: Enrollment instant; compared against ProgramChangeNotice.cohort_enrolled_before to decide grandfathering.
      - name: status
        type: enum
        source: system
        description: Account lifecycle dimension.
        default: ACTIVE
        constraints: "one of {ACTIVE, CLOSED}"
      - name: fraud_posture
        type: enum
        source: computed
        description: Derived redemption-risk posture; gates every points-spending operation. See calculations.account_fraud_posture.
        default: CLEAR
        constraints: "one of {CLEAR, WATCH, LOCKED}"
      - name: points_balance
        type: integer
        source: computed
        description: Sum of PointsLedgerEntry.points_delta over all entries with this account_id.
        default: 0
      - name: points_pending_redemption
        type: integer
        source: computed
        description: Sum of RedemptionOrder.points_debited for orders with fulfillment_status == QUOTED plus sum of TransferRequest.points_out for requests with status IN {SUBMITTED, HELD, QUEUED}.
        default: 0
      - name: lifetime_points_earned
        type: integer
        source: computed
        description: Sum of PointsLedgerEntry.points_delta over entries with entry_type IN {EARN_BASE, EARN_BONUS}.
        default: 0
      - name: lifetime_points_redeemed
        type: integer
        source: computed
        description: Absolute sum of PointsLedgerEntry.points_delta over entries with entry_type IN {REDEEM_DEBIT, TRANSFER_DEBIT}.
        default: 0
      - name: transfer_hold_count
        type: integer
        source: computed
        description: Count of TransferRequest rows for this account whose status has ever been set to HELD (monotonic, never decremented).
        default: 0
      - name: terms_notice_id
        type: string
        source: computed
        description: "FK -> ProgramChangeNotice.id; nullable. The notice whose terms currently govern this account. Null means the account is on the base agreement terms."
      - name: pending_notice_id
        type: string
        source: computed
        description: "FK -> ProgramChangeNotice.id; nullable. An EFFECTIVE notice this account is grandfathered against; it becomes terms_notice_id once the clock reaches grandfather_expires_at."
      - name: grandfather_expires_at
        type: datetime
        source: computed
        description: Instant at which pending_notice_id is promoted to terms_notice_id; null when the account was never grandfathered.
      - name: closed_at
        type: datetime
        source: system
        description: Instant the account moved to CLOSED; null while ACTIVE.

  - name: MerchantCategory
    parent: null
    common_fields: true
    fields:
      - name: mcc_code
        type: string
        source: input
        description: Merchant category code used to classify inbound transactions.
        constraints: "globally unique across MerchantCategory"
      - name: display_name
        type: string
        source: input
        description: Human label shown in the earning statement.
      - name: base_category
        type: enum
        source: input
        description: Coarse earning family this MCC maps into.
        constraints: "one of {DINING, TRAVEL_AIR, TRAVEL_HOTEL, GROCERY, GAS, OTHER}"
      - name: base_multiplier
        type: number
        source: input
        description: Points per billable dollar before any product or rotation multiplier.
        constraints: ">= 1.0, at most 2 decimal places"
      - name: is_fallback
        type: boolean
        source: input
        description: Marks the single catch-all category used when an inbound mcc_code has no mapping.
        default: false
        constraints: "at most one MerchantCategory may have is_fallback == true"

  - name: EarningCategoryRotation
    parent: null
    common_fields: true
    fields:
      - name: merchant_category_id
        type: string
        source: input
        description: "FK -> MerchantCategory.id; the single category this rotation boosts."
      - name: rotation_code
        type: string
        source: input
        description: Operator-facing rotation handle.
        constraints: "globally unique across EarningCategoryRotation"
      - name: bonus_multiplier
        type: number
        source: input
        description: Total multiplier applied to rotation-eligible spend; the incremental part is (bonus_multiplier - 1.0).
        constraints: "> 1.0, at most 2 decimal places"
      - name: capped_spend_cents
        type: integer
        source: input
        description: Per-account cumulative spend cap in cents beyond which no further bonus accrues for this rotation.
        constraints: "> 0"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the rotation window.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the rotation window; window is half-open [window_start, window_end).
        constraints: "> window_start"
      - name: status
        type: enum
        source: system
        description: Rotation lifecycle.
        default: DRAFT
        constraints: "one of {DRAFT, SCHEDULED, ACTIVE, EXPIRED}"
      - name: published_at
        type: datetime
        source: system
        description: Instant the rotation moved DRAFT -> SCHEDULED; null while DRAFT.
      - name: activated_at
        type: datetime
        source: system
        description: Instant an ops-run moved the rotation SCHEDULED -> ACTIVE; null before that.
      - name: expired_at
        type: datetime
        source: system
        description: Instant an ops-run moved the rotation ACTIVE -> EXPIRED; null before that.

  - name: Transaction
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account that earns on this purchase."
      - name: mcc_code
        type: string
        source: input
        description: Raw merchant category code as presented by the network.
      - name: amount_cents
        type: integer
        source: input
        description: Purchase amount in cents.
        constraints: "> 0"
      - name: posted_at
        type: datetime
        source: input
        description: Posting instant used for rotation window membership.
      - name: merchant_category_id
        type: string
        source: computed
        description: "FK -> MerchantCategory.id; classification result. Resolves to the category whose mcc_code equals this transaction's mcc_code, else the is_fallback category."
      - name: classification_source
        type: enum
        source: computed
        description: Whether the mcc_code matched a mapping or fell through to the fallback category.
        constraints: "one of {MAPPED, FALLBACK}"
      - name: rotation_id
        type: string
        source: computed
        description: "FK -> EarningCategoryRotation.id; nullable. The ACTIVE rotation whose merchant_category_id equals merchant_category_id and whose half-open window contains posted_at."
      - name: rotation_eligible_cents
        type: integer
        source: computed
        description: Portion of amount_cents that received the rotation bonus after the per-account cap headroom was applied; 0 when rotation_id is null.
        default: 0
      - name: base_points
        type: integer
        source: computed
        description: Points from category base_multiplier times the card product multiplier, floored once.
        default: 0
      - name: bonus_points
        type: integer
        source: computed
        description: Incremental rotation points, floored once, independently of base_points.
        default: 0
      - name: total_points_earned
        type: integer
        source: computed
        description: base_points + bonus_points.
        default: 0
      - name: status
        type: enum
        source: system
        description: Whether the purchase still stands or has been reversed by the issuer.
        default: POSTED
        constraints: "one of {POSTED, REVERSED}"
      - name: reversed_at
        type: datetime
        source: system
        description: Instant of reversal; null while POSTED.
      - name: reversal_reason
        type: string
        source: system
        description: Free-text reason captured at reversal; null while POSTED.

  - name: PointsLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account whose balance this entry moves."
      - name: entry_type
        type: enum
        source: system
        description: Ledger reason code.
        constraints: "one of {EARN_BASE, EARN_BONUS, CLAWBACK, REDEEM_DEBIT, REDEEM_REFUND, TRANSFER_DEBIT, TRANSFER_REVERSAL}"
      - name: points_delta
        type: integer
        source: system
        description: Signed points movement; positive for earns and reversals, negative for debits and clawbacks.
      - name: balance_after
        type: integer
        source: computed
        description: Account points_balance immediately after this entry was appended, in occurred_at order with created_at ASC as the tie-break.
      - name: source_entity_type
        type: enum
        source: system
        description: Polymorphic discriminator naming the entity type that produced this entry.
        constraints: "one of {TRANSACTION, REDEMPTION_ORDER, TRANSFER_REQUEST}"
      - name: source_entity_id
        type: string
        source: system
        description: Polymorphic identifier of the producing row; resolve against the collection named by source_entity_type. Not a declared foreign key.
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock instant at which the entry was appended.
      - name: memo
        type: string
        source: system
        description: Short operator-readable explanation of the movement.

  - name: TravelAgencyPartner
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Agency legal name.
      - name: contracted_markup_bps
        type: integer
        source: input
        description: Basis points added to the agency net rate to form the portal display price.
        constraints: ">= 0 and <= 5000"
      - name: parity_tolerance_bps
        type: integer
        source: input
        description: Maximum basis points by which the portal price may exceed the agency public price before parity is breached.
        constraints: ">= 0 and <= 5000"
      - name: invoice_terms_days
        type: integer
        source: input
        description: Days after ticketing by which the agency must invoice.
        default: 30
      - name: status
        type: enum
        source: system
        description: Sourcing eligibility of this agency.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: payable_cents
        type: integer
        source: computed
        description: Outstanding cash the issuer owes this agency; moved by RedemptionOrder ticket, settle and refund transitions only.
        default: 0
      - name: suspended_reason
        type: string
        source: system
        description: Reason captured at suspension; null while ACTIVE.

  - name: PortalInventoryOffer
    parent: null
    common_fields: true
    fields:
      - name: agency_partner_id
        type: string
        source: input
        description: "FK -> TravelAgencyPartner.id; the agency sourcing this itinerary."
      - name: itinerary_code
        type: string
        source: input
        description: Agency itinerary handle; several offers may share it across resync generations.
      - name: depart_at
        type: datetime
        source: input
        description: Departure instant of the itinerary.
      - name: return_at
        type: datetime
        source: input
        description: Return instant; null for one-way itineraries.
      - name: net_rate_cents
        type: integer
        source: input
        description: Cash the issuer pays the agency per seat.
        constraints: "> 0"
      - name: agency_public_price_cents
        type: integer
        source: input
        description: Price the agency advertises on its own public channel; the parity reference.
        constraints: "> 0"
      - name: agency_public_seats
        type: integer
        source: input
        description: Seat count the agency advertises publicly; the availability-parity reference.
        constraints: ">= 0"
      - name: portal_seats
        type: integer
        source: input
        description: Seat count exposed on the rewards portal.
        constraints: ">= 1"
      - name: tax_cents
        type: integer
        source: input
        description: Taxes and carrier fees that the cardholder must pay in cash; never redeemable with points.
        constraints: ">= 0"
      - name: portal_price_cents
        type: integer
        source: computed
        description: round_half_up(net_rate_cents * (1 + contracted_markup_bps / 10000)).
      - name: cash_copay_cents
        type: integer
        source: computed
        description: Equal to tax_cents; the cash portion of any booking against this offer.
      - name: parity_status
        type: enum
        source: computed
        description: Result of the price-and-availability parity test against the agency public channel.
        constraints: "one of {IN_PARITY, OUT_OF_PARITY}"
      - name: seats_committed
        type: integer
        source: computed
        description: Count of RedemptionOrder rows against this offer with fulfillment_status IN {QUOTED, CONFIRMED, TICKETED}.
        default: 0
      - name: status
        type: enum
        source: system
        description: Offer availability dimension.
        default: OPEN
        constraints: "one of {OPEN, SUSPENDED, SOLD_OUT, WITHDRAWN}"
      - name: last_resynced_at
        type: datetime
        source: system
        description: Instant of the most recent agency price/availability resync; null until first resync.
      - name: suspension_reason
        type: string
        source: system
        description: Reason captured when a program operator suspends the offer; null otherwise.

  - name: RedemptionOrder
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the redeeming account."
      - name: inventory_offer_id
        type: string
        source: input
        description: "FK -> PortalInventoryOffer.id; null for STATEMENT_CREDIT orders."
      - name: channel
        type: enum
        source: input
        description: Redemption channel.
        constraints: "one of {PORTAL_BOOKING, STATEMENT_CREDIT}"
      - name: traveler_name
        type: string
        source: input
        description: Traveler on the ticket; null for STATEMENT_CREDIT.
      - name: points_requested
        type: integer
        source: input
        description: Points the cardholder asked to burn; only supplied for STATEMENT_CREDIT.
      - name: points_debited
        type: integer
        source: computed
        description: Points actually reserved by this order. For PORTAL_BOOKING it is ceil((portal_price_cents - cash_copay_cents) / cents_per_point_applied); for STATEMENT_CREDIT it equals points_requested.
      - name: cash_copay_cents
        type: integer
        source: computed
        description: Cash the cardholder owes; copied from the offer's cash_copay_cents, 0 for STATEMENT_CREDIT.
        default: 0
      - name: statement_credit_cents
        type: integer
        source: computed
        description: Credit posted to the statement; points_requested * STATEMENT_CREDIT_CENTS_PER_POINT for STATEMENT_CREDIT, 0 for PORTAL_BOOKING.
        default: 0
      - name: cents_per_point_applied
        type: number
        source: computed
        description: Redemption rate pinned from the account's card_product_code at quote time.
      - name: issuer_cost_provisional_cents
        type: integer
        source: computed
        description: Forward-looking issuer cost at quote time; offer.net_rate_cents - cash_copay_cents. 0 for STATEMENT_CREDIT.
        default: 0
      - name: issuer_cost_final_cents
        type: integer
        source: computed
        description: Chronological issuer cost at settlement; invoice_amount_cents - cash_copay_cents + settlement_adjustment_cents. Null until settled.
      - name: cost_per_1k_provisional_cents
        type: integer
        source: computed
        description: round_half_up(issuer_cost_provisional_cents * 1000 / points_debited); 0 when points_debited is 0.
        default: 0
      - name: cost_per_1k_final_cents
        type: integer
        source: computed
        description: round_half_up(issuer_cost_final_cents * 1000 / points_debited); null until settled.
      - name: invoice_amount_cents
        type: integer
        source: input
        description: Agency invoice amount supplied at settlement; null until then.
      - name: settlement_adjustment_cents
        type: integer
        source: input
        description: Signed settlement adjustment supplied at settlement.
        default: 0
      - name: fulfillment_status
        type: enum
        source: system
        description: First of two independent state dimensions on this row.
        default: QUOTED
        constraints: "one of {QUOTED, CONFIRMED, TICKETED, CANCELLED, REFUNDED}"
      - name: settlement_status
        type: enum
        source: system
        description: Second, independent state dimension tracking agency cash.
        default: UNSETTLED
        constraints: "one of {UNSETTLED, AGENCY_INVOICED, SETTLED, CLAWED_BACK}"
      - name: ticket_number
        type: string
        source: input
        description: Agency-issued ticket number captured at ticketing; null before.
      - name: confirmed_at
        type: datetime
        source: system
        description: Instant points were debited; null before confirmation.
      - name: ticketed_at
        type: datetime
        source: system
        description: Instant the agency ticketed; null before.
      - name: settled_at
        type: datetime
        source: system
        description: Instant the agency invoice was settled; null before.
      - name: closed_reason
        type: string
        source: system
        description: Reason captured on cancel or refund; null otherwise.

  - name: PartnerAgreement
    parent: null
    common_fields: true
    fields:
      - name: partner_name
        type: string
        source: input
        description: Airline or hotel loyalty program name.
      - name: partner_program_code
        type: string
        source: input
        description: Short partner handle.
        constraints: "unique among PartnerAgreement rows with status IN {PENDING_APPROVAL, ACTIVE, SUSPENDED}"
      - name: ratio_points_out
        type: integer
        source: input
        description: Program points consumed per ratio block.
        constraints: "> 0 and a multiple of 1000"
      - name: ratio_partner_units_in
        type: integer
        source: input
        description: Partner units credited per ratio block of ratio_points_out points.
        constraints: "> 0"
      - name: min_transfer_points
        type: integer
        source: input
        description: Smallest accepted points_out for a single transfer.
        constraints: "> 0"
      - name: transfer_increment_points
        type: integer
        source: input
        description: points_out must be an exact multiple of this value.
        constraints: "> 0"
      - name: transfer_latency_hours
        type: integer
        source: input
        description: Hours between screening clearance and partner posting.
        constraints: ">= 0"
      - name: reversal_window_hours
        type: integer
        source: input
        description: Hours after completion during which the issuer may still reverse a posted transfer.
        constraints: ">= 0"
      - name: settlement_cost_cents_per_1k
        type: integer
        source: input
        description: Cash the issuer pays the partner per 1000 points transferred.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Agreement lifecycle; cycles between ACTIVE and SUSPENDED and back to DRAFT on revision.
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_APPROVAL, ACTIVE, SUSPENDED, TERMINATED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: Opaque operator id captured on DRAFT -> PENDING_APPROVAL; null while DRAFT.
      - name: approved_by_user_id
        type: string
        source: system
        description: Opaque operator id captured on PENDING_APPROVAL -> ACTIVE; must differ from submitted_by_user_id.
      - name: activated_at
        type: datetime
        source: system
        description: Instant of the most recent transition into ACTIVE; null before first approval.
      - name: suspension_reason
        type: string
        source: system
        description: Reason captured on ACTIVE -> SUSPENDED; cleared on reinstatement.

  - name: TransferBonusEvent
    parent: null
    common_fields: true
    fields:
      - name: partner_agreement_id
        type: string
        source: input
        description: "FK -> PartnerAgreement.id; the agreement this promotion boosts."
      - name: event_code
        type: string
        source: input
        description: Marketing handle for the promotion.
        constraints: "globally unique across TransferBonusEvent"
      - name: bonus_bps
        type: integer
        source: input
        description: Basis points of extra partner units on top of the base conversion.
        constraints: "> 0 and <= 10000"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the promotional window.
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the promotional window; window is closed [window_start, window_end].
        constraints: "> window_start"
      - name: cap_points_per_account
        type: integer
        source: input
        description: Maximum points_out per account that may earn this bonus in a single transfer.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Promotion lifecycle, advanced by ops-runs against the logical clock.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, RUNNING, CLOSED, CANCELLED}"
      - name: opened_at
        type: datetime
        source: system
        description: Instant an ops-run moved the event SCHEDULED -> RUNNING; null before.
      - name: closed_at
        type: datetime
        source: system
        description: Instant an ops-run moved the event RUNNING -> CLOSED; null before.
      - name: cancelled_reason
        type: string
        source: system
        description: Reason captured on cancellation; null otherwise.

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the transferring account."
      - name: partner_agreement_id
        type: string
        source: input
        description: "FK -> PartnerAgreement.id; the agreement whose ratio terms are consulted."
      - name: bonus_event_id
        type: string
        source: computed
        description: "FK -> TransferBonusEvent.id; nullable. The RUNNING event on this agreement whose closed window contains the submission instant."
      - name: points_out
        type: integer
        source: input
        description: Program points to burn.
        constraints: "> 0"
      - name: ratio_points_out_applied
        type: integer
        source: computed
        description: Ratio denominator actually used, after grandfathering resolution against the account's governing notice.
      - name: ratio_partner_units_in_applied
        type: integer
        source: computed
        description: Ratio numerator actually used, after grandfathering resolution.
      - name: base_units
        type: integer
        source: computed
        description: Partner units from the base ratio, floored per 1000-point block then summed.
        default: 0
      - name: bonus_units
        type: integer
        source: computed
        description: Extra partner units from bonus_event_id, floored per 1000-point block then summed.
        default: 0
      - name: partner_units_credited
        type: integer
        source: computed
        description: base_units + bonus_units.
        default: 0
      - name: status
        type: enum
        source: system
        description: Transfer lifecycle; HELD returns to SUBMITTED on release, forming a cycle.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, QUEUED, HELD, COMPLETED, REJECTED, REVERSED}"
      - name: hold_reason
        type: enum
        source: system
        description: Why the transfer is held; null unless currently or previously HELD.
        constraints: "one of {ATO_SUSPECTED, INSUFFICIENT_BALANCE_AFTER_CLAWBACK, MANUAL_REVIEW}"
      - name: held_by_user_id
        type: string
        source: system
        description: Opaque operator id that placed the most recent hold; null when never held; the literal string SYSTEM for cascade-placed holds.
      - name: released_by_user_id
        type: string
        source: system
        description: Opaque operator id that released the most recent hold; must differ from held_by_user_id.
      - name: screening_cleared_at
        type: datetime
        source: system
        description: Instant screening cleared and the request entered QUEUED; null before.
      - name: scheduled_post_at
        type: datetime
        source: computed
        description: screening_cleared_at plus PartnerAgreement.transfer_latency_hours; null until QUEUED.
      - name: completed_at
        type: datetime
        source: system
        description: Instant an ops-run posted the transfer to the partner; null before.
      - name: reversed_at
        type: datetime
        source: system
        description: Instant the posted transfer was reversed; null otherwise.
      - name: resolution_reason
        type: string
        source: system
        description: Reason captured on rejection or reversal; null otherwise.

  - name: FraudCase
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account under investigation."
      - name: case_type
        type: enum
        source: input
        description: Investigation family.
        constraints: "one of {ACCOUNT_TAKEOVER, POINTS_DRAIN, REDEMPTION_ABUSE}"
      - name: signals
        type: array
        source: input
        description: Distinct takeover signals observed at case opening; duplicates are rejected.
        constraints: "non-empty array of {DEVICE_CHANGE, EMAIL_CHANGE, PASSWORD_RESET, NEW_PAYEE, GEO_ANOMALY}"
      - name: device_fingerprint_changed
        type: boolean
        source: input
        description: Whether the device fingerprint changed within the lookback window; suppresses the review-stage decay credit when true.
      - name: instant_score
        type: integer
        source: computed
        description: Signal-weight-only score computed at case open; 0..100.
      - name: review_score
        type: integer
        source: computed
        description: Score recomputed at review including the 30-day transfer velocity term and the decay credit; null until reviewed.
      - name: risk_score
        type: integer
        source: computed
        description: review_score when non-null, else instant_score. This is the field the posture calculation reads.
      - name: status
        type: enum
        source: system
        description: Case lifecycle; branches from UNDER_REVIEW into CONFIRMED or CLEARED with divergent side-effect sets.
        default: OPEN
        constraints: "one of {OPEN, UNDER_REVIEW, CONFIRMED, CLEARED}"
      - name: opened_by_user_id
        type: string
        source: system
        description: Opaque analyst id captured at creation from X-User-ID.
      - name: reviewed_at
        type: datetime
        source: system
        description: Instant the case entered UNDER_REVIEW; null before.
      - name: resolved_by_user_id
        type: string
        source: system
        description: Opaque approver id that confirmed or cleared the case; must differ from opened_by_user_id.
      - name: resolution_note
        type: string
        source: system
        description: Note captured at confirmation or clearance; null before.

  - name: BenefitEntitlement
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the entitled account."
      - name: benefit_type
        type: enum
        source: input
        description: Which cardholder benefit this row administers.
        constraints: "one of {TRAVEL_INSURANCE, LOUNGE_ACCESS, BAGGAGE_FEE_CREDIT}"
      - name: annual_allowance
        type: integer
        source: input
        description: Number of consumptions permitted before expiry.
        constraints: "> 0"
      - name: used_count
        type: integer
        source: computed
        description: Number of successful consume calls against this row.
        default: 0
      - name: remaining_allowance
        type: integer
        source: computed
        description: annual_allowance - used_count; never negative.
      - name: requires_portal_booking
        type: boolean
        source: input
        description: When true, consumption must cite a RedemptionOrder with fulfillment_status == TICKETED owned by the same account.
        default: true
      - name: status
        type: enum
        source: system
        description: Entitlement availability; suspended in bulk when the account posture degrades, reinstated when it clears.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, EXPIRED}"
      - name: expires_at
        type: datetime
        source: input
        description: Instant at which an ops-run expires this entitlement.
      - name: last_consumed_at
        type: datetime
        source: system
        description: Instant of the most recent successful consumption; null before.
      - name: suspension_reason
        type: string
        source: system
        description: Reason captured when the posture cascade suspended this row; null otherwise.

  - name: ProgramChangeNotice
    parent: null
    common_fields: true
    fields:
      - name: notice_code
        type: string
        source: input
        description: Public notice handle used in cardholder communication.
        constraints: "globally unique across ProgramChangeNotice"
      - name: change_type
        type: enum
        source: input
        description: Which program term this notice changes.
        constraints: "one of {TRANSFER_RATIO_CHANGE, EARN_MULTIPLIER_CUT, BENEFIT_REMOVAL}"
      - name: target_agreement_id
        type: string
        source: input
        description: "FK -> PartnerAgreement.id; nullable. Required when change_type == TRANSFER_RATIO_CHANGE."
      - name: new_ratio_points_out
        type: integer
        source: input
        description: Replacement ratio denominator; required when change_type == TRANSFER_RATIO_CHANGE.
        constraints: "> 0 and a multiple of 1000 when present"
      - name: new_ratio_partner_units_in
        type: integer
        source: input
        description: Replacement ratio numerator; required when change_type == TRANSFER_RATIO_CHANGE.
        constraints: "> 0 when present"
      - name: supersedes_notice_id
        type: string
        source: input
        description: "FK -> ProgramChangeNotice.id; nullable self-reference to the notice this one replaces."
      - name: effective_at
        type: datetime
        source: input
        description: Instant at which an ops-run flips the notice to EFFECTIVE and rewrites account terms.
      - name: grandfather_window_days
        type: integer
        source: input
        description: Days of protection granted to the grandfathered cohort past effective_at.
        constraints: ">= 0"
      - name: cohort_enrolled_before
        type: datetime
        source: input
        description: Accounts with enrolled_at strictly before this instant form the grandfathered cohort.
      - name: status
        type: enum
        source: system
        description: Notice lifecycle; returns to DRAFT on revision and branches to WITHDRAWN from ANNOUNCED.
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_APPROVAL, ANNOUNCED, EFFECTIVE, WITHDRAWN}"
      - name: announced_at
        type: datetime
        source: system
        description: Instant of announcement; null before.
      - name: drafted_by_user_id
        type: string
        source: system
        description: Opaque operator id captured at creation from X-User-ID.
      - name: approved_by_user_id
        type: string
        source: system
        description: Opaque approver id captured at announcement; must differ from drafted_by_user_id.
      - name: withdrawn_reason
        type: string
        source: system
        description: Reason captured on withdrawal; null otherwise.

  - name: LiabilitySnapshot
    parent: null
    common_fields: false
    fields:
      - name: as_of
        type: datetime
        source: input
        description: Cut-off instant; only ledger entries and orders at or before this instant enter the computation.
      - name: method
        type: enum
        source: input
        description: Which cost basis the snapshot values outstanding points at.
        constraints: "one of {COST_BASIS, FAIR_VALUE}"
      - name: gross_outstanding_points
        type: integer
        source: computed
        description: Sum of PointsLedgerEntry.points_delta over all entries with occurred_at <= as_of.
      - name: dormant_outstanding_points
        type: integer
        source: computed
        description: Portion of gross_outstanding_points held by accounts with no EARN_BASE or EARN_BONUS entry in the 365 days before as_of.
      - name: blended_cost_per_1k_cents
        type: integer
        source: computed
        description: Redemption cost per 1000 points implied by the method's input set.
      - name: effective_breakage_rate_bps
        type: integer
        source: computed
        description: round_half_up(breakage_credit_cents * 10000 / gross_liability_cents); 0 when gross_liability_cents is 0.
      - name: gross_liability_cents
        type: integer
        source: computed
        description: Non-dormant and dormant buckets valued separately, each rounded, then summed.
      - name: breakage_credit_cents
        type: integer
        source: computed
        description: Expected never-redeemed value subtracted from gross liability.
      - name: net_liability_cents
        type: integer
        source: computed
        description: gross_liability_cents - breakage_credit_cents.
      - name: generated_by_user_id
        type: string
        source: system
        description: Opaque operator id captured from X-User-ID at generation.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Account: parallel dimensions (lifecycle x derived posture) ---
  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    note: |
      Two independent dimensions live on this row. `status` is the lifecycle dimension
      (ACTIVE -> CLOSED). `fraud_posture` is a derived dimension (CLEAR <-> WATCH <-> LOCKED)
      recomputed by calculations.account_fraud_posture after every FraudCase transition and
      after every transfer hold; it never blocks a lifecycle transition and a lifecycle
      transition never rewrites it.
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /rewards/accounts/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "account.status == ACTIVE"
          - "no TransferRequest for this account with status IN {SUBMITTED, QUEUED, HELD}"
          - "no RedemptionOrder for this account with fulfillment_status IN {QUOTED, CONFIRMED}"
        side_effects:
          - "sets closed_at to the logical clock instant"
          - "sets every BenefitEntitlement of this account with status == ACTIVE to EXPIRED"
          - "increments Account.version by 1"
      - from: CLEAR
        to: WATCH
        trigger: "system event: calculations.account_fraud_posture re-evaluates after a FraudCase create/review or a transfer hold"
        actor: system
        preconditions:
          - "no FraudCase for this account with status == CONFIRMED"
          - "no FraudCase for this account with status IN {OPEN, UNDER_REVIEW} and risk_score >= 60"
          - "either some FraudCase for this account with status IN {OPEN, UNDER_REVIEW} has risk_score >= 30, or account.transfer_hold_count >= 2"
        side_effects:
          - "sets every BenefitEntitlement of this account with benefit_type == LOUNGE_ACCESS and status == ACTIVE to SUSPENDED with suspension_reason POSTURE_WATCH"
          - "increments Account.version by 1"
      - from: WATCH
        to: LOCKED
        trigger: "system event: calculations.account_fraud_posture re-evaluates after FraudCase review or confirm"
        actor: system
        preconditions:
          - "some FraudCase for this account has status == CONFIRMED, or some FraudCase with status IN {OPEN, UNDER_REVIEW} has risk_score >= 60"
        side_effects:
          - "sets every TransferRequest of this account with status IN {SUBMITTED, QUEUED, HELD} to REJECTED (see TransferRequest cascade)"
          - "sets every BenefitEntitlement of this account with status == ACTIVE to SUSPENDED with suspension_reason POSTURE_LOCKED"
          - "increments Account.version by 1"
      - from: CLEAR
        to: LOCKED
        trigger: "system event: calculations.account_fraud_posture re-evaluates after a FraudCase whose risk_score is already >= 60 at open"
        actor: system
        preconditions:
          - "some FraudCase with status IN {OPEN, UNDER_REVIEW} has risk_score >= 60 and the prior posture was CLEAR"
        side_effects:
          - "same side effects as WATCH -> LOCKED"
      - from: LOCKED
        to: CLEAR
        trigger: "POST /rewards/fraud-cases/{id}/clear (system re-evaluation)"
        actor: system
        preconditions:
          - "no FraudCase for this account with status == CONFIRMED"
          - "no FraudCase for this account with status IN {OPEN, UNDER_REVIEW} and risk_score >= 30"
          - "account.transfer_hold_count < 2"
        side_effects:
          - "sets every BenefitEntitlement of this account with status == SUSPENDED back to ACTIVE and clears suspension_reason"
          - "increments Account.version by 1"
      - from: LOCKED
        to: WATCH
        trigger: "POST /rewards/fraud-cases/{id}/clear (system re-evaluation) when a hold history still stands"
        actor: system
        preconditions:
          - "no FraudCase for this account with status == CONFIRMED"
          - "no FraudCase with status IN {OPEN, UNDER_REVIEW} and risk_score >= 60"
          - "account.transfer_hold_count >= 2 or some FraudCase with status IN {OPEN, UNDER_REVIEW} has risk_score >= 30"
        side_effects:
          - "sets every BenefitEntitlement of this account with status == SUSPENDED and benefit_type != LOUNGE_ACCESS back to ACTIVE; LOUNGE_ACCESS rows stay SUSPENDED with suspension_reason POSTURE_WATCH"
          - "increments Account.version by 1"

  # --- Transaction: linear with a compensating reversal that starts a depth-4 cascade ---
  - entity: Transaction
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /rewards/transactions/{id}/reverse"
        actor: ProgramAdmin
        preconditions:
          - "transaction.status == POSTED"
          - "account.status == ACTIVE"
        side_effects:
          - "HOP 1: sets reversed_at and reversal_reason; appends a PointsLedgerEntry with entry_type CLAWBACK, points_delta == -transaction.total_points_earned, source_entity_type TRANSACTION, source_entity_id == transaction.id"
          - "HOP 2 (caused by HOP 1, not by the reversal itself): Account.points_balance is recomputed from the ledger and drops by total_points_earned; lifetime_points_earned is recomputed"
          - "HOP 3 (caused by HOP 2): when the recomputed points_balance is strictly negative, every TransferRequest of this account with status IN {SUBMITTED, QUEUED} is set to HELD with hold_reason INSUFFICIENT_BALANCE_AFTER_CLAWBACK and held_by_user_id SYSTEM, processed in created_at ASC order; Account.transfer_hold_count is incremented once per newly held request. A non-negative recomputed balance holds nothing."
          - "HOP 4 (caused by HOP 3): calculations.account_fraud_posture re-runs on the new transfer_hold_count; when it reaches 2 the posture moves CLEAR -> WATCH, which suspends every LOUNGE_ACCESS BenefitEntitlement of the account"
          - "increments Transaction.version by 1"
        note: "Each hop is caused by the previous hop's mutation. The reversal never touches BenefitEntitlement directly."

  # --- EarningCategoryRotation: linear with clock-driven auto-transitions ---
  - entity: EarningCategoryRotation
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /rewards/rotations/{id}/publish"
        actor: ProgramAdmin
        preconditions:
          - "rotation.status == DRAFT"
          - "rotation.window_start > logical clock instant"
        side_effects:
          - "sets published_at; increments EarningCategoryRotation.version by 1"
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /rewards/ops-runs (system sweep)"
        actor: system
        preconditions:
          - "rotation.status == SCHEDULED"
          - "logical clock instant >= rotation.window_start"
        side_effects:
          - "sets activated_at to the clock instant; increments version by 1; the rotation now enters calculations.transaction_points_award for matching transactions"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /rewards/ops-runs (system sweep)"
        actor: system
        preconditions:
          - "rotation.status == ACTIVE"
          - "logical clock instant >= rotation.window_end"
        side_effects:
          - "sets expired_at to the clock instant; increments version by 1; later transactions in the same category earn base points only"

  # --- TravelAgencyPartner: single guarded transition that gates ticketing ---
  - entity: TravelAgencyPartner
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rewards/agency-partners/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "agency.status == ACTIVE"
        side_effects:
          - "sets suspended_reason; sets every PortalInventoryOffer of this agency with status == OPEN to SUSPENDED with suspension_reason AGENCY_SUSPENDED; increments TravelAgencyPartner.version by 1"

  # --- PortalInventoryOffer: cyclic (OPEN <-> SUSPENDED) plus capacity and withdrawal exits ---
  - entity: PortalInventoryOffer
    initial_state: OPEN
    terminal_states: [WITHDRAWN]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /rewards/inventory-offers/{id}/suspend, or the TravelAgencyPartner ACTIVE -> SUSPENDED cascade"
        actor: ProgramAdmin | system
        preconditions:
          - "offer.status == OPEN"
        side_effects:
          - "sets suspension_reason; bookings against the offer are rejected with ERR_OFFER_NOT_BOOKABLE; increments PortalInventoryOffer.version by 1"
          - "already-QUOTED and CONFIRMED RedemptionOrder rows against the offer are untouched"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /rewards/inventory-offers/{id}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "offer.status == SUSPENDED"
          - "the offer's TravelAgencyPartner has status == ACTIVE"
          - "offer.seats_committed < offer.portal_seats"
        side_effects:
          - "clears suspension_reason; increments version by 1"
        note: "This is the cycle: an offer may be suspended and reinstated any number of times."
      - from: OPEN
        to: SOLD_OUT
        trigger: "system event: a RedemptionOrder is created against the offer and consumes the last seat"
        actor: system
        preconditions:
          - "offer.status == OPEN"
          - "offer.seats_committed + 1 == offer.portal_seats"
        side_effects:
          - "sets status SOLD_OUT after seats_committed is recomputed; increments version by 1"
      - from: SOLD_OUT
        to: OPEN
        trigger: "system event: a RedemptionOrder against the offer moves to CANCELLED or REFUNDED and frees a seat"
        actor: system
        preconditions:
          - "offer.status == SOLD_OUT"
          - "offer.seats_committed after recomputation < offer.portal_seats"
        side_effects:
          - "sets status OPEN; increments version by 1"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /rewards/inventory-offers/{id}/withdraw"
        actor: AgencySupplier
        preconditions:
          - "offer.status IN {OPEN, SUSPENDED}"
          - "offer.seats_committed == 0"
        side_effects:
          - "increments version by 1; the offer disappears from bookable inventory permanently"

  # --- RedemptionOrder: two independent dimensions on one row ---
  - entity: RedemptionOrder
    initial_state: QUOTED
    terminal_states: [CANCELLED, REFUNDED]
    note: |
      `fulfillment_status` (QUOTED -> CONFIRMED -> TICKETED -> REFUNDED, with CANCELLED reachable
      from QUOTED and CONFIRMED) and `settlement_status` (UNSETTLED -> AGENCY_INVOICED -> SETTLED,
      with CLAWED_BACK reachable from AGENCY_INVOICED and SETTLED) advance independently. Settling
      an invoice never moves fulfillment_status, and cancelling before ticketing never moves
      settlement_status off UNSETTLED.
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /rewards/redemption-orders/{id}/confirm"
        actor: Cardholder
        preconditions:
          - "order.fulfillment_status == QUOTED"
          - "account.fraud_posture != LOCKED"
          - "account.points_balance >= order.points_debited"
          - "for PORTAL_BOOKING: the offer's status IN {OPEN, SOLD_OUT} and parity_status == IN_PARITY"
        side_effects:
          - "appends a PointsLedgerEntry with entry_type REDEEM_DEBIT, points_delta == -order.points_debited, source_entity_type REDEMPTION_ORDER"
          - "Account.points_balance drops by points_debited and points_pending_redemption drops by the same amount (the reservation becomes a debit), so points_balance + points_pending_redemption falls by points_debited"
          - "sets confirmed_at; increments RedemptionOrder.version by 1"
      - from: CONFIRMED
        to: TICKETED
        trigger: "POST /rewards/redemption-orders/{id}/ticket"
        actor: AgencySupplier
        preconditions:
          - "order.fulfillment_status == CONFIRMED"
          - "order.channel == PORTAL_BOOKING"
          - "the offer's TravelAgencyPartner has status == ACTIVE"
          - "the acting AgencySupplier's X-User-ID equals the offer's agency_partner_id"
        side_effects:
          - "sets ticket_number and ticketed_at"
          - "moves the settlement dimension UNSETTLED -> AGENCY_INVOICED and adds order.issuer_cost_provisional_cents to TravelAgencyPartner.payable_cents"
          - "increments RedemptionOrder.version by 1 and TravelAgencyPartner.version by 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /rewards/redemption-orders/{id}/cancel"
        actor: Cardholder
        preconditions:
          - "order.fulfillment_status == QUOTED"
        side_effects:
          - "sets closed_reason; Account.points_pending_redemption drops by points_debited with no ledger entry (nothing was ever debited)"
          - "offer.seats_committed is recomputed; a SOLD_OUT offer returns to OPEN"
          - "increments version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /rewards/redemption-orders/{id}/cancel"
        actor: Cardholder
        preconditions:
          - "order.fulfillment_status == CONFIRMED"
        side_effects:
          - "appends a PointsLedgerEntry with entry_type REDEEM_REFUND, points_delta == +order.points_debited; Account.points_balance returns to its pre-confirmation value"
          - "offer.seats_committed is recomputed; a SOLD_OUT offer returns to OPEN"
          - "settlement_status stays UNSETTLED and TravelAgencyPartner.payable_cents is untouched"
          - "increments version by 1"
      - from: TICKETED
        to: REFUNDED
        trigger: "POST /rewards/redemption-orders/{id}/refund"
        actor: AgencySupplier
        preconditions:
          - "order.fulfillment_status == TICKETED"
          - "the acting AgencySupplier's X-User-ID equals the offer's agency_partner_id"
        side_effects:
          - "appends a PointsLedgerEntry with entry_type REDEEM_REFUND, points_delta == +order.points_debited"
          - "moves the settlement dimension to CLAWED_BACK and subtracts from TravelAgencyPartner.payable_cents exactly the amount previously added: issuer_cost_final_cents when settlement_status was SETTLED, otherwise issuer_cost_provisional_cents"
          - "offer.seats_committed is recomputed; a SOLD_OUT offer returns to OPEN"
          - "increments RedemptionOrder.version by 1 and TravelAgencyPartner.version by 1"
      - from: AGENCY_INVOICED
        to: SETTLED
        trigger: "POST /rewards/redemption-orders/{id}/settle"
        actor: ProgramAdmin
        preconditions:
          - "order.settlement_status == AGENCY_INVOICED"
          - "order.fulfillment_status == TICKETED"
        side_effects:
          - "stores invoice_amount_cents and settlement_adjustment_cents; computes issuer_cost_final_cents and cost_per_1k_final_cents per calculations.redemption_issuer_cost"
          - "adjusts TravelAgencyPartner.payable_cents by (issuer_cost_final_cents - issuer_cost_provisional_cents), which may be negative"
          - "sets settled_at; increments RedemptionOrder.version by 1 and TravelAgencyPartner.version by 1"
          - "the settled row now enters the COST_BASIS input set of calculations.points_liability_and_breakage"

  # --- PartnerAgreement: cyclic (revision loop and suspend/reinstate loop) ---
  - entity: PartnerAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /rewards/partner-agreements/{id}/submit"
        actor: ProgramAdmin
        preconditions:
          - "agreement.status == DRAFT"
          - "no other PartnerAgreement with the same partner_program_code has status IN {PENDING_APPROVAL, ACTIVE, SUSPENDED}"
        side_effects:
          - "stores submitted_by_user_id from X-User-ID; increments PartnerAgreement.version by 1"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /rewards/partner-agreements/{id}/revise"
        actor: ProgramApprover
        preconditions:
          - "agreement.status == PENDING_APPROVAL"
        side_effects:
          - "clears submitted_by_user_id; increments version by 1"
        note: "The revision loop; an agreement may cycle DRAFT -> PENDING_APPROVAL -> DRAFT any number of times."
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /rewards/partner-agreements/{id}/approve"
        actor: ProgramApprover
        preconditions:
          - "agreement.status == PENDING_APPROVAL"
          - "the acting X-User-ID differs from agreement.submitted_by_user_id"
        side_effects:
          - "stores approved_by_user_id; sets activated_at to the clock instant; increments version by 1"
          - "transfers may now be submitted against this agreement"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rewards/partner-agreements/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "agreement.status == ACTIVE"
        side_effects:
          - "sets suspension_reason; sets every TransferBonusEvent on this agreement with status IN {SCHEDULED, RUNNING} to CANCELLED with cancelled_reason AGREEMENT_SUSPENDED"
          - "QUEUED TransferRequest rows on this agreement stay QUEUED but the ops-run refuses to post them"
          - "increments version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rewards/partner-agreements/{id}/reinstate"
        actor: ProgramApprover
        preconditions:
          - "agreement.status == SUSPENDED"
          - "the acting X-User-ID differs from agreement.submitted_by_user_id"
        side_effects:
          - "clears suspension_reason; sets activated_at to the clock instant; increments version by 1"
        note: "The second cycle on this entity: ACTIVE -> SUSPENDED -> ACTIVE."
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /rewards/partner-agreements/{id}/terminate"
        actor: ProgramApprover
        preconditions:
          - "agreement.status == SUSPENDED"
          - "no TransferRequest on this agreement has status IN {SUBMITTED, QUEUED, HELD}"
        side_effects:
          - "increments version by 1; partner_program_code is released for reuse by a new agreement"

  # --- TransferBonusEvent: clock-driven with a cancellation exit ---
  - entity: TransferBonusEvent
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /rewards/ops-runs (system sweep)"
        actor: system
        preconditions:
          - "event.status == SCHEDULED"
          - "logical clock instant >= event.window_start"
          - "the parent PartnerAgreement has status == ACTIVE"
        side_effects:
          - "sets opened_at; increments TransferBonusEvent.version by 1; transfers submitted inside the closed window now attach bonus_event_id"
      - from: RUNNING
        to: CLOSED
        trigger: "POST /rewards/ops-runs (system sweep)"
        actor: system
        preconditions:
          - "event.status == RUNNING"
          - "logical clock instant > event.window_end"
        side_effects:
          - "sets closed_at; increments version by 1; later transfers attach no bonus_event_id"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /rewards/bonus-events/{id}/cancel, or the PartnerAgreement ACTIVE -> SUSPENDED cascade"
        actor: ProgramAdmin | system
        preconditions:
          - "event.status IN {SCHEDULED, RUNNING}"
        side_effects:
          - "sets cancelled_reason; increments version by 1; the window is released for a replacement event"

  # --- TransferRequest: cyclic (SUBMITTED -> HELD -> SUBMITTED) ---
  - entity: TransferRequest
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, REJECTED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: HELD
        trigger: "POST /rewards/transfer-requests/{id}/hold, or the Transaction POSTED -> REVERSED cascade HOP 3"
        actor: FraudAnalyst | system
        preconditions:
          - "request.status IN {SUBMITTED, QUEUED}"
        side_effects:
          - "sets hold_reason and held_by_user_id (X-User-ID, or the literal SYSTEM for cascade holds)"
          - "increments Account.transfer_hold_count by 1, then re-runs calculations.account_fraud_posture, which may move the posture CLEAR -> WATCH and suspend LOUNGE_ACCESS entitlements"
          - "points stay reserved: points_pending_redemption is unchanged"
          - "increments TransferRequest.version by 1 and Account.version by 1"
      - from: HELD
        to: SUBMITTED
        trigger: "POST /rewards/transfer-requests/{id}/release"
        actor: ProgramApprover
        preconditions:
          - "request.status == HELD"
          - "the acting X-User-ID differs from request.held_by_user_id"
          - "account.fraud_posture != LOCKED"
        side_effects:
          - "stores released_by_user_id; clears scheduled_post_at; leaves hold_reason and transfer_hold_count as historical facts"
          - "increments TransferRequest.version by 1"
        note: "The cycle: a released request re-enters screening and may be held again."
      - from: SUBMITTED
        to: QUEUED
        trigger: "POST /rewards/transfer-requests/{id}/clear-screening"
        actor: FraudAnalyst
        preconditions:
          - "request.status == SUBMITTED"
          - "account.fraud_posture != LOCKED"
          - "the PartnerAgreement has status == ACTIVE"
        side_effects:
          - "sets screening_cleared_at to the clock instant and scheduled_post_at to screening_cleared_at + agreement.transfer_latency_hours"
          - "increments version by 1"
      - from: QUEUED
        to: HELD
        trigger: "POST /rewards/transfer-requests/{id}/hold, or the Transaction POSTED -> REVERSED cascade HOP 3"
        actor: FraudAnalyst | system
        preconditions:
          - "request.status == QUEUED"
        side_effects:
          - "same side effects as SUBMITTED -> HELD, plus scheduled_post_at is cleared so the ops-run skips the row"
      - from: HELD
        to: REJECTED
        trigger: "POST /rewards/transfer-requests/{id}/reject"
        actor: FraudAnalyst
        preconditions:
          - "request.status == HELD"
        side_effects:
          - "appends a PointsLedgerEntry with entry_type TRANSFER_REVERSAL, points_delta == +request.points_out, source_entity_type TRANSFER_REQUEST"
          - "Account.points_balance returns to its pre-submission value and points_pending_redemption drops by points_out, so points_balance + points_pending_redemption is exactly what it was before submission"
          - "sets resolution_reason; increments TransferRequest.version by 1"
      - from: QUEUED
        to: COMPLETED
        trigger: "POST /rewards/ops-runs (system sweep)"
        actor: system
        preconditions:
          - "request.status == QUEUED"
          - "logical clock instant >= request.scheduled_post_at"
          - "the PartnerAgreement has status == ACTIVE"
          - "account.fraud_posture != LOCKED"
        side_effects:
          - "computes ratio_points_out_applied, ratio_partner_units_in_applied, base_units, bonus_units and partner_units_credited per calculations.transfer_units_credited"
          - "sets completed_at; points_pending_redemption drops by points_out while points_balance stays where the TRANSFER_DEBIT left it"
          - "increments version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system event: the Account CLEAR/WATCH -> LOCKED posture transition"
        actor: system
        preconditions:
          - "request.status IN {SUBMITTED, QUEUED, HELD}"
          - "account.fraud_posture just became LOCKED"
        side_effects:
          - "same compensating ledger and pending-balance effects as HELD -> REJECTED, with resolution_reason POSTURE_LOCKED"
      - from: COMPLETED
        to: REVERSED
        trigger: "POST /rewards/transfer-requests/{id}/reverse"
        actor: ProgramAdmin
        preconditions:
          - "request.status == COMPLETED"
          - "logical clock instant <= request.completed_at + agreement.reversal_window_hours"
        side_effects:
          - "appends a PointsLedgerEntry with entry_type TRANSFER_REVERSAL, points_delta == +request.points_out"
          - "zeroes partner_units_credited, base_units and bonus_units; sets reversed_at and resolution_reason"
          - "increments version by 1"

  # --- FraudCase: branching fork with divergent side-effect sets per branch ---
  - entity: FraudCase
    initial_state: OPEN
    terminal_states: [CONFIRMED, CLEARED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /rewards/fraud-cases/{id}/review"
        actor: FraudAnalyst
        preconditions:
          - "case.status == OPEN"
        side_effects:
          - "computes review_score per the review variant of calculations.ato_risk_score and sets risk_score to it; sets reviewed_at"
          - "re-runs calculations.account_fraud_posture on the new risk_score, which may move the account CLEAR/WATCH -> LOCKED and cascade into TransferRequest rejections and BenefitEntitlement suspensions"
          - "increments FraudCase.version by 1"
      - from: UNDER_REVIEW
        to: CONFIRMED
        trigger: "POST /rewards/fraud-cases/{id}/confirm"
        actor: ProgramApprover
        preconditions:
          - "case.status == UNDER_REVIEW"
          - "the acting X-User-ID differs from case.opened_by_user_id"
        side_effects:
          - "HOP 1: sets resolution_note and resolved_by_user_id"
          - "HOP 2 (caused by HOP 1): calculations.account_fraud_posture pins the account at LOCKED because a CONFIRMED case exists"
          - "HOP 3 (caused by HOP 2): every TransferRequest of the account with status IN {SUBMITTED, QUEUED, HELD} moves to REJECTED with resolution_reason POSTURE_LOCKED"
          - "HOP 4 (caused by HOP 3): each rejection appends a TRANSFER_REVERSAL PointsLedgerEntry and lowers points_pending_redemption, restoring points_balance to its pre-submission value"
          - "every BenefitEntitlement of the account with status == ACTIVE moves to SUSPENDED with suspension_reason POSTURE_LOCKED"
          - "increments FraudCase.version by 1 and Account.version by 1"
      - from: UNDER_REVIEW
        to: CLEARED
        trigger: "POST /rewards/fraud-cases/{id}/clear"
        actor: ProgramApprover
        preconditions:
          - "case.status == UNDER_REVIEW"
          - "the acting X-User-ID differs from case.opened_by_user_id"
        side_effects:
          - "sets resolution_note and resolved_by_user_id"
          - "re-runs calculations.account_fraud_posture; with no CONFIRMED case and no OPEN/UNDER_REVIEW case at risk_score >= 30 the posture drops to CLEAR (or WATCH when transfer_hold_count >= 2)"
          - "reinstates SUSPENDED BenefitEntitlement rows per the Account LOCKED -> CLEAR / LOCKED -> WATCH transitions; TransferRequest rows already REJECTED are NOT resurrected"
          - "increments FraudCase.version by 1 and Account.version by 1"
        note: "The CONFIRMED and CLEARED branches share a from-state but have disjoint side-effect sets."

  # --- BenefitEntitlement: cyclic suspension driven by the posture cascade ---
  - entity: BenefitEntitlement
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: the Account posture cascade (CLEAR -> WATCH suspends LOUNGE_ACCESS only; -> LOCKED suspends every type)"
        actor: system
        preconditions:
          - "entitlement.status == ACTIVE"
        side_effects:
          - "sets suspension_reason to POSTURE_WATCH or POSTURE_LOCKED; increments BenefitEntitlement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system event: the Account LOCKED -> CLEAR or LOCKED -> WATCH posture recovery"
        actor: system
        preconditions:
          - "entitlement.status == SUSPENDED"
          - "the recovered posture no longer suspends this benefit_type"
        side_effects:
          - "clears suspension_reason; increments version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /rewards/ops-runs (system sweep), or the Account ACTIVE -> CLOSED cascade"
        actor: system
        preconditions:
          - "entitlement.status IN {ACTIVE, SUSPENDED}"
          - "logical clock instant >= entitlement.expires_at, or the owning account just moved to CLOSED"
        side_effects:
          - "increments version by 1; further consume calls are rejected with ERR_BENEFIT_NOT_CONSUMABLE"

  # --- ProgramChangeNotice: branching with a revision loop and a withdrawal branch ---
  - entity: ProgramChangeNotice
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /rewards/change-notices/{id}/submit"
        actor: ProgramAdmin
        preconditions:
          - "notice.status == DRAFT"
          - "when change_type == TRANSFER_RATIO_CHANGE: target_agreement_id is set and that agreement has status == ACTIVE"
        side_effects:
          - "increments ProgramChangeNotice.version by 1"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /rewards/change-notices/{id}/revise"
        actor: ProgramApprover
        preconditions:
          - "notice.status == PENDING_APPROVAL"
        side_effects:
          - "increments version by 1"
      - from: PENDING_APPROVAL
        to: ANNOUNCED
        trigger: "POST /rewards/change-notices/{id}/announce"
        actor: ProgramApprover
        preconditions:
          - "notice.status == PENDING_APPROVAL"
          - "the acting X-User-ID differs from notice.drafted_by_user_id"
          - "notice.effective_at >= logical clock instant + MIN_NOTICE_DAYS days"
        side_effects:
          - "sets announced_at and approved_by_user_id; increments version by 1"
          - "when supersedes_notice_id is set and that notice has status == ANNOUNCED, the superseded notice moves to WITHDRAWN with withdrawn_reason SUPERSEDED"
      - from: ANNOUNCED
        to: EFFECTIVE
        trigger: "POST /rewards/ops-runs (system sweep)"
        actor: system
        preconditions:
          - "notice.status == ANNOUNCED"
          - "logical clock instant >= notice.effective_at"
        side_effects:
          - "HOP 1: sets status EFFECTIVE and increments version by 1"
          - "HOP 2 (caused by HOP 1): every Account with status == ACTIVE is re-pointed per calculations.grandfathering_terms_resolution: non-cohort accounts get terms_notice_id == notice.id, cohort accounts (enrolled_at < cohort_enrolled_before) instead get pending_notice_id == notice.id and grandfather_expires_at == effective_at + grandfather_window_days days"
          - "HOP 3 (caused by HOP 2): on a later ops-run where the clock has reached grandfather_expires_at, pending_notice_id is promoted into terms_notice_id and pending_notice_id is cleared, which changes the ratio calculations.transfer_units_credited reads for that account"
      - from: ANNOUNCED
        to: WITHDRAWN
        trigger: "POST /rewards/change-notices/{id}/withdraw, or supersession by a newly ANNOUNCED notice"
        actor: ProgramAdmin | system
        preconditions:
          - "notice.status == ANNOUNCED"
        side_effects:
          - "sets withdrawn_reason; increments version by 1; accounts already re-pointed are unaffected because a WITHDRAWN notice was never EFFECTIVE"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: offer-book-stale-offer-version
    parent_entity: PortalInventoryOffer
    write_endpoint: "POST /rewards/inventory-offers/{id}/book"
    occ_field: "expected_offer_version"
    description: |
      Booking against an offer whose version has advanced since the client last read it is
      rejected. An offer with more than one portal seat legitimately accepts several bookings,
      so the second booking is not blocked by any state precondition; the stale version instead
      signals that the client is quoting a price the agency has already resynced away.
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412
  - rule_id: transfer-create-stale-account-version
    parent_entity: Account
    write_endpoint: "POST /rewards/transfer-requests"
    occ_field: "expected_account_version"
    description: |
      Creating a TransferRequest against an Account whose version has advanced since the client
      last read it is rejected. An account may legitimately hold several in-flight transfers, so
      a second create is not blocked by any state precondition; the stale version instead signals
      that the client's view of the available points balance predates an earlier debit.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: transaction_points_award
    trigger: "POST /rewards/transactions (Transaction row creation), and re-read on POST /rewards/transactions/{id}/reverse to size the CLAWBACK"
    algorithm: threshold
    formula: |
      # --- classification ---
      cat = the MerchantCategory whose mcc_code == txn.mcc_code            # mcc_code is globally unique
      if cat is null:
          cat = the MerchantCategory with is_fallback == true              # at most one exists
          txn.classification_source = FALLBACK
      else:
          txn.classification_source = MAPPED
      if cat is null:                                                     # no mapping and no fallback row
          effective_base_multiplier = 1.0
      else:
          effective_base_multiplier = cat.base_multiplier
      txn.merchant_category_id = cat.id                                   # null only when no fallback row exists

      # --- base leg ---
      billable_dollars = amount_cents // 100                              # integer floor division
      pm = PRODUCT_EARN_MULTIPLIER[account.card_product_code]
      base_points = floor(billable_dollars * effective_base_multiplier * pm)

      # --- rotation leg ---
      rot = the EarningCategoryRotation with merchant_category_id == txn.merchant_category_id
            and status == ACTIVE and window_start <= txn.posted_at < window_end   # half-open
            (at most one exists: overlapping windows on one category are rejected at creation)
      if rot is null:
          txn.rotation_id = null; txn.rotation_eligible_cents = 0; bonus_points = 0
      else:
          txn.rotation_id = rot.id
          prior_cents = sum(t.rotation_eligible_cents) over Transaction t where
                        t.account_id == txn.account_id and t.rotation_id == rot.id
                        and t.status == POSTED and t.created_at < txn.created_at
                        (ordered by created_at ASC; REVERSED rows are excluded)
          headroom_cents = max(0, rot.capped_spend_cents - prior_cents)
          txn.rotation_eligible_cents = min(amount_cents, headroom_cents)
          eligible_dollars = txn.rotation_eligible_cents // 100
          bonus_points = floor(eligible_dollars * (rot.bonus_multiplier - 1.0) * pm)

      # --- pinned rounding order: the two legs are floored independently, then summed ---
      txn.base_points = base_points
      txn.bonus_points = bonus_points
      txn.total_points_earned = base_points + bonus_points
      append PointsLedgerEntry(EARN_BASE, +base_points) then, only when bonus_points > 0,
             PointsLedgerEntry(EARN_BONUS, +bonus_points)   # EARN_BASE always first
    input_set: "Prior-spend accumulation includes only Transaction rows with status == POSTED for the same account and the same rotation_id, ordered by created_at ASC. REVERSED rows leave the accumulator."
    constants:
      PRODUCT_EARN_MULTIPLIER: { PREMIER: 1.5, CORE: 1.0, LEGACY_GOLD: 2.0 }
    precision: "Integer points. Floor applied once per leg (base and bonus separately), never to the sum. Dollar conversion is integer floor division of cents by 100."
    variants:
      - name: mapped_classification
        when: "an MCC mapping exists for txn.mcc_code"
        difference: "classification_source == MAPPED and the mapped base_multiplier drives the base leg; rotation membership is possible."
      - name: fallback_classification
        when: "no MCC mapping exists"
        difference: "classification_source == FALLBACK, the is_fallback category's base_multiplier is used, and a rotation attached to any other category can never match, so bonus_points is 0."

  - name: available_points_for_redemption
    trigger: "Every points-spending admission check: POST /rewards/inventory-offers/{id}/book, POST /rewards/redemption-orders, POST /rewards/transfer-requests"
    algorithm: aggregation
    formula: |
      points_balance = sum(PointsLedgerEntry.points_delta) over entries with this account_id
      quoted_reservations = sum(RedemptionOrder.points_debited) over orders with this
            account_id and fulfillment_status == QUOTED      # no ledger entry exists yet
      transfer_reservations = sum(TransferRequest.points_out) over requests with this
            account_id and status IN {SUBMITTED, HELD, QUEUED}
      account.points_pending_redemption = quoted_reservations + transfer_reservations
      available_points = points_balance - quoted_reservations
      admission rule: the requested burn is admitted when requested <= available_points
                      (equality is admitted; strictly greater is ERR_INSUFFICIENT_POINTS)
    input_set: "Only QUOTED redemption orders reduce available_points, because they are the sole reservation with no ledger entry behind it. Transfer reservations are NOT subtracted a second time: POST /rewards/transfer-requests already appends a TRANSFER_DEBIT entry, so points_balance is net of them. CONFIRMED orders have likewise already been debited from the ledger and must not be counted twice. points_pending_redemption still reports both reservation kinds because it is one half of the conserved quantity points_balance + points_pending_redemption."
    constants: {}
    precision: "Integer points; no rounding."

  - name: redemption_points_price_and_parity
    trigger: "POST /rewards/inventory-offers (offer creation), POST /rewards/inventory-offers/{id}/resync, and POST /rewards/inventory-offers/{id}/book (order pricing)"
    algorithm: tiered_pricing
    formula: |
      # --- offer side, recomputed on create and on every resync ---
      offer.portal_price_cents = round_half_up(offer.net_rate_cents *
                                (1 + agency.contracted_markup_bps / 10000))
      offer.cash_copay_cents   = offer.tax_cents
      price_ceiling_cents = round_half_up(offer.agency_public_price_cents *
                                (1 + agency.parity_tolerance_bps / 10000))
      price_in_parity        = offer.portal_price_cents <= price_ceiling_cents
      availability_in_parity = offer.portal_seats <= offer.agency_public_seats
      offer.parity_status = IN_PARITY if (price_in_parity and availability_in_parity)
                            else OUT_OF_PARITY

      # --- order side, pinned at booking time ---
      cpp = PRODUCT_REDEMPTION_CENTS_PER_POINT[account.card_product_code]
      order.cents_per_point_applied = cpp
      order.cash_copay_cents  = offer.cash_copay_cents
      order.points_debited    = ceil((offer.portal_price_cents - offer.cash_copay_cents) / cpp)
      order.statement_credit_cents = 0

      # --- statement-credit channel ---
      order.points_debited = points_requested
      order.statement_credit_cents = round_half_up(points_requested *
                                     STATEMENT_CREDIT_CENTS_PER_POINT)
      order.cash_copay_cents = 0
    input_set: "Parity always compares the offer's own portal_price_cents against its own agency_public_price_cents; no other offer of the same itinerary_code participates."
    constants:
      PRODUCT_REDEMPTION_CENTS_PER_POINT: { PREMIER: 1.25, CORE: 1.0, LEGACY_GOLD: 1.5 }
      STATEMENT_CREDIT_CENTS_PER_POINT: 1.0
      STATEMENT_CREDIT_MIN_POINTS: 2500
    precision: "Cents are integers rounded half-up. points_debited uses ceil so the issuer never under-charges points. cents_per_point_applied is frozen on the order at booking time and is NOT re-read later, even if the account's product changes."

  - name: redemption_issuer_cost
    trigger: "POST /rewards/inventory-offers/{id}/book computes the provisional leg; POST /rewards/redemption-orders/{id}/settle computes the final leg"
    algorithm: forward_looking
    formula: |
      # provisional (forward-looking, known at booking)
      issuer_cost_provisional_cents = offer.net_rate_cents - order.cash_copay_cents
      cost_per_1k_provisional_cents = round_half_up(issuer_cost_provisional_cents * 1000
                                                    / order.points_debited)
      # final (chronological, known only once the agency invoices)
      issuer_cost_final_cents = invoice_amount_cents - order.cash_copay_cents
                                + settlement_adjustment_cents
      cost_per_1k_final_cents = round_half_up(issuer_cost_final_cents * 1000
                                              / order.points_debited)
      # the two legs are stored side by side and never overwrite each other
    input_set: "The provisional leg reads only the offer snapshot at booking time. The final leg reads only the settlement inputs; a later offer resync never changes it."
    constants: {}
    precision: "Integer cents, round_half_up on the per-1k rates. Division by points_debited == 0 yields 0."
    variants:
      - name: provisional_estimate
        when: "the order has settlement_status IN {UNSETTLED, AGENCY_INVOICED}"
        difference: "Uses the agency net rate captured at booking; this is the number posted to TravelAgencyPartner.payable_cents at ticketing and the number the FAIR_VALUE liability method consumes."
      - name: final_actual
        when: "the order has settlement_status == SETTLED"
        difference: "Uses the invoiced amount plus signed adjustment, which diverges from the provisional estimate whenever the agency re-issues the fare; the delta is posted to payable_cents at settlement and this is the number the COST_BASIS liability method consumes."

  - name: grandfathering_terms_resolution
    trigger: "The ProgramChangeNotice ANNOUNCED -> EFFECTIVE transition inside POST /rewards/ops-runs, and every later ops-run that finds a matured grandfather window"
    algorithm: constraint_propagation
    formula: |
      # phase 1 — notice becomes effective
      for each Account a with a.status == ACTIVE, in created_at ASC order:
          if a.enrolled_at < notice.cohort_enrolled_before:            # strictly before
              a.pending_notice_id      = notice.id
              a.grandfather_expires_at = notice.effective_at
                                         + notice.grandfather_window_days days
              a.terms_notice_id stays unchanged                        # protected cohort
          else:
              a.terms_notice_id        = notice.id
              a.pending_notice_id      = null
              a.grandfather_expires_at = null
      # phase 2 — a later ops-run matures the protection
      for each Account a with a.pending_notice_id != null and
              logical clock instant >= a.grandfather_expires_at, in created_at ASC order:
          a.terms_notice_id   = a.pending_notice_id
          a.pending_notice_id = null
          # grandfather_expires_at is retained as an audit fact

      # ratio resolution consumed by transfer_units_credited
      def effective_ratio(account, agreement):
          n = the ProgramChangeNotice with id == account.terms_notice_id
          if n is not null and n.status == EFFECTIVE
                 and n.change_type == TRANSFER_RATIO_CHANGE
                 and n.target_agreement_id == agreement.id:
              return (n.new_ratio_points_out, n.new_ratio_partner_units_in)
          return (agreement.ratio_points_out, agreement.ratio_partner_units_in)
    input_set: "Only Account rows with status == ACTIVE are re-pointed; CLOSED accounts keep whatever terms they held. Accounts are processed in created_at ASC order; the order is observable only through Account.version and never changes any account's resulting terms."
    constants: {}
    precision: "Day arithmetic is exact calendar-day addition on the UTC instant; no rounding."

  - name: transfer_units_credited
    trigger: "The TransferRequest QUEUED -> COMPLETED transition inside POST /rewards/ops-runs"
    algorithm: waterfall_allocation
    formula: |
      (rpo, rpu) = effective_ratio(account, agreement)      # grandfathering_terms_resolution
      request.ratio_points_out_applied       = rpo
      request.ratio_partner_units_in_applied = rpu

      blocks = request.points_out // BLOCK_POINTS           # points_out is a multiple of
                                                           # agreement.transfer_increment_points,
                                                           # itself a multiple of BLOCK_POINTS
      units_per_block = floor(BLOCK_POINTS * rpu / rpo)
      base_units = 0
      for i in 1..blocks:  base_units = base_units + units_per_block     # per-block floor, THEN sum

      if request.bonus_event_id is null:
          bonus_units = 0
      else:
          ev = the TransferBonusEvent with id == request.bonus_event_id
          bonus_eligible_blocks = min(blocks, ev.cap_points_per_account // BLOCK_POINTS)
          bonus_per_block = floor(units_per_block * ev.bonus_bps / 10000)
          bonus_units = 0
          for i in 1..bonus_eligible_blocks: bonus_units = bonus_units + bonus_per_block
      request.base_units             = base_units
      request.bonus_units            = bonus_units
      request.partner_units_credited = base_units + bonus_units
    input_set: "bonus_event_id was pinned at submission time to the TransferBonusEvent on this agreement with status == RUNNING whose closed window [window_start, window_end] contains the submission instant; if two such events existed the earlier window_start wins, with created_at ASC as the tie-break. Events cancelled after submission still pay out because the id is pinned."
    constants:
      BLOCK_POINTS: 1000
    precision: |
      Integer partner units. The rounding order is PINNED: floor per 1000-point block, then sum.
      Summing first and flooring once produces a different number whenever
      (BLOCK_POINTS * rpu) is not divisible by rpo — e.g. 9000 points at a 3000:2000 ratio yields
      9 * floor(666.67) = 5994 under the pinned order versus floor(9000*2000/3000) = 6000 under
      sum-then-round. The bonus leg is floored per block against the already-floored
      units_per_block, never against the summed base_units.

  - name: ato_risk_score
    trigger: "POST /rewards/fraud-cases computes the instant leg; POST /rewards/fraud-cases/{id}/review computes the review leg"
    algorithm: weighted_scoring
    formula: |
      # instant leg — signal weights only
      instant_score = min(100, sum(SIGNAL_WEIGHTS[s] for s in distinct(case.signals)))
      case.risk_score = instant_score          # while status == OPEN

      # review leg — adds transfer velocity and a device-stability credit
      points_out_window = sum(TransferRequest.points_out) over requests with this account_id,
            status IN {SUBMITTED, HELD, QUEUED, COMPLETED} and created_at >
            (case.created_at - VELOCITY_LOOKBACK_DAYS days) and created_at <= case.created_at
                                                                    # half-open on the left
      velocity_term = min(VELOCITY_TERM_CAP,
                          (points_out_window // VELOCITY_STEP_POINTS) * VELOCITY_STEP_SCORE)
      decay_term    = 0 if case.device_fingerprint_changed else DEVICE_STABLE_DECAY
      review_score  = max(0, min(100, instant_score + velocity_term - decay_term))
      case.review_score = review_score
      case.risk_score   = review_score          # from UNDER_REVIEW onward
    input_set: "The window is anchored on the FraudCase's own created_at, not on the logical clock, so re-reviewing a case never widens it. The window counts REJECTED and REVERSED transfers out (they never reached the partner) but counts COMPLETED and all in-flight statuses in. Signals are de-duplicated before weighting."
    constants:
      SIGNAL_WEIGHTS: { DEVICE_CHANGE: 30, EMAIL_CHANGE: 20, PASSWORD_RESET: 15, NEW_PAYEE: 25, GEO_ANOMALY: 10 }
      VELOCITY_LOOKBACK_DAYS: 30
      VELOCITY_STEP_POINTS: 50000
      VELOCITY_STEP_SCORE: 10
      VELOCITY_TERM_CAP: 40
      DEVICE_STABLE_DECAY: 10
    precision: "Integer score clamped to [0, 100]. The velocity step uses integer floor division, so 99,999 points in the window scores one step, not two."
    variants:
      - name: instant_signal_score
        when: "the case is still OPEN"
        difference: "Signals only; no velocity term and no decay credit. This is the score the posture calculation sees at case creation."
      - name: review_velocity_score
        when: "the case has moved to UNDER_REVIEW"
        difference: "Adds the 30-day transfer velocity term and subtracts the device-stability credit, so the same case on the same data can cross the posture lock threshold at review that it did not cross at open."

  - name: account_fraud_posture
    trigger: "Recomputed after POST /rewards/fraud-cases, .../review, .../confirm, .../clear, after every TransferRequest hold, and after the Transaction reversal cascade increments transfer_hold_count"
    algorithm: threshold
    formula: |
      cases = FraudCase rows with this account_id
      if any c in cases has c.status == CONFIRMED:                       posture = LOCKED
      elif any c in cases has c.status IN {OPEN, UNDER_REVIEW}
           and c.risk_score >= POSTURE_LOCK_SCORE:                       posture = LOCKED
      elif (any c in cases has c.status IN {OPEN, UNDER_REVIEW}
            and c.risk_score >= POSTURE_WATCH_SCORE)
           or account.transfer_hold_count >= POSTURE_WATCH_HOLD_COUNT:   posture = WATCH
      else:                                                             posture = CLEAR
    input_set: "CLEARED cases never contribute. transfer_hold_count is monotonic, so an account that accumulated two holds cannot fall below WATCH even after every case is cleared."
    constants:
      POSTURE_LOCK_SCORE: 60
      POSTURE_WATCH_SCORE: 30
      POSTURE_WATCH_HOLD_COUNT: 2
    precision: "Thresholds are inclusive: risk_score exactly 60 locks, exactly 30 watches, exactly 2 holds watch."

  - name: benefit_allowance_remaining
    trigger: "POST /rewards/benefit-entitlements/{id}/consume, and on every read of BenefitEntitlement"
    algorithm: aggregation
    formula: |
      remaining_allowance = max(0, entitlement.annual_allowance - entitlement.used_count)
      consume admitted only when ALL hold:
        entitlement.status == ACTIVE
        account.fraud_posture != LOCKED
        remaining_allowance >= 1
        entitlement.requires_portal_booking == false, OR the cited RedemptionOrder has
            channel == PORTAL_BOOKING and fulfillment_status == TICKETED
        the cited RedemptionOrder.account_id == entitlement.account_id
      on success: used_count = used_count + 1; last_consumed_at = clock instant
    input_set: "used_count counts only successful consume calls on this row; rejected calls never increment it."
    constants: {}
    precision: "Integer counts; remaining_allowance is floored at 0."

  - name: points_liability_and_breakage
    trigger: "POST /rewards/liability-snapshots"
    algorithm: chronological
    formula: |
      # STEP 1 — gross outstanding points (drives the breakage tier; never the net value)
      gross_outstanding_points = sum(PointsLedgerEntry.points_delta) over ALL entries with
                                 occurred_at <= as_of
      # STEP 2 — dormancy split, per account, in created_at ASC order
      for each Account a:
          a_out = sum(PointsLedgerEntry.points_delta) over entries with account_id == a.id
                  and occurred_at <= as_of
          a is dormant when NO entry with account_id == a.id, entry_type IN {EARN_BASE, EARN_BONUS}
                 and occurred_at > (as_of - DORMANCY_LOOKBACK_DAYS days) exists
      dormant_outstanding_points     = sum(a_out for dormant accounts)
      non_dormant_outstanding_points = gross_outstanding_points - dormant_outstanding_points
      # STEP 3 — tier selection, keyed on STEP 1's gross value ONLY
      base_rate_bps = 1200 if gross_outstanding_points < 1000000
                      else 1800 if gross_outstanding_points < 10000000
                      else 2400
      dormant_rate_bps = min(BREAKAGE_RATE_CAP_BPS, base_rate_bps + DORMANT_UPLIFT_BPS)
      # STEP 4 — blended cost per 1k, method-dependent (see variants)
      blended_cost_per_1k_cents = <per variant; DEFAULT_COST_PER_1K_CENTS when the set is empty>
      # STEP 5 — value each bucket separately, round each, THEN sum
      nd_value = round_half_up(non_dormant_outstanding_points * blended_cost_per_1k_cents / 1000)
      d_value  = round_half_up(dormant_outstanding_points     * blended_cost_per_1k_cents / 1000)
      gross_liability_cents = nd_value + d_value
      # STEP 6 — breakage credit, per bucket at its own rate
      breakage_credit_cents = round_half_up(nd_value * base_rate_bps    / 10000)
                            + round_half_up(d_value  * dormant_rate_bps / 10000)
      # STEP 7 — net, and the reported effective rate
      net_liability_cents = gross_liability_cents - breakage_credit_cents
      effective_breakage_rate_bps = 0 if gross_liability_cents == 0 else
              round_half_up(breakage_credit_cents * 10000 / gross_liability_cents)
    input_set: |
      Ledger entries with occurred_at <= as_of, all of them, regardless of entry_type. The COST_BASIS
      cost set is RedemptionOrder rows with settlement_status == SETTLED and settled_at <= as_of. The
      FAIR_VALUE cost set is RedemptionOrder rows with fulfillment_status IN {CONFIRMED, TICKETED,
      REFUNDED} and created_at <= as_of. CANCELLED orders are in neither set.
    constants:
      BREAKAGE_TIERS: "[0, 1000000) -> 1200 bps ; [1000000, 10000000) -> 1800 bps ; [10000000, inf) -> 2400 bps"
      DORMANT_UPLIFT_BPS: 1000
      BREAKAGE_RATE_CAP_BPS: 5000
      DORMANCY_LOOKBACK_DAYS: 365
      DEFAULT_COST_PER_1K_CENTS: 1000
    precision: |
      Integer cents, round_half_up. The evaluation order is PINNED and the circularity is broken at
      STEP 3: the breakage tier is selected from the STEP 1 gross outstanding points, NOT from the
      STEP 7 net liability that the tier itself helps produce, and NOT from the points remaining
      after breakage is subtracted. Bucket values are rounded before they are summed (STEP 5) and
      each bucket's credit is rounded at its own rate before the two credits are summed (STEP 6);
      summing first and rounding once yields a different cent total.
    variants:
      - name: cost_basis
        when: "method == COST_BASIS"
        difference: "blended_cost_per_1k_cents = round_half_up(sum(issuer_cost_final_cents) * 1000 / sum(points_debited)) over SETTLED orders with settled_at <= as_of; the actual invoiced cost. Empty set falls back to DEFAULT_COST_PER_1K_CENTS."
      - name: fair_value
        when: "method == FAIR_VALUE"
        difference: "blended_cost_per_1k_cents = round_half_up(sum(issuer_cost_provisional_cents) * 1000 / sum(points_debited)) over orders with fulfillment_status IN {CONFIRMED, TICKETED, REFUNDED} and created_at <= as_of; the forward-looking estimate. Empty set falls back to DEFAULT_COST_PER_1K_CENTS. On identical data the two methods diverge whenever any settled invoice differed from its booking-time estimate."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "Both X-User-Role and X-User-ID headers are present and non-empty."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 11
    category: auth
    check: "X-User-Role is one of {Cardholder, ProgramAdmin, ProgramApprover, FraudAnalyst, AgencySupplier}."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 21
    category: auth
    check: "When the acting role is Cardholder, X-User-ID equals the account_id in the request body or the account_id of the addressed RedemptionOrder / TransferRequest / BenefitEntitlement / Account."
    error_id: ERR_ACCOUNT_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "GET /rewards/accounts/{id}, POST /rewards/inventory-offers/{id}/book, POST /rewards/redemption-orders, POST /rewards/redemption-orders/{id}/confirm, POST /rewards/redemption-orders/{id}/cancel, POST /rewards/transfer-requests, POST /rewards/benefit-entitlements/{id}/consume"
  - priority: 22
    category: auth
    check: "When the acting role is AgencySupplier, X-User-ID equals the agency_partner_id of the offer being written, or of the offer behind the RedemptionOrder being ticketed or refunded."
    error_id: ERR_AGENCY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /rewards/inventory-offers, POST /rewards/inventory-offers/{id}/resync, POST /rewards/inventory-offers/{id}/withdraw, POST /rewards/redemption-orders/{id}/ticket, POST /rewards/redemption-orders/{id}/refund"
  - priority: 23
    category: auth
    check: "Segregation of duties: the acting X-User-ID differs from the opposing operator id already stored on the row — PartnerAgreement.submitted_by_user_id on approve/reinstate, ProgramChangeNotice.drafted_by_user_id on announce, FraudCase.opened_by_user_id on confirm/clear, TransferRequest.held_by_user_id on release."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /rewards/partner-agreements/{id}/approve, POST /rewards/partner-agreements/{id}/reinstate, POST /rewards/change-notices/{id}/announce, POST /rewards/fraud-cases/{id}/confirm, POST /rewards/fraud-cases/{id}/clear, POST /rewards/transfer-requests/{id}/release"
  - priority: 30
    category: existence
    check: "Every id in the path resolves, then every id in the body resolves, both left-to-right in declaration order. The message names the resource type that failed."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 31
    category: business_constraint
    check: "Body schema: required fields present, types correct, enum members recognised, numeric constraints from 1.1 honoured, arrays non-empty where declared, no duplicate members in FraudCase.signals."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 32
    category: business_constraint
    check: "Pagination: limit within [1, 100] and offset >= 0 when supplied."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"
  - priority: 35
    category: state
    check: "expected_offer_version equals the addressed PortalInventoryOffer's current version."
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412
    applies_to: "POST /rewards/inventory-offers/{id}/book"
  - priority: 36
    category: state
    check: "expected_account_version equals the addressed Account's current version."
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /rewards/transfer-requests"
  - priority: 40
    category: state
    check: "The addressed row's current state is a declared `from:` state for the requested transition in 1.2."
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 41
    category: state
    check: "The owning Account has status == ACTIVE."
    error_id: ERR_ACCOUNT_CLOSED
    http_status: 409
    applies_to: "POST /rewards/transactions, POST /rewards/inventory-offers/{id}/book, POST /rewards/redemption-orders, POST /rewards/transfer-requests, POST /rewards/benefit-entitlements, POST /rewards/benefit-entitlements/{id}/consume"
  - priority: 42
    category: state
    check: "The owning Account has fraud_posture != LOCKED."
    error_id: ERR_ACCOUNT_POSTURE_LOCKED
    http_status: 409
    applies_to: "POST /rewards/inventory-offers/{id}/book, POST /rewards/redemption-orders, POST /rewards/redemption-orders/{id}/confirm, POST /rewards/transfer-requests, POST /rewards/transfer-requests/{id}/clear-screening, POST /rewards/transfer-requests/{id}/release, POST /rewards/benefit-entitlements/{id}/consume"
  - priority: 43
    category: state
    check: "The addressed PortalInventoryOffer has status == OPEN."
    error_id: ERR_OFFER_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /rewards/inventory-offers/{id}/book"
  - priority: 44
    category: state
    check: "The referenced PartnerAgreement has status == ACTIVE."
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /rewards/transfer-requests, POST /rewards/transfer-requests/{id}/clear-screening, POST /rewards/bonus-events, POST /rewards/change-notices/{id}/submit"
  - priority: 45
    category: state
    check: "The TravelAgencyPartner behind the offer has status == ACTIVE."
    error_id: ERR_AGENCY_SUSPENDED
    http_status: 409
    applies_to: "POST /rewards/inventory-offers, POST /rewards/inventory-offers/{id}/reinstate, POST /rewards/redemption-orders/{id}/ticket"
  - priority: 46
    category: state
    check: "The addressed BenefitEntitlement has status == ACTIVE (SUSPENDED or EXPIRED rows are not consumable)."
    error_id: ERR_BENEFIT_NOT_CONSUMABLE
    http_status: 409
    applies_to: "POST /rewards/benefit-entitlements/{id}/consume"
  - priority: 47
    category: state
    check: "The addressed PortalInventoryOffer has seats_committed == 0; an offer with live bookings may not be withdrawn or reinstated into a full state."
    error_id: ERR_OFFER_HAS_COMMITTED_SEATS
    http_status: 409
    applies_to: "POST /rewards/inventory-offers/{id}/withdraw"
  - priority: 48
    category: state
    check: "No TransferRequest of the account has status IN {SUBMITTED, QUEUED, HELD} and no RedemptionOrder of the account has fulfillment_status IN {QUOTED, CONFIRMED}."
    error_id: ERR_ACCOUNT_HAS_IN_FLIGHT_POINTS
    http_status: 409
    applies_to: "POST /rewards/accounts/{id}/close"
  - priority: 49
    category: state
    check: "No TransferRequest on the agreement has status IN {SUBMITTED, QUEUED, HELD}."
    error_id: ERR_AGREEMENT_HAS_IN_FLIGHT_TRANSFERS
    http_status: 409
    applies_to: "POST /rewards/partner-agreements/{id}/terminate"
  - priority: 50
    category: business_safety
    check: "The addressed PortalInventoryOffer has parity_status == IN_PARITY."
    error_id: ERR_OFFER_OUT_OF_PARITY
    http_status: 409
    applies_to: "POST /rewards/inventory-offers/{id}/book, POST /rewards/redemption-orders/{id}/confirm"
  - priority: 51
    category: business_safety
    check: "A resync may not raise portal_seats above the agency_public_seats it declares in the same call, because the portal would then advertise inventory the agency cannot honour."
    error_id: ERR_AVAILABILITY_PARITY_BREACH
    http_status: 422
    applies_to: "POST /rewards/inventory-offers, POST /rewards/inventory-offers/{id}/resync"
  - priority: 55
    category: business_temporal
    check: "No other EarningCategoryRotation on the same merchant_category_id with status IN {DRAFT, SCHEDULED, ACTIVE} has a half-open window [window_start, window_end) that intersects the new one. Touching endpoints (existing.window_end == new.window_start) do NOT intersect and are accepted."
    error_id: ERR_ROTATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /rewards/rotations"
  - priority: 56
    category: business_temporal
    check: "No other TransferBonusEvent on the same partner_agreement_id with status IN {SCHEDULED, RUNNING} lies within BONUS_EVENT_BUFFER_HOURS of the new closed window: the new event is accepted only when new.window_start > existing.window_end + 24h or new.window_end < existing.window_start - 24h. Touching or merely adjacent windows are rejected."
    error_id: ERR_BONUS_EVENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /rewards/bonus-events"
  - priority: 57
    category: business_temporal
    check: "The logical clock instant is at or before completed_at + agreement.reversal_window_hours."
    error_id: ERR_TRANSFER_REVERSAL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /rewards/transfer-requests/{id}/reverse"
  - priority: 58
    category: business_temporal
    check: "notice.effective_at is at least MIN_NOTICE_DAYS (45) days after the logical clock instant at announcement."
    error_id: ERR_NOTICE_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /rewards/change-notices/{id}/announce"
  - priority: 59
    category: business_temporal
    check: "as_of is at or before the logical clock instant; a snapshot may not be taken of the future."
    error_id: ERR_SNAPSHOT_AS_OF_IN_FUTURE
    http_status: 422
    applies_to: "POST /rewards/liability-snapshots"
  - priority: 60
    category: business_referential
    check: "channel == STATEMENT_CREDIT on the flat create endpoint; a PORTAL_BOOKING must be created through the offer's book endpoint so an inventory_offer_id can be attached."
    error_id: ERR_CHANNEL_REQUIRES_OFFER
    http_status: 422
    applies_to: "POST /rewards/redemption-orders"
  - priority: 61
    category: business_referential
    check: "When requires_portal_booking == true, the cited redemption_order_id names an order with channel == PORTAL_BOOKING and fulfillment_status == TICKETED."
    error_id: ERR_BENEFIT_REQUIRES_TICKETED_BOOKING
    http_status: 409
    applies_to: "POST /rewards/benefit-entitlements/{id}/consume"
  - priority: 62
    category: business_referential
    check: "The cited RedemptionOrder.account_id equals the BenefitEntitlement.account_id."
    error_id: ERR_ORDER_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /rewards/benefit-entitlements/{id}/consume"
  - priority: 63
    category: business_referential
    check: "At most one MerchantCategory carries is_fallback == true, and mcc_code is unique across MerchantCategory."
    error_id: ERR_DUPLICATE_CATEGORY_MAPPING
    http_status: 409
    applies_to: "POST /rewards/merchant-categories"
  - priority: 64
    category: business_referential
    check: "partner_program_code is unique among PartnerAgreement rows with status IN {PENDING_APPROVAL, ACTIVE, SUSPENDED}; rotation_code, event_code and notice_code are globally unique."
    error_id: ERR_DUPLICATE_PROGRAM_CODE
    http_status: 409
    applies_to: "POST /rewards/partner-agreements/{id}/submit, POST /rewards/rotations, POST /rewards/bonus-events, POST /rewards/change-notices"
  - priority: 65
    category: business_constraint
    check: "points_out >= agreement.min_transfer_points."
    error_id: ERR_BELOW_MIN_TRANSFER
    http_status: 422
    applies_to: "POST /rewards/transfer-requests"
  - priority: 66
    category: business_constraint
    check: "points_out is an exact multiple of agreement.transfer_increment_points."
    error_id: ERR_TRANSFER_INCREMENT_INVALID
    http_status: 422
    applies_to: "POST /rewards/transfer-requests"
  - priority: 67
    category: business_constraint
    check: "offer.seats_committed < offer.portal_seats at booking time."
    error_id: ERR_SEAT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rewards/inventory-offers/{id}/book"
  - priority: 68
    category: business_constraint
    check: "points_requested >= STATEMENT_CREDIT_MIN_POINTS (2500)."
    error_id: ERR_STATEMENT_CREDIT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /rewards/redemption-orders"
  - priority: 69
    category: business_referential
    check: "When change_type == TRANSFER_RATIO_CHANGE, target_agreement_id, new_ratio_points_out and new_ratio_partner_units_in are all present on the notice."
    error_id: ERR_NOTICE_TARGET_REQUIRED
    http_status: 422
    applies_to: "POST /rewards/change-notices/{id}/submit"
  - priority: 70
    category: business_fiscal
    check: "The requested burn is at most calculations.available_points_for_redemption for the account; equality is admitted."
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 402
    applies_to: "POST /rewards/inventory-offers/{id}/book, POST /rewards/redemption-orders, POST /rewards/redemption-orders/{id}/confirm, POST /rewards/transfer-requests"
  - priority: 71
    category: business_fiscal
    check: "remaining_allowance >= 1 on the addressed BenefitEntitlement."
    error_id: ERR_BENEFIT_ALLOWANCE_EXHAUSTED
    http_status: 409
    applies_to: "POST /rewards/benefit-entitlements/{id}/consume"
  - priority: 72
    category: business_fiscal
    check: "invoice_amount_cents >= 0 and issuer_cost_final_cents may not be negative after the adjustment is applied."
    error_id: ERR_SETTLEMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /rewards/redemption-orders/{id}/settle"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# Flat topology: every collection is a top-level path under /rewards, and every
# child collection carries its foreign keys as optional query inputs so a parent
# id can always be turned back into its children.
endpoints:
  # --- logical clock + system sweep -----------------------------------------
  - method: POST
    path: /rewards/_clock/set_current_utc
    purpose: |
      Test-driving endpoint (§1.5 priority ladder step 3). Sets the domain's logical clock,
      which every temporal rule reads. The clock defaults to 2026-08-01T00:00:00Z before any
      call to this endpoint, and every `logical clock instant` in §1.2/§1.3/§1.4 means this value.
    roles: [ProgramAdmin]
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["no domain rows change; only the clock the sweep and the temporal validations read"]
  - method: GET
    path: /rewards/_clock
    purpose: Read the current logical clock instant.
    roles: [ProgramAdmin, ProgramApprover, FraudAnalyst, AgencySupplier, Cardholder]
    input: []
    output: "{ current_utc: string }"
    side_effects: []
  - method: POST
    path: /rewards/ops-runs
    purpose: |
      Runs the deterministic system sweep against the current logical clock in this fixed order:
      (1) rotations SCHEDULED -> ACTIVE, (2) rotations ACTIVE -> EXPIRED, (3) bonus events
      SCHEDULED -> RUNNING, (4) bonus events RUNNING -> CLOSED, (5) notices ANNOUNCED ->
      EFFECTIVE with the grandfathering re-point, (6) matured grandfather windows promoted,
      (7) transfer requests QUEUED -> COMPLETED, (8) entitlements ACTIVE/SUSPENDED -> EXPIRED.
    roles: [ProgramAdmin]
    input: []
    output: "{ rotations_activated: integer, rotations_expired: integer, bonus_events_opened: integer, bonus_events_closed: integer, notices_made_effective: integer, grandfather_windows_matured: integer, transfers_completed: integer, entitlements_expired: integer, clock_utc: string }"
    side_effects:
      - "advances every clock-driven state machine in the order above"
      - "increments the version of every row it touches"

