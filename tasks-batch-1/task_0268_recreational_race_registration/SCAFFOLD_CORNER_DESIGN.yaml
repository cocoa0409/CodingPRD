# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Recreational Race Registration — breadth probe over §1.1–§1.7.
# Same canonical timeline as SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_participant_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - "entities.Participant.fields.email"
          - "endpoints"
        distinguishing_aspect: "POST /participants with all required fields -> 201; response carries server-minted id, created_at, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /participants"
              payload: { email: "new@x.com", full_name: "New Runner", birthdate: "1990-06-06", gender: "X" }
              as: RaceDirector
              captures: { pid: $.data.id }
          assert:
            - "response code == 201"
            - "Participant.${pid}.version == 1"
            - "Participant.${pid}.email == new@x.com"

      - name: create_registration_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - "endpoints"
          - "validations[priority=5]"
        distinguishing_aspect: "POST /registrations omitting participant_id -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Event OPEN with a distance + wave + tier; clock 2026-06-09."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "rf@x.com", full_name: "RF", birthdate: "1990-01-01", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /events"
              payload: { name: "RF 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 50 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
          trigger:
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}" }
              as: Participant
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_REQUEST"

      - name: get_registration_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /registrations/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /registrations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RaceDirector
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_NOT_FOUND"

      - name: registration_entry_type_defaults_to_standard
        claim_type: Defaults
        grounds:
          - "entities.Registration.fields.entry_type"
          - "endpoints"
        distinguishing_aspect: "Omitting entry_type on POST /registrations applies default STANDARD; fundraising_minimum_cents == 0."
        test_recipe:
          setup: ["Event OPEN, distance + wave + tier; clock 2026-06-09."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "df@x.com", full_name: "DF", birthdate: "1990-01-01", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /events"
              payload: { name: "DF 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 50, charity_fundraising_minimum_cents: 25000 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
          trigger:
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p1}" }
              as: Participant
              as_user_id: "${p1}"
              captures: { reg: $.data.id }
          assert:
            - "Registration.${reg}.entry_type == STANDARD"
            - "Registration.${reg}.fundraising_minimum_cents == 0"

      - name: registration_amount_due_ignores_client_supplied_computed_field
        claim_type: System Fields
        grounds:
          - "entities.Registration.fields.amount_due_cents"
          - "calculations.registration_amount_due"
        distinguishing_aspect: "amount_due_cents is source: computed; even though it is not in §1.5 input, the server computes 5660 for a party1 REGULAR registration regardless of client intent."
        test_recipe:
          setup: ["Event OPEN, distance + wave + REGULAR tier 5500; clock 2026-06-09."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "sys@x.com", full_name: "Sys", birthdate: "1990-01-01", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /events"
              payload: { name: "Sys 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 50 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
          trigger:
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p1}" }
              as: Participant
              as_user_id: "${p1}"
              captures: { reg: $.data.id }
          assert:
            - "Registration.${reg}.amount_due_cents == 5660"

      - name: pricing_tier_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - "entities.PricingTier"
        distinguishing_aspect: "PricingTier has common_fields:false — read carries id and created_at but no version field and no update/transition endpoint."
        test_recipe:
          setup: ["Distance with one tier."]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Imm 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 50 }
              as: RaceDirector
              captures: { dist: $.data.id }
          trigger:
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
              captures: { tid: $.data.id }
          assert:
            - "response code == 201"
            - "PricingTier.${tid}.id is non-null"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_payment_from_confirmed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Registration.PENDING_PAYMENT_to_CONFIRMED"
          - "validations[priority=7]"
        distinguishing_aspect: "Already CONFIRMED registration confirmed again -> ERR_INVALID_STATE (409); no double charge."
        test_recipe:
          setup: ["CONFIRMED registration on capacity-5 distance, clock 2026-06-09."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "is1@x.com", full_name: "IS One", birthdate: "1990-01-01", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /events"
              payload: { name: "IS 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 5 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p1}" }
              as: Participant
              as_user_id: "${p1}"
              captures: { reg: $.data.id }
            - call: "GET /distances/${dist}"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
              captures: { dv1: $.data.version }
            - call: "POST /registrations/${reg}/confirm-payment"
              payload: { expected_distance_version: "${dv1}" }
              as: Participant
              as_user_id: "${p1}"
            - call: "GET /distances/${dist}"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
              captures: { dv2: $.data.version }
          trigger:
            - call: "POST /registrations/${reg}/confirm-payment"
              payload: { expected_distance_version: "${dv2}" }
              as: Participant
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"

      - name: cancel_from_cancelled_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Registration.CONFIRMED_to_CANCELLED"
          - "validations[priority=7]"
        distinguishing_aspect: "CANCELLED is terminal; a second cancel -> ERR_INVALID_STATE (409), no extra refund."
        test_recipe:
          setup: ["CONFIRMED registration then CANCELLED, clock 2026-06-09."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "tl1@x.com", full_name: "TL One", birthdate: "1990-01-01", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /events"
              payload: { name: "TL 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 5 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p1}" }
              as: Participant
              as_user_id: "${p1}"
              captures: { reg: $.data.id }
            - call: "GET /distances/${dist}"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
              captures: { dv: $.data.version }
            - call: "POST /registrations/${reg}/confirm-payment"
              payload: { expected_distance_version: "${dv}" }
              as: Participant
              as_user_id: "${p1}"
            - call: "POST /registrations/${reg}/cancel"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
          trigger:
            - call: "POST /registrations/${reg}/cancel"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"

      - name: new_registration_starts_in_pending_payment
        claim_type: Initial State
        grounds:
          - "state_machines.Registration"
          - "entities.Registration.fields.status"
        distinguishing_aspect: "A freshly created Registration has status PENDING_PAYMENT (the declared initial_state)."
        test_recipe:
          setup: ["Event OPEN, distance + wave + tier, clock 2026-06-09."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "init@x.com", full_name: "Init", birthdate: "1990-01-01", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /events"
              payload: { name: "Init 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 50 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
          trigger:
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p1}" }
              as: Participant
              as_user_id: "${p1}"
              captures: { reg: $.data.id }
          assert:
            - "Registration.${reg}.status == PENDING_PAYMENT"

      - name: open_event_requires_distance_with_wave_and_tier
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Event.DRAFT_to_OPEN"
          - "validations[priority=7]"
        distinguishing_aspect: "Opening an event that has a distance but no wave/tier -> ERR_INVALID_STATE (precondition unmet)."
        test_recipe:
          setup: ["DRAFT event with a distance but no waves/tiers; clock at 2026-06-09."]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "NoWave 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 50 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
          trigger:
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"

      - name: result_disqualify_from_official_branch
        claim_type: Valid Transition
        grounds:
          - "state_machines.ResultRecord.PROVISIONAL_to_OFFICIAL"
          - "state_machines.ResultRecord.OFFICIAL_to_DQ"
        distinguishing_aspect: "ResultRecord OFFICIAL can still transition to DQ (branching terminal), confirming OFFICIAL is not a lockdown."
        test_recipe:
          setup: ["BIB_ASSIGNED registration; event RESULTS_POSTED; OFFICIAL result."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "dq1@x.com", full_name: "DQ One", birthdate: "1990-01-01", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /events"
              payload: { name: "DQ 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 50 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p1}" }
              as: Participant
              as_user_id: "${p1}"
              captures: { reg: $.data.id }
            - call: "GET /distances/${dist}"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
              captures: { dv: $.data.version }
            - call: "POST /registrations/${reg}/confirm-payment"
              payload: { expected_distance_version: "${dv}" }
              as: Participant
              as_user_id: "${p1}"
            - call: "POST /registrations/${reg}/assign-bib"
              payload: {}
              as: RaceDirector
            - call: "POST /events/${ev}/close"
              payload: {}
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T01:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/post-results"
              payload: {}
              as: TimingOfficial
            - call: "POST /results"
              payload: { registration_id: "${reg}", distance_id: "${dist}", gun_start_clock_seconds: 0, mat_cross_clock_seconds: 130, finish_clock_seconds: 12130 }
              as: TimingOfficial
              captures: { res: $.data.id }
            - call: "POST /results/${res}/finalize"
              payload: {}
              as: TimingOfficial
          trigger:
            - call: "POST /results/${res}/disqualify"
              payload: {}
              as: TimingOfficial
          assert:
            - "ResultRecord.${res}.status == DQ"

      - name: confirm_payment_against_stale_distance_version
        claim_type: invalid_transition
        grounds:
          - "concurrency_rules[confirm-against-stale-distance]"
        excluded_because:
          difficulty_instance: boundary_precision_check / distance_capacity_boundary_full_routes_to_waitlist
          rationale: "OCC stale-version path on confirm-payment is exercised indirectly by capacity tests; the dedicated stale-version corner is authored under endpoints section below."

  # ===========================================================================
  - section: calculations
    instances:
      - name: timing_result_gun_chip_pace_computed_correctly
        claim_type: Correct Result
        grounds:
          - "calculations.timing_result"
          - "entities.ResultRecord.fields.pace_seconds_per_km"
        distinguishing_aspect: "On a 5.0km distance with gun_start 0, mat_cross 130, finish 12130: gun_time 12130, chip_time 12000, pace 2400 s/km."
        test_recipe:
          setup: ["BIB_ASSIGNED registration; event RESULTS_POSTED."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "tr1@x.com", full_name: "TR One", birthdate: "1990-01-01", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /events"
              payload: { name: "TR 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 50 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
