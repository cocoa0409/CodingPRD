              as: SopAdmin
              captures: { item_a: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-B", family_id: "${fam_b}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_b: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-C", family_id: "${fam_c}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 500, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
