  # ============================================================ validations
  - section: validations
    instances:
      - name: existence_checked_before_state_returns_404
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=13]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Dispatching a nonexistent loadout id returns 404 ERR_NOT_FOUND (existence, p4), never a state error — priority order holds even though dispatch has a state precondition."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /grain/loadouts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/dispatch", payload: {}, as: SiteManager, captures: { e14: $.data.error_id } }
          assert: ["HTTP 404; error_id == ERR_NOT_FOUND"]
      - name: missing_auth_header_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role check."
        test_recipe:
          setup: ["empty DB; the trigger request is sent with NO auth headers"]
          setup_api_calls: []
          trigger:
            - { call: "POST /grain/bins", payload: { name: "BIN-N", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { e15: $.data.error_id } }
          assert: ["HTTP 401; error_id == ERR_UNAUTHENTICATED (headers omitted by the test harness for this call)"]
      - name: outside_delivery_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_OUTSIDE_DELIVERY_WINDOW]"]
        distinguishing_aspect: "A loadout window ending 2027-01-06 against a contract window ending 2026-12-31 fails ERR_OUTSIDE_DELIVERY_WINDOW before any overlap check runs."
        test_recipe:
          setup: ["corn bin BIN-OW with lot 500.00 @15.0%; contract window 2026-08-01..2026-12-31"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-OW", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_ow: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_ow}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 500.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_ow: $.data.id, con_ow_v: $.data.version } }
          trigger:
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_ow}", bin_id: "${bin_ow}", scheduled_start: "2027-01-05T08:00:00Z", scheduled_end: "2027-01-06T12:00:00Z", planned_bu: 100.00, expected_contract_version: "${con_ow_v}" }, as: SiteManager, captures: { e16: $.data.error_id } }
          assert: ["HTTP 409; error_id == ERR_OUTSIDE_DELIVERY_WINDOW"]
      - name: contract_remaining_exceeded_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=31]", "errors[ERR_CONTRACT_REMAINING_EXCEEDED]", "entities.StorageContract.fields.committed_bu"]
        distinguishing_aspect: "planned_bu 600.00 against remaining 500.00 (contracted 500, nothing committed/delivered) fails ERR_CONTRACT_REMAINING_EXCEEDED; a planned 500.00 then succeeds (exact fit allowed)."
        test_recipe:
          setup: ["corn bin BIN-RE with lot 800.00 @15.0%; corn contract 500 bu OPEN"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-RE", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_re: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_re}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 800.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 500.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_re: $.data.id, con_re_v: $.data.version } }
          trigger:
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_re}", bin_id: "${bin_re}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 600.00, expected_contract_version: "${con_re_v}" }, as: SiteManager, captures: { e17: $.data.error_id } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_re}", bin_id: "${bin_re}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 500.00, expected_contract_version: "${con_re_v}" }, as: SiteManager, captures: { lo_re: $.data.id } }
          assert:
            - "600.00 planned: HTTP 409, error_id == ERR_CONTRACT_REMAINING_EXCEEDED"
            - "500.00 planned (exactly the remaining): HTTP 201 — and the failed 600 attempt left committed_bu == 0.00"
      - name: lots_insufficient_on_confirm_rejected
        claim_type: aggregate_validation
        grounds: ["validations[priority=30]", "errors[ERR_LOTS_INSUFFICIENT]", "calculations.allocation_waterfall"]
        distinguishing_aspect: "Each lot is individually valid, but the eligible aggregate (100.00 bu) cannot cover settled_net 150.00 -> ERR_LOTS_INSUFFICIENT; no partial debit occurs."
        test_recipe:
          setup: ["corn bin BIN-LI with lot 100.00 @15.0% (eligible current 100.00)", "contract 2000; loadout planned 150.00 dispatched and delivered net 150.00"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-LI", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_li: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_li}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 100.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_li: $.data.id } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_li: $.data.id, con_li_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_li}", bin_id: "${bin_li}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 150.00, expected_contract_version: "${con_li_v}" }, as: SiteManager, captures: { lo_li: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_li}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_li}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 150.00, moisture_pct: 15.0 } ] }, as: SiteManager }
          trigger:
            - { call: "POST /grain/loadouts/${lo_li}/confirm-settlement", payload: {}, as: SiteManager, captures: { e18: $.data.error_id } }
            - { call: "GET /grain/lots/${lot_li}", payload: {}, as: SiteManager, captures: { lot_li_cur: $.data.current_bu } }
          assert:
            - "HTTP 409; error_id == ERR_LOTS_INSUFFICIENT"
            - "lot current_bu unchanged at 100.00 (aggregate check precedes any debit)"
      - name: crop_mix_rejected_on_lot_fill
        claim_type: violation_to_error
        grounds: ["validations[priority=25]", "errors[ERR_CROP_MIX]"]
        distinguishing_aspect: "A SOYBEAN lot into a CORN-designated bin fails ERR_CROP_MIX (single-crop bin rule)."
        test_recipe:
          setup: ["corn bin BIN-CM cap 5000"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-CM", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_cm: $.data.id } }
          trigger:
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_cm}", crop: "SOYBEAN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 100.00, fill_moisture_pct: 13.0, fill_basis_cents: -30, reference_price_cents_per_bu: 1000 }, as: SiteManager, captures: { e19: $.data.error_id } }
          assert: ["HTTP 409; error_id == ERR_CROP_MIX"]
      - name: bin_capacity_exact_fit_boundary
        claim_type: boundary
        grounds: ["validations[priority=24]", "errors[ERR_BIN_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Capacity admits an exact fill (600 + 400 = 1000.00 <= 1000) but rejects 1000.01 by 0.01 bu."
        test_recipe:
          setup: ["corn bin BIN-CAP capacity 1000"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-CAP", capacity_bu: 1000, crop: "CORN" }, as: SiteManager, captures: { bin_cap: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_cap}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 600.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
          trigger:
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_cap}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 400.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_cap2: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_cap}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 0.01, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { e20: $.data.error_id } }
          assert:
            - "400.00 fill succeeds (sum exactly 1000.00 == capacity)"
            - "0.01 more: HTTP 409, error_id == ERR_BIN_CAPACITY_EXCEEDED"
      - name: applicator_cert_expired_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_APPLICATOR_CERT_EXPIRED]"]
        distinguishing_aspect: "Applicator whose cert_expires_at 2026-07-01 precedes application_start 2026-08-01 fails ERR_APPLICATOR_CERT_EXPIRED."
        test_recipe:
          setup: ["corn bin BIN-CE; applicator with expired certification"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-CE", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_ce: $.data.id } }
            - { call: "POST /grain/applicators", payload: { name: "Exp Eddy", license_no: "LIC-X", cert_expires_at: "2026-07-01T00:00:00Z" }, as: SiteManager, captures: { app_ce: $.data.id } }
          trigger:
            - { call: "POST /grain/fumigations", payload: { bin_id: "${bin_ce}", applicator_id: "${app_ce}", product: "PHOSPHINE", application_start: "2026-08-01T00:00:00Z", application_end: "2026-08-01T06:00:00Z" }, as: CertifiedApplicator, as_user_id: "${app_ce}", captures: { e21: $.data.error_id } }
          assert: ["HTTP 409; error_id == ERR_APPLICATOR_CERT_EXPIRED"]
      - name: atmosphere_unsafe_rejected_on_approve
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_ATMOSPHERE_UNSAFE]"]
        distinguishing_aspect: "Permit approve with atmosphere_test_passed=false fails ERR_ATMOSPHERE_UNSAFE even with no fumigation present (fumigation absence is checked first, then atmosphere/LOTO)."
        test_recipe:
          setup: ["corn bin BIN-AU; permit REQUESTED with atmosphere_test_passed=false, loto_confirmed=true"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-AU", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_au: $.data.id } }
            - { call: "POST /grain/entry-permits", payload: { bin_id: "${bin_au}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", atmosphere_test_passed: false, loto_confirmed: true }, as: SiteManager, as_user_id: "mgr-1", captures: { per_au: $.data.id } }
          trigger:
            - { call: "POST /grain/entry-permits/${per_au}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1", captures: { e22: $.data.error_id } }
          assert: ["HTTP 409; error_id == ERR_ATMOSPHERE_UNSAFE; permit stays REQUESTED"]
      - name: loss_outside_policy_period_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=23]", "errors[ERR_LOSS_OUTSIDE_PERIOD]"]
        distinguishing_aspect: "Alert closed_at 2026-08-05 is outside the policy period ending 2026-07-31 -> ERR_LOSS_OUTSIDE_PERIOD; the policy is still ACTIVE (no sweep ran), so the temporal check fires first."
        test_recipe:
          setup: ["bin BIN-LP with CONFIRMED_LOSS alert closed 2026-08-05T12:00:00Z", "SPOT policy period 2026-07-01..2026-07-31, ACTIVE"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-LP", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_lp: $.data.id } }
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_lp}", recorded_at: "2026-08-05T10:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [90.0], insect_activity: false }, as: SiteManager }
            - { call: "GET /grain/spoilage-alerts", payload: { bin_id: "${bin_lp}" }, as: SiteManager, captures: { al_lp: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T12:00:00Z" }, as: SiteManager }
            - { call: "POST /grain/spoilage-alerts/${al_lp}/close", payload: { outcome: "CONFIRMED_LOSS", loss_bu: 10.00 }, as: SiteManager }
            - { call: "POST /grain/policies", payload: { crop: "CORN", coverage_limit_cents: 1000000, deductible_cents: 5000, valuation_clause: "SPOT", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T23:59:59Z" }, as: FarmOwner, captures: { pol_lp: $.data.id } }
          trigger:
            - { call: "POST /grain/claims", payload: { policy_id: "${pol_lp}", spoilage_alert_id: "${al_lp}" }, as: SiteManager, captures: { e23: $.data.error_id } }
          assert: ["HTTP 409; error_id == ERR_LOSS_OUTSIDE_PERIOD"]
      - name: close_resolved_with_loss_bu_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=6]", "errors[ERR_VALIDATION]", "entities.SpoilageAlert.fields.loss_bu"]
        distinguishing_aspect: "outcome=RESOLVED with a loss_bu present violates the conditional-field rule (loss_bu iff CONFIRMED_LOSS) -> 400 ERR_VALIDATION."
        test_recipe:
          setup: ["bin BIN-RL with an OPEN hotspot alert"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-RL", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_rl: $.data.id } }
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_rl}", recorded_at: "2026-08-05T10:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [90.0], insect_activity: false }, as: SiteManager }
            - { call: "GET /grain/spoilage-alerts", payload: { bin_id: "${bin_rl}" }, as: SiteManager, captures: { al_rl: "$.data[0].id" } }
          trigger:
            - { call: "POST /grain/spoilage-alerts/${al_rl}/close", payload: { outcome: "RESOLVED", loss_bu: 5.00 }, as: SiteManager, captures: { e24: $.data.error_id } }
          assert: ["HTTP 400; error_id == ERR_VALIDATION; alert stays OPEN"]
      - name: state_beats_safety_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=13]", "validations[priority=15]"]
        excluded_because:
          difficulty_instance: state_beats_safety_on_dispatch
          rationale: "state-vs-safety dual-failure asserted in the named §1.8 instance."
      - name: safety_beats_fiscal_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=15]", "validations[priority=31]"]
        excluded_because:
          difficulty_instance: safety_beats_fiscal_on_loadout_create
          rationale: "safety-vs-fiscal dual-failure asserted in the named §1.8 instance."
      - name: posture_gate_covered
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_BIN_POSTURE_BLOCKED]"]
        excluded_because:
          difficulty_instance: loadout_create_gated_by_bin_posture
          rationale: "posture gate error asserted in the named §1.8 instance."
      - name: rei_boundary_covered
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_REI_NOT_ELAPSED]"]
        excluded_because:
          difficulty_instance: rei_boundary_exact_72h
          rationale: "REI boundary asserted both sides in the named §1.8 instance."
      - name: overlap_rules_covered
        claim_type: temporal_validation
        grounds: ["validations[priority=21]", "validations[priority=22]"]
        excluded_because:
          difficulty_instance: loadout_window_half_open_adjacency
          rationale: "Half-open bin windows and closed applicator intervals asserted in the two §1.8 Rule-8 instances."
      - name: active_fumigation_gate_covered
        claim_type: cross_entity_validation
        grounds: ["validations[priority=16]", "errors[ERR_ACTIVE_FUMIGATION_EXISTS]"]
        excluded_because:
          difficulty_instance: permit_approve_gated_by_fumigation
          rationale: "Permit x fumigation cross-entity gate asserted in the named §1.8 instance."
      - name: alert_loss_gate_covered
        claim_type: cross_entity_validation
        grounds: ["validations[priority=27]", "errors[ERR_ALERT_LOSS_NOT_CONFIRMED]"]
        excluded_because:
          difficulty_instance: claim_submit_gated_by_alert
          rationale: "Claim x alert cross-entity gate asserted in the named §1.8 instance."
  # ============================================================ endpoints
  - section: endpoints
    instances:
      - name: response_envelope_shape_success_and_error
        claim_type: envelope_shape
        grounds: ["response_envelope"]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type 'object' and data; error responses carry response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /grain/bins", payload: { name: "BIN-ENV", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_env: $.data.id } }
            - { call: "GET /grain/bins/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SiteManager, captures: { e25: $.data.error_id } }
          assert:
            - "create: meta.api_request_id present, meta.api_request_timestamp ISO8601, response_type == object, data.id present"
            - "error: response_type == error, data.error_id == ERR_NOT_FOUND, data.message present"
      - name: success_codes_created_vs_ok
        claim_type: success_codes
        grounds: ["endpoints"]
        distinguishing_aspect: "Resource creation returns 201 (bin, lot, contract, loadout); reads and action endpoints return 200 (GET, dispatch)."
        test_recipe:
          setup: ["corn bin with lot, contract, loadout"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-SC", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_sc: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_sc}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 500.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_sc: $.data.id, con_sc_v: $.data.version } }
          trigger:
            - { call: "GET /grain/bins/${bin_sc}", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_sc}", bin_id: "${bin_sc}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 100.00, expected_contract_version: "${con_sc_v}" }, as: SiteManager, captures: { lo_sc: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_sc}/dispatch", payload: {}, as: SiteManager }
          assert:
            - "POST /grain/bins, /grain/lots, /grain/contracts -> 201; GET /grain/bins/{id} -> 200"
            - "POST /grain/loadouts -> 201; POST /grain/loadouts/{id}/dispatch -> 200"
  # ============================================================ errors
  - section: errors
    instances:
      - name: error_catalog_safety_and_priority_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_BIN_POSTURE_BLOCKED]", "errors[ERR_REI_NOT_ELAPSED]", "errors[ERR_ACTIVE_FUMIGATION_EXISTS]", "errors[ERR_ALERT_LOSS_NOT_CONFIRMED]", "errors[ERR_WINDOW_OVERLAP]", "errors[ERR_APPLICATOR_DOUBLE_BOOKED]", "errors[ERR_CONTRACT_REMAINING_EXCEEDED]"]
        excluded_because:
          difficulty_instance: loadout_create_gated_by_bin_posture
          rationale: "Posture, REI, fumigation, alert-gate, overlap, and remaining-coverage errors are each triggered in §1.8 instances (Rules 5-8); remaining error codes are triggered by §1.9 instances in validations/state_machines sections."
  # ============================================================ rbac
  - section: rbac
    instances:
      - name: site_manager_cannot_create_contract
        claim_type: rbac_denial
        grounds: ["roles[FarmOwner].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "SiteManager attempting FarmOwner-exclusive contract creation is denied 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 1000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: SiteManager, captures: { e26: $.data.error_id } }
          assert: ["HTTP 403; error_id == ERR_FORBIDDEN"]
      - name: farm_owner_cannot_create_bin
        claim_type: rbac_denial
        grounds: ["roles[SiteManager].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "FarmOwner attempting SiteManager-exclusive bin creation is denied 403."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /grain/bins", payload: { name: "BIN-RB", capacity_bu: 5000, crop: "CORN" }, as: FarmOwner, captures: { e27: $.data.error_id } }
          assert: ["HTTP 403; error_id == ERR_FORBIDDEN"]
      - name: applicator_cannot_create_lot
        claim_type: rbac_denial
        grounds: ["roles[CertifiedApplicator].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "CertifiedApplicator (an entity-backed role) is denied lot creation even with a valid bin — its exclusive surface is fumigation only."
        test_recipe:
          setup: ["corn bin BIN-RA; applicator Alice registered"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-RA", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_ra: $.data.id } }
            - { call: "POST /grain/applicators", payload: { name: "Alice A", license_no: "LIC-A", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app_ra: $.data.id } }
          trigger:
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_ra}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 100.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: CertifiedApplicator, as_user_id: "${app_ra}", captures: { e28: $.data.error_id } }
          assert: ["HTTP 403; error_id == ERR_FORBIDDEN"]
      - name: farm_owner_cannot_close_alert
        claim_type: rbac_denial
        grounds: ["roles[SiteManager].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "FarmOwner cannot close a spoilage alert (SiteManager-exclusive action) — 403 before any state check."
        test_recipe:
          setup: ["bin BIN-RC with an OPEN hotspot alert"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-RC", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_rc: $.data.id } }
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_rc}", recorded_at: "2026-08-05T10:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [90.0], insect_activity: false }, as: SiteManager }
            - { call: "GET /grain/spoilage-alerts", payload: { bin_id: "${bin_rc}" }, as: SiteManager, captures: { al_rc: "$.data[0].id" } }
          trigger:
            - { call: "POST /grain/spoilage-alerts/${al_rc}/close", payload: { outcome: "RESOLVED" }, as: FarmOwner, captures: { e29: $.data.error_id } }
          assert: ["HTTP 403; error_id == ERR_FORBIDDEN; alert stays OPEN"]
      - name: applicator_identity_mismatch_forbidden
        claim_type: rbac_denial
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN]", "roles[CertifiedApplicator].identity"]
        distinguishing_aspect: "Entity-backed identity: a fumigation whose applicator_id names applicator B while the caller's X-User-ID is applicator A is rejected 403 ERR_FORBIDDEN (applicators act only as themselves)."
        test_recipe:
          setup: ["corn bin BIN-AI; applicators A and B registered"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-AI", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_ai: $.data.id } }
            - { call: "POST /grain/applicators", payload: { name: "Alice A", license_no: "LIC-A", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app_aia: $.data.id } }
            - { call: "POST /grain/applicators", payload: { name: "Bob B", license_no: "LIC-B", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app_aib: $.data.id } }
          trigger:
            - { call: "POST /grain/fumigations", payload: { bin_id: "${bin_ai}", applicator_id: "${app_aib}", product: "PHOSPHINE", application_start: "2026-08-01T00:00:00Z", application_end: "2026-08-01T06:00:00Z" }, as: CertifiedApplicator, as_user_id: "${app_aia}", captures: { e30: $.data.error_id } }
          assert: ["HTTP 403; error_id == ERR_FORBIDDEN (payload applicator_id != caller X-User-ID)"]
      - name: sod_fumigation_clear_by_applier_rejected
        claim_type: rbac_segregation
        grounds: ["validations[priority=7]", "errors[ERR_SOD_SAME_APPLICATOR]"]
        distinguishing_aspect: "Segregation of duties: the applicator who applied a fumigation cannot clear it; a different applicator clears it after the REI."
        test_recipe:
          setup: ["corn bin BIN-SD; applicators A (applied) and B; PHOSPHINE fumigation ACTIVE from 2026-08-01T00:00:00Z; clock at lockout_until 2026-08-04T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-SD", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_sd: $.data.id } }
            - { call: "POST /grain/applicators", payload: { name: "Alice A", license_no: "LIC-A", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app_sda: $.data.id } }
            - { call: "POST /grain/applicators", payload: { name: "Bob B", license_no: "LIC-B", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app_sdb: $.data.id } }
            - { call: "POST /grain/fumigations", payload: { bin_id: "${bin_sd}", applicator_id: "${app_sda}", product: "PHOSPHINE", application_start: "2026-08-01T00:00:00Z", application_end: "2026-08-01T06:00:00Z" }, as: CertifiedApplicator, as_user_id: "${app_sda}", captures: { fum_sd: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: SiteManager }
          trigger:
            - { call: "POST /grain/fumigations/${fum_sd}/clear", payload: {}, as: CertifiedApplicator, as_user_id: "${app_sda}", captures: { e31: $.data.error_id } }
            - { call: "POST /grain/fumigations/${fum_sd}/clear", payload: {}, as: CertifiedApplicator, as_user_id: "${app_sdb}", captures: { fum_sd_st: $.data.status, fum_sd_by: $.data.cleared_by_applicator_id } }
          assert:
            - "clear by the applying applicator: HTTP 403, error_id == ERR_SOD_SAME_APPLICATOR"
            - "clear by a different applicator: 200, status CLEARED, cleared_by_applicator_id == ${app_sdb}"
      - name: sod_permit_self_approve_rejected
        claim_type: rbac_segregation
        grounds: ["validations[priority=8]", "errors[ERR_SOD_PERMIT_SELF_APPROVE]"]
        distinguishing_aspect: "Segregation of duties on opaque ids: a SafetyOfficer who requested the permit (X-User-ID so-1) cannot approve it; so-2 can."
        test_recipe:
          setup: ["corn bin BIN-SP; permit requested by SafetyOfficer so-1"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-SP", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_sp: $.data.id } }
            - { call: "POST /grain/entry-permits", payload: { bin_id: "${bin_sp}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", atmosphere_test_passed: true, loto_confirmed: true }, as: SafetyOfficer, as_user_id: "so-1", captures: { per_sp: $.data.id } }
          trigger:
            - { call: "POST /grain/entry-permits/${per_sp}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1", captures: { e32: $.data.error_id } }
            - { call: "POST /grain/entry-permits/${per_sp}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-2", captures: { per_sp_st: $.data.status, per_sp_appr: $.data.approver_user_id } }
          assert:
            - "approve by requester so-1: HTTP 403, error_id == ERR_SOD_PERMIT_SELF_APPROVE"
            - "approve by so-2: 200, status APPROVED, approver_user_id == 'so-2'"
  # ============================================================ cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_contract_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[loadout-create-stale-contract]", "errors[ERR_STALE_CONTRACT_VERSION]", "entities.StorageContract.fields.version"]
        distinguishing_aspect: "Loadout create with expected_contract_version from before a prior successful create is rejected 412 ERR_STALE_CONTRACT_VERSION; the version counter incremented 1 -> 2 on the first create is what strands the second."
        test_recipe:
          setup: ["corn bin BIN-OC with lot 2000.00 @15.0%; corn contract 2000 bu at version 1 observed by the client"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-OC", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_oc: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_oc}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 2000.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_oc: $.data.id, con_oc_v1: $.data.version } }
          trigger:
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_oc}", bin_id: "${bin_oc}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 100.00, expected_contract_version: "${con_oc_v1}" }, as: SiteManager, captures: { lo_oc: $.data.id } }
            - { call: "GET /grain/contracts/${con_oc}", payload: {}, as: SiteManager, captures: { con_oc_v2: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_oc}", bin_id: "${bin_oc}", scheduled_start: "2026-08-11T08:00:00Z", scheduled_end: "2026-08-11T12:00:00Z", planned_bu: 100.00, expected_contract_version: "${con_oc_v1}" }, as: SiteManager, captures: { e33: $.data.error_id } }
          assert:
            - "first create with observed version 1: 201 (contract version now == 2)"
            - "second create reusing the stale version 1: HTTP 412, error_id == ERR_STALE_CONTRACT_VERSION"
      - name: derived_inventory_reconciliation
        claim_type: derived_field_reconciliation
        grounds: ["entities.Bin.fields.current_inventory_bu", "calculations.allocation_waterfall"]
        distinguishing_aspect: "Bin.current_inventory_bu tracks lot debits and void credits exactly: 973.00 after fill (post provisional shrink), 496.35 after a 476.65 settle, back to 973.00 after the void."
        test_recipe:
          setup: ["corn bin BIN-DI with lot 1000.00 @17.0%", "contract 2000; loadout planned 476.65 delivered net 476.65"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-DI", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_di: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_di}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 1000.00, fill_moisture_pct: 17.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_di: $.data.id } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_di: $.data.id, con_di_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_di}", bin_id: "${bin_di}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 476.65, expected_contract_version: "${con_di_v}" }, as: SiteManager, captures: { lo_di: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_di}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_di}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 486.50, moisture_pct: 16.5 } ] }, as: SiteManager }
          trigger:
            - { call: "GET /grain/bins/${bin_di}", payload: {}, as: SiteManager, captures: { di_inv1: $.data.current_inventory_bu } }
            - { call: "POST /grain/loadouts/${lo_di}/confirm-settlement", payload: {}, as: SiteManager }
            - { call: "GET /grain/bins/${bin_di}", payload: {}, as: SiteManager, captures: { di_inv2: $.data.current_inventory_bu } }
            - { call: "POST /grain/loadouts/${lo_di}/void-settlement", payload: {}, as: SiteManager }
            - { call: "GET /grain/bins/${bin_di}", payload: {}, as: SiteManager, captures: { di_inv3: $.data.current_inventory_bu } }
          assert:
            - "after fill/deliver: current_inventory_bu == 973.00 (deliver alone does not debit)"
            - "after confirm: == 496.35; after void: == 973.00 (no drift across the compensation)"
      - name: hotspot_cascade_layer_covered
        claim_type: cascading_side_effects
        grounds: ["state_machines.Bin"]
        excluded_because:
          difficulty_instance: hotspot_cascade_depth4
          rationale: "N-level cascade chain asserted end-to-end in the named §1.8 instance."
      - name: threshold_boundaries_covered
        claim_type: rate_threshold_triggers
        grounds: ["calculations.spoilage_risk_score", "calculations.contract_fulfillment"]
        excluded_because:
          difficulty_instance: risk_score_multi_input_threshold
          rationale: "Score-tier boundaries (70.00/69.75) and 98% fulfillment boundary asserted in §1.8 instances."
  # ============================================================ consistency model
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_settlement
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "calculations.settlement_charges", "calculations.allocation_waterfall"]
        distinguishing_aspect: "Immediate consistency: the confirm-settlement response itself carries the computed money fields (net 42355), and a lot read in the very next request already reflects the waterfall debit (400.00)."
        test_recipe:
          setup: ["corn bin BIN-IM with lot 500.00 @15.0%", "contract 2000 at price 430 (futures 450, basis -20), no bonus", "loadout planned 100.00 delivered net 100.00"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-IM", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_im: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_im}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 500.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_im: $.data.id } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_im: $.data.id, con_im_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_im}", bin_id: "${bin_im}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 100.00, expected_contract_version: "${con_im_v}" }, as: SiteManager, captures: { lo_im: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_im}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_im}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 100.00, moisture_pct: 15.0 } ] }, as: SiteManager }
          trigger:
            - { call: "POST /grain/loadouts/${lo_im}/confirm-settlement", payload: {}, as: SiteManager, captures: { im_net: $.data.settlement_net_cents, im_se: $.data.settlement_status } }
            - { call: "GET /grain/lots/${lot_im}", payload: {}, as: SiteManager, captures: { im_cur: $.data.current_bu, im_st: $.data.status } }
          assert:
            - "confirm response: settlement_status == SETTLED, grain_value_cents == 43000, service_fee_cents == 645 (150bps tier), settlement_net_cents == 42355 — all in the same response"
            - "next request: lot current_bu == 400.00, status PARTIALLY_DRAWN (no reconciliation lag)"
