            - "after the third contact Agreement.${agr_id}.collection_contact_count_7d == 3"
            - "the fourth contact at 2026-08-14T16:00:00Z returns 422 ERR_CONTACT_FREQUENCY_EXCEEDED — the window count 3 is not strictly below the TX maximum of 3"
            - "the contact at 2026-08-19T15:00:00Z returns 201: the 08-12T15:00:00Z row sits exactly on the exclusive lower bound `now - 7 days` and drops out, so rolling_7d_count_at_contact == 2 (the 08-13 and 08-14 rows), not 3"
            - "after that contact Agreement.${agr_id}.collection_contact_count_7d == 3 (the post-insert count) while the agreement now holds 4 CollectionContact rows in total"
            - "GET /agreements/${agr_id}/collection-contacts reports total_count == 4 ordered by contacted_at ASC, and none of the calls changed collections_stage, which is still ADVERSE from the day-close"

      - name: early_purchase_payoff_uses_the_state_declared_formula
        claim_type: variant_divergence
        grounds:
          - calculations.early_purchase_payoff
        excluded_because:
          difficulty_instance: dual_variant_calc / early_purchase_payoff_pct_of_remaining_vs_cash_price_minus_credit
          rationale: "That instance quotes the same agreement shape under a PCT_OF_REMAINING state and a CASH_PRICE_MINUS_CREDIT state and asserts both payoff amounts, which is exactly the variant-divergence claim."

      - name: renewal_rate_ceils_before_it_multiplies
        claim_type: tiered_pricing
        grounds:
          - calculations.agreement_pricing
        excluded_because:
          difficulty_instance: combinatorial_formula / pricing_ceil_rate_before_multiply_inflates_disclosed_subtotal
          rationale: "That instance asserts the ceil-then-multiply ordering against the naive multiply-then-ceil total on the same inputs, covering the tiered rate derivation end to end."

      - name: payment_allocation_walks_its_buckets_in_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.renewal_payment_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / allocation_waterfall_partial_credit_plus_two_arrears_buckets
          rationale: "That instance drives a payment through carried partial credit, the late-fee bucket, the reinstatement-fee bucket and rent in one call and asserts every allocation_* field."

      - name: residual_decays_with_each_rent_cycle
        claim_type: decay_function
        grounds:
          - calculations.unit_residual_value
        excluded_because:
          difficulty_instance: dual_variant_calc / unit_residual_provisional_at_return_vs_final_at_grading
          rationale: "That instance exercises the decay factor at rent_cycle_count 0 and again after a re-rent, in both the PROVISIONAL and FINAL variants, so the cycle-count decay is fully pinned."

  # ===========================================================================
  # 4. Validations
  # ===========================================================================
  - section: validations
    instances:

      - name: disclosure_and_term_cap_gate_agreement_creation
        claim_type: violation_to_error
        grounds:
          - validations[priority=29].ERR_DISCLOSURE_NOT_ACKNOWLEDGED
          - validations[priority=33].ERR_TERM_EXCEEDS_STATE_CAP
          - calculations.agreement_pricing
        distinguishing_aspect: |
          The two consumer-protection gates on agreement creation each map to
          their own 422, and neither leaves a partial write: the unit is still
          AVAILABLE after both rejections. The accepted third attempt sits
          exactly on the TX cap of 78 renewals and its disclosed numbers show
          the pinned ceil-then-multiply order (3385 * 78 = 264030 > the 264000
          target) with the processing fee clamped at the 5000 state maximum.
        test_recipe:
          setup:
            - "one TX StateRtoRule (max_term_renewals 78, processing_fee_max_cents 5000)"
            - "one VERIFIED TX customer and one AVAILABLE NEW FURNITURE unit of cash_price_cents 120000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_tx_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_tx_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "+15125550101", state_code: "TX", employer_name: "Bluebonnet Foods", employer_verified: true, monthly_income_cents: 300000, residence_months: 18, government_id_verified: true, in_person_contact_consent: true }
              as: SalesAssociate
