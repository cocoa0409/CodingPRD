  - rule_id: non_linear_state_machine
    instances:

      - name: device_unit_custody_and_billing_dimensions_advance_independently
        grounds:
          - state_machines.DeviceUnit.custody_state.RESERVED_to_IMPLANTED
          - state_machines.DeviceUnit.custody_state.IMPLANTED_to_EXPLANTED
          - state_machines.DeviceUnit.billing_state.NOT_BILLABLE_to_BILLABLE
          - state_machines.DeviceUnit.billing_state.BILLABLE_to_INVOICED
          - state_machines.DeviceUnit.billing_state.INVOICED_to_CREDIT_PENDING
        distinguishing_aspect: |
          Non-linearity here is PARALLEL DIMENSIONS on the DeviceUnit entity:
          one row carries custody_state and billing_state that advance on
          different triggers - invoicing moves billing NOT_BILLABLE->BILLABLE->
          INVOICED while custody stays IMPLANTED, and explanting then moves
          custody IMPLANTED->EXPLANTED while billing goes INVOICED->
          CREDIT_PENDING. Neither axis can be derived from the other.
