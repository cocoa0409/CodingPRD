              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: EligibilitySpecialist
              captures: { fa1_id: "$.data.id" }
            - call: "POST /functional-assessments/${fa1_id}/complete"
              payload: { outcome: "FAIL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
            - call: "POST /eligibility-applications/${app_id}/deny"
              payload: {}
              as: EligibilitySpecialist
            - call: "POST /eligibility-applications/${app_id}/appeal"
              payload: {}
              as: EligibilitySpecialist
          trigger:
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-10T10:00:00Z" }
              as: EligibilitySpecialist
          assert:
            - "EligibilityApplication.${app_id}.status == ASSESSMENT_SCHEDULED"
            - "EligibilityApplication.${app_id}.appeal_count == 1"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: no_show_suspension_system_cancel_release_depth4_cascade
        grounds:
          - state_machines.TripReservation.SCHEDULED_to_NO_SHOW
          - entities.Rider.fields.account_status
          - entities.Rider.fields.eligibility_status
          - entities.Rider.fields.prior_suspension_count
          - entities.VehicleRun.fields.available_ambulatory_seats
          - entities.PenaltyEvent.fields.points
        distinguishing_aspect: |
          A single no-show fires a depth-4 chain: PenaltyEvent create (hop1) -> rider reaches
          SUSPENSION_THRESHOLD and is suspended (hop2) -> the rider's other non-terminal trip goes
          CANCELLED_BY_SYSTEM (hop3) -> that trip's VehicleRun capacity is released and its version bumps
          (hop4). Originates from the no-show trigger.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Certified rider. Assumes NO_SHOW_POINTS and SUSPENSION_THRESHOLD_POINTS(6) such that two no-shows reach the threshold."
            - "Trip A scheduled then no-showed (first strike, WARNING tier, still ACTIVE)."
            - "Trip B scheduled (well-separated time) - will be the second no-show trigger."
            - "Trip C scheduled (well-separated time) on run C with 4 seats - the collateral trip the suspension cancels."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /service-zones"
              payload: { zone_code: "ZA", name: "Zone A", center_lat: 40.0, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 500, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { za_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "R Seven", phone: "555-0007", email: "r7@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: EligibilitySpecialist
              captures: { fa_id: "$.data.id" }
            - call: "POST /functional-assessments/${fa_id}/complete"
              payload: { outcome: "PASS_UNCONDITIONAL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
            - call: "POST /eligibility-applications/${app_id}/certify"
              payload: {}
              as: EligibilitySpecialist
            - call: "POST /vehicle-runs"
              payload: { service_zone_id: "${za_id}", service_date: "2026-06-05", total_ambulatory_seats: 4, total_wheelchair_positions: 2 }
              as: Dispatcher
              captures: { run_a: "$.data.id", run_a_v: "$.data.version" }
            - call: "POST /vehicle-runs"
              payload: { service_zone_id: "${za_id}", service_date: "2026-06-05", total_ambulatory_seats: 4, total_wheelchair_positions: 2 }
              as: Dispatcher
              captures: { run_b: "$.data.id", run_b_v: "$.data.version" }
            - call: "POST /vehicle-runs"
              payload: { service_zone_id: "${za_id}", service_date: "2026-06-05", total_ambulatory_seats: 4, total_wheelchair_positions: 2 }
              as: Dispatcher
              captures: { run_c: "$.data.id", run_c_v: "$.data.version" }
            - call: "POST /trip-reservations"
              payload: { rider_id: "${r_id}", pickup_zone_id: "${za_id}", dropoff_zone_id: "${za_id}", pickup_lat: 40.0, pickup_lng: -74.0, dropoff_lat: 40.0, dropoff_lng: -74.0, requested_pickup_at: "2026-06-05T09:00:00Z" }
              as: Rider
              as_user_id: "${r_id}"
              captures: { trip_a: "$.data.id" }
            - call: "POST /trip-reservations/${trip_a}/offer"
              payload: { proposed_pickup_at: "2026-06-05T09:00:00Z" }
              as: Dispatcher
            - call: "POST /trip-reservations/${trip_a}/accept"
              payload: { run_id: "${run_a}", expected_run_version: "${run_a_v}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /trip-reservations/${trip_a}/no-show"
              payload: {}
              as: Driver
            - call: "POST /trip-reservations"
              payload: { rider_id: "${r_id}", pickup_zone_id: "${za_id}", dropoff_zone_id: "${za_id}", pickup_lat: 40.0, pickup_lng: -74.0, dropoff_lat: 40.0, dropoff_lng: -74.0, requested_pickup_at: "2026-06-05T12:00:00Z" }
              as: Rider
              as_user_id: "${r_id}"
              captures: { trip_b: "$.data.id" }
            - call: "POST /trip-reservations/${trip_b}/offer"
              payload: { proposed_pickup_at: "2026-06-05T12:00:00Z" }
              as: Dispatcher
            - call: "POST /trip-reservations/${trip_b}/accept"
              payload: { run_id: "${run_b}", expected_run_version: "${run_b_v}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /trip-reservations"
              payload: { rider_id: "${r_id}", pickup_zone_id: "${za_id}", dropoff_zone_id: "${za_id}", pickup_lat: 40.0, pickup_lng: -74.0, dropoff_lat: 40.0, dropoff_lng: -74.0, requested_pickup_at: "2026-06-05T15:00:00Z" }
              as: Rider
              as_user_id: "${r_id}"
              captures: { trip_c: "$.data.id" }
            - call: "POST /trip-reservations/${trip_c}/offer"
              payload: { proposed_pickup_at: "2026-06-05T15:00:00Z" }
              as: Dispatcher
            - call: "POST /trip-reservations/${trip_c}/accept"
              payload: { run_id: "${run_c}", expected_run_version: "${run_c_v}" }
              as: Rider
              as_user_id: "${r_id}"
          trigger:
            - call: "POST /trip-reservations/${trip_b}/no-show"
              payload: {}
              as: Driver
          assert:
            - "Rider.${r_id}.account_status == SUSPENDED"
            - "Rider.${r_id}.eligibility_status == SUSPENDED"
            - "Rider.${r_id}.prior_suspension_count == 1"
            - "TripReservation.${trip_b}.status == NO_SHOW"
            - "TripReservation.${trip_c}.status == CANCELLED_BY_SYSTEM"
            - "VehicleRun.${run_c}.available_ambulatory_seats == 4"
            - "VehicleRun.${run_c}.version == 3"

      - name: run_dispatch_cascades_scheduled_trip_to_en_route_depth2
        grounds:
          - state_machines.VehicleRun.OPEN_to_DISPATCHED
          - state_machines.TripReservation.SCHEDULED_to_EN_ROUTE
          - entities.VehicleRun.fields.status
        distinguishing_aspect: |
          Dispatching the run mutates VehicleRun OPEN->DISPATCHED (hop1) which in turn drives its SCHEDULED
          trip to EN_ROUTE (hop2) — a depth-2 cascade from the dispatch trigger, a different trigger than
          the no-show cascade.
        test_recipe:
