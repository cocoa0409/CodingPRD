# =============================================================================
# Task 1320 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities — creation, defaults, computed fields, not-found,
  # immutability, parent relationships
  # ===========================================================================
  - section: entities
    instances:
      - name: vessel_creation_applies_default_status
        claim_type: defaults
        grounds: ["entities.Vessel.fields.status"]
        distinguishing_aspect: "Vessel created without explicit status gets default ACTIVE."
        test_recipe:
          setup: ["Empty DB; dock exists for home_dock_id"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
          trigger:
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
          assert:
            - "Vessel.${vessel_id}.status == ACTIVE (system default applied)"
            - "Vessel.${vessel_id}.version == 1 and created_at non-null"

      - name: cruise_computed_fields_season_and_holiday_derived
        claim_type: computed_fields
        grounds: ["entities.CruiseInstance.fields.season", "entities.CruiseInstance.fields.is_holiday"]
        excluded_because:
          difficulty_instance: combinatorial_formula / ticket_pricing_tiered_seasonal_holiday_stack
          rationale: "Season/holiday derivation asserted for PEAK+holiday and PEAK+non-holiday in the named §1.8 instance."

      - name: cruise_off_season_derivation
        claim_type: computed_fields
        grounds: ["entities.CruiseInstance.fields.season"]
        distinguishing_aspect: "A January cruise derives season == OFF (month not in {5,6,7,8,9})."
        test_recipe:
          setup: ["Vessel and tier exist"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
          trigger:
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-01-15T19:00:00Z", return_at: "2026-01-15T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id } }
          assert:
            - "CruiseInstance.${cruise_id}.season == OFF and is_holiday == false"

      - name: passenger_is_minor_computed_from_depart_date
        claim_type: computed_fields
        grounds: ["entities.BookingPassenger.fields.is_minor"]
        distinguishing_aspect: "A passenger born 2008-01-01 is a minor at a 2026-08-10 departure (age 18 < 21); one born 2000-01-01 is not."
        test_recipe:
          setup: ["Cruise cap 100; booking party2 (unpaid is fine for passenger adds)"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 2, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
          trigger:
            - { call: "POST /bookings/${bk_a}/passengers", payload: { full_name: "Kid", date_of_birth: "2008-01-01" }, as: Customer, as_user_id: "${cust_a}", captures: { p_kid: $.data.id } }
            - { call: "POST /bookings/${bk_a}/passengers", payload: { full_name: "Adult", date_of_birth: "2000-01-01" }, as: Customer, as_user_id: "${cust_a}", captures: { p_adult: $.data.id } }
          assert:
            - "BookingPassenger.${p_kid}.is_minor == true"
            - "BookingPassenger.${p_adult}.is_minor == false"

      - name: get_nonexistent_cruise_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_CRUISE_NOT_FOUND]", "endpoints[GET /cruises/{cruiseId}]"]
        distinguishing_aspect: "GET with a well-formed but absent cruise id yields 404 ERR_CRUISE_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cruises/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CRUISE_NOT_FOUND"

      - name: booking_missing_required_party_size_rejected
        claim_type: required_fields
        grounds: ["entities.Booking.fields.party_size", "endpoints[POST /cruises/{cruiseId}/bookings]"]
        distinguishing_aspect: "Omitting required party_size yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Cruise exists"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
          trigger:
            - call: "POST /cruises/${cruise_id}/bookings"
              payload: { customer_id: "${cust_a}", expected_cruise_version: "${cruise_v}" }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (missing required party_size)"

      - name: invalid_enum_menu_tier_code_rejected
        claim_type: type_constraints
        grounds: ["entities.MenuTier.fields.code", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "MenuTier code 'DELUXE' (not in STANDARD|PREMIUM|LUXE) yields ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /menu-tiers"
              payload: { code: "DELUXE", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: cruise_return_before_depart_rejected
        claim_type: type_constraints
        grounds: ["entities.CruiseInstance.fields.return_at", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "return_at <= depart_at violates the datetime ordering constraint."
        test_recipe:
          setup: ["Vessel and tier exist"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
          trigger:
            - call: "POST /cruises"
              payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T22:00:00Z", return_at: "2026-08-10T19:00:00Z" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (return_at must be > depart_at)"

      - name: booking_passenger_immutable_no_version_field
        claim_type: immutability
        grounds: ["entities.BookingPassenger"]
        distinguishing_aspect: "BookingPassenger has common_fields: false — response carries id and created_at but no version field, and no update endpoint exists."
        test_recipe:
          setup: ["Cruise + booking exist"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
          trigger:
            - { call: "POST /bookings/${bk_a}/passengers", payload: { full_name: "P1", date_of_birth: "1990-01-01" }, as: Customer, as_user_id: "${cust_a}", captures: { p1: $.data.id } }
          assert:
            - "BookingPassenger.${p1} response contains id and created_at"
            - "BookingPassenger.${p1} response contains no version field (common_fields: false)"

      - name: nested_child_visible_through_parent_subresource
        claim_type: parent_relationships
        grounds: ["entities.BoardingManifest.fields.cruise_id", "endpoints[GET /cruises/{cruiseId}/manifest]"]
        distinguishing_aspect: "Cruise creation auto-creates exactly one DRAFT manifest retrievable via the parent sub-resource as a 0-or-1 array."
        test_recipe:
          setup: ["Vessel and tier exist"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id } }
          trigger:
            - { call: "GET /cruises/${cruise_id}/manifest", payload: {}, as: Captain, captures: { man_count: $.data } }
          assert:
            - "GET manifest returns an array of length 1 with status == DRAFT"
            - "Manifest.coast_guard_capacity == 100 (snapshot of vessel capacity at cruise creation)"

  # ===========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown,
  # initial state, auto-transitions, side-effect patterns
  # ===========================================================================
  - section: state_machines
    instances:
      - name: cruise_initial_state_scheduled
        claim_type: initial_state
        grounds: ["state_machines.CruiseInstance"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cruise_boarding_gated_on_manifest_frozen
          rationale: "Cruise created in SCHEDULED is the precondition exercised there (open-boarding valid only from SCHEDULED)."

      - name: depart_from_scheduled_invalid
        claim_type: invalid_transition
        grounds: ["state_machines.CruiseInstance", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Depart requires BOARDING; calling it on a SCHEDULED cruise fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Cruise SCHEDULED (manifest still DRAFT is irrelevant — state check fires first)"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id } }
          trigger:
            - call: "POST /cruises/${cruise_id}/depart"
              payload: {}
              as: Captain
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (depart requires BOARDING)"

      - name: cancelled_cruise_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.CruiseInstance", "errors[ERR_CRUISE_NOT_BOOKABLE]"]
        distinguishing_aspect: "After weather-cancel, booking creation against the CANCELLED cruise fails with ERR_CRUISE_NOT_BOOKABLE and no other transition revives it."
        test_recipe:
          setup: ["Cruise weather-cancelled under a covering event"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id } }
            - { call: "POST /weather-events", payload: { severity: "CANCELLATION_REQUIRED", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }, as: OperationsManager, captures: { wev_id: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/weather-cancel", payload: {}, as: OperationsManager }
            - { call: "GET /cruises/${cruise_id}", payload: {}, as: OperationsManager, captures: { cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
          trigger:
            - call: "POST /cruises/${cruise_id}/bookings"
              payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CRUISE_NOT_BOOKABLE (CANCELLED is terminal for booking mutations)"

      - name: manifest_amend_cycle_allows_refreeze
        claim_type: valid_transition
        grounds: ["state_machines.BoardingManifest.FROZEN_to_DRAFT", "state_machines.BoardingManifest.DRAFT_to_FROZEN"]
        distinguishing_aspect: "The DRAFT->FROZEN->DRAFT amendment cycle is legal while the cruise is SCHEDULED: freeze, amend, freeze again all succeed."
        test_recipe:
          setup: ["Cruise SCHEDULED with one PAID booking (so passenger_count >= 0; freeze has no minimum)"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
          trigger:
            - { call: "POST /cruises/${cruise_id}/manifest/freeze", payload: {}, as: Captain }
            - { call: "POST /cruises/${cruise_id}/manifest/amend", payload: {}, as: Captain }
            - { call: "POST /cruises/${cruise_id}/manifest/freeze", payload: {}, as: Captain, captures: { man: $.data } }
          assert:
            - "Second freeze succeeds: manifest status == FROZEN (cycle permitted)"

      - name: double_pay_idempotency_rejected
        claim_type: idempotency
        grounds: ["state_machines.Booking.pay_transition", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying an already-PAID booking fails with ERR_INVALID_STATE — the same trigger twice is an error on the second attempt."
        test_recipe:
          setup: ["Booking party1 PAID"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
          trigger:
            - call: "POST /bookings/${bk_a}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_a}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (second pay on PAID booking)"

      - name: depart_no_show_sweep_side_effect
        claim_type: side_effect_execution
        grounds: ["state_machines.CruiseInstance.BOARDING_to_UNDERWAY"]
        distinguishing_aspect: "Depart sweeps PAID+CONFIRMED bookings with zero boarded passengers into NO_SHOW while a fully boarded booking becomes BOARDED."
        test_recipe:
          setup:
            - "Cruise cap 100; bk_a party1 PAID with passenger checked in; bk_b party1 PAID, never checked in"
            - "Manifest frozen; boarding opened"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/passengers", payload: { full_name: "P1", date_of_birth: "1990-01-01" }, as: Customer, as_user_id: "${cust_a}", captures: { p1: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "GET /cruises/${cruise_id}", payload: {}, as: OperationsManager, captures: { cruise_v2: $.data.version } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v2}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_b: $.data.id } }
            - { call: "POST /bookings/${bk_b}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "POST /cruises/${cruise_id}/manifest/freeze", payload: {}, as: Captain }
            - { call: "POST /cruises/${cruise_id}/open-boarding", payload: {}, as: OperationsManager }
            - { call: "POST /bookings/${bk_a}/passengers/${p1}/check-in", payload: {}, as: DockAttendant }
          trigger:
            - { call: "POST /cruises/${cruise_id}/depart", payload: {}, as: Captain }
          assert:
            - "Booking.${bk_a}.booking_status == BOARDED"
            - "Booking.${bk_b}.booking_status == NO_SHOW (depart sweep)"
            - "CruiseInstance.${cruise_id}.boarded_count == 1"

      - name: provision_order_receive_from_draft_invalid
        claim_type: invalid_transition
        grounds: ["state_machines.GalleyProvisionOrder", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Receive requires PLACED; from DRAFT it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Cruise with PAID booking and DRAFT provision order"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "POST /cruises/${cruise_id}/provision-orders", payload: {}, as: GalleyManager, captures: { order_id: $.data.id } }
          trigger:
            - call: "POST /cruises/${cruise_id}/provision-orders/${order_id}/receive"
              payload: {}
              as: GalleyManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (receive requires PLACED)"

      - name: weather_hold_cycle_repeated
        claim_type: valid_transition
        grounds: ["state_machines.CruiseInstance.SCHEDULED_to_WEATHER_HOLD", "state_machines.CruiseInstance.WEATHER_HOLD_to_SCHEDULED"]
        distinguishing_aspect: "SCHEDULED->WEATHER_HOLD->SCHEDULED cycle can repeat: declare event (auto-hold), operator clears hold while event still DECLARED, close event; then a second event re-holds the same cruise."
        test_recipe:
          setup: ["Cruise SCHEDULED departing inside two successive event windows"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id } }
            - { call: "POST /weather-events", payload: { severity: "CANCELLATION_REQUIRED", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }, as: OperationsManager, captures: { wev1: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/clear-weather-hold", payload: {}, as: OperationsManager }
            - { call: "POST /weather-events/${wev1}/close", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /weather-events", payload: { severity: "CANCELLATION_REQUIRED", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }, as: OperationsManager, captures: { wev2: $.data.id } }
          assert:
            - "After clear-hold + close: CruiseInstance.status == SCHEDULED and WeatherEvent.${wev1}.status == CLOSED"
            - "Second CANCELLATION_REQUIRED event auto-re-holds: CruiseInstance.status == WEATHER_HOLD (cycle repeated)"

      - name: inquiry_declined_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.CharterInquiry", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From DECLINED no further transition is possible: a quote attempt fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Inquiry QUOTED then DECLINED"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 60, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "corp@x.com", full_name: "Corp" }, as: OperationsManager, captures: { cust_c: $.data.id } }
            - { call: "POST /charter-inquiries", payload: { cruise_id: "${cruise_id}", customer_id: "${cust_c}" }, as: CharterSalesAgent, captures: { inq_id: $.data.id, inq_v: $.data.version } }
            - { call: "POST /charter-inquiries/${inq_id}/quote", payload: { expected_inquiry_version: "${inq_v}" }, as: CharterSalesAgent }
            - { call: "POST /charter-inquiries/${inq_id}/decline", payload: {}, as: Customer, as_user_id: "${cust_c}" }
            - { call: "GET /charter-inquiries/${inq_id}", payload: {}, as: CharterSalesAgent, captures: { inq_v2: $.data.version } }
          trigger:
            - call: "POST /charter-inquiries/${inq_id}/quote"
              payload: { expected_inquiry_version: "${inq_v2}" }
              as: CharterSalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (DECLINED is terminal)"

  # ===========================================================================
  # Section: calculations — constants, input-set filtering, precision
  # ===========================================================================
  - section: calculations
    instances:
      - name: seasonal_multiplier_constants_applied
        claim_type: constants_applied
        grounds: ["calculations.ticket_pricing"]
        distinguishing_aspect: "Same party (2) on OFF season (Jan) costs 17800 flat (mult 1.00, no discount, no holiday) vs SHOULDER (Sep) 19580 = round(17800*1.10) — proving OFF_MULT and SHOULDER_MULT constants."
        test_recipe:
          setup: ["Two cruises same tier: one January, one September (non-holiday dates)"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-01-15T19:00:00Z", return_at: "2026-01-15T22:00:00Z" }, as: OperationsManager, captures: { cr_off: $.data.id, cr_off_v: $.data.version } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-09-15T19:00:00Z", return_at: "2026-09-15T22:00:00Z" }, as: OperationsManager, captures: { cr_sh: $.data.id, cr_sh_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
          trigger:
            - { call: "POST /cruises/${cr_off}/bookings", payload: { customer_id: "${cust_a}", party_size: 2, expected_cruise_version: "${cr_off_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_off: $.data.id } }
            - { call: "POST /cruises/${cr_sh}/bookings", payload: { customer_id: "${cust_a}", party_size: 2, expected_cruise_version: "${cr_sh_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_sh: $.data.id } }
          assert:
            - "Booking.${bk_off}.booking_total_cents == 17800 (OFF 1.00, no holiday)"
            - "Booking.${bk_sh}.booking_total_cents == 19580 (SHOULDER 1.10, 2026-09-15 not a holiday)"

      - name: party_discount_tier_boundaries
        claim_type: boundary_edge
        grounds: ["calculations.ticket_pricing"]
        distinguishing_aspect: "Party-size discount tiers: 3 -> 0%, 4 -> 5%, 6 -> 10%, 10 -> 15%. OFF season isolates the tier: party3 = 26700, party4 = 33820, party6 = 48060, party10 = 75650."
        test_recipe:
          setup: ["OFF-season cruise (January) so seasonal mult is 1.00 and no holiday"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-01-15T19:00:00Z", return_at: "2026-01-15T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
          trigger:
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 3, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk3: $.data.id } }
            - { call: "GET /cruises/${cruise_id}", payload: {}, as: OperationsManager, captures: { v3: $.data.version } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 4, expected_cruise_version: "${v3}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk4: $.data.id } }
            - { call: "GET /cruises/${cruise_id}", payload: {}, as: OperationsManager, captures: { v4: $.data.version } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 6, expected_cruise_version: "${v4}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk6: $.data.id } }
            - { call: "GET /cruises/${cruise_id}", payload: {}, as: OperationsManager, captures: { v6: $.data.version } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 10, expected_cruise_version: "${v6}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk10: $.data.id } }
          assert:
            - "Booking.${bk3}.booking_total_cents == 26700 (3*8900, 0%)"
            - "Booking.${bk4}.booking_total_cents == 33820 (35600*0.95)"
            - "Booking.${bk6}.booking_total_cents == 48060 (53400*0.90)"
            - "Booking.${bk10}.booking_total_cents == 75650 (89000*0.85)"

      - name: galley_provisional_input_set_excludes_cancelled
        claim_type: input_set_filtering
        grounds: ["calculations.galley_provisioning"]
        distinguishing_aspect: "Provisional covers count only RESERVED/CONFIRMED bookings with PENDING/PAID payment: a CANCELLED booking's party is excluded from a subsequently created order."
        test_recipe:
          setup: ["Cruise; bk_a party2 PAID; bk_b party3 created then cancelled before order placement"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 2, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "GET /cruises/${cruise_id}", payload: {}, as: OperationsManager, captures: { v2: $.data.version } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 3, expected_cruise_version: "${v2}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_b: $.data.id } }
            - { call: "POST /bookings/${bk_b}/cancel", payload: {}, as: Customer, as_user_id: "${cust_a}" }
          trigger:
            - { call: "POST /cruises/${cruise_id}/provision-orders", payload: {}, as: GalleyManager, captures: { order_id: $.data.id } }
          assert:
            - "GalleyProvisionOrder.${order_id}.provisional_covers == 2 (cancelled party-3 booking excluded)"
            - "GalleyProvisionOrder.${order_id}.provision_load_units == 5.0 (2 * 2.5)"

      - name: charter_quote_capacity_tier_boundaries
        claim_type: boundary_edge
        grounds: ["calculations.charter_quote"]
        distinguishing_aspect: "Charter base tiers at capacity boundaries: cap 49 -> SMALL 350000, cap 50 -> MEDIUM 620000, cap 100 -> LARGE 980000 (OFF season isolates base; quote on OFF cruise = base * 1.00)."
        test_recipe:
          setup: ["Three vessels at 49/50/100, three OFF-season cruises, three inquiries"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "V49", coast_guard_capacity: 49, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { v49: $.data.id } }
            - { call: "POST /vessels", payload: { name: "V50", coast_guard_capacity: 50, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { v50: $.data.id } }
            - { call: "POST /vessels", payload: { name: "V100", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { v100: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${v49}", menu_tier_id: "${tier_id}", depart_at: "2026-01-15T19:00:00Z", return_at: "2026-01-15T22:00:00Z" }, as: OperationsManager, captures: { cr49: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${v50}", menu_tier_id: "${tier_id}", depart_at: "2026-01-16T19:00:00Z", return_at: "2026-01-16T22:00:00Z" }, as: OperationsManager, captures: { cr50: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${v100}", menu_tier_id: "${tier_id}", depart_at: "2026-01-17T19:00:00Z", return_at: "2026-01-17T22:00:00Z" }, as: OperationsManager, captures: { cr100: $.data.id } }
            - { call: "POST /customers", payload: { email: "corp@x.com", full_name: "Corp" }, as: OperationsManager, captures: { cust_c: $.data.id } }
            - { call: "POST /charter-inquiries", payload: { cruise_id: "${cr49}", customer_id: "${cust_c}" }, as: CharterSalesAgent, captures: { iq49: $.data.id, iq49_v: $.data.version } }
            - { call: "POST /charter-inquiries", payload: { cruise_id: "${cr50}", customer_id: "${cust_c}" }, as: CharterSalesAgent, captures: { iq50: $.data.id, iq50_v: $.data.version } }
            - { call: "POST /charter-inquiries", payload: { cruise_id: "${cr100}", customer_id: "${cust_c}" }, as: CharterSalesAgent, captures: { iq100: $.data.id, iq100_v: $.data.version } }
          trigger:
            - { call: "POST /charter-inquiries/${iq49}/quote", payload: { expected_inquiry_version: "${iq49_v}" }, as: CharterSalesAgent }
            - { call: "POST /charter-inquiries/${iq50}/quote", payload: { expected_inquiry_version: "${iq50_v}" }, as: CharterSalesAgent }
            - { call: "POST /charter-inquiries/${iq100}/quote", payload: { expected_inquiry_version: "${iq100_v}" }, as: CharterSalesAgent }
          assert:
            - "CharterInquiry.${iq49}.quoted_total_cents == 350000 (cap 49 = SMALL)"
            - "CharterInquiry.${iq50}.quoted_total_cents == 620000 (cap 50 = MEDIUM)"
            - "CharterInquiry.${iq100}.quoted_total_cents == 980000 (cap 100 = LARGE)"

      - name: weather_credit_notice_tier_boundaries
        claim_type: boundary_edge
        grounds: ["calculations.weather_credit"]
        distinguishing_aspect: "Notice tiers: >=72h 100%, >=24h 75%, >=6h 50%, <6h 25%. Two identical bookings cancelled at exactly 72h (100%) and 5h (25%) diverge: 22250 vs 5563 (75% path covered in §1.8)."
        test_recipe:
          setup:
            - "Two cruises, each one PAID party2 booking (total 22250 PEAK non-holiday)"
            - "Cruise X departs 2026-08-10T19:00, clock 2026-08-07T19:00 -> exactly 72h"
            - "Cruise Y departs 2026-08-10T19:00, clock moved to 2026-08-10T14:00 -> 5h (set after X's cancel)"
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { crx: $.data.id, crx_v: $.data.version } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cry: $.data.id, cry_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${crx}/bookings", payload: { customer_id: "${cust_a}", party_size: 2, expected_cruise_version: "${crx_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bkx: $.data.id } }
            - { call: "POST /bookings/${bkx}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "POST /cruises/${cry}/bookings", payload: { customer_id: "${cust_a}", party_size: 2, expected_cruise_version: "${cry_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bky: $.data.id } }
            - { call: "POST /bookings/${bky}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T19:00:00Z" }, as: OperationsManager }
            - { call: "POST /weather-events", payload: { severity: "CANCELLATION_REQUIRED", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }, as: OperationsManager, captures: { wev: $.data.id } }
            - { call: "POST /cruises/${crx}/weather-cancel", payload: {}, as: OperationsManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:00:00Z" }, as: OperationsManager }
          trigger:
            - { call: "POST /cruises/${cry}/weather-cancel", payload: {}, as: OperationsManager }
          assert:
            - "CruiseCredit for Booking.${bkx}.amount_cents == 22250 (72h exactly -> 100%)"
            - "CruiseCredit for Booking.${bky}.amount_cents == 5563 (5h -> 25%: round_half_up(22250*0.25)=5563)"
            - "Booking.${bkx}.payment_status == REFUND_PENDING and Booking.${bky}.payment_status == REFUND_PENDING"

  # ===========================================================================
  # Section: validations — violation->error not covered by §1.8, satisfaction
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role fails priority-1 auth regardless of payload validity."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /docks"
              payload: { name: "Pier 9", parking_capacity: 10 }
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)"

      - name: weather_cancel_without_event_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_NO_ACTIVE_WEATHER_EVENT]"]
        distinguishing_aspect: "Weather-cancelling a cruise with no covering CANCELLATION_REQUIRED event fails ERR_NO_ACTIVE_WEATHER_EVENT."
        test_recipe:
          setup: ["Cruise SCHEDULED, no weather events declared"]
