            - { call: "POST /mutual-aid/timesheets", payload: { crew_id: "${crew_id}", work_date: "2026-05-04", day_classification: "WORK", reported_work_minutes: 600 }, as: CrewSupervisor, as_user_id: "${crew_id}", captures: { ts1_id: "$.data.id" } }
            - { call: "POST /mutual-aid/timesheets/${ts1_id}/submit", payload: { submitted_by_operator_ref: "SUP-1" }, as: CrewSupervisor, as_user_id: "${crew_id}" }
            - { call: "POST /mutual-aid/timesheets/${ts1_id}/certify", payload: { certifier_operator_ref: "HC-1" }, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/per-diem-claims", payload: { crew_id: "${crew_id}", claim_date: "2026-05-03", member_count: 1, meals_provided_count: 0, day_factor_type: "TRAVEL" }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { pd1_id: "$.data.id" } }
            - { call: "POST /mutual-aid/per-diem-claims/${pd1_id}/approve", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/events/${ev_id}/begin_demobilization", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/invoices", payload: { request_id: "${req_id}", rate_schedule_id: "${sch_id}", billing_period_start: "2026-05-01", billing_period_end: "2026-05-31" }, as: RespondingFinance, as_user_id: "${rsp_id}", captures: { inv_id: "$.data.id" } }
            - { call: "GET /mutual-aid/events/${ev_id}", payload: {}, as: ProgramAdmin, captures: { pre_invoiced: "$.data.total_invoiced_cents" } }
          trigger:
            - { call: "POST /mutual-aid/invoices/${inv_id}/submit", payload: {}, as: RespondingFinance, as_user_id: "${rsp_id}" }
            - { call: "GET /mutual-aid/events/${ev_id}", payload: {}, as: ProgramAdmin, captures: { mid_invoiced: "$.data.total_invoiced_cents" } }
            - { call: "POST /mutual-aid/invoices/${inv_id}/void", payload: {}, as: RespondingFinance, as_user_id: "${rsp_id}" }
            - { call: "GET /mutual-aid/events/${ev_id}", payload: {}, as: ProgramAdmin, captures: { post_invoiced: "$.data.total_invoiced_cents" } }
            - { call: "GET /mutual-aid/timesheets/${ts1_id}", payload: {}, as: ProgramAdmin, captures: { ts_billed: "$.data.billed_invoice_id" } }
          assert:
            - "Before submit: event.total_invoiced_cents == 0 (capture pre_invoiced)"
            - "After submit: event.total_invoiced_cents == 201866 (capture mid_invoiced)"
            - "After void: event.total_invoiced_cents == 0 == pre_invoiced (capture post_invoiced) — no drift"
            - "TimeSheet.${ts1_id}.billed_invoice_id == null after void (capture ts_billed)"
            - "Invoice.${inv_id}.status == VOID"



