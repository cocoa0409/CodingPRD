# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---------------------------------------------------------------
  - id: ERR_MISSING_AUTH_HEADER
    http: 401
    condition: "X-User-ID or X-User-Role is absent or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles, or an entity_backed role's X-User-ID is not an active StaffMember with the matching staff_role"
  - id: ERR_NOT_ASSIGNED_ADVOCATE
    http: 403
    condition: "a DonorAdvocate acts on a donor whose advocate_staff_id is a different staff member"
  - id: ERR_NOT_ASSIGNED_REVIEWER
    http: 403
    condition: "an EvaluationReviewer determines or resubmits an evaluation whose reviewer_staff_id is a different staff member"

  # --- request shape ------------------------------------------------------
  - id: ERR_VALIDATION
    http: 400
    condition: "a required input field is missing, an enum value is undeclared, a numeric value is out of range or of the wrong type, an interval has end before start, a required reason code is absent, lost_wage_days is missing for a LOST_WAGES claim, observed_survivor_count exceeds cohort_size, or limit/offset are outside [1,100] / [0,inf)"

  # --- existence ----------------------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "programId in the path or program_id in the body matches no TransplantProgram"
  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "a staff FK (advocate_staff_id, reviewer_staff_id, surgeon_staff_id, candidacy_approved_by_staff_id filter) matches no StaffMember"
  - id: ERR_RECIPIENT_NOT_FOUND
    http: 404
    condition: "recipientId or recipient_candidate_id or intended_recipient_id matches no RecipientCandidate"
  - id: ERR_DONOR_NOT_FOUND
    http: 404
    condition: "donorId or donor_candidate_id matches no DonorCandidate"
  - id: ERR_EVALUATION_NOT_FOUND
    http: 404
    condition: "evaluationId matches no DonorEvaluation"
  - id: ERR_CHAIN_NOT_FOUND
    http: 404
    condition: "chainId or exchange_chain_id matches no ExchangeChain"
  - id: ERR_SEGMENT_NOT_FOUND
    http: 404
    condition: "segmentId, chain_segment_id or predecessor_segment_id matches no ChainSegment"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "operating_room_id matches no OperatingRoom"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "bookingId matches no ProcedureBooking"
  - id: ERR_FOLLOW_UP_NOT_FOUND
    http: 404
    condition: "followUpId matches no DonorFollowUp"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "reviewId or program_outcome_review_id matches no ProgramOutcomeReview"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "planId matches no ImprovementPlan"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claimId matches no DonorCostClaim"

  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_CHAIN_VERSION
    http: 412
    condition: "expected_chain_version does not equal the ExchangeChain's current version on segment insertion"
  - id: ERR_STALE_REVIEW_VERSION
    http: 412
    condition: "expected_review_version does not equal the ProgramOutcomeReview's current version on improvement-plan creation"

  # --- state --------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition does not exist from the target's current state, including any attempt to act on a terminal state"
  - id: ERR_CHAIN_NOT_COMMITTED
    http: 409
    condition: "a segment offer, offer response or completion is attempted while the parent chain is not COMMITTED or EXECUTING"
  - id: ERR_REVIEW_NOT_FINALIZED
    http: 409
    condition: "an improvement plan is accepted or rejected while its review is still DRAFT"
  - id: ERR_CLAIM_NOT_ADJUDICATED
    http: 409
    condition: "a reversal targets a claim that is not ADJUDICATED"
  - id: ERR_BOOKING_NOT_ACTIVE
    http: 409
    condition: "a cancellation targets a booking that is already CANCELLED or COMPLETED"
  - id: ERR_FOLLOW_UP_TERMINAL
    http: 409
    condition: "a submission or waiver targets an already WAIVED follow-up"

  # --- compliance and safety ----------------------------------------------
  - id: ERR_STAFF_ROLE_INVALID
    http: 422
    condition: "a referenced staff member has the wrong staff_role for the position being filled (advocate, evaluation reviewer, surgeon) or is not is_active"
  - id: ERR_ADVOCATE_CONFLICT_OF_INTEREST
    http: 422
    condition: "the proposed advocate already advocates for a different donor candidate whose intended_recipient_id is the same as this donor's intended_recipient_id"
  - id: ERR_REVIEWER_SOD_CONFLICT
    http: 422
    condition: "the same staff member would review both the MEDICAL and the PSYCHOSOCIAL evaluation of one donor"
  - id: ERR_COOLING_OFF_NOT_ELAPSED
    http: 422
    condition: "advocate attestation is attempted before the current logical clock reaches cooling_off_ends_at"
  - id: ERR_CLEARANCE_INCOMPLETE
    http: 422
    condition: "advocate attestation is attempted while medical_status or psychosocial_status is not CLEARED"
  - id: ERR_HARD_EXCLUSION_PRESENT
    http: 422
    condition: "a CLEARED determination is attempted on an evaluation whose hard_exclusion_count is greater than 0"
  - id: ERR_PROGRAM_FROZEN
    http: 409
    condition: "a donor referral or a chain commitment is attempted while compliance_posture is FROZEN"
  - id: ERR_PROGRAM_RESTRICTED
    http: 409
    condition: "commitment of a chain with more than two segments is attempted while compliance_posture is RESTRICTED"

  # --- participant eligibility --------------------------------------------
  - id: ERR_DONOR_NOT_APPROVED
    http: 422
    condition: "a chain validation or commitment includes a donor whose overall_status is not APPROVED (CONDITIONAL_APPROVED included)"
  - id: ERR_RECIPIENT_NOT_ACTIVE
    http: 422
    condition: "a chain validation, commitment or offer involves a recipient whose listing_status is not ACTIVE"
  - id: ERR_DONOR_NOT_COMMITTED
    http: 422
    condition: "an offer is sent for a segment whose donor is not CHAIN_COMMITTED"
  - id: ERR_DONOR_NOT_DONATED
    http: 422
    condition: "a donor cost claim is filed or adjudicated for a donor whose overall_status is not DONATED"
  - id: ERR_CROSS_PROGRAM_REFERENCE
    http: 422
    condition: "two or more FKs in one request resolve to different TransplantProgram rows"

  # --- chain topology -----------------------------------------------------
  - id: ERR_CHAIN_TOO_SHORT
    http: 422
    condition: "validation of a chain with fewer than two non-WITHDRAWN segments"
  - id: ERR_CHAIN_POSITIONS_NOT_CONTIGUOUS
    http: 422
    condition: "the chain's non-WITHDRAWN segment positions are not exactly 1..segment_count"
  - id: ERR_CHAIN_LINKAGE_BROKEN
    http: 422
    condition: "a segment's predecessor_segment_id is not the chain's segment at the previous position, or the first segment declares a predecessor"
  - id: ERR_DUPLICATE_PARTICIPANT
    http: 422
    condition: "the same donor or the same recipient appears on two non-WITHDRAWN segments of one chain"
  - id: ERR_ABO_INCOMPATIBLE
    http: 422
    condition: "a segment pairs a donor blood type with a recipient blood type outside the compatibility table"
  - id: ERR_LOOP_NOT_CLOSED
    http: 422
    condition: "a PAIRED_LOOP chain does not close back to the first donor's intended recipient"
  - id: ERR_NDD_START_INVALID
    http: 422
    condition: "an NDD_CHAIN does not start with a non-directed donor, or closes into a loop"

  # --- uniqueness ---------------------------------------------------------
  - id: ERR_DUPLICATE_CENTER_CODE
    http: 409
    condition: "center_code already belongs to another TransplantProgram"
  - id: ERR_DUPLICATE_NPI
    http: 409
    condition: "npi already belongs to another StaffMember of the same program"
  - id: ERR_DUPLICATE_ROOM_CODE
    http: 409
    condition: "room_code already belongs to another OperatingRoom of the same program"
  - id: ERR_POSITION_TAKEN
    http: 409
    condition: "a non-WITHDRAWN segment already occupies the requested position in the chain"
  - id: ERR_DUPLICATE_OPEN_EVALUATION
    http: 409
    condition: "the donor already has a SUBMITTED evaluation in the same domain"
  - id: ERR_DUPLICATE_REVIEW_PERIOD
    http: 409
    condition: "finalizing a review whose program already has a FINALIZED review for the identical period"

  # --- temporal and scheduling --------------------------------------------
  - id: ERR_OR_SLOT_CONFLICT
    http: 409
    condition: "the requested room window overlaps an ACTIVE booking once each side is padded by turnover_buffer_minutes"
  - id: ERR_SURGEON_DOUBLE_BOOKED
    http: 409
    condition: "the requested window touches or overlaps another ACTIVE booking of the same surgeon in any room (closed intervals, no buffer)"
  - id: ERR_DONOR_BOOKING_MISSING
    http: 422
    condition: "no ACTIVE DONOR_RECOVERY booking of the segment contains planned_cross_clamp_at"
  - id: ERR_IMPLANT_BOOKING_MISSING
    http: 422
    condition: "no ACTIVE RECIPIENT_IMPLANT booking exists for the segment being completed"
  - id: ERR_PREDECESSOR_TIMING_INVALID
    http: 422
    condition: "planned_cross_clamp_at is earlier than the predecessor segment's planned_reperfusion_at"
  - id: ERR_OFFER_WINDOW_EXPIRED
    http: 422
    condition: "an offer response arrives after offer_response_deadline_at"
  - id: ERR_FOLLOW_UP_NOT_DUE
    http: 422
    condition: "a follow-up submission arrives before the interval's due_on"
  - id: ERR_EFFECTIVE_AT_OUT_OF_ORDER
    http: 422
    condition: "a waitlist status update's effective_at precedes the candidate's latest event or lies in the future of the logical clock"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "POST /_clock/set_current_utc would move the logical clock backwards"

  # --- aggregate budgets and fiscal ---------------------------------------
  - id: ERR_CIT_LIMIT_EXCEEDED
    http: 422
    condition: "a segment's planned_cit_minutes exceeds MAX_CIT_MINUTES"
  - id: ERR_CHAIN_CIT_BUDGET_EXCEEDED
    http: 422
    condition: "the chain's offered/accepted/transplanted segments plus this offer exceed CHAIN_CIT_BUDGET_MINUTES"
  - id: ERR_PLAN_NOT_REQUIRED
    http: 422
    condition: "an improvement plan is filed against a review whose flag_level is NONE"
  - id: ERR_DONOR_LIFETIME_CAP_REACHED
    http: 422
    condition: "adjudication is attempted when the donor's ADJUDICATED total already equals DONOR_LIFETIME_CAP_CENTS"

# =============================================================================
# 1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Center administration: program configuration, staffing, rooms, advocate assignment, follow-up waivers, improvement-plan decisions and the logical clock. Deliberately CANNOT file the improvement plan it decides on."
    identity: opaque
    exclusive_operations:
      - "POST /programs"
      - "POST /staff-members"
      - "POST /operating-rooms"
      - "POST /donor-candidates/{id}/advocate-assignment"
      - "POST /donor-follow-ups/{id}/waiver"
      - "POST /improvement-plans/{id}/transitions"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /programs/{id}/compliance-sweep (with QualityOfficer)"
      - "every GET endpoint"

  - name: TransplantCoordinator
    description: "Clinical operations: candidacy and waitlist, donor referral, chain construction, offers, logistics bookings, follow-up submissions and cost-claim filing. Its referral of a donor bars it from advocating for that donor, and it cannot adjudicate the claims it files."
    identity: "entity_backed:StaffMember"
    entity_constraint: "X-User-ID is the id of a StaffMember with staff_role == TRANSPLANT_COORDINATOR and is_active == true"
    exclusive_operations:
      - "POST /recipient-candidates"
      - "POST /recipient-candidates/{id}/status-updates"
      - "POST /donor-candidates"
      - "POST /exchange-chains"
      - "POST /exchange-chains/{id}/segments"
      - "POST /exchange-chains/{id}/validation"
      - "POST /exchange-chains/{id}/commitment"
      - "POST /exchange-chains/{id}/break"
      - "POST /chain-segments/{id}/offer"
      - "POST /chain-segments/{id}/offer-response"
      - "POST /chain-segments/{id}/transplant-completion"
      - "POST /procedure-bookings"
      - "POST /procedure-bookings/{id}/cancellation"
      - "POST /donor-follow-ups/{id}/submission"
      - "POST /donor-cost-claims"
    shared_operations:
      - "every GET endpoint"

  - name: DonorAdvocate
    description: "Independent living donor advocate: runs the informed-consent disclosure and issues the attestation or objection. Acts only on the donor it is assigned to, and may never be that donor's referrer or the approver of the paired recipient."
    identity: "entity_backed:StaffMember"
    entity_constraint: "X-User-ID is the id of a StaffMember with staff_role == LIVING_DONOR_ADVOCATE and is_active == true, and equals the target donor's advocate_staff_id"
    exclusive_operations:
      - "POST /donor-candidates/{id}/consent-disclosure"
      - "POST /donor-candidates/{id}/advocacy-determination"
    shared_operations:
      - "every GET endpoint"

  - name: EvaluationReviewer
    description: "Medical or psychosocial evaluator: submits findings, determines outcomes and resubmits deferred evaluations. The same reviewer cannot cover both domains for one donor."
    identity: "entity_backed:StaffMember"
    entity_constraint: "X-User-ID is the id of a StaffMember with staff_role == EVALUATION_REVIEWER and is_active == true, and equals the target evaluation's reviewer_staff_id"
    exclusive_operations:
      - "POST /donor-evaluations"
      - "POST /donor-evaluations/{id}/determination"
      - "POST /donor-evaluations/{id}/resubmission"
    shared_operations:
      - "every GET endpoint"

  - name: QualityOfficer
    description: "Outcome monitoring: creates and finalizes outcome reviews and files improvement plans. Cannot decide on its own plans - that power sits with ProgramAdmin."
    identity: "entity_backed:StaffMember"
    entity_constraint: "X-User-ID is the id of a StaffMember with staff_role == QUALITY_OFFICER and is_active == true"
    exclusive_operations:
      - "POST /outcome-reviews"
      - "POST /outcome-reviews/{id}/finalization"
      - "POST /improvement-plans"
    shared_operations:
      - "POST /programs/{id}/compliance-sweep (with ProgramAdmin)"
      - "every GET endpoint"

  - name: FinanceAdmin
    description: "Donor cost coverage: adjudicates and reverses claims against insurance, grant and program-fund buckets. Cannot file claims, and cannot touch any clinical state."
    identity: opaque
    exclusive_operations:
      - "POST /donor-cost-claims/{id}/adjudication"
      - "POST /donor-cost-claims/{id}/reversal"
    shared_operations:
      - "every GET endpoint"
