              captures: { pax: $.data.id }
          trigger:
            - call: "GET /passengers/${pax}"
              payload: {}
              as: Passenger
              captures: { err: $.data.error_id }
          assert:
            - "With no X-User-Role/X-User-ID headers, response data.error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_passenger_version_on_second_application
        claim_type: stale_version
        grounds: ["concurrency_rules[application-create-stale-passenger]", "errors[ERR_STALE_PASSENGER_VERSION]"]
        distinguishing_aspect: "After a first application create advances Passenger.version to 2, a second create still carrying expected_passenger_version==1 is rejected with ERR_STALE_PASSENGER_VERSION (412)."
        test_recipe:
          setup: ["Clock 2026-03-01. Passenger (version 1). One application already created (advances version to 2)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /passengers"
              payload: { email: "occ@x.com", full_name: "Occ", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id, pv0: $.data.version }
            - call: "POST /reduced-fare-applications"
              payload: { passenger_id: "${pax}", category: "STUDENT", proof_document_ref: "d1", proof_expires_at: "2027-01-01T00:00:00Z", expected_passenger_version: "${pv0}" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { app1: $.data.id }
          trigger:
            - call: "POST /reduced-fare-applications"
              payload: { passenger_id: "${pax}", category: "STUDENT", proof_document_ref: "d2", proof_expires_at: "2027-01-01T00:00:00Z", expected_passenger_version: "${pv0}" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_STALE_PASSENGER_VERSION"
            - "HTTP status == 412"

      - name: occ_fresh_version_supersedes_prior_application
        claim_type: version_success
        grounds: ["concurrency_rules[application-create-stale-passenger]", state_machines.ReducedFareApplication.SUBMITTED_to_SUPERSEDED]
        distinguishing_aspect: "A second application create carrying the current Passenger.version succeeds, and the prior SUBMITTED application transitions to SUPERSEDED."
        test_recipe:
          setup: ["Clock 2026-03-01. Passenger (version 1). One SUBMITTED application (advances version to 2). Client re-reads version via GET /passengers."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /passengers"
              payload: { email: "occ2@x.com", full_name: "Occ2", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id, pv0: $.data.version }
            - call: "POST /reduced-fare-applications"
              payload: { passenger_id: "${pax}", category: "STUDENT", proof_document_ref: "d1", proof_expires_at: "2027-01-01T00:00:00Z", expected_passenger_version: "${pv0}" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { app1: $.data.id }
            - call: "GET /passengers/${pax}"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /reduced-fare-applications"
              payload: { passenger_id: "${pax}", category: "DISABILITY", proof_document_ref: "d2", proof_expires_at: "2027-01-01T00:00:00Z", expected_passenger_version: "${pv1}" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { app2: $.data.id }
          assert:
            - "ReducedFareApplication.${app2}.status == SUBMITTED"
            - "ReducedFareApplication.${app1}.status == SUPERSEDED"

      - name: wallet_debit_on_purchase_reconciles_balance
        claim_type: derived_field_reconciliation
        grounds: [entities.Passenger.wallet_credit_cents, entities.Ticket.wallet_applied_cents]
        distinguishing_aspect: "A passenger with wallet 1100 (from a prior full WALLET refund) who spends 500 wallet on a new purchase ends at wallet 600, and the new ticket records wallet_applied_cents==500."
        test_recipe:
          setup: ["Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger buys ticket A (1300), refunds A to WALLET (wallet 1100), then buys ticket B applying 500 wallet."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "wd@x.com", full_name: "Wd", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt_a: $.data.id }
            - call: "POST /refund-requests"
              payload: { ticket_id: "${tkt_a}", reason: "x", refund_destination: "WALLET" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { rr: $.data.id }
            - call: "POST /refund-requests/${rr}/approve"
              payload: {}
              as: FareAdmin
          trigger:
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK", wallet_apply_cents: 500 }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt_b: $.data.id }
          assert:
            - "Ticket.${tkt_b}.wallet_applied_cents == 500"
            - "Ticket.${tkt_b}.purchase_price_cents == 1300"
            - "Passenger.${pax}.wallet_credit_cents == 600"

