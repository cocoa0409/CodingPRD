        grounds: ["errors[ERR_INVALID_PAGINATION]", "validations[priority=54]", response_envelope.pagination_defaults]
        distinguishing_aspect: "Both ends of the limit range and the sign of the offset are enforced on the same list endpoint: limit=0, limit=101 and offset=-1 each return ERR_INVALID_PAGINATION, while limit=100 with offset=0 is accepted — so the bound is 1..100 inclusive, not 1..100 exclusive."
        test_recipe:
          setup: ["One OPEN site hosts one UNCERTIFIED mentor. The logical clock is at its startup default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
