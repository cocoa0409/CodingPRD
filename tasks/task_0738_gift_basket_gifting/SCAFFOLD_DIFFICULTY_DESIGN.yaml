              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /assembly-stations"
              payload: { name: "Station L", daily_capacity: 1000 }
              as: PlatformAdmin
              captures: { station_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/branding-profiles"
              payload: { name: "Unreviewed Kit", logo_url: "https://cdn.example/lambda.png", accent_color: "#445566", card_stock: "GLOSS", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { branding_id: $.data.id }
            - call: "GET /corporate-accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { acct_v_after_branding: $.data.version }
            - call: "POST /corporate-accounts/${acct_id}/orders"
