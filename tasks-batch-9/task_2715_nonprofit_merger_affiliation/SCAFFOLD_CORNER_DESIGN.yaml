          - validations.priority_4_ERR_ORGANIZATION_NOT_FOUND
          - validations.priority_23_ERR_SELF_RESTRUCTURING
        distinguishing_aspect: "The topology is flat, so both party references are body foreign keys checked independently: an unknown target_org_id fails at priority 4 even though initiator_org_id resolves, and the same organization on both sides fails at priority 23 rather than at priority 4."
