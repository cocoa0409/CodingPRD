scaffold_difficulty_design:

  # =====================================================================================
  # RULE 1 - dual_variant_calc
  # =====================================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: admin_fee_reported_versus_audited_rounding_only_divergence
        grounds:
          - calculations.admin_fee_assessment
          - calculations.report_period_sweep
          - state_machines.UsageReport.status.SUBMITTED_to_ACCEPTED
          - state_machines.UsageReport.status.ACCEPTED_to_RECONCILED
          - entities.UsageReport.fields.reported_fee_cents
          - entities.UsageReport.fields.audited_fee_cents
          - entities.UsageReport.fields.fee_true_up_cents
          - entities.UsageReport.fields.variance_pct
        distinguishing_aspect: |
          Both variants run on the SAME three swept usages with NO tier rebate anywhere
          (every usage sits in discount tier 0 at effective_fee_rate_bps 200), so the only
          cause of divergence is the rounding granularity: REPORTED rounds once over the
          27045-cent aggregate and yields 541, AUDITED sums three individually rounded
          180-cent fees and yields 540, producing fee_true_up_cents == -1.
        test_recipe:
          setup:
            - "StateLawRule rows exist for TX and CA."
            - "Supplier Acme (TX) is QUALIFIED and holds ACTIVE contract COOP-MC-2026-001 at admin_fee_rate_bps 200 with line JAN-LINER-045 priced 9015 cents."
            - "MemberAgency Riverside (CA, K12_DISTRICT) is ACTIVE with committed_spend_cents 0, so every usage prices in discount tier 0."
            - "Three ContractUsage rows of quantity 1 on JAN-LINER-045 are CONFIRMED, each with chargeable_base_cents 9015 and admin_fee_cents 180."
            - "A UsageReport covers the CLOSED period 2026-09-01T00:00:00Z .. 2026-09-30T23:59:59Z and the logical clock has passed period_end."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CoopAdministrator
            - call: "POST /coop/state-law-rules"
              payload: { state_code: "TX", piggyback_doctrine: "STATUTORY_STRICT", min_notice_days: 14, requires_lead_agency_in_state: false, allows_nonprofit_participation: true, max_contract_term_months: 60, requires_local_solicitation_waiver: false, reciprocity_state_codes: [] }
              as: CoopAdministrator
            - call: "POST /coop/state-law-rules"
              payload: { state_code: "CA", piggyback_doctrine: "STATUTORY_STRICT", min_notice_days: 21, requires_lead_agency_in_state: true, allows_nonprofit_participation: true, max_contract_term_months: 60, requires_local_solicitation_waiver: false, reciprocity_state_codes: [] }
              as: CoopAdministrator
            - call: "POST /coop/suppliers"
              payload: { legal_name: "Acme Facility Supply LLC", home_state_code: "TX" }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { sup_a_id: $.data.id }
            - call: "POST /coop/suppliers/${sup_a_id}/qualification"
              payload: { action: "QUALIFY" }
              as: CoopAdministrator
              as_user_id: "adm-review-02"
            - call: "POST /coop/suppliers"
              payload: { legal_name: "Bright Path Janitorial Inc", home_state_code: "CA" }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { sup_b_id: $.data.id }
            - call: "POST /coop/suppliers/${sup_b_id}/qualification"
              payload: { action: "QUALIFY" }
              as: CoopAdministrator
              as_user_id: "adm-review-02"
            - call: "POST /coop/solicitations"
              payload: { title: "Janitorial Supplies and Equipment", solicitation_number: "COOP-2026-001", lead_agency_name: "Travis County Purchasing", lead_agency_state_code: "TX", response_due_at: "2026-06-22T00:00:00Z", technical_weight_pct: 60.00, price_weight_pct: 40.00, specification_document_ref: "SPEC-COOP-2026-001", method_justification_ref: "METH-COOP-2026-001" }
              as: LeadAgencyOfficer
              as_user_id: "lao-conductor-01"
              captures: { sol_id: $.data.id }
            - call: "POST /coop/solicitations/${sol_id}/lifecycle"
              payload: { action: "POST_NOTICE" }
              as: LeadAgencyOfficer
              as_user_id: "lao-conductor-01"
            - call: "POST /coop/solicitation-responses"
              payload: { solicitation_id: "${sol_id}", supplier_id: "${sup_a_id}", proposed_annual_value_cents: 1000000 }
              as: SupplierRepresentative
              as_user_id: "${sup_a_id}"
              captures: { resp_a_id: $.data.id }
            - call: "POST /coop/solicitation-responses"
              payload: { solicitation_id: "${sol_id}", supplier_id: "${sup_b_id}", proposed_annual_value_cents: 1250000 }
              as: SupplierRepresentative
              as_user_id: "${sup_b_id}"
              captures: { resp_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-23T00:00:00Z" }
              as: CoopAdministrator
            - call: "POST /coop/solicitations/${sol_id}/lifecycle"
              payload: { action: "OPEN_EVALUATION" }
              as: LeadAgencyOfficer
              as_user_id: "lao-conductor-01"
            - call: "POST /coop/solicitation-responses/${resp_a_id}/review"
