  # ===========================================================================
  # RULE 8 — Resource/temporal overlap under two OPPOSITE interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: license_coverage_half_open_overlap_touching_allowed
        grounds:
          - validations.priority_35
          - validations.priority_4
          - errors.ERR_LICENSE_COVERAGE_OVERLAP
          - errors.ERR_INVALID_DATE_RANGE
          - entities.MerchantLicense.fields.expires_on
          - endpoints.POST_/merchants/{id}/licenses
        distinguishing_aspect: |
          RESOURCE: a MerchantLicense coverage interval, contended per
          (merchant_id, trade_type, state_code). INTERVAL SEMANTICS: HALF-OPEN
          [effective_from, expires_on) — two intervals conflict only when
