scaffold_difficulty_design:
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_return_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=18]
          - calculations.mileage_true_up_settlement
          - state_machines.CarAssignment.ACTIVE_to_COMPLETED
          - entities.CarReturn.fields.mileage_overage_cents
          - entities.LeaseFleetCar.fields.status
        distinguishing_aspect: |
          A second POST /api/v1/car-returns against a placement already closed by its
          first return violates two validations at the same time: priority 5 (category
          `state`, ERR_INVALID_STATE — CarAssignment.status is COMPLETED, not ACTIVE) and
          priority 18 (category `business_fiscal`, ERR_CREDIT_LIMIT_EXCEEDED — the
          lessee's outstanding_balance_cents of 60000 plus the return's projected charge
          exceeds the 60000 credit ceiling). The lower priority number wins, so the
          response is ERR_INVALID_STATE / 409 and never ERR_CREDIT_LIMIT_EXCEEDED / 402.
          This is the `state` vs `business_fiscal` error-category pair.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty DB."
            - "A RETAINED order for 1 car of a fresh car type is component-reserved, released, changed over and completed on 2026-09-03, producing one LeaseFleetCar in status HELD with built_date 2026-09-03."
            - "A NET lease contract (term 2026-09-01..2027-09-01, fleet_car_cap 10) is ACTIVE for a lessee whose credit_ceiling_cents is 60000 and whose outstanding_balance_cents starts at 0."
            - "The car is placed 2026-09-05..2026-10-05 with mileage_allowance 0, then returned with mileage_since_last 5000: blocks = ceil(30/30) = 1, included_miles = 1 * 0 = 0, overage = max(0, 5000 - 0) = 5000, mileage_overage_cents = 5000 * 12 = 60000 — exactly at the 60000 ceiling, which passes."
            - "That first return is settled, so Lessee.outstanding_balance_cents = 60000 and the placement is COMPLETED; the car is UNDER_REPAIR."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "PRI-RET-100", car_class: "GONDOLA", build_hours: 1, regulatory_life_years: 25, line_count_family: "PRI_RET_LINE" }
              as: ProductionPlanner
              captures: { ct_id: "$.data.id" }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 1, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: "$.data.id" }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/PRI-L1/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-02", scheduled_end_date: "2026-09-03" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-03" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_id}"
              as: PlatformAdmin
              captures: { car_id: "$.data[0].id" }
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Priority Pair Rail Co", credit_tier: "B", utilization_threshold_pct: 50, credit_ceiling_cents: 60000 }
              as: LeaseAdministrator
              captures: { lessee_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "NET", per_diem_rate_cents: 1000, liability_bearer: "LESSEE", term_start_date: "2026-09-01", term_end_date: "2027-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_id}", lease_contract_id: "${lc_id}", lessee_id: "${lessee_id}", start_date: "2026-09-05", end_date: "2026-10-05", mileage_allowance: 0 }
              as: LeaseAdministrator
              captures: { asg_id: "$.data.id" }
            - call: "POST /api/v1/car-returns"
              payload: { lease_fleet_car_id: "${car_id}", car_assignment_id: "${asg_id}", return_date: "2026-10-05", mileage_since_last: 5000, condition_grade: "A" }
              as: LeaseAdministrator
              captures: { ret1: "$.data.id" }
            - call: "POST /api/v1/car-returns/${ret1}/settle"
              payload: {}
              as: PortfolioManager
          trigger:
            - call: "POST /api/v1/car-returns"
              payload: { lease_fleet_car_id: "${car_id}", car_assignment_id: "${asg_id}", return_date: "2026-10-06", mileage_since_last: 100, condition_grade: "A" }
              as: LeaseAdministrator
              captures: { err2: "$.data.error_id" }
            - call: "GET /api/v1/lessees/${lessee_id}/outstanding-balance"
              as: PlatformAdmin
              captures: { bal: "$.data.outstanding_balance_cents" }
            - call: "GET /api/v1/car-assignments/${asg_id}"
              as: PlatformAdmin
              captures: { asg_status: "$.data.status" }
          assert:
            - "Dual failure is live: the second POST /api/v1/car-returns violates priority 5 (category state, ERR_INVALID_STATE — assignment is COMPLETED) and priority 18 (category business_fiscal, ERR_CREDIT_LIMIT_EXCEEDED — 60000 balance plus a projected charge > 0 against a 60000 ceiling)"
            - "Lower priority number wins: response error_id ${err2} == ERR_INVALID_STATE with http_status == 409, never ERR_CREDIT_LIMIT_EXCEEDED (402)"
            - "First return ${ret1}: CarReturn.mileage_overage_cents == 60000 (blocks = ceil(30/30) = 1, included_miles = 1 * 0 = 0, overage = 5000 miles * 12 cents)"
            - "Lessee ${lessee_id}: outstanding_balance_cents == ${bal} == 60000, unchanged by the rejected return — the business_fiscal charge never accrues because priority 5 short-circuits"
            - "CarAssignment ${asg_id}: status == ${asg_status} == COMPLETED, unchanged by the rejected return"

      - name: business_safety_vs_business_referential_placement_conflict
        grounds:
          - validations[priority=8]
          - validations[priority=21]
          - entities.LeaseFleetCar.fields.regulatory_life_end_date
          - entities.LeaseFleetCar.fields.status
          - state_machines.LeaseFleetCar.HELD_to_ASSIGNED
          - calculations.scrape_or_retrofit_decision
        distinguishing_aspect: |
          A second POST /api/v1/car-assignments for a car that is still ASSIGNED and whose
          regulatory_life_end_date (2036-09-03) is one day before the operation date
          (2036-09-04) violates two validations at the same time: priority 8 (category
          `business_safety`, ERR_REGULATORY_LIFE_EXCEEDED) and priority 21 (category
          `business_referential`, ERR_CAR_NOT_HELD). The lower priority number wins, so the
          response is ERR_REGULATORY_LIFE_EXCEEDED / 422 and never ERR_CAR_NOT_HELD / 409.
          This is the `business_safety` vs `business_referential` pair — two different
          business_* categories, distinct from the state/business_fiscal pair above.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty DB."
            - "A RETAINED order for 1 car of a car type with regulatory_life_years 10 is component-reserved, released, changed over and completed on 2026-09-03, producing one LeaseFleetCar in status HELD whose derived regulatory_life_end_date is 2036-09-03."
            - "A FULL_SERVICE contract (term 2026-09-01..2037-09-01, fleet_car_cap 10) is ACTIVE, and the car is placed 2026-09-05..2026-10-05, so its status is ASSIGNED and no longer HELD."
            - "The logical clock then advances to 2036-09-04, exactly one day past the car's regulatory_life_end_date of 2036-09-03, so the car may only be scrapped."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "PRI-LIFE-100", car_class: "TANK", build_hours: 1, regulatory_life_years: 10, line_count_family: "PRI_LIFE_LINE" }
              as: ProductionPlanner
              captures: { ct_life_id: "$.data.id" }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_life_id}", quantity: 1, planned_shop_days: 1, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_life_id: "$.data.id" }
            - call: "POST /api/v1/production-orders/${po_life_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_life_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/PRI-L1/changeover"
              payload: { production_order_id: "${po_life_id}", scheduled_start_date: "2026-09-02", scheduled_end_date: "2026-09-03" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_life_id}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-03" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_life_id}"
              as: PlatformAdmin
              captures: { car_life_id: "$.data[0].id" }
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Regulatory Life Rail Co", credit_tier: "A", utilization_threshold_pct: 60, credit_ceiling_cents: 50000000 }
              as: LeaseAdministrator
              captures: { lessee_life_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_life_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 2000, liability_bearer: "LESSOR", term_start_date: "2026-09-01", term_end_date: "2037-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_life_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts/${lc_life_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_life_id}", lease_contract_id: "${lc_life_id}", lessee_id: "${lessee_life_id}", start_date: "2026-09-05", end_date: "2026-10-05", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { asg_life_id: "$.data.id" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2036-09-04T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_life_id}", lease_contract_id: "${lc_life_id}", lessee_id: "${lessee_life_id}", start_date: "2036-09-10", end_date: "2036-10-10", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { err_life: "$.data.error_id" }
            - call: "GET /api/v1/lease-fleet-cars/${car_life_id}"
              as: PlatformAdmin
              captures: { car_status: "$.data.status", life_end: "$.data.regulatory_life_end_date" }
            - call: "GET /api/v1/car-assignments?lease_fleet_car_id=${car_life_id}"
              as: PlatformAdmin
              captures: { asg_first: "$.data[0].id" }
          assert:
            - "Dual failure is live: the second POST /api/v1/car-assignments violates priority 8 (category business_safety, ERR_REGULATORY_LIFE_EXCEEDED — regulatory_life_end_date 2036-09-03 is before the operation date 2036-09-04) and priority 21 (category business_referential, ERR_CAR_NOT_HELD — the car is ASSIGNED, not HELD)"
            - "Lower priority number wins: response error_id ${err_life} == ERR_REGULATORY_LIFE_EXCEEDED with http_status == 422, never ERR_CAR_NOT_HELD (409)"
            - "LeaseFleetCar ${car_life_id}: status == ${car_status} == ASSIGNED, so the priority-21 violation was genuinely live at call time"
            - "LeaseFleetCar ${car_life_id}: regulatory_life_end_date == ${life_end} == 2036-09-03, exactly one day before the clock date 2036-09-04"
            - "No second placement was written: GET /api/v1/car-assignments?lease_fleet_car_id=${car_life_id} lists ${asg_first} (the original 2026-09-05 placement) as its only row"

  - rule_id: boundary_precision_check
    instances:
      - name: boundary_mileage_allowance_exact_vs_one_mile_over
        grounds:
          - calculations.mileage_true_up_settlement
          - entities.CarAssignment.fields.mileage_allowance
          - entities.CarAssignment.fields.mileage_used
          - entities.CarReturn.fields.mileage_overage_cents
          - state_machines.CarAssignment.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Two 30-day placements carrying the same 1000-mile allowance straddle the
          max(0, mileage_used - included_miles) clamp exactly: the return at mileage_used
          1000 == included_miles 1000 records mileage_overage_cents 0, while the return at
          mileage_used 1001 records exactly 12. The boundary metric is miles-over-allowance
          (blocks = ceil(30/30) = 1, included_miles = 1 * 1000), reached through
          POST /api/v1/car-returns — a zero-edge on the overage clamp, on a different metric
          and a different endpoint from the stock-count threshold of the sibling instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty DB."
            - "Two RETAINED orders of 1 car each are taken on 2026-09-01 for a car type with build_hours 1 and regulatory_life_years 20; both are component-reserved and released, then changed over on disjoint one-day windows (2026-09-02..2026-09-03 and 2026-09-04..2026-09-05) and completed, producing two HELD LeaseFleetCars."
            - "One ACTIVE FULL_SERVICE contract (term 2026-09-01..2027-09-01, fleet_car_cap 10) covers both cars."
            - "Each car is placed for exactly 30 days, 2026-09-05..2026-10-05, with mileage_allowance 1000, so blocks = ceil(30/30) = 1 and included_miles = 1 * 1000 = 1000 for both."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "MILE-100", car_class: "HOPPER", build_hours: 1, regulatory_life_years: 20, line_count_family: "MILE_LINE" }
              as: ProductionPlanner
              captures: { ct_mile_id: "$.data.id" }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_mile_id}", quantity: 1, planned_shop_days: 1, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_a: "$.data.id" }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_mile_id}", quantity: 1, planned_shop_days: 1, disposition: "RETAINED", priority_rank: 2, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_b: "$.data.id" }
            - call: "POST /api/v1/production-orders/${po_a}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_a}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_b}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_b}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/MILE-L1/changeover"
              payload: { production_order_id: "${po_a}", scheduled_start_date: "2026-09-02", scheduled_end_date: "2026-09-03" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_a}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-03" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_a}"
              as: PlatformAdmin
              captures: { car_a: "$.data[0].id" }
            - call: "POST /api/v1/production-lines/MILE-L2/changeover"
              payload: { production_order_id: "${po_b}", scheduled_start_date: "2026-09-04", scheduled_end_date: "2026-09-05" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_b}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-05" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_b}"
              as: PlatformAdmin
              captures: { car_b: "$.data[0].id" }
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Boundary Mileage Rail Co", credit_tier: "A", utilization_threshold_pct: 70, credit_ceiling_cents: 50000000 }
              as: LeaseAdministrator
              captures: { lessee_mile_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_mile_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 1500, liability_bearer: "LESSOR", term_start_date: "2026-09-01", term_end_date: "2027-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_mile_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts/${lc_mile_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_a}", lease_contract_id: "${lc_mile_id}", lessee_id: "${lessee_mile_id}", start_date: "2026-09-05", end_date: "2026-10-05", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { asg_a: "$.data.id" }
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_b}", lease_contract_id: "${lc_mile_id}", lessee_id: "${lessee_mile_id}", start_date: "2026-09-05", end_date: "2026-10-05", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { asg_b: "$.data.id" }
          trigger:
            - call: "POST /api/v1/car-returns"
              payload: { lease_fleet_car_id: "${car_a}", car_assignment_id: "${asg_a}", return_date: "2026-10-05", mileage_since_last: 1000, condition_grade: "A" }
              as: LeaseAdministrator
              captures: { ret_a: "$.data.id", over_a: "$.data.mileage_overage_cents" }
            - call: "POST /api/v1/car-returns"
              payload: { lease_fleet_car_id: "${car_b}", car_assignment_id: "${asg_b}", return_date: "2026-10-05", mileage_since_last: 1001, condition_grade: "A" }
              as: LeaseAdministrator
              captures: { ret_b: "$.data.id", over_b: "$.data.mileage_overage_cents" }
          assert:
            - "Exactly at the allowance: CarReturn ${ret_a}.mileage_overage_cents == ${over_a} == 0 (blocks = ceil(30/30) = 1, included_miles = 1 * 1000 = 1000, mileage_used 1000 - 1000 = 0 overage miles, max(0, 0) * 12 == 0)"
            - "One mile past the allowance: CarReturn ${ret_b}.mileage_overage_cents == ${over_b} == 12 (mileage_used 1001 - included_miles 1000 = 1 overage mile * 12 cents)"
            - "The comparison is inclusive, not strict: mileage_used == included_miles charges exactly 0 cents while one extra mile charges exactly 12 cents, so the true-up uses mileage_used <= included_miles rather than mileage_used < included_miles"
            - "Both returns were accepted and are distinct rows (${ret_a} != ${ret_b}), so the only difference between the two scenarios is the one-mile crossing of the allowance"

      - name: boundary_component_stock_exact_vs_one_short
        grounds:
          - validations[priority=13]
          - entities.Component.fields.on_hand_qty
          - entities.CarTypeComponentRequirement.fields.qty_per_car
          - state_machines.ProductionOrder.DRAFT_to_COMPONENT_RESERVED
          - calculations.component_allocation
        distinguishing_aspect: |
          Two otherwise identical 5-car reservations that each consume 2 wheelsets per car
          (required = 2 * 5 = 10) turn on the >= in Component.on_hand_qty >= effective
          qty_per_car * production_order.quantity: on_hand_qty exactly 10 commits the stock
          and moves the order to COMPONENT_RESERVED, while on_hand_qty 9 is rejected with
          ERR_COMPONENT_SHORTAGE. The boundary metric is stock units against a
          bill-of-materials requirement, reached through
          POST /api/v1/production-orders/{id}/reserve-components — a different metric and a
          different endpoint from the mileage-overage zero edge of the sibling instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty DB."
            - "Two car types each carry one WHEELSET bill-of-material row with qty_per_car 2; their wheelset components have lead_time_days 10, so the gated lead time is ceil(10 / 2) = 5 days and a 2026-09-01..2026-09-30 horizon of 29 days is feasible."
            - "Wheelset WS-EQ-1 is created with on_hand_qty exactly 10; wheelset WS-SH-1 is created with on_hand_qty 9."
            - "One RETAINED order of quantity 5 (planned_shop_days 5) exists on each car type, so each order requires exactly 2 * 5 = 10 units of its wheelset."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "STK-EQ-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 15, line_count_family: "STK_EQ_LINE" }
              as: ProductionPlanner
              captures: { ct_eq_id: "$.data.id" }
            - call: "POST /api/v1/car-types"
              payload: { model_code: "STK-SH-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 15, line_count_family: "STK_SH_LINE" }
              as: ProductionPlanner
              captures: { ct_sh_id: "$.data.id" }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-EQ-1", component_class: "WHEELSET", unit_cost_cents: 200000, lead_time_days: 10, on_hand_qty: 10 }
              as: SupplyChainCoordinator
              captures: { comp_eq_id: "$.data.id" }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-SH-1", component_class: "WHEELSET", unit_cost_cents: 200000, lead_time_days: 10, on_hand_qty: 9 }
              as: SupplyChainCoordinator
              captures: { comp_sh_id: "$.data.id" }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_eq_id}", component_id: "${comp_eq_id}", qty_per_car: 2 }
              as: ProductionPlanner
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_sh_id}", component_id: "${comp_sh_id}", qty_per_car: 2 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_eq_id}", quantity: 5, planned_shop_days: 5, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-30" }
              as: ProductionPlanner
              captures: { po_eq: "$.data.id" }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_sh_id}", quantity: 5, planned_shop_days: 5, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-30" }
              as: ProductionPlanner
              captures: { po_sh: "$.data.id" }
          trigger:
            - call: "POST /api/v1/production-orders/${po_eq}/reserve-components"
              payload: {}
              as: ProductionPlanner
              captures: { eq_status: "$.data.status" }
            - call: "GET /api/v1/components/${comp_eq_id}"
              as: PlatformAdmin
              captures: { eq_on_hand: "$.data.on_hand_qty" }
            - call: "POST /api/v1/production-orders/${po_sh}/reserve-components"
              payload: {}
              as: ProductionPlanner
              captures: { sh_err: "$.data.error_id" }
            - call: "GET /api/v1/components/${comp_sh_id}"
              as: PlatformAdmin
              captures: { sh_on_hand: "$.data.on_hand_qty" }
            - call: "GET /api/v1/production-orders/${po_sh}"
              as: PlatformAdmin
              captures: { sh_status: "$.data.status" }
          assert:
            - "Exactly at the requirement: Component ${comp_eq_id} on_hand_qty 10 == qty_per_car 2 * quantity 5 == 10, so the reservation succeeds and production_order ${po_eq} status == ${eq_status} == COMPONENT_RESERVED"
            - "After the commit Component ${comp_eq_id}.on_hand_qty == ${eq_on_hand} == 0 (10 units committed, none left), so the >= boundary consumed the stock exactly rather than rejecting it"
            - "One unit short: Component ${comp_sh_id} on_hand_qty 9 < qty_per_car 2 * quantity 5 == 10, so the reservation is rejected with error_id ${sh_err} == ERR_COMPONENT_SHORTAGE and http_status == 409"
            - "Component ${comp_sh_id}.on_hand_qty == ${sh_on_hand} == 9, unchanged, and production_order ${po_sh} status == ${sh_status} == DRAFT — the rejected reservation commits nothing and leaves no partial state"
