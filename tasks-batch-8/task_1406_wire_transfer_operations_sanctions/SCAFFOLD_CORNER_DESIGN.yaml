        distinguishing_aspect: "WireOperator (the initiating role) cannot approve — approval is exclusive to WireApprover, independent of the SoD identity check."
        test_recipe:
          setup:
            - "Customer CR2 (MEDIUM), Account AR2, Beneficiary BR2, BusinessDate 2026-09-29 OPEN, Wire WR2 (100000) submitted"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "RBAC Two", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cr2: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cr2}", account_number: "A-R002", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { ar2: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cr2}", name: "RBAC Ben2", bank_name: "RBACBank2", account_number: "B-R002", country_code: "US" }, as: WireOperator, captures: { br2: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-29" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ar2}", beneficiary_id: "${br2}", amount_cents: 100000, method: "Fedwire", purpose: "rbac approve" }, as: WireOperator, as_user_id: "op-1", captures: { wr2: $.data.id } }
