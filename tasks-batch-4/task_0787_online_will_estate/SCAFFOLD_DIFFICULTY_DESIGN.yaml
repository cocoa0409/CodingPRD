            - "estate_summary.total_assigned_value_cents == 50000 (conserved: 50000 before and after reassignment)"

      - name: execute_supersede_conserves_executed_count
        grounds:
          - state_machines.EstateDocument.GENERATED_to_EXECUTED
          - state_machines.EstateDocument.EXECUTED_to_SUPERSEDED
          - entities.EstateDocument.fields.status
        distinguishing_aspect: |
          Executing WILL v2 (forward) supersedes WILL v1 (compensating) so the count of EXECUTED WILL documents for the
          subscription stays exactly 1; the conserved quantity is a document count, a different type than the monetary sum.
        test_recipe:
          setup:
            - "ACTIVE subscription; WILL v1 EXECUTED (executed-WILL count == 1); WILL v2 GENERATED."
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "m18@x.com", full_name: "M Eighteen", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/beneficiaries"
              payload: { subscription_id: "${sub_id}", full_name: "Heir", relationship: "CHILD", allocation_pct: 100 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/questionnaires"
              payload: { subscription_id: "${sub_id}", document_type: "WILL", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { q1_id: "$.data.id" }
            - call: "POST /v1/questionnaires/${q1_id}/answers"
              payload: { answers: { q1: "a", q2: "b", q3: "c", q4: "d", q5: "e" } }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/documents"
              payload: { questionnaire_id: "${q1_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { doc1_id: "$.data.id" }
            - call: "POST /v1/documents/${doc1_id}/execute"
              payload: { witnesses_count: 2 }
              as: Notary
            - call: "POST /v1/questionnaires"
              payload: { subscription_id: "${sub_id}", document_type: "WILL", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { q2_id: "$.data.id" }
            - call: "POST /v1/questionnaires/${q2_id}/answers"
              payload: { answers: { q1: "a", q2: "b", q3: "c", q4: "d", q5: "e" } }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/documents"
              payload: { questionnaire_id: "${q2_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { doc2_id: "$.data.id" }
          trigger:
            - call: "POST /v1/documents/${doc2_id}/execute"
              payload: { witnesses_count: 2 }
              as: Notary
          assert:
            - "EstateDocument.${doc2_id}.status == EXECUTED"
            - "EstateDocument.${doc1_id}.status == SUPERSEDED"
            - "count of EXECUTED WILL documents for subscription ${sub_id} == 1 (conserved: 1 before, 1 after)"
