  - rule_id: resource_temporal_overlap
    instances:

      - name: trailer_half_open_occupancy_rejects_overlap_and_admits_adjacency
        grounds:
          - validations[priority=50]
          - errors[ERR_TRAILER_WINDOW_CONFLICT]
          - entities.AgreementUnit.fields.planned_start_date
          - entities.AgreementUnit.fields.planned_end_date
          - state_machines.Agreement.status.PENDING_ALLOCATION_to_PENDING_ALLOCATION
        distinguishing_aspect: |
          RESOURCE = Trailer, INTERVAL SEMANTICS = HALF-OPEN SINGLE-OCCUPANCY. The occupancy
          interval is [planned_start_date, planned_end_date); a second booking starting 2026-09-10
          inside an existing 2026-09-01..2026-09-15 booking is rejected with
          ERR_TRAILER_WINDOW_CONFLICT, while a booking starting exactly on the incumbent's
          exclusive end date 2026-09-15 does NOT collide and is admitted.
        test_recipe:
          setup:
            - "Branch WST-01 with one DRY_VAN_53 trailer T-1001 whose DOT is good through 2027-01-01."
            - "Agreement AG_A (2026-09-01 .. 2026-09-15, 1 unit) has T-1001 manually attached, so AG_A is RESERVED and T-1001 is ALLOCATED."
            - "Agreements AG_B (2026-09-10 .. 2026-09-20) and AG_C (2026-09-15 .. 2026-09-25) are both submitted and insurance-verified, sitting in PENDING_ALLOCATION with no units."
