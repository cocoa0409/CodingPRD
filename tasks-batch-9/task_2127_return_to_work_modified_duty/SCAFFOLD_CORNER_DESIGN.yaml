        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          dir_id: $.data.current_adjuster_directive_id
      - call: POST /rtw/adjuster-directives/${dir_id}/decide
        payload:
          decision: AUTHORIZED
          authorized_weekly_cost_cents: 120000
        as: ClaimAdjuster
        as_user_id: adj-001
      - call: POST /rtw/placements/${pl_id}/activate
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
      trigger:
      - call: POST /rtw/placements/${pl_id}/suspend
        payload:
          suspension_reason: OPERATIONAL
        as: RTWCoordinator
        as_user_id: coord-1
      - call: GET /rtw/transitional-jobs/${job_id}
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          s0: $.data.filled_seats
