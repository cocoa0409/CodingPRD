              as: Coordinator
              captures: { b1_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In 1", checkin_at: "2026-08-08T16:30:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
