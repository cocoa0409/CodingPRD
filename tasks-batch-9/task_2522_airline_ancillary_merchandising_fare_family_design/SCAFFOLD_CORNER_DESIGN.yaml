            - call: "POST /fare-families/${f_lite_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "OTA_SKYDEAL", channel_type: "OTA", commission_bp: 900, markup_bp: 500, max_ancillary_price_cents: 6000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_ota_id: $.data.id }
            - call: "GET /fare-families/${f_lite_id}"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { f_ver_a: $.data.version }
            - call: "POST /channel-publications"
              payload: { fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_direct_id}", expected_fare_family_version: "${f_ver_a}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { pub_direct_id: $.data.id }
            - call: "GET /fare-families/${f_lite_id}"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { f_ver_b: $.data.version }
          trigger:
            - call: "POST /channel-publications"
              payload: { fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_ota_id}", expected_fare_family_version: "${f_ver_b}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { pub_ota_id: $.data.id }
          assert:
            - "HTTP status is 201 and ChannelPublication.parity_state == \"PENDING\" (the family is still DRAFT)"
            - "GET /channel-publications?fare_family_id=${f_lite_id} returns total_count == 2"
            - "GET /channel-publications?distribution_channel_id=${ch_ota_id} returns total_count == 1"
            - "GET /fare-families/${f_lite_id} shows publication_count == 2"
            - "both publications carry published_fee_fingerprint == \"ECO_LITE|1|BAG_CHECKED_1:INCLUDED:1:3500\""

      - name: reparenting_draft_family_onto_its_own_child_returns_upsell_cycle_detected
        claim_type: cycle_constraint
        grounds:
          - complexity_profile.entity_topology
          - entities.FareFamily.fields.upsell_parent_family_id
          - endpoints[PATCH /fare-families/{id}]
          - validations.priority_37
          - errors[ERR_UPSELL_CYCLE_DETECTED]
        distinguishing_aspect: "ECO_UP is created with ECO_BASE as its upsell parent; re-parenting ECO_BASE onto ECO_UP would close a two-node cycle and is refused with ERR_UPSELL_CYCLE_DETECTED (422), leaving ECO_BASE.upsell_parent_family_id null."
        test_recipe:
          setup:
            - "two DRAFT families exist: ECO_BASE with upsell_parent_family_id null, and ECO_UP whose upsell_parent_family_id is ECO_BASE"
          setup_api_calls:
            - call: "POST /fare-families"
              payload: { code: "ECO_BASE", name: "Economy Base", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 13000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_base_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_UP", name: "Economy Up", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 15000, refundability: "REFUNDABLE_WITH_FEE", change_fee_cents: 5000, boarding_priority_tier: 3, upsell_parent_family_id: "${f_base_id}" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_up_id: $.data.id }
          trigger:
            - call: "PATCH /fare-families/${f_base_id}"
              payload: { upsell_parent_family_id: "${f_up_id}" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and data.error_id == \"ERR_UPSELL_CYCLE_DETECTED\""
            - "GET /fare-families/${f_base_id} still shows upsell_parent_family_id == null and version unchanged at 1"
            - "GET /fare-families?upsell_parent_family_id=${f_base_id} still returns exactly ECO_UP"

  - section: state_machines
    instances:
      - name: submit_draft_family_moves_to_in_review_and_recomputes_valuation
        claim_type: valid_transition
        grounds:
          - state_machines.FareFamily.status.DRAFT_to_IN_REVIEW
          - endpoints[POST /fare-families/{id}/submit]
          - calculations.fare_family_bundle_valuation
          - calculations.fare_family_fee_fingerprint
        distinguishing_aspect: "The submit trigger moves ECO_TWO from DRAFT to IN_REVIEW and, in the same response, republishes unbundled_value_cents 4750 / a_la_carte_total_cents 16750 / bundle_discount_bp 1045 and the two-part fee_fingerprint."
        test_recipe:
          setup:
            - "catalog holds BAG_CHECKED_1 (3500) and PRIORITY_BOARDING (1250)"
            - "DRAFT family ECO_TWO (ECONOMY, base_fare 12000, bundle 15000) carries both products as ACTIVE INCLUDED attributes at quantity 1"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "PRIORITY_BOARDING", name: "Priority boarding", category: "BOARDING", list_price_cents: 1250, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4400" }
