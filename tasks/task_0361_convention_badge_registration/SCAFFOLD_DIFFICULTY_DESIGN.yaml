scaffold_difficulty_design:
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_provisional_vs_final_diverges_on_order
        grounds:
          - calculations.order_refund
          - entities.Order.fields.provisional_refund_cents
          - entities.Order.fields.refund_amount_cents
          - state_machines.Order.PAID_to_REFUNDED
        distinguishing_aspect: |
          On the ORDER domain: a refund quote read at 12 days before the event (25% penalty)
          yields provisional_refund_cents=35269, but the FINAL refund executed at 4 days before
          (50% penalty) yields refund_amount_cents=23513 — same order, two clocks, different cents.
        test_recipe:
          setup:
            - "Convention with event_start_utc=2026-09-01T00:00:00Z, total_badge_capacity=100"
            - "GENERAL TicketType base_price_cents=9900, tier_capacity=100"
            - "ACTIVE attendee owns a PAID order of 5xGENERAL (ticket_subtotal_cents=47025)"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "DV Refund Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 100, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "GENERAL", base_price_cents: 9900, tier_capacity: 100 }
              as: ConventionAdmin
              captures: { tt_id: $.data.id }
            - call: "POST /attendees"
              payload: { email: "dvrefund@x.com", full_name: "DV Refund" }
              as: Anonymous
              captures: { att_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ConventionAdmin
            - call: "POST /orders"
              payload: { convention_id: "${conv_id}", purchaser_attendee_id: "${att_id}", line_items: [ { ticket_type_id: "${tt_id}", quantity: 5 } ] }
              as: Attendee
              as_user_id: "${att_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
            - call: "GET /conventions/${conv_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { conv_v: $.data.version }
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_convention_version: "${conv_v}" }
              as: Attendee
              as_user_id: "${att_id}"
          trigger:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ConventionAdmin
            - call: "GET /orders/${order_id}/refund-quote"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { prov: $.data.provisional_refund_cents }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-28T00:00:00Z" }
              as: ConventionAdmin
            - call: "POST /orders/${order_id}/refund"
              payload: {}
              as: RegistrationAgent
          assert:
            - "Order.${order_id}.provisional_refund_cents == 35269"
            - "Order.${order_id}.refund_amount_cents == 23513"
            - "Order.${order_id}.refund_amount_cents < Order.${order_id}.provisional_refund_cents"
            - "Order.${order_id}.status == REFUNDED"
      - name: booth_estimated_vs_actual_diverges_on_exhibitor
        grounds:
          - calculations.booth_charge
          - entities.Exhibitor.fields.estimated_booth_cents
          - entities.Exhibitor.fields.actual_booth_cents
          - state_machines.BoothBooking.RESERVED_to_CHECKED_IN
        distinguishing_aspect: |
          On the EXHIBITOR domain: an exhibitor with a RESERVED STANDARDx2 booking and a
          CHECKED_IN ENDCAPx1 booking has estimated_booth_cents=300000 (both, requested_days)
          but actual_booth_cents=200000 (only the checked-in ENDCAP booking, occupied_days).
        test_recipe:
          setup:
            - "Convention with two booths: STANDARD and ENDCAP"
            - "Exhibitor with a RESERVED STANDARD booking (requested_days=2) and a CHECKED_IN ENDCAP booking (occupied_days=1)"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Booth DV Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 100, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/booths"
              payload: { booth_code: "S1", zone: "STANDARD", setup_buffer_hours: 0 }
              as: ConventionAdmin
              captures: { booth_s: $.data.id }
            - call: "POST /conventions/${conv_id}/booths"
              payload: { booth_code: "E1", zone: "ENDCAP", setup_buffer_hours: 0 }
              as: ConventionAdmin
              captures: { booth_e: $.data.id }
            - call: "POST /exhibitors"
              payload: { convention_id: "${conv_id}", company_name: "Acme", contact_email: "acme@x.com" }
              as: Anonymous
              captures: { exh_id: $.data.id }
            - call: "POST /booth-bookings"
              payload: { booth_id: "${booth_s}", exhibitor_id: "${exh_id}", occupy_start_utc: "2026-09-01T00:00:00Z", occupy_end_utc: "2026-09-02T00:00:00Z", requested_days: 2 }
              as: Exhibitor
              as_user_id: "${exh_id}"
              captures: { bk_s: $.data.id }
            - call: "POST /booth-bookings"
              payload: { booth_id: "${booth_e}", exhibitor_id: "${exh_id}", occupy_start_utc: "2026-09-01T00:00:00Z", occupy_end_utc: "2026-09-02T00:00:00Z", requested_days: 1 }
              as: Exhibitor
              as_user_id: "${exh_id}"
              captures: { bk_e: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: ConventionAdmin
            - call: "POST /booth-bookings/${bk_e}/check-in"
              payload: {}
              as: Exhibitor
              as_user_id: "${exh_id}"
          trigger:
            - call: "GET /exhibitors/${exh_id}"
              payload: {}
              as: Exhibitor
              as_user_id: "${exh_id}"
              captures: { est: $.data.estimated_booth_cents, act: $.data.actual_booth_cents }
          assert:
            - "Exhibitor.${exh_id}.estimated_booth_cents == 300000"
            - "Exhibitor.${exh_id}.actual_booth_cents == 200000"
            - "Exhibitor.${exh_id}.actual_booth_cents < Exhibitor.${exh_id}.estimated_booth_cents"
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_pricing_rounding_order_per_line_then_sum
        grounds:
          - calculations.order_pricing
          - entities.Order.fields.ticket_subtotal_cents
          - entities.TicketLineItem.fields.line_discounted_cents
          - state_machines.Order.DRAFT_to_PENDING_PAYMENT
        distinguishing_aspect: |
          Mode (b) nested rounding: order of 1 GENERAL + 1 THREE_DAY + 23 VIP (25 badges, 12.5%
          discount) yields ticket_subtotal_cents=1034689 under the pinned round-per-line-then-sum
          order, which differs by exactly 1 cent from a sum-then-round implementation (1034688).
        test_recipe:
          setup:
            - "Convention OPEN, capacity 100; GENERAL=9900, THREE_DAY=24900, VIP=49900 ticket types"
            - "DRAFT order of 1 GENERAL + 1 THREE_DAY + 23 VIP = 25 badges, just submitted"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Round Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 100, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "GENERAL", base_price_cents: 9900, tier_capacity: 100 }
              as: ConventionAdmin
              captures: { tt_gen: $.data.id }
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "THREE_DAY", base_price_cents: 24900, tier_capacity: 100 }
              as: ConventionAdmin
              captures: { tt_td: $.data.id }
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "VIP", base_price_cents: 49900, tier_capacity: 100 }
              as: ConventionAdmin
              captures: { tt_vip: $.data.id }
            - call: "POST /attendees"
              payload: { email: "round@x.com", full_name: "Round Buyer" }
              as: Anonymous
              captures: { att_id: $.data.id }
            - call: "POST /orders"
              payload: { convention_id: "${conv_id}", purchaser_attendee_id: "${att_id}", line_items: [ { ticket_type_id: "${tt_gen}", quantity: 1 }, { ticket_type_id: "${tt_td}", quantity: 1 }, { ticket_type_id: "${tt_vip}", quantity: 23 } ] }
              as: Attendee
              as_user_id: "${att_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { sub: $.data.ticket_subtotal_cents, total: $.data.total_cents }
          assert:
            - "Order.${order_id}.ticket_subtotal_cents == 1034689"
            - "Order.${order_id}.processing_fee_cents == 5000"
            - "Order.${order_id}.total_cents == 1039689"
            - "Order.${order_id}.is_group == true"
      - name: waitlist_priority_weighted_score_with_group_cap
        grounds:
          - calculations.waitlist_priority
          - entities.WaitlistEntry.fields.priority_score
          - entities.Attendee.fields.loyalty_tier
          - state_machines.WaitlistEntry.ENTERED_to_WON
        distinguishing_aspect: |
          Mode (a) non-linear formula with 3 inputs and a capping min(): a SILVER attendee (100)
          entering inside the early window (+50) with group_size 20 gets group_size_factor=min(100,60)=60,
          so priority_score=210 — the cap clamps the group term rather than letting it dominate linearly.
        test_recipe:
          setup:
            - "Convention with lottery_open_utc=2026-06-01T00:00:00Z, capacity 100"
            - "SILVER attendee enters the lottery at 2026-06-01T06:00:00Z (inside the 24h early window) with group_size=20"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Lottery Score Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 100, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /attendees"
              payload: { email: "silver@x.com", full_name: "Silver Fan", loyalty_tier: "SILVER" }
              as: Anonymous
              captures: { att_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T06:00:00Z" }
              as: ConventionAdmin
          trigger:
            - call: "POST /conventions/${conv_id}/waitlist"
              payload: { attendee_id: "${att_id}", requested_quantity: 20, group_size: 20 }
              as: Attendee
              as_user_id: "${att_id}"
              captures: { we_id: $.data.id, score: $.data.priority_score }
          assert:
            - "WaitlistEntry.${we_id}.priority_score == 210"
            - "WaitlistEntry.${we_id}.status == ENTERED"
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: badge_parallel_status_and_rfid_dimensions
        grounds:
          - state_machines.Badge.ISSUED_to_PICKED_UP
          - state_machines.Badge.PICKED_UP_to_PRINTED
          - entities.Badge.fields.status
          - entities.Badge.fields.rfid_status
        distinguishing_aspect: |
          On Badge: status (ISSUED->PICKED_UP->PRINTED) and rfid_status (UNASSIGNED->ENCODED) are
          parallel dimensions on the same row — pickup advances BOTH (status=PICKED_UP, rfid_status=ENCODED,
          rfid_uid assigned), whereas print advances only status to PRINTED leaving rfid_status=ENCODED.
        test_recipe:
          setup:
            - "Convention OPEN; a PAID order issued one ISSUED/UNASSIGNED badge; clock inside pickup window"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Badge Parallel Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 100, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "GENERAL", base_price_cents: 9900, tier_capacity: 100 }
              as: ConventionAdmin
              captures: { tt_id: $.data.id }
            - call: "POST /attendees"
              payload: { email: "badgepar@x.com", full_name: "Badge Par" }
              as: Anonymous
              captures: { att_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ConventionAdmin
            - call: "POST /orders"
              payload: { convention_id: "${conv_id}", purchaser_attendee_id: "${att_id}", line_items: [ { ticket_type_id: "${tt_id}", quantity: 1 } ] }
              as: Attendee
              as_user_id: "${att_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
            - call: "GET /conventions/${conv_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { conv_v: $.data.version }
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_convention_version: "${conv_v}" }
              as: Attendee
              as_user_id: "${att_id}"
            - call: "GET /badges?order_id=${order_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { badge_id: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: ConventionAdmin
          trigger:
            - call: "POST /badges/${badge_id}/pickup"
              payload: {}
              as: RegistrationAgent
              captures: { st1: $.data.status, rf1: $.data.rfid_status }
            - call: "POST /badges/${badge_id}/print"
              payload: {}
              as: RegistrationAgent
              captures: { st2: $.data.status, rf2: $.data.rfid_status }
          assert:
            - "after pickup: Badge.${badge_id}.status == PICKED_UP and Badge.${badge_id}.rfid_status == ENCODED"
            - "after print: Badge.${badge_id}.status == PRINTED and Badge.${badge_id}.rfid_status == ENCODED"
            - "Badge.${badge_id}.rfid_uid != null"
      - name: session_reservation_waitlist_promotion_cycle
        grounds:
          - state_machines.SessionReservation.CONFIRMED_to_CANCELLED
          - state_machines.SessionReservation.WAITLISTED_to_CONFIRMED
          - entities.SessionReservation.fields.status
          - entities.Session.fields.seats_taken
        distinguishing_aspect: |
          On SessionReservation: a non-linear WAITLISTED->CONFIRMED promotion fires as a side-effect
          of a CONFIRMED->CANCELLED transition on a sibling reservation of the same session — a
          waitlisted entry is pulled forward into CONFIRMED (seats_taken stays at 1), not a linear pipeline.
        test_recipe:
          setup:
            - "Session with seat_capacity=1; badge A holds the only CONFIRMED reservation; badge B is WAITLISTED"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Promote Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 100, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "GENERAL", base_price_cents: 9900, tier_capacity: 100 }
              as: ConventionAdmin
              captures: { tt_id: $.data.id }
            - call: "POST /conventions/${conv_id}/sessions"
              payload: { title: "Panel X", start_utc: "2026-09-01T10:00:00Z", end_utc: "2026-09-01T11:00:00Z", seat_capacity: 1 }
              as: ConventionAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /attendees"
              payload: { email: "promoa@x.com", full_name: "Promo A" }
              as: Anonymous
              captures: { att_a: $.data.id }
            - call: "POST /attendees"
              payload: { email: "promob@x.com", full_name: "Promo B" }
              as: Anonymous
              captures: { att_b: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ConventionAdmin
            - call: "POST /orders"
              payload: { convention_id: "${conv_id}", purchaser_attendee_id: "${att_a}", line_items: [ { ticket_type_id: "${tt_id}", quantity: 1 } ] }
              as: Attendee
              as_user_id: "${att_a}"
              captures: { order_a: $.data.id }
            - call: "POST /orders/${order_a}/submit"
              payload: {}
              as: Attendee
              as_user_id: "${att_a}"
            - call: "GET /conventions/${conv_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_a}"
              captures: { conv_v1: $.data.version }
            - call: "POST /orders/${order_a}/pay"
              payload: { expected_convention_version: "${conv_v1}" }
              as: Attendee
              as_user_id: "${att_a}"
            - call: "GET /badges?order_id=${order_a}"
              payload: {}
              as: Attendee
              as_user_id: "${att_a}"
              captures: { badge_a: "$.data[0].id" }
            - call: "POST /orders"
              payload: { convention_id: "${conv_id}", purchaser_attendee_id: "${att_b}", line_items: [ { ticket_type_id: "${tt_id}", quantity: 1 } ] }
              as: Attendee
              as_user_id: "${att_b}"
              captures: { order_b: $.data.id }
            - call: "POST /orders/${order_b}/submit"
              payload: {}
              as: Attendee
              as_user_id: "${att_b}"
            - call: "GET /conventions/${conv_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_b}"
              captures: { conv_v2: $.data.version }
            - call: "POST /orders/${order_b}/pay"
              payload: { expected_convention_version: "${conv_v2}" }
              as: Attendee
              as_user_id: "${att_b}"
            - call: "GET /badges?order_id=${order_b}"
              payload: {}
              as: Attendee
              as_user_id: "${att_b}"
              captures: { badge_b: "$.data[0].id" }
            - call: "GET /sessions/${sess_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_a}"
              captures: { sess_v1: $.data.version }
            - call: "POST /session-reservations"
              payload: { session_id: "${sess_id}", badge_id: "${badge_a}", expected_session_version: "${sess_v1}" }
              as: Attendee
              as_user_id: "${att_a}"
              captures: { resv_a: $.data.id }
            - call: "GET /sessions/${sess_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_b}"
              captures: { sess_v2: $.data.version }
            - call: "POST /session-reservations"
              payload: { session_id: "${sess_id}", badge_id: "${badge_b}", expected_session_version: "${sess_v2}" }
              as: Attendee
              as_user_id: "${att_b}"
              captures: { resv_b: $.data.id }
          trigger:
            - call: "POST /session-reservations/${resv_a}/cancel"
              payload: {}
              as: Attendee
              as_user_id: "${att_a}"
          assert:
            - "SessionReservation.${resv_a}.status == CANCELLED"
            - "SessionReservation.${resv_b}.status == CONFIRMED"
            - "Session.${sess_id}.seats_taken == 1"
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: refund_cascade_void_cancel_promote_depth3
        grounds:
          - state_machines.Order.PAID_to_REFUNDED
          - state_machines.Badge.ISSUED_to_VOID
          - state_machines.SessionReservation.CONFIRMED_to_CANCELLED
          - state_machines.SessionReservation.WAITLISTED_to_CONFIRMED
        distinguishing_aspect: |
          Depth-3 cascade from PAID->REFUNDED: refund voids badge A (hop 1), voiding A cancels A's
          CONFIRMED reservation (hop 2), which promotes the WAITLISTED reservation of badge B to
          CONFIRMED (hop 3) — each hop is caused by the previous, not by the refund directly.
        test_recipe:
          setup:
            - "Session seat_capacity=1; badge A (PAID order A) holds CONFIRMED reservation; badge B WAITLISTED"
            - "Order A is PAID with its badge holding the CONFIRMED seat; clock at 2026-07-15 (well before event)"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Refund Cascade Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 100, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "GENERAL", base_price_cents: 9900, tier_capacity: 100 }
              as: ConventionAdmin
              captures: { tt_id: $.data.id }
            - call: "POST /conventions/${conv_id}/sessions"
              payload: { title: "Cascade Panel", start_utc: "2026-09-01T10:00:00Z", end_utc: "2026-09-01T11:00:00Z", seat_capacity: 1 }
              as: ConventionAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /attendees"
              payload: { email: "casa@x.com", full_name: "Cas A" }
              as: Anonymous
              captures: { att_a: $.data.id }
            - call: "POST /attendees"
              payload: { email: "casb@x.com", full_name: "Cas B" }
              as: Anonymous
              captures: { att_b: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ConventionAdmin
            - call: "POST /orders"
              payload: { convention_id: "${conv_id}", purchaser_attendee_id: "${att_a}", line_items: [ { ticket_type_id: "${tt_id}", quantity: 1 } ] }
              as: Attendee
              as_user_id: "${att_a}"
              captures: { order_a: $.data.id }
            - call: "POST /orders/${order_a}/submit"
              payload: {}
              as: Attendee
              as_user_id: "${att_a}"
            - call: "GET /conventions/${conv_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_a}"
              captures: { conv_va: $.data.version }
            - call: "POST /orders/${order_a}/pay"
              payload: { expected_convention_version: "${conv_va}" }
              as: Attendee
              as_user_id: "${att_a}"
            - call: "GET /badges?order_id=${order_a}"
              payload: {}
              as: Attendee
              as_user_id: "${att_a}"
