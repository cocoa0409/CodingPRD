            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "GET /fleet/vehicles/${veh_pgm}/valuation"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
            - call: "GET /fleet/vehicles/${veh_rsk}/valuation"
