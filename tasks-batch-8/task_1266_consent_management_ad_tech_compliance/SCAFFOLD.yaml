  - { id: ERR_VENDOR_NOT_APPROVED, http: 409, condition: "TagRule create/enable requires the vendor in APPROVED status" }
  - { id: ERR_CROSS_PROPERTY_REFERENCE, http: 409, condition: "TagRule vendor/banner-config reference belongs to a different property" }
  - { id: ERR_POLICY_OUTSIDE_COVERAGE_WINDOW, http: 409, condition: "Current clock outside the ACTIVE policy's [effective_from, effective_to) window" }
  - { id: ERR_SCAN_WINDOW_CONFLICT, http: 409, condition: "Scan window (with cooldown buffer) intersects an existing scan of the property" }
  - { id: ERR_POLICY_WINDOW_OVERLAP, http: 409, condition: "ACTIVE policy window overlaps another ACTIVE policy of the same (property, jurisdiction)" }
  - { id: ERR_DUPLICATE_TAG_RULE, http: 409, condition: "TagRule already exists for (banner_config_id, purpose_category)" }
  - { id: ERR_DUPLICATE_CONSENT_PURPOSE, http: 409, condition: "ConsentRecord already exists for (visitor, purpose) in GRANTED or WITHDRAWN" }
  - { id: ERR_DNS_NOT_APPLICABLE, http: 409, condition: "Property designation NO_SALE_NO_SHARE makes do-not-sell requests inapplicable" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Scan creator cannot confirm violations on their own scan" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PrivacyAdmin
    description: "Privacy program administrator: properties, policies, banner configs, vendor approval, DNS verification/propagation, sweep response"
    identity: opaque
    exclusive_operations:
      - "POST /v1/properties, PUT /v1/jurisdiction-policies/{id}, POST /v1/banner-configs/*, vendor approve/suspend"
      - "PUT /v1/do-not-sell-requests/{id}, POST .../propagate"
      - "POST /v1/regulatory-sweeps/{id}/respond, .../close"
      - "POST /v1/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: VendorManager
    description: "Ad-tech vendor manager: vendor registration, tag rules, propagation acknowledgements, finding remediation"
    identity: opaque
    exclusive_operations:
      - "POST /v1/vendors, POST/PUT /v1/tag-rules"
      - "PUT /v1/vendor-propagations/{id}"
      - "PUT /v1/tracker-findings/{id} {status: REMEDIATED}"
    shared_operations: ["all GET endpoints", "PUT /v1/tracker-findings/{id} (REMEDIATED only)"]
  - name: ComplianceAuditor
    description: "Compliance auditor: tag audit scans, finding confirmation/closure, regulatory sweep management"
    identity: opaque
    exclusive_operations:
      - "POST /v1/tag-audit-scans, POST .../run"
      - "PUT /v1/tracker-findings/{id} {status: CONFIRMED_VIOLATION | CLOSED}"
      - "POST /v1/regulatory-sweeps, .../begin-evidence-collection, .../escalate"
    shared_operations: ["all GET endpoints"]
  - name: Visitor
    description: "Data subject acting on their own profile (X-User-ID must equal the VisitorProfile id)"
    identity: "entity_backed:VisitorProfile"
    exclusive_operations:
      - "POST /v1/visitors/{id}/age-attestation, .../gpc-signals, .../consent-records, .../do-not-sell-requests"
      - "POST /v1/consent-records/{id}/withdraw, .../regrant"
    shared_operations: ["all GET endpoints"]
  - name: Anonymous
    description: "Unauthenticated registration caller"
    identity: opaque
    exclusive_operations: ["POST /v1/visitors"]
    shared_operations: []
  - name: Any
    description: "Any authenticated role may read"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# All list endpoints sort by created_at ASC (creation order). `id` is identity
# only and NEVER used for ordering, ranking, or tie-breaks anywhere.
list_ordering: "created_at ASC on every list endpoint; no id-based ordering"
