  # ===========================================================================
  - rule_id: compensating_invariant
    scaffold_basis: >-
      §1.3 booking_ledger_conservation pins that the LedgerEntry rows of a
      Booking always sum to exactly 0, and §1.3 dropoff_slot_conservation pins
      that Campground.scheduled_assignment_count always equals the live count of
      SCHEDULED rows on that campground. Each has an explicit compensating
      action: POST /rv-marketplace/bookings/{bookingId}/settlement/reverse undoes
      calculations.settlement_ledger_posting, and POST
      /rv-marketplace/delivery-assignments/{assignmentId}/void undoes the
      REQUESTED -> SCHEDULED side-effect set.
    instances:

      - name: settlement_reversal_restores_every_derived_money_field_and_keeps_the_ledger_at_zero
        grounds: >-
          §1.2 Booking settlement SETTLED -> RECONCILING with its four
          side-effect bullets, §1.3 settlement_ledger_posting and §1.3
          booking_ledger_conservation.
        distinguishing_aspect: >-
          The compensation is append-only: the four forward rows are NOT deleted,
          four inverse rows with _REVERSAL suffixes and reversal_of_entry_id set
          are appended instead, so the row count doubles from 4 to 8 while the sum
          stays exactly 0. Four independent derived quantities must all unwind —
          the renter's 5813 wallet debit, the owner's 111275 payout balance, the
          listing's 4 completed nights and the settlement dimension itself — while
          trip_status deliberately stays CLOSED. An implementation that deletes the
          forward rows keeps the sum at 0 but breaks the audit trail and the row
          count; one that reverses the ledger but forgets
          Listing.completed_night_count corrupts the utilization analytics.
        test_recipe:
          setup: >-
            Canonical marketplace through /settle: booking CLOSED and SETTLED,
            four ledger rows posted, renter wallet at 648124, owner payout balance
            111275, listing completed_night_count 4.
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - *c_qual_dr
            - *c_qual_tow
            - *c_listing
            - *c_doc_title
            - *c_doc_reg
            - *c_doc_ins
            - *c_insp_front
            - *c_insp_rear
            - *c_insp_interior
            - *c_insp_roof
            - *c_insp_under
            - *c_verify_title
            - *c_verify_reg
            - *c_verify_ins
            - *c_submit
            - *c_list_approve
            - *c_fund
            - *c_booking
            - *c_bk_approve
            - *c_bk_confirm
            - *c_read_pre
            - *c_tp_pre_front
            - *c_tp_pre_rear
            - *c_tp_pre_interior
            - *c_tp_pre_roof
            - *c_tp_pre_under
            - *c_bk_start
            - *c_read_mid
            - *c_read_post
            - *c_tp_post_front
            - *c_tp_post_rear
            - *c_tp_post_interior
            - *c_tp_post_roof
            - *c_tp_post_under
            - *c_bk_return
            - *c_settle
          trigger:
            - *c_reverse
          assert:
            - "response 200"
            - "data.settlement_status == 'RECONCILING' and data.trip_status == 'CLOSED'"
            - "GET /rv-marketplace/ledger-entries?booking_id=${booking_id} returns total_count == 8 (the 4 forward rows are retained) and the 8 amount_cents values sum to exactly 0"
            - "the 4 appended rows are -111275 OWNER_PAYOUT_REVERSAL, +151876 TRIP_CHARGE_REVERSAL, -15650 SERVICE_FEE_REVERSAL and -24951 PROTECTION_PREMIUM_REVERSAL, each with reversal_of_entry_id pointing at its forward row"
            - "GET /rv-marketplace/renters/${renter_id} shows data.wallet_credit_cents == 653937 (the 5813 balance-due debit refunded)"
            - "GET /rv-marketplace/owners/${owner_id} shows data.payout_balance_cents == 0"
            - "GET /rv-marketplace/listings/${listing_id} shows data.completed_night_count == 0"

      - name: voiding_a_scheduled_dropoff_releases_the_slot_and_unwinds_the_delivery_fee
        grounds: >-
          §1.2 DeliveryAssignment SCHEDULED -> VOIDED with its three side-effect
          bullets, §1.3 dropoff_slot_conservation and §1.3 booking_quote_total.
        distinguishing_aspect: >-
          This compensation is destructive rather than append-only, and what it
          restores is a QUOTE rather than a ledger: zeroing delivery_fee_cents
          drops pre_discount_cents from 151347 back to 135847, which un-flips the
          loyalty tier from LOYALTY_TIER_2 to LOYALTY_TIER_1 and therefore changes
          the discount and the service fee as well, landing exactly back on 146063.
          The campground counter must also return to 0 with no waitlisted row to
          promote — the "no promotion occurs, and this is not an error" fallback of
          §1.3 dropoff_waitlist_promotion. An implementation that zeroes the fee
          without re-running the tier selection leaves the booking at 142213.
        test_recipe:
          setup: >-
            Canonical marketplace, a capacity-1 campground and a
            CAMPGROUND_DROPOFF booking whose SCHEDULED assignment has already
            pushed the quote to 157643.
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - *c_qual_dr
            - *c_qual_tow
            - *c_listing
            - *c_doc_title
            - *c_doc_reg
            - *c_doc_ins
            - *c_insp_front
            - *c_insp_rear
            - *c_insp_interior
            - *c_insp_roof
            - *c_insp_under
            - *c_verify_title
            - *c_verify_reg
            - *c_verify_ins
            - *c_submit
            - *c_list_approve
            - *c_fund
            - *c_campground
            - *c_booking_dropoff
            - *c_assign_1
          trigger:
            - call: "POST /rv-marketplace/delivery-assignments/${assignment1_id}/void"
              payload: { void_reason: "tow vehicle unavailable, renter will pick up" }
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "response 200"
            - "data.status == 'VOIDED'"
            - "GET /rv-marketplace/campgrounds/${campground_id} shows data.scheduled_assignment_count == 0"
            - "GET /rv-marketplace/bookings/${booking_id} shows data.delivery_fee_cents == 0, data.loyalty_tier == 'LOYALTY_TIER_1', data.loyalty_discount_cents == 5434, data.service_fee_cents == 15650 and data.quoted_total_cents == 146063"
            - "GET /rv-marketplace/delivery-assignments?campground_id=${campground_id}&status=SCHEDULED returns total_count == 0 and no promotion occurred"
