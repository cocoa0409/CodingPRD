            - "WaitlistEntry.${eoe}.status == EXPIRED_OFFER"
      - name: rights_decide_by_reviewer_rejected_two_person_rule
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RightsRequest.UNDER_REVIEW_to_DISMISSED
          - validations[priority=5]
          - errors.ERR_SO_DUTY_VIOLATION
        distinguishing_aspect: "The same LegalReviewer who began review cannot issue the final decision; a third party must decide. The two-person rule is distinct from the filer-cannot-review rule."
        test_recipe:
          setup:
            - "Work Wrr; request R filed by legal-a, begun by legal-b (UNDER_REVIEW)."
          setup_api_calls:
            - call: "POST /archive/works"
              payload: { title: "Two Person", author: "TP", publication_year: 2016 }
              as: Admin
              captures: { wrr: $.data.id }
            - call: "POST /archive/rights-requests"
              payload: { subject_kind: "WORK", work_id: "${wrr}", claimant_name: "TP Estate" }
              as: LegalReviewer
              as_user_id: "legal-a"
              captures: { rrr: $.data.id }
            - call: "POST /archive/rights-requests/${rrr}/begin-review"
              payload: {}
              as: LegalReviewer
              as_user_id: "legal-b"
          trigger:
            - call: "POST /archive/rights-requests/${rrr}/decide"
              payload: { decision: "DISMISS" }
              as: LegalReviewer
              as_user_id: "legal-b"
              captures: { tp_err: $.data.error_id }
          assert:
            - "tp_err == ERR_SO_DUTY_VIOLATION (403)"
            - "RightsRequest.${rrr}.status remains UNDER_REVIEW and decided_by is null"
      - name: begin_review_by_filer_rejected_sod
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=5]
          - state_machines.RightsRequest.FILED_to_UNDER_REVIEW
          - errors.ERR_SO_DUTY_VIOLATION
        distinguishing_aspect: "The filer of a rights request cannot begin its review (filer != reviewer), tested independently of the reviewer != decider rule."
        test_recipe:
          setup:
            - "Work Wsod; request filed by legal-a."
          setup_api_calls:
