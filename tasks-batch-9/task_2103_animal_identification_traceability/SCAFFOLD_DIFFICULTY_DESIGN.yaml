            - call: "POST /device-suppliers/${sup_bv}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_bv_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_bv}", premises_id: "${pb}", serial_start: 100000000001, serial_end: 100000000200, expected_supplier_version: "${sup_bv_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_bv}"
            - call: "GET /premises/${pb}"
              payload: {}
              as: Producer
              as_user_id: "${prod_bv}"
