          trigger:
            - call: "POST /labeling/compliance-audits"
              payload: { brand_id: "${brand_id}", scope: "STYLE_DOSSIER", audit_window_from: "2026-06-30T00:00:00Z", audit_window_to: "2026-01-01T00:00:00Z" }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and ${err} == \"ERR_INVALID_EFFECTIVE_WINDOW\""
            - "GET /labeling/compliance-audits?brand_id=${brand_id} returns total_count == 0"

      - name: style_code_is_unique_per_brand_and_reusable_across_brands
        claim_type: violation_to_error
        grounds:
          - validations[priority=81]
          - errors.ERR_DUPLICATE_STYLE_CODE
        distinguishing_aspect: "Uniqueness is the PAIR (brand_id, style_code): the second NL-4410 under the same brand is refused, while the same code under a different brand is accepted - a global unique index on style_code would wrongly refuse the second brand."
        test_recipe:
          setup:
            - "Market US is registered; two brands exist and the first already owns style NL-4410."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_a: $.data.id }
            - call: "POST /labeling/brands"
              payload: { legal_name: "Harborline Brands Inc", party_type: "BRAND_OWNER", rn_number: "RN67890", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_b: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_a}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_a}"
              captures: { style_a: $.data.id }
          trigger:
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_a}", style_code: "NL-4410", product_class: "KNIT_TOP", target_market_codes: ["US"], net_weight_grams: 200.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_a}"
              captures: { err: $.data.error_id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_b}", style_code: "NL-4410", product_class: "KNIT_TOP", target_market_codes: ["US"], net_weight_grams: 200.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_b}"
              captures: { style_b: $.data.id }
          assert:
            - "First trigger: HTTP 409 and ${err} == \"ERR_DUPLICATE_STYLE_CODE\""
            - "Second trigger: HTTP 201 and ${style_b} != ${style_a}"
            - "GET /labeling/brands/${brand_a}/styles returns total_count == 1"

      - name: trim_node_carrying_a_parent_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=80]
          - errors.ERR_MATERIAL_STAGE_ORDER
        distinguishing_aspect: "TRIM must be a root: the parent here is a live node of the same style, yet the node is still refused, because priority 80 requires parent_input_id to be null on TRIM - and TRIM rank 0 is below FIBER rank 1, so the strictly-increasing clause is breached too."
        test_recipe:
          setup:
            - "Market US is registered; style NL-4410 carries one FIBER root node."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "FIBER", country_code: "IN", value_added_usd: 2.00, weight_grams: 500.0, is_ornamentation: false }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n1_id: $.data.id }
          trigger:
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "TRIM", country_code: "FR", value_added_usd: 4.00, weight_grams: 30.0, is_ornamentation: false, parent_input_id: "${n1_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and ${err} == \"ERR_MATERIAL_STAGE_ORDER\""
            - "GET /labeling/material-inputs?style_id=${style_id} returns total_count == 1"

      - name: two_stacked_violations_answer_in_declared_priority_order
        claim_type: priority_ordering
        grounds:
          - validations[priority=45]
          - validations[priority=50]
          - validations[priority=95]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / approve_answers_state_then_segregation_then_durability_in_priority_order
          rationale: "The named §1.8 instance stacks three violations on one approval call and peels them off in priority order."

      - name: posture_gate_is_conditional_on_the_brand_ledger
        claim_type: violation_to_error
        grounds:
          - validations[priority=90]
          - errors.ERR_BRAND_POSTURE_SUSPENDED
        excluded_because:
          difficulty_instance: boundary_precision_check / suspension_ledger_threshold_is_strictly_greater_and_crossed_by_one_cent
          rationale: "The conditional posture gate and its strict-greater-than ledger boundary are asserted by the named §1.8 instance, including the refused call at exactly the threshold."

      - name: bench_capacity_is_an_aggregate_over_overlapping_reservations
        claim_type: violation_to_error
        grounds:
          - validations[priority=83]
          - errors.ERR_LAB_BENCH_CAPACITY
        excluded_because:
          difficulty_instance: resource_temporal_overlap / lab_bench_occupancy_is_closed_at_both_ends_with_capacity_two
          rationale: "Each reservation is individually legal while the third one breaches the aggregate; the named §1.8 instance walks that sequence."

      - name: published_window_overlap_is_a_temporal_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=84]
          - errors.ERR_LABEL_WINDOW_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / published_label_windows_are_half_open_so_touching_windows_are_allowed
          rationale: "The named §1.8 instance asserts both the refused overlap and the admitted touching window on the same style and market."

  - section: endpoints
    instances:
      - name: compliance_audit_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /labeling/compliance-audits]
          - endpoints[GET /labeling/compliance-audits/{id}]
          - endpoints[GET /labeling/compliance-audits]
        distinguishing_aspect: "The created audit reads back identically by id and appears in the filtered list; the three rollup counters are server-computed and start at 0/0/0 even though the caller may not supply them, and a state filter of CLOSED must return an empty page rather than the OPEN row."
        test_recipe:
          setup:
            - "One brand exists."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
          trigger:
            - call: "POST /labeling/compliance-audits"
              payload: { brand_id: "${brand_id}", scope: "STYLE_DOSSIER", audit_window_from: "2026-01-01T00:00:00Z", audit_window_to: "2026-12-31T00:00:00Z" }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { audit_id: $.data.id, state: $.data.state, open_cnt: $.data.open_finding_count, crit_cnt: $.data.critical_finding_count, scope_cnt: $.data.units_in_scope, closed_at: $.data.closed_at }
            - call: "GET /labeling/compliance-audits/${audit_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { read_state: $.data.state, read_scope: $.data.scope, read_from: $.data.audit_window_from }
            - call: "GET /labeling/compliance-audits?brand_id=${brand_id}&state=OPEN"
              payload: {}
              as: ComplianceAdmin
            - call: "GET /labeling/compliance-audits?brand_id=${brand_id}&state=CLOSED"
              payload: {}
              as: ComplianceAdmin
          assert:
            - "HTTP 201 with ${state} == \"OPEN\", ${open_cnt} == 0, ${crit_cnt} == 0, ${scope_cnt} == 0 and ${closed_at} == null"
            - "${read_state} == \"OPEN\", ${read_scope} == \"STYLE_DOSSIER\" and ${read_from} == \"2026-01-01T00:00:00Z\""
            - "The OPEN listing returns exactly 1 row whose id == \"${audit_id}\" with total_count == 1 and has_more == false"
            - "The CLOSED listing returns 0 rows with total_count == 0"

      - name: compliance_summary_reports_every_blocking_reason_of_a_bare_style
        claim_type: computed_read
        grounds:
          - endpoints[GET /labeling/styles/{id}/compliance-summary]
          - calculations.durability_adequacy
          - entities.Style.fields.label_readiness
