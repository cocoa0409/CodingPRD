          setup:
            - "Fixture F1 published: EFFECT_PERIOD run R1 with modeled_sales_units 23000, A_SEARCH contribution_units 3653.3333 and B_SOCIAL 2014.2857."
            - "Experiment E1 on A_SEARCH is AUDIENCE_SPLIT with arms 245000/245000, was read out with treatment_conversions 5145, control_conversions 4900, pre_treatment_conversions 4655 and pre_control_conversions 4900 (measured_lift_pct 10.00, lift_ci_low_pct 6.03), and was ACCEPTED by AnalyticsLead al-1 (the designer is ed-1, so segregation of duties is satisfied)."
            - "The run version is read and captured after the accept so the OCC field carries a server-observed value; the accept itself did not bump it because the run's calibration_status is NOT_REQUIRED rather than CALIBRATED."
            - "23000 - 3653.3333 = 19346.6667 and 100 * 3653.3333 / 19346.6667 = 18.8835; 10.00 / 18.8835 = 0.5296, which is below 1 - 0.05 and therefore OVER_ATTRIBUTED."
