      - name: payment_reversal_restores_coverage_term_capacity_without_resurrecting_the_suspended_sibling
        grounds:
          - calculations.coverage_limit_conservation
          - state_machines.CoverageTerm.LIMIT_EXHAUSTED_to_OPEN
          - state_machines.Claim.INSURER_ADJUDICATION_to_SUSPENDED_NO_LIMIT
          - endpoints.POST_/warranty/claims/{id}/payment-reversals
          - endpoints.POST_/warranty/policies/{id}/coverage-terms
        distinguishing_aspect: |
          Conserved quantity #2 - a DIFFERENT invariant on a different entity:
          CoverageTerm.consumed_limit_cents + CoverageTerm.remaining_limit_cents ==
          CoverageTerm.limit_cents, restored to 1000000 + 1000000 == 2000000 by the reversal, with
          the term crossing OPEN -> LIMIT_EXHAUSTED -> OPEN. The pinned subtlety is that the
          compensation is deliberately PARTIAL in scope: the capacity invariant is restored exactly,
          but the sibling claim that CASCADE link 4 force-suspended is NOT resurrected - it stays
          SUSPENDED_NO_LIMIT with its 1000000 sitting in released_cents. So one invariant must be
          perfectly conserved while a different quantity (the builder's incurred loss, which excludes
          released) legitimately does NOT return to its pre-payment value. An implementation that
          "undoes everything" resurrects the sibling and is wrong; one that skips the term restore
          leaves remaining at 0 and is also wrong.
        test_recipe:
          setup:
            - "the canonical class-C builder APPROVED and the canonical 44500000 policy ACTIVE and PAID, premium_cents 363894"
            - "an ENDORSEMENT WORKMANSHIP term added at clock 2026-08-15, running 2028-09-01 through 2030-08-31, limit_cents 2000000, deductible_cents 100000, disjoint from the BASE WORKMANSHIP term that ended 2027-08-14"
            - "logical clock then moved to 2028-09-15T00:00:00Z, past builder_obligation_end_date 2028-08-14, so WORKMANSHIP claims route to the insurer arm on the endorsement term"
            - "two claims on that endorsement term, each claimed_amount_cents 3000000 at substantiation_ratio 1.00: gross 3000000, deductible 100000, provisional_net 2900000, betterment 232000, and the step-7 cap pulls net_payable to the remaining limit 2000000 for both; both routed and APPROVED by adjuster-001"
          setup_api_calls:
            - call: "POST /warranty/builders"
              payload: { company_name: "Cedar Ridge Homes", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 94, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b1: $.data.id }
            - call: "POST /warranty/builders/${b1}/submission"
