# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3085_endorsement_based_zero_interest_microloan_crowdfunding
# 9 difficulty rules x 2 instances each = 18 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 and is reachable from
# empty-DB via the declared §1.5 endpoints. Logical clock default is
# 2026-09-01T00:00:00Z; setups pin it explicitly.
# =============================================================================
scaffold_difficulty_design:

