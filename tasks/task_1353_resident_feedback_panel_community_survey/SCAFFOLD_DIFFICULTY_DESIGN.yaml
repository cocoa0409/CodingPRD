            - "a3_avail == 48000 and a3_res == 0 and a3_paid == 2000 and a3_avail + a3_res + a3_paid == 50000"

      - name: cell_reserved_count_live_invitation_conservation
        grounds:
          - entities.PanelCell.fields.reserved_count
          - state_machines.Invitation
        distinguishing_aspect: |
          Conserved quantity: headcount equality — cell.reserved_count must equal the
          number of live SENT invitations into the cell at every step: dispatch +1,
          decline -1, completion -1, wave-close expiry -1; dispatch-then-compensate
          pairs leave the count unchanged (no drift).
        test_recipe:
          setup:
            - "Cell target 10; P1,P2,P3 ACTIVE; locked instrument; wave FIELDING 08-03, closes 08-10"
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 10 }, as: PanelManager, captures: { c1_id: $.data.id } }
