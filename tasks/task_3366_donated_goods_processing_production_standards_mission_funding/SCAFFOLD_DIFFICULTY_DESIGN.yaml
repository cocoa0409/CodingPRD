              captures: { prog_id: $.data.id }
            - call: "GET /donated-goods/member-orgs/${org_id}"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { org_v1: $.data.version }
            - call: "POST /donated-goods/funding-allocations"
              payload: { mission_program_id: "${prog_id}", amount_cents: 1500, expected_member_org_version: "${org_v1}" }
