    roles: [Customer, ShopManager]
    code: 200
    input: ["limit?", "offset?"]
    output: CreditLedgerEntry[]
    side_effects: []
  # --- Logical clock (test-driving) ---
  - method: POST
    path: /golf-shop/_clock/set_current_utc
    description: "Set the server's logical clock. Startup default is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. All entity created_at/updated_at timestamps are stamped from this logical clock. Setting the clock runs all time-based sweeps: OFFERED appraisals past offer_expires_at -> EXPIRED; RESERVED listings past reserved_until -> LISTED; ACTIVE/EXHAUSTED packages past expires_at -> EXPIRED; BOOKED sessions with ends_at < now -> NO_SHOW"
    roles: [ShopAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["time-based sweeps as described"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_VALIDATION, http: 400, condition: "Request body shape invalid: missing required field, bad enum, starts_at >= ends_at, warranty xor violated, MARKET_COMP without per-club market_comps_cents, DENIED decision without denial_reason" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed actor does not own the target resource" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer id does not exist" }
  - { id: ERR_STAFF_NOT_FOUND, http: 404, condition: "staff id does not exist" }
  - { id: ERR_BAY_NOT_FOUND, http: 404, condition: "bay id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "fitting session id does not exist" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "lesson package id does not exist" }
  - { id: ERR_SPEC_NOT_FOUND, http: 404, condition: "build spec id does not exist" }
  - { id: ERR_COMPONENT_ITEM_NOT_FOUND, http: 404, condition: "component item id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "component order id does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "repair ticket id does not exist" }
  - { id: ERR_APPRAISAL_NOT_FOUND, http: 404, condition: "trade-in appraisal id does not exist" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "used club listing id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "warranty claim id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Requested transition is not defined from the entity's current state (incl. any trigger from a terminal state)" }
  - { id: ERR_SPEC_NOT_QUOTED, http: 409, condition: "approve called on a spec not in QUOTED" }
  - { id: ERR_SPEC_NOT_IN_BUILD, http: 409, condition: "mark-ready called on a spec not in IN_BUILD" }
  - { id: ERR_SPEC_NOT_READY, http: 409, condition: "deliver called on a spec not in READY" }
  - { id: ERR_SESSION_NOT_BOOKED, http: 409, condition: "check-in or cancel called on a session not in BOOKED" }
  - { id: ERR_SESSION_NOT_CHECKED_IN, http: 409, condition: "complete called on a session not in CHECKED_IN" }
  - { id: ERR_TICKET_NOT_QUOTED, http: 409, condition: "approve called on a ticket not in QUOTED" }
  - { id: ERR_TICKET_NOT_APPROVED, http: 409, condition: "start-work called on a ticket not in APPROVED" }
  - { id: ERR_TICKET_NOT_IN_PROGRESS, http: 409, condition: "submit-qc called on a ticket not in IN_PROGRESS" }
  - { id: ERR_TICKET_NOT_READY, http: 409, condition: "pickup called on a ticket not in READY" }
  - { id: ERR_APPRAISAL_NOT_OFFERED, http: 409, condition: "accept/decline called on an appraisal not in OFFERED" }
  - { id: ERR_LISTING_NOT_LISTED, http: 409, condition: "reserve or adjust-price called on a listing not in LISTED" }
  - { id: ERR_LISTING_RESERVED_BY_OTHER, http: 409, condition: "purchase called on a RESERVED listing by a customer other than reserved_by" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "decide called on a claim not in SUBMITTED" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 409, condition: "resolve called on a claim not in APPROVED" }
  - { id: ERR_CLAIM_NOT_DENIED, http: 409, condition: "appeal called on a claim not in DENIED" }
  - { id: ERR_SUBJECT_NOT_CLAIMABLE, http: 409, condition: "warranty subject not in DELIVERED (spec) or PICKED_UP (ticket)" }
  - { id: ERR_PACKAGE_NOT_ACTIVE, http: 409, condition: "lesson package not in ACTIVE (EXPIRED) when a booking tries to consume it" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "adjust-price attempted by the staff member who appraised the listing" }
  - { id: ERR_BAY_UNAVAILABLE, http: 409, condition: "check-in while bay is in MAINTENANCE" }
  - { id: ERR_BAY_TIME_CONFLICT, http: 409, condition: "session violates the bay's buffered half-open overlap rule" }
  - { id: ERR_SPECIALIST_TIME_CONFLICT, http: 409, condition: "session violates the specialist's closed-interval overlap rule" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 422, condition: "warranty subject older than the claimable window (spec > 365d, ticket > 30d)" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "spend/booking action by a SUSPENDED customer (spec approve, ticket approve, listing reserve/purchase)" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 402, condition: "CREDIT payment exceeds customer credit_balance_cents" }
  - { id: ERR_NO_CREDITS_REMAINING, http: 422, condition: "booking with a package whose credits_used == total_credits" }
  - { id: ERR_DEPOSIT_REQUIRED, http: 422, condition: "start-work while payment_status == UNPAID" }
  - { id: ERR_PAYMENT_SEQUENCE, http: 409, condition: "payment kind does not match the expected next step (BALANCE while UNPAID, DEPOSIT while DEPOSIT_PAID, any payment while PAID/REFUNDED)" }
  - { id: ERR_TICKET_UNPAID, http: 422, condition: "pickup while payment_status != PAID" }
  - { id: ERR_RESHAFT_REQUIRES_SHAFT_ITEM, http: 400, condition: "RESHAFT ticket without shaft_item_id, or shaft_item_id pointing at a non-SHAFT item" }
  - { id: ERR_COMPONENT_TYPE_MISMATCH, http: 400, condition: "spec component item's component_type does not match its slot (head/shaft/grip)" }
  - { id: ERR_COMPONENT_SHORTAGE, http: 409, condition: "start-work when the required shaft has stock_on_hand < 1" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 422, condition: "appeal when appeal_count >= 2" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "an open (SUBMITTED or APPROVED) claim already exists for the same subject" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Golf shop customer; owns sessions, specs, tickets, appraisals, claims"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "approve build specs and repair tickets"
      - "make ticket payments"
      - "submit/accept/decline trade-in appraisals"
      - "reserve/purchase used-club listings"
      - "file and appeal warranty claims"
    shared_operations:
      - "create fitting sessions and repair tickets (with RepairTechnician/FittingSpecialist)"
      - "read own resources and public listings"
      - "cancel own sessions/specs/tickets"
  - name: FittingSpecialist
    description: "Runs fitting sessions and authors build specs and trade-in offers"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "create/quote build specs"
      - "check in / complete fitting sessions"
      - "issue trade-in offers"
    shared_operations:
      - "create fitting sessions (with Customer)"
      - "deliver build specs (with ShopManager)"
      - "read operational resources"
  - name: RepairTechnician
    description: "Works repair tickets and finishes builds"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "start work and submit QC on repair tickets"
      - "mark build specs ready"
    shared_operations:
      - "create repair tickets (with Customer)"
      - "read operational resources"
  - name: Instructor
    description: "Teaching professional; read-only visibility into lesson packages and sessions"
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations:
      - "read lesson packages and fitting sessions"
  - name: ShopManager
    description: "Store manager; administers customers, staff-facing inventory, pricing, and warranty decisions"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "suspend/reactivate customers"
      - "manage bays and component items, record stock receipts"
      - "sell lesson packages"
      - "adjust listing prices (subject to segregation of duties)"
      - "decide and resolve warranty claims"
    shared_operations:
      - "issue trade-in offers (with FittingSpecialist)"
      - "deliver build specs (with FittingSpecialist)"
      - "cancel sessions (with Customer/FittingSpecialist)"
  - name: ShopAdmin
    description: "Platform operator; bootstraps customers/staff and drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "onboard staff"
      - "set the logical clock"
    shared_operations:
      - "register customers (with ShopManager)"
      - "read customers, sessions, listings"
