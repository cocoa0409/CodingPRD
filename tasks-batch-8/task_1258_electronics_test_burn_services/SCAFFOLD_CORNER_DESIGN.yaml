            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "RD-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { u1: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "RD-2" }, as: OperationsManager, as_user_id: "ops-1", captures: { u2: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
