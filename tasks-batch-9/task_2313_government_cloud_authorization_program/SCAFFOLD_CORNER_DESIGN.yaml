    excluded_because:
      difficulty_instance: package_submit_waits_for_the_engagement_to_reach_report_delivered
      rationale: 'Both sides of the gate are asserted there: refused while TESTING, accepted after REPORT_DELIVERED.'
  - name: verification_is_blocked_while_a_deviation_is_still_undecided
    claim_type: cross_entity
    grounds:
    - validations[priority=15]
    - errors[ERR_DEVIATION_PENDING_ON_ITEM]
    excluded_because:
      difficulty_instance: verify_close_waits_for_the_pending_deviation_to_be_decided
