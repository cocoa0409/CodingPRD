scenario: "IRS Tax Installment Agreement: taxpayer debt, installment types (Short/Long/PPIA), automatic debit (DDIA), CSED statute of limitations, Offer in Compromise, Lien release, Currently Not Collectible."
domain_name: "irs-installment-agreement"
api_prefix: "/collections"

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "Dual-variant calculation"
    - "Cascading side effects"
    - "Rate / threshold triggers"
    - "Scheduled / deferred actions"
    - "Ops-run checkpoint"
    - "Compliance / audit (segregation of duties)"
  entity_topology: "flat"
  state_machine_shape: "branching"
  relationship_patterns:
    - "one_to_many"
    - "cross_aggregate"
    - "self_referential"   # ReconsiderationRequest references prior InstallmentAgreement
  role_model: "segregation_of_duties"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Taxpayer
    parent: null
    common_fields: true
    fields:
      - name: tin
        type: string
        source: input
        description: "Taxpayer identification number (SSN/EIN). Server-validated format (9 digits)."
        constraints: "Unique; 9 digits; immutable."
      - name: filing_status
        type: enum
        source: input
        description: "IRS filing status."
        constraints: "Enum: SINGLE, MARRIED_JOINT, MARRIED_SEPARATE, HEAD_OF_HOUSEHOLD."
      - name: monthly_disposable_income_cents
        type: integer
        source: input
        description: "Net monthly disposable income (income minus allowable expenses), in cents."
        constraints: ">= 0; required for PPIA and CNC evaluation."
      - name: total_assessed_debt_cents
        type: integer
        source: computed
        description: "Sum of TaxLiability.current_balance_cents over all liabilities for this taxpayer, recomputed on every mutation to any of them."
        constraints: ">= 0; cents."
      - name: collection_status
        type: enum
        source: computed
        description: "Derived posture across all open tax matters."
        constraints: "Enum: ACTIVE, IN_AGREEMENT, IN_OIC_REVIEW, IN_COMPROMISE, CNC, PAID_IN_FULL. Initial: ACTIVE."

  - name: TaxLiability
    parent: null
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK to Taxpayer.id."
        constraints: "Required; immutable."
      - name: tax_year
        type: integer
        source: input
        description: "Tax year (YYYY) the liability is for."
        constraints: "1900 <= tax_year <= current_year - 1."
      - name: assessment_date
        type: datetime
        source: input
        description: "Date the IRS formally assessed the tax (ISO 8601 UTC). Anchors CSED."
        constraints: "Required; immutable after creation."
      - name: original_assessed_amount_cents
        type: integer
        source: input
        description: "Principal tax assessed (cents)."
        constraints: "> 0; immutable."
      - name: accrued_interest_cents
        type: integer
        source: computed
        description: "Cumulative interest accrued through last monthly accrual cycle."
        constraints: ">= 0."
      - name: accrued_penalty_cents
        type: integer
        source: computed
        description: "Cumulative failure-to-pay penalties accrued through last cycle."
        constraints: ">= 0."
      - name: payments_applied_cents
        type: integer
        source: computed
        description: "Total payments allocated to this liability."
        constraints: ">= 0."
      - name: current_balance_cents
        type: integer
        source: computed
        description: "original_assessed_amount_cents + accrued_interest_cents + accrued_penalty_cents - payments_applied_cents."
        constraints: ">= 0; floors at 0 once paid in full."
      - name: csed_base_date
        type: datetime
        source: computed
        description: "assessment_date + 10 years (ISO 8601 UTC). Statutory baseline CSED."
        constraints: "Set at creation; never re-derived."
      - name: csed_effective_date
        type: datetime
        source: computed
        description: "csed_base_date plus the sum of all tolling intervals from CSEDTollingEvent for this liability."
        constraints: "Recomputed on every tolling-event create/close."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle status of this liability."
        constraints: "Enum: OPEN, IN_AGREEMENT, IN_COMPROMISE, CNC, EXPIRED, PAID. Initial: OPEN."
      - name: last_accrual_cycle_date
        type: datetime
        source: system
        description: "End-of-month date of the most recent monthly accrual cycle that has been applied."
        constraints: "Nullable until first cycle."

  - name: InstallmentAgreement
    parent: null
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK to Taxpayer.id."
      - name: liability_ids
        type: array
        source: input
        description: "Array of TaxLiability.id values covered by this agreement. Must all belong to taxpayer_id and be status IN {OPEN, IN_AGREEMENT}."
        constraints: "Length >= 1."
      - name: agreement_type
        type: enum
        source: computed
        description: "Type determined by aggregate debt and proposed monthly amount at creation."
        constraints: "Enum: SHORT_TERM, LONG_TERM, PPIA."
      - name: proposed_monthly_payment_cents
        type: integer
        source: input
        description: "Taxpayer's monthly installment amount (cents)."
        constraints: "> 0."
      - name: payment_method
        type: enum
        source: input
        description: "Payment delivery channel."
        constraints: "Enum: CHECK, DDIA, PAYROLL_DEDUCTION."
      - name: ddia_bank_account_last4
        type: string
        source: input
        description: "Last 4 digits of bank account for DDIA. Required when payment_method == DDIA."
        constraints: "Exactly 4 digits when present; otherwise null."
      - name: next_due_date
        type: datetime
        source: computed
        description: "Date the next installment payment is due (ISO 8601 UTC). First due 30 days after activation."
        constraints: "Advances on payment receipt."
      - name: planned_payoff_date
        type: datetime
        source: computed
        description: "Projected date the agreement satisfies the debt, computed at activation. For PPIA this may be after csed_effective_date."
        constraints: "Pin at activation; never auto-mutated except on reconsideration."
      - name: missed_payment_count
        type: integer
        source: computed
        description: "Consecutive missed monthly payments. Reset to 0 on any successful payment."
        constraints: ">= 0; default 0."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state."
        constraints: "Enum: PENDING, ACTIVE, DEFAULTED, TERMINATED, COMPLETED. Initial: PENDING."

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK to InstallmentAgreement.id. Nullable when payment is direct against liability outside an agreement (e.g., OIC down payment)."
      - name: taxpayer_id
        type: string
        source: input
        description: "FK to Taxpayer.id."
        constraints: "Required."
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in cents."
        constraints: "> 0."
      - name: received_at
        type: datetime
        source: input
        description: "Date the payment was received (ISO 8601 UTC)."
      - name: payment_kind
        type: enum
        source: input
        description: "Categorization for allocation."
        constraints: "Enum: INSTALLMENT, OIC_DEPOSIT, OIC_INSTALLMENT, LUMP_SUM."
      - name: allocation
        type: array
        source: computed
        description: "Per-liability breakdown: [{ liability_id, applied_cents }]. Allocation rule pinned in §1.3 calc payment_allocation."
        constraints: "Sum of applied_cents == amount_cents."

  - name: OfferInCompromise
    parent: null
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK to Taxpayer.id."
      - name: liability_ids
        type: array
        source: input
        description: "Array of TaxLiability.id values the OIC seeks to compromise. All must be status IN {OPEN, IN_AGREEMENT, CNC}."
        constraints: "Length >= 1."
      - name: offer_amount_cents
        type: integer
        source: input
        description: "Taxpayer's compromise amount in cents."
        constraints: "> 0."
      - name: deposit_paid_cents
        type: integer
        source: computed
        description: "20% non-refundable deposit required at submission, paid via a Payment with payment_kind=OIC_DEPOSIT."
        constraints: ">= 0."
      - name: rcp_cents
        type: integer
        source: computed
        description: "Reasonable Collection Potential, computed per §1.3 calc rcp_calculation."
        constraints: ">= 0."
      - name: status
        type: enum
        source: computed
        description: "OIC lifecycle."
        constraints: "Enum: DRAFT, SUBMITTED, UNDER_REVIEW, ACCEPTED, REJECTED, WITHDRAWN. Initial: DRAFT."
      - name: decision_officer_id
        type: string
        source: input
        description: "ID of the OICOfficer who issued ACCEPT or REJECT decision."
        constraints: "Set on transition into ACCEPTED or REJECTED; must differ from the OICOfficer who set UNDER_REVIEW (segregation of duties)."
      - name: submitted_at
        type: datetime
        source: system
        description: "Timestamp the OIC entered SUBMITTED status. Anchors a CSEDTollingEvent."
        constraints: "Nullable until SUBMITTED."

  - name: FederalTaxLien
    parent: null
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK to Taxpayer.id."
      - name: liability_ids
        type: array
        source: input
        description: "Array of TaxLiability.id values secured by the lien."
        constraints: "Length >= 1; all must belong to taxpayer_id."
      - name: filed_date
        type: datetime
        source: input
        description: "Date of Notice of Federal Tax Lien filing (ISO 8601 UTC)."
      - name: status
        type: enum
        source: computed
        description: "Lien lifecycle."
        constraints: "Enum: FILED, WITHDRAWN, RELEASED. Initial: FILED."
      - name: released_at
        type: datetime
        source: system
        description: "Auto-set when status flips to RELEASED."
        constraints: "Nullable while FILED."
      - name: release_reason
        type: enum
        source: system
        description: "Why the lien was released."
        constraints: "Enum: PAID_IN_FULL, OIC_ACCEPTED, CSED_EXPIRED, ADMIN_RELEASE. Nullable until release."

  - name: CSEDTollingEvent
    parent: null
    common_fields: false
    fields:
      - name: liability_id
        type: string
        source: input
        description: "FK to TaxLiability.id."
        constraints: "Required; immutable."
      - name: event_kind
        type: enum
        source: input
        description: "Source of the CSED tolling."
        constraints: "Enum: OIC_PENDING, CNC_HARDSHIP, INSTALLMENT_PENDING, BANKRUPTCY, MANUAL_ADJUSTMENT."
      - name: start_date
        type: datetime
        source: input
        description: "Start of the tolling interval (inclusive, ISO 8601 UTC)."
      - name: end_date
        type: datetime
        source: input
        description: "End of the tolling interval (exclusive). Nullable while event is open."
      - name: source_ref
        type: string
        source: input
        description: "ID of the OIC, IA, or CNC record that triggered this tolling, when applicable."

  - name: ReconsiderationRequest
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK to InstallmentAgreement.id whose terms are being reconsidered."
      - name: prior_request_id
        type: string
        source: input
        description: "Self-referential FK to a prior ReconsiderationRequest, if any (chained re-evaluations)."
        constraints: "Nullable; must reference a record on the same agreement_id."
      - name: reason
        type: enum
        source: input
        description: "Why the taxpayer is requesting reconsideration."
        constraints: "Enum: HARDSHIP, INCOME_CHANGE, OIC_DENIED_REVERT, MISSED_PAYMENT_CURE."
      - name: status
        type: enum
        source: computed
        description: "Reconsideration lifecycle."
        constraints: "Enum: PENDING, APPROVED, DENIED. Initial: PENDING."
      - name: decision_officer_id
        type: string
        source: input
        description: "ID of the IRSOfficer who decided. Must differ from the IRSOfficer who originally activated the underlying agreement (segregation of duties)."
        constraints: "Nullable until decision."

  - name: CNCStatus
    parent: null
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK to Taxpayer.id."
      - name: liability_ids
        type: array
        source: input
        description: "Array of TaxLiability.id values placed in CNC."
        constraints: "Length >= 1."
      - name: hardship_reason
        type: enum
        source: input
        description: "Documented hardship category."
        constraints: "Enum: UNEMPLOYMENT, MEDICAL, NEGATIVE_DISPOSABLE_INCOME, OTHER."
      - name: effective_date
        type: datetime
        source: system
        description: "Date CNC was effected."
      - name: review_due_date
        type: datetime
        source: computed
        description: "effective_date + 24 months. Scheduled mandatory review."
      - name: status
        type: enum
        source: computed
        description: "CNC lifecycle."
        constraints: "Enum: ACTIVE, REVERSED, EXPIRED. Initial: ACTIVE."

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:

  # ---- InstallmentAgreement ----
  - entity: InstallmentAgreement
    initial_state: PENDING
    terminal_states: [TERMINATED, COMPLETED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /collections/installment-agreements/{id}/activate"
        actor: IRSOfficer
        preconditions:
          - "agreement.status == PENDING"
          - "All liability_ids belong to taxpayer_id and are in status IN {OPEN, IN_AGREEMENT}"
          - "For agreement_type==SHORT_TERM: proposed_monthly_payment_cents * 4 (max 120 days) >= sum(current_balance_cents)"
          - "For agreement_type==LONG_TERM: total assessed debt across liability_ids <= 5_000_000 (i.e., $50,000) AND projected payoff <= csed_effective_date_min of covered liabilities"
          - "For agreement_type==PPIA: taxpayer.monthly_disposable_income_cents <= proposed_monthly_payment_cents AND projected payoff > csed_effective_date_min"
          - "If payment_method==DDIA, ddia_bank_account_last4 is set"
          - "If aggregate debt > 2_500_000 (i.e., $25,000), payment_method MUST be DDIA"
        side_effects:
          - "TaxLiability.status: each covered liability transitions OPEN→IN_AGREEMENT"
          - "Taxpayer.collection_status recomputed (becomes IN_AGREEMENT if at least one covered liability is IN_AGREEMENT)"
          - "Compute and persist InstallmentAgreement.next_due_date = activation_date + 30 days"
          - "Compute and persist InstallmentAgreement.planned_payoff_date per §1.3 calc payoff_projection"
          - "Close any open INSTALLMENT_PENDING CSEDTollingEvent for each covered liability (set end_date := activation_date)"
          - "TaxLiability.csed_effective_date recomputed per §1.3 calc csed_calculation for each covered liability"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /collections/installment-agreements/{id}/record-payment (system-recorded monthly receipt)"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "payment.amount_cents > 0"
        side_effects:
          - "Allocate payment per §1.3 calc payment_allocation across liability_ids"
          - "TaxLiability.payments_applied_cents increments by per-liability allocation; current_balance_cents recomputed"
          - "InstallmentAgreement.next_due_date += 30 days"
          - "InstallmentAgreement.missed_payment_count := 0"

      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /_sweep/run (automatic, when missed_payment_count >= 3 OR new tax liability is assessed against the taxpayer)"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "missed_payment_count >= 3 OR a TaxLiability for taxpayer_id was created with status==OPEN after agreement.activation_date"
        side_effects:
          - "Taxpayer.collection_status recomputed"
          - "Open a CSEDTollingEvent for each covered liability with event_kind==INSTALLMENT_PENDING (start_date := now)"

      - from: DEFAULTED
        to: ACTIVE
        trigger: "POST /collections/reconsideration-requests/{id}/decide with status=APPROVED"
        actor: IRSOfficer
        preconditions:
          - "agreement.status == DEFAULTED"
          - "ReconsiderationRequest.status == APPROVED for this agreement_id"
          - "decision_officer_id != the IRSOfficer who originally activated this agreement"
        side_effects:
          - "Reset missed_payment_count := 0"
          - "Recompute planned_payoff_date"
          - "Close any open INSTALLMENT_PENDING CSEDTollingEvent on covered liabilities"
          - "TaxLiability.csed_effective_date recomputed"

      - from: DEFAULTED
        to: TERMINATED
        trigger: "POST /collections/installment-agreements/{id}/terminate"
        actor: IRSOfficer
        preconditions:
          - "agreement.status == DEFAULTED"
          - "No PENDING ReconsiderationRequest exists for this agreement"
        side_effects:
          - "Each covered liability transitions IN_AGREEMENT→OPEN (if still has balance > 0) or PAID (if balance == 0)"
          - "Taxpayer.collection_status recomputed"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /collections/installment-agreements/{id}/record-payment when post-allocation sum of covered liabilities' current_balance_cents == 0"
        actor: system
        preconditions:
          - "After applying payment allocation, sum(TaxLiability.current_balance_cents for liability_ids) == 0"
        side_effects:
          - "Each covered liability transitions IN_AGREEMENT→PAID"
          - "Taxpayer.collection_status recomputed; becomes PAID_IN_FULL iff every liability of taxpayer is PAID"
          - "FederalTaxLien covering ANY of the covered liabilities transitions FILED→RELEASED with release_reason=PAID_IN_FULL, IF AND ONLY IF every liability_id on that lien is now PAID"

      - from: ACTIVE
        to: TERMINATED
        trigger: "Automatic from OIC.status: DRAFT/SUBMITTED→ACCEPTED side effect"
        actor: system
        preconditions:
          - "An OfferInCompromise covering any liability in this agreement transitioned to ACCEPTED"
        side_effects:
          - "Covered liabilities present in the OIC transition IN_AGREEMENT→IN_COMPROMISE"
          - "Covered liabilities NOT in the OIC revert IN_AGREEMENT→OPEN"

  # ---- OfferInCompromise ----
  - entity: OfferInCompromise
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /collections/offers-in-compromise/{id}/submit"
        actor: Taxpayer
        preconditions:
          - "oic.status == DRAFT"
          - "A Payment with payment_kind=OIC_DEPOSIT exists for this OIC with amount_cents >= ceil(offer_amount_cents * 0.20). The OIC rejects submission otherwise."
          - "All liability_ids belong to taxpayer_id and are in status IN {OPEN, IN_AGREEMENT, CNC}"
        side_effects:
          - "Persist submitted_at := now"
          - "Open a CSEDTollingEvent for each covered liability with event_kind=OIC_PENDING (start_date := now)"
          - "TaxLiability.csed_effective_date recomputed for each covered liability"
          - "Taxpayer.collection_status recomputed (becomes IN_OIC_REVIEW)"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /collections/offers-in-compromise/{id}/take-up (officer claims the case)"
        actor: OICOfficer
        preconditions:
          - "oic.status == SUBMITTED"
        side_effects:
          - "Record claiming officer id internally (not the decision_officer_id)"

      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /collections/offers-in-compromise/{id}/decide with decision=ACCEPT"
        actor: OICOfficer
        preconditions:
          - "oic.status == UNDER_REVIEW"
          - "decision_officer_id != the OICOfficer who took up the case (segregation of duties)"
          - "offer_amount_cents >= rcp_cents (per §1.3 calc rcp_calculation)"
        side_effects:
          - "Each covered liability transitions to IN_COMPROMISE"
          - "Close OIC_PENDING CSEDTollingEvent (set end_date := now) for each covered liability"
          - "TaxLiability.csed_effective_date recomputed"
          - "Any FederalTaxLien whose liability_ids are ALL in IN_COMPROMISE or PAID transitions FILED→RELEASED with release_reason=OIC_ACCEPTED"
          - "Any ACTIVE InstallmentAgreement covering ANY of the OIC's liability_ids cascades into TERMINATED (split: in-OIC liabilities go to IN_COMPROMISE; out-of-OIC liabilities revert to OPEN)"
          - "After offer_amount_cents is paid (via subsequent OIC_INSTALLMENT payments), liabilities transition IN_COMPROMISE→PAID"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /collections/offers-in-compromise/{id}/decide with decision=REJECT"
        actor: OICOfficer
        preconditions:
          - "oic.status == UNDER_REVIEW"
          - "decision_officer_id != the OICOfficer who took up the case"
        side_effects:
          - "Close OIC_PENDING CSEDTollingEvent for each covered liability"
          - "TaxLiability.csed_effective_date recomputed"
          - "Taxpayer.collection_status recomputed (reverts as appropriate)"
          - "Deposit (Payment with payment_kind=OIC_DEPOSIT) is non-refundable: allocated as LUMP_SUM against covered liabilities per §1.3 payment_allocation"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /collections/offers-in-compromise/{id}/withdraw (also valid from UNDER_REVIEW)"
        actor: Taxpayer
        preconditions:
          - "oic.status IN {SUBMITTED, UNDER_REVIEW}"
        side_effects:
          - "Close OIC_PENDING CSEDTollingEvent for each covered liability"
          - "TaxLiability.csed_effective_date recomputed"
          - "Deposit non-refundable: allocated as LUMP_SUM per §1.3 payment_allocation"

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /collections/offers-in-compromise/{id}/withdraw"
        actor: Taxpayer
        preconditions:
          - "oic.status == UNDER_REVIEW"
        side_effects:
          - "Same as SUBMITTED→WITHDRAWN"

  # ---- TaxLiability ----
  - entity: TaxLiability
    initial_state: OPEN
    terminal_states: [PAID, EXPIRED]
    transitions:
      - from: OPEN
        to: IN_AGREEMENT
        trigger: "Side effect of InstallmentAgreement PENDING→ACTIVE"
        actor: system
        preconditions:
          - "liability.status == OPEN"
        side_effects:
          - "Taxpayer.total_assessed_debt_cents recomputed (no-op in cents; status changes only)"
          - "Taxpayer.collection_status recomputed"

      - from: IN_AGREEMENT
        to: OPEN
        trigger: "Side effect of InstallmentAgreement DEFAULTED→TERMINATED OR OIC ACCEPTED (for liabilities not in OIC)"
        actor: system
        preconditions:
          - "liability.status == IN_AGREEMENT"
          - "liability.current_balance_cents > 0"
        side_effects:
          - "Taxpayer.collection_status recomputed"

      - from: IN_AGREEMENT
        to: PAID
        trigger: "Side effect of payment allocation reducing current_balance_cents to 0"
        actor: system
        preconditions:
          - "liability.current_balance_cents == 0 after allocation"
        side_effects:
          - "Taxpayer.collection_status recomputed; becomes PAID_IN_FULL iff every liability of taxpayer is PAID"
          - "FederalTaxLien.release_check cascade (see lien transition)"

      - from: OPEN
        to: PAID
        trigger: "Side effect of LUMP_SUM Payment allocation reducing current_balance_cents to 0"
        actor: system
        preconditions:
          - "liability.current_balance_cents == 0 after allocation"
        side_effects:
          - "Same cascade as above"

      - from: OPEN
        to: CNC
        trigger: "POST /collections/cnc-statuses (CNCStatus created and ACTIVE)"
        actor: IRSOfficer
        preconditions:
          - "liability.status == OPEN"
          - "Taxpayer.monthly_disposable_income_cents <= 0 (per §1.3 calc cnc_eligibility)"
        side_effects:
          - "Open a CSEDTollingEvent with event_kind=CNC_HARDSHIP for each covered liability"
          - "TaxLiability.csed_effective_date recomputed"

      - from: CNC
        to: OPEN
        trigger: "POST /collections/cnc-statuses/{id}/reverse OR scheduled review (POST /_sweep/run when now >= review_due_date)"
        actor: IRSOfficer | system
        preconditions:
          - "liability.status == CNC"
        side_effects:
          - "Close CNC_HARDSHIP CSEDTollingEvent"
          - "TaxLiability.csed_effective_date recomputed"

      - from: IN_COMPROMISE
        to: PAID
        trigger: "Side effect of cumulative OIC_INSTALLMENT payments reaching offer_amount_cents"
        actor: system
        preconditions:
          - "Sum of OIC_INSTALLMENT payments for the parent OIC >= offer_amount_cents"
        side_effects:
          - "FederalTaxLien.release_check cascade"

      - from: OPEN
        to: EXPIRED
        trigger: "POST /_sweep/run (automatic) when now >= csed_effective_date AND status == OPEN"
        actor: system
        preconditions:
          - "now >= liability.csed_effective_date"
          - "liability.status == OPEN"
        side_effects:
          - "current_balance_cents := 0 (write-off)"
          - "Taxpayer.collection_status recomputed"
          - "FederalTaxLien.release_check cascade with release_reason=CSED_EXPIRED"

      - from: CNC
        to: EXPIRED
        trigger: "POST /_sweep/run when now >= csed_effective_date AND status == CNC"
        actor: system
        preconditions:
          - "now >= liability.csed_effective_date"
        side_effects:
          - "current_balance_cents := 0"
          - "FederalTaxLien.release_check cascade"

  # ---- FederalTaxLien ----
  - entity: FederalTaxLien
    initial_state: FILED
    terminal_states: [WITHDRAWN, RELEASED]
    transitions:
      - from: FILED
        to: RELEASED
        trigger: "Cascade from any TaxLiability transition where ALL liability_ids on the lien are now in status IN {PAID, EXPIRED, IN_COMPROMISE-followed-by-PAID}"
        actor: system
        preconditions:
          - "Every TaxLiability with id in lien.liability_ids has status IN {PAID, EXPIRED}"
        side_effects:
          - "Persist released_at := now"
          - "Persist release_reason := one of {PAID_IN_FULL, CSED_EXPIRED, OIC_ACCEPTED} based on dominant cause"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /collections/liens/{id}/withdraw (administrative; e.g., DDIA-streamlined withdrawal upon request)"
        actor: IRSOfficer
        preconditions:
          - "lien.status == FILED"
          - "Every liability_id on the lien has status IN {IN_AGREEMENT} AND the covering InstallmentAgreement has payment_method == DDIA AND aggregate debt <= 25_000 * 100 cents"
        side_effects:
          - "Persist released_at := now (administrative withdrawal)"
          - "release_reason := ADMIN_RELEASE"

  # ---- CNCStatus ----
  - entity: CNCStatus
    initial_state: ACTIVE
    terminal_states: [REVERSED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVERSED
        trigger: "POST /collections/cnc-statuses/{id}/reverse (taxpayer financial improvement or new income evidence)"
        actor: IRSOfficer
        preconditions:
          - "cnc.status == ACTIVE"
        side_effects:
          - "Each liability_id transitions CNC→OPEN"
          - "Close CNC_HARDSHIP CSEDTollingEvent on each covered liability"
          - "TaxLiability.csed_effective_date recomputed"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_sweep/run when now >= review_due_date"
        actor: system
        preconditions:
          - "now >= cnc.review_due_date"
        side_effects:
          - "Each liability_id transitions CNC→OPEN"
          - "Close CNC_HARDSHIP CSEDTollingEvent"
          - "TaxLiability.csed_effective_date recomputed"

  # ---- ReconsiderationRequest ----
  - entity: ReconsiderationRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /collections/reconsideration-requests/{id}/decide with status=APPROVED"
        actor: IRSOfficer
        preconditions:
          - "request.status == PENDING"
          - "decision_officer_id != the IRSOfficer who activated the underlying InstallmentAgreement"
        side_effects:
          - "If underlying agreement.status == DEFAULTED, cascade DEFAULTED→ACTIVE per §1.2 InstallmentAgreement"

      - from: PENDING
        to: DENIED
        trigger: "POST /collections/reconsideration-requests/{id}/decide with status=DENIED"
        actor: IRSOfficer
        preconditions:
          - "request.status == PENDING"
          - "decision_officer_id != the IRSOfficer who activated the underlying InstallmentAgreement"
        side_effects:
          - "No cascade; agreement remains in DEFAULTED"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - scenario: "Two officers simultaneously activate the same PENDING InstallmentAgreement"
    guarantee: "Exactly one activation succeeds; the loser is rejected."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on InstallmentAgreement.status field."

  - scenario: "Taxpayer submits OIC while a separate request is activating a PENDING InstallmentAgreement covering an overlapping liability"
    guarantee: "The second writer is rejected; covered liability cannot be simultaneously locked by both an OIC submission and an IA activation."
    error_id: ERR_LIABILITY_LOCKED
    http_status: 409
    serialization: "First-writer-wins on TaxLiability.status field flip."

  - scenario: "Officer accepts an OIC at the same instant a payment fully settles the same liabilities via an active IA"
    guarantee: "Exactly one transition succeeds; OIC accept loses to liability already PAID."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on TaxLiability.status; if status is PAID at evaluation time, OIC accept rejects."

  - scenario: "Two concurrent reconsideration decisions on the same agreement"
    guarantee: "At most one decision is recorded."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ReconsiderationRequest.status."

  - scenario: "Concurrent payments allocated against the same agreement at the moment balance reaches zero"
    guarantee: "Both payments record; allocation deterministic via received_at ascending then payment.id ascending; only the first to drive balance to zero triggers COMPLETED cascade."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "Order payments by (received_at ASC, id ASC); second payment that would over-pay is truncated to remaining balance and surplus rejected."

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:

  - name: monthly_accrual
    trigger: "POST /_sweep/run; runs once per end-of-month for each TaxLiability whose status IN {OPEN, IN_AGREEMENT} and whose last_accrual_cycle_date < end_of_month_under_consideration"
    algorithm: chronological
    formula: |
      # For each accrual cycle from last_accrual_cycle_date to current_eom_date:
      # 1. Base for interest = original_assessed_amount_cents + accrued_interest_cents + accrued_penalty_cents - payments_applied_cents
      # 2. interest_accrued_this_cycle_cents = round_half_up(base * MONTHLY_INTEREST_RATE)
      # 3. penalty_accrued_this_cycle_cents:
      #    if status == OPEN: round_half_up(base * MONTHLY_FTP_RATE_NON_IA)         # 0.5% per month
      #    if status == IN_AGREEMENT: round_half_up(base * MONTHLY_FTP_RATE_IA)     # 0.25% per month
      #    if status == CNC: 0  (penalty does NOT accrue while CNC; interest still does)
      # 4. accrued_interest_cents += interest_accrued_this_cycle_cents
      # 5. accrued_penalty_cents  += penalty_accrued_this_cycle_cents
      # 6. last_accrual_cycle_date = current_eom_date
      # Ordering pinned: interest computed BEFORE penalty within each cycle; both use the SAME base (start-of-cycle), not interest-rolled-into-base.
    input_set: "All TaxLiability with status IN {OPEN, IN_AGREEMENT, CNC} whose last_accrual_cycle_date is strictly less than the cycle end date"
    constants:
      MONTHLY_INTEREST_RATE: 0.006667   # ~8% annual / 12, locked for benchmark
      MONTHLY_FTP_RATE_NON_IA: 0.005
      MONTHLY_FTP_RATE_IA: 0.0025
    precision: "round_half_up to whole cents at each cycle step; do NOT carry sub-cent residue across cycles"
    variants:
      - name: with_ia_discount
        when: "TaxLiability.status == IN_AGREEMENT"
        difference: "Penalty rate halved to 0.0025 per month; interest rate unchanged."
      - name: cnc_interest_only
        when: "TaxLiability.status == CNC"
        difference: "Penalty rate is 0; interest continues at MONTHLY_INTEREST_RATE."

  - name: csed_calculation
    trigger: "Any state transition that opens or closes a CSEDTollingEvent for the liability"
    algorithm: interval_merge
    formula: |
      # csed_base_date = assessment_date + 10 years (366*10 days, leap-year aware via ISO date math)
      # tolling_intervals = [(e.start_date, COALESCE(e.end_date, NOW())) for e in CSEDTollingEvent where liability_id == this.id]
      # Merge overlapping intervals using HALF-OPEN semantics [start, end):
      #   - sort intervals by start_date ASC, then end_date ASC
      #   - merge when next.start_date <= current.end_date (closed-on-left, open-on-right)
      # total_tolling_seconds = sum of (end - start) over merged intervals
      # csed_effective_date = csed_base_date + total_tolling_seconds
    input_set: "All CSEDTollingEvent rows for this liability_id, including currently open events (end_date IS NULL treated as NOW())"
    constants:
      STATUTORY_YEARS: 10
    precision: "Seconds; ISO 8601 UTC"
    variants:
      - name: provisional_with_open_tolling
        when: "Any CSEDTollingEvent for this liability has end_date IS NULL"
        difference: "Open intervals are treated as ending at NOW(); the value drifts forward in time as long as the tolling event remains open."
      - name: final_after_close
        when: "All CSEDTollingEvent rows for this liability have end_date set"
        difference: "csed_effective_date is fixed; will not drift unless a new tolling event is opened."

  - name: rcp_calculation
    trigger: "OfferInCompromise PENDING/SUBMITTED status; recomputed on submit; pinned on UNDER_REVIEW; frozen at decide"
    algorithm: weighted_scoring
    formula: |
      # RCP = Net Realizable Equity in Assets + Future Income Component
      # Inputs:
      #   AET = max(0, taxpayer.total_assessed_debt_cents - 0)   # placeholder, not used directly
      #   MDI = taxpayer.monthly_disposable_income_cents
      #   offer_horizon_months: if offer paid within 5 months → 12 months future income; if 6–24 months → 24 months
      #
      # Step 1: future_income_months_factor:
      #   if proposed payoff schedule <= 5 monthly installments: FACTOR = 12
      #   else if proposed payoff schedule <= 24 monthly installments: FACTOR = 24
      #   else: REJECT submission (handled in §1.4 validation; not in this formula)
      #
      # Step 2: future_income_cents = max(0, MDI) * FACTOR
      #
      # Step 3: Equity component is a configured constant per OIC (input).
      #   For benchmark determinism, equity_cents is an OIC input field implied via deposit_paid_cents
      #   surrogate; pin equity_cents := 0 when not supplied.
      #
      # Step 4: rcp_cents = future_income_cents + equity_cents
      # Round to whole cents (no fractional cents).
      #
      # Evaluation order pinned:
      #   (a) Compute FACTOR first (depends on schedule).
      #   (b) Compute future_income_cents next.
      #   (c) Sum with equity_cents LAST. Do NOT round future_income before summing.
    input_set: "taxpayer.monthly_disposable_income_cents; proposed installments schedule on the OIC"
    constants:
      LUMP_SUM_HORIZON_MONTHS: 12
      PERIODIC_HORIZON_MONTHS: 24
    precision: "round_half_up to whole cents; rounding is applied once at the final sum, not intermediate."
    variants:
      - name: lump_sum_offer
        when: "Offer paid within 5 months"
        difference: "FACTOR = 12; lower future income component."
      - name: periodic_offer
        when: "Offer paid in 6-24 months"
        difference: "FACTOR = 24; higher future income component."

  - name: payment_allocation
    trigger: "POST /collections/installment-agreements/{id}/record-payment OR POST /collections/payments (LUMP_SUM / OIC_DEPOSIT after decision)"
    algorithm: waterfall_allocation
    formula: |
      # Inputs: payment.amount_cents A, set of target liabilities L (ordered).
      # Ordering pinned (deterministic, do NOT change):
      #   1. ASC by csed_effective_date   (soonest-to-expire first — preserves revenue)
      #   2. ASC by tax_year             (older tax year first)
      #   3. ASC by liability.id         (final tie-break)
      #
      # For each liability in pinned order:
      #   remaining_balance = liability.current_balance_cents
      #   allocate = min(A_remaining, remaining_balance)
      #   liability.payments_applied_cents += allocate
      #   A_remaining -= allocate
      # If A_remaining > 0 after all liabilities settled, the surplus is REJECTED for INSTALLMENT/OIC_INSTALLMENT
      # but ACCEPTED and recorded as overpayment for LUMP_SUM (which IRS would refund — out of scope).
      # No internal rounding: amounts are integer cents.
    input_set: "Liabilities covered by the agreement (for INSTALLMENT/OIC_INSTALLMENT) or the OIC.liability_ids (for OIC_DEPOSIT after decision) or Payment.liability_ids input (for LUMP_SUM)."
    constants: {}
    precision: "Exact integer cents; no rounding."
    variants:
      - name: installment_allocation
        when: "payment.payment_kind == INSTALLMENT"
        difference: "Only liabilities currently IN_AGREEMENT and covered by the agreement are eligible. Surplus over total balance is rejected (ERR_OVERPAYMENT)."
      - name: oic_deposit_allocation
        when: "payment.payment_kind == OIC_DEPOSIT after OIC.status entered REJECTED or WITHDRAWN"
        difference: "Allocates against original liability_ids in pinned order. Surplus over total balance is rejected."

  - name: payoff_projection
    trigger: "InstallmentAgreement PENDING→ACTIVE (set planned_payoff_date); reconsideration APPROVED (recompute)"
    algorithm: forward_looking
    formula: |
      # Inputs at activation time:
      #   current_total_balance_cents = sum(current_balance_cents for liability_ids)
      #   monthly_payment_cents = agreement.proposed_monthly_payment_cents
      #   MONTHLY_INTEREST_RATE, MONTHLY_FTP_RATE_IA (from monthly_accrual constants)
      #
      # Simulate forward, month-by-month, until balance == 0 OR (status == PPIA AND
      # projected month exceeds csed_effective_date_min):
      #   each month:
      #     interest = round_half_up(balance * MONTHLY_INTEREST_RATE)
      #     penalty  = round_half_up(balance * MONTHLY_FTP_RATE_IA)
      #     balance += interest + penalty
      #     balance -= min(balance, monthly_payment_cents)
      #     if balance == 0: payoff_date := activation_date + month_count months; return
      #     if month_count > 120 (10 years) AND PPIA: planned_payoff_date := csed_effective_date_min; return
      # Rounding ORDER pinned: round interest first, then round penalty, then add — DO NOT round (interest+penalty) as a sum.
    input_set: "Same liabilities the agreement covers; their current balances and csed_effective_date"
    constants:
      MAX_PROJECTION_MONTHS: 120
    precision: "round_half_up per-component each month; carry exact cents from month to month."
    variants:
      - name: full_pay_projection
        when: "agreement_type == SHORT_TERM or LONG_TERM"
        difference: "Simulation ends when balance reaches 0; planned_payoff_date is the date of the final payment."
      - name: ppia_csed_capped_projection
        when: "agreement_type == PPIA"
        difference: "If balance still > 0 at csed_effective_date_min, planned_payoff_date is set to csed_effective_date_min (statute closes the remainder)."

  - name: cnc_eligibility
    trigger: "POST /collections/cnc-statuses (creation); revalidated on monthly sweep before review_due_date"
    algorithm: threshold
    formula: |
      eligible = (taxpayer.monthly_disposable_income_cents <= 0)
      # Boundary precision: 0 is eligible (<=, NOT <); 1 cent fails.
    input_set: "Taxpayer.monthly_disposable_income_cents"
    constants: {}
    precision: "Integer cents; boundary at 0 inclusive."
    variants: []

# =====================================================================
# §1.4 Validation Rules Table (ordered)
# =====================================================================
validations:
  # ---- Authentication / authorization ----
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role IN {Taxpayer, IRSOfficer, OICOfficer}"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "For Taxpayer role: X-User-ID must equal the Taxpayer.id implied by the route or body taxpayer_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all taxpayer-actor endpoints"

  - priority: 3
    category: auth
    check: "Role permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  # ---- Existence (left-to-right) ----
  - priority: 4
    category: existence
    check: "Resource at path id exists and (for child references) belongs to declared parent"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all GET, PATCH, DELETE, action endpoints"

  - priority: 5
    category: existence
    check: "All liability_ids referenced in body belong to the declared taxpayer_id"
    error_id: ERR_LIABILITY_NOT_OWNED
    http_status: 404
    applies_to: "POST IA, POST OIC, POST CNC, POST FederalTaxLien"

  # ---- State preconditions ----
  - priority: 6
    category: state
    check: "Target resource is in the correct status for the action (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: state
    check: "If activating an InstallmentAgreement covering liability X, X.status MUST be in {OPEN, IN_AGREEMENT} — not CNC, IN_COMPROMISE, EXPIRED, PAID"
    error_id: ERR_LIABILITY_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /collections/installment-agreements, POST .../activate"

  # ---- Business: compliance / regulatory (segregation of duties) ----
  - priority: 8
    category: business_safety
    check: "OICOfficer who decides an OIC (accept/reject) must NOT be the same officer who took up the case to UNDER_REVIEW"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /collections/offers-in-compromise/{id}/decide"

  - priority: 9
    category: business_safety
    check: "IRSOfficer who decides a ReconsiderationRequest must NOT be the same officer who originally activated the underlying InstallmentAgreement"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /collections/reconsideration-requests/{id}/decide"

  # ---- Business: temporal (CSED) ----
  - priority: 10
    category: business_temporal
    check: "TaxLiability.csed_effective_date must be > now() at the moment a Payment is recorded against it; otherwise liability is EXPIRED and the payment is rejected"
    error_id: ERR_CSED_EXPIRED
    http_status: 422
    applies_to: "POST /collections/payments, POST /collections/installment-agreements/{id}/record-payment"

  - priority: 11
    category: business_temporal
    check: "Tolling intervals must not overlap when both have end_date set (closed-on-left, open-on-right half-open semantics); for the SAME liability and SAME event_kind, two simultaneously-OPEN events are forbidden"
    error_id: ERR_OVERLAPPING_TOLLING
    http_status: 409
    applies_to: "POST /collections/_internal/tolling-events, automatic open via state transitions"

  # ---- Business: referential / cross-entity ----
  - priority: 12
    category: business_referential
    check: "A liability cannot be in two simultaneously-locking workflows: must not be in both an ACTIVE InstallmentAgreement and an UNDER_REVIEW OfferInCompromise"
    error_id: ERR_LIABILITY_LOCKED
    http_status: 409
    applies_to: "POST IA activate, POST OIC submit"

  # ---- Business: constraint (IA type gating, DDIA thresholds, OIC RCP) ----
  - priority: 13
    category: business_constraint
    check: "If aggregate covered debt > 2_500_000 cents ($25,000), payment_method MUST be DDIA"
    error_id: ERR_DDIA_REQUIRED
    http_status: 422
    applies_to: "POST /collections/installment-agreements"

  - priority: 14
    category: business_constraint
    check: "SHORT_TERM agreement: planned_payoff_date - activation_date MUST be <= 180 days"
    error_id: ERR_INELIGIBLE_AGREEMENT_TYPE
    http_status: 422
    applies_to: "POST /collections/installment-agreements"

  - priority: 15
    category: business_constraint
    check: "LONG_TERM streamlined agreement: aggregate covered debt MUST be <= 5_000_000 cents ($50,000); planned_payoff_date MUST be <= csed_effective_date_min"
    error_id: ERR_INELIGIBLE_AGREEMENT_TYPE
    http_status: 422
    applies_to: "POST /collections/installment-agreements"

  - priority: 16
    category: business_constraint
    check: "PPIA agreement: planned_payoff_date MUST be > csed_effective_date_min (otherwise it would be a LONG_TERM); AND taxpayer.monthly_disposable_income_cents >= proposed_monthly_payment_cents"
    error_id: ERR_INELIGIBLE_AGREEMENT_TYPE
    http_status: 422
    applies_to: "POST /collections/installment-agreements"

  - priority: 17
    category: business_constraint
    check: "OIC SUBMIT: deposit Payment with payment_kind=OIC_DEPOSIT exists with amount_cents >= ceil(offer_amount_cents * 0.20)"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /collections/offers-in-compromise/{id}/submit"

  - priority: 18
    category: business_constraint
    check: "OIC ACCEPT: offer_amount_cents >= rcp_cents"
    error_id: ERR_OIC_BELOW_RCP
    http_status: 422
    applies_to: "POST /collections/offers-in-compromise/{id}/decide with decision=ACCEPT"

  - priority: 19
    category: business_constraint
    check: "Lien withdrawal request: every liability_id on the lien must be in IN_AGREEMENT under a DDIA-method agreement AND aggregate debt <= 2_500_000 cents"
    error_id: ERR_LIEN_WITHDRAWAL_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /collections/liens/{id}/withdraw"

  # ---- Business: fiscal (overpayment) ----
  - priority: 20
    category: business_fiscal
    check: "INSTALLMENT or OIC_INSTALLMENT payment amount_cents > sum(current_balance_cents over targeted liabilities)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /collections/installment-agreements/{id}/record-payment, POST /collections/payments (OIC_INSTALLMENT kind)"

  - priority: 21
    category: business_fiscal
    check: "Reconsideration approval after liabilities have all reached PAID or EXPIRED: agreement cannot revive"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /collections/reconsideration-requests/{id}/decide"

  - priority: 22
    category: business_constraint
    check: "CNC placement requires taxpayer.monthly_disposable_income_cents <= 0 (inclusive). MDI == 1 cent rejects."
    error_id: ERR_CNC_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /collections/cnc-statuses"

  - priority: 0
    category: business_constraint
    check: "Request body schema valid: required fields present, scalar types correct, enums in declared set, integer cents >= 0 where applicable. Runs before all other priorities."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 23
    category: state
    check: "OCC version field, when supplied on PATCH or action endpoints, must match the stored version. Mismatch returns conflict."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH and action endpoints accepting version"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Taxpayer ----
  - method: POST
    path: "/collections/taxpayers"
    description: "Register a taxpayer."
    roles: [IRSOfficer]
    code: 201
    input: [tin, filing_status, monthly_disposable_income_cents]
    output: Taxpayer
    side_effects: []

  - method: GET
    path: "/collections/taxpayers/{id}"
    description: "Fetch a taxpayer with computed collection_status and total_assessed_debt_cents."
    roles: [IRSOfficer, OICOfficer, Taxpayer]
    code: 200
    input: []
    output: Taxpayer
    side_effects: []

  - method: PATCH
    path: "/collections/taxpayers/{id}"
    description: "Update mutable taxpayer fields (e.g., monthly_disposable_income_cents)."
    roles: [IRSOfficer]
    code: 200
    input: ["filing_status?", "monthly_disposable_income_cents?", "version?"]
    output: Taxpayer
    side_effects:
      - "Recompute Taxpayer.collection_status"
      - "Re-evaluate eligibility for any ACTIVE CNCStatus (does NOT automatically reverse)"

  - method: GET
    path: "/collections/taxpayers"
    description: "List taxpayers."
    roles: [IRSOfficer, OICOfficer]
    code: 200
    input: ["limit?", "offset?", "collection_status?"]
    output: Taxpayer[]
    side_effects: []

  # ---- Tax Liabilities ----
  - method: POST
    path: "/collections/tax-liabilities"
    description: "Create (assess) a new tax liability. May default an existing ACTIVE agreement (see §1.2 IA DEFAULTED transition)."
    roles: [IRSOfficer]
    code: 201
    input: [taxpayer_id, tax_year, assessment_date, original_assessed_amount_cents]
    output: TaxLiability
    side_effects:
      - "Compute csed_base_date := assessment_date + 10 years"
      - "csed_effective_date := csed_base_date initially (no tolling yet)"
      - "Recompute Taxpayer.total_assessed_debt_cents and collection_status"
      - "If taxpayer has an ACTIVE InstallmentAgreement, that agreement transitions ACTIVE→DEFAULTED (via sweep or immediate cascade)"

  - method: GET
    path: "/collections/tax-liabilities/{id}"
    description: "Fetch a tax liability with all computed balances and CSED."
    roles: [IRSOfficer, OICOfficer, Taxpayer]
    code: 200
    input: []
    output: TaxLiability
    side_effects: []

  - method: GET
    path: "/collections/tax-liabilities"
    description: "List liabilities, filterable by taxpayer_id and status."
    roles: [IRSOfficer, OICOfficer]
    code: 200
    input: ["taxpayer_id?", "status?", "limit?", "offset?"]
    output: TaxLiability[]
    side_effects: []

  # ---- Installment Agreements ----
  - method: POST
    path: "/collections/installment-agreements"
    description: "Create a PENDING installment agreement. Server computes agreement_type from inputs and validates IA-type gating in §1.4."
    roles: [Taxpayer, IRSOfficer]
    code: 201
    input: [taxpayer_id, liability_ids, proposed_monthly_payment_cents, payment_method, "ddia_bank_account_last4?"]
    output: InstallmentAgreement
    side_effects:
      - "Compute and pin agreement_type (SHORT_TERM, LONG_TERM, PPIA)"

  - method: GET
    path: "/collections/installment-agreements/{id}"
    description: "Fetch an installment agreement."
    roles: [IRSOfficer, OICOfficer, Taxpayer]
    code: 200
    input: []
    output: InstallmentAgreement
    side_effects: []

  - method: POST
    path: "/collections/installment-agreements/{id}/activate"
    description: "Activate a PENDING agreement."
    roles: [IRSOfficer]
    code: 200
    input: ["version?"]
    output: InstallmentAgreement
    side_effects:
      - "InstallmentAgreement PENDING→ACTIVE and all covered TaxLiability OPEN→IN_AGREEMENT"
      - "Compute planned_payoff_date and next_due_date"
      - "Close any open INSTALLMENT_PENDING CSEDTollingEvent on covered liabilities; recompute csed_effective_date"

  - method: POST
    path: "/collections/installment-agreements/{id}/record-payment"
    description: "Record an installment receipt. Server allocates per §1.3 payment_allocation."
    roles: [IRSOfficer]
    code: 201
    input: [amount_cents, received_at]
    output: Payment
    side_effects:
      - "Update per-liability payments_applied_cents and current_balance_cents"
      - "Increment next_due_date by 30 days; reset missed_payment_count"
      - "If all covered liabilities now PAID, cascade agreement ACTIVE→COMPLETED and liability IN_AGREEMENT→PAID"
      - "FederalTaxLien.release_check cascade"

  - method: POST
    path: "/collections/installment-agreements/{id}/terminate"
    description: "Terminate a DEFAULTED agreement (officer action)."
    roles: [IRSOfficer]
    code: 200
    input: ["version?"]
    output: InstallmentAgreement
    side_effects:
      - "Covered liabilities revert IN_AGREEMENT→OPEN (or PAID if balance==0)"

  - method: GET
    path: "/collections/installment-agreements"
    description: "List agreements, filterable by taxpayer and status."
    roles: [IRSOfficer, OICOfficer, Taxpayer]
    code: 200
    input: ["taxpayer_id?", "status?", "limit?", "offset?"]
    output: InstallmentAgreement[]
    side_effects: []

  # ---- Payments (general / OIC) ----
  - method: POST
    path: "/collections/payments"
    description: "Record a generic payment (LUMP_SUM, OIC_DEPOSIT, OIC_INSTALLMENT)."
    roles: [Taxpayer, IRSOfficer]
    code: 201
    input: [taxpayer_id, amount_cents, received_at, payment_kind, "agreement_id?", "oic_id?", "liability_ids?"]
    output: Payment
    side_effects:
      - "If LUMP_SUM: allocate via §1.3 payment_allocation against listed liability_ids in pinned order"
      - "If OIC_DEPOSIT: hold against parent OIC (no allocation until OIC enters terminal state)"
      - "If OIC_INSTALLMENT: accumulate toward parent OIC's offer_amount_cents; when sum >= offer_amount_cents, liabilities IN_COMPROMISE→PAID"

  - method: GET
    path: "/collections/payments/{id}"
    description: "Fetch a payment with its computed allocation."
    roles: [IRSOfficer, OICOfficer, Taxpayer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # ---- Offers in Compromise ----
  - method: POST
    path: "/collections/offers-in-compromise"
    description: "Draft an Offer in Compromise."
    roles: [Taxpayer, IRSOfficer]
    code: 201
    input: [taxpayer_id, liability_ids, offer_amount_cents, schedule_months]
    output: OfferInCompromise
    side_effects:
      - "Compute rcp_cents per §1.3 (uses schedule_months to pick FACTOR)"

  - method: POST
    path: "/collections/offers-in-compromise/{id}/submit"
    description: "Submit a DRAFT OIC."
    roles: [Taxpayer]
    code: 200
    input: ["version?"]
    output: OfferInCompromise
    side_effects:
      - "OIC DRAFT→SUBMITTED"
      - "Open CSEDTollingEvent (event_kind=OIC_PENDING) on each covered liability"
      - "Recompute Taxpayer.collection_status"

  - method: POST
    path: "/collections/offers-in-compromise/{id}/take-up"
    description: "Officer claims a SUBMITTED OIC for review."
    roles: [OICOfficer]
    code: 200
    input: ["version?"]
    output: OfferInCompromise
    side_effects:
      - "OIC SUBMITTED→UNDER_REVIEW"

  - method: POST
    path: "/collections/offers-in-compromise/{id}/decide"
    description: "Decide an OIC under review. Body decision=ACCEPT or REJECT."
    roles: [OICOfficer]
    code: 200
    input: [decision, "version?"]
    output: OfferInCompromise
    side_effects:
      - "On ACCEPT: liability OPEN/IN_AGREEMENT→IN_COMPROMISE; cascade IA TERMINATED; close OIC_PENDING tolling"
      - "On REJECT: close OIC_PENDING tolling; deposit allocated as LUMP_SUM"

  - method: POST
    path: "/collections/offers-in-compromise/{id}/withdraw"
    description: "Withdraw an OIC (taxpayer action)."
    roles: [Taxpayer]
    code: 200
    input: ["version?"]
    output: OfferInCompromise
    side_effects:
      - "Close OIC_PENDING tolling on each covered liability"
      - "Deposit forfeit: allocated as LUMP_SUM"

  - method: GET
    path: "/collections/offers-in-compromise/{id}"
    description: "Fetch an OIC."
    roles: [IRSOfficer, OICOfficer, Taxpayer]
    code: 200
    input: []
    output: OfferInCompromise
    side_effects: []

  - method: GET
    path: "/collections/offers-in-compromise"
    description: "List OICs."
    roles: [IRSOfficer, OICOfficer]
    code: 200
    input: ["taxpayer_id?", "status?", "limit?", "offset?"]
    output: OfferInCompromise[]
    side_effects: []

  # ---- Federal Tax Lien ----
  - method: POST
    path: "/collections/liens"
    description: "File a federal tax lien against one or more liabilities."
    roles: [IRSOfficer]
    code: 201
    input: [taxpayer_id, liability_ids, filed_date]
    output: FederalTaxLien
    side_effects: []

  - method: POST
    path: "/collections/liens/{id}/withdraw"
    description: "Administratively withdraw a lien (DDIA streamlined eligibility)."
    roles: [IRSOfficer]
    code: 200
    input: ["version?"]
    output: FederalTaxLien
    side_effects:
      - "lien.status FILED→WITHDRAWN; persist released_at and release_reason=ADMIN_RELEASE"

  - method: GET
    path: "/collections/liens/{id}"
    description: "Fetch a lien."
    roles: [IRSOfficer, OICOfficer, Taxpayer]
    code: 200
    input: []
    output: FederalTaxLien
    side_effects: []

  - method: GET
    path: "/collections/liens"
    description: "List liens."
    roles: [IRSOfficer, OICOfficer]
    code: 200
    input: ["taxpayer_id?", "status?", "limit?", "offset?"]
    output: FederalTaxLien[]
    side_effects: []

  # ---- CNC ----
  - method: POST
    path: "/collections/cnc-statuses"
    description: "Place liabilities into Currently Not Collectible status."
    roles: [IRSOfficer]
    code: 201
    input: [taxpayer_id, liability_ids, hardship_reason]
    output: CNCStatus
    side_effects:
      - "Each liability OPEN→CNC"
      - "Open CSEDTollingEvent (event_kind=CNC_HARDSHIP) per liability"
      - "Compute review_due_date = now + 24 months"

  - method: POST
    path: "/collections/cnc-statuses/{id}/reverse"
    description: "Reverse an ACTIVE CNC (financial improvement)."
    roles: [IRSOfficer]
    code: 200
    input: ["version?"]
    output: CNCStatus
    side_effects:
      - "Each liability CNC→OPEN"
      - "Close CNC_HARDSHIP CSEDTollingEvent"

  - method: GET
    path: "/collections/cnc-statuses/{id}"
    description: "Fetch CNC status."
    roles: [IRSOfficer, Taxpayer]
    code: 200
    input: []
    output: CNCStatus
    side_effects: []

  # ---- Reconsideration ----
  - method: POST
    path: "/collections/reconsideration-requests"
    description: "Open a reconsideration request against a DEFAULTED agreement."
    roles: [Taxpayer, IRSOfficer]
    code: 201
    input: [agreement_id, reason, "prior_request_id?"]
    output: ReconsiderationRequest
    side_effects: []

  - method: POST
    path: "/collections/reconsideration-requests/{id}/decide"
    description: "Decide PENDING reconsideration. Body status=APPROVED or DENIED."
    roles: [IRSOfficer]
    code: 200
    input: [status, "version?"]
    output: ReconsiderationRequest
    side_effects:
      - "On APPROVED: cascade underlying agreement DEFAULTED→ACTIVE"

  - method: GET
    path: "/collections/reconsideration-requests/{id}"
    description: "Fetch a reconsideration request."
    roles: [IRSOfficer, OICOfficer, Taxpayer]
    code: 200
    input: []
    output: ReconsiderationRequest
    side_effects: []

  # ---- Sweep + clock (test-driver endpoints) ----
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance the server clock to a target ISO 8601 UTC timestamp."
    roles: [IRSOfficer]
    code: 200
    input: [target_timestamp]
    output: null
    side_effects:
      - "Clock advances; no automatic cascades (sweep must be invoked explicitly)"

  - method: POST
    path: "/_sweep/run"
    description: "Run monthly accrual + IA missed-payment sweep + CSED-expiration check + CNC review-due check."
    roles: [IRSOfficer]
    code: 200
    input: []
    output: null
    side_effects:
      - "For each TaxLiability whose status IN {OPEN, IN_AGREEMENT, CNC} and last_accrual_cycle_date < current EOM: apply §1.3 monthly_accrual"
      - "For each InstallmentAgreement ACTIVE with next_due_date < now (no payment recorded): increment missed_payment_count; if >= 3, ACTIVE→DEFAULTED and open INSTALLMENT_PENDING tolling"
      - "For each TaxLiability with now >= csed_effective_date AND status IN {OPEN, CNC}: transition to EXPIRED; cascade lien release"
      - "For each CNCStatus with now >= review_due_date AND status==ACTIVE: ACTIVE→EXPIRED; liabilities CNC→OPEN; close CNC tolling"

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for this endpoint, or taxpayer acting on another taxpayer's resource."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource referenced in path or body does not exist."
  - id: ERR_LIABILITY_NOT_OWNED
    http: 404
    condition: "A liability_id in the request body does not belong to the declared taxpayer_id."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a status from which the requested transition is allowed."
  - id: ERR_LIABILITY_NOT_ELIGIBLE
    http: 409
    condition: "Liability status (CNC, IN_COMPROMISE, EXPIRED, PAID) blocks the requested operation."
  - id: ERR_CNC_NOT_ELIGIBLE
    http: 422
    condition: "CNC requested but taxpayer.monthly_disposable_income_cents > 0."
  - id: ERR_LIABILITY_LOCKED
    http: 409
    condition: "Liability is concurrently locked by another workflow (IA + OIC overlap)."
  - id: ERR_OVERLAPPING_TOLLING
    http: 409
    condition: "Two simultaneously-open CSEDTollingEvent rows of the same event_kind on the same liability."
  - id: ERR_DDIA_REQUIRED
    http: 422
    condition: "Aggregate debt > $25,000 but payment_method != DDIA."
  - id: ERR_INELIGIBLE_AGREEMENT_TYPE
    http: 422
    condition: "Proposed terms do not satisfy SHORT_TERM / LONG_TERM / PPIA eligibility gates."
  - id: ERR_DEPOSIT_INSUFFICIENT
    http: 422
    condition: "OIC submit attempted with deposit < 20% of offer_amount_cents."
  - id: ERR_OIC_BELOW_RCP
    http: 422
    condition: "OIC ACCEPT attempted while offer_amount_cents < rcp_cents."
  - id: ERR_LIEN_WITHDRAWAL_NOT_ELIGIBLE
    http: 422
    condition: "Lien withdrawal requested but covering agreement is not DDIA + <=$25k."
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Installment / OIC_INSTALLMENT payment exceeds remaining balance."
  - id: ERR_CSED_EXPIRED
    http: 422
    condition: "Operation targets a liability whose csed_effective_date has elapsed."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Same officer cannot perform both a take-up/activate step and the corresponding decide step."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC conflict: supplied version != stored version on PATCH/action endpoints."
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed body, missing required field, or out-of-range scalar."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Taxpayer
    description: "An individual or business taxpayer interacting with their own collection matters."
    identity: "entity_backed:Taxpayer"
    exclusive_operations:
      - "POST /collections/offers-in-compromise/{id}/submit"
      - "POST /collections/offers-in-compromise/{id}/withdraw"
    shared_operations:
      - "POST /collections/installment-agreements (with IRSOfficer)"
      - "POST /collections/offers-in-compromise (with IRSOfficer)"
      - "POST /collections/reconsideration-requests (with IRSOfficer)"
      - "POST /collections/payments (with IRSOfficer)"
      - "GET own resources (taxpayer, liabilities, agreements, OICs, liens, CNC, reconsideration)"

  - name: IRSOfficer
    description: "IRS collection officer who manages taxpayer cases, activates agreements, terminates agreements, files/withdraws liens, places CNC, decides reconsideration."
    identity: "opaque"
    exclusive_operations:
      - "POST /collections/taxpayers"
      - "PATCH /collections/taxpayers/{id}"
      - "POST /collections/tax-liabilities"
      - "POST /collections/installment-agreements/{id}/activate"
      - "POST /collections/installment-agreements/{id}/record-payment"
      - "POST /collections/installment-agreements/{id}/terminate"
      - "POST /collections/liens"
      - "POST /collections/liens/{id}/withdraw"
      - "POST /collections/cnc-statuses"
      - "POST /collections/cnc-statuses/{id}/reverse"
      - "POST /collections/reconsideration-requests/{id}/decide"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations:
      - "POST /collections/installment-agreements (with Taxpayer)"
      - "POST /collections/offers-in-compromise (with Taxpayer)"
      - "POST /collections/payments (with Taxpayer)"
      - "POST /collections/reconsideration-requests (with Taxpayer)"
      - "GET endpoints across the catalog"

  - name: OICOfficer
    description: "Specialized IRS officer who reviews and decides Offers in Compromise. Subject to segregation of duties: the officer who takes up the case cannot be the one who decides it."
    identity: "opaque"
    exclusive_operations:
      - "POST /collections/offers-in-compromise/{id}/take-up"
      - "POST /collections/offers-in-compromise/{id}/decide"
    shared_operations:
      - "GET /collections/offers-in-compromise"
      - "GET /collections/offers-in-compromise/{id}"
      - "GET /collections/tax-liabilities (cross-cutting visibility)"
      - "GET /collections/taxpayers (cross-cutting visibility)"
