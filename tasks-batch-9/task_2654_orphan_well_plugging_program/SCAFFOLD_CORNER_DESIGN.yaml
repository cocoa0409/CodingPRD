            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /bids/${bid_id}/evaluation"
              payload: { outcome: "RESPONSIVE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/award"
              payload: {}
              as: AwardAuthority
              as_user_id: "u_award"
              captures: { contract_id: $.data.id }
            - call: "POST /plugging-jobs"
              payload: { well_id: "${w_id}", contract_id: "${contract_id}", scheduled_start: "2026-09-01T00:00:00Z", planned_cement_sacks: 100, planned_rig_days: 3, planned_casing_ft: 500 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { job_id: $.data.id }
            - call: "POST /funding-sources"
              payload: { kind: "FEDERAL_GRANT", name: "IIJA orphan well formula grant FY26", authorized_cents: 10000000, expires_at: "2026-09-01T00:00:00Z", allowable_cost_categories: ["PLUGGING"], federal_match_required_pct: 40 }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_fed_id: $.data.id }
            - call: "POST /funding-sources"
              payload: { kind: "STATE_FUND", name: "Wyoming orphan well account - expiring appropriation", authorized_cents: 6070196, expires_at: "2026-09-01T00:00:00Z", allowable_cost_categories: ["PLUGGING"] }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_state_id: $.data.id }
            - call: "POST /funding-sources"
              payload: { kind: "STATE_FUND", name: "Wyoming orphan well account - biennium carryover", authorized_cents: 9000000, expires_at: "2027-12-31T00:00:00Z", allowable_cost_categories: ["PLUGGING"] }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_carry_id: $.data.id }
            - call: "POST /plugging-jobs/${job_id}/funding-commitments"
              payload: {}
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { alloc0_id: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FundingOfficer
              as_user_id: "u_fund1"
          assert:
            - "before the trigger: FundingSource.${fs_state_id}.committed_cents == 6070196 and status == EXHAUSTED"
            - "before the trigger: FundingSource.${fs_fed_id}.committed_cents == 0 and status == ACTIVE (its match cap was 0 because no non-federal cents preceded it in the pass)"
            - "the commitment pass produced exactly one allocation: GET /funding-allocations?job_id=${job_id} returns total_count == 1 with waterfall_rank == 2 and allocated_cents == 6070196 (rank 2 because the skipped federal grant still occupied position 1 of the ordered pool)"
            - "after the trigger: FundingSource.${fs_state_id}.status == EXPIRED (EXHAUSTED -> EXPIRED at the boundary instant)"
            - "after the trigger: FundingSource.${fs_fed_id}.status == EXPIRED (ACTIVE -> EXPIRED at the boundary instant)"
            - "after the trigger: FundingSource.${fs_carry_id}.status == ACTIVE"
            - "FundingAllocation.${alloc0_id}.status == COMMITTED (source expiry does not disturb existing obligations)"
            - "PluggingJob.${job_id}.funded_cents == 6070196"

      - name: error_determination_revision_cycle_reenters_submitted
