            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0 }, as: PlatformAdmin, captures: { rest_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Fay Hamilton", email: "fay@acme.test" }, as: ProgramAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_id: $.data.id, per_v1: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_id}", benefit_period_id: "${per_id}", restaurant_id: "${rest_id}", delivery_location_id: "${loc_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Family Curry", unit_price_cents: 2000, quantity: 2 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { ord_id: $.data.id } }
          trigger:
            - { call: "POST /orders/${ord_id}/place", payload: { expected_benefit_period_version: "${per_v1}" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "GET /benefit-periods/${per_id}", as: ProgramAdmin }
          assert:
            - "the response is 402 with data.error_id == ERR_PERSONAL_CARD_REQUIRED"
            - "it is not 409 ERR_OVERAGE_NOT_PERMITTED because overage_policy is PERSONAL_CARD"
            - "Employee.${emp_id}.personal_card_on_file == false by default"
            - "Order.${ord_id}.fulfillment_status is still DRAFT and BenefitPeriod.${per_id}.reserved_cents == 0 at version 1"

      - name: corner_two_validations_fire_on_one_request
        claim_type: priority_conflict
        grounds:
          - validations[priority=9]
          - validations[priority=39]
        excluded_because:
          difficulty_instance: period_not_open_p9_beats_personal_card_required_p39
          rationale: "The §1.8 instance constructs a request that violates both rules at once and asserts the lower-numbered rule's error, which is the priority-conflict claim in its sharpest form."

      - name: corner_validation_order_is_observable
        claim_type: priority_ordering
        grounds:
          - validations[priority=17]
          - validations[priority=30]
        excluded_because:
          difficulty_instance: eligible_weekday_p17_beats_restaurant_out_of_range_p30_same_http_status
          rationale: "That §1.8 instance pins the order between two rules that share HTTP 422, so only the error_id can distinguish them, which no weaker ordering test can do."

      - name: corner_eligible_window_is_a_half_open_interval
        claim_type: temporal_validation
        grounds:
          - validations[priority=18]
        excluded_because:
          difficulty_instance: eligible_window_half_open_admits_minute_660_and_839_but_refuses_840
          rationale: "The §1.8 instance covers both inclusive and exclusive endpoints of the eligible window, which is the whole temporal-validation claim for this scaffold."

  # =========================================================================
  - section: endpoints
    instances:

      - name: program_create_read_patch_and_paginated_group_listing_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /meal-programs]
          - endpoints[GET /meal-programs/{id}]
          - endpoints[PATCH /meal-programs/{id}]
          - endpoints[GET /meal-programs/{id}/employee-groups]
        distinguishing_aspect: "A create that omits every optional field surfaces the declared defaults on GET (8.0, DE_MINIMIS_EXCLUSION, CAPPED_PCT, 0.25, COMMITMENT), a PATCH mutates only the supplied keys, and the child listing honours limit/offset with total_count and has_more."
        test_recipe:
          setup:
            - "An empty database with the clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
          trigger:
            - { call: "GET /meal-programs/${prog_id}", as: ProgramAdmin }
            - { call: "PATCH /meal-programs/${prog_id}", payload: { forecast_basis: "RUN_RATE", max_delivery_radius_km: 12.0 }, as: PlatformAdmin }
            - { call: "GET /meal-programs/${prog_id}", as: BenefitsController }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 3 }, as: ProgramAdmin, captures: { grp_a_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Interns", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_b_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Sales", headcount_planned: 4 }, as: ProgramAdmin, captures: { grp_c_id: $.data.id } }
            - { call: "GET /meal-programs/${prog_id}/employee-groups", payload: { limit: 2, offset: 0 }, as: ProgramAdmin }
            - { call: "GET /meal-programs/${prog_id}/employee-groups", payload: { limit: 2, offset: 2 }, as: ProgramAdmin }
            - { call: "GET /employee-groups/${grp_b_id}", as: ProgramAdmin }
          assert:
            - "the first GET returns max_delivery_radius_km 8.0, taxable_benefit_method DE_MINIMIS_EXCLUSION, rollover_policy CAPPED_PCT, rollover_cap_pct 0.25, forecast_basis COMMITMENT, program_spent_cents 0, program_reserved_cents 0, mtd_employer_captured_cents 0"
            - "the PATCH returns 200 and the second GET shows forecast_basis RUN_RATE and max_delivery_radius_km 12.0 while taxable_benefit_method, rollover_policy and rollover_cap_pct keep their defaults"
            - "the first listing returns 2 items with total_count 3 and has_more true"
            - "the second listing returns 1 item with total_count 3 and has_more false"
            - "GET /employee-groups/${grp_b_id} returns name Interns, headcount_planned 2, version 1 and active_budget_rule_id null"

      - name: expense_export_acknowledge_is_a_one_shot_action_and_a_failed_export_cannot_be_acknowledged
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /expense-exports/{id}/acknowledge]
          - state_machines.ExpenseExport.GENERATED_to_ACKNOWLEDGED
          - calculations.expense_export_totals
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "acknowledge is a state-guarded action with no body: it rejects the FAILED empty-bucket export with 409 ERR_INVALID_STATE, moves the GENERATED 2026-08 export to ACKNOWLEDGED once, and rejects the replay with 409 rather than being idempotent."
        test_recipe:
          setup:
            - "Acme Corp program; Engineering rule (cap 2500, daily 1, allocation 50000); HQ Lobby; Thai Garden; Ada with a personal card; OPEN 2026-08 period."
            - "One 1000-cent order for 2026-08-03 is delivered: covered_base 1787, employer_covered 1787, admin_fee 89, taxable 0 under DE_MINIMIS_EXCLUSION."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 3 }, as: ProgramAdmin, captures: { grp_id: $.data.id, grp_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840 }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_id}/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0 }, as: PlatformAdmin, captures: { rest_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_id: $.data.id, per_v1: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_id}", benefit_period_id: "${per_id}", restaurant_id: "${rest_id}", delivery_location_id: "${loc_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /orders/${ord_id}/place", payload: { expected_benefit_period_version: "${per_v1}" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /orders/${ord_id}/confirm", as: Restaurant, as_user_id: "${rest_id}" }
            - { call: "POST /orders/${ord_id}/deliver", as: Restaurant, as_user_id: "${rest_id}" }
          trigger:
            - { call: "POST /meal-programs/${prog_id}/expense-exports", payload: { tax_month: "2026-07", format: "CSV_EXPENSE_REPORT" }, as: BenefitsController, captures: { exp_empty_id: $.data.id } }
            - { call: "POST /expense-exports/${exp_empty_id}/acknowledge", as: BenefitsController }
            - { call: "POST /meal-programs/${prog_id}/expense-exports", payload: { tax_month: "2026-08", format: "CSV_EXPENSE_REPORT" }, as: BenefitsController, captures: { exp_id: $.data.id } }
            - { call: "POST /expense-exports/${exp_id}/acknowledge", as: BenefitsController }
            - { call: "POST /expense-exports/${exp_id}/acknowledge", as: BenefitsController }
            - { call: "GET /meal-programs/${prog_id}/expense-exports", payload: { status: "FAILED" }, as: ProgramAdmin }
          assert:
            - "ExpenseExport.${exp_empty_id}.status == FAILED with receipt_count 0, employer_gross_cents 0 and net_of_refunds_cents 0"
            - "acknowledging the FAILED export is 409 with data.error_id == ERR_INVALID_STATE"
            - "ExpenseExport.${exp_id}.status == GENERATED with receipt_count 1, employer_gross_cents 1787, employer_refund_cents 0, net_of_refunds_cents 1787, admin_fee_total_cents 89 and imputed_total_cents 0"
            - "the first acknowledge is 200 with status ACKNOWLEDGED"
            - "the replayed acknowledge is 409 with data.error_id == ERR_INVALID_STATE, so the action is not idempotent"
            - "the listing filtered by status FAILED returns total_count 1 containing only ${exp_empty_id}"

      - name: settled_refund_entries_are_reachable_from_both_the_order_and_the_claim
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /orders/{id}/refund-entries]
          - endpoints[GET /credit-claims/{id}/refund-entries]
          - calculations.refund_routing_waterfall
          - entities.RefundLedgerEntry.fields.direction
        distinguishing_aspect: "The two child listings project the same RefundLedgerEntry rows through different parents: a PROPORTIONAL settlement of 6974 writes an EMPLOYER_CREDIT of 2500 and an EMPLOYEE_CARD_REFUND of 4474, both listings return exactly those two rows with reason CLAIM_SETTLEMENT, and the direction filter narrows each to one."
        test_recipe:
          setup:
            - "Acme Corp program; Engineering rule (cap 2500, daily 1, allocation 50000, overage_policy PERSONAL_CARD); HQ Lobby; Thai Garden; Ada with a personal card; OPEN 2026-08 period."
            - "A 4 x 1500 order for 2026-08-03 is delivered: subtotal 6000, tax 524, delivery 0, service 450, covered_base 6974, employer_covered 2500, employee_card 4474, admin_fee 125."
            - "Ada files a NEVER_DELIVERED claim for the whole 6974."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 3 }, as: ProgramAdmin, captures: { grp_id: $.data.id, grp_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840, overage_policy: "PERSONAL_CARD" }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_id}/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0 }, as: PlatformAdmin, captures: { rest_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_id: $.data.id, per_v1: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_id}", benefit_period_id: "${per_id}", restaurant_id: "${rest_id}", delivery_location_id: "${loc_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Banquet Curry", unit_price_cents: 1500, quantity: 4 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /orders/${ord_id}/place", payload: { expected_benefit_period_version: "${per_v1}" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /orders/${ord_id}/confirm", as: Restaurant, as_user_id: "${rest_id}" }
            - { call: "POST /orders/${ord_id}/deliver", as: Restaurant, as_user_id: "${rest_id}" }
            - { call: "GET /orders/${ord_id}", as: ProgramAdmin, captures: { ord_v: $.data.version } }
            - { call: "POST /credit-claims", payload: { order_id: "${ord_id}", claim_type: "NEVER_DELIVERED", claimed_cents: 6974 }, as: Employee, as_user_id: "${emp_id}", captures: { claim_id: $.data.id } }
          trigger:
            - { call: "POST /credit-claims/${claim_id}/resolve", payload: { decision: "APPROVE", expected_order_version: "${ord_v}", approved_cents: 6974, routing_basis: "PROPORTIONAL" }, as: BenefitsController, as_user_id: "ctrl-resolver" }
            - { call: "POST /credit-claims/${claim_id}/settle", as: BenefitsController, as_user_id: "ctrl-settler" }
            - { call: "GET /orders/${ord_id}/refund-entries", as: ProgramAdmin }
            - { call: "GET /credit-claims/${claim_id}/refund-entries", as: BenefitsController }
            - { call: "GET /orders/${ord_id}/refund-entries", payload: { direction: "EMPLOYER_CREDIT" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "GET /credit-claims/${claim_id}/refund-entries", payload: { direction: "EMPLOYEE_CARD_REFUND" }, as: Employee, as_user_id: "${emp_id}" }
          assert:
            - "the resolve is 200 with CreditClaim.${claim_id}.status == ROUTED_PROPORTIONAL, employer_credit_cents == 2500 and employee_refund_cents == 4474"
            - "the settle is 200 with status SETTLED and Order.${ord_id}.settlement_status == REFUNDED"
            - "GET /orders/${ord_id}/refund-entries returns total_count 2 and every row has credit_claim_id == ${claim_id} and reason CLAIM_SETTLEMENT"
            - "GET /credit-claims/${claim_id}/refund-entries returns the same 2 rows with the same ids"
            - "the EMPLOYER_CREDIT filter returns total_count 1 with amount_cents 2500"
            - "the EMPLOYEE_CARD_REFUND filter returns total_count 1 with amount_cents 4474"
            - "2500 + 4474 == 6974 == approved_cents, so the two projections partition the settlement exactly"

      - name: close_mode_decides_whether_the_period_pauses_or_computes_its_rollover
        claim_type: conditional_action
        grounds:
          - endpoints[POST /benefit-periods/{id}/close]
          - state_machines.BenefitPeriod.OPEN_to_GRACE
          - state_machines.BenefitPeriod.OPEN_or_GRACE_to_CLOSED
          - calculations.period_close_rollover
        distinguishing_aspect: "One endpoint carries two different actions selected by mode: GRACE only pauses new placement and leaves rollover_out_cents at 0, replaying GRACE from GRACE is 409 ERR_INVALID_STATE, and only FINAL runs the rollover computation (12500 rolled, 35713 forfeited) and cascades the imputed record to LOCKED."
        test_recipe:
          setup:
            - "Acme Corp program with rollover_policy CAPPED_PCT and rollover_cap_pct 0.25; Engineering rule (cap 2500, daily 1, allocation 50000); HQ Lobby; Thai Garden; Ada with a personal card; OPEN 2026-08 period."
            - "One 1000-cent order for 2026-08-03 is delivered, so employer_net is 1787 and available_cents is 48213."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"], rollover_policy: "CAPPED_PCT", rollover_cap_pct: 0.25 }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 3 }, as: ProgramAdmin, captures: { grp_id: $.data.id, grp_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840 }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_id}/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0 }, as: PlatformAdmin, captures: { rest_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_id: $.data.id, per_v1: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_id}", benefit_period_id: "${per_id}", restaurant_id: "${rest_id}", delivery_location_id: "${loc_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /orders/${ord_id}/place", payload: { expected_benefit_period_version: "${per_v1}" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /orders/${ord_id}/confirm", as: Restaurant, as_user_id: "${rest_id}" }
            - { call: "POST /orders/${ord_id}/deliver", as: Restaurant, as_user_id: "${rest_id}" }
          trigger:
            - { call: "POST /benefit-periods/${per_id}/close", payload: { mode: "GRACE" }, as: ProgramAdmin }
            - { call: "GET /benefit-periods/${per_id}", as: BenefitsController }
            - { call: "POST /benefit-periods/${per_id}/close", payload: { mode: "GRACE" }, as: ProgramAdmin }
            - { call: "POST /benefit-periods/${per_id}/close", payload: { mode: "FINAL" }, as: ProgramAdmin }
            - { call: "GET /employees/${emp_id}/imputed-income-records", payload: { tax_month: "2026-08" }, as: BenefitsController }
          assert:
            - "the GRACE close is 200 with BenefitPeriod.${per_id}.status == GRACE, rollover_out_cents == 0 and forfeited_cents == 0"
            - "the GET confirms spent_cents == 1787, reserved_cents == 0 and available_cents == 48213 while the period is GRACE"
            - "the replayed GRACE close is 409 with data.error_id == ERR_INVALID_STATE"
            - "the FINAL close is 200 with status CLOSED, rollover_out_cents == 12500 and forfeited_cents == 35713"
            - "12500 == round_half_up(50000 * 0.25) and 12500 + 35713 == 48213, so the FINAL branch partitions the unused budget"
            - "the imputed-income listing shows the 2026-08 record at status LOCKED, cascaded by the FINAL close and not by any direct call"

      - name: corner_one_action_updates_many_children
        claim_type: bulk_action
        grounds:
          - endpoints[POST /group-orders/{id}/cancel]
          - state_machines.GroupOrder.COLLECTING_or_LOCKED_to_CANCELLED
        excluded_because:
          difficulty_instance: group_cancel_fans_out_to_member_orders_and_their_distinct_periods
          rationale: "That §1.8 instance already exercises the only true bulk action in the API, asserting the fan-out to every member order and to each member's own benefit period in one call."

      - name: corner_a_read_endpoint_returns_derived_numbers
        claim_type: computed_read
        grounds:
          - endpoints[GET /meal-programs/{id}/forecast]
          - calculations.program_cost_forecast
        excluded_because:
          difficulty_instance: forecast_basis_commitment_vs_run_rate_diverges_82500_to_8750
          rationale: "The §1.8 instance reads the same computed endpoint under both forecast_basis variants and pins two different totals from one dataset, which strictly contains the plain computed-read claim."

  # =========================================================================
  - section: errors
    instances:

      - name: every_path_id_not_found_error_is_triggerable_with_its_own_code
        claim_type: error_triggerable
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors.ERR_EMPLOYEE_GROUP_NOT_FOUND
          - errors.ERR_BUDGET_RULE_NOT_FOUND
          - errors.ERR_EMPLOYEE_NOT_FOUND
          - errors.ERR_BENEFIT_PERIOD_NOT_FOUND
          - errors.ERR_RESTAURANT_NOT_FOUND
          - errors.ERR_DELIVERY_LOCATION_NOT_FOUND
          - errors.ERR_GROUP_ORDER_NOT_FOUND
          - errors.ERR_CREDIT_CLAIM_NOT_FOUND
          - errors.ERR_EXPENSE_EXPORT_NOT_FOUND
        distinguishing_aspect: "Each unknown identifier resolves to the entity-specific 404 code rather than one generic ERR_NOT_FOUND, and the body-referenced delivery_location_id on the eligible-restaurants read yields ERR_DELIVERY_LOCATION_NOT_FOUND even though the program in the path exists."
        test_recipe:
          setup:
            - "Acme Corp program with one Engineering group and nothing else; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 3 }, as: ProgramAdmin, captures: { grp_id: $.data.id, grp_v: $.data.version } }
          trigger:
            - { call: "GET /employee-groups/00000000-0000-4000-8000-000000000001", as: ProgramAdmin, captures: { e_group: $.data.error_id } }
            - { call: "POST /budget-rules/00000000-0000-4000-8000-000000000002/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, captures: { e_rule: $.data.error_id } }
            - { call: "GET /employees/00000000-0000-4000-8000-000000000003", as: ProgramAdmin, captures: { e_emp: $.data.error_id } }
            - { call: "GET /benefit-periods/00000000-0000-4000-8000-000000000004", as: ProgramAdmin, captures: { e_per: $.data.error_id } }
            - { call: "GET /restaurants/00000000-0000-4000-8000-000000000005", as: PlatformAdmin, captures: { e_rest: $.data.error_id } }
            - { call: "GET /meal-programs/${prog_id}/eligible-restaurants", payload: { delivery_location_id: "00000000-0000-4000-8000-000000000006" }, as: ProgramAdmin, captures: { e_loc: $.data.error_id } }
            - { call: "GET /group-orders/00000000-0000-4000-8000-000000000007", as: ProgramAdmin, captures: { e_go: $.data.error_id } }
            - { call: "GET /credit-claims/00000000-0000-4000-8000-000000000008", as: ProgramAdmin, captures: { e_claim: $.data.error_id } }
            - { call: "POST /expense-exports/00000000-0000-4000-8000-000000000009/acknowledge", as: BenefitsController, captures: { e_exp: $.data.error_id } }
            - { call: "GET /meal-programs/00000000-0000-4000-8000-00000000000a/employee-groups", as: ProgramAdmin, captures: { e_prog: $.data.error_id } }
          assert:
            - "every one of the ten responses is HTTP 404 with response_type error"
            - "e_group == ERR_EMPLOYEE_GROUP_NOT_FOUND, e_rule == ERR_BUDGET_RULE_NOT_FOUND, e_emp == ERR_EMPLOYEE_NOT_FOUND, e_per == ERR_BENEFIT_PERIOD_NOT_FOUND"
            - "e_rest == ERR_RESTAURANT_NOT_FOUND, e_loc == ERR_DELIVERY_LOCATION_NOT_FOUND, e_go == ERR_GROUP_ORDER_NOT_FOUND"
            - "e_claim == ERR_CREDIT_CLAIM_NOT_FOUND, e_exp == ERR_EXPENSE_EXPORT_NOT_FOUND, e_prog == ERR_MEAL_PROGRAM_NOT_FOUND"
            - "the eligible-restaurants failure is a 404 on the body reference and not a 200 with total_count 0, which is reserved for a valid dock with no matching restaurant"
            - "EmployeeGroup.${grp_id}.version is still 1 and active_budget_rule_id is still null, so no failed lookup mutated state"

      - name: every_failure_uses_the_same_error_envelope_with_a_machine_readable_id
        claim_type: error_triggerable
        grounds:
          - response_envelope.error
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_MEAL_PROGRAM_NOT_FOUND
        distinguishing_aspect: "A 400 body-validation failure and a 404 lookup failure share one envelope shape — meta.api_request_id plus meta.api_request_timestamp, response_type error, and data limited to error_id and message — while the success path uses response_type object, so clients branch on response_type and error_id alone."
        test_recipe:
          setup:
            - "An empty database with the clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { e_invalid: $.data.error_id, m_invalid: $.data.message } }
            - { call: "GET /meal-programs/00000000-0000-4000-8000-00000000000b", as: PlatformAdmin, captures: { e_missing: $.data.error_id } }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
          assert:
            - "the first response is 400 with response_type error, e_invalid == ERR_INVALID_REQUEST and a non-empty m_invalid"
            - "the second response is 404 with response_type error and e_missing == ERR_MEAL_PROGRAM_NOT_FOUND"
            - "both error bodies expose exactly error_id and message under data, with no id, version or partial entity fields"
            - "both error bodies still carry meta.api_request_id and meta.api_request_timestamp"
            - "the third response is 201 with response_type object and data.id == ${prog_id}, so only the envelope discriminator changes between success and failure"

  # =========================================================================
  - section: rbac
    instances:

      - name: another_roles_exclusive_operation_is_unauthorized_and_a_missing_identity_is_401
        claim_type: exclusive_operations
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.ProgramAdmin.exclusive_operations
          - roles.BenefitsController.exclusive_operations
          - roles.Employee.exclusive_operations
          - roles.Restaurant.exclusive_operations
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: "Six cross-role writes are each refused with 403 ERR_UNAUTHORIZED and leave the database untouched, while the same catalogue write issued with no identity header at all is 401 ERR_UNAUTHENTICATED because priority 1 precedes priority 2."
        test_recipe:
          setup:
