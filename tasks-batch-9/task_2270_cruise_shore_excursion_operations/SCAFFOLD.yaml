# =============================================================================
# task_2270 — Cruise Shore Excursion Operations
# Seed tables §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9)
# live in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2270. Cruise Shore Excursion Operations (cruise line shore excursion department): excursion catalog development by port with tour operator vetting, insurance and safety audits, capacity allocation, pricing tiers and pre-cruise versus onboard sales channels, guest booking with mobility and age restrictions, medical suitability warnings and language options, ticketing, meeting point assignment and tender priority coordination, port timing risk with all-aboard deadlines and the line's return guarantee for its own excursions, weather and operational cancellation policy with refunds and alternatives, guest incident reporting, operator liability and claims handling, commission settlement with operators and revenue reporting per port

domain_name: cruise-shore-excursions
api_prefix: /shore-excursions

logical_clock:
  default_current_utc: "2026-08-01T00:00:00Z"
  set_endpoint: "POST /_clock/set_current_utc"
  note: |
    Every temporal rule in this scaffold reads the logical clock rather than the
    wall clock: the 60-minute sales cutoff, the check-in window, the four
    guest-refund tiers, the 2880-minute pre-cruise release, the 30-day insurance
    runway, the all-aboard deadline and the timing-risk projections. The clock
    starts at 2026-08-01T00:00:00Z and is moved only by POST /_clock/set_current_utc.

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by explicit foreign keys in request bodies. Only three
  # sub-resource paths exist (meeting-points, tender-waves, safety-audits,
  # incidents, refund-ledger) and they exist for reverse-reachability; every
  # business object is addressed at its own top-level collection.

  state_machine_shape: parallel
  # Booking carries two independent dimensions (fulfillment_status x
  # financial_status). TourOperator.vetting_status and LiabilityClaim.status are
  # cyclic (SUBMITTED->INFO_REQUESTED->SUBMITTED, UNDER_OPERATOR_REVIEW->
  # DISPUTED->UNDER_OPERATOR_REVIEW). ExcursionDeparture cancellation is a
  # fork-join with divergent side-effect sets per cause.

  relationship_patterns:
    - one_to_many          # Port -> PortCall, PortCall -> TenderWave, ExcursionDeparture -> Booking
    - self_referential     # Excursion.alternative_excursion_id -> Excursion.id
    - cross_aggregate      # CommissionStatement spans TourOperator x PortCall x Booking x LiabilityClaim
    - polymorphic_free     # no polymorphic FKs; every FK names exactly one parent entity

  role_model: segregation_of_duties
  # Two SoD gates keyed on X-User-ID: the OperatorVettingOfficer who recorded the
  # operator's latest SafetyAudit may not APPROVE that operator's vetting; the
  # RiskOfficer who opened a LiabilityClaim may not adjudicate it.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 14 entities, 58 endpoints, 59 error codes, 12 calculations (3 with explicit
  # variants and 5 more with pinned rounding or evaluation order), 9 state machines
  # across 8 entities (2 cyclic, 1 fork-join, 1 entity with 2 parallel dimensions),
  # 63 transitions, 3 OCC rules and 47 strictly ordered validation rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Port
    parent: null
    common_fields: true
    fields:
      - name: port_code
        type: string
        source: input
        description: "Unique UN/LOCODE-style port code, upper-case"
        constraints: "3 to 5 chars, ^[A-Z]{3,5}$, unique across all Port rows"
      - name: name
        type: string
        source: input
        description: "Display name of the port of call"
      - name: country_code
        type: string
        source: input
        description: "ISO-3166 alpha-2 country code"
        constraints: "^[A-Z]{2}$"
      - name: docking_mode
        type: enum
        source: input
        description: "ALONGSIDE = guests walk off; TENDER = guests move ashore by tender boat"
        constraints: "ALONGSIDE | TENDER"
      - name: risk_buffer_minutes
        type: integer
        source: input
        description: "Port-specific safety margin subtracted from all-aboard slack when banding departure timing risk"
        default: 30
        constraints: ">= 0 and <= 240"
      - name: tender_egress_minutes
        type: integer
        source: input
        description: "Minutes charged to a departure for the ship-to-shore tender leg when docking_mode == TENDER; ignored for ALONGSIDE"
        default: 25
        constraints: ">= 0 and <= 180"

  - name: MeetingPoint
    parent: null
    common_fields: true
    fields:
      - name: port_id
        type: string
        source: input
        description: "FK -> Port.id; the port whose pier area holds this meeting point"
      - name: name
        type: string
        source: input
        description: "Signage name used on guest tickets"
      - name: zone
        type: enum
        source: input
        description: "Physical zone of the meeting point"
        constraints: "PIER_APRON | TENDER_PONTOON | TERMINAL_HALL"
      - name: max_concurrent_groups
        type: integer
        source: input
        description: "Maximum number of departure groups whose occupation windows may intersect at any instant"
        constraints: ">= 1 and <= 12"
      - name: slot_buffer_minutes
        type: integer
        source: input
        description: "Clear-down buffer appended to the END of each departure occupation window at this meeting point"
        default: 10
        constraints: ">= 0 and <= 60"

  - name: PortCall
    parent: null
    common_fields: true
    fields:
      - name: port_id
        type: string
        source: input
        description: "FK -> Port.id; the port this call visits"
      - name: voyage_code
        type: string
        source: input
        description: "Voyage identifier, e.g. AURORA-2609"
      - name: ship_code
        type: string
        source: input
        description: "Ship identifier, e.g. MS-AURORA"
      - name: arrival_utc
        type: datetime
        source: input
        description: "Scheduled first-line-ashore instant, ISO 8601 UTC"
      - name: all_aboard_utc
        type: datetime
        source: input
        description: "Published all-aboard deadline; NEVER shifted by delay_minutes because the ship must sail on schedule"
      - name: departure_utc
        type: datetime
        source: input
        description: "Scheduled last-line-away instant"
      - name: delay_minutes
        type: integer
        source: computed
        description: "Cumulative arrival delay recorded via POST /shore-excursions/port-calls/{portCallId}/delays; shifts arrival and every meeting time later, never all_aboard_utc"
        default: 0
        constraints: ">= 0"
      - name: effective_arrival_utc
        type: datetime
        source: computed
        description: "arrival_utc + delay_minutes"
      - name: status
        type: enum
        source: computed
        description: "Port-call lifecycle state"
        default: PLANNED
        constraints: "PLANNED | OPEN_FOR_SALE | IN_PORT | CLOSED | CANCELLED"

  - name: TenderWave
    parent: null
    common_fields: true
    fields:
      - name: port_call_id
        type: string
        source: input
        description: "FK -> PortCall.id; the call this tender wave serves"
      - name: wave_index
        type: integer
        source: input
        description: "Operator-assigned ordinal of the wave within the call; unique per port_call_id"
        constraints: ">= 1 and <= 40"
      - name: window_start_utc
        type: datetime
        source: input
        description: "Closed-interval start of the wave's shore-landing window"
      - name: window_end_utc
        type: datetime
        source: input
        description: "Closed-interval end of the wave's shore-landing window; must be > window_start_utc"
      - name: guest_capacity
        type: integer
        source: input
        description: "Total guests this wave can land ashore"
        constraints: ">= 1"
      - name: priority_class
        type: enum
        source: input
        description: "EXCURSION_PRIORITY waves may be assigned to excursion departures; GENERAL waves serve independent guests only"
        constraints: "EXCURSION_PRIORITY | GENERAL"
      - name: assigned_guest_count
        type: integer
        source: computed
        description: "Sum of total_capacity over ExcursionDeparture rows whose tender_wave_id == this wave and whose status NOT IN {CANCELLED_WEATHER, CANCELLED_OPERATIONAL}"
        default: 0
      - name: assigned_departure_count
        type: integer
        source: computed
        description: "Count of ExcursionDeparture rows whose tender_wave_id == this wave and whose status NOT IN {CANCELLED_WEATHER, CANCELLED_OPERATIONAL}"
        default: 0

  - name: TourOperator
    parent: null
    common_fields: true
    fields:
      - name: port_id
        type: string
        source: input
        description: "FK -> Port.id; the port at which this operator is vetted to trade"
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the tour operator"
      - name: contact_email
        type: string
        source: input
        description: "Operations contact address"
      - name: insurance_expiry_date
        type: datetime
        source: input
        description: "Instant at which the operator's public liability cover lapses, ISO 8601 UTC"
      - name: insurance_liability_limit_cents
        type: integer
        source: input
        description: "Per-occurrence liability limit of the operator's cover, in cents"
        constraints: ">= 0"
      - name: commission_rate_bps
        type: integer
        source: input
        description: "Basis points of ticket value the cruise line retains as commission"
        constraints: ">= 0 and <= 5000"
      - name: vetting_status
        type: enum
        source: computed
        description: "Vetting lifecycle state"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | INFO_REQUESTED | APPROVED | SUSPENDED | TERMINATED"
      - name: vetting_cycle_count
        type: integer
        source: computed
        description: "Number of REQUEST_INFO rounds served on this operator"
        default: 0
      - name: safety_score
        type: integer
        source: computed
        description: "0-100 weighted audit score net of critical-finding and upheld-claim penalties, per calculations.operator_safety_score"
        default: 0
      - name: reliability_strikes
        type: integer
        source: computed
        description: "Count of OPERATIONAL departure cancellations charged to this operator"
        default: 0
      - name: liability_reserve_cents
        type: integer
        source: computed
        description: "Sum of accepted liability across LiabilityClaim rows with status == ADJUDICATED_UPHELD for this operator"
        default: 0
      - name: latest_audit_auditor_user_id
        type: string
        source: computed
        description: "X-User-ID recorded on the most recent SafetyAudit for this operator (ordered by conducted_on DESC, created_at DESC); null when no audit exists"
        default: null

  - name: SafetyAudit
    parent: null
    common_fields: false
    # Immutable append-only record: it carries an id and a created_at so it can be
    # addressed and ordered, but no updated_at and no version, and no endpoint ever
    # rewrites one. A correction is recorded as a new audit.
    fields:
      - name: id
        type: string
        source: system
        description: "Server-generated UUID; SafetyAudit rows are addressable but never updated"
      - name: created_at
        type: datetime
        source: system
        description: "Logical-clock instant the audit row was recorded; the tie-break key when two audits share conducted_on"
      - name: operator_id
        type: string
        source: input
        description: "FK -> TourOperator.id; the audited operator"
      - name: audit_type
        type: enum
        source: input
        description: "Reason the audit was run"
        constraints: "INITIAL | ANNUAL | INCIDENT_TRIGGERED"
      - name: conducted_on
        type: datetime
        source: input
        description: "Instant the audit was performed, ISO 8601 UTC; must be <= current logical clock"
      - name: raw_score
        type: integer
        source: input
        description: "Unweighted audit result"
        constraints: ">= 0 and <= 100"
      - name: critical_finding_count
        type: integer
        source: input
        description: "Number of critical (life-safety) findings raised by this audit"
        constraints: ">= 0 and <= 20"
      - name: auditor_user_id
        type: string
        source: system
        description: "X-User-ID of the OperatorVettingOfficer who recorded the audit; blocks that same officer from approving the operator"

  - name: Excursion
    parent: null
    common_fields: true
    fields:
      - name: port_id
        type: string
        source: input
        description: "FK -> Port.id; the port this catalog item is sold at"
      - name: operator_id
        type: string
        source: input
        description: "FK -> TourOperator.id; the operator delivering the tour"
      - name: alternative_excursion_id
        type: string
        source: input
        description: "FK -> Excursion.id; self-reference naming the fallback catalog item offered when a departure of this excursion is cancelled; null when no fallback is nominated"
        default: null
      - name: title
        type: string
        source: input
        description: "Guest-facing excursion title"
      - name: duration_minutes
        type: integer
        source: input
        description: "Ashore tour duration excluding transfers"
        constraints: ">= 30 and <= 720"
      - name: min_age
        type: integer
        source: input
        description: "Minimum guest age in whole years at the meeting date"
        constraints: ">= 0 and <= 21"
      - name: max_age
        type: integer
        source: input
        description: "Maximum guest age in whole years at the meeting date; null means no ceiling"
        default: null
        constraints: "null, or an integer in [0, 120]; the cross-field max_age >= min_age ordering is NOT part of this range check — it is enforced at validations priority 9 (ERR_INVALID_TIME_WINDOW), never at priority 6"
      - name: mobility_level
        type: enum
        source: input
        description: "Physical demand grade; LEVEL_4 additionally requires guest.mobility_level == FULL and no medical flag in {CARDIAC, RESPIRATORY, PREGNANCY}"
        constraints: "LEVEL_1 | LEVEL_2 | LEVEL_3 | LEVEL_4"
      - name: medical_warning_codes
        type: array
        source: input
        description: "Medical suitability warning codes attached to this tour; guests whose medical_flags intersect this set must acknowledge"
        default: []
        constraints: "subset of {CARDIAC, RESPIRATORY, PREGNANCY, MOTION_SICKNESS, ALTITUDE}"
      - name: languages
        type: array
        source: input
        description: "Guide languages offered; a booking's language_choice must be a member"
        constraints: "non-empty subset of {EN, ES, DE, FR, IT, PT, ZH}"
      - name: base_price_cents
        type: integer
        source: input
        description: "Per-guest list price before tier multiplier, channel adjustment and discounts"
        constraints: ">= 100"
      - name: price_tier
        type: enum
        source: input
        description: "Pricing tier selecting the multiplier in calculations.booking_price_quote"
        constraints: "VALUE | STANDARD | PREMIUM | SIGNATURE"
      - name: is_line_operated
        type: boolean
        source: input
        description: "True when the cruise line itself operates the tour"
      - name: return_guarantee
        type: boolean
        source: computed
        description: "Mirrors is_line_operated: the line guarantees return before all-aboard only for its own excursions"
      - name: catalog_status
        type: enum
        source: computed
        description: "Catalog lifecycle state"
        default: DRAFT
        constraints: "DRAFT | PENDING_REVIEW | PUBLISHED | WITHDRAWN | ARCHIVED"
      - name: published_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent PUBLISH transition; null before first publish"
        default: null

  - name: ExcursionDeparture
    parent: null
    common_fields: true
    fields:
      - name: excursion_id
        type: string
        source: input
        description: "FK -> Excursion.id; the catalog item being operated"
      - name: port_call_id
        type: string
        source: input
        description: "FK -> PortCall.id; the ship call this departure runs on"
      - name: meeting_point_id
        type: string
        source: input
        description: "FK -> MeetingPoint.id; where the group assembles"
      - name: tender_wave_id
        type: string
        source: computed
        description: "FK -> TenderWave.id; wave chosen by calculations.tender_wave_selection; null until assigned"
        default: null
      - name: meeting_time_utc
        type: datetime
        source: input
        description: "Scheduled assembly instant; must lie within [port_call.arrival_utc, port_call.all_aboard_utc]"
      - name: dispatch_dwell_minutes
        type: integer
        source: input
        description: "Minutes the group occupies the meeting point after meeting_time_utc while loading"
        constraints: ">= 5 and <= 120"
      - name: total_capacity
        type: integer
        source: input
        description: "Seats offered on this departure"
        constraints: ">= 1 and <= 500"
      - name: precruise_allocation
        type: integer
        source: input
        description: "Seats reserved for the PRE_CRUISE channel; precruise_allocation + onboard_allocation must equal total_capacity"
        constraints: ">= 0"
      - name: onboard_allocation
        type: integer
        source: input
        description: "Seats reserved for the ONBOARD channel"
        constraints: ">= 0"
      - name: precruise_sold_seats
        type: integer
        source: computed
        description: "Seats consumed by bookings whose channel == PRE_CRUISE and fulfillment_status NOT IN {CANCELLED_BY_GUEST, CANCELLED_BY_LINE}"
        default: 0
      - name: onboard_sold_seats
        type: integer
        source: computed
        description: "Seats consumed by bookings whose channel == ONBOARD and fulfillment_status NOT IN {CANCELLED_BY_GUEST, CANCELLED_BY_LINE}"
        default: 0
      - name: seats_available_total
        type: integer
        source: computed
        description: "total_capacity - precruise_sold_seats - onboard_sold_seats"
        default: 0
      - name: effective_precruise_available
        type: integer
        source: computed
        description: "Seats a PRE_CRUISE booking may consume now, per calculations.channel_allocation_availability"
        default: 0
      - name: effective_onboard_available
        type: integer
        source: computed
        description: "Seats an ONBOARD booking may consume now, per calculations.channel_allocation_availability"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Departure lifecycle state"
        default: SCHEDULED
        constraints: "SCHEDULED | SELLING | CLOSED | OPERATING | COMPLETED | CANCELLED_WEATHER | CANCELLED_OPERATIONAL"
      - name: cancellation_cause
        type: enum
        source: computed
        description: "Cause recorded on the cancel transition; null while not cancelled"
        default: null
        constraints: "null | WEATHER | OPERATIONAL"
      - name: projected_return_scheduled_utc
        type: datetime
        source: computed
        description: "SCHEDULED_BASIS variant of calculations.departure_timing_risk"
      - name: projected_return_actual_utc
        type: datetime
        source: computed
        description: "ACTUAL_BASIS variant of calculations.departure_timing_risk"
      - name: slack_minutes_scheduled
        type: integer
        source: computed
        description: "Minutes between projected_return_scheduled_utc and all_aboard_utc, less port.risk_buffer_minutes; may be negative"
      - name: slack_minutes_actual
        type: integer
        source: computed
        description: "Same measure on the ACTUAL_BASIS projection"
      - name: timing_risk_band_scheduled
        type: enum
        source: computed
        description: "Band of slack_minutes_scheduled; gates return-guarantee eligibility only"
        constraints: "GREEN | AMBER | RED"
      - name: timing_risk_band_actual
        type: enum
        source: computed
        description: "Band of slack_minutes_actual; gates sales and dispatch"
        constraints: "GREEN | AMBER | RED"
      - name: return_guarantee_eligible
        type: boolean
        source: computed
        description: "True when excursion.return_guarantee AND timing_risk_band_scheduled != RED at the moment of the SCHEDULED->SELLING transition; frozen thereafter"
        default: false
      - name: actual_return_utc
        type: datetime
        source: computed
        description: "Instant recorded on the COMPLETE operation; null before completion"
        default: null

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Guest name as manifested"
      - name: birth_date
        type: datetime
        source: input
        description: "Date of birth at midnight UTC; drives age_at_meeting"
      - name: voyage_code
        type: string
        source: input
        description: "Voyage the guest is sailing; must equal port_call.voyage_code of any departure booked"
      - name: mobility_level
        type: enum
        source: input
        description: "Declared mobility capability; ranked WHEELCHAIR(1) < ASSISTED(2) < FULL(3)"
        constraints: "WHEELCHAIR | ASSISTED | FULL"
      - name: language_pref
        type: enum
        source: input
        description: "Preferred guide language"
        constraints: "EN | ES | DE | FR | IT | PT | ZH"
      - name: medical_flags
        type: array
        source: input
        description: "Declared medical conditions"
        default: []
        constraints: "subset of {CARDIAC, RESPIRATORY, PREGNANCY, MOTION_SICKNESS, ALTITUDE}"
      - name: loyalty_tier
        type: enum
        source: input
        description: "Loyalty status driving the loyalty discount"
        default: NONE
        constraints: "NONE | SILVER | GOLD | PLATINUM"

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: departure_id
        type: string
        source: input
        description: "FK -> ExcursionDeparture.id; the departure being booked"
      - name: guest_id
        type: string
        source: input
        description: "FK -> Guest.id; the lead guest whose age, mobility and medical flags gate eligibility"
      - name: alternative_departure_id
        type: string
        source: computed
        description: "FK -> ExcursionDeparture.id; alternative departure offered when this booking's departure was cancelled with offer_alternative == true; null otherwise"
        default: null
      - name: party_size
        type: integer
        source: input
        description: "Seats consumed by this booking; every seat is charged at per_guest_price_cents"
        constraints: ">= 1 and <= 20"
      - name: channel
        type: enum
        source: input
        description: "Sales channel; decides which allocation bucket the seats leave and return to"
        constraints: "PRE_CRUISE | ONBOARD"
      - name: language_choice
        type: enum
        source: input
        description: "Guide language selected for this booking; must be in excursion.languages"
        constraints: "EN | ES | DE | FR | IT | PT | ZH"
      - name: medical_warning_acknowledged
        type: boolean
        source: input
        description: "Guest acknowledgement of medical warnings; required only when excursion.medical_warning_codes intersects guest.medical_flags"
        default: false
      - name: age_at_meeting
        type: integer
        source: computed
        description: "Whole years from guest.birth_date to the calendar date of departure.meeting_time_utc, per calculations.guest_eligibility_screen"
      - name: per_guest_price_cents
        type: integer
        source: computed
        description: "Rounded per-guest price from calculations.booking_price_quote"
      - name: quoted_total_cents
        type: integer
        source: computed
        description: "per_guest_price_cents * party_size; the commissionable ticket value"
      - name: service_fee_cents
        type: integer
        source: computed
        description: "Non-commissionable booking fee retained by the line, capped at SERVICE_FEE_CAP_CENTS"
      - name: charge_total_cents
        type: integer
        source: computed
        description: "quoted_total_cents + service_fee_cents; the amount authorised and later charged"
      - name: refunded_cents
        type: integer
        source: computed
        description: "Sum of RefundLedgerEntry.amount_cents for this booking with entry_kind == REFUND"
        default: 0
      - name: retained_cents
        type: integer
        source: computed
        description: "charge_total_cents - refunded_cents once financial_status is terminal; 0 while AUTHORIZED"
        default: 0
      - name: goodwill_credit_cents
        type: integer
        source: computed
        description: "Sum of RefundLedgerEntry.amount_cents for this booking with entry_kind IN {GOODWILL_CREDIT, REPATRIATION_ALLOWANCE}"
        default: 0
      - name: commission_accrued_cents
        type: integer
        source: computed
        description: "Line commission currently accrued on this booking line, per calculations.operator_commission_accrual"
        default: 0
      - name: fulfillment_status
        type: enum
        source: computed
        description: "Fulfillment dimension of the Booking state machine"
        default: BOOKED
        constraints: "BOOKED | TICKETED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED_BY_GUEST | CANCELLED_BY_LINE"
      - name: financial_status
        type: enum
        source: computed
        description: "Money dimension of the Booking state machine, evolving independently of fulfillment_status"
        default: AUTHORIZED
        constraints: "AUTHORIZED | CHARGED | PARTIALLY_REFUNDED | REFUNDED | RETAINED | VOIDED"
      - name: alternative_offer_status
        type: enum
        source: computed
        description: "State of the rebooking offer attached to a line cancellation"
        default: NONE
        constraints: "NONE | OFFERED | EXPIRED"
      - name: return_guarantee_honored
        type: boolean
        source: computed
        description: "Set on departure COMPLETE: false when the departure returned after the all-aboard deadline, true otherwise; stays true for non-guaranteed excursions that returned on time"
        default: true

  - name: RefundLedgerEntry
    parent: null
    common_fields: false
    # Immutable append-only money movement: id and created_at only, no updated_at
    # and no version. A reversal is a new entry, never an edit of an old one.
    fields:
      - name: id
        type: string
        source: system
        description: "Server-generated UUID; RefundLedgerEntry rows are addressable but never updated"
      - name: created_at
        type: datetime
        source: system
        description: "Logical-clock instant the money movement was booked; the ledger's ordering key"
      - name: booking_id
        type: string
        source: system
        description: "FK -> Booking.id; the booking this money movement belongs to. Set by the system: no endpoint creates ledger entries directly, they are only ever appended as side effects of cancellations, no-shows, refunds and return-guarantee breaches."
      - name: entry_kind
        type: enum
        source: system
        description: "Kind of money movement"
        constraints: "REFUND | AUTH_VOID | GOODWILL_CREDIT | REPATRIATION_ALLOWANCE | RETENTION"
      - name: amount_cents
        type: integer
        source: system
        description: "Positive cents moved by this entry; AUTH_VOID entries carry 0"
        constraints: ">= 0"
      - name: refund_pct_bps
        type: integer
        source: system
        description: "Basis points of quoted_total_cents applied by this entry; 0 for AUTH_VOID and RETENTION"
        default: 0
      - name: basis
        type: enum
        source: system
        description: "Policy branch that produced the entry"
        constraints: "GUEST_INITIATED | LINE_CANCELLED_WEATHER | LINE_CANCELLED_OPERATIONAL | NO_SHOW | RETURN_GUARANTEE_BREACH"
      - name: reason_code
        type: string
        source: system
        description: "Free-form policy reason recorded for audit"

  - name: GuestIncident
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking the incident occurred under"
      - name: category
        type: enum
        source: input
        description: "Incident category"
        constraints: "INJURY | MEDICAL | PROPERTY_LOSS | LEFT_BEHIND | SERVICE_FAILURE"
      - name: severity
        type: enum
        source: input
        description: "Severity grade; SEVERE incidents force an INCIDENT_TRIGGERED audit before the operator can be reinstated"
        constraints: "MINOR | MODERATE | SEVERE"
      - name: occurred_utc
        type: datetime
        source: input
        description: "Instant the incident occurred; must be <= current logical clock"
      - name: narrative
        type: string
        source: input
        description: "Reporter's account of the incident"
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ShoreExcursionDesk agent who filed the report"
      - name: status
        type: enum
        source: computed
        description: "Incident lifecycle state"
        default: FILED
        constraints: "FILED | CLAIM_OPENED | CLOSED_NO_CLAIM | CLOSED_UPHELD | CLOSED_DENIED"

  - name: LiabilityClaim
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> GuestIncident.id; the incident this claim arises from"
      - name: operator_id
        type: string
        source: computed
        description: "FK -> TourOperator.id; resolved through incident.booking_id -> Booking.departure_id -> ExcursionDeparture.excursion_id -> Excursion.operator_id"
      - name: port_call_id
        type: string
        source: computed
        description: "FK -> PortCall.id; resolved through incident.booking_id -> Booking.departure_id -> ExcursionDeparture.port_call_id"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: "Amount claimed against the operator, in cents"
        constraints: ">= 1"
      - name: basis_code
        type: enum
        source: input
        description: "Legal basis asserted"
        constraints: "NEGLIGENCE | EQUIPMENT_FAILURE | GUIDE_CONDUCT | ROUTE_DEVIATION | MEDICAL_RESPONSE"
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle state"
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_OPERATOR_REVIEW | DISPUTED | ADJUDICATED_UPHELD | ADJUDICATED_DENIED | SETTLED"
      - name: dispute_round_count
        type: integer
        source: computed
        description: "Number of RECORD_DISPUTE actions served on this claim"
        default: 0
      - name: liability_share_bps
        type: integer
        source: computed
        description: "Operator's adjudicated share of the settlement, in basis points; 0 until adjudicated"
        default: 0
      - name: settlement_amount_cents
        type: integer
        source: computed
        description: "Adjudicated gross settlement before liability_share_bps is applied; 0 until adjudicated"
        default: 0
      - name: operator_charge_cents
        type: integer
        source: computed
        description: "round_half_up(settlement_amount_cents * liability_share_bps / 10000); the amount offset against the operator's payable"
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the RiskOfficer who opened the claim"
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the RiskOfficer who adjudicated; MUST differ from submitted_by_user_id"
        default: null

  - name: CommissionStatement
    parent: null
    common_fields: true
    fields:
      - name: operator_id
        type: string
        source: input
        description: "FK -> TourOperator.id; the operator being settled"
      - name: port_call_id
        type: string
        source: input
        description: "FK -> PortCall.id; the call being settled"
      - name: basis
        type: enum
        source: input
        description: "Accrual basis selecting the calculations.operator_commission_accrual variant"
        constraints: "PROVISIONAL | FINAL"
      - name: status
        type: enum
        source: computed
        description: "Statement lifecycle state"
        default: DRAFT
        constraints: "DRAFT | ISSUED | DISPUTED | ADJUSTED | SETTLED | VOIDED"
      - name: gross_ticket_cents
        type: integer
        source: computed
        description: "Aggregated commissionable ticket value in scope, per calculations.statement_net_payable step 1"
        default: 0
      - name: refunds_cents
        type: integer
        source: computed
        description: "Aggregated REFUND ledger amount in scope"
        default: 0
      - name: port_fee_cents
        type: integer
        source: computed
        description: "Port infrastructure fee, computed on gross_ticket_cents before commission (step 2)"
        default: 0
      - name: line_commission_cents
        type: integer
        source: computed
        description: "Per-line-rounded commission for this statement's basis (step 3)"
        default: 0
      - name: claim_offset_cents
        type: integer
        source: computed
        description: "Aggregated operator_charge_cents of upheld claims in scope (step 4)"
        default: 0
      - name: operational_penalty_cents
        type: integer
        source: computed
        description: "Aggregated OPERATIONAL cancellation penalty charged to the operator in scope (step 5)"
        default: 0
      - name: payable_pre_rebate_cents
        type: integer
        source: computed
        description: "gross_ticket_cents - port_fee_cents - line_commission_cents - claim_offset_cents - operational_penalty_cents, floored at 0 (step 6)"
        default: 0
      - name: rebate_bps
        type: integer
        source: computed
        description: "Volume rebate rate selected from payable_pre_rebate_cents exactly once (step 7)"
        default: 0
      - name: rebate_cents
        type: integer
        source: computed
        description: "round_half_up(payable_pre_rebate_cents * rebate_bps / 10000) (step 8)"
        default: 0
      - name: adjustment_cents
        type: integer
        source: computed
        description: "Signed manual adjustment applied by the ADJUST action on a DISPUTED statement"
        default: 0
      - name: operator_payable_cents
        type: integer
        source: computed
        description: "payable_pre_rebate_cents + rebate_cents + adjustment_cents (step 9)"
        default: 0
      - name: booking_line_count
        type: integer
        source: computed
        description: "Number of booking lines that entered gross_ticket_cents"
        default: 0
      - name: issued_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the ISSUE transition; null while DRAFT or VOIDED"
        default: null
      - name: settled_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the SETTLE transition; null until settled"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- TourOperator
  - entity: TourOperator
    dimension: vetting_status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /shore-excursions/operators/{operatorId}/vetting-actions action=SUBMIT"
        actor: OperatorVettingOfficer
        preconditions:
          - "at least one SafetyAudit exists with operator_id == operator.id (else ERR_AUDIT_REQUIRED)"
          - "operator.insurance_expiry_date > logical_clock.now (else ERR_INSURANCE_EXPIRED)"
        side_effects:
          - "recompute operator.safety_score per calculations.operator_safety_score"
          - "increments TourOperator.version by 1"
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /shore-excursions/operators/{operatorId}/vetting-actions action=REQUEST_INFO"
        actor: OperatorVettingOfficer
        preconditions: []
        side_effects:
          - "operator.vetting_cycle_count += 1"
          - "increments TourOperator.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /shore-excursions/operators/{operatorId}/vetting-actions action=RESUBMIT"
        actor: OperatorVettingOfficer
        preconditions:
          - "operator.vetting_cycle_count <= MAX_VETTING_CYCLES (3) (else ERR_VETTING_CYCLE_EXHAUSTED)"
          - "operator.insurance_expiry_date > logical_clock.now (else ERR_INSURANCE_EXPIRED)"
        side_effects:
          - "recompute operator.safety_score"
          - "increments TourOperator.version by 1"
        note: "Cycle edge — INFO_REQUESTED -> SUBMITTED -> INFO_REQUESTED may repeat until vetting_cycle_count exceeds 3."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /shore-excursions/operators/{operatorId}/vetting-actions action=APPROVE"
        actor: OperatorVettingOfficer
        preconditions:
          - "X-User-ID != operator.latest_audit_auditor_user_id (else ERR_AUDITOR_CANNOT_APPROVE)"
          - "operator.insurance_expiry_date > logical_clock.now (else ERR_INSURANCE_EXPIRED)"
          - "operator.insurance_liability_limit_cents >= MIN_LIABILITY_LIMIT_CENTS (100000000) (else ERR_INSURANCE_LIMIT_INSUFFICIENT)"
          - "operator.safety_score >= SUSPENSION_SCORE_FLOOR (60) (else ERR_SAFETY_SCORE_BELOW_FLOOR)"
        side_effects:
          - "increments TourOperator.version by 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /shore-excursions/operators/{operatorId}/vetting-actions action=SUSPEND, OR system: safety_score recomputed below 60 after POST /operators/{operatorId}/safety-audits or claim ADJUDICATE_UPHELD, OR system: reliability_strikes reaches 3 after an OPERATIONAL departure cancellation"
        actor: OperatorVettingOfficer | system
        preconditions: []
        side_effects:
          - "CASCADE-A hop 2: every Excursion with operator_id == operator.id and catalog_status == PUBLISHED transitions PUBLISHED -> WITHDRAWN"
          - "each WITHDRAWN excursion in turn (CASCADE-A hop 3) cancels its ExcursionDeparture rows whose status IN {SCHEDULED, SELLING, CLOSED} with cancellation_cause = OPERATIONAL"
          - "each cancelled departure in turn (CASCADE-A hop 4) drives its Booking rows through the line-cancellation path (fulfillment -> CANCELLED_BY_LINE, financial -> REFUNDED or VOIDED, RefundLedgerEntry appended, seats returned to the booking's channel bucket, tender wave counters released)"
          - "increments TourOperator.version by 1"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /shore-excursions/operators/{operatorId}/vetting-actions action=REINSTATE"
        actor: OperatorVettingOfficer
        preconditions:
          - "operator.safety_score >= SUSPENSION_SCORE_FLOOR (60) (else ERR_SAFETY_SCORE_BELOW_FLOOR)"
          - "operator.insurance_expiry_date > logical_clock.now (else ERR_INSURANCE_EXPIRED)"
          - "no LiabilityClaim with operator_id == operator.id and status IN {SUBMITTED, UNDER_OPERATOR_REVIEW, DISPUTED} (else ERR_OPEN_CLAIM_BLOCKS_ISSUE)"
        side_effects:
          - "operator.reliability_strikes reset to 0"
          - "increments TourOperator.version by 1"
        note: "Cycle edge — APPROVED <-> SUSPENDED may repeat. Withdrawn excursions are NOT auto-republished; the ExcursionManager must PUBLISH them again."
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /shore-excursions/operators/{operatorId}/vetting-actions action=TERMINATE"
        actor: OperatorVettingOfficer
        preconditions:
          - "no LiabilityClaim with operator_id == operator.id and status IN {SUBMITTED, UNDER_OPERATOR_REVIEW, DISPUTED} (else ERR_OPEN_CLAIM_BLOCKS_ISSUE)"
        side_effects:
          - "every Excursion of this operator with catalog_status IN {DRAFT, PENDING_REVIEW, WITHDRAWN} transitions to ARCHIVED"
          - "increments TourOperator.version by 1"

  # ------------------------------------------------------------------- Excursion
  - entity: Excursion
    dimension: catalog_status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    shape: branching_with_revert
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /shore-excursions/excursions/{excursionId}/catalog-actions action=SUBMIT_REVIEW"
        actor: ExcursionManager
        preconditions:
          - "excursion.languages is non-empty"
        side_effects: ["increments Excursion.version by 1"]
      - from: PENDING_REVIEW
        to: DRAFT
        trigger: "POST /shore-excursions/excursions/{excursionId}/catalog-actions action=RETURN_TO_DRAFT"
        actor: ExcursionManager
        preconditions: []
        side_effects: ["increments Excursion.version by 1"]
      - from: PENDING_REVIEW
        to: PUBLISHED
        trigger: "POST /shore-excursions/excursions/{excursionId}/catalog-actions action=PUBLISH"
        actor: ExcursionManager
        preconditions:
          - "TourOperator(excursion.operator_id).vetting_status == APPROVED (else ERR_OPERATOR_NOT_APPROVED)"
          - "TourOperator(excursion.operator_id).insurance_expiry_date >= logical_clock.now + MIN_INSURANCE_RUNWAY_DAYS (30 days) (else ERR_INSURANCE_EXPIRED)"
          - "excursion.alternative_excursion_id is null OR the referenced Excursion has catalog_status == PUBLISHED and port_id == excursion.port_id (else ERR_NO_ALTERNATIVE_AVAILABLE)"
        side_effects:
          - "excursion.published_at = logical_clock.now"
          - "every ExcursionDeparture of this excursion with status == SCHEDULED whose port_call.status == OPEN_FOR_SALE transitions SCHEDULED -> SELLING"
          - "increments Excursion.version by 1"
      - from: WITHDRAWN
        to: PUBLISHED
        trigger: "POST /shore-excursions/excursions/{excursionId}/catalog-actions action=PUBLISH"
        actor: ExcursionManager
        preconditions:
          - "TourOperator(excursion.operator_id).vetting_status == APPROVED (else ERR_OPERATOR_NOT_APPROVED)"
          - "TourOperator(excursion.operator_id).insurance_expiry_date >= logical_clock.now + 30 days (else ERR_INSURANCE_EXPIRED)"
        side_effects:
          - "excursion.published_at = logical_clock.now"
          - "increments Excursion.version by 1"
        note: "Cycle edge PUBLISHED -> WITHDRAWN -> PUBLISHED. Departures cancelled during the withdrawal stay cancelled."
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /shore-excursions/excursions/{excursionId}/catalog-actions action=WITHDRAW, OR system: owning TourOperator transitions APPROVED -> SUSPENDED (CASCADE-A hop 2)"
        actor: ExcursionManager | system
        preconditions: []
        side_effects:
          - "CASCADE-A hop 3: every ExcursionDeparture of this excursion with status IN {SCHEDULED, SELLING, CLOSED} is cancelled with cancellation_cause = OPERATIONAL"
          - "increments Excursion.version by 1"
      - from: WITHDRAWN
        to: ARCHIVED
        trigger: "POST /shore-excursions/excursions/{excursionId}/catalog-actions action=ARCHIVE, OR system: owning TourOperator transitions SUSPENDED -> TERMINATED"
        actor: ExcursionManager | system
        preconditions:
          - "no ExcursionDeparture of this excursion has status IN {SELLING, CLOSED, OPERATING}"
        side_effects: ["increments Excursion.version by 1"]
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /shore-excursions/excursions/{excursionId}/catalog-actions action=ARCHIVE, OR system: owning TourOperator transitions SUSPENDED -> TERMINATED"
        actor: ExcursionManager | system
        preconditions: []
        side_effects: ["increments Excursion.version by 1"]
      - from: PENDING_REVIEW
        to: ARCHIVED
        trigger: "system: owning TourOperator transitions SUSPENDED -> TERMINATED"
        actor: system
        preconditions: []
        side_effects: ["increments Excursion.version by 1"]

  # -------------------------------------------------------------------- PortCall
  - entity: PortCall
    dimension: status
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    shape: linear_with_branch_cancel
    transitions:
      - from: PLANNED
        to: OPEN_FOR_SALE
        trigger: "POST /shore-excursions/port-calls/{portCallId}/transitions action=OPEN_SALES"
        actor: ExcursionManager
        preconditions:
          - "port_call.arrival_utc < port_call.all_aboard_utc <= port_call.departure_utc (else ERR_INVALID_TIME_WINDOW)"
          - "if Port(port_call.port_id).docking_mode == TENDER then at least one TenderWave with port_call_id == port_call.id and priority_class == EXCURSION_PRIORITY exists (else ERR_NO_ELIGIBLE_TENDER_WAVE)"
        side_effects:
          - "every ExcursionDeparture on this call with status == SCHEDULED whose Excursion.catalog_status == PUBLISHED transitions SCHEDULED -> SELLING"
          - "increments PortCall.version by 1"
      - from: OPEN_FOR_SALE
        to: IN_PORT
        trigger: "POST /shore-excursions/port-calls/{portCallId}/transitions action=ARRIVE"
        actor: PortAgent
        preconditions:
          - "logical_clock.now >= port_call.effective_arrival_utc (else ERR_INVALID_PORT_CALL_ACTION)"
        side_effects:
          - "increments PortCall.version by 1"
      - from: IN_PORT
        to: CLOSED
        trigger: "POST /shore-excursions/port-calls/{portCallId}/transitions action=CLOSE_ALL_ABOARD"
        actor: PortAgent
        preconditions:
          - "logical_clock.now >= port_call.all_aboard_utc (else ERR_INVALID_PORT_CALL_ACTION)"
        side_effects:
          - "every ExcursionDeparture on this call with status == SELLING transitions SELLING -> CLOSED"
          - "every Booking on this call whose fulfillment_status == TICKETED transitions TICKETED -> NO_SHOW (financial CHARGED -> RETAINED, RefundLedgerEntry entry_kind=RETENTION amount_cents=charge_total_cents basis=NO_SHOW)"
          - "every Booking whose alternative_offer_status == OFFERED flips to EXPIRED"
          - "increments PortCall.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /shore-excursions/port-calls/{portCallId}/transitions action=CANCEL"
        actor: PortAgent
        preconditions: []
        side_effects:
          - "every ExcursionDeparture on this call with status IN {SCHEDULED, SELLING, CLOSED} is cancelled with cancellation_cause = WEATHER"
          - "increments PortCall.version by 1"
      - from: OPEN_FOR_SALE
        to: CANCELLED
        trigger: "POST /shore-excursions/port-calls/{portCallId}/transitions action=CANCEL"
        actor: PortAgent
        preconditions: []
        side_effects:
          - "CASCADE-C hop 1: every ExcursionDeparture on this call with status IN {SCHEDULED, SELLING, CLOSED} is cancelled with cancellation_cause = WEATHER"
          - "CASCADE-C hop 2: each cancelled departure drives its Booking rows through the weather line-cancellation path (100% refund of charge_total_cents, no goodwill credit, seats returned to the booking's channel bucket)"
          - "increments PortCall.version by 1"

  # -------------------------------------------------------- ExcursionDeparture
  - entity: ExcursionDeparture
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED_WEATHER, CANCELLED_OPERATIONAL]
    shape: fork_join_branching
    transitions:
      - from: SCHEDULED
        to: SELLING
        trigger: "system: on POST /shore-excursions/departures when Excursion.catalog_status == PUBLISHED and PortCall.status == OPEN_FOR_SALE; OR on PortCall PLANNED -> OPEN_FOR_SALE; OR on Excursion PENDING_REVIEW -> PUBLISHED"
        actor: system
        preconditions:
          - "Excursion.catalog_status == PUBLISHED"
          - "PortCall.status == OPEN_FOR_SALE"
        side_effects:
          - "freeze departure.return_guarantee_eligible = (Excursion.return_guarantee AND departure.timing_risk_band_scheduled != RED)"
          - "increments ExcursionDeparture.version by 1"
      - from: SELLING
        to: CLOSED
        trigger: "system: PortCall IN_PORT -> CLOSED; OR system: departure.timing_risk_band_actual becomes RED after POST /shore-excursions/port-calls/{portCallId}/delays; OR system: logical_clock.now >= meeting_time_utc - SALES_CUTOFF_MINUTES (60), evaluated on every GET of this departure, on every write to the owning PortCall, and on every write to this departure — but NOT on POST /shore-excursions/bookings, which leaves the stored status untouched and reports the cutoff as ERR_SALES_CUTOFF_PASSED (validations priority 35)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE-B hop 3: every Booking on this departure whose fulfillment_status == BOOKED (never ticketed) transitions BOOKED -> CANCELLED_BY_LINE with financial AUTHORIZED -> VOIDED, RefundLedgerEntry entry_kind=AUTH_VOID amount_cents=0 basis=LINE_CANCELLED_OPERATIONAL, and its seats returned to the booking's channel bucket"
          - "increments ExcursionDeparture.version by 1"
        note: "Only never-charged (BOOKED/AUTHORIZED) bookings are voided on sales closure. TICKETED bookings survive to check-in. Because POST /shore-excursions/bookings is excluded from the clock-driven evaluation, a booking attempt inside the last 60 minutes fails with ERR_SALES_CUTOFF_PASSED rather than ERR_DEPARTURE_NOT_SELLING; the close then happens on the next GET or PortCall write."
      - from: SELLING
        to: CANCELLED_WEATHER
        trigger: "POST /shore-excursions/departures/{departureId}/cancel cause=WEATHER; OR system: PortCall -> CANCELLED"
        actor: ExcursionManager | system
        preconditions:
          - "departure.status IN {SCHEDULED, SELLING, CLOSED} (else ERR_INVALID_DEPARTURE_STATE)"
          - "if offer_alternative == true then the alternative candidate pool is non-empty (else ERR_NO_ALTERNATIVE_AVAILABLE)"
        side_effects:
          - "WEATHER branch (no operator fault): every Booking with fulfillment_status IN {BOOKED, TICKETED, CHECKED_IN} transitions to CANCELLED_BY_LINE"
          - "financial CHARGED or PARTIALLY_REFUNDED -> REFUNDED with RefundLedgerEntry entry_kind=REFUND basis=LINE_CANCELLED_WEATHER refund_pct_bps=10000 amount_cents = charge_total_cents - refunded_cents"
          - "a Booking already in fulfillment_status CANCELLED_BY_GUEST keeps that fulfillment_status, and when its financial_status is PARTIALLY_REFUNDED the retained remainder is refunded too (PARTIALLY_REFUNDED -> REFUNDED) with RefundLedgerEntry entry_kind=REFUND basis=LINE_CANCELLED_WEATHER refund_pct_bps=10000 amount_cents = charge_total_cents - refunded_cents; a booking already RETAINED, REFUNDED or VOIDED is left untouched"
          - "financial AUTHORIZED -> VOIDED with RefundLedgerEntry entry_kind=AUTH_VOID amount_cents=0 basis=LINE_CANCELLED_WEATHER"
          - "NO goodwill credit, NO operator reliability strike, NO operational penalty"
          - "if offer_alternative == true: each cancelled Booking gets alternative_departure_id = the winner of calculations.alternative_departure_selection and alternative_offer_status = OFFERED"
          - "seats returned to precruise_sold_seats / onboard_sold_seats per each booking's channel; seats_available_total recomputed"
          - "tender wave counters released: TenderWave.assigned_guest_count -= departure.total_capacity when tender_wave_id is set"
          - "every booking line's commission_accrued_cents set to 0; any DRAFT CommissionStatement in scope recomputed"
          - "increments ExcursionDeparture.version by 1"
      - from: SELLING
        to: CANCELLED_OPERATIONAL
        trigger: "POST /shore-excursions/departures/{departureId}/cancel cause=OPERATIONAL; OR system: owning Excursion PUBLISHED -> WITHDRAWN (CASCADE-A hop 3)"
        actor: ExcursionManager | system
        preconditions:
          - "departure.status IN {SCHEDULED, SELLING, CLOSED} (else ERR_INVALID_DEPARTURE_STATE)"
          - "if offer_alternative == true then the alternative candidate pool is non-empty (else ERR_NO_ALTERNATIVE_AVAILABLE)"
        side_effects:
          - "OPERATIONAL branch (operator fault): every Booking with fulfillment_status IN {BOOKED, TICKETED, CHECKED_IN} transitions to CANCELLED_BY_LINE"
          - "financial CHARGED or PARTIALLY_REFUNDED -> REFUNDED with RefundLedgerEntry entry_kind=REFUND basis=LINE_CANCELLED_OPERATIONAL refund_pct_bps=10000 amount_cents = charge_total_cents - refunded_cents"
          - "a Booking already in fulfillment_status CANCELLED_BY_GUEST keeps that fulfillment_status, and when its financial_status is PARTIALLY_REFUNDED the retained remainder is refunded too (PARTIALLY_REFUNDED -> REFUNDED) with RefundLedgerEntry entry_kind=REFUND basis=LINE_CANCELLED_OPERATIONAL; such a line receives NO goodwill credit, because the guest had already walked away before the operator failed"
          - "financial AUTHORIZED -> VOIDED with RefundLedgerEntry entry_kind=AUTH_VOID amount_cents=0 basis=LINE_CANCELLED_OPERATIONAL"
          - "PLUS goodwill: every booking that had reached financial CHARGED receives RefundLedgerEntry entry_kind=GOODWILL_CREDIT amount_cents = round_half_up(quoted_total_cents * GOODWILL_BPS(1000) / 10000) basis=LINE_CANCELLED_OPERATIONAL"
          - "TourOperator(excursion.operator_id).reliability_strikes += 1; when reliability_strikes >= RELIABILITY_STRIKE_SUSPEND_THRESHOLD (3) the operator transitions APPROVED -> SUSPENDED (which itself starts CASCADE-A hop 2)"
          - "operational penalty recorded for settlement: round_half_up(forgone gross_ticket_cents on this departure * OPERATIONAL_PENALTY_BPS(2000) / 10000) enters CommissionStatement.operational_penalty_cents in scope"
          - "if offer_alternative == true: each cancelled Booking gets alternative_departure_id and alternative_offer_status = OFFERED"
          - "seats returned per channel bucket; tender wave counters released; commission_accrued_cents zeroed"
          - "increments ExcursionDeparture.version by 1"
        note: "Fork-join: WEATHER and OPERATIONAL converge on 'all bookings terminal, seats and wave capacity released' but differ in goodwill credit, reliability strike, and settlement penalty."
      - from: SCHEDULED
        to: CANCELLED_OPERATIONAL
        trigger: "POST /shore-excursions/departures/{departureId}/cancel cause=OPERATIONAL; OR system: owning Excursion PUBLISHED -> WITHDRAWN"
        actor: ExcursionManager | system
        preconditions: []
        side_effects:
          - "no bookings exist to cascade (departure never sold); tender wave counters released; increments ExcursionDeparture.version by 1"
      - from: SCHEDULED
        to: CANCELLED_WEATHER
        trigger: "POST /shore-excursions/departures/{departureId}/cancel cause=WEATHER; OR system: PortCall -> CANCELLED"
        actor: ExcursionManager | system
        preconditions: []
        side_effects:
          - "tender wave counters released; increments ExcursionDeparture.version by 1"
      - from: CLOSED
        to: CANCELLED_WEATHER
        trigger: "POST /shore-excursions/departures/{departureId}/cancel cause=WEATHER"
        actor: ExcursionManager
        preconditions: []
        side_effects: ["same WEATHER branch side-effect set as SELLING -> CANCELLED_WEATHER"]
      - from: CLOSED
        to: CANCELLED_OPERATIONAL
        trigger: "POST /shore-excursions/departures/{departureId}/cancel cause=OPERATIONAL"
        actor: ExcursionManager
        preconditions: []
        side_effects: ["same OPERATIONAL branch side-effect set as SELLING -> CANCELLED_OPERATIONAL"]
      - from: CLOSED
        to: OPERATING
        trigger: "POST /shore-excursions/departures/{departureId}/operations action=DISPATCH"
        actor: PortAgent
        preconditions:
          - "PortCall.status == IN_PORT (else ERR_INVALID_DEPARTURE_STATE)"
          - "at least one Booking on this departure has fulfillment_status == CHECKED_IN (else ERR_INVALID_DEPARTURE_STATE)"
          - "if Port.docking_mode == TENDER then departure.tender_wave_id is not null (else ERR_NO_ELIGIBLE_TENDER_WAVE)"
          - "departure.timing_risk_band_actual != RED (else ERR_TIMING_RISK_RED)"
        side_effects:
          - "every Booking on this departure with fulfillment_status == TICKETED transitions TICKETED -> NO_SHOW (financial CHARGED -> RETAINED, RefundLedgerEntry entry_kind=RETENTION amount_cents=charge_total_cents refund_pct_bps=0 basis=NO_SHOW)"
          - "increments ExcursionDeparture.version by 1"
      - from: OPERATING
        to: COMPLETED
        trigger: "POST /shore-excursions/departures/{departureId}/operations action=COMPLETE with actual_return_utc"
        actor: PortAgent
        preconditions:
          - "actual_return_utc >= departure.meeting_time_utc (else ERR_INVALID_TIME_WINDOW)"
          - "actual_return_utc <= logical_clock.now (else ERR_INVALID_TIME_WINDOW)"
        side_effects:
          - "departure.actual_return_utc recorded"
          - "every Booking with fulfillment_status == CHECKED_IN transitions CHECKED_IN -> COMPLETED"
          - "return-guarantee evaluation: when actual_return_utc > PortCall.all_aboard_utc then every COMPLETED booking gets return_guarantee_honored = false; if departure.return_guarantee_eligible is true those bookings additionally receive RefundLedgerEntry entry_kind=REFUND refund_pct_bps=10000 amount_cents=quoted_total_cents basis=RETURN_GUARANTEE_BREACH (financial CHARGED -> REFUNDED) plus RefundLedgerEntry entry_kind=REPATRIATION_ALLOWANCE amount_cents=REPATRIATION_ALLOWANCE_CENTS(25000)"
          - "final commission accrual: each COMPLETED and NO_SHOW booking line's commission_accrued_cents recomputed on the FINAL variant of calculations.operator_commission_accrual"
          - "increments ExcursionDeparture.version by 1"

  # ------------------------------------------- Booking (dimension 1 of 2)
  - entity: Booking
    dimension: fulfillment_status
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED_BY_GUEST, CANCELLED_BY_LINE]
    shape: parallel_dimension_1
    transitions:
      - from: BOOKED
        to: TICKETED
        trigger: "POST /shore-excursions/bookings/{bookingId}/fulfillment-actions action=TICKET"
        actor: ShoreExcursionDesk
        preconditions:
          - "booking.financial_status == AUTHORIZED (else ERR_INVALID_BOOKING_ACTION)"
          - "ExcursionDeparture.status IN {SELLING, CLOSED} (else ERR_DEPARTURE_NOT_SELLING)"
          - "TourOperator of the departure's excursion has vetting_status == APPROVED (else ERR_OPERATOR_NOT_APPROVED)"
        side_effects:
          - "financial dimension AUTHORIZED -> CHARGED (charge_total_cents captured)"
          - "commission_accrued_cents = PROVISIONAL variant of calculations.operator_commission_accrual for this line"
          - "increments Booking.version by 1"
      - from: TICKETED
        to: CHECKED_IN
        trigger: "POST /shore-excursions/bookings/{bookingId}/fulfillment-actions action=CHECK_IN"
        actor: ShoreExcursionDesk
        preconditions:
          - "PortCall.status == IN_PORT (else ERR_INVALID_BOOKING_ACTION)"
          - "logical_clock.now IN [meeting_time_utc - CHECKIN_OPEN_MINUTES (45), meeting_time_utc + CHECKIN_GRACE_MINUTES (10)] (else ERR_CHECKIN_WINDOW_CLOSED)"
          - "ExcursionDeparture.status IN {SELLING, CLOSED} (else ERR_INVALID_DEPARTURE_STATE)"
        side_effects: ["increments Booking.version by 1"]
      - from: TICKETED
        to: NO_SHOW
        trigger: "POST /shore-excursions/bookings/{bookingId}/fulfillment-actions action=MARK_NO_SHOW; OR system: departure CLOSED -> OPERATING; OR system: PortCall IN_PORT -> CLOSED"
        actor: ShoreExcursionDesk | system
        preconditions: []
        side_effects:
          - "financial CHARGED -> RETAINED; retained_cents = charge_total_cents"
          - "RefundLedgerEntry entry_kind=RETENTION amount_cents=charge_total_cents refund_pct_bps=0 basis=NO_SHOW appended"
          - "commission_accrued_cents recomputed on the FINAL no-show floor (min(commission_rate_bps, NO_SHOW_COMMISSION_CAP_BPS 500))"
          - "seats are NOT returned: a no-show consumed its seat"
          - "increments Booking.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system: departure OPERATING -> COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "return_guarantee_honored evaluated; RETURN_GUARANTEE_BREACH ledger entries appended when applicable"
          - "increments Booking.version by 1"
      - from: BOOKED
        to: CANCELLED_BY_GUEST
        trigger: "POST /shore-excursions/bookings/{bookingId}/cancel"
        actor: Guest | ShoreExcursionDesk
        preconditions:
          - "ExcursionDeparture.status NOT IN {OPERATING, COMPLETED, CANCELLED_WEATHER, CANCELLED_OPERATIONAL} (else ERR_INVALID_DEPARTURE_STATE)"
        side_effects:
          - "financial AUTHORIZED -> VOIDED; RefundLedgerEntry entry_kind=AUTH_VOID amount_cents=0 refund_pct_bps=0 basis=GUEST_INITIATED"
          - "seats returned to the bucket named by booking.channel; departure.seats_available_total recomputed; increments ExcursionDeparture.version by 1"
          - "increments Booking.version by 1"
      - from: TICKETED
        to: CANCELLED_BY_GUEST
        trigger: "POST /shore-excursions/bookings/{bookingId}/cancel"
        actor: Guest | ShoreExcursionDesk
        preconditions:
          - "ExcursionDeparture.status NOT IN {OPERATING, COMPLETED, CANCELLED_WEATHER, CANCELLED_OPERATIONAL} (else ERR_INVALID_DEPARTURE_STATE)"
        side_effects:
          - "refund tier from calculations.guest_refund_settlement GUEST_INITIATED variant; financial CHARGED -> REFUNDED when the tier refunds 100% of charge_total_cents, -> PARTIALLY_REFUNDED when it refunds part, -> RETAINED when it refunds nothing"
          - "RefundLedgerEntry entry_kind=REFUND (or RETENTION at the 0% tier) appended with basis=GUEST_INITIATED"
          - "commission_accrued_cents recomputed on the surviving net basis (0 when fully refunded)"
          - "seats returned to the bucket named by booking.channel; increments ExcursionDeparture.version by 1"
          - "increments Booking.version by 1"
      - from: BOOKED
        to: CANCELLED_BY_LINE
        trigger: "system: departure cancelled (WEATHER or OPERATIONAL), OR departure SELLING -> CLOSED, OR PortCall -> CANCELLED, OR operator APPROVED -> SUSPENDED cascade"
        actor: system
        preconditions: []
        side_effects:
          - "financial AUTHORIZED -> VOIDED; AUTH_VOID ledger entry with the cascade's basis"
          - "seats returned to booking.channel bucket; increments ExcursionDeparture.version by 1"
          - "increments Booking.version by 1"
      - from: TICKETED
        to: CANCELLED_BY_LINE
        trigger: "system: departure cancelled (WEATHER or OPERATIONAL), OR PortCall -> CANCELLED, OR operator APPROVED -> SUSPENDED cascade"
        actor: system
        preconditions: []
        side_effects:
          - "financial CHARGED -> REFUNDED, 100% of charge_total_cents incl. service_fee_cents"
          - "OPERATIONAL cause only: additional GOODWILL_CREDIT ledger entry of round_half_up(quoted_total_cents * 1000 / 10000)"
          - "commission_accrued_cents -> 0; seats returned to booking.channel bucket"
          - "increments Booking.version by 1"
      - from: CHECKED_IN
        to: CANCELLED_BY_LINE
        trigger: "system: departure cancelled (WEATHER or OPERATIONAL) after check-in opened"
        actor: system
        preconditions: []
        side_effects:
          - "same money treatment as TICKETED -> CANCELLED_BY_LINE"
          - "increments Booking.version by 1"

  # ------------------------------------------- Booking (dimension 2 of 2)
  - entity: Booking
    dimension: financial_status
    initial_state: AUTHORIZED
    terminal_states: [REFUNDED, RETAINED, VOIDED]
    shape: parallel_dimension_2
    transitions:
      - from: AUTHORIZED
        to: CHARGED
        trigger: "system: fulfillment BOOKED -> TICKETED"
        actor: system
        preconditions: ["booking.charge_total_cents > 0"]
        side_effects:
          - "commission_accrued_cents set on the PROVISIONAL basis"
          - "increments Booking.version by 1"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "system: fulfillment BOOKED -> CANCELLED_BY_GUEST or BOOKED -> CANCELLED_BY_LINE"
        actor: system
        preconditions: []
        side_effects:
          - "RefundLedgerEntry entry_kind=AUTH_VOID amount_cents=0 appended; retained_cents stays 0"
          - "increments Booking.version by 1"
      - from: CHARGED
        to: PARTIALLY_REFUNDED
        trigger: "system: guest-initiated cancellation landing in the 7500 bps or 5000 bps refund tier"
        actor: system
        preconditions: []
        side_effects:
          - "refunded_cents = the tier amount; retained_cents = charge_total_cents - refunded_cents"
          - "commission_accrued_cents recomputed on quoted_total_cents - refunded_cents"
          - "increments Booking.version by 1"
      - from: CHARGED
        to: REFUNDED
        trigger: "system: line cancellation (WEATHER/OPERATIONAL), guest cancellation in the 10000 bps tier, or RETURN_GUARANTEE_BREACH on completion"
        actor: system
        preconditions: []
        side_effects:
          - "refunded_cents = charge_total_cents (line cancellation) or quoted_total_cents (return-guarantee breach); retained_cents = charge_total_cents - refunded_cents"
          - "commission_accrued_cents -> 0 for line cancellations; unchanged for return-guarantee breach (the tour was delivered)"
          - "increments Booking.version by 1"
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "system: the departure is later cancelled by the line, so the retained remainder is refunded too"
        actor: system
        preconditions: []
        side_effects:
          - "additional RefundLedgerEntry entry_kind=REFUND amount_cents = charge_total_cents - refunded_cents; refunded_cents becomes charge_total_cents; retained_cents becomes 0"
          - "increments Booking.version by 1"
        note: "Dimension independence: fulfillment_status is already CANCELLED_BY_GUEST at this point and does NOT change."
      - from: CHARGED
        to: RETAINED
        trigger: "system: fulfillment TICKETED -> NO_SHOW, or guest cancellation inside the 0 bps tier"
        actor: system
        preconditions: []
        side_effects:
          - "retained_cents = charge_total_cents; RETENTION ledger entry appended"
          - "increments Booking.version by 1"

  # ---------------------------------------------------------------- GuestIncident
  - entity: GuestIncident
    dimension: status
    initial_state: FILED
    terminal_states: [CLOSED_NO_CLAIM, CLOSED_UPHELD, CLOSED_DENIED]
    shape: branching
    transitions:
      - from: FILED
        to: CLAIM_OPENED
        trigger: "POST /shore-excursions/incidents/{incidentId}/claims"
        actor: RiskOfficer
        preconditions:
          - "no LiabilityClaim already exists with incident_id == incident.id (else ERR_INVALID_CLAIM_ACTION)"
        side_effects: ["increments GuestIncident.version by 1"]
      - from: FILED
        to: CLOSED_NO_CLAIM
        trigger: "POST /shore-excursions/incidents/{incidentId}/close"
        actor: RiskOfficer
        preconditions: []
        side_effects: ["increments GuestIncident.version by 1"]
      - from: CLAIM_OPENED
        to: CLOSED_UPHELD
        trigger: "system: the claim on this incident reaches ADJUDICATED_UPHELD"
        actor: system
        preconditions: []
        side_effects: ["increments GuestIncident.version by 1"]
      - from: CLAIM_OPENED
        to: CLOSED_DENIED
        trigger: "system: the claim on this incident reaches ADJUDICATED_DENIED"
        actor: system
        preconditions: []
        side_effects: ["increments GuestIncident.version by 1"]

  # --------------------------------------------------------------- LiabilityClaim
  - entity: LiabilityClaim
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [ADJUDICATED_DENIED, SETTLED]
    shape: cyclic
    transitions:
      - from: SUBMITTED
        to: UNDER_OPERATOR_REVIEW
        trigger: "POST /shore-excursions/claims/{claimId}/actions action=SEND_TO_OPERATOR"
        actor: RiskOfficer
        preconditions:
          - "TourOperator(claim.operator_id).vetting_status != TERMINATED (else ERR_INVALID_CLAIM_ACTION)"
        side_effects: ["increments LiabilityClaim.version by 1"]
      - from: UNDER_OPERATOR_REVIEW
        to: DISPUTED
        trigger: "POST /shore-excursions/claims/{claimId}/actions action=RECORD_DISPUTE"
        actor: RiskOfficer
        preconditions:
          - "claim.dispute_round_count < MAX_DISPUTE_ROUNDS (2) (else ERR_DISPUTE_ROUNDS_EXHAUSTED)"
        side_effects:
          - "claim.dispute_round_count += 1"
          - "increments LiabilityClaim.version by 1"
      - from: DISPUTED
        to: UNDER_OPERATOR_REVIEW
        trigger: "POST /shore-excursions/claims/{claimId}/actions action=SEND_TO_OPERATOR"
        actor: RiskOfficer
        preconditions:
          - "claim.dispute_round_count <= MAX_DISPUTE_ROUNDS (2) (else ERR_DISPUTE_ROUNDS_EXHAUSTED)"
        side_effects: ["increments LiabilityClaim.version by 1"]
        note: "Cycle edge — UNDER_OPERATOR_REVIEW -> DISPUTED -> UNDER_OPERATOR_REVIEW, at most 2 dispute rounds."
      - from: UNDER_OPERATOR_REVIEW
        to: ADJUDICATED_UPHELD
        trigger: "POST /shore-excursions/claims/{claimId}/actions action=ADJUDICATE_UPHELD with liability_share_bps and settlement_amount_cents"
        actor: RiskOfficer
        preconditions:
          - "X-User-ID != claim.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "1 <= liability_share_bps <= 10000 (else ERR_VALIDATION)"
          - "settlement_amount_cents <= claim.claimed_amount_cents (else ERR_VALIDATION)"
          - "round_half_up(settlement_amount_cents * liability_share_bps / 10000) <= TourOperator.insurance_liability_limit_cents (else ERR_CLAIM_EXCEEDS_INSURANCE_LIMIT)"
        side_effects:
          - "claim.operator_charge_cents = round_half_up(settlement_amount_cents * liability_share_bps / 10000)"
          - "TourOperator.liability_reserve_cents += claim.operator_charge_cents"
          - "TourOperator.safety_score recomputed (claim penalty of 5 points per upheld claim); if the new score < 60 the operator transitions APPROVED -> SUSPENDED, which starts CASCADE-A hop 2"
          - "GuestIncident CLAIM_OPENED -> CLOSED_UPHELD"
          - "increments LiabilityClaim.version by 1"
      - from: DISPUTED
        to: ADJUDICATED_UPHELD
        trigger: "POST /shore-excursions/claims/{claimId}/actions action=ADJUDICATE_UPHELD"
        actor: RiskOfficer
        preconditions:
          - "X-User-ID != claim.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "same numeric preconditions as UNDER_OPERATOR_REVIEW -> ADJUDICATED_UPHELD"
        side_effects: ["same side-effect set as UNDER_OPERATOR_REVIEW -> ADJUDICATED_UPHELD"]
      - from: UNDER_OPERATOR_REVIEW
        to: ADJUDICATED_DENIED
        trigger: "POST /shore-excursions/claims/{claimId}/actions action=ADJUDICATE_DENIED"
        actor: RiskOfficer
        preconditions:
          - "X-User-ID != claim.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "GuestIncident CLAIM_OPENED -> CLOSED_DENIED"
          - "increments LiabilityClaim.version by 1"
      - from: DISPUTED
        to: ADJUDICATED_DENIED
        trigger: "POST /shore-excursions/claims/{claimId}/actions action=ADJUDICATE_DENIED"
        actor: RiskOfficer
        preconditions:
          - "X-User-ID != claim.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "GuestIncident CLAIM_OPENED -> CLOSED_DENIED"
          - "increments LiabilityClaim.version by 1"
      - from: ADJUDICATED_UPHELD
        to: SETTLED
        trigger: "system: a CommissionStatement with basis == FINAL, operator_id == claim.operator_id and port_call_id == claim.port_call_id reaches SETTLED"
        actor: system
        preconditions: []
        side_effects:
          - "TourOperator.liability_reserve_cents -= claim.operator_charge_cents"
          - "increments LiabilityClaim.version by 1"

  # ----------------------------------------------------------- CommissionStatement
  - entity: CommissionStatement
    dimension: status
    initial_state: DRAFT
    terminal_states: [SETTLED, VOIDED]
    shape: branching_with_revert
    transitions:
      - from: DRAFT
        to: VOIDED
        trigger: "system: a newer CommissionStatement is created for the same (operator_id, port_call_id) pair"
        actor: system
        preconditions: []
        side_effects: ["increments CommissionStatement.version by 1"]
        note: "Supersede semantics — this is what makes POST /commission-statements a true OCC race on TourOperator.version."
      - from: DRAFT
        to: ISSUED
        trigger: "POST /shore-excursions/commission-statements/{statementId}/transitions action=ISSUE"
        actor: FinanceController
        preconditions:
          - "if statement.basis == FINAL then PortCall.status == CLOSED (else ERR_PORT_CALL_NOT_CLOSED)"
          - "no LiabilityClaim with operator_id == statement.operator_id and port_call_id == statement.port_call_id and status IN {SUBMITTED, UNDER_OPERATOR_REVIEW, DISPUTED} (else ERR_OPEN_CLAIM_BLOCKS_ISSUE)"
        side_effects:
          - "all nine calculation steps of calculations.statement_net_payable re-run and frozen onto the statement"
          - "statement.issued_at = logical_clock.now"
          - "increments CommissionStatement.version by 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /shore-excursions/commission-statements/{statementId}/transitions action=DISPUTE"
        actor: FinanceController
        preconditions: []
        side_effects: ["increments CommissionStatement.version by 1"]
      - from: DISPUTED
        to: ADJUSTED
        trigger: "POST /shore-excursions/commission-statements/{statementId}/transitions action=ADJUST with adjustment_cents"
        actor: FinanceController
        preconditions:
          - "statement.payable_pre_rebate_cents + statement.rebate_cents + adjustment_cents >= 0 (else ERR_VALIDATION)"
        side_effects:
          - "statement.adjustment_cents = adjustment_cents; operator_payable_cents recomputed as payable_pre_rebate_cents + rebate_cents + adjustment_cents (rebate_bps is NOT re-selected)"
          - "increments CommissionStatement.version by 1"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /shore-excursions/commission-statements/{statementId}/transitions action=SETTLE"
        actor: FinanceController
        preconditions:
          - "statement.basis == FINAL (else ERR_INVALID_STATEMENT_ACTION)"
        side_effects:
          - "statement.settled_at = logical_clock.now"
          - "every LiabilityClaim with the same (operator_id, port_call_id) and status == ADJUDICATED_UPHELD transitions to SETTLED, which in turn debits TourOperator.liability_reserve_cents by that claim's operator_charge_cents"
          - "increments CommissionStatement.version by 1"
      - from: ADJUSTED
        to: SETTLED
        trigger: "POST /shore-excursions/commission-statements/{statementId}/transitions action=SETTLE"
        actor: FinanceController
        preconditions:
          - "statement.basis == FINAL (else ERR_INVALID_STATEMENT_ACTION)"
        side_effects: ["same side-effect set as ISSUED -> SETTLED"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-departure
    parent_entity: ExcursionDeparture
    write_endpoint: "POST /shore-excursions/bookings"
    occ_field: "expected_departure_version"
    description: |
      Creating a Booking against an ExcursionDeparture whose version has advanced
      since the client last read it is rejected. This captures the case where the
      client's view of the channel allocation buckets predates another writer's
      booking, cancellation, or allocation rebalance on the same departure, any of
      which legitimately changes the seats the new booking would consume.
    error_id: ERR_STALE_DEPARTURE_VERSION
    http_status: 412
  - rule_id: allocation-rebalance-stale-departure
    parent_entity: ExcursionDeparture
    write_endpoint: "POST /shore-excursions/departures/{departureId}/allocation"
    occ_field: "expected_departure_version"
    description: |
      Rebalancing the PRE_CRUISE/ONBOARD split on a departure whose version has
      advanced since the client last read it is rejected. A rebalance legitimately
      supersedes the prior split, so a stale-version check is the only way to tell
      the operator that seats were sold out of the bucket they were about to shrink.
    error_id: ERR_STALE_DEPARTURE_VERSION
    http_status: 412
  - rule_id: statement-create-stale-operator
    parent_entity: TourOperator
    write_endpoint: "POST /shore-excursions/commission-statements"
    occ_field: "expected_operator_version"
    description: |
      Creating a CommissionStatement voids any existing DRAFT statement for the same
      (operator_id, port_call_id) pair, so a create against a TourOperator whose
      version has advanced since the client last read it is rejected: the commission
      rate, safety score, or reliability strikes the statement would be built on are
      no longer the ones the client observed.
    error_id: ERR_STALE_OPERATOR_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ------------------------------------------------------------------ 1 of 10
  - name: booking_price_quote
    description: |
      Per-guest price for a booking, built from four independent axes that are
      combined in a pinned order: price tier multiplier, sales-channel adjustment,
      a blended loyalty/group discount, and a capped non-commissionable service fee.
      The combination is not a single product: the loyalty and group discounts are
      blended by a max-plus-half-of-min rule and capped, and the pre-cruise
      adjustment applies only when the booking is made at least a week ahead.
    trigger: "POST /shore-excursions/bookings (quote frozen onto the booking row at creation; never re-quoted afterwards)"
    inputs:
      - "Excursion.base_price_cents"
      - "Excursion.price_tier"
      - "Booking.channel"
      - "Booking.party_size"
      - "Guest.loyalty_tier"
      - "days_to_meeting = floor(minutes(ExcursionDeparture.meeting_time_utc - logical_clock.now) / 1440)"
    algorithm: tiered_pricing
    formula: |
      # ---- step 1: tier multiplier -------------------------------------------
      tier_mult_bps = { VALUE: 9000, STANDARD: 10000, PREMIUM: 11500, SIGNATURE: 13000 }[excursion.price_tier]
      list_price_cents = round_half_up(excursion.base_price_cents * tier_mult_bps / 10000)

      # ---- step 2: channel adjustment ----------------------------------------
      # PRE_CRUISE earns its 5% early-purchase reduction ONLY at 7+ whole days out.
      if booking.channel == PRE_CRUISE:
          channel_adj_bps = -500 if days_to_meeting >= 7 else 0
      else:  # ONBOARD
          channel_adj_bps = +800
      channel_price_cents = round_half_up(list_price_cents * (10000 + channel_adj_bps) / 10000)

      # ---- step 3: blended discount ------------------------------------------
      loyalty_bps = { NONE: 0, SILVER: 250, GOLD: 500, PLATINUM: 800 }[guest.loyalty_tier]
      if booking.party_size >= 6:   group_bps = 1000
      elif booking.party_size >= 4: group_bps = 500
      else:                         group_bps = 0
      combined_discount_bps = min(
          DISCOUNT_CAP_BPS,
          max(loyalty_bps, group_bps) + floor(min(loyalty_bps, group_bps) / 2)
      )

      # ---- step 4: per-guest price, THEN multiply by party size ---------------
      # Rounding happens once, on the per-guest price. The party total is an exact
      # integer multiple of that rounded per-guest figure; it is NOT recomputed
      # from base_price_cents * party_size.
      per_guest_price_cents = round_half_up(channel_price_cents * (10000 - combined_discount_bps) / 10000)
      quoted_total_cents    = per_guest_price_cents * booking.party_size

      # ---- step 5: capped service fee ----------------------------------------
      service_fee_cents  = min(SERVICE_FEE_CAP_CENTS, round_half_up(quoted_total_cents * SERVICE_FEE_BPS / 10000))
      charge_total_cents = quoted_total_cents + service_fee_cents
    constants:
      TIER_MULT_BPS_VALUE: 9000
      TIER_MULT_BPS_STANDARD: 10000
      TIER_MULT_BPS_PREMIUM: 11500
      TIER_MULT_BPS_SIGNATURE: 13000
      PRECRUISE_ADJ_BPS: -500
      PRECRUISE_ADJ_MIN_DAYS: 7
      ONBOARD_ADJ_BPS: 800
      LOYALTY_BPS_NONE: 0
      LOYALTY_BPS_SILVER: 250
      LOYALTY_BPS_GOLD: 500
      LOYALTY_BPS_PLATINUM: 800
      GROUP_BPS_LARGE: 1000
      GROUP_BPS_LARGE_MIN_PARTY: 6
      GROUP_BPS_SMALL: 500
      GROUP_BPS_SMALL_MIN_PARTY: 4
      DISCOUNT_CAP_BPS: 1200
      SERVICE_FEE_BPS: 300
      SERVICE_FEE_CAP_CENTS: 1500
    precision: "integer cents, round_half_up, applied exactly at steps 1, 2, 4 and 5"
    worked_examples:
      - label: "PREMIUM / PRE_CRUISE 45 days / GOLD / party 4"
        given: "base_price_cents=12000, price_tier=PREMIUM, channel=PRE_CRUISE, days_to_meeting=45, loyalty_tier=GOLD, party_size=4"
        steps: "list=round_half_up(12000*11500/10000)=13800; channel=round_half_up(13800*9500/10000)=13110; combined=min(1200, max(500,500)+floor(500/2))=750; per_guest=round_half_up(13110*9250/10000)=12127; total=12127*4=48508; fee=min(1500, round_half_up(48508*300/10000))=1455; charge=49963"
        expect: { per_guest_price_cents: 12127, quoted_total_cents: 48508, service_fee_cents: 1455, charge_total_cents: 49963 }
      - label: "same excursion sold ONBOARD to the same guest and party"
        given: "base_price_cents=12000, price_tier=PREMIUM, channel=ONBOARD, days_to_meeting=1, loyalty_tier=GOLD, party_size=4"
        steps: "list=13800; channel=round_half_up(13800*10800/10000)=14904; combined=750; per_guest=round_half_up(14904*9250/10000)=13786; total=55144; fee=min(1500, 1654)=1500 (CAP BINDS); charge=56644"
        expect: { per_guest_price_cents: 13786, quoted_total_cents: 55144, service_fee_cents: 1500, charge_total_cents: 56644 }
      - label: "discount cap binds: PLATINUM + party 6"
        given: "base_price_cents=20000, price_tier=SIGNATURE, channel=ONBOARD, days_to_meeting=0, loyalty_tier=PLATINUM, party_size=6"
        steps: "list=26000; channel=28080; uncapped=max(800,1000)+floor(800/2)=1400 -> capped to 1200; per_guest=round_half_up(28080*8800/10000)=24710; total=148260; fee=min(1500, 4448)=1500; charge=149760"
        expect: { combined_discount_bps: 1200, per_guest_price_cents: 24710, quoted_total_cents: 148260, service_fee_cents: 1500, charge_total_cents: 149760 }
      - label: "PRE_CRUISE adjustment withheld at 3 days out (below the 7-day floor)"
        given: "base_price_cents=8000, price_tier=VALUE, channel=PRE_CRUISE, days_to_meeting=3, loyalty_tier=NONE, party_size=2"
        steps: "list=7200; channel_adj_bps=0 so channel=7200; combined=0; per_guest=7200; total=14400; fee=432; charge=14832"
        expect: { per_guest_price_cents: 7200, quoted_total_cents: 14400, service_fee_cents: 432, charge_total_cents: 14832 }
      - label: "service-fee half-up boundary (exact .5)"
        given: "base_price_cents=15000, price_tier=STANDARD, channel=PRE_CRUISE, days_to_meeting=10, loyalty_tier=NONE, party_size=1"
        steps: "list=15000; channel=14250; combined=0; per_guest=14250; total=14250; fee=round_half_up(14250*300/10000)=round_half_up(427.5)=428 (NOT 427); charge=14678"
        expect: { service_fee_cents: 428, charge_total_cents: 14678 }

  # ------------------------------------------------------------------ 2 of 10
  - name: departure_timing_risk
    description: |
      Projects when an excursion group gets back to the ship and bands the risk of
      missing the all-aboard deadline. Two variants project from different clocks:
      SCHEDULED_BASIS uses the published meeting time and governs whether the
      line's return guarantee attaches; ACTUAL_BASIS folds in the port call's
      accumulated arrival delay and the fixed tender schedule and governs whether
      the departure may keep selling and may be dispatched. The all-aboard deadline
      NEVER moves, so a delay burns slack rather than shifting the deadline.
    trigger: "recomputed on POST /shore-excursions/departures, POST /shore-excursions/departures/{departureId}/tender-assignment, POST /shore-excursions/port-calls/{portCallId}/delays, and on every GET of the departure"
    inputs:
      - "ExcursionDeparture.meeting_time_utc"
      - "Excursion.duration_minutes"
      - "PortCall.all_aboard_utc"
      - "PortCall.delay_minutes"
      - "Port.docking_mode"
      - "Port.tender_egress_minutes"
      - "Port.risk_buffer_minutes"
      - "TenderWave.window_end_utc of the assigned wave (null when unassigned)"
    algorithm: forward_looking
    formula: |
      # ---- egress leg --------------------------------------------------------
      if port.docking_mode == ALONGSIDE:
          egress_minutes = 0
      else:  # TENDER
          egress_minutes = port.tender_egress_minutes
          if departure.tender_wave_id is null:
              egress_minutes = egress_minutes + UNASSIGNED_WAVE_PENALTY_MINUTES

      ashore_minutes = excursion.duration_minutes + 2 * TRANSFER_BUFFER_MINUTES + egress_minutes

      # ---- variant SCHEDULED_BASIS ------------------------------------------
      # The ticketed meeting time, ignoring both the delay and the tender schedule.
      start_scheduled_utc            = departure.meeting_time_utc
      projected_return_scheduled_utc = start_scheduled_utc + ashore_minutes minutes
      slack_minutes_scheduled        = minutes(port_call.all_aboard_utc - projected_return_scheduled_utc)
                                       - port.risk_buffer_minutes

      # ---- variant ACTUAL_BASIS ---------------------------------------------
      # The ticketed meeting time does NOT move when the ship arrives late (tickets
      # are not reissued), but the group cannot start before its tender wave has
      # landed, and the tender schedule DOES slip with the ship.
      if departure.tender_wave_id is not null:
          start_actual_utc = max(departure.meeting_time_utc,
                                 wave.window_end_utc + port_call.delay_minutes minutes)
      else:
          start_actual_utc = departure.meeting_time_utc + port_call.delay_minutes minutes
      projected_return_actual_utc = start_actual_utc + ashore_minutes minutes
      slack_minutes_actual        = minutes(port_call.all_aboard_utc - projected_return_actual_utc)
                                    - port.risk_buffer_minutes

      # ---- banding (shared by both variants) ---------------------------------
      def band(slack):
          if slack <= RED_SLACK_CEILING_MINUTES:   return RED      # slack of exactly 0 is RED
          if slack <= AMBER_SLACK_CEILING_MINUTES: return AMBER    # slack of exactly 45 is AMBER
          return GREEN
      timing_risk_band_scheduled = band(slack_minutes_scheduled)
      timing_risk_band_actual    = band(slack_minutes_actual)
    constants:
      TRANSFER_BUFFER_MINUTES: 15
      UNASSIGNED_WAVE_PENALTY_MINUTES: 20
      RED_SLACK_CEILING_MINUTES: 0
      AMBER_SLACK_CEILING_MINUTES: 45
    precision: "whole minutes; no rounding (all inputs are integer minutes)"
    variants:
      - name: SCHEDULED_BASIS
        when: "evaluated at the SCHEDULED -> SELLING transition to freeze ExcursionDeparture.return_guarantee_eligible, and exposed as projected_return_scheduled_utc / slack_minutes_scheduled / timing_risk_band_scheduled"
        difference: "starts from the ticketed meeting_time_utc; ignores PortCall.delay_minutes entirely and ignores the assigned tender wave's landing window"
      - name: ACTUAL_BASIS
        when: "evaluated to gate SELLING -> CLOSED (band becomes RED) and CLOSED -> OPERATING (dispatch refused while RED); exposed as projected_return_actual_utc / slack_minutes_actual / timing_risk_band_actual"
        difference: "floors the start at the assigned tender wave's window_end_utc shifted by PortCall.delay_minutes (or, with no wave assigned, at meeting_time_utc shifted by the delay); the all_aboard_utc deadline is NOT shifted, so every delay minute is a slack minute lost"
    worked_examples:
      - label: "divergence: same departure, GREEN on the scheduled basis and RED on the actual basis"
        given: "port.docking_mode=TENDER, port.tender_egress_minutes=25, port.risk_buffer_minutes=30, excursion.duration_minutes=300, meeting_time_utc=2026-09-15T09:00:00Z, all_aboard_utc=2026-09-15T16:30:00Z, assigned wave window_end_utc=2026-09-15T08:50:00Z, port_call.delay_minutes=75"
        steps: "ashore=300+30+25=355; SCHEDULED start=09:00 -> return=14:55 -> slack=95-30=65 -> GREEN; ACTUAL start=max(09:00, 08:50+75m=10:05)=10:05 -> return=16:00 -> slack=30-30=0 -> RED"
        expect:
          projected_return_scheduled_utc: "2026-09-15T14:55:00Z"
          slack_minutes_scheduled: 65
          timing_risk_band_scheduled: GREEN
          projected_return_actual_utc: "2026-09-15T16:00:00Z"
          slack_minutes_actual: 0
          timing_risk_band_actual: RED
      - label: "RED boundary is one minute wide: delay 74 stays AMBER"
        given: "identical to the previous example except port_call.delay_minutes=74"
        steps: "ACTUAL start=max(09:00, 08:50+74m=10:04)=10:04 -> return=15:59 -> slack=31-30=1 -> AMBER (slack must be <= 0 to be RED)"
        expect: { slack_minutes_actual: 1, timing_risk_band_actual: AMBER }
      - label: "unassigned-wave penalty alone flips GREEN to AMBER at the 45-minute edge"
        given: "same port and excursion, port_call.delay_minutes=0, tender_wave_id=null"
        steps: "ashore=300+30+(25+20)=375; SCHEDULED start=09:00 -> return=15:15 -> slack=75-30=45 -> AMBER (45 is inclusive); with a wave assigned the same departure projects 14:55 -> slack 65 -> GREEN"
        expect: { slack_minutes_scheduled: 45, timing_risk_band_scheduled: AMBER }
      - label: "ALONGSIDE port charges no egress leg"
        given: "port.docking_mode=ALONGSIDE, port.tender_egress_minutes=25 (ignored), port.risk_buffer_minutes=30, duration_minutes=300, meeting 09:00Z, all_aboard 16:30Z, delay 0"
        steps: "ashore=300+30+0=330; return=14:30; slack=120-30=90 -> GREEN"
        expect: { slack_minutes_scheduled: 90, timing_risk_band_scheduled: GREEN }

  # ------------------------------------------------------------------ 3 of 10
  - name: operator_commission_accrual
    description: |
      The commission the cruise line retains from an operator's ticket revenue.
      The PROVISIONAL variant accrues on money taken (charged bookings), the FINAL
      variant accrues on tours actually delivered (completed and no-show bookings)
      and net of refunds, with no-show lines capped at a reduced rate because the
      line performed no service. Rounding is pinned per booking line and then
      summed; the sum-then-round shortcut is explicitly wrong and produces a
      different figure on the fixtures below.
    trigger: "per booking line on Booking BOOKED -> TICKETED (PROVISIONAL), on any refund or retention event, and on ExcursionDeparture OPERATING -> COMPLETED (FINAL); aggregated when a CommissionStatement is created or issued"
    inputs:
      - "Booking.quoted_total_cents"
      - "Booking.refunded_cents"
      - "Booking.fulfillment_status"
      - "Booking.financial_status"
      - "TourOperator.commission_rate_bps"
    algorithm: aggregation
    formula: |
      # ---- variant PROVISIONAL ----------------------------------------------
      lines_provisional = [ b for b in bookings_in_scope
                            if b.financial_status IN (CHARGED, PARTIALLY_REFUNDED) ]
      def provisional_line(b):
          return round_half_up(b.quoted_total_cents * operator.commission_rate_bps / 10000)

      # ---- variant FINAL -----------------------------------------------------
      lines_final = [ b for b in bookings_in_scope
                      if b.fulfillment_status IN (COMPLETED, NO_SHOW) ]
      def final_line(b):
          net_basis_cents = max(0, b.quoted_total_cents - b.refunded_cents)
          if b.fulfillment_status == NO_SHOW:
              effective_rate_bps = min(operator.commission_rate_bps, NO_SHOW_COMMISSION_CAP_BPS)
          else:
              effective_rate_bps = operator.commission_rate_bps
          return round_half_up(net_basis_cents * effective_rate_bps / 10000)

      # ---- pinned rounding order (BOTH variants) -----------------------------
      # Round each booking line to whole cents FIRST, then add the rounded lines.
      # Do NOT sum the raw bases and round once at the end.
      line_commission_cents = sum( round_half_up(<line basis> * <line rate> / 10000)
                                   for each line in scope )
    constants:
      NO_SHOW_COMMISSION_CAP_BPS: 500
    precision: "integer cents, round_half_up per booking line, then exact integer summation"
    variants:
      - name: PROVISIONAL
        when: "CommissionStatement.basis == PROVISIONAL; also the value written to Booking.commission_accrued_cents at ticketing"
        difference: "input set is bookings with financial_status IN {CHARGED, PARTIALLY_REFUNDED}; basis is the full quoted_total_cents with no refund deduction; the operator's headline commission_rate_bps applies to every line"
      - name: FINAL
        when: "CommissionStatement.basis == FINAL; also the value rewritten to Booking.commission_accrued_cents on departure completion or no-show"
        difference: "input set is bookings with fulfillment_status IN {COMPLETED, NO_SHOW}; basis is quoted_total_cents minus refunded_cents floored at 0; NO_SHOW lines are rated at min(commission_rate_bps, 500)"
    worked_examples:
      - label: "per-line rounding diverges from sum-then-round by 1 cent"
        given: "operator.commission_rate_bps=1800; three CHARGED bookings each with quoted_total_cents=48508"
        steps: "per line round_half_up(48508*1800/10000)=round_half_up(8731.44)=8731; 8731*3=26193. The forbidden shortcut round_half_up(145524*1800/10000)=round_half_up(26194.32)=26194."
        expect: { line_commission_cents: 26193, forbidden_sum_then_round_value: 26194 }
      - label: "FINAL variant on the same three lines after one completes, one no-shows and one is 75% refunded"
        given: "operator.commission_rate_bps=1800; line A fulfillment COMPLETED refunded_cents=0 quoted 48508; line B fulfillment NO_SHOW refunded_cents=0 quoted 48508; line C fulfillment CANCELLED_BY_GUEST refunded_cents=36381 quoted 48508"
        steps: "line A: rate 1800 on 48508 -> 8731. line B: NO_SHOW rate min(1800,500)=500 on 48508 -> round_half_up(2425.4)=2425. line C excluded (fulfillment_status not in {COMPLETED, NO_SHOW}). FINAL total 8731+2425=11156, against a PROVISIONAL total of 26193 on the same data."
        expect: { line_commission_cents: 11156, line_count: 2 }
      - label: "refund reduces the FINAL basis of a delivered tour"
        given: "operator.commission_rate_bps=1800; one COMPLETED booking with quoted_total_cents=48508 and refunded_cents=48508 (return-guarantee breach)"
        steps: "net_basis=max(0, 48508-48508)=0; round_half_up(0)=0"
        expect: { line_commission_cents: 0 }

  # ------------------------------------------------------------------ 4 of 10
  - name: statement_net_payable
    description: |
      Builds an operator's payable for one port call in nine steps whose order is
      pinned. The port infrastructure fee is charged on gross ticket value BEFORE
      commission is deducted, and the volume rebate rate is selected exactly once
      from the pre-rebate payable, so the rebate never re-enters its own tier test.
      A manual ADJUST on a disputed statement moves the payable without re-selecting
      the rebate tier.
    trigger: "POST /shore-excursions/commission-statements (DRAFT figures), CommissionStatement DRAFT -> ISSUED (frozen figures), and CommissionStatement DISPUTED -> ADJUSTED (step 9 only)"
    inputs:
      - "the Booking set in scope: bookings whose ExcursionDeparture.port_call_id == statement.port_call_id and whose Excursion.operator_id == statement.operator_id"
      - "calculations.operator_commission_accrual for the statement's basis"
      - "LiabilityClaim.operator_charge_cents for claims with the same (operator_id, port_call_id) and status IN {ADJUDICATED_UPHELD, SETTLED}"
      - "OPERATIONAL cancellation penalties recorded on the port call's departures for this operator"
    algorithm: waterfall_allocation
    formula: |
      # ---- step 1: gross commissionable ticket value -------------------------
      # Input set matches the statement's basis, exactly as in operator_commission_accrual.
      if statement.basis == PROVISIONAL:
          lines = [ b in scope where b.financial_status IN (CHARGED, PARTIALLY_REFUNDED) ]
          gross_ticket_cents = sum(b.quoted_total_cents for b in lines)
      else:  # FINAL
          lines = [ b in scope where b.fulfillment_status IN (COMPLETED, NO_SHOW) ]
          gross_ticket_cents = sum(max(0, b.quoted_total_cents - b.refunded_cents) for b in lines)
      booking_line_count = count(lines)
      refunds_cents      = sum(RefundLedgerEntry.amount_cents for entries of lines with entry_kind == REFUND)

      # ---- step 2: port fee, on GROSS, before commission ---------------------
      port_fee_cents = round_half_up(gross_ticket_cents * PORT_FEE_BPS / 10000)

      # ---- step 3: line commission (per-line rounded, then summed) -----------
      line_commission_cents = calculations.operator_commission_accrual(basis = statement.basis)

      # ---- step 4: upheld liability ------------------------------------------
      claim_offset_cents = sum(c.operator_charge_cents for c in upheld_or_settled_claims_in_scope)

      # ---- step 5: operational cancellation penalty --------------------------
      # 20% of the gross ticket value forgone on each departure this operator had
      # cancelled for OPERATIONAL cause on this port call.
      operational_penalty_cents = sum(
          round_half_up(forgone_gross_ticket_cents(d) * OPERATIONAL_PENALTY_BPS / 10000)
          for d in departures_in_scope where d.status == CANCELLED_OPERATIONAL
      )

      # ---- step 6: pre-rebate payable, floored at zero -----------------------
      payable_pre_rebate_cents = max(0,
            gross_ticket_cents
          - port_fee_cents
          - line_commission_cents
          - claim_offset_cents
          - operational_penalty_cents )

      # ---- step 7: rebate tier, selected ONCE from the pre-rebate payable ----
      if payable_pre_rebate_cents >= REBATE_TIER2_FLOOR_CENTS:   rebate_bps = REBATE_TIER2_BPS
      elif payable_pre_rebate_cents >= REBATE_TIER1_FLOOR_CENTS: rebate_bps = REBATE_TIER1_BPS
      else:                                                      rebate_bps = 0

      # ---- step 8: rebate amount (a deduction the operator grants the line) --
      rebate_cents = -round_half_up(payable_pre_rebate_cents * rebate_bps / 10000)

      # ---- step 9: final payable ---------------------------------------------
      operator_payable_cents = payable_pre_rebate_cents + rebate_cents + statement.adjustment_cents
    constants:
      PORT_FEE_BPS: 250
      OPERATIONAL_PENALTY_BPS: 2000
      REBATE_TIER1_FLOOR_CENTS: 200000
      REBATE_TIER1_BPS: 75
      REBATE_TIER2_FLOOR_CENTS: 500000
      REBATE_TIER2_BPS: 150
    precision: "integer cents, round_half_up at steps 2, 5 and 8; steps 1, 3, 4, 6 and 9 are exact integer arithmetic"
    worked_examples:
      - label: "rebate tier boundary: pre-rebate payable of exactly 200000 earns the tier"
        given: "basis=FINAL; six COMPLETED bookings each quoted_total_cents=50000 with refunded_cents=0; operator.commission_rate_bps=1800; one upheld claim with operator_charge_cents=38500; no OPERATIONAL cancellations; adjustment_cents=0"
        steps: "gross=300000; port_fee=round_half_up(300000*250/10000)=7500; commission per line=round_half_up(50000*1800/10000)=9000, x6=54000; claim_offset=38500; penalty=0; pre_rebate=300000-7500-54000-38500-0=200000; rebate_bps=75 (200000 >= 200000); rebate=-round_half_up(200000*75/10000)=-1500; payable=200000-1500+0=198500"
        expect:
          gross_ticket_cents: 300000
          port_fee_cents: 7500
          line_commission_cents: 54000
          claim_offset_cents: 38500
          payable_pre_rebate_cents: 200000
          rebate_bps: 75
          rebate_cents: -1500
          operator_payable_cents: 198500
          booking_line_count: 6
      - label: "one cent below the tier: a LARGER claim offset yields a LARGER payable"
        given: "identical to the previous example except the upheld claim's operator_charge_cents=38501"
        steps: "pre_rebate=199999; rebate_bps=0 (199999 < 200000); rebate=0; payable=199999 -- which exceeds the 198500 payable of the richer pre-rebate case"
        expect: { payable_pre_rebate_cents: 199999, rebate_bps: 0, rebate_cents: 0, operator_payable_cents: 199999 }
      - label: "port fee is charged on gross, not on gross-minus-commission"
        given: "same six bookings, no claim, no penalty"
        steps: "correct: port_fee=round_half_up(300000*250/10000)=7500 and pre_rebate=300000-7500-54000=238500. The forbidden ordering (fee on the post-commission net of 246000) yields port_fee=6150 and pre_rebate=239850."
        expect: { port_fee_cents: 7500, payable_pre_rebate_cents: 238500, forbidden_fee_on_net_value: 6150 }
      - label: "payable floors at zero and the rebate tier is then 0"
        given: "basis=FINAL; one COMPLETED booking quoted_total_cents=50000 refunded 0; operator.commission_rate_bps=1800; upheld claim operator_charge_cents=900000"
        steps: "gross=50000; port_fee=1250; commission=9000; claim_offset=900000; pre_rebate=max(0, 50000-1250-9000-900000)=0; rebate_bps=0; rebate=0; payable=0"
        expect: { payable_pre_rebate_cents: 0, rebate_bps: 0, operator_payable_cents: 0 }
      - label: "ADJUST moves step 9 only and never re-selects the rebate tier"
        given: "the 198500 statement above is DISPUTED and then ADJUSTED with adjustment_cents=-100000"
        steps: "payable_pre_rebate_cents stays 200000, rebate_bps stays 75, rebate_cents stays -1500; payable=200000-1500-100000=98500. Re-selecting the tier from 98500 would have zeroed the rebate and produced 100000."
        expect: { rebate_bps: 75, rebate_cents: -1500, operator_payable_cents: 98500 }

  # ------------------------------------------------------------------ 5 of 10
  - name: guest_refund_settlement
    description: |
      Decides what money moves when a booking ends early. The cause of the ending
      selects the variant; only the guest-initiated variant is time-tiered, and
      only that variant can retain money. The non-commissionable service fee is
      refunded in full when the line is at fault or the guest cancels at the top
      tier, and is retained in every partial tier.
    trigger: "POST /shore-excursions/bookings/{bookingId}/cancel, every departure cancellation cascade, TICKETED -> NO_SHOW, and the return-guarantee evaluation on departure completion"
    inputs:
      - "Booking.quoted_total_cents"
      - "Booking.service_fee_cents"
      - "Booking.charge_total_cents"
      - "Booking.refunded_cents"
      - "minutes_to_meeting = minutes(ExcursionDeparture.meeting_time_utc - logical_clock.now)"
      - "cause: GUEST_INITIATED | LINE_CANCELLED_WEATHER | LINE_CANCELLED_OPERATIONAL | NO_SHOW | RETURN_GUARANTEE_BREACH"
    algorithm: threshold
    formula: |
      if cause == GUEST_INITIATED:
          if   minutes_to_meeting >= GUEST_TIER_FULL_MINUTES:    refund_pct_bps = 10000
          elif minutes_to_meeting >= GUEST_TIER_THREE_QUARTER_MINUTES: refund_pct_bps = 7500
          elif minutes_to_meeting >= GUEST_TIER_HALF_MINUTES:    refund_pct_bps = 5000
          else:                                                  refund_pct_bps = 0
          if refund_pct_bps == 10000:
              # top tier only: the service fee comes back too
              refund_cents = booking.charge_total_cents
          else:
              refund_cents = round_half_up(booking.quoted_total_cents * refund_pct_bps / 10000)
          entry_kind = REFUND if refund_cents > 0 else RETENTION
          entry_amount_cents = refund_cents if refund_cents > 0 else booking.charge_total_cents
          goodwill_cents = 0

      elif cause == LINE_CANCELLED_WEATHER:
          refund_pct_bps     = 10000
          refund_cents       = booking.charge_total_cents - booking.refunded_cents
          entry_kind         = REFUND
          goodwill_cents     = 0

      elif cause == LINE_CANCELLED_OPERATIONAL:
          refund_pct_bps     = 10000
          refund_cents       = booking.charge_total_cents - booking.refunded_cents
          entry_kind         = REFUND
          # operator fault adds a goodwill credit on the ticket value only
          goodwill_cents     = round_half_up(booking.quoted_total_cents * GOODWILL_BPS / 10000)

      elif cause == NO_SHOW:
          refund_pct_bps     = 0
          refund_cents       = 0
          entry_kind         = RETENTION
          entry_amount_cents = booking.charge_total_cents
          goodwill_cents     = 0

      else:  # RETURN_GUARANTEE_BREACH
          refund_pct_bps     = 10000
          refund_cents       = booking.quoted_total_cents      # the fee is NOT refunded
          entry_kind         = REFUND
          goodwill_cents     = REPATRIATION_ALLOWANCE_CENTS    # flat, party-size independent

      # ---- resulting financial_status ---------------------------------------
      new_refunded_cents = booking.refunded_cents + refund_cents
      if   new_refunded_cents == 0:                            financial_status = RETAINED
      elif new_refunded_cents >= booking.charge_total_cents:    financial_status = REFUNDED
      else:                                                    financial_status = PARTIALLY_REFUNDED
      retained_cents = booking.charge_total_cents - new_refunded_cents
    constants:
      GUEST_TIER_FULL_MINUTES: 4320
      GUEST_TIER_THREE_QUARTER_MINUTES: 1440
      GUEST_TIER_HALF_MINUTES: 180
      GOODWILL_BPS: 1000
      REPATRIATION_ALLOWANCE_CENTS: 25000
    precision: "integer cents, round_half_up on the tiered and goodwill amounts"
    variants:
      - name: GUEST_INITIATED
        when: "the guest or the desk cancels a booking whose departure is still live"
        difference: "the only time-tiered variant and the only variant that can retain money; the service fee is refunded at the 10000 bps tier and retained at every lower tier; no goodwill credit"
      - name: LINE_CANCELLED_WEATHER
        when: "the departure or the whole port call is cancelled for weather"
        difference: "always refunds the entire remaining charge including the service fee; no goodwill credit, no operator penalty, no reliability strike"
      - name: LINE_CANCELLED_OPERATIONAL
        when: "the departure is cancelled for operator fault, including the operator-suspension cascade"
        difference: "same full refund as the weather variant PLUS a goodwill credit of 10% of quoted_total_cents; also drives the operator's reliability strike and the settlement penalty"
      - name: NO_SHOW
        when: "a ticketed guest never checks in"
        difference: "refunds nothing and books the whole charge as a RETENTION entry; the seat is not returned to any allocation bucket"
      - name: RETURN_GUARANTEE_BREACH
        when: "a return-guarantee-eligible departure completes after the all-aboard deadline"
        difference: "refunds the ticket value but NOT the service fee (the tour was delivered), and adds a flat repatriation allowance of 25000 cents per booking regardless of party size"
    worked_examples:
      - label: "guest tier boundary at exactly 4320 minutes: full refund including the fee"
        given: "quoted_total_cents=48508, service_fee_cents=1455, charge_total_cents=49963, refunded_cents=0, minutes_to_meeting=4320, cause=GUEST_INITIATED"
        steps: "4320 >= 4320 so refund_pct_bps=10000 and refund_cents=charge_total_cents=49963; retained=0"
        expect: { refund_pct_bps: 10000, refund_cents: 49963, retained_cents: 0, financial_status: REFUNDED }
      - label: "one minute later drops to 7500 bps and the fee is retained"
        given: "same booking, minutes_to_meeting=4319, cause=GUEST_INITIATED"
        steps: "refund_pct_bps=7500; refund_cents=round_half_up(48508*7500/10000)=36381; retained=49963-36381=13582"
        expect: { refund_pct_bps: 7500, refund_cents: 36381, retained_cents: 13582, financial_status: PARTIALLY_REFUNDED }
      - label: "180-minute floor still refunds half; 179 refunds nothing"
        given: "same booking; two evaluations at minutes_to_meeting=180 and minutes_to_meeting=179"
        steps: "at 180: refund_pct_bps=5000 and refund_cents=round_half_up(48508*5000/10000)=24254, retained=25709, PARTIALLY_REFUNDED. at 179: refund_pct_bps=0, refund_cents=0, a RETENTION entry of 49963 is written, retained=49963, RETAINED"
        expect: { at_180: { refund_cents: 24254, retained_cents: 25709 }, at_179: { refund_cents: 0, retained_cents: 49963 } }
      - label: "tiered refund half-up rounding on an odd ticket value"
        given: "quoted_total_cents=14250, service_fee_cents=428, charge_total_cents=14678, minutes_to_meeting=2000, cause=GUEST_INITIATED"
        steps: "refund_pct_bps=7500; round_half_up(14250*7500/10000)=round_half_up(10687.5)=10688 (NOT 10687); retained=14678-10688=3990"
        expect: { refund_cents: 10688, retained_cents: 3990 }
      - label: "weather versus operational on the same booking"
        given: "quoted_total_cents=48508, charge_total_cents=49963, refunded_cents=0"
        steps: "WEATHER: refund 49963, goodwill 0, total cash out 49963. OPERATIONAL: refund 49963 plus goodwill round_half_up(48508*1000/10000)=4851, total cash out 54814."
        expect: { weather_cash_out_cents: 49963, operational_refund_cents: 49963, operational_goodwill_cents: 4851, operational_cash_out_cents: 54814 }
      - label: "return-guarantee breach withholds the fee and adds a flat allowance"
        given: "quoted_total_cents=48508, service_fee_cents=1455, charge_total_cents=49963, party_size=4, cause=RETURN_GUARANTEE_BREACH"
        steps: "refund_cents=48508 (fee retained); goodwill_cents=25000 flat, not 4 x 25000; retained=49963-48508=1455; new_refunded < charge_total so financial_status=PARTIALLY_REFUNDED"
        expect: { refund_cents: 48508, goodwill_credit_cents: 25000, retained_cents: 1455, financial_status: PARTIALLY_REFUNDED }
      - label: "partial refund followed by a line cancellation tops the refund up to the whole charge"
        given: "the 4319-minute booking above (refunded_cents=36381, retained 13582) whose departure is then cancelled for WEATHER"
        steps: "refund_cents=49963-36381=13582; new_refunded=49963 == charge_total so financial_status=REFUNDED and retained=0"
        expect: { refund_cents: 13582, retained_cents: 0, financial_status: REFUNDED }

  # ------------------------------------------------------------------ 6 of 12
  - name: operator_safety_score
    description: |
      A 0-100 standing score for a tour operator, built as a weighted average of
      that operator's three most recent safety audits and then penalised for
      critical findings and for liability claims that went against the operator.
      When fewer than three audits exist the weights are renormalised so they still
      sum to 1; rounding happens exactly once, after every penalty has been applied.
      The score gates vetting approval and drives automatic suspension.
    trigger: "POST /shore-excursions/operators/{operatorId}/safety-audits, every vetting action, and LiabilityClaim adjudication to ADJUDICATED_UPHELD"
    inputs:
      - "the SafetyAudit rows for the operator, ordered conducted_on DESC then created_at DESC, truncated to the first SCORED_AUDIT_WINDOW rows"
      - "SafetyAudit.raw_score and SafetyAudit.critical_finding_count of those rows"
      - "count of LiabilityClaim rows for the operator with status IN {ADJUDICATED_UPHELD, SETTLED}"
    algorithm: weighted_scoring
    formula: |
      audits = operator's SafetyAudit rows sorted by (conducted_on DESC, created_at DESC)
      window = audits[0 : SCORED_AUDIT_WINDOW]          # at most 3 rows
      if window is empty:
          safety_score = 0
          return

      base_weights = [0.5, 0.3, 0.2][0 : len(window)]
      weight_sum   = sum(base_weights)                  # 1.0, 0.8 or 0.5
      weights      = [ w / weight_sum for w in base_weights ]   # renormalised

      weighted_raw = sum( weights[i] * window[i].raw_score for i in range(len(window)) )

      critical_findings = sum( a.critical_finding_count for a in window )
      adverse_claims    = count(claims with status IN (ADJUDICATED_UPHELD, SETTLED))

      # exact arithmetic up to here; ONE rounding at the end, then clamp
      raw_score = weighted_raw
                  - CRITICAL_FINDING_PENALTY * critical_findings
                  - ADVERSE_CLAIM_PENALTY   * adverse_claims
      safety_score = min(100, max(0, round_half_up(raw_score)))
    constants:
      SCORED_AUDIT_WINDOW: 3
      AUDIT_WEIGHT_1: 0.5
      AUDIT_WEIGHT_2: 0.3
      AUDIT_WEIGHT_3: 0.2
      CRITICAL_FINDING_PENALTY: 8
      ADVERSE_CLAIM_PENALTY: 5
      SUSPENSION_SCORE_FLOOR: 60
    precision: "exact rational arithmetic through the weighted average and both penalties, then a single round_half_up to a whole score, then clamped to [0, 100]"
    worked_examples:
      - label: "three audits, one critical finding, one adverse claim"
        given: "audits newest-first raw_score 82, 74, 61 with critical_finding_count 1, 0, 0; one ADJUDICATED_UPHELD claim"
        steps: "weighted=0.5*82+0.3*74+0.2*61=41+22.2+12.2=75.4; minus 8*1=67.4; minus 5*1=62.4; round_half_up(62.4)=62"
        expect: { safety_score: 62 }
      - label: "suspension floor is exactly 60 and is reached only by rounding up"
        given: "audits newest-first raw_score 70, 66, 64, critical_finding_count 1, 0, 0; no adverse claims"
        steps: "weighted=35+19.8+12.8=67.6; minus 8=59.6; round_half_up(59.6)=60; 60 >= 60 so the operator is NOT suspended"
        expect: { safety_score: 60, suspends: false }
      - label: "one point on the lowest-weighted audit crosses the floor"
        given: "identical to the previous example except the third audit's raw_score is 63"
        steps: "weighted=35+19.8+12.6=67.4; minus 8=59.4; round_half_up(59.4)=59; 59 < 60 so the operator transitions APPROVED -> SUSPENDED and CASCADE-A fires"
        expect: { safety_score: 59, suspends: true }
      - label: "two audits renormalise their weights"
        given: "audits newest-first raw_score 82, 74; no critical findings, no adverse claims"
        steps: "base weights [0.5, 0.3] sum 0.8; renormalised [0.625, 0.375]; weighted=51.25+27.75=79.0; score 79. Failing to renormalise would give 0.5*82+0.3*74=63."
        expect: { safety_score: 79, forbidden_unnormalised_value: 63 }
      - label: "window truncation ignores a fourth, older audit and honours the tie-break"
        given: "four audits: A conducted_on 2026-07-20 raw_score 90, B conducted_on 2026-07-10 raw_score 80, C conducted_on 2026-07-10 raw_score 40 created_at later than B, D conducted_on 2026-06-01 raw_score 10"
        steps: "sorted by (conducted_on DESC, created_at DESC) gives A, C, B, D; window is A, C, B; weighted=0.5*90+0.3*40+0.2*80=45+12+16=73; D is outside the window and does not drag the score down"
        expect: { safety_score: 73 }
      - label: "penalties clamp at zero rather than going negative"
        given: "one audit raw_score 30 with critical_finding_count 5; two adverse claims"
        steps: "weighted=30 (single audit, weight renormalised to 1.0); minus 8*5=40 -> -10; minus 5*2=10 -> -20; round -20; clamped to 0"
        expect: { safety_score: 0 }

  # ------------------------------------------------------------------ 7 of 12
  - name: channel_allocation_availability
    description: |
      Splits a departure's seats between the pre-cruise and onboard sales channels
      and decides how many seats each channel may still sell. Pre-cruise selling
      closes a fixed number of minutes before the meeting time, at which point every
      unsold pre-cruise seat is released to the onboard channel. Seats freed by a
      cancellation return to the channel that sold them, except after the release,
      when a freed pre-cruise seat also moves to the onboard bucket so that the
      per-channel and total seat counts stay reconciled.
    trigger: "POST /shore-excursions/bookings, POST /shore-excursions/departures/{departureId}/allocation, every booking cancellation, and every GET of the departure"
    inputs:
      - "ExcursionDeparture.total_capacity"
      - "ExcursionDeparture.precruise_allocation"
      - "ExcursionDeparture.onboard_allocation"
      - "ExcursionDeparture.precruise_sold_seats"
      - "ExcursionDeparture.onboard_sold_seats"
      - "minutes_to_meeting = minutes(ExcursionDeparture.meeting_time_utc - logical_clock.now)"
    algorithm: waterfall_allocation
    formula: |
      precruise_released = (minutes_to_meeting <= PRECRUISE_RELEASE_MINUTES)

      if precruise_released:
          # every unsold pre-cruise seat flows to the onboard bucket, once
          effective_precruise_allocation = precruise_sold_seats
          effective_onboard_allocation   = total_capacity - precruise_sold_seats
      else:
          effective_precruise_allocation = precruise_allocation
          effective_onboard_allocation   = onboard_allocation

      effective_precruise_available = max(0, effective_precruise_allocation - precruise_sold_seats)
      effective_onboard_available   = max(0, effective_onboard_allocation   - onboard_sold_seats)
      seats_available_total         = total_capacity - precruise_sold_seats - onboard_sold_seats

      # ---- admission test for a new booking ----------------------------------
      # A booking of party_size p in channel c is admitted only when
      #   p <= effective_available(c)
      # otherwise ERR_CHANNEL_ALLOCATION_EXHAUSTED. Note that seats_available_total
      # may be positive while the requested channel is exhausted.

      # ---- seat return on cancellation ---------------------------------------
      # sold(c) always decreases by the cancelled booking's party_size. When the
      # pre-cruise release has already happened and c == PRE_CRUISE, the freed seat
      # also moves bucket: precruise_allocation -= p and onboard_allocation += p,
      # so effective_precruise_available stays 0 and the buckets still sum to
      # total_capacity. A NO_SHOW returns nothing: the seat was consumed.
    constants:
      PRECRUISE_RELEASE_MINUTES: 2880
    precision: "whole seats; every quantity is a non-negative integer"
    invariants:
      - "precruise_allocation + onboard_allocation == total_capacity at all times"
      - "precruise_sold_seats + onboard_sold_seats + seats_available_total == total_capacity at all times"
      - "precruise_sold_seats <= effective_precruise_allocation and onboard_sold_seats <= effective_onboard_allocation"
    worked_examples:
      - label: "channel exhaustion with seats still free on the departure"
        given: "total_capacity=40, precruise_allocation=25, onboard_allocation=15, precruise_sold_seats=25, onboard_sold_seats=4, minutes_to_meeting=10000"
        steps: "not released; precruise_available=0; onboard_available=11; seats_available_total=40-25-4=11. A PRE_CRUISE booking of party_size 1 is refused with ERR_CHANNEL_ALLOCATION_EXHAUSTED even though 11 seats are free."
        expect: { effective_precruise_available: 0, effective_onboard_available: 11, seats_available_total: 11 }
      - label: "release boundary at exactly 2880 minutes"
        given: "total_capacity=40, precruise_allocation=25, onboard_allocation=15, precruise_sold_seats=18, onboard_sold_seats=4; evaluated at minutes_to_meeting=2881 and again at 2880"
        steps: "at 2881: not released, precruise_available=7, onboard_available=11. at 2880: released, effective_precruise_allocation=18 so precruise_available=0, effective_onboard_allocation=40-18=22 so onboard_available=18. The 7 unsold pre-cruise seats have joined the onboard pool."
        expect:
          at_2881: { effective_precruise_available: 7, effective_onboard_available: 11 }
          at_2880: { effective_precruise_available: 0, effective_onboard_available: 18 }
      - label: "party of exactly the available size is admitted; one more is not"
        given: "total_capacity=40, precruise_allocation=25, onboard_allocation=15, precruise_sold_seats=20, onboard_sold_seats=0, minutes_to_meeting=10000"
        steps: "precruise_available=5; a PRE_CRUISE booking with party_size=5 is admitted and leaves precruise_available=0; a party_size=6 request is refused with ERR_CHANNEL_ALLOCATION_EXHAUSTED"
        expect: { admits_party_size_5: true, admits_party_size_6: false }
      - label: "cancellation after the release moves the freed seat to the onboard bucket"
        given: "total_capacity=40, precruise_allocation=18, onboard_allocation=22, precruise_sold_seats=18, onboard_sold_seats=6, released (minutes_to_meeting=100); a PRE_CRUISE booking of party_size=3 is cancelled"
        steps: "precruise_sold_seats 18 -> 15; precruise_allocation 18 -> 15; onboard_allocation 22 -> 25; precruise_available=0; onboard_available=25-6=19; seats_available_total=40-15-6=19; buckets still sum to 40"
        expect: { precruise_allocation: 15, onboard_allocation: 25, effective_precruise_available: 0, effective_onboard_available: 19, seats_available_total: 19 }
      - label: "cancellation before the release returns the seat to its own bucket"
        given: "total_capacity=40, precruise_allocation=25, onboard_allocation=15, precruise_sold_seats=18, onboard_sold_seats=6, not released; a PRE_CRUISE booking of party_size=3 is cancelled"
        steps: "precruise_sold_seats 18 -> 15; allocations untouched; precruise_available=10; onboard_available=9; seats_available_total=19"
        expect: { precruise_allocation: 25, onboard_allocation: 15, effective_precruise_available: 10, effective_onboard_available: 9, seats_available_total: 19 }
      - label: "a no-show does not return its seat"
        given: "total_capacity=40, precruise_sold_seats=18, onboard_sold_seats=6, seats_available_total=16; a PRE_CRUISE booking of party_size=2 is marked NO_SHOW"
        steps: "sold counts and seats_available_total are unchanged: NO_SHOW is not in the cancelled set"
        expect: { precruise_sold_seats: 18, seats_available_total: 16 }

  # ------------------------------------------------------------------ 8 of 12
  - name: tender_wave_selection
    description: |
      Picks the tender wave that will land an excursion group ashore. Only
      excursion-priority waves on the same port call that finish landing no later
      than the group's meeting time and still have room for the whole departure are
      eligible; among those the wave that finishes latest wins, because it keeps the
      group waiting on the pier for the shortest time. Ties are broken by the
      operator-assigned wave ordinal and then by creation order.
    trigger: "POST /shore-excursions/departures/{departureId}/tender-assignment"
    inputs:
      - "the TenderWave rows with port_call_id == departure.port_call_id"
      - "TenderWave.priority_class, window_end_utc, guest_capacity, assigned_guest_count, wave_index, created_at"
      - "ExcursionDeparture.meeting_time_utc and total_capacity"
    algorithm: constraint_propagation
    formula: |
      # ---- eligibility (all four clauses must hold) --------------------------
      pool = [ w for w in TenderWave
               if  w.port_call_id   == departure.port_call_id
               and w.priority_class == EXCURSION_PRIORITY
               and w.window_end_utc <= departure.meeting_time_utc          # inclusive
               and w.assigned_guest_count + departure.total_capacity <= w.guest_capacity ]

      # ---- ranking ------------------------------------------------------------
      if pool is empty:
          raise ERR_NO_ELIGIBLE_TENDER_WAVE                                 # 422
      winner = sort(pool, by = [ window_end_utc DESC, wave_index ASC, created_at ASC ])[0]

      departure.tender_wave_id           = winner.id
      winner.assigned_guest_count       += departure.total_capacity
      winner.assigned_departure_count   += 1
    constants: {}
    precision: "exact; no arithmetic beyond integer seat counts and instant comparison"
    selector_policy:
      eligibility: "same port call, priority_class == EXCURSION_PRIORITY, window_end_utc <= meeting_time_utc (a wave ending exactly at the meeting time IS eligible), and remaining guest capacity covering the departure's whole total_capacity"
      ranking: "window_end_utc DESC — the latest-landing eligible wave wins"
      tie_break: "wave_index ASC, then created_at ASC; TenderWave.id is never consulted"
      empty_pool: "ERR_NO_ELIGIBLE_TENDER_WAVE (422); the departure keeps tender_wave_id == null and therefore carries the 20-minute unassigned-wave penalty in calculations.departure_timing_risk"
    worked_examples:
      - label: "latest eligible wave wins, and a wave ending exactly at the meeting time is eligible"
        given: "meeting_time_utc=2026-09-15T09:00:00Z, departure.total_capacity=30; waves W1 window_end 08:30Z capacity 100 assigned 0 wave_index 1, W2 window_end 09:00Z capacity 100 assigned 0 wave_index 2, W3 window_end 09:10Z capacity 100 assigned 0 wave_index 3"
        steps: "W3 is excluded (09:10 > 09:00); pool is {W1, W2}; W2 has the later window_end so W2 wins"
        expect: { winner: W2 }
      - label: "capacity filter drops the latest wave and the earlier one wins"
        given: "meeting_time_utc=09:00Z, departure.total_capacity=30; W1 window_end 08:30Z capacity 100 assigned 10, W2 window_end 09:00Z capacity 40 assigned 15"
        steps: "W2 fails 15+30=45 <= 40; W1 passes 10+30=40 <= 100; pool is {W1}; W1 wins"
        expect: { winner: W1 }
      - label: "capacity filter is inclusive at the exact fit"
        given: "meeting_time_utc=09:00Z, departure.total_capacity=25; W2 window_end 09:00Z capacity 40 assigned 15"
        steps: "15+25=40 <= 40 holds, so W2 is eligible and wins; a departure of total_capacity 26 would have found the pool empty"
        expect: { winner: W2, would_admit_capacity_26: false }
      - label: "tie on window_end_utc is broken by the lower wave_index, not by created_at"
        given: "meeting_time_utc=09:00Z, total_capacity=10; WA window_end 08:45Z wave_index 7 created_at 2026-08-01T00:00:00Z, WB window_end 08:45Z wave_index 3 created_at 2026-08-02T00:00:00Z"
        steps: "both eligible and both end at 08:45; wave_index 3 < 7 so WB wins even though WA was created first"
        expect: { winner: WB }
      - label: "GENERAL waves are never eligible"
        given: "meeting_time_utc=09:00Z, total_capacity=10; only wave WG window_end 08:55Z priority_class=GENERAL capacity 200 assigned 0"
        steps: "pool is empty"
        expect: { error_id: ERR_NO_ELIGIBLE_TENDER_WAVE }

  # ------------------------------------------------------------------ 9 of 12
  - name: alternative_departure_selection
    description: |
      Chooses the replacement departure offered to a guest whose booking the line
      cancelled. A fallback nominated on the cancelled excursion wins outright when
      it is still sellable; otherwise the closest-priced sellable departure on the
      same port call wins, with the earliest meeting time and then creation order
      breaking ties. Every candidate must still be able to seat the whole party and
      must still be far enough ahead for the group to be re-briefed.
    trigger: "any ExcursionDeparture cancellation carrying offer_alternative == true"
    inputs:
      - "the cancelled Booking's party_size, guest mobility_level and medical_flags"
      - "the cancelled ExcursionDeparture's port_call_id and its Excursion.base_price_cents and alternative_excursion_id"
      - "the candidate ExcursionDeparture rows on the same port call with their Excursion rows"
    algorithm: constraint_propagation
    formula: |
      def sellable(d):
          return (    d.id != cancelled.id
                  and d.port_call_id == cancelled.port_call_id
                  and d.status == SELLING
                  and Excursion(d.excursion_id).catalog_status == PUBLISHED
                  and d.seats_available_total >= booking.party_size
                  and minutes(d.meeting_time_utc - logical_clock.now) >= MEETING_SETUP_MINUTES
                  and guest_eligibility_screen(booking.guest_id, d) passes every hard gate )

      # ---- nominated fallback first -----------------------------------------
      nominated = [ d for d in candidates
                    if sellable(d)
                    and d.excursion_id == Excursion(cancelled.excursion_id).alternative_excursion_id ]
      if nominated is non-empty:
          winner = sort(nominated, by = [ meeting_time_utc ASC, created_at ASC ])[0]
      else:
          pool = [ d for d in candidates if sellable(d) ]
          if pool is empty:
              raise ERR_NO_ALTERNATIVE_AVAILABLE                              # 422
          winner = sort(pool, by = [
              abs(Excursion(d.excursion_id).base_price_cents
                  - Excursion(cancelled.excursion_id).base_price_cents) ASC,
              meeting_time_utc ASC,
              created_at ASC ])[0]

      booking.alternative_departure_id = winner.id
      booking.alternative_offer_status = OFFERED
      # the offer reserves nothing; it flips to EXPIRED when the port call closes
    constants:
      MEETING_SETUP_MINUTES: 15
    precision: "exact integer cents for the price distance; no rounding"
    selector_policy:
      eligibility: "different departure on the same port call, status == SELLING, excursion PUBLISHED, seats_available_total >= party_size, meeting_time_utc at least 15 minutes ahead of the logical clock, and the guest passes the age, mobility, medical and language gates of the candidate excursion"
      ranking: "the excursion nominated by the cancelled excursion's alternative_excursion_id wins outright; otherwise the smallest absolute base_price_cents distance wins"
      tie_break: "meeting_time_utc ASC, then created_at ASC; ExcursionDeparture.id is never consulted"
      empty_pool: "ERR_NO_ALTERNATIVE_AVAILABLE (422); the cancellation is rejected as a whole so the caller can retry with offer_alternative == false"
    worked_examples:
      - label: "nominated fallback beats a closer-priced candidate"
        given: "cancelled excursion base_price_cents=12000 with alternative_excursion_id=EX_NOM; candidate DN on EX_NOM base_price_cents=20000 meeting 14:00Z; candidate DC on another excursion base_price_cents=12100 meeting 11:00Z; both sellable"
        steps: "DN is nominated so the price distance ranking never runs; DN wins despite an 8000-cent distance against DC's 100"
        expect: { winner: DN }
      - label: "closest price wins when no fallback is nominated"
        given: "cancelled excursion base_price_cents=12000 with alternative_excursion_id=null; candidates D1 base 9000, D2 base 12100, D3 base 15000, all sellable"
        steps: "distances 3000, 100, 3000; D2 wins"
        expect: { winner: D2 }
      - label: "equal price distance is broken by the earlier meeting time"
        given: "cancelled excursion base_price_cents=12000, no nomination; candidate DA base 11000 meeting 13:00Z, candidate DB base 13000 meeting 10:30Z"
        steps: "both distances are 1000; DB's meeting_time_utc is earlier so DB wins"
        expect: { winner: DB }
      - label: "party size and setup window both filter the pool empty"
        given: "booking.party_size=6; the only other SELLING departure has seats_available_total=4; a second departure has seats but its meeting_time_utc is 10 minutes ahead of the clock"
        steps: "the first fails the seat clause, the second fails the 15-minute setup clause; pool is empty"
        expect: { error_id: ERR_NO_ALTERNATIVE_AVAILABLE }

  # ----------------------------------------------------------------- 10 of 12
  - name: guest_eligibility_screen
    description: |
      Gates a booking on the lead guest's age, declared mobility, declared medical
      conditions and language. Age is whole calendar years attained by the meeting
      date, so a guest whose birthday falls exactly on the meeting date has already
      attained the higher age. Mobility is a rank comparison, and the most demanding
      grade adds a hard medical exclusion that no acknowledgement can waive.
    trigger: "POST /shore-excursions/bookings, and re-evaluated for every candidate in calculations.alternative_departure_selection"
    inputs:
      - "Guest.birth_date, Guest.mobility_level, Guest.medical_flags"
      - "Booking.language_choice, Booking.medical_warning_acknowledged"
      - "Excursion.min_age, Excursion.max_age, Excursion.mobility_level, Excursion.medical_warning_codes, Excursion.languages"
      - "ExcursionDeparture.meeting_time_utc"
    algorithm: threshold
    formula: |
      # ---- age: whole years attained by the meeting DATE ---------------------
      meeting_date = date part of departure.meeting_time_utc (UTC)
      birth_date   = date part of guest.birth_date (UTC)
      age_at_meeting = meeting_date.year - birth_date.year
      if (meeting_date.month, meeting_date.day) < (birth_date.month, birth_date.day):
          age_at_meeting -= 1        # birthday not yet reached; a birthday ON the
                                     # meeting date counts as attained
      if age_at_meeting < excursion.min_age:                       raise ERR_AGE_RESTRICTION       # 422
      if excursion.max_age is not null and age_at_meeting > excursion.max_age:
                                                                   raise ERR_AGE_RESTRICTION       # 422

      # ---- mobility: rank comparison plus a LEVEL_4 medical exclusion --------
      guest_rank    = { WHEELCHAIR: 1, ASSISTED: 2, FULL: 3 }[guest.mobility_level]
      required_rank = { LEVEL_1: 1, LEVEL_2: 2, LEVEL_3: 3, LEVEL_4: 3 }[excursion.mobility_level]
      if guest_rank < required_rank:                               raise ERR_MOBILITY_RESTRICTION  # 422
      if excursion.mobility_level == LEVEL_4 and
         guest.medical_flags intersects LEVEL4_EXCLUDED_FLAGS:     raise ERR_MOBILITY_RESTRICTION  # 422
         # this exclusion is absolute: medical_warning_acknowledged cannot waive it

      # ---- medical warnings: acknowledgement required only on intersection ---
      overlap = guest.medical_flags INTERSECT excursion.medical_warning_codes
      if overlap is non-empty and booking.medical_warning_acknowledged is not true:
                                                                   raise ERR_MEDICAL_ACK_REQUIRED  # 422
         # when overlap is empty the acknowledgement flag is simply ignored

      # ---- language ----------------------------------------------------------
      if booking.language_choice NOT IN excursion.languages:        raise ERR_LANGUAGE_UNAVAILABLE  # 422
         # Guest.language_pref is advisory only and is never validated
    constants:
      MOBILITY_RANK_WHEELCHAIR: 1
      MOBILITY_RANK_ASSISTED: 2
      MOBILITY_RANK_FULL: 3
      REQUIRED_RANK_LEVEL_1: 1
      REQUIRED_RANK_LEVEL_2: 2
      REQUIRED_RANK_LEVEL_3: 3
      REQUIRED_RANK_LEVEL_4: 3
      LEVEL4_EXCLUDED_FLAGS: [CARDIAC, RESPIRATORY, PREGNANCY]
    precision: "whole years; date comparison in UTC with no time-of-day component"
    worked_examples:
      - label: "birthday exactly on the meeting date attains the age"
        given: "guest.birth_date=2008-09-15T00:00:00Z, meeting_time_utc=2026-09-15T09:00:00Z, excursion.min_age=18"
        steps: "18 - 0 adjustment because (09, 15) is not < (09, 15); age_at_meeting=18; 18 >= 18 passes"
        expect: { age_at_meeting: 18, passes: true }
      - label: "one day short of the birthday fails the same gate"
        given: "guest.birth_date=2008-09-16T00:00:00Z, meeting_time_utc=2026-09-15T09:00:00Z, excursion.min_age=18"
        steps: "(09, 15) < (09, 16) so age_at_meeting=17; 17 < 18"
        expect: { age_at_meeting: 17, error_id: ERR_AGE_RESTRICTION }
      - label: "max_age ceiling is inclusive"
        given: "guest.birth_date=1955-01-10T00:00:00Z, meeting_time_utc=2026-09-15T09:00:00Z, excursion.max_age=71"
        steps: "age_at_meeting=71; 71 > 71 is false so the gate passes; a guest one year older would fail"
        expect: { age_at_meeting: 71, passes: true }
      - label: "LEVEL_3 admits FULL only"
        given: "excursion.mobility_level=LEVEL_3; guest A mobility_level=ASSISTED, guest B mobility_level=FULL"
        steps: "required_rank=3; A has rank 2 < 3 and fails; B has rank 3 and passes"
        expect: { guest_a: { error_id: ERR_MOBILITY_RESTRICTION }, guest_b: { passes: true } }
      - label: "LEVEL_4 excludes a cardiac guest even at FULL mobility and even with an acknowledgement"
        given: "excursion.mobility_level=LEVEL_4, excursion.medical_warning_codes=[CARDIAC]; guest mobility_level=FULL, medical_flags=[CARDIAC]; booking.medical_warning_acknowledged=true"
        steps: "guest_rank 3 >= required_rank 3 passes, but CARDIAC is in LEVEL4_EXCLUDED_FLAGS so the mobility gate still fails; the acknowledgement is irrelevant"
        expect: { error_id: ERR_MOBILITY_RESTRICTION }
      - label: "acknowledgement is required only where the flag sets intersect"
        given: "excursion.medical_warning_codes=[MOTION_SICKNESS, ALTITUDE], excursion.mobility_level=LEVEL_2; guest mobility_level=FULL; booking.medical_warning_acknowledged=false"
        steps: "guest with medical_flags=[ALTITUDE]: overlap {ALTITUDE} is non-empty so ERR_MEDICAL_ACK_REQUIRED. guest with medical_flags=[CARDIAC]: overlap is empty so the booking succeeds with medical_warning_acknowledged=false untouched."
        expect: { overlapping_guest: { error_id: ERR_MEDICAL_ACK_REQUIRED }, non_overlapping_guest: { passes: true } }
      - label: "language is checked against the excursion, not against the guest's preference"
        given: "excursion.languages=[EN, ES]; guest.language_pref=DE; booking.language_choice=ES"
        steps: "language_choice ES is a member of the excursion's languages so the gate passes; the guest's DE preference is never consulted. A booking with language_choice=DE would raise ERR_LANGUAGE_UNAVAILABLE."
        expect: { passes: true }

  # ----------------------------------------------------------------- 11 of 12
  - name: meeting_point_occupancy
    description: |
      Decides whether a departure may use a meeting point at its meeting time. Each
      departure occupies its meeting point over a half-open window that opens a fixed
      setup period before the meeting time and closes after the loading dwell plus the
      meeting point's clear-down buffer. Windows that merely touch do not collide. The
      meeting point admits a configured number of concurrent groups, so the check is
      an aggregate one: the violation is the (N+1)-th group whose window contains a
      common instant, not any single pair.
    trigger: "POST /shore-excursions/departures and POST /shore-excursions/departures/{departureId}/reschedule-meeting"
    inputs:
      - "ExcursionDeparture.meeting_time_utc and dispatch_dwell_minutes of the candidate"
      - "the same fields of every other non-cancelled departure sharing meeting_point_id"
      - "MeetingPoint.slot_buffer_minutes and MeetingPoint.max_concurrent_groups"
    algorithm: interval_merge
    formula: |
      def window(d):
          # HALF-OPEN [start, end): the buffer sits at the END only
          start = d.meeting_time_utc - MEETING_SETUP_MINUTES minutes
          end   = d.meeting_time_utc
                  + d.dispatch_dwell_minutes minutes
                  + meeting_point.slot_buffer_minutes minutes
          return [start, end)

      peers = [ d for d in ExcursionDeparture
                if  d.meeting_point_id == candidate.meeting_point_id
                and d.id != candidate.id
                and d.status NOT IN (CANCELLED_WEATHER, CANCELLED_OPERATIONAL, COMPLETED) ]

      # Two windows collide when they share at least one instant:
      #   collide(a, b)  <=>  a.start < b.end AND b.start < a.end
      # Touching windows (a.end == b.start) do NOT collide.

      # Aggregate test: sweep the candidate's window together with the peers' windows
      # and take the maximum number of windows covering any single instant.
      peak = max over instants t in window(candidate) of
                 1 + count( p in peers where window(p) contains t )
      if peak > meeting_point.max_concurrent_groups:
          raise ERR_MEETING_POINT_CONGESTED                                  # 409
    constants:
      MEETING_SETUP_MINUTES: 15
    precision: "whole minutes; half-open interval arithmetic, buffer applied at the end boundary only"
    overlap_semantics:
      interval_kind: half_open
      boundary_rule: "a window ending at exactly the instant another begins does NOT collide"
      buffer_placement: "slot_buffer_minutes is added to the END of the window only; the 15-minute setup period extends the START and is not a buffer"
      aggregate_limit: "MeetingPoint.max_concurrent_groups; the error fires on the group that pushes the peak above the limit"
      excluded_peers: "departures in CANCELLED_WEATHER, CANCELLED_OPERATIONAL or COMPLETED free their slot"
    worked_examples:
      - label: "touching windows do not collide, so a capacity-1 meeting point still admits the second group"
        given: "MeetingPoint.max_concurrent_groups=1, slot_buffer_minutes=10; existing departure E meeting 09:00Z dwell 20; candidate C meeting 09:45Z dwell 20"
        steps: "window(E)=[08:45, 09:30); window(C)=[09:30, 10:15). E.end == C.start so they touch without colliding; peak=1 <= 1; admitted"
        expect: { admitted: true, peak: 1 }
      - label: "one minute earlier and the same candidate collides"
        given: "identical except candidate C meeting 09:44Z"
        steps: "window(C)=[09:29, 10:14); 09:29 < 09:30 so the windows share the instant 09:29; peak=2 > 1"
        expect: { error_id: ERR_MEETING_POINT_CONGESTED, peak: 2 }
      - label: "the buffer sits at the end only: an earlier group's buffer blocks, the candidate's own start does not"
        given: "MeetingPoint.max_concurrent_groups=1, slot_buffer_minutes=10; existing E meeting 09:00Z dwell 20 (window [08:45, 09:30)); candidate C meeting 09:35Z dwell 20 (window [09:20, 10:05))"
        steps: "09:20 < 09:30 so E's 10-minute clear-down buffer overlaps C's 15-minute setup period; peak=2 > 1. Placing the buffer at the start instead would have produced windows [08:35, 09:20) and [09:10, 09:55), which also collide but at a different instant and would admit a 09:45 candidate that this rule already admits -- the fixtures above pin the end-only placement."
        expect: { error_id: ERR_MEETING_POINT_CONGESTED }
      - label: "aggregate limit: the third group is the violation, no single pair is"
        given: "MeetingPoint.max_concurrent_groups=2, slot_buffer_minutes=10; existing E1 meeting 09:00Z dwell 20 and E2 meeting 09:05Z dwell 20; candidate C meeting 09:10Z dwell 20"
        steps: "windows [08:45, 09:30), [08:50, 09:35), [08:55, 09:40); at 08:55 all three overlap so peak=3 > 2. Each individual pair would have been within the limit of 2."
        expect: { error_id: ERR_MEETING_POINT_CONGESTED, peak: 3 }
      - label: "a cancelled peer frees its slot"
        given: "MeetingPoint.max_concurrent_groups=1; existing E meeting 09:00Z dwell 20 with status CANCELLED_WEATHER; candidate C meeting 09:10Z dwell 20"
        steps: "E is excluded from peers; peak=1 <= 1; admitted"
        expect: { admitted: true }

  # ----------------------------------------------------------------- 12 of 12
  - name: revenue_report_per_port
    description: |
      Aggregates one port's excursion trading into a single read-only report:
      ticket revenue, fees, refunds, goodwill, the line's commission, what the
      operators are owed, and what the line keeps. Every ratio is expressed in basis
      points and guarded against a zero denominator so an empty port still reports
      cleanly rather than failing.
    trigger: "GET /shore-excursions/ports/{portId}/revenue-report"
    inputs:
      - "the PortCall rows with port_id == portId, optionally narrowed by the voyage_code query parameter"
      - "the Booking rows on departures of those port calls"
      - "the RefundLedgerEntry rows of those bookings"
      - "the CommissionStatement rows with status IN {ISSUED, DISPUTED, ADJUSTED, SETTLED} for those port calls"
    algorithm: aggregation
    formula: |
      calls    = PortCall rows with port_id == portId (and voyage_code == filter when supplied)
      bookings = Booking rows whose ExcursionDeparture.port_call_id IN calls
      # counted bookings exclude nothing: the denominator is every booking ever taken
      booking_count = count(bookings)

      # ---- money -------------------------------------------------------------
      gross_ticket_cents  = sum(b.quoted_total_cents for b in bookings
                                where b.financial_status IN (CHARGED, PARTIALLY_REFUNDED,
                                                             REFUNDED, RETAINED))
      service_fee_cents   = sum(b.service_fee_cents  for b in the same set)
      refunds_cents       = sum(e.amount_cents for RefundLedgerEntry e of those bookings
                                where e.entry_kind == REFUND)
      goodwill_cents      = sum(e.amount_cents for RefundLedgerEntry e of those bookings
                                where e.entry_kind IN (GOODWILL_CREDIT, REPATRIATION_ALLOWANCE))
      line_commission_cents = sum(s.line_commission_cents for s in statements_in_scope)
      operator_payable_cents = sum(s.operator_payable_cents for s in statements_in_scope)
      net_line_revenue_cents = gross_ticket_cents + service_fee_cents
                               - refunds_cents - goodwill_cents - operator_payable_cents

      # ---- counts and ratios -------------------------------------------------
      cancelled_booking_count = count(b for b in bookings
          where b.fulfillment_status IN (CANCELLED_BY_GUEST, CANCELLED_BY_LINE))
      completed_booking_count = count(b for b in bookings where b.fulfillment_status == COMPLETED)
      no_show_booking_count   = count(b for b in bookings where b.fulfillment_status == NO_SHOW)

      # zero-denominator guard: an empty port reports 0, never an error and never null
      cancellation_rate_bps = 0 if booking_count == 0 else
                              round_half_up(cancelled_booking_count * 10000 / booking_count)
      no_show_rate_bps      = 0 if booking_count == 0 else
                              round_half_up(no_show_booking_count * 10000 / booking_count)
    constants: {}
    precision: "integer cents for every money figure; ratios in whole basis points with round_half_up"
    worked_examples:
      - label: "empty port reports zeros rather than failing"
        given: "a Port with no PortCall rows at all"
        steps: "booking_count=0 so both ratios take the guarded 0 branch and every money figure is an empty sum of 0"
        expect: { booking_count: 0, gross_ticket_cents: 0, net_line_revenue_cents: 0, cancellation_rate_bps: 0, no_show_rate_bps: 0 }
      - label: "ratio rounding on a denominator that does not divide evenly"
        given: "booking_count=7, cancelled_booking_count=2, no_show_booking_count=1"
        steps: "cancellation_rate_bps=round_half_up(20000/7)=round_half_up(2857.142...)=2857; no_show_rate_bps=round_half_up(10000/7)=round_half_up(1428.571...)=1429"
        expect: { cancellation_rate_bps: 2857, no_show_rate_bps: 1429 }
      - label: "net line revenue after an operational cancellation"
        given: "gross_ticket_cents=48508, service_fee_cents=1455, refunds_cents=49963, goodwill_cents=4851, operator_payable_cents=0"
        steps: "48508+1455-49963-4851-0 = -4851; the report may be negative when the line refunded everything and paid goodwill on top"
        expect: { net_line_revenue_cents: -4851 }

# =============================================================================
# §1.4 Validation Rules Table — evaluated strictly in ascending `priority`.
# The FIRST rule whose condition holds decides the response; no later rule may
# preempt it. Category boundaries are the priority pairs exercised in §1.8.
# =============================================================================
validations:
  # ---------------------------------------------------------------- auth (1-5)
  - priority: 1
    category: auth
    check: "X-User-ID header present and non-empty on every request except POST /_clock/set_current_utc"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Identity is resolved before anything else, including before the route's own existence checks."
  - priority: 2
    category: auth
    check: "the caller's role appears in the endpoint's authorized roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
    description: "Role authorisation precedes existence, so a wrong-role caller cannot probe which identifiers exist."
  - priority: 3
    category: auth
    check: "a caller acting in the Guest role targets only Booking rows whose guest_id resolves to that caller's own Guest row"
    error_id: ERR_BOOKING_NOT_OWNED
    http_status: 403
    applies_to:
      - "GET /shore-excursions/bookings/{bookingId}"
      - "GET /shore-excursions/refund-ledger-entries/{entryId}"
      - "POST /shore-excursions/bookings/{bookingId}/cancel"
    description: "Row-level ownership for the entity-backed Guest role; desk and manager roles are exempt."
  - priority: 4
    category: auth
    check: "X-User-ID on a claim adjudication differs from LiabilityClaim.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to:
      - "POST /shore-excursions/claims/{claimId}/actions"
    description: "Applies to the ADJUDICATE_UPHELD and ADJUDICATE_DENIED actions only; the same officer may still SEND_TO_OPERATOR and RECORD_DISPUTE."
  - priority: 5
    category: auth
    check: "X-User-ID on a vetting APPROVE differs from TourOperator.latest_audit_auditor_user_id"
    error_id: ERR_AUDITOR_CANNOT_APPROVE
    http_status: 403
    applies_to:
      - "POST /shore-excursions/operators/{operatorId}/vetting-actions"
    description: "Applies to the APPROVE action only; the auditor may still SUBMIT, REQUEST_INFO, SUSPEND, REINSTATE and TERMINATE."

  # -------------------------------------------------- request shape (6) -------
  - priority: 6
    category: validation
    check: "every required body field present; every field of the declared type; every enum value inside its declared set; every numeric value inside its declared range; every array a subset of its declared value set; pagination limit in [1, 100] and offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
    description: "Shape validation runs BEFORE existence because a missing or mistyped identifier cannot be looked up. A request that both omits a required field and names a nonexistent path id returns ERR_VALIDATION, not a 404."

  # ------------------------------------------------------- existence (7-8) ----
  - priority: 7
    category: existence
    check: "every identifier in the URL path resolves to a stored row"
    error_id: "the entity's own 404: ERR_PORT_NOT_FOUND | ERR_MEETING_POINT_NOT_FOUND | ERR_PORT_CALL_NOT_FOUND | ERR_TENDER_WAVE_NOT_FOUND | ERR_OPERATOR_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_EXCURSION_NOT_FOUND | ERR_DEPARTURE_NOT_FOUND | ERR_GUEST_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_STATEMENT_NOT_FOUND"
    http_status: 404
    applies_to: all
    description: "Path identifiers are checked left to right, so a nested path with two bad ids reports the outer one."
  - priority: 8
    category: existence
    check: "every foreign key in the request body resolves to a stored row"
    error_id: "the referenced entity's own 404, as listed at priority 7"
    http_status: 404
    applies_to:
      - "POST /shore-excursions/ports/{portId}/meeting-points"
      - "POST /shore-excursions/port-calls"
      - "POST /shore-excursions/excursions"
      - "PATCH /shore-excursions/excursions/{excursionId}"
      - "POST /shore-excursions/departures"
      - "POST /shore-excursions/bookings"
      - "POST /shore-excursions/incidents/{incidentId}/claims"
      - "POST /shore-excursions/commission-statements"
    description: "Body foreign keys are checked in the order they are declared in the endpoint's input list."

  # ----------------------------------------------- semantic shape (9) ---------
  - priority: 9
    category: validation
    check: "instant orderings hold: PortCall.arrival_utc < all_aboard_utc <= departure_utc; TenderWave.window_start_utc < window_end_utc; SafetyAudit.conducted_on <= logical clock; GuestIncident.occurred_utc <= logical clock; Excursion.max_age is null or >= min_age; ExcursionDeparture COMPLETE actual_return_utc in [meeting_time_utc, logical clock]"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to:
      - "POST /shore-excursions/port-calls"
      - "POST /shore-excursions/port-calls/{portCallId}/tender-waves"
      - "POST /shore-excursions/operators/{operatorId}/safety-audits"
      - "POST /shore-excursions/excursions"
      - "PATCH /shore-excursions/excursions/{excursionId}"
      - "POST /shore-excursions/bookings/{bookingId}/incidents"
      - "POST /shore-excursions/departures/{departureId}/operations"
    description: "Cross-field instant and range coherence, distinct from single-field type checking at priority 6."

  # -------------------------------------------------- uniqueness (10-11) ------
  - priority: 10
    category: uniqueness
    check: "Port.port_code is unique across all Port rows"
    error_id: ERR_DUPLICATE_PORT_CODE
    http_status: 409
    applies_to:
      - "POST /shore-excursions/ports"
    description: "Case-sensitive on the normalised upper-case code."
  - priority: 11
    category: uniqueness
    check: "TenderWave.wave_index is unique within a port_call_id"
    error_id: ERR_DUPLICATE_WAVE_INDEX
    http_status: 409
    applies_to:
      - "POST /shore-excursions/port-calls/{portCallId}/tender-waves"
    description: "Two calls may reuse the same ordinal; one call may not."

  # ---------------------------------- optimistic concurrency (12-13) ----------
  - priority: 12
    category: business_constraint
    check: "expected_departure_version equals the current ExcursionDeparture.version"
    error_id: ERR_STALE_DEPARTURE_VERSION
    http_status: 412
    applies_to:
      - "POST /shore-excursions/bookings"
      - "POST /shore-excursions/departures/{departureId}/allocation"
    description: "The stale-version check outranks every state and business rule on the same request, so a caller holding a stale read is told to re-read rather than being told why the write was otherwise unacceptable."
  - priority: 13
    category: business_constraint
    check: "expected_operator_version equals the current TourOperator.version"
    error_id: ERR_STALE_OPERATOR_VERSION
    http_status: 412
    applies_to:
      - "POST /shore-excursions/commission-statements"
    description: "Same precedence reasoning as priority 12, applied to the operator whose rate and standing the statement is built on."

  # ---------------------------------------------------------- state (14-22) ---
  - priority: 14
    category: state
    check: "the requested port-call transition is declared for PortCall.status, and its clock precondition holds (ARRIVE needs now >= effective_arrival_utc; CLOSE_ALL_ABOARD needs now >= all_aboard_utc)"
    error_id: ERR_INVALID_PORT_CALL_ACTION
    http_status: 422
    applies_to:
      - "POST /shore-excursions/port-calls/{portCallId}/transitions"
      - "POST /shore-excursions/port-calls/{portCallId}/delays"
    description: "Also refuses delays recorded against a CLOSED or CANCELLED call."
  - priority: 15
    category: state
    check: "the requested catalog action is declared for Excursion.catalog_status"
    error_id: ERR_INVALID_CATALOG_ACTION
    http_status: 422
    applies_to:
      - "POST /shore-excursions/excursions/{excursionId}/catalog-actions"
      - "PATCH /shore-excursions/excursions/{excursionId}"
    description: "PATCH is refused on any excursion whose catalog_status is not DRAFT or PENDING_REVIEW."
  - priority: 16
    category: state
    check: "the requested vetting action is declared for TourOperator.vetting_status"
    error_id: ERR_INVALID_VETTING_ACTION
    http_status: 422
    applies_to:
      - "POST /shore-excursions/operators/{operatorId}/vetting-actions"
    description: "TERMINATED is terminal: every action on a terminated operator fails here."
  - priority: 17
    category: state
    check: "the requested departure operation is declared for ExcursionDeparture.status and the owning PortCall is in the state that operation needs"
    error_id: ERR_INVALID_DEPARTURE_STATE
    http_status: 422
    applies_to:
      - "POST /shore-excursions/departures/{departureId}/cancel"
      - "POST /shore-excursions/departures/{departureId}/operations"
      - "POST /shore-excursions/departures/{departureId}/allocation"
      - "POST /shore-excursions/departures/{departureId}/tender-assignment"
      - "POST /shore-excursions/departures/{departureId}/reschedule-meeting"
      - "POST /shore-excursions/bookings/{bookingId}/cancel"
      - "POST /shore-excursions/bookings/{bookingId}/fulfillment-actions"
    description: "Covers DISPATCH without an owning call IN_PORT, COMPLETE from anything but OPERATING, allocation or reschedule on a terminal departure, and check-in against a departure that is no longer live."
  - priority: 18
    category: state
    check: "the ExcursionDeparture named by a new booking has status == SELLING"
    error_id: ERR_DEPARTURE_NOT_SELLING
    http_status: 422
    applies_to:
      - "POST /shore-excursions/bookings"
      - "POST /shore-excursions/bookings/{bookingId}/fulfillment-actions"
    description: "A SCHEDULED departure has not opened, a CLOSED one has shut, and a cancelled or completed one is terminal. TICKET additionally accepts a CLOSED departure so guests booked before the cutoff can still be ticketed."
  - priority: 19
    category: state
    check: "the requested fulfillment action is declared for the booking's current (fulfillment_status, financial_status) pair"
    error_id: ERR_INVALID_BOOKING_ACTION
    http_status: 422
    applies_to:
      - "POST /shore-excursions/bookings/{bookingId}/fulfillment-actions"
      - "POST /shore-excursions/bookings/{bookingId}/cancel"
      - "POST /shore-excursions/bookings/{bookingId}/incidents"
    description: "Both dimensions are consulted: TICKET requires financial_status == AUTHORIZED, and an incident may only be filed against a booking whose fulfillment_status is CHECKED_IN, COMPLETED or NO_SHOW."
  - priority: 20
    category: state
    check: "the requested claim action is declared for LiabilityClaim.status, and a claim may be opened only on a GuestIncident whose status == FILED with no existing claim"
    error_id: ERR_INVALID_CLAIM_ACTION
    http_status: 422
    applies_to:
      - "POST /shore-excursions/incidents/{incidentId}/claims"
      - "POST /shore-excursions/incidents/{incidentId}/close"
      - "POST /shore-excursions/claims/{claimId}/actions"
    description: "Also refuses SEND_TO_OPERATOR against a TERMINATED operator and refuses closing an incident that already has a claim."
  - priority: 21
    category: state
    check: "the requested statement transition is declared for CommissionStatement.status, and SETTLE requires basis == FINAL"
    error_id: ERR_INVALID_STATEMENT_ACTION
    http_status: 422
    applies_to:
      - "POST /shore-excursions/commission-statements/{statementId}/transitions"
    description: "A PROVISIONAL statement can be issued, disputed and adjusted but never settled."
  - priority: 22
    category: state
    check: "issuing a FINAL statement requires the owning PortCall.status == CLOSED"
    error_id: ERR_PORT_CALL_NOT_CLOSED
    http_status: 422
    applies_to:
      - "POST /shore-excursions/commission-statements/{statementId}/transitions"
    description: "Cross-entity state guard: the final settlement basis is not knowable until the all-aboard deadline has passed and every booking has reached a terminal fulfillment state."

  # ------------------------------------------------- business_safety (23-33) --
  - priority: 23
    category: business_safety
    check: "TourOperator.insurance_expiry_date > logical clock on every vetting action, and >= logical clock + 30 days on a catalog PUBLISH"
    error_id: ERR_INSURANCE_EXPIRED
    http_status: 422
    applies_to:
      - "POST /shore-excursions/operators/{operatorId}/vetting-actions"
      - "POST /shore-excursions/excursions/{excursionId}/catalog-actions"
    description: "Publishing demands a 30-day runway so a tour is never on sale with cover about to lapse; vetting only demands live cover."
  - priority: 24
    category: business_safety
    check: "TourOperator.insurance_liability_limit_cents >= 100000000 before APPROVE"
    error_id: ERR_INSURANCE_LIMIT_INSUFFICIENT
    http_status: 422
    applies_to:
      - "POST /shore-excursions/operators/{operatorId}/vetting-actions"
    description: "One million currency units of per-occurrence cover is the floor for approval."
  - priority: 25
    category: business_safety
    check: "at least one SafetyAudit exists for the operator before SUBMIT"
    error_id: ERR_AUDIT_REQUIRED
    http_status: 422
    applies_to:
      - "POST /shore-excursions/operators/{operatorId}/vetting-actions"
    description: "No operator enters vetting unaudited."
  - priority: 26
    category: business_safety
    check: "TourOperator.safety_score >= 60 before APPROVE or REINSTATE"
    error_id: ERR_SAFETY_SCORE_BELOW_FLOOR
    http_status: 422
    applies_to:
      - "POST /shore-excursions/operators/{operatorId}/vetting-actions"
    description: "A score of exactly 60 satisfies the floor; 59 does not."
  - priority: 27
    category: business_safety
    check: "TourOperator.vetting_cycle_count <= 3 before RESUBMIT"
    error_id: ERR_VETTING_CYCLE_EXHAUSTED
    http_status: 422
    applies_to:
      - "POST /shore-excursions/operators/{operatorId}/vetting-actions"
    description: "Caps the SUBMITTED <-> INFO_REQUESTED loop; the fourth information request ends the cycle."
  - priority: 28
    category: business_safety
    check: "TourOperator.vetting_status == APPROVED when publishing that operator's excursion and when ticketing a booking on it"
    error_id: ERR_OPERATOR_NOT_APPROVED
    http_status: 422
    applies_to:
      - "POST /shore-excursions/excursions/{excursionId}/catalog-actions"
      - "POST /shore-excursions/bookings/{bookingId}/fulfillment-actions"
    description: "Cross-entity dependency: an operator suspended between booking and ticketing blocks the charge even though the booking was legitimately taken."
  - priority: 29
    category: business_safety
    check: "age_at_meeting within [Excursion.min_age, Excursion.max_age] per calculations.guest_eligibility_screen"
    error_id: ERR_AGE_RESTRICTION
    http_status: 422
    applies_to:
      - "POST /shore-excursions/bookings"
    description: "Both bounds are inclusive; a birthday falling on the meeting date counts as attained."
  - priority: 30
    category: business_safety
    check: "guest mobility rank >= the excursion's required rank, and no LEVEL_4 excluded medical flag on a LEVEL_4 excursion"
    error_id: ERR_MOBILITY_RESTRICTION
    http_status: 422
    applies_to:
      - "POST /shore-excursions/bookings"
    description: "The LEVEL_4 medical exclusion is absolute and cannot be waived by an acknowledgement."
  - priority: 31
    category: business_safety
    check: "medical_warning_acknowledged == true whenever Guest.medical_flags intersects Excursion.medical_warning_codes"
    error_id: ERR_MEDICAL_ACK_REQUIRED
    http_status: 422
    applies_to:
      - "POST /shore-excursions/bookings"
    description: "Conditional rule: with an empty intersection the flag is ignored entirely."
  - priority: 32
    category: business_safety
    check: "Booking.language_choice is a member of Excursion.languages"
    error_id: ERR_LANGUAGE_UNAVAILABLE
    http_status: 422
    applies_to:
      - "POST /shore-excursions/bookings"
    description: "Guest.language_pref is advisory and is never validated."
  - priority: 33
    category: business_safety
    check: "Guest.voyage_code equals the voyage_code of the PortCall the booked departure runs on"
    error_id: ERR_VOYAGE_MISMATCH
    http_status: 422
    applies_to:
      - "POST /shore-excursions/bookings"
    description: "A guest cannot book ashore time on a voyage they are not sailing."

  # ---------------------------------------------- business_temporal (34-37) ---
  - priority: 34
    category: business_temporal
    check: "ExcursionDeparture.meeting_time_utc lies within [PortCall.arrival_utc, PortCall.all_aboard_utc]"
    error_id: ERR_MEETING_TIME_OUTSIDE_CALL
    http_status: 422
    applies_to:
      - "POST /shore-excursions/departures"
      - "POST /shore-excursions/departures/{departureId}/reschedule-meeting"
    description: "Both bounds inclusive, measured against the published schedule, not the delayed arrival."
  - priority: 35
    category: business_temporal
    check: "logical clock < ExcursionDeparture.meeting_time_utc - 60 minutes when taking a new booking"
    error_id: ERR_SALES_CUTOFF_PASSED
    http_status: 422
    applies_to:
      - "POST /shore-excursions/bookings"
    description: "Sales stop exactly 60 minutes before the meeting time; at the cutoff instant itself the sale is refused."
  - priority: 36
    category: business_temporal
    check: "ExcursionDeparture.timing_risk_band_actual != RED when dispatching"
    error_id: ERR_TIMING_RISK_RED
    http_status: 422
    applies_to:
      - "POST /shore-excursions/departures/{departureId}/operations"
    description: "A projected return that eats the port's whole risk buffer forbids dispatch; the band is recomputed from the live delay on every request."
  - priority: 37
    category: business_temporal
    check: "logical clock within [meeting_time_utc - 45 minutes, meeting_time_utc + 10 minutes] when checking a guest in"
    error_id: ERR_CHECKIN_WINDOW_CLOSED
    http_status: 422
    applies_to:
      - "POST /shore-excursions/bookings/{bookingId}/fulfillment-actions"
    description: "Both bounds inclusive; the grace period is deliberately shorter than the setup period."

  # -------------------------------------------- business_constraint (38-40) ---
  - priority: 38
    category: business_constraint
    check: "the candidate tender wave's closed window [window_start_utc, window_end_utc] shares no instant with any other non-cancelled wave on the same port call"
    error_id: ERR_TENDER_WAVE_OVERLAP
    http_status: 409
    applies_to:
      - "POST /shore-excursions/port-calls/{portCallId}/tender-waves"
    description: "Closed intervals with zero buffer and single occupancy: a wave starting at the exact instant another ends DOES collide, because one pontoon cannot serve two waves at that instant."
  - priority: 39
    category: business_constraint
    check: "the candidate departure's half-open meeting-point window raises the peak concurrent group count no higher than MeetingPoint.max_concurrent_groups"
    error_id: ERR_MEETING_POINT_CONGESTED
    http_status: 409
    applies_to:
      - "POST /shore-excursions/departures"
      - "POST /shore-excursions/departures/{departureId}/reschedule-meeting"
    description: "Half-open intervals with an end-side buffer and an aggregate capacity: touching windows do NOT collide, and the violation belongs to the group that pushes the peak over the limit."
  - priority: 40
    category: business_constraint
    check: "calculations.tender_wave_selection finds a non-empty eligible pool, and a TENDER-mode port call has at least one EXCURSION_PRIORITY wave before sales open"
    error_id: ERR_NO_ELIGIBLE_TENDER_WAVE
    http_status: 422
    applies_to:
      - "POST /shore-excursions/departures/{departureId}/tender-assignment"
      - "POST /shore-excursions/port-calls/{portCallId}/transitions"
      - "POST /shore-excursions/departures/{departureId}/operations"
    description: "Also blocks DISPATCH at a TENDER port when the departure still has no wave assigned."

  # ------------------------------------------ business_referential (41-44) ----
  - priority: 41
    category: business_referential
    check: "no LiabilityClaim for the same (operator_id, port_call_id) has status IN {SUBMITTED, UNDER_OPERATOR_REVIEW, DISPUTED} when issuing a statement, and none is open for the operator when reinstating or terminating it"
    error_id: ERR_OPEN_CLAIM_BLOCKS_ISSUE
    http_status: 422
    applies_to:
      - "POST /shore-excursions/commission-statements/{statementId}/transitions"
      - "POST /shore-excursions/operators/{operatorId}/vetting-actions"
    description: "Money and standing do not move while liability is unresolved."
  - priority: 42
    category: business_referential
    check: "round_half_up(settlement_amount_cents * liability_share_bps / 10000) <= TourOperator.insurance_liability_limit_cents"
    error_id: ERR_CLAIM_EXCEEDS_INSURANCE_LIMIT
    http_status: 422
    applies_to:
      - "POST /shore-excursions/claims/{claimId}/actions"
    description: "An operator cannot be charged beyond the cover it was approved on; the limit is inclusive."
  - priority: 43
    category: business_referential
    check: "LiabilityClaim.dispute_round_count below 2 before RECORD_DISPUTE, and at most 2 before returning a disputed claim to the operator"
    error_id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to:
      - "POST /shore-excursions/claims/{claimId}/actions"
    description: "Caps the UNDER_OPERATOR_REVIEW <-> DISPUTED loop at two rounds."
  - priority: 44
    category: business_referential
    check: "calculations.alternative_departure_selection finds a non-empty pool whenever a cancellation requests offer_alternative == true, and a PUBLISH names a nominated alternative that is itself published at the same port"
    error_id: ERR_NO_ALTERNATIVE_AVAILABLE
    http_status: 422
    applies_to:
      - "POST /shore-excursions/departures/{departureId}/cancel"
      - "POST /shore-excursions/excursions/{excursionId}/catalog-actions"
    description: "The whole cancellation is refused rather than half-applied, so the caller can retry with offer_alternative == false."

  # ---------------------------------------------- business_fiscal (45-47) -----
  - priority: 45
    category: business_fiscal
    check: "precruise_allocation + onboard_allocation == total_capacity"
    error_id: ERR_ALLOCATION_MISMATCH
    http_status: 422
    applies_to:
      - "POST /shore-excursions/departures"
      - "POST /shore-excursions/departures/{departureId}/allocation"
    description: "The two channel buckets must exactly partition the departure's seats; no slack bucket exists."
  - priority: 46
    category: business_fiscal
    check: "precruise_allocation >= precruise_sold_seats and onboard_allocation >= onboard_sold_seats"
    error_id: ERR_ALLOCATION_BELOW_SOLD
    http_status: 422
    applies_to:
      - "POST /shore-excursions/departures/{departureId}/allocation"
    description: "A rebalance may not strand seats that have already been sold out of the bucket being shrunk."
  - priority: 47
    category: business_fiscal
    check: "party_size <= the effective available seats of the booking's own channel per calculations.channel_allocation_availability"
    error_id: ERR_CHANNEL_ALLOCATION_EXHAUSTED
    http_status: 422
    applies_to:
      - "POST /shore-excursions/bookings"
    description: "The lowest-priority rule in the ladder: every safety, temporal and constraint objection is reported before the seat count is even consulted. A pre-cruise request after the release window is refused here even when the departure still has free seats."

# =============================================================================
# §1.5 API Endpoint Table — 58 endpoints, all under /shore-excursions except the
# logical clock. Every `input` entry is a body field or query parameter name;
# a trailing `?` marks it optional. Path parameters are not repeated in `input`.
# =============================================================================
endpoints:
  # -------------------------------------------------------------------- Ports
  - method: POST
    path: /shore-excursions/ports
    description: "Register a port of call the line trades excursions at."
    roles: [ExcursionManager]
    success_code: 201
    input:
      - port_code
      - name
      - country_code
      - docking_mode
      - risk_buffer_minutes?
      - tender_egress_minutes?
    output: Port
    side_effects: []
  - method: GET
    path: /shore-excursions/ports/{portId}
    description: "Read one port."
    roles: [Guest, ShoreExcursionDesk, ExcursionManager, OperatorVettingOfficer, PortAgent, RiskOfficer, FinanceController]
    success_code: 200
    input: []
    output: Port
    side_effects: []
  - method: GET
    path: /shore-excursions/ports
    description: "List ports, filterable by country and docking mode."
    roles: [Guest, ShoreExcursionDesk, ExcursionManager, OperatorVettingOfficer, PortAgent, RiskOfficer, FinanceController]
    success_code: 200
    input:
      - country_code?
      - docking_mode?
      - limit?
      - offset?
    output: Port[]
    side_effects: []
  - method: GET
    path: /shore-excursions/ports/{portId}/revenue-report
    description: "Per-port revenue and cancellation report, per calculations.revenue_report_per_port. Read-only aggregate over every port call at the port, optionally narrowed to one voyage."
    roles: [FinanceController, ExcursionManager]
    success_code: 200
    input:
      - voyage_code?
    output:
      port_id: string
      voyage_code: string
      port_call_count: integer
      booking_count: integer
      completed_booking_count: integer
      cancelled_booking_count: integer
      no_show_booking_count: integer
      gross_ticket_cents: integer
      service_fee_cents: integer
      refunds_cents: integer
      goodwill_cents: integer
      line_commission_cents: integer
      operator_payable_cents: integer
      net_line_revenue_cents: integer
      cancellation_rate_bps: integer
      no_show_rate_bps: integer
    side_effects: []
  - method: POST
    path: /shore-excursions/ports/{portId}/meeting-points
    description: "Create a guest assembly point in the port's pier area."
    roles: [ExcursionManager]
    success_code: 201
    input:
      - name
      - zone
      - max_concurrent_groups
      - slot_buffer_minutes?
    output: MeetingPoint
    side_effects: []

  # ------------------------------------------------------------ MeetingPoints
  - method: GET
    path: /shore-excursions/meeting-points/{meetingPointId}
    description: "Read one meeting point."
    roles: [Guest, ShoreExcursionDesk, ExcursionManager, PortAgent, RiskOfficer, FinanceController, OperatorVettingOfficer]
    success_code: 200
    input: []
    output: MeetingPoint
    side_effects: []
  - method: GET
    path: /shore-excursions/meeting-points
    description: "List meeting points, filterable by port and zone."
    roles: [Guest, ShoreExcursionDesk, ExcursionManager, PortAgent, RiskOfficer, FinanceController, OperatorVettingOfficer]
    success_code: 200
    input:
      - port_id?
      - zone?
      - limit?
      - offset?
    output: MeetingPoint[]
    side_effects: []

  # ---------------------------------------------------------- Tour operators
  - method: POST
    path: /shore-excursions/operators
    description: "Register a tour operator for vetting at one port. The operator starts in DRAFT with safety_score 0."
    roles: [OperatorVettingOfficer]
    success_code: 201
    input:
      - port_id
      - legal_name
      - contact_email
      - insurance_expiry_date
      - insurance_liability_limit_cents
      - commission_rate_bps
    output: TourOperator
    side_effects:
      - "TourOperator created with vetting_status DRAFT, vetting_cycle_count 0, safety_score 0, reliability_strikes 0, liability_reserve_cents 0, latest_audit_auditor_user_id null"
  - method: GET
    path: /shore-excursions/operators/{operatorId}
    description: "Read one tour operator including its live safety_score and reliability_strikes."
    roles: [OperatorVettingOfficer, ExcursionManager, RiskOfficer, FinanceController]
    success_code: 200
    input: []
    output: TourOperator
    side_effects: []
  - method: GET
    path: /shore-excursions/operators
    description: "List tour operators, filterable by port and vetting status."
    roles: [OperatorVettingOfficer, ExcursionManager, RiskOfficer, FinanceController]
    success_code: 200
    input:
      - port_id?
      - vetting_status?
      - limit?
      - offset?
    output: TourOperator[]
    side_effects: []
  - method: POST
    path: /shore-excursions/operators/{operatorId}/safety-audits
    description: "Record an insurance and safety audit against an operator. Immediately re-scores the operator and may suspend it."
    roles: [OperatorVettingOfficer]
    success_code: 201
    input:
      - audit_type
      - conducted_on
      - raw_score
      - critical_finding_count
    output: SafetyAudit
    side_effects:
      - "SafetyAudit appended with auditor_user_id taken from the X-User-ID header"
      - "TourOperator.latest_audit_auditor_user_id set to that X-User-ID when this audit becomes the newest by (conducted_on DESC, created_at DESC)"
      - "TourOperator.safety_score recomputed per calculations.operator_safety_score"
      - "when the recomputed score drops below 60 and vetting_status == APPROVED, the operator transitions APPROVED -> SUSPENDED and CASCADE-A runs: PUBLISHED excursions -> WITHDRAWN, their live departures -> CANCELLED_OPERATIONAL, their bookings -> CANCELLED_BY_LINE with refunds, goodwill credits and seat returns"
      - "increments TourOperator.version by 1"
  - method: POST
    path: /shore-excursions/operators/{operatorId}/vetting-actions
    description: "Drive the operator vetting state machine. Actions: SUBMIT, REQUEST_INFO, RESUBMIT, APPROVE, SUSPEND, REINSTATE, TERMINATE."
    roles: [OperatorVettingOfficer]
    success_code: 200
    input:
      - action
      - note?
    output: TourOperator
    side_effects:
      - "TourOperator.vetting_status advances per §1.2; REQUEST_INFO increments vetting_cycle_count"
      - "APPROVE is refused when the caller's X-User-ID equals latest_audit_auditor_user_id"
      - "SUSPEND runs CASCADE-A across excursions, departures and bookings"
      - "REINSTATE resets reliability_strikes to 0 and does NOT republish withdrawn excursions"
      - "TERMINATE archives the operator's DRAFT, PENDING_REVIEW and WITHDRAWN excursions"
      - "increments TourOperator.version by 1"

  # ------------------------------------------------------------ Safety audits
  - method: GET
    path: /shore-excursions/safety-audits/{auditId}
    description: "Read one immutable safety audit record."
    roles: [OperatorVettingOfficer, ExcursionManager, RiskOfficer, FinanceController]
    success_code: 200
    input: []
    output: SafetyAudit
    side_effects: []
  - method: GET
    path: /shore-excursions/safety-audits
    description: "List safety audits, filterable by operator and audit type. Ordered conducted_on DESC then created_at DESC, matching the scoring window."
    roles: [OperatorVettingOfficer, ExcursionManager, RiskOfficer, FinanceController]
    success_code: 200
    input:
      - operator_id?
      - audit_type?
      - limit?
      - offset?
    output: SafetyAudit[]
    side_effects: []

  # ---------------------------------------------------------------- Port calls
  - method: POST
    path: /shore-excursions/port-calls
    description: "Schedule a ship call at a port. Starts in PLANNED with delay_minutes 0."
    roles: [PortAgent, ExcursionManager]
    success_code: 201
    input:
      - port_id
      - voyage_code
      - ship_code
      - arrival_utc
      - all_aboard_utc
      - departure_utc
    output: PortCall
    side_effects:
      - "PortCall created with status PLANNED, delay_minutes 0 and effective_arrival_utc == arrival_utc"
  - method: GET
    path: /shore-excursions/port-calls/{portCallId}
    description: "Read one port call including its accumulated delay and effective arrival."
    roles: [Guest, ShoreExcursionDesk, ExcursionManager, OperatorVettingOfficer, PortAgent, RiskOfficer, FinanceController]
    success_code: 200
    input: []
    output: PortCall
    side_effects: []
  - method: GET
    path: /shore-excursions/port-calls
    description: "List port calls, filterable by port, status and voyage."
    roles: [Guest, ShoreExcursionDesk, ExcursionManager, OperatorVettingOfficer, PortAgent, RiskOfficer, FinanceController]
    success_code: 200
    input:
      - port_id?
      - status?
      - voyage_code?
      - limit?
      - offset?
    output: PortCall[]
    side_effects: []
  - method: POST
    path: /shore-excursions/port-calls/{portCallId}/transitions
    description: "Drive the port-call state machine. Actions: OPEN_SALES, ARRIVE, CLOSE_ALL_ABOARD, CANCEL."
    roles: [PortAgent, ExcursionManager]
    success_code: 200
    input:
      - action
      - note?
    output: PortCall
    side_effects:
      - "OPEN_SALES flips every SCHEDULED departure on a PUBLISHED excursion to SELLING and freezes each one's return_guarantee_eligible"
      - "CLOSE_ALL_ABOARD closes every SELLING departure, marks every still-TICKETED booking NO_SHOW with a RETENTION ledger entry, and expires every OFFERED alternative"
      - "CANCEL runs CASCADE-C: every live departure on the call is cancelled with cause WEATHER and every booking is refunded in full with no goodwill credit"
      - "increments PortCall.version by 1"
  - method: POST
    path: /shore-excursions/port-calls/{portCallId}/delays
    description: "Record additional arrival delay on a port call. Delay accumulates, shifts effective_arrival_utc and the tender schedule, and never shifts all_aboard_utc."
    roles: [PortAgent]
    success_code: 200
    input:
      - additional_delay_minutes
      - reason_code?
    output: PortCall
    side_effects:
      - "PortCall.delay_minutes += additional_delay_minutes; effective_arrival_utc recomputed"
      - "every departure on the call has its ACTUAL_BASIS projection and timing_risk_band_actual recomputed"
      - "CASCADE-B: each departure whose timing_risk_band_actual becomes RED and whose status == SELLING transitions SELLING -> CLOSED, and each of that departure's never-charged BOOKED bookings transitions to CANCELLED_BY_LINE with financial VOIDED, an AUTH_VOID ledger entry and its seats returned to its own channel bucket"
      - "increments PortCall.version by 1"
  - method: POST
    path: /shore-excursions/port-calls/{portCallId}/tender-waves
    description: "Publish a tender landing wave for a call. Windows are closed intervals with single occupancy: a wave beginning at the exact instant another ends is rejected."
    roles: [PortAgent]
    success_code: 201
    input:
      - wave_index
      - window_start_utc
      - window_end_utc
      - guest_capacity
      - priority_class
    output: TenderWave
    side_effects:
      - "TenderWave created with assigned_guest_count 0 and assigned_departure_count 0"

