          trigger:
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p1}", session_id: "${s_near}", expected_session_version: "${near_v}" }
              as: IntakeCoordinator
              captures: { err_near: "$.data.error_id" }
