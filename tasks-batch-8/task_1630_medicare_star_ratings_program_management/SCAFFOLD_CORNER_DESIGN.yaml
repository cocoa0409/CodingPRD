            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: CUTPOINT_REVIEW }
              as: StarsAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "s1", rows: [ { measure_id: "${m_id}", band_2_floor: 0.62, band_3_floor: 0.75, band_4_floor: 0.90, band_5_floor: 0.95 } ] }
              as: StarsAnalyst
              captures: { s1: $.data.id }
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "s2", rows: [ { measure_id: "${m_id}", band_2_floor: 0.60, band_3_floor: 0.72, band_4_floor: 0.85, band_5_floor: 0.94 } ] }
              as: StarsAnalyst
              captures: { s2: $.data.id }
          trigger:
            - call: "POST /api/cutpoint-sets/${s1}/publish"
              payload: { expected_rating_cycle_version: "${cyc_v}" }
