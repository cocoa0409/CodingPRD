        distinguishing_aspect: |
          Permit->Facility dependency: a Permit's APPLIED->GRANTED transition is blocked when the
          parent Facility.status == CLOSED, returning ERR_INVALID_STATE — Permit validity depends on
          Facility state.
        test_recipe:
          setup:
