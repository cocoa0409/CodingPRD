          - "state_machines.FeeInvoice.PENDING_to_PAID"
        distinguishing_aspect: "The late penalty uses months_overdue = max(0, paid_period - due_period); paying exactly at due_period (12 == 12) yields amount 30000 with zero penalty — the '> not >=' boundary on the months-overdue metric, reached through POST /fee-invoices/{id}/pay."
        test_recipe:
          setup:
            - "PASSENGER device; an ANNUAL_RENEWAL invoice due_period 12; clock set to exactly 12."
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "Kilo Co", contact_email: "k@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
