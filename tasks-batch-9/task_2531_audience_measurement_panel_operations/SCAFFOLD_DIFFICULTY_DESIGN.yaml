          - validations[priority=37]
          - errors[ERR_RUN_WINDOW_OVERLAP]
          - endpoints[POST /processing-runs]
          - state_machines.ProcessingRun.OPEN_to_SUPERSEDED
          - entities.ProcessingRun.fields.superseded_by_run_id
          - concurrency_rules.run-create-stale-market
