  - section: cross_cutting_layers
    instances:
      - name: occ_stale_application_create_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[application-create-stale-applicant]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Applicant.version for POST /jc/applications: the first create (expected version 1) succeeds and bumps the applicant to version 2; a second create still carrying version 1 is rejected 412 ERR_STALE_VERSION — and because OCC (priority 6) precedes the duplicate constraint (priority 11), the stale error is what surfaces even though the first case is still open."
        test_recipe:
          setup: ["one applicant at version 1"]
          setup_api_calls:
            - { call: "POST /jc/applicants", payload: { full_name: "Occ Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
          trigger:
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 2, annual_income_cents: 900000, barrier_flags: ["HOMELESS"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { err: $.data.error_id } }
          assert:
            - "second create with the pre-first-create version: error_id == ERR_STALE_VERSION, HTTP 412"
            - "the stale write loses even though its content would otherwise hit ERR_DUPLICATE_APPLICATION — OCC wins on priority"

      - name: occ_stale_center_assignment_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[center-assignment-stale-applicant]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on the supersede-style re-assignment: after a successful assignment bumps the applicant to version 3, a re-assignment carrying the stale version 2 is rejected 412, while the same re-assignment with the fresh version 3 succeeds (legitimate supersede) and bumps the version to 4."
        test_recipe:
          setup: ["center with OPEN WELDING program; ELIGIBLE applicant assigned once (version now 3)"]
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Occ Center", region_code: "R-NORTH", total_beds: 4 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 3 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Occ Asg", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { asg1: $.data.assignment_status } }
          trigger:
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { err: $.data.error_id } }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v3: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v3}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { asg2: $.data.assignment_status } }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v4: $.data.version } }
          assert:
            - "first assignment: assignment_status == ASSIGNED (version 2 -> 3)"
            - "re-assignment with stale version 2: error_id == ERR_STALE_VERSION, HTTP 412"
            - "re-assignment with fresh version 3: succeeds (supersede), version advances to 4"

      - name: center_ranking_tie_break_created_at
        claim_type: selector_policy
        grounds: [calculations.center_assignment_ranking]
        distinguishing_aspect: "Deterministic tie-break without any random input: two centers with identical scores (4.70 each: 3 seats, 4 beds, same region) tie on score AND on beds_available, so the tie falls to created_at ASC — the earlier-created center wins."
        test_recipe:
          setup: ["center T1 (created first) and T2 (created second), both R-NORTH, total_beds 4, WELDING capacity 3 -> identical score 4.70 and identical beds_available 4"]
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Tie One", region_code: "R-NORTH", total_beds: 4 }, as: OperatorAdmin, captures: { t1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${t1}", trade_code: "WELDING", capacity: 3 }, as: OperatorAdmin }
            - { call: "POST /jc/centers", payload: { name: "Tie Two", region_code: "R-NORTH", total_beds: 4 }, as: OperatorAdmin, captures: { t2: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${t2}", trade_code: "WELDING", capacity: 3 }, as: OperatorAdmin }
            - { call: "POST /jc/applicants", payload: { full_name: "Tie Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
          trigger:
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { win: $.data.assigned_center_id, win_score: $.data.assigned_center_score } }
          assert:
            - "assigned_center_id == ${t1} with score 4.70 — score and beds_available tied, created_at ASC decides; the UUID id never participates"

      - name: layer_cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.ConductIncident.BOARD_REVIEW_to_SEPARATION_ORDERED]
        excluded_because:
          difficulty_instance: board_separation_cascades_enrollment_dorm_center_program
          rationale: "The depth-3 cascade is asserted end-to-end there."

      - name: layer_dual_variant_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.performance_rate]
        excluded_because:
          difficulty_instance: performance_rate_provisional_vs_final
          rationale: "Both variants and their divergence are asserted there."

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_computed_fields
        claim_type: immediate
        grounds: [entities.Center.fields.beds_available, entities.TradeProgram.fields.open_seats]
        distinguishing_aspect: "Immediate consistency: the create/patch response itself carries recomputed fields — a new center answers beds_in_use 0 / beds_available == total_beds in the same response, and PATCH capacity 5 -> 7 answers open_seats 7 without any follow-up read."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OperatorAdmin }
          trigger:
            - { call: "POST /jc/centers", payload: { name: "Imm Center", region_code: "R-NORTH", total_beds: 5 }, as: OperatorAdmin, captures: { c_id: $.data.id, c_use: $.data.beds_in_use, c_avail: $.data.beds_available } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c_id}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p_id: $.data.id, p_seats: $.data.open_seats } }
            - { call: "PATCH /jc/trade-programs/${p_id}", payload: { capacity: 7 }, as: OperatorAdmin, captures: { p_seats2: $.data.open_seats, p_ver: $.data.version } }
          assert:
            - "create center response: beds_in_use == 0 and beds_available == 5 in the same envelope"
            - "create program response: open_seats == 5 immediately"
            - "PATCH capacity to 7 response: open_seats == 7 and version == 2 in the same envelope"

  - section: state_machines
    instances:
      - name: contract_manual_probate_reinstate_terminate_cycle
        claim_type: valid_transition
        grounds: [state_machines.OperatorContract, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "The manual contract actions ride the same cycle the floor auto-transitions use: ACTIVE -> PROBATION (probate) -> ACTIVE (reinstate) -> TERMINATED (terminate), and once TERMINATED any further action — including close-period — is terminal-locked."
        test_recipe:
          setup: ["center; contract ACTIVE (created 2026-09-01)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OperatorAdmin }
            - { call: "POST /jc/centers", payload: { name: "Cycle Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/operator-contracts", payload: { center_id: "${c1}", operator_name: "CycleCo", contract_code: "K-600" }, as: OperatorAdmin, captures: { k1: $.data.id } }
          trigger:
            - { call: "POST /jc/operator-contracts/${k1}/transition", payload: { action: "probate" }, as: OperatorAdmin, captures: { s1: $.data.status } }
            - { call: "POST /jc/operator-contracts/${k1}/transition", payload: { action: "reinstate" }, as: OperatorAdmin, captures: { s2: $.data.status } }
            - { call: "POST /jc/operator-contracts/${k1}/transition", payload: { action: "terminate" }, as: OperatorAdmin, captures: { s3: $.data.status } }
            - { call: "POST /jc/operator-contracts/${k1}/transition", payload: { action: "reinstate" }, as: OperatorAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /jc/operator-contracts/${k1}/close-period", as: OperatorAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "probate: status == PROBATION; reinstate: status == ACTIVE (cycle edge); terminate: status == TERMINATED"
            - "after TERMINATED: reinstate fails ERR_ALREADY_TERMINAL and close-period fails ERR_PERIOD_NOT_CLOSABLE"

      - name: applicant_list_filters_by_assignment
        claim_type: listing
        grounds: [entities.Applicant.fields.assigned_center_id]
        distinguishing_aspect: "The applicants list supports the assigned_center_id filter (FK reverse-reachability for Applicant.assigned_center_id): after two applicants are assigned to different centers, filtering by center A returns exactly applicant 1."
        test_recipe:
          setup: ["centers A and B each with an OPEN program (A: WELDING cap 3 beds 9 -> higher score; B: CARPENTRY cap 3); applicant 1 (WELDING) assigned to A; applicant 2 (CARPENTRY) assigned to B"]
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Flt A", region_code: "R-NORTH", total_beds: 9 }, as: OperatorAdmin, captures: { ca: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${ca}", trade_code: "WELDING", capacity: 3 }, as: OperatorAdmin }
            - { call: "POST /jc/centers", payload: { name: "Flt B", region_code: "R-SOUTH", total_beds: 9 }, as: OperatorAdmin, captures: { cb: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${cb}", trade_code: "CARPENTRY", capacity: 3 }, as: OperatorAdmin }
            - { call: "POST /jc/applicants", payload: { full_name: "Flt One", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { won1: $.data.assigned_center_id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Flt Two", date_of_birth: "2002-03-10", home_region_code: "R-SOUTH", desired_trade_code: "CARPENTRY" }, as: AdmissionsCounselor, captures: { a2: $.data.id, a2_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a2}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["HOMELESS"], expected_applicant_version: "${a2_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app2: $.data.id } }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a2}", as: AdmissionsCounselor, captures: { a2_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a2}/center-assignment", payload: { expected_applicant_version: "${a2_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { won2: $.data.assigned_center_id } }
          trigger:
            - { call: "GET /jc/applicants", payload: { assigned_center_id: "${ca}" }, as: OperatorAdmin }
          assert:
            - "applicant 1 assigned to center A, applicant 2 to center B (each trade exists at exactly one center)"
            - "GET /jc/applicants?assigned_center_id=A returns exactly 1 row: ${a1}"
