# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2533 — Vote-by-Mail Ballot Processing & Signature Verification
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1–§1.7.
# Logical clock default when never set: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: envelope_timeliness_preliminary_vs_final_on_illegible_postmark
        grounds:
          - calculations.envelope_timeliness
          - entities.ReturnEnvelope.fields.preliminary_timeliness
          - entities.ReturnEnvelope.fields.final_timeliness
          - state_machines.ReturnEnvelope.SEALED_to_SEQUESTERED
          - endpoints[POST /vote-by-mail/elections/{id}/canvass-sweep]
        distinguishing_aspect: |
          This dual-variant pair lives on the ReturnEnvelope receipt-legality domain: the PRELIMINARY
          variant written at intake presumes a timely postmark for an illegible mark inside the grace
          window, while the FINAL variant written by the canvass sweep refuses that presumption, so the
          same stored row carries PROVISIONAL_TIMELY_POSTMARK and UNTIMELY at the same time.
        test_recipe:
          setup:
            - "One election with return_deadline_at 2026-11-03T20:00:00Z and postmark_grace_days 7, so the grace window ends 2026-11-10T20:00:00Z"
            - "One domestic voter with an approved request, one 28 g packet dispatched on 2026-09-10, election posture MAILING"
            - "One USPS return envelope logged at 2026-11-05T10:00:00Z with postmark_legible = false and no postmark_date — inside the grace window"
          setup_api_calls:
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ElectionsAdmin
            - call: "POST /vote-by-mail/elections"
              payload: { name: "General 2026", election_date: "2026-11-03", uocava_send_deadline_date: "2026-09-19", domestic_send_deadline_date: "2026-10-05", return_deadline_at: "2026-11-03T20:00:00Z", postage_budget_cents: 1000000, postmark_grace_days: 7, cure_window_days: 21 }
              as: ElectionsAdmin
              captures: { e1: $.data.id }
            - call: "POST /vote-by-mail/voters"
              payload: { full_name: "Vera Ames", party_affiliation: "DEM", residence_address: "1 Ash St", last_signature_update_at: "2026-01-05T00:00:00Z", signature_on_file_count: 1, uocava_status: "NONE" }
              as: ElectionsClerk
              captures: { v1: $.data.id, v1_v: $.data.version }
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v1}", election_id: "${e1}", request_channel: "ONLINE", delivery_method: "MAIL", expected_voter_version: "${v1_v}" }
              as: ElectionsClerk
              captures: { br1: $.data.id }
            - call: "GET /vote-by-mail/address-verifications"
              payload: { ballot_request_id: "${br1}" }
              as: ElectionsClerk
              captures: { av1: "$.data[0].id" }
            - call: "POST /vote-by-mail/address-verifications/${av1}/results"
              payload: { ncoa_result: "MATCH_SAME" }
              as: ElectionsClerk
            - call: "POST /vote-by-mail/ballot-requests/${br1}/approve"
              payload: {}
              as: ElectionsClerk
            - call: "POST /vote-by-mail/mailing-batches"
              payload: { election_id: "${e1}", batch_type: "DOMESTIC_INITIAL", scheduled_send_date: "2026-09-15" }
              as: ElectionsClerk
              captures: { mb1: $.data.id }
            - call: "POST /vote-by-mail/mailing-batches/${mb1}/packets"
              payload: { ballot_request_id: "${br1}", packet_weight_grams: 28 }
              as: ElectionsClerk
              captures: { pk1: $.data.id }
            - call: "POST /vote-by-mail/mailing-batches/${mb1}/seal"
              payload: {}
              as: ElectionsClerk
            - call: "POST /vote-by-mail/mailing-batches/${mb1}/dispatch"
              payload: {}
              as: ElectionsClerk
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T10:00:00Z" }
              as: ElectionsAdmin
            - call: "POST /vote-by-mail/return-envelopes"
              payload: { ballot_packet_id: "${pk1}", intake_channel: "USPS", postmark_legible: false }
              as: ElectionsClerk
              captures: { env1: $.data.id, prelim1: $.data.preliminary_timeliness }
          trigger:
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-06T00:00:00Z" }
              as: ElectionsAdmin
            - call: "POST /vote-by-mail/elections/${e1}/canvass-sweep"
              payload: {}
              as: ElectionsAdmin
              captures: { fin_count: $.data.finalized_envelope_count, seq_count: $.data.sequestered_envelope_count }
            - call: "GET /vote-by-mail/return-envelopes/${env1}"
              payload: {}
              as: ElectionsClerk
          assert:
            - "${prelim1} == \"PROVISIONAL_TIMELY_POSTMARK\" — at intake the PRELIMINARY variant gave the illegible postmark the benefit of the doubt inside the grace window"
            - "${fin_count} == 1 and ${seq_count} == 1"
            - "GET /vote-by-mail/return-envelopes/${env1} returns final_timeliness == \"UNTIMELY\" — the FINAL variant refuses the presumption on the identical row"
            - "GET /vote-by-mail/return-envelopes/${env1} returns preliminary_timeliness == \"PROVISIONAL_TIMELY_POSTMARK\" — the sweep writes final_timeliness only and never overwrites the provisional value"
            - "GET /vote-by-mail/return-envelopes/${env1} returns custody_status == \"SEQUESTERED\" and signature_status == \"UNVERIFIED\""

      - name: postage_estimated_vs_actual_after_request_supersession
        grounds:
          - calculations.postage_assessment
          - entities.MailingBatch.fields.estimated_postage_cents
          - entities.MailingBatch.fields.actual_postage_cents
          - entities.Election.fields.postage_committed_cents
          - state_machines.BallotPacket.QUEUED_to_SPOILED
        distinguishing_aspect: |
          This dual-variant pair lives on a completely different subject — money on MailingBatch and
          Election, not receipt legality on ReturnEnvelope. ESTIMATED is frozen at seal over the packets
          QUEUED at that instant, ACTUAL is recomputed at dispatch over the packets still QUEUED, so a
          request superseded between seal and dispatch makes ACTUAL strictly smaller than ESTIMATED.
        test_recipe:
          setup:
            - "One election with postage_budget_cents 1000000; clock at 2026-09-10T00:00:00Z, before the 2026-09-19 UOCAVA send deadline"
            - "Two MILITARY voters, each with one approved MATCH_SAME request"
            - "One UOCAVA batch holding two 57 g packets (129 c tier 2 + 19 c surcharge + 68 c return postage = 216 c each), sealed at estimated 432 c"
            - "After the seal, the second voter files a new request that supersedes the first, spoiling the second packet"
          setup_api_calls:
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ElectionsAdmin
            - call: "POST /vote-by-mail/elections"
              payload: { name: "General 2026", election_date: "2026-11-03", uocava_send_deadline_date: "2026-09-19", domestic_send_deadline_date: "2026-10-05", return_deadline_at: "2026-11-03T20:00:00Z", postage_budget_cents: 1000000, postmark_grace_days: 7, cure_window_days: 21 }
              as: ElectionsAdmin
              captures: { e1: $.data.id }
            - call: "POST /vote-by-mail/voters"
              payload: { full_name: "Milo Reed", party_affiliation: "REP", residence_address: "2 Birch St", last_signature_update_at: "2026-01-05T00:00:00Z", signature_on_file_count: 1, uocava_status: "MILITARY" }
              as: ElectionsClerk
              captures: { v1: $.data.id, v1_v: $.data.version }
            - call: "POST /vote-by-mail/voters"
              payload: { full_name: "Nadia Cole", party_affiliation: "DEM", residence_address: "3 Cedar St", last_signature_update_at: "2026-01-05T00:00:00Z", signature_on_file_count: 1, uocava_status: "OVERSEAS" }
              as: ElectionsClerk
              captures: { v2: $.data.id, v2_v: $.data.version }
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v1}", election_id: "${e1}", request_channel: "ONLINE", delivery_method: "MAIL", expected_voter_version: "${v1_v}" }
              as: ElectionsClerk
              captures: { br1: $.data.id }
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v2}", election_id: "${e1}", request_channel: "PAPER", delivery_method: "MAIL", expected_voter_version: "${v2_v}" }
              as: ElectionsClerk
              captures: { br2: $.data.id }
            - call: "GET /vote-by-mail/address-verifications"
              payload: { ballot_request_id: "${br1}" }
              as: ElectionsClerk
              captures: { av1: "$.data[0].id" }
            - call: "GET /vote-by-mail/address-verifications"
              payload: { ballot_request_id: "${br2}" }
              as: ElectionsClerk
              captures: { av2: "$.data[0].id" }
            - call: "POST /vote-by-mail/address-verifications/${av1}/results"
              payload: { ncoa_result: "MATCH_SAME" }
              as: ElectionsClerk
            - call: "POST /vote-by-mail/address-verifications/${av2}/results"
              payload: { ncoa_result: "MATCH_SAME" }
              as: ElectionsClerk
            - call: "POST /vote-by-mail/ballot-requests/${br1}/approve"
              payload: {}
              as: ElectionsClerk
            - call: "POST /vote-by-mail/ballot-requests/${br2}/approve"
              payload: {}
              as: ElectionsClerk
            - call: "POST /vote-by-mail/mailing-batches"
              payload: { election_id: "${e1}", batch_type: "UOCAVA", scheduled_send_date: "2026-09-15" }
              as: ElectionsClerk
              captures: { mb1: $.data.id }
            - call: "POST /vote-by-mail/mailing-batches/${mb1}/packets"
              payload: { ballot_request_id: "${br1}", packet_weight_grams: 57 }
              as: ElectionsClerk
              captures: { pk1: $.data.id, pk1_postage: $.data.packet_postage_cents }
            - call: "POST /vote-by-mail/mailing-batches/${mb1}/packets"
              payload: { ballot_request_id: "${br2}", packet_weight_grams: 57 }
              as: ElectionsClerk
              captures: { pk2: $.data.id }
            - call: "POST /vote-by-mail/mailing-batches/${mb1}/seal"
              payload: {}
              as: ElectionsClerk
              captures: { est1: $.data.estimated_postage_cents }
          trigger:
            - call: "GET /vote-by-mail/voters/${v2}"
              payload: {}
              as: ElectionsClerk
              captures: { v2_v_now: $.data.version }
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v2}", election_id: "${e1}", request_channel: "PHONE", delivery_method: "MAIL", expected_voter_version: "${v2_v_now}" }
              as: ElectionsClerk
              captures: { br3: $.data.id }
            - call: "POST /vote-by-mail/mailing-batches/${mb1}/dispatch"
              payload: {}
              as: ElectionsClerk
              captures: { act1: $.data.actual_postage_cents }
            - call: "GET /vote-by-mail/elections/${e1}/accountability"
              payload: {}
              as: ElectionsAdmin
          assert:
            - "${pk1_postage} == 216 — tier-2 outbound 129 + per-packet surcharge round_half_up(129 * 0.15) = 19 + return postage 68"
            - "${est1} == 432 — the ESTIMATED variant summed both QUEUED packets at seal"
            - "${act1} == 216 — the ACTUAL variant at dispatch excluded the packet spoiled by the superseding request"
            - "${est1} - ${act1} == 216 — the two variants diverge by exactly one packet for identical packet data"
            - "GET /vote-by-mail/ballot-packets/${pk2} returns status == \"SPOILED\" and GET /vote-by-mail/ballot-requests/${br2} returns status == \"SUPERSEDED\""
            - "GET /vote-by-mail/elections/${e1}/accountability returns postage_committed_cents == 432 and postage_actual_cents == 216"

  - rule_id: combinatorial_formula
    instances:
      - name: postage_surcharge_rounding_order_pinned_per_packet
        grounds:
          - calculations.postage_assessment
          - entities.BallotPacket.fields.packet_postage_cents
          - entities.MailingBatch.fields.estimated_postage_cents
          - endpoints[POST /vote-by-mail/mailing-batches/{id}/seal]
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order changes the cents. The scaffold pins "round the
          UOCAVA surcharge per packet, then sum": two 57 g UOCAVA packets give 2 * (129 + 19 + 68) = 432,
          whereas the forbidden "sum outbound, then round the surcharge once" order gives
          258 + round_half_up(38.7) + 136 = 433. One cent of difference is the whole test.
        test_recipe:
          setup:
            - "One election with postage_budget_cents 1000000; clock at 2026-09-10T00:00:00Z"
            - "Two OVERSEAS voters, each with one approved MATCH_SAME request, so both packets carry the UOCAVA surcharge and no forwarding endorsement"
            - "One UOCAVA batch in DRAFT holding two 57 g packets"
          setup_api_calls:
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ElectionsAdmin
            - call: "POST /vote-by-mail/elections"
              payload: { name: "General 2026", election_date: "2026-11-03", uocava_send_deadline_date: "2026-09-19", domestic_send_deadline_date: "2026-10-05", return_deadline_at: "2026-11-03T20:00:00Z", postage_budget_cents: 1000000, postmark_grace_days: 7, cure_window_days: 21 }
              as: ElectionsAdmin
              captures: { e1: $.data.id }
            - call: "POST /vote-by-mail/voters"
              payload: { full_name: "Omar Diaz", party_affiliation: "NPP", residence_address: "4 Dogwood St", last_signature_update_at: "2026-01-05T00:00:00Z", signature_on_file_count: 1, uocava_status: "OVERSEAS" }
              as: ElectionsClerk
              captures: { v1: $.data.id, v1_v: $.data.version }
            - call: "POST /vote-by-mail/voters"
              payload: { full_name: "Pia Novak", party_affiliation: "REP", residence_address: "5 Elm St", last_signature_update_at: "2026-01-05T00:00:00Z", signature_on_file_count: 1, uocava_status: "OVERSEAS" }
              as: ElectionsClerk
              captures: { v2: $.data.id, v2_v: $.data.version }
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v1}", election_id: "${e1}", request_channel: "ONLINE", delivery_method: "MAIL", expected_voter_version: "${v1_v}" }
              as: ElectionsClerk
              captures: { br1: $.data.id }
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v2}", election_id: "${e1}", request_channel: "ONLINE", delivery_method: "MAIL", expected_voter_version: "${v2_v}" }
              as: ElectionsClerk
              captures: { br2: $.data.id }
            - call: "GET /vote-by-mail/address-verifications"
              payload: { ballot_request_id: "${br1}" }
              as: ElectionsClerk
              captures: { av1: "$.data[0].id" }
            - call: "GET /vote-by-mail/address-verifications"
              payload: { ballot_request_id: "${br2}" }
              as: ElectionsClerk
              captures: { av2: "$.data[0].id" }
            - call: "POST /vote-by-mail/address-verifications/${av1}/results"
              payload: { ncoa_result: "MATCH_SAME" }
              as: ElectionsClerk
            - call: "POST /vote-by-mail/address-verifications/${av2}/results"
              payload: { ncoa_result: "MATCH_SAME" }
              as: ElectionsClerk
            - call: "POST /vote-by-mail/ballot-requests/${br1}/approve"
              payload: {}
              as: ElectionsClerk
            - call: "POST /vote-by-mail/ballot-requests/${br2}/approve"
              payload: {}
              as: ElectionsClerk
            - call: "POST /vote-by-mail/mailing-batches"
              payload: { election_id: "${e1}", batch_type: "UOCAVA", scheduled_send_date: "2026-09-15" }
              as: ElectionsClerk
              captures: { mb1: $.data.id }
            - call: "POST /vote-by-mail/mailing-batches/${mb1}/packets"
              payload: { ballot_request_id: "${br1}", packet_weight_grams: 57 }
              as: ElectionsClerk
              captures: { pk1: $.data.id, pk1_postage: $.data.packet_postage_cents }
            - call: "POST /vote-by-mail/mailing-batches/${mb1}/packets"
              payload: { ballot_request_id: "${br2}", packet_weight_grams: 57 }
              as: ElectionsClerk
              captures: { pk2: $.data.id, pk2_postage: $.data.packet_postage_cents }
          trigger:
            - call: "POST /vote-by-mail/mailing-batches/${mb1}/seal"
              payload: {}
              as: ElectionsClerk
              captures: { est1: $.data.estimated_postage_cents }
          assert:
            - "${pk1_postage} == 216 and ${pk2_postage} == 216 — the surcharge is rounded to whole cents on each packet before the batch is summed"
            - "${est1} == 432 — the pinned per-packet rounding order"
            - "${est1} != 433 — the sum-then-round order is forbidden and must not be observable"
            - "GET /vote-by-mail/elections/${e1}/accountability returns postage_committed_cents == 432"

      - name: cure_deadline_circular_canvass_length_propagation
        grounds:
          - calculations.cure_deadline_derivation
          - entities.CureNotice.fields.cure_deadline_at
          - entities.CureNotice.fields.canvass_days_at_issue
          - entities.CureNotice.fields.open_cure_count_at_issue
          - entities.Election.fields.canvass_days
          - entities.Election.fields.canvass_lock_at
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order: the cure deadline is
          bounded by the canvass lock, while the canvass length depends on how many cures are open. The
          scaffold pins insert-then-count-then-extend-then-clamp, so the third notice both extends
          Election.canvass_days 17 -> 21 and receives the later deadline, while the two earlier notices
          keep their frozen 2026-11-19T20:00:00Z.
        test_recipe:
          setup:
            - "One election with return_deadline_at 2026-11-03T20:00:00Z and cure_window_days 21, so the raw cure base deadline is 2026-11-24T20:00:00Z and the standard canvass lock is 2026-11-20T20:00:00Z"
            - "Three domestic voters, each with one approved request, one 28 g packet, dispatched 2026-09-10"
            - "Three DROPBOX return envelopes logged 2026-11-03T12:00:00Z (before the return deadline, so all TIMELY)"
            - "Each envelope has one submitted round-1 review with decision MISSING_SIGNATURE, so all three sit in signature_status CURE_REQUIRED"
            - "Clock at 2026-11-04T00:00:00Z; cure notices already issued for envelopes 1 and 2 (open_cure_count == 2, canvass_days still 17)"
          setup_api_calls:
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ElectionsAdmin
            - call: "POST /vote-by-mail/elections"
              payload: { name: "General 2026", election_date: "2026-11-03", uocava_send_deadline_date: "2026-09-19", domestic_send_deadline_date: "2026-10-05", return_deadline_at: "2026-11-03T20:00:00Z", postage_budget_cents: 1000000, postmark_grace_days: 7, cure_window_days: 21 }
              as: ElectionsAdmin
