      - name: corner_conditional_warrant_permits_am_post_only
        claim_type: violation_to_error
        grounds:
          - validations.priority_50.ERR_POST_SHIFT_NOT_PERMITTED
          - validations.priority_50.ERR_POST_NOT_WARRANTED
          - calculations.warrant_determination
        distinguishing_aspect: |
          A CONDITIONAL warrant buys morning coverage only, and the restriction is a
          SEPARATE check from the warrant gate: CONDITIONAL clears
          ERR_POST_NOT_WARRANTED, so a PM post must fail with
          ERR_POST_SHIFT_NOT_PERMITTED (422) and a BOTH post with the same 422, while the
          AM post at the very same intersection activates with 200. Fixture: PC 100,
          AG 80, V 1000 at 30 mph with CP 2 / CS 1 gives
          gap_deficit_ratio 0.2000, exposure 10.0, crash_term 20.0 and
          raw = (9.0 + 10.0 + 20.0) * 1.15 = 44.85, which is below 60.00 but at or above
          40.00 with a pedestrian crash on record -> CONDITIONAL.
        test_recipe:
          setup:
            - "UNCONTROLLED 30 mph intersection with the standard crash pair, studied to 44.85 and finalized CONDITIONAL by a second engineer."
            - "Three PROPOSED posts at that intersection: AM, PM and BOTH."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
