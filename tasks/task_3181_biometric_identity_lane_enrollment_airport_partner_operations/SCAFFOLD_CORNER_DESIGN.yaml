  - section: cross_cutting_layers
    instances:
      - name: change_plan_occ_stale_version_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-change-stale-subscription-version]
        distinguishing_aspect: "change-plan with expected_subscription_version one behind current fails 412 ERR_STALE_VERSION; with the current version it succeeds — two strictly sequential requests, deterministic."
        test_recipe:
          setup:
            - "ACTIVE member with INDIVIDUAL subscription; subscription version captured at creation."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "SYR", name: "Syracuse Hancock", city: "Syracuse", state_code: "NY" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment-centers"
              payload: { airport_id: "${ap_id}", name: "SYR Center", ambassador_capacity: 2 }
              as: OpsAdmin
              captures: { ec_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "occ@x.com", full_name: "Occ Member", date_of_birth: "1990-01-01" }
              as: Member
              captures: { m_id: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${m_id}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "PO000900", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /enrollments/${enr_id}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /enrollments/${enr_id}/complete"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /subscriptions"
              payload: { member_id: "${m_id}", plan: "INDIVIDUAL", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id, sub_v: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub_id}/change-plan"
              payload: { new_plan: "FAMILY", expected_subscription_version: "${sub_v} - 1" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
            - call: "POST /subscriptions/${sub_id}/change-plan"
              payload: { new_plan: "FAMILY", expected_subscription_version: "${sub_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { pending: $.data.pending_plan }
          assert:
            - "${err} == ERR_STALE_VERSION (412) for the stale write"
            - "${pending} == FAMILY for the fresh write (deferred upgrade)"
            - "Subscription.${sub_id}.version == ${sub_v} + 1 after exactly one successful change"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-change-stale-subscription-version]
          - entities.Subscription
        distinguishing_aspect: "Subscription.version starts at 1 and increments by exactly 1 per mutation: after attach-discount then detach-discount the version is 3 regardless of the payload contents."
        test_recipe:
          setup:
            - "ACTIVE member with INDIVIDUAL subscription; airport with an ACTIVE discount."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "PWM", name: "Portland Intl Jetport", city: "Portland", state_code: "ME" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.10, subscription_share_rate: 0.02, monthly_minimum_cents: 10000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
            - call: "POST /partner-agreements/${agr_id}/activate"
              payload: {}
              as: PartnerManager
            - call: "POST /enrollment-centers"
              payload: { airport_id: "${ap_id}", name: "PWM Center", ambassador_capacity: 2 }
              as: OpsAdmin
              captures: { ec_id: $.data.id }
            - call: "POST /partner-discounts"
              payload: { airport_id: "${ap_id}", code: "PWM10", percent_off: 10, max_redemptions: 5, expires_at: "2027-01-01T00:00:00Z" }
              as: PartnerManager
            - call: "POST /members/register"
              payload: { email: "ver@x.com", full_name: "Ver Member", date_of_birth: "1990-01-01" }
              as: Member
              captures: { m_id: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${m_id}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "PV000910", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /enrollments/${enr_id}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /enrollments/${enr_id}/complete"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /subscriptions"
              payload: { member_id: "${m_id}", plan: "INDIVIDUAL", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub_id}/attach-discount"
              payload: { discount_code: "PWM10" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v2: $.data.version }
            - call: "POST /subscriptions/${sub_id}/detach-discount"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { v3: $.data.version }
          assert:
            - "${v1} == 1"
            - "${v2} == 2 after attach-discount"
            - "${v3} == 3 after detach-discount (every mutation increments exactly 1)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: enrollment_completion_visible_immediately_on_member_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Member.PENDING_ENROLLMENT_to_ACTIVE
        distinguishing_aspect: "Immediate consistency: the same request that completes the enrollment flips the member; a follow-up GET in the next request shows status ACTIVE with no delay or staleness window."
        test_recipe:
          setup:
            - "Member with a BIOMETRIC_CAPTURED enrollment at an enrollment center."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "BTV", name: "Burlington Intl", city: "Burlington", state_code: "VT" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment-centers"
              payload: { airport_id: "${ap_id}", name: "BTV Center", ambassador_capacity: 2 }
              as: OpsAdmin
              captures: { ec_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "imm@x.com", full_name: "Imm Member", date_of_birth: "1990-01-01" }
              as: Member
              captures: { m_id: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${m_id}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "PI001000", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /enrollments/${enr_id}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /enrollments/${enr_id}/complete"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /members/${m_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { st: $.data.status }
          assert:
            - "${st} == ACTIVE in the very next request — no eventual-consistency lag"

  # ===========================================================================
  - section: endpoints_stub_exclusions
    instances:
      - name: error_discount_exhausted_boundary
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DISCOUNT_EXHAUSTED]
        excluded_because:
          difficulty_instance: "compensating_invariant / discount_redemption_invariant_attach_detach_never_decrements"
          rationale: "Asserted as the failure path of the named §1.8 instance (third attach rejected ERR_DISCOUNT_EXHAUSTED)."

      - name: error_family_full_boundary
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FAMILY_FULL]
        excluded_because:
          difficulty_instance: "boundary_precision_check / family_group_full_boundary_at_slots_total"
          rationale: "Asserted as the boundary failure of the named §1.8 instance."

      - name: error_capacity_exceeded_and_agreement_not_active_priority
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CAPACITY_EXCEEDED]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_vs_fiscal_lane_open_on_planned_with_capacity_breach"
          rationale: "Dual-failure priority asserted in the named §1.8 instance; the pure capacity path is a degenerate projection of it."

      - name: error_escort_window_expired_boundary
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ESCORT_WINDOW_EXPIRED]
        excluded_because:
          difficulty_instance: "boundary_precision_check / escort_at_exactly_expires_at_allowed_one_minute_later_rejected"
          rationale: "Asserted at the exact boundary in the named §1.8 instance."

      - name: error_event_window_conflict_buffer_semantics
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EVENT_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / venue_event_buffer_arithmetic_adjacent_vs_overlap"
          rationale: "Asserted with padded-window semantics in the named §1.8 instance."

      - name: error_member_not_active_lane_gate
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MEMBER_NOT_ACTIVE]
          - errors[ERR_LANE_NOT_OPEN]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / lane_checkin_blocked_by_member_suspension_and_lane_not_open"
          rationale: "Asserted as the cross-entity gate failure in the named §1.8 instance."
