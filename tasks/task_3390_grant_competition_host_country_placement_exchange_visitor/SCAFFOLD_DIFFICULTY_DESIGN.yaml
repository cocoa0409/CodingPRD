              as_user_id: "po-1"
              captures: { st_b1: $.data.status }
            - call: "POST /exchange/applications/${app_b}/transition"
              payload: { action: "DECLINE" }
              as: Applicant
              as_user_id: "${apl_b}"
            - call: "GET /exchange/country-programs/${cp}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { rem_s2: $.data.slots_remaining }
          assert:
            - "after SELECT: slots_remaining == 0 and consuming == 1 (invariant 0 + 1 == slot_quota 1)"
            - "after A DECLINEs: A.status == DECLINED (compensating release) and B.status == SELECTED (auto-promotion re-consumes), so slots_remaining == 0 again (0 + 1 == 1 — no leak, no double-count)"
            - "after B DECLINEs with no alternate left: slots_remaining == 1 and consuming == 0 (1 + 0 == 1) — the forward select pair is fully compensated"

      - name: award_money_conservation_on_termination
        grounds:
          - calculations.early_termination_reconciliation
          - entities.Grant.fields.earned_cents
          - entities.Grant.fields.repayment_cents
          - entities.Grant.fields.reconciliation_adjustment_cents
        distinguishing_aspect: "Conserved quantity = awarded cents (a different quantity from slots): early termination splits final_total_cents into independently computed earned and repayment parts, and the reconciliation adjustment absorbs the per-month rounding remainder so earned + repayment + adjustment == final_total_cents exactly (353334 + 706668 + (-1) == 1060001)."
        test_recipe:
          setup:
            - "JP program (stipend 300001, travel 100001, health 19999, duration 3): grant with final_total_cents 1060001 ACTIVATEd 2027-09-01. Clock advanced to 2027-10-11 (40 days served)."
          setup_api_calls:
            - *d_cycle
            - call: "POST /exchange/cycles/${cyc}/country-programs"
              payload: { country_code: "JP", slot_quota: 1, min_duration_months: 3, max_duration_months: 12, monthly_stipend_standard_cents: 300001, monthly_stipend_high_cents: 350000, dependent_allowance_monthly_cents: 50000, travel_allowance_cents: 100001, health_benefit_monthly_cents: 19999, language_requirement: "NONE" }
              as: PlatformAdmin
              captures: { cp: $.data.id }
            - *d_open
            - call: "POST /exchange/applicants"
              payload: { full_name: "Zola Mbeki", email: "zola.mbeki@example.com", applicant_type: "INDEPENDENT", citizenship_country_code: "ZA" }
              as: Anonymous
              captures: { apl: $.data.id }
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Fynbos Fire Ecology", project_summary: "Post-fire succession", proposed_duration_months: 3, dependents_count: 0 }
              as: Applicant
              as_user_id: "${apl}"
              captures: { app: $.data.id }
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "SUBMIT" }
              as: Applicant
              as_user_id: "${apl}"
            - *d_score80a
            - *d_score80b
            - *d_close
            - *d_recommend
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "DECIDE", outcome: "SELECT" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { app_v_sel: $.data.version }
            - call: "GET /exchange/applications/${app}/grants"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { gr: $.data.0.id }
            - call: "POST /exchange/applications/${app}/placement-rounds"
              payload: { institution_name: "Kyoto Arts", institution_band: "STANDARD", response_deadline: "2027-03-01T00:00:00Z", expected_application_version: "${app_v_sel}" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { rnd: $.data.id }
            - call: "POST /exchange/placement-rounds/${rnd}/transition"
              payload: { action: "ACCEPT" }
              as: Applicant
              as_user_id: "${apl}"
            - call: "POST /exchange/applications/${app}/grant-confirmation"
              payload: { start_date: "2027-09-01T00:00:00Z", end_date: "2027-12-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { tot: $.data.final_total_cents }
            - *d_clock_orient
            - *d_visa_true
            - *d_clock_start
            - *d_activate
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /exchange/grants/${gr}/transition"
              payload: { action: "TERMINATE", termination_reason: "Medical evacuation" }
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { earned: $.data.earned_cents, repay: $.data.repayment_cents, adj: $.data.reconciliation_adjustment_cents }
          assert:
            - "Grant.${gr}.earned_cents == 353334 (served 1 month at monthly_rate 353334)"
            - "Grant.${gr}.repayment_cents == 706668 (unserved 2 months at the same monthly_rate)"
            - "Grant.${gr}.reconciliation_adjustment_cents == -1 (absorbs the round_half_up remainder of 1060001 / 3)"
            - "INVARIANT: earned_cents + repayment_cents + reconciliation_adjustment_cents == final_total_cents (353334 + 706668 - 1 == 1060001) — no cent is created or destroyed by the terminate/compensate pair"
