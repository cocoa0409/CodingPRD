              as_user_id: "admin-001"
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 1, revenue_share_enabled: false, privacy_min_cohort_size: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_id: $.data.id, posture_row2_draft: $.data.program_posture, integ_0: $.data.integration_status, store_0: $.data.storefront_status }
          trigger:
