  - section: consistency_model
    instances:
      - name: intake_response_immediately_reflects_scored_state
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.TaxReturn]
        distinguishing_aspect: "The POST /tax-returns response already carries the post-scoring status and risk_score (RECEIVED is never observable), and a follow-up GET returns identical values — immediate consistency."
        test_recipe:
          setup: ["Clock 2027-02-01; config MV-IMM (w_bank_product 60, gray 25, hold 50) ACTIVE; taxpayer exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-IMM", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 60, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 25, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000191", full_name: "Immediate", date_of_birth: "1980-01-01" }, as: SystemAdmin, captures: { tp: $.data.id } }
          trigger:
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 60000, bank_product: "REFUND_TRANSFER", bank_account_fingerprint: "fp-imm" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn: $.data.id, stCreate: $.data.status, scoreCreate: $.data.risk_score } }
            - { call: "GET /identity-protection/tax-returns/${rtn}", payload: {}, as: FraudAnalyst, captures: { stGet: $.data.status, scoreGet: $.data.risk_score } }
          assert:
            - "captured stCreate == FILTER_HELD and scoreCreate == 60 in the create response itself"
            - "captured stGet == stCreate and scoreGet == scoreCreate (no read-your-writes lag)"

  - section: calculations
    instances:
      - name: interest_dual_variant_correctness
        claim_type: variant_divergence
        grounds: [calculations.refund_interest]
        excluded_because:
          difficulty_instance: interest_provisional_vs_final_diverge
          rationale: "Variant divergence with exact literals (575 vs 577) is asserted in the named §1.8 instance."
      - name: model_variant_selection_at_intake
        claim_type: variant_selection
        grounds: [calculations.filter_risk_score]
        excluded_because:
          difficulty_instance: risk_score_model_variant_divergence
          rationale: "ACTIVE-config variant selection and its scoring_model_version stamp are asserted in the named §1.8 instance."
      - name: conflict_resolution_adjustment_correctness
        claim_type: correct_result
        grounds: [calculations.dependent_conflict_adjustment]
        excluded_because:
          difficulty_instance: conflict_resolution_conserves_single_credit
          rationale: "Loser adjustment (-200000) and winner-untouched literals are asserted in the named §1.8 instance."
      - name: case_expiry_fraud_cascade
        claim_type: cascade
        grounds: [state_machines.IdentityVerificationCase]
        excluded_because:
          difficulty_instance: case_expiry_fraud_forfeit_cascade
          rationale: "The third-fail expiry cascade through FRAUD_CONFIRMED to FRAUD_FORFEIT resolution is asserted in the named §1.8 instance."
  - section: validations
    instances:
      - name: error_ip_pin_mismatch_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_IP_PIN_MISMATCH]"]
        excluded_because:
          difficulty_instance: ip_pin_safety_beats_duplicate_constraint
          rationale: "ERR_IP_PIN_MISMATCH is the asserted winner of the §1.8 priority-conflict instance."
      - name: error_appointment_capacity_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_APPOINTMENT_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: office_capacity_aggregate_overlap
          rationale: "Capacity rejection and half-open adjacency success are asserted in the named §1.8 instance."
      - name: error_active_report_window_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACTIVE_REPORT_WINDOW]"]
        excluded_because:
          difficulty_instance: report_window_closed_interval_exclusion
          rationale: "Window rejection at day 31 and day 60 is asserted in the named §1.8 instance."
      - name: error_verification_incomplete_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_VERIFICATION_INCOMPLETE]"]
        excluded_because:
          difficulty_instance: release_requires_verified_case
          rationale: "Asserted as the failure path of the named §1.8 instance."
  - section: state_machines
    instances:
      - name: terminal_disbursement_release_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RefundDisbursement, "errors[ERR_ALREADY_TERMINAL]"]
        excluded_because:
          difficulty_instance: terminal_state_beats_amount_mismatch
          rationale: "Second release on a RELEASED disbursement returns ERR_ALREADY_TERMINAL in the named §1.8 instance."
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_current_version_pin_reissue_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pin-reissue-stale-version]"]
        excluded_because:
          difficulty_instance: pin_reissue_conserves_single_active
          rationale: "The happy-path OCC reissue with the current version (and its supersession invariant) is asserted in the named §1.8 instance."
