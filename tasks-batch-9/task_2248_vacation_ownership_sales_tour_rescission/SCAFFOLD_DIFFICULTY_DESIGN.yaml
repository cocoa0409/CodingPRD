# ===========================================================================
# 1.8  Scaffold Difficulty Design (Test Targeting Index)
#      task_2248_vacation_ownership_sales_tour_rescission
#      9 rule_ids / 27 instances. Every numeric literal below was executed
#      against the §1.3 formulas and their constants before being written.
# ===========================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: rescission_deadline_anchor_variant_divergence_fl_vs_hi
        grounds:
          - calculations.rescission_deadline
          - entities.PurchaseAgreement.fields.anchor_mode
          - entities.PurchaseAgreement.fields.rescission_deadline_utc
          - entities.PurchaseAgreement.fields.statutory_rescission_days
        distinguishing_aspect: |
          Two agreements executed at the identical logical instant 2026-08-14T09:00:00Z with
          the identical pos_delivered_at 2026-08-10T10:00:00Z diverge by exactly 7 calendar
          days because FL selects the later_of_anchored variant (anchor 2026-08-14T09:00:00Z,
          10 days -> 2026-08-24T23:59:59.999Z) while HI selects the pos_delivery_anchored
          variant (anchor 2026-08-10T10:00:00Z, 7 days -> 2026-08-17T23:59:59.999Z); this
          instance owns the ANCHOR-SELECTION variant axis of rescission_deadline.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One gallery with concurrent_tour_capacity 4, presentation_minutes 120, buffer_minutes 30, and two ACTIVE representatives."
            - "Two tours for the same prospect at 2026-08-14T07:00:00Z, each checked in to a different representative and driven to a CLEARED, fully-disclosed presentation."
            - "Clock advanced to 2026-08-14T09:00:00Z so both agreements share one executed_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
              payload: { name: "Orlando Sales Gallery", site_code: "ORLGAL", concurrent_tour_capacity: 4, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g1: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Dana Reyes", license_number: "FL-SL-410077", rotation_position: 1 }
              as: GalleryManager
              captures: { r1: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Marco Iyer", license_number: "FL-SL-410078", rotation_position: 2 }
              as: GalleryManager
              captures: { r2: $.data.id }
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: MarketingManager
              captures: { ch1: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: MarketingManager
              captures: { p1: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-14T07:00:00Z" }
              as: MarketingManager
              captures: { b1: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-14T07:00:00Z" }
              as: MarketingManager
              captures: { b2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tour-bookings/${b1}/check-in"
              payload: { issue_incentive_gift: false }
              as: GalleryManager
            - call: "POST /tour-bookings/${b2}/check-in"
              payload: { issue_incentive_gift: false }
              as: GalleryManager
            - call: "POST /sales-presentations"
              payload: { booking_id: "${b1}", recorded_ack_reference: "REC-0001" }
              as: SalesRepresentative
              as_user_id: "${r1}"
              captures: { pr1: $.data.id }
            - call: "POST /disclosure-acknowledgments"
              payload: { presentation_id: "${pr1}", disclosure_code: "RESCISSION_RIGHTS", acknowledged_by_prospect: true, recording_timestamp_offset_seconds: 120 }
              as: SalesRepresentative
              as_user_id: "${r1}"
            - call: "POST /disclosure-acknowledgments"
              payload: { presentation_id: "${pr1}", disclosure_code: "PUBLIC_OFFERING_STATEMENT_DELIVERY", acknowledged_by_prospect: true, recording_timestamp_offset_seconds: 240 }
              as: SalesRepresentative
              as_user_id: "${r1}"
            - call: "POST /disclosure-acknowledgments"
              payload: { presentation_id: "${pr1}", disclosure_code: "NOT_AN_INVESTMENT", acknowledged_by_prospect: true, recording_timestamp_offset_seconds: 360 }
              as: SalesRepresentative
              as_user_id: "${r1}"
            - call: "POST /sales-presentations/${pr1}/review"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /sales-presentations"
              payload: { booking_id: "${b2}", recorded_ack_reference: "REC-0002" }
              as: SalesRepresentative
              as_user_id: "${r2}"
              captures: { pr2: $.data.id }
            - call: "POST /disclosure-acknowledgments"
              payload: { presentation_id: "${pr2}", disclosure_code: "RESCISSION_RIGHTS", acknowledged_by_prospect: true, recording_timestamp_offset_seconds: 120 }
              as: SalesRepresentative
              as_user_id: "${r2}"
            - call: "POST /disclosure-acknowledgments"
              payload: { presentation_id: "${pr2}", disclosure_code: "PUBLIC_OFFERING_STATEMENT_DELIVERY", acknowledged_by_prospect: true, recording_timestamp_offset_seconds: 240 }
              as: SalesRepresentative
              as_user_id: "${r2}"
            - call: "POST /disclosure-acknowledgments"
              payload: { presentation_id: "${pr2}", disclosure_code: "NOT_AN_INVESTMENT", acknowledged_by_prospect: true, recording_timestamp_offset_seconds: 360 }
              as: SalesRepresentative
              as_user_id: "${r2}"
            - call: "POST /sales-presentations/${pr2}/review"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /purchase-agreements"
              payload: { presentation_id: "${pr1}", product_type: "DEEDED_INTEREST", state_code: "FL", purchase_price_cents: 3200000, down_payment_cents: 320000, pos_delivered_at: "2026-08-10T10:00:00Z" }
              as: SalesRepresentative
              as_user_id: "${r1}"
              captures: { a_fl: $.data.id }
            - call: "POST /purchase-agreements"
              payload: { presentation_id: "${pr2}", product_type: "RIGHT_TO_USE", state_code: "HI", purchase_price_cents: 3200000, down_payment_cents: 320000, pos_delivered_at: "2026-08-10T10:00:00Z" }
              as: SalesRepresentative
              as_user_id: "${r2}"
              captures: { a_hi: $.data.id }
          assert:
            - "PurchaseAgreement.${a_fl}.executed_at == 2026-08-14T09:00:00Z"
            - "PurchaseAgreement.${a_hi}.executed_at == 2026-08-14T09:00:00Z"
            - "PurchaseAgreement.${a_fl}.anchor_mode == LATER_OF_EXECUTION_OR_POS"
            - "PurchaseAgreement.${a_fl}.statutory_rescission_days == 10"
            - "PurchaseAgreement.${a_fl}.rescission_anchor_utc == 2026-08-14T09:00:00Z"
            - "PurchaseAgreement.${a_fl}.rescission_deadline_utc == 2026-08-24T23:59:59.999Z"
            - "PurchaseAgreement.${a_fl}.business_day_rolled == false"
            - "PurchaseAgreement.${a_fl}.refund_policy == STATUTORY_FULL"
            - "PurchaseAgreement.${a_hi}.anchor_mode == POS_DELIVERY"
            - "PurchaseAgreement.${a_hi}.statutory_rescission_days == 7"
            - "PurchaseAgreement.${a_hi}.rescission_anchor_utc == 2026-08-10T10:00:00Z"
            - "PurchaseAgreement.${a_hi}.rescission_deadline_utc == 2026-08-17T23:59:59.999Z"
            - "PurchaseAgreement.${a_hi}.business_day_rolled == false"
            - "PurchaseAgreement.${a_hi}.refund_policy == CONTRACTUAL_NET_OF_GIFT"
            - "GET /purchase-agreements/${a_hi}/rescission-window returns anchor_mode POS_DELIVERY and anchor_utc 2026-08-10T10:00:00Z, proving the HI anchor is NOT executed_at"

      - name: refund_settlement_policy_variant_divergence_fl_vs_tx
        grounds:
          - calculations.refund_settlement
          - entities.RefundDisbursement.fields.refund_policy_applied
          - entities.RefundDisbursement.fields.disbursed_amount_cents
