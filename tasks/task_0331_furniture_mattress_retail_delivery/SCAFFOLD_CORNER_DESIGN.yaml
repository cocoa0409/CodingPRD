  - section: endpoints
    instances:
      - name: list_orders_pagination_envelope
        claim_type: Computed read
        grounds:
          - endpoints
          - response_envelope
        distinguishing_aspect: "GET /orders returns response_type array with pagination fields total_count and has_more; default limit 10."
        test_recipe:
          setup: ["At least one order exists for a customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pam List", email: "pam@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
          trigger:
            - call: "GET /orders"
              as: SalesAssociate
          assert:
            - "HTTP status == 200"
            - "response.response_type == array"
            - "response includes total_count and has_more"

      - name: filter_orders_by_customer_id
        claim_type: Standard CRUD
        grounds:
          - endpoints
          - entities.Order.fields.customer_id
        distinguishing_aspect: "GET /orders?customer_id={id} returns only that customer's orders (FK filter), each in the array."
        test_recipe:
          setup: ["Two customers, each with one order."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C One", email: "c1@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { c1_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C Two", email: "c2@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { c2_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c1_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o1_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c2_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
          trigger:
            - call: "GET /orders?customer_id=${c1_id}"
              as: SalesAssociate
              captures: { first_id: "$.data[0].id" }
          assert:
            - "HTTP status == 200"
            - "every returned Order.customer_id == ${c1_id}"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_too_many_open_plans_on_third_approval
        claim_type: Violation to Error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_TOO_MANY_OPEN_PLANS]"
          - entities.Customer.fields.open_financing_count
        distinguishing_aspect: "With MAX_OPEN_PLANS=2, a customer already holding 2 CURRENT plans is blocked at the third approval with ERR_TOO_MANY_OPEN_PLANS (409)."
        test_recipe:
          setup: ["A customer with two APPROVED (CURRENT) financing plans; a third PENDING_APPROVAL plan awaiting approval."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ray Many", email: "ray@x.com", credit_score: 800, monthly_income_cents: 50000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            # plan 1
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o1_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o1_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "GET /orders/${o1_id}"
              as: SalesAssociate
              captures: { o1_v: $.data.version }
            - call: "POST /financing-plans"
              payload: { order_id: "${o1_id}", plan_type: "INSTALLMENT", term_months: 12, expected_order_version: "${o1_v}" }
              as: SalesAssociate
              captures: { fp1_id: $.data.id }
            - call: "POST /financing-plans/${fp1_id}/approve"
              as: StoreManager
            # plan 2
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o2_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o2_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "GET /orders/${o2_id}"
              as: SalesAssociate
              captures: { o2_v: $.data.version }
            - call: "POST /financing-plans"
              payload: { order_id: "${o2_id}", plan_type: "INSTALLMENT", term_months: 12, expected_order_version: "${o2_v}" }
              as: SalesAssociate
              captures: { fp2_id: $.data.id }
            - call: "POST /financing-plans/${fp2_id}/approve"
              as: StoreManager
            # plan 3 pending
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o3_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o3_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "GET /orders/${o3_id}"
              as: SalesAssociate
              captures: { o3_v: $.data.version }
            - call: "POST /financing-plans"
              payload: { order_id: "${o3_id}", plan_type: "INSTALLMENT", term_months: 12, expected_order_version: "${o3_v}" }
              as: SalesAssociate
              captures: { fp3_id: $.data.id }
          trigger:
            - call: "POST /financing-plans/${fp3_id}/approve"
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_TOO_MANY_OPEN_PLANS"

      - name: payoff_attempt_below_balance_returns_payment_below_payoff
        claim_type: Violation to Error
        grounds:
          - state_machines.FinancingPlan.CURRENT_to_PAID_OFF
          - "errors[ERR_PAYMENT_BELOW_PAYOFF]"
        distinguishing_aspect: "Within scope, this error fires only if an implementation treats a payment as a payoff attempt; the scaffold's payments endpoint accepts any positive amount as an in-schedule payment, so this corner is exercised via the documented one-shot payoff rule (amount below the payoff balance is simply posted as a partial payment, never raising ERR_PAYMENT_BELOW_PAYOFF unless a payoff is explicitly requested). Kept as the catalogue's payoff-guard claim."
        excluded_because:
          difficulty_instance: dual_variant_calc / payoff_balance_installment_rebate_vs_lease_no_rebate
          rationale: "Partial in-schedule payments below payoff are exercised by the §1.8 payoff-balance instance (3 partial payments leave a positive payoff); ERR_PAYMENT_BELOW_PAYOFF is the payoff-guard variant of that same CURRENT_to_PAID_OFF transition and needs no separate fixture."

      - name: route_complete_with_unresolved_stops_returns_stops_unresolved
        claim_type: Violation to Error
        grounds:
          - state_machines.DeliveryRoute.LOCKED_to_COMPLETED
          - "errors[ERR_STOPS_UNRESOLVED]"
        distinguishing_aspect: "Completing a LOCKED route that still has a BOOKED stop returns ERR_STOPS_UNRESOLVED (409)."
        test_recipe:
          setup: ["A LOCKED route with one stop still BOOKED (not dispatched/completed)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Sue Buyer", email: "sue@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/pay-in-full"
              as: SalesAssociate
            - call: "POST /orders/${o_id}/confirm"
              as: SalesAssociate
            - call: "POST /delivery-routes"
              payload: { region_code: "NORTH", service_date: "2026-03-01T00:00:00Z", shift_start_minute: 480, shift_end_minute: 1080, capacity_units: 5 }
              as: DeliveryDispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /delivery-stops"
              payload: { route_id: "${route_id}", order_id: "${o_id}", window_start_minute: 600, window_end_minute: 660, expected_route_version: "${route_v}" }
              as: DeliveryDispatcher
            - call: "POST /delivery-routes/${route_id}/lock"
              as: DeliveryDispatcher
          trigger:
            - call: "POST /delivery-routes/${route_id}/complete"
              as: DeliveryDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_STOPS_UNRESOLVED"

      - name: cancel_order_with_active_stop_returns_stop_active
        claim_type: Violation to Error
        grounds:
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - "errors[ERR_STOP_ACTIVE]"
        distinguishing_aspect: "Cancelling a SCHEDULED order that has a BOOKED stop returns ERR_STOP_ACTIVE (409); the stop must be cancelled first."
        test_recipe:
          setup: ["A SCHEDULED order whose stop is BOOKED."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Tom Buyer", email: "tom@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/pay-in-full"
              as: SalesAssociate
            - call: "POST /orders/${o_id}/confirm"
              as: SalesAssociate
            - call: "POST /delivery-routes"
              payload: { region_code: "NORTH", service_date: "2026-03-01T00:00:00Z", shift_start_minute: 480, shift_end_minute: 1080, capacity_units: 5 }
              as: DeliveryDispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /delivery-stops"
              payload: { route_id: "${route_id}", order_id: "${o_id}", window_start_minute: 600, window_end_minute: 660, expected_route_version: "${route_v}" }
              as: DeliveryDispatcher
          trigger:
            - call: "POST /orders/${o_id}/cancel"
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_STOP_ACTIVE"

