        distinguishing_aspect: "REJECTED is terminal on both outbound edges at once: neither a second decision nor a revocation is admissible from it, and the employer's registration_status must remain PENDING_REGISTRATION because a rejected filing never conferred an exemption to take away."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01; ProgramYear 2026 configured"
            - "Ridge Composites (120 employees, WAVE_1) has filed a 401K exemption certification with plan_effective_date 2026-01-01, so coverage_period_end is 2029-01-01"
            - "The program administrator has REJECTED that certification"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
