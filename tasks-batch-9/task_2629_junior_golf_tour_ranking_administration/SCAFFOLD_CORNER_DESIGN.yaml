  # =========================================================================
  # §1.9.8  From Cross-Cutting Complexity Layers
  #   declared layers: optimistic_concurrency, cascading_side_effects,
  #                    ops_run_checkpoint, selector_policy
  # =========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: stale_member_version_blocks_an_assistance_application
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.aid-application-create-stale-member
          - errors.ERR_STALE_MEMBER_VERSION
          - endpoints.POST_aid_applications
        distinguishing_aspect: "A handicap revision bumps Member.version between the client's read and its write, so the application posted with the pre-revision version is refused with 412 ERR_STALE_MEMBER_VERSION and no AidApplication row is created; re-reading the version and resubmitting the identical body succeeds."
        test_recipe:
          setup:
            - "One season and one VERIFIED U17 member m1."
            - "The client reads Member.version as v1, after which TourAdmin posts a handicap revision that advances the version to v1 + 1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v1: $.data.version } }
            - { call: "POST /members/${m1_id}/handicap-revisions", payload: { handicap_index: 3.5, handicap_effective_date: "2026-08-09", handicap_source: "WHS_CLUB", expected_member_version: "${v1}" }, as: TourAdmin, captures: { v2: $.data.version } }
          trigger:
            - { call: "POST /aid-applications", payload: { member_id: "${m1_id}", season_id: "${season_id}", household_income_cents: 1000000, dependents: 1, expected_member_version: "${v1}" }, as: Member, as_user_id: "${m1_id}", captures: { err: $.data.error_id } }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v3: $.data.version } }
            - { call: "POST /aid-applications", payload: { member_id: "${m1_id}", season_id: "${season_id}", household_income_cents: 1000000, dependents: 1, expected_member_version: "${v3}" }, as: Member, as_user_id: "${m1_id}", captures: { a1_id: $.data.id, ast: $.data.status } }
          assert:
            - "${v2} == ${v1} + 1"
            - "trigger 1: http_status == 412"
            - "${err} == ERR_STALE_MEMBER_VERSION"
            - "${v3} == ${v2}"
            - "trigger 3: http_status == 201"
            - "${ast} == SUBMITTED"
            - "AidApplication.${a1_id}.member_id == ${m1_id}"
            - "Member.${m1_id}.handicap_index == 3.5"

      - name: stale_member_version_blocks_a_recruiting_access_request
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.coach-access-grant-create-stale-member
          - errors.ERR_STALE_MEMBER_VERSION
          - endpoints.POST_coach_access_grants
        distinguishing_aspect: "The coach's second request replays the version it observed before its own first request, and because that first request already bumped Member.version the replay is refused with 412 - the first grant therefore stays REQUESTED rather than being superseded by a stale writer."
        test_recipe:
          setup:
            - "One season and one VERIFIED U17 member m1 with publication_opt_in true."
            - "coach-recruit-1 reads Member.version as v1 and successfully requests grant g1, which advances the version to v1 + 1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v1: $.data.version } }
            - { call: "POST /coach-access-grants", payload: { member_id: "${m1_id}", coach_school: "State University", scope: "RESULTS_ONLY", expected_member_version: "${v1}" }, as: Coach, as_user_id: "coach-recruit-1", captures: { g1_id: $.data.id, g1st: $.data.status } }
          trigger:
            - { call: "POST /coach-access-grants", payload: { member_id: "${m1_id}", coach_school: "State University", scope: "FULL_PROFILE", expected_member_version: "${v1}" }, as: Coach, as_user_id: "coach-recruit-1", captures: { err: $.data.error_id } }
            - { call: "GET /coach-access-grants/${g1_id}", payload: {}, as: TourAdmin, captures: { g1after: $.data.status, g1scope: $.data.scope } }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v2: $.data.version } }
          assert:
            - "${g1st} == REQUESTED"
            - "trigger 1: http_status == 412"
            - "${err} == ERR_STALE_MEMBER_VERSION"
            - "${g1after} == REQUESTED"
            - "${g1after} != SUPERSEDED"
            - "${g1scope} == RESULTS_ONLY"
            - "${v2} == ${v1} + 1"

      - name: stale_member_version_blocks_a_second_handicap_revision
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.handicap-revision-stale-member
          - errors.ERR_STALE_MEMBER_VERSION
          - endpoints.POST_members_memberId_handicap_revisions
        distinguishing_aspect: "Two revisions posted with the same observed version leave the member holding the FIRST revision's index (3.5, not 4.1) and version v1 + 1; only after re-reading the version does the second revision land, taking the version to v1 + 2 - so each successful write moves the counter by exactly one."
        test_recipe:
          setup:
            - "One season and one VERIFIED U17 member m1 whose handicap_index is 3.2."
            - "The client reads Member.version once as v1 and reuses it for two consecutive writes."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /members/${m1_id}/handicap-revisions", payload: { handicap_index: 3.5, handicap_effective_date: "2026-08-09", handicap_source: "WHS_CLUB", expected_member_version: "${v1}" }, as: TourAdmin, captures: { hi1: $.data.handicap_index, v2: $.data.version } }
            - { call: "POST /members/${m1_id}/handicap-revisions", payload: { handicap_index: 4.1, handicap_effective_date: "2026-08-09", handicap_source: "STATE_ASSOC", expected_member_version: "${v1}" }, as: RulesOfficial, as_user_id: "official-anna", captures: { err: $.data.error_id } }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { hi2: $.data.handicap_index, hs2: $.data.handicap_source, v3: $.data.version } }
            - { call: "POST /members/${m1_id}/handicap-revisions", payload: { handicap_index: 4.1, handicap_effective_date: "2026-08-09", handicap_source: "STATE_ASSOC", expected_member_version: "${v3}" }, as: RulesOfficial, as_user_id: "official-anna", captures: { hi3: $.data.handicap_index, v4: $.data.version } }
          assert:
            - "trigger 1: http_status == 200"
            - "${hi1} == 3.5"
            - "${v2} == ${v1} + 1"
            - "trigger 2: http_status == 412"
            - "${err} == ERR_STALE_MEMBER_VERSION"
            - "${hi2} == 3.5"
            - "${hs2} == WHS_CLUB"
            - "${v3} == ${v1} + 1"
            - "trigger 4: http_status == 200"
            - "${hi3} == 4.1"
            - "${v4} == ${v1} + 2"

      - name: suspension_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ConductCase.UNDER_REVIEW_to_SANCTIONED
          - state_machines.Member.VERIFIED_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / conduct_suspension_cascade_depth_five
          rationale: "That §1.8 instance verifies all five hops of the deepest declared cascade in one recipe, including the waitlist promotion and the assistance ledger move."

      - name: ranking_run_checkpoint_writes_the_certified_snapshot
        claim_type: ops_run_checkpoint
        grounds:
          - endpoints.POST_seasons_seasonId_ranking_runs
          - calculations.member_ranking_points
        excluded_because:
          difficulty_instance: dual_variant_calc / ranking_provisional_live_diverges_from_certified_run
          rationale: "That §1.8 instance drives the ops-run checkpoint and pins the certified snapshot against the live provisional figures."

      - name: selector_policy_orders_the_field_and_the_waitlist
        claim_type: selector_policy
        grounds:
          - calculations.entry_priority_key
          - state_machines.Entry.WAITLISTED_to_ACCEPTED
        excluded_because:
          difficulty_instance: compensating_invariant / slot_census_conserved_by_withdrawal_answered_with_promotion
          rationale: "That §1.8 instance exercises the selector's promotion path and proves the slot census is conserved across it."

  # =========================================================================
  # §1.9.9  From Consistency Model (immediate)
  # =========================================================================
  - section: consistency model
    instances:

      - name: an_assisted_entry_returns_every_derived_field_in_its_own_response
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - calculations.entry_fee_settlement
          - calculations.season_assistance_ledger
        distinguishing_aspect: "The POST /entries response already carries aid_award_cents 25000, net_fee_due_cents 0 and fee_status AID_COVERED, and the season read taken straight afterwards already shows committed 25000 / available 475000 - no second write, retry or delay is needed for any denormalized field to catch up."
        test_recipe:
          setup:
            - "One season with assistance_budget_cents 500000 and one VERIFIED U17 member m1."
            - "m1's application (household_income_cents 1000000, dependents 1 -> covered_pct 1.00) is APPROVED."
            - "One ENTRY_OPEN U17 REGIONAL tournament t1 with entry_fee_cents 25000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id, av0: $.data.assistance_available_cents, cm0: $.data.assistance_committed_cents } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v1: $.data.version } }
            - { call: "POST /aid-applications", payload: { member_id: "${m1_id}", season_id: "${season_id}", household_income_cents: 1000000, dependents: 1, expected_member_version: "${v1}" }, as: Member, as_user_id: "${m1_id}", captures: { a1_id: $.data.id } }
            - { call: "POST /aid-applications/${a1_id}/decide", payload: { decision: "APPROVED" }, as: TourAdmin, captures: { pct: $.data.covered_pct } }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional U17", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 4, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
          trigger:
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}", aid_application_id: "${a1_id}", request_assistance: true }, as: Member, as_user_id: "${m1_id}", captures: { e1_id: $.data.id, aw: $.data.aid_award_cents, net: $.data.net_fee_due_cents, fs: $.data.fee_status, gross: $.data.gross_fee_cents, est: $.data.entry_status } }
            - { call: "GET /seasons/${season_id}", payload: {}, as: TourAdmin, captures: { av1: $.data.assistance_available_cents, cm1: $.data.assistance_committed_cents, ds1: $.data.assistance_disbursed_cents } }
            - { call: "GET /aid-applications/${a1_id}", payload: {}, as: TourAdmin, captures: { con: $.data.consumed_cents } }
            - { call: "GET /entries/${e1_id}", payload: {}, as: TourAdmin, captures: { aw2: $.data.aid_award_cents, net2: $.data.net_fee_due_cents, fs2: $.data.fee_status } }
          assert:
            - "${av0} == 500000"
            - "${cm0} == 0"
            - "${pct} == 1.00"
            - "trigger 1: http_status == 201"
            - "${gross} == 25000"
            - "${aw} == 25000"
            - "${net} == 0"
            - "${fs} == AID_COVERED"
            - "${est} == APPLIED"
            - "${av1} == 475000"
            - "${cm1} == 25000"
            - "${ds1} == 0"
            - "${con} == 25000"
            - "${aw2} == ${aw}"
            - "${net2} == ${net}"
            - "${fs2} == ${fs}"
