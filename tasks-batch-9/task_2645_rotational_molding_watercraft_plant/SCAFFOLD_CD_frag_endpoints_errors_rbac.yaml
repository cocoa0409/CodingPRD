            - "ProductModel.${pm}.warranty_reserve_cents is still 500000 and warranty_paid_cents is still 0 — returning a claim to the queue moves no money"
            - "the approve call returns status 409 with data.error_id 'ERR_CLAIM_INVALID_STATE', not 'ERR_STORAGE_REVIEW_INCOMPLETE'"
            - "WarrantyClaim.${claim}.claim_status is still 'SUBMITTED' and net_payout_cents is null after the refused approve"
            - "ProductModel.${pm}.version == ${pm_v2} after the refused approve"

      # ---- endpoints corners already asserted by §1.8 -------------------------
      - name: ep_shipment_freight_summary_reports_both_freight_bases
        claim_type: Computed read
        grounds:
          - "endpoints.GET_/shipments/{shipment_id}/freight-summary"
          - calculations.shipment_freight
        excluded_because:
          difficulty_instance: "dual_variant_calc / freight_quote_nested_vs_bill_gross_divergence"
          rationale: "That instance already reads the freight-summary on the same trailer after seal and after delivery, asserting the QUOTED nested basis, the BILLED gross basis and the delta between them field by field; a breadth copy would add no distinct endpoint behaviour."

      - name: ep_molding_cycle_create_selects_the_mold_by_the_ranked_policy
        claim_type: Action endpoint
        grounds:
          - "endpoints.POST_/molding-cycles"
          - calculations.mold_selection
        excluded_because:
          difficulty_instance: "dual_variant_calc / mold_selection_first_attempt_vs_retry_with_exclusions"
          rationale: "That instance already drives POST /molding-cycles twice over a mould pool, asserting which mould the ranked selector binds on the first attempt and which one it binds once exclude_mold_ids removes the winner, which is the whole observable behaviour of this endpoint's selector."

