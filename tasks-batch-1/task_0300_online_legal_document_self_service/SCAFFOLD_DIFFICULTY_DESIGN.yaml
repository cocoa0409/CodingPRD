              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { fin: $.data.0.final_invoice_cents }
          assert:
            - "Order.final_invoice_cents == 15757 (doc 6882 + review 6375 + notary 2500)"

      - name: doc_portion_rounding_order_per_line_then_sum
        grounds:
          - calculations.provisional_pricing
          - calculations.final_pricing
          - entities.Order.fields.provisional_quote_cents
        distinguishing_aspect: |
          MODE (b): nested rounding order is pinned to per-line round-half-up then
          sum. LLC/NY/PREMIUM (3 clauses, 0 extra) yields 7499 + 1499 = 8998;
          summing first then rounding (11998*0.75=8998.5 -> 8999) would diverge by 1 cent.
        test_recipe:
          setup:
            - "PREMIUM plan (included_clause_count 999, subscription_discount 0.25); ACTIVE subscription"
            - "LLC/NY project (state surcharge 1999), 3 mandatory clause templates, assembled (3 clauses, 0 extra)"
          setup_api_calls:
            - call: "POST /legal/subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 0, included_project_credits: 5, included_clause_count: 999, subscription_discount_pct: 0.25, review_discount_pct: 0.40 }
              as: PlatformAdmin
              captures: { plan_prem: $.data.id }
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "L1", document_type: "LLC", state_code: "NY", is_mandatory: true, body_text: "l1" }
              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "L2", document_type: "LLC", state_code: "NY", is_mandatory: true, body_text: "l2" }
              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "L3", document_type: "LLC", state_code: "NY", is_mandatory: true, body_text: "l3" }
              as: PlatformAdmin
            - call: "POST /legal/customers"
              payload: { email: "ny1@x.com", full_name: "NY One", state_of_residence: "NY" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /legal/subscriptions"
              payload: { customer_id: "${cust}", plan_id: "${plan_prem}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "LLC", state_code: "NY", title: "LLC One" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "PUT /legal/document-projects/${proj}/questionnaire"
              payload: { answers: { q1: "a", q2: "a", q3: "a", q4: "a", q5: "a", q6: "a" } }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /legal/document-projects/${proj}/assemble"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /legal/orders?document_project_id=${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { quote: $.data.0.provisional_quote_cents }
          assert:
            - "Order.provisional_quote_cents == 8998 (7499 + 1499 + 0, per-line rounded)"
            - "Order.provisional_quote_cents != 8999 (the sum-then-round result)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: project_revision_cycle_changes_requested_back_to_in_progress
        grounds:
          - state_machines.DocumentProject.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.DocumentProject.CHANGES_REQUESTED_to_IN_PROGRESS
          - state_machines.AttorneyReview.IN_REVIEW_to_CHANGES_REQUESTED
        distinguishing_aspect: |
          On DocumentProject, the machine is cyclic: CHANGES_REQUESTED -> IN_PROGRESS
          reopens the revision loop (a back-edge), distinct from any linear pipeline.
        test_recipe:
          setup:
            - "WILL/CA STANDARD ACTIVE project, addon=true, assembled, review requested + IN_REVIEW + CHANGES_REQUESTED"
          setup_api_calls:
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { plan_std: $.data.id }
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W1", document_type: "WILL", state_code: "CA", is_mandatory: true, body_text: "c1" }
              as: PlatformAdmin
            - call: "POST /legal/customers"
              payload: { email: "ca4@x.com", full_name: "CA Four", state_of_residence: "CA" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /legal/subscriptions"
              payload: { customer_id: "${cust}", plan_id: "${plan_std}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /legal/attorneys"
              payload: { full_name: "Atty CA4", bar_state: "CA" }
              as: PlatformAdmin
              captures: { att: $.data.id }
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "Will Four", attorney_review_addon: true }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "PUT /legal/document-projects/${proj}/questionnaire"
              payload: { answers: { q1: "a", q2: "a", q3: "a", q4: "a", q5: "a", q6: "a", q7: "a", q8: "a" } }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/document-projects/${proj}/assemble"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/attorney-reviews"
              payload: { document_project_id: "${proj}", attorney_id: "${att}", window_start: "2026-03-03T10:00:00.000Z", window_end: "2026-03-03T12:00:00.000Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { review: $.data.id }
            - call: "POST /legal/attorney-reviews/${review}/transition"
              payload: { to_status: "IN_REVIEW" }
              as: Attorney
              as_user_id: "${att}"
            - call: "POST /legal/attorney-reviews/${review}/transition"
              payload: { to_status: "CHANGES_REQUESTED" }
              as: Attorney
              as_user_id: "${att}"
          trigger:
            - call: "POST /legal/document-projects/${proj}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: Customer
              as_user_id: "${cust}"
              captures: { st: $.data.status }
          assert:
            - "Before trigger: DocumentProject.status == CHANGES_REQUESTED"
            - "After trigger: DocumentProject.status == IN_PROGRESS (back-edge taken)"

      - name: attorney_review_branch_approved_vs_changes_requested
        grounds:
          - state_machines.AttorneyReview.IN_REVIEW_to_APPROVED
          - state_machines.AttorneyReview.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.DocumentProject.IN_REVIEW_to_CHANGES_REQUESTED
        distinguishing_aspect: |
          On AttorneyReview (a different entity from DocumentProject), IN_REVIEW forks
          to APPROVED (project -> ASSEMBLED) or CHANGES_REQUESTED (project -> CHANGES_REQUESTED,
          newest revision SUPERSEDED) with divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Two WILL/CA STANDARD ACTIVE projects each assembled with addon, each with a review in IN_REVIEW"
          setup_api_calls:
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { plan_std: $.data.id }
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W1", document_type: "WILL", state_code: "CA", is_mandatory: true, body_text: "c1" }
              as: PlatformAdmin
            - call: "POST /legal/customers"
              payload: { email: "ca5@x.com", full_name: "CA Five", state_of_residence: "CA" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /legal/subscriptions"
              payload: { customer_id: "${cust}", plan_id: "${plan_std}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /legal/attorneys"
              payload: { full_name: "Atty A", bar_state: "CA" }
