# =============================================================================
# Bottled Water Plant & Source Compliance — benchmark seed tables
# =============================================================================

scenario: "Bottled Water Plant & Source Compliance (spring water bottler): source water permit & withdrawal monitoring, treatment train & disinfection validation, source/quality testing frequency & report, bottling line & preform supply, label classification (spring/purified) accuracy, recall & lot traceability, home/office delivery bottle sanitation loop, water-use community reporting"

domain_name: bottled-water-compliance
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation
    - cascading_side_effects
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plant display name" }
      - { name: compliance_posture, type: enum, source: computed, description: "GREEN | WATCH | BREACH — derived per calculation plant_compliance_posture" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by each compliance run" }
      - { name: bottle_gross_pool_units, type: integer, source: computed, description: "Count of bottles with status IN {SANITIZED, FILLED, WITH_CUSTOMER} (gross loop variant)" }
      - { name: bottle_sanitized_pool_units, type: integer, source: computed, description: "Count of bottles with status == SANITIZED only (certified usable variant)" }

  - name: WaterSourcePermit
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: permit_number, type: string, source: input, description: "Regulator-issued permit identifier" }
      - { name: source_classification, type: enum, source: input, description: "SPRING | WELL | MUNICIPAL" }
      - { name: daily_cap_gallons, type: integer, source: input, description: "Max withdrawal per calendar day", constraints: "> 0" }
      - { name: monthly_cap_gallons, type: integer, source: input, description: "Max withdrawal per calendar month", constraints: ">= daily_cap_gallons" }
      - { name: valid_from, type: string, source: input, description: "Permit validity start date (ISO date, inclusive)" }
      - { name: valid_to, type: string, source: input, description: "Permit validity end date (ISO date, inclusive)", constraints: "> valid_from" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | EXPIRED | CLOSED", default: "ACTIVE" }
      - { name: suspension_reason, type: enum, source: system, description: "null | MANUAL | SOURCE_TEST_FAIL | TEST_OVERDUE", default: null }
      - { name: withdrawn_today_provisional_gallons, type: integer, source: computed, description: "Sum of gallons over events with status IN {RECORDED, FINALIZED} whose withdrawal_date == current logical date" }
      - { name: withdrawn_today_certified_gallons, type: integer, source: computed, description: "Sum of gallons over FINALIZED events whose withdrawal_date == current logical date" }
      - { name: withdrawn_month_provisional_gallons, type: integer, source: computed, description: "Sum of gallons over events with status IN {RECORDED, FINALIZED} whose withdrawal_date year-month == current logical year-month" }
      - { name: withdrawn_month_certified_gallons, type: integer, source: computed, description: "Sum of gallons over FINALIZED events whose withdrawal_date year-month == current logical year-month" }

  - name: WithdrawalEvent
    parent: WaterSourcePermit
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> WaterSourcePermit.id; permit this withdrawal posts against" }
      - { name: withdrawal_date, type: string, source: input, description: "Calendar date of withdrawal (ISO date); cap windows key on this date" }
      - { name: gallons, type: integer, source: input, description: "Withdrawn volume", constraints: "> 0" }
      - { name: meter_reading_start_gallons, type: integer, source: input, description: "Cumulative meter at start", constraints: ">= 0" }
      - { name: meter_reading_end_gallons, type: integer, source: input, description: "Cumulative meter at end; end - start MUST equal gallons" }
      - { name: status, type: enum, source: system, description: "RECORDED | FINALIZED | VOIDED", default: "RECORDED" }
      - { name: supersedes_event_id, type: string, source: input, description: "FK -> WithdrawalEvent.id; when present, this event is a correction that voids the referenced event", constraints: "optional" }
      - { name: finalized_at, type: datetime, source: system, description: "Timestamp when compliance run finalized this event; null until FINALIZED" }

  - name: TreatmentRun
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; plant operating the treatment train" }
      - { name: source_permit_id, type: string, source: input, description: "FK -> WaterSourcePermit.id; source feeding this run" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned run window start (no overlap rule applies — multiple trains allowed)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned run window end", constraints: "> scheduled_start" }
      - { name: uv_dose_mj_cm2, type: number, source: input, description: "Recorded UV dose; validation requires >= 40.0" }
      - { name: ozone_ct_mg_min_l, type: number, source: input, description: "Recorded ozone CT; validation requires >= 1.6" }
      - { name: turbidity_ntu, type: number, source: input, description: "Recorded turbidity; validation requires <= 0.3" }
      - { name: micro_pore_micron, type: number, source: input, description: "Recorded microfiltration pore size; SPRING-source runs require <= 0.2" }
      - { name: ro_rejection_pct, type: number, source: input, description: "Recorded RO rejection; non-SPRING-source runs require >= 95.0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | VALIDATED | FAILED | REPROCESSING | CANCELLED", default: "SCHEDULED" }
      - { name: validation_round, type: integer, source: system, default: 0, description: "Increments by 1 on every validate call" }
      - { name: parameters_recorded_by_user_id, type: string, source: system, description: "X-User-ID of the operator who last recorded parameters; null until recorded" }
      - { name: validated_by_user_id, type: string, source: system, description: "X-User-ID of the QAOfficer who last validated; null until validated" }

  - name: LabTest
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: test_type, type: enum, source: input, description: "SOURCE_RAW | FINISHED_PRODUCT | BOTTLE_SANITATION" }
      - { name: subject_permit_id, type: string, source: input, description: "FK -> WaterSourcePermit.id; required iff test_type == SOURCE_RAW", constraints: "optional" }
      - { name: subject_lot_id, type: string, source: input, description: "FK -> ProductionLot.id; required iff test_type == FINISHED_PRODUCT", constraints: "optional" }
      - { name: subject_wash_batch_id, type: string, source: input, description: "FK -> WashBatch.id; required iff test_type == BOTTLE_SANITATION", constraints: "optional" }
      - { name: due_date, type: string, source: input, description: "Due date; default by type: SOURCE_RAW = current+7d, FINISHED_PRODUCT = current+2d, BOTTLE_SANITATION = current+1d", constraints: "optional override" }
      - { name: result, type: enum, source: system, description: "PENDING | PASS | FAIL", default: "PENDING" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DUE | OVERDUE | COMPLETED_PASS | COMPLETED_FAIL", default: "SCHEDULED" }
      - { name: collected_at, type: datetime, source: system, description: "Collection timestamp recorded with the result; null until resulted" }
      - { name: origin, type: enum, source: system, description: "MANUAL | AUTO — AUTO rows are created by cascades or compliance runs", default: "MANUAL" }

  - name: BottlingLine
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: line_code, type: string, source: input, description: "Line identifier (e.g., LINE-1)" }
      - { name: daily_capacity_units, type: integer, source: input, description: "Max bottles per day", constraints: "> 0" }
      - { name: preform_on_hand_units, type: integer, source: system, default: 0, description: "Physical preforms on hand; += accepted_units on delivery acceptance, -= produced_units on lot completion" }
      - { name: preform_reserved_units, type: integer, source: system, default: 0, description: "Preforms reserved by lots in PLANNED or IN_PRODUCTION; invariant: == sum(planned_units) over those lots" }
      - { name: preform_free_units, type: integer, source: computed, description: "= preform_on_hand_units - preform_reserved_units" }
      - { name: preform_reorder_quantity, type: integer, source: computed, description: "= max(0, daily_capacity_units * TARGET_DAYS(2) + preform_reserved_units - preform_on_hand_units - sum(delivered_units of PENDING_QC deliveries)); advisory, see calculation preform_reorder_projection" }

  - name: PreformDelivery
    parent: BottlingLine
    common_fields: true
    fields:
      - { name: line_id, type: string, source: system, description: "FK -> BottlingLine.id; receiving line" }
      - { name: supplier, type: string, source: input, description: "Supplier name" }
      - { name: delivered_units, type: integer, source: input, description: "Units shipped by supplier", constraints: "> 0" }
      - { name: accepted_units, type: integer, source: system, description: "Units passing QC; set on ACCEPTED verdict; null until verdict" }
      - { name: status, type: enum, source: system, description: "PENDING_QC | ACCEPTED | REJECTED", default: "PENDING_QC" }

  - name: ProductionLot
    parent: BottlingLine
    common_fields: true
    fields:
      - { name: line_id, type: string, source: system, description: "FK -> BottlingLine.id; line producing this lot" }
      - { name: treatment_run_id, type: string, source: input, description: "FK -> TreatmentRun.id; the single treatment run reserved for this lot (1:1 among non-CANCELLED lots)" }
      - { name: label_classification, type: enum, source: input, description: "SPRING | PURIFIED" }
      - { name: planned_units, type: integer, source: input, description: "Planned bottles; reserved from line preforms at creation", constraints: "> 0" }
      - { name: produced_units, type: integer, source: system, description: "Actual bottles produced; recorded on completion; null until QA_HOLD" }
      - { name: scheduled_start, type: datetime, source: input, description: "Line window start (half-open interval [start, end))" }
      - { name: scheduled_end, type: datetime, source: input, description: "Line window end", constraints: "> scheduled_start" }
      - { name: status, type: enum, source: system, description: "PLANNED | IN_PRODUCTION | QA_HOLD | RELEASED | REWORK | RECALLED | CANCELLED", default: "PLANNED" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Increments by 1 on each QA_HOLD -> REWORK rejection" }
      - { name: recall_id, type: string, source: system, description: "FK -> RecallEvent.id; set when this lot is recalled; null otherwise" }
      - { name: completed_by_user_id, type: string, source: system, description: "X-User-ID of the ProductionLead who completed the lot; null until QA_HOLD" }
      - { name: released_by_user_id, type: string, source: system, description: "X-User-ID of the user who released the lot; null until RELEASED" }

  - name: RecallEvent
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; plant issuing the recall" }
      - { name: reason, type: string, source: input, description: "Free-text recall reason" }
      - { name: status, type: enum, source: system, description: "INITIATED | RECOVERING | CLOSED", default: "INITIATED" }
      - { name: units_in_scope, type: integer, source: computed, description: "Sum of produced_units over recalled lots, frozen at recall creation" }
      - { name: units_recovered, type: integer, source: system, default: 0, description: "Cumulative recovered units posted via recoveries" }

  - name: ReturnableBottle
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: bottle_code, type: string, source: input, description: "Etched bottle identifier (unique per plant)" }
      - { name: wash_cycle_count, type: integer, source: system, default: 0, description: "Number of PASSED wash batches; increments only on PASSED completion; MAX_WASH_CYCLES = 150" }
      - { name: status, type: enum, source: system, description: "SANITIZED | FILLED | WITH_CUSTOMER | RETURNED_DIRTY | IN_WASH | QUARANTINED | RETIRED", default: "SANITIZED" }
      - { name: last_wash_batch_id, type: string, source: system, description: "FK -> WashBatch.id; most recent PASSED wash batch; null for never-washed new stock" }
      - { name: current_wash_batch_id, type: string, source: system, description: "FK -> WashBatch.id; batch currently washing this bottle; null unless IN_WASH" }
      - { name: last_filled_lot_id, type: string, source: system, description: "FK -> ProductionLot.id; lot this bottle was last filled from; drives recall quarantine" }

  - name: WashBatch
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: washer_unit, type: enum, source: input, description: "WASHER_A | WASHER_B — the physical washer resource for overlap/purge checks" }
      - { name: scheduled_start, type: datetime, source: input, description: "Wash window start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Wash window end", constraints: "> scheduled_start" }
      - { name: rinse_temp_c, type: number, source: input, description: "Recorded rinse temperature on completion; PASS requires >= 71.1" }
      - { name: sanitizer_ppm, type: number, source: input, description: "Recorded sanitizer concentration on completion; PASS requires >= 50.0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RUNNING | PASSED | FAILED | CANCELLED", default: "SCHEDULED" }
      - { name: bottle_count, type: integer, source: computed, description: "Count of bottles with current_wash_batch_id == this batch" }

  - name: CommunityWaterReport
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; reporting plant" }
      - { name: period_year, type: integer, source: input, description: "Report period year (e.g., 2026)" }
      - { name: period_month, type: integer, source: input, description: "Report period month", constraints: "1..12" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED", default: "DRAFT" }
      - { name: total_withdrawn_gallons, type: integer, source: computed, description: "Sum of gallons over FINALIZED events in period across the plant's permits" }
      - { name: total_acre_feet, type: number, source: computed, description: "Per-source rounding-then-sum per calculation community_report_volumes; 3 decimals" }
      - { name: per_source_breakdown, type: array, source: computed, description: "Array of { permit_id, gallons, acre_feet } over the plant's permits, ordered by permit created_at ASC" }
      - { name: addendum_of_report_id, type: string, source: system, description: "FK -> CommunityWaterReport.id; set on the successor DRAFT created by supersede; null otherwise" }
      - { name: published_at, type: datetime, source: system, description: "Timestamp of publication; null until PUBLISHED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: WaterSourcePermit
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/permits/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "permit.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "suspension_reason = MANUAL"
          - "All TreatmentRun rows with source_permit_id == permit.id AND status == SCHEDULED transition to CANCELLED (cascade hop 2)"
          - "Plant.compliance_posture recomputed (permit SUSPENDED forces BREACH) (cascade hop 3)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (SOURCE_RAW LabTest recorded FAIL, or compliance run finds a SOURCE_RAW test OVERDUE by more than 7 days)"
        actor: system
        preconditions: []
        side_effects:
          - "suspension_reason = SOURCE_TEST_FAIL or TEST_OVERDUE respectively"
          - "All TreatmentRun rows with source_permit_id == permit.id AND status == SCHEDULED transition to CANCELLED (cascade hop 2)"
          - "Plant.compliance_posture recomputed (cascade hop 3)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/permits/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "permit.status == SUSPENDED (else ERR_INVALID_STATE)"
          - "No LabTest with test_type == SOURCE_RAW, subject_permit_id == permit.id, status == OVERDUE (else ERR_REINSTATE_BLOCKED)"
          - "The latest COMPLETED_* SOURCE_RAW test for this permit (by collected_at, tie-break created_at ASC) is COMPLETED_PASS, or none has ever completed (else ERR_REINSTATE_BLOCKED)"
        side_effects:
          - "suspension_reason = null"
          - "Plant.compliance_posture recomputed"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (compliance run observes current logical date > valid_to)"
        actor: system
        preconditions: []
        side_effects: ["Plant.compliance_posture recomputed"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (compliance run observes current logical date > valid_to)"
        actor: system
        preconditions: []
        side_effects: ["Plant.compliance_posture recomputed"]
      - from: EXPIRED
        to: CLOSED
        trigger: "POST /api/permits/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "permit.status == EXPIRED (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: WithdrawalEvent
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: FINALIZED
        trigger: "system (compliance run: withdrawal_date < current logical date)"
        actor: system
        preconditions: []
        side_effects:
          - "finalized_at = current logical timestamp"
          - "Permit computed withdrawal aggregates refresh (certified variant now includes this event)"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /api/withdrawal-events/{id}/void"
        actor: SourceMonitor
        preconditions:
          - "event.status == RECORDED (FINALIZED -> ERR_EVENT_ALREADY_FINALIZED; VOIDED -> ERR_INVALID_STATE)"
        side_effects:
          - "Permit.version increments by 1; permit computed withdrawal aggregates refresh"
      - from: RECORDED
        to: VOIDED
        trigger: "system (superseded: a new WithdrawalEvent created with supersedes_event_id == this event)"
        actor: system
        preconditions: []
        side_effects:
          - "Permit computed withdrawal aggregates refresh (superseding event replaces this one in provisional sums)"
      - from: FINALIZED
        to: VOIDED
        trigger: "system (superseded: a new WithdrawalEvent created with supersedes_event_id == this event)"
        actor: system
        preconditions:
          - "No CommunityWaterReport with status == PUBLISHED covers this event's (plant, year-month of withdrawal_date) (else ERR_REPORT_PERIOD_LOCKED)"
        side_effects:
          - "Permit computed withdrawal aggregates refresh (certified variant drops this event)"

  - entity: TreatmentRun
    initial_state: SCHEDULED
    terminal_states: [VALIDATED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/treatment-runs/{id}/start"
        actor: ProductionLead
        preconditions:
          - "run.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "run.source permit status == ACTIVE (else ERR_PERMIT_NOT_ACTIVE)"
        side_effects: []
      - from: REPROCESSING
        to: IN_PROGRESS
        trigger: "POST /api/treatment-runs/{id}/start"
        actor: ProductionLead
        preconditions:
          - "run.status == REPROCESSING (else ERR_INVALID_STATE)"
          - "run.source permit status == ACTIVE (else ERR_PERMIT_NOT_ACTIVE)"
        side_effects: []
      - from: IN_PROGRESS
        to: VALIDATED
        trigger: "POST /api/treatment-runs/{id}/validate"
        actor: QAOfficer
        preconditions:
          - "run.status == IN_PROGRESS (else ERR_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != run.parameters_recorded_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "calculation treatment_validation_verdict evaluates PASS over the recorded parameters"
        side_effects:
          - "validation_round += 1; validated_by_user_id = X-User-ID"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /api/treatment-runs/{id}/validate"
        actor: QAOfficer
        preconditions:
          - "run.status == IN_PROGRESS (else ERR_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != run.parameters_recorded_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "calculation treatment_validation_verdict evaluates FAIL"
        side_effects:
          - "validation_round += 1; validated_by_user_id = X-User-ID"
      - from: FAILED
        to: REPROCESSING
        trigger: "POST /api/treatment-runs/{id}/reprocess"
        actor: ProductionLead
        preconditions:
          - "run.status == FAILED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/treatment-runs/{id}/cancel"
        actor: ProductionLead
        preconditions:
          - "run.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: FAILED
        to: CANCELLED
        trigger: "POST /api/treatment-runs/{id}/cancel"
        actor: ProductionLead
        preconditions:
          - "run.status == FAILED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (source permit transitions ACTIVE -> SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Cascade hop 2 of the permit-suspension chain"

  - entity: LabTest
    initial_state: SCHEDULED
    terminal_states: [COMPLETED_PASS, COMPLETED_FAIL]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system (compliance run: due_date - current logical date <= 3 days AND due_date >= current logical date)"
        actor: system
        preconditions: []
        side_effects: ["Plant.compliance_posture recomputed"]
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system (compliance run: current logical date > due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Plant.compliance_posture recomputed"
          - "If test_type == SOURCE_RAW and overdue by more than 7 days (current logical date > due_date + 7 days): subject permit transitions ACTIVE -> SUSPENDED with suspension_reason == TEST_OVERDUE (cascade hop 2), which cascades further (cascade hop 3+)"
      - from: DUE
        to: OVERDUE
        trigger: "system (compliance run: current logical date > due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Plant.compliance_posture recomputed"
          - "If test_type == SOURCE_RAW and overdue by more than 7 days: subject permit SUSPENDED (TEST_OVERDUE) with the same cascade as the SCHEDULED -> OVERDUE transition"
      - from: SCHEDULED
        to: COMPLETED_PASS
        trigger: "POST /api/lab-tests/{id}/record-result with result == PASS"
        actor: QAOfficer
        preconditions: ["test.status IN {SCHEDULED, DUE, OVERDUE} (else ERR_INVALID_STATE)"]
        side_effects:
          - "result = PASS; collected_at = payload collected_at"
          - "Plant.compliance_posture recomputed"
      - from: DUE
        to: COMPLETED_PASS
        trigger: "POST /api/lab-tests/{id}/record-result with result == PASS"
        actor: QAOfficer
        preconditions: ["test.status IN {SCHEDULED, DUE, OVERDUE} (else ERR_INVALID_STATE)"]
        side_effects:
          - "result = PASS; collected_at = payload collected_at"
          - "Plant.compliance_posture recomputed"
      - from: OVERDUE
        to: COMPLETED_PASS
        trigger: "POST /api/lab-tests/{id}/record-result with result == PASS"
        actor: QAOfficer
        preconditions: ["test.status IN {SCHEDULED, DUE, OVERDUE} (else ERR_INVALID_STATE)"]
        side_effects:
          - "result = PASS; collected_at = payload collected_at"
          - "Plant.compliance_posture recomputed"
      - from: SCHEDULED
        to: COMPLETED_FAIL
        trigger: "POST /api/lab-tests/{id}/record-result with result == FAIL"
        actor: QAOfficer
        preconditions: ["test.status IN {SCHEDULED, DUE, OVERDUE} (else ERR_INVALID_STATE)"]
        side_effects:
          - "result = FAIL; collected_at = payload collected_at"
          - "If test_type == SOURCE_RAW: subject permit transitions ACTIVE -> SUSPENDED with suspension_reason == SOURCE_TEST_FAIL (cascade hop 2), cascading further (hop 3+)"
          - "Plant.compliance_posture recomputed"
      - from: DUE
        to: COMPLETED_FAIL
        trigger: "POST /api/lab-tests/{id}/record-result with result == FAIL"
        actor: QAOfficer
        preconditions: ["test.status IN {SCHEDULED, DUE, OVERDUE} (else ERR_INVALID_STATE)"]
        side_effects:
          - "result = FAIL; collected_at = payload collected_at"
          - "If test_type == SOURCE_RAW: subject permit SUSPENDED (SOURCE_TEST_FAIL) with the same cascade"
          - "Plant.compliance_posture recomputed"
      - from: OVERDUE
        to: COMPLETED_FAIL
        trigger: "POST /api/lab-tests/{id}/record-result with result == FAIL"
        actor: QAOfficer
        preconditions: ["test.status IN {SCHEDULED, DUE, OVERDUE} (else ERR_INVALID_STATE)"]
        side_effects:
          - "result = FAIL; collected_at = payload collected_at"
          - "If test_type == SOURCE_RAW: subject permit SUSPENDED (SOURCE_TEST_FAIL) with the same cascade"
          - "Plant.compliance_posture recomputed"

  - entity: PreformDelivery
    initial_state: PENDING_QC
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING_QC
        to: ACCEPTED
        trigger: "POST /api/preform-deliveries/{id}/qc-verdict with verdict == ACCEPTED"
        actor: QAOfficer
        preconditions:
          - "delivery.status == PENDING_QC (else ERR_INVALID_STATE)"
          - "accepted_units present and 0 < accepted_units <= delivered_units (else ERR_INVALID_REQUEST)"
        side_effects:
          - "BottlingLine.preform_on_hand_units += accepted_units (cascade hop 2, ledger sync)"
          - "BottlingLine.version increments by 1"
      - from: PENDING_QC
        to: REJECTED
        trigger: "POST /api/preform-deliveries/{id}/qc-verdict with verdict == REJECTED"
        actor: QAOfficer
        preconditions:
          - "delivery.status == PENDING_QC (else ERR_INVALID_STATE)"
        side_effects:
          - "accepted_units = 0; line inventory unchanged"
          - "BottlingLine.version increments by 1"

  - entity: ProductionLot
    initial_state: PLANNED
    terminal_states: [RECALLED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PRODUCTION
        trigger: "POST /api/production-lots/{id}/start"
        actor: ProductionLead
        preconditions:
          - "lot.status == PLANNED (else ERR_INVALID_STATE)"
          - "Plant.compliance_posture != BREACH (else ERR_POSTURE_BREACH)"
        side_effects: []
      - from: IN_PRODUCTION
        to: QA_HOLD
        trigger: "POST /api/production-lots/{id}/complete"
        actor: ProductionLead
        preconditions:
          - "lot.status == IN_PRODUCTION (else ERR_INVALID_STATE)"
          - "0 < produced_units <= planned_units (produced_units > planned_units -> ERR_OVERPRODUCTION; produced_units <= 0 -> ERR_INVALID_REQUEST)"
        side_effects:
          - "lot.produced_units = payload; completed_by_user_id = X-User-ID"
          - "BottlingLine.preform_on_hand_units -= produced_units; BottlingLine.preform_reserved_units -= planned_units (reservation released, consumption booked) (cascade hop 2, ledger sync); BottlingLine.version increments by 1"
          - "Auto-create LabTest(test_type == FINISHED_PRODUCT, subject_lot_id == lot.id, due_date == current logical date + 2 days, origin == AUTO) (cascade hop 3)"
      - from: QA_HOLD
        to: RELEASED
        trigger: "POST /api/production-lots/{id}/release"
        actor: "QAOfficer | ProductionLead"
        preconditions:
          - "lot.status == QA_HOLD (else ERR_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != lot.completed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "lot.treatment_run_id run status == VALIDATED (else ERR_TREATMENT_NOT_VALIDATED)"
          - "A LabTest with test_type == FINISHED_PRODUCT, subject_lot_id == lot.id, status == COMPLETED_PASS exists (else ERR_PRODUCT_TEST_NOT_PASSED)"
        side_effects:
          - "released_by_user_id = X-User-ID"
      - from: QA_HOLD
        to: REWORK
        trigger: "POST /api/production-lots/{id}/reject"
        actor: QAOfficer
        preconditions:
          - "lot.status == QA_HOLD (else ERR_INVALID_STATE)"
        side_effects:
          - "rework_count += 1"
      - from: REWORK
        to: QA_HOLD
        trigger: "POST /api/production-lots/{id}/rework-complete"
        actor: ProductionLead
        preconditions:
          - "lot.status == REWORK (else ERR_INVALID_STATE)"
        side_effects: []
        note: "Revision loop: rework returns the lot to QA_HOLD for a fresh release review; the finished-product test requirement re-applies against any COMPLETED_PASS test on the lot"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/production-lots/{id}/cancel"
        actor: ProductionLead
        preconditions:
          - "lot.status == PLANNED (else ERR_INVALID_STATE)"
        side_effects:
          - "BottlingLine.preform_reserved_units -= planned_units (compensating release of the reservation) (cascade hop 2)"
          - "BottlingLine.version increments by 1"
      - from: RELEASED
        to: RECALLED
        trigger: "system (a RecallEvent is created listing this lot)"
        actor: system
        preconditions: []
        side_effects:
          - "lot.recall_id = the new RecallEvent.id"
          - "Every ReturnableBottle with last_filled_lot_id == lot.id AND status IN {FILLED, WITH_CUSTOMER} transitions to QUARANTINED (cascade hop 3)"

  - entity: RecallEvent
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: RECOVERING
        trigger: "system (first successful POST /api/recalls/{id}/recoveries posting)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECOVERING
        to: CLOSED
        trigger: "POST /api/recalls/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "recall.status == RECOVERING (else ERR_INVALID_STATE)"
          - "units_recovered >= units_in_scope (else ERR_RECOVERY_INCOMPLETE)"
        side_effects:
          - "Every ReturnableBottle in QUARANTINED whose last_filled_lot_id is in this recall's scope transitions to RETURNED_DIRTY (cascade hop 2)"
          - "Plant.compliance_posture recomputed (closing the recall may lift BREACH) (cascade hop 3)"

  - entity: ReturnableBottle
    initial_state: SANITIZED
    terminal_states: [RETIRED]
    transitions:
      - from: SANITIZED
        to: FILLED
        trigger: "POST /api/bottles/{id}/fill"
        actor: ProductionLead
        preconditions:
          - "bottle.status == SANITIZED (else ERR_INVALID_STATE)"
          - "Sanitation gate: bottle.last_wash_batch_id is null (never-washed new stock) OR the LabTest with test_type == BOTTLE_SANITATION AND subject_wash_batch_id == bottle.last_wash_batch_id has status == COMPLETED_PASS (else ERR_SANITATION_TEST_PENDING)"
          - "payload lot exists (else ERR_NOT_FOUND) and lot.plant == bottle.plant via lot.line_id -> BottlingLine.plant_id (else ERR_CROSS_PLANT_REFERENCE)"
          - "lot.status == RELEASED (else ERR_LOT_NOT_RELEASED)"
        side_effects:
          - "bottle.last_filled_lot_id = lot.id"
          - "Plant bottle pool counters recompute (gross pool unchanged, sanitized pool decrements)"
      - from: FILLED
        to: WITH_CUSTOMER
        trigger: "POST /api/bottles/{id}/deliver"
        actor: SanitationLead
        preconditions:
          - "bottle.status == FILLED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: WITH_CUSTOMER
        to: RETURNED_DIRTY
        trigger: "POST /api/bottles/{id}/return"
        actor: SanitationLead
        preconditions:
          - "bottle.status == WITH_CUSTOMER (else ERR_INVALID_STATE)"
        side_effects: ["Plant bottle pool counters recompute (gross pool decrements)"]
      - from: RETURNED_DIRTY
        to: IN_WASH
        trigger: "POST /api/wash-batches/{id}/assign-bottles listing this bottle"
        actor: SanitationLead
        preconditions:
          - "batch.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "bottle.status == RETURNED_DIRTY (else ERR_INVALID_STATE)"
          - "bottle.wash_cycle_count < MAX_WASH_CYCLES (150) (else ERR_BOTTLE_CYCLE_LIMIT)"
          - "bottle.plant == batch.plant (else ERR_CROSS_PLANT_REFERENCE)"
        side_effects:
          - "bottle.current_wash_batch_id = batch.id; batch.bottle_count recomputes"
      - from: IN_WASH
        to: SANITIZED
        trigger: "system (owning wash batch completes with PASS verdict)"
        actor: system
        preconditions: []
        side_effects:
          - "wash_cycle_count += 1; last_wash_batch_id = batch.id; current_wash_batch_id = null"
          - "Plant bottle pool counters recompute (gross and sanitized pools increment)"
      - from: IN_WASH
        to: RETURNED_DIRTY
        trigger: "system (owning wash batch completes with FAIL verdict, or batch is cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "current_wash_batch_id = null; wash_cycle_count NOT incremented"
      - from: FILLED
        to: QUARANTINED
        trigger: "system (a RecallEvent is created covering bottle.last_filled_lot_id)"
        actor: system
        preconditions: []
        side_effects: ["Plant bottle pool counters recompute (gross pool decrements)"]
      - from: WITH_CUSTOMER
        to: QUARANTINED
        trigger: "system (a RecallEvent is created covering bottle.last_filled_lot_id)"
        actor: system
        preconditions: []
        side_effects: ["Plant bottle pool counters recompute (gross pool decrements)"]
      - from: QUARANTINED
        to: RETURNED_DIRTY
        trigger: "system (owning recall closes)"
        actor: system
        preconditions: []
        side_effects: ["Bottle must rewash before any refill (last_wash_batch_id unchanged — its sanitation test still governs the next fill after rewash)"]
      - from: RETURNED_DIRTY
        to: RETIRED
        trigger: "POST /api/bottles/{id}/retire"
        actor: SanitationLead
        preconditions:
          - "bottle.status IN {RETURNED_DIRTY, SANITIZED, QUARANTINED} (else ERR_INVALID_STATE)"
        side_effects: ["Plant bottle pool counters recompute"]
      - from: SANITIZED
        to: RETIRED
        trigger: "POST /api/bottles/{id}/retire"
        actor: SanitationLead
        preconditions:
          - "bottle.status IN {RETURNED_DIRTY, SANITIZED, QUARANTINED} (else ERR_INVALID_STATE)"
        side_effects: ["Plant bottle pool counters recompute"]
      - from: QUARANTINED
        to: RETIRED
        trigger: "POST /api/bottles/{id}/retire"
        actor: SanitationLead
        preconditions:
          - "bottle.status IN {RETURNED_DIRTY, SANITIZED, QUARANTINED} (else ERR_INVALID_STATE)"
        side_effects: ["Plant bottle pool counters recompute"]

  - entity: WashBatch
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /api/wash-batches/{id}/start"
        actor: SanitationLead
        preconditions:
          - "batch.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "No other WashBatch on the same washer_unit with status == RUNNING (else ERR_INVALID_STATE)"
        side_effects: []
      - from: RUNNING
        to: PASSED
        trigger: "POST /api/wash-batches/{id}/complete with passing rinse_temp_c AND sanitizer_ppm"
        actor: SanitationLead
        preconditions:
          - "batch.status == RUNNING (else ERR_INVALID_STATE)"
          - "calculation wash_verdict evaluates PASS (rinse_temp_c >= 71.1 AND sanitizer_ppm >= 50.0)"
        side_effects:
          - "Every assigned bottle transitions IN_WASH -> SANITIZED with wash_cycle_count += 1 and last_wash_batch_id = batch.id (cascade hop 2)"
          - "Auto-create LabTest(test_type == BOTTLE_SANITATION, subject_wash_batch_id == batch.id, due_date == current logical date + 1 day, origin == AUTO) (cascade hop 3)"
      - from: RUNNING
        to: FAILED
        trigger: "POST /api/wash-batches/{id}/complete with failing rinse_temp_c OR sanitizer_ppm"
        actor: SanitationLead
        preconditions:
          - "batch.status == RUNNING (else ERR_INVALID_STATE)"
          - "calculation wash_verdict evaluates FAIL"
        side_effects:
          - "Every assigned bottle transitions IN_WASH -> RETURNED_DIRTY without incrementing wash_cycle_count (cascade hop 2)"
          - "No sanitation LabTest is created"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/wash-batches/{id}/cancel"
        actor: SanitationLead
        preconditions:
          - "batch.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "Every assigned bottle transitions IN_WASH -> RETURNED_DIRTY (compensation), current_wash_batch_id cleared"

  - entity: CommunityWaterReport
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/community-reports/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == DRAFT (else ERR_INVALID_STATE)"
          - "No WithdrawalEvent with status == RECORDED exists for any of the plant's permits with withdrawal_date in the report period (else ERR_UNFINALIZED_WITHDRAWALS)"
        side_effects:
          - "published_at = current logical timestamp"
          - "total_withdrawn_gallons, total_acre_feet, per_source_breakdown recomputed from FINALIZED events at publish time per calculation community_report_volumes"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /api/community-reports/{id}/supersede"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == PUBLISHED (else ERR_INVALID_STATE)"
        side_effects:
          - "Creates a successor CommunityWaterReport (status DRAFT, addendum_of_report_id = this report.id, same period) with totals recomputed from current FINALIZED events; returns the successor"
          - "The period's publication lock is released (no PUBLISHED report covers the period until the successor publishes), so FINALIZED events in the period become supersedable again"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: withdrawal-event-create-stale-permit
    parent_entity: WaterSourcePermit
    write_endpoint: "POST /api/permits/{permitId}/withdrawal-events"
    occ_field: "expected_permit_version"
    description: |
      Recording a WithdrawalEvent against a WaterSourcePermit whose version has
      advanced since the client last observed it is rejected. The client's
      remaining-capacity view is derived from the permit version it read; a
      newer version means another writer has since posted, voided, or
      superseded an event, so the cap check must be re-evaluated against a
      fresh read before this create can proceed.
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412
  - rule_id: preform-delivery-create-stale-line
    parent_entity: BottlingLine
    write_endpoint: "POST /api/bottling-lines/{lineId}/preform-deliveries"
    occ_field: "expected_line_version"
    description: |
      Registering a PreformDelivery against a BottlingLine whose version has
      advanced since the client last observed it is rejected. The receiving
      clerk's on-hand picture is derived from the line version it read; a
      newer version means another write (delivery creation, QC acceptance, lot
      reservation, completion, or cancellation) has since mutated the line
      ledger, so the create must be re-based on a fresh read.
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412
  - rule_id: lot-create-stale-line
    parent_entity: BottlingLine
    write_endpoint: "POST /api/bottling-lines/{lineId}/production-lots"
    occ_field: "expected_line_version"
    description: |
      Creating a ProductionLot against a BottlingLine whose version has
      advanced since the client last observed it is rejected. The reservation
      check consumes preform_free_units derived from the line version the
      client read; a newer version means the free balance has since moved, so
      the create must be re-based on a fresh read.
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: permit_withdrawal_remaining
    trigger: "on WithdrawalEvent create/void/supersede/finalize; read on GET /api/permits/{id}"
    algorithm: aggregation
    formula: |
      Let E(d)   = events with permit_id == permit.id AND status IN {RECORDED, FINALIZED} AND withdrawal_date == d
      Let EF(d)  = events with permit_id == permit.id AND status == FINALIZED AND withdrawal_date == d
      Let E(m)   = events with permit_id == permit.id AND status IN {RECORDED, FINALIZED} AND year_month(withdrawal_date) == m
      Let EF(m)  = events with permit_id == permit.id AND status == FINALIZED AND year_month(withdrawal_date) == m
      withdrawn_today_provisional_gallons  = sum(E(current_date).gallons)
      withdrawn_today_certified_gallons    = sum(EF(current_date).gallons)
      withdrawn_month_provisional_gallons  = sum(E(current_year_month).gallons)
      withdrawn_month_certified_gallons    = sum(EF(current_year_month).gallons)
      remaining_daily_provisional(d)   = daily_cap_gallons   - sum(E(d).gallons)
      remaining_monthly_provisional(m) = monthly_cap_gallons - sum(E(m).gallons)
      CAP ENFORCEMENT (on event create/supersede) uses the PROVISIONAL variant
      keyed on the NEW event's withdrawal_date, EXCLUDING any event being
      superseded in the same request:
        new.gallons <= remaining_daily_provisional(new.withdrawal_date)   else ERR_DAILY_CAP_EXCEEDED
        new.gallons <= remaining_monthly_provisional(year_month(new.withdrawal_date)) else ERR_MONTHLY_CAP_EXCEEDED
      Equality is allowed: a posting that brings the provisional total exactly
      to the cap succeeds (remaining == 0 afterwards); one more gallon fails.
    input_set: "WithdrawalEvent rows of the permit; VOIDED events are excluded from every sum; the supersede target is excluded from the cap-check sum for the request that supersedes it"
    precision: "integer gallons; no rounding"
    variants:
      - name: provisional
        when: "cap enforcement and withdrawn_*_provisional_* display fields"
        difference: "includes RECORDED + FINALIZED events"
      - name: certified
        when: "withdrawn_*_certified_* display fields and community-report source data"
        difference: "includes FINALIZED events only; identical inputs therefore yield a smaller-or-equal number whenever RECORDED rows exist"

  - name: bottle_loop_availability
    trigger: "on any ReturnableBottle status mutation; read on GET /api/plants/{id}"
    algorithm: aggregation
    formula: |
      bottle_gross_pool_units     = count(bottles of plant with status IN {SANITIZED, FILLED, WITH_CUSTOMER})
      bottle_sanitized_pool_units = count(bottles of plant with status == SANITIZED)
    input_set: "ReturnableBottle rows of the plant; RETIRED, RETURNED_DIRTY, IN_WASH, QUARANTINED excluded from both variants"
    precision: "integer counts"
    variants:
      - name: gross_loop
        when: "bottle_gross_pool_units display field"
        difference: "counts SANITIZED + FILLED + WITH_CUSTOMER — every bottle not currently dirty, washing, quarantined, or retired"
      - name: sanitized_only
        when: "bottle_sanitized_pool_units display field"
        difference: "counts SANITIZED only — the certified fillable pool; identical bottle population yields a strictly smaller number whenever any bottle is FILLED or WITH_CUSTOMER"

  - name: treatment_validation_verdict
    trigger: "POST /api/treatment-runs/{id}/validate"
    algorithm: threshold
    formula: |
      # Evaluation order is fixed top-to-bottom; first failing check decides.
      # Boundary semantics are exact: a parameter AT its threshold passes.
      if turbidity_ntu > 0.3:        verdict = FAIL   # 0.3 passes; 0.31 fails
      if uv_dose_mj_cm2 < 40.0:      verdict = FAIL   # 40.0 passes; 39.99 fails
      if ozone_ct_mg_min_l < 1.6:    verdict = FAIL   # 1.6 passes
      if run.source_permit.source_classification == "SPRING":
          if micro_pore_micron > 0.2: verdict = FAIL  # spring branch: micro filter governs; 0.2 passes
      else:
          if ro_rejection_pct is null or ro_rejection_pct < 95.0: verdict = FAIL  # purified branch: RO governs; 95.0 passes
      otherwise: verdict = PASS
    input_set: "the run's five recorded disinfection parameters plus its source permit's source_classification"
    constants:
      UV_DOSE_MIN: 40.0
      OZONE_CT_MIN: 1.6
      TURBIDITY_MAX: 0.3
      MICRO_PORE_MAX_SPRING: 0.2
      RO_REJECTION_MIN_NON_SPRING: 95.0
    precision: "parameters compared exactly as recorded (1-decimal floats); no rounding before comparison"

  - name: community_report_volumes
    trigger: "CommunityWaterReport creation, and again on publish (recompute)"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: convert per source first, then sum.
      for each permit P of the plant (ordered by P.created_at ASC):
          src_gallons[P]  = sum(gallons of FINALIZED WithdrawalEvents with permit_id == P.id
                                and year_month(withdrawal_date) == report period)
          src_acre_feet[P] = round_half_up(src_gallons[P] / GAL_PER_ACRE_FOOT, 3)
      report.total_withdrawn_gallons = sum(src_gallons[P])          # exact integer
      report.total_acre_feet         = round_half_up(sum(src_acre_feet[P]), 3)
      report.per_source_breakdown    = [ {permit_id: P.id, gallons: src_gallons[P], acre_feet: src_acre_feet[P]} ]
      # FORBIDDEN alternative: round_half_up(sum(src_gallons)/GAL_PER_ACRE_FOOT, 3)
      # (sum-then-convert) — produces a different 3rd decimal on some inputs;
      # the per-source-then-sum order above is the contract.
    input_set: "FINALIZED WithdrawalEvent rows whose withdrawal_date falls in (period_year, period_month), grouped by the plant's permits; RECORDED and VOIDED events are excluded"
    constants:
      GAL_PER_ACRE_FOOT: 325851.0
    precision: "acre-feet rounded to 3 decimal places, round_half_up, applied per source BEFORE summation"

  - name: preform_reorder_projection
    trigger: "read on GET /api/bottling-lines/{id}; advisory only"
    algorithm: aggregation
    formula: |
      # EVALUATION ORDER IS PINNED to break the apparent circle
      # (reservations depend on free stock; the reorder depends on reservations):
      #   (1) reserved is a stored ledger field mutated ONLY by lot create/cancel/complete;
      #   (2) free and reorder are derived afterwards from stored fields — never the reverse.
      target_stock_units   = daily_capacity_units * TARGET_DAYS
      inbound_pending_units = sum(delivered_units of PreformDeliveries with line_id == line.id AND status == PENDING_QC)
      reorder_quantity      = max(0, target_stock_units + preform_reserved_units
                                   - preform_on_hand_units - inbound_pending_units)
      preform_free_units    = preform_on_hand_units - preform_reserved_units
      # Lot creation validates against preform_free_units as stored BEFORE any
      # reorder is placed; reorder_quantity never feeds back into free.
    input_set: "the line's stored ledger fields plus its PENDING_QC deliveries"
    constants:
      TARGET_DAYS: 2
    precision: "integer units"

  - name: wash_verdict
    trigger: "POST /api/wash-batches/{id}/complete"
    algorithm: threshold
    formula: |
      # Boundary semantics exact: a parameter AT its threshold passes.
      if rinse_temp_c < 71.1:   verdict = FAIL   # 71.1 passes; 71.09 fails
      if sanitizer_ppm < 50.0:  verdict = FAIL   # 50.0 passes; 49.9 fails
      otherwise:                verdict = PASS
    input_set: "the two parameters recorded on completion"
    constants:
      RINSE_TEMP_MIN_C: 71.1
      SANITIZER_MIN_PPM: 50.0
    precision: "parameters compared exactly as recorded; no rounding before comparison"

  - name: label_eligibility
    trigger: "ProductionLot creation"
    algorithm: constraint_propagation
    formula: |
      if label_classification == "SPRING":
          require run.source_permit.source_classification == "SPRING"   else ERR_LABEL_CLASSIFICATION_MISMATCH
      if label_classification == "PURIFIED":
          require run.source_permit.source_classification != "SPRING"   else ERR_LABEL_CLASSIFICATION_MISMATCH
      # Release-time guarantee: a PURIFIED lot's run can only be VALIDATED via
      # the non-spring branch of treatment_validation_verdict (RO >= 95.0),
      # so the label claim is re-verified implicitly by the release gate.
    input_set: "the lot's label_classification and its treatment run's source permit classification"

  - name: plant_compliance_posture
    trigger: "recomputed synchronously on every mutation of its inputs (permit status, recall status, lab-test status, permit monthly aggregates)"
    algorithm: threshold
    formula: |
      inputs over the plant:
        suspended   = exists WaterSourcePermit with status == SUSPENDED
        open_recall = exists RecallEvent with status IN {INITIATED, RECOVERING}
        overdue_src = exists LabTest with test_type == SOURCE_RAW AND status == OVERDUE
        overdue_any = exists LabTest with status == OVERDUE
        watch_usage = exists WaterSourcePermit with status == ACTIVE AND
                      withdrawn_month_provisional_gallons >= 0.90 * monthly_cap_gallons
      if suspended or open_recall or overdue_src: posture = BREACH
      elif overdue_any or watch_usage:            posture = WATCH
      else:                                       posture = GREEN
      # Boundary: usage exactly AT 90.0% of the monthly cap triggers WATCH (>=).
    input_set: "all WaterSourcePermit, RecallEvent, LabTest rows of the plant and permit provisional monthly aggregates"
    constants:
      WATCH_USAGE_FRACTION: 0.90
    precision: "usage ratio compared as exact integers: withdrawn_month_provisional_gallons * 100 >= 90 * monthly_cap_gallons"

  - name: testing_due_schedule
    trigger: "LabTest creation (manual or auto)"
    algorithm: chronological
    formula: |
      default due_date by test_type, relative to current logical date D:
        SOURCE_RAW:         due_date = D + 7 days   (weekly source monitoring)
        FINISHED_PRODUCT:   due_date = D + 2 days   (per-lot release testing)
        BOTTLE_SANITATION:  due_date = D + 1 day    (per-batch sanitation micro)
      status flips during compliance runs:
        SCHEDULED -> DUE      when current_date <= due_date AND due_date - current_date <= 3 days
        SCHEDULED|DUE -> OVERDUE when current_date > due_date
      auto-scheduling during compliance runs (AUTO origin):
        for each ACTIVE permit, if no SOURCE_RAW LabTest exists with status IN {SCHEDULED, DUE}
        and due_date >= current_date, create one with due_date = current_date + 7 days.
    input_set: "LabTest rows of the plant; permits with status == ACTIVE"
    precision: "whole days; comparisons on calendar dates"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template ids exist, validated left-to-right; body-supplied FK ids (lot_id, bottle_ids, lot_ids, treatment_run_id, source_permit_id, subject_*_id, supersedes_event_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"
  - priority: 4
    category: state
    check: "OCC precondition on OCC-guarded writes: expected_<parent>_version must equal the parent's current version (§1.2.1); checked immediately after existence and before all other state/business checks"
    error_id: ERR_STALE_PERMIT_VERSION | ERR_STALE_LINE_VERSION
    http_status: 412
    applies_to: "POST /api/permits/{permitId}/withdrawal-events, POST /api/bottling-lines/{lineId}/preform-deliveries, POST /api/bottling-lines/{lineId}/production-lots"
  - priority: 5
    category: state
    check: "Target resource is in a state that admits the operation (per state_machines); includes ERR_PERMIT_NOT_ACTIVE for permit-gated writes and ERR_EVENT_ALREADY_FINALIZED for void of a FINALIZED event"
    error_id: ERR_INVALID_STATE | ERR_PERMIT_NOT_ACTIVE | ERR_EVENT_ALREADY_FINALIZED
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "Safety/compliance gates in this fixed sub-order: ERR_SEGREGATION_OF_DUTIES, then ERR_TREATMENT_NOT_VALIDATED, ERR_PRODUCT_TEST_NOT_PASSED, ERR_SANITATION_TEST_PENDING, ERR_LABEL_CLASSIFICATION_MISMATCH, ERR_POSTURE_BREACH, ERR_REINSTATE_BLOCKED"
    error_id: ERR_SEGREGATION_OF_DUTIES | ERR_TREATMENT_NOT_VALIDATED | ERR_PRODUCT_TEST_NOT_PASSED | ERR_SANITATION_TEST_PENDING | ERR_LABEL_CLASSIFICATION_MISMATCH | ERR_POSTURE_BREACH | ERR_REINSTATE_BLOCKED
    http_status: 409
    applies_to: "validate, release, fill, lot-create, lot-start, reinstate endpoints"
  - priority: 7
    category: business_temporal
    check: "Temporal rules: ERR_LINE_WINDOW_CONFLICT (half-open overlap on a line), ERR_WASHER_WINDOW_CONFLICT (overlap on a washer), ERR_WASHER_PURGE_BUFFER (mandatory 30-minute purge between batches on one washer), ERR_WITHDRAWAL_DATE_OUT_OF_WINDOW (withdrawal_date outside [valid_from, valid_to]), ERR_FUTURE_WITHDRAWAL_DATE (withdrawal_date after current logical date), ERR_REPORT_PERIOD_LOCKED (superseding a FINALIZED event whose period is covered by a PUBLISHED report)"
    error_id: ERR_LINE_WINDOW_CONFLICT | ERR_WASHER_WINDOW_CONFLICT | ERR_WASHER_PURGE_BUFFER | ERR_WITHDRAWAL_DATE_OUT_OF_WINDOW | ERR_FUTURE_WITHDRAWAL_DATE | ERR_REPORT_PERIOD_LOCKED
    http_status: 409
    applies_to: "lot-create, wash-batch-create, withdrawal-event-create endpoints"
  - priority: 8
    category: business_referential
    check: "Cross-reference integrity in this fixed sub-order: ERR_CROSS_PLANT_REFERENCE (referenced run/lot/bottle belongs to another plant), ERR_RUN_ALREADY_ASSIGNED (treatment run already referenced by another non-CANCELLED lot), ERR_LOT_NOT_RELEASED (fill against a non-RELEASED lot), ERR_RECALL_LOT_NOT_RELEASED (recall scope containing a non-RELEASED lot), ERR_SUBJECT_TYPE_MISMATCH (lab-test subject fields not matching test_type), ERR_UNFINALIZED_WITHDRAWALS (publish while RECORDED events exist in period), ERR_SUPERSEDE_TARGET_INVALID (supersede target VOIDED or belongs to another permit)"
    error_id: ERR_CROSS_PLANT_REFERENCE | ERR_RUN_ALREADY_ASSIGNED | ERR_LOT_NOT_RELEASED | ERR_RECALL_LOT_NOT_RELEASED | ERR_SUBJECT_TYPE_MISMATCH | ERR_UNFINALIZED_WITHDRAWALS | ERR_SUPERSEDE_TARGET_INVALID
    http_status: 409
    applies_to: "lot-create, fill, recall-create, lab-test-create, report-publish, withdrawal-event-create endpoints"
  - priority: 9
    category: business_constraint
    check: "Capacity/quota/uniqueness in this fixed sub-order: ERR_DAILY_CAP_EXCEEDED, ERR_MONTHLY_CAP_EXCEEDED, ERR_PREFORM_INSUFFICIENT (planned_units > preform_free_units), ERR_BOTTLE_CYCLE_LIMIT (wash_cycle_count >= 150), ERR_DUPLICATE_REPORT_PERIOD (non-SUPERSEDED report exists for plant+period), ERR_EMPTY_RECALL_SCOPE (lot_ids empty), ERR_BOTTLE_CODE_EXISTS (bottle_code reused within a plant among non-RETIRED bottles)"
    error_id: ERR_DAILY_CAP_EXCEEDED | ERR_MONTHLY_CAP_EXCEEDED | ERR_PREFORM_INSUFFICIENT | ERR_BOTTLE_CYCLE_LIMIT | ERR_DUPLICATE_REPORT_PERIOD | ERR_EMPTY_RECALL_SCOPE | ERR_BOTTLE_CODE_EXISTS
    http_status: 409
    applies_to: "withdrawal-event-create, lot-create, assign-bottles, report-create, recall-create, bottle-create endpoints"
  - priority: 10
    category: business_fiscal
    check: "Quantity accounting: ERR_RECOVERY_EXCEEDS_SCOPE (units_recovered + recovered_units > units_in_scope), ERR_RECOVERY_INCOMPLETE (close with units_recovered < units_in_scope), ERR_METER_READING_MISMATCH (meter_reading_end_gallons - meter_reading_start_gallons != gallons), ERR_OVERPRODUCTION (produced_units > planned_units)"
    error_id: ERR_RECOVERY_EXCEEDS_SCOPE | ERR_RECOVERY_INCOMPLETE | ERR_METER_READING_MISMATCH | ERR_OVERPRODUCTION
    http_status: 422
    applies_to: "recoveries, recall-close, withdrawal-event-create, lot-complete endpoints"
  - priority: 11
    category: business_constraint
    check: "Input shape on otherwise-valid requests: required fields present, enums in range, gallons/units > 0, scheduled_end > scheduled_start, monthly_cap_gallons >= daily_cap_gallons, valid_to > valid_from, accepted_units in (0, delivered_units], period_month in 1..12"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock (declared per §1.5 priority ladder rung 3) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. All date comparisons (caps, due dates, expiry, finalization) read this clock."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  - method: POST
    path: "/api/_inject/bottle-wash-cycles"
    description: "Test-driving endpoint: set a ReturnableBottle's wash_cycle_count directly (used to reach the MAX_WASH_CYCLES boundary without 150 loop iterations). No business endpoint may set this field."
    roles: [PlantAdmin]
    code: 200
    input: [bottle_id, wash_cycle_count]
    output: ReturnableBottle
    side_effects: []

  # --- Plant ---
  - method: POST
    path: "/api/plants"
    description: "Create a plant"
    roles: [PlantAdmin]
    code: 201
    input: [name]
    output: Plant
    side_effects: ["compliance_posture=GREEN, ops_run_index=0, bottle pools=0"]

  - method: GET
    path: "/api/plants/{id}"
    description: "Read a plant including computed posture and bottle pool counters"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: []
    output: Plant
    side_effects: []

  - method: POST
    path: "/api/plants/{plantId}/compliance-runs"
    description: "Run the daily compliance checkpoint in pinned order: (1) finalize RECORDED WithdrawalEvents with withdrawal_date < current logical date; (2) flip LabTest SCHEDULED->DUE / ->OVERDUE per testing_due_schedule; (3) auto-schedule SOURCE_RAW tests for ACTIVE permits lacking an upcoming one; (4) suspend permits whose SOURCE_RAW test is OVERDUE by more than 7 days; (5) expire permits past valid_to; (6) recompute plant posture; (7) increment ops_run_index and Plant.version"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: { ops_run_index: integer, events_finalized: integer, tests_flipped: integer, tests_auto_created: integer, permits_suspended: integer, permits_expired: integer, posture: string }
    side_effects: ["WithdrawalEvent RECORDED->FINALIZED", "LabTest status flips + AUTO creations", "permit SUSPENDED/EXPIRED cascades", "posture recompute", "increments Plant.version by 1"]

  # --- WaterSourcePermit ---
  - method: POST
    path: "/api/plants/{plantId}/permits"
    description: "Register a source water permit"
    roles: [ComplianceOfficer]
    code: 201
    input: [permit_number, source_classification, daily_cap_gallons, monthly_cap_gallons, valid_from, valid_to]
    output: WaterSourcePermit
    side_effects: ["status=ACTIVE, aggregates=0"]

  - method: GET
    path: "/api/plants/{plantId}/permits"
    description: "List permits of a plant"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: WaterSourcePermit[]
    side_effects: []

  - method: GET
    path: "/api/permits/{id}"
    description: "Read a permit including the four withdrawal aggregate fields"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: []
    output: WaterSourcePermit
    side_effects: []

  - method: POST
    path: "/api/permits/{id}/suspend"
    description: "Manually suspend a permit (ACTIVE -> SUSPENDED, reason MANUAL)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: WaterSourcePermit
    side_effects: ["SCHEDULED TreatmentRuns on this permit -> CANCELLED", "posture recompute", "increments WaterSourcePermit.version by 1"]

  - method: POST
    path: "/api/permits/{id}/reinstate"
    description: "Reinstate a suspended permit (guarded by overdue/failed source tests)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: WaterSourcePermit
    side_effects: ["suspension_reason=null", "posture recompute", "increments WaterSourcePermit.version by 1"]

  - method: POST
    path: "/api/permits/{id}/close"
    description: "Close an expired permit (EXPIRED -> CLOSED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: WaterSourcePermit
    side_effects: ["increments WaterSourcePermit.version by 1"]

  # --- WithdrawalEvent ---
  - method: POST
    path: "/api/permits/{permitId}/withdrawal-events"
    description: "Record a withdrawal event; when supersedes_event_id is present the referenced RECORDED-or-FINALIZED event is voided and this event replaces it (cap check excludes the superseded target). OCC-guarded on the permit."
    roles: [SourceMonitor]
    code: 201
    input: [withdrawal_date, gallons, meter_reading_start_gallons, meter_reading_end_gallons, expected_permit_version, "supersedes_event_id?"]
    output: WithdrawalEvent
    side_effects: ["status=RECORDED", "superseded target -> VOIDED if supersedes_event_id given", "permit aggregates refresh", "increments WaterSourcePermit.version by 1"]

  - method: GET
    path: "/api/permits/{permitId}/withdrawal-events"
    description: "List withdrawal events of a permit"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: WithdrawalEvent[]
    side_effects: []

  - method: GET
    path: "/api/withdrawal-events/{id}"
    description: "Read a withdrawal event"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: []
    output: WithdrawalEvent
    side_effects: []

  - method: GET
    path: "/api/withdrawal-events"
    description: "List/filter withdrawal events (supports FK reverse lookup by supersedes_event_id)"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["permit_id?", "supersedes_event_id?", "status?", "limit?", "offset?"]
    output: WithdrawalEvent[]
    side_effects: []

  - method: POST
    path: "/api/withdrawal-events/{id}/void"
    description: "Void a RECORDED withdrawal event (compensating action; FINALIZED events must be corrected via supersede instead)"
    roles: [SourceMonitor]
    code: 200
    input: []
    output: WithdrawalEvent
    side_effects: ["status -> VOIDED", "permit aggregates refresh", "increments WaterSourcePermit.version by 1"]

  # --- TreatmentRun ---
  - method: POST
    path: "/api/plants/{plantId}/treatment-runs"
    description: "Schedule a treatment run against a source permit"
    roles: [ProductionLead]
    code: 201
    input: [source_permit_id, scheduled_start, scheduled_end]
    output: TreatmentRun
    side_effects: ["status=SCHEDULED, validation_round=0"]

  - method: GET
    path: "/api/treatment-runs/{id}"
    description: "Read a treatment run"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: []
    output: TreatmentRun
    side_effects: []

  - method: GET
    path: "/api/treatment-runs"
    description: "List/filter treatment runs"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["plant_id?", "source_permit_id?", "status?", "limit?", "offset?"]
    output: TreatmentRun[]
    side_effects: []

  - method: POST
    path: "/api/treatment-runs/{id}/start"
    description: "Start a scheduled or reprocessing run"
    roles: [ProductionLead]
    code: 200
    input: []
    output: TreatmentRun
    side_effects: ["status -> IN_PROGRESS", "increments TreatmentRun.version by 1"]

  - method: POST
    path: "/api/treatment-runs/{id}/record-parameters"
    description: "Record disinfection parameters on an IN_PROGRESS run; records X-User-ID as parameters_recorded_by_user_id"
    roles: [ProductionLead, QAOfficer]
    code: 200
    input: [uv_dose_mj_cm2, ozone_ct_mg_min_l, turbidity_ntu, micro_pore_micron, "ro_rejection_pct?"]
    output: TreatmentRun
    side_effects: ["parameters stored", "parameters_recorded_by_user_id = X-User-ID", "increments TreatmentRun.version by 1"]

  - method: POST
    path: "/api/treatment-runs/{id}/validate"
    description: "Validate the run: computes treatment_validation_verdict; PASS -> VALIDATED, FAIL -> FAILED; enforces segregation of duties against parameters_recorded_by_user_id"
    roles: [QAOfficer]
    code: 200
    input: []
    output: TreatmentRun
    side_effects: ["status -> VALIDATED or FAILED", "validation_round += 1", "validated_by_user_id = X-User-ID", "increments TreatmentRun.version by 1"]

  - method: POST
    path: "/api/treatment-runs/{id}/reprocess"
    description: "Move a FAILED run to REPROCESSING (cycle back to IN_PROGRESS via start)"
    roles: [ProductionLead]
    code: 200
    input: []
    output: TreatmentRun
    side_effects: ["status -> REPROCESSING", "increments TreatmentRun.version by 1"]

  - method: POST
    path: "/api/treatment-runs/{id}/cancel"
    description: "Cancel a SCHEDULED or FAILED run"
    roles: [ProductionLead]
    code: 200
    input: []
    output: TreatmentRun
    side_effects: ["status -> CANCELLED", "increments TreatmentRun.version by 1"]

  # --- LabTest ---
  - method: POST
    path: "/api/plants/{plantId}/lab-tests"
    description: "Schedule a lab test; exactly one subject FK matching test_type is required (SOURCE_RAW -> subject_permit_id, FINISHED_PRODUCT -> subject_lot_id, BOTTLE_SANITATION -> subject_wash_batch_id); due_date defaults per testing_due_schedule"
    roles: [QAOfficer]
    code: 201
    input: [test_type, "subject_permit_id?", "subject_lot_id?", "subject_wash_batch_id?", "due_date?"]
    output: LabTest
    side_effects: ["status=SCHEDULED, result=PENDING, origin=MANUAL", "due_date default by type when omitted"]

  - method: GET
    path: "/api/lab-tests/{id}"
    description: "Read a lab test"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: []
    output: LabTest
    side_effects: []

  - method: GET
    path: "/api/lab-tests"
    description: "List/filter lab tests (supports FK reverse lookups by subject)"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["plant_id?", "subject_permit_id?", "subject_lot_id?", "subject_wash_batch_id?", "test_type?", "status?", "limit?", "offset?"]
    output: LabTest[]
    side_effects: []

  - method: POST
    path: "/api/lab-tests/{id}/record-result"
    description: "Record PASS/FAIL with collection timestamp; FAIL on a SOURCE_RAW test suspends the subject permit (cascade)"
    roles: [QAOfficer]
    code: 200
    input: [result, collected_at]
    output: LabTest
    side_effects: ["status -> COMPLETED_PASS or COMPLETED_FAIL", "SOURCE_RAW FAIL -> permit SUSPENDED (SOURCE_TEST_FAIL) -> SCHEDULED runs CANCELLED -> posture recompute", "posture recompute", "increments LabTest.version by 1"]

  # --- BottlingLine ---
  - method: POST
    path: "/api/plants/{plantId}/bottling-lines"
    description: "Create a bottling line"
    roles: [PlantAdmin]
    code: 201
    input: [line_code, daily_capacity_units]
    output: BottlingLine
    side_effects: ["preform_on_hand_units=0, preform_reserved_units=0"]

  - method: GET
    path: "/api/bottling-lines/{id}"
    description: "Read a bottling line including preform ledger fields"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: []
    output: BottlingLine
    side_effects: []

  - method: GET
    path: "/api/bottling-lines/{lineId}/preform-deliveries"
    description: "List preform deliveries of a line"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PreformDelivery[]
    side_effects: []

  - method: POST
    path: "/api/bottling-lines/{lineId}/preform-deliveries"
    description: "Register an inbound preform delivery (PENDING_QC). OCC-guarded on the line."
    roles: [ProductionLead]
    code: 201
    input: [supplier, delivered_units, expected_line_version]
    output: PreformDelivery
    side_effects: ["status=PENDING_QC", "increments BottlingLine.version by 1"]

  - method: GET
    path: "/api/preform-deliveries/{id}"
    description: "Read a preform delivery"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: []
    output: PreformDelivery
    side_effects: []

  - method: POST
    path: "/api/preform-deliveries/{id}/qc-verdict"
    description: "QC verdict on a pending delivery; ACCEPTED books accepted_units into the line's on-hand ledger"
    roles: [QAOfficer]
    code: 200
    input: [verdict, "accepted_units?"]
    output: PreformDelivery
    side_effects: ["ACCEPTED: BottlingLine.preform_on_hand_units += accepted_units", "status -> ACCEPTED or REJECTED", "increments BottlingLine.version by 1"]

  # --- ProductionLot ---
  - method: POST
    path: "/api/bottling-lines/{lineId}/production-lots"
    description: "Create a PLANNED lot: reserves planned_units preforms, books the half-open line window, checks label eligibility and run assignment. OCC-guarded on the line."
    roles: [ProductionLead]
    code: 201
    input: [treatment_run_id, label_classification, planned_units, scheduled_start, scheduled_end, expected_line_version]
    output: ProductionLot
    side_effects: ["status=PLANNED", "BottlingLine.preform_reserved_units += planned_units", "increments BottlingLine.version by 1"]

  - method: GET
    path: "/api/production-lots/{id}"
    description: "Read a production lot"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: []
    output: ProductionLot
    side_effects: []

  - method: GET
    path: "/api/production-lots"
    description: "List/filter production lots (supports FK reverse lookups by treatment_run_id and recall_id)"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["line_id?", "treatment_run_id?", "recall_id?", "status?", "limit?", "offset?"]
    output: ProductionLot[]
    side_effects: []

  - method: POST
    path: "/api/production-lots/{id}/start"
    description: "Start production (blocked while plant posture is BREACH)"
    roles: [ProductionLead]
    code: 200
    input: []
    output: ProductionLot
    side_effects: ["status -> IN_PRODUCTION", "increments ProductionLot.version by 1"]

  - method: POST
    path: "/api/production-lots/{id}/complete"
    description: "Complete production: books produced_units into preform consumption, releases the reservation, auto-creates the FINISHED_PRODUCT lab test"
    roles: [ProductionLead]
    code: 200
    input: [produced_units]
    output: ProductionLot
    side_effects: ["status -> QA_HOLD", "completed_by_user_id = X-User-ID", "BottlingLine.preform_on_hand_units -= produced_units", "BottlingLine.preform_reserved_units -= planned_units", "increments BottlingLine.version by 1", "auto-create FINISHED_PRODUCT LabTest (due current+2d, AUTO)"]

  - method: POST
    path: "/api/production-lots/{id}/release"
    description: "Release a lot from QA_HOLD (treatment validated + finished-product test passed + segregation of duties)"
    roles: [QAOfficer, ProductionLead]
    code: 200
    input: []
    output: ProductionLot
    side_effects: ["status -> RELEASED", "released_by_user_id = X-User-ID", "increments ProductionLot.version by 1"]

  - method: POST
    path: "/api/production-lots/{id}/reject"
    description: "Reject a lot from QA_HOLD into REWORK (increments rework_count)"
    roles: [QAOfficer]
    code: 200
    input: []
    output: ProductionLot
    side_effects: ["status -> REWORK", "rework_count += 1", "increments ProductionLot.version by 1"]

  - method: POST
    path: "/api/production-lots/{id}/rework-complete"
    description: "Return a REWORK lot to QA_HOLD for fresh review"
    roles: [ProductionLead]
    code: 200
    input: []
    output: ProductionLot
    side_effects: ["status -> QA_HOLD", "increments ProductionLot.version by 1"]

  - method: POST
    path: "/api/production-lots/{id}/cancel"
    description: "Cancel a PLANNED lot (compensating release of the preform reservation)"
    roles: [ProductionLead]
    code: 200
    input: []
    output: ProductionLot
    side_effects: ["status -> CANCELLED", "BottlingLine.preform_reserved_units -= planned_units", "increments BottlingLine.version by 1"]

  # --- RecallEvent ---
  - method: POST
    path: "/api/plants/{plantId}/recalls"
    description: "Initiate a recall over RELEASED lots: lots -> RECALLED, bottles filled from them (FILLED/WITH_CUSTOMER) -> QUARANTINED, units_in_scope frozen to the sum of produced_units"
    roles: [ComplianceOfficer]
    code: 201
    input: [reason, lot_ids]
    output: RecallEvent
    side_effects: ["scope lots -> RECALLED with recall_id set", "affected bottles -> QUARANTINED", "units_in_scope computed", "posture recompute (open recall forces BREACH)"]

  - method: GET
    path: "/api/recalls/{id}"
    description: "Read a recall including units_in_scope and units_recovered"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: []
    output: RecallEvent
    side_effects: []

  - method: GET
    path: "/api/plants/{plantId}/recalls"
    description: "List recalls of a plant"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: RecallEvent[]
    side_effects: []

  - method: POST
    path: "/api/recalls/{id}/recoveries"
    description: "Post recovered units; first posting flips INITIATED -> RECOVERING; may not exceed remaining scope"
    roles: [ComplianceOfficer]
    code: 200
    input: [recovered_units]
    output: RecallEvent
    side_effects: ["units_recovered += recovered_units", "INITIATED -> RECOVERING on first posting", "increments RecallEvent.version by 1"]

  - method: POST
    path: "/api/recalls/{id}/close"
    description: "Close a recall once fully recovered; releases QUARANTINED bottles to RETURNED_DIRTY"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RecallEvent
    side_effects: ["status -> CLOSED", "QUARANTINED bottles of the recall's lots -> RETURNED_DIRTY", "posture recompute", "increments RecallEvent.version by 1"]

  # --- WashBatch ---
  - method: POST
    path: "/api/plants/{plantId}/wash-batches"
    description: "Schedule a wash batch on a washer unit; enforces non-overlap plus a mandatory 30-minute purge buffer against other non-CANCELLED batches on the same washer_unit"
    roles: [SanitationLead]
    code: 201
    input: [washer_unit, scheduled_start, scheduled_end]
    output: WashBatch
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/api/wash-batches/{id}"
    description: "Read a wash batch"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: []
    output: WashBatch
    side_effects: []

  - method: GET
    path: "/api/plants/{plantId}/wash-batches"
    description: "List wash batches of a plant"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: WashBatch[]
    side_effects: []

  - method: POST
    path: "/api/wash-batches/{id}/assign-bottles"
    description: "Assign RETURNED_DIRTY bottles to a SCHEDULED batch (bottles -> IN_WASH; cycle-count limit enforced)"
    roles: [SanitationLead]
    code: 200
    input: [bottle_ids]
    output: WashBatch
    side_effects: ["each bottle -> IN_WASH with current_wash_batch_id set", "bottle_count recompute"]

  - method: POST
    path: "/api/wash-batches/{id}/start"
    description: "Start a scheduled batch (at most one RUNNING batch per washer_unit)"
    roles: [SanitationLead]
    code: 200
    input: []
    output: WashBatch
    side_effects: ["status -> RUNNING", "increments WashBatch.version by 1"]

  - method: POST
    path: "/api/wash-batches/{id}/complete"
    description: "Complete a running batch with rinse/sanitizer readings; PASS sanitizes bottles and auto-creates the BOTTLE_SANITATION test, FAIL returns bottles dirty"
    roles: [SanitationLead]
    code: 200
    input: [rinse_temp_c, sanitizer_ppm]
    output: WashBatch
    side_effects: ["status -> PASSED or FAILED", "bottles IN_WASH -> SANITIZED (count+1) or -> RETURNED_DIRTY", "PASSED: auto-create BOTTLE_SANITATION LabTest (due current+1d, AUTO)", "increments WashBatch.version by 1"]

  - method: POST
    path: "/api/wash-batches/{id}/cancel"
    description: "Cancel a scheduled batch; assigned bottles return to RETURNED_DIRTY"
    roles: [SanitationLead]
    code: 200
    input: []
    output: WashBatch
    side_effects: ["status -> CANCELLED", "assigned bottles -> RETURNED_DIRTY", "increments WashBatch.version by 1"]

  # --- ReturnableBottle ---
  - method: POST
    path: "/api/plants/{plantId}/bottles"
    description: "Register a new returnable bottle (initial state SANITIZED, wash_cycle_count 0 — new stock is certified clean)"
    roles: [SanitationLead]
    code: 201
    input: [bottle_code]
    output: ReturnableBottle
    side_effects: ["status=SANITIZED, wash_cycle_count=0", "plant bottle pools recompute", "rejects duplicate bottle_code among the plant's non-RETIRED bottles (ERR_BOTTLE_CODE_EXISTS)"]

  - method: GET
    path: "/api/bottles/{id}"
    description: "Read a bottle"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: []
    output: ReturnableBottle
    side_effects: []

  - method: GET
    path: "/api/bottles"
    description: "List/filter bottles (supports FK reverse lookups by current_wash_batch_id, last_wash_batch_id, and last_filled_lot_id)"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["plant_id?", "current_wash_batch_id?", "last_wash_batch_id?", "last_filled_lot_id?", "status?", "limit?", "offset?"]
    output: ReturnableBottle[]
    side_effects: []

  - method: POST
    path: "/api/bottles/{id}/fill"
    description: "Fill a SANITIZED bottle from a RELEASED lot of the same plant (sanitation micro test must have passed when the bottle has been washed before)"
    roles: [ProductionLead]
    code: 200
    input: [lot_id]
    output: ReturnableBottle
    side_effects: ["status -> FILLED", "last_filled_lot_id = lot_id", "plant bottle pools recompute", "increments ReturnableBottle.version by 1"]

  - method: POST
    path: "/api/bottles/{id}/deliver"
    description: "Deliver a filled bottle to a home/office customer"
    roles: [SanitationLead]
    code: 200
    input: []
    output: ReturnableBottle
    side_effects: ["status -> WITH_CUSTOMER", "increments ReturnableBottle.version by 1"]

  - method: POST
    path: "/api/bottles/{id}/return"
    description: "Take a bottle back from a customer into the dirty returns pool"
    roles: [SanitationLead]
    code: 200
    input: []
    output: ReturnableBottle
    side_effects: ["status -> RETURNED_DIRTY", "plant bottle pools recompute", "increments ReturnableBottle.version by 1"]

  - method: POST
    path: "/api/bottles/{id}/retire"
    description: "Retire a bottle from RETURNED_DIRTY, SANITIZED, or QUARANTINED"
    roles: [SanitationLead]
    code: 200
    input: []
    output: ReturnableBottle
    side_effects: ["status -> RETIRED", "plant bottle pools recompute", "increments ReturnableBottle.version by 1"]

  # --- CommunityWaterReport ---
  - method: POST
    path: "/api/plants/{plantId}/community-reports"
    description: "Create a DRAFT community water-use report for (period_year, period_month); totals computed from FINALIZED events per community_report_volumes; one non-SUPERSEDED report per plant+period"
    roles: [ComplianceOfficer]
    code: 201
    input: [period_year, period_month]
    output: CommunityWaterReport
    side_effects: ["status=DRAFT", "totals computed at creation"]

  - method: GET
    path: "/api/community-reports/{id}"
    description: "Read a report"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: []
    output: CommunityWaterReport
    side_effects: []

  - method: GET
    path: "/api/community-reports"
    description: "List/filter reports (supports FK reverse lookup by addendum_of_report_id)"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["plant_id?", "addendum_of_report_id?", "status?", "limit?", "offset?"]
    output: CommunityWaterReport[]
    side_effects: []

  - method: POST
    path: "/api/community-reports/{id}/publish"
    description: "Publish a DRAFT report (requires all period withdrawals FINALIZED); recomputes totals at publish time"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CommunityWaterReport
    side_effects: ["status -> PUBLISHED", "published_at set", "totals recomputed", "period publication lock engages", "increments CommunityWaterReport.version by 1"]

  - method: POST
    path: "/api/community-reports/{id}/supersede"
    description: "Supersede a PUBLISHED report: this report -> SUPERSEDED, successor DRAFT created with addendum_of_report_id pointing here and totals recomputed; returns the successor DRAFT"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CommunityWaterReport
    side_effects: ["this report -> SUPERSEDED", "successor DRAFT created (addendum_of_report_id = this id)", "period publication lock releases", "increments CommunityWaterReport.version by 1"]

  # --- Filtered-list GETs (FK reverse-reachability, §1.5 form 2) ---
  - method: GET
    path: "/api/permits"
    description: "List/filter permits across plants"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["plant_id?", "status?", "limit?", "offset?"]
    output: WaterSourcePermit[]
    side_effects: []

  - method: GET
    path: "/api/bottling-lines"
    description: "List/filter bottling lines across plants"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["plant_id?", "limit?", "offset?"]
    output: BottlingLine[]
    side_effects: []

  - method: GET
    path: "/api/preform-deliveries"
    description: "List/filter preform deliveries across lines"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["line_id?", "status?", "limit?", "offset?"]
    output: PreformDelivery[]
    side_effects: []

  - method: GET
    path: "/api/recalls"
    description: "List/filter recalls across plants"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["plant_id?", "status?", "limit?", "offset?"]
    output: RecallEvent[]
    side_effects: []

  - method: GET
    path: "/api/wash-batches"
    description: "List/filter wash batches across plants and washer units"
    roles: [PlantAdmin, SourceMonitor, QAOfficer, ProductionLead, SanitationLead, ComplianceOfficer]
    code: 200
    input: ["plant_id?", "washer_unit?", "status?", "limit?", "offset?"]
    output: WashBatch[]
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed input: missing required field, bad enum, non-positive quantity, inverted date/datetime range" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state that does not admit the operation" }
  - { id: ERR_PERMIT_NOT_ACTIVE, http: 409, condition: "Withdrawal/supersede/run-start attempted against a permit that is not ACTIVE" }
  - { id: ERR_EVENT_ALREADY_FINALIZED, http: 409, condition: "Void attempted on a FINALIZED withdrawal event (must use supersede)" }
  - { id: ERR_STALE_PERMIT_VERSION, http: 412, condition: "expected_permit_version does not match the permit's current version (OCC)" }
  - { id: ERR_STALE_LINE_VERSION, http: 412, condition: "expected_line_version does not match the line's current version (OCC)" }
  - { id: ERR_DAILY_CAP_EXCEEDED, http: 409, condition: "Posting would push the provisional daily total for the event's withdrawal_date over daily_cap_gallons" }
  - { id: ERR_MONTHLY_CAP_EXCEEDED, http: 409, condition: "Posting would push the provisional monthly total for the event's year-month over monthly_cap_gallons" }
  - { id: ERR_WITHDRAWAL_DATE_OUT_OF_WINDOW, http: 409, condition: "withdrawal_date outside the permit's [valid_from, valid_to] window" }
  - { id: ERR_FUTURE_WITHDRAWAL_DATE, http: 409, condition: "withdrawal_date is after the current logical date" }
  - { id: ERR_METER_READING_MISMATCH, http: 422, condition: "meter_reading_end_gallons - meter_reading_start_gallons != gallons" }
  - { id: ERR_SUPERSEDE_TARGET_INVALID, http: 409, condition: "supersedes_event_id references a VOIDED event or an event of another permit" }
  - { id: ERR_REPORT_PERIOD_LOCKED, http: 409, condition: "Superseding a FINALIZED event whose (plant, year-month) is covered by a PUBLISHED community report" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same X-User-ID attempted two segregated steps (record-parameters then validate; complete then release)" }
  - { id: ERR_TREATMENT_NOT_VALIDATED, http: 409, condition: "Lot release while its treatment run is not VALIDATED" }
  - { id: ERR_PRODUCT_TEST_NOT_PASSED, http: 409, condition: "Lot release without a COMPLETED_PASS FINISHED_PRODUCT test for the lot" }
  - { id: ERR_SANITATION_TEST_PENDING, http: 409, condition: "Bottle fill while the bottle's last wash batch lacks a COMPLETED_PASS BOTTLE_SANITATION test" }
  - { id: ERR_LABEL_CLASSIFICATION_MISMATCH, http: 409, condition: "SPRING label on a non-spring source, or PURIFIED label on a SPRING source" }
  - { id: ERR_POSTURE_BREACH, http: 409, condition: "Lot start while plant compliance_posture == BREACH" }
  - { id: ERR_REINSTATE_BLOCKED, http: 409, condition: "Reinstate blocked: overdue SOURCE_RAW test exists, or latest completed SOURCE_RAW test FAILED" }
  - { id: ERR_LINE_WINDOW_CONFLICT, http: 409, condition: "Lot's half-open [scheduled_start, scheduled_end) overlaps another non-CANCELLED lot on the same line" }
  - { id: ERR_WASHER_WINDOW_CONFLICT, http: 409, condition: "Wash batch window overlaps another non-CANCELLED batch on the same washer_unit" }
  - { id: ERR_WASHER_PURGE_BUFFER, http: 409, condition: "Wash batch starts less than 30 minutes after the previous batch's end (or ends less than 30 minutes before the next batch's start) on the same washer_unit" }
  - { id: ERR_PREFORM_INSUFFICIENT, http: 409, condition: "planned_units > line preform_free_units at lot creation" }
  - { id: ERR_OVERPRODUCTION, http: 422, condition: "produced_units > planned_units on lot completion" }
  - { id: ERR_CROSS_PLANT_REFERENCE, http: 409, condition: "Referenced run/lot/bottle belongs to a different plant than the target resource" }
  - { id: ERR_RUN_ALREADY_ASSIGNED, http: 409, condition: "Treatment run already referenced by another non-CANCELLED lot" }
  - { id: ERR_LOT_NOT_RELEASED, http: 409, condition: "Bottle fill against a lot that is not RELEASED" }
  - { id: ERR_RECALL_LOT_NOT_RELEASED, http: 409, condition: "Recall scope contains a lot that is not RELEASED" }
  - { id: ERR_SUBJECT_TYPE_MISMATCH, http: 409, condition: "Lab test subject FKs do not match test_type (exactly one matching subject required)" }
  - { id: ERR_UNFINALIZED_WITHDRAWALS, http: 409, condition: "Report publish while RECORDED (unfinalized) withdrawal events exist in the report period" }
  - { id: ERR_DUPLICATE_REPORT_PERIOD, http: 409, condition: "A non-SUPERSEDED report already exists for this plant + (period_year, period_month)" }
  - { id: ERR_EMPTY_RECALL_SCOPE, http: 422, condition: "Recall created with an empty lot_ids array" }
  - { id: ERR_RECOVERY_EXCEEDS_SCOPE, http: 422, condition: "units_recovered + recovered_units would exceed units_in_scope" }
  - { id: ERR_RECOVERY_INCOMPLETE, http: 409, condition: "Recall close while units_recovered < units_in_scope" }
  - { id: ERR_BOTTLE_CYCLE_LIMIT, http: 409, condition: "Assigning a bottle with wash_cycle_count >= 150 (MAX_WASH_CYCLES) to a wash batch; the bottle must be retired instead" }
  - { id: ERR_BOTTLE_CODE_EXISTS, http: 409, condition: "Registering a bottle whose bottle_code is already used by another non-RETIRED bottle of the same plant" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant administrator: owns plant/line configuration, the logical clock, test-driving injections, and the daily compliance run"
    identity: opaque
    exclusive_operations:
      - "POST /api/plants"
      - "POST /api/plants/{plantId}/bottling-lines"
      - "POST /api/plants/{plantId}/compliance-runs"
      - "POST /api/_clock/set_current_utc"
      - "POST /api/_inject/bottle-wash-cycles"
    shared_operations:
      - "All GET endpoints (read access shared by every role)"
  - name: SourceMonitor
    description: "Source water monitoring technician: records and voids withdrawal events"
    identity: opaque
    exclusive_operations:
      - "POST /api/permits/{permitId}/withdrawal-events"
      - "POST /api/withdrawal-events/{id}/void"
    shared_operations:
      - "All GET endpoints"
  - name: QAOfficer
    description: "Quality assurance officer: validates treatment runs, schedules and results lab tests, QC-verdicts preform deliveries, releases/rejects lots. Segregation of duties: may not validate a run whose parameters they recorded, nor release a lot they completed"
    identity: opaque
    exclusive_operations:
      - "POST /api/treatment-runs/{id}/validate"
      - "POST /api/plants/{plantId}/lab-tests"
      - "POST /api/lab-tests/{id}/record-result"
      - "POST /api/preform-deliveries/{id}/qc-verdict"
      - "POST /api/production-lots/{id}/reject"
    shared_operations:
      - "POST /api/treatment-runs/{id}/record-parameters (shared with ProductionLead)"
      - "POST /api/production-lots/{id}/release (shared with ProductionLead; SoD applies)"
      - "All GET endpoints"
  - name: ProductionLead
    description: "Production lead: schedules and operates treatment runs, registers preform deliveries, creates and runs production lots, fills bottles"
    identity: opaque
    exclusive_operations:
      - "POST /api/plants/{plantId}/treatment-runs"
      - "POST /api/treatment-runs/{id}/start"
      - "POST /api/treatment-runs/{id}/reprocess"
      - "POST /api/treatment-runs/{id}/cancel"
      - "POST /api/bottling-lines/{lineId}/preform-deliveries"
      - "POST /api/bottling-lines/{lineId}/production-lots"
      - "POST /api/production-lots/{id}/start"
      - "POST /api/production-lots/{id}/complete"
      - "POST /api/production-lots/{id}/rework-complete"
      - "POST /api/production-lots/{id}/cancel"
      - "POST /api/bottles/{id}/fill"
    shared_operations:
      - "POST /api/treatment-runs/{id}/record-parameters (shared with QAOfficer)"
      - "POST /api/production-lots/{id}/release (shared with QAOfficer; SoD applies)"
      - "All GET endpoints"
  - name: SanitationLead
    description: "Sanitation lead: owns the returnable-bottle loop and wash batches"
    identity: opaque
    exclusive_operations:
      - "POST /api/plants/{plantId}/wash-batches"
      - "POST /api/wash-batches/{id}/assign-bottles"
      - "POST /api/wash-batches/{id}/start"
      - "POST /api/wash-batches/{id}/complete"
      - "POST /api/wash-batches/{id}/cancel"
      - "POST /api/plants/{plantId}/bottles"
      - "POST /api/bottles/{id}/deliver"
      - "POST /api/bottles/{id}/return"
      - "POST /api/bottles/{id}/retire"
    shared_operations:
      - "All GET endpoints"
  - name: ComplianceOfficer
    description: "Compliance officer: owns permits lifecycle, recalls, and community water reports"
    identity: opaque
    exclusive_operations:
      - "POST /api/plants/{plantId}/permits"
      - "POST /api/permits/{id}/suspend"
      - "POST /api/permits/{id}/reinstate"
      - "POST /api/permits/{id}/close"
      - "POST /api/plants/{plantId}/recalls"
      - "POST /api/recalls/{id}/recoveries"
      - "POST /api/recalls/{id}/close"
      - "POST /api/plants/{plantId}/community-reports"
      - "POST /api/community-reports/{id}/publish"
      - "POST /api/community-reports/{id}/supersede"
    shared_operations:
      - "All GET endpoints"
