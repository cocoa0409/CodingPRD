              as: FinanceOfficer
              as_user_id: "officer_draw_c24"
              captures: { c24_dd_id: $.data.id }
          trigger:
            - call: "POST /drawdowns/${c24_dd_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_c24"
          assert:
