      - name: err_institution_non_compliant_blocks_seal
        claim_type: violation_to_error
        grounds:
          - validations[priority=28]
          - errors[ERR_INSTITUTION_NON_COMPLIANT]
        distinguishing_aspect: "A REPORTED degree cannot seal while the institution's standing is NON_COMPLIANT (one DELINQUENT closed period in the lookback): the seal fails with 422 ERR_INSTITUTION_NON_COMPLIANT and the degree stays REPORTED."
        test_recipe:
          setup:
            - "Institution with agreement to 2027-06-30; period P1 (due 2026-12-20) closes DELINQUENT at 2027-01-04; a student created via a file uploaded in the remedy window and certified late (flipping P1 to LATE would clear NON_COMPLIANT, so the file is uploaded but deliberately left UNCERTIFIED)"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id", cert_uid: "$.data.users[1].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
