  - section: calculations
    instances:
    - name: rating_floor_clamp
      claim_type: correct_result
      grounds:
      - calculations.rating_update
      distinguishing_aspect: 'RATING_FLOOR 100 clamps: established 100-rated P (host club A, white) loses to 800-rated Q; raw delta -1 would give
        99, clamped to exactly 100.'
      test_recipe:
        setup:
        - Season T=4 ACTIVE; P (club A, init 100/25) vs Q (club B, init 800/30); memberships waived; meet IN_PROGRESS; pairing P(white) vs Q(black)
        setup_api_calls:
        - call: POST /api/seasons
          payload:
            name: S
            start_date: '2026-08-01'
            end_date: '2027-05-31'
            dues_deadline: '2026-09-01T00:00:00Z'
            regular_due_cents: 2500
            late_due_cents: 3750
            provisional_game_threshold: 4
            base_rating: 800
            travel_base_cents: 1500
          as: FederationAdmin
          captures:
            sid: $.data.id
        - call: POST /api/seasons/${sid}/activate
          payload: {}
          as: FederationAdmin
        - call: POST /api/clubs
          payload:
            season_id: ${sid}
            name: A
            school_name: A HS
            region_code: NE
            travel_tier: 1
          as: FederationAdmin
          captures:
            club_a: $.data.id
        - call: POST /api/clubs
          payload:
            season_id: ${sid}
            name: B
            school_name: B HS
            region_code: NE
            travel_tier: 1
          as: FederationAdmin
          captures:
            club_b: $.data.id
        - call: POST /api/coaches
          payload:
            club_id: ${club_a}
            full_name: Coach A
            email: ca@x.com
            certification_level: CLUB
          as: FederationAdmin
          captures:
            coach_a: $.data.id
        - call: POST /api/coaches
          payload:
            club_id: ${club_b}
            full_name: Coach B
            email: cb@x.com
            certification_level: CLUB
          as: FederationAdmin
          captures:
            coach_b: $.data.id
        - call: POST /api/players
