          rationale: "POST /signal-ops/corridors/{id}/selection-decision is conditional on both the decision value and the programming-variant score. That §1.8 instance drives the SELECT-at-50.00, SELECT-at-49.99 and DEFER branches, which is the complete conditional surface of the endpoint."

