      - name: stale_venue_version_outranks_the_expired_hold_on_confirm
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_venue_version_at_priority_45_outranks_expired_hold_at_priority_78_on_confirm
          rationale: "The §1.8 instance already violates priority 45 and priority 78 in one confirm call and asserts ERR_STALE_VENUE_VERSION with HTTP 412, then replays with the fresh version to expose ERR_HOLD_EXPIRED; a separate corner probe would repeat it exactly."

      - name: insufficient_window_outranks_the_crew_cap_when_both_are_violated
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / insufficient_turnaround_window_at_priority_74_outranks_crew_cap_excess_at_priority_80
          rationale: "The §1.8 instance opens an order that both overruns crew_headcount_cap and leaves too short a window, asserting ERR_TURNAROUND_WINDOW_INSUFFICIENT; this corner instance would add nothing beyond it."

      - name: tenant_scope_violation_outranks_the_hold_quota_on_hold
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / tenant_scope_violation_at_priority_22_outranks_hold_quota_exhaustion_at_priority_102
          rationale: "The §1.8 instance holds a booking as the wrong AnchorTenantRep on a tenant whose quota is already spent and asserts ERR_TENANT_SCOPE_VIOLATION, covering the widest gap in the ladder."

      - name: condensation_threshold_is_inclusive_at_forty_and_admits_thirty_nine_ninety_nine
        claim_type: satisfaction_to_pass
        excluded_because:
          difficulty_instance: boundary_precision_check / condensation_score_of_exactly_40_00_blocks_covering_while_39_99_passes_on_a_three_hundredths_dehum_change
          rationale: "The §1.8 instance pins both sides of CONDENSATION_BLOCK_THRESHOLD with a three-hundredths change in dehumidification, which is a strictly finer probe of the same rule."

      - name: hold_expiry_is_inclusive_at_the_expiry_instant
        claim_type: satisfaction_to_pass
        excluded_because:
          difficulty_instance: boundary_precision_check / hold_expiry_admits_the_confirm_at_the_exact_expiry_instant_and_refuses_it_one_second_later
          rationale: "The §1.8 instance drives the logical clock to hold_expires_at exactly and then one second past it, covering the <= comparison of priority 78 from both sides."

      - name: dock_gap_of_exactly_the_buffer_is_accepted
        claim_type: satisfaction_to_pass
        excluded_because:
          difficulty_instance: resource_temporal_overlap / dock_windows_accept_a_gap_of_exactly_the_buffer_and_reject_one_minute_less_on_the_same_dock
          rationale: "The §1.8 instance already exercises the buffered half-open arithmetic of priority 70 at the exact buffer and one minute inside it, on the same dock and on a different dock."

      - name: touching_changeover_windows_are_accepted
        claim_type: satisfaction_to_pass
        excluded_because:
          difficulty_instance: resource_temporal_overlap / changeover_windows_reject_a_one_minute_overlap_and_accept_windows_that_merely_touch
          rationale: "The §1.8 instance covers priority 72 at its exact boundary, contrasting a one-minute overlap with windows that share an endpoint."

      - name: equipment_issue_validity_depends_on_the_asset_status
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / equipment_issue_depends_on_the_pool_asset_being_in_service_not_on_unit_availability
          rationale: "The §1.8 instance shows priority 54 firing off the EquipmentAsset row while units are still available, and the same call succeeding once the pool returns to IN_SERVICE — exactly the cross-entity pattern."

      - name: ice_meltout_detects_a_future_ice_event_dependency
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ice_meltout_is_vetoed_by_a_booking_whose_start_sits_exactly_on_the_closed_build_window_edge
          rationale: "The §1.8 instance is the temporal-validation probe for priority 64: the melt-out is legal now but would strand a booking inside the closed build window, and the boundary instant is included."

      - name: rigging_load_is_validated_in_aggregate_over_the_confirmed_peer_set
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rigging_grid_counts_closed_interval_neighbours_that_the_half_open_booking_conflict_ignores
          rationale: "The §1.8 instance confirms individually-legal bookings whose combined suspended load breaches Venue.rigging_capacity_kg, including a neighbour that the half-open conflict rule accepts — the aggregate pattern in full."

      - name: the_covering_condensation_rule_applies_only_to_ice_covering_turnarounds
        claim_type: conditional_validation
        excluded_because:
          difficulty_instance: transitive_cascade / signoff_of_a_covering_changeover_cascades_into_ice_cover_and_then_auto_meltout
          rationale: "The §1.8 instance signs off both a covering turnaround, where priority 62 is evaluated against the ice deck, and a non-covering one where it is skipped, which is the with/without contrast this instance would duplicate."

      - name: the_window_rule_runs_after_the_plan_is_computed
        claim_type: cascading_validation
        excluded_because:
          difficulty_instance: combinatorial_formula / planned_turnaround_combines_ice_branch_seating_mode_panel_sets_crew_clamp_and_pinned_double_ceiling
          rationale: "The §1.8 instance shows that priority 74 can only be evaluated once planned_turnaround_minutes has been computed through the full ice/seating/panel/crew/overnight chain, so the dependency of the check on the calculation is already pinned."

