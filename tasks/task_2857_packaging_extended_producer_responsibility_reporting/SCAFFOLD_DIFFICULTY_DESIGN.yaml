  - rule_id: non_linear_state_machine
    instances:
      - name: report_parallel_dimensions_and_correction_cycle
        grounds:
          - state_machines.PackagingReport.DRAFT_to_SUBMITTED
          - state_machines.PackagingReport.UNDER_VERIFICATION_to_CORRECTION_REQUIRED
          - state_machines.PackagingReport.CORRECTION_REQUIRED_to_SUBMITTED
          - state_machines.PackagingReport_fee_status.UNASSESSED_to_FINAL
          - state_machines.PackagingReport_fee_status.VOIDED_to_UNASSESSED
          - entities.PackagingReport.fields.correction_round
        distinguishing_aspect: |
          PackagingReport is non-linear in two independent ways on one row: the fee_status dimension
          moves UNASSESSED -> FINAL -> INVOICED -> VOIDED -> UNASSESSED while submission_status is
          untouched by the assess call, and submission_status itself cycles
          SUBMITTED -> UNDER_VERIFICATION -> CORRECTION_REQUIRED -> SUBMITTED with correction_round
          incrementing from 0 to 1.
        test_recipe:
          setup:
            - "CA program (verification_required_threshold_kg 3000) with a GLASS band [0,-) at 9 cents/kg and one open period CA-2026-H2 (correction_window_days 30)."
            - "Producer P6 (revenue 8000000, brand owner) with one ACTIVE GLASS SKU of 50 g, units_sold_annual_estimate 110, so annual_packaging_weight_kg is 5.500 and the membership fee is 250000 cents."
            - "P6 holds an ACTIVE CA registration and a PAID ACTIVE membership; one report for CA-2026-H2 carries a single 110-unit line (5.500 kg, verification_required false) and has been submitted, FINAL-assessed at 50 cents and invoiced at 53 cents."
            - "The logical clock is 2026-09-01T00:00:00Z, so the correction window that a QUALIFIED or ADVERSE opinion opens closes at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /epr/_clock/set_current_utc"
