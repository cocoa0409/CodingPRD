            - { call: "GET /termination-cases/${c_b}", payload: {}, as: PlanAdministrator, captures: { c_b_v3: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_b}", notice_type: BLACKOUT_ADVISORY, action_effective_date: "2026-11-01T00:00:00Z", expected_termination_case_version: "${c_b_v3}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: PlanAdministrator }
