scaffold_corner_design:
  # =====================================================================
  - section: entities
    instances:
      - name: create_pool_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Pool, endpoints]
        distinguishing_aspect: "POST /pools with all required fields returns 201, service_status defaults to CLOSED, version==1, balance_due_cents==0."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pc Owner", email: "pc@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
          assert:
            - "Pool.${pool_id}.service_status == CLOSED"
            - "Pool.${pool_id}.version == 1"
            - "Pool.${pool_id}.balance_due_cents == 0"
            - "Pool.${pool_id}.open_work_order_count == 0"

      - name: get_pool_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Pool, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /pools/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /pools/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_pool_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Pool, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /pools omitting water_type returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Mr Owner", email: "mr@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", volume_gallons: 20000 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_pool_invalid_enum_water_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Pool.fields.water_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /pools with water_type=GAS (not in enum) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "En Owner", email: "en@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "GAS", volume_gallons: 20000 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: customer_billing_terms_default_applied
        claim_type: Defaults
        grounds: [entities.Customer.fields.billing_terms]
        distinguishing_aspect: "POST /customers omitting billing_terms applies default PER_VISIT."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Df Owner", email: "df@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
          assert:
            - "Customer.${cust_id}.billing_terms == PER_VISIT"
            - "Customer.${cust_id}.account_status == ACTIVE"

      - name: reading_recommended_dose_input_ignored
        claim_type: Computed Fields
        grounds: [entities.ChemicalReading.fields.recommended_dose_grams, calculations.dosing_recommendation]
        excluded_because:
          difficulty_instance: dual_variant_calc / dosing_provisional_vs_final_on_chemical_reading
          rationale: "recommended_dose_grams correctness as a computed field is asserted by the named §1.8 instance."

      - name: pagination_list_pools_has_more_total_count
        claim_type: Listing
        grounds: [entities.Pool, endpoints]
        distinguishing_aspect: "GET /pools?limit=1 over 2 pools returns total_count==2 and has_more==true in the envelope."
        test_recipe:
          setup: ["A customer with two pools."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pg Owner", email: "pg@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "P1", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "P2", water_type: "SALTWATER", volume_gallons: 15000 }
              as: AccountManager
          trigger:
            - call: "GET /pools?customer_id=${cust_id}&limit=1&offset=0"
              payload: {}
              as: AccountManager
          assert:
            - "response.meta total_count == 2"
            - "response.meta has_more == true"

  # =====================================================================
  - section: state_machines
    instances:
      - name: complete_visit_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceVisit.COMPLETED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing an already-COMPLETED visit returns ERR_INVALID_STATE; no re-billing, no second cascade."
        test_recipe:
          setup: ["A COMPLETED visit (green_pool false) on an OPEN pool."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cv Owner", email: "cv@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "RECURRING", frequency: "WEEKLY", per_visit_rate_cents: 6000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
            - call: "POST /pools/${pool_id}/seasonal-events"
              payload: { event_type: "OPEN", effective_date: "2026-06-10" }
              as: RouteManager
              captures: { se_id: $.data.id }
            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
            - call: "POST /visits/${visit_id}/complete"
              payload: { green_pool: false }
              as: FieldTechnician
          trigger:
            - call: "POST /visits/${visit_id}/complete"
              payload: { green_pool: false }
              as: FieldTechnician
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: dispatch_empty_route_returns_empty_route
        claim_type: Precondition Enforcement
        grounds: [state_machines.RouteAssignment.PLANNED_to_DISPATCHED, "validations[priority=11]", "errors[ERR_EMPTY_ROUTE]"]
        distinguishing_aspect: "Dispatching a PLANNED route with zero SCHEDULED visits returns ERR_EMPTY_ROUTE (409)."
        test_recipe:
          setup: ["A PLANNED route with no visits."]
          setup_api_calls:
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EMPTY_ROUTE"

      - name: new_visit_starts_in_scheduled
        claim_type: Initial State
        grounds: [state_machines.ServiceVisit, entities.ServiceVisit.fields.status]
        distinguishing_aspect: "A newly created ServiceVisit has status==SCHEDULED and billed_amount_cents==0."
        test_recipe:
          setup: ["Plan ACTIVE, route PLANNED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Iv Owner", email: "iv@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "RECURRING", frequency: "WEEKLY", per_visit_rate_cents: 6000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
          assert:
            - "ServiceVisit.${visit_id}.status == SCHEDULED"
            - "ServiceVisit.${visit_id}.billed_amount_cents == 0"

      - name: cancel_resolved_work_order_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.WorkOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a RESOLVED (terminal) work order returns ERR_INVALID_STATE; cancel is not defined from RESOLVED."
        test_recipe:
          setup: ["A RESOLVED work order (MINOR, parts 0, labor 30); customer owns pool."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Tl Owner", email: "tl@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /work-orders"
              payload: { pool_id: "${pool_id}", component: "FILTER", severity: "MINOR" }
              as: FieldTechnician
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/diagnose"
              payload: { quoted_parts_cents: 0, labor_minutes: 30 }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/submit-for-approval"
              payload: {}
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/resolve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: RouteManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: plan_cancel_cascades_visit_cancellation
        claim_type: Side Effect Execution
        grounds: [state_machines.ServicePlan.ACTIVE_to_CANCELLED, state_machines.ServiceVisit.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancelling an ACTIVE plan cancels its SCHEDULED visits (cascade down); the visit ends in CANCELLED."
        test_recipe:
          setup: ["Plan ACTIVE with one SCHEDULED visit on a PLANNED route."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pcx Owner", email: "pcx@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "RECURRING", frequency: "WEEKLY", per_visit_rate_cents: 6000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /service-plans/${plan_id}/cancel"
              payload: {}
              as: AccountManager
          assert:
            - "ServicePlan.${plan_id}.status == CANCELLED"
            - "ServiceVisit.${visit_id}.status == CANCELLED"

      - name: plan_auto_completes_on_one_time_visit_completion
        claim_type: Side Effect Execution
        grounds: [state_machines.ServicePlan.ACTIVE_to_COMPLETED, entities.ServicePlan.fields.visits_remaining]
        distinguishing_aspect: "Completing the sole visit of a ONE_TIME plan drops visits_remaining to 0 and bubbles the plan to COMPLETED."
        test_recipe:
          setup: ["ONE_TIME plan ACTIVE, pool OPEN, route DISPATCHED, one SCHEDULED visit."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ot Owner", email: "ot@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "ONE_TIME", frequency: "NONE", per_visit_rate_cents: 8000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
            - call: "POST /pools/${pool_id}/seasonal-events"
              payload: { event_type: "OPEN", effective_date: "2026-06-10" }
              as: RouteManager
              captures: { se_id: $.data.id }
            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
          trigger:
            - call: "POST /visits/${visit_id}/complete"
              payload: { green_pool: false }
              as: FieldTechnician
          assert:
            - "ServicePlan.${plan_id}.visits_remaining == 0"
            - "ServicePlan.${plan_id}.status == COMPLETED"

      - name: weather_skip_creates_makeup_visit
        claim_type: Side Effect Execution
        grounds: [state_machines.ServiceVisit.SCHEDULED_to_SKIPPED, entities.ServiceVisit.fields.makeup_visit_id]
        distinguishing_aspect: "Skipping a visit with skip_reason WEATHER sets makeup_visit_id and creates a new SCHEDULED makeup; HOLIDAY would not."
        test_recipe:
          setup: ["A SCHEDULED visit on a route with spare capacity; pool OPEN."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Wm Owner", email: "wm@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "RECURRING", frequency: "WEEKLY", per_visit_rate_cents: 6000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/skip"
              payload: { skip_reason: "WEATHER" }
              as: RouteManager
          assert:
            - "ServiceVisit.${visit_id}.status == SKIPPED"
            - "ServiceVisit.${visit_id}.makeup_visit_id != null"

      - name: holiday_skip_creates_no_makeup
        claim_type: Conditional cascade
        grounds: [state_machines.ServiceVisit.SCHEDULED_to_SKIPPED, entities.ServiceVisit.fields.skip_reason]
        distinguishing_aspect: "Skipping with skip_reason HOLIDAY leaves makeup_visit_id null (conditional side effect on skip_reason)."
        test_recipe:
          setup: ["A SCHEDULED visit; pool OPEN."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Hm Owner", email: "hm@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "RECURRING", frequency: "WEEKLY", per_visit_rate_cents: 6000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/skip"
              payload: { skip_reason: "HOLIDAY" }
              as: RouteManager
          assert:
            - "ServiceVisit.${visit_id}.status == SKIPPED"
            - "ServiceVisit.${visit_id}.makeup_visit_id == null"

      - name: green_recovery_completion_reverts_pool_open
        claim_type: Compensation
        grounds: [state_machines.ServiceVisit.RECOVERY_SCHEDULED_to_COMPLETED, state_machines.Pool.GREEN_RECOVERY_to_OPEN]
        distinguishing_aspect: "Completing the recovery visit with green_pool=false reverts Pool GREEN_RECOVERY->OPEN; recovery surcharge 4500 billed."
        test_recipe:
          setup: ["Pool GREEN_RECOVERY with one RECOVERY_SCHEDULED visit on a DISPATCHED route (one-time plan rate 8000)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gr Owner", email: "gr@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "ONE_TIME", frequency: "NONE", per_visit_rate_cents: 8000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
            - call: "POST /pools/${pool_id}/seasonal-events"
              payload: { event_type: "OPEN", effective_date: "2026-06-10" }
              as: RouteManager
              captures: { se_id: $.data.id }
            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
            - call: "POST /visits/${visit_id}/complete"
              payload: { green_pool: true }
              as: FieldTechnician
            - call: "GET /routes/${route_id}/visits"
              payload: {}
              as: RouteManager
              captures: { recovery_visit_id: "$.data[1].id" }
          trigger:
            - call: "POST /visits/${recovery_visit_id}/complete"
              payload: { green_pool: false }
              as: FieldTechnician
          assert:
            - "ServiceVisit.${recovery_visit_id}.status == COMPLETED"
            - "ServiceVisit.${recovery_visit_id}.billed_amount_cents == 12500"
            - "Pool.${pool_id}.service_status == OPEN"

      - name: close_pool_blocked_by_open_visits
        claim_type: guarded transitions
        grounds: [state_machines.Pool.OPEN_to_WINTERIZED, "validations[priority=10]", "errors[ERR_OPEN_VISITS_BLOCK_CLOSE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_before_temporal_on_seasonal_apply
          rationale: "The temporal close-block path is exercised in the safety-vs-temporal §1.8 instance's category pairing."

  # =====================================================================
  - section: calculations
    instances:
      - name: dosing_no_deficit_yields_zero
        claim_type: Correct Result
        grounds: [calculations.dosing_recommendation]
        distinguishing_aspect: "A reading at/above target (fc=5.0, ph=7.2, ta=120) yields recommended_dose_grams==0 (deficits floored at 0)."
        test_recipe:
          setup: ["CHLORINE pool 20000 OPEN, plan ACTIVE, route DISPATCHED, SCHEDULED visit."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Zd Owner", email: "zd@x.com" }
              as: AccountManager
