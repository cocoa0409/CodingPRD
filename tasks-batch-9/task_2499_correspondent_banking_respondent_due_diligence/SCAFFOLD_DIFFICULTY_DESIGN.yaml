  - rule_id: non_linear_state_machine
    instances:
      - name: respondent_dd_state_cycle_does_not_restore_the_parallel_payment_posture
        grounds:
          - state_machines.RespondentBank.dd_state.APPROVED_to_RESTRICTED
          - state_machines.RespondentBank.dd_state.RESTRICTED_to_APPROVED
          - state_machines.RespondentBank.payment_posture.OPEN_to_BLOCKED
          - state_machines.RespondentBank.payment_posture.BLOCKED_to_SCREEN_ONLY
          - entities.RespondentBank.fields.restriction_reason
          - validations[priority=26]
        distinguishing_aspect: |
          RespondentBank carries two independent state dimensions on one row: the dd_state cycle
          APPROVED -> RESTRICTED -> APPROVED closes exactly, but the parallel payment_posture
          dimension does not - it was widened to OPEN before the restriction, is forced to BLOCKED
          by RESTRICT and is returned only to SCREEN_ONLY by LIFT, so the round trip is not the
          identity map and posture must be re-widened by a separate PATCH.
        test_recipe:
          setup: >
            JurisdictionProfile DE (PERMITTED, basel 4.0, max_permitted_risk_rating HIGH). One
            respondent home DE, expected_monthly_volume_usd 4500000.00, licensed
            ACTIVE/GOOD_STANDING, one VERIFIED non-PEP natural-person owner at 80.00% resident in
            DE (ownership_verified true), eight self_rating=4 domains -> control_score 80.00,
            credit 0.3375, inherent 14.00, residual 9.28, risk_rating LOW. The committee approved
            it at clock 2026-08-01T00:00:00Z (dd_state APPROVED, payment_posture SCREEN_ONLY,
            approved_risk_rating LOW, refresh_due_date 2029-08-01T00:00:00Z), the relationship
            manager then widened the posture to OPEN, and a sanctions officer has already
            RESTRICTed the respondent with restriction_reason OFFICER_ACTION and posture BLOCKED.
            No nested relationships and no information requests exist, so undisclosed_nested_count
            is 0 and unresponsive_strikes is 0 - both LIFT preconditions hold.
          setup_api_calls:
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.0, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/respondents", payload: { legal_name: "Rhein Handelsbank AG", swift_bic: "RHEIDEFFXXX", home_jurisdiction_code: "DE", relationship_manager_user_id: "user-rm-01", expected_monthly_volume_usd: 4500000.00, expected_monthly_count: 300, nested_activity_permitted: false }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { p_id: $.data.id } }
            - { call: "POST /correspondent-banking/respondents/${p_id}/licensing-verification", payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${p_id}/beneficial-owners", payload: { owner_name: "Anke Vogel", owner_type: "NATURAL_PERSON", ownership_pct: 80.00, country_of_residence: "DE", is_pep: false }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { p_own: $.data.id } }
            - { call: "POST /correspondent-banking/beneficial-owners/${p_own}/verification", payload: { action: "VERIFY" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "GET /correspondent-banking/respondents/${p_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { pv0: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${p_id}/questionnaires", payload: { questionnaire_version: 1, expected_respondent_version: "${pv0}", declared_nested_activity: false, declared_downstream_count: 0 }, as: RespondentContact, as_user_id: "${p_id}", captures: { pq_id: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${pq_id}/control-assessments", payload: { control_domain: "GOVERNANCE", self_rating: 4 }, as: RespondentContact, as_user_id: "${p_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${pq_id}/control-assessments", payload: { control_domain: "KYC_ONBOARDING", self_rating: 4 }, as: RespondentContact, as_user_id: "${p_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${pq_id}/control-assessments", payload: { control_domain: "TRANSACTION_MONITORING", self_rating: 4 }, as: RespondentContact, as_user_id: "${p_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${pq_id}/control-assessments", payload: { control_domain: "SANCTIONS_SCREENING", self_rating: 4 }, as: RespondentContact, as_user_id: "${p_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${pq_id}/control-assessments", payload: { control_domain: "PEP_HANDLING", self_rating: 4 }, as: RespondentContact, as_user_id: "${p_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${pq_id}/control-assessments", payload: { control_domain: "TRAINING", self_rating: 4 }, as: RespondentContact, as_user_id: "${p_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${pq_id}/control-assessments", payload: { control_domain: "AUDIT", self_rating: 4 }, as: RespondentContact, as_user_id: "${p_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${pq_id}/control-assessments", payload: { control_domain: "NESTED_CONTROLS", self_rating: 4 }, as: RespondentContact, as_user_id: "${p_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${pq_id}/submission", payload: {}, as: RespondentContact, as_user_id: "${p_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${pq_id}/assessment-decision", payload: { action: "ASSESS", variant: "ONBOARDING_PROVISIONAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${p_id}/risk-assessment", payload: { variant: "ONBOARDING_PROVISIONAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${p_id}/approval", payload: { action: "APPROVE" }, as: CommitteeApprover, as_user_id: "user-committee-01" }
            - { call: "PATCH /correspondent-banking/respondents/${p_id}", payload: { payment_posture: "OPEN" }, as: FIGRelationshipManager, as_user_id: "user-rm-01" }
            - { call: "POST /correspondent-banking/respondents/${p_id}/restriction", payload: { action: "RESTRICT", restriction_reason: "OFFICER_ACTION", payment_posture: "BLOCKED" }, as: SanctionsOfficer, as_user_id: "user-sanctions-01" }
          trigger:
            - { call: "POST /correspondent-banking/respondents/${p_id}/restriction", payload: { action: "LIFT" }, as: SanctionsOfficer, as_user_id: "user-sanctions-01" }
          assert:
            - "trigger HTTP status == 200"
            - "RespondentBank.${p_id}.dd_state == APPROVED   # the cycle APPROVED -> RESTRICTED -> APPROVED closes"
            - "RespondentBank.${p_id}.payment_posture == SCREEN_ONLY   # NOT OPEN: the parallel dimension is not restored"
            - "RespondentBank.${p_id}.restriction_reason == null"
            - "RespondentBank.${p_id}.approved_risk_rating == LOW"
            - "RespondentBank.${p_id}.residual_risk_score == 9.28   # round(round(14.00*(1-0.3375),2)+0.00, 2) from 9.275, round_half_up"
            - "RespondentBank.${p_id}.refresh_due_date == \"2029-08-01T00:00:00Z\"   # add_months(2026-08-01, cadence[LOW]=36), MIN_CADENCE floor inert"
            - "RespondentBank.${p_id}.undisclosed_nested_count == 0 and RespondentBank.${p_id}.unresponsive_strikes == 0"

      - name: questionnaire_clarification_cycle_exhausts_rounds_on_the_fourth_return
        grounds:
          - state_machines.DueDiligenceQuestionnaire.SUBMITTED_to_UNDER_ASSESSMENT
          - state_machines.DueDiligenceQuestionnaire.UNDER_ASSESSMENT_to_RETURNED_FOR_CLARIFICATION
          - state_machines.DueDiligenceQuestionnaire.RETURNED_FOR_CLARIFICATION_to_SUBMITTED
          - entities.DueDiligenceQuestionnaire.fields.clarification_rounds
          - validations[priority=13]
        distinguishing_aspect: |
          A different entity from the RespondentBank instance: the questionnaire's
          SUBMITTED -> (UNDER_ASSESSMENT) -> RETURNED_FOR_CLARIFICATION -> SUBMITTED loop is
          traversable three times because clarification_rounds is monotonic across the cycle and
          is never reset by re-entry, so the fourth RETURN is refused at priority 13 while the row
          stays in SUBMITTED - a cycle with a bounded trip count, not a free loop.
        test_recipe:
          setup: >
            JurisdictionProfile DE and one respondent home DE licensed to DD_IN_PROGRESS. One
            questionnaire v1 with all eight ControlAssessment rows at self_rating 3. The loop has
            already been walked three times: submission -> RETURN (rounds 1) -> submission ->
            first analyst overlay (SUBMITTED -> UNDER_ASSESSMENT) -> RETURN (rounds 2) ->
            submission -> RETURN (rounds 3) -> submission, leaving the row SUBMITTED with
            clarification_rounds 3.
          setup_api_calls:
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.0, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/respondents", payload: { legal_name: "Rhein Handelsbank AG", swift_bic: "RHEIDEFFXXX", home_jurisdiction_code: "DE", relationship_manager_user_id: "user-rm-01", expected_monthly_volume_usd: 4500000.00, expected_monthly_count: 300 }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { s_id: $.data.id } }
            - { call: "POST /correspondent-banking/respondents/${s_id}/licensing-verification", payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "GET /correspondent-banking/respondents/${s_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { sv0: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${s_id}/questionnaires", payload: { questionnaire_version: 1, expected_respondent_version: "${sv0}", declared_nested_activity: false, declared_downstream_count: 0 }, as: RespondentContact, as_user_id: "${s_id}", captures: { sq_id: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/control-assessments", payload: { control_domain: "GOVERNANCE", self_rating: 3 }, as: RespondentContact, as_user_id: "${s_id}", captures: { sq_gov: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/control-assessments", payload: { control_domain: "KYC_ONBOARDING", self_rating: 3 }, as: RespondentContact, as_user_id: "${s_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/control-assessments", payload: { control_domain: "TRANSACTION_MONITORING", self_rating: 3 }, as: RespondentContact, as_user_id: "${s_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/control-assessments", payload: { control_domain: "SANCTIONS_SCREENING", self_rating: 3 }, as: RespondentContact, as_user_id: "${s_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/control-assessments", payload: { control_domain: "PEP_HANDLING", self_rating: 3 }, as: RespondentContact, as_user_id: "${s_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/control-assessments", payload: { control_domain: "TRAINING", self_rating: 3 }, as: RespondentContact, as_user_id: "${s_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/control-assessments", payload: { control_domain: "AUDIT", self_rating: 3 }, as: RespondentContact, as_user_id: "${s_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/control-assessments", payload: { control_domain: "NESTED_CONTROLS", self_rating: 3 }, as: RespondentContact, as_user_id: "${s_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/submission", payload: {}, as: RespondentContact, as_user_id: "${s_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/assessment-decision", payload: { action: "RETURN", clarification_note: "round 1 - governance evidence missing" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/submission", payload: {}, as: RespondentContact, as_user_id: "${s_id}" }
            - { call: "PATCH /correspondent-banking/control-assessments/${sq_gov}", payload: { assessed_rating: 3, gap_severity: "MINOR" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/assessment-decision", payload: { action: "RETURN", clarification_note: "round 2 - returned from UNDER_ASSESSMENT" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/submission", payload: {}, as: RespondentContact, as_user_id: "${s_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/assessment-decision", payload: { action: "RETURN", clarification_note: "round 3 - nested controls evidence missing" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/submission", payload: {}, as: RespondentContact, as_user_id: "${s_id}" }
          trigger:
            - { call: "POST /correspondent-banking/questionnaires/${sq_id}/assessment-decision", payload: { action: "RETURN", clarification_note: "round 4 - must be refused" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
          assert:
            - "trigger HTTP status == 409"
            - "trigger data.error_id == ERR_ROUNDS_EXHAUSTED"
            - "DueDiligenceQuestionnaire.${sq_id}.clarification_rounds == 3   # not reset by any re-entry into SUBMITTED"
            - "DueDiligenceQuestionnaire.${sq_id}.state == SUBMITTED   # refused transition leaves the cycle position untouched"
            - "ControlAssessment.${sq_gov}.assessed_rating == 3 and ControlAssessment.${sq_gov}.remediation_required == false   # MINOR does not force remediation"

  - rule_id: transitive_cascade
    instances:
      - name: alert_escalation_fans_out_five_hops_and_holds_only_the_screened_clear_payments
        grounds:
          - state_machines.MonitoringAlert.UNDER_INVESTIGATION_to_ESCALATED
          - state_machines.InformationRequest.DRAFT_to_SENT
          - state_machines.RespondentBank.payment_posture.OPEN_to_SCREEN_ONLY
          - state_machines.PaymentInstruction.SCREENED_CLEAR_to_HELD_FOR_REVIEW
          - state_machines.TransactionMonitoringProfile.CALIBRATED_to_RECALIBRATION_REQUIRED
          - calculations.rfi_response_sla
          - calculations.payment_screening_decision
          - calculations.monitoring_threshold_calibration
        distinguishing_aspect: |
          One ESCALATE call must produce all five declared hops in one request - alert -> RFI ->
          posture -> held payments -> profile recalibration - and the fan-out at hop 4 must touch
          exactly the two SCREENED_CLEAR instructions in created_at order while leaving the
          instruction already held at AMOUNT_THRESHOLD with its original hold_reason and
          hold_threshold_applied; an implementation that stops after hop 3, or that rewrites every
          held row's hold_reason to POSTURE_SCREEN_ONLY, fails.
        test_recipe:
          setup: >
            Logical clock stays at its initial 2026-08-01T00:00:00Z throughout. JurisdictionProfile
            DE (basel_aml_index 4.0 -> jurisdiction_risk_points 8.00, PERMITTED, NONE, no secrecy,
            corridor_risk_weight 1.00, max_permitted_risk_rating HIGH). One respondent home DE,
            expected_monthly_volume_usd 4600000.00, expected_monthly_count 300,
            nested_activity_permitted false, licensed ACTIVE/GOOD_STANDING, one VERIFIED non-PEP
            natural-person owner at 80.00% resident in DE so ownership_verified is true. Eight
            self_rating=4 ControlAssessment rows give control_score 80.00 and control_credit
            0.3375; inherent_risk_score is 8.00 + 0 + 0 + 6 = 14.00 and residual_risk_score
            round(round(14.00*0.6625,2)+0.00,2) = 9.28, so risk_rating and approved_risk_rating are
            LOW. The committee approves, the relationship manager PATCHes payment_posture to OPEN
            (a no-op if the implementation already widened it at approval), and a monitoring profile
            over the CLOSED interval [2026-07-01, 2026-12-31] with one DE corridor at
            4600000.00 / 300 and tolerance_pct 0.10 is CALIBRATED: rating_factor 1.30 gives
            usd_threshold 6578000.00, count_threshold ceil(429.0) = 429, aggregate_usd_threshold
            round(6578000.00*1.10,2) = 7235800.00 and hold_threshold_usd 723580.00. Three DE->DE
            payment instructions are then submitted in this order: 500000.00 (below the hold
            threshold -> SCREENED_CLEAR), 800000.00 (>= 723580.00 -> HELD_FOR_REVIEW /
            AMOUNT_THRESHOLD) and 250000.00 (SCREENED_CLEAR). Finally a sanctions officer raises an
            officer alert VOLUME_BREACH / CRITICAL (activity_observation_id null) and the analyst
            INVESTIGATEs it, so it sits in UNDER_INVESTIGATION with no linked InformationRequest.
          setup_api_calls:
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.0, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
