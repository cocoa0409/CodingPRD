  - rule_id: resource_temporal_overlap
    instances:
      - name: milestone_calendar_half_open_windows_admit_touching_ends_and_reject_a_one_second_intrusion
        grounds:
          - calculations.milestone_window_conflict
          - calculations.cycle_milestone_slack
          - validations[priority=31]
          - validations[priority=32]
          - errors.ERR_MILESTONE_WINDOW_OVERLAP
          - errors.ERR_MILESTONE_BUFFER_VIOLATION
        distinguishing_aspect: |
          Two temporal constraints of DIFFERENT shape guard the same calendar. RULE A is a half-open
          same-kind exclusivity test, so a second CLOSE window whose start equals the first window's
          end is accepted while a window that starts one second earlier is rejected — a one-second
          input change flips 201 into 409. RULE B is an ordering buffer measured from the LATEST
          predecessor end (2026-08-04T00:00:00Z, contributed by the second CLOSE window, not the
          first), and its comparison is `>=`, so a REVIEW window starting exactly 48 hours later is
          accepted while 47:59:59 is rejected with a DIFFERENT error. The cycle's minimum slack tracks
          the newest open window throughout: (6, 4) after two CLOSE windows, (3, 1) once REVIEW lands.
        test_recipe:
          setup:
            - "An ADOPTED charter (min_quorum_count 2, required_functions [FINANCE, LEGAL]) with one ACTIVE voting FINANCE member and one ACTIVE voting LEGAL member."
            - "A ReportingCycle still in PLANNING: FORM_10Q, LARGE_ACCELERATED, period_end_date 2026-06-30, internal_buffer_days 5, so statutory_deadline_utc is 2026-08-10T17:30:00Z."
            - "One CLOSE Milestone occupying [2026-08-01T00:00:00Z, 2026-08-03T00:00:00Z)."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Calendar Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id, deadline: $.data.statutory_deadline_utc }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { ms1_id: $.data.id, ms1_cal: $.data.slack_calendar_days, ms1_bus: $.data.slack_business_days }
          trigger:
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-03T00:00:00Z", planned_end_utc: "2026-08-04T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { ms2_id: $.data.id, ms2_cal: $.data.slack_calendar_days, ms2_bus: $.data.slack_business_days }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-03T23:59:59Z", planned_end_utc: "2026-08-05T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { err_overlap: $.data.error_id }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { min_cal_two: $.data.min_slack_days_calendar, min_bus_two: $.data.min_slack_days_business }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "REVIEW", planned_start_utc: "2026-08-05T23:59:59Z", planned_end_utc: "2026-08-07T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { err_buffer: $.data.error_id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "REVIEW", planned_start_utc: "2026-08-06T00:00:00Z", planned_end_utc: "2026-08-07T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { ms3_id: $.data.id, ms3_cal: $.data.slack_calendar_days, ms3_bus: $.data.slack_business_days }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { min_cal_final: $.data.min_slack_days_calendar, min_bus_final: $.data.min_slack_days_business }
          assert:
            - "${deadline} == \"2026-08-10T17:30:00Z\""
            - "${ms1_cal} == 7"
            - "${ms1_bus} == 5"
            - "the touching second CLOSE window is accepted with HTTP 201 — under half-open geometry candidate.start == existing.end is not an overlap"
            - "${ms2_cal} == 6"
            - "${ms2_bus} == 4"
            - "the one-second intrusion returns HTTP 409 with ${err_overlap} == ERR_MILESTONE_WINDOW_OVERLAP"
            - "${min_cal_two} == 6"
            - "${min_bus_two} == 4"
            - "the REVIEW window starting 47 hours 59 minutes 59 seconds after the latest CLOSE end returns HTTP 409 with ${err_buffer} == ERR_MILESTONE_BUFFER_VIOLATION"
            - "the REVIEW window starting exactly 48 hours after 2026-08-04T00:00:00Z is accepted with HTTP 201 because the buffer test is >=, not >"
            - "${ms3_cal} == 3"
            - "${ms3_bus} == 1"
            - "${min_cal_final} == 3"
            - "${min_bus_final} == 1"
            - "the rejected windows left no rows behind: GET /disclosure/reporting-cycles/${cycle_id}/milestones returns exactly 3 milestones"

      - name: subcertification_prep_windows_are_closed_intervals_with_an_aggregate_capacity_of_two
        grounds:
          - calculations.member_concurrent_subcert_load
          - state_machines.SubCertificationRequest.PENDING_to_WITHDRAWN
          - errors.ERR_MEMBER_PREP_WINDOW_CAPACITY
        distinguishing_aspect: |
          The same member's 72-hour preparation windows use the OPPOSITE interval geometry from the
          milestone calendar: both ends are INCLUSIVE, so two windows that meet at the single instant
          2026-08-01T18:00:00Z DO occupy each other — yet the second request is still accepted, because
          the constraint is an aggregate CAPACITY of 2, not exclusivity. Only the third overlapping
          window, which finds both predecessors in its interval, is rejected. Capacity is then released
          by state, not by time: WITHDRAWN rows are excluded from the occupant set, so withdrawing one
          predecessor makes the identical third request succeed with no change to any timestamp.
