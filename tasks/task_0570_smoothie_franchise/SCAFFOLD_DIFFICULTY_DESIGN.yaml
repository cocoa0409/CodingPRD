            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Mango", unit: "GRAM", standard_cost_cents_per_unit: 2 }, as: PlatformAdmin, captures: { mango_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${mango_id}", qty_received: 200, unit_cost_cents: 2, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}", captures: { lot_id: $.data.id } }
            - { call: "POST /menu-items", payload: { name: "Mango Tango", category: "SMOOTHIE", base_price_cents: 500, recipe: [ { ingredient_id: "${mango_id}", base_qty: 100 } ], base_calories: 200 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "c17@x.com", full_name: "C Seventeen" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "MEDIUM", boost_ids: [] } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
          trigger:
            - { call: "POST /orders/${order_id}/pay", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          assert:
            - "InventoryLot.${lot_id}.remaining_qty == 200"
            - "InventoryLot.${lot_id}.consumed_qty == 0"
            - "InventoryLot.${lot_id}.status == AVAILABLE"
