  - section: cross_cutting_layers
    instances:
      - name: stale_institute_version_on_second_payline
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[payline-stale-institute-version]
          - endpoints.POST_/grants/institutes/{id}/payline-decisions
        distinguishing_aspect: Publishing a payline bumps Institute.version (1 -> 2); a second publication still carrying the pre-publication version 1 is rejected 412 ERR_STALE_INSTITUTE_VERSION, while
          carrying version 2 succeeds.
        test_recipe:
          setup:
            - institute exists (version 1); no applications (empty candidate pool is a valid walk)
          setup_api_calls:
            - call: POST /grants/institutes
              payload:
                name: National Test Institute
                appropriation_cents: 100000000
                reserve_cents: 0
                indirect_cost_rate: 0.5
                select_pay_cap_pct: 0.1
                select_pay_extension_percentile: 5.0
              as: ProgramOfficer
              captures:
                insti_id: $.data.id
                insti_v: $.data.version
          trigger:
            - call: POST /grants/institutes/${insti_id}/payline-decisions
              payload:
                base_payline_percentile: 50.0
                expected_institute_version: ${insti_v}
              as: ProgramOfficer
              captures:
                insti_v2: $.data.version
                pctl1: $.data.current_payline_percentile
            - call: POST /grants/institutes/${insti_id}/payline-decisions
              payload:
