      - name: segment_creation_links_a_campaign_and_two_lists_then_pins_their_versions
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /pre-bid-segments]
          - endpoints[POST /pre-bid-segments/{id}/sync]
          - endpoints[GET /pre-bid-segments/{id}]
          - entities.PreBidSegment
        distinguishing_aspect: |
          A segment is a three-way link (campaign + inclusion list + exclusion
          list) and every leg must be resolved before anything is written; then
          sync must pin each list's published_version SEPARATELY into the
          matching synced_* slot. Swapping the two slots, or pinning
          InventoryList.version instead of published_version, is invisible until
          a list is revised - so the fixture gives the two lists deliberately
          different published_version values.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one advertiser and one ACTIVE campaign. The EXCLUSION list is given TWO entries and the INCLUSION list ONE, so their versions - and therefore their published_version snapshots - differ and cannot be confused."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "INCLUSION", name: "Beacon Allowlist" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /inventory-lists/${inc_id}/entries"
              payload: { entry_type: "PUBLISHER", entry_value: "${pub_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /inventory-lists/${inc_id}/publish"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { inc_pub_ver: $.data.published_version }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "EXCLUSION", name: "Global Blocklist" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { exc_id: $.data.id }
            - call: "POST /inventory-lists/${exc_id}/entries"
              payload: { entry_type: "CATEGORY", entry_value: "GAMBLING" }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /inventory-lists/${exc_id}/entries"
              payload: { entry_type: "CATEGORY", entry_value: "ADULT" }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /inventory-lists/${exc_id}/publish"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { exc_pub_ver: $.data.published_version }
          trigger:
            - call: "POST /pre-bid-segments"
              payload: { campaign_id: "44444444-4444-4444-4444-444444444444", suitability_floor_tier: "MEDIUM_RISK", inclusion_list_id: "${inc_id}", exclusion_list_id: "${exc_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_camp: $.data.error_id }
            - call: "POST /pre-bid-segments"
              payload: { campaign_id: "${camp_id}", suitability_floor_tier: "MEDIUM_RISK", inclusion_list_id: "55555555-5555-5555-5555-555555555555", exclusion_list_id: "${exc_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_list: $.data.error_id }
            - call: "POST /pre-bid-segments"
              payload: { campaign_id: "${camp_id}", suitability_floor_tier: "MEDIUM_RISK", inclusion_list_id: "${inc_id}", exclusion_list_id: "${exc_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { seg_id: $.data.id }
            - call: "POST /pre-bid-segments/${seg_id}/sync"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { sync_inc: $.data.synced_inclusion_version, sync_exc: $.data.synced_exclusion_version, synced_at: $.data.synced_at }
            - call: "GET /pre-bid-segments/66666666-6666-6666-6666-666666666666"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_seg: $.data.error_id }
          assert:
            - "Setup: the two lists carry different snapshots - ${exc_pub_ver} > ${inc_pub_ver}, because the exclusion list absorbed one extra entry before publishing; both lists have status PUBLISHED and entry_count 1 and 2 respectively"
            - "Trigger 1 (unknown campaign leg): HTTP 404 and ${err_camp} == ERR_CAMPAIGN_NOT_FOUND; GET /pre-bid-segments filtered by campaign_id == ${camp_id} returns total_count == 0"
            - "Trigger 2 (unknown inclusion-list leg, all other legs valid): HTTP 404 and ${err_list} == ERR_INVENTORY_LIST_NOT_FOUND - a partially resolvable link writes nothing"
            - "Trigger 3: HTTP 201; PreBidSegment.${seg_id}.sync_status == PENDING, synced_inclusion_version is null, synced_exclusion_version is null, synced_at is null, stale_reason is null, version == 1"
            - "Trigger 4: HTTP 200; sync_status == SYNCED, ${sync_inc} == ${inc_pub_ver}, ${sync_exc} == ${exc_pub_ver} (the slots are not swapped), ${synced_at} == 2026-08-10T00:00:00Z, version == 2"
            - "Trigger 5: HTTP 404 and ${err_seg} == ERR_PRE_BID_SEGMENT_NOT_FOUND"

      - name: pre_bid_decision_read_returns_the_full_envelope
        claim_type: computed_read
        grounds:
          - endpoints[GET /pages/{id}/pre-bid-decision]
          - calculations.pre_bid_placement_decision
          - errors[ERR_SEGMENT_NOT_SYNCED]
        distinguishing_aspect: |
          The pre-bid read is a computed projection with eight declared output
          fields and none may be dropped or left null on the ALLOW_OVERRIDE
          path: decision, reason_code, decisive_entry_id, decisive_specificity,
          effective_tier and floor_tier are all populated, plus the echoed
          page_id and segment_id. The fixture also pins the readiness gate ahead
          of everything else - an unsynced segment yields an ERROR, not a BLOCK
          decision, which is the difference between a bidder that pauses and a
          bidder that silently buys nothing.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; ACTIVE publisher; page https://beacon.example.com/news classified HUMAN ['GENERAL'] and CONFIRMED by analyst-2, so the page is HUMAN_CONFIRMED with assigned_tier SAFE (0 risk points). Segment S1 pins a PUBLISHED inclusion list holding a PAGE_URL ALLOW entry for that exact url and a PUBLISHED exclusion list holding a DOMAIN BLOCK entry for beacon.example.com, floor MEDIUM_RISK, and is SYNCED. Segment S2 pins only the exclusion list and is left PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
