          - state_machines.Subscription.SUITABILITY_REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          Subscription has a revert cycle: ACCREDITATION_VERIFIED ->
          SUITABILITY_REJECTED clears accreditation_verified_by, then
          SUITABILITY_REJECTED -> SUBMITTED via resubmit lets the investor
          re-enter the verification pipeline. The cycle can repeat multiple
          times before terminal FUNDED.
