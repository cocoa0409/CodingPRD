        distinguishing_aspect: |
          A different metric on a different endpoint from the capacity boundary: the empty-set
          edge of GET /reports/unmet-need, where a county with zero WAITING entries must answer
          `rows: []` with both totals 0 rather than a zero-filled row or a 404.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z."
            - "PartnerAgency CENTRAL quota 5; Client household_size 4 county CENTRAL."
            - "Referral APPROVED; Voucher ISSUED with a single BED line of quantity_requested 2."
            - "The warehouse is empty, so the zero-yield allocation round parks the whole line on the waitlist: exactly one WaitlistEntry, county CENTRAL, category BED, quantity_unmet 2, WAITING."
            - "No waitlist entry of any kind exists in county SOUTH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
