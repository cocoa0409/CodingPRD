      - name: hardness_index_input_set_excludes_void_and_scheduled_runs
        claim_type: input_set_filtering
        grounds:
          - calculations.lot_hardness_index.input_set
          - state_machines.TestRun.SCHEDULED_to_VOID
          - entities.ProductionLot.fields.hardness_index_pooled
        distinguishing_aspect: "Only PASSED HARDNESS runs enter either variant: with one VOID run, one still-SCHEDULED run and one PASSED run of readings [52.0, 53.0] on the same lot, both indices read 52.50 rather than being diluted by the excluded rows."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, one CR_MO furnace and one lot advanced to HEAT_TREATED with specimen_pool_total 20."
            - "Three HARDNESS runs on that lot: one voided before results, one left SCHEDULED, one resolved PASSED with readings [52.0, 53.0]."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "HARDNESS", specimen_count: 4, window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }
              as: QualityEngineer
              captures: { void_run_id: $.data.id }
            - call: "POST /toolworks/test-runs/${void_run_id}/void"
              payload: { void_reason: "Specimens mislabelled" }
              as: QualityEngineer
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "HARDNESS", specimen_count: 3, window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T11:00:00Z" }
