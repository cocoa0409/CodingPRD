  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: boundary_issuance_cap_inclusive_at_five_thousand
        grounds:
          - validations[priority=90]
          - errors[ERR_ISSUANCE_CAP_EXCEEDED]
          - calculations.point_issuance_measurement
          - entities.LoyaltyProgram.fields.per_issuance_point_cap
          - entities.PointLot.fields.points_issued
        distinguishing_aspect: |
          The cap is compared against the POST-MULTIPLIER points_issued, not the
          submitted base_points, and the comparison is INCLUSIVE: base 4000 at the
          GOLD multiplier lands on exactly 5000 == per_issuance_point_cap and must
          be accepted, while base 4001 lands on 5001 and must be refused. The
          neighbouring base 3999 also pins the rounding mode - 4998.75 must
          ROUND_HALF_UP to 4999, not truncate to 4998 - and its 5998.8-cent gross
          must round to 5999 with a 1499.75-cent reserve rounding to 1500.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Boundary Core' ACTIVE: ssp_millicents_per_point 1200, per_issuance_point_cap 5000, tier_multiplier_bp {BASE 10000, SILVER 10300, GOLD 12500, PLATINUM 15000}, promo_multiplier_cap_bp 30000, historical_redemption_rate_bp 7500 so current_breakage_rate_bp is 2500."
            - "StateExpiryRule TX; Cohort C1; Member M1 GOLD/TX in C1 with point_balance 0."
            - "AccountingPeriod per1 OPEN over [2026-08-01, 2026-09-01) holding no lots yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Boundary Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "GOLD" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
          trigger:
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 3999, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot_below_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 4000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot_at_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 4001, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { err_above: $.data.error_id }
          assert:
            - "BELOW: the first call returns 201 with points_issued == 4999 (3999 * 12500 / 10000 == 4998.75, ROUND_HALF_UP -> 4999)"
            - "BELOW: PointLot.${lot_below_id}.gross_ssp_cents == 5999 (4999 * 1200 / 1000 == 5998.8, ROUND_HALF_UP -> 5999)"
            - "BELOW: PointLot.${lot_below_id}.breakage_reserve_cents == 1500 (5999 * 2500 / 10000 == 1499.75, ROUND_HALF_UP -> 1500) and deferred_revenue_cents == 4499"
            - "AT: the second call returns 201 with points_issued == 5000, which EQUALS per_issuance_point_cap - the comparison is inclusive"
            - "AT: PointLot.${lot_at_id}.gross_ssp_cents == 6000, breakage_reserve_cents == 1500, deferred_revenue_cents == 4500"
            - "ABOVE: the third call returns HTTP 409 with error_id == ERR_ISSUANCE_CAP_EXCEEDED (4001 * 12500 / 10000 == 5001.25, ROUND_HALF_UP -> 5001 > 5000)"
            - "The cap is never compared against base_points: 4001 base would pass a naive base-vs-5000 test, and 4000 base would already fail a naive 5000-strict test"
            - "GET /point-lots?period_id=${per1_id} returns total_count == 2 - only the below and at lots exist"
            - "Member.${m1_id}.point_balance == 9999 (4999 + 5000) and AccountingPeriod.${per1_id}.issuance_deferred_cents == 8999 (4499 + 4500)"

      - name: boundary_lot_expiry_at_exact_expires_at_instant
        grounds:
          - state_machines.PointLot.OUTSTANDING_to_EXPIRED
          - entities.PointLot.fields.expires_at
          - entities.LoyaltyProgram.fields.point_expiry_days
          - calculations.expiry_escheatment_sweep
          - state_machines.Member.ACTIVE_to_DORMANT
        distinguishing_aspect: |
          The expiry predicate is `lot.expires_at <= clock_now`, so the sweep must
          be a no-op one millisecond before the computed instant and must fire at
          exactly that instant. expires_at itself is a day-count boundary:
          issued 2026-08-05 with point_expiry_days 730 lands on
          2028-08-04T00:00:00Z (the 2028 leap day is inside the window), and at
          that same instant the member's dormancy_days is exactly 730, so the
          ACTIVE -> DORMANT fan-out also sits precisely on its own inclusive edge.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Expiry Core' ACTIVE: ssp 1200, point_expiry_days 730, per_issuance_point_cap 5000, historical_redemption_rate_bp 7500 so current_breakage_rate_bp is 2500."
            - "StateExpiryRule TX: expiry_permitted true, min_dormancy_days 0, escheatment_required FALSE, escheat_rate_bp 0."
            - "Cohort C1; Member M1 BASE/TX in C1."
            - "AccountingPeriod per1 OPEN over [2026-08-01, 2026-09-01)."
            - "At clock 2026-08-05T00:00:00Z a BASE lot of base_points 1000 is issued: points_issued 1000, gross 1200, reserve 300, deferred 900, expires_at 2028-08-04T00:00:00Z."
            - "AccountingPeriod per2 OPEN over [2028-08-01, 2028-09-01) is the sweep container."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Expiry Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 0, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: LoyaltyAccountant
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2028-08", start_at: "2028-08-01T00:00:00Z", end_at: "2028-09-01T00:00:00Z" }
              as: Controller
              captures: { per2_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-08-03T23:59:59.999Z" }
              as: Controller
            - call: "POST /accounting-periods/${per2_id}/expiry-sweep"
              payload: {}
              as: LoyaltyAccountant
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-08-04T00:00:00Z" }
              as: Controller
            - call: "POST /accounting-periods/${per2_id}/expiry-sweep"
              payload: {}
              as: LoyaltyAccountant
          assert:
            - "PointLot.${lot1_id}.expires_at == '2028-08-04T00:00:00Z' - issued 2026-08-05 plus exactly 730 days, spanning the 2028-02-29 leap day"
            - "ONE MILLISECOND BEFORE: after the sweep at 2028-08-03T23:59:59.999Z, PointLot.${lot1_id}.lifecycle_state == OUTSTANDING, points_remaining == 1000, expired_gross_ssp_cents == 0"
            - "ONE MILLISECOND BEFORE: AccountingPeriod.${per2_id}.expiry_released_cents == 0 and Member.${m1_id}.status == ACTIVE"
            - "AT THE INSTANT: after the sweep at 2028-08-04T00:00:00Z, PointLot.${lot1_id}.lifecycle_state == EXPIRED (the predicate is expires_at <= clock_now, so equality fires)"
            - "AT THE INSTANT: PointLot.${lot1_id}.expired_gross_ssp_cents == 1200 and points_remaining == 0"
            - "AT THE INSTANT: AccountingPeriod.${per2_id}.expiry_released_cents == 900 (the pre-zeroing remaining_deferred_cents)"
            - "PointLot.${lot1_id}.escheated_cents == 0 and lifecycle_state is EXPIRED not ESCHEATED - the TX rule has escheatment_required false, so the EXPIRED -> ESCHEATED link is not taken"
            - "AccountingPeriod.${per2_id}.escheat_accrual_cents == 0 and LoyaltyProgram.${prog_id}.total_escheat_accrual_cents == 0 and escheat_disclosure_required == false"
            - "Member.${m1_id}.status == DORMANT and point_balance == 0: dormancy_days at 2028-08-04 is exactly 730, hitting the >= 730 fan-out gate on its inclusive edge"
            - "AccountingPeriod.${per1_id}.expiry_released_cents == 0 - the release lands in the swept period, never the issuing one"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cross_entity_point_lot_requires_open_period_and_active_program
        grounds:
          - validations[priority=61]
          - errors[ERR_PROGRAM_NOT_ACTIVE]
          - state_machines.LoyaltyProgram.ACTIVE_to_SUSPENDED
          - state_machines.LoyaltyProgram.SUSPENDED_to_ACTIVE
          - endpoints[POST /point-lots]
          - endpoints[POST /redemption-events]
        distinguishing_aspect: |
          Creating a PointLot is gated on the state of TWO ancestors that are not
          each other's parent: the addressed AccountingPeriod (priority 60) and
          the owning LoyaltyProgram (priority 61). Here the period stays OPEN the
          whole time and only the program's status moves, so the refusal must be
          ERR_PROGRAM_NOT_ACTIVE - the request body is unchanged and legal, and
          the very same body succeeds again once the program is reactivated,
          without the period ever being touched.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Gate Core' ACTIVE: ssp 1200, per_issuance_point_cap 5000, historical_redemption_rate_bp 7500 so current_breakage_rate_bp is 2500."
            - "StateExpiryRule TX; Cohort C1; Member M1 BASE/TX in C1."
            - "AccountingPeriod per1 OPEN over [2026-08-01, 2026-09-01), and it stays OPEN for the whole test."
            - "One existing BASE lot (base 1000 -> 1000 points, gross 1200, deferred 900), so M1.point_balance is 1000 and a redemption is otherwise feasible."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Gate Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/suspend"
              payload: {}
              as: ProgramAdmin
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { err_issue: $.data.error_id }
            - call: "POST /redemption-events"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", points_requested: 500, redemption_type: "CATALOG" }
              as: LoyaltyAccountant
              captures: { err_redeem: $.data.error_id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot2_id: $.data.id }
          assert:
            - "After the suspend call, LoyaltyProgram.${prog_id}.status == SUSPENDED and current_breakage_rate_bp is still 2500"
            - "The issuance attempt returns HTTP 409 with error_id == ERR_PROGRAM_NOT_ACTIVE, NOT ERR_PERIOD_NOT_OPEN - AccountingPeriod.${per1_id}.state is OPEN at that moment"
            - "The redemption attempt returns HTTP 409 with error_id == ERR_PROGRAM_NOT_ACTIVE - the same ancestor gate covers a different child entity"
            - "After the reactivate call, LoyaltyProgram.${prog_id}.status == ACTIVE and current_breakage_rate_bp is STILL 2500 - reactivation does not reseed the rate to 10000 - historical_redemption_rate_bp"
            - "The final issuance - the same body that was refused twice earlier - returns 201 with PointLot.${lot2_id}.points_issued == 1000, gross_ssp_cents == 1200, deferred_revenue_cents == 900"
            - "GET /point-lots?period_id=${per1_id} returns total_count == 2 - neither refused call left a row behind"
            - "GET /redemption-events?period_id=${per1_id} returns total_count == 0 - the refused redemption created nothing"
            - "Member.${m1_id}.point_balance == 2000 and AccountingPeriod.${per1_id}.issuance_deferred_cents == 1800, with AccountingPeriod.${per1_id}.state == OPEN and reopen_count == 0 unchanged throughout"
            - "GET /programs/${prog_id} and GET /point-lots/${lot1_id} both return 200 while the program is SUSPENDED - the gate is on writes only"

      - name: cross_entity_hard_close_requires_every_statement_settled
        grounds:
          - validations[priority=85]
          - errors[ERR_UNSETTLED_STATEMENTS]
          - state_machines.AccountingPeriod.SOFT_CLOSED_to_HARD_CLOSED
          - state_machines.SettlementStatement.ISSUED_to_PAID
          - entities.PartnerAgreement.fields.outstanding_settlement_cents
        distinguishing_aspect: |
          Hard-closing an AccountingPeriod depends on the state of a SIBLING
          subtree it does not own: every SettlementStatement of the period must
          sit in {PAID, WRITTEN_OFF, SUPERSEDED}. Nothing about the period itself
          changes between the refused and the accepted attempt - the unblocking
          event is a state transition on a different entity, driven by a different
          role, and that same operation also settles the period's partner point lots.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Settle Core' ACTIVE: ssp 1200, per_issuance_point_cap 5000, COHORT_WEIGHTED, historical_redemption_rate_bp 7500 (current_breakage_rate_bp 2500)."
            - "StateExpiryRule TX; Cohort C1 (observed 8200, adjustment 0); Member M1 BASE/TX in C1."
            - "PartnerAgreement PG: partner_code 'PG', THIRD_PARTY, issuance 900, redemption 1100, settlement_lag_days 30, net_settlement_enabled false, min_invoice_cents 1000, window [2026-08-01, 2026-12-31]."
            - "AccountingPeriod per1 OPEN over [2026-08-01, 2026-09-01) with one partner-issued BASE lot (base 4000 -> 4000 points, gross 4800, deferred 3600, settlement_state PENDING_SETTLEMENT)."
            - "BreakageEstimate est1 on per1 pinned to cohort C1 with a NON-EMPTY memo_narrative, band 7700/8700 -> rate 8200, breakage 1800, outstanding 4000 points / 4800 cents, required_liability 3936. Prepared by u_acct_1, APPROVED by u_ctrl_1."
            - "SettlementStatement st1 for (PG, per1) in state ISSUED: partner_issued_points 4000, issuance_receivable_cents 3600, partner_redeemed_points 0, redemption_payable_cents 0, GROSS, net_due_cents 3600, due_date 2026-10-01T00:00:00Z; PartnerAgreement.outstanding_settlement_cents is 3600."
            - "Clock advanced to 2026-09-01T00:00:00Z; per1 SOFT-CLOSED (issuance_deferred 3600, pre_catchup 3600, required 3936, catch_up 336, closing 3936, breakage_recognized -336)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Settle Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { program_id: "${prog_id}", partner_code: "PG", relationship_type: "THIRD_PARTY", issuance_rate_millicents_per_point: 900, redemption_rate_millicents_per_point: 1100, settlement_lag_days: 30, net_settlement_enabled: false, min_invoice_cents: 1000, effective_start_date: "2026-08-01T00:00:00Z", effective_end_date: "2026-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { pag_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", partner_agreement_id: "${pag_id}", base_points: 4000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", cohort_id: "${coh1_id}", memo_narrative: "Aug-2026 single-cohort estimate with partner issuance support", sensitivity_low_bp: 7700, sensitivity_high_bp: 8700 }
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
              captures: { est1_id: $.data.id }
            - call: "POST /breakage-estimates/${est1_id}/submit"
              payload: {}
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
              captures: { prog_v: $.data.version }
            - call: "POST /breakage-estimates/${est1_id}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: Controller
              as_user_id: "u_ctrl_1"
            - call: "GET /partner-agreements/${pag_id}"
              payload: {}
              as: LoyaltyAccountant
              captures: { pag_v: $.data.version }
            - call: "POST /settlement-statements"
              payload: { partner_agreement_id: "${pag_id}", period_id: "${per1_id}", expected_partner_agreement_version: "${pag_v}" }
              as: LoyaltyAccountant
              captures: { st1_id: $.data.id }
            - call: "POST /settlement-statements/${st1_id}/issue"
              payload: {}
              as: LoyaltyAccountant
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Controller
            - call: "POST /accounting-periods/${per1_id}/soft-close"
              payload: {}
              as: Controller
          trigger:
            - call: "POST /accounting-periods/${per1_id}/hard-close"
              payload: {}
              as: Controller
              captures: { err_unsettled: $.data.error_id }
            - call: "POST /settlement-statements/${st1_id}/pay"
              payload: {}
              as: Controller
            - call: "POST /accounting-periods/${per1_id}/hard-close"
              payload: {}
              as: Controller
          assert:
            - "The first hard-close returns HTTP 409 with error_id == ERR_UNSETTLED_STATEMENTS because SettlementStatement.${st1_id}.state == ISSUED"
            - "After the refusal AccountingPeriod.${per1_id}.state is still SOFT_CLOSED and its six close figures are unchanged (pre_catchup 3600, required 3936, catch_up 336, closing 3936, breakage_recognized -336, approved_estimate_rate_bp 8200)"
            - "The pay call returns 200: SettlementStatement.${st1_id}.state == PAID, paid_at == '2026-09-01T00:00:00Z', and PartnerAgreement.${pag_id}.outstanding_settlement_cents == 0 (was 3600)"
            - "The pay call also settles the sibling subtree: PointLot.${lot1_id}.settlement_state == SETTLED while lifecycle_state stays OUTSTANDING"
            - "The second hard-close returns 200 and AccountingPeriod.${per1_id}.state == HARD_CLOSED - nothing about the period changed between the two attempts"
            - "AccountingPeriod.${per1_id}.closing_liability_cents is still 3936 after hard-close - hard-close recomputes nothing"
            - "LoyaltyProgram.${prog_id}.recognized_breakage_ytd_cents == -336 both before and after hard-close, since SOFT_CLOSED and HARD_CLOSED are both inside the summed set"
            - "A further POST /point-lots into ${per1_id} now returns HTTP 409 with error_id == ERR_PERIOD_NOT_OPEN - priority 60 covers that endpoint, and ERR_PERIOD_HARD_CLOSED is not in its ladder"
            - "A further POST /settlement-statements for (${pag_id}, ${per1_id}) carrying the then-current agreement version returns HTTP 409 with error_id == ERR_PERIOD_HARD_CLOSED (priority 64) - the terminal state locks the settlement subtree"

  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: temporal_accounting_period_adjacent_allowed_overlap_rejected
        grounds:
          - validations[priority=75]
          - validations[priority=76]
          - errors[ERR_PERIOD_OVERLAP]
          - errors[ERR_INVALID_WINDOW]
          - entities.AccountingPeriod.fields.start_at
          - entities.AccountingPeriod.fields.end_at
        distinguishing_aspect: |
          AccountingPeriod windows are HALF-OPEN [start_at, end_at), so touching
          is legal and overlapping is not: a window starting exactly on another's
          end_at must be accepted, gaps must be accepted, and a window that
          begins one millisecond BEFORE an existing end_at must be refused. A
          degenerate window is caught one rung higher, so start_at >= end_at
          yields ERR_INVALID_WINDOW even when the same body also overlaps.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Window Core' ACTIVE with one StateExpiryRule TX and one Cohort C1; no AccountingPeriod exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Window Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per_aug_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-09", start_at: "2026-09-01T00:00:00Z", end_at: "2026-10-01T00:00:00Z" }
              as: Controller
              captures: { per_sep_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08X", start_at: "2026-08-31T23:59:59.999Z", end_at: "2026-09-15T00:00:00Z" }
              as: Controller
              captures: { err_overlap: $.data.error_id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-11", start_at: "2026-11-01T00:00:00Z", end_at: "2026-12-01T00:00:00Z" }
              as: Controller
              captures: { per_nov_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08Y", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { err_dup_window: $.data.error_id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08Z", start_at: "2026-08-15T00:00:00Z", end_at: "2026-08-01T00:00:00Z" }
              as: Controller
              captures: { err_degenerate: $.data.error_id }
          assert:
            - "CALL 1 returns 201: AccountingPeriod.${per_aug_id}.state == OPEN, start_at == '2026-08-01T00:00:00Z', end_at == '2026-09-01T00:00:00Z', reopen_count == 0"
            - "CALL 2 (ADJACENT) returns 201: its start_at equals CALL 1's end_at exactly, and touching windows do NOT overlap under the half-open rule"
            - "CALL 3 (OVERLAP BY ONE MILLISECOND) returns HTTP 409 with error_id == ERR_PERIOD_OVERLAP - 2026-08-31T23:59:59.999Z is still inside [2026-08-01, 2026-09-01)"
            - "CALL 4 (GAP) returns 201 even though October is left uncovered - gaps are explicitly permitted"
            - "CALL 5 (IDENTICAL WINDOW, DIFFERENT CODE) returns HTTP 409 with error_id == ERR_PERIOD_OVERLAP, not ERR_DUPLICATE_CODE - period_code '2026-08Y' is unused, so only the window rule at priority 76 is violated"
            - "CALL 6 (DEGENERATE, start_at > end_at) returns HTTP 409 with error_id == ERR_INVALID_WINDOW, not ERR_PERIOD_OVERLAP - priority 75 outranks 76 even though [2026-08-15, 2026-08-01) also collides with August"
            - "GET /accounting-periods?program_id=${prog_id} returns total_count == 3 - exactly the three accepted windows"
            - "The three rejected calls left no rows and did not increment any AccountingPeriod.version"

      - name: temporal_partner_agreement_window_needs_settlement_lag_buffer
        grounds:
          - validations[priority=77]
          - validations[priority=75]
          - errors[ERR_PARTNER_WINDOW_CONFLICT]
          - entities.PartnerAgreement.fields.effective_start_date
          - entities.PartnerAgreement.fields.effective_end_date
          - entities.PartnerAgreement.fields.settlement_lag_days
        distinguishing_aspect: |
          PartnerAgreement windows are CLOSED and must additionally be separated
          by the prior agreement's own settlement_lag_days, so the forbidden zone
          extends 30 days PAST the prior effective_end_date: a successor starting
          2026-07-30 (exactly prior end 2026-06-30 plus 30 days, inclusive) is
          refused while 2026-07-31 is accepted. The buffer is scoped per
          partner_code, so a different partner may reuse the identical window,
          and the degenerate-window rule still outranks the buffer rule.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Buffer Core' ACTIVE with one StateExpiryRule TX and one Cohort C1; no PartnerAgreement exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Buffer Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /partner-agreements"
              payload: { program_id: "${prog_id}", partner_code: "PG", relationship_type: "THIRD_PARTY", issuance_rate_millicents_per_point: 900, redemption_rate_millicents_per_point: 1100, settlement_lag_days: 30, net_settlement_enabled: false, min_invoice_cents: 1000, effective_start_date: "2026-01-01T00:00:00Z", effective_end_date: "2026-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { pg_first_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { program_id: "${prog_id}", partner_code: "PG", relationship_type: "THIRD_PARTY", issuance_rate_millicents_per_point: 900, redemption_rate_millicents_per_point: 1100, settlement_lag_days: 30, net_settlement_enabled: false, min_invoice_cents: 1000, effective_start_date: "2026-07-30T00:00:00Z", effective_end_date: "2026-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { err_buffer: $.data.error_id }
            - call: "POST /partner-agreements"
              payload: { program_id: "${prog_id}", partner_code: "PG", relationship_type: "THIRD_PARTY", issuance_rate_millicents_per_point: 900, redemption_rate_millicents_per_point: 1100, settlement_lag_days: 30, net_settlement_enabled: false, min_invoice_cents: 1000, effective_start_date: "2026-07-31T00:00:00Z", effective_end_date: "2026-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { pg_second_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { program_id: "${prog_id}", partner_code: "PH", relationship_type: "INTERCOMPANY", issuance_rate_millicents_per_point: 800, redemption_rate_millicents_per_point: 1000, settlement_lag_days: 30, net_settlement_enabled: true, min_invoice_cents: 0, effective_start_date: "2026-01-01T00:00:00Z", effective_end_date: "2026-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { program_id: "${prog_id}", partner_code: "PG", relationship_type: "THIRD_PARTY", issuance_rate_millicents_per_point: 900, redemption_rate_millicents_per_point: 1100, settlement_lag_days: 30, net_settlement_enabled: false, min_invoice_cents: 1000, effective_start_date: "2027-06-01T00:00:00Z", effective_end_date: "2027-05-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { err_degenerate_pg: $.data.error_id }
          assert:
            - "CALL 1 returns 201: PartnerAgreement.${pg_first_id}.status == ACTIVE, effective_end_date == '2026-06-30T00:00:00Z', settlement_lag_days == 30, outstanding_settlement_cents == 0"
            - "CALL 2 returns HTTP 409 with error_id == ERR_PARTNER_WINDOW_CONFLICT: 2026-06-30 plus 30 days is 2026-07-30, and the buffer is inclusive of that day"
            - "CALL 2 does NOT return ERR_INVALID_WINDOW - its own window is perfectly well formed; the conflict is entirely relational"
            - "CALL 3 returns 201 for the SAME partner_code one day later: PartnerAgreement.${pg_second_id}.effective_start_date == '2026-07-31T00:00:00Z' and status == ACTIVE"
            - "CALL 4 returns 201: partner_code 'PH' may occupy [2026-01-01, 2026-06-30], byte-identical to PG's first window, because the buffer is scoped per partner_code"
            - "PartnerAgreement.${ph_id}.relationship_type == INTERCOMPANY and net_settlement_enabled == true - the buffer rule is indifferent to relationship_type and netting"
            - "CALL 5 returns HTTP 409 with error_id == ERR_INVALID_WINDOW (effective_start_date 2027-06-01 >= effective_end_date 2027-05-01), priority 75 firing before the buffer check at 77"
            - "GET /partner-agreements?program_id=${prog_id} returns total_count == 3, and GET /partner-agreements?partner_code=PG returns total_count == 2"
            - "PartnerAgreement.${pg_first_id}.status is still ACTIVE - creating a successor agreement never terminates or suspends its predecessor"

  # ===========================================================================
  # RULE 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: compensating_redemption_reverse_conserves_lot_points
        grounds:
          - state_machines.RedemptionEvent.FULFILLED_to_REVERSED
          - state_machines.PointLot.PARTIALLY_REDEEMED_to_OUTSTANDING
          - entities.RedemptionAllocation.fields.entry_type
          - entities.RedemptionAllocation.fields.points_allocated
          - endpoints[POST /redemption-events/{id}/reverse]
          - entities.AccountingPeriod.fields.redemption_recognized_cents
        distinguishing_aspect: |
          Reversal is APPEND-ONLY compensation, never mutation: the original
          ALLOCATION row survives verbatim and a mirror REVERSAL row with negated
          points, negated provisional cents and negated final cents is appended,
          so the ledger identity
          sum(RedemptionAllocation.points_allocated for a lot) ==
          points_issued - points_remaining
          holds before (3000 == 5000 - 2000) and after (0 == 5000 - 5000) with
          points_issued never touched. Both the provisional leg (2700) and the
          final remeasurement leg (107) unwind to exactly zero on the period, so
          there is no residual drift in either column.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Reverse Core' ACTIVE: ssp 1200, expiry 730 days, per_issuance_point_cap 5000, tier_multiplier_bp {BASE 10000, SILVER 10300, GOLD 12500, PLATINUM 15000}, promo cap 30000, COHORT_WEIGHTED, historical_redemption_rate_bp 7500."
            - "StateExpiryRule TX; Cohort C1 (observed 8200, adjustment 0) and Cohort C2 (observed 400, adjustment -300, clamping up to the 200 bp floor); Member M1 GOLD/TX in C1 and Member M2 SILVER/TX in C2."
            - "AccountingPeriod per1 OPEN over [2026-08-01, 2026-09-01)."
            - "lot1 for M1: base 4000, GOLD -> 5000 points, gross 6000, deferred 4500, breakage_rate_bp_at_issue 2500. lot2 for M2: base 250, SILVER, promo 10300 -> 266 points, gross 319, deferred 239."
            - "BreakageEstimate est1 on per1, band 7296/8296, prepared by u_acct_1 and APPROVED by u_ctrl_1 -> rate 7796, so program.current_breakage_rate_bp is 2204."
            - "RedemptionEvent rev1 for M1: 3000 CATALOG points, ALLOCATED then FULFILLED. One ALLOCATION row against lot1: points_allocated 3000, line_gross_ssp_cents 3600, provisional_release_cents 2700, final_release_cents 2807. lot1 is PARTIALLY_REDEEMED with points_remaining 2000; per1.redemption_recognized_cents is 2700 and per1.remeasurement_delta_cents is 107."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Reverse Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C2", enrollment_start_date: "2025-01-01T00:00:00Z", enrollment_end_date: "2025-12-31T00:00:00Z", observed_redemption_rate_bp: 400, sample_size: 9000, program_change_adjustment_bp: -300 }
              as: ProgramAdmin
              captures: { coh2_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "GOLD" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh2_id}", external_member_ref: "M2", state_code: "TX", tier: "SILVER" }
              as: LoyaltyAccountant
              captures: { m2_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 4000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m2_id}", period_id: "${per1_id}", base_points: 250, promo_multiplier_bp: 10300 }
              as: LoyaltyAccountant
              captures: { lot2_id: $.data.id }
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", memo_narrative: "Aug-2026 cohort-weighted estimate", sensitivity_low_bp: 7296, sensitivity_high_bp: 8296 }
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
              captures: { est1_id: $.data.id }
            - call: "POST /breakage-estimates/${est1_id}/submit"
              payload: {}
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
              captures: { prog_v: $.data.version }
            - call: "POST /breakage-estimates/${est1_id}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: Controller
              as_user_id: "u_ctrl_1"
            - call: "POST /redemption-events"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", points_requested: 3000, redemption_type: "CATALOG" }
              as: LoyaltyAccountant
              captures: { rev1_id: $.data.id }
            - call: "POST /redemption-events/${rev1_id}/allocate"
              payload: {}
              as: LoyaltyAccountant
            - call: "POST /redemption-events/${rev1_id}/fulfill"
              payload: {}
              as: LoyaltyAccountant
          trigger:
            - call: "POST /redemption-events/${rev1_id}/reverse"
              payload: { reversal_reason: "Catalogue order cancelled before shipment" }
              as: LoyaltyAccountant
          assert:
            - "The reverse call returns 200 and RedemptionEvent.${rev1_id}.state == REVERSED (terminal) with reversal_reason == 'Catalogue order cancelled before shipment'"
            - "GET /redemption-events/${rev1_id}/allocations returns total_count == 2 - the original row was NOT edited or deleted"
            - "The surviving ALLOCATION row is unchanged: entry_type ALLOCATION, point_lot_id == ${lot1_id}, points_allocated 3000, line_gross_ssp_cents 3600, provisional_release_cents 2700, final_release_cents 2807"
            - "The appended row is entry_type REVERSAL against the same point_lot_id ${lot1_id} with points_allocated -3000, line_gross_ssp_cents -3600, provisional_release_cents -2700, final_release_cents -2807"
            - "GET /redemption-events/${rev1_id}/allocations?entry_type=REVERSAL returns total_count == 1 and ?entry_type=ALLOCATION returns total_count == 1"
            - "INVARIANT: sum of points_allocated over GET /point-lots/${lot1_id}/allocations == 0, which equals points_issued 5000 minus points_remaining 5000"
            - "PointLot.${lot1_id}.lifecycle_state == OUTSTANDING (back from PARTIALLY_REDEEMED), points_remaining == 5000, points_issued == 5000 (never touched), gross_ssp_cents == 6000, deferred_revenue_cents == 4500"
            - "PointLot.${lot1_id}.breakage_rate_bp_at_issue is still 2500 - the reversal does not re-stamp the frozen issue-time rate"
            - "AccountingPeriod.${per1_id}.redemption_recognized_cents == 0 (2700 minus 2700) and remeasurement_delta_cents == 0 (107 minus 107) - both legs unwind, with no residue in either column"
            - "AccountingPeriod.${per1_id}.issuance_deferred_cents is still 4739 - reversal touches only the redemption and remeasurement columns"
            - "Member.${m1_id}.point_balance == 5000 and PointLot.${lot2_id} is untouched (points_remaining 266, OUTSTANDING)"
            - "LoyaltyProgram.${prog_id}.current_breakage_rate_bp is still 2204 and BreakageEstimate.${est1_id}.state is still APPROVED with required_liability_cents 4926 - the estimate snapshot is historical and is never restated by a reversal"

      - name: compensating_period_reopen_conserves_program_recognized_breakage
        grounds:
          - state_machines.AccountingPeriod.SOFT_CLOSED_to_OPEN
          - endpoints[POST /accounting-periods/{id}/reopen]
          - entities.LoyaltyProgram.fields.recognized_breakage_ytd_cents
          - entities.AccountingPeriod.fields.reopen_count
          - calculations.period_close_rollforward
        distinguishing_aspect: |
          Soft-close and reopen are exact inverses at the PROGRAM level even though
          the catch-up they book is a NEGATIVE breakage recognition: closing
          September pushes recognized_breakage_ytd_cents from -188 to -42 (a
          +146 catch-up because the re-estimated rate 7261 needs LESS liability
          than the carried-forward 2120), and the reopen returns it to exactly
          -188 with zero drift - because that program figure is derived by summing
          only periods in {SOFT_CLOSED, HARD_CLOSED} rather than being incremented
          in place. August, already HARD_CLOSED, stays in the sum untouched
          throughout, so the test also proves the compensation is scoped to the
          reopened period alone.
        test_recipe:
          setup:
            - "Full 'Rewards Core' August chain: program ACTIVE (ssp 1200, expiry 730, cap 5000, GOLD 12500 / SILVER 10300, COHORT_WEIGHTED, historical_redemption_rate_bp 7500); rule TX; cohorts C1 (8200, adj 0) and C2 (400, adj -300); members M1 GOLD/TX in C1 and M2 SILVER/TX in C2."
            - "per1 [2026-08-01, 2026-09-01) with lot1 (base 4000 -> 5000 points, gross 6000, deferred 4500) and lot2 (base 250, promo 10300 -> 266 points, gross 319, deferred 239)."
            - "BreakageEstimate E1 (band 7296/8296, rate 7796, breakage 2204, outstanding 5266 points / 6319 cents, required 4926) prepared by u_acct_1 and APPROVED by u_ctrl_1."
            - "RedemptionEvent rev1: 3000 CATALOG points ALLOCATED (2700) then FULFILLED (final 2807, delta 107); lot1 left with 2000 points."
            - "Clock 2026-09-01; per1 SOFT-CLOSED (issuance_deferred 4739, redemption 2700, remeasurement 107, pre_catchup 1932, required 2120, catch_up 188, closing 2120, breakage_recognized -188) and then HARD-CLOSED - there are no settlement statements and E1's memo is non-empty."
            - "per2 [2026-09-01, 2026-10-01) OPEN with no activity of its own."
            - "BreakageEstimate E2 on per2 (band 6761/7761, weights C1 2000 and C2 266 -> rate 7261, breakage 2739, outstanding 2266 points / 2719 cents, required 1974) prepared by u_acct_1, SUBMITTED and APPROVED by u_ctrl_1. Because per1 is HARD_CLOSED the forced-reopen cascade does NOT fire; E1 simply becomes SUPERSEDED and program.current_breakage_rate_bp becomes 2739."
            - "LoyaltyProgram.recognized_breakage_ytd_cents is -188 at the start of the trigger. Clock advanced to 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Rewards Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C2", enrollment_start_date: "2025-01-01T00:00:00Z", enrollment_end_date: "2025-12-31T00:00:00Z", observed_redemption_rate_bp: 400, sample_size: 9000, program_change_adjustment_bp: -300 }
              as: ProgramAdmin
              captures: { coh2_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "GOLD" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh2_id}", external_member_ref: "M2", state_code: "TX", tier: "SILVER" }
              as: LoyaltyAccountant
              captures: { m2_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 4000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m2_id}", period_id: "${per1_id}", base_points: 250, promo_multiplier_bp: 10300 }
              as: LoyaltyAccountant
              captures: { lot2_id: $.data.id }
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", memo_narrative: "Aug-2026 cohort-weighted estimate", sensitivity_low_bp: 7296, sensitivity_high_bp: 8296 }
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
              captures: { e1_id: $.data.id }
            - call: "POST /breakage-estimates/${e1_id}/submit"
              payload: {}
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
              captures: { prog_v1: $.data.version }
            - call: "POST /breakage-estimates/${e1_id}/approve"
              payload: { expected_program_version: "${prog_v1}" }
              as: Controller
              as_user_id: "u_ctrl_1"
            - call: "POST /redemption-events"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", points_requested: 3000, redemption_type: "CATALOG" }
              as: LoyaltyAccountant
              captures: { rev1_id: $.data.id }
            - call: "POST /redemption-events/${rev1_id}/allocate"
              payload: {}
              as: LoyaltyAccountant
            - call: "POST /redemption-events/${rev1_id}/fulfill"
              payload: {}
              as: LoyaltyAccountant
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Controller
            - call: "POST /accounting-periods/${per1_id}/soft-close"
              payload: {}
              as: Controller
            - call: "POST /accounting-periods/${per1_id}/hard-close"
