            - "GET /pool-assignments?trip_request_id=${t1_id} returns exactly 1 row with state == OFFERED"

      - name: pool_assignment_offered_branch_accept_vs_decline_side_effect_sets_diverge
        grounds:
          - state_machines.PoolAssignment.state.OFFERED_to_ACCEPTED
          - state_machines.PoolAssignment.state.OFFERED_to_DECLINED
          - entities.VehicleBlock.fields.seats_committed
          - entities.Driver.fields.consecutive_decline_count
        distinguishing_aspect: |
          Branching shape: two structurally identical OFFERED assignments on the same block take the
          two outgoing edges and produce disjoint side-effect sets — accept holds the 2 committed
          seats and zeroes the driver's decline counter and leaves the trip's fare axis at QUOTED,
          while decline gives back its 1 seat, increments the decline counter to 1, returns the trip
          to MATCHING and resets its fare axis to UNPRICED with quoted_fare_cents null.
