          - calculations.area_water_quality_statistics
          - endpoints[GET /shellfish/growing-areas/{id}/water-samples]
        distinguishing_aspect: |
          WaterSample declares common_fields: false and §1.5 offers no update or delete endpoint, so a
          correction is expressed by INSERTING a second row for the same station_code and calendar
          date: the earlier row keeps fecal_coliform_mpn 5 and only its sample_status flips to
          SUPERSEDED, which drops it out of the statistics window.
        test_recipe:
          setup:
            - "GrowingArea GA-114 with default configuration."
            - "One WaterSample at station ST-1 collected 2026-07-10T09:00:00Z with fecal_coliform_mpn 5, sample_status ACCEPTED, so accepted_sample_count is 1."
