    path: "/staging/pull-lines/{pull_line_id}"
    description: "Read one pull line."
    roles: [PlatformAdmin, WarehouseManager, StagingCoordinator]
    code: 200
    input: []
    output: PullLine
    side_effects: []
  - method: POST
    path: "/staging/pulls/{pull_id}/submit"
    description: "Run the allocation pass. Candidate set for an OWNED line = InventoryItem rows with status AVAILABLE and matching category; ranking acquired_at ASC; tie-break created_at ASC; empty set leaves the line UNFILLED."
    roles: [WarehouseManager]
    code: 200
    input: []
    output: InventoryPull
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G5_GLOBAL_FREEZE, G6_STATE_PRECONDITION, G9_CONSTRAINT_AND_CAPACITY]
    side_effects: ["each REQUESTED/UNFILLED line becomes ALLOCATED or UNFILLED", "each allocated OWNED InventoryItem AVAILABLE -> RESERVED", "PullLine.monthly_rate := calculations.line_monthly_rate", "fill_rate recomputed", "InventoryPull -> SUBMITTED or PARTIAL", "resubmit_count += 1 when re-submitting from PARTIAL", "InventoryPull.version += 1"]
  - method: POST
    path: "/staging/pulls/{pull_id}/commit"
    description: "Commit the pull. OCC-guarded on the parent Project's version."
    roles: [WarehouseManager]
    code: 200
    input: [expected_project_version]
    output: InventoryPull
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G5_GLOBAL_FREEZE, G6_STATE_PRECONDITION, G7_OPTIMISTIC_CONCURRENCY, G9_CONSTRAINT_AND_CAPACITY]
    side_effects: ["InventoryPull SUBMITTED/PARTIAL -> COMMITTED with committed_at set", "every UNFILLED line -> DROPPED", "Project RESTAGE_REQUIRED -> STAGED when re-staging", "increments Project.version by 1", "InventoryPull.version += 1"]
