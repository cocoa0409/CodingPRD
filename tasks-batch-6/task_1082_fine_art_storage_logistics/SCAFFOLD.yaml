# =============================================================================
# Fine-Art Storage & Logistics — SCAFFOLD (§1.0–§1.7)
# =============================================================================

scenario: "Fine-Art Storage & Logistics: crate & condition report, climate-vault & inventory, transport/install & rigging, loan/exhibition & COA, insurance & appraisal, viewing-room, customs (ATA carnet), billing"
domain_name: fine-art-storage-logistics
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  # flat: peer entities linked by foreign keys; every collection is top-level
  # under api_prefix "/"; no deep URL nesting. Cross-entity coupling is carried
  # by FK body fields, not by URL ancestry.
  state_machine_shape: parallel
  # Artwork carries two independent dimensions (custody_status × condition_status);
  # LoanAgreement is cyclic (SUBMITTED→DRAFT revision loop); others branch/revert.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  # LoanAgreement approve enforces approver.user_id != submitter.user_id.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Client / owner name" }
      - { name: client_type, type: enum, source: input, description: "Ownership type", constraints: "INDIVIDUAL | INSTITUTION | DEALER" }
      - { name: billing_email, type: string, source: input, description: "Billing contact email" }
      - { name: credit_terms_days, type: integer, source: input, default: 30, description: "Net payment terms in days" }
      - { name: account_status, type: enum, source: system, default: ACTIVE, description: "Account lifecycle", constraints: "ACTIVE | SUSPENDED" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over this client's Invoices in ISSUED status (conserved ledger; see §1.3 client_outstanding_balance)" }

  - name: Vault
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vault label" }
      - { name: climate_class, type: enum, source: input, description: "Climate zone the vault maintains", constraints: "AMBIENT | COOL | COLD" }
      - { name: capacity_slots, type: integer, source: input, description: "Total artwork slots", constraints: ">= 1" }
      - { name: occupied_slots, type: integer, source: computed, default: 0, description: "Count of StoragePlacement rows with status ACTIVE and this vault_id (see §1.3 vault_occupancy)" }
      - { name: temp_setpoint_c, type: number, source: input, default: 20, description: "Temperature setpoint in Celsius" }
      - { name: humidity_setpoint_pct, type: number, source: input, default: 50, description: "Relative humidity setpoint percent" }
      - { name: status, type: enum, source: system, default: OPERATIONAL, description: "Vault lifecycle", constraints: "OPERATIONAL | MAINTENANCE | DECOMMISSIONED" }

  - name: Artwork
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the owning client" }
      - { name: title, type: string, source: input, description: "Artwork title" }
      - { name: artist, type: string, source: input, description: "Artist name" }
      - { name: medium, type: string, source: input, description: "Physical medium (oil on canvas, bronze, etc.)" }
      - { name: year, type: integer, source: input, description: "Year created" }
      - { name: size_class, type: enum, source: input, description: "Physical size band (drives storage size multiplier)", constraints: "SMALL | MEDIUM | LARGE" }
      - { name: fragility_class, type: enum, source: input, description: "Conservation fragility band (drives insurance multiplier)", constraints: "LOW | MEDIUM | HIGH" }
      - { name: climate_class, type: enum, source: input, description: "Required storage climate; must match Vault.climate_class to place", constraints: "AMBIENT | COOL | COLD" }
      - { name: custody_status, type: enum, source: system, default: IN_INTAKE, description: "Custody dimension (§1.2 Artwork-custody)", constraints: "IN_INTAKE | IN_STORAGE | IN_TRANSIT | ON_LOAN | DEACCESSIONED" }
      - { name: condition_status, type: enum, source: system, default: SOUND, description: "Condition dimension (§1.2 Artwork-condition); evolves independently of custody", constraints: "SOUND | MINOR_DAMAGE | MAJOR_DAMAGE" }
      - { name: appraised_value_cents, type: integer, source: computed, default: 0, description: "appraised_value_cents of the latest FINALIZED Appraisal for this artwork (0 if none)" }
      - { name: active_policy_id, type: string, source: computed, description: "id of the current ACTIVE InsurancePolicy for this artwork, else null" }

  - name: StoragePlacement
    parent: null
    common_fields: true
    fields:
      - { name: artwork_id, type: string, source: input, description: "FK -> Artwork.id; the placed artwork" }
      - { name: vault_id, type: string, source: input, description: "FK -> Vault.id; the occupied vault" }
      - { name: start_at, type: datetime, source: input, description: "Placement start (ISO8601 UTC)" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Planned end used for the provisional fee projection" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock time at RELEASE; drives the final fee" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Forward-looking fee to scheduled_end_at (§1.3 storage_fee, provisional variant)" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Chronological fee to released_at (§1.3 storage_fee, final variant); null until RELEASED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Placement lifecycle", constraints: "ACTIVE | SUSPENDED | RELEASED" }

  - name: ConditionReport
    parent: null
    common_fields: false
    fields:
      - { name: artwork_id, type: string, source: input, description: "FK -> Artwork.id; the inspected artwork" }
      - { name: report_type, type: enum, source: input, description: "Inspection context", constraints: "INTAKE | PRE_TRANSIT | POST_TRANSIT | PERIODIC | LOAN_RETURN" }
      - { name: condition_grade, type: enum, source: input, description: "Assessed grade; drives Artwork.condition_status transition", constraints: "A | B | C | D | F" }
      - { name: damage_noted, type: boolean, source: input, description: "Whether new damage was observed" }
      - { name: notes, type: string, source: input, description: "Free-text observations" }

  - name: Crate
    parent: null
    common_fields: true
    fields:
      - { name: artwork_id, type: string, source: input, description: "FK -> Artwork.id; the artwork this crate is built for" }
      - { name: crate_type, type: enum, source: input, description: "Crate construction", constraints: "SOFT | HARD | CLIMATE" }
      - { name: internal_length_cm, type: number, source: input, description: "Interior length (cm)" }
      - { name: internal_width_cm, type: number, source: input, description: "Interior width (cm)" }
      - { name: internal_height_cm, type: number, source: input, description: "Interior height (cm)" }
      - { name: status, type: enum, source: system, default: BUILDING, description: "Crate lifecycle", constraints: "BUILDING | READY | IN_USE | RETIRED" }

  - name: RiggingCrew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Crew label" }
      - { name: crew_size, type: integer, source: input, description: "Number of riggers" }
      - { name: certification_level, type: enum, source: input, description: "Handling certification", constraints: "STANDARD | FINE_ART | MONUMENTAL" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "Crew availability", constraints: "AVAILABLE | OFFLINE" }

  - name: TransportJob
    parent: null
    common_fields: true
    fields:
      - { name: artwork_id, type: string, source: input, description: "FK -> Artwork.id; the artwork being moved" }
      - { name: crate_id, type: string, source: input, description: "FK -> Crate.id; the crate used for the move" }
      - { name: crew_id, type: string, source: input, description: "FK -> RiggingCrew.id; the assigned crew (temporal-exclusive resource)" }
      - { name: origin_location, type: string, source: input, description: "Pickup location label" }
      - { name: destination_location, type: string, source: input, description: "Drop-off location label" }
      - { name: scheduled_start, type: datetime, source: input, description: "Job window start (ISO8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Job window end (ISO8601 UTC)" }
      - { name: requires_rigging, type: boolean, source: input, description: "Whether specialist rigging is required" }
      - { name: estimated_hours, type: number, source: input, description: "Estimated labor hours (drives estimated charge)" }
      - { name: actual_hours, type: number, source: system, description: "Actual labor hours logged at COMPLETED" }
      - { name: transport_charge_cents, type: integer, source: computed, description: "Charge for the move (§1.3 transport_charge); estimated at schedule, finalized at COMPLETED" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Job lifecycle", constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: Appraisal
    parent: null
    common_fields: true
    fields:
      - { name: artwork_id, type: string, source: input, description: "FK -> Artwork.id; the appraised artwork" }
      - { name: method, type: enum, source: input, description: "Valuation method (dual-variant §1.3 appraisal_value)", constraints: "FAIR_MARKET | REPLACEMENT" }
      - { name: comparable_base_cents, type: integer, source: input, description: "Base comparable value in cents" }
      - { name: replacement_multiplier, type: number, source: input, default: 1.0, description: "Multiplier applied only under REPLACEMENT method" }
      - { name: restoration_reserve_cents, type: integer, source: input, default: 0, description: "Additive reserve applied only under REPLACEMENT method" }
      - { name: appraiser_name, type: string, source: input, description: "Appraiser name" }
      - { name: appraised_value_cents, type: integer, source: computed, description: "Computed value per method (§1.3 appraisal_value)" }
      - { name: status, type: enum, source: system, default: FINALIZED, description: "Appraisal lifecycle; a newer appraisal supersedes prior FINALIZED", constraints: "FINALIZED | SUPERSEDED" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: artwork_id, type: string, source: input, description: "FK -> Artwork.id; the covered artwork" }
      - { name: coverage_type, type: enum, source: input, description: "Coverage scope (drives premium multiplier)", constraints: "STORAGE_ONLY | TRANSIT | ALL_RISK" }
      - { name: insured_value_cents, type: integer, source: input, description: "Declared insured value in cents" }
      - { name: effective_start, type: datetime, source: input, description: "Coverage start (ISO8601 UTC)" }
      - { name: effective_end, type: datetime, source: input, description: "Coverage end (ISO8601 UTC)" }
      - { name: premium_cents, type: integer, source: computed, description: "Computed premium (§1.3 insurance_premium)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Policy lifecycle; created ACTIVE, superseded by a newer policy for the artwork", constraints: "ACTIVE | CANCELLED | SUPERSEDED | LAPSED" }

  - name: LoanAgreement
    parent: null
    common_fields: true
    fields:
      - { name: artwork_id, type: string, source: input, description: "FK -> Artwork.id; the loaned artwork" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the lending owner" }
      - { name: borrower_name, type: string, source: input, description: "Borrowing institution" }
      - { name: exhibition_name, type: string, source: input, description: "Exhibition title" }
      - { name: loan_start, type: datetime, source: input, description: "Loan window start" }
      - { name: loan_end, type: datetime, source: input, description: "Loan window end" }
      - { name: is_international, type: boolean, source: input, description: "Whether the loan crosses customs (requires ATA carnet to activate)" }
      - { name: required_value_cents, type: integer, source: input, description: "Insurance coverage required by the borrower" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID recorded on SUBMITTED; used for segregation-of-duties on approve" }
      - { name: coa_issued, type: boolean, source: computed, default: false, description: "Certificate-of-Authenticity issued on APPROVED" }
      - { name: coa_number, type: string, source: computed, description: "COA serial assigned on APPROVED, else null" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Loan lifecycle (cyclic SUBMITTED<->DRAFT)", constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | ACTIVE | RETURNED | CANCELLED" }

  - name: Carnet
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> LoanAgreement.id; the loan this ATA carnet covers" }
      - { name: carnet_number, type: string, source: input, description: "ATA carnet serial number" }
      - { name: countries, type: array, source: input, description: "ISO country codes covered by the carnet" }
      - { name: validity_start, type: datetime, source: input, description: "Carnet validity start" }
      - { name: validity_end, type: datetime, source: input, description: "Carnet validity end" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "Carnet lifecycle", constraints: "ISSUED | ACTIVATED | DISCHARGED | EXPIRED" }

  - name: ViewingRoom
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Viewing room label" }
      - { name: capacity_persons, type: integer, source: input, description: "Max occupancy" }
      - { name: status, type: enum, source: system, default: OPERATIONAL, description: "Room lifecycle", constraints: "OPERATIONAL | CLOSED" }

  - name: ViewingBooking
    parent: null
    common_fields: true
    fields:
      - { name: artwork_id, type: string, source: input, description: "FK -> Artwork.id; artwork to be viewed" }
      - { name: viewing_room_id, type: string, source: input, description: "FK -> ViewingRoom.id; the booked room (temporal-exclusive resource)" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the requesting client" }
      - { name: scheduled_start, type: datetime, source: input, description: "Booking window start (ISO8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Booking window end (ISO8601 UTC)" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "Booking lifecycle", constraints: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED | NO_SHOW" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the billed client" }
      - { name: billing_period_start, type: datetime, source: input, description: "Billing period start" }
      - { name: billing_period_end, type: datetime, source: input, description: "Billing period end" }
      - { name: line_items, type: array, source: computed, description: "Array of {description, amount_cents}: auto-aggregated RELEASED-placement and COMPLETED-transport charges in the period plus any manual_line_items" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_items[].amount_cents (§1.3 invoice_total)" }
      - { name: tax_cents, type: integer, source: computed, description: "Tax on the subtotal (§1.3 invoice_total, pinned rounding order)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + tax_cents" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Invoice lifecycle", constraints: "DRAFT | ISSUED | PAID | VOID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Client -------------------------------------------------------------
  - entity: Client
    initial_state: ACTIVE
    terminal_states: []
    dimension: account_status
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clients/{id}/state {to_status: SUSPENDED}"
        actor: Registrar
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clients/{id}/state {to_status: ACTIVE}"
        actor: Registrar
        preconditions: []
        side_effects: []

  # ---- Vault --------------------------------------------------------------
  - entity: Vault
    initial_state: OPERATIONAL
    terminal_states: [DECOMMISSIONED]
    dimension: status
    transitions:
      - from: OPERATIONAL
        to: MAINTENANCE
        trigger: "POST /vaults/{id}/state {to_status: MAINTENANCE}"
        actor: Registrar
        preconditions: []
        side_effects: []
      - from: MAINTENANCE
        to: OPERATIONAL
        trigger: "POST /vaults/{id}/state {to_status: OPERATIONAL}"
        actor: Registrar
        preconditions: []
        side_effects: []
      - from: OPERATIONAL
        to: DECOMMISSIONED
        trigger: "POST /vaults/{id}/state {to_status: DECOMMISSIONED}"
        actor: Registrar
        preconditions:
          - "occupied_slots == 0 (else ERR_INVALID_STATE)"
        side_effects: []

  # ---- Artwork: custody dimension (parallel axis 1) -----------------------
  - entity: Artwork
    initial_state: IN_INTAKE
    terminal_states: [DEACCESSIONED]
    dimension: custody_status
    transitions:
      - from: IN_INTAKE
        to: IN_STORAGE
        trigger: "system: a StoragePlacement for this artwork becomes ACTIVE"
        actor: system
        preconditions: []
        side_effects: []
        note: "custody moves to IN_STORAGE the first time the artwork occupies a vault slot"
      - from: IN_STORAGE
        to: IN_TRANSIT
        trigger: "system: TransportJob SCHEDULED -> IN_PROGRESS for this artwork"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: IN_STORAGE
        trigger: "system: TransportJob IN_PROGRESS -> COMPLETED for this artwork"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_STORAGE
        to: ON_LOAN
        trigger: "system: LoanAgreement APPROVED -> ACTIVE for this artwork"
        actor: system
        preconditions: []
        side_effects:
          - "the artwork's ACTIVE StoragePlacement transitions ACTIVE -> SUSPENDED (cascade; decrements vault.occupied_slots)"
      - from: ON_LOAN
        to: IN_STORAGE
        trigger: "system: LoanAgreement ACTIVE -> RETURNED for this artwork"
        actor: system
        preconditions: []
        side_effects:
          - "the artwork's SUSPENDED StoragePlacement transitions SUSPENDED -> ACTIVE (cascade; increments vault.occupied_slots)"
      - from: IN_STORAGE
        to: DEACCESSIONED
        trigger: "POST /artworks/{id}/state {to_status: DEACCESSIONED}"
        actor: Registrar
        preconditions:
          - "custody_status == IN_STORAGE (else ERR_INVALID_STATE)"
        side_effects: []

  # ---- Artwork: condition dimension (parallel axis 2) ---------------------
  - entity: Artwork
    initial_state: SOUND
    terminal_states: []
    dimension: condition_status
    transitions:
      - from: SOUND
        to: MINOR_DAMAGE
        trigger: "system: ConditionReport created with condition_grade in {C, D} and damage_noted=true"
        actor: system
        preconditions: []
        side_effects: []
      - from: SOUND
        to: MAJOR_DAMAGE
        trigger: "system: ConditionReport created with condition_grade F and damage_noted=true"
        actor: system
        preconditions: []
        side_effects:
          - "any LoanAgreement for this artwork in {APPROVED, ACTIVE} transitions to CANCELLED (cascade); a CANCELLED loan's non-terminal Carnet transitions to DISCHARGED"
      - from: MINOR_DAMAGE
        to: MAJOR_DAMAGE
        trigger: "system: ConditionReport created with condition_grade F and damage_noted=true"
        actor: system
        preconditions: []
        side_effects:
          - "any LoanAgreement for this artwork in {APPROVED, ACTIVE} transitions to CANCELLED (cascade); a CANCELLED loan's non-terminal Carnet transitions to DISCHARGED"
      - from: MINOR_DAMAGE
        to: SOUND
        trigger: "system: ConditionReport created with condition_grade A and damage_noted=false"
        actor: system
        preconditions: []
        side_effects: []

  # ---- StoragePlacement ---------------------------------------------------
  - entity: StoragePlacement
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    dimension: status
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: owning artwork goes ON_LOAN"
        actor: system
        preconditions: []
        side_effects:
          - "decrements vault.occupied_slots by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: owning artwork returns to IN_STORAGE"
        actor: system
        preconditions:
          - "vault.occupied_slots < vault.capacity_slots (else ERR_VAULT_FULL)"
        side_effects:
          - "increments vault.occupied_slots by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /storage-placements/{id}/state {to_status: RELEASED}"
        actor: Registrar
        preconditions: []
        side_effects:
          - "sets released_at = current logical clock time"
          - "computes final_fee_cents (§1.3 storage_fee final variant)"
          - "decrements vault.occupied_slots by 1"
      - from: SUSPENDED
        to: RELEASED
        trigger: "POST /storage-placements/{id}/state {to_status: RELEASED}"
        actor: Registrar
        preconditions: []
        side_effects:
          - "sets released_at = current logical clock time"
          - "computes final_fee_cents (§1.3 storage_fee final variant)"
          - "no vault.occupied_slots change (slot was already released on SUSPEND)"

  # ---- Crate --------------------------------------------------------------
  - entity: Crate
    initial_state: BUILDING
    terminal_states: [RETIRED]
    dimension: status
    transitions:
      - from: BUILDING
        to: READY
        trigger: "POST /crates/{id}/state {to_status: READY}"
        actor: Coordinator
        preconditions: []
        side_effects: []
      - from: READY
        to: IN_USE
        trigger: "system: TransportJob SCHEDULED -> IN_PROGRESS using this crate"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_USE
        to: READY
        trigger: "system: TransportJob IN_PROGRESS -> COMPLETED using this crate"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: RETIRED
        trigger: "POST /crates/{id}/state {to_status: RETIRED}"
        actor: Coordinator
        preconditions: []
        side_effects: []

  # ---- TransportJob -------------------------------------------------------
  - entity: TransportJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    dimension: status
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /transport-jobs/{id}/state {to_status: IN_PROGRESS}"
        actor: Coordinator
        preconditions:
          - "artwork.custody_status == IN_STORAGE (else ERR_ARTWORK_NOT_AVAILABLE) — cross-entity dependency TransportJob->Artwork"
          - "artwork.condition_status != MAJOR_DAMAGE (else ERR_ARTWORK_CONDITION_UNSAFE)"
          - "crate.status == READY and crate.artwork_id == artwork_id (else ERR_CRATE_NOT_READY)"
        side_effects:
          - "artwork.custody_status IN_STORAGE -> IN_TRANSIT (cascade)"
          - "crate.status READY -> IN_USE (cascade)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /transport-jobs/{id}/state {to_status: COMPLETED, actual_hours}"
        actor: Coordinator
        preconditions:
          - "actual_hours present (else ERR_VALIDATION)"
        side_effects:
          - "sets actual_hours; recomputes transport_charge_cents (§1.3 transport_charge final variant)"
          - "artwork.custody_status IN_TRANSIT -> IN_STORAGE (cascade)"
          - "crate.status IN_USE -> READY (cascade)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /transport-jobs/{id}/state {to_status: CANCELLED}"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "releases the crew reservation for the job window"

  # ---- Appraisal ----------------------------------------------------------
  - entity: Appraisal
    initial_state: FINALIZED
    terminal_states: [SUPERSEDED]
    dimension: status
    transitions:
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system: a newer Appraisal is created for the same artwork"
        actor: system
        preconditions: []
        side_effects: []

  # ---- InsurancePolicy ----------------------------------------------------
  - entity: InsurancePolicy
    initial_state: ACTIVE
    terminal_states: [CANCELLED, SUPERSEDED, LAPSED]
    dimension: status
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a newer InsurancePolicy is created for the same artwork"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /policies/{id}/state {to_status: CANCELLED}"
        actor: Approver
        preconditions: []
        side_effects:
          - "clears artwork.active_policy_id if it referenced this policy"
      - from: ACTIVE
        to: LAPSED
        trigger: "system: detected at LoanAgreement activate when effective_end < current clock time"
        actor: system
        preconditions: []
        side_effects:
          - "clears artwork.active_policy_id if it referenced this policy"

  # ---- LoanAgreement (cyclic) --------------------------------------------
  - entity: LoanAgreement
    initial_state: DRAFT
    terminal_states: [REJECTED, RETURNED, CANCELLED]
    dimension: status
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /loans/{id}/state {to_status: SUBMITTED}"
        actor: Registrar
        preconditions: []
        side_effects:
          - "records submitted_by_user_id = X-User-ID of the caller"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /loans/{id}/state {to_status: DRAFT}"
        actor: Registrar
        preconditions: []
        side_effects: []
        note: "revision loop — cyclic shape"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /loans/{id}/state {to_status: APPROVED}"
        actor: Approver
        preconditions:
          - "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "artwork.custody_status == IN_STORAGE (else ERR_ARTWORK_NOT_AVAILABLE) — cross-entity dependency LoanAgreement->Artwork"
          - "artwork.condition_status != MAJOR_DAMAGE (else ERR_ARTWORK_CONDITION_UNSAFE)"
          - "count(FINALIZED Appraisal for artwork) >= 1 (else ERR_NO_FINALIZED_APPRAISAL)"
          - "artwork has an ACTIVE InsurancePolicy with insured_value_cents >= required_value_cents (else ERR_INSUFFICIENT_COVERAGE)"
        side_effects:
          - "sets coa_issued=true and coa_number"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /loans/{id}/state {to_status: REJECTED}"
        actor: Approver
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /loans/{id}/state {to_status: ACTIVE}"
        actor: Coordinator
        preconditions:
          - "artwork.custody_status == IN_STORAGE (else ERR_ARTWORK_NOT_AVAILABLE)"
          - "artwork has an ACTIVE InsurancePolicy not past effective_end (else ERR_POLICY_NOT_ACTIVE; if past effective_end, that policy -> LAPSED and ERR_POLICY_EXPIRED) — cross-entity dependency LoanAgreement->InsurancePolicy"
          - "if is_international: a Carnet for this loan in status ISSUED exists and validity_end >= clock (else ERR_CARNET_REQUIRED / ERR_CARNET_EXPIRED)"
        side_effects:
          - "artwork.custody_status IN_STORAGE -> ON_LOAN (cascade: placement ACTIVE -> SUSPENDED, vault.occupied_slots -= 1)"
          - "if is_international: the loan's Carnet ISSUED -> ACTIVATED"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /loans/{id}/state {to_status: RETURNED}"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "artwork.custody_status ON_LOAN -> IN_STORAGE (cascade: placement SUSPENDED -> ACTIVE, vault.occupied_slots += 1)"
          - "the loan's Carnet in {ISSUED, ACTIVATED} -> DISCHARGED"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /loans/{id}/state {to_status: CANCELLED}"
        actor: Approver
        preconditions: []
        side_effects:
          - "the loan's Carnet in {ISSUED, ACTIVATED} -> DISCHARGED"

  # ---- Carnet -------------------------------------------------------------
  - entity: Carnet
    initial_state: ISSUED
    terminal_states: [DISCHARGED, EXPIRED]
    dimension: status
    transitions:
      - from: ISSUED
        to: ACTIVATED
        trigger: "system: owning LoanAgreement APPROVED -> ACTIVE (is_international)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVATED
        to: DISCHARGED
        trigger: "system: owning LoanAgreement ACTIVE -> RETURNED; or POST /carnets/{id}/state {to_status: DISCHARGED}"
        actor: Coordinator
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: DISCHARGED
        trigger: "system: owning LoanAgreement -> CANCELLED"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /carnets/{id}/state {to_status: EXPIRED}"
        actor: Coordinator
        preconditions:
          - "validity_end < current clock time (else ERR_INVALID_STATE)"
        side_effects: []

  # ---- ViewingRoom --------------------------------------------------------
  - entity: ViewingRoom
    initial_state: OPERATIONAL
    terminal_states: []
    dimension: status
    transitions:
      - from: OPERATIONAL
        to: CLOSED
        trigger: "POST /viewing-rooms/{id}/state {to_status: CLOSED}"
        actor: Coordinator
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: OPERATIONAL
        trigger: "POST /viewing-rooms/{id}/state {to_status: OPERATIONAL}"
        actor: Coordinator
        preconditions: []
        side_effects: []

  # ---- ViewingBooking -----------------------------------------------------
  - entity: ViewingBooking
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    dimension: status
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /viewing-bookings/{id}/state {to_status: CONFIRMED}"
        actor: Coordinator
        preconditions:
          - "artwork.condition_status != MAJOR_DAMAGE (else ERR_ARTWORK_CONDITION_UNSAFE) — business_safety"
          - "room.status == OPERATIONAL (else ERR_ROOM_NOT_OPERATIONAL) — business_constraint"
          - "no other CONFIRMED ViewingBooking on the same room whose half-open [scheduled_start, scheduled_end) overlaps this one (else ERR_ROOM_UNAVAILABLE) — business_temporal"
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /viewing-bookings/{id}/state {to_status: COMPLETED}"
        actor: Coordinator
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /viewing-bookings/{id}/state {to_status: NO_SHOW}"
        actor: Coordinator
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /viewing-bookings/{id}/state {to_status: CANCELLED}"
        actor: Coordinator
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /viewing-bookings/{id}/state {to_status: CANCELLED}"
        actor: Coordinator
        preconditions: []
        side_effects: []

  # ---- Invoice ------------------------------------------------------------
  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    dimension: status
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/state {to_status: ISSUED}"
        actor: BillingAdmin
        preconditions: []
        side_effects:
          - "increments client.outstanding_balance_cents by total_cents (conserved ledger forward action)"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/state {to_status: PAID}"
        actor: BillingAdmin
        preconditions: []
        side_effects:
          - "decrements client.outstanding_balance_cents by total_cents"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/state {to_status: VOID}"
        actor: BillingAdmin
        preconditions: []
        side_effects:
          - "decrements client.outstanding_balance_cents by total_cents (compensating action; restores the ledger)"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/state {to_status: VOID}"
        actor: BillingAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: appraisal-supersede-stale-artwork
    parent_entity: Artwork
    write_endpoint: "POST /appraisals"
    occ_field: "expected_artwork_version"
    description: |
      Creating an Appraisal against an Artwork whose version has advanced since
      the client last observed it is rejected. A new appraisal legitimately
      supersedes the prior FINALIZED appraisal and rewrites the artwork's
      appraised_value_cents; a stale expected_artwork_version means another writer
      already superseded the valuation and this caller's view is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: policy-supersede-stale-artwork
    parent_entity: Artwork
    write_endpoint: "POST /policies"
    occ_field: "expected_artwork_version"
    description: |
      Creating an InsurancePolicy against an Artwork whose version has advanced
      is rejected. A new policy legitimately supersedes the prior ACTIVE policy
      and rewrites the artwork's active_policy_id; a stale expected_artwork_version
      means another writer already replaced coverage and this caller's view is
      out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: storage_fee
    trigger: "provisional at StoragePlacement creation; final at StoragePlacement RELEASE"
    algorithm: dual_variant
    formula: |
      daily_rate_cents = DAILY_RATE_BY_CLIMATE[vault.climate_class]
      size_mult = SIZE_MULT[artwork.size_class]
      # day count uses ceil of the 24h-day difference (any partial day rounds up)
      provisional: days = ceil((scheduled_end_at - start_at) / 1 day)
                   provisional_fee_cents = round_half_up(days * daily_rate_cents * size_mult)
      final:       days = ceil((released_at - start_at) / 1 day)
                   final_fee_cents = round_half_up(days * daily_rate_cents * size_mult)
    input_set: "single placement; provisional projects forward to scheduled_end_at, final counts actual days to released_at"
    constants:
      DAILY_RATE_BY_CLIMATE: { AMBIENT: 500, COOL: 800, COLD: 1200 }
      SIZE_MULT: { SMALL: 1.0, MEDIUM: 1.5, LARGE: 2.0 }
    precision: "whole cents, round_half_up"
    variants:
      - name: provisional
        when: "at placement creation"
        difference: "days projected forward to scheduled_end_at"
      - name: final
        when: "at placement RELEASE"
        difference: "days measured chronologically to released_at (logical clock)"

  - name: appraisal_value
    trigger: "Appraisal creation"
    algorithm: dual_variant
    formula: |
      if method == FAIR_MARKET:
        appraised_value_cents = comparable_base_cents
      elif method == REPLACEMENT:
        appraised_value_cents = round_half_up(comparable_base_cents * replacement_multiplier)
                                + restoration_reserve_cents
    input_set: "single appraisal record"
    constants: {}
    precision: "whole cents, round_half_up"
    variants:
      - name: fair_market
        when: "method == FAIR_MARKET"
        difference: "value equals the comparable base; multiplier and reserve ignored"
      - name: replacement
        when: "method == REPLACEMENT"
        difference: "comparable base scaled by replacement_multiplier plus restoration_reserve_cents"

  - name: insurance_premium
    trigger: "InsurancePolicy creation"
    algorithm: tiered_pricing
    formula: |
      # evaluation order is pinned left-to-right; single final rounding
      rate_bps = 200 if insured_value_cents <= 500000
                 else 150 if insured_value_cents <= 5000000
                 else 100
      coverage_mult = COVERAGE_MULT[coverage_type]
      fragility_mult = FRAGILITY_MULT[artwork.fragility_class]
      duration_days = (effective_end - effective_start) / 1 day
      base_annual = insured_value_cents * rate_bps / 10000
      scaled = base_annual * coverage_mult * fragility_mult * (duration_days / 365)
      premium_cents = max(MIN_PREMIUM_CENTS, round_half_up(scaled))
    input_set: "single policy plus its artwork's fragility_class"
    constants:
      COVERAGE_MULT: { STORAGE_ONLY: 1.0, TRANSIT: 1.5, ALL_RISK: 2.0 }
      FRAGILITY_MULT: { LOW: 1.0, MEDIUM: 1.25, HIGH: 1.5 }
      MIN_PREMIUM_CENTS: 5000
    precision: "whole cents, round_half_up; single rounding after all factors"

  - name: transport_charge
    trigger: "estimated at TransportJob creation; final at COMPLETED"
    algorithm: dual_variant
    formula: |
      rigging_surcharge = RIGGING_SURCHARGE_CENTS if requires_rigging else 0
      estimated: transport_charge_cents = round_half_up(estimated_hours * CREW_HOURLY_CENTS) + rigging_surcharge
      final:     transport_charge_cents = round_half_up(actual_hours * CREW_HOURLY_CENTS) + rigging_surcharge
    input_set: "single job"
    constants:
      CREW_HOURLY_CENTS: 9000
      RIGGING_SURCHARGE_CENTS: 25000
    precision: "whole cents, round_half_up"
    variants:
      - name: estimated
        when: "at job creation"
        difference: "uses estimated_hours"
      - name: final
        when: "at COMPLETED"
        difference: "uses logged actual_hours"

  - name: invoice_total
    trigger: "Invoice creation (DRAFT)"
    algorithm: aggregation
    formula: |
      # line_items = auto-aggregated {RELEASED placement final_fee_cents,
      #   COMPLETED transport transport_charge_cents} for the client in the
      #   period, plus manual_line_items; each amount is whole cents.
      # PINNED ROUNDING ORDER: sum whole-cent line amounts first, then compute
      # tax on the summed subtotal (round_half_up once). Do NOT compute or round
      # tax per line item.
      subtotal_cents = sum(li.amount_cents for li in line_items)
      tax_cents = round_half_up(subtotal_cents * TAX_RATE)
      total_cents = subtotal_cents + tax_cents
    input_set: "line_items of the invoice"
    constants:
      TAX_RATE: 0.0875
    precision: "whole cents, round_half_up; tax computed once on the subtotal"

  - name: vault_occupancy
    trigger: "any StoragePlacement status change into/out of ACTIVE"
    algorithm: aggregation
    formula: |
      vault.occupied_slots = count(StoragePlacement
                                    where vault_id == vault.id
                                    and status == ACTIVE)
    input_set: "ACTIVE placements for the vault"
    precision: "integer count"

  - name: client_outstanding_balance
    trigger: "Invoice ISSUED / PAID / VOID transitions"
    algorithm: aggregation
    formula: |
      client.outstanding_balance_cents = sum(inv.total_cents
                                             for inv in Invoices
                                             where client_id == client.id
                                             and status == ISSUED)
    input_set: "ISSUED invoices for the client"
    precision: "integer cents; conserved under issue(+total)/void(-total)/pay(-total)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Client role acting on a resource must own it (X-User-ID == resource.client_id for artworks/loans/viewing-bookings/invoices, or == Client.id for GET /clients/{id})"
    error_id: ERR_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "Client-role reads/writes on client-scoped resources"

  - priority: 4
    category: existence
    check: "Path resource and referenced FK ids exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 6
    category: business_temporal
    check: "Interval end strictly after start (scheduled_end > scheduled_start; effective_end > effective_start; scheduled_end_at > start_at)"
    error_id: ERR_TIME_WINDOW_INVALID
    http_status: 422
    applies_to: "transport-jobs, storage-placements, policies, viewing-bookings, loans, carnets"

  - priority: 7
    category: concurrency
    check: "expected_artwork_version matches Artwork.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /appraisals, POST /policies"

  - priority: 8
    category: state
    check: "Target resource is in a valid source state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all /state and lifecycle endpoints"

  - priority: 9
    category: auth
    check: "On loan APPROVED: approver X-User-ID must differ from submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /loans/{id}/state {to_status: APPROVED}"

  - priority: 10
    category: business_safety
    check: "Artwork.condition_status must not be MAJOR_DAMAGE for transport IN_PROGRESS, loan APPROVED, or viewing CONFIRMED"
    error_id: ERR_ARTWORK_CONDITION_UNSAFE
    http_status: 422
    applies_to: "transport IN_PROGRESS, loan APPROVED, viewing CONFIRMED"

  - priority: 11
    category: business_referential
    check: "Artwork.custody_status must be IN_STORAGE for transport IN_PROGRESS, loan APPROVED, and loan ACTIVE"
    error_id: ERR_ARTWORK_NOT_AVAILABLE
    http_status: 409
    applies_to: "transport IN_PROGRESS, loan APPROVED, loan ACTIVE"

  - priority: 12
    category: business_referential
    check: "Crate must be READY and belong to the same artwork for transport IN_PROGRESS"
    error_id: ERR_CRATE_NOT_READY
    http_status: 409
    applies_to: "transport IN_PROGRESS"

  - priority: 13
    category: business_referential
    check: "Artwork.climate_class must equal Vault.climate_class to place"
    error_id: ERR_CLIMATE_MISMATCH
    http_status: 422
    applies_to: "POST /storage-placements"

  - priority: 14
    category: business_referential
    check: "Loan APPROVED requires >= 1 FINALIZED Appraisal for the artwork"
    error_id: ERR_NO_FINALIZED_APPRAISAL
    http_status: 422
    applies_to: "POST /loans/{id}/state {to_status: APPROVED}"

  - priority: 15
    category: business_referential
    check: "Loan ACTIVE requires an ACTIVE, non-expired InsurancePolicy for the artwork"
    error_id: ERR_POLICY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /loans/{id}/state {to_status: ACTIVE}"

  - priority: 16
    category: business_referential
    check: "Loan ACTIVE with is_international requires an ISSUED Carnet still within validity"
    error_id: ERR_CARNET_REQUIRED
    http_status: 422
    applies_to: "POST /loans/{id}/state {to_status: ACTIVE}"

  - priority: 17
    category: business_temporal
    check: "TransportJob window must not overlap another SCHEDULED/IN_PROGRESS job on the same crew within SETUP_BUFFER_MINUTES=60 (closed intervals + buffer): a new job conflicts when new.scheduled_start < existing.scheduled_end + 60min AND new.scheduled_end + 60min > existing.scheduled_start (buffer applied on both sides; adjacency inside the 60-minute buffer conflicts, a gap of exactly 60 minutes does NOT)"
    error_id: ERR_CREW_UNAVAILABLE
    http_status: 409
    applies_to: "POST /transport-jobs"

  - priority: 18
    category: business_temporal
    check: "ViewingBooking CONFIRMED must not half-open overlap another CONFIRMED booking on the same room: conflict when new.scheduled_start < existing.scheduled_end AND existing.scheduled_start < new.scheduled_end (no buffer; adjacency end==start allowed)"
    error_id: ERR_ROOM_UNAVAILABLE
    http_status: 409
    applies_to: "POST /viewing-bookings/{id}/state {to_status: CONFIRMED}"

  - priority: 19
    category: business_constraint
    check: "Vault must be OPERATIONAL to accept a placement"
    error_id: ERR_VAULT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /storage-placements"

  - priority: 20
    category: business_constraint
    check: "Placement rejected when vault.occupied_slots >= vault.capacity_slots (>= boundary)"
    error_id: ERR_VAULT_FULL
    http_status: 409
    applies_to: "POST /storage-placements, placement SUSPENDED->ACTIVE"

  - priority: 21
    category: business_fiscal
    check: "Loan APPROVED requires ACTIVE policy insured_value_cents >= required_value_cents"
    error_id: ERR_INSUFFICIENT_COVERAGE
    http_status: 422
    applies_to: "POST /loans/{id}/state {to_status: APPROVED}"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default (never real wall-clock)."
    roles: [Registrar, Coordinator, Approver, BillingAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced; drives all deadline/expiry/day-count logic"]

  # ---- Client ----
  - method: POST
    path: "/clients"
    description: "Register a client / owner"
    roles: [Registrar]
    code: 201
    input: [name, client_type, billing_email, "credit_terms_days?"]
    output: Client
    side_effects: ["account_status=ACTIVE, outstanding_balance_cents=0"]
  - method: GET
    path: "/clients/{id}"
    description: "Get a client"
    roles: [Registrar, Client]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: GET
    path: "/clients"
    description: "List clients"
    roles: [Registrar]
    code: 200
    input: ["client_type?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: POST
    path: "/clients/{id}/state"
    description: "Suspend/reactivate a client"
    roles: [Registrar]
    code: 200
    input: [to_status]
    output: Client
    side_effects: ["account_status transition"]

  # ---- Vault ----
  - method: POST
    path: "/vaults"
    description: "Create a climate vault"
    roles: [Registrar]
    code: 201
    input: [name, climate_class, capacity_slots, "temp_setpoint_c?", "humidity_setpoint_pct?"]
    output: Vault
    side_effects: ["status=OPERATIONAL, occupied_slots=0"]
  - method: GET
    path: "/vaults/{id}"
    description: "Get a vault"
    roles: [Registrar, Coordinator, Approver]
    code: 200
    input: []
    output: Vault
    side_effects: []
  - method: GET
    path: "/vaults"
    description: "List vaults"
    roles: [Registrar, Coordinator, Approver]
    code: 200
    input: ["climate_class?", "status?", "limit?", "offset?"]
    output: Vault[]
    side_effects: []
  - method: POST
    path: "/vaults/{id}/state"
    description: "Transition vault status"
    roles: [Registrar]
    code: 200
    input: [to_status]
    output: Vault
    side_effects: ["status transition per §1.2"]

  # ---- Artwork ----
  - method: POST
    path: "/artworks"
    description: "Intake an artwork"
    roles: [Registrar]
    code: 201
    input: [client_id, title, artist, "medium?", "year?", size_class, fragility_class, climate_class]
    output: Artwork
    side_effects: ["custody_status=IN_INTAKE, condition_status=SOUND, appraised_value_cents=0"]
  - method: GET
    path: "/artworks/{id}"
    description: "Get an artwork"
    roles: [Registrar, Coordinator, Approver, Client]
    code: 200
    input: []
    output: Artwork
    side_effects: []
  - method: GET
    path: "/artworks"
    description: "List artworks (FK reverse for Artwork.client_id)"
    roles: [Registrar, Coordinator, Approver, Client]
    code: 200
    input: ["client_id?", "custody_status?", "condition_status?", "limit?", "offset?"]
    output: Artwork[]
    side_effects: []
  - method: POST
    path: "/artworks/{id}/state"
    description: "Deaccession an artwork"
    roles: [Registrar]
    code: 200
    input: [to_status]
    output: Artwork
    side_effects: ["custody_status transition per §1.2"]

  # ---- ConditionReport ----
  - method: POST
    path: "/condition-reports"
    description: "File a condition report; may transition Artwork.condition_status and cascade"
    roles: [Registrar]
    code: 201
    input: [artwork_id, report_type, condition_grade, damage_noted, "notes?"]
    output: ConditionReport
    side_effects:
      - "artwork.condition_status transition per grade (§1.2 Artwork-condition)"
      - "on MAJOR_DAMAGE: cascade cancels APPROVED/ACTIVE loans and discharges their carnets"
  - method: GET
    path: "/condition-reports/{id}"
    description: "Get a condition report"
    roles: [Registrar, Coordinator]
    code: 200
    input: []
    output: ConditionReport
    side_effects: []
  - method: GET
    path: "/condition-reports"
    description: "List condition reports (FK reverse for ConditionReport.artwork_id)"
    roles: [Registrar, Coordinator]
    code: 200
    input: ["artwork_id?", "report_type?", "limit?", "offset?"]
    output: ConditionReport[]
    side_effects: []

  # ---- Appraisal ----
  - method: POST
    path: "/appraisals"
    description: "Create a FINALIZED appraisal; supersedes prior FINALIZED for the artwork (OCC on artwork.version)"
    roles: [Registrar]
    code: 201
    input: [artwork_id, method, comparable_base_cents, "replacement_multiplier?", "restoration_reserve_cents?", appraiser_name, expected_artwork_version]
    output: Appraisal
    side_effects:
      - "computes appraised_value_cents (§1.3 appraisal_value)"
      - "prior FINALIZED appraisal for artwork -> SUPERSEDED"
      - "sets artwork.appraised_value_cents; increments Artwork.version by 1"
  - method: GET
    path: "/appraisals/{id}"
    description: "Get an appraisal"
    roles: [Registrar, Approver]
    code: 200
    input: []
    output: Appraisal
    side_effects: []
  - method: GET
    path: "/appraisals"
    description: "List appraisals (FK reverse for Appraisal.artwork_id)"
    roles: [Registrar, Approver]
    code: 200
    input: ["artwork_id?", "status?", "limit?", "offset?"]
    output: Appraisal[]
    side_effects: []

  # ---- InsurancePolicy ----
  - method: POST
    path: "/policies"
    description: "Create an ACTIVE policy; supersedes prior ACTIVE for the artwork (OCC on artwork.version)"
    roles: [Registrar]
    code: 201
    input: [artwork_id, coverage_type, insured_value_cents, effective_start, effective_end, expected_artwork_version]
    output: InsurancePolicy
    side_effects:
      - "computes premium_cents (§1.3 insurance_premium)"
      - "prior ACTIVE policy for artwork -> SUPERSEDED"
      - "sets artwork.active_policy_id; increments Artwork.version by 1"
  - method: POST
    path: "/policies/{id}/state"
    description: "Cancel a policy"
    roles: [Approver]
    code: 200
    input: [to_status]
    output: InsurancePolicy
    side_effects: ["status transition per §1.2"]
  - method: GET
    path: "/policies/{id}"
    description: "Get a policy"
    roles: [Registrar, Approver]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []
  - method: GET
    path: "/policies"
    description: "List policies (FK reverse for InsurancePolicy.artwork_id)"
    roles: [Registrar, Approver]
    code: 200
    input: ["artwork_id?", "status?", "limit?", "offset?"]
    output: InsurancePolicy[]
    side_effects: []

  # ---- Crate ----
  - method: POST
    path: "/crates"
    description: "Build a crate for an artwork"
    roles: [Coordinator]
    code: 201
    input: [artwork_id, crate_type, internal_length_cm, internal_width_cm, internal_height_cm]
    output: Crate
    side_effects: ["status=BUILDING"]
  - method: POST
    path: "/crates/{id}/state"
    description: "Transition crate status"
    roles: [Coordinator]
    code: 200
    input: [to_status]
    output: Crate
    side_effects: ["status transition per §1.2"]
  - method: GET
    path: "/crates/{id}"
    description: "Get a crate"
    roles: [Coordinator, Registrar]
    code: 200
    input: []
    output: Crate
    side_effects: []
  - method: GET
    path: "/crates"
    description: "List crates (FK reverse for Crate.artwork_id)"
    roles: [Coordinator, Registrar]
    code: 200
    input: ["artwork_id?", "status?", "limit?", "offset?"]
    output: Crate[]
    side_effects: []

  # ---- RiggingCrew ----
  - method: POST
    path: "/crews"
    description: "Register a rigging crew"
    roles: [Coordinator]
    code: 201
    input: [name, crew_size, certification_level]
    output: RiggingCrew
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/crews/{id}"
    description: "Get a crew"
    roles: [Coordinator]
    code: 200
    input: []
    output: RiggingCrew
    side_effects: []
  - method: GET
    path: "/crews"
    description: "List crews"
    roles: [Coordinator]
    code: 200
    input: ["certification_level?", "status?", "limit?", "offset?"]
    output: RiggingCrew[]
    side_effects: []

  # ---- TransportJob ----
  - method: POST
    path: "/transport-jobs"
    description: "Schedule a transport job; reserves the crew window (temporal-overlap check with buffer)"
    roles: [Coordinator]
    code: 201
    input: [artwork_id, crate_id, crew_id, origin_location, destination_location, scheduled_start, scheduled_end, requires_rigging, estimated_hours]
    output: TransportJob
    side_effects: ["status=SCHEDULED; computes estimated transport_charge_cents (§1.3)"]
  - method: POST
    path: "/transport-jobs/{id}/state"
    description: "Transition transport job; COMPLETED requires actual_hours"
    roles: [Coordinator]
    code: 200
    input: [to_status, "actual_hours?"]
    output: TransportJob
    side_effects: ["status transition per §1.2; cascades on artwork custody + crate status"]
  - method: GET
    path: "/transport-jobs/{id}"
    description: "Get a transport job"
    roles: [Coordinator, Registrar]
    code: 200
    input: []
    output: TransportJob
    side_effects: []
  - method: GET
    path: "/transport-jobs"
    description: "List transport jobs (FK reverse for artwork_id, crate_id, crew_id)"
    roles: [Coordinator, Registrar]
    code: 200
    input: ["artwork_id?", "crate_id?", "crew_id?", "status?", "limit?", "offset?"]
    output: TransportJob[]
    side_effects: []

  # ---- StoragePlacement ----
  - method: POST
    path: "/storage-placements"
    description: "Place an artwork in a vault (creates ACTIVE placement, consumes a slot)"
    roles: [Registrar]
    code: 201
    input: [artwork_id, vault_id, start_at, scheduled_end_at]
    output: StoragePlacement
    side_effects:
      - "status=ACTIVE; increments vault.occupied_slots; computes provisional_fee_cents (§1.3)"
      - "if artwork.custody_status==IN_INTAKE, artwork.custody_status -> IN_STORAGE (cascade)"
  - method: POST
    path: "/storage-placements/{id}/state"
    description: "Release a placement"
    roles: [Registrar]
    code: 200
    input: [to_status]
    output: StoragePlacement
    side_effects: ["status transition per §1.2; sets released_at, final_fee_cents; adjusts vault.occupied_slots"]
  - method: GET
    path: "/storage-placements/{id}"
    description: "Get a placement"
    roles: [Registrar, Coordinator]
    code: 200
    input: []
    output: StoragePlacement
    side_effects: []
  - method: GET
    path: "/storage-placements"
    description: "List placements (FK reverse for artwork_id, vault_id)"
    roles: [Registrar, Coordinator]
    code: 200
    input: ["artwork_id?", "vault_id?", "status?", "limit?", "offset?"]
    output: StoragePlacement[]
    side_effects: []

  # ---- LoanAgreement ----
  - method: POST
    path: "/loans"
    description: "Draft a loan agreement"
    roles: [Registrar]
    code: 201
    input: [artwork_id, client_id, borrower_name, exhibition_name, loan_start, loan_end, is_international, required_value_cents]
    output: LoanAgreement
    side_effects: ["status=DRAFT, coa_issued=false"]
  - method: POST
    path: "/loans/{id}/state"
    description: "Transition loan (submit/approve/revise/reject/activate/return/cancel); role enforced per transition in §1.2"
    roles: [Registrar, Approver, Coordinator]
    code: 200
    input: [to_status]
    output: LoanAgreement
    side_effects: ["status transition per §1.2; SoD on APPROVED; cascades on ACTIVE/RETURNED/CANCELLED"]
  - method: GET
    path: "/loans/{id}"
    description: "Get a loan"
    roles: [Registrar, Approver, Coordinator, Client]
    code: 200
    input: []
    output: LoanAgreement
    side_effects: []
  - method: GET
    path: "/loans"
    description: "List loans (FK reverse for artwork_id, client_id)"
    roles: [Registrar, Approver, Coordinator, Client]
    code: 200
    input: ["artwork_id?", "client_id?", "status?", "limit?", "offset?"]
    output: LoanAgreement[]
    side_effects: []

  # ---- Carnet ----
  - method: POST
    path: "/carnets"
    description: "Issue an ATA carnet for a loan"
    roles: [Coordinator]
    code: 201
    input: [loan_id, carnet_number, countries, validity_start, validity_end]
    output: Carnet
    side_effects: ["status=ISSUED"]
  - method: POST
    path: "/carnets/{id}/state"
    description: "Transition carnet status"
    roles: [Coordinator]
    code: 200
    input: [to_status]
    output: Carnet
    side_effects: ["status transition per §1.2"]
  - method: GET
    path: "/carnets/{id}"
    description: "Get a carnet"
    roles: [Coordinator]
    code: 200
    input: []
    output: Carnet
    side_effects: []
  - method: GET
    path: "/carnets"
    description: "List carnets (FK reverse for Carnet.loan_id)"
    roles: [Coordinator]
    code: 200
    input: ["loan_id?", "status?", "limit?", "offset?"]
    output: Carnet[]
    side_effects: []

  # ---- ViewingRoom ----
  - method: POST
    path: "/viewing-rooms"
    description: "Create a viewing room"
    roles: [Coordinator]
    code: 201
    input: [name, capacity_persons]
    output: ViewingRoom
    side_effects: ["status=OPERATIONAL"]
  - method: POST
    path: "/viewing-rooms/{id}/state"
    description: "Open/close a viewing room"
    roles: [Coordinator]
    code: 200
    input: [to_status]
    output: ViewingRoom
    side_effects: ["status transition per §1.2"]
  - method: GET
    path: "/viewing-rooms/{id}"
    description: "Get a viewing room"
    roles: [Coordinator, Client]
    code: 200
    input: []
    output: ViewingRoom
    side_effects: []
  - method: GET
    path: "/viewing-rooms"
    description: "List viewing rooms"
    roles: [Coordinator, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ViewingRoom[]
    side_effects: []

  # ---- ViewingBooking ----
  - method: POST
    path: "/viewing-bookings"
    description: "Request a private viewing (Client books own artwork, or Coordinator on behalf)"
    roles: [Client, Coordinator]
    code: 201
    input: [artwork_id, viewing_room_id, client_id, scheduled_start, scheduled_end]
    output: ViewingBooking
    side_effects: ["status=REQUESTED"]
  - method: POST
    path: "/viewing-bookings/{id}/state"
    description: "Confirm/complete/cancel/no-show a booking; CONFIRMED enforces room overlap + safety"
    roles: [Coordinator]
    code: 200
    input: [to_status]
    output: ViewingBooking
    side_effects: ["status transition per §1.2"]
  - method: GET
    path: "/viewing-bookings/{id}"
    description: "Get a booking"
    roles: [Coordinator, Client]
    code: 200
    input: []
    output: ViewingBooking
    side_effects: []
  - method: GET
    path: "/viewing-bookings"
    description: "List bookings (FK reverse for artwork_id, viewing_room_id, client_id)"
    roles: [Coordinator, Client]
    code: 200
    input: ["artwork_id?", "viewing_room_id?", "client_id?", "status?", "limit?", "offset?"]
    output: ViewingBooking[]
    side_effects: []

  # ---- Invoice ----
  - method: POST
    path: "/invoices"
    description: "Generate a DRAFT invoice aggregating period charges plus optional manual lines"
    roles: [BillingAdmin]
    code: 201
    input: [client_id, billing_period_start, billing_period_end, "manual_line_items?"]
    output: Invoice
    side_effects: ["status=DRAFT; builds line_items; computes subtotal/tax/total (§1.3 invoice_total)"]
  - method: POST
    path: "/invoices/{id}/state"
    description: "Issue/pay/void an invoice; adjusts client.outstanding_balance_cents"
    roles: [BillingAdmin]
    code: 200
    input: [to_status]
    output: Invoice
    side_effects: ["status transition per §1.2; conserved-ledger adjustment"]
  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: [BillingAdmin, Client]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices (FK reverse for Invoice.client_id)"
    roles: [BillingAdmin, Client]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation" }
  - { id: ERR_OWNERSHIP_REQUIRED, http: 403, condition: "Client acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource or referenced FK id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field or enum out of range" }
  - { id: ERR_TIME_WINDOW_INVALID, http: 422, condition: "Interval end not strictly after start" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_artwork_version does not match Artwork.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the current state" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Loan approver X-User-ID equals the submitter's" }
  - { id: ERR_ARTWORK_CONDITION_UNSAFE, http: 422, condition: "Artwork condition_status is MAJOR_DAMAGE for a transport/loan/viewing op" }
  - { id: ERR_ARTWORK_NOT_AVAILABLE, http: 409, condition: "Artwork custody_status is not IN_STORAGE for the op" }
  - { id: ERR_CRATE_NOT_READY, http: 409, condition: "Crate not READY or not matching the artwork on transport start" }
  - { id: ERR_CLIMATE_MISMATCH, http: 422, condition: "Artwork climate_class does not equal Vault climate_class" }
  - { id: ERR_NO_FINALIZED_APPRAISAL, http: 422, condition: "Loan approve with zero FINALIZED appraisals for the artwork" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "Loan activate with no ACTIVE policy for the artwork" }
  - { id: ERR_POLICY_EXPIRED, http: 409, condition: "Loan activate when the artwork's policy is past effective_end" }
  - { id: ERR_CARNET_REQUIRED, http: 422, condition: "International loan activate with no ISSUED carnet" }
  - { id: ERR_CARNET_EXPIRED, http: 409, condition: "International loan activate when the carnet validity_end < clock" }
  - { id: ERR_CREW_UNAVAILABLE, http: 409, condition: "Transport window collides with another crew job within SETUP_BUFFER_MINUTES" }
  - { id: ERR_ROOM_UNAVAILABLE, http: 409, condition: "Viewing confirm overlaps another CONFIRMED booking on the room" }
  - { id: ERR_ROOM_NOT_OPERATIONAL, http: 409, condition: "Viewing confirm on a CLOSED room" }
  - { id: ERR_VAULT_UNAVAILABLE, http: 409, condition: "Placement on a non-OPERATIONAL vault" }
  - { id: ERR_VAULT_FULL, http: 409, condition: "Placement when occupied_slots >= capacity_slots" }
  - { id: ERR_INSUFFICIENT_COVERAGE, http: 422, condition: "Loan approve with policy insured_value_cents < required_value_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Registrar
    description: "Collections registrar: intake artworks, vaults, storage placements, condition reports, appraisals, policy creation, client accounts."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients, POST /clients/{id}/state"
      - "POST /vaults, POST /vaults/{id}/state"
      - "POST /artworks, POST /artworks/{id}/state"
      - "POST /condition-reports"
      - "POST /appraisals"
      - "POST /policies"
      - "POST /storage-placements, POST /storage-placements/{id}/state"
      - "POST /loans, POST /loans/{id}/state {to_status in DRAFT,SUBMITTED}"
    shared_operations:
      - "GET reads across artworks, vaults, crates, transport-jobs, placements, condition-reports, appraisals, policies, loans"

  - name: Coordinator
    description: "Logistics coordinator: crates, rigging crews, transport jobs, carnets, viewing rooms/bookings, loan activation/return."
    identity: "opaque"
    exclusive_operations:
      - "POST /crates, POST /crates/{id}/state"
      - "POST /crews"
      - "POST /transport-jobs, POST /transport-jobs/{id}/state"
      - "POST /carnets, POST /carnets/{id}/state"
      - "POST /viewing-rooms, POST /viewing-rooms/{id}/state"
      - "POST /viewing-bookings/{id}/state"
      - "POST /loans/{id}/state {to_status in ACTIVE,RETURNED}"
    shared_operations:
      - "POST /viewing-bookings (with Client)"
      - "GET reads across logistics + loan resources"

  - name: Approver
    description: "Loan/insurance approver (governance): approves/rejects/cancels loans, activates/cancels policies. Segregation of duties bars approving a loan the same user submitted."
    identity: "opaque"
    exclusive_operations:
      - "POST /loans/{id}/state {to_status in APPROVED,REJECTED,CANCELLED}"
      - "POST /policies/{id}/state"
    shared_operations:
      - "GET reads across artworks, vaults, appraisals, policies, loans"

  - name: BillingAdmin
    description: "Billing administrator: generates invoices and issues/pays/voids them."
    identity: "opaque"
    exclusive_operations:
      - "POST /invoices, POST /invoices/{id}/state"
    shared_operations:
      - "GET reads across invoices"

  - name: Client
    description: "Art owner. Reads own artworks/loans/invoices; requests private viewings of own artworks."
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "POST /viewing-bookings (own artwork/client_id)"
      - "GET /clients/{id} (own), GET /artworks (own), GET /loans (own), GET /invoices (own), GET /viewing-rooms, GET /viewing-bookings (own)"
