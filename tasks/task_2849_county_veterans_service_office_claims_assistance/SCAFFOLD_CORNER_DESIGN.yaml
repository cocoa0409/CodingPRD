              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
          trigger:
            - call: "POST /cvso/powers-of-attorney"
              payload: { veteran_id: "${vet}", representative_id: "00000000-0000-0000-0000-0000000000ff", form_type: "VA_21_22", scope: "ALL_BENEFITS", executed_on: "2026-08-01" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
            - call: "POST /cvso/powers-of-attorney"
              payload: { veteran_id: "${vet}", representative_id: "${rep_a}", form_type: "VA_21_22", scope: "ALL_BENEFITS", executed_on: "2026-08-01" }
