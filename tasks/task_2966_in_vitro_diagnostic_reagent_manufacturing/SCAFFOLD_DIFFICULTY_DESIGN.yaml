  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: material_lot_oos_investigation_cycles_back_to_under_test
        grounds:
          - state_machines.MaterialLot.UNDER_TEST_to_OOS_INVESTIGATION
          - state_machines.MaterialLot.OOS_INVESTIGATION_to_UNDER_TEST
          - state_machines.MaterialLot.UNDER_TEST_to_QUALIFIED
          - entities.MaterialLot.fields.retest_count
          - entities.MaterialLot.fields.first_oos_at
          - validations[priority=60]
        distinguishing_aspect: |
          UNDER_TEST is visited twice: the lot leaves it for OOS_INVESTIGATION and
          a retest brings it BACK, so the lifecycle is a cycle rather than a
          ladder. While the lot sits in OOS_INVESTIGATION the QUALIFY trigger —
          legal one state earlier and one state later — is rejected, and
          first_oos_at stays pinned to the ORIGINAL failure instant even though a
          later PASS supersedes the failing measurement.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One ALL_PASS MaterialSpecification requiring only POTENCY (bounds 90.0-110.0), max_retests 1, retest_window_days 30."
            - "One MaterialLot whose only POTENCY result is 85.0, i.e. a FAIL, leaving the lot in UNDER_TEST with first_oos_at stamped."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "CAL-ANA-01", material_type: "CALIBRATOR_MATERIAL", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              captures: { ms_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-5001", received_quantity_units: 500.0, expiry_date: "2027-06-30T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_id: $.data.id }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "POTENCY", measured_value: 85.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
          trigger:
            - call: "POST /material-lots/${ml_id}/disposition"
              payload: { decision: "INVESTIGATE" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { after_investigate: $.data.qualification_status }
            - call: "POST /material-lots/${ml_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { err_qualify_from_oos: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "POTENCY", measured_value: 100.0, is_retest: true }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "GET /material-lots/${ml_id}"
              payload: {}
              as: QAReleaser
              captures: { after_retest: $.data.qualification_status, retests: $.data.retest_count }
            - call: "POST /material-lots/${ml_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { final_status: $.data.qualification_status }
          assert:
            - "after INVESTIGATE the lot is OOS_INVESTIGATION"
            - "QUALIFY from OOS_INVESTIGATION returns HTTP 409 ERR_MATERIAL_LOT_STATE_INVALID, even though QUALIFY is legal from UNDER_TEST both before and after this state"
            - "the is_retest record returns the lot to UNDER_TEST — the second visit to that state — and sets retest_count to 1"
            - "MaterialLot.first_oos_at == 2026-08-01T00:00:00.000Z still, unchanged by the passing retest recorded at 2026-08-15T00:00:00Z"
            - "the final QUALIFY returns HTTP 200 with qualification_status QUALIFIED, so the full observed path is RECEIVED -> UNDER_TEST -> OOS_INVESTIGATION -> UNDER_TEST -> QUALIFIED"
            - "MaterialLot.acceptance_score is null on the whole path because acceptance_mode is ALL_PASS"
            - "both TestResult rows survive: the 85.0 row with outcome FAIL and is_retest false, and the 100.0 row with outcome PASS and is_retest true"

      - name: reagent_lot_disposition_and_distribution_dimensions_move_independently
        grounds:
          - state_machines.ReagentLot.UNDER_RELEASE_TEST_to_RELEASED
          - state_machines.ReagentLot.WITHHELD_to_AVAILABLE
          - state_machines.ReagentLot.AVAILABLE_to_BLOCKED
          - state_machines.ReagentLot.BLOCKED_to_AVAILABLE
          - entities.ReagentLot.fields.disposition_status
          - entities.ReagentLot.fields.distribution_status
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          ReagentLot carries TWO state fields that advance on different triggers:
          the distribution axis cycles AVAILABLE -> BLOCKED -> AVAILABLE while the
          disposition axis never leaves RELEASED, and the distribution axis cannot
          be moved at all until the disposition axis reaches RELEASED. A
          single-status implementation cannot represent this: it lives in the
          finished-lot lifecycle, unlike the raw-material cycle of the instance
          above.
