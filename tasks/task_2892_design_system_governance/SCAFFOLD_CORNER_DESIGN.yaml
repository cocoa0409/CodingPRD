      - name: two_grants_on_different_tiers_round_per_grant_then_sum_to_fourteen_fifty
        claim_type: tiered_pricing
        grounds:
          - calculations.exception_debt_points
          - entities.ExceptionGrant.fields.debt_points
          - entities.Team.fields.outstanding_debt_points
          - entities.Component.fields.one_off_exception_count
        distinguishing_aspect: |
          Two grants on different tiers of both multiplier tables must be priced independently
          and then summed: FORK_OF_SYSTEM_COMPONENT / WEB / EXPERIMENTAL is 8 * 1.00 * 0.50 =
          4.00 and ONE_OFF_COMPONENT / ALL / EXPERIMENTAL is 12 * 1.75 * 0.50 = 10.50, giving
          outstanding 14.50 against a 40.00 budget (debt_state stays CLEAR), while only the
          ONE_OFF grant increments the substitute component's one_off_exception_count.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild` with debt_budget_points 40.00; EXPERIMENTAL Component `badge`"
            - "two REQUESTED grants against `badge`: a WEB fork and an ALL-platform one-off"
            - "the fork grant has already been approved"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/exception-grants"
              payload: { requesting_team_id: "${team_id}", substitute_for_component_id: "${comp_id}", exception_kind: "FORK_OF_SYSTEM_COMPONENT", platform_scope: "WEB", justification: "web fork while the shared badge lands", expires_at: "2026-10-01T00:00:00.000Z" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { fork_id: $.data.id }
            - call: "POST /design-system/exception-grants"
              payload: { requesting_team_id: "${team_id}", substitute_for_component_id: "${comp_id}", exception_kind: "ONE_OFF_COMPONENT", platform_scope: "ALL", justification: "bespoke marketing badge", expires_at: "2026-10-01T00:00:00.000Z" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { oneoff_id: $.data.id }
            - call: "POST /design-system/exception-grants/${fork_id}/decision"
              payload: { decision: "APPROVE", decision_notes: "time-boxed fork" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { fork_state: $.data.state, fork_points: $.data.debt_points, fork_pinned: $.data.pinned_maturity_level, fork_decided: $.data.decided_at }
            - call: "GET /design-system/teams/${team_id}"
              payload: {}
              as: DesignSystemLead
              captures: { out_1: $.data.outstanding_debt_points, life_1: $.data.lifetime_debt_points, state_1: $.data.debt_state }
          trigger:
            - call: "POST /design-system/exception-grants/${oneoff_id}/decision"
              payload: { decision: "APPROVE", decision_notes: "marketing exception, one release only" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { oneoff_state: $.data.state, oneoff_points: $.data.debt_points, oneoff_pinned: $.data.pinned_maturity_level }
            - call: "GET /design-system/teams/${team_id}"
              payload: {}
              as: DesignSystemLead
              captures: { out_2: $.data.outstanding_debt_points, life_2: $.data.lifetime_debt_points, state_2: $.data.debt_state }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { oneoff_count: $.data.one_off_exception_count }
          assert:
            - "${fork_state} == APPROVED and ${fork_points} == 4.00 and ${fork_pinned} == EXPERIMENTAL"
            - "${fork_decided} == 2026-08-01T00:00:00.000Z"
            - "${out_1} == 4.00 and ${life_1} == 4.00 and ${state_1} == CLEAR"
            - "${oneoff_state} == APPROVED and ${oneoff_points} == 10.50 and ${oneoff_pinned} == EXPERIMENTAL"
            - "${out_2} == 14.50 and ${life_2} == 14.50 and ${state_2} == CLEAR"
            - "${oneoff_count} == 1"

