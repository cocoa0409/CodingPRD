              captures: { e2_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { engagement_id: "${e2_id}", start_utc: "2026-06-10T11:10:00Z", end_utc: "2026-06-10T12:00:00Z" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_BOOKING_OVERLAP"

      - name: client_touching_booking_allowed_no_buffer
        grounds:
          - calculations.booking_overlap_check
          - validations[priority="11b"]
        distinguishing_aspect: |
          Client-resource geometry with ZERO buffer and strict half-open touching-allowed semantics (distinct resource
          entity Client and distinct geometry from the trainer pad): the SAME client's second booking starting exactly
          when the first ends (11:00 == 11:00) on a DIFFERENT trainer is ACCEPTED (created BOOKED).
        test_recipe:
          setup:
            - "Client C enrolled with two trainers T1 and T2 via two ONLINE_SUBSCRIPTION engagements"
            - "Existing booking on T1 2026-06-10T10:00-11:00 for C"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
