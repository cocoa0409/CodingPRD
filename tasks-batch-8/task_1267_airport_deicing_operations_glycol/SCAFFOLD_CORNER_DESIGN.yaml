      - name: double_concentration_breach_auto_suspends_permit
        claim_type: cascading_side_effects
        grounds: [state_machines.DischargePermit.ACTIVE_to_SUSPENDED, calculations.station_posture]
        distinguishing_aspect: "An effluent reading strictly greater than 2x the single-reading limit auto-suspends the permit and flips station posture to PERMIT_SUSPENDED; a reading at exactly the limit records violation=false and changes nothing."
        test_recipe:
          setup: ["Station with ACTIVE permit (max_single_reading_mg_l 100, generous window cap)"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin, captures: { pm: $.data.id } }
          trigger:
