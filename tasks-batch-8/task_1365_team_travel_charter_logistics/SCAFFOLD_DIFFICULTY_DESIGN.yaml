            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/manifest/${e2}/confirm"
              payload: {}
              as: TravelCoordinator
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/manifest/${e3}/confirm"
              payload: {}
              as: TravelCoordinator
