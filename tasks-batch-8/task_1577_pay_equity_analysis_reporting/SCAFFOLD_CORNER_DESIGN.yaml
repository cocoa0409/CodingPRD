  - name: rbac_peopleops_cannot_publish_posting
    claim_type: role_denial
    grounds:
    - roles PeopleOpsAdmin
    - roles ComplianceReporter
    - errors[ERR_INSUFFICIENT_PERMISSIONS]
    distinguishing_aspect: PeopleOpsAdmin configures jurisdictions but cannot publish postings; ComplianceReporter can.
    test_recipe:
      setup:
      - Jurisdiction JRB and DRAFT posting PRB exist
      setup_api_calls:
      - call: POST /api/jurisdiction-rules
        payload:
          jurisdiction_code: JRB
        as: PeopleOpsAdmin
        captures:
          jr: $.data.id
      - call: POST /api/transparency-postings
        payload:
          jurisdiction_rule_id: ${jr}
          job_posting_ref: P-RB
          title: Analyst
          min_salary_cents: 10000000
          max_salary_cents: 12000000
        as: ComplianceReporter
        captures:
          p: $.data.id
      trigger:
      - call: POST /api/transparency-postings/${p}/publish
        payload: {}
        as: PeopleOpsAdmin
        captures:
          err: $.data.error_id
      - call: POST /api/transparency-postings/${p}/publish
        payload: {}
        as: ComplianceReporter
        captures:
          st: $.data.status
      assert:
      - err == ERR_INSUFFICIENT_PERMISSIONS (http 403)
      - st == PUBLISHED for the authorized role (control)
  - name: missing_auth_headers_rejected
    claim_type: role_denial
    grounds:
    - validations[priority=1]
    - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
    distinguishing_aspect: An unknown role value is rejected with 400 before any endpoint logic.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: GET /api/pay-equity-studies
        payload: {}
        as: UnknownRole
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)
- section: cross_cutting_complexity_layers
  instances:
  - name: occ_stale_plan_version_returns_412
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[adjustment-decision-stale-plan]
    - errors[ERR_STALE_PLAN_VERSION]
    - errors[ERR_PLAN_INVALID_STATE]
    - errors[ERR_ADJUSTMENT_INVALID_STATE]
    distinguishing_aspect: After a first approval bumps plan.version, a second decision carrying the pre-approval version
      fails 412; the fresh-version retry succeeds. Also pins plan-decision on DRAFT and reverse-on-PROPOSED state errors.
    test_recipe:
      setup:
      - Study OC (2024, [GENDER], min_group_size 2, significance_threshold 0.1) REMEDIATION_OPEN; finding TARGETED; plan 2700000
        with two PROPOSED adjustments 50000/60000 (effective 2026-09-01)
      setup_api_calls:
      - call: POST /api/pay-equity-studies
        payload:
          name: OC
          analysis_period_start: '2024-01-01'
          analysis_period_end: '2024-12-31'
          protected_classes:
          - GENDER
          min_group_size: 2
          significance_threshold: 0.1
        as: CompAnalyst
        captures:
          s: $.data.id
      - call: POST /api/employee-snapshots
        payload:
          study_id: ${s}
          employee_ref: OCM1
          gender_class: MALE
          ethnicity_class: WHITE
          age_band: UNDER_40
          job_family: ENG
          job_level: 5
          location_code: CA
          fte_factor: 1.0
          base_salary_cents: 10000000
          bonus_cents: 0
          hire_date: '2020-01-01'
        as: PeopleOpsAdmin
        captures:
          m1: $.data.id
      - call: POST /api/employee-snapshots
        payload:
          study_id: ${s}
          employee_ref: OCF1
          gender_class: FEMALE
          ethnicity_class: WHITE
          age_band: UNDER_40
          job_family: ENG
          job_level: 5
          location_code: CA
          fte_factor: 1.0
          base_salary_cents: 9000000
          bonus_cents: 0
          hire_date: '2020-01-01'
        as: PeopleOpsAdmin
        captures:
          f1: $.data.id
      - call: POST /api/comparator-groups
        payload:
          study_id: ${s}
          name: GOC
          job_family: ENG
          min_job_level: 5
          max_job_level: 5
          location_code: CA
        as: CompAnalyst
        captures:
          g: $.data.id
      - call: PATCH /api/employee-snapshots/${m1}
        payload:
          comparator_group_id: ${g}
        as: PeopleOpsAdmin
      - call: PATCH /api/employee-snapshots/${f1}
        payload:
          comparator_group_id: ${g}
        as: PeopleOpsAdmin
      - call: POST /api/pay-equity-studies/${s}/advance
        payload: {}
        as: CompAnalyst
      - call: POST /api/comparator-groups/${g}/lock
        payload: {}
        as: CompAnalyst
        captures:
          gv: $.data.version
      - call: POST /api/model-runs
        payload:
          comparator_group_id: ${g}
          methodology: COHORT_MEDIAN
          expected_group_version: ${gv}
        as: CompAnalyst
        captures:
          r1: $.data.id
      - call: POST /api/model-runs/${r1}/finalize
        payload: {}
        as: CompAnalyst
      - call: POST /api/pay-equity-studies/${s}/submit-legal-review
        payload: {}
        as: CompAnalyst
      - call: POST /api/pay-equity-studies/${s}/legal-decision
        payload:
          decision: APPROVE
        as: LegalCounsel
      - call: POST /api/pay-equity-studies/${s}/open-remediation
        payload: {}
        as: LegalCounsel
      - call: POST /api/remediation-plans
        payload:
          study_id: ${s}
          total_budget_cents: 2700000
        as: CompAnalyst
        captures:
          pl: $.data.id
      - call: GET /api/gap-findings
        payload:
          study_id: ${s}
        as: CompAnalyst
        captures:
          fnd: $.data[0].id
      - call: POST /api/gap-findings/${fnd}/disposition
        payload:
          disposition: TARGETED
        as: CompAnalyst
      - call: POST /api/adjustments
        payload:
          plan_id: ${pl}
          gap_finding_id: ${fnd}
          employee_snapshot_id: ${f1}
          proposed_increase_cents: 50000
          effective_date: '2026-09-01'
        as: CompAnalyst
        as_user_id: user-analyst-1
        captures:
          a1: $.data.id
      - call: POST /api/adjustments
        payload:
          plan_id: ${pl}
          gap_finding_id: ${fnd}
          employee_snapshot_id: ${m1}
          proposed_increase_cents: 60000
          effective_date: '2026-09-01'
        as: CompAnalyst
        as_user_id: user-analyst-1
        captures:
          a2: $.data.id
      trigger:
      - call: POST /api/remediation-plans/${pl}/decision
        payload:
          decision: APPROVE
        as: RemediationApprover
        captures:
          err0: $.data.error_id
      - call: POST /api/remediation-plans/${pl}/submit
        payload: {}
        as: CompAnalyst
      - call: POST /api/remediation-plans/${pl}/decision
        payload:
          decision: APPROVE
        as: RemediationApprover
      - call: GET /api/remediation-plans/${pl}
        payload: {}
        as: RemediationApprover
        captures:
          pv1: $.data.version
      - call: POST /api/adjustments/${a1}/reverse
        payload:
          rationale: too early
        as: RemediationApprover
        captures:
          err1: $.data.error_id
      - call: POST /api/adjustments/${a1}/decision
        payload:
          decision: APPROVE
          expected_plan_version: ${pv1}
        as: RemediationApprover
        as_user_id: user-approver-1
        captures:
          a1_st: $.data.status
      - call: POST /api/adjustments/${a2}/decision
        payload:
          decision: APPROVE
          expected_plan_version: ${pv1}
        as: RemediationApprover
        as_user_id: user-approver-1
        captures:
          err2: $.data.error_id
      - call: GET /api/remediation-plans/${pl}
        payload: {}
        as: RemediationApprover
        captures:
          pv2: $.data.version
      - call: POST /api/adjustments/${a2}/decision
        payload:
          decision: APPROVE
          expected_plan_version: ${pv2}
        as: RemediationApprover
        as_user_id: user-approver-1
        captures:
          a2_st: $.data.status
      assert:
      - err0 == ERR_PLAN_INVALID_STATE (http 409) — committee cannot decide a DRAFT (unsubmitted) plan
      - err1 == ERR_ADJUSTMENT_INVALID_STATE (http 409) — a PROPOSED adjustment cannot be reversed
      - a1_st == APPROVED with the fresh plan version
      - err2 == ERR_STALE_PLAN_VERSION (http 412) — ${pv1} went stale when the first approval bumped plan.version
      - a2_st == APPROVED after re-reading the version and retrying
  - name: occ_model_run_stale_group
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[model-run-create-stale-group]
    excluded_because:
      difficulty_instance: model_run_create_occ_beats_state
      rationale: Stale-group 412 asserted there (in dual failure with state); fresh-version success is exercised by every
        run creation in this file.
  - name: scheduled_adjustment_and_cycle_sweeps
    claim_type: scheduled_actions
    grounds:
    - calculations.scheduled_transition_sweep
    excluded_because:
      difficulty_instance: clock_effectivation_cascade_to_monitoring
      rationale: Adjustment effectivation sweep asserted there; cycle DUE sweep asserted in cycle_guards_and_full_flow_to_study_close
        (same file).
  - name: derived_fields_reconcile
    claim_type: derived_field_reconciliation
    grounds:
    - calculations.plan_budget_reconciliation
    - entities.ComparatorGroup.fields.member_count
    excluded_because:
      difficulty_instance: approve_reverse_roundtrip_conserves_budget_cents
      rationale: committed/remaining reconciliation across approve/effective/reverse asserted there; member_count reconciliation
        asserted in assign_unassign_roundtrip_conserves_headcount.
- section: consistency_model
  instances:
  - name: immediate_read_after_write_consistency
    claim_type: immediate_consistency
    grounds:
    - complexity_profile.consistency_model
    distinguishing_aspect: 'Immediate consistency: a snapshot POST is visible in the parent''s computed snapshot_count on
      the very next GET; a PATCH''d field reads back identically.'
    test_recipe:
      setup:
      - Study IC (2025) DRAFT
      setup_api_calls:
      - call: POST /api/pay-equity-studies
        payload:
          name: IC
          analysis_period_start: '2025-01-01'
          analysis_period_end: '2025-12-31'
          protected_classes:
          - GENDER
        as: CompAnalyst
        captures:
          s: $.data.id
      trigger:
      - call: POST /api/employee-snapshots
        payload:
          study_id: ${s}
          employee_ref: IC1
          gender_class: MALE
          ethnicity_class: WHITE
          age_band: UNDER_40
          job_family: ENG
          job_level: 5
          location_code: CA
          fte_factor: 1.0
          base_salary_cents: 10000000
          bonus_cents: 0
          hire_date: '2020-01-01'
        as: PeopleOpsAdmin
        captures:
          e1: $.data.id
      - call: GET /api/pay-equity-studies/${s}
        payload: {}
        as: CompAnalyst
        captures:
          cnt: $.data.snapshot_count
      - call: PATCH /api/employee-snapshots/${e1}
        payload:
          base_salary_cents: 10500000
        as: PeopleOpsAdmin
        captures:
          ann: $.data.annualized_base_cents
          v: $.data.version
      - call: GET /api/employee-snapshots/${e1}
        payload: {}
        as: CompAnalyst
        captures:
          base: $.data.base_salary_cents
      assert:
      - cnt == 1 immediately after the POST (no read lag)
      - 'PATCH response: ann == 10500000 recomputed in-request and v == 2'
      - 'Read-back: base == 10500000'
