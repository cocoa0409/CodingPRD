  - rule_id: compensating_invariant
    instances:
      - name: bin_inventory_weigh_then_void_restores_on_hand
        grounds:
          - calculations.bin_on_hand
          - state_machines.Weighment.RECORDED_to_VOID
          - entities.Bin.fields.on_hand_tons
        distinguishing_aspect: |
          Conserved quantity: PHYSICAL INVENTORY TONS. on_hand_tons == cumulative_replenished_tons -
          sum(RECORDED weighments): replenish 20, weigh 4.000 -> 16, void the same weighment -> exactly
          20 again; cumulative_replenished_tons never moves (20 throughout). Different conserved
          quantity from the credit and contract instances.
        test_recipe:
          setup:
            - "Catalog + F-GROW ACTIVE; order 10t CONFIRMED; batch BATCHING; corn bin replenished 20t"
