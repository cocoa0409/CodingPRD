        claim_type: temporal_validation
        grounds: ["validations[priority=20]", "errors[ERR_PERMIT_LEAD_TIME_INSUFFICIENT]"]
        distinguishing_aspect: "The same permit with lead_time_days_required 45 is refused at clock 2026-08-01T00:00:00Z (41 whole days to the element) and accepted after the clock is set to 2026-07-20T00:00:00Z (53 whole days); nothing about the permit changes between the two attempts."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one Venue; one APPROVED Supplier."
            - "Program 2026-09-10..2026-09-14 with an OFF_PREMISE_EVENT element 2026-09-11T09:00Z..12:00Z."
            - "One DRAFT Permit of type SPECIAL_VENUE with lead_time_days_required 45."
          setup_api_calls:
            - call: "POST /dmc/venues"
              payload: { name: "Lead Time Venue", capacity_seated: 100, capacity_reception: 300, turnover_buffer_minutes: 90, requires_special_venue_permit: true, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Lead Time Supplier", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Lead Time Client", group_name: "Lead Time Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 60, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "OFF_PREMISE_EVENT", title: "Warehouse Gala", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T12:00:00Z", planned_headcount: 60, guaranteed_headcount: 60, per_person_cost_cents: 4000, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
              captures: { el_id: $.data.id }
            - call: "POST /dmc/permits"
              payload: { element_id: "${el_id}", permit_type: "SPECIAL_VENUE", authority_name: "City Licensing Board", lead_time_days_required: 45 }
              as: PermitOfficer
              captures: { permit_id: $.data.id }
          trigger:
            - call: "POST /dmc/permits/${permit_id}/submit"
              payload: {}
              as: PermitOfficer
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/permits/${permit_id}/submit"
              payload: {}
              as: PermitOfficer
          assert:
            - "the first trigger call returns HTTP 422 and ${err} == ERR_PERMIT_LEAD_TIME_INSUFFICIENT (41 whole days < 45)"
            - "Permit.${permit_id}.status == DRAFT after the first trigger call"
            - "the third trigger call returns HTTP 200 (53 whole days >= 45)"
            - "Permit.${permit_id}.status == SUBMITTED"
            - "Permit.${permit_id}.resubmission_count == 0"

      - name: countersign_blocked_while_supplier_liability_limit_is_below_the_contract_requirement
        claim_type: cross_entity_validation
        grounds: ["validations[priority=14]", "errors[ERR_SUPPLIER_INSURANCE_INSUFFICIENT]", entities.Supplier.fields.insurance_liability_limit_cents]
        distinguishing_aspect: "Validity lives on the Supplier, not the contract: countersign fails with HTTP 422 ERR_SUPPLIER_INSURANCE_INSUFFICIENT at limit 50000000 against required 100000000, then succeeds untouched once the supplier is patched to exactly 100000000, stamping deposit_paid_cents 90000."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one APPROVED Supplier with coi_verified true, insurance_expires_on 2027-01-31 and insurance_liability_limit_cents 50000000."
            - "One DRAFT Program; one SENT SupplierContract with required_liability_limit_cents 100000000, contract_value_cents 300000 and deposit_pct 0.3."
          setup_api_calls:
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Thin Cover Transport", supplier_type: "TRANSPORT", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 50000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Insurance Client", group_name: "Insurance Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 30, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
            - call: "POST /dmc/supplier-contracts"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_value_cents: 300000, required_liability_limit_cents: 100000000, deposit_pct: 0.3, cancellation_tier: "STANDARD" }
              as: SupplierManager
              captures: { ctr_id: $.data.id }
          trigger:
            - call: "POST /dmc/supplier-contracts/${ctr_id}/send"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-sender-1"
              captures: { err_send: $.data.error_id }
            - call: "PATCH /dmc/suppliers/${sup_id}"
              payload: { insurance_liability_limit_cents: 100000000 }
              as: SupplierManager
            - call: "POST /dmc/supplier-contracts/${ctr_id}/countersign"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-signer-2"
          assert:
            - "the first trigger call returns HTTP 422 and ${err_send} == ERR_SUPPLIER_INSURANCE_INSUFFICIENT (50000000 < 100000000)"
            - "SupplierContract.${ctr_id}.status == DRAFT after the first trigger call"
            - "after the PATCH, Supplier.${sup_id}.insurance_liability_limit_cents == 100000000 and Supplier.${sup_id}.version == 2"
            - "the send that follows the PATCH succeeds and the third trigger call returns HTTP 200 with SupplierContract.${ctr_id}.status == ACTIVE"
            - "SupplierContract.${ctr_id}.deposit_due_cents == 90000 and SupplierContract.${ctr_id}.deposit_paid_cents == 90000"

      - name: element_create_succeeds_when_every_rule_is_satisfied
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=22]", "validations[priority=30]", "validations[priority=21]"]
        distinguishing_aspect: "An element inside the program window, at 65 of a 100-seat venue's seated capacity, starting 90 minutes after the incumbent element ends, satisfies the turnover, capacity and window rules at once and returns 201 with no error body."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one Venue with capacity_seated 100 and turnover_buffer_minutes 90; one APPROVED Supplier."
            - "Program 2026-09-10..2026-09-14; incumbent element 2026-09-11T09:00Z..11:00Z with planned_headcount 40."
          setup_api_calls:
            - call: "POST /dmc/venues"
              payload: { name: "Happy Path Venue", capacity_seated: 100, capacity_reception: 200, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
