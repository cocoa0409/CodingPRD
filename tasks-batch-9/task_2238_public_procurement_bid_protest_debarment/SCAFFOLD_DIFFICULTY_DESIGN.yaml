            - call: "POST /procurement/solicitations"
              payload:
                solicitation_number: "SOL-2238-RT1B"
                title: "Detention Basin Grading South"
                issuing_agency_code: "DOT"
                estimated_value_cents: 10000000
                original_bid_due_utc: "2026-08-27T00:00:00Z"
                original_question_deadline_utc: "2026-08-20T00:00:00Z"
                mandatory_requirements:
                  - { requirement_code: "REQ-SWPPP", description: "stormwater pollution prevention plan", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { s17_id: $.data.id }
            - call: "POST /procurement/solicitations/${s17_id}/issue"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /procurement/solicitations/${s16_id}/questions"
              payload: { vendor_id: "${v20_id}", question_text: "who holds the SWPPP permit of record?" }
              as: Vendor
