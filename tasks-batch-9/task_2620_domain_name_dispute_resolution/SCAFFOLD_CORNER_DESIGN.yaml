  - section: endpoints
    note: |
      Endpoint-shaped claims: the action endpoints whose side-effect lists are not already the
      subject of a §1.8 instance, the computed read over the precedent database, and the two
      partial-update surfaces (availability, manual lock) whose omitted fields must be left alone.
    instances:
      - name: publication_assembles_its_own_digest_and_the_precedent_filters_narrow_the_page
        claim_type: computed_fields
        grounds:
          - endpoints[POST /udrp/decisions/{id}/publish].side_effects
          - endpoints[GET /udrp/precedents].side_effects
          - entities.PrecedentEntry.fields.digest_text
          - calculations.precedent_citation_metrics
          - endpoints[GET /udrp/decisions/{id}/votes].output
        distinguishing_aspect: "digest_text is declared source system even though publish accepts a digest_text input, so a caller-supplied digest must be discarded and replaced by '<case_number> | <outcome> | rdnh=<flag>'. A PARTY_NAMES redaction drives publication_status to REDACTED yet leaves the entry citable, and the search filters have to agree with the stored row: citable true lists it, outcome CANCELLATION does not."
