              captures: { draw1_id: $.data.id }
            - call: "POST /rehab/inspections"
              payload: { application_id: "${app_id}", draw_request_id: "${draw1_id}", inspection_type: "DRAW", scheduled_start_at: "2026-09-20T13:00:00Z", scheduled_end_at: "2026-09-20T15:00:00Z" }
              as: Inspector
