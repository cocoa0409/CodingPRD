            - "Cabinet creation in that row returns 409 ERR_ROW_NOT_ACCEPTING_SPACE"
            - "Reserving Cabinet.${cab2_id} returns 409 ERR_ROW_NOT_ACCEPTING_SPACE and leaves its status == AVAILABLE with contract_id == null"
            - "Energizing PowerCircuit.${cir_id} returns 409 ERR_ROW_NOT_ACCEPTING_SPACE and leaves status == APPROVED with allocated_kw == 0.000"
            - "After the second PATCH, FloorRow.${row_id}.decommission_flag == false and row_status == OPEN"
            - "Cabinet.${cab2_id}.status == RESERVED and FloorRow.${row_id}.occupied_slot_count == 2 with density_ceiling_kw == 50.000"
            - "PowerCircuit.${cir_id}.status == ENERGIZED with allocated_kw == 9.600, Cabinet.${cab1_id}.status == ACTIVE, FloorRow.${row_id}.allocated_power_kw == 9.600 and row_status == OPEN"
            - "GET /colocation/cabinets?row_id=${row_id} returns exactly 2 cabinets, proving the refused creation persisted nothing"

  - rule_id: resource_temporal_overlap
    instances:
      - name: cabinet_visit_windows_are_half_open_so_touching_windows_coexist
        grounds:
          - calculations.visit_escort_and_occupancy
          - validations.priority_35_ERR_VISIT_WINDOW_CONFLICT
          - state_machines.AccessVisit.SCHEDULED_to_CANCELLED
          - entities.AccessVisit.fields.escort_required
          - entities.AccessVisit.fields.window_end
        distinguishing_aspect: |
          Gate A is evaluated on the HALF-OPEN interval and only per cabinet: 10:00-12:00 and
          12:00-14:00 on the SAME cabinet both succeed because the touching instant is not an
          overlap, an 11:00-13:00 window straddling them is refused, the identical 11:00-13:00
          window on a DIFFERENT cabinet succeeds, and cancelling the first visit frees its slice
          so the straddling window is then admitted. All visits are UNESCORTED MAINTENANCE on
          CABINET footprints, so escort_required is false and the row gate never participates.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Contract ACTIVE with committed_cabinet_count 2; cabinets C01 and C02 both INSTALLED on it in row HG/R1 with escort_slot_count 1."
            - "One UNESCORTED contact holding the SITE_ACCESS scope."
            - "All visits use purpose MAINTENANCE and CABINET footprints, so escort_required is false on every one of them."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Cloudberry Analytics", account_code: "CLB" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/contacts"
              payload: { customer_id: "${cust_id}", full_name: "Wei Visitor", authorization_scopes: ["SITE_ACCESS"], access_level: "UNESCORTED" }
              as: SecurityOfficer
              captures: { con_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "HG", row_code: "R1", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9016", billing_mode: "COMMITTED_ONLY", committed_cabinet_count: 2, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 4, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", committed_cage_sqft: 0, redundancy_requirement: "N", cross_connect_allowance: 0, remote_hands_included_minutes: 0 }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab1_id: $.data.id }
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C02", rated_power_kw: 20.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab2_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab1_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab2_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab1_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab2_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
          trigger:
            - call: "POST /colocation/access-visits"
              payload: { contract_id: "${ctr_id}", contact_id: "${con_id}", cabinet_id: "${cab1_id}", purpose: "MAINTENANCE", window_start: "2026-08-01T10:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: SecurityOfficer
              captures: { v1_id: $.data.id }
            - call: "POST /colocation/access-visits"
              payload: { contract_id: "${ctr_id}", contact_id: "${con_id}", cabinet_id: "${cab1_id}", purpose: "MAINTENANCE", window_start: "2026-08-01T12:00:00Z", window_end: "2026-08-01T14:00:00Z" }
              as: SecurityOfficer
              captures: { v2_id: $.data.id }
            - call: "POST /colocation/access-visits"
              payload: { contract_id: "${ctr_id}", contact_id: "${con_id}", cabinet_id: "${cab1_id}", purpose: "MAINTENANCE", window_start: "2026-08-01T11:00:00Z", window_end: "2026-08-01T13:00:00Z" }
              as: SecurityOfficer
            - call: "POST /colocation/access-visits"
              payload: { contract_id: "${ctr_id}", contact_id: "${con_id}", cabinet_id: "${cab2_id}", purpose: "MAINTENANCE", window_start: "2026-08-01T11:00:00Z", window_end: "2026-08-01T13:00:00Z" }
              as: SecurityOfficer
              captures: { v4_id: $.data.id }
            - call: "POST /colocation/access-visits/${v1_id}/state"
              payload: { to_state: "CANCELLED" }
              as: SecurityOfficer
            - call: "POST /colocation/access-visits/${v2_id}/state"
              payload: { to_state: "CANCELLED" }
              as: SecurityOfficer
            - call: "POST /colocation/access-visits"
              payload: { contract_id: "${ctr_id}", contact_id: "${con_id}", cabinet_id: "${cab1_id}", purpose: "MAINTENANCE", window_start: "2026-08-01T11:00:00Z", window_end: "2026-08-01T13:00:00Z" }
              as: SecurityOfficer
              captures: { v5_id: $.data.id }
          assert:
            - "Visit 1 (10:00-12:00 on C01) returns 201 with status SCHEDULED and escort_required == false"
            - "Visit 2 (12:00-14:00 on C01) returns 201 — the touching endpoint is NOT a conflict under the half-open rule"
            - "Visit 3 (11:00-13:00 on C01) returns 409 ERR_VISIT_WINDOW_CONFLICT"
            - "Visit 4 (11:00-13:00 on C02) returns 201 — Gate A is scoped to a single cabinet_id"
            - "AccessVisit.${v4_id}.escort_required == false, proving the row escort gate was skipped for every visit"
            - "After cancelling visits 1 and 2, AccessVisit.${v1_id}.status == CANCELLED and AccessVisit.${v2_id}.status == CANCELLED"
            - "Visit 5 (11:00-13:00 on C01) now returns 201 because CANCELLED visits stop occupying the cabinet window"
            - "GET /colocation/access-visits?cabinet_id=${cab1_id}&status=SCHEDULED returns exactly 1 visit, AccessVisit.${v5_id}"

      - name: row_escort_capacity_is_closed_interval_so_touching_windows_collide
        grounds:
          - calculations.visit_escort_and_occupancy
          - validations.priority_36_ERR_ESCORT_CAPACITY_EXCEEDED
          - entities.FloorRow.fields.escort_slot_count
          - entities.AuthorizedContact.fields.access_level
          - state_machines.AccessVisit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Gate B uses the CLOSED interval and aggregates across the whole row, so the very same
          10:00-12:00 / 12:00-14:00 touching pair that Gate A admits on one cabinet is REFUSED
          across two cabinets of one row once both visits are escort-requiring and
          escort_slot_count is 1. Moving the second window one second later to 12:00:01 makes it
          fit, and cancelling both incumbents lets the original 12:00-14:00 window through —
          pinning the comparison to <= on both sides rather than <.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Row HH/R1 with escort_slot_count 1, holding cabinets C01 and C02, both INSTALLED on the same ACTIVE contract."
            - "One contact with access_level ESCORTED_ONLY holding the SITE_ACCESS scope, so every visit it books has escort_required true."
