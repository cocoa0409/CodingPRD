              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/authorizations"
              payload: { client_id: "${cl_id}", scope_tier: "FULL_AGENCY", instrument_reference: "AGR-2026-29", effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: FiduciaryManager
