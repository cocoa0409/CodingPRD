              as: PanelOperationsManager
              captures: { hm1_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${hm1_id}", meter_type: "TV_TUNER", serial_no: "MT-001001" }
              as: FieldTechnician
              captures: { mtm1_id: "$.data.id" }
            - call: "POST /meters/${mtm1_id}/install-confirmations"
              payload: {}
