scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual-variant calculations on different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: plan_scope_cost_brand_vs_owner_variance
        grounds:
          - calculations.plan_scope_cost
          - entities.PipPlan.fields.brand_scoped_total_cents
          - entities.PipPlan.fields.owner_claimed_total_cents
          - entities.PipItem.fields.owner_claimed_cost_cents
          - state_machines.ScopeDispute.FILED_to_RESOLVED_UPHELD
          - endpoints["GET /pip/plans/{id}/cost-summary"]
        distinguishing_aspect: |
          This dual variant is cost accounting on a PipPlan: the brand_scoped variant reads
          brand_estimated_cost_cents while the owner_claimed variant substitutes the disputed
          owner figure, so the same item set yields 2222221 versus 2987654, and only the
          brand variant feeds funding_requirement_cents.
        test_recipe:
          setup:
            - "One franchisee, one 200-key property, one plan holding a GUEST_FACING item of 1234567 cents and a BACK_OF_HOUSE item of 987654 cents."
            - "Plan issued at the default logical clock 2026-08-01T00:00:00Z; no capital budget exists, so the default contingency of 0.10 applies."
            - "The owner then contests the guest-facing item's cost with a claim of 2000000 cents."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Harborline Lodging LLC", contact_email: "ops@harborline.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Harborline Midtown", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-4.2.1", brand_estimated_cost_cents: 1234567, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_gf_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "BACK_OF_HOUSE", standards_reference: "BOH-9.1.4", brand_estimated_cost_cents: 987654, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_boh_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
          trigger:
            - call: "POST /pip/disputes"
              payload: { plan_id: "${plan_id}", item_id: "${item_gf_id}", dispute_basis: "COST_ESTIMATE", claimed_cost_cents: 2000000 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { dispute_id: $.data.id }
            - call: "GET /pip/plans/${plan_id}/cost-summary"
              as: BrandManager
              as_user_id: "bm-001"
          assert:
            - "PipPlan.${plan_id}.brand_scoped_total_cents == 2222221"
            - "PipPlan.${plan_id}.owner_claimed_total_cents == 2987654"
            - "cost-summary.variance_cents == 765433"
            - "cost-summary.variance_pct == 34.44"
            - "cost-summary.included_item_count == 2"
            - "PipItem.${item_gf_id}.owner_claimed_cost_cents == 2000000"
            - "PipItem.${item_boh_id}.owner_claimed_cost_cents == null"
            - "PipItem.${item_gf_id}.approved_cost_cents == 1234567 (a filed dispute never moves the approved figure)"
            - "PipPlan.${plan_id}.funding_requirement_cents == 2584319 (1459875 + 1124444, computed from the brand variant only)"
            - "PipPlan.${plan_id}.status == ISSUED and PipPlan.${plan_id}.dispute_state == DISPUTE_OPEN"

      - name: property_risk_score_snapshot_vs_projected
        grounds:
          - calculations.compliance_risk_score
          - calculations.compliance_posture_derivation
          - entities.Property.fields.compliance_risk_score
          - entities.Property.fields.compliance_posture
          - endpoints["GET /pip/properties/{id}/risk-summary"]
        distinguishing_aspect: |
          This dual variant is compliance risk scoring on a Property, a different entity domain
          and a different metric from plan_scope_cost: as_of_snapshot counts only items already
          past deadline (score 100, COMPLIANT) while projected_at_deadline also counts unstarted
          items due inside the 30-day horizon (score 75, AT_RISK) from identical stored data.
        test_recipe:
          setup:
            - "One 200-key property with a plan holding a single LIFE_SAFETY item of 1000000 cents."
            - "Plan issued at the default clock 2026-08-01T00:00:00Z, so the life-safety deadline is 2026-10-30."
            - "Logical clock then moved to 2026-10-25, five days before the deadline and inside the 30-day projection horizon."
            - "No capital budget exists, so funding_gap_cents is 0 and the funding penalty is 0."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Cascade Hospitality Partners", contact_email: "asset@cascadehp.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Cascade Riverfront", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "RELICENSING", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "LIFE_SAFETY", standards_reference: "LS-2.1.1", brand_estimated_cost_cents: 1000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_ls_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-25T00:00:00Z" }
              as: BrandManager
              as_user_id: "bm-001"
          trigger:
            - call: "GET /pip/properties/${prop_id}/risk-summary"
              as: BrandManager
              as_user_id: "bm-001"
          assert:
            - "risk-summary.snapshot_score == 100"
            - "risk-summary.snapshot_posture == COMPLIANT"
            - "risk-summary.projected_score == 75"
            - "risk-summary.projected_posture == AT_RISK"
            - "risk-summary.overdue_life_safety_count == 0"
            - "risk-summary.projected_life_safety_count == 1"
            - "risk-summary.projection_horizon_days == 30"
            - "risk-summary.funding_gap_penalty == 0"
            - "Property.${prop_id}.compliance_risk_score == 100 and Property.${prop_id}.compliance_posture == COMPLIANT (only the snapshot variant is persisted)"
            - "PipItem.${item_ls_id}.deadline_date == \"2026-10-30\" and PipItem.${item_ls_id}.is_overdue == false"

  # =========================================================================
  # Rule 2 — combinatorial formulas in different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: funding_requirement_per_item_rounding_then_sum
        grounds:
          - calculations.funding_requirement
          - entities.PipItem.fields.item_funding_cents
          - entities.PipPlan.fields.funding_requirement_cents
          - endpoints["GET /pip/plans/{id}/cost-summary"]
        distinguishing_aspect: |
          Mode (b), nested rounding whose order changes the cents: the scaffold pins
          round-each-item-then-sum, so three LIFE_SAFETY items of 100005 cents at contingency
          0.10 yield 110006 each and 330018 in total, whereas the forbidden sum-then-round order
          would yield 330017.
        test_recipe:
          setup:
            - "One property with a plan holding exactly three LIFE_SAFETY items of 100005 cents each."
            - "Plan issued at the default clock; no capital budget exists, so DEFAULT_CONTINGENCY_PCT 0.10 and the LIFE_SAFETY escalation factor 1.00 apply."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Northgate Inns LLC", contact_email: "cfo@northgateinns.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Northgate Airport", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "LIFE_SAFETY", standards_reference: "LS-3.1.1", brand_estimated_cost_cents: 100005, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_a_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "LIFE_SAFETY", standards_reference: "LS-3.1.2", brand_estimated_cost_cents: 100005, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_b_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "LIFE_SAFETY", standards_reference: "LS-3.1.3", brand_estimated_cost_cents: 100005, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_c_id: $.data.id }
          trigger:
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "GET /pip/plans/${plan_id}/cost-summary"
              as: BrandManager
              as_user_id: "bm-001"
          assert:
            - "PipItem.${item_a_id}.item_funding_cents == 110006"
            - "PipItem.${item_b_id}.item_funding_cents == 110006"
            - "PipItem.${item_c_id}.item_funding_cents == 110006"
            - "PipPlan.${plan_id}.funding_requirement_cents == 330018"
            - "PipPlan.${plan_id}.funding_requirement_cents != 330017 (the sum-then-round order is forbidden)"
            - "PipPlan.${plan_id}.brand_scoped_total_cents == 300015"
            - "cost-summary.contingency_pct_applied == 0.10"
            - "PipPlan.${plan_id}.funding_gap_cents == 0 (no active capital budget)"

      - name: extension_grant_cap_pinned_evaluation_order
        grounds:
          - calculations.extension_grant_cap
          - state_machines.ExtensionRequest.SUBMITTED_to_APPROVED_PARTIAL
          - entities.ExtensionRequest.fields.pressure_ratio_at_decision
          - entities.PipItem.fields.extension_days_granted
          - endpoints["POST /pip/extension-requests/{id}/decide"]
        distinguishing_aspect: |
          Mode (c), a circular-looking dependency with a pinned evaluation order: the grant moves
          the deadline that the schedule-pressure ratio is measured from, and because step 1 is
          pinned to read pre-grant deadlines the ratio is exactly 0.6000, the cap is 60 days and
          the 90-day request lands as APPROVED_PARTIAL rather than being self-referentially
          undefined.
        test_recipe:
          setup:
            - "One property with a plan holding three LIFE_SAFETY items of 100000 cents, one GUEST_FACING item of 1000000 cents and one BACK_OF_HOUSE item of 500000 cents."
            - "Plan issued at the default clock 2026-08-01T00:00:00Z: life-safety deadline 2026-10-30, guest-facing 2027-04-28, back-of-house 2027-10-25."
            - "Logical clock moved to 2026-09-15, so the 60-day pressure horizon ends 2026-11-14 and only the three life-safety items fall inside it."
            - "The owner files a 90-day extension request on the guest-facing item, which moves that item to DEFERRED_PENDING_EXTENSION without changing its deadline."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Summit Ridge Hotels Inc", contact_email: "pm@summitridge.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Summit Ridge Lakeside", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "LIFE_SAFETY", standards_reference: "LS-1.1.1", brand_estimated_cost_cents: 100000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { ls1_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "LIFE_SAFETY", standards_reference: "LS-1.1.2", brand_estimated_cost_cents: 100000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { ls2_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "LIFE_SAFETY", standards_reference: "LS-1.1.3", brand_estimated_cost_cents: 100000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { ls3_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-6.3.2", brand_estimated_cost_cents: 1000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { gf_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "BACK_OF_HOUSE", standards_reference: "BOH-2.2.7", brand_estimated_cost_cents: 500000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { boh_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/extension-requests"
              payload: { item_id: "${gf_id}", requested_days: 90, business_justification: "Casegoods vendor confirms a twelve week backorder on the guest room package, so the corridor refresh cannot finish on schedule." }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { er_id: $.data.id }
          trigger:
            - call: "POST /pip/extension-requests/${er_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Partial grant only; the life safety package remains due on its original date." }
              as: BrandManager
              as_user_id: "bm-002"
          assert:
            - "ExtensionRequest.${er_id}.status == APPROVED_PARTIAL"
            - "ExtensionRequest.${er_id}.granted_days == 60"
            - "ExtensionRequest.${er_id}.pressure_ratio_at_decision == 0.6000"
            - "PipItem.${gf_id}.extension_days_granted == 60"
            - "PipItem.${gf_id}.deadline_date == \"2027-06-27\""
            - "PipItem.${gf_id}.status == SCOPED"
            - "PipItem.${ls1_id}.deadline_date == \"2026-10-30\" (unchanged; the grant does not move other items)"
            - "PipPlan.${plan_id}.guest_facing_deadline_date == \"2027-04-28\" (the plan-level category deadline is never rewritten by a grant)"

  # =========================================================================
  # Rule 3 — non-linear state machines on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: extension_revision_loop_bounded_by_three_rounds
        grounds:
          - state_machines.ExtensionRequest.SUBMITTED_to_NEEDS_MORE_JUSTIFICATION
          - state_machines.ExtensionRequest.NEEDS_MORE_JUSTIFICATION_to_SUBMITTED
          - entities.ExtensionRequest.fields.round_number
          - validations[priority=85]
          - errors[ERR_EXTENSION_ROUNDS_EXHAUSTED]
        distinguishing_aspect: |
          ExtensionRequest carries a genuine cycle SUBMITTED -> NEEDS_MORE_JUSTIFICATION ->
          SUBMITTED that can be traversed exactly twice, and the fourth submission attempt is
          refused with ERR_EXTENSION_ROUNDS_EXHAUSTED once round_number reaches 3.
        test_recipe:
          setup:
            - "One property with a plan holding a single GUEST_FACING item of 1000000 cents, issued at the default clock."
            - "The owner has filed one extension request on that item, so round_number is 1 and the item sits in DEFERRED_PENDING_EXTENSION."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Bayview Lodging Group", contact_email: "ops@bayviewlg.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Bayview Harbor", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "TRANSACTION_CHANGE_OF_OWNERSHIP", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-5.5.5", brand_estimated_cost_cents: 1000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { gf_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/extension-requests"
              payload: { item_id: "${gf_id}", requested_days: 45, business_justification: "Municipal permit review for the guest bathroom rework is running eight weeks behind the published queue." }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { er_id: $.data.id }
          trigger:
            - call: "POST /pip/extension-requests/${er_id}/decide"
              payload: { decision: "REQUEST_MORE_JUSTIFICATION", decision_note: "Attach the permit tracking number." }
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/extension-requests/${er_id}/resubmit"
              payload: { requested_days: 45, business_justification: "Permit tracking number 2026-BLD-88431 shows the plan review queued behind two hundred filings." }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "POST /pip/extension-requests/${er_id}/decide"
              payload: { decision: "REQUEST_MORE_JUSTIFICATION", decision_note: "Attach the contractor mobilisation letter as well." }
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/extension-requests/${er_id}/resubmit"
              payload: { requested_days: 45, business_justification: "Contractor mobilisation letter dated 2026-09-02 confirms a first available crew window in December." }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "POST /pip/extension-requests/${er_id}/decide"
              payload: { decision: "REQUEST_MORE_JUSTIFICATION", decision_note: "Still insufficient; provide the signed vendor schedule." }
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/extension-requests/${er_id}/resubmit"
              payload: { requested_days: 45, business_justification: "Signed vendor schedule attached showing fabrication start in November and install in January." }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
          assert:
            - "the first five trigger calls return 200 and the sixth returns 409 with error_id == ERR_EXTENSION_ROUNDS_EXHAUSTED"
            - "ExtensionRequest.${er_id}.round_number == 3"
            - "ExtensionRequest.${er_id}.status == NEEDS_MORE_JUSTIFICATION"
            - "ExtensionRequest.${er_id}.granted_days == 0"
            - "PipItem.${gf_id}.status == DEFERRED_PENDING_EXTENSION throughout the loop"
            - "PipItem.${gf_id}.extension_days_granted == 0 and PipItem.${gf_id}.deadline_date == \"2027-04-28\""

      - name: plan_dispute_dimension_cycles_while_status_dimension_holds
        grounds:
          - state_machines.PipPlan.dispute_state.NONE_to_DISPUTE_OPEN
          - state_machines.PipPlan.dispute_state.DISPUTE_OPEN_to_DISPUTE_RESOLVED_UPHELD
          - state_machines.PipPlan.dispute_state.DISPUTE_RESOLVED_UPHELD_to_DISPUTE_OPEN
          - entities.PipPlan.fields.dispute_state
          - entities.PipPlan.fields.status
        distinguishing_aspect: |
          PipPlan is a different entity from ExtensionRequest and is non-linear in a different
          way: it carries two independent state dimensions on one row, and the dispute_state
          dimension traverses NONE -> DISPUTE_OPEN -> DISPUTE_RESOLVED_UPHELD -> DISPUTE_OPEN
          while status stays pinned at OWNER_ACKNOWLEDGED for all three hops.
        test_recipe:
          setup:
            - "One property with a plan holding a single GUEST_FACING item of 1000000 cents."
            - "Plan issued and acknowledged, so status is OWNER_ACKNOWLEDGED and dispute_state is NONE."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Copperline Hotels LP", contact_email: "legal@copperline.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Copperline Uptown", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-7.1.1", brand_estimated_cost_cents: 1000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { gf_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
