              as: KitchenAssociate
              captures: { e_mto: $.data.error_id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 9, planned_qty: 10, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { e_slot: $.data.error_id }
            - call: "POST /orders/${order_1}/place"
              payload: {}
              as: StoreTerminal
              captures: { e_supply: $.data.error_id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
