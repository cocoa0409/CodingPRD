            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_SIGNATURE", pct_of_mg: 0.45, due_date: "2026-09-01T00:00:00Z" }
              as: SalesAgent
              captures: { ms_sig_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_DELIVERY", pct_of_mg: 0.20, due_date: "2027-06-15T00:00:00Z" }
              as: SalesAgent
              captures: { ms_del_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_RELEASE", pct_of_mg: 0.10, due_date: "2027-07-15T00:00:00Z" }
              as: SalesAgent
