        distinguishing_aspect: >-
          The ledger-sync claim: a duty transition on the Robot is what settles the bay books, so one
          MAKE_AVAILABLE out of CHARGING drives the reservation ACTIVE -> RELEASED and subtracts its 60
          window_minutes from DepotBay.committed_minutes and ServiceZone.reserved_bay_minutes in the same
