      - name: margin_report_cost_base_excludes_planned_builds_and_cancelled_revenue
        claim_type: input_set_filtering
        grounds: >-
          calculations.event_margin_report input_set ("HospitalityBuilds filtered
          to build_state IN {APPROVED, READY, CLOSED} — PLANNED and CANCELLED
          builds never enter the cost base"; RightsDeals excluding TERMINATED;
          AllocationBlocks including RECALLED ones; Bookings filtered per
          variant) and its variants PROVISIONAL (live bookings, exposure at full
          cost) / FINAL (DELIVERED nets plus CANCELLED fees, exposure written
          down by SALVAGE_RECOVERY_PCT 0.35); endpoints
          "GET /events/{id}/margin-report" (input variant?).
