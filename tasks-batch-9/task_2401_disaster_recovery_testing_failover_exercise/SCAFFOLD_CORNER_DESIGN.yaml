# §1.9 Scaffold Corner Design — breadth probe for the DR testing & failover-exercise domain.
# Walks references/claim-extraction-guide.md row by row against SCAFFOLD.yaml §1.1-§1.7.
# Anchors p01..p22 (defined in the first instance below) are the canonical empty-DB -> READY-group
# bootstrap: clock 2026-08-01T00:00:00Z, five entity-backed stakeholders, SITE-P/SITE-R,
# APP-CORE AGREED at TIER_1 60/15, AST-DB1, RG-1 with a HARD APP-CORE -> AST-DB1 edge, and runbook
# rb1 VALIDATED with one weight-10 step, giving readiness 100.00, posture READY and
# projected_recovery_minutes 80. Later instances alias any prefix of that chain.
scaffold_corner_design:
  - section: entities
    instances:
      - name: recovery_group_computed_posture_and_projection_are_derived_from_members
        claim_type: computed_fields
        grounds:
          - entities.RecoveryGroup.fields.posture
          - entities.RecoveryGroup.fields.projected_recovery_minutes
          - entities.RecoveryGroup.fields.recovery_sequence
          - entities.RecoveryGroup.fields.open_finding_count
          - calculations.recovery_group_posture_derivation
          - calculations.projected_recovery_minutes_critical_path
          - endpoints.POST./recovery-groups/{id}/posture-refresh
        distinguishing_aspect: "Every RecoveryGroup field with source computed is derived from members and runbook state, never supplied by the client: posture-refresh on the bootstrap group returns posture READY, projected_recovery_minutes 80 and recovery_sequence [APP-CORE, AST-DB1]."
        test_recipe:
          setup:
            - "Empty DB, then the canonical bootstrap: clock at 2026-08-01T00:00:00Z, five stakeholders, SITE-P (PRIMARY, 0 usable) and SITE-R (RECOVERY, 40 usable)."
            - "APP-CORE is AGREED at TIER_1 with rto 60 / rpo 15; AST-DB1 is a DATA_STORE with restore_minutes 20."
            - "RG-1 holds both nodes plus a HARD APP-CORE -> AST-DB1 edge, and runbook rb1 is VALIDATED with one weight-10 step validated at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - &p01
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - &p02
              call: "POST /stakeholders"
              payload: { full_name: "Cora Lin", email: "cora.lin@example.com", org_roles: ["RESILIENCE_COORDINATOR"], approval_authority_level: "LEVEL_1" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - &p03
              call: "POST /stakeholders"
              payload: { full_name: "Bea Owens", email: "bea.owens@example.com", org_roles: ["BUSINESS_OWNER"], approval_authority_level: "LEVEL_1" }
              as: PlatformAdmin
              captures: { bo1_id: $.data.id }
            - &p04
              call: "POST /stakeholders"
              payload: { full_name: "Otto Pratt", email: "otto.pratt@example.com", org_roles: ["IT_OPERATOR"], approval_authority_level: "LEVEL_1" }
              as: PlatformAdmin
              captures: { op1_id: $.data.id }
            - &p05
              call: "POST /stakeholders"
              payload: { full_name: "Rhea Adler", email: "rhea.adler@example.com", org_roles: ["RISK_APPROVER"], approval_authority_level: "LEVEL_3" }
              as: PlatformAdmin
              captures: { ra3_id: $.data.id }
            - &p06
              call: "POST /stakeholders"
              payload: { full_name: "Ally Ito", email: "ally.ito@example.com", org_roles: ["AUDIT_LIAISON"], approval_authority_level: "LEVEL_1" }
              as: PlatformAdmin
              captures: { al1_id: $.data.id }
            - &p07
              call: "POST /sites"
              payload: { name: "Primary campus", site_code: "SITE-P", role: "PRIMARY", usable_capacity_units: 0 }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - &p08
              call: "POST /sites"
              payload: { name: "Recovery campus", site_code: "SITE-R", role: "RECOVERY", usable_capacity_units: 40 }
              as: PlatformAdmin
              captures: { sr_id: $.data.id }
            - &p09
              call: "POST /applications"
              payload: { name: "Core ledger", app_code: "APP-CORE", business_owner_id: "${bo1_id}", primary_site_id: "${sp_id}", criticality_weight: 10 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { a1_id: $.data.id }
            - &p10
              call: "POST /applications/${a1_id}/tier-proposals"
              payload: { proposed_tier: "TIER_1", proposed_rto_minutes: 60, proposed_rpo_minutes: 15, rationale: "Regulated ledger" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - &p11
              call: "POST /applications/${a1_id}/tier-decisions"
              payload: { action: "AGREE", decision_note: "Owner agrees the objectives" }
              as: BusinessOwner
              as_user_id: "${bo1_id}"
            - &p12
              call: "POST /assets"
              payload: { name: "Ledger database", asset_code: "AST-DB1", asset_kind: "DATA_STORE", site_id: "${sp_id}", replication_mode: "ASYNCHRONOUS", restore_minutes: 20, expected_txn_rate_per_minute: 150 }
              as: ITOperator
              as_user_id: "${op1_id}"
              captures: { d1_id: $.data.id }
            - &p13
              call: "POST /recovery-groups"
              payload: { name: "Ledger recovery group", group_code: "RG-1", recovery_site_id: "${sr_id}", lead_coordinator_id: "${c1_id}", recovery_order: 1 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { g1_id: $.data.id }
            - &p14
              call: "POST /applications/${a1_id}/group-assignments"
              payload: { recovery_group_id: "${g1_id}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - &p15
              call: "POST /assets/${d1_id}/group-assignments"
              payload: { recovery_group_id: "${g1_id}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - &p16
              call: "POST /dependency-edges"
              payload: { from_node_kind: "APPLICATION", from_node_id: "${a1_id}", to_node_kind: "ASSET", to_node_id: "${d1_id}", edge_kind: "HARD" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { e_a1d1_id: $.data.id }
            - &p17
              call: "GET /recovery-groups/${g1_id}"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { g1_v: $.data.version }
            - &p18
              call: "POST /runbooks"
              payload: { recovery_group_id: "${g1_id}", title: "Ledger failover runbook", author_id: "${c1_id}", expected_recovery_group_version: "${g1_v}", validity_days: 180 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { rb1_id: $.data.id }
            - &p19
              call: "POST /runbook-steps"
              payload: { runbook_id: "${rb1_id}", step_number: 1, description: "Promote the ledger replica", owner_id: "${op1_id}", expected_minutes: 15, weight: 10, covers_application_id: "${a1_id}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { s1_id: $.data.id }
            - &p20
              call: "POST /runbooks/${rb1_id}/transitions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - &p21
              call: "POST /runbook-steps/${s1_id}/validations"
              payload: { validation_note: "Walked end to end" }
              as: ITOperator
              as_user_id: "${op1_id}"
            - &p22
              call: "POST /runbooks/${rb1_id}/transitions"
              payload: { action: "VALIDATE" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /recovery-groups/${g1_id}/posture-refresh"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
          assert:
            - "RecoveryGroup.${g1_id}.posture == READY with posture_reason == READY_ALL_CHECKS_PASSED"
            - "RecoveryGroup.${g1_id}.current_runbook_id == ${rb1_id} and open_finding_count == 0"
            - "RecoveryGroup.${g1_id}.projected_recovery_minutes == 80 == 60 (APP-CORE rto) + 20 (AST-DB1 restore) along the single HARD path"
            - "RecoveryGroup.${g1_id}.recovery_sequence == [${a1_id}, ${d1_id}]"
            - "Runbook.${rb1_id}.readiness_score == 100.00 at age 0 days and status == VALIDATED"

      - name: create_application_returns_201_with_declared_defaults
        claim_type: creation
        grounds:
          - endpoints.POST./applications
          - entities.Application.fields.tier_agreement_status
          - entities.Application.fields.retier_count
          - entities.Application.fields.recovery_group_id
        distinguishing_aspect: "A freshly created Application returns 201 with every input field echoed and every computed field at its declared default: tier_agreement_status DRAFT, tier/rto_minutes/rpo_minutes/proposed_* null, proposed_by_id null, retier_count 0, recovery_group_id null, version 1."
        test_recipe:
          setup:
            - "The clock, the five stakeholders and both sites exist; no application has been created yet."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
          trigger:
            - call: "POST /applications"
              payload: { name: "Reporting portal", app_code: "APP-RPT", business_owner_id: "${bo1_id}", primary_site_id: "${sp_id}", criticality_weight: 4 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { rpt_id: $.data.id }
          assert:
            - "HTTP 201 and the envelope is { meta, response_type: \"object\", data: {...} } with data.id a non-null string"
            - "Application.${rpt_id}.name == \"Reporting portal\", app_code == \"APP-RPT\", criticality_weight == 4"
            - "Application.${rpt_id}.tier_agreement_status == DRAFT, tier == null, rto_minutes == null, rpo_minutes == null"
            - "Application.${rpt_id}.proposed_tier == null, proposed_rto_minutes == null, proposed_rpo_minutes == null, proposed_by_id == null"
            - "Application.${rpt_id}.recovery_group_id == null and retier_count == 0"
            - "Application.${rpt_id}.version == 1 with created_at == updated_at == 2026-08-01T00:00:00Z"

      - name: get_asset_by_id_returns_the_stored_representation
        claim_type: retrieval
        grounds:
          - endpoints.GET./assets/{id}
          - entities.Asset.fields.expected_txn_rate_per_minute
          - entities.Asset.fields.recovery_group_id
        distinguishing_aspect: "GET /assets/{id} returns exactly what POST /assets stored plus the group assignment applied afterwards — recovery_group_id is RG-1 and expected_txn_rate_per_minute is the supplied 150, not the field default of 0."
        test_recipe:
          setup:
            - "The bootstrap through the AST-DB1 group assignment exists, so AST-DB1 belongs to RG-1."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - *p11
            - *p12
            - *p13
            - *p14
            - *p15
          trigger:
            - call: "GET /assets/${d1_id}"
              payload: {}
              as: ITOperator
              as_user_id: "${op1_id}"
          assert:
            - "HTTP 200 with response_type \"object\""
            - "Asset.${d1_id}.asset_code == \"AST-DB1\", asset_kind == DATA_STORE, replication_mode == ASYNCHRONOUS, restore_minutes == 20"
            - "Asset.${d1_id}.expected_txn_rate_per_minute == 150 and site_id == ${sp_id}"
            - "Asset.${d1_id}.recovery_group_id == ${g1_id}"

      - name: list_runbook_steps_filtered_by_runbook_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints.GET./runbook-steps
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /runbook-steps?runbook_id=...&limit=1&offset=0 returns exactly one row with total_count 2 and has_more true, and offset=1 returns the second row with has_more false — the filter, the limit and the offset compose."
        test_recipe:
          setup:
            - "The bootstrap exists and rb1 holds two steps: step_number 1 (weight 10, covers APP-CORE) and step_number 2 (weight 10, covers AST-DB1)."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - *p11
            - *p12
            - *p13
            - *p14
            - *p15
            - *p16
            - *p17
            - *p18
            - *p19
            - call: "POST /runbook-steps"
              payload: { runbook_id: "${rb1_id}", step_number: 2, description: "Open the database at the recovery site", owner_id: "${op1_id}", expected_minutes: 20, weight: 10, covers_asset_id: "${d1_id}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { s2_id: $.data.id }
          trigger:
            - call: "GET /runbook-steps"
              payload: { runbook_id: "${rb1_id}", limit: 1, offset: 0 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "GET /runbook-steps"
              payload: { runbook_id: "${rb1_id}", limit: 1, offset: 1 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
          assert:
            - "the first list returns response_type \"array\" with exactly 1 element, total_count == 2, limit == 1, offset == 0 and has_more == true"
            - "the second list returns exactly 1 element, total_count == 2, offset == 1 and has_more == false"
            - "the two calls return different ids, together exactly {${s1_id}, ${s2_id}}"
            - "GET /runbook-steps with runbook_id set and no limit/offset returns both rows with limit == 10 and offset == 0, the declared pagination defaults"

      - name: get_exercise_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET./exercises/{id}
          - validations.priority_4
          - errors.ERR_EXERCISE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown exercise id returns 404 ERR_EXERCISE_NOT_FOUND in the error envelope, not 200 with a null body."
        test_recipe:
          setup:
            - "The clock and the five stakeholders exist; no exercise has ever been created."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
          trigger:
            - call: "GET /exercises/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { nf_error: $.data.error_id }
          assert:
            - "HTTP 404 with response_type \"error\" and nf_error == ERR_EXERCISE_NOT_FOUND"
            - "data carries error_id and message and no entity fields"

      - name: create_site_missing_required_usable_capacity_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST./sites
          - validations.priority_6
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "usable_capacity_units has source input and no default, so omitting it returns 400 ERR_INVALID_REQUEST and no Site row is created — it is not silently defaulted to 0."
        test_recipe:
          setup:
            - "The clock is set and the five stakeholders exist; SITE-P and SITE-R have not been created."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
          trigger:
            - call: "POST /sites"
              payload: { name: "Half-specified site", site_code: "SITE-X", role: "RECOVERY" }
              as: PlatformAdmin
              captures: { missing_error: $.data.error_id }
          assert:
            - "HTTP 400 with missing_error == ERR_INVALID_REQUEST"
            - "GET /sites returns total_count == 0 — the rejected create persisted nothing"

      - name: create_runbook_without_validity_days_applies_the_default_180
        claim_type: defaults
        grounds:
          - endpoints.POST./runbooks
          - entities.Runbook.fields.validity_days
          - entities.Runbook.fields.revision
        distinguishing_aspect: "validity_days is optional with default 180, so a runbook created without it reads validity_days == 180, and revision starts at 1 for the group's first runbook."
        test_recipe:
          setup:
            - "The bootstrap through RG-1's membership exists and the group's version has been observed."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - *p11
            - *p12
            - *p13
            - *p14
            - *p15
            - *p16
            - *p17
          trigger:
            - call: "POST /runbooks"
              payload: { recovery_group_id: "${g1_id}", title: "Runbook without an explicit validity", author_id: "${c1_id}", expected_recovery_group_version: "${g1_v}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { rbd_id: $.data.id }
          assert:
            - "HTTP 201 and Runbook.${rbd_id}.validity_days == 180"
            - "Runbook.${rbd_id}.status == DRAFT, readiness_score == 0.00, validated_at == null, stale_reason == NONE"
            - "Runbook.${rbd_id}.revision == 1 — it is the first runbook on ${g1_id}"
            - "RecoveryGroup.${g1_id}.version was incremented by this write, and RecoveryGroup.${g1_id}.current_runbook_id is still null because the runbook is only DRAFT"

      - name: create_stakeholder_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - endpoints.POST./stakeholders
          - entities.Stakeholder.fields.status
        distinguishing_aspect: "id, created_at, updated_at and version are system-generated and status is computed with default ACTIVE, so client-supplied values for them are ignored: the returned id is not the submitted one and status is ACTIVE even when SUSPENDED is submitted."
        test_recipe:
          setup:
            - "The clock is set to 2026-08-01T00:00:00Z and no stakeholder exists."
          setup_api_calls:
            - *p01
          trigger:
            - call: "POST /stakeholders"
              payload: { full_name: "Ignored Fields", email: "ignored.fields@example.com", org_roles: ["IT_OPERATOR"], id: "11111111-1111-4111-8111-111111111111", created_at: "2020-01-01T00:00:00Z", version: 99, status: "SUSPENDED" }
              as: PlatformAdmin
              captures: { ig_id: $.data.id }
          assert:
            - "HTTP 201 and ${ig_id} != \"11111111-1111-4111-8111-111111111111\""
            - "Stakeholder.${ig_id}.created_at == 2026-08-01T00:00:00Z, the logical clock, not the submitted 2020-01-01T00:00:00Z"
            - "Stakeholder.${ig_id}.version == 1, not 99"
            - "Stakeholder.${ig_id}.status == ACTIVE, the computed default, not the submitted SUSPENDED"
            - "Stakeholder.${ig_id}.approval_authority_level == LEVEL_1, the declared default for an omitted optional input"

      - name: create_exercise_with_unknown_type_invalid_enum
        claim_type: type_constraints
        grounds:
          - endpoints.POST./exercises
          - entities.Exercise.fields.exercise_type
          - validations.priority_6
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "exercise_type is constrained to {TABLETOP, COMPONENT_FAILOVER, FULL_SITE_FAILOVER}; a value outside that set returns 400 ERR_INVALID_REQUEST, and so does criticality_weight 11 on POST /applications, which sits one past its 1..10 range."
        test_recipe:
          setup:
            - "The bootstrap through both sites exists."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
          trigger:
            - call: "POST /exercises"
              payload: { name: "Unknown type", exercise_type: "PARTIAL_FAILOVER", recovery_site_id: "${sr_id}", coordinator_id: "${c1_id}", planned_start_at: "2026-08-20T00:00:00Z", planned_end_at: "2026-08-20T06:00:00Z" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { enum_error: $.data.error_id }
            - call: "POST /applications"
              payload: { name: "Over-weighted application", app_code: "APP-OVER", business_owner_id: "${bo1_id}", primary_site_id: "${sp_id}", criticality_weight: 11 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { range_error: $.data.error_id }
          assert:
            - "the first call returns 400 with enum_error == ERR_INVALID_REQUEST and creates no Exercise"
            - "the second call returns 400 with range_error == ERR_INVALID_REQUEST because criticality_weight 11 exceeds the declared 1..10 range"
            - "GET /exercises returns total_count == 0 and GET /applications returns total_count == 0"

      - name: replication_observation_is_append_only_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.ReplicationObservation
          - endpoints.POST./assets/{id}/replication-observations
          - endpoints.GET./assets/{id}/replication-observations
        distinguishing_aspect: "ReplicationObservation declares common_fields false, so its rows carry no version and §1.5 exposes no PATCH for them; two observations on the same asset both persist and are both returned by the sub-resource GET in created_at order."
        test_recipe:
          setup:
            - "The bootstrap through AST-DB1's group assignment exists at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - *p11
            - *p12
            - *p13
            - *p14
            - *p15
          trigger:
            - call: "POST /assets/${d1_id}/replication-observations"
              payload: { observed_at: "2026-07-31T23:00:00Z", replication_lag_seconds: 120, unreplicated_txn_count: 300 }
              as: ITOperator
              as_user_id: "${op1_id}"
              captures: { obsA_id: $.data.id }
            - call: "POST /assets/${d1_id}/replication-observations"
              payload: { observed_at: "2026-08-01T00:00:00Z", replication_lag_seconds: 240, unreplicated_txn_count: 900 }
              as: ITOperator
              as_user_id: "${op1_id}"
              captures: { obsB_id: $.data.id }
            - call: "GET /assets/${d1_id}/replication-observations"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
          assert:
            - "both POSTs return 201 and ${obsA_id} != ${obsB_id} — the second measurement appends rather than overwriting the first"
            - "neither response body carries a version field"
            - "ReplicationObservation.${obsA_id}.recorded_by_user_id == ${op1_id}, stamped from X-User-ID rather than supplied"
            - "the sub-resource GET returns total_count == 2 with the rows in created_at ASC order [${obsA_id}, ${obsB_id}]"
            - "§1.5 declares no PATCH or DELETE for /assets/{id}/replication-observations, so the log has no mutation surface"

      - name: replication_observation_with_unknown_parent_asset_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ReplicationObservation.parent
          - validations.priority_4
          - errors.ERR_ASSET_NOT_FOUND
        distinguishing_aspect: "ReplicationObservation declares parent Asset and is only reachable under /assets/{id}, so an unknown parent id returns 404 ERR_ASSET_NOT_FOUND before any payload validation runs."
        test_recipe:
          setup:
            - "The clock and the five stakeholders exist; no asset has been created."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
          trigger:
            - call: "POST /assets/00000000-0000-4000-8000-0000000000aa/replication-observations"
              payload: { observed_at: "2026-08-01T00:00:00Z", replication_lag_seconds: 60, unreplicated_txn_count: 10 }
              as: ITOperator
              as_user_id: "${op1_id}"
              captures: { parent_error: $.data.error_id }
          assert:
            - "HTTP 404 with parent_error == ERR_ASSET_NOT_FOUND"
            - "no ReplicationObservation row is created"

      - name: dependency_graph_supports_polymorphic_nodes_and_rejects_hard_cycles
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.DependencyEdge.fields.from_node_kind
          - entities.DependencyEdge.fields.to_node_kind
          - validations.priority_28
          - errors.ERR_DEPENDENCY_CYCLE
        distinguishing_aspect: "The graph topology is exercised end to end: an APPLICATION -> ASSET edge and an ASSET -> ASSET edge coexist and are both resolved by *_node_kind, while a HARD edge that would close the cycle AST-NET1 -> APP-CORE is rejected with ERR_DEPENDENCY_CYCLE and the equivalent SOFT edge is accepted."
        test_recipe:
          setup:
            - "The bootstrap exists, plus AST-NET1 (INFRA_COMPONENT, SYNCHRONOUS, restore_minutes 12) assigned to RG-1."
            - "HARD edges APP-CORE -> AST-DB1 and AST-DB1 -> AST-NET1 already exist, so the HARD chain runs APP-CORE -> AST-DB1 -> AST-NET1."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - *p11
            - *p12
            - *p13
            - *p14
            - *p15
            - *p16
            - call: "POST /assets"
              payload: { name: "Core switch", asset_code: "AST-NET1", asset_kind: "INFRA_COMPONENT", site_id: "${sp_id}", replication_mode: "SYNCHRONOUS", restore_minutes: 12 }
              as: ITOperator
              as_user_id: "${op1_id}"
              captures: { i1_id: $.data.id }
            - call: "POST /assets/${i1_id}/group-assignments"
              payload: { recovery_group_id: "${g1_id}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /dependency-edges"
              payload: { from_node_kind: "ASSET", from_node_id: "${d1_id}", to_node_kind: "ASSET", to_node_id: "${i1_id}", edge_kind: "HARD" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { e_d1i1_id: $.data.id }
          trigger:
            - call: "POST /dependency-edges"
              payload: { from_node_kind: "ASSET", from_node_id: "${i1_id}", to_node_kind: "APPLICATION", to_node_id: "${a1_id}", edge_kind: "HARD" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { cycle_error: $.data.error_id }
            - call: "POST /dependency-edges"
              payload: { from_node_kind: "ASSET", from_node_id: "${i1_id}", to_node_kind: "APPLICATION", to_node_id: "${a1_id}", edge_kind: "SOFT" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { soft_edge_id: $.data.id }
          assert:
            - "the HARD closing edge returns 422 with cycle_error == ERR_DEPENDENCY_CYCLE and is not persisted"
            - "the identical SOFT edge is accepted with 201 as ${soft_edge_id} — SOFT edges are exempt from the cycle rule"
            - "RecoveryGroup.${g1_id}.projected_recovery_minutes == 92 == 60 + 20 + 12 along the HARD chain, unchanged by the SOFT edge"
            - "RecoveryGroup.${g1_id}.recovery_sequence == [${a1_id}, ${d1_id}, ${i1_id}]"
            - "GET /dependency-edges?from_node_id=${i1_id} returns total_count == 1, holding only ${soft_edge_id}"

