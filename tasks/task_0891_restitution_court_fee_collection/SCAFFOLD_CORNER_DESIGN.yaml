        grounds: [roles.CollectionsClerk, roles.CollectionsSupervisor]
        distinguishing_aspect: "A CollectionsClerk calling the Supervisor-exclusive waiver approve endpoint is rejected with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Case + COURT_FEE obligation; a REQUESTED waiver"]
          setup_api_calls:
