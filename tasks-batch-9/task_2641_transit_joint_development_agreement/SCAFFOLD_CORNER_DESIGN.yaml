  - section: validations
    instances:
      - name: corner_duplicate_site_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=50]
          - errors[ERR_DUPLICATE_SITE_CODE]
          - entities.AgencySite.fields.site_code
        distinguishing_aspect: |
          Re-using site_code TJD-C-026 on a second POST /jda/sites returns 409 ERR_DUPLICATE_SITE_CODE and
          leaves exactly one site with that code.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "One AgencySite already exists with site_code TJD-C-026"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-026", name: "Juniper Depot Parcel", address_line: "26 Juniper Dp", parcel_area_sqft: 61000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
          trigger:
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-026", name: "Juniper Depot Parcel Duplicate", address_line: "27 Juniper Dp", parcel_area_sqft: 40000, acquisition_funding_source: "LOCAL_ONLY", federal_interest_pct: 0, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_DUPLICATE_SITE_CODE"
            - "AgencySite.${site_a}.name == Juniper Depot Parcel"
            - "Exactly one AgencySite with site_code TJD-C-026 exists"

      - name: corner_local_only_site_with_nonzero_federal_interest_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.AgencySite.fields.federal_interest_pct
        distinguishing_aspect: |
          The federal_interest_pct == 0 rule fires only when acquisition_funding_source == LOCAL_ONLY: the
          LOCAL_ONLY body with 2.5 is refused 422 ERR_INVALID_REQUEST while the identical MIXED body with
          2.5 is accepted 201.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-028", name: "Juniper West Parcel", address_line: "28 Juniper W", parcel_area_sqft: 44000, acquisition_funding_source: "LOCAL_ONLY", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { err: $.data.error_id }
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-029", name: "Juniper North Parcel", address_line: "29 Juniper N", parcel_area_sqft: 44000, acquisition_funding_source: "MIXED", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_ok: $.data.id, pct_ok: $.data.federal_interest_pct }
          assert:
            - "First trigger call returns HTTP 422"
            - "${err} == ERR_INVALID_REQUEST"
            - "No AgencySite with site_code TJD-C-028 exists"
            - "Second trigger call returns HTTP 201"
            - "${pct_ok} == 2.5"
            - "AgencySite.${site_ok}.acquisition_funding_source == MIXED"

      - name: corner_joint_use_requirement_applies_only_when_flagged
        claim_type: conditional_validation
