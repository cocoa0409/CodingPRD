          setup:
            - "Full pipeline: line 10 x 10000c cube 5 (LTL freight 5 x 9000 = 45000c at seal); shipment IN_TRANSIT; event POSTED with 10 received / 2 damaged (actual_landed 100000 + 45000 = 145000c on the FURNITURE line); one DAMAGE claim qty 1 still OPEN"
