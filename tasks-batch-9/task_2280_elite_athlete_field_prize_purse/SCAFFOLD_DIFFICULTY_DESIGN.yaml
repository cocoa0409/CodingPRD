  # ===========================================================================
  # RULE 9 — compensating_invariant (2 instances, different conserved quantities)
  # ===========================================================================

  - rule_id: compensating_invariant
    instances:
      - name: compensating_appearance_budget_invariant_across_withdraw_and_reissue
        grounds:
          - calculations.purse_and_budget_ledger
          - state_machines.Invitation.ACCEPTED_to_WITHDRAWN
          - entities.RaceEdition.fields.appearance_committed_cents
          - entities.RaceEdition.fields.appearance_uncommitted_cents
          - calculations.bib_assignment_selector
        distinguishing_aspect: >-
          Conserved quantity: appearance cents (INV-1, appearance_committed_cents +
          appearance_uncommitted_cents == appearance_budget_cents at every observation), together with
          the bib pool as a conserved discrete resource. Withdrawing an ACCEPTED, bibbed invitation must
          reverse EVERY side effect of the acceptance — commitment, bib and fluid slot — with no drift,
          so a second athlete can subsequently take the identical bib 11. Falsifiable in one sentence: an
          implementation that zeroes committed cents without returning them to uncommitted breaks the
          sum, and one that never frees the bib gives the replacement athlete bib 12 or
          ERR_BIB_POOL_EXHAUSTED.
        test_recipe:
          setup: >-
            Edition with appearance_budget_cents = 10,000,000 and a single-bib ELITE MALE pool
            [11, 11]. Athlete A is offered a package worth exactly 2,000,000 guaranteed (1,702,000 fee +
            120,000 ECONOMY + 160,000 for 5 nights + 18,000 ground), accepts, takes bib 11 and reserves
            a fluid slot at station 15.0 positions 7..8. Athlete B is ACCEPTED but not yet bibbed.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload:
                name: "Budget Invariant Marathon"
                city: "Metro City"
                race_date: "2026-11-01"
                appearance_budget_cents: 10000000
                total_purse_cents: 3000000
                bonus_pool_cap_cents: 0
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 11 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Invariant Athletics", license_code: "AGT-IV-1" }
              as: ElitesDirector
              captures: { agt1_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "First Choice", country_code: USA, gender: MALE, birth_date: "1995-06-06", whereabouts_filed: true }
              as: ElitesDirector
              captures: { athA_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Standby Sub", country_code: USA, gender: MALE, birth_date: "1995-07-07", whereabouts_filed: true }
              as: ElitesDirector
              captures: { athB_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${athA_id}", race_name: "Qual IA", performance_date: "2026-03-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-I-A", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
              captures: { prA_id: "$.data.id" }
            - call: POST /performance-records/${prA_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
            - call: POST /performance-records
              payload: { athlete_id: "${athB_id}", race_name: "Qual IB", performance_date: "2026-03-02", performance_seconds: 7910, division: ELITE, sanctioning_ref: "SB-I-B", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
              captures: { prB_id: "$.data.id" }
            - call: POST /performance-records/${prB_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7910 }
              as: TechnicalOfficial
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${athA_id}", agent_id: "${agt1_id}", qualifying_performance_id: "${prA_id}", division: ELITE }
              as: ElitesDirector
              captures: { invA_id: "$.data.id" }
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${athB_id}", agent_id: "${agt1_id}", qualifying_performance_id: "${prB_id}", division: ELITE }
              as: ElitesDirector
              captures: { invB_id: "$.data.id" }
            - call: POST /invitations/${invA_id}/offer
              payload: { appearance_fee_cents: 1702000, air_class: ECONOMY, hotel_nights: 5, ground_transport: true }
              as: ElitesDirector
            - call: POST /invitations/${invB_id}/offer
              payload: { appearance_fee_cents: 1702000, air_class: ECONOMY, hotel_nights: 5, ground_transport: true }
              as: ElitesDirector
            - call: POST /invitations/${invA_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
            - call: POST /invitations/${invA_id}/assign-bib
              as: ElitesDirector
            - call: POST /fluid-station-slots
              payload: { invitation_id: "${invA_id}", station_km: 15.0, table_position: 7, bottle_count: 2 }
              as: ElitesDirector
              captures: { slotA_id: "$.data.id" }
            - call: GET /race-editions/${ed_id}
              as: ElitesDirector
          trigger:
            - call: POST /invitations/${invA_id}/withdraw
              payload: { reason: "signed with a competing race" }
              as: ElitesDirector
            - call: GET /race-editions/${ed_id}
              as: ElitesDirector
            - call: GET /invitations/${invA_id}
              as: ElitesDirector
            - call: GET /invitations/${invA_id}/fluid-station-slots
              as: ElitesDirector
            - call: POST /invitations/${invB_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
            - call: POST /invitations/${invB_id}/assign-bib
              as: ElitesDirector
            - call: GET /race-editions/${ed_id}
              as: ElitesDirector
          assert:
            - "setup GET /race-editions/${ed_id} returns appearance_committed_cents == 2000000 and appearance_uncommitted_cents == 8000000, summing to the 10000000 budget"
            - "trigger call 2 returns appearance_committed_cents == 0 and appearance_uncommitted_cents == 10000000 — the compensation returns the cents rather than merely zeroing them"
            - "trigger call 3 returns status == WITHDRAWN, guaranteed_commitment_cents == 0, full_exposure_cents == 0 and bib_number == null"
            - "trigger call 4 returns total_count == 1 with data[0].status == RELEASED"
            - "trigger call 6 returns 200 with bib_number == 11 — the exact bib freed by the withdrawal, proving the discrete pool did not leak"
            - "trigger call 7 returns appearance_committed_cents == 2000000 and appearance_uncommitted_cents == 8000000 — identical to the pre-withdrawal figures, so a full commit-decommit-recommit cycle left zero drift"

      - name: compensating_purse_ledger_invariant_across_disqualification_and_recompute
        grounds:
          - calculations.purse_and_budget_ledger
          - calculations.prize_award_generation
          - state_machines.PrizeAward.COMPUTED_to_VOID
