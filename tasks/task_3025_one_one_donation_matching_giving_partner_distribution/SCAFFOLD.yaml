      - "SalesOrderLine.status → RETURN_REQUESTED"
      - "increments SalesOrderLine.version by 1"

  - method: POST
    path: "/impact-program/sales-orders/{order_id}/lines/{line_id}/exempt"
    description: "Exempt a line from the return window while retaining its donation obligation"
    roles: [CustomerService]
    code: 200
    input: [request_reason]
    output: SalesOrderLine
    side_effects:
      - "SalesOrderLine.status → EXEMPTED and obligated_units retained"

  - method: GET
    path: "/impact-program/sales-orders/{order_id}/lines/{line_id}/return-requests"
    description: "Find the return requests opened against a line"
    roles: [CustomerService, ImpactAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ReturnRequest[]"
    side_effects: []

  - method: POST
    path: "/impact-program/return-requests"
    description: "Open a return request directly against a line id"
