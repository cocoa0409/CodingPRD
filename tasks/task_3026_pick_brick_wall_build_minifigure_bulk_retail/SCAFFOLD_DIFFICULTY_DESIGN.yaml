  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: wall_fill_boundaries_are_strictly_less_than
        grounds:
          - calculations.wall_bin_fill_pct
          - state_machines.WallBin.OPEN_to_LOW
          - state_machines.WallBin.LOW_to_EMPTY
        distinguishing_aspect: "The bin status ladder uses strict less-than: a 500 g bin on a 1000 g capacity reads exactly 50.0 and stays OPEN while 499 g reads 49.9 and drops to LOW, and 149 g reads 14.9 and drops further to EMPTY."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0012 with wall_bin_capacity_grams 1000, one element, and one bin whose declared mass will be walked down to each edge."
