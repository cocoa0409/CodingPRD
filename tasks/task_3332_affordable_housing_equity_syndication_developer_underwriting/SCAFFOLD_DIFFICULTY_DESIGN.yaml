  - rule_id: resource_temporal_overlap
    instances:

      - name: allocation_award_intervals_allow_adjacency_reject_overlap
        grounds:
          - state_machines.Allocation.transitions.AWARDED_to_RESERVED
          - state_machines.Allocation.transitions.COMMITTED_to_RESCINDED
          - errors[ERR_DUPLICATE_ALLOCATION_PERIOD]
          - entities.Allocation.fields.awarded_date
        distinguishing_aspect: "Half-open interval semantics on the Allocation resource: [awarded_date, placed_in_service_deadline) lets a successor award start exactly at the predecessor's deadline, while a successor starting one second earlier is rejected."
        test_recipe:
          setup:
            - "Project Riverside Commons is UNDERWRITING under fund ECP Housing Fund IV and the logical clock is 2026-09-02T00:00:00Z."
            - "Allocation A1 for agency Oregon Housing and Community Services covers [2026-08-15, 2028-12-31)."
          setup_api_calls:
            - *clock_0902
            - *dev_cedar
            - *inv_meridian
            - *fund_iv
            - *proj_riverside
            - call: "POST /projects/${proj_id}/allocations"
              payload: { action: "CREATE", state_agency: "Oregon Housing and Community Services", awarded_credit_dollars_cents: 912345678, commitment_fee_pct: 0.014, awarded_date: "2026-08-15T00:00:00Z", placed_in_service_deadline: "2028-12-31T00:00:00Z" }
              as: Underwriter
              captures: { alloc_a1: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/allocations"
              payload: { action: "CREATE", state_agency: "Oregon Housing and Community Services", awarded_credit_dollars_cents: 100000000, commitment_fee_pct: 0.014, awarded_date: "2028-12-30T23:59:59Z", placed_in_service_deadline: "2030-12-31T00:00:00Z" }
              as: Underwriter
              captures: { err_overlap: $.data.error_id }
            - call: "POST /projects/${proj_id}/allocations"
              payload: { action: "CREATE", state_agency: "Oregon Housing and Community Services", awarded_credit_dollars_cents: 100000000, commitment_fee_pct: 0.014, awarded_date: "2028-12-31T00:00:00Z", placed_in_service_deadline: "2030-12-31T00:00:00Z" }
              as: Underwriter
              captures: { alloc_a2: $.data.id }
          assert:
            - "the first create is rejected with error_id == ERR_DUPLICATE_ALLOCATION_PERIOD"
            - "the second create succeeds with status 201"
            - "Allocation.${alloc_a2}.status == AWARDED"
            - "Allocation.${alloc_a1}.status == AWARDED"
            - "Project.${proj_id}.committed_credit_dollars_cents == 0"

      - name: capital_call_buffers_require_thirty_days_after_the_previous_due_date
        grounds:
          - state_machines.CapitalCall.transitions.SCHEDULED_to_ISSUED
          - errors[ERR_CALL_BUFFER_TOO_SHORT]
