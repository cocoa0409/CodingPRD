              as: SystemAdmin
              as_user_id: "usr-admin-1"
          assert:
            - "all six calls -> HTTP 200 with response_type == \"object\""
            - "all six data payloads are equal field-for-field: id \"${sh_id}\", carrier_id \"${home_carrier_id}\", historic_precedence true, holding_status \"HELD\", planned_operations 5, attached_operations 0, credited_operations 0, utilization_pct 0.00, at_risk_of_loss false"
            - "no role receives a redacted, filtered or partial projection, and none receives 403 or 404"
            - "the PartnerCarrier read does not mutate the row: version stays 1"

      - name: the_officer_who_validated_a_schedule_cannot_be_the_person_who_transmits_it
        claim_type: segregation_of_duties
        grounds:
          - segregation_of_duties_rules.transmit_not_validator
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          Transmit compares the acting X-User-ID against ScheduleVersion.validated_by_user_id, not against
          the role. The rejected attempt carries the correct FilingAgent role and still gets 403, and it
          must leave filing_charge_accrued_cents at 0, the submission QUEUED and the version VALIDATED; a
          different FilingAgent user then transmits the identical request successfully. An implementation
          that only role-checks lets one person validate and file their own schedule.
        test_recipe:
          setup:
            - "Home carrier HX; MUC and TXL LEVEL_2_FACILITATED; Season W26 OPEN; aircraft D-AHXA (B738, min_turn 45)."
            - "ScheduleVersion W26-S1 with filing_charge_budget_cents 100000 and two MUC<->TXL legs on 2026-11-03, both assigned to D-AHXA, both STANDARD-window eligible."
            - "The version is validated by user usr-comp-1 acting as ComplianceOfficer, so validated_by_user_id == \"usr-comp-1\"."
            - "One QUEUED filing submission to OAG in the STANDARD change window: 2 changed legs -> base 8450, expedite 0, total 8450."
