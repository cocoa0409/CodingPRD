scaffold_corner_design:
  # =========================================================================
  # Section: entities — creation, retrieval, defaults, computed fields, FK
  # =========================================================================
  - section: entities
    instances:
      - name: carrier_create_success_with_defaults
        claim_type: creation
        grounds: [entities.Carrier, endpoints."POST /freight-claims/carriers"]
        distinguishing_aspect: "Carrier created with only required fields; defaults applied for carmack_acknowledgment_days=30, carmack_filing_days=270, claims_filed_count=0, claims_paid_count=0, claim_ratio_bp=0, status=ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "DFLT", legal_name: "Default Carrier", liability_model: "FULL_VALUE", max_auto_settle_cents: 10000 }
              as: ClaimsManager
              captures: { cid: $.data.id }
          trigger:
            - call: "GET /freight-claims/carriers/${cid}"
              payload: {}
              as: Any
              captures: { c: $.data }
          assert:
            - "c.carmack_acknowledgment_days == 30"
            - "c.carmack_filing_days == 270"
            - "c.claims_filed_count == 0"
            - "c.claim_ratio_bp == 0"
            - "c.status == ACTIVE"
            - "c.version == 1"

      - name: carrier_create_duplicate_scac_rejected
        claim_type: uniqueness
        grounds: [entities.Carrier.fields.scac_code, "errors[ERR_DUPLICATE_KEY]"]
        distinguishing_aspect: "Second POST with identical scac_code returns ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["one carrier with scac_code=DUP1"]
          setup_api_calls:
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "DUP1", legal_name: "First", liability_model: "FULL_VALUE", max_auto_settle_cents: 10000 }
              as: ClaimsManager
          trigger:
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "DUP1", legal_name: "Second", liability_model: "PER_POUND", per_pound_cap_cents: 100, max_auto_settle_cents: 5000 }
              as: ClaimsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_KEY"

      - name: shipment_create_delivery_before_ship_rejected
        claim_type: type_constraints
        grounds: [entities.Shipment, "errors[ERR_INVALID_TEMPORAL_RANGE]"]
        distinguishing_aspect: "delivery_date < ship_date rejected."
        test_recipe:
          setup: ["carrier+lane+assignment exist"]
          setup_api_calls:
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "TMPR", legal_name: "Temp Carrier", liability_model: "FULL_VALUE", max_auto_settle_cents: 10000 }
              as: ClaimsManager
              captures: { c: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "100", destination_zip3: "200", baseline_claim_ratio_bp: 100 }
              as: ClaimsManager
              captures: { l: $.data.id }
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${c}", lane_id: "${l}", contracted_discount_pct: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
          trigger:
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-BAD", carrier_id: "${c}", lane_id: "${l}", ship_date: "2026-06-10T00:00:00Z", delivery_date: "2026-06-05T00:00:00Z", declared_value_cents: 1000, total_weight_lbs: 5, package_count: 1, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_TEMPORAL_RANGE"

      - name: claim_create_computed_fields_initialized
        claim_type: computed_fields
        grounds: [entities.Claim.fields.filing_status, entities.Claim.fields.payment_status]
        distinguishing_aspect: "New claim: filing_status=DRAFT, payment_status=UNPAID, salvage_credit_cents=0, computed_liability_cents=0, net_exposure_cents=0, reserve_amount_cents=0, appeal_round=0."
        test_recipe:
          setup: ["shipment in DELIVERED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "CMPT", legal_name: "Comp Carrier", liability_model: "FULL_VALUE", max_auto_settle_cents: 10000 }
              as: ClaimsManager
              captures: { c: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "300", destination_zip3: "400", baseline_claim_ratio_bp: 100 }
              as: ClaimsManager
              captures: { l: $.data.id }
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${c}", lane_id: "${l}", contracted_discount_pct: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-CMP", carrier_id: "${c}", lane_id: "${l}", ship_date: "2026-06-01T00:00:00Z", delivery_date: "2026-06-05T00:00:00Z", declared_value_cents: 1000, total_weight_lbs: 5, package_count: 1, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { s: $.data.id }
          trigger:
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${s}", claim_type: "LOSS", claimed_amount_cents: 500 }
              as: ClaimsClerk
              captures: { cl: $.data }
          assert:
            - "cl.filing_status == DRAFT"
            - "cl.payment_status == UNPAID"
            - "cl.salvage_credit_cents == 0"
            - "cl.computed_liability_cents == 0"
            - "cl.net_exposure_cents == 0"
            - "cl.reserve_amount_cents == 0"
            - "cl.appeal_round == 0"

      - name: claim_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_CLAIM_NOT_FOUND]"]
        distinguishing_aspect: "GET /claims/{random-uuid} returns 404 ERR_CLAIM_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "X", legal_name: "x", liability_model: "FULL_VALUE", max_auto_settle_cents: 1 }
              as: ClaimsManager
          trigger:
            - call: "GET /freight-claims/claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CLAIM_NOT_FOUND"

      - name: carrier_lane_assignment_reverse_reachable_via_filtered_list
        claim_type: fk_reverse_reachability
        grounds: [entities.CarrierLaneAssignment.fields.carrier_id, endpoints."GET /freight-claims/carrier-lane-assignments"]
        distinguishing_aspect: "Filtered list returns all assignments for a given carrier_id."
        test_recipe:
          setup: ["two assignments for carrier C"]
          setup_api_calls:
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "FKRR", legal_name: "FK Carrier", liability_model: "FULL_VALUE", max_auto_settle_cents: 10000 }
              as: ClaimsManager
              captures: { c: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "101", destination_zip3: "202", baseline_claim_ratio_bp: 100 }
              as: ClaimsManager
              captures: { l1: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "303", destination_zip3: "404", baseline_claim_ratio_bp: 200 }
              as: ClaimsManager
              captures: { l2: $.data.id }
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${c}", lane_id: "${l1}", contracted_discount_pct: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${c}", lane_id: "${l2}", contracted_discount_pct: 5, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
          trigger:
            - call: "GET /freight-claims/carrier-lane-assignments?carrier_id=${c}"
              payload: {}
              as: Any
              captures: { total: $.meta.total_count }
          assert:
            - "total == 2"

  # =========================================================================
  # Section: state_machines — valid/invalid transitions, side effects
  # =========================================================================
  - section: state_machines
    instances:
      - name: claim_submit_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Claim, "errors[ERR_CLAIM_INVALID_STATE]"]
        distinguishing_aspect: "Second submit on already-SUBMITTED claim rejected."
        test_recipe:
          setup: ["claim SUBMITTED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "TRNJ", legal_name: "Trj Carrier", liability_model: "FULL_VALUE", max_auto_settle_cents: 10000 }
              as: ClaimsManager
              captures: { c: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "100", destination_zip3: "200", baseline_claim_ratio_bp: 100 }
              as: ClaimsManager
              captures: { l: $.data.id }
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${c}", lane_id: "${l}", contracted_discount_pct: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-TRJ", carrier_id: "${c}", lane_id: "${l}", ship_date: "2026-06-01T00:00:00Z", delivery_date: "2026-06-05T00:00:00Z", declared_value_cents: 1000, total_weight_lbs: 5, package_count: 1, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { s: $.data.id }
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${s}", claim_type: "LOSS", claimed_amount_cents: 500 }
              as: ClaimsClerk
              captures: { cl: $.data.id }
            - call: "POST /freight-claims/claims/${cl}/documents"
              payload: { document_kind: "BOL", storage_uri: "s3://x/b.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
            - call: "POST /freight-claims/claims/${cl}/documents"
              payload: { document_kind: "COMMERCIAL_INVOICE", storage_uri: "s3://x/i.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/claims/${cl}/submit"
              payload: {}
              as: ClaimsClerk
          trigger:
            - call: "POST /freight-claims/claims/${cl}/submit"
              payload: {}
              as: ClaimsClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CLAIM_INVALID_STATE"

      - name: document_verify_from_rejected_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ClaimDocument, "errors[ERR_DOCUMENT_INVALID_STATE]"]
        distinguishing_aspect: "Verify a REJECTED document fails (terminal state lockdown)."
        test_recipe:
          setup: ["document REJECTED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "DOCV", legal_name: "DocV Carrier", liability_model: "FULL_VALUE", max_auto_settle_cents: 10000 }
              as: ClaimsManager
              captures: { c: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "100", destination_zip3: "200", baseline_claim_ratio_bp: 100 }
              as: ClaimsManager
              captures: { l: $.data.id }
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${c}", lane_id: "${l}", contracted_discount_pct: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-DCV", carrier_id: "${c}", lane_id: "${l}", ship_date: "2026-06-01T00:00:00Z", delivery_date: "2026-06-05T00:00:00Z", declared_value_cents: 1000, total_weight_lbs: 5, package_count: 1, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { s: $.data.id }
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${s}", claim_type: "LOSS", claimed_amount_cents: 500 }
              as: ClaimsClerk
              captures: { cl: $.data.id }
            - call: "POST /freight-claims/claims/${cl}/documents"
              payload: { document_kind: "PHOTO", storage_uri: "s3://x/p.jpg", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
              captures: { doc: $.data.id }
            - call: "POST /freight-claims/claims/${cl}/documents/${doc}/reject"
              payload: { rejection_reason: "illegible" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /freight-claims/claims/${cl}/documents/${doc}/verify"
              payload: {}
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DOCUMENT_INVALID_STATE"

      - name: claim_terminal_state_lockdown_paid
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Claim]
        distinguishing_aspect: "From PAID, no further transitions (decline, withdraw, etc.) are permitted."
        test_recipe:
          setup: ["claim PAID via full settlement"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "TERM", legal_name: "Term Carrier", liability_model: "FULL_VALUE", max_auto_settle_cents: 100000 }
              as: ClaimsManager
              captures: { c: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "100", destination_zip3: "200", baseline_claim_ratio_bp: 100 }
              as: ClaimsManager
              captures: { l: $.data.id }
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${c}", lane_id: "${l}", contracted_discount_pct: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-TRM", carrier_id: "${c}", lane_id: "${l}", ship_date: "2026-06-01T00:00:00Z", delivery_date: "2026-06-05T00:00:00Z", declared_value_cents: 50000, total_weight_lbs: 50, package_count: 5, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { s: $.data.id }
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${s}", claim_type: "DAMAGE", claimed_amount_cents: 40000 }
              as: ClaimsClerk
              captures: { cl: $.data.id }
            - call: "POST /freight-claims/claims/${cl}/documents"
              payload: { document_kind: "BOL", storage_uri: "s3://x/b.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
              captures: { bol: $.data.id }
            - call: "POST /freight-claims/claims/${cl}/documents"
              payload: { document_kind: "COMMERCIAL_INVOICE", storage_uri: "s3://x/i.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
              captures: { inv: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/claims/${cl}/submit"
              payload: {}
              as: ClaimsClerk
            - call: "POST /freight-claims/claims/${cl}/acknowledge"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${cl}/documents/${bol}/verify"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${cl}/documents/${inv}/verify"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${cl}/assessments"
              payload: { negligence_flag: "CARRIER_NEGLIGENT" }
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${cl}/reserves"
              payload: { amount_cents: 40000 }
              as: FinanceController
            - call: "GET /freight-claims/claims/${cl}"
              payload: {}
              as: Any
              captures: { cv1: $.data.version }
            - call: "POST /freight-claims/claims/${cl}/settlements"
              payload: { amount_cents: 40000, expected_claim_version: "${cv1}" }
              as: ClaimsAdjuster
              captures: { st: $.data.id }
            - call: "POST /freight-claims/claims/${cl}/settlements/${st}/accept"
              payload: {}
              as: ClaimsManager
          trigger:
            - call: "POST /freight-claims/claims/${cl}/withdraw"
              payload: {}
              as: ClaimsClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CLAIM_INVALID_STATE"

      - name: claim_submit_side_effects_full_chain
        claim_type: side_effect_execution
        grounds: [state_machines.Claim.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Submit fires ALL declared side effects: filing_received_at stamped, deadlines computed, carrier counter+1, lane counter+1, shipment status flips to CLAIMED, ClaimEvent FILED appended, version incremented."
        test_recipe:
          setup: ["claim in DRAFT"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "FXCH", legal_name: "Fx Carrier", liability_model: "FULL_VALUE", max_auto_settle_cents: 10000, carmack_acknowledgment_days: 30, carmack_filing_days: 270 }
              as: ClaimsManager
              captures: { c: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "100", destination_zip3: "200", baseline_claim_ratio_bp: 100 }
              as: ClaimsManager
              captures: { l: $.data.id }
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${c}", lane_id: "${l}", contracted_discount_pct: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-FX", carrier_id: "${c}", lane_id: "${l}", ship_date: "2026-06-01T00:00:00Z", delivery_date: "2026-06-05T00:00:00Z", declared_value_cents: 10000, total_weight_lbs: 10, package_count: 1, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { s: $.data.id }
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${s}", claim_type: "LOSS", claimed_amount_cents: 5000 }
              as: ClaimsClerk
              captures: { cl: $.data.id, cl_v0: $.data.version }
            - call: "POST /freight-claims/claims/${cl}/documents"
              payload: { document_kind: "BOL", storage_uri: "s3://x/b.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
            - call: "POST /freight-claims/claims/${cl}/documents"
              payload: { document_kind: "COMMERCIAL_INVOICE", storage_uri: "s3://x/i.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /freight-claims/claims/${cl}/submit"
              payload: {}
              as: ClaimsClerk
              captures: { cl_after: $.data }
            - call: "GET /freight-claims/shipments/${s}"
              payload: {}
              as: Any
              captures: { s_after: $.data }
            - call: "GET /freight-claims/carriers/${c}"
              payload: {}
              as: Any
              captures: { c_after: $.data }
            - call: "GET /freight-claims/lanes/${l}"
              payload: {}
              as: Any
              captures: { l_after: $.data }
          assert:
            - "cl_after.filing_status == SUBMITTED"
            - "cl_after.filing_received_at == 2026-06-10T12:00:00Z"
            - "cl_after.filing_deadline_at == 2026-06-01T00:00:00Z + 270 days = 2027-02-26T00:00:00Z"
            - "cl_after.acknowledgment_due_at == 2026-07-10T12:00:00Z"
            - "s_after.status == CLAIMED"
            - "c_after.claims_filed_count == 1"
            - "l_after.claims_count == 1"

  # =========================================================================
  # Section: calculations — formula correctness, filtering, precision
  # =========================================================================
  - section: calculations
    instances:
      - name: limitation_per_package_cap_applies
        claim_type: correct_result
        grounds: [calculations.limitation_of_liability]
        distinguishing_aspect: "PER_PACKAGE liability model: carrier_limit = min(basis, package_count * per_package_cap_cents)."
        test_recipe:
          setup: ["carrier PER_PACKAGE cap 10000/pkg; shipment 5 pkgs; claim 80000 vs declared 100000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "PRPK", legal_name: "PerPkg Carrier", liability_model: "PER_PACKAGE", per_package_cap_cents: 10000, max_auto_settle_cents: 100000 }
              as: ClaimsManager
              captures: { c: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "100", destination_zip3: "200", baseline_claim_ratio_bp: 100 }
              as: ClaimsManager
              captures: { l: $.data.id }
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${c}", lane_id: "${l}", contracted_discount_pct: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-PP", carrier_id: "${c}", lane_id: "${l}", ship_date: "2026-06-01T00:00:00Z", delivery_date: "2026-06-05T00:00:00Z", declared_value_cents: 100000, total_weight_lbs: 50, package_count: 5, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { s: $.data.id }
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${s}", claim_type: "DAMAGE", claimed_amount_cents: 80000 }
              as: ClaimsClerk
              captures: { cl: $.data.id }
            - call: "POST /freight-claims/claims/${cl}/documents"
              payload: { document_kind: "BOL", storage_uri: "s3://x/b.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
              captures: { bol: $.data.id }
            - call: "POST /freight-claims/claims/${cl}/documents"
