              captures: { auth_c_status: $.data.status }
          assert:
            - "Auth B (start 2027-01-28 == A's inclusive validity_end): error_id == ERR_AUTH_WINDOW_OVERLAP (409)"
            - "Auth C (start 2027-01-29, one day past): APPROVED, validity [2027-01-29, 2027-07-28]"

      - name: biosimilar_window_overlap_half_open
        grounds:
          - state_machines.BiosimilarPolicy.DRAFT_to_ACTIVE
          - validations[priority=8]
          - errors[ERR_POLICY_WINDOW_OVERLAP]
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the BiosimilarPolicy resource (different
          resource and different semantics than auth windows): a successor policy
          starting exactly at the predecessor's effective_end is ACCEPTED, while a
          start one day earlier overlaps and is rejected.
        test_recipe:
          setup:
            - "Reference drug REF plus three biosimilar drugs BIO1/BIO2/BIO3 (distinct biosimilar ids avoid ERR_BIOSIMILAR_ALREADY_MAPPED)"
            - "Policy P1 on BIO1, window [2026-08-01, 2026-12-01), ACTIVATED at default clock (2026-08-01 < end, not expired)"
          setup_api_calls:
            - call: "POST /api/drugs"
              payload: { j_code: "J3500", drug_name: "RefDrug", billing_unit_mg: 10, vial_size_mg: 100, single_dose_vial: true, sourcing_rule: "EITHER", dose_rounding_mode: "VIAL", max_single_dose_mg: 2000, site_of_care_eligible: false }
              as: PlanAdmin
              captures: { ref_id: $.data.id }
            - call: "POST /api/drugs"
              payload: { j_code: "J3501", drug_name: "BioOne", billing_unit_mg: 10, vial_size_mg: 100, single_dose_vial: true, sourcing_rule: "EITHER", dose_rounding_mode: "VIAL", max_single_dose_mg: 2000, site_of_care_eligible: false }
              as: PlanAdmin
              captures: { bio1_id: $.data.id }
            - call: "POST /api/drugs"
              payload: { j_code: "J3502", drug_name: "BioTwo", billing_unit_mg: 10, vial_size_mg: 100, single_dose_vial: true, sourcing_rule: "EITHER", dose_rounding_mode: "VIAL", max_single_dose_mg: 2000, site_of_care_eligible: false }
              as: PlanAdmin
              captures: { bio2_id: $.data.id }
            - call: "POST /api/drugs"
              payload: { j_code: "J3503", drug_name: "BioThree", billing_unit_mg: 10, vial_size_mg: 100, single_dose_vial: true, sourcing_rule: "EITHER", dose_rounding_mode: "VIAL", max_single_dose_mg: 2000, site_of_care_eligible: false }
              as: PlanAdmin
              captures: { bio3_id: $.data.id }
            - call: "POST /api/biosimilar-policies"
              payload: { reference_drug_id: "${ref_id}", biosimilar_drug_id: "${bio1_id}", provider_incentive_addon_pct: 0.02, member_copay_waiver_pct: 0.5, effective_start: "2026-08-01", effective_end: "2026-12-01" }
              as: PlanAdmin
              captures: { pol1_id: $.data.id }
            - call: "POST /api/biosimilar-policies/${pol1_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /api/biosimilar-policies"
              payload: { reference_drug_id: "${ref_id}", biosimilar_drug_id: "${bio2_id}", provider_incentive_addon_pct: 0.02, member_copay_waiver_pct: 0.5, effective_start: "2026-12-01", effective_end: "2027-03-01" }
              as: PlanAdmin
              captures: { pol2_id: $.data.id }
            - call: "POST /api/biosimilar-policies"
              payload: { reference_drug_id: "${ref_id}", biosimilar_drug_id: "${bio3_id}", provider_incentive_addon_pct: 0.02, member_copay_waiver_pct: 0.5, effective_start: "2026-11-30", effective_end: "2027-02-01" }
              as: PlanAdmin
              captures: { pol3_id: $.data.id }
          trigger:
            - call: "POST /api/biosimilar-policies/${pol2_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { pol2_status: $.data.status }
            - call: "POST /api/biosimilar-policies/${pol3_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "P2 [2026-12-01, 2027-03-01) touching P1's exclusive end: activates, status == ACTIVE (half-open adjacency is NOT overlap)"
            - "P3 [2026-11-30, ...) overlapping P1 by one day: error_id == ERR_POLICY_WINDOW_OVERLAP (409)"

  - rule_id: compensating_invariant
    instances:
      - name: provider_ledger_adjust_restore_invariant
        grounds:
          - calculations.asp_retro_repricing
          - state_machines.InfusionClaim.PAID_to_ADJUSTED
          - entities.ProviderAccount.fields.cumulative_paid_cents
        distinguishing_aspect: |
          Conserved quantity = provider ledger cents: a retro rate correction
          (500 -> 600) followed by its compensating correction (600 -> 500) leaves
          cumulative_paid_cents exactly at the original value and the two
          ClaimAdjustments net to zero; only the RECOUPMENT_HOLD posture (raised by
          the negative delta) persists until settled.
        test_recipe:
          setup:
            - "Drug (rate 500 from 2026-01-01, unit 10, vial 100, VIAL, sourcing EITHER, max 2000), ACTIVE policy C50, provider"
            - "Auth approved 100 mg (max_administrations 4); claim 2 units on 2026-07-15 approved (1060) and PAID; cumulative_paid_cents == 1060"
          setup_api_calls:
            - call: "POST /api/drugs"
              payload: { j_code: "J3600", drug_name: "InvariantDrug", billing_unit_mg: 10, vial_size_mg: 100, single_dose_vial: true, sourcing_rule: "EITHER", dose_rounding_mode: "VIAL", max_single_dose_mg: 2000, site_of_care_eligible: false }
              as: PlanAdmin
              captures: { drug_id: $.data.id, drug_ver: $.data.version }
            - call: "POST /api/asp-schedules"
              payload: { drug_id: "${drug_id}", effective_start: "2026-01-01", asp_rate_cents: 500 }
              as: PlanAdmin
              captures: { sched_1: $.data.id }
            - call: "POST /api/clinical-policies"
              payload: { drug_id: "${drug_id}", status: "ACTIVE", expected_drug_version: "${drug_ver}", covered_diagnoses: ["C50"], step_therapy_required: false, requires_site_of_care_redirection: false, biosimilar_substitution: "DISABLED" }
              as: MedicalPolicyOfficer
            - call: "POST /api/provider-accounts"
              payload: { name: "Invariant Provider" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /api/prior-authorizations"
              payload: { drug_id: "${drug_id}", member_id: "MEM-16", diagnosis_code: "C50", requested_start_date: "2026-07-01", requested_dose_mg: 100 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /api/prior-authorizations/${auth_id}/approve"
              payload: { max_administrations: 4 }
              as: MedicalPolicyOfficer
            - call: "POST /api/claims"
              payload: { auth_id: "${auth_id}", drug_id: "${drug_id}", service_date: "2026-07-15", site_of_care: "HOPD", sourcing_path: "BUY_AND_BILL", j_code_billed: "J3600", billed_units: 2 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/pay"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /api/asp-schedules"
              payload: { drug_id: "${drug_id}", effective_start: "2026-01-01", asp_rate_cents: 600 }
              as: PlanAdmin
              captures: { sched_2: $.data.id }
            - call: "POST /api/asp-schedules"
              payload: { drug_id: "${drug_id}", effective_start: "2026-01-01", asp_rate_cents: 500 }
              as: PlanAdmin
              captures: { sched_3: $.data.id }
            - call: "GET /api/claim-adjustments"
              as: PlanAdmin
            - call: "GET /api/provider-accounts/${prov_id}"
              as: PlanAdmin
              captures: { prov_after: $.data.cumulative_paid_cents }
          assert:
            - "After the adjust + counter-adjust pair: ProviderAccount.${prov_id}.cumulative_paid_cents == 1060 (== original, exactly conserved)"
            - "InfusionClaim.${claim_id}.allowed_amount_cents == 1060 and status == ADJUSTED"
            - "Two ClaimAdjustments exist for ${claim_id}: deltas +212 (schedule ${sched_2}) and -212 (schedule ${sched_3}); SUM(delta_cents) == 0"
            - "ProviderAccount.${prov_id}.recoupment_balance_cents == 212 and status == RECOUPMENT_HOLD until settle-recoupment (posture is NOT part of the conserved quantity)"
            - "Invariant: cumulative_paid_cents == SUM(allowed_amount_cents over PAID/ADJUSTED claims of ${prov_id}) == 1060"

      - name: suspend_reinstate_conserves_utilization
        grounds:
          - state_machines.PriorAuthorization.APPROVED_to_SUSPENDED
          - state_machines.PriorAuthorization.SUSPENDED_to_APPROVED
          - entities.PriorAuthorization.fields.administrations_used
        distinguishing_aspect: |
          Conserved quantity = authorization utilization counts (different quantity
          than ledger cents): a suspend + reinstate pair leaves
          administrations_used and the count of APPROVED_FOR_PAYMENT claims for the
          auth exactly unchanged — no debit drift across the cycle.
        test_recipe:
          setup:
            - "Drug (rate 500, unit 10, vial 100, VIAL, sourcing EITHER, max 2000), ASP from 2026-01-01, ACTIVE policy C50, provider"
            - "Auth approved 100 mg (max_administrations 4); claim C1 approved (debit -> administrations_used == 1)"
          setup_api_calls:
            - call: "POST /api/drugs"
              payload: { j_code: "J3700", drug_name: "UtilDrug", billing_unit_mg: 10, vial_size_mg: 100, single_dose_vial: true, sourcing_rule: "EITHER", dose_rounding_mode: "VIAL", max_single_dose_mg: 2000, site_of_care_eligible: false }
              as: PlanAdmin
              captures: { drug_id: $.data.id, drug_ver: $.data.version }
            - call: "POST /api/asp-schedules"
              payload: { drug_id: "${drug_id}", effective_start: "2026-01-01", asp_rate_cents: 500 }
              as: PlanAdmin
            - call: "POST /api/clinical-policies"
              payload: { drug_id: "${drug_id}", status: "ACTIVE", expected_drug_version: "${drug_ver}", covered_diagnoses: ["C50"], step_therapy_required: false, requires_site_of_care_redirection: false, biosimilar_substitution: "DISABLED" }
              as: MedicalPolicyOfficer
            - call: "POST /api/provider-accounts"
              payload: { name: "Util Provider" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /api/prior-authorizations"
              payload: { drug_id: "${drug_id}", member_id: "MEM-17", diagnosis_code: "C50", requested_start_date: "2026-08-01", requested_dose_mg: 100 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /api/prior-authorizations/${auth_id}/approve"
              payload: { max_administrations: 4 }
              as: MedicalPolicyOfficer
            - call: "POST /api/claims"
              payload: { auth_id: "${auth_id}", drug_id: "${drug_id}", service_date: "2026-08-01", site_of_care: "OFFICE", sourcing_path: "BUY_AND_BILL", j_code_billed: "J3700", billed_units: 10 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /api/prior-authorizations/${auth_id}/suspend"
              payload: {}
              as: MedicalPolicyOfficer
            - call: "POST /api/prior-authorizations/${auth_id}/reinstate"
              payload: {}
              as: MedicalPolicyOfficer
            - call: "GET /api/prior-authorizations/${auth_id}"
              as: PlanAdmin
              captures: { used_after: $.data.administrations_used }
            - call: "GET /api/claims/${c1}"
              as: PlanAdmin
              captures: { c1_status: $.data.status }
          assert:
            - "PriorAuthorization.${auth_id}.administrations_used == 1 after the suspend+reinstate pair (unchanged — no double debit, no release)"
            - "Count of claims with auth_id == ${auth_id} and status == APPROVED_FOR_PAYMENT: 1 before suspend, 0 during, 1 after reinstate"
            - "InfusionClaim.${c1}.status == APPROVED_FOR_PAYMENT and pend_reason is null after reinstate"
            - "PriorAuthorization.${auth_id}.status == APPROVED"
