            - call: "POST /cdfi/institutions/${inst_id}/ta-engagements"
              payload: { borrower_id: "${b1_id}", topic: "CREDIT_BUILDING", scheduled_start_at: "2026-09-02T09:00:00Z", scheduled_end_at: "2026-09-02T09:00:00Z", planned_hours: 1.00 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
