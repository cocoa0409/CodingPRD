        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors.ERR_INVALID_STATE
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Category pair state vs business_fiscal: filing a ModAppeal whose
          reason is missing (would be ERR_INVALID_REQUEST at priority 8)
          against a sheet already in REVISED status (fails the PROMULGATED
          precondition at priority 4) must yield 409 ERR_INVALID_STATE, because
          the state check outranks the fiscal/request check.
