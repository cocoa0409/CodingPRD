          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-R-8001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { light: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-R-8002", zone: 2, residential_declared: false, declared_length_in: 20, declared_width_in: 20, declared_height_in: 20, declared_weight_lbs: 40.0 }
              as: CarrierOps
              captures: { heavy: $.data.id }
            - call: "POST /shipments/${light}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /shipments/${heavy}/deliver"
              payload: {}
              as: CarrierOps
          trigger:
            - call: "GET /shipments/${light}/billing-preview"
              payload: {}
              as: BillingOps
              captures: { light_total: $.data.line_total_cents }
            - call: "GET /shipments/${heavy}/billing-preview"
              payload: {}
              as: BillingOps
              captures: { err_preview: $.data.error_id }
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { err_sweep: $.data.error_id }
            - call: "GET /invoices"
              payload: { shipper_id: "${sh}" }
