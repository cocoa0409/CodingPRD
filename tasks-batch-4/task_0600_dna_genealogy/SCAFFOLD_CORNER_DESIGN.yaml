              payload: { email: "own1@dna.test", display_name: "Own1" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${c1}", tier: "PLUS" }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /dna/kits"
              payload: { customer_id: "${c1}", chip_version: "V5" }
              as: Customer
              as_user_id: "${c1}"
              captures: { k1: $.data.id, bc1: $.data.barcode }
            - call: "POST /dna/customers"
              payload: { email: "own2@dna.test", display_name: "Own2" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${c2}", tier: "PLUS" }
              as: Customer
              as_user_id: "${c2}"
          trigger:
            - call: "POST /dna/kits/${k1}/activate"
              payload: { barcode: "${bc1}" }
              as: Customer
              as_user_id: "${c2}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == ERR_NOT_RESOURCE_OWNER"
            - "Kit.${k1}.status == ORDERED"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Role denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401) before any existence or state check — even for a non-existent customer id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /dna/customers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: "(no X-User-Role / X-User-ID headers sent)"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "${err} == ERR_UNAUTHENTICATED"

  # =========================================================================
  - section: cross_cutting
    instances:
      - name: stale_expected_customer_version_on_report_returns_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[report-generate-stale-customer]", "errors[ERR_STALE_VERSION]", "validations[priority=7]"]
        distinguishing_aspect: "After a successful ETHNICITY report generation bumps Customer.version, a second (strictly sequential) generate call still carrying the pre-bump version is rejected with ERR_STALE_VERSION (412), and the first report stays PUBLISHED."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z. Customer is DNA_READY on a PLUS subscription; the client has read Customer.version once."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "occ@dna.test", display_name: "Occ" }
              as: PlatformAdmin
              captures: { c: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${c}", tier: "PLUS" }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /dna/kits"
              payload: { customer_id: "${c}", chip_version: "V5" }
              as: Customer
              as_user_id: "${c}"
              captures: { k: $.data.id, bc: $.data.barcode }
            - call: "POST /dna/kits/${k}/activate"
              payload: { barcode: "${bc}" }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /dna/kits/${k}/receive"
              payload: {}
              as: LabTechnician
              captures: { s: $.data.id }
            - call: "POST /dna/samples/${s}/extract"
              payload: { dna_yield_ng: 500.0 }
              as: LabTechnician
            - call: "POST /dna/lab-instruments"
              payload: { name: "SEQ-OCC", chip_version: "V5", status: "ONLINE" }
              as: PlatformAdmin
              captures: { i: $.data.id }
            - call: "POST /dna/lab-batches"
              payload: { instrument_id: "${i}", run_start_at: "2026-05-01T02:00:00Z", run_end_at: "2026-05-01T06:00:00Z", sample_ids: ["${s}"] }
              as: LabTechnician
              captures: { b: $.data.id }
            - call: "POST /dna/lab-batches/${b}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /dna/lab-batches/${b}/finalize"
              payload: { sample_results: [ { sample_id: "${s}", call_rate: 0.99, population_scores: [ { population: "EUR", raw_score: 100 } ], genotype_markers: [1, 2] } ] }
              as: LabTechnician
            - call: "GET /dna/customers/${c}"
              payload: {}
              as: Customer
              as_user_id: "${c}"
              captures: { v: $.data.version }
          trigger:
            - call: "POST /dna/customers/${c}/reports"
              payload: { report_type: "ETHNICITY", variant: "PROVISIONAL", expected_customer_version: "${v}" }
              as: Customer
              as_user_id: "${c}"
              captures: { r1: $.data.id }
            - call: "POST /dna/customers/${c}/reports"
              payload: { report_type: "ETHNICITY", variant: "PROVISIONAL", expected_customer_version: "${v}" }
              as: Customer
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "The first call returns 201"
            - "The second call returns HTTP 412 and ${err} == ERR_STALE_VERSION"
            - "Report.${r1}.status == PUBLISHED"
            - "GET /dna/reports?customer_id=${c} returns exactly 1 report"

      - name: stale_expected_subscription_version_on_change_tier_returns_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[tier-change-stale-subscription]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second change-tier carrying the version observed before the first change (i.e. ${sv} while the subscription now holds ${sv} + 1) is rejected with ERR_STALE_VERSION (412); tier stays PRO and last_change_charge_cents is not overwritten."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z. Customer on PLUS with wallet_credit_cents = 20000; the client has read Subscription.version once."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "occ2@dna.test", display_name: "Occ2" }
              as: PlatformAdmin
              captures: { c: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${c}", tier: "PLUS" }
              as: Customer
              as_user_id: "${c}"
              captures: { sub: $.data.id }
            - call: "POST /dna/customers/${c}/credits"
              payload: { amount_cents: 20000 }
              as: PlatformAdmin
            - call: "GET /dna/subscriptions/${sub}"
              payload: {}
              as: Customer
              as_user_id: "${c}"
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /dna/subscriptions/${sub}/change-tier"
              payload: { new_tier: "PRO", expected_subscription_version: "${sv}" }
              as: Customer
              as_user_id: "${c}"
              captures: { lc: $.data.last_change_charge_cents }
            - call: "POST /dna/subscriptions/${sub}/change-tier"
              payload: { new_tier: "FREE", expected_subscription_version: "${sv}" }
              as: Customer
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "${lc} == 5557 (PLUS -> PRO at 30/30 remaining days)"
            - "The second call returns HTTP 412 and ${err} == ERR_STALE_VERSION"
            - "Subscription.${sub}.tier == PRO and Subscription.${sub}.pending_tier == null"
            - "Customer.${c}.wallet_credit_cents == 14443"

      - name: writes_against_purged_customer_return_customer_purged
        claim_type: cascading_side_effects
        grounds: ["validations[priority=8]", "errors[ERR_CUSTOMER_PURGED]", entities.Customer.fields.account_status]
        distinguishing_aspect: "After the purge run sets account_status = PURGED, a new consent grant for that customer is rejected with ERR_CUSTOMER_PURGED (409) at priority 8 — before the consent overlap and cooling-off checks."
        test_recipe:
          setup: ["Clock 2026-05-08T00:00:00Z. Customer has been PURGED by a purge-run executing an approved DELETE request."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "pg@dna.test", display_name: "Pg" }
              as: PlatformAdmin
              captures: { c: $.data.id }
            - call: "POST /dna/data-requests"
              payload: { customer_id: "${c}", request_type: "DELETE" }
              as: Customer
              as_user_id: "${c}"
              captures: { dr: $.data.id }
            - call: "POST /dna/data-requests/${dr}/decide"
              payload: { decision: "APPROVE" }
              as: PrivacyOfficer
              as_user_id: "po-3"
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/_ops/purge-run"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /dna/consent-grants"
              payload: { customer_id: "${c}", scope: "RESEARCH", effective_from: "2026-05-08T00:00:00Z", effective_until: "2026-12-31T00:00:00Z" }
              as: Customer
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_CUSTOMER_PURGED"
            - "Customer.${c}.account_status == PURGED"
            - "GET /dna/consent-grants?customer_id=${c} returns 0 grants"

  # =========================================================================
  - section: consistency_model
    instances:
      - name: cascade_is_visible_in_the_same_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.Kit.RECEIVED_to_PROCESSED]
        distinguishing_aspect: "consistency_model is `immediate`: the batch-finalize response already reflects pass_rate 1.0, and an immediately following read of the Kit and the Customer (no delay, no re-run) shows PROCESSED and DNA_READY."
        excluded_because:
          difficulty_instance: lab_finalize_sample_kit_customer_three_hop_cascade
          rationale: "That §1.8 instance asserts LabBatch.pass_rate, Kit.status and Customer.dna_status straight after the single finalize call, which is exactly the immediate-consistency claim."
