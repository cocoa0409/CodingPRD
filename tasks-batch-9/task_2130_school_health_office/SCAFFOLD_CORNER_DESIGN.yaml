      - name: error_active_plan_conflict_without_a_supersede_pointer
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACTIVE_PLAN_CONFLICT]", "validations[priority=41]", "entities.ActionPlan.fields.supersedes_action_plan_id"]
        distinguishing_aspect: "A second plan for the same student_id and condition_code is refused with 409 ERR_ACTIVE_PLAN_CONFLICT when supersedes_action_plan_id is omitted, and accepted with 201 when it names the ACTIVE plan exactly."
        test_recipe:
          setup:
            - "School QUILL81 with one RN and one ENROLLED student; one ASTHMA ActionPlan already driven to ACTIVE via submit, guardian consent and physician approval."
