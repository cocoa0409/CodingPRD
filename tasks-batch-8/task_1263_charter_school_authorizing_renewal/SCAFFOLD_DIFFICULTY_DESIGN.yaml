            - call: "POST /authorizer/schools/${school_id}/contracts"
              payload: { framework_version: "FW-1", term_start: "2027-07-01T00:00:00Z", term_end: "2032-06-30T00:00:00Z", expected_school_version: "${school_v}" }
              as: AuthorizerStaff
              captures: { contract_id: $.data.id }
            - call: "POST /authorizer/contracts/${contract_id}/targets"
              payload: { domain: "ACADEMIC", metric_code: "MATH_PROF", target_value: 80, floor_value: 60, weight: 0.5 }
              as: AuthorizerStaff
            - call: "POST /authorizer/contracts/${contract_id}/targets"
              payload: { domain: "FINANCIAL", metric_code: "AUDIT_CLEAN", target_value: 1, floor_value: 1, weight: 0.25 }
              as: AuthorizerStaff
            - call: "POST /authorizer/contracts/${contract_id}/targets"
              payload: { domain: "OPERATIONAL", metric_code: "ENROLL_PCT", target_value: 95, floor_value: 85, weight: 0.25 }
              as: AuthorizerStaff
            - call: "POST /authorizer/contracts/${contract_id}/activate"
              payload: {}
              as: AuthorizerStaff
          trigger:
            - call: "POST /authorizer/schools/${school_id}/fee-invoices"
              payload: { fiscal_year: 2028, estimated_enrollment: 250, base_per_pupil_cents: 796000, qualifying_supplemental_pupils: 40 }
              as: AuthorizerStaff
              captures: { inv_id: $.data.id, supp: $.data.supplemental_cents, total: $.data.total_funding_cents }
          assert:
            - "captured supplemental_cents == 3820800 (SMALL band 0.12 keyed on base 199000000)"
            - "captured total_funding_cents == 202820800 (>= SMALL_CAP, proving band was keyed on base, not total)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: corrective_plan_return_resubmit_cycle
        grounds:
          - state_machines.CorrectiveActionPlan.SUBMITTED_to_RETURNED
          - state_machines.CorrectiveActionPlan.RETURNED_to_SUBMITTED
          - state_machines.CorrectiveActionPlan.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          CorrectiveActionPlan is cyclic: SUBMITTED -> RETURNED -> SUBMITTED -> ACCEPTED loops
          back to a prior state on the same entity; resubmit refreshes plan_text/submitted_at
          and clears reviewed_by_user_id.
