              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { fte_total: "$.total_count", fte_kind: "$.data[0].kind", fte_occ: "$.data[0].occurred_at", fte_days: "$.data[0].days_late", fte_sev: "$.data[0].severity", fte_event_ref: "$.data[0].material_event_id" }
