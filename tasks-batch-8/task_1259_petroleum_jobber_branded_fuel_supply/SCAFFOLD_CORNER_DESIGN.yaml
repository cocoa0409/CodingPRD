  # ============================================================ validations
  - section: validations
    instances:
      - name: request_missing_auth_headers
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Missing X-User-ID / X-User-Role headers -> 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check (even on a non-existent resource)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/dealer-stations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), not 404 — auth precedes existence"

      - name: deliver_nonexistent_drop_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_TRANSPORT_DROP_NOT_FOUND]"]
        distinguishing_aspect: "Existence beats state: deliver on a random UUID returns 404 (and the error envelope carries meta + data.error_id per §1.0)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/transport-drops/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/deliver"
              payload: { delivered_gallons: 100 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TRANSPORT_DROP_NOT_FOUND (404)"
            - "error envelope has meta.api_request_id and data.message per §1.0"

      - name: drop_create_with_unknown_tank_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_STORAGE_TANK_NOT_FOUND]"]
        distinguishing_aspect: "Body FK existence: a drop referencing a non-existent tank_id returns ERR_STORAGE_TANK_NOT_FOUND before any state/safety check."
        test_recipe:
          setup: ["product, truck exist; no tank"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-1", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_id: $.data.id }
