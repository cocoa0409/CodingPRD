              payload: { consumer_ref: "cons_ad", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v2}" }
              as: Consumer
              as_user_id: cons_ad
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409 and error_id == ERR_DUPLICATE_ACTIVE"
            - "GET /recipients/${rec_id}/consents returns exactly 1 consent"

      - name: ack_from_non_required_recipient_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_ACK_NOT_REQUIRED]
        distinguishing_aspect: "Only recipients that received the DATA_DELETED webhook may ack; an ack from any other recipient id is rejected ERR_ACK_NOT_REQUIRED."
        test_recipe:
          setup: ["Deletion request PROPAGATING for consent under recipient R1; a second APPROVED recipient R2 exists but is not a required acker"]
          setup_api_calls:
