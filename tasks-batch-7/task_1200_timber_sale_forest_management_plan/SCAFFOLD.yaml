  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Inspection id does not exist" }
  - { id: ERR_OBLIGATION_NOT_FOUND, http: 404, condition: "Reforestation obligation id does not exist" }
  - { id: ERR_SURVEY_NOT_FOUND, http: 404, condition: "Survival survey id does not exist" }
  - { id: ERR_VALUATION_NOT_FOUND, http: 404, condition: "Carbon valuation id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid/unknown request field, bad enum value, malformed date, negative amount" }
  - { id: ERR_INVALID_TRANSITION, http: 409, condition: "Trigger not valid from the entity's current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Target entity is in a terminal state" }
  - { id: ERR_CONTRACT_SUSPENDED, http: 409, condition: "Ticket create/verify attempted while contract is not HARVESTING (including SUSPENDED)" }
  - { id: ERR_SALE_NOT_OPEN_FOR_BIDDING, http: 409, condition: "Bid or withdraw attempted while sale not BIDDING_OPEN" }
  - { id: ERR_NOT_WINNING_BID, http: 409, condition: "award bid_id differs from computed winning_bid_id" }
  - { id: ERR_OPEN_MAJOR_FINDING, http: 409, condition: "start-harvest/resume/complete-harvest with an open MAJOR BMP finding" }
  - { id: ERR_CONSERVATION_ENROLLMENT_CONFLICT, http: 409, condition: "Harvest window overlaps tract conservation enrollment (closed-interval), or valuation created on non-OPEN tract" }
  - { id: ERR_ACTIVE_CONTRACT_BLOCKS_CONSERVATION, http: 409, condition: "Carbon valuation accept while any contract on the tract is non-terminal" }
  - { id: ERR_STAND_WINDOW_OVERLAP, http: 409, condition: "ACTIVATE prescription overlaps another ACTIVE prescription on the same stand (half-open semantics)" }
  - { id: ERR_PRESCRIPTION_NOT_APPROVED, http: 409, condition: "Sale offer requires prescription APPROVED" }
  - { id: ERR_CRUISE_NOT_CERTIFIED, http: 409, condition: "Sale offer / prescription approve requires CERTIFIED cruise" }
  - { id: ERR_CRUISE_EXPIRED, http: 422, condition: "Cruise certified_at older than CRUISE_MAX_AGE_MONTHS (24) at offer" }
  - { id: ERR_MIN_PLOTS_NOT_MET, http: 422, condition: "Certify with fewer than MIN_RECONCILED_PLOTS (5) reconciled plots" }
  - { id: ERR_SAMPLING_ERROR_TOO_HIGH, http: 422, condition: "Certify with sampling_error_pct > 10.00" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Ticket verifier is the same user who recorded the ticket" }
  - { id: ERR_SALE_PRESCRIPTION_STAND_MISMATCH, http: 422, condition: "sale.stand_id != prescription.stand_id or tract mismatch" }
  - { id: ERR_SPECIES_RATE_MISSING, http: 422, condition: "PER_UNIT sale/bid missing required species rates, or mutually exclusive bid fields mixed" }
  - { id: ERR_BID_WINDOW_NOT_OPEN, http: 409, condition: "Bid submitted before bid_open_at or at/after bid_close_at" }
  - { id: ERR_SEASON_WINDOW_VIOLATION, http: 422, condition: "start-harvest outside sale harvest window or prescription window" }
  - { id: ERR_SURVEY_TOO_EARLY, http: 422, condition: "Survey dated before planted_date + 365 days" }
  - { id: ERR_PLANTING_DEADLINE_PASSED, http: 422, condition: "record-planting after plant_by_date" }
  - { id: ERR_DISPUTE_WINDOW_PASSED, http: 422, condition: "Dispute more than 10 days after verified_at" }
  - { id: ERR_CURE_PERIOD_EXPIRED, http: 422, condition: "Cure more than 14 days after defaulted_at" }
  - { id: ERR_SETTLEMENT_PERIOD_OVERLAP, http: 422, condition: "Settlement period overlaps an existing non-VOID PER_UNIT_PERIOD settlement on the contract" }
  - { id: ERR_BID_BELOW_MINIMUM, http: 422, condition: "PER_UNIT bid species rate below advertised species floor" }
  - { id: ERR_VOLUME_ALLOWANCE_EXCEEDED, http: 422, condition: "Cumulative species volume would exceed 110% of certified volume" }
  - { id: ERR_BOND_AMOUNT_MISMATCH, http: 422, condition: "Posted bond amount != required_bond_amount_cents" }
  - { id: ERR_SETTLEMENT_PERIOD_EMPTY, http: 422, condition: "PER_UNIT_PERIOD settlement with zero eligible VERIFIED tickets" }
  - { id: ERR_BOND_HOLD_OUTSTANDING, http: 409, condition: "Bond release while reforestation obligation not SATISFIED" }
  - { id: ERR_UNPAID_SETTLEMENTS, http: 409, condition: "Contract close with settlements not in {PAID, REFUNDED, VOID}" }
  - { id: ERR_REFORESTATION_UNSATISFIED, http: 409, condition: "Contract close while obligation not SATISFIED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version differs from the parent's current version (OCC)" }

roles:
  - name: PlatformAdmin
    description: "Platform operator: provisions party registry, adjudicates bond claims, drives the logical clock"
    identity: opaque
    exclusive_operations: ["POST /forestry/foresters", "POST /forestry/landowners", "POST /forestry/buyers", "POST /forestry/contractors", "POST /forestry/bonds/{id}/adjudicate", "POST /_clock/set_current_utc"]
    shared_operations: ["GET endpoints"]
  - name: Forester
    description: "Consulting forester running the management plan: inventory, prescriptions, sales, settlements, inspections scheduling, verifications"
    identity: entity_backed:Forester
    exclusive_operations: ["POST /forestry/tracts", "POST /forestry/stands", "POST /forestry/cruises", "cruise actions", "POST /forestry/prescriptions", "prescription propose/revise/activate/complete/withdraw", "POST /forestry/sales", "sale offer/open/close/award/no-sale/reoffer/cancel", "POST /forestry/contracts/{id}/suspend|resume|declare-default|terminate|close|release-holdback", "POST /forestry/bonds/{id}/claim-forfeiture|release", "ticket verify/resolve/void", "settlement create/disburse/refund/void", "POST /forestry/inspections", "obligation declare-delinquent", "survey create/finalize/void", "POST /forestry/carbon-valuations"]
    shared_operations: ["POST /forestry/scale-tickets", "POST /forestry/sales/{id}/cancel", "GET endpoints"]
  - name: Landowner
    description: "Tract owner: approves prescriptions and settlements, disputes tickets, decides carbon valuations"
    identity: entity_backed:Landowner
    exclusive_operations: ["POST /forestry/prescriptions/{id}/approve", "POST /forestry/settlements/{id}/approve", "POST /forestry/carbon-valuations/{id}/accept", "POST /forestry/carbon-valuations/{id}/reject"]
    shared_operations: ["POST /forestry/scale-tickets/{id}/dispute", "POST /forestry/sales/{id}/cancel", "GET endpoints"]
  - name: Buyer
    description: "Timber buyer/mill: bids on sales, posts bond, assigns contractor, cures defaults, disputes tickets"
    identity: entity_backed:Buyer
    exclusive_operations: ["POST /forestry/sales/{sale_id}/bids", "POST /forestry/bids/{id}/withdraw", "POST /forestry/contracts/{id}/bond", "POST /forestry/contracts/{id}/assign-contractor", "POST /forestry/contracts/{id}/cure"]
    shared_operations: ["POST /forestry/scale-tickets/{id}/dispute", "GET endpoints"]
  - name: Contractor
    description: "Logging contractor assigned to a contract: starts/completes harvest, records scale tickets and plantings"
    identity: entity_backed:Contractor
    exclusive_operations: ["POST /forestry/contracts/{id}/start-harvest", "POST /forestry/contracts/{id}/complete-harvest", "POST /forestry/obligations/{id}/record-planting"]
    shared_operations: ["POST /forestry/scale-tickets", "GET endpoints"]
  - name: AgencyInspector
    description: "External BMP compliance inspector (operator id, not a persisted party)"
    identity: opaque
    exclusive_operations: ["POST /forestry/inspections/{id}/conduct", "POST /forestry/inspections/{id}/close", "POST /forestry/inspections/{id}/verify-corrective"]
    shared_operations: ["GET endpoints"]
