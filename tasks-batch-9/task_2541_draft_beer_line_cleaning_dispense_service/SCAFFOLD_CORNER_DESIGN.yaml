  - section: rbac
    instances:
      - name: corner_void_is_unauthorized_for_the_technician_and_unauthenticated_without_a_user_id
        claim_type: Unauthorized operation
        grounds:
          - rbac.QualityAuditor.exclusive_operations
          - rbac.ServiceTechnician.exclusive_operations
          - validations[1].ERR_UNAUTHENTICATED
          - validations[3].ERR_UNAUTHORIZED
        distinguishing_aspect: |
          The auth ladder is ordered: an otherwise perfect auditor request with an
          empty X-User-ID is ERR_UNAUTHENTICATED (401) before any role check runs,
          the technician who logged the cycle is ERR_UNAUTHORIZED (403) on the
          auditor-exclusive void, and only the auditor's own call voids it — so
          neither refusal returns the lot volume.
