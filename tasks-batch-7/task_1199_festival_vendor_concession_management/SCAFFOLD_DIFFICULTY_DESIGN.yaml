              as_user_id: "${vend}"
              captures: { app: $.data.id }
            - { call: "POST /vendor-applications/${app}/start-review", payload: {}, as: VendorManager }
            - { call: "POST /vendor-applications/${app}/decide", payload: { decision: "ACCEPTED", curated_fee_model: "FLAT_FEE", curated_flat_fee_cents: 50000 }, as: VendorManager }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "CURATED" }, as: FestivalDirector }
            - call: "POST /booths"
              payload: { zone_id: "${zone}", label: "N-01", power_outlet_max_amps: 60, has_water_hookup: true }
              as: OperationsLead
              captures: { booth: $.data.id }
          trigger:
            - call: "POST /booth-assignments"
              payload: { application_id: "${app}", booth_id: "${booth}", power_draw_amps: 45, requires_water: true }
              as: OperationsLead
              captures: { asg: $.data.id }
            - call: "GET /zones/${zone}"
              payload: {}
              as: OperationsLead
              captures: { p1: $.data.reserved_power_amps, w1: $.data.reserved_water_hookups }
            - call: "GET /booths/${booth}"
              payload: {}
              as: OperationsLead
              captures: { bs1: $.data.status }
            - { call: "POST /booth-assignments/${asg}/release", payload: {}, as: OperationsLead }
            - call: "GET /zones/${zone}"
              payload: {}
              as: OperationsLead
              captures: { p2: $.data.reserved_power_amps, w2: $.data.reserved_water_hookups }
            - call: "GET /booths/${booth}"
              payload: {}
              as: OperationsLead
              captures: { bs2: $.data.status }
            - call: "POST /booth-assignments/${asg}/release"
              payload: {}
              as: OperationsLead
              captures: { err: $.data.error_id }
          assert:
            - "baseline: ${p0} == 0 and ${w0} == 0"
            - "forward: ${p1} == 45 and ${w1} == 1, booth ${bs1} == RESERVED"
            - "compensated: ${p2} == 0 and ${w2} == 0 (== baseline, zero drift), booth ${bs2} == AVAILABLE"
            - "compensation is not re-runnable: second release -> ${err} == ERR_INVALID_STATE_TRANSITION"

      - name: settlement_money_conservation_through_dispute_cycle
        grounds:
          - calculations.settlement_financials
          - state_machines.Settlement.RECONCILING_to_DISPUTED
          - state_machines.Settlement.DISPUTED_to_RECONCILING
        distinguishing_aspect: |
          Conserved quantity: money (cents), distinct from the amps invariant. The
          DISPUTED loop mutates no transactions, so gross is conserved across the
          cycle (200000 before and after); at finalize the pinned identity
          gross + vendor_balance_due == share + payout + deductions_applied holds
          exactly: 200000 + 0 == 20000 + 155000 + 25000.
        test_recipe:
          setup:
            - "Festival LIVE; ACTIVE assignment (REVENUE_SHARE 1000bp MARGINAL) with two 100000-cent transactions"
            - "Settlement reconciled by fin-1; a 25000-cent fine ACKNOWLEDGED by the vendor"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FestivalDirector }
            - call: "POST /festivals"
              payload: { name: "Money Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
            - call: "POST /zones"
              payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 100, water_hookup_total: 1 }
              as: OperationsLead
              captures: { zone: $.data.id }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "APPLICATIONS_OPEN" }, as: FestivalDirector }
            - call: "POST /vendors"
              payload: { legal_name: "Money LLC", contact_email: "m@money.com" }
              as: VendorManager
              captures: { vend: $.data.id }
            - call: "POST /vendor-applications"
              payload: { vendor_id: "${vend}", festival_id: "${fest}", category: "FOOD_HOT", fee_model: "REVENUE_SHARE", proposed_revenue_share_pct_bp: 1000, power_needed_amps: 20, requires_water: false }
              as: Vendor
              as_user_id: "${vend}"
              captures: { app: $.data.id }
            - { call: "POST /vendor-applications/${app}/start-review", payload: {}, as: VendorManager }
            - { call: "POST /vendor-applications/${app}/decide", payload: { decision: "ACCEPTED", curated_fee_model: "REVENUE_SHARE", curated_revenue_share_pct_bp: 1000, curated_tier_mode: "MARGINAL" }, as: VendorManager }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "CURATED" }, as: FestivalDirector }
            - call: "POST /booths"
              payload: { zone_id: "${zone}", label: "N-01", power_outlet_max_amps: 60, has_water_hookup: false }
              as: OperationsLead
              captures: { booth: $.data.id }
            - call: "POST /booth-assignments"
              payload: { application_id: "${app}", booth_id: "${booth}", power_draw_amps: 20, requires_water: false }
              as: OperationsLead
              captures: { asg: $.data.id }
            - { call: "POST /booth-assignments/${asg}/confirm", payload: {}, as: OperationsLead }
            - { call: "POST /booth-assignments/${asg}/provision-utilities", payload: {}, as: OperationsLead }
            - { call: "POST /inspection-records", payload: { assignment_id: "${asg}", type: "HEALTH_PREOPEN", result: "PASS" }, as: HealthInspector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T12:00:00Z" }, as: FestivalDirector }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "LIVE" }, as: FestivalDirector }
            - { call: "POST /booth-assignments/${asg}/activate", payload: {}, as: OperationsLead }
            - { call: "POST /pos-transactions", payload: { assignment_id: "${asg}", amount_cents: 100000, occurred_at: "2026-07-10T14:00:00Z", idempotency_key: "mc1" }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /pos-transactions", payload: { assignment_id: "${asg}", amount_cents: 100000, occurred_at: "2026-07-10T15:00:00Z", idempotency_key: "mc2" }, as: Vendor, as_user_id: "${vend}" }
            - call: "POST /settlements"
              payload: { assignment_id: "${asg}" }
              as: FinanceLead
              as_user_id: "fin-1"
              captures: { stl: $.data.id }
            - call: "POST /settlements/${stl}/reconcile"
              payload: {}
              as: FinanceLead
              as_user_id: "fin-1"
              captures: { g_before: $.data.provisional_gross_cents }
            - call: "POST /compliance-fines"
              payload: { assignment_id: "${asg}", type: "WASTE_SORTING", amount_cents: 25000 }
              as: SustainabilityOfficer
              as_user_id: "sus-1"
              captures: { fine: $.data.id }
            - { call: "POST /compliance-fines/${fine}/respond", payload: { response: "ACKNOWLEDGED" }, as: Vendor, as_user_id: "${vend}" }
          trigger:
            - { call: "POST /settlements/${stl}/dispute", payload: { reason: "audit" }, as: Vendor, as_user_id: "${vend}" }
            - call: "POST /settlements/${stl}/reconcile"
              payload: {}
              as: FinanceLead
              as_user_id: "fin-1"
              captures: { g_after: $.data.provisional_gross_cents }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-13T00:00:00Z" }, as: FestivalDirector }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "SETTLEMENT" }, as: FestivalDirector }
            - call: "POST /settlements/${stl}/finalize"
              payload: {}
              as: FinanceLead
              as_user_id: "fin-2"
              captures: { fg: $.data.gross_sales_cents, fs: $.data.festival_share_cents, fd: $.data.fine_deduction_cents, fp: $.data.vendor_payout_cents, fu: $.data.vendor_balance_due_cents }
          assert:
            - "gross conserved across the dispute loop: ${g_before} == 200000 and ${g_after} == 200000"
            - "final figures: ${fg} == 200000, ${fs} == 20000, ${fd} == 25000, ${fp} == 155000, ${fu} == 0"
            - "money identity exact: ${fg} + ${fu} == ${fs} + ${fp} + ${fd} (200000 + 0 == 20000 + 155000 + 25000)"
