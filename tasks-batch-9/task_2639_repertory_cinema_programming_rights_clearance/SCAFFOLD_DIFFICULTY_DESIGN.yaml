            - "Two anonymous orders of 4 seats each are PAID, so seats_sold is 8, seats_available is 0 and sale_status has auto-flipped to SOLD_OUT."
            - "Each anonymous order priced at 1450 + 150 facility fee per ticket: total_cents 6400 for four seats."
