            - "Payment.${pay_id}.status == UNAPPLIED"

      - name: dunning_run_skips_invoice_under_active_pause
        claim_type: Conditional action
        grounds: [endpoints, entities.DunningPause.fields.status]
        distinguishing_aspect: "A dunning run emits no notice for a customer whose invoice is overdue but who is under an ACTIVE DunningPause covering today; the returned DunningNotice[] is empty."
        test_recipe:
          setup: ["overdue invoice; ACTIVE pause [2026-05-01,2026-05-31] covering clock 2026-05-10"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: AR_MANAGER
            - call: "POST /ar/customers"
              payload: { name: "PZ", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-02-01T00:00:00Z", due_date: "2026-03-01T00:00:00Z", face_amount_cents: 5000 }
              as: AR_CLERK
            - call: "POST /ar/dunning-pauses"
              payload: { customer_id: "${c_id}", pause_start: "2026-05-01T00:00:00Z", pause_end: "2026-05-31T00:00:00Z" }
              as: COLLECTIONS_AGENT
            - call: "POST /ar/dunning-sequences"
              payload: { name: "S", steps: [ { min_days_overdue: 1, channel: "EMAIL", severity: 1 } ] }
              as: AR_MANAGER
              captures: { seq_id: $.data.id }
          trigger:
            - call: "POST /ar/dunning-runs"
              payload: { customer_id: "${c_id}", sequence_id: "${seq_id}" }
              as: COLLECTIONS_AGENT
          assert:
            - "response data (DunningNotice[]) has length 0; collection_stage remains CURRENT"

