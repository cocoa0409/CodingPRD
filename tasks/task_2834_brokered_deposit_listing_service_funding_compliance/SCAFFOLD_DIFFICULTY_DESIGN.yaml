          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Institution, one DEPOSIT_BROKER Broker, one BrokerAgreement left in DRAFT."
            - "Scores 80/75/70/65 give diligence_score 74, so APPROVE later lands in APPROVED rather than CONDITIONAL."
