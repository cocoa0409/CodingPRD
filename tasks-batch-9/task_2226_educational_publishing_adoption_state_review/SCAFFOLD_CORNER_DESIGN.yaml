              as: EditorialDirector
              as_user_id: "dir-1"
            - call: "POST /content-edits/${ce_id}/apply"
              payload: {}
              as: EditorialDirector
              as_user_id: "dir-1"
            - call: "POST /submissions/${sub_id}/file"
              payload: {}
