  instances:
  - name: overdue_multiplier_engages_at_the_exact_deadline_instant_not_one_second_earlier
    grounds:
    - calculations.poam_remediation_deadline
    - calculations.residual_risk_score
    - entities.Authorization.fields.residual_risk_score
    - entities.PoamItem.fields.deadline_at
    distinguishing_aspect: is_overdue uses `as_of >= deadline_at`, so at 2026-06-27T23:59:59Z the live score is 4.00 and at
      exactly 2026-06-28T00:00:00Z it is 6.00; the stored Authorization.residual_risk_score stays 4.00 across both reads because
      no mutation occurred, which is the one-second boundary a `>` implementation would miss.
    test_recipe:
      setup:
      - 'Full authorization prelude: Authorization live, clock at 2026-03-30T00:00:00Z.'
      - One PoamItem severity MODERATE, source SELF_IDENTIFIED, detected_at 2026-03-30T00:00:00Z, granted_extension_days 0
        -> deadline_at 2026-06-28T00:00:00Z.
      - At creation the stored Authorization.residual_risk_score was 4.00 with poam_risk_tier LOW.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
