            - call: "POST /stores/${st4_id}/boat-units"
              payload: { stock_no: "BU-BN", model_name: "Bay 170", unit_price_cents: 4000000, unit_condition: "NEW", hull_id_no: "HINBN0000001" }
              as: DealDeskClerk
              captures: { bu4_id: $.data.id }
            - call: "POST /stores/${st4_id}/service-orders"
              payload: { boat_unit_id: "${bu4_id}", order_kind: "OVERSIZE_LOADING", promised_lead_days: 3 }
              as: ServiceWriter
              captures: { so4_id: $.data.id }
            - call: "POST /stores/${st5_id}/boat-units"
              payload: { stock_no: "BU-BN", model_name: "Bay 170", unit_price_cents: 4000000, unit_condition: "NEW", hull_id_no: "HINBN0000001" }
              as: DealDeskClerk
              captures: { bu5_id: $.data.id }
            - call: "POST /stores/${st5_id}/service-orders"
              payload: { boat_unit_id: "${bu5_id}", order_kind: "OVERSIZE_LOADING", promised_lead_days: 3 }
              as: ServiceWriter
              captures: { so5_id: $.data.id }
          trigger:
            - call: "POST /stores/${st4_id}/bay-bookings"
              payload: { bay_no: 5, member_id: "${m_id}", service_order_id: "${so4_id}", booked_start_utc: "2026-12-01T09:00:00Z", booked_end_utc: "2026-12-01T10:00:00Z" }
              as: ReceivingManager
              captures: { err: $.data.error_id }
            - call: "POST /stores/${st5_id}/bay-bookings"
              payload: { bay_no: 5, member_id: "${m_id}", service_order_id: "${so5_id}", booked_start_utc: "2026-12-01T09:00:00Z", booked_end_utc: "2026-12-01T10:00:00Z" }
              as: ReceivingManager
              captures: { bk_id: $.data.id }
          assert:
            - "bay 5 at the four-bay store is rejected with data.error_id == ERR_BAY_NOT_FOUND and http 404"
            - "bay 5 at the five-bay store is accepted: LoadingBayBooking.${bk_id}.bay_no == 5 with status RESERVED"
            - "the ceiling is inclusive at the store's own count, so bay 4 would be accepted at the four-bay store"
            - "the rejected attempt created no booking, so the four-bay store remains without bay bookings"

      - name: title_state_mismatch_and_lien_release_without_prior_title
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TITLE_STATE_MISMATCH]
          - validations[priority=12]
        distinguishing_aspect: "One error id covers two distinct conditions — a cross-state filing and a lien release against a new unit — so the condition is a disjunction rather than a single comparison."
        test_recipe:
          setup: ["a Missouri store with one NEW unit carrying no prior title and one USED unit carrying a prior title"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-NEW", model_name: "Angler 190", unit_price_cents: 9000000, unit_condition: "NEW", hull_id_no: "HINNEW000001" }
              as: DealDeskClerk
              captures: { bu_new_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-USD", model_name: "Bay 170", unit_price_cents: 4000000, unit_condition: "USED", hull_id_no: "HINUSD000001", prior_title_no: "MO-TTL-OLD-0007" }
              as: DealDeskClerk
              captures: { bu_used_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/title-filings"
              payload: { boat_unit_id: "${bu_new_id}", filing_kind: "BOAT_TITLE", state_code: "AR" }
              as: TitleClerk
              captures: { err: $.data.error_id }
            - call: "POST /stores/${st_id}/title-filings"
              payload: { boat_unit_id: "${bu_new_id}", filing_kind: "LIEN_RELEASE", state_code: "MO" }
              as: TitleClerk
              captures: { err2: $.data.error_id }
            - call: "POST /stores/${st_id}/title-filings"
              payload: { boat_unit_id: "${bu_used_id}", filing_kind: "LIEN_RELEASE", state_code: "MO" }
              as: TitleClerk
              captures: { tf_id: $.data.id }
          assert:
            - "the cross-state filing is rejected with data.error_id == ERR_TITLE_STATE_MISMATCH and http 422"
            - "the lien release against the new unit is rejected with the same data.error_id == ERR_TITLE_STATE_MISMATCH, a different trigger condition"
            - "the lien release against the used unit is accepted: TitleFiling.${tf_id}.status == DRAFT"
            - "exactly one TitleFiling row exists for the store, so both rejections left nothing behind"

      - name: rigging_already_open_blocks_a_second_rigging_order
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RIGGING_ALREADY_OPEN]
          - validations[priority=16]
        distinguishing_aspect: "The single-open-rigging-order rule is scoped to the deal, so a second rigging order on the same deal fails while the same order kind on another deal is accepted."
        test_recipe:
          setup: ["a store, one member, two boat units and two quoted deals"]
          setup_api_calls:
            - call: "POST /stores"
