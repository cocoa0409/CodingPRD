            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "T2", destination_name: "Denver", destination_type: "OUT_OF_STATE", start_date: "2027-06-20", end_date: "2027-06-30", capacity_youth: 10, base_cost_cents: 80000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {t2_id: $.data.id} }
            - { call: "POST /youth-ministry/chaperones", payload: {program_id: "${prog_id}", first_name: "Ada", last_name: "One", email: "a1@x.org", phone: "555-1"}, as: ProgramDirector, captures: {chap: $.data.id} }
            - { call: "POST /youth-ministry/chaperones/${chap}/background-checks", payload: {}, as: ProgramDirector, captures: {bc: $.data.id} }
            - { call: "POST /youth-ministry/background-checks/${bc}/advance", payload: {to_status: "SCREENING"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/background-checks/${bc}/advance", payload: {to_status: "CLEARED"}, as: ProgramDirector, captures: {expires: $.data.expires_at} }
            - { call: "POST /youth-ministry/chaperone-assignments", payload: {trip_id: "${t1_id}", chaperone_id: "${chap}", role: "LEAD"}, as: ProgramDirector, captures: {asg1: $.data.id} }
            - { call: "POST /youth-ministry/chaperone-assignments/${asg1}/respond", payload: {decision: "ACCEPT"}, as: Chaperone, as_user_id: "${chap}" }
          trigger:
            - { call: "POST /youth-ministry/chaperone-assignments", payload: {trip_id: "${t2_id}", chaperone_id: "${chap}", role: "SUPPORT"}, as: ProgramDirector, captures: {err: $.data.error_id} }
          assert:
            - "expires == 2027-06-28T00:00:00Z (cleared 2025-06-28 + 730 days) — valid for T1 (end instant 2027-06-26T00:00:00Z), invalid for T2 (end instant 2027-07-01T00:00:00Z)"
            - "err == ERR_SCREENING_NOT_VALID_THROUGH_TRIP with http 422 — NOT ERR_CHAPERONE_TRIP_OVERLAP, though the closed-interval overlap with T1 also holds"
            - "no assignment row created for T2 (GET /youth-ministry/chaperone-assignments?trip_id=${t2_id} returns total_count 0)"

      - name: temporal_vs_constraint_itinerary_window_beats_vehicle_buffer
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_ITINERARY_OUTSIDE_TRIP_WINDOW]
          - errors[ERR_VEHICLE_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Error-category pair (business_temporal, business_constraint) — a third,
          distinct pairing: a TRAVEL item that starts outside the trip window AND
          violates the 45-minute vehicle buffer must return
          ERR_ITINERARY_OUTSIDE_TRIP_WINDOW (priority 10), not
          ERR_VEHICLE_SCHEDULE_CONFLICT (priority 11).
        test_recipe:
          setup:
