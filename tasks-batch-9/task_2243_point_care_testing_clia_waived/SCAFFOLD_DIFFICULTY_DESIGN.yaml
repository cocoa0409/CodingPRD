              as: QualityCoordinator
              captures: { enr_w_id: $.data.id }
            - call: "POST /poct/pt-events"
              payload: { enrollment_id: "${enr_w_id}", shipment_number: 1, due_date: "2026-08-10" }
              as: QualityCoordinator
              captures: { ev_w1_id: $.data.id }
            - call: "POST /poct/pt-events"
              payload: { enrollment_id: "${enr_w_id}", shipment_number: 2, due_date: "2026-08-20" }
              as: QualityCoordinator
              captures: { ev_w2_id: $.data.id }
            - call: "POST /poct/pt-enrollments"
              payload: { site_id: "${site_m_id}", analyte: "GLUCOSE", program_year: 2026, program_provider: "NationalPT" }
              as: QualityCoordinator
              captures: { enr_m_id: $.data.id }
            - call: "POST /poct/pt-events"
              payload: { enrollment_id: "${enr_m_id}", shipment_number: 1, due_date: "2026-08-10" }
              as: QualityCoordinator
              captures: { ev_m1_id: $.data.id }
            - call: "POST /poct/pt-events"
              payload: { enrollment_id: "${enr_m_id}", shipment_number: 2, due_date: "2026-08-20" }
              as: QualityCoordinator
              captures: { ev_m2_id: $.data.id }
            - call: "POST /poct/pt-events/${ev_w1_id}/score"
              payload: { score_pct: 60.00, graded_on: "2026-08-01" }
              as: QualityCoordinator
            - call: "POST /poct/pt-events/${ev_w2_id}/score"
              payload: { score_pct: 60.00, graded_on: "2026-08-01" }
              as: QualityCoordinator
            - call: "POST /poct/pt-events/${ev_m1_id}/score"
              payload: { score_pct: 60.00, graded_on: "2026-08-01" }
              as: QualityCoordinator
            - call: "POST /poct/pt-events/${ev_m2_id}/score"
              payload: { score_pct: 60.00, graded_on: "2026-08-01" }
              as: QualityCoordinator
          trigger:
            - call: "GET /poct/sites/${site_w_id}/readiness"
