            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff1}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1125, prior_year_value: 1000, source_field_path: "sis.enrollment.headcount" }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "GET /ir/edit-checks"
              as: IRAnalyst
              captures: { ec1: "$.data[0].id" }
            - call: "POST /ir/edit-checks/${ec1}/explain"
              payload: { explanation_text: "A new nursing cohort of 125 students entered in the fall term.", prior_year_comparison_note: "Prior year 1000 headcount; current 1125 after the nursing expansion." }
              as: IRAnalyst
              as_user_id: "u-shared"
          trigger:
            - call: "POST /ir/edit-checks/${ec1}/adjudicate"
              payload: { decision: "ACCEPT", adjudication_note: "Accepting the explanation I wrote myself." }
              as: IRDirector
              as_user_id: "u-shared"
              captures: { e1: $.data.error_id }
            - call: "POST /ir/edit-checks/${ec1}/adjudicate"
              payload: { decision: "ACCEPT", adjudication_note: "Nursing expansion confirmed against the admissions file." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/survey-components/${comp}/certify"
              payload: { certification_statement: "I certify the enrollment component as reported to the federal collection." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/publications"
              payload: { component_id: "${comp}", metric_key: "TOTAL_HEADCOUNT", published_value: 1125, effective_from: "2026-12-01T00:00:00Z" }
              as: IRAnalyst
              as_user_id: "analyst-1"
              captures: { pub: $.data.id, pub_v: $.data.version }
            - call: "POST /ir/publications/${pub}/restatements"
              payload: { proposed_value: 1120, justification: "Five students were double counted across two majors.", expected_publication_version: "${pub_v}" }
              as: IRAnalyst
