    code: 201
    input: [tier_level, discount_pct, effective_from, effective_to, routing_includes_out_of_scope]
    output: PracticePricingAgreement
    side_effects:
      - "status = DRAFT"
      - "submitted_by_user_id = X-User-ID"
      - "status_changed_by = MANUAL"

  - method: GET
    path: "/networks/pricing-agreements"
    description: "List pricing agreements, filtered"
    roles: [NetworkAdmin, PracticeAdmin, RevenueCycleManager, NetworkAnalyst, PlatformAdmin]
