# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1986: Game Publishing QA & Platform Certification
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is replayable from
# empty-DB via its setup_api_calls chain. Clock default: 2026-08-01T00:00:00Z
# (a Saturday) unless a chain sets it.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: vendor_invoice_provisional_vs_final_diverge
        grounds:
          - calculations.vendor_invoice_settlement
          - entities.QaVendor.fields.escapes_count
          - endpoints:GET /qa-cert/vendors/{vendorId}/invoice
        distinguishing_aspect: |
          Same assignments and escape data read through two sanctioned variants on the
          VENDOR-FINANCE domain: PROVISIONAL (reserved hours, no overtime, no clawback)
          totals 200020 cents while FINAL (actual hours with 1.5x overtime rounded per
          line, then a 10% escape clawback rounded after the sum) totals 220522 cents.
          Sibling instance cert_readiness_optimistic_vs_strict_diverge operates on the
          SUBMISSION-COMPLIANCE domain — a different entity domain as §0.5 rule 1 requires.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z (Tuesday of ISO week 32)"
            - "Vendor V: capacity 40h/week, rate 10001 cents/hour, ACTIVE"
            - "Title T with a PS5 test plan containing entry COMBAT (cert blocker, 1h required)"
            - "A1: 10h reserved, week 2026-08-03, completed with actual 12h; A2: 10h reserved, same week, completed with actual 11h"
            - "One post-launch escape bug attributed to V (severity MINOR, status OPEN)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/titles"
              payload: { title_code: "DUAL-V", name: "Dual V", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 500000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorPrime", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 10001 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 1 }, as: QALead }
            - call: "POST /qa-cert/assignments"
              payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }
              as: VendorManager
              captures: { a1: $.data.id }
            - { call: "POST /qa-cert/assignments/${a1}/transition", payload: { to_status: "IN_PROGRESS" }, as: VendorManager }
            - { call: "POST /qa-cert/assignments/${a1}/transition", payload: { to_status: "DONE", actual_hours: 12 }, as: VendorManager }
            - call: "POST /qa-cert/assignments"
              payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }
              as: VendorManager
              captures: { a2: $.data.id }
            - { call: "POST /qa-cert/assignments/${a2}/transition", payload: { to_status: "IN_PROGRESS" }, as: VendorManager }
            - { call: "POST /qa-cert/assignments/${a2}/transition", payload: { to_status: "DONE", actual_hours: 11 }, as: VendorManager }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { bid: $.data.id }
            - call: "POST /qa-cert/bugs"
              payload: { title_id: "${tid}", build_id: "${bid}", severity: "MINOR", category: "GAMEPLAY", found_by_vendor_id: "${vid}", found_post_launch: true }
              as: QALead
          trigger:
            - call: "GET /qa-cert/vendors/${vid}/invoice?week_start_date=2026-08-03&variant=PROVISIONAL"
              as: VendorManager
              captures: { prov_total: $.data.total_cents, prov_claw: $.data.clawback_cents }
            - call: "GET /qa-cert/vendors/${vid}/invoice?week_start_date=2026-08-03&variant=FINAL"
              as: VendorManager
              captures: { fin_total: $.data.total_cents, fin_sub: $.data.subtotal_cents, fin_claw: $.data.clawback_cents }
          assert:
            - "PROVISIONAL total_cents == 200020 (two lines of 10h x 10001)"
            - "PROVISIONAL clawback_cents == 0"
            - "FINAL subtotal_cents == 245025 (line1 = 100010 + 30003; line2 = 100010 + 15002)"
            - "FINAL clawback_cents == 24503 (round_half_up(245025 x 10%))"
            - "FINAL total_cents == 220522"
            - "prov_total != fin_total for identical underlying data"

      - name: cert_readiness_optimistic_vs_strict_diverge
        grounds:
          - calculations.cert_readiness_index
          - calculations.checklist_seeding_catalog
          - entities.SubmissionPackage.fields.readiness_optimistic_pct
          - entities.SubmissionPackage.fields.readiness_strict_pct
        distinguishing_aspect: |
          Same checklist state read through two sanctioned variants on the
          SUBMISSION-COMPLIANCE domain: OPTIMISTIC counts the auto-verifiable
          UNVERIFIED item TRC-PS-01 as passing (75.00) while STRICT counts only
          terminal pass-equivalent states (50.00). Distinct entity domain from
          vendor_invoice_provisional_vs_final_diverge (vendor finance), satisfying
          §0.5 rule 1's different-domain clause.
        test_recipe:
          setup:
            - "Title T (PS5), status IN_DEVELOPMENT"
            - "Plan P APPROVED-equivalent setup: entry COMBAT covered by a 10h assignment"
            - "Build B CANDIDATE; package PKG created (plan LOCKED, checklist seeded with 4 PS5 items)"
            - "Checklist state: TRC-PS-01 (REQUIRED, auto) UNVERIFIED; TRC-PS-02 PASSED; TRC-PS-03 (REQUIRED, manual) UNVERIFIED; TRC-PS-04 (RECOMMENDED) NA"
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "DUAL-R", name: "Dual R", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorQ", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { bid: $.data.id }
            - { call: "POST /qa-cert/builds/${bid}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${bid}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
            - { call: "POST /qa-cert/builds/${bid}/transition", payload: { to_status: "CANDIDATE" }, as: QALead }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { tv: $.data.version }
            - call: "POST /qa-cert/titles/${tid}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${bid}", test_plan_id: "${pid}", expected_title_version: "${tv}" }
              as: CertificationLead
              captures: { pkg: $.data.id, cid: $.data.checklist_id }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-02", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-04", result: "NA" }, as: ComplianceManager }
          trigger:
            - call: "GET /qa-cert/submission-packages/${pkg}"
              as: Any
              captures: { opti: $.data.readiness_optimistic_pct, strict: $.data.readiness_strict_pct }
          assert:
            - "readiness_optimistic_pct == 75.00 ((1 PASSED + 1 NA + 1 auto-UNVERIFIED) / 4)"
            - "readiness_strict_pct == 50.00 ((1 PASSED + 1 NA) / 4)"
            - "opti != strict for the identical checklist state"

  # ---------------------------------------------------------------- rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: submission_fee_tiered_expedited_weekend
        grounds:
          - calculations.submission_fee
          - state_machines.SubmissionPackage.ASSEMBLING_to_SUBMITTED
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: PS5 base 120000 x
          round-2 tier 0.50 x expedited 1.75 x Saturday 1.20, min-capped at 250000,
          one round_half_up at the end => 126000 cents. A weekday/non-expedited/round-1
          reading of the same formula yields 120000, proving the interaction is
          non-linear. Sibling instances exercise modes (b) and (c), not (a).
        test_recipe:
          setup:
            - "Title T (PS5), budget 2000000, IN_DEVELOPMENT; ESRB filing GRANTED (fee 40000 already spent)"
            - "Plan APPROVED-then-LOCKED; Build B1 CANDIDATE; PKG1 round 1 submitted Monday 2026-08-03T10:00:00Z (fee 120000) then REJECTED by a different user"
            - "PKG2 created for the same (title, PS5) with expedited=true => round == 2; its checklist fully verified"
            - "Logical clock at Saturday 2026-08-08T10:00:00Z when PKG2 is submitted"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/titles"
              payload: { title_code: "COMB-FEE", name: "Comb Fee", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 2000000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorF", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { b1: $.data.id }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "CANDIDATE" }, as: QALead }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "ESRB", content_descriptors: ["MILD_VIOLENCE"] }
              as: ReleaseManager
              captures: { fid: $.data.id }
            - { call: "POST /qa-cert/age-rating-filings/${fid}/transition", payload: { to_status: "FILED" }, as: ReleaseManager }
            - { call: "POST /qa-cert/age-rating-filings/${fid}/transition", payload: { to_status: "GRANTED" }, as: PlatformReviewer }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { tv1: $.data.version }
            - call: "POST /qa-cert/titles/${tid}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${b1}", test_plan_id: "${pid}", expected_title_version: "${tv1}" }
              as: CertificationLead
              captures: { pkg1: $.data.id, cid1: $.data.checklist_id }
            - { call: "POST /qa-cert/compliance-checklists/${cid1}/items/verify", payload: { requirement_code: "TRC-PS-01", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid1}/items/verify", payload: { requirement_code: "TRC-PS-02", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid1}/items/verify", payload: { requirement_code: "TRC-PS-03", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid1}/items/verify", payload: { requirement_code: "TRC-PS-04", result: "NA" }, as: ComplianceManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/submission-packages/${pkg1}/transition"
              payload: { to_status: "SUBMITTED" }
              as: CertificationLead
              as_user_id: "cl-1"
            - { call: "POST /qa-cert/submission-packages/${pkg1}/transition", payload: { to_status: "IN_REVIEW" }, as: PlatformReviewer }
            - { call: "POST /qa-cert/submission-packages/${pkg1}/transition", payload: { to_status: "REJECTED" }, as: PlatformReviewer, as_user_id: "pr-1" }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { tv2: $.data.version }
            - call: "POST /qa-cert/titles/${tid}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${b1}", test_plan_id: "${pid}", expected_title_version: "${tv2}", expedited: true }
              as: CertificationLead
              captures: { pkg2: $.data.id, cid2: $.data.checklist_id, round2: $.data.round }
            - { call: "POST /qa-cert/compliance-checklists/${cid2}/items/verify", payload: { requirement_code: "TRC-PS-01", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid2}/items/verify", payload: { requirement_code: "TRC-PS-02", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid2}/items/verify", payload: { requirement_code: "TRC-PS-03", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid2}/items/verify", payload: { requirement_code: "TRC-PS-04", result: "NA" }, as: ComplianceManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T10:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /qa-cert/submission-packages/${pkg2}/transition"
              payload: { to_status: "SUBMITTED" }
              as: CertificationLead
              as_user_id: "cl-1"
              captures: { fee2: $.data.fee_cents }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { esc: $.data.cert_budget_escrow_cents, spent: $.data.cert_budget_spent_cents }
          assert:
            - "pkg2.round == 2 (one prior non-SUPERSEDED package for (title, PS5))"
            - "pkg2.fee_cents == 126000 (round_half_up(120000 x 0.50 x 1.75 x 1.20); cap 250000 not binding)"
            - "title.cert_budget_escrow_cents == 126000"
            - "title.cert_budget_spent_cents == 160000 (120000 rejected round-1 fee + 40000 ESRB filing)"

      - name: vendor_invoice_per_line_rounding_order
        grounds:
          - calculations.vendor_invoice_settlement
          - entities.TestAssignment.fields.actual_hours
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: two DONE assignments each
          contribute 1 overtime hour at rate 10001 (OT share 15001.5 cents per line).
          The pinned order (round_half_up PER LINE, then sum) yields total 190020;
          the rejected alternative (sum raw, round once) yields 190019. One cent of
          divergence isolates the pinned order. Mode differs from
          submission_fee_tiered_expedited_weekend (a) and window_demand_fee_self_inclusive_tier (c).
        test_recipe:
          setup:
            - "Vendor V: capacity 40h/week, rate 10001 cents/hour"
            - "Plan entry COMBAT covered by the assignments themselves"
            - "A1: reserved 8h week 2026-08-03, DONE with actual 9h; A2: reserved 8h same week, DONE with actual 9h"
            - "No escape bugs (found_post_launch) exist for V"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/titles"
              payload: { title_code: "COMB-ROUND", name: "Comb Round", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 500000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorRound", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 10001 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 1 }, as: QALead }
            - call: "POST /qa-cert/assignments"
              payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 8 }
              as: VendorManager
              captures: { a1: $.data.id }
            - { call: "POST /qa-cert/assignments/${a1}/transition", payload: { to_status: "IN_PROGRESS" }, as: VendorManager }
            - { call: "POST /qa-cert/assignments/${a1}/transition", payload: { to_status: "DONE", actual_hours: 9 }, as: VendorManager }
            - call: "POST /qa-cert/assignments"
              payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 8 }
              as: VendorManager
              captures: { a2: $.data.id }
            - { call: "POST /qa-cert/assignments/${a2}/transition", payload: { to_status: "IN_PROGRESS" }, as: VendorManager }
            - { call: "POST /qa-cert/assignments/${a2}/transition", payload: { to_status: "DONE", actual_hours: 9 }, as: VendorManager }
          trigger:
            - call: "GET /qa-cert/vendors/${vid}/invoice?week_start_date=2026-08-03&variant=FINAL"
              as: VendorManager
              captures: { tot: $.data.total_cents, sub: $.data.subtotal_cents, lc: $.data.line_count }
          assert:
            - "line_count == 2"
            - "subtotal_cents == 190020 (per line: 80008 + round_half_up(15001.5)=15002 => 95010; x2)"
            - "clawback_cents == 0 (no escapes)"
            - "total_cents == 190020 — NOT 190019 (sum-then-round alternative is rejected)"

      - name: window_demand_fee_self_inclusive_tier
        grounds:
          - calculations.window_demand_fee
          - state_machines.ReleaseWindow.RESERVED_to_CONFIRMED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the
          new 8h window's own hours push the ISO-week total from 36h (LOW tier) to
          44h (MEDIUM tier, x1.25), so the window pays 50000 cents; keying the tier
          on existing-hours-only would yield 40000. Pinned order: self hours count
          toward the tier that prices the window itself. Mode differs from (a) and (b)
          sibling instances.
        test_recipe:
          setup:
            - "Title T with platforms [PS5, PC], budget 2000000, driven to CERT_APPROVED (full approved-package chain, fee 120000 spent, ESRB fee 40000 spent)"
            - "Logical clock Monday 2026-08-03T10:00:00Z (ISO week 32)"
            - "W1 PC LAUNCH [2026-08-03T18:00Z, 2026-08-04T18:00Z) CONFIRMED — 24h, fee 120000 (tier LOW: 0+24 < 40)"
            - "W2 PC LAUNCH [2026-08-05T00:00Z, 2026-08-05T12:00Z) CONFIRMED — 12h, fee 60000 (24+12=36 < 40)"
            - "W3 PC LAUNCH [2026-08-05T18:00Z, 2026-08-06T02:00Z) RESERVED — 8h"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/titles"
              payload: { title_code: "COMB-WIN", name: "Comb Win", platform_codes: ["PS5", "PC"], target_launch_date: "2026-11-01", cert_budget_total_cents: 2000000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "CERTIFICATION" }, as: ReleaseManager }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorW", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { b1: $.data.id }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
