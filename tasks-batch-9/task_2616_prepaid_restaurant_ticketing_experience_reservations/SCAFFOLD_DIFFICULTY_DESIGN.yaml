      - name: service_charge_per_line_rounding_vs_sum_then_round
        grounds:
          - calculations.reservation_charge_breakdown
          - entities.ReservationAddOn.fields.line_service_charge_cents
          - entities.Reservation.fields.service_charge_cents
          - entities.Reservation.fields.deposit_frozen
        distinguishing_aspect: |
          The 725 bp service charge is rounded once per charge line and the
          rounded lines are then summed: 2610 + 653 + 1233 = 4496, whereas
          rounding the summed subtotal 62000 once gives 4495. Both add-on lines
          are deliberately half-cent cases (652.5 and 1232.5), so the
          per-line-versus-sum-then-round choice is observable to the cent. The
          same trigger also proves the deposit is frozen at confirm time and
          that later add-on lines move only the grand total and the balance.
          This instance composes rounding sites, not pricing factors or fee
          bands.
        test_recipe:
          setup:
            - "one restaurant with service_charge_bp 725"
            - "one package with base_price_cents 12000, deposit_bp 3000, DEPOSIT prepayment"
            - "two add-ons: Caviar Supplement at 4500 cents and Wine Pairing at 8500 cents, both max_qty_per_cover 2, order_cutoff_minutes 120"
