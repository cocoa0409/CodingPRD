              payload: { legal_name: "Eli Zhang", email: "eli@example.com", state_code: "CA", claimed_kitchen_type: "HOME_INSPECTED", weekly_capacity_meals: 20 }
              as: Anonymous
              captures: { cook_id: $.data.id, cook_v0: $.data.version }
