          - calculations.repatriation_surplus_manifest
          - state_machines.Branch
        distinguishing_aspect: "The RESTRICTED band is inclusive at BOTH ends, so exactly 10000 bps is RESTRICTED and only 10001+ is FROZEN: with a 100000-cent vault limit, an 82500-minor EUR position gives 89674 cents / 8967 bps / OPEN, a 92000-minor position gives exactly 100000 cents / 10000 bps / RESTRICTED, and 92500 minor gives 100543 cents / 10054 bps / FROZEN - and the two non-OPEN arrivals each raise an auto_generated REPATRIATION shipment whose manifest is a note-by-note waterfall down to the 8500-bps target."
