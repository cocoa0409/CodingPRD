      - name: irb_window_overlap_half_open_adjacency
        grounds:
          - state_machines.IRBProtocol.SUBMITTED_to_APPROVED
          - errors[ERR_IRB_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the IRBProtocol resource (different entity and
          different geometry than the buffered site-visit sibling): a second APPROVED window
          that overlaps the first is rejected, while a window starting exactly at the first
          window's end is legal adjacency and approved.
        test_recipe:
          setup:
            - "Study with IRB protocol P1 APPROVED over [2026-09-01, 2027-09-01) and protocol P2 SUBMITTED"
          setup_api_calls:
            - call: "POST /evaluation/contracts"
