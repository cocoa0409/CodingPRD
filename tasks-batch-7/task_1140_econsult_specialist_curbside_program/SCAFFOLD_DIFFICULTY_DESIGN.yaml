# =============================================================================
# Task 1140: eConsult & Specialist Curbside Program — §1.8 Test Targeting Index
# 9 Difficulty Rules x 2 instances = 18 instances.
# All chains replay against SCAFFOLD.yaml §1.2/§1.4/§1.5 from empty DB.
# Common fixture notes: logical clock set first; availability window
# [2026-05-01, 2027-01-01) covers every consult created in June 2026.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_posted_response_compensation_diverge
        grounds:
          - calculations.provisional_response_fee
          - calculations.final_response_compensation
          - entities.CompensationEntry.fields.posture
          - state_machines.ConsultResponse.SUBMITTED_to_FINALIZED
        distinguishing_aspect: |
          Entity domain = specialist compensation (CompensationEntry/PanelMembership).
          Identical response data yields provisional 10000 cents at submission but
          posted 5000 cents at finalize, because the posted variant applies the
          quality band (score 6000 -> 0.80 -> 8000) minus the late penalty (3000),
          which the provisional variant ignores.
        test_recipe:
          setup:
            - "Track CARDIOLOGY: routine target 48h, base fee 10000, late penalty 3000, cap 1000000"
            - "Membership M (GOOD_STANDING, quality 8500) with window covering the clock"
            - "Consult created at 2026-06-01T00:00:00Z ROUTINE -> ASSIGNED, sla_due_at 2026-06-03T00:00:00Z"
            - "Clock advanced to 2026-06-03T01:00:00Z (past sla, inside 24h expiry grace) and response submitted late"
            - "Peer specialist registered to act as QualityReviewer"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000001" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000001" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Quinn Reviewer", npi: "2000000002" }, as: ProgramCoordinator, captures: { rev_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-DV1", specialty_track_id: "${track_id}", question_text: "Patient with persistent atypical chest pain and normal ECG; need guidance on ischemic workup.", icd10_primary: "R07", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { consult_id: $.data.id } }
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T01:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/consult-requests/${consult_id}/responses", payload: { disposition: "MANAGE_IN_PRIMARY_CARE", recommendation_text: "Start H2 blocker, repeat troponin in 6 hours, no cath indicated at this time." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_id: $.data.id, resp_on_time: $.data.on_time } }
            - { call: "GET /econsult/panel-memberships/${memb_id}/compensation-summary", as: ProgramCoordinator, captures: { prov_before: $.data.provisional_balance_cents, posted_before: $.data.posted_balance_cents } }
            - { call: "POST /econsult/quality-reviews", payload: { response_id: "${resp_id}" }, as: QualityReviewer, as_user_id: "${rev_id}", captures: { review_id: $.data.id } }
            - { call: "POST /econsult/quality-reviews/${review_id}/complete", payload: { timeliness_score: 5, appropriateness_score: 5, clarity_score: 5, verdict: "PASS" }, as: QualityReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /econsult/consult-responses/${resp_id}/documentation", payload: { record_type: "PCP_NOTE" }, as: ReferringProvider, as_user_id: "${prov_id}" }
            - { call: "POST /econsult/consult-responses/${resp_id}/documentation", payload: { record_type: "SPECIALIST_NOTE" }, as: Specialist, as_user_id: "${spec_id}" }
          trigger:
            - { call: "POST /econsult/consult-responses/${resp_id}/finalize", as: Specialist, as_user_id: "${spec_id}", captures: { resp_status: $.data.status } }
            - { call: "GET /econsult/panel-memberships/${memb_id}/compensation-summary", as: ProgramCoordinator, captures: { prov_after: $.data.provisional_balance_cents, posted_after: $.data.posted_balance_cents } }
          assert:
            - "ConsultResponse.${resp_id}.on_time == false"
            - "pre-finalize: provisional_balance_cents == 10000 and posted_balance_cents == 0"
            - "post-finalize: ConsultResponse.${resp_id}.status == FINALIZED"
            - "post-finalize: provisional_balance_cents == 0 and posted_balance_cents == 5000"
            - "posted amount 5000 == max(0, round_half_up(10000 * 8000/10000) - 3000): band 0.80 applies because quality_score_bps == 6000 at finalize (review component 10000, timeliness component 0), and late penalty 3000 applies because on_time == false"
            - "provisional 10000 != posted 5000 for identical response data"

      - name: attributed_vs_conservative_avoided_visits_diverge
        grounds:
          - calculations.avoided_visit_counts
          - entities.AvoidedVisitMeasurement.fields.avoided_attributed_count
          - entities.AvoidedVisitMeasurement.fields.avoided_conservative_count
        distinguishing_aspect: |
          Entity domain = population-health measurement (AvoidedVisitMeasurement),
          disjoint from the compensation domain of the sibling instance. For the
          same June data (3 responded consults, 1 scheduled conversion, only one
          consult CLOSED with disposition MANAGE_IN_PRIMARY_CARE), the ATTRIBUTED
          variant yields 2 avoided visits while the CONSERVATIVE variant yields 1.
        test_recipe:
          setup:
            - "Track ENDOCRINOLOGY with standard fees; membership with covering window"
            - "Consult A (PAT-AV1): answered MANAGE_IN_PRIMARY_CARE on time, documented, finalized, CLOSED"
            - "Consult B (PAT-AV2): answered MANAGE_WITH_PLAN on time, documented, finalized, CLOSED"
            - "Consult C (PAT-AV3): answered CONVERT_TO_VISIT on time (left ANSWERED), conversion SCHEDULED"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: ENDOCRINOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000011" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000011" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-AV1", specialty_track_id: "${track_id}", question_text: "Type 2 diabetic with rising A1c despite metformin 1g BID; ask about adding SGLT2 inhibitor now.", icd10_primary: "E11", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_a: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_a}/responses", payload: { disposition: "MANAGE_IN_PRIMARY_CARE", recommendation_text: "Add empagliflozin 10mg daily, recheck A1c in 12 weeks, counsel on hydration." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_a: $.data.id } }
            - { call: "POST /econsult/consult-responses/${resp_a}/documentation", payload: { record_type: "PCP_NOTE" }, as: ReferringProvider, as_user_id: "${prov_id}" }
            - { call: "POST /econsult/consult-responses/${resp_a}/documentation", payload: { record_type: "SPECIALIST_NOTE" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-responses/${resp_a}/finalize", as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests/${cons_a}/close", as: ReferringProvider, as_user_id: "${prov_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-AV2", specialty_track_id: "${track_id}", question_text: "Hypothyroid patient with TSH creeping up on current levothyroxine dose; dose adjustment advice.", icd10_primary: "E03", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_b: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_b}/responses", payload: { disposition: "MANAGE_WITH_PLAN", recommendation_text: "Increase levothyroxine by 12.5mcg daily and repeat TSH in 8 weeks before considering referral." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_b: $.data.id } }
            - { call: "POST /econsult/consult-responses/${resp_b}/documentation", payload: { record_type: "PCP_NOTE" }, as: ReferringProvider, as_user_id: "${prov_id}" }
            - { call: "POST /econsult/consult-responses/${resp_b}/documentation", payload: { record_type: "SPECIALIST_NOTE" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-responses/${resp_b}/finalize", as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests/${cons_b}/close", as: ReferringProvider, as_user_id: "${prov_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-AV3", specialty_track_id: "${track_id}", question_text: "New adrenal incidentaloma on CT, biochemical workup equivocal; needs face-to-face endocrine evaluation?", icd10_primary: "D35", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_c: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_c}/responses", payload: { disposition: "CONVERT_TO_VISIT", recommendation_text: "Incidentaloma with equivocal metanephrines requires in-person exam and dynamic testing; please convert." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_c: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_c}/conversions", payload: { appointment_start: "2026-06-10T10:00:00Z", appointment_end: "2026-06-10T10:30:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
          trigger:
            - { call: "POST /econsult/avoided-visit-measurements", payload: { specialty_track_id: "${track_id}", period_key: "2026-06" }, as: ProgramCoordinator, captures: { meas_responded: $.data.responded_count, meas_conv: $.data.conversions_count, meas_attr: $.data.avoided_attributed_count, meas_cons: $.data.avoided_conservative_count } }
          assert:
            - "AvoidedVisitMeasurement.responded_count == 3"
            - "AvoidedVisitMeasurement.conversions_count == 1"
            - "AvoidedVisitMeasurement.avoided_attributed_count == 2  (3 responded - 1 non-cancelled conversion)"
            - "AvoidedVisitMeasurement.avoided_conservative_count == 1  (only PAT-AV1: CLOSED + MANAGE_IN_PRIMARY_CARE + zero conversion records)"
            - "attributed (2) != conservative (1) for identical underlying data"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: final_compensation_three_input_band_interaction
        grounds:
          - calculations.final_response_compensation
          - calculations.panel_quality_score_bps
          - entities.PanelMembership.fields.quality_score_bps
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — disposition selects
          the base, the 4-band quality multiplier is selected by the membership's
          live score (driven to 10000 by a prior 5/5/5 PASS review), and on_time
          gates the penalty. With band 1.20 and on_time, final == 12000 vs the
          provisional 10000 — neither input alone determines the result.
        test_recipe:
          setup:
            - "Track CARDIOLOGY base 10000; membership window covering clock"
            - "Consult 1 answered on time; 5/5/5 PASS review pushes score to 10000 (band 1.20)"
            - "Consult 2 answered on time and fully documented"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000021" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000021" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Quinn Reviewer", npi: "2000000022" }, as: ProgramCoordinator, captures: { rev_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-CF1", specialty_track_id: "${track_id}", question_text: "Palpitations with normal holter; asks whether event monitor or empiric beta blocker is next step.", icd10_primary: "R00", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_1: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_1}/responses", payload: { disposition: "MANAGE_WITH_PLAN", recommendation_text: "Start metoprolol 25mg daily and order 14-day event monitor; follow up in clinic PRN." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_1: $.data.id } }
            - { call: "POST /econsult/quality-reviews", payload: { response_id: "${resp_1}" }, as: QualityReviewer, as_user_id: "${rev_id}", captures: { rev_1: $.data.id } }
            - { call: "POST /econsult/quality-reviews/${rev_1}/complete", payload: { timeliness_score: 5, appropriateness_score: 5, clarity_score: 5, verdict: "PASS" }, as: QualityReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-CF2", specialty_track_id: "${track_id}", question_text: "Stage 1 hypertension on lisinopril, home readings still elevated; add amlodipine or uptitrate?", icd10_primary: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_2: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_2}/responses", payload: { disposition: "MANAGE_IN_PRIMARY_CARE", recommendation_text: "Add amlodipine 5mg daily, home BP log twice daily, recheck electrolytes in 4 weeks." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_2: $.data.id } }
            - { call: "POST /econsult/consult-responses/${resp_2}/documentation", payload: { record_type: "PCP_NOTE" }, as: ReferringProvider, as_user_id: "${prov_id}" }
            - { call: "POST /econsult/consult-responses/${resp_2}/documentation", payload: { record_type: "SPECIALIST_NOTE" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "GET /econsult/compensation-entries", payload: { consult_id: "${cons_2}" }, as: ProgramCoordinator, captures: { fee_pre: "$.data[0].amount_cents", fee_posture_pre: "$.data[0].posture" } }
          trigger:
            - { call: "POST /econsult/consult-responses/${resp_2}/finalize", as: Specialist, as_user_id: "${spec_id}" }
            - { call: "GET /econsult/compensation-entries", payload: { consult_id: "${cons_2}" }, as: ProgramCoordinator, captures: { fee_post: "$.data[0].amount_cents", fee_posture_post: "$.data[0].posture" } }
            - { call: "GET /econsult/panel-memberships/${memb_id}", as: ProgramCoordinator, captures: { score_now: $.data.quality_score_bps } }
          assert:
            - "PanelMembership.${memb_id}.quality_score_bps == 10000 (review component 10000 from one 5/5/5 review; timeliness 10000 from 2/2 on time)"
            - "pre-finalize: entry amount_cents == 10000 and posture == PROVISIONAL"
            - "post-finalize: entry amount_cents == 12000 and posture == POSTED"
            - "12000 == round_half_up(10000 * 12000/10000) - 0: band 1.20 (score >= 9000), no late penalty (on_time true)"

      - name: claim_amount_rounds_per_component_then_sums
        grounds:
          - calculations.billing_claim_amount
          - entities.BillingClaim.fields.amount_cents
          - entities.BillingClaim.fields.claim_code
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — professional component
          rounded first (14998.5 -> 14999), then the 5% documentation add-on
          computed FROM THE ROUNDED component (749.95 -> 750), then summed
          (15749). The unpinned order (round once at the end) yields 15748, one
          cent less; the scaffold pins round-per-component-then-sum.
        test_recipe:
          setup:
            - "Track DERMATOLOGY base_response_fee_cents 9999 (odd to expose rounding)"
            - "URGENT consult answered on time, documented, finalized; no conversion"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: DERMATOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 9999, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000031" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000031" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-CF3", specialty_track_id: "${track_id}", question_text: "Rapidly spreading urticarial rash unresponsive to cetirizine; urgent guidance on steroid course.", icd10_primary: "L50", urgency: "URGENT" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id, cons_sla: $.data.sla_due_at } }
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T01:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/consult-requests/${cons_id}/responses", payload: { disposition: "MANAGE_WITH_PLAN", recommendation_text: "Prednisone 40mg daily x5 days, add famotidine 20mg BID, escalate if airway symptoms." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_id: $.data.id } }
            - { call: "POST /econsult/consult-responses/${resp_id}/documentation", payload: { record_type: "PCP_NOTE" }, as: ReferringProvider, as_user_id: "${prov_id}" }
            - { call: "POST /econsult/consult-responses/${resp_id}/documentation", payload: { record_type: "SPECIALIST_NOTE" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-responses/${resp_id}/finalize", as: Specialist, as_user_id: "${spec_id}" }
          trigger:
            - { call: "POST /econsult/consult-requests/${cons_id}/billing-claims", as: BillingClerk, captures: { claim_amount: $.data.amount_cents, claim_code: $.data.claim_code, claim_status: $.data.status } }
          assert:
            - "ConsultRequest.${cons_id}.sla_due_at == 2026-06-01T12:00:00Z (URGENT target 12h from creation)"
            - "BillingClaim.claim_code == ECONSULT-URG-ANSW"
            - "BillingClaim.amount_cents == 15749 == round_half_up(9999*1.5)=14999 plus round_half_up(14999*0.05)=750 (pinned: round per component, then sum)"
            - "BillingClaim.status == DRAFT"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: consult_parallel_status_and_billing_dimensions
        grounds:
          - state_machines.ConsultRequest
          - entities.ConsultRequest.fields.status
          - entities.ConsultRequest.fields.billing_status
        distinguishing_aspect: |
          ConsultRequest carries two independent state axes on one row: the
          workflow axis (ASSIGNED -> ANSWERED -> CLOSED) and the billing axis
          (UNBILLABLE -> PENDING_DOCUMENTATION -> CHARGEABLE -> CLAIMED). The
          finalize and claim-submit steps advance ONLY the billing axis while the
          workflow axis stays ANSWERED — the dimensions provably evolve
          independently.
        test_recipe:
          setup:
            - "Track CARDIOLOGY standard; membership with covering window; consult answered on time and documented"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000041" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000041" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
