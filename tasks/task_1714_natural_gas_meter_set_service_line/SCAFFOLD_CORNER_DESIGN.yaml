            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_y}", appliance_type: POOL_HEATER, quantity: 1, btuh_input_rating: 250000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_y}", appliance_type: STANDBY_GENERATOR, quantity: 1, btuh_input_rating: 250000 }, as: Builder, as_user_id: "${b_id}" }
