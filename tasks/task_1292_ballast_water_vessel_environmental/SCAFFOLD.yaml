    code: 200
    input: ["limit?", "offset?", "rectification_status?", "is_priority_one?"]
    output: PortStateControlDeficiency[]
    side_effects: []

  - method: POST
    path: "/vessels/{vessel_id}/deficiencies/{deficiency_id}/begin-rectification"
    description: "Mark deficiency rectification started"
