      - name: proration_floor_share_then_capacity_ceiling_then_ranked_remainder
        claim_type: waterfall_allocation
        grounds:
          - calculations.receipt_proration
          - entities.AllocationLine.fields.capacity_capped_units
          - entities.AllocationLine.fields.presentation_gap_units
          - entities.AllocationRun.fields.unallocated_remainder_units
        distinguishing_aspect: |
          Six identical needs and a pool that cannot be divided evenly force all four declared steps to be
          observable at once and in the declared order. Every store needs 4 and the 12-unit pool floors to 2
          each (FLOOR(12 x 4 / 24) = 2, never ROUND, which would have said 2 as well but sum to 12 and hide
          the remainder loop); store 0106's shelf holds only 9 units against 8 on hand, so its capacity
          ceiling clips it to 1 in step 3; the single leftover unit then has to pick a winner among five
          equally deserving stores, which walks all three tie-breakers - residual need is tied at 2, so grade
          rank A beats B/C/D, and the two grade-A stores 0101 and 0105 are separated by store_code. The
          capacity-clipped store must be excluded from the remainder loop, because its cap is min(need,
          headroom), not need.
