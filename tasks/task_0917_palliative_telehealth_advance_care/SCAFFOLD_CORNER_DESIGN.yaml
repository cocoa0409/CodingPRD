  # =========================================================================
  # Endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: patient_sub_resource_referral_list_returns_only_that_patients_children
        claim_type: computed_read
        grounds:
          - endpoints["GET /palliative/patients/{id}/referrals"]
          - entities.Referral.fields.patient_id
        distinguishing_aspect: "The sub-resource list is the reverse-reachability path for Referral.patient_id and returns only the two referrals of the addressed patient, not the third referral belonging to another patient."
        test_recipe:
          setup:
            - "Two Patients in program_status REFERRED; patient A has two Referral rows and patient B has one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2042", full_name: "Rae Duval", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_a_id: $.data.id }
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2043", full_name: "Sol Nabil", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_2", opioid_status: "OPIOID_TOLERANT" }
