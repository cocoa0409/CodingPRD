            - call: "POST /ipa/physicians/${p_e12}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_e12}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_e12}/enrollees"
              payload: { external_member_id: "E12-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_e12: "$.data.id", e_e12_v: "$.data.version" }
          trigger:
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_e12}", physician_id: "${p_e12}", effective_date: "2026-01-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_e12_v}" }
              as: NetworkManager
