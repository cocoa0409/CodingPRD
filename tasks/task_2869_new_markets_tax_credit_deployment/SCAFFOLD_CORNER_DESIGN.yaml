  # ===========================================================================
  - section: calculations
    instances:
      - name: tract_distress_tier_stays_moderate_despite_a_distress_score_of_88_83
        claim_type: correct_result
        grounds:
          - calculations.tract_distress_profile
          - entities.CensusTract.fields.distress_tier
        distinguishing_aspect: "Score and tier are computed from disjoint inputs: poverty 28.00 / MFI 62.00 / unemployment 1.40 scores 88.83 but meets ZERO severe criteria (28 < 30, 62 > 60, 1.40 < 1.50), so the tier is MODERATE, not SEVERE. An implementation that derives the tier from the score alone gets this backwards."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
          trigger:
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000200", state_code: "MS", poverty_rate_pct: 28.00, mfi_ratio_pct: 62.00, unemployment_ratio: 1.40 }
              as: CertifyingAgency
              captures: { tract_id: $.data.id }
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000300", state_code: "MS", poverty_rate_pct: 30.00, mfi_ratio_pct: 70.00, unemployment_ratio: 1.20 }
              as: CertifyingAgency
              captures: { tract_high_id: $.data.id }
          assert:
            - "The first tract: is_low_income_community == true (poverty 28.00 >= 20)"
            - "The first tract: distress_score == 88.83 — 40 x min(1, 28/30) = 37.3333 plus 35 x min(1, 18/20) = 31.50 plus 25 x min(1, 0.40/0.5) = 20.00, rounded half-up at 2dp"
            - "The first tract: severe_criteria_met_count == 0, so distress_tier == \"MODERATE\" despite the 88.83 score"
            - "The second tract: distress_score == 67.50 and severe_criteria_met_count == 1 (poverty 30.00 >= 30), so distress_tier == \"HIGH\" — a LOWER score but a HIGHER tier than the first tract"
            - "Both tracts have eligible_for_qlici == true and qualifies_by_contiguity == false"

      - name: contiguous_tract_qualifies_at_exactly_15_percent_poverty_and_fails_at_14_99
        claim_type: constants_applied
        grounds:
          - calculations.tract_distress_profile
          - calculations.tract_distress_profile.constants
          - entities.CensusTract.fields.qualifies_by_contiguity
        distinguishing_aspect: "The contiguity path fires only for a non-LIC tract with a named contiguous LIC neighbour AND poverty >= 15.00. At exactly 15.00 the tract is eligible; at 14.99 the identical tract is INELIGIBLE, and the boundary is on poverty, not on the distress score (20.00 vs 19.87 — both far below any tier threshold)."
        test_recipe:
          setup:
            - "One SEVERE anchor tract (poverty 32.00 / MFI 55.00 / unemployment 1.80) to serve as the contiguous LIC neighbour."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
              captures: { anchor_tract_id: $.data.id }
          trigger:
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000400", state_code: "MS", poverty_rate_pct: 15.00, mfi_ratio_pct: 85.00, unemployment_ratio: 1.00, contiguous_lic_tract_id: "${anchor_tract_id}" }
              as: CertifyingAgency
              captures: { tract_at_id: $.data.id }
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000500", state_code: "MS", poverty_rate_pct: 14.99, mfi_ratio_pct: 85.00, unemployment_ratio: 1.00, contiguous_lic_tract_id: "${anchor_tract_id}" }
              as: CertifyingAgency
              captures: { tract_below_id: $.data.id }
          assert:
            - "AT the boundary — CensusTract.${tract_at_id}.is_low_income_community == false (15.00 < 20 and 85.00 > 80), qualifies_by_contiguity == true, eligible_for_qlici == true"
            - "CensusTract.${tract_at_id}.distress_score == 20.00 and severe_criteria_met_count == 0, so distress_tier == \"MODERATE\" (the eligible-but-no-severe-criteria floor)"
            - "BELOW the boundary — CensusTract.${tract_below_id}.qualifies_by_contiguity == false and eligible_for_qlici == false"
            - "CensusTract.${tract_below_id}.distress_score == 19.99 (40 x 14.99/30 = 19.98667 plus 0.00 plus 0.00, rounded half-up) is still reported, but distress_tier == \"INELIGIBLE\" because eligible_for_qlici is false — one hundredth of a point of poverty flips the tier while barely moving the score"
            - "The anchor tract itself is untouched: distress_tier == \"SEVERE\", qualifies_by_contiguity == false"

      - name: qalicb_eligibility_failed_prongs_are_listed_in_declaration_order
        claim_type: input_set_filtering
        grounds:
          - calculations.qalicb_eligibility_evaluation
          - entities.EligibilityTest.fields.failed_prongs
          - endpoints[POST /nmtc/qalicbs/{id}/eligibility-tests]
        distinguishing_aspect: "failed_prongs is an ordered projection over the six prongs in their declared order, not the order the failures were noticed and not sorted alphabetically: a submission that fails GROSS_INCOME and COLLECTIBLES reports exactly [\"GROSS_INCOME\", \"COLLECTIBLES\"]."
        test_recipe:
          setup:
            - "One PENDING QALICB in a SEVERE tract."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
              captures: { tract_id: $.data.id }
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${tract_id}", legal_name: "Delta Foods LLC", state_code: "MS", naics_code: "311412" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
              captures: { qalicb_id: $.data.id }
          trigger:
            - call: "POST /nmtc/qalicbs/${qalicb_id}/eligibility-tests"
              payload: { gross_income_lic_pct: 48.00, services_lic_pct: 65.00, tangible_property_lic_pct: 88.00, collectibles_pct: 6.00, nonqualified_financial_property_pct: 1.00, location_prong_passed: true }
              as: ComplianceReviewer
              as_user_id: "reviewer-eligibility"
              captures: { test_id: $.data.id }
          assert:
            - "HTTP 201 and EligibilityTest.${test_id}.result == \"FAIL\""
            - "failed_prongs == [\"GROSS_INCOME\", \"COLLECTIBLES\"] — exactly two entries, in declaration order, with the passing prongs omitted entirely"
            - "The passing inputs are still echoed: services_lic_pct == 65.00, tangible_property_lic_pct == 88.00, nonqualified_financial_property_pct == 1.00, location_prong_passed == true"
            - "QALICB.${qalicb_id}.eligibility_status == \"FAILED\" and consecutive_failed_test_count == 1, last_certified_at == null"
            - "EligibilityTest.${test_id}.performed_at == \"2026-08-01T00:00:00.000Z\", performed_by_user_id == \"reviewer-eligibility\", and the row has no version field"

      - name: recapture_exposure_at_year_three_on_a_500m_qei_is_81750000_after_a_missed_cure
        claim_type: precision
        grounds:
          - calculations.recapture_exposure
          - calculations.recapture_exposure.constants
          - state_machines.QEI.compliance_status
        distinguishing_aspect: "Exposure uses the CUMULATIVE credit basis-point table for the year the recapture is DECLARED, with interest computed in a second independent round_half_up step: 500,000,000 x 1500bps = 75,000,000 claimed plus round(75,000,000 x 300 x 3 / 10000) = 6,750,000 interest = 81,750,000. It also shows that a FAIL inside the cure window keeps the QEI AT_RISK rather than escalating."
