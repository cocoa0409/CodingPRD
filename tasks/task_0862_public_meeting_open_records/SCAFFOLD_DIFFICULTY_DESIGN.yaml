      - name: appeal_file_requires_request_denied
        grounds:
          - state_machines.Appeal.initial_state
          - state_machines.RecordsRequest.RECEIVED_to_UNDER_REVIEW
        distinguishing_aspect: "Filing an Appeal is rejected with ERR_REQUEST_NOT_DENIED while the parent RecordsRequest is still UNDER_REVIEW; the Appeal's creation depends on the RecordsRequest entity's state (pair Appeal->RecordsRequest, different from the AgendaItem->Meeting pair)."
        test_recipe:
