              as: Contractor
          assert:
            - "AuxiliarySystem.${auxA}.status == COMMISSIONED"
            - "AuxiliarySystem.${auxB}.status == COMMISSIONED, so two overlapping outages are legal"
            - "the first trigger call returns 409 ERR_OUTAGE_CONCURRENCY_EXCEEDED"
            - "AuxiliarySystem.${auxC}.status == PROPOSED after the refused commissioning"
            - "AuxiliarySystem.${auxC}.outage_start_at == null after the refused commissioning"
            - "AuxiliarySystem.${auxC}.outage_end_at == null after the refused commissioning"
            - "the second trigger call returns 200"
