        distinguishing_aspect: "Cancel decrements ytd_volume_cents but Account.tier does NOT recompute downward: account that crossed ELITE stays ELITE after the cancelling invoice is removed."
        test_recipe:
          setup: ["branch; account; product base 2000000 lot 1; order confirmed+invoiced (tier → ELITE); then order cancelled — but cancel requires CONFIRMED; invoiced order has payment INVOICED while fulfillment CONFIRMED — cancel is allowed (fulfillment gate only)"]
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: false, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-26", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "HEATER-B", product_family: "EQUIPMENT", base_price_cents: 2000000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L1", qty_on_hand: 1 }
              as: WarehouseLead
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T13:00:00Z", lines: [ { product_id: "${prod_id}", qty: 1 } ] }
              as: CounterRep
              captures: { ord_id: $.data.id }
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
            - call: "POST /pool-supply/orders/${ord_id}/invoice"
              payload: {}
              as: BranchManager
            - call: "GET /pool-supply/accounts/${acct_id}"
              as: BranchManager
              captures: { tier_mid: $.data.tier }
          trigger:
            - call: "POST /pool-supply/orders/${ord_id}/cancel"
              payload: {}
              as: BranchManager
            - call: "GET /pool-supply/accounts/${acct_id}"
              as: BranchManager
              captures: { tier_end: $.data.tier, ytd_end: $.data.ytd_volume_cents }
          assert:
            - "${tier_mid} == ELITE (crossed exactly at 2000000)"
            - "${ytd_end} == 0 after cancel"
            - "${tier_end} == ELITE — ratchet holds; tier never recomputes downward"
  # ===========================================================================
