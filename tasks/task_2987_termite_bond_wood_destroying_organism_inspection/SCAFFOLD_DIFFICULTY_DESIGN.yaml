            - "the second term-review at 2027-12-31 drives Bond.${bond1} to TERMINATED, because 2027-12-31 is strictly after lapse_date 2027-10-01 + REINSTATEMENT_WINDOW_DAYS 90 == 2027-12-30"
            - "attempt 3, byte-identical to attempts 1 and 2, now returns 201 — the interval closed at the TERMINATED transition and not one day earlier"
            - "the 2027-12-30 boundary is the interval's real right edge: a term-review dated 2027-12-30 would have left the bond LAPSED and attempt 3 would still have been refused"
            - "bond2 carries current_term_start 2027-12-31, current_term_end 2028-12-30, base_premium_usd 194.40 and repair_liability_cap_usd 11664.00, and it is the property's only ACTIVE bond"
            - "GET /bonds?property_id=${p1} returns total_count 2 with exactly one row in status TERMINATED and one in status ACTIVE — capacity 1 over {ACTIVE, LAPSED} was never breached"
            - "the two rejections created no Bond row and did not advance TreatmentPlan.${plan1b}.version, so the losing plan remains COMPLETED and bondable"
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: repair_cap_money_conservation_across_reserve_release_and_settlement
        grounds:
          - calculations.repair_liability_conservation
          - calculations.claim_payout_waterfall
          - entities.Bond.claims_paid_to_date_usd
          - entities.Bond.reserved_claim_amount_usd
          - entities.Bond.remaining_repair_cap_usd
          - endpoints[POST /damage-claims/{id}/attach-verification]
          - endpoints[POST /damage-claims/{id}/withdraw]
          - endpoints[POST /damage-claims/{id}/adjudicate]
        distinguishing_aspect: |
          Conserved quantity: MONEY — repair_liability_cap_usd == claims_paid_to_date_usd +
          reserved_claim_amount_usd + remaining_repair_cap_usd, an exact 2-decimal identity that must
          hold after every single request. The compensating pair is reserve (attach-verification) and
          release (withdraw): the release must return exactly the amount reserved, so two full
          reserve/withdraw cycles leave the bond bit-identical to its issued state, and only the
          settled claim moves money between the paid and reserved buckets.
        test_recipe:
          setup:
            - "P1 bonded 2026-09-01 from plan1 (quote 1080.00), so repair_liability_cap_usd is 11664.00, claims_paid_to_date_usd 0.00, reserved_claim_amount_usd 0.00, remaining_repair_cap_usd 11664.00."
            - "The bond is issued by X-User-ID mgr-1 so that adjudication by adj-1 does not trip segregation of duties."
            - "A single GRAPHED verification graph insv (which supersedes nothing, so exclusion_basis is AGGREGATE_PRORATION) carries two DAMAGE cells: A2 severity 3 pre_existing false at 3000.00 and A3 severity 1 pre_existing true at 1000.00."
            - "Every claim below is filed for exactly 4000.00 REPAIR and therefore reserves exactly 2790.00: eligible 3000.00, deductible 210.00 at the 0.07 tier, net 2790.00, headroom-capped at 11664.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Dale Ortiz", license_number: "FL-10002", license_state: "FL", license_categories: ["TERMITE_APPLICATOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insa: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins1: $.data.id }
            - call: "POST /inspections/${ins1}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /treatment-plans"
              payload: { property_id: "${p1}", inspection_id: "${ins1}", applicator_id: "${insa}", method: "LIQUID_BARRIER", chemical_product_code: "FIPRO_9" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { plan1: $.data.id }
            - call: "POST /treatment-plans/${plan1}/approve"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "GET /treatment-plans/${plan1}"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { pv1: $.data.version }
            - call: "POST /treatment-plans/${plan1}/applications"
              payload: { product_epa_number: "432-1234", gallons_applied: 190.00, concentration_pct: 0.06, expected_treatment_plan_version: "${pv1}" }
              as: Applicator
              as_user_id: "${insa}"
            - call: "POST /treatment-plans/${plan1}/complete"
              payload: {}
              as: Applicator
              as_user_id: "${insa}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bonds"
              payload: { property_id: "${p1}", treatment_plan_id: "${plan1}", coverage_tier: "REPAIR_AND_RETREAT", conducive_waiver_codes: [] }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { bond1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "REAL_ESTATE", closing_date: "2027-06-30", scheduled_start_at: "2026-10-01T13:00:00Z", scheduled_end_at: "2026-10-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { insv: $.data.id }
            - call: "POST /inspections/${insv}/findings"
              payload: { finding_type: "DAMAGE", grid_ref: "A2", organism: "SUBTERRANEAN_TERMITE", severity: 3, damage_estimate_usd: 3000.00, pre_existing: false }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${insv}/findings"
              payload: { finding_type: "DAMAGE", grid_ref: "A3", organism: "SUBTERRANEAN_TERMITE", severity: 1, damage_estimate_usd: 1000.00, pre_existing: true }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${insv}/graph-complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insb}"
          trigger:
            - call: "GET /bonds/${bond1}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { bv1: $.data.version }
            - call: "POST /damage-claims"
              payload: { bond_id: "${bond1}", claim_type: "REPAIR", claimed_damage_usd: 4000.00, expected_bond_version: "${bv1}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { c1: $.data.id }
            - call: "POST /damage-claims/${c1}/attach-verification"
              payload: { verifying_inspection_id: "${insv}" }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /damage-claims/${c1}/withdraw"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
            - call: "GET /bonds/${bond1}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { bv2: $.data.version }
            - call: "POST /damage-claims"
              payload: { bond_id: "${bond1}", claim_type: "REPAIR", claimed_damage_usd: 4000.00, expected_bond_version: "${bv2}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { c2: $.data.id }
            - call: "POST /damage-claims/${c2}/attach-verification"
              payload: { verifying_inspection_id: "${insv}" }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /damage-claims/${c2}/withdraw"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
            - call: "GET /bonds/${bond1}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { bv3: $.data.version }
            - call: "POST /damage-claims"
              payload: { bond_id: "${bond1}", claim_type: "REPAIR", claimed_damage_usd: 4000.00, expected_bond_version: "${bv3}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { c3: $.data.id }
            - call: "POST /damage-claims/${c3}/attach-verification"
              payload: { verifying_inspection_id: "${insv}" }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /damage-claims/${c3}/adjudicate"
              payload: { decision: "APPROVE_REPAIR" }
              as: ClaimsAdjudicator
              as_user_id: "adj-1"
          assert:
            - "checkpoint 0 (at issuance): 11664.00 == 0.00 + 0.00 + 11664.00"
            - "checkpoint 1 (c1 filed, still SUBMITTED): the identity is unchanged at 11664.00 == 0.00 + 0.00 + 11664.00 — a SUBMITTED claim reserves nothing"
            - "checkpoint 2 (c1 verified): reserved_claim_amount_usd == 2790.00, remaining_repair_cap_usd == 8874.00, claims_paid_to_date_usd == 0.00, and 11664.00 == 0.00 + 2790.00 + 8874.00"
            - "checkpoint 3 (c1 withdrawn): the release equals the reserve exactly — reserved 0.00 and remaining 11664.00, byte-identical to checkpoint 0 with no 0.01 residue"
            - "checkpoint 4 (c2 verified) reserves the same 2790.00 and checkpoint 5 (c2 withdrawn) returns to 11664.00 again: two full compensation cycles produce zero cumulative drift"
            - "DamageClaim.${c1} and ${c2} are WITHDRAWN with approved_payout_usd 0.00, yet each still carries its priced projected_payout_usd 2790.00 — the released reserve is not achieved by zeroing the claim's arithmetic"
            - "checkpoint 6 (c3 verified): 11664.00 == 0.00 + 2790.00 + 8874.00"
            - "checkpoint 7 (c3 APPROVE_REPAIR): the money moves bucket-to-bucket, not in or out — claims_paid_to_date_usd == 2790.00, reserved_claim_amount_usd == 0.00, remaining_repair_cap_usd == 8874.00, and 11664.00 == 2790.00 + 0.00 + 8874.00"
            - "repair_liability_cap_usd is 11664.00 at every one of the eight checkpoints: the invariant's left-hand side is frozen for the life of the bond"
            - "the withdrawn claims are excluded from both aggregates: sum of approved_payout_usd over APPROVED_REPAIR claims == 2790.00 == claims_paid_to_date_usd, and no UNDER_ADJUDICATION claim remains to back the 0.00 reserve"

      - name: conducive_condition_count_conservation_across_waiver_and_termination
        grounds:
          - calculations.conducive_condition_ledger
          - entities.Property.total_conducive_condition_count
          - entities.Property.waived_conducive_condition_count
          - entities.Property.open_conducive_condition_count
          - state_machines.Bond.LAPSED_to_TERMINATED
          - endpoints[POST /bonds]
        distinguishing_aspect: |
          A different conserved quantity in a different unit: an INTEGER COUNT of distinct conducive
          codes, where open + waived == total must hold for every Property after every request. The
          compensating pair is also different — issuance SUPPRESSES conditions by intersecting the
          waiver set, and the bond's LAPSED -> TERMINATED transition RESTORES them by removing the
          suppressor, all without the total ever moving. Money is not involved anywhere.
        test_recipe:
          setup:
            - "One FL SLAB property P1 whose INITIAL graph carries three CONDUCIVE_CONDITION cells over two DISTINCT codes: A1 EXCESS_MOISTURE, B3 WOOD_TO_GROUND and C5 EXCESS_MOISTURE again."
            - "The ledger deduplicates by code, so total_conducive_condition_count is 2 while Inspection.conducive_condition_count (counted per row) is 3."
            - "The bond is issued with conducive_waiver_codes [EXCESS_MOISTURE, FAULTY_GRADE]: only one of the two waived codes is actually present on the graph."
            - "The bond then lapses (term-review 2027-10-05) and is terminated (term-review 2027-12-31, one day past the 2027-12-30 reinstatement deadline)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Dale Ortiz", license_number: "FL-10002", license_state: "FL", license_categories: ["TERMITE_APPLICATOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insa: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins1: $.data.id }
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "A1", conducive_code: "EXCESS_MOISTURE", severity: 2 }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "B3", conducive_code: "WOOD_TO_GROUND", severity: 1 }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "C5", conducive_code: "EXCESS_MOISTURE", severity: 3 }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${ins1}/graph-complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /treatment-plans"
              payload: { property_id: "${p1}", inspection_id: "${ins1}", applicator_id: "${insa}", method: "LIQUID_BARRIER", chemical_product_code: "FIPRO_9" }
              as: BranchManager
              captures: { plan1: $.data.id }
            - call: "POST /treatment-plans/${plan1}/approve"
              payload: {}
              as: BranchManager
            - call: "GET /treatment-plans/${plan1}"
              payload: {}
              as: BranchManager
              captures: { pv1: $.data.version }
            - call: "POST /treatment-plans/${plan1}/applications"
              payload: { product_epa_number: "432-1234", gallons_applied: 190.00, concentration_pct: 0.06, expected_treatment_plan_version: "${pv1}" }
              as: Applicator
              as_user_id: "${insa}"
            - call: "POST /treatment-plans/${plan1}/complete"
              payload: {}
              as: Applicator
              as_user_id: "${insa}"
          trigger:
            - call: "GET /properties/${p1}"
              payload: {}
              as: ComplianceOfficer
              captures: { pre_total: $.data.total_conducive_condition_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bonds"
              payload: { property_id: "${p1}", treatment_plan_id: "${plan1}", coverage_tier: "REPAIR_AND_RETREAT", conducive_waiver_codes: ["EXCESS_MOISTURE", "FAULTY_GRADE"] }
              as: BranchManager
              captures: { bond1: $.data.id }
            - call: "GET /properties/${p1}"
              payload: {}
              as: ComplianceOfficer
              captures: { mid_waived: $.data.waived_conducive_condition_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-10-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bonds/${bond1}/term-review"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /properties/${p1}"
              payload: {}
