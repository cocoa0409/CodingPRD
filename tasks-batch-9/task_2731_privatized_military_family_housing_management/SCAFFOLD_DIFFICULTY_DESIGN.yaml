  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # Three instances, three DIFFERENT error-category pairs from §1.4:
  #   5.1  state (P22)              vs business_fiscal (P45)
  #   5.2  business_referential(P32) vs business_constraint (P39)
  #   5.3  state (P24)              vs business_safety (P29)
  # Each recipe violates both members of its pair in ONE request and pins the
  # response to the numerically lower priority.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: lease_state_gate_outranks_bah_rate_fiscal_gate
        grounds:
          - validations[priority=22]
          - validations[priority=45]
          - endpoints.POST_/leases
          - calculations.gross_rent_determination
          - state_machines.WaitlistApplication.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Pair (state, business_fiscal): the request to create a lease violates
          BOTH priority 22 ERR_APPLICATION_NOT_ACCEPTED (the application is
          still OFFERED, never accepted) AND priority 45
          ERR_BAH_RATE_NOT_ON_FILE (no BahRate row exists at all, so the
          OFFER_PROVISIONAL variant of gross_rent_determination cannot resolve
          a rate). The ladder must return the state error, not the fiscal one,
          and must not create the lease. This is the state/fiscal pair; the
          other two instances of this rule use disjoint category pairs.
        test_recipe:
          setup:
            - "One installation with bill_of_rights_version 2026.1. NO BahRate row is ever created, so the priority 45 fiscal gate is armed."
            - "One 2-bedroom TOWNHOME unit designated JUNIOR_ENLISTED and one E5 sponsor with three full-time-custody dependents, so bedroom_eligibility is 2 and rank_category is JUNIOR_ENLISTED and the priority 37 / 38 constraint checks both pass."
            - "The clock stands at 2026-08-25T00:00:00Z. A waitlist offer run has offered the unit to the application, so the application is OFFERED (priority 22 armed) and the unit is ASSIGNED (priority 23 passes)."
            - "No prior lease has ever existed on the unit, so last_lease_end_date is null and the priority 41 turn-buffer check passes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
