              as: RightsAdministrator
              captures: { tb_id: $.data.id }
            - call: "POST /talents/${tb_id}/death-record"
              payload: { date_of_death: "2026-07-01T00:00:00Z" }
              as: RightsAdministrator
            - call: "POST /talents/${tb_id}/estate-authorities"
              payload: { executor_name: "Haddad Estate LLC", court_document_ref: "NY-SURR-2026-0442", registration_number: "CA-REG-77" }
              as: RightsAdministrator
              as_user_id: "ra-001"
              captures: { eb_id: $.data.id }
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { ta_id: $.data.id }
            - call: "POST /infringement-cases"
              payload: { talent_id: "${ta_id}", detection_source: "MONITORING_FEED", suspect_url: "https://pirate.example/viral", detected_channel: "ADVERTISING", detected_state_code: "CA", detected_view_count: 10000000, match_confidence: 1.000 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { c_id: $.data.id }
            - call: "POST /infringement-cases/${c_id}/triage"
              payload: { decision: "ISSUE_TAKEDOWN" }
              as: ComplianceOfficer
              as_user_id: "co-001"
          trigger:
            - call: "POST /estate-authorities/${eb_id}/verify"
              payload: {}
              as: RightsAdministrator
              as_user_id: "ra-001"
            - call: "POST /estate-authorities/${eb_id}/verify"
              payload: {}
              as: RightsAdministrator
              as_user_id: "ra-002"
            - call: "POST /infringement-cases/${c_id}/escalate"
