            - "no LeaveEvent row exists with employee_id == ${emp_id}"
            - "Employee.${emp_id}.unpaid_leave_days_ytd == 0"
            - "Employee.${emp_id}.employment_status == ACTIVE"

      - name: corner_certified_payment_date_in_future_rejected
        claim_type: Temporal validation
        grounds:
