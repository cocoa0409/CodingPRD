  - rule_id: boundary_precision_check
    instances:

      - name: reopen_exactly_at_reopen_eligible_at_succeeds
        grounds:
          - validations[priority=51]
          - validations[priority=61]
          - state_machines.GrowingArea.CLOSED_RAINFALL_to_OPEN
          - calculations.area_reopen_eligibility
          - entities.GrowingArea.fields.closure_reopen_eligible_at
        distinguishing_aspect: |
          An INSTANT-EQUALITY boundary: the clock sits at exactly closure_reopen_eligible_at
          2026-08-09T00:00:00Z, i.e. observed_at + rainfall_closure_hours 96 to the second, and the
          comparison is inclusive so the reopen succeeds; one second earlier the same call is
          ERR_REOPEN_TOO_EARLY.
        test_recipe:
          setup:
            - "GrowingArea GA-114 with rainfall_closure_threshold_in 1.00, rainfall_closure_hours 96, reopen_sample_count_required 3, clean_sample_mpn_limit 14.0."
            - "A 1.50-inch RainfallEvent observed exactly 2026-08-05T00:00:00Z closed the area: harvest_status CLOSED_RAINFALL, last_closure_started_at 2026-08-05T00:00:00Z, closure_reopen_eligible_at 2026-08-09T00:00:00Z."
            - "Three ACCEPTED WaterSamples of fecal_coliform_mpn 5 collected 2026-08-06, 2026-08-07 and 2026-08-08, all strictly after the closure instant, so consecutive_clean_samples == 3 == reopen_sample_count_required."
            - "accepted_sample_count == 3, below MIN_SAMPLES_FOR_DECISION 5, so eligible_classification is INSUFFICIENT_DATA and no sample sweep can fire."
            - "Logical clock advanced to exactly 2026-08-09T00:00:00Z immediately before the trigger."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/growing-areas/${area}/rainfall-events"
              payload: { gauge_code: "RG-7", observed_at: "2026-08-05T00:00:00Z", inches_24h: 1.5 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T12:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-08-06T09:00:00Z", fecal_coliform_mpn: 5, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-08-07T09:00:00Z", fecal_coliform_mpn: 5, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-08-08T09:00:00Z", fecal_coliform_mpn: 5, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: ShellfishControlAuthority
          trigger:
            - call: "POST /shellfish/growing-areas/${area}/reopen"
              payload: { reopen_note: "96 hours elapsed, three clean samples" }
              as: ShellfishControlAuthority
          assert:
            - "HTTP 200 and GrowingArea.${area}.harvest_status == OPEN"
            - "GrowingArea.${area}.consecutive_clean_samples == 0 (reset by the reopen)"
            - "GrowingArea.${area}.closure_reopen_eligible_at == null"
            - "GrowingArea.${area}.last_closure_started_at == 2026-08-05T00:00:00Z is retained for the audit trail"
            - "GrowingArea.${area}.classification == APPROVED and eligible_classification == INSUFFICIENT_DATA"
            - "GrowingArea.${area}.accepted_sample_count == 3"
            - "With the clock at 2026-08-08T23:59:59Z instead, the same call returns HTTP 409 with data.error_id == ERR_REOPEN_TOO_EARLY"

