  # =========================================================================
  # RULE 3 — non_linear_state_machine
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: proposal_revision_cycle_round_two_prunes_non_durable_evidence
        grounds:
          - state_machines.ContributionProposal.DESIGN_CRITIQUE_to_CHANGES_REQUESTED
          - state_machines.ContributionProposal.CHANGES_REQUESTED_to_DESIGN_CRITIQUE
          - calculations.required_evidence_kinds
          - entities.ContributionProposal.fields.revision_round
          - entities.ContributionProposal.fields.submitted_evidence_kinds
        distinguishing_aspect: |
          The proposal machine is CYCLIC on the ContributionProposal entity: DESIGN_CRITIQUE ->
          CHANGES_REQUESTED -> DESIGN_CRITIQUE re-enters a state already visited while
          revision_round advances 1 -> 2 and submitted_evidence_kinds is pruned to the
          ROUND_DURABLE_KINDS intersection ["DOC_PAGE"], so the loop is not idempotent.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`, TokenSet `core-foundations`, Component `stepper` EXPERIMENTAL with no implementations (coverage_state NONE, so PLATFORM_PARITY is not required)"
            - "one NEW_COMPONENT proposal submitted once (revision_round 1, state DESIGN_CRITIQUE) with all four required evidence kinds filed"
            - "the design-critique reviewer has returned REQUEST_CHANGES, leaving the proposal in CHANGES_REQUESTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/token-sets"
              payload: { name: "Core Foundations 2026", slug: "core-foundations", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Stepper", slug: "stepper", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/contribution-proposals"
              payload: { title: "Introduce Stepper", author_team_id: "${team_id}", target_component_id: "${comp_id}", pinned_token_set_id: "${ts_id}", proposal_kind: "NEW_COMPONENT", touches_public_api: true }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /design-system/contribution-proposals/${prop_id}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { round_1: $.data.revision_round, req_1: $.data.required_evidence_kinds }
            - call: "POST /design-system/contribution-proposals/${prop_id}/acceptance-evidence"
              payload: { evidence_kinds: ["A11Y_AUTOMATED", "A11Y_MANUAL", "DOC_PAGE", "TOKEN_COMPLIANCE"], evidence_url: "https://ds.example.com/evidence/stepper-r1" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { submitted_1: $.data.submitted_evidence_kinds }
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
              payload: { stage: "DESIGN_CRITIQUE", verdict: "REQUEST_CHANGES", notes: "Tighten the spacing rhythm before engineering review." }
              as: DesignCritiqueReviewer
              as_user_id: "critic-1"
              captures: { rr_state: $.data.resulting_proposal_state, rr_round: $.data.revision_round }
          trigger:
            - call: "POST /design-system/contribution-proposals/${prop_id}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { round_2: $.data.revision_round, state_2: $.data.state, submitted_2: $.data.submitted_evidence_kinds, req_2: $.data.required_evidence_kinds }
          assert:
            - "${round_1} == 1"
            - "${req_1} == [\"A11Y_AUTOMATED\", \"A11Y_MANUAL\", \"DOC_PAGE\", \"TOKEN_COMPLIANCE\"]"
            - "${submitted_1} == [\"A11Y_AUTOMATED\", \"A11Y_MANUAL\", \"DOC_PAGE\", \"TOKEN_COMPLIANCE\"]"
            - "${rr_state} == CHANGES_REQUESTED and ${rr_round} == 1"
            - "${round_2} == 2 and ${state_2} == DESIGN_CRITIQUE"
            - "${submitted_2} == [\"DOC_PAGE\"]"
            - "${req_2} == [\"A11Y_AUTOMATED\", \"A11Y_MANUAL\", \"DOC_PAGE\", \"TOKEN_COMPLIANCE\"]"
            - "ContributionProposal.${prop_id}.state == DESIGN_CRITIQUE (the machine re-entered a state it had already left)"

      - name: implementation_ship_block_reship_cycle_via_dependency_repin
        grounds:
          - state_machines.PlatformImplementation.PLANNED_to_SHIPPED
          - state_machines.PlatformImplementation.SHIPPED_to_BLOCKED
          - state_machines.PlatformImplementation.BLOCKED_to_SHIPPED
          - entities.PlatformImplementation.fields.blocked_reason
          - entities.ComponentDependency.fields.compatibility_state
          - endpoints["PUT /design-system/component-dependencies/{id}"]
        distinguishing_aspect: |
          A cycle on a DIFFERENT entity and a different dimension from the proposal cycle:
          PlatformImplementation.status returns to SHIPPED only after the consumer re-pins its
          ComponentDependency, so re-entering SHIPPED requires an external repair on a third
          entity rather than a resubmission of the same resource, and blocked_reason moves
          NONE -> UPSTREAM_BREAKING_CHANGE -> NONE across the loop.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; TokenSet `core-foundations`; DRAFT Release with semver_base 1.0.0"
            - "provider Component `icon-set` and consumer Component `menu-button`, both EXPERIMENTAL / ACTIVE"
            - "the consumer has a WEB PlatformImplementation with zero-defect AA evidence, SHIPPED, and one COMPATIBLE ComponentDependency pinned to provider major 1"
            - "a BREAKING_CHANGE proposal on the provider has been accepted, so the provider is at current_major_version 2, the dependency is INCOMPATIBLE, the consumer's blocked_dependency_count is 1 and its implementation is BLOCKED with blocked_reason UPSTREAM_BREAKING_CHANGE"
            - "the dependency has then been re-pinned to provider major 2, returning it to COMPATIBLE and the consumer's blocked_dependency_count to 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
