              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "FB", description: "Flat car, bulkhead", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { fb_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
            - call: "POST /car-hire/embargo-orders"
              payload: { issuing_road_id: "${cx_id}", junction_id: "${jct_id}", car_type_id: "${xm_id}", effective_from: "2026-08-20T00:00:00Z", effective_to: "2026-08-22T00:00:00Z", reason: "E1 yard congestion" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
              captures: { e1_id: "$.data.id" }
          trigger:
            - call: "POST /car-hire/embargo-orders"
              payload: { issuing_road_id: "${cx_id}", junction_id: "${jct_id}", car_type_id: "${xm_id}", effective_from: "2026-08-22T00:00:00Z", effective_to: "2026-08-23T00:00:00Z", reason: "E2 touching E1 effective_to" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
            - call: "POST /car-hire/embargo-orders"
              payload: { issuing_road_id: "${cx_id}", junction_id: "${jct_id}", car_type_id: "${xm_id}", effective_from: "2026-08-22T12:00:00Z", effective_to: "2026-08-23T00:00:00Z", reason: "E3 inside the cooling gap" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
            - call: "POST /car-hire/embargo-orders"
              payload: { issuing_road_id: "${cx_id}", junction_id: "${jct_id}", car_type_id: "${xm_id}", effective_from: "2026-08-23T00:00:00Z", effective_to: "2026-08-24T00:00:00Z", reason: "E4 exactly 24 hours after E1" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
              captures: { e4_id: "$.data.id" }
            - call: "POST /car-hire/embargo-orders"
              payload: { issuing_road_id: "${cx_id}", junction_id: "${jct_id}", car_type_id: "${fb_id}", effective_from: "2026-08-22T00:00:00Z", effective_to: "2026-08-23T00:00:00Z", reason: "E5 different car type, same junction and window as E2" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
              captures: { e5_id: "$.data.id" }
          assert:
            - "E2 (starts exactly at E1.effective_to): HTTP 409 with error_id == ERR_EMBARGO_WINDOW_CONFLICT — closed intervals intersect at the shared instant"
            - "E3 (starts 12 hours after E1.effective_to, intervals disjoint): HTTP 409 with error_id == ERR_EMBARGO_WINDOW_CONFLICT — the 24-hour cooling gap alone rejects it"
            - "E4 (starts exactly 24 hours after E1.effective_to): HTTP 201, EmbargoOrder.${e4_id}.status == ACTIVE"
            - "E5 (same junction and window as the rejected E2 but car_type_id FB): HTTP 201 — the conflict is scoped to (junction_id, car_type_id)"
            - "GET /car-hire/embargo-orders?junction_id=${jct_id}&car_type_id=${xm_id} returns exactly 2 rows (${e1_id} and ${e4_id})"
            - "contrast with the reclaim instance of this rule: identical touching endpoints are ACCEPTED there and REFUSED here"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: reclaim_withdraw_restores_cycle_money_exactly_and_ledger_sums_to_pre_fee_net
        grounds:
          - state_machines.ReclaimClaim.ALLOWED_to_WITHDRAWN
          - calculations.reclaim_credit_allocation
          - calculations.clearinghouse_fee
          - calculations.settlement_statement
          - entities.HireLedgerEntry.fields.entry_type
          - entities.HireLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Allowing then withdrawing one reclaim must leave the system byte-identical in
          money terms: pre_fee_net_cents returns from 8621 to exactly 11464 and
          clearinghouse_fee_cents from 43 back to exactly 57 — no one-cent drift from
          re-rounding the fee on a re-derived basis. The compensation is auditable rather
          than silent: a RECLAIM_CREDIT entry of -2843 and a RECLAIM_REVERSAL entry of
          +2843 both survive, so SUM(amount_cents) over the cycle's non-SETTLEMENT_PAYMENT
          entries equals 11464 + (-2843) + 2843 == 11464 == pre_fee_net_cents, and
          reopen_count stays 0 because the cycle never reached SETTLED. This instance
          conserves MONEY; the other compensating_invariant instance conserves TIME.
        test_recipe:
          setup:
            - "Railroads BN and CX ACTIVE; car type XM; junction JCT-CHI."
