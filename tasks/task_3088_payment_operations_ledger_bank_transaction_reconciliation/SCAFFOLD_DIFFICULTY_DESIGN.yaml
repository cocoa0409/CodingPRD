      assert:
      - after resolving the second leg Ledger.delivered_fee_transfers_cents + Ledger.undeliverable_cents == 50 exactly
      - the ledger's posted_balance_cents is unchanged by the fee transfer, so the invariant is not a balance identity
      - reversing the second leg's re-credit pops the quantity back to 25 rather than leaving it at 50 or dropping
        to 0
- rule_id: compensating_invariant
  instances:
  - name: double_entry_identity_returns_to_baseline_after_compensation
    grounds:
    - calculations.ledger_double_entry_identity
    - entities.Transaction.fields.reverses_transaction_id
    - entities.Transaction.fields.lifecycle_status
    - entities.Ledger.fields.pending_balance_cents
    - endpoints.POST_/ledgers/{ledgerId}/recompute
    distinguishing_aspect: 'The conserved quantity is a signed balance in whole cents: credits_cents - debits_cents
      equals posted_balance_cents + pending_balance_cents at every reachable state, so a 6400-cent CREDIT posting
      moves the quantity by +6400 and the compensating 6400-cent REVERSAL entry restores it exactly, leaving neither
      pending nor posted drift.'
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z. One 6400-cent CREDIT entry is POSTED and UNSETTLED, so the conserved
        quantity stood at 6400 with pending_balance_cents == 6400 before the compensation.
