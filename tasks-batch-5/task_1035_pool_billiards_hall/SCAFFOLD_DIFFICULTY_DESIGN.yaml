              payload: { member_id: "${o1m}", table_id: "${o1t}", start_at: "2026-07-07T11:05:00Z", end_at: "2026-07-07T12:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { erro1: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_TABLE_TIME_CONFLICT"

      - name: event_aggregate_capacity_only_one_free_table
        grounds:
          - validations[priority=9]
          - errors[ERR_EVENT_CAPACITY_UNAVAILABLE]
          - state_machines.Event
        distinguishing_aspect: "An event asking for 2 tables over a window in which only 1 of the 2 ACTIVE tables is free (the other holds a CONFIRMED reservation) is rejected — aggregate-capacity-across-the-pool interval semantics, a different geometry and resource (Event) than the pairwise buffered check."
        test_recipe:
          setup:
            - "Exactly two ACTIVE tables; table T1 has a CONFIRMED reservation 2026-07-08T10:00-12:00; an INQUIRY event for 2 tables over that same window."
          setup_api_calls:
            - call: "POST /v1/plans"
