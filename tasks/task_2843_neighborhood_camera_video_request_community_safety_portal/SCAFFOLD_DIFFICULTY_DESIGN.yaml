      - name: video_request_lifecycle_and_compliance_dimensions_advance_independently
        grounds:
          - state_machines.VideoRequest.lifecycle_state
          - state_machines.VideoRequest.compliance_state
          - entities.VideoRequest.fields.lifecycle_state
          - entities.VideoRequest.fields.compliance_state
          - complexity_profile.state_machine_shape
          - endpoints[POST /neighborhood-safety/video-requests/{id}/audit-review]
        distinguishing_aspect: |
          A different entity carries two INDEPENDENT state dimensions on one row: the
          compliance dimension reaches its terminal AUDIT_ESCALATED while the lifecycle
          dimension is still mid-flight in SOLICITING, and the lifecycle dimension then walks
          all the way to its terminal FULFILLED without moving the compliance dimension at
          all. Neither machine's terminal state locks the other, and one trigger (submit)
          advances BOTH dimensions in a single call (DRAFT -> SOLICITING and
          JUSTIFICATION_LOGGED -> AUDIT_FLAGGED) — so a single-state-column implementation
          cannot represent the combined state.
