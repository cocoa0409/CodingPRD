              captures: { score_start: "$.data.readiness_score_start_basis", score_full: "$.data.readiness_score_full_term_basis" }
            - call: "POST /assignments/${asg_id}/activate"
              as: Recruiter
          assert:
            - "CredentialPacket.${pkt_id}.readiness_score_start_basis == 100 and blocking_item_count_start_basis == 0"
            - "CredentialPacket.${pkt_id}.readiness_score_full_term_basis == 80 and blocking_item_count_full_term_basis == 1"
            - "CredentialPacket.${pkt_id}.status == CLEARED (the START_DATE_BASIS variant admitted clearance)"
            - "POST /assignments/${asg_id}/activate responds 422 with error_id ERR_PACKET_NOT_CLEARED"
            - "Assignment.${asg_id}.staffing_status is still PENDING_START and compliance_status is CLEARED (no side effects on the rejected activation)"

  # =========================================================================
  # Rule 2 - Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: weekly_pay_cost_rounds_per_line_before_summation_mode_b
        grounds:
          - calculations.weekly_pay_cost
          - calculations.weekly_hour_classification
          - entities.EarningsStatement.fields.taxable_wages_cents
          - entities.Timesheet.fields.overtime_hours
        distinguishing_aspect: |
          MODE (b) - nested rounding where ORDER decides the cent. At pay rate
          3333 c/h with 36.50 regular and 1.00 overtime hours the per-line order
          gives 121655 + 5000 = 126655 taxable cents, while summing the raw
          products (121654.50 + 4999.50 = 126654.00) and rounding once gives
          126654. The scaffold pins per-line-then-sum, so 126655 is correct.
        test_recipe:
          setup:
            - "Same facility/locality/clinician bootstrap, but the assignment carries base_pay_rate_cents_per_hour 3333 and bill_rate_cents_per_hour 14000 over 13 weeks."
            - "Assignment ACTIVE (contract executed, packet cleared with all five required items valid to 2027-12-31)."
            - "Logical clock at 2026-06-14; a timesheet for week 2026-06-07 with daily_hours [0, 13, 12, 12, 0.5, 0, 0] (total 37.50, one 13-hour day) is SUBMITTED."
