    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_UNIT_NOT_FOUND, ERR_STAFF_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_CROSS_UNIT_REFERENCE, ERR_STAFF_CREDENTIAL_EXPIRED, ERR_SHIFT_WINDOW_OVERLAP, ERR_SHIFT_WINDOW_TOO_LONG]

