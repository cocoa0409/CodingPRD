              captures: { sl_exp: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /surcharge-windows"
              payload: { code: "DEM-AUG", kind: "DEMAND", service_level_id: "${sl_exp}", start_date: "2026-08-01", end_date: "2026-09-01", per_package_cents: 150, oversize_add_cents: 0 }
              as: CarrierAdmin
              captures: { win_dem: $.data.id }
            - call: "POST /surcharge-windows/${win_dem}/activate"
              payload: {}
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_exp}", tracking_number: "1Z-P4-0004", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p4: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-02T03:00:00Z" }
              as: CarrierAdmin
            - call: "POST /shipments/${p4}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh1}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingOps
              captures: { inv4: $.data.id }
            - call: "POST /invoices/${inv4}/issue"
              payload: {}
              as: BillingOps
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv4}", shipment_id: "${p4}" }
              as: BillingOps
              captures: { line4: "$.data[0].id" }
          trigger:
            - call: "POST /guarantee-claims"
              payload: { shipment_id: "${p4}", claimed_reason: "Delivered three hours past the 24-hour commitment" }
              as: ShipperUser
              as_user_id: "${sh1}"
              captures: { clm: $.data.id }
            - call: "POST /guarantee-claims/${clm}/adjudicate"
              payload: { outcome: "APPROVED" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
            - call: "GET /billing-adjustments"
              payload: { guarantee_claim_id: "${clm}", status: "PROPOSED" }
              as: BillingOps
              captures: { adj4: "$.data[0].id" }
            - call: "POST /billing-adjustments/${adj4}/apply"
              payload: {}
              as: BillingOps
              as_user_id: "billing.two"
            - call: "GET /guarantee-claims/${clm}"
              payload: {}
              as: RevenueAuditor
          assert:
            - "HOP 1 — GuaranteeClaim.${clm}.status == FILED, guarantee_deadline_utc == 2026-08-02T00:00:00Z, delivered_at == 2026-08-02T03:00:00Z, late_by_seconds == 10800"
            - "HOP 1 — GuaranteeClaim.${clm}.candidate_refund_cents == 2660 — the floored transportation charge only, never the 2810 line total and never 150 of surcharge"
            - "HOP 1 — GuaranteeClaim.${clm}.invoice_line_id == ${line4}, filed_by_user_id == ${sh1}, refund_cents == 0"
            - "HOP 2 — after adjudicate: GuaranteeClaim.${clm}.status == APPROVED (NOT REFUNDED) and BillingAdjustment.${adj4}.reason == GUARANTEE_REFUND, delta_cents == -2660, status == PROPOSED, created_by_user_id == 'auditor.one', guarantee_claim_id == ${clm}"
            - "HOP 2 — after adjudicate: Invoice.${inv4}.pending_adjustment_count == 1 and net_amount_cents is STILL 2810 — approval alone moves no money"
            - "HOP 3 — after apply: InvoiceLine.${line4}.adjustment_total_cents == -2660 and line_total_cents == 150, with base_line_total_cents still 2810 and surcharge_cents still 150"
            - "HOP 4 — after apply: Invoice.${inv4}.status == ADJUSTED, adjustment_total_cents == -2660, net_amount_cents == 150, pending_adjustment_count == 0"
            - "HOP 5 — after apply: Shipment.${p4}.billing_status == ADJUSTED"
            - "HOP 6 — after apply: ShipperAccount.${sh1}.credit_balance_cents == 2660 and open_charges_cents == 150; INVARIANT M holds: 2660 + 150 == 2810"
            - "LOOP BACK — after apply: GuaranteeClaim.${clm}.status == REFUNDED and refund_cents == 2660, set by the adjustment's apply cascade and not by adjudicate"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settled_invoice_state_check_outranks_the_credit_ceiling_check
        grounds:
          - validations[priority=27]  # ERR_INVOICE_NOT_ADJUSTABLE
          - validations[priority=54]  # ERR_ADJUSTMENT_EXCEEDS_LINE
          - validations[priority=55]  # ERR_CREDIT_EXCEEDS_INVOICE_NET
          - state_machines.Invoice.ISSUED_to_SETTLED
        distinguishing_aspect: |
          One request violates three rules at once — the invoice is SETTLED (priority 27,
          409), the credit exceeds the line total (priority 54, 422) and it would push the
          invoice net negative (priority 55, 422). Only the lowest priority NUMBER may be
          reported, so the answer is 409 ERR_INVOICE_NOT_ADJUSTABLE with a 409 status, not
          either 422. The companion call proves the fiscal rule is genuinely reachable: on
          an ISSUED invoice the very same oversized credit returns 422
          ERR_ADJUSTMENT_EXCEEDS_LINE. This pair is lifecycle-state versus money ceiling;
          the other instance in this rule pairs a time window against a uniqueness rule.
        test_recipe:
          setup:
            - "SH-1001 ACTIVE with ACTIVE contract C1 (dim_divisor 139, min_charge_cents 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS (24 h, guaranteed). No surcharge window."
            - "Shipment PA (12 x 10 x 8, 6.0 lb, zone 2, non-residential) DELIVERED -> billable 7 lb, transportation 2660, line 2660."
            - "Invoice INV_S over 2026-08-01..2026-08-31 carries PA's line, was ISSUED and is now SETTLED with payment_reference ACH-778."
            - "Shipment PB is declared identically, DELIVERED, and swept onto a second invoice INV_I over the same period, which is ISSUED with net 2660."
            - "Both lines therefore have line_total_cents 2660, so a 999999-cent credit breaches the line ceiling on either invoice."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express 24", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl_exp: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_exp}", tracking_number: "1Z-PA-0021", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { pa: $.data.id }
            - call: "POST /shipments/${pa}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh1}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingOps
              captures: { inv_s: $.data.id }
            - call: "POST /invoices/${inv_s}/issue"
              payload: {}
              as: BillingOps
            - call: "POST /invoices/${inv_s}/settle"
              payload: { payment_reference: "ACH-778" }
              as: BillingOps
              captures: { inv_s_v: $.data.version }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv_s}", shipment_id: "${pa}" }
              as: BillingOps
              captures: { line_s: "$.data[0].id" }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_exp}", tracking_number: "1Z-PB-0022", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { pb: $.data.id }
            - call: "POST /shipments/${pb}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh1}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingOps
              captures: { inv_i: $.data.id }
            - call: "POST /invoices/${inv_i}/issue"
              payload: {}
              as: BillingOps
              captures: { inv_i_v: $.data.version }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv_i}", shipment_id: "${pb}" }
              as: BillingOps
              captures: { line_i: "$.data[0].id" }
          trigger:
            - call: "POST /billing-adjustments"
              payload: { invoice_line_id: "${line_s}", reason: "MANUAL", delta_cents: -999999, expected_invoice_version: "${inv_s_v}", note: "triple violation probe" }
              as: BillingOps
              as_user_id: "billing.one"
              captures: { err_state: $.data.error_id }
            - call: "POST /billing-adjustments"
              payload: { invoice_line_id: "${line_i}", reason: "MANUAL", delta_cents: -999999, expected_invoice_version: "${inv_i_v}", note: "ceiling probe" }
              as: BillingOps
              as_user_id: "billing.one"
              captures: { err_ceiling: $.data.error_id }
          assert:
            - "The first call returns HTTP 409 with error_id ERR_INVOICE_NOT_ADJUSTABLE — priority 27 wins over priority 54 and priority 55"
            - "The first call does NOT return ERR_ADJUSTMENT_EXCEEDS_LINE, does NOT return ERR_CREDIT_EXCEEDS_INVOICE_NET and does NOT return 422"
            - "The second call returns HTTP 422 with error_id ERR_ADJUSTMENT_EXCEEDS_LINE — the same payload shape on an ISSUED invoice reaches the fiscal rule, so the first result was ordering and not an unreachable branch"
            - "The second call reports ERR_ADJUSTMENT_EXCEEDS_LINE and not ERR_CREDIT_EXCEEDS_INVOICE_NET, because priority 54 precedes priority 55"
            - "Invoice.${inv_s}.status == SETTLED, adjustment_total_cents == 0, net_amount_cents == 2660 and pending_adjustment_count == 0 — the rejected call wrote nothing"
            - "Invoice.${inv_i}.status == ISSUED, adjustment_total_cents == 0, pending_adjustment_count == 0 and version is unchanged from ${inv_i_v}"
            - "GET /billing-adjustments with invoice_line_id ${line_s} returns 0 rows and with invoice_line_id ${line_i} returns 0 rows"
      - name: dispute_window_closure_outranks_the_duplicate_dispute_rule
        grounds:
          - validations[priority=37]  # ERR_DISPUTE_WINDOW_CLOSED
          - validations[priority=39]  # ERR_DUPLICATE_DISPUTE
          - entities.Invoice.fields.dispute_deadline_utc
          - calculations.guarantee_refund
        distinguishing_aspect: |
          A second dispute on a line that already has a SUBMITTED dispute violates the
          uniqueness rule (priority 39, 409); once the 90-day window has also expired it
          violates the temporal rule (priority 37, 422) as well, and the temporal rule must
          win despite the referential one being the more obvious conflict and carrying the
          more specific 409. The same two rules are exercised in both orders inside one
          recipe by moving only the clock. Unlike the other instance in this rule, neither
          participant here is a lifecycle-state check.
        test_recipe:
          setup:
            - "SH-1001 ACTIVE with ACTIVE contract C1 (dim_divisor 139, min_charge_cents 1195, zone-2 rows 380/340/305, RESIDENTIAL override 540); ServiceLevel EXPRESS (24 h, guaranteed). No surcharge window."
            - "Shipment PW (18.4 x 12.6 x 10.5, 9.2 lb, zone 2, residential) DELIVERED at the 2026-08-01T00:00:00Z default clock, carrying one AUTO RESIDENTIAL charge of 540; its line is 7220 + 540 = 7760."
            - "The clock is moved to 2026-08-05T00:00:00Z and invoice INV_W is ISSUED there, so dispute_deadline_utc == 2026-11-03T00:00:00Z (DISPUTE_WINDOW_DAYS 90)."
            - "One dispute DW1 (claim_type ACCESSORIAL, disputed_codes [RESIDENTIAL]) already exists on that line with status SUBMITTED."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express 24", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl_exp: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
                accessorial_rate_overrides: { RESIDENTIAL: 540 }
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_exp}", tracking_number: "1Z-PW-0031", zone: 2, residential_declared: true, declared_length_in: 18.4, declared_width_in: 12.6, declared_height_in: 10.5, declared_weight_lbs: 9.2 }
              as: CarrierOps
              captures: { pw: $.data.id }
            - call: "POST /shipments/${pw}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-05T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /invoices"
              payload: { shipper_id: "${sh1}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingOps
              captures: { inv_w: $.data.id }
            - call: "POST /invoices/${inv_w}/issue"
              payload: {}
              as: BillingOps
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv_w}", shipment_id: "${pw}" }
              as: BillingOps
              captures: { line_w: "$.data[0].id" }
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line_w}", claim_type: "ACCESSORIAL", claimed_reason: "Commercial dock delivery", disputed_codes: ["RESIDENTIAL"] }
              as: ShipperUser
              as_user_id: "${sh1}"
              captures: { dw1: $.data.id }
          trigger:
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line_w}", claim_type: "ACCESSORIAL", claimed_reason: "Second bite while the window is open", disputed_codes: ["RESIDENTIAL"] }
              as: ShipperUser
              as_user_id: "${sh1}"
              captures: { err_dup: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-11-04T00:00:01Z" }
              as: CarrierAdmin
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line_w}", claim_type: "ACCESSORIAL", claimed_reason: "Second bite after the window closed", disputed_codes: ["RESIDENTIAL"] }
              as: ShipperUser
              as_user_id: "${sh1}"
              captures: { err_window: $.data.error_id }
          assert:
            - "Invoice.${inv_w}.issued_at == 2026-08-05T00:00:00Z and dispute_deadline_utc == 2026-11-03T00:00:00Z"
            - "The first trigger call, inside the window, returns HTTP 409 with error_id ERR_DUPLICATE_DISPUTE — priority 39 is the only rule it breaks"
            - "The third trigger call, after the deadline, returns HTTP 422 with error_id ERR_DISPUTE_WINDOW_CLOSED — priority 37 outranks the still-true duplicate condition"
            - "The third call does NOT return ERR_DUPLICATE_DISPUTE and does NOT return 409"
            - "Both rejected calls leave Dispute.${dw1}.status == SUBMITTED with round_count 0 and accepted_evidence_count 0"
            - "GET /disputes with invoice_line_id ${line_w} returns exactly 1 row, ${dw1} — no partial dispute was persisted by either rejection"
            - "InvoiceLine.${line_w}.line_total_cents == 7760 and Invoice.${inv_w}.status == ISSUED throughout"
  - rule_id: boundary_precision_check
    instances:
      - name: scan_tolerance_breaches_at_exactly_five_percent_and_at_exactly_the_weight_allowance
        grounds:
          - calculations.scan_tolerance_evaluation
          - entities.DimensionScan.fields.tolerance_status
          - entities.DimensionScan.fields.dim_variance_pct
          - entities.Shipment.fields.measurement_status
        distinguishing_aspect: |
          Three scans land ON the two tolerance boundaries rather than near them: a cube
          variance of exactly 5.00 % (2000 -> 2100) must breach because the rule reads >=,
          a variance of exactly 2.50 % (4000 -> 4100) must not, and a weight variance of
          exactly 0.600 lb against an allowance of max(0.5, 2 % of 30.0) = 0.600 lb must
          breach on the same >= edge. Both boundary values are also exact at two decimals,
          so an implementation that compares floats or rounds the percentage to one decimal
          flips at least one of the three.
        test_recipe:
          setup:
            - "SH-1001 ACTIVE with ACTIVE contract C1 (dim_divisor 139, min_charge_cents 1195, zone-2 rows 380/340/305); ServiceLevel GROUND (120 h, not guaranteed). No surcharge window."
            - "Constants: DIM_VARIANCE_TOLERANCE_PCT 5.0, WEIGHT_VARIANCE_ABS_LBS 0.5, WEIGHT_VARIANCE_PCT 2.0; the allowance for a 30.0 lb declaration is max(0.5, 0.6) = 0.6 lb."
            - "Shipment PT_A declared 10 x 10 x 20 in at 30.0 lb, zone 2 -> cube 2000, dim weight 15, billable 30 ACTUAL."
            - "Shipment PT_B declared 10 x 10 x 40 in at 30.0 lb, zone 2 -> cube 4000, dim weight 29, billable 30 ACTUAL."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "GROUND", name: "Ground", guarantee_hours: 120, guaranteed: false }
