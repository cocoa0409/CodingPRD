          trigger:
            - call: POST /engineered-orders/${order_id}/compliance-labels
              payload: { submittal_drawing_id: "${drawing_id}", test_report_id: "${report_id}", generated_by_user_id: "u-compliance-1", expected_engineered_order_version: "${current_order_version}" }
              as: ComplianceOfficer
