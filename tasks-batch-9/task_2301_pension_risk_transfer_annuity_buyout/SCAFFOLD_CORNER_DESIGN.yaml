            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-1101", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 320, date_of_birth: "1968-04-04" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id }
            - call: "POST /prt/insurers"
              payload: { insurer_name: "Northwall Life", rating_grade: "AA", capital_ratio_bp: 4200, capacity_cents: 500000000 }
              as: Regulator
