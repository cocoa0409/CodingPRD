              payload: { name: "Posture-satisfied exercise", exercise_type: "COMPONENT_FAILOVER", recovery_site_id: "${sr_id}", coordinator_id: "${c1_id}", planned_start_at: "2026-08-20T00:00:00Z", planned_end_at: "2026-08-20T06:00:00Z" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { exP_id: $.data.id, exP_v: $.data.version }
            - call: "POST /exercises/${exP_id}/scope-items"
              payload: { recovery_group_id: "${g1_id}", expected_exercise_version: "${exP_v}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises"
              payload: { name: "Posture-violated exercise", exercise_type: "COMPONENT_FAILOVER", recovery_site_id: "${sr_id}", coordinator_id: "${c1_id}", planned_start_at: "2026-09-20T00:00:00Z", planned_end_at: "2026-09-20T06:00:00Z" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { exN_id: $.data.id, exN_v: $.data.version }
            - call: "POST /exercises/${exN_id}/scope-items"
              payload: { recovery_group_id: "${g1_id}", expected_exercise_version: "${exN_v}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /exercises/${exP_id}/impact-submissions"
