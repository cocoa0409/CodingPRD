      - name: filing_a_dispute_exactly_at_the_window_end_is_closed_but_one_millisecond_earlier_is_open
        claim_type: temporal_validation
        grounds:
          - validations[priority=15]
          - errors[ERR_DISPUTE_WINDOW_CLOSED]
        distinguishing_aspect: |
          Priority 15 requires the clock to be STRICTLY before
          dispute_window_end, so the boundary instant itself is closed. Parking
          the clock exactly on 2026-09-30T00:00:00.000Z must yield 422
          ERR_DISPUTE_WINDOW_CLOSED, while 2026-09-29T23:59:59.999Z — the last
          representable instant at the declared three-fraction-digit precision —
          must yield 201. An inclusive comparison passes the first probe and
          therefore fails this instance.
