      - name: customer_b_reading_foreign_order_returns_404
        claim_type: rbac_denial
        grounds: ["roles[Customer]", "validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Ownership scoping: Customer B fetching Customer A's order gets ERR_NOT_FOUND (404, no existence leak), and B's order list contains only B's orders."
        test_recipe:
