              as_user_id: "cm-1"
            - call: "POST /drinkware/enforcement-cases"
              payload: { marketplace: "AMAZON", seller_handle: "map-breaker-1", listing_url: "https://amazon.example/d/m1", matched_dealer_id: "${dealer_pr}" }
              as: ChannelManager
              as_user_id: "cm-enf"
              captures: { case_pr1: $.data.id }
            - call: "POST /drinkware/enforcement-cases"
              payload: { marketplace: "EBAY", seller_handle: "map-breaker-2", listing_url: "https://ebay.example/i/m2", matched_dealer_id: "${dealer_pr}" }
              as: ChannelManager
              as_user_id: "cm-enf"
              captures: { case_pr2: $.data.id }
            - call: "GET /drinkware/dealers/${dealer_pr}"
              payload: {}
              as: ChannelManager
