            - { call: "POST /group-orders/${g2_id}/lock", as: Employee, as_user_id: "${emp_ben_id}" }
            - { call: "POST /group-orders/${g3_id}/lock", as: Employee, as_user_id: "${emp_cleo_id}" }
          trigger:
            - { call: "POST /group-orders/${g1_id}/submit", as: Employee, as_user_id: "${emp_ada_id}" }
            - { call: "POST /group-orders/${g2_id}/submit", as: Employee, as_user_id: "${emp_ben_id}" }
            - { call: "POST /group-orders/${g3_id}/submit", as: Employee, as_user_id: "${emp_cleo_id}" }
          assert:
