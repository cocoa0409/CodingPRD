      - name: rx_order_two_dimensions_move_on_disjoint_endpoint_sets
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.RxOrder.fulfillment_status
          - state_machines.RxOrder.billing_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / rx_order_fulfillment_and_billing_dimensions_advance_independently
          rationale: >-
            That §1.8 instance already drives the fulfillment dimension across three transitions while
            billing stands still and then moves billing while fulfillment stands still, asserting the
            full combined-state matrix.

      - name: lab_job_creation_requires_a_usable_layout_on_the_parent_order
        claim_type: guarded_transitions
        grounds:
          - validations[priority=310]
          - state_machines.RxOrder.LAYOUT_READY_to_IN_LAB
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / remake_case_close_blocked_until_the_replacement_order_reaches_lab_complete
          rationale: >-
            The cross-entity guard on a transition (a state read from a different aggregate gating the
            edge) is asserted there in both directions; the layout-usability guard is additionally
            covered by the cascading_validation corner in this file.

      - name: benefit_void_reverses_every_side_effect_of_the_application
        claim_type: compensation
        grounds:
          - state_machines.RxOrder.BENEFIT_APPLIED_to_BENEFIT_VOIDED
          - endpoints.POST_/rx-orders/{id}/benefit-void
        excluded_because:
          difficulty_instance: compensating_invariant / benefit_void_reverses_the_ledger_and_returns_rolling_benefit_used_to_zero
          rationale: >-
            That instance asserts the full undo: BENEFIT_REVERSAL entry, insurance_benefit_cents 0,
            benefit_applied_at null, patient_portion restored and benefit_used_cents back to its exact
            pre-application value with no drift.

      - name: remake_case_creation_adjusts_the_order_and_the_blank_lot
        claim_type: cross_entity
        grounds:
          - endpoints.POST_/remake-cases
          - state_machines.RxOrder.LAB_COMPLETE_to_REMAKE_PENDING
        excluded_because:
          difficulty_instance: transitive_cascade / remake_on_a_settled_order_cascades_four_hops_into_refund_due
          rationale: >-
            Entity A (RemakeCase) changing entity B (RxOrder money and state) and entity C
            (LensBlankLot ledger) is asserted hop by hop there.

