            - call: "POST /nac/products"
              payload: { sku: "S2-CHKN", description: "Chicken Breast alt 2", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4400, avg_cost_cents: 4400, replacement_cost_cents: 4400, substitution_group_code: "CHKN" }
              as: SystemAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "S3-CHKN", description: "Chicken Breast alt 3", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4160, avg_cost_cents: 4160, replacement_cost_cents: 4160, substitution_group_code: "CHKN" }
              as: SystemAdmin
              captures: { s3_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "S4-CHKN", description: "Chicken Breast alt 4", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4200, avg_cost_cents: 4200, replacement_cost_cents: 4200, substitution_group_code: "CHKN" }
