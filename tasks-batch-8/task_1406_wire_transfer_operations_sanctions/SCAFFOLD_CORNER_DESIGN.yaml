        distinguishing_aspect: "The STP repair loop is capped at 2 attempts per wire: repairs one and two succeed; the third is rejected with ERR_REPAIR_LIMIT_EXCEEDED and the wire is stuck in PENDING_APPROVAL awaiting an approve/reject/cancel decision."
