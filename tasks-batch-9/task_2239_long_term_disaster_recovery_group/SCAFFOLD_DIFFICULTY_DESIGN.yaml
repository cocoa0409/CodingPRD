      - name: pledge_caps_org_and_locks_it_out_of_a_second_case_in_the_same_session
        grounds:
          - "endpoints[POST /funding-commitments]"
          - "entities.MemberOrganization.fields.committed_cents"
          - "entities.MemberOrganization.fields.remaining_pledge_capacity_cents"
          - "entities.MemberOrganization.fields.status"
          - "validations[priority 15]"
          - "errors[ERR_MEMBER_ORG_NOT_ACTIVE]"
        distinguishing_aspect: "The cascade crosses aggregates: a pledge on presentation A mutates the MemberOrganization, and that mutation is what blocks a pledge on unrelated presentation B in the same session. An implementation that computes remaining capacity lazily at award time (rather than at pledge time) still shows M2 ACTIVE and accepts the second pledge, over-committing the org to 1600000 against a 1500000 cap. An implementation that scopes capacity per presentation also wrongly accepts it."
        test_recipe:
          setup:
            - "One Survivor with two separate RecoveryCases (C11a, C11b), each with STRUCTURE damage verified 2000000 and a pinned PURPOSE_MATCHED assessment."
            - "Both are queued into session T11 (quorum 1) with M2 (annual_pledge_cap_cents 1500000) attending."
            - "Presentation A is presented and deliberating; M2 pledges its entire 1500000, so M2 becomes CAPPED with remaining 0."
            - "Presentation B is then presented and deliberating, so every other gate (session IN_SESSION, presentation DELIBERATING, org in attendance, fresh OCC version) is satisfied."
