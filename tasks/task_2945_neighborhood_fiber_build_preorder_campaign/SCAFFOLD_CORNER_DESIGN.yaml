          difficulty_instance: combinatorial_formula / readiness_score_nonlinear_min_max_composition
          rationale: "The saturating min, the pole max, the penalty and the single final rounding are all asserted there, along with the sequencing order."

      - name: qualification_threshold_comparison_at_the_boundary
        claim_type: threshold
        grounds:
          - calculations.zone_prereg_rate.constants.QUALIFY_COMPARISON
        excluded_because:
          difficulty_instance: boundary_precision_check / final_rate_exactly_at_threshold_qualifies_one_hundredth_below_does_not
          rationale: "Exactly-at-threshold and one hundredth below are both asserted there."

      - name: provisional_and_final_variants_diverge
        claim_type: Variant Divergence
        grounds:
          - calculations.zone_prereg_rate.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_final_rate_diverge_on_undetermined_address
          rationale: "Same data, two variants, and the NOT_QUALIFIED consequence of the divergence are asserted there."

      - name: qualification_run_reconciles_the_provisional_number
        claim_type: Reconciliation
        grounds:
          - calculations.zone_prereg_rate.variants
          - endpoints["POST /campaigns/{id}/qualification-run"]
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_final_rate_diverge_on_undetermined_address
          rationale: "The switch from the PROVISIONAL number to the FINAL one, and its ledger and deposit consequences, are asserted there."

      - name: crew_conflict_interval_is_buffered_and_half_open
        claim_type: interval_merge
        grounds:
          - calculations.crew_occupancy
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_buffered_halfopen_interval_rejects_11_29_accepts_11_30
          rationale: "The one-minute-either-side pair on the buffered half-open interval is asserted there."

      - name: crew_daily_capacity_is_an_inclusive_aggregate
        claim_type: Constants Applied
        grounds:
          - calculations.crew_occupancy.constants.CAPACITY_COMPARISON
        excluded_because:
          difficulty_instance: boundary_precision_check / crew_daily_capacity_exact_fit_accepted_next_minute_rejected
          rationale: "The exact fit at 480 minutes and the rejection one minute past it are asserted there."

  - section: validations
    instances:
      - name: undetermined_address_may_still_be_preordered
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority 24 ERR_ADDRESS_NOT_SERVICEABLE]
          - entities.ServiceAddress.fields.serviceability
          - entities.ServiceAddress.fields.counts_toward_threshold
        distinguishing_aspect: "Only a definite negative blocks sign-up: an address left at its UNDETERMINED default passes the priority-24 gate and the preorder is created, yet counts_toward_threshold stays false while the PROVISIONAL rate already counts it -- the two numbers legitimately disagree at this point."
        test_recipe:
          setup:
            - "One campaign with deposit_amount_cents 1000; one zone with household_count 10."
            - "One address with no serviceability determination at all, and one RESIDENT account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "1 Elm St", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 100 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Ann Reyes", email: "ann@example.com", phone: "+13035550101", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct1: $.data.id }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { zv1: $.data.version }
          trigger:
            - call: "POST /preorders"
              payload: { build_zone_id: "${z1}", service_address_id: "${a1}", account_id: "${acct1}", plan_tier: "BASIC_300", tendered_deposit_cents: 1000, expected_build_zone_version: "${zv1}" }
              as: Subscriber
              as_user_id: "${acct1}"
              captures: { p1: $.data.id }
          assert:
            - "the response is HTTP 201 and Preorder.${p1}.preorder_status == PENDING with deposit_status HELD"
            - "ServiceAddress.${a1}.serviceability == UNDETERMINED and serviceability_determined_at == null"
            - "ServiceAddress.${a1}.counts_toward_threshold == false"
            - "BuildZone.${z1}.prereg_rate_pct == 10.00 and provisional_qualifying_count == 1"
            - "BuildZone.${z1}.final_rate_pct == null because no qualification run has happened"

      - name: mdu_unit_count_rule_applies_only_to_mdu_addresses
        claim_type: Conditional validation
        grounds:
          - validations[priority 7 ERR_INVALID_REQUEST]
          - entities.ServiceAddress.fields.unit_count
          - entities.ServiceAddress.fields.dwelling_type
        distinguishing_aspect: "The unit_count rule is conditional on dwelling_type in both directions: MDU demands >= 2 and SINGLE_FAMILY demands exactly 1, so unit_count 1 is simultaneously the only legal value for one type and an ERR_INVALID_REQUEST for the other."
        test_recipe:
          setup:
            - "One campaign and one zone."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
          trigger:
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "500 Birch Tower", dwelling_type: "MDU", unit_count: 1, distance_to_node_m: 80 }
              as: ProgramManager
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "1 Elm St", dwelling_type: "SINGLE_FAMILY", unit_count: 4, distance_to_node_m: 100 }
              as: ProgramManager
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "500 Birch Tower", dwelling_type: "MDU", unit_count: 24, distance_to_node_m: 80 }
              as: ProgramManager
              captures: { a_ok: $.data.id }
          assert:
            - "the first call is HTTP 400 with data.error_id == ERR_INVALID_REQUEST (MDU needs unit_count >= 2)"
            - "the second call is HTTP 400 with data.error_id == ERR_INVALID_REQUEST (SINGLE_FAMILY needs exactly 1)"
            - "the third call is HTTP 201 and ServiceAddress.${a_ok}.unit_count == 24 with dwelling_type MDU"
            - "the rejected calls created nothing, so GET /service-addresses?build_zone_id=${z1} returns total_count 1"

      - name: mdu_agreement_against_a_single_family_address_returns_linkage_mismatch
        claim_type: Cross-entity validation
        grounds:
          - validations[priority 8 ERR_ADDRESS_LINKAGE_MISMATCH]
          - endpoints["POST /mdu-agreements"]
        distinguishing_aspect: "Validity depends on a field of a different entity: the agreement body itself is well formed, and it is the referenced address's dwelling_type that makes it a 422 ERR_ADDRESS_LINKAGE_MISMATCH -- the same body against an MDU address succeeds."
        test_recipe:
          setup:
            - "One campaign, one zone, one SINGLE_FAMILY address, one MDU address and one PROPERTY_OWNER account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "1 Elm St", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 100 }
              as: ProgramManager
              captures: { a_sf: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "500 Birch Tower", dwelling_type: "MDU", unit_count: 24, distance_to_node_m: 80 }
              as: ProgramManager
              captures: { a_mdu: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Birch Tower LLC", email: "owner@birch.example.com", phone: "+13035550199", account_type: "PROPERTY_OWNER" }
              as: ProgramManager
              captures: { owner1: $.data.id }
          trigger:
            - call: "POST /mdu-agreements"
              payload: { service_address_id: "${a_sf}", owner_account_id: "${owner1}", access_fee_cents: 250000, expires_at: "2026-12-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /mdu-agreements"
              payload: { service_address_id: "${a_mdu}", owner_account_id: "${owner1}", access_fee_cents: 250000, expires_at: "2026-12-01T00:00:00Z" }
              as: ProgramManager
              captures: { ag_ok: $.data.id }
          assert:
            - "the first call is HTTP 422 with data.error_id == ERR_ADDRESS_LINKAGE_MISMATCH"
            - "the second call is HTTP 201 with MduOwnerAgreement.${ag_ok}.status == DRAFT"
            - "GET /mdu-agreements?service_address_id=${a_sf} returns total_count 0"

      - name: qualification_run_while_every_zone_is_inside_its_window_is_refused
        claim_type: Temporal validation
        grounds:
          - validations[priority 17 ERR_PREREG_DEADLINE_NOT_REACHED]
          - endpoints["POST /campaigns/{id}/qualification-run"]
        distinguishing_aspect: "The run is refused rather than returning an empty evaluation list, and the refusal is purely temporal: nothing about the zone changes, and the same call succeeds once the clock passes the deadline instant."
        test_recipe:
          setup:
            - "One campaign whose prereg_window_close_at is 2026-09-30T23:59:00Z and one zone inheriting that deadline."
            - "The clock at 2026-08-01T00:00:00Z, well inside the window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { deadline: $.data.prereg_deadline_at, version_before: $.data.version }
          trigger:
            - call: "POST /campaigns/${camp}/qualification-run"
              payload: {}
              as: ProgramManager
          assert:
            - "${deadline} == 2026-09-30T23:59:00Z, inherited from the campaign"
            - "the response is HTTP 409 with data.error_id == ERR_PREREG_DEADLINE_NOT_REACHED"
            - "BuildZone.${z1}.campaign_status == PREREG_OPEN with final_rate_pct == null and version == ${version_before}"

      - name: existence_is_checked_before_ownership_on_preorder_cancel
        claim_type: Cascading validation
        grounds:
          - validations[priority 3 ERR_PREORDER_NOT_FOUND]
          - validations[priority 5 ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "The two auth-adjacent checks are ordered: an unknown id from a stranger yields 404 ERR_PREORDER_NOT_FOUND (never 403, which would leak that the caller is unauthorized for something that does not exist), while a real id belonging to someone else yields 403 ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup:
            - "One campaign, one zone, one SERVICEABLE address and two RESIDENT accounts."
            - "One PENDING preorder owned by the first account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "1 Elm St", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 100 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /service-addresses/${a1}/serviceability-determination"
              payload: { serviceability: "SERVICEABLE" }
              as: ProgramManager
            - call: "POST /accounts"
              payload: { full_name: "Ann Reyes", email: "ann@example.com", phone: "+13035550101", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct1: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Ben Ortiz", email: "ben@example.com", phone: "+13035550102", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct2: $.data.id }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { zv1: $.data.version }
            - call: "POST /preorders"
              payload: { build_zone_id: "${z1}", service_address_id: "${a1}", account_id: "${acct1}", plan_tier: "BASIC_300", tendered_deposit_cents: 1000, expected_build_zone_version: "${zv1}" }
              as: Subscriber
              as_user_id: "${acct1}"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /preorders/00000000-0000-0000-0000-0000000009f9/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${acct2}"
            - call: "POST /preorders/${p1}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${acct2}"
          assert:
            - "the first call is HTTP 404 with data.error_id == ERR_PREORDER_NOT_FOUND"
            - "the second call is HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "Preorder.${p1}.preorder_status == PENDING with deposit_status HELD -- neither rejection touched the row"
            - "Account.${acct1}.deposit_held_cents == 1000 and Account.${acct2}.deposit_held_cents == 0"

      - name: deposit_overpayment_is_the_last_complaint_a_preorder_hears
        claim_type: Violation → Error
        grounds:
          - validations[priority 33 ERR_DEPOSIT_AMOUNT_MISMATCH]
          - entities.Campaign.fields.deposit_amount_cents
        distinguishing_aspect: "The fiscal rule sits at the very bottom of the ladder, so a request that is structurally perfect and merely tenders 1500 against a 1000-cent deposit returns HTTP 402 ERR_DEPOSIT_AMOUNT_MISMATCH -- an overpayment is refused exactly like an underpayment, and the retry at the exact amount then succeeds because the rejection persisted nothing."
        test_recipe:
          setup:
            - "One campaign with deposit_amount_cents 1000; one zone, one SERVICEABLE address, one RESIDENT account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "1 Elm St", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 100 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /service-addresses/${a1}/serviceability-determination"
              payload: { serviceability: "SERVICEABLE" }
              as: ProgramManager
            - call: "POST /accounts"
              payload: { full_name: "Ann Reyes", email: "ann@example.com", phone: "+13035550101", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct1: $.data.id }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { zv1: $.data.version }
          trigger:
            - call: "POST /preorders"
              payload: { build_zone_id: "${z1}", service_address_id: "${a1}", account_id: "${acct1}", plan_tier: "BASIC_300", tendered_deposit_cents: 1500, expected_build_zone_version: "${zv1}" }
              as: Subscriber
              as_user_id: "${acct1}"
            - call: "POST /preorders"
              payload: { build_zone_id: "${z1}", service_address_id: "${a1}", account_id: "${acct1}", plan_tier: "BASIC_300", tendered_deposit_cents: 1000, expected_build_zone_version: "${zv1}" }
              as: Subscriber
              as_user_id: "${acct1}"
              captures: { p1: $.data.id }
          assert:
            - "the first call is HTTP 402 with data.error_id == ERR_DEPOSIT_AMOUNT_MISMATCH"
            - "the rejected call did not bump BuildZone.${z1}.version, which is why the retry may reuse ${zv1}"
            - "the retry is HTTP 201 with Preorder.${p1}.deposit_amount_cents == 1000 and deposit_status HELD"
            - "GET /ledger-entries?preorder_id=${p1} returns total_count 1 -- the refused tender wrote nothing"

      - name: threshold_may_be_lowered_but_never_raised
        claim_type: Violation → Error
        grounds:
          - validations[priority 31 ERR_THRESHOLD_INCREASE_FORBIDDEN]
          - endpoints["PATCH /build-zones/{id}/threshold"]
        distinguishing_aspect: "The adjustment is one-directional and strict: 12.00 and an equal 10.00 are both refused, while 8.00 is accepted and immediately re-scores the PROVISIONAL rate against the new bar without touching the numerator."
        test_recipe:
          setup:
            - "One campaign; one zone with household_count 10 and threshold_pct 10.00, inside its window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10, threshold_pct: 10.00 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { version_before: $.data.version }
          trigger:
            - call: "PATCH /build-zones/${z1}/threshold"
              payload: { threshold_pct: 12.00 }
              as: ProgramManager
            - call: "PATCH /build-zones/${z1}/threshold"
              payload: { threshold_pct: 10.00 }
              as: ProgramManager
            - call: "PATCH /build-zones/${z1}/threshold"
              payload: { threshold_pct: 8.00 }
              as: ProgramManager
              captures: { new_threshold: $.data.threshold_pct, version_after: $.data.version }
          assert:
            - "the raise to 12.00 is HTTP 409 with data.error_id == ERR_THRESHOLD_INCREASE_FORBIDDEN"
            - "the equal 10.00 is also HTTP 409 with data.error_id == ERR_THRESHOLD_INCREASE_FORBIDDEN, because the rule demands strictly less"
            - "${new_threshold} == 8.00 and ${version_after} == ${version_before} + 1 -- only the accepted call bumped the version"
            - "BuildZone.${z1}.campaign_status == PREREG_OPEN, unchanged by a threshold edit"

      - name: preorder_at_a_not_serviceable_address_is_refused
        claim_type: Violation → Error
        grounds:
          - validations[priority 24 ERR_ADDRESS_NOT_SERVICEABLE]
          - entities.ServiceAddress.fields.not_serviceable_reason
        distinguishing_aspect: "A definite NOT_SERVICEABLE determination -- and only that value -- closes the address to sign-ups with HTTP 409, and the zone's provisional_qualifying_count stays 0 so a refused demand never inflates the campaign dashboard."
        test_recipe:
          setup:
