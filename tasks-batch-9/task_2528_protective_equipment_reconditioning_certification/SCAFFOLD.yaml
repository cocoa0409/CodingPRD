# =============================================================================
# SCAFFOLD — task_2528_protective_equipment_reconditioning_certification
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines · §1.2.1
# Concurrency · §1.3 Calculations · §1.4 Validations · §1.5 Endpoints ·
# §1.6 Errors · §1.7 RBAC
# =============================================================================
scenario: |
  Generate task harder than expert level!

  2528. Protective Equipment Reconditioning & Certification (athletic equipment
  reconditioner): equipment intake from schools and teams with inventory counts,
  model identification and age verification, cleaning, sanitization and
  disassembly with component inspection against manufacturer criteria, shell
  testing to the applicable performance standard with pass, repair or condemn
  determination, replacement part installation with approved components and
  documentation, recertification labeling with date and identification codes for
  traceability, condemned equipment disposal with destruction verification to
  prevent resale, turnaround scheduling around athletic seasons with loaner
  inventory, liability documentation, warranty interaction and record retention

domain_name: protective-equipment-reconditioning
api_prefix: "/"          # flat topology: every resource is a top-level collection

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  difficulty_level: beyond_expert   # §0.4 Expert band, deliberately over-dense on
                                    # calculations / cascades / invariants rather
                                    # than on entity count
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit FK fields; no
  # resource identity is encoded in a nested URL path. ModelSpec is a shared
  # configuration hub referenced by four peers (ApprovedPart, LoanerUnit,
  # EquipmentUnit, LoanerAssignment).

  state_machine_shape: branching
  # IntakeShipment forks COUNTED -> {ACCEPTED, QUARANTINED} and reverts
  # READY_FOR_RETURN -> IN_PROCESS; EquipmentUnit carries two independent state
  # axes (recon_status x custody_status) and a recertification cycle
  # TESTED -> REPAIR_PENDING -> REPAIRED -> TESTED; RepairOrder cycles
  # PARTS_PENDING -> INSTALLED -> PARTS_PENDING on failed verification;
  # LoanerUnit cycles AVAILABLE -> RESERVED -> OUT_ON_LOAN -> AVAILABLE.

  relationship_patterns:
    - one_to_many        # IntakeShipment -> EquipmentUnit, EquipmentUnit -> ShellTest
    - cross_aggregate    # ShellTest -> TestBench, LoanerAssignment -> LoanerUnit
    - polymorphic: false

  role_model: segregation_of_duties
  # The Technician who installs parts on a RepairOrder may not sign its
  # verification; determination is reserved to CertifyingInspector; destruction
  # verification and label voiding are reserved to ComplianceOfficer.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table  (13 entities)
# =============================================================================
entities:

  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - name: org_name
        type: string
        source: input
        description: School, club or municipal program that owns the equipment
        constraints: 1..120 chars, required
      - name: org_type
        type: enum
        source: input
        description: Ownership class of the program
        constraints: "one of {SCHOOL, CLUB, COLLEGE, MUNICIPAL}"
      - name: sport
        type: enum
        source: input
        description: Primary sport served by this account
        constraints: "one of {FOOTBALL, LACROSSE, HOCKEY, BASEBALL}"
      - name: contact_email
        type: string
        source: input
        description: Billing/notification address for the program
      - name: status
        type: enum
        source: system
        description: ACTIVE by default; BILLING_HOLD blocks recertification labeling
        default: ACTIVE
        constraints: "one of {ACTIVE, BILLING_HOLD}"
      - name: billing_hold_reason
        type: string
        source: system
        description: Reason recorded when status is set to BILLING_HOLD; null otherwise
        default: null
      - name: liability_waiver_version
        type: string
        source: system
        description: Waiver revision on file, written by the liability-acknowledgment endpoint
        default: null
      - name: liability_waiver_signed_at
        type: datetime
        source: system
        description: Logical-clock instant the waiver was acknowledged; null when none on file
        default: null
      - name: liability_waiver_signer
        type: string
        source: system
        description: Printed name of the program officer who acknowledged the waiver
        default: null
      - name: liability_waiver_status
        type: enum
        source: computed
        description: >-
          MISSING when liability_waiver_version is null; ON_FILE when
          liability_waiver_version == REQUIRED_WAIVER_VERSION ("2026.1"); STALE
          when a non-null version other than "2026.1" is on file
        default: MISSING
        constraints: "one of {MISSING, ON_FILE, STALE}"
      - name: open_shipment_count
        type: integer
        source: computed
        description: >-
          Count of IntakeShipment rows for this account whose status IN
          {ACCEPTED, IN_PROCESS}; incremented on shipment accept, decremented
          when a shipment reaches READY_FOR_RETURN, re-incremented on revert
        default: 0
      - name: loaner_recall_due_at
        type: datetime
        source: system
        description: >-
          Set to clock + LOANER_RECALL_GRACE_DAYS (14) when open_shipment_count
          reaches 0; cleared to null when open_shipment_count rises above 0
        default: null

  - name: ModelSpec
    parent: null
    common_fields: true
    fields:
      - name: manufacturer
        type: string
        source: input
        description: Original equipment manufacturer name
      - name: model_code
        type: string
        source: input
        description: Manufacturer model code, unique across ModelSpec rows
        constraints: unique, 1..40 chars
      - name: standard_code
        type: string
        source: input
        description: Applicable performance standard printed on recertification labels
        constraints: 'e.g. "NOCSAE-ND002-22"'
      - name: shell_material
        type: enum
        source: input
        description: Shell polymer, feeds the severity-index material offset
        constraints: "one of {POLYCARBONATE, ABS}"
      - name: max_service_life_years
        type: integer
        source: input
        description: Manufacturer service-life ceiling in whole years
        constraints: 1..25
      - name: warranty_years
        type: integer
        source: input
        description: Manufacturer warranty term in whole years from manufacture
        constraints: 0..10
      - name: record_retention_years
        type: integer
        source: input
        description: Years records must be retained after certification or destruction
        constraints: 1..10
      - name: pass_si_max
        type: number
        source: input
        description: Highest severity index still certifiable without repair (inclusive)
      - name: repair_si_max
        type: number
        source: input
        description: Highest severity index repairable; above this the shell is condemned
      - name: max_retest_count
        type: integer
        source: input
        description: Maximum number of retests permitted after the first shell test
        constraints: 0..5
      - name: reconditionable
        type: boolean
        source: input
        description: False for models the manufacturer has withdrawn from reconditioning
        default: true
      - name: required_component_codes
        type: array
        source: input
        description: >-
          Component codes that must each carry a ComponentInspection before the
          unit auto-advances DISASSEMBLED -> INSPECTED
        constraints: "non-empty subset of {SHELL, LINER, FACEMASK, CHINSTRAP, HARDWARE}"
      - name: component_criteria
        type: array
        source: input
        description: >-
          Manufacturer inspection criteria, one object per component code:
          { code, metric, metric_direction (LOWER_IS_WORSE|HIGHER_IS_WORSE),
          replace_threshold, fail_threshold, unit }
        constraints: must contain one object for every code in required_component_codes

  - name: ApprovedPart
    parent: null
    common_fields: true
    fields:
      - name: model_spec_id
        type: string
        source: input
        description: FK -> ModelSpec.id; the model this part is approved for
      - name: part_number
        type: string
        source: input
        description: Manufacturer part number, unique within model_spec_id
        constraints: unique per model_spec_id
      - name: component_code
        type: enum
        source: input
        description: Component this part replaces
        constraints: "one of {SHELL, LINER, FACEMASK, CHINSTRAP, HARDWARE}"
      - name: oem_approved
        type: boolean
        source: input
        description: True only for components the manufacturer approves for reconditioning
      - name: unit_price_cents
        type: integer
        source: input
        description: Billable price per unit of quantity, in cents
        constraints: ">= 0"
      - name: received_qty
        type: integer
        source: input
        description: Total units ever received into the parts cage; fixed at creation
        constraints: ">= 0"
      - name: on_hand_qty
        type: integer
        source: computed
        description: Unreserved stock; initialised to received_qty at creation
      - name: reserved_qty
        type: integer
        source: computed
        description: Stock committed to submitted RepairOrders but not yet installed
        default: 0
      - name: consumed_qty
        type: integer
        source: computed
        description: Stock consumed by installed part lines
        default: 0

  - name: TestBench
    parent: null
    common_fields: true
    fields:
      - name: bench_code
        type: string
        source: input
        description: Plant identifier of the impact rig, unique across TestBench rows
        constraints: unique
      - name: test_type
        type: enum
        source: input
        description: Rig type
        constraints: "one of {DROP_IMPACT, PNEUMATIC_RAM}"
      - name: cooldown_minutes
        type: integer
        source: input
        description: Minutes of rig cooldown that must surround every session window
        default: 45
        constraints: 0..240
      - name: daily_session_quota
        type: integer
        source: input
        description: Maximum shell-test sessions this bench may hold per UTC calendar day
        constraints: ">= 1"
      - name: calibration_valid_until
        type: datetime
        source: system
        description: >-
          Calibration expiry written by the calibrate endpoint; null until the
          bench has been calibrated once
        default: null

  - name: LoanerUnit
    parent: null
    common_fields: true
    fields:
      - name: model_spec_id
        type: string
        source: input
        description: FK -> ModelSpec.id; loaners are only interchangeable within a model
      - name: asset_tag
        type: string
        source: input
        description: Plant asset tag, unique across LoanerUnit rows
        constraints: unique
      - name: condition_grade
        type: enum
        source: input
        description: Cosmetic/fit grade used as the loaner ranking key
        constraints: "one of {A, B, C}"
      - name: certification_valid_until
        type: datetime
        source: input
        description: Expiry of this loaner's own recertification
      - name: assignment_count
        type: integer
        source: computed
        description: Number of LoanerAssignment rows ever created against this loaner
        default: 0
      - name: status
        type: enum
        source: computed
        description: >-
          AVAILABLE when no LoanerAssignment with status IN {RESERVED,
          OUT_ON_LOAN} references it; otherwise it mirrors the status of the
          earliest-starting active assignment (a loaner may legitimately hold
          several non-overlapping future bookings)
        default: AVAILABLE
        constraints: "one of {AVAILABLE, RESERVED, OUT_ON_LOAN}"

  - name: IntakeShipment
    parent: null
    common_fields: true
    fields:
      - name: customer_account_id
        type: string
        source: input
        description: FK -> CustomerAccount.id; the program that shipped the equipment
      - name: sport
        type: enum
        source: input
        description: Sport the shipment belongs to
        constraints: "one of {FOOTBALL, LACROSSE, HOCKEY, BASEBALL}"
      - name: service_tier
        type: enum
        source: input
        description: Commercial tier; drives rush multiplier and base turnaround days
        constraints: "one of {STANDARD, SEASONAL_CONTRACT, PRIORITY_RUSH}"
      - name: declared_unit_count
        type: integer
        source: input
        description: Unit count the program declared on its packing list
        constraints: ">= 1"
      - name: season_start_date
        type: datetime
        source: input
        description: First day of the program's competitive season (UTC midnight)
      - name: season_end_date
        type: datetime
        source: input
        description: Last day of the program's competitive season (UTC midnight)
        constraints: must be strictly after season_start_date
      - name: counted_unit_count
        type: integer
        source: system
        description: Units physically counted at the dock; written by the count endpoint
        default: null
      - name: discrepancy_count
        type: integer
        source: computed
        description: counted_unit_count - declared_unit_count; null before counting
        default: null
      - name: discrepancy_resolution
        type: enum
        source: system
        description: How the count discrepancy was closed at acceptance
        default: null
        constraints: "one of {MATCHED, CUSTOMER_CONFIRMED, WRITTEN_OFF}"
      - name: units_registered
        type: integer
        source: computed
        description: Count of EquipmentUnit rows whose intake_shipment_id is this shipment
        default: 0
      - name: units_in_process
        type: integer
        source: computed
        description: >-
          Units neither certified, condemned nor released; set to
          counted_unit_count at acceptance and moved by unit-level transitions
        default: 0
      - name: units_certified
        type: integer
        source: computed
        description: Units whose recon_status == CERTIFIED and custody_status != RETURNED
        default: 0
      - name: units_condemned
        type: integer
        source: computed
        description: Units whose recon_status == CONDEMNED
        default: 0
      - name: units_released
        type: integer
        source: computed
        description: Units whose custody_status == RETURNED
        default: 0
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant the shipment was accepted; null before that
        default: null
      - name: raw_due_at
        type: datetime
        source: computed
        description: Unclipped turnaround date from calc turnaround_commitment
        default: null
      - name: committed_due_at
        type: datetime
        source: computed
        description: Season-clipped turnaround date the plant commits to
        default: null
      - name: loaner_required
        type: boolean
        source: computed
        description: True when raw_due_at is strictly later than committed_due_at
        default: false
      - name: provisional_total_cents
        type: integer
        source: computed
        description: PROVISIONAL variant of calc shipment_settlement_total, written at acceptance
        default: null
      - name: final_total_cents
        type: integer
        source: computed
        description: FINAL variant of calc shipment_settlement_total, written at settlement
        default: null
      - name: settlement_locked
        type: boolean
        source: computed
        description: True once settled; reset to false when a shipment reverts to IN_PROCESS
        default: false
      - name: status
        type: enum
        source: computed
        description: Shipment lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, COUNTED, QUARANTINED, ACCEPTED, IN_PROCESS, READY_FOR_RETURN, CLOSED}"

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - name: intake_shipment_id
        type: string
        source: input
        description: FK -> IntakeShipment.id; the shipment this unit arrived in
      - name: serial_number
        type: string
        source: input
        description: Manufacturer serial stamped in the shell, unique within the shipment
        constraints: unique per intake_shipment_id
      - name: declared_model_code
        type: string
        source: input
        description: Model code the program claimed on its packing list; may be null
        default: null
      - name: model_spec_id
        type: string
        source: system
        description: FK -> ModelSpec.id; written by the identify endpoint, null before that
        default: null
      - name: manufacture_date
        type: datetime
        source: system
        description: Date-of-manufacture read off the shell at identification (UTC midnight)
        default: null
      - name: age_basis
        type: enum
        source: system
        description: >-
          Which age variant of calc unit_service_age applies to this unit;
          chosen at identification and frozen thereafter
        default: null
        constraints: "one of {MANUFACTURE_DATE, FIRST_SEASON}"
      - name: service_age_years
        type: integer
        source: computed
        description: Whole-year age from calc unit_service_age under age_basis
        default: null
      - name: life_expired
        type: boolean
        source: computed
        description: True when service_age_years >= ModelSpec.max_service_life_years
        default: false
      - name: inspection_verdict_summary
        type: enum
        source: computed
        description: >-
          PENDING before the required component set is complete; FAIL when any
          SHELL inspection verdict is FAIL; REPLACE_REQUIRED when any verdict IN
          {REPLACE, FAIL} on a non-SHELL code; CLEAR otherwise
        default: PENDING
        constraints: "one of {PENDING, CLEAR, REPLACE_REQUIRED, FAIL}"
      - name: condemn_required
        type: boolean
        source: computed
        description: >-
          True when life_expired == true OR inspection_verdict_summary == FAIL OR
          the unit's ModelSpec.reconditionable == false
        default: false
      - name: warranty_coverage
        type: enum
        source: computed
        description: >-
          IN_WARRANTY when service_age_years <= ModelSpec.warranty_years, else
          OUT_OF_WARRANTY; PENDING before identification
        default: PENDING
        constraints: "one of {PENDING, IN_WARRANTY, OUT_OF_WARRANTY}"
      - name: retest_count
        type: integer
        source: computed
        description: Number of shell tests beyond the first created for this unit
        default: 0
      - name: current_si
        type: number
        source: computed
        description: severity_index of the most recent ShellTest whose status != SCHEDULED
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: Clock instant the ACTIVE CertificationLabel was issued; null otherwise
        default: null
      - name: record_retention_until
        type: datetime
        source: computed
        description: >-
          certified_at + ModelSpec.record_retention_years for certified units, or
          destruction verified_at + ModelSpec.record_retention_years for
          destroyed units; null while neither has happened
        default: null
      - name: records_purged_at
        type: datetime
        source: system
        description: Clock instant the retention purge was executed; null before that
        default: null
      - name: condemn_reason
        type: enum
        source: system
        description: Why the unit was condemned; null unless recon_status == CONDEMNED
        default: null
        constraints: "one of {SI_EXCEEDS_LIMIT, COMPONENT_FAIL, LIFE_EXPIRED, NOT_RECONDITIONABLE, REPAIR_UNSUCCESSFUL}"
      - name: recon_status
        type: enum
        source: computed
        description: Reconditioning axis of the unit's state (independent of custody_status)
        default: RECEIVED
        constraints: "one of {RECEIVED, IDENTIFIED, DISASSEMBLED, INSPECTED, TESTED, TEST_PASSED, REPAIR_PENDING, REPAIRED, CERTIFIED, CONDEMNED}"
      - name: custody_status
        type: enum
        source: computed
        description: Physical-custody axis of the unit's state (independent of recon_status)
        default: AT_PLANT
        constraints: "one of {AT_PLANT, STAGED_FOR_RETURN, RETURNED, PENDING_DISPOSAL, DISPOSED}"
      - name: released_to
        type: string
        source: system
        description: Printed name of the program agent who took custody at release
        default: null

  - name: ComponentInspection
    parent: null
    common_fields: false
    fields:
      - name: equipment_unit_id
        type: string
        source: input
        description: FK -> EquipmentUnit.id; the disassembled unit inspected
      - name: component_code
        type: enum
        source: input
        description: Component inspected; at most one inspection per code per unit
        constraints: "one of {SHELL, LINER, FACEMASK, CHINSTRAP, HARDWARE}"
      - name: measurement_value
        type: number
        source: input
        description: Measured value of the criterion metric
      - name: measurement_unit
        type: string
        source: input
        description: Unit of measure as recorded by the technician
      - name: note
        type: string
        source: input
        description: Free-text technician note
        default: null
      - name: replace_threshold_applied
        type: number
        source: computed
        description: replace_threshold copied from the unit's ModelSpec.component_criteria
      - name: fail_threshold_applied
        type: number
        source: computed
        description: fail_threshold copied from the unit's ModelSpec.component_criteria
      - name: metric_direction_applied
        type: string
        source: computed
        description: metric_direction copied from the unit's ModelSpec.component_criteria
      - name: verdict
        type: enum
        source: computed
        description: Output of calc component_inspection_verdict
        constraints: "one of {PASS, REPLACE, FAIL}"
      - name: inspector_user_id
        type: string
        source: system
        description: X-User-ID of the Technician who recorded the measurement

  - name: ShellTest
    parent: null
    common_fields: true
    fields:
      - name: equipment_unit_id
        type: string
        source: input
        description: FK -> EquipmentUnit.id; the shell under test
      - name: test_bench_id
        type: string
        source: input
        description: FK -> TestBench.id; the rig occupied by this session
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the bench session window
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the bench session window; must be after window_start
      - name: conditioning
        type: enum
        source: input
        description: Environmental conditioning applied before the drops
        constraints: "one of {AMBIENT, HOT, COLD}"
      - name: attempt_index
        type: integer
        source: computed
        description: 1 for the unit's first ShellTest, incremented per additional session
      - name: peak_g_front
        type: number
        source: system
        description: Peak g at the front impact site; null until impacts are recorded
        default: null
      - name: peak_g_side
        type: number
        source: system
        description: Peak g at the side impact site; null until impacts are recorded
        default: null
      - name: peak_g_crown
        type: number
        source: system
        description: Peak g at the crown impact site; null until impacts are recorded
        default: null
      - name: severity_index
        type: number
        source: computed
        description: Output of calc shell_test_severity_index, one decimal place
        default: null
      - name: computed_result
        type: enum
        source: computed
        description: Machine determination from severity_index against the ModelSpec bands
        default: null
        constraints: "one of {PASS, REPAIR, CONDEMN}"
      - name: determination
        type: enum
        source: system
        description: Determination signed by the CertifyingInspector
        default: null
        constraints: "one of {PASS, REPAIR, CONDEMN}"
      - name: override_reason
        type: string
        source: system
        description: Required when determination differs from computed_result
        default: null
      - name: determined_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertifyingInspector who signed the determination
        default: null
      - name: status
        type: enum
        source: computed
        description: Session lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, DETERMINED}"

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - name: equipment_unit_id
        type: string
        source: input
        description: FK -> EquipmentUnit.id; the unit being repaired
      - name: part_lines
        type: array
        source: computed
        description: >-
          Value objects appended by the part-lines endpoint, one per replacement
          component: { line_index, approved_part_id, part_number, component_code,
          quantity, lot_code, oem_cert_ref, unit_price_cents_snapshot,
          line_total_cents, status }; line_index starts at 1 and increases by one
          per appended line
        default: []
      - name: reserved_parts_cents
        type: integer
        source: computed
        description: Sum of line_total_cents over part_lines whose status == RESERVED
        default: 0
      - name: installed_parts_cents
        type: integer
        source: computed
        description: Sum of line_total_cents over part_lines whose status == INSTALLED
        default: 0
      - name: labor_cents
        type: integer
        source: computed
        description: REPAIR_LABOR_CENTS (4500) once status == CLOSED, otherwise 0
        default: 0
      - name: warranty_claim_ref
        type: string
        source: input
        description: Manufacturer warranty claim number supplied at installation
        default: null
      - name: verification_failure_count
        type: integer
        source: computed
        description: Number of verify calls whose outcome was FAILED on this order
        default: 0
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the Technician who created the order
      - name: installed_by_user_id
        type: string
        source: system
        description: X-User-ID of the Technician who ran the install step
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the Technician who signed the passing verification
        default: null
      - name: cancel_reason
        type: string
        source: system
        description: Reason recorded when the order is cancelled
        default: null
      - name: status
        type: enum
        source: computed
        description: Repair order lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, PARTS_PENDING, INSTALLED, CLOSED, CANCELLED}"

  - name: CertificationLabel
    parent: null
    common_fields: true
    fields:
      - name: equipment_unit_id
        type: string
        source: input
        description: FK -> EquipmentUnit.id; the recertified unit the label is affixed to
      - name: label_code
        type: string
        source: computed
        description: Traceability code from calc certification_label_code
      - name: standard_code_snapshot
        type: string
        source: computed
        description: ModelSpec.standard_code copied at issuance
      - name: certified_on
        type: datetime
        source: computed
        description: Logical-clock instant of issuance
      - name: daily_sequence
        type: integer
        source: computed
        description: Plant-wide sequence number of this label within its certified_on date
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertifyingInspector who issued the label
      - name: void_reason
        type: string
        source: system
        description: Reason recorded when the label is voided
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: Clock instant the label was voided
        default: null
      - name: voided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who voided the label
        default: null
      - name: status
        type: enum
        source: computed
        description: Label lifecycle state
        default: ACTIVE
        constraints: "one of {ACTIVE, VOIDED}"

  - name: DestructionRecord
    parent: null
    common_fields: true
    fields:
      - name: equipment_unit_id
        type: string
        source: system
        description: FK -> EquipmentUnit.id; the condemned unit awaiting destruction
      - name: condemn_reason_snapshot
        type: enum
        source: computed
        description: EquipmentUnit.condemn_reason copied when the record is created
        constraints: "one of {SI_EXCEEDS_LIMIT, COMPONENT_FAIL, LIFE_EXPIRED, NOT_RECONDITIONABLE, REPAIR_UNSUCCESSFUL}"
      - name: method
        type: enum
        source: system
        description: Destruction method recorded by the witness step
        default: null
        constraints: "one of {SHELL_CRUSH, BAND_SAW_CUT, SHREDDING}"
      - name: witness_name
        type: string
        source: system
        description: Printed name of the destruction witness
        default: null
      - name: witnessed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who witnessed destruction
        default: null
      - name: witnessed_at
        type: datetime
        source: system
        description: Clock instant of witnessing
        default: null
      - name: verification_ref
        type: string
        source: system
        description: Photo/scale-ticket reference proving the shell cannot re-enter resale
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who verified destruction
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: Clock instant of verification
        default: null
      - name: status
        type: enum
        source: computed
        description: Destruction record lifecycle state
        default: PENDING
        constraints: "one of {PENDING, WITNESSED, VERIFIED}"

  - name: LoanerAssignment
    parent: null
    common_fields: true
    fields:
      - name: customer_account_id
        type: string
        source: input
        description: FK -> CustomerAccount.id; the program borrowing the loaner
      - name: requested_model_spec_id
        type: string
        source: input
        description: FK -> ModelSpec.id; loaners are only substitutable within a model
      - name: loaner_unit_id
        type: string
        source: input
        description: >-
          FK -> LoanerUnit.id; optional on request, filled by calc
          loaner_unit_selection when the caller omits it
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the loan window
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the loan window; must be after window_start
      - name: selected_by
        type: enum
        source: computed
        description: EXPLICIT when the caller supplied loaner_unit_id, else SERVER_SELECTED
        constraints: "one of {EXPLICIT, SERVER_SELECTED}"
      - name: returned_at
        type: datetime
        source: system
        description: Clock instant the loaner came back; null before return
        default: null
      - name: status
        type: enum
        source: computed
        description: >-
          RESERVED when window_start > clock at creation, OUT_ON_LOAN when
          window_start <= clock at creation, RETURNED after the return endpoint
        default: RESERVED
        constraints: "one of {RESERVED, OUT_ON_LOAN, RETURNED}"

# =============================================================================
# §1.2 State Machine Table  (9 machines; EquipmentUnit carries two independent
#      state axes on the same row)
# =============================================================================
state_machines:

  - entity: IntakeShipment
    state_field: status
    shape: branching + compound + revert
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: COUNTED
        trigger: "POST /intake-shipments/{id}/count"
        actor: IntakeClerk
        preconditions:
          - "shipment.status == DRAFT"
          - "counted_unit_count >= 1"
        side_effects:
          - "sets counted_unit_count from the request"
          - "recomputes discrepancy_count = counted_unit_count - declared_unit_count"
          - "increments IntakeShipment.version by 1"
        note: "Fork guard: the count endpoint routes to COUNTED only when discrepancy_count == 0."
      - from: DRAFT
        to: QUARANTINED
        trigger: "POST /intake-shipments/{id}/count"
        actor: IntakeClerk
        preconditions:
          - "shipment.status == DRAFT"
          - "counted_unit_count >= 1"
        side_effects:
          - "sets counted_unit_count from the request"
          - "recomputes discrepancy_count = counted_unit_count - declared_unit_count"
          - "increments IntakeShipment.version by 1"
        note: "Taken instead of DRAFT->COUNTED when discrepancy_count != 0; the two branches rejoin at ACCEPTED."
      - from: COUNTED
        to: ACCEPTED
        trigger: "POST /intake-shipments/{id}/accept"
        actor: IntakeClerk
        preconditions:
          - "shipment.status == COUNTED"
          - "units_registered == counted_unit_count"
          - "discrepancy_resolution == MATCHED (the only value permitted from COUNTED)"
          - "CustomerAccount.liability_waiver_status == ON_FILE"
        side_effects:
          - "sets accepted_at = logical clock"
          - "sets units_in_process = counted_unit_count; units_certified = units_condemned = units_released = 0"
          - "runs calc turnaround_commitment writing raw_due_at, committed_due_at, loaner_required"
          - "runs calc shipment_settlement_total variant PROVISIONAL writing provisional_total_cents"
          - "increments CustomerAccount.open_shipment_count by 1 and clears CustomerAccount.loaner_recall_due_at to null"
          - "increments IntakeShipment.version by 1"
      - from: QUARANTINED
        to: ACCEPTED
        trigger: "POST /intake-shipments/{id}/accept"
        actor: IntakeClerk
        preconditions:
          - "shipment.status == QUARANTINED"
          - "units_registered == counted_unit_count"
          - "discrepancy_resolution IN {CUSTOMER_CONFIRMED, WRITTEN_OFF} (MATCHED is rejected from QUARANTINED)"
          - "CustomerAccount.liability_waiver_status == ON_FILE"
        side_effects:
          - "identical side-effect set to COUNTED->ACCEPTED, plus persists the discrepancy_resolution value"
        note: "Join point of the count fork; the two branches differ only in the accepted discrepancy_resolution set."
      - from: ACCEPTED
        to: IN_PROCESS
        trigger: "system: first EquipmentUnit of the shipment leaves recon_status RECEIVED"
        actor: system
        preconditions:
          - "shipment.status == ACCEPTED"
        side_effects:
          - "increments IntakeShipment.version by 1"
      - from: IN_PROCESS
        to: READY_FOR_RETURN
        trigger: "system: units_in_process reaches 0 after a unit-level cascade"
        actor: system
        preconditions:
          - "shipment.status == IN_PROCESS"
          - "units_in_process == 0"
        side_effects:
          - "decrements CustomerAccount.open_shipment_count by 1"
          - "when CustomerAccount.open_shipment_count reaches 0, sets CustomerAccount.loaner_recall_due_at = clock + LOANER_RECALL_GRACE_DAYS (14)"
          - "increments IntakeShipment.version by 1"
      - from: READY_FOR_RETURN
        to: IN_PROCESS
        trigger: "system: a CertificationLabel void returns a unit to REPAIR_PENDING"
        actor: system
        preconditions:
          - "shipment.status == READY_FOR_RETURN"
          - "shipment.settlement_locked == false"
        side_effects:
          - "sets settlement_locked = false and final_total_cents = null"
          - "increments CustomerAccount.open_shipment_count by 1 and clears CustomerAccount.loaner_recall_due_at to null"
          - "increments IntakeShipment.version by 1"
        note: "Revert edge; makes the shipment machine non-linear."
      - from: READY_FOR_RETURN
        to: CLOSED
        trigger: "POST /intake-shipments/{id}/settle"
        actor: PlantManager
        preconditions:
          - "shipment.status == READY_FOR_RETURN"
          - "shipment.settlement_locked == false"
          - "units_in_process == 0"
        side_effects:
          - "runs calc shipment_settlement_total variant FINAL writing final_total_cents"
          - "sets settlement_locked = true"
          - "increments IntakeShipment.version by 1"

  - entity: EquipmentUnit
    state_field: recon_status
    shape: branching + cyclic
    initial_state: RECEIVED
    terminal_states: [CONDEMNED]
    transitions:
      - from: RECEIVED
        to: IDENTIFIED
        trigger: "POST /equipment-units/{id}/identify"
        actor: IntakeClerk
        preconditions:
          - "unit.recon_status == RECEIVED"
          - "parent IntakeShipment.status IN {ACCEPTED, IN_PROCESS}"
          - "referenced ModelSpec exists"
        side_effects:
          - "sets model_spec_id, manufacture_date, age_basis"
          - "runs calc unit_service_age writing service_age_years and life_expired"
          - "recomputes warranty_coverage and condemn_required"
          - "when parent shipment.status == ACCEPTED, drives IntakeShipment ACCEPTED->IN_PROCESS"
          - "increments EquipmentUnit.version by 1"
      - from: IDENTIFIED
        to: DISASSEMBLED
        trigger: "POST /equipment-units/{id}/disassemble"
        actor: Technician
        preconditions:
          - "unit.recon_status == IDENTIFIED"
          - "unit.model_spec_id is not null"
        side_effects:
          - "increments EquipmentUnit.version by 1"
      - from: DISASSEMBLED
        to: INSPECTED
        trigger: "system: the ComponentInspection set covers every code in ModelSpec.required_component_codes"
        actor: system
        preconditions:
          - "unit.recon_status == DISASSEMBLED"
        side_effects:
          - "recomputes inspection_verdict_summary from all ComponentInspection verdicts of this unit"
          - "recomputes condemn_required"
          - "increments EquipmentUnit.version by 1"
      - from: INSPECTED
        to: TESTED
        trigger: "POST /shell-tests/{id}/record-impacts"
        actor: Technician
        preconditions:
          - "unit.recon_status IN {INSPECTED, REPAIRED}"
          - "the ShellTest referenced has status == SCHEDULED and equipment_unit_id == unit.id"
        side_effects:
          - "sets current_si = ShellTest.severity_index"
          - "increments EquipmentUnit.version by 1"
      - from: REPAIRED
        to: TESTED
        trigger: "POST /shell-tests/{id}/record-impacts"
        actor: Technician
        preconditions:
          - "unit.recon_status == REPAIRED"
          - "the ShellTest referenced has status == SCHEDULED and equipment_unit_id == unit.id"
        side_effects:
          - "sets current_si = ShellTest.severity_index"
          - "increments EquipmentUnit.version by 1"
        note: "Closes the recertification cycle TESTED -> REPAIR_PENDING -> REPAIRED -> TESTED."
      - from: TESTED
        to: TEST_PASSED
        trigger: "POST /shell-tests/{id}/determine with determination == PASS"
        actor: CertifyingInspector
        preconditions:
          - "unit.recon_status == TESTED"
          - "unit.condemn_required == false"
        side_effects:
          - "sets ShellTest.determination = PASS and ShellTest.status = DETERMINED"
          - "increments EquipmentUnit.version by 1"
      - from: TESTED
        to: REPAIR_PENDING
        trigger: "POST /shell-tests/{id}/determine with determination == REPAIR"
        actor: CertifyingInspector
        preconditions:
          - "unit.recon_status == TESTED"
          - "unit.condemn_required == false"
        side_effects:
          - "sets ShellTest.determination = REPAIR and ShellTest.status = DETERMINED"
          - "increments EquipmentUnit.version by 1"
      - from: TESTED
        to: CONDEMNED
        trigger: "POST /shell-tests/{id}/determine with determination == CONDEMN"
        actor: CertifyingInspector
        preconditions:
          - "unit.recon_status == TESTED"
        side_effects:
          - "sets ShellTest.determination = CONDEMN and ShellTest.status = DETERMINED"
          - "sets condemn_reason = SI_EXCEEDS_LIMIT (or COMPONENT_FAIL when inspection_verdict_summary == FAIL, or LIFE_EXPIRED when life_expired == true; first matching in the order LIFE_EXPIRED, COMPONENT_FAIL, SI_EXCEEDS_LIMIT)"
          - "cascade hop 1: sets custody_status AT_PLANT -> PENDING_DISPOSAL on this unit"
          - "cascade hop 2: creates a DestructionRecord with status PENDING and condemn_reason_snapshot copied from this unit"
          - "cascade hop 3: on the parent IntakeShipment decrements units_in_process by 1 and increments units_condemned by 1"
          - "cascade hop 4: when the parent shipment's units_in_process reaches 0, drives IntakeShipment IN_PROCESS->READY_FOR_RETURN, which itself decrements CustomerAccount.open_shipment_count and may set CustomerAccount.loaner_recall_due_at"
          - "increments EquipmentUnit.version by 1"
      - from: REPAIR_PENDING
        to: REPAIRED
        trigger: "POST /repair-orders/{id}/verify with outcome == PASSED"
        actor: Technician
        preconditions:
          - "unit.recon_status == REPAIR_PENDING"
          - "the RepairOrder has status == INSTALLED and equipment_unit_id == unit.id"
        side_effects:
          - "sets RepairOrder.status = CLOSED and RepairOrder.labor_cents = REPAIR_LABOR_CENTS (4500)"
          - "increments EquipmentUnit.version by 1"
      - from: REPAIR_PENDING
        to: CONDEMNED
        trigger: "POST /repair-orders/{id}/verify with outcome == FAILED exceeding MAX_VERIFICATION_ATTEMPTS"
        actor: Technician
        preconditions:
          - "unit.recon_status == REPAIR_PENDING"
          - "the RepairOrder has status == INSTALLED"
          - "RepairOrder.verification_failure_count + 1 > MAX_VERIFICATION_ATTEMPTS (2)"
        side_effects:
          - "sets RepairOrder.status = CANCELLED, increments its verification_failure_count by 1 and sets cancel_reason = 'verification attempts exhausted'"
          - "sets condemn_reason = REPAIR_UNSUCCESSFUL"
          - "runs the same four-hop condemnation cascade as TESTED->CONDEMNED (custody PENDING_DISPOSAL, DestructionRecord PENDING, shipment counters, shipment/account rollup)"
          - "increments EquipmentUnit.version by 1"
      - from: TEST_PASSED
        to: CERTIFIED
        trigger: "POST /certification-labels"
        actor: CertifyingInspector
        preconditions:
          - "unit.recon_status == TEST_PASSED"
          - "unit.condemn_required == false"
          - "parent shipment's CustomerAccount.status == ACTIVE"
          - "expected_equipment_unit_version matches EquipmentUnit.version"
        side_effects:
          - "creates a CertificationLabel with status ACTIVE and label_code from calc certification_label_code"
          - "sets certified_at = clock and record_retention_until = certified_at + ModelSpec.record_retention_years"
          - "on the parent IntakeShipment decrements units_in_process by 1 and increments units_certified by 1"
          - "when the parent shipment's units_in_process reaches 0, drives IntakeShipment IN_PROCESS->READY_FOR_RETURN"
          - "increments EquipmentUnit.version by 1"
      - from: CERTIFIED
        to: REPAIR_PENDING
        trigger: "POST /certification-labels/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "unit.recon_status == CERTIFIED"
          - "unit.custody_status IN {AT_PLANT, STAGED_FOR_RETURN}"
          - "parent IntakeShipment.settlement_locked == false"
        side_effects:
          - "cascade hop 1: sets CertificationLabel.status = VOIDED, voided_at, voided_by_user_id, void_reason"
          - "cascade hop 2: clears certified_at and record_retention_until to null on this unit"
          - "cascade hop 3: on the parent IntakeShipment decrements units_certified by 1 and increments units_in_process by 1"
          - "cascade hop 4: when the parent shipment.status == READY_FOR_RETURN, drives IntakeShipment READY_FOR_RETURN->IN_PROCESS, which itself clears final_total_cents, sets settlement_locked = false, increments CustomerAccount.open_shipment_count by 1 and clears CustomerAccount.loaner_recall_due_at"
          - "increments EquipmentUnit.version by 1"
        note: "Compensating transition; the mirror image of TEST_PASSED->CERTIFIED."
      - from: IDENTIFIED
        to: CONDEMNED
        trigger: "POST /equipment-units/{id}/condemn"
        actor: CertifyingInspector
        preconditions:
          - "unit.recon_status IN {IDENTIFIED, DISASSEMBLED, INSPECTED}"
          - "unit.condemn_required == true"
        side_effects:
          - "sets condemn_reason to LIFE_EXPIRED, COMPONENT_FAIL or NOT_RECONDITIONABLE (first match in that order)"
          - "runs the same four-hop condemnation cascade as TESTED->CONDEMNED"
          - "increments EquipmentUnit.version by 1"
      - from: INSPECTED
        to: CONDEMNED
        trigger: "POST /equipment-units/{id}/condemn"
        actor: CertifyingInspector
        preconditions:
          - "unit.recon_status IN {IDENTIFIED, DISASSEMBLED, INSPECTED}"
          - "unit.condemn_required == true"
        side_effects:
          - "identical to IDENTIFIED->CONDEMNED"

  - entity: EquipmentUnit
    state_field: custody_status
    shape: branching (second independent axis on the same row)
    initial_state: AT_PLANT
    terminal_states: [RETURNED, DISPOSED]
    transitions:
      - from: AT_PLANT
        to: STAGED_FOR_RETURN
        trigger: "POST /equipment-units/{id}/stage-return"
        actor: IntakeClerk
        preconditions:
          - "unit.custody_status == AT_PLANT"
          - "unit.recon_status == CERTIFIED"
        side_effects:
          - "increments EquipmentUnit.version by 1"
        note: "Does not touch recon_status; the two axes advance under different endpoints."
      - from: STAGED_FOR_RETURN
        to: RETURNED
        trigger: "POST /equipment-units/{id}/release"
        actor: IntakeClerk
        preconditions:
          - "unit.custody_status == STAGED_FOR_RETURN"
          - "unit.recon_status == CERTIFIED"
          - "CustomerAccount.liability_waiver_status == ON_FILE"
        side_effects:
          - "sets released_to from the request"
          - "on the parent IntakeShipment decrements units_certified by 1 and increments units_released by 1"
          - "increments EquipmentUnit.version by 1"
      - from: AT_PLANT
        to: PENDING_DISPOSAL
        trigger: "system: the unit's recon_status becomes CONDEMNED"
        actor: system
        preconditions:
          - "unit.custody_status == AT_PLANT"
        side_effects:
          - "increments EquipmentUnit.version by 1"
      - from: PENDING_DISPOSAL
        to: DISPOSED
        trigger: "POST /destruction-records/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "unit.custody_status == PENDING_DISPOSAL"
          - "the DestructionRecord has status == WITNESSED"
        side_effects:
          - "sets record_retention_until = clock + ModelSpec.record_retention_years"
          - "increments EquipmentUnit.version by 1"

  - entity: ShellTest
    state_field: status
    shape: linear
    initial_state: SCHEDULED
    terminal_states: [DETERMINED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /shell-tests/{id}/record-impacts"
        actor: Technician
        preconditions:
          - "test.status == SCHEDULED"
          - "TestBench.calibration_valid_until >= logical clock"
          - "unit.recon_status IN {INSPECTED, REPAIRED}"
        side_effects:
          - "stores peak_g_front, peak_g_side, peak_g_crown"
          - "runs calc shell_test_severity_index writing severity_index and computed_result"
          - "drives EquipmentUnit INSPECTED->TESTED or REPAIRED->TESTED and sets unit.current_si"
          - "increments ShellTest.version by 1"
      - from: COMPLETED
        to: DETERMINED
        trigger: "POST /shell-tests/{id}/determine"
        actor: CertifyingInspector
        preconditions:
          - "test.status == COMPLETED"
          - "determination == computed_result, or override_reason is present and the determination is strictly more severe (PASS < REPAIR < CONDEMN)"
          - "when unit.condemn_required == true, determination must be CONDEMN"
        side_effects:
          - "sets determination, override_reason, determined_by_user_id"
          - "drives the matching EquipmentUnit recon transition out of TESTED"
          - "increments ShellTest.version by 1"

  - entity: RepairOrder
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PARTS_PENDING
        trigger: "POST /repair-orders/{id}/submit"
        actor: Technician
        preconditions:
          - "order.status == DRAFT"
          - "part_lines is non-empty"
          - "for every line, ApprovedPart.on_hand_qty >= line.quantity"
        side_effects:
          - "for every line: ApprovedPart.on_hand_qty -= quantity and ApprovedPart.reserved_qty += quantity; line.status DRAFT -> RESERVED"
          - "recomputes reserved_parts_cents"
          - "increments RepairOrder.version by 1"
      - from: PARTS_PENDING
        to: INSTALLED
        trigger: "POST /repair-orders/{id}/install"
        actor: Technician
        preconditions:
          - "order.status == PARTS_PENDING"
          - "when unit.warranty_coverage == IN_WARRANTY, warranty_claim_ref must be present"
        side_effects:
          - "for every line with status RESERVED: ApprovedPart.reserved_qty -= quantity and ApprovedPart.consumed_qty += quantity; line.status RESERVED -> INSTALLED"
          - "recomputes reserved_parts_cents and installed_parts_cents"
          - "sets installed_by_user_id = X-User-ID"
          - "increments RepairOrder.version by 1"
      - from: INSTALLED
        to: CLOSED
        trigger: "POST /repair-orders/{id}/verify with outcome == PASSED"
        actor: Technician
        preconditions:
          - "order.status == INSTALLED"
          - "X-User-ID != installed_by_user_id (segregation of duties)"
        side_effects:
          - "sets verified_by_user_id = X-User-ID and labor_cents = REPAIR_LABOR_CENTS (4500)"
          - "drives EquipmentUnit REPAIR_PENDING->REPAIRED"
          - "increments RepairOrder.version by 1"
      - from: INSTALLED
        to: PARTS_PENDING
        trigger: "POST /repair-orders/{id}/verify with outcome == FAILED, attempts remaining"
        actor: Technician
        preconditions:
          - "order.status == INSTALLED"
          - "X-User-ID != installed_by_user_id"
          - "verification_failure_count + 1 <= MAX_VERIFICATION_ATTEMPTS (2)"
        side_effects:
          - "increments verification_failure_count by 1"
          - "leaves already-installed lines in status INSTALLED (parts are consumed, not returned)"
          - "increments RepairOrder.version by 1"
        note: "Cycle edge: the order can loop INSTALLED -> PARTS_PENDING -> INSTALLED up to MAX_VERIFICATION_ATTEMPTS times."
      - from: INSTALLED
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/verify with outcome == FAILED, attempts exhausted"
        actor: Technician
        preconditions:
          - "order.status == INSTALLED"
          - "X-User-ID != installed_by_user_id"
          - "verification_failure_count + 1 > MAX_VERIFICATION_ATTEMPTS (2)"
        side_effects:
          - "increments verification_failure_count by 1 (so the counter records every failed attempt, including the exhausting one)"
          - "sets cancel_reason = 'verification attempts exhausted'"
          - "drives EquipmentUnit REPAIR_PENDING->CONDEMNED with condemn_reason REPAIR_UNSUCCESSFUL and its four-hop cascade"
          - "increments RepairOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/cancel"
        actor: Technician
        preconditions:
          - "order.status IN {DRAFT, PARTS_PENDING}"
        side_effects:
          - "sets cancel_reason from the request"
          - "increments RepairOrder.version by 1"
      - from: PARTS_PENDING
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/cancel"
        actor: Technician
        preconditions:
          - "order.status IN {DRAFT, PARTS_PENDING}"
        side_effects:
          - "for every line with status RESERVED: ApprovedPart.reserved_qty -= quantity and ApprovedPart.on_hand_qty += quantity; line.status RESERVED -> DRAFT"
          - "recomputes reserved_parts_cents to 0"
          - "sets cancel_reason from the request"
          - "increments RepairOrder.version by 1"
        note: "Compensating transition for DRAFT->PARTS_PENDING; conserves the part_stock_ledger identity."

  - entity: CertificationLabel
    state_field: status
    shape: linear
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /certification-labels/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "label.status == ACTIVE"
          - "unit.custody_status IN {AT_PLANT, STAGED_FOR_RETURN}"
          - "parent IntakeShipment.settlement_locked == false"
        side_effects:
          - "drives the EquipmentUnit CERTIFIED->REPAIR_PENDING compensation cascade (four hops)"
          - "increments CertificationLabel.version by 1"

  - entity: DestructionRecord
    state_field: status
    shape: linear
    initial_state: PENDING
    terminal_states: [VERIFIED]
    transitions:
      - from: PENDING
        to: WITNESSED
        trigger: "POST /destruction-records/{id}/witness"
        actor: ComplianceOfficer
        preconditions:
          - "record.status == PENDING"
          - "unit.custody_status == PENDING_DISPOSAL"
        side_effects:
          - "stores method, witness_name, witnessed_by_user_id, witnessed_at = clock"
          - "increments DestructionRecord.version by 1"
      - from: WITNESSED
        to: VERIFIED
        trigger: "POST /destruction-records/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "record.status == WITNESSED"
          - "X-User-ID != witnessed_by_user_id (segregation of duties)"
        side_effects:
          - "stores verification_ref, verified_by_user_id, verified_at = clock"
          - "drives EquipmentUnit PENDING_DISPOSAL->DISPOSED and sets record_retention_until"
          - "increments DestructionRecord.version by 1"

  - entity: LoanerAssignment
    state_field: status
    shape: linear
    initial_state: RESERVED
    terminal_states: [RETURNED]
    transitions:
      - from: RESERVED
        to: RETURNED
        trigger: "POST /loaner-assignments/{id}/return"
        actor: IntakeClerk
        preconditions:
          - "assignment.status IN {RESERVED, OUT_ON_LOAN}"
        side_effects:
          - "sets returned_at = clock"
          - "drives LoanerUnit RESERVED->AVAILABLE or OUT_ON_LOAN->AVAILABLE"
          - "increments LoanerAssignment.version by 1"
      - from: OUT_ON_LOAN
        to: RETURNED
        trigger: "POST /loaner-assignments/{id}/return"
        actor: IntakeClerk
        preconditions:
          - "assignment.status IN {RESERVED, OUT_ON_LOAN}"
        side_effects:
          - "identical to RESERVED->RETURNED"

  - entity: LoanerUnit
    state_field: status
    shape: cyclic
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /loaner-assignments with window_start > logical clock"
        actor: IntakeClerk
        preconditions:
          - "loaner.status == AVAILABLE"
        side_effects:
          - "increments assignment_count by 1"
          - "increments LoanerUnit.version by 1"
      - from: AVAILABLE
        to: OUT_ON_LOAN
        trigger: "POST /loaner-assignments with window_start <= logical clock"
        actor: IntakeClerk
        preconditions:
          - "loaner.status == AVAILABLE"
        side_effects:
          - "increments assignment_count by 1"
          - "increments LoanerUnit.version by 1"
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /loaner-assignments/{id}/return"
        actor: IntakeClerk
        preconditions:
          - "the referencing LoanerAssignment moves to RETURNED"
        side_effects:
          - "increments LoanerUnit.version by 1"
      - from: OUT_ON_LOAN
        to: AVAILABLE
        trigger: "POST /loaner-assignments/{id}/return"
        actor: IntakeClerk
        preconditions:
          - "the referencing LoanerAssignment moves to RETURNED"
        side_effects:
          - "increments LoanerUnit.version by 1"
        note: "Closes the loaner cycle AVAILABLE -> OUT_ON_LOAN -> AVAILABLE."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on EquipmentUnit.version only
# =============================================================================
concurrency_rules:
  - rule_id: label-issue-stale-unit
    parent_entity: EquipmentUnit
    write_endpoint: "POST /certification-labels"
    occ_field: "expected_equipment_unit_version"
    description: |
      Issuing a CertificationLabel against an EquipmentUnit whose version has
      advanced since the inspector last read it is rejected. A label issued
      after a repair legitimately supersedes the inspector's earlier view of the
      unit, so the operation cannot be rejected by a state precondition alone;
      the stale-version check is what separates the two views.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

  - rule_id: repair-order-create-stale-unit
    parent_entity: EquipmentUnit
    write_endpoint: "POST /repair-orders"
    occ_field: "expected_equipment_unit_version"
    description: |
      Creating a RepairOrder against an EquipmentUnit whose version has advanced
      since the technician last read it is rejected. A newly created order
      legitimately supersedes an earlier DRAFT order for the same unit, so a
      second create observing the same unit state would otherwise succeed; the
      stale-version check makes the outcome deterministic.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules  (9 rules; C1 and C3 are the two dual-variant rules)
# =============================================================================
calculations:

  - calc_id: unit_service_age
    name: "Equipment unit service age and life expiry"
    applies_to: EquipmentUnit
    algorithm_type: threshold
    trigger: "POST /equipment-units/{id}/identify"
    writes_fields: [service_age_years, life_expired]
    inputs:
      - "EquipmentUnit.manufacture_date (date)"
      - "EquipmentUnit.age_basis (enum MANUFACTURE_DATE | FIRST_SEASON, supplied at identify)"
      - "ModelSpec.max_service_life_years (integer)"
      - "logical clock current_utc"
    variants:
      - variant: MANUFACTURE_DATE
        selected_when: "EquipmentUnit.age_basis == MANUFACTURE_DATE"
        formula: "service_age_years = floor((date(current_utc) - manufacture_date).days / 365)"
      - variant: FIRST_SEASON
        selected_when: "EquipmentUnit.age_basis == FIRST_SEASON"
        formula: "service_age_years = year(current_utc) - year(manufacture_date)"
        note: |
          Season-anchored ageing counts competition seasons, not elapsed days: a
          unit manufactured in September 2016 has been through 10 seasons by
          August 2026 even though only 9 full years have elapsed.
    formula: |
      service_age_years = per-variant integer above (never negative; clamp at 0)
      life_expired = (service_age_years >= ModelSpec.max_service_life_years)
    constants:
      DAYS_PER_SERVICE_YEAR: 365
    precision:
      service_age_years: "integer, floor"
    worked_example: |
      clock = 2026-08-01T00:00:00Z, manufacture_date = 2016-09-15,
      ModelSpec.max_service_life_years = 10.
        MANUFACTURE_DATE: (2026-08-01 - 2016-09-15) = 3607 days;
                          floor(3607 / 365) = 9  -> life_expired = false
        FIRST_SEASON:     2026 - 2016 = 10       -> life_expired = true
      Same stored manufacture_date, opposite condemn_required outcome.
    downstream_effects:
      - "life_expired == true forces condemn_required = true, which blocks certification and forces determination CONDEMN"

  - calc_id: shell_test_severity_index
    name: "Shell impact severity index and computed result band"
    applies_to: ShellTest
    algorithm_type: weighted_scoring
    trigger: "POST /shell-tests/{id}/record-impacts"
    writes_fields: [severity_index, computed_result]
    inputs:
      - "ShellTest.peak_g_front, peak_g_side, peak_g_crown (decimal, from the request)"
      - "ShellTest.conditioning (enum AMBIENT | HOT | COLD, supplied when the session was created)"
      - "ModelSpec.shell_material (enum POLYCARBONATE | ABS)"
      - "ModelSpec.pass_si_max, ModelSpec.repair_si_max (decimal)"
    formula: |
      site_front = min(SITE_WEIGHT_FRONT * peak_g_front, SITE_CONTRIBUTION_CAP)
      site_side  = min(SITE_WEIGHT_SIDE  * peak_g_side,  SITE_CONTRIBUTION_CAP)
      site_crown = min(SITE_WEIGHT_CROWN * peak_g_crown, SITE_CONTRIBUTION_CAP)
      raw_index  = site_front + site_side + site_crown
      severity_index = round_half_up(
          raw_index * CONDITION_MULTIPLIER[conditioning]
          + MATERIAL_OFFSET[shell_material], 1)
      computed_result =
          PASS    when severity_index <= ModelSpec.pass_si_max
          REPAIR  when severity_index <= ModelSpec.repair_si_max
          CONDEMN otherwise
    constants:
      SITE_WEIGHT_FRONT: 0.5
      SITE_WEIGHT_SIDE: 0.3
      SITE_WEIGHT_CROWN: 0.2
      SITE_CONTRIBUTION_CAP: 150.0
      CONDITION_MULTIPLIER:
        AMBIENT: 1.00
        HOT: 1.15
        COLD: 1.08
      MATERIAL_OFFSET:
        POLYCARBONATE: 0
        ABS: 25
      DEFAULT_PASS_SI_MAX: 300.0
      DEFAULT_REPAIR_SI_MAX: 360.0
    precision:
      severity_index: "1 decimal place, ROUND_HALF_UP"
    worked_example: |
      A) 300/300/300 g, AMBIENT, POLYCARBONATE:
         150.0 + 90.0 + 60.0 = 300.0; 300.0 * 1.00 + 0 = 300.0
         300.0 <= pass_si_max 300.0  -> PASS   (exact boundary)
      B) same impacts, HOT, ABS:
         300.0 * 1.15 + 25 = 370.0 > repair_si_max 360.0 -> CONDEMN
      C) 400/600/900 g, AMBIENT, POLYCARBONATE (cap saturation):
         uncapped 200.0 + 180.0 + 180.0 = 560.0
         capped   150.0 + 150.0 + 150.0 = 450.0 -> CONDEMN
      D) 300/340/290 g, AMBIENT, POLYCARBONATE:
         150.0 + 102.0 + 58.0 = 310.0 -> REPAIR
    note: |
      Two independent multiplicative/additive adjustments applied after three
      capped weighted terms: the per-site cap must be applied before summation,
      and the material offset after the condition multiplier.

  - calc_id: shipment_settlement_total
    name: "Shipment settlement total (provisional vs final)"
    applies_to: IntakeShipment
    algorithm_type: tiered_pricing
    trigger: "POST /intake-shipments/{id}/accept (PROVISIONAL) and POST /intake-shipments/{id}/settle (FINAL)"
    writes_fields: [provisional_total_cents, final_total_cents]
    input_set: |
      All EquipmentUnit rows whose intake_shipment_id == this shipment and whose
      recon_status IN {CERTIFIED, CONDEMNED}, ordered by created_at ASC.
      Units in any other recon_status are excluded from the billable set.
      At accept time the billable set is empty for the PROVISIONAL run, which
      instead prices counted_unit_count synthetic STANDARD lines (see below).
    formula: |
      tier_multiplier = TIER_MULTIPLIER[IntakeShipment.service_tier]

      per unit u in the billable set:
        line_base_exact = BASE_SERVICE_CENTS * tier_multiplier
        line_extra      = CONDEMN_HANDLING_CENTS            when u.recon_status == CONDEMNED
                        = sum(labor_cents of u's RepairOrders with status == CLOSED)
                                                            when u.recon_status == CERTIFIED
        line_exact      = line_base_exact + line_extra

      gross_cents =
        PROVISIONAL: round_half_up(sum(line_exact over the set), 0)
                     -- sum the exact per-line amounts, round once at the end
        FINAL:       sum(round_half_up(line_exact, 0) over the set)
                     -- round every line to whole cents first, then sum

      discount_rate = 0.000  when gross_cents <  DISCOUNT_TIER_1_FLOOR
                    = 0.125  when gross_cents <  DISCOUNT_TIER_2_FLOOR
                    = 0.150  otherwise
      discount_cents = round_half_up(gross_cents * discount_rate, 0)
      net_cents      = gross_cents - discount_cents
      surcharge_cents = round_half_up(net_cents * COMPLIANCE_SURCHARGE_RATE, 0)
      total_cents    = net_cents + surcharge_cents
    variants:
      - variant: PROVISIONAL
        selected_when: "invoked from POST /intake-shipments/{id}/accept; writes provisional_total_cents"
        formula: "gross_cents = round_half_up(sum(line_exact), 0) -- one rounding step, at the end"
        note: |
          At accept time no unit has reached CERTIFIED or CONDEMNED yet, so the
          provisional run prices counted_unit_count lines of
          line_exact = BASE_SERVICE_CENTS * tier_multiplier with no extras.
      - variant: FINAL
        selected_when: "invoked from POST /intake-shipments/{id}/settle; writes final_total_cents"
        formula: "gross_cents = sum(round_half_up(line_exact, 0)) -- rounding per line, then sum"
        note: |
          The final run uses the real billable set, so it also picks up
          CONDEMN_HANDLING_CENTS and closed-repair labour.
    constants:
      BASE_SERVICE_CENTS: 8996
      TIER_MULTIPLIER:
        STANDARD: 1.00
        SEASONAL_CONTRACT: 1.00
        PRIORITY_RUSH: 1.35
      CONDEMN_HANDLING_CENTS: 2500
      REPAIR_LABOR_CENTS: 4500
      DISCOUNT_TIER_1_FLOOR: 10000
      DISCOUNT_TIER_2_FLOOR: 100000
      DISCOUNT_RATE_TIER_0: 0.000
      DISCOUNT_RATE_TIER_1: 0.125
      DISCOUNT_RATE_TIER_2: 0.150
      COMPLIANCE_SURCHARGE_RATE: 0.02
    precision:
      all_money_fields: "integer cents, ROUND_HALF_UP at every documented rounding step"
    worked_example: |
      service_tier = PRIORITY_RUSH, billable set of two units in created_at order:
        u1 CERTIFIED with one CLOSED RepairOrder (labor_cents 4500):
           8996 * 1.35 = 12144.60; + 4500 = 16644.60
        u2 CONDEMNED:
           8996 * 1.35 = 12144.60; + 2500 = 14644.60

      PROVISIONAL rounding order (sum then round):
        sum = 31289.20 -> gross 31289
        discount 31289 * 0.125 = 3911.125 -> 3911 ; net 27378
        surcharge 27378 * 0.02 = 547.56  -> 548  ; total 27926

      FINAL rounding order (round then sum):
        16645 + 14645 = gross 31290
        discount 31290 * 0.125 = 3911.25 -> 3911 ; net 27379
        surcharge 27379 * 0.02 = 547.58  -> 548  ; total 27927

      Same units, same constants, 1-cent divergence carried all the way through
      the tier discount and the surcharge: 27926 vs 27927.

  - calc_id: turnaround_commitment
    name: "Turnaround due dates and loaner requirement"
    applies_to: IntakeShipment
    algorithm_type: threshold
    trigger: "POST /intake-shipments/{id}/accept"
    writes_fields: [raw_due_at, committed_due_at, loaner_required]
    inputs:
      - "IntakeShipment.service_tier (enum)"
      - "IntakeShipment.counted_unit_count (integer)"
      - "IntakeShipment.season_start_date (date, from create)"
      - "accepted_at (= logical clock at accept time)"
    formula: |
      batch_days = ceil(counted_unit_count / UNITS_PER_BATCH_DAY)
      raw_due_at = accepted_at + (TIER_BASE_DAYS[service_tier] + batch_days) days
      season_deadline = season_start_date - SEASON_BUFFER_DAYS days
      committed_due_at = min(raw_due_at, season_deadline)
      loaner_required = (raw_due_at > committed_due_at)
    constants:
      TIER_BASE_DAYS:
        STANDARD: 30
        SEASONAL_CONTRACT: 30
        PRIORITY_RUSH: 10
      UNITS_PER_BATCH_DAY: 25
      SEASON_BUFFER_DAYS: 7
    precision:
      dates: "whole days, UTC midnight boundaries"
    worked_example: |
      accepted_at 2026-08-01, counted_unit_count 12, season_start_date 2026-08-25
      -> season_deadline = 2026-08-18
        PRIORITY_RUSH: batch_days = ceil(12/25) = 1; raw = 2026-08-01 + 11d = 2026-08-12
                       committed = min(2026-08-12, 2026-08-18) = 2026-08-12
                       loaner_required = false
        STANDARD:      raw = 2026-08-01 + 31d = 2026-09-01
                       committed = min(2026-09-01, 2026-08-18) = 2026-08-18
                       loaner_required = true
      Batch boundary at PRIORITY_RUSH: 25 units -> 2026-08-12, 26 units -> 2026-08-13.

  - calc_id: component_inspection_verdict
    name: "Component inspection verdict against manufacturer criteria"
    applies_to: ComponentInspection
    algorithm_type: threshold
    trigger: "POST /equipment-units/{id}/inspections"
    writes_fields: [verdict]
    writes_also: [replace_threshold_applied, fail_threshold_applied, metric_direction_applied]
    inputs:
      - "ComponentInspection.measurement_value (decimal, from the request)"
      - "ComponentInspection.component_code (enum, from the request)"
      - "ModelSpec.component_criteria — the object whose code == component_code, supplying metric_direction, replace_threshold, fail_threshold"
    formula: |
      criteria = the ModelSpec.component_criteria object of the unit's
                 model_spec_id whose code == component_code
      metric_direction_applied  = criteria.metric_direction
      replace_threshold_applied = criteria.replace_threshold
      fail_threshold_applied    = criteria.fail_threshold
      (all three are snapshotted onto the immutable ComponentInspection row, so
      a later ModelSpec edit cannot retroactively change a recorded verdict)

      when metric_direction_applied == LOWER_IS_WORSE:
        FAIL    when measurement_value <= fail_threshold_applied
        REPLACE when measurement_value <= replace_threshold_applied
        PASS    otherwise
      when metric_direction_applied == HIGHER_IS_WORSE:
        FAIL    when measurement_value >= fail_threshold_applied
        REPLACE when measurement_value >= replace_threshold_applied
        PASS    otherwise
      Both comparisons are inclusive at the threshold, and FAIL is evaluated
      before REPLACE.
    constants: {}
    precision:
      measurement_value: "2 decimal places as supplied; no rounding applied"
    worked_example: |
      criteria for LINER: metric_direction LOWER_IS_WORSE,
      replace_threshold 4.00, fail_threshold 2.00
        measurement_value 4.00 -> REPLACE (inclusive)   4.01 -> PASS
        measurement_value 2.00 -> FAIL                  1.99 -> FAIL
      criteria for SHELL: metric_direction HIGHER_IS_WORSE,
      replace_threshold 4.00, fail_threshold 6.00
        measurement_value 4.00 -> REPLACE               3.99 -> PASS
        measurement_value 6.00 -> FAIL
    downstream_effects:
      - "EquipmentUnit.inspection_verdict_summary = FAIL when any SHELL inspection verdict is FAIL; REPLACE_REQUIRED when any verdict IN {REPLACE, FAIL} on a non-SHELL code; CLEAR once every ModelSpec.required_component_codes entry is covered and none of the above holds; PENDING while the required set is incomplete"
      - "inspection_verdict_summary == FAIL sets EquipmentUnit.condemn_required = true"

  - calc_id: certification_label_code
    name: "Recertification label code and daily sequence"
    applies_to: CertificationLabel
    algorithm_type: aggregation
    trigger: "POST /certification-labels"
    writes_fields: [label_code, daily_sequence, standard_code_snapshot, certified_on]
    input_set: |
      All CertificationLabel rows, plant-wide (not scoped to the unit, shipment
      or account), whose certified_on equals the certified_on being assigned and
      whose status IN {ACTIVE, VOIDED}, ordered by created_at ASC. Voided labels
      still consume their sequence number, so codes are never reused.
    formula: |
      certified_on = date(logical clock)
      standard_code_snapshot = ModelSpec.standard_code (copied at issue time)
      daily_sequence = 1 + count(input_set)
      label_code = "RCP-" + standard_code_snapshot + "-"
                   + strftime(certified_on, "%Y%m%d") + "-"
                   + zero_pad(daily_sequence, 3)
    constants:
      LABEL_PREFIX: "RCP"
      SEQUENCE_PAD_WIDTH: 3
    precision:
      daily_sequence: "integer, monotonic within a calendar day"
    worked_example: |
      clock 2026-08-01T09:00:00Z, ModelSpec.standard_code "ND002", no prior
      labels that day -> daily_sequence 1, label_code "RCP-ND002-20260801-001".
      A second label the same day for a different model with standard_code
      "ND010" -> daily_sequence 2, label_code "RCP-ND010-20260801-002".
      Voiding the first label does not free sequence 1: the next label that day
      is still 003.

  - calc_id: loaner_unit_selection
    name: "Loaner unit selector policy"
    applies_to: LoanerAssignment
    algorithm_type: interval_merge
    trigger: "POST /loaner-assignments when loaner_unit_id is omitted"
    writes_fields: [loaner_unit_id, selected_by]
    input_set: |
      All LoanerUnit rows that satisfy every eligibility predicate below.
    formula: |
      eligibility (all must hold):
        1. loaner.model_spec_id == request.requested_model_spec_id
        2. loaner.status == AVAILABLE
        3. loaner.certification_valid_until >= request.window_end
        4. no LoanerAssignment on this loaner with status IN {RESERVED, OUT_ON_LOAN}
           whose [window_start, window_end) overlaps the requested
           [window_start, window_end) -- half-open, so a booking that ends
           exactly when another begins is not an overlap

      ranking (first row wins):
        1. condition_grade ASC in the order A, B, C
        2. assignment_count ASC   (fewest prior loans first)
        3. created_at ASC         (deterministic final tie-break)

      selected_by = SERVER_SELECTED when loaner_unit_id was omitted,
                    EXPLICIT       when the caller supplied loaner_unit_id
      An empty eligible pool is an error, not a null selection.
    constants: {}
    precision:
      ranking: "total order; created_at ASC guarantees determinism"
    worked_example: |
      Request window [2026-08-05, 2026-08-12) for model M.
        L1 grade B, assignment_count 0
        L2 grade A, assignment_count 7
        L3 grade A, assignment_count 7, created later than L2
        L4 grade A, assignment_count 0, certification_valid_until 2026-08-11
      L4 fails predicate 3 (2026-08-11 < 2026-08-12). Grade A beats grade B, so
      L1 loses to L2/L3; L2 and L3 tie on grade and count, and created_at ASC
      selects L2.
    error_cases:
      - "empty eligible pool -> ERR_NO_LOANER_AVAILABLE (409)"
      - "explicit loaner_unit_id failing predicate 4 -> ERR_LOANER_DOUBLE_BOOKED (409)"
      - "explicit loaner_unit_id failing predicate 3 -> ERR_LOANER_CERTIFICATION_EXPIRED (422)"

  - calc_id: part_stock_ledger
    name: "Approved part stock conservation ledger"
    applies_to: ApprovedPart
    algorithm_type: aggregation
    trigger: "POST /repair-orders/{id}/submit, /install, /cancel and POST /approved-parts"
    writes_fields: [on_hand_qty, reserved_qty, consumed_qty]
    invariant: |
      received_qty == on_hand_qty + reserved_qty + consumed_qty
      at every observable moment, for every ApprovedPart.
    formula: |
      submit  : on_hand_qty  -= line.quantity ; reserved_qty += line.quantity
      install : reserved_qty -= line.quantity ; consumed_qty += line.quantity
      cancel  : reserved_qty -= line.quantity ; on_hand_qty  += line.quantity
                (only for lines still in status RESERVED)
      No transition changes received_qty, so the three moving buckets always
      re-sum to it. A submit is rejected before any bucket moves when
      on_hand_qty < line.quantity for any line, so on_hand_qty never goes
      negative and a rejected submit leaves all three buckets untouched.
    constants: {}
    precision:
      quantities: "non-negative integers"
    worked_example: |
      received_qty 10, on_hand 10, reserved 0, consumed 0.
      submit 4  -> 6 / 4 / 0   (6 + 4 + 0 = 10)
      install   -> 6 / 0 / 4   (6 + 0 + 4 = 10)
      second order submits 6 -> 0 / 6 / 4, then cancel -> 6 / 0 / 4.
      Net effect of submit-then-cancel is zero drift.

  - calc_id: shipment_unit_disposition_ledger
    name: "Shipment unit disposition conservation ledger"
    applies_to: IntakeShipment
    algorithm_type: aggregation
    trigger: "every EquipmentUnit disposition change (certify, condemn, release, label void)"
    writes_fields: [units_in_process, units_certified, units_condemned, units_released]
    invariant: |
      counted_unit_count == units_in_process + units_certified
                            + units_condemned + units_released
      for every IntakeShipment in status ACCEPTED or later.
    formula: |
      accept          : units_in_process = counted_unit_count; others = 0
      unit certified  : units_in_process -= 1 ; units_certified += 1
      unit condemned  : units_in_process -= 1 ; units_condemned += 1
      unit released   : units_certified  -= 1 ; units_released  += 1
      label voided    : units_certified  -= 1 ; units_in_process += 1
      Every mutation moves exactly one unit between two buckets, so the four
      counters always re-sum to counted_unit_count.
    constants: {}
    precision:
      counters: "non-negative integers"
    worked_example: |
      counted_unit_count 3 -> 3 / 0 / 0 / 0 at accept.
      certify u1        -> 2 / 1 / 0 / 0
      condemn u2        -> 1 / 1 / 1 / 0
      certify u3        -> 0 / 2 / 1 / 0   (units_in_process hits 0 -> shipment READY_FOR_RETURN)
      void u3's label   -> 1 / 1 / 1 / 0   (shipment reverts to IN_PROCESS)
      release u1        -> 1 / 0 / 1 / 1
      Every line re-sums to 3.

# =============================================================================
# §1.4 Validation Rules  (ordered ladder; lower priority number wins)
# =============================================================================
validations:

  - priority: 10
    category: auth
    rule_id: v-auth-headers-present
    applies_to: "every endpoint except POST /_clock/set_current_utc"
    condition: "X-User-Role header missing, or X-User-Role is CustomerContact and X-User-ID is missing"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401

  - priority: 20
    category: authorization
    rule_id: v-role-allowed
    applies_to: "every endpoint"
    condition: "X-User-Role is not listed in the endpoint's §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403

  - priority: 25
    category: authorization
    rule_id: v-customer-scope
    applies_to: "GET /customer-accounts/{id}, GET /intake-shipments, GET /intake-shipments/{id}, GET /loaner-assignments"
    condition: "X-User-Role == CustomerContact and the target CustomerAccount.id != the account bound to X-User-ID"
    error_id: ERR_ACCOUNT_SCOPE_VIOLATION
    http_status: 403
    note: "Checked after the role gate so a wrong-role caller still gets ERR_UNAUTHORIZED."

  - priority: 30
    category: schema
    rule_id: v-request-schema
    applies_to: "every endpoint with a request body or query parameters"
    condition: |
      A required field is absent; a field has the wrong JSON type; an enum field
      carries a value outside its declared set; a numeric field is out of range
      (peak_g_* < 0, quantity < 1, counted_unit_count < 1, limit outside 1..100,
      offset < 0); window_end <= window_start; record_retention_years < 1.
    error_id: ERR_INVALID_REQUEST
    http_status: 400

  - priority: 40
    category: existence
    rule_id: v-path-and-fk-existence
    applies_to: "every endpoint carrying a path id or an FK field"
    condition: |
      The referenced row does not exist. Resolution order within this priority
      is path id first, then FK fields in declaration order:
      customer_account_id, model_spec_id, intake_shipment_id, equipment_unit_id,
      test_bench_id, approved_part_id, loaner_unit_id.
    error_id: "the matching *_NOT_FOUND error for the first unresolved reference"
    http_status: 404

  - priority: 45
    category: business_fiscal
    rule_id: v-settle-readiness
    applies_to: "POST /intake-shipments/{id}/settle"
    condition: "IntakeShipment.units_in_process != 0"
    error_id: ERR_SHIPMENT_NOT_READY
    http_status: 409
    note: |
      Deliberately ordered ahead of the generic v-shipment-state guard (50) so a
      premature settle names the specific reason (units still on the shop floor)
      instead of the generic status error. A shipment that is not yet
      READY_FOR_RETURN always has units_in_process != 0, so this rule is what a
      caller settling too early actually sees.

  - priority: 50
    category: state
    rule_id: v-shipment-state
    applies_to: "POST /intake-shipments/{id}/count, /accept, /settle, POST /equipment-units"
    condition: "the IntakeShipment is not in a status from which the transition is defined in §1.2"
    error_id: ERR_SHIPMENT_STATE_INVALID
    http_status: 409

  - priority: 50
    category: state
    rule_id: v-unit-state
    applies_to: |
      POST /equipment-units/{id}/identify, /disassemble, /condemn, /stage-return,
      /release, /purge-records, POST /equipment-units/{id}/inspections,
      POST /shell-tests, POST /repair-orders, POST /certification-labels,
      POST /certification-labels/{id}/void
    condition: "the EquipmentUnit's recon_status or custody_status is not one from which the operation is defined in §1.2"
    error_id: ERR_UNIT_STATE_INVALID
    http_status: 409

  - priority: 50
    category: state
    rule_id: v-shell-test-state
    applies_to: "POST /shell-tests/{id}/record-impacts, POST /shell-tests/{id}/determine"
    condition: "record-impacts on a ShellTest not in SCHEDULED, or determine on a ShellTest not in COMPLETED"
    error_id: ERR_SHELL_TEST_STATE_INVALID
    http_status: 409

  - priority: 50
    category: state
    rule_id: v-repair-order-state
    applies_to: "POST /repair-orders/{id}/part-lines, /submit, /install, /verify, /cancel"
    condition: "the RepairOrder status is not one from which the operation is defined in §1.2"
    error_id: ERR_REPAIR_ORDER_STATE_INVALID
    http_status: 409

  - priority: 50
    category: state
    rule_id: v-label-already-voided
    applies_to: "POST /certification-labels/{id}/void"
    condition: "the CertificationLabel status is already VOIDED"
    error_id: ERR_LABEL_ALREADY_VOIDED
    http_status: 409

  - priority: 50
    category: state
    rule_id: v-destruction-state
    applies_to: "POST /destruction-records/{id}/witness, POST /destruction-records/{id}/verify"
    condition: "witness on a record not in PENDING, or verify on a record not in WITNESSED"
    error_id: ERR_DESTRUCTION_STATE_INVALID
    http_status: 409

  - priority: 50
    category: state
    rule_id: v-loaner-assignment-state
    applies_to: "POST /loaner-assignments/{id}/return"
    condition: "the LoanerAssignment status is already RETURNED"
    error_id: ERR_LOANER_ASSIGNMENT_STATE_INVALID
    http_status: 409

  - priority: 60
    category: business_safety
    rule_id: v-segregation-repair-verify
    applies_to: "POST /repair-orders/{id}/verify"
    condition: "X-User-ID equals RepairOrder.installed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    note: "The technician who installed the parts cannot sign off on their own work."

  - priority: 60
    category: business_safety
    rule_id: v-segregation-destruction-verify
    applies_to: "POST /destruction-records/{id}/verify"
    condition: "X-User-ID equals DestructionRecord.witnessed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403

  - priority: 61
    category: business_safety
    rule_id: v-condemn-required-blocks-certification
    applies_to: "POST /certification-labels, POST /shell-tests/{id}/determine"
    condition: |
      EquipmentUnit.condemn_required == true and the operation would certify the
      unit or record a determination other than CONDEMN.
    error_id: ERR_CONDEMN_REQUIRED
    http_status: 422

  - priority: 62
    category: business_safety
    rule_id: v-determination-consistency
    applies_to: "POST /shell-tests/{id}/determine"
    condition: "determination != ShellTest.computed_result and override_reason is absent"
    error_id: ERR_DETERMINATION_MISMATCH
    http_status: 422

  - priority: 63
    category: business_safety
    rule_id: v-determination-override-direction
    applies_to: "POST /shell-tests/{id}/determine"
    condition: |
      override_reason is present but the determination is less severe than
      computed_result under the ordering PASS < REPAIR < CONDEMN.
    error_id: ERR_DETERMINATION_UPGRADE_FORBIDDEN
    http_status: 422
    note: "An inspector may always be stricter than the machine, never more lenient."

  - priority: 64
    category: business_safety
    rule_id: v-part-approved-for-model
    applies_to: "POST /repair-orders/{id}/part-lines"
    condition: "the ApprovedPart.model_spec_id != EquipmentUnit.model_spec_id"
    error_id: ERR_PART_MODEL_MISMATCH
    http_status: 422

  - priority: 64
    category: business_safety
    rule_id: v-part-oem-approved
    applies_to: "POST /repair-orders/{id}/part-lines"
    condition: "ApprovedPart.oem_approved == false"
    error_id: ERR_PART_NOT_APPROVED
    http_status: 422

  - priority: 65
    category: business_safety
    rule_id: v-model-reconditionable
    applies_to: "POST /equipment-units/{id}/disassemble, POST /repair-orders"
    condition: "ModelSpec.reconditionable == false"
    error_id: ERR_MODEL_NOT_RECONDITIONABLE
    http_status: 422

  - priority: 66
    category: business_safety
    rule_id: v-bench-calibration-current
    applies_to: "POST /shell-tests/{id}/record-impacts"
    condition: "TestBench.calibration_valid_until < the logical clock"
    error_id: ERR_BENCH_CALIBRATION_EXPIRED
    http_status: 409

  - priority: 67
    category: business_safety
    rule_id: v-inspection-complete-before-test
    applies_to: "POST /shell-tests"
    condition: "EquipmentUnit.inspection_verdict_summary == PENDING (not every ModelSpec.required_component_codes entry has an inspection)"
    error_id: ERR_INSPECTION_INCOMPLETE
    http_status: 409

  - priority: 68
    category: business_safety
    rule_id: v-no-duplicate-inspection
    applies_to: "POST /equipment-units/{id}/inspections"
    condition: "an inspection for the same component_code already exists on this unit"
    error_id: ERR_DUPLICATE_INSPECTION
    http_status: 409
    note: "ComponentInspection is immutable, so a correction requires condemning or re-intaking the unit."

  - priority: 70
    category: business_constraint
    rule_id: v-unit-count-cap
    applies_to: "POST /equipment-units"
    condition: "IntakeShipment.units_registered would exceed counted_unit_count"
    error_id: ERR_UNIT_COUNT_EXCEEDED
    http_status: 409

  - priority: 70
    category: business_constraint
    rule_id: v-unit-registration-complete
    applies_to: "POST /intake-shipments/{id}/accept"
    condition: "IntakeShipment.units_registered != counted_unit_count"
    error_id: ERR_UNIT_REGISTRATION_INCOMPLETE
    http_status: 409

  - priority: 70
    category: business_constraint
    rule_id: v-serial-unique-per-account
    applies_to: "POST /equipment-units"
    condition: "another EquipmentUnit with the same serial_number exists under the same CustomerAccount"
    error_id: ERR_SERIAL_DUPLICATE
    http_status: 409

  - priority: 70
    category: business_constraint
    rule_id: v-retest-cap
    applies_to: "POST /shell-tests"
    condition: "EquipmentUnit.retest_count >= ModelSpec.max_retest_count"
    error_id: ERR_RETEST_LIMIT_EXCEEDED
    http_status: 409

  - priority: 71
    category: business_constraint
    rule_id: v-part-stock-available
    applies_to: "POST /repair-orders/{id}/submit"
    condition: "any part line has ApprovedPart.on_hand_qty < line.quantity"
    error_id: ERR_PART_STOCK_INSUFFICIENT
    http_status: 409
    note: "Evaluated across all lines before any bucket moves, so a rejected submit leaves the ledger untouched."

  - priority: 80
    category: business_temporal
    rule_id: v-bench-window-conflict
    applies_to: "POST /shell-tests"
    condition: |
      Another ShellTest on the same TestBench has a [window_start, window_end]
      interval that intersects the requested interval once the requested
      interval is expanded by TestBench.cooldown_minutes (default 45) on both
      sides. Both intervals are closed, so touching endpoints collide.
    error_id: ERR_BENCH_WINDOW_CONFLICT
    http_status: 409

  - priority: 81
    category: business_temporal
    rule_id: v-bench-daily-quota
    applies_to: "POST /shell-tests"
    condition: |
      The count of ShellTest rows on the same TestBench whose
      date(window_start) equals date(requested window_start) has already
      reached TestBench.daily_session_quota.
    error_id: ERR_BENCH_DAILY_QUOTA_EXCEEDED
    http_status: 409
    note: "Aggregate rule: each individual booking clears the cooldown check yet the collective exceeds the daily cap."

  - priority: 82
    category: business_temporal
    rule_id: v-loaner-overlap
    applies_to: "POST /loaner-assignments"
    condition: |
      An explicit loaner_unit_id already has an assignment with status IN
      {RESERVED, OUT_ON_LOAN} whose [window_start, window_end) intersects the
      requested half-open window.
    error_id: ERR_LOANER_DOUBLE_BOOKED
    http_status: 409

  - priority: 83
    category: business_temporal
    rule_id: v-loaner-certification-window
    applies_to: "POST /loaner-assignments"
    condition: "an explicit loaner_unit_id has certification_valid_until < window_end"
    error_id: ERR_LOANER_CERTIFICATION_EXPIRED
    http_status: 422

  - priority: 84
    category: business_temporal
    rule_id: v-label-issue-window
    applies_to: "POST /certification-labels"
    condition: |
      The clock is more than LABEL_ISSUE_WINDOW_DAYS (14) after the unit's most
      recent DETERMINED ShellTest determined_at, so the pass result is stale.
    error_id: ERR_LABEL_WINDOW_EXPIRED
    http_status: 422

  - priority: 85
    category: business_temporal
    rule_id: v-retention-active
    applies_to: "POST /equipment-units/{id}/purge-records"
    condition: "EquipmentUnit.record_retention_until is null or >= the logical clock"
    error_id: ERR_RETENTION_ACTIVE
    http_status: 409

  - priority: 90
    category: business_referential
    rule_id: v-liability-waiver-on-file
    applies_to: "POST /intake-shipments/{id}/accept, POST /equipment-units/{id}/release, POST /loaner-assignments"
    condition: "CustomerAccount.liability_waiver_status != ON_FILE (MISSING, or STALE against REQUIRED_WAIVER_VERSION 2026.1)"
    error_id: ERR_LIABILITY_WAIVER_MISSING
    http_status: 409

  - priority: 91
    category: business_referential
    rule_id: v-warranty-claim-ref
    applies_to: "POST /repair-orders/{id}/install"
    condition: "EquipmentUnit.warranty_coverage == IN_WARRANTY and warranty_claim_ref is absent"
    error_id: ERR_WARRANTY_CLAIM_REQUIRED
    http_status: 422
    note: "In-warranty repairs must be attributed to a manufacturer claim before parts are consumed."

  - priority: 100
    category: business_fiscal
    rule_id: v-account-billing-hold
    applies_to: "POST /certification-labels, POST /intake-shipments/{id}/settle, POST /loaner-assignments"
    condition: "CustomerAccount.status == BILLING_HOLD"
    error_id: ERR_ACCOUNT_ON_HOLD
    http_status: 402

  - priority: 102
    category: business_fiscal
    rule_id: v-settlement-locked
    applies_to: "POST /intake-shipments/{id}/settle, POST /certification-labels/{id}/void"
    condition: "IntakeShipment.settlement_locked == true"
    error_id: ERR_SETTLEMENT_LOCKED
    http_status: 409

  - priority: 110
    category: concurrency
    rule_id: v-stale-unit-version
    applies_to: "POST /certification-labels, POST /repair-orders"
    condition: "expected_equipment_unit_version != EquipmentUnit.version"
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
    note: "Evaluated last, after every state and business check, so a stale version on an otherwise invalid request still surfaces the business error."

# --- Declared priority conflicts (each is a §1.8 instance) -------------------
validation_priority_conflicts:
  - conflict_id: state-beats-fiscal-on-label-issue
    endpoint: "POST /certification-labels"
    lower_priority_rule: v-unit-state
    lower_priority_error: ERR_UNIT_STATE_INVALID
    higher_priority_rule: v-account-billing-hold
    higher_priority_error: ERR_ACCOUNT_ON_HOLD
    setup: |
      A unit still in recon_status TESTED (not TEST_PASSED) belonging to an
      account whose status is BILLING_HOLD. Both v-unit-state (priority 50) and
      v-account-billing-hold (priority 100) are violated.
    expected_error: ERR_UNIT_STATE_INVALID
    expected_status: 409
    note: "Reversing the two field values (unit TEST_PASSED, account BILLING_HOLD) yields ERR_ACCOUNT_ON_HOLD (402), proving the ladder rather than a fixed error."

  - conflict_id: referential-beats-fiscal-on-loaner-booking
    endpoint: "POST /loaner-assignments"
    lower_priority_rule: v-liability-waiver-on-file
    lower_priority_error: ERR_LIABILITY_WAIVER_MISSING
    higher_priority_rule: v-account-billing-hold
    higher_priority_error: ERR_ACCOUNT_ON_HOLD
    setup: |
      An account that has never signed a waiver (liability_waiver_status MISSING)
      AND that has been placed on a billing hold (status BILLING_HOLD), booking a
      loaner for a model with an eligible loaner in the pool. Both
      v-liability-waiver-on-file (priority 90, business_referential) and
      v-account-billing-hold (priority 100, business_fiscal) are violated.
    expected_error: ERR_LIABILITY_WAIVER_MISSING
    expected_status: 409
    note: |
      Clearing the waiver alone (acknowledging version 2026.1) flips the same
      request to ERR_ACCOUNT_ON_HOLD (402), proving the ladder rather than a
      fixed error. This pair (business_referential over business_fiscal) is
      category-disjoint from the state-over-fiscal pair above.

# =============================================================================
# §1.5 API Endpoint Table  (api_prefix is "/", so every path is top-level)
# =============================================================================
endpoints:

  # --- test-driving surface --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Sets the server's logical clock, which every date/expiry/window rule in
      this scaffold reads instead of wall-clock time. The server's startup
      default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint
      the logical clock reads that instant and MUST NOT fall back to real
      wall-clock time.
    roles: [PlantManager, IntakeClerk, Technician, CertifyingInspector, ComplianceOfficer]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock used by every calculation, validation and system timestamp"

  # --- ModelSpec ------------------------------------------------------------
  - method: POST
    path: "/model-specs"
    description: "Register a manufacturer model with its performance standard, service life, warranty term, severity bands and per-component inspection criteria."
    roles: [PlantManager]
    code: 201
    input: [manufacturer, model_code, standard_code, shell_material, max_service_life_years, warranty_years, record_retention_years, pass_si_max, repair_si_max, max_retest_count, required_component_codes, component_criteria, "reconditionable?"]
    output: ModelSpec
    side_effects:
      - "validates that component_criteria contains one object per required_component_codes entry"
      - "defaults reconditionable to true when omitted"

  - method: GET
    path: "/model-specs/{id}"
    description: "Read one model specification."
    roles: [PlantManager, IntakeClerk, Technician, CertifyingInspector, ComplianceOfficer]
    code: 200
    input: []
    output: ModelSpec
    side_effects: []

  # --- ApprovedPart ---------------------------------------------------------
  - method: POST
    path: "/approved-parts"
    description: "Stock an approved replacement component for a model, with the quantity received into the parts cage."
    roles: [PlantManager]
    code: 201
    input: [model_spec_id, part_number, component_code, oem_approved, unit_price_cents, received_qty]
    output: ApprovedPart
    side_effects:
      - "initialises on_hand_qty = received_qty, reserved_qty = 0, consumed_qty = 0"
      - "establishes the part_stock_ledger invariant received_qty == on_hand_qty + reserved_qty + consumed_qty"

  - method: GET
    path: "/approved-parts/{id}"
    description: "Read one approved part, including its live stock buckets."
    roles: [PlantManager, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: ApprovedPart
    side_effects: []

  - method: GET
    path: "/approved-parts"
    description: "List approved parts, filterable by model and component (FK reverse-reachability for ApprovedPart.model_spec_id)."
    roles: [PlantManager, Technician, ComplianceOfficer]
    code: 200
    input: ["model_spec_id?", "component_code?", "limit?", "offset?"]
    output: ApprovedPart[]
    side_effects: []

  # --- TestBench ------------------------------------------------------------
  - method: POST
    path: "/test-benches"
    description: "Register an impact rig with its cooldown and daily session quota."
    roles: [PlantManager]
    code: 201
    input: [bench_code, test_type, daily_session_quota, "cooldown_minutes?"]
    output: TestBench
    side_effects:
      - "defaults cooldown_minutes to 45 when omitted"
      - "leaves calibration_valid_until null, so the bench cannot host a session until calibrated"

  - method: GET
    path: "/test-benches/{id}"
    description: "Read one test bench, including its calibration expiry."
    roles: [PlantManager, Technician, CertifyingInspector, ComplianceOfficer]
    code: 200
    input: []
    output: TestBench
    side_effects: []

  - method: POST
    path: "/test-benches/{id}/calibrate"
    description: "Record a calibration on the rig, setting the expiry after which sessions are refused."
    roles: [PlantManager]
    code: 200
    input: [calibration_valid_until]
    output: TestBench
    side_effects:
      - "sets calibration_valid_until"
      - "increments TestBench.version by 1"

  # --- LoanerUnit -----------------------------------------------------------
  - method: POST
    path: "/loaner-units"
    description: "Add a plant-owned loaner unit to the substitution pool for a model."
    roles: [PlantManager]
    code: 201
    input: [model_spec_id, asset_tag, condition_grade, certification_valid_until]
    output: LoanerUnit
    side_effects:
      - "initialises status = AVAILABLE and assignment_count = 0"

  - method: GET
    path: "/loaner-units/{id}"
    description: "Read one loaner unit."
    roles: [PlantManager, IntakeClerk, ComplianceOfficer]
    code: 200
    input: []
    output: LoanerUnit
    side_effects: []

  - method: GET
    path: "/loaner-units"
    description: "List loaner units, filterable by model, status and grade (FK reverse-reachability for LoanerUnit.model_spec_id)."
    roles: [PlantManager, IntakeClerk, ComplianceOfficer]
    code: 200
    input: ["model_spec_id?", "status?", "condition_grade?", "limit?", "offset?"]
    output: LoanerUnit[]
    side_effects: []

  # --- CustomerAccount ------------------------------------------------------
  - method: POST
    path: "/customer-accounts"
    description: "Open an account for a school, club, college or municipal program."
    roles: [PlantManager]
    code: 201
    input: [org_name, org_type, sport, contact_email]
    output: CustomerAccount
    side_effects:
      - "initialises status = ACTIVE, liability_waiver_status = MISSING, open_shipment_count = 0"

  - method: GET
    path: "/customer-accounts/{id}"
    description: "Read one account, including waiver posture, open shipment count and loaner recall deadline."
    roles: [PlantManager, IntakeClerk, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []

  - method: POST
    path: "/customer-accounts/{id}/liability-acknowledgment"
    description: "Record the program's signed liability waiver revision."
    roles: [PlantManager, IntakeClerk]
    code: 200
    input: [waiver_version, signer_name]
    output: CustomerAccount
    side_effects:
      - "sets liability_waiver_version, liability_waiver_signer and liability_waiver_signed_at = clock"
      - "recomputes liability_waiver_status (ON_FILE only for REQUIRED_WAIVER_VERSION 2026.1, otherwise STALE)"
      - "increments CustomerAccount.version by 1"

  - method: POST
    path: "/customer-accounts/{id}/billing-hold"
    description: "Place or clear a billing hold on the account."
    roles: [PlantManager]
    code: 200
    input: [hold, "reason?"]
    output: CustomerAccount
    side_effects:
      - "sets status = BILLING_HOLD and billing_hold_reason when hold is true; sets status = ACTIVE and clears billing_hold_reason when hold is false"
      - "increments CustomerAccount.version by 1"

  # --- IntakeShipment -------------------------------------------------------
  - method: POST
    path: "/intake-shipments"
    description: "Open an intake shipment for a program's equipment drop, with the declared unit count and the program's season window."
    roles: [IntakeClerk]
    code: 201
    input: [customer_account_id, sport, service_tier, declared_unit_count, season_start_date, season_end_date]
    output: IntakeShipment
    side_effects:
      - "initialises status = DRAFT with all unit counters null/zero"

  - method: GET
    path: "/intake-shipments/{id}"
    description: "Read one shipment, including turnaround dates, unit disposition counters and settlement totals."
    roles: [PlantManager, IntakeClerk, Technician, CertifyingInspector, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: IntakeShipment
    side_effects: []

  - method: GET
    path: "/intake-shipments"
    description: "List shipments, filterable by account and status (FK reverse-reachability for IntakeShipment.customer_account_id)."
    roles: [PlantManager, IntakeClerk, ComplianceOfficer, CustomerContact]
    code: 200
    input: ["customer_account_id?", "status?", "limit?", "offset?"]
    output: IntakeShipment[]
    side_effects: []

  - method: POST
    path: "/intake-shipments/{id}/count"
    description: "Record the physical dock count, forking the shipment to COUNTED or QUARANTINED."
    roles: [IntakeClerk]
    code: 200
    input: [counted_unit_count]
    output: IntakeShipment
    side_effects:
      - "sets counted_unit_count and recomputes discrepancy_count"
      - "drives IntakeShipment DRAFT->COUNTED when discrepancy_count == 0, DRAFT->QUARANTINED otherwise"
      - "increments IntakeShipment.version by 1"

  - method: POST
    path: "/intake-shipments/{id}/accept"
    description: "Accept the shipment into reconditioning, closing any count discrepancy and committing turnaround dates."
    roles: [IntakeClerk]
    code: 200
    input: [discrepancy_resolution]
    output: IntakeShipment
    side_effects:
      - "drives IntakeShipment COUNTED->ACCEPTED or QUARANTINED->ACCEPTED"
      - "sets accepted_at = clock and units_in_process = counted_unit_count"
      - "runs calc turnaround_commitment (raw_due_at, committed_due_at, loaner_required)"
      - "runs calc shipment_settlement_total variant PROVISIONAL (provisional_total_cents)"
      - "increments CustomerAccount.open_shipment_count by 1 and clears CustomerAccount.loaner_recall_due_at"
      - "increments IntakeShipment.version by 1"

  - method: POST
    path: "/intake-shipments/{id}/settle"
    description: "Settle and close a shipment whose units have all reached a terminal disposition."
    roles: [PlantManager]
    code: 200
    input: []
    output: IntakeShipment
    side_effects:
      - "runs calc shipment_settlement_total variant FINAL (final_total_cents)"
      - "sets settlement_locked = true and drives IntakeShipment READY_FOR_RETURN->CLOSED"
      - "increments IntakeShipment.version by 1"

  # --- EquipmentUnit --------------------------------------------------------
  - method: POST
    path: "/equipment-units"
    description: "Register one physical unit against a counted shipment."
    roles: [IntakeClerk]
    code: 201
    input: [intake_shipment_id, serial_number, "declared_model_code?"]
    output: EquipmentUnit
    side_effects:
      - "initialises recon_status = RECEIVED and custody_status = AT_PLANT"
      - "increments IntakeShipment.units_registered by 1"
      - "rejects the create when units_registered would exceed counted_unit_count"

  - method: GET
    path: "/equipment-units/{id}"
    description: "Read one unit, including both state axes, age, verdict summary, severity index and retention dates."
    roles: [PlantManager, IntakeClerk, Technician, CertifyingInspector, ComplianceOfficer]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: []

  - method: GET
    path: "/equipment-units"
    description: "List units, filterable by shipment, model and either state axis (FK reverse-reachability for EquipmentUnit.intake_shipment_id and EquipmentUnit.model_spec_id)."
    roles: [PlantManager, IntakeClerk, Technician, CertifyingInspector, ComplianceOfficer]
    code: 200
    input: ["intake_shipment_id?", "model_spec_id?", "recon_status?", "custody_status?", "limit?", "offset?"]
    output: EquipmentUnit[]
    side_effects: []

  - method: POST
    path: "/equipment-units/{id}/identify"
    description: "Bind the unit to a model specification and its date of manufacture, choosing the ageing basis."
    roles: [IntakeClerk]
    code: 200
    input: [model_spec_id, manufacture_date, age_basis]
    output: EquipmentUnit
    side_effects:
      - "runs calc unit_service_age (service_age_years, life_expired)"
      - "recomputes warranty_coverage and condemn_required"
      - "drives EquipmentUnit RECEIVED->IDENTIFIED and, for the shipment's first such unit, IntakeShipment ACCEPTED->IN_PROCESS"
      - "increments EquipmentUnit.version by 1"

  - method: POST
    path: "/equipment-units/{id}/disassemble"
    description: "Record cleaning, sanitization and teardown, opening the unit for component inspection."
    roles: [Technician]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects:
      - "drives EquipmentUnit IDENTIFIED->DISASSEMBLED"
      - "increments EquipmentUnit.version by 1"

  - method: POST
    path: "/equipment-units/{id}/inspections"
    description: "Record one component inspection measurement against the manufacturer criteria for that component code."
    roles: [Technician]
    code: 201
    input: [component_code, measurement_value, measurement_unit, "note?"]
    output: ComponentInspection
    side_effects:
      - "snapshots metric_direction_applied, replace_threshold_applied and fail_threshold_applied from ModelSpec.component_criteria"
      - "runs calc component_inspection_verdict (verdict)"
      - "sets inspector_user_id from X-User-ID"
      - "recomputes EquipmentUnit.inspection_verdict_summary and condemn_required"
      - "drives EquipmentUnit DISASSEMBLED->INSPECTED once every ModelSpec.required_component_codes entry is covered"
      - "increments EquipmentUnit.version by 1"

  - method: GET
    path: "/equipment-units/{id}/inspections"
    description: "List the component inspections recorded on a unit (FK reverse-reachability for ComponentInspection.equipment_unit_id)."
    roles: [PlantManager, Technician, CertifyingInspector, ComplianceOfficer]
    code: 200
    input: ["component_code?", "verdict?", "limit?", "offset?"]
    output: ComponentInspection[]
    side_effects: []

  - method: POST
    path: "/equipment-units/{id}/condemn"
    description: "Condemn a unit before testing when its age, a failed component or a withdrawn model makes reconditioning impossible."
    roles: [CertifyingInspector]
    code: 200
    input: [condemn_reason]
    output: EquipmentUnit
    side_effects:
      - "drives EquipmentUnit recon_status -> CONDEMNED from IDENTIFIED, DISASSEMBLED or INSPECTED"
      - "sets custody_status AT_PLANT->PENDING_DISPOSAL and creates a DestructionRecord with status PENDING"
      - "decrements IntakeShipment.units_in_process and increments IntakeShipment.units_condemned"
      - "may drive IntakeShipment IN_PROCESS->READY_FOR_RETURN and the CustomerAccount rollup"
      - "increments EquipmentUnit.version by 1"

  - method: POST
    path: "/equipment-units/{id}/stage-return"
    description: "Stage a certified unit for return shipment without changing its reconditioning state."
    roles: [IntakeClerk]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects:
      - "drives EquipmentUnit custody_status AT_PLANT->STAGED_FOR_RETURN"
      - "increments EquipmentUnit.version by 1"

  - method: POST
    path: "/equipment-units/{id}/release"
    description: "Release a staged unit into the program's custody, recording who took it."
    roles: [IntakeClerk]
    code: 200
    input: [released_to]
    output: EquipmentUnit
    side_effects:
      - "drives EquipmentUnit custody_status STAGED_FOR_RETURN->RETURNED and sets released_to"
      - "decrements IntakeShipment.units_certified and increments IntakeShipment.units_released"
      - "increments EquipmentUnit.version by 1"

  - method: POST
    path: "/equipment-units/{id}/purge-records"
    description: "Purge a unit's retained reconditioning records once its retention period has elapsed."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects:
      - "sets records_purged_at = clock"
      - "rejected while record_retention_until is null or still in the future"
      - "increments EquipmentUnit.version by 1"

  - method: GET
    path: "/equipment-units/{id}/certification-labels"
    description: "List every label ever issued for a unit, active and voided (FK reverse-reachability for CertificationLabel.equipment_unit_id)."
    roles: [PlantManager, IntakeClerk, CertifyingInspector, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CertificationLabel[]
    side_effects: []

  - method: GET
    path: "/equipment-units/{id}/destruction-records"
    description: "List the destruction records raised for a condemned unit (FK reverse-reachability for DestructionRecord.equipment_unit_id)."
    roles: [PlantManager, CertifyingInspector, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DestructionRecord[]
    side_effects: []

  # --- ShellTest ------------------------------------------------------------
  - method: POST
    path: "/shell-tests"
    description: "Book a shell test session on a calibrated rig for an inspected or repaired unit."
    roles: [Technician]
    code: 201
    input: [equipment_unit_id, test_bench_id, window_start, window_end, conditioning]
    output: ShellTest
    side_effects:
      - "sets attempt_index = 1 for the unit's first session, otherwise previous attempt_index + 1"
      - "increments EquipmentUnit.retest_count for every session after the first"
      - "enforces the bench cooldown interval and the bench daily session quota"
      - "initialises status = SCHEDULED"

  - method: GET
    path: "/shell-tests/{id}"
    description: "Read one shell test session, including peak g values, severity index, computed result and signed determination."
    roles: [PlantManager, Technician, CertifyingInspector, ComplianceOfficer]
    code: 200
    input: []
    output: ShellTest
    side_effects: []

  - method: GET
    path: "/shell-tests"
    description: "List shell tests, filterable by unit, bench and status (FK reverse-reachability for ShellTest.equipment_unit_id and ShellTest.test_bench_id)."
    roles: [PlantManager, Technician, CertifyingInspector, ComplianceOfficer]
    code: 200
    input: ["equipment_unit_id?", "test_bench_id?", "status?", "limit?", "offset?"]
    output: ShellTest[]
    side_effects: []

  - method: POST
    path: "/shell-tests/{id}/record-impacts"
    description: "Record the three impact-site peak g readings, producing the severity index and the machine result."
    roles: [Technician]
    code: 200
    input: [peak_g_front, peak_g_side, peak_g_crown]
    output: ShellTest
    side_effects:
      - "runs calc shell_test_severity_index (severity_index, computed_result)"
      - "drives ShellTest SCHEDULED->COMPLETED"
      - "drives EquipmentUnit INSPECTED->TESTED or REPAIRED->TESTED and sets EquipmentUnit.current_si"
      - "rejected when the bench calibration has expired against the logical clock"
      - "increments ShellTest.version by 1"

  - method: POST
    path: "/shell-tests/{id}/determine"
    description: "Sign the pass, repair or condemn determination for a completed session, optionally overriding the machine result upward in severity."
    roles: [CertifyingInspector]
    code: 200
    input: [determination, "override_reason?"]
    output: ShellTest
    side_effects:
      - "sets determination, override_reason and determined_by_user_id"
      - "drives ShellTest COMPLETED->DETERMINED"
      - "drives EquipmentUnit TESTED->TEST_PASSED, TESTED->REPAIR_PENDING or TESTED->CONDEMNED"
      - "on CONDEMN runs the full condemnation cascade: custody PENDING_DISPOSAL, DestructionRecord PENDING, shipment counters, shipment READY_FOR_RETURN, CustomerAccount rollup"
      - "increments ShellTest.version by 1"

  # --- RepairOrder ----------------------------------------------------------
  - method: POST
    path: "/repair-orders"
    description: "Open a repair order against a unit whose determination was REPAIR. Carries the unit's expected version, because a newly opened order supersedes any earlier one for the same unit."
    roles: [Technician]
    code: 201
    input: [equipment_unit_id, expected_equipment_unit_version]
    output: RepairOrder
    side_effects:
      - "rejects the create with ERR_STALE_UNIT_VERSION (412) when expected_equipment_unit_version != EquipmentUnit.version"
      - "initialises status = DRAFT, part_lines = [], all money fields 0"
      - "sets opened_by_user_id from X-User-ID"
      - "increments EquipmentUnit.version by 1"

  - method: GET
    path: "/repair-orders/{id}"
    description: "Read one repair order, including its part lines and money roll-ups."
    roles: [PlantManager, Technician, CertifyingInspector, ComplianceOfficer]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []

  - method: GET
    path: "/repair-orders"
    description: "List repair orders, filterable by unit and status (FK reverse-reachability for RepairOrder.equipment_unit_id)."
    roles: [PlantManager, Technician, CertifyingInspector, ComplianceOfficer]
    code: 200
    input: ["equipment_unit_id?", "status?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []

  - method: POST
    path: "/repair-orders/{id}/part-lines"
    description: "Append one replacement-part line to a draft order, snapshotting the part price."
    roles: [Technician]
    code: 200
    input: [approved_part_id, quantity, lot_code, "oem_cert_ref?"]
    output: RepairOrder
    side_effects:
      - "appends a part_lines value object with line_index = previous max + 1, status DRAFT, unit_price_cents_snapshot copied from ApprovedPart.unit_price_cents and line_total_cents = quantity * unit_price_cents_snapshot"
      - "rejected when the part is not OEM approved or belongs to another model"
      - "increments RepairOrder.version by 1"

  - method: POST
    path: "/repair-orders/{id}/submit"
    description: "Submit the order, reserving every line's parts out of on-hand stock."
    roles: [Technician]
    code: 200
    input: []
    output: RepairOrder
    side_effects:
      - "moves every line quantity from ApprovedPart.on_hand_qty to ApprovedPart.reserved_qty and sets line status RESERVED"
      - "recomputes reserved_parts_cents"
      - "drives RepairOrder DRAFT->PARTS_PENDING"
      - "rejected atomically when any line exceeds its part's on_hand_qty, leaving every stock bucket untouched"
      - "increments RepairOrder.version by 1"

  - method: POST
    path: "/repair-orders/{id}/install"
    description: "Record installation of the reserved approved components, consuming the reserved stock."
    roles: [Technician]
    code: 200
    input: ["warranty_claim_ref?"]
    output: RepairOrder
    side_effects:
      - "moves every reserved line quantity from ApprovedPart.reserved_qty to ApprovedPart.consumed_qty and sets line status INSTALLED"
      - "recomputes reserved_parts_cents and installed_parts_cents"
      - "sets installed_by_user_id from X-User-ID"
      - "requires warranty_claim_ref when EquipmentUnit.warranty_coverage == IN_WARRANTY"
      - "drives RepairOrder PARTS_PENDING->INSTALLED"
      - "increments RepairOrder.version by 1"

  - method: POST
    path: "/repair-orders/{id}/verify"
    description: "Independently verify the installed repair. The verifying technician must differ from the installing technician."
    roles: [Technician]
    code: 200
    input: [outcome, "note?"]
    output: RepairOrder
    side_effects:
      - "rejected with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals installed_by_user_id"
      - "on PASSED: sets verified_by_user_id, labor_cents = 4500, drives RepairOrder INSTALLED->CLOSED and EquipmentUnit REPAIR_PENDING->REPAIRED"
      - "on FAILED with attempts remaining: increments verification_failure_count and drives RepairOrder INSTALLED->PARTS_PENDING"
      - "on FAILED with attempts exhausted (verification_failure_count + 1 > 2): increments verification_failure_count, drives RepairOrder INSTALLED->CANCELLED and EquipmentUnit REPAIR_PENDING->CONDEMNED with condemn_reason REPAIR_UNSUCCESSFUL plus the full condemnation cascade"
      - "increments RepairOrder.version by 1"

  - method: POST
    path: "/repair-orders/{id}/cancel"
    description: "Cancel a draft or parts-pending order, returning any reserved stock to on hand."
    roles: [Technician, PlantManager]
    code: 200
    input: [cancel_reason]
    output: RepairOrder
    side_effects:
      - "returns every RESERVED line quantity from ApprovedPart.reserved_qty to ApprovedPart.on_hand_qty and sets line status DRAFT"
      - "recomputes reserved_parts_cents to 0 and sets cancel_reason"
      - "drives RepairOrder DRAFT->CANCELLED or PARTS_PENDING->CANCELLED"
      - "increments RepairOrder.version by 1"

  # --- CertificationLabel ---------------------------------------------------
  - method: POST
    path: "/certification-labels"
    description: "Issue the recertification label for a passed unit, carrying the unit's expected version because a label issued after a repair supersedes an earlier read of the unit."
    roles: [CertifyingInspector]
    code: 201
    input: [equipment_unit_id, expected_equipment_unit_version]
    output: CertificationLabel
    side_effects:
      - "rejects the create with ERR_STALE_UNIT_VERSION (412) when expected_equipment_unit_version != EquipmentUnit.version"
      - "runs calc certification_label_code (label_code, daily_sequence, standard_code_snapshot, certified_on)"
      - "sets issued_by_user_id from X-User-ID and status = ACTIVE"
      - "drives EquipmentUnit TEST_PASSED->CERTIFIED, sets certified_at and record_retention_until"
      - "decrements IntakeShipment.units_in_process, increments IntakeShipment.units_certified, and may drive IntakeShipment IN_PROCESS->READY_FOR_RETURN with the CustomerAccount rollup"
      - "increments EquipmentUnit.version by 1"

  - method: GET
    path: "/certification-labels/{id}"
    description: "Read one recertification label."
    roles: [PlantManager, IntakeClerk, CertifyingInspector, ComplianceOfficer]
    code: 200
    input: []
    output: CertificationLabel
    side_effects: []

  - method: POST
    path: "/certification-labels/{id}/void"
    description: "Void an active label, returning the unit to repair and reopening the shipment for settlement."
    roles: [ComplianceOfficer]
    code: 200
    input: [void_reason]
    output: CertificationLabel
    side_effects:
      - "drives CertificationLabel ACTIVE->VOIDED with voided_at, voided_by_user_id and void_reason"
      - "drives EquipmentUnit CERTIFIED->REPAIR_PENDING and clears certified_at and record_retention_until"
      - "increments IntakeShipment.units_in_process, decrements IntakeShipment.units_certified"
      - "drives IntakeShipment READY_FOR_RETURN->IN_PROCESS, clearing final_total_cents and settlement_locked, and re-increments CustomerAccount.open_shipment_count while clearing loaner_recall_due_at"
      - "increments CertificationLabel.version and EquipmentUnit.version by 1"

  # --- DestructionRecord ----------------------------------------------------
  - method: GET
    path: "/destruction-records/{id}"
    description: "Read one destruction record."
    roles: [PlantManager, CertifyingInspector, ComplianceOfficer]
    code: 200
    input: []
    output: DestructionRecord
    side_effects: []

  - method: POST
    path: "/destruction-records/{id}/witness"
    description: "Record witnessed destruction of a condemned shell so it cannot re-enter resale."
    roles: [ComplianceOfficer]
    code: 200
    input: [method, witness_name]
    output: DestructionRecord
    side_effects:
      - "sets method, witness_name, witnessed_by_user_id and witnessed_at = clock"
      - "drives DestructionRecord PENDING->WITNESSED"
      - "increments DestructionRecord.version by 1"

  - method: POST
    path: "/destruction-records/{id}/verify"
    description: "Verify the destruction evidence. The verifying officer must differ from the witnessing officer."
    roles: [ComplianceOfficer]
    code: 200
    input: [verification_ref]
    output: DestructionRecord
    side_effects:
      - "rejected with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals witnessed_by_user_id"
      - "sets verification_ref, verified_by_user_id and verified_at = clock"
      - "drives DestructionRecord WITNESSED->VERIFIED and EquipmentUnit custody PENDING_DISPOSAL->DISPOSED"
      - "sets EquipmentUnit.record_retention_until from the verification instant plus ModelSpec.record_retention_years"
      - "increments DestructionRecord.version and EquipmentUnit.version by 1"

  # --- LoanerAssignment -----------------------------------------------------
  - method: POST
    path: "/loaner-assignments"
    description: "Book a loaner for a program while its own equipment is in the plant. Omitting loaner_unit_id delegates the choice to the selector policy."
    roles: [IntakeClerk]
    code: 201
    input: [customer_account_id, requested_model_spec_id, window_start, window_end, "loaner_unit_id?"]
    output: LoanerAssignment
    side_effects:
      - "runs calc loaner_unit_selection when loaner_unit_id is omitted, writing loaner_unit_id and selected_by = SERVER_SELECTED; sets selected_by = EXPLICIT otherwise"
      - "sets status = OUT_ON_LOAN when window_start <= clock, RESERVED otherwise"
      - "drives LoanerUnit AVAILABLE->RESERVED or AVAILABLE->OUT_ON_LOAN and increments its assignment_count"
      - "rejected when the account has no current liability waiver or is on billing hold"

  - method: GET
    path: "/loaner-assignments/{id}"
    description: "Read one loaner assignment."
    roles: [PlantManager, IntakeClerk, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: LoanerAssignment
    side_effects: []

  - method: GET
    path: "/loaner-assignments"
    description: "List loaner assignments, filterable by account, requested model, loaner and status (FK reverse-reachability for LoanerAssignment.customer_account_id, requested_model_spec_id and loaner_unit_id)."
    roles: [PlantManager, IntakeClerk, ComplianceOfficer, CustomerContact]
    code: 200
    input: ["customer_account_id?", "requested_model_spec_id?", "loaner_unit_id?", "status?", "limit?", "offset?"]
    output: LoanerAssignment[]
    side_effects: []

  - method: POST
    path: "/loaner-assignments/{id}/return"
    description: "Take a loaner back into the plant pool."
    roles: [IntakeClerk]
    code: 200
    input: ["return_condition_note?"]
    output: LoanerAssignment
    side_effects:
      - "sets returned_at = clock and drives LoanerAssignment RESERVED->RETURNED or OUT_ON_LOAN->RETURNED"
      - "drives LoanerUnit back to AVAILABLE"
      - "increments LoanerAssignment.version and LoanerUnit.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / authorization -------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header absent, or X-User-Role is CustomerContact with no X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not in the endpoint's §1.5 roles list"
  - id: ERR_ACCOUNT_SCOPE_VIOLATION
    http: 403
    condition: "a CustomerContact reads an account, shipment or loaner assignment belonging to a different CustomerAccount"

  # --- schema ---------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, enum value outside the declared set, out-of-range number, or window_end not after window_start"

  # --- existence ------------------------------------------------------------
  - id: ERR_CUSTOMER_ACCOUNT_NOT_FOUND
    http: 404
    condition: "customer_account_id or the path account id matches no CustomerAccount"
  - id: ERR_MODEL_SPEC_NOT_FOUND
    http: 404
    condition: "model_spec_id or requested_model_spec_id matches no ModelSpec"
  - id: ERR_APPROVED_PART_NOT_FOUND
    http: 404
    condition: "approved_part_id or the path part id matches no ApprovedPart"
  - id: ERR_TEST_BENCH_NOT_FOUND
    http: 404
    condition: "test_bench_id or the path bench id matches no TestBench"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "intake_shipment_id or the path shipment id matches no IntakeShipment"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "equipment_unit_id or the path unit id matches no EquipmentUnit"
  - id: ERR_SHELL_TEST_NOT_FOUND
    http: 404
    condition: "the path shell-test id matches no ShellTest"
  - id: ERR_REPAIR_ORDER_NOT_FOUND
    http: 404
    condition: "the path repair-order id matches no RepairOrder"
  - id: ERR_LABEL_NOT_FOUND
    http: 404
    condition: "the path certification-label id matches no CertificationLabel"
  - id: ERR_DESTRUCTION_RECORD_NOT_FOUND
    http: 404
    condition: "the path destruction-record id matches no DestructionRecord"
  - id: ERR_LOANER_UNIT_NOT_FOUND
    http: 404
    condition: "loaner_unit_id or the path loaner id matches no LoanerUnit"
  - id: ERR_LOANER_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "the path loaner-assignment id matches no LoanerAssignment"

  # --- state ----------------------------------------------------------------
  - id: ERR_SHIPMENT_STATE_INVALID
    http: 409
    condition: "the shipment is not in a status from which the requested transition is defined (count on a non-DRAFT shipment, accept on a non-COUNTED/QUARANTINED shipment, unit registration on a shipment past COUNTED, settle on a shipment not READY_FOR_RETURN)"
  - id: ERR_UNIT_STATE_INVALID
    http: 409
    condition: "the unit's recon_status or custody_status does not admit the requested operation (identify a non-RECEIVED unit, disassemble a non-IDENTIFIED unit, inspect a unit not DISASSEMBLED, test a unit not INSPECTED/REPAIRED, label a unit not TEST_PASSED, release a unit not STAGED_FOR_RETURN, void a label on a unit already RETURNED or DISPOSED)"
  - id: ERR_SHELL_TEST_STATE_INVALID
    http: 409
    condition: "record-impacts on a session not SCHEDULED, or determine on a session not COMPLETED"
  - id: ERR_REPAIR_ORDER_STATE_INVALID
    http: 409
    condition: "part-lines or submit on a non-DRAFT order, install on a non-PARTS_PENDING order, verify on a non-INSTALLED order, or cancel on a CLOSED/CANCELLED order"
  - id: ERR_LABEL_ALREADY_VOIDED
    http: 409
    condition: "void on a CertificationLabel whose status is already VOIDED"
  - id: ERR_DESTRUCTION_STATE_INVALID
    http: 409
    condition: "witness on a record not PENDING, or verify on a record not WITNESSED"
  - id: ERR_LOANER_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "return on a LoanerAssignment already RETURNED"

  # --- business safety ------------------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the incompatible prior step: repair install vs repair verify, or destruction witness vs destruction verify"
  - id: ERR_CONDEMN_REQUIRED
    http: 422
    condition: "the unit has condemn_required == true and the request would certify it or sign a determination other than CONDEMN"
  - id: ERR_DETERMINATION_MISMATCH
    http: 422
    condition: "determination differs from the session's computed_result and no override_reason was supplied"
  - id: ERR_DETERMINATION_UPGRADE_FORBIDDEN
    http: 422
    condition: "an override_reason accompanies a determination less severe than computed_result under PASS < REPAIR < CONDEMN"
  - id: ERR_PART_NOT_APPROVED
    http: 422
    condition: "the referenced ApprovedPart has oem_approved == false"
  - id: ERR_PART_MODEL_MISMATCH
    http: 422
    condition: "the referenced ApprovedPart belongs to a ModelSpec other than the unit's model_spec_id"
  - id: ERR_MODEL_NOT_RECONDITIONABLE
    http: 422
    condition: "the unit's ModelSpec has reconditionable == false and the request would disassemble or repair it"
  - id: ERR_BENCH_CALIBRATION_EXPIRED
    http: 409
    condition: "the bench's calibration_valid_until is null or earlier than the logical clock at record-impacts time"
  - id: ERR_INSPECTION_INCOMPLETE
    http: 409
    condition: "a shell test is booked while the unit's inspection_verdict_summary is still PENDING"
  - id: ERR_DUPLICATE_INSPECTION
    http: 409
    condition: "a second ComponentInspection is recorded for a component_code the unit already has"

  # --- business constraints -------------------------------------------------
  - id: ERR_UNIT_COUNT_EXCEEDED
    http: 409
    condition: "registering another unit would push units_registered above counted_unit_count"
  - id: ERR_UNIT_REGISTRATION_INCOMPLETE
    http: 409
    condition: "accept is attempted while units_registered != counted_unit_count"
  - id: ERR_SERIAL_DUPLICATE
    http: 409
    condition: "the serial_number is already registered on another unit in the same shipment"
  - id: ERR_RETEST_LIMIT_EXCEEDED
    http: 409
    condition: "a new shell test would exceed the unit's ModelSpec.max_retest_count"
  - id: ERR_PART_STOCK_INSUFFICIENT
    http: 409
    condition: "any submitted part line requires more units than its ApprovedPart.on_hand_qty"

  # --- business temporal ----------------------------------------------------
  - id: ERR_BENCH_WINDOW_CONFLICT
    http: 409
    condition: "the requested bench window, expanded by the bench cooldown_minutes on both sides, intersects an existing session on that bench"
  - id: ERR_BENCH_DAILY_QUOTA_EXCEEDED
    http: 409
    condition: "the bench already holds daily_session_quota sessions on the requested UTC calendar day"
  - id: ERR_LOANER_DOUBLE_BOOKED
    http: 409
    condition: "an explicitly requested loaner already has an overlapping RESERVED or OUT_ON_LOAN window"
  - id: ERR_LOANER_CERTIFICATION_EXPIRED
    http: 422
    condition: "an explicitly requested loaner's certification_valid_until falls before the requested window_end"
  - id: ERR_NO_LOANER_AVAILABLE
    http: 409
    condition: "the selector policy finds no eligible loaner for the requested model and window"
  - id: ERR_LABEL_WINDOW_EXPIRED
    http: 422
    condition: "the label is requested more than 14 days after the unit's passing determination"
  - id: ERR_RETENTION_ACTIVE
    http: 409
    condition: "a records purge is attempted while record_retention_until is null or still in the future"

  # --- business referential -------------------------------------------------
  - id: ERR_LIABILITY_WAIVER_MISSING
    http: 409
    condition: "the account's liability_waiver_status is MISSING or STALE when accepting a shipment, releasing a unit or booking a loaner"
  - id: ERR_WARRANTY_CLAIM_REQUIRED
    http: 422
    condition: "an in-warranty unit's repair is installed without a warranty_claim_ref"

  # --- business fiscal ------------------------------------------------------
  - id: ERR_ACCOUNT_ON_HOLD
    http: 402
    condition: "the account's status is BILLING_HOLD when labelling, settling or booking a loaner"
  - id: ERR_SHIPMENT_NOT_READY
    http: 409
    condition: "settle is attempted while units_in_process != 0"
  - id: ERR_SETTLEMENT_LOCKED
    http: 409
    condition: "settle or label-void is attempted on a shipment whose settlement_locked is true"

  # --- concurrency ----------------------------------------------------------
  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "expected_equipment_unit_version does not match the unit's current version on label issue or repair-order create"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Owns reference data (models, parts, benches, loaners, accounts) and closes the commercial loop by settling shipments."
    identity: "opaque"
    exclusive_operations:
      - "POST /model-specs"
      - "POST /approved-parts"
      - "POST /test-benches"
      - "POST /test-benches/{id}/calibrate"
      - "POST /loaner-units"
      - "POST /customer-accounts"
      - "POST /customer-accounts/{id}/billing-hold"
      - "POST /intake-shipments/{id}/settle"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /customer-accounts/{id}/liability-acknowledgment"
      - "POST /repair-orders/{id}/cancel"
      - "all GET reads except GET /equipment-units/{id}/inspections filtered reads reserved to technical roles"

  - name: IntakeClerk
    description: "Runs the dock: intake shipments, counts, unit registration, model identification, custody staging, release and loaner logistics."
    identity: "opaque"
    exclusive_operations:
      - "POST /intake-shipments"
      - "POST /intake-shipments/{id}/count"
      - "POST /intake-shipments/{id}/accept"
      - "POST /equipment-units"
      - "POST /equipment-units/{id}/identify"
      - "POST /equipment-units/{id}/stage-return"
      - "POST /equipment-units/{id}/release"
      - "POST /loaner-assignments"
      - "POST /loaner-assignments/{id}/return"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /customer-accounts/{id}/liability-acknowledgment"
      - "GET /customer-accounts/{id}, GET /intake-shipments, GET /equipment-units, GET /loaner-units, GET /loaner-assignments"

  - name: Technician
    description: "Performs teardown, component inspection, bench testing and part installation. Cannot sign determinations or issue labels, and cannot verify a repair they installed."
    identity: "opaque"
    exclusive_operations:
      - "POST /equipment-units/{id}/disassemble"
      - "POST /equipment-units/{id}/inspections"
      - "POST /shell-tests"
      - "POST /shell-tests/{id}/record-impacts"
      - "POST /repair-orders"
      - "POST /repair-orders/{id}/part-lines"
      - "POST /repair-orders/{id}/submit"
      - "POST /repair-orders/{id}/install"
      - "POST /repair-orders/{id}/verify"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /repair-orders/{id}/cancel"
      - "GET /equipment-units, GET /equipment-units/{id}/inspections, GET /shell-tests, GET /repair-orders, GET /approved-parts"

  - name: CertifyingInspector
    description: "Signs pass/repair/condemn determinations, condemns non-reconditionable units and issues recertification labels. Cannot record the impacts they adjudicate."
    identity: "opaque"
    exclusive_operations:
      - "POST /shell-tests/{id}/determine"
      - "POST /equipment-units/{id}/condemn"
      - "POST /certification-labels"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /equipment-units, GET /equipment-units/{id}/inspections, GET /shell-tests, GET /repair-orders, GET /certification-labels/{id}"

  - name: ComplianceOfficer
    description: "Owns destruction verification, label voiding and record retention. Witness and verification of a single destruction must come from two different officers."
    identity: "opaque"
    exclusive_operations:
      - "POST /certification-labels/{id}/void"
      - "POST /destruction-records/{id}/witness"
      - "POST /destruction-records/{id}/verify"
      - "POST /equipment-units/{id}/purge-records"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /customer-accounts/{id}, GET /equipment-units, GET /equipment-units/{id}/destruction-records, GET /certification-labels/{id}, GET /destruction-records/{id}"

  - name: CustomerContact
    description: "Read-only representative of one program. X-User-ID is the CustomerAccount.id, so every read is scoped to that account."
    identity: "entity_backed:CustomerAccount"
    exclusive_operations: []
    shared_operations:
      - "GET /customer-accounts/{id} (own account only)"
      - "GET /intake-shipments and GET /intake-shipments/{id} (own account only)"
      - "GET /loaner-assignments and GET /loaner-assignments/{id} (own account only)"
