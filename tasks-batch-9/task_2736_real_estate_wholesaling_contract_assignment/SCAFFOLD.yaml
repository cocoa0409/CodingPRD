    output: PurchaseContract
    side_effects:
      - "property-occupancy interval conflict check on the lead"
      - "equity-skimming and max-allowable-offer checks"
      - "set assignment_deadline_at from closing_window_start_at"
      - "lead status becomes UNDER_CONTRACT"
      - "three status dimensions initialised to DRAFT / NOT_MARKETED / UNDECIDED"

  - method: GET
    path: /purchase-contracts/{purchase_contract_id}
    description: Read one purchase contract with all three status dimensions and the double-close schedule.
    roles: [Wholesaler, Seller, CashBuyer, TitleAgent, ComplianceOfficer, PlatformAdmin]
    success_code: 200
    input: []
    output: PurchaseContract
    side_effects: []

  - method: GET
    path: /purchase-contracts
    description: Filtered, paginated contract list; reverse lookup for PurchaseContract.seller_lead_id and PurchaseContract.deal_analysis_id.
