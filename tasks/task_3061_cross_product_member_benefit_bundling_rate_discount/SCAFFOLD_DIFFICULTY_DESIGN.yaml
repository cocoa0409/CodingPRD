              as: PlatformAdmin
              captures: { h_car8_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m8_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h_lend8_id: $.data.id }
            - call: "POST /benefits/holdings/${h_car8_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m8_id}"
            - call: "POST /benefits/holdings/${h_lend8_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m8_id}"
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "CAREER_BUNDLE", discount_kind: "CAREER_SERVICES", stacking_class: "ADDITIVE", discount_bps: 100, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { r_car8_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${r_car8_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/members/${m8_id}/entitlements"
              payload: { source_holding_id: "${h_car8_id}", benefit_code: "LOAN_RATE_DISCOUNT", value_bps: 100, governing_rule_id: "${r_car8_id}" }
              as: BenefitsAdmin
              captures: { ent8_id: $.data.id }
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${m8_id}", holding_id: "${h_lend8_id}", loan_type: "AUTO", principal_cents: 900000, base_apr_bps: 1300 }
              as: Underwriter
              captures: { la8_id: $.data.id }
            - call: "GET /benefits/loan-accounts/${la8_id}"
              payload: {}
              as: Underwriter
              captures: { la8_v: $.data.version }
            - call: "POST /benefits/loan-accounts/${la8_id}/applications"
              payload: { rule_id: "${r_car8_id}", expected_loan_account_version: "${la8_v}" }
              as: BenefitsAdmin
            - call: "POST /benefits/loan-accounts/${la8_id}/finalize-pricing"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /benefits/holdings/${h_car8_id}/close"
              payload: {}
              as: Member
              as_user_id: "${m8_id}"
          assert:
            - "hop 1: ProductHolding.${h_car8_id}.adoption_status == CLOSED with closed_at == 2026-09-01T00:00:00Z"
            - "hop 1 also drives the member's product_adoption_count to 1, so Member.${m8_id}.member_tier drops to BASE while the LENDING holding is untouched"
            - "hop 1 does NOT itself revoke the entitlement, which is sourced from the untouched LENDING holding"
            - "hop 2 is caused by hop 1 through the governing_rule_id link, not by any direct action: BenefitEntitlement.${ent8_id}.entitlement_status == REVOKED"
            - "hop 3 (caused by hop 2): the DiscountApplication for CAREER_BUNDLE on la8 has application_state == ROLLED_BACK"
            - "end state: LoanAccount.${la8_id}.discount_stack_bps == 0 and effective_apr_bps == 1300, while LoanAccount.${la8_id}.pricing_status stays FINAL"
            - "end state: ProductHolding.${h_lend8_id}.reunderwriting_permitted stays true, because la8 never left FINAL — the cascade does not over-reach"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_precondition_outranks_compliance_on_cross_sell_decide
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_CONDITIONING_BLOCKED]
        distinguishing_aspect: |
          A different error-category pair from the companion instance — state (priority 6)
          versus business_safety (priority 8) — so the winner is decided by the raw priority
          number rather than by any domain-specific ordering inside business rules.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m9 holds one ADOPTED LENDING holding; CrossSellCheck cs9 targets INVESTING with consent_recorded false, so conditioning_blocked is true because the target line is in {BANKING, INVESTING} and no consent is on file."
            - "CrossSellCheck cs9 has already been decided BLOCKED, so its status is terminal and no transition leaves it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-009", full_name: "Ira Bell", email: "ira@x.com" }
              as: Anonymous
              captures: { m9_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m9_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h9_id: $.data.id }
            - call: "POST /benefits/holdings/${h9_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m9_id}"
            - call: "POST /benefits/cross-sell-checks"
              payload: { member_id: "${m9_id}", target_product_line: "INVESTING", consent_recorded: false }
              as: BenefitsAdmin
              captures: { cs9_id: $.data.id }
            - call: "POST /benefits/cross-sell-checks/${cs9_id}/decide"
              payload: { outcome: "BLOCKED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /benefits/cross-sell-checks/${cs9_id}/decide"
              payload: { outcome: "CLEARED" }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409, not 422"
            - "error_id == ERR_INVALID_STATE"
            - "error_id != ERR_CREDIT_CONDITIONING_BLOCKED even though conditioning_blocked is still true"
            - "CrossSellCheck.${cs9_id}.status remains BLOCKED and every LENDING holding of ${m9_id} keeps cross_sell_eligible unchanged"

      - name: rule_window_overlap_outranks_join_to_a_draft_rule_on_activation
        grounds:
          - validations[priority=13]
          - validations[priority=28]
          - errors[ERR_RULE_WINDOW_OVERLAP]
          - errors[ERR_ACTIVE_RULE_ON_UNPRICED_LOAN]
        distinguishing_aspect: |
          A different error-category pair — business_constraint (priority 13) versus
          business_referential (priority 28) — both violable by a single activation request,
          so the winner is the constraint rule sitting nine priority slots above the
          referential one.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Rule OVL_A (AUTOPAY, ADDITIVE, 40 bps) is ACTIVE over 2026-01-01 to 2027-01-01."
            - "Rule DRAFT_PARENT (AUTOPAY, ADDITIVE, 10 bps) is still DRAFT over 2026-01-01 to 2027-01-01."
            - "Rule OVL_B is DRAFT over 2026-06-01 to 2027-06-01, overlaps OVL_A by more than a day, and declares stacks_on_rule_id = DRAFT_PARENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "OVL_A", discount_kind: "AUTOPAY", stacking_class: "ADDITIVE", discount_bps: 40, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { ovl_a_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${ovl_a_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "DRAFT_PARENT", discount_kind: "AUTOPAY", stacking_class: "ADDITIVE", discount_bps: 10, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { draft_parent_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "OVL_B", discount_kind: "AUTOPAY", stacking_class: "ADDITIVE", discount_bps: 35, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z", stacks_on_rule_id: "${draft_parent_id}" }
              as: BenefitsAdmin
              captures: { ovl_b_id: $.data.id }
          trigger:
            - call: "POST /benefits/rate-discount-rules/${ovl_b_id}/activate"
              payload: {}
              as: BenefitsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409, not 422"
            - "error_id == ERR_RULE_WINDOW_OVERLAP"
            - "error_id != ERR_ACTIVE_RULE_ON_UNPRICED_LOAN, even though OVL_B's joined rule DRAFT_PARENT is still DRAFT and would independently block activation at priority 28"
            - "RateDiscountRule.${ovl_b_id}.status stays DRAFT and the joined rule ${draft_parent_id} stays DRAFT"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: deposit_balance_band_boundary_at_exactly_the_minimum
        grounds:
          - calculations.deposit_rate_boost_bps
          - entities.Member.fields.qualifying_deposit_balance_cents
          - validations[priority=19]
          - endpoints.GET_/benefits/members/{member_id}/deposit-rate-projection
        distinguishing_aspect: |
          A numeric threshold crossing reached through the deposit-rate projection endpoint:
          a qualifying balance of exactly BAND_1_MIN_BALANCE_CENTS (100000) admits the 25 bps
          boost and one cent below it collapses to 0, pinning >= against >.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m11 holds a BANKING holding funded at exactly 100000 cents and has an ACTIVE enrollment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-011", full_name: "Kai Ferro", email: "kai@x.com" }
              as: Anonymous
              captures: { m11_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m11_id}", product_line: "BANKING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h11_id: $.data.id }
            - call: "POST /benefits/holdings/${h11_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m11_id}"
            - call: "POST /benefits/deposit-enrollments"
              payload: { member_id: "${m11_id}", required_monthly_amount_cents: 100000 }
              as: PlatformAdmin
              captures: { en11_id: $.data.id }
            - call: "POST /benefits/members/${m11_id}/deposits"
              payload: { enrollment_id: "${en11_id}", amount_cents: 100000, posted_at: "2026-09-01T00:00:00Z", holding_id: "${h11_id}" }
              as: PlatformAdmin
            - call: "POST /benefits/deposit-enrollments/${en11_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /benefits/members/${m11_id}/deposit-rate-projection"
              payload: {}
              as: Member
              as_user_id: "${m11_id}"
          assert:
            - "Member.${m11_id}.qualifying_deposit_balance_cents == 100000 exactly"
            - "the response reports current_boost_bps == 25 (the boundary is >= BAND_1_MIN_BALANCE_CENTS, not >)"
            - "the response reports projected_boost_bps == 25 under the trailing-average variant as well, since the single month's average equals the spot balance"
            - "moving the balance one cent lower to 99999 would report current_boost_bps == 0, confirming the boundary is not off by one"
            - "Member.${m11_id}.benefit_entitlement_state == FULL and each BANKING holding reports deposit_rate_eligible == true"

      - name: redemption_points_floor_boundary_and_the_empty_entry_set
        grounds:
          - calculations.rewards_points_balance
          - calculations.rewards_principal_reduction_cents
          - validations[priority=22]
          - validations[priority=23]
        distinguishing_aspect: |
          An empty-collection and zero-quantity edge rather than a numeric rate threshold: a
          member with no POSTED entries at all reports a balance of 0 and is refused with the
          fiscal error, which is a different class of boundary than a threshold crossing.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m12 holds an ADOPTED LENDING holding with LoanAccount la12, and has never earned a point."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-012", full_name: "Liv Moreau", email: "liv@x.com" }
              as: Anonymous
              captures: { m12_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m12_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h12_id: $.data.id }
            - call: "POST /benefits/holdings/${h12_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m12_id}"
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${m12_id}", holding_id: "${h12_id}", loan_type: "PERSONAL", principal_cents: 400000, base_apr_bps: 1000 }
              as: Underwriter
              captures: { la12_id: $.data.id }
          trigger:
            - call: "POST /benefits/members/${m12_id}/rewards/redeem-principal"
              payload: { loan_account_id: "${la12_id}", points: 1000, source_event_code: "REDEEM_EMPTY" }
              as: Member
              as_user_id: "${m12_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_INSUFFICIENT_POINTS"
            - "error_id != ERR_REDEMPTION_LIMIT_EXCEEDED, even though 1000 sits exactly on MIN_REDEEM_POINTS (the boundary is inclusive)"
            - "Member.${m12_id}.rewards_points_balance == 0 over an empty posted-entry set"
            - "GET /benefits/rewards-ledger-entries?member_id=${m12_id} returns 0 rows, so no zero-amount entry is synthesized"
            - "LoanAccount.${la12_id}.principal_cents stays 400000"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: loan_finalize_requires_the_latest_requalification_cycle_passed
        grounds:
          - state_machines.LoanAccount.PROVISIONAL_to_FINAL
          - state_machines.RequalificationCycle.OPEN_to_PASSED
          - validations[priority=21]
          - endpoints.POST_/benefits/loan-accounts/{loan_account_id}/finalize-pricing
        distinguishing_aspect: |
          The LoanAccount-to-RequalificationCycle pair: every precondition on the
          finalize-pricing transition reads the cycle's status rather than any field on the
          loan, and a different entity pair from the companion instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m13 holds an ADOPTED LENDING holding and LoanAccount la13 in PROVISIONAL."
            - "A RequalificationCycle cy13 was opened on 2026-06-01T00:00:00Z with due_at 2026-09-01T00:00:00Z and is still OPEN with qualifying_month_count 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-013", full_name: "Mila Otto", email: "mila@x.com" }
              as: Anonymous
              captures: { m13_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m13_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h13_id: $.data.id }
            - call: "POST /benefits/holdings/${h13_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m13_id}"
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${m13_id}", holding_id: "${h13_id}", loan_type: "REFINANCE", principal_cents: 2500000, base_apr_bps: 1150 }
              as: Underwriter
              captures: { la13_id: $.data.id }
            - call: "GET /benefits/members/${m13_id}"
              payload: {}
              as: PlatformAdmin
              captures: { m13_v: $.data.version }
            - call: "POST /benefits/members/${m13_id}/requalification-cycles"
              payload: { expected_member_version: "${m13_v}" }
              as: PlatformAdmin
              captures: { cy13_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /benefits/requalification-cycles/${cy13_id}/evaluate"
              payload: {}
              as: PlatformAdmin
          assert:
            - "RequalificationCycle.${cy13_id}.status == FAILED with qualifying_month_count 1 below CONSECUTIVE_DEPOSIT_MONTHS_REQUIRED 3"
            - "the FAILED cycle is what blocks LoanAccount.${la13_id} from finalizing: POST /benefits/loan-accounts/${la13_id}/finalize-pricing is refused"
            - "LoanAccount.${la13_id}.pricing_status stays PROVISIONAL"
            - "the same call succeeds once POST /benefits/requalification-cycles/${cy13_id}/open-remediation plus a passing re-evaluate moves the cycle to PASSED, so the loan's own fields never decided the outcome"
            - "LoanAccount.${la13_id}.pricing_status == FINAL only after the cycle reaches PASSED"

      - name: cross_sell_clearance_gates_a_second_check_on_the_member
        grounds:
          - state_machines.CrossSellCheck.PENDING_to_CLEARED
          - state_machines.CrossSellCheck.PENDING_to_BLOCKED
          - calculations.cross_sell_eligibility
          - entities.ProductHolding.fields.cross_sell_eligible
        distinguishing_aspect: |
          The CrossSellCheck-to-ProductHolding pair: a holding's cross_sell_eligible flips
          only when a check on the member reaches a terminal status, and the derivation reads
          the check's greatest created_at rather than the holding's own fields.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m14 holds one ADOPTED INVESTING holding h14 with a PENDING check cs14_b targeting INVESTING and consent_recorded true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-014", full_name: "Nia Ravel", email: "nia@x.com" }
              as: Anonymous
              captures: { m14_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m14_id}", product_line: "INVESTING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h14_id: $.data.id }
            - call: "POST /benefits/holdings/${h14_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m14_id}"
            - call: "POST /benefits/cross-sell-checks"
              payload: { member_id: "${m14_id}", target_product_line: "INVESTING", consent_recorded: true }
              as: BenefitsAdmin
              captures: { cs14_b_id: $.data.id }
          trigger:
            - call: "POST /benefits/cross-sell-checks/${cs14_b_id}/decide"
              payload: { outcome: "CLEARED" }
              as: ComplianceOfficer
          assert:
            - "ProductHolding.${h14_id}.cross_sell_eligible == false while cs14_b is PENDING, because no CLEARED check exists yet"
            - "after the decide, CrossSellCheck.${cs14_b_id}.status == CLEARED and ProductHolding.${h14_id}.cross_sell_eligible == true"
            - "opening a later check targeting the same line and deciding it BLOCKED flips ProductHolding.${h14_id}.cross_sell_eligible back to false, because the derivation reads the check with the greatest created_at"
            - "a check targeting BANKING never changes ProductHolding.${h14_id}.cross_sell_eligible, which is scoped to the holding's own product_line"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: career_coaching_slot_exclusive_on_a_closed_interval
        grounds:
          - validations[priority=18]
          - calculations.session_seats_reserved
          - state_machines.CoachingSession.SCHEDULED_to_CONFIRMED
          - errors[ERR_SESSION_OVERLAP]
        distinguishing_aspect: |
          Closed-interval semantics on a capacity-1 coach: the endpoint is inclusive, so a
          session running 15:00-16:00 and a second running 16:00-17:00 collide and the second
          is refused — the geometry is the closed reading, not the half-open one.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m15 holds an ADOPTED CAREER holding with a GRANTED CAREER_COACHING_CREDIT entitlement."
            - "A coaching session cs15 occupies coach_ref COACH-BETA from 2026-09-10T15:00:00Z to 2026-09-10T16:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-015", full_name: "Olu Vance", email: "olu@x.com" }
              as: Anonymous
              captures: { m15_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m15_id}", product_line: "CAREER", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h15_id: $.data.id }
            - call: "POST /benefits/holdings/${h15_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m15_id}"
            - call: "POST /benefits/members/${m15_id}/entitlements"
              payload: { source_holding_id: "${h15_id}", benefit_code: "CAREER_COACHING_CREDIT", value_bps: 1 }
              as: BenefitsAdmin
            - call: "POST /benefits/coaching-sessions"
              payload: { member_id: "${m15_id}", coach_ref: "COACH-BETA", session_kind: "CAREER_COACHING", starts_at: "2026-09-10T15:00:00Z", ends_at: "2026-09-10T16:00:00Z", capacity_total: 1 }
              as: BenefitsAdmin
              captures: { cs15_id: $.data.id }
          trigger:
            - call: "POST /benefits/coaching-sessions"
              payload: { member_id: "${m15_id}", coach_ref: "COACH-BETA", session_kind: "CAREER_COACHING", starts_at: "2026-09-10T16:00:00Z", ends_at: "2026-09-10T17:00:00Z", capacity_total: 1 }
              as: BenefitsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_SESSION_OVERLAP"
            - "the collision is caused by the shared endpoint 2026-09-10T16:00:00Z, which the closed-interval rule treats as overlap"
            - "the same 16:00-17:00 booking on coach COACH-GAMMA, where no session exists, succeeds — the collision is scoped to coach_ref"
            - "CoachingSession.${cs15_id}.seats_reserved stays 1"

      - name: member_event_seat_pool_saturates_on_a_half_open_interval
        grounds:
          - validations[priority=31]
          - calculations.session_seats_reserved
          - errors[ERR_SESSION_CAPACITY_SATURATED]
          - entities.CoachingSession.fields.capacity_total
        distinguishing_aspect: |
          Half-open interval arithmetic on a capacity-pool event venue: two sessions that
          merely touch at 19:00 do NOT collide, and the refusal fires on aggregate seat count
          rather than on any pairwise collision — different geometry and a different resource
          type from the exclusive coach slot.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m16 holds an ADOPTED CAREER holding, and has already booked one seat of the 18:00-19:00 EVENT-HALL event; the shared event capacity is 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-016", full_name: "Pia Nowak", email: "pia@x.com" }
              as: Anonymous
              captures: { m16_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m16_id}", product_line: "CAREER", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h16_id: $.data.id }
            - call: "POST /benefits/holdings/${h16_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m16_id}"
            - call: "POST /benefits/coaching-sessions"
              payload: { member_id: "${m16_id}", coach_ref: "EVENT-HALL", session_kind: "MEMBER_EVENT", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T19:00:00Z", capacity_total: 2 }
              as: BenefitsAdmin
              captures: { ev16_id: $.data.id }
          trigger:
            - call: "POST /benefits/coaching-sessions"
              payload: { member_id: "${m16_id}", coach_ref: "EVENT-HALL", session_kind: "MEMBER_EVENT", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T19:00:00Z", capacity_total: 2 }
              as: BenefitsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_SESSION_CAPACITY_SATURATED"
            - "error_id != ERR_SESSION_OVERLAP, because the half-open rule never reports a pairwise collision here; the refusal is an aggregate seat-count breach"
            - "the shared event capacity is 2 and one seat is already held, so 1 held + 1 requested exceeds the pool and the booking is refused"
            - "a booking at 2026-09-20T19:00:00Z-2026-09-20T20:00:00Z does NOT collide with the 18:00-19:00 event under the half-open rule and succeeds with 201"
            - "CoachingSession.${ev16_id}.seats_reserved == 1 after the refusal"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: redemptions_plus_reversals_restore_principal_exactly
        grounds:
          - state_machines.RewardsLedgerEntry.POSTED_to_REVERSED
          - calculations.rewards_points_balance
          - calculations.rewards_principal_reduction_cents
          - entities.LoanAccount.fields.principal_cents
        distinguishing_aspect: |
          The conserved quantity is a loan principal balance in cents, and a forward
          redemption paired with its compensating reversal must leave it byte-identical —
          a different conserved quantity type from the point balance invariant.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m17 holds an ADOPTED LENDING holding and LoanAccount la17 with principal_cents 600000 and rewards_points_balance 5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-017", full_name: "Quinn Hass", email: "quinn@x.com" }
              as: Anonymous
              captures: { m17_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m17_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h17_id: $.data.id }
            - call: "POST /benefits/holdings/${h17_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m17_id}"
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${m17_id}", holding_id: "${h17_id}", loan_type: "PERSONAL", principal_cents: 600000, base_apr_bps: 1050 }
              as: Underwriter
              captures: { la17_id: $.data.id }
            - call: "POST /benefits/members/${m17_id}/rewards/adjust"
              payload: { points_delta: 5000, source_event_code: "PROMO_CREDIT" }
              as: BenefitsAdmin
          trigger:
            - call: "POST /benefits/members/${m17_id}/rewards/redeem-principal"
              payload: { loan_account_id: "${la17_id}", points: 2500, source_event_code: "REDEEM_X" }
              as: Member
              as_user_id: "${m17_id}"
              captures: { e_x_id: $.data.id }
            - call: "POST /benefits/rewards-ledger-entries/${e_x_id}/reverse"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "after the redemption: LoanAccount.${la17_id}.principal_cents == 599975 (600000 - 2500 // 100 = 25)"
            - "after the reversal: LoanAccount.${la17_id}.principal_cents == 600000, restoring the endpoint exactly"
            - "RewardsLedgerEntry.${e_x_id}.entry_status == REVERSED and its reversed_by_entry_id is set"
            - "invariant: LoanAccount.principal_cents after (redeem + reverse) minus principal_cents before equals 0, with zero drift at 2-decimal cent precision"
            - "a second reversal of the same entry is refused, so the invariant cannot be driven negative by repeating the compensation"

      - name: rewards_point_balance_is_exactly_restored_by_a_reversal
        grounds:
          - calculations.rewards_points_balance
          - state_machines.RewardsLedgerEntry.POSTED_to_REVERSED
          - entities.Member.fields.rewards_points_balance
          - endpoints.POST_/benefits/coaching-sessions/{session_id}/complete
        distinguishing_aspect: |
          The conserved quantity is a points balance rather than a cent principal, and the
          forward action is an earning rather than a redemption, so the invariant is over a
          different quantity type and a different forward transition.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m18 holds an ADOPTED CAREER holding with a GRANTED CAREER_COACHING_CREDIT entitlement and a confirmed coaching session cs18."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-018", full_name: "Rex Delgado", email: "rex@x.com" }
              as: Anonymous
              captures: { m18_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m18_id}", product_line: "CAREER", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h18_id: $.data.id }
            - call: "POST /benefits/holdings/${h18_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m18_id}"
            - call: "POST /benefits/members/${m18_id}/entitlements"
              payload: { source_holding_id: "${h18_id}", benefit_code: "CAREER_COACHING_CREDIT", value_bps: 1 }
              as: BenefitsAdmin
            - call: "POST /benefits/coaching-sessions"
              payload: { member_id: "${m18_id}", coach_ref: "COACH-DELTA", session_kind: "CAREER_COACHING", starts_at: "2026-09-14T14:00:00Z", ends_at: "2026-09-14T15:00:00Z", capacity_total: 1 }
              as: BenefitsAdmin
              captures: { cs18_id: $.data.id }
            - call: "POST /benefits/coaching-sessions/${cs18_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m18_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T15:01:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /benefits/coaching-sessions/${cs18_id}/complete"
              payload: {}
              as: PlatformAdmin
              captures: { net_row: $.data.id }
          assert:
            - "Member.${m18_id}.rewards_points_balance goes from 0 to 250, the CAREER_SESSION_POINTS constant"
            - "the EARN entry carries points_delta == 250 and entry_status == POSTED"
            - "reversing that entry appends a REVERSE row with points_delta == -250 and leaves Member.${m18_id}.rewards_points_balance == 0"
            - "invariant: sum(points_delta over POSTED entries) equals Member.rewards_points_balance exactly, before and after the compensation"
            - "the reversal cannot be applied twice, so no compensating row can drive the balance below zero"

