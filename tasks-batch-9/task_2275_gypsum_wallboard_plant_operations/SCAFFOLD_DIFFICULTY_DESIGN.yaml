# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Domain: gypsum-wallboard-plant-ops   (api_prefix: /plant-ops)
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. Deleting this file leaves
# the scaffold's declared behavior identical.
#
# Logical clock: before any call the server clock reads 2026-08-01T00:00:00Z.
# Every numeric assert below was computed by executing the §1.3 formulas with
# their pinned `constants:` (Decimal, ROUND_HALF_UP) — no estimates.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: batch_yield_plan_vs_as_fed_basis_diverge
        grounds:
          - calculations.batch_blend_metrics
          - calculations.stucco_yield_tons
          - entities.CalcinerBatch.fields.stucco_yield_plan_tons
          - entities.CalcinerBatch.fields.stucco_yield_actual_tons
          - state_machines.CalcinerBatch.FEEDING_to_CALCINING
          - state_machines.CalcinerBatch.CALCINING_to_COMPLETED
        distinguishing_aspect: |
          PLAN_BASIS weights each feed by its lot's assay moisture while AS_FED_BASIS uses the
          belt-scale moisture measured at the feeder, so the same three feeds yield
          stucco_yield_plan_tons 205.896 at close-feed and stucco_yield_actual_tons 204.530 at
          batch completion — a pinned delta of -1.366 tons that only the silo credit reflects.
        test_recipe:
          setup:
            - "Plant GYP-1 with 60 tph calciner, 1200 t silo, default purity floor 88.0 and synthetic moisture ceiling 12.0."
            - "Lot A SYNTHETIC 300.000 t assayed 9.40 % free moisture / 94.0 % purity -> APPROVED; Lot B NATURAL 200.000 t assayed 2.60 / 91.5 -> APPROVED."
            - "Batch B1 planned for 230.000 t stucco on an 08:00-14:00 window at 40.0 tph, fed 120.000 t of A at belt moisture 10.20, 80.000 t of B at 3.10, then 60.000 t of A at 9.80, then feed closed (CALCINING)."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Comanche FGD", received_tons: 300.000, declared_free_moisture_pct: 9.50, declared_purity_pct: 94.0 }
              as: MaterialsController
              captures: { lot_a_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_a_id}/assay"
              payload: { free_moisture_pct: 9.40, purity_pct: 94.0, chloride_ppm: 120 }
              as: MaterialsController
              captures: { lot_a_v: $.data.version }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "NATURAL", supplier_name: "Loveland Quarry", received_tons: 200.000, declared_free_moisture_pct: 2.80, declared_purity_pct: 91.5 }
              as: MaterialsController
              captures: { lot_b_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_b_id}/assay"
              payload: { free_moisture_pct: 2.60, purity_pct: 91.5, chloride_ppm: 80 }
              as: MaterialsController
              captures: { lot_b_v: $.data.version }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 230.000, calcination_temp_f: 320.0, feed_rate_tph: 40.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T14:00:00Z" }
              as: MaterialsController
              captures: { b1_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches/${b1_id}/feeds"
              payload: { lot_id: "${lot_a_id}", tons_fed: 120.000, measured_free_moisture_pct: 10.20, expected_lot_version: "${lot_a_v}" }
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${b1_id}/feeds"
              payload: { lot_id: "${lot_b_id}", tons_fed: 80.000, measured_free_moisture_pct: 3.10, expected_lot_version: "${lot_b_v}" }
              as: MaterialsController
            - call: "GET /plant-ops/gypsum-lots/${lot_a_id}"
              payload: {}
              as: MaterialsController
              captures: { lot_a_v2: $.data.version }
            - call: "POST /plant-ops/calciner-batches/${b1_id}/feeds"
              payload: { lot_id: "${lot_a_id}", tons_fed: 60.000, measured_free_moisture_pct: 9.80, expected_lot_version: "${lot_a_v2}" }
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${b1_id}/close-feed"
              payload: {}
              as: MaterialsController
          trigger:
            - call: "POST /plant-ops/calciner-batches/${b1_id}/stucco-tests"
              payload: { sample_seq: 1, combined_water_pct: 5.60, free_water_pct: 0.18, set_time_minutes: 7.50, normal_consistency_cc: 78.0 }
              as: QualityInspector
          assert:
            - "CalcinerBatch.${b1_id}.feed_tons_total == 260.000"
            - "CalcinerBatch.${b1_id}.feed_moisture_plan_pct == 7.31"
            - "CalcinerBatch.${b1_id}.feed_moisture_as_fed_pct == 7.92"
            - "CalcinerBatch.${b1_id}.feed_purity_plan_pct == 93.23"
            - "CalcinerBatch.${b1_id}.stucco_yield_plan_tons == 205.896"
            - "CalcinerBatch.${b1_id}.stucco_yield_actual_tons == 204.530"
            - "CalcinerBatch.${b1_id}.stucco_yield_actual_tons - CalcinerBatch.${b1_id}.stucco_yield_plan_tons == -1.366"
            - "CalcinerBatch.${b1_id}.status == COMPLETED and CalcinerBatch.${b1_id}.stucco_quality_flag == PASS"
            - "Plant.${plant_id}.stucco_on_hand_tons == 204.530"
            - "Plant.${plant_id}.stucco_available_tons == 204.530"
            - "Plant.${plant_id}.production_posture == OPEN"

      - name: freight_quoted_vs_settled_diverge_on_load
        grounds:
          - calculations.freight_charge
          - calculations.bundle_load_metrics
          - entities.LoadOrder.fields.quoted_freight_usd
          - entities.LoadOrder.fields.settled_freight_usd
          - entities.LoadOrder.fields.freight_variance_usd
          - state_machines.LoadOrder.LOADED_to_SHIPPED
        distinguishing_aspect: |
          The QUOTED variant is stamped at staging from bundles_count and ignores both the trailer
          overweight fee and the backhaul credit, while SETTLED recomputes on loaded_bundles_count
          and adds the overweight fee: the same 12-bundle REGULAR load to the 640-mile ZONE_4
          market quotes 756.79 and settles 761.53 with overweight_fee_usd 4.74 and
          freight_variance_usd 4.74.
        test_recipe:
          setup:
            - "Plant GYP-1, LINE-1, REGULAR 1/2 in SKU (48 boards/bundle ceiling), FAR market Denver Metro 640 miles (ZONE_4, base 23.10, fuel 18.5 %, min charge 425.00, backhaul credit 60.00)."
            - "Batch B1 COMPLETED with 204.530 t stucco in the silo."
            - "Run R1 on LINE-1 for the 2026-08-03 06:00-10:00 window, scheduled at 400 fpm, started, completed with 295.000 actual / 5.000 scrap MSF and clean defect rates -> net_good_msf 290.000."
            - "Three passing board specimens recorded and the run evaluated RELEASED, then a 12-bundle load staged for the FAR market at 48 boards per bundle."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/board-lines"
              payload: { designation: "LINE-1", max_speed_fpm: 500, web_width_in: 54.0 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/product-specs"
              payload: { sku_code: "REG-050-4X12", thickness_in: 0.5, board_type: "REGULAR", fire_rated: false, board_width_in: 48.0, board_length_ft: 12.0, target_board_weight_lb_per_msf: 1600.0, stucco_lb_per_msf: 1350.0, slurry_water_stucco_ratio: 0.75, line_speed_max_fpm: 480, paper_tension_min_lb: 28.0, paper_tension_max_lb: 46.0, core_hardness_min_lbf: 15.0, nail_pull_min_lbf: 77.0, flexural_cross_min_lbf: 36.0, max_boards_per_bundle: 48, changeover_family: "STANDARD" }
              as: PlantAdmin
              captures: { spec_reg_id: $.data.id }
            - call: "POST /plant-ops/markets"
              payload: { name: "Denver Metro", distance_miles: 640, fuel_surcharge_pct: 18.5, min_charge_usd: 425.00, backhaul_credit_usd: 60.00 }
              as: PlantAdmin
              captures: { market_far_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Comanche FGD", received_tons: 300.000, declared_free_moisture_pct: 9.50, declared_purity_pct: 94.0 }
              as: MaterialsController
              captures: { lot_a_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_a_id}/assay"
              payload: { free_moisture_pct: 9.40, purity_pct: 94.0, chloride_ppm: 120 }
              as: MaterialsController
              captures: { lot_a_v: $.data.version }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "NATURAL", supplier_name: "Loveland Quarry", received_tons: 200.000, declared_free_moisture_pct: 2.80, declared_purity_pct: 91.5 }
              as: MaterialsController
              captures: { lot_b_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_b_id}/assay"
              payload: { free_moisture_pct: 2.60, purity_pct: 91.5, chloride_ppm: 80 }
              as: MaterialsController
              captures: { lot_b_v: $.data.version }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 230.000, calcination_temp_f: 320.0, feed_rate_tph: 40.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T14:00:00Z" }
              as: MaterialsController
              captures: { b1_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches/${b1_id}/feeds"
              payload: { lot_id: "${lot_a_id}", tons_fed: 120.000, measured_free_moisture_pct: 10.20, expected_lot_version: "${lot_a_v}" }
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${b1_id}/feeds"
              payload: { lot_id: "${lot_b_id}", tons_fed: 80.000, measured_free_moisture_pct: 3.10, expected_lot_version: "${lot_b_v}" }
              as: MaterialsController
            - call: "GET /plant-ops/gypsum-lots/${lot_a_id}"
              payload: {}
              as: MaterialsController
              captures: { lot_a_v2: $.data.version }
            - call: "POST /plant-ops/calciner-batches/${b1_id}/feeds"
              payload: { lot_id: "${lot_a_id}", tons_fed: 60.000, measured_free_moisture_pct: 9.80, expected_lot_version: "${lot_a_v2}" }
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${b1_id}/close-feed"
              payload: {}
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${b1_id}/stucco-tests"
              payload: { sample_seq: 1, combined_water_pct: 5.60, free_water_pct: 0.18, set_time_minutes: 7.50, normal_consistency_cc: 78.0 }
              as: QualityInspector
            - call: "POST /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", line_id: "${line_id}", product_spec_id: "${spec_reg_id}", calciner_batch_id: "${b1_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T10:00:00Z", requested_planned_msf: 300.000, line_speed_fpm: 400, paper_tension_lb: 38.0, kiln_dwell_minutes: 40, kiln_exit_moisture_target_pct: 0.50 }
              as: ProductionScheduler
              captures: { r1_id: $.data.id }
            - call: "GET /plant-ops/plants/${plant_id}"
              payload: {}
              as: ProductionScheduler
              captures: { p_v: $.data.version }
            - call: "POST /plant-ops/production-runs/${r1_id}/schedule"
              payload: { expected_plant_version: "${p_v}" }
              as: ProductionScheduler
            - call: "POST /plant-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant-ops/production-runs/${r1_id}/start"
              payload: {}
              as: ProductionScheduler
            - call: "POST /plant-ops/production-runs/${r1_id}/complete"
              payload: { actual_msf: 295.000, scrap_msf: 5.000, edge_defect_ppm: 800, end_defect_ppm: 400 }
              as: ProductionScheduler
            - call: "POST /plant-ops/production-runs/${r1_id}/board-tests"
              payload: { specimen_seq: 1, core_hardness_lbf: 17.0, nail_pull_lbf: 82.0, flexural_cross_lbf: 39.0, flexural_parallel_lbf: 110.0, exit_moisture_pct: 0.55 }
              as: QualityInspector
              as_user_id: "u_qi_1"
            - call: "POST /plant-ops/production-runs/${r1_id}/board-tests"
              payload: { specimen_seq: 2, core_hardness_lbf: 16.5, nail_pull_lbf: 80.0, flexural_cross_lbf: 38.0, flexural_parallel_lbf: 108.0, exit_moisture_pct: 0.52 }
              as: QualityInspector
              as_user_id: "u_qi_1"
            - call: "POST /plant-ops/production-runs/${r1_id}/board-tests"
              payload: { specimen_seq: 3, core_hardness_lbf: 18.0, nail_pull_lbf: 84.0, flexural_cross_lbf: 40.0, flexural_parallel_lbf: 112.0, exit_moisture_pct: 0.49 }
              as: QualityInspector
              as_user_id: "u_qi_1"
            - call: "POST /plant-ops/production-runs/${r1_id}/quality-evaluation"
              payload: {}
              as: QualityInspector
              as_user_id: "u_qi_1"
            - call: "POST /plant-ops/load-orders"
              payload: { run_id: "${r1_id}", market_id: "${market_far_id}", bundles_count: 12, boards_per_bundle: 48 }
              as: ProductionScheduler
              captures: { lo_id: $.data.id, quoted_at_stage: $.data.quoted_freight_usd }
            - call: "POST /plant-ops/load-orders/${lo_id}/load"
              payload: { loaded_bundles_count: 12 }
              as: ProductionScheduler
          trigger:
            - call: "POST /plant-ops/load-orders/${lo_id}/ship"
              payload: { backhaul: false }
              as: PlantManager
              as_user_id: "u_mgr"
          assert:
            - "LoadOrder.${lo_id}.board_msf_each == 0.048000"
            - "LoadOrder.${lo_id}.bundle_msf == 2.3040"
            - "LoadOrder.${lo_id}.bundle_weight_lb == 3686.40"
            - "LoadOrder.${lo_id}.total_msf == 27.648"
            - "LoadOrder.${lo_id}.trailer_weight_lb == 44236.80"
            - "LoadOrder.${lo_id}.quoted_freight_usd == 756.79"
            - "LoadOrder.${lo_id}.settled_freight_usd == 761.53"
            - "LoadOrder.${lo_id}.overweight_fee_usd == 4.74"
            - "LoadOrder.${lo_id}.freight_variance_usd == 4.74"
            - "LoadOrder.${lo_id}.status == SHIPPED"
            - "ProductionRun.${r1_id}.net_good_msf == 290.000 and ProductionRun.${r1_id}.available_msf == 262.352"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: kiln_energy_tier_thickness_speed_product
        grounds:
          - calculations.kiln_energy_and_moisture
          - calculations.run_line_capacity_and_reservation
          - entities.ProductionRun.fields.kiln_energy_mmbtu
          - entities.ProductionRun.fields.kiln_energy_cost_usd
          - entities.ProductSpec.fields.thickness_in
          - state_machines.ProductionRun.DRAFT_to_SCHEDULED
        distinguishing_aspect: |
          Mode (a) — three independent inputs multiply into one result: the dwell tier efficiency
          (0.81 at 40 min vs 0.86 at 50 min), the thickness multiplier (1.00 at 0.5 in vs 1.0750 at
          0.625 in) and the speed factor (1.0200 at 400 fpm vs 1.0120 at 380 fpm) plus the
          board-type adder, so the REGULAR run stamps 518.018 MMBtu / 2175.68 USD while the TYPE_X
          run stamps 214.321 MMBtu / 900.15 USD; changing any single factor changes only its own
          term of the product.
        test_recipe:
          setup:
            - "Plant GYP-1 (energy 4.20 USD/MMBtu, margin 38.50 USD/MSF), LINE-1 max 500 fpm, REGULAR 0.5 in SKU and TYPE_X 0.625 in fire-rated SKU."
            - "Batch B1 COMPLETED (204.530 t) and batch B2 COMPLETED (92.747 t) so the silo holds 297.277 t."
            - "REGULAR run R1 on the 2026-08-03 06:00-10:00 window at 400 fpm / dwell 40 / target 0.50, already SCHEDULED (reserving 202.500 t, cold start)."
            - "TYPE_X run TX drafted on the 2026-08-04 06:00-10:00 window at 380 fpm / dwell 50 / target 0.50, requesting 100.000 MSF, paper tension 42.0."
