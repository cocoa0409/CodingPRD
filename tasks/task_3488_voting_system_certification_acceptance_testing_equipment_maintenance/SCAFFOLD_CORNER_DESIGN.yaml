# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3488_voting_system_certification_acceptance_testing_equipment_maintenance
# Breadth probe over SCAFFOLD.yaml 1.1-1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Default logical clock: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: voting_system_create_returns_defaults
        claim_type: Creation
        grounds: [entities.VotingSystem, endpoints.POST_/evote/voting-systems]
        distinguishing_aspect: "A system created with the four required fields comes back 201 with status REGISTERED, version 1, and system-minted id/created_at/updated_at."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_sys
              call: "POST /evote/voting-systems"
              payload: { vendor_name: "Election Systems and Software", model_name: "DS450", software_baseline_version: "1.0.0", hardware_class: "OPTICAL_SCANNER" }
              as: PlatformAdmin
              captures: { sys_id: $.data.id }
          assert:
            - "response status 201 with response_type object"
            - "VotingSystem.${sys_id}.status == REGISTERED and version == 1"
            - "non-null id, created_at, updated_at; created_at == 2026-09-01T00:00:00Z (logical clock, not wall clock)"

      - name: laboratory_create_applies_default_capacity
        claim_type: Defaults
        grounds: [entities.TestLaboratory.fields.max_concurrent_campaigns, endpoints.POST_/evote/test-laboratories]
        distinguishing_aspect: "Omitting max_concurrent_campaigns persists the declared default 3; the field is client-optional with a server default, not required."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *k_clock
          trigger:
            - &k_lab
              call: "POST /evote/test-laboratories"
              payload: { lab_code: "LAB-A", lab_name: "Alpha Test Lab", accreditation_scope: "DUAL" }
              as: PlatformAdmin
              captures: { lab_id: $.data.id, lab_cap: $.data.max_concurrent_campaigns }
          assert:
            - "response status 201"
            - "TestLaboratory.${lab_id}.max_concurrent_campaigns == 3 (default applied)"
            - "TestLaboratory.${lab_id}.status == ACCREDITED"

      - name: campaign_create_initializes_counters
        claim_type: Creation
        grounds: [entities.CertificationCampaign, endpoints.POST_/evote/certification-campaigns]
        distinguishing_aspect: "A fresh campaign starts SUBMITTED with all deficiency counters and resubmission_count at 0, both conformity variants at 10000, and last_submitted_at equal to the creation clock."
        test_recipe:
          setup: ["System REGISTERED and DUAL laboratory ACCREDITED."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
          trigger:
            - &k_camp
              call: "POST /evote/certification-campaigns"
              payload: { voting_system_id: "${sys_id}", lab_id: "${lab_id}", guidelines_baseline: "VVSG_2_0", state_code: "CA" }
              as: VendorRep
              captures: { camp_id: $.data.id }
          assert:
            - "response status 201; status == SUBMITTED"
            - "open_critical_count == 0 and open_major_count == 0 and open_minor_count == 0 and resubmission_count == 0"
            - "conformity_screen_bp == 10000 and conformity_final_bp == 10000"
            - "last_submitted_at == 2026-09-01T00:00:00Z and completed_at is null"

      - name: invalid_enum_member_rejected
        claim_type: Type Constraints
        grounds: [entities.CertificationCampaign.fields.guidelines_baseline, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "guidelines_baseline outside {VVSG_1_1, VVSG_2_0} is a schema failure (400), not a business failure."
        test_recipe:
          setup: ["System and laboratory exist."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
          trigger:
            - call: "POST /evote/certification-campaigns"
              payload: { voting_system_id: "${sys_id}", lab_id: "${lab_id}", guidelines_baseline: "VVSG_9_9", state_code: "CA" }
              as: VendorRep
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with error_id == ERR_INVALID_REQUEST"

      - name: create_with_system_field_rejected
        claim_type: System Fields
        grounds: [entities.Jurisdiction, "validations[priority=4]"]
        distinguishing_aspect: "Client-supplied system fields (id, created_at, version) or computed ledger fields (available_cents) in a create body are undeclared input and rejected with 400."
        test_recipe:
          setup: ["Logical clock set."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /evote/jurisdictions"
              payload: { name: "Mono County", state_code: "CA", budget_total_cents: 100000000, id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", available_cents: 5 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with error_id == ERR_INVALID_REQUEST (undeclared fields id / available_cents)"

      - name: campaign_create_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [endpoints.POST_/evote/certification-campaigns, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required lab_id fails schema validation with 400 before any business rule runs."
        test_recipe:
          setup: ["System exists."]
          setup_api_calls:
            - *k_clock
            - *k_sys
          trigger:
            - call: "POST /evote/certification-campaigns"
              payload: { voting_system_id: "${sys_id}", guidelines_baseline: "VVSG_2_0" }
              as: VendorRep
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with error_id == ERR_INVALID_REQUEST"

      - name: equipment_unit_create_initializes_parallel_dimensions
        claim_type: Creation
        grounds: [entities.EquipmentUnit, endpoints.POST_/evote/equipment-units]
        distinguishing_aspect: "A new unit starts IN_STORAGE + SECURED with zeroed battery/excursion counters and current_custodian_id copied from initial_custodian_id — both parallel dimensions initialized independently of any procurement."
        test_recipe:
          setup: ["FIELDED system (certified campaign) and jurisdiction with official off1."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - &k_begin
              call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "IN_TEST" }
              as: LabAgent
              as_user_id: "${lab_id}"
            - &k_certify
              call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "CERTIFIED" }
              as: CertificationAuthority
            - &k_jur
              call: "POST /evote/jurisdictions"
              payload: { name: "Mono County", state_code: "CA", budget_total_cents: 100000000 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - &k_off1
              call: "POST /evote/jurisdictions/${jur_id}/officials"
              payload: { full_name: "Ann Lee", badge_no: "B001" }
              as: PlatformAdmin
              captures: { off1_id: $.data.id }
          trigger:
            - &k_unit
              call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-1001", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { u_id: $.data.id }
          assert:
            - "response 201; operational_status == IN_STORAGE and custody_status == SECURED"
            - "battery_cycles == 0 and storage_excursion_count == 0"
            - "current_custodian_id == ${off1_id}; pre_maintenance_status is null; calibrated paper fields are null"

      - name: event_records_carry_no_version_field
        claim_type: Immutability
        grounds: [entities.AcceptanceTest, entities.CustodyTransfer]
        distinguishing_aspect: "AcceptanceTest and CustodyTransfer are common_fields:false append-only records: their create responses carry id and created_at but no version and no updated_at, and no update endpoints exist for them."
        test_recipe:
          setup: ["Procurement in ACCEPTANCE_TESTING; unit with custodian off1 and ACTIVE off2."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - &k_getcert
              call: "GET /evote/certificates"
              payload: { campaign_id: "${camp_id}" }
              as: CertificationAuthority
              captures: { cert_id: "$.data[0].id" }
            - *k_jur
            - *k_off1
            - &k_off2
              call: "POST /evote/jurisdictions/${jur_id}/officials"
              payload: { full_name: "Ben Ray", badge_no: "B002" }
              as: PlatformAdmin
              captures: { off2_id: $.data.id }
            - &k_proc
              call: "POST /evote/procurements"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", certificate_id: "${cert_id}", quantity: 10, unit_price_cents: 2500000 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { proc_id: $.data.id }
            - &k_deliver
              call: "POST /evote/procurements/${proc_id}/transitions"
              payload: { to_state: "DELIVERED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - &k_beginacc
              call: "POST /evote/procurements/${proc_id}/transitions"
              payload: { to_state: "ACCEPTANCE_TESTING" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - *k_unit
          trigger:
            - call: "POST /evote/procurements/${proc_id}/acceptance-tests"
              payload: { test_type: "HARDWARE_DIAGNOSTIC", critical_defects: 0, major_defects: 1, minor_defects: 0 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { at_id: $.data.id }
            - call: "POST /evote/equipment-units/${u_id}/custody-transfers"
              payload: { to_official_id: "${off2_id}", seal_number: "SEAL-1001-A", seal_intact: true }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { ct_id: $.data.id }
          assert:
            - "AcceptanceTest response has id and created_at but NO version and NO updated_at field"
            - "CustodyTransfer response has id, created_at and transferred_at but NO version field"
            - "AcceptanceTest.${at_id}.deficiency_index == 8 (25*0 + 8*1 + 2*0) and result == PASS"

      - name: unknown_path_id_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "A well-formed but unknown UUID in any path segment yields 404 ERR_NOT_FOUND, including nested parents (officials under a bogus jurisdiction)."
        test_recipe:
          setup: ["Logical clock set; one system exists."]
          setup_api_calls:
            - *k_clock
            - *k_sys
          trigger:
            - call: "GET /evote/voting-systems/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: Auditor
              captures: { err1: $.data.error_id }
            - call: "POST /evote/jurisdictions/11111111-2222-4333-8444-555555555555/officials"
              payload: { full_name: "Ghost", badge_no: "B900" }
              as: PlatformAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "both responses are 404 with error_id == ERR_NOT_FOUND"

      - name: officials_list_filters_by_jurisdiction
        claim_type: Listing
        grounds: [endpoints.GET_/evote/officials, response_envelope.pagination_fields]
        distinguishing_aspect: "The jurisdiction_id filter narrows the list to exactly that jurisdiction's officials and total_count reflects the filtered set."
        test_recipe:
          setup: ["Jurisdiction A with two officials, jurisdiction B with one."]
          setup_api_calls:
            - *k_clock
            - call: "POST /evote/jurisdictions"
              payload: { name: "Alpha County", state_code: "CA", budget_total_cents: 5000000 }
              as: PlatformAdmin
              captures: { ja_id: $.data.id }
            - call: "POST /evote/jurisdictions"
              payload: { name: "Beta County", state_code: "NV", budget_total_cents: 5000000 }
              as: PlatformAdmin
              captures: { jb_id: $.data.id }
            - call: "POST /evote/jurisdictions/${ja_id}/officials"
              payload: { full_name: "A One", badge_no: "A1" }
              as: PlatformAdmin
            - call: "POST /evote/jurisdictions/${ja_id}/officials"
              payload: { full_name: "A Two", badge_no: "A2" }
              as: PlatformAdmin
            - call: "POST /evote/jurisdictions/${jb_id}/officials"
              payload: { full_name: "B One", badge_no: "B1" }
              as: PlatformAdmin
          trigger:
            - call: "GET /evote/officials"
              payload: { jurisdiction_id: "${ja_id}" }
              as: Auditor
          assert:
            - "response 200 with response_type array and exactly 2 rows"
            - "meta total_count == 2 and has_more == false"
            - "every row's jurisdiction_id == ${ja_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: withdrawn_campaign_locks_all_transitions
        claim_type: Terminal State Lockdown
        grounds: [state_machines.CertificationCampaign, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: every further to_state (including IN_TEST and CERTIFIED) is rejected with 409 and no counters move."
        test_recipe:
          setup: ["Campaign withdrawn from SUBMITTED."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "WITHDRAWN" }
              as: VendorRep
          trigger:
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "IN_TEST" }
              as: LabAgent
              as_user_id: "${lab_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with error_id == ERR_INVALID_STATE"
            - "CertificationCampaign.${camp_id}.status remains WITHDRAWN and completed_at is non-null"

      - name: certify_mints_certificate_and_fields_system
        claim_type: Side Effect Execution
        grounds: [state_machines.CertificationCampaign.IN_TEST_to_CERTIFIED, state_machines.VotingSystem.REGISTERED_to_FIELDED, entities.Certificate]
        distinguishing_aspect: "The CERTIFIED transition mints a Certificate copying scope STATE + state_code CA from the campaign, sets expires_at exactly 730 days after issued_at, and flips the system REGISTERED -> FIELDED."
        test_recipe:
          setup: ["Campaign IN_TEST with zero open deficiencies at clock 2026-09-01."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
          trigger:
            - *k_certify
            - *k_getcert
            - call: "GET /evote/voting-systems/${sys_id}"
              payload: {}
              as: CertificationAuthority
              captures: { sys_status: $.data.status }
          assert:
            - "Certificate.${cert_id}.scope == STATE and state_code == \"CA\" and guidelines_baseline == VVSG_2_0"
            - "Certificate.${cert_id}.status == ACTIVE, issued_at == 2026-09-01T00:00:00Z, expires_at == 2028-08-31T00:00:00Z (730 days)"
            - "Certificate.${cert_id}.voting_system_id == ${sys_id} and campaign_id == ${camp_id}"
            - "VotingSystem.${sys_id}.status == FIELDED after the first ACTIVE certificate"

      - name: non_listed_transitions_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.ElectionDefinition, state_machines.Procurement, state_machines.LogicAccuracyTest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Three machines each reject a transition absent from their from-state: DRAFT->LOCKED (skip), PLACED->ACCEPTED (skip), CHALLENGED-from-CERTIFIED (terminal)."
        test_recipe:
          setup: ["Accepted procurement; ED1 PROGRAMMED with a CERTIFIED L&A test; ED2 still DRAFT; second procurement still PLACED."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_getcert
            - *k_jur
            - *k_off1
            - *k_off2
            - *k_proc
            - *k_deliver
            - *k_beginacc
            - &k_hwtest
              call: "POST /evote/procurements/${proc_id}/acceptance-tests"
              payload: { test_type: "HARDWARE_DIAGNOSTIC", critical_defects: 0, major_defects: 0, minor_defects: 0 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - &k_caltest
              call: "POST /evote/procurements/${proc_id}/acceptance-tests"
              payload: { test_type: "BALLOT_SCAN_CALIBRATION", critical_defects: 0, major_defects: 0, minor_defects: 0 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - &k_accept
              call: "POST /evote/procurements/${proc_id}/transitions"
              payload: { to_state: "ACCEPTED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - &k_ed
              call: "POST /evote/election-definitions"
              payload: { jurisdiction_id: "${jur_id}", procurement_id: "${proc_id}", name: "2026 General", election_date: "2026-11-03", precinct_count: 3 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { ed_id: $.data.id, ed_v: $.data.version }
            - &k_layout
              call: "PUT /evote/election-definitions/${ed_id}/layout"
              payload: { ballot_layout: { contests: [{ code: "PRES", choices: 4 }] }, paper_weight_gsm: 90, paper_thickness_microns: 100, paper_coating: "UNCOATED", expected_election_definition_version: "${ed_v}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - &k_program
              call: "POST /evote/election-definitions/${ed_id}/transitions"
              payload: { to_state: "PROGRAMMED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - &k_la
              call: "POST /evote/election-definitions/${ed_id}/la-tests"
              payload: { expected_tallies: { PRES: 12000, SEN: 8000 }, scanned_tallies: { PRES: 12000, SEN: 8000 } }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { lat_id: $.data.id }
            - &k_la_cert
              call: "POST /evote/logic-accuracy-tests/${lat_id}/transitions"
              payload: { to_state: "CERTIFIED" }
              as: ElectionOfficial
              as_user_id: "${off2_id}"
            - call: "POST /evote/election-definitions"
              payload: { jurisdiction_id: "${jur_id}", procurement_id: "${proc_id}", name: "2026 Backup", election_date: "2026-11-03", precinct_count: 1 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { ed2_id: $.data.id }
            - call: "POST /evote/procurements"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", certificate_id: "${cert_id}", quantity: 1, unit_price_cents: 1000 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { proc2_id: $.data.id }
          trigger:
            - call: "POST /evote/election-definitions/${ed2_id}/transitions"
              payload: { to_state: "LOCKED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /evote/procurements/${proc2_id}/transitions"
              payload: { to_state: "ACCEPTED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err2: $.data.error_id }
            - call: "POST /evote/logic-accuracy-tests/${lat_id}/transitions"
              payload: { to_state: "CHALLENGED" }
              as: ElectionOfficial
              as_user_id: "${off2_id}"
              captures: { err3: $.data.error_id }
          assert:
            - "ED2 DRAFT -> LOCKED: 409 ERR_INVALID_STATE"
            - "Procurement2 PLACED -> ACCEPTED: 409 ERR_INVALID_STATE"
            - "L&A CERTIFIED -> CHALLENGED: 409 ERR_INVALID_STATE (CERTIFIED is terminal)"
            - "no side effects fired: ED2.status == DRAFT, Procurement2.status == PLACED, lat.status == CERTIFIED"

      - name: closed_election_definition_locks_transitions
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ElectionDefinition, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal: the full lifecycle DRAFT->PROGRAMMED->LA_PASSED->LOCKED->CANVASSING->CLOSED succeeds with zero audits, and any further transition is 409."
        test_recipe:
          setup: ["Election definition carried to CANVASSING on election day with no audits."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_getcert
            - *k_jur
            - *k_off1
            - *k_off2
            - *k_proc
            - *k_deliver
            - *k_beginacc
            - *k_hwtest
            - *k_caltest
            - *k_accept
            - *k_ed
            - *k_layout
            - *k_program
            - *k_la
            - *k_la_cert
            - call: "POST /evote/election-definitions/${ed_id}/transitions"
              payload: { to_state: "LA_PASSED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - &k_lock
              call: "POST /evote/election-definitions/${ed_id}/transitions"
              payload: { to_state: "LOCKED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T08:00:00Z" }
              as: PlatformAdmin
            - &k_canvass
              call: "POST /evote/election-definitions/${ed_id}/transitions"
              payload: { to_state: "CANVASSING" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          trigger:
            - call: "POST /evote/election-definitions/${ed_id}/transitions"
              payload: { to_state: "CLOSED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/election-definitions/${ed_id}/transitions"
              payload: { to_state: "CANCELLED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "CLOSED succeeds when no audits exist (the audit set is empty, not blocked)"
            - "subsequent CANCELLED attempt: 409 ERR_INVALID_STATE"
            - "ElectionDefinition.${ed_id}.status remains CLOSED"

      - name: la_retest_loop_recomputes_and_clears_certifier
        claim_type: Valid Transition
        grounds: [state_machines.LogicAccuracyTest.CHALLENGED_to_CONDUCTED]
        distinguishing_aspect: "The CONDUCTED->CHALLENGED->CONDUCTED retest loop recomputes the verdict from the new tallies (FAIL becomes PASS) and clears certified_by, allowing a fresh certification."
        test_recipe:
          setup: ["ED PROGRAMMED; one CONDUCTED L&A test with a failing tally."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_getcert
            - *k_jur
            - *k_off1
            - *k_off2
            - *k_proc
            - *k_deliver
            - *k_beginacc
            - *k_hwtest
            - *k_caltest
            - *k_accept
            - *k_ed
            - *k_layout
            - *k_program
            - call: "POST /evote/election-definitions/${ed_id}/la-tests"
              payload: { expected_tallies: { PRES: 12000, SEN: 8000 }, scanned_tallies: { PRES: 12000, SEN: 7500 } }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { lat_id: $.data.id }
          trigger:
            - call: "POST /evote/logic-accuracy-tests/${lat_id}/transitions"
              payload: { to_state: "CHALLENGED" }
              as: ElectionOfficial
              as_user_id: "${off2_id}"
            - call: "POST /evote/logic-accuracy-tests/${lat_id}/transitions"
              payload: { to_state: "CONDUCTED", scanned_tallies: { PRES: 12000, SEN: 8000 } }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          assert:
            - "initial test: result == FAIL (discrepancy 500 -> 500*10000 > 50*20000)"
            - "after reopen: status == CONDUCTED, result == PASS, total_discrepancy == 0, certified_by is null"
            - "the loop can now certify again via a different official"

      - name: certificate_revoke_cancels_procurements_and_releases_budget
        claim_type: Cascade Down
        grounds: [state_machines.Certificate.ACTIVE_to_REVOKED, calculations.jurisdiction_budget_ledger]
        distinguishing_aspect: "Revoking a certificate cascades: the still-PLACED procurement is CANCELLED with status_reason CERTIFICATE_REVOKED and its 25,000,000-cent encumbrance returns to available_cents."
        test_recipe:
          setup: ["Certificate ACTIVE; one procurement PLACED for 25,000,000 cents against a 100,000,000-cent budget."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_getcert
            - *k_jur
            - *k_off1
            - *k_proc
          trigger:
            - call: "POST /evote/certificates/${cert_id}/transitions"
              payload: { to_state: "REVOKED", reason: "state decertification" }
              as: CertificationAuthority
          assert:
            - "Certificate.${cert_id}.status == REVOKED"
            - "Procurement.${proc_id}.status == CANCELLED and status_reason == CERTIFICATE_REVOKED (cascade, no direct call)"
            - "Jurisdiction.${jur_id}: available_cents == 100000000, encumbered_cents == 0, spent_cents == 0"

      - name: unit_retire_aborts_open_work_orders
        claim_type: Cascade Down
        grounds: [state_machines.EquipmentUnit.IN_STORAGE_to_RETIRED, state_machines.MaintenanceWorkOrder.SCHEDULED_to_ABORTED]
        distinguishing_aspect: "Retiring a unit aborts its SCHEDULED work order without applying work-type effects, and the aborted order cannot be started afterwards."
        test_recipe:
          setup: ["Unit IN_STORAGE with a SCHEDULED preventive order."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_jur
            - *k_off1
            - *k_unit
            - call: "POST /evote/maintenance-work-orders"
              payload: { equipment_unit_id: "${u_id}", work_type: "PREVENTIVE", scheduled_start: "2026-09-05T00:00:00Z", scheduled_end: "2026-09-06T00:00:00Z" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /evote/equipment-units/${u_id}/transitions"
              payload: { to_state: "RETIRED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/maintenance-work-orders/${wo_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "unit RETIRED; MaintenanceWorkOrder.${wo_id}.status == ABORTED via cascade"
            - "starting the aborted order afterwards: 409 ERR_INVALID_STATE"

      - name: store_outside_band_records_excursion_but_succeeds
        claim_type: Conditional Cascade
        grounds: [state_machines.EquipmentUnit.IN_SERVICE_to_IN_STORAGE, entities.EquipmentUnit.fields.storage_excursion_count]
        distinguishing_aspect: "Storing at 45C succeeds (200) yet increments storage_excursion_count; a later in-band store at 20C does not increment it further."
        test_recipe:
          setup: ["Unit IN_SERVICE."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_jur
            - *k_off1
            - *k_unit
            - call: "POST /evote/equipment-units/${u_id}/transitions"
              payload: { to_state: "IN_SERVICE" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          trigger:
            - call: "POST /evote/equipment-units/${u_id}/transitions"
              payload: { to_state: "IN_STORAGE", storage_temperature_c: 45, storage_humidity_pct: 40 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { exc1: $.data.storage_excursion_count }
            - call: "POST /evote/equipment-units/${u_id}/transitions"
              payload: { to_state: "IN_SERVICE" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units/${u_id}/transitions"
              payload: { to_state: "IN_STORAGE", storage_temperature_c: 20, storage_humidity_pct: 40 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { exc2: $.data.storage_excursion_count }
          assert:
            - "first store (45C): response 200, operational_status == IN_STORAGE, storage_excursion_count == 1"
            - "second store (20C): storage_excursion_count stays 1 — only out-of-band conditions count"

      - name: work_order_completion_applies_typed_effects
        claim_type: Side Effect Execution
        grounds: [state_machines.MaintenanceWorkOrder.IN_PROGRESS_to_COMPLETED]
        distinguishing_aspect: "Completion effects are selected by work_type: BATTERY_REPLACEMENT zeroes battery_cycles; PREVENTIVE zeroes storage_excursion_count; completion always restores the pre-maintenance operational status."
        test_recipe:
          setup: "Two units: U-A deployed with 120 cycles; U-B stored once at 50C (excursion 1). Each has an open work order of the matching type."
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_jur
            - *k_off1
            - *k_unit
            - call: "POST /evote/equipment-units/${u_id}/transitions"
              payload: { to_state: "IN_SERVICE" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units/${u_id}/record-usage"
              payload: { cycles_used: 120 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-1002", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { ub_id: $.data.id }
            - call: "POST /evote/equipment-units/${ub_id}/transitions"
              payload: { to_state: "IN_SERVICE" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units/${ub_id}/transitions"
              payload: { to_state: "IN_STORAGE", storage_temperature_c: 50, storage_humidity_pct: 40 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/maintenance-work-orders"
              payload: { equipment_unit_id: "${u_id}", work_type: "BATTERY_REPLACEMENT", scheduled_start: "2026-09-05T00:00:00Z", scheduled_end: "2026-09-06T00:00:00Z" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { woa_id: $.data.id }
            - call: "POST /evote/maintenance-work-orders/${woa_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/maintenance-work-orders"
              payload: { equipment_unit_id: "${ub_id}", work_type: "PREVENTIVE", scheduled_start: "2026-09-05T00:00:00Z", scheduled_end: "2026-09-06T00:00:00Z" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { wob_id: $.data.id }
            - call: "POST /evote/maintenance-work-orders/${wob_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          trigger:
            - call: "POST /evote/maintenance-work-orders/${woa_id}/transitions"
              payload: { to_state: "COMPLETED", resolution_note: "battery pack swapped" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/maintenance-work-orders/${wob_id}/transitions"
              payload: { to_state: "COMPLETED", resolution_note: "storage audit" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          assert:
            - "EquipmentUnit.${u_id}: battery_cycles == 0 (reset), operational_status == IN_SERVICE (restored pre-maintenance status)"
            - "EquipmentUnit.${ub_id}: storage_excursion_count == 0 (reset), operational_status == IN_STORAGE"
            - "both work orders COMPLETED; pre_maintenance_status is null on both units"

  # ===========================================================================
  - section: calculations
    instances:
      - name: conformity_aging_blocks_late_certification
        claim_type: Constants Applied
        grounds: [calculations.campaign_conformity_score, "errors[ERR_CONFORMITY_BELOW_THRESHOLD]"]
        distinguishing_aspect: "The FINAL_AUDIT aging constant (10 bp per full week) is what pushes an otherwise-clean campaign under the 8000 bp gate: after 2 resubmissions and 850 days, final = 10000 - 800 - 1210 = 7990 < 8000 and CERTIFIED is refused."
        test_recipe:
          setup: ["Campaign with resubmission_count 2, zero open deficiencies, last_submitted_at 2026-09-01; clock advanced 850 days to 2028-12-30."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "DEFICIENCIES_FILED", critical_count: 0, major_count: 0, minor_count: 1 }
              as: LabAgent
              as_user_id: "${lab_id}"
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "SUBMITTED", resolved_critical: 0, resolved_major: 0, resolved_minor: 1 }
              as: VendorRep
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "IN_TEST" }
              as: LabAgent
              as_user_id: "${lab_id}"
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "DEFICIENCIES_FILED", critical_count: 0, major_count: 0, minor_count: 1 }
              as: LabAgent
              as_user_id: "${lab_id}"
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "SUBMITTED", resolved_critical: 0, resolved_major: 0, resolved_minor: 1 }
              as: VendorRep
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-12-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "IN_TEST" }
              as: LabAgent
              as_user_id: "${lab_id}"
          trigger:
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "CERTIFIED" }
              as: CertificationAuthority
              captures: { err: $.data.error_id }
          assert:
            - "response is 422 with error_id == ERR_CONFORMITY_BELOW_THRESHOLD"
            - "fresh FINAL_AUDIT at certify time: 10000 - 400*2 - 10*floor(850/7) = 7990 < CONFORMITY_PASS_BP 8000"
            - "campaign remains IN_TEST (no certificate is minted)"

      - name: la_tallies_shape_validation
        claim_type: Input Set Filtering
        grounds: [calculations.la_tabulation_verification, "errors[ERR_INVALID_TALLIES]"]
        distinguishing_aspect: "The tally maps must have identical key sets and a non-zero expected total: a missing scanned key and an all-zero expected map are both 422 ERR_INVALID_TALLIES before any discrepancy arithmetic."
        test_recipe:
          setup: ["Election definition PROGRAMMED."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_getcert
            - *k_jur
            - *k_off1
            - *k_proc
            - *k_deliver
            - *k_beginacc
            - *k_hwtest
            - *k_caltest
            - *k_accept
            - *k_ed
            - *k_layout
            - *k_program
          trigger:
            - call: "POST /evote/election-definitions/${ed_id}/la-tests"
              payload: { expected_tallies: { PRES: 100, SEN: 50 }, scanned_tallies: { PRES: 100 } }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /evote/election-definitions/${ed_id}/la-tests"
              payload: { expected_tallies: { PRES: 0, SEN: 0 }, scanned_tallies: { PRES: 0, SEN: 0 } }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "mismatched key sets: 422 ERR_INVALID_TALLIES"
            - "zero total expected: 422 ERR_INVALID_TALLIES"

      - name: readiness_empty_fleet_returns_zero_counts
        claim_type: Correct Result
        grounds: [calculations.fleet_readiness, "endpoints.GET_/evote/election-definitions/{id}/readiness"]
        distinguishing_aspect: "With zero units registered, both variants return 0 over a unit_count of 0 — the empty-set case is defined, not an error."
        test_recipe:
          setup: ["Election definition created; no equipment units exist."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_getcert
            - *k_jur
            - *k_off1
            - *k_proc
            - *k_deliver
            - *k_beginacc
            - *k_hwtest
            - *k_caltest
            - *k_accept
            - *k_ed
          trigger:
            - call: "GET /evote/election-definitions/${ed_id}/readiness"
              payload: {}
              as: Auditor
          assert:
            - "unit_count == 0 and optimistic_ready_count == 0 and conservative_ready_count == 0"
            - "response is 200, not an error"

      - name: acceptance_index_weighting_and_clamp
        claim_type: Correct Result
        grounds: [calculations.acceptance_deficiency_index]
        excluded_because:
          difficulty_instance: "combinatorial_formula / acceptance_index_weights_branch_by_test_type"
          rationale: "Weight triples per test_type, the min(100, ...) clamp and the PASS/FAIL gate are all asserted with literal values in the difficulty instance."

      - name: print_estimate_rounding_order
        claim_type: Precision
        grounds: [calculations.ballot_print_cost]
        excluded_because:
          difficulty_instance: "combinatorial_formula / print_estimate_per_precinct_ceil_then_aggregate_tier"
          rationale: "Per-precinct ceil before aggregation and aggregate-tier selection asserted with literal totals in the difficulty instance."

      - name: conformity_dual_variant_divergence
        claim_type: Variant Divergence
        grounds: [calculations.campaign_conformity_score]
        excluded_because:
          difficulty_instance: "dual_variant_calc / campaign_conformity_screen_vs_final_diverge"
          rationale: "Both variants asserted with literal bp values on identical counter state."

      - name: readiness_dual_variant_divergence
        claim_type: Variant Divergence
        grounds: [calculations.fleet_readiness]
        excluded_because:
          difficulty_instance: "dual_variant_calc / fleet_readiness_optimistic_exceeds_conservative"
          rationale: "OPTIMISTIC vs CONSERVATIVE counts asserted on a 4-unit mixed fleet."

      - name: lead_time_evaluation_order
        claim_type: Correct Result
        grounds: [calculations.recertification_lead_time_days]
        excluded_because:
          difficulty_instance: "combinatorial_formula / modification_lead_time_computed_before_suspension_cascade"
          rationale: "Pre-cascade evaluation order pinned by the 135-day literal in the difficulty instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_401_unauthenticated
        claim_type: Violation to Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID is 401 with the standard error envelope before any role or existence check runs."
        test_recipe:
          setup: ["One voting system exists."]
          setup_api_calls:
            - *k_clock
            - *k_sys
          trigger:
            - call: "GET /evote/voting-systems/${sys_id}"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "response is 401 with error_id == ERR_UNAUTHENTICATED"
            - "error envelope carries data.error_id and data.message and meta.api_request_id"

      - name: schema_validation_precedes_body_fk_existence
        claim_type: Priority Ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        distinguishing_aspect: "A body that is both schema-invalid (quantity 0) and references a nonexistent certificate MUST fail with 400 ERR_INVALID_REQUEST (priority 4), not 404 (priority 5)."
        test_recipe:
          setup: ["Certified system, jurisdiction, official."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_jur
            - *k_off1
          trigger:
            - call: "POST /evote/procurements"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", certificate_id: "11111111-2222-4333-8444-555555555555", quantity: 0, unit_price_cents: 5 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with error_id == ERR_INVALID_REQUEST, not 404 ERR_CERTIFICATE_NOT_FOUND"

      - name: sod_conductor_cannot_certify_or_challenge_own_test
        claim_type: Violation to Error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The conducting official is barred from BOTH the certify and challenge transitions on their own L&A test (403 ERR_SEGREGATION_OF_DUTIES); a different official of the same jurisdiction succeeds."
        test_recipe:
          setup: ["ED PROGRAMMED with one CONDUCTED L&A test conducted by off1."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_getcert
            - *k_jur
            - *k_off1
            - *k_off2
            - *k_proc
            - *k_deliver
            - *k_beginacc
            - *k_hwtest
            - *k_caltest
            - *k_accept
            - *k_ed
            - *k_layout
            - *k_program
            - *k_la
          trigger:
            - call: "POST /evote/logic-accuracy-tests/${lat_id}/transitions"
              payload: { to_state: "CERTIFIED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /evote/logic-accuracy-tests/${lat_id}/transitions"
              payload: { to_state: "CHALLENGED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err2: $.data.error_id }
            - call: "POST /evote/logic-accuracy-tests/${lat_id}/transitions"
              payload: { to_state: "CERTIFIED" }
              as: ElectionOfficial
              as_user_id: "${off2_id}"
          assert:
            - "certify by conductor: 403 ERR_SEGREGATION_OF_DUTIES"
            - "challenge by conductor: 403 ERR_SEGREGATION_OF_DUTIES"
            - "certify by off2 succeeds; LogicAccuracyTest.${lat_id}.certified_by == ${off2_id}"

      - name: transfer_to_ineligible_official_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=19]", "errors[ERR_OFFICIAL_INACTIVE]", "errors[ERR_OFFICIAL_JURISDICTION_MISMATCH]"]
        distinguishing_aspect: "A custody transfer's receiving official must be ACTIVE and in the unit's jurisdiction: an INACTIVE official gives 422 ERR_OFFICIAL_INACTIVE; an ACTIVE official of another jurisdiction gives 422 ERR_OFFICIAL_JURISDICTION_MISMATCH."
        test_recipe:
          setup: ["Unit custodian off1 (jurisdiction A); off2 deactivated; off3 ACTIVE in jurisdiction B."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_jur
            - *k_off1
            - *k_off2
            - call: "POST /evote/officials/${off2_id}/transitions"
              payload: { to_state: "INACTIVE" }
              as: PlatformAdmin
            - call: "POST /evote/jurisdictions"
              payload: { name: "Other County", state_code: "CA", budget_total_cents: 5000000 }
              as: PlatformAdmin
              captures: { jur_b: $.data.id }
            - call: "POST /evote/jurisdictions/${jur_b}/officials"
              payload: { full_name: "Cara Otr", badge_no: "C001" }
              as: PlatformAdmin
              captures: { off3_id: $.data.id }
            - *k_unit
          trigger:
            - call: "POST /evote/equipment-units/${u_id}/custody-transfers"
              payload: { to_official_id: "${off2_id}", seal_number: "SEAL-X1", seal_intact: true }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /evote/equipment-units/${u_id}/custody-transfers"
              payload: { to_official_id: "${off3_id}", seal_number: "SEAL-X2", seal_intact: true }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "to INACTIVE off2: 422 ERR_OFFICIAL_INACTIVE"
            - "to other-jurisdiction off3: 422 ERR_OFFICIAL_JURISDICTION_MISMATCH"
            - "unit custodian remains ${off1_id} in both cases"

      - name: uniqueness_constraints_enforced
        claim_type: Violation to Error
        grounds: ["errors[ERR_DUPLICATE_SERIAL]", "errors[ERR_DUPLICATE_BADGE]", "errors[ERR_DUPLICATE_LAB_CODE]"]
        distinguishing_aspect: "Three distinct uniqueness scopes: serial_number globally, badge_no per jurisdiction, lab_code globally — each duplicate is 409 with its own error id."
        test_recipe:
          setup: ["Existing lab LAB-A, jurisdiction with official badge B001, unit SN-1001."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_jur
            - *k_off1
            - *k_unit
          trigger:
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-1001", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /evote/jurisdictions/${jur_id}/officials"
              payload: { full_name: "Dup Badge", badge_no: "B001" }
              as: PlatformAdmin
              captures: { err2: $.data.error_id }
            - call: "POST /evote/test-laboratories"
              payload: { lab_code: "LAB-A", lab_name: "Duplicate Lab", accreditation_scope: "FEDERAL" }
              as: PlatformAdmin
              captures: { err3: $.data.error_id }
          assert:
            - "duplicate serial: 409 ERR_DUPLICATE_SERIAL"
            - "duplicate badge within the same jurisdiction: 409 ERR_DUPLICATE_BADGE"
