# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3362_audit_independence_monitoring_partner_rotation_client_acceptance
#
# Every instance grounds in an element already declared in SCAFFOLD.yaml
# §1.1–§1.6. Every `setup_api_calls` / `trigger` chain is an executable
# prototype for the downstream unit-test generator.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: acceptance_risk_provisional_vs_final_divergence
        grounds:
          - calculations.client_risk_score
          - calculations.integrity_score
          - entities.ClientAcceptance.fields.risk_score
          - entities.ClientAcceptance.fields.combined_risk_score
          - state_machines.ClientAcceptance.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Identical integrity evidence yields risk_score 40 under the PROVISIONAL variant and 50 under the FINAL variant, because the unresolved LITIGATION row is dropped before submission and counted at full decayed weight after it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Client Northwind Analytics (TECH, US, not a public interest entity). One engagement. One DRAFT acceptance carrying a resolved 20-point LITIGATION row assessed 2026-03-01 and an unresolved 10-point REGULATORY_ACTION row assessed 2026-06-01."
          setup_api_calls:
            - &clock_default
              call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/clients"
              payload: { legal_name: "Northwind Analytics", industry_code: "TECH", jurisdiction_country: "US", is_public_interest_entity: false }
              as: PlatformAdmin
              captures: { cli_nw: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_nw}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_nw: $.data.id }
            - call: "POST /audit/client-acceptances"
              payload: { client_id: "${cli_nw}", engagement_id: "${eng_nw}", proposed_by: "P. Rao", industry_expertise_required: "TECH", industry_expertise_confirmed: true }
              as: ClientAcceptanceCommittee
              captures: { acc_nw: $.data.id }
            - call: "POST /audit/client-acceptances/${acc_nw}/integrity-assessments"
              payload: { source_type: "LITIGATION", severity: "HIGH", score_impact: 20, assessed_on: "2026-03-01T00:00:00Z", resolved: true }
              as: ClientAcceptanceCommittee
              captures: { ia_res: $.data.id }
            - call: "POST /audit/client-acceptances/${acc_nw}/integrity-assessments"
              payload: { source_type: "REGULATORY_ACTION", severity: "MEDIUM", score_impact: 10, assessed_on: "2026-06-01T00:00:00Z", resolved: false }
              as: ClientAcceptanceCommittee
              captures: { ia_unres: $.data.id }
          trigger:
            - call: "GET /audit/client-acceptances/${acc_nw}"
              payload: {}
              as: ClientAcceptanceCommittee
            - call: "POST /audit/client-acceptances/${acc_nw}/submit"
              payload: {}
              as: ClientAcceptanceCommittee
          assert:
            - "while status == DRAFT, ClientAcceptance.${acc_nw}.risk_score == 40 and combined_risk_score == 40 (PROVISIONAL: base 20 + 20 decayed points from the resolved row only)"
            - "after submit, ClientAcceptance.${acc_nw}.risk_score == 50 and combined_risk_score == 50 (FINAL: base 20 + 20 + 10)"
            - "the two variants produce different numbers for identical integrity rows: 40 != 50"
            - "ClientAcceptance.${acc_nw}.integrity_score == 70 under both variants (100 - 30)"

      - name: rotation_tenure_standard_vs_pie_accelerated_divergence
        grounds:
          - calculations.rotation_tenure
          - entities.EngagementRoleAssignment.fields.consecutive_service_months
          - entities.EngagementRoleAssignment.fields.rotation_status
          - entities.EngagementRoleAssignment.fields.time_off_months_required
        distinguishing_aspect: "Two 60-month lead-partner runs over identical dates are ON_SERVICE under the STANDARD variant and ROTATION_DUE under PIE_ACCELERATED, because the time-on limit is 84 months for a non-public-interest client and 60 months for a public interest entity."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. One public interest client and one non-public-interest client, both TECH in the US. One LEAD_PARTNER professional with an ACTIVE 60-month assignment on each. Clock then advanced to 2031-01-01."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/affiliates"
              payload: { firm_name: "Deloitte & Touche LLP", country_code: "US", network_tier: "MEMBER_FIRM", independence_framework: "SEC_RESTRICTED" }
              as: PlatformAdmin
              captures: { aff_us: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Helios Grid PIE", industry_code: "TECH", jurisdiction_country: "US", is_public_interest_entity: true }
              as: PlatformAdmin
              captures: { cli_pie: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Copperline Logistics", industry_code: "TECH", jurisdiction_country: "US", is_public_interest_entity: false }
              as: PlatformAdmin
              captures: { cli_std: $.data.id }
            - call: "POST /audit/professionals"
              payload: { full_name: "Dana Whitfield", grade: "PARTNER", home_affiliate_id: "${aff_us}", rotation_role_class: "LEAD_PARTNER" }
              as: PlatformAdmin
              captures: { pro_dw: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_pie}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2031-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_pie: $.data.id, eng_pie_v: $.data.version }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_std}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2031-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_std: $.data.id, eng_std_v: $.data.version }
            - call: "POST /audit/role-assignments"
              payload: { engagement_id: "${eng_pie}", professional_id: "${pro_dw}", role: "LEAD_PARTNER", started_on: "2026-01-01T00:00:00Z", scheduled_end_on: "2032-01-01T00:00:00Z", expected_engagement_version: "${eng_pie_v}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { asg_pie: $.data.id }
            - call: "POST /audit/role-assignments"
              payload: { engagement_id: "${eng_std}", professional_id: "${pro_dw}", role: "LEAD_PARTNER", started_on: "2026-01-01T00:00:00Z", scheduled_end_on: "2032-01-01T00:00:00Z", expected_engagement_version: "${eng_std_v}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { asg_std: $.data.id }
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2031-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /audit/role-assignments/${asg_pie}"
              payload: {}
              as: EngagementPartner
              as_user_id: "ep-hollis"
            - call: "GET /audit/role-assignments/${asg_std}"
              payload: {}
              as: EngagementPartner
              as_user_id: "ep-hollis"
          assert:
            - "EngagementRoleAssignment.${asg_pie}.consecutive_service_months == 60 and rotation_status == ROTATION_DUE (PIE_ACCELERATED limit 60, inclusive boundary)"
            - "EngagementRoleAssignment.${asg_std}.consecutive_service_months == 60 and rotation_status == ON_SERVICE (STANDARD limit 84)"
            - "EngagementRoleAssignment.${asg_pie}.time_off_months_required == 60 while EngagementRoleAssignment.${asg_std}.time_off_months_required == 24 on identical tenure"
            - "the two variants produce different rotation_status for identical 60-month service runs"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: risk_score_conditional_pie_surcharge_and_clamp
        grounds:
          - calculations.client_risk_score
          - entities.Client.fields.is_public_interest_entity
          - entities.ClientAcceptance.fields.combined_risk_score
        distinguishing_aspect: "The formula is a three-input non-linear expression: base = industry index + jurisdiction index + a conditional PIE surcharge, penalty is summed over a state-filtered assessment set, and the result is clamped into [0,100]; identical evidence yields raw 110 for the public interest client (clamped to 100) and raw 95 for the non-PIE client."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Two ENERGY/CN clients, one a public interest entity and one not, each with one engagement and one DRAFT acceptance carrying a single resolved 40-point PRIOR_AUDIT_FINDING assessed 2026-07-01."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/clients"
              payload: { legal_name: "Aurora Energy PIE", industry_code: "ENERGY", jurisdiction_country: "CN", is_public_interest_entity: true }
              as: PlatformAdmin
              captures: { cli_pie2: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Aurora Energy Holdings", industry_code: "ENERGY", jurisdiction_country: "CN", is_public_interest_entity: false }
              as: PlatformAdmin
              captures: { cli_np2: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_pie2}", engagement_type: "INTEGRATED_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_p2: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_np2}", engagement_type: "INTEGRATED_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_n2: $.data.id }
            - call: "POST /audit/client-acceptances"
              payload: { client_id: "${cli_pie2}", engagement_id: "${eng_p2}", proposed_by: "P. Rao", industry_expertise_required: "ENERGY", industry_expertise_confirmed: true }
              as: ClientAcceptanceCommittee
              captures: { acc_p2: $.data.id }
            - call: "POST /audit/client-acceptances"
              payload: { client_id: "${cli_np2}", engagement_id: "${eng_n2}", proposed_by: "P. Rao", industry_expertise_required: "ENERGY", industry_expertise_confirmed: true }
              as: ClientAcceptanceCommittee
              captures: { acc_n2: $.data.id }
            - call: "POST /audit/client-acceptances/${acc_p2}/integrity-assessments"
              payload: { source_type: "PRIOR_AUDIT_FINDING", severity: "CRITICAL", score_impact: 40, assessed_on: "2026-07-01T00:00:00Z", resolved: true }
              as: ClientAcceptanceCommittee
            - call: "POST /audit/client-acceptances/${acc_n2}/integrity-assessments"
              payload: { source_type: "PRIOR_AUDIT_FINDING", severity: "CRITICAL", score_impact: 40, assessed_on: "2026-07-01T00:00:00Z", resolved: true }
              as: ClientAcceptanceCommittee
          trigger:
            - call: "POST /audit/client-acceptances/${acc_p2}/submit"
              payload: {}
              as: ClientAcceptanceCommittee
            - call: "POST /audit/client-acceptances/${acc_n2}/submit"
              payload: {}
              as: ClientAcceptanceCommittee
          assert:
            - "ClientAcceptance.${acc_p2}.risk_score == 110 (30 ENERGY + 25 CN + 15 PIE surcharge + 40 decayed) and combined_risk_score == 100 after the clamp"
            - "ClientAcceptance.${acc_n2}.risk_score == 95 and combined_risk_score == 95 — the PIE surcharge is worth exactly 15 and the clamp is not reached"
            - "combined_risk_score == min(100, max(0, risk_score)) holds for both rows"

      - name: naf_pool_rounds_each_service_then_sums
        grounds:
          - calculations.naf_fee_pool
          - entities.Client.fields.naf_approved_fee_cents
          - entities.NonAuditService.fields.approved_fee_cents
        distinguishing_aspect: "Two services each billed at 100040 cents make the client pool 200000, not 200100: the algorithm rounds every service to whole dollars before summing, and summing raw cents first would round the 200080-cent total up to 200100."
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z. One client with a 1000000-cent annual cap and two DRAFT TAX_ADVISORY services of 100040 cents each."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/clients"
              payload: { legal_name: "Vantage Foods", industry_code: "RETAIL", jurisdiction_country: "US", naf_annual_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { cli_vf: $.data.id }
            - call: "POST /audit/non-audit-services"
              payload: { client_id: "${cli_vf}", service_category: "TAX_ADVISORY", fee_cents: 100040 }
              as: AuditCommitteeLiaison
              captures: { svc_a: $.data.id }
            - call: "POST /audit/non-audit-services"
              payload: { client_id: "${cli_vf}", service_category: "TAX_ADVISORY", fee_cents: 100040 }
              as: AuditCommitteeLiaison
              captures: { svc_b: $.data.id }
            - call: "POST /audit/non-audit-services/${svc_a}/transitions"
              payload: { action: "SUBMIT_FOR_APPROVAL" }
              as: AuditCommitteeLiaison
            - call: "POST /audit/non-audit-services/${svc_b}/transitions"
              payload: { action: "SUBMIT_FOR_APPROVAL" }
              as: AuditCommitteeLiaison
          trigger:
            - call: "POST /audit/non-audit-services/${svc_a}/transitions"
              payload: { action: "APPROVE", committee_resolution_ref: "AC-2026-0417" }
              as: AuditCommitteeLiaison
            - call: "POST /audit/non-audit-services/${svc_b}/transitions"
              payload: { action: "APPROVE", committee_resolution_ref: "AC-2026-0418" }
              as: AuditCommitteeLiaison
          assert:
            - "NonAuditService.${svc_a}.approved_fee_cents == 100000 and NonAuditService.${svc_b}.approved_fee_cents == 100000 (round_half_up(1000.40) * 100)"
            - "Client.${cli_vf}.naf_approved_fee_cents == 200000"
            - "Client.${cli_vf}.naf_approved_fee_cents != 200100 — the sum-then-round order is explicitly not the algorithm"

      - name: workload_base_sum_then_surcharge_tier_selection
        grounds:
          - calculations.assignment_workload_points
          - entities.Professional.fields.active_workload_points
          - entities.Engagement.fields.assigned_workload_points
        distinguishing_aspect: "The circular-looking total is resolved by a pinned evaluation order — per-assignment base points are summed first, the overload tier is selected from that sum, and only then is the surcharge added — so a professional with base_sum 60 scores 60 (strict > 60 fails) while base_sum 80 scores 85."
        test_recipe:
          setup:
            - "Logical clock at 2026-02-01T00:00:00Z. One affiliate, one LOW-tier client with three engagements, and one PARTNER whose max_workload_points is 100. Two ACTIVE assignments on separate engagements: LEAD_PARTNER (40 base) and EQ_REVIEWER (20 base)."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/affiliates"
              payload: { firm_name: "Deloitte & Touche LLP", country_code: "US", network_tier: "MEMBER_FIRM", independence_framework: "SEC_RESTRICTED" }
              as: PlatformAdmin
              captures: { aff_us2: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Bellwether Retail Group", industry_code: "RETAIL", jurisdiction_country: "US", is_public_interest_entity: false }
              as: PlatformAdmin
              captures: { cli_bw: $.data.id }
            - call: "POST /audit/professionals"
              payload: { full_name: "Marcus Idris", grade: "PARTNER", home_affiliate_id: "${aff_us2}", rotation_role_class: "CONCURRING_PARTNER", max_workload_points: 100 }
              as: PlatformAdmin
              captures: { pro_mi: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_bw}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_w1: $.data.id, eng_w1_v: $.data.version }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_bw}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2027-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_w2: $.data.id, eng_w2_v: $.data.version }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_bw}", engagement_type: "REVIEW_ENGAGEMENT", fiscal_year_end: "2028-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_w3: $.data.id, eng_w3_v: $.data.version }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_bw}", engagement_type: "REVIEW_ENGAGEMENT", fiscal_year_end: "2029-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_w4: $.data.id, eng_w4_v: $.data.version }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_bw}", engagement_type: "REVIEW_ENGAGEMENT", fiscal_year_end: "2030-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_w5: $.data.id, eng_w5_v: $.data.version }
            - call: "POST /audit/role-assignments"
              payload: { engagement_id: "${eng_w1}", professional_id: "${pro_mi}", role: "LEAD_PARTNER", started_on: "2026-02-01T00:00:00Z", scheduled_end_on: "2027-02-01T00:00:00Z", expected_engagement_version: "${eng_w1_v}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { asg_w1: $.data.id }
            - call: "POST /audit/role-assignments"
              payload: { engagement_id: "${eng_w2}", professional_id: "${pro_mi}", role: "EQ_REVIEWER", started_on: "2026-02-01T00:00:00Z", scheduled_end_on: "2027-02-01T00:00:00Z", expected_engagement_version: "${eng_w2_v}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { asg_w2: $.data.id }
          trigger:
            - call: "GET /audit/professionals/${pro_mi}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /audit/role-assignments"
              payload: { engagement_id: "${eng_w3}", professional_id: "${pro_mi}", role: "ENGAGEMENT_MANAGER", started_on: "2026-02-01T00:00:00Z", scheduled_end_on: "2027-02-01T00:00:00Z", expected_engagement_version: "${eng_w3_v}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { asg_w3: $.data.id }
            - call: "POST /audit/role-assignments"
              payload: { engagement_id: "${eng_w4}", professional_id: "${pro_mi}", role: "ENGAGEMENT_MANAGER", started_on: "2026-02-01T00:00:00Z", scheduled_end_on: "2027-02-01T00:00:00Z", expected_engagement_version: "${eng_w4_v}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { asg_w4: $.data.id }
            - call: "GET /audit/professionals/${pro_mi}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /audit/role-assignments"
              payload: { engagement_id: "${eng_w5}", professional_id: "${pro_mi}", role: "EQ_REVIEWER", started_on: "2026-02-01T00:00:00Z", scheduled_end_on: "2027-02-01T00:00:00Z", expected_engagement_version: "${eng_w5_v}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { err_w5: $.data.error_id }
          assert:
            - "at the first read (two assignments) Professional.${pro_mi}.active_workload_points == 60 and no surcharge applies (base_sum 60 is not strictly greater than 60)"
            - "after the third assignment (base_sum 75) active_workload_points == 80 — the 5-point tier is selected from the base sum, not per assignment"
            - "after the fourth assignment (base_sum 90) active_workload_points == 100, which is exactly max_workload_points and therefore allowed"
            - "the fifth assignment is rejected with error_id ERR_WORKLOAD_LIMIT_EXCEEDED because base_sum 110 plus the 10-point tier would reach 120"
            - "EngagementRoleAssignment.${asg_w4}.workload_points == 15 (the step-1 base only; the professional-level surcharge is never written onto the assignment)"
            - "Engagement.${eng_w4}.assigned_workload_points == 15 while Professional.${pro_mi}.active_workload_points == 100"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: acceptance_return_to_draft_then_resubmit_cycle
        grounds:
          - state_machines.ClientAcceptance.SUBMITTED_to_DRAFT
          - state_machines.ClientAcceptance.DRAFT_to_SUBMITTED
          - state_machines.ClientAcceptance.SUBMITTED_to_APPROVED
          - state_machines.Engagement.DRAFT_to_ACCEPTANCE_PENDING
        distinguishing_aspect: "The acceptance machine is cyclic rather than a one-way pipeline: SUBMITTED reverts to DRAFT on a RETURN decision and the same row is then submitted and approved, so the DRAFT state is reachable twice on one row."
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z. One non-PIE RETAIL/US client, one engagement, one acceptance with a single resolved 5-point MEDIA_ADVERSE assessment and industry expertise confirmed."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/clients"
              payload: { legal_name: "Ridgeline Grocers", industry_code: "RETAIL", jurisdiction_country: "US", is_public_interest_entity: false }
              as: PlatformAdmin
              captures: { cli_rg: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_rg}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_rg: $.data.id }
            - call: "POST /audit/client-acceptances"
              payload: { client_id: "${cli_rg}", engagement_id: "${eng_rg}", proposed_by: "P. Rao", industry_expertise_required: "RETAIL", industry_expertise_confirmed: true }
              as: ClientAcceptanceCommittee
              captures: { acc_rg: $.data.id }
            - call: "POST /audit/client-acceptances/${acc_rg}/integrity-assessments"
              payload: { source_type: "MEDIA_ADVERSE", severity: "LOW", score_impact: 5, assessed_on: "2026-04-01T00:00:00Z", resolved: true }
              as: ClientAcceptanceCommittee
          trigger:
            - call: "POST /audit/client-acceptances/${acc_rg}/submit"
              payload: {}
              as: ClientAcceptanceCommittee
            - call: "POST /audit/client-acceptances/${acc_rg}/decision"
              payload: { decision: "RETURN", decision_notes: "industry expertise evidence incomplete" }
              as: ClientAcceptanceCommittee
            - call: "GET /audit/engagements/${eng_rg}"
              payload: {}
              as: EngagementPartner
              as_user_id: "ep-hollis"
            - call: "POST /audit/client-acceptances/${acc_rg}/submit"
              payload: {}
              as: ClientAcceptanceCommittee
            - call: "POST /audit/client-acceptances/${acc_rg}/decision"
