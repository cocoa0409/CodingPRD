            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_c}", seed_time_cs: 2920 }, as: TeamCoach, as_user_id: "${team_id}" }
          trigger:
            - { call: "GET /entries", payload: { event_id: "${ev1}", limit: 2, offset: 0 }, as: Any }
            - { call: "GET /entries", payload: { event_id: "${ev1}", limit: 2, offset: 2 }, as: Any }
          assert:
            - "page 1: meta.total_count == 3, meta.has_more == true, 2 rows returned"
            - "page 2: meta.has_more == false, exactly 1 row returned"

  # ============================================================
  # Section: errors (triggerability sweep beyond other sections)
  # ============================================================
  - section: errors
    instances:
      - name: record_ratify_from_current_returns_invalid_state
        claim_type: violation_to_error
        grounds: ["errors[ERR_RECORD_INVALID_STATE]", state_machines.MeetRecord.SUBMITTED_to_CURRENT]
        distinguishing_aspect: "ratify on a standing (CURRENT) record is rejected with ERR_RECORD_INVALID_STATE — ratify only from SUBMITTED."
        test_recipe:
          setup: ["meet + event + standing record"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "RE1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
            - { call: "POST /events/${ev1}/records", payload: { record_time_cs: 2450, holder_name: "Old", holder_team: "OLD", set_on_date: "2025-06-01" }, as: RecordsOfficer, captures: { rec: "$.data.id" } }
          trigger:
            - { call: "POST /records/${rec}/ratify", payload: {}, as: RecordsOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_RECORD_INVALID_STATE"
      - name: standing_record_uniqueness_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_RECORD_STANDING_EXISTS]"]
        distinguishing_aspect: "Creating a second standing record while one is CURRENT for the event is rejected with ERR_RECORD_STANDING_EXISTS."
        test_recipe:
          setup: ["standing record exists"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "RE2", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
            - { call: "POST /events/${ev1}/records", payload: { record_time_cs: 2450, holder_name: "Old", holder_team: "OLD", set_on_date: "2025-06-01" }, as: RecordsOfficer }
          trigger:
            - { call: "POST /events/${ev1}/records", payload: { record_time_cs: 2440, holder_name: "New", holder_team: "NEW", set_on_date: "2026-01-01" }, as: RecordsOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_RECORD_STANDING_EXISTS"
      - name: event_start_cancelled_returns_not_seeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_NOT_SEEDED]", state_machines.SwimEvent.PENDING_to_CANCELLED]
        distinguishing_aspect: "An entry-less event is auto-CANCELLED at seed; starting it is rejected with ERR_EVENT_NOT_SEEDED (the meet-level check passes, so the event-level guard is what fires)."
        test_recipe:
          setup: ["meet SEEDED; the only event had zero entries and is CANCELLED"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "RE3", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: Any }
            - { call: "POST /meets/${meet_id}/close-entries", payload: {}, as: MeetDirector, captures: { meet_v: "$.data.version" } }
            - { call: "POST /meets/${meet_id}/seed", payload: { expected_meet_version: "${meet_v}" }, as: MeetDirector }
          trigger:
            - { call: "POST /events/${ev1}/start", payload: {}, as: MeetDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_EVENT_NOT_SEEDED"
      - name: seed_while_entries_open_returns_not_seedable
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEET_NOT_SEEDABLE]"]
        distinguishing_aspect: "seed from ENTRIES_OPEN (correct OCC version) is rejected with ERR_MEET_NOT_SEEDABLE."
        test_recipe:
