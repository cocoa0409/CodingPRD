              as: Customer
              as_user_id: "${cust_id}"
              captures: { con2_id: $.data.id }
            - call: "POST /contracts/${con2_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /routes"
              payload: { region_zip: "70005", daily_capacity_minutes: 480 }
              as: DispatchManager
