    output: CriticalFinding
    side_effects:
      - "finding_status OPEN, notification_status PENDING, restriction_action NONE"
      - "notification_due_at = created_at + 24 hours (calculations.notification_deadline)"
      - "Bridge.open_critical_finding_count incremented; Bridge.version incremented by 1"

