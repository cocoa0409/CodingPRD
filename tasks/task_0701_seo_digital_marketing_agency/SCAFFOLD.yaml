# =============================================================================
# PRD Benchmark Seed Tables — SEO & Digital-Marketing Agency (Expert tier)
# =============================================================================

scenario: |
  701. SEO & Digital-Marketing Agency: client/site audit & keyword strategy, deliverable (content/backlink/technical) & sprint, rank/traffic tracking & reporting, retainer & scope/credits, PPC ad-spend management & markup, local-listing/GBP optimization, contract & renewal, white-label reseller

domain_name: seo-digital-marketing-agency
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys (Client, Retainer, Sprint, Deliverable,
  # AdCampaign, KeywordTarget, etc.); no deep URL nesting — every resource is a
  # top-level collection addressed by its own id, cross-linked by FK fields.

  state_machine_shape: branching
  # Deliverable has a revision cycle (cyclic), Contract has fork-join renewal,
  # AdCampaign carries two independent state dimensions, Dispute/Sprint branch.

  relationship_patterns:
    - one_to_many        # Client -> Retainer -> Deliverable; Client -> KeywordTarget
    - cross_aggregate    # AdCampaign.retainer_id, Deliverable.sprint_id, Client.reseller_id
    - polymorphic        # CreditLedgerEntry.source_ref points at Deliverable | AdCampaign | Retainer

  role_model: peer_roles
  # AgencyAdmin (opaque operator), AccountManager (opaque operator),
  # Reseller (entity_backed:Reseller), Client (entity_backed:Client).

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Reseller
    parent: null
    common_fields: true
    fields:
      - { name: brand_name, type: string, source: input, description: "White-label brand displayed to the reseller's own clients" }
      - { name: markup_pct, type: number, source: input, description: "Reseller's resale markup applied to wholesale retainer price; 0.00–1.00 (e.g., 0.30 = +30%)", constraints: "0.0 <= markup_pct <= 1.0" }
      - { name: ppc_management_pct, type: number, source: input, default: 0.15, description: "Reseller's standing PPC management fee rate applied to ad spend; 0.00–0.50", constraints: "0.0 <= ppc_management_pct <= 0.5" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Always ACTIVE on create; resellers have no suspend lifecycle in scope", constraints: "ACTIVE" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: reseller_id, type: string, source: input, description: "FK -> Reseller.id; null for direct agency clients (no white-label)" }
      - { name: company_name, type: string, source: input, description: "Client company name" }
      - { name: primary_domain, type: string, source: input, description: "Root domain under SEO management, e.g. example.com" }
      - { name: status, type: enum, source: system, default: "PROSPECT", description: "PROSPECT | AUDITED | ACTIVE | PAUSED | CHURNED", constraints: "PROSPECT | AUDITED | ACTIVE | PAUSED | CHURNED" }
      - { name: health_score, type: integer, source: computed, default: 100, description: "0–100 account-health score; recomputed from rank momentum, overdue deliverables, and dispute load", constraints: "0 <= health_score <= 100" }
      - { name: open_dispute_count, type: integer, source: computed, default: 0, description: "Count of this client's AdSpendDisputes currently in OPEN or UNDER_REVIEW" }

  - name: SiteAudit
    parent: null
    common_fields: false
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the client whose site was audited" }
      - { name: technical_score, type: integer, source: input, description: "Crawl-health technical score 0–100", constraints: "0 <= technical_score <= 100" }
      - { name: content_score, type: integer, source: input, description: "On-page content score 0–100", constraints: "0 <= content_score <= 100" }
      - { name: backlink_score, type: integer, source: input, description: "Off-page authority score 0–100", constraints: "0 <= backlink_score <= 100" }
      - { name: composite_score, type: integer, source: computed, description: "Weighted audit composite (see calc audit_composite_score)" }

  - name: KeywordTarget
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client this keyword belongs to" }
      - { name: phrase, type: string, source: input, description: "Target keyword phrase; unique per client among non-DROPPED targets" }
      - { name: search_volume, type: integer, source: input, description: "Monthly search volume estimate", constraints: ">= 0" }
      - { name: difficulty, type: integer, source: input, description: "Keyword difficulty 0–100", constraints: "0 <= difficulty <= 100" }
      - { name: priority_score, type: number, source: computed, description: "Opportunity score = search_volume * (1 - difficulty/100); ranks the strategy backlog" }
      - { name: current_rank, type: integer, source: computed, default: 0, description: "Latest tracked SERP position; 0 = not yet ranked / unranked, 1 = top" }
      - { name: best_rank, type: integer, source: computed, default: 0, description: "Best (lowest positive) rank ever recorded; 0 = never ranked" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | TRACKING | DROPPED", constraints: "PLANNED | TRACKING | DROPPED" }

  - name: RankSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: keyword_target_id, type: string, source: input, description: "FK -> KeywordTarget.id; the keyword this reading is for" }
      - { name: position, type: integer, source: input, description: "SERP position observed; 0 means out of tracked range (>100)", constraints: "0 <= position <= 100" }
      - { name: organic_traffic, type: integer, source: input, description: "Estimated organic sessions attributed in this reading", constraints: ">= 0" }
      - { name: observed_at, type: datetime, source: input, description: "ISO-8601 instant the reading was taken; defaults to logical clock now if omitted" }

  - name: Retainer
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client this retainer bills" }
      - { name: tier, type: enum, source: input, description: "STARTER | GROWTH | DOMINATE", constraints: "STARTER | GROWTH | DOMINATE" }
      - { name: monthly_credits, type: integer, source: input, description: "Credit allotment granted each billing cycle for this retainer", constraints: ">= 0" }
      - { name: wholesale_price_cents, type: integer, source: input, description: "Agency wholesale price before reseller markup", constraints: ">= 0" }
      - { name: rollover_cap_pct, type: number, source: input, default: 0.25, description: "Max fraction of monthly_credits that may roll into next cycle", constraints: "0.0 <= rollover_cap_pct <= 1.0" }
      - { name: credits_granted, type: integer, source: computed, default: 0, description: "Total credits granted into current cycle (allotment + capped rollover)" }
      - { name: credits_committed, type: integer, source: computed, default: 0, description: "Credits reserved by ASSIGNED/IN_PROGRESS/IN_REVIEW deliverables this cycle" }
      - { name: credits_consumed, type: integer, source: computed, default: 0, description: "Credits permanently burned by APPROVED deliverables this cycle" }
      - { name: credits_available, type: integer, source: computed, default: 0, description: "= credits_granted - credits_committed - credits_consumed" }
      - { name: billing_price_cents, type: integer, source: computed, default: 0, description: "Client-facing price = wholesale_price_cents * (1 + reseller.markup_pct), 0 if direct" }
      - { name: cycle_index, type: integer, source: system, default: 0, description: "Billing-cycle counter; advances via cycle rollover endpoint" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | SUSPENDED | CLOSED", constraints: "DRAFT | ACTIVE | SUSPENDED | CLOSED" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client the contract binds" }
      - { name: retainer_id, type: string, source: input, description: "FK -> Retainer.id; retainer this contract governs" }
      - { name: term_cycles, type: integer, source: input, description: "Committed number of billing cycles", constraints: ">= 1" }
      - { name: auto_renew, type: boolean, source: input, default: true, description: "Whether the contract auto-renews on expiry" }
      - { name: early_termination_fee_cents, type: integer, source: computed, default: 0, description: "Computed fee owed if terminated before term completes (see calc early_termination_fee)" }
      - { name: cycles_elapsed, type: integer, source: system, default: 0, description: "Billing cycles completed against this contract" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | SIGNED | ACTIVE | RENEWED | EXPIRED | TERMINATED", constraints: "PENDING | SIGNED | ACTIVE | RENEWED | EXPIRED | TERMINATED" }

  - name: Sprint
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client this sprint serves" }
      - { name: retainer_id, type: string, source: input, description: "FK -> Retainer.id; retainer that funds this sprint's deliverables" }
      - { name: name, type: string, source: input, description: "Sprint label, e.g. 'May Content Push'" }
      - { name: starts_at, type: datetime, source: input, description: "Sprint window start (inclusive), ISO-8601" }
      - { name: ends_at, type: datetime, source: input, description: "Sprint window end (exclusive), ISO-8601; must be after starts_at" }
      - { name: capacity_credits, type: integer, source: input, description: "Maximum total deliverable credits this sprint may hold", constraints: ">= 0" }
      - { name: committed_credits, type: integer, source: computed, default: 0, description: "Sum of credit_cost of non-CANCELLED/non-REJECTED deliverables in this sprint" }
      - { name: status, type: enum, source: system, default: "PLANNING", description: "PLANNING | ACTIVE | CLOSED", constraints: "PLANNING | ACTIVE | CLOSED" }

  - name: Deliverable
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client this work item is for" }
      - { name: retainer_id, type: string, source: input, description: "FK -> Retainer.id; retainer whose credits fund this deliverable" }
      - { name: sprint_id, type: string, source: input, description: "FK -> Sprint.id; sprint this deliverable is scheduled into" }
      - { name: kind, type: enum, source: input, description: "CONTENT | BACKLINK | TECHNICAL", constraints: "CONTENT | BACKLINK | TECHNICAL" }
      - { name: complexity, type: enum, source: input, default: "STANDARD", description: "STANDARD | COMPLEX", constraints: "STANDARD | COMPLEX" }
      - { name: credit_cost, type: integer, source: computed, description: "Credits this deliverable reserves/consumes (see calc deliverable_credit_cost)" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of times this deliverable has been sent back for revision" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ASSIGNED | IN_PROGRESS | IN_REVIEW | APPROVED | REJECTED | CANCELLED", constraints: "DRAFT | ASSIGNED | IN_PROGRESS | IN_REVIEW | APPROVED | REJECTED | CANCELLED" }

  - name: AdCampaign
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client this PPC campaign serves" }
      - { name: retainer_id, type: string, source: input, description: "FK -> Retainer.id; retainer that books this campaign's management fee" }
      - { name: channel, type: enum, source: input, description: "GOOGLE_ADS | META | BING", constraints: "GOOGLE_ADS | META | BING" }
      - { name: budget_cents, type: integer, source: input, description: "Authorized monthly ad-spend ceiling for this campaign", constraints: ">= 0" }
      - { name: spent_cents, type: integer, source: computed, default: 0, description: "Cumulative recorded ad spend this cycle" }
      - { name: management_fee_cents, type: integer, source: computed, default: 0, description: "Markup billed on spend (see calc ppc_management_fee)" }
      - { name: lifecycle_status, type: enum, source: system, default: "DRAFT", description: "Spend-lifecycle dimension: DRAFT | LIVE | PAUSED | ENDED", constraints: "DRAFT | LIVE | PAUSED | ENDED" }
      - { name: billing_status, type: enum, source: system, default: "UNBILLED", description: "Billing dimension (independent of lifecycle): UNBILLED | INVOICED | SETTLED", constraints: "UNBILLED | INVOICED | SETTLED" }

  - name: AdSpendDispute
    parent: null
    common_fields: true
    fields:
      - { name: ad_campaign_id, type: string, source: input, description: "FK -> AdCampaign.id; campaign whose spend is disputed" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client raising the dispute" }
      - { name: disputed_cents, type: integer, source: input, description: "Spend amount the client contests", constraints: ">= 1" }
      - { name: credited_cents, type: integer, source: computed, default: 0, description: "Amount credited back on resolution; 0 unless resolved in client favor" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | UNDER_REVIEW | UPHELD | DENIED | WITHDRAWN", constraints: "OPEN | UNDER_REVIEW | UPHELD | DENIED | WITHDRAWN" }

  - name: GbpListing
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client owning this Google Business Profile" }
      - { name: location_name, type: string, source: input, description: "Listing location label" }
      - { name: service_area, type: string, source: input, description: "Geographic service area string; unique per client among VERIFIED/OPTIMIZED listings" }
      - { name: optimization_score, type: integer, source: computed, default: 0, description: "0–100 completeness/optimization score" }
      - { name: status, type: enum, source: system, default: "UNVERIFIED", description: "UNVERIFIED | VERIFIED | OPTIMIZED | SUSPENDED", constraints: "UNVERIFIED | VERIFIED | OPTIMIZED | SUSPENDED" }

  - name: Report
    parent: null
    common_fields: false
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client this report covers" }
      - { name: period_start, type: datetime, source: input, description: "Reporting window start (inclusive), ISO-8601" }
      - { name: period_end, type: datetime, source: input, description: "Reporting window end (exclusive), ISO-8601; must be after period_start" }
      - { name: avg_rank, type: number, source: computed, description: "Mean current_rank over the client's TRACKING keywords with current_rank > 0 (ranked only) at generation time, round_half_up to 2 decimals; 0.0 when no such keyword exists" }
      - { name: total_traffic, type: integer, source: computed, description: "Sum of organic_traffic across RankSnapshots in [period_start, period_end)" }
      - { name: rank_momentum, type: number, source: computed, description: "Signed momentum used to drive health_score (see calc rank_momentum)" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: PROSPECT
    terminal_states: [CHURNED]
    transitions:
      - from: PROSPECT
        to: AUDITED
        trigger: "POST /clients/{id}/audits (first SiteAudit recorded)"
        actor: AccountManager
        preconditions:
          - "Client.status == PROSPECT"
        side_effects:
          - "create SiteAudit; set SiteAudit.composite_score via audit_composite_score"
          - "Client.status -> AUDITED"
          - "increments Client.version by 1"
      - from: AUDITED
        to: ACTIVE
        trigger: "POST /contracts/{id}/sign then retainer activation; system on first ACTIVE retainer"
        actor: system
        preconditions:
          - "Client.status == AUDITED"
          - "client has a Retainer in status ACTIVE"
        side_effects:
          - "Client.status -> ACTIVE"
          - "recompute Client.health_score via account_health_score"
          - "increments Client.version by 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /clients/{id}/pause"
        actor: AccountManager
        preconditions:
          - "Client.status == ACTIVE"
        side_effects:
          - "all client Retainers in status ACTIVE -> SUSPENDED (conditional cascade: only ACTIVE)"
          - "all client AdCampaigns with lifecycle_status == LIVE -> PAUSED"
          - "increments Client.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /clients/{id}/resume"
        actor: AccountManager
        preconditions:
          - "Client.status == PAUSED"
        side_effects:
          - "all client Retainers in status SUSPENDED -> ACTIVE"
          - "increments Client.version by 1"
      - from: ACTIVE
        to: CHURNED
        trigger: "POST /clients/{id}/churn"
        actor: AccountManager
        preconditions:
          - "Client.status IN {ACTIVE, PAUSED}"
          - "no Contract for this client in status ACTIVE or RENEWED (terminate first) — else ERR_CONTRACT_STILL_BINDING"
        side_effects:
          - "all client Retainers -> CLOSED (cascade)"
          - "each CLOSED Retainer cascades: its non-terminal Deliverables -> CANCELLED, releasing committed credits (depth-3 chain)"
          - "all client AdCampaigns with lifecycle_status IN {DRAFT, LIVE, PAUSED} -> ENDED"
          - "increments Client.version by 1"
      - from: PAUSED
        to: CHURNED
        trigger: "POST /clients/{id}/churn"
        actor: AccountManager
        preconditions:
          - "Client.status == PAUSED"
          - "no Contract for this client in status ACTIVE or RENEWED — else ERR_CONTRACT_STILL_BINDING"
        side_effects:
          - "all client Retainers -> CLOSED (cascade)"
          - "increments Client.version by 1"

  - entity: Retainer
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /retainers/{id}/activate"
        actor: AccountManager
        preconditions:
          - "Retainer.status == DRAFT"
          - "parent Client.status IN {AUDITED, ACTIVE} — else ERR_CLIENT_NOT_AUDITED"
        side_effects:
          - "credits_granted = monthly_credits (cycle 0 has no rollover)"
          - "credits_available recomputed via retainer_credit_balance"
          - "billing_price_cents recomputed via retainer_billing_price"
          - "if parent Client.status == AUDITED -> Client.status ACTIVE (bubble-up)"
          - "increments Retainer.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /retainers/{id}/suspend OR cascade from Client pause"
        actor: AccountManager | system
        preconditions:
          - "Retainer.status == ACTIVE"
        side_effects:
          - "new Deliverable creation against this retainer is blocked while SUSPENDED"
          - "increments Retainer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /retainers/{id}/activate OR cascade from Client resume"
        actor: AccountManager | system
        preconditions:
          - "Retainer.status == SUSPENDED"
        side_effects:
          - "increments Retainer.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /retainers/{id}/close OR cascade from Client churn"
        actor: AccountManager | system
        preconditions:
          - "Retainer.status IN {ACTIVE, SUSPENDED, DRAFT}"
        side_effects:
          - "all non-terminal Deliverables on this retainer -> CANCELLED, releasing their committed credits"
          - "increments Retainer.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /retainers/{id}/close OR cascade from Client churn"
        actor: AccountManager | system
        preconditions:
          - "Retainer.status == SUSPENDED"
        side_effects:
          - "all non-terminal Deliverables on this retainer -> CANCELLED, releasing their committed credits"
          - "increments Retainer.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /retainers/{id}/rollover (advance billing cycle)"
        actor: AccountManager
        preconditions:
          - "Retainer.status == ACTIVE"
          - "expected_retainer_version matches current Retainer.version — else ERR_STALE_RETAINER_VERSION"
        side_effects:
          - "cycle_index += 1"
          - "credits_granted = monthly_credits + capped_rollover (see calc retainer_cycle_rollover)"
          - "credits_committed and credits_consumed reset to 0 for the new cycle"
          - "credits_available recomputed via retainer_credit_balance"
          - "if linked Contract is ACTIVE: Contract.cycles_elapsed += 1, possibly auto-expiring (bubble-up)"
          - "increments Retainer.version by 1"
        note: "cyclic self-transition advancing the conserved credit pool"

  - entity: Contract
    initial_state: PENDING
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /contracts/{id}/sign"
        actor: Client
        preconditions:
          - "Contract.status == PENDING"
          - "linked Retainer.status IN {DRAFT, ACTIVE} — else ERR_RETAINER_NOT_SIGNABLE"
        side_effects:
          - "increments Contract.version by 1"
      - from: SIGNED
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: AccountManager
        preconditions:
          - "Contract.status == SIGNED"
          - "linked Retainer.status == ACTIVE — else ERR_RETAINER_NOT_ACTIVE"
        side_effects:
          - "early_termination_fee_cents recomputed via early_termination_fee"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: RENEWED
        trigger: "POST /contracts/{id}/renew (manual) OR system on cycles_elapsed == term_cycles AND auto_renew == true"
        actor: AccountManager | system
        preconditions:
          - "Contract.status == ACTIVE"
        side_effects:
          - "cycles_elapsed reset to 0"
          - "early_termination_fee_cents recomputed via early_termination_fee"
          - "increments Contract.version by 1"
        note: "branch A of the cycles_elapsed==term_cycles fork (auto_renew true)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system on cycles_elapsed == term_cycles AND auto_renew == false"
        actor: system
        preconditions:
          - "Contract.status == ACTIVE"
        side_effects:
          - "early_termination_fee_cents -> 0 (term completed, no fee)"
          - "increments Contract.version by 1"
        note: "branch B of the cycles_elapsed==term_cycles fork (auto_renew false)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: AccountManager
        preconditions:
          - "Contract.status IN {SIGNED, ACTIVE, RENEWED}"
        side_effects:
          - "early_termination_fee_cents recomputed via early_termination_fee at termination instant"
          - "increments Contract.version by 1"
      - from: SIGNED
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: AccountManager
        preconditions:
          - "Contract.status == SIGNED"
        side_effects:
          - "early_termination_fee_cents recomputed via early_termination_fee"
          - "increments Contract.version by 1"
      - from: RENEWED
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate (new term begins)"
        actor: AccountManager
        preconditions:
          - "Contract.status == RENEWED"
        side_effects:
          - "increments Contract.version by 1"
        note: "join — renewal loop returns to ACTIVE (cyclic ACTIVE->RENEWED->ACTIVE)"

  - entity: Sprint
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /sprints/{id}/start"
        actor: AccountManager
        preconditions:
          - "Sprint.status == PLANNING"
          - "linked Retainer.status == ACTIVE — else ERR_RETAINER_NOT_ACTIVE"
        side_effects:
          - "increments Sprint.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /sprints/{id}/close"
        actor: AccountManager
        preconditions:
          - "Sprint.status == ACTIVE"
          - "no Deliverable in this sprint in status IN {ASSIGNED, IN_PROGRESS, IN_REVIEW} — else ERR_SPRINT_HAS_OPEN_WORK"
        side_effects:
          - "increments Sprint.version by 1"

  - entity: Deliverable
    initial_state: DRAFT
    terminal_states: [APPROVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ASSIGNED
        trigger: "POST /deliverables/{id}/assign"
        actor: AccountManager
        preconditions:
          - "Deliverable.status == DRAFT"
          - "linked Retainer.status == ACTIVE — else ERR_RETAINER_NOT_ACTIVE"
          - "linked Sprint.status IN {PLANNING, ACTIVE}"
          - "Retainer.credits_available >= Deliverable.credit_cost — else ERR_INSUFFICIENT_CREDITS"
          - "Sprint.committed_credits + Deliverable.credit_cost <= Sprint.capacity_credits — else ERR_SPRINT_CAPACITY_EXCEEDED"
        side_effects:
          - "Retainer.credits_committed += credit_cost; credits_available recomputed (ledger sync)"
          - "Sprint.committed_credits += credit_cost"
          - "increments Deliverable.version by 1"
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /deliverables/{id}/start"
        actor: AccountManager
        preconditions:
          - "Deliverable.status == ASSIGNED"
        side_effects:
          - "increments Deliverable.version by 1"
      - from: IN_PROGRESS
        to: IN_REVIEW
        trigger: "POST /deliverables/{id}/submit"
        actor: AccountManager
        preconditions:
          - "Deliverable.status == IN_PROGRESS"
        side_effects:
          - "increments Deliverable.version by 1"
      - from: IN_REVIEW
        to: IN_PROGRESS
        trigger: "POST /deliverables/{id}/request_revision"
        actor: Client
        preconditions:
          - "Deliverable.status == IN_REVIEW"
        side_effects:
          - "revision_count += 1"
          - "increments Deliverable.version by 1"
        note: "revision cycle IN_REVIEW -> IN_PROGRESS -> IN_REVIEW (cyclic)"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /deliverables/{id}/approve"
        actor: Client
        preconditions:
          - "Deliverable.status == IN_REVIEW"
        side_effects:
          - "Retainer.credits_committed -= credit_cost; Retainer.credits_consumed += credit_cost (commit -> consume, conserves credits_available)"
          - "increments Deliverable.version by 1"
      - from: ASSIGNED
        to: REJECTED
        trigger: "POST /deliverables/{id}/reject"
        actor: AccountManager
        preconditions:
          - "Deliverable.status IN {ASSIGNED, IN_PROGRESS, IN_REVIEW}"
        side_effects:
          - "Retainer.credits_committed -= credit_cost; credits_available recomputed (compensation — releases reserve)"
          - "Sprint.committed_credits -= credit_cost"
          - "increments Deliverable.version by 1"
      - from: IN_PROGRESS
        to: REJECTED
        trigger: "POST /deliverables/{id}/reject"
        actor: AccountManager
        preconditions:
          - "Deliverable.status IN {ASSIGNED, IN_PROGRESS, IN_REVIEW}"
        side_effects:
          - "Retainer.credits_committed -= credit_cost; credits_available recomputed (compensation)"
          - "Sprint.committed_credits -= credit_cost"
          - "increments Deliverable.version by 1"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /deliverables/{id}/reject"
        actor: AccountManager
        preconditions:
          - "Deliverable.status IN {ASSIGNED, IN_PROGRESS, IN_REVIEW}"
        side_effects:
          - "Retainer.credits_committed -= credit_cost; credits_available recomputed (compensation)"
          - "Sprint.committed_credits -= credit_cost"
          - "increments Deliverable.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /deliverables/{id}/cancel OR cascade from Retainer close / Client churn"
        actor: AccountManager | system
        preconditions:
          - "Deliverable.status IN {DRAFT, ASSIGNED, IN_PROGRESS, IN_REVIEW}"
        side_effects:
          - "if status was ASSIGNED/IN_PROGRESS/IN_REVIEW: Retainer.credits_committed -= credit_cost; Sprint.committed_credits -= credit_cost (conditional compensation)"
          - "increments Deliverable.version by 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /deliverables/{id}/cancel OR cascade from Retainer close / Client churn"
        actor: AccountManager | system
        preconditions:
          - "Deliverable.status IN {DRAFT, ASSIGNED, IN_PROGRESS, IN_REVIEW}"
        side_effects:
          - "Retainer.credits_committed -= credit_cost; credits_available recomputed; Sprint.committed_credits -= credit_cost (compensation)"
          - "increments Deliverable.version by 1"

  - entity: AdCampaign
    initial_state: "DRAFT (lifecycle) / UNBILLED (billing)"
    terminal_states: ["ENDED (lifecycle)", "SETTLED (billing)"]
    transitions:
      - from: "DRAFT"
        to: "LIVE"
        trigger: "POST /ad-campaigns/{id}/launch"
        actor: AccountManager
        preconditions:
          - "AdCampaign.lifecycle_status == DRAFT"
          - "linked Retainer.status == ACTIVE — else ERR_RETAINER_NOT_ACTIVE"
        side_effects:
          - "lifecycle_status -> LIVE"
          - "increments AdCampaign.version by 1"
        note: "lifecycle dimension; billing_status untouched"
      - from: "LIVE"
        to: "PAUSED"
        trigger: "POST /ad-campaigns/{id}/pause OR cascade from Client pause"
        actor: AccountManager | system
        preconditions:
          - "AdCampaign.lifecycle_status == LIVE"
        side_effects:
          - "lifecycle_status -> PAUSED"
          - "increments AdCampaign.version by 1"
      - from: "PAUSED"
        to: "LIVE"
        trigger: "POST /ad-campaigns/{id}/launch"
        actor: AccountManager
        preconditions:
          - "AdCampaign.lifecycle_status == PAUSED"
        side_effects:
          - "lifecycle_status -> LIVE"
          - "increments AdCampaign.version by 1"
      - from: "LIVE"
        to: "ENDED"
        trigger: "POST /ad-campaigns/{id}/end OR cascade from Client churn"
        actor: AccountManager | system
        preconditions:
          - "AdCampaign.lifecycle_status IN {DRAFT, LIVE, PAUSED}"
        side_effects:
          - "lifecycle_status -> ENDED"
          - "increments AdCampaign.version by 1"
      - from: "UNBILLED"
        to: "INVOICED"
        trigger: "POST /ad-campaigns/{id}/invoice"
        actor: AccountManager
        preconditions:
          - "AdCampaign.billing_status == UNBILLED"
          - "AdCampaign has no AdSpendDispute in status IN {OPEN, UNDER_REVIEW} — else ERR_CAMPAIGN_HAS_OPEN_DISPUTE"
        side_effects:
          - "management_fee_cents recomputed via ppc_management_fee at invoice time"
          - "billing_status -> INVOICED"
          - "increments AdCampaign.version by 1"
        note: "billing dimension; independent of lifecycle_status"
      - from: "INVOICED"
        to: "SETTLED"
        trigger: "POST /ad-campaigns/{id}/settle"
        actor: AccountManager
        preconditions:
          - "AdCampaign.billing_status == INVOICED"
        side_effects:
          - "billing_status -> SETTLED"
          - "increments AdCampaign.version by 1"

  - entity: AdSpendDispute
    initial_state: OPEN
    terminal_states: [UPHELD, DENIED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /ad-spend-disputes/{id}/review"
        actor: AccountManager
        preconditions:
          - "AdSpendDispute.status == OPEN"
        side_effects:
          - "increments AdSpendDispute.version by 1"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /ad-spend-disputes/{id}/resolve with outcome=UPHELD"
        actor: AccountManager
        preconditions:
          - "AdSpendDispute.status == UNDER_REVIEW"
          - "disputed_cents <= linked AdCampaign.spent_cents — else ERR_DISPUTE_EXCEEDS_SPEND"
        side_effects:
          - "credited_cents = disputed_cents"
          - "AdCampaign.spent_cents -= disputed_cents; AdCampaign.management_fee_cents recomputed (cross-entity ledger sync)"
          - "parent Client.open_dispute_count recomputed; Client.health_score recomputed (depth-3 cascade)"
          - "increments AdSpendDispute.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /ad-spend-disputes/{id}/resolve with outcome=DENIED"
        actor: AccountManager
        preconditions:
          - "AdSpendDispute.status == UNDER_REVIEW"
        side_effects:
          - "credited_cents stays 0"
          - "parent Client.open_dispute_count recomputed; Client.health_score recomputed"
          - "increments AdSpendDispute.version by 1"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /ad-spend-disputes/{id}/withdraw"
        actor: Client
        preconditions:
          - "AdSpendDispute.status IN {OPEN, UNDER_REVIEW}"
        side_effects:
          - "parent Client.open_dispute_count recomputed; Client.health_score recomputed"
          - "increments AdSpendDispute.version by 1"

  - entity: GbpListing
    initial_state: UNVERIFIED
    terminal_states: [SUSPENDED]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /gbp-listings/{id}/verify"
        actor: AccountManager
        preconditions:
          - "GbpListing.status == UNVERIFIED"
          - "no other GbpListing for same client with same service_area in status IN {VERIFIED, OPTIMIZED} — else ERR_DUPLICATE_RESOURCE"
        side_effects:
          - "optimization_score recomputed via gbp_optimization_score"
          - "increments GbpListing.version by 1"
      - from: VERIFIED
        to: OPTIMIZED
        trigger: "POST /gbp-listings/{id}/optimize"
        actor: AccountManager
        preconditions:
          - "GbpListing.status == VERIFIED"
          - "optimization_score >= 80 — else ERR_OPTIMIZATION_THRESHOLD_NOT_MET"
        side_effects:
          - "increments GbpListing.version by 1"
      - from: VERIFIED
        to: SUSPENDED
        trigger: "POST /gbp-listings/{id}/suspend"
        actor: AccountManager
        preconditions:
          - "GbpListing.status IN {UNVERIFIED, VERIFIED, OPTIMIZED}"
        side_effects:
          - "increments GbpListing.version by 1"
      - from: OPTIMIZED
        to: SUSPENDED
        trigger: "POST /gbp-listings/{id}/suspend"
        actor: AccountManager
        preconditions:
          - "GbpListing.status IN {UNVERIFIED, VERIFIED, OPTIMIZED}"
        side_effects:
          - "increments GbpListing.version by 1"

  - entity: KeywordTarget
    initial_state: PLANNED
    terminal_states: [DROPPED]
    transitions:
      - from: PLANNED
        to: TRACKING
        trigger: "POST /keyword-targets/{id}/activate-tracking"
        actor: AccountManager
        preconditions:
          - "KeywordTarget.status == PLANNED"
          - "parent Client.status IN {AUDITED, ACTIVE} — else ERR_CLIENT_NOT_AUDITED"
        side_effects:
          - "increments KeywordTarget.version by 1"
      - from: TRACKING
        to: DROPPED
        trigger: "POST /keyword-targets/{id}/drop"
        actor: AccountManager
        preconditions:
          - "KeywordTarget.status == TRACKING"
        side_effects:
          - "increments KeywordTarget.version by 1"
      - from: PLANNED
        to: DROPPED
        trigger: "POST /keyword-targets/{id}/drop"
        actor: AccountManager
        preconditions:
          - "KeywordTarget.status == PLANNED"
        side_effects:
          - "increments KeywordTarget.version by 1"

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: retainer-rollover-stale-version
    parent_entity: Retainer
    write_endpoint: "POST /retainers/{id}/rollover"
    occ_field: "expected_retainer_version"
    description: |
      Advancing a Retainer's billing cycle against a version that has advanced
      since the client last observed it is rejected. A rollover legitimately
      resets credits_committed/credits_consumed and recomputes credits_granted;
      a second rollover carrying a stale expected_retainer_version would double
      the rollover against a cycle that no longer exists, so the system rejects
      it on the stale-version check.
    error_id: ERR_STALE_RETAINER_VERSION
    http_status: 412

  - rule_id: deliverable-assign-stale-retainer
    parent_entity: Retainer
    write_endpoint: "POST /deliverables/{id}/assign"
    occ_field: "expected_retainer_version"
    description: |
      Assigning a Deliverable (which reserves credits against the Retainer) using
      a Retainer version stale relative to the one the client last read is
      rejected. Another assignment or a rollover may have already moved the
      retainer's credit balance and version; the current writer's view of
      available credits is therefore stale and the reservation is refused on the
      stale-version check rather than silently over-committing the pool.
    error_id: ERR_STALE_RETAINER_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: deliverable_credit_cost
    trigger: "Deliverable creation (POST /deliverables)"
    algorithm: tiered_pricing
    formula: |
      base = BASE_COST[kind]              # CONTENT=3, BACKLINK=2, TECHNICAL=4
      multiplier = COMPLEXITY_MULT[complexity]   # STANDARD=1.0, COMPLEX=1.5
      credit_cost = ceil(base * multiplier)
      # ceil applies to the product; e.g. TECHNICAL+COMPLEX = ceil(4*1.5)=6,
      # CONTENT+COMPLEX = ceil(3*1.5)=ceil(4.5)=5
    input_set: "single Deliverable's kind + complexity; no cross-entity state"
    constants:
      BASE_COST_CONTENT: 3
      BASE_COST_BACKLINK: 2
      BASE_COST_TECHNICAL: 4
      COMPLEXITY_MULT_STANDARD: 1.0
      COMPLEXITY_MULT_COMPLEX: 1.5
    precision: "integer credits, ceil after multiply (round half up never reached — ceil pinned)"

  - name: retainer_credit_balance
    trigger: "Deliverable assign/approve/reject/cancel; retainer activate/rollover"
    algorithm: aggregation
    formula: |
      credits_committed = sum(d.credit_cost for Deliverable d
                              where d.retainer_id == this.id
                              and d.status IN {ASSIGNED, IN_PROGRESS, IN_REVIEW})
      credits_consumed  = sum(d.credit_cost for Deliverable d
                              where d.retainer_id == this.id
                              and d.status == APPROVED
                              and d was approved during current cycle_index)
      credits_available = credits_granted - credits_committed - credits_consumed
    input_set: "Deliverables of this retainer filtered by status; current cycle only"
    constants: {}
    precision: "integer credits"

  - name: retainer_cycle_rollover
    trigger: "POST /retainers/{id}/rollover"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned: leftover first, then cap, then grant.
      leftover = credits_available                    # at end of prior cycle
      max_rollover = floor(monthly_credits * rollover_cap_pct)
      rolled = min(leftover, max_rollover)            # capped carry-forward
      credits_granted = monthly_credits + rolled
      credits_committed = 0
      credits_consumed = 0
      credits_available = credits_granted
      # invariant (compensating): credits NEVER created from nothing —
      # rolled <= leftover, so no cycle can grant more carry than was unused.
    input_set: "this Retainer's end-of-cycle balance + tier allotment"
    constants: {}
    precision: "integer credits; floor on the cap, min() clamps to leftover"

  - name: ppc_management_fee
    trigger: "AdSpend recorded (POST /ad-campaigns/{id}/record-spend); invoice transition"
    algorithm: tiered_pricing
    formula: |
      # Marginal tiered markup on cumulative spent_cents (NOT flat-rate):
      #   spend in [0, TIER1_CENTS)         -> rate base_rate
      #   spend in [TIER1_CENTS, TIER2_CENTS) -> rate base_rate - 0.03
      #   spend in [TIER2_CENTS, inf)        -> rate base_rate - 0.06
      # base_rate = reseller.ppc_management_pct if client.reseller_id else AGENCY_PPC_PCT
      # Apply each tier's rate to the portion of spend that falls in that tier,
      # sum the per-tier fees, THEN round the total down to whole cents.
      # (Order pinned: per-tier raw fee -> sum -> single floor. NOT floor per tier.)
      management_fee_cents = floor( sum over tiers of (portion_in_tier * tier_rate) )
    input_set: "this AdCampaign.spent_cents + base_rate from reseller or agency default"
    constants:
      AGENCY_PPC_PCT: 0.20
      TIER1_CENTS: 500000      # $5,000
      TIER2_CENTS: 2000000     # $20,000
      TIER1_DISCOUNT: 0.03
      TIER2_DISCOUNT: 0.06
    precision: "cents; round DOWN (floor) once on the summed total, after all tiers"
    variants:
      - name: live_estimate
        when: "AdCampaign.billing_status == UNBILLED (campaign still LIVE/PAUSED)"
        difference: "provisional fee over current spent_cents; recomputed on every record-spend and excludes spend later removed by an UPHELD dispute"
      - name: invoiced_final
        when: "AdCampaign transitions UNBILLED -> INVOICED"
        difference: "final fee frozen at invoice instant over post-dispute spent_cents; an UPHELD dispute settled AFTER invoicing does NOT retroactively lower an INVOICED fee"

  - name: retainer_billing_price
    trigger: "Retainer activate; reseller markup change"
    algorithm: pricing_engine
    formula: |
      if client.reseller_id is null:
        billing_price_cents = wholesale_price_cents          # direct: no markup
      else:
        billing_price_cents = floor(wholesale_price_cents * (1 + reseller.markup_pct))
    input_set: "this Retainer.wholesale_price_cents + parent Client.reseller_id -> Reseller.markup_pct"
    constants: {}
    precision: "cents; floor after multiply"

  - name: early_termination_fee
    trigger: "Contract activate/renew/terminate"
    algorithm: threshold
    formula: |
      remaining = max(0, term_cycles - cycles_elapsed)
      if remaining == 0:
        early_termination_fee_cents = 0
      else:
        # 50% of remaining committed billing, but never below a floor of one
        # cycle's billing price once any cycles remain.
        raw = floor(retainer.billing_price_cents * remaining * EARLY_TERM_RATE)
        early_termination_fee_cents = max(raw, retainer.billing_price_cents)
    input_set: "this Contract.term_cycles, cycles_elapsed + linked Retainer.billing_price_cents"
    constants:
      EARLY_TERM_RATE: 0.5
    precision: "cents; floor on the rate product, then max-floor clamp"

  - name: audit_composite_score
    trigger: "SiteAudit creation (POST /clients/{id}/audits)"
    algorithm: weighted_scoring
    formula: |
      # weights sum to 1.0; round the weighted sum HALF UP to nearest integer
      composite = round_half_up( technical_score * W_TECH
                               + content_score   * W_CONTENT
                               + backlink_score  * W_BACKLINK )
    input_set: "single SiteAudit's three sub-scores"
    constants:
      W_TECH: 0.4
      W_CONTENT: 0.35
      W_BACKLINK: 0.25
    precision: "integer 0–100, round_half_up"

  - name: rank_momentum
    trigger: "Report generation (POST /clients/{id}/reports)"
    algorithm: chronological
    formula: |
      # Over the client's TRACKING KeywordTargets, replay RankSnapshots whose
      # observed_at is in [period_start, period_end), ordered by observed_at ASC,
      # then by RankSnapshot.created_at ASC as tie-break (NEVER by id).
      # For each keyword: improvement = first_position_in_window - last_position_in_window
      #   (a positive number means rank moved toward 1 = improvement;
      #    position 0 = unranked is treated as 101 for momentum math)
      # rank_momentum = round_half_up( mean(improvement over keywords with >=1 snapshot), 2 )
      # EMPTY-SET edge: if no TRACKING keyword has >=1 in-window snapshot,
      #   rank_momentum = 0.0 (mean over empty set is defined as 0.0, not an error).
      # rank_momentum drives account_health_score.
    input_set: "TRACKING KeywordTargets of client; RankSnapshots in the window"
    constants:
      UNRANKED_SENTINEL: 101
    precision: "2 decimals, round_half_up; chronological order_by observed_at then created_at"

  - name: account_health_score
    trigger: "Client activate; dispute resolve/withdraw; report generation"
    algorithm: weighted_scoring
    formula: |
      base = 100
      momentum_term = clamp(rank_momentum * MOMENTUM_WEIGHT, -30, 30)   # latest Report.rank_momentum, 0 if none
      overdue_penalty = OVERDUE_PENALTY * count(Deliverable d where d.client_id==client.id
                          and d.status IN {ASSIGNED, IN_PROGRESS, IN_REVIEW}
                          and d.sprint.ends_at < clock_now)
      dispute_penalty = DISPUTE_PENALTY * client.open_dispute_count
      health_score = clamp(round_half_up(base + momentum_term - overdue_penalty - dispute_penalty), 0, 100)
    input_set: "client's latest Report.rank_momentum, overdue Deliverables, open_dispute_count"
    constants:
      MOMENTUM_WEIGHT: 2.0
      OVERDUE_PENALTY: 5
      DISPUTE_PENALTY: 10
    precision: "integer 0–100, round_half_up, clamped"

  - name: gbp_optimization_score
    trigger: "GbpListing verify; GET /gbp-listings/{id}"
    algorithm: weighted_scoring
    formula: |
      # completeness signals, each 25 points if the field is non-empty:
      score = (location_name non-empty ? 25 : 0)
            + (service_area non-empty ? 25 : 0)
            + (status IN {VERIFIED, OPTIMIZED} ? 25 : 0)
            + (client.status == ACTIVE ? 25 : 0)
    input_set: "this GbpListing fields + parent Client.status"
    constants: {}
    precision: "integer 0–100"

  - name: keyword_priority_score
    trigger: "KeywordTarget creation; GET /keyword-targets/{id}"
    algorithm: weighted_scoring
    formula: |
      priority_score = round_half_up( search_volume * (1 - difficulty/100.0), 2 )
    input_set: "single KeywordTarget's search_volume + difficulty"
    constants: {}
    precision: "2 decimals, round_half_up"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed (X-User-ID required for entity_backed roles)"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all except POST /resellers and POST /clients and POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "Acting role permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "entity_backed actor owns the targeted resource (Client acts only on own resources; Reseller acts only on own clients)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Client- and Reseller-scoped mutations"

  - priority: 4
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges within constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all writes"

  - priority: 6
    category: state
    check: "Target resource in a state that permits this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_retainer_version equals current Retainer.version on rollover and on deliverable assign"
    error_id: ERR_STALE_RETAINER_VERSION
    http_status: 412
    applies_to: "POST /retainers/{id}/rollover, POST /deliverables/{id}/assign"

  - priority: 8
    category: business_referential
    check: "Cross-entity precondition: linked Retainer.status == ACTIVE for deliverable assign, sprint start, ad-campaign launch"
    error_id: ERR_RETAINER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /deliverables/{id}/assign, POST /sprints/{id}/start, POST /ad-campaigns/{id}/launch"

  - priority: 9
    category: business_referential
    check: "Client must be AUDITED or ACTIVE before retainer activation or keyword tracking"
    error_id: ERR_CLIENT_NOT_AUDITED
    http_status: 409
    applies_to: "POST /retainers/{id}/activate, POST /keyword-targets/{id}/activate-tracking"

  - priority: 10
    category: business_referential
    check: "Client churn blocked while a Contract for the client is ACTIVE or RENEWED"
    error_id: ERR_CONTRACT_STILL_BINDING
    http_status: 409
    applies_to: "POST /clients/{id}/churn"

  - priority: 11
    category: business_safety
    check: "AdCampaign with an OPEN/UNDER_REVIEW AdSpendDispute cannot be invoiced"
    error_id: ERR_CAMPAIGN_HAS_OPEN_DISPUTE
    http_status: 409
    applies_to: "POST /ad-campaigns/{id}/invoice"

  - priority: 12
    category: business_safety
    check: "AdSpendDispute resolved UPHELD cannot credit more than current AdCampaign.spent_cents"
    error_id: ERR_DISPUTE_EXCEEDS_SPEND
    http_status: 409
    applies_to: "POST /ad-spend-disputes/{id}/resolve"

  - priority: 13
    category: business_constraint
    check: "Recorded spend may not push AdCampaign.spent_cents above budget_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /ad-campaigns/{id}/record-spend"

  - priority: 14
    category: business_constraint
    check: "GBP optimize requires optimization_score >= 80"
    error_id: ERR_OPTIMIZATION_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /gbp-listings/{id}/optimize"

  - priority: 15
    category: business_constraint
    check: "Sprint cannot close while it holds ASSIGNED/IN_PROGRESS/IN_REVIEW deliverables"
    error_id: ERR_SPRINT_HAS_OPEN_WORK
    http_status: 409
    applies_to: "POST /sprints/{id}/close"

  - priority: 16
    category: business_temporal
    check: "Sprint window must satisfy ends_at > starts_at; deliverable assign requires sprint window to contain clock_now for ACTIVE sprints"
    error_id: ERR_INVALID_SPRINT_WINDOW
    http_status: 422
    applies_to: "POST /sprints, POST /deliverables/{id}/assign"

  - priority: 17
    category: business_referential
    check: "Uniqueness: KeywordTarget.phrase unique per client among non-DROPPED; GbpListing.service_area unique per client among VERIFIED/OPTIMIZED"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /keyword-targets, POST /gbp-listings/{id}/verify"

  - priority: 18
    category: business_constraint
    check: "Sprint capacity: committed_credits + new deliverable credit_cost must not exceed capacity_credits"
    error_id: ERR_SPRINT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /deliverables/{id}/assign"

  - priority: 19
    category: business_fiscal
    check: "Retainer credits_available must cover deliverable credit_cost on assign"
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 409
    applies_to: "POST /deliverables/{id}/assign"

  - priority: 20
    category: business_temporal
    check: "Sprint windows for the same retainer must not overlap. Interval semantics: HALF-OPEN [starts_at, ends_at); two sprints touching exactly (a.ends_at == b.starts_at) are ADJACENT and allowed. Compared only against sprints of the same retainer in status IN {PLANNING, ACTIVE}."
    error_id: ERR_SPRINT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /sprints"

  - priority: 21
    category: business_temporal
    check: "Report reporting periods for the same client must not overlap. Interval semantics: CLOSED [period_start, period_end] PLUS a mandatory REPORT_GAP_DAYS=1 buffer; a new period_start must be strictly greater than (prior period_end + 1 day) and a new period_end strictly less than (next period_start - 1 day). Touching or within-buffer periods are rejected. Compared against all prior Reports of the same client."
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /clients/{id}/reports"

