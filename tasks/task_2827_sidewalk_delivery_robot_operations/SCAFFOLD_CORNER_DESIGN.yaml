          created_at and updated_at are stamped from the logical clock and from nothing else, so a row
          created after the clock jumps a day carries that day, a later transition moves only updated_at
          while created_at stays frozen, and a row created earlier is untouched by both jumps - every
          timestamp rendered with exactly three fractional digits and a trailing Z.
        test_recipe:
          setup:
            - "the logical clock was set to 2026-08-03T09:00:00.000Z and ServiceZone Z1 was created at that instant"
