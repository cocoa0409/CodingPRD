  - method: POST
    path: "/servicing/advances/{id}/recover"
    description: "Recover an advance from escrow balance"
    roles: [EscrowAnalyst]
    code: 200
    input: [amount_cents]
    output: EscrowAdvance
    side_effects: ["post ADVANCE_RECOVERY entry -amount_cents; recovered_cents += amount; status OUTSTANDING->RECOVERING->RECOVERED as outstanding reaches 0; ERR_RECOVERY_EXCEEDS_OUTSTANDING when amount > outstanding; ERR_INVALID_AMOUNT when amount > account balance; increments EscrowAdvance.version and EscrowAccount.version by 1"]
  - method: POST
    path: "/servicing/advances/{id}/write-off"
    description: "Write off the remaining advance (terminal)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EscrowAdvance
    side_effects: ["status -> WRITTEN_OFF; written_off_cents = outstanding_cents; outstanding_cents = 0; increments EscrowAdvance.version by 1"]

  # --- Error resolution cases (RESPA Reg X) ---
  - method: POST
    path: "/servicing/loans/{id}/error-cases"
    description: "Borrower files a notice of error"
    roles: [Borrower]
    code: 201
    input: [error_type, description, "asserted_amount_cents?"]
    output: ErrorResolutionCase
    side_effects: ["status RECEIVED; received_at = now; ack_deadline = received + 5 business days; resolution_deadline = received + 30 business days; ERR_DUPLICATE_ACTIVE_CASE when a non-terminal case with same loan+error_type exists"]
  - method: GET
    path: "/servicing/loans/{id}/error-cases"
    description: "List error cases of a loan"
    roles: [ComplianceOfficer, EscrowAnalyst, DisbursementProcessor, PayeeVerifier, InsuranceSpecialist, Borrower]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ErrorResolutionCase[]
    side_effects: []
  - method: GET
    path: "/servicing/error-cases/{id}"
    description: "Get one error case"
    roles: [ComplianceOfficer, EscrowAnalyst, DisbursementProcessor, PayeeVerifier, InsuranceSpecialist, Borrower]
    code: 200
    input: []
    output: ErrorResolutionCase
    side_effects: []
  - method: POST
    path: "/servicing/error-cases/{id}/acknowledge"
    description: "Acknowledge a case (RESPA: within 5 business days; late ack is flagged, not blocked)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ErrorResolutionCase
    side_effects: ["RECEIVED -> ACKNOWLEDGED; acknowledged_at and ack_timeliness set; increments ErrorResolutionCase.version by 1"]
  - method: POST
    path: "/servicing/error-cases/{id}/assign"
    description: "Assign an investigator (SoD anchor for resolution)"
    roles: [ComplianceOfficer]
    code: 200
    input: [assigned_to_user_id]
    output: ErrorResolutionCase
    side_effects: ["ACKNOWLEDGED -> INVESTIGATING; increments ErrorResolutionCase.version by 1"]
  - method: POST
    path: "/servicing/error-cases/{id}/extend"
    description: "Extend resolution window to 45 business days (must be requested before the 30-day deadline)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ErrorResolutionCase
    side_effects: ["INVESTIGATING -> EXTENDED; resolution_deadline recomputed to received + 45 business days; increments ErrorResolutionCase.version by 1"]
  - method: POST
    path: "/servicing/error-cases/{id}/resolve"
    description: "Resolve a case; CORRECTED posts an ERROR_CORRECTION credit and cascades to analysis/notice"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "correction_amount_cents?", "resolution_note?"]
    output: ErrorResolutionCase
    side_effects: ["INVESTIGATING|EXTENDED -> RESOLVED_CORRECTED or RESOLVED_NO_ERROR; CORRECTED cascade: ERROR_CORRECTION entry +correction -> balance recompute -> EFFECTIVE analysis -> REOPENED -> its pending notices VOIDED; resolver != investigator (SoD); resolution_timeliness computed; increments ErrorResolutionCase.version by 1"]
  - method: POST
    path: "/servicing/error-cases/{id}/dismiss"
    description: "Dismiss a non-covered or duplicative assertion from RECEIVED or ACKNOWLEDGED"
    roles: [ComplianceOfficer]
    code: 200
    input: [dismissal_reason]
    output: ErrorResolutionCase
    side_effects: ["status -> DISMISSED_NOT_COVERED; increments ErrorResolutionCase.version by 1"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role is valid but not in the endpoint's roles list" }
  - { id: ERR_BORROWER_NOT_OWNER, http: 403, condition: "Borrower role acting on a resource whose owning Loan id != X-User-ID" }
  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body foreign-key reference (payee_id, line_item_id, disbursement_id) does not exist" }
  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, invalid enum member, malformed date, escrow account requested for a loan with escrow_required = false" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "Amount not a positive integer; mark-paid disbursement amount below tax amount_due; recovery amount above account balance" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version (OCC)" }
  # --- State ---
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Action attempted from a terminal state" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Action not allowed from the resource's current state" }
  - { id: ERR_ACCOUNT_ON_HOLD, http: 409, condition: "Escrow account hold_status = COMPLIANCE_HOLD blocks release/compute/finalize" }
  - { id: ERR_LOAN_NOT_ACTIVE, http: 409, condition: "Loan not ACTIVE for an operation that requires it" }
  # --- Compliance / safety ---
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "Segregation of duties breached: verifier=creator, releaser=scheduler, or resolver=investigator" }
  - { id: ERR_NOTICE_WINDOW_NOT_MET, http: 409, condition: "Force-placement charge before notice_1 + 45 days or before notice_2 + 15 days" }
  - { id: ERR_REMINDER_TOO_EARLY, http: 409, condition: "Reminder notice before notice_1 + 30 days" }
  - { id: ERR_ACTIVE_COVERAGE_EXISTS, http: 409, condition: "Force-placement charge while another ACTIVE same-type policy covers the loan" }
  # --- Temporal ---
  - { id: ERR_RELEASE_TOO_EARLY, http: 409, condition: "Disbursement release before scheduled_release_date" }
  - { id: ERR_EFFECTIVE_DATE_NOT_REACHED, http: 409, condition: "Notice apply before its effective_date" }
  - { id: ERR_EXTENSION_WINDOW_PASSED, http: 409, condition: "Extension requested after the 30-business-day resolution deadline" }
  - { id: ERR_PROJECTION_START_INVALID, http: 422, condition: "projection_start_date is not the first day of a month" }
  # --- Constraint / duplicates ---
  - { id: ERR_DUPLICATE_LOAN_NUMBER, http: 409, condition: "loan_number already exists" }
  - { id: ERR_ESCROW_ACCOUNT_EXISTS, http: 409, condition: "Loan already has an escrow account" }
  - { id: ERR_DUPLICATE_LINE_ITEM_TYPE, http: 409, condition: "An ACTIVE line item of the same expense_type already exists on the account" }
  - { id: ERR_DUPLICATE_ACTIVE_CASE, http: 409, condition: "A non-terminal error case with the same loan_id and error_type already exists" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "New policy coverage [start,end) overlaps another ACTIVE same-type policy on the loan" }
  - { id: ERR_ANALYSIS_WINDOW_OVERLAP, http: 409, condition: "New cycle's closed projection window overlaps another non-terminal cycle of the account" }
  # --- Referential ---
  - { id: ERR_PAYEE_NOT_VERIFIED, http: 409, condition: "Payee not in VERIFIED status at line-item create or disbursement create/release" }
  - { id: ERR_UNRESOLVED_ERROR_CASE, http: 409, condition: "Loan transfer-out blocked by an open error case" }
  - { id: ERR_ADVANCE_OUTSTANDING, http: 409, condition: "Loan payoff blocked by advances in OUTSTANDING or RECOVERING" }
  - { id: ERR_ESCROW_NOT_ACTIVE, http: 409, condition: "Loan activation requires an ACTIVE escrow account when escrow_required = true" }
  # --- Fiscal ---
  - { id: ERR_ADVANCE_CAP_EXCEEDED, http: 422, condition: "Advance would push total outstanding advances of the account above ADVANCE_CAP_CENTS (1000000)" }
  - { id: ERR_RECOVERY_EXCEEDS_OUTSTANDING, http: 422, condition: "Recovery amount exceeds advance outstanding_cents" }
  - { id: ERR_SHORTAGE_OPTION_REQUIRED, http: 422, condition: "Acknowledge without shortage_option when shortage + deficiency > 0" }
  - { id: ERR_SHORTAGE_OPTION_NOT_APPLICABLE, http: 422, condition: "shortage_option supplied when shortage + deficiency = 0" }
  - { id: ERR_SHORTAGE_LUMP_SUM_MISSING, http: 422, condition: "Apply with LUMP_SUM but deposits since notice sent date do not cover shortage + deficiency" }
  - { id: ERR_DEFICIENCY_SPREAD_MANDATORY, http: 422, condition: "LUMP_SUM chosen when deficiency_cents >= one month of escrow at finalize time (RESPA: must spread over >= 12 months)" }

# =============================================================================
# Table 7: RBAC Matrix (role model: segregation_of_duties)
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "Escrow compliance owner: loan lifecycle, holds/suspensions, error-case handling, manual advances and write-offs, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /servicing/loans — board loan"
      - "POST /servicing/loans/{id}/activate — activate loan"
      - "POST /servicing/loans/{id}/payoff — pay off loan"
      - "POST /servicing/loans/{id}/transfer-out — transfer loan"
      - "POST /servicing/escrow-accounts/{id}/suspend — suspend account"
      - "POST /servicing/escrow-accounts/{id}/reinstate — reinstate account"
      - "POST /servicing/escrow-accounts/{id}/hold — compliance hold"
      - "POST /servicing/escrow-accounts/{id}/release-hold — release hold"
      - "POST /servicing/escrow-accounts/{id}/advances — manual advance"
      - "POST /servicing/advances/{id}/write-off — write off advance"
      - "POST /servicing/analyses/{id}/reopen — reopen analysis"
      - "POST /servicing/analyses/{id}/void — void analysis"
      - "POST /servicing/notices/{id}/void — void notice"
      - "POST /servicing/error-cases/{id}/acknowledge|assign|extend|resolve|dismiss — RESPA case handling"
      - "POST /_clock/set_current_utc — drive logical clock"
    shared_operations:
      - "POST /servicing/payees/{id}/suspend — shared with PayeeVerifier"
      - "All GET endpoints"
  - name: EscrowAnalyst
    description: "Escrow analyst: account setup, line items, deposits, analyses, notices, tax monitoring, advance recovery"
    identity: opaque
    exclusive_operations:
      - "POST /servicing/loans/{id}/escrow-account — create escrow account"
      - "POST /servicing/escrow-accounts/{id}/activate — activate account"
      - "POST /servicing/escrow-accounts/{id}/line-items — add line item"
      - "PATCH /servicing/escrow-line-items/{id} — update line item"
      - "POST /servicing/escrow-line-items/{id}/remove — remove line item"
      - "POST /servicing/escrow-accounts/{id}/analyses — open analysis cycle"
      - "POST /servicing/analyses/{id}/compute|issue-statement|finalize — analysis lifecycle"
      - "POST /servicing/notices/{id}/send|apply — notice lifecycle"
      - "POST /servicing/advances/{id}/recover — recover advance"
      - "POST /servicing/loans/{id}/tax-monitoring-records — register tax installment"
      - "POST /servicing/tax-monitoring-records/{id}/mark-paid — mark tax paid"
    shared_operations:
      - "POST /servicing/escrow-accounts/{id}/deposits — shared with Borrower"
      - "All GET endpoints"
  - name: DisbursementProcessor
    description: "Disbursement operations: creates payees, schedules and releases disbursements; SoD forbids releasing one's own schedule"
    identity: opaque
    exclusive_operations:
      - "POST /servicing/payees — create payee"
      - "POST /servicing/escrow-accounts/{id}/disbursements — schedule disbursement"
      - "PATCH /servicing/disbursements/{id} — reschedule (OCC)"
      - "POST /servicing/disbursements/{id}/release|cancel|mark-cleared|mark-returned — disbursement lifecycle"
    shared_operations:
      - "All GET endpoints"
  - name: PayeeVerifier
    description: "Independent payee verification officer; SoD forbids verifying a payee one created"
    identity: opaque
    exclusive_operations:
      - "POST /servicing/payees/{id}/verify — verify or re-verify payee"
      - "POST /servicing/payees/{id}/reject — reject payee"
    shared_operations:
      - "POST /servicing/payees/{id}/suspend — shared with ComplianceOfficer"
      - "All GET endpoints"
  - name: InsuranceSpecialist
    description: "Insurance desk: policy records, lapse detection, force-placement notices, charges and refunds"
    identity: opaque
    exclusive_operations:
      - "POST /servicing/insurance-policies/{id}/report-lapse|send-first-notice|send-reminder-notice|charge-force-placement|refund-force-placement|cancel"
    shared_operations:
      - "POST /servicing/loans/{id}/insurance-policies — shared with Borrower"
      - "POST /servicing/insurance-policies/{id}/reinstate — shared with Borrower"
      - "All GET endpoints"
  - name: Borrower
    description: "The loan's borrower; X-User-ID equals the id of their Loan"
    identity: "entity_backed:Loan"
    exclusive_operations:
      - "POST /servicing/loans/{id}/error-cases — file notice of error (own loan only)"
      - "POST /servicing/notices/{id}/acknowledge — acknowledge payment change notice (own loan only)"
    shared_operations:
      - "POST /servicing/loans/{id}/insurance-policies — submit coverage evidence (own loan only)"
      - "POST /servicing/insurance-policies/{id}/reinstate — cure a lapse (own loan only)"
      - "POST /servicing/escrow-accounts/{id}/deposits — make escrow deposit (own loan only)"
      - "All GET endpoints (own resources)"
