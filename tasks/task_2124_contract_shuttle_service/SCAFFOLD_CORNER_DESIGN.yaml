      - name: pagination_limit_above_the_maximum_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=45]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit 101 exceeds the declared maximum of 100 and returns 400 ERR_INVALID_PAGINATION rather than silently clamping to 100."
        test_recipe:
          setup:
            - "Empty database; no rows are required for a pagination bound check."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "GET /trips"
              payload: { limit: 101, offset: 0 }
              as: OpsPlanner
              captures: { e_pag: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${e_pag} == 'ERR_INVALID_PAGINATION'"
            - "response_type == 'error'"

      - name: explicit_match_violations_are_rejected_per_rule
        claim_type: conditional_validation
        grounds:
          - validations[priority=84]
          - validations[priority=106]
          - validations[priority=120]
          - errors[ERR_ADA_VEHICLE_REQUIRED]
          - errors[ERR_TRIP_SEATS_EXHAUSTED]
          - errors[ERR_TRIP_DEPARTURE_TOO_EARLY]
        distinguishing_aspect: "Supplying trip_id explicitly bypasses the selector but not its predicates: an ADA request against an unassigned trip returns ERR_ADA_VEHICLE_REQUIRED, a party of 1 against a trip whose 2 reference seats are already taken returns ERR_TRIP_SEATS_EXHAUSTED, and and the 432 trip, which still has both reference seats free, returns ERR_TRIP_DEPARTURE_TOO_EARLY for a pickup requested at 444."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with a PUBLISHED Route (window 420..456, headway 12, reference_seat_capacity 2) for 2026-09-02, all four trips SCHEDULED and unassigned."
            - "One OnDemandRequest of party 2 already MATCHED to the 420 trip, so that trip's matched_party_seats is 2 and its remaining seats are 0."
            - "Three further PENDING requests: an ADA one for pickup 420, a party-of-1 for pickup 420, and a party-of-1 for pickup 444."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Explicit Match Campus", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cem: $.data.id }
            - call: "POST /service-contracts/${cem}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${cem}", name: "Explicit Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 456, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 2 }
              as: OpsPlanner
              captures: { rem: $.data.id }
            - call: "POST /routes/${rem}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${rem}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tem1: "$.data[0].id", tem2: "$.data[1].id" }
            - call: "POST /on-demand-requests"
              payload: { contract_id: "${cem}", service_date: "2026-09-02", requested_pickup_min: 420, party_size: 2, requires_ada: false }
              as: ClientLiaison
              captures: { odem0: $.data.id }
            - call: "POST /on-demand-requests/${odem0}/match"
              payload: { trip_id: "${tem1}" }
              as: OpsPlanner
            - call: "POST /on-demand-requests"
              payload: { contract_id: "${cem}", service_date: "2026-09-02", requested_pickup_min: 420, party_size: 1, requires_ada: true }
              as: ClientLiaison
              captures: { odem1: $.data.id }
            - call: "POST /on-demand-requests"
              payload: { contract_id: "${cem}", service_date: "2026-09-02", requested_pickup_min: 420, party_size: 1, requires_ada: false }
              as: ClientLiaison
              captures: { odem2: $.data.id }
            - call: "POST /on-demand-requests"
              payload: { contract_id: "${cem}", service_date: "2026-09-02", requested_pickup_min: 444, party_size: 1, requires_ada: false }
              as: ClientLiaison
              captures: { odem3: $.data.id }
          trigger:
            - call: "POST /on-demand-requests/${odem1}/match"
              payload: { trip_id: "${tem1}" }
              as: OpsPlanner
              captures: { e_ada_req: $.data.error_id }
            - call: "POST /on-demand-requests/${odem2}/match"
              payload: { trip_id: "${tem1}" }
              as: OpsPlanner
              captures: { e_seats: $.data.error_id }
            - call: "POST /on-demand-requests/${odem3}/match"
              payload: { trip_id: "${tem2}" }
              as: OpsPlanner
              captures: { e_early: $.data.error_id }
          assert:
            - "${e_ada_req} == 'ERR_ADA_VEHICLE_REQUIRED' with HTTP 422"
            - "${e_seats} == 'ERR_TRIP_SEATS_EXHAUSTED' with HTTP 409"
            - "${e_early} == 'ERR_TRIP_DEPARTURE_TOO_EARLY' with HTTP 422"
            - "GET /trips/${tem1} -> Trip.matched_party_seats == 2"
            - "GET /on-demand-requests?contract_id=${cem}&status=PENDING -> total_count == 3"

      - name: on_demand_request_outside_every_service_window_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=116]
          - errors[ERR_NO_ELIGIBLE_ROUTE]
          - calculations.on_demand_wait_estimate
        distinguishing_aspect: "A pickup minute of 500 falls outside the only PUBLISHED route's window of 420..456, so POST /on-demand-requests returns 422 ERR_NO_ELIGIBLE_ROUTE and no request row is created."
