# §1.9 Scaffold Corner Design — breadth probe.
#
# A row-by-row walk of references/claim-extraction-guide.md's nine sections
# against this scaffold's §1.1–§1.7 surface. Every `section:` value is one of the
# guide's nine sections and every `claim_type:` value is a row from that
# section's table. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# carry an `excluded_because:` stub instead of a `test_recipe`.
#
# Every `setup_api_calls` / `trigger` entry is a structured call object whose
# `call` resolves to a §1.5 endpoint, whose `payload` conforms to that
# endpoint's `input:`, and whose `${var}` placeholders are all bound by an
# earlier `captures:` block in the same instance.
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_growing_area_returns_the_full_entity_in_the_success_envelope
        claim_type: creation
        grounds:
          - entities.GrowingArea
          - endpoints[POST /shellfish/growing-areas]
          - response_envelope.success
        distinguishing_aspect: |
          A single POST with every declared input field returns HTTP 201 and a success envelope whose
          data block carries all 17 GrowingArea fields, with both status dimensions at their declared
          initial values and the four statistics fields at their empty-database values.
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock set explicitly to 2026-08-01T00:00:00Z (its pre-set value) so the read-back is deterministic."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
          trigger:
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
          assert:
            - "HTTP 201"
            - "meta.api_request_id and meta.api_request_timestamp are present and response_type == \"object\""
            - "data.code == \"GA-114\" and data.water_body == \"Pamlico Sound\""
            - "data.classification == APPROVED and data.harvest_status == OPEN (the two dimensions are independent and both start permissive)"
            - "data.rainfall_closure_threshold_in == 1.00, data.rainfall_closure_hours == 96, data.reopen_sample_count_required == 3, data.clean_sample_mpn_limit == 14.0, data.conditional_management_plan_on_file == false"
            - "data.accepted_sample_count == 0, data.consecutive_clean_samples == 0, data.open_authorization_count == 0"
            - "data.geometric_mean_mpn == null and data.p90_mpn == null and data.eligible_classification == INSUFFICIENT_DATA"
            - "data.last_closure_started_at == null and data.closure_reopen_eligible_at == null"
            - "data.id is a non-empty string and data.version == 1"

      - name: get_growing_area_returns_the_stored_configuration
        claim_type: retrieval
        grounds:
          - endpoints[GET /shellfish/growing-areas/{id}]
          - entities.GrowingArea.fields.rainfall_closure_hours
          - entities.GrowingArea.fields.conditional_management_plan_on_file
        distinguishing_aspect: |
          A GET by id returns exactly the non-default configuration that was posted (threshold 2.50,
          48 closure hours, 2 reopen samples, clean limit 10.0, plan on file) with version still 1,
          proving the read path is not re-deriving the configuration from constants.
        test_recipe:
          setup:
            - "One GrowingArea GA-220 created with a fully non-default configuration and a conditional management plan on file."
            - "No samples, no rainfall events, no leases."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-220", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 2.5, rainfall_closure_hours: 48, reopen_sample_count_required: 2, clean_sample_mpn_limit: 10.0, conditional_management_plan_on_file: true }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
          trigger:
            - call: "GET /shellfish/growing-areas/${area}"
              payload: {}
              as: ShellfishControlAuthority
          assert:
            - "HTTP 200 and response_type == \"object\""
            - "data.code == \"GA-220\" and data.rainfall_closure_threshold_in == 2.50"
            - "data.rainfall_closure_hours == 48 and data.reopen_sample_count_required == 2 and data.clean_sample_mpn_limit == 10.0"
            - "data.conditional_management_plan_on_file == true"
            - "data.classification == APPROVED and data.harvest_status == OPEN and data.version == 1"

      - name: list_growing_areas_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /shellfish/growing-areas]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three areas on file, limit=2 offset=0 returns 2 rows with total_count 3 and
          has_more true, and limit=2 offset=2 returns the remaining 1 row with has_more false —
          total_count counts the whole filtered set, not the page.
        test_recipe:
          setup:
            - "Three GrowingAreas GA-114, GA-115 and GA-116, all in water body Pamlico Sound, with default configuration."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { a1: $.data.id }
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-115", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { a2: $.data.id }
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-116", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { a3: $.data.id }
          trigger:
            - call: "GET /shellfish/growing-areas"
              payload: { limit: 2, offset: 0 }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas"
              payload: { limit: 2, offset: 2 }
              as: ShellfishControlAuthority
          assert:
            - "First call: HTTP 200, response_type == \"array\", 2 rows in data, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second call: 1 row in data, total_count == 3, has_more == false, offset == 2"
            - "The union of the two pages is exactly the codes {GA-114, GA-115, GA-116} with no row repeated across pages"

      - name: unknown_ids_return_the_matching_not_found_error
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_GROWOUT_UNIT_NOT_FOUND]
          - errors[ERR_GROWING_AREA_NOT_FOUND]
          - errors[ERR_VIBRIO_PLAN_NOT_FOUND]
        distinguishing_aspect: |
          Priority 3 fires for an unknown id in the PATH and for an unknown id in a request BODY, and
          each addressed entity has its own error_id: the same non-existent uuid produces
          ERR_GROWOUT_UNIT_NOT_FOUND, ERR_GROWING_AREA_NOT_FOUND and ERR_VIBRIO_PLAN_NOT_FOUND
          depending on which reference it stands in for.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock call."
            - "The uuid 00000000-0000-0000-0000-000000000000 is never minted by the server."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
          trigger:
            - call: "GET /shellfish/growout-units/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/leases"
              payload: { growing_area_id: "00000000-0000-0000-0000-000000000000", lease_code: "L-2988-99", requested_acreage: 5.0, plot_codes: ["P1"], gear_types_permitted: ["BOTTOM"], authorized_gear_units: 10 }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "GET /shellfish/vibrio-control-plans/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShellfishControlAuthority
          assert:
            - "First call: HTTP 404 with data.error_id == ERR_GROWOUT_UNIT_NOT_FOUND"
            - "Second call: HTTP 404 with data.error_id == ERR_GROWING_AREA_NOT_FOUND and no Lease row is created"
            - "Third call: HTTP 404 with data.error_id == ERR_VIBRIO_PLAN_NOT_FOUND"
            - "Every error body carries data.error_id and data.message with response_type == \"error\""

      - name: create_lease_missing_required_authorized_gear_units_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /shellfish/leases]
        distinguishing_aspect: |
          authorized_gear_units is a required input on POST /shellfish/leases (no default is declared
          for it, unlike the growing-area configuration fields), so omitting it is ERR_INVALID_REQUEST
          at priority 5 and no DRAFT lease is persisted.
        test_recipe:
          setup:
            - "One GrowingArea GA-114 with default configuration."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
          trigger:
            - call: "POST /shellfish/leases"
              payload: { growing_area_id: "${area}", lease_code: "L-2988-01", requested_acreage: 5.0, plot_codes: ["P1", "P2", "P3"], gear_types_permitted: ["BOTTOM"] }
              as: FarmOperator
              as_user_id: "op-1"
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /shellfish/leases?growing_area_id=${area} returns total_count == 0"

      - name: create_growing_area_without_optional_config_applies_the_declared_defaults
        claim_type: defaults
        grounds:
          - entities.GrowingArea.fields.rainfall_closure_threshold_in
          - entities.GrowingArea.fields.rainfall_closure_hours
          - entities.GrowingArea.fields.reopen_sample_count_required
          - entities.GrowingArea.fields.clean_sample_mpn_limit
          - entities.GrowingArea.fields.conditional_management_plan_on_file
        distinguishing_aspect: |
          Omitting all five optional configuration fields yields exactly the five declared defaults
          (1.00 in, 96 h, 3 samples, 14.0 MPN, plan flag false) rather than nulls, and the defaulted
          14.0 clean limit is the same number the classification tier uses — the defaults are applied
          at creation, not at read time.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock call."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
          trigger:
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-301", water_body: "Core Sound" }
              as: ShellfishControlAuthority
          assert:
            - "HTTP 201"
            - "data.rainfall_closure_threshold_in == 1.00"
            - "data.rainfall_closure_hours == 96"
            - "data.reopen_sample_count_required == 3"
            - "data.clean_sample_mpn_limit == 14.0"
            - "data.conditional_management_plan_on_file == false"
            - "data.classification == APPROVED and data.harvest_status == OPEN"

      - name: list_water_samples_without_pagination_params_applies_limit_ten_offset_zero
        claim_type: defaults
        grounds:
          - response_envelope.pagination_defaults
          - endpoints[GET /shellfish/growing-areas/{id}/water-samples]
          - calculations.area_water_quality_statistics
        distinguishing_aspect: |
          Twelve ACCEPTED samples with no limit/offset supplied return exactly 10 rows with
          total_count 12 and has_more true, i.e. the declared defaults {limit: 10, offset: 0} are
          applied by the endpoint rather than the whole collection being returned.
        test_recipe:
          setup:
            - "GrowingArea GA-114 with default configuration."
            - "Twelve WaterSamples at station ST-1, fecal_coliform_mpn 2 each, collected 2026-07-01 through 2026-07-12 at 09:00:00Z (one per calendar date, so none supersedes another)."
            - "The recomputed SYSTEMATIC_RANDOM geometric_mean_mpn is 2.0, which is not greater than GEOMEAN_APPROVED_LIMIT 14.0, so the sample sweep never fires and the area stays APPROVED and OPEN."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-01T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-02T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-03T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-04T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-05T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-06T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-07T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-08T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-09T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-10T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-11T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-12T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
          trigger:
            - call: "GET /shellfish/growing-areas/${area}/water-samples"
              payload: {}
              as: ShellfishControlAuthority
          assert:
            - "HTTP 200 with response_type == \"array\""
            - "data contains exactly 10 rows"
            - "total_count == 12, has_more == true, limit == 10, offset == 0"
            - "Rows are ordered newest collected_at first, so the first row is the 2026-07-12T09:00:00Z sample"
            - "GET /shellfish/growing-areas/${area} still reports classification == APPROVED, harvest_status == OPEN, accepted_sample_count == 12 and geometric_mean_mpn == 2.0"

      - name: lease_and_seed_lot_counters_are_recomputed_from_the_deployment
        claim_type: computed_fields
        grounds:
          - calculations.lease_gear_utilisation
          - calculations.seed_lot_allocation_and_survival
          - calculations.growout_husbandry_currency
          - entities.Lease.fields.deployed_gear_units
          - entities.SeedLot.fields.unallocated_seed_count
        distinguishing_aspect: |
          Every computed field on the three entities touched by one deployment is derived, not
          supplied: Lease.deployed_gear_units becomes 40, SeedLot.allocated/unallocated become
          25000/35000 against surviving 60000, and the new unit's husbandry_current is false because
          no HusbandryLog exists yet.
        test_recipe:
          setup:
            - "GrowingArea GA-114 APPROVED; APPROVED Lease L-2988-01 held by op-1 with plots P1..P3, BOTTOM and RACK_AND_BAG gear and authorized_gear_units 200."
            - "SeedLot READY_FOR_PLANTING with received_seed_count 100000 and surviving_seed_count 60000, so survival_rate_pct is 60.00 and unallocated_seed_count is 60000."
            - "No GrowoutUnit and no HusbandryLog exist yet, so Lease.deployed_gear_units is 0."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/hatcheries"
              payload: { name: "Sound Hatchery", state_code: "NC", ncsp_certificate_no: "NCSP-77", certificate_expires_on: "2027-03-31", pathogen_free_species: ["CRASSOSTREA_VIRGINICA"] }
              as: ShellfishControlAuthority
              captures: { hatchery: $.data.id }
            - call: "POST /shellfish/leases"
              payload: { growing_area_id: "${area}", lease_code: "L-2988-01", requested_acreage: 5.0, plot_codes: ["P1", "P2", "P3"], gear_types_permitted: ["BOTTOM", "RACK_AND_BAG"], authorized_gear_units: 200 }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { lease: $.data.id }
            - call: "POST /shellfish/leases/${lease}/submit"
              payload: { submission_note: "initial siting package" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/leases/${lease}/navigation-review"
              payload: { decision: "CLEARED", review_note: "outside the marked channel" }
              as: SitingReviewer
              as_user_id: "rev-nav-1"
            - call: "POST /shellfish/leases/${lease}/environmental-review"
              payload: { decision: "CLEARED", review_note: "no SAV impact" }
              as: SitingReviewer
              as_user_id: "rev-env-1"
            - call: "POST /shellfish/leases/${lease}/decision"
              payload: { decision: "APPROVE", rent_paid_through_date: "2026-12-31", decision_note: "granted" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/seed-lots"
              payload: { hatchery_id: "${hatchery}", lease_id: "${lease}", species: "CRASSOSTREA_VIRGINICA", received_seed_count: 100000, disease_certificate_no: "DC-9001", disease_cert_issued_on: "2026-03-15", shipped_on: "2026-04-01" }
              as: HatcheryOperator
              as_user_id: "${hatchery}"
              captures: { seed: $.data.id }
            - call: "POST /shellfish/seed-lots/${seed}/screening"
              payload: { result: "NEGATIVE", screened_on: "2026-04-03" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/seed-lots/${seed}/nursery-start"
              payload: { nursery_started_on: "2026-04-05", nursery_system: "UPWELLER" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/seed-lots/${seed}/nursery-complete"
              payload: { nursery_completed_on: "2026-05-01", surviving_seed_count: 60000 }
              as: FarmOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /shellfish/growout-units"
              payload: { lease_id: "${lease}", seed_lot_id: "${seed}", plot_code: "P1", gear_type: "BOTTOM", gear_units: 40, seed_count_planted: 25000, deployed_on: "2026-05-05", planned_retrieval_on: "2026-10-15" }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { unit: $.data.id }
          assert:
            - "HTTP 201 with data.status == DEPLOYED and data.retrieved_on == null and data.void_reason == null"
            - "data.husbandry_current == false, data.last_inspection_at == null, data.last_predator_control_at == null, data.mortality_count_total == 0"
            - "GET /shellfish/leases/${lease} reports deployed_gear_units == 40 and royalty_accrued_cents == 0"
            - "GET /shellfish/seed-lots/${seed} reports allocated_seed_count == 25000, unallocated_seed_count == 35000, survival_rate_pct == 60.00 and status == READY_FOR_PLANTING"

      - name: husbandry_log_stamps_the_acting_operator_id
        claim_type: system_fields
        grounds:
          - entities.HusbandryLog.fields.performed_by_user_id
          - entities.GrowoutUnit.fields.last_inspection_at
          - entities.GrowoutUnit.fields.mortality_count_total
          - calculations.growout_husbandry_currency
        distinguishing_aspect: |
          performed_by_user_id is never in the request body — it is stamped from the acting X-User-ID
          header ("op-1") — and the log immediately moves the unit's derived fields
          (last_inspection_at, mortality_count_total 3) while leaving husbandry_current false because
          BOTTOM gear still owes a PREDATOR_CONTROL log.
        test_recipe:
          setup:
            - "GrowingArea GA-114 APPROVED; APPROVED Lease L-2988-01 held by op-1; SeedLot READY_FOR_PLANTING with 60000 survivors."
            - "One BOTTOM GrowoutUnit on plot P1 with gear_units 40 and seed_count_planted 25000, no husbandry logs."
            - "Logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
