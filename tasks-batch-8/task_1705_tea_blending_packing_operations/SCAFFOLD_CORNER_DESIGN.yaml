# =============================================================================
# §1.9 Scaffold Corner Design — Tea Blending & Packing Operations
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by
# §1.8. Sections follow references/claim-extraction-guide.md.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:

  # ----------------------------------------------------------- entities ----
  - section: entities
    instances:
      - name: supplier_create_defaults
        claim_type: creation_defaults
        grounds:
          - "entities.Supplier"
        distinguishing_aspect: "POST /suppliers returns 201 with status ACTIVE, version 1, server-minted id, created_at/updated_at stamped."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Hill Co", origin_region: "Munnar" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id, st: $.data.status, v: $.data.version } }
          assert:
            - "${st} == ACTIVE (default applied)"
            - "${v} == 1"
            - "response carries meta.api_request_id and response_type == object"

      - name: leaf_lot_missing_required_weight_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.LeafLot"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required input weight_kg yields 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["supplier exists"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Req Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
          trigger:
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /tea-ops/leaf-lots returns total_count == 0"

      - name: leaf_lot_computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.LeafLot.fields.remaining_weight_kg"
          - "entities.LeafLot.fields.status"
        distinguishing_aspect: "Client-supplied remaining_weight_kg and status in the create payload are ignored: remaining equals weight_kg and status starts REGISTERED."
        test_recipe:
          setup: ["supplier exists"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Ign Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
          trigger:
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 25.0, cost_per_kg_cents: 900, moisture_pct: 5.0, remaining_weight_kg: 999.0, status: "RELEASED" }, as: ProcurementLead, as_user_id: "pl-1", captures: { rem: $.data.remaining_weight_kg, st: $.data.status } }
          assert:
            - "${rem} == 25.0 (server-computed, input ignored)"
            - "${st} == REGISTERED (input status ignored)"

      - name: batch_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "response_envelope"
        distinguishing_aspect: "GET on a well-formed but unknown batch id returns 404 with the error envelope (data.error_id + data.message)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /tea-ops/batches/11111111-2222-4333-8444-555555555555", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 and ${err} == ERR_NOT_FOUND"
            - "error envelope contains data.message and meta.api_request_id"

      - name: create_lot_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.LeafLot.fields.leaf_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "leaf_type 'PUERH' is outside the declared enum and is rejected with 400."
        test_recipe:
          setup: ["supplier exists"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Enum Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
          trigger:
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "PUERH", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: grade_assessment_immutable_shape
        claim_type: immutability
        grounds:
          - "entities.GradeAssessment"
        distinguishing_aspect: "GradeAssessment has common_fields: false — its response carries id and created_at but no version and no updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["supplier + REGISTERED lot"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Imm Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
          trigger:
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 90, briskness_score: 88, appearance_score: 92 }, as: SensoryGrader, as_user_id: "gr-1", captures: { ga: $.data.id } }
          assert:
            - "GradeAssessment response has id and created_at but neither version nor updated_at keys"
            - "no PUT/PATCH/DELETE endpoint exists for grade-assessments in §1.5"

      - name: lot_fk_unknown_supplier_returns_not_found
        claim_type: parent_relationships
        grounds:
          - "entities.LeafLot.fields.supplier_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Creating a lot with a non-existent supplier_id fails existence validation with 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "11111111-2222-4333-8444-555555555555", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: lot_list_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
          - "entities.LeafLot"
        distinguishing_aspect: "GET /leaf-lots honors limit/offset and reports total_count and has_more correctly across pages."
        test_recipe:
          setup: ["supplier with 3 lots"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Page Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1" }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2026-02-02", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1" }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "OOLONG", harvest_date: "2026-02-03", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1" }
          trigger:
            - { call: "GET /tea-ops/leaf-lots?limit=2&offset=0", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "GET /tea-ops/leaf-lots?limit=2&offset=2", payload: {}, as: QAManager, as_user_id: "qa-1" }
          assert:
            - "page 1: total_count == 3, has_more == true, exactly 2 rows"
            - "page 2: total_count == 3, has_more == false, exactly 1 row"

  # ------------------------------------------------------ state_machines ----
  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds:
          - "state_machines.LeafLot"
          - "state_machines.BlendRecipe"
          - "state_machines.BlendBatch"
          - "state_machines.PackagingLine"
          - "state_machines.PrivateLabelContract"
          - "state_machines.CertificateGrant"
          - "state_machines.Flavoring"
        distinguishing_aspect: "Every entity lands in its declared initial_state at creation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Init Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id, sup_st: $.data.status } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot_st: $.data.status } }
            - { call: "POST /tea-ops/flavorings", payload: { name: "Lemon", allergen_tags: [], natural_certified: true, cost_per_kg_cents: 2000 }, as: BlendMaster, as_user_id: "bm-1", captures: { f_st: $.data.status } }
            - { call: "POST /tea-ops/recipes", payload: { name: "RI", certification_target: "CONVENTIONAL", pack_format: "LOOSE_PACK", components: [{ leaf_type: "BLACK", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r: $.data.id, r_st: $.data.status } }
            - { call: "POST /tea-ops/recipes/${r}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r}", target_weight_kg: 10.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b_st: $.data.status } }
            - { call: "POST /tea-ops/packaging-lines", payload: { name: "LP-I", line_type: "LOOSE_PACK" }, as: ProductionPlanner, as_user_id: "pp-1", captures: { ln_st: $.data.status } }
            - { call: "POST /tea-ops/contracts", payload: { customer_name: "Init Mart", recipe_id: "${r}", minimum_units_per_run: 100, contracted_total_units: 1000, base_unit_price_cents: 150 }, as: AccountManager, as_user_id: "am-1", captures: { c_st: $.data.status } }
            - { call: "POST /tea-ops/certificates", payload: { supplier_id: "${sup}", cert_type: "ORGANIC", total_volume_kg: 100.0, valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: CertificationOfficer, as_user_id: "co-1", captures: { cert_st: $.data.status } }
          assert:
            - "supplier ${sup_st} == ACTIVE; lot ${lot_st} == REGISTERED; flavoring ${f_st} == ACTIVE"
            - "recipe ${r_st} == DRAFT; batch ${b_st} == DRAFT; line ${ln_st} == ACTIVE; contract ${c_st} == DRAFT; cert ${cert_st} == ACTIVE"

      - name: release_from_graded_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.LeafLot.LAB_SUBMITTED_to_RELEASED"
          - "errors[ERR_LOT_NOT_RELEASABLE]"
        distinguishing_aspect: "Releasing a lot that is GRADED (no residue test yet) fails with ERR_LOT_NOT_RELEASABLE; no state change occurs."
        test_recipe:
          setup: ["supplier + lot graded B, status GRADED"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Inv Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
          trigger:
            - { call: "POST /tea-ops/leaf-lots/${lot}/release", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { err: $.data.error_id } }
            - { call: "GET /tea-ops/leaf-lots/${lot}", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_LOT_NOT_RELEASABLE"
            - "lot remains ${st} == GRADED (no partial side effects)"

      - name: terminal_lot_rejects_grading
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.LeafLot"
          - "errors[ERR_ALREADY_TERMINAL]"
        distinguishing_aspect: "A REJECTED lot (grade REJECT) refuses any further grading with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["supplier + lot graded with failing scores (50/50/50 -> 50.0 -> REJECT)"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Term Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 50, briskness_score: 50, appearance_score: 50 }, as: SensoryGrader, as_user_id: "gr-1" }
          trigger:
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 90, briskness_score: 90, appearance_score: 90 }, as: SensoryGrader, as_user_id: "gr-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ALREADY_TERMINAL"
            - "GET /tea-ops/leaf-lots/${lot}/grade-assessments still returns total_count == 1"

      - name: hard_fail_residue_auto_rejects_lot
        claim_type: side_effect_execution
        grounds:
          - "state_machines.LeafLot.GRADED_to_REJECTED"
          - "calculations.residue_verdict_threshold"
        distinguishing_aspect: "A residue reading of 1.01 ppm (> 2.0 x 0.50 limit) auto-transitions the lot to REJECTED with verdict FAIL_HARD — no human decision step."
        test_recipe:
          setup: ["supplier + lot graded B"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Hard Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
          trigger:
            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 1.01, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1", captures: { v: $.data.verdict, tr: $.data.test_round } }
            - { call: "GET /tea-ops/leaf-lots/${lot}", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { st: $.data.status } }
          assert:
            - "${v} == FAIL_HARD and ${tr} == 1"
            - "lot auto-transitioned: ${st} == REJECTED"

      - name: recipe_retire_cascades_to_locked_batch
        claim_type: conditional_cascade
        grounds:
          - "state_machines.BlendRecipe.ACTIVE_to_RETIRED"
          - "state_machines.BlendBatch.RECIPE_LOCKED_to_CANCELLED"
        distinguishing_aspect: "Retiring a recipe cancels its DRAFT/RECIPE_LOCKED batches AND releases their allocations back to lot remaining_weight_kg; batches past RECIPE_LOCKED are untouched."
        test_recipe:
          setup:
            - "supplier; lot BLACK 30.0 kg RELEASED; recipe ACTIVE; batch target 20.0 RECIPE_LOCKED with a 20.0 kg allocation (lot remaining 10.0)"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Retire Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 30.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "RR", certification_target: "CONVENTIONAL", pack_format: "TEA_BAG", components: [{ leaf_type: "BLACK", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${lot}", allocated_kg: 20.0, expected_batch_version: "${bv}" }, as: BlendMaster, as_user_id: "bm-1" }
          trigger:
            - { call: "POST /tea-ops/recipes/${r}/retire", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { r_st: $.data.status } }
            - { call: "GET /tea-ops/batches/${b}", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { b_st: $.data.status } }
            - { call: "GET /tea-ops/leaf-lots/${lot}", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { rem: $.data.remaining_weight_kg } }
          assert:
            - "recipe ${r_st} == RETIRED"
            - "batch cascaded: ${b_st} == CANCELLED"
            - "compensation: lot remaining_weight_kg restored ${rem} == 30.0 (allocation RELEASED)"

      - name: supplier_suspend_skips_terminal_lots
        claim_type: conditional_cascade
        grounds:
          - "state_machines.Supplier.ACTIVE_to_SUSPENDED"
        distinguishing_aspect: "The supplier-suspend cascade holds only lots in {GRADED, LAB_SUBMITTED, RELEASED}; a REJECTED lot of the same supplier stays REJECTED."
        test_recipe:
          setup: ["supplier with lotA REJECTED (grade fail) and lotB RELEASED"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Cond Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { la: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${la}/grade-assessments", payload: { aroma_score: 50, briskness_score: 50, appearance_score: 50 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-02", weight_kg: 10.0, cost_per_kg_cents: 900, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lb: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lb}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lb}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lb}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /tea-ops/suppliers/${sup}/suspend", payload: {}, as: ProcurementLead, as_user_id: "pl-1" }
            - { call: "GET /tea-ops/leaf-lots/${la}", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { sta: $.data.status } }
            - { call: "GET /tea-ops/leaf-lots/${lb}", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { stb: $.data.status } }
          assert:
            - "REJECTED lot untouched: ${sta} == REJECTED"
            - "RELEASED lot held: ${stb} == ON_HOLD"

      - name: certificate_expiry_on_clock_sweep
        claim_type: valid_transition
        grounds:
          - "state_machines.CertificateGrant.ACTIVE_to_EXPIRED"
          - "endpoints.clock_set_current_utc"
        distinguishing_aspect: "Advancing the logical clock past valid_until sweeps the grant ACTIVE -> EXPIRED; the default clock before any set call is exactly 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["supplier; ORGANIC grant valid 2026-01-01..2026-08-10 (ACTIVE under the default clock)"]
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Exp Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/certificates", payload: { supplier_id: "${sup}", cert_type: "ORGANIC", total_volume_kg: 100.0, valid_from: "2026-01-01", valid_until: "2026-08-10" }, as: CertificationOfficer, as_user_id: "co-1", captures: { cert: $.data.id, st1: $.data.status } }
          trigger:
