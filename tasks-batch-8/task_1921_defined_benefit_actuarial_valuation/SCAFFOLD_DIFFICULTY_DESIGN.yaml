scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: asset_value_smoothed_vs_market_for_pbgc
        grounds:
          - calculations.asset_smoothing_corridor
          - calculations.pbgc_premium
          - entities.AssetValuation.fields.smoothed_value
          - entities.PBGCFiling.fields.market_assets
        distinguishing_aspect: |
          Same asset statement feeds two entity domains: the AssetValuation
          corridor-smooths the loss year to 60,000.00 for funding, while the
          PBGCFiling's UVB must use the unsmoothed market value 50,000.00 —
          identical inputs, two valid algorithms, different numbers.
        test_recipe:
          setup:
            - "Plan 2028 (accrual_rate 0.01, NRA 62, prior_aftap 84.00) exists"
            - "Census with 1 RETIREE age 63, current_annual_benefit 100000 -> LOCKED"
            - "Assumption set (5% funding / 4% disclosure) LOCKED"
            - "AssetStatement with a loss year: mv_begin 100000, return -50000 -> market 50000"
            - "AssetValuation computed: gain -55000, unrecognized -36666.67, pre-corridor 86666.67, ceiling 60000 -> smoothed 60000.00 (CEILING)"
            - "Valuation run COMPUTED and CERTIFIED (funding_target 100000.00)"
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { sponsor_name: "Loss Co", plan_year: 2028, accrual_rate: 0.01, normal_retirement_age: 62, prior_aftap_pct: 84.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /v1/actuaries"
              payload: { full_name: "Prep Act", credential_id: "EA-1", enrollment_status: "ENROLLED" }
              as: FirmAdmin
              captures: { act_prep: "$.data.id" }
            - call: "POST /v1/actuaries"
              payload: { full_name: "Rev Act", credential_id: "EA-2", enrollment_status: "ENROLLED" }
              as: FirmAdmin
              captures: { act_rev: "$.data.id" }
            - call: "POST /v1/plans/${plan_id}/census-batches"
              payload: { plan_year: 2028, source_label: "census-1" }
              as: PlanAdmin
              captures: { batch_id: "$.data.id" }
            - call: "POST /v1/census-batches/${batch_id}/participants"
              payload:
                participants:
                  - { external_ref: "R1", date_of_birth: "1965-06-15", status: "RETIREE", current_annual_benefit: 100000 }
              as: PlanAdmin
            - call: "POST /v1/census-batches/${batch_id}/submit-screening"
              payload: {}
              as: PlanAdmin
            - call: "POST /v1/census-batches/${batch_id}/lock"
              payload: {}
              as: PlanAdmin
            - call: "POST /v1/plans/${plan_id}/assumption-sets"
              payload: { plan_year: 2028, label: "base", mortality_table: "TEST_TABLE_4AGE", funding_discount_rate: 0.05, disclosure_discount_rate: 0.04, retirement_age: 62 }
              as: Actuary
              as_user_id: "${act_prep}"
              captures: { aset_id: "$.data.id" }
            - call: "POST /v1/assumption-sets/${aset_id}/submit"
              payload: {}
              as: Actuary
              as_user_id: "${act_prep}"
            - call: "POST /v1/assumption-sets/${aset_id}/approve"
              payload: {}
              as: SeniorActuary
              as_user_id: "${act_rev}"
            - call: "POST /v1/assumption-sets/${aset_id}/lock"
              payload: {}
              as: SeniorActuary
              as_user_id: "${act_rev}"
            - call: "POST /v1/plans/${plan_id}/asset-statements"
              payload: { plan_year: 2028, market_value_begin: 100000, contributions_received: 0, benefits_paid: 0, investment_return: -50000 }
              as: PlanAdmin
            - call: "POST /v1/plans/${plan_id}/asset-valuations"
              payload: { plan_year: 2028 }
              as: Actuary
              as_user_id: "${act_prep}"
              captures: { ava_id: "$.data.id", ava_smoothed: "$.data.smoothed_value" }
            - call: "POST /v1/plans/${plan_id}/valuation-runs"
              payload: { plan_year: 2028, census_batch_id: "${batch_id}", assumption_set_id: "${aset_id}", asset_valuation_id: "${ava_id}" }
              as: Actuary
              as_user_id: "${act_prep}"
              captures: { run_id: "$.data.id" }
            - call: "POST /v1/valuation-runs/${run_id}/compute"
              payload: {}
              as: Actuary
              as_user_id: "${act_prep}"
            - call: "GET /v1/plans/${plan_id}"
              payload: {}
              as: PlanAdmin
              captures: { plan_v: "$.data.version" }
            - call: "POST /v1/valuation-runs/${run_id}/certify"
              payload: { expected_plan_version: "${plan_v}" }
              as: SeniorActuary
              as_user_id: "${act_rev}"
          trigger:
            - call: "POST /v1/plans/${plan_id}/pbgc-filings"
              payload: { valuation_run_id: "${run_id}", premium_method: "STANDARD" }
              as: PlanAdmin
              captures: { filing_id: "$.data.id" }
          assert:
            - "AssetValuation.${ava_id}.smoothed_value == 60000.00 (corridor CEILING clamped 86666.67 to 1.20 x 50000)"
            - "AssetValuation.${ava_id}.market_value == 50000.00"
            - "PBGCFiling.${filing_id}.market_assets == 50000.00 (PBGC uses market, not the 60000.00 smoothed funding value)"
            - "PBGCFiling.${filing_id}.uvb == 50000.00 (100000.00 target - 50000.00 market)"
            - "PBGCFiling.${filing_id}.variable_rate_premium == 600.00 (min(2500.00, 1 x 600 cap) — cap binds)"

      - name: funding_vs_disclosure_discount_basis
        grounds:
          - calculations.disclosure_funded_status
          - calculations.participant_accrual_liability
          - entities.DisclosureReport.fields.pbo
          - entities.ValuationRun.fields.funding_target
        distinguishing_aspect: |
          Same LOCKED census is valued twice on different entity domains:
          ValuationRun.funding_target at the 5% funding discount rate is
          67,172.20, while DisclosureReport.pbo at the 4% disclosure rate is
          67,272.20 — the discount-basis variant changes every annuity factor.
        test_recipe:
          setup:
            - "Plan 2028 with three participants: ACTIVE age 62 yos 10 comp 100000; ACTIVE age 60 yos 5 comp 60000; RETIREE age 63 benefit 50000"
            - "Asset statement mv_begin 60000, benefits 2000, return 3000 (gain 0) -> market and smoothed both 61000.00"
            - "Run certified: funding_target 67172.20, normal_cost 1958.24"
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { sponsor_name: "Dual Basis Co", plan_year: 2028, accrual_rate: 0.01, normal_retirement_age: 62, prior_aftap_pct: 84.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /v1/actuaries"
              payload: { full_name: "Prep Act", credential_id: "EA-1", enrollment_status: "ENROLLED" }
              as: FirmAdmin
              captures: { act_prep: "$.data.id" }
            - call: "POST /v1/actuaries"
              payload: { full_name: "Rev Act", credential_id: "EA-2", enrollment_status: "ENROLLED" }
              as: FirmAdmin
              captures: { act_rev: "$.data.id" }
            - call: "POST /v1/plans/${plan_id}/census-batches"
              payload: { plan_year: 2028, source_label: "census-1" }
              as: PlanAdmin
              captures: { batch_id: "$.data.id" }
            - call: "POST /v1/census-batches/${batch_id}/participants"
              payload:
                participants:
                  - { external_ref: "A1", date_of_birth: "1966-03-10", status: "ACTIVE", years_of_service: 10, annual_compensation: 100000 }
                  - { external_ref: "A2", date_of_birth: "1968-11-20", status: "ACTIVE", years_of_service: 5, annual_compensation: 60000 }
                  - { external_ref: "R1", date_of_birth: "1965-01-30", status: "RETIREE", current_annual_benefit: 50000 }
              as: PlanAdmin
            - call: "POST /v1/census-batches/${batch_id}/submit-screening"
              payload: {}
              as: PlanAdmin
            - call: "POST /v1/census-batches/${batch_id}/lock"
              payload: {}
              as: PlanAdmin
            - call: "POST /v1/plans/${plan_id}/assumption-sets"
              payload: { plan_year: 2028, label: "base", mortality_table: "TEST_TABLE_4AGE", funding_discount_rate: 0.05, disclosure_discount_rate: 0.04, retirement_age: 62 }
              as: Actuary
              as_user_id: "${act_prep}"
              captures: { aset_id: "$.data.id" }
            - call: "POST /v1/assumption-sets/${aset_id}/submit"
              payload: {}
              as: Actuary
              as_user_id: "${act_prep}"
            - call: "POST /v1/assumption-sets/${aset_id}/approve"
              payload: {}
              as: SeniorActuary
              as_user_id: "${act_rev}"
            - call: "POST /v1/assumption-sets/${aset_id}/lock"
              payload: {}
              as: SeniorActuary
              as_user_id: "${act_rev}"
            - call: "POST /v1/plans/${plan_id}/asset-statements"
              payload: { plan_year: 2028, market_value_begin: 60000, contributions_received: 0, benefits_paid: 2000, investment_return: 3000 }
              as: PlanAdmin
            - call: "POST /v1/plans/${plan_id}/asset-valuations"
              payload: { plan_year: 2028 }
              as: Actuary
              as_user_id: "${act_prep}"
              captures: { ava_id: "$.data.id" }
            - call: "POST /v1/plans/${plan_id}/valuation-runs"
              payload: { plan_year: 2028, census_batch_id: "${batch_id}", assumption_set_id: "${aset_id}", asset_valuation_id: "${ava_id}" }
              as: Actuary
              as_user_id: "${act_prep}"
              captures: { run_id: "$.data.id" }
            - call: "POST /v1/valuation-runs/${run_id}/compute"
              payload: {}
              as: Actuary
              as_user_id: "${act_prep}"
            - call: "GET /v1/plans/${plan_id}"
              payload: {}
              as: PlanAdmin
              captures: { plan_v: "$.data.version" }
            - call: "POST /v1/valuation-runs/${run_id}/certify"
              payload: { expected_plan_version: "${plan_v}" }
              as: SeniorActuary
              as_user_id: "${act_rev}"
          trigger:
            - call: "POST /v1/plans/${plan_id}/disclosure-reports"
              payload: { valuation_run_id: "${run_id}" }
              as: PlanAdmin
              captures: { rep_id: "$.data.id" }
          assert:
            - "ValuationRun.${run_id}.funding_target == 67172.20 (5% basis: 14762.00 + 2410.20 + 50000.00)"
            - "ValuationRun.${run_id}.normal_cost == 1958.24 (1476.20 + 482.04; RETIREE contributes 0.00)"
            - "DisclosureReport.${rep_id}.pbo == 67272.20 (4% basis: 14808.00 + 2464.20 + 50000.00)"
            - "DisclosureReport.${rep_id}.fair_value_assets == 61000.00 (market, unsmoothed)"
            - "DisclosureReport.${rep_id}.funded_status == -6272.20"
            - "DisclosureReport.${rep_id}.pbo != ValuationRun.${run_id}.funding_target"

  # ===================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pbgc_premium_min_cap_branch_switch
        grounds:
          - calculations.pbgc_premium
          - entities.PBGCFiling.fields.cap_applied
        distinguishing_aspect: |
          Mode (a): the premium formula combines participant_count, UVB and the
          per-participant cap through a nested min(); two filings with different
          census counts land on different branches of the min — one uncapped
          (608.61 total), one cap-bound (2100.00 total).
        test_recipe:
          setup:
            - "Plan A (Family A): 3 participants, funding_target 67172.20, market assets 61000.00 -> UVB 6172.20 -> variable 308.61 < cap 1800 (uncapped branch)"
            - "Plan B (cap probe): 3 participants but retiree-dominated FT 100000.00, market assets 64000.00 -> UVB 36000.00 -> variable 1800.00 >= cap 1800 (cap branch)"
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { sponsor_name: "Uncapped Co", plan_year: 2028, accrual_rate: 0.01, normal_retirement_age: 62, prior_aftap_pct: 84.00 }
              as: PlanAdmin
              captures: { plan_a: "$.data.id" }
            - call: "POST /v1/actuaries"
              payload: { full_name: "Prep Act", credential_id: "EA-1", enrollment_status: "ENROLLED" }
              as: FirmAdmin
              captures: { act_prep: "$.data.id" }
            - call: "POST /v1/actuaries"
              payload: { full_name: "Rev Act", credential_id: "EA-2", enrollment_status: "ENROLLED" }
              as: FirmAdmin
              captures: { act_rev: "$.data.id" }
            - call: "POST /v1/plans/${plan_a}/census-batches"
              payload: { plan_year: 2028, source_label: "census-a" }
              as: PlanAdmin
              captures: { batch_a: "$.data.id" }
            - call: "POST /v1/census-batches/${batch_a}/participants"
              payload:
                participants:
                  - { external_ref: "A1", date_of_birth: "1966-03-10", status: "ACTIVE", years_of_service: 10, annual_compensation: 100000 }
                  - { external_ref: "A2", date_of_birth: "1968-11-20", status: "ACTIVE", years_of_service: 5, annual_compensation: 60000 }
                  - { external_ref: "R1", date_of_birth: "1965-01-30", status: "RETIREE", current_annual_benefit: 50000 }
              as: PlanAdmin
            - call: "POST /v1/census-batches/${batch_a}/submit-screening"
              payload: {}
              as: PlanAdmin
            - call: "POST /v1/census-batches/${batch_a}/lock"
              payload: {}
              as: PlanAdmin
            - call: "POST /v1/plans/${plan_a}/assumption-sets"
              payload: { plan_year: 2028, label: "base", mortality_table: "TEST_TABLE_4AGE", funding_discount_rate: 0.05, disclosure_discount_rate: 0.04, retirement_age: 62 }
              as: Actuary
              as_user_id: "${act_prep}"
              captures: { aset_a: "$.data.id" }
            - call: "POST /v1/assumption-sets/${aset_a}/submit"
              payload: {}
              as: Actuary
              as_user_id: "${act_prep}"
            - call: "POST /v1/assumption-sets/${aset_a}/approve"
              payload: {}
              as: SeniorActuary
              as_user_id: "${act_rev}"
            - call: "POST /v1/assumption-sets/${aset_a}/lock"
              payload: {}
              as: SeniorActuary
              as_user_id: "${act_rev}"
            - call: "POST /v1/plans/${plan_a}/asset-statements"
              payload: { plan_year: 2028, market_value_begin: 60000, contributions_received: 0, benefits_paid: 2000, investment_return: 3000 }
              as: PlanAdmin
            - call: "POST /v1/plans/${plan_a}/asset-valuations"
              payload: { plan_year: 2028 }
              as: Actuary
              as_user_id: "${act_prep}"
              captures: { ava_a: "$.data.id" }
            - call: "POST /v1/plans/${plan_a}/valuation-runs"
              payload: { plan_year: 2028, census_batch_id: "${batch_a}", assumption_set_id: "${aset_a}", asset_valuation_id: "${ava_a}" }
              as: Actuary
              as_user_id: "${act_prep}"
              captures: { run_a: "$.data.id" }
            - call: "POST /v1/valuation-runs/${run_a}/compute"
              payload: {}
              as: Actuary
              as_user_id: "${act_prep}"
            - call: "GET /v1/plans/${plan_a}"
              payload: {}
              as: PlanAdmin
              captures: { plan_a_v: "$.data.version" }
            - call: "POST /v1/valuation-runs/${run_a}/certify"
              payload: { expected_plan_version: "${plan_a_v}" }
              as: SeniorActuary
              as_user_id: "${act_rev}"
            - call: "POST /v1/plans"
              payload: { sponsor_name: "Capped Co", plan_year: 2028, accrual_rate: 0.01, normal_retirement_age: 62, prior_aftap_pct: 84.00 }
