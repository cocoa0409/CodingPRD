  - method: POST
    path: "/engagement/benchmark-sets"
    description: "Register benchmark distribution"
    roles: [PeopleAnalyst]
    code: 201
    input: [name, dimension_scores]
    output: BenchmarkSet
    side_effects: []
  - method: POST
    path: "/engagement/benchmark-sets/{id}/retire"
    description: "Retire a benchmark set; retired sets are excluded from percentile computation"
    roles: [PeopleAnalyst]
    code: 200
    input: []
    output: BenchmarkSet
    side_effects: ["BenchmarkSet.status -> RETIRED", "increments BenchmarkSet.version by 1"]
  - method: GET
    path: "/engagement/benchmark-sets"
    description: "List benchmark sets"
    roles: [HRAdmin, PeopleAnalyst, Executive]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: BenchmarkSet[]
    side_effects: []

  # --- Action plans ---
  - method: POST
    path: "/engagement/action-plans"
    description: "Create action plan (DRAFT) for a unit+cycle"
    roles: [UnitManager]
    code: 201
    input: [cycle_id, unit_id, title, focus_dimension, due_at]
    output: ActionPlan
    side_effects: []
  - method: GET
    path: "/engagement/action-plans"
    description: "List plans; UnitManager sees own unit only"
    roles: [HRAdmin, PeopleAnalyst, UnitManager, Executive]
    code: 200
    input: ["limit?", "offset?", "cycle_id?", "unit_id?", "status?"]
    output: ActionPlan[]
    side_effects: []
  - method: GET
    path: "/engagement/action-plans/{id}"
    description: "Get one plan"
    roles: [HRAdmin, PeopleAnalyst, UnitManager, Executive]
    code: 200
    input: []
    output: ActionPlan
    side_effects: []
  - method: POST
    path: "/engagement/action-plans/{id}/items"
    description: "Add milestone item to plan"
    roles: [UnitManager]
    code: 201
    input: [description, owner_user_id, target_at]
    output: ActionItem
    side_effects: ["parent ActionPlan.progress_pct recomputed", "increments ActionPlan.version by 1"]
  - method: GET
    path: "/engagement/action-plans/{id}/items"
    description: "List plan items"
    roles: [HRAdmin, PeopleAnalyst, UnitManager, Executive]
    code: 200
    input: ["limit?", "offset?"]
    output: ActionItem[]
    side_effects: []
  - method: POST
    path: "/engagement/action-plans/{id}/submit"
    description: "DRAFT -> SUBMITTED with OCC"
    roles: [UnitManager]
    code: 200
    input: [expected_plan_version]
    output: ActionPlan
    side_effects: ["plan.submitted_at = now", "increments ActionPlan.version by 1"]
  - method: POST
    path: "/engagement/action-plans/{id}/approve"
    description: "SUBMITTED -> APPROVED"
    roles: [PeopleAnalyst]
    code: 200
    input: []
    output: ActionPlan
    side_effects: ["increments ActionPlan.version by 1"]
  - method: POST
    path: "/engagement/action-plans/{id}/reject"
    description: "SUBMITTED -> REJECTED with reason"
    roles: [PeopleAnalyst]
    code: 200
    input: [rejection_reason]
    output: ActionPlan
    side_effects: ["increments ActionPlan.version by 1"]
  - method: POST
    path: "/engagement/action-plans/{id}/revise"
    description: "REJECTED -> DRAFT"
    roles: [UnitManager]
    code: 200
    input: []
    output: ActionPlan
    side_effects: ["plan.rejection_reason cleared", "increments ActionPlan.version by 1"]
  - method: POST
    path: "/engagement/action-plans/{id}/start"
    description: "APPROVED -> IN_PROGRESS"
    roles: [UnitManager]
    code: 200
    input: []
    output: ActionPlan
    side_effects: ["increments ActionPlan.version by 1"]
  - method: POST
    path: "/engagement/action-plans/{id}/abandon"
    description: "DRAFT|IN_PROGRESS -> ABANDONED after due_at"
    roles: [UnitManager]
    code: 200
    input: []
    output: ActionPlan
    side_effects: ["OPEN items flip to DROPPED", "increments ActionPlan.version by 1"]
  - method: POST
    path: "/engagement/action-items/{id}/complete"
    description: "OPEN -> DONE; may auto-complete parent plan"
    roles: [UnitManager]
    code: 200
    input: []
    output: ActionItem
    side_effects: ["parent ActionPlan.progress_pct recomputed; plan may auto-complete"]
  - method: POST
    path: "/engagement/action-items/{id}/drop"
    description: "OPEN -> DROPPED; denominator kept in progress"
    roles: [UnitManager]
    code: 200
    input: []
    output: ActionItem
    side_effects: ["parent ActionPlan.progress_pct recomputed; plan may auto-complete"]

  # --- Outcome linkage ---
  - method: POST
    path: "/engagement/employees/{id}/outcome-linkages"
    description: "Record attrition/performance outcome for an employee against a cycle"
    roles: [PeopleAnalyst]
    code: 201
    input: [cycle_id, outcome_kind, outcome_value]
    output: OutcomeLinkage
    side_effects: ["attrition_risk_index (final_risk variant) recomputed for cycle"]
  - method: GET
    path: "/engagement/employees/{id}/outcome-linkages"
    description: "List outcome linkages of an employee"
    roles: [HRAdmin, PeopleAnalyst]
    code: 200
    input: ["limit?", "offset?", "cycle_id?"]
    output: OutcomeLinkage[]
    side_effects: []
  - method: GET
    path: "/engagement/outcome-linkages"
    description: "Filtered list of outcome linkages across employees (e.g., all rows for a cycle)"
    roles: [HRAdmin, PeopleAnalyst]
    code: 200
    input: ["limit?", "offset?", "cycle_id?", "employee_id?", "outcome_kind?"]
    output: OutcomeLinkage[]
    side_effects: []
  - method: GET
    path: "/engagement/outcome-linkages/{id}"
    description: "Get one outcome linkage row"
    roles: [HRAdmin, PeopleAnalyst]
    code: 200
    input: []
    output: OutcomeLinkage
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/engagement/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [HRAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["system auto-transitions whose time preconditions now hold may fire (cycle auto-close at closes_at)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "authenticated role not permitted on endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path resource id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "body FK id (bank_id, item_id, unit_id, employee_id, cycle_id, plan_id) does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "state machine rejects transition from current state (incl. terminal lockdown)" }
  - { id: ERR_CONFIDENTIALITY, http: 403, condition: "snapshot outside manager's unit subtree, suppressed scores requested, or UnitManager attempts response-level access" }
  - { id: ERR_DUTY_SEGREGATION, http: 403, condition: "same user attempts both create and score on one cycle; or PeopleAnalyst touches item-bank writes" }
  - { id: ERR_DUPLICATE, http: 409, condition: "uniqueness violation: item_code within bank, display_order within cycle, external_ref" }
  - { id: ERR_WINDOW_VIOLATION, http: 422, condition: "submit outside open window; target_at after plan due_at; due_at not after cycle closes_at" }
  - { id: ERR_UNIT_CYCLE, http: 422, condition: "parent_unit_id would create a cycle in the OrgUnit tree" }
  - { id: ERR_THRESHOLD_INVERSION, http: 422, condition: "verbatim_n_threshold < min_n_threshold" }
  - { id: ERR_CYCLE_ALREADY_OPEN, http: 409, condition: "another SurveyCycle is already OPEN" }
  - { id: ERR_INSUFFICIENT_ITEMS, http: 422, condition: "fewer than 3 items on bank activate or cycle configure" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version mismatch on OCC-guarded endpoint" }
  - { id: ERR_VALIDATION, http: 400, condition: "malformed payload: missing required field, wrong type, out-of-range value, invalid enum" }
  - { id: ERR_ANSWERS_INCOMPLETE, http: 422, condition: "submit requires answers for every CycleItem; submit-partial requires at least one answer and at least one unanswered" }
  - { id: ERR_INVITE_OWNERSHIP, http: 403, condition: "EmployeeRole X-User-ID does not match invite.employee_id" }
  - { id: ERR_PLAN_OWNERSHIP, http: 403, condition: "UnitManager X-User-ID is not the manager_user_id of the plan's unit" }
  - { id: ERR_SNAPSHOT_NOT_PUBLISHED, http: 409, condition: "manager-facing snapshot read before cycle reaches REPORTED" }
  - { id: ERR_BENCHMARK_TOO_SMALL, http: 422, condition: "BenchmarkSet.dimension_scores has fewer than 5 entries" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "generic request-shape failure (pagination out of range, unknown query param)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HRAdmin
    description: "HR operations administrator; configures instruments, cycles, roster; cannot score own cycle"
    identity: opaque
    exclusive_operations:
      - "POST /engagement/item-banks (+ activate, retire, items)"
      - "POST /engagement/org-units, PATCH /engagement/org-units/{id}"
      - "POST /engagement/employees (+ terminate)"
      - "POST /engagement/survey-cycles (+ items, configure, open, close, publish, archive)"
      - "POST /engagement/_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"
  - name: PeopleAnalyst
    description: "People analytics team member; scores cycles, runs reminders, manages benchmarks and outcome linkages"
    identity: opaque
    exclusive_operations:
      - "POST /engagement/survey-cycles/{id}/score"
      - "POST /engagement/survey-cycles/{id}/remind"
      - "POST /engagement/report-snapshots/{id}/recompute"
      - "POST /engagement/benchmark-sets"
      - "POST /engagement/employees/{id}/outcome-linkages"
      - "POST /engagement/action-plans/{id}/approve, reject"
    shared_operations:
      - "GET reads across all resources"
  - name: UnitManager
    description: "Line manager of an OrgUnit; sees own unit subtree snapshots after publish; owns action plans"
    identity: "entity_backed:OrgUnit"
    exclusive_operations:
      - "POST /engagement/action-plans (+ items, submit, revise, start, abandon)"
      - "POST /engagement/action-items/{id}/complete, drop"
    shared_operations:
      - "GET /engagement/report-snapshots (own subtree only)"
      - "GET /engagement/org-units, survey-cycles, action-plans"
  - name: EmployeeRole
    description: "Individual employee respondent; submits own survey responses only"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /engagement/survey-invites/{id}/submit, submit-partial"
    shared_operations:
      - "GET /engagement/survey-invites/{id} (own only)"
      - "GET /engagement/survey-invites/{id}/response (own only)"
  - name: Executive
    description: "Executive consumer; read-only access to cycles, snapshots, benchmarks, plans"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /engagement/survey-cycles, report-snapshots, benchmark-sets, action-plans"
