# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3071_medicare_broker_call_center_enrollment_marketing_compliance
#
# Nine Difficulty Rules (§0.5) x 2 instances = 18 instances. Every instance
# grounds in an element already declared in SCAFFOLD.yaml §1.1-§1.7. Every
# setup_api_calls / trigger chain is an executable prototype the downstream
# unit-test-generator transcribes verbatim; YAML anchors are resolved before
# linting, so each *alias expands to the full structured call it points at.
#
# Every chain creates records in this order so that no `${var}` is used before
# the call that binds it:
#   clock -> agency -> carrier -> plan -> formulary/pharmacy/provider ->
#   agent -> license -> certification -> appointment -> member -> scope ->
#   call session -> connect -> complete -> enrollment -> carrier-side actions
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_book_vs_earned_commission_on_enrollment
        grounds:
          - calculations.provisional_book_commission
          - calculations.earned_commission_projections
          - entities.Enrollment.fields.final_commission_cents
          - entities.Agency.fields.commission_balance_cents
        distinguishing_aspect: "For one and the same EFFECTUATED enrollment both commission figures are computed from the identical premium 1500 and rate inputs yet differ: provisional_commission_cents is the forward-looking projection under FORWARD_WINDOW_DAYS and METHOD_FEE_MULTIPLIER (4134.00) while final_commission_cents is the chronological as-earned term (300.00) — a divergence factor of 13.78 on the Enrollment money domain."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Empty database."
            - "One agency, one carrier, one MAPD plan in the member's own TX/TX-201 service area, one member, one agent fully licensed/certified/appointed."
            - "One scope of appointment, one completed call session, then an enrollment submitted for effective_date 2026-11-01 and effectuated."
          setup_api_calls:
            - &d_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_agency
              call: "POST /agencies"
              payload: { name: "Alpine Senior Benefits LLC", service_center_code: "ALP-DAL-01", aep_start_date: "2026-10-15T00:00:00Z", aep_end_date: "2026-12-07T00:00:00Z", aep_daily_submission_capacity: 3, recording_retention_days: 2555, soa_retention_days: 3650, soa_max_age_days: 30, rapid_disenrollment_day_limit: 90 }
              as: PlatformAdmin
              captures: { agency_id: $.data.id }
            - &d_carrier_a
              call: "POST /carriers"
              payload: { legal_name: "Meridian Health Plan of Texas", naic_number: "60211", contract_type: "CONTRACTED", initial_commission_rate_pct: 0.20, renewal_commission_rate_pct: 0.10, chargeback_clawback_pct: 0.25, ack_expected_within_days: 5, effectuation_expected_within_days: 30 }
              as: PlatformAdmin
              captures: { carrier_a_id: $.data.id }
            - &d_plan_a
              call: "POST /plans"
              payload: { carrier_id: "${carrier_a_id}", plan_id_code: "MER-H0021-001", plan_type: "MAPD", state_code: "TX", county_code: "TX-201", monthly_premium_cents: 1500, annual_drug_deductible_cents: 20000, star_rating: 4.5, formulary_id: "FORM-2026-V1", pharmacy_network_id: "PHARM-2026-V1", provider_directory_id: "PROV-2026-V1" }
              as: PlatformAdmin
              captures: { plan_a_id: $.data.id }
            - &d_drug_a
              call: "POST /plans/${plan_a_id}/formulary-drugs"
              payload: { drug_name: "Lisinopril 10mg", rxcui: "314076", tier: 1, monthly_copay_cents: 200, prior_authorization_required: false, covered: true, quantity_limit_days: 30 }
              as: PlatformAdmin
            - &d_prov_a
              call: "POST /plans/${plan_a_id}/provider-directory-entries"
              payload: { provider_npi: "1000000001", provider_name: "Dr Alvarez", specialty: "Internal Medicine", network_status: "IN_NETWORK", accepting_new_patients: true, last_attested_on: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_agent
              call: "POST /agents"
              payload: { agency_id: "${agency_id}", full_name: "Marcus Reed", national_producer_number: "8841002", hire_date: "2026-08-01T00:00:00Z" }
              as: DirectorOfSales
              captures: { agent_id: $.data.id }
            - &d_lic
              call: "POST /agents/${agent_id}/licenses"
              payload: { state_code: "TX", license_number: "TX-LIC-77031", issued_on: "2026-08-05T00:00:00Z", expires_on: "2027-12-31T00:00:00Z" }
              as: LicensingCoordinator
            - &d_cert
              call: "POST /agents/${agent_id}/certifications"
              payload: { carrier_id: "${carrier_a_id}", product_type: "MAPD", expires_on: "2027-12-31T00:00:00Z" }
              as: LicensingCoordinator
            - &d_appt
              call: "POST /agents/${agent_id}/appointments"
              payload: { carrier_id: "${carrier_a_id}", state_code: "TX", requested_on: "2026-09-20T00:00:00Z" }
              as: LicensingCoordinator
            - &d_member
              call: "POST /members"
              payload: { agency_id: "${agency_id}", full_name: "Ada Whitfield", medicare_beneficiary_id: "1EG4-TE5-MK72", date_of_birth: "1954-03-11T00:00:00Z", state_code: "TX", county_code: "TX-201", drug_list: [{ drug_name: "Lisinopril 10mg", rxcui: "314076", monthly_fills: 1 }], provider_npis: ["1000000001"] }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { member_id: $.data.id, member_v1: $.data.version }
            - &d_member_two
              call: "POST /members"
              payload: { agency_id: "${agency_id}", full_name: "Hollis Pike", medicare_beneficiary_id: "3GH6-VG7-PM94", date_of_birth: "1952-11-19T00:00:00Z", state_code: "TX", county_code: "TX-201", drug_list: [{ drug_name: "Lisinopril 10mg", rxcui: "314076", monthly_fills: 1 }], provider_npis: ["1000000001"] }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { member_two_id: $.data.id, member_two_v1: $.data.version }
            - &d_soa
              call: "POST /scope-of-appointments"
              payload: { member_id: "${member_id}", agent_id: "${agent_id}", capture_channel: "TELEPHONIC_RECORDED", plan_types_authorized: ["MA", "MAPD"], captured_on: "2026-10-01T00:00:00Z", expected_member_version: "${member_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { soa_id: $.data.id }
            - &d_soa_two
              call: "POST /scope-of-appointments"
              payload: { member_id: "${member_two_id}", agent_id: "${agent_id}", capture_channel: "TELEPHONIC_RECORDED", plan_types_authorized: ["MA", "MAPD"], captured_on: "2026-10-01T00:00:00Z", expected_member_version: "${member_two_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { soa_two_id: $.data.id }
            - &d_call
              call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_id}", scope_of_appointment_id: "${soa_id}", started_at: "2026-10-01T09:00:00Z", scheduled_end_at: "2026-10-01T09:30:00Z", recording_id: "REC-1001", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_id: $.data.id }
            - &d_connect
              call: "POST /call-sessions/${call_id}/connect"
              payload: { disclaimer_delivered: true, plan_type_discussed: "MAPD", recording_id: "REC-1001", disclaimer_script_code: "CMS-DISC-2026", marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
            - &d_complete
              call: "POST /call-sessions/${call_id}/complete"
              payload: { recording_id: "REC-1001", disclaimer_delivered: true }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_v1: $.data.version }
            - &d_enroll
              call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { enrollment_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enrollment_id}/effectuate"
              payload: {}
              as: CarrierIntegration
          assert:
            - "POST /enrollments/${enrollment_id}/effectuate returns 200 and Enrollment.${enrollment_id}.submission_status == EFFECTUATED"
            - "Enrollment.${enrollment_id}.disenrollment_status == ENROLLED"
            - "Enrollment.${enrollment_id}.provisional_commission_cents == 4134.00 — the forward-looking projection, rounded per term before summation"
            - "Enrollment.${enrollment_id}.final_commission_cents == 300.00 — the chronological as-earned term"
            - "Enrollment.${enrollment_id}.provisional_commission_cents != Enrollment.${enrollment_id}.final_commission_cents"
            - "GET /agencies/${agency_id}/book-of-business?window_days=365 reports provisional_book_commission_cents == 4134.00 and qualifying_enrollment_count == 1"

      - name: dual_variant_reserve_vs_disbursement_on_acknowledgment
        grounds:
          - calculations.commission_ledger_entry
          - calculations.provisional_book_commission
          - entities.CommissionLedgerEntry.fields.amount_cents
          - entities.Enrollment.fields.final_commission_cents
        distinguishing_aspect: "The same enrollment carries two provably different money figures over identical premium and rate inputs at the same instant: the settlement posting is the positive RENEWAL entry 1800.00 and the forward-looking attribution is 4134.00, while the chronological as-earned figure at that instant is 300.00 — three distinct values on one row, so no implementation that collapses the variants can produce all three."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the shared anchor chain through &d_enroll, so the enrollment sits in SUBMITTED with one PROVISIONAL INITIAL entry of 3600.00."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
            - *d_drug_a
            - *d_prov_a
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_appt
            - *d_member
            - *d_member_two
            - *d_soa
            - *d_call
            - *d_connect
            - *d_complete
            - *d_enroll
          trigger:
            - call: "POST /enrollments/${enrollment_id}/acknowledge"
              payload: { carrier_id: "${carrier_a_id}" }
              as: CarrierIntegration
              captures: { acknowledged_on: $.data.acknowledged_on }
          assert:
            - "POST /enrollments/${enrollment_id}/acknowledge returns 200 and Enrollment.${enrollment_id}.submission_status == ACKNOWLEDGED"
            - "GET /commission-ledger-entries?enrollment_id=${enrollment_id} returns exactly 2 rows, both PROVISIONAL"
            - "the INITIAL row has amount_cents == 3600.00 and the RENEWAL row has amount_cents == 1800.00, so their sum 5400.00 is the settlement figure"
            - "Enrollment.${enrollment_id}.provisional_commission_cents == 4134.00, which is neither 3600.00, nor 1800.00, nor 5400.00"
            - "Enrollment.${enrollment_id}.final_commission_cents == 0.00 because the enrollment is not yet EFFECTUATED, so the chronological pass contributes nothing to this row"
            - "GET /agencies/${agency_id} reports commission_balance_cents == 5400.00, the sum over entries in {PROVISIONAL, FINALIZED}"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: combinatorial_plan_comparison_pharmacy_term_is_a_hard_zero
        grounds:
          - calculations.plan_comparison_score
          - calculations.formulary_drug_annual_cost
          - entities.Plan.fields.star_rating
          - entities.PharmacyNetworkEntry.fields.network_tier
        distinguishing_aspect: "plan_comparison_score is mode (b)-style reasoning over a non-linear term: GAMMA is byte-identical to ALPHA except that it has no pharmacy network entry, and that single missing row costs it exactly 8.00 points and drops it below BETA, so the ranking is ALPHA 684.80 > BETA 677.75 > GAMMA 676.80 and the 8.00 gap is reproduced by no other combination of the five weighted terms."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Three ACTIVE MAPD plans in the member's own TX/TX-201 service area; the member lists two provider NPIs, so the provider ratio denominator is 2 for every plan."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - &e_plan_a
              call: "POST /plans"
              payload: { carrier_id: "${carrier_a_id}", plan_id_code: "MER-H0021-001", plan_type: "MAPD", state_code: "TX", county_code: "TX-201", monthly_premium_cents: 1500, annual_drug_deductible_cents: 20000, star_rating: 4.5, formulary_id: "FORM-2026-V1", pharmacy_network_id: "PHARM-2026-V1", provider_directory_id: "PROV-2026-V1" }
              as: PlatformAdmin
              captures: { plan_a_id: $.data.id }
            - call: "POST /plans/${plan_a_id}/formulary-drugs"
              payload: { drug_name: "Lisinopril 10mg", rxcui: "314076", tier: 1, monthly_copay_cents: 200, prior_authorization_required: false, covered: true, quantity_limit_days: 30 }
              as: PlatformAdmin
            - call: "POST /plans/${plan_a_id}/formulary-drugs"
              payload: { drug_name: "Metformin 500mg", rxcui: "861007", tier: 2, monthly_copay_cents: 600, prior_authorization_required: false, covered: true, quantity_limit_days: 30 }
              as: PlatformAdmin
            - call: "POST /plans/${plan_a_id}/pharmacy-network-entries"
              payload: { pharmacy_npi: "3000000001", pharmacy_name: "Alpine Drug Mart", network_tier: "PREFERRED", cost_share_multiplier_pct: 1.0 }
              as: PlatformAdmin
            - call: "POST /plans/${plan_a_id}/provider-directory-entries"
              payload: { provider_npi: "1000000001", provider_name: "Dr Alvarez", specialty: "Internal Medicine", network_status: "IN_NETWORK", accepting_new_patients: true, last_attested_on: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &e_carrier_b
              call: "POST /carriers"
              payload: { legal_name: "Bluebonnet Secure Advantage", naic_number: "60212", contract_type: "CONTRACTED", initial_commission_rate_pct: 0.20, renewal_commission_rate_pct: 0.10, chargeback_clawback_pct: 0.25, ack_expected_within_days: 5, effectuation_expected_within_days: 30 }
              as: PlatformAdmin
              captures: { carrier_b_id: $.data.id }
            - &e_plan_b
              call: "POST /plans"
              payload: { carrier_id: "${carrier_b_id}", plan_id_code: "BBN-H0099-004", plan_type: "MAPD", state_code: "TX", county_code: "TX-201", monthly_premium_cents: 3200, annual_drug_deductible_cents: 0, star_rating: 5.0, formulary_id: "FORM-BBN-V4", pharmacy_network_id: "PHARM-BBN-V1", provider_directory_id: "PROV-BBN-V2" }
              as: PlatformAdmin
              captures: { plan_b_id: $.data.id }
            - call: "POST /plans/${plan_b_id}/formulary-drugs"
              payload: { drug_name: "Lisinopril 10mg", rxcui: "314076", tier: 1, monthly_copay_cents: 1500, prior_authorization_required: false, covered: true, quantity_limit_days: 30 }
              as: PlatformAdmin
            - call: "POST /plans/${plan_b_id}/formulary-drugs"
              payload: { drug_name: "Metformin 500mg", rxcui: "861007", tier: 3, monthly_copay_cents: 3000, prior_authorization_required: true, covered: false, quantity_limit_days: 30 }
              as: PlatformAdmin
            - call: "POST /plans/${plan_b_id}/provider-directory-entries"
              payload: { provider_npi: "1000000001", provider_name: "Dr Alvarez", specialty: "Internal Medicine", network_status: "IN_NETWORK", accepting_new_patients: true, last_attested_on: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &e_carrier_c
              call: "POST /carriers"
              payload: { legal_name: "Gulf Coast Community Health", naic_number: "60213", contract_type: "CONTRACTED", initial_commission_rate_pct: 0.20, renewal_commission_rate_pct: 0.10, chargeback_clawback_pct: 0.25, ack_expected_within_days: 5, effectuation_expected_within_days: 30 }
              as: PlatformAdmin
              captures: { carrier_c_id: $.data.id }
            - &e_plan_c
              call: "POST /plans"
              payload: { carrier_id: "${carrier_c_id}", plan_id_code: "GCC-H0044-002", plan_type: "MAPD", state_code: "TX", county_code: "TX-201", monthly_premium_cents: 1500, annual_drug_deductible_cents: 20000, star_rating: 4.5, formulary_id: "FORM-2026-V1", pharmacy_network_id: "PHARM-GCC-V1", provider_directory_id: "PROV-2026-V1" }
              as: PlatformAdmin
              captures: { plan_c_id: $.data.id }
            - call: "POST /plans/${plan_c_id}/formulary-drugs"
              payload: { drug_name: "Lisinopril 10mg", rxcui: "314076", tier: 1, monthly_copay_cents: 200, prior_authorization_required: false, covered: true, quantity_limit_days: 30 }
              as: PlatformAdmin
            - call: "POST /plans/${plan_c_id}/formulary-drugs"
              payload: { drug_name: "Metformin 500mg", rxcui: "861007", tier: 2, monthly_copay_cents: 600, prior_authorization_required: false, covered: true, quantity_limit_days: 30 }
              as: PlatformAdmin
            - call: "POST /plans/${plan_c_id}/provider-directory-entries"
              payload: { provider_npi: "1000000001", provider_name: "Dr Alvarez", specialty: "Internal Medicine", network_status: "IN_NETWORK", accepting_new_patients: true, last_attested_on: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_appt
            - &e_member
              call: "POST /members"
              payload: { agency_id: "${agency_id}", full_name: "Ada Whitfield", medicare_beneficiary_id: "1EG4-TE5-MK72", date_of_birth: "1954-03-11T00:00:00Z", state_code: "TX", county_code: "TX-201", drug_list: [{ drug_name: "Lisinopril 10mg", rxcui: "314076", monthly_fills: 1 }, { drug_name: "Metformin 500mg", rxcui: "861007", monthly_fills: 2 }], provider_npis: ["1000000001", "2000000002"] }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { member_id: $.data.id, member_v1: $.data.version }
            - &e_soa
              call: "POST /scope-of-appointments"
              payload: { member_id: "${member_id}", agent_id: "${agent_id}", capture_channel: "TELEPHONIC_RECORDED", plan_types_authorized: ["MA", "MAPD"], captured_on: "2026-10-01T00:00:00Z", expected_member_version: "${member_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { soa_id: $.data.id }
          trigger:
            - call: "POST /plan-comparisons"
              payload: { member_id: "${member_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
          assert:
            - "POST /plan-comparisons returns 201 and candidate_plan_count == 3"
            - "ALPHA drug subtotal == 1470.00 (Lisinopril one fill at copay 200 gives 210.00, Metformin two fills at copay 600 gives 1260.00, each rounded before summation)"
            - "BETA Metformin row is covered == false, so BETA's drug subtotal == 1575.00 and prior_authorization_required does not change the cost"
            - "ALPHA: plan_out_of_pocket_cents == 39470, cost_score == 605.30, composite_score == 684.80"
            - "BETA: plan_out_of_pocket_cents == 39975, cost_score == 600.25, composite_score == 677.75"
            - "GAMMA: plan_out_of_pocket_cents == 39470, composite_score == 676.80"
            - "recommended_plan_id == ${plan_a_id} and recommended_composite_score == 684.80"
            - "the ranked_plans array orders ALPHA 684.80, then BETA 677.75, then GAMMA 676.80 — GAMMA loses to BETA by exactly the 8.00 pharmacy term"

      - name: combinatorial_chargeback_band_selected_before_tier_escalation
        grounds:
          - calculations.rapid_disenrollment_chargeback
          - entities.Agent.fields.chargeback_tier
          - entities.CommissionLedgerEntry.fields.clawback_pct_applied
          - state_machines.Enrollment.transitions.ENROLLED_to_RAPID_DISENROLLED
        distinguishing_aspect: "rapid_disenrollment_chargeback is mode (c): the day band is selected FIRST only then does the escalation rewrite the percentage, so an absolute initial commission of 3600.00 at day 45 with chargeback_tier 4 yields -1800.00 and clawback_pct_applied 0.50 — a value neither the band's own 0.75 nor the hard-escalation 1.00 can produce, proving the two steps are ordered and not re-associated."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the shared anchor chain through &d_complete, plus a member whose effective date will be 2026-11-01."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
            - *d_drug_a
            - *d_prov_a
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_appt
            - *d_member
            - *d_member_two
            - *d_soa
            - *d_call
            - *d_connect
            - *d_complete
            - *d_enroll
            - call: "POST /enrollments/${enrollment_id}/withdraw"
              payload: { reason: "BENEFICIARY_CHANGED_MIND" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
            - call: "GET /call-sessions/${call_id}"
              payload: {}
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_v2: $.data.version }
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v2}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { enrollment_2_id: $.data.id }
            - call: "POST /enrollments/${enrollment_2_id}/withdraw"
              payload: { reason: "BENEFICIARY_CHANGED_MIND" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
            - call: "GET /call-sessions/${call_id}"
              payload: {}
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_v3: $.data.version }
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v3}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { enrollment_3_id: $.data.id }
            - call: "POST /enrollments/${enrollment_3_id}/withdraw"
              payload: { reason: "BENEFICIARY_CHANGED_MIND" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
            - call: "GET /call-sessions/${call_id}"
              payload: {}
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_v4: $.data.version }
            - call: "POST /enrollments"
