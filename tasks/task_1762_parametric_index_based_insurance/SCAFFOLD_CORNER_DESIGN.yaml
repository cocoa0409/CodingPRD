          - "validations[priority=14]"
        excluded_because:
          difficulty_instance: state_vs_business_fiscal_on_bind_unpaid_and_over_exposure
          rationale: "Dual fiscal violation resolves to priority-13 exposure error; asserted there."

      - name: corner_stub_sod_vs_xref
        claim_type: priority_conflict
        grounds:
