          InfusionNurse is entity_backed, so authorization is two-layered: the role opens the
          endpoint and X-User-ID has to match Appointment.nurse_id on top of that. The second
          nurse here holds the right ROLE, which is why the refusal must be
          ERR_NURSE_NOT_ASSIGNED rather than ERR_UNAUTHORIZED, and the distinction has to hold
          on every chair-side write. Reads are not identity-bound, so the same nurse can still
          GET the visit — that asymmetry is what stops implementations from bolting the check
