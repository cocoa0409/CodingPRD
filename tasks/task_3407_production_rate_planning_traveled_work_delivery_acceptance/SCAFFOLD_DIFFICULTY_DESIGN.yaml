scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: rework_cost_provisional_estimate_differs_from_final_actual
        grounds:
          - calculations.traveled_work_cost
          - entities.ReworkOrder.fields.estimated_cost_cents
          - entities.ReworkOrder.fields.actual_cost_cents
        distinguishing_aspect: |
          Rework cost accounting on ReworkOrder (production-cost domain): the provisional variant
          (hours_basis * 15000 * source multiplier) and the final variant (actual_hours * 17500 + parts_cents)
          are both valid cost algorithms and produce different totals for the same underlying work.
        test_recipe:
          setup:
            - "Program M1 (rate 5, 1 required component code, budget 10000000) with customer AL1 and aircraft line 1001 carrying one OPEN work package (station 1, planned_hours 10)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 10000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id"} }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id"} }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1001, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id"} }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Wing join", planned_hours: 10 }, as: LineManager, captures: { wp_id: "$.data.id"} }
          trigger:
            - { call: "POST /api/work-packages/${wp_id}/travel", payload: { traveled_hours: 4 }, as: LineManager }
            - { call: "GET /api/aircraft-units/${ac_id}/rework-orders", payload: {}, as: LineManager, captures: { rw_id: "$.data[0].id", rw_est: "$.data[0].estimated_cost_cents "} }
            - { call: "POST /api/rework-orders/${rw_id}/close", payload: { actual_hours: 5, parts_cents: 12000 }, as: LineManager, captures: { rw_act: "$.data.actual_cost_cents"} }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramAdmin, captures: { consumed: "$.data.rework_budget_consumed_cents"} }
          assert:
            - "ReworkOrder.${rw_id}.estimated_cost_cents == 60000 (provisional: 4 * 15000 * 1.0)"
            - "ReworkOrder.${rw_id}.actual_cost_cents == 99500 (final: 5 * 17500 + 12000)"
            - "estimated_cost_cents and actual_cost_cents differ by 39500 for the same reworked job"
            - "ProductionProgram.${prog_id}.rework_budget_consumed_cents == 99500"
      - name: delay_compensation_contractual_capped_vs_goodwill_uncapped
        grounds:
          - calculations.delay_compensation
          - entities.DeliveryNegotiation.fields.compensation_variant
        distinguishing_aspect: |
          Delay compensation on DeliveryNegotiation (commercial domain, distinct from the rework-cost domain
          of the sibling instance): contractual liquidated damages (250000/day, 10-percent price cap) and
          goodwill (1000000 flat + 100000/day, uncapped) price identical delay days differently.
        test_recipe:
          setup:
            - "Program M1 with GOOD-credit customer AL1 holding two aircraft (lines 1001, 1002), both contracted delivery 2026-10-01 at price 5000000000"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id"} }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id"} }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1001, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac1_id: "$.data.id"} }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1002, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac2_id: "$.data.id"} }
          trigger:
            - { call: "POST /api/aircraft-units/${ac1_id}/delivery-negotiations", payload: { proposed_delivery_date: "2026-10-21", compensation_variant: "CONTRACTUAL_LIQUIDATED" }, as: DeliveryManager, captures: { neg1_id: "$.data.id", comp_c: "$.data.compensation_cents "} }
            - { call: "POST /api/aircraft-units/${ac2_id}/delivery-negotiations", payload: { proposed_delivery_date: "2026-10-21", compensation_variant: "GOODWILL" }, as: DeliveryManager, captures: { neg2_id: "$.data.id", comp_g: "$.data.compensation_cents "} }
          assert:
            - "DeliveryNegotiation.${neg1_id}.days_late == 20 and DeliveryNegotiation.${neg2_id}.days_late == 20 (identical inputs)"
            - "DeliveryNegotiation.${neg1_id}.compensation_cents == 5000000 (20 * 250000; cap 500000000 not binding)"
            - "DeliveryNegotiation.${neg2_id}.compensation_cents == 3000000 (1000000 + 20 * 100000; uncapped)"
            - "the two variants diverge by 2000000 on identical days_late"

  - rule_id: combinatorial_formula
    instances:
      - name: gating_index_min_selects_weaker_dimension
        grounds:
          - calculations.gating_readiness_index
          - entities.RateCase.fields.gating_verdict
        distinguishing_aspect: |
          Mode (a) combinatorial: gating_readiness_index combines 3+ inputs (supply coverage ratio,
          workforce ratio, traveled-work burden) through nested min() and a capped penalty; the snapshot
          fields must prove the min() selected the weaker workforce dimension (85.0), not supply (100.0).
        test_recipe:
          setup:
            - "Program M1 (rate 5, 2 required component codes); suppliers S1/S2 each CONFIRMED at committed_rate 8 covering ENG and LG; workforce plans: AVIONICS 10/10 hired, STRUCTURES 7/10 hired"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 2, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id", prog_v: "$.data.version "} }
            - { call: "POST /api/suppliers", payload: { supplier_code: "S1", name: "Engines Co", region: "NA" }, as: ProgramAdmin, captures: { s1_id: "$.data.id"} }
            - { call: "POST /api/suppliers", payload: { supplier_code: "S2", name: "Landing Co", region: "EU" }, as: ProgramAdmin, captures: { s2_id: "$.data.id"} }
            - { call: "POST /api/suppliers/${s1_id}/capacity-commitments", payload: { program_id: "${prog_id}", component_code: "ENG", committed_rate_per_month: 8, lead_time_months: 4, unit_price_cents: 1000000 }, as: SupplierManager, as_user_id: "${s1_id}", captures: { c_eng: "$.data.id"} }
            - { call: "POST /api/capacity-commitments/${c_eng}/confirm", payload: {}, as: SupplierManager, as_user_id: "${s1_id}" }
            - { call: "POST /api/suppliers/${s2_id}/capacity-commitments", payload: { program_id: "${prog_id}", component_code: "LG", committed_rate_per_month: 8, lead_time_months: 4, unit_price_cents: 1000000 }, as: SupplierManager, as_user_id: "${s2_id}", captures: { c_lg: "$.data.id"} }
            - { call: "POST /api/capacity-commitments/${c_lg}/confirm", payload: {}, as: SupplierManager, as_user_id: "${s2_id}" }
            - { call: "POST /api/programs/${prog_id}/workforce-plans", payload: { skill_code: "AVIONICS", required_headcount: 10 }, as: ProductionPlanner, captures: { wf_a: "$.data.id"} }
            - { call: "POST /api/workforce-plans/${wf_a}/hire", payload: { count: 10 }, as: ProductionPlanner }
            - { call: "POST /api/programs/${prog_id}/workforce-plans", payload: { skill_code: "STRUCTURES", required_headcount: 10 }, as: ProductionPlanner, captures: { wf_b: "$.data.id"} }
            - { call: "POST /api/workforce-plans/${wf_b}/hire", payload: { count: 7 }, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 8, effective_month: "2027-01", demand_backlog_units: 100, expected_program_version: "${prog_v}" }, as: ProductionPlanner, captures: { rc_id: "$.data.id"} }
            - { call: "POST /api/rate-cases/${rc_id}/announce", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/rate-cases/${rc_id}/request-gating-review", payload: {}, as: ProductionPlanner, captures: { snap_supply: "$.data.supply_readiness_snapshot_pct", snap_wf: "$.data.workforce_readiness_snapshot_pct", snap_idx: "$.data.readiness_index_snapshot", verdict: "$.data.gating_verdict "} }
          assert:
            - "RateCase.${rc_id}.supply_readiness_snapshot_pct == 100.0 (2 of 2 codes covered at committed_rate 8 >= proposed 8)"
            - "RateCase.${rc_id}.workforce_readiness_snapshot_pct == 85.0 (17/20)"
            - "RateCase.${rc_id}.readiness_index_snapshot == 85.0 — min(100.0, 85.0) - 0.0; the weaker workforce dimension wins the min()"
            - "RateCase.${rc_id}.gating_verdict == PASS"
      - name: storage_fee_rounds_per_aircraft_before_program_sum
        grounds:
          - calculations.storage_preservation_fee
          - entities.ProductionProgram.fields.storage_fees_accrued_cents
        distinguishing_aspect: |
          Mode (b) nested rounding (distinct from the sibling instance's mode (a)): the 0.95 volume-discount
          multiplication is rounded per aircraft BEFORE the program-level sum; per-aircraft rounding yields
          22164 + 9499 = 31663, while sum-then-round of raw values would yield 31664 — exactly one cent apart.
        test_recipe:
          setup:
            - "Program M1; two ASSEMBLY_COMPLETE aircraft stored in bays B1 and B2 at daily_rate_cents 3333; A1 window starts 2026-09-01, A2 window starts 2026-09-05; logical clock advanced to 2026-09-08T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id"} }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id"} }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 2001, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac1_id: "$.data.id"} }
            - { call: "POST /api/aircraft-units/${ac1_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp1_id: "$.data.id"} }
            - { call: "POST /api/work-packages/${wp1_id}/complete", payload: {}, as: LineManager }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 2002, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac2_id: "$.data.id"} }
            - { call: "POST /api/aircraft-units/${ac2_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp2_id: "$.data.id"} }
            - { call: "POST /api/work-packages/${wp2_id}/complete", payload: {}, as: LineManager }
            - { call: "POST /api/aircraft-units/${ac1_id}/storage-preservations", payload: { bay_code: "B1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z", daily_rate_cents: 3333, preservation_cycle_days: 30 }, as: DeliveryManager, captures: { sp1_id: "$.data.id"} }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/aircraft-units/${ac2_id}/storage-preservations", payload: { bay_code: "B2", window_start: "2026-09-05T00:00:00Z", window_end: "2026-12-01T00:00:00Z", daily_rate_cents: 3333, preservation_cycle_days: 30 }, as: DeliveryManager, captures: { sp2_id: "$.data.id"} }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramAdmin, captures: { fees: "$.data.storage_fees_accrued_cents"} }
          assert:
            - "ProductionProgram.${prog_id}.storage_fees_accrued_cents == 31663"
            - "per-aircraft rounding: A1 7 days * 3333 * 0.95 = 22164.45 -> 22164; A2 3 days * 3333 * 0.95 = 9499.05 -> 9499; sum 31663"
            - "sum-then-round of raw values would be round(31663.50) == 31664, one cent higher — the pinned order is observable"

  - rule_id: non_linear_state_machine
    instances:
      - name: negotiation_counter_rounds_cycle_and_reprice
        grounds:
          - state_machines.DeliveryNegotiation.PROPOSED_to_COUNTERED
          - state_machines.DeliveryNegotiation.COUNTERED_to_PROPOSED
          - calculations.delay_compensation
        distinguishing_aspect: |
          Cyclic machine on DeliveryNegotiation: PROPOSED -> COUNTERED -> PROPOSED negotiation rounds with
          alternating actors, and each cycle recomputes days_late/compensation_cents from the new round's
          proposal (repricing per round, not a terminal pipeline).
        test_recipe:
          setup:
            - "Program M1; GOOD-credit customer AL1; aircraft line 3001 contracted for delivery 2026-10-01 at price 5000000000"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 3001, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/aircraft-units/${ac_id}/delivery-negotiations", payload: { proposed_delivery_date: "2026-10-11", compensation_variant: "CONTRACTUAL_LIQUIDATED" }, as: DeliveryManager, captures: { neg_id: "$.data.id", neg_v1: "$.data.version", comp1: "$.data.compensation_cents" } }
            - { call: "POST /api/delivery-negotiations/${neg_id}/counter", payload: { proposed_delivery_date: "2026-10-06", compensation_variant: "GOODWILL", expected_negotiation_version: "${neg_v1}" }, as: Customer, as_user_id: "${cust_id}", captures: { neg_v2: "$.data.version", comp2: "$.data.compensation_cents", round2: "$.data.round_number" } }
            - { call: "POST /api/delivery-negotiations/${neg_id}/counter", payload: { proposed_delivery_date: "2026-10-21", compensation_variant: "CONTRACTUAL_LIQUIDATED", expected_negotiation_version: "${neg_v2}" }, as: DeliveryManager, captures: { comp3: "$.data.compensation_cents", round3: "$.data.round_number", st3: "$.data.status" } }
          assert:
            - "round 1 compensation_cents == 2500000 (10 days late, contractual)"
            - "round 2 counter cycles PROPOSED -> COUNTERED with round_number == 2 and compensation_cents == 1500000 (5 days, goodwill 1000000 + 5 * 100000)"
            - "round 3 counter cycles COUNTERED -> PROPOSED with round_number == 3, status PROPOSED, compensation_cents == 5000000 (20 days, contractual)"
      - name: escape_disposition_reopen_cycle_clears_disposition
        grounds:
          - state_machines.QualityEscape.DISPOSITIONED_to_ROOT_CAUSE
          - state_machines.QualityEscape.ROOT_CAUSE_to_DISPOSITIONED
        distinguishing_aspect: |
          Cyclic machine on QualityEscape (distinct entity from the sibling negotiation cycle): a
          DISPOSITIONED escape can be reopened to ROOT_CAUSE, and the loop must clear the prior
          disposition fields before a fresh disposition is recorded.
        test_recipe:
          setup:
            - "Program M1; customer AL1; aircraft line 3002; escape reported by inspector insp-1, regulator notified, root cause opened with one conformance ref, dispositioned REWORK by insp-2"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 3002, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/quality-escapes", payload: { severity: "MAJOR", description: "Skin dent at station 3" }, as: QualityInspector, as_user_id: "insp-1", captures: { esc_id: "$.data.id" } }
            - { call: "POST /api/quality-escapes/${esc_id}/notify-regulator", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/quality-escapes/${esc_id}/begin-root-cause", payload: { conformance_refs: ["DOC-1"] }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/quality-escapes/${esc_id}/disposition", payload: { disposition_code: "REWORK" }, as: QualityInspector, as_user_id: "insp-2" }
          trigger:
            - { call: "POST /api/quality-escapes/${esc_id}/reopen", payload: {}, as: QualityInspector, as_user_id: "insp-2", captures: { st1: "$.data.status", disp1: "$.data.dispositioned_by_id" } }
            - { call: "POST /api/quality-escapes/${esc_id}/disposition", payload: { disposition_code: "USE_AS_IS" }, as: QualityInspector, as_user_id: "insp-2", captures: { st2: "$.data.status", code2: "$.data.disposition_code", disp2: "$.data.dispositioned_by_id" } }
          assert:
            - "after reopen: QualityEscape.${esc_id}.status == ROOT_CAUSE and dispositioned_by_id == null (prior disposition erased)"
            - "after second disposition: status == DISPOSITIONED, disposition_code == USE_AS_IS, dispositioned_by_id == insp-2"
            - "the cycle DISPOSITIONED -> ROOT_CAUSE -> DISPOSITIONED is traversed on one escape"
      - name: aircraft_dimensions_production_advances_while_quality_holds
        grounds:
          - state_machines.AircraftUnit.IN_PRODUCTION_to_ASSEMBLY_COMPLETE
          - state_machines.AircraftUnit.quality_status.CLEAR_to_quality_status.HOLD
          - entities.AircraftUnit.fields.delivery_status
        distinguishing_aspect: |
          Parallel state dimensions on one entity (distinct non-linear shape from the two cyclic siblings):
          production_status can advance IN_PRODUCTION -> ASSEMBLY_COMPLETE while quality_status stays HOLD,
          and quality_status later returns to CLEAR without disturbing production_status.
        test_recipe:
          setup:
            - "Program M1; customer AL1; aircraft line 3003 with one work package; an open MAJOR escape holds the aircraft on quality HOLD"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 3003, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/quality-escapes", payload: { severity: "MAJOR", description: "Fastener mismatch" }, as: QualityInspector, as_user_id: "insp-1", captures: { esc_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/work-packages/${wp_id}/complete", payload: {}, as: LineManager }
            - { call: "GET /api/aircraft-units/${ac_id}", payload: {}, as: LineManager, captures: { prod1: "$.data.production_status", qual1: "$.data.quality_status" } }
            - { call: "POST /api/quality-escapes/${esc_id}/notify-regulator", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/quality-escapes/${esc_id}/begin-root-cause", payload: { conformance_refs: ["DOC-9"] }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/quality-escapes/${esc_id}/disposition", payload: { disposition_code: "USE_AS_IS" }, as: QualityInspector, as_user_id: "insp-2" }
            - { call: "POST /api/quality-escapes/${esc_id}/close", payload: {}, as: QualityInspector, as_user_id: "insp-2" }
            - { call: "GET /api/aircraft-units/${ac_id}", payload: {}, as: LineManager, captures: { prod2: "$.data.production_status", qual2: "$.data.quality_status" } }
          assert:
            - "after work-package completion: production_status == ASSEMBLY_COMPLETE while quality_status == HOLD (production advanced under hold)"
            - "after escape closure: quality_status == CLEAR while production_status == ASSEMBLY_COMPLETE (unchanged)"
            - "delivery_status == NOT_STARTED throughout — the third dimension never moved"

  - rule_id: transitive_cascade
    instances:
      - name: rate_commit_atrisk_reserve_posture_autoshelve_chain
        grounds:
          - state_machines.RateCase.GATED_REVIEW_to_COMMITTED
          - state_machines.SupplierCapacityCommitment.ORDERED_to_AT_RISK
          - calculations.cancellation_reserve
          - calculations.posture_derivation
        distinguishing_aspect: |
          Depth-3 cascade from RateCase commit: commit flips commitments ORDERED -> AT_RISK (link 1);
          each flip itself re-prices program.cancellation_reserve_cents (link 2); the reserve/AT_RISK
          change itself flips program.posture to DISTRESSED which auto-shelves the other GATED_REVIEW
          case (link 3). Trigger is the rate commit, not any commitment write.
        test_recipe:
          setup:
            - "Program M1 (rate 5, 2 required codes); suppliers S1/S2 CONFIRMED at rate 8 with open orders of 10 units each placed against assumed_rate 8; workforce fully hired (10/10); rate case A proposed 4 reviewed PASS; rate case B proposed 6 reviewed PASS and still in GATED_REVIEW"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 2, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id", prog_v: "$.data.version" } }
            - { call: "POST /api/suppliers", payload: { supplier_code: "S1", name: "Engines Co", region: "NA" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { supplier_code: "S2", name: "Landing Co", region: "EU" }, as: ProgramAdmin, captures: { s2_id: "$.data.id" } }
            - { call: "POST /api/suppliers/${s1_id}/capacity-commitments", payload: { program_id: "${prog_id}", component_code: "ENG", committed_rate_per_month: 8, lead_time_months: 4, unit_price_cents: 1000000 }, as: SupplierManager, as_user_id: "${s1_id}", captures: { c_eng: "$.data.id" } }
            - { call: "POST /api/capacity-commitments/${c_eng}/confirm", payload: {}, as: SupplierManager, as_user_id: "${s1_id}" }
            - { call: "POST /api/capacity-commitments/${c_eng}/place-order", payload: { quantity: 10, assumed_rate_per_month: 8, required_by_month: "2027-01" }, as: SupplierManager, as_user_id: "${s1_id}" }
            - { call: "POST /api/suppliers/${s2_id}/capacity-commitments", payload: { program_id: "${prog_id}", component_code: "LG", committed_rate_per_month: 8, lead_time_months: 4, unit_price_cents: 1000000 }, as: SupplierManager, as_user_id: "${s2_id}", captures: { c_lg: "$.data.id" } }
            - { call: "POST /api/capacity-commitments/${c_lg}/confirm", payload: {}, as: SupplierManager, as_user_id: "${s2_id}" }
            - { call: "POST /api/capacity-commitments/${c_lg}/place-order", payload: { quantity: 10, assumed_rate_per_month: 8, required_by_month: "2027-01" }, as: SupplierManager, as_user_id: "${s2_id}" }
            - { call: "POST /api/programs/${prog_id}/workforce-plans", payload: { skill_code: "AVIONICS", required_headcount: 10 }, as: ProductionPlanner, captures: { wf_a: "$.data.id" } }
            - { call: "POST /api/workforce-plans/${wf_a}/hire", payload: { count: 10 }, as: ProductionPlanner }
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 4, effective_month: "2027-01", demand_backlog_units: 40, expected_program_version: "${prog_v}" }, as: ProductionPlanner, captures: { rc_a: "$.data.id" } }
            - { call: "POST /api/rate-cases/${rc_a}/announce", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/rate-cases/${rc_a}/request-gating-review", payload: {}, as: ProductionPlanner, captures: { verdict_a: "$.data.gating_verdict" } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramAdmin, captures: { prog_v2: "$.data.version" } }
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 6, effective_month: "2027-01", demand_backlog_units: 60, expected_program_version: "${prog_v2}" }, as: ProductionPlanner, captures: { rc_b: "$.data.id" } }
            - { call: "POST /api/rate-cases/${rc_b}/announce", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/rate-cases/${rc_b}/request-gating-review", payload: {}, as: ProductionPlanner, captures: { verdict_b: "$.data.gating_verdict" } }
          trigger:
            - { call: "POST /api/rate-cases/${rc_a}/commit", payload: {}, as: ProductionPlanner, captures: { st_a: "$.data.status" } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramAdmin, captures: { rate_now: "$.data.current_rate_per_month", reserve: "$.data.cancellation_reserve_cents", posture: "$.data.posture" } }
            - { call: "GET /api/suppliers/${s1_id}/capacity-commitments", payload: {}, as: ProgramAdmin, captures: { eng_st: "$.data[0].status" } }
            - { call: "GET /api/suppliers/${s2_id}/capacity-commitments", payload: {}, as: ProgramAdmin, captures: { lg_st: "$.data[0].status" } }
            - { call: "GET /api/programs/${prog_id}/rate-cases?status=SHELVED", payload: {}, as: ProductionPlanner, captures: { shelved_id: "$.data[0].id" } }
          assert:
            - "RateCase.${rc_a}.status == COMMITTED and verdicts before commit were PASS for both cases"
            - "ProductionProgram.${prog_id}.current_rate_per_month == 4"
            - "link 1: both commitments flipped to AT_RISK (assumed_rate 8 > committed 4)"
            - "link 2: ProductionProgram.${prog_id}.cancellation_reserve_cents == 6000000 (0.30 * 10 * 1000000 per commitment, twice)"
            - "link 3: posture == DISTRESSED (AT_RISK present) and the other GATED_REVIEW case ${rc_b} was auto-SHELVED, found via status=SHELVED listing"
      - name: flight_test_fail_rework_and_negotiation_expiry_chain
        grounds:
          - state_machines.FlightTest.SCHEDULED_to_COMPLETED
          - state_machines.AircraftUnit.delivery_status.FLIGHT_TESTING_to_delivery_status.REJECTED
          - state_machines.DeliveryNegotiation.PROPOSED_to_EXPIRED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger than the sibling (flight-test outcome, not rate commit):
          recording FAIL flips aircraft delivery_status to REJECTED and spawns a FLIGHT_TEST_FAILURE
          ReworkOrder (link 1); the delivery_status flip itself expires the live DeliveryNegotiation
          (link 2) — the negotiation was not touched by the test call.
        test_recipe:
          setup:
            - "Program M1; GOOD customer AL1; aircraft line 3004 ASSEMBLY_COMPLETE, delivery pipeline in FLIGHT_TESTING; a live PROPOSED negotiation (round 1); one SCHEDULED flight test on RANGE_ALPHA"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 3004, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp_id: "$.data.id" } }
            - { call: "POST /api/work-packages/${wp_id}/complete", payload: {}, as: LineManager }
            - { call: "POST /api/aircraft-units/${ac_id}/begin-delivery", payload: {}, as: DeliveryManager }
            - { call: "POST /api/aircraft-units/${ac_id}/delivery-negotiations", payload: { proposed_delivery_date: "2026-10-11", compensation_variant: "CONTRACTUAL_LIQUIDATED" }, as: DeliveryManager, captures: { neg_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/flight-tests", payload: { range_code: "RANGE_ALPHA", window_start: "2026-10-02T09:00:00Z", window_end: "2026-10-02T12:00:00Z" }, as: DeliveryManager, captures: { ft_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/flight-tests/${ft_id}/record-outcome", payload: { outcome: "FAIL", rework_estimated_hours: 6 }, as: DeliveryManager }
            - { call: "GET /api/aircraft-units/${ac_id}", payload: {}, as: DeliveryManager, captures: { del_st: "$.data.delivery_status" } }
            - { call: "GET /api/aircraft-units/${ac_id}/rework-orders", payload: {}, as: DeliveryManager, captures: { rw_src: "$.data[0].source", rw_est: "$.data[0].estimated_cost_cents" } }
            - { call: "GET /api/aircraft-units/${ac_id}/delivery-negotiations", payload: {}, as: DeliveryManager, captures: { neg_st: "$.data[0].status" } }
          assert:
            - "link 1: AircraftUnit.${ac_id}.delivery_status == REJECTED"
            - "link 1: spawned ReworkOrder source == FLIGHT_TEST_FAILURE with estimated_cost_cents == 112500 (6 * 15000 * 1.25)"
            - "link 2: DeliveryNegotiation.${neg_id}.status == EXPIRED (caused by the delivery flip, not by any negotiation call)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: disposition_on_closed_escape_by_reporter_state_beats_segregation
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_TRANSITION]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Error-category pair state x business_safety: the trigger violates both (escape already CLOSED,
          and actor equals reported_by_id); priority 5 state must win, returning ERR_INVALID_TRANSITION (409),
          never ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "Program M1; customer AL1; aircraft line 3005; escape reported by insp-1 fully processed to CLOSED (notify, root cause, disposition USE_AS_IS by insp-2, close)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 3005, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/quality-escapes", payload: { severity: "MAJOR", description: "Sealant void" }, as: QualityInspector, as_user_id: "insp-1", captures: { esc_id: "$.data.id" } }
            - { call: "POST /api/quality-escapes/${esc_id}/notify-regulator", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/quality-escapes/${esc_id}/begin-root-cause", payload: { conformance_refs: ["DOC-1"] }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/quality-escapes/${esc_id}/disposition", payload: { disposition_code: "USE_AS_IS" }, as: QualityInspector, as_user_id: "insp-2" }
            - { call: "POST /api/quality-escapes/${esc_id}/close", payload: {}, as: QualityInspector, as_user_id: "insp-2" }
          trigger:
            - { call: "POST /api/quality-escapes/${esc_id}/disposition", payload: { disposition_code: "SCRAP" }, as: QualityInspector, as_user_id: "insp-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_TRANSITION with HTTP 409 — the state violation (priority 5) is reported"
            - "NOT ERR_SEGREGATION_OF_DUTIES even though insp-1 == reported_by_id also violates priority 6"
      - name: place_order_lead_time_beats_quantity_cap
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_LEAD_TIME_VIOLATION]
          - errors[ERR_ORDER_EXCEEDS_COMMITMENT]
        distinguishing_aspect: |
          Error-category pair business_temporal x business_fiscal (distinct from the sibling's
          state x business_safety): one place-order request violates both the lead-time window and the
          quantity cap; priority 7 temporal must win with ERR_LEAD_TIME_VIOLATION.
        test_recipe:
          setup:
            - "Program M1; supplier S1 with CONFIRMED commitment (rate 8, lead_time 4 months, price 1000000); logical clock at the default 2026-09-01"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { supplier_code: "S1", name: "Engines Co", region: "NA" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/suppliers/${s1_id}/capacity-commitments", payload: { program_id: "${prog_id}", component_code: "ENG", committed_rate_per_month: 8, lead_time_months: 4, unit_price_cents: 1000000 }, as: SupplierManager, as_user_id: "${s1_id}", captures: { c_id: "$.data.id" } }
            - { call: "POST /api/capacity-commitments/${c_id}/confirm", payload: {}, as: SupplierManager, as_user_id: "${s1_id}" }
          trigger:
            - { call: "POST /api/capacity-commitments/${c_id}/place-order", payload: { quantity: 999, assumed_rate_per_month: 8, required_by_month: "2026-10" }, as: SupplierManager, as_user_id: "${s1_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_LEAD_TIME_VIOLATION with HTTP 422 — required_by_month 2026-10 is earlier than 2026-09 + 4 months"
            - "NOT ERR_ORDER_EXCEEDS_COMMITMENT even though quantity 999 also exceeds the 8 * 4 == 32 cap (priority 9)"

  - rule_id: boundary_precision_check
    instances:
      - name: gating_index_85_passes_84_5_fails
        grounds:
          - calculations.gating_readiness_index
          - errors[ERR_GATING_CRITERIA_UNMET]
        distinguishing_aspect: |
          Numeric threshold metric on the rate-case review/commit endpoints: readiness_index exactly 85.0
          satisfies the >= 85.0 gate, while one open traveled hour of burden (0.5 points) drops it to 84.5
          and the identical commit is rejected — the boundary is inclusive and observable at 0.5 granularity.
        test_recipe:
          setup:
            - "Program M1 (rate 5, 2 required codes); ENG+LG commitments CONFIRMED at rate 8; workforce 17/20 (85.0); one aircraft with an OPEN work package (station 1, planned 10)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 2, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id", prog_v: "$.data.version" } }
            - { call: "POST /api/suppliers", payload: { supplier_code: "S1", name: "Engines Co", region: "NA" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { supplier_code: "S2", name: "Landing Co", region: "EU" }, as: ProgramAdmin, captures: { s2_id: "$.data.id" } }
            - { call: "POST /api/suppliers/${s1_id}/capacity-commitments", payload: { program_id: "${prog_id}", component_code: "ENG", committed_rate_per_month: 8, lead_time_months: 4, unit_price_cents: 1000000 }, as: SupplierManager, as_user_id: "${s1_id}", captures: { c_eng: "$.data.id" } }
            - { call: "POST /api/capacity-commitments/${c_eng}/confirm", payload: {}, as: SupplierManager, as_user_id: "${s1_id}" }
            - { call: "POST /api/suppliers/${s2_id}/capacity-commitments", payload: { program_id: "${prog_id}", component_code: "LG", committed_rate_per_month: 8, lead_time_months: 4, unit_price_cents: 1000000 }, as: SupplierManager, as_user_id: "${s2_id}", captures: { c_lg: "$.data.id" } }
            - { call: "POST /api/capacity-commitments/${c_lg}/confirm", payload: {}, as: SupplierManager, as_user_id: "${s2_id}" }
            - { call: "POST /api/programs/${prog_id}/workforce-plans", payload: { skill_code: "AVIONICS", required_headcount: 10 }, as: ProductionPlanner, captures: { wf_a: "$.data.id" } }
            - { call: "POST /api/workforce-plans/${wf_a}/hire", payload: { count: 10 }, as: ProductionPlanner }
            - { call: "POST /api/programs/${prog_id}/workforce-plans", payload: { skill_code: "STRUCTURES", required_headcount: 10 }, as: ProductionPlanner, captures: { wf_b: "$.data.id" } }
            - { call: "POST /api/workforce-plans/${wf_b}/hire", payload: { count: 7 }, as: ProductionPlanner }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 4001, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 10 }, as: LineManager, captures: { wp_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 8, effective_month: "2027-01", demand_backlog_units: 100, expected_program_version: "${prog_v}" }, as: ProductionPlanner, captures: { rc_a: "$.data.id" } }
            - { call: "POST /api/rate-cases/${rc_a}/announce", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/rate-cases/${rc_a}/request-gating-review", payload: {}, as: ProductionPlanner, captures: { idx_a: "$.data.readiness_index_snapshot", verdict_a: "$.data.gating_verdict" } }
            - { call: "POST /api/work-packages/${wp_id}/travel", payload: { traveled_hours: 1 }, as: LineManager }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramAdmin, captures: { prog_v3: "$.data.version", burden: "$.data.traveled_work_open_hours" } }
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 7, effective_month: "2027-01", demand_backlog_units: 90, expected_program_version: "${prog_v3}" }, as: ProductionPlanner, captures: { rc_b: "$.data.id" } }
            - { call: "POST /api/rate-cases/${rc_b}/announce", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/rate-cases/${rc_b}/request-gating-review", payload: {}, as: ProductionPlanner, captures: { idx_b: "$.data.readiness_index_snapshot", verdict_b: "$.data.gating_verdict" } }
            - { call: "POST /api/rate-cases/${rc_b}/commit", payload: {}, as: ProductionPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "case A: readiness_index_snapshot == 85.0 and gating_verdict == PASS (boundary inclusive)"
            - "after traveling 1 hour: program.traveled_work_open_hours == 1, burden penalty 0.5"
            - "case B: readiness_index_snapshot == 84.5 and gating_verdict == FAIL"
            - "commit of case B rejected with ERR_GATING_CRITERIA_UNMET (422)"
      - name: hire_to_exactly_required_allowed_then_one_more_rejected
        grounds:
          - validations[priority=9]
          - errors[ERR_HIRE_EXCEEDS_REQUIRED]
          - entities.WorkforcePlan.fields.hired_headcount
        distinguishing_aspect: |
          Integer headcount metric on the hire endpoint (distinct metric and endpoint from the sibling's
          readiness-index threshold): hired + count == required is allowed (<= boundary), while one more
          hire beyond exact fill is rejected — equality passes, overflow by 1 fails.
        test_recipe:
          setup:
            - "Program M1 with one workforce plan (AVIONICS, required_headcount 10)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/workforce-plans", payload: { skill_code: "AVIONICS", required_headcount: 10 }, as: ProductionPlanner, captures: { wf_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/workforce-plans/${wf_id}/hire", payload: { count: 6 }, as: ProductionPlanner, captures: { h1: "$.data.hired_headcount" } }
            - { call: "POST /api/workforce-plans/${wf_id}/hire", payload: { count: 4 }, as: ProductionPlanner, captures: { h2: "$.data.hired_headcount", ratio: "$.data.readiness_ratio" } }
            - { call: "POST /api/workforce-plans/${wf_id}/hire", payload: { count: 1 }, as: ProductionPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "after count 6: hired_headcount == 6"
            - "after count 4: hired_headcount == 10 exactly and readiness_ratio == 1.0 (exact fill allowed)"
            - "one more hire rejected with ERR_HIRE_EXCEEDS_REQUIRED (422); hired_headcount stays 10"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: flight_test_blocked_by_quality_hold_then_allowed
        grounds:
          - validations[priority=5]
          - errors[ERR_QUALITY_HOLD]
          - state_machines.AircraftUnit.quality_status.CLEAR_to_quality_status.HOLD
        distinguishing_aspect: |
          Entity pair FlightTest x AircraftUnit-quality: flight-test scheduling is gated by the aircraft's
          quality_status dimension, which is itself driven by QualityEscape state; the gate closes on escape
          creation and reopens only when the escape reaches CLOSED.
        test_recipe:
          setup:
            - "Program M1; customer AL1; aircraft line 4002 ASSEMBLY_COMPLETE with delivery pipeline in FLIGHT_TESTING; one open MAJOR escape (quality HOLD)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 4002, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp_id: "$.data.id" } }
            - { call: "POST /api/work-packages/${wp_id}/complete", payload: {}, as: LineManager }
            - { call: "POST /api/aircraft-units/${ac_id}/begin-delivery", payload: {}, as: DeliveryManager }
            - { call: "POST /api/aircraft-units/${ac_id}/quality-escapes", payload: { severity: "MAJOR", description: "Hydraulic seep" }, as: QualityInspector, as_user_id: "insp-1", captures: { esc_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/aircraft-units/${ac_id}/flight-tests", payload: { range_code: "RANGE_ALPHA", window_start: "2026-10-02T09:00:00Z", window_end: "2026-10-02T12:00:00Z" }, as: DeliveryManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/quality-escapes/${esc_id}/notify-regulator", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/quality-escapes/${esc_id}/begin-root-cause", payload: { conformance_refs: ["DOC-2"] }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/quality-escapes/${esc_id}/disposition", payload: { disposition_code: "USE_AS_IS" }, as: QualityInspector, as_user_id: "insp-2" }
            - { call: "POST /api/quality-escapes/${esc_id}/close", payload: {}, as: QualityInspector, as_user_id: "insp-2" }
            - { call: "POST /api/aircraft-units/${ac_id}/flight-tests", payload: { range_code: "RANGE_ALPHA", window_start: "2026-10-02T09:00:00Z", window_end: "2026-10-02T12:00:00Z" }, as: DeliveryManager, captures: { ft_id: "$.data.id", ft_st: "$.data.status" } }
          assert:
            - "while the escape is open: flight-test creation rejected with ERR_QUALITY_HOLD (409)"
            - "after the escape closes: identical flight-test creation succeeds (201) with status SCHEDULED"
      - name: storage_release_blocked_by_open_rework_then_allowed
        grounds:
          - validations[priority=5]
          - errors[ERR_REWORK_ORDERS_OPEN]
          - state_machines.StoragePreservation.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Entity pair StoragePreservation x ReworkOrder (distinct from the sibling's FlightTest x
          AircraftUnit pair): releasing a stored aircraft is gated by the absence of OPEN rework orders
          on that aircraft; closing the rework unblocks the release.
        test_recipe:
          setup:
            - "Program M1 (budget 1000000); customer AL1; aircraft line 4003 ASSEMBLY_COMPLETE then IN_STORAGE (bay B1); an escape with an OPEN escape-sourced rework order"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 4003, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp_id: "$.data.id" } }
            - { call: "POST /api/work-packages/${wp_id}/complete", payload: {}, as: LineManager }
            - { call: "POST /api/aircraft-units/${ac_id}/storage-preservations", payload: { bay_code: "B1", window_start: "2026-09-10T00:00:00Z", window_end: "2026-12-01T00:00:00Z", daily_rate_cents: 1000, preservation_cycle_days: 30 }, as: DeliveryManager, captures: { sp_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/quality-escapes", payload: { severity: "MAJOR", description: "Corrosion found in storage" }, as: QualityInspector, as_user_id: "insp-1", captures: { esc_id: "$.data.id" } }
            - { call: "POST /api/quality-escapes/${esc_id}/rework-orders", payload: { estimated_hours: 3 }, as: QualityInspector, as_user_id: "insp-1", captures: { rw_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/storage-preservations/${sp_id}/release", payload: {}, as: DeliveryManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/rework-orders/${rw_id}/close", payload: { actual_hours: 3, parts_cents: 0 }, as: LineManager }
            - { call: "POST /api/storage-preservations/${sp_id}/release", payload: {}, as: DeliveryManager, captures: { sp_st: "$.data.status" } }
            - { call: "GET /api/aircraft-units/${ac_id}", payload: {}, as: DeliveryManager, captures: { prod: "$.data.production_status" } }
          assert:
            - "first release rejected with ERR_REWORK_ORDERS_OPEN (409) while the rework order is OPEN"
            - "after rework close: release succeeds, StoragePreservation.${sp_id}.status == RELEASED"
            - "AircraftUnit.${ac_id}.production_status returns to ASSEMBLY_COMPLETE"

  - rule_id: resource_temporal_overlap
    instances:
      - name: range_windows_half_open_adjacent_allowed_overlap_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_RANGE_WINDOW_OVERLAP]
          - entities.FlightTest.fields.range_code
        distinguishing_aspect: |
          Half-open interval semantics on the flight-test range resource: [start, end) means a test starting
          exactly when another ends is NOT a conflict, while any strict interior intersection is; the
          resource key is range_code, independent across RANGE_ALPHA and RANGE_BRAVO.
        test_recipe:
          setup:
            - "Program M1; customer AL1; aircraft line 4004 ASSEMBLY_COMPLETE in FLIGHT_TESTING"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 4004, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp_id: "$.data.id" } }
            - { call: "POST /api/work-packages/${wp_id}/complete", payload: {}, as: LineManager }
            - { call: "POST /api/aircraft-units/${ac_id}/begin-delivery", payload: {}, as: DeliveryManager }
          trigger:
            - { call: "POST /api/aircraft-units/${ac_id}/flight-tests", payload: { range_code: "RANGE_ALPHA", window_start: "2026-10-01T09:00:00Z", window_end: "2026-10-01T12:00:00Z" }, as: DeliveryManager, captures: { ft1: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/flight-tests", payload: { range_code: "RANGE_ALPHA", window_start: "2026-10-01T12:00:00Z", window_end: "2026-10-01T15:00:00Z" }, as: DeliveryManager, captures: { ft2: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/flight-tests", payload: { range_code: "RANGE_ALPHA", window_start: "2026-10-01T11:00:00Z", window_end: "2026-10-01T13:00:00Z" }, as: DeliveryManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/flight-tests", payload: { range_code: "RANGE_BRAVO", window_start: "2026-10-01T11:00:00Z", window_end: "2026-10-01T13:00:00Z" }, as: DeliveryManager, captures: { ft4: "$.data.id" } }
          assert:
            - "test [09:00,12:00) and test [12:00,15:00) on RANGE_ALPHA both created (adjacency allowed under half-open semantics)"
            - "test [11:00,13:00) on RANGE_ALPHA rejected with ERR_RANGE_WINDOW_OVERLAP (409)"
            - "identical window on RANGE_BRAVO created — overlap is per-range, not global"
      - name: bay_windows_turnaround_buffer_rejects_one_day_gap
        grounds:
          - validations[priority=8]
          - errors[ERR_BAY_WINDOW_OVERLAP]
          - entities.StoragePreservation.fields.bay_code
        distinguishing_aspect: |
          Different interval semantics from the sibling (closed intervals PLUS a 2-day turnaround buffer,
          on the storage-bay resource rather than the test range): a 1-day gap between windows is a
          conflict here even though half-open semantics would allow adjacency; only a gap larger than
          the buffer (3 days) is accepted.
        test_recipe:
          setup:
            - "Program M1; customer AL1; aircraft lines 4005 and 4006 both ASSEMBLY_COMPLETE"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 4005, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac1_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac1_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp1_id: "$.data.id" } }
            - { call: "POST /api/work-packages/${wp1_id}/complete", payload: {}, as: LineManager }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 4006, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac2_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac2_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp2_id: "$.data.id" } }
            - { call: "POST /api/work-packages/${wp2_id}/complete", payload: {}, as: LineManager }
          trigger:
            - { call: "POST /api/aircraft-units/${ac1_id}/storage-preservations", payload: { bay_code: "B1", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-20T00:00:00Z", daily_rate_cents: 1000, preservation_cycle_days: 30 }, as: DeliveryManager, captures: { sp1: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac2_id}/storage-preservations", payload: { bay_code: "B1", window_start: "2026-09-21T00:00:00Z", window_end: "2026-09-30T00:00:00Z", daily_rate_cents: 1000, preservation_cycle_days: 30 }, as: DeliveryManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/aircraft-units/${ac2_id}/storage-preservations", payload: { bay_code: "B1", window_start: "2026-09-23T00:00:00Z", window_end: "2026-09-30T00:00:00Z", daily_rate_cents: 1000, preservation_cycle_days: 30 }, as: DeliveryManager, captures: { sp3: "$.data.id" } }
          assert:
            - "window [09-10, 09-20] occupies bay B1"
            - "window starting 09-21 (1-day gap) rejected with ERR_BAY_WINDOW_OVERLAP — the 2-day turnaround buffer extends the closed interval to 09-22"
            - "window starting 09-23 (3-day gap) created — gap exceeds the buffer"

  - rule_id: compensating_invariant
    instances:
      - name: rework_close_then_credit_restores_budget_consumed
        grounds:
          - state_machines.ReworkOrder.OPEN_to_CLOSED
          - state_machines.ReworkOrder.CLOSED_to_CREDITED
          - entities.ProductionProgram.fields.rework_budget_consumed_cents
        distinguishing_aspect: |
          Conserved quantity is money (budget cents): close debits the program rework budget and credit
          is its exact compensating action — consumed returns to the pre-close value while the budget
          total never moves. Invariant: consumed == sum of actual_cost_cents over CLOSED orders only.
        test_recipe:
          setup:
            - "Program M1 (budget 1000000); customer AL1; aircraft line 5001 with one work package (station 1, planned 10)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 5001, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 10 }, as: LineManager, captures: { wp_id: "$.data.id" } }
            - { call: "POST /api/work-packages/${wp_id}/travel", payload: { traveled_hours: 4 }, as: LineManager }
            - { call: "GET /api/aircraft-units/${ac_id}/rework-orders", payload: {}, as: LineManager, captures: { rw_id: "$.data[0].id" } }
          trigger:
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramAdmin, captures: { before: "$.data.rework_budget_consumed_cents", total: "$.data.rework_budget_total_cents" } }
            - { call: "POST /api/rework-orders/${rw_id}/close", payload: { actual_hours: 4, parts_cents: 0 }, as: LineManager, captures: { act: "$.data.actual_cost_cents" } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramAdmin, captures: { after_close: "$.data.rework_budget_consumed_cents" } }
            - { call: "POST /api/rework-orders/${rw_id}/credit", payload: {}, as: LineManager, captures: { rw_st: "$.data.status" } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramAdmin, captures: { after_credit: "$.data.rework_budget_consumed_cents", total2: "$.data.rework_budget_total_cents" } }
          assert:
            - "before close: rework_budget_consumed_cents == 0"
            - "close: actual_cost_cents == 70000 (4 * 17500 + 0) and consumed == 70000"
            - "credit: ReworkOrder.${rw_id}.status == CREDITED and consumed returns to 0 — close + credit conserves the budget"
            - "rework_budget_total_cents == 1000000 before and after (total never mutates)"
      - name: place_order_then_cancel_conserves_ordered_quantity
        grounds:
          - state_machines.SupplierCapacityCommitment.CONFIRMED_to_ORDERED
          - state_machines.SupplierCapacityCommitment.ORDERED_to_CANCELLED
          - entities.SupplierCapacityCommitment.fields.active_ordered_quantity
        distinguishing_aspect: |
          Conserved quantity is component units (distinct from the sibling's money): place-order adds units
          and cancel is its compensating action — ordered_quantity == active_ordered_quantity +
          cancelled_quantity at every step, and the cancel penalty is priced off the cancelled units.
        test_recipe:
          setup:
            - "Program M1; supplier S1 with CONFIRMED commitment (rate 8, lead 4, unit price 1000000)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { supplier_code: "S1", name: "Engines Co", region: "NA" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/suppliers/${s1_id}/capacity-commitments", payload: { program_id: "${prog_id}", component_code: "ENG", committed_rate_per_month: 8, lead_time_months: 4, unit_price_cents: 1000000 }, as: SupplierManager, as_user_id: "${s1_id}", captures: { c_id: "$.data.id" } }
            - { call: "POST /api/capacity-commitments/${c_id}/confirm", payload: {}, as: SupplierManager, as_user_id: "${s1_id}" }
          trigger:
            - { call: "POST /api/capacity-commitments/${c_id}/place-order", payload: { quantity: 10, assumed_rate_per_month: 8, required_by_month: "2027-01" }, as: SupplierManager, as_user_id: "${s1_id}", captures: { ord1: "$.data.ordered_quantity", act1: "$.data.active_ordered_quantity", can1: "$.data.cancelled_quantity" } }
            - { call: "POST /api/capacity-commitments/${c_id}/place-order", payload: { quantity: 5, assumed_rate_per_month: 8, required_by_month: "2027-01" }, as: SupplierManager, as_user_id: "${s1_id}", captures: { ord2: "$.data.ordered_quantity", act2: "$.data.active_ordered_quantity" } }
            - { call: "POST /api/capacity-commitments/${c_id}/cancel", payload: { cancel_quantity: 15 }, as: SupplierManager, as_user_id: "${s1_id}", captures: { ord3: "$.data.ordered_quantity", act3: "$.data.active_ordered_quantity", can3: "$.data.cancelled_quantity", pen3: "$.data.cancellation_penalty_cents", st3: "$.data.status" } }
          assert:
            - "after first order: ordered 10 == active 10 + cancelled 0"
            - "after top-up order: ordered 15 == active 15 + cancelled 0"
            - "after cancel: ordered 15 == active 0 + cancelled 15 and status == CANCELLED (invariant holds across the forward+compensating pair)"
            - "cancellation_penalty_cents == 4500000 (0.30 * 15 * 1000000)"
