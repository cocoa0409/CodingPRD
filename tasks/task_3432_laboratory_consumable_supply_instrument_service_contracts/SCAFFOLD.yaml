scenario: |
  Laboratory Consumable Supply & Instrument Service Contracts (Thermo Fisher Scientific): instrument placement with capital purchase, reagent rental and leasing structures tied to consumable commitments, consumable pull-through modeling where instrument installed base drives recurring revenue, service contract tiers with response time, preventive maintenance visits and parts coverage with renewal management, field service engineer territory coverage, parts logistics and loaner instrument programs, application support and method development assistance for customer workflows, catalog breadth with cold chain, hazardous and controlled item shipping requirements, supply allocation during demand surges with customer prioritization, laboratory consolidation and enterprise agreements with volume tiers

domain_name: "lab-consumable-service-contracts"
api_prefix: "/lab"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate
  notes: |
    Hardness is concentrated in rule depth: one order pipeline whose pricing, allocation,
    and shipping behavior branches on item class / enterprise tier / surge posture; two
    renewal cycles guarded by OCC; a depth-3 credit cascade; and a priority waterfall for
    scarce stock. Logical clock: the server keeps a logical UTC clock whose startup default
    is exactly 2026-09-01T00:00:00Z (never wall-clock); it advances only via
    POST /lab/_clock/set_current_utc. Clock advances drive the delivery sweep, the
    EnterpriseAgreement EXPIRING/EXPIRED derivation, and the ServiceContract
    RENEWAL_DUE/EXPIRED derivation.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Laboratory customer display name."
      - name: segment
        type: enum
        source: input
        description: "Customer segment."
        constraints: "one of {ACADEMIC, PHARMA, CLINICAL, INDUSTRIAL}"
      - name: priority_class
        type: enum
        source: input
        description: "Supply-allocation priority class used by surge scoring."
        constraints: "one of {STANDARD, PRIORITY, CRITICAL}"
        default: STANDARD
      - name: territory_code
        type: string
        source: input
        description: "Service territory code; engineer dispatch matches on this."
      - name: controlled_substance_license
        type: boolean
        source: input
        description: "Whether the account holds a controlled-substance receiving license."
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; mutated via PATCH /lab/accounts/{id} status field."
        constraints: "one of {ACTIVE, SUSPENDED, CLOSED}; initial ACTIVE"
        default: ACTIVE
      - name: credit_status
        type: enum
        source: computed
        description: "GOOD or HOLD; recomputed and persisted on every outstanding_balance_cents mutation per calculations.credit_hold_evaluation."
        constraints: "one of {GOOD, HOLD}; initial GOOD"
        default: GOOD
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Open receivables: invoices posted at order ship and contract early-termination fees; starts at 0."
        default: 0
      - name: trailing_spend_cents
        type: integer
        source: computed
        description: "Sum of total_cents over this account's DELIVERED orders with delivered_at >= now - 365 days (computed at read; never a stored mutation)."

  - name: EnterpriseAgreement
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the covered account. At most one non-terminal agreement per account per time window (half-open overlap rule)."
      - name: start_date
        type: datetime
        source: input
        description: "Coverage window start, ISO8601 UTC."
      - name: end_date
        type: datetime
        source: input
        description: "Coverage window end (exclusive), ISO8601 UTC; must be after start_date."
      - name: committed_annual_spend_cents
        type: integer
        source: input
        description: "Committed annual consumable spend in cents."
      - name: status
        type: enum
        source: computed
        description: "Derived at read from terminated_at/end_date/clock: TERMINATED if terminated_at set; else EXPIRED if now >= end_date; else EXPIRING if now >= end_date - 60 days; else ACTIVE. Derived transitions never bump version."
        constraints: "one of {ACTIVE, EXPIRING, EXPIRED, TERMINATED}"
      - name: current_tier
        type: enum
        source: computed
        description: "Volume tier from account.trailing_spend_cents per calculations.ea_tier_discount."
        constraints: "one of {BASE, SILVER, GOLD, PLATINUM}"
      - name: discount_pct
        type: integer
        source: computed
        description: "Order discount percentage for the current tier: BASE 0, SILVER 5, GOLD 10, PLATINUM 15."
      - name: renewal_count
        type: integer
        source: system
        description: "Number of successful renewals; increments on each renew."
        default: 0
      - name: terminated_at
        type: datetime
        source: system
        description: "Set by POST /lab/enterprise-agreements/{id}/terminate; null otherwise."
        default: null

  - name: Instrument
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning customer account."
      - name: model
        type: string
        source: input
        description: "Instrument model code (e.g. SEQ-5000); loaner units match on this."
      - name: serial_number
        type: string
        source: input
        description: "Manufacturer serial."
      - name: placement_type
        type: enum
        source: input
        description: "Commercial structure of the placement."
        constraints: "one of {CAPITAL, REAGENT_RENTAL, LEASE}"
      - name: monthly_consumable_commitment_cents
        type: integer
        source: input
        description: "Monthly committed consumable spend; required and must be > 0 when placement_type is REAGENT_RENTAL or LEASE; must be 0 for CAPITAL."
        default: 0
      - name: monthly_baseline_consumable_cents
        type: integer
        source: input
        description: "Expected monthly consumable revenue baseline for pull-through projection."
        default: 0
      - name: placement_status
        type: enum
        source: system
        description: "ORDERED on create; INSTALLED after install; DECOMMISSIONED after decommission (terminal)."
        constraints: "one of {ORDERED, INSTALLED, DECOMMISSIONED}"
        default: ORDERED
      - name: operational_status
        type: enum
        source: computed
        description: "DOWN while any OPEN or DISPATCHED BREAK_FIX ServiceRequest with severity CRITICAL exists on this instrument; else UP. Derived independently of placement_status."
        constraints: "one of {UP, DOWN}"
        default: UP
      - name: installed_at
        type: datetime
        source: system
        description: "Set by install transition; null while ORDERED."
        default: null
  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - name: instrument_id
        type: string
        source: input
        description: "FK -> Instrument.id; covered instrument (must be placement_status INSTALLED). At most one non-terminal contract per instrument."
      - name: tier
        type: enum
        source: input
        description: "Service tier; drives all entitlement fields below."
        constraints: "one of {BRONZE, SILVER, GOLD, PLATINUM}"
      - name: response_hours
        type: integer
        source: computed
        description: "Guaranteed on-site response window: BRONZE 72, SILVER 48, GOLD 24, PLATINUM 8."
      - name: pm_visits_per_year
        type: integer
        source: computed
        description: "Included preventive-maintenance visits per contract term: BRONZE 1, SILVER 2, GOLD 4, PLATINUM 12."
      - name: parts_coverage_pct
        type: integer
        source: computed
        description: "Percentage of parts cost covered: BRONZE 0, SILVER 50, GOLD 90, PLATINUM 100. Labor is 100% covered on every active tier."
      - name: loaner_eligible
        type: boolean
        source: computed
        description: "True for GOLD and PLATINUM only."
      - name: monthly_value_cents
        type: integer
        source: computed
        description: "Contract monthly value for early-termination fee: BRONZE 50000, SILVER 120000, GOLD 300000, PLATINUM 800000."
      - name: start_date
        type: datetime
        source: input
        description: "Coverage start, ISO8601 UTC."
      - name: end_date
        type: datetime
        source: input
        description: "Coverage end (exclusive), ISO8601 UTC; must be after start_date."
      - name: status
        type: enum
        source: computed
        description: "Derived at read: CANCELLED if cancelled_at set; else EXPIRED if now >= end_date; else RENEWAL_DUE if now >= end_date - 30 days; else ACTIVE. Derived transitions never bump version."
        constraints: "one of {ACTIVE, RENEWAL_DUE, EXPIRED, CANCELLED}"
      - name: used_pm_visits
        type: integer
        source: system
        description: "PM visits consumed within the current term [start_date, end_date); increments only when a PM resolve is within quota."
        default: 0
      - name: renewal_count
        type: integer
        source: system
        description: "Number of successful renewals."
        default: 0
      - name: cancelled_at
        type: datetime
        source: system
        description: "Set by POST /lab/service-contracts/{id}/cancel; null otherwise."
        default: null

  - name: Engineer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Field service engineer name."
      - name: territory_code
        type: string
        source: input
        description: "Coverage territory; dispatch eligibility matches Account.territory_code of the request instrument."
      - name: skills
        type: array
        source: input
        description: "Skill tags; dispatch requires the skill matching request_type, install requires INSTALL."
        constraints: "array of {BREAK_FIX, PM, APP_SUPPORT, METHOD_DEV, INSTALL}; at least one"
      - name: status
        type: enum
        source: input
        description: "ACTIVE engineers are dispatch-eligible."
        constraints: "one of {ACTIVE, INACTIVE}"
        default: ACTIVE
      - name: open_ticket_count
        type: integer
        source: computed
        description: "Count of ServiceRequests in DISPATCHED with engineer_id == this engineer (computed at read)."
        default: 0

  - name: ServiceRequest
    parent: null
    common_fields: true
    fields:
      - name: instrument_id
        type: string
        source: input
        description: "FK -> Instrument.id; instrument needing service (must be placement_status INSTALLED)."
      - name: engineer_id
        type: string
        source: system
        description: "FK -> Engineer.id; assigned at dispatch by the selector policy; null while OPEN."
        default: null
      - name: loaner_unit_id
        type: string
        source: system
        description: "FK -> LoanerUnit.id; set when a loaner is reserved; retained after return for audit."
        default: null
      - name: request_type
        type: enum
        source: input
        description: "Kind of work."
        constraints: "one of {BREAK_FIX, PREVENTIVE_MAINTENANCE, APP_SUPPORT, METHOD_DEV}"
      - name: severity
        type: enum
        source: input
        description: "Customer-reported severity; CRITICAL BREAK_FIX flips instrument operational_status to DOWN."
        constraints: "one of {LOW, MEDIUM, HIGH, CRITICAL}"
      - name: scheduled_for
        type: datetime
        source: input
        description: "Planned visit instant; REQUIRED iff request_type == PREVENTIVE_MAINTENANCE (else ERR_INVALID_REQUEST); ignored for other types."
        default: null
      - name: status
        type: enum
        source: system
        description: "OPEN on create; DISPATCHED after dispatch; RESOLVED after resolve (terminal)."
        constraints: "one of {OPEN, DISPATCHED, RESOLVED}"
        default: OPEN
      - name: opened_at
        type: datetime
        source: system
        description: "Logical clock at creation."
      - name: response_deadline
        type: datetime
        source: computed
        description: "opened_at + response_hours of the ACTIVE/RENEWAL_DUE contract on the instrument at open time; opened_at + 72h when no such contract exists."
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical clock at resolve; null until RESOLVED."
        default: null
      - name: sla_breached
        type: boolean
        source: computed
        description: "resolved_at > response_deadline, computed at resolve."
        default: false
      - name: hours_on_site
        type: number
        source: input
        description: "Labor hours, supplied at resolve."
      - name: parts_cost_cents
        type: integer
        source: input
        description: "Parts list cost in cents, supplied at resolve."
        default: 0
      - name: billable_cents
        type: integer
        source: computed
        description: "Customer-billable portion per calculations.service_billing_split."
        default: 0
      - name: covered_cents
        type: integer
        source: computed
        description: "Contract-covered portion per calculations.service_billing_split."
        default: 0
      - name: credit_memo_cents
        type: integer
        source: computed
        description: "SLA-breach credit: round_half_up(billable_cents * 0.10) when sla_breached, else 0."
        default: 0

  - name: LoanerUnit
    parent: null
    common_fields: true
    fields:
      - name: model
        type: string
        source: input
        description: "Instrument model code; reservable only for service requests whose instrument has the same model."
      - name: serial_number
        type: string
        source: input
        description: "Unit serial."
      - name: status
        type: enum
        source: system
        description: "AVAILABLE on create; RESERVED while attached to an unresolved service request; returns to AVAILABLE when that request resolves."
        constraints: "one of {AVAILABLE, RESERVED}"
        default: AVAILABLE

  - name: CatalogItem
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Catalog stock-keeping unit; unique across all items."
      - name: name
        type: string
        source: input
        description: "Display name."
      - name: item_class
        type: enum
        source: input
        description: "Shipping/handling class."
        constraints: "one of {STANDARD, COLD_CHAIN, HAZARDOUS, CONTROLLED}"
      - name: allocation_group
        type: enum
        source: input
        description: "Supply-allocation group targeted by surge events."
        constraints: "one of {GROUP_A, GROUP_B, GROUP_C}"
      - name: base_price_cents
        type: integer
        source: input
        description: "List unit price in cents; must be > 0."
      - name: stock_on_hand
        type: integer
        source: input
        description: "Physical units on hand; decremented (with reserved_quantity) when an order ships."
      - name: reserved_quantity
        type: integer
        source: system
        description: "Units reserved by ALLOCATED orders; released on cancel; consumed on ship."
        default: 0
      - name: available_stock
        type: integer
        source: computed
        description: "stock_on_hand - reserved_quantity; never negative."

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; purchasing account."
      - name: lines
        type: array
        source: input
        description: "Array of {sku, quantity}; non-empty; quantity integer > 0; every sku must exist in the catalog."
      - name: status
        type: enum
        source: system
        description: "DRAFT on create; submit moves to ALLOCATED or BACKORDERED; SHIPPED after ship; DELIVERED by clock sweep after transit; CANCELLED by cancel (terminal). DELIVERED and CANCELLED are terminal."
        constraints: "one of {DRAFT, ALLOCATED, BACKORDERED, SHIPPED, DELIVERED, CANCELLED}"
        default: DRAFT
      - name: shipping_class
        type: enum
        source: computed
        description: "Most restrictive class among lines, precedence CONTROLLED > HAZARDOUS > COLD_CHAIN > STANDARD; null until submit."
        constraints: "one of {STANDARD, COLD_CHAIN, HAZARDOUS, CONTROLLED}"
        default: null
      - name: handling_fee_cents
        type: integer
        source: computed
        description: "Single per-order fee by shipping_class: STANDARD 0, COLD_CHAIN 4500, HAZARDOUS 7500, CONTROLLED 9500."
        default: 0
      - name: discount_pct
        type: integer
        source: computed
        description: "Snapshot of the account's ACTIVE/EXPIRING EnterpriseAgreement discount_pct at submit; 0 when none."
        default: 0
      - name: goods_subtotal_cents
        type: integer
        source: computed
        description: "Sum over lines of round_half_up(base_price_cents * quantity * (100 - discount_pct)/100); per-line rounding pinned by calculations.order_total_pricing."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "goods_subtotal_cents + handling_fee_cents; frozen at submit."
        default: 0
      - name: total_quantity
        type: integer
        source: computed
        description: "Sum of line quantities; waterfall tie-break input."
        default: 0
      - name: allocation_score
        type: number
        source: computed
        description: "Frozen at submit when the order goes BACKORDERED: PRIORITY_WEIGHT x TIER_MULT per calculations.surge_allocation_scoring; null otherwise."
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical clock at submit; waterfall tie-break input."
        default: null
      - name: shipped_at
        type: datetime
        source: system
        description: "Logical clock at ship."
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: "shipped_at + transit days for shipping_class, set by the delivery sweep."
        default: null

  - name: SurgeEvent
    parent: null
    common_fields: true
    fields:
      - name: allocation_group
        type: enum
        source: input
        description: "Catalog allocation group under surge."
        constraints: "one of {GROUP_A, GROUP_B, GROUP_C}"
      - name: reason
        type: string
        source: input
        description: "Free-text surge reason."
      - name: status
        type: enum
        source: system
        description: "ACTIVE on create; RESOLVED after resolve (terminal). At most one ACTIVE surge per allocation_group."
        constraints: "one of {ACTIVE, RESOLVED}"
        default: ACTIVE
      - name: started_at
        type: datetime
        source: system
        description: "Logical clock at creation."
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical clock at resolve."
        default: null

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /lab/accounts/{id} with status=SUSPENDED"
        actor: AccountManager
        preconditions: ["account.status == ACTIVE"]
        side_effects: ["increments Account.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /lab/accounts/{id} with status=ACTIVE"
        actor: AccountManager
        preconditions: ["account.status == SUSPENDED"]
        side_effects: ["increments Account.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "PATCH /lab/accounts/{id} with status=CLOSED"
        actor: AccountManager
        preconditions: ["account.status == ACTIVE"]
        side_effects: ["increments Account.version by 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "PATCH /lab/accounts/{id} with status=CLOSED"
        actor: AccountManager
        preconditions: ["account.status == SUSPENDED"]
        side_effects: ["increments Account.version by 1"]
    note: "CLOSED is terminal; any further PATCH attempting a status change returns ERR_INVALID_STATE."

  - entity: EnterpriseAgreement
    initial_state: ACTIVE
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: EXPIRING
        trigger: "derived at read: logical clock >= end_date - 60 days"
        actor: system
        preconditions: ["terminated_at is null", "now < end_date"]
        side_effects: []
        note: "Derived-from-dates status change; never bumps version."
      - from: EXPIRING
        to: ACTIVE
        trigger: "POST /lab/enterprise-agreements/{id}/renew"
        actor: AccountManager
        preconditions: ["status == EXPIRING", "expected_agreement_version == current version"]
        side_effects: ["end_date += 12 months", "renewal_count += 1", "increments EnterpriseAgreement.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "derived at read: logical clock >= end_date"
        actor: system
        preconditions: ["terminated_at is null"]
        side_effects: []
      - from: EXPIRING
        to: EXPIRED
        trigger: "derived at read: logical clock >= end_date"
        actor: system
        preconditions: ["terminated_at is null"]
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /lab/enterprise-agreements/{id}/terminate"
        actor: AccountManager
        preconditions: ["status in {ACTIVE, EXPIRING}"]
        side_effects: ["terminated_at := now", "increments EnterpriseAgreement.version by 1"]
      - from: EXPIRING
        to: TERMINATED
        trigger: "POST /lab/enterprise-agreements/{id}/terminate"
        actor: AccountManager
        preconditions: ["status in {ACTIVE, EXPIRING}"]
        side_effects: ["terminated_at := now", "increments EnterpriseAgreement.version by 1"]

  - entity: Instrument
    initial_state: ORDERED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ORDERED
        to: INSTALLED
        trigger: "POST /lab/instruments/{id}/install"
        actor: ServiceDispatcher
        preconditions:
          - "placement_status == ORDERED"
          - "account (Instrument.account_id) status == ACTIVE"
          - "at least one Engineer with status ACTIVE, territory_code == account.territory_code, and skills containing INSTALL exists"
        side_effects: ["installed_at := now", "increments Instrument.version by 1"]
      - from: INSTALLED
        to: DECOMMISSIONED
        trigger: "POST /lab/instruments/{id}/decommission"
        actor: AccountManager
        preconditions:
          - "placement_status == INSTALLED"
          - "no ServiceRequest on this instrument in {OPEN, DISPATCHED}"
          - "no ServiceContract on this instrument in {ACTIVE, RENEWAL_DUE}"
        side_effects: ["increments Instrument.version by 1"]
    note: "operational_status is a second, independent derived dimension: DOWN while any OPEN/DISPATCHED BREAK_FIX request with severity CRITICAL exists on the instrument; else UP. Derived; never bumps version."

  - entity: ServiceContract
    initial_state: ACTIVE
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: RENEWAL_DUE
        trigger: "derived at read: logical clock >= end_date - 30 days"
        actor: system
        preconditions: ["cancelled_at is null", "now < end_date"]
        side_effects: []
      - from: RENEWAL_DUE
        to: ACTIVE
        trigger: "POST /lab/service-contracts/{id}/renew"
        actor: AccountManager
        preconditions: ["status == RENEWAL_DUE", "expected_contract_version == current version"]
        side_effects: ["end_date += 12 months", "renewal_count += 1", "increments ServiceContract.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "derived at read: logical clock >= end_date"
        actor: system
        preconditions: ["cancelled_at is null"]
        side_effects: []
      - from: RENEWAL_DUE
        to: EXPIRED
        trigger: "derived at read: logical clock >= end_date"
        actor: system
        preconditions: ["cancelled_at is null"]
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /lab/service-contracts/{id}/cancel"
        actor: AccountManager
        preconditions: ["status in {ACTIVE, RENEWAL_DUE}"]
        side_effects:
          - "cancelled_at := now; increments ServiceContract.version by 1"
          - "calculations.early_termination_fee: fee posted to Account.outstanding_balance_cents (link 1)"
          - "calculations.credit_hold_evaluation on the account: balance > 2000000 flips credit_status to HOLD (link 2)"
          - "transition to HOLD cancels every DRAFT Order of the account (link 3)"
      - from: RENEWAL_DUE
        to: CANCELLED
        trigger: "POST /lab/service-contracts/{id}/cancel"
        actor: AccountManager
        preconditions: ["status in {ACTIVE, RENEWAL_DUE}"]
        side_effects:
          - "cancelled_at := now; increments ServiceContract.version by 1"
          - "calculations.early_termination_fee: fee posted to Account.outstanding_balance_cents (link 1)"
          - "calculations.credit_hold_evaluation on the account (link 2)"
          - "transition to HOLD cancels every DRAFT Order of the account (link 3)"

  - entity: ServiceRequest
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /lab/service-requests/{id}/dispatch"
        actor: ServiceDispatcher
        preconditions:
          - "status == OPEN"
          - "selector: engineers with status ACTIVE, territory_code == instrument account territory_code, skills containing the request_type's skill ({BREAK_FIX: BREAK_FIX, PREVENTIVE_MAINTENANCE: PM, APP_SUPPORT: APP_SUPPORT, METHOD_DEV: METHOD_DEV}); empty eligible set -> ERR_NO_ELIGIBLE_ENGINEER; every eligible engineer already has 4 DISPATCHED tickets today (UTC calendar day) -> ERR_ENGINEER_CAPACITY_EXCEEDED"
        side_effects:
          - "engineer_id := selected engineer (rank: open_ticket_count ASC, tie -> Engineer.created_at ASC, then Engineer.name ASC)"
          - "increments ServiceRequest.version by 1"
      - from: DISPATCHED
        to: RESOLVED
        trigger: "POST /lab/service-requests/{id}/resolve"
        actor: ServiceDispatcher
        preconditions:
          - "status == DISPATCHED"
          - "actor is ServiceDispatcher, or the FieldEngineer whose id == engineer_id"
        side_effects:
          - "resolved_at := now; sla_breached := (resolved_at > response_deadline)"
          - "calculations.service_billing_split computes billable_cents/covered_cents/credit_memo_cents"
          - "PM within quota: used_pm_visits += 1 on the contract"
          - "invoice billable_cents - credit_memo_cents posted to Account.outstanding_balance_cents; calculations.credit_hold_evaluation runs"
          - "if loaner_unit_id set: that LoanerUnit.status := AVAILABLE"
          - "instrument operational_status rederived (UP once no CRITICAL BREAK_FIX remains open)"
          - "increments ServiceRequest.version by 1"

  - entity: LoanerUnit
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /lab/service-requests/{id}/loaner"
        actor: ServiceDispatcher
        preconditions:
          - "service request status in {OPEN, DISPATCHED}, request_type == BREAK_FIX, severity in {HIGH, CRITICAL}"
          - "instrument has a ServiceContract in {ACTIVE, RENEWAL_DUE} with loaner_eligible == true, else ERR_LOANER_NOT_ELIGIBLE"
          - "selector: LoanerUnits with status AVAILABLE and model == instrument.model, ranked created_at ASC with ties broken by serial_number ASC; empty set -> ERR_NO_LOANER_AVAILABLE"
        side_effects:
          - "ServiceRequest.loaner_unit_id := selected unit"
          - "increments LoanerUnit.version by 1"
      - from: RESERVED
        to: AVAILABLE
        trigger: "side effect of POST /lab/service-requests/{id}/resolve on the holding request"
        actor: system
        preconditions: []
        side_effects: ["increments LoanerUnit.version by 1"]

  - entity: Order
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ALLOCATED
        trigger: "POST /lab/orders/{id}/submit"
        actor: LabProcurement
        preconditions:
          - "status == DRAFT"
          - "account status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "no CONTROLLED line unless account.controlled_substance_license (ERR_CONTROLLED_LICENSE_REQUIRED)"
          - "account credit_status == GOOD (ERR_CREDIT_HOLD)"
          - "no ACTIVE SurgeEvent on any line's allocation_group AND every line's available_stock >= quantity"
        side_effects:
          - "pricing snapshot per calculations.order_total_pricing (goods_subtotal_cents, discount_pct, handling_fee_cents, shipping_class, total_cents, total_quantity)"
          - "reserve stock: CatalogItem.reserved_quantity += quantity per line"
          - "submitted_at := now; increments Order.version by 1"
      - from: DRAFT
        to: BACKORDERED
        trigger: "POST /lab/orders/{id}/submit"
        actor: LabProcurement
        preconditions:
          - "status == DRAFT; account ACTIVE; license and credit checks pass"
          - "an ACTIVE SurgeEvent covers at least one line's allocation_group OR some line's available_stock < quantity"
        side_effects:
          - "pricing snapshot per calculations.order_total_pricing"
          - "allocation_score frozen per calculations.surge_allocation_scoring; submitted_at := now"
          - "no stock reserved while BACKORDERED"
          - "increments Order.version by 1"
      - from: BACKORDERED
        to: ALLOCATED
        trigger: "waterfall inside POST /lab/surge-events/{id}/resolve"
        actor: system
        preconditions: ["order has a line in the resolved surge's allocation_group", "all lines now satisfiable from available_stock"]
        side_effects:
          - "reserve stock per line (CatalogItem.reserved_quantity += quantity)"
          - "increments Order.version by 1"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /lab/orders/{id}/ship"
        actor: SupplyOps
        preconditions: ["status == ALLOCATED"]
        side_effects:
          - "shipped_at := now; CatalogItem.stock_on_hand -= quantity and reserved_quantity -= quantity per line"
          - "invoice total_cents posted to Account.outstanding_balance_cents; calculations.credit_hold_evaluation runs"
          - "increments Order.version by 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "delivery sweep inside POST /lab/_clock/set_current_utc: now >= shipped_at + TRANSIT_DAYS[shipping_class]"
        actor: system
        preconditions: ["status == SHIPPED"]
        side_effects:
          - "delivered_at := shipped_at + TRANSIT_DAYS[shipping_class] (STANDARD 3, COLD_CHAIN 1, HAZARDOUS 5, CONTROLLED 4 days)"
          - "account.trailing_spend_cents now includes this order (computed at read)"
          - "increments Order.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /lab/orders/{id}/cancel"
        actor: LabProcurement
        preconditions: ["status in {DRAFT, BACKORDERED, ALLOCATED}"]
        side_effects: ["increments Order.version by 1"]
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /lab/orders/{id}/cancel"
        actor: LabProcurement
        preconditions: ["status in {DRAFT, BACKORDERED, ALLOCATED}"]
        side_effects: ["increments Order.version by 1"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /lab/orders/{id}/cancel"
        actor: LabProcurement
        preconditions: ["status in {DRAFT, BACKORDERED, ALLOCATED}"]
        side_effects: ["release reservations: CatalogItem.reserved_quantity -= quantity per line", "increments Order.version by 1"]

  - entity: SurgeEvent
    initial_state: ACTIVE
    terminal_states: [RESOLVED]
    transitions:
      - from: ACTIVE
        to: RESOLVED
        trigger: "POST /lab/surge-events/{id}/resolve"
        actor: SupplyOps
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "resolved_at := now (link 1)"
          - "waterfall promotion per calculations.surge_allocation_scoring: BACKORDERED orders with a line in this group are considered in pinned order; fully satisfiable orders become ALLOCATED (link 2)"
          - "each promotion reserves CatalogItem stock (link 3)"
          - "increments SurgeEvent.version by 1"

# =============================================================================
# Concurrency Rules (§1.2.1) — true CREATE-with-supersede-style races only,
# resolved by OCC on the parent entity's version field.
# =============================================================================
concurrency_rules:
  - rule_id: ea-renew-stale-version
    parent_entity: EnterpriseAgreement
    write_endpoint: "POST /lab/enterprise-agreements/{id}/renew"
    occ_field: "expected_agreement_version"
    description: |
      Renewing an EnterpriseAgreement whose version has advanced past the version the
      client last observed is rejected. A prior renew already extended end_date and moved
      the agreement back to ACTIVE, so applying a second renew against the stale view
      would double-extend the term; the stale request is refused instead.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: contract-renew-stale-version
    parent_entity: ServiceContract
    write_endpoint: "POST /lab/service-contracts/{id}/renew"
    occ_field: "expected_contract_version"
    description: |
      Renewing a ServiceContract whose version has advanced past the version the client
      last observed is rejected. A prior renew already extended end_date and reset the
      status derivation, so applying a second renew against the stale view would
      double-extend coverage; the stale request is refused instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: ea_tier_discount
    trigger: "Computed at read on EnterpriseAgreement (current_tier, discount_pct) and sampled at Order submit."
    algorithm: tiered_pricing
    formula: |
      trailing = sum(Order.total_cents) over orders with
        account_id == agreement.account_id AND status == DELIVERED
        AND delivered_at >= now - TRAILING_WINDOW_DAYS days
      tier = BASE        if trailing <  SILVER_FLOOR_CENTS
             SILVER      if SILVER_FLOOR_CENTS <= trailing <  GOLD_FLOOR_CENTS
             GOLD        if GOLD_FLOOR_CENTS   <= trailing <  PLATINUM_FLOOR_CENTS
             PLATINUM    if trailing >= PLATINUM_FLOOR_CENTS
      discount_pct = {BASE: 0, SILVER: 5, GOLD: 10, PLATINUM: 15}[tier]
      Boundaries are inclusive on the lower edge: trailing == 50000000 is GOLD.
    input_set: "DELIVERED orders of the agreement's account inside the trailing 365-day window only; DRAFT/BACKORDERED/ALLOCATED/SHIPPED/CANCELLED excluded."
    constants:
      TRAILING_WINDOW_DAYS: 365
      SILVER_FLOOR_CENTS: 10000000
      GOLD_FLOOR_CENTS: 50000000
      PLATINUM_FLOOR_CENTS: 200000000
      BASE_PCT: 0
      SILVER_PCT: 5
      GOLD_PCT: 10
      PLATINUM_PCT: 15
    precision: "integer cents; percentages are whole numbers"
    variants:
      - name: band_rate_flat
        when: "PINNED for order pricing: the flat rate of the current band applies to every line."
        difference: "trailing 60000000 (GOLD) prices a 10000-cent line at 9000."
      - name: blended_marginal_rate
        when: "Rejected alternative reading: effective blended rate of marginal slices across bands."
        difference: "trailing 60000000 would blend (40000000*5% + 20000000*10%)/60000000 = 6.667% and price the same line at 9333; the scaffold pins band_rate_flat, so 9333 is WRONG."

  - name: order_total_pricing
    trigger: "POST /lab/orders/{id}/submit (pricing snapshot; frozen afterwards)."
    algorithm: aggregation
    formula: |
      discount_pct = account's ACTIVE/EXPIRING EnterpriseAgreement.discount_pct, else 0
      for each line: line_net = round_half_up(base_price_cents * quantity * (100 - discount_pct) / 100)
      goods_subtotal_cents = sum(line_net)          # PINNED ORDER: round each line FIRST, then sum
      shipping_class = most restrictive class among lines, precedence CONTROLLED > HAZARDOUS > COLD_CHAIN > STANDARD
      handling_fee_cents = {STANDARD: 0, COLD_CHAIN: 4500, HAZARDOUS: 7500, CONTROLLED: 9500}[shipping_class]
      total_cents = goods_subtotal_cents + handling_fee_cents
    input_set: "The order's lines exactly as submitted; catalog prices at submit time."
    constants:
      HANDLING_FEE_STANDARD: 0
      HANDLING_FEE_COLD_CHAIN: 4500
      HANDLING_FEE_HAZARDOUS: 7500
      HANDLING_FEE_CONTROLLED: 9500
    precision: "integer cents, round_half_up per line before summing"
    variants:
      - name: per_line_then_sum
        when: "PINNED. Two 115-cent lines at 5% -> round_half_up(109.25)=109 each -> goods_subtotal 218."
        difference: "218"
      - name: sum_then_round
        when: "Rejected alternative: sum raw then round once."
        difference: "would give round_half_up(218.50)=219 for the same input; 219 is WRONG."

  - name: surge_allocation_scoring
    trigger: "Order submit while an ACTIVE SurgeEvent covers a line's allocation_group (score frozen); waterfall on SurgeEvent resolve."
    algorithm: waterfall_allocation
    formula: |
      score = PRIORITY_WEIGHT[account.priority_class] * TIER_MULT[EA tier at submit]
            where EA tier is the account's ACTIVE/EXPIRING agreement tier, BASE if none
      waterfall on resolve:
        candidates = BACKORDERED orders with >= 1 line whose allocation_group == surge.group,
          account status == ACTIVE
        order candidates by (score DESC, submitted_at ASC, total_quantity ASC, account name ASC)
        for each candidate: if every line satisfiable from available_stock -> reserve all lines,
          order becomes ALLOCATED; else SKIP (candidate stays BACKORDERED, waterfall continues)
    input_set: "BACKORDERED orders with a line in the surge's allocation_group, account ACTIVE."
    constants:
      PRIORITY_WEIGHT_CRITICAL: 100
      PRIORITY_WEIGHT_PRIORITY: 50
      PRIORITY_WEIGHT_STANDARD: 10
      TIER_MULT_PLATINUM: 2.0
      TIER_MULT_GOLD: 1.5
      TIER_MULT_SILVER: 1.2
      TIER_MULT_BASE: 1.0
    precision: "score is a decimal; comparison is exact"
    variants: []

  - name: pull_through_projection
    trigger: "GET /lab/accounts/{id}/pull-through-projection"
    algorithm: forward_looking
    formula: |
      installed_base_monthly_cents = sum(monthly_baseline_consumable_cents)
        over instruments of the account with placement_status == INSTALLED
      forward_looking_monthly_cents = installed_base_monthly_cents
        + FORWARD_WEIGHT * sum(monthly_baseline_consumable_cents)
          over instruments with placement_status == ORDERED
      DECOMMISSIONED instruments excluded from both.
    input_set: "Instruments of the account, split by placement_status."
    constants:
      FORWARD_WEIGHT: 0.5
    precision: "integer cents; FORWARD_WEIGHT multiplication rounded round_half_up"
    variants:
      - name: installed_base
        when: "PINNED conservative view: installed fleet only."
        difference: "baselines 100000 + 40000 installed, 60000 ordered -> 140000"
      - name: forward_looking
        when: "Pipeline-inclusive view returned alongside."
        difference: "same input -> 140000 + 0.5*60000 = 170000; the two variants MUST differ and both are returned."

  - name: service_billing_split
    trigger: "POST /lab/service-requests/{id}/resolve"
    algorithm: threshold
    formula: |
      labor_cents = LABOR_RATE_CENTS_PER_HOUR * hours_on_site
      if a ServiceContract on the instrument is in {ACTIVE, RENEWAL_DUE} at resolve:
        if request_type == PREVENTIVE_MAINTENANCE and used_pm_visits < pm_visits_per_year:
          billable_cents = 0; covered_cents = labor_cents + parts_cost_cents; used_pm_visits += 1
        elif request_type == PREVENTIVE_MAINTENANCE:
          billable_cents = labor_cents + parts_cost_cents; covered_cents = 0   # over quota
        else:
          covered_parts = round_half_up(parts_cost_cents * parts_coverage_pct / 100)
          covered_cents = labor_cents + covered_parts                          # labor 100% covered
          billable_cents = parts_cost_cents - covered_parts
      else:
        billable_cents = labor_cents + parts_cost_cents + TRIP_CHARGE_CENTS
        covered_cents = 0
      credit_memo_cents = round_half_up(billable_cents * SLA_CREDIT_PCT / 100) if sla_breached else 0
      invoice posted to account: billable_cents - credit_memo_cents
      INVARIANT (contract active): billable_cents + covered_cents == labor_cents + parts_cost_cents
    input_set: "The resolved request's hours_on_site, parts_cost_cents; the instrument's contract state at resolve."
    constants:
      LABOR_RATE_CENTS_PER_HOUR: 18500
      TRIP_CHARGE_CENTS: 45000
      SLA_CREDIT_PCT: 10
    precision: "integer cents, round_half_up"
    variants: []

  - name: sla_deadline
    trigger: "ServiceRequest create (response_deadline) and resolve (sla_breached)."
    algorithm: threshold
    formula: |
      response_deadline = opened_at + response_hours hours, where response_hours comes from the
        instrument's contract tier if a contract is in {ACTIVE, RENEWAL_DUE} at open,
        else DEFAULT_RESPONSE_HOURS
      sla_breached = resolved_at > response_deadline   (strictly greater; equal is NOT a breach)
    input_set: "The request's opened_at/resolved_at; contract tier at open time."
    constants:
      DEFAULT_RESPONSE_HOURS: 72
      RESPONSE_HOURS_BRONZE: 72
      RESPONSE_HOURS_SILVER: 48
      RESPONSE_HOURS_GOLD: 24
      RESPONSE_HOURS_PLATINUM: 8
    precision: "ISO8601 instants; strict inequality"
    variants: []

  - name: early_termination_fee
    trigger: "POST /lab/service-contracts/{id}/cancel"
    algorithm: aggregation
    formula: |
      remaining_months = number of full calendar months from the cancel date up to end_date
        (a full month M counts when cancel date <= first day of M and end_date >= first day of M+1)
      fee_cents = monthly_value_cents[tier] * remaining_months * EARLY_TERMINATION_RATE
      fee posted to Account.outstanding_balance_cents; then credit_hold_evaluation runs
      Example: PLATINUM (800000/month), cancel 2027-03-01 with end 2027-09-01 -> 6 months
        (Mar, Apr, May, Jun, Jul, Aug) -> 800000 * 6 * 0.5 = 2400000
    input_set: "The cancelled contract's tier and end_date; cancel date."
    constants:
      MONTHLY_VALUE_BRONZE: 50000
      MONTHLY_VALUE_SILVER: 120000
      MONTHLY_VALUE_GOLD: 300000
      MONTHLY_VALUE_PLATINUM: 800000
      EARLY_TERMINATION_RATE: 0.5
    precision: "integer cents"
    variants: []

  - name: credit_hold_evaluation
    trigger: "Every mutation of Account.outstanding_balance_cents (order ship invoice, resolve invoice, termination fee)."
    algorithm: threshold
    formula: |
      credit_status = HOLD if outstanding_balance_cents > CREDIT_LIMIT_CENTS else GOOD
      Boundary is STRICTLY greater: balance == CREDIT_LIMIT_CENTS stays GOOD.
      On transition GOOD -> HOLD: every DRAFT Order of the account becomes CANCELLED.
    input_set: "The account's outstanding_balance_cents after the posting."
    constants:
      CREDIT_LIMIT_CENTS: 2000000
    precision: "integer cents"
    variants: []

  - name: delivery_transit_schedule
    trigger: "POST /lab/_clock/set_current_utc sweeps SHIPPED orders."
    algorithm: chronological
    formula: |
      for each order with status == SHIPPED and now >= shipped_at + TRANSIT_DAYS[shipping_class] days:
        status := DELIVERED; delivered_at := shipped_at + TRANSIT_DAYS[shipping_class]
      The sweep runs only on clock-set (not on plain reads); DELIVERED then feeds trailing spend.
    input_set: "All SHIPPED orders."
    constants:
      TRANSIT_DAYS_STANDARD: 3
      TRANSIT_DAYS_COLD_CHAIN: 1
      TRANSIT_DAYS_HAZARDOUS: 5
      TRANSIT_DAYS_CONTROLLED: 4
    precision: "day granularity on ISO8601 instants; >= comparison"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (§1.4) — ordered by priority; when a request
# violates several rules, the lowest priority number's error_id wins.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role; for entity_backed roles X-User-ID must be the id of an existing entity of that type."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles. Ownership: LabProcurement may act only on its own account (X-User-ID == Account.id) and resources whose account_id equals it; FieldEngineer may resolve only ServiceRequests whose engineer_id equals X-User-ID."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path id exists -> ERR_ACCOUNT_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_INSTRUMENT_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_SERVICE_REQUEST_NOT_FOUND, ERR_ORDER_NOT_FOUND, or ERR_SURGE_EVENT_NOT_FOUND by resource; body references exist: account_id -> ERR_ACCOUNT_NOT_FOUND, instrument_id -> ERR_INSTRUMENT_NOT_FOUND, line sku -> ERR_CATALOG_ITEM_NOT_FOUND."
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or body foreign keys"
  - priority: 4
    category: state
    check: "Transition guards: order submit requires DRAFT (else ERR_INVALID_STATE); ship requires ALLOCATED (ERR_INVALID_STATE); cancel from SHIPPED/DELIVERED/CANCELLED -> ERR_ORDER_NOT_CANCELLABLE; account status changes follow the Account machine (ERR_INVALID_STATE); renew requires the renewable state (ERR_RENEWAL_WINDOW_CLOSED); surge create while same group ACTIVE -> ERR_SURGE_ALREADY_ACTIVE; surge resolve requires ACTIVE (ERR_INVALID_STATE); dispatch requires OPEN and resolve requires DISPATCHED (ERR_INVALID_STATE); order submit / instrument install / service-request create require account status ACTIVE (ERR_ACCOUNT_NOT_ACTIVE); service-request create requires instrument INSTALLED (ERR_INVALID_STATE)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-mutating endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_agreement_version / expected_contract_version equals the entity's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /lab/enterprise-agreements/{id}/renew", "POST /lab/service-contracts/{id}/renew"]
  - priority: 6
    category: business_safety
    check: "Order submit with any CONTROLLED line requires account.controlled_substance_license == true."
    error_id: ERR_CONTROLLED_LICENSE_REQUIRED
    http_status: 422
    applies_to: ["POST /lab/orders/{id}/submit"]
  - priority: 7
    category: business_constraint
    check: "Domain constraints: duplicate CatalogItem.sku -> ERR_DUPLICATE_SKU; EnterpriseAgreement half-open window overlap on same account -> ERR_AGREEMENT_WINDOW_OVERLAP; second non-terminal ServiceContract on same instrument -> ERR_CONTRACT_ALREADY_ACTIVE; PM scheduled_for closer than 30 days to another OPEN/DISPATCHED PM on the same instrument -> ERR_PM_GAP_VIOLATION; PM without an ACTIVE/RENEWAL_DUE contract -> ERR_CONTRACT_REQUIRED; dispatch selector empty -> ERR_NO_ELIGIBLE_ENGINEER, all eligible at daily capacity 4 -> ERR_ENGINEER_CAPACITY_EXCEEDED; loaner gate -> ERR_LOANER_NOT_ELIGIBLE, empty pool -> ERR_NO_LOANER_AVAILABLE; decommission with open requests or live contract -> ERR_DECOMMISSION_BLOCKED; line quantity <= 0 -> ERR_INVALID_QUANTITY; malformed/missing fields, bad enum, empty lines, PM without scheduled_for -> ERR_INVALID_REQUEST."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "per-rule endpoints as named"
  - priority: 8
    category: business_fiscal
    check: "Order submit requires account.credit_status == GOOD."
    error_id: ERR_CREDIT_HOLD
    http_status: 402
    applies_to: ["POST /lab/orders/{id}/submit"]

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  - method: POST
    path: "/lab/accounts"
    description: "Create a laboratory account."
    roles: [AccountManager, PlatformAdmin]
    code: 201
    input: [name, segment, "priority_class?", territory_code, "controlled_substance_license?"]
    output: Account
    side_effects: []
  - method: GET
    path: "/lab/accounts/{id}"
    description: "Read one account including computed credit_status, outstanding_balance_cents, trailing_spend_cents."
    roles: [AccountManager, LabProcurement, PlatformAdmin, ServiceDispatcher]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: PATCH
    path: "/lab/accounts/{id}"
    description: "Update profile fields and/or drive Account status transitions (ACTIVE<->SUSPENDED, ->CLOSED)."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: ["name?", "segment?", "priority_class?", "territory_code?", "controlled_substance_license?", "status?"]
    output: Account
    side_effects: ["status change increments Account.version by 1"]
  - method: POST
    path: "/lab/enterprise-agreements"
    description: "Create an enterprise agreement (starts ACTIVE); half-open window overlap on the same account is rejected."
    roles: [AccountManager, PlatformAdmin]
    code: 201
    input: [account_id, start_date, end_date, committed_annual_spend_cents]
    output: EnterpriseAgreement
    side_effects: []
  - method: GET
    path: "/lab/enterprise-agreements/{id}"
    description: "Read one agreement including derived status/current_tier/discount_pct."
    roles: [AccountManager, LabProcurement, PlatformAdmin]
    code: 200
    input: []
    output: EnterpriseAgreement
    side_effects: []
  - method: GET
    path: "/lab/enterprise-agreements"
    description: "List agreements, optionally filtered."
    roles: [AccountManager, LabProcurement, PlatformAdmin]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: EnterpriseAgreement[]
    side_effects: []
  - method: POST
    path: "/lab/enterprise-agreements/{id}/renew"
    description: "Renew from EXPIRING: end_date += 12 months; OCC on expected_agreement_version."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: [expected_agreement_version]
    output: EnterpriseAgreement
    side_effects: ["end_date += 12 months", "renewal_count += 1", "increments EnterpriseAgreement.version by 1"]
  - method: POST
    path: "/lab/enterprise-agreements/{id}/terminate"
    description: "Terminate an ACTIVE/EXPIRING agreement."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: EnterpriseAgreement
    side_effects: ["terminated_at := now", "increments EnterpriseAgreement.version by 1"]
  - method: POST
    path: "/lab/instruments"
    description: "Place an instrument (ORDERED); REAGENT_RENTAL/LEASE require monthly_consumable_commitment_cents > 0."
    roles: [AccountManager, PlatformAdmin]
    code: 201
    input: [account_id, model, serial_number, placement_type, "monthly_consumable_commitment_cents?", "monthly_baseline_consumable_cents?"]
    output: Instrument
    side_effects: []
  - method: GET
    path: "/lab/instruments/{id}"
    description: "Read one instrument including derived operational_status."
    roles: [AccountManager, LabProcurement, ServiceDispatcher, PlatformAdmin]
    code: 200
    input: []
    output: Instrument
    side_effects: []
  - method: GET
    path: "/lab/instruments"
    description: "List instruments, optionally filtered."
    roles: [AccountManager, LabProcurement, ServiceDispatcher, PlatformAdmin]
    code: 200
    input: ["account_id?", "placement_status?", "placement_type?", "limit?", "offset?"]
    output: Instrument[]
    side_effects: []
  - method: POST
    path: "/lab/instruments/{id}/install"
    description: "Install an ORDERED instrument; requires ACTIVE account and an INSTALL-skilled ACTIVE engineer in the account territory."
    roles: [ServiceDispatcher, PlatformAdmin]
    code: 200
    input: []
    output: Instrument
    side_effects: ["installed_at := now", "increments Instrument.version by 1"]
  - method: POST
    path: "/lab/instruments/{id}/decommission"
    description: "Decommission an INSTALLED instrument with no open requests and no live contract."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: Instrument
    side_effects: ["increments Instrument.version by 1"]
  - method: POST
    path: "/lab/service-contracts"
    description: "Sell a service contract for an INSTALLED instrument; at most one non-terminal contract per instrument."
    roles: [AccountManager, PlatformAdmin]
    code: 201
    input: [instrument_id, tier, start_date, end_date]
    output: ServiceContract
    side_effects: []
  - method: GET
    path: "/lab/service-contracts/{id}"
    description: "Read one contract including derived status and entitlement fields."
    roles: [AccountManager, LabProcurement, ServiceDispatcher, PlatformAdmin]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []
  - method: GET
    path: "/lab/service-contracts"
    description: "List contracts, optionally filtered."
    roles: [AccountManager, LabProcurement, ServiceDispatcher, PlatformAdmin]
    code: 200
    input: ["instrument_id?", "status?", "tier?", "limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []
  - method: POST
    path: "/lab/service-contracts/{id}/renew"
    description: "Renew from RENEWAL_DUE: end_date += 12 months; OCC on expected_contract_version."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: [expected_contract_version]
    output: ServiceContract
    side_effects: ["end_date += 12 months", "renewal_count += 1", "increments ServiceContract.version by 1"]
  - method: POST
    path: "/lab/service-contracts/{id}/cancel"
    description: "Early-cancel an ACTIVE/RENEWAL_DUE contract; posts termination fee and runs credit evaluation cascade."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["early_termination_fee posts to Account.outstanding_balance_cents", "credit_hold_evaluation", "HOLD transition cancels DRAFT orders", "increments ServiceContract.version by 1"]
  - method: POST
    path: "/lab/service-requests"
    description: "Open a service request on an INSTALLED instrument; PM requires scheduled_for and a live contract and honors the 30-day PM gap."
    roles: [LabProcurement, AccountManager, PlatformAdmin]
    code: 201
    input: [instrument_id, request_type, severity, "scheduled_for?"]
    output: ServiceRequest
    side_effects: ["response_deadline computed", "CRITICAL BREAK_FIX flips instrument operational_status to DOWN"]
  - method: GET
    path: "/lab/service-requests/{id}"
    description: "Read one service request."
    roles: [AccountManager, LabProcurement, ServiceDispatcher, FieldEngineer, PlatformAdmin]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: []
  - method: GET
    path: "/lab/service-requests"
    description: "List service requests, optionally filtered."
    roles: [AccountManager, LabProcurement, ServiceDispatcher, FieldEngineer, PlatformAdmin]
    code: 200
    input: ["instrument_id?", "engineer_id?", "loaner_unit_id?", "status?", "request_type?", "limit?", "offset?"]
    output: ServiceRequest[]
    side_effects: []
  - method: POST
    path: "/lab/service-requests/{id}/dispatch"
    description: "Auto-assign the best eligible engineer (territory+skill filter, fewest open tickets, created_at tie-break, 4/day capacity)."
    roles: [ServiceDispatcher, PlatformAdmin]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: ["engineer_id set", "increments ServiceRequest.version by 1"]
  - method: POST
    path: "/lab/service-requests/{id}/resolve"
    description: "Resolve a dispatched request; computes billing split, SLA credit, PM quota consumption, loaner return, credit evaluation."
    roles: [ServiceDispatcher, FieldEngineer, PlatformAdmin]
    code: 200
    input: [hours_on_site, "parts_cost_cents?"]
    output: ServiceRequest
    side_effects: ["service_billing_split", "invoice posted to Account.outstanding_balance_cents", "credit_hold_evaluation", "loaner unit returns to AVAILABLE", "increments ServiceRequest.version by 1"]
  - method: POST
    path: "/lab/engineers"
    description: "Register a field service engineer."
    roles: [ServiceDispatcher, PlatformAdmin]
    code: 201
    input: [name, territory_code, skills, "status?"]
    output: Engineer
    side_effects: []
  - method: POST
    path: "/lab/loaner-units"
    description: "Register a loaner instrument unit (AVAILABLE)."
    roles: [ServiceDispatcher, PlatformAdmin]
    code: 201
    input: [model, serial_number]
    output: LoanerUnit
    side_effects: []
  - method: GET
    path: "/lab/loaner-units"
    description: "List loaner units, optionally filtered by status or model."
    roles: [ServiceDispatcher, AccountManager, PlatformAdmin]
    code: 200
    input: ["status?", "model?", "limit?", "offset?"]
    output: LoanerUnit[]
    side_effects: []
  - method: POST
    path: "/lab/service-requests/{id}/loaner"
    description: "Reserve the oldest AVAILABLE loaner unit matching the instrument model; gated by contract loaner eligibility and severity HIGH/CRITICAL."
    roles: [ServiceDispatcher, PlatformAdmin]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: ["ServiceRequest.loaner_unit_id set", "LoanerUnit.status := RESERVED"]
  - method: POST
    path: "/lab/catalog-items"
    description: "Add a catalog item; sku unique."
    roles: [SupplyOps, PlatformAdmin]
    code: 201
    input: [sku, name, item_class, allocation_group, base_price_cents, stock_on_hand]
    output: CatalogItem
    side_effects: []
  - method: GET
    path: "/lab/catalog-items"
    description: "List catalog items, optionally filtered."
    roles: [SupplyOps, AccountManager, LabProcurement, PlatformAdmin]
    code: 200
    input: ["sku?", "item_class?", "allocation_group?", "limit?", "offset?"]
    output: CatalogItem[]
    side_effects: []
  - method: POST
    path: "/lab/orders"
    description: "Create a DRAFT order; validates sku existence and positive quantities."
    roles: [LabProcurement, AccountManager, PlatformAdmin]
    code: 201
    input: [account_id, lines]
    output: Order
    side_effects: []
  - method: GET
    path: "/lab/orders/{id}"
    description: "Read one order."
    roles: [LabProcurement, AccountManager, SupplyOps, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/lab/orders"
    description: "List orders, optionally filtered."
    roles: [LabProcurement, AccountManager, SupplyOps, PlatformAdmin]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/lab/orders/{id}/submit"
    description: "Submit a DRAFT order: account/license/credit gates, pricing snapshot, then ALLOCATED with reservations or BACKORDERED with frozen allocation_score."
    roles: [LabProcurement, AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["order_total_pricing snapshot", "stock reservation when ALLOCATED", "allocation_score frozen when BACKORDERED", "increments Order.version by 1"]
  - method: POST
    path: "/lab/orders/{id}/ship"
    description: "Ship an ALLOCATED order: decrements stock, posts invoice, runs credit evaluation."
    roles: [SupplyOps, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["stock_on_hand and reserved_quantity decremented per line", "invoice total_cents posted to Account.outstanding_balance_cents", "credit_hold_evaluation", "increments Order.version by 1"]
  - method: POST
    path: "/lab/orders/{id}/cancel"
    description: "Cancel a DRAFT/BACKORDERED/ALLOCATED order; ALLOCATED cancellation releases reservations."
    roles: [LabProcurement, AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["reservations released when ALLOCATED", "increments Order.version by 1"]
  - method: POST
    path: "/lab/surge-events"
    description: "Open a supply-surge event on an allocation group; at most one ACTIVE per group."
    roles: [SupplyOps, PlatformAdmin]
    code: 201
    input: [allocation_group, reason]
    output: SurgeEvent
    side_effects: ["started_at := now"]
  - method: POST
    path: "/lab/surge-events/{id}/resolve"
    description: "Resolve a surge; runs the priority waterfall promoting satisfiable BACKORDERED orders for this group."
    roles: [SupplyOps, PlatformAdmin]
    code: 200
    input: []
    output: SurgeEvent
    side_effects: ["waterfall promotion", "stock reservations on promotion", "increments SurgeEvent.version by 1"]
  - method: GET
    path: "/lab/accounts/{id}/pull-through-projection"
    description: "Consumable pull-through projection for the account's installed base; returns both variants."
    roles: [AccountManager, LabProcurement, PlatformAdmin]
    code: 200
    input: []
    output: { installed_base_monthly_cents: integer, forward_looking_monthly_cents: integer, installed_instrument_count: integer, ordered_instrument_count: integer }
    side_effects: []
  - method: POST
    path: "/lab/_clock/set_current_utc"
    description: "Advance the logical clock (test-driving endpoint). Startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock. Setting the clock runs the delivery sweep (SHIPPED -> DELIVERED past transit) and re-derives agreement/contract statuses on next read."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["delivery_transit_schedule sweep"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers, or an entity_backed role whose X-User-ID does not identify an existing entity of that type."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not allowed on the endpoint, or an entity_backed caller acting on another party's resource (LabProcurement on a foreign account; FieldEngineer resolving a request assigned to someone else)."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, malformed value, invalid enum member, empty order lines, PREVENTIVE_MAINTENANCE without scheduled_for, REAGENT_RENTAL/LEASE instrument without a positive monthly_consumable_commitment_cents, CAPITAL instrument with a non-zero commitment."
  - id: ERR_INVALID_QUANTITY
    http: 400
    condition: "Order line quantity is not a positive integer."
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "Referenced account id does not exist."
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "Referenced enterprise-agreement id does not exist."
  - id: ERR_INSTRUMENT_NOT_FOUND
    http: 404
    condition: "Referenced instrument id does not exist."
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "Referenced service-contract id does not exist."
  - id: ERR_SERVICE_REQUEST_NOT_FOUND
    http: 404
    condition: "Referenced service-request id does not exist."
  - id: ERR_CATALOG_ITEM_NOT_FOUND
    http: 404
    condition: "An order line references a sku not present in the catalog."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced order id does not exist."
  - id: ERR_SURGE_EVENT_NOT_FOUND
    http: 404
    condition: "Referenced surge-event id does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic transition guard: action not allowed from the entity's current state (ship a DRAFT order, dispatch a non-OPEN request, resolve a non-DISPATCHED request, reopen a CLOSED account, resolve an already-RESOLVED surge, install a non-ORDERED instrument, service request on a non-INSTALLED instrument)."
  - id: ERR_ACCOUNT_NOT_ACTIVE
    http: 409
    condition: "Account is SUSPENDED or CLOSED where ACTIVE is required (order submit, instrument install, service-request create)."
  - id: ERR_AGREEMENT_WINDOW_OVERLAP
    http: 409
    condition: "New agreement window [start_date, end_date) intersects an existing ACTIVE/EXPIRING agreement of the same account; adjacency (start == other end) is allowed."
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "Catalog item created with an already-existing sku."
  - id: ERR_CONTRACT_ALREADY_ACTIVE
    http: 409
    condition: "Instrument already has a ServiceContract in {ACTIVE, RENEWAL_DUE}."
  - id: ERR_DECOMMISSION_BLOCKED
    http: 409
    condition: "Decommission attempted while the instrument has OPEN/DISPATCHED service requests or an ACTIVE/RENEWAL_DUE contract."
  - id: ERR_ORDER_NOT_CANCELLABLE
    http: 409
    condition: "Cancel attempted from SHIPPED, DELIVERED, or CANCELLED."
  - id: ERR_SURGE_ALREADY_ACTIVE
    http: 409
    condition: "A surge event already ACTIVE on the same allocation_group."
  - id: ERR_CONTROLLED_LICENSE_REQUIRED
    http: 422
    condition: "Order submit contains a CONTROLLED line but the account lacks a controlled-substance license."
  - id: ERR_PM_GAP_VIOLATION
    http: 422
    condition: "PREVENTIVE_MAINTENANCE scheduled_for is less than 30 days after another OPEN/DISPATCHED PM request on the same instrument; exactly 30 days is allowed."
  - id: ERR_CONTRACT_REQUIRED
    http: 422
    condition: "PREVENTIVE_MAINTENANCE requested for an instrument with no ServiceContract in {ACTIVE, RENEWAL_DUE}."
  - id: ERR_NO_ELIGIBLE_ENGINEER
    http: 422
    condition: "Dispatch selector: no ACTIVE engineer matches the account territory and required skill (also applies to instrument install's INSTALL-skill requirement)."
  - id: ERR_ENGINEER_CAPACITY_EXCEEDED
    http: 422
    condition: "Dispatch selector: eligible engineers exist but each already holds 4 DISPATCHED tickets on the current UTC calendar day."
  - id: ERR_LOANER_NOT_ELIGIBLE
    http: 422
    condition: "Loaner requested but the request is not BREAK_FIX with severity HIGH/CRITICAL, or the instrument lacks a loaner-eligible (GOLD/PLATINUM) contract in {ACTIVE, RENEWAL_DUE}."
  - id: ERR_NO_LOANER_AVAILABLE
    http: 422
    condition: "Loaner gate passed but no AVAILABLE LoanerUnit matches the instrument model."
  - id: ERR_RENEWAL_WINDOW_CLOSED
    http: 422
    condition: "Renew attempted while the agreement is not EXPIRING or the contract is not RENEWAL_DUE."
  - id: ERR_CREDIT_HOLD
    http: 402
    condition: "Order submit while account.credit_status == HOLD."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the entity's current version on a renew endpoint."

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Superuser; only role allowed to drive the logical clock."
    identity: opaque
    exclusive_operations: ["POST /lab/_clock/set_current_utc"]
    shared_operations: ["all business endpoints"]
  - name: AccountManager
    description: "Vendor-side commercial rep; owns accounts, enterprise agreements, instrument placements, and service contracts."
    identity: opaque
    exclusive_operations: ["POST /lab/accounts", "PATCH /lab/accounts/{id}", "POST /lab/enterprise-agreements", "POST /lab/enterprise-agreements/{id}/renew", "POST /lab/enterprise-agreements/{id}/terminate", "POST /lab/instruments", "POST /lab/instruments/{id}/decommission", "POST /lab/service-contracts", "POST /lab/service-contracts/{id}/renew", "POST /lab/service-contracts/{id}/cancel"]
    shared_operations: ["read accounts/agreements/instruments/contracts/requests/orders", "POST /lab/service-requests", "GET /lab/accounts/{id}/pull-through-projection"]
  - name: LabProcurement
    description: "Customer-side lab purchaser; X-User-ID is the Account.id they buy for."
    identity: "entity_backed:Account"
    exclusive_operations: []
    shared_operations: ["POST /lab/orders", "POST /lab/orders/{id}/submit", "POST /lab/orders/{id}/cancel", "POST /lab/service-requests", "read own account/agreements/instruments/contracts/requests/orders", "GET /lab/accounts/{id}/pull-through-projection (own account only)"]
  - name: ServiceDispatcher
    description: "Service operations coordinator; installs instruments, dispatches and resolves service requests, manages engineers and the loaner pool."
    identity: opaque
    exclusive_operations: ["POST /lab/engineers", "POST /lab/instruments/{id}/install", "POST /lab/service-requests/{id}/dispatch", "POST /lab/loaner-units", "POST /lab/service-requests/{id}/loaner"]
    shared_operations: ["POST /lab/service-requests/{id}/resolve", "read instruments/contracts/requests/loaner-units/accounts"]
  - name: FieldEngineer
    description: "Field service engineer; X-User-ID is the Engineer.id; may resolve only requests assigned to them."
    identity: "entity_backed:Engineer"
    exclusive_operations: []
    shared_operations: ["POST /lab/service-requests/{id}/resolve (only when engineer_id == X-User-ID)", "read service requests"]
  - name: SupplyOps
    description: "Supply-chain operator; owns the catalog, ships orders, and manages surge events."
    identity: opaque
    exclusive_operations: ["POST /lab/catalog-items", "POST /lab/orders/{id}/ship", "POST /lab/surge-events", "POST /lab/surge-events/{id}/resolve"]
    shared_operations: ["read catalog items and orders"]
