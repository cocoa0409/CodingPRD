scaffold_corner_design:
  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: create_trading_partner_required_fields_and_defaults
        claim_type: creation_and_defaults
        grounds: ["entities.TradingPartner", "endpoints.POST /wholesale/trading-partners"]
        distinguishing_aspect: "Creating a partner with all required fields yields 201 with open_receivable_cents == 0 and allocation_watermark_units == 0 (computed defaults), version == 1."
        test_recipe:
          setup: ["Empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
          trigger:
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "NewRx", partner_kind: "CUSTOMER", dea_number: "AC9999999", credit_limit_cents: 5000 }
              as: OrderManager
              captures: { new_id: $.data.id, recv: $.data.open_receivable_cents, ver: $.data.version }
          assert:
            - "recv == 0"
            - "ver == 1"
            - "GET /wholesale/trading-partners/${new_id} returns partner_name == 'NewRx'"

      - name: create_trading_partner_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.TradingPartner.fields.credit_limit_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting credit_limit_cents (required input, no default) is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "NoCredit", partner_kind: "CUSTOMER", dea_number: "AC9999998" }
              as: OrderManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: get_nonexistent_product_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.GET /wholesale/products/{productId}"]
        distinguishing_aspect: "GET on a never-created UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /wholesale/products/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OrderManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: create_product_duplicate_ndc_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_UNIQUE_FIELD]"]
        distinguishing_aspect: "Second product with the same ndc is rejected with ERR_DUPLICATE_UNIQUE_FIELD (409)."
        test_recipe:
          setup: ["One product with ndc 00000000900 exists"]
          setup_api_calls:
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000900", product_name: "First", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 100, is_340b_contracted: false }
              as: OrderManager
          trigger:
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000900", product_name: "Dupe", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 200, is_340b_contracted: false }
              as: OrderManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_UNIQUE_FIELD"

      - name: create_license_fk_integrity
        claim_type: parent_relationships
        grounds: ["entities.PartnerStateLicense.fields.partner_id", "validations[priority=4]"]
        distinguishing_aspect: "PartnerStateLicense with a non-existent partner_id is rejected with ERR_REFERENCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", state_code: "CA", license_number: "LIC-GHOST", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REFERENCE_NOT_FOUND"

      - name: list_products_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints.GET /wholesale/products"]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["Three products exist"]
          setup_api_calls:
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000911", product_name: "P1", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 100, is_340b_contracted: false }
              as: OrderManager
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000912", product_name: "P2", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 100, is_340b_contracted: false }
              as: OrderManager
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000913", product_name: "P3", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 100, is_340b_contracted: false }
              as: OrderManager
          trigger:
            - call: "GET /wholesale/products?limit=2&offset=0"
              payload: {}
              as: OrderManager
          assert:
            - "Response data array length == 2"
            - "Response includes total_count == 3 and has_more == true"
            - "GET /wholesale/products?limit=2&offset=2 returns 1 row with has_more == false"

      - name: computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds: ["entities.PurchaseOrder.fields.invoice_total_cents", "entities.PurchaseOrder.fields.fulfillment_status"]
        distinguishing_aspect: "Client-supplied invoice_total_cents or fulfillment_status in the create body is ignored; a new order has fulfillment_status DRAFT, financial_status UNBILLED, invoice_total_cents 0."
        test_recipe:
          setup: ["Customer exists"]
          setup_api_calls:
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "CompRx", partner_kind: "CUSTOMER", dea_number: "AC8888888", credit_limit_cents: 5000 }
              as: OrderManager
              captures: { cust_comp: $.data.id }
          trigger:
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_comp}", ship_to_state: "CA" }
              as: OrderManager
              captures: { fs: $.data.fulfillment_status, fin: $.data.financial_status, tot: $.data.invoice_total_cents }
          assert:
            - "fs == DRAFT"
            - "fin == UNBILLED"
            - "tot == 0"

  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: cancel_terminal_order_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PurchaseOrder", "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED order fails with ERR_ORDER_NOT_CANCELLABLE; terminal lockdown holds."
        test_recipe:
          setup: ["DRAFT order created then cancelled"]
          setup_api_calls:
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "TermRx", partner_kind: "CUSTOMER", dea_number: "AC7777777", credit_limit_cents: 5000 }
              as: OrderManager
              captures: { cust_t: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_t}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_t: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_t}/cancel"
              payload: {}
              as: OrderManager
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_t}/cancel"
              payload: {}
              as: OrderManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ORDER_NOT_CANCELLABLE"
            - "PurchaseOrder ${ord_t}.fulfillment_status == CANCELLED (no side effects fired twice)"

      - name: deliver_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PurchaseOrder.SHIPPED_to_DELIVERED", "errors[ERR_ORDER_NOT_SHIPPED]"]
        distinguishing_aspect: "Deliver on a DRAFT order fails with ERR_ORDER_NOT_SHIPPED."
        test_recipe:
          setup: ["DRAFT order exists"]
          setup_api_calls:
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "DelRx", partner_kind: "CUSTOMER", dea_number: "AC7777776", credit_limit_cents: 5000 }
              as: OrderManager
              captures: { cust_d: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_d}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_d: $.data.id }
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_d}/deliver"
              payload: {}
              as: WarehouseOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ORDER_NOT_SHIPPED"

      - name: revoke_terminal_license_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.PartnerStateLicense", "errors[ERR_LICENSE_ALREADY_REVOKED]"]
        distinguishing_aspect: "A REVOKED license rejects further revoke with ERR_LICENSE_ALREADY_REVOKED; no transition leaves REVOKED."
        test_recipe:
          setup: ["License created then revoked"]
          setup_api_calls:
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "RevRx", partner_kind: "CUSTOMER", dea_number: "AC7777775", credit_limit_cents: 5000 }
              as: OrderManager
              captures: { cust_r: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_r}", state_code: "WA", license_number: "LIC-RV", license_scope: "RX_ONLY", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_r: $.data.id }
            - call: "POST /wholesale/partner-state-licenses/${lic_r}/revoke"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /wholesale/partner-state-licenses/${lic_r}/revoke"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LICENSE_ALREADY_REVOKED"

      - name: receive_case_before_ship_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.SerializedCase", "errors[ERR_INVALID_EVENT_SEQUENCE]"]
        distinguishing_aspect: "EPCIS RECEIVE on a COMMISSIONED case fails with ERR_INVALID_EVENT_SEQUENCE — event sequence follows the case state machine."
        test_recipe:
          setup: ["Case COMMISSIONED; supplier and customer partners exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000921", product_name: "PE", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 100, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_e: $.data.id }
            - call: "POST /wholesale/serialized-cases"
              payload: { sscc: "SSCC-SEQ-1", product_id: "${prod_e}", lot_number: "LQ", expiry_date: "2027-01-01T00:00:00Z" }
              as: WarehouseOperator
              captures: { case_e: $.data.id }
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "SupCo", partner_kind: "SUPPLIER", dea_number: "AC7777774", credit_limit_cents: 0 }
              as: OrderManager
              captures: { sup_e: $.data.id }
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "RecCo", partner_kind: "CUSTOMER", dea_number: "AC7777773", credit_limit_cents: 0 }
              as: OrderManager
              captures: { rec_e: $.data.id }
          trigger:
            - call: "POST /wholesale/epcis-events"
              payload: { event_type: "RECEIVE", subject_case_id: "${case_e}", event_time: "2026-07-31T01:00:00Z", sender_partner_id: "${sup_e}", recipient_partner_id: "${rec_e}" }
              as: WarehouseOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_EVENT_SEQUENCE"

      - name: epcis_ship_then_receive_happy_path_and_hash_chain
        claim_type: valid_transition
        grounds: ["state_machines.SerializedCase.COMMISSIONED_to_SHIPPED", "calculations.txn_history_chain"]
        distinguishing_aspect: "SHIP then RECEIVE transitions case and units COMMISSIONED->SHIPPED->RECEIVED; the second event's txn_history_hash chains the first and differs from it."
        test_recipe:
          setup: ["Case with one aggregated unit; supplier/customer partners; clock at 2026-08-01T03:00:00Z so both event times are in the past"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T03:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000922", product_name: "HP", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 100, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_h: $.data.id }
            - call: "POST /wholesale/serialized-cases"
              payload: { sscc: "SSCC-HP-1", product_id: "${prod_h}", lot_number: "LH", expiry_date: "2027-01-01T00:00:00Z" }
              as: WarehouseOperator
              captures: { case_h: $.data.id }
            - call: "POST /wholesale/serialized-units"
              payload: { sni: "SNI-HP-1", case_id: "${case_h}" }
              as: WarehouseOperator
              captures: { unit_h: $.data.id }
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "SupH", partner_kind: "SUPPLIER", dea_number: "AC7777772", credit_limit_cents: 0 }
              as: OrderManager
              captures: { sup_h: $.data.id }
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "RecH", partner_kind: "CUSTOMER", dea_number: "AC7777771", credit_limit_cents: 0 }
              as: OrderManager
              captures: { rec_h: $.data.id }
          trigger:
            - call: "POST /wholesale/epcis-events"
              payload: { event_type: "SHIP", subject_case_id: "${case_h}", event_time: "2026-08-01T01:00:00Z", sender_partner_id: "${sup_h}", recipient_partner_id: "${rec_h}" }
              as: WarehouseOperator
              captures: { ev1: $.data.id, hash1: $.data.txn_history_hash }
            - call: "POST /wholesale/epcis-events"
              payload: { event_type: "RECEIVE", subject_case_id: "${case_h}", event_time: "2026-08-01T02:00:00Z", sender_partner_id: "${sup_h}", recipient_partner_id: "${rec_h}" }
              as: WarehouseOperator
              captures: { ev2: $.data.id, hash2: $.data.txn_history_hash }
          assert:
            - "SerializedCase ${case_h}.case_status == RECEIVED"
            - "SerializedUnit ${unit_h}.unit_status == RECEIVED (cascade from case)"
            - "hash1 != '' (first SHIP chains the implicit COMMISSION baseline or is the genesis chain value per implementation, and hash2 != hash1 — the chain is append-only and order-sensitive)"

      - name: claim_settle_from_submitted_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ChargebackClaim", "errors[ERR_CLAIM_NOT_VALIDATED]"]
        distinguishing_aspect: "Settle on a SUBMITTED (never validated) claim fails with ERR_CLAIM_NOT_VALIDATED."
        test_recipe:
          setup: ["340B order CONFIRMED+ALLOCATED with line 6 x (10000-7000); claim SUBMITTED with correct amount 18000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "CbRx", partner_kind: "CUSTOMER", dea_number: "AC7777770", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_cb: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_cb}", state_code: "CA", license_number: "LIC-CB", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000923", product_name: "CB", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 10000, is_340b_contracted: true, contract_340b_price_cents: 7000 }
              as: OrderManager
              captures: { prod_cb: $.data.id }
            - call: "POST /wholesale/products/${prod_cb}/declare-shortage"
              payload: {}
              as: OrderManager
            - call: "POST /wholesale/allocation-policies"
              payload: { product_id: "${prod_cb}", pool_units: 6, policy_mode: "PRO_RATA", min_guarantee_units: 0 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_cb}", ship_to_state: "CA", is_340b_order: true }
              as: OrderManager
              captures: { ord_cb: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_cb}/lines"
              payload: { product_id: "${prod_cb}", quantity_requested: 10 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_cb}/confirm"
              payload: {}
              as: OrderManager
              captures: { ord_cb_v: $.data.version }
            - call: "POST /wholesale/purchase-orders/${ord_cb}/allocate"
              payload: { expected_order_version: "${ord_cb_v}" }
              as: OrderManager
            - call: "POST /wholesale/chargeback-claims"
              payload: { order_id: "${ord_cb}", claimed_amount_cents: 18000 }
              as: ContractAdministrator
              captures: { claim_cb: $.data.id }
          trigger:
            - call: "POST /wholesale/chargeback-claims/${claim_cb}/settle"
              payload: {}
              as: ContractAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CLAIM_NOT_VALIDATED"
            - "ChargebackClaim ${claim_cb}.claim_status == SUBMITTED"

      - name: add_line_to_confirmed_order_rejected
        claim_type: invalid_transition
        grounds: ["endpoints.POST /wholesale/purchase-orders/{orderId}/lines", "errors[ERR_ORDER_NOT_DRAFT]"]
        distinguishing_aspect: "Adding a line to a CONFIRMED order fails with ERR_ORDER_NOT_DRAFT — lines are frozen once priced."
        test_recipe:
          setup: ["Customer with FULL CA license; order CONFIRMED with one line"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "FrzRx", partner_kind: "CUSTOMER", dea_number: "AC7777769", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_f: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_f}", state_code: "CA", license_number: "LIC-F", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000924", product_name: "FR", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 100, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_f: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_f}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_f: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_f}/lines"
              payload: { product_id: "${prod_f}", quantity_requested: 1 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_f}/confirm"
              payload: {}
              as: OrderManager
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_f}/lines"
              payload: { product_id: "${prod_f}", quantity_requested: 1 }
              as: OrderManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ORDER_NOT_DRAFT"

  # ===================================================================
  # Section: calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: pricing_variant_covered_by_difficulty
        claim_type: variant_divergence
        grounds: ["calculations.order_line_pricing"]
        excluded_because:
          difficulty_instance: order_pricing_provisional_vs_final_invoice
          rationale: "Provisional-vs-final divergence asserted there with literal invoice totals."

      - name: chargeback_variant_covered_by_difficulty
        claim_type: variant_divergence
        grounds: ["calculations.chargeback_amount"]
        excluded_because:
          difficulty_instance: chargeback_gross_vs_net_basis
          rationale: "Gross-vs-net basis divergence asserted there with literal computed amounts."

      - name: payment_exact_payoff_transitions_to_paid
        claim_type: correct_result
        grounds: ["state_machines.PurchaseOrder.INVOICED_to_PAID", "calculations.open_receivable_balance"]
        distinguishing_aspect: "A payment exactly equal to invoice_balance_cents transitions financial_status to PAID, zeroes the balance, and decrements the customer's receivable by the paid amount."
        test_recipe:
          setup: ["Order CONFIRMED with one line 4 x 1000 = 4000; customer receivable 4000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "PayRx", partner_kind: "CUSTOMER", dea_number: "AC7777768", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_py: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_py}", state_code: "CA", license_number: "LIC-PY", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000925", product_name: "PY", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 1000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_py: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_py}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_py: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_py}/lines"
              payload: { product_id: "${prod_py}", quantity_requested: 4 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_py}/confirm"
              payload: {}
              as: OrderManager
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_py}/payments"
              payload: { amount_cents: 4000 }
              as: BillingClerk
              captures: { fin: $.data.financial_status, bal: $.data.invoice_balance_cents }
          assert:
            - "fin == PAID"
            - "bal == 0"
            - "TradingPartner ${cust_py}.open_receivable_cents == 0"

      - name: payment_over_balance_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_PAYMENT_AMOUNT_INVALID]"]
        distinguishing_aspect: "A payment one cent above invoice_balance_cents fails with ERR_PAYMENT_AMOUNT_INVALID (422) and changes nothing."
        test_recipe:
