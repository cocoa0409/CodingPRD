            - "Appointment.${ap1}.service_minutes == 104"
            - "GET /service-lines?appointment_id=${ap1} shows every row with labor_cents == 7340"
            - "GET /invoices?appointment_id=${ap1} returns exactly 1 row"
            - "that Invoice.labor_subtotal_cents == 29360 (NOT 29358)"
            - "that Invoice.product_subtotal_cents == 11200"
            - "that Invoice.tax_cents == 812"
            - "that Invoice.total_cents == 41372"

      - name: loyalty_split_then_taxable_base_then_tax_evaluation_order
        grounds:
          - calculations.invoice_build
          - calculations.loyalty_discount
          - calculations.loyalty_allocation_split
          - calculations.invoice_tax
          - conservation_invariants.INV_LOYALTY_SPLIT
          - entities.Invoice.fields.taxable_product_base_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking chain whose evaluation order the scaffold pins:
          the loyalty discount is taken on labor+product combined, then split back across the
          two legs, and only the PRODUCT leg reduces the taxable base, which then produces the
          tax that feeds the total. With labor 26148 and product 11200 the pinned order yields
          loyalty 1120 -> product leg 336 / labor leg 784 -> taxable base 10864 -> tax 788 -> total 37016.
        test_recipe:
          setup:
            - "A client migrated with opening_completed_visit_count 11, so the visit under test is its 12th completed visit and the STANDARD loyalty tier applies."
            - "Rate card with price_new_shoes_cents 6537 effective 2026-01-01; SKU priced 5600 per pair."
            - "One horse with four NEW_SHOES lines, attached to a zone A stop, dispatched, arrived and started."
          setup_api_calls:
