      - name: voiding_the_newest_cycle_restores_lot_volume_and_replays_the_lines_due_projection
        grounds:
          - state_machines.CleaningCycle.POSTED_to_VOIDED
          - calculations.line_compliance_projection
          - calculations.chemical_cycle_dosing
          - entities.ChemicalLot.fields.liters_remaining
          - entities.BeerLine.fields.next_due_at
          - endpoints.POST_cleaning_cycles_void
        distinguishing_aspect: |
          The undo is not a stored snapshot: voiding the newest POSTED cycle must
          REPLAY the line's projection from whatever POSTED cycles survive, so
          last_chemical_type walks back from ACID to CAUSTIC, last_cleaned_at
          from 2026-08-25T09:00:00Z to 2026-08-05T09:00:00Z and next_due_at from
          2026-09-15T09:00:00Z to 2026-08-26T09:00:00Z - a value that appears
          nowhere in the void request. Simultaneously the acid lot's
          liters_remaining returns to exactly 10.000 while the caustic lot stays
          at 19.690, so the compensation is scoped to the voided record only and
          the two ledgers do not cross-contaminate.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, then 2026-08-05T09:00:00Z, then 2026-08-25T09:00:00Z."
            - "ServiceAccount ACTIVE with an ACTIVE contract at cleaning_frequency_days 21, one IN_SERVICE BeerLine 32ft/4ft/0.375in, one MASTER caustic-certified Technician."
            - "ChemicalLot C-1001 CAUSTIC 45.0 / 20.0 L and ChemicalLot A-2001 ACID 30.0 / 10.0 L."
            - "Visit #1 on 2026-08-05 540-660 started, with a PASS CAUSTIC cycle (used 0.31, contact 20, 96.0F) -> lot C at 19.690, line last_cleaned_at 2026-08-05T09:00:00Z, next_due_at 2026-08-26T09:00:00Z."
            - "Visit #2 on 2026-08-25 540-660 started, with a PASS ACID cycle (used 0.23, contact 15, 80.0F) -> lot A at 9.770, line last_chemical_type ACID, last_cleaned_at 2026-08-25T09:00:00Z, next_due_at 2026-09-15T09:00:00Z."
            - "Neither visit is settled, so the void is permitted."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Millpond Alehouse", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 1, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line1: $.data.id }
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Dana Ruiz", certification_level: "MASTER", caustic_certified: true, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id }
            - call: "POST /draft-service/chemical-lots"
              payload: { chemical_type: "CAUSTIC", lot_code: "C-1001", concentration_pct_stock: 45.0, liters_initial: 20.0, expires_on: "2026-12-31" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { lot_caustic: $.data.id }
            - call: "POST /draft-service/chemical-lots"
              payload: { chemical_type: "ACID", lot_code: "A-2001", concentration_pct_stock: 30.0, liters_initial: 10.0, expires_on: "2026-12-31" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { lot_acid: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { visit1: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-25", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { visit2: $.data.id }
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/service-visits/${visit1}/start"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
            - call: "POST /draft-service/cleaning-cycles"
              payload: { visit_id: "${visit1}", line_id: "${line1}", chemical_lot_id: "${lot_caustic}", chemical_type: "CAUSTIC", contact_minutes: 20, recirculation_temp_f: 96.0, concentrate_liters_used: 0.31 }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { cyc_caustic: $.data.id }
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T09:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/service-visits/${visit2}/start"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
