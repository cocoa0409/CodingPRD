            - "after trigger[1]: Carrier.${c3_id}.challenge_quota_used == 0"
            - "after trigger[1]: Violation.${v1_id}.under_challenge == false"
            - "after trigger[1]: BasicScore(carrier_id=${c3_id}, basic_category=UNSAFE_DRIVING).challenged_time_weighted_severity == 0.0"
            - "after trigger[1]: BasicScore(carrier_id=${c3_id}, basic_category=UNSAFE_DRIVING).provisional_measure == 2.000"
            - "after trigger[1]: BasicScore(carrier_id=${c3_id}, basic_category=UNSAFE_DRIVING).certified_measure == 2.000"
