            - call: "POST /cath-lab/cases/${case_d_id}/complete"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-E", procedure_type: EP_STUDY, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_e_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_e_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T13:00:00Z", bed_id: "${bed2_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_e_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
