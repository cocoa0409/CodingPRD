      - name: launch_on_the_exclusive_end_of_the_launch_window_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 38 ERR_OUTSIDE_LAUNCH_WINDOW]
        distinguishing_aspect: "The launch window is the half-open interval [start, end), so a LAUNCH attempted exactly on launch_window_end 2026-12-31 is outside it — the boundary date itself is not a legal launch day."
        test_recipe:
          setup:
            - "APPROVED Program with launch_window_start 2026-08-01 and launch_window_end 2026-12-31; logical clock advanced to 2026-12-31."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - &k_clock_dec31
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-31T00:00:00Z" }
