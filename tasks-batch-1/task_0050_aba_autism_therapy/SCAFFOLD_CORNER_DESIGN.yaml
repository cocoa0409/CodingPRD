              payload: { full_name: "Imm Child", date_of_birth: "2018-01-01", caregiver_user_id: "cg-imm", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 70 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /diagnostic-evaluations/${eval_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /diagnostic-evaluations/${eval_id}/review"
              payload: { decision: "FINALIZE" }
              as: IntakeCoordinator
            - call: "POST /treatment-plans"
              payload: { client_id: "${client_id}", evaluation_id: "${eval_id}", author_bcba_id: "${bcba_id}", requested_direct_units: 100, requested_supervision_units: 20, requested_parent_training_units: 8 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /treatment-plans/${plan_id}/review"
              payload: { decision: "APPROVE" }
              as: IntakeCoordinator
            - call: "POST /authorizations"
              payload: { treatment_plan_id: "${plan_id}", payer_id: "${payer_id}", authorized_direct_units: 100, authorized_supervision_units: 20, authorized_parent_training_units: 8, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: BillingSpecialist
              captures: { auth_id: $.data.id }
            - call: "POST /therapy-sessions"
              payload: { authorization_id: "${auth_id}", provider_id: "${rbt_id}", service_line: "DIRECT_THERAPY", scheduled_start: "2026-02-02T09:00:00Z", scheduled_end: "2026-02-02T10:30:00Z", scheduled_units: 6 }
              as: RBT
              as_user_id: "${rbt_id}"
          trigger:
            - call: "GET /authorizations/${auth_id}"
              payload: {}
              as: BillingSpecialist
              captures: { reserved: $.data.reserved_direct_units, remaining: $.data.remaining_direct_units }
          assert:
            - "Authorization.${auth_id}.reserved_direct_units == 6 and remaining_direct_units == 94 in the immediate read"
