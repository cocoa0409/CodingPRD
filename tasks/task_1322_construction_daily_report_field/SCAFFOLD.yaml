scenario: |
  Construction Daily Report & Field Documentation (jobsite superintendent): manpower/equipment count & work performed by area, weather & delay condition recording, safety observation & incident capture, material delivery & inspection notes, photo/video documentation tied to location, T&M ticket capture & signature, quantity installed for progress measurement, report distribution & retention for claims

domain_name: construction-daily-reports
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (flat topology; FK links in body)
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: contract_number, type: string, source: input, description: "Unique contract number (ERR_DUPLICATE_CONTRACT_NUMBER)" }
      - { name: scheduled_shift_start, type: string, source: input, default: "07:00", description: "Scheduled shift start, HH:MM 24h, used as delay lost-hours window anchor" }
      - { name: scheduled_shift_hours, type: number, source: input, default: 8, description: "Scheduled workday length in hours; must be > 0 and <= 24" }
      - { name: retention_days, type: integer, source: input, default: 2555, description: "Claims retention period in days applied to distributed reports" }
      - { name: status, type: enum, source: system, description: "MOBILIZING | ACTIVE | SUSPENDED | CLOSED" }
      - { name: percent_complete_units, type: number, source: computed, description: "Mean of per-WorkItem capped unit percents (calc_progress_percent units variant), 2dp" }
      - { name: percent_complete_cost, type: number, source: computed, description: "Cost-weighted uncapped progress percent (calc_progress_percent cost variant), 2dp" }

  - name: WorkArea
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: code, type: string, source: input, description: "Area code, unique within project (ERR_DUPLICATE_WORK_AREA_CODE)" }
      - { name: description, type: string, source: input, required: false, description: "Area description" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED; CLOSED areas reject new child entries (ERR_WORK_AREA_CLOSED)" }

  - name: DeliveryZone
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: zone_code, type: string, source: input, description: "Zone code, unique within project (ERR_DUPLICATE_ZONE_CODE)" }
      - { name: buffer_minutes, type: integer, source: input, default: 30, description: "Required gap between scheduled delivery windows in this zone (>= 0)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED; CLOSED zones reject new deliveries (ERR_DELIVERY_ZONE_CLOSED)" }

  - name: WorkItem
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: cost_code, type: string, source: input, description: "Cost code, unique within project (ERR_DUPLICATE_COST_CODE)" }
      - { name: description, type: string, source: input, description: "Budget line description" }
      - { name: budgeted_quantity, type: number, source: input, description: "Budgeted quantity, must be > 0" }
      - { name: unit, type: enum, source: input, description: "LF | SF | CY | EA | TON | GAL" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Unit cost in cents, >= 0" }
      - { name: installed_to_date, type: number, source: computed, default: 0, description: "Sum of rounded_quantity over ACTIVE QuantityEntry on reports in APPROVED or LOCKED status (calc_work_item_rollup)" }
      - { name: status, type: enum, source: computed, description: "NOT_STARTED (installed_to_date == 0) | IN_PROGRESS (0 < installed_to_date < budgeted_quantity) | COMPLETE (installed_to_date >= budgeted_quantity)" }

  - name: DailyReport
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: report_date, type: string, source: input, description: "Report calendar date YYYY-MM-DD (UTC); unique per project (ERR_DUPLICATE_REPORT_DATE)" }
      - { name: general_notes, type: string, source: input, required: false, description: "Free-text notes" }
      - { name: shift_start_actual, type: datetime, source: input, required: false, description: "Actual shift start; defaults to report_date + project.scheduled_shift_start for lost-hours window" }
      - { name: shift_end_actual, type: datetime, source: input, required: false, description: "Actual shift end" }
      - { name: no_work_performed, type: boolean, source: input, default: false, description: "True = zero-work day; submit then requires zero ACTIVE CrewEntry rows" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | REVISION_REQUESTED | LOCKED" }
      - { name: content_posture, type: enum, source: computed, description: "EDITABLE iff status in {DRAFT, REVISION_REQUESTED} else SEALED; gates all child mutations (carve-out: Incident creation allowed until LOCKED)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured at submit; used for segregation-of-duties on approve" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submit" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments on each request-revision transition" }
      - { name: has_open_incident, type: boolean, source: computed, description: "True iff any linked Incident has status not in {CLOSED_RECORDABLE, CLOSED_NOT_RECORDABLE}" }
      - { name: distribution_hold, type: boolean, source: computed, description: "Equals has_open_incident; when true, distribution create/send is blocked and PENDING records flip to BLOCKED" }
      - { name: retention_class, type: enum, source: computed, description: "STANDARD | CLAIMS_HOLD; CLAIMS_HOLD iff any linked Incident has recordable == true (sticky, survives incident closure)" }
      - { name: retention_release_date, type: datetime, source: computed, description: "null when retention_class == CLAIMS_HOLD or no SENT/ACKNOWLEDGED distribution; else max(sent_at) + project.retention_days" }
      - { name: total_workers, type: integer, source: computed, description: "Sum of worker_count over ACTIVE CrewEntry rows (calc_manpower_split)" }
      - { name: manhours_regular, type: number, source: computed, description: "Sum of per-entry regular band worker-hours, 2dp" }
      - { name: manhours_ot, type: number, source: computed, description: "Sum of per-entry OT band worker-hours, 2dp" }
      - { name: manhours_dt, type: number, source: computed, description: "Sum of per-entry DT band worker-hours, 2dp" }
      - { name: weather_lost_hours, type: number, source: computed, description: "Sum of lost_hours over WEATHER DelayEvent rows with status in {CLASSIFIED, FINAL} and excusable classification, 2dp" }
      - { name: weather_lost_day_calendar, type: boolean, source: computed, description: "Calendar-day variant: weather_lost_hours >= 0.5 * project.scheduled_shift_hours (boundary: >= counts)" }
      - { name: weather_lost_day_fraction, type: number, source: computed, description: "Prorated variant: min(weather_lost_hours / scheduled_shift_hours, 1.0), 2dp round_half_up" }

  - name: CrewEntry
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> DailyReport.id" }
      - { name: work_area_id, type: string, source: input, description: "FK -> WorkArea.id" }
      - { name: subcontractor, type: string, source: input, description: "Subcontractor name" }
      - { name: trade, type: string, source: input, description: "Trade name" }
      - { name: worker_count, type: integer, source: input, description: "Workers on this crew line, >= 1" }
      - { name: hours_per_worker, type: number, source: input, description: "Hours worked per worker this day, >= 0 and <= 24" }
      - { name: work_performed, type: string, source: input, description: "Description of work performed in this area" }
      - { name: regular_hours, type: number, source: computed, description: "worker_count * min(hours_per_worker, 8), 2dp" }
      - { name: ot_hours, type: number, source: computed, description: "worker_count * min(max(hours_per_worker - 8, 0), 4), 2dp" }
      - { name: dt_hours, type: number, source: computed, description: "worker_count * max(hours_per_worker - 12, 0), 2dp" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED" }

  - name: EquipmentEntry
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> DailyReport.id" }
      - { name: work_area_id, type: string, source: input, description: "FK -> WorkArea.id" }
      - { name: equipment_type, type: string, source: input, description: "Equipment type" }
      - { name: unit_count, type: integer, source: input, description: "Number of units, >= 1" }
      - { name: hours_used, type: number, source: input, description: "Run hours, >= 0" }
      - { name: hours_idle, type: number, source: input, description: "Idle/standby hours, >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED" }

  - name: WeatherObservation
    parent: null
    common_fields: false
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> DailyReport.id" }
      - { name: observed_at, type: datetime, source: input, description: "Observation instant; must fall within report_date calendar day [00:00:00Z, +24h) (ERR_WEATHER_OUTSIDE_REPORT_DATE)" }
      - { name: condition, type: enum, source: input, description: "CLEAR | CLOUDY | RAIN | SNOW | WIND | EXTREME_HEAT | EXTREME_COLD" }
      - { name: temperature_f, type: number, source: input, required: false, description: "Temperature Fahrenheit" }
      - { name: precipitation_in, type: number, source: input, required: false, description: "Precipitation inches, >= 0" }
      - { name: wind_mph, type: number, source: input, required: false, description: "Wind speed mph, >= 0" }
      - { name: work_impact, type: enum, source: input, description: "NONE | PARTIAL | STOPPAGE; STOPPAGE enables T&M equipment standby multiplier" }

  - name: DelayEvent
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> DailyReport.id" }
      - { name: work_area_id, type: string, source: input, description: "FK -> WorkArea.id" }
      - { name: start_at, type: datetime, source: input, description: "Delay window start (half-open interval [start_at, end_at))" }
      - { name: end_at, type: datetime, source: input, description: "Delay window end; must be strictly after start_at (ERR_DELAY_WINDOW_INVALID)" }
      - { name: cause, type: enum, source: input, description: "WEATHER | OWNER | MATERIAL | LABOR | EQUIPMENT | OTHER" }
      - { name: classification, type: enum, source: system, description: "null until classified; EXCUSABLE_COMPENSABLE | EXCUSABLE_NON_COMPENSABLE | NON_EXCUSABLE | CONCURRENT" }
      - { name: lost_hours, type: number, source: computed, description: "Overlap of [start_at, end_at) with scheduled shift window, in hours, 2dp (calc_lost_hours)" }
      - { name: status, type: enum, source: system, description: "RECORDED | CLASSIFIED | DISPUTED | FINAL" }
      - { name: dispute_reason, type: string, source: system, description: "Reason captured on dispute" }

  - name: SafetyObservation
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> DailyReport.id" }
      - { name: work_area_id, type: string, source: input, description: "FK -> WorkArea.id" }
      - { name: description, type: string, source: input, description: "Observation text" }
      - { name: risk_level, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }
      - { name: corrective_action, type: string, source: input, required: false, description: "Planned corrective action" }
      - { name: due_date, type: string, source: input, required: false, description: "Corrective action due date YYYY-MM-DD" }
      - { name: media_attachment_id, type: string, source: input, required: false, description: "FK -> MediaAttachment.id; REQUIRED when risk_level == HIGH (ERR_HIGH_RISK_OBSERVATION_REQUIRES_MEDIA); media must be ACTIVE and on same report (ERR_MEDIA_REPORT_MISMATCH)" }
      - { name: status, type: enum, source: system, description: "OPEN | MITIGATED | VERIFIED_CLOSED | ESCALATED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; verify-close requires a different user (ERR_SEGREGATION_OF_DUTIES)" }
      - { name: incident_id, type: string, source: system, description: "FK -> Incident.id; set on escalate" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> DailyReport.id" }
      - { name: work_area_id, type: string, source: input, description: "FK -> WorkArea.id" }
      - { name: safety_observation_id, type: string, source: input, required: false, description: "FK -> SafetyObservation.id; set automatically when created via escalate" }
      - { name: occurred_at, type: datetime, source: input, description: "Incident instant; must be <= logical now (ERR_INCIDENT_OCCURRED_IN_FUTURE)" }
      - { name: severity, type: enum, source: input, description: "FIRST_AID | NEAR_MISS | PROPERTY_DAMAGE | MEDICAL_TREATMENT | LOST_TIME | FATALITY" }
      - { name: injured_count, type: integer, source: input, default: 0, description: "Number injured, >= 0" }
      - { name: days_away, type: integer, source: input, default: 0, description: "Days away from work, >= 0" }
      - { name: narrative, type: string, source: input, description: "Narrative; >= 50 chars when severity in {MEDICAL_TREATMENT, LOST_TIME, FATALITY} (ERR_INCIDENT_NARRATIVE_REQUIRED)" }
      - { name: recordable, type: boolean, source: computed, description: "True iff severity in {MEDICAL_TREATMENT, LOST_TIME, FATALITY}" }
      - { name: osha_notification_deadline, type: datetime, source: computed, description: "occurred_at + 8h for FATALITY, + 24h for LOST_TIME, else null (calc_osha_deadline)" }
      - { name: osha_notified_at, type: datetime, source: system, description: "Logical-clock timestamp of notify-osha; null until notified" }
      - { name: notification_overdue, type: boolean, source: computed, description: "recordable && deadline != null && osha_notified_at == null && logical now > deadline (strictly greater; at deadline exactly NOT overdue)" }
      - { name: status, type: enum, source: system, description: "REPORTED | UNDER_INVESTIGATION | OSHA_NOTIFIED | CLOSED_RECORDABLE | CLOSED_NOT_RECORDABLE" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; close requires a different user (ERR_SEGREGATION_OF_DUTIES)" }

  - name: MediaAttachment
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> DailyReport.id" }
      - { name: work_area_id, type: string, source: input, description: "FK -> WorkArea.id; the location the media is tied to" }
      - { name: media_type, type: enum, source: input, description: "PHOTO | VIDEO" }
      - { name: file_url, type: string, source: input, description: "Stored file URL" }
      - { name: captured_at, type: datetime, source: input, description: "Capture instant; must fall within report_date calendar day [00:00:00Z, +24h) (ERR_MEDIA_CAPTURED_OUTSIDE_REPORT_DATE)" }
      - { name: gps_lat, type: number, source: input, required: false, description: "Latitude; must be supplied together with gps_lng (ERR_GPS_INCOMPLETE_PAIR)" }
      - { name: gps_lng, type: number, source: input, required: false, description: "Longitude; must be supplied together with gps_lat (ERR_GPS_INCOMPLETE_PAIR)" }
      - { name: linked_incident_id, type: string, source: input, required: false, description: "FK -> Incident.id; at most one of linked_incident_id / linked_delivery_id may be set (ERR_MEDIA_LINK_CONSTRAINT); incident must be on same report (ERR_MEDIA_REPORT_MISMATCH)" }
      - { name: linked_delivery_id, type: string, source: input, required: false, description: "FK -> MaterialDelivery.id; at most one of linked_incident_id / linked_delivery_id may be set (ERR_MEDIA_LINK_CONSTRAINT); delivery must be on same report (ERR_MEDIA_REPORT_MISMATCH)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PURGED; purge forbidden when linked_incident_id set (ERR_MEDIA_LINKED_TO_INCIDENT)" }

  - name: MaterialDelivery
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> DailyReport.id" }
      - { name: delivery_zone_id, type: string, source: input, description: "FK -> DeliveryZone.id; scheduled windows in a zone must not collide within buffer_minutes (ERR_DELIVERY_WINDOW_OVERLAP)" }
      - { name: po_number, type: string, source: input, description: "Purchase order reference" }
      - { name: material_description, type: string, source: input, description: "Material description" }
      - { name: delivered_qty, type: number, source: input, description: "Delivered quantity, > 0" }
      - { name: unit, type: enum, source: input, description: "LF | SF | CY | EA | TON | GAL" }
      - { name: scheduled_window_start, type: datetime, source: input, description: "Scheduled delivery window start (closed interval)" }
      - { name: scheduled_window_end, type: datetime, source: input, description: "Scheduled delivery window end; must be strictly after start (ERR_INVALID_WINDOW)" }
      - { name: accepted_qty, type: number, source: system, default: 0, description: "Accepted quantity; partition: accepted + rejected + pending_recount == delivered_qty at all times" }
      - { name: rejected_qty, type: number, source: system, default: 0, description: "Rejected quantity" }
      - { name: pending_recount_qty, type: number, source: system, description: "Unresolved quantity; initialized to delivered_qty at creation" }
      - { name: inspection_notes, type: string, source: input, required: false, description: "Inspection notes" }
      - { name: status, type: enum, source: system, description: "DELIVERED | PARTIAL | INSPECTED; INSPECTED iff pending_recount_qty == 0 after inspection" }

  - name: TmTicket
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> DailyReport.id" }
      - { name: work_item_id, type: string, source: input, description: "FK -> WorkItem.id; cost code the T&M work bills against" }
      - { name: description, type: string, source: input, description: "Work description" }
      - { name: authorized_ceiling_cents, type: integer, source: input, required: false, description: "Not-to-exceed ceiling, > 0 when set; approve requires total_cents <= ceiling (boundary: equal passes) else ERR_TM_CEILING_EXCEEDED" }
      - { name: labor_lines, type: array, source: input, description: "Array of {trade, worker_count >= 1, regular_hours >= 0, ot_hours >= 0, dt_hours >= 0, rate_cents >= 0}; may be empty" }
      - { name: equipment_lines, type: array, source: input, required: false, description: "Array of {equipment_type, hours >= 0, rate_cents >= 0, standby bool}; may be empty" }
      - { name: material_lines, type: array, source: input, required: false, description: "Array of {description, quantity > 0, unit_price_cents >= 0}; may be empty" }
      - { name: labor_cost_cents, type: integer, source: computed, description: "Sum of per-line rounded labor costs (calc_tm_ticket_total), integer cents" }
      - { name: equipment_cost_cents, type: integer, source: computed, description: "Sum of per-line equipment costs with standby multiplier 0.5 applied only when parent report has a STOPPAGE WeatherObservation" }
      - { name: materials_subtotal_cents, type: integer, source: computed, description: "Sum of per-line material quantity * unit_price_cents" }
      - { name: materials_markup_cents, type: integer, source: computed, description: "Markup per calc_material_markup; tier keyed on PRE-markup subtotal" }
      - { name: materials_cost_cents, type: integer, source: computed, description: "materials_subtotal_cents + materials_markup_cents" }
      - { name: total_cents, type: integer, source: computed, description: "labor_cost_cents + equipment_cost_cents + materials_cost_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_SIGNATURES | PARTIALLY_SIGNED | FULLY_SIGNED | APPROVED | REJECTED | VOID" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; signers and approver must differ from it (ERR_SEGREGATION_OF_DUTIES)" }
      - { name: contractor_signed_by, type: string, source: system, description: "X-User-ID of contractor signer; null until signed" }
      - { name: owner_signed_by, type: string, source: system, description: "X-User-ID of owner signer; null until signed; must differ from contractor_signed_by" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments on each revise transition" }
      - { name: reject_reason, type: string, source: system, description: "Reason captured on reject" }

  - name: QuantityEntry
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> DailyReport.id" }
      - { name: work_item_id, type: string, source: input, description: "FK -> WorkItem.id" }
      - { name: work_area_id, type: string, source: input, description: "FK -> WorkArea.id" }
      - { name: quantity_installed, type: number, source: input, description: "Installed quantity this day, > 0" }
      - { name: rounded_quantity, type: number, source: computed, description: "quantity_installed rounded to 3 decimals round_half_up AT WRITE TIME; rollups sum rounded_quantity (calc_quantity_rollup)" }
      - { name: supersedes_id, type: string, source: system, description: "FK -> QuantityEntry.id; self-reference: set on the VOIDED row pointing at its replacement" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED; creating an entry for an existing (report_id, work_item_id, work_area_id) triple voids the prior ACTIVE row (supersede)" }

  - name: DistributionRecord
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> DailyReport.id" }
      - { name: recipient_email, type: string, source: input, description: "Recipient email; unique per report among existing records (ERR_DUPLICATE_RECIPIENT)" }
      - { name: recipient_role, type: enum, source: input, description: "OWNER | ARCHITECT | INSPECTOR | SUBCONTRACTOR | INTERNAL" }
      - { name: status, type: enum, source: system, description: "PENDING | BLOCKED | SENT | ACKNOWLEDGED; BLOCKED auto-set/cleared with report distribution_hold" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock timestamp of send; null until sent" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Logical-clock timestamp of acknowledge; null until acknowledged" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: MOBILIZING
    terminal_states: [CLOSED]
    transitions:
      - from: MOBILIZING
        to: ACTIVE
        trigger: "POST /projects/{id}/activate"
        actor: SystemAdmin
        preconditions: ["status == MOBILIZING (ERR_PROJECT_INVALID_TRANSITION)"]
        side_effects: ["increments Project.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /projects/{id}/suspend"
        actor: SystemAdmin
        preconditions: ["status == ACTIVE (ERR_PROJECT_INVALID_TRANSITION)"]
        side_effects: ["increments Project.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /projects/{id}/resume"
        actor: SystemAdmin
        preconditions: ["status == SUSPENDED (ERR_PROJECT_INVALID_TRANSITION)"]
        side_effects: ["increments Project.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /projects/{id}/close"
        actor: SystemAdmin
        preconditions:
          - "status in {ACTIVE, SUSPENDED} (ERR_PROJECT_INVALID_TRANSITION)"
          - "all DailyReport rows of project have status == LOCKED (ERR_PROJECT_HAS_OPEN_REPORTS)"
        side_effects: ["increments Project.version by 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /projects/{id}/close"
        actor: SystemAdmin
        preconditions:
          - "status in {ACTIVE, SUSPENDED} (ERR_PROJECT_INVALID_TRANSITION)"
          - "all DailyReport rows of project have status == LOCKED (ERR_PROJECT_HAS_OPEN_REPORTS)"
        side_effects: ["increments Project.version by 1"]

  - entity: WorkArea
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /work-areas/{id}/close"
        actor: SystemAdmin
        preconditions: ["status == OPEN (ERR_WORK_AREA_INVALID_TRANSITION)"]
        side_effects: ["increments WorkArea.version by 1"]
      - from: CLOSED
        to: OPEN
        trigger: "POST /work-areas/{id}/reopen"
        actor: SystemAdmin
        preconditions: ["status == CLOSED (ERR_WORK_AREA_INVALID_TRANSITION)"]
        side_effects: ["increments WorkArea.version by 1"]

  - entity: DeliveryZone
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /delivery-zones/{id}/close"
        actor: SystemAdmin
        preconditions: ["status == OPEN (ERR_ZONE_INVALID_TRANSITION)"]
