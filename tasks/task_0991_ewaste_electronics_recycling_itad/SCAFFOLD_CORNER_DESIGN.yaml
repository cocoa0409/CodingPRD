      - name: return_after_finalize_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_SETTLEMENT_ALREADY_FINALIZED]"]
        distinguishing_aspect: "A sold listing cannot be returned once the manifest's settlement is FINALIZED — the sale proceeds are locked into the ledger."
        test_recipe:
