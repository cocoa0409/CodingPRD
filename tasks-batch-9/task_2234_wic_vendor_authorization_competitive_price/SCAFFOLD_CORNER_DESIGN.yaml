  # ===========================================================================
  # From Cross-Cutting Complexity Layers — optimistic_concurrency,
  # rate_threshold_triggers, cascading_side_effects, dual_variant_calculation
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_claim_version_on_adjustment_create_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[adjustment-create-stale-claim]
          - errors.ERR_STALE_CLAIM_VERSION
          - validations[priority 14]
          - endpoints[POST /reimbursement-adjustments]
        distinguishing_aspect: |
          The OCC token is the parent claim's version, and adjudication itself bumps it:
          the version observed at claim creation is already stale by the time an
          adjustment can legally be raised, so replaying it returns 412 while the
          post-adjudication version succeeds, and the rejected attempt leaves the
          version untouched.
        test_recipe:
          setup:
            - "CHAIN A: vendor v1 AUTHORIZED, cycle 2026Q3 PUBLISHED, ACTIVE milk ceiling 336"
            - "One single-line claim (milk, quantity 1, charged 336); the version is captured both at creation and after adjudication"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-A", store_type: "SUPERMARKET", min_monthly_redemption_cents: 5000000, max_monthly_redemption_cents: 20000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.5 }
              as: VendorUnitSupervisor
