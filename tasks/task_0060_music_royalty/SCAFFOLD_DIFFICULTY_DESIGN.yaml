scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pool_net_distributable_pricing_variant_per_play_vs_per_duration
        grounds:
          - calculations.distribution_share
          - calculations.distribution_share.variants[per_play_mode]
          - calculations.distribution_share.variants[per_duration_mode]
          - entities.RoyaltyPool.fields.net_distributable_cents
          - entities.DistributionRuleVersion.fields.distribution_mode
        distinguishing_aspect: |
          Operates on the cost-accounting domain (RoyaltyPool / Distribution / DistributionRuleVersion):
          identical PlaybackEvent inputs produce strictly different per-share gross_amount_cents when
          DistributionRuleVersion.distribution_mode is PER_PLAY vs PER_DURATION because units count plays
          versus seconds — a 5-second skip and a 300-second full play contribute equally under PER_PLAY
          but 60x apart under PER_DURATION.
        test_recipe:
          setup:
            - "Create a RECORDING Work duration_seconds=300, approved with one RightsShare 100% to HolderA."
            - "Create DistributionRuleVersion v_play (PER_PLAY, per_play_weight=1.00, playback_type_weights all 1.00, minimum_payout=0)."
            - "Create DistributionRuleVersion v_dur (PER_DURATION, per_duration_weight=1.00, same type weights)."
            - "Ingest one VALID PlaybackBatch with two PlaybackEvents on this Work: event1 play_duration=5s, event2 play_duration=300s."
            - "Open two pools P1 and P2, identical fields gross_revenue_cents=20_000_000, platform_share=30.00, mechanical_split=0.00 (all to performance), pool_currency=USD, region=WW; pin P1.distribution_rule_version_id=v_play, P2.distribution_rule_version_id=v_dur."
          trigger:
            - "POST /royalty/_clock/advance to period_end"
            - "POST /royalty/pools/{P1}/close"
            - "POST /royalty/pools/{P2}/close"
          assert:
            - "Distribution under P1 for HolderA has gross_amount_cents == 13_100_000 (single work, units=2 plays, share_percent=100 of performance_take=13_100_000-mechanical_take=0; with admin tier fee 900_000)."
            - "Distribution under P2 for HolderA has gross_amount_cents == 13_100_000 as well in this single-work setup, BUT when a second Work with one 5-second play also exists in the pool, P1 splits 50/50 between the two works while P2 splits 5/(5+305) and 305/(5+305) → strictly different gross_amount_cents."
            - "Distribution.gross_amount_cents under PER_PLAY != Distribution.gross_amount_cents under PER_DURATION when ≥2 works share the same pool."

      - name: rights_holder_risk_scoring_forward_vs_chronological
        grounds:
          - calculations.holder_dispute_exposure_score
          - calculations.holder_dispute_exposure_score.variants[forward_looking]
          - calculations.holder_dispute_exposure_score.variants[chronological]
          - entities.RightsHolder
          - entities.Dispute
          - endpoints["GET /royalty/rights-holders/{id}/dispute-exposure"]
        distinguishing_aspect: |
          Operates on the risk-scoring domain (RightsHolder / Dispute), not on cost accounting. Identical
          dispute history produces strictly different scores: forward_looking aggregates open disputes
          plus frozen-exposure ratio with NO time decay, while chronological replays disputes in opened_at
          order with 0.9 decay per later dispute. With 3 disputes on the holder and frozen=1000 cents
          against lifetime_paid=9000, forward score is 7 and chronological score is 6.
        test_recipe:
          setup:
            - "Create RightsHolder H1; approve 3 disputes opened in order on works H1 holds shares of."
            - "Construct H1 with one FROZEN Distribution totaling 1000 cents and lifetime paid 9000 cents (insert via prior pool/payment cycles)."
          trigger:
            - "GET /royalty/rights-holders/{H1}/dispute-exposure?mode=forward_looking"
            - "GET /royalty/rights-holders/{H1}/dispute-exposure?mode=chronological"
          assert:
            - "forward_looking response data.score == 7"
            - "chronological response data.score == 6"
            - "response data.score under forward_looking != response data.score under chronological"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: distribution_share_nonlinear_units_with_branched_mode
        grounds:
          - calculations.distribution_share
          - entities.DistributionRuleVersion.fields.distribution_mode
          - entities.DistributionRuleVersion.fields.playback_type_weights
          - entities.PlaybackEvent.fields.play_duration_seconds
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs and non-linear interaction. distribution_share takes
          DistributionRuleVersion.distribution_mode (a branch), per_play_weight + per_duration_weight
          (a constraint), playback_type_weights[classify(event)] (a piecewise function on
          play_duration / Work.duration ratio thresholds 0.95 and 0.30), and RoyaltyPool.region (a filter).
          The interaction is non-linear: classify(event) is a step function over a ratio, multiplied by
          weight, then divided by sum_units. Same gross_revenue_cents with different combinations of
          mode × playback_type_weights × event distributions produces strictly different per-share
          gross_amount_cents.
        test_recipe:
          setup:
            - "Create Work W1 duration=300s, approved with one RightsShare 100% to H1."
            - "Create DistributionRuleVersion v_hybrid (HYBRID, per_play_weight=0.40, per_duration_weight=0.60, playback_type_weights FULL_PLAY=1.5 SKIP=0.10 BACKGROUND=0.20 FOREGROUND=1.0)."
            - "Ingest 3 PlaybackEvents on W1: event_full (duration=290s, classifies FULL_PLAY); event_skip (duration=60s, classifies SKIP — 60/300=0.20 < 0.30); event_fg (duration=200s, classifies FOREGROUND)."
            - "Open Pool P gross=20_000_000, platform=30, mechanical_split=0, pinned v_hybrid."
          trigger:
            - "POST /royalty/_clock/advance to period_end"
            - "POST /royalty/pools/{P}/close"
          assert:
            - "Distribution.gross_amount_cents == performance_take (13_100_000) (single-work pool absorbs full sub-pool regardless of internal unit values)."
            - "Repeat the same setup with v_hybrid' weights FULL_PLAY=1.0 SKIP=1.0 BACKGROUND=1.0 FOREGROUND=1.0: when a second work W2 is added with one SKIP-classified event, the SPLIT between W1 and W2 changes vs the weighted run — concretely, in the weighted run W1 captures ≥ 90% of performance_take while in the flat run it captures less. Distribution.gross_amount_cents on W1 in weighted setup > Distribution.gross_amount_cents on W1 in flat setup."

      - name: rounding_order_per_share_residual_lodging
        grounds:
          - calculations.distribution_share
          - calculations.distribution_share.precision
          - calculations.pool_tier_fee
          - calculations.pool_tier_fee.precision
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. distribution_share pins:
          (1) per-work round FIRST then sum-residual lodged with the highest-units Work (tie-break
          lowest Work.id lexicographically); (2) per-share round FIRST then sum-residual lodged with
          the share whose share_percent is highest (tie-break lowest RightsShare.id). Reversing the
          order — summing fractional amounts first then rounding — would distribute residuals
          differently. pool_tier_fee similarly pins "round per-tier-slice BEFORE summing", which differs
          from "sum slices then round" at certain boundary inputs.
        test_recipe:
          setup:
            - "Create Work W1 approved with three ACTIVE RightsShares to H1=33%, H2=33%, H3=34% (sum 100)."
            - "Create DistributionRuleVersion v with playback_type_weights all 1.0, PER_PLAY mode, minimum_payout=0."
            - "Ingest one PlaybackEvent on W1 (FULL_PLAY classification)."
            - "Open Pool P contrived so the work_pool_cents ends as exactly 10 cents (e.g., gross_revenue_cents calibrated so that performance_take is split with a single Work to 10 cents — alternatively force via gross=10 cents performance share)."
          trigger:
            - "POST /royalty/_clock/advance to period_end"
            - "POST /royalty/pools/{P}/close"
          assert:
            - "Distribution rows under P: H1.gross_amount_cents == 3, H2.gross_amount_cents == 3, H3.gross_amount_cents == 4 (residual 1 lodged with the share whose share_percent is highest, namely H3)."
            - "Sum across the three Distributions == work_pool_cents == 10 (no cents lost or invented)."
            - "If implementation summed share fractions first (33%+33%+34%=100% of 10 = 10) then rounded each, distribution would be [3.3,3.3,3.4] → [3,3,3] sum=9 with 1 cent unaccounted. The pinned order avoids that."

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_cyclic_mediation_investigation_loop
        grounds:
          - state_machines.Dispute.OPEN_to_UNDER_INVESTIGATION
          - state_machines.Dispute.UNDER_INVESTIGATION_to_MEDIATION
          - state_machines.Dispute.MEDIATION_to_UNDER_INVESTIGATION
          - state_machines.Dispute.MEDIATION_to_ARBITRATION
          - state_machines.Dispute.ARBITRATION_to_RESOLVED_UPHELD
        distinguishing_aspect: |
          Cyclic shape on the Dispute entity: MEDIATION → UNDER_INVESTIGATION is an explicit reverse edge,
          enabling A→B→A loops. A dispute can oscillate UNDER_INVESTIGATION ↔ MEDIATION arbitrarily many
          times before advancing to ARBITRATION. This is structurally different from the linear Work
          registration pipeline.
        test_recipe:
          setup:
            - "Open a Dispute D1 on an APPROVED Work W1 (status==OPEN)."
            - "Submit two evidence items so the dispute is eligible for mediation."
          trigger:
            - "POST /royalty/disputes/{D1}/start-investigation"
            - "POST /royalty/disputes/{D1}/advance-to-mediation"
            - "POST /royalty/disputes/{D1}/reopen-investigation"
            - "POST /royalty/disputes/{D1}/advance-to-mediation"
            - "POST /royalty/disputes/{D1}/advance-to-arbitration"
            - "POST /royalty/disputes/{D1}/resolve with outcome=DISMISSED, arbitration_decision='no merit'"
          assert:
            - "After 6th call Dispute.status == RESOLVED_DISMISSED"
            - "The state was UNDER_INVESTIGATION at least twice (verifiable via Distribution.status cascade or via responses showing the back-and-forth succeeded with 200 each)."
            - "Each reopen-investigation call returned 200; same call from a linear state machine without a back-edge would 409."

      - name: work_branching_with_dispute_posture_parallel_dimension
        grounds:
          - state_machines.Work.UNDER_REVIEW_to_APPROVED
          - state_machines.Work.UNDER_REVIEW_to_REJECTED
          - state_machines.Work.SUBMITTED_to_DRAFT
          - state_machines.Work.APPROVED_to_APPROVED
          - entities.Work.fields.registration_status
          - entities.Work.fields.dispute_posture
        distinguishing_aspect: |
          Branching + parallel dimensions on the Work entity. From UNDER_REVIEW the machine forks
          to APPROVED OR REJECTED with divergent side-effect sets (REJECTED cascades RightsShares to
          TERMINATED with ShareChangeAudit rows of change_kind == TERMINATED; APPROVED does not).
          Additionally Work carries a parallel state dimension dispute_posture (CLEAR / FROZEN) that
          evolves independently of registration_status — once APPROVED, registration_status stays
          APPROVED while dispute_posture flips CLEAR ↔ FROZEN driven by Dispute lifecycle events.
          A revision loop SUBMITTED → DRAFT also makes the registration pipeline non-linear.
        test_recipe:
          setup:
            - "Register Work W1 with two ACTIVE RightsShares H1=60, H2=40; submit; take-review."
            - "Register Work W2 in DRAFT."
          trigger:
            - "POST /royalty/works/{W2}/submit"
            - "POST /royalty/works/{W2}/take-review"
            - "POST /royalty/works/{W1}/reject with reject_reason='lacking proof'"
            - "POST /royalty/works/{W2}/approve"
            - "POST /royalty/disputes (work_id=W2, dispute_kind=SHARE_RATIO, claim_summary='...')"
          assert:
            - "W1.registration_status == REJECTED AND both W1 RightsShares.share_status == TERMINATED AND two ShareChangeAudit rows with change_kind == TERMINATED exist (REJECTED branch side-effects)."
            - "W2.registration_status == APPROVED AND no RightsShare on W2 was terminated (APPROVED branch side-effects)."
            - "After dispute opens on W2, W2.registration_status remains APPROVED but W2.dispute_posture == FROZEN — registration_status and dispute_posture evolve as parallel dimensions on the same Work."

  # =========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: work_rejection_cascade_depth_3
        grounds:
          - state_machines.Work.UNDER_REVIEW_to_REJECTED
          - entities.RightsShare.fields.share_status
          - entities.ShareChangeAudit
        distinguishing_aspect: |
          Cascade depth ≥ 3 triggered by Work.UNDER_REVIEW → REJECTED. Hop 1: REJECTED transition
          mutates Work.registration_status. Hop 2: that mutation causes every RightsShare on the work
          to flip ACTIVE → TERMINATED (Work change → RightsShare change). Hop 3: each RightsShare
          TERMINATION itself emits a ShareChangeAudit row (RightsShare change → ShareChangeAudit
          creation). Each link is caused by the previous link, not a fan-out from the original trigger.
        test_recipe:
          setup:
            - "Register Work W1 with three RightsShares H1=40, H2=30, H3=30; submit; take-review."
          trigger:
            - "POST /royalty/works/{W1}/reject with reject_reason='no proof'"
          assert:
            - "Hop 1: Work.registration_status == REJECTED"
            - "Hop 2: all three RightsShare rows for W1 have share_status == TERMINATED"
            - "Hop 3: GET /royalty/works/{W1}/shares/{share_id}/audit returns at least one ShareChangeAudit per share with change_kind == TERMINATED"
            - "Final cascade depth observed == 3"

      - name: dispute_open_cascade_depth_2
        grounds:
          - state_machines.Work.APPROVED_to_APPROVED
          - state_machines.Distribution.PENDING_to_FROZEN
          - entities.Work.fields.dispute_posture
          - endpoints["POST /royalty/disputes"]
        distinguishing_aspect: |
          Different triggering transition (Dispute opening, not Work rejection). Cascade depth ≥ 2.
          Hop 1: POST /royalty/disputes mutates Work.dispute_posture from CLEAR to FROZEN. Hop 2:
          that mutation on Work causes every PENDING Distribution where Distribution.work_id matches
          the disputed Work to flip PENDING → FROZEN. The link Hop 2 is caused by Hop 1's mutation on
          Work (not by the original POST /royalty/disputes call directly — which only references the
          Work id, it does not iterate Distributions in its own logic; the iteration is implied by the
          dispute_posture recomputation side-effect).
        test_recipe:
          setup:
            - "Register and approve Work W1 with one RightsShare H1=100."
            - "Ingest a VALID PlaybackBatch with one event on W1."
            - "Open Pool P; close it so a PENDING Distribution D1 exists for (W1, H1)."
          trigger:
            - "POST /royalty/disputes (work_id=W1, dispute_kind=OWNERSHIP, claim_summary='claim')"
          assert:
            - "Hop 1: Work.dispute_posture == FROZEN"
            - "Hop 2: Distribution D1.status == FROZEN (was PENDING before)"
            - "Cascade depth observed == 2"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_pool_finalize_conflict
        grounds:
          - validations[priority=9]
          - validations[priority=8]
          - validations[priority=23]
          - validations[priority=26]
        distinguishing_aspect: |
          Pair = state (priority 9 ERR_POOL_HAS_FROZEN_DISTRIBUTIONS) vs business_fiscal (priority 23
          ERR_BELOW_MIN_PAYOUT triggered on a downstream payout path). When a CLOSED pool has both
          FROZEN distributions AND a hypothetical payout attempted on it with sub-threshold amounts,
          the state-category error (POOL_HAS_FROZEN_DISTRIBUTIONS) wins because finalize is checked
          first; the fiscal check never executes. Different pair than instance 2 below.
        test_recipe:
          setup:
            - "Create approved Work W1 with two RightsShares H1=60, H2=40."
            - "Open Pool P, ingest playback, close P → PENDING Distributions created."
            - "Open Dispute on W1 → W1.dispute_posture=FROZEN, Distributions for W1 flip to FROZEN."
          trigger:
            - "POST /royalty/pools/{P}/finalize"
          assert:
            - "Response 409 with data.error_id == ERR_POOL_HAS_FROZEN_DISTRIBUTIONS (state-category error wins over any fiscal check, even though hypothetical resulting payments might be below minimum)."

      - name: business_safety_vs_business_referential_minor_payout_conflict
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=16]
          - validations[priority=25]
        distinguishing_aspect: |
          Pair = business_safety (priority 11 ERR_MINOR_PAYOUT_BLOCKED) vs business_referential
          (priority 25 ERR_DISTRIBUTION_NOT_FORFEITABLE). Both error categories differ from instance 1.
          When attempting to forfeit a minor's distribution where bank_token still active AND payment
          still queued, the higher-priority business_safety check fires first against a separate path
          (payout-batches creation), so the forfeit endpoint correctly emits the
          business_referential error. The conflict is reversible: in payout-batch generation the
          safety error wins.
        test_recipe:
          setup:
            - "Create RightsHolder G1 (ORGANIZATION, adult guardian)."
            - "Create RightsHolder H_minor (INDIVIDUAL, is_minor=true, guardian_holder_id=G1)."
            - "But DO NOT register an active routing for the minor (the binding to guardian is not yet stored as the payout-routing instruction)."
            - "Approve a Work W1 with RightsShare H_minor=100, ingest playback, close & finalize pool → RELEASED Distribution for H_minor."
          trigger:
            - "POST /royalty/payout-batches (cycle_tag='C1', scheduled_run_at=now)"
          assert:
            - "Response 422 with data.error_id == ERR_MINOR_PAYOUT_BLOCKED (business_safety priority 11 wins; the business_referential forfeit-path is not even reached on this call)."
            - "Inverse test on POST /royalty/distributions/{D1}/forfeit while bank_token still active → response 409 with data.error_id == ERR_DISTRIBUTION_NOT_FORFEITABLE (business_referential, priority 25)."

  # =========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: minimum_payout_threshold_exact_equal_inclusive
        grounds:
          - calculations.payment_aggregation
          - entities.DistributionRuleVersion.fields.minimum_payout_cents
          - validations[priority=23]
          - endpoints["POST /royalty/payout-batches"]
        distinguishing_aspect: |
          Numeric threshold on Payment.gross_cents vs minimum_payout_cents. Boundary precision: the
          rule is `gross_cents >= minimum_payout_cents` (>= not >). A holder with exactly 500 cents
          and minimum_payout_cents=500 MUST be paid; with 499 cents the payment is NOT created and
          MicroBalance increments by 499. Reachable via POST /royalty/payout-batches.
        test_recipe:
          setup:
            - "Create DistributionRuleVersion v with minimum_payout_cents=500, micro_accumulation_cap_cents=2000."
            - "Set up holder H1 with one RELEASED Distribution net=500 cents in USD."
            - "Set up holder H2 with one RELEASED Distribution net=499 cents in USD."
          trigger:
            - "POST /royalty/payout-batches (cycle_tag='C1', scheduled_run_at=now)"
          assert:
            - "Payment row for H1 created with gross_cents == 500 (>= threshold)"
            - "No Payment row for H2; MicroBalance for (H2, USD).balance_cents == 499 (< threshold, < cap)"
            - "If threshold check were `gross > minimum` (strict), H1 would also be excluded — but the pinned >= semantics include 500 exactly."

      - name: empty_event_set_pool_close_zero_units
        grounds:
          - calculations.distribution_share
          - state_machines.RoyaltyPool.OPEN_to_CLOSED
          - endpoints["POST /royalty/pools/{id}/close"]
        distinguishing_aspect: |
          Empty-set boundary on a different metric (event count) reached via a different endpoint
          (pool close, not payout-batches). When the eligible PlaybackEvent set for a pool is empty
          (sum_units_in_sub_pool == 0), the calculation must not divide by zero; instead, no
          Distribution rows are produced and the pool closes with status CLOSED but zero rows.
        test_recipe:
          setup:
            - "Create one approved Work W1; create no PlaybackBatch for the pool period (empty event set)."
            - "Open Pool P with valid gross_revenue_cents and rule version."
          trigger:
            - "POST /royalty/_clock/advance to period_end"
            - "POST /royalty/pools/{P}/close"
          assert:
            - "Response 200 with RoyaltyPool.status == CLOSED"
            - "GET /royalty/pools/{P}/distributions returns total_count == 0 (no rows produced)"
            - "RoyaltyPool.net_distributable_cents > 0 (computation still ran) but no distributions consumed it — pool.net_distributable_cents stays as the unallocated remainder."

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pool_finalize_depends_on_distribution_states
        grounds:
          - state_machines.RoyaltyPool.CLOSED_to_DISTRIBUTED
          - state_machines.Distribution.PENDING_to_FROZEN
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair = RoyaltyPool ↔ Distribution. RoyaltyPool can transition CLOSED → DISTRIBUTED
          only if NO Distribution under it has status == FROZEN. The pool's valid transitions depend
          on aggregate state of its children Distributions.
        test_recipe:
          setup:
            - "Approve Work W1; ingest playback; open and close Pool P → PENDING Distributions D1..Dn."
            - "Open Dispute on W1 → cascade flips at least one Distribution to FROZEN."
          trigger:
            - "POST /royalty/pools/{P}/finalize"
          assert:
            - "Response 409, data.error_id == ERR_POOL_HAS_FROZEN_DISTRIBUTIONS"
            - "After resolving the dispute (which flips FROZEN distributions to RELEASED), POST /royalty/pools/{P}/finalize succeeds with 200."

      - name: rights_share_termination_depends_on_work_dispute_posture
        grounds:
          - validations[priority=7]
          - entities.Work.fields.dispute_posture
          - entities.RightsShare.fields.share_status
          - endpoints["PATCH /royalty/works/{id}/shares/{share_id}"]
        distinguishing_aspect: |
          Different entity pair: RightsShare ↔ Work. Whether a RightsShare can transition share_status
          out of ACTIVE depends on Work.dispute_posture. When dispute_posture == FROZEN, the share
          mutation is rejected with ERR_WORK_FROZEN. When CLEAR, the mutation succeeds. Same actor,
          same payload — outcome determined by parent's state.
        test_recipe:
          setup:
            - "Approve Work W1 with two ACTIVE RightsShares H1=60 H2=40."
            - "Branch A: dispute_posture stays CLEAR."
            - "Branch B: open Dispute D1 on W1 → dispute_posture=FROZEN."
          trigger:
            - "Branch A: PATCH /royalty/works/{W1}/shares/{s_h1} body {share_status: 'TERMINATED'}"
            - "Branch B: same request"
          assert:
            - "Branch A: response 200, RightsShare.share_status == TERMINATED"
            - "Branch B: response 409, data.error_id == ERR_WORK_FROZEN; RightsShare.share_status unchanged (still ACTIVE)"
            - "Pair Work↔RightsShare exercised; outcome differs solely due to Work.dispute_posture state."

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: agency_binding_half_open_adjacency_allowed
        grounds:
          - validations[priority=19]
          - validations[priority=20]
          - entities.AgencyBinding.fields.effective_from
          - entities.AgencyBinding.fields.effective_until
        distinguishing_aspect: |
          Half-open interval semantics with EXACT adjacency permitted. Two AgencyBindings on the
          same (rights_holder_id, agency_kind, territory) are allowed when binding_B.effective_from
          == binding_A.effective_until (zero buffer required). They are rejected as overlap when
          binding_B.effective_from < binding_A.effective_until even by one microsecond. The boundary
          test pins the closed-open interval treatment [effective_from, effective_until).
        test_recipe:
          setup:
            - "Create RightsHolder H1."
            - "Create AgencyBinding A1: agency_kind=PUBLISHER, territory='US', effective_from=2026-01-01T00:00:00Z, effective_until=2026-06-01T00:00:00Z."
          trigger:
            - "Case adjacent-OK: POST /royalty/agency-bindings A2 (same kind/territory/holder, effective_from=2026-06-01T00:00:00Z, effective_until=2026-12-01T00:00:00Z)"
            - "Case overlap-FAIL: POST /royalty/agency-bindings A3 (same kind/territory/holder, effective_from=2026-05-31T23:59:59.999Z, effective_until=2026-12-01T00:00:00Z)"
          assert:
            - "Adjacent-OK request returns 201 (zero-buffer adjacency permitted)."
            - "Overlap-FAIL request returns 409, data.error_id == ERR_AGENCY_BINDING_OVERLAP."

      - name: playback_batch_exact_window_uniqueness
        grounds:
          - validations[priority=22]
          - state_machines.PlaybackBatch.PENDING_to_DEDUPED_REJECTED
          - entities.PlaybackBatch.fields.reporting_period_start
          - entities.PlaybackBatch.fields.reporting_period_end
          - concurrency_rules["PlaybackBatch ingest collides"]
        distinguishing_aspect: |
          Different resource (PlaybackBatch, not AgencyBinding) and different interval semantics:
          aggregate uniqueness on EXACT (period_start, period_end) per source_identifier — adjacency
          is allowed but exact-match is not. A batch with shifted period_start by even 1 second is
          permitted; an identical period is rejected as DEDUPED_REJECTED. This is point-equality
          uniqueness rather than the half-open overlap semantics used for AgencyBindings.
        test_recipe:
          setup:
            - "Pre-register a PlaybackSource with secret S."
            - "POST /royalty/playback-batches B1 with source='spotify-us', period [2026-01-01, 2026-01-08), signed correctly → validity_status VALID."
          trigger:
            - "Case same-window: POST /royalty/playback-batches B2 with identical source and identical window."
            - "Case shifted-by-1s: POST /royalty/playback-batches B3 with source='spotify-us', period [2026-01-01T00:00:01Z, 2026-01-08T00:00:01Z)."
          assert:
            - "B2 response: 201 created BUT B2.validity_status == DEDUPED_REJECTED (state machine PENDING → DEDUPED_REJECTED)."
            - "B3 response: 201 with validity_status == VALID — shifted window is not a duplicate."
            - "Interval semantics differ from AgencyBinding case: here exact equality matters, adjacency is irrelevant; in AgencyBinding case overlap (even tiny) matters and exact adjacency is fine."

  # =========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dispute_open_resolve_distribution_status_invariant
        grounds:
          - state_machines.Work.APPROVED_to_APPROVED
          - state_machines.Distribution.PENDING_to_FROZEN
          - state_machines.Distribution.FROZEN_to_RELEASED
          - state_machines.Dispute.ARBITRATION_to_RESOLVED_DISMISSED
        distinguishing_aspect: |
          Conserved quantity = the sum sum(Distribution.gross_amount_cents) for the disputed Work
          across all statuses. After the forward action (open Dispute → cascade flips Distributions
          PENDING→FROZEN) and its compensating action (resolve Dispute → cascade flips FROZEN→RELEASED),
          this sum MUST be identical to the pre-action sum, and each individual Distribution's
          gross_amount_cents MUST be unchanged. No cents are created or destroyed by the
          freeze/unfreeze round-trip.
        test_recipe:
          setup:
            - "Approve Work W1 with two RightsShares H1=60 H2=40, ingest playback, close pool → PENDING D1,D2."
            - "Record pre_sum = D1.gross_amount_cents + D2.gross_amount_cents."
          trigger:
            - "POST /royalty/disputes (work_id=W1, dispute_kind=OWNERSHIP)"
            - "POST /royalty/disputes/{D}/start-investigation"
            - "POST /royalty/disputes/{D}/submit-evidence (×2)"
            - "POST /royalty/disputes/{D}/advance-to-mediation"
            - "POST /royalty/disputes/{D}/advance-to-arbitration"
            - "POST /royalty/disputes/{D}/resolve (outcome=DISMISSED, arbitration_decision='no merit')"
          assert:
            - "After resolve, D1.status == RELEASED AND D2.status == RELEASED (or PENDING→RELEASED if pool not yet finalized — verify status is no longer FROZEN)."
            - "D1.gross_amount_cents and D2.gross_amount_cents are byte-for-byte unchanged from pre_sum recordings."
            - "Invariant: sum(Distribution.gross_amount_cents for W1) == pre_sum (exactly conserved across freeze/unfreeze cycle)."

      - name: payment_retry_abandon_micro_balance_invariant
        grounds:
          - state_machines.Payment.QUEUED_to_SENT
          - state_machines.Payment.SENT_to_FAILED
          - state_machines.Payment.FAILED_to_RETRYING
          - state_machines.Payment.FAILED_to_ABANDONED
          - calculations.payment_aggregation
          - entities.MicroBalance.fields.balance_cents
        distinguishing_aspect: |
          Different conserved quantity: total holder-owed cents = sum across (RELEASED Distributions
          net_after_commission_cents + MicroBalance.balance_cents) for a given (holder, currency).
          When a Payment is generated (drains MicroBalance to 0 and aggregates net cents), then fails,
          then is abandoned with policy=RETURN_TO_MICRO, the original sum MUST equal the
          post-abandon sum. The cents move between accounts but are never gained or lost.
        test_recipe:
          setup:
            - "Holder H1 with 3 RELEASED Distributions netting 700 cents total in USD; MicroBalance.balance_cents == 300 (from prior cycle)."
            - "Record pre_owed = 700 + 300 = 1000."
            - "Generate PayoutBatch B; Payment P created with gross_cents == 1000; MicroBalance drained to 0."
            - "Execute batch → Payment.status SENT."
            - "POST /royalty/_events/psp-callback (payment_id=P, outcome=FAILURE, reason='psp_timeout') → Payment.status FAILED."
          trigger:
            - "POST /royalty/payments/{P}/retry (×3 times — retry_count saturates at 3)"
            - "POST /royalty/_events/psp-callback FAILURE between retries"
            - "POST /royalty/payments/{P}/abandon (policy='RETURN_TO_MICRO')"
          assert:
            - "After abandon: GET /royalty/rights-holders/{H1}/micro-balance returns MicroBalance.balance_cents == 1000 (the entire 700 + 300 returned)."
            - "All three Distributions revert from RELEASED to a state that re-credits the holder (e.g., counted into micro)."
            - "Invariant: post_micro + sum(net_after_commission_cents of still-RELEASED Distributions for H1/USD) == pre_owed == 1000. No cents drift."
