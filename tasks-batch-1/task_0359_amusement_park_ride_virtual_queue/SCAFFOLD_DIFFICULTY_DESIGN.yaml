scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: lightning_lane_price_peak_vs_open_on_purchase
        grounds:
          - calculations.lightning_lane_price
          - entities.LightningLanePurchase.fields.charged_cents
          - entities.EntitlementPlan.fields.surge_multiplier
        distinguishing_aspect: |
          On the LightningLanePurchase domain the same plan price yields a surged charge when the
          target ride's load >= RIDE_PEAK_LOAD (PEAK) and the flat base when below — 3000 vs 1500
          cents for the identical MULTI_PASS plan — a divergence keyed on ride load, not on time.
        test_recipe:
          setup:
            - "Park P with a SINGLE-window small ride R5 (hourly_throughput=5, one 60-min window slot_capacity=2)"
            - "Two VIRTUAL_QUEUE reservations HELD on R5's window so ride_load = 2/2 = 1.0 >= 0.75 => PEAK contribution"
            - "MULTI_PASS plan price 1500 cents, surge 2.0; guest GB buys a Lightning Lane on the loaded ride R5"
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R5", hourly_throughput: 5 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GA", height_cm: 170 }
              as: ParkAdmin
              captures: { ga_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GB", height_cm: 170 }
              as: ParkAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${ga_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${ga_id}"
              captures: { res_a_id: $.data.id, win_v1: $.data.version }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${gb_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v1}" }
              as: GuestApp
              as_user_id: "${gb_id}"
            - call: "POST /parks/${park_id}/entitlement-plans"
              payload: { tier: "MULTI_PASS", price_cents: 1500, max_concurrent_holds: 3, surge_multiplier: 2.0 }
              as: ParkAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /lightning-lane-purchases"
              payload: { park_id: "${park_id}", guest_id: "${gb_id}", ride_id: "${ride_id}", plan_id: "${plan_id}" }
              as: GuestApp
              as_user_id: "${gb_id}"
              captures: { ll_id: $.data.id }
          assert:
            - "LightningLanePurchase.${ll_id}.charged_cents == 3000"
            - "LightningLanePurchase.${ll_id}.hold_status == ACTIVE"

      - name: posted_wait_operating_vs_down_on_ride
        grounds:
          - calculations.posted_wait_estimate
          - entities.Ride.fields.posted_wait_minutes
          - state_machines.Ride.OPEN_to_DOWN
        distinguishing_aspect: |
          On the Ride domain the wait estimate is ceil((booked_slot_count+20)/throughput*60) while OPEN
          but short-circuits to 0 when operational_status is DOWN — 36 vs 0 for the identical booked load.
        test_recipe:
          setup:
            - "Park P; ride R100 (throughput 100) with a 60-min window slot_capacity 40"
            - "40 VIRTUAL_QUEUE reservations HELD (booked_slot_count=40) while ride OPEN => posted_wait_minutes=36"
            - "Then operator declares R100 DOWN"
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R100", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "G1", height_cm: 170 }
              as: ParkAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${g1_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${g1_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /rides/${ride_id}/declare-down"
              payload: {}
              as: RideOperator
          assert:
            - "Ride.${ride_id}.operational_status == DOWN"
            - "Ride.${ride_id}.posted_wait_minutes == 0"
        # NOTE: this instance seeds booked_slot_count=1 (one reservation) for executability; the
        # variant divergence is the 0-vs-positive short-circuit. The 36-vs-0 full-load figure is
        # covered by corner instance computed_posted_wait_open_full_load on the same formula.

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: lightning_lane_price_nested_min_and_branches
        grounds:
          - calculations.lightning_lane_price
          - entities.EntitlementPlan.fields.tier
          - entities.LightningLanePurchase.fields.charged_cents
        distinguishing_aspect: |
          MODE (a): >=4 inputs (phase, base, surge, cap, tier) interacting non-linearly — a phase
          branch selecting surge, a tier branch selecting whether the SINGLE_PASS_CAP_CENTS min() binds.
          A SINGLE_PASS at PEAK with base 8000 x surge 2.0 = 16000 is capped to 9900.
        test_recipe:
          setup:
            - "Loaded ride R5 (ride_load 2/2 = PEAK) as in dual-variant setup"
            - "SINGLE_PASS plan base 8000 cents, surge 2.0, cap 9900; guest GB buys"
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R5", hourly_throughput: 5 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GA", height_cm: 170 }
              as: ParkAdmin
              captures: { ga_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GB", height_cm: 170 }
              as: ParkAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${ga_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${ga_id}"
              captures: { win_v1: $.data.version }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${gb_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v1}" }
              as: GuestApp
              as_user_id: "${gb_id}"
            - call: "POST /parks/${park_id}/entitlement-plans"
              payload: { tier: "SINGLE_PASS", price_cents: 8000, max_concurrent_holds: 1, surge_multiplier: 2.0 }
              as: ParkAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /lightning-lane-purchases"
              payload: { park_id: "${park_id}", guest_id: "${ga_id}", ride_id: "${ride_id}", plan_id: "${plan_id}" }
              as: GuestApp
              as_user_id: "${ga_id}"
              captures: { ll_id: $.data.id }
          assert:
            - "LightningLanePurchase.${ll_id}.charged_cents == 9900"

      - name: slot_capacity_minute_truncation_then_floor_order
        grounds:
          - calculations.return_window_slot_capacity
          - entities.ReturnWindow.fields.slot_capacity
        distinguishing_aspect: |
          MODE (b): nested truncation order is pinned — window_minutes is truncated to whole minutes
          FIRST, then multiplied by throughput*VQ_SUPPLY_FRACTION, then floored. A 90-minute window on
          throughput 100 yields floor(100*1.5*0.40)=60; the order (truncate-minutes then floor-product)
          is the pinned interpretation distinct from the price formula's cap-then-round order.
        test_recipe:
          setup:
            - "Park P; ride RT (throughput 100); a 90-minute window 10:00->11:30"
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "RT", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
          trigger:
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:30:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id }
          assert:
            - "ReturnWindow.${win_id}.slot_capacity == 60"
            - "ReturnWindow.${win_id}.window_status == OPEN"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_cycle_booked_redistributed_booked
        grounds:
          - state_machines.Reservation.BOOKED_to_REDISTRIBUTED
          - state_machines.Reservation.REDISTRIBUTED_to_BOOKED
          - entities.Reservation.fields.redistributed_from_window_id
        distinguishing_aspect: |
          On the Reservation entity the lifecycle is a cycle BOOKED->REDISTRIBUTED (on ride-down) ->BOOKED
          (on redistribute into a replacement window), not a one-way pipeline; redistributed_from_window_id
          records the original window and the reservation re-enters BOOKED on a different window.
        test_recipe:
          setup:
            - "Ride R with two windows W1 (10:00-11:00) and W2 (11:00-12:00), both OPEN with capacity"
            - "Guest books+confirms a VIRTUAL_QUEUE reservation on W1 (BOOKED) while clock is 09:00"
            - "Operator declares R DOWN (reservation -> REDISTRIBUTED, both windows SUSPENDED); clock advanced to 11:30 so W1 has elapsed; restore then expires W1 and re-opens only the still-future W2; redistribute re-homes into W2 (the sole OPEN future window)"
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { w1_id: $.data.id, w1_v0: $.data.version }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T11:00:00.000Z", window_end_utc: "2026-06-15T12:00:00.000Z" }
              as: ParkAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "G1", height_cm: 170 }
              as: ParkAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${g1_id}", return_window_id: "${w1_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${w1_v0}" }
              as: GuestApp
              as_user_id: "${g1_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: GuestApp
              as_user_id: "${g1_id}"
            - call: "POST /rides/${ride_id}/declare-down"
              payload: {}
              as: RideOperator
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T11:30:00.000Z" }
              as: ParkAdmin
            - call: "POST /rides/${ride_id}/restore"
              payload: {}
              as: RideOperator
          trigger:
            - call: "POST /rides/${ride_id}/redistribute"
              payload: {}
              as: RideOperator
          assert:
            - "Reservation.${res_id}.reservation_status == BOOKED"
            - "Reservation.${res_id}.return_window_id == ${w2_id}"
            - "Reservation.${res_id}.redistributed_from_window_id == ${w1_id}"

      - name: return_window_cycle_open_exhausted_open
        grounds:
          - state_machines.ReturnWindow.OPEN_to_EXHAUSTED
          - state_machines.ReturnWindow.EXHAUSTED_to_OPEN
          - entities.ReturnWindow.fields.reserved_count
        distinguishing_aspect: |
          On the ReturnWindow entity the window oscillates OPEN->EXHAUSTED (when reserved_count hits
          slot_capacity) ->OPEN (when a cancel frees a slot before expiry) — a cycle on a different
          entity than Reservation, driven by reserved_count crossing slot_capacity in both directions.
        test_recipe:
          setup:
            - "Ride R5 (throughput 5) with a 60-min window capacity 2"
            - "Two VIRTUAL_QUEUE reservations HELD fill the window to EXHAUSTED"
            - "Cancelling one HELD reservation frees a slot -> window returns to OPEN"
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R5", hourly_throughput: 5 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GA", height_cm: 170 }
              as: ParkAdmin
              captures: { ga_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GB", height_cm: 170 }
              as: ParkAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${ga_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${ga_id}"
              captures: { res_a_id: $.data.id, win_v1: $.data.version }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${gb_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v1}" }
              as: GuestApp
              as_user_id: "${gb_id}"
              captures: { res_b_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_b_id}/cancel"
              payload: {}
              as: GuestApp
              as_user_id: "${gb_id}"
          assert:
            - "ReturnWindow.${win_id}.window_status == OPEN"
            - "ReturnWindow.${win_id}.reserved_count == 1"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: window_expiry_forfeits_reservation_then_recomputes_wait
        grounds:
          - state_machines.ReturnWindow.OPEN_to_EXPIRED
          - state_machines.Reservation.BOOKED_to_FORFEITED
          - calculations.posted_wait_estimate
        distinguishing_aspect: |
          Depth-3 chain from a single trigger: advance-windows expires the window (A->B), the window's
          expiry forfeits its BOOKED reservation (B->C), and that forfeit decrements Ride.booked_slot_count
          which recomputes Ride.posted_wait_minutes (C->D) — each hop caused by the prior, not by advance-windows directly.
        test_recipe:
          setup:
            - "Ride R100 with a window 10:00-11:00 capacity 40; one VIRTUAL_QUEUE reservation BOOKED (booked_slot_count=1, posted_wait=13)"
            - "Clock advanced past 11:00 so the window has elapsed"
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T10:30:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R100", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "G1", height_cm: 170 }
              as: ParkAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${g1_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${g1_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: GuestApp
              as_user_id: "${g1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T11:05:00.000Z" }
              as: ParkAdmin
          trigger:
            - call: "POST /parks/${park_id}/advance-windows"
              payload: {}
              as: ParkAdmin
          assert:
            - "ReturnWindow.${win_id}.window_status == EXPIRED"
            - "Reservation.${res_id}.reservation_status == FORFEITED"
            - "Ride.${ride_id}.booked_slot_count == 0"
            - "Ride.${ride_id}.posted_wait_minutes == 12"

      - name: party_disband_removes_memberships_then_clears_guest_party_id
        grounds:
          - state_machines.Party.FORMING_to_DISBANDED
          - entities.PartyMembership.fields.membership_status
          - entities.Guest.fields.party_id
        distinguishing_aspect: |
          Depth-2+ chain from a different trigger (disband): Party FORMING->DISBANDED (A->B) sets every
          LINKED PartyMembership to REMOVED (B->C), and each removal clears the owning Guest.party_id to
          null (C->D). Originates from disband, distinct from the advance-windows expiry cascade.
        test_recipe:
          setup:
            - "Party led by guest GL with a second linked member GM (both Guest.party_id set)"
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GL", height_cm: 170 }
              as: ParkAdmin
              captures: { gl_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GM", height_cm: 170 }
              as: ParkAdmin
              captures: { gm_id: $.data.id }
            - call: "POST /parks/${park_id}/parties"
              payload: { leader_guest_id: "${gl_id}" }
              as: GuestApp
              as_user_id: "${gl_id}"
              captures: { party_id: $.data.id }
            - call: "POST /parties/${party_id}/members"
              payload: { guest_id: "${gm_id}" }
              as: GuestApp
              as_user_id: "${gl_id}"
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /parties/${party_id}/disband"
              payload: {}
              as: GuestApp
              as_user_id: "${gl_id}"
          assert:
            - "Party.${party_id}.party_status == DISBANDED"
            - "PartyMembership.${mem_id}.membership_status == REMOVED"
            - "Guest.${gm_id}.party_id == null"
            - "Guest.${gl_id}.party_id == null"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: redeem_invalid_state_beats_height_on_reservation
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Reservation.BOOKED_to_REDEEMED
        distinguishing_aspect: |
          A redeem request on a reservation that is still HELD (not BOOKED) AND whose guest is below the
          ride height fails BOTH the state check (priority 5, ERR_INVALID_STATE) and the safety height check
          (priority 7); the state vs business_safety pair resolves to ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Ride RH min_height_cm=120; short guest GS height 110; a VIRTUAL_QUEUE reservation left HELD (never confirmed)"
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T10:15:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "RH", hourly_throughput: 100, min_height_cm: 120 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
