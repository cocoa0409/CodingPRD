            - call: "POST /resilience/mutual-aid-pacts/${pact_id}/commitments"
              payload: { requesting_jurisdiction_id: "${j_ridge_id}", asset_id: "${a_cool_id}", committed_units: 4, window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-20T00:00:00Z", expected_mutual_aid_pact_version: "${pact_v2}" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
          assert:
            - "captured pact_v1 == 1 and the setup commitment left the pact at reserved_units 6, free_units 4, status OPEN"
            - "first call: status 412 with data.error_id == ERR_STALE_PACT_VERSION, not 409 ERR_AID_CAPACITY_EXCEEDED, even though 6 + 8 = 14 exceeds the pledge of 10"
            - "second call: data.version == 2 so pact_v2 == 2, and reserved_units is still 6 because the rejected request wrote nothing"
            - "third call: status 409 with data.error_id == ERR_AID_CAPACITY_EXCEEDED once the version matches"
            - "fourth call: status 201 with data.committed_units == 4 and data.status == COMMITTED"
            - "GET /resilience/mutual-aid-pacts/${pact_id} then reads version 3, reserved_units 10, free_units 0 and status EXHAUSTED, so reserved + free == pledged still holds"

