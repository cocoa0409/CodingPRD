              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 0, opening_balance_cents: 0 }
