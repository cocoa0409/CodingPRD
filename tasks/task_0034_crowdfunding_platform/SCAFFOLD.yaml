scenario: |
  Crowdfunding platform: project initiation and review with project-category classification,
  initiator qualification verification, project description and media submission,
  risk-disclosure clauses, and multi-stage review (content/legal/financial); crowdfunding
  goal and tiered rewards with funding-target setting, all-or-nothing or keep-it-all model,
  tiered reward configuration (amount-to-reward mapping), reward inventory limits, and
  add-on item support; backer ordering with reward selection, shipping address collection
  (for physical rewards), payment method selection, payment authorization, and order
  modification within allowed window; fund escrow with third-party escrow account,
  payment-authorization-only at backing time, charge-on-success rules, charge-failure
  retry, and refund-on-failure execution; project progress updates with milestone
  definition, progress-update publishing, backer-only content, delay notification, and
  update-frequency monitoring; refund rules with refund eligibility by project state
  (failed/cancelled/dispute), partial-refund for partially-shipped rewards, refund
  approval workflow, and platform-side mandatory refund triggers; platform commission
  with commission rate by project category, payment-channel fee, refund-induced
  commission reversal, tax handling, and periodic settlement to project initiator;
  event-driven synchronization with payment, banking, IM, and logistics systems; audit
  logging for fund flow and project status changes.

domain_name: "crowdfunding-platform"
api_prefix: "/projects"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: event_sourcing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - idempotency
    - scheduled_deferred_actions

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: saga

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Initiator
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal entity or individual name"
      - name: kyc_status
        type: enum
        source: system
        description: "KYC verification state"
        constraints: "values: PENDING, VERIFIED, REJECTED"
        default: PENDING
      - name: tax_id
        type: string
        source: input
        description: "Tax identifier for settlement"
      - name: bank_account_id
        type: string
        source: input
        description: "Reference to settlement bank account at the third-party escrow"
      - name: qualification_doc_uri
        type: string
        source: input
        description: "URI to uploaded qualification documents"

  - name: Backer
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Backer public display name"
      - name: email
        type: string
        source: input
        description: "Notification email; unique"
        constraints: "unique"
      - name: default_shipping_address
        type: object
        source: input
        description: "Optional default shipping address"

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: initiator_id
        type: string
        source: input
        description: "Owning Initiator.id"
      - name: title
        type: string
        source: input
        description: "Project title; 4..120 chars"
      - name: category
        type: enum
        source: input
        description: "Project category; drives commission rate"
        constraints: "values: TECH, ART, COMMUNITY"
      - name: description_md
        type: string
        source: input
        description: "Long-form description in Markdown"
      - name: media_uris
        type: array
        source: input
        description: "Image/video URIs (1..10)"
      - name: risk_disclosure
        type: string
        source: input
        description: "Mandatory risk-disclosure clause text"
      - name: funding_model
        type: enum
        source: input
        description: "Funding settlement model"
        constraints: "values: ALL_OR_NOTHING, KEEP_IT_ALL"
      - name: funding_target_cents
        type: integer
        source: input
        description: "Goal in cents; > 0"
      - name: deadline
        type: datetime
        source: input
        description: "Funding deadline (UTC). After this, no new orders accepted."
      - name: status
        type: enum
        source: system
        description: "Project lifecycle state"
        constraints: "values: DRAFT, CONTENT_REVIEW, LEGAL_REVIEW, FINANCIAL_REVIEW, REJECTED, LIVE, SUCCEEDED, FAILED, CANCELLED"
        default: DRAFT
      - name: provisional_raised_cents
        type: integer
        source: computed
        description: "Sum of authorized order pledge totals (live counter; recomputed via funding_progress_provisional)"
        default: 0
      - name: final_raised_cents
        type: integer
        source: computed
        description: "Sum of CHARGED orders after deadline; populated at settlement (recomputed via funding_progress_final)"
        default: 0
      - name: rejection_reason
        type: string
        source: system
        description: "Why review rejected the project; null otherwise"
      - name: last_update_published_at
        type: datetime
        source: system
        description: "Timestamp of most recent ProgressUpdate; null before any update"

  - name: Reward
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "Owning Project.id"
      - name: tier_label
        type: string
        source: input
        description: "Display label; unique per project"
      - name: pledge_amount_cents
        type: integer
        source: input
        description: "Required pledge amount in cents; > 0"
      - name: reward_type
        type: enum
        source: input
        description: "Whether the reward requires shipping"
        constraints: "values: PHYSICAL, DIGITAL"
      - name: inventory_limit
        type: integer
        source: input
        description: "Max selections; null = unlimited"
      - name: inventory_claimed
        type: integer
        source: computed
        description: "Count of orders that selected this reward in non-terminal/charged state"
        default: 0
      - name: estimated_delivery
        type: datetime
        source: input
        description: "Estimated fulfillment date (PHYSICAL only)"

  - name: AddOnItem
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "Owning Project.id"
      - name: name
        type: string
        source: input
        description: "Add-on display name"
      - name: price_cents
        type: integer
        source: input
        description: "Per-unit price in cents; > 0"
      - name: requires_shipping
        type: boolean
        source: input
        description: "True if this add-on must ship"
        default: false
      - name: inventory_limit
        type: integer
        source: input
        description: "Max units across all orders; null = unlimited"
      - name: inventory_claimed
        type: integer
        source: computed
        description: "Sum of unit counts across non-terminal/charged orders"
        default: 0

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "Backed Project.id"
      - name: backer_id
        type: string
        source: input
        description: "Owning Backer.id"
      - name: reward_id
        type: string
        source: input
        description: "Selected Reward.id (required)"
      - name: add_ons
        type: array
        source: input
        description: "List of {add_on_item_id, quantity}; quantity > 0"
      - name: shipping_address
        type: object
        source: input
        description: "Required when reward.reward_type=PHYSICAL or any add-on has requires_shipping=true"
      - name: payment_method_token
        type: string
        source: input
        description: "Opaque token from payment system; pinned at backing time"
      - name: pledge_amount_cents
        type: integer
        source: computed
        description: "Snapshot of reward.pledge_amount_cents at order creation"
      - name: add_ons_total_cents
        type: integer
        source: computed
        description: "Sum over add_ons of (price_cents * quantity)"
      - name: order_total_cents
        type: integer
        source: computed
        description: "pledge_amount_cents + add_ons_total_cents"
      - name: payment_status
        type: enum
        source: system
        description: "Payment state — independent of fulfillment_status (parallel state dimension)"
        constraints: "values: AUTHORIZED, CHARGE_PENDING, CHARGED, CHARGE_FAILED, REFUND_PENDING, REFUNDED, PARTIALLY_REFUNDED, VOIDED"
        default: AUTHORIZED
      - name: fulfillment_status
        type: enum
        source: system
        description: "Fulfillment state — independent of payment_status (parallel state dimension)"
        constraints: "values: NOT_STARTED, PARTIALLY_SHIPPED, FULLY_SHIPPED, NOT_APPLICABLE"
        default: NOT_STARTED
      - name: charge_attempts
        type: integer
        source: system
        description: "Count of charge attempts so far"
        default: 0
      - name: order_modification_locked_at
        type: datetime
        source: system
        description: "Computed: min(project.deadline, created_at + 72h). After this, no order edits."
      - name: refundable_remainder_cents
        type: integer
        source: computed
        description: "Cents still refundable after partial shipments (recomputed via partial_refund_eligibility)"
        default: 0

  - name: ProgressUpdate
    parent: Project
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: "Owning Project.id"
      - name: title
        type: string
        source: input
        description: "Update headline"
      - name: body_md
        type: string
        source: input
        description: "Update body Markdown"
      - name: visibility
        type: enum
        source: input
        description: "Audience scope"
        constraints: "values: PUBLIC, BACKERS_ONLY"
      - name: milestone_label
        type: string
        source: input
        description: "Optional milestone tag (e.g., 'Prototype Done')"
      - name: is_delay_notice
        type: boolean
        source: input
        description: "True if this update announces a fulfillment delay"
        default: false

  - name: RefundRequest
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "Owning Order.id"
      - name: reason
        type: enum
        source: input
        description: "Refund category"
        constraints: "values: PROJECT_FAILED, PROJECT_CANCELLED, DISPUTE, PLATFORM_MANDATORY"
      - name: requested_amount_cents
        type: integer
        source: input
        description: "Cents requested; bounded by Order.refundable_remainder_cents"
      - name: status
        type: enum
        source: system
        description: "Refund workflow state"
        constraints: "values: PENDING_REVIEW, APPROVED, REJECTED, EXECUTED, FAILED"
        default: PENDING_REVIEW
      - name: approved_amount_cents
        type: integer
        source: system
        description: "Final approved amount; null until APPROVED"
      - name: rejection_reason
        type: string
        source: system
        description: "Why refund was rejected; null otherwise"
      - name: triggered_by
        type: enum
        source: system
        description: "Origin of the request"
        constraints: "values: BACKER, INITIATOR, PLATFORM_AUTO"

  - name: SettlementBatch
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "Owning Project.id"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive period start"
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive period end"
      - name: gross_charged_cents
        type: integer
        source: computed
        description: "Sum of order_total_cents for orders CHARGED in [period_start, period_end)"
      - name: commission_cents
        type: integer
        source: computed
        description: "Tiered commission (commission_calculation)"
      - name: channel_fee_cents
        type: integer
        source: computed
        description: "Payment-channel fee total"
      - name: refund_reversal_cents
        type: integer
        source: computed
        description: "Commission reversed for refunds executed in period (refund_commission_reversal)"
      - name: tax_withheld_cents
        type: integer
        source: computed
        description: "Tax withheld (tax_withholding)"
      - name: net_payout_cents
        type: integer
        source: computed
        description: "Net amount paid to initiator"
      - name: status
        type: enum
        source: system
        description: "Batch lifecycle"
        constraints: "values: DRAFT, FINALIZED, PAID, FAILED"
        default: DRAFT

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - name: subject_type
        type: enum
        source: system
        description: "Subject entity type"
        constraints: "values: PROJECT, ORDER, REFUND_REQUEST, SETTLEMENT_BATCH, ESCROW_LEDGER"
      - name: subject_id
        type: string
        source: system
        description: "Subject entity id"
      - name: event_type
        type: enum
        source: system
        description: "Event"
        constraints: "values: STATUS_CHANGE, FUND_FLOW, REFUND_EXECUTED, SETTLEMENT_PAID, REVIEW_DECISION, EXTERNAL_EVENT_RECEIVED"
      - name: payload
        type: object
        source: system
        description: "Event-specific payload (from/to states, amounts, external system reference)"
      - name: actor_role
        type: string
        source: system
        description: "Role that triggered the event; SYSTEM for automatic"
      - name: actor_id
        type: string
        source: system
        description: "Actor id (entity id or opaque op id); SYSTEM for automatic"

  - name: EscrowLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: system
        description: "Project the entry belongs to"
      - name: order_id
        type: string
        source: system
        description: "Order the entry belongs to (null for settlement entries)"
      - name: entry_type
        type: enum
        source: system
        description: "Ledger movement type"
        constraints: "values: AUTH_HOLD, CHARGE_CAPTURE, CHARGE_VOID, REFUND_OUT, COMMISSION_HOLD, COMMISSION_REVERSAL, CHANNEL_FEE, SETTLEMENT_PAYOUT"
      - name: amount_cents
        type: integer
        source: system
        description: "Signed integer cents (positive = into escrow, negative = out)"
      - name: external_ref
        type: string
        source: system
        description: "Reference id at upstream payment/banking system"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: [REJECTED, SUCCEEDED, FAILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONTENT_REVIEW
        trigger: "POST /projects/{id}/submit"
        actor: Initiator
        preconditions:
          - "Initiator.kyc_status == VERIFIED"
          - "title, description_md, risk_disclosure all present and non-empty"
          - "len(media_uris) >= 1"
          - "funding_target_cents > 0 and deadline > now() + 24h"
          - "Project has at least one Reward"
        side_effects:
          - "AuditLogEntry inserted (event_type=STATUS_CHANGE)"

      - from: CONTENT_REVIEW
        to: LEGAL_REVIEW
        trigger: "POST /projects/{id}/review-content {decision: APPROVE}"
        actor: ContentReviewer
        preconditions:
          - "Project.status == CONTENT_REVIEW"
        side_effects:
          - "AuditLogEntry inserted (event_type=REVIEW_DECISION)"

      - from: LEGAL_REVIEW
        to: FINANCIAL_REVIEW
        trigger: "POST /projects/{id}/review-legal {decision: APPROVE}"
        actor: LegalReviewer
        preconditions:
          - "Project.status == LEGAL_REVIEW"
          - "Different X-User-ID from the ContentReviewer who approved this project (segregation_of_duties)"
        side_effects:
          - "AuditLogEntry inserted"

      - from: FINANCIAL_REVIEW
        to: LIVE
        trigger: "POST /projects/{id}/review-financial {decision: APPROVE}"
        actor: FinancialReviewer
        preconditions:
          - "Project.status == FINANCIAL_REVIEW"
          - "Different X-User-ID from both the ContentReviewer and LegalReviewer who approved this project (segregation_of_duties)"
        side_effects:
          - "AuditLogEntry inserted (event_type=REVIEW_DECISION)"

      - from: CONTENT_REVIEW
        to: DRAFT
        trigger: "POST /projects/{id}/review-content {decision: REQUEST_CHANGES}"
        actor: ContentReviewer
        preconditions:
          - "Project.status == CONTENT_REVIEW"
        side_effects:
          - "Project.rejection_reason set to provided message"
          - "AuditLogEntry inserted"
        note: "Revision loop — back to DRAFT, initiator can resubmit. Implements branching with revert."

      - from: LEGAL_REVIEW
        to: DRAFT
        trigger: "POST /projects/{id}/review-legal {decision: REQUEST_CHANGES}"
        actor: LegalReviewer
        preconditions:
          - "Project.status == LEGAL_REVIEW"
        side_effects:
          - "Project.rejection_reason set"
          - "AuditLogEntry inserted"

      - from: FINANCIAL_REVIEW
        to: DRAFT
        trigger: "POST /projects/{id}/review-financial {decision: REQUEST_CHANGES}"
        actor: FinancialReviewer
        preconditions:
          - "Project.status == FINANCIAL_REVIEW"
        side_effects:
          - "Project.rejection_reason set"
          - "AuditLogEntry inserted"

      - from: CONTENT_REVIEW
        to: REJECTED
        trigger: "POST /projects/{id}/review-content {decision: REJECT}"
        actor: ContentReviewer
        preconditions: ["Project.status == CONTENT_REVIEW"]
        side_effects:
          - "Project.rejection_reason set; terminal"

      - from: LEGAL_REVIEW
        to: REJECTED
        trigger: "POST /projects/{id}/review-legal {decision: REJECT}"
        actor: LegalReviewer
        preconditions: ["Project.status == LEGAL_REVIEW"]
        side_effects:
          - "Project.rejection_reason set; terminal"

      - from: FINANCIAL_REVIEW
        to: REJECTED
        trigger: "POST /projects/{id}/review-financial {decision: REJECT}"
        actor: FinancialReviewer
        preconditions: ["Project.status == FINANCIAL_REVIEW"]
        side_effects:
          - "Project.rejection_reason set; terminal"

      - from: LIVE
        to: SUCCEEDED
        trigger: "POST /_clock/advance pushes now() past Project.deadline AND (provisional_raised_cents >= funding_target_cents OR funding_model == KEEP_IT_ALL)"
        actor: system
        preconditions:
          - "now() >= Project.deadline"
          - "(funding_model == ALL_OR_NOTHING AND provisional_raised_cents >= funding_target_cents) OR funding_model == KEEP_IT_ALL"
        side_effects:
          - "CASCADE: For every Order with payment_status==AUTHORIZED on this project: enqueue charge → set Order.payment_status to CHARGE_PENDING (depth-2 cascade hop 1 of charge_on_success_cascade)"
          - "Project.final_raised_cents recomputed via funding_progress_final after charge wave completes"
          - "AuditLogEntry inserted"

      - from: LIVE
        to: FAILED
        trigger: "POST /_clock/advance pushes now() past Project.deadline AND funding_model == ALL_OR_NOTHING AND provisional_raised_cents < funding_target_cents"
        actor: system
        preconditions:
          - "now() >= Project.deadline"
          - "funding_model == ALL_OR_NOTHING"
          - "provisional_raised_cents < funding_target_cents"
        side_effects:
          - "CASCADE: For every Order with payment_status==AUTHORIZED on this project: VOID the auth → Order.payment_status set to VOIDED (depth-2 cascade hop 1 of project_failed_cascade)"
          - "CASCADE: For every voided Order, auto-create RefundRequest(reason=PROJECT_FAILED, triggered_by=PLATFORM_AUTO, status=APPROVED, approved_amount_cents=0) — voids do not transfer money, but a RefundRequest in EXECUTED state is recorded for audit (depth-2 cascade hop 2)"
          - "AuditLogEntry inserted"

      - from: LIVE
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: Initiator
        preconditions:
          - "Project.status == LIVE"
          - "now() < Project.deadline"
        side_effects:
          - "CASCADE: All AUTHORIZED orders → VOIDED (project_cancelled_cascade hop 1)"
          - "CASCADE: For every CHARGED order, auto-create RefundRequest(reason=PROJECT_CANCELLED, triggered_by=PLATFORM_AUTO, status=APPROVED, approved_amount_cents=order.refundable_remainder_cents); on EXECUTE this triggers refund_commission_reversal calc on the SettlementBatch (cascade hop 2)"

  - entity: Order
    initial_state: AUTHORIZED
    terminal_states: [REFUNDED, VOIDED]
    transitions:
      - from: AUTHORIZED
        to: AUTHORIZED
        trigger: "PATCH /orders/{id}"
        actor: Backer
        preconditions:
          - "now() < Order.order_modification_locked_at"
          - "Project.status == LIVE"
          - "If reward_id changes and new reward.inventory_limit is not null, new reward.inventory_claimed < new reward.inventory_limit"
        side_effects:
          - "Old Reward.inventory_claimed -= 1, new Reward.inventory_claimed += 1 (if reward changed)"
          - "AddOnItem.inventory_claimed deltas applied"
          - "Order.pledge_amount_cents / add_ons_total_cents / order_total_cents recomputed"
          - "Project.provisional_raised_cents recomputed via funding_progress_provisional"
          - "Order.version increments"

      - from: AUTHORIZED
        to: CHARGE_PENDING
        trigger: "system event from project SUCCEEDED transition"
        actor: system
        preconditions:
          - "Project.status == SUCCEEDED"
        side_effects:
          - "EscrowLedgerEntry CHARGE_CAPTURE pending; Order.charge_attempts += 1"

      - from: CHARGE_PENDING
        to: CHARGED
        trigger: "POST /_events/payment {order_id, result: SUCCESS}"
        actor: system
        preconditions:
          - "Order.payment_status == CHARGE_PENDING"
        side_effects:
          - "EscrowLedgerEntry CHARGE_CAPTURE finalized + COMMISSION_HOLD + CHANNEL_FEE entries inserted (commission_calculation runs)"
          - "Project.final_raised_cents incremented"
          - "Order.refundable_remainder_cents = order_total_cents (entire order refundable until any shipment)"
          - "AuditLogEntry FUND_FLOW inserted"

      - from: CHARGE_PENDING
        to: CHARGE_FAILED
        trigger: "POST /_events/payment {order_id, result: FAILURE}"
        actor: system
        preconditions:
          - "Order.payment_status == CHARGE_PENDING"
          - "Order.charge_attempts >= 3"
        side_effects:
          - "Auto-create RefundRequest(reason=PROJECT_FAILED is wrong; reason=PLATFORM_MANDATORY, triggered_by=PLATFORM_AUTO, status=APPROVED, approved_amount_cents=0) — auth implicitly released by issuer after 7d, no actual refund flow needed; RefundRequest is for audit and IM notification"
          - "AuditLogEntry inserted"

      - from: CHARGE_PENDING
        to: AUTHORIZED
        trigger: "POST /_events/payment {order_id, result: FAILURE}"
        actor: system
        preconditions:
          - "Order.payment_status == CHARGE_PENDING"
          - "Order.charge_attempts < 3"
        side_effects:
          - "Order.payment_status reverts to AUTHORIZED, ready for retry. Cycle: AUTHORIZED → CHARGE_PENDING → AUTHORIZED, until charge_attempts >= 3."

      - from: CHARGED
        to: PARTIALLY_REFUNDED
        trigger: "POST /refund-requests/{id}/execute (after APPROVED), partial amount"
        actor: system
        preconditions:
          - "RefundRequest.status == APPROVED"
          - "RefundRequest.approved_amount_cents < Order.order_total_cents"
        side_effects:
          - "EscrowLedgerEntry REFUND_OUT inserted"
          - "EscrowLedgerEntry COMMISSION_REVERSAL inserted (refund_commission_reversal calc)"
          - "Order.refundable_remainder_cents -= approved_amount_cents"
          - "If order has unfulfilled items, fulfillment_status may shift via fulfillment events"

      - from: CHARGED
        to: REFUNDED
        trigger: "POST /refund-requests/{id}/execute (after APPROVED), full amount"
        actor: system
        preconditions:
          - "RefundRequest.status == APPROVED"
          - "RefundRequest.approved_amount_cents == Order.refundable_remainder_cents"
          - "Order.refundable_remainder_cents == Order.order_total_cents (no shipments yet)"
        side_effects:
          - "EscrowLedgerEntry REFUND_OUT, COMMISSION_REVERSAL"
          - "Order.refundable_remainder_cents = 0"

      - from: AUTHORIZED
        to: VOIDED
        trigger: "system event from project FAILED or CANCELLED transition; OR POST /orders/{id}/cancel by backer"
        actor: system | Backer
        preconditions:
          - "Project.status IN {FAILED, CANCELLED} OR (actor==Backer AND now() < Order.order_modification_locked_at AND Project.status == LIVE)"
        side_effects:
          - "EscrowLedgerEntry CHARGE_VOID inserted (no cash movement)"
          - "Reward.inventory_claimed -= 1; AddOnItem.inventory_claimed deltas reversed"
          - "Project.provisional_raised_cents recomputed"

  - entity: RefundRequest
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, EXECUTED, FAILED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /refund-requests/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "RefundRequest.status == PENDING_REVIEW"
          - "RefundRequest.requested_amount_cents <= linked Order.refundable_remainder_cents (Order found via RefundRequest.order_id)"
          - "linked Order.payment_status IN {CHARGED, PARTIALLY_REFUNDED}"
        side_effects:
          - "approved_amount_cents := requested_amount_cents"
          - "AuditLogEntry inserted"

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /refund-requests/{id}/reject"
        actor: PlatformAdmin
        preconditions:
          - "RefundRequest.status == PENDING_REVIEW"
          - "rejection_reason provided"
        side_effects:
          - "AuditLogEntry inserted"

      - from: APPROVED
        to: EXECUTED
        trigger: "POST /refund-requests/{id}/execute"
        actor: PlatformAdmin | system
        preconditions:
          - "RefundRequest.status == APPROVED"
        side_effects:
          - "Linked Order via RefundRequest.order_id transitions per Order state machine (CHARGED → PARTIALLY_REFUNDED or REFUNDED) — DEPTH-3 CASCADE: refund execute → Order state change → SettlementBatch.refund_reversal_cents recomputed for the open batch covering this period"
          - "EscrowLedgerEntry REFUND_OUT + COMMISSION_REVERSAL"
          - "AuditLogEntry FUND_FLOW + REFUND_EXECUTED"

      - from: APPROVED
        to: FAILED
        trigger: "POST /_events/banking {refund_request_id, result: FAILURE}"
        actor: system
        preconditions: ["RefundRequest.status == APPROVED"]
        side_effects:
          - "AuditLogEntry inserted; manual intervention required"

  - entity: SettlementBatch
    initial_state: DRAFT
    terminal_states: [PAID, FAILED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /projects/{id}/settlement-batches/{batch_id}/finalize"
        actor: PlatformAdmin
        preconditions:
          - "Project.status == SUCCEEDED"
          - "No RefundRequest in {PENDING_REVIEW, APPROVED} for orders within [period_start, period_end)"
        side_effects:
          - "All amount fields recomputed deterministically (commission_calculation, refund_commission_reversal, tax_withholding, settlement_net)"

      - from: FINALIZED
        to: PAID
        trigger: "POST /_events/banking {batch_id, result: SUCCESS}"
        actor: system
        preconditions: ["Status == FINALIZED"]
        side_effects:
          - "EscrowLedgerEntry SETTLEMENT_PAYOUT inserted"
          - "AuditLogEntry SETTLEMENT_PAID"

      - from: FINALIZED
        to: FAILED
        trigger: "POST /_events/banking {batch_id, result: FAILURE}"
        actor: system
        preconditions: ["Status == FINALIZED"]
        side_effects: ["AuditLogEntry inserted; manual retry required"]

# §1.2.1 Concurrency Rules
concurrency_rules:
  - scenario: "Two backers simultaneously place orders selecting the last unit of a limited-inventory Reward"
    guarantee: "At most Reward.inventory_limit orders succeed; second backer rejected"
    error_id: ERR_REWARD_INVENTORY_EXHAUSTED
    http_status: 409
    serialization: "First-writer-wins on Reward.inventory_claimed increment under row lock"

  - scenario: "Two backers simultaneously add the same AddOnItem when only one unit remains"
    guarantee: "Aggregate AddOnItem.inventory_claimed must never exceed inventory_limit"
    error_id: ERR_ADDON_INVENTORY_EXHAUSTED
    http_status: 409
    serialization: "First-writer-wins on AddOnItem.inventory_claimed increment under row lock"

  - scenario: "Initiator cancels project while system is auto-transitioning to SUCCEEDED via clock advance"
    guarantee: "Exactly one transition wins; CANCELLED takes precedence only if still in LIVE; otherwise loser receives invalid-state error"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Project.status + version OCC"

  - scenario: "Initiator submits same DRAFT for review twice in rapid succession (double-click)"
    guarantee: "At most one CONTENT_REVIEW transition; second request rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Project.status"

  - scenario: "Two PlatformAdmin actors approve and reject the same RefundRequest simultaneously"
    guarantee: "Exactly one decision wins; loser receives invalid-state error"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on RefundRequest.status + version OCC"

  - scenario: "Backer modifies order while platform auto-cancellation cascade voids it"
    guarantee: "Modification loses if Order moved to VOIDED; backer receives invalid-state error"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Order.payment_status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: funding_progress_provisional
    trigger: "Order create / modify / void during Project.status == LIVE"
    algorithm: aggregation
    formula: |
      Project.provisional_raised_cents =
        sum(Order.order_total_cents
            for Order o in Orders where o.project_id = Project.id
            and o.payment_status == 'AUTHORIZED')
    input_set: "All Orders for this Project with payment_status == AUTHORIZED. Excludes VOIDED, CHARGED, REFUNDED, PARTIALLY_REFUNDED, CHARGE_PENDING, CHARGE_FAILED, REFUND_PENDING."
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional
        when: "Project.status == LIVE — used to drive funding-target check at deadline"
        difference: "Counts AUTHORIZED only; charge has not yet been attempted"

  - name: funding_progress_final
    trigger: "After Project transitions to SUCCEEDED and all charge events resolved"
    algorithm: aggregation
    formula: |
      Project.final_raised_cents =
        sum(Order.order_total_cents
            for Order o in Orders where o.project_id = Project.id
            and o.payment_status IN {'CHARGED', 'PARTIALLY_REFUNDED'})
    input_set: "Orders whose CHARGE actually succeeded. Includes PARTIALLY_REFUNDED (still partly captured); excludes REFUNDED (fully reversed)."
    constants: {}
    precision: "integer cents"
    variants:
      - name: final
        when: "Project.status == SUCCEEDED, after charge wave"
        difference: |
          Same arithmetic shape as provisional but a fundamentally different input set
          (CHARGED vs AUTHORIZED). Same project may have provisional_raised_cents = 50,000
          and final_raised_cents = 47,500 because two backers' cards declined three times.

  - name: commission_calculation
    trigger: "Order transitions to CHARGED; SettlementBatch finalize"
    algorithm: tiered_pricing
    formula: |
      # Per-order commission, computed at CHARGE time
      rate = COMMISSION_RATE_BPS[Project.category]   # basis points
      raw_commission_cents = order_total_cents * rate / 10000
      commission_cents = round_half_up(raw_commission_cents)   # rounded per-order

      # Channel fee (separate dimension)
      raw_channel = max(CHANNEL_FEE_FLOOR_CENTS,
                        floor(order_total_cents * CHANNEL_FEE_BPS / 10000))
      channel_fee_cents = round_half_up(raw_channel)

      # SettlementBatch totals (per-order rounding then sum — pinned order)
      batch.commission_cents = sum(order.commission_cents for order in batch_orders)
      batch.channel_fee_cents = sum(order.channel_fee_cents for order in batch_orders)
    input_set: "All Orders with payment_status CHARGED whose CHARGE event timestamp falls in [period_start, period_end)."
    constants:
      COMMISSION_RATE_BPS:
        TECH: 500          # 5.00%
        ART: 700           # 7.00%
        COMMUNITY: 300     # 3.00%
      CHANNEL_FEE_BPS: 290 # 2.90%
      CHANNEL_FEE_FLOOR_CENTS: 30
    precision: "integer cents, round_half_up at each per-order step; batch totals are sum of rounded per-order values (per-order rounding then sum)"
    variants:
      - name: per_order_then_sum
        when: "default and only allowed evaluation order"
        difference: |
          Pinned: round commission per order, THEN sum to batch total. The alternative
          'sum gross then round once' produces different cents when many small orders
          accumulate; this scaffold REJECTS that alternative.

  - name: refund_commission_reversal
    trigger: "RefundRequest transitions APPROVED → EXECUTED"
    algorithm: aggregation
    formula: |
      # Find original commission for this order
      original_commission_cents = order.commission_cents   # pinned at CHARGE time

      # Reverse proportional to refund amount
      raw_reversal = original_commission_cents
                     * approved_amount_cents
                     / order.order_total_cents
      reversal_cents = round_half_up(raw_reversal)

      # Channel fee is NEVER reversed (industry-standard non-refundable)
      # Hence settlement adjustment for this refund:
      settlement_adjustment_cents = -(approved_amount_cents - reversal_cents)
    input_set: "Single Order; no aggregation across orders"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: full_refund
        when: "approved_amount_cents == order.order_total_cents"
        difference: "reversal_cents == original_commission_cents (full reversal)"
      - name: partial_refund
        when: "approved_amount_cents < order.order_total_cents (after partial shipments)"
        difference: "reversal_cents proportional; channel_fee NOT reversed → initiator absorbs that fraction"

  - name: partial_refund_eligibility
    trigger: "Refund request approval; ShipmentEvent posted"
    algorithm: aggregation
    formula: |
      shipped_value_cents = sum(line.value_cents
                                for line in shipped_lines(order))
      Order.refundable_remainder_cents =
        max(0, order.order_total_cents - shipped_value_cents)
      max_refundable = Order.refundable_remainder_cents

      # When approving RefundRequest:
      assert RefundRequest.requested_amount_cents <= max_refundable
    input_set: "Per-order. Shipped lines for an Order are determined from shipment events received via POST /_events/logistics."
    constants: {}
    precision: "integer cents"
    variants:
      - name: pre_shipment
        when: "no shipments yet"
        difference: "refundable_remainder_cents == order_total_cents (full refund eligible)"
      - name: post_partial_shipment
        when: "some lines shipped"
        difference: "refundable_remainder_cents == order_total_cents − shipped_value_cents"

  - name: tax_withholding
    trigger: "SettlementBatch finalize"
    algorithm: threshold
    formula: |
      taxable_base_cents = (gross_charged_cents
                            - commission_cents
                            - channel_fee_cents
                            - refund_reversal_cents)
      if Initiator.tax_id is null OR Initiator.tax_id == "":
        tax_withheld_cents = round_half_up(taxable_base_cents * BACKUP_RATE_BPS / 10000)
      elif taxable_base_cents > REPORTING_THRESHOLD_CENTS:
        tax_withheld_cents = round_half_up(taxable_base_cents * STANDARD_RATE_BPS / 10000)
      else:
        tax_withheld_cents = 0
    input_set: "Single SettlementBatch"
    constants:
      BACKUP_RATE_BPS: 2400          # 24% backup withholding when tax_id missing
      STANDARD_RATE_BPS: 1000        # 10% standard
      REPORTING_THRESHOLD_CENTS: 60000  # $600.00 (boundary: > triggers; == does NOT)
    precision: "integer cents, round_half_up"
    variants:
      - name: backup_withholding
        when: "Initiator.tax_id missing"
        difference: "Always 24% regardless of amount"
      - name: standard_above_threshold
        when: "taxable_base_cents > 60000 and tax_id present"
        difference: "10% withholding"
      - name: below_threshold
        when: "taxable_base_cents <= 60000 and tax_id present"
        difference: "Zero withholding"

  - name: settlement_net
    trigger: "SettlementBatch finalize (after commission_calculation, refund_commission_reversal, tax_withholding)"
    algorithm: aggregation
    formula: |
      # PINNED EVALUATION ORDER — circular-looking dependency resolved by this order:
      # 1. commission_cents := commission_calculation(orders in period)
      # 2. channel_fee_cents := channel fees from same orders
      # 3. refund_reversal_cents := refund_commission_reversal aggregated for executed
      #    refunds in period
      # 4. taxable_base = gross - commission - channel_fee - refund_reversal
      # 5. tax_withheld := tax_withholding(taxable_base)  ← depends on #4
      # 6. net_payout = taxable_base - tax_withheld
      # The "circular look": tax depends on net-of-commission, but commission is
      # NOT recomputed from net. Pinned order: commission first, tax last.
      net_payout_cents = (gross_charged_cents
                          - commission_cents
                          - channel_fee_cents
                          - refund_reversal_cents
                          - tax_withheld_cents)
    input_set: "Single SettlementBatch"
    constants: {}
    precision: "integer cents"
    variants:
      - name: standard
        when: "Project.status == SUCCEEDED"
        difference: "Default formula"

  - name: update_frequency_compliance
    trigger: "Computed on demand; checked on POST /projects/{id}/settlement-batches/{batch_id}/finalize"
    algorithm: threshold
    formula: |
      days_since_last_update =
        (now() - Project.last_update_published_at).days
      if days_since_last_update > MAX_SILENCE_DAYS:
        compliance = NON_COMPLIANT     # blocks settlement finalize
      else:
        compliance = COMPLIANT
    input_set: "Single Project, after Project.status == SUCCEEDED"
    constants:
      MAX_SILENCE_DAYS: 30   # boundary: > 30 days = non-compliant; == 30 days OK
    precision: "integer days"
    variants:
      - name: live
        when: "Project.status == LIVE"
        difference: "Warning only, does NOT block"
      - name: post_success
        when: "Project.status == SUCCEEDED, before settlement"
        difference: "Hard block: settlement_batch.finalize fails"

# =============================================================================
# §1.4 Validation Rules Table (Ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all (except GET /healthz)"

  - priority: 2
    category: auth
    check: "Role permitted for endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path params resolve left-to-right (project_id then reward_id then order_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-param endpoints"

  - priority: 4
    category: state
    check: "Project.status matches operation's required state (e.g., DRAFT for submit, LIVE for ordering, SUCCEEDED for settlement)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "Project actions, Order create, Settlement actions"

  - priority: 5
    category: state
    check: "Order.payment_status / fulfillment_status compatible with operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "Order modify/cancel, RefundRequest create"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: same X-User-ID cannot have approved more than one of {content, legal, financial} review on the same Project"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /projects/{id}/review-content, /review-legal, /review-financial"

  - priority: 7
    category: business_safety
    check: "Initiator KYC verified before submit-for-review"
    error_id: ERR_KYC_REQUIRED
    http_status: 422
    applies_to: "POST /projects/{id}/submit"

  - priority: 8
    category: business_temporal
    check: "Order modification window: now() < Order.order_modification_locked_at"
    error_id: ERR_MODIFICATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "PATCH /orders/{id}, POST /orders/{id}/cancel"

  - priority: 9
    category: business_temporal
    check: "Project.deadline must be > now() + 24h on submit"
    error_id: ERR_DEADLINE_TOO_SOON
    http_status: 422
    applies_to: "POST /projects, POST /projects/{id}/submit"

  - priority: 10
    category: business_referential
    check: "Reward.project_id matches the path's project_id; Order.reward_id belongs to Order.project_id; AddOnItem references in order belong to Order.project_id"
    error_id: ERR_CROSS_PROJECT_REFERENCE
    http_status: 422
    applies_to: "Reward CRUD, Order create/modify"

  - priority: 11
    category: business_referential
    check: "Shipping address required when reward.reward_type == PHYSICAL OR any add-on has requires_shipping=true"
    error_id: ERR_SHIPPING_ADDRESS_REQUIRED
    http_status: 422
    applies_to: "POST /orders, PATCH /orders/{id}"

  - priority: 12
    category: business_constraint
    check: "Reward inventory: reward.inventory_claimed + 1 <= reward.inventory_limit (if not null)"
    error_id: ERR_REWARD_INVENTORY_EXHAUSTED
    http_status: 409
    applies_to: "POST /orders, PATCH /orders/{id}"

  - priority: 13
    category: business_constraint
    check: "Add-on inventory: addon.inventory_claimed + requested_qty <= addon.inventory_limit (if not null)"
    error_id: ERR_ADDON_INVENTORY_EXHAUSTED
    http_status: 409
    applies_to: "POST /orders, PATCH /orders/{id}"

  - priority: 14
    category: business_constraint
    check: "Project must have at least one Reward before submit-for-review"
    error_id: ERR_NO_REWARDS_DEFINED
    http_status: 422
    applies_to: "POST /projects/{id}/submit"

  - priority: 15
    category: business_fiscal
    check: "RefundRequest.requested_amount_cents <= Order.refundable_remainder_cents"
    error_id: ERR_REFUND_EXCEEDS_REMAINDER
    http_status: 422
    applies_to: "POST /refund-requests, POST /refund-requests/{id}/approve"

  - priority: 16
    category: business_fiscal
    check: "Settlement finalize requires update_frequency_compliance == COMPLIANT (post_success variant)"
    error_id: ERR_UPDATE_FREQUENCY_BREACH
    http_status: 422
    applies_to: "POST /projects/{id}/settlement-batches/{batch_id}/finalize"

  - priority: 17
    category: business_fiscal
    check: "Settlement finalize requires no PENDING_REVIEW or APPROVED RefundRequest in period"
    error_id: ERR_PENDING_REFUNDS_BLOCK_SETTLEMENT
    http_status: 422
    applies_to: "POST /projects/{id}/settlement-batches/{batch_id}/finalize"

  - priority: 18
    category: business_constraint
    check: "Funding goal: funding_target_cents > 0; Reward.pledge_amount_cents > 0; AddOnItem.price_cents > 0"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "Project, Reward, AddOnItem create"

  - priority: 19
    category: business_constraint
    check: "OCC version match (when If-Match or body.version supplied)"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH and PUT endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Initiator / Backer ---
  - method: POST
    path: "/initiators"
    description: "Register an initiator (KYC pending)"
    roles: [Initiator, PlatformAdmin]
    code: 201
    input: [legal_name, "tax_id?", "bank_account_id?", "qualification_doc_uri?"]
    output: Initiator
    side_effects: ["Initiator created with kyc_status=PENDING"]

  - method: POST
    path: "/initiators/{id}/verify-kyc"
    description: "Mark initiator KYC verified or rejected"
    roles: [PlatformAdmin]
    code: 200
    input: [decision]
    output: Initiator
    side_effects: ["Initiator.kyc_status set to VERIFIED|REJECTED; AuditLogEntry"]

  - method: POST
    path: "/backers"
    description: "Register a backer"
    roles: [Backer, PlatformAdmin]
    code: 201
    input: [display_name, email, "default_shipping_address?"]
    output: Backer
    side_effects: []

  # --- Project ---
  - method: POST
    path: "/projects"
    description: "Create draft project"
    roles: [Initiator]
    code: 201
    input: [title, category, description_md, media_uris, risk_disclosure, funding_model, funding_target_cents, deadline]
    output: Project
    side_effects: ["Project created in DRAFT"]

  - method: GET
    path: "/projects/{id}"
    description: "Read project (with computed counters)"
    roles: [Initiator, Backer, ContentReviewer, LegalReviewer, FinancialReviewer, PlatformAdmin]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/projects"
    description: "List projects (filter by status, category)"
    roles: [Initiator, Backer, ContentReviewer, LegalReviewer, FinancialReviewer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "category?"]
    output: "Project[]"
    side_effects: []

  - method: PATCH
    path: "/projects/{id}"
    description: "Edit project while in DRAFT"
    roles: [Initiator]
    code: 200
    input: ["title?", "description_md?", "media_uris?", "risk_disclosure?", "funding_model?", "funding_target_cents?", "deadline?", version]
    output: Project
    side_effects: ["Project mutated; OCC enforced"]

  - method: POST
    path: "/projects/{id}/submit"
    description: "Submit DRAFT project to CONTENT_REVIEW"
    roles: [Initiator]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status DRAFT→CONTENT_REVIEW; AuditLogEntry"]

  - method: POST
    path: "/projects/{id}/review-content"
    description: "Content reviewer decision"
    roles: [ContentReviewer]
    code: 200
    input: [decision, "message?"]
    output: Project
    side_effects: ["Project.status transitions; AuditLogEntry; segregation_of_duties recorded"]

  - method: POST
    path: "/projects/{id}/review-legal"
    description: "Legal reviewer decision"
    roles: [LegalReviewer]
    code: 200
    input: [decision, "message?"]
    output: Project
    side_effects: ["Project.status transitions; AuditLogEntry"]

  - method: POST
    path: "/projects/{id}/review-financial"
    description: "Financial reviewer decision"
    roles: [FinancialReviewer]
    code: 200
    input: [decision, "message?"]
    output: Project
    side_effects: ["Project.status transitions; AuditLogEntry"]

  - method: POST
    path: "/projects/{id}/cancel"
    description: "Initiator cancels LIVE project before deadline"
    roles: [Initiator]
    code: 200
    input: ["reason?"]
    output: Project
    side_effects: ["Project.status LIVE→CANCELLED; cascade voids/refund-requests for all child orders"]

  # --- Reward / AddOn ---
  - method: POST
    path: "/projects/{project_id}/rewards"
    description: "Create reward tier (DRAFT only)"
    roles: [Initiator]
    code: 201
    input: [tier_label, pledge_amount_cents, reward_type, "inventory_limit?", "estimated_delivery?"]
    output: Reward
    side_effects: []

  - method: GET
    path: "/projects/{project_id}/rewards"
    description: "List rewards for project"
    roles: [Initiator, Backer, ContentReviewer, LegalReviewer, FinancialReviewer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Reward[]"
    side_effects: []

  - method: PATCH
    path: "/projects/{project_id}/rewards/{id}"
    description: "Update reward (DRAFT only)"
    roles: [Initiator]
    code: 200
    input: ["tier_label?", "pledge_amount_cents?", "reward_type?", "inventory_limit?", "estimated_delivery?", version]
    output: Reward
    side_effects: []

  - method: POST
    path: "/projects/{project_id}/add-on-items"
    description: "Create add-on item (DRAFT only)"
    roles: [Initiator]
    code: 201
    input: [name, price_cents, "requires_shipping?", "inventory_limit?"]
    output: AddOnItem
    side_effects: []

  - method: GET
    path: "/projects/{project_id}/add-on-items"
    description: "List add-on items"
    roles: [Initiator, Backer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "AddOnItem[]"
    side_effects: []

  # --- Order ---
  - method: POST
    path: "/orders"
    description: "Place order on a LIVE project"
    roles: [Backer]
    code: 201
    input: [project_id, reward_id, "add_ons?", "shipping_address?", payment_method_token]
    output: Order
    side_effects:
      - "Reward.inventory_claimed += 1"
      - "AddOnItem.inventory_claimed deltas applied"
      - "Order.payment_status = AUTHORIZED (auth-only at backing time)"
      - "EscrowLedgerEntry AUTH_HOLD inserted"
      - "Project.provisional_raised_cents recomputed"

  - method: GET
    path: "/orders/{id}"
    description: "Get an order"
    roles: [Backer, Initiator, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: PATCH
    path: "/orders/{id}"
    description: "Modify order within window"
    roles: [Backer]
    code: 200
    input: ["reward_id?", "add_ons?", "shipping_address?", "payment_method_token?", version]
    output: Order
    side_effects:
      - "Inventory claims rebalanced"
      - "Order amounts recomputed"
      - "Project.provisional_raised_cents recomputed"

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Backer cancels within modification window OR system cascades from project failure"
    roles: [Backer, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["Order.payment_status AUTHORIZED→VOIDED; inventories reverted"]

  # --- Progress Updates ---
  - method: POST
    path: "/projects/{project_id}/progress-updates"
    description: "Publish project progress update (milestone or delay notice)"
    roles: [Initiator]
    code: 201
    input: [title, body_md, visibility, "milestone_label?", "is_delay_notice?"]
    output: ProgressUpdate
    side_effects: ["Project.last_update_published_at = now(); AuditLogEntry"]

  - method: GET
    path: "/projects/{project_id}/progress-updates"
    description: "List progress updates (BACKERS_ONLY filtered if requester not a backer of this project)"
    roles: [Backer, Initiator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProgressUpdate[]"
    side_effects: []

  # --- Refund ---
  - method: POST
    path: "/refund-requests"
    description: "Create a refund request for an order"
    roles: [Backer, PlatformAdmin]
    code: 201
    input: [order_id, reason, requested_amount_cents]
    output: RefundRequest
    side_effects: ["RefundRequest in PENDING_REVIEW"]

  - method: GET
    path: "/refund-requests/{id}"
    description: "Read refund request"
    roles: [Backer, Initiator, PlatformAdmin]
    code: 200
    input: []
    output: RefundRequest
    side_effects: []

  - method: POST
    path: "/refund-requests/{id}/approve"
    description: "Approve a pending refund request"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["RefundRequest PENDING_REVIEW→APPROVED"]

  - method: POST
    path: "/refund-requests/{id}/reject"
    description: "Reject a pending refund request"
    roles: [PlatformAdmin]
    code: 200
    input: [rejection_reason]
    output: RefundRequest
    side_effects: ["RefundRequest PENDING_REVIEW→REJECTED"]

  - method: POST
    path: "/refund-requests/{id}/execute"
    description: "Execute an approved refund (drives Order state + EscrowLedgerEntry + commission reversal cascade)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RefundRequest
    side_effects:
      - "RefundRequest APPROVED→EXECUTED"
      - "Order transitions CHARGED→PARTIALLY_REFUNDED or CHARGED→REFUNDED (depth-3 cascade hop 1)"
      - "EscrowLedgerEntry REFUND_OUT + COMMISSION_REVERSAL inserted (cascade hop 2)"
      - "SettlementBatch.refund_reversal_cents recomputed for open batch (cascade hop 3)"

  # --- Settlement ---
  - method: POST
    path: "/projects/{project_id}/settlement-batches"
    description: "Create a draft settlement batch over a period"
    roles: [PlatformAdmin]
    code: 201
    input: [period_start, period_end]
    output: SettlementBatch
    side_effects: ["SettlementBatch DRAFT; amounts pre-computed"]

  - method: POST
    path: "/projects/{project_id}/settlement-batches/{batch_id}/finalize"
    description: "Finalize a draft settlement batch (locks amounts; readies payout)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SettlementBatch
    side_effects:
      - "SettlementBatch DRAFT→FINALIZED"
      - "All amounts pinned (commission_calculation, refund_commission_reversal, tax_withholding, settlement_net)"

  - method: GET
    path: "/projects/{project_id}/settlement-batches/{batch_id}"
    description: "Read settlement batch"
    roles: [Initiator, PlatformAdmin]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: []

  # --- Audit ---
  - method: GET
    path: "/audit-log"
    description: "Filtered audit log (subject_type/subject_id/event_type)"
    roles: [PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "subject_type?", "subject_id?", "event_type?"]
    output: "AuditLogEntry[]"
    side_effects: []

  - method: GET
    path: "/projects/{project_id}/escrow-ledger"
    description: "Read escrow ledger entries for a project"
    roles: [Initiator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "EscrowLedgerEntry[]"
    side_effects: []

  # --- Test-driving endpoints (REQUIRED for testability-completeness) ---
  - method: POST
    path: "/_clock/advance"
    description: "Test-driver: advance virtual clock to a specified ISO8601 timestamp; triggers any time-gated transitions (project deadline → SUCCEEDED/FAILED)"
    roles: [PlatformAdmin]
    code: 200
    input: [to]
    output: "{ now: ISO8601 }"
    side_effects:
      - "Triggers Project deadline transitions (LIVE→SUCCEEDED|FAILED)"
      - "Triggers cascade waves (charge or void) on affected Orders"
      - "Closes order modification windows where now() >= Order.order_modification_locked_at"

  - method: POST
    path: "/_events/payment"
    description: "Test-driver: simulate payment system event (charge success/failure)"
    roles: [PlatformAdmin]
    code: 200
    input: [order_id, result, "external_ref?"]
    output: Order
    side_effects: ["Order.payment_status transitions per machine; charge_attempts handling"]

  - method: POST
    path: "/_events/banking"
    description: "Test-driver: simulate banking event for refund or settlement"
    roles: [PlatformAdmin]
    code: 200
    input: [subject_type, subject_id, result, "external_ref?"]
    output: "{ subject_type, subject_id, status }"
    side_effects: ["Drives RefundRequest APPROVED→FAILED or SettlementBatch FINALIZED→PAID|FAILED"]

  - method: POST
    path: "/_events/logistics"
    description: "Test-driver: register a shipment event (full or partial) for an Order"
    roles: [PlatformAdmin]
    code: 200
    input: [order_id, lines]
    output: Order
    side_effects: ["Order.fulfillment_status transitions; Order.refundable_remainder_cents recomputed via partial_refund_eligibility"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-Role or X-User-ID missing"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Operation not legal in current state of subject entity"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch on PATCH/PUT"

  - id: ERR_KYC_REQUIRED
    http: 422
    condition: "Initiator.kyc_status != VERIFIED at submit"

  - id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http: 403
    condition: "Same X-User-ID has approved another review stage on this project"

  - id: ERR_DEADLINE_TOO_SOON
    http: 422
    condition: "Project.deadline <= now() + 24h on submit"

  - id: ERR_NO_REWARDS_DEFINED
    http: 422
    condition: "Submit attempted with zero rewards defined"

  - id: ERR_MODIFICATION_WINDOW_CLOSED
    http: 422
    condition: "now() >= Order.order_modification_locked_at"

  - id: ERR_REWARD_INVENTORY_EXHAUSTED
    http: 409
    condition: "reward.inventory_claimed >= inventory_limit"

  - id: ERR_ADDON_INVENTORY_EXHAUSTED
    http: 409
    condition: "addon.inventory_claimed + qty > inventory_limit"

  - id: ERR_SHIPPING_ADDRESS_REQUIRED
    http: 422
    condition: "Reward.reward_type==PHYSICAL or any add-on requires shipping but address missing"

  - id: ERR_CROSS_PROJECT_REFERENCE
    http: 422
    condition: "Reward or AddOnItem referenced does not belong to the order's project"

  - id: ERR_REFUND_EXCEEDS_REMAINDER
    http: 422
    condition: "Refund amount > Order.refundable_remainder_cents"

  - id: ERR_UPDATE_FREQUENCY_BREACH
    http: 422
    condition: "Project went silent > 30 days at settlement finalize"

  - id: ERR_PENDING_REFUNDS_BLOCK_SETTLEMENT
    http: 422
    condition: "Open RefundRequest in PENDING_REVIEW or APPROVED for orders within batch period"

  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "Monetary field <= 0 where positive required"

  - id: ERR_DUPLICATE_TIER_LABEL
    http: 422
    condition: "Reward.tier_label not unique per project"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Initiator
    description: "Creates and runs projects; receives settlement payouts"
    identity: "entity_backed:Initiator"
    exclusive_operations:
      - "POST /projects (create draft)"
      - "PATCH /projects/{id} (DRAFT only)"
      - "POST /projects/{id}/submit"
      - "POST /projects/{id}/cancel"
      - "POST /projects/{project_id}/rewards"
      - "PATCH /projects/{project_id}/rewards/{id}"
      - "POST /projects/{project_id}/add-on-items"
      - "POST /projects/{project_id}/progress-updates"
    shared_operations:
      - "GET /projects, /projects/{id}"
      - "GET /projects/{project_id}/rewards"
      - "GET /projects/{project_id}/add-on-items"
      - "GET /projects/{project_id}/progress-updates"
      - "GET /projects/{project_id}/escrow-ledger"
      - "GET /projects/{project_id}/settlement-batches/{batch_id}"
      - "GET /orders/{id}"
      - "GET /refund-requests/{id}"

  - name: Backer
    description: "Places orders, receives rewards/refunds"
    identity: "entity_backed:Backer"
    exclusive_operations:
      - "POST /orders (own backer_id only)"
      - "PATCH /orders/{id} (own only, within window)"
      - "POST /orders/{id}/cancel (own only, within window)"
    shared_operations:
      - "GET /projects, /projects/{id}"
      - "GET /projects/{project_id}/rewards, add-on-items"
      - "GET /projects/{project_id}/progress-updates (BACKERS_ONLY filtered)"
      - "POST /refund-requests (own order only)"
      - "GET /refund-requests/{id} (own only)"
      - "GET /orders/{id} (own only)"

  - name: ContentReviewer
    description: "Decides on content of submitted projects"
    identity: "opaque"
    exclusive_operations:
      - "POST /projects/{id}/review-content"
    shared_operations:
      - "GET /projects, /projects/{id}"
      - "GET /projects/{project_id}/rewards"

  - name: LegalReviewer
    description: "Decides on legal review (post content approval)"
    identity: "opaque"
    exclusive_operations:
      - "POST /projects/{id}/review-legal"
    shared_operations:
      - "GET /projects, /projects/{id}"

  - name: FinancialReviewer
    description: "Decides on financial review (post legal approval)"
    identity: "opaque"
    exclusive_operations:
      - "POST /projects/{id}/review-financial"
    shared_operations:
      - "GET /projects, /projects/{id}"

  - name: PlatformAdmin
    description: "Operates the platform; KYC, refunds, settlement, test drivers, audit"
    identity: "opaque"
    exclusive_operations:
      - "POST /initiators/{id}/verify-kyc"
      - "POST /refund-requests/{id}/approve"
      - "POST /refund-requests/{id}/reject"
      - "POST /refund-requests/{id}/execute"
      - "POST /projects/{project_id}/settlement-batches"
      - "POST /projects/{project_id}/settlement-batches/{batch_id}/finalize"
      - "GET /audit-log"
      - "POST /_clock/advance"
      - "POST /_events/payment"
      - "POST /_events/banking"
      - "POST /_events/logistics"
    shared_operations:
      - "GET /projects, /projects/{id}, /orders/{id}, /refund-requests/{id}"
      - "POST /orders/{id}/cancel (admin override)"
      - "POST /refund-requests (admin-initiated PLATFORM_AUTO)"
      - "POST /initiators, /backers (admin-onboarded)"
