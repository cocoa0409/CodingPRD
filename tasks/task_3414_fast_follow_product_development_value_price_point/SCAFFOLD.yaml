# =============================================================================
# SCAFFOLD.yaml — task_3414_fast_follow_product_development_value_price_point
# Fast-Follow Product Development & Value Price Point Sourcing (e.l.f. Beauty)
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in their
# own sibling files.
# =============================================================================

scenario: |
  Fast-Follow Product Development & Value Price Point Sourcing (e.l.f. Beauty): trend identification from social platforms and prestige launches with rapid concept selection, contract manufacturer sourcing with formula development timelines compressed to weeks and cost targets set by a fixed retail price, ingredient and claim compliance including cruelty-free certification and regulatory registration, packaging component sourcing with tooling reuse to shorten lead times, retail partner line reviews and shelf space allocation with planogram commitments, launch quantity decisions balancing stockout risk against markdown exposure on trend items, community and creator marketing with sampling programs, product discontinuation and refresh cadence within a limited shelf footprint

domain_name: fast-follow-beauty
api_prefix: ""

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # shelf facings, CM quarterly slots, launch-inventory buckets are finite pools competed for, reserved, committed, released
  secondary_archetype: temporal_windowing    # line-review submission windows + planogram occupancy intervals with two different interval semantics
  complexity_layers:
    - optimistic_concurrency                 # OCC on Product.version (cost-quote create) and LineReview.version (planogram-slot create)
    - cascading_side_effects                 # discontinuation cascade (4 entities deep); cert-denial cascade; capacity-eviction cascade
    - dual_variant_calculation               # landed cost provisional-vs-settled; launch qty demand-vs-risk-adjusted
    - selector_policy                        # capacity-eviction picks slots by committed_at DESC; trend selection threshold gate
  entity_topology: flat                      # peer entities joined by FK references in request bodies; no nested URL paths
  state_machine_shape: cyclic                # Product reformulation loop; FormulaProject sample-reject loop; plus parallel dimensions on ComplianceDossier and LaunchPlan
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential                       # Product.successor_product_id / DiscontinuationReview.successor_product_id -> Product.id
  role_model: peer_roles                     # each internal role owns different resource types; one entity-backed external role (ManufacturerRep); discontinuation is proposed and approved by different roles (segregation of duties)
  consistency_model: immediate               # every mutation + cascade is atomic in-request
  entity_count: 12
  endpoint_count: 47
  error_code_count: 44
  calculation_count: 9

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TrendSignal
    parent: null
    common_fields: true
    fields:
      - { name: source, type: enum, source: input, description: "SOCIAL_PLATFORM | PRESTIGE_LAUNCH — where the trend was identified" }
      - { name: platform, type: string, source: input, description: "Originating platform or channel label (e.g. tiktok, instagram, runway)" }
      - { name: category, type: string, source: input, description: "Category code the trend belongs to (e.g. EYES, LIPS, FACE, SKIN)" }
      - { name: mention_velocity_7d, type: integer, source: input, description: "Average mentions per day over the trailing 7 days", constraints: ">= 0" }
      - { name: engagement_growth_pct, type: number, source: input, description: "Week-over-week engagement growth as a ratio (1.5 == +150%)", constraints: ">= 0" }
      - { name: prestige_similarity, type: number, source: input, description: "Similarity to the prestige reference product, 0..1. REQUIRED iff source == PRESTIGE_LAUNCH; ignored otherwise.", constraints: "0..1" , default: null }
      - { name: cross_platform_spread, type: number, source: input, description: "Cross-platform spread score, 0..1. REQUIRED iff source == SOCIAL_PLATFORM; ignored otherwise.", constraints: "0..1", default: null }
      - { name: status, type: enum, source: system, description: "DISCOVERED | EVALUATING | PARKED | SELECTED | ARCHIVED", default: DISCOVERED }
      - { name: momentum_score, type: number, source: computed, description: "Weighted momentum score (see calculations.trend_momentum_score); null until first transition to EVALUATING; recomputed on every entry into EVALUATING", default: null }
      - { name: evaluated_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent entry into EVALUATING", default: null }

  - name: Concept
    parent: null
    common_fields: true
    fields:
      - { name: trend_signal_id, type: string, source: input, description: "FK -> TrendSignal.id; the trend this concept fast-follows" }
      - { name: name, type: string, source: input, description: "Concept name; unique across all non-KILLED concepts" }
      - { name: category, type: string, source: input, description: "Category code; MUST equal the parent trend's category" }
      - { name: target_price_point_cents, type: integer, source: input, description: "Fixed retail price point. MUST be a member of {300, 600, 1000, 1500, 2000}." }
      - { name: status, type: enum, source: system, description: "PITCHED | SELECTED | IN_DEVELOPMENT | COMMERCIALIZED | KILLED", default: PITCHED }
      - { name: target_unit_cost_cents, type: integer, source: computed, description: "Cost target derived from the fixed price point (see calculations.target_unit_cost); null until SELECTED", default: null }
      - { name: selected_at, type: datetime, source: system, description: "Logical-clock timestamp of PITCHED -> SELECTED", default: null }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: concept_id, type: string, source: input, description: "FK -> Concept.id; concept being commercialized" }
      - { name: sku_name, type: string, source: input, description: "SKU label" }
      - { name: tooling_code, type: string, source: input, description: "Packaging tooling code; reuse detection key (see tooling_reuse)", default: null }
      - { name: status, type: enum, source: system, description: "FORMULATION | SOURCING | COMPLIANCE_GATE | LAUNCH_READY | LAUNCHED | DISCONTINUED | KILLED", default: FORMULATION }
      - { name: packaging_status, type: enum, source: system, description: "PARALLEL dimension: PACK_SOURCING | PACK_READY", default: PACK_SOURCING }
      - { name: tooling_reuse, type: boolean, source: computed, description: "true iff tooling_code is non-null AND another Product with the same tooling_code and created_at strictly earlier exists with status != KILLED" }
      - { name: packaging_lead_weeks, type: integer, source: computed, description: "TOOLING_REUSE_WEEKS (5) when tooling_reuse else TOOLING_NEW_WEEKS (14); see calculations.packaging_lead_time" }
      - { name: successor_product_id, type: string, source: system, description: "FK -> Product.id; self-referential refresh successor, set by the discontinuation cascade; null until then", default: null }
      - { name: launched_at, type: datetime, source: system, description: "Logical-clock timestamp of LAUNCH_READY -> LAUNCHED", default: null }

  - name: ContractManufacturer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Manufacturer name" }
      - { name: capabilities, type: array, source: input, description: "Array of category codes the CM can produce (e.g. [EYES, LIPS])" }
      - { name: base_lead_time_weeks, type: integer, source: input, description: "Base production lead time in weeks", constraints: ">= 1" }
      - { name: moq_units, type: integer, source: input, description: "Minimum order quantity per accepted quote", constraints: ">= 1" }
      - { name: quality_tier, type: enum, source: input, description: "STANDARD | PREMIUM" }
      - { name: capacity_slots_per_quarter, type: integer, source: input, description: "Number of production slots the CM offers per calendar quarter", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: FormulaProject
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: contract_manufacturer_id, type: string, source: input, description: "FK -> ContractManufacturer.id" }
      - { name: brief, type: string, source: input, description: "Formula brief text" }
      - { name: status, type: enum, source: system, description: "IN_DEVELOPMENT | SAMPLE_REVIEW | APPROVED | ABANDONED", default: IN_DEVELOPMENT }
      - { name: round_count, type: integer, source: system, description: "Current development round; starts at 1; increments on every SAMPLE_REVIEW -> IN_DEVELOPMENT rejection and on reformulation reopen", default: 1 }
      - { name: due_at, type: datetime, source: computed, description: "created_at + COMPRESSED_FORMULA_WEEKS (6 weeks)" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of latest entry into SAMPLE_REVIEW", default: null }
      - { name: is_late, type: boolean, source: computed, description: "true iff submitted_at > due_at", default: false }
      - { name: formula_version, type: integer, source: system, description: "Version of the approved formula; set to round_count at each APPROVED transition; null until first approval", default: null }

  - name: CostQuote
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: contract_manufacturer_id, type: string, source: input, description: "FK -> ContractManufacturer.id; when X-User-Role == ManufacturerRep it MUST equal X-User-ID" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Quoted per-unit cost", constraints: ">= 0" }
      - { name: tooling_fee_cents, type: integer, source: input, description: "One-time tooling fee amortized into landed cost", default: 0, constraints: ">= 0" }
      - { name: freight_total_cents, type: integer, source: input, description: "Quoted total freight for the shipment", constraints: ">= 0" }
      - { name: unit_weight_grams, type: integer, source: input, description: "Weight of one unit", constraints: ">= 1" }
      - { name: shipment_weight_grams, type: integer, source: input, description: "Total shipment weight", constraints: ">= unit_weight_grams" }
      - { name: duty_rate, type: number, source: input, description: "Import duty rate as a ratio (0.10 == 10%)", constraints: "0..1" }
      - { name: initial_order_qty, type: integer, source: input, description: "Quoted initial order quantity", constraints: ">= 1" }
      - { name: valid_until, type: datetime, source: input, description: "Quote validity deadline on the logical clock" }
      - { name: production_quarter, type: string, source: input, description: "Calendar quarter label the production slot is consumed from (e.g. 2026-Q4)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_EVALUATION | ACCEPTED | SETTLED | REJECTED | SUPERSEDED | WITHDRAWN | EXPIRED | INVALIDATED", default: SUBMITTED }
      - { name: landed_provisional_cents, type: integer, source: computed, description: "Provisional landed unit cost (see calculations.landed_unit_cost, provisional variant), computed at creation", default: null }
      - { name: landed_settled_cents, type: integer, source: computed, description: "Settled landed unit cost (settled variant), computed on ACCEPTED -> SETTLED with actuals; null until then", default: null }
      - { name: pinned_formula_version, type: integer, source: system, description: "FormulaProject.formula_version pinned at acceptance", default: null }
      - { name: accepted_at, type: datetime, source: system, description: "Timestamp of ACCEPTED transition", default: null }

  - name: ComplianceDossier
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; at most one dossier per product" }
      - { name: ingredient_status, type: enum, source: system, description: "PARALLEL dimension: PENDING | CLEARED | BLOCKED", default: PENDING }
      - { name: blocked_ingredients, type: array, source: system, description: "Ingredient names blocked by the most recent INGREDIENT review", default: [] }
      - { name: claim_status, type: enum, source: system, description: "PARALLEL dimension: PENDING | SUBSTANTIATED | BLOCKED", default: PENDING }
      - { name: cert_status, type: enum, source: system, description: "PARALLEL dimension (cruelty-free certification): NOT_APPLIED | APPLIED | AUDITING | CERTIFIED | DENIED | LAPSED", default: NOT_APPLIED }
      - { name: cert_expires_at, type: datetime, source: system, description: "Set to review timestamp + CERT_VALIDITY_DAYS (365) on CERTIFIED; null otherwise", default: null }
      - { name: registration_status, type: enum, source: system, description: "PARALLEL dimension (regulatory registration): UNFILED | FILED | REGISTERED | REJECTED", default: UNFILED }
      - { name: compliant, type: boolean, source: computed, description: "true iff ingredient_status == CLEARED AND claim_status == SUBSTANTIATED AND cert_status == CERTIFIED (and not lazily LAPSED) AND registration_status == REGISTERED" }

  - name: RetailPartner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Retail partner name" }
      - { name: banner_code, type: string, source: input, description: "Banner code label (informational)" }
      - { name: category_capacities, type: object, source: input, description: "Map of category code -> total facing capacity (e.g. {EYES: 10, LIPS: 8}); the limited shelf footprint" }
      - { name: committed_facings, type: object, source: computed, description: "Map category -> sum of facings over that partner's PlanogramSlots with status IN {COMMITTED, ACTIVE} (see calculations.shelf_capacity_reconciliation)" }
      - { name: available_facings, type: object, source: computed, description: "Map category -> category_capacities[category] - committed_facings[category]; never negative" }

  - name: LineReview
    parent: null
    common_fields: true
    fields:
      - { name: retail_partner_id, type: string, source: input, description: "FK -> RetailPartner.id" }
      - { name: season, type: string, source: input, description: "Season label (e.g. 2026-SP)" }
      - { name: submission_window_start, type: datetime, source: input, description: "Submission window start; HALF-OPEN interval [start, end)" }
      - { name: submission_window_end, type: datetime, source: input, description: "Submission window end (exclusive); must be > start" }
      - { name: review_date, type: datetime, source: input, description: "Date the line review is decided; must be >= submission_window_end" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SUBMISSION_OPEN | REVIEWING | DECIDED | PLANOGRAM_LOCKED | CANCELLED", default: SCHEDULED }

  - name: PlanogramSlot
    parent: null
    common_fields: true
    fields:
      - { name: line_review_id, type: string, source: input, description: "FK -> LineReview.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; must be LAUNCH_READY at creation" }
      - { name: category, type: string, source: input, description: "Category code; must be a key of the partner's category_capacities" }
      - { name: position_code, type: string, source: input, description: "Shelf position identifier (e.g. EYES-A1); occupancy conflicts are detected per (retail partner, category, position_code)" }
      - { name: facings, type: integer, source: input, description: "Number of facings committed", constraints: ">= 1" }
      - { name: occupancy_start, type: datetime, source: input, description: "Shelf occupancy start; CLOSED interval [start, end] with RESET_GAP_DAYS (14) buffer between occupancies of the same position" }
      - { name: occupancy_end, type: datetime, source: input, description: "Shelf occupancy end (inclusive); must be >= occupancy_start" }
      - { name: status, type: enum, source: system, description: "PROPOSED | COMMITTED | ACTIVE | VACATED | RELEASED | WITHDRAWN", default: PROPOSED }
      - { name: committed_at, type: datetime, source: system, description: "Timestamp of PROPOSED -> COMMITTED; eviction ordering key", default: null }

  - name: LaunchPlan
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: planogram_slot_id, type: string, source: input, description: "FK -> PlanogramSlot.id" }
      - { name: demand_forecast_units, type: integer, source: input, description: "Forecast demand for the launch window", constraints: ">= 0" }
      - { name: marketing_budget_cents, type: integer, source: input, description: "Total marketing budget for the launch", constraints: ">= 0" }
      - { name: cogs_budget_cents, type: integer, source: input, description: "COGS budget cap for the launch order", constraints: ">= 0" }
      - { name: sample_budget_cents, type: integer, source: input, description: "Sampling budget; must be <= marketing_budget_cents (checked at APPROVED)", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | QUANTITY_LOCKED | APPROVED | EXECUTED | RECONCILED", default: DRAFT }
      - { name: sampling_status, type: enum, source: system, description: "PARALLEL dimension (community & creator sampling program): NONE | PLANNED | ACTIVE | CLOSED", default: NONE }
      - { name: markdown_risk_pct, type: number, source: computed, description: "Trend decay risk at plan creation: min(floor(weeks since parent trend created_at) * 0.05, 0.40)" }
      - { name: capacity_units, type: integer, source: computed, description: "planogram_slot.facings * FACINGS_WEEKLY_SELLTROUGH (12) * LAUNCH_WEEKS (8)" }
      - { name: qty_demand_variant_units, type: integer, source: computed, description: "Demand-projection variant: min(demand_forecast_units, capacity_units)" }
      - { name: qty_risk_variant_units, type: integer, source: computed, description: "Risk-adjusted variant: min(floor(demand_forecast_units * (1 - markdown_risk_pct)), capacity_units)" }
      - { name: qty_locked_units, type: integer, source: system, description: "Quantity chosen at QUANTITY_LOCKED after MOQ floor and single-pass budget clamp (see calculations.launch_quantity)", default: null }
      - { name: locked_variant, type: enum, source: system, description: "DEMAND | RISK_ADJUSTED — which variant was locked", default: null }
      - { name: landed_locked_cents, type: integer, source: computed, description: "Landed unit cost at the locked quantity from the ACCEPTED quote; null until QUANTITY_LOCKED", default: null }
      - { name: samples_committed, type: integer, source: system, description: "Units reserved for sampling, not yet distributed", default: 0 }
      - { name: samples_distributed, type: integer, source: system, description: "Units actually distributed to creators/community", default: 0 }
      - { name: sample_spend_cents, type: integer, source: system, description: "Sampling spend charged: sum over DISTRIBUTE events of units * landed_locked_cents", default: 0 }
      - { name: retail_units_available, type: integer, source: computed, description: "qty_locked_units - samples_committed - samples_distributed - markdown_units" }
      - { name: markdown_units, type: integer, source: system, description: "Units moved to markdown at RECONCILED", default: 0 }
      - { name: markdown_exposure_cents, type: integer, source: computed, description: "markdown_units * landed_locked_cents * markdown depth tier (see calculations.markdown_exposure); null until RECONCILED", default: null }

  - name: DiscontinuationReview
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the product proposed for discontinuation (must be LAUNCHED)" }
      - { name: successor_product_id, type: string, source: input, description: "FK -> Product.id; optional refresh successor; when present must be LAUNCH_READY and != product_id", default: null }
      - { name: reason, type: enum, source: input, description: "TREND_DECAY | REFRESH_CADENCE | PERFORMANCE" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED", default: PROPOSED }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the ProductManager who proposed; the approver's X-User-ID MUST differ (segregation of duties)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TrendSignal
    field: status
    initial_state: DISCOVERED
    terminal_states: [SELECTED, ARCHIVED]
    transitions:
      - from: DISCOVERED
        to: EVALUATING
        trigger: "PATCH /trend-signals/{id} with status=EVALUATING"
        actor: TrendScout
        preconditions: []
        side_effects:
          - "computes momentum_score (calculations.trend_momentum_score) and stamps evaluated_at"
      - from: EVALUATING
        to: SELECTED
        trigger: "PATCH /trend-signals/{id} with status=SELECTED"
        actor: TrendScout
        preconditions:
          - "momentum_score >= TREND_SELECT_THRESHOLD (70.0), else ERR_TREND_SCORE_BELOW_THRESHOLD"
        side_effects: []
      - from: EVALUATING
        to: PARKED
        trigger: "PATCH /trend-signals/{id} with status=PARKED"
        actor: TrendScout
        preconditions: []
        side_effects: []
      - from: PARKED
        to: EVALUATING
        trigger: "PATCH /trend-signals/{id} with status=EVALUATING"
        actor: TrendScout
        preconditions: []
        side_effects:
          - "recomputes momentum_score from current field values and stamps evaluated_at"
      - from: [DISCOVERED, EVALUATING, PARKED]
        to: ARCHIVED
        trigger: "PATCH /trend-signals/{id} with status=ARCHIVED"
        actor: TrendScout
        preconditions: []
        side_effects: []

  - entity: Concept
    field: status
    initial_state: PITCHED
    terminal_states: [KILLED, COMMERCIALIZED]
    transitions:
      - from: PITCHED
        to: SELECTED
        trigger: "PATCH /concepts/{id} with status=SELECTED"
        actor: TrendScout
        preconditions: []
        side_effects:
          - "computes target_unit_cost_cents (calculations.target_unit_cost) and stamps selected_at"
      - from: SELECTED
        to: IN_DEVELOPMENT
        trigger: "system (POST /products with concept_id == this concept)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_DEVELOPMENT
        to: SELECTED
        trigger: "system (linked Product transitions to KILLED)"
        actor: system
        preconditions: []
        side_effects:
          - "concept may be commercialized again by a fresh POST /products (revision loop)"
      - from: IN_DEVELOPMENT
        to: COMMERCIALIZED
        trigger: "system (linked Product transitions to LAUNCHED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [PITCHED, SELECTED]
        to: KILLED
        trigger: "PATCH /concepts/{id} with status=KILLED"
        actor: TrendScout
        preconditions: []
        side_effects: []

  - entity: Product
    field: status
    initial_state: FORMULATION
    terminal_states: [KILLED, DISCONTINUED]
    note: "Parallel dimension packaging_status evolves independently: PACK_SOURCING -> PACK_READY via PATCH /products/{id} with packaging_status=PACK_READY (no reverse). CYCLIC reformulation loop: COMPLIANCE_GATE/SOURCING -> FORMULATION."
    transitions:
      - from: FORMULATION
        to: SOURCING
        trigger: "PATCH /products/{id} with status=SOURCING"
        actor: ProductManager
        preconditions:
          - "at least one FormulaProject for this product has status == APPROVED, else ERR_FORMULA_NOT_APPROVED"
        side_effects: []
      - from: SOURCING
        to: COMPLIANCE_GATE
        trigger: "PATCH /products/{id} with status=COMPLIANCE_GATE"
        actor: ProductManager
        preconditions:
          - "at least one CostQuote for this product has status == ACCEPTED, else ERR_QUOTE_NOT_ACCEPTED"
        side_effects: []
      - from: [SOURCING, COMPLIANCE_GATE]
        to: FORMULATION
        trigger: "PATCH /products/{id} with status=FORMULATION (manual reformulation) OR system (cert DENIED/LAPSED cascade from ComplianceDossier)"
        actor: ProductManager | system
        preconditions: []
        side_effects:
          - "every ACCEPTED CostQuote for this product -> INVALIDATED (stops consuming CM capacity)"
          - "every APPROVED FormulaProject for this product -> IN_DEVELOPMENT with round_count incremented by 1"
      - from: COMPLIANCE_GATE
        to: LAUNCH_READY
        trigger: "PATCH /products/{id} with status=LAUNCH_READY"
        actor: ProductManager
        preconditions:
          - "the product's ComplianceDossier has compliant == true, else ERR_COMPLIANCE_GATE_FAILED"
          - "packaging_status == PACK_READY, else ERR_INVALID_STATE"
        side_effects: []
      - from: LAUNCH_READY
        to: LAUNCHED
        trigger: "system (linked LaunchPlan transitions to EXECUTED)"
        actor: system
        preconditions: []
        side_effects:
          - "stamps launched_at"
          - "linked Concept -> COMMERCIALIZED"
      - from: [FORMULATION, SOURCING, COMPLIANCE_GATE]
        to: KILLED
        trigger: "PATCH /products/{id} with status=KILLED"
        actor: ProductManager
        preconditions: []
        side_effects:
          - "linked Concept -> SELECTED (revision loop)"
          - "non-terminal CostQuotes (SUBMITTED, UNDER_EVALUATION, ACCEPTED) for this product -> SUPERSEDED"
      - from: LAUNCHED
        to: DISCONTINUED
        trigger: "system (DiscontinuationReview transitions to APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "sets successor_product_id from the review (may be null)"
          - "every COMMITTED or ACTIVE PlanogramSlot for this product -> VACATED, freeing facings; the vacancy then forces recomputation of the partner's committed_facings / available_facings (calculations.shelf_capacity_reconciliation)"
          - "the product's EXECUTED LaunchPlan -> RECONCILED with markdown_units := retail_units_available and markdown_exposure_cents computed (calculations.markdown_exposure)"

  - entity: ContractManufacturer
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /manufacturers/{id} with status=SUSPENDED"
        actor: SourcingLead
        preconditions: []
        side_effects:
          - "blocks new FormulaProjects and new CostQuotes for this CM (ERR_CM_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /manufacturers/{id} with status=ACTIVE"
        actor: SourcingLead
        preconditions: []
        side_effects: []

  - entity: FormulaProject
    field: status
    initial_state: IN_DEVELOPMENT
    terminal_states: [ABANDONED]
    transitions:
      - from: IN_DEVELOPMENT
        to: SAMPLE_REVIEW
        trigger: "PATCH /formula-projects/{id} with status=SAMPLE_REVIEW"
        actor: SourcingLead | ManufacturerRep
        preconditions:
          - "when actor is ManufacturerRep, X-User-ID MUST equal contract_manufacturer_id, else ERR_FORBIDDEN_ROLE"
        side_effects:
          - "stamps submitted_at and computes is_late := (submitted_at > due_at)"
      - from: SAMPLE_REVIEW
        to: APPROVED
        trigger: "PATCH /formula-projects/{id} with status=APPROVED"
        actor: SourcingLead
        preconditions: []
        side_effects:
          - "sets formula_version := round_count"
      - from: SAMPLE_REVIEW
        to: IN_DEVELOPMENT
        trigger: "PATCH /formula-projects/{id} with status=IN_DEVELOPMENT (sample rejected)"
        actor: SourcingLead
        preconditions:
          - "round_count < MAX_FORMULA_ROUNDS (3), else the project auto-transitions to ABANDONED instead"
        side_effects:
          - "round_count += 1"
      - from: SAMPLE_REVIEW
        to: ABANDONED
        trigger: "system (sample rejected while round_count == MAX_FORMULA_ROUNDS)"
        actor: system
        preconditions: []
        side_effects:
          - "the project can no longer supply an approvable formula"
      - from: IN_DEVELOPMENT
        to: ABANDONED
        trigger: "PATCH /formula-projects/{id} with status=ABANDONED"
        actor: SourcingLead
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: IN_DEVELOPMENT
        trigger: "system (Product reformulation cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "round_count += 1"

  - entity: CostQuote
    field: status
    initial_state: SUBMITTED
    terminal_states: [SETTLED, REJECTED, SUPERSEDED, WITHDRAWN, EXPIRED, INVALIDATED]
    transitions:
      - from: SUBMITTED
        to: UNDER_EVALUATION
        trigger: "PATCH /cost-quotes/{id} with status=UNDER_EVALUATION"
        actor: SourcingLead
        preconditions: []
        side_effects: []
      - from: UNDER_EVALUATION
        to: ACCEPTED
        trigger: "PATCH /cost-quotes/{id} with status=ACCEPTED"
        actor: SourcingLead
        preconditions:
          - "product.status == SOURCING, else ERR_PRODUCT_NOT_SOURCING"
          - "a FormulaProject for this product with status == APPROVED exists, else ERR_FORMULA_NOT_APPROVED"
          - "landed_provisional_cents <= concept.target_unit_cost_cents, else ERR_COST_TARGET_EXCEEDED"
          - "initial_order_qty >= contract_manufacturer.moq_units, else ERR_BELOW_MOQ"
          - "contract_manufacturer.status == ACTIVE, else ERR_CM_SUSPENDED"
          - "logical clock now <= valid_until, else ERR_QUOTE_EXPIRED (quote lazily transitions to EXPIRED)"
          - "CM quarterly capacity: count of this CM's ACCEPTED quotes with the same production_quarter < capacity_slots_per_quarter, else ERR_CAPACITY_EXCEEDED"
        side_effects:
          - "pins pinned_formula_version to the APPROVED FormulaProject's formula_version"
          - "every other CostQuote for the same product in SUBMITTED or UNDER_EVALUATION -> SUPERSEDED"
          - "consumes one CM capacity slot for production_quarter (calculations.cm_quarterly_capacity)"
          - "stamps accepted_at"
      - from: UNDER_EVALUATION
        to: REJECTED
        trigger: "PATCH /cost-quotes/{id} with status=REJECTED"
        actor: SourcingLead
        preconditions: []
        side_effects: []
      - from: [SUBMITTED, UNDER_EVALUATION]
        to: WITHDRAWN
        trigger: "PATCH /cost-quotes/{id} with status=WITHDRAWN"
        actor: ManufacturerRep
        preconditions:
          - "X-User-ID MUST equal contract_manufacturer_id, else ERR_FORBIDDEN_ROLE"
        side_effects: []
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (same CM creates a newer CostQuote for the same product, or another quote for the product is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_EVALUATION
        to: SUPERSEDED
        trigger: "system (another quote for the product is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: SETTLED
        trigger: "PATCH /cost-quotes/{id} with status=SETTLED carrying actual_qty and actual_freight_total_cents"
        actor: SourcingLead
        preconditions:
          - "product.status == LAUNCHED, else ERR_INVALID_STATE"
        side_effects:
          - "computes landed_settled_cents (calculations.landed_unit_cost, settled variant)"
      - from: ACCEPTED
        to: INVALIDATED
        trigger: "system (Product reformulation cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "releases the CM capacity slot consumed at acceptance"
      - from: [SUBMITTED, UNDER_EVALUATION]
        to: EXPIRED
        trigger: "system (lazy: any read or attempted transition when logical clock now > valid_until)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ComplianceDossier
    field: "(parallel dimensions) ingredient_status x claim_status x cert_status x registration_status"
    initial_state: "PENDING x PENDING x NOT_APPLIED x UNFILED"
    terminal_states: []
    note: "Four independent state dimensions on one entity; each review endpoint call moves exactly one dimension. compliant is derived from all four."
    transitions:
      - from: "ingredient_status: PENDING"
        to: "ingredient_status: CLEARED"
        trigger: "POST /compliance-dossiers/{id}/reviews with dimension=INGREDIENT, outcome=CLEARED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["blocked_ingredients := []"]
      - from: "ingredient_status: [PENDING, BLOCKED]"
        to: "ingredient_status: BLOCKED"
        trigger: "POST /compliance-dossiers/{id}/reviews with dimension=INGREDIENT, outcome=BLOCKED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["blocked_ingredients := request blocked_items"]
      - from: "ingredient_status: BLOCKED"
        to: "ingredient_status: CLEARED"
        trigger: "POST /compliance-dossiers/{id}/reviews with dimension=INGREDIENT, outcome=CLEARED (re-review after reformulation)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["blocked_ingredients := []"]
      - from: "claim_status: PENDING"
        to: "claim_status: SUBSTANTIATED"
        trigger: "POST /compliance-dossiers/{id}/reviews with dimension=CLAIM, outcome=SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: "claim_status: [PENDING, BLOCKED]"
        to: "claim_status: BLOCKED"
        trigger: "POST /compliance-dossiers/{id}/reviews with dimension=CLAIM, outcome=BLOCKED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: "claim_status: BLOCKED"
        to: "claim_status: SUBSTANTIATED"
        trigger: "POST /compliance-dossiers/{id}/reviews with dimension=CLAIM, outcome=SUBSTANTIATED (re-review)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: "cert_status: NOT_APPLIED"
        to: "cert_status: APPLIED"
        trigger: "POST /compliance-dossiers/{id}/reviews with dimension=CERTIFICATION, outcome=APPLIED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: "cert_status: APPLIED"
        to: "cert_status: AUDITING"
        trigger: "POST /compliance-dossiers/{id}/reviews with dimension=CERTIFICATION, outcome=AUDITING"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: "cert_status: AUDITING"
        to: "cert_status: CERTIFIED"
        trigger: "POST /compliance-dossiers/{id}/reviews with dimension=CERTIFICATION, outcome=CERTIFIED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["cert_expires_at := now + CERT_VALIDITY_DAYS (365 days)"]
      - from: "cert_status: AUDITING"
        to: "cert_status: DENIED"
        trigger: "POST /compliance-dossiers/{id}/reviews with dimension=CERTIFICATION, outcome=DENIED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "CASCADE link 1: the product, if in COMPLIANCE_GATE or LAUNCH_READY, reverts to FORMULATION (LAUNCH_READY -> FORMULATION passes through no intermediate state)"
          - "CASCADE link 2 (caused by link 1's Product mutation): every ACCEPTED CostQuote -> INVALIDATED and every APPROVED FormulaProject -> IN_DEVELOPMENT (round_count += 1)"
      - from: "cert_status: CERTIFIED"
        to: "cert_status: LAPSED"
        trigger: "system (lazy: any read or write on the dossier when logical clock now > cert_expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "same Product-reversion cascade as DENIED when the product is in COMPLIANCE_GATE or LAUNCH_READY; if the product is already LAUNCHED the product stays LAUNCHED but compliant == false blocks further LaunchPlan approvals"
      - from: "registration_status: UNFILED"
        to: "registration_status: FILED"
        trigger: "POST /compliance-dossiers/{id}/reviews with dimension=REGISTRATION, outcome=FILED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: "registration_status: [FILED, REJECTED]"
        to: "registration_status: REGISTERED"
        trigger: "POST /compliance-dossiers/{id}/reviews with dimension=REGISTRATION, outcome=REGISTERED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: "registration_status: FILED"
        to: "registration_status: REJECTED"
        trigger: "POST /compliance-dossiers/{id}/reviews with dimension=REGISTRATION, outcome=REJECTED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: LineReview
    field: status
    initial_state: SCHEDULED
    terminal_states: [PLANOGRAM_LOCKED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SUBMISSION_OPEN
        trigger: "PATCH /line-reviews/{id} with status=SUBMISSION_OPEN"
        actor: RetailPlanner
        preconditions:
          - "submission_window_start <= now < submission_window_end on the logical clock, else ERR_SUBMISSION_WINDOW_CLOSED"
        side_effects: []
      - from: SUBMISSION_OPEN
        to: REVIEWING
        trigger: "PATCH /line-reviews/{id} with status=REVIEWING"
        actor: RetailPlanner
        preconditions:
          - "now >= submission_window_end on the logical clock, else ERR_SUBMISSION_WINDOW_CLOSED"
        side_effects: []
      - from: REVIEWING
        to: DECIDED
        trigger: "PATCH /line-reviews/{id} with status=DECIDED"
        actor: RetailPlanner
        preconditions:
          - "now >= review_date on the logical clock, else ERR_SUBMISSION_WINDOW_CLOSED"
        side_effects: []
      - from: DECIDED
        to: PLANOGRAM_LOCKED
        trigger: "PATCH /line-reviews/{id} with status=PLANOGRAM_LOCKED"
        actor: RetailPlanner
        preconditions:
          - "no PlanogramSlot of this review remains in PROPOSED, else ERR_UNRESOLVED_SLOTS"
        side_effects: []
      - from: [SCHEDULED, SUBMISSION_OPEN, REVIEWING, DECIDED]
        to: CANCELLED
        trigger: "PATCH /line-reviews/{id} with status=CANCELLED"
        actor: RetailPlanner
        preconditions: []
        side_effects:
          - "PROPOSED PlanogramSlots of this review -> WITHDRAWN"
          - "COMMITTED PlanogramSlots of this review -> RELEASED, freeing facings; each RELEASED slot then reverts its QUANTITY_LOCKED or APPROVED LaunchPlan to DRAFT (qty_locked_units cleared)"

  - entity: PlanogramSlot
    field: status
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN, RELEASED, VACATED]
    transitions:
      - from: PROPOSED
        to: COMMITTED
        trigger: "PATCH /planogram-slots/{id} with status=COMMITTED"
        actor: RetailPlanner
        preconditions:
          - "line_review.status == DECIDED, else ERR_INVALID_STATE"
          - "capacity: committed_facings[category] + facings <= partner.category_capacities[category], else ERR_CAPACITY_EXCEEDED"
        side_effects:
          - "stamps committed_at"
          - "recomputes partner committed_facings / available_facings (calculations.shelf_capacity_reconciliation)"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "PATCH /planogram-slots/{id} with status=WITHDRAWN OR system (line review cancelled)"
        actor: RetailPlanner | system
        preconditions: []
        side_effects: []
      - from: COMMITTED
        to: ACTIVE
        trigger: "system (linked LaunchPlan transitions to EXECUTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMMITTED
        to: RELEASED
        trigger: "system (line review cancelled OR partner capacity eviction)"
        actor: system
        preconditions: []
        side_effects:
          - "frees facings; the slot's QUANTITY_LOCKED or APPROVED LaunchPlan reverts to DRAFT (qty_locked_units cleared)"
      - from: ACTIVE
        to: VACATED
        trigger: "system (product discontinued)"
        actor: system
        preconditions: []
        side_effects:
          - "frees facings; partner committed_facings / available_facings recomputed"

  - entity: LaunchPlan
    field: status
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    note: "Parallel dimension sampling_status (NONE -> PLANNED -> ACTIVE -> CLOSED) evolves independently via PATCH /launch-plans/{id} with sampling_status=..., writable only by MarketingLead."
    transitions:
      - from: DRAFT
        to: QUANTITY_LOCKED
        trigger: "PATCH /launch-plans/{id} with status=QUANTITY_LOCKED and variant=DEMAND|RISK_ADJUSTED"
        actor: ProductManager
        preconditions:
          - "variant is DEMAND or RISK_ADJUSTED, else ERR_INVALID_REQUEST"
          - "a CostQuote for the product has status == ACCEPTED, else ERR_QUOTE_NOT_ACCEPTED"
          - "single-pass budget clamp does not fall below MOQ, else ERR_BUDGET_EXCEEDED (see calculations.launch_quantity)"
        side_effects:
          - "sets qty_locked_units, locked_variant, landed_locked_cents"
      - from: QUANTITY_LOCKED
        to: APPROVED
        trigger: "PATCH /launch-plans/{id} with status=APPROVED"
        actor: ProductManager
        preconditions:
          - "planogram_slot.status == COMMITTED, else ERR_SLOT_NOT_COMMITTED"
          - "the product's ComplianceDossier has compliant == true (cert must not be LAPSED), else ERR_COMPLIANCE_GATE_FAILED"
          - "sample_budget_cents <= marketing_budget_cents, else ERR_BUDGET_EXCEEDED"
        side_effects: []
      - from: APPROVED
        to: EXECUTED
        trigger: "PATCH /launch-plans/{id} with status=EXECUTED"
        actor: ProductManager
        preconditions:
          - "logical clock now >= planogram_slot.occupancy_start, else ERR_LAUNCH_WINDOW_NOT_OPEN"
        side_effects:
          - "linked Product LAUNCH_READY -> LAUNCHED (stamps launched_at)"
          - "linked PlanogramSlot COMMITTED -> ACTIVE"
          - "product's Concept IN_DEVELOPMENT -> COMMERCIALIZED"
      - from: EXECUTED
        to: RECONCILED
        trigger: "PATCH /launch-plans/{id} with status=RECONCILED OR system (product discontinued)"
        actor: ProductManager | system
        preconditions:
          - "sampling_status must be NONE or CLOSED when reconciled manually, else ERR_INVALID_STATE"
        side_effects:
          - "markdown_units := retail_units_available"
          - "computes markdown_exposure_cents (calculations.markdown_exposure)"
      - from: QUANTITY_LOCKED
        to: DRAFT
        trigger: "system (planogram slot RELEASED by cancellation or capacity eviction)"
        actor: system
        preconditions: []
        side_effects:
          - "clears qty_locked_units and landed_locked_cents"

  - entity: LaunchPlanSampling
    field: sampling_status
    note: "Parallel dimension of LaunchPlan; declared separately for clarity. Transitions via PATCH /launch-plans/{id} with sampling_status=... (MarketingLead only)."
    initial_state: NONE
    terminal_states: [CLOSED]
    transitions:
      - from: NONE
        to: PLANNED
        trigger: "PATCH /launch-plans/{id} with sampling_status=PLANNED"
        actor: MarketingLead
        preconditions:
          - "status IN {QUANTITY_LOCKED, APPROVED, EXECUTED}, else ERR_INVALID_STATE"
        side_effects: []
      - from: PLANNED
        to: ACTIVE
        trigger: "PATCH /launch-plans/{id} with sampling_status=ACTIVE"
        actor: MarketingLead
        preconditions:
          - "status == EXECUTED, else ERR_INVALID_STATE"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "PATCH /launch-plans/{id} with sampling_status=CLOSED"
        actor: MarketingLead
        preconditions: []
        side_effects:
          - "no further sample-distribution events accepted (ERR_INVALID_STATE)"

  - entity: DiscontinuationReview
    field: status
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "PATCH /discontinuation-reviews/{id} with status=APPROVED"
        actor: RetailPlanner
        preconditions:
          - "approver X-User-ID != proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "CASCADE link 1: product LAUNCHED -> DISCONTINUED (sets product.successor_product_id)"
          - "CASCADE link 2 (caused by link 1): the product's COMMITTED/ACTIVE PlanogramSlots -> VACATED"
          - "CASCADE link 3 (caused by link 2's vacancy): partner committed_facings / available_facings recomputed (calculations.shelf_capacity_reconciliation)"
          - "fan-out (also caused by link 1): the product's EXECUTED LaunchPlan -> RECONCILED with markdown_units := retail_units_available"
      - from: PROPOSED
        to: REJECTED
        trigger: "PATCH /discontinuation-reviews/{id} with status=REJECTED"
        actor: RetailPlanner
        preconditions:
          - "approver X-User-ID != proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: quote-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /cost-quotes"
    occ_field: expected_product_version
    description: |
      Creating a CostQuote against a Product whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just created a quote for the same product (which
      legitimately supersedes that CM's prior SUBMITTED quote) or transitioned
      the product, so the current writer's view of the product is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: slot-create-stale-line-review
    parent_entity: LineReview
    write_endpoint: "POST /planogram-slots"
    occ_field: expected_line_review_version
    description: |
      Creating a PlanogramSlot against a LineReview whose version has advanced
      since the client last observed it is rejected. A prior slot creation
      advances the review's version, so a second creation carrying the older
      version is working from a stale view of the review's slot roster.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: trend_momentum_score
    trigger: "TrendSignal transitions into EVALUATING (from DISCOVERED or PARKED)"
    algorithm: weighted_scoring
    formula: |
      velocity_norm = min(mention_velocity_7d / VELOCITY_CAP_PER_DAY, 1.0)
      growth_norm   = min(engagement_growth_pct / GROWTH_CAP, 1.0)
      signal_norm   = prestige_similarity      if source == PRESTIGE_LAUNCH
                    = cross_platform_spread    if source == SOCIAL_PLATFORM
      momentum_score = round_half_up(
          W_VELOCITY * velocity_norm * 100
        + W_GROWTH   * growth_norm   * 100
        + W_SIGNAL   * signal_norm   * 100, 1)
    input_set: "the TrendSignal being evaluated; all three raw inputs come from its own fields"
    constants:
      VELOCITY_CAP_PER_DAY: 5000
      GROWTH_CAP: 2.0
      W_VELOCITY: 0.5
      W_GROWTH: 0.3
      W_SIGNAL: 0.2
      TREND_SELECT_THRESHOLD: 70.0
    precision: "1 decimal place, round_half_up"

  - name: target_unit_cost
    trigger: "Concept transitions PITCHED -> SELECTED"
    algorithm: tiered_pricing
    formula: |
      target_price_point_cents MUST be one of PRICE_POINTS (validated at create).
      ratio = 0.28 if target_price_point_cents <= 600
              0.26 if target_price_point_cents <= 1000
              0.24 if target_price_point_cents <= 1500
              0.22 if target_price_point_cents <= 2000
      target_unit_cost_cents = floor(target_price_point_cents * ratio)
      Worked tier values: 300 -> 84, 600 -> 168, 1000 -> 260, 1500 -> 360, 2000 -> 440.
    input_set: "the Concept being selected"
    constants:
      PRICE_POINTS: [300, 600, 1000, 1500, 2000]
    precision: "integer cents (floor)"

  - name: landed_unit_cost
    trigger: "provisional: at POST /cost-quotes (creation); settled: at PATCH /cost-quotes/{id} with status=SETTLED"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (round per component, then sum — never sum then round):
        freight_per_unit = round_half_up(freight_total_cents * unit_weight_grams / shipment_weight_grams)
        duty_per_unit    = round_half_up((unit_cost_cents + freight_per_unit) * duty_rate)
        # duty is computed from the ALREADY-ROUNDED freight_per_unit; using the
        # unrounded quotient is a different, forbidden result.
      provisional variant (at creation):
        tooling_amort = ceil(tooling_fee_cents / initial_order_qty)
        landed_provisional_cents = unit_cost_cents + tooling_amort + freight_per_unit + duty_per_unit
      settled variant (at SETTLED with actual_qty and actual_freight_total_cents):
        actual_freight_per_unit = round_half_up(actual_freight_total_cents * unit_weight_grams / shipment_weight_grams)
        actual_duty_per_unit    = round_half_up((unit_cost_cents + actual_freight_per_unit) * duty_rate)
        actual_tooling_amort    = ceil(tooling_fee_cents / actual_qty)
        landed_settled_cents = unit_cost_cents + actual_tooling_amort + actual_freight_per_unit + actual_duty_per_unit
    input_set: "the CostQuote; settled variant additionally consumes the PATCH actuals"
    precision: "integer cents; round_half_up per component; ceil division for amortization"
    variants:
      - name: provisional
        when: "at quote creation; uses initial_order_qty and quoted freight_total_cents"
        difference: "amortizes tooling over initial_order_qty; freight from quoted totals"
      - name: settled
        when: "at ACCEPTED -> SETTLED; uses actual_qty and actual_freight_total_cents"
        difference: "amortizes tooling over actual_qty; freight from actual totals — same inputs shape, different cents whenever actuals differ from quoted"

  - name: launch_quantity
    trigger: "LaunchPlan creation (variants) and DRAFT -> QUANTITY_LOCKED (lock)"
    algorithm: constraint_propagation
    formula: |
      At creation (both variants computed and stored):
        capacity_units = planogram_slot.facings * FACINGS_WEEKLY_SELLTROUGH * LAUNCH_WEEKS
        qty_demand_variant_units = min(demand_forecast_units, capacity_units)
        qty_risk_variant_units   = min(floor(demand_forecast_units * (1 - markdown_risk_pct)), capacity_units)
      At lock (variant chosen by request `variant`):
        PINNED EVALUATION ORDER (single pass — NO fixed-point iteration, because
        landed cost depends on qty via tooling amortization while qty is clamped
        by a budget that itself contains landed cost):
          q0 = qty_demand_variant_units or qty_risk_variant_units (per variant)
          landed(q) = accepted_quote.unit_cost_cents
                    + ceil(accepted_quote.tooling_fee_cents / q)
                    + accepted-quote freight_per_unit + duty_per_unit (as computed at acceptance)
          if q0 * landed(q0) > cogs_budget_cents:
              q1 = floor(cogs_budget_cents / landed(MOQ))   # landed evaluated at MOQ, once
              if q1 < MOQ: reject ERR_BUDGET_EXCEEDED
              qty_locked_units = q1
          else:
              qty_locked_units = q0
          if qty_locked_units < MOQ: reject ERR_BELOW_MOQ
        landed_locked_cents = landed(qty_locked_units)
        MOQ = the ACCEPTED quote's contract_manufacturer.moq_units
    input_set: "the LaunchPlan, its PlanogramSlot, the product's ACCEPTED CostQuote and that quote's ContractManufacturer"
    constants:
      FACINGS_WEEKLY_SELLTROUGH: 12
      LAUNCH_WEEKS: 8
      TREND_DECAY_PCT_PER_WEEK: 0.05
      MARKDOWN_RISK_CAP: 0.40
    precision: "integer units; floor/ceil as written"
    variants:
      - name: demand
        when: "locked with variant=DEMAND — stockout-averse"
        difference: "uses raw demand_forecast_units; larger qty on decaying trends"
      - name: risk_adjusted
        when: "locked with variant=RISK_ADJUSTED — markdown-averse"
        difference: "applies the markdown_risk_pct haircut; strictly smaller whenever markdown_risk_pct > 0 and demand binds"

  - name: markdown_risk
    trigger: "LaunchPlan creation"
    algorithm: decay_function
    formula: |
      weeks_since_trend = floor((plan.created_at - trend.created_at) / 7 days)
      markdown_risk_pct = min(weeks_since_trend * TREND_DECAY_PCT_PER_WEEK, MARKDOWN_RISK_CAP)
      where trend is the TrendSignal reached via product -> concept -> trend_signal_id.
    input_set: "the LaunchPlan and the TrendSignal ancestor of its product"
    precision: "ratio, 2 decimal places"

  - name: markdown_exposure
    trigger: "LaunchPlan EXECUTED -> RECONCILED (manual or discontinuation cascade)"
    algorithm: threshold
    formula: |
      weeks_since_launch = floor((now - product.launched_at) / 7 days)
      depth = 0.00 if weeks_since_launch <= 4
              0.30 if weeks_since_launch <= 8
              0.50 if weeks_since_launch <= 12
              0.70 otherwise
      markdown_exposure_cents = markdown_units * landed_locked_cents * depth
      (markdown_units was just set to retail_units_available by the transition)
    input_set: "the LaunchPlan being reconciled and its product"
    constants:
      MARKDOWN_TIER1_MAX_WEEKS: 4
      MARKDOWN_TIER2_MAX_WEEKS: 8
      MARKDOWN_TIER3_MAX_WEEKS: 12
    precision: "integer cents"

  - name: shelf_capacity_reconciliation
    trigger: "PlanogramSlot commit/release/vacate; RetailPartner capacity PATCH; discontinuation cascade"
    algorithm: aggregation
    formula: |
      For each (partner, category):
        committed_facings[c] = sum(facings of the partner's PlanogramSlots with status IN {COMMITTED, ACTIVE} and category == c)
        available_facings[c] = category_capacities[c] - committed_facings[c]
      INVARIANT (footprint conservation): for every category,
        committed_facings[c] + available_facings[c] == category_capacities[c]
        — commit and vacate/release are compensating actions and must leave the sum unchanged.
      Slot status filter is exactly {COMMITTED, ACTIVE}; PROPOSED, WITHDRAWN, RELEASED, VACATED never count.
    input_set: "all PlanogramSlots of the partner reached via LineReview.retail_partner_id"
    precision: "integer facings"

  - name: capacity_eviction
    trigger: "PATCH /retail-partners/{id} reducing category_capacities below current committed_facings"
    algorithm: waterfall_allocation
    formula: |
      If new_capacity[c] < committed_facings[c]:
        evict that category's COMMITTED slots (never ACTIVE), ordered by
        committed_at DESC (most recently committed first), tie-break created_at DESC,
        setting each evicted slot RELEASED and reverting its LaunchPlan to DRAFT,
        until committed_facings[c] <= new_capacity[c].
      If ACTIVE slots still leave committed_facings[c] > new_capacity[c] after all
      COMMITTED slots are evicted: reject the whole PATCH with ERR_CAPACITY_EXCEEDED
      and evict nothing (atomic).
    input_set: "the partner's PlanogramSlots with status == COMMITTED or ACTIVE in the affected category"
    precision: "integer facings; ordering by committed_at DESC then created_at DESC — never id"

  - name: cm_quarterly_capacity
    trigger: "CostQuote UNDER_EVALUATION -> ACCEPTED"
    algorithm: chronological
    formula: |
      For (contract_manufacturer_id, production_quarter):
        consumed = count of this CM's CostQuotes with status == ACCEPTED and same production_quarter
        accept allowed iff consumed < capacity_slots_per_quarter
      Quotes consume in accepted_at ASC order (chronological); on identical
      accepted_at the tie-break is created_at ASC — never id. Acceptance order
      therefore determines which quote is rejected once the quarter is full.
    input_set: "the CM's ACCEPTED CostQuotes sharing production_quarter"
    precision: "integer slots"

  - name: packaging_lead_time
    trigger: "Product creation (computed once)"
    algorithm: constraint_propagation
    formula: |
      tooling_reuse = (tooling_code is not null) AND exists another Product p2
                      with p2.tooling_code == tooling_code, p2.created_at < this.created_at,
                      p2.status != KILLED
      packaging_lead_weeks = TOOLING_REUSE_WEEKS if tooling_reuse else TOOLING_NEW_WEEKS
    input_set: "all Products sharing the tooling_code"
    constants:
      TOOLING_NEW_WEEKS: 14
      TOOLING_REUSE_WEEKS: 5
    precision: "integer weeks"

  - name: sampling_burn
    trigger: "POST /launch-plans/{id}/sample-distributions (COMMIT | DISTRIBUTE | RELEASE)"
    algorithm: aggregation
    formula: |
      SAMPLE_CAP = floor(qty_locked_units * SAMPLE_CAP_PCT)
      COMMIT(n):   requires samples_committed + samples_distributed + n <= SAMPLE_CAP,
                   else ERR_SAMPLE_OVERDRAW; requires retail_units_available >= n;
                   samples_committed += n
      DISTRIBUTE(n): requires n <= samples_committed; sampling_status == ACTIVE;
                   charges sample_spend_cents += n * landed_locked_cents;
                   requires sample_spend_cents <= sample_budget_cents, else ERR_SAMPLE_OVERDRAW;
                   samples_committed -= n; samples_distributed += n
      RELEASE(n):  requires n <= samples_committed; samples_committed -= n
                   (compensating action — returns units to retail availability)
      INVARIANT (launch-inventory conservation): at all times after QUANTITY_LOCKED,
        qty_locked_units == retail_units_available + samples_committed
                          + samples_distributed + markdown_units
      COMMIT followed by RELEASE of the same n leaves every bucket unchanged.
    input_set: "the LaunchPlan and its distribution events (append-only, processed in created_at ASC)"
    constants:
      SAMPLE_CAP_PCT: 0.10
    precision: "integer units and cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when a
# single request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles. Field-level: PATCH /launch-plans/{id} carrying status or variant requires ProductManager; carrying sampling_status or sample_budget_cents requires MarketingLead. PATCH /cost-quotes/{id} with status=WITHDRAWN requires ManufacturerRep; all other status targets require SourcingLead. PATCH /formula-projects/{id} with status=SAMPLE_REVIEW allows ManufacturerRep; all other targets require SourcingLead."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request shape: required fields present, types valid, enum members valid. Conditional-required: prestige_similarity required iff source == PRESTIGE_LAUNCH; cross_platform_spread required iff source == SOCIAL_PLATFORM (POST /trend-signals). Review outcome must belong to the requested dimension's outcome set (POST /compliance-dossiers/{id}/reviews)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH"
  - priority: 4
    category: existence
    check: "Path ids resolve, left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids; each entity uses its specific error (ERR_TREND_SIGNAL_NOT_FOUND, ERR_CONCEPT_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_MANUFACTURER_NOT_FOUND, ERR_FORMULA_PROJECT_NOT_FOUND, ERR_COST_QUOTE_NOT_FOUND, ERR_DOSSIER_NOT_FOUND, ERR_RETAIL_PARTNER_NOT_FOUND, ERR_LINE_REVIEW_NOT_FOUND, ERR_PLANOGRAM_SLOT_NOT_FOUND, ERR_LAUNCH_PLAN_NOT_FOUND, ERR_DISCONTINUATION_REVIEW_NOT_FOUND)"
  - priority: 5
    category: existence
    check: "Body foreign-key ids resolve, in the endpoint's declared input order"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints with body FKs (same per-entity NOT_FOUND errors as priority 4)"
  - priority: 6
    category: state
    check: "OCC: expected_product_version == Product.version (POST /cost-quotes); expected_line_review_version == LineReview.version (POST /planogram-slots)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /cost-quotes, POST /planogram-slots"
  - priority: 7
    category: state
    check: "State-machine from-state validity per §1.2 (including terminal-state lockdown, and packaging_status/sampling_status parallel-dimension from-states). Also cross-entity state preconditions without a domain-specific error: POST /discontinuation-reviews requires product.status == LAUNCHED; POST /planogram-slots requires line_review.status == SUBMISSION_OPEN."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all PATCH transition endpoints; POST /discontinuation-reviews; POST /planogram-slots"
  - priority: 8
    category: business_safety
    check: "Compliance gates: PATCH /products/{id} status=LAUNCH_READY requires the product's dossier compliant == true; PATCH /launch-plans/{id} status=APPROVED re-requires compliant == true (cert must not be lazily LAPSED)"
    error_id: ERR_COMPLIANCE_GATE_FAILED
    http_status: 422
    applies_to: "PATCH /products/{id}, PATCH /launch-plans/{id}"
  - priority: 9
    category: business_referential
    check: "POST /concepts: parent trend has status == SELECTED"
    error_id: ERR_TREND_NOT_SELECTED
    http_status: 422
    applies_to: "POST /concepts"
    note: "At the same referential step, concept.category must equal the parent trend's category; a mismatch reports ERR_INVALID_REQUEST (400) rather than ERR_TREND_NOT_SELECTED."
  - priority: 10
    category: business_referential
    check: "POST /products: concept has status == SELECTED"
    error_id: ERR_CONCEPT_NOT_SELECTED
    http_status: 422
    applies_to: "POST /products"
  - priority: 11
    category: business_referential
    check: "PATCH /products/{id} status=SOURCING requires >= 1 APPROVED FormulaProject; status=COMPLIANCE_GATE requires >= 1 ACCEPTED CostQuote"
    error_id: ERR_FORMULA_NOT_APPROVED
    http_status: 422
    applies_to: "PATCH /products/{id}"
    note: "COMPLIANCE_GATE failure uses ERR_QUOTE_NOT_ACCEPTED instead (same priority, different condition)"
  - priority: 12
    category: business_referential
    check: "PATCH /cost-quotes/{id} status=ACCEPTED requires product.status == SOURCING and an APPROVED FormulaProject for the product"
    error_id: ERR_PRODUCT_NOT_SOURCING
    http_status: 422
    applies_to: "PATCH /cost-quotes/{id}"
    note: "missing APPROVED formula reports ERR_FORMULA_NOT_APPROVED (same priority)"
  - priority: 13
    category: business_referential
    check: "POST /planogram-slots: product.status == LAUNCH_READY; PATCH /launch-plans/{id} status=APPROVED requires planogram_slot.status == COMMITTED"
    error_id: ERR_PRODUCT_NOT_LAUNCH_READY
    http_status: 422
    applies_to: "POST /planogram-slots, PATCH /launch-plans/{id}"
    note: "slot-not-committed at approve reports ERR_SLOT_NOT_COMMITTED (same priority)"
  - priority: 14
    category: business_referential
    check: "POST /discontinuation-reviews: successor_product_id when present must reference a LAUNCH_READY product different from product_id. (The gate product.status == LAUNCHED on the retired product is a cross-entity state precondition and reports ERR_INVALID_STATE at priority 7.)"
    error_id: ERR_SUCCESSOR_INVALID
    http_status: 422
    applies_to: "POST /discontinuation-reviews"
  - priority: 15
    category: business_temporal
    check: "Line-review clock gates: SUBMISSION_OPEN requires submission_window_start <= now < submission_window_end; REVIEWING requires now >= submission_window_end; DECIDED requires now >= review_date. PlanogramSlot creation additionally requires the review's status == SUBMISSION_OPEN (state) at a time inside the window."
    error_id: ERR_SUBMISSION_WINDOW_CLOSED
    http_status: 422
    applies_to: "PATCH /line-reviews/{id}, POST /planogram-slots"
  - priority: 16
    category: business_temporal
    check: "CostQuote accept requires now <= valid_until; a quote past valid_until lazily transitions to EXPIRED on any access"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 422
    applies_to: "PATCH /cost-quotes/{id}"
  - priority: 17
    category: business_temporal
    check: "PATCH /launch-plans/{id} status=EXECUTED requires now >= planogram_slot.occupancy_start"
    error_id: ERR_LAUNCH_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "PATCH /launch-plans/{id}"
  - priority: 18
    category: business_constraint
    check: "Uniqueness: concept name unique among non-KILLED concepts; at most one ComplianceDossier per product"
    error_id: ERR_DUPLICATE_CONCEPT_NAME
    http_status: 409
    applies_to: "POST /concepts, POST /compliance-dossiers"
    note: "dossier uniqueness reports ERR_DOSSIER_ALREADY_EXISTS (same priority)"
  - priority: 19
    category: business_constraint
    check: "Fixed price point membership: target_price_point_cents IN {300, 600, 1000, 1500, 2000}"
    error_id: ERR_INVALID_PRICE_POINT
    http_status: 422
    applies_to: "POST /concepts"
  - priority: 20
    category: business_constraint
    check: "Interval validity: submission_window_end > submission_window_start and review_date >= submission_window_end; occupancy_end >= occupancy_start"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /line-reviews, POST /planogram-slots"
  - priority: 21
    category: business_constraint
    check: "Temporal-overlap, half-open windows: per retail partner, non-CANCELLED LineReviews' [submission_window_start, submission_window_end) must not overlap; adjacency (start == other.end) is allowed"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /line-reviews"
  - priority: 22
    category: business_constraint
    check: "Temporal-overlap, closed-with-buffer occupancy: per (retail partner, category, position_code), slots with status IN {PROPOSED, COMMITTED, ACTIVE} must satisfy new.start > existing.end + RESET_GAP_DAYS (14 days) OR new.end < existing.start - RESET_GAP_DAYS; a gap of exactly 14 days is allowed"
    error_id: ERR_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "POST /planogram-slots"
  - priority: 23
    category: business_constraint
    check: "Category membership: slot category must be a key of the partner's category_capacities"
    error_id: ERR_UNKNOWN_CATEGORY
    http_status: 422
    applies_to: "POST /planogram-slots"
  - priority: 24
    category: business_constraint
    check: "CM availability: contract_manufacturer.status == ACTIVE on FormulaProject creation, CostQuote creation, and quote acceptance"
    error_id: ERR_CM_SUSPENDED
    http_status: 422
    applies_to: "POST /formula-projects, POST /cost-quotes, PATCH /cost-quotes/{id}"
  - priority: 25
    category: business_constraint
    check: "MOQ floors: quote initial_order_qty >= CM moq_units (at acceptance); launch qty_locked_units >= MOQ after clamp"
    error_id: ERR_BELOW_MOQ
    http_status: 422
    applies_to: "PATCH /cost-quotes/{id}, PATCH /launch-plans/{id}"
  - priority: 26
    category: business_constraint
    check: "Capacity: shelf committed_facings[category] + new facings <= category_capacities[category] at slot commit (equality allowed); CM quarterly slot availability at quote accept (count < capacity_slots_per_quarter); planogram lock requires zero PROPOSED slots"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "PATCH /planogram-slots/{id}, PATCH /cost-quotes/{id}, PATCH /retail-partners/{id}, PATCH /line-reviews/{id}"
    note: "planogram-lock failure reports ERR_UNRESOLVED_SLOTS (same priority); capacity-reduction that cannot evict enough reports ERR_CAPACITY_EXCEEDED"
  - priority: 27
    category: business_fiscal
    check: "Cost target: landed_provisional_cents <= concept.target_unit_cost_cents at quote acceptance (equality allowed)"
    error_id: ERR_COST_TARGET_EXCEEDED
    http_status: 422
    applies_to: "PATCH /cost-quotes/{id}"
  - priority: 28
    category: business_fiscal
    check: "Budgets: launch lock single-pass clamp must not fall below MOQ; at APPROVED sample_budget_cents <= marketing_budget_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "PATCH /launch-plans/{id}"
  - priority: 29
    category: business_fiscal
    check: "Sampling caps: COMMIT keeps samples_committed + samples_distributed + n <= floor(qty_locked_units * 0.10) and n <= retail_units_available; DISTRIBUTE keeps sample_spend_cents <= sample_budget_cents"
    error_id: ERR_SAMPLE_OVERDRAW
    http_status: 422
    applies_to: "POST /launch-plans/{id}/sample-distributions"
  - priority: 30
    category: business_referential
    check: "Segregation of duties: DiscontinuationReview approver/rejecter X-User-ID must differ from proposed_by_user_id. (Checked after role authorization; categorized referential because it relates two persisted identity fields. Priority placed last among business rules so state and safety errors surface first.)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "PATCH /discontinuation-reviews/{id}"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. All deadline/expiry/window rules read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["advances the logical clock; lazy transitions (quote EXPIRED, cert LAPSED) evaluate on subsequent reads/writes"]

  - method: POST
    path: "/trend-signals"
    description: "Register a trend signal identified from a social platform or a prestige launch"
    roles: [TrendScout]
    code: 201
    input: [source, platform, category, mention_velocity_7d, engagement_growth_pct, "prestige_similarity?", "cross_platform_spread?"]
    output: TrendSignal
    side_effects: []

  - method: GET
    path: "/trend-signals"
    description: "List trend signals with filters"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: ["status?", "source?", "category?", "limit?", "offset?"]
    output: TrendSignal[]
    side_effects: []

  - method: PATCH
    path: "/trend-signals/{id}"
    description: "Drive the trend lifecycle: status=EVALUATING (computes momentum_score) | PARKED | SELECTED (score gate) | ARCHIVED"
    roles: [TrendScout]
    code: 200
    input: ["status?"]
    output: TrendSignal
    side_effects: ["on entry to EVALUATING: compute momentum_score; on SELECTED: enforce score >= 70.0"]

  - method: POST
    path: "/concepts"
    description: "Pitch a concept fast-following a SELECTED trend"
    roles: [TrendScout]
    code: 201
    input: [trend_signal_id, name, category, target_price_point_cents]
    output: Concept
    side_effects: []

  - method: GET
    path: "/concepts"
    description: "List concepts with filters"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: ["trend_signal_id?", "status?", "category?", "limit?", "offset?"]
    output: Concept[]
    side_effects: []

  - method: GET
    path: "/concepts/{id}"
    description: "Read one concept"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: []
    output: Concept
    side_effects: []

  - method: PATCH
    path: "/concepts/{id}"
    description: "Concept lifecycle: status=SELECTED (computes target_unit_cost_cents) | KILLED"
    roles: [TrendScout]
    code: 200
    input: ["status?"]
    output: Concept
    side_effects: ["on SELECTED: compute target_unit_cost_cents from the fixed price point"]

  - method: POST
    path: "/products"
    description: "Commercialize a SELECTED concept into a product (computes tooling_reuse and packaging_lead_weeks)"
    roles: [ProductManager]
    code: 201
    input: [concept_id, sku_name, "tooling_code?"]
    output: Product
    side_effects: ["concept SELECTED -> IN_DEVELOPMENT", "computes tooling_reuse and packaging_lead_weeks"]

  - method: GET
    path: "/products"
    description: "List products with filters"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: ["concept_id?", "successor_product_id?", "status?", "tooling_code?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: GET
    path: "/products/{id}"
    description: "Read one product"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: PATCH
    path: "/products/{id}"
    description: "Product lifecycle: status=SOURCING | COMPLIANCE_GATE | LAUNCH_READY | FORMULATION (reformulation) | KILLED; packaging_status=PACK_READY. LAUNCHED/DISCONTINUED are cascade-only."
    roles: [ProductManager]
    code: 200
    input: ["status?", "packaging_status?"]
    output: Product
    side_effects: ["reformulation reverts ACCEPTED quotes to INVALIDATED and reopens APPROVED formula projects"]

  - method: POST
    path: "/manufacturers"
    description: "Onboard a contract manufacturer"
    roles: [SourcingLead]
    code: 201
    input: [name, capabilities, base_lead_time_weeks, moq_units, quality_tier, capacity_slots_per_quarter]
    output: ContractManufacturer
    side_effects: []

  - method: GET
    path: "/manufacturers/{id}"
    description: "Read one contract manufacturer"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: []
    output: ContractManufacturer
    side_effects: []

  - method: PATCH
    path: "/manufacturers/{id}"
    description: "Suspend/reactivate a CM or change capacity_slots_per_quarter"
    roles: [SourcingLead]
    code: 200
    input: ["status?", "capacity_slots_per_quarter?"]
    output: ContractManufacturer
    side_effects: ["SUSPENDED blocks new formula projects and cost quotes"]

  - method: POST
    path: "/formula-projects"
    description: "Open a compressed-timeline formula development project with a CM"
    roles: [SourcingLead]
    code: 201
    input: [product_id, contract_manufacturer_id, brief]
    output: FormulaProject
    side_effects: ["sets due_at := created_at + 6 weeks"]

  - method: GET
    path: "/formula-projects"
    description: "List formula projects with filters"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: ["product_id?", "contract_manufacturer_id?", "status?", "limit?", "offset?"]
    output: FormulaProject[]
    side_effects: []

  - method: GET
    path: "/formula-projects/{id}"
    description: "Read one formula project"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: []
    output: FormulaProject
    side_effects: []

  - method: PATCH
    path: "/formula-projects/{id}"
    description: "Formula lifecycle: status=SAMPLE_REVIEW | APPROVED | IN_DEVELOPMENT (reject; auto-ABANDONED at MAX_FORMULA_ROUNDS) | ABANDONED"
    roles: [SourcingLead, ManufacturerRep]
    code: 200
    input: ["status?"]
    output: FormulaProject
    side_effects: ["APPROVED sets formula_version := round_count", "rejection increments round_count; at the cap the project auto-transitions to ABANDONED"]

  - method: POST
    path: "/cost-quotes"
    description: "ManufacturerRep submits a cost quote (OCC on expected_product_version). Computes landed_provisional_cents; supersedes the same CM's prior SUBMITTED quote for the product."
    roles: [ManufacturerRep]
    code: 201
    input: [product_id, contract_manufacturer_id, unit_cost_cents, freight_total_cents, unit_weight_grams, shipment_weight_grams, duty_rate, initial_order_qty, valid_until, production_quarter, expected_product_version, "tooling_fee_cents?"]
    output: CostQuote
    side_effects: ["computes landed_provisional_cents", "same CM's prior SUBMITTED quote for this product -> SUPERSEDED", "increments Product.version by 1"]

  - method: GET
    path: "/cost-quotes"
    description: "List cost quotes with filters"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: ["product_id?", "contract_manufacturer_id?", "status?", "limit?", "offset?"]
    output: CostQuote[]
    side_effects: []

  - method: GET
    path: "/cost-quotes/{id}"
    description: "Read one cost quote"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: []
    output: CostQuote
    side_effects: []

  - method: PATCH
    path: "/cost-quotes/{id}"
    description: "Quote lifecycle: status=UNDER_EVALUATION | ACCEPTED | REJECTED (SourcingLead) | WITHDRAWN (ManufacturerRep, own CM only) | SETTLED with actuals (SourcingLead)"
    roles: [SourcingLead, ManufacturerRep]
    code: 200
    input: ["status?", "actual_qty?", "actual_freight_total_cents?"]
    output: CostQuote
    side_effects: ["ACCEPTED pins formula version, supersedes sibling quotes, consumes a CM quarterly capacity slot", "SETTLED computes landed_settled_cents"]

  - method: POST
    path: "/compliance-dossiers"
    description: "Open the compliance dossier for a product (ingredient/claim compliance, cruelty-free certification, regulatory registration). At most one per product."
    roles: [ComplianceOfficer]
    code: 201
    input: [product_id]
    output: ComplianceDossier
    side_effects: []

  - method: GET
    path: "/compliance-dossiers"
    description: "List compliance dossiers with filters"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: ["product_id?", "cert_status?", "limit?", "offset?"]
    output: ComplianceDossier[]
    side_effects: []

  - method: GET
    path: "/compliance-dossiers/{id}"
    description: "Read one compliance dossier (applies lazy cert LAPSED evaluation)"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: []
    output: ComplianceDossier
    side_effects: ["lazy cert_status CERTIFIED -> LAPSED when now > cert_expires_at"]

  - method: POST
    path: "/compliance-dossiers/{id}/reviews"
    description: "Advance exactly one compliance dimension. dimension=INGREDIENT outcomes {CLEARED, BLOCKED}; CLAIM {SUBSTANTIATED, BLOCKED}; CERTIFICATION {APPLIED, AUDITING, CERTIFIED, DENIED}; REGISTRATION {FILED, REGISTERED, REJECTED}."
    roles: [ComplianceOfficer]
    code: 200
    input: [dimension, outcome, "blocked_items?", "notes?"]
    output: ComplianceDossier
    side_effects: ["CERTIFIED sets cert_expires_at := now + 365 days", "DENIED triggers the product-reversion cascade"]

  - method: POST
    path: "/retail-partners"
    description: "Onboard a retail partner with per-category shelf facing capacities (the limited shelf footprint)"
    roles: [RetailPlanner]
    code: 201
    input: [name, banner_code, category_capacities]
    output: RetailPartner
    side_effects: []

  - method: GET
    path: "/retail-partners/{id}"
    description: "Read one retail partner including computed committed_facings / available_facings"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: []
    output: RetailPartner
    side_effects: []

  - method: PATCH
    path: "/retail-partners/{id}"
    description: "Update category_capacities; a reduction below committed facings triggers the capacity-eviction cascade (calculations.capacity_eviction)"
    roles: [RetailPlanner]
    code: 200
    input: ["category_capacities?"]
    output: RetailPartner
    side_effects: ["evicts newest COMMITTED slots (committed_at DESC, tie created_at DESC) until capacity fits; evicted slots revert their LaunchPlans to DRAFT; ACTIVE overflow rejects the whole PATCH"]

  - method: POST
    path: "/line-reviews"
    description: "Schedule a retail partner line review with a half-open submission window [start, end); windows of the same partner must not overlap"
    roles: [RetailPlanner]
    code: 201
    input: [retail_partner_id, season, submission_window_start, submission_window_end, review_date]
    output: LineReview
    side_effects: []

  - method: GET
    path: "/line-reviews"
    description: "List line reviews with filters"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: ["retail_partner_id?", "status?", "limit?", "offset?"]
    output: LineReview[]
    side_effects: []

  - method: GET
    path: "/line-reviews/{id}"
    description: "Read one line review"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: []
    output: LineReview
    side_effects: []

  - method: PATCH
    path: "/line-reviews/{id}"
    description: "Line review lifecycle: status=SUBMISSION_OPEN | REVIEWING | DECIDED | PLANOGRAM_LOCKED | CANCELLED (clock-gated)"
    roles: [RetailPlanner]
    code: 200
    input: ["status?"]
    output: LineReview
    side_effects: ["CANCELLED withdraws PROPOSED slots and releases COMMITTED slots (reverting their launch plans to DRAFT)"]

  - method: POST
    path: "/planogram-slots"
    description: "Propose a planogram slot during an open submission window (OCC on expected_line_review_version). Occupancy interval is CLOSED with a 14-day reset buffer per position."
    roles: [RetailPlanner]
    code: 201
    input: [line_review_id, product_id, category, position_code, facings, occupancy_start, occupancy_end, expected_line_review_version]
    output: PlanogramSlot
    side_effects: ["increments LineReview.version by 1"]

  - method: GET
    path: "/planogram-slots"
    description: "List planogram slots with filters"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: ["line_review_id?", "product_id?", "status?", "category?", "limit?", "offset?"]
    output: PlanogramSlot[]
    side_effects: []

  - method: GET
    path: "/planogram-slots/{id}"
    description: "Read one planogram slot"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: []
    output: PlanogramSlot
    side_effects: []

  - method: PATCH
    path: "/planogram-slots/{id}"
    description: "Slot lifecycle: status=COMMITTED (capacity-checked) | WITHDRAWN. ACTIVE/RELEASED/VACATED are cascade-only."
    roles: [RetailPlanner]
    code: 200
    input: ["status?"]
    output: PlanogramSlot
    side_effects: ["COMMITTED stamps committed_at and recomputes partner facing availability"]

  - method: POST
    path: "/launch-plans"
    description: "Create a launch plan; computes both quantity variants and markdown_risk_pct at creation"
    roles: [ProductManager]
    code: 201
    input: [product_id, planogram_slot_id, demand_forecast_units, marketing_budget_cents, cogs_budget_cents, "sample_budget_cents?"]
    output: LaunchPlan
    side_effects: ["computes qty_demand_variant_units, qty_risk_variant_units, capacity_units, markdown_risk_pct"]

  - method: GET
    path: "/launch-plans"
    description: "List launch plans with filters"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: ["product_id?", "planogram_slot_id?", "status?", "limit?", "offset?"]
    output: LaunchPlan[]
    side_effects: []

  - method: GET
    path: "/launch-plans/{id}"
    description: "Read one launch plan including sampling rollup"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: []
    output: LaunchPlan
    side_effects: []

  - method: PATCH
    path: "/launch-plans/{id}"
    description: "Plan lifecycle: status=QUANTITY_LOCKED (with variant) | APPROVED | EXECUTED | RECONCILED (ProductManager); sampling_status=PLANNED | ACTIVE | CLOSED (MarketingLead). Mixing both field groups in one call is forbidden (ERR_FORBIDDEN_ROLE)."
    roles: [ProductManager, MarketingLead]
    code: 200
    input: ["status?", "variant?", "sampling_status?", "sample_budget_cents?"]
    output: LaunchPlan
    side_effects: ["QUANTITY_LOCKED computes qty_locked_units and landed_locked_cents", "EXECUTED launches the product and activates the slot", "RECONCILED computes markdown_exposure_cents"]

  - method: POST
    path: "/launch-plans/{id}/sample-distributions"
    description: "Record a sampling event: event_type=COMMIT (reserve units) | DISTRIBUTE (fulfill committed, charges sample budget) | RELEASE (return committed units to retail availability)"
    roles: [MarketingLead]
    code: 201
    input: [event_type, units, "channel?"]
    output: LaunchPlan
    side_effects: ["mutates samples_committed / samples_distributed / sample_spend_cents per calculations.sampling_burn; conserves launch inventory"]

  - method: POST
    path: "/discontinuation-reviews"
    description: "Propose discontinuing a LAUNCHED product, optionally naming a LAUNCH_READY refresh successor (records proposed_by_user_id)"
    roles: [ProductManager]
    code: 201
    input: [product_id, reason, "successor_product_id?"]
    output: DiscontinuationReview
    side_effects: []

  - method: GET
    path: "/discontinuation-reviews"
    description: "List discontinuation reviews with filters"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: ["product_id?", "successor_product_id?", "status?", "limit?", "offset?"]
    output: DiscontinuationReview[]
    side_effects: []

  - method: GET
    path: "/discontinuation-reviews/{id}"
    description: "Read one discontinuation review"
    roles: [PlatformAdmin, TrendScout, ProductManager, SourcingLead, ComplianceOfficer, RetailPlanner, MarketingLead, ManufacturerRep]
    code: 200
    input: []
    output: DiscontinuationReview
    side_effects: []

  - method: PATCH
    path: "/discontinuation-reviews/{id}"
    description: "Approve (fires the discontinuation cascade) or reject. Approver X-User-ID must differ from proposed_by_user_id (segregation of duties)."
    roles: [RetailPlanner]
    code: 200
    input: ["status?"]
    output: DiscontinuationReview
    side_effects: ["APPROVED: product -> DISCONTINUED; its slots -> VACATED; partner facings recomputed; its EXECUTED launch plan -> RECONCILED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing, or role name unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed for this endpoint or this field group; or ManufacturerRep acting on another CM's resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, invalid enum member, or conditional-required field absent (prestige_similarity / cross_platform_spread); review outcome not in the dimension's outcome set" }
  - { id: ERR_TREND_SIGNAL_NOT_FOUND, http: 404, condition: "TrendSignal id does not resolve" }
  - { id: ERR_CONCEPT_NOT_FOUND, http: 404, condition: "Concept id does not resolve" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not resolve" }
  - { id: ERR_MANUFACTURER_NOT_FOUND, http: 404, condition: "ContractManufacturer id does not resolve" }
  - { id: ERR_FORMULA_PROJECT_NOT_FOUND, http: 404, condition: "FormulaProject id does not resolve" }
  - { id: ERR_COST_QUOTE_NOT_FOUND, http: 404, condition: "CostQuote id does not resolve" }
  - { id: ERR_DOSSIER_NOT_FOUND, http: 404, condition: "ComplianceDossier id does not resolve" }
  - { id: ERR_RETAIL_PARTNER_NOT_FOUND, http: 404, condition: "RetailPartner id does not resolve" }
  - { id: ERR_LINE_REVIEW_NOT_FOUND, http: 404, condition: "LineReview id does not resolve" }
  - { id: ERR_PLANOGRAM_SLOT_NOT_FOUND, http: 404, condition: "PlanogramSlot id does not resolve" }
  - { id: ERR_LAUNCH_PLAN_NOT_FOUND, http: 404, condition: "LaunchPlan id does not resolve" }
  - { id: ERR_DISCONTINUATION_REVIEW_NOT_FOUND, http: 404, condition: "DiscontinuationReview id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine from-state invalid for the requested transition (including terminal lockdown and cross-entity state preconditions without a domain-specific error)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_product_version / expected_line_review_version does not match the parent's current version (OCC)" }
  - { id: ERR_TREND_SCORE_BELOW_THRESHOLD, http: 422, condition: "Trend selection attempted with momentum_score < 70.0" }
  - { id: ERR_TREND_NOT_SELECTED, http: 422, condition: "POST /concepts referencing a trend not in SELECTED" }
  - { id: ERR_DUPLICATE_CONCEPT_NAME, http: 409, condition: "Concept name already used by a non-KILLED concept" }
  - { id: ERR_INVALID_PRICE_POINT, http: 422, condition: "target_price_point_cents not in {300, 600, 1000, 1500, 2000}" }
  - { id: ERR_CONCEPT_NOT_SELECTED, http: 422, condition: "POST /products referencing a concept not in SELECTED" }
  - { id: ERR_FORMULA_NOT_APPROVED, http: 422, condition: "Product advance to SOURCING or quote acceptance without an APPROVED FormulaProject" }
  - { id: ERR_QUOTE_NOT_ACCEPTED, http: 422, condition: "Product advance to COMPLIANCE_GATE or launch-plan quantity lock without an ACCEPTED CostQuote" }
  - { id: ERR_PRODUCT_NOT_SOURCING, http: 422, condition: "Quote acceptance while the product is not in SOURCING" }
  - { id: ERR_PRODUCT_NOT_LAUNCH_READY, http: 422, condition: "Planogram slot creation for a product not in LAUNCH_READY" }
  - { id: ERR_CM_SUSPENDED, http: 422, condition: "Formula project creation, quote creation, or quote acceptance against a SUSPENDED contract manufacturer" }
  - { id: ERR_QUOTE_EXPIRED, http: 422, condition: "Quote acceptance attempted after valid_until (quote lazily transitions to EXPIRED)" }
  - { id: ERR_BELOW_MOQ, http: 422, condition: "initial_order_qty below the CM's moq_units at acceptance, or locked quantity below MOQ after clamp" }
  - { id: ERR_COST_TARGET_EXCEEDED, http: 422, condition: "landed_provisional_cents > concept.target_unit_cost_cents at acceptance" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Shelf facing capacity exceeded at commit, CM quarterly slot capacity exhausted at accept, or capacity reduction blocked by ACTIVE slots" }
  - { id: ERR_DOSSIER_ALREADY_EXISTS, http: 409, condition: "Second ComplianceDossier for the same product" }
  - { id: ERR_COMPLIANCE_GATE_FAILED, http: 422, condition: "LAUNCH_READY or launch-plan approval without a fully compliant dossier (including a lazily LAPSED cert)" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Line review submission window overlaps another non-CANCELLED review of the same partner (half-open intervals; adjacency allowed)" }
  - { id: ERR_SUBMISSION_WINDOW_CLOSED, http: 422, condition: "Clock-gated line-review transition attempted outside its window; or slot creation while the review is not inside its submission window" }
  - { id: ERR_OCCUPANCY_CONFLICT, http: 409, condition: "Planogram slot occupancy (closed interval + 14-day reset buffer) collides with another slot on the same position" }
  - { id: ERR_UNRESOLVED_SLOTS, http: 422, condition: "PLANOGRAM_LOCKED attempted while PROPOSED slots remain on the review" }
  - { id: ERR_SLOT_NOT_COMMITTED, http: 422, condition: "Launch plan approval while its planogram slot is not COMMITTED" }
  - { id: ERR_LAUNCH_WINDOW_NOT_OPEN, http: 422, condition: "Launch plan EXECUTED before the slot's occupancy_start" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Single-pass budget clamp falls below MOQ at quantity lock, or sample_budget_cents > marketing_budget_cents at approval" }
  - { id: ERR_SAMPLE_OVERDRAW, http: 422, condition: "Sampling event would exceed the 10% unit cap, available retail units, or the sample budget" }
  - { id: ERR_SUCCESSOR_INVALID, http: 422, condition: "Discontinuation successor missing LAUNCH_READY status or equal to the retired product" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Discontinuation approver/rejecter X-User-ID equals proposed_by_user_id" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "submission_window_end <= start, review_date < window end, or occupancy_end < occupancy_start" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational superuser; drives the logical clock and reads everything"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: TrendScout
    description: "Spots trends on social platforms and prestige launches; pitches and selects concepts"
    identity: opaque
    exclusive_operations: ["POST /trend-signals", "PATCH /trend-signals/{id}", "POST /concepts", "PATCH /concepts/{id}"]
    shared_operations: ["all GET endpoints"]
  - name: ProductManager
    description: "Owns products, launch plans, and proposes discontinuations"
    identity: opaque
    exclusive_operations: ["POST /products", "PATCH /products/{id}", "POST /launch-plans", "PATCH /launch-plans/{id} (status/variant fields)", "POST /discontinuation-reviews"]
    shared_operations: ["all GET endpoints"]
  - name: SourcingLead
    description: "Owns contract manufacturers, formula projects, and cost-quote evaluation/acceptance"
    identity: opaque
    exclusive_operations: ["POST /manufacturers", "PATCH /manufacturers/{id}", "POST /formula-projects", "PATCH /formula-projects/{id} (all status targets)", "PATCH /cost-quotes/{id} (UNDER_EVALUATION/ACCEPTED/REJECTED/SETTLED)"]
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "Owns compliance dossiers: ingredient/claim reviews, cruelty-free certification, regulatory registration"
    identity: opaque
    exclusive_operations: ["POST /compliance-dossiers", "POST /compliance-dossiers/{id}/reviews"]
    shared_operations: ["all GET endpoints"]
  - name: RetailPlanner
    description: "Owns retail partners, line reviews, planogram slots; approves/rejects discontinuations (segregated from the proposing ProductManager)"
    identity: opaque
    exclusive_operations: ["POST /retail-partners", "PATCH /retail-partners/{id}", "POST /line-reviews", "PATCH /line-reviews/{id}", "POST /planogram-slots", "PATCH /planogram-slots/{id}", "PATCH /discontinuation-reviews/{id}"]
    shared_operations: ["all GET endpoints"]
  - name: MarketingLead
    description: "Owns the community & creator sampling program on launch plans"
    identity: opaque
    exclusive_operations: ["PATCH /launch-plans/{id} (sampling_status/sample_budget_cents fields)", "POST /launch-plans/{id}/sample-distributions"]
    shared_operations: ["all GET endpoints"]
  - name: ManufacturerRep
    description: "Portal user of a ContractManufacturer; submits and withdraws that CM's own quotes and submits that CM's formula samples"
    identity: "entity_backed:ContractManufacturer"
    exclusive_operations: ["POST /cost-quotes", "PATCH /cost-quotes/{id} (WITHDRAWN, own CM only)", "PATCH /formula-projects/{id} (SAMPLE_REVIEW, own CM only)"]
    shared_operations: ["all GET endpoints"]
