            - "TelehealthSession.${s1_id}.status == CANCELLED"
            - "School.${school_id}.telehealth_booked_minutes_total == 0 after the cancellation"
            - "exactly 1 TelehealthSession row is still returned by GET /sbhc/telehealth-sessions with school_id == ${school_id}"
            - "Visit.${tv_id}.clinical_status == SCHEDULED"
