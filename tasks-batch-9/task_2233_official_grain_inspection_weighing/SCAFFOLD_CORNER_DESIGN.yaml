          - "entities.Appeal.fields.effective_votes_count"
        distinguishing_aspect: "An APPEAL needs three EFFECTIVE votes: an abstention plus two real votes is still short of quorum, and once quorum is reached with 1 REVISE against 2 UPHOLD the appeal is UPHELD even though the regrade found a genuinely different grade, isolating the tally from the grade comparison."
