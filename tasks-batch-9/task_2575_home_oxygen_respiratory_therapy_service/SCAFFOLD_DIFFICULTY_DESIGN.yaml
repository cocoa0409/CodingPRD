# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2575 — Home Oxygen & Respiratory Therapy Service
#
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every literal in every `assert:` was computed by executing the corresponding
# calculations[].formula against its constants:.
#
# Shared conventions used by every setup chain below:
#   * The logical clock starts at exactly 2026-08-01T00:00:00Z (see
#     POST /home-oxygen/_clock/set_current_utc in §1.5); chains that do not call
#     the clock endpoint run entirely at that instant.
#   * Opaque X-User-ID values: u-mgr-1 (BranchManager), u-intake-1
#     (IntakeCoordinator), u-phys-1 (Physician), u-audit-1 (ComplianceAuditor),
#     u-rt-1 (RespiratoryTherapist), u-drv-1 (DeliveryDriver), u-bill-1
#     (BillingSpecialist). Segregation of duties holds because u-intake-1,
#     u-phys-1 and u-audit-1 are three distinct ids.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: cap_position_variant_divergence_bid_vs_fee_schedule
        grounds:
          - calculations.cap_month_position
          - calculations.cap_month_position.variants.service_month_basis
          - calculations.cap_month_position.variants.paid_month_basis
          - entities.RentalContract.fields.pricing_basis
          - entities.RentalContract.fields.posted_months
          - state_machines.RentalContract[state_field=billing_status].ACCRUING_to_CAP_REACHED
          - validations[priority=35]
          - endpoints[GET /home-oxygen/rental-contracts/{contract_id}/cap-summary]
        distinguishing_aspect: |
          This instance's two variants live in the RentalContract cost-accounting domain: over the
          identical posted-month ledger ["2026-08"] and the identical candidate month 2026-10 the
          service_month_basis variant returns cap position 3 while the paid_month_basis variant
          returns 2, so the competitive-bid contract reaches CAP_REACHED and the fee-schedule
          contract stays ACCRUING and can still bill November.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL, competitive-bidding area, not liquid certified, refill capacity 4, 30-minute turnaround buffer)."
            - "Four IN_STOCK units at that branch: SC-1001 and SC-1002 (STATIONARY_CONCENTRATOR, 5.0 LPM) and PC-2001 and PC-2002 (PORTABLE_CONCENTRATOR, 3.0 LPM); SC-1001 and PC-2001 carry the later next_pm_due_date so the equipment_selection tie-break picks them first."
            - "Two ACTIVE patients at that branch, each with a GROUP_I qualifying study (SpO2 87%) and an ACTIVE certificate prescribing 3.0 LPM, 24 h/day, portable indicated, lifetime length of need, all three narrative elements (documentation_score 100.00)."
            - "Patient A holds contract A with pricing_basis COMPETITIVE_BID_SINGLE_PAYMENT; patient B holds contract B with pricing_basis FEE_SCHEDULE_ADJUSTED. Both have cap_month_limit 3."
            - "Each contract has a PRIMARY_STATIONARY and a PORTABLE placement, both PLACED after a passing in-home setup on 2026-08-01, so first_service_month is 2026-08 for both; monthly_allowable_cents is 6913 for A and 8502 for B."
            - "Both contracts have posted service month 2026-08 and nothing else. The clock has been advanced to 2026-10-15T00:00:00Z, so 2026-09 was skipped by both."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              as_user_id: "u-mgr-1"
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_stat_a: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "PC-2001", model_code: "POC-3L", equipment_class: "PORTABLE_CONCENTRATOR", max_continuous_lpm: 3.0, max_pulse_setting: 5, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_port_a: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1002", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-05-01" }
              as: BranchManager
              captures: { u_stat_b: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "PC-2002", model_code: "POC-3L", equipment_class: "PORTABLE_CONCENTRATOR", max_continuous_lpm: 3.0, max_pulse_setting: 5, pm_interval_days: 365, next_pm_due_date: "2027-05-01" }
              as: BranchManager
              captures: { u_port_b: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0001", full_name: "Ada Reyes", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "ACTIVE_AMBULATORY", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_a_id: $.data.id, p_a_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_a_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_a_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_a_id}", qualifying_test_id: "${qt_a_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: true, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_a_ver}" }
              as: IntakeCoordinator
              captures: { cmn_a_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_a_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_a_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_a_id}", cmn_id: "${cmn_a_id}", pricing_basis: "COMPETITIVE_BID_SINGLE_PAYMENT", cap_month_limit: 3 }
              as: BillingSpecialist
              captures: { c_a_id: $.data.id }
            - call: "POST /home-oxygen/rental-contracts/${c_a_id}/equipment-assignments"
              payload: { role: "PRIMARY_STATIONARY" }
              as: RespiratoryTherapist
              captures: { pl_a_stat: $.data.id }
            - call: "POST /home-oxygen/rental-contracts/${c_a_id}/equipment-assignments"
              payload: { role: "PORTABLE" }
              as: RespiratoryTherapist
              captures: { pl_a_port: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0002", full_name: "Ben Okafor", branch_id: "${br_id}", payer_type: "MEDICARE_NON_BID", mobility_profile: "ACTIVE_AMBULATORY", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_b_id: $.data.id, p_b_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_b_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_b_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_b_id}", qualifying_test_id: "${qt_b_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: true, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_b_ver}" }
              as: IntakeCoordinator
              captures: { cmn_b_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_b_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_b_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_b_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_b_id}", cmn_id: "${cmn_b_id}", pricing_basis: "FEE_SCHEDULE_ADJUSTED", cap_month_limit: 3 }
              as: BillingSpecialist
              captures: { c_b_id: $.data.id }
            - call: "POST /home-oxygen/rental-contracts/${c_b_id}/equipment-assignments"
              payload: { role: "PRIMARY_STATIONARY" }
              as: RespiratoryTherapist
              captures: { pl_b_stat: $.data.id }
            - call: "POST /home-oxygen/rental-contracts/${c_b_id}/equipment-assignments"
              payload: { role: "PORTABLE" }
              as: RespiratoryTherapist
              captures: { pl_b_port: $.data.id }
            - call: "POST /home-oxygen/delivery-routes"
              payload: { branch_id: "${br_id}", service_date: "2026-08-01", driver_user_id: "u-drv-1", shift_start_utc: "2026-08-01T12:00:00Z", shift_end_utc: "2026-08-01T22:00:00Z" }
              as: BranchManager
              captures: { r_id: $.data.id }
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "${r_id}", contract_id: "${c_a_id}", stop_type: "SETUP_DELIVERY", window_start_utc: "2026-08-01T13:00:00Z", window_end_utc: "2026-08-01T14:00:00Z", service_minutes: 60, cylinders_requested: 2 }
              as: BranchManager
              captures: { s_a_id: $.data.id }
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "${r_id}", contract_id: "${c_b_id}", stop_type: "SETUP_DELIVERY", window_start_utc: "2026-08-01T14:30:00Z", window_end_utc: "2026-08-01T15:30:00Z", service_minutes: 60, cylinders_requested: 2 }
              as: BranchManager
              captures: { s_b_id: $.data.id }
            - call: "POST /home-oxygen/delivery-routes/${r_id}/lock"
              payload: {}
              as: BranchManager
            - call: "POST /home-oxygen/delivery-routes/${r_id}/dispatch"
              payload: {}
              as: BranchManager
            - call: "POST /home-oxygen/route-stops/${s_a_id}/complete-setup"
              payload: { smoking_in_home: false, electrical_pass: true, patient_teachback_score: 5, education_topics_covered: ["EQUIPMENT_OPERATION", "FIRE_SAFETY", "EMERGENCY_CONTACT"] }
              as: RespiratoryTherapist
              as_user_id: "u-rt-1"
            - call: "POST /home-oxygen/route-stops/${s_b_id}/complete-setup"
              payload: { smoking_in_home: false, electrical_pass: true, patient_teachback_score: 5, education_topics_covered: ["EQUIPMENT_OPERATION", "FIRE_SAFETY", "EMERGENCY_CONTACT"] }
              as: RespiratoryTherapist
              as_user_id: "u-rt-1"
            - call: "POST /home-oxygen/rental-contracts/${c_a_id}/billing-months"
              payload: { service_month: "2026-08" }
              as: BillingSpecialist
            - call: "POST /home-oxygen/rental-contracts/${c_b_id}/billing-months"
              payload: { service_month: "2026-08" }
              as: BillingSpecialist
            - call: "POST /home-oxygen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: BranchManager
          trigger:
            - call: "POST /home-oxygen/rental-contracts/${c_a_id}/billing-months"
              payload: { service_month: "2026-10" }
              as: BillingSpecialist
            - call: "POST /home-oxygen/rental-contracts/${c_b_id}/billing-months"
              payload: { service_month: "2026-10" }
              as: BillingSpecialist
            - call: "GET /home-oxygen/rental-contracts/${c_a_id}/cap-summary"
              payload: {}
              as: BillingSpecialist
            - call: "GET /home-oxygen/rental-contracts/${c_b_id}/cap-summary"
              payload: {}
              as: BillingSpecialist
            - call: "POST /home-oxygen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: BranchManager
            - call: "POST /home-oxygen/rental-contracts/${c_a_id}/billing-months"
              payload: { service_month: "2026-11" }
              as: BillingSpecialist
            - call: "POST /home-oxygen/rental-contracts/${c_b_id}/billing-months"
              payload: { service_month: "2026-11" }
              as: BillingSpecialist
          assert:
            - "cap-summary for ${c_a_id}: service_month_basis_position == 3 AND paid_month_basis_position == 2 AND variant_applied == SERVICE_MONTH_BASIS AND effective_position == 3 AND months_remaining == 0"
            - "cap-summary for ${c_b_id}: service_month_basis_position == 3 AND paid_month_basis_position == 2 AND variant_applied == PAID_MONTH_BASIS AND effective_position == 2 AND months_remaining == 1"
            - "The two contracts' cap-summary responses carry identical service_month_basis_position (3) and identical paid_month_basis_position (2), and differ only in effective_position (3 vs 2) — the divergence is the variant, not the data."
            - "RentalContract.${c_a_id}.billing_status == CAP_REACHED after posting 2026-10"
            - "RentalContract.${c_b_id}.billing_status == ACCRUING after posting 2026-10"
            - "RentalContract.${c_a_id}.monthly_allowable_cents == 6913 AND RentalContract.${c_a_id}.lifetime_paid_cents == 13826 AND RentalContract.${c_a_id}.posted_month_count == 2"
            - "RentalContract.${c_b_id}.monthly_allowable_cents == 8502 AND RentalContract.${c_b_id}.lifetime_paid_cents == 17004 AND RentalContract.${c_b_id}.posted_month_count == 2"
            - "POST /home-oxygen/rental-contracts/${c_a_id}/billing-months with service_month 2026-11 -> 409 ERR_CONTRACT_BILLING_SUSPENDED (contract A is already CAP_REACHED) and RentalContract.${c_a_id}.posted_month_count stays 2"
            - "POST /home-oxygen/rental-contracts/${c_b_id}/billing-months with service_month 2026-11 -> 200, RentalContract.${c_b_id}.billing_status == CAP_REACHED, posted_month_count == 3, lifetime_paid_cents == 25506"
            - "RentalContract.${c_a_id}.last_posted_service_month == \"2026-10\" AND RentalContract.${c_b_id}.last_posted_service_month == \"2026-11\""

      - name: patient_risk_variant_divergence_initial_vs_surveillance
        grounds:
          - calculations.oxygen_safety_risk_score
          - calculations.oxygen_safety_risk_score.variants.INITIAL_ASSESSMENT
          - calculations.oxygen_safety_risk_score.variants.ONGOING_SURVEILLANCE
          - entities.Patient.fields.oxygen_safety_risk_score
          - entities.Patient.fields.risk_variant_applied
          - entities.Patient.fields.compliance_hold
          - endpoints[GET /home-oxygen/patients/{patient_id}/risk-assessment]
          - endpoints[POST /home-oxygen/placements/{placement_id}/malfunction]
        distinguishing_aspect: |
          This instance's two variants live in the Patient clinical-risk domain (a different entity
          domain from the RentalContract cost-accounting instance above): over the single factor
          vector (smoking 0, electrical 100, teachback 60, flow 60, incident 30) the
          INITIAL_ASSESSMENT weighted average returns 45.00 while the ONGOING_SURVEILLANCE
          worst-factor-plus-escalation rule returns 100.00, a 55.00-point delta that flips
          compliance_hold.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) and one IN_STOCK STATIONARY_CONCENTRATOR rated 10.0 LPM."
            - "One ACTIVE patient with a GROUP_I study and an ACTIVE certificate prescribing 7.0 LPM (flow band 6.0 < 7.0 <= 9.0 -> factor_flow 60), 24 h/day, portable NOT prescribed, lifetime need, all three narrative elements (documentation_score 100.00)."
            - "The contract's single PRIMARY_STATIONARY placement is PLACED after an in-home setup recorded with smoking_in_home false, electrical_pass FALSE (factor_electrical 100) and patient_teachback_score 2 (factor_teachback (5-2)*20 = 60), so the persisted score is the INITIAL_ASSESSMENT value 42.00 at that point (incident factor still 0)."
            - "Exactly one TIER_3 malfunction report (symptom LEAK, oxygen_gap_minutes 5) has been filed, so RentalContract.malfunction_count is 1 (factor_incident 30) and the placement stays PLACED."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1010", model_code: "CONC-10L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 10.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_stat: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0010", full_name: "Cora Vance", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 85, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 7.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_id}", cmn_id: "${cmn_id}", pricing_basis: "COMPETITIVE_BID_SINGLE_PAYMENT", cap_month_limit: 36 }
              as: BillingSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/equipment-assignments"
              payload: { role: "PRIMARY_STATIONARY" }
              as: RespiratoryTherapist
              captures: { pl_id: $.data.id }
            - call: "POST /home-oxygen/delivery-routes"
              payload: { branch_id: "${br_id}", service_date: "2026-08-01", driver_user_id: "u-drv-1", shift_start_utc: "2026-08-01T12:00:00Z", shift_end_utc: "2026-08-01T22:00:00Z" }
              as: BranchManager
              captures: { r_id: $.data.id }
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "${r_id}", contract_id: "${c_id}", stop_type: "SETUP_DELIVERY", window_start_utc: "2026-08-01T13:00:00Z", window_end_utc: "2026-08-01T14:00:00Z", service_minutes: 60, cylinders_requested: 0 }
              as: BranchManager
              captures: { s_id: $.data.id }
            - call: "POST /home-oxygen/delivery-routes/${r_id}/lock"
              payload: {}
              as: BranchManager
            - call: "POST /home-oxygen/delivery-routes/${r_id}/dispatch"
              payload: {}
              as: BranchManager
            - call: "POST /home-oxygen/route-stops/${s_id}/complete-setup"
              payload: { smoking_in_home: false, electrical_pass: false, patient_teachback_score: 2, education_topics_covered: ["EQUIPMENT_OPERATION"] }
              as: RespiratoryTherapist
              as_user_id: "u-rt-1"
            - call: "POST /home-oxygen/placements/${pl_id}/malfunction"
              payload: { symptom: "LEAK", oxygen_gap_minutes: 5 }
              as: RespiratoryTherapist
              as_user_id: "u-rt-1"
          trigger:
            - call: "GET /home-oxygen/patients/${p_id}/risk-assessment"
              payload: {}
              as: RespiratoryTherapist
          assert:
            - "risk-assessment factor vector: factor_smoking == 0, factor_electrical == 100, factor_teachback == 60, factor_flow == 60, factor_incident == 30"
            - "risk-assessment initial_assessment_score == 45.00"
            - "risk-assessment ongoing_surveillance_score == 100.00"
            - "ongoing_surveillance_score - initial_assessment_score == 55.00 over one identical factor vector"
            - "risk-assessment persisted_variant == ONGOING_SURVEILLANCE AND persisted_score == 100.00 AND compliance_hold == true"
            - "Patient.${p_id}.oxygen_safety_risk_score == 100.00 AND Patient.${p_id}.risk_variant_applied == ONGOING_SURVEILLANCE AND Patient.${p_id}.compliance_hold == true"
            - "Immediately after complete-setup and before the malfunction, Patient.${p_id}.oxygen_safety_risk_score was 42.00 with risk_variant_applied == INITIAL_ASSESSMENT and compliance_hold == false"
            - "Placement.${pl_id}.status == PLACED AND Placement.${pl_id}.last_severity_tier == TIER_3 AND RentalContract.${c_id}.malfunction_count == 1 AND RentalContract.${c_id}.cumulative_oxygen_gap_minutes == 5"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: monthly_allowable_per_line_rounding_order_fee_schedule
        grounds:
          - calculations.monthly_allowable_cents
          - calculations.monthly_allowable_cents.constants.CLASS_BASE_CENTS
          - calculations.monthly_allowable_cents.constants.ROLE_FACTOR
          - calculations.monthly_allowable_cents.constants.BASIS_FACTOR
          - calculations.monthly_allowable_cents.constants.SEQUESTRATION_FACTOR
          - state_machines.RentalContract[state_field=service_status].PENDING_SETUP_to_IN_SERVICE
          - entities.RentalContract.fields.monthly_allowable_cents
        distinguishing_aspect: |
          Mode (b): the two-line FEE_SCHEDULE_ADJUSTED contract must total exactly 8502 cents because
          each line is rounded to whole cents BEFORE the sum (6875 + 1627); an implementation that
          sums at full precision and rounds once (6875.2488 + 1627.4615 = 8502.7103) returns 8503,
          so a single cent distinguishes the pinned nesting from the natural one.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) holding two IN_STOCK units: SC-1001 (STATIONARY_CONCENTRATOR, 5.0 LPM) and PC-2001 (PORTABLE_CONCENTRATOR, 3.0 LPM)."
            - "One ACTIVE patient (ACTIVE_AMBULATORY, altitude 500 ft) with a GROUP_I study (SpO2 87%) and an ACTIVE certificate prescribing 3.0 LPM, 24 h/day, portable indicated, lifetime need, three narrative elements."
            - "One RentalContract with pricing_basis FEE_SCHEDULE_ADJUSTED (BASIS_FACTOR 0.9050) and cap_month_limit 36, carrying a PRIMARY_STATIONARY placement (ROLE_FACTOR 1.00) and a PORTABLE placement (ROLE_FACTOR 0.25), both still RESERVED."
