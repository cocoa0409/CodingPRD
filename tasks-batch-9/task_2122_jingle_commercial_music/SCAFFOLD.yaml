  - id: ERR_DEMO_NOT_FOUND
    http: 404
    condition: "Demo id in the path or body does not resolve"
  - id: ERR_MUSICIAN_NOT_FOUND
    http: 404
    condition: "Musician id in the path or body does not resolve"
  - id: ERR_STUDIO_ROOM_NOT_FOUND
    http: 404
    condition: "studio_room_id in the body does not resolve"
  - id: ERR_SESSION_CALL_NOT_FOUND
    http: 404
    condition: "SessionCall id in the path does not resolve"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "MusicianBooking id in the path does not resolve"
  - id: ERR_LICENSE_DEAL_NOT_FOUND
    http: 404
    condition: "LicenseDeal id in the path does not resolve"
  - id: ERR_DELIVERABLE_NOT_FOUND
    http: 404
    condition: "Deliverable id in the path does not resolve"
  - id: ERR_CUE_ENTRY_NOT_FOUND
