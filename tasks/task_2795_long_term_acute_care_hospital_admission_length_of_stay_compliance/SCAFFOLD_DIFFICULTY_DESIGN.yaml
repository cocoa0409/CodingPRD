  - rule_id: boundary_precision_check
    instances:
      - name: sso_threshold_at_25_days_versus_26_days
        grounds:
          - calculations.covered_los_days
          - calculations.stay_payment_determination
          - calculations.discharge_payment_percentage
        distinguishing_aspect: |
          The boundary is the FLOORED short-stay threshold floor(5/6 * 30) = 25, tested at exactly 25
          (inclusive - the SSO branch fires) and at 26 (one day past - the full-DRG branch fires). One
          extra day multiplies the payment by 2.5x, so an off-by-one in the comparison or a threshold
          computed as round(25.0) instead of floor is caught by a single pair of rows.
        test_recipe:
          setup:
            - "OPEN period FY2027, ACTIVE criteria set CS-2026A, DRG 207 loaded (alos 30 -> SSO threshold 25), clock left at the default 2026-08-01T00:00:00Z."
            - "Patient Eve Edge admitted backdated 2026-07-07 -> covered LOS exactly 25; patient Finn Over admitted backdated 2026-07-06 -> covered LOS 26. Both are PMV-track STANDARD stays discharged with estimated cost 2,400,000c and no weaning plan."
