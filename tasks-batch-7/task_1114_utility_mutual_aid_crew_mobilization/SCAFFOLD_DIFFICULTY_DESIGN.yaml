            - { call: "POST /mutual-aid/safety-briefings", payload: { crew_id: "${crew_id}", event_id: "${ev_id}", conductor_operator_ref: "OFF-1", host_rules_version: "HR-2026.1", topics: ["grounding"] }, as: HostSafetyOfficer, as_user_id: "${host_id}", captures: { brf_id: "$.data.id" } }
