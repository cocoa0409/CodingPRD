# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3325_wholesale_broker_channel_pricing_engine_broker_compliance
#
# Breadth probe over the nine claim-extraction-guide sections. Claims already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:`
# stubs with no test_recipe. The first instance below defines the shared YAML
# anchors (`*k_clock`, `*k_broker`, `*k_lic`, `*k_fin`, `*k_fin_pass`, `*k_pe`,
# `*k_pe_app`, `*k_plan`, `*k_approve`, `*k_sheet`, `*k_quote`, `*k_submit`,
# `*k_uw`, `*k_cond`, `*k_ctc`, `*k_fund`) that every later instance splices in.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: funding_response_reflects_every_derived_broker_field_immediately
        claim_type: Consistent read after write
        grounds:
          - complexity_profile.consistency_model
          - calculations.funded_volume_rollup
          - calculations.active_loan_count_derivation
          - entities.Broker.fields.rolling_funded_volume_cents
          - endpoints.POST_/wholesale-channel/loan-submissions/{id}/fund
        distinguishing_aspect: "Immediate consistency: the funding response itself already carries status FUNDED and the broker's rolling_funded_volume_cents incremented to 40000000, so no second read is needed to observe the rolled-up volume."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database. Broker B is APPROVED with a TX licence, a PASSED financial review, an APPROVED CONVENTIONAL eligibility, an active plan, a PUBLISHED sheet and one quote; a loan has been submitted and cleared to close."
          setup_api_calls:
            - &k_clock
              call: "POST /wholesale-channel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_broker
              call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Corner Anchor Wholesale LLC", nmls_id: "NMLS-3325900", home_state: "TX", volume_expectation_cents: 100000000 }
              as: ChannelManager
              captures: { b: $.data.id }
            - &k_lic
              call: "POST /wholesale-channel/brokers/${b}/licenses"
              payload: { state_code: "TX", license_number: "TX-MB-3325-900", license_type: "MORTGAGE_BROKER", expires_on: "2027-12-31T00:00:00Z" }
              as: ChannelManager
              captures: { lic: $.data.id }
            - &k_fin
              call: "POST /wholesale-channel/brokers/${b}/financial-reviews"
              payload: { net_worth_cents: 100000000, liquidity_cents: 40000000, total_liabilities_cents: 0, years_in_business: 4, prior_year_funded_volume_cents: 100000000, audit_attested: true }
              as: ChannelManager
              captures: { fr: $.data.id }
            - &k_fin_pass
              call: "POST /wholesale-channel/financial-reviews/${fr}/decision"
              payload: { outcome: "PASSED" }
              as: ChannelManager
              captures: { b_v_fr: $.data.version }
            - &k_pe
              call: "POST /wholesale-channel/brokers/${b}/product-eligibilities"
              payload: { product_code: "CONVENTIONAL", max_ltv: 0.9500, min_fico: 620, max_loan_amount_cents: 200000000 }
              as: ChannelManager
              captures: { pe: $.data.id, b_v_pe: $.data.version }
            - &k_pe_app
              call: "POST /wholesale-channel/product-eligibilities/${pe}/decision"
              payload: { outcome: "APPROVED", expected_broker_version: "${b_v_pe}" }
              as: ChannelManager
              captures: { b_v_elig: $.data.version }
            - &k_plan
              call: "POST /wholesale-channel/compensation-plans"
              payload: { broker_id: "${b}", plan_code: "PLAN_A", default_election: "LENDER_PAID", lender_paid_amount_cents: 250000, borrower_paid_amount_cents: 300000, is_active: true }
              as: ChannelManager
              captures: { plan: $.data.id }
            - &k_approve
              call: "POST /wholesale-channel/brokers/${b}/approve"
              payload: {}
              as: ChannelManager
              captures: { b_v_appr: $.data.version }
            - &k_sheet
              call: "POST /wholesale-channel/brokers/${b}/rate-sheets"
              payload: { product_code: "CONVENTIONAL", base_rate_pct: 6.125, adjustment_table: [{ dim: "credit", bucket: "760-plus", adjust_pct: -0.125 }, { dim: "ltv", bucket: "up-to-60", adjust_pct: 0.000 }, { dim: "occupancy", bucket: "PRIMARY_RESIDENCE", adjust_pct: 0.000 }, { dim: "product", bucket: "CONVENTIONAL", adjust_pct: 0.000 }] }
              as: ChannelManager
              captures: { rs: $.data.id, rs_v: $.data.version }
            - &k_quote
              call: "POST /wholesale-channel/rate-sheets/${rs}/pricing-quotes"
              payload: { representative_fico: 780, ltv_ratio: 0.5500, occupancy_type: "PRIMARY_RESIDENCE", loan_amount_cents: 40000000, lock_period_days: 30, loan_purpose: "PURCHASE", expected_rate_sheet_version: "${rs_v}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { q: $.data.id }
            - &k_submit
              call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b}", pricing_quote_id: "${q}", borrower_name: "Corner Anchor Borrower", property_state: "TX", loan_amount_cents: 40000000, lock_expires_at: "2027-01-01T00:00:00Z", compensation_election: "LENDER_PAID", comp_plan_id: "${plan}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { l: $.data.id, b_v_sub: $.data.version }
            - &k_uw
              call: "POST /wholesale-channel/loan-submissions/${l}/underwrite"
              payload: { expected_broker_version: "${b_v_sub}" }
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b_v_uw: $.data.version }
            - &k_cond
              call: "POST /wholesale-channel/underwriting-decisions"
              payload: { loan_submission_id: "${l}", decision_type: "CONDITIONAL", conditions: ["final title commitment"], decision_notes: "conditional approval" }
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b_v_cond: $.data.version }
            - &k_ctc
              call: "POST /wholesale-channel/loan-submissions/${l}/clear-to-close"
              payload: {}
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b_v_ctc: $.data.version }
          trigger:
            - &k_fund
              call: "POST /wholesale-channel/loan-submissions/${l}/fund"
              payload: {}
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b_v_fund: $.data.version }
          assert:
            - "the funding response status is 200 and its data.status == FUNDED"
            - "the same response data.rolling_funded_volume_cents == 40000000"
            - "the same response data.active_loan_count == 0, because FUNDED is not an active status"
            - "the same response data.broker_id == ${b}"
            - "GET /wholesale-channel/brokers/${b} agrees: rolling_funded_volume_cents == 40000000"

  # ===========================================================================
  - section: entities
    instances:

      - name: broker_create_returns_every_declared_field_and_starts_submitted
        claim_type: Creation
        grounds:
          - entities.Broker
          - endpoints.POST_/wholesale-channel/brokers
          - state_machines.Broker.initial_state
        distinguishing_aspect: "A brokerage created with only the four declared input fields comes back 201 in SUBMITTED with version 1 and the full derived baseline, and status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Fresh Submission Brokers Inc", nmls_id: "NMLS-3325901", home_state: "NV", volume_expectation_cents: 50000000 }
              as: ChannelManager
              captures: { b901: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Broker.${b901}.status == SUBMITTED and Broker.${b901}.version == 1"
            - "Broker.${b901}.tier == UNRATED and financial_strength_score == 0.00"
            - "Broker.${b901}.rolling_quality_score == 100.00 and open_defect_tier == 0 and exclusivity_status == CLEAR"
            - "Broker.${b901}.rolling_funded_volume_cents == 0 and active_loan_count == 0 and total_active_compensation_commitment_cents == 0"
            - "Broker.${b901}.licensed_states == [] and approved_product_codes == []"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: pricing_quote_is_immutable_with_no_version_and_no_update_route
        claim_type: Immutability
        grounds:
          - entities.PricingQuote.common_fields
          - endpoints.POST_/wholesale-channel/rate-sheets/{id}/pricing-quotes
          - endpoints.GET_/wholesale-channel/pricing-quotes/{id}
        distinguishing_aspect: "PricingQuote declares common_fields: false, so the snapshot carries id and created_at but no version and no updated_at, and repricing the broker's sheet leaves every stored figure exactly as priced — the immutability is observable without any update route existing."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a PUBLISHED sheet."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_approve
            - *k_sheet
            - call: "POST /wholesale-channel/rate-sheets/${rs}/pricing-quotes"
              payload: { representative_fico: 780, ltv_ratio: 0.5500, occupancy_type: "PRIMARY_RESIDENCE", loan_amount_cents: 40000000, lock_period_days: 30, loan_purpose: "PURCHASE", expected_rate_sheet_version: "${rs_v}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { q902: $.data.id, q902_rate: $.data.note_rate_pct, q902_pts: $.data.price_points }
          trigger:
            - call: "POST /wholesale-channel/brokers/${b}/rate-sheets"
              payload: { product_code: "CONVENTIONAL", base_rate_pct: 6.500, adjustment_table: [{ dim: "credit", bucket: "760-plus", adjust_pct: -0.125 }, { dim: "ltv", bucket: "up-to-60", adjust_pct: 0.000 }, { dim: "occupancy", bucket: "PRIMARY_RESIDENCE", adjust_pct: 0.000 }, { dim: "product", bucket: "CONVENTIONAL", adjust_pct: 0.000 }] }
              as: ChannelManager
              captures: { rs902b: $.data.id }
            - call: "GET /wholesale-channel/pricing-quotes/${q902}"
              payload: {}
              as: Any
          assert:
            - "the quote response carries id and created_at and no version field"
            - "the quote response has no updated_at field"
            - "GET after the reprice returns note_rate_pct == 6.000 and price_points == -1.375, identical to the captured q902_rate and q902_pts"
            - "GET after the reprice returns is_repriced == true while rate_sheet_id is still ${rs}"
            - "the replacement sheet ${rs902b} has publish_sequence 2 and the original sheet ${rs} is SUPERSEDED"

      - name: rate_sheet_get_returns_the_stored_adjustment_table_unchanged
        claim_type: Retrieval
        grounds:
          - entities.RateSheet.fields.adjustment_table
          - endpoints.GET_/wholesale-channel/rate-sheets/{id}
        distinguishing_aspect: "The four-row adjustment_table round-trips through the single-sheet read in the exact order it was posted, including the signed VA product row at -0.125."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_approve
          trigger:
            - call: "POST /wholesale-channel/brokers/${b}/rate-sheets"
              payload: { product_code: "VA", base_rate_pct: 5.875, adjustment_table: [{ dim: "credit", bucket: "720-739", adjust_pct: 0.000 }, { dim: "ltv", bucket: "80-90", adjust_pct: 0.250 }, { dim: "occupancy", bucket: "SECOND_HOME", adjust_pct: 0.250 }, { dim: "product", bucket: "VA", adjust_pct: -0.125 }] }
              as: ChannelManager
              captures: { rs903: $.data.id }
            - call: "GET /wholesale-channel/rate-sheets/${rs903}"
              payload: {}
              as: Any
          assert:
            - "RateSheet.${rs903}.product_code == VA and base_rate_pct == 5.875"
            - "RateSheet.${rs903}.status == PUBLISHED and publish_sequence == 1"
            - "RateSheet.${rs903}.adjustment_table has 4 rows with dims credit, ltv, occupancy, product in that order"
            - "RateSheet.${rs903}.adjustment_table[3].bucket == \"VA\" and adjust_pct == -0.125"
            - "RateSheet.${rs903}.superseded_by_sheet_id is null"

      - name: broker_list_filters_and_paginates_with_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/wholesale-channel/brokers
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three brokers on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and the status filter narrows the set without changing the page arithmetic."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Three brokers submitted, one of them approved."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_approve
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Second Listing Brokers LLC", nmls_id: "NMLS-3325904", home_state: "NV", volume_expectation_cents: 50000000 }
              as: ChannelManager
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Third Listing Brokers LP", nmls_id: "NMLS-3325905", home_state: "CA", volume_expectation_cents: 50000000 }
              as: ChannelManager
          trigger:
            - call: "GET /wholesale-channel/brokers"
              payload: { limit: 2, offset: 0 }
              as: Any
            - call: "GET /wholesale-channel/brokers"
              payload: { limit: 2, offset: 2 }
              as: Any
            - call: "GET /wholesale-channel/brokers"
              payload: { status: "SUBMITTED" }
              as: Any
          assert:
            - "the first page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "the second page returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /wholesale-channel/brokers?status=SUBMITTED returns exactly 2 rows"
            - "GET /wholesale-channel/brokers with no parameters applies limit 10 and offset 0 and returns 3 rows"
            - "GET /wholesale-channel/brokers?home_state=CA returns exactly 1 row"

      - name: loan_submission_get_with_unknown_id_returns_loan_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/wholesale-channel/loan-submissions/{id}
          - errors.ERR_LOAN_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on the loan path segment yields the entity-specific 404 ERR_LOAN_NOT_FOUND, not a generic identifier and not a 400."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. No loan has been created."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /wholesale-channel/loan-submissions/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: Any
              captures: { error_id_nf: $.data.error_id }
          assert:
            - "the response status is 404 and error_id_nf == ERR_LOAN_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"
            - "error_id_nf != ERR_INVALID_REQUEST"

      - name: loan_submission_create_missing_lock_expires_at_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.LoanSubmission.fields.lock_expires_at
          - validations[priority=29]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "lock_expires_at is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check rather than the 403 exclusivity or 422 licensing checks that run later."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a quote on file."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_approve
            - *k_sheet
            - *k_quote
          trigger:
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b}", pricing_quote_id: "${q}", borrower_name: "Omission Borrower", property_state: "TX", loan_amount_cents: 40000000, compensation_election: "LENDER_PAID", comp_plan_id: "${plan}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { error_id_missing: $.data.error_id }
          assert:
            - "the response status is 400 and error_id_missing == ERR_INVALID_REQUEST"
            - "error_id_missing != ERR_PROPERTY_STATE_NOT_LICENSED"
            - "GET /wholesale-channel/loan-submissions?broker_id=${b} returns 0 rows"

      - name: financial_review_audit_attested_defaults_to_false
        claim_type: Defaults
        grounds:
          - entities.FinancialReview.fields.audit_attested
          - entities.FinancialReview.fields.status
          - validations[priority=9]
        distinguishing_aspect: "Omitting audit_attested stores false rather than null, and that default is what makes the later PASSED decision fail with ERR_FINANCIAL_REVIEW_PENDING even though the computed score is well above the tier floor."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B submitted with an unexpired TX licence."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
          trigger:
            - call: "POST /wholesale-channel/brokers/${b}/financial-reviews"
              payload: { net_worth_cents: 100000000, liquidity_cents: 40000000, total_liabilities_cents: 0, years_in_business: 5, prior_year_funded_volume_cents: 100000000 }
              as: ChannelManager
              captures: { fr906: $.data.id }
            - call: "POST /wholesale-channel/financial-reviews/${fr906}/decision"
              payload: { outcome: "PASSED" }
              as: ChannelManager
              captures: { error_id_unattested: $.data.error_id }
          assert:
            - "FinancialReview.${fr906}.audit_attested == false, not null"
            - "FinancialReview.${fr906}.computed_financial_strength_score == 78.00"
            - "the decision returns 409 and error_id_unattested == ERR_FINANCIAL_REVIEW_PENDING"
            - "FinancialReview.${fr906}.status is still PENDING and is_current == false"

      - name: broker_create_ignores_client_supplied_status_and_version
        claim_type: System Fields
        grounds:
          - entities.Broker.fields.status
          - endpoints.POST_/wholesale-channel/brokers
          - state_machines.Broker.initial_state
        distinguishing_aspect: "status is source: system, so a client that posts status APPROVED still receives SUBMITTED with version 1 — the field is server-owned and the input is discarded rather than rejected."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Ignored Input Brokers Inc", nmls_id: "NMLS-3325907", home_state: "TX", volume_expectation_cents: 50000000 }
              as: ChannelManager
              captures: { b907: $.data.id }
          assert:
            - "the response status is 201 and Broker.${b907}.status == SUBMITTED"
            - "Broker.${b907}.version == 1 and only one Broker row exists for nmls_id NMLS-3325907"
            - "the response id is a bare UUID with no type prefix"

      - name: exclusivity_policy_create_with_out_of_enum_restriction_scope_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.ExclusivityPolicy.fields.restriction_scope
          - validations[priority=29]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "restriction_scope is a closed enum of LOAN_SUBMISSION, RATE_LOCK and ALL; a value such as SUBMISSION_ONLY is rejected at priority 29 with 400 ERR_INVALID_REQUEST rather than silently defaulting to LOAN_SUBMISSION."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved."
          setup_api_calls:
            - *k_clock
            - *k_broker
          trigger:
            - call: "POST /wholesale-channel/exclusivity-policies"
              payload: { broker_id: "${b}", competitor_identifier: "COMP-BETA", competitor_name: "Beta Lending Group", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", status: "ACTIVE", restriction_scope: "SUBMISSION_ONLY" }
              as: ChannelManager
              captures: { error_id_enum: $.data.error_id }
          assert:
            - "the response status is 400 and error_id_enum == ERR_INVALID_REQUEST"
            - "GET /wholesale-channel/brokers/${b}/exclusivity-policies returns 0 rows"

      - name: compensation_plan_deactivation_must_leave_one_active_plan
        claim_type: Parent Relationships
        grounds:
          - entities.CompensationPlan.fields.is_active
          - state_machines.CompensationPlan.transitions.ACTIVE_to_INACTIVE
          - errors.ERR_LAST_ACTIVE_COMPENSATION_PLAN
        distinguishing_aspect: "The broker is the parent of its plans, and the plan toggle is rejected when it would leave the parent without an ACTIVE plan, so the broker's own active-plan count gates the child write."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a single ACTIVE PLAN_A."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_plan
          trigger:
            - call: "PUT /wholesale-channel/compensation-plans/${plan}"
              payload: { is_active: false }
              as: ChannelManager
              captures: { error_id_last: $.data.error_id }
            - call: "POST /wholesale-channel/compensation-plans"
              payload: { broker_id: "${b}", plan_code: "PLAN_B", default_election: "BORROWER_PAID", lender_paid_amount_cents: 200000, borrower_paid_amount_cents: 350000, is_active: true }
              as: ChannelManager
              captures: { plan908: $.data.id }
            - call: "PUT /wholesale-channel/compensation-plans/${plan}"
              payload: { is_active: false }
              as: ChannelManager
              captures: { plan_status: $.data.is_active }
          assert:
            - "the first toggle returns 409 and error_id_last == ERR_LAST_ACTIVE_COMPENSATION_PLAN"
            - "GET /wholesale-channel/brokers/${b}/compensation-plans?is_active=true returns exactly 1 row at that point"
            - "after PLAN_B exists the same toggle returns 200 and plan_status == false"
            - "GET /wholesale-channel/brokers/${b}/compensation-plans?is_active=true still returns exactly 1 row"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: broker_approve_from_already_approved_returns_broker_not_submitted
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Broker.transitions.SUBMITTED_to_APPROVED
          - errors.ERR_BROKER_NOT_SUBMITTED
          - validations[priority=6]
        distinguishing_aspect: "APPROVED is not the from-state of any approval transition, so a second approve is rejected with ERR_BROKER_NOT_SUBMITTED and fires no side effect."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B fully approved."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_approve
          trigger:
            - call: "POST /wholesale-channel/brokers/${b}/approve"
              payload: {}
              as: ChannelManager
              captures: { error_id_reapprove: $.data.error_id, b_v_reapprove: $.data.version }
          assert:
            - "the response status is 409 and error_id_reapprove == ERR_BROKER_NOT_SUBMITTED"
            - "GET /wholesale-channel/brokers/${b} reports status APPROVED with version == ${b_v_appr}, unchanged by the rejected call"
            - "Broker.${b}.tier == TIER_2 and was not recomputed a second time"

      - name: expired_license_cannot_be_revoked_and_financial_review_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.BrokerLicense.transitions.ACTIVE_to_EXPIRED
          - state_machines.FinancialReview.terminal_states
          - errors.ERR_LICENSE_NOT_REVOCABLE
          - errors.ERR_REVIEW_ALREADY_DECIDED
        distinguishing_aspect: "Two terminal rows refuse further work: an EXPIRED licence cannot be revoked, and a PASSED financial review cannot be re-decided, so neither terminal state has an outgoing transition."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B submitted with a licence expiring 2026-10-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - call: "POST /wholesale-channel/financial-reviews/${fr}/decision"
              payload: { outcome: "PASSED" }
              as: ChannelManager
              captures: { b_v_fr2: $.data.version }
            - call: "POST /wholesale-channel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wholesale-channel/brokers/${b}/licenses/${lic}/revoke"
              payload: {}
              as: ComplianceOfficer
              captures: { error_id_expired: $.data.error_id }
            - call: "POST /wholesale-channel/financial-reviews/${fr}/decision"
              payload: { outcome: "FAILED" }
              as: ChannelManager
              captures: { error_id_decided: $.data.error_id }
          assert:
            - "GET /wholesale-channel/brokers/${b}/licenses?status=EXPIRED returns exactly 1 row and ?status=ACTIVE returns 0 rows"
            - "the revoke returns 409 and error_id_expired == ERR_LICENSE_NOT_REVOCABLE"
            - "the second decision returns 409 and error_id_decided == ERR_REVIEW_ALREADY_DECIDED"
            - "Broker.${b}.financial_strength_score == 78.00 and is unchanged by the rejected FAILED decision"

      - name: underwrite_is_not_idempotent_and_second_call_rejects
        claim_type: Idempotency
        grounds:
          - state_machines.LoanSubmission.transitions.SUBMITTED_to_UNDERWRITING
          - errors.ERR_LOAN_NOT_SUBMITTED
          - validations[priority=19]
        distinguishing_aspect: "The underwriting trigger is not idempotent: the first call moves SUBMITTED to UNDERWRITING, so repeating it observes a changed state field and is rejected with ERR_LOAN_NOT_SUBMITTED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a submitted loan carrying an elected plan."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_pe
            - *k_pe_app
            - *k_plan
            - *k_approve
            - *k_sheet
            - *k_quote
            - *k_submit
          trigger:
            - call: "POST /wholesale-channel/loan-submissions/${l}/underwrite"
              payload: { expected_broker_version: "${b_v_sub}" }
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b_v_uw2: $.data.version }
            - call: "POST /wholesale-channel/loan-submissions/${l}/underwrite"
              payload: { expected_broker_version: "${b_v_uw2}" }
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { error_id_twice: $.data.error_id }
          assert:
            - "the first underwrite returns 200 and LoanSubmission.${l}.status == UNDERWRITING"
            - "the second underwrite returns 409 and error_id_twice == ERR_LOAN_NOT_SUBMITTED"
            - "LoanSubmission.${l}.status is still UNDERWRITING and underwriting_due_at was not re-stamped"

      - name: cleared_loan_takes_escalation_path_when_any_escalation_exists
        claim_type: Side Effect Execution
        grounds:
          - state_machines.LoanSubmission.transitions.CONDITIONAL_APPROVAL_to_CLEAR_TO_CLOSE
          - entities.LoanSubmission.fields.closing_path
          - endpoints.GET_/wholesale-channel/closing-pipeline
        distinguishing_aspect: "The clear-to-close side effect stamps closing_path from whether any escalation exists at that instant, so a loan cleared after a resolved underwriting escalation reports ESCALATION_PATH while a clean one reports STANDARD_PATH."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a loan cleared to close in the standard path."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_pe
            - *k_pe_app
            - *k_plan
            - *k_approve
            - *k_sheet
            - *k_quote
            - *k_submit
            - *k_uw
            - *k_cond
          trigger:
            - call: "POST /wholesale-channel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /wholesale-channel/loan-submissions/${l}/turn-time-escalations"
              payload: {}
              as: Any
              captures: { esc: "$.data[0].id" }
            - call: "POST /wholesale-channel/turn-time-escalations/${esc}/resolve"
              payload: { resolution_note: "underwriting backlog cleared within policy" }
              as: ChannelManager
            - call: "POST /wholesale-channel/loan-submissions/${l}/clear-to-close"
              payload: {}
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b_v_ctc2: $.data.version }
            - call: "GET /wholesale-channel/closing-pipeline"
              payload: { broker_id: "${b}" }
              as: Any
          assert:
            - "the escalated read before resolution returns exactly 1 row with stage UNDERWRITING and status OPEN"
            - "LoanSubmission.${l}.status == CLEAR_TO_CLOSE and closing_path == ESCALATION_PATH"
            - "the closing-pipeline read reports escalated_count == 1 and standard_count == 0"
            - "escalated_loan_ids contains ${l} and standard_loan_ids does not"
            - "LoanSubmission.${l}.closing_due_at == cleared_at + 7 days"

      - name: error_product_not_eligible_on_create_loan
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_PRODUCT_NOT_ELIGIBLE
          - validations[priority=14]
          - entities.ProductEligibility.fields.max_ltv
        distinguishing_aspect: "Covered as the failure path of a cross-entity-state-dependency §1.8 instance only for the state gate; the LTV bound specifically is asserted here."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / repurchase_requires_qc_review_state_not_loan_state
          rationale: "The eligible-product gate is exercised as a precondition inside the named §1.8 instances; the distinct max_ltv boundary is asserted in the calculations-section corner instead."

  # ===========================================================================
  - section: errors
    instances:

      - name: suspended_status_gate_precedes_unlicensed_state_on_submission
        claim_type: violation_to_error
        grounds:
          - errors.ERR_BROKER_NOT_APPROVED
          - errors.ERR_PROPERTY_STATE_NOT_LICENSED
          - validations[priority=16]
          - validations[priority=13]
        distinguishing_aspect: "A request that violates both the state gate (broker not APPROVED) and the safety gate (property state not licensed) answers the priority-16 state error, so the business_constraint category outscores business_safety here."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved and licensed only in TX, with a quote on file, no PASSED-review gap and no open defects."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_pe
            - *k_pe_app
            - *k_plan
            - *k_approve
            - *k_sheet
            - *k_quote
            - call: "POST /wholesale-channel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesale-channel/brokers/${b}/licenses/${lic}/revoke"
              payload: {}
              as: ComplianceOfficer
              captures: { b_v_revoked: $.data.version }
            - call: "POST /wholesale-channel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b}", pricing_quote_id: "${q}", borrower_name: "Suspended Gate Borrower", property_state: "TX", loan_amount_cents: 40000000, lock_expires_at: "2027-01-01T00:00:00Z", compensation_election: "LENDER_PAID", comp_plan_id: "${plan}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { error_id_state_first: $.data.error_id }
          assert:
            - "the revocation left Broker.${b}.status == SUSPENDED with suspended_reason LICENSE_REVOKED"
            - "Broker.${b}.licensed_states == []"
            - "the response status is 403 and error_id_state_first == ERR_BROKER_NOT_APPROVED"
            - "error_id_state_first != ERR_PROPERTY_STATE_NOT_LICENSED, ruling out the business_safety category"
            - "GET /wholesale-channel/loan-submissions?broker_id=${b} returns 0 rows"

      - name: duplicate_nmls_id_is_rejected_on_the_second_submission
        claim_type: violation_to_error
        grounds:
          - errors.ERR_DUPLICATE_NMLS_ID
          - validations[priority=30]
          - entities.Broker.fields.nmls_id
        distinguishing_aspect: "The nmls_id uniqueness constraint fires on the second submission only, so the first 201 and the second 409 together prove the constraint is broker-scoped and not per-request."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One broker already submitted with NMLS-3325911."
          setup_api_calls:
            - *k_clock
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Unique NMLS Brokers Inc", nmls_id: "NMLS-3325911", home_state: "TX", volume_expectation_cents: 50000000 }
              as: ChannelManager
              captures: { b911: $.data.id }
          trigger:
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Duplicate NMLS Brokers LLC", nmls_id: "NMLS-3325911", home_state: "NV", volume_expectation_cents: 50000000 }
              as: ChannelManager
              captures: { error_id_dup: $.data.error_id }
          assert:
            - "the second submission returns 409 and error_id_dup == ERR_DUPLICATE_NMLS_ID"
            - "GET /wholesale-channel/brokers?limit=100 returns exactly 1 row"
            - "Broker.${b911}.legal_name is still \"Unique NMLS Brokers Inc\" and was not overwritten"

      - name: compensation_plan_mismatch_rejected_when_default_disagrees
        claim_type: violation_to_error
        grounds:
          - errors.ERR_COMPENSATION_PLAN_MISMATCH
          - validations[priority=17]
          - calculations.compensation_split
        distinguishing_aspect: "The plan-level consistency requirement rejects an election whose value disagrees with the plan's default_election, so the same plan cannot back both a LENDER_PAID and a BORROWER_PAID loan."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a LENDER_PAID-defaulted PLAN_A and a quote on file."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_pe
            - *k_pe_app
            - *k_plan
            - *k_approve
            - *k_sheet
            - *k_quote
          trigger:
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b}", pricing_quote_id: "${q}", borrower_name: "Mismatch Borrower", property_state: "TX", loan_amount_cents: 40000000, lock_expires_at: "2027-01-01T00:00:00Z", compensation_election: "BORROWER_PAID", comp_plan_id: "${plan}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { error_id_mismatch: $.data.error_id }
          assert:
            - "the response status is 422 and error_id_mismatch == ERR_COMPENSATION_PLAN_MISMATCH"
            - "GET /wholesale-channel/loan-submissions?broker_id=${b} returns 0 rows"
            - "Broker.${b}.total_active_compensation_commitment_cents == 0"

      - name: error_exclusivity_blocked_on_approval
        claim_type: violation_to_error
        grounds:
          - errors.ERR_BROKER_EXCLUSIVITY_BLOCKED
        distinguishing_aspect: "The BLOCKED posture gate on approval is already asserted as the chosen error in the errors-section priority-conflict corner."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / license_expiry_between_eligibility_and_state_gate
          rationale: "The named §1.8 instance exercises the compliance-versus-fiscal ordering on the same approve endpoint; recording the identifier here would duplicate the same call."

      - name: error_broker_resource_forbidden_on_foreign_broker
        claim_type: violation_to_error
        grounds:
          - errors.ERR_BROKER_RESOURCE_FORBIDDEN
          - validations[priority=31]
          - roles.BrokerUser.identity
        distinguishing_aspect: "Ownership is enforced by comparing the acting X-User-ID to the broker_id in the body, so a second brokerage's portal user cannot submit against the first brokerage's quote."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a quote on file; Broker B2 also submitted."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_pe
            - *k_pe_app
            - *k_plan
            - *k_approve
            - *k_sheet
            - *k_quote
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Foreign Portal Brokers LLC", nmls_id: "NMLS-3325918", home_state: "TX", volume_expectation_cents: 50000000 }
              as: ChannelManager
              captures: { b918: $.data.id }
          trigger:
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b}", pricing_quote_id: "${q}", borrower_name: "Foreign Portal Borrower", property_state: "TX", loan_amount_cents: 40000000, lock_expires_at: "2027-01-01T00:00:00Z", compensation_election: "LENDER_PAID", comp_plan_id: "${plan}" }
              as: BrokerUser
              as_user_id: "${b918}"
              captures: { error_id_foreign: $.data.error_id }
          assert:
            - "the response status is 403 and error_id_foreign == ERR_BROKER_RESOURCE_FORBIDDEN"
            - "GET /wholesale-channel/loan-submissions?broker_id=${b} returns 0 rows and ?broker_id=${b918} returns 0 rows"
            - "Broker.${b}.active_loan_count == 0"

  # ===========================================================================
  - section: calculations
    instances:

      - name: va_second_home_quote_prices_from_known_inputs
        claim_type: Correct Result
        grounds:
          - calculations.overall_rate_adjustment
          - calculations.pricing_quote_note_rate
          - calculations.pricing_quote_price_points
          - entities.PricingQuote.fields.note_rate_pct
        distinguishing_aspect: "A fully pinned VA second-home scenario at fico 720 / LTV 0.8500 / 45-day lock yields overall 0.375, note rate 6.250, a BRONZE provisional tier and price points 0.875, all four derived from the four-dimension sum plus the provisional-tier discount."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a PUBLISHED VA sheet whose table carries the four rows used below."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_approve
          trigger:
            - call: "POST /wholesale-channel/brokers/${b}/rate-sheets"
              payload: { product_code: "VA", base_rate_pct: 5.875, adjustment_table: [{ dim: "credit", bucket: "720-739", adjust_pct: 0.000 }, { dim: "ltv", bucket: "80-90", adjust_pct: 0.250 }, { dim: "occupancy", bucket: "SECOND_HOME", adjust_pct: 0.250 }, { dim: "product", bucket: "VA", adjust_pct: -0.125 }] }
              as: ChannelManager
              captures: { rs920: $.data.id, rs920_v: $.data.version }
            - call: "POST /wholesale-channel/rate-sheets/${rs920}/pricing-quotes"
              payload: { representative_fico: 720, ltv_ratio: 0.8500, occupancy_type: "SECOND_HOME", loan_amount_cents: 40000000, lock_period_days: 45, loan_purpose: "PURCHASE", expected_rate_sheet_version: "${rs920_v}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { q920: $.data.id }
          assert:
            - "PricingQuote.${q920}.overall_adjustment_pct == 0.375"
            - "PricingQuote.${q920}.lock_adjustment_pct == 0.000"
            - "PricingQuote.${q920}.note_rate_pct == 6.250"
            - "PricingQuote.${q920}.price_points == 0.875"
            - "PricingQuote.${q920}.adjustment_trace[2].bucket == \"SECOND_HOME\" and adjustment_trace[3].bucket == \"VA\" with adjust_pct == -0.125"
            - "PricingQuote.${q920}.price_points != 0.625, ruling out skipping the BRONZE tier discount"

      - name: funded_volume_cohort_excludes_withdrawn_and_denied_loans
        claim_type: Input Set Filtering
        grounds:
          - calculations.funded_volume_rollup
          - entities.Broker.fields.rolling_funded_volume_cents
          - entities.LoanSubmission.fields.status
        distinguishing_aspect: "The rollup cohort admits only FUNDED and REPURCHASED loans, so a withdrawn loan of 90000000 cents contributes exactly zero to rolling_funded_volume_cents even though it was submitted with that amount."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with one quote; a withdrawn loan of 90000000 cents and a funded loan of 40000000 cents."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_pe
            - *k_pe_app
            - *k_plan
            - &k_plan_borrower
              call: "POST /wholesale-channel/compensation-plans"
              payload: { broker_id: "${b}", plan_code: "PLAN_B", default_election: "BORROWER_PAID", lender_paid_amount_cents: 200000, borrower_paid_amount_cents: 350000, is_active: true }
              as: ChannelManager
              captures: { plan2: $.data.id }
            - *k_approve
            - *k_sheet
            - *k_quote
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b}", pricing_quote_id: "${q}", borrower_name: "Withdrawn Cohort Borrower", property_state: "TX", loan_amount_cents: 90000000, lock_expires_at: "2027-01-01T00:00:00Z", compensation_election: "BORROWER_PAID", comp_plan_id: "${plan2}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { l_withdrawn: $.data.id }
            - call: "POST /wholesale-channel/loan-submissions/${l_withdrawn}/withdraw"
              payload: {}
              as: BrokerUser
              as_user_id: "${b}"
          trigger:
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b}", pricing_quote_id: "${q}", borrower_name: "Funded Cohort Borrower", property_state: "TX", loan_amount_cents: 40000000, lock_expires_at: "2027-01-01T00:00:00Z", compensation_election: "LENDER_PAID", comp_plan_id: "${plan}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { l_funded: $.data.id, b_v_sub920: $.data.version }
            - call: "POST /wholesale-channel/loan-submissions/${l_funded}/underwrite"
              payload: { expected_broker_version: "${b_v_sub920}" }
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b_v_uw920: $.data.version }
            - call: "POST /wholesale-channel/underwriting-decisions"
              payload: { loan_submission_id: "${l_funded}", decision_type: "CONDITIONAL", conditions: ["final HOA cert"], decision_notes: "ok" }
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b_v_cond920: $.data.version }
            - call: "POST /wholesale-channel/loan-submissions/${l_funded}/clear-to-close"
              payload: {}
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b_v_ctc920: $.data.version }
            - call: "POST /wholesale-channel/loan-submissions/${l_funded}/fund"
              payload: {}
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b_v_fund920: $.data.version }
          assert:
            - "LoanSubmission.${l_withdrawn}.status == WITHDRAWN and LoanSubmission.${l_funded}.status == FUNDED"
            - "Broker.${b}.rolling_funded_volume_cents == 40000000"
            - "Broker.${b}.rolling_funded_volume_cents != 130000000"
            - "Broker.${b}.active_loan_count == 0"

      - name: repurchase_exposure_scales_with_the_volume_baseline
        claim_type: Constants Applied
        grounds:
          - calculations.repurchase_exposure
          - calculations.repurchase_exposure.constants.ORIGINATION_FEE_SHARE
          - entities.LoanSubmission.fields.repurchase_exposure_cents
        distinguishing_aspect: "With a 30000000-cent loan against a 30000000-cent baseline the pair share is exactly 15000000 and the exposure 30000000, showing the fee share constant and the (v*f)/(v+f) term both feed the single rounded total."
        test_recipe:
          setup:
