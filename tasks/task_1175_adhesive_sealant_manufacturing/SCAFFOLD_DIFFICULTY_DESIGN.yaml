        grounds:
          - state_machines.ProductionLot.qa_UNDER_REVIEW_to_RELEASED
          - state_machines.Formulation.EFFECTIVE_to_WITHDRAWN
          - errors[ERR_FORMULATION_NOT_EFFECTIVE]
        distinguishing_aspect: |
          Pair ProductionLot -> Formulation: the lot's own qa_status is
          UNDER_REVIEW with a passing FULL test, yet release is rejected
          because the referenced Formulation moved EFFECTIVE -> WITHDRAWN after
          the batch reached PACKED (so the withdraw guard passes).
        test_recipe:
          setup:
            - "Formulation EFFECTIVE; batch of exactly 948 ml fully packed (remaining 0 -> PACKED); lot UNDER_REVIEW with an ACCEPTED passing FULL test; formulation then WITHDRAWN"
