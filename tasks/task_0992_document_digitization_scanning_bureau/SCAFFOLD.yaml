    path: "/clients/{id}/suspend"
    description: "Suspend a client (blocks all client-subtree mutations and grant usage)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Client
    side_effects: ["status = SUSPENDED"]
  - method: POST
    path: "/clients/{id}/reactivate"
    description: "Reactivate a suspended client"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Client
    side_effects: ["status = ACTIVE"]
  - method: POST
    path: "/clients/{id}/service-agreements"
    description: "Create the client's service agreement (at most one ACTIVE agreement per client)"
    roles: [PlatformAdmin]
    code: 201
    input: [price_tier, rush_multiplier, storage_free_days, storage_daily_rate_cents, retention_days, max_boxes_per_batch]
    output: ServiceAgreement
    side_effects: []
  - method: GET
    path: "/clients/{id}/service-agreements"
    description: "List service agreements of a client"
    roles: [PlatformAdmin, BillingClerk, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceAgreement[]"
    side_effects: []
  - method: GET
    path: "/service-agreements/{id}"
    description: "Get a service agreement"
    roles: [PlatformAdmin, BillingClerk, ComplianceOfficer]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: []
  - method: GET
    path: "/clients/{id}/batches"
    description: "List batches of a client"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Batch[]"
    side_effects: []
  - method: GET
    path: "/clients/{id}/access-grants"
    description: "List access grants of a client"
    roles: [PlatformAdmin, ComplianceOfficer, ClientUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AccessGrant[]"
    side_effects: []
  - method: POST
    path: "/clients/{id}/access-grants"
    description: "Grant client access to a batch's documents (vault_only computed server-side)"
    roles: [ClientUser]
    code: 201
    input: [batch_id, scope, expires_at]
    output: AccessGrant
    side_effects: ["vault_only = client.hipaa_covered AND any document in batch has contains_phi=true"]
  - method: GET
    path: "/clients/{id}/invoices"
    description: "List invoices of a client"
    roles: [PlatformAdmin, BillingClerk, ClientUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  # --- batches ---
  - method: POST
    path: "/batches"
    description: "Create a batch (RUSH admission capacity enforced; auto-creates DRAFT Invoice)"
    roles: [IntakeClerk]
    code: 201
    input: [client_id, priority]
    output: Batch
    side_effects:
      - "status = INTAKE"
      - "rush_capacity_window admission check when priority == RUSH"
      - "Invoice auto-created in DRAFT linked to this batch"
  - method: GET
    path: "/batches"
    description: "List batches (filterable by client_id, status)"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: "Batch[]"
    side_effects: []
  - method: GET
    path: "/batches/{id}"
    description: "Get a batch (includes computed scanned_pages, billable_scanned_pages, projected_storage_fee_cents, disposition_at)"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: []
    output: Batch
    side_effects: []
  - method: POST
    path: "/batches/{id}/start-prep"
    description: "INTAKE -> PREPPING"
    roles: [IntakeClerk]
    code: 200
    input: []
    output: Batch
    side_effects: ["increments Batch.version by 1"]
  - method: POST
    path: "/batches/{id}/start-scan"
    description: "PREPPING -> SCANNING"
    roles: [ScanOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["increments Batch.version by 1"]
  - method: POST
    path: "/batches/{id}/submit-qa"
    description: "SCANNING -> QA"
    roles: [ScanOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["increments Batch.version by 1"]
  - method: POST
    path: "/batches/{id}/pass-qa"
    description: "QA -> INDEXING"
    roles: [QAReviewer]
    code: 200
    input: []
    output: Batch
    side_effects: ["increments Batch.version by 1"]
  - method: POST
    path: "/batches/{id}/fail-qa"
    description: "QA -> SCANNING (cyclic rework)"
    roles: [QAReviewer]
    code: 200
    input: []
    output: Batch
    side_effects: ["QA_FAILED documents -> SCANNED", "rework_cycle_count += 1", "increments Batch.version by 1"]
  - method: POST
    path: "/batches/{id}/deliver"
    description: "INDEXING -> DELIVERED; delivers INDEXED documents, locks final pricing, stamps delivered_at/disposition_at"
    roles: [QAReviewer]
    code: 200
    input: []
    output: Batch
    side_effects: ["per Batch state machine", "increments Batch.version by 1"]
  - method: POST
    path: "/batches/{id}/close"
    description: "DISPOSITION_PENDING -> CLOSED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Batch
    side_effects: ["increments Batch.version by 1"]
  - method: GET
    path: "/batches/{id}/boxes"
    description: "List boxes of a batch"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Box[]"
    side_effects: []
  - method: GET
    path: "/batches/{id}/documents"
    description: "List documents of a batch (filterable by status, box_id)"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: ["status?", "box_id?", "limit?", "offset?"]
    output: "Document[]"
    side_effects: []
  - method: GET
    path: "/batches/{id}/index-records"
    description: "List index records of a batch"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "IndexRecord[]"
    side_effects: []
  - method: GET
    path: "/batches/{id}/scan-sessions"
    description: "List scan sessions of a batch"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ScanSession[]"
    side_effects: []
  - method: GET
    path: "/batches/{id}/page-logs"
    description: "List page logs of a batch (all sessions)"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "PageLog[]"
    side_effects: []
  - method: GET
    path: "/batches/{id}/access-grants"
    description: "List access grants referencing a batch"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "AccessGrant[]"
    side_effects: []
  - method: GET
    path: "/batches/{id}/destruction-certificates"
    description: "List destruction certificates of a batch"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "DestructionCertificate[]"
    side_effects: []
  - method: GET
    path: "/batches/{id}/invoices"
    description: "List invoices of a batch (0 or 1 entries)"
    roles: [PlatformAdmin, BillingClerk, ClientUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []
  - method: POST
    path: "/batches/{id}/qa-reviews"
    description: "Mark a document QA_FAILED (batch SCANNING or QA)"
    roles: [QAReviewer]
    code: 201
    input: [document_id]
    output: Document
    side_effects: ["Document SCANNED -> QA_FAILED"]

  # --- boxes ---
  - method: POST
    path: "/batches/{id}/boxes"
    description: "Intake a box into a batch (batch INTAKE only; capacity + auto custody event)"
    roles: [IntakeClerk]
    code: 201
    input: [box_label, intake_weight_grams]
    output: Box
    side_effects:
      - "status = RECEIVED"
      - "CustodyEvent appended (from_stage=INTAKE, to_stage=INTAKE, actor=X-User-ID)"
      - "max_boxes_per_batch enforcement (ERR_MAX_BOXES_EXCEEDED)"
  - method: GET
    path: "/boxes/{id}"
    description: "Get a box"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: []
    output: Box
    side_effects: []
  - method: POST
    path: "/boxes/{id}/request-return"
    description: "Client elects return instead of destruction (rejected once batch is DISPOSITION_PENDING or CLOSED; a DELIVERED batch's STORED/SCAN_COMPLETE box moves to AWAITING_DISPOSITION immediately)"
    roles: [ClientUser]
    code: 200
    input: []
    output: Box
    side_effects: ["return_requested = true", "when batch DELIVERED: box -> AWAITING_DISPOSITION (shelf release if STORED)"]
  - method: POST
    path: "/boxes/{id}/custody-events"
    description: "Record a custody hand-off (to_stage in PREP|SCAN|STORAGE); drives Box state per machine"
    roles: [PrepTechnician, ScanOperator, IntakeClerk]
    code: 201
    input: [to_stage, "notes?"]
    output: CustodyEvent
    side_effects: ["Box transition per to_stage", "segregation + custody-flag checks", "shelf release on PREP"]
  - method: GET
    path: "/boxes/{id}/custody-events"
    description: "Custody trail of a box (append-only, chronological)"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "CustodyEvent[]"
    side_effects: []
  - method: POST
    path: "/boxes/{id}/clear-custody-flag"
    description: "ComplianceOfficer clears the post-destruction custody flag on a box"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Box
    side_effects: ["custody_flagged = false"]
  - method: POST
    path: "/boxes/{id}/begin-destruction"
    description: "AWAITING_DISPOSITION -> IN_DESTRUCTION"
    roles: [DestructionSpecialist]
    code: 200
    input: []
    output: Box
    side_effects: ["CustodyEvent DESTRUCTION"]
  - method: POST
    path: "/boxes/{id}/destruction-certificates"
    description: "Record certified destruction (IN_DESTRUCTION -> DESTROYED; witness segregation; client-wide custody-flag cascade)"
    roles: [DestructionSpecialist]
    code: 201
    input: [witness_user_id, method]
    output: DestructionCertificate
    side_effects: ["certificate minted (destroyed_at = clock)", "custody_flagged raised on every other non-final box of the client's non-CLOSED batches"]
  - method: GET
    path: "/boxes/{id}/destruction-certificates"
    description: "Get destruction certificate of a box (0 or 1 entries)"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: []
    output: "DestructionCertificate[]"
    side_effects: []
  - method: POST
    path: "/boxes/{id}/mark-returned"
    description: "AWAITING_DISPOSITION -> RETURNED (requires return_requested)"
    roles: [IntakeClerk]
    code: 200
    input: []
    output: Box
    side_effects: ["CustodyEvent RETURN"]

  # --- shelf assignments ---
  - method: POST
    path: "/boxes/{id}/shelf-assignments"
    description: "Shelve a RECEIVED box (RECEIVED -> STORED; capacity + vault-zone checks; appends STORAGE custody event)"
    roles: [IntakeClerk]
    code: 201
    input: [shelf_slot_id]
    output: ShelfAssignment
    side_effects: ["ShelfSlot.occupied_weight_grams += box weight", "Box -> STORED", "CustodyEvent STORAGE"]
  - method: GET
    path: "/boxes/{id}/shelf-assignments"
    description: "List shelf assignments of a box"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ShelfAssignment[]"
    side_effects: []
  - method: GET
    path: "/shelf-assignments/{id}"
    description: "Get a shelf assignment"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: []
    output: ShelfAssignment
    side_effects: []
  - method: POST
    path: "/shelf-assignments/{id}/release"
    description: "Manually release an ACTIVE shelf assignment"
    roles: [IntakeClerk]
    code: 200
    input: []
    output: ShelfAssignment
    side_effects: ["status = RELEASED", "ShelfSlot.occupied_weight_grams -= box weight", "released_at = clock"]

  # --- documents & index records ---
  - method: POST
    path: "/boxes/{id}/documents"
    description: "Register a document in a box (batch INTAKE or PREPPING only)"
    roles: [IntakeClerk, PrepTechnician]
    code: 201
    input: [doc_type, pages, contains_phi, ocr_confidence]
    output: Document
    side_effects: ["status = REGISTERED", "batch_id denormalized from box"]
  - method: GET
    path: "/boxes/{id}/documents"
    description: "List documents of a box"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Document[]"
    side_effects: []
  - method: GET
    path: "/documents/{id}"
    description: "Get a document"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: []
    output: Document
    side_effects: []
  - method: POST
    path: "/documents/{id}/index-records"
    description: "Submit indexing metadata (SCANNED -> INDEXED, or -> REJECTED when ocr_confidence < 70; on the REJECTED branch the response is 200 carrying the Document, no IndexRecord created)"
    roles: [Indexer]
    code: 201
    input: [metadata_json, ocr_text_ref]
    output: IndexRecord
    side_effects: ["Document -> INDEXED or REJECTED per ocr_confidence"]
  - method: GET
    path: "/documents/{id}/index-records"
    description: "Get the index record of a document (0 or 1 entries)"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: []
    output: "IndexRecord[]"
    side_effects: []
  - method: GET
    path: "/index-records/{id}"
    description: "Get an index record"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: []
    output: IndexRecord
    side_effects: []
  - method: GET
    path: "/documents/{id}/page-logs"
    description: "List page logs referencing a document"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "PageLog[]"
    side_effects: []

  # --- scan sessions ---
  - method: POST
    path: "/batches/{id}/scan-sessions"
    description: "Open a scan session (batch SCANNING; one OPEN session per scanner; scanner AVAILABLE)"
    roles: [ScanOperator]
    code: 201
    input: [scanner_id]
    output: ScanSession
    side_effects: ["status = OPEN", "started_at = clock", "operator_id = X-User-ID"]
  - method: GET
    path: "/scan-sessions/{id}"
    description: "Get a scan session"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk]
    code: 200
    input: []
    output: ScanSession
    side_effects: []
  - method: POST
    path: "/scan-sessions/{id}/page-logs"
    description: "Log pages scanned for a document in this session (session OPEN; document belongs to the session's batch)"
    roles: [ScanOperator]
    code: 201
    input: [document_id, pages]
    output: PageLog
    side_effects: ["ScanSession.page_count += pages"]
  - method: GET
    path: "/scan-sessions/{id}/page-logs"
    description: "List page logs of a session"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "PageLog[]"
    side_effects: []
  - method: GET
    path: "/page-logs/{id}"
    description: "Get a page log"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk]
    code: 200
    input: []
    output: PageLog
    side_effects: []
  - method: POST
    path: "/scan-sessions/{id}/commit"
    description: "Commit the session (OCC on Batch.version via expected_batch_version)"
    roles: [ScanOperator]
    code: 200
    input: [expected_batch_version]
    output: ScanSession
    side_effects:
      - "session COMMITTED; covered documents -> SCANNED"
      - "Batch.scanned_pages / billable_scanned_pages reconciled"
      - "Invoice DRAFT page_subtotal_cents recomputed (provisional variant while batch < DELIVERED)"
      - "increments Batch.version by 1"
  - method: POST
    path: "/scan-sessions/{id}/void"
    description: "Void an open session (its pages excluded from all aggregates)"
    roles: [ScanOperator]
    code: 200
    input: []
    output: ScanSession
    side_effects: ["status = VOIDED", "ended_at = clock"]

  # --- access grants & download ---
  - method: GET
    path: "/access-grants/{id}"
    description: "Get an access grant"
    roles: [PlatformAdmin, ComplianceOfficer, ClientUser]
    code: 200
    input: []
    output: AccessGrant
    side_effects: []
  - method: POST
    path: "/access-grants/{id}/revoke"
    description: "Revoke an access grant"
    roles: [ClientUser]
    code: 200
    input: []
    output: AccessGrant
    side_effects: ["status = REVOKED"]
  - method: GET
    path: "/access-grants/{id}/documents"
    description: "List documents visible under a grant (metadata channel; lazy expiry evaluated; grant must be ACTIVE)"
    roles: [ClientUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "Document[]"
    side_effects: []
  - method: GET
    path: "/access-grants/{id}/documents/{docId}/download"
    description: "Download a document image (grant ACTIVE + unexpired, scope FULL_IMAGE, not vault_only, document DELIVERED, client not SUSPENDED)"
    roles: [ClientUser]
    code: 200
    input: []
    output: { document_id: string, download_url: string, expires_in_seconds: integer }
    side_effects: []

  # --- invoices ---
  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice (DRAFT recomputes page_subtotal_cents under the variant selected by batch state, and storage_subtotal_cents projected at the current clock, on every read)"
    roles: [PlatformAdmin, BillingClerk, ClientUser]
    code: 200
    input: []
    output: Invoice
    side_effects: ["DRAFT invoices recompute page_subtotal_cents (provisional variant while batch < DELIVERED, final variant from delivery on) and storage_subtotal_cents (projected) on read; ISSUED+ invoices are frozen"]
  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue the invoice (DRAFT -> ISSUED; final pricing variant; storage accrual frozen at issued_at)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["issued_at = clock", "subtotals frozen"]
  - method: POST
    path: "/invoices/{id}/payments"
    description: "Capture a payment against the invoice"
    roles: [BillingClerk]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["amount_paid_cents += amount_cents", "status transitions ISSUED -> PARTIALLY_PAID -> PAID"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void a DRAFT invoice"
    roles: [BillingClerk]
    code: 200
    input: [void_reason]
    output: Invoice
    side_effects: ["status = VOID"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-ID or X-User-Role header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or ClientUser acting outside its own client subtree" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist or does not nest under the named parent" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, enum outside declared set, non-positive pages/weights/amounts" }
  - { id: ERR_CLIENT_SUSPENDED, http: 403, condition: "Client.status == SUSPENDED; all client-subtree mutations and grant usage rejected" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in a valid source state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_batch_version != current Batch.version on scan-session commit" }
  - { id: ERR_BATCH_EMPTY, http: 409, condition: "start-prep requires >= 1 box; start-scan requires >= 1 document" }
  - { id: ERR_CUSTODY_GAP, http: 422, condition: "start-prep requires every box to have >= 1 custody event (auto-intake event satisfies this)" }
  - { id: ERR_OPEN_SCAN_SESSION_EXISTS, http: 409, condition: "submit-qa requires no OPEN scan session on the batch" }
  - { id: ERR_DOCUMENTS_INCOMPLETE, http: 409, condition: "submit-qa requires all documents SCANNED/QA_FAILED/REJECTED; pass-qa requires none QA_FAILED" }
  - { id: ERR_BATCH_NOT_REWORKABLE, http: 409, condition: "fail-qa requires at least one QA_FAILED document" }
  - { id: ERR_BATCH_NOT_INDEXABLE, http: 409, condition: "deliver requires >= 1 document, all documents INDEXED/DELIVERED/REJECTED, and REJECTED count <= max(1, floor(10% of docs))" }
  - { id: ERR_BOXES_NOT_FINAL, http: 409, condition: "close requires every box DESTROYED or RETURNED" }
  - { id: ERR_SCANNER_BUSY, http: 409, condition: "ScannerUnit already has an OPEN scan session (on any batch)" }
  - { id: ERR_SCANNER_UNAVAILABLE, http: 409, condition: "ScannerUnit.status == MAINTENANCE (at session open or commit)" }
  - { id: ERR_SCANNER_OVER_CAPACITY, http: 409, condition: "Session page_count exceeds ScannerUnit.capacity_pages_per_session at commit" }
  - { id: ERR_EMPTY_SCAN_SESSION, http: 409, condition: "Commit with page_count == 0" }
  - { id: ERR_SHELF_OVER_CAPACITY, http: 409, condition: "ShelfSlot.occupied_weight_grams + box weight would exceed capacity_grams (strictly greater rejects; equality admitted)" }
  - { id: ERR_VAULT_ZONE_REQUIRED, http: 422, condition: "PHI box of HIPAA client placed on a GENERAL shelf" }
  - { id: ERR_MAX_BOXES_EXCEEDED, http: 409, condition: "Box intake would exceed agreement.max_boxes_per_batch" }
  - { id: ERR_RUSH_CAPACITY_FULL, http: 409, condition: "admitted_rush >= RUSH_ADMISSION_LIMIT (3) on RUSH batch creation" }
  - { id: ERR_CUSTODY_SEGREGATION, http: 422, condition: "Same user authoring two adjacent custody events on one box" }
  - { id: ERR_WITNESS_SEGREGATION, http: 422, condition: "Destruction witness_user_id equals the recording actor's X-User-ID" }
  - { id: ERR_CUSTODY_FLAGGED, http: 409, condition: "Box custody_flagged after a client-level destruction; requires ComplianceOfficer clear-custody-flag" }
  - { id: ERR_BOX_RETURN_COMMITTED, http: 409, condition: "begin-destruction on a box with return_requested == true" }
  - { id: ERR_BOX_NOT_RETURN_COMMITTED, http: 409, condition: "mark-returned on a box with return_requested == false" }
  - { id: ERR_RETURN_WINDOW_EXPIRED, http: 409, condition: "request-return after batch entered DISPOSITION_PENDING or CLOSED" }
  - { id: ERR_METADATA_INCOMPLETE, http: 422, condition: "metadata_json missing required keys title / record_date / subject" }
  - { id: ERR_GRANT_EXPIRED, http: 409, condition: "AccessGrant used after expires_at (lazy transition to EXPIRED)" }
  - { id: ERR_GRANT_VAULT_ONLY, http: 422, condition: "vault_only grant used on the public download channel" }
  - { id: ERR_SCOPE_INSUFFICIENT, http: 403, condition: "Download requires scope FULL_IMAGE; METADATA_ONLY grants serve only the documents list" }
  - { id: ERR_DOCUMENT_NOT_DELIVERED, http: 409, condition: "Download requested for a document not in DELIVERED status" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Payment amount_cents exceeds total_cents - amount_paid_cents" }
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "Payment attempted on a DRAFT or VOID invoice" }
  - { id: ERR_AGREEMENT_EXISTS, http: 409, condition: "Second service agreement created for the same client while one exists" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Bureau platform operator; provisions infrastructure, clients, agreements; drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /scanner-units (+ /maintenance)"
      - "POST /shelf-slots"
      - "POST /clients (+ /suspend, /reactivate)"
      - "POST /clients/{id}/service-agreements"
    shared_operations:
      - "All GET list/read endpoints"

  - name: IntakeClerk
    description: "Intake desk staff; creates batches and boxes, shelves boxes, records STORAGE custody links, marks returns"
    identity: opaque
    exclusive_operations:
      - "POST /batches"
      - "POST /batches/{id}/boxes"
      - "POST /batches/{id}/start-prep"
      - "POST /boxes/{id}/shelf-assignments, POST /shelf-assignments/{id}/release"
      - "POST /boxes/{id}/mark-returned"
    shared_operations:
      - "POST /boxes/{id}/custody-events (to_stage=STORAGE only)"
      - "POST /boxes/{id}/documents (shared with PrepTechnician)"
      - "GET endpoints"

  - name: PrepTechnician
    description: "Prep room staff; pulls boxes from storage, registers documents"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /boxes/{id}/custody-events (to_stage=PREP only)"
      - "POST /boxes/{id}/documents (shared with IntakeClerk)"
      - "GET endpoints"

  - name: ScanOperator
    description: "Scan station operator; advances batch into scanning, runs scan sessions, records SCAN custody link"
    identity: opaque
    exclusive_operations:
      - "POST /batches/{id}/start-scan"
      - "POST /batches/{id}/submit-qa"
      - "POST /batches/{id}/scan-sessions, POST /scan-sessions/{id}/page-logs, /commit, /void"
    shared_operations:
      - "POST /boxes/{id}/custody-events (to_stage=SCAN only)"
      - "GET endpoints"

  - name: QAReviewer
    description: "Quality assurance reviewer; passes/fails QA, marks documents QA_FAILED, triggers delivery"
    identity: opaque
    exclusive_operations:
      - "POST /batches/{id}/pass-qa"
      - "POST /batches/{id}/fail-qa"
      - "POST /batches/{id}/qa-reviews"
      - "POST /batches/{id}/deliver"
    shared_operations:
      - "GET endpoints"

  - name: Indexer
    description: "Indexing specialist; attaches metadata and OCR references"
    identity: opaque
    exclusive_operations:
      - "POST /documents/{id}/index-records"
    shared_operations:
      - "GET endpoints"

  - name: DestructionSpecialist
    description: "Certified destruction operator; begins destruction and records certificates"
    identity: opaque
    exclusive_operations:
      - "POST /boxes/{id}/begin-destruction"
      - "POST /boxes/{id}/destruction-certificates"
    shared_operations:
      - "GET endpoints"

  - name: ComplianceOfficer
    description: "Compliance authority; closes batches and clears custody flags"
    identity: opaque
    exclusive_operations:
      - "POST /batches/{id}/close"
      - "POST /boxes/{id}/clear-custody-flag"
    shared_operations:
      - "GET endpoints (incl. access-grants)"

  - name: BillingClerk
    description: "Billing desk; issues invoices and captures payments"
    identity: opaque
    exclusive_operations:
      - "POST /invoices/{id}/issue"
      - "POST /invoices/{id}/payments"
      - "POST /invoices/{id}/void"
    shared_operations:
      - "GET endpoints (incl. service-agreements)"

  - name: ClientUser
    description: "Customer-side user; requests returns, manages access grants, downloads delivered documents"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /boxes/{id}/request-return"
      - "POST /clients/{id}/access-grants, POST /access-grants/{id}/revoke"
      - "GET /access-grants/{id}/documents (+ /download)"
    shared_operations:
      - "GET endpoints restricted to own client subtree (X-User-ID must equal the resource's client_id)"
