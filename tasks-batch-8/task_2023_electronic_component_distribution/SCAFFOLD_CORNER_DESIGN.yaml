      - name: exposure_open_on_quarantined_lot_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOT_NOT_AVAILABLE]", state_machines.InventoryLot]
        distinguishing_aspect: "Only AVAILABLE lots accept new exposure intervals; a QUARANTINED lot rejects the open with ERR_LOT_NOT_AVAILABLE."
