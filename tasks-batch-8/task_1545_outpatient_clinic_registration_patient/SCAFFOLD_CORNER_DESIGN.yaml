  - section: validations
    instances:
      - name: duplicate_patient_rejected_on_demographic_triple
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_DUPLICATE_PATIENT]
        distinguishing_aspect: "Second create with identical (first_name,last_name,date_of_birth) to a non-MERGED patient returns ERR_DUPLICATE_PATIENT / 409."
        test_recipe:
          setup: ["one patient exists"]
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Dup", last_name: "Licate", date_of_birth: "1980-12-01", sex_at_birth: "F", primary_phone: "+15551400001" }
              as: Registrar
          trigger:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Dup", last_name: "Licate", date_of_birth: "1980-12-01", sex_at_birth: "F", primary_phone: "+15551400099" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_PATIENT"

      - name: interpreter_flag_requires_language_code
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_LANGUAGE_REQUIRED]
        distinguishing_aspect: "INTERPRETER flag without language_code returns ERR_LANGUAGE_REQUIRED / 400; with language_code it succeeds."
        test_recipe:
          setup: ["patient exists"]
          setup_api_calls:
