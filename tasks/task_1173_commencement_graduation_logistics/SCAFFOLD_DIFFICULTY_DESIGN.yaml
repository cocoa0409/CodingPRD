          assert:
            - "error_id == ERR_GRADUATE_NOT_ELIGIBLE with HTTP 409 — TicketAllocation operation gated on Graduate.status in {ELIGIBLE, ELIGIBLE_ON_APPEAL, CONFIRMED}"

      - name: batch_release_requires_audit_locked
        grounds:
