  # ===========================================================================
  - section: endpoints
    instances:

      - name: transferability_is_reclassified_only_when_a_review_is_posted
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /digital-assets/{asset_id}/transferability-reviews]
          - endpoints[PATCH /platforms/{platform_id}]
          - calculations.asset_transferability_class
        distinguishing_aspect: |
          A PATCH to the platform's licence flags leaves every existing asset's stored
          transferability untouched; only POST /digital-assets/{asset_id}/transferability-reviews
          recomputes it, and the recomputation preserves appraised_value_cents and access_status while
          the identical supports_transfer=false flag yields PROVIDER_NO_TRANSFER for CLOUD_STORAGE
          (rule 5) but PROVIDER_LICENCE_TERMINATES for LOYALTY_PROGRAM (rule 4).
        test_recipe:
          setup:
            - "one CLOUD_STORAGE platform with license_terminates_at_death false, supports_transfer true, transfer_fee_cents 0"
            - "one Estate at DISCLOSURE with three disclosed assets: vault-1 CLOUD_STORAGE 200000, points-1 LOYALTY_PROGRAM 40000, sub-1 SUBSCRIPTION 0"
            - "one BeneficiaryDesignation holding 10000 basis points and one COMPUTED DATE_OF_DEATH run so vault-1 and points-1 carry appraised values"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C31" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-C31" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-C31", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
