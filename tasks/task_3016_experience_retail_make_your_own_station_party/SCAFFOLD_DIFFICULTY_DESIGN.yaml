          assert:
            - "BuildShipOrder.${b8}.status == HANDED_TO_CARRIER (cascade: payment -> READY_FOR_PICKUP -> handoff)"
            - "settle_in.eligible_order_count == 1 (handoff at 2026-10-31T20:00:00Z inside window ending 23:00)"
            - "settle_out.eligible_order_count == 1 (handoff at 20:00 is also inside the 20:30-ending window; both windows key on handed_over_at, not payment time — this pins which timestamp the filter reads)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict: two conflicts on DIFFERENT
  # error-category pairs.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_party_deposit
        grounds:
          - "validations[priority=5]"
          - "validations[priority=6]"
          - state_machines.PartyReservation.QUOTED_to_DEPOSIT_PAID
        distinguishing_aspect: |
          Pair (state vs business_temporal): paying a deposit on a CANCELLED
          party whose start is also inside the 72h lead window must return
          ERR_INVALID_STATE (priority 5 state beats priority 6 temporal), not
          ERR_OUTSIDE_TIME_WINDOW.
        test_recipe:
          setup:
            - "Store S9; Customer C9; party P9 created then cancelled (status CANCELLED); party_start only 48h out"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Priority Store", party_room_count: 1 }
              as: StoreManager
              captures: { store9: $.data.id }
            - call: "POST /customers"
