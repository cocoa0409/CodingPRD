  - rule_id: transitive_cascade
    instances:
      - name: payment_run_release_three_hop_cascade
        grounds:
          - state_machines.PaymentRun.LOCKED_to_RELEASED
          - state_machines.PaymentRunItem
          - state_machines.CarrierInvoice
          - state_machines.RemittanceAdvice
        distinguishing_aspect: |
          Release cascade of depth 3 where each hop is caused by the previous one:
          run LOCKED->RELEASED causes items SCHEDULED->RELEASED; each item's release
          causes its invoice UNPAID->SCHEDULED with scheduled_minor debited; the
          per-carrier aggregation over released items then causes a RemittanceAdvice
          to be created GENERATED. Settle replays the chain to PAID/SENT.
        test_recipe:
          setup:
            - "Standard USD chain; invoice INV-0001 billed 87500 audited CLEARED (approved 87500, due 2026-08-17)"
            - "Payment run USD 2026-08-10 created by op-fin-1, item added, LOCKED by op-fin-1"
