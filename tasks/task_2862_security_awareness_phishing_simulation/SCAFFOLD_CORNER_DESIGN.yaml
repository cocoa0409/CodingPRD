            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${c}/launch", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c}", employee_id: "${e}" }, as: ProgramAdmin, captures: { d: "$.data[0].id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:40:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/simulation-deliveries/${d}/interactions", payload: { event_type: "CLICK", occurred_at: "2026-08-02T09:10:00Z", source: "LANDING_PAGE" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/simulation-deliveries/${d}/interactions", payload: { event_type: "REPORT", occurred_at: "2026-08-02T09:40:00Z", source: "REPORT_BUTTON" }, as: ProgramAdmin, captures: { ev: "$.data.id", eff: "$.data.superseding_effect" } }
            - { call: "GET /awareness/simulation-deliveries/${d}", payload: {}, as: ProgramAdmin }
          assert:
            - "SimulationDelivery.${d}.state == CLICKED (the self-loop does not move the state)"
            - "SimulationDelivery.${d}.outcome_class == CLICKED_THEN_REPORTED"
            - "SimulationDelivery.${d}.first_click_at == 2026-08-02T09:10:00Z and first_report_at == 2026-08-02T09:40:00Z"
            - "SimulationDelivery.${d}.time_to_report_minutes == 40"
            - "InteractionEvent.${ev}.superseding_effect == NONE and sequence_index == 2"

      - name: assignment_cyclic_shape_loop_count_witnessed_by_attempt_count
        claim_type: cyclic
        grounds:
          - state_machines.CurriculumAssignment.FAILED_ATTEMPT_to_IN_PROGRESS
        excluded_because:
          difficulty_instance: assignment_cycles_in_progress_failed_attempt_and_back
          rationale: "The IN_PROGRESS -> FAILED_ATTEMPT -> IN_PROGRESS loop and its attempt_count witness are the entire subject of the named §1.8 instance."

      - name: employee_parallel_shape_axes_change_independently
        claim_type: parallel
        grounds:
          - state_machines.Employee
        excluded_because:
          difficulty_instance: employee_parallel_axes_move_independently
          rationale: "The three independent Employee axes and their combined state are asserted directly by the named §1.8 instance."

      - name: void_compensation_reverses_escalation_side_effects
        claim_type: compensation
        grounds:
          - state_machines.CurriculumAssignment.ESCALATED_to_VOIDED
        excluded_because:
          difficulty_instance: suspension_ledger_restored_when_assignment_voided
          rationale: "Every reversed side effect of the escalation cascade is enumerated in the named §1.8 instance's asserts."

      - name: schedule_ledger_sync_reserved_slots_track_queued_deliveries
        claim_type: ledger_sync
        grounds:
          - entities.Employee.fields.reserved_simulation_slots
        excluded_because:
          difficulty_instance: reservation_ledger_restored_when_campaign_cancelled
          rationale: "The before/after reconciliation of reserved_simulation_slots against QUEUED delivery count is the named §1.8 instance's invariant."

      - name: assignment_start_guarded_by_module_status
        claim_type: guarded_transitions
        grounds:
          - state_machines.CurriculumAssignment.ASSIGNED_to_IN_PROGRESS
        excluded_because:
          difficulty_instance: assignment_start_blocked_by_retired_module_returns_409
          rationale: "The cross-entity guard 'start only if TrainingModule.status == PUBLISHED' is the named §1.8 instance."

      - name: sweep_cross_entity_side_effects_reach_employee_posture
        claim_type: cross_entity
        grounds:
          - state_machines.CurriculumAssignment.OVERDUE_to_ESCALATED
        excluded_because:
          difficulty_instance: sweep_cascade_overdue_to_notice_to_consequence_to_posture
          rationale: "The assignment -> notice -> consequence -> employee chain is asserted hop by hop in the named §1.8 instance."

  - section: calculations
    instances:
      - name: assignment_due_date_high_criticality_halves_the_window
        claim_type: correct_result
        grounds:
          - calculations.assignment_due_date
          - entities.TrainingModule.fields.criticality
          - entities.CurriculumAssignment.fields.due_at
          - entities.CurriculumAssignment.fields.effective_due_at
        distinguishing_aspect: "A HIGH-criticality module halves the NEW_HIRE base window of 14 days to max(3, floor(14/2)) == 7, so an assignment created at 2026-08-01T00:00:00Z is due 2026-08-08T00:00:00Z instead of 2026-08-15T00:00:00Z, and effective_due_at equals due_at while granted_extension_days is 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE employee and two PUBLISHED NEW_HIRE modules: one STANDARD, one HIGH criticality."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "hana.high@corp.example", full_name: "Hana High", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2026-07-28" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "NH-STD", title: "New Hire Standard", module_type: "NEW_HIRE", criticality: "STANDARD" }, as: ProgramAdmin, captures: { m_std: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m_std}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/training-modules", payload: { code: "NH-HIGH", title: "New Hire Critical", module_type: "NEW_HIRE", criticality: "HIGH" }, as: ProgramAdmin, captures: { m_high: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m_high}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m_std}", assignment_reason: "NEW_HIRE", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a_std: "$.data.id", std_due: "$.data.due_at" } }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin, captures: { e_v2: "$.data.version" } }
          trigger:
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m_high}", assignment_reason: "NEW_HIRE", expected_employee_version: "${e_v2}" }, as: ProgramAdmin, captures: { a_high: "$.data.id" } }
          assert:
            - "CurriculumAssignment.${a_std}.due_at == 2026-08-15T00:00:00Z (14-day STANDARD window)"
            - "CurriculumAssignment.${a_high}.due_at == 2026-08-08T00:00:00Z (7-day HIGH window)"
            - "CurriculumAssignment.${a_high}.effective_due_at == 2026-08-08T00:00:00Z and granted_extension_days == 0"
            - "CurriculumAssignment.${a_high}.assigned_at == 2026-08-01T00:00:00Z and state == ASSIGNED"
            - "the two assignments coexist: different modules never supersede each other"

      - name: reminder_cadence_one_reminder_per_sweep_never_skips_ahead
        claim_type: chronological
        grounds:
          - calculations.reminder_cadence_schedule
          - entities.CurriculumAssignment.fields.reminders_sent
          - endpoints[POST /awareness/compliance-sweeps]
        distinguishing_aspect: "MAX_REMINDERS_PER_SWEEP_PER_ASSIGNMENT is 1, so an assignment whose first three reminder instants are all already past emits exactly one reminder per sweep: three sweeps at the same clock instant walk reminders_sent 1, 2, 3 rather than jumping to 3 on the first."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE employee with an ANNUAL assignment due 2026-08-31T00:00:00Z, whose reminder instants are 2026-08-24, 2026-08-28, 2026-08-30 and 2026-09-02."
            - "The clock is advanced to 2026-08-30T12:00:00Z, so the first three reminder instants are all in the past."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "cara.cadence@corp.example", full_name: "Cara Cadence", department: "HR", role_code: "IC", hire_date: "2018-06-06" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "CAD-ANNUAL", title: "Cadence Probe Module", module_type: "ANNUAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "ANNUAL", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a: "$.data.id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T12:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin, captures: { sweep1: "$.data.reminders_sent_count" } }
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin, captures: { sweep2: "$.data.reminders_sent_count" } }
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin, captures: { sweep3: "$.data.reminders_sent_count" } }
            - { call: "GET /awareness/curriculum-assignments/${a}", payload: {}, as: ProgramAdmin }
          assert:
            - "each of the three sweeps reports reminders_sent_count == 1"
            - "after the three sweeps CurriculumAssignment.${a}.reminders_sent == 3, not 4 and not 1"
            - "CurriculumAssignment.${a}.last_reminder_at == 2026-08-30T12:00:00Z (the clock instant, not the scheduled offset instant)"
            - "CurriculumAssignment.${a}.next_reminder_due_at == 2026-09-02T00:00:00Z (effective_due_at minus the -2 offset)"
            - "CurriculumAssignment.${a}.state == ASSIGNED and escalation_level == 0 throughout"

      - name: repeat_clicker_tier_window_excludes_failures_older_than_180_days
        claim_type: input_set_filtering
        grounds:
          - calculations.repeat_clicker_tier
          - entities.Employee.fields.repeat_clicker_tier
          - state_machines.SimulationDelivery.DELIVERED_to_CLICKED
        distinguishing_aspect: "REPEAT_WINDOW_DAYS is 180 with an inclusive lower bound on delivered_at, so a click on a delivery delivered 2026-01-05 is outside the window evaluated at 2026-08-02 and the employee reads tier 1 (one in-window failure), not tier 2 - and no intervention opens."
        test_recipe:
          setup:
            - "Logical clock set back to 2026-01-01T00:00:00Z for the first campaign."
            - "One employee in ENGINEERING who clicks a delivery delivered 2026-01-05T09:00:00Z (209 days before the evaluation instant)."
            - "A second campaign delivers to the same employee at 2026-08-02T09:00:00Z and is clicked at 2026-08-02T09:30:00Z."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "wanda.window@corp.example", full_name: "Wanda Window", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2015-01-01" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Window Probe Template", pretext_category: "PACKAGE_DELIVERY", difficulty_tier: "TIER_1_BASIC", theme_tags: ["CURIOSITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "ENG January Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["ENGINEERING"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c1: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c1}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c1}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c1_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${c1}/schedule", payload: { scheduled_send_at: "2026-01-05T09:00:00Z", expected_campaign_version: "${c1_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${c1}/launch", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c1}", employee_id: "${e}" }, as: ProgramAdmin, captures: { d1: "$.data[0].id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T09:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/simulation-deliveries/${d1}/interactions", payload: { event_type: "CLICK", occurred_at: "2026-01-05T09:30:00Z", source: "LANDING_PAGE" }, as: ProgramAdmin }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns", payload: { name: "ENG August Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["ENGINEERING"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c2: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c2}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c2}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c2_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${c2}/schedule", payload: { scheduled_send_at: "2026-08-02T09:00:00Z", expected_campaign_version: "${c2_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${c2}/launch", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c2}", employee_id: "${e}" }, as: ProgramAdmin, captures: { d2: "$.data[0].id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:30:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/simulation-deliveries/${d2}/interactions", payload: { event_type: "CLICK", occurred_at: "2026-08-02T09:30:00Z", source: "LANDING_PAGE" }, as: ProgramAdmin }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin, captures: { tier: "$.data.repeat_clicker_tier" } }
            - { call: "GET /awareness/interventions", payload: { employee_id: "${e}" }, as: ProgramAdmin }
          assert:
            - "Employee.${e}.repeat_clicker_tier == 1 (only the August failure is inside the 180-day window)"
            - "the intervention list for ${e} is empty: the tier never reached 2"
            - "SimulationDelivery.${d1}.state == CLICKED is still recorded, so the exclusion is by window, not by data loss"
            - "SimulationDelivery.${d2}.state == CLICKED and outcome_class == CLICKED_NO_REPORT"
            - "Employee.${e}.risk_score_provisional == 11.00 (one in-scope click, CLICK_WEIGHT 10 x 1.10 tier multiplier)"

      - name: harmful_theme_screen_lists_only_prohibited_tags_in_declaration_order
        claim_type: correct_result
        grounds:
          - calculations.harmful_theme_screen
          - entities.PhishingTemplate.fields.harmful_flag_hits
          - endpoints[POST /awareness/phishing-templates]
        distinguishing_aspect: "The screen is a set intersection with PROHIBITED_THEME_TAGS emitted in the constant's declaration order, not the author's order: theme_tags [FAMILY_EMERGENCY, URGENCY, BONUS_COMPENSATION] yields harmful_flag_hits [BONUS_COMPENSATION, FAMILY_EMERGENCY] while the safe tag URGENCY is untouched, and the row is still created."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no templates exist."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/phishing-templates", payload: { name: "Screen Order Probe", pretext_category: "HR_BENEFITS_ENROLLMENT", difficulty_tier: "TIER_2_TARGETED", theme_tags: ["FAMILY_EMERGENCY", "URGENCY", "BONUS_COMPENSATION"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "GET /awareness/phishing-templates/${tpl}", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
          assert:
            - "HTTP 201: the template row is created even though the screen fails (the screen is advisory at creation)"
            - "PhishingTemplate.${tpl}.harmful_flag_hits == [BONUS_COMPENSATION, FAMILY_EMERGENCY]"
            - "PhishingTemplate.${tpl}.theme_tags preserves the submitted order [FAMILY_EMERGENCY, URGENCY, BONUS_COMPENSATION]"
            - "PhishingTemplate.${tpl}.review_state == DRAFT and blocked_reason == null"
            - "a template created with theme_tags [URGENCY, AUTHORITY, CURIOSITY, REWARD] has harmful_flag_hits == []"

      - name: tenure_band_thresholds_at_exactly_90_and_365_days
        claim_type: threshold
        grounds:
          - calculations.employee_tenure_band
          - entities.Employee.fields.tenure_band
        distinguishing_aspect: "The band boundaries are >= comparisons on whole days of tenure, so 89 days is NEW_HIRE, exactly 90 days is RAMPING and exactly 365 days is ESTABLISHED - the threshold day itself belongs to the higher band."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Three employees hired 2026-05-04 (89 days), 2026-05-03 (90 days) and 2025-08-01 (365 days)."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/employees", payload: { email: "t89@corp.example", full_name: "Tina Eightynine", department: "SALES", role_code: "IC", hire_date: "2026-05-04" }, as: ProgramAdmin, captures: { e89: "$.data.id", b89: "$.data.tenure_band" } }
            - { call: "POST /awareness/employees", payload: { email: "t90@corp.example", full_name: "Tom Ninety", department: "SALES", role_code: "IC", hire_date: "2026-05-03" }, as: ProgramAdmin, captures: { e90: "$.data.id", b90: "$.data.tenure_band" } }
            - { call: "POST /awareness/employees", payload: { email: "t365@corp.example", full_name: "Tess Yearone", department: "SALES", role_code: "IC", hire_date: "2025-08-01" }, as: ProgramAdmin, captures: { e365: "$.data.id", b365: "$.data.tenure_band" } }
          assert:
            - "Employee.${e89}.tenure_band == NEW_HIRE (89 days, one day short of the RAMPING threshold)"
            - "Employee.${e90}.tenure_band == RAMPING (exactly 90 days lands in the higher band)"
            - "Employee.${e365}.tenure_band == ESTABLISHED (exactly 365 days lands in the higher band)"
            - "all three employees read compliance_state COMPLIANT and access_posture NONE"

      - name: scorecard_precision_rounds_report_rate_to_four_decimals
        claim_type: precision
        grounds:
          - calculations.campaign_scorecard_rates
