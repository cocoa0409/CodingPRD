  # ===========================================================================
  # SECTION 2 — STATE MACHINES (claim-extraction-guide Table 2 + parallel shape)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: every_entity_lands_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.NeedsAssessment.initial_state
          - state_machines.PermitApplication.initial_state
          - state_machines.Prospectus.initial_state
          - state_machines.Permit.administrative_status.initial_state
          - state_machines.Permit.compliance_status.initial_state
          - state_machines.OperatingPlan.initial_state
          - state_machines.Guide.initial_state
          - state_machines.GuideAreaAuthorization.initial_state
          - state_machines.InsuranceCertificate.initial_state
          - state_machines.Bond.initial_state
          - state_machines.TripUseReport.initial_state
          - state_machines.FeeAssessment.initial_state
          - state_machines.NoncomplianceAction.initial_state
        distinguishing_aspect: |
          All thirteen machines are walked at their entry point in one chain. Two are special: the
          Permit enters BOTH dimensions at once as the pair (ISSUED, COMPLIANT) — COMPLIANT even
          though insurance_current and bond_current are still false, because
          permit_compliance_derivation is explicitly not evaluated at issuance — and the FeeAssessment
          has no creation endpoint at all, so its PROVISIONAL entry state can only be observed as a
          consequence of accepting a use report.
        test_recipe:
          setup:
            - "empty database. The whole chain is the trigger: every call's own response body carries the initial-state claim under test."
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/prospectuses"
              payload: { use_area_id: "${ua_id}", needs_assessment_id: "${na_id}", offered_service_days: 100, submission_deadline_date: "2027-03-01", min_qualifying_score: 60.0 }
              as: PermitSpecialist
              captures: { pr_id: "$.data.id" }
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT", narrative: "Guided day floats." }
              as: PermitSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_id}/screen"
              payload: {}
