            - { call: "POST /midway/staff", payload: { fair_id: "${fair_a}", full_name: "Clerk A", functions: ["CLERK"] }, as: FairManager, as_user_id: "${sup_a}", captures: { clerk_a: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_a}", full_name: "Crew A", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_a}", captures: { crew_a: "$.data.id", crew_a_v: "$.data.version" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_b}", full_name: "Sup B", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_b: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_b}", full_name: "Op B", functions: ["OPERATOR"] }, as: FairManager, as_user_id: "${sup_b}", captures: { op_b: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_b}", full_name: "Crew B", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_b}", captures: { crew_b: "$.data.id", crew_b_v: "$.data.version" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp X1", license_number: "LIC-XF-1" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp X2", license_number: "LIC-XF-2" }, as: StateProgramAdmin, captures: { insp2_id: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_a}", name: "Coaster A", manufacturer: "MFG", model: "X1", serial_number: "SN-XF-A", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_a}", captures: { ride_a: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_b}", name: "Coaster B", manufacturer: "MFG", model: "X1", serial_number: "SN-XF-B", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_b}", captures: { ride_b: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_a}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_a_v}" }, as: FairManager, as_user_id: "${sup_a}" }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_b}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_b_v}" }, as: FairManager, as_user_id: "${sup_b}" }
            - { call: "POST /midway/rides/${ride_a}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_a}" }
            - { call: "POST /midway/rides/${ride_b}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_b}" }
            - { call: "POST /midway/fairs/${fair_a}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_a}", captures: { permit_a: "$.data.id" } }
            - { call: "POST /midway/fairs/${fair_b}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_b}", captures: { permit_b: "$.data.id" } }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_a}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 9, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_a}", captures: { appt_a: "$.data.id", appt_a_insp: "$.data.inspector_id" } }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_b}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 14, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_b}", captures: { appt_b: "$.data.id", appt_b_insp: "$.data.inspector_id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T16:00:00Z" }, as: StateProgramAdmin }
