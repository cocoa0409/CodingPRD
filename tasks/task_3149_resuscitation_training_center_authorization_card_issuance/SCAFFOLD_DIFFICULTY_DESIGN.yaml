# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3149_resuscitation_training_center_authorization_card_issuance
# Nine Difficulty Rules × 2 instances each = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: skills_scoring_initial_vs_remediation_threshold
        grounds:
          - calculations.skills_evaluation_scoring
          - entities.SkillsEvaluation.fields.outcome
          - entities.RosterEntry.fields.remediation_used
        distinguishing_aspect: |
          Identical checklist data (21/25 items passed, all criticals passed,
          score 84.00) yields outcome PASS as an initial attempt but FAIL as a
          remediation retest — the two variants of skills_evaluation_scoring
          apply different pass thresholds (84.00 vs 90.00) to the same inputs
          on the RosterEntry domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE center with ALIGNED site (capacity 24), faculty oversight, certified+aligned BLS instructor, ACTIVE guidelines version G2025, and a SCHEDULED BLS_PROVIDER CLASSROOM session (capacity 6) with two ENROLLED roster entries; session started."
          setup_api_calls:
            - &clock
              call: "POST /aha/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
            - &center
              call: "POST /aha/training-centers"
              payload: { legal_name: "Lone Star Resuscitation Training Center", region: "SOUTHWEST", contact_email: "ops@lonestar-rtc.example" }
              as: NationalAdmin
              captures: { center_id: $.data.id }
            - &faculty
              call: "POST /aha/instructors"
              payload: { full_name: "Fiona Faculty", email: "fiona@x.example", discipline: "BLS", home_training_center_id: "${center_id}", legacy_certified: true }
              as: NationalAdmin
              captures: { faculty_id: $.data.id }
            - &grant_faculty
              call: "POST /aha/instructors/${faculty_id}/grant-faculty"
              payload: {}
              as: NationalAdmin
            - &faculty_alignment
              call: "POST /aha/training-centers/${center_id}/alignments"
              payload: { instructor_id: "${faculty_id}", as_faculty: true }
              as: TCAdmin
            - &center_v
              call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: TCAdmin
              captures: { center_v: $.data.version }
            - &site
              call: "POST /aha/training-centers/${center_id}/sites"
              payload: { name: "Main Lab", street_address: "100 CPR Way", city: "Austin", state_code: "TX", capacity_students: 24 }
              as: TCAdmin
              captures: { site_id: $.data.id }
            - &site_align
              call: "POST /aha/training-sites/${site_id}/align"
              payload: { expected_training_center_version: "${center_v}" }
              as: TCAdmin
            - &center_activate
              call: "POST /aha/training-centers/${center_id}/activate"
              payload: {}
              as: NationalAdmin
            - &gv
              call: "POST /aha/guidelines-versions"
              payload: { code: "G2025", title: "2025 AHA Guidelines", published_at: "2025-10-01T00:00:00Z", transition_deadline_at: "2027-03-01T00:00:00Z" }
              as: NationalAdmin
              captures: { gv_id: $.data.id }
            - &gv_activate
              call: "POST /aha/guidelines-versions/${gv_id}/activate"
              payload: {}
              as: NationalAdmin
            - &cand
              call: "POST /aha/instructors"
              payload: { full_name: "Carl Candidate", email: "carl@x.example", discipline: "BLS", home_training_center_id: "${center_id}" }
              as: NationalAdmin
              captures: { cand_id: $.data.id }
            - &cand_monitor
              call: "POST /aha/instructors/${cand_id}/monitor"
              payload: { monitored_at: "2026-09-05T00:00:00Z", course_type_observed: "BLS_PROVIDER", outcome: "SATISFACTORY" }
              as: TrainingFaculty
              as_user_id: "${faculty_id}"
            - &cand_eval1
              call: "POST /aha/instructors/${cand_id}/teaching-evaluations"
              payload: { score: 4, notes: "Solid skills station management." }
              as: TrainingFaculty
              as_user_id: "${faculty_id}"
            - &cand_eval2
              call: "POST /aha/instructors/${cand_id}/teaching-evaluations"
              payload: { score: 5, notes: "Excellent debriefing." }
              as: TrainingFaculty
              as_user_id: "${faculty_id}"
            - &cand_certify
              call: "POST /aha/instructors/${cand_id}/certify"
              payload: {}
              as: TCAdmin
            - &cand_alignment
              call: "POST /aha/training-centers/${center_id}/alignments"
              payload: { instructor_id: "${cand_id}", as_faculty: false }
              as: TCAdmin
            - &session
              call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-10T14:00:00Z", end_at: "2026-10-10T18:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { session_id: $.data.id }
            - &roster_a
              call: "POST /aha/course-sessions/${session_id}/roster"
              payload: { student_name: "Sam Student", student_email: "sam@x.example" }
              as: TCCoordinator
              captures: { entry_a_id: $.data.id }
            - &roster_b
              call: "POST /aha/course-sessions/${session_id}/roster"
              payload: { student_name: "Rita Rescuer", student_email: "rita@x.example" }
              as: TCCoordinator
              captures: { entry_b_id: $.data.id }
            - &session_start
              call: "POST /aha/course-sessions/${session_id}/start"
              payload: {}
              as: TCCoordinator
          trigger:
            - call: "POST /aha/roster-entries/${entry_a_id}/skills-evaluations"
              payload: { items: [{ item_code: "I01", critical: true, passed: true }, { item_code: "I02", critical: false, passed: true }, { item_code: "I03", critical: false, passed: true }, { item_code: "I04", critical: false, passed: true }, { item_code: "I05", critical: false, passed: true }, { item_code: "I06", critical: false, passed: true }, { item_code: "I07", critical: false, passed: true }, { item_code: "I08", critical: false, passed: true }, { item_code: "I09", critical: false, passed: true }, { item_code: "I10", critical: false, passed: true }, { item_code: "I11", critical: false, passed: true }, { item_code: "I12", critical: false, passed: true }, { item_code: "I13", critical: false, passed: true }, { item_code: "I14", critical: false, passed: true }, { item_code: "I15", critical: false, passed: true }, { item_code: "I16", critical: false, passed: true }, { item_code: "I17", critical: false, passed: true }, { item_code: "I18", critical: false, passed: true }, { item_code: "I19", critical: false, passed: true }, { item_code: "I20", critical: false, passed: true }, { item_code: "I21", critical: false, passed: true }, { item_code: "I22", critical: false, passed: false }, { item_code: "I23", critical: false, passed: false }, { item_code: "I24", critical: false, passed: false }, { item_code: "I25", critical: false, passed: false }] }
              as: Instructor
              as_user_id: "${cand_id}"
              captures: { eval_a_outcome: $.data.outcome, eval_a_score: $.data.score_percent }
            - call: "POST /aha/roster-entries/${entry_b_id}/skills-evaluations"
              payload: { items: [{ item_code: "I01", critical: true, passed: true }, { item_code: "I02", critical: false, passed: true }, { item_code: "I03", critical: false, passed: true }, { item_code: "I04", critical: false, passed: true }, { item_code: "I05", critical: false, passed: true }, { item_code: "I06", critical: false, passed: true }, { item_code: "I07", critical: false, passed: true }, { item_code: "I08", critical: false, passed: true }, { item_code: "I09", critical: false, passed: true }, { item_code: "I10", critical: false, passed: true }, { item_code: "I11", critical: false, passed: true }, { item_code: "I12", critical: false, passed: true }, { item_code: "I13", critical: false, passed: true }, { item_code: "I14", critical: false, passed: true }, { item_code: "I15", critical: false, passed: true }, { item_code: "I16", critical: false, passed: true }, { item_code: "I17", critical: false, passed: true }, { item_code: "I18", critical: false, passed: true }, { item_code: "I19", critical: false, passed: true }, { item_code: "I20", critical: false, passed: true }, { item_code: "I21", critical: false, passed: true }, { item_code: "I22", critical: false, passed: false }, { item_code: "I23", critical: false, passed: false }, { item_code: "I24", critical: false, passed: false }, { item_code: "I25", critical: false, passed: false }] }
              as: Instructor
              as_user_id: "${cand_id}"
              captures: { eval_b1_outcome: $.data.outcome, eval_b1_score: $.data.score_percent }
            - call: "POST /aha/roster-entries/${entry_b_id}/skills-evaluations"
              payload: { items: [{ item_code: "I01", critical: true, passed: true }, { item_code: "I02", critical: false, passed: true }, { item_code: "I03", critical: false, passed: true }, { item_code: "I04", critical: false, passed: true }, { item_code: "I05", critical: false, passed: true }, { item_code: "I06", critical: false, passed: true }, { item_code: "I07", critical: false, passed: true }, { item_code: "I08", critical: false, passed: true }, { item_code: "I09", critical: false, passed: true }, { item_code: "I10", critical: false, passed: true }, { item_code: "I11", critical: false, passed: true }, { item_code: "I12", critical: false, passed: true }, { item_code: "I13", critical: false, passed: true }, { item_code: "I14", critical: false, passed: true }, { item_code: "I15", critical: false, passed: true }, { item_code: "I16", critical: false, passed: true }, { item_code: "I17", critical: false, passed: true }, { item_code: "I18", critical: false, passed: true }, { item_code: "I19", critical: false, passed: true }, { item_code: "I20", critical: false, passed: true }, { item_code: "I21", critical: false, passed: true }, { item_code: "I22", critical: false, passed: false }, { item_code: "I23", critical: false, passed: false }, { item_code: "I24", critical: false, passed: false }, { item_code: "I25", critical: false, passed: false }] }
              as: Instructor
              as_user_id: "${cand_id}"
              captures: { eval_b2_outcome: $.data.outcome, eval_b2_score: $.data.score_percent, eval_b2_retest: $.data.is_remediation_retest }
          assert:
            - "eval_a_score == 84.0 and eval_a_outcome == PASS"
            - "RosterEntry.${entry_a_id}.status == PASSED after the first trigger call"
            - "eval_b1_score == 84.0 and eval_b1_outcome == REMEDIATION_REQUIRED"
            - "RosterEntry.${entry_b_id}.status == ENROLLED and remediation_used == true after the second trigger call"
            - "eval_b2_retest == true and eval_b2_score == 84.0 and eval_b2_outcome == FAIL"
            - "RosterEntry.${entry_b_id}.status == FAILED after the third trigger call"
            - "the identical 84.00 score produced PASS on the initial attempt and FAIL on the remediation retest"

      - name: card_expiry_initial_vs_renewal_reissue
        grounds:
          - calculations.card_expiry_calculation
          - entities.CourseCompletionCard.fields.expires_at
          - entities.CourseCompletionCard.fields.is_renewal
        distinguishing_aspect: |
          The renewal_reissue variant anchors on the prior card's expiry while
          initial_issue anchors on issued_at: a card issued 2028-08-15 as a
          renewal of a card expiring 2028-09-30 expires 2030-09-30T23:59:59Z,
          whereas the initial_issue variant for the same issued_at would give
          2030-08-31T23:59:59Z — same inputs, different expires_at, on the
          CourseCompletionCard domain (distinct from the RosterEntry scoring
          domain of the sibling instance).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base chain: ACTIVE center, ALIGNED site, certified+aligned BLS instructor, ACTIVE G2025. Session 1 completed at clock 2026-09-01 with roster entry A (sam@x.example) PASSED, so card 1 is issued as an initial-issue card. Then the clock moves to 2028-08-15T00:00:00Z and session 2 (2026-08-20) is scheduled with a renewal roster entry referencing card 1."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
            - *site_align
            - *center_activate
            - *gv
            - *gv_activate
            - *cand
            - *cand_monitor
            - *cand_eval1
            - *cand_eval2
            - *cand_certify
            - *cand_alignment
            - *session
            - *roster_a
            - *session_start
            - call: "POST /aha/roster-entries/${entry_a_id}/skills-evaluations"
              payload: { items: [{ item_code: "SCENE", critical: true, passed: true }, { item_code: "COMP", critical: false, passed: true }, { item_code: "VENT", critical: false, passed: true }, { item_code: "AED", critical: false, passed: true }, { item_code: "TEAM", critical: false, passed: true }] }
              as: Instructor
              as_user_id: "${cand_id}"
            - call: "POST /aha/course-sessions/${session_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${cand_id}"
            - call: "GET /aha/roster-entries/${entry_a_id}/cards"
              payload: {}
              as: TCAdmin
              captures: { card1_id: $.data.0.id, card1_expires: $.data.0.expires_at }
            - call: "POST /aha/_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-15T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2028-08-20T14:00:00Z", end_at: "2028-08-20T18:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { session2_id: $.data.id }
            - call: "POST /aha/course-sessions/${session2_id}/roster"
              payload: { student_name: "Sam Student", student_email: "sam@x.example", prior_card_id: "${card1_id}" }
              as: TCCoordinator
              captures: { entry_r_id: $.data.id }
            - call: "POST /aha/course-sessions/${session2_id}/start"
              payload: {}
              as: TCCoordinator
          trigger:
            - call: "POST /aha/roster-entries/${entry_r_id}/skills-evaluations"
              payload: { items: [{ item_code: "SCENE", critical: true, passed: true }, { item_code: "COMP", critical: false, passed: true }, { item_code: "VENT", critical: false, passed: true }, { item_code: "AED", critical: false, passed: true }, { item_code: "TEAM", critical: false, passed: true }] }
              as: Instructor
              as_user_id: "${cand_id}"
            - call: "POST /aha/course-sessions/${session2_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${cand_id}"
            - call: "GET /aha/roster-entries/${entry_r_id}/cards"
              payload: {}
              as: TCAdmin
              captures: { card2_id: $.data.0.id, card2_expires: $.data.0.expires_at, card2_is_renewal: $.data.0.is_renewal, card2_issued: $.data.0.issued_at }
          assert:
            - "card1_expires == \"2028-09-30T23:59:59Z\" (end_of_month of issued_at 2026-09-01 + 24 months)"
            - "card2_is_renewal == true and card2_issued == \"2028-08-15T00:00:00Z\""
            - "card2_expires == \"2030-09-30T23:59:59Z\" (end_of_month of prior expiry 2028-09-30 + 24 months)"
            - "card2_expires != \"2030-08-31T23:59:59Z\" (the initial_issue variant's answer for the same issued_at)"
            - "CourseCompletionCard.${card2_id}.prior_card_id == ${card1_id}"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: equipment_ratio_multi_input_gate
        grounds:
          - calculations.equipment_sufficiency
          - validations[priority=6]
          - errors.ERR_EQUIPMENT_RATIO_VIOLATION
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula with nested ceil/max and a
          course_type-conditional branch — capacity 7 CLASSROOM requires
          ceil(7/3)=3 manikins, ceil(7/6)=2 AED trainers, and
          1+max(0,ceil((7-6)/6))=2 instructors; the first request satisfies
          both equipment ratios but fails the instructor branch, the second
          flips only assisting_instructor_count and succeeds.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base chain through certified+aligned instructor and ACTIVE G2025; site capacity 24."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
            - *site_align
            - *center_activate
            - *gv
            - *gv_activate
            - *cand
            - *cand_monitor
            - *cand_eval1
            - *cand_eval2
            - *cand_certify
            - *cand_alignment
          trigger:
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-10T14:00:00Z", end_at: "2026-10-10T18:00:00Z", capacity: 7, manikin_count: 3, aed_trainer_count: 2, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { err_equip: $.data.error_id }
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-10T14:00:00Z", end_at: "2026-10-10T18:00:00Z", capacity: 7, manikin_count: 3, aed_trainer_count: 2, assisting_instructor_count: 1 }
              as: TCCoordinator
              captures: { session7_id: $.data.id, session7_seats: $.data.seats_available }
          assert:
            - "the first trigger call returns 422 and err_equip == ERR_EQUIPMENT_RATIO_VIOLATION (1 + 0 assisting < 2 required instructors)"
            - "the second trigger call returns 201"
            - "session7_seats == 7"
            - "CourseSession.${session7_id}.capacity == 7 and assisting_instructor_count == 1"

      - name: audit_compliance_score_rounding_order
        grounds:
          - calculations.audit_compliance_score
          - entities.AuditFinding.fields.deduction_points
          - entities.QualityAudit.fields.compliance_score
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — two repeat-offense
          OBSERVATION findings (1.25 x 1.5 = 1.875 each) are rounded per
          finding to 1.88 before summing, giving 100 - 3.76 = 96.24; the
          forbidden sum-then-round order would give 100 - 3.75 = 96.25.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE center with ALIGNED site (base chain through activation). Center version captured fresh for OCC."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
            - *site_align
            - *center_activate
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: QAAuditor
              captures: { center_v_now: $.data.version }
            - call: "POST /aha/quality-audits"
              payload: { target_training_center_id: "${center_id}", expected_training_center_version: "${center_v_now}" }
              as: QAAuditor
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /aha/quality-audits/${audit_id}/findings"
              payload: { severity: "OBSERVATION", is_repeat_offense: true, description: "Repeat: rosters missing signatures." }
              as: QAAuditor
              captures: { f1_deduction: $.data.deduction_points }
            - call: "POST /aha/quality-audits/${audit_id}/findings"
              payload: { severity: "OBSERVATION", is_repeat_offense: true, description: "Repeat: equipment logs incomplete." }
              as: QAAuditor
              captures: { f2_deduction: $.data.deduction_points }
            - call: "GET /aha/quality-audits/${audit_id}"
              payload: {}
              as: QAAuditor
              captures: { audit_score: $.data.compliance_score }
          assert:
            - "f1_deduction == 1.88 and f2_deduction == 1.88 (round_half_up of 1.875 per finding)"
            - "audit_score == 96.24"
            - "audit_score != 96.25 (the sum-then-round alternative)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: training_center_probation_cycle
        grounds:
          - state_machines.TrainingCenter.ACTIVE_to_PROBATION
          - state_machines.TrainingCenter.PROBATION_to_ACTIVE
          - state_machines.TrainingCenter.ACTIVE_to_SUSPENDED
          - state_machines.TrainingCenter.SUSPENDED_to_PROBATION
        distinguishing_aspect: |
          TrainingCenter's machine is cyclic with branching: ACTIVE ->
          PROBATION -> ACTIVE -> SUSPENDED -> PROBATION traverses a loop and a
          fork (reinstate means different target states depending on source)
          rather than a linear pipeline.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE center with ALIGNED site (base chain through activation)."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
            - *site_align
            - *center_activate
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: QAAuditor
              captures: { center_v_now: $.data.version }
            - call: "POST /aha/quality-audits"
              payload: { target_training_center_id: "${center_id}", expected_training_center_version: "${center_v_now}" }
              as: QAAuditor
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /aha/quality-audits/${audit_id}/close"
              payload: { outcome: "CORRECTIVE_ACTION" }
              as: QAAuditor
              captures: { audit_status: $.data.status }
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: QAAuditor
              captures: { status_after_close: $.data.status }
            - call: "POST /aha/training-centers/${center_id}/reinstate"
              payload: {}
              as: NationalAdmin
              captures: { status_after_reinstate1: $.data.status }
            - call: "POST /aha/training-centers/${center_id}/suspend"
              payload: {}
              as: QAAuditor
              captures: { status_after_suspend: $.data.status }
            - call: "POST /aha/training-centers/${center_id}/reinstate"
              payload: {}
              as: QAAuditor
              captures: { status_after_reinstate2: $.data.status }
          assert:
            - "audit_status == CLOSED_CORRECTIVE"
            - "status_after_close == PROBATION"
            - "status_after_reinstate1 == ACTIVE"
            - "status_after_suspend == SUSPENDED"
            - "status_after_reinstate2 == PROBATION (reinstate from SUSPENDED lands on PROBATION, not ACTIVE)"
            - "TrainingCenter.${center_id}.probation_started_at is non-null after the second reinstate"

      - name: instructor_certification_cycle
        grounds:
          - state_machines.Instructor.CANDIDATE_to_MONITORED
          - state_machines.Instructor.MONITORED_to_CERTIFIED
          - state_machines.Instructor.CERTIFIED_to_EXPIRED
          - state_machines.Instructor.EXPIRED_to_CANDIDATE
        distinguishing_aspect: |
          Instructor's machine is a full cycle CANDIDATE -> MONITORED ->
