              as_user_id: "${camp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/deficiencies/${def_id}/review"
              payload: { decision: "ACCEPT_PLAN", reviewer_note: "accepted after the deadline" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/deficiencies/${def_id}/review"
