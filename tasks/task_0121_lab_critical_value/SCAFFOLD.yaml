scenario: |
  Laboratory Results & Critical Value Notification: order entry, sample transport
  chain, result release, critical value SMS/phone notification, acknowledgement
  receipt, retest workflow, CLIA compliance.

domain_name: lab-critical-value
api_prefix: /lab-orders

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - scheduled_deferred_actions
    - rate_threshold_triggers
    - ops_run_checkpoint
    - dual_variant_calculation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: Medical record number, unique per patient
        constraints: "regex ^[A-Z]{2}[0-9]{8}$; unique"
      - name: full_name
        type: string
        source: input
        description: Patient legal name
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD)
      - name: primary_phone_e164
        type: string
        source: input
        description: Phone in E.164 format used for SMS critical-value notifications
        constraints: "regex ^\\+[1-9][0-9]{6,14}$"
      - name: backup_phone_e164
        type: string
        source: input
        description: Optional backup phone for voice escalation
        default: null
        constraints: "nullable; regex ^\\+[1-9][0-9]{6,14}$ when present"
      - name: notification_consent
        type: enum
        source: input
        description: Whether patient has consented to SMS or only to voice contact
        default: SMS_AND_VOICE
        constraints: "values: SMS_AND_VOICE, VOICE_ONLY, NONE"

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - name: npi
        type: string
        source: input
        description: National Provider Identifier
        constraints: "regex ^[0-9]{10}$; unique"
      - name: full_name
        type: string
        source: input
        description: Clinician legal name
      - name: role_kind
        type: enum
        source: input
        description: Clinician's role for CLIA segregation-of-duties rules
        constraints: "values: ORDERING_PROVIDER, LAB_TECH, LAB_DIRECTOR"
      - name: phone_e164
        type: string
        source: input
        description: Clinician phone for SMS / voice notification
        constraints: "regex ^\\+[1-9][0-9]{6,14}$"
      - name: active
        type: boolean
        source: input
        description: Whether the clinician may currently order, run, or release tests
        default: true

  - name: TestPanel
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: LOINC-style panel code, unique
        constraints: "regex ^[A-Z0-9_]{3,20}$; unique"
      - name: name
        type: string
        source: input
        description: Human-readable panel name
      - name: clia_complexity
        type: enum
        source: input
        description: CLIA complexity tier (governs who may resultate the panel)
        constraints: "values: WAIVED, MODERATE, HIGH"
      - name: specimen_type
        type: enum
        source: input
        description: Required specimen type
        constraints: "values: BLOOD, URINE, CSF, SWAB"
      - name: stability_minutes
        type: integer
        source: input
        description: Maximum minutes from collection to lab receipt before specimen rejection
        constraints: "integer > 0"
      - name: analytes
        type: array
        source: input
        description: |
          Ordered list of analyte specs each with shape
          { analyte_code, unit, critical_low, critical_high } where critical_low/high
          may be null (one-sided ranges). critical_low < critical_high when both present.

  - name: LabOrder
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK to Patient.id
      - name: ordering_provider_id
        type: string
        source: input
        description: FK to Clinician.id; must have role_kind == ORDERING_PROVIDER and active == true
      - name: panel_id
        type: string
        source: input
        description: FK to TestPanel.id
      - name: priority
        type: enum
        source: input
        description: Routine vs STAT changes acknowledgement window
        default: ROUTINE
        constraints: "values: ROUTINE, STAT"
      - name: status
        type: enum
        source: system
        description: Order lifecycle (see §1.2 LabOrder state machine)
        default: ORDERED
        constraints: "values: ORDERED, COLLECTED, IN_TRANSIT, RECEIVED, RESULTED, RELEASED, CANCELED, REJECTED"
      - name: retest_count
        type: integer
        source: computed
        description: Number of times a RetestRequest has been auto-issued against this order
        default: 0
      - name: parent_order_id
        type: string
        source: system
        description: Self-reference to the original LabOrder this retest replaces; null on first order
        default: null
      - name: ordered_at
        type: datetime
        source: system
        description: Snapshot of clock at POST /lab-orders

  - name: Specimen
    parent: LabOrder
    common_fields: true
    fields:
      - name: lab_order_id
        type: string
        source: system
        description: FK to LabOrder.id
      - name: collected_by_id
        type: string
        source: input
        description: FK to Clinician.id; must have role_kind == LAB_TECH and active == true
      - name: collected_at
        type: datetime
        source: input
        description: When the sample was drawn
      - name: received_at
        type: datetime
        source: system
        description: Set when specimen arrives at the lab (last TransportLeg ARRIVED)
        default: null
      - name: rejected_reason
        type: enum
        source: system
        description: Why specimen was rejected, if any
        default: null
        constraints: "values (when set): STABILITY_EXCEEDED, CHAIN_BROKEN, CONTAMINATED, INSUFFICIENT_VOLUME"
      - name: status
        type: enum
        source: system
        description: Specimen lifecycle
        default: COLLECTED
        constraints: "values: COLLECTED, IN_TRANSIT, RECEIVED, REJECTED"

  - name: TransportLeg
    parent: Specimen
    common_fields: false
    fields:
      - name: specimen_id
        type: string
        source: system
        description: FK to Specimen.id
      - name: leg_index
        type: integer
        source: system
        description: 1-based order within the specimen's transport chain
      - name: from_location
        type: string
        source: input
        description: Origin facility code
      - name: to_location
        type: string
        source: input
        description: Destination facility code
      - name: departed_at
        type: datetime
        source: input
        description: Clock at leg departure
      - name: arrived_at
        type: datetime
        source: input
        description: Clock at leg arrival; null while leg is open
        default: null
      - name: courier_id
        type: string
        source: input
        description: Opaque courier identifier
      - name: status
        type: enum
        source: system
        description: Leg lifecycle
        default: DEPARTED
        constraints: "values: DEPARTED, ARRIVED, BROKEN"

  - name: LabResult
    parent: LabOrder
    common_fields: true
    fields:
      - name: lab_order_id
        type: string
        source: system
        description: FK to LabOrder.id
      - name: resulted_by_id
        type: string
        source: input
        description: FK to Clinician.id; must be LAB_TECH for WAIVED/MODERATE panels or LAB_DIRECTOR for HIGH
      - name: released_by_id
        type: string
        source: input
        description: FK to Clinician.id; LAB_DIRECTOR only; MUST differ from resulted_by_id (CLIA SoD)
        default: null
      - name: measurements
        type: array
        source: input
        description: |
          Array of { analyte_code, value, unit } — one entry per TestPanel.analytes entry.
          unit MUST match the panel's declared unit for that analyte.
      - name: critical_flags
        type: array
        source: computed
        description: |
          Subset of measurements whose value is OUTSIDE the panel's
          [critical_low, critical_high] range — see calc compute_critical_flags.
      - name: severity_score
        type: number
        source: computed
        description: Weighted critical severity (see calc severity_score_provisional / _final)
        default: 0
      - name: status
        type: enum
        source: system
        description: Result lifecycle
        default: DRAFT
        constraints: "values: DRAFT, RELEASED, AMENDED, RETRACTED"
      - name: resulted_at
        type: datetime
        source: system
        description: Clock at POST /results
      - name: released_at
        type: datetime
        source: system
        description: Clock at POST /results/{id}/release
        default: null

  - name: CriticalNotification
    parent: LabResult
    common_fields: true
    fields:
      - name: lab_result_id
        type: string
        source: system
        description: FK to LabResult.id
      - name: recipient_clinician_id
        type: string
        source: system
        description: Cloned from LabOrder.ordering_provider_id at release time
      - name: channel
        type: enum
        source: system
        description: Current notification channel (SMS first, escalates to VOICE after window)
        default: SMS
        constraints: "values: SMS, VOICE"
      - name: attempt_count
        type: integer
        source: computed
        description: Total SMS + VOICE attempts (see calc attempt_escalation)
        default: 0
      - name: first_sent_at
        type: datetime
        source: system
        description: Clock at first notification attempt
      - name: ack_deadline_at
        type: datetime
        source: computed
        description: |
          first_sent_at + window where window = 30 minutes if LabOrder.priority == ROUTINE
          and 10 minutes if priority == STAT.
      - name: status
        type: enum
        source: system
        description: Notification lifecycle
        default: PENDING
        constraints: "values: PENDING, ACKNOWLEDGED, ESCALATED, FAILED"

  - name: AcknowledgementReceipt
    parent: CriticalNotification
    common_fields: false
    fields:
      - name: critical_notification_id
        type: string
        source: system
        description: FK to CriticalNotification.id
      - name: acknowledged_by_id
        type: string
        source: input
        description: FK to Clinician.id; MUST equal CriticalNotification.recipient_clinician_id
      - name: acknowledged_at
        type: datetime
        source: system
        description: Clock at POST /notifications/{id}/acknowledge
      - name: read_back_text
        type: string
        source: input
        description: Free-text read-back of critical values (CLIA requires read-back for HIGH complexity)
      - name: ack_latency_minutes
        type: number
        source: computed
        description: (acknowledged_at - CriticalNotification.first_sent_at) in minutes, 2dp

  - name: RetestRequest
    parent: LabOrder
    common_fields: true
    fields:
      - name: lab_order_id
        type: string
        source: system
        description: FK to original LabOrder.id triggering the retest
      - name: reason
        type: enum
        source: system
        description: Why the retest was issued
        constraints: "values: SPECIMEN_REJECTED, CRITICAL_UNACKNOWLEDGED, RESULT_AMENDED"
      - name: new_lab_order_id
        type: string
        source: system
        description: FK to the freshly created LabOrder with parent_order_id set
        default: null
      - name: status
        type: enum
        source: system
        description: Retest lifecycle
        default: ISSUED
        constraints: "values: ISSUED, FULFILLED, CANCELED"

  - name: ComplianceAuditEvent
    parent: null
    common_fields: false
    fields:
      - name: event_type
        type: enum
        source: system
        description: CLIA-relevant event class
        constraints: "values: ORDER_PLACED, SPECIMEN_REJECTED, RESULT_RELEASED, CRITICAL_NOTIFIED, CRITICAL_ACKED, CRITICAL_ESCALATED, RETEST_ISSUED, AMENDMENT_RECORDED"
      - name: lab_order_id
        type: string
        source: system
        description: FK to LabOrder.id (always set)
      - name: actor_id
        type: string
        source: system
        description: Clinician.id or "system" when triggered by sweep
      - name: payload
        type: object
        source: system
        description: Event-specific JSON snapshot (e.g., critical analyte codes, latencies)

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LabOrder
    initial_state: ORDERED
    terminal_states: [RELEASED, CANCELED, REJECTED]
    transitions:
      - from: ORDERED
        to: COLLECTED
        trigger: "POST /lab-orders/{id}/specimens"
        actor: LabTech
        preconditions:
          - "LabOrder.status == ORDERED"
          - "collected_by.role_kind == LAB_TECH AND collected_by.active == true"
          - "collected_at <= now()"
        side_effects:
          - "Create Specimen with status=COLLECTED"
          - "Write ComplianceAuditEvent(event_type=ORDER_PLACED) on creation of order (separate event)"
      - from: COLLECTED
        to: IN_TRANSIT
        trigger: "POST /specimens/{id}/transport-legs (first leg only)"
        actor: LabTech
        preconditions:
          - "Specimen.status == COLLECTED for first leg; subsequent legs require Specimen.status == IN_TRANSIT and previous leg.status == ARRIVED"
        side_effects:
          - "Specimen.status -> IN_TRANSIT"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /transport-legs/{id}/arrive on the final leg whose to_location is the lab"
        actor: LabTech
        preconditions:
          - "TransportLeg.status == DEPARTED"
          - "to_location of leg matches the panel's lab (encoded as constant LAB_LOCATION_CODE)"
          - "Specimen.status == IN_TRANSIT"
        side_effects:
          - "TransportLeg.status -> ARRIVED"
          - "Specimen.received_at = leg.arrived_at; Specimen.status -> RECEIVED; LabOrder.status -> RECEIVED"
          - "Run calc specimen_stability_check; if exceeded => Specimen.status -> REJECTED, LabOrder.status -> REJECTED, auto-issue RetestRequest(reason=SPECIMEN_REJECTED), write ComplianceAuditEvent(SPECIMEN_REJECTED)"
      - from: RECEIVED
        to: RESULTED
        trigger: "POST /lab-orders/{id}/results"
        actor: LabTech | LabDirector
        preconditions:
          - "LabOrder.status == RECEIVED"
          - "Specimen.status == RECEIVED"
          - "resulted_by_id satisfies CLIA complexity: WAIVED|MODERATE -> LAB_TECH or LAB_DIRECTOR; HIGH -> LAB_DIRECTOR only"
          - "measurements covers every analyte in panel exactly once with matching units"
        side_effects:
          - "Create LabResult(status=DRAFT)"
          - "Run calc compute_critical_flags"
          - "Run calc severity_score_provisional"
          - "LabOrder.status -> RESULTED"
      - from: RESULTED
        to: RELEASED
        trigger: "POST /results/{id}/release"
        actor: LabDirector
        preconditions:
          - "LabResult.status == DRAFT"
          - "released_by.role_kind == LAB_DIRECTOR AND released_by.active == true"
          - "released_by_id != resulted_by_id (CLIA segregation of duties)"
          - "LabOrder.status == RESULTED"
        side_effects:
          - "LabResult.status -> RELEASED; released_at = now()"
          - "LabOrder.status -> RELEASED"
          - "Run calc severity_score_final (replaces provisional)"
          - "If LabResult.critical_flags is non-empty => create CriticalNotification(channel=SMS, status=PENDING, first_sent_at=now()), compute ack_deadline_at, write ComplianceAuditEvent(RESULT_RELEASED) AND ComplianceAuditEvent(CRITICAL_NOTIFIED)"
          - "If LabResult.critical_flags is empty => write ComplianceAuditEvent(RESULT_RELEASED) only"
      - from: ORDERED
        to: CANCELED
        trigger: "POST /lab-orders/{id}/cancel"
        actor: OrderingProvider
        preconditions:
          - "LabOrder.status == ORDERED"
          - "actor.id == LabOrder.ordering_provider_id"
        side_effects:
          - "LabOrder.status -> CANCELED"

  - entity: Specimen
    initial_state: COLLECTED
    terminal_states: [RECEIVED, REJECTED]
    transitions:
      - from: COLLECTED
        to: IN_TRANSIT
        trigger: "POST /specimens/{id}/transport-legs (first leg)"
        actor: LabTech
        preconditions:
          - "Specimen.status == COLLECTED"
          - "leg.departed_at >= Specimen.collected_at"
        side_effects:
          - "Create TransportLeg(leg_index=1, status=DEPARTED)"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /transport-legs/{id}/arrive on final leg to LAB_LOCATION_CODE"
        actor: LabTech
        preconditions:
          - "Previous leg (if any) has status == ARRIVED"
          - "leg.arrived_at >= leg.departed_at"
        side_effects:
          - "TransportLeg.status -> ARRIVED; Specimen.received_at = leg.arrived_at"
          - "If specimen_stability_check fails => Specimen.status -> REJECTED with rejected_reason=STABILITY_EXCEEDED instead of RECEIVED"
      - from: IN_TRANSIT
        to: REJECTED
        trigger: "POST /transport-legs/{id}/report-break"
        actor: LabTech
        preconditions:
          - "TransportLeg.status == DEPARTED"
        side_effects:
          - "TransportLeg.status -> BROKEN; Specimen.status -> REJECTED with rejected_reason=CHAIN_BROKEN"
          - "LabOrder.status -> REJECTED; auto-create RetestRequest(reason=SPECIMEN_REJECTED, new_lab_order_id=newly minted LabOrder cloning panel & patient with parent_order_id=original; new LabOrder.retest_count = original.retest_count + 1); write ComplianceAuditEvent(SPECIMEN_REJECTED) then ComplianceAuditEvent(RETEST_ISSUED)"

  - entity: LabResult
    initial_state: DRAFT
    terminal_states: [RETRACTED]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /results/{id}/release"
        actor: LabDirector
        preconditions:
          - "released_by_id != resulted_by_id"
          - "LabResult.status == DRAFT"
        side_effects:
          - "LabResult.released_at = now()"
          - "Cascade: LabOrder.status -> RELEASED"
      - from: RELEASED
        to: AMENDED
        trigger: "POST /results/{id}/amend"
        actor: LabDirector
        preconditions:
          - "LabResult.status == RELEASED"
          - "actor.role_kind == LAB_DIRECTOR"
        side_effects:
          - "Append AmendmentRecord to ComplianceAuditEvent(AMENDMENT_RECORDED)"
          - "Recompute critical_flags and severity_score_final"
          - "If new critical_flags differ from prior critical_flags => auto-create RetestRequest(reason=RESULT_AMENDED) AND open a fresh CriticalNotification only for newly-critical analytes"
      - from: AMENDED
        to: RETRACTED
        trigger: "POST /results/{id}/retract"
        actor: LabDirector
        preconditions:
          - "LabResult.status == AMENDED"
        side_effects:
          - "LabResult.status -> RETRACTED; mark LabOrder.status remains RELEASED but flagged via audit event"

  - entity: CriticalNotification
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, FAILED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /notifications/{id}/acknowledge"
        actor: OrderingProvider
        preconditions:
          - "CriticalNotification.status == PENDING OR ESCALATED"
          - "acknowledged_by_id == recipient_clinician_id"
          - "If panel.clia_complexity == HIGH then read_back_text MUST contain (case-insensitive substring) each analyte_code in critical_flags"
        side_effects:
          - "Create AcknowledgementReceipt"
          - "Compute ack_latency_minutes"
          - "Write ComplianceAuditEvent(CRITICAL_ACKED) with payload.latency_minutes"
      - from: PENDING
        to: ESCALATED
        trigger: "POST /_sweep/run (system sweep) when now() >= ack_deadline_at AND channel == SMS"
        actor: system
        preconditions:
          - "CriticalNotification.status == PENDING"
          - "now() >= ack_deadline_at"
          - "channel == SMS"
        side_effects:
          - "channel -> VOICE; attempt_count += 1; first_sent_at NOT reset; ack_deadline_at extended by 10 minutes regardless of priority"
          - "Write ComplianceAuditEvent(CRITICAL_ESCALATED)"
      - from: ESCALATED
        to: FAILED
        trigger: "POST /_sweep/run when now() >= ack_deadline_at AND channel == VOICE"
        actor: system
        preconditions:
          - "CriticalNotification.status == ESCALATED"
          - "channel == VOICE"
          - "now() >= ack_deadline_at"
        side_effects:
          - "status -> FAILED"
          - "Auto-create RetestRequest(reason=CRITICAL_UNACKNOWLEDGED) cloning the LabOrder to a fresh order with parent_order_id set, retest_count incremented"
          - "Write ComplianceAuditEvent(CRITICAL_ESCALATED) with payload.failure=true"

  - entity: RetestRequest
    initial_state: ISSUED
    terminal_states: [FULFILLED, CANCELED]
    transitions:
      - from: ISSUED
        to: FULFILLED
        trigger: "system, when the spawned LabOrder reaches RELEASED"
        actor: system
        preconditions:
          - "RetestRequest.new_lab_order_id is non-null"
          - "Referenced LabOrder.status == RELEASED"
        side_effects:
          - "status -> FULFILLED"
      - from: ISSUED
        to: CANCELED
        trigger: "POST /retest-requests/{id}/cancel"
        actor: OrderingProvider
        preconditions:
          - "actor.id == original LabOrder.ordering_provider_id"
          - "RetestRequest.status == ISSUED"
          - "RetestRequest.new_lab_order_id is null OR referenced LabOrder.status == ORDERED"
        side_effects:
          - "If new_lab_order_id non-null and referenced LabOrder.status == ORDERED => referenced LabOrder.status -> CANCELED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two clinicians simultaneously POST /results/{id}/release for the same DRAFT result"
    guarantee: "Exactly one release succeeds; second is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on LabResult.status flip DRAFT -> RELEASED"

  - scenario: "Sweep escalation runs concurrently with the recipient's acknowledgement POST"
    guarantee: "If ack lands first the notification moves to ACKNOWLEDGED and the sweep MUST NOT escalate; if the sweep escalates first the late ack still wins but the ESCALATED event already in the audit log is not rolled back"
    error_id: ERR_ALREADY_ACKNOWLEDGED
    http_status: 409
    serialization: "First-writer-wins on CriticalNotification.status; loser sweep is silently skipped, loser ack returns ERR_ALREADY_ACKNOWLEDGED only when status is already ACKNOWLEDGED"

  - scenario: "Two transport-leg arrives posted simultaneously on the same leg id"
    guarantee: "Exactly one arrival succeeds"
    error_id: ERR_LEG_ALREADY_ARRIVED
    http_status: 409
    serialization: "First-writer-wins on TransportLeg.status DEPARTED -> ARRIVED"

  - scenario: "Amend and retract attempted simultaneously on a RELEASED result"
    guarantee: "Exactly one operation succeeds"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on LabResult.status"

  - scenario: "Two POSTs to create a Specimen on the same LabOrder"
    guarantee: "At most one Specimen per LabOrder; second is rejected"
    error_id: ERR_SPECIMEN_ALREADY_EXISTS
    http_status: 409
    serialization: "Unique constraint on Specimen.lab_order_id"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: compute_critical_flags
    trigger: "Whenever LabResult is created (POST /lab-orders/{id}/results) and on amendment (POST /results/{id}/amend)"
    algorithm: threshold
    formula: |
      critical_flags = []
      for m in measurements:
        spec = panel.analytes[m.analyte_code]
        # Strict outside-the-range semantics:
        # value is critical iff (critical_low is not null AND value < critical_low)
        #                    OR (critical_high is not null AND value > critical_high)
        if spec.critical_low is not None and m.value < spec.critical_low:
          critical_flags.append({analyte_code: m.analyte_code, side: "LOW", value: m.value, bound: spec.critical_low})
        elif spec.critical_high is not None and m.value > spec.critical_high:
          critical_flags.append({analyte_code: m.analyte_code, side: "HIGH", value: m.value, bound: spec.critical_high})
      return critical_flags
    input_set: "All measurement entries in the LabResult, paired with their panel analyte spec"
    constants: {}
    precision: "Compare values as decimals at 4 fractional digits; do NOT round before comparison"
    variants: []

  - name: severity_score_provisional
    trigger: "On LabResult creation, before release"
    algorithm: weighted_scoring
    formula: |
      # Provisional uses ONLY confirmed critical flags from this single result.
      # Per-analyte weight = 2 if side=='HIGH', 1 if side=='LOW'.
      # Score is rounded ONCE at the end (sum-then-round).
      raw = 0
      for f in critical_flags:
        per_analyte_distance = abs(f.value - f.bound) / max(abs(f.bound), 1)
        weight = 2 if f.side == "HIGH" else 1
        raw += weight * per_analyte_distance
      return round(raw, 2)   # round_half_up to 2 decimal places
    input_set: "critical_flags of this LabResult only"
    constants:
      HIGH_WEIGHT: 2
      LOW_WEIGHT: 1
    precision: "Sum-then-round; round_half_up; 2 decimal places"
    variants:
      - name: provisional
        when: "LabResult.status == DRAFT"
        difference: "Uses critical_flags from this single result only, no historical context"

  - name: severity_score_final
    trigger: "On POST /results/{id}/release AND on POST /results/{id}/amend"
    algorithm: weighted_scoring
    formula: |
      # Final uses round-then-sum: round per-analyte sub-score to 2 dp BEFORE summing,
      # AND blends in patient history (latest two RELEASED results on same patient + panel).
      # This is structurally different from provisional in BOTH input set and rounding order.
      history = latest 2 RELEASED LabResults for same patient_id AND same panel_id, ordered by released_at DESC, EXCLUDING this result
      historical_factor = 1.0 + 0.25 * count(history that had any critical_flags)
      raw_pieces = []
      for f in critical_flags:
        per_analyte_distance = abs(f.value - f.bound) / max(abs(f.bound), 1)
        weight = 2 if f.side == "HIGH" else 1
        piece = round(weight * per_analyte_distance * historical_factor, 2)  # round_half_up
        raw_pieces.append(piece)
      return sum(raw_pieces)   # NO further rounding
    input_set: "critical_flags of this LabResult PLUS the latest 2 RELEASED LabResults on same patient+panel ordered by released_at DESC excluding self"
    constants:
      HIGH_WEIGHT: 2
      LOW_WEIGHT: 1
      HISTORY_LOOKBACK: 2
      HISTORY_BOOST_PER_PRIOR_CRITICAL: 0.25
    precision: "Round-per-piece-then-sum; round_half_up; 2 decimal places per piece"
    variants:
      - name: final
        when: "LabResult.status transitions to RELEASED or AMENDED"
        difference: "Different inclusion set (adds 2 historical results) AND different rounding order (round-per-piece-then-sum) -> produces a different score than provisional for the same measurements"

  - name: specimen_stability_check
    trigger: "On POST /transport-legs/{id}/arrive when the leg's to_location == LAB_LOCATION_CODE"
    algorithm: threshold
    formula: |
      transit_minutes = (leg.arrived_at - Specimen.collected_at) total minutes (float, 4 dp)
      stability_minutes = panel.stability_minutes
      # Stability is EXCEEDED iff transit_minutes > stability_minutes (strict >).
      # transit_minutes == stability_minutes is ON-TIME (accepted).
      return transit_minutes > stability_minutes
    input_set: "Specimen.collected_at, leg.arrived_at, panel.stability_minutes"
    constants:
      LAB_LOCATION_CODE: "LAB_MAIN"
    precision: "Minute arithmetic at 4 fractional digits; strict > comparison (boundary precision matters)"
    variants: []

  - name: ack_deadline
    trigger: "On CriticalNotification creation"
    algorithm: threshold
    formula: |
      window_minutes = 10 if LabOrder.priority == "STAT" else 30
      ack_deadline_at = first_sent_at + window_minutes minutes
    input_set: "LabOrder.priority, CriticalNotification.first_sent_at"
    constants:
      STAT_WINDOW_MIN: 10
      ROUTINE_WINDOW_MIN: 30
      ESCALATION_EXTENSION_MIN: 10
    precision: "Minute precision"
    variants: []

  - name: attempt_escalation
    trigger: "Sweep advance via POST /_sweep/run"
    algorithm: chronological
    formula: |
      # Walks notifications in order of ack_deadline_at ASC, breaking ties by created_at ASC.
      # The ORDER of processing matters because a sweep run that processes two notifications
      # at once must still produce deterministic audit-event ordering.
      for n in notifications where status IN (PENDING, ESCALATED) order by ack_deadline_at ASC, created_at ASC:
        if now() < n.ack_deadline_at: skip
        elif n.status == PENDING and n.channel == SMS:
            n.channel = VOICE
            n.status = ESCALATED
            n.attempt_count += 1
            n.ack_deadline_at += 10 minutes
        elif n.status == ESCALATED and n.channel == VOICE:
            n.status = FAILED
            n.attempt_count += 1
            auto_create RetestRequest(reason=CRITICAL_UNACKNOWLEDGED, ...)
    input_set: "All CriticalNotification with status IN (PENDING, ESCALATED)"
    constants:
      ESCALATION_EXTENSION_MIN: 10
    precision: "Order-sensitive — sort key fixed at (ack_deadline_at ASC, created_at ASC)"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Each id segment in the URL path resolves to a live row, left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys (patient_id, ordering_provider_id, panel_id, collected_by_id, resulted_by_id, released_by_id, acknowledged_by_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /lab-orders; POST /lab-orders/{id}/specimens; POST /lab-orders/{id}/results; POST /results/{id}/release; POST /notifications/{id}/acknowledge"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is valid (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all mutating endpoints"

  - priority: 6
    category: business_safety
    check: "CLIA segregation of duties: released_by_id MUST differ from resulted_by_id on POST /results/{id}/release"
    error_id: ERR_CLIA_SOD_VIOLATION
    http_status: 422
    applies_to: "POST /results/{id}/release"

  - priority: 7
    category: business_safety
    check: "CLIA complexity tiering: resulted_by must be LAB_DIRECTOR when panel.clia_complexity == HIGH; LAB_TECH or LAB_DIRECTOR allowed for MODERATE/WAIVED"
    error_id: ERR_CLIA_COMPLEXITY_VIOLATION
    http_status: 422
    applies_to: "POST /lab-orders/{id}/results"

  - priority: 8
    category: business_safety
    check: "Patient consent must permit the chosen notification channel: notification_consent == NONE blocks any CriticalNotification creation (release endpoint fails)"
    error_id: ERR_PATIENT_CONSENT_BLOCKED
    http_status: 422
    applies_to: "POST /results/{id}/release"

  - priority: 9
    category: business_referential
    check: "acknowledged_by_id MUST equal CriticalNotification.recipient_clinician_id"
    error_id: ERR_ACK_BY_WRONG_RECIPIENT
    http_status: 422
    applies_to: "POST /notifications/{id}/acknowledge"

  - priority: 10
    category: business_referential
    check: "For panel.clia_complexity == HIGH, read_back_text MUST contain (case-insensitive) every analyte_code in critical_flags"
    error_id: ERR_READBACK_INCOMPLETE
    http_status: 422
    applies_to: "POST /notifications/{id}/acknowledge"

  - priority: 11
    category: business_constraint
    check: "Specimen.collected_at <= now() AND leg.arrived_at >= leg.departed_at AND leg.departed_at >= Specimen.collected_at"
    error_id: ERR_TIME_ORDER_INVALID
    http_status: 422
    applies_to: "POST /lab-orders/{id}/specimens; POST /specimens/{id}/transport-legs; POST /transport-legs/{id}/arrive"

  - priority: 12
    category: business_constraint
    check: "Transport leg chain monotonicity: new leg.leg_index = max(existing leg_index)+1 AND new.from_location == previous.to_location"
    error_id: ERR_TRANSPORT_CHAIN_BROKEN
    http_status: 422
    applies_to: "POST /specimens/{id}/transport-legs"

  - priority: 13
    category: business_constraint
    check: "measurements MUST cover every analyte in panel.analytes exactly once with matching unit"
    error_id: ERR_MEASUREMENTS_INCOMPLETE
    http_status: 422
    applies_to: "POST /lab-orders/{id}/results"

  - priority: 14
    category: business_constraint
    check: "ordering_provider, collected_by, resulted_by, released_by Clinician.active == true"
    error_id: ERR_CLINICIAN_INACTIVE
    http_status: 422
    applies_to: "POST /lab-orders; POST /lab-orders/{id}/specimens; POST /lab-orders/{id}/results; POST /results/{id}/release"

  - priority: 15
    category: business_temporal
    check: "Acknowledgement attempt only valid when CriticalNotification.status IN (PENDING, ESCALATED) — already ACKNOWLEDGED returns ERR_ALREADY_ACKNOWLEDGED (distinct from generic state error)"
    error_id: ERR_ALREADY_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /notifications/{id}/acknowledge"

  - priority: 16
    category: business_constraint
    check: "Optimistic concurrency: when client supplies `version`, it MUST match server version of the resource"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH/PUT and selected POSTs that mutate existing entities"

  - priority: 17
    category: business_constraint
    check: "Pagination params: limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Patients -----
  - method: POST
    path: "/patients"
    description: "Create a patient"
    roles: [OrderingProvider, LabDirector]
    code: 201
    input: [mrn, full_name, date_of_birth, primary_phone_e164, "backup_phone_e164?", "notification_consent?"]
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients/{id}"
    description: "Fetch a patient"
    roles: [OrderingProvider, LabTech, LabDirector]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients"
    description: "List patients (filter by mrn substring, paginate)"
    roles: [OrderingProvider, LabTech, LabDirector]
    code: 200
    input: ["mrn?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []

  # ----- Clinicians -----
  - method: POST
    path: "/clinicians"
    description: "Register a clinician (Lab Director only)"
    roles: [LabDirector]
    code: 201
    input: [npi, full_name, role_kind, phone_e164]
    output: Clinician
    side_effects: []

  - method: PATCH
    path: "/clinicians/{id}"
    description: "Update clinician active flag or phone; supports version"
    roles: [LabDirector]
    code: 200
    input: ["active?", "phone_e164?", "version?"]
    output: Clinician
    side_effects: []

  - method: GET
    path: "/clinicians/{id}"
    description: "Fetch a clinician"
    roles: [OrderingProvider, LabTech, LabDirector]
    code: 200
    input: []
    output: Clinician
    side_effects: []

  # ----- Test Panels -----
  - method: POST
    path: "/test-panels"
    description: "Create a CLIA panel definition (Lab Director only)"
    roles: [LabDirector]
    code: 201
    input: [code, name, clia_complexity, specimen_type, stability_minutes, analytes]
    output: TestPanel
    side_effects: []

  - method: GET
    path: "/test-panels/{id}"
    description: "Fetch a panel"
    roles: [OrderingProvider, LabTech, LabDirector]
    code: 200
    input: []
    output: TestPanel
    side_effects: []

  # ----- Lab Orders -----
  - method: POST
    path: "/lab-orders"
    description: "Place a lab order"
    roles: [OrderingProvider]
    code: 201
    input: [patient_id, ordering_provider_id, panel_id, "priority?"]
    output: LabOrder
    side_effects:
      - "LabOrder.status=ORDERED; write ComplianceAuditEvent(ORDER_PLACED)"

  - method: GET
    path: "/lab-orders/{id}"
    description: "Fetch a lab order"
    roles: [OrderingProvider, LabTech, LabDirector]
    code: 200
    input: []
    output: LabOrder
    side_effects: []

  - method: GET
    path: "/lab-orders"
    description: "List lab orders (filter by status, patient_id, panel_id; paginate)"
    roles: [OrderingProvider, LabTech, LabDirector]
    code: 200
    input: ["status?", "patient_id?", "panel_id?", "limit?", "offset?"]
    output: "LabOrder[]"
    side_effects: []

  - method: POST
    path: "/lab-orders/{id}/cancel"
    description: "Cancel an ORDERED lab order; ordering provider only"
    roles: [OrderingProvider]
    code: 200
    input: ["version?"]
    output: LabOrder
    side_effects:
      - "LabOrder.status -> CANCELED"

  - method: POST
    path: "/lab-orders/{id}/specimens"
    description: "Record specimen collection"
    roles: [LabTech]
    code: 201
    input: [collected_by_id, collected_at]
    output: Specimen
    side_effects:
      - "Create Specimen(status=COLLECTED); LabOrder.status -> COLLECTED"

  - method: POST
    path: "/lab-orders/{id}/results"
    description: "Resultate the order (creates DRAFT LabResult)"
    roles: [LabTech, LabDirector]
    code: 201
    input: [resulted_by_id, measurements]
    output: LabResult
    side_effects:
      - "Create LabResult(status=DRAFT); run compute_critical_flags; run severity_score_provisional; LabOrder.status -> RESULTED"

  # ----- Specimens & Transport -----
  - method: GET
    path: "/specimens/{id}"
    description: "Fetch a specimen"
    roles: [OrderingProvider, LabTech, LabDirector]
    code: 200
    input: []
    output: Specimen
    side_effects: []

  - method: POST
    path: "/specimens/{id}/transport-legs"
    description: "Open a new transport leg; first leg flips Specimen to IN_TRANSIT"
    roles: [LabTech]
    code: 201
    input: [from_location, to_location, departed_at, courier_id]
    output: TransportLeg
    side_effects:
      - "Create TransportLeg(status=DEPARTED, leg_index=max+1); if first leg also Specimen.status -> IN_TRANSIT, LabOrder.status -> IN_TRANSIT"

  - method: GET
    path: "/specimens/{id}/transport-legs"
    description: "List transport legs of a specimen in leg_index order"
    roles: [OrderingProvider, LabTech, LabDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "TransportLeg[]"
    side_effects: []

  - method: POST
    path: "/transport-legs/{id}/arrive"
    description: "Mark leg arrival; final leg to LAB_MAIN may flip Specimen to RECEIVED or REJECTED"
    roles: [LabTech]
    code: 200
    input: [arrived_at]
    output: TransportLeg
    side_effects:
      - "TransportLeg.status -> ARRIVED; if to_location == LAB_MAIN run specimen_stability_check; flip Specimen + LabOrder accordingly; on rejection auto-create RetestRequest"

  - method: POST
    path: "/transport-legs/{id}/report-break"
    description: "Report a broken chain of custody for an open leg"
    roles: [LabTech]
    code: 200
    input: []
    output: TransportLeg
    side_effects:
      - "TransportLeg.status -> BROKEN; Specimen.status -> REJECTED(rejected_reason=CHAIN_BROKEN); LabOrder.status -> REJECTED; auto-create RetestRequest"

  # ----- Results & release -----
  - method: GET
    path: "/results/{id}"
    description: "Fetch a lab result"
    roles: [OrderingProvider, LabTech, LabDirector]
    code: 200
    input: []
    output: LabResult
    side_effects: []

  - method: POST
    path: "/results/{id}/release"
    description: "Release a DRAFT result (CLIA SoD: released_by_id != resulted_by_id)"
    roles: [LabDirector]
    code: 200
    input: [released_by_id, "version?"]
    output: LabResult
    side_effects:
      - "LabResult.status -> RELEASED; run severity_score_final; if critical_flags non-empty create CriticalNotification + audit events"

  - method: POST
    path: "/results/{id}/amend"
    description: "Amend a RELEASED result"
    roles: [LabDirector]
    code: 200
    input: [measurements, "version?"]
    output: LabResult
    side_effects:
      - "Recompute critical_flags and severity_score_final; if new critical_flags appear, open a new CriticalNotification scoped to them; if amendment changes critical set auto-create RetestRequest(reason=RESULT_AMENDED); write ComplianceAuditEvent(AMENDMENT_RECORDED)"

  - method: POST
    path: "/results/{id}/retract"
    description: "Retract an AMENDED result"
    roles: [LabDirector]
    code: 200
    input: ["version?"]
    output: LabResult
    side_effects:
      - "LabResult.status -> RETRACTED; ComplianceAuditEvent(AMENDMENT_RECORDED) with retract=true"

  # ----- Critical notifications & acknowledgement -----
  - method: GET
    path: "/notifications/{id}"
    description: "Fetch a critical notification"
    roles: [OrderingProvider, LabDirector]
    code: 200
    input: []
    output: CriticalNotification
    side_effects: []

  - method: GET
    path: "/notifications"
    description: "List notifications (filter by status, recipient_clinician_id; paginate)"
    roles: [OrderingProvider, LabDirector]
    code: 200
    input: ["status?", "recipient_clinician_id?", "limit?", "offset?"]
    output: "CriticalNotification[]"
    side_effects: []

  - method: POST
    path: "/notifications/{id}/acknowledge"
    description: "Recipient ordering provider acknowledges a critical notification with read-back"
    roles: [OrderingProvider]
    code: 200
    input: [acknowledged_by_id, read_back_text]
    output: AcknowledgementReceipt
    side_effects:
      - "Create AcknowledgementReceipt; CriticalNotification.status -> ACKNOWLEDGED; ComplianceAuditEvent(CRITICAL_ACKED)"

  # ----- Retests -----
  - method: GET
    path: "/retest-requests/{id}"
    description: "Fetch a retest request"
    roles: [OrderingProvider, LabTech, LabDirector]
    code: 200
    input: []
    output: RetestRequest
    side_effects: []

  - method: GET
    path: "/retest-requests"
    description: "List retest requests"
    roles: [OrderingProvider, LabTech, LabDirector]
    code: 200
    input: ["status?", "lab_order_id?", "limit?", "offset?"]
    output: "RetestRequest[]"
    side_effects: []

  - method: POST
    path: "/retest-requests/{id}/cancel"
    description: "Ordering provider cancels an issued retest before its replacement order is collected"
    roles: [OrderingProvider]
    code: 200
    input: []
    output: RetestRequest
    side_effects:
      - "RetestRequest.status -> CANCELED; if replacement LabOrder still in ORDERED, cancel it too"

  # ----- Compliance audit (read-only) -----
  - method: GET
    path: "/audit-events"
    description: "List CLIA audit events (filter by lab_order_id, event_type)"
    roles: [LabDirector]
    code: 200
    input: ["lab_order_id?", "event_type?", "limit?", "offset?"]
    output: "ComplianceAuditEvent[]"
    side_effects: []

  # ----- Test-driving endpoints (clock, sweep) -----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the system clock for tests (ISO 8601 timestamp)"
    roles: [LabDirector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Sets server's now() to the provided timestamp"

  - method: GET
    path: "/_clock"
    description: "Fetch current system clock"
    roles: [OrderingProvider, LabTech, LabDirector]
    code: 200
    input: []
    output: null
    side_effects: []

  - method: POST
    path: "/_sweep/run"
    description: "Run the notification sweep (escalation + failure)"
    roles: [LabDirector]
    code: 200
    input: []
    output: null
    side_effects:
      - "Per calc attempt_escalation: PENDING+SMS+expired -> ESCALATED+VOICE; ESCALATED+VOICE+expired -> FAILED with auto-retest"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or empty X-User-Role / X-User-ID header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint per §1.7 RBAC"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced id (path or body FK) does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a valid state for the requested transition"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Supplied version != server version"
  - id: ERR_CLIA_SOD_VIOLATION
    http: 422
    condition: "released_by_id == resulted_by_id on release"
  - id: ERR_CLIA_COMPLEXITY_VIOLATION
    http: 422
    condition: "Non-LAB_DIRECTOR attempts to resultate a HIGH complexity panel"
  - id: ERR_PATIENT_CONSENT_BLOCKED
    http: 422
    condition: "Release would require notification but Patient.notification_consent == NONE"
  - id: ERR_ACK_BY_WRONG_RECIPIENT
    http: 422
    condition: "acknowledged_by_id != CriticalNotification.recipient_clinician_id"
  - id: ERR_READBACK_INCOMPLETE
    http: 422
    condition: "HIGH complexity panel ack lacks every critical analyte_code in read_back_text"
  - id: ERR_TIME_ORDER_INVALID
    http: 422
    condition: "Timestamps violate ordering (collected_at <= now(); departed_at >= collected_at; arrived_at >= departed_at)"
  - id: ERR_TRANSPORT_CHAIN_BROKEN
    http: 422
    condition: "Leg from_location != previous leg.to_location, or previous leg not yet ARRIVED"
  - id: ERR_MEASUREMENTS_INCOMPLETE
    http: 422
    condition: "Measurements do not cover every panel analyte exactly once with matching unit"
  - id: ERR_CLINICIAN_INACTIVE
    http: 422
    condition: "Referenced clinician has active == false"
  - id: ERR_ALREADY_ACKNOWLEDGED
    http: 409
    condition: "Notification already ACKNOWLEDGED at the time of the new ack attempt"
  - id: ERR_LEG_ALREADY_ARRIVED
    http: 409
    condition: "Transport leg has already been marked ARRIVED"
  - id: ERR_SPECIMEN_ALREADY_EXISTS
    http: 409
    condition: "A specimen already exists for this LabOrder"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1,100] or offset < 0"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic input validation failure (e.g. malformed E.164, malformed ISO8601, missing required field)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OrderingProvider
    description: "Clinician who places lab orders and acknowledges critical notifications for their patients"
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /lab-orders"
      - "POST /lab-orders/{id}/cancel"
      - "POST /notifications/{id}/acknowledge"
      - "POST /retest-requests/{id}/cancel"
    shared_operations:
      - "POST /patients (shared with LabDirector)"
      - "GET reads on patients, clinicians, panels, orders, specimens, transport legs, results, notifications, retest-requests"

  - name: LabTech
    description: "Performs collection, transport handoffs, and (for WAIVED/MODERATE panels) resulting"
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /lab-orders/{id}/specimens"
      - "POST /specimens/{id}/transport-legs"
      - "POST /transport-legs/{id}/arrive"
      - "POST /transport-legs/{id}/report-break"
    shared_operations:
      - "POST /lab-orders/{id}/results (shared with LabDirector; HIGH panels are LAB_DIRECTOR only)"
      - "GET reads on most resources"

  - name: LabDirector
    description: "Oversight role: registers clinicians, defines panels, releases/amends/retracts results, runs sweeps and clock advances, reads audit log"
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /clinicians"
      - "PATCH /clinicians/{id}"
      - "POST /test-panels"
      - "POST /results/{id}/release"
      - "POST /results/{id}/amend"
      - "POST /results/{id}/retract"
      - "GET /audit-events"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations:
      - "POST /patients (shared with OrderingProvider)"
      - "POST /lab-orders/{id}/results (shared with LabTech for WAIVED/MODERATE; LAB_DIRECTOR exclusive for HIGH)"
      - "GET reads on all resources"
