  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: qualifying_stay_exactly_three_midnights_qualifies
        grounds:
          - calculations.qualifying_stay_midnights
          - entities.QualifyingStay.fields.midnights_count
          - entities.QualifyingStay.fields.qualifies
        distinguishing_aspect: |
          Threshold metric on the qualifying-stays endpoint: exactly 3 midnights
          (2026-01-26 -> 2026-01-29) satisfies midnights_count >= 3 (>= not >), so qualifies==true,
          while 2 midnights would not. Tests the >= boundary on the midnights metric.
        test_recipe:
          setup:
            - "A resident with a hospital stay spanning exactly 3 UTC midnights"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "QS SNF", cms_certification_number: "CCN-QS1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "QS Res", medical_record_number: "MRN-QS1", date_of_birth: "1949-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /snf/residents/${res_id}/qualifying-stays"
              payload: { hospital_admit_at: "2026-01-26T08:00:00Z", hospital_discharge_at: "2026-01-29T20:00:00Z" }
              as: AdmissionsCoordinator
              captures: { mc: $.data.midnights_count, q: $.data.qualifies }
          assert:
            - "QualifyingStay.midnights_count == 3"
            - "QualifyingStay.qualifies == true"

      - name: therapy_group_cap_exactly_25pct_not_exceeded
        grounds:
          - calculations.therapy_minutes_aggregate
          - entities.TherapyLog.fields.individual_equivalent_minutes
        distinguishing_aspect: |
          Empty/ratio boundary on a DIFFERENT metric and endpoint (GET therapy-summary):
          group/concurrent minutes at exactly 25% of total (20 group of 80 total) does NOT
          exceed the cap because the comparison is strict > 0.25, so exceeds_group_cap==false;
          one more group minute would flip it. Distinct from the midnights threshold metric.
        test_recipe:
          setup:
            - "PRIVATE admission ACTIVE with PT logs: 60 INDIVIDUAL + 20 GROUP (group exactly 25% of 80 raw)"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "TG SNF", cms_certification_number: "CCN-TG1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "TG Res", medical_record_number: "MRN-TG1", date_of_birth: "1950-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "PRIVATE", admit_at: "2026-02-01T00:00:00Z" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/therapy-logs"
              payload: { discipline: "PT", mode: "INDIVIDUAL", minutes: 60, session_date: "2026-02-02T00:00:00Z" }
