scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: tat_deadline_calendar_vs_business_hours
        grounds:
          - calculations.turnaround_deadline
          - entities.Case.fields.tat_mode
          - entities.Case.fields.turnaround_deadline
        distinguishing_aspect: "Case-entity domain: identical tat_base_time and complexity_class SIMPLE yield turnaround_deadline 2026-08-09T16:00:00Z under the CALENDAR variant but 2026-08-17T10:00:00Z under the BUSINESS_HOURS variant (Mon-Fri 08:00-17:00 UTC only), a different value driven purely by the variant selector."
        test_recipe:
          setup:
            - "patient registered; two GI cases, one tat_mode CALENDAR one BUSINESS_HOURS; each has one BIOPSY specimen received 2026-08-07T16:00:00Z (a Friday), no blocks, so complexity_class stays SIMPLE (score 1.0) and tat_base_time is 2026-08-07T16:00:00Z for both"
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-100", full_name: "Pat One", date_of_birth: "1975-03-20" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI", tat_mode: "CALENDAR" }, as: LabAdmin, captures: { ca: $.data.id } }
            - { call: "POST /pathology/cases/${ca}/specimens", payload: { patient_mrn: "MRN-100", patient_dob: "1975-03-20", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-07T15:30:00Z", received_datetime: "2026-08-07T16:00:00Z", container_count: 1 }, as: Histotech }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI", tat_mode: "BUSINESS_HOURS" }, as: LabAdmin, captures: { cb: $.data.id } }
            - { call: "POST /pathology/cases/${cb}/specimens", payload: { patient_mrn: "MRN-100", patient_dob: "1975-03-20", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-07T15:30:00Z", received_datetime: "2026-08-07T16:00:00Z", container_count: 1 }, as: Histotech }
          trigger:
            - { call: "GET /pathology/cases/${ca}", as: LabAdmin, captures: { dl_a: $.data.turnaround_deadline } }
            - { call: "GET /pathology/cases/${cb}", as: LabAdmin, captures: { dl_b: $.data.turnaround_deadline } }
          assert:
            - "Case.${ca}.turnaround_deadline == 2026-08-09T16:00:00Z (48 clock hours from Friday 16:00)"
            - "Case.${cb}.turnaround_deadline == 2026-08-17T10:00:00Z (48 business hours: Fri 1h + Mon-Fri 45h + Mon 2h)"
            - "Case.${ca}.complexity_class == SIMPLE and Case.${cb}.complexity_class == SIMPLE"
            - "${dl_a} != ${dl_b}"
      - name: discrepancy_rate_simple_vs_severity_weighted
        grounds:
          - calculations.discrepancy_rate
          - entities.Pathologist.fields.discrepancy_rate_simple
          - entities.Pathologist.fields.discrepancy_rate_weighted
        distinguishing_aspect: "Pathologist-entity domain (distinct from the Case TAT instance): with 2 signed FINAL reports and resolved discrepancies of LEVEL_1 and LEVEL_2, discrepancy_rate_simple is 1.0 while discrepancy_rate_weighted is 2.0 for the same underlying rows."
        test_recipe:
          setup:
            - "pathologist p1 has signed out two GI cases (each BIOPSY with one block and one QC_PASSED slide); a LEVEL_1 discrepancy on case 1 is RESOLVED directly from OPEN; a LEVEL_2 discrepancy on case 2 linked to its signed report is ACKNOWLEDGED by p1, an amendment is signed by a different pathologist p2 (SoD), and the discrepancy is RESOLVED with resolved_with_amendment true; the logical clock advances to 2026-08-02 before the amendment so its signed_at is strictly after the discrepancy created_at"
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-200", full_name: "Pat Two", date_of_birth: "1980-06-15" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Signer", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Amender", subspecialties: ["GI"] }, as: LabAdmin, captures: { p2: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-200", patient_dob: "1980-06-15", specimen_type: "BIOPSY", anatomical_site: "Stomach", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "two fragments" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech, captures: { s1: $.data.id } }
            - { call: "POST /pathology/slides/${s1}/section", payload: { consumption_pct: 10.0 }, as: Histotech }
            - { call: "POST /pathology/slides/${s1}/stain-complete", as: Histotech }
            - { call: "POST /pathology/slides/${s1}/qc-review", payload: { result: "PASS" }, as: Histotech }
            - { call: "POST /pathology/cases/${c1}/assign", payload: { pathologist_id: "${p1}" }, as: LabAdmin }
            - { call: "POST /pathology/cases/${c1}/submit-for-signout", as: Pathologist, as_user_id: "${p1}" }
            - { call: "POST /pathology/cases/${c1}/sign-out", payload: { diagnosis_text: "Benign mucosa" }, as: Pathologist, as_user_id: "${p1}" }
            - { call: "POST /pathology/cases/${c1}/discrepancies", payload: { severity: "LEVEL_1", description: "minor wording" }, as: LabAdmin, captures: { d1: $.data.id } }
            - { call: "POST /pathology/discrepancies/${d1}/resolve", payload: {}, as: LabAdmin }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c2: $.data.id } }
            - { call: "POST /pathology/cases/${c2}/specimens", payload: { patient_mrn: "MRN-200", patient_dob: "1980-06-15", specimen_type: "BIOPSY", anatomical_site: "Antrum", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp2: $.data.id } }
            - { call: "POST /pathology/specimens/${sp2}/gross", payload: { gross_description: "one fragment" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp2}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b2: $.data.id } }
            - { call: "POST /pathology/blocks/${b2}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b2}/slides", payload: { slide_label: "A1-1" }, as: Histotech, captures: { s2: $.data.id } }
            - { call: "POST /pathology/slides/${s2}/section", payload: { consumption_pct: 10.0 }, as: Histotech }
            - { call: "POST /pathology/slides/${s2}/stain-complete", as: Histotech }
            - { call: "POST /pathology/slides/${s2}/qc-review", payload: { result: "PASS" }, as: Histotech }
            - { call: "POST /pathology/cases/${c2}/assign", payload: { pathologist_id: "${p1}" }, as: LabAdmin }
            - { call: "POST /pathology/cases/${c2}/submit-for-signout", as: Pathologist, as_user_id: "${p1}" }
            - { call: "POST /pathology/cases/${c2}/sign-out", payload: { diagnosis_text: "Gastritis" }, as: Pathologist, as_user_id: "${p1}" }
            - { call: "GET /pathology/reports", payload: { case_id: "${c2}" }, as: LabAdmin, captures: { rep2: "$.data[0].id" } }
            - { call: "POST /pathology/cases/${c2}/discrepancies", payload: { severity: "LEVEL_2", description: "grading discordance", report_id: "${rep2}" }, as: LabAdmin, captures: { d2: $.data.id } }
            - { call: "POST /pathology/discrepancies/${d2}/acknowledge", as: Pathologist, as_user_id: "${p1}" }
            - { call: "POST /pathology/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: LabAdmin }
            - { call: "POST /pathology/cases/${c2}/amend", payload: { diagnosis_text: "Severe gastritis", amendment_reason: "QA discrepancy" }, as: Pathologist, as_user_id: "${p2}" }
            - { call: "POST /pathology/cases/${c2}/amend/sign", as: Pathologist, as_user_id: "${p2}" }
            - { call: "POST /pathology/discrepancies/${d2}/resolve", payload: { resolved_with_amendment: true }, as: LabAdmin }
          trigger:
            - { call: "GET /pathology/pathologists/${p1}", as: LabAdmin }
          assert:
            - "Pathologist.${p1}.discrepancy_rate_simple == 1.0 (2 resolved / 2 signed FINAL reports)"
            - "Pathologist.${p1}.discrepancy_rate_weighted == 2.0 ((1*1 + 1*3) / 2)"
            - "both rates use identical numerator rows and denominator; only the severity weighting differs"

  - rule_id: combinatorial_formula
    instances:
      - name: complexity_score_tiered_classification
        grounds:
          - calculations.case_complexity_classification
          - entities.Case.fields.complexity_score
          - entities.Case.fields.complexity_class
        distinguishing_aspect: "Mode (a) tiered-threshold formula with 4 inputs (max specimen base weight, block count, slide count, stain count) and inclusive-lower/exclusive-upper tiers: a RESECTION case scoring exactly 8.5 is MODERATE with deadline +72h, and adding one stain order lifts it to 10.5 crossing the 10.0 boundary into COMPLEX with deadline +120h."
        test_recipe:
          setup:
            - "GI case (tat_mode CALENDAR) with one RESECTION specimen (base weight 3, received 2026-08-03T10:00:00Z, cold ischemia exactly 60 minutes), two blocks, three slides, and one HER2_IHC stain order: score = 3 + 2*1.0 + 3*0.5 + 1*2.0 = 8.5"
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-300", full_name: "Pat Three", date_of_birth: "1968-11-02" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Order", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI", tat_mode: "CALENDAR" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-300", patient_dob: "1968-11-02", specimen_type: "RESECTION", anatomical_site: "Sigmoid colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 2 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "12 cm segment" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A2" }, as: Histotech, captures: { b2: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b2}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-2" }, as: Histotech }
            - { call: "POST /pathology/blocks/${b2}/slides", payload: { slide_label: "A2-1" }, as: Histotech }
            - { call: "POST /pathology/cases/${c1}/stain-orders", payload: { block_id: "${b1}", stain_type: "HER2_IHC" }, as: Pathologist, as_user_id: "${p1}" }
          trigger:
            - { call: "GET /pathology/cases/${c1}", as: LabAdmin }
            - { call: "POST /pathology/cases/${c1}/stain-orders", payload: { block_id: "${b2}", stain_type: "KI67" }, as: Pathologist, as_user_id: "${p1}", captures: { so2: $.data.id } }
            - { call: "GET /pathology/cases/${c1}", as: LabAdmin }
          assert:
            - "after setup: Case.${c1}.complexity_score == 8.5, complexity_class == MODERATE, turnaround_deadline == 2026-08-06T10:00:00Z"
            - "after second stain: Case.${c1}.complexity_score == 10.5, complexity_class == COMPLEX (10.0 <= score boundary crossed), turnaround_deadline == 2026-08-08T10:00:00Z"
            - "StainOrder.${so2}.status == ORDERED"
      - name: block_tissue_per_event_rounding
        grounds:
          - calculations.block_tissue_accounting
          - entities.Block.fields.tissue_remaining_pct
        distinguishing_aspect: "Mode (b) nested-rounding formula (distinct from the tiered mode (a) instance): consumptions 3.33, 3.33, 3.34 are each rounded to 1 decimal BEFORE summation, yielding tissue_remaining_pct 90.1; the forbidden sum-then-round order would yield 90.0."
        test_recipe:
          setup:
            - "GI case with one BIOPSY specimen, one EMBEDDED block, and two slides; slide 1 sectioned with consumption 3.33; slide 2 sectioned with 3.33, QC-failed, then recut with 3.34"
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-301", full_name: "Pat Four", date_of_birth: "1990-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-301", patient_dob: "1990-01-01", specimen_type: "BIOPSY", anatomical_site: "Duodenum", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "fragments" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech, captures: { s1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-2" }, as: Histotech, captures: { s2: $.data.id } }
            - { call: "POST /pathology/slides/${s1}/section", payload: { consumption_pct: 3.33 }, as: Histotech }
            - { call: "POST /pathology/slides/${s2}/section", payload: { consumption_pct: 3.33 }, as: Histotech }
            - { call: "POST /pathology/slides/${s2}/stain-complete", as: Histotech }
            - { call: "POST /pathology/slides/${s2}/qc-review", payload: { result: "FAIL", reason: "folded tissue" }, as: Histotech }
          trigger:
            - { call: "POST /pathology/slides/${s2}/recut", payload: { consumption_pct: 3.34 }, as: Histotech }
            - { call: "GET /pathology/blocks/${b1}", as: LabAdmin }
          assert:
            - "Block.${b1}.tissue_remaining_pct == 90.1 (100.0 - (3.3 + 3.3 + 3.3); each event rounded to 1 decimal first)"
            - "Slide.${s2}.consumption_pct == 3.3 and Slide.${s2}.status == SECTIONED"

  - rule_id: non_linear_state_machine
    instances:
      - name: case_final_amending_final_cycle
        grounds:
          - state_machines.Case.FINAL_to_AMENDING
          - state_machines.Case.AMENDING_to_FINAL
          - state_machines.Report.SIGNED_to_SUPERSEDED
        distinguishing_aspect: "Case machine is cyclic (FINAL -> AMENDING -> FINAL), unlike any linear pipeline: after amend+sign the case returns to FINAL with report v1 SUPERSEDED, v2 SIGNED, and current_signed_report_id pointing at v2; the same case can loop again."
        test_recipe:
          setup:
            - "GI case signed out by p1 (BIOPSY, one block, one QC_PASSED slide); its first FINAL report id captured as rep1"
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-400", full_name: "Pat Five", date_of_birth: "1972-04-18" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Loop", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-400", patient_dob: "1972-04-18", specimen_type: "BIOPSY", anatomical_site: "Ileum", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "biopsy fragments" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech, captures: { s1: $.data.id } }
            - { call: "POST /pathology/slides/${s1}/section", payload: { consumption_pct: 10.0 }, as: Histotech }
            - { call: "POST /pathology/slides/${s1}/stain-complete", as: Histotech }
            - { call: "POST /pathology/slides/${s1}/qc-review", payload: { result: "PASS" }, as: Histotech }
            - { call: "POST /pathology/cases/${c1}/assign", payload: { pathologist_id: "${p1}" }, as: LabAdmin }
            - { call: "POST /pathology/cases/${c1}/submit-for-signout", as: Pathologist, as_user_id: "${p1}" }
            - { call: "POST /pathology/cases/${c1}/sign-out", payload: { diagnosis_text: "No dysplasia" }, as: Pathologist, as_user_id: "${p1}" }
            - { call: "GET /pathology/reports", payload: { case_id: "${c1}" }, as: LabAdmin, captures: { rep1: "$.data[0].id" } }
          trigger:
            - { call: "POST /pathology/cases/${c1}/amend", payload: { diagnosis_text: "Focal dysplasia", amendment_reason: "deeper levels reviewed" }, as: Pathologist, as_user_id: "${p1}", captures: { draft: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/amend/sign", as: Pathologist, as_user_id: "${p1}", captures: { rep2: $.data.id } }
            - { call: "GET /pathology/cases/${c1}", as: LabAdmin }
            - { call: "GET /pathology/reports/${rep1}", as: LabAdmin }
          assert:
            - "Case.${c1}.status == FINAL (cycle completed) and current_signed_report_id == ${rep2}"
            - "Report.${rep1}.status == SUPERSEDED"
            - "Report.${rep2}.status == SIGNED, report_class == AMENDED, version_number == 2, supersedes_report_id == ${rep1}"
            - "Report.${draft} == Report.${rep2} (the DRAFT created by amend is the report that got signed)"
      - name: slide_qc_recut_cycle
        grounds:
          - state_machines.Slide.STAINED_to_QC_FAILED
          - state_machines.Slide.QC_FAILED_to_SECTIONED
          - state_machines.Slide.SECTIONED_to_STAINED
        distinguishing_aspect: "Slide machine cycles SECTIONED -> STAINED -> QC_FAILED -> SECTIONED (recut loop on the Slide entity, distinct from the Case amendment cycle), and each loop iteration debits the parent block again: tissue drops from 100.0 to 85.0 across section 10.0 + recut 5.0."
        test_recipe:
          setup:
            - "GI case with one BIOPSY specimen, one EMBEDDED block, one slide"
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-401", full_name: "Pat Six", date_of_birth: "1985-09-09" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-401", patient_dob: "1985-09-09", specimen_type: "BIOPSY", anatomical_site: "Cecum", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "polyp fragments" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /pathology/slides/${s1}/section", payload: { consumption_pct: 10.0 }, as: Histotech }
            - { call: "POST /pathology/slides/${s1}/stain-complete", as: Histotech }
            - { call: "POST /pathology/slides/${s1}/qc-review", payload: { result: "FAIL", reason: "chatter artifact" }, as: Histotech }
            - { call: "POST /pathology/slides/${s1}/recut", payload: { consumption_pct: 5.0 }, as: Histotech }
            - { call: "POST /pathology/slides/${s1}/stain-complete", as: Histotech }
            - { call: "POST /pathology/slides/${s1}/qc-review", payload: { result: "PASS" }, as: Histotech }
            - { call: "GET /pathology/slides/${s1}", as: LabAdmin }
            - { call: "GET /pathology/blocks/${b1}", as: LabAdmin }
          assert:
            - "Slide.${s1}.status == QC_PASSED after traversing SECTIONED -> STAINED -> QC_FAILED -> SECTIONED -> STAINED -> QC_PASSED"
            - "Slide.${s1}.consumption_pct == 5.0 (recut event replaced the prior event value)"
            - "Block.${b1}.tissue_remaining_pct == 85.0 (10.0 + 5.0 debited across the loop)"

  - rule_id: transitive_cascade
    instances:
      - name: stain_result_reflex_complexity_cascade
        grounds:
          - state_machines.StainOrder.IN_PROGRESS_to_RESULTED
          - calculations.reflex_evaluation
          - calculations.case_complexity_classification
          - calculations.turnaround_deadline
        distinguishing_aspect: "Depth-4 chain triggered by POST /pathology/stain-orders/{id}/result: stain RESULTED (hop 0) -> reflex rule auto-creates a child StainOrder (hop 1) -> the new order mutates Case.complexity_score/complexity_class MODERATE 8.5 -> COMPLEX 10.5 (hop 2) -> the class change recomputes turnaround_deadline from +72h to +120h (hop 3) and re-evaluates tat_breached (hop 4)."
        test_recipe:
          setup:
            - "ACTIVE reflex rule HER2_IHC/POSITIVE -> KI67 priority 1; GI case (CALENDAR) with one RESECTION specimen (base 3), two EMBEDDED blocks, three slides, and one IN_PROGRESS HER2_IHC order: pre-result score 8.5 (MODERATE, deadline 2026-08-06T10:00:00Z); the reflex child will push the score to 10.5"
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-500", full_name: "Pat Seven", date_of_birth: "1979-12-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Cascade", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI", tat_mode: "CALENDAR" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-500", patient_dob: "1979-12-01", specimen_type: "RESECTION", anatomical_site: "Right colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 2 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "mass 3 cm" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A2" }, as: Histotech, captures: { b2: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b2}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-2" }, as: Histotech }
            - { call: "POST /pathology/blocks/${b2}/slides", payload: { slide_label: "A2-1" }, as: Histotech }
            - { call: "POST /pathology/reflex-rules", payload: { name: "HER2 pos reflex KI67", trigger_stain_type: "HER2_IHC", trigger_result: "POSITIVE", followup_stain_type: "KI67", priority: 1 }, as: LabAdmin, captures: { rr: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/stain-orders", payload: { block_id: "${b1}", stain_type: "HER2_IHC" }, as: Pathologist, as_user_id: "${p1}", captures: { so1: $.data.id } }
            - { call: "POST /pathology/stain-orders/${so1}/start", as: Histotech }
          trigger:
            - { call: "POST /pathology/stain-orders/${so1}/result", payload: { result_value: "POSITIVE" }, as: Histotech }
            - { call: "GET /pathology/stain-orders", payload: { parent_stain_order_id: "${so1}" }, as: LabAdmin, captures: { child: "$.data[0].id" } }
            - { call: "GET /pathology/cases/${c1}", as: LabAdmin }
          assert:
            - "StainOrder.${so1}.status == RESULTED with result_value POSITIVE"
            - "exactly one child order ${child} exists with stain_type == KI67, reflex_rule_id == ${rr}, parent_stain_order_id == ${so1}, status == ORDERED"
            - "Case.${c1}.complexity_score == 10.5 and complexity_class == COMPLEX (upgraded by the reflex child, not by the original result call)"
            - "Case.${c1}.turnaround_deadline == 2026-08-08T10:00:00Z (recomputed under COMPLEX 120h from tat_base 2026-08-03T10:00:00Z)"
      - name: slide_section_tissue_depletion_cascade
        grounds:
          - state_machines.Slide.ORDERED_to_SECTIONED
          - state_machines.Block.EMBEDDED_to_DEPLETED
          - calculations.block_tissue_accounting
        distinguishing_aspect: "Depth-2 chain triggered by POST /pathology/slides/{id}/section (a different trigger than the stain-result cascade): slide SECTIONED (hop 0) debits Block.tissue_remaining_pct 100.0 -> 4.0 (hop 1), and crossing below MIN_RECUTABLE_PCT 5.0 flips the block EMBEDDED -> DEPLETED (hop 2), after which any new slide order on that block fails with ERR_BLOCK_DEPLETED."
        test_recipe:
          setup:
            - "GI case with one BIOPSY specimen, one EMBEDDED block, one ORDERED slide"
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-501", full_name: "Pat Eight", date_of_birth: "1955-02-14" }, as: LabAdmin, captures: { pat: $.data.id } }
