# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2306 busy-season resource scheduling
#
# Depth probe: nine §0.5 Difficulty Rules x 2 instances = 18 instances.
# Every instance grounds only in SCAFFOLD.yaml §1.1-§1.6 and drives empty-DB ->
# precondition using only endpoints declared in §1.5.
#
# Clock convention: the logical clock starts at 2026-08-01T00:00:00Z (Saturday,
# ISO week 2026-07-27). Every chain below sets the clock explicitly.
# Mondays used as ISO week starts: 2026-07-27, 2026-08-03, 2026-08-10,
# 2026-08-17, 2026-08-24, 2026-08-31.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: realization_provisional_vs_final_diverges_on_same_engagement
        grounds:
          - calculations.engagement_realization
          - entities.Engagement.fields.realization_pct_provisional
          - entities.Engagement.fields.realization_pct_final
          - endpoints[GET /scheduling/engagements/{engagement_id}/realization]
          - validations[priority=37]
        distinguishing_aspect: |
          The two variants of engagement_realization differ in their INPUT SET, not their
          weights: provisional_committed values one line per non-released Assignment
          (45.00 booked hours -> 8100.00) while final_logged values one line per TimeEntry
          (46.00 logged hours -> 8280.00), so the same engagement reports 74.07 and 72.46
          in one response.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z (Monday, ISO week 2026-08-03)."
            - "Client MERIDIAN (MANUFACTURING, non-PIE) with engagement E1: AUDIT, busy_season_year 2026, deadline 2026-10-15, budget_fee_amount 6000.00."
            - "Phase PH1 FIELDWORK expects 45.00 hours in the closed window 2026-08-03..2026-08-31, requires SENIOR + MANUFACTURING + CPA."
            - "Senior S1 (DOMESTIC, base_weekly_cap_hours 40.00, hourly_bill_rate 180.00) is booked for all 45.00 hours over [2026-08-03, 2026-08-10) and driven to ACTIVE."
            - "S1 logs 46.00 hours (16.00 + 16.00 + 14.00), which is inside the 1.25x overrun tolerance of priority 37 (45.00 * 1.25 = 56.25) yet above the booked 45.00."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/clients"
              payload: { name: "Meridian Manufacturing", industry_code: "MANUFACTURING", public_interest_entity: false, fiscal_year_end: "2026-12-31" }
              as: FirmAdmin
              captures: { c_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Pat Rowe", level: "PARTNER", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 45.00, hourly_bill_rate: 400.00 }
              as: FirmAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Sam Oyelaran", level: "SENIOR", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 40.00, hourly_bill_rate: 180.00 }
              as: FirmAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2026, deadline_date: "2026-10-15", budget_fee_amount: 6000.00 }
              as: SchedulingManager
              captures: { e1_id: $.data.id }
            - call: "POST /scheduling/engagement-phases"
              payload: { engagement_id: "${e1_id}", phase_type: "FIELDWORK", expected_hours: 45.00, window_start_date: "2026-08-03", window_end_date: "2026-08-31", required_level: "SENIOR", required_industry_specialization: "MANUFACTURING", requires_cpa_licensed: true }
              as: SchedulingManager
              captures: { ph1_id: $.data.id }
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph1_id}", staff_member_id: "${s1_id}", start_date: "2026-08-03", end_date: "2026-08-10", allocated_hours: 45.00 }
              as: SchedulingManager
              captures: { a1_id: $.data.id }
            - call: "POST /scheduling/engagements/${e1_id}/schedule"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/engagements/${e1_id}/start-fieldwork"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/assignments/${a1_id}/confirm"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/engagement-phases/${ph1_id}/start"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/assignments/${a1_id}/activate"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/time-entries"
              payload: { assignment_id: "${a1_id}", work_date: "2026-08-03", hours: 16.00, entry_type: "EXECUTION" }
              as: EngagementStaff
              as_user_id: "${s1_id}"
            - call: "POST /scheduling/time-entries"
              payload: { assignment_id: "${a1_id}", work_date: "2026-08-04", hours: 16.00, entry_type: "EXECUTION" }
              as: EngagementStaff
              as_user_id: "${s1_id}"
            - call: "POST /scheduling/time-entries"
              payload: { assignment_id: "${a1_id}", work_date: "2026-08-05", hours: 14.00, entry_type: "EXECUTION" }
              as: EngagementStaff
              as_user_id: "${s1_id}"
          trigger:
            - call: "GET /scheduling/engagements/${e1_id}/realization"
              payload: {}
              as: SchedulingManager
          assert:
            - "response.data.committed_hours_total == 45.00"
            - "response.data.logged_hours_total == 46.00"
            - "response.data.standard_value_provisional == 8100.00"
            - "response.data.realization_pct_provisional == 74.07"
            - "response.data.standard_value_final == 8280.00"
            - "response.data.realization_pct_final == 72.46"
            - "response.data.realization_pct_final != response.data.realization_pct_provisional (72.46 vs 74.07 on the same Engagement row)"
            - "response.data.onshore_standard_value == 8100.00"
            - "response.data.offshore_standard_value == 0.00"

      - name: burnout_actual_trailing_vs_committed_forward_diverges_for_same_staff
        grounds:
          - calculations.burnout_risk_score
          - entities.StaffMember.fields.burnout_risk_score_actual
          - entities.StaffMember.fields.burnout_risk_score_committed
          - entities.StaffMember.fields.turnover_risk_band
          - endpoints[GET /scheduling/staff-members/{staff_member_id}/workload]
        distinguishing_aspect: |
          The two variants of burnout_risk_score walk the decay window in OPPOSITE time
          directions over different quantities: actual_trailing sums logged TimeEntry hours
          for W0..W3 backwards (46.00 logged in 2026-07-27 -> 1.80) while committed_forward
          sums committed assignment hours for W0..W3 forwards (44.03 + 49.00 -> 4.31), so
          the band ELEVATED is produced only by the forward variant.
        test_recipe:
          setup:
            - "Clock first at 2026-07-27T09:00:00Z so hours can be logged in ISO week 2026-07-27, then moved to 2026-08-03T09:00:00Z."
            - "Senior S3 (DOMESTIC, base_weekly_cap_hours 40.00, rate 180.00) has phase PH_A (46.00 hours, window 2026-07-27..2026-08-31) with a 46.00-hour booking over [2026-07-27, 2026-08-01) driven to ACTIVE, and logs exactly 46.00 hours in that week."
            - "After the clock moves, phase PH_B (44.00 hours, window 2026-08-03..2026-08-31) carries two forward bookings for S3: 44.00 hours over [2026-08-03, 2026-08-10) and 49.00 hours over [2026-08-10, 2026-08-17), both PROPOSED."
            - "Weekly cap for 2026-08-03 is AMBER-tiered from the prior week (46.00 / 40.00 = 1.1500) -> round_half_up(40.00 * 1.15) = 46.00, so 44.03 committed fits; the 2026-08-10 cap is GREEN (no logged hours in 2026-08-03) -> 50.00, so 49.00 fits."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-27T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/clients"
              payload: { name: "Northwind Foods", industry_code: "MANUFACTURING", public_interest_entity: false, fiscal_year_end: "2026-12-31" }
              as: FirmAdmin
              captures: { c_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Pat Rowe", level: "PARTNER", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 45.00, hourly_bill_rate: 400.00 }
              as: FirmAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Sena Adeyemi", level: "SENIOR", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 40.00, hourly_bill_rate: 180.00 }
              as: FirmAdmin
              captures: { s3_id: $.data.id }
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2026, deadline_date: "2026-10-15", budget_fee_amount: 9000.00 }
              as: SchedulingManager
              captures: { e1_id: $.data.id }
            - call: "POST /scheduling/engagement-phases"
              payload: { engagement_id: "${e1_id}", phase_type: "INTERIM", expected_hours: 46.00, window_start_date: "2026-07-27", window_end_date: "2026-08-31", required_level: "SENIOR" }
              as: SchedulingManager
              captures: { ph_a_id: $.data.id }
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph_a_id}", staff_member_id: "${s3_id}", start_date: "2026-07-27", end_date: "2026-08-01", allocated_hours: 46.00 }
              as: SchedulingManager
              captures: { a_prior_id: $.data.id }
            - call: "POST /scheduling/engagements/${e1_id}/schedule"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/engagements/${e1_id}/start-fieldwork"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/assignments/${a_prior_id}/confirm"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/engagement-phases/${ph_a_id}/start"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/assignments/${a_prior_id}/activate"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/time-entries"
              payload: { assignment_id: "${a_prior_id}", work_date: "2026-07-27", hours: 12.00, entry_type: "EXECUTION" }
              as: EngagementStaff
              as_user_id: "${s3_id}"
            - call: "POST /scheduling/time-entries"
              payload: { assignment_id: "${a_prior_id}", work_date: "2026-07-28", hours: 12.00, entry_type: "EXECUTION" }
              as: EngagementStaff
              as_user_id: "${s3_id}"
            - call: "POST /scheduling/time-entries"
              payload: { assignment_id: "${a_prior_id}", work_date: "2026-07-29", hours: 12.00, entry_type: "EXECUTION" }
              as: EngagementStaff
              as_user_id: "${s3_id}"
            - call: "POST /scheduling/time-entries"
              payload: { assignment_id: "${a_prior_id}", work_date: "2026-07-30", hours: 10.00, entry_type: "EXECUTION" }
              as: EngagementStaff
              as_user_id: "${s3_id}"
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/engagement-phases"
              payload: { engagement_id: "${e1_id}", phase_type: "FIELDWORK", expected_hours: 44.00, window_start_date: "2026-08-03", window_end_date: "2026-08-31", required_level: "SENIOR" }
              as: SchedulingManager
              captures: { ph_b_id: $.data.id }
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph_b_id}", staff_member_id: "${s3_id}", start_date: "2026-08-03", end_date: "2026-08-10", allocated_hours: 44.00 }
              as: SchedulingManager
              captures: { a_f1_id: $.data.id }
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph_b_id}", staff_member_id: "${s3_id}", start_date: "2026-08-10", end_date: "2026-08-17", allocated_hours: 49.00 }
              as: SchedulingManager
              captures: { a_f2_id: $.data.id }
          trigger:
            - call: "GET /scheduling/staff-members/${s3_id}/workload"
              payload: {}
              as: SchedulingManager
          assert:
            - "response.data.week_start_date == 2026-08-03"
            - "response.data.logged_hours == 0.00"
            - "response.data.committed_hours == 44.03"
            - "response.data.effective_weekly_cap_hours == 46.00"
            - "response.data.daily_capacity_hours == 9.20"
            - "response.data.remaining_week_hours == 1.97"
            - "response.data.burnout_risk_score_actual == 1.80"
            - "response.data.burnout_risk_score_committed == 4.31"
            - "response.data.burnout_risk_score_committed != response.data.burnout_risk_score_actual (4.31 vs 1.80 for the same StaffMember row)"
            - "response.data.turnover_risk_band == ELEVATED"
            - "response.data.workload_status == AMBER"
            - "Assignment.${a_f1_id}.daily_hours == 6.29"
            - "Assignment.${a_f2_id}.daily_hours == 7.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: realization_final_rounds_each_time_entry_before_summing
        grounds:
          - calculations.engagement_realization
          - calculations.assignment_daily_hours
          - endpoints[GET /scheduling/engagements/{engagement_id}/realization]
        distinguishing_aspect: |
          The final_logged variant pins ROUNDING ORDER: three logged lines of 3.33 h at an
          effective rate of 183.75 each round to 611.89 before summing (1835.67 -> 96.69),
          whereas summing first and rounding once yields 1835.66 -> 96.70, so the two
          orderings are distinguishable at the second decimal of both money and percent.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "Engagement E1 (AUDIT, deadline 2026-10-15) carries budget_fee_amount 1775.00."
            - "Senior S4 bills 183.75/h (ONSHORE_STANDARD factor 1.00) and is booked 10.00 hours over [2026-08-03, 2026-08-06) -> calendar_day_count 3, daily_hours round_half_up(10.00/3) = 3.33."
            - "Phase PH1 expects exactly 10.00 hours in window 2026-08-03..2026-08-31; the booking is driven to ACTIVE and S4 logs 3.33 h on each of 2026-08-03, 2026-08-04 and 2026-08-05 (9.99 total)."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/clients"
              payload: { name: "Corvid Metals", industry_code: "MANUFACTURING", public_interest_entity: false, fiscal_year_end: "2026-12-31" }
              as: FirmAdmin
              captures: { c_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Pat Rowe", level: "PARTNER", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 45.00, hourly_bill_rate: 400.00 }
              as: FirmAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Dana Whitfield", level: "SENIOR", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 40.00, hourly_bill_rate: 183.75 }
              as: FirmAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2026, deadline_date: "2026-10-15", budget_fee_amount: 1775.00 }
              as: SchedulingManager
              captures: { e1_id: $.data.id }
            - call: "POST /scheduling/engagement-phases"
              payload: { engagement_id: "${e1_id}", phase_type: "WRAP_UP", expected_hours: 10.00, window_start_date: "2026-08-03", window_end_date: "2026-08-31", required_level: "SENIOR" }
              as: SchedulingManager
              captures: { ph1_id: $.data.id }
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph1_id}", staff_member_id: "${s4_id}", start_date: "2026-08-03", end_date: "2026-08-06", allocated_hours: 10.00 }
              as: SchedulingManager
              captures: { a1_id: $.data.id }
            - call: "POST /scheduling/engagements/${e1_id}/schedule"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/engagements/${e1_id}/start-fieldwork"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/assignments/${a1_id}/confirm"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/engagement-phases/${ph1_id}/start"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/assignments/${a1_id}/activate"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/time-entries"
              payload: { assignment_id: "${a1_id}", work_date: "2026-08-03", hours: 3.33, entry_type: "EXECUTION" }
              as: EngagementStaff
              as_user_id: "${s4_id}"
            - call: "POST /scheduling/time-entries"
              payload: { assignment_id: "${a1_id}", work_date: "2026-08-04", hours: 3.33, entry_type: "EXECUTION" }
              as: EngagementStaff
              as_user_id: "${s4_id}"
            - call: "POST /scheduling/time-entries"
              payload: { assignment_id: "${a1_id}", work_date: "2026-08-05", hours: 3.33, entry_type: "EXECUTION" }
              as: EngagementStaff
              as_user_id: "${s4_id}"
          trigger:
            - call: "GET /scheduling/engagements/${e1_id}/realization"
              payload: {}
              as: SchedulingManager
          assert:
            - "Assignment.${a1_id}.daily_hours == 3.33"
            - "response.data.logged_hours_total == 9.99"
            - "response.data.standard_value_final == 1835.67"
            - "response.data.standard_value_final != 1835.66 (sum-then-round order is wrong)"
            - "response.data.realization_pct_final == 96.69"
            - "response.data.realization_pct_final != 96.70"
            - "response.data.standard_value_provisional == 1837.50"
            - "response.data.realization_pct_provisional == 96.60"

      - name: effective_weekly_cap_combines_prior_week_tier_waiver_allowance_and_ceiling
        grounds:
          - calculations.effective_weekly_cap
          - calculations.staff_daily_capacity
          - state_machines.WorkloadWaiver.status.REQUESTED_to_APPROVED
          - entities.StaffMember.fields.effective_weekly_cap_hours
          - endpoints[GET /scheduling/staff-members/{staff_member_id}/workload]
        distinguishing_aspect: |
          The cap is a three-factor composition where the last factor overrides the first
          two: prior-week utilization 22.00/20.00 = 1.1000 selects the AMBER multiplier
          (round_half_up(20.00 * 1.15) = 23.00), the APPROVED waiver adds 8.00 for 31.00,
          and the absolute ceiling round_half_up(20.00 * 1.40) = 28.00 clamps the result to
          28.00 (daily 5.60) - a single-factor implementation cannot reproduce 28.00.
        test_recipe:
          setup:
            - "Clock first at 2026-07-27T09:00:00Z, later moved to 2026-08-03T09:00:00Z."
            - "Part-time senior S5 has base_weekly_cap_hours 20.00 (GREEN cap 25.00, daily 5.00 in week 2026-07-27)."
            - "S5 is booked 22.00 hours over [2026-07-27, 2026-08-01) (daily 4.40), driven to ACTIVE, and logs exactly 22.00 hours (5.50 on each of 2026-07-27..2026-07-30) in ISO week 2026-07-27."
            - "After the clock moves to 2026-08-03, S5 requests a 8.00-hour workload waiver for week 2026-08-03 and engagement partner P1 approves it."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-27T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/clients"
