    roles: [NumberingAdministrator]
    code: 201
    input: [finding_type, "adjusted_numbers_assigned?", "adjusted_numbers_administrative?", "disposition_note?"]
    output: AuditFinding
    side_effects: ["status = OPEN and auditor_user_id = the acting X-User-ID", "computes adjusted_utilization_pct with the strict_assigned_only variant over the adjusted inputs, null for NO_DISCREPANCY and MISSING_DATA", "computes penalty_action with audit_penalty_action over the delta against the filing's claimed_utilization_pct", "moves the filing SUBMITTED -> UNDER_AUDIT", "increments UtilizationFiling.version by 1"]
  - method: GET
    path: "/numbering/utilization-filings/{id}/audit-findings"
    description: "Lists the audit findings raised against this filing in created_at ASC order"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []
  - method: GET
    path: "/numbering/audit-findings/{finding_id}"
    description: "Retrieves one audit finding with its adjusted figure and penalty action"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative]
    code: 200
    input: []
    output: AuditFinding
    side_effects: []
  - method: POST
    path: "/numbering/audit-findings/{finding_id}/dispositions"
    description: "The regulatory approver accepts or rejects a finding. The acting user may not be the auditor who raised it."
    roles: [RegulatoryApprover]
    code: 200
    input: [disposition, "disposition_note?"]
    output: AuditFinding
    side_effects: ["sets disposed_by_user_id = the acting X-User-ID and status = ACCEPTED or REJECTED", "ACCEPT drives the parent filing to ACCEPTED when penalty_action is NONE and to REJECTED otherwise, stamping audited_utilization_pct", "ACCEPT with penalty_action PROBATION or RECLAMATION_REFERRAL puts the carrier on probation with probation_until = clock_now + PROBATION_DAYS, and RECLAMATION_REFERRAL also increments reclamation_strike_count by 1", "the probation cascade moves the carrier's PENDING_REVIEW GROWTH and POOL_REPLENISH requests to INFO_REQUESTED", "REJECT discards the finding, applies no penalty and leaves the filing UNDER_AUDIT", "increments AuditFinding.version, UtilizationFiling.version and Carrier.version by 1"]
  - method: POST
    path: "/numbering/reclamation-sweeps"
    description: "Runs the reclamation sweep at the current logical clock: pass 1 issues orders for blocks that missed their activation deadline (strict comparison), pass 2 releases blocks whose aging period has elapsed (inclusive comparison), pass 3 promotes routing records that have reached their effective_at. Each pass walks its blocks in created_at ASC order."
    roles: [NumberingAdministrator]
    code: 200
    input: ["rate_center_id?", "reason_filter?"]
    output: {orders_issued: integer, blocks_released: integer, routing_activated: integer, swept_at: datetime}
    side_effects: ["pass 1 moves each matching block to RECLAMATION_PENDING and creates a ReclamationOrder with reason = ACTIVATION_DEADLINE_MISSED, status = ISSUED, issued_at = the sweep instant and response_due_at = the sweep instant + RECLAMATION_RESPONSE_DAYS", "pass 1 also issues UTILIZATION_SHORTFALL orders for ASSIGNED blocks whose holder has no effective filing or an effective filing below UTILIZATION_MIN_PCT_GROWTH", "pass 2 moves AGING blocks back to POOL_AVAILABLE, clears aging_release_at and recomputes the rate center and NPA counters, which can move the NPA JEOPARDY -> ACTIVE", "pass 3 moves ROUTING_PENDING blocks to LERG_PUBLISHED and sets current_lrn without incrementing npac_db_version", "increments the version of every block, rate center and NPA it touched by 1"]
  - method: GET
    path: "/numbering/reclamation-orders"
    description: "Lists reclamation orders with filtering and pagination; carrier_id and number_block_id each find the orders hanging off that parent"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative]
    code: 200
    input: ["carrier_id?", "number_block_id?", "reason?", "status?", "limit?", "offset?"]
    output: ReclamationOrder[]
    side_effects: []
  - method: GET
    path: "/numbering/reclamation-orders/{order_id}"
    description: "Retrieves one reclamation order with its response deadline and strike flag"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative]
    code: 200
    input: []
    output: ReclamationOrder
    side_effects: []
  - method: POST
    path: "/numbering/reclamation-orders/{order_id}/transitions"
    description: "Drives the ReclamationOrder machine: SURRENDER and APPEAL by the holding carrier, EXECUTE and WITHDRAW by the administrator"
    roles: [CarrierRepresentative, NumberingAdministrator]
    code: 200
    input: [action, "appeal_note?"]
    output: ReclamationOrder
    side_effects: ["APPEAL is refused once the logical clock passes response_due_at; EXECUTE from ISSUED requires the logical clock to be strictly past response_due_at", "EXECUTE stamps executed_at and strike_applied = true, moves the block RECLAMATION_PENDING -> AGING with aging_release_at = clock_now + AGING_PERIOD_DAYS, clears the holder stamps and recomputes Carrier.blocks_held_count", "EXECUTE increments Carrier.reclamation_strike_count by 1 and, at RECLAMATION_PROBATION_STRIKES (2), puts the carrier on PROBATION with probation_until = clock_now + PROBATION_DAYS, which in turn moves its PENDING_REVIEW GROWTH and POOL_REPLENISH requests to INFO_REQUESTED", "EXECUTE on a routed block withdraws its open PUBLISHED RoutingRecord, sets routing_status = ROUTING_WITHDRAWN, clears current_lrn and increments npac_db_version by 1", "WITHDRAW compensates the sweep: the block returns to ASSIGNED when activated_at was set and to RESERVED otherwise, and no strike is applied", "increments ReclamationOrder.version, NumberBlock.version and Carrier.version by 1"]

  - method: GET
    path: "/numbering/relief-plans"
    description: "Lists relief plans with filtering and pagination; npa_id finds the plans for a code and successor_npa_id finds the plan that minted a successor code"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative, PublicCommenter]
    code: 200
    input: ["npa_id?", "successor_npa_id?", "status?", "recommended_relief_type?", "limit?", "offset?"]
    output: ReliefPlan[]
    side_effects: []
  - method: GET
    path: "/numbering/relief-plans/{plan_id}"
    description: "Retrieves one relief plan with its comment window, weighted tallies and permissive dialing window"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative, PublicCommenter]
    code: 200
    input: []
    output: ReliefPlan
    side_effects: []
  - method: POST
    path: "/numbering/relief-plans/{plan_id}/comments"
    description: "Files a public comment on a relief plan while its comment window is open"
    roles: [PublicCommenter, CarrierRepresentative]
    code: 201
    input: [commenter_type, position, body]
    output: PublicComment
    side_effects: ["computes weight from COMMENT_WEIGHTS[commenter_type] and stamps submitted_at = clock_now", "recomputes the plan's support_overlay_weight, support_split_weight and comment_count with comment_tally_weighted", "PublicComment is immutable: it has no version field and no update endpoint", "increments ReliefPlan.version by 1"]
  - method: GET
    path: "/numbering/relief-plans/{id}/comments"
    description: "Lists the public comments filed on this relief plan in submitted_at ASC order"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative, PublicCommenter]
    code: 200
    input: ["position?", "commenter_type?", "limit?", "offset?"]
    output: PublicComment[]
    side_effects: []
  - method: POST
    path: "/numbering/relief-plans/{plan_id}/transitions"
    description: "Drives the ReliefPlan machine: OPEN_COMMENT and CLOSE_AND_RECOMMEND by the administrator, ORDER by the regulatory approver (who must not be the recommender), WITHDRAW by the administrator"
    roles: [NumberingAdministrator, RegulatoryApprover]
    code: 200
    input: [action, "new_npa_code?", "effective_at?", "moved_rate_center_ids?"]
    output: ReliefPlan
    side_effects: ["OPEN_COMMENT stamps comment_window_open_at = clock_now and comment_window_close_at = clock_now + comment_window_days, and moves the NPA to RELIEF_PLANNED", "CLOSE_AND_RECOMMEND requires the window to have closed, runs comment_tally_weighted, stamps recommended_relief_type (overlay on a tie or with zero comments) and recommender_user_id", "ORDER requires effective_at to clear the previous plan's window_end_at by RELIEF_WINDOW_BUFFER_DAYS (90), mints or activates the successor NPA, stamps successor_npa_id, ordering_user_id and permissive_dialing_end_at = effective_at + PERMISSIVE_DIALING_DAYS", "ORDER of a GEOGRAPHIC_SPLIT re-parents every rate center in moved_rate_center_ids, and its blocks, to the successor NPA and recomputes both codes' counters; when every rate center moves, the parent NPA becomes RETIRED and its POOL_AVAILABLE blocks become RETIRED", "ORDER of an ALL_SERVICES_OVERLAY leaves every rate center on the parent code and returns the parent NPA to ACTIVE", "WITHDRAW releases the NPA back to its threshold-derived posture", "increments ReliefPlan.version, both NPA.version values and each moved RateCenter.version by 1"]

  - method: POST
    path: "/numbering/port-requests"
    description: "Opens a number portability request for a single telephone number inside an assigned, routed block"
    roles: [CarrierRepresentative]
    code: 201
    input: [telephone_number, number_block_id, from_carrier_id, to_carrier_id, requested_lrn, desired_due_at]
    output: PortRequest
    side_effects: ["status = SUBMITTED; the number must fall inside the block and the block must be ASSIGNED and LERG_PUBLISHED", "supersedes the gaining carrier's still-open SUBMITTED request for the same telephone_number and stamps supersedes_port_request_id on the new row", "no routing data is written until activation"]
  - method: GET
    path: "/numbering/port-requests"
    description: "Lists port requests with filtering and pagination; number_block_id, from_carrier_id, to_carrier_id and supersedes_port_request_id each find the requests hanging off that parent"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative, PortingOperations]
    code: 200
    input: ["number_block_id?", "from_carrier_id?", "to_carrier_id?", "supersedes_port_request_id?", "status?", "limit?", "offset?"]
    output: PortRequest[]
    side_effects: []
  - method: GET
    path: "/numbering/port-requests/{port_request_id}"
    description: "Retrieves one port request with its concurrence and activation stamps"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative, PortingOperations]
    code: 200
    input: []
    output: PortRequest
    side_effects: []
  - method: POST
    path: "/numbering/port-requests/{port_request_id}/transitions"
    description: "Drives the PortRequest machine: CONCUR and REJECT by the losing carrier, ACTIVATE and CANCEL by porting operations"
    roles: [CarrierRepresentative, PortingOperations]
    code: 200
    input: [action, "reject_reason?"]
    output: PortRequest
    side_effects: ["CONCUR requires the acting user to be from_carrier_id and the logical clock to be at or before desired_due_at", "ACTIVATE requires status CONCURRED and block routing_status LERG_PUBLISHED; it supersedes the block's open PUBLISHED record, publishes a new one carrying requested_lrn, sets current_lrn, increments npac_db_version by 1 and moves routing_status to PORT_LOCKED", "ACTIVATE stamps activated_at and npac_db_version_at_activation and leaves allocation_status untouched", "CANCEL on an ACTIVATED request snaps the number back: it supersedes the port's record, republishes the pre-port LRN so exactly one PUBLISHED record remains, restores current_lrn, increments npac_db_version by 1 again and returns routing_status to LERG_PUBLISHED", "CANCEL on a SUBMITTED or CONCURRED request touches no routing data", "increments PortRequest.version and, when routing changed, NumberBlock.version by 1"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not listed on the endpoint being called"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A CarrierRepresentative acts on a request, filing, block, reclamation order or port request whose carrier foreign key is not its own X-User-ID"
  - id: ERR_ACTION_ROLE_MISMATCH
    http: 403
    condition: "The acting role may call the endpoint but not with the requested action - for example a NumberingAdministrator sending action=APPROVE, or a CarrierRepresentative sending action=ACTIVATE"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID is the same user who performed the preceding step: the auditor disposing of its own finding, the reviewer approving the request it questioned, or the recommender ordering its own relief plan"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required field is missing, a type is wrong, an enum value is unknown, a count is negative, forecast_quarters does not hold exactly four integers, nxx_code is not three digits, thousands_digit is outside 0-9, or telephone_number is not ten digits"
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "No Carrier exists for the supplied carrier id, in the path or in the body"
  - id: ERR_NPA_NOT_FOUND
    http: 404
    condition: "No NPA exists for the supplied npa id"
  - id: ERR_RATE_CENTER_NOT_FOUND
    http: 404
    condition: "No RateCenter exists for the supplied rate center id"
  - id: ERR_BLOCK_NOT_FOUND
    http: 404
    condition: "No NumberBlock exists for the supplied block id"
  - id: ERR_ALLOCATION_REQUEST_NOT_FOUND
    http: 404
    condition: "No AllocationRequest exists for the supplied request id"
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "No UtilizationFiling exists for the supplied filing id"
  - id: ERR_AUDIT_FINDING_NOT_FOUND
    http: 404
    condition: "No AuditFinding exists for the supplied finding id"
  - id: ERR_RECLAMATION_ORDER_NOT_FOUND
    http: 404
    condition: "No ReclamationOrder exists for the supplied order id"
  - id: ERR_RELIEF_PLAN_NOT_FOUND
    http: 404
    condition: "No ReliefPlan exists for the supplied plan id"
  - id: ERR_PORT_REQUEST_NOT_FOUND
    http: 404
    condition: "No PortRequest exists for the supplied port request id"
  - id: ERR_STALE_RATE_CENTER_VERSION
    http: 412
    condition: "expected_rate_center_version on an allocation request does not equal the rate center's current version"
  - id: ERR_STALE_BLOCK_VERSION
    http: 412
    condition: "expected_block_version on a routing record publish does not equal the block's current version"
  - id: ERR_TERMINAL_STATE
    http: 409
    condition: "The target resource is already in a terminal state for its machine and accepts no further transition"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested transition does not exist from the resource's current state, or a cross-entity precondition of that transition is unmet"
  - id: ERR_INFO_CYCLE_LIMIT_REACHED
    http: 409
    condition: "A third REQUEST_INFO review was attempted after info_request_count already reached INFO_REQUEST_MAX_CYCLES (2)"
  - id: ERR_CARRIER_NOT_ELIGIBLE
    http: 422
    condition: "The carrier's eligibility_status is neither ELIGIBLE nor PROBATION - its license is not GRANTED or its facilities readiness is not VERIFIED - at the moment of the action"
  - id: ERR_LICENSE_EXPIRED
    http: 422
    condition: "The carrier's license_expires_on is at or before the logical clock"
  - id: ERR_CARRIER_ON_PROBATION
    http: 422
    condition: "The applicant carrier is on probation from a reclamation strike or an accepted audit finding and probation_until has not yet elapsed"
  - id: ERR_JURISDICTION_MISMATCH
    http: 422
    condition: "The rate center's state_code does not match its NPA's state_code, or an INITIAL request comes from a carrier whose home_state_code differs from the rate center's state_code"
  - id: ERR_NUMBER_OUTSIDE_BLOCK
    http: 422
    condition: "The telephone_number on a port request does not fall inside the referenced thousand-block"
  - id: ERR_PORT_BLOCK_NOT_ROUTED
    http: 409
    condition: "The port request's block is not ASSIGNED and LERG_PUBLISHED, or from_carrier_id is not the block's holder"
  - id: ERR_ROUTING_INTERVAL_OVERLAP
    http: 409
    condition: "A new routing record's effective_at falls strictly inside the open PUBLISHED record's half-open interval; a record starting exactly at the previous record's end_at is adjacent and allowed"
  - id: ERR_RELIEF_WINDOW_OVERLAP
    http: 409
    condition: "A relief plan's effective_at does not clear the newest non-withdrawn plan's window_end_at for the same NPA by RELIEF_WINDOW_BUFFER_DAYS (90)"
  - id: ERR_COMMENT_WINDOW_CLOSED
    http: 409
    condition: "A public comment arrived before comment_window_open_at or at or after comment_window_close_at"
  - id: ERR_ACTIVATION_WINDOW_EXPIRED
    http: 409
    condition: "An activation confirmation arrived after block.activation_due_at, or a reclamation appeal arrived after order.response_due_at"
  - id: ERR_DUPLICATE_OCN
    http: 409
    condition: "Another Carrier already holds the supplied ocn"
  - id: ERR_DUPLICATE_NPA_CODE
    http: 409
    condition: "Another NPA already holds the supplied npa_code, including a new_npa_code minted by a relief order"
  - id: ERR_DUPLICATE_BLOCK_LABEL
    http: 409
    condition: "Another NumberBlock already holds the computed block_label"
  - id: ERR_DUPLICATE_FILING_PERIOD
    http: 409
    condition: "The carrier already has a non-REJECTED UtilizationFiling for the same rate center and reporting period"
  - id: ERR_RATE_CENTER_NOT_ACCEPTING_INITIAL
    http: 409
    condition: "An INITIAL request targets a rate center whose accepts_initial_requests is false because it is flagged for jeopardy or is TRANSITIONAL to pooling"
  - id: ERR_BLOCK_NOT_POOLING_ELIGIBLE
    http: 422
    condition: "Every unrouted POOL_AVAILABLE block in the rate center is contamination-blocked - contaminated_count above CONTAMINATION_MAX_FOR_POOLING (100), or contaminated at all while the rate center is not POOLED - so the pool is non-empty but unusable"
  - id: ERR_UTILIZATION_FILING_REQUIRED
    http: 422
    condition: "A GROWTH, POOL_REPLENISH or SAFETY_VALVE request was filed with no effective UtilizationFiling for the same carrier and rate center"
  - id: ERR_UTILIZATION_THRESHOLD_NOT_MET
    http: 422
    condition: "The applicant's effective utilization is below UTILIZATION_MIN_PCT_GROWTH (60.00), so growth_grant_size yields a tier_cap of 0"
  - id: ERR_EXHAUST_HORIZON_TOO_LONG
    http: 422
    condition: "rate_center_months_to_exhaust exceeds MONTHS_TO_EXHAUST_MAX (6) under the variant that applies to the applicant's effective filing"
  - id: ERR_SAFETY_VALVE_LIMIT_EXCEEDED
    http: 422
    condition: "The carrier already holds SAFETY_VALVE_MAX_GRANTS_PER_CARRIER (1) safety-valve grant, or a SAFETY_VALVE request asked for more than SAFETY_VALVE_MAX_BLOCKS (1) block"
  - id: ERR_POOL_INSUFFICIENT_BLOCKS
    http: 409
    condition: "The rate center holds no POOL_AVAILABLE block with routing_status UNROUTED or ROUTING_WITHDRAWN, so block_pool_selection found nothing to assign"
  - id: ERR_GRANT_EXCEEDS_ENTITLEMENT
    http: 422
    condition: "An explicit granted_block_count on an APPROVE review exceeds the growth_grant_size entitlement"

roles:
  - name: CarrierRepresentative
    description: "Acts for one OCN holder: attests facilities readiness, files utilization and forecast reports, files and withdraws allocation requests, confirms activation, responds to reclamation orders, and concurs in or rejects ports of its own numbers"
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /numbering/allocation-requests"
      - "POST /numbering/allocation-requests/{request_id}/resubmissions"
      - "POST /numbering/utilization-filings"
      - "POST /numbering/utilization-filings/{filing_id}/submissions"
      - "POST /numbering/blocks/{block_id}/activation-confirmations"
      - "POST /numbering/port-requests"
      - "action=WITHDRAW on POST /numbering/allocation-requests/{request_id}/reviews"
      - "event=ATTEST on POST /numbering/carriers/{carrier_id}/readiness-events"
      - "action=SURRENDER and action=APPEAL on POST /numbering/reclamation-orders/{order_id}/transitions"
      - "action=CONCUR and action=REJECT on POST /numbering/port-requests/{port_request_id}/transitions"
    shared_operations:
      - "POST /numbering/relief-plans/{plan_id}/comments (shared with PublicCommenter)"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
  - name: NumberingAdministrator
    description: "The neutral pooling and numbering administrator: registers carriers, licenses them, loads inventory, publishes routing data, reviews and denies allocation requests, audits utilization filings, runs reclamation sweeps and executes orders, and drives relief plans up to the recommendation"
    identity: "opaque"
    exclusive_operations:
      - "POST /numbering/carriers"
      - "POST /numbering/carriers/{carrier_id}/license-actions"
      - "POST /numbering/npas"
      - "POST /numbering/npas/{npa_id}/jeopardy-declarations"
      - "POST /numbering/npas/{npa_id}/relief-plans"
      - "POST /numbering/rate-centers"
      - "POST /numbering/rate-centers/{rate_center_id}/pooling-transitions"
      - "POST /numbering/blocks"
      - "POST /numbering/blocks/{block_id}/routing-records"
      - "POST /numbering/utilization-filings/{filing_id}/audit-findings"
      - "POST /numbering/reclamation-sweeps"
      - "action=REQUEST_INFO and action=DENY on POST /numbering/allocation-requests/{request_id}/reviews"
      - "action=EXECUTE and action=WITHDRAW on POST /numbering/reclamation-orders/{order_id}/transitions"
      - "action=OPEN_COMMENT, action=CLOSE_AND_RECOMMEND and action=WITHDRAW on POST /numbering/relief-plans/{plan_id}/transitions"
      - "event=VERIFY and event=FAIL on POST /numbering/carriers/{carrier_id}/readiness-events"
    shared_operations:
      - "POST /numbering/carriers/{carrier_id}/readiness-events (shared endpoint, different events, with CarrierRepresentative)"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
  - name: RegulatoryApprover
    description: "The commission-side approver. Holds the two decisions that hand out or lock in resources - approving an allocation and ordering relief - plus disposing of audit findings, and may never be the same user who prepared the step it approves"
    identity: "opaque"
    exclusive_operations:
      - "POST /numbering/audit-findings/{finding_id}/dispositions"
      - "action=APPROVE on POST /numbering/allocation-requests/{request_id}/reviews"
      - "action=ORDER on POST /numbering/relief-plans/{plan_id}/transitions"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
  - name: PortingOperations
    description: "Runs the number portability database: activates concurred ports, and cancels or snaps back activated ports"
    identity: "opaque"
    exclusive_operations:
      - "action=ACTIVATE and action=CANCEL on POST /numbering/port-requests/{port_request_id}/transitions"
    shared_operations:
      - "every GET endpoint except the allocation, filing and relief listings"
      - "POST /_clock/set_current_utc"
  - name: PublicCommenter
    description: "A member of the public, a business or a government body filing comment on an area code relief plan; sees only the relief and area code surface"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /numbering/relief-plans/{plan_id}/comments (shared with CarrierRepresentative)"
      - "GET /numbering/npas, GET /numbering/npas/{npa_id}, GET /numbering/npas/{npa_id}/relief-plans, GET /numbering/relief-plans, GET /numbering/relief-plans/{plan_id}, GET /numbering/relief-plans/{id}/comments"
      - "POST /_clock/set_current_utc"
