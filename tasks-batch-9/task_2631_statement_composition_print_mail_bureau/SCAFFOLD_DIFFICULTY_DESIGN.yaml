              payload: { line_code: "PL-ALPHA", capabilities: ["DUPLEX", "COLOR", "INSERT"], sheets_per_hour: 600, daily_sheet_capacity: 6600, changeover_buffer_minutes: 30 }
              as: BureauAdmin
              captures: { ps_alpha_id: "$.data.id" }
