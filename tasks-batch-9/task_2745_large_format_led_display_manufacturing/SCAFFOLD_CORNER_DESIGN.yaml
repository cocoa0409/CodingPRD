      - name: spare_reservation_tie_breaks_on_created_at_ascending
        claim_type: correct_result
        grounds:
          - calculations.spare_module_selector
        distinguishing_aspect: |
          When both ranking keys tie — same color_bin_rank and same
          measured_brightness_nits — the selector falls through to created_at
          ASC, so the module that entered stock first leaves first. The two
          candidates here are created one second apart under a moved clock and are
          otherwise indistinguishable, so an implementation that stops at the two
          declared keys and lets insertion order or id ordering decide has a 50%
          chance of picking the wrong one.
        test_recipe:
          setup:
            - "An FP10-IN project with a GOLD contract ${sc} and two identical A1/4900 spares: ${early} created at 00:00:00.000Z and ${late} created one second later."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Tie Break Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
            - call: "POST /service-contracts"
              payload: { project_id: "${pj}", tier: "GOLD", spare_pct_bp: 300, term_months: 60 }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { sc: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "S-EARLY" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { early: $.data.id }
            - call: "POST /modules/${early}/pixel-test"
              payload: { dead_pixel_count: 0, max_cluster_size: 0 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${early}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_color_x: 0.3130, measured_color_y: 0.3290 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:01.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "S-LATE" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { late: $.data.id }
            - call: "POST /modules/${late}/pixel-test"
              payload: { dead_pixel_count: 0, max_cluster_size: 0 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${late}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_color_x: 0.3130, measured_color_y: 0.3290 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /service-contracts/${sc}"
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { scv: $.data.version }
          trigger:
            - call: "POST /service-contracts/${sc}/spare-reservations"
              payload: { expected_service_contract_version: "${scv}" }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { picked: $.data.id }
          assert:
            - "trigger -> 201 with ${picked} == ${early}   # created_at 00:00:00.000Z wins the tie"
            - "both candidates had color_bin == 'A1', color_bin_rank == 0 and measured_brightness_nits == 4900, so neither declared ranking key separates them"
            - "Module.${late}.reserved_service_contract_id is null"
            - "ServiceContract.${sc}.spare_reserved_count == 1"

      - name: warranty_approval_resolves_the_dimmest_installed_module
        claim_type: input_set_filtering
        grounds:
          - calculations.faulty_module_selector
          - calculations.case_warranty_credit_cents
          - state_machines.ServiceCase.RESPONDED_to_APPROVED
        distinguishing_aspect: |
          A BRIGHTNESS_DEGRADATION claim names no module, so approval has to find
          one, and the candidate set is scoped to the CASE'S OWN CABINET: a dimmer
          free spare of the same display model sitting in stock (4700 nits) must
          lose to the dimmest INSTALLED panel (4900), because a claim is about the
          wall, not the warehouse. Within the cabinet the ranking is nits ASC, so
          the 4900 module wins over the 4950 module.
        test_recipe:
          setup:
            - "An FP16-STD 1x1 project is COMMISSIONED (burn-in passed, QA approved, mounted, visit signed off at 2026-08-05T09:00Z) with GOLD contract ${sc} ACTIVE; cabinet ${cab} holds ${m1} (4900) and ${m2} (4950); free spare ${sx} (4700) exists outside the cabinet; the clock is at 2027-02-05T09:00Z."
