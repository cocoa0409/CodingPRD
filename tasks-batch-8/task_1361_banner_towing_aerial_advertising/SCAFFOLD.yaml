scenario: |
  Banner Towing & Aerial Advertising (beach banner-tow operator): campaign
  booking by event/route & airspace approval, banner fabrication & message
  change, weather/visibility go-no-go, flight-hour billing & make-good
  flights, tow field operations & pickup technique risk, stadium TFR
  restriction compliance, client proof-of-flight documentation, seasonal
  demand & aircraft allocation.

  The operator manages a fleet of tow aircraft and pilots at one or more
  coastal bases. Clients book advertising campaigns, each containing one or
  more tow flights over defined routes (beach segments, stadiums, festivals)
  on specific calendar dates. Every route requires a per-date AirspaceApproval
  from the FAA before any flight may launch. Banner messages are fabricated
  as physical Banner entities whose text can be revised (BannerRevision) —
  a revision freezes fabrication of any unprinted prior revision. Each
  campaign books FlightSlots: concrete date + route + planned duration
  reservations that compete for scarce Aircraft under seasonal capacity
  limits. A same-day WeatherAssessment yields GO / MARGINAL / NO_GO;
  NO_GO cancels the slot without billing and creates a MakeGoodCredit that
  the client can redeem for a replacement flight within a freshness window.
  After a flight, the pilot files a FlightLog (hobbs-in/hobbs-out, pickup
  technique, tow-field observations) that drives hourly billing and accrues
  toward pilot and aircraft utilization. Stadium routes sit inside
  TFRRestrictions; slots overlapping an active TFR are blocked unless an
  explicit waiver was granted on the AirspaceApproval. Every successful
  flight must emit a ProofOfFlight bundle (GPS track digest + photo hash +
  pilot attestation) before the invoice line is considered final. Invoices
  are assembled monthly per campaign, applying make-good credits and
  weather-cancellation penalties in a pinned order. SeasonalCapacity records
  per-base, per-month aircraft allocation limits; FlightSlot booking
  consumes from that pool with strict OCC.

domain_name: banner-towing-aerial-advertising
api_prefix: /btaa

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
    - scheduled_deferred_actions
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 — Entity-Relationship Table
# =============================================================================
entities:
  - name: Base
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique base identifier, e.g. KMYB (Myrtle Beach)" }
      - { name: name, type: string, source: input, description: "Human-readable base name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CLOSED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Aircraft
    parent: Base
    common_fields: true
    fields:
      - { name: base_id, type: string, source: system, description: "FK -> Base.id; home base" }
      - { name: tail_number, type: string, source: input, description: "Registration e.g. N123AB; unique system-wide" }
      - { name: model, type: enum, source: input, description: "CITABRIA | SUPER_CUB | PAWNEE" }
      - { name: max_tow_weight_lbs, type: integer, source: input, description: "Rated max banner weight in lbs" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Published bill rate per hobbs hour" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | MAINTENANCE | RETIRED" }
      - { name: season_hours_flown, type: number, source: computed, default: 0, description: "Sum of FlightLog.hobbs_hours for this aircraft within the active season (May 1 – Sep 30)" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Pilot
    parent: Base
    common_fields: true
    fields:
      - { name: base_id, type: string, source: system, description: "FK -> Base.id; home base" }
      - { name: full_name, type: string, source: input, description: "Pilot legal name" }
      - { name: certificate_number, type: string, source: input, description: "FAA certificate number; unique" }
      - { name: tow_endorsement_level, type: enum, source: input, description: "TRAINEE | STANDARD | STADIUM_QUALIFIED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | INACTIVE" }
      - { name: season_hours_flown, type: number, source: computed, default: 0, description: "Sum of FlightLog.hobbs_hours this pilot has flown this season" }
      - { name: season_pickup_failure_count, type: integer, source: computed, default: 0, description: "Number of FlightLog rows this season whose pickup_outcome == FAILED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique route code e.g. BEACH-N-01" }
      - { name: kind, type: enum, source: input, description: "BEACH | STADIUM | FESTIVAL | PARADE" }
      - { name: base_id, type: string, source: input, description: "FK -> Base.id; base this route launches from" }
      - { name: length_nm, type: number, source: input, description: "Route length in nautical miles" }
      - { name: min_banner_length_ft, type: integer, source: input, description: "Minimum physical banner length this route requires for visibility" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Client legal entity name" }
      - { name: billing_email, type: string, source: input, description: "Invoice recipient email" }
      - { name: credit_hold, type: boolean, source: system, default: false, description: "If true, new Campaign creation is blocked" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of Invoice.balance_due_cents over non-PAID invoices" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Campaign
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: name, type: string, source: input, description: "Campaign label" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | BOOKED | IN_FLIGHT | COMPLETE | CANCELLED" }
      - { name: booked_flight_count, type: integer, source: computed, default: 0, description: "Count of FlightSlots in BOOKED or SCHEDULED" }
      - { name: flown_flight_count, type: integer, source: computed, default: 0, description: "Count of FlightSlots in FLOWN" }
      - { name: cancelled_weather_count, type: integer, source: computed, default: 0, description: "Count of FlightSlots in CANCELLED_WEATHER" }
      - { name: unapplied_make_good_cents, type: integer, source: computed, default: 0, description: "Sum of MakeGoodCredit.remaining_cents where status == OPEN" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: AirspaceApproval
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id" }
      - { name: date_local, type: string, source: input, description: "Local service date YYYY-MM-DD" }
      - { name: window_start_utc, type: datetime, source: input, description: "Approved window start (UTC)" }
      - { name: window_end_utc, type: datetime, source: input, description: "Approved window end (UTC); MUST be > window_start_utc" }
      - { name: stadium_tfr_waiver, type: boolean, source: input, default: false, description: "True only if FAA granted a TFR waiver for this window" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | GRANTED | DENIED | REVOKED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: TFRRestriction
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id the TFR covers" }
      - { name: starts_utc, type: datetime, source: input, description: "TFR start" }
      - { name: ends_utc, type: datetime, source: input, description: "TFR end (strictly after start)" }
      - { name: reason, type: string, source: input, description: "Free-text (stadium event code)" }
      - { name: status, type: enum, source: system, default: PUBLISHED, description: "PUBLISHED | CANCELLED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Banner
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id" }
      - { name: artwork_hash, type: string, source: input, description: "Hash of the current print-ready artwork file" }
      - { name: text_message, type: string, source: input, description: "Current banner text" }
      - { name: banner_length_ft, type: integer, source: input, description: "Physical banner length" }
      - { name: banner_weight_lbs, type: integer, source: input, description: "Physical banner weight" }
      - { name: current_revision_id, type: string, source: computed, description: "FK -> BannerRevision.id of the latest ACTIVE revision" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | IN_FABRICATION | READY | RETIRED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: BannerRevision
    parent: Banner
    common_fields: true
    fields:
      - { name: banner_id, type: string, source: system, description: "FK -> Banner.id" }
      - { name: revision_seq, type: integer, source: system, description: "Monotone within banner, starting at 1" }
      - { name: proposed_text, type: string, source: input, description: "New text message being proposed" }
      - { name: proposed_artwork_hash, type: string, source: input, description: "New artwork hash" }
      - { name: supersedes_revision_id, type: string, source: computed, description: "FK -> BannerRevision.id; the previous ACTIVE revision this one supersedes (null for first)" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | APPROVED | ACTIVE | SUPERSEDED | REJECTED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: SeasonalCapacity
    parent: Base
    common_fields: true
    fields:
      - { name: base_id, type: string, source: system, description: "FK -> Base.id" }
      - { name: month_yyyy_mm, type: string, source: input, description: "Calendar month identifier 'YYYY-MM'" }
      - { name: aircraft_hour_quota, type: integer, source: input, description: "Total hobbs hours this base may fly in this month" }
      - { name: hours_committed, type: integer, source: computed, default: 0, description: "Sum of FlightSlot.planned_duration_hours over BOOKED + SCHEDULED + FLOWN slots this month" }
      - { name: hours_remaining, type: integer, source: computed, description: "= aircraft_hour_quota - hours_committed" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: FlightSlot
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id" }
      - { name: route_id, type: string, source: input, description: "FK -> Route.id" }
      - { name: airspace_approval_id, type: string, source: input, description: "FK -> AirspaceApproval.id for this date+route" }
      - { name: banner_id, type: string, source: input, description: "FK -> Banner.id" }
      - { name: date_local, type: string, source: input, description: "Local service date YYYY-MM-DD; MUST equal approval.date_local" }
      - { name: planned_start_utc, type: datetime, source: input, description: "Planned takeoff time" }
      - { name: planned_duration_hours, type: integer, source: input, description: "Planned hobbs hours; integer 1..8" }
      - { name: assigned_aircraft_id, type: string, source: computed, description: "FK -> Aircraft.id; assigned by selector on BOOK" }
      - { name: assigned_pilot_id, type: string, source: computed, description: "FK -> Pilot.id; assigned by selector on BOOK" }
      - { name: supersedes_slot_id, type: string, source: input, description: "FK -> FlightSlot.id; set when this slot is a make-good replacement for a prior CANCELLED_WEATHER slot" }
      - { name: consumed_make_good_credit_id, type: string, source: computed, description: "FK -> MakeGoodCredit.id applied to this slot at invoice time" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | BOOKED | SCHEDULED | WEATHER_HOLD | FLOWN | CANCELLED_CLIENT | CANCELLED_WEATHER | CANCELLED_TFR" }
      - { name: weather_hold_count, type: integer, source: computed, default: 0, description: "Number of times this slot has entered WEATHER_HOLD (≥2 forces CANCELLED_WEATHER on next NO_GO)" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: WeatherAssessment
    parent: FlightSlot
    common_fields: false
    fields:
      - { name: slot_id, type: string, source: system, description: "FK -> FlightSlot.id" }
      - { name: assessed_at_utc, type: datetime, source: system, description: "Server-stamped assessment time" }
      - { name: ceiling_ft, type: integer, source: input, description: "Reported cloud ceiling in feet AGL" }
      - { name: visibility_sm, type: number, source: input, description: "Reported visibility in statute miles" }
      - { name: wind_kts, type: integer, source: input, description: "Reported surface wind" }
      - { name: verdict, type: enum, source: computed, description: "GO | MARGINAL | NO_GO — derived by go_no_go_decision" }
      - { name: assessed_by_pilot_id, type: string, source: system, description: "FK -> Pilot.id; the assessing pilot" }

  - name: FlightLog
    parent: FlightSlot
    common_fields: true
    fields:
      - { name: slot_id, type: string, source: system, description: "FK -> FlightSlot.id" }
      - { name: aircraft_id, type: string, source: system, description: "FK -> Aircraft.id (copied from slot.assigned_aircraft_id at filing)" }
      - { name: pilot_id, type: string, source: system, description: "FK -> Pilot.id (copied from slot.assigned_pilot_id at filing)" }
      - { name: hobbs_out, type: number, source: input, description: "Hobbs reading at engine start" }
      - { name: hobbs_in, type: number, source: input, description: "Hobbs reading at shutdown; MUST be > hobbs_out" }
      - { name: hobbs_hours, type: number, source: computed, description: "= hobbs_in - hobbs_out, rounded to 0.1 hr" }
      - { name: pickup_technique, type: enum, source: input, description: "GROUND_PICKUP | AERIAL_PICKUP" }
      - { name: pickup_outcome, type: enum, source: input, description: "CLEAN | RETRIED | FAILED" }
      - { name: tow_field_notes, type: string, source: input, description: "Free-text tow-field observations" }
      - { name: filed_at_utc, type: datetime, source: system, description: "Server-stamped filing time" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: MakeGoodCredit
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id" }
      - { name: source_slot_id, type: string, source: system, description: "FK -> FlightSlot.id whose CANCELLED_WEATHER created this credit" }
      - { name: original_cents, type: integer, source: system, description: "Initial credit value = source_slot.planned_duration_hours * aircraft.hourly_rate_cents" }
      - { name: remaining_cents, type: integer, source: computed, description: "Unapplied remainder; decreases when applied at invoice" }
      - { name: expires_on_local, type: string, source: system, description: "= source_slot.date_local + 30 days" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | PARTIALLY_APPLIED | FULLY_APPLIED | EXPIRED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ProofOfFlight
    parent: FlightSlot
    common_fields: false
    fields:
      - { name: slot_id, type: string, source: system, description: "FK -> FlightSlot.id" }
      - { name: gps_track_digest, type: string, source: input, description: "SHA-256 of the GPS track file" }
      - { name: photo_hash, type: string, source: input, description: "SHA-256 of banner-in-flight photo" }
      - { name: pilot_attestation, type: boolean, source: input, description: "Pilot affirms flight occurred as logged" }
      - { name: submitted_at_utc, type: datetime, source: system, description: "Server-stamped submission time" }
      - { name: finalized, type: boolean, source: system, default: false, description: "True once ComplianceOfficer finalizes" }

  - name: Invoice
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id" }
      - { name: period_yyyy_mm, type: string, source: input, description: "Billing period 'YYYY-MM'" }
      - { name: flight_subtotal_cents, type: integer, source: computed, description: "Sum over FLOWN slots this period of (FlightLog.hobbs_hours * aircraft.hourly_rate_cents), each line rounded to cents" }
      - { name: cancellation_penalty_cents, type: integer, source: computed, description: "Sum of penalties on CANCELLED_CLIENT slots per weather_cancellation_penalty_rule" }
      - { name: make_good_applied_cents, type: integer, source: computed, description: "Total credits applied to this invoice from OPEN/PARTIALLY_APPLIED MakeGoodCredits" }
      - { name: total_cents, type: integer, source: computed, description: "= flight_subtotal_cents + cancellation_penalty_cents - make_good_applied_cents; floor 0" }
      - { name: balance_due_cents, type: integer, source: computed, description: "= total_cents at issuance; decremented by payment applications (out of scope for v1)" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | PAID | VOID" }
      - { name: version, type: integer, source: system, description: "OCC version" }

# =============================================================================
# §1.2 — State Machine Table
# =============================================================================
state_machines:
  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: DRAFT
        to: BOOKED
        trigger: "POST /btaa/campaigns/{id}/book"
        actor: Client
        preconditions:
          - "campaign has >= 1 FlightSlot in BOOKED (created by POST /btaa/campaigns/{id}/flight_slots with action=BOOK)"
          - "client.credit_hold == false (else ERR_CLIENT_CREDIT_HOLD)"
        side_effects:
          - "campaign.booked_flight_count recomputed"
      - from: BOOKED
        to: IN_FLIGHT
        trigger: "system (automatic when first child FlightSlot transitions to SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_FLIGHT
        to: COMPLETE
        trigger: "system (automatic when every child FlightSlot is in a terminal state {FLOWN, CANCELLED_CLIENT, CANCELLED_WEATHER, CANCELLED_TFR} AND every Invoice for this campaign is PAID or VOID)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /btaa/campaigns/{id}/cancel"
        actor: Client
        preconditions:
          - "no child FlightSlot in BOOKED/SCHEDULED/WEATHER_HOLD (else ERR_CAMPAIGN_HAS_OPEN_SLOTS)"
        side_effects:
          - "cascade: child FlightSlots in DRAFT → CANCELLED_CLIENT"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /btaa/campaigns/{id}/cancel"
        actor: Client
        preconditions:
          - "no child FlightSlot in SCHEDULED or WEATHER_HOLD (else ERR_CAMPAIGN_HAS_OPEN_SLOTS)"
        side_effects:
          - "cascade: child FlightSlots in DRAFT/BOOKED → CANCELLED_CLIENT (each cancellation accrues a penalty per weather_cancellation_penalty_rule)"
          - "release SeasonalCapacity.hours_committed for each cancelled slot's month"
      - from: IN_FLIGHT
        to: CANCELLED
        trigger: "POST /btaa/campaigns/{id}/cancel"
        actor: Client
        preconditions:
          - "no child FlightSlot in SCHEDULED or WEATHER_HOLD"
        side_effects:
          - "cascade as above"

  - entity: Banner
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: IN_FABRICATION
        trigger: "POST /btaa/banners/{id}/fabricate"
        actor: GroundCrewLead
        preconditions:
          - "current ACTIVE BannerRevision exists (else ERR_NO_ACTIVE_REVISION)"
          - "banner_length_ft >= route.min_banner_length_ft for every route the parent campaign has booked (else ERR_BANNER_TOO_SHORT)"
        side_effects: []
      - from: IN_FABRICATION
        to: READY
        trigger: "POST /btaa/banners/{id}/mark_ready"
        actor: GroundCrewLead
        preconditions: []
        side_effects: []
      - from: IN_FABRICATION
        to: DRAFT
        trigger: "system (automatic when a new BannerRevision becomes ACTIVE, forcing refab)"
        actor: system
        preconditions: []
        side_effects:
          - "current_revision_id updated to the new ACTIVE revision"
      - from: READY
        to: DRAFT
        trigger: "system (automatic when a new BannerRevision becomes ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "current_revision_id updated"
      - from: READY
        to: RETIRED
        trigger: "POST /btaa/banners/{id}/retire"
        actor: GroundCrewLead
        preconditions:
          - "no FlightSlot in BOOKED/SCHEDULED/WEATHER_HOLD references this banner (else ERR_BANNER_IN_USE)"
        side_effects: []

  - entity: BannerRevision
    initial_state: PROPOSED
    terminal_states: [ACTIVE, SUPERSEDED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /btaa/banner_revisions/{id}/approve"
        actor: Client
        preconditions:
          - "approver is the campaign-owning client (segregation: not GroundCrewLead)"
        side_effects: []
      - from: APPROVED
        to: ACTIVE
        trigger: "system (automatic immediately after APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "prior ACTIVE revision on the same banner → SUPERSEDED"
          - "parent Banner: if status == IN_FABRICATION or READY, force → DRAFT"
          - "parent Banner.current_revision_id updated"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /btaa/banner_revisions/{id}/reject"
        actor: Client
        preconditions: []
        side_effects: []

  - entity: AirspaceApproval
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED, REVOKED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /btaa/airspace_approvals/{id}/grant"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: PENDING
        to: DENIED
        trigger: "POST /btaa/airspace_approvals/{id}/deny"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: GRANTED
        to: REVOKED
        trigger: "POST /btaa/airspace_approvals/{id}/revoke"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "cascade: every FlightSlot referencing this approval in BOOKED/SCHEDULED/WEATHER_HOLD → CANCELLED_TFR"
          - "release SeasonalCapacity.hours_committed for each cancelled slot's month"

  - entity: FlightSlot
    initial_state: DRAFT
    terminal_states: [FLOWN, CANCELLED_CLIENT, CANCELLED_WEATHER, CANCELLED_TFR]
    transitions:
      - from: DRAFT
        to: BOOKED
        trigger: "POST /btaa/campaigns/{id}/flight_slots with action=BOOK"
        actor: Client
        preconditions:
          - "AirspaceApproval.status == GRANTED for (route_id, date_local)"
          - "AirspaceApproval.window contains [planned_start_utc, planned_start_utc + planned_duration_hours]"
          - "Banner.status == READY"
          - "Banner.current_revision_id is not null"
          - "if Route.kind == STADIUM and any TFRRestriction(status==PUBLISHED) covers the slot window: approval.stadium_tfr_waiver must be true (else ERR_TFR_BLOCKS_SLOT)"
          - "seasonal capacity: SeasonalCapacity.hours_remaining >= planned_duration_hours for (route.base_id, month of date_local) (else ERR_SEASONAL_CAPACITY_EXCEEDED)"
          - "selector must yield an eligible Aircraft and Pilot per aircraft_selector / pilot_selector (else ERR_NO_ELIGIBLE_AIRCRAFT / ERR_NO_ELIGIBLE_PILOT)"
          - "if supersedes_slot_id set: source slot must be CANCELLED_WEATHER and its MakeGoodCredit must be OPEN or PARTIALLY_APPLIED"
        side_effects:
          - "SeasonalCapacity.hours_committed += planned_duration_hours"
          - "assigned_aircraft_id / assigned_pilot_id populated"
          - "campaign.booked_flight_count recomputed"
      - from: BOOKED
        to: SCHEDULED
        trigger: "POST /btaa/flight_slots/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "slot is at least T-2h before planned_start_utc (else ERR_TOO_LATE_TO_SCHEDULE)"
          - "assigned aircraft.status == ACTIVE"
          - "assigned pilot.status == ACTIVE"
        side_effects:
          - "if parent campaign.status == BOOKED → campaign IN_FLIGHT"
      - from: SCHEDULED
        to: WEATHER_HOLD
        trigger: "POST /btaa/flight_slots/{id}/weather_assessments (system auto-transition when verdict==NO_GO)"
        actor: system
        preconditions: []
        side_effects:
          - "weather_hold_count += 1"
      - from: WEATHER_HOLD
        to: SCHEDULED
        trigger: "POST /btaa/flight_slots/{id}/reschedule_after_hold"
        actor: Dispatcher
        preconditions:
          - "new planned_start_utc still inside approval window"
          - "weather_hold_count < 2 (else slot must be CANCELLED_WEATHER instead)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED_WEATHER
        trigger: "system (automatic when a WeatherAssessment yields NO_GO and weather_hold_count after increment would be >= 2)"
        actor: system
        preconditions: []
        side_effects:
          - "create MakeGoodCredit (original_cents = planned_duration_hours * aircraft.hourly_rate_cents; expires_on_local = date_local + 30d)"
          - "release SeasonalCapacity.hours_committed"
          - "campaign.cancelled_weather_count recomputed"
      - from: WEATHER_HOLD
        to: CANCELLED_WEATHER
        trigger: "system (same rule as above)"
        actor: system
        preconditions: []
        side_effects:
          - "create MakeGoodCredit"
          - "release SeasonalCapacity.hours_committed"
      - from: SCHEDULED
        to: FLOWN
        trigger: "POST /btaa/flight_slots/{id}/flight_log (filing the log transitions the slot)"
        actor: Pilot
        preconditions:
          - "slot.assigned_pilot_id == X-User-ID (segregation: only the assigned pilot may file)"
          - "hobbs_in > hobbs_out (else ERR_INVALID_HOBBS)"
        side_effects:
          - "FlightLog created; slot.status = FLOWN"
          - "Aircraft.season_hours_flown += FlightLog.hobbs_hours (if within May 1 – Sep 30)"
          - "Pilot.season_hours_flown += FlightLog.hobbs_hours"
          - "if pickup_outcome == FAILED: Pilot.season_pickup_failure_count += 1; if count crosses 3 → pilot.status = SUSPENDED"
          - "campaign.flown_flight_count recomputed"
      - from: BOOKED
        to: CANCELLED_CLIENT
        trigger: "POST /btaa/flight_slots/{id}/cancel_by_client"
        actor: Client
        preconditions: []
        side_effects:
          - "release SeasonalCapacity.hours_committed"
          - "penalty accrues to next invoice per weather_cancellation_penalty_rule"
      - from: SCHEDULED
        to: CANCELLED_CLIENT
        trigger: "POST /btaa/flight_slots/{id}/cancel_by_client"
        actor: Client
        preconditions: []
        side_effects:
          - "release SeasonalCapacity.hours_committed"
          - "penalty accrues"
      - from: BOOKED
        to: CANCELLED_TFR
        trigger: "system (cascade from AirspaceApproval → REVOKED)"
        actor: system
        preconditions: []
        side_effects:
          - "release SeasonalCapacity.hours_committed"
      - from: SCHEDULED
        to: CANCELLED_TFR
        trigger: "system (cascade from AirspaceApproval → REVOKED)"
        actor: system
        preconditions: []
        side_effects:
          - "release SeasonalCapacity.hours_committed"
      - from: WEATHER_HOLD
        to: CANCELLED_TFR
        trigger: "system (cascade from AirspaceApproval → REVOKED)"
        actor: system
        preconditions: []
        side_effects:
          - "release SeasonalCapacity.hours_committed"

  - entity: MakeGoodCredit
    initial_state: OPEN
    terminal_states: [FULLY_APPLIED, EXPIRED]
    transitions:
      - from: OPEN
        to: PARTIALLY_APPLIED
        trigger: "system (during invoice issuance when credit partially consumed)"
        actor: system
        preconditions: []
        side_effects: ["remaining_cents decremented"]
      - from: OPEN
        to: FULLY_APPLIED
        trigger: "system (during invoice issuance when credit fully consumed)"
        actor: system
        preconditions: []
        side_effects: ["remaining_cents = 0"]
      - from: PARTIALLY_APPLIED
        to: FULLY_APPLIED
        trigger: "system (during invoice issuance when remainder consumed)"
        actor: system
        preconditions: []
        side_effects: ["remaining_cents = 0"]
      - from: OPEN
        to: EXPIRED
        trigger: "system (during ops_run when expires_on_local < current_local_date)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Pilot
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when season_pickup_failure_count reaches 3)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade: every SCHEDULED FlightSlot assigned to this pilot reverts to BOOKED and assigned_pilot_id cleared; selector will re-pick on next schedule"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /btaa/pilots/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "season_pickup_failure_count < 3"
        side_effects: []
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /btaa/pilots/{id}/deactivate"
        actor: PlatformAdmin
        preconditions:
          - "no SCHEDULED slots assigned to this pilot"
        side_effects: []

  - entity: Aircraft
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "POST /btaa/aircraft/{id}/ground"
        actor: GroundCrewLead
        preconditions: []
        side_effects:
          - "cascade: every SCHEDULED FlightSlot assigned to this aircraft reverts to BOOKED and assigned_aircraft_id cleared"
      - from: MAINTENANCE
        to: ACTIVE
        trigger: "POST /btaa/aircraft/{id}/return_to_service"
        actor: GroundCrewLead
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /btaa/aircraft/{id}/retire"
        actor: PlatformAdmin
        preconditions:
          - "no SCHEDULED slots assigned to this aircraft"
        side_effects: []

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /btaa/invoices/{id}/mark_paid"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "client.outstanding_balance_cents recomputed"
      - from: ISSUED
        to: VOID
        trigger: "POST /btaa/invoices/{id}/void"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "client.outstanding_balance_cents recomputed"
          - "any MakeGoodCredits applied to this invoice revert: remaining_cents restored, status OPEN or PARTIALLY_APPLIED as appropriate"

  - entity: TFRRestriction
    initial_state: PUBLISHED
    terminal_states: [CANCELLED]
    transitions:
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /btaa/tfr_restrictions/{id}/cancel"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 — Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: campaign-book-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /btaa/campaigns/{id}/book"
    occ_field: "expected_campaign_version"
    description: |
      Booking a Campaign whose version has advanced since the client last
      observed it is rejected. Captures the case where another writer has
      just added a FlightSlot (bumping campaign.version) and the current
      writer's view of which slots exist is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: flight-slot-book-stale-capacity
    parent_entity: SeasonalCapacity
    write_endpoint: "POST /btaa/campaigns/{id}/flight_slots"
    occ_field: "expected_seasonal_capacity_version"
    description: |
      Creating a FlightSlot against a SeasonalCapacity whose version has
      advanced since the client last observed it is rejected. Captures the
      case where another writer has just booked a different slot against the
      same (base, month) pool, consuming quota the current writer believed
      was still available.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: banner-fabricate-stale-banner
    parent_entity: Banner
    write_endpoint: "POST /btaa/banners/{id}/fabricate"
    occ_field: "expected_banner_version"
    description: |
      Starting fabrication against a Banner whose version has advanced is
      rejected. Captures the case where a BannerRevision was just promoted
      to ACTIVE (forcing status → DRAFT and bumping banner.version) and the
      fabricator's view of which revision to print is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 — Calculation Rules Table
# =============================================================================
calculations:
  - name: go_no_go_decision
    trigger: "POST /btaa/flight_slots/{id}/weather_assessments"
    algorithm: threshold
    formula: |
      if visibility_sm < 3.0 OR ceiling_ft < 1000 OR wind_kts > 25:
        verdict = NO_GO
      else if visibility_sm < 5.0 OR ceiling_ft < 1500 OR wind_kts > 18:
        verdict = MARGINAL
      else:
        verdict = GO
      # MARGINAL does not change slot state; NO_GO drives WEATHER_HOLD /
      # CANCELLED_WEATHER per the FlightSlot state machine.
    constants:
      VFR_MIN_VISIBILITY_SM: 3.0
      VFR_MIN_CEILING_FT: 1000
      MAX_WIND_KTS: 25
      MARGINAL_VISIBILITY_SM: 5.0
      MARGINAL_CEILING_FT: 1500
      MARGINAL_WIND_KTS: 18

  - name: flight_hour_billing
    trigger: "Invoice issuance (POST /btaa/campaigns/{id}/invoices)"
    algorithm: tiered_pricing
    formula: |
      # Per-FLOWN-slot line: line_cents = round_half_up(hobbs_hours * hourly_rate_cents)
      # Tiered volume discount applies across the WHOLE INVOICE, not per-line:
      #   total_hobbs_hours_this_period <= 20        → discount_pct = 0
      #   20 < total_hobbs_hours <= 50               → discount_pct = 5
      #   total_hobbs_hours > 50                     → discount_pct = 10
      # flight_subtotal_cents =
      #   round_half_up( sum(line_cents) * (1 - discount_pct/100) )
      # Rounding order (PINNED): per-line rounding first, sum, then apply
      # discount and round again. Do NOT round the discount factor itself.
    input_set: "FlightSlots with status == FLOWN whose FlightLog.filed_at_utc falls inside period_yyyy_mm; lines ordered by FlightLog.filed_at_utc ASC (tie-break: FlightLog.created_at ASC)"
    constants:
      TIER1_MAX_HOURS: 20
      TIER2_MAX_HOURS: 50
      TIER1_DISCOUNT_PCT: 0
      TIER2_DISCOUNT_PCT: 5
      TIER3_DISCOUNT_PCT: 10
    precision: "0 decimal places on output cents; per-line round_half_up before sum"
    variants:
      - name: provisional
        when: "Campaign dashboard preview (GET /btaa/campaigns/{id}/billing_preview) — uses planned_duration_hours for any BOOKED/SCHEDULED slots in the period PLUS FlightLog.hobbs_hours for FLOWN slots"
        difference: "Counts un-flown slots at their planned hours; never includes cancellation_penalty_cents or make_good_applied_cents"
      - name: final
        when: "Actual invoice issuance"
        difference: "Only FLOWN slots contribute; includes penalties and credits"

  - name: weather_cancellation_penalty_rule
    trigger: "Invoice issuance — for every CANCELLED_CLIENT slot in the period"
    algorithm: threshold
    formula: |
      # Penalty is a fraction of the slot's planned value:
      #   planned_value_cents = planned_duration_hours * aircraft.hourly_rate_cents
      # Fraction depends on notice period = planned_start_utc - cancelled_at_utc:
      #   notice >= 72h    → penalty = 0
      #   24h <= notice < 72h  → penalty = round_half_up(planned_value * 0.25)
      #   notice < 24h     → penalty = round_half_up(planned_value * 0.50)
      # Boundary precision: '>= 72h' is INCLUSIVE at 72h (i.e., 72h00m00s → 0);
      # '24h <= notice < 72h' is INCLUSIVE at 24h.
      # cancellation_penalty_cents = sum of per-slot penalties.
    constants:
      FULL_NOTICE_HOURS: 72
      PARTIAL_NOTICE_HOURS: 24
      PARTIAL_PENALTY_PCT: 25
      LATE_PENALTY_PCT: 50
    precision: "0 decimal places on output cents, round_half_up per slot"

  - name: make_good_credit_application
    trigger: "Invoice issuance — after flight_subtotal_cents and cancellation_penalty_cents are computed"
    algorithm: waterfall_allocation
    formula: |
      # Apply credits in expiry order, then creation order:
      #   credits = OPEN or PARTIALLY_APPLIED MakeGoodCredits for this campaign
      #             where expires_on_local >= period_end_local
      #             sorted by expires_on_local ASC, then created_at ASC
      # available_cents = flight_subtotal_cents + cancellation_penalty_cents
      # for each credit in order:
      #   apply_cents = min(credit.remaining_cents, available_cents - make_good_applied_cents)
      #   make_good_applied_cents += apply_cents
      #   credit.remaining_cents -= apply_cents
      #   if credit.remaining_cents == 0: credit.status = FULLY_APPLIED
      #   else: credit.status = PARTIALLY_APPLIED
      # total_cents = max(0, available_cents - make_good_applied_cents)
    constants: {}
    precision: "integer cents; no rounding"

  - name: aircraft_selector
    trigger: "FlightSlot DRAFT → BOOKED transition"
    algorithm: weighted_scoring
    formula: |
      # Eligibility filter:
      #   aircraft.base_id == route.base_id
      #   aircraft.status == ACTIVE
      #   aircraft.max_tow_weight_lbs >= banner.banner_weight_lbs
      #   aircraft.season_hours_flown + slot.planned_duration_hours <= aircraft_season_hard_cap_hours
      # Ranking expression (lower is better):
      #   score = (aircraft.season_hours_flown * 100) + (aircraft.hourly_rate_cents / 1000)
      #   (prefers load-balancing hours across the fleet, breaks value ties by rate)
      # Tie-break: aircraft.created_at ASC (never id).
      # Fallback when set empty: ERR_NO_ELIGIBLE_AIRCRAFT.
    constants:
      AIRCRAFT_SEASON_HARD_CAP_HOURS: 600

  - name: pilot_selector
    trigger: "FlightSlot DRAFT → BOOKED transition (runs after aircraft_selector)"
    algorithm: weighted_scoring
    formula: |
      # Eligibility filter:
      #   pilot.base_id == route.base_id
      #   pilot.status == ACTIVE
      #   pilot.season_pickup_failure_count < 3
      #   if route.kind == STADIUM: pilot.tow_endorsement_level == STADIUM_QUALIFIED
      #   pilot.season_hours_flown + slot.planned_duration_hours <= pilot_season_hard_cap_hours
      # Ranking expression (lower is better):
      #   score = (pilot.season_hours_flown * 100) - (tow_endorsement_rank * 50)
      #   where tow_endorsement_rank = {TRAINEE: 0, STANDARD: 1, STADIUM_QUALIFIED: 2}
      # Tie-break: pilot.created_at ASC (never id).
      # Fallback when set empty: ERR_NO_ELIGIBLE_PILOT.
    constants:
      PILOT_SEASON_HARD_CAP_HOURS: 500

  - name: banner_revision_refab_trigger
    trigger: "BannerRevision APPROVED → ACTIVE"
    algorithm: constraint_propagation
    formula: |
      # A new ACTIVE revision invalidates any prior fabrication state:
      #   prior ACTIVE revision → SUPERSEDED
      #   if banner.status ∈ {IN_FABRICATION, READY}: banner.status → DRAFT
      #   banner.current_revision_id = new revision id
      # Propagation order (PINNED):
      #   1) supersede prior revision
      #   2) demote banner status
      #   3) update banner.current_revision_id
      # This order ensures the banner NEVER briefly references a SUPERSEDED
      # revision as its current_revision_id.

  - name: seasonal_capacity_consumption
    trigger: "FlightSlot DRAFT → BOOKED, and any CANCELLED_* transition"
    algorithm: aggregation
    formula: |
      # hours_committed = sum of planned_duration_hours over FlightSlots for
      # this (base_id, month) in {BOOKED, SCHEDULED, WEATHER_HOLD, FLOWN}.
      # CANCELLED_* slots do NOT contribute.
      # hours_remaining = aircraft_hour_quota - hours_committed
      # Recomputed on every transition that changes a slot into or out of
      # the contributing set.
    precision: "integer hours"

  - name: pickup_failure_suspension_threshold
    trigger: "FlightLog filed with pickup_outcome == FAILED"
    algorithm: threshold
    formula: |
      # season_pickup_failure_count incremented
      # if season_pickup_failure_count >= 3 (INCLUSIVE at 3):
      #   pilot.status = SUSPENDED (automatic)
      # Boundary: exactly 3 failures suspends; 2 does not.
    constants:
      SUSPENSION_THRESHOLD: 3

  - name: tfr_overlap_detection
    trigger: "FlightSlot DRAFT → BOOKED (when route.kind == STADIUM)"
    algorithm: interval_merge
    formula: |
      # Slot interval: [planned_start_utc, planned_start_utc + planned_duration_hours)
      #   (half-open: end is exclusive)
      # TFR interval: [starts_utc, ends_utc)   (half-open)
      # Overlap iff slot.start < tfr.end AND slot.end > tfr.start
      # Adjacent intervals (slot.end == tfr.start) do NOT count as overlap.
      # If overlap and not approval.stadium_tfr_waiver: reject ERR_TFR_BLOCKS_SLOT.

# =============================================================================
# §1.4 — Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-ID header present and valid for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path-template resource IDs exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: existence
    check: "Body-referenced FK IDs exist (banner_id, route_id, airspace_approval_id, supersedes_slot_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints accepting FK inputs"

  - priority: 6
    category: state
    check: "Target resource is in a from-state permitting the transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "Terminal-state lockdown: no transitions out of a terminal state"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_safety
    check: "TFR: stadium slot overlapping PUBLISHED TFR requires stadium_tfr_waiver=true on the approval"
    error_id: ERR_TFR_BLOCKS_SLOT
    http_status: 409
    applies_to: ["POST /btaa/campaigns/{id}/flight_slots"]

  - priority: 9
    category: business_safety
    check: "AirspaceApproval must be GRANTED and contain the slot window"
    error_id: ERR_AIRSPACE_NOT_APPROVED
    http_status: 409
    applies_to: ["POST /btaa/campaigns/{id}/flight_slots"]

  - priority: 10
    category: business_safety
    check: "Pickup technique AERIAL_PICKUP requires pilot.tow_endorsement_level != TRAINEE at filing time"
    error_id: ERR_PICKUP_TECHNIQUE_NOT_ENDORSED
    http_status: 409
    applies_to: ["POST /btaa/flight_slots/{id}/flight_log"]

  - priority: 11
    category: business_constraint
    check: "Banner must be READY and have current_revision_id set; banner_length_ft >= route.min_banner_length_ft"
    error_id: ERR_BANNER_NOT_READY
    http_status: 409
    applies_to: ["POST /btaa/campaigns/{id}/flight_slots"]

  - priority: 12
    category: business_constraint
    check: "supersedes_slot_id: source slot must be CANCELLED_WEATHER with an OPEN/PARTIALLY_APPLIED credit"
    error_id: ERR_INVALID_MAKE_GOOD_SOURCE
    http_status: 409
    applies_to: ["POST /btaa/campaigns/{id}/flight_slots"]

  - priority: 13
    category: business_constraint
    check: "No two FlightSlots for the same aircraft may overlap in time (half-open interval)"
    error_id: ERR_AIRCRAFT_DOUBLE_BOOKED
    http_status: 409
    applies_to: ["POST /btaa/campaigns/{id}/flight_slots"]

  - priority: 14
    category: business_constraint
    check: "hobbs_in > hobbs_out on FlightLog filing"
    error_id: ERR_INVALID_HOBBS
    http_status: 422
    applies_to: ["POST /btaa/flight_slots/{id}/flight_log"]

  - priority: 15
    category: business_temporal
    check: "planned_start_utc must be at least T+24h in the future at booking time"
    error_id: ERR_BOOKING_TOO_SOON
    http_status: 409
    applies_to: ["POST /btaa/campaigns/{id}/flight_slots"]

  - priority: 16
    category: business_temporal
    check: "planned window [planned_start_utc, planned_start_utc + planned_duration_hours) must lie entirely within approval window"
    error_id: ERR_OUTSIDE_APPROVAL_WINDOW
    http_status: 409
    applies_to: ["POST /btaa/campaigns/{id}/flight_slots"]

  - priority: 17
    category: business_temporal
    check: "Schedule requires slot at least T-2h before planned_start_utc"
    error_id: ERR_TOO_LATE_TO_SCHEDULE
    http_status: 409
    applies_to: ["POST /btaa/flight_slots/{id}/schedule"]

  - priority: 18
    category: business_fiscal
    check: "client.credit_hold == false to create a new Campaign"
    error_id: ERR_CLIENT_CREDIT_HOLD
    http_status: 402
    applies_to: ["POST /btaa/clients/{id}/campaigns"]

  - priority: 19
    category: business_fiscal
    check: "SeasonalCapacity.hours_remaining >= slot.planned_duration_hours"
    error_id: ERR_SEASONAL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: ["POST /btaa/campaigns/{id}/flight_slots"]

  - priority: 20
    category: business_referential
    check: "Only the campaign-owning Client may approve/reject a BannerRevision or cancel its own FlightSlots"
    error_id: ERR_UNAUTHORIZED_OWNER
    http_status: 403
    applies_to: ["POST /btaa/banner_revisions/{id}/approve", "POST /btaa/banner_revisions/{id}/reject", "POST /btaa/flight_slots/{id}/cancel_by_client", "POST /btaa/campaigns/{id}/cancel"]

  - priority: 21
    category: business_referential
    check: "Only the assigned Pilot may file the FlightLog for a slot"
    error_id: ERR_UNAUTHORIZED_OWNER
    http_status: 403
    applies_to: ["POST /btaa/flight_slots/{id}/flight_log"]

  - priority: 22
    category: business_referential
    check: "Segregation of duties: ComplianceOfficer who granted an AirspaceApproval cannot also file its FlightLogs"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /btaa/flight_slots/{id}/flight_log"]

  - priority: 23
    category: state
    check: "OCC: expected_*_version request field matches parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /btaa/campaigns/{id}/book", "POST /btaa/campaigns/{id}/flight_slots", "POST /btaa/banners/{id}/fabricate"]

# =============================================================================
# §1.5 — API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/btaa/_clock/set_current_utc"
