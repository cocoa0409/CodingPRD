  - rule_id: transitive_cascade
    instances:
      - name: release_cascade_promotes_a_queued_assignment_four_links_deep
        grounds:
          - state_machines.CoverageAssignment.COMMITTED_to_RELEASED
          - state_machines.CoverageAssignment.QUEUED_to_COMMITTED
          - calculations.csm_capacity_conservation
          - calculations.coverage_posture_derivation
        distinguishing_aspect: |
          DEPTH 4 from the release trigger: releasing A's assignment (link 1)
          frees Csm capacity (link 2), the freed capacity is what promotes B's
          QUEUED assignment (link 3), and only because B's assignment entered
          COMMITTED does account B gain assigned_csm_id and flip to
          coverage_posture OPEN (link 4). Each link is caused by the previous one,
          not by the release call.
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 17."
            - "Account A COMMITTED at 17 load_units, so capacity_units_available is 0 and A is coverage_posture OPEN."
            - "Account B (MIDMARKET, load_units 12) holding a QUEUED assignment against the same Csm, coverage_posture RESTRICTED."
