            - "end_date == 2026-08-10"
            - "the same-day restart returns HTTP 409"
            - "overlap_err == ERR_BED_HOLD_OVERLAP"
            - "occ2 == HOSPITALIZED"
            - "start2 == 2026-08-11"
            - "used2 == 5"
            - "count2 == 2"

      - name: val_future_survey_date_rejected_against_logical_clock
        claim_type: temporal_validation
        grounds:
          - validations[priority=85,ERR_DATE_OUT_OF_RANGE]
          - errors.ERR_DATE_OUT_OF_RANGE
        distinguishing_aspect: |
          The future-date guard is measured against the logical clock, not wall time: a survey_date
          of 2026-08-02 recorded while the clock stands at 2026-08-01T00:00:00Z is rejected with
          ERR_DATE_OUT_OF_RANGE, whereas the same call dated 2026-08-01 with an empty deficiencies
          array succeeds, scores 0 and leaves the unit CERTIFIED.
