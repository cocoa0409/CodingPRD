  - section: calculations
    instances:
      - name: sla_due_date_p1_uses_default_clock
        claim_type: correct_result
        grounds: ['calculations.action_item_due_sla', 'entities.ActionItem.fields.due_date']
        distinguishing_aspect: "With no clock call ever made, the logical clock is the fixed default 2026-05-01T00:00:00Z, so a P1 item's due_date is exactly 2026-05-31T00:00:00Z (30-day SLA); due_in_days overrides the SLA."
        test_recipe:
          setup: ["Unit U, REQ exist; no set_current_utc call is made"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
          trigger:
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a", priority: "P1", assignee_id: "${req_id}" }, as: PsmManager, captures: { a1: $.data.id } }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "b", priority: "P3", assignee_id: "${req_id}", due_in_days: 7 }, as: PsmManager, captures: { a2: $.data.id } }
          assert:
            - "ActionItem.${a1}.due_date == 2026-05-31T00:00:00Z (default clock + P1 30d)"
            - "ActionItem.${a2}.due_date == 2026-05-08T00:00:00Z (due_in_days override beats P3 180d SLA)"

      - name: overdue_uses_strict_less_than
        claim_type: precision
        grounds: ['calculations.action_item_due_sla', 'entities.PlantUnit.fields.overdue_action_count']
        distinguishing_aspect: "Overdue comparison is strict: at clock exactly == due_date the item is NOT overdue; one day later it is."
        test_recipe:
          setup: ["Unit U, REQ; P1 item created at default clock (due 2026-05-31)"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a", priority: "P1", assignee_id: "${req_id}" }, as: PsmManager, captures: { a_id: $.data.id } }
            - { call: "POST /psm/_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T00:00:00Z" }, as: PsmAdmin }
          trigger:
            - { call: "GET /psm/units/${u_id}", as: PsmManager }
            - { call: "POST /psm/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PsmAdmin }
            - { call: "GET /psm/units/${u_id}", as: PsmManager }
          assert:
            - "at 2026-05-31 (== due_date): overdue_action_count == 0"
            - "at 2026-06-01 (> due_date): overdue_action_count == 1"

      - name: pha_due_soon_and_overdue_threshold_boundaries
        claim_type: constants_applied
        grounds: ['calculations.pha_nominal_next_due', 'state_machines.PhaStudy.CURRENT_to_DUE_SOON', 'state_machines.PhaStudy.DUE_SOON_to_OVERDUE']
        distinguishing_aspect: "DUE_SOON starts at effective_next_due - 60d inclusive (2026-11-11 for due 2027-01-10); OVERDUE requires strictly greater than effective_next_due (2027-01-10 stays DUE_SOON, 2027-01-11 flips)."
        test_recipe:
          setup: ["Unit U cycle 12; study validated 2026-01-15 → nominal == risk == effective 2027-01-10 (no incidents)"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-01-15" }, as: PsmManager, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /psm/_clock/set_current_utc", payload: { to_iso8601: "2026-11-10T00:00:00Z" }, as: PsmAdmin }
            - { call: "GET /psm/pha-studies/${s_id}", as: PsmManager, captures: { st1: $.data.status } }
            - { call: "POST /psm/_clock/set_current_utc", payload: { to_iso8601: "2026-11-11T00:00:00Z" }, as: PsmAdmin }
            - { call: "GET /psm/pha-studies/${s_id}", as: PsmManager, captures: { st2: $.data.status } }
            - { call: "POST /psm/_clock/set_current_utc", payload: { to_iso8601: "2027-01-10T00:00:00Z" }, as: PsmAdmin }
            - { call: "GET /psm/pha-studies/${s_id}", as: PsmManager, captures: { st3: $.data.status } }
            - { call: "POST /psm/_clock/set_current_utc", payload: { to_iso8601: "2027-01-11T00:00:00Z" }, as: PsmAdmin }
            - { call: "GET /psm/pha-studies/${s_id}", as: PsmManager, captures: { st4: $.data.status } }
          assert:
            - "statuses in order: 2026-11-10 → CURRENT, 2026-11-11 → DUE_SOON, 2027-01-10 → DUE_SOON (still not overdue), 2027-01-11 → OVERDUE"
            - "PhaStudy.${s_id}.effective_next_due == 2027-01-10T00:00:00Z throughout"

      - name: posture_restricted_band_lower_edge_exact_40
        claim_type: correct_result
        grounds: ['calculations.unit_process_safety_index', 'entities.PlantUnit.fields.psm_posture']
        distinguishing_aspect: "RESTRICTED band is inclusive at 40: index exactly 40 (2 overdue P1 = 30 + 1 open HIGH incident = 10) yields RESTRICTED; 30 yields NORMAL."
        test_recipe:
          setup: ["Unit U, REQ, INV; two P1 items due_in_days 1 created at default clock; clock 2026-05-03 makes them overdue"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Inv", employee_ref: "E-INV" }, as: PsmAdmin, captures: { inv_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a1", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a2", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: PsmAdmin }
          trigger:
            - { call: "GET /psm/units/${u_id}", as: PsmManager }
            - { call: "POST /psm/units/${u_id}/incident-investigations", payload: { title: "i", severity_class: "HIGH", occurred_at: "2026-04-20", investigator_id: "${inv_id}" }, as: PsmManager }
            - { call: "GET /psm/units/${u_id}", as: PsmManager }
          assert:
            - "before incident: process_safety_index == 30, psm_posture == NORMAL"
            - "after open HIGH incident: process_safety_index == 40, psm_posture == RESTRICTED (>= 40 inclusive)"

      - name: process_safety_index_capped_at_100
        claim_type: constants_applied
        grounds: ['calculations.unit_process_safety_index']
        distinguishing_aspect: "min(100, ·) cap: 7 overdue P1 items sum to 105 raw but the stored index is exactly 100 and posture FROZEN."
        test_recipe:
          setup: ["Unit U, REQ; seven P1 items due_in_days 1; clock 2026-05-03"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a1", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a2", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a3", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a4", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
