# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    field: status
    initial_state: DRAFT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /products/{productId}/activate"
        actor: CatalogAdmin
        preconditions: ["Product.status == DRAFT"]
        side_effects: []
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /products/{productId}/discontinue"
        actor: CatalogAdmin
        preconditions: ["Product.status == ACTIVE"]
        side_effects: []

  - entity: Product
    field: recall_status
    initial_state: CLEARED
    terminal_states: []
    transitions:
      - from: CLEARED
        to: RECALLED
        trigger: "system (Recall.status -> ISSUED for this product)"
        actor: system
        preconditions: ["Product.recall_status == CLEARED"]
        side_effects:
          - "CASCADE link2: every InventoryItem with product_id == Product.id has quarantined_qty += (available_qty + reserved_qty); available_qty and reserved_qty set to 0; InventoryItem.updated_at + version bumped"
          - "InventoryItem quarantine (link2) in turn triggers link3 (see OrderLine ACTIVE->VOIDED, system trigger)"
      - from: RECALLED
        to: CLEARED
        trigger: "system (Recall.status -> RESOLVED for this product)"
        actor: system
        preconditions: ["Product.recall_status == RECALLED"]
        side_effects:
          - "Each InventoryItem: on_hand_qty unchanged, quarantined_qty set to 0, available_qty recomputed = on_hand_qty - reserved_qty"

  - entity: Recall
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ISSUED
        trigger: "POST /recalls/{recallId}/issue"
        actor: CatalogAdmin
        preconditions: ["Recall.status == OPEN", "Product.status != DRAFT"]
        side_effects:
          - "CASCADE link1: sets referenced Product.recall_status -> RECALLED (which fires the Product recall_status transition and its downstream links)"
      - from: ISSUED
        to: RESOLVED
        trigger: "POST /recalls/{recallId}/issue with resolve=true (re-invoke) — see note"
        actor: CatalogAdmin
        preconditions: ["Recall.status == ISSUED"]
        side_effects:
          - "Sets referenced Product.recall_status -> CLEARED"
        note: "Resolution reuses the issue endpoint with resolve=true flag in payload."

  - entity: InventoryItem
    field: (implicit quarantine state via quarantined_qty)
    initial_state: STOCKED
    terminal_states: []
    transitions:
      - from: STOCKED
        to: STOCKED
        trigger: "POST /inventory/{inventoryItemId}/receive"
        actor: StoreAssociate
        preconditions: []
        side_effects: ["on_hand_qty += qty; available_qty recomputed"]

  - entity: OrderLine
    field: status
    initial_state: ACTIVE
    terminal_states: [VOIDED, RETURNED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "system (parent Order CANCELLED) OR system (InventoryItem quarantined by recall)"
        actor: system
        preconditions: ["OrderLine.status == ACTIVE"]
        side_effects:
          - "CASCADE (order-cancel chain, link2): releases this line's reserved units on its InventoryItem: reserved_qty -= qty, available_qty += qty (allocation is untouched — commit happens only at fulfill, which is not cancellable)"
          - "CASCADE (recall chain, link4): parent Order.subtotal/discount/total recomputed excluding VOIDED lines; if all of Order's ACTIVE lines are now VOIDED, Order.fulfillment_status -> CANCELLED"
      - from: ACTIVE
        to: RETURNED
        trigger: "system (Return APPROVED including this line)"
        actor: system
        preconditions: ["OrderLine.status == ACTIVE", "parent Order.fulfillment_status == FULFILLED"]
        side_effects: ["Product units restocked: InventoryItem.on_hand_qty += returned qty; Customer loyalty points reversed (see loyalty_points_earned compensation)"]

  - entity: Order
    field: fulfillment_status
    initial_state: OPEN
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /orders/{orderId}/submit"
        actor: "Customer or StoreAssociate"
        preconditions: ["Order.fulfillment_status == OPEN", "Order has >= 1 ACTIVE line"]
        side_effects: ["Provisional pricing computed (pricing_variant stays PROVISIONAL)"]
      - from: SUBMITTED
        to: READY
        trigger: "POST /orders/{orderId}/mark-ready"
        actor: StoreAssociate
        preconditions:
          - "Order.fulfillment_status == SUBMITTED"
          - "CROSS-ENTITY: every ACTIVE line's Product.recall_status == CLEARED"
        side_effects: ["Final pricing locked (pricing_variant -> FINAL, re-reads current Customer.loyalty_tier)"]
      - from: READY
        to: FULFILLED
        trigger: "POST /orders/{orderId}/fulfill"
        actor: StoreAssociate
        preconditions: ["Order.fulfillment_status == READY", "Order.payment_status == PAID"]
        side_effects:
          - "InventoryItem.on_hand_qty -= qty, reserved_qty -= qty for each ACTIVE line; if an ACTIVE Allocation exists for that line's product+store, committed_qty += qty and available_alloc_qty -= qty (Allocation -> EXHAUSTED when it hits 0)"
          - "loyalty_points_earned (FINAL variant) credited to Customer.lifetime_points"
          - "RegistryItem.purchased_qty incremented if a line's product matches an open registry item for the customer"
      - from: [OPEN, SUBMITTED, READY]
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel"
        actor: "Customer or StoreAssociate"
        preconditions: ["Order.fulfillment_status in {OPEN, SUBMITTED, READY}"]
        side_effects:
          - "CASCADE link1 (order-cancel chain): every ACTIVE OrderLine -> VOIDED (which fires link2 inventory release and link3 allocation restore)"

  - entity: Order
    field: payment_status
    initial_state: UNPAID
    terminal_states: [PAID]
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /orders/{orderId}/pay (amount < total_cents)"
        actor: "Customer or StoreAssociate"
        preconditions: ["Order.fulfillment_status != CANCELLED"]
        side_effects: ["amount_paid_cents += amount"]
      - from: [UNPAID, PARTIALLY_PAID]
        to: PAID
        trigger: "POST /orders/{orderId}/pay (cumulative amount_paid_cents >= total_cents)"
        actor: "Customer or StoreAssociate"
        preconditions: ["Order.fulfillment_status != CANCELLED"]
        side_effects: ["amount_paid_cents += amount"]

  - entity: SpecialOrder
    field: status
    initial_state: DRAFT
    terminal_states: [CONVERTED, CANCELLED]
    transitions:
      - from: [DRAFT, QUOTED, CUSTOMER_REVIEW]
        to: QUOTED
        trigger: "POST /special-orders/{specialOrderId}/quotes"
        actor: StoreManager
        preconditions: ["SpecialOrder.status in {DRAFT, QUOTED, CUSTOMER_REVIEW}", "expected_special_order_version == SpecialOrder.version (OCC)"]
        side_effects: ["quoted_unit_price_cents, deposit_cents set; quote_revision += 1; version += 1"]
        note: "Re-quote from QUOTED is a self-cycle (non-linear); supersedes prior quote under OCC."
      - from: QUOTED
        to: CUSTOMER_REVIEW
        trigger: "system (customer opens quote) — implicit on GET; modelled as auto-transition on first read after QUOTED"
        actor: system
        preconditions: ["SpecialOrder.status == QUOTED"]
        side_effects: []
      - from: [QUOTED, CUSTOMER_REVIEW]
        to: APPROVED
        trigger: "POST /special-orders/{specialOrderId}/approve"
        actor: Customer
        preconditions: ["SpecialOrder.status in {QUOTED, CUSTOMER_REVIEW}"]
        side_effects: []
      - from: APPROVED
        to: CONVERTED
        trigger: "POST /special-orders/{specialOrderId}/convert"
        actor: StoreAssociate
        preconditions:
          - "SpecialOrder.status == APPROVED"
          - "CROSS-ENTITY: an ACTIVE Allocation for product_id+store exists with available_alloc_qty >= requested_qty"
        side_effects: ["Creates an Order with one line; sets converted_order_id; Allocation.committed_qty += requested_qty"]
      - from: [DRAFT, QUOTED, CUSTOMER_REVIEW, APPROVED]
        to: CANCELLED
        trigger: "system (never re-quoted after cancel) — via convert failure or explicit; terminal"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Layaway
    field: status
    initial_state: ACTIVE
    terminal_states: [PAID_IN_FULL, CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAID_IN_FULL
        trigger: "POST /layaways/{layawayId}/payments (cumulative paid_cents >= total_cents)"
        actor: "Customer or StoreAssociate"
        preconditions: ["Layaway.status == ACTIVE"]
        side_effects: ["paid_cents += amount; remaining_cents recomputed to 0"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /layaways/{layawayId}/cancel"
        actor: StoreAssociate
        preconditions: ["Layaway.status == ACTIVE"]
        side_effects: []

  - entity: DemoEvent
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /events/{eventId}/register"
        actor: Customer
        preconditions: ["DemoEvent.status == SCHEDULED", "registered_count < capacity", "customer_id not already registered"]
        side_effects: ["registered_customer_ids append customer_id; registered_count += 1"]

  - entity: GiftRegistry
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /registries/{registryId}/close"
        actor: Customer
        preconditions: ["GiftRegistry.status == ACTIVE"]
        side_effects: []

  - entity: Allocation
    field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (available_alloc_qty reaches 0 after commit)"
        actor: system
        preconditions: ["Allocation.available_alloc_qty == 0"]
        side_effects: []
      - from: [ACTIVE, EXHAUSTED]
        to: RELEASED
        trigger: "POST /allocations/{allocationId}/release"
        actor: StoreManager
        preconditions: ["Allocation.status in {ACTIVE, EXHAUSTED}"]
        side_effects: ["released_qty = available_alloc_qty; available_alloc_qty -> 0"]

  - entity: Return
    field: status
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /returns/{returnId}/approve with decision=APPROVE"
        actor: StoreManager
        preconditions:
          - "Return.status == REQUESTED"
          - "parent Order.fulfillment_status == FULFILLED"
          - "BUSINESS_TEMPORAL: current clock <= Order fulfilled_at + 30 days (inclusive)"
        side_effects:
          - "gross_refund_cents, restocking_fee_cents, net_refund_cents computed"
          - "each referenced OrderLine ACTIVE -> RETURNED; InventoryItem.on_hand_qty += returned qty"
          - "loyalty_points_earned reversed proportionally: Customer.points_redeemed += points originally earned on returned units"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /returns/{returnId}/approve with decision=REJECT"
        actor: StoreManager
        preconditions: ["Return.status == REQUESTED"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: special-order-requote-stale-version
    parent_entity: SpecialOrder
    write_endpoint: "POST /special-orders/{specialOrderId}/quotes"
    occ_field: "expected_special_order_version"
    description: |
      Issuing a new quote against a SpecialOrder whose version has advanced since
      the manager last observed it is rejected. A new quote legitimately supersedes
      the prior quote (quote_revision increments, quoted_unit_price_cents replaced),
      so a manager working from a stale view of the SpecialOrder would silently
      overwrite a newer quote; the stale-version check rejects it instead.
    error_id: ERR_STALE_SPECIAL_ORDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_pricing
    trigger: "POST /orders/{id}/submit (PROVISIONAL); POST /orders/{id}/mark-ready (FINAL); recompute on line void/return"
    algorithm: aggregation
    formula: |
      For each ACTIVE OrderLine (VOIDED/RETURNED excluded):
        extended_cents = unit_price_cents * qty
        tier_pct = tier_discount_pct(customer.loyalty_tier)   # BRONZE 0.00, SILVER 0.05, GOLD 0.10
        if product.is_exclusive: line_discount_cents = 0
        else:                    line_discount_cents = floor(extended_cents * tier_pct)   # ROUND-PER-LINE
      subtotal_cents = sum(extended_cents over ACTIVE lines)
      discount_cents = sum(line_discount_cents over ACTIVE lines)   # sum AFTER per-line floor (pinned order)
      total_cents    = subtotal_cents - discount_cents
    input_set: "OrderLine.status == ACTIVE only"
    constants:
      BRONZE_PCT: 0.00
      SILVER_PCT: 0.05
      GOLD_PCT: 0.10
    precision: "integer cents, floor per line, then sum"
    variants:
      - name: PROVISIONAL
        when: "computed at submit; unit_price_cents already snapshotted at line-add; uses tier at submit time"
        difference: "Reflects tier/lines as of submit; recomputed if lines change before READY"
      - name: FINAL
        when: "locked at mark-ready; re-reads Customer.loyalty_tier as of mark-ready"
        difference: "If the customer's tier changed between submit and mark-ready, FINAL discount differs from PROVISIONAL"

  - name: loyalty_points_earned
    trigger: "POST /orders/{id}/fulfill (FINAL earn); Return APPROVED (compensating reversal)"
    algorithm: threshold
    formula: |
      base_points = floor(order.total_cents / 100)
      multiplier  = tier_multiplier(customer.loyalty_tier)   # BRONZE 1.0, SILVER 1.5, GOLD 2.0
      points_earned = floor(base_points * multiplier)
      On fulfill: customer.lifetime_points += points_earned
      Compensating reversal on full/partial return:
        reversed = floor( (returned_gross_cents / 100) * multiplier_at_earn )
        customer.points_redeemed += reversed
    input_set: "order.total_cents at FINAL variant; returned units at return-approval"
    constants:
      BRONZE_MULT: 1.0
      SILVER_MULT: 1.5
      GOLD_MULT: 2.0
      POINTS_PER_DOLLAR_BASE: 1
    precision: "integer points, floor"
    variants:
      - name: PROVISIONAL_ESTIMATE
        when: "read at submit as a projected accrual on projected total"
        difference: "Not persisted to lifetime_points; informational only"
      - name: FINAL_EARN
        when: "persisted at fulfill on FINAL order.total_cents"
        difference: "Persisted; excludes any lines voided before fulfill"

  - name: layaway_installment_schedule
    trigger: "POST /layaways (creation)"
    algorithm: waterfall_allocation
    formula: |
      base = floor(total_cents / installment_count)
      schedule = [base] * installment_count            # ROUND-PER-INSTALLMENT (floor)
      remainder = total_cents - base * installment_count
      schedule[installment_count - 1] += remainder      # remainder pinned to FINAL installment
    input_set: "single Layaway total_cents, installment_count"
    precision: "integer cents; floor per installment; remainder on last installment"

  - name: return_refund
    trigger: "POST /returns/{id}/approve (decision=APPROVE)"
    algorithm: tiered_pricing
    formula: |
      # Pinned evaluation order (circular-looking: fee tier keyed on the gross it reduces)
      1) gross_refund_cents = sum over returned lines of (effective paid per unit * returned qty)
         effective paid per unit = round_down(line effective total after discount / line qty) * returned qty
         (line effective total = extended_cents - line_discount_cents)
      2) tier = restock_tier(gross_refund_cents)   # <5000 -> 0.00, 5000..19999 -> 0.10, >=20000 -> 0.15
      3) restocking_fee_cents = floor(gross_refund_cents * tier)
      4) net_refund_cents = gross_refund_cents - restocking_fee_cents
    input_set: "returned OrderLine units on a FULFILLED order"
    constants:
      TIER1_MAX: 5000
      TIER2_MAX: 20000
      TIER1_PCT: 0.00
      TIER2_PCT: 0.10
      TIER3_PCT: 0.15
    precision: "integer cents, floor; gross computed BEFORE fee tier lookup"

  - name: inventory_availability
    trigger: "any reserve, release, receive, quarantine mutation on InventoryItem"
    algorithm: aggregation
    formula: |
      available_qty = on_hand_qty - reserved_qty - quarantined_qty
      INVARIANT: on_hand_qty == available_qty + reserved_qty + quarantined_qty (always)
      available_qty >= 0 always
    input_set: "single InventoryItem"
    precision: "integer units"

  - name: loyalty_balance
    trigger: "any lifetime_points or points_redeemed mutation"
    algorithm: aggregation
    formula: |
      points_balance = lifetime_points - points_redeemed
      loyalty_tier = GOLD if lifetime_points >= 5000
                     else SILVER if lifetime_points >= 1000
                     else BRONZE
      INVARIANT over a fulfill+full-return pair: points_balance returns to pre-fulfill value
    input_set: "single Customer"
    constants:
      SILVER_MIN: 1000
      GOLD_MIN: 5000
    precision: "integer points"

  - name: allocation_availability
    trigger: "allocation create, order fulfill (commit), order cancel (restore), release"
    algorithm: aggregation
    formula: |
      available_alloc_qty = allocated_qty - committed_qty
      INVARIANT: allocated_qty == committed_qty + available_alloc_qty + (RELEASED ? released_qty : 0)
    input_set: "single Allocation"
    precision: "integer units"

  - name: age_grade_gate
    trigger: "POST /orders/{id}/lines"
    algorithm: threshold
    formula: |
      pass if OrderLine.recipient_age_months >= product.age_grade_min_months   # inclusive boundary (>=)
      else reject ERR_AGE_GRADE_VIOLATION
    input_set: "single OrderLine vs its Product"
    precision: "integer months; boundary at exactly age_grade_min_months passes"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix; entity_backed Customer acting on own resource (customer_id == X-User-ID)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource ids exist (validated left-to-right); unknown FK -> 404"
    error_id: "ERR_PRODUCT_NOT_FOUND / ERR_STORE_NOT_FOUND / ERR_ORDER_NOT_FOUND / ERR_CUSTOMER_NOT_FOUND / ERR_ALLOCATION_NOT_FOUND / ERR_SPECIAL_ORDER_NOT_FOUND / ERR_LAYAWAY_NOT_FOUND / ERR_EVENT_NOT_FOUND / ERR_REGISTRY_NOT_FOUND / ERR_RECALL_NOT_FOUND / ERR_RETURN_NOT_FOUND / ERR_INVENTORY_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path/body ids

  - priority: 4
    category: state
    check: "Target resource in a valid state for the requested transition (state-machine from: check)"
    error_id: "ERR_INVALID_STATE / ERR_ORDER_NOT_OPEN / ERR_LAYAWAY_NOT_ACTIVE / ERR_SPECIAL_ORDER_NOT_APPROVED / ERR_ALREADY_TERMINAL"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 5
    category: business_safety
    check: "Age-grade gate: OrderLine.recipient_age_months >= Product.age_grade_min_months"
    error_id: ERR_AGE_GRADE_VIOLATION
    http_status: 422
    applies_to: "POST /orders/{orderId}/lines"

  - priority: 6
    category: business_safety
    check: "Product not under active recall (recall_status == CLEARED) when adding to order or marking ready"
    error_id: ERR_PRODUCT_RECALLED
    http_status: 409
    applies_to: "POST /orders/{orderId}/lines, POST /orders/{orderId}/mark-ready"

  - priority: 7
    category: business_temporal
    check: "Demo event interval, incl. store buffer, must not overlap an existing SCHEDULED event at the same store (closed interval + buffer); allocation seasonal window half-open [start,end) must not overlap another allocation for same product+store; return within 30-day window"
    error_id: "ERR_EVENT_OVERLAP / ERR_ALLOCATION_WINDOW_OVERLAP / ERR_RETURN_WINDOW_EXPIRED"
    http_status: 409
    applies_to: "POST /events, POST /allocations, POST /returns/{returnId}/approve"

  - priority: 8
    category: business_referential
    check: "Cross-entity link resolvable: convert requires an ACTIVE Allocation for product+store; registry item requires ACTIVE registry"
    error_id: "ERR_NO_ALLOCATION / ERR_REGISTRY_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /special-orders/{specialOrderId}/convert, POST /registries/{registryId}/items"

  - priority: 9
    category: business_constraint
    check: "Sufficient inventory/allocation: line reserve requires InventoryItem.available_qty >= qty; convert requires Allocation.available_alloc_qty >= requested_qty; event registered_count < capacity"
    error_id: "ERR_INSUFFICIENT_INVENTORY / ERR_INSUFFICIENT_ALLOCATION / ERR_EVENT_FULL"
    http_status: 409
    applies_to: "POST /orders/{orderId}/lines, POST /special-orders/{specialOrderId}/convert, POST /events/{eventId}/register"

  - priority: 10
    category: business_fiscal
    check: "Payment/deposit constraints: order pay cannot exceed remaining balance; layaway payment cannot exceed remaining_cents (overpayment)"
    error_id: "ERR_OVERPAYMENT / ERR_LAYAWAY_OVERPAYMENT"
    http_status: 409
    applies_to: "POST /orders/{orderId}/pay, POST /layaways/{layawayId}/payments"

  - priority: 11
    category: business_constraint
    check: "OCC: expected_special_order_version must match current SpecialOrder.version"
    error_id: ERR_STALE_SPECIAL_ORDER_VERSION
    http_status: 412
    applies_to: "POST /special-orders/{specialOrderId}/quotes"

  - priority: 12
    category: business_constraint
    check: "Uniqueness: Product.sku unique, Customer.email unique"
    error_id: "ERR_DUPLICATE_SKU / ERR_DUPLICATE_EMAIL"
    http_status: 409
    applies_to: "POST /products, POST /customers"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Products ---
  - { method: POST, path: "/products", description: "Create product (DRAFT)", roles: [CatalogAdmin], code: 201, input: [sku, name, category, age_grade_min_months, safety_labels, msrp_cents, "is_exclusive?"], output: Product, side_effects: ["status=DRAFT, recall_status=CLEARED"] }
  - { method: GET, path: "/products", description: "List products", roles: [Any], code: 200, input: ["category?", "sku?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/products/{productId}", description: "Get product", roles: [Any], code: 200, input: [], output: Product, side_effects: [] }
  - { method: PATCH, path: "/products/{productId}", description: "Update product fields", roles: [CatalogAdmin], code: 200, input: ["name?", "age_grade_min_months?", "safety_labels?", "msrp_cents?", "is_exclusive?"], output: Product, side_effects: ["version += 1"] }
  - { method: POST, path: "/products/{productId}/activate", description: "Activate product", roles: [CatalogAdmin], code: 200, input: [], output: Product, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/products/{productId}/discontinue", description: "Discontinue product", roles: [CatalogAdmin], code: 200, input: [], output: Product, side_effects: ["status -> DISCONTINUED"] }

  # --- Stores ---
  - { method: POST, path: "/stores", description: "Create store", roles: [CatalogAdmin], code: 201, input: [name, state_code, "event_buffer_minutes?"], output: Store, side_effects: [] }
  - { method: GET, path: "/stores", description: "List stores", roles: [Any], code: 200, input: [], output: "Store[]", side_effects: [] }
  - { method: GET, path: "/stores/{storeId}", description: "Get store", roles: [Any], code: 200, input: [], output: Store, side_effects: [] }

  # --- Inventory ---
  - { method: POST, path: "/inventory", description: "Create inventory item for product+store", roles: [StoreAssociate], code: 201, input: [product_id, store_id, on_hand_qty], output: InventoryItem, side_effects: ["reserved_qty=0, quarantined_qty=0, available_qty=on_hand_qty"] }
  - { method: GET, path: "/inventory", description: "List/filter inventory (reverse-reachability for product_id and store_id)", roles: [Any], code: 200, input: ["product_id?", "store_id?"], output: "InventoryItem[]", side_effects: [] }
  - { method: GET, path: "/inventory/{inventoryItemId}", description: "Get inventory item", roles: [Any], code: 200, input: [], output: InventoryItem, side_effects: [] }
  - { method: POST, path: "/inventory/{inventoryItemId}/receive", description: "Receive stock", roles: [StoreAssociate], code: 200, input: [qty], output: InventoryItem, side_effects: ["on_hand_qty += qty; available_qty recomputed"] }

  # --- Allocations ---
  - { method: POST, path: "/allocations", description: "Create seasonal/exclusive allocation", roles: [StoreManager], code: 201, input: [product_id, store_id, allocated_qty, season_start, season_end], output: Allocation, side_effects: ["status=ACTIVE; rejects window overlap with existing allocation for same product+store"] }
  - { method: GET, path: "/allocations", description: "List/filter allocations (reverse-reachability for product_id and store_id)", roles: [Any], code: 200, input: ["product_id?", "store_id?"], output: "Allocation[]", side_effects: [] }
  - { method: GET, path: "/allocations/{allocationId}", description: "Get allocation", roles: [Any], code: 200, input: [], output: Allocation, side_effects: [] }
  - { method: POST, path: "/allocations/{allocationId}/release", description: "Release remaining allocation", roles: [StoreManager], code: 200, input: [], output: Allocation, side_effects: ["status -> RELEASED; released_qty = available_alloc_qty"] }

  # --- Customers ---
  - { method: POST, path: "/customers", description: "Create loyalty customer", roles: [StoreAssociate], code: 201, input: [name, email], output: Customer, side_effects: ["lifetime_points=0, points_redeemed=0, loyalty_tier=BRONZE"] }
  - { method: GET, path: "/customers/{customerId}", description: "Get customer", roles: [Any], code: 200, input: [], output: Customer, side_effects: [] }

  # --- Orders ---
  - { method: POST, path: "/orders", description: "Create order (OPEN/UNPAID)", roles: [Customer, StoreAssociate], code: 201, input: [customer_id, store_id, fulfillment_type], output: Order, side_effects: ["fulfillment_status=OPEN, payment_status=UNPAID, pricing_variant=PROVISIONAL"] }
  - { method: GET, path: "/orders", description: "List/filter orders (reverse-reachability for customer_id and store_id)", roles: [Any], code: 200, input: ["customer_id?", "store_id?"], output: "Order[]", side_effects: [] }
  - { method: GET, path: "/orders/{orderId}", description: "Get order", roles: [Any], code: 200, input: [], output: Order, side_effects: [] }
  - { method: POST, path: "/orders/{orderId}/lines", description: "Add order line (reserves inventory, age-grade + recall gate)", roles: [Customer, StoreAssociate], code: 201, input: [product_id, qty, recipient_age_months], output: OrderLine, side_effects: ["unit_price_cents snapshotted from Product.msrp_cents; InventoryItem.reserved_qty += qty; available_qty -= qty"] }
  - { method: GET, path: "/order-lines", description: "List/filter order lines (reverse-reachability for order_id and product_id)", roles: [Any], code: 200, input: ["order_id?", "product_id?"], output: "OrderLine[]", side_effects: [] }
  - { method: GET, path: "/order-lines/{orderLineId}", description: "Get order line", roles: [Any], code: 200, input: [], output: OrderLine, side_effects: [] }
  - { method: POST, path: "/orders/{orderId}/submit", description: "Submit order (provisional pricing)", roles: [Customer, StoreAssociate], code: 200, input: [], output: Order, side_effects: ["fulfillment_status -> SUBMITTED; order_pricing PROVISIONAL"] }
  - { method: POST, path: "/orders/{orderId}/pay", description: "Apply payment", roles: [Customer, StoreAssociate], code: 200, input: [amount_cents], output: Order, side_effects: ["amount_paid_cents += amount; payment_status advances"] }
  - { method: POST, path: "/orders/{orderId}/mark-ready", description: "Mark ready (final pricing lock, recall gate)", roles: [StoreAssociate], code: 200, input: [], output: Order, side_effects: ["fulfillment_status -> READY; pricing_variant -> FINAL; order_pricing FINAL"] }
  - { method: POST, path: "/orders/{orderId}/fulfill", description: "Fulfill (BOPIS pickup / ship)", roles: [StoreAssociate], code: 200, input: [], output: Order, side_effects: ["fulfillment_status -> FULFILLED; commits allocation; decrements inventory; credits loyalty points; bumps registry purchased_qty"] }
  - { method: POST, path: "/orders/{orderId}/cancel", description: "Cancel order (cascade release)", roles: [Customer, StoreAssociate], code: 200, input: [], output: Order, side_effects: ["fulfillment_status -> CANCELLED; cascade voids lines -> releases inventory -> restores allocation"] }

  # --- Layaway ---
  - { method: POST, path: "/layaways", description: "Create layaway plan", roles: [StoreAssociate], code: 201, input: [customer_id, total_cents, installment_count, "order_id?"], output: Layaway, side_effects: ["status=ACTIVE; installment_schedule_cents computed"] }
  - { method: GET, path: "/layaways", description: "List/filter layaways (reverse-reachability for customer_id and order_id)", roles: [Any], code: 200, input: ["customer_id?", "order_id?"], output: "Layaway[]", side_effects: [] }
  - { method: GET, path: "/layaways/{layawayId}", description: "Get layaway", roles: [Any], code: 200, input: [], output: Layaway, side_effects: [] }
  - { method: POST, path: "/layaways/{layawayId}/payments", description: "Apply layaway installment payment", roles: [Customer, StoreAssociate], code: 200, input: [amount_cents], output: Layaway, side_effects: ["paid_cents += amount; status -> PAID_IN_FULL when fully paid"] }
  - { method: POST, path: "/layaways/{layawayId}/cancel", description: "Cancel layaway", roles: [StoreAssociate], code: 200, input: [], output: Layaway, side_effects: ["status -> CANCELLED"] }

  # --- Special Orders ---
  - { method: POST, path: "/special-orders", description: "Create special order request", roles: [StoreAssociate], code: 201, input: [customer_id, product_id, requested_qty], output: SpecialOrder, side_effects: ["status=DRAFT, quote_revision=0"] }
  - { method: GET, path: "/special-orders", description: "List/filter special orders (reverse-reachability for customer_id, product_id, converted_order_id)", roles: [Any], code: 200, input: ["customer_id?", "product_id?", "converted_order_id?"], output: "SpecialOrder[]", side_effects: [] }
  - { method: GET, path: "/special-orders/{specialOrderId}", description: "Get special order", roles: [Any], code: 200, input: [], output: SpecialOrder, side_effects: [] }
  - { method: POST, path: "/special-orders/{specialOrderId}/quotes", description: "Issue/re-issue quote (OCC on version)", roles: [StoreManager], code: 200, input: [unit_price_cents, deposit_cents, expected_special_order_version], output: SpecialOrder, side_effects: ["status -> QUOTED; quote_revision += 1; version += 1"] }
  - { method: POST, path: "/special-orders/{specialOrderId}/approve", description: "Customer approves quote", roles: [Customer], code: 200, input: [], output: SpecialOrder, side_effects: ["status -> APPROVED"] }
  - { method: POST, path: "/special-orders/{specialOrderId}/convert", description: "Convert approved special order to an Order (requires allocation)", roles: [StoreAssociate], code: 200, input: [], output: Order, side_effects: ["status -> CONVERTED; creates Order+line; Allocation.committed_qty += requested_qty"] }

  # --- Recalls ---
  - { method: POST, path: "/recalls", description: "Open a recall for a product", roles: [CatalogAdmin], code: 201, input: [product_id, severity, reason], output: Recall, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/recalls", description: "List/filter recalls (reverse-reachability for product_id)", roles: [Any], code: 200, input: ["product_id?"], output: "Recall[]", side_effects: [] }
  - { method: GET, path: "/recalls/{recallId}", description: "Get recall", roles: [Any], code: 200, input: [], output: Recall, side_effects: [] }
  - { method: POST, path: "/recalls/{recallId}/issue", description: "Issue recall (cascade) or resolve (resolve=true)", roles: [CatalogAdmin], code: 200, input: ["resolve?"], output: Recall, side_effects: ["status -> ISSUED and Product.recall_status -> RECALLED (cascade quarantine + void lines); resolve=true -> RESOLVED + CLEARED"] }

  # --- Demo Events ---
  - { method: POST, path: "/events", description: "Schedule demo event (rejects store-time overlap w/ buffer)", roles: [StoreAssociate], code: 201, input: [store_id, product_id, start_at, end_at, capacity], output: DemoEvent, side_effects: ["status=SCHEDULED, registered_count=0"] }
  - { method: GET, path: "/events", description: "List/filter events (reverse-reachability for store_id and product_id)", roles: [Any], code: 200, input: ["store_id?", "product_id?"], output: "DemoEvent[]", side_effects: [] }
  - { method: GET, path: "/events/{eventId}", description: "Get event", roles: [Any], code: 200, input: [], output: DemoEvent, side_effects: [] }
  - { method: POST, path: "/events/{eventId}/register", description: "Register customer for event", roles: [Customer], code: 200, input: [customer_id], output: DemoEvent, side_effects: ["registered_customer_ids append; registered_count += 1"] }

  # --- Gift Registry / Wishlist ---
  - { method: POST, path: "/registries", description: "Create gift registry / wishlist", roles: [Customer], code: 201, input: [customer_id, registry_type], output: GiftRegistry, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/registries", description: "List/filter registries (reverse-reachability for customer_id)", roles: [Any], code: 200, input: ["customer_id?"], output: "GiftRegistry[]", side_effects: [] }
  - { method: GET, path: "/registries/{registryId}", description: "Get registry", roles: [Any], code: 200, input: [], output: GiftRegistry, side_effects: [] }
  - { method: POST, path: "/registries/{registryId}/items", description: "Add registry item (requires ACTIVE registry)", roles: [Customer], code: 201, input: [product_id, desired_qty], output: RegistryItem, side_effects: ["purchased_qty=0"] }
  - { method: GET, path: "/registries/{registryId}/items", description: "List registry items (reverse-reachability for registry_id)", roles: [Any], code: 200, input: [], output: "RegistryItem[]", side_effects: [] }
  - { method: GET, path: "/registry-items", description: "List/filter registry items (reverse-reachability for registry_id and product_id)", roles: [Any], code: 200, input: ["registry_id?", "product_id?"], output: "RegistryItem[]", side_effects: [] }
  - { method: GET, path: "/registry-items/{registryItemId}", description: "Get registry item", roles: [Any], code: 200, input: [], output: RegistryItem, side_effects: [] }
  - { method: POST, path: "/registries/{registryId}/close", description: "Close registry", roles: [Customer], code: 200, input: [], output: GiftRegistry, side_effects: ["status -> CLOSED"] }

  # --- Returns ---
  - { method: POST, path: "/returns", description: "Request return on a fulfilled order", roles: [StoreAssociate], code: 201, input: [order_id, lines], output: Return, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/returns", description: "List/filter returns (reverse-reachability for order_id)", roles: [Any], code: 200, input: ["order_id?"], output: "Return[]", side_effects: [] }
  - { method: GET, path: "/returns/{returnId}", description: "Get return", roles: [Any], code: 200, input: [], output: Return, side_effects: [] }
  - { method: POST, path: "/returns/{returnId}/approve", description: "Approve/reject return (refund calc, window check, points reversal)", roles: [StoreManager], code: 200, input: [decision], output: Return, side_effects: ["APPROVE: refund computed, lines RETURNED, inventory restocked, loyalty reversed; REJECT: status -> REJECTED"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set logical clock. Server startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default (never wall-clock).", roles: [CatalogAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock set to to_iso8601"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "Missing/invalid X-User-ID or X-User-Role" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body / missing required field / bad type" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted, or Customer acting on a resource it does not own" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "Store id does not exist" }
  - { id: ERR_INVENTORY_NOT_FOUND, http: 404, condition: "InventoryItem id does not exist" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "Allocation id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id does not exist" }
  - { id: ERR_LAYAWAY_NOT_FOUND, http: 404, condition: "Layaway id does not exist" }
  - { id: ERR_SPECIAL_ORDER_NOT_FOUND, http: 404, condition: "SpecialOrder id does not exist" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "Recall id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "DemoEvent id does not exist" }
  - { id: ERR_REGISTRY_NOT_FOUND, http: 404, condition: "GiftRegistry id does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "Return id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid state for requested transition" }
  - { id: ERR_ORDER_NOT_OPEN, http: 409, condition: "Order not in OPEN for add-line/submit" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource already in a terminal state" }
  - { id: ERR_LAYAWAY_NOT_ACTIVE, http: 409, condition: "Layaway not ACTIVE for payment" }
  - { id: ERR_SPECIAL_ORDER_NOT_APPROVED, http: 409, condition: "Special order not APPROVED for convert" }
