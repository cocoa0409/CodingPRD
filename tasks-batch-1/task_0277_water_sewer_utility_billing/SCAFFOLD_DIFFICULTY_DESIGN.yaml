          - validations[priority=13]
          - errors[ERR_BILL_NOT_POSTED]
        distinguishing_aspect: |
          LeakAdjustment PENDING->APPROVED is gated by the referenced Bill being POSTED; approving a
          leak adjustment whose Bill is still DRAFT returns ERR_BILL_NOT_POSTED. Cross-entity pair:
          LeakAdjustment -> Bill.
