          assert:
            - "the 49-holiday response returns holidays_per_tank == 0.4900 and result == PASS"
            - "the 50-holiday response returns holidays_per_tank == 0.5000 and result == PASS (the threshold is inclusive)"
            - "the 51-holiday response returns holidays_per_tank == 0.5100 and result == FAIL"
            - "TankLot.${tl_id}.status == LINED after the first two calls and LINING_REJECTED after the third"
            - "after the third call TankLot.${tl_id}.wip_quantity == 115, scrapped_quantity == 5 and rework_count == 1"
            - "only the third LiningInspection row has record_status == CURRENT; the first two are SUPERSEDED"
      - name: uef_margin_exactly_zero_passes
        grounds:
          - calculations.uef_compliance_margin
          - entities.EfficiencyTest.fields.margin
          - state_machines.EfficiencyTest.SCHEDULED_to_PASSED
          - state_machines.EfficiencyTest.SCHEDULED_to_FAILED
          - endpoints[POST /mfg/efficiency-tests/{id}/record-result]
        distinguishing_aspect: >
          A different metric on a different endpoint from the holiday instance: the signed margin at exactly
          0.0000 on POST /mfg/efficiency-tests/{id}/record-result, where the boundary decides the TERMINAL STATE
          rather than a verdict field. The HEAT_PUMP model's effective_minimum is 2.8800, and the three
          measurements straddle it by one unit in the 4th decimal place (2.8799 / 2.8800 / 2.8801), so an
          implementation that rounds the margin to 2 dp, or that treats `margin > 0` as the pass condition,
          mislabels at least one row.
        test_recipe:
          setup:
            - "Model HP65-B is HEAT_PUMP, 65 gallons, insulation_r_value 25, so its UEF effective_minimum at sample_size 2 is 2.8800."
            - "Three SCHEDULED UEF tests exist for it in non-overlapping windows that respect the cell's 12-hour cooldown."
            - "The logical clock is 2026-08-05T06:00:00Z, past every window_end."
            - "The model is UNCERTIFIED before the first result is recorded."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "HP65-B", fuel_type: "HEAT_PUMP", nominal_capacity_gallons: 65, channel: "BUILDER", insulation_r_value: 25, is_private_label: false }
              as: ComplianceEngineer
              captures: { m2_id: $.data.id }

            - call: "POST /mfg/test-cells"
              payload: { cell_code: "CELL-1", parallel_slots: 2, cooldown_hours: 12 }
              as: PlantAdmin
              captures: { cell1_id: $.data.id }

            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m2_id}", test_cell_id: "${cell1_id}", test_type: "UEF", sample_size: 2, window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z" }
              as: ComplianceEngineer
              captures: { hb1_id: $.data.id }
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m2_id}", test_cell_id: "${cell1_id}", test_type: "UEF", sample_size: 2, window_start: "2026-08-02T22:00:00Z", window_end: "2026-08-03T02:00:00Z" }
              as: ComplianceEngineer
              captures: { hb2_id: $.data.id }
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m2_id}", test_cell_id: "${cell1_id}", test_type: "UEF", sample_size: 2, window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T18:00:00Z" }
              as: ComplianceEngineer
              captures: { hb3_id: $.data.id }

            - call: "POST /mfg/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T06:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /mfg/efficiency-tests/${hb1_id}/record-result"
              payload: { measured_value: 2.8799 }
              as: QualityInspector
            - call: "POST /mfg/efficiency-tests/${hb2_id}/record-result"
              payload: { measured_value: 2.8800 }
              as: QualityInspector
            - call: "POST /mfg/efficiency-tests/${hb3_id}/record-result"
              payload: { measured_value: 2.8801 }
              as: QualityInspector
          assert:
            - "EfficiencyTest.${hb1_id}.effective_minimum == 2.8800, margin == -0.0001 and status == FAILED"
            - "EfficiencyTest.${hb2_id}.effective_minimum == 2.8800, margin == 0.0000 and status == PASSED (a zero margin passes)"
            - "EfficiencyTest.${hb3_id}.effective_minimum == 2.8800, margin == 0.0001 and status == PASSED"
            - "ProductModel.${m2_id}.certification_status == TEST_PENDING (set by the first recorded result and not re-entered by the later two)"
            - "a certification submit for HP65-B would still fail: only 2 of the 3 UEF tests PASSED and MIN_UEF_SAMPLE_TESTS is 3"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: component_lot_release_requires_supplier_qualified
        grounds:
          - state_machines.ComponentLot.QUARANTINED_to_RELEASED
          - state_machines.Supplier.PENDING_to_QUALIFIED
          - validations[priority 11].ERR_COMPONENT_SUPPLIER_NOT_QUALIFIED
          - calculations.supplier_qualification_score
          - endpoints[POST /mfg/component-lots/{id}/release]
        distinguishing_aspect: >
          Entity pair (ComponentLot, Supplier): the lot's own row is already fully valid - QUARANTINED with
          certificate_of_conformance true - so the ONLY reason the release fails is the state of a different
          entity reached through supplier_id. Nothing about the lot changes between the rejected call and the
          accepted one; the only mutation is on the Supplier. The intervening qualify call also pins the
          weighted score at 91.40, so the guard cannot be satisfied by merely touching the supplier row.
        test_recipe:
          setup:
            - "Supplier Meridian Controls exists in its initial state PENDING with qualification_score null."
            - "Component lot GV-880 is QUARANTINED with certificate_of_conformance true and quantity 50."
            - "The logical clock is at its default 2026-08-01T00:00:00Z, well before any qualified_until."
            - "No other supplier or lot exists."
          setup_api_calls:
            - call: "POST /mfg/suppliers"
              payload: { name: "Meridian Controls", component_category: "GAS_VALVE", audit_score: 96, defect_ppm: 1000, open_capa_count: 0 }
              as: SupplierQualityManager
              captures: { s1_id: $.data.id }
            - call: "POST /mfg/component-lots"
