  # ------------------------------------------------------------ validations ---
  - section: validations
    instances:
      - name: request_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A mutation call without X-User-ID / X-User-Role headers is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mtm/members", payload: { full_name: "V One", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-V1", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (test harness sends the call WITHOUT auth headers)"

      - name: referral_create_with_unknown_member_returns_member_not_found
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3.5]"
          - "errors[ERR_MEMBER_NOT_FOUND]"
        distinguishing_aspect: "A body-level FK that does not exist yields the specific ERR_MEMBER_NOT_FOUND (404), distinct from the generic path-level ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mtm/referrals", payload: { member_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", diagnosis_codes: ["N18.3"], referred_diet_type: "RENAL", expires_at: "2026-06-30" }, as: ReferringProvider, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MEMBER_NOT_FOUND"

      - name: delivery_service_date_outside_authorization_window
        claim_type: temporal_validation
