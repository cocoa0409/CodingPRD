        distinguishing_aspect: "A Member role invoking the ProgramAdmin-exclusive POST /api/volunteers/{id}/clear is denied with 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "A club, a PENDING volunteer, and a member exist"
          setup_api_calls:
            - call: "POST /api/clubs"
