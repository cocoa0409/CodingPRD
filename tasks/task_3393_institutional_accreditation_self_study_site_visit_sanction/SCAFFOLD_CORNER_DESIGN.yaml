        grounds:
          - concurrency_rules[occ-institution-profile-update]
          - entities.Institution.fields.version
        distinguishing_aspect: "OCC on Institution.version: a PATCH carrying the freshly observed version succeeds (version 1 -> 2); replaying the same PATCH with the now-stale captured version fails 412 ERR_STALE_VERSION — two strictly sequential requests, no parallelism."
        test_recipe:
          setup:
            - "PROSPECTIVE institution at version 1."
          setup_api_calls:
            - *k_clock
            - *k_inst
          trigger:
            - call: "PATCH /accreditation/institutions/${inst_id}"
              payload: { expected_institution_version: "${inst_v}", state_code: "MO" }
              as: CommissionStaff
              captures: { v_after: $.data.version }
            - call: "PATCH /accreditation/institutions/${inst_id}"
              payload: { expected_institution_version: "${inst_v}", state_code: "IL" }
              as: CommissionStaff
              captures: { err_id: $.data.error_id }
          assert:
            - "first PATCH succeeds: v_after == 2 and state_code == MO"
            - "second PATCH with the stale expected_institution_version fails 412 with err_id == ERR_STALE_VERSION; state_code remains MO"

      - name: occ_team_assembly_stale_cycle_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[occ-review-team-assembly]
          - entities.ReviewCycle.fields.version
        distinguishing_aspect: "OCC on ReviewCycle.version at assembly: after record-federal-compliance silently bumps the cycle version, assembly carrying the pre-bump expected version fails 412 ERR_STALE_VERSION; re-reading and re-assembling with the fresh version succeeds."
        test_recipe:
          setup:
            - "CANDIDATE institution; cycle EVALUATION_ACTIVE at version 3 (captured); federal compliance then recorded, advancing the cycle to version 4; 4 eligible reviewers registered."
          setup_api_calls:
            - *k_clock
            - *k_inst
            - *k_elig_new
            - *k_elig_file
            - *k_elig_ok
            - *k_cyc_new
            - *k_cyc_adv1
            - *k_arg_new
            - *k_ev_m1
            - *k_ev_m2
            - *k_ev_m3
            - *k_ev_i1
            - *k_ev_i2
            - *k_ev_i3
            - *k_ev_tq1
            - *k_ev_tq2
            - *k_ev_tq3
            - *k_ev_te1
            - *k_ev_te2
            - *k_ev_te3
            - *k_ev_rp1
            - *k_ev_rp2
            - *k_ev_rp3
            - *k_arg_sub
            - *k_cyc_adv2
            - *k_fedcom_ok
            - *k_rev_chair
            - *k_rev_m2
            - *k_rev_m3
            - *k_rev_m4
          trigger:
            - call: "POST /accreditation/review-cycles/${cyc_id}/review-teams"
              payload: { visit_modality: "ON_SITE", expected_review_cycle_version: "${cyc_v}" }
              as: CommissionStaff
              captures: { err_id: $.data.error_id }
            - call: "GET /accreditation/review-cycles/${cyc_id}"
              payload: {}
              as: CommissionStaff
              captures: { cyc_v2: $.data.version }
            - call: "POST /accreditation/review-cycles/${cyc_id}/review-teams"
              payload: { visit_modality: "ON_SITE", expected_review_cycle_version: "${cyc_v2}" }
              as: CommissionStaff
              captures: { team_id: $.data.id }
          assert:
            - "first assembly fails 412 with err_id == ERR_STALE_VERSION (cyc_v was captured before record-federal-compliance bumped the version)"
            - "cyc_v2 == cyc_v + 1 (the federal-compliance write advanced it)"
            - "second assembly with the fresh version succeeds 201 and creates ReviewTeam.${team_id} in PROPOSED"

      - name: selector_chair_tiebreak_prefers_earlier_created
        claim_type: selector_policy
        grounds:
          - calculations.reviewer_selection_ranking
          - entities.ReviewTeam.fields.chair_reviewer_id
        distinguishing_aspect: "Chair selection is fully deterministic: two chair-eligible candidates tie on quality_rating 4.50 and prior_chair_count 2, and the tie breaks by created_at ASC — the earlier-registered candidate chairs; UUIDs never participate."
        test_recipe:
          setup:
            - "CANDIDATE institution; cycle EVALUATION_ACTIVE; reviewer pool: chairX (created first) and chairY (created second), both quality 4.50 with prior_chair_count 2; plus m1/m2/m3 with 1 specialty each and declining quality — so the losing chair candidate displaces m3 from the member seats."
          setup_api_calls:
            - *k_clock
            - *k_inst
            - *k_elig_new
            - *k_elig_file
            - *k_elig_ok
            - *k_cyc_new
            - *k_cyc_adv1
            - *k_arg_new
            - *k_ev_m1
            - *k_ev_m2
            - *k_ev_m3
            - *k_ev_i1
            - *k_ev_i2
            - *k_ev_i3
            - *k_ev_tq1
            - *k_ev_tq2
            - *k_ev_tq3
            - *k_ev_te1
            - *k_ev_te2
            - *k_ev_te3
            - *k_ev_rp1
            - *k_ev_rp2
            - *k_ev_rp3
            - *k_arg_sub
            - *k_cyc_adv2
            - call: "POST /accreditation/reviewers"
              payload: { full_name: "Chair X", specialty_criteria: ["CRIT_MISSION"], quality_rating: 4.50, prior_chair_count: 2 }
              as: CommissionStaff
              captures: { chairX_id: $.data.id }
            - call: "POST /accreditation/reviewers"
              payload: { full_name: "Chair Y", specialty_criteria: ["CRIT_INTEGRITY"], quality_rating: 4.50, prior_chair_count: 2 }
              as: CommissionStaff
              captures: { chairY_id: $.data.id }
            - call: "POST /accreditation/reviewers"
              payload: { full_name: "Member One", specialty_criteria: ["CRIT_MISSION"], quality_rating: 1.00, prior_chair_count: 0 }
              as: CommissionStaff
              captures: { mm1_id: $.data.id }
            - call: "POST /accreditation/reviewers"
              payload: { full_name: "Member Two", specialty_criteria: ["CRIT_INTEGRITY"], quality_rating: 0.90, prior_chair_count: 0 }
              as: CommissionStaff
              captures: { mm2_id: $.data.id }
            - call: "POST /accreditation/reviewers"
              payload: { full_name: "Member Three", specialty_criteria: ["CRIT_TEACHING_QUALITY"], quality_rating: 0.80, prior_chair_count: 0 }
              as: CommissionStaff
              captures: { mm3_id: $.data.id }
          trigger:
            - call: "POST /accreditation/review-cycles/${cyc_id}/review-teams"
              payload: { visit_modality: "VIRTUAL", expected_review_cycle_version: "${cyc_v}" }
              as: CommissionStaff
              captures: { team_id: $.data.id, team_chair: $.data.chair_reviewer_id }
          assert:
            - "team_chair == ${chairX_id} (quality and prior_chair_count tie -> created_at ASC; chairY loses the tie despite identical credentials)"
            - "chairY re-enters the MEMBER pool and tops it (1 specialty, quality 4.50): member seats go to ${chairY_id}, ${mm1_id}, ${mm2_id}"
            - "${mm3_id} (1 specialty, quality 0.80) is the only eligible reviewer left unassigned — the member ranking excludes the lowest-ranked candidate"

      - name: panel_close_cascade_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.DecisionPanel.CONVENED_to_CLOSED
        excluded_because:
          difficulty_instance: panel_close_cascade_disbands_team_and_drafts_outcome
          rationale: "The four-link panel-close cascade is asserted end-to-end by the named §1.8 instance."

      - name: indicator_sanction_cascade_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.IndicatorReport.SUBMITTED_to_FLAGGED_PANEL
        excluded_because:
          difficulty_instance: indicator_panel_band_cascade_freezes_substantive_changes
          rationale: "The four-link indicator cascade is asserted end-to-end by the named §1.8 instance."

      - name: dual_variant_finance_covered
        claim_type: dual_variant_calculation
        grounds:
