        grounds:
          - "concurrency_rules[program-close-stale-program]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "program close carrying a version read before a treaty bind (which bumped version) is rejected 412; close succeeds with the current version once claims are terminal."
        test_recipe:
          setup: ["program ACTIVE with no policies/claims; version captured; treaty bound (version +1)"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-CC2", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-CC2", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-CC2", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-CC2", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-CC2", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
              captures: { prog_v_stale: $.data.version }
            - call: "POST /programs/${prog_id}/treaties"
              payload: { treaty_name: "T-CC2", ceded_percentage: 25, attachment_point_cents: 0, treaty_limit_cents: 1000000 }
              as: ProgramManager
              captures: { treaty_id: $.data.id }
            - call: "POST /programs/${prog_id}/treaties/${treaty_id}/bind-treaty"
              payload: { expected_program_version: "${prog_v_stale}" }
              as: ProgramManager
          trigger:
            - call: "POST /programs/${prog_id}/close"
              payload: { expected_program_version: "${prog_v_stale}" }
              as: ProgramManager
              captures: { close_err: $.data.error_id }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramManager
              captures: { prog_v_fresh: $.data.version }
            - call: "POST /programs/${prog_id}/close"
              payload: { expected_program_version: "${prog_v_fresh}" }
              as: ProgramManager
              captures: { close_st: $.data.status }
            - call: "GET /programs/${prog_id}/treaties/${treaty_id}"
              payload: {}
              as: ProgramManager
              captures: { treaty_st: $.data.status }
          assert:
            - "close with stale version (treaty bind advanced it) -> (${close_err}) == ERR_STALE_VERSION (412)"
            - "close with fresh version succeeds: program status (${close_st}) == CLOSED"
            - "ACTIVE treaty cascaded to (${treaty_st}) == COMMUTED on close"

      - name: idempotent_retrigger_second_verify_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.TriggerEvent.UNDER_REVIEW_to_VERIFIED"
          - "errors[ERR_EVENT_NOT_UNDER_REVIEW]"
        distinguishing_aspect: "Repeating the verify action on an already-VERIFIED event fails ERR_EVENT_NOT_UNDER_REVIEW and does NOT generate duplicate claims (at-least-once client retry safety)."
        test_recipe:
          setup: ["program ACTIVE, policy BOUND, event verified once (1 claim generated)"]
          setup_api_calls:
