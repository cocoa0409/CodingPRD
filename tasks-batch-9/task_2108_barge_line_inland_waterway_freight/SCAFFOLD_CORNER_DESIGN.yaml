# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over every testable claim SCAFFOLD.yaml sections 1.1-1.7 declare
# that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Sections and
# claim_type values come from references/claim-extraction-guide.md.
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: create_barge_applies_defaults_and_mints_system_fields
        claim_type: Creation
        grounds:
          - entities.Barge.fields.operational_status
          - entities.Barge.fields.cleanliness_status
          - endpoints.POST /barges
        distinguishing_aspect: "A barge created with only the four required hull fields comes back with operational_status IDLE, cleanliness_status WASHED, last_cargo_commodity_id null, version 1 and a server-minted unprefixed UUID id."
        test_recipe:
          setup: ["Empty database; logical clock untouched."]
          setup_api_calls: []
          trigger:
            - call: "POST /barges"
              payload: { hull_number: "BL-9001", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { b_id: $.data.id }
          assert:
            - "HTTP 201 with response_type \"object\""
            - "Barge.${b_id}.operational_status == IDLE"
            - "Barge.${b_id}.cleanliness_status == WASHED"
            - "Barge.${b_id}.last_cargo_commodity_id == null"
            - "Barge.${b_id}.version == 1 and created_at is an ISO 8601 UTC timestamp with three fractional digits"
            - "Barge.${b_id}.id matches a bare UUID with no type prefix"

      - name: create_barge_accepts_optional_prior_cargo_and_cleanliness
        claim_type: Defaults
        grounds:
          - entities.Barge.fields.last_cargo_commodity_id
          - endpoints.POST /barges
        distinguishing_aspect: "Supplying the two optional hull fields overrides the WASHED default, producing a DIRTY hull whose last_cargo_commodity_id points at the created commodity."
        test_recipe:
          setup: ["One commodity UAN32 in group FERTILIZER."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { code: "UAN32", commodity_group: "FERTILIZER", residue_class: "TOXIC", hazard_flag: true, stowage_factor: 0.85 }
              as: WaterwayAdmin
              captures: { uan_id: $.data.id }
          trigger:
            - call: "POST /barges"
              payload: { hull_number: "BL-9002", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0, cleanliness_status: "DIRTY", last_cargo_commodity_id: "${uan_id}" }
              as: WaterwayAdmin
              captures: { b_id: $.data.id }
          assert:
            - "Barge.${b_id}.cleanliness_status == DIRTY"
            - "Barge.${b_id}.last_cargo_commodity_id == ${uan_id}"
            - "Barge.${b_id}.operational_status == IDLE"

      - name: create_barge_with_system_field_in_body_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Barge.fields.operational_status
          - validations[priority=3]
        distinguishing_aspect: "operational_status is declared source: system and is absent from the endpoint's input list, so a body that carries it must not be able to open a hull directly in IN_TOW."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /barges"
              payload: { hull_number: "BL-9003", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0, operational_status: "IN_TOW" }
              as: WaterwayAdmin
              captures: { b_id: $.data.id, err: $.data.error_id }
          assert:
            - "either HTTP 201 with Barge.${b_id}.operational_status == IDLE, or HTTP 400 with ${err} == ERR_INVALID_REQUEST - the hull must never open in IN_TOW"

      - name: list_barges_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET /barges
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three hulls exist; a request for limit 2 offset 0 returns exactly two rows with total_count 3 and has_more true, and offset 2 returns one row with has_more false."
        test_recipe:
          setup: ["Three registered hulls BL-9101, BL-9102 and BL-9103."]
          setup_api_calls:
            - call: "POST /barges"
              payload: { hull_number: "BL-9101", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
            - call: "POST /barges"
              payload: { hull_number: "BL-9102", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
            - call: "POST /barges"
              payload: { hull_number: "BL-9103", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
          trigger:
            - call: "GET /barges"
              payload: { limit: 2, offset: 0 }
              as: WaterwayAdmin
            - call: "GET /barges"
              payload: { limit: 2, offset: 2 }
              as: WaterwayAdmin
          assert:
            - "first response has response_type \"array\", 2 items, total_count 3 and has_more true"
            - "second response has 1 item, total_count 3 and has_more false"

      - name: list_barges_filtered_by_last_cargo_commodity_id_finds_the_hull
        claim_type: Parent Relationships
        grounds:
          - entities.Barge.fields.last_cargo_commodity_id
          - endpoints.GET /barges
        distinguishing_aspect: "The reverse-reachability filter on the Barge -> Commodity foreign key returns exactly the hull whose last cargo was UAN32 and excludes the hull with no prior cargo."
        test_recipe:
          setup: ["Commodity UAN32; hull BL-9201 with UAN32 as last cargo and hull BL-9202 with none."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { code: "UAN32", commodity_group: "FERTILIZER", residue_class: "TOXIC", hazard_flag: true, stowage_factor: 0.85 }
              as: WaterwayAdmin
              captures: { uan_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-9201", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0, last_cargo_commodity_id: "${uan_id}" }
              as: WaterwayAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-9202", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { b2_id: $.data.id }
          trigger:
            - call: "GET /barges"
              payload: { last_cargo_commodity_id: "${uan_id}" }
              as: WaterwayAdmin
          assert:
            - "total_count == 1 and the single item's id == ${b1_id}"
            - "${b2_id} does not appear in the result"

      - name: commodity_is_immutable_and_exposes_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.Commodity
          - endpoints.GET /commodities/{commodity_id}
        distinguishing_aspect: "Commodity is declared common_fields: false, so the scaffold offers no PUT or PATCH for it and its read carries id and created_at only, never a version that could be bumped."
        test_recipe:
          setup: ["One commodity CORN."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { code: "CORN", commodity_group: "GRAIN", residue_class: "CLEAN", hazard_flag: false, stowage_factor: 1.28 }
              as: WaterwayAdmin
              captures: { corn_id: $.data.id }
          trigger:
            - call: "GET /commodities/${corn_id}"
              payload: {}
              as: WaterwayAdmin
          assert:
            - "HTTP 200 and the payload carries code CORN, commodity_group GRAIN, residue_class CLEAN, hazard_flag false and stowage_factor 1.28"
            - "no §1.5 endpoint exists that mutates a Commodity after creation"

      - name: create_freight_contract_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST /freight-contracts
        distinguishing_aspect: "declared_value_cents_per_ton has source input and no default, so omitting it must fail with ERR_INVALID_REQUEST and HTTP 400 before any foreign key is resolved."
        test_recipe:
          setup: ["One shipper and one commodity."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { code: "CORN", commodity_group: "GRAIN", residue_class: "CLEAN", hazard_flag: false, stowage_factor: 1.28 }
              as: WaterwayAdmin
              captures: { corn_id: $.data.id }
            - call: "POST /shippers"
              payload: { name: "Delta Grain Co", credit_limit_cents: 900000000 }
              as: ContractManager
              captures: { sh_id: $.data.id }
          trigger:
            - call: "POST /freight-contracts"
              payload: { shipper_id: "${sh_id}", commodity_id: "${corn_id}", contracted_tons: 1700, origin_mile: 600, destination_mile: 200, laytime_hours: 12 }
              as: ContractManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /freight-contracts with shipper_id ${sh_id} returns total_count 0"

      - name: create_freight_contract_defaults_claim_settlement_basis_to_deductible
        claim_type: Defaults
        grounds:
          - entities.FreightContract.fields.claim_settlement_basis
          - endpoints.POST /freight-contracts
        distinguishing_aspect: "Omitting claim_settlement_basis must store DEDUCTIBLE, and movement_status DRAFT with billing_status NOT_BILLED, distance_miles 400 being derived only at activation."
        test_recipe:
          setup: ["One shipper and one commodity."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { code: "CORN", commodity_group: "GRAIN", residue_class: "CLEAN", hazard_flag: false, stowage_factor: 1.28 }
              as: WaterwayAdmin
              captures: { corn_id: $.data.id }
            - call: "POST /shippers"
              payload: { name: "Delta Grain Co", credit_limit_cents: 900000000 }
              as: ContractManager
              captures: { sh_id: $.data.id }
          trigger:
            - call: "POST /freight-contracts"
              payload: { shipper_id: "${sh_id}", commodity_id: "${corn_id}", contracted_tons: 1700, origin_mile: 600, destination_mile: 200, laytime_hours: 12, declared_value_cents_per_ton: 22000 }
              as: ContractManager
              captures: { fc_id: $.data.id }
          assert:
            - "FreightContract.${fc_id}.claim_settlement_basis == DEDUCTIBLE"
            - "FreightContract.${fc_id}.movement_status == DRAFT and billing_status == NOT_BILLED"
            - "FreightContract.${fc_id}.pinned_tariff_filing_id == null and pinned_fuel_surcharge_pct == null"
            - "FreightContract.${fc_id}.total_cents == 0"

      - name: duplicate_hull_number_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=27]
          - errors[ERR_DUPLICATE_HULL_NUMBER]
        distinguishing_aspect: "hull_number is declared unique across Barge, so a second registration of BL-9301 must fail with ERR_DUPLICATE_HULL_NUMBER and HTTP 409."
        test_recipe:
          setup: ["Hull BL-9301 already registered."]
          setup_api_calls:
            - call: "POST /barges"
              payload: { hull_number: "BL-9301", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
          trigger:
            - call: "POST /barges"
              payload: { hull_number: "BL-9301", capacity_tons: 2000, light_draft_feet: 1.6, tons_per_inch_immersion: 18.0 }
              as: WaterwayAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DUPLICATE_HULL_NUMBER with HTTP 409"
            - "GET /barges returns total_count 1"

      - name: list_endpoint_with_limit_zero_returns_invalid_pagination
        claim_type: Listing
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "The pagination contract fixes limit to [1, 100]; limit 0 sits one below the inclusive floor and must fail with ERR_INVALID_PAGINATION and HTTP 400 rather than defaulting to 10."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /barges"
              payload: { limit: 0 }
              as: WaterwayAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_PAGINATION with HTTP 400"

      - name: list_endpoint_with_limit_one_hundred_is_accepted_at_the_ceiling
        claim_type: Listing
        grounds:
          - validations[priority=4]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit 100 is the inclusive ceiling and must be accepted, while 101 is refused - the boundary is <= 100, not < 100."
        test_recipe:
          setup: ["One registered hull."]
          setup_api_calls:
            - call: "POST /barges"
              payload: { hull_number: "BL-9401", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
          trigger:
            - call: "GET /barges"
              payload: { limit: 100, offset: 0 }
              as: WaterwayAdmin
            - call: "GET /barges"
              payload: { limit: 101, offset: 0 }
              as: WaterwayAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the limit 100 request returns HTTP 200 with total_count 1"
            - "${err} == ERR_INVALID_PAGINATION with HTTP 400 for limit 101"

  # =========================================================================
  - section: state_machines
    instances:

      - name: tariff_filing_supersession_truncates_the_incumbent_window
        claim_type: Side Effect Execution
        grounds:
          - state_machines.TariffFiling.FILED_to_EFFECTIVE
          - state_machines.TariffFiling.EFFECTIVE_to_SUPERSEDED
          - entities.TariffFiling.fields.supersedes_tariff_filing_id
        distinguishing_aspect: "Effectuating a successor that names the incumbent in supersedes_tariff_filing_id drives the incumbent EFFECTIVE -> SUPERSEDED and truncates its effective_to to the successor's effective_from, leaving exactly one EFFECTIVE GRAIN filing."
        test_recipe:
          setup:
            - "An EFFECTIVE GRAIN filing T-GRAIN-2026 valid 2026-08-01 to 2026-12-31, filed by analyst-1 and effectuated by rate-1."
            - "A successor filing T-GRAIN-2026B valid 2026-10-01 to 2027-03-31 naming the incumbent, already FILED."
          setup_api_calls:
            - call: "POST /tariff-filings"
              payload: { tariff_code: "T-GRAIN-2026", commodity_group: "GRAIN", base_rate_cents_per_ton_mile: 1.2378, min_charge_cents: 250000, demurrage_rate_cents_per_hour: 32500, fuel_surcharge_table: [{ threshold_cents_per_gallon: 200, pct: 0.0 }, { threshold_cents_per_gallon: 300, pct: 0.045 }], effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: TariffAnalyst
              as_user_id: "analyst-1"
              captures: { tf_a: $.data.id }
            - call: "POST /tariff-filings/${tf_a}/file"
              payload: {}
              as: TariffAnalyst
              as_user_id: "analyst-1"
            - call: "POST /tariff-filings/${tf_a}/effectuate"
              payload: {}
              as: RateAuthority
              as_user_id: "rate-1"
            - call: "POST /tariff-filings"
              payload: { tariff_code: "T-GRAIN-2026B", commodity_group: "GRAIN", base_rate_cents_per_ton_mile: 1.4, min_charge_cents: 260000, demurrage_rate_cents_per_hour: 35000, fuel_surcharge_table: [{ threshold_cents_per_gallon: 200, pct: 0.0 }, { threshold_cents_per_gallon: 300, pct: 0.05 }], effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-03-31T23:59:59Z", supersedes_tariff_filing_id: "${tf_a}" }
              as: TariffAnalyst
              as_user_id: "analyst-1"
              captures: { tf_b: $.data.id }
            - call: "POST /tariff-filings/${tf_b}/file"
              payload: {}
              as: TariffAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /tariff-filings/${tf_b}/effectuate"
              payload: {}
              as: RateAuthority
              as_user_id: "rate-1"
          assert:
            - "TariffFiling.${tf_b}.status == EFFECTIVE and effectuated_by_user_id == \"rate-1\""
            - "TariffFiling.${tf_a}.status == SUPERSEDED"
            - "TariffFiling.${tf_a}.effective_to == \"2026-10-01T00:00:00Z\""
            - "GET /tariff-filings with supersedes_tariff_filing_id ${tf_a} returns total_count 1 with the single item's id == ${tf_b}"

      - name: effectuate_from_draft_returns_tariff_filing_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.TariffFiling.FILED_to_EFFECTIVE
          - errors[ERR_TARIFF_FILING_INVALID_STATE]
        distinguishing_aspect: "EFFECTIVE is reachable only from FILED; effectuating a DRAFT filing must fail with ERR_TARIFF_FILING_INVALID_STATE and leave the row DRAFT with effectuated_by_user_id null."
        test_recipe:
          setup: ["One DRAFT GRAIN filing that has never been filed."]
          setup_api_calls:
            - call: "POST /tariff-filings"
              payload: { tariff_code: "T-GRAIN-DRAFT", commodity_group: "GRAIN", base_rate_cents_per_ton_mile: 1.2378, min_charge_cents: 250000, demurrage_rate_cents_per_hour: 32500, fuel_surcharge_table: [{ threshold_cents_per_gallon: 200, pct: 0.0 }], effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: TariffAnalyst
              as_user_id: "analyst-1"
              captures: { tf_id: $.data.id }
          trigger:
            - call: "POST /tariff-filings/${tf_id}/effectuate"
              payload: {}
              as: RateAuthority
              as_user_id: "rate-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_TARIFF_FILING_INVALID_STATE with HTTP 409"
            - "TariffFiling.${tf_id}.status == DRAFT and filed_by_user_id == null and effectuated_by_user_id == null"

      - name: cleaning_order_failed_inspection_reverts_and_parks_the_hull
        claim_type: Side Effect Execution
        grounds:
          - state_machines.CleaningOrder.IN_PROGRESS_to_FAILED_INSPECTION
          - state_machines.CleaningOrder.FAILED_INSPECTION_to_IN_PROGRESS
          - state_machines.Barge.OUT_OF_SERVICE_to_IDLE
          - entities.CleaningOrder.fields.fee_cents
        distinguishing_aspect: "A failed inspection leaves fee_cents at 0, parks the hull OUT_OF_SERVICE and leaves cleanliness untouched; re-starting the SAME order returns it to IN_PROGRESS and a passing completion then charges 180000 and returns the hull to IDLE WASHED."
        test_recipe:
          setup:
            - "Commodities CORN (GRAIN) and BITCOAL (COAL); no compatibility row for COAL -> GRAIN, so the default WASH level applies."
            - "Hull BL-9501 registered DIRTY with BITCOAL as last cargo; a cleaning order for CORN raised and started."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { code: "CORN", commodity_group: "GRAIN", residue_class: "CLEAN", hazard_flag: false, stowage_factor: 1.28 }
              as: WaterwayAdmin
              captures: { corn_id: $.data.id }
            - call: "POST /commodities"
              payload: { code: "BITCOAL", commodity_group: "COAL", residue_class: "DUSTY", hazard_flag: false, stowage_factor: 0.9 }
              as: WaterwayAdmin
              captures: { coal_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-9501", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0, cleanliness_status: "DIRTY", last_cargo_commodity_id: "${coal_id}" }
              as: WaterwayAdmin
              captures: { b_id: $.data.id }
            - call: "POST /barges/${b_id}/cleaning-orders"
              payload: { required_for_commodity_id: "${corn_id}" }
              as: HarborAgent
              captures: { co_id: $.data.id }
            - call: "POST /cleaning-orders/${co_id}/start"
              payload: {}
              as: HarborAgent
          trigger:
            - call: "POST /cleaning-orders/${co_id}/complete"
              payload: { performed_level: "WASH", certificate_number: "C-FAIL", inspection_passed: false }
              as: HarborAgent
            - call: "POST /cleaning-orders/${co_id}/start"
              payload: {}
              as: HarborAgent
            - call: "POST /cleaning-orders/${co_id}/complete"
              payload: { performed_level: "WASH", certificate_number: "C-PASS", inspection_passed: true }
              as: HarborAgent
          assert:
            - "CleaningOrder.${co_id}.required_cleaning_level == WASH - the default applies because no COAL -> GRAIN row exists"
            - "after the failing completion CleaningOrder.${co_id}.status == FAILED_INSPECTION and fee_cents == 0"
            - "after the failing completion Barge.${b_id}.operational_status == OUT_OF_SERVICE and cleanliness_status == DIRTY"
            - "after the restart CleaningOrder.${co_id}.status == IN_PROGRESS"
            - "after the passing completion CleaningOrder.${co_id}.status == COMPLETED and fee_cents == 180000"
            - "Barge.${b_id}.operational_status == IDLE, cleanliness_status == WASHED and last_cleaning_certificate_number == \"C-PASS\""

      - name: complete_cleaning_order_that_was_never_started_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CleaningOrder.IN_PROGRESS_to_COMPLETED
          - errors[ERR_CLEANING_ORDER_INVALID_STATE]
        distinguishing_aspect: "COMPLETED is reachable only from IN_PROGRESS; completing an ORDERED order must fail with ERR_CLEANING_ORDER_INVALID_STATE and leave fee_cents 0."
        test_recipe:
          setup: ["One commodity CORN, one clean hull, one cleaning order still in status ORDERED."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { code: "CORN", commodity_group: "GRAIN", residue_class: "CLEAN", hazard_flag: false, stowage_factor: 1.28 }
              as: WaterwayAdmin
              captures: { corn_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-9601", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { b_id: $.data.id }
            - call: "POST /barges/${b_id}/cleaning-orders"
              payload: { required_for_commodity_id: "${corn_id}" }
              as: HarborAgent
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /cleaning-orders/${co_id}/complete"
              payload: { performed_level: "SWEEP", certificate_number: "C-1", inspection_passed: true }
              as: HarborAgent
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CLEANING_ORDER_INVALID_STATE with HTTP 409"
            - "CleaningOrder.${co_id}.status == ORDERED and fee_cents == 0"
            - "Barge.${b_id}.cleanliness_status == WASHED - unchanged"

      - name: null_prior_cargo_resolves_required_cleaning_level_to_none
        claim_type: Precondition Enforcement
        grounds:
          - calculations.cleaning_requirement_and_fee
          - entities.CleaningOrder.fields.required_cleaning_level
        distinguishing_aspect: "A hull that has never carried cargo short-circuits the compatibility matrix: required_cleaning_level is NONE regardless of the target commodity, and a NONE completion is billed at 0."
        test_recipe:
          setup: ["Commodity CORN; hull BL-9701 with last_cargo_commodity_id null; a started cleaning order for CORN."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { code: "CORN", commodity_group: "GRAIN", residue_class: "CLEAN", hazard_flag: false, stowage_factor: 1.28 }
              as: WaterwayAdmin
              captures: { corn_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-9701", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { b_id: $.data.id }
            - call: "POST /barges/${b_id}/cleaning-orders"
              payload: { required_for_commodity_id: "${corn_id}" }
              as: HarborAgent
              captures: { co_id: $.data.id }
            - call: "POST /cleaning-orders/${co_id}/start"
