  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: freeze_rejected_when_site_has_no_active_ppa
        grounds:
          - state_machines.Site.SITE_ACTIVE_to_SITE_SUSPENDED
          - state_machines.Ppa.PPA_DRAFT_to_PPA_ACTIVE
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/power/sites/{id}/freeze
        distinguishing_aspect: "Site→Ppa pair #3 (Site transition depends on Ppa state): freezing is refused with ERR_INVALID_STATE (409) while the site holds zero PPAs in PPA_ACTIVE, even though the site itself is SITE_ACTIVE — the guard crosses from the Site row into its child collection."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. A Site registered with no PPAs at all."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Tule Fog Warehouse", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /power/sites/${site_id}/freeze"
              payload: { reason: "CUSTOMER_REQUEST" }
              as: SiteOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_INVALID_STATE"
            - "Site.${site_id}.status is still SITE_ACTIVE"
            - "Site.${site_id}.active_ppa_count == 0"

      - name: renew_rejected_while_renewal_stage_is_offered_not_accepted
        grounds:
          - state_machines.Ppa.PPA_TERMINATED_to_PPA_ACTIVE
          - state_machines.Customer.RENEWAL_OFFERED_to_RENEWAL_ACCEPTED
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/power/ppas/{id}/renew
        distinguishing_aspect: "Ppa→Customer pair (a Ppa transition depends on Customer state): renewing a terminated contract is refused with ERR_INVALID_STATE (409) while Customer.renewal_stage is RENEWAL_OFFERED, and the same call succeeds after accept-renewal — a different entity pair from the site-freeze dependency."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. A Site with one PPA already terminated after an uncured exit, and its customer at RENEWAL_OFFERED."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Napa Barrel Works", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Napa Barrel Holdings", industry_code: "321999", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { ppa_id: $.data.id }
            - call: "POST /power/ppas/${ppa_id}/activate"
              payload: {}
              as: SiteOperator
            - call: "POST /power/ppas/${ppa_id}/request-exit"
              payload: {}
              as: SiteOperator
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-04-20T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/ppas/${ppa_id}/terminate"
              payload: {}
              as: SiteOperator
            - call: "POST /power/customers/${cust_id}/offer-renewal"
              payload: {}
              as: CustomerService
          trigger:
            - call: "POST /power/ppas/${ppa_id}/renew"
              payload: {}
              as: SiteOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_INVALID_STATE"
            - "Ppa.${ppa_id}.state is still PPA_TERMINATED"
            - "after POST /power/customers/${cust_id}/accept-renewal the same renew call returns 200 and Ppa.${ppa_id}.state becomes PPA_ACTIVE"

      - name: transfer_rejected_on_a_suspended_site
        grounds:
          - state_machines.Site.SITE_ACTIVE_to_SITE_SUSPENDED
          - errors[ERR_TRANSFER_BLOCKED]
          - entities.Ppa.fields.contract_basis
          - endpoints.POST_/power/sites/{id}/transfer-ppa
        distinguishing_aspect: "Site→Ppa pair #4 (contract-transfer posture depends on Site state): transferring the contract set of a SITE_SUSPENDED facility is refused with ERR_TRANSFER_BLOCKED (409) and the PPA keeps contract_basis PPA_BASIS_AS_BUILT, so no transfer valuation is emitted."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. A Site with one active PPA, frozen after a grid interconnect failure."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Antelope Valley Growers", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Antelope Valley Farms", industry_code: "111219", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Antelope Valley Successor LLC", industry_code: "111219", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { buyer_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { ppa_id: $.data.id }
            - call: "POST /power/ppas/${ppa_id}/activate"
              payload: {}
              as: SiteOperator
            - call: "POST /power/sites/${site_id}/freeze"
              payload: { reason: "GRID_INTERCONNECT_FAILURE" }
              as: SiteOperator
          trigger:
            - call: "POST /power/sites/${site_id}/transfer-ppa"
              payload: { ppa_id: "${ppa_id}", accepting_customer_id: "${buyer_id}", transfer_basis: "PPA_BASIS_TRANSFERRED" }
              as: SiteOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_TRANSFER_BLOCKED"
            - "Ppa.${ppa_id}.contract_basis is still PPA_BASIS_AS_BUILT"
            - "Ppa.${ppa_id}.customer_id is unchanged"

      - name: allowance_issue_rejected_on_a_draft_contract
        grounds:
          - state_machines.SettlementAllowance.ALLOWANCE_ISSUED_to_ALLOWANCE_APPLIED
          - state_machines.Ppa.PPA_DRAFT_to_PPA_ACTIVE
          - errors[ERR_NO_ELIGIBLE_ACCRUAL]
          - endpoints.POST_/power/ppas/{id}/allowances
        distinguishing_aspect: "Ppa→SettlementAllowance pair (the new child's admissible transitions depend on the parent contract state): issuing an allowance against a PPA still in PPA_DRAFT with no open accrual is refused with ERR_NO_ELIGIBLE_ACCRUAL (422), so no ALLOWANCE_ISSUED row exists to apply."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. A Site with a single PPA still in PPA_DRAFT and no accruals."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Kings Canyon Orchard", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Kings Canyon Fruit Co", industry_code: "111331", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { ppa_id: $.data.id, ppa_v: $.data.version }
          trigger:
            - call: "POST /power/ppas/${ppa_id}/allowances"
              payload: { allowance_kind: "CAPACITY_ALLOWANCE", amount_cents: 185000, expected_ppa_version: "${ppa_v}" }
              as: SettlementAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and data.error_id == ERR_NO_ELIGIBLE_ACCRUAL"
            - "GET /power/ppas/${ppa_id}/allowances returns an empty array"
            - "Ppa.${ppa_id}.state is still PPA_DRAFT"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: touching_resource_hold_windows_conflict_under_closed_interval_semantics
        grounds:
          - validations[priority=22]
          - entities.FuelDelivery.fields.hold_window_start_iso8601
          - errors[ERR_DELIVERY_WINDOW_OVERLAP]
          - endpoints.POST_/power/sites/{id}/resource-holds
        distinguishing_aspect: "Closed-interval semantics: a second hold whose window starts exactly on the first hold's window end ([2026-04-01,2026-04-02] then [2026-04-02,2026-04-03]) is rejected with ERR_DELIVERY_WINDOW_OVERLAP (422) — a half-open treatment of the same endpoints would admit it, and the two holds sit on the same resource with closing touch rather than nesting."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. A Site with an opening drawback pool of 100000 therms and one open hold of 30000 therms covering 2026-04-01..2026-04-02."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Bakersfield Almond Huller", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /power/sites/${site_id}/resource-holds"
              payload: { requested_therms: 30000, window_start_iso8601: "2026-04-01T00:00:00Z", window_end_iso8601: "2026-04-02T00:00:00Z" }
              as: SiteOperator
              captures: { hold_a_id: $.data.id, site_v: $.data.version }
          trigger:
            - call: "POST /power/sites/${site_id}/resource-holds"
              payload: { requested_therms: 30000, window_start_iso8601: "2026-04-02T00:00:00Z", window_end_iso8601: "2026-04-03T00:00:00Z" }
              as: SiteOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and data.error_id == ERR_DELIVERY_WINDOW_OVERLAP"
            - "Site.${site_id}.draw_position_therms is unchanged at 70000"
            - "the site still carries exactly one hold row"

      - name: adjacent_settlement_periods_are_admitted_under_half_open_semantics
        grounds:
          - validations[priority=19]
          - entities.SettlementLine.fields.period_start
          - errors[ERR_SETTLEMENT_PERIOD_OVERLAP]
          - endpoints.POST_/power/ppas/{id}/settlement-lines
        distinguishing_aspect: "Half-open semantics on a different resource: a new settlement line starting exactly on the previous line's period_end (previous [2025-02-01,2025-03-01), new [2025-03-01,2025-03-15)) is admitted with 201, whereas the same endpoints under the closed-interval treatment of the hold rule would be rejected — the two overlap rules differ in adjacency arithmetic, not just in resource."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. A Site with one active PPA already carrying an APPLIED line for [2025-02-01, 2025-03-01)."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
