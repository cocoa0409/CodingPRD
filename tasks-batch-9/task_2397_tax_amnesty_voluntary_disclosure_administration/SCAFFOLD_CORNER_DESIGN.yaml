            - "VoluntaryDisclosureAgreement.${agr_id}.total_due_cents == 1042375"
            - "the first trigger returns status 422 with error_id ERR_INSTALLMENT_HORIZON_EXCEEDED"
            - "after the first trigger GET /amnesty/payment-plans/${plan_long_id}/installments returns total_count == 0"
            - "the fourth trigger returns status 200"
            - "PaymentPlan.${plan_long_id}.status == \"SUPERSEDED\""
            - "PaymentPlan.${plan_ok_id}.status == \"ACTIVE\""
            - "PaymentPlan.${plan_ok_id}.approved_at == \"2026-09-15T00:00:00.000Z\""
            - "PaymentPlan.${plan_ok_id}.scheduled_total_cents == 938137"
            - "GET /amnesty/payment-plans/${plan_ok_id}/installments returns total_count == 12; the seq_index 1 row has amount_cents 78178 and due_date 2026-10-15, and the seq_index 12 row has amount_cents 78179 and due_date 2027-09-10"

      - name: payment_ceiling_is_unenforced_before_the_first_filing_then_binds
        claim_type: Satisfaction -> Pass
        grounds:
          - validations[priority=43]
          - calculations.payment_waterfall_allocation
          - errors[ERR_PAYMENT_EXCEEDS_BALANCE]
        distinguishing_aspect: |
          The ceiling has a documented hole and a hard edge. Before any return is filed
          total_due_cents is 0, so the guard is skipped and a 200000-cent good-faith
          deposit is accepted wholly into unapplied credit; once the return is filed the
          outstanding amount is 850000, so 850001 is refused and exactly 850000 is
          accepted, taking the agreement to PAID_IN_FULL.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Taxpayer Windlass Bay holds an EXECUTED agreement with no returns and no payment plan"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Windlass Bay Charters LLC", taxpayer_type: "BUSINESS", tin_last4: "1187" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
          trigger:
            - call: "POST /amnesty/payments"
              payload: { agreement_id: "${agr_id}", amount_cents: 200000, payment_reference: "GOODFAITH-1" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { pay_deposit_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-01-01", period_end_date: "2025-03-31", original_due_date: "2025-10-27", reported_tax_cents: 1000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /amnesty/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /amnesty/payments"
              payload: { agreement_id: "${agr_id}", amount_cents: 850001 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /amnesty/payments"
              payload: { agreement_id: "${agr_id}", amount_cents: 850000, payment_reference: "BALANCE-1" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { pay_final_id: $.data.id }
          assert:
            - "the first trigger returns status 201 even though total_due_cents is 0 at that moment"
            - "Payment.${pay_deposit_id}.unapplied_delta_cents == 200000"
            - "the fourth trigger returns status 422 with error_id ERR_PAYMENT_EXCEEDS_BALANCE"
            - "the fifth trigger returns status 201"
            - "VoluntaryDisclosureAgreement.${agr_id}.total_due_cents == 1050000"
            - "VoluntaryDisclosureAgreement.${agr_id}.paid_total_cents == 1050000"
            - "VoluntaryDisclosureAgreement.${agr_id}.unapplied_credit_cents == 1050000 (no plan was ever approved, so nothing absorbed the credit)"
            - "VoluntaryDisclosureAgreement.${agr_id}.payment_status == \"PAID_IN_FULL\""
            - "DisclosureReturn.${ret_id}.status == \"FILED\" (only an ASSESSED return may become SETTLED)"
            - "GET /amnesty/agreements/${agr_id}/payments?status=APPLIED returns total_count == 2"
            - "AmnestyProgram.${prog_id}.collected_cents == 1050000"

      - name: pagination_outside_one_to_hundred_is_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=9]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: |
          The pagination guard is a 400 that fires before any collection work: limit 101
          and a negative offset are both refused, while limit 100 — the inclusive
          maximum — is accepted, so the bound is not off by one.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; one DRAFT program exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
          trigger:
            - call: "GET /amnesty/programs"
              payload: { limit: 101 }
              as: ProgramAdministrator
              captures: { err_limit: $.data.error_id }
            - call: "GET /amnesty/programs"
              payload: { limit: 10, offset: -1 }
              as: ProgramAdministrator
              captures: { err_offset: $.data.error_id }
            - call: "GET /amnesty/programs"
              payload: { limit: 100, offset: 0 }
              as: ProgramAdministrator
          assert:
            - "the first trigger returns status 400 with error_id ERR_INVALID_PAGINATION"
            - "the second trigger returns status 400 with error_id ERR_INVALID_PAGINATION"
            - "the third trigger returns status 200 with total_count == 1, limit == 100 and has_more == false"

      - name: priority_ordering_between_two_violated_rules
        claim_type: Priority Ordering
        grounds:
          - validations[*].priority
        excluded_because:
          difficulty_instance: agreement_state_check_precedes_payment_ceiling_check
          rationale: |
            Three §1.8 instances already pin ascending-priority resolution on
            deliberately double-violating requests (state before ceiling, criminal screen
            before identity match, lookback before overlap), including a follow-up call
            proving the loser rule is still live.

  # =========================================================================
  - section: Table 5 Endpoints
    instances:
      - name: certify_compliance_gates_on_returns_then_settlement_then_the_clock
        claim_type: Conditional action
        grounds:
          - endpoints[POST /amnesty/agreements/{id}/certify-compliance]
          - entities.VoluntaryDisclosureAgreement.fields.compliance_due_at
          - errors[ERR_NO_DISCLOSURE_RETURNS]
          - errors[ERR_RETURNS_NOT_SETTLED]
          - errors[ERR_COMPLIANCE_PERIOD_NOT_ELAPSED]
        distinguishing_aspect: |
          Certification has three independent preconditions and this fixture walks the
          same agreement through all three in order — no returns, returns not settled,
          compliance period not elapsed — so an implementation that checks only the last
          one fails at the first trigger. The final success also shows the prospective
          commitment being measured from executed_at (2026-09-15 + 36 months =
          2029-09-15), not from the program window.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Taxpayer Marlstone holds an EXECUTED agreement with compliance_due_at 2029-09-15 and no returns yet"
