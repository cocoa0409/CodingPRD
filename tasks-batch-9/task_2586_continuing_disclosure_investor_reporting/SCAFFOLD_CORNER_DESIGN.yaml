      - name: repeating_attest_assemble_and_waive_fails_on_the_second_attempt
        claim_type: idempotency
        grounds:
          - state_machines[CycleContentItem].DRAFT->READY
          - state_machines[AnnualReportCycle].DRAFTING->READY_TO_FILE
          - state_machines[CycleContentItem].NOT_STARTED->WAIVED
          - validations.priority_8
        distinguishing_aspect: >-
          None of these actions is idempotent — there is no idempotency layer in the profile — so
          a duplicate attest, assemble or waive must be refused at priority 8 rather than
          silently re-stamping attested_at / assembled_at with a newer clock value. The test
          therefore also proves the first stamp survives the second call.
