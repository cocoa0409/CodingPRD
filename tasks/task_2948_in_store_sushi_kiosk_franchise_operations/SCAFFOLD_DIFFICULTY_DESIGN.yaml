            - "Kiosk.${kiosk_id}.risk_points == 8"
            - "Kiosk.${kiosk_id}.sanitation_posture == WATCH"
            - "ProductionPlan.${plan_id}.binding_cap_source == DEMAND"
            - "ProductionPlan.${plan_id}.posture_factor_applied == 0.85"
            - "ProductionPlan.${plan_id}.planned_pack_count == 137"
            - "ProductionPlan.${plan_id}.planned_rice_kg == 16.44"
            - "the same kiosk at CLEAR posture with traffic_forecast 12000 yields planned_pack_count 180 and binding_cap_source CASE_CAPACITY, because demand 216 exceeds the case cap 180"
            - "the same kiosk at CLEAR posture on a store attested at 30.0 linear feet with traffic_forecast 20000 yields planned_pack_count 200 and binding_cap_source STAFFING"
      - name: cold_chain_per_interval_round_then_sum
        grounds:
          - "calculations.cold_chain_breach_minutes"
          - "entities.ColdChainReading.fields.breach_minutes_attributed"
          - "entities.ColdChainReading.fields.lot_breach_minutes_after"
          - "entities.FishLot.fields.cold_chain_breach_minutes"
          - "state_machines.FishLot.RECEIVED_to_QUARANTINED"
        distinguishing_aspect: |
          MODE (b): the scaffold pins round-per-interval-then-sum. Four alternating 15-minute half-breach
          intervals each round 7.5 up to 8 for a total of 32, whereas summing the raw halves first and
          rounding once gives 30 - which sits exactly at the quarantine limit and would not quarantine.
        test_recipe:
          setup:
            - "clock at 2026-08-03T11:00:00Z"
            - "a fish lot received at 2026-08-03T06:00:00Z at 2.8 C, which is the compliant series origin"
            - "three cold-chain readings already appended at 06:15 (5.0 C), 06:30 (3.0 C) and 06:45 (5.0 C), each 15 minutes apart and each with exactly one endpoint above 4.4 C"
            - "the lot's accumulated cold_chain_breach_minutes is 24 and it is still RECEIVED"
