  - name: the_clock_read_with_missing_auth_headers_echoes_the_stored_time
    claim_type: standard_crud
    grounds: endpoints.GET /_clock output; global_constants.DEFAULT_CLOCK_UTC
    distinguishing_aspect: The read is exempt from the auth headers and returns only the stored logical
      clock, which is what every other assertion in the suite is dated against.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-20T08:30:00Z'
      trigger:
      - call: GET /_clock
      asserts:
      - the trigger, sent with no X-User-ID and no X-User-Role, returns 200 with current_utc == 2026-08-20T08:30:00Z
      - the answer is not ERR_MISSING_AUTH_HEADER, because the clock endpoints are the declared exception
