            - "CollateralLien.${lien_rv_id}.warehouseman_lien_cents == 11957"
            - "CollateralLien.${lien_rv_id}.net_collateral_cents == 367643"
            - "CollateralLien.${lien_rv_id}.advance_rate_bps == 7000"
            - "CollateralLien.${lien_rv_id}.advance_limit_cents == 257350"
            - "CollateralLien.${lien_rv_id}.margin_status == SUFFICIENT"
            - "Party.${len_id}.committed_advance_cents == 257350"
            - "Party.${len_id}.available_credit_cents == 49742650"

  - section: cross_cutting_complexity_layers
    instances:
      - name: receipt_issue_with_stale_warehouse_version_rejected
        claim_type: optimistic_concurrency_stale_version
        grounds: ["concurrency_rules[receipt-issue-stale-warehouse]", "errors[ERR_STALE_WAREHOUSE_VERSION]", "endpoints[POST /receipts]"]
        distinguishing_aspect: "The OCC guard is checked against Warehouse.version, not against any receipt state: an otherwise perfectly legal issuance carrying expected_warehouse_version one behind the current value returns 412 ERR_STALE_WAREHOUSE_VERSION, and the correct version then succeeds."
        test_recipe:
          setup:
            - "Base chain through accept: LICENSED warehouse (version 2 after create and licence issue), ACCEPTED ticket of 949 bushels."
            - "wh_v holds the current warehouse version, so ${wh_v} - 1 is exactly one version stale."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
          trigger:
            - call: "POST /receipts"
              payload:
                deposit_ticket_id: "${tk_id}"
                holder_party_id: "${dep_id}"
                receipt_number: "WR-0001"
                form: "NEGOTIABLE"
                medium: "ELECTRONIC"
                expected_warehouse_version: "${wh_v} - 1"
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - call: "POST /receipts"
              payload:
                deposit_ticket_id: "${tk_id}"
                holder_party_id: "${dep_id}"
                receipt_number: "WR-0001"
                form: "NEGOTIABLE"
                medium: "ELECTRONIC"
                expected_warehouse_version: "${wh_v}"
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "Call 1: HTTP 412 with data.error_id == ERR_STALE_WAREHOUSE_VERSION"
            - "Call 1: DepositTicket.${tk_id}.ticket_state == ACCEPTED and Warehouse.${wh_id}.receipted_obligation_bushels == 0"
            - "Call 2: HTTP 201 with data.receipt_state == ISSUED and data.quantity_bushels == 949"
            - "Call 2: Warehouse.${wh_id}.receipted_obligation_bushels == 949"

      - name: second_ticket_accept_with_stale_bin_version_rejected
        claim_type: optimistic_concurrency_stale_version
        grounds: ["concurrency_rules[deposit-accept-stale-bin]", "errors[ERR_STALE_BIN_VERSION]", "endpoints[POST /deposit-tickets/{ticket_id}/accept]"]
        distinguishing_aspect: "Accepting a second, different WEIGHED ticket is a legitimate operation, so only the version check catches it: the first accept bumps Bin.version to 2, the second accept replaying the pre-read value 1 gets 412 ERR_STALE_BIN_VERSION, and a re-read version succeeds and brings stored_bushels to 1449."
        test_recipe:
          setup:
            - "Licensed warehouse, bin B1 (40000 bushels, version 1), two WEIGHED tickets: 949 net on a 2026-08-05 window and 500 net (gross 500, dockage 0, moisture 13.0, no shrink) on a 2026-08-06 window."
            - "bin_v is read once, before either accept."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_agr
            - *b_bin
            - *b_tk
            - call: "POST /deposit-tickets"
              payload:
                storage_agreement_id: "${agr_id}"
                bin_id: "${bin_id}"
                gross_bushels: 500
                test_weight_lbs: 56.5
                moisture_pct: 13.0
                damage_pct: 2.0
                foreign_material_pct: 1.0
                dockage_pct: 0.0
                fill_start_at: "2026-08-06T09:00:00Z"
                fill_end_at: "2026-08-06T11:00:00Z"
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { tk_occ_id: $.data.id }
            - *b_binv
            - *b_acc
          trigger:
            - call: "POST /deposit-tickets/${tk_occ_id}/accept"
              payload: { expected_bin_version: "${bin_v}" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - call: "GET /bins/${bin_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { bin_v2: $.data.version }
            - call: "POST /deposit-tickets/${tk_occ_id}/accept"
              payload: { expected_bin_version: "${bin_v2}" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "Call 1: HTTP 412 with data.error_id == ERR_STALE_BIN_VERSION"
            - "Call 1: DepositTicket.${tk_occ_id}.ticket_state == WEIGHED and Bin.${bin_id}.stored_bushels == 949"
            - "Call 2: data.version == 2"
            - "Call 3: HTTP 200 with DepositTicket.${tk_occ_id}.ticket_state == ACCEPTED"
            - "Call 3: Bin.${bin_id}.stored_bushels == 1449 and Bin.${bin_id}.version == 3"
            - "Warehouse.${wh_id}.obligation_bushels == 1449"

      - name: warehouse_version_increments_on_every_write_that_touches_it
        claim_type: optimistic_concurrency_version_increment
        grounds: ["concurrency_rules[receipt-issue-stale-warehouse]", "endpoints[POST /warehouses]", "endpoints[POST /warehouses/{warehouse_id}/license-decision]", "endpoints[PATCH /warehouses/{warehouse_id}/financials]"]
        distinguishing_aspect: "Version counts writes to the Warehouse row itself: create leaves version 1, the licence decision makes it 2, accepting a ticket does NOT touch it (only Bin.version moves), issuing the receipt makes it 3 and a financials restatement makes it 4."
        test_recipe:
          setup: ["Base chain through accept; version reads are taken between the writes."]
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
          trigger:
            - call: "POST /receipts"
              payload:
                deposit_ticket_id: "${tk_id}"
                holder_party_id: "${dep_id}"
                receipt_number: "WR-0001"
                form: "NEGOTIABLE"
                medium: "ELECTRONIC"
                expected_warehouse_version: "${wh_v}"
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - call: "GET /warehouses/${wh_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - call: "PATCH /warehouses/${wh_id}/financials"
              payload: { net_worth_cents: 6000000 }
              as: StateRegulator
              as_user_id: "reg-001"
          assert:
            - "wh_v captured after create + licence issue + accept == 2 (the accept bumped only Bin.version)"
            - "Call 2: data.version == 3 after the receipt issuance"
            - "Call 3: HTTP 200 with data.version == 4 and data.net_worth_cents == 6000000"

      - name: derived_totals_reconcile_after_source_create_update_and_removal
        claim_type: derived_field_reconciliation
        grounds: ["complexity_profile.complexity_layers[derived_field_reconciliation]", "calculations.position_reconciliation", "entities.Warehouse.obligation_bushels", "entities.Warehouse.receipted_obligation_bushels"]
        distinguishing_aspect: "The two obligation totals move on different events: creating a WEIGHED ticket changes neither, accepting it raises obligation only, issuing its receipt raises receipted_obligation only, and voiding that receipt lowers receipted_obligation while obligation stays at 1449 because the ticket falls back to ACCEPTED."
        test_recipe:
          setup: ["Base chain complete: WR-0001 issued for 949 bushels, obligation 949, receipted_obligation 949, stored 949."]
          setup_api_calls: *base_full
          trigger:
            - call: "POST /deposit-tickets"
              payload:
                storage_agreement_id: "${agr_id}"
                bin_id: "${bin_id}"
                gross_bushels: 500
                test_weight_lbs: 56.5
                moisture_pct: 13.0
                damage_pct: 2.0
                foreign_material_pct: 1.0
                dockage_pct: 0.0
                fill_start_at: "2026-08-06T09:00:00Z"
                fill_end_at: "2026-08-06T11:00:00Z"
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { tk_dr_id: $.data.id }
            - call: "GET /bins/${bin_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { bin_v_dr: $.data.version }
            - call: "POST /deposit-tickets/${tk_dr_id}/accept"
              payload: { expected_bin_version: "${bin_v_dr}" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - call: "GET /warehouses/${wh_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { wh_v_dr: $.data.version }
            - call: "POST /receipts"
              payload:
                deposit_ticket_id: "${tk_dr_id}"
                holder_party_id: "${dep_id}"
                receipt_number: "WR-0002"
                form: "NEGOTIABLE"
                medium: "ELECTRONIC"
                expected_warehouse_version: "${wh_v_dr}"
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { rc_dr_id: $.data.id }
            - call: "POST /receipts/${rc_dr_id}/void"
              payload: { void_reason: "CLERICAL_ERROR" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "After call 1 (source created, WEIGHED): Warehouse.${wh_id}.obligation_bushels == 949, receipted_obligation_bushels == 949, Bin.${bin_id}.scheduled_inbound_bushels == 500"
            - "After call 3 (source accepted): obligation_bushels == 1449, receipted_obligation_bushels == 949, system_physical_bushels == 1449, Bin.${bin_id}.stored_bushels == 1449"
            - "After call 5 (receipt issued): obligation_bushels == 1449, receipted_obligation_bushels == 1449, position_variance_bushels == 0"
            - "After call 6 (receipt voided): receipted_obligation_bushels == 949, obligation_bushels == 1449, Bin.${bin_id}.stored_bushels == 1449"
            - "DepositTicket.${tk_dr_id}.ticket_state == ACCEPTED and WarehouseReceipt.${rc_dr_id}.receipt_state == VOIDED"
            - "GET /warehouses/${wh_id}/position-summary reports the same figures as the stored fields"

      - name: cascading_side_effect_chain_end_to_end
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers[cascading_side_effects]", "endpoints[POST /bins/{bin_id}/condition-assessment]"]
        excluded_because:
          difficulty_instance: "cascading_state_dependency / bin_out_of_condition_impairs_receipt_then_lien_then_lender_credit"
          rationale: "That §1.8 instance walks the full four-level chain (bin condition to receipt quality_flag to lien revaluation to lender credit) and its reversal, including the ordering assertion."

      - name: dual_variant_divergence_and_switch_delta
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile.complexity_layers[dual_variant_calculation]", "calculations.storage_charge_accrual.variants", "calculations.collateral_valuation_and_advance_limit.variants"]
        excluded_because:
          difficulty_instance: "dual_variant_calculation_divergence / storage_charge_provisional_vs_final_on_receipt"
          rationale: "That §1.8 instance asserts both variants on identical data and the delta at the provisional-to-final switch; the valuation-basis pair is covered by lien_valuation_mark_to_market_vs_face_advance."

  - section: consistency_model
    instances:
      - name: insolvency_declaration_effects_are_visible_in_the_same_response
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model[immediate]", "endpoints[POST /warehouses/{warehouse_id}/insolvency]", "calculations.operational_posture_derivation"]
        distinguishing_aspect: "No lag anywhere: the DECLARE response body itself already carries insolvency_state DECLARED and operational_posture CLOSED, and the very next reads show the cascaded DeliveryOrder already CANCELLED and Bin.held_bushels already back to 0."
        test_recipe:
          setup:
            - "Base chain complete; a REQUESTED DeliveryOrder for the full 949 bushels on a 2026-08-20 appointment holds 949 bushels in bin B1."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /delivery-orders"
              payload:
                receipt_id: "${rc_id}"
                requested_bushels: 949
                appointment_start_at: "2026-08-20T09:00:00Z"
                appointment_end_at: "2026-08-20T11:00:00Z"
              as: Depositor
              as_user_id: "${dep_id}"
              captures: { do_ic_id: $.data.id }
          trigger:
            - call: "POST /warehouses/${wh_id}/insolvency"
              payload: { action: "DECLARE", insolvency_price_cents_per_bushel: 400, note: "receivership" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "GET /delivery-orders/${do_ic_id}"
              payload: {}
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "GET /bins/${bin_id}"
              payload: {}
              as: StateRegulator
              as_user_id: "reg-001"
          assert:
            - "Call 1 response body: data.insolvency_state == DECLARED, data.operational_posture == CLOSED, data.insolvency_price_cents_per_bushel == 400, data.insolvency_declared_at == 2026-08-05T08:00:00Z"
            - "Call 1 response body: data.license_state == LICENSED (the licensing dimension is untouched)"
            - "Call 2: data.delivery_state == CANCELLED"
            - "Call 3: data.held_bushels == 0 and data.stored_bushels == 949 and data.available_bushels == 949"
            - "GET /warehouses/${wh_id}/position-summary read immediately after reports operational_posture CLOSED"
