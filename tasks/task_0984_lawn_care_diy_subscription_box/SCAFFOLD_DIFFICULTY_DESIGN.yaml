  # ---------------------------------------------------------------- Rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: claim_reship_cascade_depth3
        grounds:
          - state_machines.SatisfactionClaim.FILED_to_RESOLVED
          - state_machines.ShipmentBox
          - state_machines.AddOnOrder.QUOTED_to_CONFIRMED
        distinguishing_aspect: |
          Depth-3 chain triggered by claim resolution: RESHIP creates the
          replacement ShipmentBox (1), that box creation attaches the unattached
          CONFIRMED AddOnOrder (2), and the attach mutation recomputes the box's
          provisional_charge_cents (3). Each link is caused by the previous link;
          the trigger (POST /api/claims/{id}/resolve) differs from the cancel
          trigger of the second cascade instance.
        test_recipe:
          setup:
            - "ACTIVE subscription; box DELIVERED (lines FERT-01 x2) at clock 2026-06-05; claim FILED on it"
