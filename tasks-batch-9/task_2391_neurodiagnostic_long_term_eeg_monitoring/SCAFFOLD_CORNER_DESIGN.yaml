              payload: { patient_id: "${patient_id}", requested_setting: "AMBULATORY_VEEG", requested_days: 3 }
              as: UnitCoordinator
              captures: { auth_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/submit"
              payload: {}
              as: UnitCoordinator
          trigger:
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/payer-decision"
              payload: { outcome: "PEND", payer_note: "need seizure diary" }
              as: PayerReviewer
            - call: "GET /neurodiagnostics/authorizations/${auth_id}"
              payload: {}
              as: UnitCoordinator
          assert:
            - "first trigger call: HTTP status 200"
            - "second trigger call: HTTP status 200"
            - "AuthorizationRequest.${auth_id}.version == 3"
            - "AuthorizationRequest.${auth_id}.status == PENDED and payer_note == 'need seizure diary'"
            - "AuthorizationRequest.${auth_id}.resubmission_count == 0"
            - "AuthorizationRequest.${auth_id}.authorized_days == 0, authorized_setting == NULL, days_available == 0"

