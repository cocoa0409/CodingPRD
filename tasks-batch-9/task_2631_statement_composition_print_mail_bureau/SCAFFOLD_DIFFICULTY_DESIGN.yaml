  - rule_id: cross_entity_state_dependency
    instances:

      - name: job_scheduling_depends_on_dr_site_readiness_state
        grounds:
          - state_machines.CompositionJob.PRESORTED_to_SCHEDULED
          - calculations.dr_site_readiness
          - validations.priority_55_ERR_DR_SITE_NOT_READY
          - entities.Client.fields.dr_readiness_required
        distinguishing_aspect: |
          The pair is (CompositionJob, DrSite): a byte-identical schedule request is refused while the
          never-drilled site reads UNTESTED and accepted after a single PASS drill, with nothing about
          the job, press line or window changing between the two calls — so the gate is proven to read
          the other entity's derived state rather than any local field.
        test_recipe:
          setup:
            - "Client CL-DR keeps dr_readiness_required true."
            - "The single DrSite DR-EAST is created with replication_lag_minutes 5 (well inside MAX_REPLICATION_LAG_MINUTES 15) but is NEVER drilled, so last_drill_at is null and readiness_status reads UNTESTED."
            - "ACTIVE template T-DR: FIRST_CLASS, sheets_per_document 1, no inserts; two hygienic records in postal_code 30301; PressLine PL-DR has daily_sheet_capacity 9000 and all capabilities so no capacity, capability or window rule can fire."
            - "The job is PRESORTED and the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/dr-sites"
              payload: { site_code: "DR-EAST", replication_lag_minutes: 5 }
              as: BureauAdmin
              captures: { dr_site_id: "$.data.id", dr_status_untested: "$.data.readiness_status", dr_valid_null: "$.data.readiness_valid_until" }
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-DR", name: "Drummond Life Assurance", dr_readiness_required: true }
              as: BureauAdmin
              captures: { dr_client_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${dr_client_id}", template_code: "T-DR", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { dr_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${dr_template_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/data-files"
              payload: { client_id: "${dr_client_id}", file_name: "dr-cycle-01.csv", format_spec_code: "DELIMITED", declared_record_count: 2, declared_control_total_cents: 24000 }
              as: ClientLiaison
              captures: { dr_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${dr_file_id}", account_ref: "ACC1701", sequence_no: 1, statement_amount_cents: 12000, address_line1: "70 Drummond Avenue", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "6601" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${dr_file_id}", account_ref: "ACC1702", sequence_no: 2, statement_amount_cents: 12000, address_line1: "72 Drummond Avenue", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "6602" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${dr_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${dr_file_id}/control-check"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-DR", capabilities: ["DUPLEX", "COLOR", "INSERT"], sheets_per_hour: 600, daily_sheet_capacity: 9000, changeover_buffer_minutes: 30 }
              as: BureauAdmin
              captures: { dr_line_id: "$.data.id" }
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${dr_file_id}", template_id: "${dr_template_id}", rush_requested: false }
              as: CompositionOperator
              as_user_id: "op-1"
              captures: { dr_job_id: "$.data.id" }
            - call: "POST /bureau/composition-jobs/${dr_job_id}/presort"
              payload: {}
              as: CompositionOperator
          trigger:
            - call: "POST /bureau/composition-jobs/${dr_job_id}/schedule"
              payload: { window_start: "2026-08-04T09:00:00Z", press_line_id: "${dr_line_id}" }
              as: ProductionScheduler
              captures: { dr_err: "$.data.error_id" }
            - call: "POST /bureau/dr-sites/${dr_site_id}/drills"
              payload: { result: "PASS" }
              as: BureauAdmin
              captures: { dr_status_ready: "$.data.readiness_status", dr_valid_until: "$.data.readiness_valid_until", dr_drills: "$.data.drill_count" }
            - call: "POST /bureau/composition-jobs/${dr_job_id}/schedule"
              payload: { window_start: "2026-08-04T09:00:00Z", press_line_id: "${dr_line_id}" }
              as: ProductionScheduler
              captures: { dr_run_id: "$.data.id" }
          assert:
            - "Before the drill: ${dr_status_untested} == UNTESTED and ${dr_valid_null} is null, even though replication_lag_minutes is a healthy 5"
            - "First schedule returns HTTP 409 with ${dr_err} == ERR_DR_SITE_NOT_READY, and CompositionJob.${dr_job_id}.status stays PRESORTED"
            - "After the drill: ${dr_status_ready} == READY, ${dr_valid_until} == 2026-08-31T00:00:00Z (2026-08-01T00:00:00Z + 720 hours), ${dr_drills} == 1 and DrSite.${dr_site_id}.last_drill_result == PASS"
            - "The identical second schedule returns HTTP 201: PrintRun.${dr_run_id}.status == PLANNED, window_start == 2026-08-04T09:00:00Z, window_end == 2026-08-04T10:00:00Z, planned_sheet_count == 2"
            - "CompositionJob.${dr_job_id}.status == SCHEDULED and PressLine.${dr_line_id}.committed_sheet_count == 2"
            - "Nothing about the job changed between the two calls: only the DrSite row was written, and DrSite.${dr_site_id}.replication_lag_minutes is still 5"

      - name: batch_seal_depends_on_composition_job_verified_state
        grounds:
          - state_machines.PresortBatch.OPEN_to_SEALED
          - validations.priority_23_ERR_JOB_INVALID_STATE
          - state_machines.CompositionJob.PRINTED_to_VERIFIED
          - calculations.one_to_one_integrity_reconciliation
        distinguishing_aspect: |
          A different pair, (PresortBatch, CompositionJob): the batch itself is already OPEN and fully
          funded, so the only thing standing between it and SEALED is its parent job's integrity state
          — the seal is refused at PRINTED and succeeds unchanged once reconcile-integrity promotes the
          job to VERIFIED, which is the mail-piece integrity gate expressed as a postage control.
