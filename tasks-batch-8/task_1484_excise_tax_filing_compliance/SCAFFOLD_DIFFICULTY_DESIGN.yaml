# =============================================================================
# §1.8 Scaffold Difficulty Design — Excise Tax Filing & Compliance
# 9 rules x 3 instances = 27 instances. Every recipe starts from empty DB.
# Logical clock default: 2026-08-01T00:00:00Z (no set call needed for it).
# Canonical base chain abbreviations are expanded inline in every instance.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: event_tax_standard_vs_default_assessment
        grounds:
          - calculations.event_tax_determination
          - state_machines.BondedMovement.IN_TRANSIT_to_DEFAULTED
          - entities.TaxableEvent.fields.determination
        distinguishing_aspect: |
          Same quantity (400 units) of the same product class in the same jurisdiction yields
          9720 cents under the STANDARD variant (own-class rate 24300 mc) but 24660 cents under
          the DEFAULT_ASSESSMENT variant (punitive 1.5x the jurisdiction max rate 41100 -> 61650 mc):
          the dual variant lives on the TaxableEvent domain.
        test_recipe:
          setup:
            - "Jurisdiction CA-BOE (MONTHLY/SEMI_MONTHLY); classes DIESEL@24300mc and GASOLINE@41100mc both effective 2026-01-01 open-ended"
            - "Registrant with ACTIVE registration (SAFE_HARBOR) bonded at 1500000 cents"
            - "A STANDARD event of 400 DIESEL rated; a 400-unit DIESEL bonded movement defaulted after its 30-day transit deadline"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "GASOLINE", description: "Gasoline", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_g: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_g}", rate_millicents_per_unit: 41100, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 400 }, as: TaxAnalyst, captures: { ev_std: $.data.id } }
            - { call: "POST /taxable-events/${ev_std}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev_std}/rate", payload: {}, as: TaxAnalyst }
            - { call: "POST /bonded-movements", payload: { registration_id: "${rgn}", bond_id: "${bnd}", product_class_id: "${pc_d}", quantity_units: 400, origin_facility: "TERM-A", destination_facility: "TERM-B" }, as: TaxAnalyst, captures: { mvt: $.data.id } }
            - { call: "POST /bonded-movements/${mvt}/dispatch", payload: {}, as: TaxAnalyst }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "GET /taxable-events", payload: { bonded_movement_id: "${mvt}" }, as: TaxAnalyst, captures: { ev_def_tax: "$.data[0].tax_cents", ev_def_det: "$.data[0].determination" } }
            - { call: "GET /taxable-events/${ev_std}", payload: {}, as: TaxAnalyst, captures: { ev_std_tax: $.data.tax_cents } }
          assert:
            - "TaxableEvent.${ev_std}.tax_cents == 9720 (round_half_up(400 * 24300 / 1000); STANDARD variant)"
            - "default event for movement ${mvt}: determination == DEFAULT_ASSESSMENT and tax_cents == 24660 (punitive rate round_half_up(1.5 * 41100) = 61650 mc; round_half_up(400 * 61650 / 1000))"
            - "9720 != 24660 for identical quantity_units == 400 — variant divergence on the TaxableEvent domain"

      - name: deposit_schedule_safe_harbor_vs_actual
        grounds:
          - calculations.deposit_schedule
          - entities.Registration.fields.deposit_method
          - entities.Deposit.fields.scheduled_amount_cents
        distinguishing_aspect: |
          Identical current-period activity (one 24300-cent event on 2026-08-03 in each registration)
          yields depA scheduled 10000 cents under SAFE_HARBOR (floor, prior-blind) but 24300 cents
          under ACTUAL (window events summed at window close): the dual variant lives on the
          Deposit/Registration domain, a different entity domain than event_tax_standard_vs_default_assessment.
        test_recipe:
          setup:
            - "Two jurisdictions CA-BOE and NV-TX, both SEMI_MONTHLY; DIESEL@24300mc effective 2026-01-01 in both"
            - "One registrant with two ACTIVE registrations: CA = SAFE_HARBOR, NV = ACTUAL"
            - "One 1000-unit DIESEL event rated 2026-08-03 in each registration (24300 cents each); both 2026-08 returns auto-created with their deposit schedules"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur_ca: $.data.id } }
            - { call: "POST /jurisdictions", payload: { code: "NV-TX", name: "Nevada", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur_nv: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur_ca}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur_nv}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur_ca}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn_sh: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur_nv}", deposit_method: "ACTUAL" }, as: ComplianceAdmin, captures: { rgn_ac: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn_sh}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd1: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn_ac}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd2: $.data.id } }
            - { call: "POST /bonds/${bnd1}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /bonds/${bnd2}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn_sh}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn_ac}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn_sh}", jurisdiction_id: "${jur_ca}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1000 }, as: TaxAnalyst, captures: { ev1: $.data.id } }
            - { call: "POST /taxable-events/${ev1}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev1}/rate", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn_ac}", jurisdiction_id: "${jur_nv}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1000 }, as: TaxAnalyst, captures: { ev2: $.data.id } }
            - { call: "POST /taxable-events/${ev2}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev2}/rate", payload: {}, as: TaxAnalyst }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "GET /deposits", payload: { registration_id: "${rgn_sh}", period: "2026-08" }, as: TaxAnalyst, captures: { dep_sh_a: "$.data[0].scheduled_amount_cents" } }
            - { call: "GET /deposits", payload: { registration_id: "${rgn_ac}", period: "2026-08" }, as: TaxAnalyst, captures: { dep_ac_a: "$.data[0].scheduled_amount_cents" } }
          assert:
            - "SAFE_HARBOR registration ${rgn_sh} window-A deposit scheduled_amount_cents == 10000 (MIN_DEPOSIT_FLOOR_CENTS; no prior filed return; sweep does not change it)"
            - "ACTUAL registration ${rgn_ac} window-A deposit scheduled_amount_cents == 24300 (sum of window-A event tax at the 2026-08-16 window-close sweep)"
            - "Identical activity, different deposit obligations: 10000 != 24300"

      - name: bond_requirement_standard_vs_aggravated
        grounds:
          - calculations.bond_requirement
          - entities.Registration.fields.requirement_variant
          - entities.Registration.fields.bond_required_cents
        distinguishing_aspect: |
          Two registrations with identical filed liability history (one 486000-cent period each):
          the unblemished one requires max(3 x 486000, 1000000) = 1458000 (STANDARD), while the one
          with a movement default requires max(5 x 486000, 2500000) = 2500000 (AGGRAVATED):
          the dual variant lives on the Registration bond domain, distinct from both the
          TaxableEvent and Deposit domains.
        test_recipe:
          setup:
            - "Jurisdiction CA-BOE; DIESEL@24300mc; registrants R1 and R2 each with an ACTIVE SAFE_HARBOR registration bonded at 3000000"
            - "Each registration has a FILED 2026-08 return with taxable_tax_cents == 486000 (one 20000-unit event)"
            - "R2 additionally has a bonded movement manually defaulted (blemish) after the filing"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "R1 Fuels", fein: "11-1111111" }, as: ComplianceAdmin, captures: { rgt1: $.data.id } }
            - { call: "POST /registrants", payload: { legal_name: "R2 Fuels", fein: "22-2222222" }, as: ComplianceAdmin, captures: { rgt2: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt1}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn1: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt2}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn2: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn1}", surety_name: "SureCo", principal_amount_cents: 3000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd1: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn2}", surety_name: "SureCo", principal_amount_cents: 3000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd2: $.data.id } }
            - { call: "POST /bonds/${bnd1}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /bonds/${bnd2}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn1}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn2}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn1}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 20000 }, as: TaxAnalyst, captures: { ev1: $.data.id } }
            - { call: "POST /taxable-events/${ev1}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev1}/rate", payload: {}, as: TaxAnalyst, captures: { ret1: $.data.return_id } }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn2}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 20000 }, as: TaxAnalyst, captures: { ev2: $.data.id } }
            - { call: "POST /taxable-events/${ev2}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev2}/rate", payload: {}, as: TaxAnalyst, captures: { ret2: $.data.return_id } }
            - { call: "POST /returns/${ret1}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /returns/${ret1}", payload: {}, as: TaxReviewer, captures: { v1: $.data.version } }
            - { call: "POST /returns/${ret1}/file", payload: { expected_return_version: "${v1}" }, as: TaxReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /returns/${ret2}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /returns/${ret2}", payload: {}, as: TaxReviewer, captures: { v2: $.data.version } }
            - { call: "POST /returns/${ret2}/file", payload: { expected_return_version: "${v2}" }, as: TaxReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /bonded-movements", payload: { registration_id: "${rgn2}", bond_id: "${bnd2}", product_class_id: "${pc_d}", quantity_units: 100, origin_facility: "T-A", destination_facility: "T-B" }, as: TaxAnalyst, captures: { mvt2: $.data.id } }
            - { call: "POST /bonded-movements/${mvt2}/dispatch", payload: {}, as: TaxAnalyst }
          trigger:
            - { call: "POST /bonded-movements/${mvt2}/default", payload: {}, as: ComplianceAdmin }
            - { call: "GET /registrations/${rgn1}/bond-status", payload: {}, as: ComplianceAdmin, captures: { r1_req: $.data.bond_required_cents, r1_var: $.data.requirement_variant } }
            - { call: "GET /registrations/${rgn2}/bond-status", payload: {}, as: ComplianceAdmin, captures: { r2_req: $.data.bond_required_cents, r2_var: $.data.requirement_variant } }
          assert:
            - "Registration.${rgn1}: requirement_variant == STANDARD and bond_required_cents == 1458000 (max(3 * 486000, 1000000))"
            - "Registration.${rgn2}: requirement_variant == AGGRAVATED and bond_required_cents == 2500000 (max(5 * 486000, 2500000) — floor binds)"
            - "Identical filed liability (486000 each) produces 1458000 != 2500000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: per_event_rounding_then_sum
        grounds:
          - calculations.event_tax_determination
          - calculations.return_liability_aggregation
          - entities.TaxReturn.fields.gross_tax_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: three 1-unit events at 24300 mc each round to 24 cents
          INDIVIDUALLY (24.3 -> 24) and the return sums to 72; the forbidden sum-then-round
          order would give round_half_up(72.9) = 73. The scaffold pins per-event rounding.
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc; ACTIVE SAFE_HARBOR registration bonded 1500000"
            - "Three 1-unit DIESEL events dated 2026-08-03/04/05, all rated"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1 }, as: TaxAnalyst, captures: { ev1: $.data.id } }
            - { call: "POST /taxable-events/${ev1}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev1}/rate", payload: {}, as: TaxAnalyst, captures: { ret: $.data.return_id } }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-04T00:00:00Z", quantity_units: 1 }, as: TaxAnalyst, captures: { ev2: $.data.id } }
            - { call: "POST /taxable-events/${ev2}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev2}/rate", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-05T00:00:00Z", quantity_units: 1 }, as: TaxAnalyst, captures: { ev3: $.data.id } }
            - { call: "POST /taxable-events/${ev3}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev3}/rate", payload: {}, as: TaxAnalyst }
          trigger:
            - { call: "GET /returns/${ret}", payload: {}, as: TaxAnalyst, captures: { g: $.data.gross_tax_cents, t: $.data.taxable_tax_cents, n: $.data.event_count } }
          assert:
            - "TaxableEvent.${ev1}.tax_cents == 24 and .${ev2}.tax_cents == 24 and .${ev3}.tax_cents == 24 (per-event round_half_up of 24.3)"
            - "TaxReturn.${ret}.gross_tax_cents == 72 and taxable_tax_cents == 72 and event_count == 3 (NOT 73 — sum-then-round is forbidden)"

      - name: late_deposit_penalty_tiered_nonlinear
        grounds:
          - calculations.late_deposit_penalty
          - entities.Deposit.fields.penalty_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (scheduled base, days_late, tier table + daily interest) with
          non-linear interaction: a 10000-cent deposit costs 200 cents at 5 days late (2% tier),
          500 cents at 6 days late (5% tier), and 1100 cents at 20 days late
          (10% = 1000, plus interest round_half_up(10000 * 0.0005 * 20) = 100).
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc; ACTIVE SAFE_HARBOR registration bonded 1500000"
            - "A 2026-08 return exists (one 1000-unit event rated); depA due 2026-08-25 and depB due 2026-09-10, each scheduled 10000"
            - "A second return 2026-09 (one event dated 2026-09-05 rated) with depA due 2026-09-25 scheduled 10000"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1000 }, as: TaxAnalyst, captures: { ev1: $.data.id } }
            - { call: "POST /taxable-events/${ev1}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev1}/rate", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-09-05T00:00:00Z", quantity_units: 1000 }, as: TaxAnalyst, captures: { ev2: $.data.id } }
            - { call: "POST /taxable-events/${ev2}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev2}/rate", payload: {}, as: TaxAnalyst }
            - { call: "GET /deposits", payload: { registration_id: "${rgn}", period: "2026-08" }, as: TaxAnalyst, captures: { depA08: "$.data[0].id", depB08: "$.data[1].id" } }
            - { call: "GET /deposits", payload: { registration_id: "${rgn}", period: "2026-09" }, as: TaxAnalyst, captures: { depA09: "$.data[0].id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /deposits/${depA08}/pay", payload: { amount_cents: 10000 }, as: TaxAnalyst, captures: { pen1: $.data.penalty_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /deposits/${depB08}/pay", payload: { amount_cents: 10000 }, as: TaxAnalyst, captures: { pen2: $.data.penalty_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /deposits/${depA09}/pay", payload: { amount_cents: 10000 }, as: TaxAnalyst, captures: { pen3: $.data.penalty_cents } }
          assert:
            - "Deposit.${depA08}.penalty_cents == 200 (5 days late: 2% tier, boundary-inclusive)"
            - "Deposit.${depB08}.penalty_cents == 500 (6 days late: 5% tier)"
            - "Deposit.${depA09}.penalty_cents == 1100 (20 days late: 10% = 1000 plus interest round_half_up(10000 * 0.0005 * 20) = 100)"

      - name: return_settlement_pinned_evaluation_order
        grounds:
          - calculations.return_settlement
          - entities.TaxReturn.fields.net_due_cents
          - entities.Deposit.fields.applied_amount_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: deposits_applied caps at (taxable_tax - credits)
          BEFORE penalty is computed, so penalty can never feed back into the deposit cap. With
          tax 100000 and depA paid 100500: applied = min(100500, 100000) = 100000, penalty = 0,
          net_due = 0, excess 500 to overpayment — an implementation that caps deposits at
          post-penalty net_due (or applies penalty before the waterfall) computes different numbers.
        test_recipe:
          setup:
            - "CA-BOE; SPIRITS@25000mc; ACTIVE SAFE_HARBOR registration bonded 1500000"
            - "One 4000-unit SPIRITS event rated (tax 100000); return 2026-08 DRAFT with depA/depB scheduled 10000 each"
            - "depA overpaid at 100500 cents; depB left unpaid"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "SPIRITS", description: "Distilled spirits", base_unit: "PROOF_GALLON" }, as: ComplianceAdmin, captures: { pc_s: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_s}", rate_millicents_per_unit: 25000, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Spirits", fein: "33-3333333" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_s}", event_date: "2026-08-03T00:00:00Z", quantity_units: 4000 }, as: TaxAnalyst, captures: { ev: $.data.id } }
            - { call: "POST /taxable-events/${ev}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst, captures: { ret: $.data.return_id } }
            - { call: "GET /deposits", payload: { registration_id: "${rgn}", period: "2026-08" }, as: TaxAnalyst, captures: { depA: "$.data[0].id" } }
            - { call: "POST /deposits/${depA}/pay", payload: { amount_cents: 100500 }, as: TaxAnalyst }
            - { call: "POST /returns/${ret}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxReviewer, captures: { v: $.data.version } }
          trigger:
            - { call: "POST /returns/${ret}/file", payload: { expected_return_version: "${v}" }, as: TaxReviewer, as_user_id: "reviewer-1", captures: { nd: $.data.net_due_cents, pen: $.data.penalty_cents, da: $.data.deposits_applied_cents, ss: $.data.settlement_status } }
            - { call: "GET /deposits/${depA}", payload: {}, as: TaxAnalyst, captures: { dep_applied: $.data.applied_amount_cents, dep_status: $.data.status } }
            - { call: "GET /registrants/${rgt}", payload: {}, as: TaxAnalyst, captures: { over: $.data.overpayment_balance_cents } }
          assert:
            - "TaxReturn.${ret}: deposits_applied_cents == 100000 (capped at taxable_tax - credits = 100000 - 0, NOT at paid 100500)"
            - "TaxReturn.${ret}.penalty_cents == 0 (applied 100000 >= ceil(0.9 * 100000) = 90000)"
            - "TaxReturn.${ret}.net_due_cents == 0 and settlement_status == SETTLED"
            - "Deposit.${depA}.applied_amount_cents == 100000 and status == APPLIED"
            - "Registrant.${rgt}.overpayment_balance_cents == 500 (100500 paid - 100000 applied)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: taxable_event_rerate_and_amendment_cycle
        grounds:
          - state_machines.TaxableEvent.RATED_to_CLASSIFIED
          - state_machines.TaxableEvent.RETURNED_to_ADJUSTED
          - state_machines.TaxableEvent.ADJUSTED_to_RETURNED
        distinguishing_aspect: |
          TaxableEvent is cyclic in two places: RATED -> CLASSIFIED -> RATED (pre-filing
          correction loop) and RETURNED -> ADJUSTED -> RATED -> RETURNED (amendment loop);
          the event ends RETURNED only after the amendment files.
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc; ACTIVE registration bonded 1500000"
            - "One 1000-unit event rated into the 2026-08 return; return filed (net 26740 incl. 2430 underpayment penalty); amendment opened"
