          intersection) from the visit overlap rule.
        test_recipe:
          setup:
            - "Term SELF_STUDY; window opens 2026-10-01T00:00:00Z, closes 2026-11-01T00:00:00Z"
            - "Response at opens_at (2026-10-01T00:00:00Z) accepted; response at closes_at rejected"
