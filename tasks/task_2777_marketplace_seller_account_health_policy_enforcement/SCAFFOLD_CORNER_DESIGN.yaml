              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { ev: $.data.id, ev_count: $.data.input_snapshot_count, ev_odr: $.data.odr_final }
          assert:
            - "HTTP 201"
            - "${ev_count} == 2   # EVAL_MAX_SNAPSHOTS, never 3"
            - "${ev_odr} == 0.0050   # 10 / 2000; including S_old would give 0.1700"
            - "HealthEvaluation.${ev}.odr_provisional == 0.0050 and HealthEvaluation.${ev}.odr_variant_delta == 0.0000"
            - "HealthEvaluation.${ev}.order_volume_final == 2000"
            - "HealthEvaluation.${ev}.input_window_start == 2026-05-10T00:00:00.000Z   # the surviving set's earliest window_start"
            - "HealthEvaluation.${ev}.input_window_end == 2026-07-20T00:00:00.000Z"
            - "HealthEvaluation.${ev}.health_score == 100.00 and HealthEvaluation.${ev}.metric_tier == HEALTHY"
            - "HealthEvaluation.${ev}.breached_metrics == []"
            - "snapshot list for ${s_id}: total_count == 3   # all three rows are still stored"

      - name: calc_related_account_score_caps_at_one_with_signals_in_fixed_order
        claim_type: weighted_scoring
        grounds:
          - "calculations.related_account_confidence_score.formula"
          - "calculations.related_account_confidence_score.constants.SIGNAL_WEIGHT"
          - "calculations.related_account_confidence_score.constants.RELATED_LINK_WATCH_SCORE"
          - "entities.Seller.fields.root_seller_id"
        distinguishing_aspect: |
          All five signals match, so the raw weight sum is 0.35+0.45+0.15+0.10+0.20 = 1.25 and the
          stored confidence_score must be the CAPPED 1.00. matched_signals is emitted in the fixed
          order TAX_ID, BANK_TOKEN, ADDRESS, EMAIL_DOMAIN, DEVICE regardless of which comparison the
          implementation runs first. The score clears RELATED_LINK_WATCH_SCORE 0.60, yet the
          incumbent was ACTIVE at detection, so registration_risk_flag stays false and the
          candidate stays ACTIVE / NORMAL — while root_seller_id IS still populated, because it
          comes from the top link's existence, not from the risk flag.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "Incumbent seller A registered with tax_id_hash TAX-SHARED, payout_bank_token BANK-SHARED, address_fingerprint ADDR-SHARED, email ops@harbor-tools.example, device_fingerprint DEV-SHARED; A is left ACTIVE."
            - "Candidate seller B registers with the identical five signals and a different local part on the same private domain."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-SHARED", payout_bank_token: "BANK-SHARED", address_fingerprint: "ADDR-SHARED", device_fingerprint: "DEV-SHARED" }
              as: Anonymous
              captures: { s_a: $.data.id }
          trigger:
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools Outlet LLC", email: "outlet@harbor-tools.example", tax_id_hash: "TAX-SHARED", payout_bank_token: "BANK-SHARED", address_fingerprint: "ADDR-SHARED", device_fingerprint: "DEV-SHARED" }
              as: Anonymous
              captures: { s_b: $.data.id }
            - call: "GET /related-account-links"
              payload: { candidate_seller_id: "${s_b}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { link_id: "$.data[0].id", link_score: "$.data[0].confidence_score" }
          assert:
            - "HTTP 201 on the candidate registration"
            - "link list: total_count == 1"
            - "${link_score} == 1.00   # min(1.25, 1.00), not 1.25"
            - "RelatedAccountLink.${link_id}.matched_signals == [TAX_ID, BANK_TOKEN, ADDRESS, EMAIL_DOMAIN, DEVICE]"
            - "RelatedAccountLink.${link_id}.candidate_seller_id == ${s_b} and matched_seller_id == ${s_a}"
            - "RelatedAccountLink.${link_id}.matched_seller_state_at_detection == ACTIVE"
            - "RelatedAccountLink.${link_id}.state == DETECTED and detected_at == 2026-08-01T00:00:00.000Z"
            - "Seller.${s_b}.root_seller_id == ${s_a}   # populated from the top link even without a risk flag"
            - "Seller.${s_b}.registration_risk_flag == false   # the incumbent was ACTIVE, not BANNED or SUSPENDED"
            - "Seller.${s_b}.enforcement_state == ACTIVE and Seller.${s_b}.disbursement_state == NORMAL"
            - "Seller.${s_a} is unchanged: enforcement_state ACTIVE, version 1"
            - "no REGISTRATION_FLAGGED Notification was emitted"

      - name: calc_public_email_domain_is_not_a_signal_and_min_score_gates_the_link
        claim_type: constants_applied
        grounds:
          - "calculations.related_account_confidence_score.constants.PUBLIC_EMAIL_DOMAINS"
          - "calculations.related_account_confidence_score.constants.RELATED_LINK_MIN_SCORE"
          - "calculations.related_account_confidence_score.constants.SIGNAL_WEIGHT"
        distinguishing_aspect: |
          Two constants decide two different registrations against the same incumbent. B shares the
          incumbent's tax_id_hash AND its gmail.com email domain, but gmail.com is in
          PUBLIC_EMAIL_DOMAINS, so EMAIL_DOMAIN is not counted: the score is 0.35, not 0.45, and
          matched_signals is [TAX_ID] alone. C shares only the address fingerprint: 0.15 is below
          RELATED_LINK_MIN_SCORE 0.35, so NO link row is minted at all — proving the threshold is a
          gate on row creation, not just on the risk flag.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "Incumbent A: tax_id_hash TAX-PUB, payout_bank_token BANK-A, address_fingerprint ADDR-PUB, email a.harbor@gmail.com (public domain), no device_fingerprint."
            - "Candidate B: same tax_id_hash TAX-PUB, own bank token and address, email b.harbor@gmail.com — TAX_ID 0.35 counts, EMAIL_DOMAIN does not."
            - "Candidate C: same address_fingerprint ADDR-PUB only — ADDRESS 0.15 < RELATED_LINK_MIN_SCORE 0.35."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "a.harbor@gmail.com", tax_id_hash: "TAX-PUB", payout_bank_token: "BANK-A", address_fingerprint: "ADDR-PUB" }
              as: Anonymous
              captures: { s_a: $.data.id }
          trigger:
            - call: "POST /sellers"
              payload: { legal_name: "Beacon Hardware LLC", email: "b.harbor@gmail.com", tax_id_hash: "TAX-PUB", payout_bank_token: "BANK-B", address_fingerprint: "ADDR-B" }
              as: Anonymous
              captures: { s_b: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Cedar Fasteners LLC", email: "ops@cedar-fasteners.example", tax_id_hash: "TAX-C", payout_bank_token: "BANK-C", address_fingerprint: "ADDR-PUB" }
              as: Anonymous
              captures: { s_c: $.data.id }
            - call: "GET /related-account-links"
              payload: { candidate_seller_id: "${s_b}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { link_b: "$.data[0].id", score_b: "$.data[0].confidence_score" }
            - call: "GET /related-account-links"
              payload: { candidate_seller_id: "${s_c}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "HTTP 201 on both registrations"
            - "B link list: total_count == 1"
            - "${score_b} == 0.35   # TAX_ID only; the shared gmail.com domain is excluded"
            - "RelatedAccountLink.${link_b}.matched_signals == [TAX_ID]"
            - "C link list: total_count == 0   # 0.15 is below RELATED_LINK_MIN_SCORE, so no row is minted"
            - "Seller.${s_b}.root_seller_id == ${s_a} and Seller.${s_b}.registration_risk_flag == false"
            - "Seller.${s_c}.root_seller_id == null and Seller.${s_c}.registration_risk_flag == false"
            - "Seller.${s_b}.enforcement_state == ACTIVE and Seller.${s_c}.enforcement_state == ACTIVE"

      - name: calc_rolling_reserve_uses_the_tier_two_percentage
        claim_type: tiered_pricing
        grounds:
          - "calculations.reserve_requirement_cents.constants.RESERVE_ROLLING_PCT"
          - "calculations.risk_tier.formula"
          - "endpoints[POST /disbursement-holds].side_effects"
        distinguishing_aspect: |
          risk_tier is what selects the reserve percentage, and it can be driven by the METRIC
          dimension alone: a seller with a 0.00 point balance but metric_tier AT_RISK is TIER_2, so
          a ROLLING reserve is 20% of the balance (40000 of 200000) rather than the TIER_1 10%
          (20000) or the TIER_3 30% (60000). The tier is snapshotted onto the hold row so a later
          metric change cannot restate the reserve.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-RES-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false)."
            - "One seller credited 200000 cents."
            - "Two snapshots produce the AT_RISK evaluation of §1.9 entities.computed_fields: [2026-05-01, 2026-06-01) all-clean 1000 orders and [2026-07-01, 2026-08-01) 1000 orders with 30 substantiated claims -> odr_final 0.0150 -> health_score 78.75 -> AT_RISK."
            - "A violation is opened for investigation so disbursement_state is RESERVE_HELD and an explicit reserve is authorised; the seller's severity_points_balance is still 0.00 and enforcement_state is still ACTIVE."
            - "risk_tier: balance 0.00 (< 4.00) but metric_tier AT_RISK -> TIER_2 -> RESERVE_ROLLING_PCT 0.20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-RES-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 200000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-05-01T00:00:00.000Z", window_end: "2026-06-01T00:00:00.000Z", order_volume: 1000, delivered_or_refunded_volume: 1000, defect_claims_pending: 0, defect_claims_substantiated: 0, late_shipments: 0, pre_fulfillment_cancellations: 0, shipments_total: 1000, shipments_with_valid_tracking: 1000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 1000, delivered_or_refunded_volume: 1000, defect_claims_pending: 0, defect_claims_substantiated: 30, late_shipments: 0, pre_fulfillment_cancellations: 0, shipments_total: 1000, shipments_with_valid_tracking: 1000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers/${s_id}/health-evaluations"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { ev_tier: $.data.metric_tier }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-RES-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-01T00:00:00.000Z", coverage_end: "2026-08-20T00:00:00.000Z", expected_seller_version: "${sv}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { h1: $.data.id, h1_amount: $.data.held_amount_cents, h1_tier: $.data.risk_tier }
          assert:
            - "${ev_tier} == AT_RISK"
            - "HTTP 201"
            - "${h1_tier} == TIER_2   # from metric_tier AT_RISK, with a 0.00 point balance"
            - "${h1_amount} == 40000   # round_half_up(200000 x 0.20); TIER_1 would give 20000 and TIER_3 60000"
            - "DisbursementHold.${h1}.hold_type == RESERVE and reserve_basis == ROLLING and auto_created == false"
            - "DisbursementHold.${h1}.state == ACTIVE and enforcement_action_id == null"
            - "Seller.${s_id}.available_balance_cents == 160000 and Seller.${s_id}.held_balance_cents == 40000"
            - "Seller.${s_id}.lifetime_credited_cents == 200000 and Seller.${s_id}.lifetime_debited_cents == 0"
            - "Seller.${s_id}.severity_points_balance == 0.00 and Seller.${s_id}.enforcement_state == ACTIVE"
            - "a FUNDS_HELD Notification exists for ${s_id} with amount_cents 40000"

      - name: calc_evaluation_with_an_empty_input_set_is_rejected
        claim_type: input_set_filtering
        grounds:
          - "calculations.order_defect_rate.input_set (S empty -> 422)"
          - "validations.priority_110"
          - "errors[ERR_NO_SNAPSHOTS_IN_WINDOW]"
        distinguishing_aspect: |
          An empty input set is a refusal, not a zero-valued evaluation: the seller HAS a snapshot,
          but its window_end 2026-04-01 falls outside the 90-day lookback from 2026-08-01, so S is
          empty and the request fails with ERR_NO_SNAPSHOTS_IN_WINDOW (422). No HealthEvaluation row
          is created, the seller's health_score / metric_tier stay null (they are NOT reset to
          100.00 / HEALTHY) and the seller's version does not move.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; the lookback boundary is 2026-05-03T00:00:00.000Z."
            - "One snapshot [2026-03-01, 2026-04-01) with ordinary counters — the only snapshot the seller has."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-03-01T00:00:00.000Z", window_end: "2026-04-01T00:00:00.000Z", order_volume: 500, delivered_or_refunded_volume: 500, defect_claims_pending: 1, defect_claims_substantiated: 1, late_shipments: 2, pre_fulfillment_cancellations: 1, shipments_total: 500, shipments_with_valid_tracking: 500 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /sellers/${s_id}/health-evaluations"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { err_code: $.data.error_id }
            - call: "GET /health-evaluations"
              payload: { seller_id: "${s_id}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
          assert:
            - "HTTP 422 and ${err_code} == ERR_NO_SNAPSHOTS_IN_WINDOW"
            - "evaluation list: total_count == 0   # no row was created"
            - "Seller.${s_id}.health_score == null and Seller.${s_id}.metric_tier == null"
            - "Seller.${s_id}.open_defect_claim_units == 1   # set by the snapshot itself, untouched by the refused evaluation"
            - "Seller.${s_id}.version == 2   # 1 at registration + 1 for the snapshot; the refused evaluation did not bump it"

      - name: calc_odr_two_variants_diverge_on_the_same_snapshot_set
        claim_type: variant_divergence
        grounds:
          - "calculations.order_defect_rate.variants"
        excluded_because:
          difficulty_instance: dual_variant_calc / odr_provisional_vs_final_diverge_on_two_snapshot_window
          rationale: "That §1.8 instance computes both variants on one fixture and asserts the non-zero odr_variant_delta."

      - name: calc_odr_variant_delta_is_disclosed_alongside_the_tier_input
        claim_type: reconciliation
        grounds:
          - "calculations.order_defect_rate.formula (odr_variant_delta)"
          - "entities.HealthEvaluation.fields.odr_variant_delta"
        excluded_because:
          difficulty_instance: dual_variant_calc / odr_provisional_vs_final_diverge_on_two_snapshot_window
          rationale: "There is no deferred provisional-to-final switch in this domain — both variants are computed in the same evaluation and reconciled through odr_variant_delta, which that §1.8 instance asserts."

      - name: calc_reserve_basis_selects_between_two_defensible_amounts
        claim_type: variant_selection
        grounds:
          - "calculations.reserve_requirement_cents.variants"
        excluded_because:
          difficulty_instance: dual_variant_calc / reserve_rolling_vs_claim_exposure_diverge_on_identical_seller_state
          rationale: "That §1.8 instance creates both bases against the same seller state and asserts the two different cent figures."

      - name: calc_health_penalties_are_rounded_per_component
        claim_type: precision
        grounds:
          - "calculations.health_score.precision"
          - "calculations.health_score.formula (pinned evaluation order)"
        excluded_because:
          difficulty_instance: combinatorial_formula / health_score_penalty_rounding_pinned_per_component
          rationale: "That §1.8 instance is built specifically to separate per-component rounding from sum-then-round."

      - name: calc_ladder_rung_is_selected_from_the_post_balance
        claim_type: threshold
        grounds:
          - "calculations.enforcement_ladder_rung.formula (pinned evaluation order)"
        excluded_because:
          difficulty_instance: combinatorial_formula / ladder_rung_read_from_post_balance_not_prior_balance
          rationale: "That §1.8 instance pins the prior_balance / post_balance ordering and shows the milder rung produced by the wrong reading."

      - name: calc_severity_points_single_rounding_and_repeat_cap
        claim_type: constants_applied
        grounds:
          - "calculations.severity_points_applied.precision"
          - "calculations.severity_points_applied.constants.REPEAT_CAP_COUNT"
          - "calculations.severity_points_applied.constants.SEVERITY_MAX_POINTS"
        excluded_because:
          difficulty_instance: combinatorial_formula / severity_points_single_rounding_with_capped_repeat_factor
          rationale: "That §1.8 instance drives the repeat factor past REPEAT_CAP_COUNT and asserts the single rounding plus the 12.00 clamp."

      - name: calc_odr_breach_threshold_boundary_triple
        claim_type: threshold
        grounds:
          - "calculations.metric_tier.formula"
          - "calculations.order_defect_rate.precision"
        excluded_because:
          difficulty_instance: boundary_precision_check / odr_exactly_at_breach_threshold_breaches_and_one_unit_below_does_not
          rationale: "That §1.8 instance tests the rounded rate at, just below and just above ODR_BREACH_RATE."

      - name: calc_snapshot_windows_are_half_open_intervals
        claim_type: interval_merge
        grounds:
          - "validations.priority_110 (snapshot window geometry)"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / snapshot_half_open_windows_touch_legally_but_overlap_is_rejected_per_source
          rationale: "That §1.8 instance asserts touching endpoints are legal, a one-second intrusion is not, and the partition is per (seller, source)."

      - name: calc_hold_coverage_intervals_are_closed_with_a_buffer
        claim_type: interval_merge
        grounds:
          - "calculations.reserve_requirement_cents.constants.HOLD_BUFFER_HOURS"
          - "validations.priority_110 (hold coverage geometry)"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / hold_coverage_closed_intervals_require_buffer_separation
          rationale: "That §1.8 instance asserts the closed-interval plus buffer geometry against ACTIVE holds only."

      - name: calc_posture_recompute_propagates_to_a_fixed_point
        claim_type: constraint_propagation
        grounds:
          - "calculations.enforcement_state_target"
          - "calculations.disbursement_state_target"
        excluded_because:
          difficulty_instance: transitive_cascade / suspension_cascade_walks_listings_posture_holds_and_balances
          rationale: "That §1.8 instance follows balance -> enforcement_state -> disbursement_state -> holds in the pinned order and asserts the settled fixed point."

  # =========================================================================
  # SECTION 4 — Validations (§1.4)
  # =========================================================================
  - section: validations
    instances:

      - name: validation_ip_rule_admits_only_a_rights_owner_reporter
        claim_type: conditional_validation
        grounds:
          - "validations.priority_130 (ERR_REPORTER_NOT_ELIGIBLE)"
          - "entities.Violation.fields.reporter_type"
        distinguishing_aspect: |
          The reporter-eligibility gate is conditional on the cited rule's category: a BUYER report
          against an INTELLECTUAL_PROPERTY rule is refused, the identical BUYER report against a
          LISTING_ACCURACY rule is accepted, and a RIGHTS_OWNER report against the IP rule is
          accepted. All three requests are otherwise identical, so nothing but the
          category/reporter_type pairing can explain the divergence. The accepted violations land in
          REPORTED, not UNDER_INVESTIGATION, so the seller's disbursement_state stays NORMAL.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule IP-ELIG-1 (INTELLECTUAL_PROPERTY, base 3.00, ACCOUNT, requires_poa false) and PolicyRule LA-ELIG-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false)."
            - "One seller with no prior violations."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "IP-ELIG-1", category: "INTELLECTUAL_PROPERTY", base_severity_weight: 3.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_ip: $.data.id }
            - call: "POST /policy-rules"
              payload: { code: "LA-ELIG-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_ip}", reporter_type: "BUYER", evidence_reference: "EV-ELIG-0001" }
              as: PolicyInvestigator
