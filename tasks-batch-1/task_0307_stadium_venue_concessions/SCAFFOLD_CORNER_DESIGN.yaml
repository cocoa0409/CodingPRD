      - name: expire_lot_not_yet_expired_returns_error
        claim_type: Temporal validation
        grounds: ["validations[priority=11]", "errors[ERR_LOT_NOT_EXPIRED]"]
        distinguishing_aspect: "Running expire-lots when no lot's expires_at is at/before the clock leaves the sweep with nothing expired; a lot with a future expires_at is not expired and any direct attempt is rejected ERR_LOT_NOT_EXPIRED — here the stand has only a future-dated lot, so the sweep makes no change and the future lot stays ACTIVE."
        test_recipe:
          setup: ["Clock at 2026-07-23T17:00:00Z; stand with a single bun lot expiring at 2026-07-23T22:00:00Z (future)."]
