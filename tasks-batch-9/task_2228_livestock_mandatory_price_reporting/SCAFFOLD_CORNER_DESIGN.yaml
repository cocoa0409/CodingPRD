              as: MarketAnalyst
            - call: "GET /reporting-windows/${win_1}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_2: $.data.version }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_2}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { sub_1: $.data.id }
            - call: "POST /submissions/${sub_1}/transactions"
              payload: { purchase_type: "NEGOTIATED", head_count: 100, avg_net_price_per_cwt: 280.00, avg_carcass_weight_cwt: 8.00 }
              as: ReporterAgent
              as_user_id: "${ent_a}"
            - call: "POST /submissions/${sub_1}/submit"
              payload: {}
              as: ReporterAgent
              as_user_id: "${ent_a}"
            - call: "POST /submissions/${sub_1}/review"
              payload: { decision: "ACCEPT", review_note: "clean" }
              as: MarketAnalyst
          trigger:
            - call: "GET /reporting-windows/${win_1}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_3: $.data.version }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_3}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { s1: $.data.error_id }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_3}", supersedes_submission_id: "${sub_rej}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { s2: $.data.error_id }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_3}", supersedes_submission_id: "${sub_1}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { sub_2: $.data.id }
            - call: "POST /submissions/${sub_2}/transactions"
              payload: { purchase_type: "NEGOTIATED", head_count: 120, avg_net_price_per_cwt: 282.00, avg_carcass_weight_cwt: 8.10 }
              as: ReporterAgent
              as_user_id: "${ent_a}"
            - call: "POST /submissions/${sub_2}/submit"
              payload: {}
              as: ReporterAgent
              as_user_id: "${ent_a}"
            - call: "POST /submissions/${sub_2}/review"
              payload: { decision: "ACCEPT", review_note: "supersedes the original filing" }
              as: MarketAnalyst
          assert:
            - "${s1} == ERR_DUPLICATE_SUBMISSION with HTTP 409 — an ACCEPTED filing exists and the new one supersedes nothing"
            - "${s2} == ERR_SUPERSEDE_TARGET_NOT_ACCEPTED with HTTP 409 — sub_rej is REJECTED; priority 32 outranks the duplicate rule at priority 37 which is also violated"
            - "Third create: HTTP 201, Submission.${sub_2}.supersedes_submission_id == ${sub_1}, status DRAFT"
            - "Submission.${sub_2}.reported_head == 120 and reported_cwt == 972.00 and reported_value_dollars == 274104.00"
            - "On acceptance of ${sub_2}: Submission.${sub_1}.status == SUPERSEDED"
            - "ReportingWindow.${win_1}.accepted_submission_count == 1 and total_head_reported == 120 (the 100 head of the superseded filing left the ledger in the same response)"
            - "GET /submissions with supersedes_submission_id == ${sub_1} returns total_count == 1 and data[0].id == ${sub_2}"

      - name: market_report_parallel_dimension_independence
        claim_type: parallel
        grounds:
          - state_machines.MarketReport.aggregation_state
          - state_machines.MarketReport.disclosure_state
          - state_machines.MarketReport.publication_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / market_report_three_parallel_dimensions
          rationale: "That §1.8 instance walks all three MarketReport dimensions independently (COMPUTED->STALE with disclosure untouched, PUBLISHED->WITHDRAWN by the aggregation dimension) and asserts the combined triple after each hop."

      - name: submission_cyclic_correction_loop
        claim_type: cyclic
        grounds:
          - state_machines.Submission.ACCEPTED_to_UNDER_CORRECTION
          - state_machines.Submission.UNDER_CORRECTION_to_RESUBMITTED
          - state_machines.Submission.RESUBMITTED_to_ACCEPTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / submission_correction_cycle_returns_to_accepted
          rationale: "That §1.8 instance drives the ACCEPTED -> UNDER_CORRECTION -> RESUBMITTED -> ACCEPTED loop and asserts resubmission_count growth plus the RESUBMISSION_LIMIT termination condition."

      - name: audit_case_branch_fork_and_join
        claim_type: branching
        grounds:
          - state_machines.AuditCase.FIELDWORK_to_RECONCILED
          - state_machines.AuditCase.FIELDWORK_to_DISCREPANCY
          - state_machines.AuditCase.DISCREPANCY_to_CLOSED
        excluded_because:
          difficulty_instance: non_linear_state_machine / audit_case_fork_join_divergent_branch_effects
          rationale: "That §1.8 instance runs both fork branches from identical FIELDWORK state and asserts that only the DISCREPANCY branch cascades the submission into UNDER_CORRECTION, then joins both at CLOSED."

      - name: audit_finding_cascade_down_chain
        claim_type: cascade_down
        grounds:
          - state_machines.AuditCase.FIELDWORK_to_DISCREPANCY.side_effects
          - state_machines.Submission.ACCEPTED_to_UNDER_CORRECTION
          - state_machines.MarketReport.AGG_COMPUTED_to_AGG_STALE
        excluded_because:
          difficulty_instance: transitive_cascade / audit_material_finding_four_hop_chain
          rationale: "That §1.8 instance asserts the full four-hop cascade audit finalize -> submission UNDER_CORRECTION -> window ledger -> report STALE/WITHDRAWN end to end in one response."

      - name: penalty_ledger_sync_to_reporting_entity
        claim_type: ledger_sync
        grounds:
          - calculations.entity_penalty_ledger
          - state_machines.PenaltyAssessment.ASSESSED_to_WAIVED
        excluded_because:
          difficulty_instance: compensating_invariant / entity_penalty_ledger_restored_by_waiver
          rationale: "That §1.8 instance asserts the assessed/paid/waived/outstanding identity on ReportingEntity before and after a waiver, including the delinquency-point reversal."

      - name: window_ledger_compensation_on_correction
        claim_type: compensation
        grounds:
          - calculations.window_head_ledger
          - state_machines.Submission.ACCEPTED_to_UNDER_CORRECTION
        excluded_because:
          difficulty_instance: compensating_invariant / window_head_ledger_restored_by_correction_cycle
          rationale: "That §1.8 instance removes and restores the same filing's head from the window ledger across a full correction cycle and asserts no drift."

  # ===========================================================================
  - section: calculations
    instances:

      - name: boxed_beef_wholesale_aggregation_distinct_from_live_categories
        claim_type: correct_result
        grounds:
          - calculations.market_report_aggregation.wholesale_branch
          - calculations.submission_reported_totals.lot_value_dollars
          - entities.WholesaleLot
        distinguishing_aspect: |
          The wholesale branch of the aggregator, which no other instance drives:
          weights come from load_count / total_pounds (not head / carcass cwt),
          price from price_per_cwt, and the volume axis is pounds — so total_head
          is null while total_pounds is 900000.00. The two lots are deliberately
          NOT proportional (10 loads / 400000 lb vs 15 loads / 500000 lb) so the
          two weighting variants diverge: 288.20 head-weighted vs 288.00
          weight-weighted.
        test_recipe:
          setup:
            - "Alpha Packing (ACTIVE 2026 registration, plant EST-101 with boxed_beef_volume_lbs_prior_year 2500000 so wholesale reporting is authorized) files one submission into a CATTLE / BOXED_BEEF weekly window with relaxed guidelines 1 / 100.00 / 1."
            - "Lot 1: BOXED_BEEF_CHOICE_CUTOUT NEGOTIATED, 10 loads, 400000.00 lb, 285.50 per cwt. Lot 2: BOXED_BEEF_SELECT_CUTOUT DELIVERED, 15 loads, 500000.00 lb, 290.00 per cwt."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
