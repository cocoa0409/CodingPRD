            - "MakeGoodObligation.${mg1_id}.shortfall_copies == 550"
            - "MakeGoodObligation.${mg1_id}.shortfall_pct == 31.43"
            - "MakeGoodObligation.${mg1_id}.tier_factor == 1.50"
            - "${mg1_per_insertion} == 400733"
            - "${mg1_credit} == 4808796"
            - "${mg1_credit} != 4808790 — the multiply-then-round order is rejected"
            - "MakeGoodObligation.${mg1_id}.bonus_insertions == 5"
            - "MakeGoodObligation.${mg1_id}.status == PENDING"
            - "AdvertiserContract.${ac1_id}.makegood_credit_committed_cents == 4808796 and makegood_credit_available_cents == 5391204"

      - name: controlled_cap_allowance_closed_form_against_final_total
        grounds:
          - calculations.controlled_copies_cap_allowance
          - calculations.statement_circulation_breakdown
          - entities.Publication.fields.controlled_cap_pct
          - entities.CirculationStatement.fields.controlled_copies_excess
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency (the cap is a share of a total that already
          contains the capped quantity) resolved by a pinned closed form: allowance =
          floor(core * cap / (100 - cap)) = floor(900 * 25 / 75) = 300, so the admitted controlled
          copies land at exactly 25.00% of the final 1200. The naive "cap of the pre-controlled
          subtotal" reading (floor(900 * 25 / 100) = 225, total 1125) is falsified by the same run.
          Distinct from the make-good instance: no rounding order is at stake here, only the
          resolution order of a self-referential percentage constraint.
        test_recipe:
          setup:
            - "publication with controlled_cap_pct 25.00 and all three qualification rules defined"
            - "one qualified DELIVERABLE PAID recipient with 900 copies and one qualified DELIVERABLE CONTROLLED recipient with 400 copies, both verified at the default clock 2026-08-01"
            - "logical clock moved to 2026-10-01; no statement created yet"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Foundry Digest", frequency: "MONTHLY", industry_code: "MANUFACTURING", controlled_cap_pct: 25.00 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "JOB_FUNCTION", allowed_values: ["ENGINEERING_MGMT", "PLANT_MGMT"], points: 45, is_mandatory: true }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "INDUSTRY", allowed_values: ["MANUFACTURING", "UTILITIES"], points: 30, is_mandatory: false }
              as: CirculationManager
