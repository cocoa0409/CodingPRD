scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_portfolio_returns_defaults
        claim_type: creation_and_defaults
        grounds: ["entities.Portfolio", "endpoints.POST_/portfolios"]
        distinguishing_aspect: "POST /portfolios with valid input returns 201; posture defaults to LADDER_OK, total_active_square_feet to 0, posture_year null; version == 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Corner P1", region: "WEST", laddering_max_pct_per_year: 35 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /portfolios/${pid}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Portfolio.${pid}.posture == LADDER_OK"
            - "Portfolio.${pid}.total_active_square_feet == 0"
            - "Portfolio.${pid}.posture_year == null"
            - "Portfolio.${pid}.version == 1 and id is a bare UUID without a type prefix"

      - name: create_lease_missing_required_field_returns_400
        claim_type: required_fields
        grounds: ["entities.Lease", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required field rentable_square_feet on lease creation yields ERR_VALIDATION (400); no lease row is persisted."
        test_recipe:
          setup: ["Portfolio exists"]
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Corner P2", region: "EAST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "X", base_rent_cents_per_rsf_year: 4000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_VALIDATION and http_status == 400"
            - "GET /portfolios/${pid}/leases returns total_count == 0"

      - name: holdover_tier1_days_default_applies
        claim_type: defaults
        grounds: ["entities.Lease.fields.holdover_tier1_days"]
        distinguishing_aspect: "Omitting holdover_tier1_days on lease creation stores the default 90."
        test_recipe:
          setup: ["Portfolio exists"]
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Corner P3", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "D", rentable_square_feet: 5000, base_rent_cents_per_rsf_year: 4000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: PlatformAdmin
              captures: { lid: $.data.id }
          assert:
            - "Lease.${lid}.holdover_tier1_days == 90"
            - "Lease.${lid}.status == DRAFT and accrued_holdover_rent_cents == 0"

      - name: get_lease_with_unknown_id_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent lease id under an existing portfolio returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Portfolio exists"]
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Corner P4", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /portfolios/${pid}/leases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND and http_status == 404"

      - name: list_leases_pagination_envelope
        claim_type: listing
        grounds: ["endpoints.GET_/portfolios/{pid}/leases", "response_envelope"]
        distinguishing_aspect: "List endpoint honors the fixed envelope: meta.api_request_id present, response_type array, and pagination fields limit/offset/total_count/has_more with defaults limit=10 offset=0."
        test_recipe:
          setup: ["Portfolio with 1 lease"]
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Corner P5", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "L1", rentable_square_feet: 5000, base_rent_cents_per_rsf_year: 4000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: PlatformAdmin
          trigger:
            - call: "GET /portfolios/${pid}/leases"
              payload: {}
              as: PlatformAdmin
          assert:
            - "envelope.meta.api_request_id is present and response_type == 'array'"
            - "data pagination: total_count == 1, has_more == false, limit == 10, offset == 0"

      - name: ledger_entry_immutable_no_version_field
        claim_type: immutability
        grounds: ["entities.LedgerEntry"]
        distinguishing_aspect: "LedgerEntry declares common_fields: false — it carries id and created_at only; no update endpoint exists and responses expose no version/updated_at fields."
        test_recipe:
          setup:
            - "Portfolio, AM contact, ACTIVE lease, TERMINATION option with exercise_fee_cents=50000 exercised through full notice flow"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Corner P6", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM C6", email: "amc6@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "BK C6", email: "bkc6@x.com", contact_kind: "BROKER" }
              as: PlatformAdmin
              captures: { bk_id: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "LC C6", email: "lcc6@x.com", contact_kind: "LANDLORD_COUNSEL" }
              as: PlatformAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "L6", rentable_square_feet: 5000, base_rent_cents_per_rsf_year: 4000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2028-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "TERMINATION", notice_window_open_date: "2026-08-01T00:00:00Z", notice_window_close_date: "2026-12-31T00:00:00Z", target_commencement_date: "2027-06-30T00:00:00Z", rate_determination: "FIXED", fixed_rent_cents_per_rsf_year: 4000, exercise_fee_cents: 50000 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { oid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices"
              payload: { delivery_method: "COURIER", expected_lease_version: "${l_ver}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { nid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices/${nid}/deliver"
              payload: {}
              as: Broker
              as_user_id: "${bk_id}"
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices/${nid}/acknowledge"
              payload: {}
              as: LandlordCounsel
              as_user_id: "${lc_id}"
          trigger:
            - call: "GET /portfolios/${pid}/leases/${lid}/ledger"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Exactly one OPTION_FEE entry exists with amount_cents == 50000"
            - "Each ledger entry exposes id and created_at but no version and no updated_at field"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: acknowledge_before_delivery_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.ExerciseNotice.DELIVERED_to_ACKNOWLEDGED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Acknowledge on a notice still in SENT (never delivered) fails with ERR_INVALID_STATE; the notice stays SENT and the option stays NOTICE_SENT."
        test_recipe:
          setup:
            - "Portfolio with AM, BK, LC; ACTIVE lease; FIXED EXPANSION option window [2026-08-01, 2026-12-31]; clock 2026-09-01; notice created (SENT, not delivered)"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Corner SM1", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM S1", email: "ams1@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "LC S1", email: "lcs1@x.com", contact_kind: "LANDLORD_COUNSEL" }
              as: PlatformAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "S1", rentable_square_feet: 5000, base_rent_cents_per_rsf_year: 4000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "EXPANSION", notice_window_open_date: "2026-08-01T00:00:00Z", notice_window_close_date: "2026-12-31T00:00:00Z", target_commencement_date: "2027-01-01T00:00:00Z", rate_determination: "FIXED", fixed_rent_cents_per_rsf_year: 4200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { oid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices"
              payload: { delivery_method: "COURIER", expected_lease_version: "${l_ver}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { nid: $.data.id }
          trigger:
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices/${nid}/acknowledge"
              payload: {}
              as: LandlordCounsel
              as_user_id: "${lc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE and http_status == 409"
            - "ExerciseNotice.${nid}.status == SENT and Option.${oid}.status == NOTICE_SENT"

      - name: redelivery_after_rejection_creates_fresh_notice
        claim_type: valid_transition
        grounds: ["state_machines.Option.NOTICE_SENT_to_NOTICE_SENT", "state_machines.ExerciseNotice.SENT_to_REJECTED"]
        distinguishing_aspect: "After a rejection, a second notice-create succeeds: the REJECTED notice goes VOID and a fresh SENT notice exists; option remains NOTICE_SENT."
        test_recipe:
          setup:
            - "Portfolio with AM, BK; ACTIVE lease; FIXED RENEWAL option window [2026-08-01, 2026-12-31]; clock 2026-09-01; first notice SENT then REJECTED"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Corner SM2", region: "EAST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM S2", email: "ams2@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "BK S2", email: "bks2@x.com", contact_kind: "BROKER" }
              as: PlatformAdmin
              captures: { bk_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "S2", rentable_square_feet: 5000, base_rent_cents_per_rsf_year: 4000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "RENEWAL", notice_window_open_date: "2026-08-01T00:00:00Z", notice_window_close_date: "2026-12-31T00:00:00Z", target_commencement_date: "2028-01-01T00:00:00Z", extension_years: 5, rate_determination: "FIXED", fixed_rent_cents_per_rsf_year: 4200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { oid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices"
              payload: { delivery_method: "CERTIFIED_MAIL", expected_lease_version: "${l_ver}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { nid1: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices/${nid1}/reject"
              payload: { rejection_reason: "bad address" }
              as: Broker
              as_user_id: "${bk_id}"
            - call: "GET /portfolios/${pid}/leases/${lid}"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver2: $.data.version }
          trigger:
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices"
              payload: { delivery_method: "PERSONAL_DELIVERY", expected_lease_version: "${l_ver2}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { nid2: $.data.id }
          assert:
            - "second create returns 201 with a new ExerciseNotice id != ${nid1}"
            - "ExerciseNotice.${nid1}.status == VOID and ExerciseNotice.${nid2}.status == SENT"
            - "Option.${oid}.status == NOTICE_SENT"

      - name: second_notice_while_open_returns_notice_already_open
        claim_type: precondition_enforcement
        grounds: ["validations[priority=13]", "errors[ERR_NOTICE_ALREADY_OPEN]"]
        distinguishing_aspect: "A second notice-create while the first is still SENT fails with ERR_NOTICE_ALREADY_OPEN (409) — duplicate-open prevention is distinct from the re-delivery path which requires all prior notices REJECTED/VOID."
        test_recipe:
          setup:
            - "Portfolio with AM; ACTIVE lease; FIXED RENEWAL option window [2026-08-01, 2026-12-31]; clock 2026-09-01; first notice SENT (not rejected)"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Corner SM3", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM S3", email: "ams3@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "S3", rentable_square_feet: 5000, base_rent_cents_per_rsf_year: 4000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "RENEWAL", notice_window_open_date: "2026-08-01T00:00:00Z", notice_window_close_date: "2026-12-31T00:00:00Z", target_commencement_date: "2028-01-01T00:00:00Z", extension_years: 5, rate_determination: "FIXED", fixed_rent_cents_per_rsf_year: 4200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { oid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices"
              payload: { delivery_method: "COURIER", expected_lease_version: "${l_ver}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { nid1: $.data.id }
            - call: "GET /portfolios/${pid}/leases/${lid}"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver2: $.data.version }
          trigger:
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices"
              payload: { delivery_method: "COURIER", expected_lease_version: "${l_ver2}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOTICE_ALREADY_OPEN and http_status == 409"
            - "ExerciseNotice.${nid1}.status remains SENT"

      - name: terminal_option_rejects_withdraw
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Option", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Withdraw on a LAPSED option (terminal) fails with ERR_INVALID_STATE — no transitions exist out of LAPSED."
        test_recipe:
          setup:
            - "Portfolio with AM; ACTIVE lease; option window [2026-08-10, 2026-09-10]; clock advanced to 2026-09-11 → option LAPSED"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Corner SM4", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM S4", email: "ams4@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "S4", rentable_square_feet: 5000, base_rent_cents_per_rsf_year: 4000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "ROFR", notice_window_open_date: "2026-08-10T00:00:00Z", notice_window_close_date: "2026-09-10T00:00:00Z", target_commencement_date: "2027-06-01T00:00:00Z", rate_determination: "FIXED", fixed_rent_cents_per_rsf_year: 4000 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { oid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portfolios/${pid}/leases/${lid}"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver: $.data.version }
          trigger:
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/withdraw"
              payload: { expected_lease_version: "${l_ver}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE and http_status == 409"
            - "Option.${oid}.status remains LAPSED"

      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: ["state_machines.Lease", "state_machines.Option", "state_machines.Amendment", "state_machines.MarketRateAssessment"]
        distinguishing_aspect: "Freshly created rows start in their declared initial states: Lease DRAFT, Option AVAILABLE, Amendment DRAFT, MarketRateAssessment PROVISIONAL."
        test_recipe:
          setup: ["Portfolio, AM contact, ACTIVE lease, FIXED RENEWAL option"]
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Corner SM5", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM S5", email: "ams5@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "S5", rentable_square_feet: 5000, base_rent_cents_per_rsf_year: 4000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id, l_status: $.data.status }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
