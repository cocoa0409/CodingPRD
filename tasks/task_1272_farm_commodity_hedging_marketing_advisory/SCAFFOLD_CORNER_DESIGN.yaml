  # ============================================================ endpoints
  - section: endpoints
    instances:
      - name: list_pagination_envelope
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoints honor limit/offset with total_count and has_more: 3 buyers, limit=2 -> 2 items + has_more true; offset=2 -> 1 item + has_more false."
        test_recipe:
          setup: ["three buyers registered"]
          setup_api_calls:
            - { call: "POST /advisory/buyers", payload: { name: "PB1", buyer_type: ELEVATOR, credit_rating: A }, as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "PB2", buyer_type: PROCESSOR, credit_rating: B }, as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "PB3", buyer_type: EXPORTER, credit_rating: C }, as: CommodityAdvisor }
          trigger:
            - { call: "GET /advisory/buyers", payload: { limit: 2 }, as: CommodityAdvisor, captures: { first: "$.data[0].id" } }
            - { call: "GET /advisory/buyers", payload: { limit: 2, offset: 2 }, as: CommodityAdvisor, captures: { last: "$.data[0].id" } }
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true"
            - "Page 2 (offset 2): 1 item, has_more == false, and its id differs from page-1 items"
      - name: fix_price_only_on_unpriced_contract
        claim_type: conditional_action
        grounds: [state_machines.SalesContract.UNPRICED_to_PRICED, "errors[ERR_PRICING_NOT_ALLOWED]"]
        distinguishing_aspect: "fix-price is legal only on UNPRICED HTA/BASIS: on FLAT_PRICE it is rejected, and a second fix-price after success is also rejected."
