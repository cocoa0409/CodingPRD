  - rule_id: boundary_precision_check
    instances:
      - name: mass_balance_floor_inclusive_at_exactly_97_00
        grounds:
          - calculations.lot_mass_balance
          - errors[ERR_MASS_BALANCE_OUT_OF_TOLERANCE]
          - state_machines.RecoveryLot.CHARGED_to_FINALIZED
          - entities.RecoveryLot.fields.mass_balance_pct
        distinguishing_aspect: |
          MASS_BALANCE_FLOOR_PCT is an INCLUSIVE floor at the 2-decimal rounded value: residue
          66.9 kg gives accounted 96.900 of 100.000 charged, mass_balance_pct 96.90, and is
