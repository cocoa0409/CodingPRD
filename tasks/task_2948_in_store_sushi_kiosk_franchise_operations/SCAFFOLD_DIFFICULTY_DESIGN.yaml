scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: settlement_gross_vs_net_of_markdown_share_divergence
        grounds:
          - "calculations.revenue_share_settlement"
          - "entities.SettlementStatement.fields.binding_share_cents"
          - "entities.SettlementStatement.fields.advisory_share_cents"
          - "entities.SettlementStatement.fields.variance_cents"
          - "entities.LicenseAgreement.fields.revenue_share_model"
        distinguishing_aspect: |
          This dual variant lives in the MONEY domain on SettlementStatement/LicenseAgreement: the GROSS_SALES and
          NET_OF_MARKDOWN bases run the same marginal tier ladder over 2400000 and 2100000 cents and differ by
          exactly 42000 cents, which the statement records in variance_cents.
        test_recipe:
          setup:
            - "clock at 2026-08-03T11:00:00Z"
            - "one host store with a CONNECTED POS integration attested at 240 sqft / 20.0 ft"
            - "an ACTIVE license agreement whose revenue_share_model is GROSS_SALES"
            - "one RECONCILED POS sales feed for 2026-08-03 with gross_sales_cents 2400000 and markdown_sales_cents 300000"
            - "no credit-eligible discard events and no space shortfall (attested 240 >= obligation 220)"
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: FranchisorOps
            - call: "POST /kiosk-ops/host-stores"
              payload: { name: "Northgate Market 418", banner_chain: "Northgate", store_number: "418", state_code: "CA", weekly_traffic_count: 63000, sushi_space_sqft: 240, refrigerated_case_linear_ft: 20.0, refrigerated_case_capacity_packs: 400 }
              as: FranchisorOps
              captures: { hs_id: $.data.id }
            - call: "POST /kiosk-ops/host-stores/${hs_id}/pos-integration"
              payload: { pos_integration_status: "CONNECTED", pos_terminal_count: 6 }
              as: HostStoreManager
              as_user_id: "${hs_id}"
            - call: "POST /kiosk-ops/host-stores/${hs_id}/space-attestation"
              payload: { attested_sushi_space_sqft: 240, attested_case_linear_ft: 20.0, attested_on: "2026-08-01" }
              as: HostStoreManager
              as_user_id: "${hs_id}"
            - call: "POST /kiosk-ops/license-agreements"
              payload: { host_store_id: "${hs_id}", revenue_share_model: "GROSS_SALES", markdown_policy: "PRORATED_REMAINING_LIFE", min_space_sqft_obligation: 220, min_case_linear_ft_obligation: 18.0, space_credit_cents_per_sqft: 1250, effective_from: "2026-08-01", effective_to: "2027-07-31" }
              as: FranchisorOps
              captures: { la_id: $.data.id }
            - call: "POST /kiosk-ops/license-agreements/${la_id}/activate"
              as: FranchisorOps
            - call: "POST /kiosk-ops/chefs"
              payload: { full_name: "Kenji Arai" }
              as: FranchisorOps
              captures: { chef_id: $.data.id }
            - call: "POST /kiosk-ops/chefs/${chef_id}/training"
              payload: { hours: 30, curriculum_code: "HS-CORE-24" }
              as: FranchisorOps
            - call: "POST /kiosk-ops/chefs/${chef_id}/certifications"
              payload: { cert_type: "FOOD_HANDLER", exam_score: 92, issued_at: "2026-08-01T00:00:00Z", valid_days: 365 }
              as: QualityAuditor
              captures: { cert_fh_id: $.data.id }
            - call: "POST /kiosk-ops/chefs/${chef_id}/certifications"
              payload: { cert_type: "HACCP_RICE_ACIDIFICATION", exam_score: 95, issued_at: "2026-08-01T00:00:00Z", valid_days: 365 }
              as: QualityAuditor
              captures: { cert_hc_id: $.data.id }
            - call: "POST /kiosk-ops/kiosks"
              payload: { license_agreement_id: "${la_id}", kiosk_code: "K-418-A", case_footprint_sqft: 230 }
              as: FranchisorOps
              captures: { kiosk_id: $.data.id }
            - call: "POST /kiosk-ops/chefs/${chef_id}/placement"
              payload: { assigned_kiosk_id: "${kiosk_id}", as_lead_chef: true }
              as: FranchisorOps
            - call: "POST /kiosk-ops/kiosks/${kiosk_id}/commission"
              payload: { commissioned_on: "2026-08-03" }
              as: FranchisorOps
            - call: "POST /kiosk-ops/pos-sales-feeds"
              payload: { host_store_id: "${hs_id}", business_date: "2026-08-03", gross_sales_cents: 2400000, markdown_sales_cents: 300000, full_price_units: 100, markdown_units: 40, lines: [] }
              as: HostStoreManager
              as_user_id: "${hs_id}"
              captures: { feed_id: $.data.id }
            - call: "POST /kiosk-ops/pos-sales-feeds/${feed_id}/reconcile"
              as: FranchisorOps
            - call: "GET /kiosk-ops/license-agreements/${la_id}"
              as: FranchisorOps
              captures: { la_v: $.data.version }
          trigger:
            - call: "POST /kiosk-ops/settlement-statements"
              payload: { license_agreement_id: "${la_id}", period_start: "2026-08-01", period_end: "2026-08-31", expected_license_agreement_version: "${la_v}" }
              as: FranchisorOps
              as_user_id: "ops-creator-1"
              captures: { st_id: $.data.id, st_binding: $.data.binding_share_cents }
          assert:
            - "SettlementStatement.${st_id}.settlement_base_cents == 2400000"
            - "SettlementStatement.${st_id}.binding_share_cents == 296000"
            - "SettlementStatement.${st_id}.advisory_share_cents == 254000"
            - "SettlementStatement.${st_id}.variance_cents == 42000"
            - "SettlementStatement.${st_id}.binding_variant == GROSS_SALES"
            - "SettlementStatement.${st_id}.net_due_cents == 296000"
            - "an otherwise identical agreement with revenue_share_model NET_OF_MARKDOWN yields binding_share_cents 254000, advisory_share_cents 296000 and variance_cents -42000"
      - name: pack_markdown_prorated_vs_flat_step_divergence
        grounds:
          - "calculations.pack_markdown_price"
          - "entities.PackLot.fields.markdown_price_cents"
          - "entities.PackLot.fields.advisory_markdown_price_cents"
          - "entities.PackLot.fields.markdown_variant_applied"
          - "entities.LicenseAgreement.fields.markdown_policy"
          - "state_machines.PackLot.ON_SHELF_to_MARKED_DOWN"
        distinguishing_aspect: |
          This dual variant lives in the SHELF-PRICING domain on PackLot, a different entity and a different metric
          from the settlement share: with 540 of 720 shelf minutes left on a 900-cent pack, PRORATED_REMAINING_LIFE
          yields 675 cents while FLAT_STEP yields 450 cents.
        test_recipe:
          setup:
            - "clock at 2026-08-03T11:00:00Z"
            - "agreement markdown_policy is PRORATED_REMAINING_LIFE"
            - "a released plan for 2026-08-03 with planned_pack_count 162"
            - "an APPROVED rice batch of 21.6 kg (max_pack_yield 180) and a RELEASED 12.0 kg exempt tuna lot"
            - "an ON_SHELF pack lot of 160 packs at 900 cents produced at 2026-08-03T08:00:00Z, so shelf_expiry_at is 2026-08-03T20:00:00Z and 540 minutes remain"
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: FranchisorOps
            - call: "POST /kiosk-ops/host-stores"
              payload: { name: "Northgate Market 418", banner_chain: "Northgate", store_number: "418", state_code: "CA", weekly_traffic_count: 63000, sushi_space_sqft: 240, refrigerated_case_linear_ft: 20.0, refrigerated_case_capacity_packs: 400 }
              as: FranchisorOps
              captures: { hs_id: $.data.id }
            - call: "POST /kiosk-ops/host-stores/${hs_id}/pos-integration"
              payload: { pos_integration_status: "CONNECTED", pos_terminal_count: 6 }
              as: HostStoreManager
              as_user_id: "${hs_id}"
            - call: "POST /kiosk-ops/host-stores/${hs_id}/space-attestation"
              payload: { attested_sushi_space_sqft: 240, attested_case_linear_ft: 20.0, attested_on: "2026-08-01" }
              as: HostStoreManager
              as_user_id: "${hs_id}"
            - call: "POST /kiosk-ops/license-agreements"
              payload: { host_store_id: "${hs_id}", revenue_share_model: "GROSS_SALES", markdown_policy: "PRORATED_REMAINING_LIFE", min_space_sqft_obligation: 220, min_case_linear_ft_obligation: 18.0, space_credit_cents_per_sqft: 1250, effective_from: "2026-08-01", effective_to: "2027-07-31" }
              as: FranchisorOps
              captures: { la_id: $.data.id }
            - call: "POST /kiosk-ops/license-agreements/${la_id}/activate"
              as: FranchisorOps
            - call: "POST /kiosk-ops/chefs"
              payload: { full_name: "Kenji Arai" }
              as: FranchisorOps
              captures: { chef_id: $.data.id }
            - call: "POST /kiosk-ops/chefs/${chef_id}/training"
              payload: { hours: 30, curriculum_code: "HS-CORE-24" }
              as: FranchisorOps
            - call: "POST /kiosk-ops/chefs/${chef_id}/certifications"
              payload: { cert_type: "FOOD_HANDLER", exam_score: 92, issued_at: "2026-08-01T00:00:00Z", valid_days: 365 }
              as: QualityAuditor
              captures: { cert_fh_id: $.data.id }
            - call: "POST /kiosk-ops/chefs/${chef_id}/certifications"
              payload: { cert_type: "HACCP_RICE_ACIDIFICATION", exam_score: 95, issued_at: "2026-08-01T00:00:00Z", valid_days: 365 }
              as: QualityAuditor
              captures: { cert_hc_id: $.data.id }
            - call: "POST /kiosk-ops/kiosks"
              payload: { license_agreement_id: "${la_id}", kiosk_code: "K-418-A", case_footprint_sqft: 230 }
              as: FranchisorOps
              captures: { kiosk_id: $.data.id }
            - call: "POST /kiosk-ops/chefs/${chef_id}/placement"
              payload: { assigned_kiosk_id: "${kiosk_id}", as_lead_chef: true }
              as: FranchisorOps
            - call: "POST /kiosk-ops/kiosks/${kiosk_id}/commission"
              payload: { commissioned_on: "2026-08-03" }
              as: FranchisorOps
            - call: "GET /kiosk-ops/kiosks/${kiosk_id}"
              as: FranchiseChef
              as_user_id: "${chef_id}"
              captures: { kiosk_v: $.data.version }
            - call: "POST /kiosk-ops/production-plans"
              payload: { kiosk_id: "${kiosk_id}", production_date: "2026-08-03", traffic_forecast: 9000, expected_kiosk_version: "${kiosk_v}" }
              as: FranchiseChef
              as_user_id: "${chef_id}"
              captures: { plan_id: $.data.id, planned: $.data.planned_pack_count }
            - call: "POST /kiosk-ops/production-plans/${plan_id}/release"
              as: FranchiseChef
              as_user_id: "${chef_id}"
            - call: "POST /kiosk-ops/rice-batches"
              payload: { production_plan_id: "${plan_id}", chef_id: "${chef_id}", rice_kg: 21.6, vinegar_liters: 2.2, hold_start_at: "2026-08-03T05:00:00Z", hold_end_at: "2026-08-03T07:00:00Z" }
              as: FranchiseChef
              as_user_id: "${chef_id}"
              captures: { rb_id: $.data.id, rb_yield: $.data.max_pack_yield }
            - call: "POST /kiosk-ops/rice-batches/${rb_id}/acidification-reading"
              payload: { measured_ph: 4.1, ph_measured_at: "2026-08-03T07:00:00Z", max_temp_c: 19.5 }
              as: FranchiseChef
              as_user_id: "${chef_id}"
            - call: "POST /kiosk-ops/rice-batches/${rb_id}/verify-ttc"
              as: FranchiseChef
              as_user_id: "${chef_id}"
            - call: "POST /kiosk-ops/fish-lots"
              payload: { kiosk_id: "${kiosk_id}", species: "TUNA_YELLOWFIN", supplier_code: "SUP-9931", harvest_method: "WILD", net_weight_kg: 12.0, received_at: "2026-08-03T06:30:00Z", receiving_temp_c: 2.8 }
              as: FranchiseChef
              as_user_id: "${chef_id}"
              captures: { fl_id: $.data.id }
            - call: "POST /kiosk-ops/fish-lots/${fl_id}/release"
              as: QualityAuditor
            - call: "POST /kiosk-ops/pack-lots"
              payload: { rice_batch_id: "${rb_id}", fish_lot_id: "${fl_id}", sku_code: "CALIF-8", pack_count: 160, list_price_cents: 900, produced_at: "2026-08-03T08:00:00Z" }
              as: FranchiseChef
              as_user_id: "${chef_id}"
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /kiosk-ops/pack-lots/${pl_id}/markdown"
              as: FranchiseChef
              as_user_id: "${chef_id}"
              captures: { md_binding: $.data.markdown_price_cents, md_advisory: $.data.advisory_markdown_price_cents }
          assert:
            - "PackLot.${pl_id}.status == MARKED_DOWN"
            - "PackLot.${pl_id}.markdown_variant_applied == PRORATED_REMAINING_LIFE"
            - "PackLot.${pl_id}.markdown_price_cents == 675"
            - "PackLot.${pl_id}.advisory_markdown_price_cents == 450"
            - "PackLot.${pl_id}.markdown_price_cents - PackLot.${pl_id}.advisory_markdown_price_cents == 225"
            - "the same pack lot under a FLAT_STEP agreement has markdown_price_cents 450 and advisory_markdown_price_cents 675"
            - "at 2026-08-03T18:30:00Z the same lot prices at 270 (the 30 percent floor) binding and 450 advisory, so the sign of the divergence reverses"

  - rule_id: combinatorial_formula
    instances:
      - name: production_plan_min_of_three_caps_posture_conditional
        grounds:
          - "calculations.daily_production_allocation"
          - "calculations.kiosk_risk_points"
          - "entities.ProductionPlan.fields.binding_cap_source"
          - "entities.ProductionPlan.fields.posture_factor_applied"
          - "entities.Kiosk.fields.sanitation_posture"
        distinguishing_aspect: |
          MODE (a): four independent inputs (traffic demand, refrigerated case capacity, certified staffing,
          sanitation posture) interact through a nested min with a fixed tie-break precedence and a
          conditional branch on the kiosk's posture state, which is itself a weighted score over another entity.
        test_recipe:
          setup:
            - "clock at 2026-08-03T11:00:00Z"
            - "a commissioned kiosk with exactly one CERTIFIED chef, so staffing_cap is 200"
            - "host store attested at 20.0 case linear feet and 400 pack capacity, so case_cap is min(400, 180) = 180"
            - "a submitted food safety audit carrying two MAJOR findings, putting Kiosk.risk_points at exactly 8 and sanitation_posture at WATCH"
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: FranchisorOps
            - call: "POST /kiosk-ops/host-stores"
              payload: { name: "Northgate Market 418", banner_chain: "Northgate", store_number: "418", state_code: "CA", weekly_traffic_count: 63000, sushi_space_sqft: 240, refrigerated_case_linear_ft: 20.0, refrigerated_case_capacity_packs: 400 }
              as: FranchisorOps
              captures: { hs_id: $.data.id }
