  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: stall_single_occupancy_interval
        grounds:
          - state_machines.Stall.IDLE_to_OCCUPIED
          - entities.Stall.fields.current_order_id
        distinguishing_aspect: |
          Interval semantics = single-resource occupancy: a stall admits exactly
          one occupying order at a time; a second check-in while OCCUPIED is
          rejected (ERR_STALL_OCCUPIED). Adjacency is meaningless — occupancy
          is exclusive, not time-sliced.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T13:00:00Z; Location L, stall 1 OCCUPIED by a first order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: PlatformAdmin
            - call: "POST /locations"
              payload: { code: "OKC-128", name: "OKC 128", timezone: "America/Chicago", stall_capacity: 2 }
              as: PlatformAdmin
              captures: { loc15_id: $.data.id, loc15_v0: $.data.version }
            - call: "POST /locations/${loc15_id}/stalls"
              payload: { stall_number: 1, kind: "STALL" }
              as: PlatformAdmin
              captures: { stall15_id: $.data.id }
            - call: "POST /locations/${loc15_id}/stalls/${stall15_id}/checkin"
              payload: { expected_location_version: "${loc15_v0}" }
              as: ShiftManager
              captures: { o15_id: $.data.id }
          trigger:
            - call: "POST /locations/${loc15_id}/stalls/${stall15_id}/checkin"
              payload: { expected_location_version: "${loc15_v0}" }
              as: ShiftManager
              captures: { err15: $.data.error_id }
          assert:
            - "response status is 409 and error_id == ERR_STALL_OCCUPIED (exclusive occupancy, no second interval)"
      - name: offer_window_half_open_midnight_wrap
        grounds:
          - calculations.offer_application
          - entities.Offer.fields.window_end_local
        distinguishing_aspect: |
          Interval semantics = half-open daily window [start, end) with
          midnight wrap: an offer 22:00-02:00 applies at 23:30 and 01:30 but
          NOT at exactly 02:00 (end exclusive) nor 21:59 — a different
          interval geometry from single-resource stall occupancy.
        test_recipe:
          setup:
            - "Logical clock set so local time is exactly 02:00 (window end, exclusive)."
