            - call: "GET /recommerce/credit-grants/${grant_id}/ledger-entries"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e0_type: "$.data[0].entry_type", e0_amt: "$.data[0].amount_minor", e0_bal: "$.data[0].balance_after_minor", e1_type: "$.data[1].entry_type", e1_amt: "$.data[1].amount_minor", e1_bal: "$.data[1].balance_after_minor", e2_type: "$.data[2].entry_type", e2_amt: "$.data[2].amount_minor", e2_bal: "$.data[2].balance_after_minor" }
            - call: "GET /recommerce/customers/${cust_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { bal_after: "$.data.credit_balance_minor" }
          assert:
            - "${issued} == 11500 and ${bal_before} == 11500"
            - "${ord_credit} == 10627 and ${ord_cash} == 10628 and ${rem_mid} == 873 and ${status_mid} == PARTIALLY_REDEEMED"
            - "${warranty_until} == 2026-08-31T00:00:00Z  # fulfilled_at + warranty_days 30"
            - "${restock} == 0 and ${refund_cash} == 10628 and ${refund_credit} == 10627  # warranty variant refunds the channel fee and charges no restocking fee"
            - "${rem_after} == 11500 and ${status_after} == ISSUED  # the conserved quantity is exactly restored"
            - "${bal_after} == ${bal_before}  # 11500, byte-identical to the pre-order figure"
            - "${e0_type} == ISSUE and ${e0_amt} == 11500 and ${e0_bal} == 11500"
            - "${e1_type} == REDEEM and ${e1_amt} == -10627 and ${e1_bal} == 873"
            - "${e2_type} == RELEASE and ${e2_amt} == 10627 and ${e2_bal} == 11500"
            - "${e0_amt} + ${e1_amt} + ${e2_amt} == ${rem_after}  # 11500 - 10627 + 10627 == 11500; the ledger sums to remaining_minor"
            - "GET /recommerce/credit-grants/${grant_id}/ledger-entries returns exactly 3 rows — nothing was deleted or rewritten"

      - name: warranty_replacement_preserves_tracked_mass_conservation_exactly
        grounds:
          - calculations.tracked_mass_conservation_invariant
          - calculations.replacement_unit_selector
          - calculations.diversion_metrics
          - state_machines.ResaleUnit.SOLD_to_SALVAGED
          - entities.ResaleUnit.fields.replacement_for_unit_id
          - entities.Customer.fields.diverted_grams_total
        distinguishing_aspect: |
          A different conserved quantity — physical mass in grams, not currency — and a different
          compensating pair: the REPLACE settlement moves the defective unit's 1400 g out of the
          diverted bucket into salvage while the substitute unit's 1300 g takes over the sale. The
          total tracked mass across all ResaleUnit rows is untouched at 2700 g; only the split
          between the buckets moves, and the diversion report must reflect the new split exactly.
        test_recipe:
          setup:
            - "Ava submits two accepted MAIL_IN OUTERWEAR grade B trade-ins of msrp 50000: U1 at 1400 g and U2 at 1300 g, so diverted_grams_total is 2700 and she holds two 11500 grants (23000 in total)."
            - "Both units are refurbished with zero task lines in one CLEANING bay — [09:00, 11:00] and [12:00, 14:00], a legal 60-minute gap — and both are listed at 19500 on the same channel."
            - "Buyer Ben holds no credit and buys U1 with requested_credit_minor 0: gross 19500, fee 1755, order_total 21255, cash_due 21255."
            - "The order is fulfilled and a WARRANTY_DEFECT return is opened at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "OUTERWEAR", condition_grade: "B", base_credit_pct_bp: 2000, resale_price_pct_bp: 3900, refurb_budget_cap_pct_bp: 3000, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
            - call: "POST /recommerce/store-locations/${store_id}/refurb-bays"
              payload: { code: "BAY-C1", bay_type: "CLEANING" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { bay_id: "$.data.id" }
            - call: "POST /recommerce/channels"
              payload: { code: "RESALE-MP", channel_type: "RESALE_MARKETPLACE", allowed_assortment: "RESALE_ONLY", max_resale_price_ratio_bp: 7000, region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { chan_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { ava_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ben@example.com", full_name: "Ben Ortiz", loyalty_tier: "STANDARD" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { ben_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${ava_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${ava_id}"
              captures: { ti1_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins/${ti1_id}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
            - call: "POST /recommerce/trade-ins/${ti1_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "POST /recommerce/trade-ins/${ti1_id}/disposition"
              payload: { decision: "ACCEPT", ownership_treatment: "OWNED_INVENTORY" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "GET /recommerce/resale-units?trade_in_id=${ti1_id}"
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { u1_id: "$.data[0].id", u1_ver: "$.data[0].version", u1_mass: "$.data[0].mass_grams" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${ava_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1300 }
              as: Customer
              as_user_id: "${ava_id}"
              captures: { ti2_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins/${ti2_id}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
            - call: "POST /recommerce/trade-ins/${ti2_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "POST /recommerce/trade-ins/${ti2_id}/disposition"
              payload: { decision: "ACCEPT", ownership_treatment: "OWNED_INVENTORY" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "GET /recommerce/resale-units?trade_in_id=${ti2_id}"
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { u2_id: "$.data[0].id", u2_ver: "$.data[0].version", u2_mass: "$.data[0].mass_grams" }
            - call: "POST /recommerce/refurb-orders"
              payload: { resale_unit_id: "${u1_id}", refurb_bay_id: "${bay_id}", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_resale_unit_version: "${u1_ver}" }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { ro1_id: "$.data.id" }
            - call: "POST /recommerce/refurb-orders"
              payload: { resale_unit_id: "${u2_id}", refurb_bay_id: "${bay_id}", window_start_at: "2026-08-01T12:00:00Z", window_end_at: "2026-08-01T14:00:00Z", expected_resale_unit_version: "${u2_ver}" }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { ro2_id: "$.data.id" }
            - call: "POST /recommerce/refurb-orders/${ro1_id}/start"
              payload: {}
              as: RefurbTechnician
              as_user_id: "tech-001"
            - call: "POST /recommerce/refurb-orders/${ro1_id}/submit-qc"
              payload: {}
              as: RefurbTechnician
              as_user_id: "tech-001"
            - call: "POST /recommerce/refurb-orders/${ro1_id}/qc-decision"
              payload: { decision: "PASS" }
              as: RefurbTechnician
              as_user_id: "tech-002"
            - call: "POST /recommerce/refurb-orders/${ro2_id}/start"
              payload: {}
              as: RefurbTechnician
              as_user_id: "tech-001"
            - call: "POST /recommerce/refurb-orders/${ro2_id}/submit-qc"
              payload: {}
              as: RefurbTechnician
              as_user_id: "tech-001"
            - call: "POST /recommerce/refurb-orders/${ro2_id}/qc-decision"
              payload: { decision: "PASS" }
              as: RefurbTechnician
              as_user_id: "tech-002"
            - call: "POST /recommerce/resale-units/${u1_id}/list"
              payload: { channel_id: "${chan_id}" }
              as: MerchandisingManager
              as_user_id: "merch-001"
            - call: "POST /recommerce/resale-units/${u2_id}/list"
              payload: { channel_id: "${chan_id}" }
              as: MerchandisingManager
              as_user_id: "merch-001"
            - call: "GET /recommerce/customers/${ava_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { ava_mass_before: "$.data.diverted_grams_total", ava_bal_before: "$.data.credit_balance_minor" }
            - call: "GET /recommerce/customers/${ben_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { ben_ver: "$.data.version" }
            - call: "POST /recommerce/resale-orders"
              payload: { customer_id: "${ben_id}", channel_id: "${chan_id}", resale_unit_id: "${u1_id}", requested_credit_minor: 0, expected_customer_version: "${ben_ver}" }
              as: Customer
              as_user_id: "${ben_id}"
              captures: { ord_id: "$.data.id", ord_cash: "$.data.cash_due_minor" }
            - call: "POST /recommerce/resale-orders/${ord_id}/fulfill"
              payload: {}
              as: MerchandisingManager
              as_user_id: "merch-001"
            - call: "POST /recommerce/resale-orders/${ord_id}/return-request"
              payload: { reason_type: "WARRANTY_DEFECT" }
              as: Customer
              as_user_id: "${ben_id}"
          trigger:
            - call: "POST /recommerce/resale-orders/${ord_id}/settle-return"
              payload: { resolution: "REPLACE" }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { ord_status: "$.data.status" }
            - call: "GET /recommerce/resale-units/${u1_id}"
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { u1_life: "$.data.lifecycle_state", u1_acct: "$.data.accounting_state", u1_mass_after: "$.data.mass_grams" }
            - call: "GET /recommerce/resale-units/${u2_id}"
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { u2_life: "$.data.lifecycle_state", u2_repl: "$.data.replacement_for_unit_id", u2_mass_after: "$.data.mass_grams" }
            - call: "GET /recommerce/customers/${ava_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { ava_mass_after: "$.data.diverted_grams_total", ava_bal_after: "$.data.credit_balance_minor" }
            - call: "POST /recommerce/diversion-reports"
              payload: { period_start_at: "2026-08-01T00:00:00Z", period_end_at: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { rpt_count: "$.data.units_diverted_count", rpt_div: "$.data.diverted_grams", rpt_salv: "$.data.salvage_grams", rpt_rate: "$.data.landfill_diversion_rate_bp", rpt_liab: "$.data.credit_liability_minor" }
          assert:
            - "${u1_mass} == 1400 and ${u2_mass} == 1300 and ${ava_mass_before} == 2700 and ${ava_bal_before} == 23000"
            - "${ord_cash} == 21255  # 19500 + 1755, no credit applied"
            - "${ord_status} == REPLACED"
            - "${u1_life} == SALVAGED and ${u1_acct} == EXPENSED  # the defective unit leaves the diverted bucket"
            - "${u2_life} == SOLD and ${u2_repl} == ${u1_id}  # the cheapest LISTED peer in the same tier on the same channel takes over"
            - "${u1_mass_after} == 1400 and ${u2_mass_after} == 1300  # mass_grams is never rewritten"
            - "${u1_mass_after} + ${u2_mass_after} == 2700  # total tracked mass is conserved exactly across the compensation"
            - "${ava_mass_after} == 1300  # dropped by exactly the defective unit's mass, not by a recomputed estimate"
            - "${ava_bal_after} == ${ava_bal_before}  # 23000: a REPLACE settlement moves no currency at all"
            - "${rpt_count} == 1 and ${rpt_div} == 1300 and ${rpt_salv} == 1400"
            - "${rpt_rate} == 4814  # floor(1300 * 10000 / 2700)"
            - "${rpt_div} + ${rpt_salv} == 2700  # equals the sum of item_mass_grams over ACCEPTED trade-ins in the period"
            - "${rpt_liab} == 23000  # both of Ava's grants are still ISSUED and untouched"
            - "ResaleOrder.${ord_id}.refund_cash_minor == 0 and ResaleOrder.${ord_id}.refund_credit_minor == 0"
