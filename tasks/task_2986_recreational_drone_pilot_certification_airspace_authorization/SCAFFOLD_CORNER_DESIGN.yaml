            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Sound Assurance", policy_number: "POL-OK-01", coverage_limit_cents: 2000000, deductible_cents: 50000, effective_from: "2026-10-01T00:00:00Z", effective_until: "2027-10-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
