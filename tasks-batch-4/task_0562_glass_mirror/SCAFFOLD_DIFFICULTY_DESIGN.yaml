  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_used_conserved_accept_then_cancel
        grounds:
          - state_machines.Quote.SENT_to_ORDERED
          - state_machines.Job.status_ACTIVE_to_CANCELLED
          - entities.ContractorAccount.fields.credit_used_cents
        distinguishing_aspect: |
          Conserved quantity credit_used_cents (money): accept holds +16576, job cancel releases
          -16576, so ContractorAccount.credit_used_cents returns to 0 (== sum of credit_hold_cents
          over ACTIVE jobs).
        test_recipe:
          setup:
            - "GOLD account; quote total 16576, accepted (credit_used=16576), no fabrication started."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "GOLD", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "ANNEALED", thickness_mm: 6, width_in: 20, height_in: 36, quantity: 1, edge_work: "POLISHED" }
              as: Estimator
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "ANNEALED", thickness_mm: 6, width_in: 20, height_in: 36, quantity: 1, edge_work: "POLISHED" }
              as: Estimator
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { job_id: $.data.ordered_job_id }
            - call: "GET /contractor-accounts/${acct_id}"
              payload: {}
              as: ShopAdmin
              captures: { used_after_accept: $.data.credit_used_cents }
          trigger:
            - call: "POST /jobs/${job_id}/cancel"
              payload: {}
              as: ShopAdmin
          assert:
            - "ContractorAccount.${acct_id}.credit_used_cents was 16576 after accept"
            - "ContractorAccount.${acct_id}.credit_used_cents == 0 after cancel"
            - "Job.${job_id}.status == CANCELLED"

      - name: furnace_reserved_sqft_conserved_schedule_then_cancel
        grounds:
          - state_machines.TemperingBatch.SCHEDULED_to_CANCELLED
          - entities.TemperingFurnace.fields.reserved_sqft
          - calculations.batch_total_sqft
        distinguishing_aspect: |
          Conserved quantity furnace reserved_sqft (area): scheduling a 15 sqft batch reserves +15,
          cancelling releases -15, so TemperingFurnace.reserved_sqft returns to 0 (== sum of
          total_sqft over SCHEDULED batches).
        test_recipe:
          setup:
            - "A job with a single TEMPERED 30x72 x1 line (15 sqft), a furnace, and one SCHEDULED batch (total_sqft=15)."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "TEMPERED", thickness_mm: 10, width_in: 30, height_in: 72, quantity: 1 }
              as: Estimator
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { job_id: $.data.ordered_job_id }
            - call: "POST /tempering-furnaces"
              payload: { name: "F1", max_batch_sqft: 500, cooldown_minutes: 60 }
              as: ShopAdmin
              captures: { furnace_id: $.data.id }
            - call: "POST /tempering-batches"
              payload: { job_id: "${job_id}", furnace_id: "${furnace_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Fabricator
              captures: { batch_id: $.data.id, batch_sqft: $.data.total_sqft }
            - call: "GET /tempering-furnaces/${furnace_id}"
              payload: {}
              as: Fabricator
              captures: { reserved_after_sched: $.data.reserved_sqft }
          trigger:
            - call: "POST /tempering-batches/${batch_id}/cancel"
              payload: {}
              as: Fabricator
          assert:
            - "TemperingBatch.${batch_id}.total_sqft == 15.0"
            - "TemperingFurnace.${furnace_id}.reserved_sqft was 15.0 after scheduling"
            - "TemperingFurnace.${furnace_id}.reserved_sqft == 0 after cancel"
