      - name: corner_lockdown_chain_runs_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines[ToolIssuance].transitions[ISSUED -> UNACCOUNTED]
        distinguishing_aspect: "A three-hop chain from one tool declaration through the facility posture to batches and worker assignments, verified hop by hop in one scenario."
        excluded_because:
          difficulty_instance: transitive_cascade / unaccounted_sharp_cascades_facility_lockdown_batch_discard_worker_unassignment
          rationale: "That instance already walks the full declaration -> LOCKDOWN posture -> batch DISCARDED -> worker UNASSIGNED chain and asserts each hop plus the untouched STAGED batch, which is exactly the end-to-end and ordering-sensitivity claim for this layer."
        
      - name: corner_both_ld_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.contract_liquidated_damages.variants
        distinguishing_aspect: "Both liquidated-damages variants are computed over one identical fixture and the delta between them is asserted numerically."
        excluded_because:
          difficulty_instance: dual_variant_calc / liquidated_damages_incident_based_vs_population_weighted_diverge_on_severity_multiplier
          rationale: "That instance reconciles the same closed ledger under INCIDENT_BASED and then under POPULATION_WEIGHTED and asserts both results plus their difference, which is the whole claim for this layer."

  # ===========================================================================
  # From Consistency Model - consistency_model: immediate
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: corner_write_response_and_immediate_read_agree
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /cfs/tool-issuances].side_effects
          - calculations.sharps_accountability_reconciliation
        distinguishing_aspect: "The cross-entity counters the tool issuance moves on its parent Facility are already settled when the 201 returns: a read issued at the same logical instant reports on_board 11 and issued 1 with no lag, and the accountability identity balances immediately rather than after a reconciliation pass."
        test_recipe:
          setup:
            - "Facility FAC-M01 authorizing 12 sharps, at version 1 with an ASSIGNED sharps-eligible worker and no issuances."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-M01", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-M01", name: "North Unit Kitchen", sharps_authorized_count: 12 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id, pre_on_board: $.data.sharps_on_board_count, pre_version: $.data.version }
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-M01", housing_unit: "GENERAL" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { inmate_id: $.data.id }
            - call: "POST /cfs/inmate-workers"
              payload: { inmate_id: "${inmate_id}", facility_id: "${facility_id}", medical_clearance_expires_at: "2026-12-31T00:00:00Z", sharps_eligible: true }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { worker_id: $.data.id }
            - call: "POST /cfs/inmate-workers/${worker_id}/assign"
              payload: { work_area: "COOK_CHILL" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { assigned: $.data.assignment_status }
          trigger:
            - call: "POST /cfs/tool-issuances"
              payload: { facility_id: "${facility_id}", issued_to_worker_id: "${worker_id}", tool_class: "MEAT_SAW", tool_serial: "MS-M01-1", shadow_board_slot: 4 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { issuance_status: $.data.status, issuer: $.data.issued_by_user_id, issued_at: $.data.issued_at, recovered: $.data.recovered }
            - call: "GET /cfs/facilities/${facility_id}/sharps-summary"
              payload: {}
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { post_on_board: $.data.sharps_on_board_count, post_issued: $.data.sharps_issued_count, post_unaccounted: $.data.sharps_unaccounted_count, post_authorized: $.data.sharps_authorized_count, post_posture: $.data.kitchen_posture }
            - call: "GET /cfs/facilities/${facility_id}"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { post_version: $.data.version }
          assert:
            - "${pre_on_board} == 12 with ${pre_version} == 1, and ${assigned} == ASSIGNED"
            - "${issuance_status} == ISSUED, ${issuer} == 'fs-001', ${issued_at} == 2026-08-01T00:00:00Z and ${recovered} == false"
            - "${post_on_board} == 11 and ${post_issued} == 1 at the same logical instant as the write - no re-read delay"
            - "${post_on_board} + ${post_issued} + ${post_unaccounted} == ${post_authorized} == 12 - the conservation identity holds immediately"
            - "${post_posture} == OPEN and ${post_version} == 2 - the parent's derived posture and version were settled inside the child's write"

      - name: corner_ledger_visible_in_the_closing_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /cfs/meal-service-records/{id}/close].side_effects
        distinguishing_aspect: "The contract-level ledger totals a close pushes upward are readable in the same request cycle, with no eventual-consistency window between the record's CLOSED status and the contract's updated missed_meal_total."
        excluded_because:
          difficulty_instance: transitive_cascade / service_record_close_cascades_contract_ledger_to_facility_corrective_posture
          rationale: "That instance closes a short-served record and asserts the contract's missed_meal_total, ledger figures and the facility's corrective posture immediately afterwards, which is precisely the immediate-visibility claim for the ledger path."
