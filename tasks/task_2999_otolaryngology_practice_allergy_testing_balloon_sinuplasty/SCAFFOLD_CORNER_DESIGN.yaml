          rationale: "The named §1.8 instance probes the half-open block window at both endpoints and then saturates booked_minutes and max_concurrent_cases to separate the two errors."

      - name: study_state_and_recommendation_gates_on_dispense_create
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STUDY_STATE_INVALID
          - errors.ERR_DEVICE_TYPE_NOT_RECOMMENDED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / dispense_gated_by_study_state_then_recommendation
          rationale: "The named §1.8 instance attempts the dispense against an ORDERED and a PERFORMED study before the study is INTERPRETED, then against the wrong device_type, isolating each error."

  # ===========================================================================
  # SECTION 7 — RBAC
  # The guide's RBAC section states two per-role claims by the §1.7 field names
  # it cites — exclusive_operations and shared_operations — and then one table
  # row per role model. This scaffold's complexity_profile.role_model is
  # segregation_of_duties, so that is the only role-model row instantiated here;
  # approval_chain, peer_roles, hierarchical_override and delegated_authority
  # are not active in this domain.
  # ===========================================================================
  - section: rbac
    instances:

      - name: exclusive_operations_returns_403_for_other_roles
        claim_type: exclusive_operations
        grounds:
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_UNAUTHENTICATED
          - validations[priority 1]
          - validations[priority 2]
        distinguishing_aspect: "The role gate at priority 2 runs before path existence at priority 4, so every one of these calls returns 403 even though its path id belongs to no row; and priority 1 outranks priority 2, so an empty X-User-Role is 401 rather than 403. Each exclusive operation is refused to a role that owns the neighbouring workflow — the admin may create and cancel bookings but may not start one, and the candidacy read is the single GET that is not open to all six roles."
        test_recipe:
          setup:
            - "No rows at all. Every trigger is expected to fail before any lookup happens, which is itself the claim."
          setup_api_calls: []
          trigger:
            - call: "POST /payer-policies"
              payload: { payer_name: "Nope Health", plan_code: "RBAX-2999" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /patients"
              payload: { payer_policy_id: "pol_rbac_2999", mrn: "MRN-19999", full_name: "Role Probe", date_of_birth: "1980-01-01" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /supply-lots"
              payload: { item_type: "BALLOON_DEVICE", lot_number: "LOT-1999", quantity_received: 1, expires_at: "2028-01-01T00:00:00Z" }
              as: SterileProcessingTech
              as_user_id: "u_tech_1"
            - call: "POST /surgery-center-blocks"
              payload: { center_name: "Nope Center", block_start_at: "2026-08-05T08:00:00Z", block_end_at: "2026-08-05T12:00:00Z" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PayerLiaison
              as_user_id: "u_liaison_1"
            - call: "POST /sinuplasty-cases"
              payload: { patient_id: "pat_rbac_2999", laterality: "LEFT", sinuses: ["MAXILLARY"] }
              as: PayerLiaison
              as_user_id: "u_liaison_1"
            - call: "POST /diagnostic-studies"
              payload: { patient_id: "pat_rbac_2999", study_type: "AUDIOMETRY" }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /immunotherapy-doses/dose_rbac_2999/void"
              payload: { void_reason: "DRAWN_IN_ERROR" }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /sinuplasty-cases/case_rbac_2999/payer-decisions"
              payload: { decision: "APPROVED", payer_reference: "PA-79999" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /endoscopes/scope_rbac_2999/reprocessing-start"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /device-dispenses/disp_rbac_2999/refund-settlement"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /procedure-bookings/booking_rbac_2999/start"
              payload: {}
              as: PracticeAdmin
              as_user_id: "u_admin_1"
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "pat_rbac_2999", panel_code: "MOLD_12", method: "SKIN_PRICK" }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "GET /sinuplasty-cases/case_rbac_2999/candidacy-evaluation"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "GET /patients"
              payload: {}
              as: Receptionist
              as_user_id: "u_front_1"
            - call: "GET /patients"
              payload: {}
              as: ""
              as_user_id: "u_admin_1"
          assert:
            - "Calls 1 through 14 all return HTTP 403 with error.id == \"ERR_ROLE_NOT_PERMITTED\""
            - "Calls 6 through 12 prove the ordering claim: the referenced ids exist nowhere, yet the response is 403 and not 404, because priority 2 precedes priority 4"
            - "Call 12 shows PracticeAdmin is refused POST /procedure-bookings/{bookingId}/start even though the same role may create and cancel bookings"
            - "Call 14 shows GET /sinuplasty-cases/{caseId}/candidacy-evaluation is restricted to PracticeAdmin, Otolaryngologist and PayerLiaison, unlike every other GET"
            - "Call 15 returns HTTP 403 with error.id == \"ERR_ROLE_NOT_PERMITTED\" — Receptionist is not a declared role at all, so an unknown role is a 403 and not a 400"
            - "Call 16 sends X-User-Role as the empty string and returns HTTP 401 with error.id == \"ERR_UNAUTHENTICATED\" — priority 1 outranks priority 2"
            - "No row was created by any of the sixteen calls: GET /patients as PracticeAdmin returns total_count == 0 and has_more == false"

      - name: shared_operations_permitted_for_both_declared_roles
        claim_type: shared_operations
        grounds:
          - endpoints[POST /allergy-test-orders]
          - endpoints[PATCH /patients/{patientId}]
          - endpoints[POST /procedure-bookings]
          - endpoints[POST /diagnostic-studies/{studyId}/interpretation]
          - endpoints[GET /sinuplasty-cases/{caseId}/candidacy-evaluation]
        distinguishing_aspect: "Every multi-role endpoint accepts each of its declared roles with an identical outcome, so the matrix is not merely 'one owner plus readers': an order is created by both the physician and the nurse, a patient is patched by both the admin and the nurse, a booking is created by both the admin and the physician, a study is interpreted once by an Audiologist and once by an Otolaryngologist, and the candidacy read returns the same body to all three of its declared roles."
        test_recipe:
          setup:
            - "PayerPolicy RBAA-2999 with POLICY_STRICT defaults; one adult Patient; two AUDIOMETRY studies with results recorded by u_aud_1; one DOCUMENTED, ELIGIBLE sinuplasty case."
