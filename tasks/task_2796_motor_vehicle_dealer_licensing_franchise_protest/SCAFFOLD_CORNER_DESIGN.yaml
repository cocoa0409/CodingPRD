      - name: deficiency_scan_must_run_before_an_approval_is_allowed
        claim_type: cascading_validation
        grounds:
          - validations.priority_21_ERR_APPLICATION_HAS_DEFICIENCIES
          - calculations.application_deficiency_scan
          - state_machines.LicenseApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: "The approval gate depends on the result of the deficiency scan: an application whose facility is 5000 sqft against the 8000 NEW_MOTOR_VEHICLE minimum is refused 422 ERR_APPLICATION_HAS_DEFICIENCIES, the statutory minimums are not waivable, and the dealer stays PROSPECTIVE with no licence dates."
        test_recipe:
          setup:
