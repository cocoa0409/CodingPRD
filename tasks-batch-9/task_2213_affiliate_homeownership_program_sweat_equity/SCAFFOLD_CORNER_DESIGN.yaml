  # ===========================================================================
  # SECTION 2 — From Table 2 (State Machines)
  # Valid Transition / Precondition Enforcement / Side Effect Execution /
  # Invalid Transitions / Initial State / Terminal State Lockdown / Idempotency,
  # plus the `branching` shape rows and the side-effect patterns cascade_down,
  # cross_entity, ledger_sync and compensation.
  # Precondition-enforcement probes for the business gates (documentation,
  # AMI band, quorum, fill, affordability, closing prerequisites) live in the
  # validations section, where each has a §1.4 priority row to ground it.
  # ===========================================================================
  - section: state_machines
    instances:

      - name: every_new_row_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds: [state_machines.ApplicantHousehold.selection_status, state_machines.ApplicantHousehold.partnership_readiness, state_machines.BuildSite.readiness_status, state_machines.ConstructionShift.status, state_machines.ShiftAssignment.status]
        distinguishing_aspect: "Five state dimensions are asserted at birth with no transition call in between: DRAFT, NOT_READY, RAW_LAND, SCHEDULED, RESERVED. The two parallel household dimensions start independently, and a site starts at RAW_LAND even when its parcel is fully paid for. The initial states of SweatEquityEntry (CLAIMED), EducationEnrollment (ENROLLED) and MortgageApplication (DRAFT + lien NONE) are asserted by read_endpoints_return_the_stored_row_for_every_aggregate, which already stages the SELECTED prefix they require."
        test_recipe:
          setup:
            - "Canonical program; a second site is advanced to READY_TO_BUILD only so a shift and a seat can be created — the audited site is left untouched at RAW_LAND."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-2002", street_address: "44 Oak St", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { host_site_id: $.data.id } }
            - { call: "POST /homeownership/build-sites/${host_site_id}/readiness-advance", payload: { step: "TITLE", document_reference: "TITLE-2002" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${host_site_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "ENV-2002" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${host_site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "UTL-2002" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/volunteers", payload: { program_id: "${prog_id}", full_name: "Dana Reyes", birth_date: "1990-04-10T00:00:00.000Z", waiver_expires_on: "2027-12-31T00:00:00.000Z" }, as: ConstructionManager, as_user_id: "cm-1", captures: { vol_id: $.data.id } }
          trigger:
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${host_site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-05T08:00:00.000Z", end_at: "2026-08-05T12:00:00.000Z", volunteer_slots: 2 }, as: ConstructionManager, as_user_id: "cm-1", captures: { shift_id: $.data.id, shift_v: $.data.version } }
            - { call: "POST /homeownership/shift-assignments", payload: { shift_id: "${shift_id}", expected_shift_version: "${shift_v}", role: "GENERAL_VOLUNTEER", volunteer_id: "${vol_id}" }, as: ConstructionManager, as_user_id: "cm-1", captures: { asg_id: $.data.id } }
          assert:
            - "Household ${hh_id}: selection_status == DRAFT AND partnership_readiness == NOT_READY in the very same 201 response — the two parallel dimensions each start at their own declared initial value"
            - "Site ${site_id}: readiness_status == RAW_LAND, title_cleared == false, environmental_cleared == false, utilities_cleared == false, safety_posture == CLEAR, pre_hold_readiness_status == null"
            - "Shift ${shift_id}: status == SCHEDULED (not OPEN — opening is an explicit hop)"
            - "Assignment ${asg_id}: status == RESERVED (not CONFIRMED) and checked_in_at == null, even though a ConstructionManager created it"
            - "No transition endpoint was called on any of the four rows, so each value is the declared initial_state and not a side effect"

      - name: draft_household_rejects_screening_and_committee_hops
        claim_type: invalid_transitions
        grounds: ["state_machines.ApplicantHousehold.selection_status.SUBMITTED_to_SCREENING", "state_machines.ApplicantHousehold.selection_status.SCREENING_to_COMMITTEE_REVIEW", "state_machines.ApplicantHousehold.selection_status.COMMITTEE_REVIEW_to_SELECTED", "state_machines.ApplicantHousehold.selection_status.COMMITTEE_REVIEW_to_SCREENING", "validations[priority=10]", errors.ERR_TRANSITION_NOT_ALLOWED]
        distinguishing_aspect: "From DRAFT the only declared trigger is submit; the four later triggers (screen, committee-referral, return-to-screening, selection-decision) each carry a well-formed payload and an authorised role yet must all fail with ERR_TRANSITION_NOT_ALLOWED, and none of them may leave a partial write behind."
