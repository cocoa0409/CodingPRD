      - name: fraud_confirm_suspends_policyholder_and_denies_claim_depth2
        grounds:
          - state_machines.FraudAlert.OPEN_to_CONFIRMED
          - state_machines.Claim.FRAUD_HOLD_to_DENIED
          - entities.Policyholder.fields.status
        distinguishing_aspect: |
          Depth-2 cascade originating at fraud-alert resolve: resolve(CONFIRMED)
          on a SCORE_THRESHOLD alert -> linked Claim FRAUD_HOLD -> DENIED, and
          that denial itself mutates Policyholder.status -> SUSPENDED; trigger
          differs from warranty-decide and invoice-pay cascades.
        test_recipe:
          setup:
            - "FL regulation (tax 0); policyholder with COMPREHENSIVE policy"
            - "policyholder fraud_score already 100 (two prior claims 40 days apart -> REPEAT_WINDOW +40, then a solicitation disclosure +35, then another repeat-window claim +25... pinned: score 100 before intake)"
            - "a new claim intake lands in FRAUD_HOLD with a SCORE_THRESHOLD alert OPEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /state-regulations"
              payload: { state_code: "FL", zero_deductible_windshield: false, glass_sales_tax_rate_bp: 0 }
              as: NetworkAdmin
            - call: "POST /policyholders"
              payload: { full_name: "Fraud Cas", email: "fc@x.com", phone: "555-0403", state_code: "FL" }
              as: NetworkAdmin
              captures: { ph_id: "$.data.id" }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-FC-1", state_code: "FL", coverage_type: "COMPREHENSIVE", deductible_cents: 50000, oem_endorsement: false, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: "$.data.id" }
            # claim 1 at day 0 (score 0 -> SUBMITTED)
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "FL", service_zip_code: "33601", part_category: "WINDSHIELD", loss_date: "2026-02-01", description: "f1", requires_adas_calibration: false, estimated_repair_cost_cents: 50000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c1: "$.data.id" }
            # solicitation disclosure on claim 1: +35 (score 35)
            - call: "POST /claims/${c1}/choice-disclosures"
              payload: { disclosure_channel: "IN_PERSON", shop_solicited: true, customer_selected_shop_name: "Solo Glass", informed_of_network_options: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            # claim 2 within 90 days of claim 1: REPEAT_WINDOW +40 (score 75)
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "FL", service_zip_code: "33601", part_category: "WINDSHIELD", loss_date: "2026-03-01", description: "f2", requires_adas_calibration: false, estimated_repair_cost_cents: 50000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c2: "$.data.id" }
            # solicitation on claim 2: +35 (score 110 >= 100 -> crossing -> SCORE_THRESHOLD alert created too)
            - call: "POST /claims/${c2}/choice-disclosures"
              payload: { disclosure_channel: "PHONE", shop_solicited: true, customer_selected_shop_name: "Solo Glass", informed_of_network_options: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            # claim 3: intake with score 110 >= 100 -> FRAUD_HOLD with own SCORE_THRESHOLD alert
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "FL", service_zip_code: "33601", part_category: "WINDSHIELD", loss_date: "2026-04-01", description: "f3", requires_adas_calibration: false, estimated_repair_cost_cents: 50000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c3: "$.data.id", c3_status: "$.data.status" }
            - call: "GET /fraud-alerts?claim_id=${c3}"
              as: FraudInvestigator
              captures: { thresh_alert_id: "$.data[0].id" }
          trigger:
            - call: "POST /fraud-alerts/${thresh_alert_id}/resolve"
              payload: { resolution: "CONFIRMED", resolution_notes: "confirmed fraud ring" }
              as: FraudInvestigator
          assert:
            - "claim ${c3} was created in FRAUD_HOLD (c3_status == FRAUD_HOLD)"
            - "after resolve: FraudAlert.${thresh_alert_id}.status == CONFIRMED"
            - "Claim.${c3}.status == DENIED (FRAUD_HOLD -> DENIED cascade)"
            - "Policyholder.${ph_id}.status == SUSPENDED (second cascade hop)"
