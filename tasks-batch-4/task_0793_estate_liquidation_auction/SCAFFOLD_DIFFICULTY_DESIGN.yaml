              payload: { lot_id: "${lb_id}", buyer_id: "${b1_id}", amount_cents: 10000, expected_lot_version: "${lbv}" }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /estates/${eb_id}/close"
              payload: {}
              as: Operator
            - call: "GET /orders"
              payload: { estate_id: "${eb_id}" }
              as: Operator
              captures: { ob_id: "$.data[0].id" }
            - call: "POST /orders/${ob_id}/pay"
              payload: { amount_cents: 12690 }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /pickup-windows"
              payload: { estate_id: "${ea_id}", starts_at: "2026-03-25T09:00:00Z", ends_at: "2026-03-25T12:00:00Z", capacity: 5 }
              as: Operator
              captures: { wa_id: $.data.id }
            - call: "POST /pickup-windows"
