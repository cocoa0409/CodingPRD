              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
            - call: "POST /ccs/geologic-models/${model_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/submit"
              payload: { submission_note: "initial site characterization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/review"
              payload: { decision: "ACCEPT", review_note: "seal integrity acceptable" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/geologic-models/${model_id}/finalize-aor"
              payload: {}
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/legacy-wellbores"
              payload: { project_id: "${proj_id}", api_number: "15-001-00001", distance_from_injector_km: 0.5, total_depth_m: 2000, penetrates_seal: true, plug_condition: "OPEN_HOLE", plug_record_available: false }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { w1_id: $.data.id, w1_status: $.data.corrective_action_status }
            - call: "POST /ccs/legacy-wellbores"
              payload: { project_id: "${proj_id}", api_number: "15-001-00002", distance_from_injector_km: 1.0, total_depth_m: 1200, penetrates_seal: false, plug_condition: "PARTIALLY_PLUGGED", plug_record_available: false }
              as: ProjectDeveloper
