# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2745_large_format_led_display_manufacturing
#
# 24 instances across the nine §0.5 rule_ids (>= 2 each).
#
# Three DisplayModel fixtures are used throughout, chosen so that every
# assertion literal below is exact:
#
#   FP10-IN   1 module / cabinet   cabinet_pixel_count 1024   cab_area 0.1024
#             required_load 100.00  dead_pixel_ppm_limit 976.56  burn_in 24h
#   FP16-STD  2 modules / cabinet  cabinet_pixel_count 4096   cab_area 0.1024
#             required_load 150.00  dead_pixel_ppm_limit 500.00 burn_in 24h
#   FP25-OUT  4 modules / cabinet  cabinet_pixel_count 32768  cab_area 0.2048
#             required_load 100.10  dead_pixel_ppm_limit 122.07 burn_in 48h
#
# Canonical clock timeline: default 2026-08-01T00:00:00.000Z ->
# burn-in window 08-02 .. 08-03 (or 08-04 for FP25) -> visit window
# 2026-08-05T08:00 .. 16:00 -> sign-off at 2026-08-05T09:00 (warranty zero
# point) -> warranty case reported 2027-02-05T09:00 (184 days = 6 months).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: warranty_credit_pro_rata_vs_shortfall_severity_diverge
        grounds:
          - calculations.case_warranty_credit_cents
          - entities.ServiceCase.fields.assessment_basis
          - entities.ServiceCase.fields.credit_cents
          - state_machines.ServiceCase.RESPONDED_to_APPROVED
        distinguishing_aspect: |
          Two ServiceCase rows carrying byte-identical warranty data (same
          contract, same cabinet, same reported_at, same measured_brightness_nits)
          yield credit_cents 92160 under PRO_RATA_REMAINING_TERM and 7680 under
          SHORTFALL_SEVERITY — a 12x divergence on the ServiceCase/warranty
          domain, which is a different entity domain from the Cabinet-quality
          dual variant in cabinet_uniformity_as_built_vs_qa_baseline_diverge.
        test_recipe:
          setup:
            - "FP10-IN display model exists (1 module per cabinet, cabinet_pixel_count 1024, cabinet_area_sqm 0.1024, price_per_sqm_cents 1000000, rated_brightness_nits 5000, dead_pixel_ppm_limit 976.56, burn_in_hours_required 24)."
            - "A 1x1 RETAIL project on that model with engineering_state APPROVED and production_state COMMISSIONED."
            - "Its single cabinet holds one INSTALLED module (measured_brightness_nits 4900, dead_pixel_count 1) and is MOUNTED."
            - "A GOLD service contract (spare_pct_bp 300, term_months 60) is ACTIVE with warranty_start_at 2026-08-05T09:00:00.000Z, response_hours 8, spare_required_count 1, annual_fee_cents 31943."
            - "Logical clock is at 2027-02-05T09:00:00.000Z — 184 days = 6 elapsed warranty months."
            - "Two BRIGHTNESS_DEGRADATION / MAJOR cases are both RESPONDED, each with measured_brightness_nits 4600."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Retail One", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 100.00, wind_load_kph: 100, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev: $.data.id }
            - call: "POST /drawing-revisions/${rev}/review"
              payload: { decision: "APPROVE" }
              as: StructuralReviewer
              as_user_id: "rev-1"
            - call: "POST /cabinets"
              payload: { project_id: "${pj}", grid_row: 1, grid_col: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cab: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-1" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m1: $.data.id }
            - call: "POST /modules/${m1}/pixel-test"
              payload: { dead_pixel_count: 1, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m1}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_color_x: 0.3130, measured_color_y: 0.3292 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /cabinets/${cab}"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cabv1: $.data.version }
            - call: "POST /cabinets/${cab}/modules"
              payload: { module_id: "${m1}", slot_index: 1, expected_cabinet_version: "${cabv1}" }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /burn-in-chambers"
              payload: { name: "CH-1", slot_capacity: 4, turnaround_minutes: 60, certified_max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { ch: $.data.id }
            - call: "POST /burn-in-runs"
              payload: { cabinet_id: "${cab}", burn_in_chamber_id: "${ch}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-03T00:00:00.000Z", slots_required: 1, drive_pct: 80, ambient_c: 45.0 }
              as: QAEngineer
              as_user_id: "qa-1"
              captures: { run: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /burn-in-runs/${run}/complete"
              payload: { new_dead_pixel_count: 0, measured_brightness_nits: 4900, measured_uniformity_pct: 95.00 }
              as: QAEngineer
              as_user_id: "qa-1"
            - call: "POST /cabinets/${cab}/qa-approve"
              as: QAEngineer
              as_user_id: "qa-1"
            - call: "POST /commissioning-crews"
              payload: { name: "Crew West", region_code: "NA-W", certification_level: "L3" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { crew: $.data.id }
            - call: "POST /cabinets/${cab}/mount"
              as: FieldEngineer
              as_user_id: "${crew}"
            - call: "POST /service-contracts"
              payload: { project_id: "${pj}", tier: "GOLD", spare_pct_bp: 300, term_months: 60 }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { sc: $.data.id }
            - call: "POST /commissioning-visits"
              payload: { project_id: "${pj}", commissioning_crew_id: "${crew}", window_start: "2026-08-05T08:00:00.000Z", window_end: "2026-08-05T16:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { vis: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /commissioning-visits/${vis}/arrive"
              as: FieldEngineer
              as_user_id: "${crew}"
            - call: "POST /commissioning-visits/${vis}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_uniformity_pct: 95.00 }
              as: FieldEngineer
              as_user_id: "${crew}"
            - call: "POST /commissioning-visits/${vis}/sign-off"
              as: FieldEngineer
              as_user_id: "${crew}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-05T09:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /service-cases"
              payload: { service_contract_id: "${sc}", cabinet_id: "${cab}", case_type: "BRIGHTNESS_DEGRADATION", severity: "MAJOR", symptom: "Panel measurably dim at 4600 nits", measured_brightness_nits: 4600 }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { case_a: $.data.id }
            - call: "POST /service-cases"
              payload: { service_contract_id: "${sc}", cabinet_id: "${cab}", case_type: "BRIGHTNESS_DEGRADATION", severity: "MAJOR", symptom: "Second claim, identical measurement", measured_brightness_nits: 4600 }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { case_b: $.data.id }
            - call: "POST /service-cases/${case_a}/respond"
              as: ServiceManager
              as_user_id: "svc-1"
            - call: "POST /service-cases/${case_b}/respond"
              as: ServiceManager
              as_user_id: "svc-1"
          trigger:
            - call: "POST /service-cases/${case_a}/assess"
              payload: { decision: "APPROVE", assessment_basis: "PRO_RATA_REMAINING_TERM" }
              as: ServiceManager
              as_user_id: "svc-1"
            - call: "POST /service-cases/${case_b}/assess"
              payload: { decision: "APPROVE", assessment_basis: "SHORTFALL_SEVERITY" }
              as: ServiceManager
              as_user_id: "svc-1"
          assert:
            - "ServiceCase.${case_a}.elapsed_warranty_months == 6"
            - "ServiceCase.${case_a}.allowed_degradation_pct == 5.00"
            - "ServiceCase.${case_a}.degradation_pct == 8.00"
            - "ServiceCase.${case_a}.shortfall_pct == 3.00"
            - "ServiceCase.${case_a}.credit_cents == 92160"
            - "ServiceCase.${case_b}.shortfall_pct == 3.00"
            - "ServiceCase.${case_b}.credit_cents == 7680"
            - "ServiceCase.${case_a}.credit_cents - ServiceCase.${case_b}.credit_cents == 84480"
            - "ServiceCase.${case_a}.resolved_faulty_module_id == ${m1}"
            - "ServiceCase.${case_b}.resolved_faulty_module_id == ${m1}"
            - "ServiceCase.${case_a}.case_state == APPROVED and ServiceCase.${case_b}.case_state == APPROVED"

      - name: cabinet_uniformity_as_built_vs_qa_baseline_diverge
        grounds:
          - calculations.cabinet_uniformity_score
          - entities.Cabinet.fields.as_built_uniformity_score
          - entities.Cabinet.fields.baseline_uniformity_score
          - entities.Cabinet.fields.baseline_module_ids
          - state_machines.Cabinet.BURN_IN_to_BURN_IN_PASSED
        distinguishing_aspect: |
          On the Cabinet manufacturing-quality domain (not the ServiceCase
          warranty domain), the AS_BUILT variant reads the currently INSTALLED
          module set and drops to 95.34 after a warranty swap while the
          QA_BASELINE variant stays frozen at the burn-in-pass value 97.88 over
          Cabinet.baseline_module_ids — a 2.54 delta from identical stored rows.
        test_recipe:
          setup:
            - "FP16-STD display model exists (2 modules per cabinet, cabinet_pixel_count 4096, cabinet_area_sqm 0.1024, required_load_kg_per_sqm 150.00, dead_pixel_ppm_limit 500.00)."
            - "A 1x1 RETAIL project on that model is COMMISSIONED; its cabinet is MOUNTED with modules M-1 (4900 nits, x 0.3130, y 0.3292) and M-2 (4950 nits, x 0.3128, y 0.3291) INSTALLED in slots 1 and 2."
            - "Cabinet.baseline_uniformity_score was frozen at 97.88 when the burn-in run PASSED."
            - "A GOLD contract is ACTIVE with spare_required_count 1 and one reserved A1 spare S-1 (4850 nits, x 0.3124, y 0.3287)."
            - "A BRIGHTNESS_DEGRADATION / MAJOR case reported at 2027-02-05T09:00:00.000Z is APPROVED under SHORTFALL_SEVERITY, with resolved_faulty_module_id = M-1 (the dimmer installed module)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP16-STD", pixel_pitch_mm: 5.0, rated_brightness_nits: 5000, environmental_rating: "IP65_FULL", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 64, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 2, cabinet_weight_kg: 15.36, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 500.00, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Retail Two", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 5.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 150.00, wind_load_kph: 100, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev: $.data.id }
            - call: "POST /drawing-revisions/${rev}/review"
              payload: { decision: "APPROVE" }
              as: StructuralReviewer
              as_user_id: "rev-1"
            - call: "POST /cabinets"
              payload: { project_id: "${pj}", grid_row: 1, grid_col: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cab: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-1" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m1: $.data.id }
            - call: "POST /modules/${m1}/pixel-test"
              payload: { dead_pixel_count: 1, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m1}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_color_x: 0.3130, measured_color_y: 0.3292 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-2" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m2: $.data.id }
            - call: "POST /modules/${m2}/pixel-test"
              payload: { dead_pixel_count: 1, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m2}/calibrate"
              payload: { measured_brightness_nits: 4950, measured_color_x: 0.3128, measured_color_y: 0.3291 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /cabinets/${cab}"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cabv1: $.data.version }
            - call: "POST /cabinets/${cab}/modules"
              payload: { module_id: "${m1}", slot_index: 1, expected_cabinet_version: "${cabv1}" }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /cabinets/${cab}"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cabv2: $.data.version }
            - call: "POST /cabinets/${cab}/modules"
              payload: { module_id: "${m2}", slot_index: 2, expected_cabinet_version: "${cabv2}" }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /burn-in-chambers"
              payload: { name: "CH-1", slot_capacity: 4, turnaround_minutes: 60, certified_max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { ch: $.data.id }
            - call: "POST /burn-in-runs"
              payload: { cabinet_id: "${cab}", burn_in_chamber_id: "${ch}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-03T00:00:00.000Z", slots_required: 1, drive_pct: 80, ambient_c: 45.0 }
              as: QAEngineer
              as_user_id: "qa-1"
              captures: { run: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /burn-in-runs/${run}/complete"
              payload: { new_dead_pixel_count: 0, measured_brightness_nits: 4900, measured_uniformity_pct: 95.00 }
              as: QAEngineer
              as_user_id: "qa-1"
            - call: "POST /cabinets/${cab}/qa-approve"
              as: QAEngineer
              as_user_id: "qa-1"
            - call: "POST /commissioning-crews"
              payload: { name: "Crew West", region_code: "NA-W", certification_level: "L3" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { crew: $.data.id }
            - call: "POST /cabinets/${cab}/mount"
              as: FieldEngineer
              as_user_id: "${crew}"
            - call: "POST /service-contracts"
              payload: { project_id: "${pj}", tier: "GOLD", spare_pct_bp: 300, term_months: 60 }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { sc: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "S-1" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m3: $.data.id }
            - call: "POST /modules/${m3}/pixel-test"
              payload: { dead_pixel_count: 1, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m3}/calibrate"
              payload: { measured_brightness_nits: 4850, measured_color_x: 0.3124, measured_color_y: 0.3287 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /service-contracts/${sc}"
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { scv1: $.data.version }
            - call: "POST /service-contracts/${sc}/spare-reservations"
              payload: { module_id: "${m3}", expected_service_contract_version: "${scv1}" }
              as: ServiceManager
              as_user_id: "svc-1"
            - call: "POST /commissioning-visits"
              payload: { project_id: "${pj}", commissioning_crew_id: "${crew}", window_start: "2026-08-05T08:00:00.000Z", window_end: "2026-08-05T16:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { vis: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /commissioning-visits/${vis}/arrive"
              as: FieldEngineer
              as_user_id: "${crew}"
            - call: "POST /commissioning-visits/${vis}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_uniformity_pct: 95.00 }
              as: FieldEngineer
              as_user_id: "${crew}"
            - call: "POST /commissioning-visits/${vis}/sign-off"
              as: FieldEngineer
              as_user_id: "${crew}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-05T09:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /service-cases"
              payload: { service_contract_id: "${sc}", cabinet_id: "${cab}", case_type: "BRIGHTNESS_DEGRADATION", severity: "MAJOR", symptom: "Wall visibly uneven after six months", measured_brightness_nits: 4600 }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { case: $.data.id }
            - call: "POST /service-cases/${case}/respond"
              as: ServiceManager
              as_user_id: "svc-1"
            - call: "POST /service-cases/${case}/assess"
              payload: { decision: "APPROVE", assessment_basis: "SHORTFALL_SEVERITY" }
              as: ServiceManager
              as_user_id: "svc-1"
            - call: "GET /cabinets/${cab}"
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { cabv_f: $.data.version }
          trigger:
            - call: "POST /service-cases/${case}/fulfil"
              payload: { replacement_module_id: "${m3}", expected_cabinet_version: "${cabv_f}" }
              as: ServiceManager
              as_user_id: "svc-1"
          assert:
            - "Cabinet.${cab}.baseline_uniformity_score == 97.88"
            - "Cabinet.${cab}.as_built_uniformity_score == 95.34"
            - "Cabinet.${cab}.baseline_uniformity_score - Cabinet.${cab}.as_built_uniformity_score == 2.54"
            - "Cabinet.${cab}.baseline_module_ids == [${m1}, ${m2}]"
            - "Cabinet.${cab}.installed_module_count == 2"
            - "Cabinet.${cab}.occupied_slot_indexes == [1, 2]"
            - "Cabinet.${cab}.dead_pixel_ppm == 488.28"
            - "Module.${m1}.module_state == RETURNED"
            - "Module.${m3}.module_state == INSTALLED and Module.${m3}.slot_index == 1 and Module.${m3}.replaces_module_id == ${m1}"
            - "ServiceCase.${case}.credit_cents == 7680"

  - rule_id: combinatorial_formula
    instances:
      - name: project_data_load_pct_nested_min_ceil_floor
        grounds:
          - calculations.project_data_load_pct
          - entities.DisplayProject.fields.required_data_mbps
          - entities.DisplayProject.fields.effective_capacity_mbps
          - entities.DisplayProject.fields.data_load_pct
          - validations.priority_53
        distinguishing_aspect: |
          Combinatorial mode (a) — nested rounding: an inner ceil() over the raw
          pixel-bandwidth product feeds an outer min() over two independent
          capacity ceilings, and only then a two-decimal ROUND_HALF_UP ratio.
          The fixture sits the outer ratio exactly on MAX_DATA_LOAD_PCT
          (236 / 236 -> 100.00 accepted) so a floor() instead of ceil() on the
          inner step (235.93 -> 235) silently turns the accepted project into a
          100.43 rejection. Mode differs from the round-then-sum ordering of
          contract_amount_round_per_cabinet_then_sum and from the
          threshold-on-intermediate of
          service_contract_fee_discount_tier_from_subtotal_only.
        test_recipe:
          setup:
