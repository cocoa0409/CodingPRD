# =============================================================================
# PRD Benchmark Scaffold — Task 2853
# Retailer Installation Services Program
# §1.0–§1.7 (design indices live in the two sibling files)
# =============================================================================

scenario: |
  2853. Retailer Installation Services Program (home improvement retailer installation services):
  service catalog with scope definitions, pricing and measurement requirements by category,
  installer network recruitment with licensing, insurance and background verification by trade
  and jurisdiction, in-home measurement scheduling with detail capture and change-order triggers,
  permit responsibility determination and inspection coordination by jurisdiction, project
  scheduling, material delivery synchronization and installer assignment, customer change
  requests, upcharges and cancellation policy with deposit handling, quality inspection, punch
  list and warranty on labor with escalation to a service manager, installer scorecard on
  quality, timeliness and customer satisfaction with removal criteria

domain_name: retailer-installation-services
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys carried in request bodies. No
  # entity is nested more than one segment deep under another entity's path;
  # every child is addressable at its own top-level collection
  # (/measurements/{id}, /change-orders/{id}, /installer-assignments/{id}, ...)
  # and discovered through filtered-list GETs on its FK fields.

  state_machine_shape: parallel
  # Project carries THREE independent status dimensions that advance on
  # different triggers and are asserted independently:
  #   fulfillment_status x financial_status x permit_status
  # Two further machines are cyclic (ChangeOrder revision loop; Installer
  # ACTIVE <-> PROBATION scorecard loop) and one is a revert-capable branch
  # (InstallerAssignment HELD/CONFIRMED -> RELEASED -> project reverts).

  relationship_patterns:
    - one_to_many          # Project -> Measurement / ChangeOrder / PunchListItem
    - many_to_many         # Installer <-> Jurisdiction via InstallerCredential
    - self_referential     # ChangeOrder.supersedes_change_order_id -> ChangeOrder.id
    - cross_aggregate      # InstallerAssignment couples Project and Installer aggregates

  role_model: peer_roles
  # ProgramAdmin owns catalog/jurisdiction config, NetworkManager owns the
  # installer network, ProjectCoordinator owns project execution, ServiceManager
  # owns escalation/warranty/removal, Installer and Customer act only on their
  # own resources. ServiceManager is NOT a superset of the other operator roles.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- catalog ---
  - name: ServiceCategory
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Retailer-facing catalog code, unique across all ServiceCategory rows"
        constraints: "1-32 chars, uppercase letters/digits/hyphen; uniqueness is case-sensitive"
      - name: name
        type: string
        source: input
        description: "Customer-facing category name"
        constraints: "1-120 chars"
      - name: trade_code
        type: enum
        source: input
        description: "Trade an installer must be licensed in to work this category"
        constraints: "one of {FLOORING, GLAZING, HVAC, ROOFING, MILLWORK}"
      - name: unit_of_measure
        type: enum
        source: input
        description: "Billing unit for labor on this category"
        constraints: "one of {SQFT, LINEAR_FT, EACH}"
      - name: base_labor_rate_cents_per_unit
        type: integer
        source: input
        description: "Tier-1 labor rate in cents per unit_of_measure"
        constraints: ">= 1"
      - name: minimum_billable_units
        type: number
        source: input
        description: "Floor applied to billable units before tiering; does NOT affect permit thresholds"
        constraints: ">= 0, at most 2 decimal places"
      - name: measurement_required
        type: boolean
        source: input
        description: "When true a COMPLETED Measurement is required before an InstallerAssignment can be created"
      - name: measurement_validity_days
        type: integer
        source: input
        default: 45
        description: "Days a COMPLETED Measurement stays usable for scheduling, counted from Measurement.completed_at"
        constraints: ">= 1"
      - name: permit_policy
        type: enum
        source: input
        default: BY_JURISDICTION
        description: "How permit necessity is decided for projects in this category"
        constraints: "one of {NEVER, ALWAYS, BY_JURISDICTION}"
      - name: deposit_pct
        type: number
        source: input
        default: 0.30
        description: "Fraction of Project.quoted_labor_cents the customer must deposit before scheduling"
        constraints: "> 0 and <= 1, at most 2 decimal places"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: "ACTIVE categories accept new projects; RETIRED categories do not"
        constraints: "one of {ACTIVE, RETIRED}"

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Permitting jurisdiction code, unique across all Jurisdiction rows"
        constraints: "1-16 chars, uppercase letters/digits/hyphen"
      - name: name
        type: string
        source: input
        description: "Jurisdiction display name"
        constraints: "1-120 chars"
      - name: permit_required_trades
        type: array
        source: input
        description: "Trade codes that require a permit in this jurisdiction when permit_policy is BY_JURISDICTION"
        constraints: "array of {FLOORING, GLAZING, HVAC, ROOFING, MILLWORK}; may be empty"
      - name: permit_unit_threshold
        type: number
        source: input
        default: 0
        description: "Permit is required only when Project.effective_units >= this value (inclusive lower bound)"
        constraints: ">= 0"
      - name: permit_responsible_party
        type: enum
        source: input
        description: "Party that must pull the permit in this jurisdiction before an override is applied"
        constraints: "one of {RETAILER, INSTALLER, CUSTOMER}"
      - name: inspection_required
        type: boolean
        source: input
        description: "When true an ISSUED permit must reach INSPECTION_PASSED before the project can close"
      - name: inspection_lead_days
        type: integer
        source: input
        default: 3
        description: "Minimum whole days between the logical clock and an inspection slot_start"
        constraints: ">= 0"
      - name: max_concurrent_inspections
        type: integer
        source: input
        default: 2
        description: "Number of Projects in this jurisdiction that may hold overlapping inspection slots"
        constraints: ">= 1"
      - name: background_check_recency_days
        type: integer
        source: input
        default: 365
        description: "Maximum age of Installer.background_check_completed_at accepted for work in this jurisdiction"
        constraints: ">= 1"
      - name: min_liability_coverage_cents
        type: integer
        source: input
        description: "Minimum Installer.liability_coverage_cents accepted for work in this jurisdiction"
        constraints: ">= 0"
      - name: license_required
        type: boolean
        source: input
        default: true
        description: "When true an InstallerCredential with verification_status VERIFIED is required for this jurisdiction"
      - name: labor_complexity_multiplier
        type: number
        source: input
        default: 1.00
        description: "Multiplier applied to (base_cents + surcharge_cents) in the project_labor_charge calculation"
        constraints: "> 0, at most 2 decimal places"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: "ACTIVE jurisdictions accept new projects and assignments; SUSPENDED jurisdictions do not"
        constraints: "one of {ACTIVE, SUSPENDED}"

  # ------------------------------------------------------- installer network ---
  - name: Installer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal business name of the installer firm"
        constraints: "1-160 chars"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email"
        constraints: "must contain '@'"
      - name: primary_trade_code
        type: enum
        source: input
        description: "Trade the firm was recruited for; must match at least one credential trade_code to activate"
        constraints: "one of {FLOORING, GLAZING, HVAC, ROOFING, MILLWORK}"
      - name: liability_coverage_cents
        type: integer
        source: input
        description: "General liability coverage limit in cents"
        constraints: ">= 0"
      - name: insurance_expires_on
        type: datetime
        source: input
        description: "Instant the liability policy lapses; compared with the logical clock using strict '>'"
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: status
        type: enum
        source: system
        default: APPLIED
        description: "Network lifecycle state; see the Installer state machine"
        constraints: "one of {APPLIED, DOCS_PENDING, VERIFIED, ACTIVE, PROBATION, SUSPENDED, REMOVED}"
      - name: background_check_completed_at
        type: datetime
        source: system
        default: null
        description: "Instant the most recent background check finished; set by POST /installers/{id}/background-check"
      - name: background_check_result
        type: enum
        source: system
        default: NONE
        description: "Result of the most recent background check"
        constraints: "one of {NONE, PASS, FAIL}"
      - name: committed_minutes
        type: integer
        source: computed
        default: 0
        description: "Sum of InstallerAssignment.duration_minutes over this installer's assignments with status IN {HELD, CONFIRMED, IN_PROGRESS, COMPLETED}"
      - name: verified_credential_count
        type: integer
        source: computed
        default: 0
        description: "Count of InstallerCredential rows for this installer with verification_status == VERIFIED"
      - name: rolling_event_count
        type: integer
        source: computed
        default: 0
        description: "Count of ScorecardEvent rows for this installer with occurred_at >= clock_now - 90 days (inclusive)"
      - name: rolling_no_show_count
        type: integer
        source: computed
        default: 0
        description: "Count of ScorecardEvent rows with event_type == NO_SHOW and occurred_at >= clock_now - 90 days (inclusive)"
      - name: completed_project_count
        type: integer
        source: computed
        default: 0
        description: "Count of InstallerAssignment rows for this installer with status == COMPLETED"
      - name: quality_score
        type: number
        source: computed
        default: 85.00
        description: "ROLLING_90D variant of the quality dimension from installer_scorecard; 2 decimal places"
        constraints: "0.00 - 100.00"
      - name: timeliness_score
        type: number
        source: computed
        default: 85.00
        description: "ROLLING_90D variant of the timeliness dimension from installer_scorecard; 2 decimal places"
        constraints: "0.00 - 100.00"
      - name: satisfaction_score
        type: number
        source: computed
        default: 85.00
        description: "ROLLING_90D variant of the satisfaction dimension from installer_scorecard; 2 decimal places"
        constraints: "0.00 - 100.00"
      - name: composite_score
        type: number
        source: computed
        default: 85.00
        description: "ROLLING_90D weighted composite from installer_scorecard; governs PROBATION and removal_eligible"
        constraints: "0.00 - 100.00"
      - name: lifetime_composite_score
        type: number
        source: computed
        default: 85.00
        description: "LIFETIME_DECAYED weighted composite from installer_scorecard; reporting only, never gates an action"
        constraints: "0.00 - 100.00"
      - name: removal_eligible
        type: boolean
        source: computed
        default: false
        description: "True when the removal criteria in installer_scorecard are met; POST /installers/{id}/remove requires it"
      - name: probation_started_at
        type: datetime
        source: system
        default: null
        description: "Instant status last became PROBATION; cleared to null when status returns to ACTIVE"
      - name: removed_at
        type: datetime
        source: system
        default: null
        description: "Instant status became REMOVED"
      - name: removal_reason
        type: string
        source: system
        default: null
        description: "Reason recorded by the ServiceManager on removal"

  - name: InstallerCredential
    parent: null
    common_fields: true
    fields:
      - name: installer_id
        type: string
        source: input
        description: "FK -> Installer.id; supplied as the path id on POST /installers/{id}/credentials"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the jurisdiction this license is valid in"
      - name: trade_code
        type: enum
        source: input
        description: "Trade this license covers"
        constraints: "one of {FLOORING, GLAZING, HVAC, ROOFING, MILLWORK}"
      - name: license_number
        type: string
        source: input
        description: "Trade license number as filed with the jurisdiction"
        constraints: "1-40 chars"
      - name: license_expires_on
        type: datetime
        source: input
        description: "Instant the license lapses; compared with the logical clock using strict '>'"
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: permit_pulling_authorized
        type: boolean
        source: input
        default: false
        description: "True when this license authorizes the installer to pull permits in this jurisdiction"
      - name: verification_status
        type: enum
        source: system
        default: PENDING
        description: "Verification lifecycle; see the InstallerCredential state machine"
        constraints: "one of {PENDING, VERIFIED, REJECTED, EXPIRED}"
      - name: verified_at
        type: datetime
        source: system
        default: null
        description: "Instant verification_status became VERIFIED"
      - name: rejection_reason
        type: string
        source: system
        default: null
        description: "Reason recorded when verification_status became REJECTED"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Customer full name"
        constraints: "1-120 chars"
      - name: email
        type: string
        source: input
        description: "Customer contact email"
        constraints: "must contain '@'"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the customer's billing jurisdiction"
      - name: project_count
        type: integer
        source: computed
        default: 0
        description: "Count of Project rows whose customer_id equals this customer's id"

  # ---------------------------------------------------------------- project ---
  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the purchasing customer"
      - name: service_category_id
        type: string
        source: input
        description: "FK -> ServiceCategory.id; must have status == ACTIVE at project creation"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the install-site permitting jurisdiction, which may differ from Customer.jurisdiction_id"
      - name: site_address
        type: string
        source: input
        description: "Install site street address"
        constraints: "1-200 chars"
      - name: estimated_units
        type: number
        source: input
        description: "Sales-desk unit estimate used for the PROVISIONAL labor quote"
        constraints: "> 0, at most 2 decimal places"
      - name: requested_install_date
        type: datetime
        source: input
        description: "Customer's requested install start; advisory only, never gates a transition"
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: fulfillment_status
        type: enum
        source: system
        default: DRAFT
        description: "Execution dimension; advances independently of financial_status and permit_status"
        constraints: "one of {DRAFT, MEASURE_PENDING, MEASURED, CHANGE_PENDING, SCHEDULED, IN_PROGRESS, INSTALL_COMPLETE, PUNCH_OPEN, CLOSED, CANCELLED}"
      - name: financial_status
        type: enum
        source: system
        default: QUOTED
        description: "Money dimension; advances independently of fulfillment_status and permit_status"
        constraints: "one of {QUOTED, DEPOSIT_HELD, BALANCE_DUE, SETTLED, PARTIALLY_REFUNDED, REFUNDED, FORFEITED}"
      - name: permit_status
        type: enum
        source: system
        description: "Permitting dimension; initial value is computed by permit_responsibility_determination at creation"
        constraints: "one of {NOT_REQUIRED, PENDING_APPLICATION, APPLIED, ISSUED, INSPECTION_SCHEDULED, INSPECTION_PASSED, INSPECTION_FAILED, CLOSED}"
      - name: permit_responsibility
        type: enum
        source: computed
        description: "Party responsible for pulling the permit, from permit_responsibility_determination"
        constraints: "one of {NOT_REQUIRED, RETAILER, INSTALLER, CUSTOMER}"
      - name: effective_units
        type: number
        source: computed
        description: "Units the system currently believes will be installed: latest COMPLETED Measurement.measured_units when one exists, otherwise estimated_units"
      - name: quoted_labor_cents
        type: integer
        source: computed
        description: "PROVISIONAL variant of project_labor_charge, frozen at project creation and never recomputed"
      - name: deposit_required_cents
        type: integer
        source: computed
        description: "round_half_up(quoted_labor_cents * ServiceCategory.deposit_pct); frozen with quoted_labor_cents"
      - name: deposit_paid_cents
        type: integer
        source: system
        default: 0
        description: "Cumulative cents the customer has deposited on this project; never decreases"
      - name: deposit_held_cents
        type: integer
        source: system
        default: 0
        description: "Deposit cents currently held and unallocated; conserved-quantity bucket 1 of 4"
      - name: deposit_applied_cents
        type: integer
        source: system
        default: 0
        description: "Deposit cents credited against total_due_cents; conserved-quantity bucket 2 of 4"
      - name: deposit_refunded_cents
        type: integer
        source: system
        default: 0
        description: "Deposit cents returned to the customer; conserved-quantity bucket 3 of 4"
      - name: deposit_forfeited_cents
        type: integer
        source: system
        default: 0
        description: "Deposit cents retained by the retailer under the cancellation policy; conserved-quantity bucket 4 of 4"
      - name: final_labor_cents
        type: integer
        source: computed
        default: null
        description: "FINAL variant of project_labor_charge, written when the InstallerAssignment reaches COMPLETED"
      - name: change_order_upcharge_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of ChangeOrder.upcharge_cents over this project's change orders with status == ACCEPTED and origin IN {CUSTOMER_REQUEST, SITE_CONDITION}"
      - name: permit_fee_cents_billed
        type: integer
        source: system
        default: 0
        description: "Permit fee passed through to the customer; set by POST /projects/{id}/permit/issue"
      - name: total_due_cents
        type: integer
        source: computed
        default: 0
        description: "final_labor_cents + change_order_upcharge_cents + permit_fee_cents_billed; 0 until final_labor_cents exists"
      - name: balance_due_cents
        type: integer
        source: computed
        default: 0
        description: "max(0, total_due_cents - deposit_applied_cents)"
      - name: permit_application_reference
        type: string
        source: system
        default: null
        description: "Jurisdiction application reference recorded by POST /projects/{id}/permit/apply"
      - name: permit_issued_on
        type: datetime
        source: system
        default: null
        description: "Instant the permit was issued"
      - name: inspection_slot_start
        type: datetime
        source: system
        default: null
        description: "Start of the reserved jurisdiction inspection slot (closed interval)"
      - name: inspection_slot_end
        type: datetime
        source: system
        default: null
        description: "End of the reserved jurisdiction inspection slot (closed interval, inclusive)"
      - name: inspection_result
        type: enum
        source: system
        default: NONE
        description: "Most recent jurisdiction inspection outcome"
        constraints: "one of {NONE, PASSED, FAILED}"
      - name: inspection_attempt_count
        type: integer
        source: system
        default: 0
        description: "Number of jurisdiction inspections recorded on this project"
      - name: quality_result
        type: enum
        source: system
        default: NONE
        description: "Retailer quality inspection outcome from POST /projects/{id}/quality-inspection"
        constraints: "one of {NONE, PASS, PASS_WITH_PUNCH, FAIL}"
      - name: workmanship_score
        type: integer
        source: system
        default: null
        description: "Quality inspector's workmanship score"
        constraints: "0 - 100"
      - name: escalated_punch_count
        type: integer
        source: computed
        default: 0
        description: "Count of PunchListItem rows for this project whose status is currently ESCALATED"
      - name: service_manager_review_required
        type: boolean
        source: computed
        default: false
        description: "True once any PunchListItem with severity == SAFETY on this project has reached ESCALATED"
      - name: install_completed_at
        type: datetime
        source: system
        default: null
        description: "Instant the InstallerAssignment reached COMPLETED"
      - name: cancelled_at
        type: datetime
        source: system
        default: null
        description: "Instant fulfillment_status became CANCELLED; the reinstate window is measured from here"
      - name: cancel_reason
        type: string
        source: system
        default: null
        description: "Reason recorded on cancellation"
      - name: closed_at
        type: datetime
        source: system
        default: null
        description: "Instant fulfillment_status became CLOSED; the labor warranty period starts here"

  # ------------------------------------------------- execution child records ---
  - name: Measurement
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; supplied as the path id on POST /projects/{id}/measurements"
      - name: scheduled_at
        type: datetime
        source: input
        description: "Booked in-home measurement appointment start"
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: technician_name
        type: string
        source: input
        description: "Measure technician name"
        constraints: "1-120 chars"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Measurement lifecycle; see the Measurement state machine"
        constraints: "one of {SCHEDULED, COMPLETED, VOIDED}"
      - name: completed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the measurement was completed; measurement freshness is counted from here"
      - name: measured_units
        type: number
        source: input
        default: null
        description: "Units actually measured on site; supplied on POST /measurements/{id}/complete"
        constraints: "> 0, at most 2 decimal places"
      - name: subfloor_condition
        type: enum
        source: input
        default: null
        description: "Captured site detail driving the subfloor remediation surcharge"
        constraints: "one of {NONE, MINOR, MAJOR}"
      - name: obstruction_count
        type: integer
        source: input
        default: null
        description: "Captured site detail: number of fixed obstructions to work around"
        constraints: ">= 0"
      - name: stair_flight_count
        type: integer
        source: input
        default: null
        description: "Captured site detail: number of stair flights material must be carried up"
        constraints: ">= 0"
      - name: access_notes
        type: string
        source: input
        default: null
        description: "Free-text access notes captured by the technician"
        constraints: "0-500 chars"
      - name: variance_pct
        type: number
        source: computed
        default: null
        description: "round_half_up(abs(measured_units - Project.estimated_units) / Project.estimated_units * 100, 2)"
      - name: change_order_triggered
        type: boolean
        source: computed
        default: false
        description: "True when variance_pct >= 10.00 at completion, which auto-creates a MEASUREMENT_VARIANCE ChangeOrder"
      - name: voided_reason
        type: string
        source: system
        default: null
        description: "Reason recorded when status became VOIDED by a cascade"

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project whose scope changes"
      - name: source_measurement_id
        type: string
        source: system
        default: null
        description: "FK -> Measurement.id; set only on auto-created MEASUREMENT_VARIANCE change orders"
      - name: supersedes_change_order_id
        type: string
        source: input
        default: null
        description: "FK -> ChangeOrder.id; the earlier change order this one replaces, which is driven to SUPERSEDED on creation"
      - name: origin
        type: enum
        source: input
        description: "Why the change order exists; drives which upcharge variant applies and how a DECLINED decision cascades"
        constraints: "one of {MEASUREMENT_VARIANCE, CUSTOMER_REQUEST, SITE_CONDITION}"
      - name: lines
        type: array
        source: input
        default: []
        description: "Ordered upcharge lines, each an object { unit_kind: one of {PRIMARY_UNITS, TRIM_LINEAR_FT, FIXTURE_EACH}, units_delta: number }; MUST be empty for origin MEASUREMENT_VARIANCE and non-empty otherwise"
        constraints: "0-10 entries; units_delta at most 2 decimal places and may be negative"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Change-order lifecycle; see the ChangeOrder state machine"
        constraints: "one of {DRAFT, PENDING_CUSTOMER, REVISION_REQUESTED, ACCEPTED, DECLINED, SUPERSEDED}"
      - name: upcharge_cents
        type: integer
        source: computed
        description: "Result of change_order_upcharge for this change order's origin variant; recomputed on every submit"
      - name: net_primary_units_delta
        type: number
        source: computed
        default: 0
        description: "Sum of lines[*].units_delta over entries whose unit_kind == PRIMARY_UNITS; informational, never feeds project_labor_charge"
      - name: revision_count
        type: integer
        source: system
        default: 0
        description: "Number of times this change order has re-entered PENDING_CUSTOMER from REVISION_REQUESTED"
      - name: revision_note
        type: string
        source: system
        default: null
        description: "Customer's note recorded with a REQUEST_REVISION decision"
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the customer's terminal decision was recorded"

  - name: MaterialDelivery
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; supplied as the path id on POST /projects/{id}/material-deliveries"
      - name: promised_window_start
        type: datetime
        source: input
        description: "Start of the promised delivery window"
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: promised_window_end
        type: datetime
        source: input
        description: "End of the promised delivery window; delivery_slack_hours is measured from here"
        constraints: "ISO 8601 UTC, strictly after promised_window_start"
      - name: sku_count
        type: integer
        source: input
        description: "Number of distinct SKUs on the delivery"
        constraints: ">= 1"
      - name: material_cost_cents
        type: integer
        source: input
        description: "Landed material cost in cents; the restocking fee is a fraction of this"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: "Delivery lifecycle; see the MaterialDelivery state machine"
        constraints: "one of {PLANNED, IN_TRANSIT, DELAYED, DELIVERED, RETURNED}"
      - name: actual_delivered_at
        type: datetime
        source: input
        default: null
        description: "Instant the material actually arrived; supplied when status moves to DELIVERED"
      - name: delay_days
        type: integer
        source: computed
        default: 0
        description: "ceil(max(0, actual_delivered_at - promised_window_end) / 86400 seconds); excuses installer lateness when >= 1"

  - name: InstallerAssignment
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project being installed"
      - name: installer_id
        type: string
        source: input
        description: "FK -> Installer.id; the assigned installer firm"
      - name: window_start
        type: datetime
        source: input
        description: "Start of the reserved install window (half-open interval start)"
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: window_end
        type: datetime
        source: input
        description: "End of the reserved install window (half-open interval end, exclusive)"
        constraints: "ISO 8601 UTC, strictly after window_start"
      - name: duration_minutes
        type: integer
        source: computed
        description: "(window_end - window_start) in whole minutes, floored"
      - name: status
        type: enum
        source: system
        default: HELD
        description: "Assignment lifecycle; see the InstallerAssignment state machine"
        constraints: "one of {HELD, CONFIRMED, IN_PROGRESS, RELEASED, COMPLETED, NO_SHOW}"
      - name: started_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the installer started work"
      - name: completed_at
        type: datetime
        source: input
        default: null
        description: "Instant the installer finished; supplied on POST /installer-assignments/{id}/complete"
      - name: on_time
        type: boolean
        source: computed
        default: null
        description: "completed_at <= window_end, OR the project's MaterialDelivery.delay_days >= 1 (lateness excused); decides which timeliness ScorecardEvent is emitted"
      - name: release_reason
        type: string
        source: system
        default: null
        description: "Reason recorded when status became RELEASED, including cascade-generated reasons"

  # -------------------------------------------- quality, warranty, scorecard ---
  - name: PunchListItem
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project whose quality inspection raised this defect"
      - name: severity
        type: enum
        source: input
        description: "Defect severity; SAFETY items force a service-manager review on escalation"
        constraints: "one of {MINOR, MAJOR, SAFETY}"
      - name: description
        type: string
        source: input
        description: "Defect description as written by the quality inspector"
        constraints: "1-300 chars"
      - name: due_at
        type: datetime
        source: input
        description: "Instant by which the installer must resolve the defect"
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Punch item lifecycle; see the PunchListItem state machine"
        constraints: "one of {OPEN, RESOLVED, VERIFIED, ESCALATED}"
      - name: resolution_note
        type: string
        source: input
        default: null
        description: "Installer's note recorded on resolve"
        constraints: "1-300 chars when present"
      - name: resolved_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant status last became RESOLVED"
      - name: verified_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant status became VERIFIED"
      - name: escalated_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant status last became ESCALATED"
      - name: escalation_reason
        type: string
        source: input
        default: null
        description: "Reason recorded on escalation"
        constraints: "1-300 chars when present"
      - name: escalated_to_user_id
        type: string
        source: system
        default: null
        description: "Opaque X-User-ID of the operator who escalated the item; never compared to any entity id"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; must have fulfillment_status == CLOSED"
      - name: claim_type
        type: enum
        source: input
        description: "Only LABOR_DEFECT is covered by the installation labor warranty"
        constraints: "one of {LABOR_DEFECT, MATERIAL_DEFECT}"
      - name: description
        type: string
        source: input
        description: "Customer's description of the defect"
        constraints: "1-500 chars"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Claim lifecycle; see the WarrantyClaim state machine"
        constraints: "one of {SUBMITTED, ESCALATED, UPHELD, DENIED}"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant the claim was filed; compared with Project.closed_at for the warranty period"
      - name: triaged_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the ServiceManager recorded a terminal decision"
      - name: decision_note
        type: string
        source: input
        default: null
        description: "ServiceManager's note recorded with the triage decision"
        constraints: "1-300 chars when present"
      - name: denial_reason
        type: string
        source: input
        default: null
        description: "Reason recorded when status became DENIED"
        constraints: "1-300 chars when present"
      - name: escalation_level
        type: integer
        source: system
        default: 0
        description: "Incremented by one each time the claim enters ESCALATED"
      - name: escalated_to_user_id
        type: string
        source: system
        default: null
        description: "Opaque X-User-ID of the ServiceManager the claim is queued to; never compared to any entity id"

  - name: ScorecardEvent
    parent: null
    common_fields: false
    fields:
      - name: installer_id
        type: string
        source: input
        description: "FK -> Installer.id; supplied as the path id on POST /installers/{id}/scorecard-events"
      - name: project_id
        type: string
        source: input
        default: null
        description: "FK -> Project.id; the project the event arose from, null for network-level events"
      - name: event_type
        type: enum
        source: input
        description: "Scorecard event kind; fixes the three per-dimension deltas"
        constraints: "one of {ON_TIME_COMPLETION, LATE_COMPLETION, NO_SHOW, PUNCH_MINOR, PUNCH_MAJOR, PUNCH_SAFETY, WARRANTY_UPHELD, CSAT_SURVEY}"
      - name: csat_score
        type: integer
        source: input
        default: null
        description: "1-5 customer satisfaction rating; REQUIRED when event_type == CSAT_SURVEY and forbidden otherwise"
        constraints: "1 - 5"
      - name: quality_delta
        type: number
        source: computed
        description: "Quality-dimension points contributed by this event, from installer_scorecard.constants.POINTS"
      - name: timeliness_delta
        type: number
        source: computed
        description: "Timeliness-dimension points contributed by this event"
      - name: satisfaction_delta
        type: number
        source: computed
        description: "Satisfaction-dimension points contributed by this event"
      - name: occurred_at
        type: datetime
        source: input
        description: "Instant the event happened; the 90-day rolling window and the decay bands are measured from here"
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: source
        type: enum
        source: system
        description: "MANUAL for operator-filed events, SYSTEM for cascade-generated events"
        constraints: "one of {MANUAL, SYSTEM}"

# =============================================================================
# §1.2 State Machine Table
#
# Ten machines. Project carries THREE parallel dimensions on one row
# (fulfillment_status x financial_status x permit_status). ChangeOrder,
# Installer, MaterialDelivery, PunchListItem and Project.permit_status each
# contain a cycle. Every transition below names its actor role exactly as
# declared in §1.7.
#
# Shared logical-clock convention: `clock_now` is the value of the logical
# clock (default 2026-08-01T00:00:00.000Z until POST /_clock/set_current_utc
# moves it). No transition reads real wall-clock time.
# =============================================================================
state_machines:

  - entity: Installer
    initial_state: APPLIED
    terminal_states: [REMOVED]
    transitions:
      - from: APPLIED
        to: DOCS_PENDING
        trigger: "POST /installers/{id}/credentials (first credential row created for this installer)"
        actor: NetworkManager
        preconditions:
          - "Installer.status == APPLIED"
          - "Jurisdiction referenced by jurisdiction_id exists and has status == ACTIVE"
        side_effects:
          - "creates InstallerCredential with verification_status PENDING"
          - "sets Installer.status = DOCS_PENDING"
          - "increments Installer.version by 1"
        note: "Second and later credentials leave status at DOCS_PENDING (or wherever it already is) and only create the credential row."

      - from: DOCS_PENDING
        to: VERIFIED
        trigger: "POST /installer-credentials/{id}/verify with verification_decision == VERIFY, or POST /installers/{id}/background-check with result == PASS — whichever completes the pair last"
        actor: NetworkManager
        preconditions:
          - "Installer.status == DOCS_PENDING"
          - "Installer.verified_credential_count >= 1 after this call's own effect is applied"
          - "Installer.background_check_result == PASS after this call's own effect is applied"
          - "at least one VERIFIED credential has trade_code == Installer.primary_trade_code"
        side_effects:
          - "sets Installer.status = VERIFIED"
          - "increments Installer.version by 1"
        note: "Auto-transition: the system evaluates this rule at the end of both the credential-verify and the background-check handlers, so whichever call satisfies the pair last performs the promotion."

      - from: VERIFIED
        to: ACTIVE
        trigger: "POST /installers/{id}/activate"
        actor: NetworkManager
        preconditions:
          - "Installer.status == VERIFIED"
          - "Installer.insurance_expires_on > clock_now"
          - "Installer.background_check_result == PASS"
        side_effects:
          - "sets Installer.status = ACTIVE"
          - "recomputes installer_scorecard (both variants) so quality_score / timeliness_score / satisfaction_score / composite_score / lifetime_composite_score / removal_eligible are written"
          - "increments Installer.version by 1"

      - from: ACTIVE
        to: PROBATION
        trigger: "system re-evaluation of installer_scorecard at the end of any handler that appends a ScorecardEvent (POST /installers/{id}/scorecard-events, or a SYSTEM event appended by a cascade)"
        actor: system
        preconditions:
          - "Installer.status == ACTIVE"
          - "Installer.rolling_event_count >= 3 (installer_scorecard.MIN_EVENTS_FOR_ACTION)"
          - "Installer.composite_score <= 78.00 (installer_scorecard.PROBATION_COMPOSITE_MAX)"
        side_effects:
          - "sets Installer.status = PROBATION"
          - "sets Installer.probation_started_at = clock_now"
          - "increments Installer.version by 1"

      - from: PROBATION
        to: ACTIVE
        trigger: "system re-evaluation of installer_scorecard at the end of any handler that appends a ScorecardEvent"
        actor: system
        preconditions:
          - "Installer.status == PROBATION"
          - "Installer.composite_score > 78.00"
        side_effects:
          - "sets Installer.status = ACTIVE"
          - "sets Installer.probation_started_at = null"
          - "increments Installer.version by 1"
        note: "Closes the ACTIVE <-> PROBATION cycle: a rehabilitating installer returns to ACTIVE without any operator action."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /installer-credentials/{id}/verify with verification_decision == REJECT (cascade hop 2), or the system EXPIRED transition on the last VERIFIED credential"
        actor: system
        preconditions:
          - "Installer.status IN {ACTIVE, PROBATION}"
          - "Installer.verified_credential_count == 0 after the credential transition is applied"
        side_effects:
          - "sets Installer.status = SUSPENDED"
          - "cascade hop 3: every InstallerAssignment for this installer with status IN {HELD, CONFIRMED} transitions to RELEASED with release_reason 'INSTALLER_SUSPENDED'"
          - "cascade hop 4 (caused by hop 3): Installer.committed_minutes is reduced by each released assignment's duration_minutes, and each affected Project.fulfillment_status reverts SCHEDULED -> MEASURED"
          - "increments Installer.version by 1"

      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /installer-credentials/{id}/verify with verification_decision == REJECT, or the system EXPIRED transition on the last VERIFIED credential"
        actor: system
        preconditions:
          - "Installer.status == PROBATION"
          - "Installer.verified_credential_count == 0 after the credential transition is applied"
        side_effects:
          - "same three cascade hops as the ACTIVE -> SUSPENDED transition"
          - "increments Installer.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /installer-credentials/{id}/verify with verification_decision == VERIFY on any PENDING credential"
        actor: NetworkManager
        preconditions:
          - "Installer.status == SUSPENDED"
          - "Installer.verified_credential_count >= 1 after this call's own effect is applied"
          - "Installer.insurance_expires_on > clock_now"
        side_effects:
          - "sets Installer.status = ACTIVE"
          - "sets Installer.probation_started_at = null"
          - "increments Installer.version by 1"

      - from: ACTIVE
        to: REMOVED
        trigger: "POST /installers/{id}/remove"
        actor: ServiceManager
        preconditions:
          - "Installer.status IN {ACTIVE, PROBATION, SUSPENDED}"
          - "expected_installer_version equals Installer.version"
          - "Installer.removal_eligible == true"
        side_effects:
          - "sets Installer.status = REMOVED, removed_at = clock_now, removal_reason = the supplied reason"
          - "every InstallerAssignment for this installer with status IN {HELD, CONFIRMED} transitions to RELEASED with release_reason 'INSTALLER_REMOVED'"
          - "Installer.committed_minutes is reduced by each released assignment's duration_minutes"
          - "each affected Project.fulfillment_status reverts SCHEDULED -> MEASURED"
          - "increments Installer.version by 1"

      - from: PROBATION
        to: REMOVED
        trigger: "POST /installers/{id}/remove"
        actor: ServiceManager
        preconditions:
          - "Installer.status == PROBATION"
          - "expected_installer_version equals Installer.version"
          - "Installer.removal_eligible == true"
        side_effects:
          - "same side effects as ACTIVE -> REMOVED"

      - from: SUSPENDED
        to: REMOVED
        trigger: "POST /installers/{id}/remove"
        actor: ServiceManager
        preconditions:
          - "Installer.status == SUSPENDED"
          - "expected_installer_version equals Installer.version"
          - "Installer.removal_eligible == true"
        side_effects:
          - "same side effects as ACTIVE -> REMOVED"

  - entity: InstallerCredential
    initial_state: PENDING
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /installer-credentials/{id}/verify with verification_decision == VERIFY"
        actor: NetworkManager
        preconditions:
          - "InstallerCredential.verification_status == PENDING"
          - "InstallerCredential.license_expires_on > clock_now"
        side_effects:
          - "sets verification_status = VERIFIED, verified_at = clock_now"
          - "recomputes Installer.verified_credential_count"
          - "may promote Installer DOCS_PENDING -> VERIFIED or SUSPENDED -> ACTIVE"
          - "increments InstallerCredential.version by 1"

      - from: PENDING
        to: REJECTED
        trigger: "POST /installer-credentials/{id}/verify with verification_decision == REJECT"
        actor: NetworkManager
        preconditions:
          - "InstallerCredential.verification_status == PENDING"
        side_effects:
          - "cascade hop 1: sets verification_status = REJECTED, rejection_reason = the supplied reason"
          - "cascade hop 2 (caused by hop 1 leaving zero VERIFIED credentials): Installer.status ACTIVE|PROBATION -> SUSPENDED"
          - "increments InstallerCredential.version by 1"

      - from: VERIFIED
        to: REJECTED
        trigger: "POST /installer-credentials/{id}/verify with verification_decision == REJECT"
        actor: NetworkManager
        preconditions:
          - "InstallerCredential.verification_status == VERIFIED"
        side_effects:
          - "same cascade as PENDING -> REJECTED"

      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc — epoch-advance sweep over every credential with verification_status == VERIFIED"
        actor: system
        preconditions:
          - "InstallerCredential.verification_status == VERIFIED"
          - "InstallerCredential.license_expires_on <= the new clock value"
        side_effects:
          - "sets verification_status = EXPIRED"
          - "recomputes Installer.verified_credential_count"
          - "when the recomputed count reaches 0, drives Installer.status ACTIVE|PROBATION -> SUSPENDED with the same three cascade hops as the REJECT path"
          - "increments InstallerCredential.version by 1"
        note: "The sweep runs in ascending credential created_at order and is the ONLY producer of EXPIRED. Because the sweep only ever moves the clock forward-or-backward to an explicit value, expiry is a pure function of (new clock value, license_expires_on) and never of real wall-clock time. A subsequent POST /installer-assignments relying on this credential is rejected with ERR_INSTALLER_NOT_LICENSED."

  # --- Project dimension 1 of 3: execution -----------------------------------
  - entity: Project.fulfillment_status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: MEASURED
        trigger: "POST /projects (same request that creates the row) when ServiceCategory.measurement_required == false"
        actor: ProjectCoordinator
        preconditions:
          - "ServiceCategory.measurement_required == false"
        side_effects:
          - "writes quoted_labor_cents and deposit_required_cents from project_labor_charge variant PROVISIONAL"
          - "writes effective_units = estimated_units"
          - "writes permit_status and permit_responsibility from permit_responsibility_determination"

      - from: DRAFT
        to: MEASURE_PENDING
        trigger: "POST /projects (same request that creates the row) when ServiceCategory.measurement_required == true"
        actor: ProjectCoordinator
        preconditions:
          - "ServiceCategory.measurement_required == true"
        side_effects:
          - "writes quoted_labor_cents and deposit_required_cents from project_labor_charge variant PROVISIONAL"
          - "writes effective_units = estimated_units"
          - "writes permit_status and permit_responsibility from permit_responsibility_determination"
          - "POST /projects/{id}/measurements is the next legal step and requires this state; booking the Measurement does NOT itself change fulfillment_status"

      - from: MEASURE_PENDING
        to: MEASURED
        trigger: "POST /measurements/{id}/complete when the resulting Measurement.change_order_triggered == false"
        actor: ProjectCoordinator
        preconditions:
          - "Project.fulfillment_status == MEASURE_PENDING"
          - "Measurement.status == SCHEDULED"
          - "the computed variance_pct < 10.00"
        side_effects:
          - "sets Measurement.status = COMPLETED, completed_at = clock_now"
          - "sets Project.effective_units = Measurement.measured_units"
          - "re-runs permit_responsibility_determination, which may move permit_status NOT_REQUIRED -> PENDING_APPLICATION or PENDING_APPLICATION -> NOT_REQUIRED"
          - "sets Project.fulfillment_status = MEASURED"
          - "increments Project.version by 1"
        note: "quoted_labor_cents is NOT recomputed here — the provisional quote is frozen at creation."

      - from: MEASURE_PENDING
        to: CHANGE_PENDING
        trigger: "POST /measurements/{id}/complete when the resulting Measurement.change_order_triggered == true"
        actor: ProjectCoordinator
        preconditions:
          - "Project.fulfillment_status == MEASURE_PENDING"
          - "Measurement.status == SCHEDULED"
          - "the computed variance_pct >= 10.00"
        side_effects:
          - "cascade hop 1: sets Measurement.status = COMPLETED, completed_at = clock_now, change_order_triggered = true"
          - "cascade hop 2 (caused by hop 1): creates a ChangeOrder with origin MEASUREMENT_VARIANCE, source_measurement_id = this measurement, lines = [], status PENDING_CUSTOMER, upcharge_cents from change_order_upcharge variant VARIANCE_DISCLOSURE, source SYSTEM"
          - "cascade hop 3 (caused by hop 2 creating a PENDING_CUSTOMER change order): sets Project.effective_units = Measurement.measured_units, re-runs permit_responsibility_determination, and sets Project.fulfillment_status = CHANGE_PENDING"
          - "cascade hop 4 (caused by hop 3 leaving MEASURE_PENDING/SCHEDULED for CHANGE_PENDING): every InstallerAssignment on this project with status IN {HELD, CONFIRMED} transitions to RELEASED with release_reason 'SCOPE_CHANGE_PENDING'"
          - "cascade hop 5 (caused by hop 4): Installer.committed_minutes is reduced by each released assignment's duration_minutes"
          - "increments Project.version by 1"

      - from: CHANGE_PENDING
        to: MEASURED
        trigger: "POST /change-orders/{id}/decide with decision == ACCEPT, or decision == DECLINE on a change order whose origin is CUSTOMER_REQUEST or SITE_CONDITION"
        actor: Customer
        preconditions:
          - "Project.fulfillment_status == CHANGE_PENDING"
          - "no other ChangeOrder on this project has status IN {DRAFT, PENDING_CUSTOMER, REVISION_REQUESTED} after this decision is applied"
        side_effects:
          - "sets ChangeOrder.status = ACCEPTED or DECLINED and decided_at = clock_now"
          - "on ACCEPT of a CUSTOMER_REQUEST or SITE_CONDITION change order, recomputes Project.change_order_upcharge_cents and total_due_cents / balance_due_cents"
          - "sets Project.fulfillment_status = MEASURED"
          - "increments Project.version by 1"

      - from: CHANGE_PENDING
        to: CANCELLED
        trigger: "POST /change-orders/{id}/decide with decision == DECLINE on a change order whose origin == MEASUREMENT_VARIANCE"
        actor: Customer
        preconditions:
          - "Project.fulfillment_status == CHANGE_PENDING"
          - "ChangeOrder.origin == MEASUREMENT_VARIANCE"
        side_effects:
          - "sets ChangeOrder.status = DECLINED, decided_at = clock_now"
          - "sets Project.fulfillment_status = CANCELLED, cancelled_at = clock_now, cancel_reason = 'VARIANCE_DECLINED'"
          - "runs cancellation_settlement and applies its deposit bucket moves plus the Project.financial_status transition"
          - "every Measurement on this project with status == SCHEDULED transitions to VOIDED with voided_reason 'PROJECT_CANCELLED'"
          - "every OTHER ChangeOrder on this project with status IN {DRAFT, PENDING_CUSTOMER, REVISION_REQUESTED} transitions to SUPERSEDED"
          - "every InstallerAssignment on this project with status IN {HELD, CONFIRMED, IN_PROGRESS} transitions to RELEASED with release_reason 'PROJECT_CANCELLED', reducing Installer.committed_minutes accordingly"
          - "the project's MaterialDelivery, when status IN {PLANNED, IN_TRANSIT, DELAYED, DELIVERED}, transitions to RETURNED"
          - "increments Project.version by 1"
        note: "The customer refusing the disclosed measurement variance ends the project; the retailer cannot install a scope the customer has not accepted."

      - from: MEASURED
        to: CHANGE_PENDING
        trigger: "POST /change-orders/{id}/submit"
        actor: ProjectCoordinator
        preconditions:
          - "Project.fulfillment_status IN {MEASURED, CHANGE_PENDING}"
          - "ChangeOrder.status IN {DRAFT, REVISION_REQUESTED}"
        side_effects:
          - "sets ChangeOrder.status = PENDING_CUSTOMER and recomputes upcharge_cents from the current lines"
          - "sets Project.fulfillment_status = CHANGE_PENDING"
          - "increments Project.version by 1"

      - from: MEASURED
        to: SCHEDULED
        trigger: "POST /installer-assignments"
        actor: ProjectCoordinator
        preconditions:
          - "Project.fulfillment_status == MEASURED"
          - "Project.financial_status IN {DEPOSIT_HELD, BALANCE_DUE, SETTLED}"
          - "expected_project_version equals Project.version"
          - "no InstallerAssignment on this project has status IN {HELD, CONFIRMED, IN_PROGRESS}"
        side_effects:
          - "creates InstallerAssignment with status HELD and duration_minutes computed"
          - "increases Installer.committed_minutes by duration_minutes"
          - "sets Project.fulfillment_status = SCHEDULED"
          - "increments Project.version by 1"
          - "increments Installer.version by 1"

      - from: SCHEDULED
        to: MEASURED
        trigger: "POST /installer-assignments/{id}/release, or a cascade release from a scope change, installer suspension or installer removal"
        actor: ProjectCoordinator
        preconditions:
          - "Project.fulfillment_status == SCHEDULED"
          - "InstallerAssignment.status IN {HELD, CONFIRMED}"
        side_effects:
          - "sets InstallerAssignment.status = RELEASED and release_reason"
          - "reduces Installer.committed_minutes by the released assignment's duration_minutes"
          - "sets Project.fulfillment_status = MEASURED"
          - "increments Project.version by 1"
          - "increments Installer.version by 1"
        note: "Revert edge: releasing a hold returns the project to the schedulable state without touching any money bucket."

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /installer-assignments/{id}/start"
        actor: Installer
        preconditions:
          - "Project.fulfillment_status == SCHEDULED"
          - "InstallerAssignment.status == CONFIRMED"
          - "X-User-ID equals InstallerAssignment.installer_id"
          - "Project.permit_status IN {NOT_REQUIRED, ISSUED, INSPECTION_SCHEDULED, INSPECTION_PASSED, CLOSED}"
        side_effects:
          - "sets InstallerAssignment.status = IN_PROGRESS, started_at = clock_now"
          - "sets Project.fulfillment_status = IN_PROGRESS"
          - "increments Project.version by 1"

      - from: IN_PROGRESS
        to: INSTALL_COMPLETE
        trigger: "POST /installer-assignments/{id}/complete"
        actor: Installer
        preconditions:
          - "Project.fulfillment_status == IN_PROGRESS"
          - "InstallerAssignment.status == IN_PROGRESS"
          - "X-User-ID equals InstallerAssignment.installer_id"
        side_effects:
          - "sets InstallerAssignment.status = COMPLETED, completed_at = the supplied instant, on_time from delivery_sync_slack"
          - "writes Project.final_labor_cents from project_labor_charge variant FINAL"
          - "recomputes Project.total_due_cents and balance_due_cents"
          - "moves min(deposit_held_cents, total_due_cents) from deposit_held_cents to deposit_applied_cents and advances Project.financial_status DEPOSIT_HELD -> BALANCE_DUE (or -> SETTLED when balance_due_cents == 0)"
          - "appends a ScorecardEvent with source SYSTEM and event_type ON_TIME_COMPLETION when on_time == true, LATE_COMPLETION otherwise, occurred_at = the supplied completed_at, then recomputes installer_scorecard"
          - "sets Project.fulfillment_status = INSTALL_COMPLETE, install_completed_at = the supplied completed_at"
          - "increments Project.version by 1"
          - "increments Installer.version by 1"

      - from: INSTALL_COMPLETE
        to: PUNCH_OPEN
        trigger: "POST /projects/{id}/quality-inspection when the supplied defects array is non-empty"
        actor: ProjectCoordinator
        preconditions:
          - "Project.fulfillment_status == INSTALL_COMPLETE"
          - "Project.quality_result == NONE"
        side_effects:
          - "sets Project.quality_result = PASS_WITH_PUNCH when workmanship_score >= 70, FAIL when workmanship_score < 70"
          - "sets Project.workmanship_score"
          - "creates one PunchListItem with status OPEN per entry of the defects array, in the order supplied"
          - "appends one ScorecardEvent with source SYSTEM per created punch item — PUNCH_MINOR, PUNCH_MAJOR or PUNCH_SAFETY matching its severity, occurred_at = clock_now — then recomputes installer_scorecard once after all events are appended"
          - "sets Project.fulfillment_status = PUNCH_OPEN"
          - "increments Project.version by 1"

      - from: INSTALL_COMPLETE
        to: CLOSED
        trigger: "POST /projects/{id}/close"
        actor: ProjectCoordinator
        preconditions:
          - "Project.fulfillment_status == INSTALL_COMPLETE"
          - "Project.quality_result == PASS"
          - "Project.permit_status IN {NOT_REQUIRED, CLOSED}"
          - "Project.financial_status == SETTLED"
        side_effects:
          - "sets Project.fulfillment_status = CLOSED, closed_at = clock_now"
          - "increments Project.version by 1"

      - from: PUNCH_OPEN
        to: CLOSED
        trigger: "POST /projects/{id}/close"
        actor: ProjectCoordinator
        preconditions:
          - "Project.fulfillment_status == PUNCH_OPEN"
          - "every PunchListItem for this project has status == VERIFIED"
          - "Project.permit_status IN {NOT_REQUIRED, CLOSED}"
          - "Project.financial_status == SETTLED"
        side_effects:
          - "sets Project.fulfillment_status = CLOSED, closed_at = clock_now"
          - "increments Project.version by 1"

      - from: MEASURED
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: Customer
        preconditions:
          - "Project.fulfillment_status IN {DRAFT, MEASURE_PENDING, MEASURED, CHANGE_PENDING, SCHEDULED}"
          - "when the actor is Customer, X-User-ID equals Project.customer_id"
        side_effects:
          - "sets Project.fulfillment_status = CANCELLED, cancelled_at = clock_now, cancel_reason = the supplied reason"
          - "runs cancellation_settlement and applies its deposit bucket moves plus the Project.financial_status transition"
          - "every InstallerAssignment on this project with status IN {HELD, CONFIRMED, IN_PROGRESS} transitions to RELEASED with release_reason 'PROJECT_CANCELLED', reducing Installer.committed_minutes accordingly"
          - "every Measurement on this project with status == SCHEDULED transitions to VOIDED with voided_reason 'PROJECT_CANCELLED'"
          - "every ChangeOrder on this project with status IN {DRAFT, PENDING_CUSTOMER, REVISION_REQUESTED} transitions to SUPERSEDED"
          - "the project's MaterialDelivery, when status IN {PLANNED, IN_TRANSIT, DELAYED, DELIVERED}, transitions to RETURNED"
          - "increments Project.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: Customer
        preconditions:
          - "Project.fulfillment_status == SCHEDULED"
        side_effects:
          - "identical to the MEASURED -> CANCELLED side effects; the cancellation-fee tier is non-zero because a HELD or CONFIRMED assignment window exists"

      - from: MEASURE_PENDING
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: Customer
        preconditions:
          - "Project.fulfillment_status == MEASURE_PENDING"
        side_effects:
          - "identical to the MEASURED -> CANCELLED side effects; cancellation_settlement's labor_forfeit_pct for MEASURE_PENDING is 0.00, so only a restocking fee can ever be retained"

      - from: CHANGE_PENDING
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: Customer
        preconditions:
          - "Project.fulfillment_status == CHANGE_PENDING"
        side_effects:
          - "identical to the MEASURED -> CANCELLED side effects, including the SUPERSEDED sweep that closes the undecided change order that put the project in this state"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: Customer
        preconditions:
          - "Project.fulfillment_status == IN_PROGRESS"
        side_effects:
          - "identical to the MEASURED -> CANCELLED side effects, except that the IN_PROGRESS InstallerAssignment transitions to RELEASED with release_reason 'PROJECT_CANCELLED'; cancellation_settlement's labor_forfeit_pct is FORFEIT_PCT_IN_PROGRESS (0.50)"

      - from: CANCELLED
        to: MEASURED
        trigger: "POST /projects/{id}/reinstate"
        actor: ServiceManager
        preconditions:
          - "Project.fulfillment_status == CANCELLED"
          - "expected_project_version equals Project.version"
          - "clock_now - Project.cancelled_at < 72 hours (strictly less)"
          - "Project.financial_status IN {PARTIALLY_REFUNDED, REFUNDED, FORFEITED}"
        side_effects:
          - "moves the whole of deposit_refunded_cents and deposit_forfeited_cents back into deposit_held_cents and zeroes both, leaving deposit_paid_cents unchanged"
          - "sets Project.financial_status = DEPOSIT_HELD"
          - "sets Project.fulfillment_status = MEASURED, cancelled_at = null, cancel_reason = null"
          - "leaves VOIDED measurements, RELEASED assignments, SUPERSEDED change orders and the RETURNED delivery as they are — reinstatement restores money and schedulability, not history"
          - "increments Project.version by 1"
        note: "Compensating action closing the deposit-conservation loop: deposit_paid_cents == deposit_held_cents + deposit_applied_cents + deposit_refunded_cents + deposit_forfeited_cents holds before cancel, after cancel, and after reinstate."

  # --- Project dimension 2 of 3: money ---------------------------------------
  - entity: Project.financial_status
    initial_state: QUOTED
    terminal_states: [SETTLED]
    transitions:
      - from: QUOTED
        to: DEPOSIT_HELD
        trigger: "POST /projects/{id}/deposit"
        actor: Customer
        preconditions:
          - "Project.financial_status == QUOTED"
          - "Project.fulfillment_status NOT IN {CANCELLED, CLOSED}"
          - "X-User-ID equals Project.customer_id"
          - "amount_cents equals Project.deposit_required_cents exactly"
        side_effects:
          - "sets deposit_paid_cents = amount_cents and deposit_held_cents = amount_cents"
          - "sets Project.financial_status = DEPOSIT_HELD"
          - "increments Project.version by 1"
        note: "Independent of fulfillment_status: a deposit may be taken while the project is still DRAFT, MEASURE_PENDING, MEASURED or CHANGE_PENDING."

      - from: DEPOSIT_HELD
        to: BALANCE_DUE
        trigger: "POST /installer-assignments/{id}/complete (auto, as part of the INSTALL_COMPLETE side effects) when balance_due_cents > 0"
        actor: system
        preconditions:
          - "Project.financial_status == DEPOSIT_HELD"
          - "Project.final_labor_cents has just been written"
          - "the recomputed balance_due_cents > 0"
        side_effects:
          - "moves min(deposit_held_cents, total_due_cents) from deposit_held_cents to deposit_applied_cents"
          - "sets Project.financial_status = BALANCE_DUE"

      - from: DEPOSIT_HELD
        to: SETTLED
        trigger: "POST /installer-assignments/{id}/complete (auto) when the recomputed balance_due_cents == 0"
        actor: system
        preconditions:
          - "Project.financial_status == DEPOSIT_HELD"
          - "the recomputed balance_due_cents == 0"
        side_effects:
          - "moves min(deposit_held_cents, total_due_cents) from deposit_held_cents to deposit_applied_cents"
          - "sets Project.financial_status = SETTLED"

      - from: BALANCE_DUE
        to: SETTLED
        trigger: "POST /projects/{id}/pay-balance"
        actor: Customer
        preconditions:
          - "Project.financial_status == BALANCE_DUE"
          - "X-User-ID equals Project.customer_id"
          - "amount_cents equals Project.balance_due_cents exactly"
        side_effects:
          - "adds amount_cents to deposit_paid_cents and to deposit_applied_cents, so the conservation identity still holds"
          - "recomputes balance_due_cents to 0"
          - "sets Project.financial_status = SETTLED"
          - "increments Project.version by 1"

      - from: DEPOSIT_HELD
        to: PARTIALLY_REFUNDED
        trigger: "POST /projects/{id}/cancel (or a DECLINE on a MEASUREMENT_VARIANCE change order) when cancellation_settlement yields 0 < retained_cents < deposit_held_cents"
        actor: system
        preconditions:
          - "Project.financial_status == DEPOSIT_HELD"
          - "0 < the settlement's retained_cents AND retained_cents < deposit_held_cents"
        side_effects:
          - "moves retained_cents from deposit_held_cents to deposit_forfeited_cents"
          - "moves the remaining deposit_held_cents to deposit_refunded_cents, leaving deposit_held_cents == 0"
          - "sets Project.financial_status = PARTIALLY_REFUNDED"

      - from: DEPOSIT_HELD
        to: REFUNDED
        trigger: "POST /projects/{id}/cancel when cancellation_settlement yields retained_cents == 0"
        actor: system
        preconditions:
          - "Project.financial_status == DEPOSIT_HELD"
          - "the settlement's retained_cents == 0"
        side_effects:
          - "moves the whole deposit_held_cents to deposit_refunded_cents, leaving deposit_held_cents == 0"
          - "sets Project.financial_status = REFUNDED"

      - from: DEPOSIT_HELD
        to: FORFEITED
        trigger: "POST /projects/{id}/cancel when cancellation_settlement yields retained_cents == deposit_held_cents"
        actor: system
        preconditions:
          - "Project.financial_status == DEPOSIT_HELD"
          - "the settlement's retained_cents == deposit_held_cents"
        side_effects:
          - "moves the whole deposit_held_cents to deposit_forfeited_cents, leaving deposit_held_cents == 0"
          - "sets Project.financial_status = FORFEITED"

      - from: QUOTED
        to: REFUNDED
        trigger: "POST /projects/{id}/cancel on a project that never took a deposit"
        actor: system
        preconditions:
          - "Project.financial_status == QUOTED"
          - "Project.deposit_paid_cents == 0"
        side_effects:
          - "leaves all four deposit buckets at 0 and sets Project.financial_status = REFUNDED"
        note: "Zero-amount edge: the settlement runs, produces retained_cents == 0 against a 0 balance, and the dimension lands in REFUNDED so the reinstate path is uniform."

      - from: PARTIALLY_REFUNDED
        to: DEPOSIT_HELD
        trigger: "POST /projects/{id}/reinstate"
        actor: ServiceManager
        preconditions:
          - "Project.financial_status IN {PARTIALLY_REFUNDED, REFUNDED, FORFEITED}"
          - "clock_now - Project.cancelled_at < 72 hours (strictly less)"
          - "expected_project_version equals Project.version"
        side_effects:
          - "moves the whole of deposit_refunded_cents and deposit_forfeited_cents back into deposit_held_cents and zeroes both"
          - "sets Project.financial_status = DEPOSIT_HELD"

      - from: REFUNDED
        to: DEPOSIT_HELD
        trigger: "POST /projects/{id}/reinstate"
        actor: ServiceManager
        preconditions:
          - "same as the PARTIALLY_REFUNDED -> DEPOSIT_HELD preconditions"
        side_effects:
          - "same bucket restoration; when deposit_paid_cents == 0 all buckets stay at 0 and the dimension still lands in DEPOSIT_HELD"

      - from: FORFEITED
        to: DEPOSIT_HELD
        trigger: "POST /projects/{id}/reinstate"
        actor: ServiceManager
        preconditions:
          - "same as the PARTIALLY_REFUNDED -> DEPOSIT_HELD preconditions"
        side_effects:
          - "same bucket restoration"

  # --- Project dimension 3 of 3: permitting ----------------------------------
  - entity: Project.permit_status
    initial_state: PENDING_APPLICATION
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_APPLICATION
        to: NOT_REQUIRED
        trigger: "POST /projects (initial determination) or POST /measurements/{id}/complete (re-determination)"
        actor: system
        preconditions:
          - "permit_responsibility_determination returns required == false for the current effective_units"
        side_effects:
          - "sets permit_status = NOT_REQUIRED and permit_responsibility = NOT_REQUIRED"
        note: "Downward threshold crossing: a measurement that comes in BELOW Jurisdiction.permit_unit_threshold retires an already-pending permit obligation."

      - from: NOT_REQUIRED
        to: PENDING_APPLICATION
        trigger: "POST /measurements/{id}/complete (re-determination)"
        actor: system
        preconditions:
          - "permit_responsibility_determination returns required == true for the newly measured effective_units"
          - "Project.permit_status == NOT_REQUIRED"
        side_effects:
          - "sets permit_status = PENDING_APPLICATION and permit_responsibility to the determined party"
        note: "Upward threshold crossing at exactly Jurisdiction.permit_unit_threshold (inclusive '>=')."

      - from: PENDING_APPLICATION
        to: APPLIED
        trigger: "POST /projects/{id}/permit/apply"
        actor: ProjectCoordinator
        preconditions:
          - "Project.permit_status == PENDING_APPLICATION"
          - "the acting role matches Project.permit_responsibility: ProjectCoordinator for RETAILER, Installer for INSTALLER, Customer for CUSTOMER"
        side_effects:
          - "sets permit_status = APPLIED and permit_application_reference = the supplied reference"
          - "increments Project.version by 1"

      - from: APPLIED
        to: ISSUED
        trigger: "POST /projects/{id}/permit/issue"
        actor: ProjectCoordinator
        preconditions:
          - "Project.permit_status == APPLIED"
        side_effects:
          - "sets permit_status = ISSUED, permit_issued_on = the supplied instant, permit_fee_cents_billed = the supplied fee"
          - "recomputes Project.total_due_cents and balance_due_cents"
          - "increments Project.version by 1"

      - from: APPLIED
        to: PENDING_APPLICATION
        trigger: "POST /projects/{id}/permit/apply with a fresh reference after the jurisdiction rejected the first application"
        actor: ProjectCoordinator
        preconditions:
          - "Project.permit_status == APPLIED"
          - "resubmit == true in the request body"
        side_effects:
          - "sets permit_status = PENDING_APPLICATION and clears permit_application_reference"
          - "increments Project.version by 1"
        note: "Re-application loop; the caller must send resubmit true to distinguish it from an accidental double apply, which is rejected with ERR_INVALID_STATE."

      - from: ISSUED
        to: INSPECTION_SCHEDULED
        trigger: "POST /projects/{id}/inspection-slot"
        actor: ProjectCoordinator
        preconditions:
          - "Project.permit_status IN {ISSUED, INSPECTION_FAILED}"
          - "Jurisdiction.inspection_required == true"
          - "slot_start >= clock_now + Jurisdiction.inspection_lead_days whole days"
          - "fewer than Jurisdiction.max_concurrent_inspections OTHER projects in the same jurisdiction hold an overlapping INSPECTION_SCHEDULED slot"
        side_effects:
          - "sets inspection_slot_start, inspection_slot_end and permit_status = INSPECTION_SCHEDULED"
          - "increments Project.version by 1"

      - from: INSPECTION_SCHEDULED
        to: INSPECTION_PASSED
        trigger: "POST /projects/{id}/inspection-result with result == PASSED"
        actor: ProjectCoordinator
        preconditions:
          - "Project.permit_status == INSPECTION_SCHEDULED"
        side_effects:
          - "sets inspection_result = PASSED, permit_status = INSPECTION_PASSED, increments inspection_attempt_count by 1"
          - "increments Project.version by 1"

      - from: INSPECTION_SCHEDULED
        to: INSPECTION_FAILED
        trigger: "POST /projects/{id}/inspection-result with result == FAILED"
        actor: ProjectCoordinator
        preconditions:
          - "Project.permit_status == INSPECTION_SCHEDULED"
        side_effects:
          - "sets inspection_result = FAILED, permit_status = INSPECTION_FAILED, increments inspection_attempt_count by 1"
          - "clears inspection_slot_start and inspection_slot_end so the jurisdiction capacity is released"
          - "increments Project.version by 1"

      - from: INSPECTION_FAILED
        to: INSPECTION_SCHEDULED
        trigger: "POST /projects/{id}/inspection-slot"
        actor: ProjectCoordinator
        preconditions:
          - "Project.permit_status == INSPECTION_FAILED"
          - "the same lead-time and capacity preconditions as the ISSUED -> INSPECTION_SCHEDULED transition"
        side_effects:
          - "sets a new slot and permit_status = INSPECTION_SCHEDULED"
          - "increments Project.version by 1"
        note: "Re-inspection cycle: INSPECTION_SCHEDULED -> INSPECTION_FAILED -> INSPECTION_SCHEDULED may repeat without limit."

      - from: INSPECTION_PASSED
        to: CLOSED
        trigger: "POST /projects/{id}/inspection-result with result == PASSED (idempotent close hop performed in the same handler)"
        actor: system
        preconditions:
          - "permit_status has just become INSPECTION_PASSED"
        side_effects:
          - "sets permit_status = CLOSED"
        note: "A passed jurisdiction inspection closes the permit in the same request; there is no separate close-permit endpoint."

  - entity: Measurement
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /measurements/{id}/complete"
        actor: ProjectCoordinator
        preconditions:
          - "Measurement.status == SCHEDULED"
          - "Project.fulfillment_status == MEASURE_PENDING"
        side_effects:
          - "writes measured_units, subfloor_condition, obstruction_count, stair_flight_count, access_notes, completed_at = clock_now"
          - "computes variance_pct and change_order_triggered"
          - "drives the Project.fulfillment_status MEASURE_PENDING -> MEASURED or MEASURE_PENDING -> CHANGE_PENDING cascade"
          - "increments Measurement.version by 1"

      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /projects/{id}/cancel, or a DECLINE on a MEASUREMENT_VARIANCE change order (cascade)"
        actor: system
        preconditions:
          - "Measurement.status == SCHEDULED"
          - "Project.fulfillment_status has just become CANCELLED"
        side_effects:
          - "sets status = VOIDED and voided_reason = 'PROJECT_CANCELLED'"
          - "increments Measurement.version by 1"

  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_CUSTOMER
        trigger: "POST /change-orders/{id}/submit"
        actor: ProjectCoordinator
        preconditions:
          - "ChangeOrder.status == DRAFT"
          - "Project.fulfillment_status IN {MEASURED, CHANGE_PENDING}"
          - "ChangeOrder.lines is non-empty"
        side_effects:
          - "recomputes upcharge_cents with change_order_upcharge variant LINE_ITEMIZED over the current lines"
          - "sets status = PENDING_CUSTOMER"
          - "drives Project.fulfillment_status MEASURED -> CHANGE_PENDING"
          - "increments ChangeOrder.version by 1"

      - from: PENDING_CUSTOMER
        to: ACCEPTED
        trigger: "POST /change-orders/{id}/decide with decision == ACCEPT"
        actor: Customer
        preconditions:
          - "ChangeOrder.status == PENDING_CUSTOMER"
          - "X-User-ID equals Project.customer_id"
        side_effects:
          - "sets status = ACCEPTED, decided_at = clock_now"
          - "for origin IN {CUSTOMER_REQUEST, SITE_CONDITION}, adds upcharge_cents to Project.change_order_upcharge_cents and recomputes total_due_cents / balance_due_cents"
          - "for origin == MEASUREMENT_VARIANCE, changes no money field: the measured units already flow into project_labor_charge variant FINAL"
          - "drives Project.fulfillment_status CHANGE_PENDING -> MEASURED"
          - "increments ChangeOrder.version by 1"

      - from: PENDING_CUSTOMER
        to: DECLINED
        trigger: "POST /change-orders/{id}/decide with decision == DECLINE"
        actor: Customer
        preconditions:
          - "ChangeOrder.status == PENDING_CUSTOMER"
          - "X-User-ID equals Project.customer_id"
        side_effects:
          - "sets status = DECLINED, decided_at = clock_now"
          - "for origin IN {CUSTOMER_REQUEST, SITE_CONDITION}, drives Project.fulfillment_status CHANGE_PENDING -> MEASURED with no money change"
          - "for origin == MEASUREMENT_VARIANCE, drives Project.fulfillment_status CHANGE_PENDING -> CANCELLED and runs cancellation_settlement"
          - "increments ChangeOrder.version by 1"

      - from: PENDING_CUSTOMER
        to: REVISION_REQUESTED
        trigger: "POST /change-orders/{id}/decide with decision == REQUEST_REVISION"
        actor: Customer
        preconditions:
          - "ChangeOrder.status == PENDING_CUSTOMER"
          - "X-User-ID equals Project.customer_id"
          - "ChangeOrder.origin IN {CUSTOMER_REQUEST, SITE_CONDITION}"
        side_effects:
          - "sets status = REVISION_REQUESTED, revision_note = the supplied note"
          - "leaves Project.fulfillment_status at CHANGE_PENDING"
          - "increments ChangeOrder.version by 1"
        note: "A MEASUREMENT_VARIANCE change order cannot be revised — it reports what was measured — so REQUEST_REVISION on it is rejected with ERR_INVALID_STATE."

      - from: REVISION_REQUESTED
        to: PENDING_CUSTOMER
        trigger: "POST /change-orders/{id}/submit with a replacement lines array"
        actor: ProjectCoordinator
        preconditions:
          - "ChangeOrder.status == REVISION_REQUESTED"
          - "lines is supplied and non-empty"
        side_effects:
          - "replaces lines, recomputes upcharge_cents and net_primary_units_delta"
          - "increments revision_count by 1"
          - "sets status = PENDING_CUSTOMER"
          - "increments ChangeOrder.version by 1"
        note: "Closes the revision cycle PENDING_CUSTOMER -> REVISION_REQUESTED -> PENDING_CUSTOMER, which may repeat without limit."

      - from: PENDING_CUSTOMER
        to: SUPERSEDED
        trigger: "POST /change-orders with supersedes_change_order_id pointing at this row, or POST /projects/{id}/cancel"
        actor: ProjectCoordinator
        preconditions:
          - "ChangeOrder.status IN {DRAFT, PENDING_CUSTOMER, REVISION_REQUESTED}"
        side_effects:
          - "sets status = SUPERSEDED"
          - "increments ChangeOrder.version by 1"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /change-orders with supersedes_change_order_id pointing at this row, or POST /projects/{id}/cancel"
        actor: ProjectCoordinator
        preconditions:
          - "ChangeOrder.status == DRAFT"
        side_effects:
          - "sets status = SUPERSEDED"

      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "POST /change-orders with supersedes_change_order_id pointing at this row, or POST /projects/{id}/cancel"
        actor: ProjectCoordinator
        preconditions:
          - "ChangeOrder.status == REVISION_REQUESTED"
        side_effects:
          - "sets status = SUPERSEDED"

  - entity: MaterialDelivery
    initial_state: PLANNED
    terminal_states: [RETURNED]
    transitions:
      - from: PLANNED
        to: IN_TRANSIT
        trigger: "POST /material-deliveries/{id}/status with new_status == IN_TRANSIT"
        actor: ProjectCoordinator
        preconditions:
          - "MaterialDelivery.status IN {PLANNED, DELAYED}"
        side_effects:
          - "sets status = IN_TRANSIT"
          - "increments MaterialDelivery.version by 1"

      - from: PLANNED
        to: DELAYED
        trigger: "POST /material-deliveries/{id}/status with new_status == DELAYED"
        actor: ProjectCoordinator
        preconditions:
          - "MaterialDelivery.status IN {PLANNED, IN_TRANSIT}"
        side_effects:
          - "sets status = DELAYED"
          - "increments MaterialDelivery.version by 1"

      - from: IN_TRANSIT
        to: DELAYED
        trigger: "POST /material-deliveries/{id}/status with new_status == DELAYED"
        actor: ProjectCoordinator
        preconditions:
          - "MaterialDelivery.status == IN_TRANSIT"
        side_effects:
          - "sets status = DELAYED"

      - from: DELAYED
        to: IN_TRANSIT
        trigger: "POST /material-deliveries/{id}/status with new_status == IN_TRANSIT"
        actor: ProjectCoordinator
        preconditions:
          - "MaterialDelivery.status == DELAYED"
        side_effects:
          - "sets status = IN_TRANSIT"
        note: "Closes the IN_TRANSIT <-> DELAYED cycle, which may repeat without limit."

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /material-deliveries/{id}/status with new_status == DELIVERED and actual_delivered_at supplied"
        actor: ProjectCoordinator
        preconditions:
          - "MaterialDelivery.status IN {IN_TRANSIT, DELAYED}"
          - "actual_delivered_at is present"
        side_effects:
          - "sets status = DELIVERED, actual_delivered_at, and delay_days from delivery_sync_slack"
          - "increments MaterialDelivery.version by 1"

      - from: DELAYED
        to: DELIVERED
        trigger: "POST /material-deliveries/{id}/status with new_status == DELIVERED and actual_delivered_at supplied"
        actor: ProjectCoordinator
        preconditions:
          - "MaterialDelivery.status == DELAYED"
          - "actual_delivered_at is present"
        side_effects:
          - "same as IN_TRANSIT -> DELIVERED"

      - from: DELIVERED
        to: RETURNED
        trigger: "POST /projects/{id}/cancel (cascade), or a DECLINE on a MEASUREMENT_VARIANCE change order"
        actor: system
        preconditions:
          - "MaterialDelivery.status IN {PLANNED, IN_TRANSIT, DELAYED, DELIVERED}"
          - "Project.fulfillment_status has just become CANCELLED"
        side_effects:
          - "sets status = RETURNED"
          - "increments MaterialDelivery.version by 1"
        note: "The restocking-fee component of cancellation_settlement is computed from the status held BEFORE this transition."

  - entity: InstallerAssignment
    initial_state: HELD
    terminal_states: [RELEASED, COMPLETED, NO_SHOW]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /installer-assignments/{id}/confirm"
        actor: ProjectCoordinator
        preconditions:
          - "InstallerAssignment.status == HELD"
          - "a MaterialDelivery exists for this project"
          - "delivery_sync_slack.delivery_slack_hours >= 24 for this assignment's window_start"
          - "MaterialDelivery.status IN {PLANNED, IN_TRANSIT, DELIVERED}"
        side_effects:
          - "sets status = CONFIRMED"
          - "increments InstallerAssignment.version by 1"

      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /installer-assignments/{id}/start"
        actor: Installer
        preconditions:
          - "InstallerAssignment.status == CONFIRMED"
          - "X-User-ID equals InstallerAssignment.installer_id"
          - "Project.permit_status IN {NOT_REQUIRED, ISSUED, INSPECTION_SCHEDULED, INSPECTION_PASSED, CLOSED}"
        side_effects:
          - "sets status = IN_PROGRESS, started_at = clock_now, and drives Project.fulfillment_status SCHEDULED -> IN_PROGRESS"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /installer-assignments/{id}/complete"
        actor: Installer
        preconditions:
          - "InstallerAssignment.status == IN_PROGRESS"
          - "X-User-ID equals InstallerAssignment.installer_id"
        side_effects:
          - "sets status = COMPLETED, completed_at, on_time"
          - "drives the full Project INSTALL_COMPLETE side-effect set, including the timeliness ScorecardEvent"
          - "recomputes Installer.committed_minutes (COMPLETED assignments stay inside the sum, so the value does not change)"
          - "recomputes Installer.completed_project_count"

      - from: HELD
        to: RELEASED
        trigger: "POST /installer-assignments/{id}/release, or one of the three cascades (scope change, installer suspension, installer removal, project cancellation)"
        actor: ProjectCoordinator
        preconditions:
          - "InstallerAssignment.status IN {HELD, CONFIRMED}"
        side_effects:
          - "sets status = RELEASED, release_reason"
          - "reduces Installer.committed_minutes by duration_minutes"
          - "drives Project.fulfillment_status SCHEDULED -> MEASURED when the project is not itself being cancelled"
          - "increments InstallerAssignment.version by 1"
        note: "Compensating action closing the capacity-conservation loop: Installer.committed_minutes == sum of duration_minutes over that installer's assignments with status IN {HELD, CONFIRMED, IN_PROGRESS, COMPLETED} holds before the hold, after the hold, and after the release."

      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /installer-assignments/{id}/release, or one of the cascades"
        actor: ProjectCoordinator
        preconditions:
          - "InstallerAssignment.status == CONFIRMED"
        side_effects:
          - "same as HELD -> RELEASED"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /installer-assignments/{id}/release with release_reason == 'NO_SHOW'"
        actor: ServiceManager
        preconditions:
          - "InstallerAssignment.status == CONFIRMED"
          - "clock_now > InstallerAssignment.window_end"
        side_effects:
          - "sets status = NO_SHOW"
          - "reduces Installer.committed_minutes by duration_minutes"
          - "appends a ScorecardEvent with source SYSTEM, event_type NO_SHOW, occurred_at = clock_now, then recomputes installer_scorecard"
          - "drives Project.fulfillment_status SCHEDULED -> MEASURED"
          - "increments InstallerAssignment.version, Project.version and Installer.version by 1 each"

  - entity: PunchListItem
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /punch-list-items/{id}/resolve"
        actor: Installer
        preconditions:
          - "PunchListItem.status IN {OPEN, ESCALATED}"
          - "X-User-ID equals the installer_id of this project's InstallerAssignment with status == COMPLETED"
          - "when severity == SAFETY, PunchListItem.status must already be ESCALATED"
        side_effects:
          - "sets status = RESOLVED, resolution_note, resolved_at = clock_now"
          - "increments PunchListItem.version by 1"

      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /punch-list-items/{id}/resolve"
        actor: Installer
        preconditions:
          - "PunchListItem.status == ESCALATED"
          - "X-User-ID equals the installer_id of this project's InstallerAssignment with status == COMPLETED"
        side_effects:
          - "sets status = RESOLVED, resolution_note, resolved_at = clock_now"
          - "decrements Project.escalated_punch_count by 1"
        note: "Closes the OPEN -> ESCALATED -> RESOLVED cycle; an item may be escalated again from RESOLVED, so the loop may repeat."

      - from: RESOLVED
        to: VERIFIED
        trigger: "POST /punch-list-items/{id}/verify"
        actor: ProjectCoordinator
        preconditions:
          - "PunchListItem.status == RESOLVED"
          - "when severity == SAFETY, the acting role must be ServiceManager"
        side_effects:
          - "sets status = VERIFIED, verified_at = clock_now"
          - "increments PunchListItem.version by 1"

      - from: OPEN
        to: ESCALATED
        trigger: "POST /punch-list-items/{id}/escalate"
        actor: ProjectCoordinator
        preconditions:
          - "PunchListItem.status IN {OPEN, RESOLVED}"
        side_effects:
          - "cascade hop 1: sets status = ESCALATED, escalated_at = clock_now, escalation_reason, escalated_to_user_id = the acting X-User-ID"
          - "cascade hop 2 (caused by hop 1): increments Project.escalated_punch_count by 1 and, when severity == SAFETY, sets Project.service_manager_review_required = true"
          - "cascade hop 3 (caused by hop 2, only when severity == SAFETY): appends a ScorecardEvent with source SYSTEM, event_type PUNCH_SAFETY, installer_id = the installer_id of this project's COMPLETED InstallerAssignment, project_id = this project, occurred_at = clock_now"
          - "cascade hop 4 (caused by hop 3): recomputes installer_scorecard, rewriting quality_score, satisfaction_score, composite_score, lifetime_composite_score and removal_eligible"
          - "cascade hop 5 (caused by hop 4): when the recomputed composite_score is <= 78.00 and rolling_event_count >= 3, Installer.status ACTIVE -> PROBATION with probation_started_at = clock_now"
          - "increments PunchListItem.version, Project.version and Installer.version by 1 each"

      - from: RESOLVED
        to: ESCALATED
        trigger: "POST /punch-list-items/{id}/escalate"
        actor: ProjectCoordinator
        preconditions:
          - "PunchListItem.status == RESOLVED"
        side_effects:
          - "same five cascade hops as OPEN -> ESCALATED"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [UPHELD, DENIED]
    transitions:
      - from: SUBMITTED
        to: UPHELD
        trigger: "POST /warranty-claims/{id}/triage with decision == UPHOLD"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status IN {SUBMITTED, ESCALATED}"
        side_effects:
          - "sets status = UPHELD, triaged_at = clock_now, decision_note"
          - "appends a ScorecardEvent with source SYSTEM, event_type WARRANTY_UPHELD, installer_id = the installer_id of the project's COMPLETED InstallerAssignment, project_id = the claim's project, occurred_at = clock_now"
          - "recomputes installer_scorecard, which may drive Installer ACTIVE -> PROBATION"
          - "increments WarrantyClaim.version by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/triage with decision == DENY"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status IN {SUBMITTED, ESCALATED}"
          - "denial_reason is present"
        side_effects:
          - "sets status = DENIED, triaged_at = clock_now, denial_reason"
          - "appends no ScorecardEvent"
          - "increments WarrantyClaim.version by 1"

      - from: SUBMITTED
        to: ESCALATED
        trigger: "POST /warranty-claims/{id}/triage with decision == ESCALATE"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == SUBMITTED"
        side_effects:
          - "sets status = ESCALATED, escalation_level incremented by 1, escalated_to_user_id = the acting X-User-ID"
          - "increments WarrantyClaim.version by 1"

      - from: ESCALATED
        to: UPHELD
        trigger: "POST /warranty-claims/{id}/triage with decision == UPHOLD"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == ESCALATED"
        side_effects:
          - "same as SUBMITTED -> UPHELD"

      - from: ESCALATED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/triage with decision == DENY"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == ESCALATED"
          - "denial_reason is present"
        side_effects:
          - "same as SUBMITTED -> DENIED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's `version`)
# =============================================================================
# Every rule below is a TRUE race under the §1.2.1 filter: the second strictly
# sequential request observes state that would legitimately permit the write
# (create-with-supersede semantics, or a re-entry that the state machine allows
# from the state the first write produced), so a state precondition alone cannot
# reject it. Each is reduced to a deterministic stale-version check.
concurrency_rules:
  - rule_id: assignment-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /installer-assignments"
    occ_field: "expected_project_version"
    description: |
      Creating an InstallerAssignment against a Project whose version has
      advanced since the client last read it is rejected. A Project in
      fulfillment_status MEASURED legitimately accepts an assignment, and after
      a first assignment is created and then released the Project returns to
      MEASURED — so the state precondition alone would let a writer holding a
      stale view create a second overlapping hold. The stale-version check is
      what rejects it.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: change-order-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /change-orders"
    occ_field: "expected_project_version"
    description: |
      Creating a ChangeOrder against a Project whose version has advanced since
      the client last read it is rejected. Because a new change order may carry
      supersedes_change_order_id and legitimately drive the prior one to
      SUPERSEDED, a writer whose view of the project predates another accepted
      change order would otherwise price its lines against a scope that no
      longer exists. The stale-version check rejects that write.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: project-reinstate-stale-project
    parent_entity: Project
    write_endpoint: "POST /projects/{id}/reinstate"
    occ_field: "expected_project_version"
    description: |
      Reinstating a CANCELLED Project whose version has advanced since the
      client last read it is rejected. Reinstatement reverses the settlement
      buckets computed at cancellation, so a writer whose view predates a
      subsequent settlement adjustment would reverse amounts that are no longer
      the amounts on record. The stale-version check rejects that write.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: installer-remove-stale-installer
    parent_entity: Installer
    write_endpoint: "POST /installers/{id}/remove"
    occ_field: "expected_installer_version"
    description: |
      Removing an Installer whose version has advanced since the client last
      read it is rejected. removal_eligible is a computed field that any new
      ScorecardEvent can flip back to false, and REMOVED is reachable from both
      ACTIVE and PROBATION, so a writer holding a stale view would remove an
      installer on the strength of a scorecard the network no longer has. The
      stale-version check rejects that write.
    error_id: ERR_STALE_INSTALLER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
# Global money/rounding contract:
#   * Every money field is an integer count of cents. Never a float.
#   * `round_half_up(x)` means: round the decimal value x to the nearest
#     integer, ties away from zero. `round_half_up(x, 2)` means the same to two
#     decimal places.
#   * Percentage and score fields are decimals with EXACTLY two decimal places.
#   * Where a formula sums several rounded parts, the ROUNDING ORDER is pinned
#     explicitly in the formula text and is part of the contract: a different
#     order produces a different, WRONG answer.
calculations:

  - name: project_labor_charge
    description: |
      The labor charge for a project's installation, in cents. Evaluated in two
      variants that use the same tier ladder and the same jurisdiction
      multiplier but different unit sources and different surcharge inputs.
    trigger: |
      PROVISIONAL runs exactly once, inside POST /projects, and its result is
      frozen into Project.quoted_labor_cents (never recomputed, not even after a
      measurement or an accepted change order). FINAL runs inside
      POST /measurements/{id}/complete (for the disclosure amount only) and
      inside POST /installer-assignments/{id}/complete, where its result is
      written to Project.final_labor_cents.
    algorithm: tiered_pricing
    input_set: |
      The Project, its ServiceCategory, its Jurisdiction, and — for FINAL only —
      the project's most recent Measurement with status == COMPLETED (ordered by
      completed_at DESC, then created_at ASC as the only permitted tie-break).
    formula: |
      STEP 1 — unit source
        PROVISIONAL: units = Project.estimated_units
        FINAL:       units = Measurement.measured_units of the latest COMPLETED
                     measurement. If the category has measurement_required ==
                     false and no COMPLETED measurement exists, FINAL falls back
                     to Project.estimated_units.

      STEP 2 — billable units floor
        billable_units = max(units, ServiceCategory.minimum_billable_units)

      STEP 3 — marginal tier ladder over billable_units (band widths in units)
        rate         = ServiceCategory.base_labor_rate_cents_per_unit
        rate_band_B  = round_half_up(rate * TIER_B_FACTOR)
        rate_band_C  = round_half_up(rate * TIER_C_FACTOR)
        units_A = min(billable_units, TIER_A_WIDTH)
        units_B = min(max(billable_units - TIER_A_WIDTH, 0), TIER_B_WIDTH)
        units_C = max(billable_units - TIER_A_WIDTH - TIER_B_WIDTH, 0)
        # ROUNDING ORDER (pinned): round EACH band to whole cents, THEN sum.
        base_cents = round_half_up(units_A * rate)
                   + round_half_up(units_B * rate_band_B)
                   + round_half_up(units_C * rate_band_C)

      STEP 4 — site-condition surcharges
        PROVISIONAL: surcharge_cents = 0   (no site details exist yet)
        FINAL:
          subfloor_cents = { NONE:  0,
                             MINOR: round_half_up(base_cents * SUBFLOOR_MINOR_PCT),
                             MAJOR: round_half_up(base_cents * SUBFLOOR_MAJOR_PCT) }
                           [Measurement.subfloor_condition]
          obstruction_cents = Measurement.obstruction_count * OBSTRUCTION_CENTS
          stair_cents       = Measurement.stair_flight_count * STAIR_FLIGHT_CENTS
          surcharge_cents   = subfloor_cents + obstruction_cents + stair_cents

      STEP 5 — jurisdiction multiplier, applied to the SUM (pinned order:
               add base and surcharge first, multiply once, then round once)
        multiplied_cents = round_half_up((base_cents + surcharge_cents)
                                        * Jurisdiction.labor_complexity_multiplier)

      STEP 6 — program minimum
        charge_cents = max(multiplied_cents, MIN_LABOR_CHARGE_CENTS)
    constants:
      TIER_A_WIDTH: 200.00
      TIER_B_WIDTH: 300.00
      TIER_B_FACTOR: 0.92
      TIER_C_FACTOR: 0.85
      SUBFLOOR_MINOR_PCT: 0.04
      SUBFLOOR_MAJOR_PCT: 0.09
      OBSTRUCTION_CENTS: 1850
      STAIR_FLIGHT_CENTS: 4200
      MIN_LABOR_CHARGE_CENTS: 15000
    precision: "integer cents; round_half_up at each pinned rounding point"
    variants:
      - name: PROVISIONAL
        when: "POST /projects — the sales-desk quote, before anyone has been to the site"
        difference: |
          Uses Project.estimated_units and forces surcharge_cents = 0. Written to
          Project.quoted_labor_cents and frozen forever; Project.deposit_required_cents
          is round_half_up(quoted_labor_cents * ServiceCategory.deposit_pct).
      - name: FINAL
        when: "POST /installer-assignments/{id}/complete — the invoiced amount"
        difference: |
          Uses the latest COMPLETED Measurement's measured_units AND adds the
          three site-condition surcharges from that same measurement. Written to
          Project.final_labor_cents. Accepted change orders do NOT feed this
          variant — their money lives in Project.change_order_upcharge_cents — so
          the measured units are charged exactly once.
    worked_example: |
      Category: base_labor_rate_cents_per_unit 425, minimum_billable_units 150.00,
      deposit_pct 0.30. Jurisdiction: labor_complexity_multiplier 1.15.
      Project.estimated_units 420.00.
        PROVISIONAL: billable 420.00; rate_band_B = round_half_up(391.0) = 391;
          units_A 200.00 -> 85000; units_B 220.00 -> 86020; units_C 0 -> 0;
          base_cents 171020; surcharge 0;
          multiplied = round_half_up(171020 * 1.15) = round_half_up(196673.0) = 196673.
          quoted_labor_cents = 196673, deposit_required_cents =
          round_half_up(196673 * 0.30) = round_half_up(59001.9) = 59002.
      Measurement completes with measured_units 468.00, subfloor_condition MAJOR,
      obstruction_count 3, stair_flight_count 2.
        FINAL: billable 468.00; units_A 200.00 -> 85000; units_B 268.00 -> 104788;
          base_cents 189788;
          subfloor MAJOR = round_half_up(189788 * 0.09) = round_half_up(17080.92) = 17081;
          obstructions 3 * 1850 = 5550; stairs 2 * 4200 = 8400; surcharge 31031;
          multiplied = round_half_up(220819 * 1.15) = round_half_up(253941.85) = 253942.
          final_labor_cents = 253942.
      Variant delta = 253942 - 196673 = 57269.

  - name: change_order_upcharge
    description: |
      The money a change order adds to (or credits against) a project. Two
      variants: MEASUREMENT_VARIANCE change orders are pure disclosures and add
      nothing, while line-itemised change orders price each line independently.
    trigger: |
      Recomputed on every POST /change-orders (creation) and every
      POST /change-orders/{id}/submit (including each revision resubmission).
      The value in force at the moment of an ACCEPT decision is the value that
      lands in Project.change_order_upcharge_cents.
    algorithm: weighted_scoring
    input_set: |
      The ChangeOrder's own `lines` array (in array order), its Project's
      ServiceCategory (for the PRIMARY_UNITS rate) and Jurisdiction (for the
      complexity multiplier).
    formula: |
      VARIANT VARIANCE_DISCLOSURE (origin == MEASUREMENT_VARIANCE):
        lines MUST be empty.
        upcharge_cents = project_labor_charge(FINAL, evaluated against the
                         measurement that triggered this change order)
                         - Project.quoted_labor_cents
        This value may be negative. It is a DISCLOSURE ONLY: accepting the
        change order does NOT add it to Project.change_order_upcharge_cents,
        because the same measured units are already charged by the FINAL variant
        of project_labor_charge at completion.

      VARIANT LINE_ITEMIZED (origin IN {CUSTOMER_REQUEST, SITE_CONDITION}):
        lines MUST be non-empty (1..10 entries).
        For each line, in array order:
          unit_rate = { PRIMARY_UNITS:  ServiceCategory.base_labor_rate_cents_per_unit,
                        TRIM_LINEAR_FT: TRIM_RATE_CENTS,
                        FIXTURE_EACH:   FIXTURE_RATE_CENTS }[line.unit_kind]
          raw_line = line.units_delta * unit_rate
                     * Jurisdiction.labor_complexity_multiplier
                     * CHANGE_ORDER_ADMIN_FACTOR
          # ROUNDING ORDER (pinned): round EVERY line to whole cents FIRST,
          # THEN add the rounded line amounts. Summing the raw decimals and
          # rounding once at the end is WRONG and can differ by one or more cents.
          line_cents = round_half_up(raw_line)
        upcharge_cents = sum(line_cents over all lines, in array order)
        net_primary_units_delta = sum(line.units_delta where unit_kind == PRIMARY_UNITS)
    constants:
      TRIM_RATE_CENTS: 296
      FIXTURE_RATE_CENTS: 7350
      CHANGE_ORDER_ADMIN_FACTOR: 1.06
      CREDIT_CAP_PCT: 0.50
    precision: "integer cents; round_half_up per line, then exact integer addition"
    variants:
      - name: VARIANCE_DISCLOSURE
        when: "origin == MEASUREMENT_VARIANCE (auto-created by measurement completion)"
        difference: |
          Derived from project_labor_charge, not from lines. Contributes nothing
          to Project.change_order_upcharge_cents on ACCEPT. A DECLINE cancels
          the project.
      - name: LINE_ITEMIZED
        when: "origin IN {CUSTOMER_REQUEST, SITE_CONDITION}"
        difference: |
          Derived from lines with per-line rounding. Contributes the full
          upcharge_cents to Project.change_order_upcharge_cents on ACCEPT. A
          DECLINE leaves the project's money untouched.
    worked_example: |
      Category rate 425, jurisdiction multiplier 1.15, admin factor 1.06.
      lines = [ {PRIMARY_UNITS, 6.00}, {PRIMARY_UNITS, 6.00}, {TRIM_LINEAR_FT, 12.00} ]
        line 1: 6.00 * 425 = 2550; * 1.15 = 2932.50; * 1.06 = 3108.45 -> 3108
        line 2: identical -> 3108
        line 3: 12.00 * 296 = 3552; * 1.15 = 4084.80; * 1.06 = 4329.888 -> 4330
        upcharge_cents = 3108 + 3108 + 4330 = 10546   (CORRECT)
      Summing raw decimals first would give 3108.45 + 3108.45 + 4329.888 =
      10546.788 -> 10547, which is WRONG. The one-cent gap is the observable
      consequence of the pinned rounding order.
      net_primary_units_delta = 12.00.
    credit_rule: |
      units_delta may be negative, so upcharge_cents may be negative. A change
      order whose upcharge_cents is less than
      -round_half_up(Project.quoted_labor_cents * CREDIT_CAP_PCT) is rejected on
      submit with ERR_CREDIT_EXCEEDS_CAP.

  - name: installer_scorecard
    description: |
      Three dimension scores (quality, timeliness, satisfaction) and a weighted
      composite, computed from the installer's ScorecardEvent history. Evaluated
      in two variants over two different event sets: a hard 90-day window that
      gates PROBATION and removal, and a decayed lifetime score that is
      reporting-only.
    trigger: |
      Recomputed, both variants, at the end of every request that appends a
      ScorecardEvent (POST /installers/{id}/scorecard-events, assignment
      completion, NO_SHOW release, punch escalation, warranty upheld) and inside
      POST /_clock/set_current_utc (because both the rolling window and the decay
      bands are measured from the logical clock).
    algorithm: decay_function
    input_set: |
      ROLLING_90D: ScorecardEvent rows for this installer with
        occurred_at >= clock_now - ROLLING_WINDOW_DAYS days (INCLUSIVE lower
        bound; an event exactly 90 days old is INSIDE the window).
      LIFETIME_DECAYED: every ScorecardEvent row for this installer, with no
        window at all.
    formula: |
      STEP 1 — per-event deltas, from POINTS[event_type]:
        event_type            quality  timeliness  satisfaction
        ON_TIME_COMPLETION      +2.00      +6.00        +1.00
        LATE_COMPLETION          0.00      -8.00        -3.00
        NO_SHOW                 -4.00     -20.00       -10.00
        PUNCH_MINOR             -3.00       0.00        -1.00
        PUNCH_MAJOR             -8.00      -2.00        -4.00
        PUNCH_SAFETY           -15.00      -3.00        -8.00
        WARRANTY_UPHELD        -10.00       0.00        -6.00
        CSAT_SURVEY              0.00       0.00   (csat_score - 3) * CSAT_POINT_STEP
      CSAT_SURVEY satisfaction deltas therefore are: csat 1 -> -10.00,
      2 -> -5.00, 3 -> 0.00, 4 -> +5.00, 5 -> +10.00.
      These three numbers are persisted on the ScorecardEvent row as
      quality_delta / timeliness_delta / satisfaction_delta and are NEVER
      rewritten afterwards.

      STEP 2 — event weight
        ROLLING_90D:      weight = 1.00 for every event in the window.
        LIFETIME_DECAYED: age_days = (clock_now - occurred_at) in whole days,
                          floored; weight = DECAY_BANDS[age_days]:
            age_days <= 90                      -> 1.00
            90 < age_days <= 270                -> 0.60
            270 < age_days <= 540               -> 0.30
            age_days > 540                      -> 0.10

      STEP 3 — dimension totals (pinned order: multiply each delta by its
               weight, sum the products exactly, add the base, THEN round once)
        for d in {quality, timeliness, satisfaction}:
          raw_d = BASE_SCORE + sum(event.<d>_delta * weight(event))
          score_d = min(100.00, max(0.00, round_half_up(raw_d, 2)))

      STEP 4 — weighted composite (pinned order: use the ROUNDED dimension
               scores, multiply by the weights, sum, then round once)
        composite = round_half_up(  score_quality      * WEIGHT_QUALITY
                                  + score_timeliness   * WEIGHT_TIMELINESS
                                  + score_satisfaction * WEIGHT_SATISFACTION, 2)

      STEP 5 — persisted fields
        ROLLING_90D writes Installer.quality_score, Installer.timeliness_score,
          Installer.satisfaction_score, Installer.composite_score,
          Installer.rolling_event_count, Installer.rolling_no_show_count.
        LIFETIME_DECAYED writes Installer.lifetime_composite_score ONLY.

      STEP 6 — thresholds (all evaluated against the ROLLING_90D composite;
               lifetime_composite_score never gates anything)
        removal_eligible = (composite_score <= REMOVAL_COMPOSITE_MAX
                            AND rolling_event_count >= MIN_EVENTS_FOR_ACTION)
                           OR rolling_no_show_count >= REMOVAL_NO_SHOW_COUNT
                           OR (count of PUNCH_SAFETY events in the rolling
                               window >= REMOVAL_SAFETY_COUNT)
        Installer ACTIVE -> PROBATION when
          composite_score <= PROBATION_COMPOSITE_MAX
          AND rolling_event_count >= MIN_EVENTS_FOR_ACTION
        Installer PROBATION -> ACTIVE when composite_score > PROBATION_COMPOSITE_MAX
    constants:
      BASE_SCORE: 85.00
      ROLLING_WINDOW_DAYS: 90
      CSAT_POINT_STEP: 5.00
      WEIGHT_QUALITY: 0.45
      WEIGHT_TIMELINESS: 0.30
      WEIGHT_SATISFACTION: 0.25
      PROBATION_COMPOSITE_MAX: 78.00
      REMOVAL_COMPOSITE_MAX: 70.00
      MIN_EVENTS_FOR_ACTION: 3
      REMOVAL_NO_SHOW_COUNT: 3
      REMOVAL_SAFETY_COUNT: 2
    precision: "2 decimal places, round_half_up; dimension scores clamped to [0.00, 100.00]"
    variants:
      - name: ROLLING_90D
        when: "always — this is the governing score for PROBATION and removal"
        difference: |
          Hard cut-off: events older than 90 days contribute nothing at all
          (weight 0), events inside the window contribute at full weight.
      - name: LIFETIME_DECAYED
        when: "always — reported alongside, never used as a gate"
        difference: |
          No cut-off: every event ever recorded contributes, attenuated by its
          age band (1.00 / 0.60 / 0.30 / 0.10). An installer with a clean recent
          record but old failures scores higher on ROLLING_90D than on
          LIFETIME_DECAYED; the two values are asserted independently.
    worked_example: |
      clock_now = 2026-08-01T00:00:00Z, so the rolling window opens at
      2026-05-03T00:00:00Z (inclusive). Six events:
        E1 ON_TIME_COMPLETION 2026-07-01T00:00:00Z   age  31 d  in window, decay 1.00
        E2 LATE_COMPLETION    2026-06-15T00:00:00Z   age  47 d  in window, decay 1.00
        E3 PUNCH_MAJOR        2026-05-03T00:00:00Z   age  90 d  in window, decay 1.00
        E4 CSAT_SURVEY csat 2 2026-05-02T00:00:00Z   age  91 d  OUT,       decay 0.60
        E5 WARRANTY_UPHELD    2026-01-15T00:00:00Z   age 198 d  OUT,       decay 0.60
        E6 NO_SHOW            2025-03-10T00:00:00Z   age 509 d  OUT,       decay 0.30
      ROLLING_90D (E1,E2,E3 only):
        quality      85.00 + 2.00 + 0.00 - 8.00 = 79.00
        timeliness   85.00 + 6.00 - 8.00 - 2.00 = 81.00
        satisfaction 85.00 + 1.00 - 3.00 - 4.00 = 79.00
        composite = 79.00*0.45 + 81.00*0.30 + 79.00*0.25
                  = 35.55 + 24.30 + 19.75 = 79.60
        rolling_event_count 3, rolling_no_show_count 0
      LIFETIME_DECAYED (all six):
        quality      85.00 + 2.00 - 8.00 - 6.00 - 1.20 = 71.80
        timeliness   85.00 + 6.00 - 8.00 - 2.00 - 6.00 = 75.00
        satisfaction 85.00 + 1.00 - 3.00 - 3.00 - 3.60 - 3.00 = 69.40
        composite = 71.80*0.45 + 75.00*0.30 + 69.40*0.25
                  = 32.31 + 22.50 + 17.35 = 72.16
      composite_score 79.60 (above 78.00 -> stays ACTIVE) versus
      lifetime_composite_score 72.16. Same six rows, two different answers.
    boundary_example: |
      Removal boundary at REMOVAL_COMPOSITE_MAX = 70.00 (INCLUSIVE), all events
      inside the rolling window:
        EXACTLY AT the boundary — 1 PUNCH_SAFETY + 1 PUNCH_MINOR + 3 CSAT_SURVEY(csat 2):
          quality      85.00 - 15.00 - 3.00                     = 67.00
          timeliness   85.00 -  3.00 -  0.00                     = 82.00
          satisfaction 85.00 -  8.00 -  1.00 - 5.00*3            = 61.00
          composite = 67.00*0.45 + 82.00*0.30 + 61.00*0.25
                    = 30.15 + 24.60 + 15.25 = 70.00
          rolling_event_count 5 -> removal_eligible == true
        ONE TICK ABOVE — same set with one CSAT_SURVEY(csat 2) replaced by csat 3:
          satisfaction 85.00 - 8.00 - 1.00 - 5.00*2 = 66.00
          composite = 30.15 + 24.60 + 16.50 = 71.25 -> removal_eligible == false
                      (still <= 78.00, so the installer sits in PROBATION)
        ONE TICK BELOW — same set with a fourth CSAT_SURVEY(csat 2):
          satisfaction 85.00 - 8.00 - 1.00 - 5.00*4 = 56.00
          composite = 30.15 + 24.60 + 14.00 = 68.75 -> removal_eligible == true

  - name: cancellation_settlement
    description: |
      Splits Project.deposit_held_cents into a retained part and a refunded part
      when a project is cancelled, and decides the resulting financial_status.
      The waiver ladder is evaluated in a PINNED order with first-match-wins
      semantics; evaluating the tiers in any other order gives a different,
      wrong retained amount.
    trigger: "POST /projects/{id}/cancel, and the MEASUREMENT_VARIANCE-decline cascade inside POST /change-orders/{id}/decide"
    algorithm: waterfall_allocation
    input_set: |
      The Project (deposit_held_cents, quoted_labor_cents, permit_status,
      permit_responsibility, created_at), the fulfillment_status the project held
      IMMEDIATELY BEFORE this cancellation, the project's MaterialDelivery and
      the status IT held immediately before the RETURNED cascade, the acting
      role, and the project's Customer (project_count).
    formula: |
      STEP 1 — labor forfeit percentage, keyed on the PRE-CANCELLATION
               fulfillment_status:
        DRAFT, MEASURE_PENDING     -> 0.00
        MEASURED, CHANGE_PENDING   -> FORFEIT_PCT_MEASURED
        SCHEDULED                  -> FORFEIT_PCT_SCHEDULED
        IN_PROGRESS                -> FORFEIT_PCT_IN_PROGRESS
        (INSTALL_COMPLETE, PUNCH_OPEN, CLOSED and CANCELLED are not cancellable
         at all — see §1.4.)

      STEP 2 labor_forfeit_cents = round_half_up(Project.deposit_held_cents
                                                 * labor_forfeit_pct)

      STEP 3 — restocking fee, keyed on the PRE-CASCADE MaterialDelivery.status:
        no delivery, or PLANNED    -> 0
        IN_TRANSIT or DELAYED      -> round_half_up(MaterialDelivery.material_cost_cents
                                                    * RESTOCK_PCT_IN_TRANSIT)
        DELIVERED                  -> round_half_up(MaterialDelivery.material_cost_cents
                                                    * RESTOCK_PCT_DELIVERED)
        RETURNED                   -> 0  (already returned by an earlier cascade)
        restocking_fee_cents = that value

      STEP 4 gross_retained_cents = labor_forfeit_cents + restocking_fee_cents

      STEP 5 — WAIVER LADDER. Evaluate the tiers TOP TO BOTTOM. The FIRST tier
               whose condition holds decides the answer and NO LATER TIER IS
               CONSULTED. This order is part of the contract.
        T1 RETAILER_FAULT — the acting role is ProgramAdmin or ServiceManager
             => tier_retained_cents = 0
        T2 COOLING_OFF — (clock_now - Project.created_at) <= COOLING_OFF_HOURS
             hours (INCLUSIVE upper bound)
             => tier_retained_cents = 0
        T3 PERMIT_BLOCKED — Project.permit_status == PENDING_APPLICATION AND
             Project.permit_responsibility == RETAILER
             => tier_retained_cents = restocking_fee_cents   (labor forfeit waived)
        T4 GOODWILL — Customer.project_count >= GOODWILL_PROJECT_COUNT
             => tier_retained_cents = round_half_up(gross_retained_cents
                                                    * GOODWILL_PCT)
        T5 NONE — always matches
             => tier_retained_cents = gross_retained_cents

      STEP 6 retained_cents = min(tier_retained_cents, Project.deposit_held_cents)
             refund_cents   = Project.deposit_held_cents - retained_cents

      STEP 7 — bucket movement (the conservation invariant must still hold)
             deposit_forfeited_cents += retained_cents
             deposit_refunded_cents  += refund_cents
             deposit_held_cents       = 0

      STEP 8 — resulting financial_status
             retained_cents == 0                          -> REFUNDED
             refund_cents == 0 and retained_cents > 0     -> FORFEITED
             otherwise                                    -> PARTIALLY_REFUNDED
             (A project with deposit_held_cents == 0 at cancellation retains 0
              and refunds 0, and therefore lands in REFUNDED.)
    constants:
      FORFEIT_PCT_MEASURED: 0.10
      FORFEIT_PCT_SCHEDULED: 0.25
      FORFEIT_PCT_IN_PROGRESS: 0.50
      RESTOCK_PCT_IN_TRANSIT: 0.06
      RESTOCK_PCT_DELIVERED: 0.12
      COOLING_OFF_HOURS: 72
      GOODWILL_PROJECT_COUNT: 3
      GOODWILL_PCT: 0.50
      REINSTATE_WINDOW_HOURS: 72
    precision: "integer cents; round_half_up at STEP 2, STEP 3 and STEP 4's goodwill halving"
    worked_example: |
      All three examples use deposit_held_cents 59002 and material_cost_cents 250000.
      (A) IN_PROGRESS, delivery DELIVERED, cancelled by the Customer 10 days in,
          Customer.project_count 1:
            labor_forfeit = round_half_up(59002 * 0.50) = round_half_up(29501.0) = 29501
            restocking    = round_half_up(250000 * 0.12) = 30000
            gross         = 59501
            ladder: T1 no, T2 no, T3 no, T4 no, T5 -> 59501
            retained = min(59501, 59002) = 59002; refund = 0 -> FORFEITED
      (B) SCHEDULED, delivery IN_TRANSIT, cancelled by the Customer 10 days in,
          Customer.project_count 1:
            labor_forfeit = round_half_up(59002 * 0.25) = round_half_up(14750.5) = 14751
            restocking    = round_half_up(250000 * 0.06) = 15000
            gross         = 29751
            ladder: T5 -> 29751; retained 29751; refund 59002 - 29751 = 29251
            -> PARTIALLY_REFUNDED
      (C) SAME as (B) but cancelled 48 hours after creation by a Customer whose
          project_count is 4 — BOTH T2 and T4 hold:
            ladder: T1 no, T2 YES -> tier_retained_cents = 0. T4 is never consulted.
            retained 0; refund 59002 -> REFUNDED
          Consulting T4 first would give round_half_up(29751 * 0.50) =
          round_half_up(14875.5) = 14876 retained and 44126 refunded, landing in
          PARTIALLY_REFUNDED. That is the WRONG answer.

  - name: permit_responsibility_determination
    description: |
      Decides whether a permit is required for a project, who must pull it, and
      therefore the project's initial permit_status. Re-runs whenever
      effective_units changes, so the unit threshold can be crossed in either
      direction during the project's life.
    trigger: |
      POST /projects (initial determination) and POST /measurements/{id}/complete
      (re-determination, because effective_units switches from estimated_units to
      measured_units).
    algorithm: threshold
    input_set: "The Project's effective_units, its ServiceCategory (permit_policy, trade_code), its Jurisdiction (permit_required_trades, permit_unit_threshold, permit_responsible_party), and the InstallerCredential rows for that jurisdiction and trade."
    formula: |
      STEP 1 — is a permit needed?
        ServiceCategory.permit_policy == NEVER  -> permit_needed = false
        ServiceCategory.permit_policy == ALWAYS -> permit_needed = true
        ServiceCategory.permit_policy == BY_JURISDICTION ->
          permit_needed = (ServiceCategory.trade_code IN
                             Jurisdiction.permit_required_trades)
                          AND (Project.effective_units
                                 >= Jurisdiction.permit_unit_threshold)
          The unit test is an INCLUSIVE lower bound: effective_units exactly
          equal to permit_unit_threshold DOES require a permit.

      STEP 2 — permit_needed == false
        permit_responsibility = NOT_REQUIRED
        permit_status         = NOT_REQUIRED

      STEP 3 — permit_needed == true
        candidate = Jurisdiction.permit_responsible_party
        INSTALLER FALLBACK: when candidate == INSTALLER and there is NO
          InstallerCredential row with jurisdiction_id == Project.jurisdiction_id
          AND trade_code == ServiceCategory.trade_code
          AND verification_status == VERIFIED
          AND permit_pulling_authorized == true,
          then candidate = RETAILER.
        permit_responsibility = candidate
        permit_status         = PENDING_APPLICATION
        (Re-determination never rewinds a permit that has already progressed: if
         the current permit_status is not NOT_REQUIRED and not
         PENDING_APPLICATION, permit_status is left untouched and only
         permit_responsibility is refreshed.)
    constants: {}
    precision: "n/a — enum result"
    worked_example: |
      Jurisdiction: permit_required_trades [FLOORING, HVAC, ROOFING],
      permit_unit_threshold 250.00, permit_responsible_party RETAILER.
      Category: trade_code FLOORING, permit_policy BY_JURISDICTION.
        effective_units 249.00 -> permit_needed false -> NOT_REQUIRED / NOT_REQUIRED
        effective_units 250.00 -> permit_needed true  -> RETAILER / PENDING_APPLICATION
      A project created with estimated_units 249.00 (NOT_REQUIRED) whose
      measurement completes at 250.00 flips UP to PENDING_APPLICATION; a project
      created at 250.00 whose measurement completes at 249.00 flips DOWN to
      NOT_REQUIRED.

  - name: delivery_sync_slack
    description: |
      Two integer quantities that couple the material delivery to the install
      window: the slack available before an assignment may be confirmed, and the
      delivery lateness in whole days that excuses installer lateness.
    trigger: |
      delivery_slack_hours is evaluated inside POST /installer-assignments/{id}/confirm.
      delay_days is evaluated inside POST /material-deliveries/{id}/status when
      new_status == DELIVERED, and is read again by
      POST /installer-assignments/{id}/complete when deciding on_time.
    algorithm: interval_merge
    input_set: "The project's MaterialDelivery (promised_window_end, actual_delivered_at) and the InstallerAssignment being confirmed (window_start, window_end)."
    formula: |
      delivery_slack_hours = floor((InstallerAssignment.window_start
                                    - MaterialDelivery.promised_window_end)
                                   / 3600 seconds)
        Confirmation requires delivery_slack_hours >= MIN_DELIVERY_SLACK_HOURS.
        The comparison is on the FLOORED integer, so 23 hours 59 minutes floors
        to 23 and is rejected.
        A negative difference floors toward negative infinity and is rejected.

      delay_days = ceil(max(0, actual_delivered_at - promised_window_end)
                        / 86400 seconds)
        A delivery arriving at or before promised_window_end has delay_days 0.
        One second late gives delay_days 1.

      on_time (InstallerAssignment) = (completed_at <= window_end)
                                      OR (the project's MaterialDelivery has
                                          delay_days >= 1)
        The second clause is the lateness excuse: a late install behind a late
        delivery still emits an ON_TIME_COMPLETION ScorecardEvent.
    constants:
      MIN_DELIVERY_SLACK_HOURS: 24
    precision: "integer hours (floored) and integer days (ceiled)"
    worked_example: |
      promised_window_end 2026-08-20T09:00:00.000Z.
        window_start 2026-08-21T09:00:00.000Z -> difference exactly 86400 s ->
          floor(24.0) = 24 -> 24 >= 24 -> CONFIRM allowed.
        window_start 2026-08-21T08:59:00.000Z -> difference 86340 s ->
          floor(23.9833..) = 23 -> 23 < 24 -> CONFIRM rejected.
      actual_delivered_at 2026-08-20T09:00:00.000Z -> delay_days 0.
      actual_delivered_at 2026-08-20T09:00:01.000Z -> ceil(1/86400) -> delay_days 1.
      actual_delivered_at 2026-08-21T09:00:00.000Z -> ceil(86400/86400) -> delay_days 1.
      actual_delivered_at 2026-08-21T09:00:01.000Z -> delay_days 2.

  - name: installer_capacity_and_overlap
    description: |
      The two resource constraints on an installer's calendar: no two live
      assignments may overlap once a travel buffer is added to each window, and
      the installer's total committed minutes may not exceed the program cap.
    trigger: "POST /installer-assignments (creation). Both checks re-read the installer's live assignments at the moment of the write."
    algorithm: interval_merge
    input_set: |
      All InstallerAssignment rows for the same installer_id whose status is IN
      {HELD, CONFIRMED, IN_PROGRESS}. RELEASED, COMPLETED and NO_SHOW rows are
      excluded from the overlap test. Installer.committed_minutes additionally
      counts COMPLETED rows.
    formula: |
      duration_minutes = floor((window_end - window_start) / 60 seconds)

      OVERLAP: the new assignment conflicts with an existing live assignment iff
        new.window_start < existing.window_end + TRAVEL_BUFFER_MINUTES minutes
        AND existing.window_start < new.window_end + TRAVEL_BUFFER_MINUTES minutes
      Each window is half-open [window_start, window_end) and is extended at its
      END by the travel buffer only. Both comparisons are STRICT '<', so a new
      window starting exactly at existing.window_end + 90 minutes is allowed.

      CAPACITY: Installer.committed_minutes + duration_minutes
                <= MAX_COMMITTED_MINUTES
      committed_minutes is the sum of duration_minutes over that installer's
      assignments with status IN {HELD, CONFIRMED, IN_PROGRESS, COMPLETED}, and
      is decremented again when an assignment becomes RELEASED or NO_SHOW.
    constants:
      TRAVEL_BUFFER_MINUTES: 90
      MAX_COMMITTED_MINUTES: 4800
    precision: "integer minutes"
    worked_example: |
      Existing CONFIRMED assignment [2026-08-25T08:00:00.000Z,
      2026-08-25T16:00:00.000Z) -> buffered end 2026-08-25T17:30:00.000Z,
      duration_minutes 480.
        New window_start 2026-08-25T17:30:00.000Z -> 17:30 < 17:30 is false ->
          NO conflict -> assignment created.
        New window_start 2026-08-25T17:29:00.000Z -> 17:29 < 17:30 is true, and
          08:00 < new.window_end + 90 min is true -> CONFLICT ->
          ERR_INSTALLER_WINDOW_CONFLICT.

  - name: project_total_due
    description: |
      The invoice total, the customer's outstanding balance, and the four-bucket
      deposit ledger that must always reconcile to the cumulative amount paid.
    trigger: |
      Recomputed at the end of every request that writes final_labor_cents,
      change_order_upcharge_cents, permit_fee_cents_billed or any deposit bucket:
      POST /projects/{id}/deposit, POST /change-orders/{id}/decide,
      POST /projects/{id}/permit/issue,
      POST /installer-assignments/{id}/complete,
      POST /projects/{id}/pay-balance, POST /projects/{id}/cancel,
      POST /projects/{id}/reinstate.
    algorithm: aggregation
    input_set: "The Project's own money fields plus its ACCEPTED change orders with origin IN {CUSTOMER_REQUEST, SITE_CONDITION}."
    formula: |
      change_order_upcharge_cents = sum(ChangeOrder.upcharge_cents
        over this project's change orders with status == ACCEPTED
        AND origin IN {CUSTOMER_REQUEST, SITE_CONDITION})
        MEASUREMENT_VARIANCE change orders are excluded — their amount is a
        disclosure of what the FINAL labor variant already charges.

      total_due_cents = 0 when final_labor_cents IS NULL, otherwise
        final_labor_cents + change_order_upcharge_cents + permit_fee_cents_billed

      DEPOSIT WATERFALL, run once when final_labor_cents is first written:
        applied = min(deposit_held_cents, total_due_cents)
        deposit_applied_cents += applied
        deposit_held_cents    -= applied
        surplus = deposit_held_cents          # only non-zero when the deposit
        deposit_refunded_cents += surplus     # exceeds the whole invoice
        deposit_held_cents = 0

      balance_due_cents = max(0, total_due_cents - deposit_applied_cents)

      CONSERVATION INVARIANT (must hold after EVERY write, with no exception):
        deposit_paid_cents == deposit_held_cents + deposit_applied_cents
                              + deposit_refunded_cents + deposit_forfeited_cents
    constants: {}
    precision: "integer cents; no rounding is performed here — every input is already whole cents"
    worked_example: |
      final_labor_cents 253942, one ACCEPTED CUSTOMER_REQUEST change order with
      upcharge_cents 10546, permit_fee_cents_billed 18500:
        total_due_cents = 253942 + 10546 + 18500 = 282988
      deposit_paid_cents 59002, all of it in deposit_held_cents before completion:
        applied = min(59002, 282988) = 59002 -> deposit_applied_cents 59002,
        deposit_held_cents 0, deposit_refunded_cents 0, deposit_forfeited_cents 0
        balance_due_cents = max(0, 282988 - 59002) = 223986
        invariant: 59002 == 0 + 59002 + 0 + 0  OK
      financial_status DEPOSIT_HELD -> BALANCE_DUE because balance_due_cents > 0.
      After POST /projects/{id}/pay-balance with amount_cents 223986:
        balance_due_cents 0 -> financial_status SETTLED; the deposit buckets are
        untouched by a balance payment, so the invariant still reads
        59002 == 0 + 59002 + 0 + 0.

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# =============================================================================
# The implementation MUST evaluate these checks in ascending `priority` order and
# return the FIRST failure it meets. Several deliberately adjacent pairs are
# reachable by a single request that violates both; the lower-numbered rule's
# error_id is the only correct answer.
validations:

  # --- 1-2: authentication and authorization ---------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7 and that role appears in the target endpoint's `roles:` list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  # --- 3-5: request shape ----------------------------------------------------
  - priority: 3
    category: business_constraint
    check: "Every required field of the endpoint's `input:` is present and non-null"
    error_id: ERR_MISSING_REQUIRED_FIELD
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 4
    category: business_constraint
    check: "Every supplied field has the declared type, every enum value is a member of its declared enum set, every money field is a JSON integer (never a string and never a float), and every instant is an ISO 8601 UTC string with exactly three fractional digits"
    error_id: ERR_INVALID_FIELD_TYPE
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 5
    category: business_constraint
    check: "Numeric range and string length constraints from §1.1 hold: units > 0 with at most 2 decimals, cents >= 0, csat_score in 1..5, workmanship_score in 0..100, pagination limit in 1..100 and offset >= 0, window_end strictly after window_start, promised_window_end strictly after promised_window_start"
    error_id: ERR_FIELD_OUT_OF_RANGE
    http_status: 422
    applies_to: all

  # --- 6-8: existence, left to right ----------------------------------------
  - priority: 6
    category: existence
    check: "Every id appearing in the PATH resolves to a stored row, validated left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 7
    category: existence
    check: "Every FK id in the request BODY resolves to a stored row, validated in the field order declared by the endpoint's `input:`"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /projects, POST /change-orders, POST /installer-assignments, POST /installers/{id}/credentials, POST /customers, POST /installers/{id}/scorecard-events"

  - priority: 8
    category: business_constraint
    check: "Uniqueness: ServiceCategory.code is unique, Jurisdiction.code is unique, and an InstallerCredential is unique on (installer_id, jurisdiction_id, trade_code) across rows whose verification_status is not REJECTED"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /service-categories, POST /jurisdictions, POST /installers/{id}/credentials"

  # --- 9-11: optimistic concurrency -----------------------------------------
  - priority: 9
    category: business_constraint
    check: "When the endpoint declares an OCC field, that field is present and is a positive integer"
    error_id: ERR_MISSING_REQUIRED_FIELD
    http_status: 422
    applies_to: "POST /installer-assignments, POST /change-orders, POST /projects/{id}/reinstate, POST /installers/{id}/remove"

  - priority: 10
    category: state
    check: "expected_project_version equals the target Project's current version (§1.2.1 rules assignment-create-stale-project, change-order-create-stale-project, project-reinstate-stale-project)"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /installer-assignments, POST /change-orders, POST /projects/{id}/reinstate"

  - priority: 11
    category: state
    check: "expected_installer_version equals the target Installer's current version (§1.2.1 rule installer-remove-stale-installer)"
    error_id: ERR_STALE_INSTALLER_VERSION
    http_status: 412
    applies_to: "POST /installers/{id}/remove"

  # --- 12-15: state preconditions -------------------------------------------
  - priority: 12
    category: state
    check: "The target entity's own status permits the requested transition, per its §1.2 state machine. Four endpoints are carved out of this generic rule and are governed by their own specific rules instead: POST /projects/{id}/cancel and POST /projects/{id}/close by priority 38, PunchListItem resolve/verify by priority 21, and POST /warranty-claims by priority 31 — so an un-cancellable project returns ERR_NOT_CANCELLABLE, never ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints except POST /projects/{id}/cancel, POST /projects/{id}/close, POST /punch-list-items/{id}/resolve, POST /punch-list-items/{id}/verify and POST /warranty-claims"

  - priority: 13
    category: state
    check: "The target entity is not already in a terminal state for its machine (Project.fulfillment_status CLOSED, ChangeOrder ACCEPTED/DECLINED/SUPERSEDED, PunchListItem VERIFIED, WarrantyClaim UPHELD/DENIED, Installer REMOVED, Measurement COMPLETED/VOIDED, MaterialDelivery RETURNED)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 14
    category: state
    check: "The owning Project's fulfillment_status is not CANCELLED for any operation that writes a child of that project"
    error_id: ERR_PROJECT_CANCELLED
    http_status: 409
    applies_to: "POST /projects/{id}/measurements, POST /change-orders, POST /installer-assignments, POST /projects/{id}/material-deliveries, POST /projects/{id}/quality-inspection"

  - priority: 15
    category: business_referential
    check: "Every FK in the body points at a row that is compatible with the target: ServiceCategory.status == ACTIVE at project creation, Jurisdiction.status == ACTIVE at project and assignment creation, and the InstallerAssignment's project and installer are not already linked by a live assignment"
    error_id: ERR_REFERENCE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /projects, POST /installer-assignments"

  # --- 16-22: safety, licensing and compliance (before any money check) ------
  - priority: 16
    category: business_safety
    check: "The Installer being assigned has status IN {ACTIVE, PROBATION}. APPLIED, DOCS_PENDING, VERIFIED, SUSPENDED and REMOVED installers cannot be assigned."
    error_id: ERR_INSTALLER_NOT_ASSIGNABLE
    http_status: 409
    applies_to: "POST /installer-assignments"

  - priority: 17
    category: business_safety
    check: "The Installer holds an InstallerCredential with verification_status == VERIFIED for the project's jurisdiction_id AND the service category's trade_code, whenever Jurisdiction.license_required is true"
    error_id: ERR_INSTALLER_NOT_LICENSED
    http_status: 409
    applies_to: "POST /installer-assignments"

  - priority: 18
    category: business_safety
    check: "Installer.background_check_result == PASS and background_check_completed_at is no older than Jurisdiction.background_check_recency_days whole days from the logical clock (inclusive)"
    error_id: ERR_BACKGROUND_CHECK_STALE
    http_status: 409
    applies_to: "POST /installer-assignments"

  - priority: 19
    category: business_safety
    check: "Installer.insurance_expires_on is strictly after the logical clock AND Installer.liability_coverage_cents >= Jurisdiction.min_liability_coverage_cents"
    error_id: ERR_INSURANCE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /installer-assignments"

  - priority: 20
    category: business_safety
    check: "When the project's ServiceCategory has measurement_required == true, the project has a Measurement with status == COMPLETED, and the assignment's window_start is no later than that measurement's completed_at plus ServiceCategory.measurement_validity_days whole days (INCLUSIVE upper bound)"
    error_id: ERR_MEASUREMENT_STALE
    http_status: 409
    applies_to: "POST /installer-assignments"

  - priority: 21
    category: business_safety
    check: "A SAFETY PunchListItem may only be resolved from ESCALATED, and may only be verified by a ServiceManager; a project may not close while any PunchListItem is in OPEN or ESCALATED"
    error_id: ERR_PUNCH_LIST_NOT_CLEARED
    http_status: 409
    applies_to: "POST /punch-list-items/{id}/resolve, POST /punch-list-items/{id}/verify, POST /projects/{id}/close"

  - priority: 22
    category: business_safety
    check: "A project whose Jurisdiction.inspection_required is true and whose permit_responsibility is not NOT_REQUIRED may not be closed until permit_status == CLOSED"
    error_id: ERR_INSPECTION_NOT_PASSED
    http_status: 409
    applies_to: "POST /projects/{id}/close"

  # --- 23-27: constraint satisfaction (temporal, capacity, aggregate) -------
  - priority: 23
    category: business_temporal
    check: "The new InstallerAssignment window does not conflict with any live assignment of the same installer once TRAVEL_BUFFER_MINUTES is added to each window's end (installer_capacity_and_overlap)"
    error_id: ERR_INSTALLER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /installer-assignments"

  - priority: 24
    category: business_constraint
    check: "Installer.committed_minutes + the new assignment's duration_minutes <= MAX_COMMITTED_MINUTES"
    error_id: ERR_INSTALLER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /installer-assignments"

  - priority: 25
    category: business_temporal
    check: "delivery_sync_slack.delivery_slack_hours >= MIN_DELIVERY_SLACK_HOURS for the assignment being confirmed, and the project has a MaterialDelivery whose status is IN {PLANNED, IN_TRANSIT, DELIVERED}"
    error_id: ERR_DELIVERY_SLACK_INSUFFICIENT
    http_status: 409
    applies_to: "POST /installer-assignments/{id}/confirm"

  - priority: 26
    category: business_temporal
    check: "An inspection slot_start is at least Jurisdiction.inspection_lead_days whole days after the logical clock (inclusive), and slot_end is strictly after slot_start"
    error_id: ERR_INSPECTION_LEAD_TIME
    http_status: 422
    applies_to: "POST /projects/{id}/inspection-slot"

  - priority: 27
    category: business_constraint
    check: "The number of other Projects in the same jurisdiction whose permit_status == INSPECTION_SCHEDULED and whose [inspection_slot_start, inspection_slot_end] closed interval intersects the requested slot is strictly less than Jurisdiction.max_concurrent_inspections"
    error_id: ERR_INSPECTION_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /projects/{id}/inspection-slot"

  # --- 28-31: workflow correctness ------------------------------------------
  - priority: 28
    category: business_referential
    check: "Change-order shape matches its origin: lines MUST be empty when origin == MEASUREMENT_VARIANCE and MUST hold 1..10 entries otherwise; source_measurement_id may never be supplied by a client; supersedes_change_order_id, when present, points at a ChangeOrder on the SAME project whose status is IN {DRAFT, PENDING_CUSTOMER, REVISION_REQUESTED}"
    error_id: ERR_CHANGE_ORDER_SHAPE
    http_status: 422
    applies_to: "POST /change-orders, POST /change-orders/{id}/submit"

  - priority: 29
    category: business_constraint
    check: "The acting X-User-ID owns the resource it is acting on: a Customer decision must come from Project.customer_id, an Installer start/complete/resolve must come from the assignment's installer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /change-orders/{id}/decide, POST /installer-assignments/{id}/start, POST /installer-assignments/{id}/complete, POST /punch-list-items/{id}/resolve, POST /warranty-claims, POST /projects/{id}/deposit, POST /projects/{id}/pay-balance"

  - priority: 30
    category: business_constraint
    check: "The permit application is filed by the party named in Project.permit_responsibility: RETAILER -> ProjectCoordinator or ProgramAdmin, INSTALLER -> Installer, CUSTOMER -> Customer"
    error_id: ERR_WRONG_PERMIT_PARTY
    http_status: 403
    applies_to: "POST /projects/{id}/permit/apply"

  - priority: 31
    category: business_temporal
    check: "A WarrantyClaim's claim_type is LABOR_DEFECT and it is submitted no later than Project.closed_at plus WARRANTY_LABOR_DAYS (365) whole days, inclusive"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 409
    applies_to: "POST /warranty-claims"

  - priority: 32
    category: business_temporal
    check: "A reinstatement is requested strictly less than REINSTATE_WINDOW_HOURS (72) hours after Project.cancelled_at"
    error_id: ERR_REINSTATE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /projects/{id}/reinstate"

  - priority: 33
    category: business_constraint
    check: "Installer.removal_eligible is true and Installer.status is IN {ACTIVE, PROBATION, SUSPENDED}; an installer holding an InstallerAssignment with status == IN_PROGRESS cannot be removed (HELD and CONFIRMED holds are legal and are released by the removal cascade)"
    error_id: ERR_REMOVAL_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /installers/{id}/remove"

  # --- 34-38: fiscal checks, last -------------------------------------------
  - priority: 34
    category: business_fiscal
    check: "A deposit payment's amount_cents equals Project.deposit_required_cents exactly — partial and over-payment are both rejected"
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /projects/{id}/deposit"

  - priority: 35
    category: business_fiscal
    check: "An InstallerAssignment may only be created once Project.financial_status is IN {DEPOSIT_HELD, BALANCE_DUE, SETTLED}"
    error_id: ERR_DEPOSIT_NOT_HELD
    http_status: 409
    applies_to: "POST /installer-assignments"

  - priority: 36
    category: business_fiscal
    check: "A balance payment's amount_cents equals Project.balance_due_cents exactly, and Project.balance_due_cents is greater than 0"
    error_id: ERR_BALANCE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /projects/{id}/pay-balance"

  - priority: 37
    category: business_fiscal
    check: "A change order's upcharge_cents is not below the credit cap -round_half_up(Project.quoted_labor_cents * CREDIT_CAP_PCT)"
    error_id: ERR_CREDIT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /change-orders, POST /change-orders/{id}/submit"

  - priority: 38
    category: business_fiscal
    check: "A project may only be cancelled from fulfillment_status IN {DRAFT, MEASURE_PENDING, MEASURED, CHANGE_PENDING, SCHEDULED, IN_PROGRESS}; and a project may only be closed once Project.financial_status == SETTLED"
    error_id: ERR_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /projects/{id}/cancel, POST /projects/{id}/close"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Conventions:
#   * api_prefix is "/", so every collection sits at the root: /projects,
#     /installers, /change-orders, ...
#   * Every request carries X-User-ID and X-User-Role headers.
#   * Every list endpoint accepts limit? and offset? and returns the §1.0
#     pagination fields alongside its array.
#   * `input:` names the request-body fields for writes and the query-string
#     parameters for reads. A trailing `?` marks the field OPTIONAL.
#   * All money inputs are JSON integers of cents. All instants are ISO 8601
#     UTC strings with exactly three fractional digits.
endpoints:

  # ------------------------------------------------------- service catalogue ---
  - method: POST
    path: "/service-categories"
    description: "Register a service category with its scope, billing unit, pricing basis, measurement requirement and permit policy."
    roles: [ProgramAdmin]
    code: 201
    input: [code, name, trade_code, unit_of_measure, base_labor_rate_cents_per_unit, minimum_billable_units, measurement_required, "measurement_validity_days?", "permit_policy?", "deposit_pct?", "status?"]
    output: ServiceCategory
    side_effects:
      - "rejects a duplicate code with ERR_DUPLICATE_CODE"
      - "applies the §1.1 defaults for measurement_validity_days (45), permit_policy (BY_JURISDICTION), deposit_pct (0.30) and status (ACTIVE)"

  - method: GET
    path: "/service-categories"
    description: "List service categories, newest first by created_at DESC then id ASC."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager, Installer, Customer]
    code: 200
    input: ["status?", "trade_code?", "limit?", "offset?"]
    output: ServiceCategory[]
    side_effects: []

  - method: GET
    path: "/service-categories/{id}"
    description: "Fetch one service category."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager, Installer, Customer]
    code: 200
    input: []
    output: ServiceCategory
    side_effects: []

  - method: PATCH
    path: "/service-categories/{id}"
    description: "Amend a service category. Pricing and policy edits never retroactively touch a Project's frozen quoted_labor_cents or deposit_required_cents."
    roles: [ProgramAdmin]
    code: 200
    input: ["name?", "base_labor_rate_cents_per_unit?", "minimum_billable_units?", "measurement_validity_days?", "permit_policy?", "deposit_pct?", "status?"]
    output: ServiceCategory
    side_effects:
      - "increments ServiceCategory.version by 1"
      - "RETIRED categories are refused by POST /projects with ERR_REFERENCE_NOT_ELIGIBLE"

  - method: POST
    path: "/jurisdictions"
    description: "Register a permitting jurisdiction with its licensing, insurance, background-check, permit-threshold, inspection and labor-multiplier policy."
    roles: [ProgramAdmin]
    code: 201
    input: [code, name, permit_required_trades, permit_responsible_party, inspection_required, min_liability_coverage_cents, "permit_unit_threshold?", "inspection_lead_days?", "max_concurrent_inspections?", "background_check_recency_days?", "license_required?", "labor_complexity_multiplier?", "status?"]
    output: Jurisdiction
    side_effects:
      - "rejects a duplicate code with ERR_DUPLICATE_CODE"

  - method: GET
    path: "/jurisdictions"
    description: "List jurisdictions."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager, Installer, Customer]
    code: 200
    input: ["status?", "permit_responsible_party?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []

  - method: GET
    path: "/jurisdictions/{id}"
    description: "Fetch one jurisdiction."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager, Installer, Customer]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: PATCH
    path: "/jurisdictions/{id}"
    description: "Amend jurisdiction policy. Changing permit_unit_threshold does NOT re-run permit_responsibility_determination on existing projects; only a measurement completion does."
    roles: [ProgramAdmin]
    code: 200
    input: ["name?", "permit_required_trades?", "permit_unit_threshold?", "permit_responsible_party?", "inspection_required?", "inspection_lead_days?", "max_concurrent_inspections?", "background_check_recency_days?", "min_liability_coverage_cents?", "license_required?", "labor_complexity_multiplier?", "status?"]
    output: Jurisdiction
    side_effects:
      - "increments Jurisdiction.version by 1"

  # ------------------------------------------------------ installer network ---
  - method: POST
    path: "/installers"
    description: "Recruit an installer firm into the network. The row starts in status APPLIED with background_check_result NONE."
    roles: [NetworkManager]
    code: 201
    input: [legal_name, contact_email, primary_trade_code, liability_coverage_cents, insurance_expires_on]
    output: Installer
    side_effects:
      - "sets status = APPLIED and every scorecard field to its §1.1 default (85.00 scores, removal_eligible false)"

  - method: GET
    path: "/installers"
    description: "List installer firms, optionally filtered by network status, trade or removal eligibility."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager]
    code: 200
    input: ["status?", "primary_trade_code?", "removal_eligible?", "limit?", "offset?"]
    output: Installer[]
    side_effects: []

  - method: GET
    path: "/installers/{id}"
    description: "Fetch one installer firm, including its live scorecard fields and committed_minutes."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager, Installer]
    code: 200
    input: []
    output: Installer
    side_effects: []

  - method: PATCH
    path: "/installers/{id}"
    description: "Amend an installer's contact details, insurance limit or insurance expiry."
    roles: [NetworkManager]
    code: 200
    input: ["contact_email?", "liability_coverage_cents?", "insurance_expires_on?"]
    output: Installer
    side_effects:
      - "increments Installer.version by 1"
      - "does NOT re-validate existing assignments; the insurance check runs at assignment creation only"

  - method: POST
    path: "/installers/{id}/credentials"
    description: "File a trade licence for one installer in one jurisdiction. The credential starts PENDING; the first credential drives the installer APPLIED -> DOCS_PENDING."
    roles: [NetworkManager]
    code: 201
    input: [jurisdiction_id, trade_code, license_number, license_expires_on, "permit_pulling_authorized?"]
    output: InstallerCredential
    side_effects:
      - "sets verification_status = PENDING"
      - "drives Installer APPLIED -> DOCS_PENDING on the first credential"
      - "rejects a second live credential for the same (installer_id, jurisdiction_id, trade_code) with ERR_DUPLICATE_CODE"
      - "increments Installer.version by 1 when the installer status changed"

  - method: GET
    path: "/installers/{id}/credentials"
    description: "List every trade licence filed for one installer (FK reverse-reachability for InstallerCredential.installer_id)."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager, Installer]
    code: 200
    input: ["verification_status?", "limit?", "offset?"]
    output: InstallerCredential[]
    side_effects: []

  - method: GET
    path: "/installer-credentials"
    description: "List trade licences across the network, filtered by installer, jurisdiction, trade or verification status (FK reverse-reachability for InstallerCredential.jurisdiction_id)."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager]
    code: 200
    input: ["installer_id?", "jurisdiction_id?", "trade_code?", "verification_status?", "limit?", "offset?"]
    output: InstallerCredential[]
    side_effects: []

  - method: GET
    path: "/installer-credentials/{id}"
    description: "Fetch one trade licence."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager, Installer]
    code: 200
    input: []
    output: InstallerCredential
    side_effects: []

  - method: POST
    path: "/installer-credentials/{id}/verify"
    description: "Record the network manager's verification decision on a filed licence. VERIFY may promote the installer; REJECT may suspend it."
    roles: [NetworkManager]
    code: 200
    input: [verification_decision, "rejection_reason?"]
    output: InstallerCredential
    side_effects:
      - "VERIFY: verification_status PENDING -> VERIFIED, verified_at = clock_now"
      - "REJECT: verification_status PENDING|VERIFIED -> REJECTED with rejection_reason"
      - "recomputes Installer.verified_credential_count"
      - "may drive Installer DOCS_PENDING -> VERIFIED, SUSPENDED -> ACTIVE, or ACTIVE|PROBATION -> SUSPENDED with the release cascade"
      - "increments InstallerCredential.version by 1, and Installer.version by 1 when the installer changed"

  - method: POST
    path: "/installers/{id}/background-check"
    description: "Record a background-check outcome and the instant it completed. A PASS may complete the verification pair and promote the installer."
    roles: [NetworkManager]
    code: 200
    input: [result, completed_at]
    output: Installer
    side_effects:
      - "sets background_check_result and background_check_completed_at"
      - "may drive Installer DOCS_PENDING -> VERIFIED"
      - "increments Installer.version by 1"

  - method: POST
    path: "/installers/{id}/activate"
    description: "Admit a fully verified installer to the assignable network."
    roles: [NetworkManager]
    code: 200
    input: []
    output: Installer
    side_effects:
      - "status VERIFIED -> ACTIVE"
      - "runs installer_scorecard (both variants) and writes all five score fields plus removal_eligible"
      - "increments Installer.version by 1"

  - method: POST
    path: "/installers/{id}/remove"
    description: "Remove an installer from the network. Guarded by OCC on Installer.version (§1.2.1 installer-remove-stale-installer) and by removal_eligible."
    roles: [ServiceManager]
    code: 200
    input: [removal_reason, expected_installer_version]
    output: Installer
    side_effects:
      - "status ACTIVE|PROBATION|SUSPENDED -> REMOVED, removed_at = clock_now"
      - "releases every HELD or CONFIRMED assignment with release_reason 'INSTALLER_REMOVED' and reverts each affected Project SCHEDULED -> MEASURED"
      - "reduces Installer.committed_minutes by each released assignment's duration_minutes"
      - "increments Installer.version by 1"

  - method: POST
    path: "/installers/{id}/scorecard-events"
    description: "File a scorecard event against an installer. This is the operator surface used to record customer-satisfaction surveys and to log quality or timeliness observations that no cascade produced."
    roles: [ServiceManager, ProjectCoordinator]
    code: 201
    input: [event_type, occurred_at, "project_id?", "csat_score?"]
    output: ScorecardEvent
    side_effects:
      - "sets source = MANUAL and freezes quality_delta / timeliness_delta / satisfaction_delta from installer_scorecard.POINTS"
      - "recomputes installer_scorecard (both variants) and rewrites all five Installer score fields, rolling_event_count, rolling_no_show_count and removal_eligible"
      - "may drive Installer ACTIVE -> PROBATION or PROBATION -> ACTIVE"
      - "requires csat_score exactly when event_type == CSAT_SURVEY (ERR_INVALID_FIELD_TYPE otherwise)"
      - "increments Installer.version by 1"

  - method: GET
    path: "/installers/{id}/scorecard-events"
    description: "List every scorecard event ever filed for one installer, in occurred_at ASC then created_at ASC order (FK reverse-reachability for ScorecardEvent.installer_id). ScorecardEvent is an immutable ledger row: it has no version and no update endpoint."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager, Installer]
    code: 200
    input: ["event_type?", "source?", "limit?", "offset?"]
    output: ScorecardEvent[]
    side_effects: []

  - method: GET
    path: "/installers/{id}/scorecard"
    description: "Computed read: both installer_scorecard variants side by side, so a caller can compare the governing ROLLING_90D composite against the reporting-only LIFETIME_DECAYED composite without inferring either."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager, Installer]
    code: 200
    input: []
    output:
      rolling_quality_score: number
      rolling_timeliness_score: number
      rolling_satisfaction_score: number
      rolling_composite_score: number
      rolling_event_count: integer
      rolling_no_show_count: integer
      lifetime_quality_score: number
      lifetime_timeliness_score: number
      lifetime_satisfaction_score: number
      lifetime_composite_score: number
      lifetime_event_count: integer
      removal_eligible: boolean
      probation_active: boolean
    side_effects: []

  # ---------------------------------------------------------------- customers ---
  - method: POST
    path: "/customers"
    description: "Register a purchasing customer against a billing jurisdiction."
    roles: [ProgramAdmin, ProjectCoordinator]
    code: 201
    input: [full_name, email, jurisdiction_id]
    output: Customer
    side_effects:
      - "sets project_count = 0"

  - method: GET
    path: "/customers"
    description: "List customers (FK reverse-reachability for Customer.jurisdiction_id)."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager]
    code: 200
    input: ["jurisdiction_id?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: GET
    path: "/customers/{id}"
    description: "Fetch one customer, including the project_count that feeds the GOODWILL waiver tier."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ----------------------------------------------------------------- projects ---
  - method: POST
    path: "/projects"
    description: "Sell an installation project. Freezes the PROVISIONAL labor quote and the deposit requirement, and runs the initial permit determination."
    roles: [ProgramAdmin, ProjectCoordinator]
    code: 201
    input: [customer_id, service_category_id, jurisdiction_id, site_address, estimated_units, requested_install_date]
    output: Project
    side_effects:
      - "sets effective_units = estimated_units"
      - "runs project_labor_charge variant PROVISIONAL and freezes quoted_labor_cents"
      - "sets deposit_required_cents = round_half_up(quoted_labor_cents * ServiceCategory.deposit_pct)"
      - "runs permit_responsibility_determination and writes permit_responsibility and the initial permit_status"
      - "sets fulfillment_status = MEASURE_PENDING when ServiceCategory.measurement_required is true, otherwise MEASURED"
      - "sets financial_status = QUOTED and all four deposit buckets to 0"
      - "increments Customer.project_count by 1"

  - method: GET
    path: "/projects"
    description: "List projects across any of the three status dimensions (FK reverse-reachability for Project.customer_id, Project.service_category_id and Project.jurisdiction_id)."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, NetworkManager, Customer]
    code: 200
    input: ["customer_id?", "service_category_id?", "jurisdiction_id?", "fulfillment_status?", "financial_status?", "permit_status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: GET
    path: "/projects/{id}"
    description: "Fetch one project with all three status dimensions, every money field and the four deposit buckets."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, NetworkManager, Installer, Customer]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/projects/{id}/settlement-preview"
    description: "Computed read: what cancellation_settlement would return if the project were cancelled right now by the calling role, including which waiver tier matched. Read-only — it moves no bucket and changes no status."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Customer]
    code: 200
    input: []
    output:
      deposit_held_cents: integer
      labor_forfeit_pct: number
      labor_forfeit_cents: integer
      restocking_fee_cents: integer
      gross_retained_cents: integer
      matched_waiver_tier: string
      retained_cents: integer
      refund_cents: integer
      resulting_financial_status: string
    side_effects: []

  - method: POST
    path: "/projects/{id}/deposit"
    description: "Take the customer's deposit. The amount must equal deposit_required_cents exactly."
    roles: [Customer]
    code: 200
    input: [amount_cents]
    output: Project
    side_effects:
      - "financial_status QUOTED -> DEPOSIT_HELD"
      - "deposit_paid_cents += amount_cents and deposit_held_cents += amount_cents"
      - "the conservation invariant deposit_paid == held + applied + refunded + forfeited is re-checked"
      - "increments Project.version by 1"

  - method: POST
    path: "/projects/{id}/pay-balance"
    description: "Settle the invoice balance after installation. The amount must equal balance_due_cents exactly."
    roles: [Customer]
    code: 200
    input: [amount_cents]
    output: Project
    side_effects:
      - "financial_status BALANCE_DUE -> SETTLED"
      - "recomputes project_total_due so balance_due_cents becomes 0"
      - "leaves every deposit bucket untouched"
      - "increments Project.version by 1"

  - method: POST
    path: "/projects/{id}/cancel"
    description: "Cancel a project. Runs cancellation_settlement, moves the deposit buckets, and cascades to the project's measurement, change orders, delivery and assignment."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Customer]
    code: 200
    input: [cancel_reason]
    output: Project
    side_effects:
      - "fulfillment_status -> CANCELLED, cancelled_at = clock_now, cancel_reason recorded"
      - "runs cancellation_settlement with the PRE-cancellation fulfillment_status and the PRE-cascade MaterialDelivery.status"
      - "moves deposit_held_cents into deposit_forfeited_cents and deposit_refunded_cents, then sets financial_status to FORFEITED, REFUNDED or PARTIALLY_REFUNDED"
      - "cascade: any SCHEDULED Measurement -> VOIDED with voided_reason 'PROJECT_CANCELLED'"
      - "cascade: any DRAFT, PENDING_CUSTOMER or REVISION_REQUESTED ChangeOrder -> SUPERSEDED"
      - "cascade: any non-RETURNED MaterialDelivery -> RETURNED"
      - "cascade: any HELD, CONFIRMED or IN_PROGRESS InstallerAssignment -> RELEASED with release_reason 'PROJECT_CANCELLED', reducing Installer.committed_minutes"
      - "increments Project.version by 1"

  - method: POST
    path: "/projects/{id}/reinstate"
    description: "Undo a cancellation inside the 72-hour reinstatement window, reversing every settlement bucket movement exactly. Guarded by OCC on Project.version (§1.2.1 project-reinstate-stale-project)."
    roles: [ProgramAdmin, ProjectCoordinator]
    code: 200
    input: [expected_project_version, "reinstate_note?"]
    output: Project
    side_effects:
      - "fulfillment_status CANCELLED -> MEASURED (or MEASURE_PENDING when no COMPLETED measurement survives), cancelled_at and cancel_reason cleared to null"
      - "financial_status FORFEITED|REFUNDED|PARTIALLY_REFUNDED -> DEPOSIT_HELD"
      - "moves deposit_forfeited_cents and deposit_refunded_cents back into deposit_held_cents, restoring the exact pre-cancellation bucket split with no drift"
      - "does NOT un-void the VOIDED Measurement, does NOT un-supersede the SUPERSEDED change orders, and does NOT un-return the RETURNED delivery — those cascades are one-way and must be redone"
      - "increments Project.version by 1"

  - method: POST
    path: "/projects/{id}/quality-inspection"
    description: "Record the retailer's post-install quality inspection and open a punch list from the reported defects."
    roles: [ProjectCoordinator]
    code: 200
    input: [quality_result, workmanship_score, defects]
    output: Project
    side_effects:
      - "sets quality_result and workmanship_score"
      - "creates one PunchListItem per entry of `defects` (each entry is an object { severity, description, due_at }), in array order, each starting in status OPEN"
      - "fulfillment_status INSTALL_COMPLETE -> PUNCH_OPEN when defects is non-empty, and stays at INSTALL_COMPLETE when it is empty"
      - "appends one SYSTEM ScorecardEvent per created defect: PUNCH_MINOR, PUNCH_MAJOR or PUNCH_SAFETY according to its severity, occurred_at = clock_now, then recomputes installer_scorecard"
      - "increments Project.version by 1"
    note: "The created punch items are discoverable only through GET /projects/{id}/punch-list-items or GET /punch-list-items — the response carries the Project, not the children."

  - method: POST
    path: "/projects/{id}/close"
    description: "Close the project once the punch list is clear, the permit dimension is finished and the invoice is settled."
    roles: [ProjectCoordinator]
    code: 200
    input: []
    output: Project
    side_effects:
      - "fulfillment_status INSTALL_COMPLETE|PUNCH_OPEN -> CLOSED, closed_at = clock_now"
      - "requires every PunchListItem to be VERIFIED (no OPEN, RESOLVED or ESCALATED item remains)"
      - "requires permit_status IN {NOT_REQUIRED, CLOSED}"
      - "requires financial_status == SETTLED"
      - "starts the 365-day labour warranty clock at closed_at"
      - "increments Project.version by 1"

  - method: POST
    path: "/projects/{id}/permit/apply"
    description: "File the permit application with the jurisdiction. The acting role must match Project.permit_responsibility."
    roles: [ProgramAdmin, ProjectCoordinator, Installer, Customer]
    code: 200
    input: [permit_application_reference, "resubmit?"]
    output: Project
    side_effects:
      - "permit_status PENDING_APPLICATION -> APPLIED, or APPLIED -> PENDING_APPLICATION when resubmit is true"
      - "records permit_application_reference"
      - "increments Project.version by 1"

  - method: POST
    path: "/projects/{id}/permit/issue"
    description: "Record the jurisdiction issuing the permit and pass the permit fee through to the customer."
    roles: [ProgramAdmin, ProjectCoordinator]
    code: 200
    input: [permit_fee_cents, permit_issued_on]
    output: Project
    side_effects:
      - "permit_status APPLIED -> ISSUED, permit_issued_on recorded"
      - "sets permit_fee_cents_billed = permit_fee_cents and recomputes project_total_due"
      - "increments Project.version by 1"

  - method: POST
    path: "/projects/{id}/inspection-slot"
    description: "Reserve a jurisdiction inspection slot. Enforces the lead-time floor and the jurisdiction's concurrent-inspection capacity."
    roles: [ProjectCoordinator]
    code: 200
    input: [inspection_slot_start, inspection_slot_end]
    output: Project
    side_effects:
      - "permit_status ISSUED|INSPECTION_FAILED -> INSPECTION_SCHEDULED"
      - "records inspection_slot_start and inspection_slot_end (a CLOSED, inclusive interval for the capacity test)"
      - "increments Project.version by 1"

  - method: POST
    path: "/projects/{id}/inspection-result"
    description: "Record the jurisdiction inspector's outcome. A PASSED result also closes the permit dimension in the same handler."
    roles: [ProgramAdmin, ProjectCoordinator]
    code: 200
    input: [result, "inspector_note?"]
    output: Project
    side_effects:
      - "PASSED: permit_status INSPECTION_SCHEDULED -> INSPECTION_PASSED -> CLOSED in one handler, inspection_result = PASSED"
      - "FAILED: permit_status INSPECTION_SCHEDULED -> INSPECTION_FAILED, inspection_result = FAILED"
      - "increments inspection_attempt_count by 1 and clears inspection_slot_start / inspection_slot_end to null so the slot is released"
      - "increments Project.version by 1"

  - method: GET
    path: "/projects/{id}/scorecard-events"
    description: "List every scorecard event that arose from one project, in occurred_at ASC then created_at ASC order (FK reverse-reachability for ScorecardEvent.project_id)."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: ScorecardEvent[]
    side_effects: []

  # ------------------------------------------------------------- measurements ---
  - method: POST
    path: "/projects/{id}/measurements"
    description: "Book the in-home measurement appointment."
    roles: [ProjectCoordinator]
    code: 201
    input: [scheduled_at, technician_name]
    output: Measurement
    side_effects:
      - "status = SCHEDULED"
      - "requires Project.fulfillment_status == MEASURE_PENDING"

  - method: GET
    path: "/projects/{id}/measurements"
    description: "List a project's measurement appointments (FK reverse-reachability for Measurement.project_id)."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Installer, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Measurement[]
    side_effects: []

  - method: GET
    path: "/measurements"
    description: "List measurement appointments across projects."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: Measurement[]
    side_effects: []

  - method: GET
    path: "/measurements/{id}"
    description: "Fetch one measurement with its captured site detail and computed variance."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Installer, Customer]
    code: 200
    input: []
    output: Measurement
    side_effects: []

  - method: POST
    path: "/measurements/{id}/complete"
    description: "Capture the on-site detail. This is the hinge of the whole workflow: it rewrites effective_units, re-runs the permit determination, and may auto-open a MEASUREMENT_VARIANCE change order."
    roles: [ProjectCoordinator]
    code: 200
    input: [measured_units, subfloor_condition, obstruction_count, stair_flight_count, "access_notes?"]
    output: Measurement
    side_effects:
      - "status SCHEDULED -> COMPLETED, completed_at = clock_now"
      - "computes variance_pct = round_half_up(abs(measured_units - Project.estimated_units) / Project.estimated_units * 100, 2)"
      - "sets change_order_triggered = (variance_pct >= 10.00)"
      - "sets Project.effective_units = measured_units"
      - "re-runs permit_responsibility_determination, so permit_status may flip NOT_REQUIRED <-> PENDING_APPLICATION in either direction"
      - "when change_order_triggered is false: Project.fulfillment_status MEASURE_PENDING -> MEASURED"
      - "when change_order_triggered is true: auto-creates a ChangeOrder with origin MEASUREMENT_VARIANCE, source_measurement_id = this measurement, empty lines, status PENDING_CUSTOMER and upcharge_cents from the VARIANCE_DISCLOSURE variant, then drives Project.fulfillment_status MEASURE_PENDING -> CHANGE_PENDING"
      - "increments Project.version by 1"
    note: "The auto-created change order appears in no response body; it is found through GET /projects/{id}/change-orders or GET /change-orders?source_measurement_id=..."

  # ------------------------------------------------------------ change orders ---
  - method: POST
    path: "/change-orders"
    description: "Raise a line-itemised change order against a project, optionally superseding an undecided one. Guarded by OCC on Project.version (§1.2.1 change-order-create-stale-project)."
    roles: [ProjectCoordinator]
    code: 201
    input: [project_id, origin, lines, expected_project_version, "supersedes_change_order_id?"]
    output: ChangeOrder
    side_effects:
      - "status = DRAFT, upcharge_cents from change_order_upcharge variant LINE_ITEMIZED, net_primary_units_delta computed"
      - "drives any supersedes_change_order_id target DRAFT|PENDING_CUSTOMER|REVISION_REQUESTED -> SUPERSEDED"
      - "rejects origin == MEASUREMENT_VARIANCE from a client with ERR_CHANGE_ORDER_SHAPE (only the measurement cascade may create that origin)"
      - "increments Project.version by 1"

  - method: GET
    path: "/projects/{id}/change-orders"
    description: "List a project's change orders in created_at ASC order (FK reverse-reachability for ChangeOrder.project_id)."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Customer]
    code: 200
    input: ["status?", "origin?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []

  - method: GET
    path: "/change-orders"
    description: "List change orders across projects (FK reverse-reachability for ChangeOrder.source_measurement_id and ChangeOrder.supersedes_change_order_id)."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Customer]
    code: 200
    input: ["project_id?", "source_measurement_id?", "supersedes_change_order_id?", "status?", "origin?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []

  - method: GET
    path: "/change-orders/{id}"
    description: "Fetch one change order with its priced lines and revision history counters."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Customer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  - method: POST
    path: "/change-orders/{id}/submit"
    description: "Send a change order to the customer, or resubmit it with replacement lines after a revision request. Re-prices the lines every time."
    roles: [ProjectCoordinator]
    code: 200
    input: ["lines?"]
    output: ChangeOrder
    side_effects:
      - "status DRAFT|REVISION_REQUESTED -> PENDING_CUSTOMER"
      - "when lines is supplied, replaces the array and re-runs change_order_upcharge variant LINE_ITEMIZED with per-line rounding"
      - "from REVISION_REQUESTED, lines is REQUIRED and revision_count increments by 1"
      - "drives Project.fulfillment_status MEASURED -> CHANGE_PENDING"
      - "increments ChangeOrder.version and Project.version by 1"

  - method: POST
    path: "/change-orders/{id}/decide"
    description: "Record the customer's decision. Accepting a line-itemised change order books its upcharge; declining a MEASUREMENT_VARIANCE change order cancels the project."
    roles: [Customer]
    code: 200
    input: [decision, "revision_note?"]
    output: ChangeOrder
    side_effects:
      - "ACCEPT: status -> ACCEPTED, decided_at = clock_now; for CUSTOMER_REQUEST and SITE_CONDITION the upcharge lands in Project.change_order_upcharge_cents and project_total_due is recomputed; for MEASUREMENT_VARIANCE no money moves"
      - "DECLINE on CUSTOMER_REQUEST or SITE_CONDITION: status -> DECLINED, Project.fulfillment_status CHANGE_PENDING -> MEASURED, no money moves"
      - "DECLINE on MEASUREMENT_VARIANCE: status -> DECLINED, then the full project-cancellation cascade runs (settlement, measurement VOIDED, delivery RETURNED, assignment RELEASED)"
      - "REQUEST_REVISION: status -> REVISION_REQUESTED with revision_note; rejected with ERR_INVALID_STATE on a MEASUREMENT_VARIANCE change order"
      - "increments ChangeOrder.version and Project.version by 1"

  # -------------------------------------------------------- material delivery ---
  - method: POST
    path: "/projects/{id}/material-deliveries"
    description: "Plan the material delivery that must land before the installer starts."
    roles: [ProjectCoordinator]
    code: 201
    input: [promised_window_start, promised_window_end, sku_count, material_cost_cents]
    output: MaterialDelivery
    side_effects:
      - "status = PLANNED, delay_days = 0"

  - method: GET
    path: "/projects/{id}/material-deliveries"
    description: "List a project's material deliveries (FK reverse-reachability for MaterialDelivery.project_id)."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Installer, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MaterialDelivery[]
    side_effects: []

  - method: GET
    path: "/material-deliveries"
    description: "List material deliveries across projects."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: MaterialDelivery[]
    side_effects: []

  - method: GET
    path: "/material-deliveries/{id}"
    description: "Fetch one material delivery with its computed delay_days."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Installer, Customer]
    code: 200
    input: []
    output: MaterialDelivery
    side_effects: []

  - method: POST
    path: "/material-deliveries/{id}/status"
    description: "Advance the delivery through the transit cycle. DELIVERED requires the actual arrival instant and computes delay_days."
    roles: [ProjectCoordinator]
    code: 200
    input: [new_status, "actual_delivered_at?"]
    output: MaterialDelivery
    side_effects:
      - "PLANNED|DELAYED -> IN_TRANSIT, PLANNED|IN_TRANSIT -> DELAYED, DELAYED -> IN_TRANSIT (the cycle may repeat without limit)"
      - "IN_TRANSIT|DELAYED -> DELIVERED requires actual_delivered_at and computes delay_days from delivery_sync_slack"
      - "increments MaterialDelivery.version by 1"

  # ---------------------------------------------------- installer assignments ---
  - method: POST
    path: "/installer-assignments"
    description: "Hold an install window for one installer on one project. This is the compliance gate of the whole system: licensing, background check, insurance, measurement freshness, calendar overlap, capacity and deposit are all checked here, in the §1.4 priority order. Guarded by OCC on Project.version (§1.2.1 assignment-create-stale-project)."
    roles: [ProjectCoordinator]
    code: 201
    input: [project_id, installer_id, window_start, window_end, expected_project_version]
    output: InstallerAssignment
    side_effects:
      - "status = HELD, duration_minutes = floor((window_end - window_start) / 60 s)"
      - "increases Installer.committed_minutes by duration_minutes"
      - "Project.fulfillment_status MEASURED -> SCHEDULED"
      - "increments Project.version and Installer.version by 1"

  - method: GET
    path: "/installer-assignments"
    description: "List install assignments (FK reverse-reachability for InstallerAssignment.project_id and InstallerAssignment.installer_id)."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager, Installer, Customer]
    code: 200
    input: ["project_id?", "installer_id?", "status?", "limit?", "offset?"]
    output: InstallerAssignment[]
    side_effects: []

  - method: GET
    path: "/installer-assignments/{id}"
    description: "Fetch one install assignment."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager, Installer, Customer]
    code: 200
    input: []
    output: InstallerAssignment
    side_effects: []

  - method: POST
    path: "/installer-assignments/{id}/confirm"
    description: "Confirm the held window once the material delivery gives at least MIN_DELIVERY_SLACK_HOURS of slack before window_start."
    roles: [ProjectCoordinator]
    code: 200
    input: []
    output: InstallerAssignment
    side_effects:
      - "status HELD -> CONFIRMED"
      - "evaluates delivery_sync_slack.delivery_slack_hours on the floored integer hour"
      - "increments InstallerAssignment.version by 1"

  - method: POST
    path: "/installer-assignments/{id}/start"
    description: "Installer begins work on site. Blocked while the permit dimension is unfinished."
    roles: [Installer]
    code: 200
    input: []
    output: InstallerAssignment
    side_effects:
      - "status CONFIRMED -> IN_PROGRESS, started_at = clock_now"
      - "Project.fulfillment_status SCHEDULED -> IN_PROGRESS"
      - "requires Project.permit_status IN {NOT_REQUIRED, ISSUED, INSPECTION_SCHEDULED, INSPECTION_PASSED, CLOSED}"
      - "increments InstallerAssignment.version and Project.version by 1"

  - method: POST
    path: "/installer-assignments/{id}/complete"
    description: "Installer finishes work. This single call runs the FINAL labor variant, the deposit waterfall, the timeliness scorecard event and the project's fulfillment and financial transitions."
    roles: [Installer]
    code: 200
    input: [completed_at]
    output: InstallerAssignment
    side_effects:
      - "status IN_PROGRESS -> COMPLETED, completed_at recorded"
      - "computes on_time = (completed_at <= window_end) OR (the project's MaterialDelivery.delay_days >= 1)"
      - "runs project_labor_charge variant FINAL and writes Project.final_labor_cents"
      - "runs project_total_due: total_due_cents, the deposit waterfall into deposit_applied_cents, and balance_due_cents"
      - "Project.fulfillment_status IN_PROGRESS -> INSTALL_COMPLETE, install_completed_at = clock_now"
      - "Project.financial_status DEPOSIT_HELD -> BALANCE_DUE when balance_due_cents > 0, or DEPOSIT_HELD -> SETTLED when it is 0"
      - "appends a SYSTEM ScorecardEvent with event_type ON_TIME_COMPLETION when on_time is true and LATE_COMPLETION when it is false, occurred_at = clock_now, then recomputes installer_scorecard"
      - "recomputes Installer.completed_project_count"
      - "increments InstallerAssignment.version, Project.version and Installer.version by 1"

  - method: POST
    path: "/installer-assignments/{id}/release"
    description: "Give back a held or confirmed window. A ServiceManager may release it as a NO_SHOW after the window has closed, which additionally files a scorecard event."
    roles: [ProjectCoordinator, ServiceManager]
    code: 200
    input: [release_reason]
    output: InstallerAssignment
    side_effects:
      - "status HELD|CONFIRMED -> RELEASED, or CONFIRMED -> NO_SHOW when release_reason == 'NO_SHOW' and the acting role is ServiceManager and clock_now > window_end"
      - "reduces Installer.committed_minutes by duration_minutes, restoring the capacity-conservation invariant exactly"
      - "Project.fulfillment_status SCHEDULED -> MEASURED"
      - "on NO_SHOW only: appends a SYSTEM ScorecardEvent with event_type NO_SHOW, occurred_at = clock_now, then recomputes installer_scorecard"
      - "increments InstallerAssignment.version, Project.version and Installer.version by 1"

  # ----------------------------------------------------- punch list & warranty ---
  - method: GET
    path: "/projects/{id}/punch-list-items"
    description: "List a project's punch list in created_at ASC order — the only discovery channel for the items the quality inspection created (FK reverse-reachability for PunchListItem.project_id)."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Installer, Customer]
    code: 200
    input: ["status?", "severity?", "limit?", "offset?"]
    output: PunchListItem[]
    side_effects: []

  - method: GET
    path: "/punch-list-items"
    description: "List punch items across projects."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Installer]
    code: 200
    input: ["project_id?", "status?", "severity?", "limit?", "offset?"]
    output: PunchListItem[]
    side_effects: []

  - method: GET
    path: "/punch-list-items/{id}"
    description: "Fetch one punch item."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Installer, Customer]
    code: 200
    input: []
    output: PunchListItem
    side_effects: []

  - method: POST
    path: "/punch-list-items/{id}/resolve"
    description: "Installer reports the defect fixed. A SAFETY item may only be resolved once it has been escalated to a service manager."
    roles: [Installer]
    code: 200
    input: [resolution_note]
    output: PunchListItem
    side_effects:
      - "status OPEN|ESCALATED -> RESOLVED, resolved_at = clock_now"
      - "from ESCALATED, decrements Project.escalated_punch_count by 1"
      - "requires status == ESCALATED when severity == SAFETY"
      - "increments PunchListItem.version and, when the project counter changed, Project.version by 1"

  - method: POST
    path: "/punch-list-items/{id}/verify"
    description: "Sign off a resolved defect. SAFETY items may only be signed off by a ServiceManager."
    roles: [ProjectCoordinator, ServiceManager]
    code: 200
    input: []
    output: PunchListItem
    side_effects:
      - "status RESOLVED -> VERIFIED, verified_at = clock_now"
      - "requires the acting role to be ServiceManager when severity == SAFETY"
      - "increments PunchListItem.version by 1"

  - method: POST
    path: "/punch-list-items/{id}/escalate"
    description: "Escalate a defect to a service manager. Drives the five-hop cascade from the punch item all the way to the installer's network status."
    roles: [ProjectCoordinator]
    code: 200
    input: [escalation_reason]
    output: PunchListItem
    side_effects:
      - "hop 1: status OPEN|RESOLVED -> ESCALATED, escalated_at = clock_now, escalated_to_user_id = the acting X-User-ID"
      - "hop 2: Project.escalated_punch_count += 1, and Project.service_manager_review_required = true when severity == SAFETY"
      - "hop 3 (SAFETY only): appends a SYSTEM ScorecardEvent with event_type PUNCH_SAFETY for the project's COMPLETED assignment's installer, occurred_at = clock_now"
      - "hop 4: recomputes installer_scorecard, rewriting all five score fields and removal_eligible"
      - "hop 5: may drive Installer ACTIVE -> PROBATION with probation_started_at = clock_now"
      - "increments PunchListItem.version, Project.version and Installer.version by 1"

  - method: POST
    path: "/warranty-claims"
    description: "Customer files a labour-warranty claim on a closed project, inside the 365-day labour warranty period."
    roles: [Customer]
    code: 201
    input: [project_id, claim_type, description]
    output: WarrantyClaim
    side_effects:
      - "status = SUBMITTED, submitted_at = clock_now, escalation_level = 0"
      - "requires Project.fulfillment_status == CLOSED, claim_type == LABOR_DEFECT and clock_now <= Project.closed_at + 365 days"

  - method: GET
    path: "/warranty-claims"
    description: "List warranty claims (FK reverse-reachability for WarrantyClaim.project_id)."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Customer]
    code: 200
    input: ["project_id?", "status?", "claim_type?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: GET
    path: "/warranty-claims/{id}"
    description: "Fetch one warranty claim with its escalation level."
    roles: [ProgramAdmin, ProjectCoordinator, ServiceManager, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/warranty-claims/{id}/triage"
    description: "Service manager upholds, denies or escalates a labour-warranty claim. Upholding files a WARRANTY_UPHELD scorecard event against the installer."
    roles: [ServiceManager]
    code: 200
    input: [decision, "decision_note?", "denial_reason?"]
    output: WarrantyClaim
    side_effects:
      - "UPHOLD: status SUBMITTED|ESCALATED -> UPHELD, triaged_at = clock_now; appends a SYSTEM ScorecardEvent WARRANTY_UPHELD and recomputes installer_scorecard, which may drive Installer ACTIVE -> PROBATION"
      - "DENY: status SUBMITTED|ESCALATED -> DENIED with denial_reason required; appends no scorecard event"
      - "ESCALATE: status SUBMITTED -> ESCALATED, escalation_level += 1, escalated_to_user_id = the acting X-User-ID"
      - "increments WarrantyClaim.version by 1"

  # ------------------------------------------------------------- logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint (§1.5 priority-ladder step 3). Sets the server's logical clock to an explicit instant. THE SERVER'S STARTUP DEFAULT IS EXACTLY 2026-08-01T00:00:00.000Z: before any call to this endpoint the logical clock reads that instant and MUST NOT fall back to real wall-clock time. Every deadline, expiry, rolling window and decay band in this scaffold is measured against the logical clock only."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager, Installer, Customer]
    code: 200
    input: [current_utc]
    output:
      current_utc: string
      credentials_expired_count: integer
      installers_suspended_count: integer
      installers_rescored_count: integer
    side_effects:
      - "sets the logical clock to current_utc"
      - "epoch-advance sweep, in ascending InstallerCredential.created_at order: every credential with verification_status == VERIFIED whose license_expires_on <= the new clock value becomes EXPIRED"
      - "each expiry recomputes Installer.verified_credential_count and, when it reaches 0, drives Installer ACTIVE|PROBATION -> SUSPENDED with the assignment-release cascade"
      - "recomputes installer_scorecard (both variants) for every installer, because the rolling window and the decay bands moved"

  - method: GET
    path: "/_clock"
    description: "Read the current logical clock value. Returns 2026-08-01T00:00:00.000Z on a freshly started server."
    roles: [ProgramAdmin, NetworkManager, ProjectCoordinator, ServiceManager, Installer, Customer]
    code: 200
    input: []
    output:
      current_utc: string
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication and authorization ---
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-ID or X-User-Role is absent or empty on any request"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "X-User-Role is not a declared role, or is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed role acts on a resource it does not own: a Customer deciding a change order on another customer's project, an Installer starting or completing another installer's assignment, an Installer resolving a punch item on a project it did not install, a Customer paying another customer's deposit or balance"
  - id: ERR_WRONG_PERMIT_PARTY
    http: 403
    condition: "POST /projects/{id}/permit/apply is called by a role that does not match Project.permit_responsibility (RETAILER expects ProjectCoordinator or ProgramAdmin, INSTALLER expects Installer, CUSTOMER expects Customer)"

  # --- request shape ---
  - id: ERR_MISSING_REQUIRED_FIELD
    http: 422
    condition: "A required field of the endpoint's input is absent or null, including a missing expected_project_version / expected_installer_version on an OCC-guarded write, a missing lines array on a resubmit from REVISION_REQUESTED, a missing actual_delivered_at on a DELIVERED status change, and a missing denial_reason on a DENY triage"
  - id: ERR_INVALID_FIELD_TYPE
    http: 422
    condition: "A field has the wrong JSON type, an enum value outside its declared set, a money value sent as a string or a float, an instant that is not ISO 8601 UTC with three fractional digits, a csat_score supplied on a non-CSAT_SURVEY event, or a csat_score omitted on a CSAT_SURVEY event"
  - id: ERR_FIELD_OUT_OF_RANGE
    http: 422
    condition: "A numeric or string value violates its §1.1 constraint: units <= 0 or with more than two decimals, negative cents, csat_score outside 1..5, workmanship_score outside 0..100, pagination limit outside 1..100, negative offset, window_end not strictly after window_start, promised_window_end not strictly after promised_window_start, an over-long string"

  # --- existence ---
  - id: ERR_SERVICE_CATEGORY_NOT_FOUND
    http: 404
    condition: "A service_category_id in a path or body matches no stored ServiceCategory"
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "A jurisdiction_id in a path or body matches no stored Jurisdiction"
  - id: ERR_INSTALLER_NOT_FOUND
    http: 404
    condition: "An installer_id in a path or body matches no stored Installer"
  - id: ERR_INSTALLER_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "An installer-credential id in a path matches no stored InstallerCredential"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "A customer_id in a path or body matches no stored Customer"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "A project_id in a path or body matches no stored Project"
  - id: ERR_MEASUREMENT_NOT_FOUND
    http: 404
    condition: "A measurement id in a path matches no stored Measurement"
  - id: ERR_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "A change-order id in a path, or a supersedes_change_order_id in a body, matches no stored ChangeOrder"
  - id: ERR_MATERIAL_DELIVERY_NOT_FOUND
    http: 404
    condition: "A material-delivery id in a path matches no stored MaterialDelivery"
  - id: ERR_INSTALLER_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "An installer-assignment id in a path matches no stored InstallerAssignment"
  - id: ERR_PUNCH_LIST_ITEM_NOT_FOUND
    http: 404
    condition: "A punch-list-item id in a path matches no stored PunchListItem"
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "A warranty-claim id in a path matches no stored WarrantyClaim"

  # --- uniqueness and optimistic concurrency ---
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A ServiceCategory.code or Jurisdiction.code already exists, or a live InstallerCredential already exists for the same (installer_id, jurisdiction_id, trade_code)"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the target Project's current version on POST /installer-assignments, POST /change-orders or POST /projects/{id}/reinstate (§1.2.1)"
  - id: ERR_STALE_INSTALLER_VERSION
    http: 412
    condition: "expected_installer_version does not equal the target Installer's current version on POST /installers/{id}/remove (§1.2.1)"

  # --- state ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity's current status has no transition for the requested trigger: verifying a REJECTED credential, activating a non-VERIFIED installer, completing an already-COMPLETED measurement, requesting a revision on a MEASUREMENT_VARIANCE change order, applying for a permit on a NOT_REQUIRED project, applying twice without resubmit, recording an inspection result with no slot reserved, confirming an assignment that is not HELD"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target entity is in a terminal state for its machine: Project CLOSED, ChangeOrder ACCEPTED / DECLINED / SUPERSEDED, PunchListItem VERIFIED, WarrantyClaim UPHELD / DENIED, Installer REMOVED, Measurement COMPLETED / VOIDED, MaterialDelivery RETURNED, Project.permit_status CLOSED"
  - id: ERR_PROJECT_CANCELLED
    http: 409
    condition: "A child of a CANCELLED project is written: booking a measurement, raising a change order, creating an assignment, planning a delivery, or recording a quality inspection"
  - id: ERR_REFERENCE_NOT_ELIGIBLE
    http: 409
    condition: "A referenced row exists but is not eligible: a RETIRED ServiceCategory or SUSPENDED Jurisdiction at project creation, a SUSPENDED Jurisdiction at assignment creation, or a project that already holds a live assignment"

  # --- safety, licensing and compliance ---
  - id: ERR_INSTALLER_NOT_ASSIGNABLE
    http: 409
    condition: "The installer's network status is not ACTIVE or PROBATION at POST /installer-assignments (APPLIED, DOCS_PENDING, VERIFIED, SUSPENDED or REMOVED)"
  - id: ERR_INSTALLER_NOT_LICENSED
    http: 409
    condition: "Jurisdiction.license_required is true and the installer holds no VERIFIED InstallerCredential for the project's jurisdiction and the category's trade_code — including the case where the credential was VERIFIED but became EXPIRED on a clock advance"
  - id: ERR_BACKGROUND_CHECK_STALE
    http: 409
    condition: "Installer.background_check_result is not PASS, or background_check_completed_at is older than Jurisdiction.background_check_recency_days whole days from the logical clock"
  - id: ERR_INSURANCE_INSUFFICIENT
    http: 409
    condition: "Installer.insurance_expires_on is not strictly after the logical clock, or liability_coverage_cents is below Jurisdiction.min_liability_coverage_cents"
  - id: ERR_MEASUREMENT_STALE
    http: 409
    condition: "The category requires a measurement and the project has no COMPLETED Measurement, or the assignment's window_start is later than that measurement's completed_at plus ServiceCategory.measurement_validity_days whole days"
  - id: ERR_PUNCH_LIST_NOT_CLEARED
    http: 409
    condition: "A SAFETY punch item is resolved before it has been escalated, a SAFETY punch item is verified by a role other than ServiceManager, or a project is closed while any punch item is still OPEN, RESOLVED or ESCALATED"
  - id: ERR_INSPECTION_NOT_PASSED
    http: 409
    condition: "A project whose jurisdiction requires inspection and whose permit_responsibility is not NOT_REQUIRED is closed before permit_status reaches CLOSED"

  # --- temporal, capacity and constraint satisfaction ---
  - id: ERR_INSTALLER_WINDOW_CONFLICT
    http: 409
    condition: "The requested install window intersects a live window of the same installer once TRAVEL_BUFFER_MINUTES (90) is added to each window's end"
  - id: ERR_INSTALLER_CAPACITY_EXCEEDED
    http: 409
    condition: "Installer.committed_minutes plus the new assignment's duration_minutes would exceed MAX_COMMITTED_MINUTES (4800)"
  - id: ERR_DELIVERY_SLACK_INSUFFICIENT
    http: 409
    condition: "The project has no MaterialDelivery in PLANNED, IN_TRANSIT or DELIVERED, or the floored delivery_slack_hours between promised_window_end and window_start is below MIN_DELIVERY_SLACK_HOURS (24)"
  - id: ERR_INSPECTION_LEAD_TIME
    http: 422
    condition: "The requested inspection_slot_start is fewer than Jurisdiction.inspection_lead_days whole days after the logical clock, or inspection_slot_end is not strictly after inspection_slot_start"
  - id: ERR_INSPECTION_CAPACITY_FULL
    http: 409
    condition: "The number of other projects in the jurisdiction holding an INSPECTION_SCHEDULED slot that intersects the requested closed interval has reached Jurisdiction.max_concurrent_inspections"
  - id: ERR_CHANGE_ORDER_SHAPE
    http: 422
    condition: "lines is non-empty on a MEASUREMENT_VARIANCE change order, lines is empty on a CUSTOMER_REQUEST or SITE_CONDITION change order, a client supplies origin == MEASUREMENT_VARIANCE or source_measurement_id, or supersedes_change_order_id points at a change order on a different project or in a decided state"
  - id: ERR_WARRANTY_EXPIRED
    http: 409
    condition: "A warranty claim is filed with claim_type MATERIAL_DEFECT, on a project that is not CLOSED, or more than WARRANTY_LABOR_DAYS (365) whole days after Project.closed_at"
  - id: ERR_REINSTATE_WINDOW_CLOSED
    http: 409
    condition: "POST /projects/{id}/reinstate is called REINSTATE_WINDOW_HOURS (72) hours or more after Project.cancelled_at"
  - id: ERR_REMOVAL_NOT_ELIGIBLE
    http: 409
    condition: "Installer.removal_eligible is false, the installer is not in ACTIVE / PROBATION / SUSPENDED, or the installer still holds a HELD, CONFIRMED or IN_PROGRESS assignment"

  # --- fiscal, evaluated last ---
  - id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http: 422
    condition: "A deposit payment's amount_cents does not equal Project.deposit_required_cents exactly (both under- and over-payment)"
  - id: ERR_DEPOSIT_NOT_HELD
    http: 409
    condition: "POST /installer-assignments is called while Project.financial_status is QUOTED, PARTIALLY_REFUNDED, REFUNDED or FORFEITED"
  - id: ERR_BALANCE_AMOUNT_MISMATCH
    http: 422
    condition: "A balance payment's amount_cents does not equal Project.balance_due_cents exactly, or balance_due_cents is already 0"
  - id: ERR_CREDIT_EXCEEDS_CAP
    http: 422
    condition: "A change order's computed upcharge_cents is below the credit floor -round_half_up(Project.quoted_labor_cents * CREDIT_CAP_PCT)"
  - id: ERR_NOT_CANCELLABLE
    http: 409
    condition: "A project is cancelled from INSTALL_COMPLETE, PUNCH_OPEN, CLOSED or CANCELLED, or a project is closed while financial_status is not SETTLED"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
# role_model: peer_roles. ServiceManager is NOT a superset of the other operator
# roles — it cannot sell a project, book a measurement, price a change order or
# verify a licence. ProgramAdmin owns configuration and cannot install, inspect
# quality or triage warranty.
roles:

  - name: ProgramAdmin
    description: "Owns the programme configuration: the service catalogue and the jurisdiction policy table. Also the retailer-side escalation path for permits and jurisdiction inspections."
    identity: opaque
    exclusive_operations:
      - "POST /service-categories"
      - "PATCH /service-categories/{id}"
      - "POST /jurisdictions"
      - "PATCH /jurisdictions/{id}"
    shared_operations:
      - "POST /customers (with ProjectCoordinator)"
      - "POST /projects (with ProjectCoordinator)"
      - "POST /projects/{id}/permit/apply (with ProjectCoordinator, Installer, Customer — gated by Project.permit_responsibility)"
      - "POST /projects/{id}/permit/issue (with ProjectCoordinator)"
      - "POST /projects/{id}/inspection-result (with ProjectCoordinator)"
      - "POST /projects/{id}/cancel (with ProjectCoordinator, ServiceManager, Customer)"
      - "POST /projects/{id}/reinstate (with ProjectCoordinator)"
      - "every GET"

  - name: NetworkManager
    description: "Owns installer-network recruitment and verification: files licences, records verification decisions and background checks, and admits verified firms to the assignable network."
    identity: opaque
    exclusive_operations:
      - "POST /installers"
      - "PATCH /installers/{id}"
      - "POST /installers/{id}/credentials"
      - "POST /installer-credentials/{id}/verify"
      - "POST /installers/{id}/background-check"
      - "POST /installers/{id}/activate"
    shared_operations:
      - "GET /installers, GET /installers/{id}, GET /installers/{id}/credentials, GET /installer-credentials, GET /installers/{id}/scorecard-events, GET /installers/{id}/scorecard"
      - "GET /projects, GET /installer-assignments"

  - name: ProjectCoordinator
    description: "Owns project execution: sells the project, books and completes measurements, prices change orders, plans deliveries, holds and releases installer windows, reserves inspection slots, inspects quality and closes the project."
    identity: opaque
    exclusive_operations:
      - "POST /projects/{id}/measurements"
      - "POST /measurements/{id}/complete"
      - "POST /change-orders"
      - "POST /change-orders/{id}/submit"
      - "POST /projects/{id}/material-deliveries"
      - "POST /material-deliveries/{id}/status"
      - "POST /installer-assignments"
      - "POST /installer-assignments/{id}/confirm"
      - "POST /projects/{id}/inspection-slot"
      - "POST /projects/{id}/quality-inspection"
      - "POST /projects/{id}/close"
      - "POST /punch-list-items/{id}/escalate"
    shared_operations:
      - "POST /customers (with ProgramAdmin)"
      - "POST /projects (with ProgramAdmin)"
      - "POST /projects/{id}/permit/apply (gated by Project.permit_responsibility == RETAILER)"
      - "POST /projects/{id}/permit/issue (with ProgramAdmin)"
      - "POST /projects/{id}/inspection-result (with ProgramAdmin)"
      - "POST /projects/{id}/cancel, POST /projects/{id}/reinstate"
      - "POST /installer-assignments/{id}/release (with ServiceManager)"
      - "POST /punch-list-items/{id}/verify (with ServiceManager, but never for a SAFETY item)"
      - "POST /installers/{id}/scorecard-events (with ServiceManager)"
      - "every GET"

  - name: ServiceManager
    description: "Owns escalation: receives escalated punch items, triages labour-warranty claims, releases no-shows, files scorecard events and removes installers from the network."
    identity: opaque
    exclusive_operations:
      - "POST /warranty-claims/{id}/triage"
      - "POST /installers/{id}/remove"
    shared_operations:
      - "POST /punch-list-items/{id}/verify (the ONLY role permitted to verify a SAFETY item)"
      - "POST /installer-assignments/{id}/release (with ProjectCoordinator; the only role that may release as NO_SHOW)"
      - "POST /installers/{id}/scorecard-events (with ProjectCoordinator)"
      - "POST /projects/{id}/cancel (which matches waiver tier T1 RETAILER_FAULT)"
      - "every GET except GET /customers is shared; GET /service-categories and GET /jurisdictions are open to all roles"

  - name: Installer
    description: "The installer firm acting on its own assignments. X-User-ID is the Installer row's id."
    identity: "entity_backed:Installer"
    exclusive_operations:
      - "POST /installer-assignments/{id}/start"
      - "POST /installer-assignments/{id}/complete"
      - "POST /punch-list-items/{id}/resolve"
    shared_operations:
      - "POST /projects/{id}/permit/apply (only when Project.permit_responsibility == INSTALLER)"
      - "GET /installers/{id}, GET /installers/{id}/credentials, GET /installers/{id}/scorecard, GET /installer-assignments, GET /projects/{id}, GET /projects/{id}/measurements, GET /projects/{id}/material-deliveries, GET /projects/{id}/punch-list-items"
    ownership_rule: |
      X-User-ID MUST equal InstallerAssignment.installer_id for start, complete
      and release-visibility, and MUST equal the installer_id of the project's
      COMPLETED assignment for punch-item resolution. A mismatch is
      ERR_NOT_RESOURCE_OWNER (403), never ERR_UNAUTHORIZED_ROLE.

  - name: Customer
    description: "The purchasing customer acting on their own project. X-User-ID is the Customer row's id."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /projects/{id}/deposit"
      - "POST /projects/{id}/pay-balance"
      - "POST /change-orders/{id}/decide"
      - "POST /warranty-claims"
    shared_operations:
      - "POST /projects/{id}/cancel (with ProgramAdmin, ProjectCoordinator, ServiceManager — but a Customer cancellation does NOT match waiver tier T1)"
      - "POST /projects/{id}/permit/apply (only when Project.permit_responsibility == CUSTOMER)"
      - "GET /projects, GET /projects/{id}, GET /projects/{id}/settlement-preview, GET /projects/{id}/measurements, GET /projects/{id}/change-orders, GET /change-orders/{id}, GET /projects/{id}/punch-list-items, GET /warranty-claims, GET /customers/{id}"
    ownership_rule: |
      X-User-ID MUST equal Project.customer_id for every project-scoped write and
      for the change-order decision. A mismatch is ERR_NOT_RESOURCE_OWNER (403).
