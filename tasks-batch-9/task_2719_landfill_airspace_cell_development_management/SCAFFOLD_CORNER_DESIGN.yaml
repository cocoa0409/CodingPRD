# =============================================================================
# §1.9 Scaffold Corner Design — Breadth Coverage Index
#
# Walk of references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Every instance grounds in SCAFFOLD.yaml only; `excluded_because:` stubs cite a
# §1.8 instance by name in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
#
# Shared fixture literals (identical to §1.8 so fixtures can be shared):
#   Landfill LF   : permit_number MSW-4417, permitted_total_airspace_cy 5000000,
#                   design_footprint_sf 400000, planned_density_tons_per_cy 0.90,
#                   annual_tonnage_forecast 300000
#   Cell  C-1     : design_airspace_cy 1000000, design_area_sf 120001, DOUBLE_COMPOSITE
#   Cell  C-2     : design_airspace_cy 200,     design_area_sf  45001, DOUBLE_COMPOSITE
#   QA package    : 4000 ft seam / 20 tests / 20 passing / 40 panels / 2 defects -> 100.00
#   Estimate      : 1.855 per sf, 95000.00 per year, 0.03 inflation, 30 years
#                   -> post_closure_cost_total 4519664.50
#   HostCommunity : 42.50 posted, 3.75 host fee, tier1 100 t, 0.04 / 0.07 royalty
#   Unknown id    : 00000000-0000-4000-8000-000000000000 (never minted by the server)
#   Logical clock : startup default 2026-08-01T00:00:00Z
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: landfill_creation_returns_the_full_row_inside_the_success_envelope
        claim_type: creation
        grounds:
          - endpoints[POST /landfills]
          - entities.Landfill.fields.operating_status
          - entities.Landfill.fields.financial_assurance_status
          - entities.Landfill.fields.certified_airspace_cy
        distinguishing_aspect: "A freshly registered Landfill must come back with every declared field, the four common fields, and each system/computed field at its declared start value — not omitted and not null."
        test_recipe:
          setup:
            - "Empty database; logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000, daily_load_limit: 250 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id, lf_v: $.data.version }
          assert:
            - "HTTP 201 with response_type 'object' and a meta block carrying api_request_id and api_request_timestamp"
            - "data.name == 'Ridgeview MSW', data.permit_number == 'MSW-4417', data.permitted_total_airspace_cy == 5000000, data.design_footprint_sf == 400000, data.planned_density_tons_per_cy == 0.90, data.annual_tonnage_forecast == 300000, data.daily_load_limit == 250"
            - "${lf_v} == 1, ${lf_id} is a UUID with no type prefix, and created_at == updated_at on creation"
            - "data.operating_status == 'OPEN', data.gas_collection_status == 'COMPLIANT', data.financial_assurance_status == 'UNFUNDED'"
            - "data.certified_airspace_cy == 0, data.consumed_airspace_cy == 0, data.remaining_airspace_cy == 0, data.remaining_life_years == 0, data.active_cell_count == 0, data.assurance_funded_amount == 0"

      - name: landfill_get_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /landfills/{landfill_id}]
        distinguishing_aspect: "Reading a landfill is side-effect free: the same field values come back and version is not bumped by a GET."
        test_recipe:
          setup:
            - "One Landfill LF registered with the shared fixture literals."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
          trigger:
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { got_id: $.data.id, got_v: $.data.version, got_permit: $.data.permit_number }
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { got_v2: $.data.version }
          assert:
            - "HTTP 200, ${got_id} == '${lf_id}' and ${got_permit} == 'MSW-4417'"
            - "${got_v} == 1 and ${got_v2} == 1 — two reads do not mutate the row"

      - name: cells_list_combines_filter_paging_and_totals
        claim_type: listing
        grounds:
          - endpoints[GET /cells]
          - endpoints[GET /landfills/{landfill_id}/cells]
        distinguishing_aspect: "total_count reports the size of the FILTERED set, not the page or the whole table, and has_more is driven by limit+offset against that filtered total; the status filter and the landfill filter compose."
        test_recipe:
          setup:
            - "Landfill LF-A with three cells C-1, C-2, C-3 (C-1 moved to UNDER_CONSTRUCTION, the other two left in DESIGN) and Landfill LF-B with one cell C-9 in DESIGN."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lfa_id: $.data.id }
            - call: "POST /landfills"
              payload: { name: "Eastbank MSW", permit_number: "MSW-9902", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lfb_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lfa_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lfa_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lfa_id}", cell_code: "C-2", design_airspace_cy: 200, design_area_sf: 45001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-20T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lfa_id}"
            - call: "POST /cells"
              payload: { landfill_id: "${lfa_id}", cell_code: "C-3", design_airspace_cy: 300, design_area_sf: 45001, liner_type: "GCL_ONLY", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-25T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lfa_id}"
            - call: "POST /cells"
              payload: { landfill_id: "${lfb_id}", cell_code: "C-9", design_airspace_cy: 500, design_area_sf: 45001, liner_type: "SINGLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-25T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lfb_id}"
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lfa_id}"
          trigger:
            - call: "GET /cells"
              payload: { landfill_id: "${lfa_id}", limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /cells"
              payload: { landfill_id: "${lfa_id}", limit: 2, offset: 2 }
              as: PlatformAdmin
            - call: "GET /cells"
              payload: { landfill_id: "${lfa_id}", status: "DESIGN" }
              as: PlatformAdmin
            - call: "GET /landfills/${lfb_id}/cells"
              payload: {}
              as: PlatformAdmin
          assert:
            - "trigger 1: response_type 'array', 2 items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "trigger 2: 1 item, total_count == 3, has_more == false"
            - "trigger 3: 2 items (C-2 and C-3), total_count == 2, has_more == false — C-1 is UNDER_CONSTRUCTION and LF-B's C-9 is out of scope"
            - "trigger 4: 1 item (C-9), total_count == 1 — the sub-resource route scopes to its own parent"
            - "trigger 3 with no limit supplied applies the declared default limit 10 and offset 0"

      - name: unknown_ids_in_path_and_body_return_entity_specific_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: "A miss in a PATH id (priority 4) and a miss in a BODY foreign key (priority 5) are separate ladder rungs, and each returns the missing entity's OWN not-found id rather than a generic 404."
        test_recipe:
          setup:
            - "One Landfill LF exists; the id 00000000-0000-4000-8000-000000000000 is never minted."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
          trigger:
            - call: "GET /cells/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /cells"
              payload: { landfill_id: "00000000-0000-4000-8000-000000000000", cell_code: "C-1", design_airspace_cy: 200, design_area_sf: 45001, liner_type: "GCL_ONLY", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-20T00:00:00Z" }
              as: SiteOperator
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err2: $.data.error_id }
            - call: "POST /cells/00000000-0000-4000-8000-000000000000/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { err3: $.data.error_id }
          assert:
            - "${err1} == 'ERR_CELL_NOT_FOUND' with HTTP 404"
            - "${err2} == 'ERR_LANDFILL_NOT_FOUND' with HTTP 404 and no Cell row is created"
            - "${err3} == 'ERR_CELL_NOT_FOUND' with HTTP 404 — the path id is resolved before any site-scope or state check"

      - name: cell_create_missing_required_fields_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - endpoints[POST /cells]
        distinguishing_aspect: "Every §1.5 input field without a declared default is required; omitting liner_type or design_airspace_cy is a shape error at priority 3, before any FK resolution."
        test_recipe:
          setup:
            - "One Landfill LF exists."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
          trigger:
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 200, design_area_sf: 45001, construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-20T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /cells"
              payload: { landfill_id: "00000000-0000-4000-8000-000000000000", cell_code: "C-1", design_area_sf: 45001, liner_type: "GCL_ONLY", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-20T00:00:00Z" }
              as: SiteOperator
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err2: $.data.error_id }
          assert:
            - "${err1} == 'ERR_INVALID_REQUEST' with HTTP 400 (liner_type omitted)"
            - "${err2} == 'ERR_INVALID_REQUEST' with HTTP 400 — the missing design_airspace_cy is reported at priority 3 even though the landfill_id would also miss at priority 5"
            - "no Cell row exists for LF after either call"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Landfill.fields.daily_load_limit
          - entities.TreatmentAgreement.fields.concurrent_slot_capacity
          - entities.ClosureCostEstimate.fields.post_closure_years
          - entities.Cell.fields.piggyback_over_cell_id
        distinguishing_aspect: "Four different defaults on four entities are applied server-side when the optional input is omitted: 200 loads/day, 2 slots, 30 post-closure years and a null piggyback parent. The 30-year default is observable through the computed post_closure_cost_total."
        test_recipe:
          setup:
            - "Empty database; logical clock at its startup default."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id, lf_limit: $.data.daily_load_limit, lf_v1: $.data.version }
          trigger:
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-2", design_airspace_cy: 200, design_area_sf: 45001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-20T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c2_piggy: $.data.piggyback_over_cell_id, c2_status: $.data.status }
            - call: "POST /treatment-agreements"
              payload: { landfill_id: "${lf_id}", facility_name: "Valley POTW", daily_gallon_cap: 20000, base_haul_fee: 350.00, treatment_rate_per_kgal: 62.50, effective_from: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { ta_slots: $.data.concurrent_slot_capacity, ta_gal: $.data.scheduled_gallons_today }
            - call: "POST /closure-cost-estimates"
              payload: { landfill_id: "${lf_id}", estimate_year: 2026, closure_unit_cost_per_sf: 1.855, post_closure_annual_cost: 95000.00, inflation_pct: 0.03, expected_landfill_version: "${lf_v1}" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { est_years: $.data.post_closure_years, est_pc: $.data.post_closure_cost_total, est_cc: $.data.closure_cost_total, est_req: $.data.required_assurance_amount }
            - call: "POST /surface-emission-scans"
              payload: { landfill_id: "${lf_id}", scanned_on: "2026-08-01T00:00:00Z", grid_points_count: 40, max_reading_ppm: 499.9 }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { scan_ref: $.data.exceedance_point_ref, scan_status: $.data.status }
          assert:
            - "${lf_limit} == 200 — the omitted daily_load_limit took its declared default"
            - "${c2_piggy} is null and ${c2_status} == 'DESIGN'"
            - "${ta_slots} == 2 and ${ta_gal} == 0"
            - "${est_years} == 30, ${est_cc} == 0.00 (no certified cells yet) and ${est_pc} == 4519664.50, so ${est_req} == 4519664.50"
            - "${scan_ref} is null and ${scan_status} == 'PASSED' (499.9 is below the 500.0 exceedance constant)"

      - name: computed_fields_are_derived_server_side_from_declared_inputs
        claim_type: computed_fields
        grounds:
          - entities.LinerQaPackage.fields.qa_conformance_score
          - entities.AerialSurvey.fields.measured_density_tons_per_cy
          - entities.Cell.fields.fill_pct
          - calculations.qa_conformance_score
        distinguishing_aspect: "Computed fields are absent from every §1.5 `input:` list, so a client cannot supply them; they must appear in the create response already evaluated from the declared measurement inputs."
        test_recipe:
          setup:
            - "Landfill LF with Cell C-1 driven to UNDER_CONSTRUCTION."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id, c1_fill: $.data.fill_pct, c1_consumed: $.data.consumed_airspace_cy }
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
          trigger:
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c1_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 20, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { qa_score: $.data.qa_conformance_score, qa_round: $.data.revision_round }
            - call: "POST /aerial-surveys"
              payload: { landfill_id: "${lf_id}", flown_on: "2026-08-01T00:00:00Z", coverage_period_start: "2026-05-01T00:00:00Z", coverage_period_end: "2026-07-31T00:00:00Z", measured_remaining_airspace_cy: 700000, tons_placed_in_period: 250000 }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { s_consumed: $.data.airspace_consumed_in_period_cy, s_density: $.data.measured_density_tons_per_cy }
          assert:
            - "${c1_fill} == 0 and ${c1_consumed} == 0 on creation"
            - "${qa_score} == 100.00 for 4000 ft of seam, 20 of 20 destructive tests passing and a defect density of 2/40 = 0.05 (exactly the free allowance, so the penalty is 0.00)"
            - "${qa_round} == 1"
            - "${s_consumed} == 300000 (certified_airspace_cy 1000000 minus the surveyed 700000, because no prior survey exists) and ${s_density} == 0.8333"
            - "neither qa_conformance_score nor measured_density_tons_per_cy appears in the endpoint's declared input list, so no client value can override them"

      - name: system_fields_are_server_minted_and_record_the_acting_user
        claim_type: system_fields
        grounds:
          - entities.LinerQaPackage.fields.submitted_by_user_id
          - entities.LinerQaPackage.fields.reviewed_by_user_id
          - entities.Cell.fields.authorized_by_agency_user_id
          - entities.LinerQaPackage.fields.status
        distinguishing_aspect: "System fields split into two kinds: monotonic bookkeeping (id, created_at, updated_at, version) and actor capture from the X-User-ID header. The reviewer id must stay null until a review actually begins."
        test_recipe:
          setup:
            - "Landfill LF with Cell C-1 in UNDER_CONSTRUCTION."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id, c1_auth: $.data.authorized_by_agency_user_id }
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
          trigger:
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c1_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 20, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { qa_id: $.data.id, qa_sub: $.data.submitted_by_user_id, qa_rev: $.data.reviewed_by_user_id, qa_state: $.data.status, qa_v: $.data.version, qa_cert: $.data.certification_reference }
            - call: "POST /liner-qa-packages/${qa_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
              captures: { qa_rev2: $.data.reviewed_by_user_id, qa_state2: $.data.status, qa_v2: $.data.version }
          assert:
            - "${c1_auth} is null before any regulatory authorization"
            - "${qa_sub} == '${lf_id}' — SiteOperator is entity_backed:Landfill, so the submitter id is the landfill id from X-User-ID"
            - "${qa_rev} is null, ${qa_state} == 'SUBMITTED', ${qa_v} == 1 and ${qa_cert} is null at creation"
            - "${qa_rev2} == 'cqa-engineer-2', ${qa_state2} == 'UNDER_REVIEW' and ${qa_v2} == 2 — version increments by exactly one per mutation"
            - "LinerQaPackage.${qa_id}.updated_at is strictly later than its created_at after the review begins"

      - name: invalid_enums_ranges_and_inverted_intervals_are_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.Cell.fields.liner_type
          - entities.Landfill.fields.planned_density_tons_per_cy
          - entities.LinerQaPackage.fields.passing_test_count
        distinguishing_aspect: "Four different shapes of type violation — undeclared enum member, out-of-range number, cross-field count inequality and an inverted date interval — all collapse to the single priority-3 error id, and none of them creates a row."
        test_recipe:
          setup:
            - "Landfill LF with Cell C-1 in UNDER_CONSTRUCTION."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
          trigger:
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-4", design_airspace_cy: 200, design_area_sf: 45001, liner_type: "MEMBRANE_ONLY", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-20T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /landfills"
              payload: { name: "Overdense MSW", permit_number: "MSW-5000", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 1.50, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { err2: $.data.error_id }
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c1_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 21, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { err3: $.data.error_id }
            - call: "POST /special-waste-approvals"
              payload: { landfill_id: "${lf_id}", generator_name: "Ridgeview Plating Co", waste_code: "IS-4410", profile_stream: "INDUSTRIAL_SPECIAL", approved_tons_cap: 500, effective_from: "2026-12-31T00:00:00Z", expires_on: "2026-01-01T00:00:00Z" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { err4: $.data.error_id }
          assert:
            - "${err1} == 'ERR_INVALID_REQUEST' with HTTP 400 — MEMBRANE_ONLY is not one of {SINGLE_COMPOSITE, DOUBLE_COMPOSITE, GCL_ONLY}"
            - "${err2} == 'ERR_INVALID_REQUEST' with HTTP 400 — 1.50 is outside the declared 0.40..1.20 band"
            - "${err3} == 'ERR_INVALID_REQUEST' with HTTP 400 — passing_test_count may not exceed destructive_test_count"
            - "${err4} == 'ERR_INVALID_REQUEST' with HTTP 400 — expires_on must be strictly after effective_from"
            - "no Cell, Landfill, LinerQaPackage or SpecialWasteApproval row is created by any of the four calls, and Cell.${c1_id}.status is still 'UNDER_CONSTRUCTION'"

      - name: child_creation_requires_its_declared_parent_row
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - entities.WasteLoad.fields.operating_day_id
          - entities.LeachateShipment.fields.treatment_agreement_id
          - entities.GasWell.fields.cell_id
        distinguishing_aspect: "Every entity in this flat topology is reachable only through its declared FK; supplying an id that resolves to nothing returns that PARENT's not-found error, and the child row is never created even when all other fields are valid."
        test_recipe:
          setup:
            - "Landfill LF exists; no OperatingDay, TreatmentAgreement or Cell is created."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
          trigger:
            - call: "POST /waste-loads"
              payload: { operating_day_id: "00000000-0000-4000-8000-000000000000", hauler_ref: "H-1", waste_stream: "MSW", manifest_tons: 30.00, load_check_result: "PASS" }
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "00000000-0000-4000-8000-000000000000", gallons: 4000, window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T10:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { err2: $.data.error_id }
            - call: "POST /gas-wells"
              payload: { cell_id: "00000000-0000-4000-8000-000000000000", well_code: "W-1", depth_ft: 85 }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { err3: $.data.error_id }
          assert:
            - "${err1} == 'ERR_OPERATING_DAY_NOT_FOUND' with HTTP 404"
            - "${err2} == 'ERR_TREATMENT_AGREEMENT_NOT_FOUND' with HTTP 404"
            - "${err3} == 'ERR_CELL_NOT_FOUND' with HTTP 404"
            - "GET /waste-loads, GET /leachate-shipments and GET /gas-wells each return total_count 0"

      - name: cross_site_foreign_keys_are_rejected_by_referential_integrity
        claim_type: foreign_key_integrity
        grounds:
          - validations[priority=7]
          - errors[ERR_CROSS_SITE_REFERENCE]
        excluded_because:
          difficulty_instance: cross_site_reference_outranks_cell_not_accepting_waste   # §1.8 rule: priority_pair_validation_conflict
          rationale: "That §1.8 instance links a WasteLoad to another landfill's SpecialWasteApproval and asserts ERR_CROSS_SITE_REFERENCE wins over the cell-state gate, which is exactly this flat-topology integrity claim."

  - section: state_machines
    instances:

      - name: every_entity_is_created_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Cell.DESIGN_to_UNDER_CONSTRUCTION
          - state_machines.SpecialWasteApproval.REQUESTED_to_APPROVED
          - state_machines.TreatmentAgreement.ACTIVE_to_SUSPENDED
          - state_machines.ClosureCostEstimate.DRAFT_to_CERTIFIED
          - state_machines.HostCommunityAgreement.DRAFT_to_EXECUTED
          - state_machines.AerialSurvey.RECORDED_to_SUPERSEDED
          - state_machines.GasWell.DRILLED_to_CONNECTED
        distinguishing_aspect: "Seven machines with seven different initial states — DESIGN, REQUESTED, ACTIVE, DRAFT, DRAFT, RECORDED, DRILLED — must each be honoured at creation; none of them starts in a state that a client can choose."
        test_recipe:
          setup:
            - "Landfill LF registered; Cell C-1 created (still DESIGN) so a GasWell has a parent."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
