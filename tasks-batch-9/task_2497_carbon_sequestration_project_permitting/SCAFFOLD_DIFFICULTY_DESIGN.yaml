  - rule_id: resource_temporal_overlap
    instances:
      - name: injection_periods_half_open_adjacency_permitted_overlap_rejected
        grounds:
          - validations[priority=80]
          - errors[ERR_INJECTION_PERIOD_OVERLAP]
          - entities.InjectionPeriodRecord.fields.period_start
          - entities.InjectionPeriodRecord.fields.period_end
          - entities.InjectionPeriodRecord.fields.status
          - calculations.secure_storage_ledger
        distinguishing_aspect: |
          Interval semantics are half-open [period_start, period_end) and the resource is a single
          InjectionWellPermit's reporting ledger, so a period starting exactly where the previous one ends
          is accepted while a straddling period is refused with ERR_INJECTION_PERIOD_OVERLAP (409), and
          because only ACCEPTED rows occupy the interval, voiding a record frees its window for reuse.
        test_recipe:
          setup:
            - "logical clock advanced to 2028-02-01T00:00:00Z"
            - "project 'Alpha Storage Hub' in status INJECTION_ACTIVE, operational_posture OPEN"
            - "one InjectionWellPermit 'ALPHA-1' in permit_status ACTIVE with construction_status COMPLETED"
