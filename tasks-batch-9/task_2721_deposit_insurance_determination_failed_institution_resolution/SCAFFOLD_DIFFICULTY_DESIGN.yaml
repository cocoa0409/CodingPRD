          - calculations.dividend_waterfall_allocation
          - calculations.institution_aggregate_reconciliation
          - endpoints[POST /dividend-distributions/{id}/void]
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: RECEIVERSHIP CASH, exposed as cash_conservation_delta_cents
          (gross proceeds minus expenses MINUS cash on hand plus cumulative dividends). Nothing about
          insurance attribution is involved. The void must push 1999800 back into
          receivership_cash_cents (2000200 -> 4000000), zero every certificate's cumulative and last
          dividend fields, revert their statuses to ISSUED, and still RETAIN total_distributed_cents on
          the VOIDED row for audit — a reversal that zeroed the audit field would also satisfy a naive
          cash check but is explicitly forbidden here.
