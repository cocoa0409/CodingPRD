      - name: corner_calculation_precision_and_rounding_mode
        claim_type: Precision
        grounds:
          - calculations.community_impact_fund_allocation
          - calculations.pledge_designation_fee_allocation
        excluded_because:
          difficulty_instance: boundary_precision_check / designation_offset_tier_floor_and_money_half_cent_rounding
          rationale: "The §1.8 instance pins the half-cent round_half_up behaviour on money fields and the tier floor boundary in one recipe."

      - name: corner_forward_looking_projection_includes_open_pledges
        claim_type: forward_looking
        grounds:
          - calculations.campaign_pledge_loss_estimate
          - entities.Campaign.fields.projected_payroll_pledge_total
        excluded_because:
          difficulty_instance: dual_variant_calc / campaign_shrinkage_provisional_vs_final_loss_divergence
          rationale: "The §1.8 instance asserts the PROVISIONAL forward-looking input set (PAYROLL_DEDUCTION pledges still PENDING/PARTIAL) against the FINAL retrospective set."

      - name: corner_waterfall_allocation_fills_buckets_in_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.community_impact_fund_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / impact_fund_offset_then_supplement_evaluation_order_pin
          rationale: "The §1.8 instance pins the seven-step waterfall order, including which figure keys the offset rate and which keys the supplement rate."

      - name: corner_dual_variant_divergence_on_same_data
        claim_type: Variant Divergence
        grounds:
          - calculations.agency_financial_standing_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / agency_standing_preliminary_vs_certified_score_divergence
          rationale: "The §1.8 instance drives both variants over one review packet and asserts the 80.00 vs 69.50 delta."

      - name: corner_dual_variant_selection_by_context
        claim_type: Variant Selection
        grounds:
          - calculations.campaign_pledge_loss_estimate.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / campaign_shrinkage_provisional_vs_final_loss_divergence
          rationale: "The §1.8 instance shows PROVISIONAL selected by close-solicitation and FINAL selected by reconcile on the same campaign."

      - name: corner_dual_variant_reconciliation_to_ledger
        claim_type: Reconciliation
        grounds:
          - entities.Campaign.fields.final_net_expected_revenue
          - entities.Campaign.fields.provisional_net_expected_revenue
        excluded_because:
          difficulty_instance: dual_variant_calc / campaign_shrinkage_provisional_vs_final_loss_divergence
          rationale: "The §1.8 instance asserts both net-expected-revenue fields after the variant switch, which is the reconciliation delta."

  - section: validations
    instances:

      - name: designation_at_exact_minimum_amount_of_twenty_five_passes
        claim_type: Satisfaction → Pass
        grounds:
          - validations.priority_31
          - calculations.pledge_designation_fee_allocation.constants.MIN_DESIGNATION_AMOUNT
          - entities.PledgeDesignation.fields.designated_amount
        distinguishing_aspect: |
          The MIN_DESIGNATION_AMOUNT guard is an inclusive floor, so a line at exactly 25.00 is
          accepted rather than refused: the pledge is created 201 with the line stored at 25.00,
          processing_fee 1.81 and net 23.19, proving the comparison is `< 25.00` and not
          `<= 25.00`.
        test_recipe:
          setup:
            - "One GOOD_STANDING agency and one OPEN campaign."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Cedar Ridge Youth Corps", ein: "610000007", primary_priority_area: "EDUCATION" }
              as: UnitedFundAdmin
              captures: { ag: $.data.id }
            - call: "POST /fundraising/agencies/${ag}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.7800, admin_expense_ratio: 0.1900, months_operating_reserve: 4.00, governance_checklist_passed_count: 8, audit_opinion: "UNQUALIFIED" }
              as: FinanceReviewer
              captures: { rev: $.data.id }
            - call: "POST /fundraising/agencies/${ag}/reviews/${rev}/certify"
              payload: { audited_program_expense_ratio: 0.7800, audited_admin_expense_ratio: 0.1900, audited_months_operating_reserve: 4.00 }
              as: FinanceReviewer
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Ironwood Millworks", employee_count: 95 }
              as: UnitedFundAdmin
              captures: { emp: $.data.id }
            - call: "POST /fundraising/employers/${emp}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30" }
              as: UnitedFundAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraising/campaigns/${camp}/open"
              payload: {}
              as: UnitedFundAdmin
          trigger:
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "M-001", giving_method: "ONE_TIME_CHECK", gross_amount: 60.00, designations: [ { agency_id: "${ag}", designated_amount: 25.00 } ] }
              as: UnitedFundAdmin
              captures: { pl: $.data.id, tot: $.data.designated_amount_total }
          assert:
            - "HTTP 201 (no ERR_DESIGNATION_BELOW_MINIMUM)"
            - "Pledge.${pl}.designated_amount_total == 25.00"
            - "Pledge.${pl}.designation_fee_total == 1.81"
            - "Pledge.${pl}.net_designated_total == 23.19"
            - "Pledge.${pl}.undesignated_amount == 35.00"
            - "Pledge.${pl}.designation_status == DRAFT"

      - name: designation_lines_each_valid_but_sum_exceeds_pledge_gross_returns_exceeds_gross
        claim_type: Aggregate validation
        grounds:
          - validations.priority_32
          - validations.priority_31
          - errors.ERR_DESIGNATION_EXCEEDS_GROSS
        distinguishing_aspect: |
          Line-level validity is not sufficient: 60.00 and 50.00 each clear the 25.00 floor, so
          priority 31 passes, but their 110.00 sum exceeds the 100.00 gross and priority 32
          returns ERR_DESIGNATION_EXCEEDS_GROSS (422). An implementation that only validates
          designation lines individually accepts this and mints a negative undesignated_amount.
        test_recipe:
          setup:
