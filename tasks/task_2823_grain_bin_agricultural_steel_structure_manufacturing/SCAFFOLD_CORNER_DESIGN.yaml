      - name: crew_assignment_checks_the_dealer_match_and_the_certificate_expiry_inclusively
        claim_type: violation_to_error
        grounds:
          - validations.p16
          - validations.p20
          - errors.ERR_CREW_DEALER_MISMATCH
          - errors.ERR_CREW_CERTIFICATION_EXPIRED
        distinguishing_aspect: "Both crews are T3 with max_diameter_m 30.0 against a 12.0 m design, so the priority-12 tier gate is satisfied throughout and only the referential and temporal gates can fire. The expiry comparison is probed at exactly certified_until and one second past it: an assignment at 2027-12-31T00:00:00Z succeeds while the same crew at 2027-12-31T00:00:01Z is refused, which pins the at-or-before reading. The crew row itself never changes state - it stays CERTIFIED - so the refusal comes from the clock and not from a status transition."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST, GrainProfile CORN, CoatingSpec G115, engineer PE-1001."
            - "Dealer Alpha and Dealer Pinnacle, each with one T3 crew certified_until 2027-12-31T00:00:00Z."
            - "BinDesign D1 (diameter 12.0 m) for Alpha and two DealerOrders OA1 and OA2 on it, both created at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
