          rationale: "That §1.8 instance drives both dimensions and asserts that sweep badge expiry leaves escort_status at ESCORT_ATTACHED."

      - name: authorization_approval_guarded_by_rep_access_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.CaseRepAuthorization.REQUESTED_to_APPROVED
          - validations.priority_11_ERR_REP_ACCESS_SUSPENDED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / authorization_approval_blocked_by_suspended_rep_returns_409
          rationale: "That §1.8 instance is exactly the cross-entity guard: REQUESTED -> APPROVED refused because the VendorRep is SUSPENDED."

      - name: loaner_fee_reversal_syncs_vendor_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.LoanerSet.DELIVERED_LATE_to_DELIVERED_ON_TIME
          - entities.Vendor.fields.late_fee_balance_cents
        excluded_because:
          difficulty_instance: compensating_invariant / fee_reversal_conserves_vendor_ledger_against_resum
          rationale: "That §1.8 instance reconciles Vendor.late_fee_balance_cents before and after a reversal against a naive re-sum of assessed_late_fee_cents."

  - section: calculations
    instances:

      - name: deadline_applies_tray_surcharge_and_complexity_constants
        claim_type: constants_applied
        grounds:
          - calculations.loaner_delivery_deadline
          - global_constants.COMPLEXITY_HOURS
          - global_constants.TRAY_SURCHARGE_HOURS
        distinguishing_aspect: "A 13-tray IMPLANT_SPECIALTY set at a facility with spd_turnaround_hours 5 takes the top tray band (2) plus IMPLANT_SPECIALTY hours (10) plus turnaround (5) = 17 lead hours, and because the product is NOT an implant the 24-hour floor does not apply: the deadline is 2026-10-19T19:00:00Z."
        test_recipe:
          setup:
            - "Facility CA-40 has spd_turnaround_hours 5 and spd_bay_count 2."
            - "Vendor CALCV has one ACTIVE non-implant product; case CASE-14001 starts 2026-10-20T12:00:00Z."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Calculation Constants Hospital", code: "CA-40", spd_turnaround_hours: 5, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_ca_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Calculation Devices", vendor_code: "CALCV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_calcv_id: $.data.id, v_calcv_ver0: $.data.version }
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_calcv_id}", facility_id: "${f_ca_id}", product_name: "Specialty Power Tray", product_catalog_number: "SP-800", manufacturer: "Calcv", is_implant: false, unit_cost_cents: 90000, expected_vendor_version: "${v_calcv_ver0}" }
              as: VendorAdmin
              as_user_id: "${v_calcv_id}"
              captures: { pir_sp_id: $.data.id }
            - call: "POST /vendor-access/product-introduction-requests/${pir_sp_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_calcv_id}"
            - call: "POST /vendor-access/product-introduction-requests/${pir_sp_id}/clinical-review"
              payload: { decision: "ENDORSE" }
              as: ClinicalSponsor
              as_user_id: "user_sponsor_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_sp_id}/value-analysis-decision"
              payload: { decision: "APPROVE" }
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
            - call: "GET /vendor-access/approved-products?product_introduction_request_id=${pir_sp_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ap_sp_id: "$.data[0].id" }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_ca_id}", case_number: "CASE-14001", procedure_name: "Specialty Instrument Case", scheduled_start_utc: "2026-10-20T12:00:00Z", scheduled_end_utc: "2026-10-20T14:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_14001_id: $.data.id }
            - call: "GET /vendor-access/surgical-cases/${case_14001_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { case_14001_ver: $.data.version }
          trigger:
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_14001_id}", approved_product_id: "${ap_sp_id}", tray_count: 13, reprocessing_complexity: "IMPLANT_SPECIALTY", expected_case_version: "${case_14001_ver}" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ls_14001_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "LoanerSet.${ls_14001_id}.required_delivery_deadline_utc == 2026-10-19T19:00:00Z"
            - "LoanerSet.${ls_14001_id}.pinned_deadline_utc == 2026-10-19T19:00:00Z"
            - "LoanerSet.${ls_14001_id}.spd_occupation_start_utc == 2026-10-19T19:00:00Z and spd_occupation_end_utc == 2026-10-20T12:00:00Z"
            - "LoanerSet.${ls_14001_id}.status == EXPECTED with late_minutes_pinned_basis == 0 and late_minutes_current_basis == 0"

      - name: late_fee_cap_clamps_raw_fee_at_the_declared_ceiling
        claim_type: tiered_pricing
        grounds:
          - calculations.loaner_late_fee
          - global_constants.LATE_FEE_CAP_CENTS
          - global_constants.HARD_REJECT_GRACE_MINUTES
        distinguishing_aspect: "3000 late minutes on a 20-tray IMPLANT_SPECIALTY set give per_tray 13125 cents and a raw fee of 262500, which the LATE_FEE_CAP_CENTS ceiling clamps to exactly 250000 — the cap bites after the per-tray multiplication, not before."
        test_recipe:
          setup:
            - "Facility CP-41 has spd_turnaround_hours 8 and spd_bay_count 2."
            - "Vendor CAPV has one ACTIVE implant product; implant case CASE-14101 starts 2026-10-25T08:00:00Z, so a 20-tray IMPLANT_SPECIALTY set has lead hours max(2 + 10 + 8, 24) = 24 and deadline 2026-10-24T08:00:00Z."
            - "The set is received at 2026-10-26T10:00:00Z, exactly 3000 minutes late, which is far past HARD_REJECT_GRACE_MINUTES."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Capped Fee Hospital", code: "CP-41", spd_turnaround_hours: 8, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_cp_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Capped Fee Devices", vendor_code: "CAPV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_capv_id: $.data.id, v_capv_ver0: $.data.version }
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_capv_id}", facility_id: "${f_cp_id}", product_name: "Capped Hip Stem", product_catalog_number: "CH-900", manufacturer: "Capv", is_implant: true, unit_cost_cents: 800000, expected_vendor_version: "${v_capv_ver0}" }
              as: VendorAdmin
              as_user_id: "${v_capv_id}"
              captures: { pir_ch_id: $.data.id }
            - call: "POST /vendor-access/product-introduction-requests/${pir_ch_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_capv_id}"
            - call: "POST /vendor-access/product-introduction-requests/${pir_ch_id}/clinical-review"
              payload: { decision: "ENDORSE" }
              as: ClinicalSponsor
              as_user_id: "user_sponsor_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_ch_id}/value-analysis-decision"
              payload: { decision: "APPROVE" }
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
            - call: "GET /vendor-access/approved-products?product_introduction_request_id=${pir_ch_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ap_ch_id: "$.data[0].id" }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_cp_id}", case_number: "CASE-14101", procedure_name: "Capped Arthroplasty", scheduled_start_utc: "2026-10-25T08:00:00Z", scheduled_end_utc: "2026-10-25T11:00:00Z", implant_required: true }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_14101_id: $.data.id }
            - call: "GET /vendor-access/surgical-cases/${case_14101_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { case_14101_ver: $.data.version }
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_14101_id}", approved_product_id: "${ap_ch_id}", tray_count: 20, reprocessing_complexity: "IMPLANT_SPECIALTY", expected_case_version: "${case_14101_ver}" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ls_14101_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/loaner-sets/${ls_14101_id}/receive"
              payload: { delivered_at_utc: "2026-10-26T10:00:00Z" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
          assert:
            - "HTTP status is 200"
            - "LoanerSet.${ls_14101_id}.required_delivery_deadline_utc == 2026-10-24T08:00:00Z"
            - "LoanerSet.${ls_14101_id}.late_minutes_current_basis == 3000 and late_minutes_pinned_basis == 3000"
            - "LoanerSet.${ls_14101_id}.assessed_late_fee_cents == 250000, NOT the uncapped 262500"
            - "LoanerSet.${ls_14101_id}.status == REJECTED_LATE and fee_status == ASSESSED"
            - "Vendor.${v_capv_id}.late_fee_balance_cents == 250000"
            - "Vendor.${v_capv_id}.provisional_compliance_score == 95 and adjudicated_compliance_score == 95 (one late delivery at W_LATE_DELIVERY 5)"
            - "SurgicalCase.${case_14101_id}.implant_readiness_status == BLOCKED"

      - name: posture_input_set_ignores_rejected_and_pending_credentials
        claim_type: input_set_filtering
        grounds:
          - calculations.rep_credential_posture
          - state_machines.Credential.PENDING_VERIFICATION_to_REJECTED
          - validations.priority_31_ERR_DUPLICATE_CREDENTIAL
        distinguishing_aspect: "Only VERIFIED and EXPIRING_SOON rows cover a required type: with three types VERIFIED, one BACKGROUND_CHECK REJECTED and a replacement BACKGROUND_CHECK still PENDING_VERIFICATION the posture is INCOMPLETE, and it only becomes COMPLIANT when the replacement is verified."
        test_recipe:
          setup:
            - "Vendor FILTV has rep Fay with IMMUNIZATION_INFLUENZA, TRAINING_BLOODBORNE_PATHOGENS and COI_GIFT_ATTESTATION VERIFIED."
            - "Her first BACKGROUND_CHECK was REJECTED, so a second BACKGROUND_CHECK could be filed and is PENDING_VERIFICATION."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Filtered Input Devices", vendor_code: "FILTV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_filtv_id: $.data.id }
