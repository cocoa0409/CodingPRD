      - name: weather_cancellation_of_a_dispatched_leg_diverts_instead_of_cancelling_and_is_terminal
        claim_type: Invalid Transitions
        grounds:
          - state_machines.FlightLeg[DISPATCHED -> DIVERTED]
          - validations[priority 43 ERR_LEG_INVALID_STATE]
          - endpoints[POST /wetlease/flight-legs/{legId}/cancel]
          - entities.FlightLeg.fields.cancel_reason
        distinguishing_aspect: |
          The cancel endpoint's destination is chosen by TWO discriminators at once: the source state
          and cancel_reason. A DISPATCHED leg cancelled for WEATHER lands on DIVERTED rather than
          CANCELLED_LESSOR even though cancelling_party is LESSOR, and DIVERTED is terminal - the
          second cancel is 409 ERR_LEG_INVALID_STATE and must not overwrite cancelling_party or
          cancel_reason. A diverted leg is billable-neutral: actual_out was recorded at dispatch but
          billable_block_minutes is 0, credited hours stay 0.0000 and the guarantee floor still governs
          the OPEN month at 2,400,000. Its billing_state never left UNBILLED.
          
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE lease on G-ACMI with both pilots QUALIFIED."
            - "One REVENUE leg EGSS-LEPA scheduled 2026-09-08T06:00:00Z..08:25:00Z, DISPATCHED with actual_out 2026-09-08T06:10:00Z."
            - "The 2026-09 UtilizationPeriod is OPEN."
