      - name: arc_flash_ceiling_rounding_39_9_labelable_vs_40_0_unlabelable_one_millisecond_apart
        grounds:
          - calculations.arc_flash_label_values
          - validations[priority=42]
          - entities.ComplianceLabel.fields.incident_energy_cal_cm2
          - entities.TestReport.fields.arc_duration_ms
        distinguishing_aspect: |
          Two reports on the SAME test differ by one millisecond of arc duration: 645 ms gives a raw
          incident energy of 39.8792... which the mandated round_ceiling to 1 decimal lifts to exactly
          39.9 (still labelable, PPE category 4), while 646 ms gives 39.9410... which ceilings to
          exactly 40.0 and is rejected with 422 ERR_ARC_ENERGY_UNLABELABLE. A round_half_up
          implementation would report 39.9 for both and wrongly issue the second label.
        test_recipe:
          setup:
            - "Order TX-BND-0012 with rated_kv 15 so kv_factor is exactly 1.00 (the <= 15 arm), driven to fulfillment_status IN_PRODUCTION and engineering_status DESIGN_RELEASED."
            - "One FAT IN_PROGRESS on bay BAY-B12; both reports share winding_temp_rise_c 50, temp_rise_limit_c 65, short_circuit_current_ka 25 and working_distance_mm 455, so both are PASS reports and only arc_duration_ms differs."
            - "Report R1 arc_duration_ms 645; report R2 arc_duration_ms 646. R1's label is generated before R2 is issued, so R1 is still ISSUED at generation time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /engineered-orders"
              payload: { order_number: "TX-BND-0012", customer_name: "Quarry Bend Steel", product_family: "MV_SWITCHGEAR", rated_kv: 15, contract_value_cents: 900000, sold_at: "2026-02-01T00:00:00Z", promised_ship_at: "2026-12-01T00:00:00Z", owning_sales_user_id: "u_sales_1" }
              as: ContractAdmin
              captures: { ord_id: $.data.id, ord_v0: $.data.version }
            - call: "POST /engineered-orders/${ord_id}/submittal-drawings"
              payload: { drawing_set_code: "DS-B12", authored_by_user_id: "u_de_1", expected_engineered_order_version: "${ord_v0}" }
              as: DesignEngineer
              captures: { dwg_id: $.data.id }
            - call: "POST /submittal-drawings/${dwg_id}/submit"
              payload: {}
              as: DesignEngineer
            - call: "POST /submittal-drawings/${dwg_id}/begin-review"
              payload: {}
              as: CustomerReviewer
              as_user_id: "u_cr_1"
            - call: "POST /submittal-drawings/${dwg_id}/disposition"
              payload: { disposition: "APPROVED", reviewed_by_user_id: "u_cr_1", notes_count: 0 }
              as: CustomerReviewer
              as_user_id: "u_cr_1"
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-B12", legal_name: "Quarry Bend Gear", region: "NA" }
              as: PlantAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /suppliers/${sup_id}/long-lead-components"
              payload: { part_number: "BRK-B12", category: "BREAKER", lead_time_days: 25, quantity_on_hand: 5, allocation_policy: "DEDICATED" }
              as: MaterialsPlanner
              captures: { comp_id: $.data.id, comp_v0: $.data.version }
            - call: "POST /component-allocations"
              payload: { long_lead_component_id: "${comp_id}", engineered_order_id: "${ord_id}", quantity: 1, priority_class: 3, need_by_date: "2026-07-01T00:00:00Z", expected_component_version: "${comp_v0}" }
              as: MaterialsPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /component-allocations/${alloc_id}/commit"
              payload: {}
              as: MaterialsPlanner
            - call: "POST /engineered-orders/${ord_id}/start-production"
              payload: {}
              as: MaterialsPlanner
            - call: "POST /test-bays"
              payload: { bay_code: "BAY-B12", max_kv: 38, changeover_buffer_hours: 2, supports_impulse: false }
              as: PlantAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /factory-acceptance-tests"
              payload: { engineered_order_id: "${ord_id}", test_duration_hours: 6, witness_required: false, requires_impulse: false }
              as: TestEngineer
              captures: { fat_id: $.data.id }
            - call: "POST /factory-acceptance-tests/${fat_id}/schedule"
              payload: { test_bay_id: "${bay_id}", window_start_at: "2026-02-10T08:00:00Z" }
              as: TestEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T09:00:00Z" }
              as: PlantAdmin
            - call: "POST /factory-acceptance-tests/${fat_id}/start"
              payload: { run_by_user_id: "u_te_1" }
              as: TestEngineer
            - call: "POST /factory-acceptance-tests/${fat_id}/test-reports"
              payload: { winding_temp_rise_c: 50, temp_rise_limit_c: 65, short_circuit_current_ka: 25, arc_duration_ms: 645, working_distance_mm: 455 }
              as: TestEngineer
              captures: { rep1: $.data.id }
            - call: "POST /test-reports/${rep1}/issue"
              payload: {}
              as: QualityEngineer
              as_user_id: "u_te_1"
            - call: "GET /engineered-orders/${ord_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ord_v1: $.data.version }
            - call: "POST /engineered-orders/${ord_id}/compliance-labels"
              payload: { submittal_drawing_id: "${dwg_id}", test_report_id: "${rep1}", generated_by_user_id: "u_co_1", expected_engineered_order_version: "${ord_v1}" }
              as: ComplianceOfficer
              captures: { lbl1: $.data.id }
          trigger:
            - call: "POST /compliance-labels/${lbl1}/generate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co_1"
            - call: "POST /factory-acceptance-tests/${fat_id}/test-reports"
              payload: { winding_temp_rise_c: 50, temp_rise_limit_c: 65, short_circuit_current_ka: 25, arc_duration_ms: 646, working_distance_mm: 455 }
              as: TestEngineer
              captures: { rep2: $.data.id }
            - call: "POST /test-reports/${rep2}/issue"
              payload: {}
              as: QualityEngineer
              as_user_id: "u_te_1"
            - call: "GET /engineered-orders/${ord_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ord_v2: $.data.version }
            - call: "POST /engineered-orders/${ord_id}/compliance-labels"
              payload: { submittal_drawing_id: "${dwg_id}", test_report_id: "${rep2}", generated_by_user_id: "u_co_1", expected_engineered_order_version: "${ord_v2}" }
              as: ComplianceOfficer
              captures: { lbl2: $.data.id }
            - call: "POST /compliance-labels/${lbl2}/generate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co_1"
          assert:
            - "trigger call 1 returns 200 and ComplianceLabel.${lbl1}.status == GENERATED"
            - "ComplianceLabel.${lbl1}.incident_energy_cal_cm2 == 39.9 (raw 39.879241... ceilinged UP to 1 decimal, not 39.8)"
            - "ComplianceLabel.${lbl1}.ppe_category == 4 (39.9 is >= 25.0 and < 40.0) and arc_flash_boundary_mm == 2623 (sqrt(6880000) = 2622.975... ceilinged to whole mm)"
            - "trigger call 6 returns 422 with error_id ERR_ARC_ENERGY_UNLABELABLE (raw 39.941069... ceilings to exactly 40.0, and 40.0 is NOT labelable)"
            - "ComplianceLabel.${lbl2}.status is still DRAFT with incident_energy_cal_cm2 == null, ppe_category == null and arc_flash_boundary_mm == null -- the rejected generate persists nothing"
            - "TestReport.${rep1}.status == SUPERSEDED and TestReport.${rep2}.status == ISSUED, both with pass_result PASS"
            - "ComplianceLabel.${lbl1}.status is still GENERATED (superseding its pinned report does not disturb an already generated label; only a newer drawing revision would)"

