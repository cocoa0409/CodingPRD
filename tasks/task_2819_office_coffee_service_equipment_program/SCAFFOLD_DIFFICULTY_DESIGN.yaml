  # =====================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: index_movement_at_799_800_and_801_bps_around_the_adjustable_threshold
        grounds:
          - calculations.green_index_adjustment
          - calculations.green_index_adjustment.constants.INDEX_MOVEMENT_THRESHOLD_BPS
          - errors[ERR_INDEX_MOVEMENT_BELOW_THRESHOLD]
          - endpoints[POST /ocs/price-adjustments]
        distinguishing_aspect: |
          Metric: movement_bps, the basis-point index movement, at INDEX_MOVEMENT_THRESHOLD_BPS
          (800). Endpoint: POST /ocs/price-adjustments. Three market values that differ by 200
          micros straddle the threshold exactly - 799 bps is refused, 800 bps is adjustable and
          passes through as 480 bps, and 801 bps passes through as 481 bps because
          round_half_up(801 * 6000 / 10000) = round_half_up(480.6) = 481.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; two fresh accounts A and B, each with green_index_baseline_micros 2000000 and price_protection_days 90, neither inside a protection window"
            - "the market index starts at 2000000, so both accounts read a movement of 0 bps"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_a_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Southgate Partners LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_b_id: "$.data.id" }
            - call: "POST /ocs/_market/set_green_index"
              payload: { index_micros: 2159800 }
              as: ProgramAdmin
          trigger:
            - call: "POST /ocs/price-adjustments"
              payload: { account_id: "${acct_a_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { err_below: "$.data.error_id" }
            - call: "POST /ocs/_market/set_green_index"
              payload: { index_micros: 2160000 }
              as: ProgramAdmin
            - call: "POST /ocs/price-adjustments"
              payload: { account_id: "${acct_a_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { adj_at_id: "$.data.id" }
            - call: "POST /ocs/_market/set_green_index"
              payload: { index_micros: 2160200 }
              as: ProgramAdmin
            - call: "POST /ocs/price-adjustments"
              payload: { account_id: "${acct_b_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { adj_over_id: "$.data.id" }
          assert:
            - "the first trigger call (index 2159800, movement 799 bps) is HTTP 422 with error_id ERR_INDEX_MOVEMENT_BELOW_THRESHOLD and creates no PriceAdjustment"
            - "the second proposal (index 2160000) is HTTP 201 with movement_bps == 800, adjustment_pct_bps == 480, revision_count == 0 and adj_status == PROPOSED"
            - "PriceAdjustment.${adj_at_id}.index_baseline_micros == 2000000 and index_current_micros == 2160000"
            - "the third proposal (index 2160200) is HTTP 201 with movement_bps == 801 and adjustment_pct_bps == 481"
            - "Account.${acct_a_id}.green_price_factor_bps == 10000 and Account.${acct_b_id}.green_price_factor_bps == 10000 - a PROPOSED adjustment never moves prices"
            - "GET /ocs/price-adjustments?account_id=${acct_a_id} returns exactly 1 row"

      - name: route_day_load_exact_capacity_fill_accepted_then_one_minute_over_rejected
        grounds:
          - calculations.route_day_load
          - validations[priority=44]
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
          - endpoints[POST /ocs/service-visits]
          - entities.Route.fields.capacity_minutes
        distinguishing_aspect: |
          A different metric on a different endpoint: booked_minutes_day against
          Route.capacity_minutes at POST /ocs/service-visits. Two 45-minute visits fill a
          90-minute route day to exactly 90, which is ACCEPTED because the check is `>` and not
          `>=`; a third visit of a single minute on the same UTC date makes 91 and is refused,
          while the identical visit on the next MON service date succeeds.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; route MON-TIGHT with service_day MON, capacity_minutes 90 and travel_buffer_minutes 30"
            - "one account with one planned site on that route"
            - "no visits exist yet, so booked_minutes_day for 2026-08-03 is 0 and remaining_minutes is 90"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "MON-TIGHT", service_day: "MON", capacity_minutes: 90, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
          trigger:
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_1_id: "$.data.id" }
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-03T10:15:00Z", window_end: "2026-08-03T11:00:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_2_id: "$.data.id" }
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-03T12:00:00Z", window_end: "2026-08-03T12:01:00Z", planned_minutes: 1 }
              as: AccountManager
              captures: { err: "$.data.error_id" }
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T12:01:00Z", planned_minutes: 1 }
              as: AccountManager
              captures: { visit_next_week_id: "$.data.id" }
          assert:
            - "the first two visits are HTTP 201 and GET /ocs/routes/${route_id}/day-load?service_date=2026-08-03 returns booked_minutes_day == 90, remaining_minutes == 0, capacity_minutes == 90"
            - "the third call (which would make 91 minutes on 2026-08-03) is HTTP 422 with error_id ERR_ROUTE_CAPACITY_EXCEEDED and creates no visit"
            - "the fourth call, one minute on the next MON date, is HTTP 201, proving the limit is per UTC date and not per route"
            - "GET /ocs/routes/${route_id}/day-load?service_date=2026-08-10 returns booked_minutes_day == 1 and remaining_minutes == 89"
            - "Route.${route_id}.booked_minutes_total == 91 (90 on 2026-08-03 plus 1 on 2026-08-10) and the rejected request contributed nothing"

      - name: escalation_score_progression_reaching_exactly_the_40_point_threshold
        grounds:
          - calculations.site_escalation_score
          - calculations.site_escalation_score.constants.ESCALATION_THRESHOLD
          - calculations.consumption_debit
          - endpoints[POST /ocs/sites/{site_id}/evaluate-service-posture]
          - state_machines.Site.ACTIVE_to_ESCALATED
        distinguishing_aspect: |
          A third metric on a third endpoint: escalation_score against ESCALATION_THRESHOLD at
          POST /ocs/sites/{site_id}/evaluate-service-posture. The site walks 0.0 -> 15.0 (two LOW
          rows, 2 * 7.5) -> 40.0 (two STOCKOUT rows, 2 * 20.0) and only the last step escalates,
          pinning the comparison as `>= 40.0` rather than `> 40.0`, with a one-decimal exact score.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route with capacity 480; catalog holds exactly two products, one COFFEE and one CREAMER"
            - "one account with one planned site; both FORECAST ParLevel rows were PATCHed to par_units 28 and reorder_point_units 10, so the modeled draw is 28/14 == 2 units per day"
            - "visit 1 on 2026-08-03 09:00 delivered 20 units of each product, so both rows sit at on_hand_units 20 with stock_status IN_STOCK and escalation_score 0.0"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
