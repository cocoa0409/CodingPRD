              payload: { product_id: "${prod}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-09T00:00:00Z", requested_override_floor_cents: 13000 }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 or 422 per §1.4 priority 3 / 11"
            - "${err} == 'ERR_VALIDATION'"
            - "GET /pricing-exceptions?product_id=${prod} returns total_count == 0"

      - name: create_product_with_unknown_governing_policy_returns_policy_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=5]", entities.Product.fields.governing_policy_id]
        distinguishing_aspect: "Product.governing_policy_id is an FK -> PricingPolicy.id validated at priority 5; an unknown UUID returns 404 ERR_POLICY_NOT_FOUND, distinct from the priority-10 ERR_POLICY_NOT_PUBLISHED."
        test_recipe:
          setup: ["Empty DB; clock 2026-08-01T00:00:00Z; no PricingPolicy rows."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-AUDIO-1", name: "Studio Headphones", msrp_cents: 20000, standard_map_floor_cents: 15000, governing_policy_id: "00000000-0000-4000-8000-0000000000aa" }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_POLICY_NOT_FOUND'"

      - name: create_serial_unit_with_unknown_distributor_returns_distributor_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=5]", entities.SerialUnit.fields.shipped_distributor_id]
        distinguishing_aspect: "SerialUnit.shipped_distributor_id is an FK -> Distributor.id; a valid product_id paired with an unknown distributor UUID returns 404 ERR_DISTRIBUTOR_NOT_FOUND (product_id is validated first, in §1.5 input order)."
        test_recipe:
          setup: ["Policy PUBLISHED, serialized product SKU-AUDIO-1; no Distributor rows exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-A" }
              as: BrandChannelManager
              captures: { pol: $.data.id }
            - call: "POST /pricing-policies/${pol}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol}/review-decision"
              payload: { decision: "APPROVE_FOR_PUBLICATION" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /products"
              payload: { sku: "SKU-AUDIO-1", name: "Studio Headphones", msrp_cents: 20000, standard_map_floor_cents: 15000, governing_policy_id: "${pol}", serialization_enabled: true }
              as: BrandChannelManager
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /serial-units"
              payload: { serial_number: "SN-0001", product_id: "${prod}", lot_code: "LOT-A", shipped_distributor_id: "00000000-0000-4000-8000-0000000000bb" }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_DISTRIBUTOR_NOT_FOUND'"
            - "GET /serial-units?product_id=${prod} returns total_count == 0"

      - name: create_reseller_agreement_with_unknown_reseller_returns_reseller_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=5]", entities.ResellerAgreement.fields.reseller_id]
        distinguishing_aspect: "reseller_id is the first FK in POST /reseller-agreements' §1.5 input list, so an unknown reseller UUID paired with a valid policy_id returns 404 ERR_RESELLER_NOT_FOUND."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; no Reseller rows exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-A" }
              as: BrandChannelManager
              captures: { pol: $.data.id }
            - call: "POST /pricing-policies/${pol}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol}/review-decision"
              payload: { decision: "APPROVE_FOR_PUBLICATION" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
          trigger:
            - call: "POST /reseller-agreements"
              payload: { reseller_id: "00000000-0000-4000-8000-0000000000cc", policy_id: "${pol}", permitted_channels: ["MARKETPLACE"], quality_obligations: [], term_ends_at: "2027-06-30T00:00:00Z" }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_RESELLER_NOT_FOUND'"

  # ===========================================================================
  # SECTION 2 — state_machines  (§1.2, state_machine_shape: parallel;
  #             10 machines / 46 declared transitions)
  # ===========================================================================
  - section: state_machines
    instances:

      # --- PricingPolicy (6 transitions) -----------------------------------
      - name: policy_draft_to_in_legal_review_on_submit_review
        claim_type: valid_transition
        grounds: ["state_machines.PricingPolicy.transitions.DRAFT_to_IN_LEGAL_REVIEW"]
        distinguishing_aspect: "submit-review moves a DRAFT policy to IN_LEGAL_REVIEW and bumps version to 2 without touching revision_number."
        test_recipe:
          setup: ["One DRAFT policy MAP-2026-A at version 1."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
          trigger:
            - *POLSUB
          assert:
            - "HTTP 200"
            - "PricingPolicy.${pol}.status == IN_LEGAL_REVIEW"
            - "PricingPolicy.${pol}.version == 2"
            - "PricingPolicy.${pol}.revision_number == 1"

      - name: policy_in_legal_review_to_draft_on_return_for_revision
        claim_type: valid_transition
        grounds: ["state_machines.PricingPolicy.transitions.IN_LEGAL_REVIEW_to_DRAFT"]
        distinguishing_aspect: "RETURN_FOR_REVISION is the cyclic edge: status falls back to DRAFT while revision_number rises 1 -> 2 and the reviewer stamp is retained."
        test_recipe:
          setup: ["Policy MAP-2026-A in IN_LEGAL_REVIEW at version 2, revision_number 1."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
          trigger:
            - call: "POST /pricing-policies/${pol}/review-decision"
              payload: { decision: "RETURN_FOR_REVISION", legal_review_notes: "Tighten the cure window language" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
          assert:
            - "HTTP 200"
            - "PricingPolicy.${pol}.status == DRAFT"
            - "PricingPolicy.${pol}.revision_number == 2"
            - "PricingPolicy.${pol}.legal_review_notes == 'Tighten the cure window language'"
            - "PricingPolicy.${pol}.reviewed_by_user_id == 'counsel-1'"
            - "PricingPolicy.${pol}.version == 3"

      - name: policy_in_legal_review_to_approved_on_approve_for_publication
        claim_type: valid_transition
        grounds: ["state_machines.PricingPolicy.transitions.IN_LEGAL_REVIEW_to_APPROVED"]
        distinguishing_aspect: "APPROVE_FOR_PUBLICATION reaches APPROVED and, unlike the return edge, leaves revision_number at 1."
        test_recipe:
          setup: ["Policy MAP-2026-A in IN_LEGAL_REVIEW at version 2."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
          trigger:
            - *POLDEC
          assert:
            - "HTTP 200"
            - "PricingPolicy.${pol}.status == APPROVED"
            - "PricingPolicy.${pol}.revision_number == 1"
            - "PricingPolicy.${pol}.reviewed_by_user_id == 'counsel-1'"
            - "PricingPolicy.${pol}.version == 3"
            - "PricingPolicy.${pol}.effective_from == null"

      - name: policy_approved_to_published_sets_effective_from_and_publisher
        claim_type: valid_transition
        grounds: ["state_machines.PricingPolicy.transitions.APPROVED_to_PUBLISHED"]
        distinguishing_aspect: "publish records effective_from exactly as submitted (2026-08-01T00:00:00Z, equal to the clock, which satisfies the >= now precondition at the boundary) and stamps published_by_user_id."
        test_recipe:
          setup: ["Policy MAP-2026-A in APPROVED at version 3; clock at 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
          trigger:
            - *POLPUB
          assert:
            - "HTTP 200"
            - "PricingPolicy.${pol}.status == PUBLISHED"
            - "PricingPolicy.${pol}.effective_from == '2026-08-01T00:00:00.000Z'"
            - "PricingPolicy.${pol}.published_by_user_id == 'counsel-1'"
            - "PricingPolicy.${pol}.version == 4"

      - name: policy_published_to_withdrawn_does_not_cascade_to_products
        claim_type: valid_transition
        grounds: ["state_machines.PricingPolicy.transitions.PUBLISHED_to_WITHDRAWN"]
        distinguishing_aspect: "withdraw reaches the terminal WITHDRAWN state and stores withdrawn_reason, yet the product that names it keeps governing_policy_id and its own version unchanged."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; product SKU-AUDIO-1 created under it at version 1."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
          trigger:
            - call: "POST /pricing-policies/${pol}/withdraw"
              payload: { withdrawn_reason: "Counsel pulled the program pending review" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
          assert:
            - "HTTP 200"
            - "PricingPolicy.${pol}.status == WITHDRAWN"
            - "PricingPolicy.${pol}.withdrawn_reason == 'Counsel pulled the program pending review'"
            - "PricingPolicy.${pol}.superseded_by_policy_id == null"
            - "Product.${prod}.governing_policy_id == ${pol}"
            - "Product.${prod}.version == 1"

      - name: policy_published_to_superseded_when_a_second_policy_publishes
        claim_type: valid_transition
        grounds: ["state_machines.PricingPolicy.transitions.PUBLISHED_to_SUPERSEDED"]
        distinguishing_aspect: "The PUBLISHED -> SUPERSEDED edge has no endpoint of its own: publishing a second policy under the same policy_code flips the incumbent to SUPERSEDED and back-links superseded_by_policy_id, leaving exactly one PUBLISHED row."
        test_recipe:
          setup: ["Policy P1 (MAP-2026-A) PUBLISHED with effective_from 2026-08-01; a second policy P2 under the same policy_code sitting in APPROVED."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - &POL2NEW
              call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-A" }
              as: BrandChannelManager
              captures: { pol2: $.data.id }
            - &POL2SUB
              call: "POST /pricing-policies/${pol2}/submit-review"
              payload: {}
              as: BrandChannelManager
            - &POL2DEC
              call: "POST /pricing-policies/${pol2}/review-decision"
              payload: { decision: "APPROVE_FOR_PUBLICATION" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
          trigger:
            - &POL2PUB
              call: "POST /pricing-policies/${pol2}/publish"
              payload: { effective_from: "2026-08-15T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
          assert:
            - "HTTP 200"
            - "PricingPolicy.${pol2}.status == PUBLISHED"
            - "PricingPolicy.${pol}.status == SUPERSEDED"
            - "PricingPolicy.${pol}.superseded_by_policy_id == ${pol2}"
            - "PricingPolicy.${pol}.version == 5"
            - "GET /pricing-policies?status=PUBLISHED returns total_count == 1"

      # --- ResellerAgreement (6 transitions) --------------------------------
      - name: agreement_draft_to_sent_pushes_reseller_to_pending_agreement
        claim_type: valid_transition
        grounds: ["state_machines.ResellerAgreement.transitions.DRAFT_to_SENT"]
        distinguishing_aspect: "send stamps sent_at from the clock and simultaneously advances the Reseller authorization axis APPLIED -> PENDING_AGREEMENT, leaving the supply axis at HOLD/PENDING_AUTHORIZATION."
        test_recipe:
          setup: ["Policy PUBLISHED, reseller Acme APPLIED, agreement in DRAFT."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
          trigger:
            - *AGRSEND
          assert:
            - "HTTP 200"
            - "ResellerAgreement.${agr}.status == SENT"
            - "ResellerAgreement.${agr}.sent_at == '2026-08-01T00:00:00.000Z'"
            - "Reseller.${res}.authorization_status == PENDING_AGREEMENT"
            - "Reseller.${res}.supply_status == HOLD"
            - "Reseller.${res}.hold_reason == PENDING_AUTHORIZATION"
            - "Reseller.${res}.version == 2"

      - name: agreement_sent_to_countersigned_leaves_reseller_axes_untouched
        claim_type: valid_transition
        grounds: ["state_machines.ResellerAgreement.transitions.SENT_to_COUNTERSIGNED"]
        distinguishing_aspect: "Fork branch A: COUNTERSIGN sets countersigned_at / countersigned_by_user_id / non_negotiation_acknowledged and deliberately makes NO Reseller field change (version stays 2)."
        test_recipe:
          setup: ["Agreement in SENT; reseller Acme PENDING_AGREEMENT at version 2."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
          trigger:
            - *AGRSIGN
          assert:
            - "HTTP 200"
            - "ResellerAgreement.${agr}.status == COUNTERSIGNED"
            - "ResellerAgreement.${agr}.countersigned_at == '2026-08-01T00:00:00.000Z'"
            - "ResellerAgreement.${agr}.non_negotiation_acknowledged == true"
            - "Reseller.${res}.authorization_status == PENDING_AGREEMENT"
            - "Reseller.${res}.version == 2"

      - name: agreement_sent_to_declined_rolls_reseller_back_to_applied
        claim_type: valid_transition
        grounds: ["state_machines.ResellerAgreement.transitions.SENT_to_DECLINED"]
        distinguishing_aspect: "Fork branch B from the same SENT state runs a divergent side-effect set: the reseller is rolled back to APPLIED / HOLD / PENDING_AUTHORIZATION (version 3) instead of being left at PENDING_AGREEMENT."
        test_recipe:
          setup: ["Agreement in SENT; reseller Acme PENDING_AGREEMENT at version 2."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
          trigger:
            - call: "POST /reseller-agreements/${agr}/respond"
              payload: { decision: "DECLINE", decline_reason: "Terms not commercially viable" }
              as: Reseller
              as_user_id: "${res}"
          assert:
            - "HTTP 200"
            - "ResellerAgreement.${agr}.status == DECLINED"
            - "ResellerAgreement.${agr}.closed_reason == 'Terms not commercially viable'"
            - "ResellerAgreement.${agr}.countersigned_at == null"
            - "Reseller.${res}.authorization_status == APPLIED"
            - "Reseller.${res}.supply_status == HOLD"
            - "Reseller.${res}.hold_reason == PENDING_AUTHORIZATION"
            - "Reseller.${res}.version == 3"

      - name: agreement_countersigned_to_active_opens_both_reseller_axes
        claim_type: valid_transition
        grounds: ["state_machines.ResellerAgreement.transitions.COUNTERSIGNED_to_ACTIVE"]
        distinguishing_aspect: "activate is the only edge that moves BOTH reseller axes at once: authorization_status AUTHORIZED and supply_status OPEN with hold_reason NONE."
        test_recipe:
          setup: ["Agreement in COUNTERSIGNED with non_negotiation_acknowledged true; reseller PENDING_AGREEMENT at version 2."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
          trigger:
            - *AGRACT
          assert:
            - "HTTP 200"
            - "ResellerAgreement.${agr}.status == ACTIVE"
            - "ResellerAgreement.${agr}.activated_at == '2026-08-01T00:00:00.000Z'"
            - "Reseller.${res}.authorization_status == AUTHORIZED"
            - "Reseller.${res}.supply_status == OPEN"
            - "Reseller.${res}.hold_reason == NONE"
            - "Reseller.${res}.version == 3"

      - name: agreement_active_to_expired_holds_supply_axis_only
        claim_type: valid_transition
        grounds: ["state_machines.ResellerAgreement.transitions.ACTIVE_to_EXPIRED"]
        distinguishing_aspect: "Sweeping past term_ends_at 2027-06-30 expires the agreement and pushes supply_status to HOLD/AGREEMENT_EXPIRED while authorization_status deliberately stays AUTHORIZED — the parallel-axis independence claim."
        test_recipe:
          setup: ["Agreement ACTIVE with term_ends_at 2027-06-30T00:00:00Z; clock advanced to 2027-07-01T00:00:00Z."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &SWEEP
              call: "POST /enforcement-sweeps"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { swept: $.data.swept_at, expagr: $.data.expired_agreements }
          assert:
            - "HTTP 200"
            - "${swept} == '2027-07-01T00:00:00.000Z'"
            - "${expagr} == 1"
            - "ResellerAgreement.${agr}.status == EXPIRED"
            - "ResellerAgreement.${agr}.closed_reason == 'TERM_EXPIRED'"
            - "Reseller.${res}.authorization_status == AUTHORIZED"
            - "Reseller.${res}.supply_status == HOLD"
            - "Reseller.${res}.hold_reason == AGREEMENT_EXPIRED"

      - name: agreement_active_to_terminated_recalls_shipped_serial_units
        claim_type: valid_transition
        grounds: ["state_machines.ResellerAgreement.transitions.ACTIVE_to_TERMINATED", "state_machines.SerialUnit.transitions.SHIPPED_TO_RESELLER_to_RECALLED"]
        distinguishing_aspect: "The four-link cascade: a TERMINATION notice terminates the reseller, which terminates the ACTIVE agreement with closed_reason SUPPLY_TERMINATED, which in turn recalls the reseller's SHIPPED_TO_RESELLER serial unit."
        test_recipe:
          setup: ["Reseller Acme AUTHORIZED with serial SN-0002 shipped downstream to it; ladder driven to TERMINATION via violations of 3, 11 and 5 points (cumulative 19 >= termination_points_threshold 12)."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - &DISTNW
              call: "POST /distributors"
              payload: { legal_name: "Northwind Distribution", annual_chargeback_cap_cents: 500000 }
              as: BrandChannelManager
              captures: { dist: $.data.id }
            - &SU0002
              call: "POST /serial-units"
              payload: { serial_number: "SN-0002", product_id: "${prod}", lot_code: "LOT-A", shipped_distributor_id: "${dist}" }
              as: BrandChannelManager
              captures: { su2: $.data.id }
            - &SU0002SHIP
              call: "POST /serial-units/${su2}/ship-downstream"
              payload: { downstream_reseller_id: "${res}" }
              as: Distributor
              as_user_id: "${dist}"
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - &OBS9000
              call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "MARKETPLACE", seller_display_name: "Acme Store", listing_url: "https://mkt.example/l/2", listed_price_cents: 9000, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef", matched_reseller_id: "${res}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs2: $.data.id }
            - &OBSEVAL2
              call: "POST /price-observations/${obs2}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { vio2: $.data.violation_id, pp2: $.data.provisional_points }
            - &GETRESV2
              call: "GET /resellers/${res}"
              payload: {}
              as: BrandChannelManager
              captures: { rv2: $.data.version }
            - &NOTICE2SUSP
              call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio2}", delivery_channel: "EMAIL", rung: "SUSPENSION", suspension_starts_at: "2026-09-01T00:00:00Z", suspension_ends_at: "2026-09-10T00:00:00Z", expected_reseller_version: "${rv2}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { not2: $.data.id }
            - &OBS14000C
              call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "MARKETPLACE", seller_display_name: "Acme Store", listing_url: "https://mkt.example/l/3", listed_price_cents: 14000, observed_at: "2026-08-19T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b", matched_reseller_id: "${res}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs3: $.data.id }
            - &OBSEVAL3
              call: "POST /price-observations/${obs3}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { vio3: $.data.violation_id }
            - &GETRESV3
              call: "GET /resellers/${res}"
              payload: {}
              as: BrandLegalCounsel
              captures: { rv3: $.data.version }
          trigger:
            - &NOTICE3TERM
              call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio3}", delivery_channel: "CERTIFIED_MAIL", rung: "TERMINATION", expected_reseller_version: "${rv3}" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { not3: $.data.id }
          assert:
            - "HTTP 201"
            - "EnforcementNotice.${not3}.rung == TERMINATION"
            - "Reseller.${res}.authorization_status == TERMINATED"
            - "Reseller.${res}.supply_status == CUT_OFF"
            - "Reseller.${res}.hold_reason == TERMINATION"
            - "ResellerAgreement.${agr}.status == TERMINATED"
            - "ResellerAgreement.${agr}.closed_reason == 'SUPPLY_TERMINATED'"
            - "SerialUnit.${su2}.status == RECALLED"

      # --- Reseller, parallel machine (8 transitions) -----------------------
      - name: reseller_authorization_axis_applied_to_pending_agreement
        claim_type: valid_transition
        grounds: ["state_machines.Reseller.transitions.APPLIED_to_PENDING_AGREEMENT"]
        distinguishing_aspect: "The authorization axis is driven only by agreement events: POST .../send is what moves APPLIED -> PENDING_AGREEMENT, and there is no reseller-side endpoint that does so."
        test_recipe:
          setup: ["Reseller Acme APPLIED at version 1 with an agreement in DRAFT."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
          trigger:
            - *AGRSEND
          assert:
            - "Reseller.${res}.authorization_status == PENDING_AGREEMENT"
            - "Reseller.${res}.version == 2"
            - "Reseller.${res}.supply_status == HOLD"

      - name: reseller_authorization_axis_pending_agreement_to_authorized
        claim_type: valid_transition
        grounds: ["state_machines.Reseller.transitions.PENDING_AGREEMENT_to_AUTHORIZED"]
        distinguishing_aspect: "activate requires the agreement to already be COUNTERSIGNED; on success the authorization axis reaches AUTHORIZED and the supply axis is released to OPEN/NONE in the same version bump."
        test_recipe:
          setup: ["Agreement COUNTERSIGNED; reseller PENDING_AGREEMENT / HOLD at version 2."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
          trigger:
            - *AGRACT
          assert:
            - "Reseller.${res}.authorization_status == AUTHORIZED"
            - "Reseller.${res}.supply_status == OPEN"
            - "Reseller.${res}.hold_reason == NONE"
            - "Reseller.${res}.version == 3"

      - name: reseller_authorization_axis_authorized_to_suspended_sets_window
        claim_type: valid_transition
        grounds: ["state_machines.Reseller.transitions.AUTHORIZED_to_SUSPENDED", "calculations.ladder_rung_selection"]
        distinguishing_aspect: "A SUSPENSION notice (cumulative 14 points >= suspension_points_threshold 6) drives AUTHORIZED -> SUSPENDED, forces supply_status HOLD/SUSPENSION and copies the notice's suspension_ends_at onto the reseller."
        test_recipe:
          setup: ["Reseller Acme AUTHORIZED with one WARNING notice (3 points) already issued and violation V2 DETECTED at provisional 11 points."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
          trigger:
            - *NOTICE2SUSP
          assert:
            - "HTTP 201"
            - "EnforcementNotice.${not2}.rung == SUSPENSION"
            - "EnforcementNotice.${not2}.assessed_points == 11"
            - "EnforcementNotice.${not2}.cumulative_points_at_issue == 14"
            - "Reseller.${res}.authorization_status == SUSPENDED"
            - "Reseller.${res}.supply_status == HOLD"
            - "Reseller.${res}.hold_reason == SUSPENSION"
            - "Reseller.${res}.suspension_ends_at == '2026-09-10T00:00:00.000Z'"

      - name: reseller_suspended_to_authorized_by_sweep_satisfies_the_notice
        claim_type: valid_transition
        grounds: ["state_machines.Reseller.transitions.SUSPENDED_to_AUTHORIZED_by_sweep"]
        distinguishing_aspect: "Sweeping at 2026-09-11 (after suspension_ends_at 2026-09-10) reinstates both axes, moves suspension_ends_at into last_suspension_ended_at, and closes the governing notice as SATISFIED — the points stay in the ledger."
        test_recipe:
          setup: ["Reseller Acme SUSPENDED with suspension_ends_at 2026-09-10 and violation_points_total 14; clock advanced past the window."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
            - *NOTICE2SUSP
            - &CLK0911
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &SWEEPBCM
              call: "POST /enforcement-sweeps"
              payload: {}
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { reins: $.data.reinstated_resellers }
          assert:
            - "HTTP 200"
            - "${reins} == 1"
            - "Reseller.${res}.authorization_status == AUTHORIZED"
            - "Reseller.${res}.supply_status == OPEN"
            - "Reseller.${res}.hold_reason == NONE"
            - "Reseller.${res}.suspension_ends_at == null"
            - "Reseller.${res}.last_suspension_ended_at == '2026-09-10T00:00:00.000Z'"
            - "EnforcementNotice.${not2}.status == SATISFIED"
            - "EnforcementNotice.${not2}.closed_reason == 'SUSPENSION_SERVED'"
            - "Reseller.${res}.violation_points_total == 14"

      - name: reseller_suspended_to_authorized_by_rescission_reverses_points
        claim_type: valid_transition
        grounds: ["state_machines.Reseller.transitions.SUSPENDED_to_AUTHORIZED_by_rescind", "calculations.reseller_points_ledger"]
        distinguishing_aspect: "Rescinding the governing SUSPENSION notice also reinstates the reseller, but unlike the sweep path it decrements violation_points_total by the notice's 11 points (14 -> 3) and stamps last_suspension_ended_at with the clock, not the window end."
        test_recipe:
          setup: ["Reseller Acme SUSPENDED at 14 points via notice2 (11 points); clock still 2026-08-20T00:00:00Z."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
            - *NOTICE2SUSP
          trigger:
            - call: "POST /enforcement-notices/${not2}/rescind"
              payload: { rescinded_reason: "Evidence chain defective" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
          assert:
            - "HTTP 200"
            - "EnforcementNotice.${not2}.status == RESCINDED"
            - "EnforcementNotice.${not2}.closed_reason == 'Evidence chain defective'"
            - "Reseller.${res}.authorization_status == AUTHORIZED"
            - "Reseller.${res}.supply_status == OPEN"
            - "Reseller.${res}.hold_reason == NONE"
            - "Reseller.${res}.suspension_ends_at == null"
            - "Reseller.${res}.last_suspension_ended_at == '2026-08-20T00:00:00.000Z'"
            - "Reseller.${res}.violation_points_total == 3"
            - "Violation.${vio2}.status == DETECTED"
            - "Violation.${vio2}.assessed_points == null"

      - name: reseller_authorized_or_suspended_to_terminated_closes_open_violations
        claim_type: valid_transition
        grounds: ["state_machines.Reseller.transitions.AUTHORIZED_or_SUSPENDED_to_TERMINATED", "state_machines.Violation.transitions.to_CLOSED_MOOT"]
        distinguishing_aspect: "Termination from SUSPENDED clears suspension_ends_at, stamps terminated_at, and mooting the still-open violations keeps their assessed_points in the ledger (total stays 19)."
        test_recipe:
          setup: ["Reseller Acme SUSPENDED at 14 points; violation V3 DETECTED at 5 provisional points; TERMINATION issued by a counsel user distinct from the SUSPENSION issuer bcm-1."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
            - *NOTICE2SUSP
            - *OBS14000C
            - *OBSEVAL3
            - *GETRESV3
          trigger:
            - *NOTICE3TERM
          assert:
            - "HTTP 201"
            - "Reseller.${res}.authorization_status == TERMINATED"
            - "Reseller.${res}.supply_status == CUT_OFF"
            - "Reseller.${res}.hold_reason == TERMINATION"
            - "Reseller.${res}.terminated_at == '2026-08-20T00:00:00.000Z'"
            - "Reseller.${res}.suspension_ends_at == null"
            - "Violation.${vio}.status == CLOSED_MOOT"
            - "Violation.${vio}.resolution_reason == 'RESELLER_TERMINATED'"
            - "Violation.${vio2}.status == CLOSED_MOOT"
            - "Violation.${vio3}.status == NOTICED"
            - "Reseller.${res}.violation_points_total == 19"

      - name: reseller_supply_axis_open_to_hold_leaves_authorization_alone
        claim_type: valid_transition
        grounds: ["state_machines.Reseller.transitions.OPEN_to_HOLD"]
        distinguishing_aspect: "A quality-obligation hold moves only the supply axis: supply_status HOLD with hold_reason QUALITY_OBLIGATION while authorization_status stays AUTHORIZED."
        test_recipe:
          setup: ["Reseller Acme AUTHORIZED / OPEN at version 3."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
