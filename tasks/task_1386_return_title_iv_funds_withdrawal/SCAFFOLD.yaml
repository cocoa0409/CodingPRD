# =============================================================================
# SCAFFOLD — Return of Title IV Funds & Withdrawal Processing (university R2T4 office)
# =============================================================================

scenario: |
  Return of Title IV Funds & Withdrawal Processing (university R2T4 office): withdrawal date determination (official/unofficial), percentage-of-period-completed calculation, aid earned vs disbursed & return responsibility split, post-withdrawal disbursement offer, 45-day return deadline & tracking, institutional refund policy interaction, student balance creation & notification, attendance-taking requirement compliance

domain_name: return-title-iv-withdrawal
api_prefix: /r2t4

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation      # official vs unofficial withdrawal-date basis; TIERED vs PRO_RATA refund
    - cascading_side_effects        # calculate -> obligations -> ledger entries -> balance -> notification
    - optimistic_concurrency        # OCC on WithdrawalCase.version for recalculate
    - rate_threshold_triggers       # 60% earned cap, 45-day deadline, 14-day offer window, 30-day late-offer flag
  entity_topology: flat             # peer entities joined by foreign keys; no deep URL nesting
  state_machine_shape: branching    # WithdrawalCase forks (return path vs PWD path) and loops (recalculate)
  relationship_patterns:
    - one_to_many                   # Term->Break, Enrollment->Award/Entry, Award->Disbursement, Case->Obligation/Offer
    - cross_aggregate               # Disbursement gating reads WithdrawalCase of the same Enrollment
    - self_referential              # StudentAccountEntry.reversal_of_entry_id (append-only ledger compensation)
  role_model: segregation_of_duties # the officer who calculated a case may not record its SCHOOL return
  consistency_model: immediate      # every mutation + cascade is visible in the same request's response

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AcademicTerm
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Term label (e.g., 'Fall 2026')" }
      - { name: start_date, type: string, source: input, description: "First day of payment period, ISO date YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Last day of payment period, ISO date; must be strictly after start_date" }
      - { name: attendance_taking_required, type: boolean, source: input, default: false, description: "When true, unofficial withdrawals use last_attendance_date instead of the period midpoint" }
      - { name: refund_method, type: enum, source: input, default: "TIERED", description: "TIERED | PRO_RATA — selects institutional_refund variant", constraints: "enum {TIERED, PRO_RATA}" }
      - { name: refund_schedule, type: array, source: input, default: "[{through_day: 7, refund_pct: 1.0}, {through_day: 14, refund_pct: 0.75}, {through_day: 28, refund_pct: 0.5}]", description: "TIERED schedule: ordered tiers; first tier with completed_days <= through_day wins; beyond last tier refund is 0" }
      - { name: calendar_days, type: integer, source: computed, description: "end_date - start_date + 1" }
      - { name: deductible_break_days, type: integer, source: computed, description: "Sum of deductible ScheduledBreak group spans (see term_day_counts)" }
      - { name: total_days, type: integer, source: computed, description: "calendar_days - deductible_break_days; denominator of percentage_completed" }

  - name: ScheduledBreak
    parent: AcademicTerm
    common_fields: false
    fields:
      - { name: term_id, type: string, source: system, description: "FK -> AcademicTerm.id" }
      - { name: start_date, type: string, source: input, description: "First break day, ISO date; must lie inside parent term" }
      - { name: end_date, type: string, source: input, description: "Last break day, ISO date; >= start_date; must lie inside parent term" }
      - { name: length_days, type: integer, source: computed, description: "end_date - start_date + 1" }
      - { name: deductible_days, type: integer, source: computed, description: "Merged-group span attributed to the group's earliest break when the group span >= 5 days; otherwise 0 (see term_day_counts)" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: external_ref, type: string, source: input, description: "SIS reference" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: email, type: string, source: input, description: "Notification email" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; from path" }
      - { name: term_id, type: string, source: input, description: "FK -> AcademicTerm.id" }
      - { name: institutional_charges_cents, type: integer, source: input, description: "Gross institutional charges for the period; >= 0" }
      - { name: status, type: enum, source: system, description: "ENROLLED | WITHDRAWN | COMPLETED", constraints: "enum {ENROLLED, WITHDRAWN, COMPLETED}" }
      - { name: balance_cents, type: integer, source: computed, description: "Sum of signed StudentAccountEntry.amount_cents; positive = student owes school" }
      - { name: balance_notification_sent, type: boolean, source: system, default: false, description: "True once a balance-due notification has been emitted while a case is CALCULATED; reset by rescind" }
      - { name: balance_notified_at, type: datetime, source: system, description: "When the balance notification was emitted; null if never" }
      - { name: current_withdrawal_case_id, type: string, source: computed, description: "Id of the WithdrawalCase in OPEN or CALCULATED for this enrollment; null otherwise" }

  - name: AidAward
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; from path" }
      - { name: program, type: enum, source: input, description: "PELL_GRANT | SUBSIDIZED_LOAN | UNSUBSIDIZED_LOAN | PLUS_LOAN", constraints: "enum {PELL_GRANT, SUBSIDIZED_LOAN, UNSUBSIDIZED_LOAN, PLUS_LOAN}" }
      - { name: amount_cents, type: integer, source: input, description: "Awarded amount for the period; > 0" }
      - { name: is_grant, type: boolean, source: computed, description: "program == PELL_GRANT" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | CANCELLED; PELL_GRANT starts ACCEPTED, loans start OFFERED", constraints: "enum {OFFERED, ACCEPTED, CANCELLED}" }
      - { name: disbursed_amount_cents, type: integer, source: computed, description: "Sum of DISBURSED AidDisbursement.amount_cents for this award" }
      - { name: scheduled_amount_cents, type: integer, source: computed, description: "Sum of SCHEDULED AidDisbursement.amount_cents for this award" }

  - name: AidDisbursement
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> AidAward.id; from path at creation, or set by PWD-accept cascade" }
      - { name: pwd_offer_id, type: string, source: system, description: "FK -> PostWithdrawalOffer.id; null unless created by offer acceptance" }
      - { name: amount_cents, type: integer, source: input, description: "Disbursement amount; > 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DISBURSED | CANCELLED", constraints: "enum {SCHEDULED, DISBURSED, CANCELLED}" }
      - { name: disbursed_on, type: string, source: system, description: "Logical date when DISBURSED; null while SCHEDULED/CANCELLED" }

  - name: WithdrawalCase
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; at most one case in OPEN/CALCULATED/CLOSED per enrollment (successor allowed only after CANCELLED)" }
      - { name: withdrawal_type, type: enum, source: input, description: "OFFICIAL | UNOFFICIAL", constraints: "enum {OFFICIAL, UNOFFICIAL}" }
      - { name: notification_date, type: string, source: input, description: "Date student began official withdrawal; required when withdrawal_type == OFFICIAL" }
      - { name: last_attendance_date, type: string, source: input, description: "Last date of attendance; required when UNOFFICIAL and term.attendance_taking_required" }
      - { name: withdrawal_date, type: string, source: computed, description: "Determined per withdrawal_date_determination (notification date | last attendance | midpoint)" }
      - { name: determination_date, type: string, source: computed, description: "OFFICIAL: notification_date; UNOFFICIAL: logical date the withdraw call is processed" }
      - { name: total_days, type: integer, source: computed, description: "Snapshot of term.total_days at withdraw time" }
      - { name: completed_days, type: integer, source: computed, description: "Days from term start through withdrawal_date, minus deductible break days in that range" }
      - { name: percentage_completed, type: number, source: computed, description: "completed_days / total_days, 3 decimal places round_half_up" }
      - { name: earned_pct, type: number, source: computed, description: "1.000 when percentage_completed > 0.600, else percentage_completed" }
      - { name: aid_disbursable_cents, type: integer, source: computed, description: "Sum over ACCEPTED awards of (disbursed + SCHEDULED) at calculate time; null until CALCULATED" }
      - { name: aid_disbursed_cents, type: integer, source: computed, description: "Sum of DISBURSED disbursements at calculate time; null until CALCULATED" }
      - { name: aid_earned_cents, type: integer, source: computed, description: "Per-award round-then-sum of disbursable * earned_pct; null until CALCULATED" }
      - { name: aid_unearned_cents, type: integer, source: computed, description: "aid_disbursable_cents - aid_earned_cents" }
      - { name: return_amount_cents, type: integer, source: computed, description: "max(0, aid_disbursed_cents - aid_earned_cents); 0 on PWD path" }
      - { name: school_return_cents, type: integer, source: computed, description: "min(round_half_up(institutional_charges_cents * unearned_pct), return_amount_cents)" }
      - { name: student_grant_return_cents, type: integer, source: computed, description: "Student grant obligation after 50% protection (see return_responsibility_split)" }
      - { name: student_loan_deferred_cents, type: integer, source: computed, description: "Student share routed to normal loan repayment; informational, no obligation created" }
      - { name: pwd_grant_cents, type: integer, source: computed, description: "Grant post-withdrawal disbursement auto-credited at calculate" }
      - { name: pwd_loan_cents, type: integer, source: computed, description: "Loan post-withdrawal disbursement offered via PostWithdrawalOffer rows" }
      - { name: status, type: enum, source: system, description: "OPEN | CALCULATED | CLOSED | CANCELLED", constraints: "enum {OPEN, CALCULATED, CLOSED, CANCELLED}" }
      - { name: calculated_by_user_id, type: string, source: system, description: "X-User-ID of the FinancialAidOfficer who last calculated; drives segregation-of-duties" }
      - { name: calculated_at, type: datetime, source: system, description: "Logical timestamp of last calculation" }

  - name: ReturnObligation
    parent: null
    common_fields: true
    fields:
      - { name: withdrawal_case_id, type: string, source: system, description: "FK -> WithdrawalCase.id" }
      - { name: party, type: enum, source: system, description: "SCHOOL | STUDENT", constraints: "enum {SCHOOL, STUDENT}" }
      - { name: amount_cents, type: integer, source: system, description: "Amount that must be returned; obligations with amount 0 are never created" }
      - { name: due_date, type: string, source: computed, description: "determination_date + 45 calendar days" }
      - { name: status, type: enum, source: system, description: "PENDING | OVERDUE | RETURNED | VOIDED", constraints: "enum {PENDING, OVERDUE, RETURNED, VOIDED}" }
      - { name: returned_at, type: datetime, source: system, description: "When the return was recorded; null until RETURNED" }
      - { name: returned_amount_cents, type: integer, source: system, description: "Amount recorded; must equal amount_cents" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID that recorded the return" }

  - name: PostWithdrawalOffer
    parent: null
    common_fields: true
    fields:
      - { name: withdrawal_case_id, type: string, source: system, description: "FK -> WithdrawalCase.id" }
      - { name: award_id, type: string, source: system, description: "FK -> AidAward.id; the loan award this offer disburses against" }
      - { name: amount_cents, type: integer, source: system, description: "Loan PWD amount offered (per-award earned minus per-award disbursed)" }
      - { name: offered_at, type: datetime, source: system, description: "Logical timestamp the offer was created (at calculate)" }
      - { name: response_deadline, type: string, source: computed, description: "date(offered_at) + 14 calendar days; acceptance allowed while current date <= response_deadline" }
      - { name: late_offer, type: boolean, source: computed, description: "true when date(offered_at) > determination_date + 30 calendar days (30-day offer rule violated)" }
      - { name: status, type: enum, source: system, description: "SENT | ACCEPTED | DECLINED | EXPIRED | VOIDED", constraints: "enum {SENT, ACCEPTED, DECLINED, EXPIRED, VOIDED}" }
      - { name: responded_at, type: datetime, source: system, description: "When ACCEPTED/DECLINED; null otherwise" }

  - name: StudentAccountEntry
    parent: null
    common_fields: false
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: entry_type, type: enum, source: system, description: "CHARGE | REFUND_CREDIT | R2T4_CHARGEBACK | AID_CREDIT | PAYMENT | REVERSAL", constraints: "enum {CHARGE, REFUND_CREDIT, R2T4_CHARGEBACK, AID_CREDIT, PAYMENT, REVERSAL}" }
      - { name: amount_cents, type: integer, source: system, description: "Signed: CHARGE/R2T4_CHARGEBACK positive; REFUND_CREDIT/AID_CREDIT/PAYMENT negative; REVERSAL = negation of the reversed entry" }
      - { name: reversal_of_entry_id, type: string, source: system, description: "FK -> StudentAccountEntry.id; set only on REVERSAL entries, null otherwise" }
      - { name: source_ref, type: string, source: system, description: "Originating artifact id (disbursement, obligation, or case id); empty for CHARGE/PAYMENT" }
      - { name: posted_at, type: datetime, source: system, description: "Logical timestamp of posting" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Enrollment
    initial_state: ENROLLED
    terminal_states: [COMPLETED]
    transitions:
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /r2t4/enrollments/{id}/withdraw"
        actor: RegistrarClerk | Student
        preconditions:
          - "status == ENROLLED (WITHDRAWN -> ERR_ENROLLMENT_ALREADY_WITHDRAWN; COMPLETED -> ERR_INVALID_STATE)"
          - "Student role: enrollment.student_id == X-User-ID (ERR_OWNERSHIP_MISMATCH) and withdrawal_type must be OFFICIAL (UNOFFICIAL by Student -> ERR_FORBIDDEN_FOR_ROLE)"
          - "OFFICIAL requires notification_date in payload (ERR_INVALID_REQUEST)"
          - "UNOFFICIAL on a term with attendance_taking_required == true requires last_attendance_date (ERR_ATTENDANCE_DATE_REQUIRED)"
          - "Every supplied date must lie inside [term.start_date, term.end_date] (ERR_DATE_OUT_OF_PERIOD)"
        side_effects:
          - "Create WithdrawalCase (status OPEN) with withdrawal_date / determination_date / completed_days / percentage_completed computed"
          - "enrollment.current_withdrawal_case_id = new case id"
          - "increments Enrollment.version by 1"

      - from: WITHDRAWN
        to: ENROLLED
        trigger: "POST /r2t4/enrollments/{id}/rescind-withdrawal"
        actor: RegistrarClerk
        preconditions:
          - "status == WITHDRAWN (else ERR_ENROLLMENT_NOT_WITHDRAWN)"
          - "Linked case must be OPEN or CALCULATED (CLOSED -> ERR_INVALID_STATE)"
          - "No RETURNED ReturnObligation on the case (ERR_RETURN_ALREADY_COMPLETED)"
          - "No ACCEPTED PostWithdrawalOffer on the case (ERR_OFFER_ALREADY_ACCEPTED)"
        side_effects:
          - "WithdrawalCase -> CANCELLED"
          - "PENDING/OVERDUE obligations -> VOIDED; SENT offers -> VOIDED"
          - "Post REVERSAL entries negating every REFUND_CREDIT and R2T4_CHARGEBACK entry of the case"
          - "Recompute balance_cents; reset balance_notification_sent=false, balance_notified_at=null"
          - "Clear current_withdrawal_case_id; increments Enrollment.version by 1"

      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /r2t4/enrollments/{id}/complete"
        actor: RegistrarClerk
        preconditions:
          - "status == ENROLLED (else ERR_INVALID_STATE)"
          - "current logical date > term.end_date (ERR_TERM_NOT_ENDED)"
        side_effects:
          - "All SCHEDULED AidDisbursements of this enrollment's awards -> CANCELLED"
          - "increments Enrollment.version by 1"

  - entity: WithdrawalCase
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: CALCULATED
        trigger: "POST /r2t4/withdrawal-cases/{id}/calculate"
        actor: FinancialAidOfficer
        preconditions:
          - "status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "Run r2t4_earned_unearned: snapshot aid_disbursable_cents / aid_disbursed_cents / aid_earned_cents / aid_unearned_cents"
          - "Cancel all remaining SCHEDULED disbursements of the enrollment's awards"
          - "Return path (earned < disbursed): create ReturnObligation(party=SCHOOL, school_return_cents) when > 0 and ReturnObligation(party=STUDENT, student_grant_return_cents) when > 0, both PENDING with due_date = determination_date + 45"
          - "Each created SCHOOL-party obligation posts StudentAccountEntry(type=R2T4_CHARGEBACK, +school_return_cents, source_ref=obligation id) on the enrollment"
          - "PWD path (earned > disbursed): grant PWD per award auto-posts a DISBURSED AidDisbursement + AID_CREDIT entry; loan PWD per award creates PostWithdrawalOffer(SENT)"
          - "Post StudentAccountEntry(type=REFUND_CREDIT, -institutional_refund) per institutional_refund calculation when amount > 0"
          - "Recompute enrollment.balance_cents; when balance_cents > 0 set balance_notification_sent=true and balance_notified_at=now"
          - "calculated_by_user_id = X-User-ID; calculated_at = now; increments WithdrawalCase.version by 1"
          - "Auto-close evaluation (see CALCULATED -> CLOSED)"

      - from: CALCULATED
        to: CALCULATED
        trigger: "POST /r2t4/withdrawal-cases/{id}/recalculate"
        actor: FinancialAidOfficer
        preconditions:
          - "status == CALCULATED (else ERR_INVALID_STATE)"
          - "expected_withdrawal_case_version == current version (ERR_STALE_VERSION)"
          - "No RETURNED obligation (ERR_RETURN_ALREADY_COMPLETED)"
          - "No ACCEPTED offer (ERR_OFFER_ALREADY_ACCEPTED)"
        side_effects:
          - "Apply payload corrections (notification_date / last_attendance_date / withdrawal_type) and recompute withdrawal_date, completed_days, percentage_completed, earned_pct"
          - "VOID all PENDING/OVERDUE obligations; VOID all SENT offers"
          - "Post REVERSAL entries negating the case's REFUND_CREDIT and R2T4_CHARGEBACK entries"
          - "Re-run the full CALCULATED side-effect chain (snapshots, obligations, chargebacks, PWD, refund, balance, notification)"
          - "calculated_by_user_id = X-User-ID; increments WithdrawalCase.version by 1"
          - "Auto-close evaluation"
        note: "Recalculation loop; identical inputs reproduce identical amounts (aid conservation invariant)"

      - from: CALCULATED
        to: CLOSED
        trigger: "system (auto-evaluated after every mutation touching the case, its obligations, its offers, or the enrollment balance)"
        actor: system
        preconditions:
          - "All ReturnObligations of the case are terminal (RETURNED or VOIDED)"
          - "All PostWithdrawalOffers of the case are terminal (ACCEPTED, DECLINED, EXPIRED, or VOIDED)"
          - "enrollment.balance_cents <= 0 OR enrollment.balance_notification_sent == true"
        side_effects:
          - "Clear enrollment.current_withdrawal_case_id; increments WithdrawalCase.version by 1"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /r2t4/enrollments/{id}/rescind-withdrawal (cascade)"
        actor: RegistrarClerk
        preconditions: ["See Enrollment WITHDRAWN -> ENROLLED"]
        side_effects: ["No financial artifacts existed yet; enrollment reverts"]

      - from: CALCULATED
        to: CANCELLED
        trigger: "POST /r2t4/enrollments/{id}/rescind-withdrawal (cascade)"
        actor: RegistrarClerk
        preconditions: ["See Enrollment WITHDRAWN -> ENROLLED"]
        side_effects:
          - "Obligations VOIDED, offers VOIDED, REVERSAL entries posted, balance recomputed (compensation cascade)"

  - entity: AidAward
    initial_state: "OFFERED (loans) | ACCEPTED (PELL_GRANT)"
    terminal_states: [CANCELLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /r2t4/awards/{id}/accept"
        actor: Student
        preconditions:
          - "status == OFFERED (else ERR_INVALID_STATE)"
          - "award.enrollment.student_id == X-User-ID (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["increments AidAward.version by 1"]

      - from: OFFERED
        to: CANCELLED
        trigger: "POST /r2t4/awards/{id}/cancel"
        actor: FinancialAidOfficer
        preconditions:
          - "No DISBURSED disbursements on the award (ERR_AWARD_HAS_DISBURSEMENTS)"
        side_effects: ["All SCHEDULED disbursements -> CANCELLED"]

      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /r2t4/awards/{id}/cancel"
        actor: FinancialAidOfficer
        preconditions:
          - "No DISBURSED disbursements on the award (ERR_AWARD_HAS_DISBURSEMENTS)"
        side_effects: ["All SCHEDULED disbursements -> CANCELLED"]

  - entity: AidDisbursement
    initial_state: SCHEDULED
    terminal_states: [DISBURSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DISBURSED
        trigger: "POST /r2t4/disbursements/{id}/disburse"
        actor: FinancialAidOfficer
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE)"
          - "award.status == ACCEPTED (ERR_AWARD_NOT_ACCEPTED)"
          - "No WithdrawalCase in OPEN or CALCULATED for the enrollment (ERR_DISBURSEMENT_BLOCKED_BY_CASE); system-created PWD disbursements bypass this gate"
        side_effects:
          - "disbursed_on = current logical date"
          - "award.disbursed_amount_cents += amount_cents; award.scheduled_amount_cents -= amount_cents"
          - "Post StudentAccountEntry(type=AID_CREDIT, -amount_cents, source_ref=disbursement id)"
          - "Recompute enrollment.balance_cents"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (award cancel, enrollment complete, or withdrawal-case calculate cascades)"
        actor: system
        preconditions: []
        side_effects: ["award.scheduled_amount_cents -= amount_cents"]

  - entity: ReturnObligation
    initial_state: PENDING
    terminal_states: [RETURNED, VOIDED]
    transitions:
      - from: PENDING
        to: RETURNED
        trigger: "POST /r2t4/return-obligations/{id}/record-return"
        actor: BursarClerk | FinancialAidOfficer
        preconditions:
          - "status IN {PENDING, OVERDUE} (RETURNED -> ERR_OBLIGATION_ALREADY_RETURNED; VOIDED -> ERR_INVALID_STATE)"
          - "Segregation of duties: when party == SCHOOL and actor role is FinancialAidOfficer, X-User-ID != case.calculated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "amount_cents in payload must equal obligation.amount_cents exactly (ERR_RETURN_AMOUNT_MISMATCH)"
        side_effects:
          - "returned_at = now; returned_amount_cents = amount_cents; recorded_by_user_id = X-User-ID"
          - "Case auto-close evaluation"

      - from: PENDING
        to: OVERDUE
        trigger: "system (sweep on POST /r2t4/_clock/set_current_utc when current logical date > due_date)"
        actor: system
        preconditions: ["status == PENDING", "current logical date > due_date (on due_date itself the obligation stays PENDING)"]
        side_effects: []

      - from: OVERDUE
        to: RETURNED
        trigger: "POST /r2t4/return-obligations/{id}/record-return"
        actor: BursarClerk | FinancialAidOfficer
        preconditions: ["Same as PENDING -> RETURNED"]
        side_effects: ["Same as PENDING -> RETURNED (late return is recorded, status RETURNED)"]

      - from: PENDING
        to: VOIDED
        trigger: "system (recalculate or rescind-withdrawal cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OVERDUE
        to: VOIDED
        trigger: "system (recalculate or rescind-withdrawal cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PostWithdrawalOffer
    initial_state: SENT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, VOIDED]
    transitions:
      - from: SENT
        to: ACCEPTED
        trigger: "POST /r2t4/post-withdrawal-offers/{id}/accept"
        actor: Student
        preconditions:
          - "status == SENT (else ERR_OFFER_NOT_RESPONDABLE)"
          - "offer.case.enrollment.student_id == X-User-ID (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "responded_at = now"
          - "Create AidDisbursement(status=DISBURSED, amount_cents=offer.amount_cents, award_id=offer.award_id, pwd_offer_id=offer.id, disbursed_on=now)"
          - "That disbursement posts StudentAccountEntry(type=AID_CREDIT, -offer.amount_cents) and increments award.disbursed_amount_cents"
          - "Recompute enrollment.balance_cents; notification evaluation; case auto-close evaluation"

      - from: SENT
        to: DECLINED
        trigger: "POST /r2t4/post-withdrawal-offers/{id}/decline"
        actor: Student
        preconditions:
          - "status == SENT (else ERR_OFFER_NOT_RESPONDABLE)"
          - "offer.case.enrollment.student_id == X-User-ID (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["responded_at = now", "Case auto-close evaluation"]

      - from: SENT
        to: EXPIRED
        trigger: "system (sweep on POST /r2t4/_clock/set_current_utc when current logical date > response_deadline)"
        actor: system
        preconditions: ["status == SENT", "current logical date > response_deadline (on the deadline date itself the offer stays SENT)"]
        side_effects: ["Case auto-close evaluation"]

      - from: SENT
        to: VOIDED
        trigger: "system (recalculate or rescind-withdrawal cascade)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: case-recalculate-stale-version
    parent_entity: WithdrawalCase
    write_endpoint: "POST /r2t4/withdrawal-cases/{id}/recalculate"
    occ_field: expected_withdrawal_case_version
    description: |
      Recalculating a WithdrawalCase whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has just recalculated the case (a legitimate superseding correction under
      the CALCULATED -> CALCULATED loop) and the current writer's view of the
      case inputs is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: term_day_counts
    trigger: "AcademicTerm creation; ScheduledBreak creation"
    algorithm: interval_merge
    formula: |
      calendar_days = (end_date - start_date) + 1
      Break groups: sort the term's ScheduledBreaks by start_date ASC, then created_at ASC;
        sweep greedily, merging a break into the current group when
        break.start_date <= group_end + 1 day (adjacent calendar days merge);
        otherwise close the group and start a new one.
      A group's span = (group_end - group_start) + 1.
      A group is deductible iff span >= MIN_DEDUCTIBLE_BREAK_DAYS.
      deductible_break_days = sum of spans over deductible groups.
      The group's earliest break (by start_date, then created_at) carries
        deductible_days = span; every other break in the group carries 0;
        breaks in non-deductible groups carry 0.
      total_days = calendar_days - deductible_break_days
    input_set: "All ScheduledBreaks of the term (no status filter; breaks are immutable)"
    constants:
      MIN_DEDUCTIBLE_BREAK_DAYS: 5
    precision: "integer days"

  - name: withdrawal_date_determination
    trigger: "POST /enrollments/{id}/withdraw; POST /withdrawal-cases/{id}/recalculate"
    algorithm: threshold
    formula: |
      OFFICIAL:    withdrawal_date = notification_date
                   determination_date = notification_date
      UNOFFICIAL and term.attendance_taking_required == true:
                   withdrawal_date = last_attendance_date
                   determination_date = logical date the request is processed
      UNOFFICIAL and term.attendance_taking_required == false:
                   midpoint_day = floor((total_days + 1) / 2)
                   withdrawal_date = term.start_date + (midpoint_day - 1) calendar days
                     (for total_days = 105: day 53; for 100: day 50)
                   determination_date = logical date the request is processed
      completed_days = (withdrawal_date - term.start_date) + 1
                       - deductible group days falling inside [term.start_date, withdrawal_date]
    input_set: "WithdrawalCase inputs; AcademicTerm deductible break groups from term_day_counts"
    precision: "whole calendar days"
    variants:
      - name: official_notification_basis
        when: "withdrawal_type == OFFICIAL"
        difference: "withdrawal_date is the student-supplied notification_date; determination_date equals it"
      - name: unofficial_attendance_basis
        when: "UNOFFICIAL and attendance_taking_required"
        difference: "withdrawal_date is the documented last_attendance_date"
      - name: unofficial_midpoint_basis
        when: "UNOFFICIAL and NOT attendance_taking_required"
        difference: "withdrawal_date is the statutory 50% midpoint; produces a different percentage than either documented-date variant for the same period"

  - name: percentage_completed
    trigger: "withdraw; recalculate"
    algorithm: threshold
    formula: |
      percentage_completed = round_half_up(completed_days / total_days, 3)
      earned_pct = 1.000 if percentage_completed > EARNED_CAP_THRESHOLD else percentage_completed
      unearned_pct = round_half_up(1 - earned_pct, 3)
      Boundary: exactly 0.600 earns 60.0% (cap NOT applied); 0.601 or more earns 100%.
    input_set: "WithdrawalCase.completed_days, WithdrawalCase.total_days"
    constants:
      EARNED_CAP_THRESHOLD: 0.6
      PCT_DECIMALS: 3
    precision: "3 decimal places, round_half_up"

  - name: r2t4_earned_unearned
    trigger: "WithdrawalCase calculate / recalculate"
    algorithm: aggregation
    formula: |
      Eligible awards: enrollment's AidAwards with status == ACCEPTED
        (OFFERED and CANCELLED awards are EXCLUDED from disbursable).
      Per award: award_disbursable = disbursed_amount_cents + scheduled_amount_cents
      Per award: award_earned = round_half_up(award_disbursable * earned_pct)   # ROUND FIRST
      aid_earned_cents      = sum(award_earned)                                  # THEN SUM
      aid_disbursable_cents = sum(award_disbursable)
      aid_disbursed_cents   = sum(disbursed_amount_cents over eligible awards)
      aid_unearned_cents    = aid_disbursable_cents - aid_earned_cents
      Pinned rounding order: round each award to whole cents first, then sum.
      (Sum-then-round is the rejected alternative; e.g. two awards of 100001 at
      earned_pct 0.505 give 50501 + 50501 = 101002, not round(200002 * 0.505) = 101001.)
    input_set: "AidAwards of the enrollment with status == ACCEPTED at calculation time"
    precision: "whole cents, round_half_up per award"

  - name: return_responsibility_split
    trigger: "calculate / recalculate when aid_earned_cents < aid_disbursed_cents"
    algorithm: waterfall_allocation
    formula: |
      return_amount_cents = aid_disbursed_cents - aid_earned_cents
      school_return_cents = min(round_half_up(institutional_charges_cents * unearned_pct),
                                return_amount_cents)
      student_share       = return_amount_cents - school_return_cents
      grant_unearned_disbursed = sum over ACCEPTED grant awards of
                                 max(0, disbursed_amount_cents - award_earned)
      student_grant_base  = min(student_share, grant_unearned_disbursed)
      student_grant_return_cents = round_half_up(student_grant_base * GRANT_PROTECTION_RATE)
      student_loan_deferred_cents = student_share - student_grant_base   # repaid under loan terms; no obligation
      Obligations created: SCHOOL row iff school_return_cents > 0;
                           STUDENT row iff student_grant_return_cents > 0.
      Creation order is fixed: the SCHOOL row is created BEFORE the STUDENT row;
      list endpoints return obligations ordered by created_at ASC, so the SCHOOL
      row (when present) is always index 0.
    input_set: "WithdrawalCase snapshots; enrollment.institutional_charges_cents (gross, pre-refund)"
    constants:
      GRANT_PROTECTION_RATE: 0.5
    precision: "whole cents, round_half_up"

  - name: post_withdrawal_disbursement
    trigger: "calculate / recalculate when aid_earned_cents > aid_disbursed_cents"
    algorithm: waterfall_allocation
    formula: |
      Per eligible award: award_pwd = max(0, award_earned - disbursed_amount_cents)
      Grant awards: award_pwd is disbursed automatically — create a DISBURSED
        AidDisbursement (disbursed_on = current logical date) and post AID_CREDIT.
      Loan awards: award_pwd becomes a PostWithdrawalOffer(SENT); funds move only
        if the student accepts within the response window.
      pwd_grant_cents = sum(grant award_pwd); pwd_loan_cents = sum(loan award_pwd)
      Offers are created in ascending award created_at order; the offers list
      endpoint returns them in that same order (created_at ASC).
      No return obligations are created on this path; earned > disbursed means
      nothing was over-paid.
    input_set: "ACCEPTED awards with award_earned > disbursed_amount_cents"
    precision: "whole cents (per-award amounts already integral from r2t4_earned_unearned)"

  - name: institutional_refund
    trigger: "calculate / recalculate"
    algorithm: tiered_pricing
    formula: |
      Base: refund applies to enrollment.institutional_charges_cents.
      TIERED: pick the first tier of term.refund_schedule with
              completed_days <= tier.through_day; refund_pct = tier.refund_pct;
              if completed_days exceeds every through_day, refund_pct = 0.
      PRO_RATA: refund_pct = 1 - percentage_completed  (uses the case's rounded
                3-decimal percentage_completed, NOT earned_pct; the 60% cap does
                not apply to refunds)
      refund_cents = round_half_up(institutional_charges_cents * refund_pct)
      Posted as StudentAccountEntry(type=REFUND_CREDIT, -refund_cents) when > 0.
    input_set: "WithdrawalCase.completed_days / percentage_completed; AcademicTerm.refund_method / refund_schedule"
    precision: "whole cents, round_half_up"
    variants:
      - name: tiered_schedule
        when: "term.refund_method == TIERED"
        difference: "lookup in configured day-threshold tiers; same withdrawal day yields a step-function refund"
      - name: pro_rata
        when: "term.refund_method == PRO_RATA"
        difference: "continuous 1 - percentage_completed; for the same withdrawal day 11 of a 110-day term with 400000-cent charges, TIERED yields 300000 while PRO_RATA yields 360000"

  - name: student_balance
    trigger: "every StudentAccountEntry posting"
    algorithm: aggregation
    formula: |
      balance_cents = sum(StudentAccountEntry.amount_cents) over all entries of the enrollment
      (CHARGE +, R2T4_CHARGEBACK +, REFUND_CREDIT -, AID_CREDIT -, PAYMENT -, REVERSAL = -reversed amount)
      Notification: when balance_cents is recomputed while a linked case is CALCULATED
      and balance_cents > 0, set balance_notification_sent = true and balance_notified_at = now.
    input_set: "All StudentAccountEntry rows of the enrollment (entries are append-only)"
    precision: "whole cents"

  - name: return_deadline
    trigger: "obligation creation; clock sweep"
    algorithm: threshold
    formula: |
      due_date = determination_date + RETURN_WINDOW_DAYS calendar days
      Sweep (on set_current_utc): obligation in PENDING with current_date > due_date -> OVERDUE
      Boundary: on due_date itself the obligation remains PENDING (deadline is inclusive).
    input_set: "ReturnObligations with status == PENDING"
    constants:
      RETURN_WINDOW_DAYS: 45
    precision: "whole calendar days"

  - name: offer_deadlines
    trigger: "offer creation; clock sweep"
    algorithm: threshold
    formula: |
      response_deadline = date(offered_at) + OFFER_RESPONSE_DAYS calendar days
      late_offer = (date(offered_at) > determination_date + OFFER_CREATION_DAYS)
      Sweep: offer in SENT with current_date > response_deadline -> EXPIRED
      Boundary: acceptance on the response_deadline date itself is allowed (inclusive).
    input_set: "PostWithdrawalOffers with status == SENT"
    constants:
      OFFER_RESPONSE_DAYS: 14
      OFFER_CREATION_DAYS: 30
    precision: "whole calendar days"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is listed for this endpoint (Student may only withdraw OFFICIAL)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Request body well-formed: required fields present, enums valid, types correct; end_date strictly after start_date; amounts positive where required"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_FIELD"
    http_status: "400 / 422"
    applies_to: "all mutating endpoints"

  - priority: 4
    category: existence
    check: "Path and body resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: business_referential
    check: "Student-role ownership: X-User-ID equals the owning enrollment's student_id (withdraw, award accept, offer respond, payment)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "Student-scoped endpoints"

  - priority: 6
    category: state
    check: "Target resource in a valid state for this transition (enrollment ENROLLED/WITHDRAWN, case OPEN/CALCULATED, obligation PENDING/OVERDUE, offer SENT, award OFFERED, disbursement SCHEDULED)"
    error_id: "ERR_INVALID_STATE / ERR_ENROLLMENT_ALREADY_WITHDRAWN / ERR_ENROLLMENT_NOT_WITHDRAWN / ERR_OBLIGATION_ALREADY_RETURNED / ERR_OFFER_NOT_RESPONDABLE"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_withdrawal_case_version equals current WithdrawalCase.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /r2t4/withdrawal-cases/{id}/recalculate"

  - priority: 8
    category: business_temporal
    check: "Supplied dates lie inside [term.start_date, term.end_date]; complete only after term end; clock never moves backward"
    error_id: "ERR_DATE_OUT_OF_PERIOD / ERR_TERM_NOT_ENDED / ERR_INVALID_FIELD"
    http_status: "422 / 409 / 422"
    applies_to: "withdraw, recalculate, complete, breaks, clock"

  - priority: 9
    category: business_referential
    check: "Cross-entity state: award ACCEPTED before disburse; no OPEN/CALCULATED case when disbursing manually; no RETURNED obligation / ACCEPTED offer when recalculating or rescinding; no DISBURSED rows when cancelling an award"
    error_id: "ERR_AWARD_NOT_ACCEPTED / ERR_DISBURSEMENT_BLOCKED_BY_CASE / ERR_RETURN_ALREADY_COMPLETED / ERR_OFFER_ALREADY_ACCEPTED / ERR_AWARD_HAS_DISBURSEMENTS"
    http_status: 409
    applies_to: "disburse, recalculate, rescind-withdrawal, award cancel"

  - priority: 10
    category: business_constraint
    check: "Term date ranges must not overlap (closed intervals; adjacency allowed); breaks must lie inside their term and must not overlap (adjacent breaks merge); UNOFFICIAL + attendance_taking_required requires last_attendance_date"
    error_id: "ERR_TERM_OVERLAP / ERR_BREAK_OUTSIDE_TERM / ERR_BREAK_OVERLAP / ERR_ATTENDANCE_DATE_REQUIRED"
    http_status: "409 / 422 / 409 / 422"
    applies_to: "term create, break create, withdraw, recalculate"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: a FinancialAidOfficer may not record the SCHOOL-party return of a case they calculated (X-User-ID == calculated_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /r2t4/return-obligations/{id}/record-return"

  - priority: 12
    category: business_fiscal
    check: "Return amount must equal obligation amount exactly; scheduled + disbursed disbursements must not exceed award amount"
    error_id: "ERR_RETURN_AMOUNT_MISMATCH / ERR_DISBURSEMENT_EXCEEDS_AWARD"
    http_status: 422
    applies_to: "record-return, create disbursement"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Terms & breaks ---
  - method: POST
    path: "/r2t4/terms"
    description: "Create an academic term (payment period). Overlap with any existing term (closed-interval semantics) -> ERR_TERM_OVERLAP."
    roles: [RegistrarClerk]
    code: 201
    input: [name, start_date, end_date, "attendance_taking_required?", "refund_method?", "refund_schedule?"]
    output: AcademicTerm
    side_effects: ["compute calendar_days / deductible_break_days / total_days"]

  - method: GET
    path: "/r2t4/terms"
    description: "List terms (paginated)"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "AcademicTerm[]"
    side_effects: []

  - method: GET
    path: "/r2t4/terms/{id}"
    description: "Get a term"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: []

  - method: POST
    path: "/r2t4/terms/{id}/breaks"
    description: "Add a scheduled break; recomputes merged deductible groups and term.total_days"
    roles: [RegistrarClerk]
    code: 201
    input: [start_date, end_date]
    output: ScheduledBreak
    side_effects: ["recompute term_day_counts; increments AcademicTerm.version by 1"]

  - method: GET
    path: "/r2t4/terms/{id}/breaks"
    description: "List breaks of a term"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: []
    output: "ScheduledBreak[]"
    side_effects: []

  # --- Students & enrollments ---
  - method: POST
    path: "/r2t4/students"
    description: "Register a student"
    roles: [RegistrarClerk]
    code: 201
    input: [external_ref, full_name, email]
    output: Student
    side_effects: []

  - method: GET
    path: "/r2t4/students/{id}"
    description: "Get a student"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: POST
    path: "/r2t4/students/{id}/enrollments"
    description: "Enroll a student in a term; posts the CHARGE account entry"
    roles: [RegistrarClerk]
    code: 201
    input: [term_id, institutional_charges_cents]
    output: Enrollment
    side_effects:
      - "Post StudentAccountEntry(type=CHARGE, +institutional_charges_cents)"
      - "balance_cents = institutional_charges_cents; status=ENROLLED"

  - method: GET
    path: "/r2t4/enrollments"
    description: "List enrollments (filtered; FK reverse-reachability for student_id and term_id)"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: ["student_id?", "term_id?", "status?", "limit?", "offset?"]
    output: "Enrollment[]"
    side_effects: []

  - method: GET
    path: "/r2t4/enrollments/{id}"
    description: "Get an enrollment (includes computed balance_cents and notification flags)"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/r2t4/enrollments/{id}/withdraw"
    description: "Withdraw the student (official or unofficial); creates the WithdrawalCase in OPEN"
    roles: [RegistrarClerk, Student]
    code: 201
    input: [withdrawal_type, "notification_date?", "last_attendance_date?"]
    output: WithdrawalCase
    side_effects:
      - "Enrollment ENROLLED -> WITHDRAWN; WithdrawalCase created (OPEN) with dates/days/percentage computed"
      - "increments Enrollment.version by 1"

  - method: POST
    path: "/r2t4/enrollments/{id}/rescind-withdrawal"
    description: "Rescind the withdrawal (compensating action): cancels the case and reverses its financial artifacts"
    roles: [RegistrarClerk]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "Enrollment WITHDRAWN -> ENROLLED; case -> CANCELLED; obligations/offers VOIDED; REVERSAL entries posted; balance recomputed; notification flags reset"
      - "increments Enrollment.version by 1"

  - method: POST
    path: "/r2t4/enrollments/{id}/complete"
    description: "Mark enrollment completed after term end; cancels remaining SCHEDULED disbursements"
    roles: [RegistrarClerk]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["SCHEDULED disbursements -> CANCELLED", "increments Enrollment.version by 1"]

  - method: POST
    path: "/r2t4/enrollments/{id}/payments"
    description: "Record a student payment toward the account balance"
    roles: [BursarClerk, Student]
    code: 201
    input: [amount_cents]
    output: StudentAccountEntry
    side_effects: ["Post StudentAccountEntry(type=PAYMENT, -amount_cents)", "Recompute balance_cents"]

  - method: GET
    path: "/r2t4/enrollments/{id}/awards"
    description: "List awards of an enrollment"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: []
    output: "AidAward[]"
    side_effects: []

  - method: GET
    path: "/r2t4/enrollments/{id}/account-entries"
    description: "List ledger entries of an enrollment (append-only)"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: []
    output: "StudentAccountEntry[]"
    side_effects: []

  # --- Awards & disbursements ---
  - method: POST
    path: "/r2t4/enrollments/{id}/awards"
    description: "Create an aid award (PELL_GRANT starts ACCEPTED; loans start OFFERED)"
    roles: [FinancialAidOfficer]
    code: 201
    input: [program, amount_cents]
    output: AidAward
    side_effects: []

  - method: GET
    path: "/r2t4/awards/{id}"
    description: "Get an award"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: []
    output: AidAward
    side_effects: []

  - method: POST
    path: "/r2t4/awards/{id}/accept"
    description: "Student accepts a loan award"
    roles: [Student]
    code: 200
    input: []
    output: AidAward
    side_effects: ["OFFERED -> ACCEPTED; increments AidAward.version by 1"]

  - method: POST
    path: "/r2t4/awards/{id}/cancel"
    description: "Cancel an award with no disbursed funds"
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: AidAward
    side_effects: ["SCHEDULED disbursements -> CANCELLED; increments AidAward.version by 1"]

  - method: POST
    path: "/r2t4/awards/{id}/disbursements"
    description: "Schedule a disbursement against an award (status SCHEDULED). Award must be OFFERED or ACCEPTED (CANCELLED -> ERR_INVALID_STATE); cumulative scheduled + disbursed must not exceed the award amount."
    roles: [FinancialAidOfficer]
    code: 201
    input: [amount_cents]
    output: AidDisbursement
    side_effects: ["award.scheduled_amount_cents += amount_cents"]

  - method: GET
    path: "/r2t4/disbursements"
    description: "List disbursements (filtered; FK reverse-reachability for award_id and pwd_offer_id)"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: ["award_id?", "pwd_offer_id?", "status?", "limit?", "offset?"]
    output: "AidDisbursement[]"
    side_effects: []

  - method: GET
    path: "/r2t4/disbursements/{id}"
    description: "Get a disbursement"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: []
    output: AidDisbursement
    side_effects: []

  - method: POST
    path: "/r2t4/disbursements/{id}/disburse"
    description: "Release a SCHEDULED disbursement; blocked while a withdrawal case is active (must route via PWD)"
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: AidDisbursement
    side_effects:
      - "SCHEDULED -> DISBURSED; disbursed_on = current logical date"
      - "award.disbursed_amount_cents += amount_cents; post AID_CREDIT entry; recompute balance"

  # --- Withdrawal cases ---
  - method: GET
    path: "/r2t4/withdrawal-cases"
    description: "List withdrawal cases (filtered; FK reverse-reachability for enrollment_id)"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: "WithdrawalCase[]"
    side_effects: []

  - method: GET
    path: "/r2t4/withdrawal-cases/{id}"
    description: "Get a withdrawal case with all R2T4 snapshot fields"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: []
    output: WithdrawalCase
    side_effects: []

  - method: POST
    path: "/r2t4/withdrawal-cases/{id}/calculate"
    description: "Run the R2T4 calculation: snapshots, obligations, chargeback, PWD offer/auto-credit, refund, balance, notification, auto-close"
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: WithdrawalCase
    side_effects: ["Full CALCULATED cascade (see WithdrawalCase OPEN -> CALCULATED)"]

  - method: POST
    path: "/r2t4/withdrawal-cases/{id}/recalculate"
    description: "Correct case inputs and re-run the calculation; OCC-guarded on WithdrawalCase.version; voids and regenerates outstanding obligations/offers and reverses ledger artifacts"
    roles: [FinancialAidOfficer]
    code: 200
    input: [expected_withdrawal_case_version, "notification_date?", "last_attendance_date?", "withdrawal_type?"]
    output: WithdrawalCase
    side_effects: ["increments WithdrawalCase.version by 1", "Compensation + regeneration cascade (see CALCULATED -> CALCULATED)"]

  - method: GET
    path: "/r2t4/withdrawal-cases/{id}/obligations"
    description: "List return obligations of a case"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: []
    output: "ReturnObligation[]"
    side_effects: []

  - method: GET
    path: "/r2t4/withdrawal-cases/{id}/offers"
    description: "List post-withdrawal disbursement offers of a case"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: []
    output: "PostWithdrawalOffer[]"
    side_effects: []

  # --- Obligations & offers ---
  - method: POST
    path: "/r2t4/return-obligations/{id}/record-return"
    description: "Record that a return obligation was paid in full (late payment from OVERDUE allowed); SoD applies to SCHOOL party"
    roles: [BursarClerk, FinancialAidOfficer]
    code: 200
    input: [amount_cents, "returned_on?"]
    output: ReturnObligation
    side_effects: ["PENDING/OVERDUE -> RETURNED; case auto-close evaluation"]

  - method: GET
    path: "/r2t4/post-withdrawal-offers"
    description: "List PWD offers (filtered; FK reverse-reachability for award_id)"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: ["award_id?", "withdrawal_case_id?", "status?", "limit?", "offset?"]
    output: "PostWithdrawalOffer[]"
    side_effects: []

  - method: GET
    path: "/r2t4/post-withdrawal-offers/{id}"
    description: "Get a PWD offer"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: []
    output: PostWithdrawalOffer
    side_effects: []

  - method: POST
    path: "/r2t4/post-withdrawal-offers/{id}/accept"
    description: "Student accepts a loan PWD offer within the response window; disburses the funds"
    roles: [Student]
    code: 200
    input: []
    output: PostWithdrawalOffer
    side_effects: ["SENT -> ACCEPTED; DISBURSED AidDisbursement created; AID_CREDIT posted; balance recomputed; auto-close evaluation"]

  - method: POST
    path: "/r2t4/post-withdrawal-offers/{id}/decline"
    description: "Student declines a loan PWD offer"
    roles: [Student]
    code: 200
    input: []
    output: PostWithdrawalOffer
    side_effects: ["SENT -> DECLINED; auto-close evaluation"]

  # --- Ledger reads ---
  - method: GET
    path: "/r2t4/account-entries"
    description: "List ledger entries (filtered; FK reverse-reachability for enrollment_id and reversal_of_entry_id)"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: ["enrollment_id?", "entry_type?", "reversal_of_entry_id?", "limit?", "offset?"]
    output: "StudentAccountEntry[]"
    side_effects: []

  - method: GET
    path: "/r2t4/account-entries/{id}"
    description: "Get a ledger entry"
    roles: [RegistrarClerk, FinancialAidOfficer, BursarClerk, Student, SystemAdmin]
    code: 200
    input: []
    output: StudentAccountEntry
    side_effects: []

  # --- Test-driving logical clock ---
  - method: POST
    path: "/r2t4/_clock/set_current_utc"
    description: "Set the logical clock (ISO 8601). Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock. Value must be >= current logical time (ERR_INVALID_FIELD). Setting the clock runs the deadline sweep: PENDING obligations past due_date -> OVERDUE; SENT offers past response_deadline -> EXPIRED; affected cases re-run auto-close."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["Deadline sweep for obligations and offers; case auto-close evaluation"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint; includes Student attempting an UNOFFICIAL withdrawal" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, or malformed value (e.g., OFFICIAL withdrawal without notification_date)" }
  - { id: ERR_INVALID_FIELD, http: 422, condition: "Semantically invalid field: end_date <= start_date, non-positive amount, clock moving backward" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Student-role caller is not the owner of the target enrollment/award/offer" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid state transition (e.g., calculate on CALCULATED case, rescind on COMPLETED enrollment, record-return on VOIDED obligation)" }
  - { id: ERR_ENROLLMENT_ALREADY_WITHDRAWN, http: 409, condition: "Withdraw requested on an enrollment already WITHDRAWN" }
  - { id: ERR_ENROLLMENT_NOT_WITHDRAWN, http: 409, condition: "Rescind requested on an enrollment not currently WITHDRAWN" }
  - { id: ERR_TERM_NOT_ENDED, http: 409, condition: "Complete requested before the term's end_date has passed" }
  - { id: ERR_DATE_OUT_OF_PERIOD, http: 422, condition: "Supplied notification/attendance date lies outside [term.start_date, term.end_date]" }
  - { id: ERR_ATTENDANCE_DATE_REQUIRED, http: 422, condition: "UNOFFICIAL withdrawal on an attendance-taking term without last_attendance_date" }
  - { id: ERR_TERM_OVERLAP, http: 409, condition: "New term's closed date interval intersects an existing term's (adjacent terms allowed)" }
  - { id: ERR_BREAK_OUTSIDE_TERM, http: 422, condition: "Break dates lie outside the parent term" }
  - { id: ERR_BREAK_OVERLAP, http: 409, condition: "Break's closed date interval intersects another break of the same term (adjacency is not overlap and triggers merge)" }
  - { id: ERR_AWARD_NOT_ACCEPTED, http: 409, condition: "Disburse attempted on an award not in ACCEPTED status" }
  - { id: ERR_AWARD_HAS_DISBURSEMENTS, http: 409, condition: "Cancel attempted on an award with DISBURSED disbursements" }
  - { id: ERR_DISBURSEMENT_BLOCKED_BY_CASE, http: 409, condition: "Manual disburse while the enrollment has an OPEN or CALCULATED withdrawal case" }
  - { id: ERR_DISBURSEMENT_EXCEEDS_AWARD, http: 422, condition: "scheduled + disbursed + new amount exceeds the award amount" }
  - { id: ERR_OBLIGATION_ALREADY_RETURNED, http: 409, condition: "record-return on an obligation already RETURNED" }
  - { id: ERR_RETURN_AMOUNT_MISMATCH, http: 422, condition: "record-return amount_cents differs from obligation amount_cents" }
  - { id: ERR_RETURN_ALREADY_COMPLETED, http: 409, condition: "Recalculate or rescind blocked because an obligation is already RETURNED" }
  - { id: ERR_OFFER_NOT_RESPONDABLE, http: 409, condition: "Accept/decline on an offer not in SENT status" }
  - { id: ERR_OFFER_ALREADY_ACCEPTED, http: 409, condition: "Recalculate or rescind blocked because a PWD offer is already ACCEPTED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "FinancialAidOfficer recording the SCHOOL return of a case they calculated" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_withdrawal_case_version does not match current WithdrawalCase.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator; drives the logical clock used by deadline sweeps"
    identity: "opaque"
    exclusive_operations:
      - "POST /r2t4/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: RegistrarClerk
    description: "Registrar's office: owns terms, breaks, students, enrollments, withdrawal initiation/rescission, completion"
    identity: "opaque"
    exclusive_operations:
      - "POST /r2t4/terms"
      - "POST /r2t4/terms/{id}/breaks"
      - "POST /r2t4/students"
      - "POST /r2t4/students/{id}/enrollments"
      - "POST /r2t4/enrollments/{id}/rescind-withdrawal"
      - "POST /r2t4/enrollments/{id}/complete"
    shared_operations:
      - "POST /r2t4/enrollments/{id}/withdraw (shared with Student)"
      - "All GET endpoints"

  - name: FinancialAidOfficer
    description: "R2T4 office: owns awards, disbursements, calculation and recalculation of withdrawal cases"
    identity: "opaque"
    exclusive_operations:
      - "POST /r2t4/enrollments/{id}/awards"
      - "POST /r2t4/awards/{id}/cancel"
      - "POST /r2t4/awards/{id}/disbursements"
      - "POST /r2t4/disbursements/{id}/disburse"
      - "POST /r2t4/withdrawal-cases/{id}/calculate"
      - "POST /r2t4/withdrawal-cases/{id}/recalculate"
    shared_operations:
      - "POST /r2t4/return-obligations/{id}/record-return (shared with BursarClerk; barred from recording the SCHOOL return of a case they calculated — ERR_SEGREGATION_OF_DUTIES)"
      - "All GET endpoints"

  - name: BursarClerk
    description: "Bursar's office: records return payments and student account payments"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /r2t4/return-obligations/{id}/record-return (shared with FinancialAidOfficer; never SoD-barred)"
      - "POST /r2t4/enrollments/{id}/payments (shared with Student)"
      - "All GET endpoints"

  - name: Student
    description: "The withdrawn/enrolled student acting on their own records"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /r2t4/awards/{id}/accept (own awards only)"
      - "POST /r2t4/post-withdrawal-offers/{id}/accept (own offers only)"
      - "POST /r2t4/post-withdrawal-offers/{id}/decline (own offers only)"
    shared_operations:
      - "POST /r2t4/enrollments/{id}/withdraw (own enrollment, OFFICIAL type only)"
      - "POST /r2t4/enrollments/{id}/payments (own enrollment only)"
      - "All GET endpoints"
