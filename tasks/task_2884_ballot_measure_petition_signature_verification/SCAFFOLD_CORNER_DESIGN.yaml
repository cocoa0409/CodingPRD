          priority 10 must admit creation in CURE_PERIOD, which makes the priority-13
          coherence clause the only thing that can refuse either shape. The limit refusal is
          taken with C2 still OPEN but the clock already at its deadline_at, so the
          half-open overlap rule at priority 14 is satisfied and the count gate at priority
          15 is provably the rule that fired. The two targets differ (4 raw at an observed
