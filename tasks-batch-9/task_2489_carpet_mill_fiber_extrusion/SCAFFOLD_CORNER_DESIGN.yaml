            - "Certification.${cert}.status == LAPSED"
            - "CarpetStyle.${st}.status == SUSPENDED"
            - "ProductionRun.${pr2}.status == HELD and ProductionRun.${pr1}.status == BACKED"

      - name: revoking_a_certificate_suspends_the_style_corner
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /mill/certifications/{certification_id}/revoke]
          - state_machines.Certification.ACTIVE_to_REVOKED
        excluded_because:
          difficulty_instance: tufter_load_setup_gated_on_style_status_driven_by_certificate_revocation
          rationale: "The named §1.8 instance revokes the certificate, watches the style suspend and the run flip to HELD, then re-certifies to unblock the load."

      - name: recoating_a_failed_backing_is_a_conditional_action_corner
        claim_type: conditional_action
        grounds:
          - endpoints[POST /mill/production-runs/{production_run_id}/recoat]
          - errors[ERR_RECOAT_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: backing_recoat_loop_reenters_greige_and_stalls_at_recoat_limit
          rationale: "The named §1.8 instance recoats once from BACKING_FAILED and is refused on the second attempt at RECOAT_LIMIT 1."

  # ===========================================================================
  # SECTION 6 — ERRORS
  # ===========================================================================
  - section: errors
    instances:
      - name: request_missing_x_user_headers_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority 1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Authentication is checked before anything else: a request with no identity headers and a
          request carrying a role that is not in the declared set both fail with 401 even though the
          body is otherwise valid, and no row is created.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 500000 }
              as: "(none)"
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 500000 }
              as: "ShiftSupervisor"
              as_user_id: "planner-1"
            - call: "GET /mill/accounts"
              payload: { limit: 10, offset: 0 }
              as: PlantAdmin
          assert:
            - "the header-less POST returns HTTP 401 with error.error_id == ERR_UNAUTHENTICATED"
            - "the undeclared-role POST returns HTTP 401 with error.error_id == ERR_UNAUTHENTICATED"
            - "the authenticated list returns meta.total_count == 0"

      - name: unknown_path_ids_return_each_resources_own_not_found_error
        claim_type: error_triggerable
        grounds:
          - validations[priority 5]
          - errors[ERR_ACCOUNT_NOT_FOUND]
          - errors[ERR_POLYMER_LOT_NOT_FOUND]
          - errors[ERR_RECLAMATION_BATCH_NOT_FOUND]
          - errors[ERR_FIBER_BATCH_NOT_FOUND]
          - errors[ERR_MACHINE_NOT_FOUND]
          - errors[ERR_VESSEL_NOT_FOUND]
          - errors[ERR_DYE_LOT_NOT_FOUND]
          - errors[ERR_PRODUCT_TEST_NOT_FOUND]
          - errors[ERR_CERTIFICATION_NOT_FOUND]
          - errors[ERR_CUT_ORDER_NOT_FOUND]
          - errors[ERR_CUT_ALLOCATION_NOT_FOUND]
        distinguishing_aspect: |
          The same well-formed UUID is rejected with a *different* error_id per resource family, so
          the 404 is resource-specific rather than a generic not-found; every reachable single-id read
          path is probed against an empty database.
        test_recipe:
          setup:
            - "Empty database; the probe id 00000000-0000-4000-8000-000000000404 exists nowhere."
          setup_api_calls: []
          trigger:
            - call: "GET /mill/accounts/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: PlantAdmin
            - call: "GET /mill/polymer-lots/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: PlantAdmin
            - call: "GET /mill/reclamation-batches/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: PlantAdmin
            - call: "GET /mill/fiber-batches/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: PlantAdmin
            - call: "GET /mill/tufting-machines/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: PlantAdmin
            - call: "GET /mill/dye-vessels/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: PlantAdmin
            - call: "GET /mill/dye-lots/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: PlantAdmin
            - call: "GET /mill/product-tests/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: PlantAdmin
            - call: "GET /mill/certifications/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: PlantAdmin
            - call: "GET /mill/cut-orders/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: PlantAdmin
            - call: "GET /mill/cut-allocations/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: PlantAdmin
          assert:
            - "every call returns HTTP 404"
            - "the account read returns ERR_ACCOUNT_NOT_FOUND and the polymer-lot read ERR_POLYMER_LOT_NOT_FOUND"
            - "the reclamation-batch read returns ERR_RECLAMATION_BATCH_NOT_FOUND and the fiber-batch read ERR_FIBER_BATCH_NOT_FOUND"
            - "the tufting-machine read returns ERR_MACHINE_NOT_FOUND and the dye-vessel read ERR_VESSEL_NOT_FOUND"
            - "the dye-lot read returns ERR_DYE_LOT_NOT_FOUND and the product-test read ERR_PRODUCT_TEST_NOT_FOUND"
            - "the certification read returns ERR_CERTIFICATION_NOT_FOUND, the cut-order read ERR_CUT_ORDER_NOT_FOUND and the cut-allocation read ERR_CUT_ALLOCATION_NOT_FOUND"

      - name: scheduling_a_run_on_an_unreleased_batch_returns_fiber_batch_not_released
        claim_type: error_triggerable
        grounds:
          - validations[priority 8]
          - errors[ERR_FIBER_BATCH_NOT_RELEASED]
          - state_machines.FiberBatch.RELEASED_to_ALLOCATED
        distinguishing_aspect: |
          A QUEUED batch cannot be scheduled, and neither can a SPUN one: the run demands RELEASED,
          so the error survives extrusion and only clears after the release disposition. The refused
          run is not persisted, leaving the machine window free.
        test_recipe:
          setup:
            - "ACTIVE solution-dyed style ST-SD-01, machine TM-01 and FiberBatch FB-01 in QUEUED."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 0, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
          trigger:
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
          assert:
            - "the first run create returns HTTP 422 with error.error_id == ERR_FIBER_BATCH_NOT_RELEASED"
            - "the second run create (batch SPUN) returns HTTP 422 with error.error_id == ERR_FIBER_BATCH_NOT_RELEASED"
            - "the third run create returns HTTP 201 with ProductionRun.${pr}.status == SCHEDULED"
            - "FiberBatch.${fb}.status == ALLOCATED and FiberBatch.${fb}.denier_actual == 1200.0"
            - "the run_code ST-SD-01 uniqueness was never consumed by the two refusals"

      - name: maintenance_equipment_and_an_unapproved_lot_block_their_downstream_writes
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MACHINE_UNAVAILABLE]
          - errors[ERR_VESSEL_UNAVAILABLE]
          - errors[ERR_DYE_LOT_NOT_APPROVED]
          - validations[priority 8]
        distinguishing_aspect: |
          Three availability gates on three different parents, all read at write time: a MAINTENANCE
          tufter refuses the run, a MAINTENANCE beck refuses the dye lot, and a piece-dyed roll cannot
          be doffed until its lot is APPROVED — the same doff succeeds once the lot clears, so the
          gate is on lot state and not on the roll payload.
        test_recipe:
          setup:
            - "ACTIVE piece-dyed style ST-PD-01 with a RELEASED PIECE_DYED_READY batch."
            - "TM-01 IDLE and TM-MX in MAINTENANCE; DV-01 AVAILABLE and DV-MX in MAINTENANCE."
