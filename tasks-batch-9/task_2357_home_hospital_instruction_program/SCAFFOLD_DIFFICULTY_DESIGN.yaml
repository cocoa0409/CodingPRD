          A single void propagates five levels — (1) InstructionSession DELIVERED to VOIDED, (2) an
          HB_REVERSAL AttendanceLedgerEntry of -120, (3) HomeboundCase.reported_apportionment_minutes 480
          to 360 and service_gap_minutes 420, (4) funding_status RECONCILED to HELD, (5) the ACKED
