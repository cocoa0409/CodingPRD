              as: DesignEngineer
              captures: { cc_id: $.data.id }
            - call: "POST /spring-designs/${d1_id}/submit-for-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "de-01"
            - call: "POST /spring-designs/${d1_id}/review"
              payload: { decision: "APPROVE_PROTOTYPE" }
              as: EngineeringManager
              as_user_id: "em-01"
            - call: "POST /tooling-assets"
              payload: { design_id: "${d1_id}", tool_code: "TL-RECUT", original_cost_cents: 1000 }
