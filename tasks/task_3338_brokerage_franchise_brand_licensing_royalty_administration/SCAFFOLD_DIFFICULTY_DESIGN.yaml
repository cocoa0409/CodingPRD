  - rule_id: non_linear_state_machine
    instances:
      - name: default_case_branching_resolve_from_three_states
        grounds:
          - state_machines.DefaultCase.OPEN_to_RESOLVED
          - state_machines.DefaultCase.CURING_to_RESOLVED
          - state_machines.DefaultCase.ESCALATED_to_RESOLVED
          - state_machines.DefaultCase.OPEN_to_CURING
        distinguishing_aspect: |
          DefaultCase is a fork-join: OPEN branches to CURING or ESCALATED, and
          RESOLVED is reachable from all three non-terminal states with the same
          trigger but different agreement-side consequences (escalated resolve
          does not decrement open_cure_count below zero).
        test_recipe:
          setup:
            - "Agreement A5 ACTIVE with one OPEN default D1"
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { brand_code: "B5", display_name: "Brand Five" }
              as: FranchisorOps
              captures: { brand5: $.data.id }
            - call: "POST /franchise/markets"
              payload: { market_code: "M51", name: "Market 51" }
              as: FranchisorOps
              captures: { mkt51: $.data.id }
            - call: "POST /franchise/brokerages"
              payload: { legal_name: "BF", home_market_id: "${mkt51}", principal_email: "f@x.example" }
              as: FranchisorOps
              captures: { bkF: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { brokerage_id: "${bkF}", brand_id: "${brand5}", market_id: "${mkt51}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", base_royalty_rate_bps: 600, annual_royalty_cap_cents: 900000000, volume_incentive_threshold_cents: 1000000000, volume_incentive_rate_bps: 300, ad_fund_rate_bps: 200 }
              as: FranchisorOps
              captures: { agF: $.data.id, agF_v: $.data.version }
            - call: "POST /franchise/agreements/${agF}/conversion-plans"
              payload: { milestones: [ { name: "m", target_date: "2027-01-01T00:00:00Z", sequence: 1 } ] }
              as: FranchisorOps
              captures: { cpF: $.data.id }
            - call: "POST /franchise/conversion-plans/${cpF}/milestones/complete"
              payload: { sequence: 1 }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agF}/activate"
              payload: { expected_agreement_version: "${agF_v}" }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agF}/default-cases"
              payload: { reason_code: "PAYMENT" }
              as: FranchisorOps
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /franchise/default-cases/${d1}/start-cure"
              payload: {}
              as: FranchisorOps
              captures: { d1_mid: $.data.status }
            - call: "POST /franchise/default-cases/${d1}/escalate"
              payload: {}
              as: FranchisorOps
            - call: "POST /franchise/default-cases/${d1}/resolve"
              payload: {}
              as: FranchisorOps
              captures: { d1_end: $.data.status }
          assert:
            - "DefaultCase.${d1} status transitions OPEN -> CURING -> ESCALATED -> RESOLVED"
            - "after resolve: FranchiseAgreement.${agF}.open_cure_count == 0"
      - name: agreement_suspend_resume_cycle_via_default_resolution
        grounds:
          - state_machines.FranchiseAgreement.ACTIVE_to_SUSPENDED
          - state_machines.FranchiseAgreement.SUSPENDED_to_ACTIVE
          - state_machines.FranchiseAgreement.SUSPENDED_to_TERMINATED
        distinguishing_aspect: |
          FranchiseAgreement exhibits a cycle (ACTIVE -> SUSPENDED -> ACTIVE)
