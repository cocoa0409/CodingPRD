              as: ProgramAdmin
            - call: "POST /pass-programs"
              payload: { season_year: 2027, park_name: "Harbor Bay", early_bird_deadline: "2027-11-15" }
              as: ProgramAdmin
              captures: { prog_b: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog_b}", name: "BRONZE", tier_rank: 1, base_price_cents: 13000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze_b: "$.data.id" }
            - call: "POST /pass-tiers/${bronze_b}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog_b}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog_a}", tier_id: "${bronze_a}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a1: "$.data.id" }
          trigger:
            - call: "POST /season-passes"
              payload: { program_id: "${prog_a}", tier_id: "${gold_a}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { err: "$.data.error_id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog_b}", tier_id: "${bronze_b}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_b1: "$.data.id" }
          assert:
            - "first trigger: HTTP 422 with data.error_id == 'ERR_DUPLICATE_ACTIVE_PASS' (the existing pass is PENDING_PROCESSING, which is a live status)"
            - "second trigger: HTTP 201 with data.media_number == 'SP-000002' (a different program is a different scope)"
            - "GET /season-passes?passholder_id=${holder_a} → data.total_count == 2"

      - name: reinstate_cure_amount_must_match_the_missed_total_minus_the_waived_row
        claim_type: violation_to_error
        grounds:
          - validations[priority=104]
          - calculations.delinquency_evaluation
          - errors[ERR_CURE_AMOUNT_MISMATCH]
          - endpoints[POST /season-passes/{pass_id}/reinstate]
        distinguishing_aspect: "With two MISSED installments of 2625 the required cure is 5250; sending 2625 alone is refused, and the very same 2625 becomes correct once waive_installment_id names the second row, which then ends WAIVED rather than SETTLED."
        test_recipe:
          setup:
            - "Program in SALES_OPEN with PUBLISHED BRONZE; processed BRONZE pass on a 4-installment plan (down 3000 → 4 x 2625 due 2026-09-01 / 10-01 / 11-01 / 12-01)."
            - "A billing run as_of 2026-10-02 leaves installments 1 and 2 MISSED, billing DELINQUENT and pass_status SUSPENDED."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAYMENT_PLAN" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
              captures: { pass_a_v: "$.data.version" }
            - call: "POST /season-passes/${pass_a}/payment-plans"
              payload: { down_payment_cents: 3000, installment_count: 4, first_due_date: "2026-09-01", expected_season_pass_version: "${pass_a_v}" }
              as: PassOfficeClerk
              captures: { plan_a: "$.data.id" }
            - call: "GET /installments?payment_plan_id=${plan_a}"
              as: PassOfficeClerk
              captures: { inst_1: "$.data[0].id", inst_2: "$.data[1].id" }
            - call: "POST /pass-programs/${prog}/billing-runs"
              payload: { as_of_date: "2026-10-02" }
              as: ProgramAdmin
          trigger:
            - call: "POST /season-passes/${pass_a}/reinstate"
              payload: { cure_amount_cents: 2625 }
              as: PassOfficeClerk
              captures: { err: "$.data.error_id" }
            - call: "POST /season-passes/${pass_a}/reinstate"
              payload: { cure_amount_cents: 2625, waive_installment_id: "${inst_2}" }
              as: PassOfficeClerk
          assert:
            - "first trigger: HTTP 422 with data.error_id == 'ERR_CURE_AMOUNT_MISMATCH' (5250 was required)"
            - "after the first trigger GET /season-passes/${pass_a} → data.pass_status == 'SUSPENDED' and data.paid_to_date_cents == 3000 (nothing was applied)"
            - "second trigger: HTTP 200 with data.pass_status == 'ACTIVE' and data.billing_status == 'PLAN_CURRENT'"
            - "second trigger: data.paid_to_date_cents == 5625 (3000 down + the 2625 cure; the waived row collects nothing)"
            - "GET /installments/${inst_1} → data.status == 'SETTLED'; GET /installments/${inst_2} → data.status == 'WAIVED'"
            - "GET /payment-plans/${plan_a} → data.missed_count == 0"

      - name: installment_settlement_amount_must_match_exactly
        claim_type: violation_to_error
        grounds:
          - validations[priority=102]
          - errors[ERR_PAYMENT_AMOUNT_MISMATCH]
          - endpoints[POST /installments/{installment_id}/settle]
        distinguishing_aspect: "Both underpayment (2624) and overpayment (2626) are refused against the 2625 row — the rule is equality, not sufficiency — and paid_at may pin the settled_at instant when the exact amount is finally tendered."
        test_recipe:
          setup:
            - "Program in SALES_OPEN with PUBLISHED BRONZE; processed BRONZE pass on a 4-installment plan (down 3000 → 4 x 2625)."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAYMENT_PLAN" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
              captures: { pass_a_v: "$.data.version" }
            - call: "POST /season-passes/${pass_a}/payment-plans"
              payload: { down_payment_cents: 3000, installment_count: 4, first_due_date: "2026-09-01", expected_season_pass_version: "${pass_a_v}" }
              as: PassOfficeClerk
              captures: { plan_a: "$.data.id" }
            - call: "GET /installments?payment_plan_id=${plan_a}"
              as: PassOfficeClerk
              captures: { inst_1: "$.data[0].id" }
          trigger:
            - call: "POST /installments/${inst_1}/settle"
              payload: { amount_cents: 2624 }
              as: PassOfficeClerk
              captures: { err: "$.data.error_id" }
            - call: "POST /installments/${inst_1}/settle"
              payload: { amount_cents: 2625, paid_at: "2026-09-01T09:30:00Z" }
              as: PassOfficeClerk
          assert:
            - "first trigger: HTTP 422 with data.error_id == 'ERR_PAYMENT_AMOUNT_MISMATCH'"
            - "an overpayment of 2626 returns the same ERR_PAYMENT_AMOUNT_MISMATCH"
            - "after the refusals GET /installments/${inst_1} → data.status == 'SCHEDULED' and data.settled_at == null"
            - "second trigger: HTTP 200 with data.status == 'SETTLED' and data.settled_at == '2026-09-01T09:30:00Z' (the supplied paid_at wins over the logical clock)"
            - "GET /season-passes/${pass_a} → data.paid_to_date_cents == 5625 and data.billing_status == 'PLAN_CURRENT'"

      - name: park_day_from_another_program_cannot_be_reserved
        claim_type: cross_entity_validation
        grounds:
