  # --- MaterialRequisition ---
  - method: POST
    path: "/om/material-requisitions"
    description: "Create a REQUESTED requisition; work order must be READY/DISPATCHED/IN_PROGRESS"
    roles: [MaterialsManager]
    code: 201
    input: [work_order_id, material_stock_id, quantity]
    output: MaterialRequisition
    side_effects: []
  - method: GET
    path: "/om/material-requisitions/{id}"
    description: "Get one requisition"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: []
    output: MaterialRequisition
    side_effects: []
  - method: GET
    path: "/om/material-requisitions"
    description: "List requisitions, filterable"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: ["work_order_id?", "material_stock_id?", "requisition_status?", "limit?", "offset?"]
    output: "MaterialRequisition[]"
    side_effects: []
  - method: POST
    path: "/om/material-requisitions/{id}/stage"
    description: "REQUESTED -> STAGED; reserves quantity (quantity_available >= quantity required, equality allowed)"
    roles: [MaterialsManager]
    code: 200
    input: []
    output: MaterialRequisition
    side_effects: ["stock quantity_reserved += quantity", "increments version on requisition and stock"]
  - method: POST
    path: "/om/material-requisitions/{id}/issue"
    description: "STAGED -> ISSUED; decrements reserved and on_hand; posts MATERIAL ledger entry"
    roles: [MaterialsManager]
    code: 200
    input: []
    output: MaterialRequisition
    side_effects: ["stock quantity_reserved -= quantity, quantity_on_hand -= quantity", "posts MATERIAL CostLedgerEntry", "event material/total rollup recompute", "increments version"]
  - method: POST
    path: "/om/material-requisitions/{id}/return"
    description: "ISSUED -> RETURNED; restores on_hand and posts a negative reversal MATERIAL entry referencing the issue entry"
    roles: [MaterialsManager]
    code: 200
    input: []
    output: MaterialRequisition
    side_effects: ["stock quantity_on_hand += quantity", "posts reversal MATERIAL CostLedgerEntry (reversed_entry_id set)", "event material/total rollup recompute", "increments version"]
  - method: POST
    path: "/om/material-requisitions/{id}/consume"
    description: "ISSUED -> CONSUMED (terminal; cost stands)"
    roles: [MaterialsManager]
    code: 200
    input: []
    output: MaterialRequisition
    side_effects: ["increments version"]
  - method: POST
    path: "/om/material-requisitions/{id}/cancel"
    description: "REQUESTED/STAGED -> CANCELLED; STAGED releases its reservation"
    roles: [MaterialsManager]
    code: 200
    input: []
    output: MaterialRequisition
    side_effects: ["if STAGED: stock quantity_reserved -= quantity", "increments version"]

