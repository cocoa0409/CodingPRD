scenario: "Full-Service Vacation-Rental Management (Vacasa style): owner onboarding & listing/channel, dynamic pricing & calendar, cleaning/turnover & inspection, guest screening & messaging, maintenance & work-order, owner statement & split, tax/permit remittance, review"

domain_name: vacation-rental-management
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing        # booking calendar + turnover buffer windows
  secondary_archetype: ledger_reconciliation    # owner statement split, estimate vs final payout
  complexity_layers:
    - optimistic_concurrency        # OCC on Property.version for pricing-rule supersede
    - cascading_side_effects        # offboard -> booking -> turnover -> inspection; WO approve -> statement line -> payout
    - dual_variant_calculation      # cancellation refund by policy; statement payout provisional vs final
    - rate_threshold_triggers       # refund tiers by days-to-check-in; owner-approval cost threshold

  entity_topology: flat             # peer entities linked by foreign keys; no nesting of business collections in URLs
  state_machine_shape: parallel     # Booking evolves stay_status x screening_status independently
  relationship_patterns:
    - one_to_many
    - flat_with_references
    - cross_aggregate
  role_model: segregation_of_duties  # inspector vendor MUST differ from turnover cleaner vendor
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Owner legal name" }
      - { name: email, type: string, source: input, description: "Owner contact email" }
      - { name: payout_method, type: enum, source: input, default: "ACH", description: "ACH | CHECK | WIRE", constraints: "one of ACH, CHECK, WIRE" }
      - { name: default_management_fee_pct, type: number, source: input, description: "Management fee percent applied to rental income on owner statements (e.g., 20 = 20%)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | OFFBOARDED", constraints: "one of ACTIVE, SUSPENDED, OFFBOARDED" }

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Guest full name" }
      - { name: email, type: string, source: input, description: "Guest contact email" }
      - { name: government_id_verified, type: boolean, source: input, default: false, description: "Whether the guest passed ID verification" }
      - { name: status, type: enum, source: system, default: "UNSCREENED", description: "UNSCREENED | APPROVED | BANNED", constraints: "one of UNSCREENED, APPROVED, BANNED" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor / crew name" }
      - { name: vendor_type, type: enum, source: input, description: "CLEANER | INSPECTOR | MAINTENANCE | GENERAL", constraints: "one of CLEANER, INSPECTOR, MAINTENANCE, GENERAL" }
      - { name: email, type: string, source: input, description: "Vendor contact email" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE", constraints: "one of ACTIVE, INACTIVE" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; the owning Owner" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: jurisdiction_code, type: string, source: input, description: "Tax jurisdiction code driving permit/remittance" }
      - { name: base_nightly_rate_cents, type: integer, source: input, description: "Base nightly rate in cents before dynamic pricing factors" }
      - { name: cleaning_fee_cents, type: integer, source: input, description: "Per-stay cleaning fee charged to the guest in cents" }
      - { name: max_occupancy, type: integer, source: input, description: "Maximum guest occupancy" }
      - { name: default_cancellation_policy, type: enum, source: input, default: "MODERATE", description: "FLEXIBLE | MODERATE | STRICT; inherited by new bookings unless overridden", constraints: "one of FLEXIBLE, MODERATE, STRICT" }
      - { name: status, type: enum, source: system, default: "ONBOARDING", description: "ONBOARDING | LISTED | UNLISTED | OFFBOARDED", constraints: "one of ONBOARDING, LISTED, UNLISTED, OFFBOARDED" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; permitted property" }
      - { name: permit_number, type: string, source: input, description: "Short-term-rental permit number" }
      - { name: jurisdiction_code, type: string, source: input, description: "Issuing jurisdiction code" }
      - { name: occupancy_tax_pct, type: number, source: input, description: "Occupancy tax percent applied to taxable base (e.g., 10 = 10%)" }
      - { name: issued_on, type: datetime, source: input, description: "Permit issue date (ISO 8601)" }
      - { name: expires_on, type: datetime, source: input, description: "Permit expiry date (ISO 8601)" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | REVOKED", constraints: "one of PENDING, ACTIVE, REVOKED" }

  - name: ChannelListing
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; listed property" }
      - { name: channel, type: enum, source: input, description: "AIRBNB | VRBO | DIRECT | BOOKING_COM", constraints: "one of AIRBNB, VRBO, DIRECT, BOOKING_COM" }
      - { name: external_listing_ref, type: string, source: input, description: "External channel listing reference", constraints: "optional" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SYNCED | PAUSED | DELISTED", constraints: "one of DRAFT, SYNCED, PAUSED, DELISTED" }

  - name: PricingRule
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property the rule applies to" }
      - { name: rule_type, type: enum, source: input, description: "SEASONAL | OCCUPANCY | LAST_MINUTE | MIN_STAY", constraints: "one of SEASONAL, OCCUPANCY, LAST_MINUTE, MIN_STAY" }
      - { name: multiplier_bps, type: integer, source: input, description: "Rate multiplier in basis points (10000 = 1.0x); used by SEASONAL/OCCUPANCY/LAST_MINUTE", constraints: "optional" }
      - { name: min_nights, type: integer, source: input, description: "Minimum nights for MIN_STAY rules", constraints: "optional" }
      - { name: start_date, type: datetime, source: input, description: "Inclusive first date the rule covers (ISO 8601)", constraints: "optional" }
      - { name: end_date, type: datetime, source: input, description: "Exclusive last date the rule covers (ISO 8601)", constraints: "optional" }
      - { name: priority, type: integer, source: input, description: "Tie-break priority when multiple same-type rules match; higher wins" }
      - { name: active, type: boolean, source: system, default: true, description: "False once superseded by a newer same-type overlapping rule" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; booked property" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id; booking guest" }
      - { name: check_in, type: datetime, source: input, description: "Check-in date (ISO 8601, date at 00:00Z)" }
      - { name: check_out, type: datetime, source: input, description: "Check-out date (ISO 8601, date at 00:00Z); half-open interval [check_in, check_out)" }
      - { name: nights, type: integer, source: computed, description: "Number of nights = (check_out - check_in) in days" }
      - { name: cancellation_policy, type: enum, source: input, default: "MODERATE", description: "FLEXIBLE | MODERATE | STRICT; defaults from property.default_cancellation_policy", constraints: "one of FLEXIBLE, MODERATE, STRICT" }
      - { name: quoted_per_night_cents, type: integer, source: computed, description: "Dynamic per-night rate locked at booking creation" }
      - { name: nightly_subtotal_cents, type: integer, source: computed, description: "quoted_per_night_cents * nights" }
      - { name: quoted_cleaning_fee_cents, type: integer, source: computed, description: "Cleaning fee snapshot from property at booking creation" }
      - { name: occupancy_tax_cents, type: integer, source: computed, description: "Occupancy tax on (nightly_subtotal + cleaning) using active permit rate" }
      - { name: total_cents, type: integer, source: computed, description: "nightly_subtotal + cleaning + occupancy_tax" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Refund amount computed on cancellation" }
      - { name: stay_status, type: enum, source: system, default: "HOLD", description: "HOLD | CONFIRMED | CHECKED_IN | CHECKED_OUT | CANCELLED", constraints: "one of HOLD, CONFIRMED, CHECKED_IN, CHECKED_OUT, CANCELLED" }
      - { name: screening_status, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | DECLINED (parallel dimension to stay_status)", constraints: "one of PENDING, APPROVED, DECLINED" }
      - { name: messages, type: array, source: system, default: [], description: "Append-only list of { sender_role, body, at } message objects" }

  - name: TurnoverTask
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the checked-out booking whose stay triggers this turnover" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property being cleaned" }
      - { name: assigned_vendor_id, type: string, source: input, description: "FK -> Vendor.id; assigned cleaning vendor (must be CLEANER type)" }
      - { name: scheduled_window_start, type: datetime, source: input, description: "Turnover window start (ISO 8601)" }
      - { name: scheduled_window_end, type: datetime, source: input, description: "Turnover window end (ISO 8601); closed interval [start, end] with travel buffer" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | IN_PROGRESS | CLEANED | INSPECTED | FAILED | CANCELLED", constraints: "one of SCHEDULED, IN_PROGRESS, CLEANED, INSPECTED, FAILED, CANCELLED" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: turnover_task_id, type: string, source: input, description: "FK -> TurnoverTask.id; inspected turnover" }
      - { name: inspector_vendor_id, type: string, source: input, description: "FK -> Vendor.id; inspecting vendor (must differ from the turnover's assigned_vendor_id — SoD)" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL", constraints: "one of PASS, FAIL" }
      - { name: notes, type: string, source: input, description: "Inspection notes", constraints: "optional" }
      - { name: status, type: enum, source: system, default: "COMPLETED", description: "COMPLETED | CANCELLED (CANCELLED only via turnover cancellation cascade)", constraints: "one of COMPLETED, CANCELLED" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property needing maintenance" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; assigned maintenance vendor", constraints: "optional; null until assigned" }
      - { name: owner_statement_id, type: string, source: system, description: "FK -> OwnerStatement.id; the DRAFT statement a billable-to-owner charge was posted to on approval", constraints: "optional; null until approved billable-to-owner" }
      - { name: description, type: string, source: input, description: "Work description" }
      - { name: cost_cents, type: integer, source: input, description: "Estimated/charged cost in cents" }
      - { name: billable_to, type: enum, source: input, description: "OWNER | GUEST | COMPANY", constraints: "one of OWNER, GUEST, COMPANY" }
      - { name: requires_owner_approval, type: boolean, source: computed, description: "True when billable_to == OWNER AND cost_cents > OWNER_APPROVAL_THRESHOLD_CENTS" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | ASSIGNED | IN_PROGRESS | NEEDS_INFO | COMPLETED | APPROVED | REJECTED", constraints: "one of OPEN, ASSIGNED, IN_PROGRESS, NEEDS_INFO, COMPLETED, APPROVED, REJECTED" }

  - name: OwnerStatement
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; statement owner" }
      - { name: period_year, type: integer, source: input, description: "Statement period year" }
      - { name: period_month, type: integer, source: input, description: "Statement period month (1-12)" }
      - { name: gross_rental_cents, type: integer, source: computed, description: "Sum of nightly_subtotal_cents over qualifying CHECKED_OUT bookings in period" }
      - { name: mgmt_fee_cents, type: integer, source: computed, description: "Sum of per-booking management fee (rounded per booking then summed)" }
      - { name: cleaning_pass_through_cents, type: integer, source: computed, description: "Sum of cleaning fees on qualifying bookings (informational pass-through)" }
      - { name: work_order_owner_charges_cents, type: integer, source: computed, description: "Sum of APPROVED billable-to-owner WorkOrder cost_cents posted to this statement" }
      - { name: tax_remitted_cents, type: integer, source: computed, description: "Sum of occupancy_tax_cents remitted for the period (finalize only)" }
      - { name: owner_payout_cents, type: integer, source: computed, description: "gross_rental - mgmt_fee - work_order_owner_charges" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | FINALIZED | PAID", constraints: "one of DRAFT, FINALIZED, PAID" }

  - name: StatementLine
    parent: null
    common_fields: false
    fields:
      - { name: statement_id, type: string, source: input, description: "FK -> OwnerStatement.id; owning statement" }
      - { name: line_type, type: enum, source: system, description: "RENTAL | MGMT_FEE | WORK_ORDER_CHARGE | TAX_REMITTANCE | CLEANING_PASS_THROUGH", constraints: "one of RENTAL, MGMT_FEE, WORK_ORDER_CHARGE, TAX_REMITTANCE, CLEANING_PASS_THROUGH" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents; positive = credit to owner, negative = debit" }
      - { name: source_ref, type: string, source: system, description: "Originating entity id (booking_id or work_order_id) or null for aggregate lines", constraints: "optional" }

  - name: Review
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; reviewed booking (must be CHECKED_OUT)" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; reviewed property" }
      - { name: rating, type: integer, source: input, description: "Star rating 1-5", constraints: "1 <= rating <= 5" }
      - { name: comment, type: string, source: input, description: "Free-text review", constraints: "optional" }
      - { name: author_role, type: enum, source: input, description: "GUEST | MANAGER", constraints: "one of GUEST, MANAGER" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | PUBLISHED | SUPPRESSED", constraints: "one of SUBMITTED, PUBLISHED, SUPPRESSED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Property
    initial_state: ONBOARDING
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ONBOARDING
        to: LISTED
        trigger: "POST /properties/{id}/list"
        actor: PropertyManager
        preconditions:
          - "Property has a Permit in status ACTIVE"
          - "current clock <= permit.expires_on (else ERR_PERMIT_EXPIRED)"
        side_effects: []
      - from: UNLISTED
        to: LISTED
        trigger: "POST /properties/{id}/list"
        actor: PropertyManager
        preconditions:
          - "Property has a Permit in status ACTIVE"
          - "current clock <= permit.expires_on (else ERR_PERMIT_EXPIRED)"
        side_effects: []
      - from: LISTED
        to: UNLISTED
        trigger: "POST /properties/{id}/unlist"
        actor: PropertyManager
        preconditions: []
        side_effects: []
      - from: LISTED
        to: UNLISTED
        trigger: "system (on POST /permits/{id}/revoke of the property's ACTIVE permit)"
        actor: system
        preconditions: []
        side_effects: ["cross-entity: property auto-unlisted when its active permit is revoked"]
      - from: ONBOARDING
        to: OFFBOARDED
        trigger: "POST /properties/{id}/offboard"
        actor: PropertyManager | PlatformAdmin
        preconditions: []
        side_effects:
          - "cascade L1: every non-terminal Booking on this property (stay_status in {HOLD, CONFIRMED}) transitions to CANCELLED"
          - "all ChannelListings on this property transition to DELISTED"
      - from: LISTED
        to: OFFBOARDED
        trigger: "POST /properties/{id}/offboard"
        actor: PropertyManager | PlatformAdmin
        preconditions: []
        side_effects:
          - "cascade L1: every non-terminal Booking (stay_status in {HOLD, CONFIRMED}) -> CANCELLED (this triggers each booking's own cancel cascade: cascade L2 its TurnoverTask -> CANCELLED, cascade L3 that task's Inspection -> CANCELLED)"
          - "all ChannelListings on this property -> DELISTED"
      - from: UNLISTED
        to: OFFBOARDED
        trigger: "POST /properties/{id}/offboard"
        actor: PropertyManager | PlatformAdmin
        preconditions: []
        side_effects:
          - "cascade L1: every non-terminal Booking (stay_status in {HOLD, CONFIRMED}) -> CANCELLED (each cancel cascades TurnoverTask -> Inspection)"
          - "all ChannelListings on this property -> DELISTED"

  - entity: Permit
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /permits/{id}/activate"
        actor: PropertyManager | PlatformAdmin
        preconditions: ["current clock <= expires_on (else ERR_PERMIT_EXPIRED)"]
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /permits/{id}/revoke"
        actor: PropertyManager | PlatformAdmin
        preconditions: []
        side_effects: ["cross-entity: if the permit's Property is LISTED, that Property -> UNLISTED"]

  - entity: ChannelListing
    initial_state: DRAFT
    terminal_states: [DELISTED]
    transitions:
      - from: DRAFT
        to: SYNCED
        trigger: "POST /channel-listings/{id}/sync"
        actor: PropertyManager
        preconditions: ["Property.status == LISTED (cross-entity)"]
        side_effects: []
      - from: PAUSED
        to: SYNCED
        trigger: "POST /channel-listings/{id}/sync"
        actor: PropertyManager
        preconditions: ["Property.status == LISTED (cross-entity)"]
        side_effects: []
      - from: SYNCED
        to: PAUSED
        trigger: "POST /channel-listings/{id}/pause"
        actor: PropertyManager
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: DELISTED
        trigger: "system (Property offboard cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SYNCED
        to: DELISTED
        trigger: "system (Property offboard cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: DELISTED
        trigger: "system (Property offboard cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Booking
    initial_state: HOLD           # stay_status dimension; screening_status starts PENDING as an independent parallel dimension
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      # --- screening_status dimension (parallel) ---
      - from: PENDING
        to: APPROVED
        trigger: "POST /bookings/{id}/screen {decision: APPROVED} (screening_status dimension)"
        actor: PropertyManager
        preconditions: ["guest.status != BANNED"]
        side_effects: []
      - from: PENDING
        to: DECLINED
        trigger: "POST /bookings/{id}/screen {decision: DECLINED} (screening_status dimension)"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "stay_status -> CANCELLED (declined screening cancels the hold)"
          - "release held calendar nights on the property"
      # --- stay_status dimension (parallel) ---
      - from: HOLD
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: PropertyManager | Guest
        preconditions: ["screening_status == APPROVED (cross-dimension dependency)"]
        side_effects: []
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /bookings/{id}/check-in"
        actor: PropertyManager
        preconditions:
          - "current clock >= check_in"
          - "the property's most recent TurnoverTask, if any, is in status INSPECTED (cross-entity Booking->TurnoverTask; else ERR_TURNOVER_NOT_READY)"
        side_effects: []
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /bookings/{id}/check-out"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "booking becomes eligible for owner-statement inclusion for its check_out period"
          - "booking becomes eligible for Review"
      - from: HOLD
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Guest | PropertyManager
        preconditions: []
        side_effects:
          - "compute refund_cents via cancellation_refund"
          - "release held calendar nights (calendar_availability invariant restored)"
          - "cascade L2: this booking's TurnoverTask (if any, non-terminal) -> CANCELLED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Guest | PropertyManager
        preconditions: []
        side_effects:
          - "compute refund_cents via cancellation_refund"
          - "release held calendar nights (calendar_availability invariant restored)"
          - "cascade L2: this booking's TurnoverTask (if any, non-terminal) -> CANCELLED, which itself cascade L3 sets that task's Inspection -> CANCELLED"

  - entity: TurnoverTask
    initial_state: SCHEDULED
    terminal_states: [INSPECTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /turnover-tasks/{id}/start"
        actor: Vendor
        preconditions: ["actor Vendor == assigned_vendor_id"]
        side_effects: []
      - from: IN_PROGRESS
        to: CLEANED
        trigger: "POST /turnover-tasks/{id}/complete"
        actor: Vendor
        preconditions: ["actor Vendor == assigned_vendor_id"]
        side_effects: []
      - from: CLEANED
        to: INSPECTED
        trigger: "system (POST /inspections with result PASS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEANED
        to: FAILED
        trigger: "system (POST /inspections with result FAIL)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /turnover-tasks/{id}/start (re-clean after failed inspection)"
        actor: Vendor
        preconditions: ["actor Vendor == assigned_vendor_id"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /turnover-tasks/{id}/cancel OR system (booking cancel / property offboard cascade)"
        actor: PropertyManager | system
        preconditions: []
        side_effects: ["cascade L3: any COMPLETED Inspection for this task -> CANCELLED"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /turnover-tasks/{id}/cancel OR system (booking cancel / property offboard cascade)"
        actor: PropertyManager | system
        preconditions: []
        side_effects: ["cascade L3: any COMPLETED Inspection for this task -> CANCELLED"]
      - from: CLEANED
        to: CANCELLED
        trigger: "POST /turnover-tasks/{id}/cancel OR system (booking cancel / property offboard cascade)"
        actor: PropertyManager | system
        preconditions: []
        side_effects: ["cascade L3: any COMPLETED Inspection for this task -> CANCELLED"]

  - entity: Inspection
    initial_state: COMPLETED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: COMPLETED
        to: CANCELLED
        trigger: "system (parent TurnoverTask cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WorkOrder
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /work-orders/{id}/assign {vendor_id}"
        actor: PropertyManager
        preconditions: ["referenced Vendor exists and status == ACTIVE"]
        side_effects: ["set vendor_id"]
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: Vendor
        preconditions: ["actor Vendor == vendor_id"]
        side_effects: []
      - from: IN_PROGRESS
        to: NEEDS_INFO
        trigger: "POST /work-orders/{id}/request-info"
        actor: Vendor | PropertyManager
        preconditions: []
        side_effects: []
      - from: NEEDS_INFO
        to: ASSIGNED
        trigger: "POST /work-orders/{id}/resume (revision loop back to ASSIGNED)"
        actor: PropertyManager
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: Vendor
        preconditions: ["actor Vendor == vendor_id"]
        side_effects: []
      - from: COMPLETED
        to: APPROVED
        trigger: "POST /work-orders/{id}/approve"
        actor: PropertyManager | Owner
        preconditions:
          - "if requires_owner_approval == true, actor MUST be the Owner of the property (else ERR_OWNER_APPROVAL_REQUIRED)"
        side_effects:
          - "cascade depth-2: if billable_to == OWNER, create a WORK_ORDER_CHARGE StatementLine (amount_cents = -cost_cents) on the owner's DRAFT OwnerStatement for the property's current-period; set owner_statement_id; this StatementLine insertion recomputes OwnerStatement.work_order_owner_charges_cents and owner_payout_cents"
      - from: COMPLETED
        to: REJECTED
        trigger: "POST /work-orders/{id}/reject"
        actor: PropertyManager | Owner
        preconditions: []
        side_effects: []

  - entity: OwnerStatement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /owner-statements/{id}/finalize"
        actor: PropertyManager
        preconditions:
          - "no WorkOrder on any of the owner's properties for the period is in a non-terminal status {OPEN, ASSIGNED, IN_PROGRESS, NEEDS_INFO, COMPLETED} (cross-entity OwnerStatement->WorkOrder; else ERR_OPEN_WORK_ORDERS)"
        side_effects:
          - "recompute final split (final variant of owner_statement_split)"
          - "create TAX_REMITTANCE StatementLine and set tax_remitted_cents"
      - from: FINALIZED
        to: DRAFT
        trigger: "POST /owner-statements/{id}/reopen"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "compensating action: remove derived TAX_REMITTANCE line, revert to provisional split; money-conservation invariant (mgmt_fee + owner_payout + work_order_owner_charges == gross_rental) preserved"
      - from: FINALIZED
        to: PAID
        trigger: "POST /owner-statements/{id}/pay"
        actor: PropertyManager
        preconditions: ["owner_payout_cents >= 0 (else ERR_NEGATIVE_PAYOUT)"]
        side_effects: []

  - entity: Review
    initial_state: SUBMITTED
    terminal_states: [SUPPRESSED]
    transitions:
      - from: SUBMITTED
        to: PUBLISHED
        trigger: "POST /reviews/{id}/publish"
        actor: PropertyManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: SUPPRESSED
        trigger: "POST /reviews/{id}/suppress"
        actor: PropertyManager
        preconditions: []
        side_effects: []
      - from: PUBLISHED
        to: SUPPRESSED
        trigger: "POST /reviews/{id}/suppress"
        actor: PropertyManager
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: pricing-rule-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /properties/{id}/pricing-rules"
    occ_field: "expected_property_version"
    description: |
      Creating a PricingRule against a Property whose version has advanced since
      the client last observed it is rejected. A newly created same-type
      overlapping PricingRule legitimately supersedes (deactivates) the prior
      one, so a create issued against a stale property view — one that has not
      seen an intervening pricing-rule creation — is rejected as a stale-version
      write rather than silently superseding based on outdated pricing.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: occupancy_pct
    trigger: "POST /bookings, POST /properties/{id}/quote"
    algorithm: aggregation
    formula: |
      window_start = check_in - 15 days
      window_end   = check_in + 15 days     # 30-day window, half-open [window_start, window_end)
      booked_nights = count of night-days in the window that fall inside the
        half-open interval [b.check_in, b.check_out) of any Booking b on the
        same property whose stay_status IN {HOLD, CONFIRMED, CHECKED_IN, CHECKED_OUT}
        (the booking under construction is NOT counted)
      occupancy_pct = floor(booked_nights / 30 * 100)
    input_set: "Bookings on the property with stay_status IN {HOLD, CONFIRMED, CHECKED_IN, CHECKED_OUT}; CANCELLED and DECLINED excluded"
    constants:
      WINDOW_HALF_DAYS: 15
      WINDOW_TOTAL_DAYS: 30
    precision: "integer floor"

  - name: dynamic_nightly_quote
    trigger: "POST /bookings, POST /properties/{id}/quote"
    algorithm: tiered_pricing
    formula: |
      base = property.base_nightly_rate_cents
      # (1) seasonal factor: among active SEASONAL PricingRules whose
      #     [start_date, end_date) covers check_in, pick highest priority
      #     (tie-break: created_at ASC); factor = multiplier_bps/10000, else 1.0
      # (2) occupancy factor from occupancy_pct tier:
      #        occupancy_pct >= OCC_HIGH_PCT -> OCC_HIGH_MULT
      #        occupancy_pct >= OCC_MID_PCT  -> OCC_MID_MULT
      #        else                          -> 1.0
      # (3) last-minute factor: if (check_in - current_clock) in whole days
      #        <= LAST_MINUTE_DAYS -> LAST_MINUTE_MULT else 1.0
      per_night = round_half_up(base * seasonal_factor * occupancy_factor * last_minute_factor)
      # pinned rounding order: round ONCE per night after the full product,
      # then multiply by nights
      nightly_subtotal_cents = per_night * nights
    input_set: "active SEASONAL/OCCUPANCY PricingRules on the property; occupancy_pct from occupancy_pct calc"
    constants:
      OCC_HIGH_PCT: 80
      OCC_MID_PCT: 50
      OCC_HIGH_MULT: 1.25
      OCC_MID_MULT: 1.10
      LAST_MINUTE_DAYS: 7
      LAST_MINUTE_MULT: 0.85
    precision: "round_half_up to whole cents, once per night"

  - name: booking_total
    trigger: "POST /bookings"
    algorithm: aggregation
    formula: |
      nights = (check_out - check_in) in whole days
      quoted_cleaning_fee_cents = property.cleaning_fee_cents
      taxable_base = nightly_subtotal_cents + quoted_cleaning_fee_cents
      occupancy_tax_cents = round_half_up(taxable_base * active_permit.occupancy_tax_pct / 100)
      total_cents = nightly_subtotal_cents + quoted_cleaning_fee_cents + occupancy_tax_cents
    input_set: "single booking; occupancy_tax_pct from the property's ACTIVE Permit (0 if none)"
    constants: {}
    precision: "round_half_up to whole cents"

  - name: cancellation_refund
    trigger: "POST /bookings/{id}/cancel"
    algorithm: threshold
    formula: |
      days_to_check_in = floor((check_in - current_clock) / 1 day)
      refund_pct by cancellation_policy (boundaries are >= inclusive):
        FLEXIBLE: days_to_check_in >= FLEX_FULL_DAYS -> 1.00 ; else 0.00
        MODERATE: days_to_check_in >= MOD_FULL_DAYS -> 1.00
                  days_to_check_in >= MOD_HALF_DAYS -> 0.50
                  else -> 0.00
        STRICT:   days_to_check_in >= STRICT_FULL_DAYS -> 1.00 ; else 0.00
      refundable_nightly = round_half_up(nightly_subtotal_cents * refund_pct)
      cleaning_refund = quoted_cleaning_fee_cents if (stay_status != CHECKED_IN AND refund_pct > 0) else 0
      tax_refund = round_half_up(occupancy_tax_cents * refund_pct)
      refund_cents = refundable_nightly + cleaning_refund + tax_refund
    input_set: "single booking"
    constants:
      FLEX_FULL_DAYS: 1
      MOD_FULL_DAYS: 30
      MOD_HALF_DAYS: 7
      STRICT_FULL_DAYS: 60
    precision: "round_half_up to whole cents"
    variants:
      - name: flexible_policy
        when: "booking.cancellation_policy == FLEXIBLE"
        difference: "full nightly refund whenever cancelled >= 1 day before check-in"
      - name: moderate_policy
        when: "booking.cancellation_policy == MODERATE"
        difference: "full only >= 30 days out; 50% in [7,30) days; 0 under 7 — diverges from FLEXIBLE for identical timing"

  - name: owner_statement_split
    trigger: "POST /owner-statements (provisional), POST /owner-statements/{id}/finalize (final), WorkOrder approve cascade, POST /owner-statements/{id}/reopen"
    algorithm: aggregation
    formula: |
      qualifying_bookings = Bookings b where b.property.owner_id == statement.owner_id
        AND b.stay_status == CHECKED_OUT
        AND month(b.check_out) == period_month AND year(b.check_out) == period_year
      # management fee is rounded PER BOOKING then summed (pinned order):
      for each qualifying booking b:
        booking_mgmt_fee = round_half_up(b.nightly_subtotal_cents * owner.default_management_fee_pct / 100)
      gross_rental_cents = sum(b.nightly_subtotal_cents)
      mgmt_fee_cents = sum(booking_mgmt_fee)                       # round-per-booking-then-sum
      cleaning_pass_through_cents = sum(b.quoted_cleaning_fee_cents)
      work_order_owner_charges_cents = sum(w.cost_cents) for WorkOrders w on the
        owner's properties with billable_to == OWNER, status == APPROVED, whose
        owner_statement_id == this statement
      owner_payout_cents = gross_rental_cents - mgmt_fee_cents - work_order_owner_charges_cents
      # tax_remitted_cents only set on finalize:
      tax_remitted_cents = sum(b.occupancy_tax_cents) over qualifying_bookings
    input_set: "CHECKED_OUT bookings whose check_out month/year matches the period; APPROVED billable-to-owner WorkOrders linked to the statement"
    constants: {}
    precision: "round_half_up per booking, then integer sums"
    variants:
      - name: provisional_at_generation
        when: "OwnerStatement.status == DRAFT"
        difference: "work_order_owner_charges_cents counts only WorkOrders APPROVED and linked at generation time; payout is provisional"
      - name: final_at_finalize
        when: "POST /owner-statements/{id}/finalize"
        difference: "re-aggregates including WorkOrders approved between generation and finalize; also sets tax_remitted_cents; payout differs from provisional when charges changed"

  - name: work_order_owner_charge
    trigger: "POST /work-orders (compute gate), POST /work-orders/{id}/approve (post charge)"
    algorithm: threshold
    formula: |
      requires_owner_approval = (billable_to == OWNER) AND (cost_cents > OWNER_APPROVAL_THRESHOLD_CENTS)
      # boundary is strict '>': cost_cents == OWNER_APPROVAL_THRESHOLD_CENTS does NOT require owner approval
      on approve, if billable_to == OWNER:
        post StatementLine { line_type: WORK_ORDER_CHARGE, amount_cents: -cost_cents, source_ref: work_order.id }
        to the owner's DRAFT OwnerStatement for the property's current period
    input_set: "single work order; threshold from constants"
    constants:
      OWNER_APPROVAL_THRESHOLD_CENTS: 50000
    precision: "integer cents"

  - name: vendor_turnover_overlap
    trigger: "POST /turnover-tasks"
    algorithm: interval_merge
    formula: |
      Requested window R = [start, end] (closed). For each existing TurnoverTask t
      on the SAME assigned_vendor_id with status IN {SCHEDULED, IN_PROGRESS, CLEANED, FAILED}:
        buffered_t = [t.start - TURNOVER_BUFFER_MINUTES, t.end + TURNOVER_BUFFER_MINUTES]
        conflict if R intersects buffered_t (closed-interval intersection: R.start <= buffered_t.end AND buffered_t.start <= R.end)
      Any conflict -> ERR_VENDOR_UNAVAILABLE. Contrast with booking overlap, which is
      half-open [check_in, check_out) with NO buffer (adjacent allowed).
    input_set: "non-terminal TurnoverTasks for the same vendor"
    constants:
      TURNOVER_BUFFER_MINUTES: 120
    precision: "minute-resolution datetime comparison"

  - name: calendar_availability
    trigger: "POST /bookings (occupy), POST /bookings/{id}/cancel (release)"
    algorithm: aggregation
    formula: |
      For a property and a date window [W_start, W_end):
      total_window_nights = (W_end - W_start) in days
      booked_nights = count of nights in the window covered by [b.check_in, b.check_out)
        for Bookings b with stay_status IN {HOLD, CONFIRMED, CHECKED_IN, CHECKED_OUT}
      blocked_nights = 0   # (no separate calendar-block entity in this scaffold)
      available_nights = total_window_nights - booked_nights - blocked_nights
      INVARIANT: available_nights + booked_nights + blocked_nights == total_window_nights
    input_set: "Bookings on the property with stay_status IN {HOLD, CONFIRMED, CHECKED_IN, CHECKED_OUT}"
    constants: {}
    precision: "integer night counts"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /guests, POST /properties/{id}/quote (Anonymous permitted)"
  - priority: 2
    category: auth
    check: "role is authorized for the endpoint per RBAC; entity_backed role acting on a resource must own it"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path id and referenced FK resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing resource ids"
  - priority: 4
    category: business_constraint
    check: "request body well-formed: required fields present, enums valid, numeric ranges (rating 1-5, cost_cents >= 0, check_out > check_in)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all mutating endpoints"
  - priority: 5
    category: state
    check: "target resource is in a valid state for the transition (generic)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 5
    category: state
    check: "booking creation: property.status == LISTED"
    error_id: ERR_PROPERTY_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /bookings"
  - priority: 5
    category: state
    check: "confirm: booking.screening_status == APPROVED"
    error_id: ERR_SCREENING_NOT_APPROVED
    http_status: 409
    applies_to: "POST /bookings/{id}/confirm"
  - priority: 5
    category: state
    check: "check-in: property's most recent TurnoverTask (if any) is INSPECTED"
    error_id: ERR_TURNOVER_NOT_READY
    http_status: 409
    applies_to: "POST /bookings/{id}/check-in"
  - priority: 5
    category: state
    check: "inspection: referenced TurnoverTask.status == CLEANED"
    error_id: ERR_TURNOVER_NOT_CLEANED
    http_status: 409
    applies_to: "POST /inspections"
  - priority: 5
    category: state
    check: "pay: statement.status == FINALIZED"
    error_id: ERR_STATEMENT_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /owner-statements/{id}/pay"
  - priority: 5
    category: state
    check: "list property / sync channel: property's Permit is ACTIVE"
    error_id: ERR_PERMIT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /properties/{id}/list"
  - priority: 5
    category: state
    check: "review creation: booking.stay_status == CHECKED_OUT"
    error_id: ERR_BOOKING_NOT_CHECKED_OUT
    http_status: 409
    applies_to: "POST /reviews"
  - priority: 6
    category: business_safety
    check: "booking creation / screen approve: guest.status != BANNED"
    error_id: ERR_GUEST_BANNED
    http_status: 403
    applies_to: "POST /bookings, POST /bookings/{id}/screen"
  - priority: 6
    category: business_safety
    check: "inspection: inspector_vendor_id != turnover_task.assigned_vendor_id (segregation of duties)"
    error_id: ERR_SOD_INSPECTOR_IS_CLEANER
    http_status: 409
    applies_to: "POST /inspections"
  - priority: 6
    category: business_safety
    check: "list property / activate permit: current clock <= permit.expires_on"
    error_id: ERR_PERMIT_EXPIRED
    http_status: 409
    applies_to: "POST /properties/{id}/list, POST /permits/{id}/activate"
  - priority: 7
    category: business_referential
    check: "finalize: no non-terminal WorkOrder for the owner's properties in the period"
    error_id: ERR_OPEN_WORK_ORDERS
    http_status: 409
    applies_to: "POST /owner-statements/{id}/finalize"
  - priority: 7
    category: business_referential
    check: "approve billable-to-owner over-threshold work order: actor must be the property's Owner"
    error_id: ERR_OWNER_APPROVAL_REQUIRED
    http_status: 403
    applies_to: "POST /work-orders/{id}/approve"
  - priority: 8
    category: business_constraint
    check: "turnover creation: assigned Vendor.vendor_type == CLEANER"
    error_id: ERR_VENDOR_NOT_CLEANER
    http_status: 422
    applies_to: "POST /turnover-tasks"
  - priority: 8
    category: business_constraint
    check: "booking creation: min-stay rule satisfied (nights >= active MIN_STAY rule min_nights)"
    error_id: ERR_MIN_STAY_NOT_MET
    http_status: 422
    applies_to: "POST /bookings"
  - priority: 9
    category: business_temporal
    check: "booking creation: requested [check_in, check_out) does not overlap any Booking on the property with stay_status IN {HOLD, CONFIRMED, CHECKED_IN} (half-open; adjacent allowed)"
    error_id: ERR_DATES_UNAVAILABLE
    http_status: 409
    applies_to: "POST /bookings"
  - priority: 9
    category: business_temporal
    check: "turnover creation: assigned vendor has no other non-terminal TurnoverTask whose [start,end] window, expanded by TURNOVER_BUFFER_MINUTES on both sides, intersects the requested window"
    error_id: ERR_VENDOR_UNAVAILABLE
    http_status: 409
    applies_to: "POST /turnover-tasks"
  - priority: 10
    category: business_fiscal
    check: "pay: owner_payout_cents >= 0"
    error_id: ERR_NEGATIVE_PAYOUT
    http_status: 409
    applies_to: "POST /owner-statements/{id}/pay"
  - priority: 11
    category: state
    check: "OCC: expected_property_version matches Property.version on pricing-rule create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /properties/{id}/pricing-rules"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Clock (test-driving) -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601 for all date/window/expiry comparisons"]

  # ----- Owner -----
  - method: POST
    path: "/owners"
    description: "Create an Owner"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, email, "payout_method?", default_management_fee_pct]
    output: Owner
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/owners/{id}"
    description: "Get an Owner"
    roles: [PlatformAdmin, PropertyManager, Owner]
    code: 200
    input: []
    output: Owner
    side_effects: []

  # ----- Guest -----
  - method: POST
    path: "/guests"
    description: "Register a Guest (self-service or operator)"
    roles: [Anonymous, PlatformAdmin, PropertyManager]
    code: 201
    input: [full_name, email, "government_id_verified?"]
    output: Guest
    side_effects: ["status=UNSCREENED"]
  - method: GET
    path: "/guests/{id}"
    description: "Get a Guest"
    roles: [PlatformAdmin, PropertyManager, Guest]
    code: 200
    input: []
    output: Guest
    side_effects: []
  - method: POST
    path: "/guests/{id}/ban"
    description: "Ban a Guest"
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: []
    output: Guest
    side_effects: ["status=BANNED"]

  # ----- Vendor -----
  - method: POST
    path: "/vendors"
    description: "Create a Vendor"
    roles: [PlatformAdmin, PropertyManager]
    code: 201
    input: [name, vendor_type, email]
    output: Vendor
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/vendors/{id}"
    description: "Get a Vendor"
    roles: [PlatformAdmin, PropertyManager, Vendor]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  # ----- Property -----
  - method: POST
    path: "/properties"
    description: "Create a Property (starts ONBOARDING)"
    roles: [PlatformAdmin, PropertyManager]
    code: 201
    input: [owner_id, address, city, state_code, jurisdiction_code, base_nightly_rate_cents, cleaning_fee_cents, max_occupancy, "default_cancellation_policy?"]
    output: Property
    side_effects: ["status=ONBOARDING", "version=1"]
  - method: GET
    path: "/properties/{id}"
    description: "Get a Property"
    roles: [PlatformAdmin, PropertyManager, Owner]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/properties"
    description: "List Properties (filter by owner_id)"
    roles: [PlatformAdmin, PropertyManager, Owner]
    code: 200
    input: ["owner_id?", "status?", "limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: POST
    path: "/properties/{id}/list"
    description: "List (publish) a property"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Property
    side_effects: ["ONBOARDING/UNLISTED -> LISTED; requires ACTIVE non-expired Permit"]
  - method: POST
    path: "/properties/{id}/unlist"
    description: "Unlist a property"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Property
    side_effects: ["LISTED -> UNLISTED"]
  - method: POST
    path: "/properties/{id}/offboard"
    description: "Offboard a property (cascades)"
    roles: [PropertyManager, PlatformAdmin]
    code: 200
    input: []
    output: Property
    side_effects: ["-> OFFBOARDED", "cascade cancel non-terminal Bookings -> TurnoverTasks -> Inspections", "DELIST all ChannelListings"]
  - method: POST
    path: "/properties/{id}/pricing-rules"
    description: "Create a PricingRule (OCC on Property.version; supersedes same-type overlapping active rules)"
    roles: [PropertyManager]
    code: 201
    input: [rule_type, "multiplier_bps?", "min_nights?", "start_date?", "end_date?", priority, expected_property_version]
    output: PricingRule
    side_effects: ["deactivate (active=false) same-type active rules whose date window overlaps", "increments Property.version by 1"]
  - method: GET
    path: "/properties/{id}/pricing-rules"
    description: "List a property's PricingRules"
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: ["rule_type?", "active?"]
    output: PricingRule[]
    side_effects: []
  - method: POST
    path: "/properties/{id}/quote"
    description: "Compute a dynamic price quote for a date window without creating a booking"
    roles: [PlatformAdmin, PropertyManager, Guest, Anonymous]
    code: 200
    input: [check_in, check_out]
    output: "{ per_night_rate_cents: integer, nights: integer, nightly_subtotal_cents: integer, cleaning_fee_cents: integer, occupancy_tax_cents: integer, total_cents: integer, occupancy_pct: integer }"
    side_effects: []

  # ----- Permit -----
  - method: POST
    path: "/permits"
    description: "Create a Permit (PENDING)"
    roles: [PlatformAdmin, PropertyManager]
    code: 201
    input: [property_id, permit_number, jurisdiction_code, occupancy_tax_pct, issued_on, expires_on]
    output: Permit
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/permits/{id}"
    description: "Get a Permit"
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/permits"
    description: "List Permits (filter by property_id)"
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: ["property_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/permits/{id}/activate"
    description: "Activate a Permit"
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: []
    output: Permit
    side_effects: ["PENDING -> ACTIVE"]
  - method: POST
    path: "/permits/{id}/revoke"
    description: "Revoke a Permit"
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: []
    output: Permit
    side_effects: ["ACTIVE -> REVOKED", "cross-entity: if Property LISTED -> UNLISTED"]

  # ----- ChannelListing -----
  - method: POST
    path: "/channel-listings"
    description: "Create a ChannelListing (DRAFT)"
    roles: [PropertyManager]
    code: 201
    input: [property_id, channel, "external_listing_ref?"]
    output: ChannelListing
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/channel-listings/{id}"
    description: "Get a ChannelListing"
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: []
    output: ChannelListing
    side_effects: []
  - method: GET
    path: "/channel-listings"
    description: "List ChannelListings (filter by property_id)"
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: ["property_id?", "channel?", "status?", "limit?", "offset?"]
    output: ChannelListing[]
    side_effects: []
  - method: POST
    path: "/channel-listings/{id}/sync"
    description: "Sync a ChannelListing to a channel"
    roles: [PropertyManager]
    code: 200
    input: []
    output: ChannelListing
    side_effects: ["DRAFT/PAUSED -> SYNCED; requires Property LISTED"]
  - method: POST
    path: "/channel-listings/{id}/pause"
    description: "Pause a ChannelListing"
    roles: [PropertyManager]
    code: 200
    input: []
    output: ChannelListing
    side_effects: ["SYNCED -> PAUSED"]

  # ----- PricingRule (single read) -----
  - method: GET
    path: "/pricing-rules/{id}"
    description: "Get a PricingRule"
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: []
    output: PricingRule
    side_effects: []

  # ----- Booking -----
  - method: POST
    path: "/bookings"
    description: "Create a Booking (HOLD, screening PENDING; locks quote and holds calendar nights)"
    roles: [Guest, PropertyManager, Anonymous]
    code: 201
    input: [property_id, guest_id, check_in, check_out, "cancellation_policy?"]
    output: Booking
    side_effects: ["compute quoted_per_night_cents/nightly_subtotal/occupancy_tax/total via dynamic_nightly_quote + booking_total", "stay_status=HOLD, screening_status=PENDING", "hold calendar nights"]
  - method: GET
    path: "/bookings/{id}"
    description: "Get a Booking"
    roles: [PlatformAdmin, PropertyManager, Guest]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/bookings"
    description: "List Bookings (filter by property_id or guest_id)"
    roles: [PlatformAdmin, PropertyManager, Guest]
    code: 200
    input: ["property_id?", "guest_id?", "stay_status?", "screening_status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []
  - method: POST
    path: "/bookings/{id}/screen"
    description: "Screen a booking's guest (APPROVED/DECLINED)"
    roles: [PropertyManager]
    code: 200
    input: [decision]
    output: Booking
    side_effects: ["screening_status set", "DECLINED -> stay_status CANCELLED + release nights"]
  - method: POST
    path: "/bookings/{id}/confirm"
    description: "Confirm a booking"
    roles: [PropertyManager, Guest]
    code: 200
    input: []
    output: Booking
    side_effects: ["HOLD -> CONFIRMED; requires screening APPROVED"]
  - method: POST
    path: "/bookings/{id}/check-in"
    description: "Check in a booking"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Booking
    side_effects: ["CONFIRMED -> CHECKED_IN; requires clock>=check_in and property's latest turnover INSPECTED"]
  - method: POST
    path: "/bookings/{id}/check-out"
    description: "Check out a booking"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Booking
    side_effects: ["CHECKED_IN -> CHECKED_OUT; becomes statement- and review-eligible"]
  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a booking"
    roles: [Guest, PropertyManager]
    code: 200
    input: []
    output: Booking
    side_effects: ["HOLD/CONFIRMED -> CANCELLED", "compute refund_cents", "release nights", "cascade cancel TurnoverTask -> Inspection"]
  - method: POST
    path: "/bookings/{id}/messages"
    description: "Append a message to a booking thread"
    roles: [Guest, PropertyManager]
    code: 201
    input: [body, "sender_role?"]
    output: Booking
    side_effects: ["append { sender_role, body, at } to messages"]

  # ----- TurnoverTask -----
  - method: POST
    path: "/turnover-tasks"
    description: "Schedule a cleaning turnover for a checked-out booking"
    roles: [PropertyManager]
    code: 201
    input: [booking_id, property_id, assigned_vendor_id, scheduled_window_start, scheduled_window_end]
    output: TurnoverTask
    side_effects: ["status=SCHEDULED", "vendor buffer-overlap check", "vendor must be CLEANER"]
  - method: GET
    path: "/turnover-tasks/{id}"
    description: "Get a TurnoverTask"
    roles: [PlatformAdmin, PropertyManager, Vendor]
    code: 200
    input: []
    output: TurnoverTask
    side_effects: []
  - method: GET
    path: "/turnover-tasks"
    description: "List TurnoverTasks (filter by booking_id / property_id / assigned_vendor_id)"
    roles: [PlatformAdmin, PropertyManager, Vendor]
    code: 200
    input: ["booking_id?", "property_id?", "assigned_vendor_id?", "status?", "limit?", "offset?"]
    output: TurnoverTask[]
    side_effects: []
  - method: POST
    path: "/turnover-tasks/{id}/start"
    description: "Start a turnover (assigned cleaner)"
    roles: [Vendor]
    code: 200
    input: []
    output: TurnoverTask
    side_effects: ["SCHEDULED/FAILED -> IN_PROGRESS"]
  - method: POST
    path: "/turnover-tasks/{id}/complete"
    description: "Mark turnover cleaned"
    roles: [Vendor]
    code: 200
    input: []
    output: TurnoverTask
    side_effects: ["IN_PROGRESS -> CLEANED"]
  - method: POST
    path: "/turnover-tasks/{id}/cancel"
    description: "Cancel a turnover"
    roles: [PropertyManager]
    code: 200
    input: []
    output: TurnoverTask
    side_effects: ["-> CANCELLED", "cascade cancel COMPLETED Inspection"]

  # ----- Inspection -----
  - method: POST
    path: "/inspections"
    description: "Record a turnover inspection (SoD: inspector != cleaner)"
    roles: [Vendor, PropertyManager]
    code: 201
    input: [turnover_task_id, inspector_vendor_id, result, "notes?"]
    output: Inspection
    side_effects: ["turnover CLEANED -> INSPECTED (PASS) or FAILED (FAIL)", "status=COMPLETED"]
  - method: GET
    path: "/inspections/{id}"
    description: "Get an Inspection"
    roles: [PlatformAdmin, PropertyManager, Vendor]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/inspections"
    description: "List Inspections (filter by turnover_task_id / inspector_vendor_id)"
    roles: [PlatformAdmin, PropertyManager, Vendor]
    code: 200
    input: ["turnover_task_id?", "inspector_vendor_id?", "result?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  # ----- WorkOrder -----
  - method: POST
    path: "/work-orders"
    description: "Create a WorkOrder (OPEN)"
    roles: [PropertyManager, Owner, Vendor]
    code: 201
    input: [property_id, description, cost_cents, billable_to, "vendor_id?"]
    output: WorkOrder
    side_effects: ["status=OPEN", "requires_owner_approval = (billable_to==OWNER and cost_cents > OWNER_APPROVAL_THRESHOLD_CENTS)"]
  - method: GET
    path: "/work-orders/{id}"
    description: "Get a WorkOrder"
    roles: [PlatformAdmin, PropertyManager, Owner, Vendor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/work-orders"
    description: "List WorkOrders (filter by property_id / vendor_id / owner_statement_id)"
    roles: [PlatformAdmin, PropertyManager, Owner, Vendor]
    code: 200
    input: ["property_id?", "vendor_id?", "owner_statement_id?", "status?", "billable_to?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/assign"
    description: "Assign a vendor to a work order"
    roles: [PropertyManager]
    code: 200
    input: [vendor_id]
    output: WorkOrder
    side_effects: ["OPEN -> ASSIGNED", "set vendor_id"]
  - method: POST
    path: "/work-orders/{id}/start"
    description: "Start a work order (assigned vendor)"
    roles: [Vendor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["ASSIGNED -> IN_PROGRESS"]
  - method: POST
    path: "/work-orders/{id}/request-info"
    description: "Mark a work order NEEDS_INFO"
    roles: [Vendor, PropertyManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["IN_PROGRESS -> NEEDS_INFO"]
  - method: POST
    path: "/work-orders/{id}/resume"
    description: "Resume a NEEDS_INFO work order back to ASSIGNED (revision loop)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["NEEDS_INFO -> ASSIGNED"]
  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Complete a work order"
    roles: [Vendor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["IN_PROGRESS -> COMPLETED"]
  - method: POST
    path: "/work-orders/{id}/approve"
    description: "Approve a completed work order"
    roles: [PropertyManager, Owner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["COMPLETED -> APPROVED", "over-threshold owner-billable requires Owner actor", "cascade: billable-to-owner posts WORK_ORDER_CHARGE StatementLine + recompute payout"]
  - method: POST
    path: "/work-orders/{id}/reject"
    description: "Reject a completed work order"
    roles: [PropertyManager, Owner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["COMPLETED -> REJECTED"]

  # ----- OwnerStatement -----
  - method: POST
    path: "/owner-statements"
    description: "Generate an owner statement for a period (DRAFT, provisional split)"
    roles: [PropertyManager, PlatformAdmin]
    code: 201
    input: [owner_id, period_year, period_month]
    output: OwnerStatement
    side_effects: ["aggregate CHECKED_OUT bookings for period", "compute provisional split + RENTAL/MGMT_FEE/CLEANING_PASS_THROUGH lines"]
  - method: GET
    path: "/owner-statements/{id}"
    description: "Get an OwnerStatement"
    roles: [PlatformAdmin, PropertyManager, Owner]
    code: 200
    input: []
    output: OwnerStatement
    side_effects: []
  - method: GET
    path: "/owner-statements"
    description: "List OwnerStatements (filter by owner_id)"
    roles: [PlatformAdmin, PropertyManager, Owner]
    code: 200
    input: ["owner_id?", "status?", "period_year?", "period_month?", "limit?", "offset?"]
    output: OwnerStatement[]
    side_effects: []
  - method: GET
    path: "/owner-statements/{id}/lines"
    description: "List a statement's StatementLines"
    roles: [PlatformAdmin, PropertyManager, Owner]
    code: 200
    input: ["line_type?"]
    output: StatementLine[]
    side_effects: []
  - method: POST
    path: "/owner-statements/{id}/finalize"
    description: "Finalize a statement (final split + tax remittance)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: OwnerStatement
    side_effects: ["DRAFT -> FINALIZED", "recompute final split", "create TAX_REMITTANCE line", "requires no open work orders in period"]
  - method: POST
    path: "/owner-statements/{id}/reopen"
    description: "Reopen a finalized statement to DRAFT (compensating)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: OwnerStatement
    side_effects: ["FINALIZED -> DRAFT", "remove derived TAX_REMITTANCE line, revert to provisional; conservation invariant preserved", "increments OwnerStatement.version by 1"]
  - method: POST
    path: "/owner-statements/{id}/pay"
    description: "Pay a finalized statement"
    roles: [PropertyManager]
    code: 200
    input: []
    output: OwnerStatement
    side_effects: ["FINALIZED -> PAID; requires owner_payout_cents >= 0"]

  # ----- Review -----
  - method: POST
    path: "/reviews"
    description: "Create a Review for a checked-out booking"
    roles: [Guest, PropertyManager]
    code: 201
    input: [booking_id, property_id, rating, "comment?", author_role]
    output: Review
    side_effects: ["status=SUBMITTED; requires booking CHECKED_OUT"]
  - method: GET
    path: "/reviews/{id}"
    description: "Get a Review"
    roles: [PlatformAdmin, PropertyManager, Guest]
    code: 200
    input: []
    output: Review
    side_effects: []
  - method: GET
    path: "/reviews"
    description: "List Reviews (filter by booking_id / property_id)"
    roles: [PlatformAdmin, PropertyManager, Guest]
    code: 200
    input: ["booking_id?", "property_id?", "status?", "limit?", "offset?"]
    output: Review[]
    side_effects: []
  - method: POST
    path: "/reviews/{id}/publish"
    description: "Publish a review"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Review
    side_effects: ["SUBMITTED -> PUBLISHED"]
  - method: POST
    path: "/reviews/{id}/suppress"
    description: "Suppress a review"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Review
    side_effects: ["SUBMITTED/PUBLISHED -> SUPPRESSED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or entity_backed actor does not own the resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or referenced FK does not resolve to an existing resource" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range number, check_out <= check_in" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the resource's current state" }
  - { id: ERR_PROPERTY_NOT_BOOKABLE, http: 409, condition: "Booking created against a property whose status is not LISTED" }
  - { id: ERR_SCREENING_NOT_APPROVED, http: 409, condition: "Confirm attempted while screening_status != APPROVED" }
  - { id: ERR_TURNOVER_NOT_READY, http: 409, condition: "Check-in attempted while the property's most recent TurnoverTask is not INSPECTED" }
  - { id: ERR_TURNOVER_NOT_CLEANED, http: 409, condition: "Inspection recorded against a turnover not in CLEANED status" }
  - { id: ERR_STATEMENT_NOT_FINALIZED, http: 409, condition: "Pay attempted on a statement not in FINALIZED status" }
  - { id: ERR_PERMIT_NOT_ACTIVE, http: 409, condition: "Property list attempted without an ACTIVE permit" }
  - { id: ERR_BOOKING_NOT_CHECKED_OUT, http: 409, condition: "Review created for a booking not in CHECKED_OUT status" }
  - { id: ERR_GUEST_BANNED, http: 403, condition: "Booking/screening for a guest whose status is BANNED" }
  - { id: ERR_SOD_INSPECTOR_IS_CLEANER, http: 409, condition: "Inspection inspector_vendor_id equals the turnover's assigned_vendor_id (segregation of duties)" }
  - { id: ERR_PERMIT_EXPIRED, http: 409, condition: "List/activate attempted when current clock is past permit.expires_on" }
  - { id: ERR_OPEN_WORK_ORDERS, http: 409, condition: "Finalize attempted while a non-terminal WorkOrder exists for the owner's properties in the period" }
  - { id: ERR_OWNER_APPROVAL_REQUIRED, http: 403, condition: "Over-threshold billable-to-owner work order approved by a non-Owner actor" }
  - { id: ERR_VENDOR_NOT_CLEANER, http: 422, condition: "Turnover assigned to a vendor whose vendor_type is not CLEANER" }
  - { id: ERR_MIN_STAY_NOT_MET, http: 422, condition: "Booking nights below an active MIN_STAY rule's min_nights" }
  - { id: ERR_DATES_UNAVAILABLE, http: 409, condition: "Requested booking interval overlaps an existing HOLD/CONFIRMED/CHECKED_IN booking (half-open)" }
  - { id: ERR_VENDOR_UNAVAILABLE, http: 409, condition: "Vendor's buffered turnover window intersects an existing non-terminal task" }
  - { id: ERR_NEGATIVE_PAYOUT, http: 409, condition: "Pay attempted on a statement whose owner_payout_cents < 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_property_version does not match Property.version on pricing-rule create" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational superuser: clock, owners, vendors, guests, statements generation, offboarding"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /owners"
    shared_operations:
      - "POST /properties"
      - "POST /owner-statements"
      - "POST /properties/{id}/offboard"
      - "GET (any resource)"
  - name: PropertyManager
    description: "Manages properties, pricing, permits, channels, bookings screening, turnovers, work orders, statements, reviews"
    identity: "opaque"
    exclusive_operations:
      - "POST /properties/{id}/list"
      - "POST /properties/{id}/unlist"
      - "POST /properties/{id}/pricing-rules"
      - "POST /channel-listings/{id}/sync"
      - "POST /channel-listings/{id}/pause"
      - "POST /bookings/{id}/screen"
      - "POST /bookings/{id}/check-in"
      - "POST /bookings/{id}/check-out"
      - "POST /turnover-tasks"
      - "POST /turnover-tasks/{id}/cancel"
      - "POST /work-orders/{id}/assign"
      - "POST /work-orders/{id}/resume"
      - "POST /owner-statements/{id}/finalize"
      - "POST /owner-statements/{id}/reopen"
      - "POST /owner-statements/{id}/pay"
      - "POST /reviews/{id}/publish"
      - "POST /reviews/{id}/suppress"
    shared_operations:
      - "POST /permits, POST /permits/{id}/activate, POST /permits/{id}/revoke"
      - "POST /bookings, POST /bookings/{id}/confirm, POST /bookings/{id}/cancel, POST /bookings/{id}/messages"
      - "POST /work-orders, POST /work-orders/{id}/approve, POST /work-orders/{id}/reject, POST /work-orders/{id}/request-info"
      - "POST /reviews"
      - "POST /vendors, POST /guests"
  - name: Owner
    description: "Property owner; views own properties/statements; approves over-threshold owner-billable work orders; may offboard own property"
    identity: "entity_backed:Owner"
    exclusive_operations: []
    shared_operations:
      - "GET /properties (own), GET /owner-statements (own), GET /work-orders (own), GET /owner-statements/{id}/lines"
      - "POST /work-orders, POST /work-orders/{id}/approve, POST /work-orders/{id}/reject"
  - name: Guest
    description: "Books stays, messages, cancels own booking, submits reviews"
    identity: "entity_backed:Guest"
    exclusive_operations: []
    shared_operations:
      - "POST /bookings, POST /bookings/{id}/confirm, POST /bookings/{id}/cancel, POST /bookings/{id}/messages"
      - "POST /reviews"
      - "GET /bookings (own), GET /guests/{id} (self)"
  - name: Vendor
    description: "Cleaner/inspector/maintenance crew; executes turnovers, records inspections, works work orders"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /turnover-tasks/{id}/start"
      - "POST /turnover-tasks/{id}/complete"
      - "POST /work-orders/{id}/start"
      - "POST /work-orders/{id}/complete"
    shared_operations:
      - "POST /inspections"
      - "POST /work-orders, POST /work-orders/{id}/request-info"
      - "GET /turnover-tasks (own), GET /inspections, GET /work-orders (own)"
  - name: Anonymous
    description: "Unauthenticated public surface: guest self-registration, price quotes, and inquiry bookings"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /guests"
      - "POST /properties/{id}/quote"
      - "POST /bookings"
