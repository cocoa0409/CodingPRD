        distinguishing_aspect: "Customer OCC: an adjustment with the current version succeeds (version 1 -> 2, allocation 3); a replay with the stale version is 412 ERR_STALE_VERSION; an adjustment with the current version but below the occupied+reserved floor (1 open reservation) is 409 ERR_ALLOCATION_BELOW_FLOOR; floor-equal value (1) succeeds."
