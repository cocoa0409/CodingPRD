scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (>= 2 instances, DIFFERENT entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: stability_channel_divergence_on_one_patient_row
        grounds:
          - calculations.stability_score_direction_a
          - calculations.take_home_readiness_direction_b
          - entities.Patient.fields.stability_score
          - validations[priority=19]
          - errors[ERR_STABILITY_BELOW_THRESHOLD]
        distinguishing_aspect: "The two stability channels read the same Patient row at the same instant on the same entity and differ by exactly the standing penalties plus the journal look-back discount: Direction A publishes 65.5 while Direction B reads 28.0, which is below the STABILIZATION floor of 75.0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One CA program with a 20-carry quota, a METHADONE lot, one Physician, one Nurse and one Medical Director."
            - "One patient with transportation_type NO_RELIABLE_TRANSPORT, admitted 2026-09-01, who then misses two consecutive scheduled doses, giving missed_dose_streak 2 and denial_count_12mo 2."
            - "The logical clock has advanced to 2026-12-15 so time_in_treatment_days is 105."
          setup_api_calls:
            - &k_clock
              call: "POST /otp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - &k_prog
              call: "POST /otp/programs"
              payload: { name: "BayMark Riverside", state_code: "CA", clinic_hours_start: "06:00", clinic_hours_end: "11:00", open_days: ["MO", "TU", "WE", "TH", "FR", "SA"], max_daily_dose_slots: 120, max_daily_mg_methadone: 120.0, max_daily_mg_buprenorphine: 24.0, guest_dosing_enabled: true, dose_checkin_grace_minutes: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - &k_quota
              call: "POST /otp/programs/${prog_id}/carry-quota"
              payload: { allotted_carries: 10 }
              as: ProgramAdministrator
              captures: { quota_id: $.data.id }
            - &k_lot
              call: "POST /otp/inventory-lots"
              payload: { program_id: "${prog_id}", medication: "METHADONE", lot_number: "LOT-A1", expiration_date: "2027-06-30", quantity_received_mg: 50000.0, dose_potency_mg_per_unit: 1.0, reusable_for_take_home: true }
              as: ProgramAdministrator
              captures: { lot_id: $.data.id }
            - &k_phys
              call: "POST /otp/users"
              payload: { program_id: "${prog_id}", full_name: "Paul Physician", staff_role: "PHYSICIAN", license_number: "MD-3001" }
              as: ProgramAdministrator
              captures: { phys_id: $.data.id }
            - &k_nurse
              call: "POST /otp/users"
              payload: { program_id: "${prog_id}", full_name: "Nora Nurse", staff_role: "NURSE", license_number: "RN-1001" }
              as: ProgramAdministrator
              captures: { nurse_id: $.data.id }
            - &k_md
              call: "POST /otp/users"
              payload: { program_id: "${prog_id}", full_name: "Miles Director", staff_role: "MEDICAL_DIRECTOR", license_number: "MD-2001" }
              as: ProgramAdministrator
              captures: { md_id: $.data.id }
            - &k_patient
              call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:9f2c41aa", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "NO_RELIABLE_TRANSPORT", one_way_travel_minutes: 95 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - &k_admit
              call: "POST /otp/patients/${pat_id}/confirm-diagnosis"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - &k_order
              call: "POST /otp/dose-orders"
              payload: { patient_id: "${pat_id}", medication: "METHADONE", ordered_daily_mg: 90.0, split_dose_authorized: false }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { ord_id: $.data.id }
            - &k_activate
              call: "POST /otp/dose-orders/${ord_id}/activate"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - &k_dose1
              call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-09-02", scheduled_datetime: "2026-09-02T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { dose1_id: $.data.id }
            - &k_dose1_miss
              call: "POST /otp/dose-dispenses/${dose1_id}/mark-missed"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - &k_dose2
              call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-09-03", scheduled_datetime: "2026-09-03T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { dose2_id: $.data.id }
            - &k_dose2_miss
              call: "POST /otp/dose-dispenses/${dose2_id}/mark-missed"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - &k_clock_dec
              call: "POST /otp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: ProgramAdministrator
            - &k_reconcile_maint
              call: "PATCH /otp/patients/${pat_id}/treatment-phase"
              payload: { treatment_phase: "MAINTENANCE", reconciled_days: 1 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_v1: $.data.version }
            - &k_priv_hold
              call: "POST /otp/take-home-privileges"
              payload: { patient_id: "${pat_id}", requested_carries: 1, carry_interval_days: 7, expected_patient_version: "${pat_v1}" }
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { priv_id: $.data.id, priv_v0: $.data.version }
          trigger:
            - call: "GET /otp/patients/${pat_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
            - call: "POST /otp/take-home-privileges/${priv_id}/evaluate"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { err_stab: $.data.error_id }
          assert:
            - "GET /otp/patients/${pat_id} returns stability_score == 65.5"
            - "TakeHomePrivilege.${priv_id}.decision == DENIED and denial_reason_code == STABILITY_BELOW_THRESHOLD"
            - "the evaluate call returns 422 and err_stab == ERR_STABILITY_BELOW_THRESHOLD"
            - "Patient.stability_score != 0.0, so the published Direction A figure is not the value that gated the carry"

      - name: dose_tariff_per_component_versus_sum_then_round_delta
        grounds:
          - calculations.otp_dose_tariff
          - entities.DoseDispense.fields.dispensed_mg
          - endpoints.GET_/otp/dose-dispenses/{doseId}/charge-preview
        distinguishing_aspect: "Both variants price the identical dispensed dose on the DoseDispense entity domain, one round per component and one round at the end; at ordered_mg 90 the per-component figure is 392.31 and the sum-then-round figure is 392.30."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program, quota, lot, Physician, Nurse, Medical Director."
            - "One admitted, ACTIVE patient on a 90 mg METHADONE order with split_dose_authorized false."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_lot
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - *k_clock_dec
          trigger:
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-12-16", scheduled_datetime: "2026-12-16T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { dose_id: $.data.id }
            - call: "POST /otp/dose-dispenses/${dose_id}/check-in"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${dose_id}/verify"
              payload: { identity_matched: true }
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${dose_id}/dispense"
              payload: { dispensed_mg: 90.0, wasted_mg: 0.0, returned_mg: 0.0, inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${dose_id}/complete"
              payload: { dispensed_mg: 90.0, wasted_mg: 0.0, returned_mg: 0.0 }
              as: Nurse
              as_user_id: "${nurse_id}"
          assert:
            - "GET /otp/dose-dispenses/${dose_id}/charge-preview reports total_charge_per_component_rounded == 392.31"
            - "the same response reports total_charge_sum_then_round == 392.30"
            - "per_component_delta == 0.01"
            - "DoseDispense.${dose_id}.status == COMPLETED and dispensed_mg == 90.0"
            - "InventoryLot.${lot_id}.running_on_hand_mg == 49910.0"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (>= 2 instances, DIFFERENT modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: carry_cap_waterfall_nested_three_cap_min
        grounds:
          - calculations.carry_cap_waterfall
          - entities.CarryQuotaLedger.fields.available_carries
          - entities.TakeHomePrivilege.fields.eligible_carry_cap
          - validations[priority=20]
          - errors[ERR_PROGRAM_CARRY_QUOTA_EXHAUSTED]
        distinguishing_aspect: "Mode (a): three caps interact by nesting — the time-in-treatment table allows 6, the program pool cap is floor((10 - 0) / 2) = 5, and the request is 6, so min(6, 6, 5) = 5 and the pool is the binding term."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program with allotted_carries 10."
            - "One admitted patient on a 90 mg METHADONE order, journal reconciled for the prior day, treatment phase MAINTENANCE, time_in_treatment_days 105."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - *k_clock_dec
            - *k_reconcile_maint
            - *k_priv_hold
          trigger:
            - call: "POST /otp/take-home-privileges/${priv_id}/evaluate"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { priv_after: $.data.id }
          assert:
            - "TakeHomePrivilege.${priv_id}.decision == APPROVED"
            - "TakeHomePrivilege.${priv_id}.eligible_carry_cap == 5"
            - "TakeHomePrivilege.${priv_id}.approved_carries == 5"
            - "TakeHomePrivilege.${priv_id}.evaluation_basis == TIME_IN_TREATMENT"
            - "GET /otp/programs/${prog_id}/carry-quota reports granted_carries == 5 and available_carries == 5"
            - "response_type is object and the response status is 200 — a reduced grant is not an error"

      - name: dose_tariff_nested_rounding_order_is_pinned
        grounds:
          - calculations.otp_dose_tariff
          - entities.DoseDispense.fields.wasted_mg
          - entities.Program.fields.max_daily_mg_methadone
        distinguishing_aspect: "Mode (b): the rounding order is pinned per component then summed, so a 100 mg METHADONE order dispensed as 90 mg with 10 mg wasted prices to 460.31 by the pinned order and 460.30 by sum-then-round; the pinned order is the one the dispense endpoint records."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program, quota, lot, Physician, Nurse, Medical Director."
            - "One admitted, ACTIVE patient on a 100 mg METHADONE order; the program ceiling is 120 mg so no over-ceiling term applies."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_lot
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - call: "POST /otp/dose-orders"
              payload: { patient_id: "${pat_id}", medication: "METHADONE", ordered_daily_mg: 100.0, split_dose_authorized: false }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { ord100_id: $.data.id }
            - call: "POST /otp/dose-orders/${ord100_id}/activate"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - *k_clock_dec
          trigger:
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord100_id}", dose_date: "2026-12-17", scheduled_datetime: "2026-12-17T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { dose100_id: $.data.id }
            - call: "POST /otp/dose-dispenses/${dose100_id}/check-in"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${dose100_id}/verify"
              payload: { identity_matched: true }
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${dose100_id}/dispense"
              payload: { dispensed_mg: 90.0, wasted_mg: 10.0, returned_mg: 0.0, inventory_lot_id: "${lot_id}", witness_staff_id: "staff-witness-77" }
              as: Nurse
              as_user_id: "${nurse_id}"
          assert:
            - "GET /otp/dose-dispenses/${dose100_id}/charge-preview reports total_charge_per_component_rounded == 460.31"
            - "the same response reports total_charge_sum_then_round == 460.30"
            - "DoseDispense.${dose100_id}.status == DISPENSED and wasted_mg == 10.0"
            - "InventoryTransaction rows for InventoryLot.${lot_id} include one WASTE row with quantity_mg == -10.0 and witness_staff_id == \"staff-witness-77\""
            - "InventoryLot.${lot_id}.running_on_hand_mg == 49900.0"

      - name: readiness_evaluation_order_pinned_against_stale_posting
        grounds:
          - calculations.take_home_readiness_direction_b
          - entities.Patient.fields.stability_posting
          - state_machines.TakeHomePrivilege.PENDING_REVIEW_to_APPROVED
        distinguishing_aspect: "Mode (c): Direction B is only well-defined once the evaluation order is pinned as Direction A recomputed first, then the standing penalties, then the look-back discount — reading the 50.0 admission-time stability_posting instead of the freshly recomputed 75.0 Direction A value yields 50.0 and a denial, while the pinned order yields 75.0 and an approval at the MAINTENANCE floor of 70.0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program with allotted_carries 10."
            - "One patient admitted at 2026-09-01 and activated on a 90 mg METHADONE order, with zero completed doses and zero counseling sessions, so Direction A is 75.0 by the 25.0-point treatment-days term alone."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - *k_clock_dec
            - *k_reconcile_maint
            - *k_priv_hold
          trigger:
            - call: "POST /otp/take-home-privileges/${priv_id}/evaluate"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
          assert:
            - "TakeHomePrivilege.${priv_id}.decision == APPROVED"
            - "TakeHomePrivilege.${priv_id}.denial_reason_code is null"
            - "GET /otp/patients/${pat_id} reports stability_score == 75.0"
            - "TakeHomePrivilege.${priv_id}.approved_carries == 1 and evaluation_basis == TIME_IN_TREATMENT"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (>= 2 instances, DIFFERENT entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: take_home_privilege_cycle_approve_revoke_reissue
        grounds:
          - state_machines.TakeHomePrivilege.PENDING_REVIEW_to_APPROVED
          - state_machines.TakeHomePrivilege.APPROVED_to_REVOKED
          - state_machines.TakeHomePrivilege.REVOKED_to_PENDING_REVIEW
          - entities.TakeHomePrivilege.fields.reissued_from_privilege_id
        distinguishing_aspect: "The TakeHomePrivilege machine is cyclic rather than a pipeline: one privilege reaches APPROVED, is driven back through REVOKED, and a second privilege row is opened back at PENDING_REVIEW with reissued_from_privilege_id pointing at the first — the same entity re-enters its initial state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program with allotted_carries 10."
            - "One patient admitted, journal reconciled, phase MAINTENANCE, time_in_treatment_days 105."
            - "A first privilege has already been evaluated to APPROVED with 1 carry."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - *k_clock_dec
            - *k_reconcile_maint
            - *k_priv_hold
            - call: "POST /otp/take-home-privileges/${priv_id}/evaluate"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { priv_v1: $.data.version }
          trigger:
            - call: "POST /otp/take-home-privileges/${priv_id}/revoke"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
            - call: "GET /otp/patients/${pat_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { pat_v_after_revoke: $.data.version }
            - call: "POST /otp/take-home-privileges"
              payload: { patient_id: "${pat_id}", requested_carries: 1, carry_interval_days: 7, expected_patient_version: "${pat_v_after_revoke}", reissued_from_privilege_id: "${priv_id}" }
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { priv2_id: $.data.id }
          assert:
            - "TakeHomePrivilege.${priv_id}.decision == REVOKED"
            - "TakeHomePrivilege.${priv_id}.freed_carries == 1 and approved_carries == 0"
            - "TakeHomePrivilege.${priv2_id}.decision == PENDING_REVIEW"
            - "TakeHomePrivilege.${priv2_id}.reissued_from_privilege_id == ${priv_id}"
            - "GET /otp/programs/${prog_id}/carry-quota reports granted_carries == 0 and available_carries == 10"
            - "GET /otp/take-home-carry-ledgers?patient_id=${pat_id} reports carry_variance == 0"

      - name: patient_parallel_standing_dimensions_evolve_independently
        grounds:
          - state_machines.Patient.ACTIVE_to_SUSPENDED_NON_COMPLIANT
          - state_machines.Patient.SUSPENDED_NON_COMPLIANT_to_ACTIVE
          - entities.Patient.fields.counseling_standing
          - entities.Patient.fields.diversion_standing
        distinguishing_aspect: "Two independent state dimensions live on the same Patient row: a diversion case drives diversion_standing CLEAR to UNDER_INVESTIGATION while the patient's status is still ACTIVE, and the reinstatement arc then returns status to ACTIVE with diversion_standing left where the diversion machine put it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program, quota, lot, Physician, Nurse, Medical Director."
            - "One admitted, ACTIVE patient on a 90 mg METHADONE order."
            - "Three scheduled doses on consecutive open days have each been marked missed, so missed_dose_streak reaches 3."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_lot
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - *k_dose1
            - *k_dose1_miss
            - *k_dose2
            - *k_dose2_miss
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-09-04", scheduled_datetime: "2026-09-04T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { dose3_id: $.data.id }
            - call: "POST /otp/dose-dispenses/${dose3_id}/mark-missed"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - *k_clock_dec
            - call: "POST /otp/diversion-cases"
              payload: { program_id: "${prog_id}", patient_id: "${pat_id}", related_dose_dispense_id: "${dose3_id}", detection_source: "COUNT_MISMATCH", severity: "MAJOR" }
              as: RegulatoryAuditor
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /otp/diversion-cases/${case_id}/begin-review"
              payload: {}
              as: RegulatoryAuditor
            - call: "GET /otp/patients/${pat_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
          assert:
            - "Patient.${pat_id}.status == SUSPENDED_NON_COMPLIANT"
            - "Patient.${pat_id}.diversion_standing == UNDER_INVESTIGATION"
            - "Patient.${pat_id}.counseling_standing == REVIEW_OVERDUE"
            - "Patient.${pat_id}.missed_dose_streak == 3 and denial_count_12mo == 3"
            - "Patient.${pat_id}.treatment_phase == INDUCTION"
            - "DiversionCase.${case_id}.status == UNDER_REVIEW"
            - "the CDS does not move Patient.status — the diversion machine owns diversion_standing only"

      - name: dose_dispense_fork_join_three_way_branch
        grounds:
          - state_machines.DoseDispense.ARRIVED_AT_CLINIC_to_NURSE_VERIFIED
          - state_machines.DoseDispense.ARRIVED_AT_CLINIC_to_VERIFICATION_FAILED
          - state_machines.DoseDispense.ARRIVED_AT_CLINIC_to_CANCELLED
          - state_machines.DoseDispense.NURSE_VERIFIED_to_DISPENSED
        distinguishing_aspect: "DoseDispense is fork-join rather than linear: from the single state ARRIVED_AT_CLINIC three distinct triggers fork to NURSE_VERIFIED, VERIFICATION_FAILED and CANCELLED, and only the NURSE_VERIFIED branch can reach DISPENSED, so the branches have divergent side-effect sets."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program, quota, lot, Physician, Nurse, Medical Director."
            - "One admitted, ACTIVE patient on a 90 mg METHADONE order with three scheduled observed doses."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_lot
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-12-21", scheduled_datetime: "2026-12-21T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { fork_a: $.data.id }
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-12-22", scheduled_datetime: "2026-12-22T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { fork_b: $.data.id }
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-12-23", scheduled_datetime: "2026-12-23T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { fork_c: $.data.id }
            - call: "POST /otp/dose-dispenses/${fork_a}/check-in"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${fork_b}/check-in"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${fork_c}/check-in"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /otp/dose-dispenses/${fork_a}/verify"
              payload: { identity_matched: true }
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${fork_b}/verify"
              payload: { identity_matched: false }
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${fork_c}/cancel"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
          assert:
            - "DoseDispense.${fork_a}.status == NURSE_VERIFIED and verification_result == PASSED"
            - "DoseDispense.${fork_b}.status == VERIFICATION_FAILED and verification_result == FAILED"
            - "DoseDispense.${fork_c}.status == CANCELLED and completed_at is not null"
            - "only DoseDispense.${fork_a} can still reach DISPENSED — POST /otp/dose-dispenses/${fork_b}/dispense returns 409 ERR_DOSE_NOT_VERIFIED"
            - "InventoryTransaction rows for InventoryLot.${lot_id} remain 0 after all three branches"
  # ===========================================================================
  # Rule 4 — transitive_cascade (>= 2 instances from DIFFERENT triggers,
  #          at least one depth >= 3 and one depth >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: diversion_confirmation_cascade_privilege_dose_lot
        grounds:
          - state_machines.DiversionCase.UNDER_REVIEW_to_CONFIRMED
          - state_machines.TakeHomePrivilege.APPROVED_to_REVOKED
          - entities.InventoryLot.fields.status
          - calculations.program_posture_ladder
          - entities.Program.fields.open_diversion_case_count
        distinguishing_aspect: "Depth 3 driven by the diversion-confirmation transition: confirming the case revokes the patient's privilege, which is what cancels the take-home dose, which is what quarantines the lot — the lot is untouched by the confirmation request itself."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program with allotted_carries 10, a reusable lot, and the four staff users."
            - "One patient admitted, journal reconciled, phase MAINTENANCE, time_in_treatment_days 105, with an APPROVED privilege holding 1 carry and one SCHEDULED take-home dose drawing on the reusable lot."
            - "A diversion case exists against that patient, opened but not yet reviewed."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_lot
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - *k_clock_dec
            - *k_reconcile_maint
            - *k_priv_hold
            - call: "POST /otp/take-home-privileges/${priv_id}/evaluate"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
            - call: "GET /otp/dose-dispenses?privilege_id=${priv_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { th_dose_id: "$.data[0].id" }
            - call: "POST /otp/diversion-cases"
              payload: { program_id: "${prog_id}", patient_id: "${pat_id}", detection_source: "COUNT_MISMATCH", severity: "MAJOR" }
              as: RegulatoryAuditor
              captures: { case_id: $.data.id }
            - call: "POST /otp/diversion-cases/${case_id}/begin-review"
              payload: {}
              as: RegulatoryAuditor
          trigger:
            - call: "POST /otp/diversion-cases/${case_id}/confirm"
              payload: { outcome_summary: "Count mismatch reproduced across two open days at the dispensing window." }
              as: RegulatoryAuditor
          assert:
            - "DiversionCase.${case_id}.status == CONFIRMED"
            - "Patient.${pat_id}.diversion_standing == CONFIRMED_DIVERSION"
            - "TakeHomePrivilege.${priv_id}.decision == REVOKED and freed_carries == 1"
            - "TakeHomePrivilege.${priv_id}.approved_carries == 0"
            - "DoseDispense.${th_dose_id}.status == CANCELLED"
            - "InventoryLot.${lot_id}.status == QUARANTINED"
            - "GET /otp/programs/${prog_id} reports posture == RESTRICTED and posture_reason_code == DIVERSION_CASE_OPEN"
            - "GET /otp/programs/${prog_id}/carry-quota reports granted_carries == 0 and available_carries == 10"

      - name: exception_grant_cascade_privilege_carries_patient
        grounds:
          - state_machines.TakeHomeException.SUPERVISOR_REVIEW_to_GRANTED
          - state_machines.TakeHomePrivilege.DENIED_to_APPROVED_WITH_EXCEPTION
          - calculations.phase_stability_exception_cap
          - entities.Patient.fields.carries_used
          - entities.CarryQuotaLedger.fields.granted_carries
        distinguishing_aspect: "Depth 4 driven by the exception-grant transition: the grant flips the exception, which flips the linked privilege, which synthesizes take-home dose rows, which debits the program quota ledger, which refreshes the patient's carry counter — a chain the exception endpoint itself never names."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program with allotted_carries 20."
            - "One patient admitted, journal reconciled, phase MAINTENANCE, but time_in_treatment_days 95 so the ordinary path denies with TIME_IN_TREATMENT_INSUFFICIENT would not fire — instead the ordinary path is forced to deny by treatment phase INDUCTION being recorded at evaluation time."
            - "A privilege exists at DENIED, and an exception has been routed to SUPERVISOR_REVIEW with requested_carries 4."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_lot
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - *k_clock_dec
            - *k_reconcile_maint
            - call: "PATCH /otp/patients/${pat_id}/treatment-phase"
              payload: { treatment_phase: "STABILIZATION", reconciled_days: 1 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_v2: $.data.version }
            - call: "POST /otp/take-home-privileges"
              payload: { patient_id: "${pat_id}", requested_carries: 6, carry_interval_days: 7, expected_patient_version: "${pat_v2}" }
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { priv_id: $.data.id, priv_v_hold: $.data.version }
            - call: "POST /otp/take-home-privileges/${priv_id}/evaluate"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
            - call: "GET /otp/take-home-privileges/${priv_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { priv_v_denied: $.data.version }
            - call: "POST /otp/take-home-exceptions"
              payload: { patient_id: "${pat_id}", requested_carries: 4, exception_type: "TRAVEL_HARDSHIP", clinical_justification: "Patient travels 95 minutes each way with no reliable transport and cannot attend daily dosing during the winter road closures.", supervisor_id: "${md_id}", expected_privilege_version: "${priv_v_denied}" }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { exc_id: $.data.id }
            - call: "POST /otp/take-home-exceptions/${exc_id}/route"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - *k_reconcile_maint
          trigger:
            - call: "POST /otp/take-home-exceptions/${exc_id}/decision"
              payload: { decision: "GRANT", granted_carries: 4 }
              as: MedicalDirector
              as_user_id: "${md_id}"
          assert:
            - "TakeHomeException.${exc_id}.status == GRANTED and granted_carries == 4"
            - "TakeHomeException.${exc_id}.evaluated_domain_b == true"
            - "TakeHomePrivilege.${priv_id}.decision == APPROVED_WITH_EXCEPTION"
            - "TakeHomePrivilege.${priv_id}.evaluation_basis == PHASE_STABILITY"
            - "TakeHomePrivilege.${priv_id}.exception_id == ${exc_id}"
            - "GET /otp/dose-dispenses?privilege_id=${priv_id} returns exactly 4 rows each with source_type == TAKE_HOME_ISSUANCE"
            - "GET /otp/programs/${prog_id}/carry-quota reports granted_carries == 4 and available_carries == 16"
            - "GET /otp/take-home-carry-ledgers?patient_id=${pat_id} reports carried_issued_mg == 360.0, carried_voided_mg == 0.0, carried_dispensed_mg == 0.0 and carried_balance_mg == 360.0"

      - name: missed_dose_cascade_patient_order_dose_ledger
        grounds:
          - state_machines.DoseDispense.SCHEDULED_to_MISSED
          - state_machines.Patient.ACTIVE_to_SUSPENDED_NON_COMPLIANT
          - state_machines.DoseOrder.ACTIVE_to_SUSPENDED
          - entities.TakeHomeCarryLedger.fields.carried_voided_mg
        distinguishing_aspect: "Depth 4 driven by the missed-dose transition: recording the third miss moves the patient to SUSPENDED_NON_COMPLIANT, which is what suspends the dose order, which is what cancels the remaining scheduled doses, which is what voids the carried milligrams on the ledger — the mark-missed request names none of these."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program with allotted_carries 20, reusable lot, and the four staff users."
            - "One ACTIVE patient with an ACTIVE 90 mg METHADONE order, an APPROVED privilege holding 1 carry, one completed take-home dose, and three further scheduled observed doses."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_lot
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - *k_clock_dec
            - *k_reconcile_maint
            - *k_priv_hold
            - call: "POST /otp/take-home-privileges/${priv_id}/evaluate"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-12-21", scheduled_datetime: "2026-12-21T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { miss_1: $.data.id }
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-12-22", scheduled_datetime: "2026-12-22T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { miss_2: $.data.id }
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-12-23", scheduled_datetime: "2026-12-23T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { miss_3: $.data.id }
            - call: "POST /otp/dose-dispenses/${miss_1}/mark-missed"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /otp/dose-dispenses/${miss_2}/mark-missed"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /otp/dose-dispenses/${miss_3}/mark-missed"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
          assert:
            - "DoseDispense.${miss_3}.status == MISSED"
            - "Patient.${pat_id}.missed_dose_streak == 3"
            - "Patient.${pat_id}.status == SUSPENDED_NON_COMPLIANT"
            - "DoseOrder.${ord_id}.status == SUSPENDED"
            - "GET /otp/dose-dispenses?dose_order_id=${ord_id}&status=SCHEDULED returns 0 rows"
            - "TakeHomePrivilege.${priv_id}.decision == REVOKED"
            - "GET /otp/take-home-carry-ledgers?patient_id=${pat_id} reports carried_issued_mg == 90.0 and carried_voided_mg == 90.0, so carried_balance_mg == 0.0"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (>= 2, DIFFERENT error-category
  #          pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_and_business_safety_pair_on_verify_under_frozen_posture
        grounds:
          - state_machines.DoseDispense.SCHEDULED_to_ARRIVED_AT_CLINIC
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_DOSE_NOT_SCHEDULED]
          - errors[ERR_PROGRAM_OPERATIONALLY_BLOCKED]
        distinguishing_aspect: "The state versus business_safety pair: a dose that has already left its SCHEDULED state and whose program is FROZEN fails both check 7 and check 8, and check 7 wins with ERR_DOSE_NOT_SCHEDULED because state preconditions outrank safety gates."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program, quota, lot, and the four staff users."
            - "One ACTIVE patient with an ACTIVE order and one dose already checked in so it is ARRIVED_AT_CLINIC."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_lot
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - *k_clock_dec
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-12-21", scheduled_datetime: "2026-12-21T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { dose_id: $.data.id }
            - call: "POST /otp/dose-dispenses/${dose_id}/check-in"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /otp/programs/${prog_id}/suspend"
              payload: {}
              as: RegulatoryAuditor
              captures: { err_never: $.data.error_id }
          assert:
            - "after the suspension, DoseDispense.${dose_id}.status == CANCELLED"
            - "POST /otp/dose-dispenses/${dose_id}/check-in returns 409"
            - "the returned error_id == ERR_DOSE_NOT_SCHEDULED"
            - "the returned error_id != ERR_PROGRAM_OPERATIONALLY_BLOCKED"
            - "GET /otp/programs/${prog_id} reports posture == FROZEN, so the safety gate was also violated and lost the priority contest"

      - name: temporal_and_fiscal_pair_on_scheduling_a_full_day
        grounds:
          - validations[priority=13]
          - validations[priority=21]
          - errors[ERR_NO_DOSE_CAPACITY]
          - errors[ERR_NO_ELIGIBLE_LOT]
        distinguishing_aspect: "The business_temporal versus business_fiscal pair: scheduling the slot that would exceed max_daily_dose_slots while the only usable lot is also short of the ordered milligrams returns ERR_NO_DOSE_CAPACITY, not ERR_NO_ELIGIBLE_LOT, because the temporal constraint is checked before the inventory ceiling."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. A CA program with max_daily_dose_slots 2 and a lot holding only 100.0 mg so it cannot cover a 90 mg dispense twice."
            - "One ACTIVE patient with an ACTIVE 90 mg order and one further ACTIVE patient sharing the same program."
          setup_api_calls:
            - *k_clock
            - call: "POST /otp/programs"
              payload: { name: "BayMark Foothill", state_code: "CA", clinic_hours_start: "06:00", clinic_hours_end: "11:00", open_days: ["MO", "TU", "WE", "TH", "FR"], max_daily_dose_slots: 2, max_daily_mg_methadone: 120.0, max_daily_mg_buprenorphine: 24.0, guest_dosing_enabled: true, dose_checkin_grace_minutes: 30 }
              as: ProgramAdministrator
              captures: { prog2_id: $.data.id }
            - call: "POST /otp/inventory-lots"
              payload: { program_id: "${prog2_id}", medication: "METHADONE", lot_number: "LOT-SMALL", expiration_date: "2027-06-30", quantity_received_mg: 100.0, dose_potency_mg_per_unit: 1.0, reusable_for_take_home: false }
              as: ProgramAdministrator
              captures: { small_lot_id: $.data.id }
            - call: "POST /otp/users"
              payload: { program_id: "${prog2_id}", full_name: "Paul Physician", staff_role: "PHYSICIAN", license_number: "MD-3001" }
              as: ProgramAdministrator
              captures: { phys2_id: $.data.id }
            - call: "POST /otp/users"
              payload: { program_id: "${prog2_id}", full_name: "Nora Nurse", staff_role: "NURSE", license_number: "RN-1001" }
              as: ProgramAdministrator
              captures: { nurse2_id: $.data.id }
            - call: "POST /otp/patients"
              payload: { program_id: "${prog2_id}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:9f2c41aa", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "PRIVATE_VEHICLE", one_way_travel_minutes: 15 }
              as: Physician
              as_user_id: "${phys2_id}"
              captures: { pat2_id: $.data.id }
            - call: "POST /otp/patients/${pat2_id}/confirm-diagnosis"
              payload: {}
              as: Physician
              as_user_id: "${phys2_id}"
            - call: "POST /otp/dose-orders"
              payload: { patient_id: "${pat2_id}", medication: "METHADONE", ordered_daily_mg: 90.0, split_dose_authorized: false }
              as: Physician
              as_user_id: "${phys2_id}"
              captures: { ord2_id: $.data.id }
            - call: "POST /otp/dose-orders/${ord2_id}/activate"
              payload: {}
              as: Physician
              as_user_id: "${phys2_id}"
            - call: "POST /otp/patients"
              payload: { program_id: "${prog2_id}", full_name: "Evan Patient", date_of_birth: "1990-08-11", government_id_hash: "sha256:11bb77cc", diagnosis_code: "F11_10", home_state_code: "CA", home_address: "9 Creek Way", transportation_type: "PUBLIC_TRANSIT", one_way_travel_minutes: 40 }
              as: Physician
              as_user_id: "${phys2_id}"
              captures: { pat3_id: $.data.id }
            - call: "POST /otp/patients/${pat3_id}/confirm-diagnosis"
              payload: {}
              as: Physician
              as_user_id: "${phys2_id}"
            - call: "POST /otp/dose-orders"
              payload: { patient_id: "${pat3_id}", medication: "METHADONE", ordered_daily_mg: 90.0, split_dose_authorized: false }
              as: Physician
              as_user_id: "${phys2_id}"
              captures: { ord3_id: $.data.id }
            - call: "POST /otp/dose-orders/${ord3_id}/activate"
              payload: {}
              as: Physician
              as_user_id: "${phys2_id}"
            - *k_clock_dec
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord2_id}", dose_date: "2026-12-21", scheduled_datetime: "2026-12-21T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${small_lot_id}" }
              as: Nurse
              as_user_id: "${nurse2_id}"
              captures: { slot_1: $.data.id }
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord3_id}", dose_date: "2026-12-21", scheduled_datetime: "2026-12-21T08:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${small_lot_id}" }
              as: Nurse
              as_user_id: "${nurse2_id}"
              captures: { slot_2: $.data.id }
          trigger:
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord2_id}", dose_date: "2026-12-21", scheduled_datetime: "2026-12-21T09:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${small_lot_id}" }
              as: Nurse
              as_user_id: "${nurse2_id}"
              captures: { err_capacity: $.data.error_id }
          assert:
            - "the request returns 409 and err_capacity == ERR_NO_DOSE_CAPACITY"
            - "err_capacity != ERR_NO_ELIGIBLE_LOT"
            - "GET /otp/dose-dispenses?program_id=${prog2_id}&dose_date=2026-12-21 returns exactly 2 rows"
            - "InventoryLot.${small_lot_id}.running_on_hand_mg == 100.0, so no dose was dispensed while resolving the conflict"
            - "err_capacity != ERR_INVENTORY_CEILING_EXCEEDED"

      - name: referential_and_safety_pair_on_carry_evaluation_without_journal
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - errors[ERR_TIME_IN_TREATMENT_INSUFFICIENT]
          - errors[ERR_STABILITY_BELOW_THRESHOLD]
        distinguishing_aspect: "The business_referential versus business_safety pair: a patient who is both under 90 days in treatment and below the readiness floor returns ERR_TIME_IN_TREATMENT_INSUFFICIENT, not ERR_STABILITY_BELOW_THRESHOLD, because the referential carry gate is ordered above the stability gate."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced only to 2026-11-15 so time_in_treatment_days is 75. Base CA program with allotted_carries 10."
            - "One admitted ACTIVE patient on a 90 mg METHADONE order with NO_RELIABLE_TRANSPORT, no completed doses and no counseling sessions, so the readiness reading is far below the floor as well."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_lot
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - call: "POST /otp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: ProgramAdministrator
              captures: { pad: $.data }
            - call: "PATCH /otp/patients/${pat_id}/treatment-phase"
              payload: { treatment_phase: "INDUCTION", reconciled_days: 1 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_v_ind: $.data.version }
            - call: "POST /otp/take-home-privileges"
              payload: { patient_id: "${pat_id}", requested_carries: 2, carry_interval_days: 7, expected_patient_version: "${pat_v_ind}" }
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { priv_id: $.data.id }
          trigger:
            - call: "POST /otp/take-home-privileges/${priv_id}/evaluate"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { err_carry: $.data.error_id }
          assert:
            - "the request returns 422 and err_carry == ERR_TIME_IN_TREATMENT_INSUFFICIENT"
            - "err_carry != ERR_STABILITY_BELOW_THRESHOLD"
            - "TakeHomePrivilege.${priv_id}.decision == DENIED"
            - "TakeHomePrivilege.${priv_id}.denial_reason_code == TIME_IN_TREATMENT_INSUFFICIENT"
            - "err_carry != ERR_TIMETABLE_LOOKAHEAD_FAILED, so the journal gate was satisfied and did not pre-empt the referential gate"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (>= 2, DIFFERENT metrics, DIFFERENT
  #          endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: variance_tolerance_is_strict_greater_than
        grounds:
          - calculations.diversion_variance_flag
          - calculations.inventory_variance_write_off
          - entities.Program.fields.latest_inventory_variance_mg
          - endpoints.POST_/otp/inventory-reconciliations/{period}/close
        distinguishing_aspect: "The numeric threshold boundary: the period dispense total is 10000.0 mg so the relative tolerance is 200.0 mg exactly, and a variance of exactly 200.0 mg must not be flagged while 200.5 mg must be, so the comparison is strict greater-than and not greater-or-equal."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program, quota, lot, Physician, Nurse, Medical Director."
            - "The lot holds 10000.0 mg and exactly 10000.0 mg has been dispensed across this period, so period_dispensed_mg is 10000.0 and the relative tolerance is 200.0."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - call: "POST /otp/inventory-lots"
              payload: { program_id: "${prog_id}", medication: "METHADONE", lot_number: "LOT-155", expiration_date: "2027-06-30", quantity_received_mg: 10150.0, dose_potency_mg_per_unit: 1.0, reusable_for_take_home: true }
              as: ProgramAdministrator
              captures: { lot_id: $.data.id }
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - *k_clock_dec
            - call: "POST /otp/inventory-transactions"
              payload: { lot_id: "${lot_id}", transaction_type: "DISPENSE", quantity_mg: -10000.0 }
              as: ProgramAdministrator
          trigger:
            - call: "POST /otp/inventory-reconciliations/2026-12/close"
              payload: { program_id: "${prog_id}" }
              as: ProgramAdministrator
          assert:
            - "the response reports tolerance_mg == 200.0"
            - "the response reports program_variance_mg == 150.0"
            - "the response reports flagged == false, because 150.0 is not strictly greater than 200.0"
            - "GetInventoryProgram reports latest_inventory_variance_mg == 150.0"
            - "the response reports write_off_mg == 0.0, so no adjustment row was written"

      - name: readiness_floor_is_inclusive_at_seventy
        grounds:
          - calculations.take_home_readiness_direction_b
          - state_machines.TakeHomePrivilege.PENDING_REVIEW_to_APPROVED
          - entities.Patient.fields.stability_score
        distinguishing_aspect: "The inclusive threshold boundary on a different metric and a different endpoint: a MAINTENANCE patient whose readiness reading is exactly 70.0 clears the floor and is approved, while the same patient one day less in treatment reads 69.9 and is denied, pinning the comparison as greater-or-equal."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program with allotted_carries 10."
            - "One admitted ACTIVE patient, PRIVATE_VEHICLE, 120 days in treatment at the clock, journal reconciled, phase MAINTENANCE, with no completed doses and no counseling so the readiness reading is exactly (50 + 25 - 2.0 - 1.5) = 71.5 at 100 days and 70.0 at 80 days."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_phys
            - *k_nurse
            - *k_md
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:9f2c41aa", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "PRIVATE_VEHICLE", one_way_travel_minutes: 15 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_id: $.data.id }
            - *k_admit
            - *k_order
            - *k_activate
            - call: "POST /otp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-20T00:00:00Z" }
              as: ProgramAdministrator
            - call: "PATCH /otp/patients/${pat_id}/treatment-phase"
              payload: { treatment_phase: "MAINTENANCE", reconciled_days: 1 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_v80: $.data.version }
            - call: "POST /otp/take-home-privileges"
              payload: { patient_id: "${pat_id}", requested_carries: 1, carry_interval_days: 7, expected_patient_version: "${pat_v80}" }
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { priv_id: $.data.id }
          trigger:
            - call: "POST /otp/take-home-privileges/${priv_id}/evaluate"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
          assert:
            - "Patient.${pat_id}.time_in_treatment_days == 80"
            - "GET /otp/patients/${pat_id} reports stability_score == 70.0"
            - "TakeHomePrivilege.${priv_id}.decision == APPROVED, so 70.0 clears the MAINTENANCE floor at exactly the boundary"
            - "TakeHomePrivilege.${priv_id}.denial_reason_code is null"
            - "TakeHomePrivilege.${priv_id}.approved_carries == 1"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (>= 2, DIFFERENT entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: dose_check_in_gated_by_program_status
        grounds:
          - state_machines.DoseDispense.SCHEDULED_to_ARRIVED_AT_CLINIC
          - state_machines.Program.ACTIVE_to_SUSPENDED
          - validations[priority=8]
          - errors[ERR_PROGRAM_OPERATIONALLY_BLOCKED]
        distinguishing_aspect: "The DoseDispense-to-Program pair: a fully valid, correctly scheduled, in-window dose is still rejected at 409 with ERR_PROGRAM_OPERATIONALLY_BLOCKED because the Program entity's status is SUSPENDED — the dose's own state and clinic window are both correct."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program, quota, lot, and the four staff users."
            - "One ACTIVE patient with an ACTIVE order and one SCHEDULED dose inside the clinic window."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_lot
            - *k_phys
            - *k_nurse
            - *k_md
            - *k_patient
            - *k_admit
            - *k_order
            - *k_activate
            - *k_clock_dec
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-12-21", scheduled_datetime: "2026-12-21T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { dose_id: $.data.id }
            - call: "POST /otp/programs/${prog_id}/suspend"
              payload: {}
              as: RegulatoryAuditor
            - call: "POST /otp/programs/${prog_id}/resume"
              payload: {}
              as: RegulatoryAuditor
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-12-22", scheduled_datetime: "2026-12-22T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { dose2_id: $.data.id }
          trigger:
            - call: "POST /otp/programs/${prog_id}/suspend"
              payload: {}
              as: RegulatoryAuditor
            - call: "POST /otp/dose-dispenses/${dose2_id}/check-in"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { err_frozen: $.data.error_id }
          assert:
            - "the check-in returns 409 and err_frozen == ERR_PROGRAM_OPERATIONALLY_BLOCKED"
            - "DoseDispense.${dose2_id}.status == CANCELLED, so the dose never became ARRIVED_AT_CLINIC"
            - "DoseDispense.${dose2_id}.arrived_at is null"
            - "GET /otp/programs/${prog_id} reports status == SUSPENDED and posture == FROZEN"
            - "the same check-in succeeded on DoseDispense.${dose_id} before the suspension, proving the gate is the program state"

      - name: carry_evaluation_gated_by_patient_counseling_standing
        grounds:
          - state_machines.TakeHomePrivilege.PENDING_REVIEW_to_APPROVED
          - calculations.take_home_readiness_direction_b
          - entities.Patient.fields.counseling_standing
          - errors[ERR_STABILITY_BELOW_THRESHOLD]
        distinguishing_aspect: "The TakeHomePrivilege-to-Patient pair: an otherwise fully qualified applicant who is short of the counseling cadence reads 62.0 instead of 72.0 on the readiness channel and is denied, so the privilege's approval depends on the Patient entity's counseling_standing dimension rather than on the privilege row itself."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program with allotted_carries 10."
            - "One admitted ACTIVE patient 130 days in treatment, PRIVATE_VEHICLE, journal reconciled, phase MAINTENANCE, who has attended 10 minutes of counseling in the trailing window and is COUNSELING_DEFICIENT."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_phys
            - *k_nurse
            - *k_md
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:9f2c41aa", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "PRIVATE_VEHICLE", one_way_travel_minutes: 15 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_id: $.data.id }
            - *k_admit
            - *k_order
            - *k_activate
            - *k_clock_dec
            - *k_reconcile_maint
            - call: "POST /otp/counseling-sessions"
              payload: { patient_id: "${pat_id}", session_type: "INDIVIDUAL", scheduled_datetime: "2026-12-10T09:00:00Z", duration_minutes: 60, counselor_staff_id: "counselor-30" }
              as: Counselor
              captures: { sess_id: $.data.id }
            - call: "POST /otp/counseling-sessions/${sess_id}/complete"
              payload: { attended_minutes: 10 }
              as: Counselor
            - call: "POST /otp/take-home-privileges"
              payload: { patient_id: "${pat_id}", requested_carries: 6, carry_interval_days: 7, expected_patient_version: "${pat_v1}" }
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { priv_id: $.data.id }
          trigger:
            - call: "POST /otp/take-home-privileges/${priv_id}/evaluate"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { err_counsel: $.data.error_id }
          assert:
            - "GET /otp/patients/${pat_id} reports counseling_standing == COUNSELING_DEFICIENT"
            - "the evaluate call returns 422 and err_counsel == ERR_STABILITY_BELOW_THRESHOLD"
            - "TakeHomePrivilege.${priv_id}.decision == DENIED"
            - "TakeHomePrivilege.${priv_id}.approved_carries == 0"
            - "err_counsel != ERR_TIME_IN_TREATMENT_INSUFFICIENT, so 130 days in treatment was sufficient and the counseling dimension alone blocked the grant"

      - name: exception_decision_gated_by_linked_privilege_decision
        grounds:
          - state_machines.TakeHomeException.SUPERVISOR_REVIEW_to_GRANTED
          - state_machines.TakeHomePrivilege.DENIED_to_APPROVED_WITH_EXCEPTION
          - errors[ERR_PRIVILEGE_NOT_DENIED]
        distinguishing_aspect: "The TakeHomeException-to-TakeHomePrivilege pair: an exception in SUPERVISOR_REVIEW with a fully compliant signature chain is still rejected because the privilege it would supersede has already moved on from DENIED, so the exception's legal target set depends on the other entity's decision field."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. Base CA program with allotted_carries 20."
            - "One admitted ACTIVE patient 130 days in treatment, PRIVATE_VEHICLE, journal reconciled, phase MAINTENANCE, with a privilege that will be evaluated to APPROVED and an exception that was routed while the privilege was still DENIED."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_quota
            - *k_phys
            - *k_nurse
            - *k_md
            - call: "POST /otp/patients"
              payload: { program_id: "${prog_id}", full_name: "Dana Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:9f2c41aa", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "12 River Rd", transportation_type: "PRIVATE_VEHICLE", one_way_travel_minutes: 15 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { pat_id: $.data.id }
            - *k_admit
            - *k_order
            - *k_activate
            - *k_clock_dec
            - *k_reconcile_maint
            - call: "POST /otp/take-home-privileges"
              payload: { patient_id: "${pat_id}", requested_carries: 6, carry_interval_days: 7, expected_patient_version: "${pat_v1}" }
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { priv_id: $.data.id, priv_v_hold: $.data.version }
            - call: "POST /otp/take-home-exceptions"
              payload: { patient_id: "${pat_id}", requested_carries: 3, exception_type: "TRAVEL_HARDSHIP", clinical_justification: "Patient travels 95 minutes each way with no reliable transport and cannot attend daily dosing during the winter road closures.", supervisor_id: "${md_id}", expected_privilege_version: "${priv_v_hold}" }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { exc_id: $.data.id }
            - call: "POST /otp/take-home-exceptions/${exc_id}/route"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /otp/take-home-privileges/${priv_id}/evaluate"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md_id}"
          trigger:
            - call: "POST /otp/take-home-exceptions/${exc_id}/decision"
              payload: { decision: "GRANT", granted_carries: 3 }
              as: MedicalDirector
              as_user_id: "${md_id}"
              captures: { err_link: $.data.error_id }
          assert:
            - "TakeHomePrivilege.${priv_id}.decision == APPROVED, set by the earlier evaluate"
            - "the decision call returns 409 and err_link == ERR_PRIVILEGE_NOT_DENIED"
            - "TakeHomeException.${exc_id}.status is still SUPERVISOR_REVIEW"
            - "TakeHomeException.${exc_id}.granted_carries == 0"
            - "GET /otp/programs/${prog_id}/carry-quota reports granted_carries == 6, so the failed exception granted nothing"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (>= 2, DIFFERENT interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: clinic_open_day_slot_capacity_uses_count_semantics_with_equality_allowed
        grounds:
          - validations[priority=13]
          - entities.Program.fields.max_daily_dose_slots
          - errors[ERR_NO_DOSE_CAPACITY]
          - endpoints.POST_/otp/dose-dispenses
        distinguishing_aspect: "Interval semantics A is aggregate capacity by occupant count on a single shared day bucket: three doses on the same open day are permitted up to max_daily_dose_slots 3 and the fourth is rejected, so equality with the limit is allowed and the resource is the Program's day, not a patient."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. A CA program with max_daily_dose_slots 3, one lot, one Physician, one Nurse and three ACTIVE patients on 30 mg orders."
