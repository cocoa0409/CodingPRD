              captures: { run_cu: "$.data.run_id" }
          assert:
            - "the response status is 200 and cards_updated has length 1 containing ${rd_cu}"
            - "Reader.${rd_cu}.card_exp_year == 2029"
            - "Reader.${rd_cu}.card_status == CURRENT"
            - "Reader.${rd_cu}.card_updater_status == UPDATED"
            - "Reader.${rd_cu_ctl}.card_exp_year == 2026"
            - "Reader.${rd_cu_ctl}.card_updater_status == NOT_APPLICABLE"
            - "Subscription.${sub_cu}.dunning_status == RETRYING"
            - "Subscription.${sub_cu}.max_payment_attempts == 5"

      - name: subscription_preview_price_is_a_computed_read
        claim_type: Computed read
        grounds:
          - endpoints[GET /paywall/subscriptions/{id}]
          - calculations.cycle_base_price_resolution.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / cycle_price_preview_quote_diverges_from_billed_amount
          rationale: "The read of next_cycle_price_cents against the billed base_line_cents is the whole point of that instance."

      - name: seat_invite_endpoint_admission_arithmetic
        claim_type: Conditional action
        grounds:
          - endpoints[POST /paywall/group-accounts/{id}/seats]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / seat_half_open_intervals_admit_adjacency_but_cap_aggregate
          rationale: "That instance drives the endpoint's aggregate-concurrency admission with an adjacent seat admitted and an overlapping one refused."

  # Error-catalog audit. Errors already made triggerable by an earlier section are
  # not repeated here: ERR_INVALID_REQUEST (entities: Required Fields / Type
  # Constraints), ERR_SUBSCRIPTION_NOT_FOUND and ERR_GROUP_ACCOUNT_NOT_FOUND
  # (entities), ERR_PLAN_ALREADY_ACTIVE / ERR_PRICE_CHANGE_STATE_INVALID /
  # ERR_PRICE_NOTICE_NOT_SENT / ERR_PRICE_CHANGE_NOT_EFFECTIVE_YET /
  # ERR_SAVE_OFFER_ALREADY_DECIDED / ERR_HOLD_NOT_RELEASABLE /
  # ERR_SUBSCRIPTION_TERMINAL (state_machines), the 18 validation errors covered in
  # the validations section, ERR_UNAUTHORIZED and ERR_SEGREGATION_OF_DUTIES (rbac),
  # and ERR_STALE_OFFER_PLAN_VERSION / ERR_STALE_GROUP_ACCOUNT_VERSION
  # (cross_cutting_complexity_layers).
  - section: errors
    instances:
      - name: unknown_path_ids_return_not_found
        claim_type: triggerability
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=15]
        distinguishing_aspect: "Each path-parameter existence rule must answer with its OWN error id against an empty database - nine reads, nine distinct 404 codes, never a shared generic not-found."
        test_recipe:
          setup:
            - "Empty database, clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "GET /paywall/offer-plans/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { e_plan: "$.data.error_id" }
            - call: "GET /paywall/paywall-rules/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { e_rule: "$.data.error_id" }
            - call: "GET /paywall/articles/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { e_art: "$.data.error_id" }
            - call: "GET /paywall/readers/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { e_rd: "$.data.error_id" }
            - call: "GET /paywall/invoices/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { e_inv: "$.data.error_id" }
            - call: "GET /paywall/cancellation-requests/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { e_cr: "$.data.error_id" }
            - call: "GET /paywall/save-offers/77777777-7777-4777-8777-777777777777"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { e_so: "$.data.error_id" }
            - call: "GET /paywall/holds/88888888-8888-4888-8888-888888888888"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { e_hold: "$.data.error_id" }
            - call: "GET /paywall/seats/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { e_seat: "$.data.error_id" }
          assert:
            - "every call returns 404"
            - "${e_plan} == ERR_OFFER_PLAN_NOT_FOUND"
            - "${e_rule} == ERR_PAYWALL_RULE_NOT_FOUND"
            - "${e_art} == ERR_ARTICLE_NOT_FOUND"
            - "${e_rd} == ERR_READER_NOT_FOUND"
            - "${e_inv} == ERR_INVOICE_NOT_FOUND"
            - "${e_cr} == ERR_CANCELLATION_REQUEST_NOT_FOUND"
            - "${e_so} == ERR_SAVE_OFFER_NOT_FOUND"
            - "${e_hold} == ERR_HOLD_NOT_FOUND"
            - "${e_seat} == ERR_SEAT_NOT_FOUND"

      - name: unknown_body_foreign_keys_return_not_found
        claim_type: triggerability
        grounds:
          - validations[priority=16]
          - validations[priority=17]
          - validations[priority=18]
