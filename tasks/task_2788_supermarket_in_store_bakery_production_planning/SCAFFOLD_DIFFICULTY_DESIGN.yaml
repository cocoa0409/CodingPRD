  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: production_run_execution_and_disposition_dimensions_move_independently
        grounds:
          - state_machines.ProductionRun.execution_status
          - state_machines.ProductionRun.disposition_status
          - calculations.markdown_price
          - entities.ProductionRun.fields.markdown_unit_price_cents
          - entities.ProductionRun.fields.expires_utc
        distinguishing_aspect: |
          Parallel (non-linear) shape on ProductionRun: two independent state
          dimensions on ONE row. execution_status advances SCHEDULED -> BAKING ->
          COMPLETED while disposition_status advances PENDING -> ON_SHELF ->
          MARKED_DOWN -> CLEARED, and the markdown and clearance transitions leave
          execution_status frozen at COMPLETED.
        test_recipe:
          setup:
            - "PAR-CROIS (PAR_BAKED, units_per_rack 40, bake 20, cool 15, shelf_life_hours 10, unit_retail_cents 150, markdown_pct 0.5)."
            - "A PLANNED BakeDay on 2026-08-12; one manual run of 2 racks on Deck Oven A deck 0 with bake_start 04:00Z."
            - "Logical clock starts at 2026-08-12T04:00:00Z and is advanced to 11:00:00Z, which is inside the markdown window [10:35Z, 14:35Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
