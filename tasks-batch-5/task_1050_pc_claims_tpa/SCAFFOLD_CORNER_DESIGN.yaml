  - section: endpoints
    instances:
      - name: claims_filtered_list_envelope
        claim_type: Listing
        grounds: [endpoints, entities.Claim.fields.policy_id]
        distinguishing_aspect: "GET /claims?policy_id=... returns an array envelope (response_type=array) with pagination fields total_count and has_more and includes the created claim."
        test_recipe:
          setup: ["One account + policy + one claim."]
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "C-LS", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-LS", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              captures: { claim_id: $.data.id }
          trigger:
            - call: "GET /claims"
              payload: { policy_id: "${policy_id}" }
              as: ClaimsManager
          assert:
            - "response.response_type == array"
            - "response.meta.api_request_id is present"
            - "response.data length == 1"
            - "response contains total_count and has_more"

