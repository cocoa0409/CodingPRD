            - "GET /brokers/${broker_id}/audit-events?event_type=OPT_OUT_RECEIVED reports total_count == 1"
            - "GET /brokers/${broker_id}/audit-events?event_type=OPT_OUT_HONORED reports total_count == 1"

      - name: lift_justification_shorter_than_twenty_characters_rejected
