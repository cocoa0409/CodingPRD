          - calculations.category_gap_score
          - state_machines.CategoryGap.ANALYZED_self_loop
        distinguishing_aspect: |
          Re-analysis is a self-loop that merges: only nb_retail_price_cents is restated, the other three stored
          inputs are reused, and the price term saturates at its 10.00 cap because 649 >= 400 - so the score moves
          47.00 -> 48.00 and the recommended tier stays NBE. An implementation that requires the full input set, or
          that computes the price term as 649/40 = 16.23, cannot land on 48.00.
        test_recipe:
          setup:
            - "One ANALYZED gap scored from sales 250000000, pl_share 20.0, velocity 520 and national-brand price 360, giving gap_score 47.00 and recommended_tier NBE at version 2."
          setup_api_calls:
