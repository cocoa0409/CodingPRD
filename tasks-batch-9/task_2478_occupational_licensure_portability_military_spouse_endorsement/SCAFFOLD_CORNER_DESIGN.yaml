      - name: disciplinary_record_resolve_recomputes_both_index_variants
        claim_type: Computed read
        grounds:
          - endpoints.POST_licensure_disciplinary_records_id_resolve
          - calculations.applicant_disciplinary_risk_index
          - entities.Applicant.fields.good_standing_flag
        distinguishing_aspect: "An unresolved SUSPENSION dated 2026-01-01 (age 0 full year blocks, factor 1.0) puts both index variants at 30.00 and forces good_standing_flag false; resolving it drops the row out of the input set, returning both variants to 0.00 and good_standing_flag to true."
        test_recipe:
          setup:
            - "One Applicant with no disciplinary rows; the logical clock is at its startup default 2026-08-01T00:00:00Z."
            - "One SUSPENSION record whose reported_at and action_effective_at are both 2026-01-01T00:00:00Z, which is 212 days earlier, i.e. 0 full 365-day blocks."
