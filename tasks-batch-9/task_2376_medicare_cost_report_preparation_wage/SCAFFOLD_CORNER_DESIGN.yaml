          - validations[priority=13]
          - entities.Settlement.fields.basis_method
        distinguishing_aspect: "The tentative variant accepts a SINGLE_APPORTIONMENT basis run but the final variant does not: with only a COMPLETED SINGLE_APPORTIONMENT run current, POST /cost-reports/{id}/settlements with stage FINAL returns ERR_FINAL_REQUIRES_DOUBLE_APPORTIONMENT (422)."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "the same report as final_settlement_subtracts_the_prior_tentative_payment, already TENTATIVE_SETTLED with one ISSUED TENTATIVE Settlement of 75000000"
            - "the only COMPLETED StepdownRun still has method SINGLE_APPORTIONMENT and allocation_status == CURRENT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
