# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_0706_virtual_receptionist_answering  (Expert tier)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# Every grounds[] / call / error_id / state / calculation resolves verbatim
# into SCAFFOLD.yaml. 9 rule_ids x 2 instances = 18 instances.
# Common setup vocabulary used throughout:
#   - clock default is 2026-03-01T00:00:00Z (per /va/_clock/set_current_utc)
#   - account creation opens BillingPeriod period_index 0 (current_period_id)
#   - a script must be PUBLISHED before POST /va/calls succeeds
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- Instance 1: billing_overage provisional vs final (BillingPeriod domain)
      - name: billing_overage_provisional_exceeds_final
        grounds:
          - calculations.billing_overage
          - entities.BillingPeriod.fields.overage_charge_cents
          - entities.Call.fields.billing_status
          - state_machines.Call.handling_status.WRAP_UP_to_COMPLETED
        distinguishing_aspect: |
          The provisional variant (read of an OPEN BillingPeriod) includes an
          estimate for IN_PROGRESS/WRAP_UP calls, so its overage_charge_cents is
          strictly greater than the final variant (BILLED/ADJUSTED only). This
          dual-variant lives on the BillingPeriod/Call billing domain.
        test_recipe:
          setup:
            - "PER_MINUTE plan: included_minutes=2, overage_tier2_threshold=100, overage_rate_cents=100, overage_tier2_rate_cents=300, hard_cap_overage_cents=100000."
            - "One account on that plan; PUBLISHED 24h script; one AVAILABLE EN receptionist (max_concurrent_calls 5)."
            - "Call A is COMPLETED billing 2 units (consumed_units=2, no overage). Call B is IN_PROGRESS, 121s elapsed (estimate 3 units)."
            - "Provisional read counts 2+3=5 consumed -> overage 3 -> charge 300; final counts only 2 -> overage 0 -> charge 0."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "PM2", billing_model: "PER_MINUTE", base_fee_cents: 0, overage_rate_cents: 100, overage_tier2_rate_cents: 300, hard_cap_overage_cents: 100000, included_minutes: 2, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Acme", plan_id: "${plan_id}", default_language: "EN" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, period_id: $.data.current_period_id }
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "hi", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script_id: $.data.id }
            - call: "POST /va/call-scripts/${script_id}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/receptionists"
              payload: { display_name: "Rina", languages: ["EN"], max_concurrent_calls: 5 }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /va/receptionists/${rec_id}/availability-windows"
              payload: { start_minute: 0, end_minute: 1440 }
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/receptionists/${rec_id}/go-online"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            # ---- Call A: 90s -> 2 billed minutes, COMPLETED
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5551111", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { call_a: $.data.id }
            - call: "POST /va/calls/${call_a}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T10:05:00Z" }
              as: PlatformAdmin
            - call: "POST /va/calls/${call_a}/start"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T10:06:30Z" }
              as: PlatformAdmin
            - call: "POST /va/calls/${call_a}/wrap"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls/${call_a}/complete"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            # ---- Call B: started, left IN_PROGRESS for 121s
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5552222", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { call_b: $.data.id }
            - call: "POST /va/calls/${call_b}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T10:10:00Z" }
              as: PlatformAdmin
            - call: "POST /va/calls/${call_b}/start"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T10:12:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /va/billing-periods/${period_id}/overage-summary"
              payload: {}
              as: PlatformAdmin
              captures: { prov_charge: $.data.overage_charge_cents, prov_consumed: $.data.consumed_units, prov_variant: $.data.variant }
          assert:
            - "overage-summary.consumed_units == 5"
            - "overage-summary.overage_units == 3"
            - "overage-summary.overage_charge_cents == 300"
            - "overage-summary.variant == \"provisional\""
            - "BillingPeriod.${period_id}.overage_charge_cents (final, persisted) == 0"

      # ---- Instance 2: spam_score provisional vs final (Call screening domain)
      - name: spam_score_final_drops_after_human_engagement
        grounds:
          - calculations.spam_score
          - entities.Call.fields.spam_score
          - entities.SpamRule.fields.anonymous_penalty
          - state_machines.Call.handling_status.IN_PROGRESS_to_WRAP_UP
        distinguishing_aspect: |
          spam_score's two variants act on the Call screening domain (NOT the
          billing domain of instance 1): the provisional variant uses only static
          signals (anonymous +40) yielding 40; the final variant subtracts 30 once
          the call reached IN_PROGRESS, yielding 10 — a different result on a
          different entity domain.
        test_recipe:
          setup:
            - "Account with PUBLISHED 24h script and ACTIVE SpamRule (anonymous_penalty=40, spam_score_threshold=70, blocked_area_codes=[])."
            - "Anonymous inbound call (caller_id absent) -> provisional spam_score 40 (< 70 threshold, not screened); RINGING."
            - "Call is answered, started (reaches IN_PROGRESS), then wrapped -> final spam_score = max(0,40-30) = 10."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "PC1", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Beta", plan_id: "${plan_id}", default_language: "EN" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/spam-rules"
              payload: { account_id: "${acct_id}", blocked_area_codes: [], spam_score_threshold: 70, anonymous_penalty: 40 }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "hi", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script_id: $.data.id }
            - call: "POST /va/call-scripts/${script_id}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/receptionists"
              payload: { display_name: "Rina", languages: ["EN"], max_concurrent_calls: 5 }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /va/receptionists/${rec_id}/availability-windows"
              payload: { start_minute: 0, end_minute: 1440 }
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/receptionists/${rec_id}/go-online"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { call_id: $.data.id, prov_spam: $.data.spam_score, hstat: $.data.handling_status }
            - call: "POST /va/calls/${call_id}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls/${call_id}/start"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
          trigger:
            - call: "POST /va/calls/${call_id}/wrap"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { final_spam: $.data.spam_score }
          assert:
            - "Call.${call_id}.spam_score at intake (provisional) == 40"
            - "Call.${call_id}.handling_status at intake == \"RINGING\" (not SCREENED_OUT, 40 < 70)"
            - "Call.${call_id}.spam_score after wrap (final) == 10"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- Instance 1: MODE (b) nested rounding order pinned (per-call ceil then sum)
      - name: per_minute_round_per_call_then_sum
        grounds:
          - calculations.call_charge
          - entities.Call.fields.billed_units
          - entities.Call.fields.duration_seconds
          - entities.BillingPeriod.fields.consumed_units
        distinguishing_aspect: |
          Mode (b): rounding order is pinned to ceil-per-call THEN sum. Two 90s
          calls bill ceil(90/60)+ceil(90/60)=4 minutes, NOT ceil(180/60)=3 — the
          two orders give different consumed_units, so the pinned order is the
          discriminator.
        test_recipe:
          setup:
            - "PER_MINUTE plan included_minutes=100 (no overage), tier2_threshold=100, rates 100/300, hard_cap 100000."
            - "Two calls each 90 seconds, both COMPLETED on the same OPEN period."
            - "Per-call rounding: each bills ceil(90/60)=2 units; consumed_units = 2+2 = 4. Sum-then-round would be 3."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "PMbig", billing_model: "PER_MINUTE", base_fee_cents: 0, overage_rate_cents: 100, overage_tier2_rate_cents: 300, hard_cap_overage_cents: 100000, included_minutes: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Gamma", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, period_id: $.data.current_period_id }
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "hi", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script_id: $.data.id }
            - call: "POST /va/call-scripts/${script_id}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/receptionists"
              payload: { display_name: "Rina", languages: ["EN"], max_concurrent_calls: 5 }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /va/receptionists/${rec_id}/availability-windows"
              payload: { start_minute: 0, end_minute: 1440 }
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/receptionists/${rec_id}/go-online"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            # Call 1: 90s
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5550001", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { c1: $.data.id }
            - call: "POST /va/calls/${c1}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:05:00Z" }
              as: PlatformAdmin
            - call: "POST /va/calls/${c1}/start"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:06:30Z" }
              as: PlatformAdmin
            - call: "POST /va/calls/${c1}/wrap"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls/${c1}/complete"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { c1_units: $.data.billed_units }
            # Call 2: 90s
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5550002", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { c2: $.data.id }
            - call: "POST /va/calls/${c2}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:10:00Z" }
              as: PlatformAdmin
            - call: "POST /va/calls/${c2}/start"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:11:30Z" }
              as: PlatformAdmin
            - call: "POST /va/calls/${c2}/wrap"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
          trigger:
            - call: "POST /va/calls/${c2}/complete"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { c2_units: $.data.billed_units }
          assert:
            - "Call.${c1}.billed_units == 2"
            - "Call.${c2}.billed_units == 2"
            - "BillingPeriod.${period_id}.consumed_units == 4 (per-call ceil then sum, NOT 3)"

      # ---- Instance 2: MODE (a) tiered marginal overage, >=3 inputs, nested min/max
      - name: tiered_overage_marginal_crosstier_charge
        grounds:
          - calculations.billing_overage
          - calculations.call_charge
          - entities.ServicePlan.fields.overage_tier2_threshold
          - entities.ServicePlan.fields.overage_tier2_rate_cents
        distinguishing_aspect: |
          Mode (a): the overage formula has >=3 inputs (overage_units,
          overage_tier2_threshold, two rates) with nested min/max and conditional
          tier selection. A single call straddling the tier boundary contributes a
          marginal charge mixing tier-1 (R1) and tier-2 (R2) units — distinct mode
          from instance 1's pinned-rounding mode (b).
        test_recipe:
          setup:
            - "PER_MINUTE plan: included_minutes=2, overage_tier2_threshold=3, overage_rate_cents=100 (R1), overage_tier2_rate_cents=300 (R2), hard_cap 100000."
            - "Three completed calls on one period: 90s (2u), 61s (2u), 121s (3u) -> consumed runs 0->2->4->7."
            - "Call3 marginal charge crosses the tier boundary: prev overage at consumed 4 = 200c; new at 7 = 1100c; marginal = 900c."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "PMtier", billing_model: "PER_MINUTE", base_fee_cents: 0, overage_rate_cents: 100, overage_tier2_rate_cents: 300, hard_cap_overage_cents: 100000, included_minutes: 2, overage_tier2_threshold: 3 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Delta", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, period_id: $.data.current_period_id }
            - call: "POST /va/call-scripts"
