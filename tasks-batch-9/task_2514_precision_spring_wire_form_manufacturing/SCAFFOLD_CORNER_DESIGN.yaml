  - name: material_spec_is_immutable_and_exposes_no_version_field
    claim_type: immutability
    grounds:
    - entities.MaterialSpec.common_fields
    - endpoints[GET /material-specs/{id}]
    distinguishing_aspect: MaterialSpec declares common_fields false, so the row carries id and created_at but
      no version and no updated_at, and §1.5 declares no update or delete route for it.
    test_recipe:
      setup:
      - One MaterialSpec exists (MS-CRSI-1).
      setup_api_calls:
      - call: POST /material-specs
        payload:
          spec_code: MS-CRSI-1
          wire_material: CHROME_SILICON_A401
          tensile_grade_mpa: 1900
          shear_modulus_gpa: 79.3
          elastic_modulus_gpa: 203.0
          density_kg_per_m3: 7850
          coating: ZINC_PHOSPHATE
          salt_spray_hours: 96
          biocompatible: false
          cost_per_kg_cents: 850
        as: DesignEngineer
        captures:
          ms_id: $.data.id
      trigger:
      - call: GET /material-specs/${ms_id}
        payload: {}
        as: DesignEngineer
      assert:
      - HTTP 200
      - MaterialSpec.spec_code == 'MS-CRSI-1'
      - MaterialSpec response has no 'version' key and no 'updated_at' key
      - no PATCH/PUT/DELETE /material-specs/{id} endpoint is declared in §1.5
  - name: material_spec_biocompatible_defaults_false_when_omitted
    claim_type: defaults
    grounds:
    - entities.MaterialSpec.biocompatible
    distinguishing_aspect: biocompatible is the only optional MaterialSpec input; omitting it yields false, which
      is what the priority-36 biocompatibility gate later reads.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /material-specs
        payload:
          spec_code: MS-NOBIO
          wire_material: CHROME_SILICON_A401
          tensile_grade_mpa: 1900
          shear_modulus_gpa: 79.3
          elastic_modulus_gpa: 203.0
          density_kg_per_m3: 7850
          coating: ZINC_PHOSPHATE
          salt_spray_hours: 96
          cost_per_kg_cents: 850
        as: DesignEngineer
        captures:
          ms_id: $.data.id
      assert:
      - HTTP 201
      - MaterialSpec.biocompatible == false
      - MaterialSpec.salt_spray_hours == 96
      - MaterialSpec.cost_per_kg_cents == 850
  - name: design_creation_computes_every_engineering_field_from_geometry
    claim_type: computed_fields
    grounds:
    - calculations.spring_rate
    - calculations.corrected_shear_stress
    - calculations.fatigue_margin_ratio
    - calculations.predicted_fatigue_life
    - calculations.wire_mass_per_piece
    - entities.SpringDesign.tangle_risk_index
    distinguishing_aspect: 'One POST writes eleven computed fields off d=2.5, OD=20.0, Na=8, 150/50 N on a 1900
      MPa peened chrome-silicon grade: 9.031 N/mm, 513.37/171.12 MPa, Goodman 1.757, 10000000 cycles, 0.021185
      kg, tangle 3.000 LOW.'
    test_recipe:
      setup:
      - A CustomerProgram (INDUSTRIAL) and a MaterialSpec (CHROME_SILICON_A401, 1900 MPa, G 79.3 GPa, density
        7850) exist.
      setup_api_calls:
      - call: POST /customer-programs
        payload:
          program_code: PGM-1
          customer_name: Bramble Industrial Supply
          application_class: INDUSTRIAL
          ppap_level: 1
          committed_pieces: 500000
          minimum_order_quantity: 1000
          required_salt_spray_hours: 96
          biocompatibility_required: false
          min_fatigue_margin: 1.2
          required_ppk: 1.0
          amortization_method: FORECAST_BASIS
        as: ProgramManager
        captures:
          prog_id: $.data.id
          prog_v: $.data.version
      - call: POST /material-specs
        payload:
          spec_code: MS-CRSI-1
          wire_material: CHROME_SILICON_A401
          tensile_grade_mpa: 1900
          shear_modulus_gpa: 79.3
          elastic_modulus_gpa: 203.0
          density_kg_per_m3: 7850
          coating: ZINC_PHOSPHATE
          salt_spray_hours: 96
          biocompatible: false
          cost_per_kg_cents: 850
        as: DesignEngineer
        captures:
          ms_id: $.data.id
      trigger:
      - call: POST /spring-designs
        payload:
          program_id: ${prog_id}
          material_spec_id: ${ms_id}
          part_number: D1
          form_type: COMPRESSION
          end_type: CLOSED_GROUND
          wire_diameter_mm: 2.5
          outer_diameter_mm: 20.0
          free_length_mm: 60.0
          active_coils: 8
          max_working_load_n: 150
          min_working_load_n: 50
          cycle_seconds_per_piece: 1.8
          shot_peening_required: true
        as: DesignEngineer
        as_user_id: de-01
        captures:
          d_id: $.data.id
          d_v: $.data.version
      assert:
      - HTTP 201
      - SpringDesign.spring_rate_n_per_mm == 9.031
      - SpringDesign.shear_stress_max_mpa == 513.37
      - SpringDesign.shear_stress_min_mpa == 171.12
      - SpringDesign.stress_amplitude_mpa == 171.12
      - SpringDesign.mean_stress_mpa == 342.25
      - SpringDesign.fatigue_criterion == 'GOODMAN'
      - SpringDesign.fatigue_margin_ratio == 1.757
      - SpringDesign.predicted_fatigue_life_cycles == 10000000
      - SpringDesign.wire_mass_per_piece_kg == 0.021185
      - SpringDesign.tangle_risk_index == 3.000
      - SpringDesign.tangle_risk_class == 'LOW'
      - SpringDesign.release_status == 'DRAFT'
      - SpringDesign.current_revision_no == 1
