  - rule_id: resource_temporal_overlap
    instances:
      - name: visitor_pass_half_open_adjacent_ok_overlap_rejected
        grounds:
          - validations[priority=7]
          - entities.VisitorPass.fields.valid_from
          - errors[ERR_VISITOR_PASS_OVERLAP]
        distinguishing_aspect: "VisitorPass uses HALF-OPEN [valid_from, valid_until): a pass starting exactly when a prior one ends (adjacency) is accepted, but a straddling pass on the same household+guest_plate is rejected with ERR_VISITOR_PASS_OVERLAP."
        test_recipe:
          setup:
            - "Household with an ACTIVE permit; TEMPORARY pass P1 [08:00,12:00) and adjacent P2 [12:00,16:00) already issued for guest_plate 'GX'."
          setup_api_calls:
