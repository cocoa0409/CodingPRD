  # ==========================================================================
  # RULE 2 - combinatorial_formula
  # mandatory_element_compliance_score fuses four independent inputs with a
  # pinned rounding order; changeover_writeoff_cost fuses scrap units, rework
  # units, the unit cost and a tier keyed on the pre-surcharge base.
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: compliance_score_combines_element_scheme_market_and_language_inputs
        grounds:
          - calculations.mandatory_element_compliance_score
          - entities.ArtworkVersion.fields.compliance_score
          - entities.ArtworkVersion.fields.failed_element_count
          - entities.ElementCheck.fields.deduction_points
          - entities.ElementCheck.fields.severity
          - state_machines.ArtworkVersion.DRAFT_to_ELEMENTS_VERIFIED
          - endpoints[POST /artwork-versions/{id}/verify-elements]
        distinguishing_aspect: |
          The score is a single number that only four simultaneously varying inputs
          can produce: the per-element severity verdicts (CRITICAL 25 + MAJOR 10 = 35),
          the EU_FIC scheme factor applied and rounded to 2dp BEFORE the penalties
          (38.50), the market-breadth penalty (2 markets -> 2.5) and the
          language-breadth penalty (3 languages -> 1.5), giving 57.5 for the failing
          draft and 96.0 - not 100.0 - for the corrected draft on the same brief,
          which proves the market and language arms are independent of the element arm.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-2044 APPROVED under EU_FIC with market_codes [DE, FR] (2 markets) and language_codes [de, fr, it] (3 languages); all seven mandatory element codes required."
            - "ArtworkAsset (CARTON / COATED_PAPER) with market_code DE and language_codes [de, fr, it], so the language-breadth penalty input is 3."
            - "ArtworkVersion v1 still DRAFT, carrying allergen_statement.allergen_emphasis == false (ALLERGEN_STATEMENT, CRITICAL) and date_code_zone.zone_mm2 == 120 (DATE_CODE_ZONE, MAJOR); the other five elements satisfy their predicates."
