  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_concert_version_on_second_hold_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[ticket-order-create-stale-concert]", "errors[ERR_STALE_CONCERT_VERSION]", "validations[priority=9]"]
        distinguishing_aspect: "The first hold advances Concert.version, so a second hold still carrying the pre-hold version is rejected with ERR_STALE_CONCERT_VERSION (412) even though seats and sale status are both fine; re-reading the concert and retrying succeeds."
        test_recipe:
          setup: ["Season 2027 at SINGLE_ON_SALE with a 100-seat ORCHESTRA section and one patron; the client has read the concert once and holds that version"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
