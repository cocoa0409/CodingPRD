          - endpoints.POST_/repair-orders/{id}/parts-delay-sweep
          - endpoints.POST_/parts-lines/{id}/receive
        distinguishing_aspect: >-
          open_parts_delay_count is a live count of unclosed events, not a lifetime tally: the sweep
          raises it and the receipt must bring it back down while the closed event itself stays on the
          record with its delay_minutes stamped from the clock. An implementation that counts all events
          never returns to zero, and one that deletes the event on receipt loses the delay history.
