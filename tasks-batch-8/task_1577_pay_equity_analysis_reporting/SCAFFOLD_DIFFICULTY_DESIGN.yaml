            - { call: "POST /api/comparator-groups/${gi}/lock", payload: {}, as: CompAnalyst, captures: { gvi: "$.data.version" } }
            - { call: "POST /api/model-runs", payload: { comparator_group_id: "${gi}", methodology: COHORT_MEDIAN, expected_group_version: "${gvi}" }, as: CompAnalyst, captures: { run_i: "$.data.id" } }
            - { call: "POST /api/model-runs/${run_i}/finalize", payload: {}, as: CompAnalyst }
