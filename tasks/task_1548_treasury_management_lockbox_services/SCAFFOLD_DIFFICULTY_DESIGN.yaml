              payload: { reason_code: "AMOUNT_MISMATCH", default_decision: "RETURN" }
              as: LockboxOperator
              as_user_id: "lock-op-1"
              captures: { ex_id: $.data.id }
          trigger:
            # Attempt decide by the SAME user who raised (lock-op-1 is a LockboxOperator;
            # but the decide endpoint requires CustomerOperator role. So this fails
