# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_1532_historical_society_local_archive
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and reproduces from empty-DB
# using only §1.5 endpoints. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: repro_fee_quote_vs_invoice_divergence
        grounds:
          - calculations.reproduction_image_component
          - calculations.reproduction_order_total
          - entities.ReproductionOrder.fields.quoted_fee_cents
          - entities.ReproductionOrder.fields.invoiced_fee_cents
        distinguishing_aspect: |
          Reproduction-fee domain dual variant: identical rate constants and the
          same order produce quoted_fee_cents == 2000 from page_estimate (60) but
          invoiced_fee_cents == 2150 from actual_pages (66) — the provisional and
          final variants differ purely because their page basis differs.
        test_recipe:
          setup:
            - "Zone Z, collection C, accession A (ACCESSIONED via executed deed), finding aid PUBLISHED, item I AVAILABLE (appraised 50000, GOOD, MANUSCRIPT), researcher R ACTIVE, request RQ APPROVED over [I]"
            - "Logical clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Pioneer Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "stone@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 100000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "Finding Aid", summary: "Scope" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Diary 1881" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "Leather diary", condition_grade: "GOOD", appraised_value_cents: 50000, format: "MANUSCRIPT" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "POST /researchers", payload: { full_name: "R. Reader", email: "r1@example.org" }, as: ReadingRoomStaff, captures: { r: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i}"], topic: "Pioneer life", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { rq: $.data.id } }
            - { call: "POST /research-requests/${rq}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq}/approve", as: ReadingRoomStaff }
          trigger:
            - { call: "POST /reproduction-orders", payload: { research_request_id: "${rq}", item_ids: ["${i}"], format: "SCAN_STANDARD", page_estimate: 60, license_class: "PERSONAL", rush: false }, as: Researcher, as_user_id: "${r}", captures: { ord: $.data.id, quoted: $.data.quoted_fee_cents } }
            - { call: "POST /reproduction-orders/${ord}/approve-quote", as: Researcher, as_user_id: "${r}" }
            - { call: "POST /reproduction-orders/${ord}/invoice", payload: { actual_pages: 66 }, as: ReadingRoomStaff, captures: { invoiced: $.data.invoiced_fee_cents } }
          assert:
            - "ReproductionOrder.${ord}.quoted_fee_cents == 2000  (50*35 + 10*25)"
            - "ReproductionOrder.${ord}.invoiced_fee_cents == 2150  (50*35 + 16*25)"
            - "ReproductionOrder.${ord}.quoted_fee_cents != ReproductionOrder.${ord}.invoiced_fee_cents"
            - "ReproductionOrder.${ord}.status == INVOICED (2150 <= floor(2000 * 1.10) == 2200, so the requote gate stays silent)"

      - name: conservation_priority_preliminary_vs_confirmed
        grounds:
          - calculations.conservation_priority_score
          - entities.ConservationAssessment.fields.preliminary_priority_score
          - entities.ConservationAssessment.fields.confirmed_priority_score
        distinguishing_aspect: |
          Conservation-priority domain (different entity domain from the
          reproduction-fee instance): identical snapshots (urgency 80, 2 open
          requests, appraised 50000c) yield preliminary 65.0 but confirmed 75.0
          because only the confirmed variant applies the FRAGILE urgency x1.25 cap.
        test_recipe:
          setup:
            - "Item I AVAILABLE with appraised_value_cents == 50000; exactly two open ResearchRequests (status SUBMITTED) reference I; researcher ACTIVE"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Pioneer Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "stone@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 100000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Quilt" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "1880s quilt", condition_grade: "POOR", appraised_value_cents: 50000, format: "ARTIFACT" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "POST /researchers", payload: { full_name: "R. Reader", email: "r1@example.org" }, as: ReadingRoomStaff, captures: { r: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i}"], topic: "Textiles", purpose: "ACADEMIC" }, as: Researcher, as_user_id: "${r}", captures: { rq1: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i}"], topic: "Dyes", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { rq2: $.data.id } }
            - { call: "GET /items/${i}", as: Archivist, captures: { iv: $.data.version } }
          trigger:
            - { call: "POST /items/${i}/conservation-assessments", payload: { expected_item_version: "${iv}", condition_grade_observed: "FRAGILE", urgency_score: 80, treatment_estimate_hours: 12 }, as: Archivist, captures: { asmt: $.data.id, prelim: $.data.preliminary_priority_score } }
            - { call: "POST /conservation-assessments/${asmt}/approve", as: Archivist, captures: { confirmed: $.data.confirmed_priority_score } }
          assert:
            - "ConservationAssessment.${asmt}.preliminary_priority_score == 65.0  (0.5*80 + 0.3*50 + 0.2*50)"
            - "ConservationAssessment.${asmt}.confirmed_priority_score == 75.0  (0.5*min(100, round(80*1.25)) + 0.3*50 + 0.2*50)"
            - "ConservationAssessment.${asmt}.open_request_count_snapshot == 2 (both SUBMITTED requests count)"
            - "Item.${i}.conservation_priority_score == 75.0 after approval"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_fee_straddle_multipliers
        grounds:
          - calculations.reproduction_image_component
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: a 210-page HIGHRES
          rush order straddles all three marginal page tiers (35/25/15c), then the
          format multiplier (x1.8) and rush multiplier (x1.5) apply, and the
          minimum-fee max() clamps a second 5-page order. PERSONAL purpose keeps
          the academic discount out of this instance so mode (a) is isolated.
        test_recipe:
          setup:
            - "Item AVAILABLE; researcher with APPROVED PERSONAL-purpose request over [I]"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "stone@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 100000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Ledger" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "Store ledger", condition_grade: "GOOD", appraised_value_cents: 20000, format: "BOUND_VOLUME" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "POST /researchers", payload: { full_name: "R. Reader", email: "r1@example.org" }, as: ReadingRoomStaff, captures: { r: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i}"], topic: "Commerce", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { rq: $.data.id } }
            - { call: "POST /research-requests/${rq}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq}/approve", as: ReadingRoomStaff }
          trigger:
            - { call: "POST /reproduction-orders", payload: { research_request_id: "${rq}", item_ids: ["${i}"], format: "SCAN_HIGHRES", page_estimate: 210, license_class: "COMMERCIAL_PUBLICATION", rush: true }, as: Researcher, as_user_id: "${r}", captures: { ordA: $.data.id, quotedA: $.data.quoted_fee_cents } }
            - { call: "POST /reproduction-orders", payload: { research_request_id: "${rq}", item_ids: ["${i}"], format: "SCAN_STANDARD", page_estimate: 5, license_class: "PERSONAL", rush: false }, as: Researcher, as_user_id: "${r}", captures: { ordB: $.data.id, quotedB: $.data.quoted_fee_cents } }
          assert:
            - "ReproductionOrder.${ordA}.quoted_fee_cents == 22755  (tier_cost 5650 = 1750+3750+150; image round(5650*1.8*1.5)=15255; +7500 license)"
            - "ReproductionOrder.${ordB}.quoted_fee_cents == 500  (image 175 clamps to MIN_ORDER_FEE_CENTS)"

      - name: academic_discount_evaluation_order
        grounds:
          - calculations.reproduction_order_total
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order: the
          20% academic discount is keyed on the PRE-discount image_component and
          applies to the image component ONLY; the minimum fee clamps after
          discounting and the license flat is added last. Discounting the
          license-inclusive subtotal (a plausible misreading) yields 13404, not
          the pinned 13704 — so the two orders are observably different.
        test_recipe:
          setup:
            - "Item AVAILABLE; researcher with APPROVED ACADEMIC-purpose request over [I]; second APPROVED PERSONAL-purpose request as control"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "stone@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 100000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Photos" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "Glass plates", condition_grade: "GOOD", appraised_value_cents: 80000, format: "PHOTOGRAPH" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "POST /researchers", payload: { full_name: "R. Reader", email: "r1@example.org" }, as: ReadingRoomStaff, captures: { r: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i}"], topic: "Dissertation", purpose: "ACADEMIC" }, as: Researcher, as_user_id: "${r}", captures: { rqA: $.data.id } }
            - { call: "POST /research-requests/${rqA}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rqA}/approve", as: ReadingRoomStaff }
            - { call: "POST /research-requests", payload: { item_ids: ["${i}"], topic: "Genealogy", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { rqP: $.data.id } }
            - { call: "POST /research-requests/${rqP}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rqP}/approve", as: ReadingRoomStaff }
          trigger:
            - { call: "POST /reproduction-orders", payload: { research_request_id: "${rqA}", item_ids: ["${i}"], format: "SCAN_HIGHRES", page_estimate: 210, license_class: "NONPROFIT_PUBLICATION", rush: true }, as: Researcher, as_user_id: "${r}", captures: { ordA: $.data.id, quotedA: $.data.quoted_fee_cents } }
            - { call: "POST /reproduction-orders", payload: { research_request_id: "${rqP}", item_ids: ["${i}"], format: "SCAN_HIGHRES", page_estimate: 210, license_class: "NONPROFIT_PUBLICATION", rush: true }, as: Researcher, as_user_id: "${r}", captures: { ordP: $.data.id, quotedP: $.data.quoted_fee_cents } }
          assert:
            - "ReproductionOrder.${ordA}.quoted_fee_cents == 13704  (image 15255 >= 5000 -> 20% off image only: 12204; +1500 license)"
            - "ReproductionOrder.${ordA}.quoted_fee_cents != 13404  (the forbidden order: discount applied to image+license)"
            - "ReproductionOrder.${ordP}.quoted_fee_cents == 16755  (PERSONAL purpose: no discount; 15255 + 1500)"

      - name: deaccession_proceeds_per_item_rounding
        grounds:
          - calculations.deaccession_proceeds
          - entities.DeaccessionProposal.fields.proceeds_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: proceeds round each
          hammer price x0.90 half-up per item THEN sum (pinned), giving 1699c for
          hammers 999/555/333; the sum-then-round alternative gives 1698c and is
          forbidden. Different mode from the two fee instances.
        test_recipe:
          setup:
            - "Three PENDING_CATALOG items I1/I2/I3 under one ACCESSIONED accession and ACTIVE collection; proposal SALE covering exactly [I1,I2,I3]; approved by a BoardOfficer whose user id differs from the proposing Registrar; clock advanced exactly to finalize_not_before"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Duplicates", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "stone@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 3000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Dup 1" }, as: Archivist, captures: { i1: $.data.id } }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Dup 2" }, as: Archivist, captures: { i2: $.data.id } }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Dup 3" }, as: Archivist, captures: { i3: $.data.id } }
            - { call: "POST /deaccession-proposals", payload: { item_ids: ["${i1}", "${i2}", "${i3}"], justification: "Duplicates of state library holdings", disposal_method: "SALE" }, as: Registrar, as_user_id: "reg_1", captures: { p: $.data.id } }
            - { call: "POST /deaccession-proposals/${p}/submit", as: Registrar, as_user_id: "reg_1" }
            - { call: "POST /deaccession-proposals/${p}/send-to-board", as: Registrar, as_user_id: "reg_1" }
            - { call: "POST /deaccession-proposals/${p}/approve", as: BoardOfficer, as_user_id: "board_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /deaccession-proposals/${p}/finalize", payload: { hammer_prices: [ { item_id: "${i1}", price_cents: 999 }, { item_id: "${i2}", price_cents: 555 }, { item_id: "${i3}", price_cents: 333 } ] }, as: Registrar, as_user_id: "reg_1", captures: { proceeds: $.data.proceeds_cents } }
          assert:
            - "DeaccessionProposal.${p}.proceeds_cents == 1699  (899 + 500 + 300, per-item round_half_up then sum)"
            - "DeaccessionProposal.${p}.proceeds_cents != 1698  (the forbidden sum-then-round value)"
            - "DeaccessionProposal.${p}.status == FINALIZED"
            - "Item.${i1}.status == DEACCESSIONED and Collection.${c}.status == DEACCESSIONED (item_count reached 0)"
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: item_conservation_treatment_cycle
        grounds:
          - state_machines.Item
          - state_machines.ConservationAssessment
        distinguishing_aspect: |
          Item machine is cyclic (AVAILABLE -> FLAGGED_CONSERVATION ->
          IN_TREATMENT -> AVAILABLE) — the entity returns to a prior state with
          mutated fields (condition_grade POOR -> GOOD, priority score cleared),
          unlike a linear pipeline.
        test_recipe:
          setup:
            - "Item I AVAILABLE (condition POOR); no assessments yet"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 9000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Map" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "County map", condition_grade: "POOR", appraised_value_cents: 30000, format: "MAP" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "GET /items/${i}", as: Archivist, captures: { iv: $.data.version } }
            - { call: "POST /items/${i}/conservation-assessments", payload: { expected_item_version: "${iv}", condition_grade_observed: "POOR", urgency_score: 60, treatment_estimate_hours: 8 }, as: Archivist, captures: { asmt: $.data.id } }
            - { call: "POST /conservation-assessments/${asmt}/approve", as: Archivist }
            - { call: "POST /items/${i}/flag-conservation", as: Archivist }
          trigger:
            - { call: "POST /conservation-assessments/${asmt}/begin-treatment", as: Archivist }
            - { call: "POST /conservation-assessments/${asmt}/complete-treatment", payload: { new_condition_grade: "GOOD" }, as: Archivist }
          assert:
            - "after begin-treatment: Item.${i}.status == IN_TREATMENT and ConservationAssessment.${asmt}.status == IN_TREATMENT"
            - "after complete-treatment: Item.${i}.status == AVAILABLE (cycle closed back to a prior state)"
            - "Item.${i}.condition_grade == GOOD"
            - "Item.${i}.conservation_priority_score == null and Item.${i}.current_assessment_id == null"
            - "ConservationAssessment.${asmt}.status == COMPLETED"

      - name: finding_aid_revision_cycle_with_return_routing
        grounds:
          - state_machines.FindingAid
          - calculations.collection_holdings_rollup
        distinguishing_aspect: |
          FindingAid machine is cyclic (PUBLISHED -> IN_REVISION -> IN_REVIEW ->
          PUBLISHED) AND origin-dependent: /return from IN_REVIEW routes to the
          stamped review_origin (DRAFT vs IN_REVISION), so the same trigger on the
          same current state lands in different next states depending on history.
        test_recipe:
          setup:
            - "Collection C ACTIVE; one FindingAid FA"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
          trigger:
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist, captures: { o1: $.data.review_origin } }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist, captures: { n1: $.data.published_revision_count } }
            - { call: "POST /finding-aids/${fa}/open-revision", as: Archivist }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist, captures: { o2: $.data.review_origin } }
            - { call: "POST /finding-aids/${fa}/return", as: Archivist, captures: { st: $.data.status } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist, captures: { n2: $.data.published_revision_count } }
          assert:
            - "first submit-review stamps review_origin == DRAFT (${o1} == DRAFT)"
            - "after first publish: published_revision_count == 1 (${n1} == 1)"
            - "second submit-review stamps review_origin == IN_REVISION (${o2} == IN_REVISION)"
            - "return from IN_REVIEW routes to IN_REVISION (${st} == IN_REVISION), NOT to DRAFT"
            - "after second publish: published_revision_count == 2 (${n2} == 2)"
            - "Collection.${c}.published_finding_aid_present == true at the end"

      - name: digitization_qc_fail_loop
        grounds:
          - state_machines.DigitizationTicket
        distinguishing_aspect: |
          DigitizationTicket machine loops IN_CAPTURE -> QC_REVIEW -> IN_CAPTURE
          on QC failure (twice in this test) before reaching COMPLETE — a
          branching cycle with a counter (qc_fail_count) that accumulates per loop.
        test_recipe:
          setup:
            - "Item I AVAILABLE; VolunteerProject P ACTIVE; one ticket T queued on I"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 9000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Photos" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "Prints", condition_grade: "GOOD", appraised_value_cents: 15000, format: "PHOTOGRAPH" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "POST /volunteer-projects", payload: { name: "Photo digitization" }, as: VolunteerCoordinator, captures: { p: $.data.id } }
            - { call: "POST /volunteer-projects/${p}/activate", as: VolunteerCoordinator }
            - { call: "POST /volunteer-projects/${p}/tickets", payload: { item_id: "${i}" }, as: VolunteerCoordinator, captures: { t: $.data.id } }
            - { call: "POST /volunteer-projects/${p}/tickets/claim-next", as: Volunteer, as_user_id: "vol_1", captures: { claimed: $.data.id } }
            - { call: "POST /digitization-tickets/${t}/begin-capture", as: Volunteer, as_user_id: "vol_1" }
          trigger:
            - { call: "POST /digitization-tickets/${t}/submit-qc", as: Volunteer, as_user_id: "vol_1" }
            - { call: "POST /digitization-tickets/${t}/qc-fail", as: VolunteerCoordinator, as_user_id: "coord_1", captures: { f1: $.data.qc_fail_count } }
            - { call: "POST /digitization-tickets/${t}/submit-qc", as: Volunteer, as_user_id: "vol_1" }
            - { call: "POST /digitization-tickets/${t}/qc-fail", as: VolunteerCoordinator, as_user_id: "coord_1", captures: { f2: $.data.qc_fail_count } }
            - { call: "POST /digitization-tickets/${t}/submit-qc", as: Volunteer, as_user_id: "vol_1" }
            - { call: "POST /digitization-tickets/${t}/qc-pass", as: VolunteerCoordinator, as_user_id: "coord_1", captures: { fin: $.data.status } }
          assert:
            - "after first qc-fail: status == IN_CAPTURE and qc_fail_count == 1 (${f1} == 1)"
            - "after second qc-fail: status == IN_CAPTURE and qc_fail_count == 2 (${f2} == 2)"
            - "after qc-pass: status == COMPLETE (${fin} == COMPLETE)"
            - "VolunteerProject.${p}.active_ticket_count == 0 after completion"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: environmental_breach_cascade
        grounds:
          - state_machines.StorageZone
          - state_machines.Item
          - state_machines.ReadingRoomAppointment
          - calculations.environmental_posture_evaluation
        distinguishing_aspect: |
          Depth-3 chain from the readings trigger: a third consecutive breach
          flips the zone posture (link 1), which mutates every AVAILABLE item in
          the zone to ZONE_HOLD (link 2), which mutates each future CONFIRMED
          appointment whose request covers a held item to NEEDS_RESCHEDULE
          (link 3) — each link is caused by the previous mutation, not by the
          original POST.
        test_recipe:
          setup:
            - "Item I AVAILABLE in collection C (zone Z, thresholds defaulted: temp_high 24.0); researcher R; request RQ APPROVED over [I]; appointment APPT CONFIRMED for 2026-08-10 10:00-12:00 MAIN"
            - "Logical clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 9000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Ledger" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "Ledger", condition_grade: "GOOD", appraised_value_cents: 15000, format: "BOUND_VOLUME" }, as: Archivist }
