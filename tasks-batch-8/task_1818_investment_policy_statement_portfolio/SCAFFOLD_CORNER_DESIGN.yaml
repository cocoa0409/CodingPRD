            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /advisory/rebalance-proposals", payload: { portfolio_id: "${p}", trigger_type: MANUAL, expected_portfolio_version: "${pv}" }, as: Advisor, captures: { err: $.data.error_id } }
          assert:
            - "http 409 ERR_PORTFOLIO_NOT_ACTIVE (state priority 7 fires before OCC priority 8)"
      - name: withdraw_exceeds_value_difficulty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_WITHDRAWAL_EXCEEDS_VALUE]"
        excluded_because:
          difficulty_instance: withdrawal_amount_equals_total_value_boundary
          rationale: "Boundary and violation asserted there."
      - name: restriction_overlap_difficulty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RESTRICTION_WINDOW_OVERLAP]"
        excluded_because:
          difficulty_instance: restriction_windows_half_open_adjacency_allowed
          rationale: "Overlap rejection asserted there."
      - name: report_overlap_difficulty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_REPORT_PERIOD_OVERLAP]"
        excluded_because:
          difficulty_instance: report_periods_closed_interval_touching_rejected
          rationale: "Closed-interval overlap rejection asserted there."
      - name: benchmark_not_active_difficulty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BENCHMARK_NOT_ACTIVE]"
        excluded_because:
          difficulty_instance: report_finalize_gated_by_benchmark_active
          rationale: "Retired-benchmark finalize rejection asserted there."
      - name: no_active_ips_difficulty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NO_ACTIVE_IPS]"
        excluded_because:
          difficulty_instance: portfolio_activation_gated_by_active_ips
          rationale: "Activation gate asserted there."
      - name: minute_not_ratified_difficulty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_AMENDMENT_MINUTE_NOT_RATIFIED]"
        excluded_because:
          difficulty_instance: finalize_draft_minute_missing_ref_safety_beats_referential
          rationale: "Fiduciary gate asserted there."
      - name: priority_conflicts_difficulty
        claim_type: priority_ordering
        grounds:
          - "validations[priority=7]"
          - "validations[priority=9]"
          - "validations[priority=10]"
          - "validations[priority=13]"
        excluded_because:
          difficulty_instance: execute_frozen_with_restricted_trade_state_beats_safety
          rationale: "Three dual-failure orderings asserted in §1.8 rule 5 instances (state/safety, safety/referential, state/fiscal)."

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: pagination_defaults_limits_and_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
        distinguishing_aspect: "List endpoint honors pagination defaults (limit 10) and reports limit/offset/total_count/has_more; explicit limit+offset pages correctly; success envelope carries meta.api_request_id, meta.api_request_timestamp, response_type 'array'."
        test_recipe:
          setup: ["12 securities created"]
          setup_api_calls:
            - { call: "POST /advisory/securities", payload: { ticker: "S01", asset_class: US_EQUITY, initial_price_cents: 100 }, as: ComplianceOfficer }
            - { call: "POST /advisory/securities", payload: { ticker: "S02", asset_class: US_EQUITY, initial_price_cents: 100 }, as: ComplianceOfficer }
            - { call: "POST /advisory/securities", payload: { ticker: "S03", asset_class: US_EQUITY, initial_price_cents: 100 }, as: ComplianceOfficer }
            - { call: "POST /advisory/securities", payload: { ticker: "S04", asset_class: US_EQUITY, initial_price_cents: 100 }, as: ComplianceOfficer }
            - { call: "POST /advisory/securities", payload: { ticker: "S05", asset_class: US_EQUITY, initial_price_cents: 100 }, as: ComplianceOfficer }
            - { call: "POST /advisory/securities", payload: { ticker: "S06", asset_class: US_EQUITY, initial_price_cents: 100 }, as: ComplianceOfficer }
            - { call: "POST /advisory/securities", payload: { ticker: "S07", asset_class: US_EQUITY, initial_price_cents: 100 }, as: ComplianceOfficer }
            - { call: "POST /advisory/securities", payload: { ticker: "S08", asset_class: US_EQUITY, initial_price_cents: 100 }, as: ComplianceOfficer }
            - { call: "POST /advisory/securities", payload: { ticker: "S09", asset_class: US_EQUITY, initial_price_cents: 100 }, as: ComplianceOfficer }
            - { call: "POST /advisory/securities", payload: { ticker: "S10", asset_class: US_EQUITY, initial_price_cents: 100 }, as: ComplianceOfficer }
            - { call: "POST /advisory/securities", payload: { ticker: "S11", asset_class: US_EQUITY, initial_price_cents: 100 }, as: ComplianceOfficer }
            - { call: "POST /advisory/securities", payload: { ticker: "S12", asset_class: US_EQUITY, initial_price_cents: 100 }, as: ComplianceOfficer }
          trigger:
            - { call: "GET /advisory/securities", as: ComplianceOfficer, captures: { page1: $.data } }
            - { call: "GET /advisory/securities", payload: { limit: 2, offset: 10 }, as: ComplianceOfficer, captures: { page3: $.data } }
            - { call: "GET /advisory/securities", payload: { limit: 0 }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "default page: len(${page1}) == 10, total_count == 12, has_more == true, limit == 10, offset == 0; meta.api_request_id present; response_type == 'array'"
            - "limit=2&offset=10: len(${page3}) == 2, has_more == false, total_count == 12"
            - "limit 0 (below min 1): http 400 ERR_INVALID_REQUEST"
      - name: list_filters_combine_on_portfolios
        claim_type: listing
        grounds:
          - "entities.Portfolio"
        distinguishing_aspect: "Filtered lists intersect predicates: client_id + lifecycle_status together narrow results; a filter matching nothing returns an empty array with total_count 0 (not an error)."
        test_recipe:
          setup: ["client C1 with portfolios P1 (OPEN) and P2 (OPEN); client C2 with portfolio P3 (OPEN); C1's P2 frozen-capable... (P2 stays OPEN)"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "F1", risk_tolerance_score: 50 }, as: Advisor, captures: { c1: $.data.id } }
            - { call: "POST /advisory/clients/${c1}/activate", as: Advisor }
            - { call: "POST /advisory/clients", payload: { full_name: "F2", risk_tolerance_score: 50 }, as: Advisor, captures: { c2: $.data.id } }
            - { call: "POST /advisory/clients/${c2}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c1}", name: "P1", tax_status: TAXABLE }, as: Advisor, captures: { p1: $.data.id } }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c1}", name: "P2", tax_status: TAX_DEFERRED }, as: Advisor, captures: { p2: $.data.id } }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c2}", name: "P3", tax_status: TAX_EXEMPT }, as: Advisor, captures: { p3: $.data.id } }
          trigger:
            - { call: "GET /advisory/portfolios", payload: { client_id: "${c1}" }, as: Advisor, captures: { rows1: $.data } }
            - { call: "GET /advisory/portfolios", payload: { client_id: "${c1}", lifecycle_status: OPEN }, as: Advisor, captures: { rows2: $.data } }
            - { call: "GET /advisory/portfolios", payload: { client_id: "${c1}", lifecycle_status: FROZEN }, as: Advisor, captures: { rows3: $.data } }
          assert:
            - "client_id filter: len(${rows1}) == 2 (P1, P2 only — no leakage of C2's P3)"
            - "client_id + lifecycle_status OPEN: len == 2; with FROZEN: len(${rows3}) == 0 (empty array, http 200, total_count 0)"
      - name: allocation_targets_bulk_replace_is_atomic
        claim_type: bulk_action
        grounds:
          - "entities.AllocationTarget"
        distinguishing_aspect: "PUT replace is all-or-nothing: an array with a duplicate asset_class fails 400 and leaves the previous set untouched; a valid PUT fully replaces (old rows vanish, ids are fresh)."
        test_recipe:
          setup: ["ACTIVE client; benchmark; IPS DRAFT with a valid 60/40 target set already in place"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Bulk", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 40.00, band_pct: 5.00 } ] }, as: Advisor }
          trigger:
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 50.00, band_pct: 5.00 }, { asset_class: US_EQUITY, target_pct: 50.00, band_pct: 5.00 } ] }, as: Advisor, captures: { err: $.data.error_id } }
            - { call: "GET /advisory/ips-policies/${i}/allocation-targets", as: Advisor, captures: { rows1: $.data } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: FIXED_INCOME, target_pct: 100.00, band_pct: 3.00 } ] }, as: Advisor }
            - { call: "GET /advisory/ips-policies/${i}/allocation-targets", as: Advisor, captures: { rows2: $.data } }
          assert:
            - "duplicate asset_class in the array: http 400 ERR_INVALID_REQUEST and the previous 60/40 set is fully intact (len(${rows1}) == 2, atomic — no partial write)"
            - "valid replace: len(${rows2}) == 1 with asset_class FIXED_INCOME target_pct 100.00 band_pct 3.00 — the US_EQUITY and CASH_EQUIVALENT rows are gone"
      - name: fk_reverse_reachability_filtered_lists
        claim_type: retrieval
        grounds:
          - "entities.InvestmentPolicyStatement.fields.client_id"
          - "entities.Position.fields.portfolio_id"
          - "entities.CashFlowEvent.fields.portfolio_id"
        distinguishing_aspect: "Every FK is traversable parent -> children via filtered list: ips-policies?client_id, positions?portfolio_id, cash-flow-events?portfolio_id return exactly the owned rows; foreign ids yield empty arrays."
        test_recipe:
          setup: ["client C1 with ACTIVE IPS and ACTIVE portfolio holding 1 position + 1 deposit event; client C2 with an empty portfolio"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "FK1", risk_tolerance_score: 50 }, as: Advisor, captures: { c1: $.data.id } }
            - { call: "POST /advisory/clients/${c1}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c1}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c1}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c1}", name: "P", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 5000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s}", quantity: 5, opening_cost_basis_cents: 5000 }, as: Advisor }
            - { call: "POST /advisory/clients", payload: { full_name: "FK2", risk_tolerance_score: 50 }, as: Advisor, captures: { c2: $.data.id } }
            - { call: "POST /advisory/clients/${c2}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c2}", name: "Q", tax_status: TAXABLE }, as: Advisor, captures: { q: $.data.id } }
          trigger:
            - { call: "GET /advisory/ips-policies", payload: { client_id: "${c1}" }, as: Advisor, captures: { r1: $.data } }
            - { call: "GET /advisory/positions", payload: { portfolio_id: "${p}" }, as: Advisor, captures: { r2: $.data } }
            - { call: "GET /advisory/cash-flow-events", payload: { portfolio_id: "${p}" }, as: Advisor, captures: { r3: $.data } }
            - { call: "GET /advisory/ips-policies", payload: { client_id: "${c2}" }, as: Advisor, captures: { r4: $.data } }
            - { call: "GET /advisory/positions", payload: { portfolio_id: "${q}" }, as: Advisor, captures: { r5: $.data } }
          assert:
            - "len(${r1}) == 1 (the IPS), len(${r2}) == 1 (the position), len(${r3}) == 1 (the deposit event)"
            - "foreign filters: len(${r4}) == 0 and len(${r5}) == 0 (no cross-client leakage)"
      - name: default_logical_clock_proven_by_event_futurity
        claim_type: conditional_action
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_EVENT_IN_FUTURE]"
        distinguishing_aspect: "Without any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z: an event at that instant is accepted and one 1s later is rejected — the documented startup default, not wall-clock time."
        test_recipe:
          setup: ["ACTIVE portfolio (CASH 100/50 IPS); no clock call has been made"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Clk", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: CASH_EQUIVALENT, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
          trigger:
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 1000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor, captures: { ev: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 1000, occurred_at: "2026-08-01T00:00:01Z" }, as: Advisor, captures: { err: $.data.error_id } }
          assert:
            - "occurred_at == 2026-08-01T00:00:00Z accepted (<= default clock, equality allowed)"
            - "occurred_at == 2026-08-01T00:00:01Z rejected 422 ERR_EVENT_IN_FUTURE — proving the unset clock is exactly 2026-08-01T00:00:00Z"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape_for_4xx
        claim_type: violation_to_error
        grounds:
          - "response_envelope"
          - "errors[ERR_INVALID_REQUEST]"
          - "errors[ERR_INVALID_REFERENCE]"
        distinguishing_aspect: "Every error response uses the fixed envelope: meta.api_request_id + api_request_timestamp, response_type 'error', data.error_id, data.message — demonstrated on a 400 and a 422."
        test_recipe:
          setup: ["one ACTIVE client exists"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Env", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
          trigger:
            - { call: "POST /advisory/securities", payload: { ticker: "BAD", asset_class: "EQUITY", initial_price_cents: 100 }, as: ComplianceOfficer, captures: { e1: $.data.error_id, m1: $.data.message } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", benchmark_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { e2: $.data.error_id } }
          assert:
            - "400 case: response_type == 'error', data.error_id == ERR_INVALID_REQUEST, data.message non-empty, meta.api_request_id present"
            - "422 case: data.error_id == ERR_INVALID_REFERENCE (both body FKs bogus) with the same envelope shape"
      - name: error_catalog_coverage_via_sections
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_UNAUTHENTICATED]"
        excluded_because:
          difficulty_instance: execute_frozen_with_restricted_trade_state_beats_safety
          rationale: "Catalog-wide triggerability is delivered across this file (every error id appears in at least one instance's assert) and the §1.8 rule-5 instances; this stub exists only to record the audit decision for the errors section."

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_missing_auth_headers_unauthenticated
        claim_type: exclusive_operation_denied
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Missing headers, an undeclared role, or a declared role without X-User-ID all yield 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advisory/clients", payload: { full_name: "X", risk_tolerance_score: 50 }, as: Anonymous, captures: { err1: $.data.error_id } }
            - { call: "POST /advisory/clients", payload: { full_name: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { err2: $.data.error_id } }
          assert:
            - "no headers at all (Anonymous = no X-User-Role / X-User-ID): 401 ERR_UNAUTHENTICATED"
            - "declared role but no X-User-ID header: 401 ERR_UNAUTHENTICATED"
      - name: rbac_advisor_cannot_run_compliance_operations
        claim_type: exclusive_operation_denied
        grounds:
          - "roles.Advisor"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "Advisor is denied (403, priority 2 — fires even for non-existent ids) on reprice, set-trading-status, proposal approve, trade void, report finalize, restricted-list create, freeze, and checkpoints."
        test_recipe:
          setup: ["empty database (role check precedes existence)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advisory/securities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/reprice", payload: { new_price_cents: 100 }, as: Advisor, captures: { e1: $.data.error_id } }
            - { call: "POST /advisory/rebalance-proposals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/approve", as: Advisor, captures: { e2: $.data.error_id } }
            - { call: "POST /advisory/trade-instructions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/void", as: Advisor, captures: { e3: $.data.error_id } }
            - { call: "POST /advisory/compliance-checkpoints", as: Advisor, captures: { e4: $.data.error_id } }
            - { call: "POST /advisory/portfolios/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/freeze", as: Advisor, captures: { e5: $.data.error_id } }
          assert:
            - "all five calls: http 403 ERR_FORBIDDEN_ROLE (compliance-exclusive operations)"
      - name: rbac_compliance_cannot_run_advisory_or_committee_operations
        claim_type: exclusive_operation_denied
        grounds:
          - "roles.ComplianceOfficer"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "ComplianceOfficer is denied 403 on client create, portfolio create, proposal generate, withdrawal model-impact, amendment submit, and amendment vote."
        test_recipe:
          setup: ["empty database (role check precedes existence)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advisory/clients", payload: { full_name: "X", risk_tolerance_score: 50 }, as: ComplianceOfficer, captures: { e1: $.data.error_id } }
            - { call: "POST /advisory/portfolios", payload: { client_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", name: "P", tax_status: TAXABLE }, as: ComplianceOfficer, captures: { e2: $.data.error_id } }
            - { call: "POST /advisory/ips-amendments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/vote", payload: { decision: APPROVE }, as: ComplianceOfficer, captures: { e3: $.data.error_id } }
            - { call: "POST /advisory/withdrawal-requests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/model-impact", as: ComplianceOfficer, captures: { e4: $.data.error_id } }
          assert:
            - "all four calls: http 403 ERR_FORBIDDEN_ROLE"
      - name: rbac_committee_roles_are_strictly_split
        claim_type: exclusive_operation_denied
        grounds:
          - "roles.CommitteeMember"
          - "roles.CommitteeChair"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "The chair cannot vote or record minutes; members cannot ratify or finalize — the segregation-of-duties role model holds at role granularity."
        test_recipe:
          setup: ["empty database (role check precedes existence)"]
          setup_api_calls:
            - { call: "POST /advisory/benchmarks", payload: { name: "B" }, as: ComplianceOfficer, captures: { b: $.data.id, bv: $.data.version } }
          trigger:
            - { call: "POST /advisory/ips-amendments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/vote", payload: { decision: APPROVE }, as: CommitteeChair, captures: { e1: $.data.error_id } }
            - { call: "POST /advisory/committee-minutes", payload: { meeting_date: "2026-08-01", amendment_refs: [], decisions_text: "X" }, as: CommitteeChair, captures: { e2: $.data.error_id } }
            - { call: "POST /advisory/committee-minutes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/ratify", as: CommitteeMember, captures: { e3: $.data.error_id } }
            - { call: "POST /advisory/ips-amendments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/finalize", payload: { ratified_minute_id: "${b}", expected_ips_version: "${bv}" }, as: CommitteeMember, captures: { e4: $.data.error_id } }
          assert:
            - "vote as chair: 403; minute create as chair: 403; ratify as member: 403; finalize as member: 403 — all ERR_FORBIDDEN_ROLE"
      - name: rbac_platform_admin_confined_to_clock
        claim_type: exclusive_operation_denied
        grounds:
          - "roles.PlatformAdmin"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "PlatformAdmin may ONLY set the logical clock; every business endpoint denies it (403), and other roles are denied the clock."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advisory/clients", payload: { full_name: "X", risk_tolerance_score: 50 }, as: PlatformAdmin, captures: { e1: $.data.error_id } }
            - { call: "POST /advisory/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlatformAdmin, captures: { now: $.data.current_utc } }
            - { call: "POST /advisory/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: Advisor, captures: { e2: $.data.error_id } }
          assert:
            - "PlatformAdmin on business endpoint: 403 ERR_FORBIDDEN_ROLE"
            - "PlatformAdmin clock set: 200, current_utc == 2026-08-02T00:00:00Z"
            - "Advisor on clock endpoint: 403 ERR_FORBIDDEN_ROLE (clock stays 2026-08-02)"
      - name: rbac_client_ownership_enforced_by_user_id
        claim_type: ownership_denied
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
          - "roles.Client"
        distinguishing_aspect: "The entity-backed Client role: X-User-ID must equal the owning client's id — reading another client is 403 ERR_NOT_RESOURCE_OWNER; signing another client's IPS is 403 (ownership, priority 3) even before the IPS state check (priority 7)."
        test_recipe:
          setup: ["clients C1 and C2 ACTIVE; C1 has a DRAFT IPS"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "C1", risk_tolerance_score: 50 }, as: Advisor, captures: { c1: $.data.id } }
            - { call: "POST /advisory/clients/${c1}/activate", as: Advisor }
            - { call: "POST /advisory/clients", payload: { full_name: "C2", risk_tolerance_score: 50 }, as: Advisor, captures: { c2: $.data.id } }
            - { call: "POST /advisory/clients/${c2}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c1}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
          trigger:
            - { call: "GET /advisory/clients/${c1}", as: Client, as_user_id: "${c2}", captures: { e1: $.data.error_id } }
            - { call: "GET /advisory/clients/${c1}", as: Client, as_user_id: "${c1}", captures: { ok: $.data.id } }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c2}", captures: { e2: $.data.error_id } }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c1}", captures: { e3: $.data.error_id } }
          assert:
            - "C2 reading C1: 403 ERR_NOT_RESOURCE_OWNER; C1 reading itself: 200"
            - "C2 signing C1's IPS: 403 ERR_NOT_RESOURCE_OWNER (ownership beats the state check)"
            - "C1 signing while IPS is DRAFT: 409 ERR_IPS_INVALID_STATE (ownership passed, state gate fires)"
      - name: rbac_client_scoped_lists
        claim_type: ownership_denied
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
        distinguishing_aspect: "Client-role list reads are auto-scoped to the caller's own client_id; explicitly filtering by another client's id is 403."
        test_recipe:
          setup: ["clients C1 (with one portfolio) and C2"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "L1", risk_tolerance_score: 50 }, as: Advisor, captures: { c1: $.data.id } }
            - { call: "POST /advisory/clients/${c1}/activate", as: Advisor }
            - { call: "POST /advisory/clients", payload: { full_name: "L2", risk_tolerance_score: 50 }, as: Advisor, captures: { c2: $.data.id } }
            - { call: "POST /advisory/clients/${c2}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c1}", name: "P", tax_status: TAXABLE }, as: Advisor }
          trigger:
            - { call: "GET /advisory/portfolios", as: Client, as_user_id: "${c1}", captures: { own: $.data } }
            - { call: "GET /advisory/portfolios", payload: { client_id: "${c1}" }, as: Client, as_user_id: "${c2}", captures: { e1: $.data.error_id } }
          assert:
            - "C1 unfiltered list: exactly its own 1 portfolio (len(${own}) == 1)"
            - "C2 filtering by C1's id: 403 ERR_NOT_RESOURCE_OWNER"
      - name: rbac_withdrawal_create_shared_but_cancel_client_only
        claim_type: exclusive_operation_denied
        grounds:
          - "roles.Client"
          - "roles.Advisor"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "Withdrawal creation is shared (Advisor or owning Client) but cancel is Client-exclusive: a non-owning client is 403 on create; the Advisor is 403 ERR_FORBIDDEN_ROLE on cancel; the owning client cancels successfully."
        test_recipe:
          setup: ["C1 ACTIVE with ACTIVE IPS (CASH 100/50), ACTIVE portfolio, cash 100000; C2 ACTIVE; withdrawal created by Advisor"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "W1", risk_tolerance_score: 50 }, as: Advisor, captures: { c1: $.data.id } }
            - { call: "POST /advisory/clients/${c1}/activate", as: Advisor }
            - { call: "POST /advisory/clients", payload: { full_name: "W2", risk_tolerance_score: 50 }, as: Advisor, captures: { c2: $.data.id } }
            - { call: "POST /advisory/clients/${c2}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c1}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: CASH_EQUIVALENT, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c1}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c1}", name: "P", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
          trigger:
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 1000, funding_mode: CASH_FIRST }, as: Client, as_user_id: "${c2}", captures: { e1: $.data.error_id } }
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 1000, funding_mode: CASH_FIRST }, as: Advisor, captures: { w: $.data.id } }
            - { call: "POST /advisory/withdrawal-requests/${w}/cancel", as: Advisor, captures: { e2: $.data.error_id } }
            - { call: "POST /advisory/withdrawal-requests/${w}/cancel", as: Client, as_user_id: "${c1}", captures: { st: $.data.status } }
          assert:
            - "create by non-owning client C2: 403 ERR_NOT_RESOURCE_OWNER"
            - "create by Advisor (shared operation): 201 SUBMITTED"
            - "cancel by Advisor: 403 ERR_FORBIDDEN_ROLE (cancel is Client-exclusive)"
            - "cancel by owning client C1: 200 CANCELLED"

  # ===========================================================================
  # Section: complexity_layers (cross-cutting)
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_portfolio_version_on_proposal_generate
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[proposal-create-stale-portfolio]"
          - "errors[ERR_STALE_PORTFOLIO_VERSION]"
        distinguishing_aspect: "Two strictly sequential generations: the first succeeds and advances Portfolio.version; the second carrying the same expected_portfolio_version is deterministically rejected 412 ERR_STALE_PORTFOLIO_VERSION; re-reading and resubmitting with the fresh version succeeds."
        test_recipe:
          setup: ["ACTIVE client with ACTIVE IPS (CASH 100/50); ACTIVE portfolio with cash 100000"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "OCC1", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: CASH_EQUIVALENT, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /advisory/rebalance-proposals", payload: { portfolio_id: "${p}", trigger_type: MANUAL, expected_portfolio_version: "${pv}" }, as: Advisor, captures: { g1: $.data.id } }
            - { call: "POST /advisory/rebalance-proposals", payload: { portfolio_id: "${p}", trigger_type: MANUAL, expected_portfolio_version: "${pv}" }, as: Advisor, captures: { err: $.data.error_id } }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { pv2: $.data.version } }
            - { call: "POST /advisory/rebalance-proposals", payload: { portfolio_id: "${p}", trigger_type: MANUAL, expected_portfolio_version: "${pv2}" }, as: Advisor, captures: { g2: $.data.id } }
          assert:
            - "first generate succeeds (201); identical expected_portfolio_version on the second: 412 ERR_STALE_PORTFOLIO_VERSION (generation incremented Portfolio.version by 1)"
            - "third generate with the re-read version succeeds (201) — recovery path"
            - "G1 is EXPIRED (superseded by G2); no proposal is created by the 412 call"
      - name: occ_stale_ips_version_on_amendment_finalize
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[amendment-finalize-stale-ips]"
          - "errors[ERR_STALE_IPS_VERSION]"
        distinguishing_aspect: "Two QUORUM_REACHED amendments documented in one ratified minute: finalizing A2 advances IPS.version; finalizing A1 with the pre-finalize version is 412 ERR_STALE_IPS_VERSION; re-observing and retrying finalizes A1."
        test_recipe:
          setup: ["ACTIVE IPS; amendments A1 and A2 both SUBMITTED then QUORUM_REACHED; minute M (refs [A1, A2]) RATIFIED"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "OCC2", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: CASH_EQUIVALENT, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/ips-amendments", payload: { ips_id: "${i}", proposed_objective_text: "A1 text" }, as: Advisor, as_user_id: "adv-1", captures: { a1: $.data.id } }
            - { call: "POST /advisory/ips-amendments/${a1}/submit", as: Advisor, as_user_id: "adv-1" }
            - { call: "POST /advisory/ips-amendments/${a1}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-1" }
            - { call: "POST /advisory/ips-amendments/${a1}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-2" }
            - { call: "POST /advisory/ips-amendments/${a1}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-3" }
            - { call: "POST /advisory/ips-amendments", payload: { ips_id: "${i}", proposed_review_cadence_months: 6 }, as: Advisor, as_user_id: "adv-1", captures: { a2: $.data.id } }
            - { call: "POST /advisory/ips-amendments/${a2}/submit", as: Advisor, as_user_id: "adv-1" }
            - { call: "POST /advisory/ips-amendments/${a2}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-1" }
            - { call: "POST /advisory/ips-amendments/${a2}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-2" }
            - { call: "POST /advisory/ips-amendments/${a2}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-3" }
            - { call: "POST /advisory/committee-minutes", payload: { meeting_date: "2026-08-01", amendment_refs: [ "${a1}", "${a2}" ], decisions_text: "Both approved" }, as: CommitteeMember, as_user_id: "cm-1", captures: { min: $.data.id } }
            - { call: "POST /advisory/committee-minutes/${min}/ratify", as: CommitteeChair, as_user_id: "chair-1" }
            - { call: "GET /advisory/ips-policies/${i}", as: Advisor, captures: { iv: $.data.version } }
          trigger:
            - { call: "POST /advisory/ips-amendments/${a2}/finalize", payload: { ratified_minute_id: "${min}", expected_ips_version: "${iv}" }, as: CommitteeChair, as_user_id: "chair-1" }
            - { call: "POST /advisory/ips-amendments/${a1}/finalize", payload: { ratified_minute_id: "${min}", expected_ips_version: "${iv}" }, as: CommitteeChair, as_user_id: "chair-1", captures: { err: $.data.error_id } }
            - { call: "GET /advisory/ips-policies/${i}", as: Advisor, captures: { iv2: $.data.version } }
            - { call: "POST /advisory/ips-amendments/${a1}/finalize", payload: { ratified_minute_id: "${min}", expected_ips_version: "${iv2}" }, as: CommitteeChair, as_user_id: "chair-1" }
          assert:
            - "finalize A2 with fresh version: 200 APPROVED; IPS cadence now 6"
            - "finalize A1 with the stale ${iv}: 412 ERR_STALE_IPS_VERSION (A2's finalize bumped InvestmentPolicyStatement.version)"
            - "finalize A1 with re-read ${iv2}: 200 APPROVED; IPS objective_text == 'A1 text'"
      - name: version_pin_stale_detection_and_recovery_via_revise
        claim_type: version_pinning_stale_detection
        grounds:
          - "entities.RebalanceProposal.fields.pinned_ips_version"
          - "errors[ERR_PROPOSAL_STALE_PIN]"
        distinguishing_aspect: "complete-review bumps IPS.version without expiring proposals; a proposal pinned to the older version is rejected 422 ERR_PROPOSAL_STALE_PIN at approve; request-changes + revise refreshes the pin and approve then succeeds."
        test_recipe:
          setup: ["60/40 breach fixture (EQA 600 @ 1000 basis 480000 repriced 1500, total 1300000, BREACHED); proposal G generated pinning the current IPS version; complete-review advances IPS.version"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Pin", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 40.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 400000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s}", quantity: 600, opening_cost_basis_cents: 480000 }, as: Advisor }
            - { call: "POST /advisory/securities/${s}/reprice", payload: { new_price_cents: 1500 }, as: ComplianceOfficer }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { pv: $.data.version } }
            - { call: "POST /advisory/rebalance-proposals", payload: { portfolio_id: "${p}", trigger_type: DRIFT_BREACH, expected_portfolio_version: "${pv}" }, as: Advisor, captures: { g: $.data.id, pin: $.data.pinned_ips_version } }
            - { call: "POST /advisory/ips-policies/${i}/complete-review", as: Advisor }
          trigger:
            - { call: "POST /advisory/rebalance-proposals/${g}/approve", as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /advisory/rebalance-proposals/${g}/request-changes", payload: { reason: "refresh pin" }, as: ComplianceOfficer }
            - { call: "POST /advisory/rebalance-proposals/${g}/revise", as: Advisor, captures: { pin2: $.data.pinned_ips_version } }
            - { call: "POST /advisory/rebalance-proposals/${g}/approve", as: ComplianceOfficer, captures: { st: $.data.status } }
          assert:
            - "approve against the stale pin: 422 ERR_PROPOSAL_STALE_PIN (pinned_ips_version ${pin} < current IPS.version after complete-review)"
            - "revise refreshes pinned_ips_version to the current IPS.version and regenerates trades at current prices"
            - "second approve succeeds: status APPROVED (recovery path through the revision cycle)"
      - name: derived_cash_balance_reconciles_with_event_ledger_arrival_order
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.portfolio_valuation"
          - "entities.CashFlowEvent.fields.balance_after_cents"
        distinguishing_aspect: "cash_balance_cents is an arrival-ordered projection: a backdated deposit (occurred_at 2026-07-15) appended AFTER an 08-01 deposit gets balance_after 100000 (not reordered); the portfolio's computed cash always equals SUM(amount_cents)."
