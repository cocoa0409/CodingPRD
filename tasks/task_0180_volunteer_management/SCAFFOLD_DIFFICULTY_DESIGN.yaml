  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: temporal_beats_capacity_on_signup
        grounds:
          - validations[priority=8]
          - validations[priority=14]
          - errors[ERR_SHIFT_TIME_CONFLICT]
          - errors[ERR_SHIFT_FULL]
        distinguishing_aspect: "Error-category pair business_temporal (priority 8) vs business_fiscal capacity (priority 14): a signup that both overlaps a held shift AND targets a FULL shift returns ERR_SHIFT_TIME_CONFLICT, proving the temporal check is evaluated before the capacity check."
        test_recipe:
          setup:
            - "Volunteer V holds a CONFIRMED Signup on shift A (09:00-12:00). Shift B (10:00-11:00) overlaps A AND is already FULL (capacity 1, seat taken by another volunteer). V attempts to sign up for B: both capacity (priority 14, business_fiscal) and temporal-overlap (priority 8, business_temporal) are violated; the higher-priority temporal check wins."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Helping Hands" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Va V", email: "va@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Other V", email: "other@x.com" }
              as: ShiftCoordinator
              captures: { other_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Overlap Day" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 1 }
              as: ShiftCoordinator
              captures: { shift_a: $.data.id, shift_a_v: $.data.version }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T10:00:00Z", ends_at: "2026-07-01T11:00:00Z", capacity: 1 }
              as: ShiftCoordinator
              captures: { shift_b: $.data.id, shift_b_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_a}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_a_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_a: $.data.id }
            - call: "POST /vm/signups/${su_a}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /vm/shifts/${shift_b}/signups"
              payload: { volunteer_id: "${other_id}", expected_shift_version: "${shift_b_v}" }
              as: Volunteer
              as_user_id: "${other_id}"
              captures: { su_b_other: $.data.id }
          trigger:
            - call: "POST /vm/shifts/${shift_b}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_b_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SHIFT_TIME_CONFLICT (priority-8 temporal beats priority-14 capacity)"

      - name: bg_tier_safety_beats_capacity_fiscal_on_signup
        grounds:
          - validations[priority=9]
          - validations[priority=14]
          - errors[ERR_BG_TIER_INSUFFICIENT]
          - errors[ERR_SHIFT_FULL]
        distinguishing_aspect: "Different error-category pair (business_safety vs business_fiscal): a volunteer lacking the required ENHANCED bg tier signs up for a shift that is also FULL; the higher-priority bg-tier safety check (priority 9) wins over capacity (priority 14)."
        test_recipe:
          setup:
            - "PUBLISHED Opportunity with required_bg_tier ENHANCED; a single-seat Shift already FULL (seat held by another volunteer who DOES meet the tier). Volunteer V has bg_check_tier NONE. V attempts signup: both ERR_BG_TIER_INSUFFICIENT (priority 9) and ERR_SHIFT_FULL (priority 14) apply."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Helping Hands" }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Cleared V", email: "cleared@x.com" }
              as: ComplianceOfficer
              captures: { cleared_id: $.data.id }
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Vic V", email: "vic@x.com" }
              as: ComplianceOfficer
              captures: { vol_id: $.data.id }
            - call: "POST /vm/background-checks"
              payload: { volunteer_id: "${cleared_id}", requested_tier: "ENHANCED" }
              as: ComplianceOfficer
              captures: { chk_id: $.data.id }
            - call: "POST /vm/background-checks/${chk_id}/start"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /vm/volunteers/${cleared_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { cleared_v: $.data.version }
            - call: "POST /vm/background-checks/${chk_id}/decide"
              payload: { decision: "CLEARED", expected_volunteer_version: "${cleared_v}" }
              as: ComplianceOfficer
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Sensitive", required_bg_tier: "ENHANCED" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 1 }
              as: ShiftCoordinator
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_id}/signups"
              payload: { volunteer_id: "${cleared_id}", expected_shift_version: "${shift_v}" }
              as: Volunteer
              as_user_id: "${cleared_id}"
              captures: { su_cleared: $.data.id }
          trigger:
            - call: "POST /vm/shifts/${shift_id}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_BG_TIER_INSUFFICIENT (priority-9 safety beats priority-14 capacity)"

