            - call: "POST /malt-lots/${lot8_id}/release"
              payload: { release_note: "cleared" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
            - call: "POST /sales-orders"
              payload: { brewer_id: "${b8_id}", requested_ship_date: "2026-09-20T00:00:00Z", purchase_order_ref: "PO-AT-MOQ" }
              as: Brewer
              as_user_id: "${b8_id}"
              captures: { at_moq_id: $.data.id }
            - call: "POST /sales-orders/${at_moq_id}/lines"
              payload: { item_type: "MALT", quantity: 1000, uom: "LB", malt_lot_id: "${lot8_id}" }
              as: Brewer
              as_user_id: "${b8_id}"
            - call: "POST /sales-orders/${at_moq_id}/lines"
              payload: { item_type: "MALT", quantity: 1000, uom: "LB", malt_lot_id: "${lot8_id}" }
              as: Brewer
              as_user_id: "${b8_id}"
