      - name: terminating_the_repurchase_plan_cancels_periods_and_locks_the_axis
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /offerings/{offering_id}/repurchase-plan]
          - state_machines.Offering.repurchase_plan_status.ACTIVE_to_TERMINATED
          - state_machines.Offering.repurchase_plan_status.terminal_states
          - errors[ERR_REPURCHASE_PLAN_SUSPENDED]
        distinguishing_aspect: |
          One TERMINATE call must cancel the OPEN period, reject both of its
          queued requests, and leave the axis terminal — so a later RESUME is an
          undefined transition while new periods and tenders are refused by the
          cross-entity gate instead.
