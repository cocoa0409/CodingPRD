# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2708 - Grassroots Advocacy Campaign Management
#
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every instance's setup_api_calls chain drives an empty database into the
# stated precondition using only endpoints declared in SCAFFOLD.yaml §1.5,
# with every ${var} bound by an earlier captures: block.
# ===========================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: activation_projected_versus_realized_reach_diverge
        grounds:
          - calculations.activation_reach
          - entities.Activation.fields.projected_reach
          - entities.Activation.fields.realized_reach
          - entities.Activation.fields.suppressed_by_consent_count
          - entities.Activation.fields.send_cost_cents
          - state_machines.Activation.SENDING_to_SENT
        distinguishing_aspect: |
          This instance's two variants live in the Activation (send-execution) domain: the
          forward-looking projected_reach counts who the wave MAY lawfully touch at scheduling time,
          while the chronological realized_reach replays the vendor tally and re-checks consent at
          completion - so identical wave data yields projected_reach 4 and realized_reach 3 once one
          targeted supporter revokes EMAIL consent mid-flight, while send_cost_cents still bills all
          4 delivered touches.
        test_recipe:
          setup:
            - "One ACTIVE campaign with one HOUSE legislator in district HD-14."
            - "Four supporters in HD-14, each with EMAIL consent GRANTED at intake."
            - "One EMAIL segment holding all four supporters, and one LOCKED single-endorsement EMAIL variant."
            - "One EMAIL activation CLEARED and SENDING inside its send window, projected_reach 4."
            - "Supporter 2 revokes EMAIL consent while the wave is SENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Alba", district_code: "HD-14", chamber: "HOUSE", stance: "UNDECIDED" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { leg_id: $.data.id }
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/supporters"
              payload: { campaign_id: "${camp_id}", full_name: "Sup One", email: "s1@example.org", district_code: "HD-14", acquisition_source: "PETITION", initial_consent_channels: ["EMAIL"], lawful_basis: "OPT_IN_FORM", consent_source_reference: "web-form-1" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { sup1_id: $.data.id }
            - call: "POST /advocacy/supporters"
              payload: { campaign_id: "${camp_id}", full_name: "Sup Two", email: "s2@example.org", district_code: "HD-14", acquisition_source: "PETITION", initial_consent_channels: ["EMAIL"], lawful_basis: "OPT_IN_FORM", consent_source_reference: "web-form-1" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { sup2_id: $.data.id }
            - call: "POST /advocacy/supporters"
              payload: { campaign_id: "${camp_id}", full_name: "Sup Three", email: "s3@example.org", district_code: "HD-14", acquisition_source: "PETITION", initial_consent_channels: ["EMAIL"], lawful_basis: "OPT_IN_FORM", consent_source_reference: "web-form-1" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { sup3_id: $.data.id }
            - call: "POST /advocacy/supporters"
              payload: { campaign_id: "${camp_id}", full_name: "Sup Four", email: "s4@example.org", district_code: "HD-14", acquisition_source: "PETITION", initial_consent_channels: ["EMAIL"], lawful_basis: "OPT_IN_FORM", consent_source_reference: "web-form-1" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { sup4_id: $.data.id }
            - call: "POST /advocacy/segments"
              payload: { campaign_id: "${camp_id}", name: "Email openers", rule_required_channel: "EMAIL" }
              as: MessageStrategist
              as_user_id: "u_strat_1"
              captures: { seg_id: $.data.id }
            - call: "POST /advocacy/message-variants"
              payload: { campaign_id: "${camp_id}", test_cell: "ECONOMIC_FRAME", headline: "Vote yes on HB-1420", body: "Ask your representative to vote yes on HB-1420.", channel_scope: ["EMAIL"] }
              as: MessageStrategist
              as_user_id: "u_strat_1"
              captures: { var_id: $.data.id }
            - call: "POST /advocacy/message-variants/${var_id}/submit"
              payload: { submission_note: "ready for compliance review" }
              as: MessageStrategist
              as_user_id: "u_strat_1"
            - call: "POST /advocacy/message-variants/${var_id}/review-decisions"
              payload: { decision: "APPROVE", review_note: "copy is compliant" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
            - call: "POST /advocacy/coalition-partners"
              payload: { campaign_id: "${camp_id}", org_name: "Anchor Housing Alliance", tier: "ANCHOR", branding_asset_ref: "brand/anchor.svg" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { part_a_id: $.data.id }
            - call: "GET /advocacy/message-variants/${var_id}"
              payload: {}
              as: PartnerDelegate
              as_user_id: "${part_a_id}"
              captures: { var_v1: $.data.version }
            - call: "POST /advocacy/partner-endorsements"
              payload: { partner_id: "${part_a_id}", message_variant_id: "${var_id}", discipline_pledge: true, talking_points_ack: true, expected_variant_version: "${var_v1}" }
              as: PartnerDelegate
              as_user_id: "${part_a_id}"
              captures: { end_a_id: $.data.id }
            - call: "POST /advocacy/message-variants/${var_id}/lock"
              payload: {}
              as: MessageStrategist
              as_user_id: "u_strat_1"
            - call: "GET /advocacy/segments/${seg_id}"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { seg_v1: $.data.version }
            - call: "POST /advocacy/activations"
              payload: { campaign_id: "${camp_id}", segment_id: "${seg_id}", message_variant_id: "${var_id}", channel: "EMAIL", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T17:00:00Z", expected_segment_version: "${seg_v1}", min_viable_reach: 1 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { act_id: $.data.id, projected_at_create: $.data.projected_reach }
            - call: "POST /advocacy/activations/${act_id}/clear"
              payload: { clearance_note: "consent evidence sampled" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T10:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/activations/${act_id}/start-send"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/consent-events"
              payload: { supporter_id: "${sup2_id}", channel: "EMAIL", action: "REVOKE", source_reference: "unsubscribe-link-2" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
          trigger:
            - call: "POST /advocacy/activations/${act_id}/complete"
              payload: { delivered_count: 4, bounced_count: 0 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
          assert:
            - "Activation.${act_id}.projected_reach == 4"
            - "Activation.${act_id}.realized_reach == 3"
            - "Activation.${act_id}.suppressed_by_consent_count == 1"
            - "Activation.${act_id}.send_cost_cents == 8"
            - "Activation.${act_id}.delivery_state == SENT"
            - "Supporter.${sup2_id}.email_consent_state == REVOKED"
            - "Supporter.${sup2_id}.suppressed == false"
            - "MessageVariant.${var_id}.realized_reach_total == 3"
            - "MessageVariant.${var_id}.send_cost_total_cents == 8"

      - name: supporter_engagement_versus_retention_score_diverge
        grounds:
          - calculations.supporter_value_score
          - entities.Supporter.fields.engagement_score
          - entities.Supporter.fields.retention_score
          - state_machines.Campaign.ACTIVE_to_CLOSED
          - state_machines.ActionRecord.MATCHED_to_ACKNOWLEDGED
        distinguishing_aspect: |
          This instance's two variants live in the Supporter (list-retention) domain, a different
          entity domain from the Activation reach pair: the rolling engagement_score applies the age
          decay factor 0.50 to both 46-day-old actions and yields 4.00, while the campaign-final
          retention_score drops decay entirely and yields 6.00 on the identical two ActionRecord rows.
        test_recipe:
          setup:
            - "One ACTIVE campaign with one HOUSE legislator in HD-14."
            - "One EVENT-sourced supporter in HD-14 with EMAIL and PHONE consent GRANTED."
            - "One PHONE and one EMAIL organic action logged at clock 2026-08-01T00:00:00Z, both MATCHED to the legislator."
            - "Clock advanced to 2026-09-16T00:00:00Z (46 days later) and the PHONE action acknowledged so engagement is recomputed at the stale clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Alba", district_code: "HD-14", chamber: "HOUSE", stance: "UNDECIDED" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { leg_id: $.data.id }
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/supporters"
              payload: { campaign_id: "${camp_id}", full_name: "Eva Storyteller", email: "eva@example.org", phone: "+15551230001", district_code: "HD-14", acquisition_source: "EVENT", initial_consent_channels: ["EMAIL", "PHONE"], lawful_basis: "EVENT_CARD", consent_source_reference: "event-signin-7" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { sup1_id: $.data.id }
            - call: "POST /advocacy/action-records"
              payload: { supporter_id: "${sup1_id}", channel: "PHONE" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { rec_phone_id: $.data.id }
            - call: "POST /advocacy/action-records"
              payload: { supporter_id: "${sup1_id}", channel: "EMAIL" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { rec_email_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/action-records/${rec_phone_id}/acknowledge"
              payload: { acknowledgement_note: "office confirmed receipt" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
          trigger:
            - call: "POST /advocacy/campaigns/${camp_id}/close"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
          assert:
            - "Supporter.${sup1_id}.engagement_score == 4.00"
            - "Supporter.${sup1_id}.retention_score == 6.00"
            - "ActionRecord.${rec_phone_id}.status == ACKNOWLEDGED"
            - "ActionRecord.${rec_email_id}.status == MATCHED"
            - "Campaign.${camp_id}.status == CLOSED"
            - "Campaign.${camp_id}.posture == FROZEN"

  - rule_id: combinatorial_formula
    instances:
      - name: pressure_index_mode_a_nested_caps_clamp_and_stance_branch
        grounds:
          - calculations.district_pressure_index
          - calculations.milestone_multiplier_snapshot
          - entities.Legislator.fields.contact_pressure_score
          - entities.Legislator.fields.priority_tier
          - calculations.campaign_posture
        distinguishing_aspect: |
          Mode (a): five inputs (channel weight, milestone multiplier, action factor, the 60.0 action
          cap and the stance branch) interact non-linearly, so the sixth PHONE action raises
          constituent_action_count from 5 to 6 while contact_pressure_score stays clamped at 64.00
          instead of the un-clamped 76.00 - the nested min is load-bearing, not decorative.
        test_recipe:
          setup:
            - "One ACTIVE campaign with one HOUSE legislator in HD-14 whose stance is LEAN_OPPOSE (stance bonus 4.0)."
            - "One FLOOR_VOTE milestone covering 2026-08-04T00:00:00Z to 2026-08-06T00:00:00Z (pressure_multiplier 2.0)."
            - "Clock parked at 2026-08-05T00:00:00Z, inside the FLOOR_VOTE window."
            - "One supporter in HD-14 with PHONE consent GRANTED, who has already logged five PHONE actions (score already clamped at 64.00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Bell", district_code: "HD-14", chamber: "HOUSE", stance: "LEAN_OPPOSE" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { leg_id: $.data.id }
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/milestones"
              payload: { campaign_id: "${camp_id}", kind: "FLOOR_VOTE", label: "House floor vote", window_start: "2026-08-04T00:00:00Z", window_end: "2026-08-06T00:00:00Z" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { ms_floor_id: $.data.id }
            - call: "POST /advocacy/supporters"
              payload: { campaign_id: "${camp_id}", full_name: "Cal Caller", email: "cal@example.org", phone: "+15551230011", district_code: "HD-14", acquisition_source: "PETITION", initial_consent_channels: ["PHONE"], lawful_basis: "VERBAL_RECORDED", consent_source_reference: "phonebank-3" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { sup1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/action-records"
              payload: { supporter_id: "${sup1_id}", channel: "PHONE" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { rec1_id: $.data.id }
            - call: "POST /advocacy/action-records"
              payload: { supporter_id: "${sup1_id}", channel: "PHONE" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { rec2_id: $.data.id }
            - call: "POST /advocacy/action-records"
              payload: { supporter_id: "${sup1_id}", channel: "PHONE" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { rec3_id: $.data.id }
            - call: "POST /advocacy/action-records"
              payload: { supporter_id: "${sup1_id}", channel: "PHONE" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { rec4_id: $.data.id }
            - call: "POST /advocacy/action-records"
              payload: { supporter_id: "${sup1_id}", channel: "PHONE" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { rec5_id: $.data.id }
          trigger:
            - call: "POST /advocacy/action-records"
              payload: { supporter_id: "${sup1_id}", channel: "PHONE" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { rec6_id: $.data.id }
          assert:
            - "ActionRecord.${rec6_id}.status == MATCHED"
            - "ActionRecord.${rec6_id}.legislator_id == ${leg_id}"
            - "ActionRecord.${rec6_id}.pressure_multiplier == 2.0"
            - "Legislator.${leg_id}.constituent_action_count == 6"
            - "Legislator.${leg_id}.contact_pressure_score == 64.00"
            - "Legislator.${leg_id}.priority_tier == PRIMARY"
            - "Campaign.${camp_id}.opposed_priority_legislator_count == 1"
            - "Campaign.${camp_id}.posture == RESTRICTED"

      - name: coalition_share_mode_b_floor_then_single_cent_waterfall
        grounds:
          - calculations.coalition_cost_share
          - entities.CoalitionPartner.fields.committed_cents
          - entities.CoalitionPartner.fields.share_weight
          - entities.Campaign.fields.committed_share_total_cents
        distinguishing_aspect: |
          Mode (b): the rounding order is pinned to floor-each-line-then-waterfall-the-remainder, so
          100000 cents across ANCHOR/CORE/ALLY resolves to 55556 / 33333 / 11111 summing to exactly
          100000 - the rejected round-half-up-per-line order would produce 55556 + 33333 + 11111 with
          a different remainder owner and the round-then-sum order would total 100001.
        test_recipe:
          setup:
            - "One ACTIVE campaign whose funded_total_cents is 100000."
            - "An ANCHOR partner (share_weight 5) and a CORE partner (share_weight 3) already joined, in that order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Alba", district_code: "HD-14", chamber: "HOUSE", stance: "UNDECIDED" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { leg_id: $.data.id }
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/coalition-partners"
              payload: { campaign_id: "${camp_id}", org_name: "Anchor Housing Alliance", tier: "ANCHOR", branding_asset_ref: "brand/anchor.svg" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { part_a_id: $.data.id }
            - call: "POST /advocacy/coalition-partners"
              payload: { campaign_id: "${camp_id}", org_name: "Core Tenants Union", tier: "CORE", branding_asset_ref: "brand/core.svg" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { part_c_id: $.data.id }
          trigger:
            - call: "POST /advocacy/coalition-partners"
              payload: { campaign_id: "${camp_id}", org_name: "Ally Faith Network", tier: "ALLY", branding_asset_ref: "brand/ally.svg" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { part_y_id: $.data.id }
          assert:
            - "CoalitionPartner.${part_a_id}.share_weight == 5"
            - "CoalitionPartner.${part_c_id}.share_weight == 3"
            - "CoalitionPartner.${part_y_id}.share_weight == 1"
            - "CoalitionPartner.${part_a_id}.committed_cents == 55556"
            - "CoalitionPartner.${part_c_id}.committed_cents == 33333"
            - "CoalitionPartner.${part_y_id}.committed_cents == 11111"
            - "Campaign.${camp_id}.committed_share_total_cents == 100000"
            - "Campaign.${camp_id}.funded_total_cents == 100000"

  - rule_id: non_linear_state_machine
    instances:
      - name: message_variant_revision_cycle_terminates_at_third_round
        grounds:
          - state_machines.MessageVariant.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.MessageVariant.CHANGES_REQUESTED_to_IN_REVIEW
          - entities.MessageVariant.fields.revision_round
          - validations[priority=21]
          - errors[ERR_REVISION_LIMIT_REACHED]
        distinguishing_aspect: |
          MessageVariant is the cyclic machine: IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW is a true
          loop whose termination condition is the revision_round ceiling, so the third submit is
          refused with ERR_REVISION_LIMIT_REACHED while the row stays in CHANGES_REQUESTED - a state a
          linear pipeline could never re-enter.
        test_recipe:
          setup:
            - "One ACTIVE campaign."
            - "One message variant that has already been submitted and sent back for changes twice, leaving revision_round at 3 and status CHANGES_REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Alba", district_code: "HD-14", chamber: "HOUSE", stance: "UNDECIDED" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { leg_id: $.data.id }
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/message-variants"
              payload: { campaign_id: "${camp_id}", test_cell: "ECONOMIC_FRAME", headline: "Vote yes on HB-1420", body: "Ask your representative to vote yes on HB-1420.", channel_scope: ["EMAIL"] }
              as: MessageStrategist
              as_user_id: "u_strat_1"
              captures: { var_id: $.data.id }
            - call: "POST /advocacy/message-variants/${var_id}/submit"
