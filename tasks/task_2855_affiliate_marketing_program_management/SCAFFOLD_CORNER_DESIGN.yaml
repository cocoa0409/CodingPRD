          - state_machines.PayoutBatch.DRAFT_to_VOIDED
          - state_machines.PayoutLine.INCLUDED_to_VOIDED
          - entities.CommissionLedgerEntry.fields.payout_batch_id
          - calculations.payout_line_settlement
        distinguishing_aspect: "Voiding a DRAFT batch moves no money at all: the ACCRUAL entry is un-stamped back to payout_batch_id null and Affiliate.accrued_balance_cents stays 4000 while reserved_balance_cents stays 0, because a DRAFT batch never reserved anything."
