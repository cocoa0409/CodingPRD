            - *c_install1
            - *c_tb1
            - *c_sched1
            - *c_clock_sep12
            - *c_collect1
            - *c_sort1
          trigger:
            - call: "GET /carpetloop/feedstock-lots"
              payload: { origin_takeback_id: "${tb1}" }
              as: PlatformAdmin
              captures: { lot_q: "$.data[0].quantity_kg", lot_src: "$.data[0].source_type", lot_st: "$.data[0].status", lot_sup: "$.data[0].supplier_name" }
          assert:
            - "exactly one lot found; lot_q == 80 and lot_src == POST_CONSUMER_TILE"
            - "lot_sup == \"TAKEBACK-PROGRAM\" and lot_st == RECEIVED (awaits QC like any intake lot)"
            - "carbon_factor_kgco2e_per_kg == 0.40 (TAKEBACK_LOT_CARBON_FACTOR)"

