  - rule_id: compensating_invariant
    instances:
      - name: attributable_ballot_count_conserved_across_remake_complete_then_void
        grounds:
          - calculations.ballot_countability_conservation
          - state_machines.RemakeRecord.OPEN_to_COMPLETED
          - state_machines.RemakeRecord.COMPLETED_to_VOIDED
          - entities.Election.fields.attributable_ballot_count
        distinguishing_aspect: |
          Conserved quantity: attributable_ballot_count, a COUNT of ballots still capable of being counted.
          Completing a remake removes the original from the set and admits the replacement; voiding it
          reverses both moves. The count must be identical at all three checkpoints while
          envelopes_received_count deliberately is not conserved (the replacement row is kept forever as an
          audit artifact), which is what makes a naive "just recount everything" implementation fail.
        test_recipe:
          setup:
            - "One election in posture RECEIVING; clock 2026-11-03T12:00:00Z"
            - "Three TRAINED reviewers created in this order: rvS (NPP), rvA (DEM), rvB (REP), so the selector's created_at ASC tie-break assigns the only signature review to rvS and the remake team rvA + rvB is free of segregation-of-duties conflicts"
            - "Two dispatched 28 g packets; env1 is ACCEPTED (round-1 MATCH at similarity 80, confidence 0.8000) and env2 is left UNVERIFIED; both are custody SEALED, so attributable_ballot_count == 2"
            - "One OPEN RemakeRecord rk1 on env1 with team rvA + rvB and session [2026-11-05T13:00:00Z, 2026-11-05T14:00:00Z]"
