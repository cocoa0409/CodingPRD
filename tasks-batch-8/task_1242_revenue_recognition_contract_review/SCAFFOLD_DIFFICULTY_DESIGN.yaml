          assert:
            - "before: POB A allocated == 375000, POB B allocated == 625000, sum == 1000000 == transaction_price_cents"
            - "after +250000: POB A allocated == 468750, POB B allocated == 781250"
            - "invariant: allocated_total_cents == 1250000 == transaction_price_cents (sum conserved across reallocation)"

      - name: invariant_billed_recognized_identity_across_invoice_void
        grounds:
          - calculations.contract_balance_rollforward
          - entities.Contract.fields.deferred_revenue_balance_cents
          - state_machines.Invoice.ISSUED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity (different from allocation sums): the ledger identity
          billed_to_date - recognized_to_date == deferred_revenue_balance -
          contract_asset_balance must hold after every step of issue -> recognize ->
