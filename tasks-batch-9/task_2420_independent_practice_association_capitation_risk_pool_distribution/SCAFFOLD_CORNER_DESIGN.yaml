              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_e3}/risk-pools"
              payload: { pool_type: "PROFESSIONAL", pool_year_start: "2026-01-01T00:00:00Z", pool_year_end: "2026-12-31T23:59:59Z" }
              as: IpaAdmin
              captures: { pool_e3: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_e3}/physicians"
              payload: { npi: "5600000001", full_name: "Dr Recovery Link", specialty: "FAMILY_MEDICINE" }
              as: NetworkManager
