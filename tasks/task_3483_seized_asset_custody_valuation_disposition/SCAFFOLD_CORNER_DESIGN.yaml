              payload: { outcome: "ACCEPT" }
              as: CourtOfficial
              as_user_id: "co-reyes"
          trigger:
            - call: "POST /custody/valuations"
              payload: { asset_id: "${ra35}", method: "MARKET_COMPARABLE", raw_value_cents: 520000, assessed_condition_grade: "GOOD", expected_asset_version: "${ra35_v1}" }
              as: Appraiser
              captures: { stale_err: $.data.error_id }
            - call: "GET /custody/assets/${ra35}"
              payload: {}
              as: Appraiser
              captures: { ra35_v_now: $.data.version }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${ra35}", method: "MARKET_COMPARABLE", raw_value_cents: 520000, assessed_condition_grade: "GOOD", expected_asset_version: "${ra35_v_now}" }
              as: Appraiser
              captures: { rv35b: $.data.id }
          assert:
            - "stale_err == ERR_STALE_VERSION (HTTP 412) — the carried version 1 no longer matches"
