          Pair (existence priority 3 vs business_referential priority 8): activating a NON-EXISTENT
          account id fails ERR_NOT_FOUND (404, existence) rather than ERR_CARTS_INCOMPLETE
          (409, referential) — existence is resolved before the cart-completeness business check.
        test_recipe:
          setup:
            - "Empty DB (no accounts)."
          setup_api_calls: []
