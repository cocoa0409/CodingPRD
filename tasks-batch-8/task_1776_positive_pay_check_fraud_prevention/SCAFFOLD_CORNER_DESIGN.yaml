            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-SKIP", rows: [ { check_number: "1", amount_cents: 9000, payee_name: "K CO", issue_date: "2026-08-01" } ] }, as: CustomerAdmin, as_user_id: "${adm}" }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 9000, payee_name_raw: "K CO", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { it: $.data.id } }
            - { call: "POST /treasury/liability-cases", payload: { presented_item_id: "${it}", claim_reason: "COUNTERFEIT" }, as: CustomerDecisionMaker, as_user_id: "${dm}", captures: { cs: $.data.id } }
