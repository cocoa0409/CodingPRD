            - "ClearanceSchedule.${cs_id}.remaining_units == 5, snapshotted from Item.${item_id}.on_hand_units at activation"

      - name: retail_sales_per_guest_excludes_disputed_receipts_from_the_numerator
        claim_type: Input Set Filtering
        grounds:
