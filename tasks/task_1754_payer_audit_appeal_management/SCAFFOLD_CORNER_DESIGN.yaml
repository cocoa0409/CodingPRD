            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-2", patient_account_number: "PA-2", service_start_date: "2026-01-04T00:00:00Z", service_end_date: "2026-01-06T00:00:00Z", billed_amount_cents: 50000 }, as: HIMCoordinator, captures: { l2: $.data.id } }
