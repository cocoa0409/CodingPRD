            - "CampInvitation.${inv_i}.report_current_date == 2026-01-20T00:00:00Z (base minus 21 position-player lead days)"
            - "CampInvitation.${inv_g}.report_current_date == 2026-01-20T00:00:00Z (minus 14 lead days and the extra 7 guest-instructor days)"
            - "CampInvitation.${inv_c}.report_final_date == 2026-02-10T00:00:00Z (14 final-grace days after the catcher's current date)"
            - "CampInvitation.${inv_i}.report_final_date == 2026-02-03T00:00:00Z"
            - "CampInvitation.${inv_g}.arrival_band == MISSED_WINDOW before arrival because actual_report_date is null"

