            - call: "POST /radio-system/units/${unit_npt2}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_npt_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_npt_id}"
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_npt_id}", talkgroup_id: "${tg_npt_id}", unit_id: "${unit_npt1}", request_kind: "EMERGENCY" }
              as: Dispatcher
              as_user_id: "${agency_npt_id}"
              captures: { tp_npt1: "$.data.id" }
          trigger:
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_npt_id}", talkgroup_id: "${tg_npt_id}", unit_id: "${unit_npt2}", request_kind: "EMERGENCY" }
              as: Dispatcher
