            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/approve", as: OperationsDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-21T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/commission", as: OperationsDirector }
            - { call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}", as: PlatformAdmin, captures: { rh_id: "$.data[0].id" } }
            - { call: "GET /barrel-aging/rickhouses/${rh_id}/slots", as: PlatformAdmin, captures: { slot_a: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2029-01-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /barrel-aging/barrels/${b_id}/assessments"
              payload: { kind: "EVAPORATION_READING", measured_volume_liters: 250.0 }
              as: WarehouseManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_ASSESSMENT_VOLUME_INCONSISTENT"
            - "Barrel.${b_id}.current_volume_ledger_liters == 200.00 (unchanged)"

      - name: clock_cannot_move_backwards
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CLOCK_REGRESSION]"
        distinguishing_aspect: "The logical clock is monotonic non-decreasing; setting it to an earlier instant than the current one is rejected, and the clock keeps its prior value."
        test_recipe:
          setup: ["Clock at the startup default 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_CLOCK_REGRESSION"
            - "a subsequent clock read/set confirms the clock still stands at 2026-09-01T00:00:00Z"

  - section: rbac
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID is rejected 401 ERR_UNAUTHENTICATED on any endpoint (the generated test sends no auth headers at all)."
        test_recipe:
          setup: ["Empty database; default clock."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "GET /barrel-aging/barrels"
              as: WarehouseManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHENTICATED (headers stripped by the test harness for this call)"

      - name: warehouse_manager_cannot_create_label
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_ROLE]"
          - "roles[MasterBlender]"
        distinguishing_aspect: "Label creation is exclusive to MasterBlender; WarehouseManager with a perfectly valid payload is rejected 403 ERR_FORBIDDEN_ROLE (role check precedes payload validation)."
        test_recipe:
          setup: ["Default clock."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /barrel-aging/labels"
              payload: { name: "Forbidden Label", age_statement_years: 4, spirit_type: "BOURBON" }
              as: WarehouseManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_FORBIDDEN_ROLE"
            - "no label is persisted"

      - name: cross_role_exclusive_ops_forbidden
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "roles[ProgramDirector]"
          - "roles[BondedPreparer]"
          - "roles[WarehouseManager]"
        distinguishing_aspect: "Peer-role exclusivity holds in every direction: ProgramDirector cannot open bonded reports, BondedPreparer cannot open selection programs, MasterBlender cannot fill barrels."
        test_recipe:
          setup: ["Default clock; no other entities needed (role check fires before existence)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /barrel-aging/bonded-reports"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: ProgramDirector
              captures: { err_1: $.data.error_id }
            - call: "POST /barrel-aging/private-selection-programs"
              payload: { name: "Wrong Role", spirit_type: "BOURBON", min_quality_score: 0, required_barrel_count: 1, reservation_window_days: 45 }
              as: BondedPreparer
              captures: { err_2: $.data.error_id }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: MasterBlender
              captures: { err_3: $.data.error_id }
          assert:
            - "err_1 == ERR_FORBIDDEN_ROLE and err_2 == ERR_FORBIDDEN_ROLE and err_3 == ERR_FORBIDDEN_ROLE"

      - name: filer_cannot_accept_own_report
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "state_machines.BondedPeriodReport.FILED_to_ACCEPTED"
          - "roles[ComplianceOfficer]"
        distinguishing_aspect: "Segregation of duties: a ComplianceOfficer whose X-User-ID equals the report's filed_by_user_id is rejected 403; a different officer accepts successfully."
        test_recipe:
          setup: ["Report [2026-01-01, 2026-07-01) created, reconciled and filed by X-User-ID 'prep-1' at the default clock."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/bonded-reports"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: BondedPreparer
              as_user_id: "prep-1"
              captures: { rep_id: $.data.id }
            - { call: "POST /barrel-aging/bonded-reports/${rep_id}/reconcile", as: BondedPreparer, as_user_id: "prep-1" }
            - { call: "POST /barrel-aging/bonded-reports/${rep_id}/file", as: BondedPreparer, as_user_id: "prep-1" }
          trigger:
            - call: "POST /barrel-aging/bonded-reports/${rep_id}/accept"
              as: ComplianceOfficer
              as_user_id: "prep-1"
              captures: { err_id: $.data.error_id }
            - { call: "POST /barrel-aging/bonded-reports/${rep_id}/accept", as: ComplianceOfficer, as_user_id: "officer-9" }
          assert:
            - "first accept: err_id == ERR_SEGREGATION_OF_DUTIES (same X-User-ID as the filer)"
            - "second accept succeeds: state == ACCEPTED and decided_by_user_id == 'officer-9'"

  - section: cross_cutting_complexity_layers
