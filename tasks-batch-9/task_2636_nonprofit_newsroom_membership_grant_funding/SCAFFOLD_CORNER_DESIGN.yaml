  - section: RBAC
    instances:

      - name: rbac_development_officer_cannot_release_restricted_funds
        claim_type: Exclusive operation denied to other roles
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: >-
          The role gate at priority 2 outranks the existence check at priority 3, so a
          DevelopmentOfficer calling the release endpoint on an id that matches no row is told
          ERR_UNAUTHORIZED rather than ERR_GRANT_PROPOSAL_NOT_FOUND - the caller learns nothing
          about which proposals exist.
        test_recipe:
          setup: "Empty database; the proposal id used below matches no row."
          setup_api_calls: []
          trigger:
            - call: "POST /grant-proposals/00000000-0000-4000-8000-000000000000/release-restricted-funds"
              payload: { request_amount_cents: 100000 }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err_id: "$.data.error_id" }
            - call: "POST /grant-proposals/00000000-0000-4000-8000-000000000000/release-restricted-funds"
              payload: { request_amount_cents: 100000 }
              as: FinanceController
              as_user_id: user-fc-1
              captures: { err_id2: "$.data.error_id" }
          assert:
            - "trigger[0]: 403 with data.error_id == ERR_UNAUTHORIZED"
            - "trigger[1]: 404 with data.error_id == ERR_GRANT_PROPOSAL_NOT_FOUND"

      - name: rbac_board_oversight_cannot_open_a_fiscal_period
        claim_type: Exclusive operation denied to other roles
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: >-
          Opening a period is exclusive to FinanceController, so BoardOversight - which may
          override the reserve policy on that same period - is refused at creation.
        test_recipe:
          setup: "Empty database."
          setup_api_calls: []
          trigger:
