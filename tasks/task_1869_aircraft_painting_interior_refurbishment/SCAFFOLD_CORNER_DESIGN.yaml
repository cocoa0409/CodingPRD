            - { call: "POST /completion/paint-schemes", payload: { program_id: "${prog_id}", drawing_ref: "DWG-1869-B", painted_area_sqft: 2400, coat_count: 2, stripe_pct: 0.10 }, as: DesignLead, captures: { sch_b: $.data.id } }
