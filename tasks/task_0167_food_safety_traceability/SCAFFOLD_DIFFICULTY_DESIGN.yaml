              as: ReceivingClerk
              captures: { l1: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L2", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { l2: $.data.id }
            - call: "POST /traceability/zones/${zone}/bookings"
              payload: { lot_id: "${l1}", start_utc: "2026-01-01T00:00:00Z", end_utc: "2026-01-01T06:00:00Z", capacity_units: 70 }
              as: QualityManager
          trigger:
            - call: "POST /traceability/zones/${zone}/bookings"
              payload: { lot_id: "${l2}", start_utc: "2026-01-01T03:00:00Z", end_utc: "2026-01-01T09:00:00Z", capacity_units: 40 }
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_ZONE_CAPACITY_EXCEEDED\" (peak 70+40=110 > 100 during overlap [03:00,06:00))"

      - name: ccp_reading_timeline_strict_point_ordering
        grounds:
          - validations[priority=14]
          - entities.CCPReading.fields.measured_at
          - errors[ERR_READING_OUT_OF_ORDER]
        distinguishing_aspect: |
          Resource Lot's reading timeline (a different resource entity), interval
          semantics = strict point ordering: each reading occupies the instant
          measured_at; a new reading whose measured_at is <= the latest reading's
          measured_at collides with the timeline and is rejected. Distinct from
          the half-open aggregate-capacity windows of the zone instance.
        test_recipe:
          setup:
            - "Facility clock 2026-01-02T05:00. Released lot with one reading at 2026-01-02T02:00."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-16", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/facilities/${fid}/clock"
              payload: { to_utc: "2026-01-02T05:00:00Z" }
              as: QualityManager
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Shrimp", storage_target_c: 0, storage_tolerance_c: 2, shelf_life_days: 30, declared_allergen_codes: ["SHELLFISH"] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "SH", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
            - call: "POST /traceability/ccp-readings"
              payload: { lot_id: "${lot}", ccp_type: "TEMPERATURE", measured_value_c: 0, measured_at: "2026-01-02T02:00:00Z" }
              as: ProductionOperator
          trigger:
            - call: "POST /traceability/ccp-readings"
              payload: { lot_id: "${lot}", ccp_type: "TEMPERATURE", measured_value_c: 0, measured_at: "2026-01-02T01:00:00Z" }
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_READING_OUT_OF_ORDER\" (01:00 <= latest 02:00 collides with the timeline)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dispose_conserves_lot_quantity_ledger
        grounds:
          - state_machines.HoldOrder.ACTIVE_to_DISPOSED
          - state_machines.Lot.RELEASED_to_DESTROYED
          - calculations.available_quantity
          - entities.Lot.fields.available_qty
        distinguishing_aspect: |
          Conserved quantity = total live source-lot inventory units. Forward
          action (receive R with received_qty 100, available 100) paired with its
          compensating action (DISPOSE hold zeroes available_qty) leaves the
          invariant total_destroyed + total_available == received_qty pinned:
          before dispose available 100 destroyed 0; after dispose available 0
          destroyed 100; sum 100 unchanged.
        test_recipe:
          setup:
            - "Facility clock 2026-01-01. Released raw lot R received 100, available 100, no consumption. Then a hold on R is DISPOSED."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-17", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Rice", storage_target_c: 20, storage_tolerance_c: 5, shelf_life_days: 365, declared_allergen_codes: [] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "R", lot_kind: "RAW_MATERIAL", received_qty: 100, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lotR: $.data.id, avail_before: $.data.available_qty }
            - call: "POST /traceability/lots/${lotR}/release"
              payload: {}
              as: QualityManager
            - call: "POST /traceability/hold-orders"
              payload: { facility_id: "${fid}", target_lot_id: "${lotR}", reason: "RECALL" }
              as: QualityManager
              captures: { hold: $.data.id, hold_v: $.data.version }
          trigger:
            - call: "POST /traceability/hold-orders/${hold}/resolve"
              payload: { disposition: "DISPOSE", expected_hold_order_version: "${hold_v}" }
              as: QualityManager
            - call: "GET /traceability/lots/${lotR}"
              payload: {}
              as: QualityManager
              captures: { avail_after: $.data.available_qty, status_after: $.data.status }
          assert:
            - "avail_before == 100.0 (received, destroyed 0; invariant 0+100=100)"
            - "avail_after == 0.0 and status_after == \"DESTROYED\" (destroyed 100; invariant 100+0=100 unchanged)"

      - name: release_then_release_conserves_held_count_freeze_set
        grounds:
          - state_machines.HoldOrder.ACTIVE_to_RELEASED
          - calculations.hold_propagation
          - entities.Lot.fields.hold_status
          - entities.HoldOrder.fields.held_lot_count
        distinguishing_aspect: |
          Conserved quantity (a different type: count of frozen lots, not units)
          = number of HELD lots. Forward action (issue hold freezes 1 lot,
          held_lot_count 1, lot HELD) paired with its compensating action
          (RELEASE) restores the frozen-lot count to 0: lot returns to FREE,
          leaving net-frozen-lots == 0 as before the hold.
        test_recipe:
          setup:
            - "Facility clock 2026-01-01. Released raw lot L, FREE. Issue a single hold (held_lot_count 1, L HELD), then RELEASE it."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-18", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Corn", storage_target_c: 20, storage_tolerance_c: 5, shelf_life_days: 365, declared_allergen_codes: [] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L", lot_kind: "RAW_MATERIAL", received_qty: 20, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
            - call: "POST /traceability/lots/${lot}/release"
              payload: {}
              as: QualityManager
            - call: "POST /traceability/hold-orders"
              payload: { facility_id: "${fid}", target_lot_id: "${lot}", reason: "OTHER" }
              as: QualityManager
              captures: { hold: $.data.id, hold_v: $.data.version, held_count: $.data.held_lot_count }
            - call: "GET /traceability/lots/${lot}"
              payload: {}
              as: QualityManager
              captures: { hs_during: $.data.hold_status }
          trigger:
            - call: "POST /traceability/hold-orders/${hold}/resolve"
              payload: { disposition: "RELEASE", expected_hold_order_version: "${hold_v}" }
              as: QualityManager
            - call: "GET /traceability/lots/${lot}"
              payload: {}
              as: QualityManager
              captures: { hs_after: $.data.hold_status, status_after: $.data.status }
          assert:
            - "held_count == 1 and hs_during == \"HELD\" (forward: 1 frozen lot)"
            - "hs_after == \"FREE\" and status_after == \"RELEASED\" (compensating RELEASE restores 0 frozen lots; lot survives)"
