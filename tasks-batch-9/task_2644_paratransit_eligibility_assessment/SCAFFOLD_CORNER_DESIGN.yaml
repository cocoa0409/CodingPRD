          - entities.VisitorEligibility.fields.days_remaining_365
        distinguishing_aspect: "Priority 53 is a conjunction, so it must reject BOTH single-clause failures with the same error id: an OUT_OF_SERVICE_AREA rider without home-agency certification and an IN_SERVICE_AREA rider with certification are both 422 ERR_NOT_OUT_OF_AREA, and only the rider satisfying both clauses gets a record (days_remaining_365 == 21, days_used_365 == 0)."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; rider A OUT_OF_SERVICE_AREA, rider B IN_SERVICE_AREA"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
