            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id, sub_v: $.data.version } }
          trigger:
            - { call: "POST /subscriptions/${subs_a}/plan-change", payload: { new_plan_id: "${plan_res0}", expected_subscription_version: "${sub_v}" }, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
