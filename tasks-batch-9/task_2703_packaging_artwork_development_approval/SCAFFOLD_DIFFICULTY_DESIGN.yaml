      - name: trailing_average_half_up_tie_and_exact_division_ceil_on_runout_replay
        grounds:
          - calculations.runout_projection
          - calculations.runout_projection.variants.CHRONOLOGICAL
          - calculations.runout_projection.constants.TRAILING_WINDOW_RECORDS
          - entities.InventoryRunout.fields.trailing_avg_usage_qty
          - entities.InventoryRunout.fields.actual_runout_date
          - entities.InventoryRunout.fields.remaining_qty
          - validations[priority=51]
          - state_machines.InventoryRunout.MONITORING_to_RUNOUT_COMPLETE
        distinguishing_aspect: |
          Three separate numeric edges are pinned in one replay. After record 2 the
          trailing mean is exactly 3334.5: round_half_up yields 3335 while
          banker's rounding yields 3334, and that one-unit difference moves nothing
          yet - but after record 1 remaining/avg is exactly 16670/3334 == 5.0, where
          ceil must NOT add a spare week (6 weeks would give 2026-09-21 instead of
          2026-09-14), and after record 3 the mean 3334.666... must round up, not
          truncate. Record 5 lands remaining on exactly 0, taking the `<= 0` branch
          so actual_runout_date is the record week + 7 days rather than an
          extrapolation, and that exact 0 is also what makes the RUNOUT disposition
          legal under priority 51.
