            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "Pat Fifteen", date_of_birth: "1973-01-19", payer_policy_id: "${pp15}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { pat15: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${pat15}", device_serial: "SN-015", device_model: "Airsense-11", acquisition_type: "PURCHASE" }
              as: IntakeCoordinator
              captures: { de15: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${de15}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${de15}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${pat15}", component_type: "MASK" }
              as: OpsAdmin
              captures: { mask15: "$.data[0].id" }
            - call: "GET /sleep-therapy/patients/${pat15}"
              payload: {}
              as: OpsAdmin
              captures: { pat15_v1: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders"
              payload: { patient_id: "${pat15}", component_supply_plan_id: "${mask15}", requested_quantity: 1, expected_patient_version: "${pat15_v1}" }
              as: IntakeCoordinator
              captures: { ro15a: $.data.id }
            - call: "POST /sleep-therapy/resupply-orders/${ro15a}/clinical-clear"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/resupply-orders/${ro15a}/authorize"
              payload: { expected_patient_version: "${pat15_v1}" }
              as: BillingSpecialist
            - call: "GET /sleep-therapy/patients/${pat15}"
              payload: {}
              as: OpsAdmin
              captures: { pat15_v2: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders/${ro15a}/ship"
              payload: { expected_patient_version: "${pat15_v2}" }
              as: IntakeCoordinator
