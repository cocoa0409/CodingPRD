            - { call: "POST /molds/${mold_id}/start-maintenance", payload: {}, as: ToolingEngineer, captures: { mold_status_mnt: $.data.status } }
            - { call: "POST /molds/${mold_id}/complete-maintenance", payload: {}, as: ToolingEngineer, captures: { mold_status_back: $.data.status, mold_cycles_reset: $.data.cycles_since_maintenance } }
