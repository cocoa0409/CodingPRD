    input: ["status?", "limit?", "offset?"]
    output: FinalPayStatement[]
    side_effects: []
  - method: POST
    path: "/offboarding/final-pay-statements/{id}/calculate"
    description: "Calculate PTO payout, deductions, net pay; OCC-guarded"
    roles: [PayrollSpecialist]
    code: 200
    input: [regular_wages_cents, expected_final_pay_statement_version]
    output: FinalPayStatement
    side_effects:
      - "transition DRAFT -> CALCULATED per state machine"
      - "record calc_by_ref for SoD-2"
      - "increments FinalPayStatement.version by 1"
  - method: POST
    path: "/offboarding/final-pay-statements/{id}/recalculate"
    description: "Recompute a CALCULATED statement (revision loop back through DRAFT)"
    roles: [PayrollSpecialist]
    code: 200
    input: ["regular_wages_cents?"]
    output: FinalPayStatement
    side_effects:
      - "transition CALCULATED -> DRAFT -> CALCULATED per state machine"
      - "increments FinalPayStatement.version by 1"
  - method: POST
    path: "/offboarding/final-pay-statements/{id}/approve"
    description: "Approve a CALCULATED statement; SoD-2; cascades case to CLEARANCE_IN_PROGRESS"
    roles: [PayrollSpecialist]
    code: 200
    input: []
    output: FinalPayStatement
    side_effects:
      - "transition CALCULATED -> APPROVED per state machine"
      - "cascade OffboardingCase PAYROLL_PENDING -> CLEARANCE_IN_PROGRESS"
      - "increments FinalPayStatement.version by 1"
  - method: POST
    path: "/offboarding/final-pay-statements/{id}/disburse"
    description: "Disburse an APPROVED statement; past-due disbursement transitions to LATE"
    roles: [PayrollSpecialist]
    code: 200
    input: []
    output: FinalPayStatement
    side_effects:
      - "transition APPROVED -> DISBURSED or APPROVED -> LATE per state machine"
      - "if LATE: run calc_late_penalty"
      - "increments FinalPayStatement.version by 1"

