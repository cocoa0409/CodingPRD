  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: route_consume_soldout_depth3
        grounds:
          - state_machines.AggregatorOrder.INGESTED_to_ROUTED
          - calculations.fifo_inventory_consumption
          - state_machines.MenuItem.AVAILABLE_to_SOLD_OUT
          - calculations.menu_item_availability
        distinguishing_aspect: |
          Depth-3 cascade: routing the order (A) deducts IngredientLot grams_remaining (B, caused by
          A); the now-insufficient lot causes the dependent MenuItem to flip AVAILABLE->SOLD_OUT (C,
          caused by B) — each hop caused by the previous, not by the route action directly.
