              payload: {}
              as: RecordsManager
              captures: { conf_id: "$.data[0].id", conf_inc: "$.data[0].incumbent_rule_id" }
          assert:
            - "Adjacent rule ${adj} activates to ACTIVE (effective_from == incumbent effective_to is NOT overlap under half-open semantics)"
            - "Overlapping rule ${ovr} lands in PENDING_CONFLICT"
            - "Exactly one OPEN conflict exists, with incumbent_rule_id == ${inc} (earliest created_at among overlapping ACTIVE rules)"

      - name: freeze_window_closed_interval_shared_boundary
        grounds:
          - validations[priority=22]
          - entities.DispositionFreezeWindow.fields.start_at
          - entities.DispositionFreezeWindow.fields.end_at
          - errors[ERR_FREEZE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          CLOSED-interval semantics on DispositionFreezeWindow (different resource
          from rule windows): a new window whose start_at equals an existing ACTIVE
          window's end_at IS an overlap (shared endpoint included in both) and is
          rejected, while a window starting one second later is accepted — the exact
          opposite adjacency treatment from the half-open rule windows.
        test_recipe:
          setup:
            - "Program with one ACTIVE freeze window W1 [2026-09-01T00:00:00Z, 2026-09-10T00:00:00Z]"
          setup_api_calls:
