      SPAN_OF_CONTROL 10 is enforced as an AGGREGATE over the sibling posts that report to the same supervisor, which makes it the only §1.4 rule where a single legal post becomes illegal purely because of its siblings — and it is enforced on the update path as well, so relieving pressure on one subordinate post is what makes room for the new one. The fixture stops exactly at 10 (accepted, the bound is not exceeded) and rejects at 11.
