            - "Match.${m_id}.compliance_status == AMBER"

      - name: meeting_held_branches_affirm_vs_rescind
        grounds:
          - state_machines.MatchMeeting.HELD_to_AFFIRMED
          - state_machines.MatchMeeting.HELD_to_RESCINDED
          - state_machines.Match.INTRODUCED_to_ACTIVE
        distinguishing_aspect: "From the single HELD state the MatchMeeting branches to AFFIRMED (advancing Match INTRODUCED->ACTIVE and opening the first SupervisionContact) versus RESCINDED (Match remains INTRODUCED, no contact opened) — divergent side-effect sets per branch on the MatchMeeting entity."
