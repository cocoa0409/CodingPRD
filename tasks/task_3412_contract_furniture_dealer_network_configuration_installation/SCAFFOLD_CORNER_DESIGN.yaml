# =============================================================================
# SCAFFOLD_CORNER_DESIGN — Task 3412 Contract Furniture Dealer Network
# §1.9 Coverage Index: every testable claim of SCAFFOLD.yaml §1.1–§1.7 that
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) does not already cover.
# Sections follow references/claim-extraction-guide.md.
# All literals recomputed from the scaffold's pinned constants.
# =============================================================================
scaffold_corner_design:
  # ============================================================ entities ====
  - section: entities
    instances:
      - name: entity_dealer_creation_applies_defaults
        claim_type: defaults
        grounds:
          - "entities.Dealer.fields.showroom_compliant"
          - "entities.Dealer.fields.status"
        distinguishing_aspect: "Omitting showroom_compliant yields true, status ACTIVE, version 1, server-minted UUID id."
        test_recipe:
          setup: ["empty database at default clock 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 3 }, as: ManufacturerAdmin, captures: { d_st: "$.data.status", d_sc: "$.data.showroom_compliant", d_v: "$.data.version" } }
          assert:
            - "response 201; showroom_compliant == true (default); status == ACTIVE; version == 1; id is a server-minted UUID"

      - name: entity_dealer_missing_name_returns_400
        claim_type: required_fields
        grounds:
          - "entities.Dealer.fields.name"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "name is required input with no default; omitting it returns ERR_VALIDATION 400."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dealers", payload: { territory_codes: ["MI"], service_capability_level: 3 }, as: ManufacturerAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: entity_enduser_missing_industry_returns_400
        claim_type: required_fields
        grounds:
          - "entities.EndUser.fields.industry"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "industry is required; omitting it returns ERR_VALIDATION 400."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /end-users", payload: { name: "MegaCorp" }, as: ManufacturerAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: entity_configuration_rejects_unknown_module_type
        claim_type: type_constraints
        grounds:
          - "entities.ConfigurationSpec.fields.modules"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "module_type outside the 5-member enum is a 400 at creation (shape validation)."
        test_recipe:
          setup: ["dealer exists"]
          setup_api_calls:
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 3 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
          trigger:
            - { call: "POST /configurations", payload: { name: "Bogus", modules: [{ module_type: "BOGUS_MODULE", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION and http status 400; no configuration is persisted"

      - name: entity_configuration_qty_zero_rejected
        claim_type: type_constraints
        grounds:
          - "entities.ConfigurationSpec.fields.modules"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "qty must be >= 1; qty 0 is a 400 boundary rejection (zero-quantity edge)."
        test_recipe:
          setup: ["dealer exists"]
          setup_api_calls:
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 3 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
          trigger:
            - { call: "POST /configurations", payload: { name: "Zero qty", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 0 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: entity_lock_computes_totals_and_lead_time
        claim_type: computed_fields
        grounds:
          - "entities.ConfigurationSpec.fields.total_units"
          - "entities.ConfigurationSpec.fields.list_total_cents"
          - "entities.ConfigurationSpec.fields.max_lead_time_days"
          - "calculations.bom_expansion"
          - "calculations.configuration_lead_time"
        distinguishing_aspect: "computed fields are derived, not stored input: locking 2 x WORKSTATION_6X6 A + 1 x STORAGE_WALL yields total_units 3, list_total_cents 237974 (2x85837 + 66300), max_lead_time_days max(42+0, 21+0) + queue(3 units)=3 -> 45."
        test_recipe:
          setup: ["SYSTEMS family base 42 and STORAGE family base 21 exist; dealer exists"]
          setup_api_calls:
            - { call: "POST /product-families", payload: { family_code: "SYS-7500", name: "Systems 7500", category: "SYSTEMS", base_lead_time_days: 42 }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "STOR-1100", name: "Storage 1100", category: "STORAGE", base_lead_time_days: 21 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /configurations", payload: { name: "Mixed", modules: [{ module_type: "WORKSTATION_6X6", fabric_grade: "A", qty: 2 }, { module_type: "STORAGE_WALL", fabric_grade: null, qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id", cfg_v: "$.data.version" } }
          trigger:
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { tu: "$.data.total_units", lt: "$.data.list_total_cents", mlt: "$.data.max_lead_time_days" } }
          assert:
            - "total_units == 3"
            - "list_total_cents == 237974"
            - "max_lead_time_days == 45 (max(42, 21) + 3 queue days for total_units <= 49)"

      - name: entity_system_fields_client_input_ignored
        claim_type: system_fields
        grounds:
          - "validations[priority=5]"
          - "entities.EndUser"
        distinguishing_aspect: "client-supplied id/version/created_at are ignored per the pinned unknown-field rule; the server mints its own."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology", id: "11111111-1111-1111-1111-111111111111", version: 99 }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id", eu_v: "$.data.version" } }
          assert:
            - "response 201; version == 1 (not 99); id != 11111111-1111-1111-1111-111111111111 (server-minted)"

      - name: entity_get_nonexistent_configuration_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_CONFIGURATION_NOT_FOUND]"
          - "endpoints.\"GET /configurations/{configurationId}\""
        distinguishing_aspect: "GET on a well-formed but unknown configuration id returns 404 with the resource-specific error."
        test_recipe:
          setup: ["dealer exists (to authenticate a scoped read)"]
          setup_api_calls:
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 3 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
          trigger:
            - { call: "GET /configurations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DealerRep, as_user_id: "${dlr_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CONFIGURATION_NOT_FOUND and http status 404"

      - name: entity_fk_reverse_list_configurations_by_dealer
        claim_type: parent_relationships
        grounds:
          - "entities.ConfigurationSpec.fields.dealer_id"
          - "endpoints.\"GET /configurations\""
        distinguishing_aspect: "the child collection is reachable from the parent key via the filtered list; a dealer with no configurations yields an empty array, not an error."
        test_recipe:
          setup: ["dealers A and B exist; one configuration owned by A"]
          setup_api_calls:
            - { call: "POST /dealers", payload: { name: "Dealer A", territory_codes: ["MI"], service_capability_level: 3 }, as: ManufacturerAdmin, captures: { dlrA: "$.data.id" } }
            - { call: "POST /dealers", payload: { name: "Dealer B", territory_codes: ["OH"], service_capability_level: 3 }, as: ManufacturerAdmin, captures: { dlrB: "$.data.id" } }
            - { call: "POST /configurations", payload: { name: "A spec", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlrA}" }
          trigger:
            - { call: "GET /configurations", payload: { dealer_id: "${dlrA}" }, as: ManufacturerAdmin, captures: { listA: "$.data[0].dealer_id" } }
            - { call: "GET /configurations", payload: { dealer_id: "${dlrB}" }, as: ManufacturerAdmin }
          assert:
            - "dealer A's list has exactly 1 item with dealer_id == ${dlrA}"
            - "dealer B's list has exactly 0 items (empty array, 200)"

  # ====================================================== state_machines ====
  - section: state_machines
    instances:
      - name: sm_initial_states_on_create
        claim_type: initial_state
        grounds:
          - "state_machines.Dealer"
          - "state_machines.VolumeAgreement"
          - "state_machines.ProductFamily"
          - "state_machines.ConfigurationSpec"
          - "state_machines.ProjectOrder"
        distinguishing_aspect: "every create lands in the declared initial state: Dealer ACTIVE, VolumeAgreement DRAFT with current_tier 1, ProductFamily CURRENT, ConfigurationSpec DRAFT revision 1, ProjectOrder DRAFT."
        test_recipe:
          setup: ["minimal bootstrap"]
          setup_api_calls:
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin, captures: { fam_st: "$.data.lifecycle_status" } }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id", dlr_st: "$.data.status" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id", agr_st: "$.data.status", agr_tier: "$.data.current_tier" } }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id", cfg_st: "$.data.status", cfg_rev: "$.data.revision_number" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
          trigger:
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_st: "$.data.status" } }
          assert:
            - "fam_st == CURRENT, dlr_st == ACTIVE, agr_st == DRAFT with current_tier == 1, cfg_st == DRAFT with revision_number == 1, ord_st == DRAFT"

      - name: sm_revise_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ConfigurationSpec"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "revise requires LOCKED; from DRAFT it is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["dealer; configuration created (DRAFT, version 1)"]
          setup_api_calls:
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id", cfg_v: "$.data.version" } }
          trigger:
            - { call: "POST /configurations/${cfg_id}/revise", as: DealerRep, as_user_id: "${dlr_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE and revision_number stays 1"

      - name: sm_cancelled_order_terminal_rejects_submit
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.ProjectOrder"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "CANCELLED is terminal: a subsequent submit with the current version is rejected ERR_INVALID_STATE and no pricing fields are computed."
        test_recipe:
          setup: ["order created then cancelled from DRAFT"]
          setup_api_calls:
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" } }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /project-orders/${ord_id}/cancel", payload: { reason: "no budget" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_v: "$.data.version", ord_st: "$.data.status" } }
          trigger:
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "ord_st == CANCELLED after cancel"
            - "submit error_id == ERR_INVALID_STATE and status stays CANCELLED"

      - name: sm_verified_punch_terminal_rejects_reverify
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.PunchTicket"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "VERIFIED is terminal: a second verify is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["full chain to IN_PROGRESS phase at clock 2026-11-02; MINOR punch resolved then verified"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 4 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_install_date: "2026-12-15", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${ord_id}/acknowledge", as: ManufacturerAdmin }
            - { call: "POST /project-orders/${ord_id}/phases", payload: { floor_number: 1, phase_sequence: 1, building_zone_id: "Z1", planned_units: 10 }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ph_id: "$.data.id" } }
            - { call: "POST /phases/${ph_id}/reserve-slot", payload: { plant_code: "PLANT_GR", production_date: "2026-11-02" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /phases/${ph_id}/start-install", as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /punch-tickets", payload: { installation_phase_id: "${ph_id}", severity: "MINOR", description: "Scuff" }, as: EndUserRep, as_user_id: "${eu_id}", captures: { pt_id: "$.data.id" } }
            - { call: "POST /punch-tickets/${pt_id}/resolve", payload: { resolution_note: "Polished out" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /punch-tickets/${pt_id}/verify", payload: { outcome: "CONFIRMED" }, as: EndUserRep, as_user_id: "${eu_id}", captures: { pt_st: "$.data.status" } }
          trigger:
            - { call: "POST /punch-tickets/${pt_id}/verify", payload: { outcome: "CONFIRMED" }, as: EndUserRep, as_user_id: "${eu_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "first verify lands VERIFIED"
            - "second verify error_id == ERR_INVALID_STATE"

      - name: sm_approved_claim_terminal_rejects_rereview
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.WarrantyClaim"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "APPROVED is terminal: a second review of an APPROVED claim is rejected ERR_INVALID_STATE (and DENIED is terminal too — no transitions exist out of either)."
        test_recipe:
          setup: ["phase COMPLETE at 2026-11-02; PARTS claim filed and APPROVED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 4 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${ord_id}/acknowledge", as: ManufacturerAdmin }
            - { call: "POST /project-orders/${ord_id}/phases", payload: { floor_number: 1, phase_sequence: 1, building_zone_id: "Z1", planned_units: 10 }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ph_id: "$.data.id" } }
            - { call: "POST /phases/${ph_id}/reserve-slot", payload: { plant_code: "PLANT_GR", production_date: "2026-11-02" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /phases/${ph_id}/start-install", as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /phases/${ph_id}/complete", as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /warranty-claims", payload: { project_order_id: "${ord_id}", installation_phase_id: "${ph_id}", claim_type: "PARTS", part_number: "PN-CHR-TASK", description: "Caster failed" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cl_id: "$.data.id" } }
            - { call: "POST /warranty-claims/${cl_id}/review", payload: { decision: "APPROVE", review_note: "covered" }, as: ManufacturerAdmin, captures: { cl_st: "$.data.status" } }
          trigger:
            - { call: "POST /warranty-claims/${cl_id}/review", payload: { decision: "DENY", review_note: "reconsider" }, as: ManufacturerAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "first review lands APPROVED"
            - "second review error_id == ERR_INVALID_STATE (APPROVED is terminal)"

      - name: sm_family_lifecycle_reverse_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ProductFamily"
          - "errors[ERR_INVALID_LIFECYCLE_TRANSITION]"
        distinguishing_aspect: "lifecycle is forward-only: SUNSETTING->CURRENT and the CURRENT->DISCONTINUED skip are both rejected ERR_INVALID_LIFECYCLE_TRANSITION."
