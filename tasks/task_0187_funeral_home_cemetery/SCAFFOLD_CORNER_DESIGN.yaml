# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 surface; sections + claim_types
# come from references/claim-extraction-guide.md. excluded_because: stubs point
# at the §1.8 instance (by name) that already covers the corner.
# All formula-derived asserts precomputed as literals.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_funeral_home_returns_201_with_computed_trust_balance_zero
        claim_type: Creation
        grounds: [entities.FuneralHome]
        distinguishing_aspect: "POST /funeral-homes with all required fields -> 201, server-minted id, version=1, trust_balance_cents=0, chapel_buffer_minutes default 30."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
          assert:
            - "response code == 201"
            - "FuneralHome.${home_id}.trust_balance_cents == 0"
            - "FuneralHome.${home_id}.version == 1"
            - "FuneralHome.${home_id}.chapel_buffer_minutes == 30 (default applied)"

      - name: create_case_at_need_missing_date_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Case.fields.date_of_death, "validations[priority=4]"]
        distinguishing_aspect: "AT_NEED case without date_of_death -> ERR_INVALID_REQUEST (422); conditional required field."
        test_recipe:
          setup: ["a FuneralHome exists"]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response code == 422"

      - name: create_case_preneed_supplying_date_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Case.fields.date_of_death, "validations[priority=4]"]
        distinguishing_aspect: "PRENEED case must NOT supply date_of_death; supplying it -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["a FuneralHome exists"]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "PRENEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_gpl_item_bad_category_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.GplItem.fields.category, "validations[priority=4]"]
        distinguishing_aspect: "category outside {SERVICE, MERCHANDISE} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["a FuneralHome exists"]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
          trigger:
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "X", name: "Bad", category: "FLOWERS", unit_price_cents: 100 }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: get_case_non_existent_id_returns_not_found
        claim_type: Not Found
        grounds: [entities.Case, "validations[priority=3]"]
        distinguishing_aspect: "GET /cases/{id} with an unused UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response code == 404"

      - name: statement_line_snapshots_price_ignoring_later_gpl_change
        claim_type: Computed Fields
        grounds: [entities.StatementLine.fields.unit_price_cents]
        distinguishing_aspect: "StatementLine.unit_price_cents is snapshotted at add time; a later PATCH /gpl-items price change does not move the existing line (still 150000)."
        test_recipe:
          setup: ["FuneralHome; a MERCHANDISE GplItem priced 150000; AT_NEED Case disclosed with one line added at price 150000."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "CASKET-A", name: "Oak casket", category: "MERCHANDISE", taxable: true, non_declinable: false, preneed_trustable: true, unit_price_cents: 150000 }
              as: Admin
              captures: { casket_item_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${casket_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
              captures: { line_id: $.data.id }
          trigger:
            - call: "PATCH /gpl-items/${casket_item_id}"
              payload: { unit_price_cents: 999999 }
              as: Admin
            - call: "GET /statement-lines/${line_id}"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
              captures: { snap: $.data.unit_price_cents }
          assert:
            - "StatementLine.${line_id}.unit_price_cents == 150000 (snapshot, not 999999)"

      - name: system_fields_minted_input_ignored_on_case_create
        claim_type: System Fields
        grounds: [entities.Case]
        distinguishing_aspect: "Server mints id/created_at/version; arrangement_status starts INTAKE and interment_status NOT_READY regardless of input."
        test_recipe:
          setup: ["a FuneralHome exists"]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "PRENEED" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.arrangement_status == INTAKE"
            - "Case.${case_id}.interment_status == NOT_READY"
            - "Case.${case_id}.disclosure_acknowledged == false"
            - "Case.${case_id}.version == 1"

      - name: list_cases_pagination_envelope_fields_present
        claim_type: Listing
        grounds: [entities.Case]
        distinguishing_aspect: "GET /cases returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["one FuneralHome with one Case"]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "PRENEED" }
              as: Arranger
              as_user_id: "arr-1"
          trigger:
            - call: "GET /cases?funeral_home_id=${home_id}"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
          assert:
            - "response_type == array; meta.total_count == 1; meta.has_more == false"

      - name: pagination_limit_out_of_range_returns_validation_error
        claim_type: Type Constraints
        grounds: ["errors[ERR_VALIDATION_OUT_OF_RANGE]"]
        distinguishing_aspect: "GET /cases with limit above max (100) -> ERR_VALIDATION_OUT_OF_RANGE."
        test_recipe:
          setup: ["a FuneralHome exists"]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
          trigger:
            - call: "GET /cases?limit=500"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION_OUT_OF_RANGE"

      - name: fk_reverse_list_contracts_by_case
        claim_type: Parent Relationships
        grounds: [entities.Contract.fields.case_id]
        distinguishing_aspect: "GET /contracts?case_id={id} returns the contract list for that case (FK reverse-reachability, array length 0..1)."
        test_recipe:
          setup: ["AT_NEED Case with a created contract."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "SVC", name: "Basic", category: "SERVICE", non_declinable: true, unit_price_cents: 100000 }
              as: Admin
              captures: { svc_item_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${svc_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/contract"
              payload: { funding_type: "AT_NEED_DIRECT" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { contract_id: $.data.id }
          trigger:
            - call: "GET /contracts?case_id=${case_id}"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
          assert:
            - "response array contains exactly one Contract whose id == ${contract_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: acknowledge_disclosure_twice_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Case.INTAKE_to_DISCLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second acknowledge on a DISCLOSED case -> ERR_INVALID_STATE; disclosure_officer_id unchanged (still arr-1)."
        test_recipe:
          setup: ["AT_NEED Case already DISCLOSED by arr-1."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
          trigger:
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Case.${case_id}.disclosure_officer_id == arr-1 (unchanged)"

      - name: terminal_cancelled_case_cannot_be_completed
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Case.INTAKE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED case (terminal) rejects POST /complete with ERR_INVALID_STATE."
        test_recipe:
          setup: ["AT_NEED Case at INTAKE then CANCELLED."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/cancel"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
          trigger:
            - call: "POST /cases/${case_id}/complete"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Case.${case_id}.arrangement_status == CANCELLED"

      - name: permit_reapply_on_issued_returns_permit_not_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Permit.REJECTED_to_APPLIED, "errors[ERR_PERMIT_NOT_REJECTED]"]
        distinguishing_aspect: "Reapply requires REJECTED; on an ISSUED permit -> ERR_PERMIT_NOT_REJECTED."
        test_recipe:
          setup: ["AT_NEED Case with an ISSUED DEATH_CERTIFICATE."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/permits"
              payload: { permit_type: "DEATH_CERTIFICATE" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { dc_id: $.data.id }
            - call: "POST /permits/${dc_id}/issue"
              payload: { reference_number: "DC-1" }
              as: Registrar
              as_user_id: "reg-1"
          trigger:
            - call: "POST /permits/${dc_id}/reapply"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PERMIT_NOT_REJECTED"
            - "Permit.${dc_id}.status == ISSUED"

      - name: issue_on_rejected_permit_returns_permit_not_applied
        claim_type: Invalid Transitions
        grounds: [state_machines.Permit.APPLIED_to_ISSUED, "errors[ERR_PERMIT_NOT_APPLIED]"]
        distinguishing_aspect: "Issue requires APPLIED; on a REJECTED permit -> ERR_PERMIT_NOT_APPLIED."
        test_recipe:
          setup: ["AT_NEED Case with a REJECTED DEATH_CERTIFICATE."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/permits"
              payload: { permit_type: "DEATH_CERTIFICATE" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { dc_id: $.data.id }
            - call: "POST /permits/${dc_id}/reject"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
          trigger:
            - call: "POST /permits/${dc_id}/issue"
              payload: { reference_number: "DC-1" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PERMIT_NOT_APPLIED"
            - "Permit.${dc_id}.status == REJECTED"

      - name: reopen_at_need_contract_returns_not_amendable
        claim_type: Precondition Enforcement
        grounds: [state_machines.Contract.PENDING_FUNDING_to_DRAFT, "errors[ERR_NOT_AMENDABLE]"]
        distinguishing_aspect: "Reopen is preneed-only; reopening an AT_NEED_DIRECT contract in PENDING_FUNDING -> ERR_NOT_AMENDABLE."
        test_recipe:
          setup: ["AT_NEED contract PENDING_FUNDING (GFS issued, submitted)."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "SVC", name: "Basic", category: "SERVICE", non_declinable: true, unit_price_cents: 100000 }
              as: Admin
              captures: { svc_item_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${svc_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/contract"
              payload: { funding_type: "AT_NEED_DIRECT" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { contract_id: $.data.id }
            - call: "POST /cases/${case_id}/issue-gfs"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /contracts/${contract_id}/submit-for-funding"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
          trigger:
            - call: "POST /contracts/${contract_id}/reopen"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_AMENDABLE"
            - "Contract.${contract_id}.status == PENDING_FUNDING"

      - name: submit_for_funding_before_gfs_returns_gfs_not_issued
        claim_type: Precondition Enforcement
        grounds: [state_machines.Contract.DRAFT_to_PENDING_FUNDING, "errors[ERR_GFS_NOT_ISSUED]"]
        distinguishing_aspect: "DRAFT contract on a case whose GFS is not issued -> ERR_GFS_NOT_ISSUED on submit-for-funding."
        test_recipe:
          setup: ["AT_NEED Case disclosed with a SELECTED line and a DRAFT contract, GFS NOT yet issued."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "SVC", name: "Basic", category: "SERVICE", non_declinable: true, unit_price_cents: 100000 }
              as: Admin
              captures: { svc_item_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${svc_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/contract"
              payload: { funding_type: "AT_NEED_DIRECT" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /contracts/${contract_id}/submit-for-funding"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_GFS_NOT_ISSUED"
            - "Contract.${contract_id}.status == DRAFT"

      - name: issue_gfs_without_contract_returns_contract_required
        claim_type: Precondition Enforcement
        grounds: [state_machines.Case.DISCLOSED_to_ARRANGED, "errors[ERR_CONTRACT_REQUIRED]"]
        distinguishing_aspect: "GFS issuance with a SELECTED line but NO contract -> ERR_CONTRACT_REQUIRED."
        test_recipe:
          setup: ["AT_NEED Case disclosed with a non-declinable SELECTED line, no contract created."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "SVC", name: "Basic", category: "SERVICE", non_declinable: true, unit_price_cents: 100000 }
              as: Admin
              captures: { svc_item_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${svc_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
