      - name: bid_active_suspended_active_cycle_gates_contract_creation
        grounds:
          - state_machines.Bid.ACTIVE_to_SUSPENDED
          - state_machines.Bid.SUSPENDED_to_ACTIVE
          - validations[priority=11]
          - errors[ERR_BID_NOT_ACTIVE]
        distinguishing_aspect: |
          Non-linearity here is a CYCLE on the Bid entity — a different entity from the
          parallel-dimension PurchaseContract instance. ACTIVE -> SUSPENDED -> ACTIVE returns
          the same row to a state it already occupied, and contract creation is rejected in the
          trough and accepted again on the far side of the loop.
        test_recipe:
          setup:
            - "Desk, elevator and a SHORT 2026-12 hedge with 10 lots at 448."
            - "One CORN bid at that elevator, activated once and then suspended."
          setup_api_calls:
