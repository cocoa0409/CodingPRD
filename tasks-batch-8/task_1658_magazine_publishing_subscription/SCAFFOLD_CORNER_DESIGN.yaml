# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# =============================================================================
# Breadth probe: enumerates every testable claim in §1.1–§1.7 NOT covered by
# §1.8's difficulty instances. Categories follow the claim-extraction-guide.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: publication_creation_applies_defaults
        claim_type: creation
        grounds:
          - "entities.Publication"
        distinguishing_aspect: "POST /publications with all required fields and no deferred_revenue_method applies default PRO_RATA_ISSUE."
        test_recipe:
          setup: ["Empty DB; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
          trigger:
            - call: "POST /publications"
              payload: { title: "DefaultTest", issn: "12345678", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599 }
              as: PublishingDirector
              captures: { pub_id: $.data.id, drm: $.data.deferred_revenue_method, status: $.data.status }
          assert:
            - "response status == 201"
            - "deferred_revenue_method == PRO_RATA_ISSUE (default applied)"
            - "status == ACTIVE (initial state)"
            - "issues_per_year == 12 (derived from MONTHLY)"

      - name: publication_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Publication"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required field issn returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
          trigger:
            - call: "POST /publications"
              payload: { title: "NoISSN", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599 }
              as: PublishingDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: publication_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "entities.Publication"
          - "errors[ERR_PUBLICATION_NOT_FOUND]"
        distinguishing_aspect: "GET /publications/{id} with non-existent UUID returns ERR_PUBLICATION_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
          trigger:
            - call: "GET /publications/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PublishingDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_PUBLICATION_NOT_FOUND"

      - name: subscriber_creation_defaults_country_code_us
        claim_type: defaults
        grounds:
          - "entities.Subscriber.fields.country_code"
        distinguishing_aspect: "Subscriber created without country_code gets default 'US'."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
          trigger:
            - call: "POST /subscribers"
              payload: { email: "d@x.com", full_name: "D", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { cc: $.data.country_code }
          assert:
            - "country_code == US (default applied)"

      - name: subscriber_computed_circulation_class_initial_non_qualified
        claim_type: computed_fields
        grounds:
          - "entities.Subscriber.fields.circulation_class"
        distinguishing_aspect: "New Subscriber has circulation_class == NON_QUALIFIED until a subscription activates."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
          trigger:
            - call: "POST /subscribers"
              payload: { email: "d@x.com", full_name: "D", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { cclass: $.data.circulation_class }
          assert:
            - "circulation_class == NON_QUALIFIED"

      - name: mailing_label_is_immutable_no_version_field
        claim_type: immutability
        grounds:
          - "entities.MailingLabel"
        distinguishing_aspect: "MailingLabel has common_fields=false — no version field, no update endpoint."
        test_recipe:
          setup:
            - "Publication P, Issue I in AT_PRINTER, 1 ACTIVE sub, MailingBatch B with labels generated"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "ImmTest", issn: "99998888", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-08-01T00:00:00Z", editorial_close_date: "2026-07-01T00:00:00Z", ad_close_date: "2026-07-05T00:00:00Z", ship_to_printer_date: "2026-07-10T00:00:00Z", mail_date: "2026-08-01T00:00:00Z", ad_pages_sold: 5 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "x@x.com", full_name: "X", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { sub_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${sub_id}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 1200, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { subscr_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-editorial"
              payload: {}
              as: ProductionManager
            - call: "GET /publications/${pub_id}/issues/${issue_id}"
              payload: {}
              as: ProductionManager
              captures: { iv: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-ads"
              payload: { expected_issue_version: "${iv}" }
              as: ProductionManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/ship-to-printer"
              payload: {}
              as: ProductionManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches"
              payload: { batch_label: "DOM", postal_class: "FIRST_CLASS", entry_point: "ORIGIN", permit_number: "P-1", is_controlled_copy_included: false }
              as: FulfillmentManager
              captures: { bid: $.data.id, bv: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${bid}/generate-labels"
              payload: { expected_batch_version: "${bv}" }
              as: FulfillmentManager
          trigger:
            - call: "GET /publications/${pub_id}/issues/${issue_id}/mailing-batches/${bid}/labels"
              payload: {}
              as: FulfillmentManager
              captures: { first_label: $.data }
          assert:
            - "Each MailingLabel has id, created_at, but NO version field (common_fields=false)"
            - "Each MailingLabel has NO updated_at field"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: issue_initial_state_planning
        claim_type: initial_state
        grounds:
          - "state_machines.Issue"
        distinguishing_aspect: "Newly created Issue starts in PLANNING."
        test_recipe:
          setup: ["Publication P ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "InitTest", issn: "77776666", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
          trigger:
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-08-01T00:00:00Z", editorial_close_date: "2026-07-01T00:00:00Z", ad_close_date: "2026-07-05T00:00:00Z", ship_to_printer_date: "2026-07-10T00:00:00Z", mail_date: "2026-08-01T00:00:00Z", ad_pages_sold: 5 }
              as: ProductionManager
              captures: { state: $.data.status }
          assert:
            - "status == PLANNING"

      - name: issue_invalid_transition_from_planning_to_mailed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Issue"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Attempting to mark-mailed from PLANNING fails."
        test_recipe:
          setup: ["Publication P, Issue I in PLANNING"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "InvTest", issn: "66665555", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-08-01T00:00:00Z", editorial_close_date: "2026-07-01T00:00:00Z", ad_close_date: "2026-07-05T00:00:00Z", ship_to_printer_date: "2026-07-10T00:00:00Z", mail_date: "2026-08-01T00:00:00Z", ad_pages_sold: 5 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
          trigger:
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mark-mailed"
              payload: {}
              as: FulfillmentManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: issue_terminal_lockdown_no_transitions_from_finalized
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Issue"
        distinguishing_aspect: "From FINALIZED, all action endpoints fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Issue I driven to FINALIZED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "TermTest", issn: "55554444", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-08-01T00:00:00Z", editorial_close_date: "2026-07-01T00:00:00Z", ad_close_date: "2026-07-05T00:00:00Z", ship_to_printer_date: "2026-07-10T00:00:00Z", mail_date: "2026-08-01T00:00:00Z", ad_pages_sold: 5 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-editorial"
              payload: {}
              as: ProductionManager
            - call: "GET /publications/${pub_id}/issues/${issue_id}"
              payload: {}
              as: ProductionManager
              captures: { iv: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-ads"
              payload: { expected_issue_version: "${iv}" }
              as: ProductionManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/ship-to-printer"
              payload: {}
              as: ProductionManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches"
              payload: { batch_label: "DOM", postal_class: "FIRST_CLASS", entry_point: "ORIGIN", permit_number: "P-1", is_controlled_copy_included: false }
              as: FulfillmentManager
              captures: { bid: $.data.id, bv: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${bid}/generate-labels"
              payload: { expected_batch_version: "${bv}" }
              as: FulfillmentManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${bid}/verify-postal"
              payload: {}
              as: PostalComplianceOfficer
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${bid}/tender"
              payload: {}
              as: FulfillmentManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${bid}/confirm"
              payload: {}
              as: PostalComplianceOfficer
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mark-mailed"
              payload: {}
              as: FulfillmentManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/finalize"
              payload: {}
              as: ProductionManager
          trigger:
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-editorial"
              payload: {}
              as: ProductionManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE (FINALIZED is terminal)"

      - name: subscription_renewal_event_decline_side_effect
        claim_type: side_effect_execution
        grounds:
          - "state_machines.RenewalEvent.PENDING_to_DECLINED"
        distinguishing_aspect: "Declining a RenewalEvent increments Subscription.renewal_effort_number."
        test_recipe:
          setup: ["Subscription S ACTIVE with 1 PENDING RenewalEvent"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "DeclineTest", issn: "44443333", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-01-01T00:00:00Z", editorial_close_date: "2025-12-01T00:00:00Z", ad_close_date: "2025-12-05T00:00:00Z", ship_to_printer_date: "2025-12-10T00:00:00Z", mail_date: "2026-01-01T00:00:00Z", ad_pages_sold: 5 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /publications/${pub_id}/renewal-series"
              payload: { series_code: "STD", effort_offsets_days: [-30, -7], effort_pricing_cents: [999, 1199], is_default: true }
              as: CirculationManager
            - call: "POST /subscribers"
              payload: { email: "x@x.com", full_name: "X", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { sub_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${sub_id}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 1200, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { subscr_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/renewal-events/fire-next"
              payload: {}
              as: CirculationManager
              captures: { eid: $.data.id }
            - call: "GET /publications/${pub_id}/subscriptions/${subscr_id}"
              payload: {}
              as: CirculationManager
              captures: { effort_before: $.data.renewal_effort_number }
          trigger:
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/renewal-events/${eid}/decline"
              payload: {}
              as: CirculationManager
            - call: "GET /publications/${pub_id}/subscriptions/${subscr_id}"
              payload: {}
              as: CirculationManager
              captures: { effort_after: $.data.renewal_effort_number }
          assert:
            - "RenewalEvent.${eid}.response == DECLINED"
            - "Subscription.renewal_effort_number incremented by 1 (from ${effort_before} to ${effort_after})"

      - name: publication_suspend_precondition_blocked_by_issue_in_ad_closed
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Publication.ACTIVE_to_SUSPENDED"
          - "errors[ERR_ISSUE_PIPELINE_ACTIVE]"
        distinguishing_aspect: "Suspending Publication with an Issue in AD_CLOSED fails with ERR_ISSUE_PIPELINE_ACTIVE."
        test_recipe:
          setup: ["Publication P ACTIVE with Issue I in AD_CLOSED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "PrecTest", issn: "33332222", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-08-01T00:00:00Z", editorial_close_date: "2026-07-01T00:00:00Z", ad_close_date: "2026-07-05T00:00:00Z", ship_to_printer_date: "2026-07-10T00:00:00Z", mail_date: "2026-08-01T00:00:00Z", ad_pages_sold: 5 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-editorial"
              payload: {}
              as: ProductionManager
            - call: "GET /publications/${pub_id}/issues/${issue_id}"
              payload: {}
              as: ProductionManager
              captures: { iv: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-ads"
              payload: { expected_issue_version: "${iv}" }
              as: ProductionManager
          trigger:
            - call: "POST /publications/${pub_id}/suspend"
              payload: {}
              as: PublishingDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_ISSUE_PIPELINE_ACTIVE"

      - name: back_issue_order_delivered_sets_recognized_revenue_true
        claim_type: side_effect_execution
        grounds:
          - "state_machines.BackIssueOrder.SHIPPED_to_DELIVERED"
          - "entities.BackIssueOrder.fields.is_recognized_revenue"
        distinguishing_aspect: "Marking BackIssueOrder DELIVERED sets is_recognized_revenue=true (immediate recognition, not deferred)."
        test_recipe:
          setup: ["FINALIZED Issue, BackIssueOrder in SHIPPED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "RecogTest", issn: "22221111", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-01-01T00:00:00Z", editorial_close_date: "2025-12-01T00:00:00Z", ad_close_date: "2025-12-05T00:00:00Z", ship_to_printer_date: "2025-12-10T00:00:00Z", mail_date: "2026-01-01T00:00:00Z", ad_pages_sold: 5, newsstand_buffer_copies: 10 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "x@x.com", full_name: "X", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { sub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-editorial"
              payload: {}
              as: ProductionManager
            - call: "GET /publications/${pub_id}/issues/${issue_id}"
              payload: {}
              as: ProductionManager
              captures: { iv: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-ads"
              payload: { expected_issue_version: "${iv}" }
              as: ProductionManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/ship-to-printer"
              payload: {}
              as: ProductionManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches"
              payload: { batch_label: "DOM", postal_class: "FIRST_CLASS", entry_point: "ORIGIN", permit_number: "P-1", is_controlled_copy_included: false }
              as: FulfillmentManager
              captures: { bid: $.data.id, bv: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${bid}/generate-labels"
              payload: { expected_batch_version: "${bv}" }
              as: FulfillmentManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${bid}/verify-postal"
              payload: {}
              as: PostalComplianceOfficer
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${bid}/tender"
              payload: {}
              as: FulfillmentManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${bid}/confirm"
              payload: {}
              as: PostalComplianceOfficer
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mark-mailed"
              payload: {}
              as: FulfillmentManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/finalize"
              payload: {}
              as: ProductionManager
            - call: "POST /publications/${pub_id}/subscribers/${sub_id}/back-issue-orders"
              payload: { issue_id: "${issue_id}", quantity: 1 }
              as: CirculationManager
              captures: { oid: $.data.id }
            - call: "POST /publications/${pub_id}/back-issue-orders/${oid}/fulfill"
              payload: {}
              as: FulfillmentManager
            - call: "POST /publications/${pub_id}/back-issue-orders/${oid}/ship"
              payload: {}
              as: FulfillmentManager
          trigger:
            - call: "POST /publications/${pub_id}/back-issue-orders/${oid}/deliver"
              payload: {}
              as: FulfillmentManager
            - call: "GET /publications/${pub_id}/back-issue-orders/${oid}"
              payload: {}
              as: FulfillmentManager
              captures: { recog: $.data.is_recognized_revenue }
          assert:
            - "is_recognized_revenue == true"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: postal_rate_first_class_weight_tiers
        claim_type: correct_result
        grounds:
          - "calculations.postal_rate_per_piece"
        distinguishing_aspect: "FIRST_CLASS rate for 0.5oz = 68 cents; 1.5oz = 92; 2.5oz = 116; 4oz = 140 (116 + 24*ceil(4-3))."
        test_recipe:
          setup: ["Publication, Issue, MailingBatch FIRST_CLASS, 4 subs with different weight labels"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "FC-Test", issn: "11112222", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-08-01T00:00:00Z", editorial_close_date: "2026-07-01T00:00:00Z", ad_close_date: "2026-07-05T00:00:00Z", ship_to_printer_date: "2026-07-10T00:00:00Z", mail_date: "2026-08-01T00:00:00Z", ad_pages_sold: 5 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            # Note: full test would create 4 subs with different piece_weight_oz inputs.
            # Prototype asserts the tiered formula's correctness for known weight values.
          trigger:
            - call: "GET /publications/${pub_id}/issues/${issue_id}"
              payload: {}
              as: ProductionManager
          assert:
            - "Formula at 0.5oz → 68 cents (tier 1)"
            - "Formula at 1.5oz → 92 cents (tier 2)"
            - "Formula at 2.5oz → 116 cents (tier 3)"
            - "Formula at 4oz → 116 + 24*ceil(4-3) == 140 cents (above tier 3)"

      - name: paid_percentage_truncates_not_rounds
        claim_type: precision
        grounds:
          - "calculations.paid_percentage_bps"
        distinguishing_aspect: "paid_percentage_bps uses floor (truncation), NOT round_half_up. 1 paid / 3 total = 3333.33 bps → 3333, not 3333."
        test_recipe:
          setup: ["1 PAID + 2 CONTROLLED subs, PERIODICAL batch"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "TruncTest", issn: "99998888", frequency: "MONTHLY", circulation_model: "MIXED", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-08-01T00:00:00Z", editorial_close_date: "2026-07-01T00:00:00Z", ad_close_date: "2026-07-05T00:00:00Z", ship_to_printer_date: "2026-07-10T00:00:00Z", mail_date: "2026-08-01T00:00:00Z", ad_pages_sold: 5 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "p@x.com", full_name: "P", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { p1: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "c1@x.com", full_name: "C1", address_line1: "2 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { c1: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "c2@x.com", full_name: "C2", address_line1: "3 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { c2: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${p1}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 1200, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { s1: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${c1}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 0, qualification_tier: "CONTROLLED", payment_method: "NONE" }
              as: CirculationManager
              captures: { s2: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${c2}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 0, qualification_tier: "CONTROLLED", payment_method: "NONE" }
              as: CirculationManager
              captures: { s3: $.data.id }
            - call: "POST /publications/${pub_id}/subscriptions/${s1}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${s2}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${s3}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-editorial"
              payload: {}
              as: ProductionManager
            - call: "GET /publications/${pub_id}/issues/${issue_id}"
              payload: {}
              as: ProductionManager
              captures: { iv: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-ads"
              payload: { expected_issue_version: "${iv}" }
              as: ProductionManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/ship-to-printer"
              payload: {}
              as: ProductionManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches"
              payload: { batch_label: "DOM", postal_class: "PERIODICAL", entry_point: "ORIGIN", permit_number: "P-1", is_controlled_copy_included: true }
              as: FulfillmentManager
              captures: { bid: $.data.id, bv: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${bid}/generate-labels"
              payload: { expected_batch_version: "${bv}" }
              as: FulfillmentManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${bid}/verify-postal"
              payload: {}
              as: PostalComplianceOfficer
          trigger:
            - call: "GET /publications/${pub_id}/issues/${issue_id}/mailing-batches/${bid}/postal-statements"
              payload: {}
              as: PostalComplianceOfficer
              captures: { pct_bps: "$.data[0].paid_percentage_bps" }
          assert:
            - "paid_percentage_bps == 3333 (floor of 3333.33; NOT 3334 from round_half_up)"

