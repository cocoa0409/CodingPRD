      - name: redeliver_remedy_compensates_the_exception_in_both_directions
        claim_type: compensation
        grounds:
          - "state_machines.DeliveryOrder.EXCEPTION_to_RECEIVED"
          - "calculations.customer_remedy_amount"
          - "calculations.merchant_fee_ledger"
          - "entities.DeliveryOrder.fields.remedy_kind"
          - "entities.ServiceZone.fields.remedy_spent_cents"
        distinguishing_aspect: >-
          REDELIVER is the compensating edge of the order machine: it returns EXCEPTION -> RECEIVED, clears
          exception_reason to null while preserving the reason in remedy_reason_code, charges
          remedy_amount_cents 0 and spends nothing from the zone budget, and it moves the quoted 850 back
          from released to escrowed - the exact reverse of the exception posting - which no other
          remedy_kind does.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with remedy_budget_cents 50000 and remedy_spent_cents 0"
            - "Merchant M1 ACTIVE PREFERRED; order O1 quoted at 850 with dispatch_attempt_count 1"
            - "the mission for O1 was aborted from PLANNED with reason_code DISPATCH_CANCELLED, so the order is EXCEPTION with exception_reason ROBOT_FAULT"
            - "at this point Merchant M1 has escrowed_fee_cents 0, released_fee_cents 850 and exception_count 1"
