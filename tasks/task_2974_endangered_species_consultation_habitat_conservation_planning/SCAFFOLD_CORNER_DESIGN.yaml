              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /habitat-conservation-plans/${hcp2_id}/funding-assurances"
              payload: {contribution_cents: 3787560, instrument_type: "IRREVOCABLE_LETTER_OF_CREDIT"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /habitat-conservation-plans/${hcp2_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /habitat-conservation-plans/${hcp2_id}/decision"
