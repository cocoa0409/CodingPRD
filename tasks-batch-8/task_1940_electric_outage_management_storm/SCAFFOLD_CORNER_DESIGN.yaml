        distinguishing_aspect: "withdraw with permanent=true moves DRAFT -> WITHDRAWN (terminal); a later submit is rejected as invalid state."
        test_recipe:
          setup: ["Event ACTIVE; DRAFT claim"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
