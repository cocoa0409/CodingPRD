  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submittal_shortlist_requires_requisition_distributed
        grounds:
          - state_machines.Submittal.SUBMITTED_to_SHORTLISTED
          - state_machines.Requisition.DISTRIBUTED_to_CLOSED
          - entities.Requisition.fields.status
        distinguishing_aspect: |
          Entity pair Submittal->Requisition: a Submittal may move SUBMITTED->
          SHORTLISTED only while its Requisition.status == DISTRIBUTED; after the
          requisition is CLOSED the submittal is auto-REJECTED and shortlist fails.
          (Different pair from Timesheet->Assignment below.)
        test_recipe:
          setup:
            - "Distributed requisition with one SUBMITTED submittal, then requisition CLOSED"
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W", national_id_hash: "h1" }
              as: ProgramManager
              captures: { wkr_id: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 1, max_pay_rate_cents: 20000 }
              as: ProgramManager
              captures: { req_id: $.data.id }
            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${sup_id}"] }
              as: ProgramManager
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${sup_id}", worker_profile_id: "${wkr_id}", pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vms/requisitions/${req_id}/close"
              payload: {}
              as: ProgramManager
          trigger:
