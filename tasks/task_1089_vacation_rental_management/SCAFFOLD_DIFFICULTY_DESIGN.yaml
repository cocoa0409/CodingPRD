            - "err == ERR_DATES_UNAVAILABLE"

      - name: vendor_turnover_buffer_overlap_rejected
        grounds:
          - validations[priority=9]
          - errors[ERR_VENDOR_UNAVAILABLE]
          - calculations.vendor_turnover_overlap
        distinguishing_aspect: "On a Vendor, a turnover window [2026-07-04T14:00, 16:00] is rejected ERR_VENDOR_UNAVAILABLE because it falls within the 120-minute buffer after an existing [10:00, 13:00] task (buffered end 15:00) — closed-interval + buffer semantics, different resource entity and interval geometry than the booking overlap."
        test_recipe:
          setup:
