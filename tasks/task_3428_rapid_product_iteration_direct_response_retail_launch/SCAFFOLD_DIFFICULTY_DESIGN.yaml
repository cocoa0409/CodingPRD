  - rule_id: resource_temporal_overlap
    instances:

      - name: exclusive_windows_half_open_overlap_but_adjacency_allowed
        grounds:
          - state_machines.RetailAgreement.DRAFT_to_SIGNED
          - errors[ERR_EXCLUSIVE_WINDOW_CONFLICT]
          - entities.RetailAgreement.fields.window_start
        distinguishing_aspect: |
          Resource: Category shelf space; interval semantics: half-open
          [window_start, window_end) EXCLUSION — overlapping exclusive windows
          conflict, but windows merely touching (A1.window_end == A3.window_start)
          do not. Both sides of the adjacency boundary are exercised.
        test_recipe:
          setup:
            - "Season OPEN; category base 6 CLEAR. Agreement A1 exclusive [2026-10-01, 2027-01-01) SIGNED."
          setup_api_calls:
