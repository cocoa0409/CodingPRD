              as: PolicyAdmin
              captures: { task_id: "$.data[0].id" }
          trigger:
            - call: "POST /ad-policy/review-tasks/${task_id}/requeue"
              payload: {}
              as: PolicyAdmin
              captures: { err_queued: "$.data.error_id" }
            - call: "POST /ad-policy/review-tasks/${task_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "POST /ad-policy/review-tasks/${task_id}/requeue"
