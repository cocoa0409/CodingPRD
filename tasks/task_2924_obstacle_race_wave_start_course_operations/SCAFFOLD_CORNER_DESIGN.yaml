              as: CourseDesigner
              captures: { permit_id: $.data.id }
            - call: "POST /ocr/permits/${permit_id}/submit"
              payload: {}
              as: CourseDesigner
              as_user_id: "designer-1"
            - call: "POST /ocr/permits/${permit_id}/decision"
              payload: { decision: "APPROVED", decision_note: "Approved as filed" }
              as: PermitOfficer
              as_user_id: "officer-1"
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Flat Loop", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_a_id: $.data.id }
            - call: "POST /ocr/courses/${course_a_id}/obstacles"
              payload: { name: "A Station 1", station_index: 1, difficulty_rating: 5, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1600, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { a1_id: $.data.id }
            - call: "POST /ocr/courses/${course_a_id}/obstacles"
              payload: { name: "A Station 2", station_index: 2, difficulty_rating: 5, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1600, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { a2_id: $.data.id }
            - call: "POST /ocr/courses/${course_a_id}/obstacles"
              payload: { name: "A Station 3", station_index: 3, difficulty_rating: 5, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1600, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { a3_id: $.data.id }
          trigger:
            - call: "POST /ocr/courses/${course_a_id}/validate"
              payload: {}
              as: CourseDesigner
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Ladder Loop", total_distance_m: 9000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_b_id: $.data.id }
            - call: "POST /ocr/courses/${course_b_id}/obstacles"
              payload: { name: "B Station 1", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 500, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { b1_id: $.data.id }
            - call: "POST /ocr/courses/${course_b_id}/obstacles"
              payload: { name: "B Station 2", station_index: 2, difficulty_rating: 5, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 500, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { b2_id: $.data.id }
            - call: "POST /ocr/courses/${course_b_id}/obstacles"
              payload: { name: "B Station 3", station_index: 3, difficulty_rating: 7, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 500, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { b3_id: $.data.id }
            - call: "POST /ocr/courses/${course_b_id}/validate"
              payload: {}
