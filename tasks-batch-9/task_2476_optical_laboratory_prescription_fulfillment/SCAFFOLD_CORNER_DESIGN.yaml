      - name: validation_rules_are_evaluated_in_ascending_priority
        claim_type: priority_ordering
        grounds:
          - validations[priority=210]
          - validations[priority=220]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / unverified_and_expired_prescription_reports_not_verified_before_expired
          rationale: >-
            PRIORITY PAIR A is exercised there on a payload that violates both 210 and 220 at once and
            then again with only the lower-priority violation left, which is exactly the ordering
