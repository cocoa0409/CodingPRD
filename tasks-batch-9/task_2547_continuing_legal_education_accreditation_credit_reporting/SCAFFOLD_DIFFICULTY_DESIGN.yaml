      - name: audit_suspension_sanction_rejects_only_the_pending_credit_records_of_suspended_courses
        grounds:
          - state_machines.ProviderAudit.FINDINGS_ISSUED_to_SANCTIONED
          - state_machines.Provider.ACCREDITED_to_SUSPENDED
          - state_machines.Course.APPROVED_to_SUSPENDED_PENDING_REVIEW
          - state_machines.CreditRecord.PENDING_VERIFICATION_to_REJECTED
          - domain_constants.AUDIT_SANCTION_FEE_CENTS
          - calculations.cycle_credit_application
        distinguishing_aspect: |
          Cascade depth 4 from a different trigger (an audit action, not a complaint) down a different
          spine (ProviderAudit -> Provider -> Course -> CreditRecord), and the last hop is CONDITIONAL:
          only records in PENDING_VERIFICATION are rejected, so the VERIFIED record on an equally
          suspended course survives with its countable minutes intact while the cycle's earned total
          falls from 360 to 240. Falsifiable: an implementation that voids every record of a suspended
          course drops the cycle to 0; one that skips the record layer leaves earned at 360.
