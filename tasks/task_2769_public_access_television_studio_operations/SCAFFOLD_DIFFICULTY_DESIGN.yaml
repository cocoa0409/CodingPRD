  - rule_id: cross_entity_state_dependency
    instances:

      - name: slot_creation_blocked_until_program_reaches_approved
        grounds:
          - validations[priority=11]
          - errors[ERR_PROGRAM_NOT_APPROVED]
          - state_machines.Program.SUBMITTED_to_UNDER_REVIEW
          - state_machines.Program.UNDER_REVIEW_to_APPROVED
          - state_machines.PlaybackSlot.initial_state
          - calculations.playback_window_fit
        distinguishing_aspect: |
          The entity pair is PlaybackSlot depending on Program: an identical
          POST /playback-slots body is refused while the program is only SUBMITTED
          and accepted once a reviewer claims and approves it. Nothing about the
          slot changes between the two calls, so only the other entity's state can
          explain the difference.
        test_recipe:
          setup:
            - "Producer P is ACTIVE with certification_level BASIC."
            - "Channel PATV1 has window 1080..1380 and inter_program_buffer_seconds 120."
            - "Program PR (runtime_seconds 1800, required_crew_roles []) is CLEARED and has been submitted, so review_status is SUBMITTED and reviewed_by_user_id is null."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
            - call: "POST /producers/${p_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
