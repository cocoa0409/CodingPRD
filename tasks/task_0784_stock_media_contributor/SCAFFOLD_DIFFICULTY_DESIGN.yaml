            - "trigger error_id == ERR_CONTRIBUTOR_SUSPENDED"
            - "ERR_BELOW_PAYOUT_THRESHOLD is NOT returned though available_balance 0 < 10000 (lower priority)"

  # =========================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: payout_threshold_exact_10000_vs_9999
        grounds:
          - validations[priority=14]
          - errors[ERR_BELOW_PAYOUT_THRESHOLD]
          - entities.Contributor.fields.available_balance_cents
        distinguishing_aspect: |
          Metric = money threshold on POST /contributors/{id}/payouts. available_balance exactly
          10000 succeeds (>= PAYOUT_THRESHOLD_CENTS); 9999 is rejected with ERR_BELOW_PAYOUT_THRESHOLD.
        test_recipe:
          setup:
            - "Contributor A: US/W9 ACTIVE, +10000 adjustment -> available 10000."
            - "Contributor B: US/W9 ACTIVE, +9999 adjustment -> available 9999."
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Ka", country_code: "US" }
              as: Contributor
              captures: { cA: $.data.id }
            - call: "POST /contributors/${cA}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-A" }
              as: Contributor
              as_user_id: "${cA}"
              captures: { tfA: $.data.id }
            - call: "POST /tax-forms/${tfA}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /contributors/${cA}/earning-adjustments"
              payload: { amount_cents: 10000, reason: "seed" }
              as: FinanceAdmin
            - call: "GET /contributors/${cA}"
              payload: {}
              as: FinanceAdmin
              captures: { vA: $.data.version }
            - call: "POST /contributors"
              payload: { display_name: "Ky", country_code: "US" }
              as: Contributor
              captures: { cB: $.data.id }
            - call: "POST /contributors/${cB}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-B" }
              as: Contributor
              as_user_id: "${cB}"
              captures: { tfB: $.data.id }
            - call: "POST /tax-forms/${tfB}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /contributors/${cB}/earning-adjustments"
              payload: { amount_cents: 9999, reason: "seed" }
              as: FinanceAdmin
            - call: "GET /contributors/${cB}"
              payload: {}
              as: FinanceAdmin
              captures: { vB: $.data.version }
          trigger:
            - call: "POST /contributors/${cA}/payouts"
              payload: { expected_contributor_version: "${vA}" }
              as: Contributor
              as_user_id: "${cA}"
              captures: { pA: $.data.id }
            - call: "POST /contributors/${cB}/payouts"
              payload: { expected_contributor_version: "${vB}" }
              as: Contributor
              as_user_id: "${cB}"
              captures: { errB: $.data.error_id }
          assert:
            - "Payout.${pA}.gross_amount_cents == 10000"
            - "Payout.${pA}.status == REQUESTED"
            - "second trigger error_id == ERR_BELOW_PAYOUT_THRESHOLD (9999 < 10000, strict boundary)"

      - name: similar_distance_5_vs_6
        grounds:
          - calculations.perceptual_hash_distance
          - validations[priority=12]
          - errors[ERR_NOT_SIMILAR_ENOUGH]
        distinguishing_aspect: |
          Metric = Hamming distance on POST /assets/{id}/reviews. distance 5 (0x0000 vs 0x001f) is a
          valid SIMILAR reject (<= SIMILAR_MAX_DISTANCE 5); distance 6 (0x0000 vs 0x003f) is rejected
          with ERR_NOT_SIMILAR_ENOUGH.
        test_recipe:
          setup:
            - "Contributor ACTIVE; asset A (hash 0000) ACCEPTED; asset B (hash 001f) IN_REVIEW; asset C (hash 003f) IN_REVIEW."
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Le", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-S" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "Orig", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "0000", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { aA: $.data.id }
            - call: "POST /assets/${aA}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${aA}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${aA}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "NearDup", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "001f", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { aB: $.data.id }
            - call: "POST /assets/${aB}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${aB}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "Distinct", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "003f", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { aC: $.data.id }
            - call: "POST /assets/${aC}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${aC}/claim"
              payload: {}
              as: Reviewer
          trigger:
            - call: "POST /assets/${aB}/reviews"
              payload: { decision: "REJECT", reject_reason: "SIMILAR", similar_to_asset_id: "${aA}" }
              as: Reviewer
              captures: { revB: $.data.asset_id }
            - call: "POST /assets/${aC}/reviews"
              payload: { decision: "REJECT", reject_reason: "SIMILAR", similar_to_asset_id: "${aA}" }
              as: Reviewer
              captures: { errC: $.data.error_id }
          assert:
            - "Asset.${aB}.status == REJECTED and Asset.${aB}.reject_reason == SIMILAR (distance 5 <= 5)"
            - "second trigger error_id == ERR_NOT_SIMILAR_ENOUGH (distance 6 > 5)"

  # =========================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: accept_requires_contributor_active
        grounds:
          - state_machines.Asset.IN_REVIEW_to_ACCEPTED
          - validations[priority=8]
          - errors[ERR_CONTRIBUTOR_NOT_ACTIVE]
          - entities.Contributor.fields.onboarding_status
        distinguishing_aspect: |
          Pair = Asset -> Contributor. Asset ACCEPT is blocked because the OWNING contributor is still
          PENDING (no verified tax form): ERR_CONTRIBUTOR_NOT_ACTIVE even though the asset is IN_REVIEW.
        test_recipe:
          setup:
            - "Contributor PENDING (no tax form); one asset submitted and claimed (IN_REVIEW)."
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Mo", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "Pending", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
          trigger:
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_CONTRIBUTOR_NOT_ACTIVE"
            - "Asset.${a_id}.status == IN_REVIEW (unchanged)"

      - name: download_requires_asset_accepted
        grounds:
          - entities.Download.fields.asset_id
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - state_machines.Asset.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Pair = Download -> Asset (a different pair from Asset->Contributor). Creating a Download
          against a SUBMITTED (not ACCEPTED) asset is rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "License tier STANDARD (1000) exists; one asset in SUBMITTED (never accepted)."
          setup_api_calls:
            - call: "POST /license-tiers"
              payload: { code: "STANDARD", base_price_cents: 1000 }
              as: FinanceAdmin
            - call: "POST /contributors"
              payload: { display_name: "No", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "NotYet", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /downloads"
              payload: { asset_id: "${a_id}", license_tier_code: "STANDARD", buyer_reference: "buy-x" }
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INVALID_STATE"
            - "no Download row is created for asset ${a_id}"

  # =========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: exclusivity_window_half_open_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_EXCLUSIVITY_OVERLAP]
          - entities.ExclusivityWindow.fields.start_at
          - entities.ExclusivityWindow.fields.end_at
        distinguishing_aspect: |
          Resource = Contributor (ExclusivityWindow). Interval semantics = half-open [start,end): an
          overlapping window (2026-05-01..2026-07-01 vs existing 2026-03-01..2026-06-01) is rejected,
          but a touching window starting exactly at the prior end (2026-06-01) is ALLOWED.
        test_recipe:
          setup:
            - "Contributor with one ACTIVE exclusivity window [2026-03-01, 2026-06-01)."
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Op", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/exclusivity-windows"
              payload: { start_at: "2026-03-01T00:00:00Z", end_at: "2026-06-01T00:00:00Z" }
              as: Contributor
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /contributors/${c_id}/exclusivity-windows"
              payload: { start_at: "2026-05-01T00:00:00Z", end_at: "2026-07-01T00:00:00Z" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
            - call: "POST /contributors/${c_id}/exclusivity-windows"
              payload: { start_at: "2026-06-01T00:00:00Z", end_at: "2026-07-01T00:00:00Z" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { w2: $.data.id }
          assert:
            - "first trigger error_id == ERR_EXCLUSIVITY_OVERLAP (2026-05-01 < 2026-06-01)"
            - "ExclusivityWindow.${w2}.status == ACTIVE (touch at 2026-06-01 allowed under half-open semantics)"

      - name: takedown_hold_closed_buffer_gap
        grounds:
          - validations[priority=11]
          - errors[ERR_TAKEDOWN_HOLD_CONFLICT]
          - entities.TakedownRequest.fields.hold_start
          - entities.TakedownRequest.fields.hold_end
        distinguishing_aspect: |
          Resource = Asset (TakedownRequest). Interval semantics = closed [hold_start, hold_end] PLUS a
          TAKEDOWN_BUFFER_DAYS (14) gap: a UPHELD hold [2026-03-01, 2026-05-30] blocks a new filing at
          2026-06-05 (< 2026-06-13) but allows one at 2026-06-20 (>= 2026-06-13). Differs from the
          half-open, buffer-free exclusivity semantics.
        test_recipe:
          setup:
            - "Contributor ACTIVE; one ACCEPTED asset; a takedown filed at default clock 2026-03-01 and UPHELD (hold [2026-03-01, 2026-05-30])."
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Pi", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-T" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "Held", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
            - call: "POST /assets/${a_id}/takedowns"
              payload: { claim_type: "COPYRIGHT", claimant_name: "First" }
              as: ComplianceOfficer
              captures: { td1: $.data.id }
            - call: "POST /takedowns/${td1}/decision"
              payload: { decision: "UPHOLD" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: FinanceAdmin
            - call: "POST /assets/${a_id}/takedowns"
              payload: { claim_type: "PRIVACY", claimant_name: "Second" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: FinanceAdmin
            - call: "POST /assets/${a_id}/takedowns"
              payload: { claim_type: "TRADEMARK", claimant_name: "Third" }
              as: ComplianceOfficer
              captures: { td3: $.data.id }
          assert:
            - "second call error_id == ERR_TAKEDOWN_HOLD_CONFLICT (2026-06-05 < hold_end 2026-05-30 + 14d = 2026-06-13)"
            - "TakedownRequest.${td3}.status == OPEN (2026-06-20 >= 2026-06-13, buffer cleared)"

  # =========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: settle_then_reverse_conserves_lifetime
        grounds:
          - state_machines.Download.PENDING_to_AVAILABLE
          - state_machines.Download.AVAILABLE_to_REVERSED
          - entities.Contributor.fields.lifetime_earnings_cents
        distinguishing_aspect: |
          Conserved quantity = Contributor.lifetime_earnings_cents. Settle credits +150, reverse debits
          exactly -150; lifetime_earnings_cents returns to its pre-settle value 0 (no drift).
        test_recipe:
