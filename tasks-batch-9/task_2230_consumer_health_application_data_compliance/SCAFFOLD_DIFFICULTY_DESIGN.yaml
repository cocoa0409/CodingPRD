  - rule_id: transitive_cascade
    instances:
      - name: vendor_termination_five_hop_cascade_pauses_geofence_campaign
        grounds:
          - state_machines.Vendor.EXECUTED_to_TERMINATED
          - state_machines.ElementPurposeMapping.ACTIVE_to_SUSPENDED
          - state_machines.PrivacyPolicyVersion.PUBLISHED_to_SUPERSEDED_PENDING_UPDATE
          - state_machines.GeofenceCampaign.ACTIVE_to_PAUSED
          - entities.AppProduct.fields.policy_compliance_state
        distinguishing_aspect: |
          Cascade of depth 5 originating from the Vendor EXECUTED -> TERMINATED transition: the
          termination suspends the mapping, the suspension moves the PUBLISHED policy to
          SUPERSEDED_PENDING_UPDATE, that state change sets policy_compliance_state to LAPSED,
          and the LAPSED product pauses the ACTIVE campaign; each hop is caused by the previous
          hop, not by the terminate call directly.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T00:00:00Z"
            - "one AppProduct with applicability_status CHD_REGULATED from an APPROVED assessment"
            - "one EXECUTED Vendor with flow_down_clause and audit_rights_clause true"
            - "one ACTIVE ElementPurposeMapping on a SHARE purpose naming that vendor"
            - "one PUBLISHED PrivacyPolicyVersion with completeness_score 100.0, so policy_compliance_state is CURRENT"
            - "one ACTIVE GeofenceCampaign on a TX GENERAL_HEALTH zone"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
