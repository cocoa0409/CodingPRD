            - call: "POST /store-ops/dispatches/${dsp_id}/stops/${stop1_id}/door-arrival"
              payload: { actual_miles: 3.40, cash_collected_cents: 2900 }
              as: Driver
              as_user_id: "${drv_id}"
          assert:
            - "hop 1: DispatchStop.${stop1_id}.status == DELIVERED and DispatchStop.${stop1_id}.arrived_at == 2026-08-05T12:36:00Z"
            - "hop 2: Order.${ord_a_id}.fulfillment_status == DELIVERED and Order.${ord_a_id}.settlement_status == CHARGED"
            - "hop 2: Order.${ord_a_id}.total_charge_cents == 2900, Order.${ord_a_id}.cash_collected_cents == 2900, Order.${ord_a_id}.order_to_door_gross_minutes == 36, Order.${ord_a_id}.order_to_door_net_minutes == 36"
            - "hop 3: Driver.${drv_id}.cash_on_hand_cents == 2900"
            - "hop 3: Driver.${drv_id}.cash_posture == DROP_REQUIRED, because 2900 >= Store.cash_limit_cents 2900"
