      - name: single_household_resolution_cascades_down_to_excess_enrollments
        claim_type: cascade_down
        grounds:
          - state_machines.HouseholdAddress.status.DUPLICATE_FLAGGED_to_RESOLVED_SINGLE_HOUSEHOLD
          - state_machines.Enrollment.benefit_status.ACTIVE_to_DE_ENROLLED
          - calculations.household_benefit_occupancy
          - endpoints[POST /lifeline/addresses/{id}/duplicate-resolution]
        distinguishing_aspect: |
          The SINGLE_HOUSEHOLD resolution arm cascades DOWN from one address to every
          benefit it hosts: with two ACTIVE enrollments admitted under a MULTI_HOUSEHOLD
          finding of 2, re-resolving to SINGLE_HOUSEHOLD keeps only the EARLIEST enrollment
          and de-enrolls the other with reason DUPLICATE_HOUSEHOLD - the still-ACTIVE row is
          untouched, which is the "only non-terminal children affected" half of the claim.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE provider licensed in TX with cap 50."
            - "Addresses A1 and A2 are punctuation variants of one dwelling, so both are DUPLICATE_FLAGGED with cohort_address_count 2."
            - "Subscribers S1 (created first) and S2 both live at A1, so both are born DUPLICATE_HOLD; each holds a confirmed unexpired check."
            - "A1 is resolved MULTI_HOUSEHOLD with declared_household_count 2, which lifts both subscribers to VERIFIED_ELIGIBLE and raises max_permitted_benefit_slots to 2."
            - "E1 (S1) then E2 (S2) are enrolled at A1, so occupied_benefit_slots is 2."
            - "A third variant spelling A3 is then created, which re-flags A1 as DUPLICATE_FLAGGED with cohort_address_count 3."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143121", study_area_code: "489121", licensed_state_codes: ["TX"], enrollment_cap: 50 }
