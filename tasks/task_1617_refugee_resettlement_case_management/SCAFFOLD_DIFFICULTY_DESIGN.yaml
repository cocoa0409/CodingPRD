scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (ServiceBenchmark due schedule vs EmploymentPlan
  # self-sufficiency).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: benchmark_due_basis_divergence
        grounds:
          - calculations.benchmark_due_schedule
          - entities.ServiceBenchmark.fields.planned_due_date
          - entities.ServiceBenchmark.fields.due_date
          - state_machines.ServiceBenchmark.PENDING_to_MET
        distinguishing_aspect: |
          One fulfillment date (2026-09-15) is ON TIME under the ACTUAL basis
          (due_date 2026-09-19) yet LATE under the SCHEDULED basis
          (planned_due_date 2026-09-09): the two variants of
          benchmark_due_schedule produce different due dates and different
          on-time verdicts for identical service data, on the
          ServiceBenchmark entity domain.
        test_recipe:
          setup:
            - "Case CASE-DV1 (household_size 2, scheduled arrival 2026-08-10), no members"
            - "1-bedroom unit with a READY HousingSetup (all six furnishing items) covering [2026-08-10, 2027-02-10)"
            - "Case arrived with actual_arrival_date 2026-08-20 (10 days later than scheduled)"
            - "A SERVICE_DELIVERY CaseNote exists on the case; logical clock is 2026-09-15"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-DV1", agency_affiliate_code: "AFF-01", household_size: 2, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "10 Elm St", bedrooms: 1 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-20" }
              as: CaseManager
            - call: "POST /case-notes"
              payload: { case_id: "${case_id}", note_type: "SERVICE_DELIVERY", body: "Home visit completed", service_date: "2026-09-15" }
              as: CaseManager
              captures: { note_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: AgencyDirector
          trigger:
            - call: "GET /cases/${case_id}/benchmarks"
              payload: { service_type: "HOME_VISIT" }
              as: CaseManager
              captures: { bm_id: "$.data[0].id", bm_planned: "$.data[0].planned_due_date", bm_due: "$.data[0].due_date" }
            - call: "POST /benchmarks/${bm_id}/fulfill"
              payload: { fulfilled_on: "2026-09-15", evidence_note_id: "${note_id}" }
              as: CaseManager
              captures: { bm_status: $.data.status, bm_on_time: $.data.on_time }
          assert:
            - "ServiceBenchmark.${bm_id}.planned_due_date == '2026-09-09' (SCHEDULED basis: 2026-08-10 + 30 days)"
            - "ServiceBenchmark.${bm_id}.due_date == '2026-09-19' (ACTUAL basis: 2026-08-20 + 30 days)"
            - "fulfill response status == 'MET' and on_time == true (2026-09-15 <= due_date 2026-09-19)"
            - "the identical fulfilled_on 2026-09-15 is later than planned_due_date 2026-09-09, so the SCHEDULED basis would score it late — the two variants diverge on identical data"

      - name: self_sufficiency_variant_divergence
        grounds:
          - calculations.self_sufficiency_determination
          - entities.EmploymentPlan.fields.self_sufficient
          - entities.EmploymentPlan.fields.determination_variant
          - state_machines.EmploymentPlan.ACTIVE_to_CERTIFIED
        distinguishing_aspect: |
          Two households with identical incomes (monthly 200000, trailing-3m
          400000, household_size 2) receive opposite verdicts: MONTHLY yields
          effective 180000 >= 175000 (PASS, plan CERTIFIED) while ANNUALIZED
          yields 340000 < 525000 (FAIL, plan stays ACTIVE) — a dual-variant
          calculation on the EmploymentPlan entity domain, distinct from the
          ServiceBenchmark due-schedule domain of benchmark_due_basis_divergence.
        test_recipe:
          setup:
            - "Two cases CASE-DV2A and CASE-DV2B, each household_size 2 with one work-eligible adult member, READY housing (1-bedroom units), both arrived 2026-08-10"
            - "Each case has an ACTIVE EmploymentPlan patched to monthly_income_cents 200000, trailing_3m_income_cents 400000"
            - "Logical clock is 2026-08-15"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:00:00Z" }
              as: AgencyDirector
            - call: "POST /cases"
              payload: { case_number: "CASE-DV2A", agency_affiliate_code: "AFF-01", household_size: 2, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_a: $.data.id }
            - call: "POST /members"
              payload: { case_id: "${case_a}", full_name: "Adult A", date_of_birth: "1990-01-01", relationship: "PRINCIPAL", work_eligible: true }
              as: CaseManager
            - call: "POST /housing-units"
              payload: { address: "20 Oak Ave", bedrooms: 1 }
              as: HousingCoordinator
              captures: { unit_a: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_a}", housing_unit_id: "${unit_a}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_a: $.data.id }
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_a}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "GET /cases/${case_a}"
              as: EmploymentSpecialist
              captures: { case_a_v: $.data.version }
            - call: "POST /employment-plans"
              payload: { case_id: "${case_a}", expected_case_version: "${case_a_v}" }
              as: EmploymentSpecialist
              captures: { plan_a: $.data.id }
            - call: "PATCH /employment-plans/${plan_a}"
              payload: { monthly_income_cents: 200000, trailing_3m_income_cents: 400000, employed_members_count: 1 }
              as: EmploymentSpecialist
            - call: "POST /cases"
              payload: { case_number: "CASE-DV2B", agency_affiliate_code: "AFF-01", household_size: 2, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_b: $.data.id }
            - call: "POST /members"
              payload: { case_id: "${case_b}", full_name: "Adult B", date_of_birth: "1990-01-01", relationship: "PRINCIPAL", work_eligible: true }
              as: CaseManager
            - call: "POST /housing-units"
              payload: { address: "30 Pine Rd", bedrooms: 1 }
              as: HousingCoordinator
              captures: { unit_b: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_b}", housing_unit_id: "${unit_b}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_b: $.data.id }
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_b}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "GET /cases/${case_b}"
              as: EmploymentSpecialist
              captures: { case_b_v: $.data.version }
            - call: "POST /employment-plans"
              payload: { case_id: "${case_b}", expected_case_version: "${case_b_v}" }
              as: EmploymentSpecialist
              captures: { plan_b: $.data.id }
            - call: "PATCH /employment-plans/${plan_b}"
              payload: { monthly_income_cents: 200000, trailing_3m_income_cents: 400000, employed_members_count: 1 }
              as: EmploymentSpecialist
          trigger:
            - call: "POST /employment-plans/${plan_a}/certify"
              payload: { variant: "MONTHLY" }
              as: EmploymentSpecialist
              captures: { plan_a_status: $.data.status, plan_a_ss: $.data.self_sufficient }
            - call: "POST /employment-plans/${plan_b}/certify"
              payload: { variant: "ANNUALIZED" }
              as: EmploymentSpecialist
              captures: { plan_b_status: $.data.status, plan_b_ss: $.data.self_sufficient }
          assert:
            - "EmploymentPlan.${plan_a}.self_sufficient == true (MONTHLY: 200000 - min(200000, 20000) = 180000 >= 130000 + 1*45000 = 175000)"
            - "EmploymentPlan.${plan_a}.status == 'CERTIFIED' and determination_variant == 'MONTHLY' and certified_on == '2026-08-15'"
            - "EmploymentPlan.${plan_b}.self_sufficient == false (ANNUALIZED: 400000 - min(400000, 60000) = 340000 < 3*175000 = 525000)"
            - "EmploymentPlan.${plan_b}.status == 'ACTIVE' and determination_variant == 'ANNUALIZED' and certified_on == null"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: mode (a) tiered + nested-min formula vs
  # mode (b) pinned nested rounding order. DIFFERENT modes.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: self_sufficiency_tiered_threshold_boundary
        grounds:
          - calculations.self_sufficiency_determination
          - entities.EmploymentPlan.fields.monthly_income_cents
          - entities.Case.fields.household_size
        distinguishing_aspect: |
          Mode (a) formula with >= 3 inputs and non-linear interaction:
          household_size selects the tier (T = 130000 + 3*45000 = 265000 for
          size 4), a nested min applies the earned-income disregard, and the
          comparison is inclusive — a case at effective income exactly 265000
          PASSES while 250000 FAILS for the same household size.
        test_recipe:
          setup:
            - "Two cases CASE-CF1P and CASE-CF1Q, each household_size 4 with one work-eligible adult member, READY housing (2-bedroom units), both arrived 2026-08-10"
            - "Each case has an ACTIVE EmploymentPlan; plan P patched to monthly_income_cents 285000, plan Q to monthly_income_cents 270000"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-CF1P", agency_affiliate_code: "AFF-01", household_size: 4, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_p: $.data.id }
            - call: "POST /members"
              payload: { case_id: "${case_p}", full_name: "Adult P", date_of_birth: "1988-03-03", relationship: "PRINCIPAL", work_eligible: true }
              as: CaseManager
            - call: "POST /housing-units"
              payload: { address: "40 Birch Ln", bedrooms: 2 }
              as: HousingCoordinator
              captures: { unit_p: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_p}", housing_unit_id: "${unit_p}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_p: $.data.id }
            - call: "POST /housing-setups/${setup_p}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_p}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_p}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_p}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_p}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_p}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_p}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_p}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "GET /cases/${case_p}"
              as: EmploymentSpecialist
              captures: { case_p_v: $.data.version }
            - call: "POST /employment-plans"
              payload: { case_id: "${case_p}", expected_case_version: "${case_p_v}" }
              as: EmploymentSpecialist
              captures: { plan_p: $.data.id }
            - call: "PATCH /employment-plans/${plan_p}"
              payload: { monthly_income_cents: 285000, employed_members_count: 1 }
              as: EmploymentSpecialist
            - call: "POST /cases"
              payload: { case_number: "CASE-CF1Q", agency_affiliate_code: "AFF-01", household_size: 4, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_q: $.data.id }
            - call: "POST /members"
              payload: { case_id: "${case_q}", full_name: "Adult Q", date_of_birth: "1988-03-03", relationship: "PRINCIPAL", work_eligible: true }
              as: CaseManager
            - call: "POST /housing-units"
              payload: { address: "50 Cedar Ct", bedrooms: 2 }
              as: HousingCoordinator
              captures: { unit_q: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_q}", housing_unit_id: "${unit_q}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_q: $.data.id }
            - call: "POST /housing-setups/${setup_q}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_q}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_q}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_q}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_q}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_q}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_q}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_q}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "GET /cases/${case_q}"
              as: EmploymentSpecialist
              captures: { case_q_v: $.data.version }
            - call: "POST /employment-plans"
              payload: { case_id: "${case_q}", expected_case_version: "${case_q_v}" }
              as: EmploymentSpecialist
              captures: { plan_q: $.data.id }
            - call: "PATCH /employment-plans/${plan_q}"
              payload: { monthly_income_cents: 270000, employed_members_count: 1 }
              as: EmploymentSpecialist
          trigger:
            - call: "POST /employment-plans/${plan_p}/certify"
              payload: { variant: "MONTHLY" }
              as: EmploymentSpecialist
              captures: { plan_p_ss: $.data.self_sufficient, plan_p_status: $.data.status }
            - call: "POST /employment-plans/${plan_q}/certify"
              payload: { variant: "MONTHLY" }
              as: EmploymentSpecialist
              captures: { plan_q_ss: $.data.self_sufficient, plan_q_status: $.data.status }
          assert:
            - "EmploymentPlan.${plan_p}.self_sufficient == true (effective 285000 - 20000 = 265000 >= tier threshold 265000 — inclusive boundary)"
            - "EmploymentPlan.${plan_p}.status == 'CERTIFIED'"
            - "EmploymentPlan.${plan_q}.self_sufficient == false (effective 270000 - 20000 = 250000 < 265000 — the 20000 disregard is decisive)"
            - "EmploymentPlan.${plan_q}.status == 'ACTIVE'"

      - name: report_allocation_per_case_rounding
        grounds:
          - calculations.report_per_capita_allocation
          - entities.FederalReport.fields.per_capita_allocation_cents
          - entities.FederalReport.fields.cases_arrived_count
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order: each case's raw
          allocation 1250000*1*1/12 = 104166.666... rounds half-up to 104167
          BEFORE summing, so two size-1 cases with case_months == 1 total
          208334; the forbidden sum-then-round order yields 208333. The
          scaffold pins round-per-case-then-sum.
        test_recipe:
          setup:
            - "Two cases CASE-CF2A and CASE-CF2B, each household_size 1 with no member records, each with READY housing (0-bedroom units) and actual_arrival_date 2026-12-10"
            - "For a Q4 period [2026-10-01, 2027-01-01) each case has case_months == 1 (only December overlaps [2026-12-10, 2027-01-01))"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-CF2A", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-12-10" }
              as: CaseManager
              captures: { case_a: $.data.id }
            - call: "POST /housing-units"
