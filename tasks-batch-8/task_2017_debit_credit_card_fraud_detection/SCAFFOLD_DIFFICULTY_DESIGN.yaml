  - rule_id: cross_entity_state_dependency
    instances:
      - name: travel_notice_requires_active_account
        grounds:
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - state_machines.TravelNotice
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair = TravelNotice -> Account. Creating a notice on a card of a SUSPENDED
          account is rejected; after reinstate the identical payload succeeds — the card's own
          state never changed, isolating the cross-entity dependency.
        test_recipe:
          setup:
            - "Account with card; account suspended, then (later) reinstated"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-CE1", cardholder_name: "Cross One", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-CE1", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/accounts/${acct}/suspend", as: FraudOpsManager }
          trigger:
            - { call: "POST /fraudops/travel-notices", payload: { card_id: "${card}", region_country: "MX", start_date: "2026-08-10", end_date: "2026-08-20" }, as: FraudAnalyst, captures: { err: "$.data.error_id" } }
            - { call: "POST /fraudops/accounts/${acct}/reinstate", as: FraudOpsManager }
            - { call: "POST /fraudops/travel-notices", payload: { card_id: "${card}", region_country: "MX", start_date: "2026-08-10", end_date: "2026-08-20" }, as: FraudAnalyst, captures: { tn: "$.data.id" } }
          assert:
            - "while SUSPENDED: error == ERR_ACCOUNT_NOT_ACTIVE"
            - "after reinstate: TravelNotice.${tn} created with notice_status == ACTIVE — identical payload, only the Account's state differed"
      - name: unblock_compromised_requires_declined_decision
        grounds:
          - state_machines.Card.SOFT_BLOCKED_to_ACTIVE
          - state_machines.ReissueDecision.PENDING_to_DECLINED
          - state_machines.Card.COMPROMISED_to_WATCH
          - errors[ERR_CARD_COMPROMISED]
        distinguishing_aspect: |
          Entity pair = Card -> ReissueDecision (distinct from TravelNotice -> Account).
          Unblocking a COMPROMISED card is rejected while its reissue decision is PENDING and
          succeeds only after that decision is DECLINED (which downgrades the flag to WATCH).
        test_recipe:
          setup:
            - "Account/card; ruleset active; txn 40000 at M-CE2 inside event window (exposure 40000 <= 50000 so an analyst may decline)"
            - "ADC event confirmed -> card COMPROMISED, ReissueDecision PENDING; card then SOFT_BLOCKED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-CE2", cardholder_name: "Cross Two", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-CE2", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 40000, merchant_id: "M-CE2", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway }
            - { call: "POST /fraudops/compromised-card-events", payload: { network_source: "ADC", event_reference: "ADC-CE2", merchant_id: "M-CE2", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }, as: FraudOpsManager, captures: { ev: "$.data.id" } }
            - { call: "POST /fraudops/compromised-card-events/${ev}/confirm", as: FraudOpsManager }
            - { call: "GET /fraudops/reissue-decisions?card_id=${card}", as: FraudOpsManager, captures: { dec: "$.data[0].id" } }
            - { call: "POST /fraudops/cards/${card}/block", payload: { block_type: "SOFT", reason: "COMPROMISE_EVENT" }, as: FraudAnalyst }
          trigger:
            - { call: "POST /fraudops/cards/${card}/unblock", as: FraudAnalyst, captures: { err: "$.data.error_id" } }
            - { call: "POST /fraudops/reissue-decisions/${dec}/decide", payload: { decision: "DECLINE", rationale: "cardholder verified all transactions; risk accepted" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/cards/${card}/unblock", as: FraudAnalyst }
          assert:
            - "first unblock rejected: error == ERR_CARD_COMPROMISED (decision still PENDING)"
            - "after DECLINE: Card.${card}.fraud_flag == WATCH (risk-accepted downgrade)"
            - "second unblock succeeds: Card.${card}.card_status == ACTIVE and block_reason == null"
            - "ReissueDecision.${dec}.decision == DECLINED"
      - name: loss_finalize_blocked_by_open_chargeback
        grounds:
          - state_machines.LossEntry.BOOKED_to_FINALIZED
          - state_machines.ChargebackCase.PROVISIONAL_CREDIT_POSTED_to_RESOLVED_LOST
          - errors[ERR_CHARGEBACK_PENDING]
        distinguishing_aspect: |
          Entity pair = LossEntry -> ChargebackCase (distinct from the two pairs above).
          Finalizing a loss over a transaction with a PROVISIONAL_CREDIT_POSTED chargeback is
          rejected; resolving that chargeback LOST (terminal) unblocks the identical finalize.
        test_recipe:
          setup:
            - "Account/card (VISA); ruleset active; txn 50000 APPROVE, confirmed FRAUD via manual alert"
            - "Chargeback on the txn with provisional 10000 posted; loss over the txn created (provisional 27500 = round(50000*0.55), tolerance 2750) and booked"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-CE3", cardholder_name: "Cross Three", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-CE3", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 50000, merchant_id: "M-CE3", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { t: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card}", auth_transaction_id: "${t}" }, as: FraudAnalyst, captures: { al: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts/${al}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${al}", channel: "VOICE" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { vc: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${vc}/complete", payload: { outcome: "CONFIRMED_FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${al}/resolve", payload: { resolution: "FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/chargeback-cases", payload: { auth_transaction_id: "${t}", reason_code: "4855", provisional_credit_cents: 10000 }, as: RecoverySpecialist, captures: { cb: "$.data.id" } }
            - { call: "POST /fraudops/chargeback-cases/${cb}/post-provisional-credit", as: RecoverySpecialist }
            - { call: "POST /fraudops/loss-entries", payload: { account_id: "${acct}", transaction_ids: ["${t}"] }, as: LossAccountant, captures: { loss: "$.data.id" } }
            - { call: "POST /fraudops/loss-entries/${loss}/book", as: LossAccountant, as_user_id: "acct-1" }
          trigger:
            - { call: "POST /fraudops/loss-entries/${loss}/finalize", payload: { final_amount_cents: 27500 }, as: LossAccountant, as_user_id: "acct-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /fraudops/chargeback-cases/${cb}/resolve", payload: { outcome: "LOST" }, as: RecoverySpecialist }
            - { call: "POST /fraudops/loss-entries/${loss}/finalize", payload: { final_amount_cents: 27500 }, as: LossAccountant, as_user_id: "acct-1" }
          assert:
            - "first finalize rejected: error == ERR_CHARGEBACK_PENDING (chargeback in PROVISIONAL_CREDIT_POSTED)"
            - "after chargeback RESOLVED_LOST: finalize succeeds, LossEntry.${loss}.loss_status == FINALIZED, final_amount_cents == 27500"
            - "LossEntry.${loss}.outstanding_cents == 27500"

  - rule_id: resource_temporal_overlap
    instances:
      - name: travel_notice_half_open_overlap
        grounds:
          - state_machines.TravelNotice
          - validations[priority=9]
          - errors[ERR_TRAVEL_NOTICE_OVERLAP]
          - endpoints["POST /fraudops/travel-notices"]
        distinguishing_aspect: |
          Resource = Card; semantics = half-open date intervals per (card, region): intervals
          sharing only a boundary instant ([08-05,08-10) vs [08-10,08-20)) do NOT collide, a
          one-day interior overlap does, and an overlapping date range in a DIFFERENT region
          does not collide.
        test_recipe:
          setup:
            - "Account (ACTIVE) with card; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-TO1", cardholder_name: "Tee One", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-TO1", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
          trigger:
            - { call: "POST /fraudops/travel-notices", payload: { card_id: "${card}", region_country: "MX", start_date: "2026-08-10", end_date: "2026-08-20" }, as: FraudAnalyst, captures: { n1: "$.data.id" } }
            - { call: "POST /fraudops/travel-notices", payload: { card_id: "${card}", region_country: "MX", start_date: "2026-08-05", end_date: "2026-08-10" }, as: FraudAnalyst, captures: { n2: "$.data.id" } }
            - { call: "POST /fraudops/travel-notices", payload: { card_id: "${card}", region_country: "MX", start_date: "2026-08-19", end_date: "2026-08-21" }, as: FraudAnalyst, captures: { err: "$.data.error_id" } }
            - { call: "POST /fraudops/travel-notices", payload: { card_id: "${card}", region_country: "JP", start_date: "2026-08-15", end_date: "2026-08-18" }, as: FraudAnalyst, captures: { n4: "$.data.id" } }
          assert:
            - "N1 [08-10,08-20) MX and N2 [08-05,08-10) MX both ACTIVE — touching at 08-10 is NOT an overlap under half-open semantics"
            - "N3 [08-19,08-21) MX rejected: error == ERR_TRAVEL_NOTICE_OVERLAP (one interior day shared with N1)"
            - "N4 [08-15,08-18) JP created ACTIVE — same dates, different region, no collision"
            - "GET /fraudops/cards/${card}/travel-notices returns exactly 3 ACTIVE notices (${n1}, ${n2}, ${n4})"
      - name: contact_buffer_gap_on_account
        grounds:
          - validations[priority=9]
          - errors[ERR_CONTACT_TOO_SOON]
          - endpoints["POST /fraudops/verification-contacts"]
        distinguishing_aspect: |
          Resource = Account; semantics = minimum-gap buffer (>= 60 minutes between any two
          contacts on the account), NOT half-open adjacency: a contact for alert A2 is rejected
          purely because alert A1 (same account, different alert) was contacted 30 minutes ago.
          Distinct resource and interval semantics from the travel-notice rule.
        test_recipe:
          setup:
            - "Account with card and two claimed MANUAL alerts A1, A2 (both assigned to analyst-1)"
            - "Contact on A1 at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-TO2", cardholder_name: "Tee Two", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-TO2", product_type: "DEBIT", network: "MASTERCARD" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card}" }, as: FraudAnalyst, captures: { a1: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card}" }, as: FraudAnalyst, captures: { a2: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts/${a1}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${a2}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${a1}", channel: "VOICE" }, as: FraudAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:30:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${a2}", channel: "SMS" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${a2}", channel: "SMS" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { c2: "$.data.id" } }
          assert:
            - "A2 contact at +30 min rejected: error == ERR_CONTACT_TOO_SOON — the buffer occupies the ACCOUNT, not the alert"
            - "A2 contact at +60 min succeeds: VerificationContact.${c2} PENDING; FraudAlert.${a2}.alert_status == CONTACT_PENDING"

  - rule_id: compensating_invariant
    instances:
      - name: chargeback_credit_post_and_reversal_conserve_balance
        grounds:
          - calculations.account_credit_balance
          - state_machines.ChargebackCase.FILED_to_PROVISIONAL_CREDIT_POSTED
          - state_machines.ChargebackCase.PROVISIONAL_CREDIT_POSTED_to_RESOLVED_LOST
        distinguishing_aspect: |
          Conserved quantity = customer credit ledger (Account.credit_balance_cents), pinned by
          INV-CREDIT. The pair post-provisional-credit / resolve LOST must leave the balance
          exactly as before the pair (0 -> 15000 -> 0).
        test_recipe:
          setup:
            - "Account/card; ruleset active; txn 40000 APPROVE; chargeback filed with provisional 15000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-CI1", cardholder_name: "Con One", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-CI1", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 40000, merchant_id: "M-CI1", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { t: "$.data.id" } }
            - { call: "POST /fraudops/chargeback-cases", payload: { auth_transaction_id: "${t}", reason_code: "4855", provisional_credit_cents: 15000 }, as: RecoverySpecialist, captures: { cb: "$.data.id" } }
          trigger:
            - { call: "POST /fraudops/chargeback-cases/${cb}/post-provisional-credit", as: RecoverySpecialist }
            - { call: "GET /fraudops/accounts/${acct}", as: FraudOpsManager, captures: { bal_mid: "$.data.credit_balance_cents" } }
            - { call: "POST /fraudops/chargeback-cases/${cb}/representment", as: RecoverySpecialist }
            - { call: "POST /fraudops/chargeback-cases/${cb}/resolve", payload: { outcome: "LOST" }, as: RecoverySpecialist }
            - { call: "GET /fraudops/accounts/${acct}", as: FraudOpsManager, captures: { bal_end: "$.data.credit_balance_cents" } }
          assert:
            - "after posting: Account.${acct}.credit_balance_cents == 15000"
            - "after resolve LOST: Account.${acct}.credit_balance_cents == 0 — the compensating pair conserves the ledger (INV-CREDIT: 0 drift)"
            - "ChargebackCase.${cb}.cb_status == RESOLVED_LOST"
      - name: recovery_paid_and_reversed_conserve_outstanding
        grounds:
          - calculations.loss_outstanding
          - state_machines.RecoveryFiling.ACCEPTED_to_PAID
          - state_machines.RecoveryFiling.PAID_to_REVERSED
          - state_machines.LossEntry.PARTIALLY_RECOVERED_to_FINALIZED
        distinguishing_aspect: |
          Conserved quantity = issuer loss ledger (LossEntry.outstanding_cents), pinned by
          INV-LOSS — a different conserved quantity from the customer credit ledger above. The
          pair mark PAID 40000 / mark REVERSED must restore outstanding to exactly 110000 and
          return the loss status to FINALIZED.
        test_recipe:
          setup:
            - "Account/card (VISA); ruleset active; txn 200000 CNP US REVIEW -> confirmed FRAUD via the auto alert"
            - "Loss booked by acct-1 and finalized at 110000 (provisional 110000, tolerance 11000); filing NR-CI2 claimed 110000 by rec-1, ACCEPTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-CI2", cardholder_name: "Con Two", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-CI2", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 200000, merchant_id: "M-CI2", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { t: "$.data.id" } }
            - { call: "GET /fraudops/fraud-alerts?auth_transaction_id=${t}", as: FraudOpsManager, captures: { al: "$.data[0].id" } }
            - { call: "POST /fraudops/fraud-alerts/${al}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${al}", channel: "VOICE" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { vc: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${vc}/complete", payload: { outcome: "CONFIRMED_FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${al}/resolve", payload: { resolution: "FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/loss-entries", payload: { account_id: "${acct}", transaction_ids: ["${t}"] }, as: LossAccountant, captures: { loss: "$.data.id" } }
            - { call: "POST /fraudops/loss-entries/${loss}/book", as: LossAccountant, as_user_id: "acct-1" }
            - { call: "POST /fraudops/loss-entries/${loss}/finalize", payload: { final_amount_cents: 110000 }, as: LossAccountant, as_user_id: "acct-1" }
            - { call: "POST /fraudops/recovery-filings", payload: { loss_entry_id: "${loss}", network_reference: "NR-CI2", claimed_cents: 110000 }, as: RecoverySpecialist, as_user_id: "rec-1", captures: { fil: "$.data.id" } }
            - { call: "POST /fraudops/recovery-filings/${fil}/mark-outcome", payload: { outcome: "ACCEPTED" }, as: RecoverySpecialist }
          trigger:
            - { call: "POST /fraudops/recovery-filings/${fil}/mark-outcome", payload: { outcome: "PAID", paid_cents: 40000 }, as: RecoverySpecialist }
            - { call: "GET /fraudops/loss-entries/${loss}", as: FraudOpsManager, captures: { out_mid: "$.data.outstanding_cents", st_mid: "$.data.loss_status" } }
            - { call: "POST /fraudops/recovery-filings/${fil}/mark-outcome", payload: { outcome: "REVERSED" }, as: RecoverySpecialist }
            - { call: "GET /fraudops/loss-entries/${loss}", as: FraudOpsManager }
          assert:
            - "after PAID 40000: outstanding_cents == 70000 and loss_status == PARTIALLY_RECOVERED"
            - "after REVERSED: LossEntry.${loss}.outstanding_cents == 110000 and loss_status == FINALIZED — PAID+REVERSED conserves outstanding (INV-LOSS: 0 drift)"
            - "RecoveryFiling.${fil}.filing_status == REVERSED"
