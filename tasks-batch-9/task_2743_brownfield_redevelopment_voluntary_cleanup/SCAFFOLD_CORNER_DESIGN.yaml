      - name: corner_calc_per_line_rounding_precision
        claim_type: precision
        grounds:
          - calculations.remediation_cost_estimate.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / per_line_rounding_before_sum_pins_direct_cost_cents
          rationale: "The §1.8 instance already pins the per-line ROUND_HALF_UP order against the round-once-at-the-end alternative on the two 4325-cent lines."

      - name: corner_calc_design_vs_underwriting_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.remediation_cost_estimate.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / cost_estimate_design_vs_underwriting_basis_diverge
          rationale: "The §1.8 instance computes both variants from identical cost lines and asserts the exact delta."

      - name: corner_calc_premium_rate_tier_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.cost_cap_premium.constants.RATE_TIER_LOW_RATIO
          - calculations.cost_cap_premium.constants.RATE_TIER_MID_RATIO
        excluded_because:
          difficulty_instance: combinatorial_formula / premium_rate_tier_ladder_selects_three_distinct_rates
          rationale: "The §1.8 instance drives three plans across the 0.35 and 0.60 limit_ratio boundaries and asserts all three rate_applied values."

      - name: corner_calc_waterfall_fill_order_and_remainder
        claim_type: waterfall_allocation
        grounds:
          - calculations.funding_assembly_waterfall.formula
        excluded_because:
          difficulty_instance: compensating_invariant / funding_rescind_conserves_total_funding_need_cents
          rationale: "The §1.8 instance asserts priority fill order, the remainder clamp on the last award and the conserved sum(allocated) + gap == need before and after a rescission."

      - name: corner_calc_compliance_threshold_boundary
        claim_type: threshold
        grounds:
          - calculations.bfpp_compliance.constants.COMPLIANCE_THRESHOLD
        excluded_because:
          difficulty_instance: boundary_precision_check / compliance_pct_exactly_at_threshold_returns_to_current
          rationale: "The §1.8 instance asserts 0.8500 inclusive at the boundary and the AT_RISK outcome just below it."

      - name: corner_calc_attainment_inclusive_comparison
        claim_type: correct_result
        grounds:
          - calculations.goal_attainment_streak.formula
        excluded_because:
          difficulty_instance: boundary_precision_check / monitoring_result_equal_to_goal_extends_streak_one_cent_over_resets
          rationale: "The §1.8 instance covers the inclusive <= comparison at goal_ugl and the reset one increment above it."

  # ===========================================================================
  # §1.4 Validations
  # ===========================================================================
  - section: validations
    instances:

      - name: request_missing_x_user_id_returns_unauthenticated_before_not_found
        claim_type: priority_ordering
        grounds:
          - validations[1].ERR_UNAUTHENTICATED
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 outranks every later rule: a request with a blank X-User-ID, an unknown path id and a malformed body returns HTTP 401 ERR_UNAUTHENTICATED — not ERR_SITE_NOT_FOUND and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Clock 2026-08-01; one REDEVELOPER party registered."
          setup_api_calls:
            - *c_clock0
            - *c_redev
          trigger:
            - call: "POST /sites/00000000-0000-4000-8000-0000000000ff/cleanup-goals"
              payload: { contaminant_code: "TCE", media: "PLASMA", screening_level_ugl: -3, basis: UNRESTRICTED }
              as: Redeveloper
              as_user_id: ""
              captures: { unauth_err: $.data.error_id, unauth_msg: $.data.message }
          assert:
            - "HTTP 401 with error_id ${unauth_err} == 'ERR_UNAUTHENTICATED'"
            - "the response is the §1.0 error envelope with a non-empty message ${unauth_msg}"
            - "no CleanupGoal row is created"

      - name: wrong_role_returns_forbidden_role_before_invalid_request
        claim_type: priority_ordering
        grounds:
          - validations[2].ERR_FORBIDDEN_ROLE
          - validations[3].ERR_INVALID_REQUEST
          - rbac.ProgramAdmin.exclusive_operations
        distinguishing_aspect: "Priority 2 precedes priority 3: a Redeveloper posting a party with an invalid party_type enum and no legal_name gets HTTP 403 ERR_FORBIDDEN_ROLE, because POST /parties lists only ProgramAdmin — the body is never inspected."
        test_recipe:
          setup:
            - "Clock 2026-08-01; one REDEVELOPER party registered."
          setup_api_calls:
            - *c_clock0
            - *c_redev
          trigger:
            - call: "POST /parties"
              payload: { party_type: "MUNICIPALITY", state_code: "Ohio" }
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { role_err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ${role_err} == 'ERR_FORBIDDEN_ROLE' (not 'ERR_INVALID_REQUEST')"
            - "GET /parties as ProgramAdmin still reports total_count == 1"

      - name: malformed_enum_returns_invalid_request_before_site_not_found
        claim_type: priority_ordering
        grounds:
          - validations[3].ERR_INVALID_REQUEST
          - validations[4].ERR_SITE_NOT_FOUND
        distinguishing_aspect: "Priority 3 precedes priority 4: posting a cleanup goal under a non-existent site id with an invalid media enum returns HTTP 422 ERR_INVALID_REQUEST rather than HTTP 404 ERR_SITE_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock 2026-08-01; one REDEVELOPER party registered."
          setup_api_calls:
            - *c_clock0
            - *c_redev
          trigger:
            - call: "POST /sites/00000000-0000-4000-8000-0000000000ff/cleanup-goals"
              payload: { contaminant_code: "TCE", media: "PLASMA", screening_level_ugl: 5.0, basis: UNRESTRICTED }
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { shape_err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id ${shape_err} == 'ERR_INVALID_REQUEST'"
            - "a follow-up with media SOIL_VAPOR against the same unknown site id returns HTTP 404 'ERR_SITE_NOT_FOUND', proving both rules are reachable"

      - name: unknown_path_id_returns_protection_not_found_before_body_fk
        claim_type: priority_ordering
        grounds:
          - validations[4].ERR_PROTECTION_NOT_FOUND
          - validations[5].ERR_PHASE_NOT_FOUND
        distinguishing_aspect: "Priority 4 (path ids) precedes priority 5 (body foreign keys): an inquiry completion against an unknown protection id whose aai_phase_id is also unknown returns HTTP 404 ERR_PROTECTION_NOT_FOUND, never ERR_PHASE_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock 2026-08-01; parties and site created; no liability protection opened."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_site
          trigger:
            - call: "POST /liability-protections/00000000-0000-4000-8000-0000000000aa/inquiry-completion"
              payload: { aai_phase_id: "00000000-0000-4000-8000-0000000000bb" }
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { path_err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ${path_err} == 'ERR_PROTECTION_NOT_FOUND'"

      - name: multiple_unknown_body_fks_return_site_not_found_first
        claim_type: cascading_validation
        grounds:
          - validations[5].ERR_SITE_NOT_FOUND
          - validations[5].ERR_LAB_NOT_FOUND
          - endpoints[POST /monitoring-events].input
        distinguishing_aspect: "Priority 5 resolves body foreign keys in the order the endpoint declares them: with site_id, laboratory_id and cleanup_goal_id all unknown the answer is ERR_SITE_NOT_FOUND; with a real site but an unknown laboratory_id and cleanup_goal_id it becomes ERR_LAB_NOT_FOUND — the later key never short-circuits the earlier one."
        test_recipe:
          setup:
            - "Clock 2026-08-01; parties, laboratory and site created."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_lab
            - *c_site
          trigger:
            - call: "POST /monitoring-events"
              payload: { site_id: "00000000-0000-4000-8000-0000000000c1", laboratory_id: "00000000-0000-4000-8000-0000000000c2", cleanup_goal_id: "00000000-0000-4000-8000-0000000000c3", event_type: SAMPLING, monitoring_period_code: "2027-M01", sample_date: "2027-01-05", window_start: "2027-01-01", window_end: "2027-01-10" }
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { fk1_err: $.data.error_id }
            - call: "POST /monitoring-events"
              payload: { site_id: "${site_id}", laboratory_id: "00000000-0000-4000-8000-0000000000c2", cleanup_goal_id: "00000000-0000-4000-8000-0000000000c3", event_type: SAMPLING, monitoring_period_code: "2027-M01", sample_date: "2027-01-05", window_start: "2027-01-01", window_end: "2027-01-10" }
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { fk2_err: $.data.error_id }
          assert:
            - "the first call returns HTTP 404 with error_id ${fk1_err} == 'ERR_SITE_NOT_FOUND'"
            - "the second call returns HTTP 404 with error_id ${fk2_err} == 'ERR_LAB_NOT_FOUND' (the cleanup_goal_id is checked only after the laboratory_id)"
            - "no MonitoringEvent row exists"

      - name: site_owner_party_must_be_a_redeveloper
        claim_type: violation_to_error
        grounds:
          - validations[8].ERR_PARTY_TYPE_MISMATCH
          - errors[ERR_PARTY_TYPE_MISMATCH]
        distinguishing_aspect: "Priority 8 is a typed-slot check that runs after existence: naming an existing CONSULTANT party as Site.owner_party_id returns HTTP 422 ERR_PARTY_TYPE_MISMATCH (not 404 and not ERR_INVALID_REQUEST), while the same body with the REDEVELOPER party succeeds."
        test_recipe:
          setup:
            - "Clock 2026-08-01; one REDEVELOPER and one CONSULTANT party registered."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
          trigger:
            - call: "POST /sites"
              payload:
                owner_party_id: "${consult_id}"
                site_name: "Wrong Owner Parcel"
                county_code: "OH-049"
                acreage: 2.0
                intended_reuse: COMMERCIAL
                planned_acquisition_date: "2026-11-15"
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { type_err: $.data.error_id }
            - *c_site
          assert:
            - "the first call returns HTTP 422 with error_id ${type_err} == 'ERR_PARTY_TYPE_MISMATCH'"
            - "the second call with owner_party_id ${redev_id} returns HTTP 201, so the rule is not blanket-rejecting creates"

      - name: void_certification_by_the_imposing_reviewer_rejected
        claim_type: violation_to_error
        grounds:
          - validations[7].ERR_SEGREGATION_OF_DUTIES
          - state_machines.ContinuingObligation.SATISFIED_to_CURRENT
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Priority 7 compares the acting X-User-ID with ContinuingObligation.imposed_by_user_id: reviewer-alpha, who imposed the obligation, gets HTTP 403 ERR_SEGREGATION_OF_DUTIES, while reviewer-beta's identical request succeeds and restores due_date 2027-03-01 with certification_count back to 0."
        test_recipe:
          setup:
            - "Clock 2026-08-01 then 2026-10-15 for acquisition; AAI complete so bfpp_status is ESTABLISHED."
            - "One REASONABLE_STEPS obligation imposed by reviewer-alpha with due_date 2027-03-01 and recurrence 90, then certified by the owner at clock date 2026-10-15."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_site
            - *c_prot
            - *c_p1
            - *c_p1f
            - *c_p1sub
            - *c_p1app
            - *c_inq
            - *c_clock_acq
            - *c_acq
            - *c_ob_rs
            - &c_certify_rs
              call: "POST /continuing-obligations/${ob_rs_id}/certify"
              payload: {}
              as: Redeveloper
              as_user_id: "${redev_id}"
          trigger:
