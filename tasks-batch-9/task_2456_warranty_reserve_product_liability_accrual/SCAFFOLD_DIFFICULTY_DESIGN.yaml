# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2456 — Warranty Reserve & Product Liability Accrual
# Nine §0.5 rule blocks, two differentiated instances each (18 instances total).
# Every numeric assert literal below was computed by executing the corresponding
# calculations[].formula with its constants:.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: warranty_accrual_historical_rate_vs_analog_blend_on_same_vintage
        grounds:
          - calculations.warranty_accrual_amount
          - entities.WarrantyAccrual.fields.method
          - entities.WarrantyAccrual.fields.accrued_amount_cents
          - entities.WarrantyAccrual.fields.expected_claim_rate_ppm
          - entities.WarrantyAccrual.fields.cost_per_claim_basis_cents
          - entities.ProductFamily.fields.analog_family_id
          - entities.ProductFamily.fields.engineering_estimate_rate_ppm
          - state_machines.WarrantyAccrual.null_to_DRAFT
        distinguishing_aspect: |
          This instance's dual variant lives on the WarrantyAccrual / ProductVintage
          cost-accounting domain: HISTORICAL_RATE prices each FailureMode separately at
          FailureMode.cost_per_claim_cents from the vintage's own observed frequency,
          while ANALOG_BLEND prices every claim at ProductFamily.standard_cost_per_claim_cents
          from a 60/40 engineering-estimate/analog blend, so the SAME vintage with the SAME
          observations yields accrued_amount_cents 3100000 versus 5870000.
        test_recipe:
          setup:
            - "Three OPEN AccrualPeriods exist: 2026-Q2 (the coding period for every claim observation), 2026-Q3 and 2026-Q4, each at version 1."
            - "ProductFamily FAM-A is the analogous predecessor: one EXPIRED vintage of 10000 units carrying 300 observed claims, so its observed lifetime rate develops to 75000 ppm."
            - "ProductFamily FAM-B carries analog_family_id = FAM-A, engineering_estimate_rate_ppm = 4000 and standard_cost_per_claim_cents = 30000."
            - "FAM-B has one ACTIVE vintage of 8000 units, two failure modes (FM-COMP at 25000 cents, FM-SEAL at 10000 cents) and observations of 40 and 100 claims in the [0,12) bucket, so FAM-B.history_maturity_status == MATURE and both variants are legal on identical data."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q2", period_start_date: "2026-04-01", period_end_date: "2026-06-30" }
              as: ReserveController
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { p3_id: $.data.id, p3_ver: $.data.version }
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q4", period_start_date: "2026-10-01", period_end_date: "2026-12-31" }
              as: ReserveController
              captures: { p4_id: $.data.id, p4_ver: $.data.version }
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-A", name: "Legacy Compressor Platform", launch_date: "2022-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 20000, reserve_cap_cents: 100000000 }
              as: WarrantyAnalyst
              captures: { fam_a_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_a_id}", vintage_code: "A-MY2022", units_shipped: 10000, ship_period_code: "2022-Q1", warranty_expiry_date: "2025-12-31" }
              as: WarrantyAnalyst
              captures: { vin_a_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_a_id}", mode_code: "FM-A-CORE", description: "Legacy compressor core wear", severity: "FUNCTIONAL", cost_per_claim_cents: 20000 }
              as: WarrantyAnalyst
              captures: { fm_a_id: $.data.id }
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_a_id}", failure_mode_id: "${fm_a_id}", observation_period_code: "2026-Q2", months_in_service_from: 0, months_in_service_to: 24, claim_count: 300, paid_cost_cents: 6000000 }
              as: WarrantyAnalyst
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-B", name: "Next Gen Compressor Platform", launch_date: "2024-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 30000, reserve_cap_cents: 10000000, engineering_estimate_rate_ppm: 4000, analog_family_id: "${fam_a_id}" }
              as: WarrantyAnalyst
              captures: { fam_b_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_b_id}", vintage_code: "B-MY2024", units_shipped: 8000, ship_period_code: "2024-Q1", warranty_expiry_date: "2028-12-31" }
              as: WarrantyAnalyst
              captures: { vin_b_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_b_id}", mode_code: "FM-COMP", description: "Compressor valve plate fracture", severity: "FUNCTIONAL", cost_per_claim_cents: 25000 }
              as: WarrantyAnalyst
              captures: { fm_comp_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_b_id}", mode_code: "FM-SEAL", description: "Door seal cosmetic delamination", severity: "COSMETIC", cost_per_claim_cents: 10000 }
              as: WarrantyAnalyst
              captures: { fm_seal_id: $.data.id }
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_b_id}", failure_mode_id: "${fm_comp_id}", observation_period_code: "2026-Q2", months_in_service_from: 0, months_in_service_to: 12, claim_count: 40, paid_cost_cents: 1000000 }
              as: WarrantyAnalyst
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_b_id}", failure_mode_id: "${fm_seal_id}", observation_period_code: "2026-Q2", months_in_service_from: 0, months_in_service_to: 12, claim_count: 100, paid_cost_cents: 900000 }
              as: WarrantyAnalyst
          trigger:
            - call: "POST /warranty/accruals"
              payload: { period_id: "${p3_id}", vintage_id: "${vin_b_id}", method: "HISTORICAL_RATE", elapsed_exposure_bps: 4000, expected_period_version: "${p3_ver}" }
              as: WarrantyAnalyst
              as_user_id: "ua-1"
              captures: { acc_hist_id: $.data.id }
            - call: "POST /warranty/accruals"
              payload: { period_id: "${p4_id}", vintage_id: "${vin_b_id}", method: "ANALOG_BLEND", elapsed_exposure_bps: 4000, expected_period_version: "${p4_ver}" }
              as: WarrantyAnalyst
              as_user_id: "ua-1"
              captures: { acc_analog_id: $.data.id }
          assert:
            - "WarrantyAccrual.${acc_hist_id}.accrued_amount_cents == 3100000"
            - "WarrantyAccrual.${acc_hist_id}.expected_claim_rate_ppm == 17500"
            - "WarrantyAccrual.${acc_hist_id}.cost_per_claim_basis_cents == 14286"
            - "WarrantyAccrual.${acc_hist_id}.paid_to_date_cents == 1900000"
            - "WarrantyAccrual.${acc_analog_id}.accrued_amount_cents == 5870000"
            - "WarrantyAccrual.${acc_analog_id}.expected_claim_rate_ppm == 32400"
            - "WarrantyAccrual.${acc_analog_id}.cost_per_claim_basis_cents == 30000"
            - "WarrantyAccrual.${acc_analog_id}.paid_to_date_cents == 1900000"
            - "WarrantyAccrual.${acc_analog_id}.accrued_amount_cents - WarrantyAccrual.${acc_hist_id}.accrued_amount_cents == 2770000"
            - "WarrantyAccrual.${acc_hist_id}.status == DRAFT and WarrantyAccrual.${acc_analog_id}.status == DRAFT"

      - name: supplier_recovery_expected_value_vs_contractual_floor_valuation
        grounds:
          - calculations.supplier_recovery_recognized
          - entities.SupplierRecovery.fields.valuation_variant
          - entities.SupplierRecovery.fields.recognized_recovery_cents
          - entities.Supplier.fields.collectability_rating
          - state_machines.SupplierRecovery.DRAFT_to_ASSERTED
          - state_machines.SupplierRecovery.ASSERTED_to_SETTLED
        distinguishing_aspect: |
          This instance's dual variant lives on the Supplier / SupplierRecovery
          counterparty-credit domain rather than on product cost accounting:
          EXPECTED_VALUE probability-weights asserted_amount_cents 4000000 by the
          supplier's HIGH collectability (9000 bps) to 3600000, while CONTRACTUAL_FLOOR
          drops the weighting entirely and books the agreed settled_amount_cents 2500000
          — a -1100000 cent swing on an unchanged claim.
        test_recipe:
          setup:
            - "One OPEN AccrualPeriod 2026-Q3 exists so the settlement has a booking period."
            - "Supplier SUP-1 has credit_rating AAA, zero closed recoveries and therefore collectability_rating HIGH, annual_purchase_volume_cents 500000000 and contractual_recovery_cap_bps 2000, so its per-recovery cap is 100000000 cents and never binds."
            - "ProductFamily FAM-S has failure mode FM-S-CTRL whose supplier_id is SUP-1."
            - "SupplierRecovery for 4000000 cents exists in status ASSERTED, valued under EXPECTED_VALUE."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { p3_id: $.data.id }
            - call: "POST /warranty/suppliers"
              payload: { supplier_code: "SUP-1", name: "Meridian Controls Ltd", credit_rating: "AAA", annual_purchase_volume_cents: 500000000, contractual_recovery_cap_bps: 2000 }
              as: WarrantyAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-S", name: "Smart Control Range", launch_date: "2023-01-01", base_warranty_months: 24, standard_cost_per_claim_cents: 15000, reserve_cap_cents: 50000000 }
              as: WarrantyAnalyst
              captures: { fam_s_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_s_id}", mode_code: "FM-S-CTRL", description: "Supplied controller board solder crack", severity: "FUNCTIONAL", cost_per_claim_cents: 15000, supplier_id: "${sup_id}" }
              as: WarrantyAnalyst
              captures: { fm_s_id: $.data.id }
            - call: "POST /warranty/supplier-recoveries"
              payload: { supplier_id: "${sup_id}", failure_mode_id: "${fm_s_id}", asserted_amount_cents: 4000000 }
              as: WarrantyAnalyst
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /warranty/supplier-recoveries/${rec_id}/assert"
              payload: {}
              as: WarrantyAnalyst
            - call: "POST /warranty/supplier-recoveries/${rec_id}/close"
              payload: { outcome: "SETTLED", settled_amount_cents: 2500000 }
              as: ReserveController
          assert:
            - "In the response of the first trigger call: SupplierRecovery.${rec_id}.recognized_recovery_cents == 3600000, valuation_variant == EXPECTED_VALUE, collectability_rating_at_valuation == HIGH, status == ASSERTED, assert_count == 1"
            - "In the response of the second trigger call: SupplierRecovery.${rec_id}.recognized_recovery_cents == 2500000, valuation_variant == CONTRACTUAL_FLOOR, settled_amount_cents == 2500000, status == SETTLED"
            - "SupplierRecovery.${rec_id}.settled_period_id == ${p3_id}"
            - "Supplier.${sup_id}.gross_asserted_recovery_cents == 4000000"
            - "Supplier.${sup_id}.realized_recovery_cents == 2500000"
            - "Supplier.${sup_id}.open_recovery_asset_cents == 0"
            - "Supplier.${sup_id}.closed_recovery_count == 1"
            - "Supplier.${sup_id}.realization_bps == 10000 and Supplier.${sup_id}.collectability_rating == HIGH"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: field_action_accrual_rounds_per_unit_before_multiplying_by_population
        grounds:
          - calculations.field_action_specific_accrual
          - entities.RemedyOption.fields.per_unit_expected_cents
          - entities.FieldAction.fields.specific_accrual_cents
          - state_machines.FieldAction.DRAFT_to_DRAFT
        distinguishing_aspect: |
          §0.5 mode (b) — nested rounding whose ORDER is observable: the scaffold pins
          round-per-unit-then-multiply, so parts 4200 + labor round(150*9500/100)=14250 +
          admin 800 = 19250 gross weighted by 6500 bps rounds half-up to 12513 per unit and
          12513 * 12000 units == 150156000, whereas the sum-then-round order would yield
          150150000 — a 6000 cent gap that pins which order the implementation used.
        test_recipe:
          setup:
            - "ProductFamily FAM-K exists with a DRAFT SERVICE_CAMPAIGN field action covering 12000 units."
            - "The field action has exactly one engineering-approved PERMANENT_REPAIR remedy option priced at parts 4200, labor 150 centi-hours, admin 800, take rate 6500 bps."
            - "The field action is at version 1 and selected_remedy_option_id is still null."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-K", name: "Compact Chest Freezer", launch_date: "2024-03-01", base_warranty_months: 24, standard_cost_per_claim_cents: 18000, reserve_cap_cents: 400000000 }
              as: WarrantyAnalyst
              captures: { fam_k_id: $.data.id }
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_k_id}", action_code: "FA-K-01", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-01-01", affected_build_end_date: "2025-03-31", affected_unit_count: 12000, regulatory_notice_filed: false }
              as: QualityEngineer
              captures: { fa_k_id: $.data.id, fa_k_ver: $.data.version }
            - call: "POST /warranty/field-actions/${fa_k_id}/remedy-options"
              payload: { option_code: "OPT-PERM", remedy_class: "PERMANENT_REPAIR", parts_cost_cents: 4200, labor_hours_centi: 150, admin_cost_cents: 800, expected_take_rate_bps: 6500, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_k_id: $.data.id }
          trigger:
            - call: "POST /warranty/field-actions/${fa_k_id}/select-remedy"
              payload: { expected_field_action_version: "${fa_k_ver}", remedy_option_id: "${opt_k_id}" }
              as: QualityEngineer
          assert:
            - "RemedyOption.${opt_k_id}.per_unit_expected_cents == 12513"
            - "FieldAction.${fa_k_id}.specific_accrual_cents == 150156000"
            - "FieldAction.${fa_k_id}.specific_accrual_cents != 150150000"
            - "FieldAction.${fa_k_id}.selected_remedy_option_id == ${opt_k_id}"
            - "FieldAction.${fa_k_id}.version == 2"
            - "FieldAction.${fa_k_id}.approval_state == DRAFT and FieldAction.${fa_k_id}.execution_state == NOT_STARTED"

      - name: adequacy_review_pins_trend_tier_against_pre_true_up_base_snapshot
        grounds:
          - calculations.adequacy_trend_adjustment
          - calculations.family_reserve_balance
          - entities.AdequacyReview.fields.ave_ratio_bps
          - entities.AdequacyReview.fields.trend_adjustment_bps
          - entities.AdequacyReview.fields.recommended_true_up_cents
          - entities.AdequacyReview.fields.true_up_applied
        distinguishing_aspect: |
          §0.5 mode (c) — an apparent circularity with a pinned evaluation order: the trend
          tier is selected in STEP 4 from the STEP 3 ratio measured against the PRE-true-up
          posted-accrual base (1900000/1240000 == 15323 bps, above the 15000 bps tier
          boundary, so trend_adjustment_bps == 3000), and applying the resulting 1218000
          true-up moves ProductFamily.warranty_reserve_balance_cents to 4318000 WITHOUT
          re-running STEPS 1-7 on the review row, whose fields stay frozen at their creation
          values.
        test_recipe:
          setup:
            - "AccrualPeriods 2026-Q2 (OPEN, the coding period of every observation) and 2026-Q3 (ANALYSIS_LOCKED) exist."
            - "ProductFamily FAM-Z has reserve_cap_cents 10000000, one ACTIVE vintage of 8000 units, failure modes FM-Z-A (25000 cents) and FM-Z-B (10000 cents), and observations of 40 and 100 claims paid 1000000 and 900000 in the [0,12) bucket, so FAM-Z is MATURE."
            - "One HISTORICAL_RATE accrual for that vintage in 2026-Q3 with elapsed_exposure_bps 4000 has been proposed by user ua-1 and POSTED by user urc-1, so accrued_amount_cents == 3100000 and FAM-Z.warranty_reserve_balance_cents == 3100000."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q2", period_start_date: "2026-04-01", period_end_date: "2026-06-30" }
              as: ReserveController
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { pz_id: $.data.id, pz_ver: $.data.version }
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-Z", name: "Upright Freezer Platform", launch_date: "2024-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 20000, reserve_cap_cents: 10000000 }
              as: WarrantyAnalyst
              captures: { fam_z_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_z_id}", vintage_code: "Z-MY2024", units_shipped: 8000, ship_period_code: "2024-Q1", warranty_expiry_date: "2028-12-31" }
              as: WarrantyAnalyst
              captures: { vin_z_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_z_id}", mode_code: "FM-Z-A", description: "Evaporator leak", severity: "FUNCTIONAL", cost_per_claim_cents: 25000 }
              as: WarrantyAnalyst
              captures: { fm_za_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_z_id}", mode_code: "FM-Z-B", description: "Handle trim discolouration", severity: "COSMETIC", cost_per_claim_cents: 10000 }
              as: WarrantyAnalyst
              captures: { fm_zb_id: $.data.id }
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_z_id}", failure_mode_id: "${fm_za_id}", observation_period_code: "2026-Q2", months_in_service_from: 0, months_in_service_to: 12, claim_count: 40, paid_cost_cents: 1000000 }
              as: WarrantyAnalyst
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_z_id}", failure_mode_id: "${fm_zb_id}", observation_period_code: "2026-Q2", months_in_service_from: 0, months_in_service_to: 12, claim_count: 100, paid_cost_cents: 900000 }
              as: WarrantyAnalyst
            - call: "POST /warranty/accruals"
              payload: { period_id: "${pz_id}", vintage_id: "${vin_z_id}", method: "HISTORICAL_RATE", elapsed_exposure_bps: 4000, expected_period_version: "${pz_ver}" }
              as: WarrantyAnalyst
              as_user_id: "ua-1"
              captures: { acc_z_id: $.data.id }
            - call: "POST /warranty/accruals/${acc_z_id}/propose"
              payload: {}
              as: WarrantyAnalyst
              as_user_id: "ua-1"
            - call: "POST /warranty/periods/${pz_id}/lock-analysis"
              payload: {}
              as: ReserveController
            - call: "POST /warranty/accruals/${acc_z_id}/post"
              payload: {}
              as: ReserveController
              as_user_id: "urc-1"
          trigger:
            - call: "POST /warranty/adequacy-reviews"
              payload: { period_id: "${pz_id}", family_id: "${fam_z_id}" }
              as: WarrantyAnalyst
              as_user_id: "ua-1"
              captures: { rev_z_id: $.data.id }
            - call: "POST /warranty/adequacy-reviews/${rev_z_id}/apply-true-up"
              payload: {}
              as: ReserveController
              as_user_id: "urc-1"
          assert:
            - "AdequacyReview.${rev_z_id}.expected_to_date_cents == 1240000"
            - "AdequacyReview.${rev_z_id}.actual_paid_cents == 1900000"
            - "AdequacyReview.${rev_z_id}.ave_ratio_bps == 15323"
            - "AdequacyReview.${rev_z_id}.trend_adjustment_bps == 3000"
            - "AdequacyReview.${rev_z_id}.adequacy_status == DEFICIENT"
            - "AdequacyReview.${rev_z_id}.remaining_base_cents == 1860000"
            - "AdequacyReview.${rev_z_id}.adjusted_remaining_cents == 2418000"
            - "AdequacyReview.${rev_z_id}.recommended_true_up_cents == 1218000"
            - "AdequacyReview.${rev_z_id}.true_up_applied == true"
            - "ProductFamily.${fam_z_id}.warranty_reserve_balance_cents == 4318000"
            - "ProductFamily.${fam_z_id}.reserve_posture == NORMAL"
            - "After apply-true-up, AdequacyReview.${rev_z_id}.expected_to_date_cents is still 1240000 and ave_ratio_bps is still 15323 — the snapshot was not recomputed against the new 4318000 balance"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: field_action_execution_dimension_advances_independently_of_approval
        grounds:
          - state_machines.FieldAction.NOT_STARTED_to_IN_PROGRESS
          - state_machines.FieldAction.IN_PROGRESS_to_COMPLETED
          - state_machines.FieldAction.SUBMITTED_to_APPROVED
          - entities.FieldAction.fields.approval_state
          - entities.FieldAction.fields.execution_state
          - validations[priority=16]
        distinguishing_aspect: |
          FieldAction carries TWO independent state dimensions on one row: execution_state
          cannot leave NOT_STARTED while approval_state != APPROVED (ERR_EXECUTION_BEFORE_APPROVAL),
          and once approval_state == APPROVED the execution dimension walks
          NOT_STARTED -> IN_PROGRESS -> COMPLETED while approval_state stays pinned at
          APPROVED (its terminal value), so the combined state is a product of two axes and
          not a single linear chain.
        test_recipe:
          setup:
            - "One OPEN AccrualPeriod 2026-Q3 exists so an APPROVED decision has a booking period."
            - "ProductFamily FAM-P has reserve_cap_cents 400000000."
            - "FieldAction FA-P-01 is a DRAFT SERVICE_CAMPAIGN over 4000 units with one selected engineering-approved PERMANENT_REPAIR remedy (parts 3000, labor 100 centi-hours, admin 500, take rate 5000 bps), so its specific_accrual_cents is already 26000000 and execution_state is NOT_STARTED."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { pp_id: $.data.id }
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-P", name: "Front Load Washer Platform", launch_date: "2024-02-01", base_warranty_months: 24, standard_cost_per_claim_cents: 22000, reserve_cap_cents: 400000000 }
              as: WarrantyAnalyst
              captures: { fam_p_id: $.data.id }
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_p_id}", action_code: "FA-P-01", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-02-01", affected_build_end_date: "2025-04-30", affected_unit_count: 4000, regulatory_notice_filed: false }
              as: QualityEngineer
              captures: { fa_p_id: $.data.id, fa_p_ver: $.data.version }
            - call: "POST /warranty/field-actions/${fa_p_id}/remedy-options"
              payload: { option_code: "OPT-P-PERM", remedy_class: "PERMANENT_REPAIR", parts_cost_cents: 3000, labor_hours_centi: 100, admin_cost_cents: 500, expected_take_rate_bps: 5000, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_p_id: $.data.id }
            - call: "POST /warranty/field-actions/${fa_p_id}/select-remedy"
              payload: { expected_field_action_version: "${fa_p_ver}", remedy_option_id: "${opt_p_id}" }
              as: QualityEngineer
          trigger:
            - call: "POST /warranty/field-actions/${fa_p_id}/execution-progress"
              payload: { to_execution_state: "IN_PROGRESS", incurred_cost_cents: 500000 }
              as: QualityEngineer
