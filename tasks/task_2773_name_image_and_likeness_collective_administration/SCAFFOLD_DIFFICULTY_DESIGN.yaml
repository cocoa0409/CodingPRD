            - "Deliverable.${del_post_id}.status == VERIFIED"
            - "Deliverable.${del_post_id}.payout_basis == CONTRACT_SHARE_BASIS"
            - "Deliverable.${del_post_id}.payout_eligible_cents == 188889"
            - "The rejected composition order (late penalty applied to total_value_cents first, then the share floor) yields 188888; the pinned order yields 188889, so an off-by-one-cent result falsifies the ordering."
            - "Deliverable.${del_appearance_id}.payout_eligible_cents == 0 because it is still PENDING."

  - rule_id: non_linear_state_machine
    instances:

      - name: deal_contract_three_dimensions_evolve_independently
        grounds:
          - state_machines.sm_deal_contract_lifecycle
          - state_machines.sm_deal_contract_payment
          - state_machines.sm_deal_contract_disclosure
          - entities.DealContract.fields.disclosure_return_count
          - endpoints."POST /nil/deal-contracts/{id}/compliance-decisions"
        distinguishing_aspect: |
          Non-linearity in the DealContract entity, expressed as three parallel
          state dimensions on one row: the disclosure dimension runs a
          PENDING -> RETURNED -> PENDING -> ACCEPTED loop that increments
          disclosure_return_count, the lifecycle dimension moves DRAFT -> ACTIVE
          only once, and the payment dimension moves UNPAID -> PARTIALLY_PAID
          only after a release. The reachable combined state
          (ACTIVE, PARTIALLY_PAID, DISCLOSURE_ACCEPTED) is not on any single
          linear path, and a release must not perturb the other two dimensions.
        test_recipe:
          setup:
            - "A collective with 194970 cents of settled UNRESTRICTED net funds (gross 200000, fee 5030)."
            - "One ENROLLED MENS_BASKETBALL athlete."
            - "One contract worth 100000, which is >= DISCLOSURE_THRESHOLD_CENTS (60000), so it is created with disclosure_status DISCLOSURE_PENDING and a disclosure_due_at 168 hours after creation."
            - "The compliance packet is submitted, RETURNED once by the institution reviewer, resubmitted, then ACCEPTED, so disclosure_return_count reaches 1."
            - "Only then is the contract activated, so lifecycle_status is ACTIVE while payment_status is still UNPAID."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Sunshine Collective", institution_name: "Florida Institution", institution_ipeds_code: "005500", home_state_code: "FL", association_ruleset: "NAIA" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Silver", annual_dues_cents: 60000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Gus Giver", email: "gus@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 200000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { contrib_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Gia Golf", portal_user_id: "ath-gia", sport: "MENS_BASKETBALL", class_year: 2029 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
            - call: "PATCH /nil/athletes/${ath_id}/tax-profile"
              payload: { taxpayer_doc_on_file: "W9" }
              as: TreasuryOfficer
              captures: { ath_doc: $.data.taxpayer_doc_on_file }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 100000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z", funding_designation: "UNRESTRICTED" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id }
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-submissions"
              payload: { state_law_citation: "FL-1006.74", association_rule_citation: "NAIA-2024-A" }
              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-decisions"
              payload: { decision: "RETURN", reviewer_note: "missing state law citation detail" }
              as: InstitutionReviewer
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-submissions"
              payload: { state_law_citation: "FL-1006.74(2)(b)", association_rule_citation: "NAIA-2024-A" }
              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-decisions"
              payload: { decision: "ACCEPT" }
              as: InstitutionReviewer
            - call: "POST /nil/deal-contracts/${dc_id}/activation"
              payload: {}
              as: CollectiveDirector
            - call: "GET /nil/deal-contracts/${dc_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { dc_ver: $.data.version, life_before: $.data.lifecycle_status, disc_before: $.data.disclosure_status, pay_before: $.data.payment_status }
          trigger:
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", release_kind: "CONTRACT_ADVANCE", requested_amount_cents: 60000, expected_deal_contract_version: "${dc_ver}" }
              as: TreasuryOfficer
              as_user_id: "treasury-2"
              captures: { rel_id: $.data.id }
          assert:
            - "${life_before} == ACTIVE"
            - "${pay_before} == UNPAID"
            - "${disc_before} == DISCLOSURE_ACCEPTED"
            - "DealContract.${dc_id}.lifecycle_status == ACTIVE"
            - "DealContract.${dc_id}.payment_status == PARTIALLY_PAID"
            - "DealContract.${dc_id}.disclosure_status == DISCLOSURE_ACCEPTED"
            - "DealContract.${dc_id}.disclosure_return_count == 1"
            - "DealContract.${dc_id}.released_total_cents == 60000"
            - "PaymentRelease.${rel_id}.status == RELEASED"
            - "${ath_doc} == W9"
            - "PaymentRelease.${rel_id}.withholding_basis == NONE"
            - "The release advanced only the payment dimension: lifecycle_status and disclosure_status plus disclosure_return_count are byte-identical to their pre-trigger captures, and no COMPLETED bubble-up fires because the contract has no Deliverable rows."

      - name: deliverable_submit_reject_cycle_hits_resubmission_limit
        grounds:
          - state_machines.sm_deliverable_status
          - validations.priority_33_resubmission_limit
          - global_constants.RESUBMISSION_LIMIT
          - entities.Deliverable.fields.submission_count
          - errors.ERR_RESUBMISSION_LIMIT_REACHED
        distinguishing_aspect: |
          Non-linearity in a different entity — Deliverable — and of a different
          kind: sm_deliverable_status contains a genuine SUBMITTED <-> REJECTED
          loop whose termination is governed by a counter rather than by any
          parallel dimension. The same trigger succeeds on laps one, two and three
          and is refused on lap four, so the state machine's behaviour depends on
          accumulated history and not on the current state alone.
        test_recipe:
          setup:
            - "A collective and one ENROLLED SOFTBALL athlete."
            - "A contract worth 50000, which is below DISCLOSURE_THRESHOLD_CENTS, so disclosure_status is DISCLOSURE_NOT_REQUIRED and it can be activated immediately."
            - "No contribution is needed: validation priority 23 reads the pre-mutation funding_posture, which is OPEN while committed_unreleased_cents is 0, and no later call in this recipe is posture-gated."
            - "One SOCIAL_POST deliverable worth 50000 with one evidence record, satisfying MIN_EVIDENCE_RECORDS."
            - "Three full submit/reject laps are executed, leaving status REJECTED and submission_count 3, which equals RESUBMISSION_LIMIT."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Crimson Collective", institution_name: "Alabama Institution", institution_ipeds_code: "006600", home_state_code: "AL", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Hana Hotel", portal_user_id: "ath-hana", sport: "SOFTBALL", class_year: 2028 }
              as: ComplianceOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 50000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id }
            - call: "POST /nil/deal-contracts/${dc_id}/activation"
              payload: {}
              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${dc_id}/deliverables"
              payload: { deliverable_kind: "SOCIAL_POST", unit_value_cents: 50000, due_at: "2026-09-01T00:00:00Z" }
              as: CollectiveDirector
              captures: { del_id: $.data.id }
            - call: "POST /nil/deliverables/${del_id}/evidence"
              payload: { evidence_kind: "ANALYTICS_SCREENSHOT", reference_label: "post-v1" }
              as: CollectiveDirector
            - call: "POST /nil/deliverables/${del_id}/submissions"
              payload: { performed_at: "2026-08-05T00:00:00Z" }
              as: CollectiveDirector
            - call: "POST /nil/deliverables/${del_id}/reviews"
              payload: { decision: "REJECT", review_note: "image unreadable" }
              as: ComplianceOfficer
              as_user_id: "compliance-3"
            - call: "POST /nil/deliverables/${del_id}/submissions"
              payload: { performed_at: "2026-08-06T00:00:00Z" }
              as: CollectiveDirector
            - call: "POST /nil/deliverables/${del_id}/reviews"
              payload: { decision: "REJECT", review_note: "wrong platform" }
              as: ComplianceOfficer
              as_user_id: "compliance-3"
            - call: "POST /nil/deliverables/${del_id}/submissions"
              payload: { performed_at: "2026-08-07T00:00:00Z" }
              as: CollectiveDirector
            - call: "POST /nil/deliverables/${del_id}/reviews"
              payload: { decision: "REJECT", review_note: "still non-compliant" }
              as: ComplianceOfficer
              as_user_id: "compliance-3"
          trigger:
            - call: "POST /nil/deliverables/${del_id}/submissions"
              payload: { performed_at: "2026-08-08T00:00:00Z" }
              as: CollectiveDirector
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "${err_id} == ERR_RESUBMISSION_LIMIT_REACHED"
            - "The response status is 422; validation priority 19 (state) passes because REJECTED is a legal from-state for a submission, so priority 33 is genuinely the rule that fires."
            - "Deliverable.${del_id}.submission_count == 3"
            - "Deliverable.${del_id}.status == REJECTED"
            - "Deliverable.${del_id}.performed_at == 2026-08-07T00:00:00Z"
            - "Deliverable.${del_id}.evidence_count == 1"
            - "Deliverable.${del_id}.payout_eligible_cents == 0"
            - "DealContract.${dc_id}.payment_status == UNPAID"

  - rule_id: transitive_cascade
    instances:

      - name: restructure_closes_tiers_pauses_commitments_lapses_donor
        depth: 3
        grounds:
          - state_machines.sm_membership_tier_status
          - state_machines.sm_commitment_status
          - state_machines.sm_donor_member_status
          - endpoints."PATCH /nil/collectives/{id}/entity-structure"
          - concurrency_rules.entity-structure-change-stale-collective
          - entities.Collective.fields.charitable_deduction_enabled
        distinguishing_aspect: |
          Trigger: an entity-structure change on Collective. Depth 3 along the
          fundraising spine — Collective -> MembershipTier -> Commitment ->
          DonorMember. Each hop is strictly caused by the previous one: the tier
          closes only because the structure changed, the commitment pauses with
          pause_reason STRUCTURE_RESTRUCTURE only because its tier closed, and the
          donor lapses only because its last non-terminal commitment paused.
          Already-settled contributions are explicitly NOT rewritten, which pins
          where the cascade stops.
        test_recipe:
          setup:
            - "A NONPROFIT_501C3 collective, so charitable_deduction_enabled starts true."
            - "One membership tier T2 moved to OPEN."
            - "One INDIVIDUAL DonorMember with annual_agi_cents 1000000 (ceiling 600000)."
            - "One ACTIVE RECURRING_SUBSCRIPTION commitment of 50000 MONTHLY with installments_total 12, created with a fresh expected_donor_member_version."
            - "One SETTLED SUBSCRIPTION_CHARGE contribution of gross 50000 (fee 1480, net 48520) attributed to that commitment, which moves the donor from PROSPECT to ACTIVE and leaves installments_charged at 1 of 12."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Charitable NIL Fund", institution_name: "California Institution B", institution_ipeds_code: "007700", home_state_code: "CA", association_ruleset: "NCAA_2026", entity_structure: "NONPROFIT_501C3" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Sustainers", annual_dues_cents: 50000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Iris Ivy", email: "iris@example.com", donor_kind: "INDIVIDUAL", annual_agi_cents: 1000000 }
              as: CollectiveDirector
              captures: { donor_id: $.data.id, donor_ver: $.data.version }
            - call: "POST /nil/commitments"
              payload: { donor_member_id: "${donor_id}", kind: "RECURRING_SUBSCRIPTION", amount_cents: 50000, billing_interval: "MONTHLY", installments_total: 12, expected_donor_member_version: "${donor_ver}" }
              as: CollectiveDirector
              captures: { cm_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", commitment_id: "${cm_id}", gross_amount_cents: 50000, source_kind: "SUBSCRIPTION_CHARGE", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { contrib_id: $.data.id }
            - call: "GET /nil/collectives/${col_id}"
              payload: {}
              as: PlatformAdmin
              captures: { col_ver: $.data.version }
          trigger:
            - call: "PATCH /nil/collectives/${col_id}/entity-structure"
              payload: { entity_structure: "FOR_PROFIT_LLC", expected_collective_version: "${col_ver}" }
              as: PlatformAdmin
          assert:
            - "Collective.${col_id}.entity_structure == FOR_PROFIT_LLC"
            - "Collective.${col_id}.charitable_deduction_enabled == false"
            - "Collective.${col_id}.structure_change_count == 1"
            - "MembershipTier.${tier_id}.tier_status == CLOSED"
            - "Commitment.${cm_id}.status == PAUSED"
            - "Commitment.${cm_id}.pause_reason == STRUCTURE_RESTRUCTURE"
            - "DonorMember.${donor_id}.status == LAPSED"
            - "Contribution.${contrib_id}.status == SETTLED"
            - "Contribution.${contrib_id}.net_amount_cents == 48520"
            - "Contribution.${contrib_id}.deductible_amount_cents == 48520"
            - "DonorMember.${donor_id}.lifetime_settled_cents == 48520"
            - "DonorMember.${donor_id}.lifetime_deductible_cents == 48520"
            - "The cascade is strictly transitive: with tier T2 left in DRAFT instead of OPEN the commitment would still pause (its tier still closes), but with the commitment already CANCELLED before the trigger the donor would not lapse from the restructure, because the donor hop is caused by the commitment hop and not by the structure change."

      - name: athlete_transfer_terminates_contract_forfeits_deliverables_voids_queued_release
        depth: 3
        grounds:
          - state_machines.sm_athlete_eligibility_status
          - state_machines.sm_deal_contract_lifecycle
          - state_machines.sm_deliverable_status
          - state_machines.sm_payment_release_status
          - calculations.calc_clawback_amount
          - endpoints."POST /nil/athletes/{id}/eligibility-changes"
        distinguishing_aspect: |
          A different trigger and a completely different spine from
          restructure_closes_tiers_pauses_commitments_lapses_donor: this cascade
          originates in sm_athlete_eligibility_status
          (PORTAL_ENTERED -> TRANSFERRED_OUT) and runs Athlete -> DealContract ->
          Deliverable -> PaymentRelease. It also exercises the terminal-state
          filter, since only non-terminal children are touched, and it forces
          calc_clawback_amount to evaluate to 0 because nothing was ever RELEASED.
        test_recipe:
          setup:
            - "A collective with 487470 cents of settled UNRESTRICTED net funds (gross 500000, fee 12530)."
            - "One ENROLLED FOOTBALL athlete."
            - "One ACTIVE contract worth 100000 with disclosure ACCEPTED, carrying two PENDING deliverables (APPEARANCE 60000 and SOCIAL_POST 40000)."
            - "The athlete then enters the transfer portal, so eligibility_status is PORTAL_ENTERED."
            - "A CONTRACT_ADVANCE release of 50000 is requested while the athlete is PORTAL_ENTERED, so it is parked in status QUEUED rather than RELEASED."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Longhorn Transfer Fund", institution_name: "Texas Institution B", institution_ipeds_code: "008800", home_state_code: "TX", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T3", tier_name: "Gold", annual_dues_cents: 150000, benefit_rank: 3 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Jo Juliet", email: "jo@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 500000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { contrib_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Kip Kilo", portal_user_id: "ath-kip", sport: "FOOTBALL", class_year: 2027 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 100000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z", funding_designation: "UNRESTRICTED" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id }
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-submissions"
              payload: { state_law_citation: "TX-51.9246", association_rule_citation: "NCAA-2026-12.5" }
              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-decisions"
              payload: { decision: "ACCEPT" }
              as: InstitutionReviewer
            - call: "POST /nil/deal-contracts/${dc_id}/activation"
              payload: {}
              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${dc_id}/deliverables"
              payload: { deliverable_kind: "APPEARANCE", unit_value_cents: 60000, due_at: "2026-09-01T00:00:00Z" }
              as: CollectiveDirector
              captures: { del1_id: $.data.id }
            - call: "POST /nil/deal-contracts/${dc_id}/deliverables"
              payload: { deliverable_kind: "SOCIAL_POST", unit_value_cents: 40000, due_at: "2026-09-15T00:00:00Z" }
              as: CollectiveDirector
              captures: { del2_id: $.data.id }
            - call: "POST /nil/athletes/${ath_id}/eligibility-changes"
              payload: { change: "ENTER_PORTAL" }
              as: ComplianceOfficer
            - call: "GET /nil/deal-contracts/${dc_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { dc_ver: $.data.version }
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", release_kind: "CONTRACT_ADVANCE", requested_amount_cents: 50000, expected_deal_contract_version: "${dc_ver}" }
              as: TreasuryOfficer
              as_user_id: "treasury-3"
              captures: { rel_id: $.data.id, rel_status: $.data.status }
          trigger:
            - call: "POST /nil/athletes/${ath_id}/eligibility-changes"
              payload: { change: "COMPLETE_TRANSFER" }
              as: ComplianceOfficer
          assert:
            - "${rel_status} == QUEUED"
            - "Athlete.${ath_id}.eligibility_status == TRANSFERRED_OUT"
            - "DealContract.${dc_id}.lifecycle_status == TERMINATED"
            - "DealContract.${dc_id}.termination_reason == TRANSFER_OUT"
            - "Deliverable.${del1_id}.status == FORFEITED"
            - "Deliverable.${del2_id}.status == FORFEITED"
            - "DealContract.${dc_id}.deliverable_value_total_cents == 0"
            - "PaymentRelease.${rel_id}.status == VOIDED"
            - "PaymentRelease.${rel_id}.net_payable_cents == 0"
            - "DealContract.${dc_id}.released_total_cents == 0"
            - "DealContract.${dc_id}.clawback_amount_cents == 0"
            - "DealContract.${dc_id}.payment_status == UNPAID"
            - "Athlete.${ath_id}.annual_committed_value_cents == 0"
            - "Athlete.${ath_id}.tax_year_gross_paid_cents == 0"
            - "Collective.${col_id}.committed_unreleased_cents == 0"
            - "Collective.${col_id}.settled_net_funds_cents == 487470"
            - "Collective.${col_id}.funding_posture == OPEN"
            - "Depth is genuinely 3: the release only voids because its contract terminated, and the contract only terminated because the athlete transferred; a release on a contract belonging to a different athlete would be untouched."

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_fiscal_on_payment_release_against_terminated_contract
        grounds:
          - validations.priority_17_state_contract_lifecycle
          - validations.priority_45_release_within_payout_eligible
          - errors.ERR_CONTRACT_TERMINAL
          - errors.ERR_RELEASE_EXCEEDS_PAYOUT_ELIGIBLE
          - endpoints."POST /nil/payment-releases"
        distinguishing_aspect: |
          Category pair: state (priority 17) versus business_fiscal (priority 45).
          One request violates both rules at once — the contract is TERMINATED and
          the requested 100000 exceeds the VERIFIED deliverable's payout_eligible
          60000 — and the state error must win, returning ERR_CONTRACT_TERMINAL
          with HTTP 409 rather than ERR_RELEASE_EXCEEDS_PAYOUT_ELIGIBLE with 422.
          Priority 37 is deliberately not violated (100000 == total_value_cents),
          so exactly two rules are in contention.
        test_recipe:
          setup:
            - "A collective with 487470 cents of settled UNRESTRICTED net funds."
            - "One ENROLLED BASEBALL athlete and one ACTIVE INDIVIDUAL contract worth exactly 100000."
            - "One SOCIAL_POST deliverable worth 60000, submitted on time with one evidence record and VERIFIED by compliance user compliance-1, so its payout_eligible_cents is 60000 on the strict unit basis."
            - "The contract is then terminated for BREACH; the VERIFIED deliverable is terminal so it is not forfeited, and clawback_amount_cents stays 0 because released_total_cents is 0."
            - "The release is initiated by treasury-1, a different user from the verifier, so priority 22 segregation of duties is satisfied."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Buckeye Fiscal Trust", institution_name: "Ohio Institution B", institution_ipeds_code: "009900", home_state_code: "OH", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Base", annual_dues_cents: 20000, benefit_rank: 1 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
