scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # Instance A: Order (cost accounting on Order); Instance B: CustomPrintOrder
  # (fee accounting on CustomPrintOrder — different subject and entity).
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_grand_total_provisional_vs_finalized_snapshot
        grounds:
          - calculations.order_grand_total
          - calculations.order_grand_total.variants.provisional_at_draft
          - calculations.order_grand_total.variants.finalized_at_reserved
          - state_machines.Order.DRAFT_to_RESERVED
          - entities.Order.fields.grand_total_cents
          - entities.OrderLine.fields.unit_price_cents_at_capture
        distinguishing_aspect: |
          On the SAME Order with identical OrderLines, provisional grand_total in
          DRAFT reads live Sku.unit_price_cents (no clearance snapshot lock)
          while finalized grand_total post-RESERVE reads the pinned
          unit_price_cents_at_capture — for a Sku moved onto clearance BETWEEN
          DRAFT and RESERVED, the two variants yield strictly different totals.
        test_recipe:
          setup:
            - "Store clock at 2026-06-15T10:00:00Z. Customer exists. One SKU 'BAL-LATEX-11-RED' priced 500 cents. Order DRAFT with one OrderLine qty=10."
            - "SKU has NO clearance applied yet — provisional grand_total = 10 * 500 = 5000 cents."
            - "SKU is moved to clearance pct=0.20 (unit_price_cents_at_capture at RESERVE will be 500*0.80 = 400)."
            - "Order transitions DRAFT -> RESERVED; finalized grand_total = 10 * 400 = 4000 cents."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "alice@example.com", full_name: "Alice Party" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "BAL-LATEX-11-RED", category: "BALLOON_LATEX", unit_price_cents: 500 }
              as: StoreManager
              captures: { sku_red_id: $.data.id }
            - call: "POST /api/skus/${sku_red_id}/restock"
              payload: { delta: 100 }
              as: StoreManager
              captures: { sku_red_v_after_restock: $.data.version }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${sku_red_id}", qty: 10 }] }
              as: StoreClerk
              captures: { order_id: $.data.id, order_v: $.data.version, order_provisional_total: $.data.grand_total_cents }
            - call: "POST /api/skus/${sku_red_id}/clearance"
              payload: { pct: 0.20, expected_sku_version: "${sku_red_v_after_restock}" }
              as: StoreManager
          trigger:
            - call: "POST /api/orders/${order_id}/reserve"
              payload: { expected_order_version: "${order_v}" }
              as: StoreClerk
              captures: { order_finalized_total: $.data.grand_total_cents, order_status_after: $.data.fulfillment_status }
          assert:
            - "order_provisional_total == 5000"
            - "order_finalized_total == 4000"
            - "order_finalized_total < order_provisional_total"
            - "order_status_after == 'RESERVED'"

      - name: custom_print_fee_estimate_vs_finalized_with_revisions
        grounds:
          - calculations.custom_print_fee
          - calculations.custom_print_fee.variants.estimated_at_proof_send
          - calculations.custom_print_fee.variants.finalized_at_approve
          - state_machines.CustomPrintOrder.PROOF_SENT_to_APPROVED
          - entities.CustomPrintOrder.fields.revision_count
          - entities.CustomPrintOrder.fields.print_fee_cents
        distinguishing_aspect: |
          Entity domain DIFFERS from instance A (Order vs CustomPrintOrder).
          For a 10-ft banner: estimated fee at first proof (revision_count=0) is
          7000 cents; finalized fee after 2 revisions is 7000 + (2-1)*500 = 7500.
          Different results, identical banner_length_ft input.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer + Order DRAFT + attached CustomPrintOrder with banner_length_ft=10."
            - "Send proof twice with a REVISION_REQUESTED in between, ending at revision_count=2 with status=PROOF_SENT."
            - "Pay Order in FULL so approve's payment guard passes."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "bob@example.com", full_name: "Bob Print" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "DECOR-STICKER-01", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /api/skus/${sku_id}/restock"
              payload: { delta: 100 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${sku_id}", qty: 1 }] }
              as: StoreClerk
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /api/orders/${order_id}/custom-print"
              payload: { art_reference: "https://art.example/design-abc", banner_length_ft: 10 }
              as: StoreClerk
              captures: { cpo_id: $.data.id }
            - call: "POST /api/orders/${order_id}/reserve"
              payload: { expected_order_version: "${order_v}" }
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/pay"
              payload: { mode: "FULL" }
              as: StoreClerk
            - call: "POST /api/custom-print-orders/${cpo_id}/send-proof"
              payload: {}
              as: StoreClerk
              captures: { cpo_after_first_proof_fee: $.data.print_fee_cents }
            - call: "POST /api/custom-print-orders/${cpo_id}/request-revision"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/custom-print-orders/${cpo_id}/send-proof"
              payload: {}
              as: StoreClerk
            - call: "POST /api/custom-print-orders/${cpo_id}/request-revision"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/custom-print-orders/${cpo_id}/send-proof"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /api/custom-print-orders/${cpo_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cpo_finalized_fee: $.data.print_fee_cents, cpo_revs: $.data.revision_count }
          assert:
            - "cpo_after_first_proof_fee == 0"
            - "cpo_revs == 2"
            - "cpo_finalized_fee == 7500"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes {(a),(b),(c)}
  # Instance A: mode (b) — round-then-sum vs sum-then-round: helium fees
  #   are round-per-line-then-sum; the scaffold pins that order.
  # Instance B: mode (a) — ≥3 inputs, non-linear (nested min/max, conditional
  #   branches, tiered rate selection): custom_print_fee tiered by ft AND
  #   revision surcharge conditional on revision_count > 1.
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: helium_fill_fee_per_line_rounding_order_pinned
        grounds:
          - calculations.helium_fill_fee
          - calculations.helium_fill_fee.constants.LATEX_BULK_TIER
          - entities.HeliumOrder.fields.fill_fee_cents
          - state_machines.Order.DRAFT_to_RESERVED
        distinguishing_aspect: |
          Mode (b) — nested rounding: latex line rounds first (30 * 175 * 0.85 =
          4462.50 → 4463), foil line rounds first (7 * 425 = 2975 → 2975), sum
          = 7438. Reversing order (sum then round) yields 7437.50 → 7438 in
          this case but the scaffold explicitly pins per-line-then-sum so
          rounding-boundary inputs are unambiguous.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer + one ACTIVE HeliumTank capacity 100 cu.ft (>= required 22 cu.ft)."
            - "Order DRAFT with a placeholder OrderLine and attached HeliumOrder latex_count=30, foil_count=7."
            - "At RESERVE the fill fee is calculated per-line: latex 30*175*0.85 = 4462.5 → round_half_up → 4463; foil 7*425 = 2975 (no bulk). Sum = 7438."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "carol@example.com", full_name: "Carol Balloons" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "BAL-LATEX-11-BLUE", category: "BALLOON_LATEX", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /api/skus/${sku_id}/restock"
              payload: { delta: 100 }
              as: StoreManager
            - call: "POST /api/helium-tanks"
              payload: { tank_code: "TANK-01", capacity_cubic_ft: 100 }
              as: StoreManager
              captures: { tank_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${sku_id}", qty: 1 }] }
              as: StoreClerk
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /api/orders/${order_id}/helium"
              payload: { latex_count: 30, foil_count: 7 }
              as: StoreClerk
          trigger:
            - call: "POST /api/orders/${order_id}/reserve"
              payload: { expected_order_version: "${order_v}" }
              as: StoreClerk
              captures: { order_helium_fee: $.data.helium_fee_cents, order_total: $.data.grand_total_cents }
          assert:
            - "order_helium_fee == 7438"
            - "order_total == 7538"

      - name: custom_print_fee_tiered_with_revision_conditional_branch
        grounds:
          - calculations.custom_print_fee
          - calculations.custom_print_fee.constants.RATE_1_CENTS_PER_FT
          - calculations.custom_print_fee.constants.RATE_2_CENTS_PER_FT
          - calculations.custom_print_fee.constants.RATE_3_CENTS_PER_FT
          - state_machines.CustomPrintOrder.PROOF_SENT_to_APPROVED
        distinguishing_aspect: |
          Mode (a) — ≥3 inputs (banner_length_ft AND revision_count AND tier
          rates), tiered-rate selection AND conditional revision surcharge
          branch. For 20 ft with revision_count=1: span_1=5, span_2=10, span_3=5
          → 5*800 + 10*600 + 5*450 = 4000+6000+2250 = 12250. Surcharge branch
          NOT active because max(0, 1-1)=0. Different structural axis than
          instance A (which was rounding order, not tier selection).
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer + Order + attached CustomPrintOrder banner_length_ft=20."
            - "Order paid FULL. One send-proof to reach PROOF_SENT with revision_count=0, no revisions requested."
            - "Author-note: revision_count=0 at approve means surcharge branch max(0, 0-1)=0 stays inactive; fee is pure tier sum 12250."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "dan@example.com", full_name: "Dan Banner" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "DECOR-BANNER-BASE", category: "DECOR", unit_price_cents: 200 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /api/skus/${sku_id}/restock"
              payload: { delta: 100 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${sku_id}", qty: 1 }] }
              as: StoreClerk
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /api/orders/${order_id}/custom-print"
              payload: { art_reference: "https://art.example/xl-banner", banner_length_ft: 20 }
              as: StoreClerk
              captures: { cpo_id: $.data.id }
            - call: "POST /api/orders/${order_id}/reserve"
              payload: { expected_order_version: "${order_v}" }
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/pay"
              payload: { mode: "FULL" }
              as: StoreClerk
            - call: "POST /api/custom-print-orders/${cpo_id}/send-proof"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /api/custom-print-orders/${cpo_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cpo_fee: $.data.print_fee_cents }
          assert:
            - "cpo_fee == 12250"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # Instance A: Order — parallel dimensions (fulfillment_status × payment_status)
  # Instance B: CustomPrintOrder — cyclic PROOF_SENT <-> REVISION_REQUESTED
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_fulfillment_and_payment_dimensions
        grounds:
          - state_machines.Order
          - state_machines.Order.DRAFT_to_RESERVED
          - state_machines.Order.UNPAID_to_DEPOSIT_HELD
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          Order carries TWO independent status axes on the same row.
          Fulfillment can be RESERVED while payment is still UNPAID; a pay
          transition moves payment_status without touching fulfillment_status.
          Verified by observing both fields diverge across the sequence.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer, one SKU, one active EventPackage (deposit-eligible)."
            - "Order created with a normal SKU line AND EventBooking attached to make DEPOSIT payment eligible."
            - "Reserve moves fulfillment_status DRAFT->RESERVED but payment_status stays UNPAID; then pay DEPOSIT moves payment_status UNPAID->DEPOSIT_HELD without touching fulfillment_status."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "eve@example.com", full_name: "Eve Event" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "DECOR-CANDLE-01", category: "DECOR", unit_price_cents: 300 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /api/skus/${sku_id}/restock"
              payload: { delta: 100 }
              as: StoreManager
            - call: "POST /api/event-packages"
              payload: { package_code: "BIRTHDAY-30", base_price_cents: 20000, deposit_pct: 0.30, min_lead_days: 7 }
              as: StoreManager
              captures: { pkg_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${sku_id}", qty: 1 }] }
              as: StoreClerk
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /api/event-bookings"
              payload: { order_id: "${order_id}", event_package_id: "${pkg_id}", event_date: "2026-07-30T18:00:00Z" }
              as: StoreClerk
              captures: { booking_id: $.data.id }
            - call: "POST /api/orders/${order_id}/reserve"
              payload: { expected_order_version: "${order_v}" }
              as: StoreClerk
              captures: { after_reserve_fulfillment: $.data.fulfillment_status, after_reserve_payment: $.data.payment_status }
          trigger:
            - call: "POST /api/orders/${order_id}/pay"
              payload: { mode: "DEPOSIT" }
              as: StoreClerk
              captures: { after_pay_fulfillment: $.data.fulfillment_status, after_pay_payment: $.data.payment_status }
          assert:
            - "after_reserve_fulfillment == 'RESERVED'"
            - "after_reserve_payment == 'UNPAID'"
            - "after_pay_fulfillment == 'RESERVED'"
            - "after_pay_payment == 'DEPOSIT_HELD'"

      - name: custom_print_cyclic_proof_revision_loop
        grounds:
          - state_machines.CustomPrintOrder
          - state_machines.CustomPrintOrder.PROOF_SENT_to_REVISION_REQUESTED
          - state_machines.CustomPrintOrder.REVISION_REQUESTED_to_PROOF_SENT
          - entities.CustomPrintOrder.fields.revision_count
        distinguishing_aspect: |
          CustomPrintOrder is CYCLIC (A→B→A). Different entity than instance A.
          PROOF_SENT->REVISION_REQUESTED->PROOF_SENT is a legal loop with
          revision_count ratcheting upward until the limit.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer + Order + CustomPrintOrder banner_length_ft=8."
            - "Reserve + pay full. Send-proof to reach PROOF_SENT with revision_count=0."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "frank@example.com", full_name: "Frank Print" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "DECOR-BANNER-8FT", category: "DECOR", unit_price_cents: 200 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /api/skus/${sku_id}/restock"
              payload: { delta: 100 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${sku_id}", qty: 1 }] }
              as: StoreClerk
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /api/orders/${order_id}/custom-print"
              payload: { art_reference: "https://art.example/loop", banner_length_ft: 8 }
              as: StoreClerk
              captures: { cpo_id: $.data.id }
            - call: "POST /api/orders/${order_id}/reserve"
              payload: { expected_order_version: "${order_v}" }
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/pay"
              payload: { mode: "FULL" }
              as: StoreClerk
            - call: "POST /api/custom-print-orders/${cpo_id}/send-proof"
              payload: {}
              as: StoreClerk
              captures: { after_send1_status: $.data.status, after_send1_revs: $.data.revision_count }
          trigger:
            - call: "POST /api/custom-print-orders/${cpo_id}/request-revision"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { after_rev_status: $.data.status, after_rev_revs: $.data.revision_count }
            - call: "POST /api/custom-print-orders/${cpo_id}/send-proof"
              payload: {}
              as: StoreClerk
              captures: { after_send2_status: $.data.status, after_send2_revs: $.data.revision_count }
          assert:
            - "after_send1_status == 'PROOF_SENT'"
            - "after_send1_revs == 0"
            - "after_rev_status == 'REVISION_REQUESTED'"
            - "after_rev_revs == 1"
            - "after_send2_status == 'PROOF_SENT'"
            - "after_send2_revs == 1"

  # =====================================================================
  # Rule 4 — Transitive cascades from DIFFERENT triggers
  # Instance A: depth 3 — Order pickup -> RentalContract PICKED_UP;
  #   then RentalContract return -> Sku.on_hand_qty += qty AND
  #   Customer.store_credit_cents += deposit.
  # Instance B: depth 2 — CustomPrintOrder approve -> pin print_fee ->
  #   Order.subtotal_cents recompute -> Order.grand_total_cents recompute.
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: order_pickup_rental_pickup_return_credit_chain
        grounds:
          - state_machines.Order.READY_FOR_PICKUP_to_PICKED_UP
          - state_machines.RentalContract.RESERVED_to_PICKED_UP
          - state_machines.RentalContract.PICKED_UP_to_RETURNED
          - entities.Sku.fields.on_hand_qty
          - entities.Customer.fields.store_credit_cents
          - entities.RentalContract.fields.deposit_cents
        distinguishing_aspect: |
          Depth-3 cascade: Order pickup (link 1) triggers RentalContract
          transition RESERVED->PICKED_UP; the RentalContract's OWN transition
          (link 2) later, on rental-return, mutates Sku.on_hand_qty and
          Customer.store_credit_cents (link 3). Each link is CAUSED BY the
          previous, not a fan-out from the original Order pickup.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer, one TABLEWARE SKU 'PLATE-WHITE' priced 500 cents with on_hand_qty=20."
            - "Order BOPIS lines: 1 plate; RentalContract attached qty=6, rental_start=2026-06-16T00:00:00Z, rental_end=2026-06-20T00:00:00Z, deposit = 2*500*6 = 6000."
            - "Order reserved + paid FULL + start-picking + mark-ready + pickup (RentalContract auto -> PICKED_UP)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "grace@example.com", full_name: "Grace Rental" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "PLATE-WHITE", category: "TABLEWARE", unit_price_cents: 500 }
              as: StoreManager
              captures: { plate_id: $.data.id }
            - call: "POST /api/skus/${plate_id}/restock"
              payload: { delta: 20 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "BOPIS", lines: [{ sku_id: "${plate_id}", qty: 1 }], pickup_window_start: "2026-06-15T14:00:00Z", pickup_window_end: "2026-06-15T18:00:00Z" }
              as: StoreClerk
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /api/rental-contracts"
              payload: { order_id: "${order_id}", sku_id: "${plate_id}", qty: 6, rental_start: "2026-06-16T00:00:00Z", rental_end: "2026-06-20T00:00:00Z" }
              as: StoreClerk
              captures: { rental_id: $.data.id, rental_deposit: $.data.deposit_cents }
            - call: "POST /api/orders/${order_id}/reserve"
              payload: { expected_order_version: "${order_v}" }
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/pay"
              payload: { mode: "FULL" }
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/start-picking"
              payload: {}
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/mark-ready"
              payload: {}
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/pickup"
              payload: {}
              as: StoreClerk
              captures: { after_pickup_plate_on_hand: $.data.grand_total_cents }
            - call: "GET /api/skus/${plate_id}"
              payload: {}
              as: StoreClerk
              captures: { plate_on_hand_after_pickup: $.data.on_hand_qty }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T12:00:00Z" }
              as: StoreClerk
          trigger:
            - call: "POST /api/rental-contracts/${rental_id}/return"
              payload: {}
              as: StoreClerk
              captures: { rental_status: $.data.status }
            - call: "GET /api/skus/${plate_id}"
              payload: {}
              as: StoreClerk
              captures: { plate_on_hand_after_return: $.data.on_hand_qty }
            - call: "GET /api/customers/${cust_id}"
              payload: {}
              as: StoreClerk
              captures: { cust_credit_after_return: $.data.store_credit_cents }
          assert:
            - "rental_deposit == 6000"
            - "plate_on_hand_after_pickup == 13"
            - "rental_status == 'RETURNED'"
            - "plate_on_hand_after_return == 19"
            - "cust_credit_after_return == 6000"

      - name: custom_print_approve_subtotal_grand_total_recompute
        grounds:
          - state_machines.CustomPrintOrder.PROOF_SENT_to_APPROVED
          - entities.CustomPrintOrder.fields.print_fee_cents
          - entities.Order.fields.subtotal_cents
          - entities.Order.fields.grand_total_cents
          - calculations.custom_print_fee
          - calculations.order_grand_total
        distinguishing_aspect: |
          Depth-2 cascade DIFFERENT trigger than instance A: approving a
          CustomPrintOrder (link 1) pins print_fee_cents, which triggers
          Order.subtotal recomputation (link 2), which itself triggers
          Order.grand_total recomputation (still link 2, cascaded from
          subtotal). For banner_length_ft=3: fee = 3*800 = 2400.
          Order.subtotal jumps by 2400, Order.grand_total jumps by 2400.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer + one SKU at 200 cents qty=1 (subtotal 200 initially)."
            - "Attach CustomPrintOrder banner_length_ft=3. Reserve, pay FULL, send-proof."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "harry@example.com", full_name: "Harry Print" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "DECOR-STICKER-02", category: "DECOR", unit_price_cents: 200 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /api/skus/${sku_id}/restock"
              payload: { delta: 50 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${sku_id}", qty: 1 }] }
              as: StoreClerk
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /api/orders/${order_id}/custom-print"
              payload: { art_reference: "https://art.example/small", banner_length_ft: 3 }
              as: StoreClerk
              captures: { cpo_id: $.data.id }
            - call: "POST /api/orders/${order_id}/reserve"
              payload: { expected_order_version: "${order_v}" }
              as: StoreClerk
              captures: { subtotal_before_print: $.data.subtotal_cents, grand_before_print: $.data.grand_total_cents }
            - call: "POST /api/orders/${order_id}/pay"
              payload: { mode: "FULL" }
              as: StoreClerk
            - call: "POST /api/custom-print-orders/${cpo_id}/send-proof"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /api/custom-print-orders/${cpo_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cpo_fee: $.data.print_fee_cents }
            - call: "GET /api/orders/${order_id}"
              payload: {}
              as: StoreClerk
              captures: { subtotal_after: $.data.subtotal_cents, grand_after: $.data.grand_total_cents }
          assert:
            - "subtotal_before_print == 200"
            - "grand_before_print == 200"
            - "cpo_fee == 2400"
            - "subtotal_after == 2600"
            - "grand_after == 2600"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category
  # pairs.
  # Instance A: state (priority 6) vs business_safety (priority 8) —
  #   state wins on ordering.
  # Instance B: existence (priority 5) vs business_referential (priority 9).
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_return_from_draft_clearance_line
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CLEARANCE_NON_RETURNABLE]
        distinguishing_aspect: |
          Categories differ: state (priority 6) vs business_safety (priority 8).
          Order is DRAFT AND has a clearance line — return would fail BOTH
          state (must be PICKED_UP/DELIVERED) AND clearance-non-returnable.
          ERR_INVALID_STATE wins because priority 6 fires before priority 8.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer + one SKU with clearance applied. Order DRAFT with one OrderLine of that clearance SKU."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "iris@example.com", full_name: "Iris Draft" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "COST-VAMP-M", category: "COSTUME", unit_price_cents: 4000 }
              as: StoreManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /api/skus/${sku_id}/restock"
              payload: { delta: 10 }
              as: StoreManager
              captures: { sku_v_after_restock: $.data.version }
            - call: "POST /api/skus/${sku_id}/clearance"
              payload: { pct: 0.30, expected_sku_version: "${sku_v_after_restock}" }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${sku_id}", qty: 1 }] }
              as: StoreClerk
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /api/orders/${order_id}/return"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: existence_vs_business_referential_rental_missing_order_wins
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_FK_NOT_FOUND]
          - errors[ERR_RENTAL_CATEGORY_INVALID]
        distinguishing_aspect: |
          Categories differ: existence (priority 5) vs business_referential
          (priority 9). Rental create with a non-existent order_id AND a
          non-TABLEWARE sku_id — FK existence check fires first (priority 5),
          returns ERR_FK_NOT_FOUND. If existence check were bypassed the
          category check would fire and return ERR_RENTAL_CATEGORY_INVALID.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. One BALLOON_LATEX Sku exists (not TABLEWARE)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/skus"
              payload: { sku_code: "BAL-LATEX-11-GREEN", category: "BALLOON_LATEX", unit_price_cents: 100 }
              as: StoreManager
              captures: { latex_sku_id: $.data.id }
          trigger:
            - call: "POST /api/rental-contracts"
              payload: { order_id: "00000000-0000-4000-8000-000000000000", sku_id: "${latex_sku_id}", qty: 1, rental_start: "2026-06-20T00:00:00Z", rental_end: "2026-06-21T00:00:00Z" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_FK_NOT_FOUND'"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # Instance A: numeric threshold — latex_count == 25 crosses bulk-discount
  #   line at exactly the >= comparison (endpoint POST /orders/{id}/reserve).
  # Instance B: empty-set — Order with no OrderLines at RESERVE
  #   (endpoint POST /orders/{id}/reserve returning ERR_INVALID_REQUEST via
  #   priority 19 required-input semantics — but tested against a different
  #   metric: empty vs non-empty line count).
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: helium_latex_bulk_threshold_at_25_exact
        grounds:
          - calculations.helium_fill_fee.constants.LATEX_BULK_TIER
          - calculations.helium_fill_fee.constants.LATEX_BULK_DISCOUNT
          - entities.HeliumOrder.fields.fill_fee_cents
        distinguishing_aspect: |
          Boundary >= vs >. latex_count=25 triggers bulk discount
          (25*175*0.85 = 3718.75 → 3719 cents). latex_count=24 does NOT
          (24*175 = 4200 cents). The 25-count fee is LOWER than the 24-count
          fee — a classic boundary trap.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer + one dummy SKU + one ACTIVE tank capacity 100."
            - "Order DRAFT with HeliumOrder latex_count=25, foil_count=0."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "jane@example.com", full_name: "Jane Bulk" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "DUMMY-01", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /api/skus/${sku_id}/restock"
              payload: { delta: 10 }
              as: StoreManager
            - call: "POST /api/helium-tanks"
              payload: { tank_code: "TANK-BULK", capacity_cubic_ft: 100 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${sku_id}", qty: 1 }] }
              as: StoreClerk
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /api/orders/${order_id}/helium"
              payload: { latex_count: 25, foil_count: 0 }
              as: StoreClerk
          trigger:
            - call: "POST /api/orders/${order_id}/reserve"
              payload: { expected_order_version: "${order_v}" }
              as: StoreClerk
              captures: { fee: $.data.helium_fee_cents }
          assert:
            - "fee == 3719"

      - name: rental_overlap_capacity_zero_remaining_at_boundary
        grounds:
          - validations[priority=13]
          - errors[ERR_RENTAL_OVERLAP_CAPACITY]
          - entities.Sku.fields.on_hand_qty
        distinguishing_aspect: |
          Empty-set / zero-capacity boundary on DIFFERENT metric (rental
          overlap aggregate) and DIFFERENT endpoint (POST /rental-contracts).
          When on_hand_qty=5 and an existing overlapping rental holds qty=5,
          a request for qty=1 (which would push aggregate to 6, exceeding 5)
          fails with ERR_RENTAL_OVERLAP_CAPACITY. The remaining-slack is
          exactly 0 at the failure boundary.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer + one TABLEWARE SKU on_hand_qty=5."
            - "Existing RentalContract A for the SAME sku on 2026-06-16..2026-06-20 with qty=5."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "kate@example.com", full_name: "Kate Table" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "PLATE-GOLD", category: "TABLEWARE", unit_price_cents: 400 }
              as: StoreManager
              captures: { plate_id: $.data.id }
            - call: "POST /api/skus/${plate_id}/restock"
              payload: { delta: 5 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${plate_id}", qty: 1 }] }
              as: StoreClerk
              captures: { order_a_id: $.data.id }
            - call: "POST /api/rental-contracts"
              payload: { order_id: "${order_a_id}", sku_id: "${plate_id}", qty: 5, rental_start: "2026-06-16T00:00:00Z", rental_end: "2026-06-20T00:00:00Z" }
              as: StoreClerk
              captures: { rental_a_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${plate_id}", qty: 1 }] }
              as: StoreClerk
              captures: { order_b_id: $.data.id }
          trigger:
            - call: "POST /api/rental-contracts"
              payload: { order_id: "${order_b_id}", sku_id: "${plate_id}", qty: 1, rental_start: "2026-06-17T00:00:00Z", rental_end: "2026-06-19T00:00:00Z" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_RENTAL_OVERLAP_CAPACITY'"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # Instance A: Order (payment_status guards fulfillment_status transitions):
  #   Order pickup requires payment_status == PAID.
  # Instance B: EventBooking (event_date/lead-time guard on state) — event
  #   confirm requires parent Order.payment_status IN {DEPOSIT_HELD, PAID}
  #   AND EventPackage.min_lead_days met. Cross-entity between EventBooking
  #   and Order (a different entity pair than instance A).
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_pickup_rejects_when_payment_deposit_held_only
        grounds:
          - state_machines.Order.READY_FOR_PICKUP_to_PICKED_UP
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair: Order fulfillment_status vs Order payment_status
          (two axes on the SAME entity, parallel-state cross-dependency).
          BOPIS Order with rental attached is paid DEPOSIT, driven through
          start-picking and mark-ready (both permit DEPOSIT_HELD), reaching
          fulfillment_status=READY_FOR_PICKUP AND payment_status=DEPOSIT_HELD.
          Pickup rejects because pickup precondition requires payment_status
          == PAID.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer + one TABLEWARE SKU on_hand=20. BOPIS Order with 1 line + attached RentalContract (deposit-eligible)."
            - "Reserve, pay DEPOSIT, start-picking, mark-ready → payment_status=DEPOSIT_HELD, fulfillment_status=READY_FOR_PICKUP."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "leo@example.com", full_name: "Leo Bopis" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "PLATE-BOPIS", category: "TABLEWARE", unit_price_cents: 500 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /api/skus/${sku_id}/restock"
              payload: { delta: 20 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "BOPIS", lines: [{ sku_id: "${sku_id}", qty: 1 }], pickup_window_start: "2026-06-15T14:00:00Z", pickup_window_end: "2026-06-15T18:00:00Z" }
              as: StoreClerk
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /api/rental-contracts"
              payload: { order_id: "${order_id}", sku_id: "${sku_id}", qty: 2, rental_start: "2026-06-16T00:00:00Z", rental_end: "2026-06-20T00:00:00Z" }
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/reserve"
              payload: { expected_order_version: "${order_v}" }
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/pay"
              payload: { mode: "DEPOSIT" }
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/start-picking"
              payload: {}
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/mark-ready"
              payload: {}
              as: StoreClerk
              captures: { after_ready_fulfillment: $.data.fulfillment_status, after_ready_payment: $.data.payment_status }
          trigger:
            - call: "POST /api/orders/${order_id}/pickup"
              payload: {}
              as: StoreClerk
              captures: { pickup_err: $.data.error_id }
          assert:
            - "after_ready_fulfillment == 'READY_FOR_PICKUP'"
            - "after_ready_payment == 'DEPOSIT_HELD'"
            - "pickup_err == 'ERR_INVALID_STATE'"

      - name: event_confirm_requires_order_payment_deposit_or_paid
        grounds:
          - state_machines.EventBooking.HELD_to_CONFIRMED
          - entities.Order.fields.payment_status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Different entity pair: EventBooking depends on parent Order's
          payment_status (cross-aggregate). Even with sufficient lead time,
          confirm rejects when Order.payment_status == UNPAID.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer + Order + EventBooking with event_date 2026-07-30 (45+ days ahead — well above min_lead_days=7)."
            - "Order reserved but NOT paid (payment_status remains UNPAID)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "mia@example.com", full_name: "Mia Event" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "DECOR-BALL-01", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /api/skus/${sku_id}/restock"
              payload: { delta: 20 }
              as: StoreManager
            - call: "POST /api/event-packages"
              payload: { package_code: "WEDDING-100", base_price_cents: 50000, deposit_pct: 0.20, min_lead_days: 7 }
              as: StoreManager
              captures: { pkg_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${sku_id}", qty: 1 }] }
              as: StoreClerk
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /api/event-bookings"
              payload: { order_id: "${order_id}", event_package_id: "${pkg_id}", event_date: "2026-07-30T18:00:00Z" }
              as: StoreClerk
              captures: { booking_id: $.data.id }
            - call: "POST /api/orders/${order_id}/reserve"
              payload: { expected_order_version: "${order_v}" }
              as: StoreClerk
              captures: { after_reserve_payment: $.data.payment_status }
          trigger:
            - call: "POST /api/event-bookings/${booking_id}/confirm"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "after_reserve_payment == 'UNPAID'"
            - "err == 'ERR_INVALID_STATE'"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval
  # semantics AND different resource entities.
  # Instance A: DeliverySlot — HALF-OPEN [start,end) overlap on same van_id
  #   (adjacent slots at start==end DO NOT collide).
  # Instance B: RentalContract — AGGREGATE-CAPACITY overlap on same sku
  #   (adjacent identical windows across contracts DO sum against on_hand_qty).
  # Semantics differ: strict half-open point-overlap vs aggregate-capacity
  # overlap. Resource entities differ: DeliverySlot vs RentalContract.
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: delivery_slot_half_open_adjacent_permits
        grounds:
          - validations[priority=12]
          - errors[ERR_DELIVERY_SLOT_CONFLICT]
          - entities.DeliverySlot.fields.window_start
          - entities.DeliverySlot.fields.window_end
          - entities.DeliverySlot.fields.van_id
        distinguishing_aspect: |
          Half-open [start, end) — a slot [10:00, 12:00) and [12:00, 14:00) on
          the same van are NON-overlapping (adjacent, gap=0). Any slot that
          strictly overlaps yields ERR_DELIVERY_SLOT_CONFLICT.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T09:00:00Z. Two adjacent delivery slots on van V1 at [10:00,12:00) and [12:00,14:00) — both created successfully."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T09:00:00Z" }
              as: StoreClerk
            - call: "POST /api/delivery-slots"
              payload: { window_start: "2026-06-15T10:00:00Z", window_end: "2026-06-15T12:00:00Z", van_id: "V1" }
              as: StoreClerk
              captures: { slot_a_id: $.data.id }
            - call: "POST /api/delivery-slots"
              payload: { window_start: "2026-06-15T12:00:00Z", window_end: "2026-06-15T14:00:00Z", van_id: "V1" }
              as: StoreClerk
              captures: { slot_b_id: $.data.id }
          trigger:
            - call: "POST /api/delivery-slots"
              payload: { window_start: "2026-06-15T11:30:00Z", window_end: "2026-06-15T12:30:00Z", van_id: "V1" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_DELIVERY_SLOT_CONFLICT'"

      - name: rental_contract_aggregate_capacity_overlap
        grounds:
          - validations[priority=13]
          - errors[ERR_RENTAL_OVERLAP_CAPACITY]
          - entities.RentalContract.fields.rental_start
          - entities.RentalContract.fields.rental_end
          - entities.Sku.fields.on_hand_qty
        distinguishing_aspect: |
          Aggregate-capacity semantics: two rentals on the SAME sku in
          overlapping windows can coexist as long as their SUM stays within
          on_hand_qty. Here on_hand_qty=8, contract A holds qty=6, contract B
          asks qty=3 in overlapping window → 6+3=9>8, rejected. If B asked
          qty=2, 6+2=8=capacity, would succeed. Different interval semantics
          than instance A (aggregate sum vs strict half-open point-overlap).
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer + TABLEWARE SKU on_hand_qty=8."
            - "Existing RentalContract A qty=6 in [2026-06-16, 2026-06-20)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "nora@example.com", full_name: "Nora Table" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "PLATE-SILVER", category: "TABLEWARE", unit_price_cents: 300 }
              as: StoreManager
              captures: { plate_id: $.data.id }
            - call: "POST /api/skus/${plate_id}/restock"
              payload: { delta: 8 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${plate_id}", qty: 1 }] }
              as: StoreClerk
              captures: { order_a_id: $.data.id }
            - call: "POST /api/rental-contracts"
              payload: { order_id: "${order_a_id}", sku_id: "${plate_id}", qty: 6, rental_start: "2026-06-16T00:00:00Z", rental_end: "2026-06-20T00:00:00Z" }
              as: StoreClerk
              captures: { rental_a_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${plate_id}", qty: 1 }] }
              as: StoreClerk
              captures: { order_b_id: $.data.id }
          trigger:
            - call: "POST /api/rental-contracts"
              payload: { order_id: "${order_b_id}", sku_id: "${plate_id}", qty: 3, rental_start: "2026-06-18T00:00:00Z", rental_end: "2026-06-19T00:00:00Z" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_RENTAL_OVERLAP_CAPACITY'"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved
  # quantities.
  # Instance A: SKU inventory — pickup (-qty on_hand) followed by return
  #   (+qty on_hand) leaves Sku.on_hand_qty unchanged from its pre-pickup value.
  # Instance B: helium cubic-ft — reserve (waterfall debit) followed by
  #   cancel (refund each debited tank) leaves SUM(HeliumTank.remaining_cubic_ft)
  #   unchanged.
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: sku_on_hand_conserved_pickup_then_return
        grounds:
          - state_machines.Order.READY_FOR_PICKUP_to_PICKED_UP
          - state_machines.Order.PICKED_UP_or_DELIVERED_to_RETURNED
          - entities.Sku.fields.on_hand_qty
        distinguishing_aspect: |
          Conserved quantity: Sku.on_hand_qty. Formula pinned:
          on_hand_qty_after_return == on_hand_qty_before_pickup for any
          Order whose lines all return (non-clearance). Any drift (e.g.,
          double-debit on cascade) breaks the invariant.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer + one non-clearance BALLOON_LATEX SKU on_hand_qty=100."
            - "Order BOPIS: 1 line qty=7. Reserve + pay FULL + start-picking + mark-ready. Snapshot on_hand_qty=100."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "oli@example.com", full_name: "Oli Balloon" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "BAL-LATEX-11-YEL", category: "BALLOON_LATEX", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /api/skus/${sku_id}/restock"
              payload: { delta: 100 }
              as: StoreManager
            - call: "GET /api/skus/${sku_id}"
              payload: {}
              as: StoreClerk
              captures: { on_hand_before: $.data.on_hand_qty }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "BOPIS", lines: [{ sku_id: "${sku_id}", qty: 7 }], pickup_window_start: "2026-06-15T14:00:00Z", pickup_window_end: "2026-06-15T18:00:00Z" }
              as: StoreClerk
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /api/orders/${order_id}/reserve"
              payload: { expected_order_version: "${order_v}" }
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/pay"
              payload: { mode: "FULL" }
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/start-picking"
              payload: {}
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/mark-ready"
              payload: {}
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/pickup"
              payload: {}
              as: StoreClerk
            - call: "GET /api/skus/${sku_id}"
              payload: {}
              as: StoreClerk
              captures: { on_hand_after_pickup: $.data.on_hand_qty }
          trigger:
            - call: "POST /api/orders/${order_id}/return"
              payload: {}
              as: StoreClerk
            - call: "GET /api/skus/${sku_id}"
              payload: {}
              as: StoreClerk
              captures: { on_hand_after_return: $.data.on_hand_qty }
          assert:
            - "on_hand_before == 100"
            - "on_hand_after_pickup == 93"
            - "on_hand_after_return == 100"

      - name: helium_cubic_ft_conserved_reserve_then_cancel
        grounds:
          - state_machines.Order.DRAFT_to_RESERVED
          - state_machines.Order.DRAFT_RESERVED_PICKING_to_CANCELLED
          - entities.HeliumTank.fields.remaining_cubic_ft
          - calculations.helium_tank_waterfall_allocation
        distinguishing_aspect: |
          DIFFERENT conserved quantity than instance A (helium volume, not
          SKU count). Formula pinned: SUM(HeliumTank.remaining_cubic_ft
          where status=ACTIVE) after cancel == SUM before reserve. Waterfall
          debit at reserve MUST be exactly refunded at cancel (per-tank
          amounts, not a blanket credit to a single tank).
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer + dummy SKU + ONE active tank capacity 50 cu.ft (remaining 50)."
            - "Order DRAFT with HeliumOrder latex_count=20, foil_count=4 → required = 20*0.5 + 4*1.5 = 16 cu.ft."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "pat@example.com", full_name: "Pat Refill" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "DECOR-STAR-01", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /api/skus/${sku_id}/restock"
              payload: { delta: 10 }
              as: StoreManager
            - call: "POST /api/helium-tanks"
              payload: { tank_code: "TANK-COMPENS", capacity_cubic_ft: 50 }
              as: StoreManager
              captures: { tank_id: $.data.id, tank_before: $.data.remaining_cubic_ft }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", channel: "IN_STORE", lines: [{ sku_id: "${sku_id}", qty: 1 }] }
              as: StoreClerk
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /api/orders/${order_id}/helium"
              payload: { latex_count: 20, foil_count: 4 }
              as: StoreClerk
            - call: "POST /api/orders/${order_id}/reserve"
              payload: { expected_order_version: "${order_v}" }
              as: StoreClerk
            - call: "GET /api/helium-tanks/${tank_id}"
              payload: {}
              as: StoreClerk
              captures: { tank_after_reserve: $.data.remaining_cubic_ft }
          trigger:
            - call: "POST /api/orders/${order_id}/cancel"
              payload: {}
              as: StoreClerk
            - call: "GET /api/helium-tanks/${tank_id}"
              payload: {}
              as: StoreClerk
              captures: { tank_after_cancel: $.data.remaining_cubic_ft }
          assert:
            - "tank_before == 50"
            - "tank_after_reserve == 34"
            - "tank_after_cancel == 50"
