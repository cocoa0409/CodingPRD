              as_user_id: "u-cm-1"
              captures: { m_status: $.data.status, m_count: $.data.approval_count }
          assert:
            - "${req_h} == 2 and ${req_m} == 1"
            - "${h_status_1} == UNDER_REVIEW and ${h_count_1} == 1 (quorum not reached, the state machine self-loops)"
            - "${h_status_2} == APPROVED and ${h_count_2} == 2"
            - "${m_status} == APPROVED and ${m_count} == 1"
            - "Hall.${hall_id}.open_mop_count == 0 (APPROVED is not yet SCHEDULED) and release_posture == OPEN"

      - name: busway_usable_kw_variant_divergence_on_same_inputs
        claim_type: variant_divergence
        grounds:
          - calculations.busway_usable_kw.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / busway_usable_kw_design_vs_commissioned_divergence
          rationale: "That §1.8 instance computes both variants over one busway with measured_derate_factor 0.93 and asserts the exact DESIGN 196.66 vs COMMISSIONED 182.89 delta."

      - name: busway_usable_variant_selected_by_hall_phase
        claim_type: variant_selection
        grounds:
          - calculations.busway_usable_kw.variants
          - state_machines.Hall.FIT_OUT_to_COMMISSIONING
        excluded_because:
          difficulty_instance: dual_variant_calc / busway_usable_kw_design_vs_commissioned_divergence
          rationale: "The same §1.8 instance drives the FIT_OUT -> COMMISSIONING advance that flips usable_variant and asserts the recomputed usable_kw on the phase response."

      - name: busway_variant_switch_reconciles_committed_headroom
        claim_type: reconciliation
        grounds:
          - calculations.busway_usable_kw.variants
          - validations[priority=34]
        excluded_because:
          difficulty_instance: dual_variant_calc / busway_usable_kw_design_vs_commissioned_divergence
          rationale: "That §1.8 instance also asserts the phase-advance re-check that refuses COMMISSIONING when a DESIGN-legal committed_kw exceeds the COMMISSIONED usable_kw, which is the reconciliation of the two variants against the ledger."

      - name: cooling_capacity_variant_divergence_under_leakage
        claim_type: variant_divergence
        grounds:
          - calculations.hall_cooling_model.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / cooling_capacity_nameplate_vs_airflow_divergence
          rationale: "That §1.8 instance moves the binding variant by raising measured containment leakage and asserts both published capacities plus the min() gate at each step."

      - name: rack_chargeable_precision_round_then_sum
        claim_type: precision
        grounds:
          - calculations.rack_chargeable_rollup.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / hall_chargeable_kw_round_then_sum
          rationale: "That §1.8 instance pins the per-rack round-then-sum against the sum-then-round alternative with three racks whose halves force a divergent total."

      - name: hall_reserve_tier_constants_and_evaluation_order
        claim_type: constants_applied
        grounds:
          - calculations.hall_power_ledger.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / hall_reserve_tier_keyed_on_committed_kw_evaluation_order
          rationale: "That §1.8 instance walks committed_kw across the 100.00 and 250.00 tier boundaries and asserts the reserve stays keyed on committed_kw rather than on spare_kw."

      - name: busway_capacity_threshold_at_exact_usable_kw
        claim_type: threshold
        grounds:
          - calculations.busway_usable_kw
          - validations[priority=44]
        excluded_because:
          difficulty_instance: boundary_precision_check / busway_capacity_equality_admits_feed_at_exact_usable_kw
          rationale: "That §1.8 instance reserves a feed that lands committed_kw exactly on usable_kw and then proves the next 0.001 kW is refused."

      - name: package_state_projection_replays_both_dimensions
        claim_type: projection
        grounds:
          - calculations.package_state_projection
        excluded_because:
          difficulty_instance: non_linear_state_machine / commissioning_package_parallel_script_and_witness_dimensions
          rationale: "That §1.8 instance re-derives package_state after each dimension move (DRAFT, IN_EXECUTION, FAILED, CERTIFIED) and asserts the precedence order of the projection."

      - name: cooling_model_constraint_propagation_from_leak_to_package
        claim_type: constraint_propagation
        grounds:
          - calculations.hall_cooling_model
          - calculations.hall_release_posture
        excluded_because:
          difficulty_instance: transitive_cascade / containment_leak_failure_blocks_level_four_packages
          rationale: "That §1.8 instance propagates one leakage measurement through cooling capacity, thermal_posture, package blocking and release_posture and asserts the chain reaches a fixed point in a single response."

      - name: load_bank_window_occupancy_aggregates_overlapping_runs
        claim_type: aggregation
        grounds:
          - calculations.load_bank_window_occupancy
        excluded_because:
          difficulty_instance: resource_temporal_overlap / loadbank_aggregate_reserve_and_concurrency_on_hall
          rationale: "That §1.8 instance stacks overlapping runs until both the reserve sum and the concurrency count are exceeded and asserts which ceiling fires first."

  - section: validations
    instances:

      - name: validation_priority_ordering_body_shape_beats_missing_fk
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Body-shape validation sits at priority 4 and body FK resolution at priority 6, so a request that both names an enum outside its domain and points at a non-existent busway returns ERR_VALIDATION 422 — never ERR_BUSWAY_NOT_FOUND 404."
        test_recipe:
          setup:
            - "Hall CX50 is in FIT_OUT with rack R-1-1 (required_feed_count 2) PLANNED; no busway with id 00000000-0000-0000-0000-0000000000ff exists."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 50", code: "CX50", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 1, design_kw: 10.00, u_height: 45, required_feed_count: 2 }
              as: FacilityPlanner
              captures: { rack1_id: $.data.id }
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
          trigger:
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "00000000-0000-0000-0000-0000000000ff", feed_side: "C", requested_kw: 7.50, breaker_amps: 32 }
              as: ElectricalContractor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and ${err} == ERR_VALIDATION"
            - "no RackFeed row was created and Rack.${rack1_id}.energized_feed_count == 0"
            - "Hall.${hall_id}.committed_kw == 0.00 and spare_kw == 375.00"

      - name: rack_create_hall_mismatch_outranks_duplicate_grid_position
        claim_type: priority_conflict
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_HALL_MISMATCH]
        distinguishing_aspect: "A create that is simultaneously cross-hall (zone from hall CX51 under hall CX52) and a grid collision inside CX52 returns ERR_HALL_MISMATCH 422 at priority 8, not ERR_DUPLICATE_GRID_POSITION 409 at priority 11 — the coherence check runs before uniqueness."
        test_recipe:
          setup:
            - "Hall CX51 owns containment zone CA-51; hall CX52 owns containment zone CA-52 and already has rack R-1-1 at (grid_row 1, grid_col 1)."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 51", code: "CX51", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_a_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_a_id}", label: "CA-51", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
              captures: { zone_a_id: $.data.id }
            - call: "POST /halls"
              payload: { name: "Corner Hall 52", code: "CX52", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_b_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_b_id}", label: "CA-52", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
              captures: { zone_b_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_b_id}", containment_zone_id: "${zone_b_id}", grid_row: "1", grid_col: 1, design_kw: 10.00, u_height: 45, required_feed_count: 2 }
              as: FacilityPlanner
              captures: { rack_b1_id: $.data.id }
          trigger:
            - call: "POST /racks"
              payload: { hall_id: "${hall_b_id}", containment_zone_id: "${zone_a_id}", grid_row: "1", grid_col: 1, design_kw: 10.00, u_height: 45, required_feed_count: 2 }
              as: FacilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and ${err} == ERR_HALL_MISMATCH"
            - "Hall.${hall_b_id}.rack_total_count == 1 (only R-1-1 exists) and Hall.${hall_a_id}.rack_total_count == 0"
            - "GET /racks?hall_id=${hall_b_id} returns exactly 1 row, id ${rack_b1_id}"

      - name: rack_power_on_requires_containment_zone_at_pass
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=32]
          - errors[ERR_CONTAINMENT_NOT_PASSED]
          - calculations.hall_cooling_model
        distinguishing_aspect: "Power-on validity depends on a different entity's state: with the rack's own topology complete and both busways ENERGIZED, an UNTESTED containment zone still returns ERR_CONTAINMENT_NOT_PASSED 409 at priority 32 — ahead of the cooling-margin check at 43 that would also fail with no duty unit."
        test_recipe:
          setup:
            - "Hall CX53 is in FIT_OUT with PDU-A1/PDU-B1 COMMISSIONED at 1.00, BW-A1 and BW-B1 ENERGIZED, containment zone CA-1 still UNTESTED and no cooling unit in service."
            - "Rack R-1-1 (design_kw 10.00, required_feed_count 2) is INSTALLED with two 5.00 kW / 32 A RESERVED feeds on distinct sides."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 53", code: "CX53", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_b_id: $.data.id }
            - call: "PATCH /pdus/${pdu_a_id}"
              payload: { measured_derate_factor: 1.00 }
              as: ElectricalContractor
            - call: "PATCH /pdus/${pdu_b_id}"
              payload: { measured_derate_factor: 1.00 }
              as: ElectricalContractor
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_b_id}", name: "BW-B1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_b_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 1, design_kw: 10.00, u_height: 45, required_feed_count: 2 }
              as: FacilityPlanner
              captures: { rack1_id: $.data.id }
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
            - call: "POST /busways/${bw_a_id}/energize"
              payload: {}
              as: ElectricalContractor
            - call: "POST /busways/${bw_b_id}/energize"
              payload: {}
              as: ElectricalContractor
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_a_id}", feed_side: "A", requested_kw: 5.00, breaker_amps: 32 }
              as: ElectricalContractor
              captures: { feed_a_id: $.data.id }
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_b_id}", feed_side: "B", requested_kw: 5.00, breaker_amps: 32 }
              as: ElectricalContractor
              captures: { feed_b_id: $.data.id }
            - call: "POST /racks/${rack1_id}/install"
              payload: { asset_tag: "AT-0053" }
              as: FacilityPlanner
          trigger:
            - call: "POST /racks/${rack1_id}/power-on"
              payload: {}
              as: ElectricalContractor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_CONTAINMENT_NOT_PASSED"
            - "Rack.${rack1_id}.status == INSTALLED and energized_feed_count == 0"
            - "RackFeed.${feed_a_id}.status == RESERVED and RackFeed.${feed_b_id}.status == RESERVED"
            - "Hall.${hall_id}.custody_ops_count == 0, custody_fitout_count == 1 and thermal_load_kw == 0.00"

      - name: mop_submit_rejects_window_start_in_the_past
        claim_type: temporal_validation
        grounds:
          - validations[priority=23]
          - errors[ERR_OUTSIDE_EXECUTION_WINDOW]
        distinguishing_aspect: "Submit is judged against the logical clock, not against execution: with now at 2026-08-15T00:00:00Z a MOP whose window opened 2026-08-10T02:00:00Z returns ERR_OUTSIDE_EXECUTION_WINDOW 409 and stays in DRAFT with required_approval_count still 0."
        test_recipe:
          setup:
            - "The logical clock is at 2026-08-15T00:00:00Z."
            - "Hall CX54 owns PDU-A1 and busway BW-A1; MOP-1 (target BUSWAY BW-A1, risk_class MEDIUM, window 2026-08-10T02:00:00Z .. 2026-08-10T06:00:00Z) was authored by u-elec-1 and is DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ElectricalContractor
            - call: "POST /halls"
              payload: { name: "Corner Hall 54", code: "CX54", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /mops"
              payload: { hall_id: "${hall_id}", target_resource_type: "BUSWAY", target_resource_id: "${bw_a_id}", title: "Late torque check", risk_class: "MEDIUM", backout_plan: "Re-close the tap box.", window_start: "2026-08-10T02:00:00Z", window_end: "2026-08-10T06:00:00Z" }
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              captures: { mop_id: $.data.id }
          trigger:
            - call: "POST /mops/${mop_id}/submit"
              payload: {}
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_OUTSIDE_EXECUTION_WINDOW"
            - "MethodOfProcedure.${mop_id}.status == DRAFT, required_approval_count == 0 and approval_count == 0"
            - "Hall.${hall_id}.open_mop_count == 0 and release_posture == OPEN"

      - name: hall_spare_capacity_aggregate_violation_on_second_feed
        claim_type: aggregate_validation
        grounds:
          - validations[priority=45]
          - calculations.hall_power_ledger
          - errors[ERR_HALL_SPARE_CAPACITY_EXCEEDED]
        distinguishing_aspect: "Each 40.00 kW reservation is individually legal on a 196.66 kW busway with a 54.63 kW breaker ceiling, but collectively 80.00 committed plus the 25.00 tier-1 reserve exceeds a 100.00 kW hall, so the second feed returns ERR_HALL_SPARE_CAPACITY_EXCEEDED 422 and the ledger stays at the first reservation."
        test_recipe:
          setup:
            - "Hall CX55 (design_kw_capacity 100.00) is in FIT_OUT with PDU-A1 COMMISSIONED at 1.00 and BW-A1 ENERGIZED (usable_kw 196.66)."
            - "Racks R-1-1 and R-1-2 (design_kw 40.00, required_feed_count 1) are PLANNED; R-1-1 already holds one 40.00 kW / 100 A RESERVED feed, so committed_kw is 40.00 and spare_kw is 35.00."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 55", code: "CX55", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 100.00, gross_area_sqm: 200.0, cooling_redundancy: "N", planned_rack_count: 4 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
            - call: "PATCH /pdus/${pdu_a_id}"
              payload: { measured_derate_factor: 1.00 }
              as: ElectricalContractor
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 1, design_kw: 40.00, u_height: 45, required_feed_count: 1 }
              as: FacilityPlanner
              captures: { rack1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 2, design_kw: 40.00, u_height: 45, required_feed_count: 1 }
              as: FacilityPlanner
              captures: { rack2_id: $.data.id }
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
            - call: "POST /busways/${bw_a_id}/energize"
              payload: {}
              as: ElectricalContractor
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_a_id}", feed_side: "A", requested_kw: 40.00, breaker_amps: 100 }
