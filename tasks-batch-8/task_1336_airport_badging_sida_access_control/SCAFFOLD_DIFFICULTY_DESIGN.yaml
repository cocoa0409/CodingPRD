# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Airport Badging & SIDA Access Control
# 9 rules x 2 instances = 18 instances. All times are logical-clock times;
# server default clock is 2026-08-01T00:00:00Z until set otherwise.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: audit_recovery_provisional_vs_final
        grounds:
          - calculations.audit_recovery_rate
          - entities.AuditCycle.fields.recovery_rate_provisional_pct
          - entities.AuditCycle.fields.recovery_rate_pct
        distinguishing_aspect: |
          On identical deactivation data the provisional variant (denominator = only
          badges whose 30-day return deadline has passed) reads 100.00 while the final
          variant at close (denominator = entire deactivation scope) reads 50.00 —
          AuditCycle/Badge domain, distinct from the training-currency domain of the
          sibling instance.
        test_recipe:
          setup:
            - "Sponsor AF (quota 5) with two badged holders: b1 (STERILE, badge B101) and b2 (SIDA, badge B102), both issued at the default clock 2026-08-01"
            - "b1 revoked at 2026-08-10 (return_deadline 2026-09-09) and physically returned at 2026-08-12; b2 revoked at 2026-08-20 (return_deadline 2026-09-19), never returned"
            - "Audit cycle au1 OPEN over [2026-01-01, 2027-01-01); logical clock parked at 2026-08-20"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B101" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ben Okafor", date_of_birth: "1988-05-02", government_id_number: "G1002" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a2: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a2}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap2: $.data.id } }
            - { call: "POST /badging/applications/${ap2}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a2}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a2}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/issue-badge", payload: { badge_number: "B102" }, as: BadgingOfficer, captures: { b2: $.data.id } }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/badges/${b1}/revoke", payload: { reason: "credential misuse" }, as: SecurityManager }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/badges/${b1}/mark-returned", payload: {}, as: BadgingOfficer }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/badges/${b2}/revoke", payload: { reason: "employment ended" }, as: SecurityManager }
            - { call: "POST /badging/audit-cycles", payload: { window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Auditor, captures: { au1: $.data.id } }
          trigger:
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: Auditor }
            - { call: "GET /badging/audit-cycles/${au1}", payload: {}, as: Auditor, captures: { prov_rate: $.data.recovery_rate_provisional_pct, prov_due: $.data.due_scoped_count, prov_due_acc: $.data.due_accounted_count } }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: Auditor }
            - { call: "POST /badging/audit-cycles/${au1}/close", payload: {}, as: Auditor, captures: { fin_scoped: $.data.scoped_count, fin_accounted: $.data.accounted_count, fin_rate: $.data.recovery_rate_pct, fin_outcome: $.data.outcome, prov_after: $.data.recovery_rate_provisional_pct } }
          assert:
            - "provisional read at 2026-09-10: ${prov_due} == 1 (only b1's deadline 2026-09-09 has passed; b2's 2026-09-19 has not)"
            - "provisional read at 2026-09-10: ${prov_due_acc} == 1 and ${prov_rate} == 100.00"
            - "at close: ${fin_scoped} == 2 and ${fin_accounted} == 1"
            - "at close: ${fin_rate} == 50.00 (full-scope denominator) — diverges from the 100.00 provisional on the same data"
            - "at close: ${fin_outcome} == DEFICIENT and ${prov_after} == null"

      - name: training_currency_strict_vs_renewal_grace
        grounds:
          - calculations.training_currency_check
          - state_machines.Badge.ACTIVE_to_VOIDED
          - entities.TrainingCompletion.fields.expires_at
        distinguishing_aspect: |
          Identical completion data (STERILE_INITIAL expiring 2027-07-10, read at
          2027-07-20 — lapsed 10 days) passes the renewal_grace variant (replace
          succeeds, new badge expires 2027-08-09) but fails the strict variant (a
          fresh application can never reach READY) — Applicant/TrainingCompletion
          domain, distinct from the AuditCycle domain of the sibling instance.
        test_recipe:
          setup:
            - "Sponsor SC (quota 5); applicant a1 holds STERILE badge b1 (B201) issued 2026-08-01 with expires_at 2027-07-10 (bound by training)"
            - "Logical clock at 2027-07-20: b1 has been swept to EXPIRED"
            - "Applicant a2 has a STERILE application ap2 (submitted 2027-07-20, CHRC PASS, STA CLEARED) whose only completion also expires 2027-07-10; ap2 rests in PENDING_REQUIREMENTS"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "SkyChefs", sponsor_code: "SC", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Cara Dunn", date_of_birth: "1992-03-04", government_id_number: "G2001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-07-10T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B201" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2027-07-20T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Dan Eells", date_of_birth: "1995-07-08", government_id_number: "G2002" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a2: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a2}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap2: $.data.id } }
            - { call: "POST /badging/applications/${ap2}/record-chrc", payload: { fingerprint_submitted_at: "2027-07-20T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a2}", course_code: "STERILE_INITIAL", completed_at: "2026-07-10T00:00:00Z" }, as: BadgingOfficer }
          trigger:
            - { call: "POST /badging/badges/${b1}/replace", payload: { badge_number: "B201R" }, as: BadgingOfficer, captures: { nb_id: $.data.id, nb_status: $.data.status, nb_exp: $.data.expires_at } }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: BadgingOfficer, captures: { old_status: $.data.status, old_sup: $.data.superseded_by_badge_id } }
            - { call: "POST /badging/applications/${ap2}/issue-badge", payload: { badge_number: "B202" }, as: BadgingOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /badging/applications/${ap2}", payload: {}, as: BadgingOfficer, captures: { ap2_status: $.data.status } }
          assert:
            - "renewal_grace variant: replace of lapsed-training badge succeeds — ${nb_status} == ACTIVE"
            - "renewal expiry uses grace-extended horizon: ${nb_exp} == 2027-08-09T00:00:00Z (min(2029-07-20, 2027-07-10 + 30 days))"
            - "old badge: ${old_status} == VOIDED and ${old_sup} == ${nb_id} (superseded-by link points at the replacement)"
            - "strict variant: same completion data cannot support initial issuance — ${err} == ERR_APPLICATION_NOT_READY and ${ap2_status} == PENDING_REQUIREMENTS"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (a) nested min, (b) rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: badge_expiry_nested_min_inputs
        grounds:
          - calculations.badge_expiry_computation
          - entities.Badge.fields.expires_at
        distinguishing_aspect: |
          Mode (a): expires_at = min(issued_at + 24 months, per-course horizons) —
          a nested-min over >= 3 inputs where the binding input differs per class:
          SIDA binds on SIDA_INITIAL (2027-06-01, below the 24-month cap 2028-08-01),
          STERILE binds on its single course horizon (2027-07-10).
        test_recipe:
          setup:
            - "Sponsor NM (quota 5); applicant a1 fully cleared for SIDA with SIDA_INITIAL expiring 2027-06-01 and AOA_SAFETY expiring 2028-06-01"
            - "Applicant a2 fully cleared for STERILE with STERILE_INITIAL expiring 2027-07-10"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "North Maintenance", sponsor_code: "NM", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Eli Finn", date_of_birth: "1991-02-02", government_id_number: "G3001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B301" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Fay Goss", date_of_birth: "1993-06-06", government_id_number: "G3002" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a2: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a2}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap2: $.data.id } }
            - { call: "POST /badging/applications/${ap2}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a2}", course_code: "STERILE_INITIAL", completed_at: "2026-07-10T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/issue-badge", payload: { badge_number: "B302" }, as: BadgingOfficer, captures: { b2: $.data.id } }
          trigger:
            - { call: "GET /badging/badges/${b1}", payload: {}, as: BadgingOfficer, captures: { exp1: $.data.expires_at } }
            - { call: "GET /badging/badges/${b2}", payload: {}, as: BadgingOfficer, captures: { exp2: $.data.expires_at } }
          assert:
            - "SIDA badge: ${exp1} == 2027-06-01T00:00:00Z (min(2028-08-01 cap, 2027-06-01 SIDA_INITIAL, 2028-06-01 AOA_SAFETY) — training binds, not the cap)"
            - "STERILE badge: ${exp2} == 2027-07-10T00:00:00Z (min(2028-08-01 cap, 2027-07-10))"

      - name: audit_overall_rate_aggregate_then_round
        grounds:
          - calculations.audit_recovery_rate
          - entities.AuditCycle.fields.per_class_rates
        distinguishing_aspect: |
          Mode (b): the overall recovery rate is pinned as aggregate-then-round over
          the full scope (1/3 -> 33.33), which observably differs from the forbidden
          mean-of-rounded-per-class-rates ((50.00 + 0.00) / 2 = 25.00) — rounding
          order changes the published number.
        test_recipe:
          setup:
            - "Sponsor AR (quota 5) with three badges: b1 (STERILE, B401), b2 (STERILE, B402), b3 (SIDA, B403), all issued at the default clock"
            - "All three revoked at 2027-03-01 (deactivated inside the audit window); only b1 is returned (2027-03-02); clock parked at 2027-04-01"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AirRetail", sponsor_code: "AR", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Gus Hale", date_of_birth: "1990-11-11", government_id_number: "G4001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B401" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Hana Ives", date_of_birth: "1989-12-12", government_id_number: "G4002" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a2: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a2}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap2: $.data.id } }
            - { call: "POST /badging/applications/${ap2}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a2}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/issue-badge", payload: { badge_number: "B402" }, as: BadgingOfficer, captures: { b2: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ian Judd", date_of_birth: "1987-01-01", government_id_number: "G4003" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a3: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a3}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap3: $.data.id } }
            - { call: "POST /badging/applications/${ap3}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap3}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a3}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a3}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap3}/issue-badge", payload: { badge_number: "B403" }, as: BadgingOfficer, captures: { b3: $.data.id } }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2027-03-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/badges/${b1}/revoke", payload: { reason: "term1" }, as: SecurityManager }
            - { call: "POST /badging/badges/${b2}/revoke", payload: { reason: "term2" }, as: SecurityManager }
            - { call: "POST /badging/badges/${b3}/revoke", payload: { reason: "term3" }, as: SecurityManager }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2027-03-02T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/badges/${b1}/mark-returned", payload: {}, as: BadgingOfficer }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2027-04-01T00:00:00Z" }, as: Auditor }
          trigger:
            - { call: "POST /badging/audit-cycles", payload: { window_start: "2027-01-01T00:00:00Z", window_end: "2028-01-01T00:00:00Z" }, as: Auditor, captures: { au1: $.data.id } }
            - { call: "POST /badging/audit-cycles/${au1}/close", payload: {}, as: Auditor, captures: { scoped: $.data.scoped_count, accounted: $.data.accounted_count, rate: $.data.recovery_rate_pct, outcome: $.data.outcome, per_class: $.data.per_class_rates } }
          assert:
            - "${scoped} == 3 and ${accounted} == 1"
            - "${rate} == 33.33 — aggregate-then-round of round(100*1/3, 2); the forbidden mean of rounded per-class rates would be 25.00"
            - "${per_class} == [ { badge_class: SIDA, scoped: 1, accounted: 0, rate_pct: 0.00 }, { badge_class: STERILE, scoped: 2, accounted: 1, rate_pct: 50.00 } ] (alphabetical by badge_class)"
            - "${outcome} == DEFICIENT (33.33 < 95.00)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: badge_suspend_reinstate_cycle
        grounds:
          - state_machines.Badge.ACTIVE_to_SUSPENDED
          - state_machines.Badge.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          The Badge machine is cyclic: ACTIVE -> SUSPENDED -> ACTIVE -> SUSPENDED ->
          ACTIVE loops twice in one test, with suspension fields set and cleared on
          each pass — entity Badge, distinct from the sibling's BadgeApplication.
        test_recipe:
          setup:
            - "Sponsor CY (quota 5); applicant a1 with STERILE badge b1 (B501) ACTIVE"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "CityCabs", sponsor_code: "CY", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Jesse Kay", date_of_birth: "1994-04-04", government_id_number: "G5001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B501" }, as: BadgingOfficer, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /badging/badges/${b1}/suspend", payload: { reason: "investigation" }, as: SecurityManager, as_user_id: "mgr-1", captures: { st1: $.data.status, by1: $.data.suspended_by, until1: $.data.suspended_until } }
            - { call: "POST /badging/badges/${b1}/reinstate", payload: {}, as: SecurityManager, as_user_id: "mgr-2", captures: { st2: $.data.status, by2: $.data.suspended_by } }
            - { call: "POST /badging/badges/${b1}/suspend", payload: { reason: "second incident" }, as: SecurityManager, as_user_id: "mgr-2", captures: { st3: $.data.status, by3: $.data.suspended_by } }
            - { call: "POST /badging/badges/${b1}/reinstate", payload: {}, as: SecurityManager, as_user_id: "mgr-1", captures: { st4: $.data.status, by4: $.data.suspended_by } }
          assert:
            - "first pass: ${st1} == SUSPENDED, ${by1} == mgr-1, ${until1} == null (manual suspension is immediately reinstatable)"
            - "cycle back: ${st2} == ACTIVE and ${by2} == null (suspension fields cleared)"
            - "loop repeats: ${st3} == SUSPENDED with ${by3} == mgr-2, then ${st4} == ACTIVE with ${by4} == null"

      - name: application_ready_regression_loop
        grounds:
          - state_machines.BadgeApplication.PENDING_REQUIREMENTS_to_READY
          - state_machines.BadgeApplication.READY_to_PENDING_REQUIREMENTS
          - calculations.training_currency_check
        distinguishing_aspect: |
          The BadgeApplication machine cycles PENDING_REQUIREMENTS -> READY ->
          PENDING_REQUIREMENTS -> READY: a clock set past a completion's expiry
          regresses a READY application, and a fresh completion re-promotes it —
          entity BadgeApplication, distinct from the sibling's Badge.
        test_recipe:
          setup:
            - "Sponsor RG (quota 5); applicant a1's STERILE application ap1 is STA_CLEARED and resting in PENDING_REQUIREMENTS (no completions); logical clock at the 2026-08-01 default"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "RampGroup", sponsor_code: "RG", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Kara Loh", date_of_birth: "1996-08-08", government_id_number: "G6001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
          trigger:
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2025-09-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "GET /badging/applications/${ap1}", payload: {}, as: BadgingOfficer, captures: { st_a: $.data.status } }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "GET /badging/applications/${ap1}", payload: {}, as: BadgingOfficer, captures: { st_b: $.data.status } }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-09-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "GET /badging/applications/${ap1}", payload: {}, as: BadgingOfficer, captures: { st_c: $.data.status } }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B502" }, as: BadgingOfficer, captures: { b_status: $.data.status, b_exp: $.data.expires_at } }
          assert:
            - "promotion: ${st_a} == READY (completion expiring 2026-09-01 is strictly current at 2026-08-01)"
            - "regression: ${st_b} == PENDING_REQUIREMENTS (at 2026-09-01 the completion is lapsed — expires_at == now is NOT current); the application survives because its own deadline is 2026-10-30"
            - "re-promotion: ${st_c} == READY after a fresh completion"
            - "issuance after the loop: ${b_status} == ACTIVE and ${b_exp} == 2027-09-01T00:00:00Z"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; one depth >= 3, other >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: violation_sustain_cascades_badge_suspend_escort_revoke
        grounds:
          - state_machines.Violation.RECORDED_to_SUSTAINED
          - state_machines.Badge.ACTIVE_to_SUSPENDED
          - state_machines.EscortPrivilege.GRANTED_to_REVOKED
          - calculations.violation_points_and_suspension
        distinguishing_aspect: |
          Depth-3 chain triggered by violation sustain: the sustain mutates the
          Violation; the resulting points total (12) mutates the Badge to SUSPENDED
          (tier 12-17 -> +7 days); the badge's suspension mutates its GRANTED
          EscortPrivilege to REVOKED — each hop caused by the previous link.
        test_recipe:
          setup:
            - "Sponsor VC (quota 5); applicant a1 holds SIDA badge b1 (B601) ACTIVE with a GRANTED escort privilege (max_escortees 3); badge version advanced to 2 by the grant"
            - "Violation v1 (ESCORT_VIOLATION, 6 pts, occurred 2026-08-02) already SUSTAINED — holder at 6 points, badge still ACTIVE"
            - "Violation v2 (UNAUTHORIZED_AREA, 6 pts, occurred 2026-08-03) RECORDED, not yet sustained"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "VectorCatering", sponsor_code: "VC", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Liam Mays", date_of_birth: "1990-09-09", government_id_number: "G7001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B601" }, as: BadgingOfficer, captures: { b1: $.data.id, bv1: $.data.version } }
            - { call: "POST /badging/badges/${b1}/escort-privileges", payload: { max_escortees: 3, expected_badge_version: "${bv1}" }, as: SecurityManager, as_user_id: "mgr-1", captures: { ep1: $.data.id } }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "ESCORT_VIOLATION", occurred_at: "2026-08-02T00:00:00Z" }, as: BadgingOfficer, captures: { v1: $.data.id } }
            - { call: "POST /badging/violations/${v1}/sustain", payload: {}, as: SecurityManager, as_user_id: "mgr-1" }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "UNAUTHORIZED_AREA", occurred_at: "2026-08-03T00:00:00Z" }, as: BadgingOfficer, captures: { v2: $.data.id } }
          trigger:
            - { call: "POST /badging/violations/${v2}/sustain", payload: {}, as: SecurityManager, as_user_id: "mgr-1", captures: { v2st: $.data.status } }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: SecurityManager, captures: { bst: $.data.status, breason: $.data.suspension_reason, buntil: $.data.suspended_until, bby: $.data.suspended_by } }
            - { call: "GET /badging/badges/${b1}/escort-privileges", payload: {}, as: SecurityManager, captures: { epst: "$.data[0].status", epr: "$.data[0].revoked_reason" } }
          assert:
            - "link 1 (violation): ${v2st} == SUSTAINED, holder windowed points now 6 + 6 == 12 >= 12"
            - "link 2 (badge, caused by link 1): ${bst} == SUSPENDED, ${breason} == VIOLATION_POINTS, ${buntil} == 2026-08-08T00:00:00Z (12-17 tier -> +7 days from 2026-08-01), ${bby} == mgr-1"
            - "link 3 (escort, caused by link 2): ${epst} == REVOKED and ${epr} == BADGE_SUSPENDED"

      - name: sponsor_suspend_cascades_applications_badges_escorts
        grounds:
          - state_machines.Sponsor.ACTIVE_to_SUSPENDED
          - state_machines.BadgeApplication.SUBMITTED_to_DENIED
          - state_machines.Badge.ACTIVE_to_SUSPENDED
          - state_machines.EscortPrivilege.GRANTED_to_REVOKED
        distinguishing_aspect: |
          A different trigger (sponsor suspension) drives a fan-in chain: sponsor ->
          badge -> escort is depth 3 (the badge's own suspension revokes its escort
          privilege), and sponsor -> application denial is a parallel depth-2 branch —
          structurally distinct propagation from the violation-triggered chain.
        test_recipe:
          setup:
            - "Sponsor SP (quota 5) ACTIVE with: ap1, a SIDA application resting in STA_PENDING; and b2, an ACTIVE STERILE badge (B602) holding a GRANTED escort privilege (max_escortees 2)"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "SkyPark", sponsor_code: "SP", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Mia Nash", date_of_birth: "1991-10-10", government_id_number: "G8001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ned Ortiz", date_of_birth: "1992-11-11", government_id_number: "G8002" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a2: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a2}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap2: $.data.id } }
            - { call: "POST /badging/applications/${ap2}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a2}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/issue-badge", payload: { badge_number: "B602" }, as: BadgingOfficer, captures: { b2: $.data.id, bv2: $.data.version } }
            - { call: "POST /badging/badges/${b2}/escort-privileges", payload: { max_escortees: 2, expected_badge_version: "${bv2}" }, as: SecurityManager, as_user_id: "mgr-8", captures: { ep2: $.data.id } }
          trigger:
            - { call: "POST /badging/sponsors/${s1}/suspend", payload: { reason: "security directive" }, as: SecurityManager, as_user_id: "mgr-9", captures: { sst: $.data.status } }
            - { call: "GET /badging/applications/${ap1}", payload: {}, as: SecurityManager, captures: { apst: $.data.status, apreason: $.data.denial_reason } }
            - { call: "GET /badging/badges/${b2}", payload: {}, as: SecurityManager, captures: { bst: $.data.status, breason: $.data.suspension_reason, bby: $.data.suspended_by, buntil: $.data.suspended_until } }
            - { call: "GET /badging/badges/${b2}/escort-privileges", payload: {}, as: SecurityManager, captures: { epst: "$.data[0].status", epr: "$.data[0].revoked_reason" } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Oda Pell", date_of_birth: "1997-01-01", government_id_number: "G8003" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { err: $.data.error_id } }
          assert:
            - "trigger: ${sst} == SUSPENDED"
            - "depth-2 branch (application): ${apst} == DENIED and ${apreason} == SPONSOR_SUSPENDED"
            - "depth-3 chain hop 2 (badge): ${bst} == SUSPENDED, ${breason} == SPONSOR_SUSPENDED, ${bby} == mgr-9, ${buntil} == null"
            - "depth-3 chain hop 3 (escort, caused by the badge suspension): ${epst} == REVOKED and ${epr} == BADGE_SUSPENDED"
            - "post-suspension sponsor-scoped creation blocked: ${err} == ERR_SPONSOR_NOT_ACTIVE"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: issue_denied_application_state_beats_badge_constraint
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_APPLICATION_NOT_READY]
          - errors[ERR_ACTIVE_BADGE_EXISTS]
        distinguishing_aspect: |
          Category pair (state, business_constraint): issuing from a DENIED
          application while the applicant also holds an ACTIVE same-class badge must
          return the priority-5 state error ERR_APPLICATION_NOT_READY, not the
          priority-7 constraint error ERR_ACTIVE_BADGE_EXISTS.
        test_recipe:
          setup:
            - "Sponsor PP (quota 5); applicant a1 holds ACTIVE STERILE badge B701 (from issued application ap1)"
            - "a1's second STERILE application ap2 was denied at CHRC (status DENIED)"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "PrimePark", sponsor_code: "PP", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Pia Quill", date_of_birth: "1990-02-20", government_id_number: "G9001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B701" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap2: $.data.id } }
            - { call: "POST /badging/applications/${ap2}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "FAIL" }, as: BadgingOfficer, captures: { ap2st: $.data.status } }
          trigger:
            - { call: "POST /badging/applications/${ap2}/issue-badge", payload: { badge_number: "B702" }, as: BadgingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "precondition check: ${ap2st} == DENIED (application is terminal) while badge B701 is ACTIVE for the same applicant+class"
            - "${err} == ERR_APPLICATION_NOT_READY — the priority-5 state error wins over the priority-7 ERR_ACTIVE_BADGE_EXISTS"

      - name: issue_active_badge_constraint_beats_sponsor_quota
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_ACTIVE_BADGE_EXISTS]
          - errors[ERR_SPONSOR_QUOTA_EXCEEDED]
        distinguishing_aspect: |
          Category pair (business_constraint, business_fiscal): issuing when the
          applicant already holds an ACTIVE same-class badge AND the sponsor's badge
          count equals its quota must return the priority-7 constraint error
          ERR_ACTIVE_BADGE_EXISTS, not the priority-10 fiscal error
          ERR_SPONSOR_QUOTA_EXCEEDED — a different category pair than the sibling.
        test_recipe:
          setup:
            - "Sponsor QQ (quota 1); applicant a1 holds ACTIVE STERILE badge B801 — sponsor active_badge_count == 1 == quota (full)"
            - "a1's second STERILE application ap2 is fully cleared and READY"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "QuickQueue", sponsor_code: "QQ", active_badge_quota: 1 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Quinn Rapp", date_of_birth: "1993-03-21", government_id_number: "G9101" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B801" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap2: $.data.id } }
            - { call: "POST /badging/applications/${ap2}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer, captures: { ap2st: $.data.status } }
          trigger:
            - { call: "POST /badging/applications/${ap2}/issue-badge", payload: { badge_number: "B802" }, as: BadgingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "precondition check: ${ap2st} == READY (training still current from the 2026-06-01 completion)"
            - "${err} == ERR_ACTIVE_BADGE_EXISTS — the priority-7 constraint error wins over the priority-10 ERR_SPONSOR_QUOTA_EXCEEDED, even though count(1) >= quota(1) also holds"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics + endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: violation_points_threshold_exactly_12_suspends
        grounds:
          - calculations.violation_points_and_suspension
          - state_machines.Violation.RECORDED_to_SUSTAINED
        distinguishing_aspect: |
          Metric = windowed violation points, endpoint = POST
          /badging/violations/{id}/sustain: 9 accumulated points leave the badge
          ACTIVE; the sustain that brings the total to exactly 12 (>= threshold,
          not >) suspends it with the 12-17 low tier (+7 days).
        test_recipe:
          setup:
            - "Sponsor TH (quota 5); applicant a1 holds ACTIVE SIDA badge b1 (B901)"
            - "v1 (FAILURE_TO_DISPLAY, 3 pts) and v2 (ESCORT_VIOLATION, 6 pts) already SUSTAINED — holder at 9 points"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "TransHub", sponsor_code: "TH", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ruth Senn", date_of_birth: "1988-04-22", government_id_number: "G9201" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B901" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "FAILURE_TO_DISPLAY", occurred_at: "2026-08-02T00:00:00Z" }, as: BadgingOfficer, captures: { v1: $.data.id } }
            - { call: "POST /badging/violations/${v1}/sustain", payload: {}, as: SecurityManager, as_user_id: "mgr-1" }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "ESCORT_VIOLATION", occurred_at: "2026-08-03T00:00:00Z" }, as: BadgingOfficer, captures: { v2: $.data.id } }
            - { call: "POST /badging/violations/${v2}/sustain", payload: {}, as: SecurityManager, as_user_id: "mgr-1" }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: SecurityManager, captures: { st9: $.data.status } }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "FAILURE_TO_DISPLAY", occurred_at: "2026-08-04T00:00:00Z" }, as: BadgingOfficer, captures: { v3: $.data.id } }
          trigger:
            - { call: "POST /badging/violations/${v3}/sustain", payload: {}, as: SecurityManager, as_user_id: "mgr-1" }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: SecurityManager, captures: { st12: $.data.status, until12: $.data.suspended_until } }
          assert:
            - "below threshold: at 9 points the badge is ${st9} == ACTIVE"
            - "at the exact boundary (12 >= 12): ${st12} == SUSPENDED"
            - "low tier: ${until12} == 2026-08-08T00:00:00Z (7 days from the 2026-08-01 sustain time)"

      - name: sponsor_quota_boundary_count_equals_quota
        grounds:
          - calculations.sponsor_active_badge_count
          - validations[priority=10]
        distinguishing_aspect: |
          Metric = sponsor active badge count, endpoint = POST
          /badging/applications/{id}/issue-badge: issuance at count == quota - 1
          succeeds; the next issuance at count == quota (>=, not >) is rejected —
          a different metric and endpoint than the violation-points boundary.
        test_recipe:
          setup:
            - "Sponsor QT (quota 2) with three fully-cleared READY STERILE applications for applicants a1, a2, a3"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "QualityTrans", sponsor_code: "QT", active_badge_quota: 2 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Sam Tull", date_of_birth: "1990-05-23", government_id_number: "G9301" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Tess Ulm", date_of_birth: "1991-06-24", government_id_number: "G9302" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a2: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a2}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap2: $.data.id } }
            - { call: "POST /badging/applications/${ap2}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a2}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ulf Vann", date_of_birth: "1992-07-25", government_id_number: "G9303" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a3: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a3}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap3: $.data.id } }
            - { call: "POST /badging/applications/${ap3}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap3}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a3}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
          trigger:
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1001" }, as: BadgingOfficer, captures: { ok1: $.data.status } }
            - { call: "POST /badging/applications/${ap2}/issue-badge", payload: { badge_number: "B1002" }, as: BadgingOfficer, captures: { ok2: $.data.status } }
            - { call: "POST /badging/applications/${ap3}/issue-badge", payload: { badge_number: "B1003" }, as: BadgingOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /badging/sponsors/${s1}", payload: {}, as: SecurityManager, captures: { cnt: $.data.active_badge_count } }
          assert:
            - "count 0 < 2: first issuance succeeds — ${ok1} == ACTIVE"
            - "count 1 == quota - 1: second issuance still succeeds — ${ok2} == ACTIVE"
            - "count 2 >= quota 2 at the exact boundary: ${err} == ERR_SPONSOR_QUOTA_EXCEEDED"
            - "${cnt} == 2 (the rejected issuance added nothing)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: issue_blocked_until_application_ready
        grounds:
          - state_machines.BadgeApplication.READY_to_ISSUED
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair (BadgeApplication -> Badge): badge issuance is gated on the
          application's state — PENDING_REQUIREMENTS rejects with
          ERR_APPLICATION_NOT_READY, and the same call succeeds only after a
          TrainingCompletion flips the application to READY.
        test_recipe:
          setup:
            - "Sponsor XD (quota 5); applicant a1's STERILE application ap1 is STA_CLEARED but has no completion — resting in PENDING_REQUIREMENTS"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "XpressDolly", sponsor_code: "XD", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Vera Wynn", date_of_birth: "1993-08-26", government_id_number: "G9401" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer, captures: { st0: $.data.status } }
          trigger:
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1101" }, as: BadgingOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1101" }, as: BadgingOfficer, captures: { ok: $.data.status, ok_exp: $.data.expires_at } }
          assert:
            - "gate closed: while ${st0} == PENDING_REQUIREMENTS, issuance fails — ${err1} == ERR_APPLICATION_NOT_READY"
            - "gate open: after the completion promotes the application to READY, issuance succeeds — ${ok} == ACTIVE and ${ok_exp} == 2027-06-01T00:00:00Z"

      - name: access_decision_flips_on_badge_status
        grounds:
          - calculations.access_decision
          - state_machines.Badge.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair (Badge -> AccessEvent): the same badge presented at the same
          zone yields ALLOWED while the badge is ACTIVE and DENIED /
          DENIED_BADGE_INACTIVE once the badge is SUSPENDED — a different entity
          pair than the application-gated sibling instance.
        test_recipe:
          setup:
            - "Sponsor AC (quota 5); applicant a1 holds ACTIVE SIDA badge b1 (B1201)"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroClean", sponsor_code: "AC", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Wes Yost", date_of_birth: "1994-09-27", government_id_number: "G9501" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1201" }, as: BadgingOfficer, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /badging/access-checks", payload: { zone_code: "SECURE_ID_AREA", badge_id: "${b1}" }, as: AccessControlSystem, captures: { d1: $.data.decision, r1: $.data.denial_reason } }
            - { call: "POST /badging/badges/${b1}/suspend", payload: { reason: "pending review" }, as: SecurityManager, as_user_id: "mgr-1" }
            - { call: "POST /badging/access-checks", payload: { zone_code: "SECURE_ID_AREA", badge_id: "${b1}" }, as: AccessControlSystem, captures: { d2: $.data.decision, r2: $.data.denial_reason } }
          assert:
            - "while ACTIVE: ${d1} == ALLOWED and ${r1} == null (SIDA is in SECURE_ID_AREA's allowed classes)"
            - "after suspension: ${d2} == DENIED and ${r2} == DENIED_BADGE_INACTIVE — same badge, same zone, decision keyed entirely on Badge.status"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: badge_identity_window_half_open_at_expiry
        grounds:
          - validations[priority=7]
          - state_machines.Badge.ACTIVE_to_EXPIRED
          - errors[ERR_ACTIVE_BADGE_EXISTS]
        distinguishing_aspect: |
          Resource = an applicant's per-class badge identity window, semantics =
          half-open [issued_at, expires_at): one day before expiry the overlapping
          issuance is rejected, and at exactly expires_at the old window is closed
          (badge swept EXPIRED) so issuance succeeds — optional adjacency.
        test_recipe:
          setup:
            - "Sponsor HW (quota 5); applicant a1 holds STERILE badge b1 (B1301) with expires_at 2027-07-10"
            - "Logical clock at 2027-07-09 (b1 still ACTIVE); a1's second STERILE application ap2 (submitted 2027-07-09) is READY via a fresh completion expiring 2028-07-01"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "HubWest", sponsor_code: "HW", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Xenia Zahn", date_of_birth: "1995-10-28", government_id_number: "G9601" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-07-10T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1301" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2027-07-09T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap2: $.data.id } }
            - { call: "POST /badging/applications/${ap2}/record-chrc", payload: { fingerprint_submitted_at: "2027-07-09T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2027-07-01T00:00:00Z" }, as: BadgingOfficer }
          trigger:
            - { call: "POST /badging/applications/${ap2}/issue-badge", payload: { badge_number: "B1302" }, as: BadgingOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2027-07-10T00:00:00Z" }, as: BadgingOfficer }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: BadgingOfficer, captures: { old_st: $.data.status } }
            - { call: "POST /badging/applications/${ap2}/issue-badge", payload: { badge_number: "B1302" }, as: BadgingOfficer, captures: { ok: $.data.status, ok_exp: $.data.expires_at } }
          assert:
            - "one day before expiry the windows overlap: ${err1} == ERR_ACTIVE_BADGE_EXISTS"
            - "at exactly expires_at the old badge is swept: ${old_st} == EXPIRED (half-open boundary — the window is closed at its end instant)"
            - "issuance now succeeds: ${ok} == ACTIVE and ${ok_exp} == 2028-07-01T00:00:00Z"

      - name: audit_window_mandatory_adjacency_tiling
        grounds:
          - validations[priority=8]
          - errors[ERR_AUDIT_WINDOW_OVERLAP]
          - errors[ERR_AUDIT_WINDOW_GAP]
        distinguishing_aspect: |
          Resource = the AuditCycle calendar, semantics = mandatory tiling: windows
          are half-open AND must be contiguous — an overlapping window and a gapped
          window are both rejected, and only an exactly-adjacent window is accepted;
          different resource and different interval semantics (mandatory vs optional
          adjacency) than the badge-window sibling.
        test_recipe:
          setup:
            - "One audit cycle exists: [2026-01-01, 2027-01-01)"
          setup_api_calls:
            - { call: "POST /badging/audit-cycles", payload: { window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Auditor, captures: { au1: $.data.id } }
          trigger:
            - { call: "POST /badging/audit-cycles", payload: { window_start: "2026-06-01T00:00:00Z", window_end: "2027-06-01T00:00:00Z" }, as: Auditor, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /badging/audit-cycles", payload: { window_start: "2027-02-01T00:00:00Z", window_end: "2028-02-01T00:00:00Z" }, as: Auditor, captures: { err_gap: $.data.error_id } }
            - { call: "POST /badging/audit-cycles", payload: { window_start: "2027-01-01T00:00:00Z", window_end: "2028-01-01T00:00:00Z" }, as: Auditor, captures: { st2: $.data.status, ws2: $.data.window_start } }
          assert:
            - "interior overlap rejected: ${err_overlap} == ERR_AUDIT_WINDOW_OVERLAP"
            - "gap rejected even without overlap: ${err_gap} == ERR_AUDIT_WINDOW_GAP (2027-02-01 > latest window_end 2027-01-01)"
            - "exact adjacency accepted: ${st2} == OPEN and ${ws2} == 2027-01-01T00:00:00Z (touching at the boundary is allowed)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: replace_conserves_sponsor_active_badge_count
        grounds:
          - state_machines.Badge.ACTIVE_to_VOIDED
          - calculations.sponsor_active_badge_count
        distinguishing_aspect: |
          Conserved quantity = sponsor active badge count: the replace pair
          (void old badge + issue new badge) leaves count(Badge where sponsor_id =
          S and status IN {ACTIVE, SUSPENDED}) unchanged at exactly 2 — and is
          allowed even though count == quota (the quota check is exempt because the
          pair conserves).
        test_recipe:
          setup:
            - "Sponsor RC (quota 2) with two ACTIVE STERILE badges b1 (B1401) and b2 (B1402); active_badge_count == 2 == quota"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "RampCargo", sponsor_code: "RC", active_badge_quota: 2 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Yara Ames", date_of_birth: "1990-12-01", government_id_number: "G9701" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1401" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Zack Bly", date_of_birth: "1991-01-02", government_id_number: "G9702" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a2: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a2}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap2: $.data.id } }
            - { call: "POST /badging/applications/${ap2}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a2}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/issue-badge", payload: { badge_number: "B1402" }, as: BadgingOfficer, captures: { b2: $.data.id } }
            - { call: "GET /badging/sponsors/${s1}", payload: {}, as: SecurityManager, captures: { cnt_before: $.data.active_badge_count } }
          trigger:
            - { call: "POST /badging/badges/${b1}/replace", payload: { badge_number: "B1401R" }, as: BadgingOfficer, captures: { new_id: $.data.id, new_status: $.data.status, new_exp: $.data.expires_at } }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: BadgingOfficer, captures: { old_status: $.data.status, old_sup: $.data.superseded_by_badge_id, old_dl: $.data.return_deadline } }
            - { call: "GET /badging/sponsors/${s1}", payload: {}, as: SecurityManager, captures: { cnt_after: $.data.active_badge_count } }
          assert:
            - "invariant: ${cnt_before} == 2 and ${cnt_after} == 2 — the deactivation and issuance cancel out"
            - "compensating half: ${old_status} == VOIDED, ${old_dl} == null (administratively accounted, no return obligation), and ${old_sup} == ${new_id}"
            - "forward half: ${new_status} == ACTIVE and ${new_exp} == 2027-07-01T00:00:00Z (renewal horizon 2027-06-01 + 30 days, below the 24-month cap 2028-08-01)"

      - name: sustain_dismiss_pair_conserves_windowed_points
        grounds:
          - state_machines.Violation.RECORDED_to_SUSTAINED
          - state_machines.Violation.SUSTAINED_to_DISMISSED
          - calculations.violation_points_and_suspension
        distinguishing_aspect: |
          Conserved quantity = holder windowed violation points: sustaining a third
          violation (+3 -> 12, suspending the badge) followed by dismissing it (-3)
          returns sum(points of SUSTAINED violations for the holder) to exactly 9 —
          while the badge stays SUSPENDED, proving the compensation reverses points
          without auto-restoring the cascade. A different quantity than the
          badge-count invariant of the sibling.
        test_recipe:
          setup:
            - "Sponsor PT (quota 5); applicant a1 holds ACTIVE SIDA badge b1 (B1501)"
            - "v1 (FAILURE_TO_DISPLAY, 3 pts) and v2 (ESCORT_VIOLATION, 6 pts) SUSTAINED — holder at 9 points, badge ACTIVE"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "PlaneTech", sponsor_code: "PT", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Abby Cobb", date_of_birth: "1992-02-03", government_id_number: "G9801" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1501" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "FAILURE_TO_DISPLAY", occurred_at: "2026-08-02T00:00:00Z" }, as: BadgingOfficer, captures: { v1: $.data.id } }
            - { call: "POST /badging/violations/${v1}/sustain", payload: {}, as: SecurityManager, as_user_id: "mgr-1" }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "ESCORT_VIOLATION", occurred_at: "2026-08-03T00:00:00Z" }, as: BadgingOfficer, captures: { v2: $.data.id } }
            - { call: "POST /badging/violations/${v2}/sustain", payload: {}, as: SecurityManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "FAILURE_TO_DISPLAY", occurred_at: "2026-08-04T00:00:00Z" }, as: BadgingOfficer, captures: { v3: $.data.id } }
            - { call: "POST /badging/violations/${v3}/sustain", payload: {}, as: SecurityManager, as_user_id: "mgr-1" }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: SecurityManager, captures: { st_mid: $.data.status } }
            - { call: "POST /badging/violations/${v3}/dismiss", payload: {}, as: SecurityManager, as_user_id: "mgr-2", captures: { v3st: $.data.status } }
            - { call: "GET /badging/badges/${b1}/violations", payload: {}, as: SecurityManager, captures: { s1st: "$.data[0].status", s2st: "$.data[1].status", s3st: "$.data[2].status" } }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: SecurityManager, captures: { st_end: $.data.status } }
          assert:
            - "forward action: the +3 sustain crossed 12 — ${st_mid} == SUSPENDED"
            - "compensating action: ${v3st} == DISMISSED (dismissed by mgr-2 != sustained_by mgr-1)"
            - "invariant restored: violations list (created_at ascending) shows ${s1st} == SUSTAINED, ${s2st} == SUSTAINED, ${s3st} == DISMISSED — SUSTAINED points back to 3 + 6 == 9, exactly the pre-pair total"
            - "no drift-compensation shortcut: the badge stays ${st_end} == SUSPENDED (dismissal reverses points, it does not auto-reinstate)"
