              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "PERCUTANEOUS", exposure_datetime: "2026-07-30T10:00:00Z", source_known: false, body_fluid: "BLOOD" }
              as: EmployeeHealthNurse
              captures: { case_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /employee-health/pep-regimens"
              payload: { exposure_case_id: "${case_id}" }
              as: EmployeeHealthPhysician
              captures: { pep_id: "$.data[0].id" }
            - call: "POST /employee-health/pep-regimens/${pep_id}/transition"
              payload: { to_state: "STARTED", started_at: "2026-08-01T12:00:00Z" }
              as: EmployeeHealthPhysician
            - call: "GET /employee-health/serology-follow-ups"
              payload: { exposure_case_id: "${case_id}", milestone: "BASELINE" }
              as: EmployeeHealthNurse
              captures: { fu_base: "$.data[0].id" }
            - call: "POST /employee-health/serology-follow-ups/${fu_base}/transition"
              payload: { to_state: "RESULTED", result: "NEGATIVE", resulted_at: "2026-08-01T12:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T10:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /employee-health/serology-follow-ups"
              payload: { exposure_case_id: "${case_id}", milestone: "WEEK_6" }
              as: EmployeeHealthNurse
              captures: { fu6_id: "$.data[0].id", fu6_status: "$.data[0].status" }
          trigger:
            - call: "POST /employee-health/serology-follow-ups/${fu6_id}/transition"
              payload: { to_state: "RESULTED", result: "POSITIVE", resulted_at: "2026-09-03T10:00:00Z" }
              as: EmployeeHealthNurse
            - call: "GET /employee-health/exposure-cases/${case_id}"
              as: EmployeeHealthNurse
            - call: "GET /employee-health/work-restrictions"
              payload: { employee_id: "${emp_id}", status: "ACTIVE" }
