  - { method: GET, path: "/va-loans/veterans/{id}/assumption-requests", description: "List assumption requests where this veteran is the buyer (FK reverse lookup)", roles: [Veteran, LoanOfficer, Underwriter, ProgramAdmin], code: 200, input: ['limit?', 'offset?'], output: "AssumptionRequest[]", side_effects: [] }
  - { method: POST, path: "/va-loans/assumption-requests/{id}/approve", description: "Approve an assumption; entitlement substitution moves the charge from seller to buyer", roles: [Underwriter], code: 200, input: [], output: AssumptionRequest, side_effects: ["entitlement substitution side effects when substitute_entitlement", "AuditEvent appended"] }
