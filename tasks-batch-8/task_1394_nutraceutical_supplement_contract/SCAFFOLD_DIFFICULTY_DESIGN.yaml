  # ==========================================================================
  # Rule 9 — compensating_invariant (material mass; monetary commitment)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: lot_mass_conserved_on_consume_and_void
        grounds:
          - calculations.lot_qty_reconciliation
          - state_machines.BatchConsumption.ACTIVE_to_VOIDED
          - entities.MaterialLot.fields.qty_remaining
        distinguishing_aspect: |
          Conserved quantity is MATERIAL MASS per lot: recording a consumption
          (forward) and voiding it (compensating) leaves qty_remaining +
          sum(ACTIVE consumptions) == qty_received exactly invariant at 1000000.
        test_recipe:
          setup:
            - "IN_PROCESS batch; RELEASED lot with qty_received 1000000"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QAManager
            - call: "POST /api/customers"
              payload: { brand_name: "Acme" }
              as: ProductionPlanner
              captures: { cust_id: $.data.id }
            - call: "POST /api/raw-materials"
              payload: { name: "VitC", allergen_class: "NONE" }
              as: ProductionPlanner
              captures: { rm_id: $.data.id }
            - call: "POST /api/customers/${cust_id}/formulas"
              payload:
                name: "C500"
                dosage_form: "TABLET"
                allergen_class: "NONE"
                min_order_qty: 1000
                batch_size_units: 10000
                shelf_life_months: 24
                overage_basis: "THEORETICAL"
                lines: [ { raw_material_id: "${rm_id}", theoretical_qty_mg_per_unit: 500, overage_pct: 10, is_label_claim_line: true, label_claim_mg_per_unit: 450 } ]
                price_tiers: [ { min_qty: 1000, unit_price_cents: 120 } ]
              as: ProductionPlanner
              captures: { f_id: $.data.id }
            - call: "POST /api/formulas/${f_id}/approve"
              payload: {}
              as: QAManager
            - call: "POST /api/production-lines"
              payload: { name: "L1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id }
            - call: "POST /api/material-lots"
              payload: { raw_material_id: "${rm_id}", supplier_name: "SuppCo", supplier_coa_ref: "COA-1", qty_received: 1000000 }
              as: ProductionOperator
              captures: { lot_id: $.data.id }
            - call: "POST /api/material-lots/${lot_id}/identity-tests"
              payload: { result: "PASS", coa_match: true }
              as: QAChemist
              as_user_id: "chem-1"
              captures: { it_id: $.data.id }
            - call: "POST /api/identity-tests/${it_id}/coa-review"
              payload: { review_outcome: "APPROVE" }
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/manufacturing-orders"
              payload: { customer_id: "${cust_id}", formula_id: "${f_id}", ordered_qty: 10000 }
              as: BrandRep
              as_user_id: "${cust_id}"
              captures: { mo_id: $.data.id }
            - call: "POST /api/manufacturing-orders/${mo_id}/schedule"
              payload: { production_line_id: "${line_id}", planned_start: "2026-09-01T08:00:00Z", planned_end: "2026-09-01T16:00:00Z" }
              as: ProductionPlanner
              captures: { batch_id: $.data.id }
            - call: "POST /api/batches/${batch_id}/start"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /api/batches/${batch_id}/consumptions"
              payload: { material_lot_id: "${lot_id}", qty_consumed: 400000 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cons_id: $.data.id }
            - call: "GET /api/material-lots/${lot_id}"
              payload: {}
              as: QAManager
              captures: { remaining_after_consume: $.data.qty_remaining }
            - call: "POST /api/batches/${batch_id}/consumptions/${cons_id}/void"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /api/material-lots/${lot_id}"
              payload: {}
              as: QAManager
              captures: { remaining_after_void: $.data.qty_remaining }
          assert:
            - "After consume: ${remaining_after_consume} == 600000 (1000000 - 400000)"
            - "After void: ${remaining_after_void} == 1000000 (compensation restores mass exactly)"
            - "BatchConsumption.${cons_id}.status == VOIDED"
            - "Invariant holds at every step: qty_remaining + sum(ACTIVE consumptions) == qty_received == 1000000"
      - name: customer_commitment_conserved_on_place_and_cancel
        grounds:
          - calculations.customer_commitment
          - state_machines.ManufacturingOrder.PLACED_to_CANCELLED
          - entities.Customer.fields.committed_order_value_cents
        distinguishing_aspect: |
          Conserved quantity is MONETARY COMMITMENT (different quantity than
          lot_mass_conserved_on_consume_and_void): placing an order (forward)
          and cancelling it (compensating) leaves committed_order_value_cents +
          lifetime_receipts_cents == sum(total over non-CANCELLED orders) == 0.
        test_recipe:
          setup:
            - "Customer and APPROVED formula (MOQ 1000, tier [{1000,120}])"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { brand_name: "Acme" }
              as: ProductionPlanner
              captures: { cust_id: $.data.id }
            - call: "POST /api/raw-materials"
              payload: { name: "VitC", allergen_class: "NONE" }
              as: ProductionPlanner
              captures: { rm_id: $.data.id }
            - call: "POST /api/customers/${cust_id}/formulas"
              payload:
                name: "C500"
                dosage_form: "TABLET"
                allergen_class: "NONE"
                min_order_qty: 1000
                batch_size_units: 10000
                shelf_life_months: 24
                overage_basis: "THEORETICAL"
                lines: [ { raw_material_id: "${rm_id}", theoretical_qty_mg_per_unit: 500, overage_pct: 10, is_label_claim_line: true, label_claim_mg_per_unit: 450 } ]
                price_tiers: [ { min_qty: 1000, unit_price_cents: 120 } ]
              as: ProductionPlanner
              captures: { f_id: $.data.id }
            - call: "POST /api/formulas/${f_id}/approve"
              payload: {}
              as: QAManager
          trigger:
            - call: "POST /api/manufacturing-orders"
              payload: { customer_id: "${cust_id}", formula_id: "${f_id}", ordered_qty: 2000 }
              as: BrandRep
              as_user_id: "${cust_id}"
              captures: { mo_id: $.data.id, mo_total: $.data.total_price_cents }
            - call: "GET /api/customers/${cust_id}"
              payload: {}
              as: QAManager
              captures: { committed_after_place: $.data.committed_order_value_cents, open_after_place: $.data.open_order_count }
            - call: "POST /api/manufacturing-orders/${mo_id}/cancel"
              payload: {}
              as: BrandRep
              as_user_id: "${cust_id}"
            - call: "GET /api/customers/${cust_id}"
              payload: {}
              as: QAManager
              captures: { committed_after_cancel: $.data.committed_order_value_cents, open_after_cancel: $.data.open_order_count, lifetime_after_cancel: $.data.lifetime_receipts_cents }
          assert:
            - "${mo_total} == 240000 (2000 x 120)"
            - "After place: ${committed_after_place} == 240000 and ${open_after_place} == 1"
            - "After cancel: ${committed_after_cancel} == 0 and ${open_after_cancel} == 0 and ${lifetime_after_cancel} == 0"
            - "Invariant: committed + lifetime == sum(total over non-CANCELLED orders) == 0 after compensation"
