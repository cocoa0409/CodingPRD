          - entities.MoratoriumWindow.fields.status
          - validations[priority=5]
        distinguishing_aspect: |
          A shutoff scheduled 2026-06-15 cannot EXECUTE while a SYSTEM MoratoriumWindow
          covers that date (ERR_MORATORIUM_ACTIVE), but an otherwise identical shutoff
          scheduled 2026-07-15 (outside the window) executes — ShutoffOrder depends on
          MoratoriumWindow state.
