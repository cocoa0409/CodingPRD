            - "data.error_id == ERR_SUBSTANTIATION_STATE_INVALID"
            - "SubstantiationRecord.${r1}.status == VERIFIED"
            - "SubstantiationRecord.${r1}.verified_at == \"2026-08-01T00:00:00.000Z\""
            - "SubstantiationRecord.${r1}.version == ${r1_ver}"

      - name: certificate_reverification_after_revocation_restores_material_claim_status
        claim_type: cyclic
        grounds:
