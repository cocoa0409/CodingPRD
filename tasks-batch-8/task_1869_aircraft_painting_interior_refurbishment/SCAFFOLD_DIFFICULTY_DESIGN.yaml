  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: paint_scheme_revision_cycle
        grounds:
          - state_machines.PaintScheme.REJECTED_to_DRAFT
          - state_machines.PaintScheme.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Entity = PaintScheme; shape = cyclic revision loop
          DRAFT->SUBMITTED->REJECTED->DRAFT->SUBMITTED->APPROVED (reject does
          not terminate; revise re-enters DRAFT). Distinct from the SoftGoodLot
          bounded cycle and the RefurbProgram revert loop.
        test_recipe:
          setup: ["Program QUOTED (version unchanged by scheme draft/submit/reject/revise cycle)"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id, prog_v0: $.data.version } }
            - { call: "POST /completion/paint-schemes", payload: { program_id: "${prog_id}", drawing_ref: "DWG-1869-A", painted_area_sqft: 2400, coat_count: 2, stripe_pct: 0.10 }, as: DesignLead, captures: { sch_id: $.data.id, st0: $.data.status } }
            - { call: "POST /completion/paint-schemes/${sch_id}/submit", payload: {}, as: DesignLead, captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /completion/paint-schemes/${sch_id}/reject", payload: {}, as: CustomerRep, as_user_id: "${cust_id}", captures: { st2: $.data.status } }
            - { call: "POST /completion/paint-schemes/${sch_id}/revise", payload: {}, as: DesignLead, captures: { st3: $.data.status } }
            - { call: "POST /completion/paint-schemes/${sch_id}/submit", payload: {}, as: DesignLead, captures: { st4: $.data.status } }
            - { call: "POST /completion/paint-schemes/${sch_id}/approve", payload: { expected_program_version: "${prog_v0}" }, as: CustomerRep, as_user_id: "${cust_id}", captures: { st5: $.data.status } }
          assert:
            - "st0 == DRAFT, st1 == SUBMITTED, st2 == REJECTED, st3 == DRAFT (loop edge), st4 == SUBMITTED, st5 == APPROVED"
            - "program.version was still ${prog_v0} at approval — only approve bumps it"

      - name: soft_good_lot_bounded_retest_cycle
        grounds:
          - state_machines.SoftGoodLot.CERT_FAILED_to_IN_TEST
          - state_machines.SoftGoodLot.IN_TEST_to_CERT_QUARANTINED
          - calculations.burn_certification_derivation
        distinguishing_aspect: |
          Entity = SoftGoodLot; shape = bounded cycle
          UNCERTIFIED->IN_TEST->CERT_FAILED->IN_TEST->... with a counter-based
          terminal exit (3rd FAIL -> CERT_QUARANTINED). fail_count never resets,
          so the cycle cannot repeat indefinitely — unlike the PaintScheme loop.
        test_recipe:
          setup: ["Program QUOTED; one lot registered (UNCERTIFIED, fail_count 0)"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/soft-good-lots", payload: { program_id: "${prog_id}", description: "Sidewall panels", material: "Nomex composite", quantity: 12, estimated_weight_lbs: 140.0 }, as: ShopTechnician, captures: { lot_id: $.data.id } }
          trigger:
            - { call: "POST /completion/soft-good-lots/${lot_id}/burn-tests", payload: { test_method: "VERTICAL_12S", result: "FAIL", lab_name: "AeroBurn Labs" }, as: ShopTechnician, captures: { t1_seq: $.data.test_sequence } }
            - { call: "GET /completion/soft-good-lots/${lot_id}", as: ShopTechnician, captures: { st1: $.data.status, fc1: $.data.fail_count } }
            - { call: "POST /completion/soft-good-lots/${lot_id}/burn-tests", payload: { test_method: "VERTICAL_12S", result: "FAIL", lab_name: "AeroBurn Labs" }, as: ShopTechnician }
            - { call: "GET /completion/soft-good-lots/${lot_id}", as: ShopTechnician, captures: { st2: $.data.status, fc2: $.data.fail_count } }
            - { call: "POST /completion/soft-good-lots/${lot_id}/burn-tests", payload: { test_method: "VERTICAL_60S", result: "FAIL", lab_name: "AeroBurn Labs" }, as: ShopTechnician }
            - { call: "GET /completion/soft-good-lots/${lot_id}", as: ShopTechnician, captures: { st3: $.data.status, fc3: $.data.fail_count } }
            - { call: "POST /completion/soft-good-lots/${lot_id}/burn-tests", payload: { test_method: "VERTICAL_12S", result: "PASS", lab_name: "AeroBurn Labs" }, as: ShopTechnician, captures: { err: $.data.error_id } }
          assert:
            - "st1 == CERT_FAILED and fc1 == 1; st2 == CERT_FAILED and fc2 == 2 (cycle edge CERT_FAILED->IN_TEST traversed silently by next test)"
            - "st3 == CERT_QUARANTINED and fc3 == 3 (3rd FAIL exits the cycle)"
            - "err == ERR_INVALID_STATE (CERT_QUARANTINED is terminal; 4th test rejected)"

      - name: program_inspection_rework_revert_loop
        grounds:
          - state_machines.RefurbProgram.IN_INSPECTION_to_IN_WORK
          - state_machines.QualityInspection.SCHEDULED_to_FAILED
          - calculations.major_defect_discovery_trigger
        distinguishing_aspect: |
          Entity = RefurbProgram; shape = branching revert — a FAILED child
          inspection forces IN_INSPECTION->IN_WORK (revert), increments
          rework_cycles, and (major_defects >= 2) spawns a safety-linked
          DiscoveryItem that must itself reach COMPLETED before the program may
          re-enter IN_INSPECTION. Neither a simple cycle nor a linear pipeline.
