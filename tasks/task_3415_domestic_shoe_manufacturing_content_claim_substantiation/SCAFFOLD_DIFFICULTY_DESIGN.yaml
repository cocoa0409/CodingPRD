          setup:
            - "Logical clock 2026-09-01T00:00:00Z. DOMESTIC factory (2 lines, rate 50, overhead 600, capacity 1000)."
            - "Model MCRM (DUAL_SOURCE): one IMPORT_ALLOWED line 1.0 upper/pair planned 1250c; lot of 500 @1250."
