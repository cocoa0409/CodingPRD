scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_vs_final_patient_responsibility
        grounds:
          - calculations.patient_responsibility_calc
          - state_machines.Encounter.ELIGIBILITY_VERIFIED_to_CHARGES_CAPTURED
          - state_machines.Encounter.CODED_to_CLEARED
          - entities.Encounter.fields.estimated_patient_responsibility_cents
          - entities.Encounter.fields.patient_responsibility_cents
        distinguishing_aspect: |
          The 'estimate' variant runs on Encounter.total_charges_cents (forward-looking,
          all posted charges) while the 'final' variant runs on
          ClearanceDecision.allowed_amount_cents (chronological, post-adjudication);
          for identical inputs the two variants write DIFFERENT cents into
          DIFFERENT fields on the Encounter entity (cost-accounting domain on Encounter).
        test_recipe:
          setup:
            - "POST /patients → mrn='MR000001' → capture patient_id."
            - "POST /patients/{patient_id}/policies with payer_name='Aetna', policy_number='P1', plan_year=2026, deductible_cents=100000, coinsurance_rate_bps=2000, oop_max_cents=200000 → capture policy_id."
            - "POST /_clock/advance to 2026-02-01T00:00:00Z."
            - "POST /encounters with patient_id, policy_id → capture encounter_id."
            - "POST /encounters/{id}/verify-eligibility with policy_eligible=true."
            - "POST /encounters/{id}/charges with cpt_code='99213', quantity=1, unit_price_cents=150000 → capture charge_id."
            - "POST /encounters/{id}/charges/{charge_id}/post."
            - "POST /encounters/{id}/discharge."
          trigger:
            - "GET /encounters/{encounter_id} to capture Encounter.estimated_patient_responsibility_cents."
            - "POST /encounters/{id}/coding with primary_icd10='J18.9', cpt_codes=['99213'], finalize=true."
            - "POST /encounters/{id}/clearance with decision='APPROVED', allowed_amount_cents=120000."
            - "GET /encounters/{encounter_id} again to capture Encounter.patient_responsibility_cents."
          assert:
            - "Encounter.estimated_patient_responsibility_cents == 110000  # deductible 100000 + 20% of 50000 = 10000"
            - "Encounter.patient_responsibility_cents == 104000  # deductible 100000 + 20% of 20000 = 4000"
            - "Encounter.payer_responsibility_cents == 16000  # 120000 - 104000"
            - "Encounter.estimated_patient_responsibility_cents != Encounter.patient_responsibility_cents"

      - name: payer_vs_patient_split_under_pr_denial_code
        grounds:
          - calculations.payer_clearance_calc
          - calculations.patient_responsibility_calc
          - entities.ClearanceDecision.fields.denial_reason_code
          - entities.Encounter.fields.payer_responsibility_cents
          - entities.Encounter.fields.patient_responsibility_cents
        distinguishing_aspect: |
          A second dual-variant calc operates on the PAYER/CLAIM domain (payer_clearance_calc
          on ClearanceDecision), not on patient-responsibility accumulation. With identical
          allowed_amount inputs, decision == APPROVED routes the unallowed remainder to a
          contractual write-down (payer absorbs unallowed), while denial_reason_code in
          PATIENT_RESPONSIBILITY_CODES routes the entire encounter to the patient bypassing
          deductible/coinsurance/OOP — different cents land in
          patient_responsibility_cents for the SAME total_charges.
        test_recipe:
          setup:
            - "Same setup as estimate_vs_final_patient_responsibility through discharge; total_charges_cents = 150000."
            - "POST /encounters/{id}/coding finalize=true."
          trigger:
            - "POST /encounters/{id}/clearance with decision='DENIED', allowed_amount_cents=0, denial_reason_code='PR-1'."
          assert:
            - "Encounter.payer_responsibility_cents == 0"
            - "Encounter.patient_responsibility_cents == 150000  # full charges flow to patient via PR code bypass, ignoring deductible/coinsurance/OOP"
            - "InsurancePolicy.deductible_met_cents == 0  # PR-code bypass does NOT touch accumulators"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_waterfall_with_oop_cap
        grounds:
          - calculations.patient_responsibility_calc
          - entities.InsurancePolicy.fields.deductible_cents
          - entities.InsurancePolicy.fields.coinsurance_rate_bps
          - entities.InsurancePolicy.fields.oop_max_cents
        distinguishing_aspect: |
          Mode (a) — formula has ≥3 inputs (deductible, coinsurance rate, OOP max) with
          non-linear interaction (nested min/max with three sequential conditional buckets);
          the OOP cap can clip a result that the deductible+coinsurance buckets would otherwise
          produce, making the final value branch-conditional on starting accumulators.
        test_recipe:
          setup:
            - "POST /patients → patient_id."
            - "POST /patients/{patient_id}/policies with deductible_cents=50000, coinsurance_rate_bps=2500, oop_max_cents=80000 → policy_id."
            - "POST /_clock/advance to 2026-02-01T00:00:00Z."
            - "POST /encounters with patient_id, policy_id."
            - "POST /encounters/{id}/verify-eligibility (eligible)."
            - "POST /encounters/{id}/charges cpt_code='99213', quantity=1, unit_price_cents=200000 → charge_id."
            - "POST /encounters/{id}/charges/{charge_id}/post."
            - "POST /encounters/{id}/discharge."
            - "POST /encounters/{id}/coding primary_icd10='J18.9', cpt_codes=['99213'], finalize=true."
          trigger:
            - "POST /encounters/{id}/clearance decision='APPROVED', allowed_amount_cents=200000."
          assert:
            - "Encounter.patient_responsibility_cents == 80000  # deductible 50000 + coinsurance 25% of 150000 = 37500 = 87500 uncapped, capped at OOP max 80000"
            - "Encounter.payer_responsibility_cents == 120000  # 200000 allowed - 80000 patient"
            - "InsurancePolicy.oop_accumulated_cents == 80000  # member_payable, clamped"

      - name: coinsurance_rounding_order_bucket_then_round
        grounds:
          - calculations.patient_responsibility_calc
          - entities.ChargeItem.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) — rounding order matters. Two charges of 3333¢ each, total 6666¢, at
          17.5% coinsurance: rounding per-line (583+583=1166) DIFFERS from rounding the
          whole coinsurance bucket once (6666 * 0.175 = 1166.55 → round_half_up → 1167).
          The scaffold pins "round the bucket once" — formula yields 1167, not 1166.
        test_recipe:
          setup:
            - "POST /patients → patient_id."
            - "POST /patients/{patient_id}/policies with deductible_cents=0, coinsurance_rate_bps=1750, oop_max_cents=99999 → policy_id."
            - "POST /_clock/advance to 2026-02-01T00:00:00Z."
            - "POST /encounters with patient_id, policy_id."
            - "POST /encounters/{id}/verify-eligibility (eligible)."
            - "POST /encounters/{id}/charges cpt_code='99213', quantity=1, unit_price_cents=3333 → charge_id_a."
            - "POST /encounters/{id}/charges cpt_code='99214', quantity=1, unit_price_cents=3333 → charge_id_b."
            - "POST /encounters/{id}/charges/{charge_id_a}/post."
            - "POST /encounters/{id}/charges/{charge_id_b}/post."
            - "POST /encounters/{id}/discharge."
            - "POST /encounters/{id}/coding primary_icd10='J18.9', cpt_codes=['99213','99214'], finalize=true."
          trigger:
            - "POST /encounters/{id}/clearance decision='APPROVED', allowed_amount_cents=6666."
          assert:
            - "Encounter.patient_responsibility_cents == 1167  # bucket-then-round: round_half_up(6666*0.175=1166.55) == 1167, NOT 1166"
            - "Encounter.payer_responsibility_cents == 5499  # 6666 - 1167"

      - name: sequential_payer_then_patient_evaluation
        grounds:
          - calculations.payer_clearance_calc
          - calculations.patient_responsibility_calc
          - state_machines.Encounter.CODED_to_CLEARED
        distinguishing_aspect: |
          Mode (c) — pinned evaluation order on apparently-circular dependency:
          payer_responsibility_cents = allowed_amount - patient_responsibility,
          but patient_responsibility itself is a waterfall over the allowed_amount.
          The scaffold pins: (1) compute patient via waterfall first, (2) then payer
          as the subtraction; reversing the order would yield a different number when
          OOP cap clips the member portion.
        test_recipe:
          setup:
            - "POST /patients → patient_id."
            - "POST /patients/{patient_id}/policies with deductible_cents=50000, coinsurance_rate_bps=2500, oop_max_cents=80000 → policy_id."
            - "POST /_clock/advance to 2026-02-01T00:00:00Z."
            - "POST /encounters with patient_id, policy_id."
            - "POST /encounters/{id}/verify-eligibility (eligible)."
            - "POST /encounters/{id}/charges cpt_code='99213', quantity=1, unit_price_cents=200000 → charge_id."
            - "POST /encounters/{id}/charges/{charge_id}/post."
            - "POST /encounters/{id}/discharge."
            - "POST /encounters/{id}/coding primary_icd10='J18.9', cpt_codes=['99213'], finalize=true."
          trigger:
            - "POST /encounters/{id}/clearance decision='APPROVED', allowed_amount_cents=200000."
          assert:
            - "Encounter.patient_responsibility_cents == 80000  # waterfall first, OOP-capped"
            - "Encounter.payer_responsibility_cents == 120000  # 200000 - 80000, second step"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: encounter_branching_billed_to_resolved_or_written_off
        grounds:
          - state_machines.Encounter.BILLED_to_RESOLVED
          - state_machines.Encounter.BILLED_to_WRITTEN_OFF
        distinguishing_aspect: |
          Encounter has a fork at BILLED with divergent side-effect sets: BILLED→RESOLVED
          fires only via outstanding_balance reaching zero through PatientPayment, while
          BILLED→WRITTEN_OFF fires only via the 90-day age gate and creates a BadDebtRecord.
          The two branches mutate different downstream entities (PatientPayment vs BadDebtRecord).
        test_recipe:
          setup:
            - "Build two encounters (same shape: registration → eligibility → charges_posted → discharge → coding → clearance → issue-bill). Pin both to total_charges_cents=10000, allowed=10000, deductible=0, coinsurance=0, so each Encounter.patient_responsibility_cents == 10000."
            - "Both encounters reach BILLED status."
          trigger:
            - "ENCOUNTER A: POST /encounters/{A}/payments amount_cents=10000, method='CASH'."
            - "ENCOUNTER B: POST /_clock/advance forward 90 days → POST /encounters/{B}/write-off."
          assert:
            - "After A's payment: Encounter A.status == 'RESOLVED' AND no BadDebtRecord exists for A."
            - "After B's write-off: Encounter B.status == 'WRITTEN_OFF' AND a BadDebtRecord row exists for B with write_off_cents == 10000."
            - "Encounter A.write_off_cents == 0; Encounter B.write_off_cents == 10000  # divergent side effects"

      - name: insurance_policy_branching_at_verification
        grounds:
          - state_machines.InsurancePolicy.UNVERIFIED_to_ELIGIBLE
          - state_machines.InsurancePolicy.UNVERIFIED_to_INELIGIBLE
        distinguishing_aspect: |
          InsurancePolicy is a different entity from Encounter, and it has a non-linear
          fork at UNVERIFIED with divergent downstream behavior: the ELIGIBLE branch
          advances the parent Encounter to ELIGIBILITY_VERIFIED, while the INELIGIBLE
          branch leaves the Encounter at REGISTERED. Different sibling-state effects per branch.
        test_recipe:
          setup:
            - "Build two encounters identical in shape, each with its own freshly-created policy in UNVERIFIED."
          trigger:
            - "ENCOUNTER A: POST /encounters/{A}/verify-eligibility policy_eligible=true."
            - "ENCOUNTER B: POST /encounters/{B}/verify-eligibility policy_eligible=false."
          assert:
            - "Policy A.status == 'ELIGIBLE' AND Encounter A.status == 'ELIGIBILITY_VERIFIED'."
            - "Policy B.status == 'INELIGIBLE' AND Encounter B.status == 'REGISTERED'  # encounter does NOT advance on the ineligible branch."

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: charge_post_cascade_depth_three
        grounds:
          - state_machines.ChargeItem.PENDING_to_POSTED
          - calculations.charge_total_aggregation
          - calculations.patient_responsibility_calc
          - entities.Encounter.fields.total_charges_cents
          - entities.Encounter.fields.estimated_patient_responsibility_cents
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /encounters/{id}/charges/{cid}/post:
          (link 1) ChargeItem.status PENDING → POSTED;
          (link 2) caused by link 1, charge_total_aggregation re-sums and writes
                   Encounter.total_charges_cents;
          (link 3) caused by link 2, patient_responsibility_calc 'estimate' reads the
                   refreshed total and writes Encounter.estimated_patient_responsibility_cents.
          Each link is caused by the previous, not by the original action in parallel.
        test_recipe:
          setup:
            - "POST /patients → patient_id; POST /patients/{patient_id}/policies (D=100000, C=2000, M=200000) → policy_id."
            - "POST /_clock/advance to 2026-02-01T00:00:00Z."
            - "POST /encounters; POST /encounters/{id}/verify-eligibility eligible=true."
            - "POST /encounters/{id}/charges cpt_code='99213', quantity=1, unit_price_cents=150000 → charge_id."
            - "Capture S0 = GET /encounters/{id}; assert S0.total_charges_cents == 0 AND S0.estimated_patient_responsibility_cents == 0  # PENDING charge not counted"
          trigger:
            - "POST /encounters/{id}/charges/{charge_id}/post."
          assert:
            - "ChargeItem.status == 'POSTED'  # link 1"
            - "Encounter.total_charges_cents == 150000  # link 2 — caused by link 1 via aggregation"
            - "Encounter.estimated_patient_responsibility_cents == 110000  # link 3 — caused by link 2 via estimate recompute: 100000 deductible + 0.2*50000 = 10000"

      - name: clearance_cascade_through_policy_accumulators
        grounds:
          - state_machines.Encounter.CODED_to_CLEARED
          - calculations.payer_clearance_calc
          - calculations.patient_responsibility_calc
          - entities.InsurancePolicy.fields.deductible_met_cents
          - entities.InsurancePolicy.fields.oop_accumulated_cents
        distinguishing_aspect: |
          A different originating trigger (POST /encounters/{id}/clearance) drives a
          ≥2-link cascade: (link 1) ClearanceDecision row inserted; (link 2) caused by
          link 1, payer_clearance_calc + patient_responsibility_calc 'final' write to
          Encounter.payer_responsibility_cents and Encounter.patient_responsibility_cents;
          (link 3) caused by link 2, InsurancePolicy.deductible_met_cents and
          oop_accumulated_cents are incremented from the just-computed deductible_portion
          and member_payable. Different trigger and different conserved fields than Rule 4 instance 1.
        test_recipe:
          setup:
            - "Build encounter through CHARGES_CAPTURED with total_charges_cents = 150000 and policy D=100000, DM=0, C=2000, M=200000, OOP=0."
            - "POST /encounters/{id}/coding primary_icd10='J18.9', cpt_codes=['99213'], finalize=true."
            - "Capture P0 = GET /patients/{pid}/policies → policy.deductible_met_cents == 0, policy.oop_accumulated_cents == 0."
          trigger:
            - "POST /encounters/{id}/clearance decision='APPROVED', allowed_amount_cents=120000."
          assert:
            - "ClearanceDecision row exists with allowed_amount_cents == 120000  # link 1"
            - "Encounter.patient_responsibility_cents == 104000 AND Encounter.payer_responsibility_cents == 16000  # link 2"
            - "InsurancePolicy.deductible_met_cents == 100000  # link 3 — deductible_portion clipped at remaining deductible"
            - "InsurancePolicy.oop_accumulated_cents == 104000  # link 3 — member_payable added"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_fiscal_on_discharge
        grounds:
          - validations[priority=5]
          - validations[priority=13]
        distinguishing_aspect: |
          Pair: state (priority 5) vs business_fiscal (priority 13).
          When discharge is attempted on an already-CHARGES_CAPTURED encounter (state-illegal)
          AND no POSTED charges exist (fiscal precondition fail), the priority-5 state check
          MUST fire first, returning ERR_INVALID_STATE — not ERR_CHARGES_NOT_READY.
        test_recipe:
          setup:
            - "Build encounter through CHARGES_CAPTURED (eligibility + one POSTED charge + discharge once)."
            - "Confirm Encounter.status == 'CHARGES_CAPTURED'."
            - "(Note: discharge has already been called once; a second discharge call is state-illegal.)"
          trigger:
            - "POST /encounters/{id}/discharge AGAIN (second time)."
          assert:
            - "Response status code == 409"
            - "Response data.error_id == 'ERR_INVALID_STATE'  # state check wins over fiscal precondition"

      - name: existence_beats_business_referential_on_encounter_create
        grounds:
          - validations[priority=4]
          - validations[priority=6]
        distinguishing_aspect: |
          Pair: existence (priority 4) vs business_referential (priority 6).
          When POST /encounters references a policy_id that DOES NOT EXIST,
          ERR_NOT_FOUND (existence) MUST fire before ERR_POLICY_PATIENT_MISMATCH
          (which would only be checked if the policy existed). Distinct category pair
          from instance 1.
        test_recipe:
          setup:
            - "POST /patients → patient_id."
            - "(Do not create any policy.)"
          trigger:
            - "POST /encounters with patient_id and policy_id='nonexistent-policy-uuid'."
          assert:
            - "Response status code == 404"
            - "Response data.error_id == 'ERR_NOT_FOUND'  # existence wins over mismatch"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: write_off_at_exactly_ninety_days_inclusive
        grounds:
          - calculations.bad_debt_writeoff_calc
          - validations[priority=14]
          - endpoints[POST /encounters/{encounter_id}/write-off]
        distinguishing_aspect: |
          Numeric threshold on a temporal metric — 90 days INCLUSIVE.
          At exactly 90 days past billed_at the write-off succeeds (boundary ON the gate);
          at 89 days 23h59m it fails with ERR_WRITE_OFF_TOO_EARLY. Tests both sides
          of '>=' on the floor((now-billed_at)/1d) >= 90 predicate.
        test_recipe:
          setup:
            - "Build an encounter through BILLED with patient_responsibility_cents=10000 (so balance is non-zero)."
            - "POST /_clock/advance to set clock such that billed_at recorded was 2026-02-01T00:00:00Z (or whatever the issue-bill instant captures)."
            - "Branch X (early): POST /_clock/advance to 2026-05-01T23:59:59Z (i.e., 89 days 23:59:59 since billed_at = 2026-02-01T00:00:00Z; floor → 89 days)."
          trigger:
            - "Branch X: POST /encounters/{id}/write-off → expect 422."
            - "Branch Y (boundary): POST /_clock/advance to 2026-05-02T00:00:00Z (exactly 90 days). POST /encounters/{id}/write-off."
          assert:
            - "Branch X: response status == 422 AND error_id == 'ERR_WRITE_OFF_TOO_EARLY'."
            - "Branch Y: response status == 201 AND BadDebtRecord.write_off_cents == 10000 AND Encounter.status == 'WRITTEN_OFF'."

      - name: discharge_requires_nonempty_posted_charges
        grounds:
          - validations[priority=13]
          - endpoints[POST /encounters/{encounter_id}/discharge]
          - state_machines.Encounter.ELIGIBILITY_VERIFIED_to_CHARGES_CAPTURED
        distinguishing_aspect: |
          Different metric (empty-collection edge, not a numeric threshold) on a
          different endpoint (/discharge). Discharge requires the POSTED-charge set
          cardinality to be >= 1; an encounter with zero POSTED charges (even if
          PENDING exist) must fail with ERR_CHARGES_NOT_READY.
        test_recipe:
          setup:
            - "POST /patients → patient_id. POST /patients/{pid}/policies → policy_id."
            - "POST /_clock/advance to 2026-02-01T00:00:00Z."
            - "POST /encounters → encounter_id. POST /encounters/{id}/verify-eligibility eligible=true."
            - "(Do NOT add any ChargeItem.)"
          trigger:
            - "POST /encounters/{id}/discharge."
          assert:
            - "Response status code == 422"
            - "Response data.error_id == 'ERR_CHARGES_NOT_READY'."
            - "Encounter.status remains 'ELIGIBILITY_VERIFIED'."

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: encounter_advancement_depends_on_policy_eligibility
        grounds:
          - state_machines.Encounter.REGISTERED_to_ELIGIBILITY_VERIFIED
          - state_machines.InsurancePolicy.UNVERIFIED_to_INELIGIBLE
          - entities.InsurancePolicy.fields.status
        distinguishing_aspect: |
          Entity pair: Encounter ↔ InsurancePolicy. Encounter can only advance from
          REGISTERED to ELIGIBILITY_VERIFIED when its associated InsurancePolicy
          transition resolves to ELIGIBLE; the INELIGIBLE branch leaves the Encounter
          stuck at REGISTERED.
        test_recipe:
          setup:
            - "POST /patients → patient_id. POST /patients/{pid}/policies → policy_id."
            - "POST /_clock/advance to 2026-02-01T00:00:00Z."
            - "POST /encounters → encounter_id."
          trigger:
            - "POST /encounters/{id}/verify-eligibility with policy_eligible=false."
          assert:
            - "InsurancePolicy.status == 'INELIGIBLE'."
            - "Encounter.status == 'REGISTERED'  # cross-entity dependency: encounter did NOT advance because policy was INELIGIBLE"

      - name: coding_finalize_depends_on_chargeitem_cpt_set
        grounds:
          - state_machines.CodingRecord.DRAFT_to_FINALIZED
          - state_machines.ChargeItem.PENDING_to_POSTED
          - state_machines.ChargeItem.POSTED_to_VOIDED
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair: CodingRecord ↔ ChargeItem (different pair from instance 1).
          CodingRecord finalize is gated by the MULTISET of non-VOIDED ChargeItem.cpt_code
          values; if the submitted cpt_codes don't match the current ChargeItem state, finalize fails.
        test_recipe:
          setup:
            - "Build encounter through CHARGES_CAPTURED with two posted charges: cpt='99213' and cpt='99214'."
          trigger:
            - "POST /encounters/{id}/coding primary_icd10='J18.9', cpt_codes=['99213'] (missing 99214), finalize=true."
          assert:
            - "Response status code == 422 AND error_id == 'ERR_CODING_CPT_MISMATCH'."
            - "Encounter.status remains 'CHARGES_CAPTURED'."
            - "After resubmitting with cpt_codes=['99213','99214'] finalize succeeds and Encounter.status == 'CODED'."

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: policy_plan_year_must_match_current_calendar_year
        grounds:
          - validations[priority=7]
          - entities.InsurancePolicy.fields.plan_year
          - endpoints[POST /encounters/{encounter_id}/verify-eligibility]
        distinguishing_aspect: |
          Interval semantics #1 — point-in-time membership in a CLOSED annual interval.
          The eligibility check rejects a policy whose plan_year integer does NOT contain
          the test clock's current year; the geometry is a "year bucket" (calendar year is
          a closed interval [Jan-1 00:00:00, Dec-31 23:59:59.999]) with discrete-integer
          year identity. Resource entity: InsurancePolicy.
        test_recipe:
          setup:
            - "POST /patients → patient_id."
            - "POST /patients/{pid}/policies with plan_year=2025 → policy_id  # last year's plan."
            - "POST /_clock/advance to 2026-02-01T00:00:00Z."
            - "POST /encounters with patient_id, policy_id → encounter_id."
          trigger:
            - "POST /encounters/{id}/verify-eligibility policy_eligible=true."
          assert:
            - "Response status code == 422 AND error_id == 'ERR_PLAN_YEAR_EXPIRED'."
            - "Encounter.status remains 'REGISTERED'."

      - name: writeoff_window_aggregate_age_threshold
        grounds:
          - calculations.bad_debt_writeoff_calc
          - validations[priority=14]
          - entities.Encounter.fields.discharge_at
        distinguishing_aspect: |
          Interval semantics #2 — aggregate age threshold on a HALF-OPEN past interval
          [billed_at, now). The geometry is the LENGTH of an open-ended interval anchored
          at billed_at; rejection occurs when |interval| < 90 days. Different geometry
          (length-of-interval) than instance 1's point-in-interval test. Resource entity:
          Encounter (vs InsurancePolicy in instance 1).
        test_recipe:
          setup:
            - "Build encounter through BILLED with billed_at recorded at 2026-02-01T00:00:00Z and patient_responsibility_cents=10000."
            - "POST /_clock/advance to 2026-04-30T00:00:00Z (~88 days elapsed; |interval| < 90)."
          trigger:
            - "POST /encounters/{id}/write-off."
          assert:
            - "Response status code == 422 AND error_id == 'ERR_WRITE_OFF_TOO_EARLY'."
            - "Encounter.status remains 'BILLED'."
            - "No BadDebtRecord row created for this Encounter."

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: allowed_amount_conservation_payer_plus_patient
        grounds:
          - calculations.payer_clearance_calc
          - calculations.patient_responsibility_calc
          - entities.ClearanceDecision.fields.allowed_amount_cents
          - entities.Encounter.fields.payer_responsibility_cents
          - entities.Encounter.fields.patient_responsibility_cents
        distinguishing_aspect: |
          Conserved quantity #1: ClearanceDecision.allowed_amount_cents.
          After CLEARED transition (decision in {APPROVED, PARTIAL}), the invariant
          allowed_amount_cents == payer_responsibility_cents + patient_responsibility_cents
          MUST hold exactly. The forward action is the clearance write; its compensating
          decomposition (payer_clearance_calc subtraction + patient_responsibility_calc waterfall)
          must not lose or gain cents.
        test_recipe:
          setup:
            - "Build encounter through CODED with total_charges_cents=200000 and policy D=50000, C=2500, M=80000."
          trigger:
            - "POST /encounters/{id}/clearance decision='APPROVED', allowed_amount_cents=200000."
          assert:
            - "Encounter.patient_responsibility_cents == 80000."
            - "Encounter.payer_responsibility_cents == 120000."
            - "Encounter.patient_responsibility_cents + Encounter.payer_responsibility_cents == 200000  # == ClearanceDecision.allowed_amount_cents — conservation"

      - name: outstanding_balance_conservation_under_payment_and_refund
        grounds:
          - calculations.outstanding_balance_calc
          - entities.PatientPayment.fields.amount_cents
          - entities.PatientPayment.fields.method
          - entities.Encounter.fields.patient_responsibility_cents
        distinguishing_aspect: |
          Conserved quantity #2 (DIFFERENT — patient_responsibility_cents, not allowed_amount).
          The invariant: at any time after CLEARED,
          outstanding_balance_cents
          == Encounter.patient_responsibility_cents
             - SUM(non-REFUND payment.amount_cents)
             + SUM(REFUND payment.amount_cents)
             (clamped at zero).
          A non-REFUND payment of X followed by a REFUND of X (compensating pair) MUST
          leave outstanding_balance_cents at its starting value.
        test_recipe:
          setup:
            - "Build encounter through BILLED with patient_responsibility_cents=10000."
            - "Capture S0 = GET /encounters/{id}; assert S0.outstanding_balance_cents == 10000."
          trigger:
            - "POST /encounters/{id}/payments amount_cents=4000, method='CARD'."
            - "Capture S1 = GET /encounters/{id}."
            - "POST /encounters/{id}/payments amount_cents=4000, method='REFUND'."
            - "Capture S2 = GET /encounters/{id}."
          assert:
            - "S1.outstanding_balance_cents == 6000  # 10000 - 4000"
            - "S2.outstanding_balance_cents == 10000  # 6000 + 4000 (refund) — conservation under compensating pair"
            - "S2.status == 'BILLED'  # encounter NOT resolved because balance restored"
