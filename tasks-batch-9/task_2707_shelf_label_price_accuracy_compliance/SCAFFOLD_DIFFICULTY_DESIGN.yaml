# ============================================================================
# 1.8 Scaffold Difficulty Design — task_2707 Shelf Label & Price Accuracy
#     Compliance. Every instance grounds only in elements declared in
#     SCAFFOLD.yaml §1.1-§1.7. Deleting this file changes no declared behavior.
#     Clock default is 2026-08-01T00:00:00Z (see the §1.5 clock endpoint).
# ============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: audit_error_rate_gross_vs_net_variant_divergence
        grounds:
          - calculations.scanner_audit_error_rate
          - entities.ScannerAudit.fields.gross_error_rate_pct
          - entities.ScannerAudit.fields.net_overcharge_rate_pct
          - entities.ScannerAudit.fields.rate_variant_applied
          - entities.Jurisdiction.fields.default_rate_variant
          - state_machines.ScannerAudit.SCANNING_to_CLOSED
        distinguishing_aspect: |
          Domain is ScannerAudit outcome determination: one identical five-line scan set
          (1 overcharge, 1 undercharge, 3 matches) yields error_rate_pct 40.00 and outcome
          FAIL under GROSS_MISMATCH but 0.00 and outcome PASS under NET_OVERCHARGE, because
          only NET_OVERCHARGE nets undercharges against overcharges and floors at zero.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default."
            - "Jurisdiction US-CA with scanner_error_rate_threshold_pct 25.0 and default_rate_variant GROSS_MISMATCH."
            - "One store with two aisles (A01/DAIRY, A02/BAKERY) and one CERTIFIED PRICE_AUDITOR."
            - "Two audits, one per aisle, each carrying the same five scan lines: one +150c overcharge, one -100c undercharge, three exact matches."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", scanner_error_rate_threshold_pct: 25.0, default_rate_variant: "GROSS_MISMATCH", overcharge_refund_policy: "REFUND_DIFFERENCE_PLUS_FIXED", refund_fixed_bonus_cents: 500, refund_cap_cents: 5000, refund_budget_per_audit_cents: 100000, penalty_per_violation_cents: 5000, penalty_max_cents: 2000000, signage_disclosure_codes: ["UNIT_PRICE", "EXPIRY_DATE"], grace_period_hours: 48, accountability_variant: "OCCURRENCE_WEIGHTED" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A02", category_code: "BAKERY" }
              as: PricingAdmin
              captures: { aisle_a2: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T08:00:00Z", scan_window_end: "2026-08-01T10:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_g: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_g}/scan-lines"
              payload: { item_upc: "00000000000101", shelf_price_cents: 949, register_price_cents: 1099 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_g}/scan-lines"
              payload: { item_upc: "00000000000102", shelf_price_cents: 500, register_price_cents: 400 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_g}/scan-lines"
              payload: { item_upc: "00000000000103", shelf_price_cents: 299, register_price_cents: 299 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_g}/scan-lines"
              payload: { item_upc: "00000000000104", shelf_price_cents: 199, register_price_cents: 199 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_g}/scan-lines"
              payload: { item_upc: "00000000000105", shelf_price_cents: 399, register_price_cents: 399 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a2}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T08:00:00Z", scan_window_end: "2026-08-01T10:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_n: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_n}/scan-lines"
              payload: { item_upc: "00000000000101", shelf_price_cents: 949, register_price_cents: 1099 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_n}/scan-lines"
              payload: { item_upc: "00000000000102", shelf_price_cents: 500, register_price_cents: 400 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_n}/scan-lines"
              payload: { item_upc: "00000000000103", shelf_price_cents: 299, register_price_cents: 299 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_n}/scan-lines"
              payload: { item_upc: "00000000000104", shelf_price_cents: 199, register_price_cents: 199 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_n}/scan-lines"
              payload: { item_upc: "00000000000105", shelf_price_cents: 399, register_price_cents: 399 }
              as: PriceAuditor
              as_user_id: "${pa1}"
          trigger:
            - call: "POST /price-integrity/scanner-audits/${audit_g}/close"
              payload: { rate_variant: "GROSS_MISMATCH" }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_n}/close"
              payload: { rate_variant: "NET_OVERCHARGE" }
              as: PriceAuditor
              as_user_id: "${pa1}"
          assert:
            - "ScannerAudit.${audit_g}.sample_size == 5"
            - "ScannerAudit.${audit_g}.overcharge_count == 1"
            - "ScannerAudit.${audit_g}.undercharge_count == 1"
            - "ScannerAudit.${audit_g}.gross_error_rate_pct == 40.00"
            - "ScannerAudit.${audit_g}.net_overcharge_rate_pct == 0.00"
            - "ScannerAudit.${audit_g}.error_rate_pct == 40.00"
            - "ScannerAudit.${audit_g}.rate_variant_applied == GROSS_MISMATCH"
            - "ScannerAudit.${audit_g}.outcome == FAIL"
            - "ScannerAudit.${audit_n}.gross_error_rate_pct == 40.00"
            - "ScannerAudit.${audit_n}.net_overcharge_rate_pct == 0.00"
            - "ScannerAudit.${audit_n}.error_rate_pct == 0.00"
            - "ScannerAudit.${audit_n}.rate_variant_applied == NET_OVERCHARGE"
            - "ScannerAudit.${audit_n}.outcome == PASS"
            - "ScannerAudit.${audit_g}.error_rate_pct - ScannerAudit.${audit_n}.error_rate_pct == 40.00"
            - "Store.${store_a}.failed_audit_count_30d == 1"
            - "Store.${store_a}.compliance_posture == RESTRICTED"
            - "GET /price-integrity/associates/${pa1}/accountability-actions returns total_count 0 — neither aisle has an assigned associate, so the FAIL cascade takes the empty-candidate fallback"

      - name: accountability_score_occurrence_vs_task_weighted_divergence
        grounds:
          - calculations.associate_accountability_score
          - entities.Jurisdiction.fields.accountability_variant
          - entities.Associate.fields.accountability_score
          - entities.Associate.fields.verified_placement_count
          - state_machines.Associate.CERTIFIED_to_SUSPENDED
        distinguishing_aspect: |
          Domain is Associate certification standing, not audit outcome: one identical
          COACHING action (score_weight 5) against an associate with verified_placement_count 0
          leaves accountability_score 95 and training_status CERTIFIED under
          OCCURRENCE_WEIGHTED, but yields 50.00 and forces CERTIFIED -> SUSPENDED under
          TASK_WEIGHTED, because only TASK_WEIGHTED amortises the weight over
          (verified_placement_count + TASK_WEIGHT_OFFSET).
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default."
            - "Jurisdiction US-CA with accountability_variant OCCURRENCE_WEIGHTED and jurisdiction US-NY with accountability_variant TASK_WEIGHTED."
            - "One store in each jurisdiction, each with one CERTIFIED LABEL_ASSOCIATE who has zero verified placements."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", accountability_variant: "OCCURRENCE_WEIGHTED", scanner_error_rate_threshold_pct: 25.0 }
              as: PricingAdmin
              captures: { jur_occ: $.data.id }
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-NY", name: "New York", accountability_variant: "TASK_WEIGHTED", scanner_error_rate_threshold_pct: 25.0 }
              as: PricingAdmin
              captures: { jur_task: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_occ}" }
              as: PricingAdmin
              captures: { store_occ: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S002", name: "Hudson Yards", jurisdiction_id: "${jur_task}" }
              as: PricingAdmin
              captures: { store_task: $.data.id }
            - call: "POST /price-integrity/stores/${store_occ}/associates"
              payload: { employee_number: "E-LA1", full_name: "Lena Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la_occ: $.data.id }
            - call: "POST /price-integrity/stores/${store_task}/associates"
              payload: { employee_number: "E-LA2", full_name: "Nina Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la_task: $.data.id }
            - call: "POST /price-integrity/associates/${la_occ}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/associates/${la_task}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
          trigger:
            - call: "POST /price-integrity/associates/${la_occ}/accountability-actions"
              payload: { trigger_code: "VERIFICATION_REJECTED", action_type: "COACHING", source_ref: "manual-review-1" }
              as: ComplianceOfficer
              captures: { act_occ: $.data.id }
            - call: "POST /price-integrity/associates/${la_task}/accountability-actions"
              payload: { trigger_code: "VERIFICATION_REJECTED", action_type: "COACHING", source_ref: "manual-review-2" }
              as: ComplianceOfficer
              captures: { act_task: $.data.id }
          assert:
            - "AccountabilityAction.${act_occ}.score_weight == 5"
            - "AccountabilityAction.${act_task}.score_weight == 5"
            - "Associate.${la_occ}.verified_placement_count == 0"
            - "Associate.${la_task}.verified_placement_count == 0"
            - "Associate.${la_occ}.accountability_score == 95"
            - "Associate.${la_occ}.training_status == CERTIFIED"
            - "Associate.${la_task}.accountability_score == 50.00"
            - "Associate.${la_task}.training_status == SUSPENDED"
            - "Associate.${la_occ}.issued_action_count == 1 and Associate.${la_task}.issued_action_count == 1"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: unit_price_display_nested_rounding_order_divides_before_rounding
        grounds:
          - calculations.unit_price_display
          - entities.PriceChangeLine.fields.unit_price_display_cents
          - entities.PriceChangeLine.fields.unit_price_basis_qty
          - entities.PriceChangeLine.fields.unit_price_basis_uom
          - entities.Jurisdiction.fields.unit_price_uom_rule
          - entities.Jurisdiction.fields.unit_price_rounding
        distinguishing_aspect: |
          Mode (b) nested rounding where the order matters: the basis quantity 26 OZ -> 1.625 LB
          must stay unrounded and the single ROUND_HALF_UP must land only on the quotient, giving
          499 / 1.625 = 307.0769... -> 307; rounding the basis to 1.63 first gives 306, so the
          two orders are distinguishable by one cent on a declared field.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default."
            - "Jurisdiction US-CA with unit_price_uom_rule PER_UNIT_MEASURE_CANONICAL, unit_price_decimal_places 2, unit_price_rounding ROUND_HALF_UP."
            - "One store in that jurisdiction and one DRAFT price change file scoped to it."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", unit_price_uom_rule: "PER_UNIT_MEASURE_CANONICAL", unit_price_decimal_places: 2, unit_price_rounding: "ROUND_HALF_UP", grace_period_hours: 48 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-1001", jurisdiction_id: "${jur_a}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_a}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_a: $.data.id }
          trigger:
            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000000201", item_description: "Cheddar block 26oz", category_code: "DAIRY", old_retail_cents: 549, new_retail_cents: 499, net_content_qty: 26, net_content_uom: "OZ" }
              as: PricingAdmin
              captures: { line_oz: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000000202", item_description: "Juice 48 fl oz", category_code: "DAIRY", old_retail_cents: 1399, new_retail_cents: 1299, net_content_qty: 48, net_content_uom: "FL_OZ" }
              as: PricingAdmin
              captures: { line_floz: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000000203", item_description: "Butter 12oz", category_code: "DAIRY", old_retail_cents: 1099, new_retail_cents: 1000, net_content_qty: 12, net_content_uom: "OZ" }
              as: PricingAdmin
              captures: { line_oz2: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000000204", item_description: "Single donut", category_code: "BAKERY", old_retail_cents: 399, new_retail_cents: 349, net_content_qty: 1, net_content_uom: "EACH" }
              as: PricingAdmin
              captures: { line_each: $.data.id }
          assert:
            - "PriceChangeLine.${line_oz}.unit_price_basis_uom == LB"
            - "PriceChangeLine.${line_oz}.unit_price_basis_qty == 1.625"
            - "PriceChangeLine.${line_oz}.unit_price_display_cents == 307"
            - "PriceChangeLine.${line_oz}.unit_price_display_cents != 306 — rounding the 1.625 LB basis to 1.63 before dividing is the forbidden order"
            - "PriceChangeLine.${line_floz}.unit_price_basis_uom == GAL"
            - "PriceChangeLine.${line_floz}.unit_price_basis_qty == 0.375"
            - "PriceChangeLine.${line_floz}.unit_price_display_cents == 3464"
            - "PriceChangeLine.${line_oz2}.unit_price_basis_qty == 0.75"
            - "PriceChangeLine.${line_oz2}.unit_price_display_cents == 1333"
            - "PriceChangeLine.${line_each}.unit_price_basis_uom == EACH"
            - "PriceChangeLine.${line_each}.unit_price_basis_qty == 1"
            - "PriceChangeLine.${line_each}.unit_price_display_cents == 349"
            - "PriceChangeFile.${file_a}.line_count == 4"

      - name: penalty_exposure_tier_item_cap_aggravator_and_ceiling_interact
        grounds:
          - calculations.penalty_exposure
          - entities.InspectionFinding.fields.penalty_component_cents
          - entities.RegulatoryInspection.fields.penalty_exposure_cents
          - entities.Jurisdiction.fields.penalty_per_violation_cents
          - entities.Jurisdiction.fields.penalty_max_cents
          - state_machines.InspectionFinding.OPEN_to_WAIVED
        distinguishing_aspect: |
          Mode (a) four inputs interacting non-linearly: severity weight, the per-finding
          min(affected_item_count, PENALTY_ITEM_CAP=10) clamp, the finding-count tier multiplier,
          and the +25 point aggravator for a FAIL evidence audit, all summed BEFORE a single
          FLOOR and then clamped by penalty_max_cents — three findings produce scaled 225000
          clamped to 200000, and waiving the MINOR drops n from 3 to 2, which moves the tier
          from 125 to 100 and lands on exactly 125000.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default."
            - "Jurisdiction US-CA with penalty_per_violation_cents 5000, penalty_max_cents 200000, scanner_error_rate_threshold_pct 25.0."
            - "One store, one aisle, one CERTIFIED PRICE_AUDITOR."
            - "One CLOSED audit with outcome FAIL (4 scan lines, 1 overcharge -> gross 25.00 == threshold)."
            - "One SCHEDULED inspection whose evidence audit is that CLOSED FAIL audit."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", scanner_error_rate_threshold_pct: 25.0, default_rate_variant: "GROSS_MISMATCH", penalty_per_violation_cents: 5000, penalty_max_cents: 200000 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "REGULATORY", scan_window_start: "2026-08-01T08:00:00Z", scan_window_end: "2026-08-01T10:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_f: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_f}/scan-lines"
              payload: { item_upc: "00000000000101", shelf_price_cents: 949, register_price_cents: 1099 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_f}/scan-lines"
              payload: { item_upc: "00000000000102", shelf_price_cents: 299, register_price_cents: 299 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_f}/scan-lines"
              payload: { item_upc: "00000000000103", shelf_price_cents: 199, register_price_cents: 199 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_f}/scan-lines"
              payload: { item_upc: "00000000000104", shelf_price_cents: 399, register_price_cents: 399 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_f}/close"
              payload: {}
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/regulatory-inspections"
              payload: { store_id: "${store_a}", scanner_audit_id: "${audit_f}", inspector_ref: "INSP-9001", inspection_date: "2026-08-02T09:00:00Z" }
              as: ComplianceOfficer
              captures: { insp_a: $.data.id }
          trigger:
            - call: "POST /price-integrity/regulatory-inspections/${insp_a}/issue-findings"
              payload: { findings: [ { finding_code: "SHELF_REGISTER_MISMATCH", severity: "MAJOR", affected_item_count: 4, affected_aisle_code: "A01" }, { finding_code: "UNIT_PRICE_FORMAT", severity: "MINOR", affected_item_count: 12, affected_aisle_code: "A01" }, { finding_code: "SIGNAGE_EXPIRED", severity: "CRITICAL", affected_item_count: 1, affected_aisle_code: "A01" } ] }
              as: ComplianceOfficer
            - call: "GET /price-integrity/regulatory-inspections/${insp_a}/findings"
              payload: {}
              as: ComplianceOfficer
              captures: { f_major: "$.data[0].id", f_minor: "$.data[1].id", f_critical: "$.data[2].id" }
            - call: "POST /price-integrity/inspection-findings/${f_minor}/transition"
              payload: { target_status: "WAIVED", waiver_reason: "Unit price format corrected before inspection closed" }
              as: ComplianceOfficer
          assert:
            - "ScannerAudit.${audit_f}.error_rate_pct == 25.00 and ScannerAudit.${audit_f}.outcome == FAIL"
            - "After issue-findings: InspectionFinding.${f_major}.penalty_component_cents == 60000"
            - "After issue-findings: InspectionFinding.${f_minor}.penalty_component_cents == 50000 — affected_item_count 12 is clamped to PENALTY_ITEM_CAP 10, so it is not 60000"
            - "After issue-findings: InspectionFinding.${f_critical}.penalty_component_cents == 40000"
            - "After issue-findings: RegulatoryInspection.${insp_a}.penalty_exposure_cents == 200000 — raw 150000, tier 125 + aggravator 25 = 150 gives scaled 225000, clamped by penalty_max_cents 200000"
            - "After issue-findings: RegulatoryInspection.${insp_a}.finding_count == 3"
            - "After issue-findings: RegulatoryInspection.${insp_a}.status == FINDINGS_ISSUED"
