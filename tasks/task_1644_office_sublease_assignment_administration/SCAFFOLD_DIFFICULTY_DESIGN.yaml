  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_duty_segregation_on_decide
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DUTY_SEGREGATION]
        distinguishing_aspect: |
          Pair state(5) vs business_safety(6): a decide call whose review is already decided AND whose landlord
          identity is wrong must return ERR_INVALID_STATE (priority 5), not ERR_DUTY_SEGREGATION — the state check
          dominates the segregation check on the same endpoint.
