              payload: { activation_start_date: "2027-01-01" }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "GET /erm/subscriptions/${sub_id}/invoice-allocation"
              payload: {}
              as: ConsortiumAdmin
              as_user_id: "admin-1"
          assert:
            - "response.data.total_cents == 9000000"
            - "response.data.residual_cents == -1"
            - "response.data.residual_assigned_commitment_id == ${c_a_id}"
            - "response.data.lines[0].commitment_id == ${c_a_id} and response.data.lines[0].allocated_cents == 2666666"
            - "response.data.lines[1].commitment_id == ${c_b_id} and response.data.lines[1].allocated_cents == 3066667"
            - "response.data.lines[2].commitment_id == ${c_c_id} and response.data.lines[2].allocated_cents == 3266667"
            - "sum of response.data.lines[*].allocated_cents == 9000000"

      - name: renewal_offer_band_keyed_on_prior_term_price_not_on_the_offer_being_computed
        grounds:
          - calculations.renewal_offer_price
          - calculations.cost_per_use_cents
          - state_machines.RenewalDecision.VOTING_to_DECIDED_RENEW
          - validations[priority=33]
          - entities.RenewalDecision.fields.offer_price_cents
        distinguishing_aspect: |
