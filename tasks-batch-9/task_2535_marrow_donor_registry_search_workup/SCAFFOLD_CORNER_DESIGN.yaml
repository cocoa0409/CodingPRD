      - name: same_physician_cannot_clear_the_exam_and_decide_the_method
        claim_type: Segregation of duties
        grounds:
          - complexity_profile.role_model
          - roles[MedicalDirector].note
          - validations[priority=10]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: segregation_of_duties_error_outranks_unconsented_method_error
          rationale: |
            §1.8 already owns the two-physician rule and owns it more sharply than a standalone corner test
            could: it has the SAME MedicalDirector who recorded the PHYSICAL_EXAM result request a method the
            donor never consented to, so priority 10 (ERR_SEGREGATION_OF_DUTIES) and priority 22
            (ERR_METHOD_NOT_CONSENTED) are violated by one call, and it then shows the identical payload
            succeeding once a different physician id sends it. That instance therefore already asserts the
            positive path (a second physician is accepted), the negative path (the same physician is
            refused), the field the rule reads (WorkupCase.physical_cleared_by_user_id, stamped from
            X-User-ID at the PHYSICAL_EXAM result) and the priority ordering. Repeating it here would add
            no discriminating power.

  # ---------------------------------------------------------------------------
  # Cross-cutting complexity layers declared in complexity_profile:
  # optimistic_concurrency (two §1.2.1 rules), cascading_side_effects,
  # dual_variant_calculation and selector_policy. selector_policy has no row in
  # the claim-extraction guide, so it is asserted through the §1.3
  # candidate-selector instances of the `calculations` section above rather than
  # through an invented claim_type here.
  # ---------------------------------------------------------------------------
  - section: cross-cutting complexity layers
    instances:

      - name: booking_create_rejects_a_stale_workup_case_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[booking-create-stale-workup]
          - validations[priority=33]
          - errors[ERR_STALE_WORKUP_VERSION]
        distinguishing_aspect: |
          The §1.2.1 booking-create rule exists because a booking create is a SUPERSEDE operation: it
          silently replaces the case's prior HELD booking. This instance walks exactly that hazard - the
          client reads the case, books a slot (which bumps the case version), then books a second slot with
          the version it read BEFORE the first booking. The stale attempt must be refused with 412 even
          though the slot itself is perfectly legal, and the refusal must leave the first booking untouched;
          re-reading the case and retrying the identical payload then succeeds and supersedes the first
          booking. A version counter that is bumped only by "real" field edits and not by the
          logistics_status transition would let the stale write through.
        test_recipe:
          setup:
            - "the canonical domestic chain up to logistics_status METHOD_SET: candidate screened PASS, workup case opened, all three clearance items PASS, collection method PBSC authorized by md-2"
            - "conditioning is SCHEDULEd for 2026-08-05, so the admissible collection window is 2026-08-11..2026-08-13"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/collection-centers"
              payload: { name: "Midwest Apheresis Center", country_code: "US", concurrent_collection_capacity: 2 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { center_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
