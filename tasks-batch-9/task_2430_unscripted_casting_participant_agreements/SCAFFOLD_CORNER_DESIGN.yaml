      - name: casting_call_applicants_sub_resource_returns_only_that_calls_applicants
        claim_type: cross_reference_link
        grounds:
          - endpoints.GET_/casting/casting-calls/{id}/applicants
          - entities.Applicant.fields.casting_call_id
          - entities.CastingCall.fields.screened_pass_count
        distinguishing_aspect: |
          Cross-reference claim: the sub-resource is scoped by the path id, not a global
          applicant list. Two calls on the same production hold two and one applicants
          respectively and each sub-resource returns only its own rows; the
          screening_status filter narrows within that scope (one CLEARED of the two on
          call 1) rather than across the production. An implementation that ignored the
          path id would return 3 rows from both endpoints.
