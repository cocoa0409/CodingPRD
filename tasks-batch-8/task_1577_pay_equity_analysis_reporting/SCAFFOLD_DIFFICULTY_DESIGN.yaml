            - { call: "PATCH /api/employee-snapshots/${t_f1}", payload: { comparator_group_id: "${gt}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${t_f2}", payload: { comparator_group_id: "${gt}" }, as: PeopleOpsAdmin }
