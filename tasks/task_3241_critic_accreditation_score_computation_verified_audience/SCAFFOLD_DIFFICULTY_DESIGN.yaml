              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_cb
            - call: "POST /critics/${cb}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *k_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *k_ra
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
            - &k_rb2
              call: "POST /releases/${r1}/reviews"
              payload: { critic_id: "${cb}", body_text: "A mess.", self_designation: "ROTTEN" }
              as: Critic
              as_user_id: "${cb}"
              captures: { rb: $.data.id }
            - call: "POST /reviews/${rb}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${cb}"
            - &k_arp
              call: "POST /accreditation-reviews"
              payload: { subject_publication_id: "${pub1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: AccreditationBoard
              captures: { arp: $.data.id }
            - call: "POST /accreditation-reviews/${arp}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: AccreditationBoard
          trigger:
            - call: "POST /accreditation-reviews/${arp}/transition"
              payload: { action: "RULE_REVOKE" }
              as: AccreditationBoard
            - call: "GET /releases/${r1}/score-snapshots"
              as: AccreditationBoard
          assert:
            - "Publication.${pub1}.status == REVOKED (hop 1)"
            - "Critic.${ca}.accreditation_status == REVOKED and Critic.${cb}.accreditation_status == REVOKED (hop 2)"
            - "the non-superseded CERTIFIED tomatometer snapshot for R1 has total_count == 0 (both reviews de-accredited), so Release.${r1}.tomatometer_pct is null — not 0 (hop 3)"
            - "the PROVISIONAL snapshot still reports total_count == 2, pct == 50"

