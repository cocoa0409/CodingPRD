  # --- SwimTeamRegistration ---------------------------------------------------
  - method: POST
    path: "/swim-club/swim-team-registrations"
    description: "Register a swimmer for the season's swim team. A full squad still accepts the registration, but parks it in WAITLISTED."
    roles: [SwimTeamCoach, Member]
    code: 201
    input: [membership_id, season_id, swimmer_name, swimmer_birthdate, squad]
    output: SwimTeamRegistration
    side_effects: ["squad_seq := this swimmer's 1-based rank within its own membership, ordering the membership's registrations in status PENDING, CONFIRMED, WAITLISTED or COMPLETED by swimmer_birthdate ASC then created_at ASC", "status := PENDING, or WAITLISTED when the season+squad already holds SQUAD_CAPACITY[squad] registrations in PENDING, CONFIRMED or COMPLETED", "assessed_fee_cents := round_half_up(SWIM_TEAM_FEE_CENTS * (1 - min(MULTI_SWIMMER_DISCOUNT_RATE * (squad_seq - 1), MULTI_SWIMMER_DISCOUNT_CAP)))", "membership.swim_team_fee_cents recomputed, and the membership's invoice picks it up in Line 4"]

  - method: POST
    path: "/swim-club/swim-team-registrations/{id}/transitions"
    description: "Move a registration through CONFIRMED or WITHDRAWN. REVOKED and COMPLETED are reached only by cascade."
    roles: [SwimTeamCoach]
    code: 200
    input: [to_status]
    output: SwimTeamRegistration
    side_effects: ["status := to_status when the edge is declared in §1.2", "CONFIRMED requires membership.access_status == ACTIVE and membership.dues_status IN {INVOICED, PAID}, and raises membership.volunteer_credits_required", "WITHDRAWN and REVOKED release every VolunteerAssignment of this registration still in ASSIGNED, decrementing meet.volunteer_slots_filled and possibly pushing a STAFFED meet back to UNDERSTAFFED", "a freed squad slot promotes the earliest WAITLISTED sibling registration for the same season and squad back to PENDING", "membership.version += 1", "version += 1"]

  - method: GET
    path: "/swim-club/swim-team-registrations/{id}"
    description: "Read one swim-team registration."
    roles: [SwimTeamCoach, MembershipChair, Treasurer, BoardPresident, Member]
    code: 200
    input: []
    output: SwimTeamRegistration
    side_effects: []

  - method: GET
    path: "/swim-club/swim-team-registrations"
    description: "List swim-team registrations, filterable by membership, season, squad and status."
    roles: [SwimTeamCoach, MembershipChair, Treasurer, BoardPresident, Member]
    code: 200
    input: ["membership_id?", "season_id?", "squad?", "status?", "limit?", "offset?"]
    output: SwimTeamRegistration[]
    side_effects: []

  # --- Meet -------------------------------------------------------------------
  - method: POST
    path: "/swim-club/meets"
    description: "Schedule a home meet with its volunteer credit requirement. volunteer_slots_required may be 0, which is the empty-set edge of the roster-close comparison."
    roles: [SwimTeamCoach]
    code: 201
    input: [season_id, name, start_iso, end_iso, expected_swimmers, volunteer_slots_required]
    output: Meet
    side_effects: ["status := SCHEDULED", "volunteer_slots_filled := 0", "roster_closed_at := null", "understaffed_penalty_cents := 0"]

  - method: POST
    path: "/swim-club/meets/{id}/close-roster"
    description: "Close the volunteer roster. The meet forks to STAFFED when filled credits meet or exceed the requirement and to UNDERSTAFFED otherwise."
    roles: [SwimTeamCoach]
    code: 200
    input: []
    output: Meet
    side_effects: ["roster_closed_at := clock", "status SCHEDULED -> STAFFED when volunteer_slots_filled >= volunteer_slots_required (inclusive; a meet with volunteer_slots_required 0 and zero assignments is STAFFED), otherwise -> UNDERSTAFFED with understaffed_penalty_cents := (volunteer_slots_required - volunteer_slots_filled) * MEET_UNDERSTAFF_PENALTY_CENTS (7500)", "no further VolunteerAssignment may be created for this meet", "version += 1"]

  - method: POST
    path: "/swim-club/meets/{id}/transitions"
    description: "Move a meet to HOSTED or CANCELLED. Hosting requires a compliant staffing window."
    roles: [SwimTeamCoach]
    code: 200
    input: [to_status]
    output: Meet
    side_effects: ["status := to_status when the edge is declared in §1.2", "HOSTED from STAFFED completes every ASSIGNED VolunteerAssignment of the meet; HOSTED from UNDERSTAFFED does the same and additionally charges understaffed_penalty_cents to the sponsoring memberships' balance_due_cents", "CANCELLED releases every ASSIGNED assignment", "version += 1"]

  - method: GET
    path: "/swim-club/meets/{id}"
    description: "Read one meet, including its filled/required volunteer credits."
    roles: [SwimTeamCoach, BoardPresident, Treasurer, Member]
    code: 200
    input: []
    output: Meet
    side_effects: []

  - method: GET
    path: "/swim-club/meets"
    description: "List meets, filterable by season and status."
    roles: [SwimTeamCoach, BoardPresident, Treasurer, Member]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: Meet[]
    side_effects: []

  # --- VolunteerAssignment ----------------------------------------------------
  - method: POST
    path: "/swim-club/volunteer-assignments"
    description: "Assign a volunteer job at a meet to a swimmer's registration. Slots are counted in credits, not in bodies, and an assignment counts the moment it is created."
    roles: [SwimTeamCoach]
    code: 201
    input: [meet_id, swim_team_registration_id, job_code]
    output: VolunteerAssignment
    side_effects: ["status := ASSIGNED", "credit_value := JOB_CREDIT_VALUES[job_code]", "meet.volunteer_slots_filled += credit_value immediately, because ASSIGNED already counts", "meet.version += 1"]

  - method: POST
    path: "/swim-club/volunteer-assignments/{id}/transitions"
    description: "Move an assignment to COMPLETED or NO_SHOW. RELEASED is produced only by the registration-revoked or meet-cancelled cascade."
    roles: [SwimTeamCoach, Member]
    code: 200
    input: [to_status]
    output: VolunteerAssignment
    side_effects: ["status := to_status when the edge is declared in §1.2", "NO_SHOW and RELEASED lower meet.volunteer_slots_filled by credit_value and can push a STAFFED meet back to UNDERSTAFFED", "COMPLETED keeps the slot filled and raises the sponsoring membership's volunteer_credits_earned per calculations.volunteer_credit_balance, lowering volunteer_buyout_cents", "meet.version += 1 and membership.version += 1", "version += 1"]

  - method: GET
    path: "/swim-club/volunteer-assignments/{id}"
    description: "Read one volunteer assignment."
    roles: [SwimTeamCoach, BoardPresident, Treasurer, Member]
    code: 200
    input: []
    output: VolunteerAssignment
