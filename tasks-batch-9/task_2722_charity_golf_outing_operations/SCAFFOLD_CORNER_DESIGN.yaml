            - "${e_receipt} == 'ERR_CROSS_OUTING_REFERENCE' (HTTP 409), NOT a status complaint about the LISTED item - priority 6 is evaluated before any state check on the subject"
            - "the same-outing team creation is HTTP 201 with player_count == 1, and GET /outing-ops/outings/${o1_id} is unchanged apart from that team"
            - "GET /outing-ops/registrations?outing_id=${o1_id} still returns total_count == 1 - the rejected cross-outing registration was never created"

      - name: opening_registration_is_conditional_on_a_signed_contract_and_at_least_one_tier
