            - "ReleasePlan.${plan_id}.cumulative_gross_cents == 1050000"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: invalid_state_beats_fiscal_campaign_budget
        grounds:
          - validations.priority_5_state
          - validations.priority_13_business_fiscal
          - errors.ERR_INVALID_STATE
          - errors.ERR_CAMPAIGN_BUDGET_EXCEEDED
        distinguishing_aspect: |
          state (priority 5) vs business_fiscal (priority 13): when a spend is
          posted against a PLANNING campaign (wrong state) AND would exceed the
          budget (fiscal violation), the state error wins because state checks
          precede fiscal checks.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Acquired film, premiere booked, campaign PLANNING (not activated)."
            - "Campaign budget 1000000."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "Meridian", director_name: "Ana Ruiz", principal_cast: ["Jae Park"], genre: "DRAMA", runtime_minutes: 102, production_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 5000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 8000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_id: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v2: $.data.version }
            - call: "POST /films/${film_id}/offers/${offer_id}/accept"
              payload: { expected_film_version: "${film_v2}" }
              as: AcquisitionExec
              captures: { deal_id: $.data.id }
            - call: "POST /films/${film_id}/awards-campaigns"
              payload: { deal_id: "${deal_id}", awards_body: "OSCARS", target_categories: ["BEST_PICTURE"], budget_total_cents: 1000000 }
              as: AwardsStrategist
              captures: { campaign_id: $.data.id }
          trigger:
            - call: "POST /awards-campaigns/${campaign_id}/spends"
              payload: { category: "PUBLICITY", amount_cents: 5000000, incurred_at: "2026-10-01T00:00:00Z", target_category: "BEST_PICTURE" }
              as: AwardsStrategist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (campaign is PLANNING, not ACTIVE)"
            - "error_id != ERR_CAMPAIGN_BUDGET_EXCEEDED"
            - "response status == 409 (state), not 402 (fiscal)"

      - name: referential_beats_temporal_travel_buffer
        grounds:
          - validations.priority_10_business_referential
          - validations.priority_9_business_temporal
          - errors.ERR_TALENT_NOT_ON_FILM
          - errors.ERR_TRAVEL_BUFFER_VIOLATION
        distinguishing_aspect: |
          Different category pair than instance 1: business_referential (priority
          10, wrapped in ERR_TALENT_NOT_ON_FILM — but here the conflict surfaces
          when the obligation references a talent_name not on the film) vs
          business_temporal (priority 9, travel buffer). Even though the
          travel-buffer violation would also fire, the referential error wins
          because the talent isn't on the film at all.

          Note: talent-not-on-film is enforced at obligation CREATE time
          (priority 10 maps to "Cross-entity state" cluster). The conflicting
          scenario: create obligation with bogus talent_name AND a window that
          would violate the travel buffer if the talent existed.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Acquired film F with principal_cast=[Jae Park] and director Ana Ruiz."
            - "Existing CONFIRMED obligation for Jae Park in NY, 2026-12-01T10:00:00Z to 2026-12-01T12:00:00Z."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "Meridian", director_name: "Ana Ruiz", principal_cast: ["Jae Park"], genre: "DRAMA", runtime_minutes: 102, production_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/talent-obligations"
              payload: { talent_name: "Jae Park", obligation_kind: "PRESS_JUNKET", window_starts_at: "2026-12-01T10:00:00Z", window_ends_at: "2026-12-01T12:00:00Z", city_code: "NY" }
              as: TalentCoordinator
              captures: { ob1: $.data.id }
            - call: "POST /films/${film_id}/talent-obligations/${ob1}/confirm"
              payload: {}
              as: TalentCoordinator
          trigger:
            # Confirm a new obligation whose talent doesn't exist on the film — but
            # also has a same-city window starting 3h after the existing one ends
            # (would violate travel buffer if the talent were valid).
            - call: "POST /films/${film_id}/talent-obligations"
              payload: { talent_name: "Unknown Person", obligation_kind: "TRAVEL", window_starts_at: "2026-12-01T15:00:00Z", window_ends_at: "2026-12-01T17:00:00Z", city_code: "NY" }
              as: TalentCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TALENT_NOT_ON_FILM"
            - "response status == 422"
            - "no TalentObligation row created for Unknown Person (GET /films/${film_id}/talent-obligations?talent_name=Unknown Person returns 0 rows)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: per_screen_avg_threshold_boundary_at_exactly_threshold
        grounds:
          - calculations.platform_expansion
          - validations.priority_10_business_referential
        distinguishing_aspect: |
