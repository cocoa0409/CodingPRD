              captures: { cm1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
          trigger:
            - call: "POST /refuge/determinations/${d1}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
              captures: { err: $.data.error_id }
            - call: "POST /refuge/comments/${cm1}/adjudicate"
              payload: { disposition: "NOTED" }
              as: PermitOfficer
              captures: { cm_st: $.data.status }
            - call: "POST /refuge/determinations/${d1}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
              captures: { d_st: $.data.status, d_find: $.data.finding }
          assert:
            - "finalize with 1 unresolved comment -> error_id == ERR_UNRESOLVED_COMMENTS (http 422)"
            - "after adjudication: comment status == ADJUDICATED"
            - "finalize with exactly 0 unresolved comments succeeds: status == FINAL, finding == COMPATIBLE"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: permit_approve_gated_by_determination_state_and_finding
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - state_machines.PermitApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Entity pair PermitApplication -> CompatibilityDetermination: approve
          requires the LINKED determination FINAL and COMPATIBLE. Leg A:
          determination in ADJUDICATION -> ERR_DETERMINATION_NOT_FINAL. Leg B:
          determination FINAL with NOT_COMPATIBLE -> ERR_USE_INCOMPATIBLE.
        test_recipe:
          setup:
            - "One unit. Determination D1 (RESEARCH) driven only to ADJUDICATION. Determination D2 (PHOTOGRAPHY) finalized NOT_COMPATIBLE. Two UNDER_REVIEW permits referencing D1 and D2 respectively."
