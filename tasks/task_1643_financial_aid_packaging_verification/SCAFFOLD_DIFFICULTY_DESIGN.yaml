      - name: priority_deadline_closed_boundary_cohort_assignment
        grounds:
          - entities.ISIRRecord.fields.cohort
          - entities.ISIRRecord.fields.received_at
        distinguishing_aspect: |
          Different interval semantics (closed-boundary classification vs
          uniqueness occupation) on a different resource (ISIRRecord):
          received_at exactly equal to priority_deadline is PRIORITY (<=
          comparison, closed interval), while received_at one second later is
          STANDARD — the boundary is inclusive, not half-open.
        test_recipe:
          setup:
            - "AidYear OPEN, priority_deadline 2026-03-01T00:00:00Z"
            - "Student T1 imports ISIR received_at exactly 2026-03-01T00:00:00Z; Student T2 imports received_at 2026-03-01T00:00:01Z"
