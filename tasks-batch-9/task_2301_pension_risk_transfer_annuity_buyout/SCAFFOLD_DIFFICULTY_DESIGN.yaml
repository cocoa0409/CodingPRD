            - "hop 1: AnnuityQuote.${qc_id}.quote_status == INELIGIBLE after the rating change"
            - "hop 2: BuyoutTranche.${t1_id}.tranche_status == QUOTING with selected_quote_id, selected_insurer_id, selection_score_bp and selection_basis all null"
