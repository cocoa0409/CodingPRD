      - name: parallel_agency_axes_shape_is_covered_by_the_difficulty_index
        claim_type: parallel
        excluded_because:
          difficulty_instance: agency_agreement_and_training_axes_advance_independently
          rationale: "The only interesting parallel-shape claim on this scaffold is that Agency.agreement_status and Agency.training_status advance on independent axes while eligibility_posture is the derived join of the two; §1.8 already drives all four axis combinations (PENDING/REQUIRED, ACTIVE/REQUIRED, ACTIVE/CURRENT, EXPIRED/CURRENT) through renewals, trainings and the compliance sweep and asserts the posture at each combination. A §1.9 duplicate would re-walk the same transitions."

      - name: compound_cycle_draw_posture_shape_is_covered_by_the_difficulty_index
        claim_type: compound
        excluded_because:
          difficulty_instance: delivery_confirmation_propagates_order_allocation_then_cycle_posture
          rationale: "AllocationCycle.draw_posture is the scaffold's only compound (parent-derived-from-children) state, and re-derivation on child change is exactly what the §1.8 transitive cascade asserts end-to-end: order -> DELIVERED, AgencyAllocation.cases_delivered / cases_remaining / status, then cycle draw_posture PARTIAL -> FULLY_DRAWN. Any §1.9 instance would repeat that four-link chain."

      - name: cyclic_order_revision_shape_is_covered_by_the_difficulty_index
        claim_type: cyclic
        excluded_because:
          difficulty_instance: order_revision_loop_returns_to_draft_then_blocks_returning_reviewer
          rationale: "The single cycle in §1.2 is SUBMITTED -> DRAFT -> SUBMITTED via return-for-revision, whose termination condition (revision_count monotonicity plus the segregation-of-duties lock on the returning reviewer) is asserted in §1.8. A §1.9 loop test would issue the same three calls."

      - name: guarded_transfer_transition_is_covered_by_the_difficulty_index
        claim_type: guarded transitions
        excluded_because:
          difficulty_instance: transfer_accept_depends_on_source_lot_hold_state
          rationale: "The guarded transitions on this scaffold all read as 'A -> B only if the source InventoryLot is not HOLD'; §1.8 already tests transfer accept refused while the lot is held (ERR_RECALL_HOLD_ACTIVE) and succeeding after the recall closes, which is the strongest form of the claim."

      - name: recall_hold_cascade_down_is_covered_by_the_difficulty_index
        claim_type: cascade down
        excluded_because:
          difficulty_instance: recall_hold_propagates_lot_then_appointment_then_order
          rationale: "The only multi-level downward cascade is the recall hold (lot -> appointment -> order), and §1.8 asserts each level plus the non-terminal-children-only rule (a DELIVERED appointment of the same lot is not blocked). Re-testing it here would add no distinguishable claim."

      - name: appointment_cancel_compensation_is_covered_by_the_difficulty_index
        claim_type: compensation
        excluded_because:
          difficulty_instance: order_cancel_returns_case_commitments_to_pre_approval_values
          rationale: "Compensation on this scaffold means 'undo the approval ledger with no drift', asserted in §1.8 against the strictest carrier: order cancel restoring InventoryLot.cases_committed, AgencyAllocation.cases_committed / cases_remaining and AllocationCycle.draw_posture to their exact pre-approval values. Appointment cancel is a weaker subset (dock and pallet release only) and is exercised as a step of the endpoints section below."

