            - call: "POST /pickup-appointments"
              payload: { route_id: "${route_id}", return_case_id: "${rc1}", slot_start_at: "2026-09-15T09:00:00Z", slot_end_at: "2026-09-15T11:00:00Z", expected_pickup_route_version: "${route_v1}" }
              as: LogisticsCoordinator
