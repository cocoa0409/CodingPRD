# =============================================================================
# §1.9 Scaffold Corner Design — Homeowner Association Declarant Turnover
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1–§1.7. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
# appear as excluded_because stubs citing the covering instance by name.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: association_creation_returns_every_declared_field_with_derived_defaults
        claim_type: Creation
        grounds:
          - entities.Association
          - endpoints[POST /hoa/associations]
          - response_envelope
        distinguishing_aspect: "A single POST /hoa/associations returns 201 and the created row carries all eight input fields verbatim plus every computed/system default: sold_lot_count 0, sold_lot_pct 0.00, subsidy_receivable_cents 0, reserve_claim_committed_cents 0, reserve_claim_available_cents equal to the pool (not 0), subsidy_end_date null, budget_forecast_status CURRENT, version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hoa/associations"
              payload: { name: "Alder Commons", total_planned_lots: 40, turnover_threshold_pct: 75.00, fixed_turnover_date: "2028-01-01T00:00:00Z", statute_of_repose_years: 10, reserve_pool_cents: 900000, reserve_claim_pool_cents: 2500000, declarant_monthly_subsidy_cents: 70000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
          assert:
            - "response code is 201 and the body is the { data: ... } envelope"
            - "data.name == Alder Commons, data.total_planned_lots == 40, data.turnover_threshold_pct == 75.00"
            - "data.fixed_turnover_date == 2028-01-01T00:00:00Z, data.statute_of_repose_years == 10"
            - "data.reserve_pool_cents == 900000, data.reserve_claim_pool_cents == 2500000, data.declarant_monthly_subsidy_cents == 70000"
            - "data.sold_lot_count == 0 and data.sold_lot_pct == 0.00"
            - "data.subsidy_receivable_cents == 0"
            - "data.reserve_claim_committed_cents == 0 and data.reserve_claim_available_cents == 2500000"
            - "data.subsidy_end_date == null and data.budget_forecast_status == CURRENT"
            - "data.id is a non-empty string, data.version == 1, data.created_at == 2026-08-01T00:00:00Z, data.updated_at == 2026-08-01T00:00:00Z"

      - name: association_retrieval_returns_the_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - endpoints[GET /hoa/associations/{id}]
          - entities.Association
        distinguishing_aspect: "GET /hoa/associations/{id} is a pure read: it returns the same id, the same version and the same field values the create call returned, and it does not bump version or updated_at."
        test_recipe:
          setup:
            - "One Association 'Birchfield' created by the PlatformAdmin."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Birchfield", total_planned_lots: 12, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 100000, reserve_claim_pool_cents: 400000, declarant_monthly_subsidy_cents: 20000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id, v_created: $.data.version }
          trigger:
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: Auditor
              as_user_id: "auditor-9"
          assert:
            - "response code is 200"
            - "data.id == ${assoc_id}"
            - "data.name == Birchfield and data.reserve_claim_available_cents == 400000"
            - "data.version == ${v_created}, unchanged by the read"

      - name: lots_listing_applies_filter_then_pagination_with_stable_total_count
        claim_type: Listing
        grounds:
          - endpoints[GET /hoa/associations/{id}/lots]
          - response_envelope.pagination_fields
          - entities.Lot.fields.sale_status
        distinguishing_aspect: "The sale_status filter is applied BEFORE limit/offset, so total_count reports the filtered cardinality (3 CLOSED of 5 lots), has_more is true only while offset+limit < total_count, and the two pages of the filtered set are disjoint and exhaustive. An implementation that paginates first then filters returns total_count 5 or short pages."
        test_recipe:
          setup:
            - "Association 'Cinder Row' with five Lots: C-001, C-002, C-003 CLOSED (in that creation order) and C-004, C-005 UNSOLD."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Cinder Row", total_planned_lots: 5, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 50000, reserve_claim_pool_cents: 100000, declarant_monthly_subsidy_cents: 10000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "C-001" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot1_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "C-002" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot2_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "C-003" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot3_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "C-004" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot4_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "C-005" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot5_id: $.data.id }
            - call: "POST /hoa/lots/${lot1_id}/close-sale"
              payload: { closing_date: "2026-02-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots/${lot2_id}/close-sale"
              payload: { closing_date: "2026-02-02T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots/${lot3_id}/close-sale"
              payload: { closing_date: "2026-02-03T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
          trigger:
            - call: "GET /hoa/associations/${assoc_id}/lots"
              payload: { sale_status: "CLOSED", limit: 2, offset: 0 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "GET /hoa/associations/${assoc_id}/lots"
              payload: { sale_status: "CLOSED", limit: 2, offset: 2 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "GET /hoa/associations/${assoc_id}/lots"
              payload: { limit: 10, offset: 0 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "first trigger call: total_count == 3, has_more == true, limit == 2, offset == 0, and data contains exactly 2 Lot rows, both with sale_status CLOSED"
            - "second trigger call: total_count == 3, has_more == false, and data contains exactly 1 Lot row with sale_status CLOSED"
            - "the union of the two filtered pages is exactly {${lot1_id}, ${lot2_id}, ${lot3_id}} with no duplicates"
            - "third trigger call: total_count == 5, has_more == false, and data contains exactly 5 Lot rows"
            - "Association.${assoc_id}.sold_lot_count == 3 and sold_lot_pct == 60.00"

      - name: every_path_id_that_does_not_resolve_returns_its_own_not_found_error
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors.ERR_ASSOCIATION_NOT_FOUND
          - errors.ERR_LOT_NOT_FOUND
          - errors.ERR_COMPONENT_NOT_FOUND
          - errors.ERR_TURNOVER_CASE_NOT_FOUND
          - errors.ERR_RESERVE_STUDY_NOT_FOUND
          - errors.ERR_SUBSIDY_ENTRY_NOT_FOUND
          - errors.ERR_AUDIT_ENGAGEMENT_NOT_FOUND
          - errors.ERR_DEFECT_CLAIM_NOT_FOUND
          - errors.ERR_VENDOR_CONTRACT_NOT_FOUND
          - errors.ERR_RECORDS_ITEM_NOT_FOUND
          - errors.ERR_DIRECTOR_NOT_FOUND
          - errors.ERR_ASSESSMENT_SCHEDULE_NOT_FOUND
        distinguishing_aspect: "Priority 4 resolves path ids left to right and returns the error id of the entity whose id failed — never a generic 404 and never ERR_INVALID_REQUEST. One control Association exists so the collections are non-empty, proving the 404s come from id resolution rather than from empty tables."
        test_recipe:
          setup:
            - "One control Association exists; every other collection is empty."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Control Association", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { control_assoc_id: $.data.id }
          trigger:
            - call: "GET /hoa/associations/00000000-0000-0000-0000-000000000001"
              payload: {}
              as: PlatformAdmin
              captures: { e_assoc: $.data.error_id }
            - call: "POST /hoa/lots/00000000-0000-0000-0000-000000000002/close-sale"
              payload: { closing_date: "2026-08-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_lot: $.data.error_id }
            - call: "POST /hoa/components/00000000-0000-0000-0000-000000000003/milestones"
              payload: { milestone: "DEED_TENDERED" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_component: $.data.error_id }
            - call: "GET /hoa/turnover-cases/00000000-0000-0000-0000-000000000004"
              payload: {}
              as: PlatformAdmin
              captures: { e_case: $.data.error_id }
            - call: "POST /hoa/reserve-studies/00000000-0000-0000-0000-000000000005/actions"
              payload: { action: "ADOPT" }
              as: TransitionCommittee
              as_user_id: "${control_assoc_id}"
              captures: { e_study: $.data.error_id }
            - call: "GET /hoa/subsidy-entries/00000000-0000-0000-0000-000000000006"
              payload: {}
              as: Auditor
              as_user_id: "auditor-9"
              captures: { e_entry: $.data.error_id }
            - call: "POST /hoa/audit-engagements/00000000-0000-0000-0000-000000000007/issue"
              payload: {}
              as: Auditor
              as_user_id: "auditor-9"
              captures: { e_engagement: $.data.error_id }
            - call: "GET /hoa/defect-claims/00000000-0000-0000-0000-000000000008"
              payload: {}
              as: Auditor
              as_user_id: "auditor-9"
              captures: { e_claim: $.data.error_id }
            - call: "GET /hoa/vendor-contracts/00000000-0000-0000-0000-000000000009"
              payload: {}
              as: Auditor
              as_user_id: "auditor-9"
              captures: { e_contract: $.data.error_id }
            - call: "POST /hoa/records-items/00000000-0000-0000-0000-000000000010/transitions"
              payload: { action: "DELIVER" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_records_item: $.data.error_id }
            - call: "POST /hoa/directors/00000000-0000-0000-0000-000000000011/rescind"
              payload: {}
              as: ElectionInspector
              as_user_id: "inspector-1"
              captures: { e_director: $.data.error_id }
            - call: "POST /hoa/assessment-schedules/00000000-0000-0000-0000-000000000012/adopt"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${control_assoc_id}"
              captures: { e_schedule: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 404"
            - "e_assoc == ERR_ASSOCIATION_NOT_FOUND"
            - "e_lot == ERR_LOT_NOT_FOUND"
            - "e_component == ERR_COMPONENT_NOT_FOUND"
            - "e_case == ERR_TURNOVER_CASE_NOT_FOUND"
            - "e_study == ERR_RESERVE_STUDY_NOT_FOUND"
            - "e_entry == ERR_SUBSIDY_ENTRY_NOT_FOUND"
            - "e_engagement == ERR_AUDIT_ENGAGEMENT_NOT_FOUND"
            - "e_claim == ERR_DEFECT_CLAIM_NOT_FOUND"
            - "e_contract == ERR_VENDOR_CONTRACT_NOT_FOUND"
            - "e_records_item == ERR_RECORDS_ITEM_NOT_FOUND"
            - "e_director == ERR_DIRECTOR_NOT_FOUND"
            - "e_schedule == ERR_ASSESSMENT_SCHEDULE_NOT_FOUND"
            - "no entity is created or mutated by any of the twelve calls"

      - name: create_calls_missing_required_input_fields_are_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /hoa/associations]
          - endpoints[POST /hoa/lots]
          - endpoints[POST /hoa/defect-claims]
          - endpoints[POST /hoa/components/{id}/milestones]
        distinguishing_aspect: "Every field declared in an endpoint's input: without a trailing ? is required, and the action-conditional fields are required too: BUILD_COMPLETE without effective_date and RESERVE without valuation_basis both fail with ERR_INVALID_REQUEST (400) rather than silently defaulting."
        test_recipe:
          setup:
            - "Association 'Dovetail Yard' with one CommonAreaComponent, both created normally."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Dovetail Yard", total_planned_lots: 8, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 10000, reserve_claim_pool_cents: 50000, declarant_monthly_subsidy_cents: 5000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Mail Kiosk", category: "INFRASTRUCTURE", replacement_cost_cents: 120000, useful_life_years: 15, effective_age_years: 1, promised_completion_date: "2026-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_no_lot_number: $.data.error_id }
            - call: "POST /hoa/associations"
              payload: { name: "No Threshold HOA", total_planned_lots: 8, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { e_no_threshold: $.data.error_id }
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", defect_summary: "Kiosk lock failure" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { e_no_estimates: $.data.error_id }
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_no_effective_date: $.data.error_id }
          assert:
            - "all four trigger calls return HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "no Lot row exists for Association.${assoc_id}"
            - "exactly one Association exists after the triggers"
            - "no DefectClaim row exists for Association.${assoc_id}"
            - "CommonAreaComponent.${comp_id}.build_status == UNBUILT and substantial_completion_date == null"

      - name: omitted_optional_inputs_fall_back_to_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Lot.fields.sale_status
          - entities.CommonAreaComponent.fields.build_status
          - entities.RecordsTransferItem.fields.required
          - endpoints[POST /hoa/lots]
          - endpoints[POST /hoa/components]
          - endpoints[POST /hoa/records-items]
        distinguishing_aspect: "Each optional input marked with ? has exactly one declared default: Lot.sale_status UNSOLD, CommonAreaComponent.build_status UNBUILT, RecordsTransferItem.required true. Omitting them must produce those values, and the derived counters must treat the defaults as real values (sold_lot_count stays 0; the required item drops completeness to 0.00)."
        test_recipe:
          setup:
            - "Association 'Everly Point' with a TurnoverCase (total_seats 3)."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Everly Point", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "E-001" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Playground", category: "AMENITY", replacement_cost_cents: 300000, useful_life_years: 12, effective_age_years: 0, promised_completion_date: "2029-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "PERMITS" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { item_id: $.data.id }
            - call: "GET /hoa/turnover-cases/${case_id}"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "Lot.${lot_id}.sale_status == UNSOLD and closing_date == null"
            - "Association.${assoc_id}.sold_lot_count == 0 and sold_lot_pct == 0.00"
            - "CommonAreaComponent.${comp_id}.build_status == UNBUILT, substantial_completion_date == null, conveyance_status == NOT_CONVEYED"
            - "RecordsTransferItem.${item_id}.required == true and status == OUTSTANDING"
            - "fourth trigger call: data.records_transfer_completeness_pct == 0.00, because the one required item is not ACCEPTED"
            - "fourth trigger call: data.vacant_seats == 3 and data.owner_elected_seats_required == 0"

      - name: computed_and_system_fields_supplied_by_a_client_are_input_ignored
        claim_type: Computed Fields
        grounds:
          - validations[priority=6]
          - entities.Association.fields.sold_lot_count
          - entities.Association.fields.budget_forecast_status
          - entities.DefectClaim.fields.status
          - entities.DefectClaim.fields.reserved_amount_cents
          - entities.DefectClaim.fields.repose_deadline
        distinguishing_aspect: "Priority 6 says computed and system fields supplied by a client are IGNORED, not rejected: the create still returns 201, but sold_lot_count stays 0, budget_forecast_status stays CURRENT, version stays 1, the claim's status stays INVESTIGATING, reserved_amount_cents stays 0, and repose_deadline is derived from the component (null here, since the component has no substantial_completion_date) rather than echoed from the body."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hoa/associations"
              payload: { name: "Foxglen", total_planned_lots: 10, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 100000, reserve_claim_pool_cents: 600000, declarant_monthly_subsidy_cents: 15000, sold_lot_count: 9, sold_lot_pct: 90.00, reserve_claim_committed_cents: 500000, budget_forecast_status: "STALE", id: "client-chosen-id", version: 77 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Gatehouse", category: "STRUCTURE", replacement_cost_cents: 500000, useful_life_years: 30, effective_age_years: 0, promised_completion_date: "2027-06-01T00:00:00Z", conveyance_status: "CONVEYED", substantial_completion_date: "2020-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", defect_summary: "Gatehouse arch cracking", repair_cost_estimate_cents: 200000, diminution_value_cents: 100000, status: "RESERVED", reserved_amount_cents: 999999, repose_deadline: "2099-01-01T00:00:00Z", negotiation_round: 5 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "first trigger call returns 201, not 400"
            - "data.id != client-chosen-id and data.version == 1"
            - "Association.${assoc_id}.sold_lot_count == 0, sold_lot_pct == 0.00, reserve_claim_committed_cents == 0, reserve_claim_available_cents == 600000"
            - "Association.${assoc_id}.budget_forecast_status == CURRENT"
            - "second trigger call returns 201 with data.conveyance_status == NOT_CONVEYED, data.substantial_completion_date == null, data.conveyed_at == null"
            - "third trigger call returns 201 with data.status == INVESTIGATING, data.negotiation_round == 0, data.reserved_amount_cents == 0, data.valuation_basis == null"
            - "DefectClaim.${claim_id}.repose_deadline == null, because the component has no substantial_completion_date"
            - "DefectClaim.${claim_id}.created_at == 2026-08-01T00:00:00Z"

      - name: enum_range_and_ordering_constraints_are_rejected_on_create
        claim_type: Type Constraints
        grounds:
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
          - entities.CommonAreaComponent.fields.category
          - entities.TurnoverCase.fields.total_seats
          - entities.SubsidyEntry.fields.period_month
          - entities.AuditEngagement.fields.period_end
          - entities.VendorContract.fields.service_window_end
        distinguishing_aspect: "Priority 6 covers four distinct shape faults, all ERR_INVALID_REQUEST (400): an out-of-enum category, a total_seats value that breaks the 3..9-odd constraint (4), a period_month that breaks ^YYYY-MM$ (2026-13), and interval endpoints in the wrong order (period_end < period_start, and service_window_end == service_window_start where the constraint is strictly greater)."
        test_recipe:
          setup:
            - "Association 'Gorse Hollow' with one CommonAreaComponent."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Gorse Hollow", total_planned_lots: 7, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 12000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Fence Line", category: "INFRASTRUCTURE", replacement_cost_cents: 80000, useful_life_years: 10, effective_age_years: 1, promised_completion_date: "2026-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Odd Thing", category: "LANDSCAPE", replacement_cost_cents: 1000, useful_life_years: 5, effective_age_years: 0, promised_completion_date: "2027-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_enum: $.data.error_id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 4 }
              as: PlatformAdmin
              captures: { e_seats: $.data.error_id }
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "ACCRUAL", amount_cents: 12000, period_month: "2026-13" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_month: $.data.error_id }
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-06-30T00:00:00Z", period_end: "2026-01-01T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { e_period_order: $.data.error_id }
            - call: "POST /hoa/vendor-contracts"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", vendor_name: "Zero Window Services", developer_affiliated: false, annual_cost_cents: 1000, service_window_start: "2026-03-01T00:00:00Z", service_window_end: "2026-03-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_window_order: $.data.error_id }
          assert:
            - "all five trigger calls return HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "exactly one CommonAreaComponent exists for Association.${assoc_id}"
            - "no TurnoverCase, SubsidyEntry, AuditEngagement or VendorContract exists for Association.${assoc_id}"
            - "Association.${assoc_id}.version == 1, untouched by any of the five rejections"

      - name: body_foreign_keys_must_resolve_and_agree_across_entities
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors.ERR_ASSOCIATION_NOT_FOUND
          - errors.ERR_COMPONENT_NOT_FOUND
          - entities.DefectClaim.fields.component_id
          - entities.VendorContract.fields.component_id
        distinguishing_aspect: "Under the flat topology, priority 5 does two things a plain existence check does not: it resolves body FKs (unknown association_id → ERR_ASSOCIATION_NOT_FOUND) AND it enforces cross-entity agreement — a component_id that exists but belongs to a DIFFERENT association than the body's association_id must fail with ERR_COMPONENT_NOT_FOUND, not succeed and not raise ERR_ASSOCIATION_NOT_FOUND."
        test_recipe:
          setup:
            - "Two Associations, 'Hazel Park' and 'Iron Wharf'."
            - "One CommonAreaComponent 'Boardwalk' belonging to Iron Wharf only."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Hazel Park", total_planned_lots: 9, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 100000, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_a_id: $.data.id }
            - call: "POST /hoa/associations"
              payload: { name: "Iron Wharf", total_planned_lots: 9, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 100000, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_b_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_b_id}", name: "Boardwalk", category: "STRUCTURE", replacement_cost_cents: 700000, useful_life_years: 20, effective_age_years: 2, promised_completion_date: "2026-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_b_id: $.data.id }
          trigger:
            - call: "POST /hoa/lots"
              payload: { association_id: "00000000-0000-0000-0000-0000000000aa", lot_number: "H-001" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_fk_assoc: $.data.error_id }
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_a_id}", component_id: "${comp_b_id}", defect_summary: "Boardwalk plank rot", repair_cost_estimate_cents: 100000, diminution_value_cents: 50000 }
              as: TransitionCommittee
              as_user_id: "${assoc_a_id}"
              captures: { e_cross_claim: $.data.error_id }
            - call: "POST /hoa/vendor-contracts"
              payload: { association_id: "${assoc_a_id}", component_id: "${comp_b_id}", vendor_name: "Plank & Sons", developer_affiliated: false, annual_cost_cents: 50000, service_window_start: "2026-01-01T00:00:00Z", service_window_end: "2026-12-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_cross_contract: $.data.error_id }
          assert:
            - "e_fk_assoc == ERR_ASSOCIATION_NOT_FOUND with HTTP 404"
            - "e_cross_claim == ERR_COMPONENT_NOT_FOUND with HTTP 404"
            - "e_cross_contract == ERR_COMPONENT_NOT_FOUND with HTTP 404"
            - "no Lot, DefectClaim or VendorContract exists for Association.${assoc_a_id}"
            - "GET /hoa/associations/${assoc_b_id}/components returns total_count == 1"

      - name: second_turnover_case_for_one_association_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.TurnoverCase.fields.association_id
          - validations[priority=9]
          - errors.ERR_TURNOVER_CASE_EXISTS
          - endpoints[POST /hoa/turnover-cases]
        distinguishing_aspect: "At most one TurnoverCase may exist per Association, so a second POST for the same association_id fails with ERR_TURNOVER_CASE_EXISTS (409) even with a different legal total_seats; the same payload against a different association succeeds, proving the uniqueness scope is the association and not the platform."
        test_recipe:
          setup:
            - "Two Associations, 'Juniper Mesa' and 'Kelp Bay'."
            - "One TurnoverCase (total_seats 5) on Juniper Mesa."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Juniper Mesa", total_planned_lots: 9, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_a_id: $.data.id }
            - call: "POST /hoa/associations"
              payload: { name: "Kelp Bay", total_planned_lots: 9, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_b_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_a_id}", total_seats: 5 }
              as: PlatformAdmin
              captures: { case_a_id: $.data.id }
          trigger:
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_a_id}", total_seats: 7 }
              as: PlatformAdmin
              captures: { e_exists: $.data.error_id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_b_id}", total_seats: 7 }
              as: PlatformAdmin
              captures: { case_b_id: $.data.id }
          assert:
            - "first trigger call returns 409 with error_id ERR_TURNOVER_CASE_EXISTS"
            - "TurnoverCase.${case_a_id}.total_seats == 5, unchanged"
            - "GET /hoa/associations/${assoc_a_id}/turnover-cases returns total_count == 1"
            - "second trigger call returns 201 with TurnoverCase.${case_b_id}.total_seats == 7 and vacant_seats == 7"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.TurnoverCase
          - state_machines.Lot
          - state_machines.CommonAreaComponent
          - state_machines.DefectClaim
          - state_machines.VendorContract
          - state_machines.RecordsTransferItem
          - state_machines.AuditEngagement
          - state_machines.ReserveStudy
          - state_machines.Director
          - state_machines.SubsidyEntry
        distinguishing_aspect: "Every §1.2 machine's initial_state is observable on the create response: TurnoverCase DECLARANT_CONTROL x SUBSIDY_ACTIVE with posture DECLARANT_CONTROL_OPEN, CommonAreaComponent UNBUILT + NOT_CONVEYED, DefectClaim INVESTIGATING, VendorContract ACTIVE + NOT_REQUESTED, RecordsTransferItem OUTSTANDING, AuditEngagement ENGAGED, ReserveStudy DRAFT with UNDETERMINED, Director SEATED, SubsidyEntry POSTED. None of them starts mid-machine."
        test_recipe:
          setup:
            - "Association 'Marram Dunes' created by the PlatformAdmin; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Marram Dunes", total_planned_lots: 10, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 200000, reserve_claim_pool_cents: 500000, declarant_monthly_subsidy_cents: 25000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
          trigger:
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 5 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Seawall", category: "STRUCTURE", replacement_cost_cents: 900000, useful_life_years: 30, effective_age_years: 1, promised_completion_date: "2026-09-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
            - call: "POST /hoa/vendor-contracts"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", vendor_name: "Dune Care", developer_affiliated: true, annual_cost_cents: 90000, service_window_start: "2026-01-01T00:00:00Z", service_window_end: "2026-12-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { contract_id: $.data.id }
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "PLANS_AND_SPECS", required: true }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { item_id: $.data.id }
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { eng_id: $.data.id }
            - call: "POST /hoa/reserve-studies"
              payload: { association_id: "${assoc_id}", funding_method: "CASH_FLOW", planned_annual_contribution_cents: 300000, projected_annual_expenditure_cents: 100000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { study_id: $.data.id }
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Nils Aberg", seat_type: "DECLARANT_APPOINTED" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { dir_id: $.data.id }
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "ACCRUAL", amount_cents: 25000, period_month: "2026-07" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { entry_id: $.data.id }
          assert:
            - "TurnoverCase.${case_id}: governance_status == DECLARANT_CONTROL, financial_status == SUBSIDY_ACTIVE, turnover_posture == DECLARANT_CONTROL_OPEN, trigger_basis == null, owner_elected_seats_required == 0"
            - "CommonAreaComponent.${comp_id}: build_status == UNBUILT, conveyance_status == NOT_CONVEYED, substantial_completion_date == null"
            - "VendorContract.${contract_id}: status == ACTIVE, assignment_status == NOT_REQUESTED, cancellation_window_end == null"
            - "RecordsTransferItem.${item_id}: status == OUTSTANDING, delivered_at == null, rejection_reason == null"
            - "AuditEngagement.${eng_id}: status == ENGAGED, finding_status == CLEAN, unreconciled_delta_cents == 0, audited_receivable_snapshot_cents == 0, issued_by_user_id == null"
            - "ReserveStudy.${study_id}: status == DRAFT, evaluated_method == null, adequacy_verdict == UNDETERMINED, recommended_annual_contribution_cents == 0"
            - "Director.${dir_id}: status == SEATED, seated_by_user_id == declarant-1, vacated_at == null"
            - "SubsidyEntry.${entry_id}: status == POSTED, direction == ACCRUAL, reverses_entry_id == null, posted_by_user_id == declarant-1"
            - "Association.${assoc_id}.subsidy_receivable_cents == 25000 after the last trigger call"

      - name: records_item_reject_redeliver_cycle_then_accepted_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.RecordsTransferItem.DELIVERED_to_REJECTED
          - state_machines.RecordsTransferItem.REJECTED_to_DELIVERED
          - state_machines.RecordsTransferItem.DELIVERED_to_ACCEPTED
          - calculations.records_transfer_completeness
          - errors.ERR_RECORDS_ITEM_STATE_INVALID
        distinguishing_aspect: "The REJECTED -> DELIVERED edge makes the item cyclic, and each lap must reset rejection_reason and restamp delivered_at; ACCEPTED is terminal, so a second ACCEPT is refused with ERR_RECORDS_ITEM_STATE_INVALID while completeness stays at 50.00 (one of two required items) rather than climbing past 100."
        test_recipe:
          setup:
            - "Association 'Nettlebed' with a TurnoverCase (total_seats 3) and two required RecordsTransferItems, both OUTSTANDING."
            - "Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Nettlebed", total_planned_lots: 8, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "WARRANTIES", required: true }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { item1_id: $.data.id }
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "PERMITS", required: true }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { item2_id: $.data.id }
          trigger:
            - call: "POST /hoa/records-items/${item1_id}/transitions"
              payload: { action: "DELIVER" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/records-items/${item1_id}/transitions"
              payload: { action: "REJECT", rejection_reason: "warranty assignments unsigned" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/records-items/${item1_id}/transitions"
              payload: { action: "DELIVER" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/records-items/${item1_id}/transitions"
              payload: { action: "ACCEPT" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/records-items/${item1_id}/transitions"
              payload: { action: "ACCEPT" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { e_terminal: $.data.error_id }
            - call: "GET /hoa/turnover-cases/${case_id}"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "after the first trigger call: RecordsTransferItem.${item1_id}.status == DELIVERED and delivered_at == 2026-08-01T00:00:00Z"
            - "after the second trigger call: status == REJECTED and rejection_reason == warranty assignments unsigned"
            - "after the third trigger call: status == DELIVERED and rejection_reason == null"
            - "after the fourth trigger call: status == ACCEPTED"
            - "fifth trigger call returns 409 with error_id ERR_RECORDS_ITEM_STATE_INVALID"
            - "sixth trigger call: data.records_transfer_completeness_pct == 50.00"
            - "RecordsTransferItem.${item2_id}.status == OUTSTANDING throughout"

      - name: component_milestones_out_of_declared_order_are_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CommonAreaComponent.NOT_CONVEYED_to_DEED_TENDERED
          - state_machines.CommonAreaComponent.DEED_TENDERED_to_CONVEYED
          - state_machines.CommonAreaComponent.UNBUILT_to_COMPLETE
          - errors.ERR_COMPONENT_MILESTONE_INVALID
        distinguishing_aspect: "The two milestone dimensions are ordered: DEED_TENDERED requires build_status COMPLETE, CONVEYANCE_ACCEPTED requires conveyance_status DEED_TENDERED, and BUILD_COMPLETE cannot repeat once build_status is COMPLETE. All three faults are ERR_COMPONENT_MILESTONE_INVALID (409) and none of them writes substantial_completion_date or conveyed_at."
        test_recipe:
          setup:
            - "Association 'Oxbow Landing' with one UNBUILT CommonAreaComponent."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Oxbow Landing", total_planned_lots: 8, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Boat Ramp", category: "INFRASTRUCTURE", replacement_cost_cents: 300000, useful_life_years: 20, effective_age_years: 0, promised_completion_date: "2027-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "DEED_TENDERED" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_tender_before_build: $.data.error_id }
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2026-05-05T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "CONVEYANCE_ACCEPTED" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { e_accept_before_tender: $.data.error_id }
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2026-06-06T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_build_twice: $.data.error_id }
          assert:
            - "e_tender_before_build == ERR_COMPONENT_MILESTONE_INVALID with HTTP 409"
            - "e_accept_before_tender == ERR_COMPONENT_MILESTONE_INVALID with HTTP 409"
            - "e_build_twice == ERR_COMPONENT_MILESTONE_INVALID with HTTP 409"
            - "CommonAreaComponent.${comp_id}.build_status == COMPLETE and substantial_completion_date == 2026-05-05T00:00:00Z, NOT 2026-06-06T00:00:00Z"
            - "CommonAreaComponent.${comp_id}.conveyance_status == NOT_CONVEYED and conveyed_at == null"

      - name: lot_close_sale_is_not_idempotent_and_the_second_call_is_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Lot.UNSOLD_to_CLOSED
          - errors.ERR_LOT_STATE_INVALID
          - calculations.sold_lot_percentage
        distinguishing_aspect: "CLOSED is terminal for a Lot, so a repeated close-sale must fail with ERR_LOT_STATE_INVALID (409) AND must not double-count: sold_lot_count stays 1, sold_lot_pct stays 25.00, closing_date keeps the FIRST value, and Association.version does not advance on the rejected call."
        test_recipe:
          setup:
            - "Association 'Pemberly Row' with total_planned_lots 4 and one UNSOLD Lot."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Pemberly Row", total_planned_lots: 4, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "P-001" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /hoa/lots/${lot_id}/close-sale"
              payload: { closing_date: "2026-04-10T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v_after_close: $.data.version }
            - call: "POST /hoa/lots/${lot_id}/close-sale"
              payload: { closing_date: "2026-05-11T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_closed: $.data.error_id }
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "first trigger call returns 200 with Lot.${lot_id}.sale_status == CLOSED and closing_date == 2026-04-10T00:00:00Z"
            - "Association.${assoc_id}.sold_lot_count == 1 and sold_lot_pct == 25.00"
            - "third trigger call returns 409 with error_id ERR_LOT_STATE_INVALID"
            - "Lot.${lot_id}.closing_date == 2026-04-10T00:00:00Z, NOT 2026-05-11T00:00:00Z"
            - "Association.${assoc_id}.sold_lot_count == 1 and sold_lot_pct == 25.00 after the rejection"
            - "fourth trigger call: data.version == ${v_after_close}, so the rejected write did not bump the association"

      - name: rescinding_a_rescinded_or_declarant_appointed_seat_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Director.SEATED_to_RESCINDED
          - errors.ERR_DIRECTOR_STATE_INVALID
          - entities.Director.fields.seat_type
          - calculations.governance_seat_ledger
        distinguishing_aspect: "The rescind edge has two independent preconditions: status == SEATED and seat_type == OWNER_ELECTED. Rescinding an already-RESCINDED director and rescinding a DECLARANT_APPOINTED director both return ERR_DIRECTOR_STATE_INVALID (409), and neither call moves owner_elected_seats or vacant_seats — declarant seats leave only through the certify-trigger resignation cascade."
        test_recipe:
          setup:
            - "Association 'Quillon Ridge' with fixed_turnover_date 2026-07-01T00:00:00Z, already reached at the default clock 2026-08-01T00:00:00Z."
            - "TurnoverCase with total_seats 3; one DECLARANT_APPOINTED director seated after the trigger is certified, plus one OWNER_ELECTED director."
          setup_api_calls:
            - call: "POST /hoa/associations"
