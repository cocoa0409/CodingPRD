  # --- Operational clock and fault injection -------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The server starts with the logical clock fixed at the default instant 2026-09-01T00:00:00Z and never falls back to wall-clock time before this endpoint is first called."
    roles: [OperatorOnly]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, advanced_from: datetime }"
    side_effects:
      - "the logical clock is set to current_utc; every system-triggered transition whose moment has now passed fires in the declared order of §1.2"
      - "no wall-clock time is ever consulted, before or after this call"

  - method: POST
    path: "/_inject/client-history"
    description: "Test-driving endpoint: seed a client's accumulated no-show and late-cancellation counters so the strike boundary can be exercised without replaying prior sessions."
    roles: [OperatorOnly]
    code: 200
    input: [client_id, no_show_strike_count, late_cancel_count]
    output: Client
    side_effects: ["the named counters are set directly, bypassing the booking cascade, so a fixture can start a client exactly at a strike threshold"]

  - method: POST
    path: "/_inject/client-entitlement"
    description: "Test-driving endpoint: attach a membership or class pack to a client without walking the purchase workflow."
    roles: [OperatorOnly]
    code: 200
    input: [client_id, studio_id, kind, credits, "expires_at?"]
    output: "{ kind: string, entity_id: string, credits: integer }"
    side_effects: ["creates a Membership or ClassPack row directly, so a fixture can reach a credit-consuming booking path without first paying for a pack"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================

errors:

  # --- auth / context ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role is absent or names a role outside the §1.7 roster"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_STUDIO_NOT_OWNED
    http: 403
    condition: "a StudioOwner acts on a studio other than the one bound to their X-User-ID"

  # --- existence ---
  - id: ERR_STUDIO_NOT_FOUND
    http: 404
    condition: "the studio id in the path or body does not resolve"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "the subscription id does not resolve"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "the client id does not resolve"
  - id: ERR_CLASS_SESSION_NOT_FOUND
    http: 404
    condition: "the class session id does not resolve"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "the booking id does not resolve"
  - id: ERR_WAITLIST_ENTRY_NOT_FOUND
    http: 404
    condition: "the waitlist entry id does not resolve"
  - id: ERR_MEMBERSHIP_NOT_FOUND
    http: 404
    condition: "the membership id does not resolve"
  - id: ERR_CLASS_PACK_NOT_FOUND
    http: 404
    condition: "the class pack id does not resolve"
  - id: ERR_STAFF_MEMBER_NOT_FOUND
    http: 404
    condition: "the staff member id does not resolve"
  - id: ERR_PAYROLL_PERIOD_NOT_FOUND
    http: 404
    condition: "the payroll period id does not resolve"
  - id: ERR_PORTABILITY_REQUEST_NOT_FOUND
    http: 404
    condition: "the portability request id does not resolve"
  - id: ERR_BENEFIT_NETWORK_NOT_FOUND
    http: 404
    condition: "the benefit network code does not resolve"

  # --- state ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is in a state from which the requested transition is not declared in §1.2"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target resource is in a terminal state and admits no transition"
  - id: ERR_BOOKING_NOT_RESERVED
    http: 409
    condition: "check-in, cancel or restore is attempted on a booking that is not RESERVED"
  - id: ERR_ENTRY_NOT_OFFERED
    http: 409
    condition: "a waitlist claim is attempted on an entry that is not OFFERED"
  - id: ERR_SESSION_NOT_SCHEDULED
    http: 409
    condition: "a session update or instructor reassignment targets a session that is not SCHEDULED"
  - id: ERR_PAYROLL_PERIOD_NOT_OPEN
    http: 409
    condition: "a commission is accrued into, or a reopen is attempted on, a period that is not in the required state"
  - id: ERR_PORTABILITY_ALREADY_DECIDED
    http: 409
    condition: "an object, release or deny is attempted on a request that already carries a decision"
  - id: ERR_WAITLIST_TERMINAL
    http: 409
    condition: "a confirm-position or cancel is attempted on an entry in CLAIMED, EXPIRED or CANCELLED"

  # --- business_safety / posture / entitlement ---
  - id: ERR_STUDIO_NOT_OPERATING
    http: 409
    condition: "the studio posture is SUSPENDED or CANCELLED and the operation requires an operating business"
  - id: ERR_SUBSCRIPTION_INACTIVE
    http: 409
    condition: "the subscription is SUSPENDED or CANCELLED while the operation requires an active subscription"
  - id: ERR_PAYROLL_HOLD
    http: 409
    condition: "a payroll run or commission accrual is attempted while BusinessSubscription.payroll_hold is true"
  - id: ERR_FEATURE_NOT_IN_TIER
    http: 403
    condition: "the operation's feature gate is false on the studio's effective SubscriptionTier"

  # --- temporal ---
  - id: ERR_CLIENT_SCHEDULE_OVERLAP
    http: 409
    condition: "the client already holds a booking or a waitlist hold on a session whose [start_at, end_at) interval overlaps the target session"
  - id: ERR_ROOM_OVERLAP
    http: 409
    condition: "a class session's [start_at, end_at) interval collides with another session in the same room under the half-open rule"
  - id: ERR_BUFFER_INSUFFICIENT
    http: 409
    condition: "two sessions in the same room are separated by fewer minutes than the larger of their two ClassTemplate.buffer_minutes values"
  - id: ERR_PAYROLL_PERIOD_GAP
    http: 409
    condition: "a session's start_at is not covered by any payroll period of the studio"
  - id: ERR_CANCEL_WINDOW_CLOSED
    http: 409
    condition: "a cancellation is attempted after the session has already started"

  # --- constraint ---
  - id: ERR_STUDIO_CAPACITY_EXCEEDED
    http: 409
    condition: "a booking is attempted on a session whose fullness_posture is FULL or CANCELLED at the moment of the attempt"
  - id: ERR_ALLOCATION_EXHAUSTED
    http: 409
    condition: "the promotional allocation counter would be exceeded by releasing a seat"
  - id: ERR_NO_ACTIVE_PACK
    http: 409
    condition: "a booking names a class pack whose status is not ACTIVE or whose credits_remaining is 0"
  - id: ERR_MEMBERSHIP_INACTIVE
    http: 409
    condition: "a booking debits a membership that is not ACTIVE"
  - id: ERR_PAYROLL_PERIOD_OVERLAP
    http: 409
    condition: "a new payroll period's inclusive range intersects an existing period's range, or spans fewer than MIN_PAYROLL_PERIOD_DAYS calendar days"
  - id: ERR_CLIENT_EMAIL_CONFLICT
    http: 409
    condition: "the email is already used by another client on the same studio roster"

  # --- referential ---
  - id: ERR_CLIENT_NOT_ADMISSIBLE
    http: 409
    condition: "the client's status is PORTABILITY_HOLD, PORTED or ANONYMIZED, so the client may not take new bookings or holds"
  - id: ERR_INSTRUCTOR_NOT_ELIGIBLE
    http: 409
    condition: "the nominated substitute is absent from the candidate set of substitution_priority_score, or is the instructor of record"
  - id: ERR_NO_ELIGIBLE_SUBSTITUTE
    http: 409
    condition: "the substitution candidate set is empty and no override_reason was supplied"
  - id: ERR_NETWORK_NOT_ACTIVE
    http: 409
    condition: "the benefit network named by benefit_network_code does not exist or is not eligible for the studio"
  - id: ERR_PAYMENT_SOURCE_NOT_PERMITTED
    http: 409
    condition: "a payment_source that the channel does not accept is requested, such as a pack or membership credit on a marketplace booking"

  # --- fiscal ---
  - id: ERR_TIER_CHANGE_FEE_REQUIRED
    http: 402
    condition: "a tier change is attempted without a valid fee_payment_ref for the prorated tier-change fee"
  - id: ERR_EARLY_TERMINATION_FEE_REQUIRED
    http: 402
    condition: "a membership is cancelled before minimum_term_months have elapsed and no valid fee_payment_ref is supplied"
  - id: ERR_FREEZE_CAP_EXCEEDED
    http: 409
    condition: "the freeze would push freeze_days_used past FREEZE_ANNUAL_CAP_DAYS, or the plan's freeze_max_days_per_cycle"
  - id: ERR_PACK_EXTENSION_CAP_EXCEEDED
    http: 409
    condition: "the extension would push extension_days_used past PACK_MAX_EXTENSION_DAYS"
  - id: ERR_CLIENT_BALANCE_OUTSTANDING
    http: 409
    condition: "a portability release is requested while the requesting client's outstanding_fee_cents is above zero"
  - id: ERR_EXPORT_DOWNLOAD_CAP
    http: 409
    condition: "the export has already been downloaded EXPORT_MAX_DOWNLOADS times"
  - id: ERR_EXPORT_NOT_GRANTED
    http: 409
    condition: "an export is issued or downloaded while the request is not in RESOLVED_RELEASE or EXPORT_ISSUED"
  - id: ERR_PORTABILITY_WINDOW_CLOSED
    http: 409
    condition: "an objection or adjudication arrives after its window has lapsed"
  - id: ERR_PORTABILITY_COOLDOWN_ACTIVE
    http: 409
    condition: "a fresh portability request is filed inside the cooldown after a terminal one"
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 409
    condition: "a benefit-network claim resubmission exceeds CLAIM_RESUBMIT_MAX or falls outside claim_denial_window_hours"
  - id: ERR_RESTORE_WINDOW_CLOSED
    http: 409
    condition: "a no-show restoration arrives more than STRIKE_RESTORE_WINDOW_HOURS after the session completed"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "an OCC-guarded write carries an expected_*_version that no longer matches the parent's current version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================

roles:

  - name: OperatorOnly
    description: "The benchmark harness itself. Owns only the logical clock and the test-driving injectors."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_inject/client-entitlement"
    shared_operations: []

  - name: PlatformAdmin
    description: "Wellness marketplace operator. Configures tiers and benefit networks, adjudicates portability disputes and issues exports, and can override any studio-scoped operation."
    identity: "opaque"
    exclusive_operations:
      - "POST /wellness/benefit-networks"
      - "POST /wellness/portability-requests/{id}/adjudicate"
      - "POST /wellness/portability-requests/{id}/issue-export"
      - "POST /wellness/subscriptions/{id}/change-tier"
      - "GET /wellness/benefit-network-claims"
    shared_operations:
      - "GET /wellness/studios/{id}"
      - "GET /wellness/subscriptions"
      - "POST /wellness/subscriptions/{id}/suspend"
      - "POST /wellness/subscriptions/{id}/resume"
      - "POST /wellness/subscriptions/{id}/cancel"
      - "GET /wellness/class-sessions"
      - "GET /wellness/bookings"
      - "GET /wellness/commission-entries"
      - "GET /wellness/payroll-periods"

  - name: StudioOwner
    description: "The wellness business's own operator account. Owns scheduling, staff, memberships, packs, payroll and the studio side of the marketplace and portability workflows."
    identity: "entity_backed:Studio"
    exclusive_operations:
      - "POST /wellness/class-sessions"
      - "PUT /wellness/class-sessions/{id}"
      - "POST /wellness/class-sessions/{id}/cancel"
      - "POST /wellness/class-sessions/{id}/reassign-instructor"
      - "POST /wellness/staff-members"
      - "POST /wellness/staff-members/{id}/restrict-to-substitute"
      - "POST /wellness/staff-members/{id}/reinstate"
      - "POST /wellness/staff-members/{id}/deactivate"
      - "POST /wellness/class-templates"
      - "POST /wellness/class-packs"
      - "POST /wellness/class-packs/{id}/extend"
      - "POST /wellness/class-packs/{id}/sweep-expiry"
