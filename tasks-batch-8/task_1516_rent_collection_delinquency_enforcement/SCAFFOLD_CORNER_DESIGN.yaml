          setup:
            - "Property PF (FEES_FIRST, min_partial_payment_percent 1), ACTIVE lease with RENT 200000 due 2026-08-01, DAMAGE_FEE 3000 due 2026-08-01, DAMAGE_FEE 4000 due 2026-08-02; PENDING payment 4000"
