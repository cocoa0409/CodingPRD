              payload: { league_id: "${lg_id}", pair_number: 1, certified_through: "2026-12-31T00:00:00Z" }
              as: AssociationOfficer
              captures: { lp1_id: "$.data.id" }
            - call: "POST /leagues/${lg_id}/schedule"
              payload: { total_weeks: 2, matches: [ { week_number: 1, home_team_id: "${t1_id}", away_team_id: "${t2_id}", lane_pair_id: "${lp1_id}", starts_at: "2026-08-12T01:00:00Z", ends_at: "2026-08-12T03:00:00Z" }, { week_number: 2, home_team_id: "${t2_id}", away_team_id: "${t1_id}", lane_pair_id: "${lp1_id}", starts_at: "2026-08-19T01:00:00Z", ends_at: "2026-08-19T03:00:00Z" } ] }
              as: LeagueSecretary
              as_user_id: "${sec_id}"
              captures: { mt1_id: "$.data[0].id" }
            - call: "POST /fee-remittances"
              payload: { league_id: "${lg_id}", membership_ids: ["${ms1_id}", "${ms2_id}", "${ms3_id}", "${ms4_id}"], declared_amount_cents: 12400 }
              as: LeagueTreasurer
              as_user_id: "${tre_id}"
              captures: { fr1_id: "$.data.id" }
            - call: "POST /fee-remittances/${fr1_id}/submit"
              payload: {}
              as: LeagueTreasurer
              as_user_id: "${tre_id}"
            - call: "POST /fee-remittances/${fr1_id}/national-decision"
              payload: { decision: "ACCEPT", national_receipt_no: "NR-2913-0001" }
              as: AssociationOfficer
            - call: "GET /matches?league_id=${lg_id}&week_number=1"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
              captures: { mt1_v1: "$.data[0].version" }
            - call: "POST /matches/${mt1_id}/lineups"
              payload: { expected_match_version: "${mt1_v1}", team_id: "${t1_id}", slots: [ { position: 1, entry_type: "REGULAR", membership_id: "${ms1_id}" }, { position: 2, entry_type: "REGULAR", membership_id: "${ms2_id}" } ] }
              as: TeamCaptain
              as_user_id: "${m1_id}"
              captures: { mt1_v2: "$.data.version" }
            - call: "POST /matches/${mt1_id}/lineups"
              payload: { expected_match_version: "${mt1_v2}", team_id: "${t2_id}", slots: [ { position: 1, entry_type: "REGULAR", membership_id: "${ms3_id}" }, { position: 2, entry_type: "REGULAR", membership_id: "${ms4_id}" } ] }
              as: TeamCaptain
              as_user_id: "${m3_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T01:00:00Z" }
              as: AssociationOfficer
            - call: "POST /matches/${mt1_id}/open"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
            - call: "GET /series-entries?match_id=${mt1_id}&team_id=${t1_id}"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
              captures: { se1_id: "$.data[0].id", se2_id: "$.data[1].id" }
            - call: "GET /series-entries?match_id=${mt1_id}&team_id=${t2_id}"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
              captures: { se3_id: "$.data[0].id", se4_id: "$.data[1].id" }
            - call: "POST /matches/${mt1_id}/scores"
              payload: { entries: [ { series_entry_id: "${se1_id}", game1_pins: 170, game2_pins: 180, game3_pins: 190 }, { series_entry_id: "${se2_id}", game1_pins: 230, game2_pins: 240, game3_pins: 250 }, { series_entry_id: "${se3_id}", game1_pins: 150, game2_pins: 160, game3_pins: 170 }, { series_entry_id: "${se4_id}", game1_pins: 140, game2_pins: 150, game3_pins: 160 } ] }
              as: LeagueSecretary
              as_user_id: "${sec_id}"
            - call: "GET /matches?league_id=${lg_id}&week_number=2"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
              captures: { mt2_id: "$.data[0].id", mt2_v1: "$.data[0].version" }
            - call: "GET /prize-funds?league_id=${lg_id}"
              payload: {}
              as: LeagueTreasurer
              as_user_id: "${tre_id}"
              captures: { pf_id: "$.data[0].id" }
          trigger:
            - call: "POST /matches/${mt1_id}/certify"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
            - call: "GET /memberships/${ms1_id}"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
            - call: "GET /memberships/${ms2_id}"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
            - call: "GET /teams/${t1_id}"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
            - call: "GET /leagues/${lg_id}"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
            - call: "POST /memberships/${ms1_id}/dues-payments"
              payload: { week_number: 1, amount_cents: 1200 }
              as: LeagueTreasurer
              as_user_id: "${tre_id}"
            - call: "GET /prize-funds/${pf_id}"
              payload: {}
              as: LeagueTreasurer
              as_user_id: "${tre_id}"
            - call: "POST /matches/${mt2_id}/lineups"
              payload: { expected_match_version: "${mt2_v1}", team_id: "${t1_id}", slots: [ { position: 1, entry_type: "REGULAR", membership_id: "${ms1_id}" }, { position: 2, entry_type: "REGULAR", membership_id: "${ms2_id}" } ] }
              as: TeamCaptain
              as_user_id: "${m1_id}"
            - call: "GET /series-entries?match_id=${mt2_id}&team_id=${t1_id}"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
          assert:
            - "the certify response body itself carries data.status == 'CERTIFIED', home_points == 4.0, away_points == 0.0 and certified_at == '2026-08-12T01:00:00Z' - the caller never has to re-read the match to learn the outcome"
            - "the very next request, GET /memberships/${ms1_id}, reads certified_games == 3, certified_pins == 540, current_average == 180, average_status == 'ESTABLISHED' and handicap_per_game == 36 - the average is stored, not computed on read, and it is already final one request after certification"
            - "GET /memberships/${ms2_id} reads certified_pins == 720, current_average == 199 and handicap_per_game == 18 - down from the entering-average handicap 22 in the same single hop"
            - "GET /teams/${t1_id} reads total_points == 4.0, total_scratch_pins == 1260 and team_handicap_per_game == 54 == 36 + 18, and GET /leagues/${lg_id} reads certified_week_high_water == 1 and status 'IN_SEASON' - three aggregate levels, zero lag"
            - "the dues response body itself carries prize_share_cents == 700 and expense_share_cents == 500, and the following GET /prize-funds/${pf_id} reads collected_prize_cents == 700 with undistributed_balance_cents == 700 - the fund is not reconciled by a later sweep"
            - "the week-2 lineup returns 200 with away_team_handicap_per_game == 54 == 36 + 18 - it froze handicaps that came into existence only in the certify call a few requests earlier, so a deferred average would show the stale 58"
            - "GET /series-entries?match_id=${mt2_id}&team_id=${t1_id} returns handicap_per_game_applied 36 and 18 on positions 1 and 2, while the week-1 slots ${se1_id} and ${se2_id} still read their own frozen 36 and 22 - immediate visibility never rewrites what an earlier request already froze"

      # --- corners already exercised by §1.8 -----------------------------------
      - name: corner_no_denormalised_counter_lags_its_source_row
        claim_type: immediate
        grounds:
          - entities.League.fields.sanctioned_member_count
          - entities.Team.fields.sanctioned_roster_count
        excluded_because:
          difficulty_instance: transitive_cascade / remittance_acceptance_cascades_membership_team_league_match
          rationale: "That §1.8 instance asserts every denormalised counter of the sanctioning cascade in the requests immediately following the one national decision that set them."
