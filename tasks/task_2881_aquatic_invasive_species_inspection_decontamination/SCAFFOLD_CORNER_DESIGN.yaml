          - endpoints.POST_/_clock/set_current_utc
          - errors.ERR_INSPECTOR_NOT_ACTIVE
        distinguishing_aspect: "Certification expiry is evaluated lazily against the logical clock, so the identical treatment call by the identical technician is legal at 2027-07-31T23:59:59Z and refused one second later at certification_expires_at - and the clock call that crosses the boundary mutates nothing by itself, it only returns current_utc."
        test_recipe:
          setup:
            - "Station hot_water_capable with 2 decon bays; insp_b is DECON_CERTIFIED from a single 40-hour passed module recorded at 2026-08-01T00:00:00Z, so certification_expires_at == 2027-08-01T00:00:00Z (CERT_VALID_HOURS 8760)."
            - "Two vessels each screened with residual water 500 ml off a HIGH CLEAN prior water body: risk_score 40 + 0 + (20 + min(15, floor(500/100)=5)) == 65, HIGH band, decon_mandatory true."
            - "Both records dispositioned DECON and given their own decon order in ORDERED."
