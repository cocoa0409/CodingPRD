      - name: corner_payment_on_paid_invoice_returns_not_payable_not_already_terminal
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=55]
          - errors[ERR_INVOICE_NOT_PAYABLE]
        distinguishing_aspect: "The payment and true-up endpoints are the declared carve-out from the terminal-state rule at priority 8, so a second payment against a fully PAID invoice returns HTTP 409 ERR_INVOICE_NOT_PAYABLE rather than ERR_ALREADY_TERMINAL."
        test_recipe:
          setup:
            - "one RECREATIONAL member and one invoice assessed at 74000 already settled by a single 74000-cent payment, so status is the terminal PAID"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Rita Rower", tier: "RECREATIONAL", body_weight_kg: 70.0 }
              as: ClubAdmin
              captures: { rita_id: $.data.id }
            - call: "POST /boathouse/dues-invoices"
              payload: { member_id: "${rita_id}", season_year: 2026, billable_months: 12, due_at: "2026-09-01T00:00:00Z" }
              as: ClubAdmin
              captures: { invoice_id: $.data.id }
            - call: "POST /boathouse/dues-invoices/${invoice_id}/payments"
              payload: { amount_cents: 74000 }
              as: ClubAdmin
          trigger:
            - call: "POST /boathouse/dues-invoices/${invoice_id}/payments"
              payload: { amount_cents: 1 }
              as: ClubAdmin
          assert:
            - "DuesInvoice.${invoice_id}.status == PAID with paid_cents == 74000 after the setup payment"
            - "the trigger call returns HTTP 409 with data.error_id == ERR_INVOICE_NOT_PAYABLE, not ERR_ALREADY_TERMINAL"
            - "DuesInvoice.${invoice_id}.paid_cents == 74000, unchanged"
            - "Member.${rita_id}.dues_balance_cents == 0 and boathouse_access_level == FULL"

