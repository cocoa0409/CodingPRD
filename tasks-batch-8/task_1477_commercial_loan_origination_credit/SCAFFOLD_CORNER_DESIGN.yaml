      - name: committee_session_adjourns_on_clock_sweep
        claim_type: valid_transition
        grounds: [state_machines.CommitteeSession.SCHEDULED_to_ADJOURNED]
        distinguishing_aspect: "The logical clock adjourns a SCHEDULED session exactly when now reaches ends_at (half-open semantics: the window is closed AT ends_at)."
        test_recipe:
          setup: ["Chair officer; one STANDARD session 2026-08-10T14:00-15:00Z; clock at default"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Cheryl Chair" }, as: BankAdmin, captures: { ch: $.data.id } }
            - { call: "POST /credit/committee-sessions", payload: { level: STANDARD, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T15:00:00Z" }, as: CommitteeChair, as_user_id: "${ch}", captures: { sess: $.data.id } }
          trigger:
            - { call: "POST /credit/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:00:00Z" }, as: BankAdmin }
          assert:
            - "CommitteeSession.${sess}.status == ADJOURNED (ends_at 15:00 <= clock 15:00: the half-open window excludes its own endpoint)"

      - name: waive_breach_requires_breach_pending
        claim_type: invalid_transition
