      - name: reconditioning_reimbursement_total_clamped_by_cap
        claim_type: aggregation
        grounds:
          - calculations.reconditioning_reimbursement
          - entities.ProgramConfig.fields.recon_reimbursement_cap_cents
          - entities.Inspection.fields.total_reimbursable_cents
        distinguishing_aspect: |
          Three completed repairs each reimburse 60000 (their own per-item ChecklistItem caps are
          200000, 100000 and 200000, so none of them binds), summing to 180000, which the
          per-inspection cap 150000 then clamps. The clamp lives on the SUM, not on the per-item
          amounts: an implementation that applies recon_reimbursement_cap_cents per row leaves
          180000 standing, and one that forgets the cap entirely does the same.
        test_recipe:
          setup:
            - "Template MPI-172 carries a fourth point T1 (TIRES, MAJOR, reconditioning_allowed, cap 200000), so point_count == 4."
