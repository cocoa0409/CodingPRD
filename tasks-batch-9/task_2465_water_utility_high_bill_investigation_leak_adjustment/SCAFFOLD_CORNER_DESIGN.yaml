      - name: corner_state_terminal_state_lockdown_locked_period_refuses_both_declared_triggers
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BillingPeriod
          - validations[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          LOCKED is BillingPeriod's only terminal state and nothing leaves it: both declared
          triggers, close and lock, return 409 from LOCKED, while reads keep working. An
          implementation that treats lock as idempotent, or that allows a re-open, fails.
        test_recipe:
          setup:
            - "One BillingPeriod 2025-06 has been closed and then locked, so its status is LOCKED at version 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /billing-periods/${p1_id}/close"
              as: SystemAdmin
            - call: "POST /billing-periods/${p1_id}/lock"
              as: SystemAdmin
          trigger:
            - call: "POST /billing-periods/${p1_id}/close"
              as: SystemAdmin
            - call: "POST /billing-periods/${p1_id}/lock"
              as: SystemAdmin
            - call: "GET /billing-periods/${p1_id}"
              as: SystemAdmin
          assert:
            - "CLOSE FROM LOCKED: HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "LOCK FROM LOCKED: HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "BillingPeriod.${p1_id}.status == LOCKED and version == 3 — neither refusal bumped the version"
            - "The read still returns 200 with the full row — terminal lockdown blocks writes, not reads"

