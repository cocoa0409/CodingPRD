              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_drc}", linehaul_revenue_cents: 180000, practical_miles: 1200, hhg_miles: 250, stop_count: 1 }
              as: SettlementClerk
              captures: { load_drc: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_drc}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T18:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_drc}/deliver"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: PayrollAdmin
