          trigger:
            - { call: "POST /api/auction-sales/${sale_a}/close", payload: {}, as: Auctioneer }
            - { call: "POST /api/auction-sales/${sale_b}/close", payload: {}, as: Auctioneer }
            - { call: "GET /api/disbursements?foreclosure_case_id=${ca_id}&recipient_type=TRUSTEE_FEE", as: CaseManager, captures: { fee_a: "$.data[0].amount_cents" } }
