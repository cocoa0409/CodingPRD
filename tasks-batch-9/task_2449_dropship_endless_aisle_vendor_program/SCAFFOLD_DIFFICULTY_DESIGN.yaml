- rule_id: combinatorial_formula
  instances:
  - name: per_unit_rounding_before_multiplication_pins_line_cost
    grounds:
    - calculations.line_cost_and_order_margin
    - entities.DropshipItem.fields.unit_cost_cents
    - entities.DropshipOrderLine.fields.unit_cost_cents
    - entities.DropshipOrder.fields.total_cost_cents
    - entities.DropshipOrder.fields.margin_cents
    - state_machines.DropshipOrderLine.PENDING_TRANSMIT_to_TRANSMITTED
    distinguishing_aspect: 'Mode (b) - order of operations. The scaffold rounds to whole cents exactly once at the
      UNIT stage and only then multiplies by quantity: round_half_up(1999 * 8500 / 10000) = 1699, times 4 = 6796.
      Rounding the extended amount instead gives round_half_up(6796.60) = 6797, so the two orderings differ by 1
      cent and the assertion 6796 falsifies the wrong ordering.'
    test_recipe:
      setup:
      - Vendor V1 is ACTIVE with cost_model COMMISSION at 1500 bps.
      - Offer I3 (sku SKU-LAMP-9) has unit_retail_cents 1999 and no wholesale cost, since V1 is a commission vendor.
      - I3 is ACTIVE with a fresh feed of 20 on-hand, so available_units is 15 after the safety buffer of 5.
      - The matched coverage row US-WEST / GROUND has surcharge_cents 0, so the surcharge cannot mask the rounding
        difference.
      - The clock is at 2026-08-03T10:00:00Z.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /dropship/vendors
        payload:
          vendor_code: V1
          legal_name: Northwind Dropship LLC
          cost_model: COMMISSION
          commission_rate_bps: 1500
          inventory_refresh_cadence_minutes: 60
          safety_buffer_units: 5
          oversell_grace_units: 0
          default_lead_time_days: 3
          ack_sla_hours: 24
          ship_sla_grace_hours: 12
        as: PlatformAdmin
        captures:
          v1_id: $.data.id
      - call: POST /dropship/vendors/${v1_id}/begin-integration
        payload: {}
        as: VendorOpsAnalyst
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: CATALOG
          sample_payload_digest: sha256-V1-catalog
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_catalog: $.data.id
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: INVENTORY
          sample_payload_digest: sha256-V1-inventory
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_inventory: $.data.id
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: ORDER
          sample_payload_digest: sha256-V1-order
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_order: $.data.id
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: SHIP_CONFIRM
          sample_payload_digest: sha256-V1-ship_confirm
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_ship_confirm: $.data.id
      - call: POST /dropship/integration-tests/${v1_t_catalog}/evaluate
        payload:
          outcome: PASS
          reported_error_count: 0
        as: VendorOpsAnalyst
        as_user_id: ops-evaluator-V1
      - call: POST /dropship/integration-tests/${v1_t_inventory}/evaluate
        payload:
          outcome: PASS
          reported_error_count: 0
        as: VendorOpsAnalyst
        as_user_id: ops-evaluator-V1
      - call: POST /dropship/integration-tests/${v1_t_order}/evaluate
        payload:
          outcome: PASS
          reported_error_count: 0
        as: VendorOpsAnalyst
        as_user_id: ops-evaluator-V1
      - call: POST /dropship/integration-tests/${v1_t_ship_confirm}/evaluate
        payload:
