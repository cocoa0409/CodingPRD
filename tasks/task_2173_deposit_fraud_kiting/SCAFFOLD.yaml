scenario: "desgin task harder than expert level.!!!!2173. Deposit Account Fraud & Kiting Detection (bank deposit fraud unit): new-account risk scoring & funding source verification, kiting pattern detection across linked accounts, check-hold override review & loss exposure, account takeover indicators & step-up verification, mule-account detection & closure procedure, loss charge-off & recovery referral, law-enforcement subpoena response, suspicious activity referral to BSA"
domain_name: deposit-fraud-kiting
api_prefix: /deposit-fraud

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Eleven peer entities joined by explicit foreign keys. No entity is nested
  # inside another in the URL space: every resource is addressed at
  # /deposit-fraud/<collection>/{id}, and parent->child discovery happens through
  # dedicated sub-resource GETs. The deposit-item graph (account -> drawee
  # account) is a directed multigraph over DepositAccount and is what the kiting
  # detector traverses.

  state_machine_shape: parallel
  # DepositAccount carries two independent state dimensions that advance on
  # different triggers: lifecycle_status (PENDING_FUNDING -> ACTIVE -> RESTRICTED
  # -> CLOSED -> CHARGED_OFF, with RESTRICTED -> ACTIVE reinstatement and
  # CHARGED_OFF -> CLOSED reversal) and access_posture (NORMAL ->
  # STEP_UP_REQUIRED -> NORMAL | LOCKED). Four further machines are cyclic or
  # branching: FundingSource (MICRO_DEPOSIT_SENT <-> FAILED_ATTEMPT),
  # HoldOverrideReview (SUBMITTED <-> RETURNED_FOR_INFO), FraudCase
  # (INVESTIGATING <-> UNSUBSTANTIATED), BsaReferral (SUBMITTED -> RETURNED ->
  # DRAFT).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # Two duty-separation rules bite inside a single role rather than between
  # roles: the FraudSupervisor who prepared a HoldOverrideReview may not decide
  # it, and the LegalCounsel who performed a subpoena legal-review may not sign
  # the response.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Full legal name of the depositor."
        constraints: "1..120 characters, non-blank"
      - name: tin_last4
        type: string
        source: input
        description: "Last four digits of the taxpayer identification number."
        constraints: "exactly 4 ASCII digits"
      - name: kyc_tier
        type: enum
        source: input
        description: "Know-your-customer diligence tier reached at onboarding."
        default: TIER_2
        constraints: "one of {TIER_1, TIER_2, TIER_3}; TIER_1 is the most fully documented, TIER_3 the least"
      - name: watchlist_hit
        type: boolean
        source: input
        description: "True when onboarding screening returned a sanctions or negative-news hit."
        default: false
      - name: preservation_hold_active
        type: boolean
        source: computed
        description: "True iff at least one SubpoenaRequest with this customer_id has status IN {RECEIVED, UNDER_LEGAL_REVIEW, PRODUCED} AND logical_now < that subpoena's preservation_end_at. Recomputed on every read of this Customer and on every SubpoenaRequest mutation."
      - name: open_fraud_case_count
        type: integer
        source: computed
        description: "Count of FraudCase rows whose primary_account_id belongs to a DepositAccount with this customer_id and whose status IN {OPENED, INVESTIGATING}."

  - name: DepositAccount
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the depositor who owns this account."
      - name: product_type
        type: enum
        source: input
        description: "Deposit product opened."
        constraints: "one of {CHECKING, SAVINGS, MONEY_MARKET}"
      - name: open_channel
        type: enum
        source: input
        description: "Origination channel; feeds the new-account risk score."
        constraints: "one of {BRANCH, ONLINE, MOBILE}"
      - name: opened_at
        type: datetime
        source: system
        description: "Logical clock value at account creation. Used as the age baseline for the new-account check-hold exception."
      - name: lifecycle_status
        type: enum
        source: system
        description: "First of two independent state dimensions on this row: the deposit-relationship lifecycle."
        default: PENDING_FUNDING
        constraints: "one of {PENDING_FUNDING, ACTIVE, RESTRICTED, CLOSED, CHARGED_OFF}"
      - name: access_posture
        type: enum
        source: system
        description: "Second independent state dimension on this row: the account-takeover access posture. Advances on access-review and step-up-response only; never changed by lifecycle transitions."
        default: NORMAL
        constraints: "one of {NORMAL, STEP_UP_REQUIRED, LOCKED}"
      - name: risk_score
        type: integer
        source: computed
        description: "New-account risk score, 0..100, produced by calculation new_account_risk_score."
      - name: risk_score_basis
        type: enum
        source: system
        description: "Which variant of new_account_risk_score produced the current risk_score."
        default: PROVISIONAL_AT_OPEN
        constraints: "one of {PROVISIONAL_AT_OPEN, REFRESHED}"
      - name: risk_band
        type: enum
        source: computed
        description: "HIGH when risk_score >= 60, ELEVATED when 35 <= risk_score < 60, else STANDARD."
        constraints: "one of {STANDARD, ELEVATED, HIGH}"
      - name: ato_indicator_codes
        type: array
        source: system
        description: "Distinct account-takeover indicator codes accumulated across all access-review calls, stored sorted ascending by code string. Duplicate submissions do not add a second entry."
        default: []
        constraints: "each element one of {NEW_DEVICE, GEO_VELOCITY, CREDENTIAL_STUFFING, PROFILE_CHANGE, DORMANT_REACTIVATION, PAYEE_ADDED}"
      - name: ato_score
        type: integer
        source: computed
        description: "Account-takeover score, 0..100, produced by calculation ato_indicator_score over ato_indicator_codes."
        default: 0
      - name: step_up_failure_count
        type: integer
        source: system
        description: "Number of failed step-up challenge responses since the posture last returned to NORMAL."
        default: 0
      - name: ledger_balance_cents
        type: integer
        source: system
        description: "Posted ledger balance in cents. May be negative after a returned item whose hold had already been overridden."
        default: 0
      - name: available_balance_cents
        type: integer
        source: system
        description: "Balance the depositor may withdraw, in cents. Invariant: available_balance_cents + held_amount_cents == ledger_balance_cents at all times."
        default: 0
      - name: held_amount_cents
        type: integer
        source: computed
        description: "Sum of CheckHold.held_amount_cents over every CheckHold with status == ACTIVE whose DepositItem.account_id equals this account id."
        default: 0
      - name: charged_off_amount_cents
        type: integer
        source: system
        description: "Loss currently carried off the deposit ledger for this account. Set to ChargeOff.net_charge_off_cents when a charge-off is booked, reduced by recovery postings, reset to 0 on reversal."
        default: 0
      - name: closure_scheduled_at
        type: datetime
        source: system
        description: "Logical clock instant at which the mule-closure procedure will close this account; set when a substantiated MULE FraudCase disposition cascades onto this account, null otherwise."
        default: null
      - name: closure_reason
        type: enum
        source: system
        description: "Why the account reached CLOSED."
        default: null
        constraints: "null or one of {MULE_SUBSTANTIATED, KITING_SUBSTANTIATED}; both values are written only by the fraud-case close cascade"

  - name: FundingSource
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> DepositAccount.id; the account this external source funds."
      - name: source_type
        type: enum
        source: input
        description: "Kind of external funding instrument."
        constraints: "one of {EXTERNAL_ACH, WIRE, CARD_PUSH}"
      - name: routing_last4
        type: string
        source: input
        description: "Last four digits of the external routing number."
        constraints: "exactly 4 ASCII digits"
      - name: micro_deposit_cents
        type: integer
        source: system
        description: "Server-minted trial-deposit amount the depositor must echo back to verify ownership. Returned in the creation response and in reads so a client can complete verification; it is a credential, never a business-decision input."
        constraints: "integer in 1..99"
      - name: verification_status
        type: enum
        source: system
        description: "Verification state machine position for this funding source."
        default: DECLARED
        constraints: "one of {DECLARED, MICRO_DEPOSIT_SENT, FAILED_ATTEMPT, VERIFIED, BLOCKED}"
      - name: attempt_count
        type: integer
        source: system
        description: "Number of verification attempts submitted against the current micro_deposit_cents value. Resets to 0 on resend."
        default: 0
      - name: total_attempt_count
        type: integer
        source: system
        description: "Lifetime count of verification attempts across all resends; the source is BLOCKED once this reaches FUNDING_MAX_TOTAL_ATTEMPTS."
        default: 0
      - name: verified_at
        type: datetime
        source: system
        description: "Logical clock instant at which verification_status became VERIFIED; null otherwise."
        default: null

  - name: AccountLink
    parent: null
    common_fields: true
    fields:
      - name: from_account_id
        type: string
        source: input
        description: "FK -> DepositAccount.id; tail of the directed association edge."
      - name: to_account_id
        type: string
        source: input
        description: "FK -> DepositAccount.id; head of the directed association edge."
      - name: link_type
        type: enum
        source: input
        description: "Nature of the association between the two accounts."
        constraints: "one of {SHARED_DEVICE, SHARED_ADDRESS, SHARED_PHONE, TRANSFER_COUNTERPARTY}"
      - name: confidence_bps
        type: integer
        source: input
        description: "Detection confidence in basis points."
        constraints: "integer in 0..10000"
      - name: is_risk_bearing
        type: boolean
        source: computed
        description: "True iff link_type IN {SHARED_DEVICE, SHARED_ADDRESS, SHARED_PHONE} AND confidence_bps >= 6000. Only risk-bearing links contribute link points to new_account_risk_score."

  - name: DepositItem
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> DepositAccount.id; account receiving the deposit."
      - name: drawee_account_id
        type: string
        source: input
        description: "FK -> DepositAccount.id; on-us account the item is drawn on. Null for off-us items. A non-null value creates a directed circulation edge drawee -> account that the kiting detector traverses."
        default: null
      - name: item_type
        type: enum
        source: input
        description: "Deposit instrument."
        constraints: "one of {CHECK, ACH, CASH}"
      - name: amount_cents
        type: integer
        source: input
        description: "Face amount of the deposited item in cents."
        constraints: "integer >= 1"
      - name: deposit_at
        type: datetime
        source: system
        description: "Logical clock instant at which the item was taken; the kiting window filter is evaluated against this field."
      - name: status
        type: enum
        source: system
        description: "Collection state of the item."
        default: PENDING
        constraints: "one of {PENDING, CLEARED, RETURNED}"
      - name: settled_at
        type: datetime
        source: system
        description: "Logical clock instant at which the item reached CLEARED or RETURNED; null while PENDING."
        default: null
      - name: return_reason
        type: enum
        source: system
        description: "Why the item came back unpaid; null unless status == RETURNED."
        default: null
        constraints: "null or one of {NSF, ACCOUNT_CLOSED, UNCOLLECTED_FUNDS, STOP_PAYMENT}"
      - name: immediate_credit_cents
        type: integer
        source: computed
        description: "Portion of amount_cents made available at deposit time, per calculation check_hold_schedule."
      - name: held_cents
        type: integer
        source: computed
        description: "Portion of amount_cents withheld at deposit time; equals amount_cents - immediate_credit_cents."

  - name: CheckHold
    parent: null
    common_fields: true
    fields:
      - name: deposit_item_id
        type: string
        source: input
        description: "FK -> DepositItem.id; the item whose funds this hold withholds."
      - name: hold_type
        type: enum
        source: system
        description: "Availability exception class selected by calculation check_hold_schedule, or EXCEPTION_FRAUD when a substantiated case extends the hold."
        constraints: "one of {STANDARD, EXCEPTION_NEW_ACCOUNT, EXCEPTION_LARGE_DEPOSIT, EXCEPTION_RISK, EXCEPTION_FRAUD}"
      - name: held_amount_cents
        type: integer
        source: system
        description: "Cents currently withheld by this hold. Set to the parent DepositItem.held_cents at placement, and reduced only by an executed early-release override; when it reaches 0 the hold leaves ACTIVE for OVERRIDDEN."
      - name: hold_start_at
        type: datetime
        source: system
        description: "Logical clock instant the hold took effect; equals DepositItem.deposit_at."
      - name: hold_release_at
        type: datetime
        source: system
        description: "Logical clock instant at which the hold matures on its own schedule. Maturity does not auto-transition the hold; it only closes the window in which an early-release override may be requested."
      - name: status
        type: enum
        source: system
        description: "Hold lifecycle position."
        default: ACTIVE
        constraints: "one of {ACTIVE, RELEASED, OVERRIDDEN, CHARGED_BACK}"
      - name: released_at
        type: datetime
        source: system
        description: "Logical clock instant the hold left ACTIVE; null while ACTIVE."
        default: null

  - name: HoldOverrideReview
    parent: null
    common_fields: true
    fields:
      - name: check_hold_id
        type: string
        source: input
        description: "FK -> CheckHold.id; the hold whose early release is under review."
      - name: requested_release_cents
        type: integer
        source: input
        description: "Cents the requester wants released ahead of hold_release_at."
        constraints: "integer >= 1"
      - name: release_effective_at
        type: datetime
        source: input
        description: "Start of the half-open early-release window [release_effective_at, release_window_end_at) claimed on the account."
      - name: release_window_end_at
        type: datetime
        source: input
        description: "Exclusive end of the early-release window; must be strictly after release_effective_at."
      - name: justification
        type: string
        source: input
        description: "Free-text rationale recorded for audit."
        constraints: "1..500 characters, non-blank"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who created this review."
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the supervisor who recorded the decision; null before a decision."
        default: null
      - name: status
        type: enum
        source: system
        description: "Review lifecycle position."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, RETURNED_FOR_INFO, APPROVED, DENIED, EXECUTED, SUPERSEDED}"
      - name: loss_exposure_cents
        type: integer
        source: computed
        description: "Per-line-rounded then summed return-risk exposure across every ACTIVE hold on the same account, per calculation hold_override_loss_exposure step 2."
      - name: adjusted_exposure_cents
        type: integer
        source: computed
        description: "loss_exposure_cents scaled by the account's risk-band multiplier and rounded a second time, per calculation hold_override_loss_exposure step 3. This is the figure compared against SUPERVISOR_APPROVAL_LIMIT_CENTS."
      - name: decision_note
        type: string
        source: system
        description: "Note supplied with the decision; null before a decision."
        default: null
      - name: revision_count
        type: integer
        source: system
        description: "Number of times this review has been returned for information and resubmitted."
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical clock instant of the most recent submit; null while DRAFT."
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical clock instant of the decision; null before a decision."
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: "Logical clock instant the approved release was executed; null otherwise."
        default: null

  - name: FraudCase
    parent: null
    common_fields: true
    fields:
      - name: primary_account_id
        type: string
        source: input
        description: "FK -> DepositAccount.id; account the case is opened against."
      - name: case_type
        type: enum
        source: input
        description: "Investigation track. KITING and MULE carry different substantiation side-effect sets."
        constraints: "one of {KITING, MULE}"
      - name: status
        type: enum
        source: system
        description: "Investigation lifecycle position."
        default: OPENED
        constraints: "one of {OPENED, INVESTIGATING, SUBSTANTIATED, UNSUBSTANTIATED, CLOSED}"
      - name: detection_source
        type: enum
        source: system
        description: "KITING_SCAN when the case was cascaded open by a kiting scan, ANALYST_MANUAL when created directly."
        constraints: "one of {KITING_SCAN, ANALYST_MANUAL}"
      - name: kiting_score
        type: integer
        source: system
        description: "Score copied from the kiting scan that opened this case; null for manually opened cases."
        default: null
      - name: scan_mode
        type: enum
        source: system
        description: "Qualifying-status variant used by the scan that opened this case; null for manually opened cases."
        default: null
        constraints: "null or one of {STRICT, INCLUSIVE}"
      - name: cycle_account_ids
        type: array
        source: system
        description: "Ordered DepositAccount ids of the circulation cycle the scan selected, starting at the scanned account; empty for manually opened cases."
        default: []
      - name: exposure_at_risk_cents
        type: integer
        source: computed
        description: "Sum of DepositAccount.held_amount_cents over the primary account plus every account named in cycle_account_ids, deduplicated. Recomputed whenever any of those accounts' held_amount_cents changes."
        default: 0
      - name: disposition_note
        type: string
        source: system
        description: "Note recorded with the substantiation decision; null before disposition."
        default: null
      - name: reopen_count
        type: integer
        source: system
        description: "Number of times the case has gone UNSUBSTANTIATED and been returned to INVESTIGATING."
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: "Logical clock instant the case reached CLOSED; null otherwise."
        default: null

  - name: ChargeOff
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> DepositAccount.id; account whose deposit loss is being written off."
      - name: gross_loss_cents
        type: integer
        source: input
        description: "Gross uncollected loss proposed for write-off, in cents."
        constraints: "integer >= 1"
      - name: collateral_offset_cents
        type: integer
        source: input
        description: "Cents recovered from pledged collateral or a sibling account before the write-off is priced."
        default: 0
        constraints: "integer >= 0"
      - name: base_net_cents
        type: integer
        source: computed
        description: "gross_loss_cents - collateral_offset_cents; the amount the recovery-fee tier is selected from."
      - name: recovery_fee_cents
        type: integer
        source: computed
        description: "Recovery-agency fee, priced off base_net_cents at the tier rate."
      - name: net_charge_off_cents
        type: integer
        source: computed
        description: "base_net_cents + recovery_fee_cents; the amount actually written off and referred."
      - name: principal_recovered_cents
        type: integer
        source: system
        description: "Cents of base_net_cents recovered so far via recovery postings."
        default: 0
      - name: fee_recovered_cents
        type: integer
        source: system
        description: "Cents of recovery_fee_cents recovered so far via recovery postings."
        default: 0
      - name: outstanding_loss_cents
        type: integer
        source: computed
        description: "net_charge_off_cents - principal_recovered_cents - fee_recovered_cents. Invariant: never negative."
      - name: status
        type: enum
        source: system
        description: "Charge-off lifecycle position."
        default: PROPOSED
        constraints: "one of {PROPOSED, APPROVED, BOOKED, REFERRED_TO_RECOVERY, RECOVERED_PARTIAL, RECOVERED_FULL, REVERSED, SUPERSEDED}"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the supervisor who approved the proposal; null before approval."
        default: null
      - name: booked_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operations administrator who booked the write-off; null before booking."
        default: null
      - name: ledger_balance_before_book_cents
        type: integer
        source: system
        description: "Snapshot of DepositAccount.ledger_balance_cents taken immediately before the booking adjustment, so a reversal can restore it exactly."
        default: null
      - name: booked_at
        type: datetime
        source: system
        description: "Logical clock instant of booking; null before booking."
        default: null
      - name: reversed_at
        type: datetime
        source: system
        description: "Logical clock instant of reversal; null unless status == REVERSED."
        default: null

  - name: SubpoenaRequest
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the customer whose records are demanded."
      - name: issuing_agency
        type: string
        source: input
        description: "Law-enforcement agency named on the process."
        constraints: "1..120 characters, non-blank"
      - name: docket_number
        type: string
        source: input
        description: "Court docket or agency file number."
        constraints: "1..64 characters, non-blank"
      - name: received_at
        type: datetime
        source: system
        description: "Logical clock instant the process was logged."
      - name: response_due_at
        type: datetime
        source: input
        description: "Deadline stated on the process; must be strictly after the logical clock at creation."
      - name: preservation_start_at
        type: datetime
        source: input
        description: "Inclusive start of the closed record-preservation window [preservation_start_at, preservation_end_at] claimed on the customer."
      - name: preservation_end_at
        type: datetime
        source: input
        description: "Inclusive end of the preservation window; must be strictly after preservation_start_at."
      - name: status
        type: enum
        source: system
        description: "Subpoena handling position."
        default: RECEIVED
        constraints: "one of {RECEIVED, UNDER_LEGAL_REVIEW, PRODUCED, OBJECTED, QUASHED}"
      - name: legal_reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the counsel who performed the legal review; null before review."
        default: null
      - name: responded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the counsel who signed the response; null before response."
        default: null
      - name: is_late
        type: boolean
        source: computed
        description: "True iff the response was recorded at a logical clock value strictly greater than response_due_at."
        default: false
      - name: production_note
        type: string
        source: system
        description: "Note recorded with the response; null before response."
        default: null

  - name: BsaReferral
    parent: null
    common_fields: true
    fields:
      - name: fraud_case_id
        type: string
        source: input
        description: "FK -> FraudCase.id; the substantiated case that generated this suspicious-activity referral."
      - name: narrative
        type: string
        source: input
        description: "Suspicious-activity narrative submitted to the BSA unit."
        constraints: "1..2000 characters, non-blank"
      - name: suspected_activity_code
        type: enum
        source: input
        description: "Category asserted by the referring analyst."
        constraints: "one of {KITING, MULE_ACTIVITY, STRUCTURING, ACCOUNT_TAKEOVER}"
      - name: aggregate_amount_cents
        type: integer
        source: computed
        description: "Sum of DepositItem.amount_cents over every item whose account_id is the case's primary_account_id or appears in the case's cycle_account_ids, with DepositItem.status IN {PENDING, RETURNED}. Frozen onto the referral at submit time and not recomputed afterwards."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Referral lifecycle position."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, RETURNED}"
      - name: drafted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the analyst who created the draft."
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BSA officer who accepted or returned the referral; null before adjudication."
        default: null
      - name: return_reason
        type: string
        source: system
        description: "Reason recorded when the BSA officer returns the referral; null otherwise."
        default: null
      - name: revision_count
        type: integer
        source: system
        description: "Number of times this referral has been returned and re-drafted."
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical clock instant of the most recent submit; null while DRAFT."
        default: null
      - name: adjudicated_at
        type: datetime
        source: system
        description: "Logical clock instant of the most recent adjudication; null before adjudication."
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  # -- DepositAccount dimension 1 of 2 -------------------------------------
  - entity: DepositAccount
    state_field: lifecycle_status
    initial_state: PENDING_FUNDING
    terminal_states: []
    note: |
      DepositAccount carries two independent state dimensions on the same row.
      This machine governs lifecycle_status only; no transition here ever reads
      or writes access_posture, and no transition in the access_posture machine
      ever reads or writes lifecycle_status. CHARGED_OFF is not terminal because
      a booked charge-off may be reversed.
    transitions:
      - from: PENDING_FUNDING
        to: ACTIVE
        trigger: "system, on a FundingSource for this account reaching verification_status == VERIFIED via POST /deposit-fraud/funding-sources/{id}/verification-attempts"
        actor: system
        preconditions:
          - "DepositAccount.lifecycle_status == PENDING_FUNDING"
        side_effects:
          - "Sets DepositAccount.lifecycle_status to ACTIVE."
          - "Because the funding source reached VERIFIED, new_account_risk_score is re-evaluated under the REFRESHED variant, DepositAccount.risk_score and risk_band are rewritten and risk_score_basis is set to REFRESHED."
          - "Increments DepositAccount.version by 1 and refreshes updated_at."

      - from: ACTIVE
        to: RESTRICTED
        trigger: "POST /deposit-fraud/fraud-cases, or POST /deposit-fraud/accounts/{id}/kiting-scan when the scan detects (kiting_score >= KITING_OPEN_THRESHOLD)"
        actor: FraudAnalyst
        preconditions:
          - "DepositAccount.lifecycle_status == ACTIVE"
        side_effects:
          - "Sets DepositAccount.lifecycle_status to RESTRICTED."
          - "Increments DepositAccount.version by 1 and refreshes updated_at."
        note: "An account already in RESTRICTED when a second case opens stays RESTRICTED; no error and no version bump beyond the case-open bump."

      - from: RESTRICTED
        to: ACTIVE
        trigger: "system, on POST /deposit-fraud/fraud-cases/{id}/disposition with decision == UNSUBSTANTIATE"
        actor: system
        preconditions:
          - "DepositAccount.lifecycle_status == RESTRICTED"
          - "No other FraudCase with primary_account_id == this account has status IN {OPENED, INVESTIGATING, SUBSTANTIATED}"
        side_effects:
          - "Sets DepositAccount.lifecycle_status to ACTIVE, closure_scheduled_at to null and closure_reason to null."
          - "Increments DepositAccount.version by 1 and refreshes updated_at."

      - from: RESTRICTED
        to: CLOSED
        trigger: "system, on POST /deposit-fraud/fraud-cases/{id}/close when the case status immediately before the call was SUBSTANTIATED"
        actor: system
        preconditions:
          - "DepositAccount.lifecycle_status == RESTRICTED"
          - "Customer.preservation_hold_active == false for the account's owning customer"
        side_effects:
          - "Sets DepositAccount.lifecycle_status to CLOSED and closure_reason to MULE_SUBSTANTIATED when FraudCase.case_type == MULE, or to KITING_SUBSTANTIATED when FraudCase.case_type == KITING."
          - "Increments DepositAccount.version by 1 and refreshes updated_at."

      - from: CLOSED
        to: CHARGED_OFF
        trigger: "POST /deposit-fraud/charge-offs/{id}/book"
        actor: OperationsAdmin
        preconditions:
          - "DepositAccount.lifecycle_status == CLOSED"
          - "ChargeOff.status == APPROVED"
        side_effects:
          - "Snapshots DepositAccount.ledger_balance_cents into ChargeOff.ledger_balance_before_book_cents."
          - "Adds ChargeOff.net_charge_off_cents to DepositAccount.ledger_balance_cents and to DepositAccount.available_balance_cents."
          - "Sets DepositAccount.charged_off_amount_cents to ChargeOff.net_charge_off_cents and lifecycle_status to CHARGED_OFF."
          - "Increments DepositAccount.version by 1 and refreshes updated_at."

      - from: CHARGED_OFF
        to: CLOSED
        trigger: "POST /deposit-fraud/charge-offs/{id}/reverse"
        actor: FraudSupervisor
        preconditions:
          - "DepositAccount.lifecycle_status == CHARGED_OFF"
          - "ChargeOff.principal_recovered_cents == 0 AND ChargeOff.fee_recovered_cents == 0"
        side_effects:
          - "Restores DepositAccount.ledger_balance_cents to ChargeOff.ledger_balance_before_book_cents exactly."
          - "Subtracts ChargeOff.net_charge_off_cents from DepositAccount.available_balance_cents."
          - "Sets DepositAccount.charged_off_amount_cents to 0 and lifecycle_status to CLOSED."
          - "Increments DepositAccount.version by 1 and refreshes updated_at."

  # -- DepositAccount dimension 2 of 2 -------------------------------------
  - entity: DepositAccount
    state_field: access_posture
    initial_state: NORMAL
    terminal_states: []
    note: |
      Account-takeover posture. Advances only on POST /accounts/{id}/access-review
      and POST /accounts/{id}/step-up-response. Fully independent of
      lifecycle_status: an account may be RESTRICTED and NORMAL, or ACTIVE and
      LOCKED.
    transitions:
      - from: NORMAL
        to: STEP_UP_REQUIRED
        trigger: "POST /deposit-fraud/accounts/{id}/access-review"
        actor: FraudAnalyst
        preconditions:
          - "DepositAccount.access_posture == NORMAL"
          - "The recomputed ato_score satisfies ATO_STEP_UP_MIN <= ato_score < ATO_LOCK_MIN"
        side_effects:
          - "Merges the submitted indicator_codes into DepositAccount.ato_indicator_codes as a distinct, ascending-sorted set."
          - "Rewrites DepositAccount.ato_score from calculation ato_indicator_score."
          - "Sets DepositAccount.access_posture to STEP_UP_REQUIRED."
          - "Re-evaluates new_account_risk_score under the REFRESHED variant and rewrites risk_score, risk_band and risk_score_basis."
          - "Increments DepositAccount.version by 1 and refreshes updated_at."

      - from: NORMAL
        to: LOCKED
        trigger: "POST /deposit-fraud/accounts/{id}/access-review"
        actor: FraudAnalyst
        preconditions:
          - "DepositAccount.access_posture == NORMAL"
          - "The recomputed ato_score >= ATO_LOCK_MIN"
        side_effects:
          - "Merges the submitted indicator_codes and rewrites DepositAccount.ato_score."
          - "Sets DepositAccount.access_posture to LOCKED."
          - "Increments DepositAccount.version by 1 and refreshes updated_at."

      - from: STEP_UP_REQUIRED
        to: LOCKED
        trigger: "POST /deposit-fraud/accounts/{id}/access-review, or POST /deposit-fraud/accounts/{id}/step-up-response with an incorrect challenge_answer"
        actor: FraudAnalyst | AccountHolder
        preconditions:
          - "DepositAccount.access_posture == STEP_UP_REQUIRED"
          - "Either the recomputed ato_score >= ATO_LOCK_MIN, or step_up_failure_count + 1 >= STEP_UP_MAX_FAILURES"
        side_effects:
          - "On the step-up path, increments DepositAccount.step_up_failure_count by 1 first, then sets access_posture to LOCKED."
          - "Increments DepositAccount.version by 1 and refreshes updated_at."

      - from: STEP_UP_REQUIRED
        to: STEP_UP_REQUIRED
        trigger: "POST /deposit-fraud/accounts/{id}/step-up-response with an incorrect challenge_answer"
        actor: AccountHolder
        preconditions:
          - "DepositAccount.access_posture == STEP_UP_REQUIRED"
          - "step_up_failure_count + 1 < STEP_UP_MAX_FAILURES"
        side_effects:
          - "Increments DepositAccount.step_up_failure_count by 1; access_posture is unchanged."
          - "Increments DepositAccount.version by 1 and refreshes updated_at."

      - from: STEP_UP_REQUIRED
        to: NORMAL
        trigger: "POST /deposit-fraud/accounts/{id}/step-up-response with challenge_answer equal to the owning Customer.tin_last4"
        actor: AccountHolder
        preconditions:
          - "DepositAccount.access_posture == STEP_UP_REQUIRED"
          - "X-User-ID equals DepositAccount.customer_id"
        side_effects:
          - "Sets DepositAccount.access_posture to NORMAL and step_up_failure_count to 0."
          - "Clears DepositAccount.ato_indicator_codes to the empty array and rewrites ato_score to 0."
          - "Increments DepositAccount.version by 1 and refreshes updated_at."

      - from: LOCKED
        to: STEP_UP_REQUIRED
        trigger: "POST /deposit-fraud/accounts/{id}/access-review with reset_posture == true"
        actor: FraudSupervisor
        preconditions:
          - "DepositAccount.access_posture == LOCKED"
        side_effects:
          - "Sets DepositAccount.step_up_failure_count to 0 and access_posture to STEP_UP_REQUIRED, regardless of the recomputed ato_score."
          - "Merges any submitted indicator_codes and rewrites ato_score."
          - "Increments DepositAccount.version by 1 and refreshes updated_at."

  # -- FundingSource --------------------------------------------------------
  - entity: FundingSource
    state_field: verification_status
    initial_state: DECLARED
    terminal_states: [VERIFIED, BLOCKED]
    transitions:
      - from: DECLARED
        to: MICRO_DEPOSIT_SENT
        trigger: "system, immediately within POST /deposit-fraud/accounts/{id}/funding-sources"
        actor: system
        preconditions:
          - "The row was just created with verification_status == DECLARED"
        side_effects:
          - "Mints FundingSource.micro_deposit_cents as an integer in 1..99 and sets verification_status to MICRO_DEPOSIT_SENT."
          - "The creation response already carries verification_status == MICRO_DEPOSIT_SENT; DECLARED is never observable through the API."
          - "Re-evaluates new_account_risk_score for the account under the REFRESHED variant (funding_state becomes PENDING)."

      - from: MICRO_DEPOSIT_SENT
        to: VERIFIED
        trigger: "POST /deposit-fraud/funding-sources/{id}/verification-attempts with micro_deposit_cents equal to the minted value"
        actor: OperationsAdmin
        preconditions:
          - "FundingSource.verification_status == MICRO_DEPOSIT_SENT"
        side_effects:
          - "Increments attempt_count and total_attempt_count by 1, sets verification_status to VERIFIED and verified_at to the logical clock."
          - "Because this source reached VERIFIED, the owning DepositAccount transitions PENDING_FUNDING -> ACTIVE."
          - "Because the account left PENDING_FUNDING, new_account_risk_score is re-evaluated under the REFRESHED variant and risk_band is rewritten."

      - from: MICRO_DEPOSIT_SENT
        to: FAILED_ATTEMPT
        trigger: "POST /deposit-fraud/funding-sources/{id}/verification-attempts with micro_deposit_cents different from the minted value"
        actor: OperationsAdmin
        preconditions:
          - "FundingSource.verification_status == MICRO_DEPOSIT_SENT"
          - "total_attempt_count + 1 < FUNDING_MAX_TOTAL_ATTEMPTS"
        side_effects:
          - "Increments attempt_count and total_attempt_count by 1 and sets verification_status to FAILED_ATTEMPT."
          - "Returns HTTP 200 with the updated FundingSource; a mismatched trial amount is a state transition, not an error."

      - from: FAILED_ATTEMPT
        to: FAILED_ATTEMPT
        trigger: "POST /deposit-fraud/funding-sources/{id}/verification-attempts with a further mismatched micro_deposit_cents"
        actor: OperationsAdmin
        preconditions:
          - "FundingSource.verification_status == FAILED_ATTEMPT"
          - "total_attempt_count + 1 < FUNDING_MAX_TOTAL_ATTEMPTS"
        side_effects:
          - "Increments attempt_count and total_attempt_count by 1; verification_status stays FAILED_ATTEMPT."

      - from: FAILED_ATTEMPT
        to: VERIFIED
        trigger: "POST /deposit-fraud/funding-sources/{id}/verification-attempts with micro_deposit_cents equal to the currently minted value"
        actor: OperationsAdmin
        preconditions:
          - "FundingSource.verification_status == FAILED_ATTEMPT"
        side_effects:
          - "Increments attempt_count and total_attempt_count by 1, sets verification_status to VERIFIED and verified_at to the logical clock."
          - "Because this source reached VERIFIED, the owning DepositAccount transitions PENDING_FUNDING -> ACTIVE."
          - "Because the account left PENDING_FUNDING, new_account_risk_score is re-evaluated under the REFRESHED variant and risk_band is rewritten."

      - from: FAILED_ATTEMPT
        to: MICRO_DEPOSIT_SENT
        trigger: "POST /deposit-fraud/funding-sources/{id}/resend"
        actor: OperationsAdmin
        preconditions:
          - "FundingSource.verification_status == FAILED_ATTEMPT"
          - "FundingSource.total_attempt_count < FUNDING_MAX_TOTAL_ATTEMPTS"
        side_effects:
          - "Mints a fresh FundingSource.micro_deposit_cents in 1..99, resets attempt_count to 0 and sets verification_status back to MICRO_DEPOSIT_SENT."
          - "total_attempt_count is NOT reset."
        note: "This is the retry loop: MICRO_DEPOSIT_SENT -> FAILED_ATTEMPT -> MICRO_DEPOSIT_SENT."

      - from: FAILED_ATTEMPT
        to: BLOCKED
        trigger: "POST /deposit-fraud/funding-sources/{id}/verification-attempts with a mismatched micro_deposit_cents that exhausts the lifetime budget"
        actor: OperationsAdmin
        preconditions:
          - "FundingSource.verification_status == FAILED_ATTEMPT"
          - "total_attempt_count + 1 >= FUNDING_MAX_TOTAL_ATTEMPTS"
        side_effects:
          - "Increments attempt_count and total_attempt_count by 1 and sets verification_status to BLOCKED."
          - "The owning DepositAccount stays in PENDING_FUNDING; no further attempt or resend is accepted on this source."

  # -- DepositItem ----------------------------------------------------------
  - entity: DepositItem
    state_field: status
    initial_state: PENDING
    terminal_states: [CLEARED, RETURNED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /deposit-fraud/deposit-items/{id}/settle with outcome == CLEARED"
        actor: OperationsAdmin
        preconditions:
          - "DepositItem.status == PENDING"
        side_effects:
          - "Sets DepositItem.status to CLEARED and settled_at to the logical clock."
          - "Because the item cleared, every CheckHold on this item with status == ACTIVE transitions to RELEASED with released_at stamped."
          - "Because those holds left ACTIVE, DepositAccount.available_balance_cents increases by the total held_amount_cents just released and held_amount_cents is recomputed; ledger_balance_cents is unchanged."
          - "When DepositItem.drawee_account_id is not null, the drawee DepositAccount has ledger_balance_cents and available_balance_cents each reduced by DepositItem.amount_cents."
          - "Because held_amount_cents changed on any affected account, every FraudCase with status IN {OPENED, INVESTIGATING} whose primary_account_id is that account or whose cycle_account_ids contains that account has exposure_at_risk_cents recomputed."

      - from: PENDING
        to: RETURNED
        trigger: "POST /deposit-fraud/deposit-items/{id}/settle with outcome == RETURNED and a return_reason"
        actor: OperationsAdmin
        preconditions:
          - "DepositItem.status == PENDING"
          - "return_reason is present"
        side_effects:
          - "Sets DepositItem.status to RETURNED, return_reason and settled_at."
          - "Because the item was returned, every CheckHold on this item with status == ACTIVE transitions to CHARGED_BACK with released_at stamped."
          - "Because the item was returned, DepositAccount.ledger_balance_cents decreases by DepositItem.amount_cents and available_balance_cents decreases by (DepositItem.amount_cents minus the total held_amount_cents of the holds just charged back); available_balance_cents may go negative."
          - "The drawee DepositAccount, when present, is not adjusted on a return."
          - "Because held_amount_cents changed, every FraudCase with status IN {OPENED, INVESTIGATING} covering the account has exposure_at_risk_cents recomputed."

  # -- CheckHold ------------------------------------------------------------
  - entity: CheckHold
    state_field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED, OVERRIDDEN, CHARGED_BACK]
    note: "Rows are minted by the system inside POST /accounts/{id}/deposit-items; there is no client-facing create."
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "system, on the parent DepositItem reaching CLEARED"
        actor: system
        preconditions:
          - "CheckHold.status == ACTIVE"
        side_effects:
          - "Sets CheckHold.status to RELEASED and released_at to the logical clock."

      - from: ACTIVE
        to: CHARGED_BACK
        trigger: "system, on the parent DepositItem reaching RETURNED"
        actor: system
        preconditions:
          - "CheckHold.status == ACTIVE"
        side_effects:
          - "Sets CheckHold.status to CHARGED_BACK and released_at to the logical clock."

      - from: ACTIVE
        to: OVERRIDDEN
        trigger: "system, on POST /deposit-fraud/hold-override-reviews/{id}/execute when requested_release_cents equals the hold's current held_amount_cents"
        actor: system
        preconditions:
          - "CheckHold.status == ACTIVE"
          - "HoldOverrideReview.status == APPROVED"
        side_effects:
          - "Reduces CheckHold.held_amount_cents to 0, sets status to OVERRIDDEN and released_at to the logical clock."

      - from: ACTIVE
        to: ACTIVE
        trigger: "system, on POST /deposit-fraud/hold-override-reviews/{id}/execute when requested_release_cents is strictly less than the hold's current held_amount_cents"
        actor: system
        preconditions:
          - "CheckHold.status == ACTIVE"
          - "HoldOverrideReview.status == APPROVED"
        side_effects:
          - "Reduces CheckHold.held_amount_cents by requested_release_cents; status, hold_type and hold_release_at are unchanged."

      - from: ACTIVE
        to: ACTIVE
        trigger: "system, on a substantiated MULE FraudCase cascading onto the account (POST /deposit-fraud/fraud-cases/{id}/disposition with decision == SUBSTANTIATE)"
        actor: system
        preconditions:
          - "CheckHold.status == ACTIVE"
          - "The hold's DepositItem.account_id equals the case's primary_account_id"
        side_effects:
          - "Sets CheckHold.hold_type to EXCEPTION_FRAUD and hold_release_at to the account's newly assigned closure_scheduled_at; held_amount_cents is unchanged."

  # -- HoldOverrideReview ---------------------------------------------------
  - entity: HoldOverrideReview
    state_field: status
    initial_state: DRAFT
    terminal_states: [DENIED, EXECUTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /deposit-fraud/hold-override-reviews/{id}/submit"
        actor: FraudAnalyst | FraudSupervisor
        preconditions:
          - "HoldOverrideReview.status == DRAFT"
          - "The referenced CheckHold.status == ACTIVE"
        side_effects:
          - "Sets status to SUBMITTED and submitted_at to the logical clock."
          - "Recomputes loss_exposure_cents and adjusted_exposure_cents from hold_override_loss_exposure against the account's ACTIVE holds as of now."

      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /deposit-fraud/hold-override-reviews/{id}/submit"
        actor: FraudAnalyst | FraudSupervisor
        preconditions:
          - "HoldOverrideReview.status == RETURNED_FOR_INFO"
          - "The referenced CheckHold.status == ACTIVE"
        side_effects:
          - "Sets status to SUBMITTED, submitted_at to the logical clock and increments revision_count by 1."
          - "Recomputes loss_exposure_cents and adjusted_exposure_cents."
        note: "This edge closes the revision loop SUBMITTED -> RETURNED_FOR_INFO -> SUBMITTED."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /deposit-fraud/hold-override-reviews/{id}/decide with decision == APPROVE"
        actor: FraudSupervisor
        preconditions:
          - "HoldOverrideReview.status == SUBMITTED"
          - "X-User-ID differs from HoldOverrideReview.prepared_by_user_id"
          - "The referenced CheckHold.status == ACTIVE"
          - "HoldOverrideReview.adjusted_exposure_cents <= SUPERVISOR_APPROVAL_LIMIT_CENTS"
        side_effects:
          - "Sets status to APPROVED, decided_by_user_id to X-User-ID, decided_at to the logical clock and decision_note."

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /deposit-fraud/hold-override-reviews/{id}/decide with decision == DENY"
        actor: FraudSupervisor
        preconditions:
          - "HoldOverrideReview.status == SUBMITTED"
          - "X-User-ID differs from HoldOverrideReview.prepared_by_user_id"
        side_effects:
          - "Sets status to DENIED, decided_by_user_id, decided_at and decision_note."

      - from: SUBMITTED
        to: RETURNED_FOR_INFO
        trigger: "POST /deposit-fraud/hold-override-reviews/{id}/decide with decision == RETURN_FOR_INFO"
        actor: FraudSupervisor
        preconditions:
          - "HoldOverrideReview.status == SUBMITTED"
          - "X-User-ID differs from HoldOverrideReview.prepared_by_user_id"
        side_effects:
          - "Sets status to RETURNED_FOR_INFO, decided_by_user_id, decided_at and decision_note."

      - from: APPROVED
        to: EXECUTED
        trigger: "POST /deposit-fraud/hold-override-reviews/{id}/execute"
        actor: FraudSupervisor
        preconditions:
          - "HoldOverrideReview.status == APPROVED"
          - "The referenced CheckHold.status == ACTIVE"
          - "requested_release_cents <= the CheckHold's current held_amount_cents"
        side_effects:
          - "Sets status to EXECUTED and executed_at to the logical clock (cascade hop 1)."
          - "Because the review reached EXECUTED, the referenced CheckHold has held_amount_cents reduced by requested_release_cents and, when that reaches 0, transitions ACTIVE -> OVERRIDDEN with released_at stamped (cascade hop 2)."
          - "Because that CheckHold's held_amount_cents changed, the owning DepositAccount has available_balance_cents increased by requested_release_cents and held_amount_cents recomputed; ledger_balance_cents is unchanged (cascade hop 3)."
          - "Because that account's held_amount_cents changed, every FraudCase with status IN {OPENED, INVESTIGATING} whose primary_account_id is the account or whose cycle_account_ids contains the account has exposure_at_risk_cents recomputed (cascade hop 4)."
          - "Increments version by 1 on the review, the hold, the account and every recomputed FraudCase."

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system, on a newer HoldOverrideReview being created against the same CheckHold via POST /deposit-fraud/check-holds/{id}/override-reviews"
        actor: system
        preconditions:
          - "HoldOverrideReview.status IN {DRAFT, SUBMITTED, RETURNED_FOR_INFO, APPROVED}"
        side_effects:
          - "Sets status to SUPERSEDED; decided_by_user_id and decision_note are left untouched."

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system, on a newer HoldOverrideReview being created against the same CheckHold, or on a substantiated MULE FraudCase retyping the hold to EXCEPTION_FRAUD"
        actor: system
        preconditions:
          - "HoldOverrideReview.status IN {DRAFT, SUBMITTED, RETURNED_FOR_INFO, APPROVED}"
        side_effects:
          - "Sets status to SUPERSEDED."

      - from: RETURNED_FOR_INFO
        to: SUPERSEDED
        trigger: "system, on a newer HoldOverrideReview being created against the same CheckHold, or on a substantiated MULE FraudCase retyping the hold to EXCEPTION_FRAUD"
        actor: system
        preconditions:
          - "HoldOverrideReview.status IN {DRAFT, SUBMITTED, RETURNED_FOR_INFO, APPROVED}"
        side_effects:
          - "Sets status to SUPERSEDED."

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system, on a newer HoldOverrideReview being created against the same CheckHold, or on a substantiated MULE FraudCase retyping the hold to EXCEPTION_FRAUD"
        actor: system
        preconditions:
          - "HoldOverrideReview.status IN {DRAFT, SUBMITTED, RETURNED_FOR_INFO, APPROVED}"
        side_effects:
          - "Sets status to SUPERSEDED; an approved-but-unexecuted release can no longer be executed."

  # -- FraudCase ------------------------------------------------------------
  - entity: FraudCase
    state_field: status
    initial_state: OPENED
    terminal_states: [CLOSED]
    transitions:
      - from: OPENED
        to: INVESTIGATING
        trigger: "POST /deposit-fraud/fraud-cases/{id}/advance"
        actor: FraudAnalyst
        preconditions:
          - "FraudCase.status == OPENED"
        side_effects:
          - "Sets status to INVESTIGATING."
          - "Recomputes exposure_at_risk_cents."

      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "POST /deposit-fraud/fraud-cases/{id}/close"
        actor: FraudSupervisor
        preconditions:
          - "FraudCase.status == SUBSTANTIATED"
          - "Customer.preservation_hold_active == false for the owning customer of primary_account_id"
          - "At least one BsaReferral with this fraud_case_id has status == ACCEPTED"
        side_effects:
          - "Sets status to CLOSED and closed_at to the logical clock."
          - "Because the case closed from SUBSTANTIATED, the primary DepositAccount transitions RESTRICTED -> CLOSED with closure_reason MULE_SUBSTANTIATED (case_type == MULE) or KITING_SUBSTANTIATED (case_type == KITING)."

      - from: UNSUBSTANTIATED
        to: CLOSED
        trigger: "POST /deposit-fraud/fraud-cases/{id}/close"
        actor: FraudSupervisor
        preconditions:
          - "FraudCase.status == UNSUBSTANTIATED"
          - "Customer.preservation_hold_active == false for the owning customer of primary_account_id"
        side_effects:
          - "Sets status to CLOSED and closed_at to the logical clock."
          - "The primary DepositAccount is not transitioned; it stays in whatever lifecycle_status the UNSUBSTANTIATE disposition already produced."
        note: "No BsaReferral is required to close an unsubstantiated case."

      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /deposit-fraud/fraud-cases/{id}/disposition with decision == SUBSTANTIATE"
        actor: FraudSupervisor
        preconditions:
          - "FraudCase.status == INVESTIGATING"
        side_effects:
          - "Sets status to SUBSTANTIATED and disposition_note (cascade hop 1)."
          - "MULE branch only: because the case became SUBSTANTIATED with case_type == MULE, the primary DepositAccount is forced to lifecycle_status RESTRICTED, closure_scheduled_at is set to the logical clock plus MULE_CLOSURE_NOTICE_DAYS days and closure_reason to MULE_SUBSTANTIATED (cascade hop 2)."
          - "MULE branch only: because the account acquired a closure_scheduled_at, every CheckHold with status == ACTIVE on that account's DepositItems has hold_type set to EXCEPTION_FRAUD and hold_release_at set to that closure_scheduled_at (cascade hop 3)."
          - "MULE branch only: because those holds were retyped to EXCEPTION_FRAUD, every HoldOverrideReview against them with status IN {DRAFT, SUBMITTED, RETURNED_FOR_INFO, APPROVED} transitions to SUPERSEDED (cascade hop 4)."
          - "KITING branch only: the primary DepositAccount is forced to lifecycle_status RESTRICTED; closure_scheduled_at, closure_reason, hold types and override reviews are all left untouched."
          - "Increments version by 1 on the case and on every entity the branch actually mutated."

      - from: INVESTIGATING
        to: UNSUBSTANTIATED
        trigger: "POST /deposit-fraud/fraud-cases/{id}/disposition with decision == UNSUBSTANTIATE"
        actor: FraudSupervisor
        preconditions:
          - "FraudCase.status == INVESTIGATING"
        side_effects:
          - "Sets status to UNSUBSTANTIATED and disposition_note."
          - "Because the case was cleared, the primary DepositAccount transitions RESTRICTED -> ACTIVE with closure_scheduled_at and closure_reason cleared, provided no other FraudCase on that account has status IN {OPENED, INVESTIGATING, SUBSTANTIATED}."

      - from: UNSUBSTANTIATED
        to: INVESTIGATING
        trigger: "POST /deposit-fraud/fraud-cases/{id}/disposition with decision == REOPEN"
        actor: FraudSupervisor
        preconditions:
          - "FraudCase.status == UNSUBSTANTIATED"
        side_effects:
          - "Sets status back to INVESTIGATING and increments reopen_count by 1."
          - "Because the case is live again, the primary DepositAccount transitions ACTIVE -> RESTRICTED."
        note: "This edge closes the investigation loop INVESTIGATING -> UNSUBSTANTIATED -> INVESTIGATING."

  # -- ChargeOff ------------------------------------------------------------
  - entity: ChargeOff
    state_field: status
    initial_state: PROPOSED
    terminal_states: [RECOVERED_FULL, REVERSED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /deposit-fraud/charge-offs/{id}/approve"
        actor: FraudSupervisor
        preconditions:
          - "ChargeOff.status == PROPOSED"
        side_effects:
          - "Sets status to APPROVED and approved_by_user_id to X-User-ID."

      - from: APPROVED
        to: BOOKED
        trigger: "POST /deposit-fraud/charge-offs/{id}/book"
        actor: OperationsAdmin
        preconditions:
          - "ChargeOff.status == APPROVED"
          - "DepositAccount.lifecycle_status == CLOSED"
        side_effects:
          - "Sets status to BOOKED, booked_by_user_id to X-User-ID and booked_at to the logical clock."
          - "Snapshots the account's ledger_balance_cents into ledger_balance_before_book_cents, then adds net_charge_off_cents to the account's ledger_balance_cents and available_balance_cents, sets the account's charged_off_amount_cents to net_charge_off_cents and its lifecycle_status to CHARGED_OFF."

      - from: BOOKED
        to: REFERRED_TO_RECOVERY
        trigger: "system, immediately after booking"
        actor: system
        preconditions:
          - "ChargeOff.status == BOOKED"
          - "ChargeOff.net_charge_off_cents >= RECOVERY_REFERRAL_MIN_CENTS"
        side_effects:
          - "Sets status to REFERRED_TO_RECOVERY within the same booking request; a charge-off whose net_charge_off_cents is strictly below the threshold stays in BOOKED and never becomes eligible for recovery postings."

      - from: REFERRED_TO_RECOVERY
        to: RECOVERED_PARTIAL
        trigger: "POST /deposit-fraud/charge-offs/{id}/recovery-postings"
        actor: OperationsAdmin
        preconditions:
          - "ChargeOff.status == REFERRED_TO_RECOVERY"
          - "The posting fits inside the remaining fee and principal buckets"
        side_effects:
          - "Applies the posting through the recovery_waterfall buckets, updating fee_recovered_cents and principal_recovered_cents."
          - "Reduces DepositAccount.charged_off_amount_cents by the total applied."
          - "Sets status to RECOVERED_PARTIAL when outstanding_loss_cents is still greater than 0."

      - from: RECOVERED_PARTIAL
        to: RECOVERED_PARTIAL
        trigger: "POST /deposit-fraud/charge-offs/{id}/recovery-postings"
        actor: OperationsAdmin
        preconditions:
          - "ChargeOff.status == RECOVERED_PARTIAL"
          - "The posting fits inside the remaining fee and principal buckets"
        side_effects:
          - "Applies the posting through the recovery_waterfall buckets and reduces DepositAccount.charged_off_amount_cents by the total applied."

      - from: REFERRED_TO_RECOVERY
        to: RECOVERED_FULL
        trigger: "POST /deposit-fraud/charge-offs/{id}/recovery-postings"
        actor: OperationsAdmin
        preconditions:
          - "ChargeOff.status == REFERRED_TO_RECOVERY"
          - "The posting brings outstanding_loss_cents to exactly 0"
        side_effects:
          - "Applies the posting, reduces DepositAccount.charged_off_amount_cents to 0 and sets status to RECOVERED_FULL."

      - from: RECOVERED_PARTIAL
        to: RECOVERED_FULL
        trigger: "POST /deposit-fraud/charge-offs/{id}/recovery-postings"
        actor: OperationsAdmin
        preconditions:
          - "ChargeOff.status == RECOVERED_PARTIAL"
          - "The posting brings outstanding_loss_cents to exactly 0"
        side_effects:
          - "Applies the posting, reduces DepositAccount.charged_off_amount_cents to 0 and sets status to RECOVERED_FULL."

      - from: BOOKED
        to: REVERSED
        trigger: "POST /deposit-fraud/charge-offs/{id}/reverse"
        actor: FraudSupervisor
        preconditions:
          - "ChargeOff.status == BOOKED"
          - "principal_recovered_cents == 0 AND fee_recovered_cents == 0"
        side_effects:
          - "Sets status to REVERSED and reversed_at to the logical clock."
          - "Restores the account's ledger_balance_cents to ledger_balance_before_book_cents, subtracts net_charge_off_cents from its available_balance_cents, zeroes charged_off_amount_cents and transitions lifecycle_status CHARGED_OFF -> CLOSED."

      - from: REFERRED_TO_RECOVERY
        to: REVERSED
        trigger: "POST /deposit-fraud/charge-offs/{id}/reverse"
        actor: FraudSupervisor
        preconditions:
          - "ChargeOff.status == REFERRED_TO_RECOVERY"
          - "principal_recovered_cents == 0 AND fee_recovered_cents == 0"
        side_effects:
          - "Sets status to REVERSED and reversed_at to the logical clock."
          - "Restores the account's ledger_balance_cents to ledger_balance_before_book_cents, subtracts net_charge_off_cents from its available_balance_cents, zeroes charged_off_amount_cents and transitions lifecycle_status CHARGED_OFF -> CLOSED."

      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system, on a newer ChargeOff being created against the same DepositAccount via POST /deposit-fraud/accounts/{id}/charge-offs"
        actor: system
        preconditions:
          - "ChargeOff.status == PROPOSED"
        side_effects:
          - "Sets status to SUPERSEDED; the revised proposal takes its place."

  # -- SubpoenaRequest ------------------------------------------------------
  - entity: SubpoenaRequest
    state_field: status
    initial_state: RECEIVED
    terminal_states: [PRODUCED, OBJECTED, QUASHED]
    transitions:
      - from: RECEIVED
        to: UNDER_LEGAL_REVIEW
        trigger: "POST /deposit-fraud/subpoenas/{id}/legal-review"
        actor: LegalCounsel
        preconditions:
          - "SubpoenaRequest.status == RECEIVED"
        side_effects:
          - "Sets status to UNDER_LEGAL_REVIEW and legal_reviewed_by_user_id to X-User-ID."

      - from: UNDER_LEGAL_REVIEW
        to: PRODUCED
        trigger: "POST /deposit-fraud/subpoenas/{id}/respond with disposition == PRODUCE"
        actor: LegalCounsel
        preconditions:
          - "SubpoenaRequest.status == UNDER_LEGAL_REVIEW"
          - "X-User-ID differs from SubpoenaRequest.legal_reviewed_by_user_id"
          - "When the logical clock is strictly after response_due_at, late_justification is present"
        side_effects:
          - "Sets status to PRODUCED, responded_by_user_id, production_note and is_late."
          - "The customer's preservation_hold_active stays true until the logical clock passes preservation_end_at."

      - from: UNDER_LEGAL_REVIEW
        to: OBJECTED
        trigger: "POST /deposit-fraud/subpoenas/{id}/respond with disposition == OBJECT"
        actor: LegalCounsel
        preconditions:
          - "SubpoenaRequest.status == UNDER_LEGAL_REVIEW"
          - "X-User-ID differs from SubpoenaRequest.legal_reviewed_by_user_id"
          - "When the logical clock is strictly after response_due_at, late_justification is present"
        side_effects:
          - "Sets status to OBJECTED, responded_by_user_id and is_late."
          - "Because OBJECTED is outside {RECEIVED, UNDER_LEGAL_REVIEW, PRODUCED}, the customer's preservation_hold_active drops to false unless another subpoena still holds it."

      - from: UNDER_LEGAL_REVIEW
        to: QUASHED
        trigger: "POST /deposit-fraud/subpoenas/{id}/respond with disposition == QUASH"
        actor: LegalCounsel
        preconditions:
          - "SubpoenaRequest.status == UNDER_LEGAL_REVIEW"
          - "X-User-ID differs from SubpoenaRequest.legal_reviewed_by_user_id"
          - "When the logical clock is strictly after response_due_at, late_justification is present"
        side_effects:
          - "Sets status to QUASHED, responded_by_user_id and is_late."
          - "Because QUASHED is outside {RECEIVED, UNDER_LEGAL_REVIEW, PRODUCED}, the customer's preservation_hold_active drops to false unless another subpoena still holds it."

  # -- BsaReferral ----------------------------------------------------------
  - entity: BsaReferral
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /deposit-fraud/bsa-referrals/{id}/submit"
        actor: FraudAnalyst
        preconditions:
          - "BsaReferral.status == DRAFT"
          - "The referenced FraudCase.status == SUBSTANTIATED"
        side_effects:
          - "Sets status to SUBMITTED and submitted_at to the logical clock."
          - "Freezes aggregate_amount_cents from the case's account set as of this instant."

      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /deposit-fraud/bsa-referrals/{id}/submit"
        actor: FraudAnalyst
        preconditions:
          - "BsaReferral.status == RETURNED"
          - "The referenced FraudCase.status == SUBSTANTIATED"
        side_effects:
          - "Sets status to SUBMITTED, submitted_at to the logical clock and increments revision_count by 1."
          - "Re-freezes aggregate_amount_cents as of this instant."
        note: "This edge closes the referral loop SUBMITTED -> RETURNED -> SUBMITTED."

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /deposit-fraud/bsa-referrals/{id}/adjudicate with decision == ACCEPT"
        actor: BsaOfficer
        preconditions:
          - "BsaReferral.status == SUBMITTED"
        side_effects:
          - "Sets status to ACCEPTED, adjudicated_by_user_id and adjudicated_at."
          - "Because an ACCEPTED referral now exists for the case, the case becomes eligible for closure."

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /deposit-fraud/bsa-referrals/{id}/adjudicate with decision == RETURN"
        actor: BsaOfficer
        preconditions:
          - "BsaReferral.status == SUBMITTED"
          - "return_reason is present"
        side_effects:
          - "Sets status to RETURNED, return_reason, adjudicated_by_user_id and adjudicated_at."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned
#       write-write conflict mechanism in this scaffold)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: override-review-create-stale-hold
    parent_entity: CheckHold
    write_endpoint: "POST /deposit-fraud/check-holds/{id}/override-reviews"
    occ_field: "expected_check_hold_version"
    description: |
      Creating a HoldOverrideReview against a CheckHold whose version has
      advanced since the client last read it is rejected. A second review
      created against the same hold legitimately supersedes every earlier
      non-terminal review on that hold (see the HoldOverrideReview
      DRAFT/SUBMITTED/RETURNED_FOR_INFO/APPROVED -> SUPERSEDED edges), so a
      writer holding a stale view of the hold would silently discard work it
      never saw. The stale-version check makes that visible.
    error_id: ERR_STALE_CHECK_HOLD_VERSION
    http_status: 412

  - rule_id: charge-off-create-stale-account
    parent_entity: DepositAccount
    write_endpoint: "POST /deposit-fraud/accounts/{id}/charge-offs"
    occ_field: "expected_account_version"
    description: |
      Creating a ChargeOff against a DepositAccount whose version has advanced
      since the client last read it is rejected. A new proposal legitimately
      supersedes an existing PROPOSED charge-off on the same account (see the
      ChargeOff PROPOSED -> SUPERSEDED edge), and the loss figure depends on
      balances the stale reader has not seen.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: new_account_risk_score
    trigger: "On POST /deposit-fraud/accounts (PROVISIONAL_AT_OPEN variant); and under the REFRESHED variant on POST /deposit-fraud/accounts/{id}/funding-sources, POST /deposit-fraud/funding-sources/{id}/verification-attempts, POST /deposit-fraud/funding-sources/{id}/resend, POST /deposit-fraud/account-links (both endpoint accounts) and POST /deposit-fraud/accounts/{id}/access-review."
    algorithm: weighted_scoring
    formula: |
      # Step 1 — funding posture of the account
      funding_state =
          "VERIFIED" if EXISTS FundingSource F WHERE F.account_id == A.id
                        AND F.verification_status == "VERIFIED"
          else "PENDING" if EXISTS FundingSource F WHERE F.account_id == A.id
                        AND F.verification_status IN {"DECLARED","MICRO_DEPOSIT_SENT","FAILED_ATTEMPT"}
          else "NONE"

      # Step 2 — risk-bearing association count (AccountLink.is_risk_bearing == true)
      risk_link_count = COUNT(AccountLink L
          WHERE (L.from_account_id == A.id OR L.to_account_id == A.id)
            AND L.link_type IN {"SHARED_DEVICE","SHARED_ADDRESS","SHARED_PHONE"}
            AND L.confidence_bps >= LINK_CONFIDENCE_MIN_BPS)
      link_points = min(LINK_POINTS_CAP, LINK_POINTS_PER_RISK_LINK * risk_link_count)

      # Step 3 — additive assembly, then clamp
      raw = KYC_TIER_POINTS[C.kyc_tier]
          + FUNDING_POINTS[funding_state]
          + CHANNEL_POINTS[A.open_channel]
          + (WATCHLIST_POINTS if C.watchlist_hit else 0)
          + link_points
      risk_score = min(100, max(0, raw))

      # Step 4 — band, evaluated with >= at both edges
      risk_band = "HIGH"     if risk_score >= RISK_BAND_HIGH_MIN
                  else "ELEVATED" if risk_score >= RISK_BAND_ELEVATED_MIN
                  else "STANDARD"
    input_set: "C is the Customer named by A.customer_id. FundingSource rows are filtered by verification_status exactly as written; a BLOCKED source contributes neither VERIFIED nor PENDING and therefore leaves funding_state at NONE unless another source qualifies. AccountLink rows are counted in both directions with no status filter (AccountLink has no lifecycle)."
    constants:
      KYC_TIER_POINTS: { TIER_1: 0, TIER_2: 15, TIER_3: 35 }
      FUNDING_POINTS: { VERIFIED: 0, PENDING: 20, NONE: 30 }
      CHANNEL_POINTS: { BRANCH: 0, ONLINE: 12, MOBILE: 18 }
      WATCHLIST_POINTS: 40
      LINK_POINTS_PER_RISK_LINK: 5
      LINK_POINTS_CAP: 25
      LINK_CONFIDENCE_MIN_BPS: 6000
      RISK_BAND_HIGH_MIN: 60
      RISK_BAND_ELEVATED_MIN: 35
    precision: "integer cents-free score, no rounding needed; all terms are integers"
    variants:
      - name: PROVISIONAL_AT_OPEN
        when: "Evaluated inside POST /deposit-fraud/accounts, before any FundingSource or AccountLink can exist for the new account."
        difference: "funding_state is forced to \"NONE\" (30 points) and risk_link_count is forced to 0, regardless of what a later read would find. DepositAccount.risk_score_basis is written as PROVISIONAL_AT_OPEN."
      - name: REFRESHED
        when: "Evaluated on any funding-source mutation, account-link creation or access review touching the account."
        difference: "funding_state and risk_link_count are read from live rows, so the same Customer and open_channel yield a strictly different score once funding verifies (30 points drop off) or a risk-bearing link appears (5 points added per link, capped at 25). DepositAccount.risk_score_basis is written as REFRESHED."

  - name: ato_indicator_score
    trigger: "On POST /deposit-fraud/accounts/{id}/access-review (after merging indicator_codes) and on POST /deposit-fraud/accounts/{id}/step-up-response when the challenge succeeds."
    algorithm: weighted_scoring
    formula: |
      distinct_codes = A.ato_indicator_codes            # already a distinct, ascending-sorted set
      ato_score = min(100, SUM(INDICATOR_WEIGHTS[code] for code in distinct_codes))

      # posture consequence, evaluated with >= at both edges
      if reset_posture == true and A.access_posture == "LOCKED":
          new_posture = "STEP_UP_REQUIRED"              # supervisor reset wins over the score
      elif ato_score >= ATO_LOCK_MIN:
          new_posture = "LOCKED"
      elif ato_score >= ATO_STEP_UP_MIN:
          new_posture = "STEP_UP_REQUIRED"
      else:
          new_posture = A.access_posture                # unchanged; never de-escalates on its own
    input_set: "Only the distinct codes currently stored on DepositAccount.ato_indicator_codes are scored. Submitting a code already present adds no weight. A successful step-up clears the array, so ato_score returns to 0."
    constants:
      INDICATOR_WEIGHTS:
        NEW_DEVICE: 15
        GEO_VELOCITY: 25
        CREDENTIAL_STUFFING: 30
        PROFILE_CHANGE: 20
        DORMANT_REACTIVATION: 18
        PAYEE_ADDED: 12
      ATO_STEP_UP_MIN: 40
      ATO_LOCK_MIN: 75
      STEP_UP_MAX_FAILURES: 3
    precision: "integer score, no rounding"

  - name: check_hold_schedule
    trigger: "On POST /deposit-fraud/accounts/{id}/deposit-items, immediately after the DepositItem row is written and before the account balances are posted."
    algorithm: threshold
    formula: |
      if I.item_type == "CASH":
          immediate_credit_cents = I.amount_cents
          held_cents = 0
          # no CheckHold row is created
      else:
          immediate_credit_cents = min(I.amount_cents, IMMEDIATE_AVAIL_CENTS)
          held_cents = I.amount_cents - immediate_credit_cents
          if held_cents > 0:
              account_age_days = floor((logical_now - A.opened_at) / 86400 seconds)
              if I.item_type == "ACH":
                  hold_type = "STANDARD"
              elif account_age_days < NEW_ACCOUNT_DAYS:
                  hold_type = "EXCEPTION_NEW_ACCOUNT"
              elif I.amount_cents > LARGE_DEPOSIT_CENTS:
                  hold_type = "EXCEPTION_LARGE_DEPOSIT"
              elif A.risk_band == "HIGH":
                  hold_type = "EXCEPTION_RISK"
              else:
                  hold_type = "STANDARD"
              hold_start_at   = I.deposit_at
              hold_release_at = I.deposit_at + HOLD_DAYS[hold_type] calendar days
              held_amount_cents = held_cents
          # held_cents == 0 -> no CheckHold row is created

      # balance posting, in this order
      A.ledger_balance_cents    += I.amount_cents
      A.available_balance_cents += immediate_credit_cents
      A.held_amount_cents        = SUM(H.held_amount_cents for CheckHold H
                                       WHERE H.status == "ACTIVE"
                                         AND H.deposit_item_id IN (items of A))
    input_set: "The ladder is evaluated strictly top-to-bottom: the ACH short-circuit is tested before the new-account exception, and the new-account exception is tested before the large-deposit exception, so a 9-day new-account hold wins over a 7-day large-deposit hold on a young account. account_age_days uses calendar-day flooring against DepositAccount.opened_at. Both edges are strict: an account of exactly NEW_ACCOUNT_DAYS days is NOT new, and an item of exactly LARGE_DEPOSIT_CENTS is NOT large."
    constants:
      IMMEDIATE_AVAIL_CENTS: 22500
      LARGE_DEPOSIT_CENTS: 552500
      NEW_ACCOUNT_DAYS: 30
      HOLD_DAYS: { STANDARD: 2, EXCEPTION_RISK: 5, EXCEPTION_LARGE_DEPOSIT: 7, EXCEPTION_NEW_ACCOUNT: 9, EXCEPTION_FRAUD: 0 }
    precision: "integer cents; calendar-day arithmetic in UTC"

  - name: hold_override_loss_exposure
    trigger: "On POST /deposit-fraud/check-holds/{id}/override-reviews (initial value) and re-evaluated on POST /deposit-fraud/hold-override-reviews/{id}/submit."
    algorithm: aggregation
    formula: |
      # Scope: every ACTIVE hold on the SAME DepositAccount as the review's hold,
      # walked in CheckHold.created_at ASC order (ties broken by the parent
      # DepositItem.created_at ASC).
      scope = [CheckHold H WHERE H.status == "ACTIVE"
                             AND item_of(H).account_id == item_of(review.check_hold_id).account_id]

      # STEP 1 — round EACH LINE first
      for H in scope:
          raw_i      = H.held_amount_cents * RETURN_RATE_BPS[item_of(H).item_type] / 10000
          exposure_i = round_half_up(raw_i)          # 0 decimal places, cents

      # STEP 2 — sum the already-rounded lines
      loss_exposure_cents = SUM(exposure_i)

      # STEP 3 — apply the band multiplier, then round a SECOND time
      adjusted_exposure_cents =
          round_half_up(loss_exposure_cents * RISK_MULT_BPS[A.risk_band] / 10000)
    input_set: "Only holds whose status is exactly ACTIVE at evaluation time enter the scope; RELEASED, OVERRIDDEN and CHARGED_BACK holds are excluded. The rounding order is pinned: round-per-line-then-sum. Summing the raw products first and rounding once at the end is explicitly NOT the rule and yields a different figure whenever the discarded fractions add up past a half cent."
    constants:
      RETURN_RATE_BPS: { CHECK: 275, ACH: 120, CASH: 0 }
      RISK_MULT_BPS: { STANDARD: 10000, ELEVATED: 12500, HIGH: 16000 }
      SUPERVISOR_APPROVAL_LIMIT_CENTS: 500000
    precision: "2 rounding events, both round_half_up to whole cents, in the order given"

  - name: kiting_cycle_score
    trigger: "On POST /deposit-fraud/accounts/{id}/kiting-scan."
    algorithm: topological
    formula: |
      W = [window_start_at, window_end_at)              # half-open

      # Edge set: an on-us check deposited into `account` and drawn on `drawee`
      # is a directed circulation edge drawee -> account.
      E = { (I.drawee_account_id -> I.account_id, I) :
            DepositItem I WHERE I.item_type == "CHECK"
                            AND I.drawee_account_id IS NOT NULL
                            AND I.deposit_at >= window_start_at
                            AND I.deposit_at <  window_end_at
                            AND I.status IN QUALIFYING_STATUSES[mode] }

      # Shortest directed cycle through the scanned account A, depth-capped.
      candidates = all directed cycles in E containing A with at most
                   CYCLE_MAX_DEPTH distinct accounts
      if candidates is empty:
          cycle_length = 0; cycle_account_ids = []
      else:
          shortest = candidates with the fewest distinct accounts
          # tie-break: among equal-length cycles, take the one whose member
          # accounts' DepositAccount.created_at values, listed ascending, are
          # lexicographically smallest. DepositAccount.id is never consulted.
          chosen = lexicographically-smallest-created_at cycle in shortest
          cycle_length = number of distinct accounts in chosen
          cycle_account_ids = chosen, rotated to start at A, then following the
                              directed edges

      qualifying_item_count = COUNT(I in E whose (drawee -> account) pair is an
                                    edge of `chosen`)            # 0 when no cycle
      deposited_cents  = SUM(I.amount_cents over those same items)   # 0 when no cycle
      uncollected_cents = SUM(H.held_amount_cents for CheckHold H
                              WHERE H.status == "ACTIVE"
                                AND item_of(H).account_id IN cycle_account_ids)  # 0 when no cycle

      uncollected_ratio_bps = 0 if deposited_cents == 0
                              else floor(10000 * uncollected_cents / deposited_cents)

      raw = (CYCLE_BASE[cycle_length] if cycle_length > 0 else 0)
          + VELOCITY_WEIGHT * qualifying_item_count
          + round_half_up(UNCOLLECTED_WEIGHT * uncollected_ratio_bps / 10000)
      kiting_score = min(100, raw)
      detected     = (kiting_score >= KITING_OPEN_THRESHOLD)
    input_set: "Only CHECK items with a non-null drawee_account_id and deposit_at inside the half-open window are edges. The status filter is the whole difference between the two variants. uncollected_cents is taken from ACTIVE holds only, regardless of variant, so a cleared item drops out of deposited_cents AND drops its hold out of uncollected_cents under STRICT but only drops its hold under INCLUSIVE."
    constants:
      CYCLE_MAX_DEPTH: 4
      CYCLE_BASE: { 2: 40, 3: 55, 4: 60 }
      VELOCITY_WEIGHT: 6
      UNCOLLECTED_WEIGHT: 30
      KITING_OPEN_THRESHOLD: 70
      QUALIFYING_STATUSES:
        STRICT: [PENDING]
        INCLUSIVE: [PENDING, CLEARED, RETURNED]
    precision: "integer score; uncollected_ratio_bps floored to whole basis points, the weighted term round_half_up to a whole point"
    variants:
      - name: STRICT
        when: "mode == \"STRICT\" on the scan request — the uncollected-funds view used for same-day float detection."
        difference: "Only DepositItem rows still in PENDING form edges. Settled items vanish from the graph, shrinking both qualifying_item_count and deposited_cents, which RAISES uncollected_ratio_bps while LOWERING the velocity term."
      - name: INCLUSIVE
        when: "mode == \"INCLUSIVE\" on the scan request — the historical-pattern view used for case building."
        difference: "PENDING, CLEARED and RETURNED items all form edges, so settled circulation still counts toward velocity and toward deposited_cents. On identical data the two variants produce different kiting_score values and can land on opposite sides of KITING_OPEN_THRESHOLD."

  - name: charge_off_pricing
    trigger: "On POST /deposit-fraud/accounts/{id}/charge-offs, once, at proposal time. The stored figures are never re-priced."
    algorithm: tiered_pricing
    formula: |
      # The fee depends on the amount and the amount depends on the fee. The
      # dependency is broken by pinning the evaluation order below; the tier is
      # selected from base_net_cents, NEVER from net_charge_off_cents.
      # Step 1
      base_net_cents = gross_loss_cents - collateral_offset_cents
      if base_net_cents <= 0: reject with ERR_NO_NET_LOSS
      # Step 2 — tier selected from base_net_cents, both edges inclusive upper bounds
      fee_rate_bps = RECOVERY_FEE_TIER_1_BPS if base_net_cents <= RECOVERY_FEE_TIER_1_MAX_CENTS
                     else RECOVERY_FEE_TIER_2_BPS if base_net_cents <= RECOVERY_FEE_TIER_2_MAX_CENTS
                     else RECOVERY_FEE_TIER_3_BPS
      # Step 3
      recovery_fee_cents = round_half_up(base_net_cents * fee_rate_bps / 10000)
      # Step 4
      net_charge_off_cents = base_net_cents + recovery_fee_cents
      # Step 5 — derived on every read
      outstanding_loss_cents = net_charge_off_cents
                             - principal_recovered_cents
                             - fee_recovered_cents
    input_set: "gross_loss_cents and collateral_offset_cents are request inputs, not derived from account balances. The tier boundary comparison uses <= on the tier maximum, so a base_net_cents of exactly RECOVERY_FEE_TIER_1_MAX_CENTS stays in tier 1 even though the resulting net_charge_off_cents exceeds that maximum."
    constants:
      RECOVERY_FEE_TIER_1_MAX_CENTS: 100000
      RECOVERY_FEE_TIER_1_BPS: 500
      RECOVERY_FEE_TIER_2_MAX_CENTS: 500000
      RECOVERY_FEE_TIER_2_BPS: 350
      RECOVERY_FEE_TIER_3_BPS: 200
      RECOVERY_REFERRAL_MIN_CENTS: 25000
    precision: "round_half_up to whole cents, once, at step 3"

  - name: recovery_waterfall
    trigger: "On POST /deposit-fraud/charge-offs/{id}/recovery-postings."
    algorithm: waterfall_allocation
    formula: |
      remaining = amount_cents
      # Bucket 1 — the recovery agency's fee is made whole first
      fee_room       = CO.recovery_fee_cents - CO.fee_recovered_cents
      applied_fee    = min(remaining, fee_room)
      remaining     -= applied_fee
      # Bucket 2 — then principal
      principal_room      = CO.base_net_cents - CO.principal_recovered_cents
      applied_principal   = min(remaining, principal_room)
      remaining          -= applied_principal
      # Overflow — the whole posting is rejected, nothing is applied
      if remaining > 0: reject with ERR_RECOVERY_EXCEEDS_LOSS

      CO.fee_recovered_cents       += applied_fee
      CO.principal_recovered_cents += applied_principal
      A.charged_off_amount_cents   -= (applied_fee + applied_principal)
      CO.status = "RECOVERED_FULL" if CO.outstanding_loss_cents == 0
                  else "RECOVERED_PARTIAL"
    input_set: "Bucket order is fixed: fee before principal. A posting is all-or-nothing — if it cannot fit entirely inside the two remaining buckets, no field is mutated."
    constants:
      BUCKET_ORDER: [RECOVERY_FEE, PRINCIPAL]
    precision: "integer cents; no rounding occurs in this rule"

  - name: bsa_aggregate_amount
    trigger: "On POST /deposit-fraud/bsa-referrals/{id}/submit, frozen onto the referral."
    algorithm: aggregation
    formula: |
      account_set = { case.primary_account_id } UNION set(case.cycle_account_ids)
      aggregate_amount_cents = SUM(I.amount_cents
          for DepositItem I WHERE I.account_id IN account_set
                              AND I.status IN {"PENDING","RETURNED"})
    input_set: "CLEARED items are excluded. The account set is deduplicated. The value is captured at submit time and is NOT recomputed on adjudication, on resubmission of a different referral, or on any later item settlement; a resubmit of THIS referral re-freezes it."
    constants:
      INCLUDED_ITEM_STATUSES: [PENDING, RETURNED]
    precision: "integer cents"

  - name: account_funds_invariant
    trigger: "Evaluated as a postcondition of every endpoint that mutates DepositAccount balances: POST /deposit-fraud/accounts/{id}/deposit-items, POST /deposit-fraud/deposit-items/{id}/settle, POST /deposit-fraud/hold-override-reviews/{id}/execute, POST /deposit-fraud/charge-offs/{id}/book, POST /deposit-fraud/charge-offs/{id}/reverse."
    algorithm: constraint_propagation
    formula: |
      # Conserved quantity 1 — depositor funds
      A.available_balance_cents + A.held_amount_cents == A.ledger_balance_cents
      # and, across the compensating pair (deposit -> override execute -> settle
      # RETURNED), A.ledger_balance_cents returns to its exact pre-deposit value.

      # Conserved quantity 2 — recognised loss position
      net_bank_position_cents = A.ledger_balance_cents - A.charged_off_amount_cents
      # book leaves net_bank_position_cents unchanged
      #   (L - 0) -> ((L + N) - N)
      # reverse restores both terms to their pre-book values
      #   ((L + N) - N) -> (L - 0)
    input_set: "A.held_amount_cents is always the live sum over ACTIVE CheckHold rows on the account's items, never a stored counter allowed to drift."
    constants:
      TOLERANCE_CENTS: 0
    precision: "exact integer equality; no tolerance"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The supplied X-User-Role appears in the endpoint's roles list in the 1.5 table."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Every id in the request path resolves to a stored row, validated left to right."
    error_id: ERR_CUSTOMER_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_FUNDING_SOURCE_NOT_FOUND | ERR_DEPOSIT_ITEM_NOT_FOUND | ERR_CHECK_HOLD_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_FRAUD_CASE_NOT_FOUND | ERR_CHARGE_OFF_NOT_FOUND | ERR_SUBPOENA_NOT_FOUND | ERR_BSA_REFERRAL_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 10
    category: business_constraint
    check: "Request body carries every required field, every value matches its declared type, every enum value is a declared member, every *_cents field is an integer within its stated range, every datetime is ISO 8601 UTC, release_window_end_at is strictly after release_effective_at, preservation_end_at is strictly after preservation_start_at, response_due_at is strictly after the logical clock, and settle with outcome == RETURNED carries a return_reason while adjudicate with decision == RETURN carries a return_reason."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every endpoint that accepts a body"

  - priority: 12
    category: existence
    check: "Every entity id supplied in the request BODY resolves to a stored row: customer_id on account creation, from_account_id and to_account_id on link creation, drawee_account_id on deposit creation, primary_account_id on case creation."
    error_id: ERR_CUSTOMER_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "POST /deposit-fraud/accounts, POST /deposit-fraud/account-links, POST /deposit-fraud/accounts/{id}/deposit-items, POST /deposit-fraud/fraud-cases"

  - priority: 15
    category: auth
    check: "When X-User-Role is AccountHolder, X-User-ID equals the DepositAccount.customer_id of the account named in the path."
    error_id: ERR_NOT_ACCOUNT_OWNER
    http_status: 403
    applies_to: "GET /deposit-fraud/accounts/{id}, POST /deposit-fraud/accounts/{id}/step-up-response"

  - priority: 20
    category: state
    check: "expected_check_hold_version equals the current CheckHold.version."
    error_id: ERR_STALE_CHECK_HOLD_VERSION
    http_status: 412
    applies_to: "POST /deposit-fraud/check-holds/{id}/override-reviews"

  - priority: 20
    category: state
    check: "expected_account_version equals the current DepositAccount.version."
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /deposit-fraud/accounts/{id}/charge-offs"

  - priority: 30
    category: business_constraint
    check: "from_account_id differs from to_account_id."
    error_id: ERR_SELF_LINK
    http_status: 422
    applies_to: "POST /deposit-fraud/account-links"

  - priority: 32
    category: business_constraint
    check: "No AccountLink already exists with the same (from_account_id, to_account_id, link_type) triple."
    error_id: ERR_DUPLICATE_LINK
    http_status: 409
    applies_to: "POST /deposit-fraud/account-links"

  - priority: 34
    category: business_constraint
    check: "No FraudCase with the same case_type and primary_account_id already has status IN {OPENED, INVESTIGATING, SUBSTANTIATED}. On the kiting scan this check runs only when the computed kiting_score reaches KITING_OPEN_THRESHOLD."
    error_id: ERR_DUPLICATE_OPEN_CASE
    http_status: 409
    applies_to: "POST /deposit-fraud/fraud-cases, POST /deposit-fraud/accounts/{id}/kiting-scan"

  - priority: 40
    category: state
    check: "The DepositAccount named in the path has lifecycle_status == ACTIVE."
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /deposit-fraud/accounts/{id}/deposit-items"

  - priority: 40
    category: state
    check: "The DepositAccount named in the path has lifecycle_status IN {ACTIVE, RESTRICTED}."
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /deposit-fraud/accounts/{id}/kiting-scan, POST /deposit-fraud/fraud-cases"

  - priority: 40
    category: state
    check: "The FundingSource is in a state that accepts the requested operation: verification-attempts requires verification_status IN {MICRO_DEPOSIT_SENT, FAILED_ATTEMPT}; resend requires verification_status == FAILED_ATTEMPT and total_attempt_count < FUNDING_MAX_TOTAL_ATTEMPTS."
    error_id: ERR_FUNDING_INVALID_STATE
    http_status: 409
    applies_to: "POST /deposit-fraud/funding-sources/{id}/verification-attempts, POST /deposit-fraud/funding-sources/{id}/resend"

  - priority: 40
    category: state
    check: "The DepositItem has status == PENDING."
    error_id: ERR_ITEM_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /deposit-fraud/deposit-items/{id}/settle"

  - priority: 40
    category: state
    check: "The CheckHold has status == ACTIVE."
    error_id: ERR_HOLD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /deposit-fraud/check-holds/{id}/override-reviews, POST /deposit-fraud/hold-override-reviews/{id}/submit, POST /deposit-fraud/hold-override-reviews/{id}/decide, POST /deposit-fraud/hold-override-reviews/{id}/execute"

  - priority: 40
    category: state
    check: "The HoldOverrideReview has status == SUBMITTED."
    error_id: ERR_REVIEW_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /deposit-fraud/hold-override-reviews/{id}/decide"

  - priority: 40
    category: state
    check: "The HoldOverrideReview has status == APPROVED."
    error_id: ERR_REVIEW_NOT_APPROVED
    http_status: 409
    applies_to: "POST /deposit-fraud/hold-override-reviews/{id}/execute"

  - priority: 40
    category: state
    check: "The HoldOverrideReview has status IN {DRAFT, RETURNED_FOR_INFO}."
    error_id: ERR_REVIEW_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /deposit-fraud/hold-override-reviews/{id}/submit"

  - priority: 40
    category: state
    check: "The FraudCase is in the state the requested operation expects: advance requires OPENED; disposition with SUBSTANTIATE or UNSUBSTANTIATE requires INVESTIGATING; disposition with REOPEN requires UNSUBSTANTIATED; close requires status IN {SUBSTANTIATED, UNSUBSTANTIATED}."
    error_id: ERR_CASE_INVALID_STATE
    http_status: 409
    applies_to: "POST /deposit-fraud/fraud-cases/{id}/advance, POST /deposit-fraud/fraud-cases/{id}/disposition, POST /deposit-fraud/fraud-cases/{id}/close"

  - priority: 40
    category: state
    check: "The FraudCase has status == SUBSTANTIATED."
    error_id: ERR_CASE_NOT_SUBSTANTIATED
    http_status: 409
    applies_to: "POST /deposit-fraud/fraud-cases/{id}/bsa-referrals, POST /deposit-fraud/bsa-referrals/{id}/submit"

  - priority: 40
    category: state
    check: "The BsaReferral is in the state the requested operation expects: submit requires status IN {DRAFT, RETURNED}; adjudicate requires status == SUBMITTED."
    error_id: ERR_REFERRAL_INVALID_STATE
    http_status: 409
    applies_to: "POST /deposit-fraud/bsa-referrals/{id}/submit, POST /deposit-fraud/bsa-referrals/{id}/adjudicate"

  - priority: 40
    category: state
    check: "The ChargeOff is in the state the requested operation expects: approve requires PROPOSED; book requires APPROVED; recovery-postings requires status IN {REFERRED_TO_RECOVERY, RECOVERED_PARTIAL}; reverse requires status IN {BOOKED, REFERRED_TO_RECOVERY, RECOVERED_PARTIAL, RECOVERED_FULL}. A reverse against RECOVERED_PARTIAL or RECOVERED_FULL passes this state gate on purpose so that the recovery guard at priority 52 is the rule that reports the refusal."
    error_id: ERR_CHARGE_OFF_INVALID_STATE
    http_status: 409
    applies_to: "POST /deposit-fraud/charge-offs/{id}/approve, POST /deposit-fraud/charge-offs/{id}/book, POST /deposit-fraud/charge-offs/{id}/recovery-postings, POST /deposit-fraud/charge-offs/{id}/reverse"

  - priority: 40
    category: state
    check: "The SubpoenaRequest is in the state the requested operation expects: legal-review requires RECEIVED; respond requires UNDER_LEGAL_REVIEW."
    error_id: ERR_SUBPOENA_INVALID_STATE
    http_status: 409
    applies_to: "POST /deposit-fraud/subpoenas/{id}/legal-review, POST /deposit-fraud/subpoenas/{id}/respond"

  - priority: 41
    category: state
    check: "The DepositAccount has access_posture != LOCKED."
    error_id: ERR_ACCOUNT_ACCESS_LOCKED
    http_status: 409
    applies_to: "POST /deposit-fraud/accounts/{id}/deposit-items, POST /deposit-fraud/accounts/{id}/step-up-response"

  - priority: 43
    category: state
    check: "The DepositAccount has access_posture == STEP_UP_REQUIRED. Evaluated strictly after the LOCKED check at priority 41, so a LOCKED account yields ERR_ACCOUNT_ACCESS_LOCKED rather than ERR_STEP_UP_NOT_REQUIRED."
    error_id: ERR_STEP_UP_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /deposit-fraud/accounts/{id}/step-up-response"

  - priority: 42
    category: state
    check: "The DepositAccount named in the path has lifecycle_status == CLOSED before a charge-off may be booked."
    error_id: ERR_ACCOUNT_NOT_CLOSED
    http_status: 409
    applies_to: "POST /deposit-fraud/charge-offs/{id}/book"

  - priority: 50
    category: business_safety
    check: "Segregation of duties: X-User-ID differs from HoldOverrideReview.prepared_by_user_id when recording a decision, and differs from SubpoenaRequest.legal_reviewed_by_user_id when signing a subpoena response."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /deposit-fraud/hold-override-reviews/{id}/decide, POST /deposit-fraud/subpoenas/{id}/respond"

  - priority: 50
    category: business_safety
    check: "The owning Customer has preservation_hold_active == false before a fraud case may be closed or an account may be driven to CLOSED."
    error_id: ERR_PRESERVATION_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /deposit-fraud/fraud-cases/{id}/close"

  - priority: 52
    category: business_safety
    check: "ChargeOff.principal_recovered_cents == 0 AND ChargeOff.fee_recovered_cents == 0 before a booked charge-off may be reversed."
    error_id: ERR_RECOVERY_ALREADY_POSTED
    http_status: 409
    applies_to: "POST /deposit-fraud/charge-offs/{id}/reverse"

  - priority: 55
    category: business_temporal
    check: "The logical clock is strictly before CheckHold.hold_release_at when an early-release review is created; a matured hold no longer admits an override."
    error_id: ERR_HOLD_ALREADY_MATURED
    http_status: 422
    applies_to: "POST /deposit-fraud/check-holds/{id}/override-reviews"

  - priority: 56
    category: business_temporal
    check: "The half-open early-release window [release_effective_at, release_window_end_at) does not overlap the window of any other HoldOverrideReview on the SAME DepositAccount whose status IS IN {DRAFT, SUBMITTED, RETURNED_FOR_INFO, APPROVED, EXECUTED}. Touching endpoints do not overlap: an existing window ending at T and a new window starting at T are both accepted."
    error_id: ERR_RELEASE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /deposit-fraud/check-holds/{id}/override-reviews"

  - priority: 56
    category: business_temporal
    check: "The closed preservation window [preservation_start_at, preservation_end_at] is separated from every other SubpoenaRequest window on the SAME Customer whose status IS IN {RECEIVED, UNDER_LEGAL_REVIEW, PRODUCED} by at least PRESERVATION_BUFFER_DAYS (3) calendar days on whichever side it falls; formally the request is accepted only when new_start >= existing_end + 3 days OR new_end + 3 days <= existing_start. A gap of exactly 3 days is accepted; anything shorter, including touching or nested windows, is rejected."
    error_id: ERR_PRESERVATION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /deposit-fraud/customers/{id}/subpoenas"

  - priority: 57
    category: business_temporal
    check: "When the logical clock is strictly after SubpoenaRequest.response_due_at, the response body carries a non-blank late_justification."
    error_id: ERR_LATE_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /deposit-fraud/subpoenas/{id}/respond"

  - priority: 58
    category: business_referential
    check: "A FraudCase whose status immediately before the close call is SUBSTANTIATED has at least one BsaReferral with status == ACCEPTED."
    error_id: ERR_BSA_REFERRAL_REQUIRED
    http_status: 409
    applies_to: "POST /deposit-fraud/fraud-cases/{id}/close"

  - priority: 62
    category: business_fiscal
    check: "requested_release_cents is less than or equal to the referenced CheckHold's current held_amount_cents."
    error_id: ERR_RELEASE_EXCEEDS_HOLD
    http_status: 422
    applies_to: "POST /deposit-fraud/check-holds/{id}/override-reviews, POST /deposit-fraud/hold-override-reviews/{id}/execute"

  - priority: 62
    category: business_fiscal
    check: "HoldOverrideReview.adjusted_exposure_cents is less than or equal to SUPERVISOR_APPROVAL_LIMIT_CENTS (500000)."
    error_id: ERR_EXPOSURE_EXCEEDS_AUTHORITY
    http_status: 422
    applies_to: "POST /deposit-fraud/hold-override-reviews/{id}/decide when decision == APPROVE, POST /deposit-fraud/hold-override-reviews/{id}/execute"

  - priority: 62
    category: business_fiscal
    check: "gross_loss_cents - collateral_offset_cents is strictly greater than zero."
    error_id: ERR_NO_NET_LOSS
    http_status: 422
    applies_to: "POST /deposit-fraud/accounts/{id}/charge-offs"

  - priority: 62
    category: business_fiscal
    check: "The recovery posting fits entirely inside the remaining fee bucket plus the remaining principal bucket."
    error_id: ERR_RECOVERY_EXCEEDS_LOSS
    http_status: 422
    applies_to: "POST /deposit-fraud/charge-offs/{id}/recovery-postings"

# ---------------------------------------------------------------------------
# Cross-cutting constants referenced by 1.2 / 1.4 but not owned by any single
# calculation in 1.3.
# ---------------------------------------------------------------------------
global_constants:
  FUNDING_MAX_TOTAL_ATTEMPTS: 5      # lifetime verification attempts before a FundingSource is BLOCKED
  MULE_CLOSURE_NOTICE_DAYS: 10       # days between MULE substantiation and closure_scheduled_at
  PRESERVATION_BUFFER_DAYS: 3        # mandatory gap between two preservation windows on one Customer
  DEFAULT_LOGICAL_CLOCK_UTC: "2026-08-01T00:00:00Z"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  # ---- Customers ---------------------------------------------------------
  - method: POST
    path: "/deposit-fraud/customers"
    description: "Register a depositor."
    roles: [OperationsAdmin]
    code: 201
    input: ["legal_name", "tin_last4", "kyc_tier?", "watchlist_hit?"]
    output: Customer
    side_effects:
      - "Creates a Customer with preservation_hold_active false and open_fraud_case_count 0."

  - method: GET
    path: "/deposit-fraud/customers/{id}"
    description: "Read one depositor, with preservation_hold_active and open_fraud_case_count recomputed against the logical clock."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor, BsaOfficer, LegalCounsel]
    code: 200
    input: []
    output: Customer
    side_effects:
      - "Recomputes preservation_hold_active and open_fraud_case_count for the response; no persisted mutation."

  - method: GET
    path: "/deposit-fraud/customers/{id}/accounts"
    description: "List every DepositAccount owned by this customer. Reverse-reachability channel for DepositAccount.customer_id."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor, BsaOfficer, LegalCounsel]
    code: 200
    input: ["limit?", "offset?", "lifecycle_status?"]
    output: DepositAccount[]
    side_effects: []

  - method: GET
    path: "/deposit-fraud/customers/{id}/subpoenas"
    description: "List every SubpoenaRequest against this customer. Reverse-reachability channel for SubpoenaRequest.customer_id."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor, BsaOfficer, LegalCounsel]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: SubpoenaRequest[]
    side_effects: []

  - method: POST
    path: "/deposit-fraud/customers/{id}/subpoenas"
    description: "Log incoming law-enforcement process against a customer and claim a record-preservation window."
    roles: [LegalCounsel]
    code: 201
    input: ["issuing_agency", "docket_number", "response_due_at", "preservation_start_at", "preservation_end_at"]
    output: SubpoenaRequest
    side_effects:
      - "Stamps received_at from the logical clock and sets status to RECEIVED."
      - "Enforces the 3-calendar-day preservation buffer against every other RECEIVED / UNDER_LEGAL_REVIEW / PRODUCED window on this customer."
      - "Because a RECEIVED subpoena now exists, Customer.preservation_hold_active becomes true."

  # ---- Accounts ----------------------------------------------------------
  - method: POST
    path: "/deposit-fraud/accounts"
    description: "Open a deposit account and score it with the PROVISIONAL_AT_OPEN variant of new_account_risk_score."
    roles: [OperationsAdmin]
    code: 201
    input: ["customer_id", "product_type", "open_channel"]
    output: DepositAccount
    side_effects:
      - "Stamps opened_at from the logical clock; lifecycle_status PENDING_FUNDING, access_posture NORMAL."
      - "Runs new_account_risk_score under the PROVISIONAL_AT_OPEN variant, writing risk_score, risk_band and risk_score_basis = PROVISIONAL_AT_OPEN."

  - method: GET
    path: "/deposit-fraud/accounts/{id}"
    description: "Read one deposit account including both state dimensions, live balances and the current risk and takeover scores."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor, BsaOfficer, LegalCounsel, AccountHolder]
    code: 200
    input: []
    output: DepositAccount
    side_effects:
      - "Recomputes held_amount_cents from ACTIVE holds for the response."

  - method: POST
    path: "/deposit-fraud/accounts/{id}/funding-sources"
    description: "Declare an external funding source and send trial deposits. The response carries the minted micro_deposit_cents so the caller can complete verification."
    roles: [OperationsAdmin]
    code: 201
    input: ["source_type", "routing_last4"]
    output: FundingSource
    side_effects:
      - "Mints micro_deposit_cents in 1..99 and advances verification_status DECLARED -> MICRO_DEPOSIT_SENT inside this request."
      - "Re-runs new_account_risk_score under the REFRESHED variant for the account (funding_state becomes PENDING)."

  - method: GET
    path: "/deposit-fraud/accounts/{id}/funding-sources"
    description: "List funding sources declared for this account. Reverse-reachability channel for FundingSource.account_id."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor]
    code: 200
    input: ["limit?", "offset?", "verification_status?"]
    output: FundingSource[]
    side_effects: []

  - method: POST
    path: "/deposit-fraud/funding-sources/{id}/verification-attempts"
    description: "Submit a trial-deposit amount. A match verifies the source and activates the account; a mismatch is a state transition returned with HTTP 200, not an error. The submitted value must be an integer in 0..99999; 0 can never match a minted amount."
    roles: [OperationsAdmin]
    code: 200
    input: ["micro_deposit_cents"]
    output: FundingSource
    side_effects:
      - "Increments attempt_count and total_attempt_count by 1."
      - "On a match: verification_status -> VERIFIED, verified_at stamped, the owning DepositAccount transitions PENDING_FUNDING -> ACTIVE, and new_account_risk_score is re-run under the REFRESHED variant."
      - "On a mismatch: verification_status -> FAILED_ATTEMPT, or -> BLOCKED when total_attempt_count reaches FUNDING_MAX_TOTAL_ATTEMPTS."

  - method: POST
    path: "/deposit-fraud/funding-sources/{id}/resend"
    description: "Re-send trial deposits after a failed attempt, minting a fresh secret and resetting the per-secret attempt counter."
    roles: [OperationsAdmin]
    code: 200
    input: []
    output: FundingSource
    side_effects:
      - "Mints a fresh micro_deposit_cents, resets attempt_count to 0, leaves total_attempt_count untouched and moves verification_status FAILED_ATTEMPT -> MICRO_DEPOSIT_SENT."
      - "Re-runs new_account_risk_score under the REFRESHED variant."

  - method: POST
    path: "/deposit-fraud/account-links"
    description: "Record a directed association edge between two deposit accounts."
    roles: [FraudAnalyst, OperationsAdmin]
    code: 201
    input: ["from_account_id", "to_account_id", "link_type", "confidence_bps"]
    output: AccountLink
    side_effects:
      - "Computes is_risk_bearing from link_type and confidence_bps."
      - "Re-runs new_account_risk_score under the REFRESHED variant for BOTH the from and the to account, rewriting risk_score, risk_band and risk_score_basis on each."

  - method: GET
    path: "/deposit-fraud/accounts/{id}/links"
    description: "List every AccountLink whose from_account_id or to_account_id is this account. Reverse-reachability channel for both AccountLink foreign keys."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor]
    code: 200
    input: ["limit?", "offset?", "link_type?"]
    output: AccountLink[]
    side_effects: []

  - method: POST
    path: "/deposit-fraud/accounts/{id}/deposit-items"
    description: "Take a deposit, run check_hold_schedule and post the resulting balances."
    roles: [OperationsAdmin]
    code: 201
    input: ["item_type", "amount_cents", "drawee_account_id?"]
    output: DepositItem
    side_effects:
      - "Stamps deposit_at from the logical clock and status PENDING."
      - "Runs check_hold_schedule, writing immediate_credit_cents and held_cents and minting a CheckHold with status ACTIVE when held_cents > 0."
      - "Adds amount_cents to DepositAccount.ledger_balance_cents and immediate_credit_cents to available_balance_cents, then recomputes held_amount_cents."
      - "Because held_amount_cents changed, every FraudCase with status IN {OPENED, INVESTIGATING} covering the account has exposure_at_risk_cents recomputed."

  - method: GET
    path: "/deposit-fraud/accounts/{id}/deposit-items"
    description: "List deposits taken into this account. Reverse-reachability channel for DepositItem.account_id and DepositItem.drawee_account_id (an item appears here when either foreign key names this account)."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor, BsaOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "account_role?"]
    output: DepositItem[]
    side_effects: []

  - method: GET
    path: "/deposit-fraud/deposit-items/{id}"
    description: "Read one deposited item."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor, BsaOfficer]
    code: 200
    input: []
    output: DepositItem
    side_effects: []

  - method: POST
    path: "/deposit-fraud/deposit-items/{id}/settle"
    description: "Post the collection outcome of a deposited item and unwind or charge back its hold."
    roles: [OperationsAdmin]
    code: 200
    input: ["outcome", "return_reason?"]
    output: DepositItem
    side_effects:
      - "CLEARED: every ACTIVE CheckHold on the item -> RELEASED; available_balance_cents rises by the released total; ledger_balance_cents unchanged; when drawee_account_id is set, the drawee's ledger_balance_cents and available_balance_cents each fall by amount_cents."
      - "RETURNED: every ACTIVE CheckHold on the item -> CHARGED_BACK; ledger_balance_cents falls by amount_cents and available_balance_cents falls by (amount_cents minus the charged-back held total), which may drive it negative; the drawee is untouched."
      - "Recomputes exposure_at_risk_cents on every FraudCase with status IN {OPENED, INVESTIGATING} covering any affected account."

  - method: GET
    path: "/deposit-fraud/deposit-items/{id}/holds"
    description: "List the check holds placed on this item. Reverse-reachability channel for CheckHold.deposit_item_id."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CheckHold[]
    side_effects: []

  - method: GET
    path: "/deposit-fraud/check-holds/{id}"
    description: "Read one check hold, including its current held_amount_cents and version."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor]
    code: 200
    input: []
    output: CheckHold
    side_effects: []

  # ---- Hold override review ---------------------------------------------
  - method: POST
    path: "/deposit-fraud/check-holds/{id}/override-reviews"
    description: "Open an early-release review against a check hold, claiming a half-open release window on the account. Requires the caller's last-observed CheckHold.version."
    roles: [FraudAnalyst, FraudSupervisor]
    code: 201
    input: ["requested_release_cents", "release_effective_at", "release_window_end_at", "justification", "expected_check_hold_version"]
    output: HoldOverrideReview
    side_effects:
      - "Rejects the request with ERR_STALE_CHECK_HOLD_VERSION when expected_check_hold_version does not equal the hold's current version."
      - "Increments CheckHold.version by 1 on success."
      - "Moves every other HoldOverrideReview on this hold whose status IS IN {DRAFT, SUBMITTED, RETURNED_FOR_INFO, APPROVED} to SUPERSEDED."
      - "Records prepared_by_user_id from X-User-ID and runs hold_override_loss_exposure to write loss_exposure_cents and adjusted_exposure_cents."

  - method: GET
    path: "/deposit-fraud/check-holds/{id}/override-reviews"
    description: "List the override reviews raised against this hold. Reverse-reachability channel for HoldOverrideReview.check_hold_id."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: HoldOverrideReview[]
    side_effects: []

  - method: GET
    path: "/deposit-fraud/hold-override-reviews/{id}"
    description: "Read one override review including both exposure figures."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor]
    code: 200
    input: []
    output: HoldOverrideReview
    side_effects: []

  - method: POST
    path: "/deposit-fraud/hold-override-reviews/{id}/submit"
    description: "Send a draft or returned review to the supervisor queue."
    roles: [FraudAnalyst, FraudSupervisor]
    code: 200
    input: []
    output: HoldOverrideReview
    side_effects:
      - "Sets status SUBMITTED and submitted_at; increments revision_count when the prior status was RETURNED_FOR_INFO."
      - "Re-runs hold_override_loss_exposure, rewriting loss_exposure_cents and adjusted_exposure_cents."

  - method: POST
    path: "/deposit-fraud/hold-override-reviews/{id}/decide"
    description: "Record the supervisor decision: APPROVE, DENY or RETURN_FOR_INFO. The deciding operator may not be the one who prepared the review."
    roles: [FraudSupervisor]
    code: 200
    input: ["decision", "decision_note?"]
    output: HoldOverrideReview
    side_effects:
      - "Sets status to APPROVED, DENIED or RETURNED_FOR_INFO, stamps decided_by_user_id, decided_at and decision_note."
      - "On APPROVE, rejects with ERR_EXPOSURE_EXCEEDS_AUTHORITY when adjusted_exposure_cents exceeds SUPERVISOR_APPROVAL_LIMIT_CENTS."

  - method: POST
    path: "/deposit-fraud/hold-override-reviews/{id}/execute"
    description: "Release the approved amount from the hold. Drives the four-hop cascade review -> hold -> account -> fraud case."
    roles: [FraudSupervisor]
    code: 200
    input: []
    output: HoldOverrideReview
    side_effects:
      - "Hop 1: review status APPROVED -> EXECUTED, executed_at stamped."
      - "Hop 2: because the review executed, the CheckHold's held_amount_cents falls by requested_release_cents and the hold moves ACTIVE -> OVERRIDDEN once that reaches 0."
      - "Hop 3: because the hold's held_amount_cents changed, the DepositAccount's available_balance_cents rises by requested_release_cents and held_amount_cents is recomputed; ledger_balance_cents is unchanged."
      - "Hop 4: because the account's held_amount_cents changed, every FraudCase with status IN {OPENED, INVESTIGATING} whose primary_account_id is the account or whose cycle_account_ids contains it has exposure_at_risk_cents recomputed."
      - "Increments version by 1 on the review, the hold, the account and every recomputed case."

  # ---- Account takeover --------------------------------------------------
  - method: POST
    path: "/deposit-fraud/accounts/{id}/access-review"
    description: "Merge account-takeover indicator codes onto an account, rescore it and move the access posture. reset_posture is the supervisor override that lifts a LOCKED account back to STEP_UP_REQUIRED."
    roles: [FraudAnalyst, FraudSupervisor]
    code: 200
    input: ["indicator_codes", "reset_posture?"]
    output: DepositAccount
    side_effects:
      - "Merges indicator_codes into ato_indicator_codes as a distinct ascending set; duplicates add no weight."
      - "Re-runs ato_indicator_score, rewriting ato_score and moving access_posture per its threshold ladder."
      - "reset_posture == true is honoured only by FraudSupervisor and only when access_posture == LOCKED; it sets step_up_failure_count to 0 and access_posture to STEP_UP_REQUIRED."
      - "Re-runs new_account_risk_score under the REFRESHED variant."

  - method: POST
    path: "/deposit-fraud/accounts/{id}/step-up-response"
    description: "Answer the step-up challenge. The correct challenge_answer is the owning Customer's tin_last4."
    roles: [AccountHolder]
    code: 200
    input: ["challenge_answer"]
    output: DepositAccount
    side_effects:
      - "Correct answer: access_posture -> NORMAL, step_up_failure_count -> 0, ato_indicator_codes cleared to [], ato_score -> 0."
      - "Incorrect answer: step_up_failure_count increments; access_posture -> LOCKED once it reaches STEP_UP_MAX_FAILURES, otherwise it stays STEP_UP_REQUIRED."

  # ---- Kiting detection --------------------------------------------------
  - method: POST
    path: "/deposit-fraud/accounts/{id}/kiting-scan"
    description: "Traverse the on-us circulation graph from this account over a half-open window and score the shortest cycle. mode selects the STRICT or INCLUSIVE qualifying-status variant."
    roles: [FraudAnalyst]
    code: 200
    input: ["mode", "window_start_at", "window_end_at"]
    output: "{ kiting_score: integer, cycle_length: integer, cycle_account_ids: string[], qualifying_item_count: integer, deposited_cents: integer, uncollected_cents: integer, uncollected_ratio_bps: integer, detected: boolean, fraud_case_id: string }"
    side_effects:
      - "Runs kiting_cycle_score under the requested variant and returns every intermediate figure."
      - "When detected is true, creates a FraudCase with case_type KITING, detection_source KITING_SCAN, status OPENED and the scan's kiting_score, scan_mode and cycle_account_ids copied onto it, and returns its id as fraud_case_id."
      - "When detected is true, the scanned DepositAccount transitions ACTIVE -> RESTRICTED (an account already RESTRICTED stays RESTRICTED)."
      - "When detected is false, no case is created, no account is transitioned and fraud_case_id is null."
      - "Rejects with ERR_DUPLICATE_OPEN_CASE when detected is true and a KITING case on this account already has status IN {OPENED, INVESTIGATING, SUBSTANTIATED}."

  # ---- Fraud cases -------------------------------------------------------
  - method: POST
    path: "/deposit-fraud/fraud-cases"
    description: "Open an investigation manually. Mule cases are always opened this way; kiting cases are normally cascaded open by a scan."
    roles: [FraudAnalyst]
    code: 201
    input: ["primary_account_id", "case_type"]
    output: FraudCase
    side_effects:
      - "Creates the case with status OPENED and detection_source ANALYST_MANUAL; kiting_score, scan_mode stay null and cycle_account_ids stays empty."
      - "Transitions the primary DepositAccount ACTIVE -> RESTRICTED."
      - "Computes exposure_at_risk_cents from the primary account's held_amount_cents."

  - method: GET
    path: "/deposit-fraud/fraud-cases/{id}"
    description: "Read one fraud case."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor, BsaOfficer, LegalCounsel]
    code: 200
    input: []
    output: FraudCase
    side_effects: []

  - method: GET
    path: "/deposit-fraud/accounts/{id}/fraud-cases"
    description: "List the fraud cases opened against this account. Reverse-reachability channel for FraudCase.primary_account_id."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor, BsaOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "case_type?"]
    output: FraudCase[]
    side_effects: []

  - method: POST
    path: "/deposit-fraud/fraud-cases/{id}/advance"
    description: "Move a newly opened case into active investigation."
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: FraudCase
    side_effects:
      - "Sets status OPENED -> INVESTIGATING and recomputes exposure_at_risk_cents."

  - method: POST
    path: "/deposit-fraud/fraud-cases/{id}/disposition"
    description: "Record the investigation outcome: SUBSTANTIATE, UNSUBSTANTIATE or REOPEN. Substantiation cascades differently for MULE and KITING cases."
    roles: [FraudSupervisor]
    code: 200
    input: ["decision", "disposition_note?"]
    output: FraudCase
    side_effects:
      - "SUBSTANTIATE + MULE: hop 1 case -> SUBSTANTIATED; hop 2 account forced to RESTRICTED with closure_scheduled_at = logical clock + MULE_CLOSURE_NOTICE_DAYS days and closure_reason MULE_SUBSTANTIATED; hop 3 every ACTIVE CheckHold on the account retyped to EXCEPTION_FRAUD with hold_release_at = that closure_scheduled_at; hop 4 every HoldOverrideReview against those holds with status IN {DRAFT, SUBMITTED, RETURNED_FOR_INFO, APPROVED} -> SUPERSEDED."
      - "SUBSTANTIATE + KITING: case -> SUBSTANTIATED and the account forced to RESTRICTED; closure_scheduled_at, closure_reason, hold types and override reviews are left untouched."
      - "UNSUBSTANTIATE: case -> UNSUBSTANTIATED; the account returns RESTRICTED -> ACTIVE with closure fields cleared when no other case on it is OPENED, INVESTIGATING or SUBSTANTIATED."
      - "REOPEN: case UNSUBSTANTIATED -> INVESTIGATING, reopen_count incremented, account ACTIVE -> RESTRICTED."

  - method: POST
    path: "/deposit-fraud/fraud-cases/{id}/close"
    description: "Close a disposed case and, when it was substantiated, run the account-closure procedure."
    roles: [FraudSupervisor]
    code: 200
    input: []
    output: FraudCase
    side_effects:
      - "Sets status to CLOSED and closed_at."
      - "When the pre-call status was SUBSTANTIATED, the primary DepositAccount transitions RESTRICTED -> CLOSED with closure_reason MULE_SUBSTANTIATED or KITING_SUBSTANTIATED according to case_type."
      - "When the pre-call status was UNSUBSTANTIATED, no account transition occurs and no BsaReferral is required."

  # ---- BSA referral ------------------------------------------------------
  - method: POST
    path: "/deposit-fraud/fraud-cases/{id}/bsa-referrals"
    description: "Draft a suspicious-activity referral against a substantiated case."
    roles: [FraudAnalyst]
    code: 201
    input: ["narrative", "suspected_activity_code"]
    output: BsaReferral
    side_effects:
      - "Creates the referral in DRAFT with drafted_by_user_id from X-User-ID and aggregate_amount_cents 0."

  - method: GET
    path: "/deposit-fraud/fraud-cases/{id}/bsa-referrals"
    description: "List the referrals raised from this case. Reverse-reachability channel for BsaReferral.fraud_case_id."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor, BsaOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: BsaReferral[]
    side_effects: []

  - method: POST
    path: "/deposit-fraud/bsa-referrals/{id}/submit"
    description: "File a drafted or returned referral with the BSA unit and freeze its aggregate amount."
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: BsaReferral
    side_effects:
      - "Sets status to SUBMITTED and submitted_at; increments revision_count when the prior status was RETURNED."
      - "Runs bsa_aggregate_amount and freezes aggregate_amount_cents onto the referral."

  - method: POST
    path: "/deposit-fraud/bsa-referrals/{id}/adjudicate"
    description: "BSA unit accepts or returns a filed referral."
    roles: [BsaOfficer]
    code: 200
    input: ["decision", "return_reason?"]
    output: BsaReferral
    side_effects:
      - "ACCEPT: status -> ACCEPTED, adjudicated_by_user_id and adjudicated_at stamped; the parent case becomes closable."
      - "RETURN: status -> RETURNED with return_reason recorded; the referral may be resubmitted."

  # ---- Charge-off and recovery -------------------------------------------
  - method: POST
    path: "/deposit-fraud/accounts/{id}/charge-offs"
    description: "Propose a deposit-loss write-off. Requires the caller's last-observed DepositAccount.version; a new proposal supersedes any PROPOSED predecessor on the same account."
    roles: [FraudAnalyst]
    code: 201
    input: ["gross_loss_cents", "collateral_offset_cents?", "expected_account_version"]
    output: ChargeOff
    side_effects:
      - "Rejects the request with ERR_STALE_ACCOUNT_VERSION when expected_account_version does not equal the account's current version."
      - "Increments DepositAccount.version by 1 on success."
      - "Moves any existing ChargeOff on this account with status == PROPOSED to SUPERSEDED."
      - "Runs charge_off_pricing to write base_net_cents, recovery_fee_cents, net_charge_off_cents and outstanding_loss_cents."

  - method: GET
    path: "/deposit-fraud/accounts/{id}/charge-offs"
    description: "List the charge-offs proposed against this account. Reverse-reachability channel for ChargeOff.account_id."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ChargeOff[]
    side_effects: []

  - method: GET
    path: "/deposit-fraud/charge-offs/{id}"
    description: "Read one charge-off including its recovery position."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor]
    code: 200
    input: []
    output: ChargeOff
    side_effects: []

  - method: POST
    path: "/deposit-fraud/charge-offs/{id}/approve"
    description: "Supervisor approves a proposed write-off."
    roles: [FraudSupervisor]
    code: 200
    input: []
    output: ChargeOff
    side_effects:
      - "Sets status PROPOSED -> APPROVED and approved_by_user_id to X-User-ID."

  - method: POST
    path: "/deposit-fraud/charge-offs/{id}/book"
    description: "Book an approved write-off against a closed account and, above the referral threshold, refer it to recovery in the same request."
    roles: [OperationsAdmin]
    code: 200
    input: []
    output: ChargeOff
    side_effects:
      - "Requires the account's lifecycle_status == CLOSED."
      - "Snapshots the account's ledger_balance_cents into ledger_balance_before_book_cents, adds net_charge_off_cents to the account's ledger_balance_cents and available_balance_cents, sets charged_off_amount_cents to net_charge_off_cents and lifecycle_status to CHARGED_OFF."
      - "Sets status to BOOKED, then to REFERRED_TO_RECOVERY within the same request when net_charge_off_cents >= RECOVERY_REFERRAL_MIN_CENTS."

  - method: POST
    path: "/deposit-fraud/charge-offs/{id}/recovery-postings"
    description: "Post a recovery receipt through the fee-then-principal waterfall."
    roles: [OperationsAdmin]
    code: 200
    input: ["amount_cents"]
    output: ChargeOff
    side_effects:
      - "Runs recovery_waterfall; the posting is all-or-nothing and is rejected with ERR_RECOVERY_EXCEEDS_LOSS when it does not fit."
      - "Reduces DepositAccount.charged_off_amount_cents by the applied total and sets status to RECOVERED_PARTIAL or RECOVERED_FULL."

  - method: POST
    path: "/deposit-fraud/charge-offs/{id}/reverse"
    description: "Reverse a booked write-off that has attracted no recovery, restoring the account's ledger exactly. A charge-off that has already taken a recovery posting passes the state gate but is refused by the recovery guard with ERR_RECOVERY_ALREADY_POSTED."
    roles: [FraudSupervisor]
    code: 200
    input: ["reversal_reason"]
    output: ChargeOff
    side_effects:
      - "Sets status to REVERSED and reversed_at."
      - "Restores DepositAccount.ledger_balance_cents to ledger_balance_before_book_cents, subtracts net_charge_off_cents from available_balance_cents, zeroes charged_off_amount_cents and moves lifecycle_status CHARGED_OFF -> CLOSED."

  # ---- Subpoena handling -------------------------------------------------
  - method: GET
    path: "/deposit-fraud/subpoenas/{id}"
    description: "Read one subpoena request."
    roles: [OperationsAdmin, FraudAnalyst, FraudSupervisor, LegalCounsel]
    code: 200
    input: []
    output: SubpoenaRequest
    side_effects: []

  - method: POST
    path: "/deposit-fraud/subpoenas/{id}/legal-review"
    description: "Counsel takes the process under legal review."
    roles: [LegalCounsel]
    code: 200
    input: []
    output: SubpoenaRequest
    side_effects:
      - "Sets status RECEIVED -> UNDER_LEGAL_REVIEW and legal_reviewed_by_user_id to X-User-ID."

  - method: POST
    path: "/deposit-fraud/subpoenas/{id}/respond"
    description: "Counsel signs the response: PRODUCE, OBJECT or QUASH. The signer may not be the reviewer, and a response recorded after response_due_at requires a late_justification."
    roles: [LegalCounsel]
    code: 200
    input: ["disposition", "production_note?", "late_justification?"]
    output: SubpoenaRequest
    side_effects:
      - "Sets status to PRODUCED, OBJECTED or QUASHED, stamps responded_by_user_id, production_note and is_late."
      - "OBJECTED and QUASHED drop this subpoena out of the preservation-hold set, so Customer.preservation_hold_active falls to false unless another subpoena still holds it; PRODUCED keeps the hold until the logical clock passes preservation_end_at."

  # ---- Test-driving surface ----------------------------------------------
  - method: POST
    path: "/deposit-fraud/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deposit_at, hold window, preservation window, due date and account-age computation reads. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [OperationsAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects:
      - "Moves the logical clock. No entity is transitioned by the move itself: holds do not auto-release and subpoenas do not auto-expire; the new value is simply what every subsequent request reads."

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed for the endpoint in the 1.5 table."
  - id: ERR_NOT_ACCOUNT_OWNER
    http: 403
    condition: "An AccountHolder acts on a DepositAccount whose customer_id does not equal the caller's X-User-ID."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, wrong type, undeclared enum member, out-of-range integer, malformed timestamp, release_window_end_at not after release_effective_at, preservation_end_at not after preservation_start_at, response_due_at not after the logical clock, settle RETURNED without return_reason, or adjudicate RETURN without return_reason."
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "A customer id in the path or body matches no stored Customer."
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "An account id in the path or body (customer_id's account, from_account_id, to_account_id, drawee_account_id, primary_account_id) matches no stored DepositAccount."
  - id: ERR_FUNDING_SOURCE_NOT_FOUND
    http: 404
    condition: "A funding-source id in the path matches no stored FundingSource."
  - id: ERR_DEPOSIT_ITEM_NOT_FOUND
    http: 404
    condition: "A deposit-item id in the path matches no stored DepositItem."
  - id: ERR_CHECK_HOLD_NOT_FOUND
    http: 404
    condition: "A check-hold id in the path matches no stored CheckHold."
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "A hold-override-review id in the path matches no stored HoldOverrideReview."
  - id: ERR_FRAUD_CASE_NOT_FOUND
    http: 404
    condition: "A fraud-case id in the path matches no stored FraudCase."
  - id: ERR_CHARGE_OFF_NOT_FOUND
    http: 404
    condition: "A charge-off id in the path matches no stored ChargeOff."
  - id: ERR_SUBPOENA_NOT_FOUND
    http: 404
    condition: "A subpoena id in the path matches no stored SubpoenaRequest."
  - id: ERR_BSA_REFERRAL_NOT_FOUND
    http: 404
    condition: "A BSA-referral id in the path matches no stored BsaReferral."
  - id: ERR_STALE_CHECK_HOLD_VERSION
    http: 412
    condition: "expected_check_hold_version on override-review creation does not equal the CheckHold's current version."
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_account_version on charge-off creation does not equal the DepositAccount's current version."
  - id: ERR_SELF_LINK
    http: 422
    condition: "from_account_id equals to_account_id on account-link creation."
  - id: ERR_DUPLICATE_LINK
    http: 409
    condition: "An AccountLink with the same (from_account_id, to_account_id, link_type) triple already exists."
  - id: ERR_DUPLICATE_OPEN_CASE
    http: 409
    condition: "A FraudCase of the same case_type on the same account already has status IN {OPENED, INVESTIGATING, SUBSTANTIATED}; on a kiting scan this fires only when the scan detects."
  - id: ERR_ACCOUNT_NOT_ACTIVE
    http: 409
    condition: "A deposit is taken into an account whose lifecycle_status is not ACTIVE, or a kiting scan / manual case is raised on an account whose lifecycle_status is outside {ACTIVE, RESTRICTED}."
  - id: ERR_ACCOUNT_ACCESS_LOCKED
    http: 409
    condition: "A deposit or a step-up response is attempted on an account whose access_posture is LOCKED."
  - id: ERR_STEP_UP_NOT_REQUIRED
    http: 409
    condition: "A step-up response is submitted while access_posture is not STEP_UP_REQUIRED."
  - id: ERR_FUNDING_INVALID_STATE
    http: 409
    condition: "A verification attempt is submitted against a FundingSource that is VERIFIED, BLOCKED or still DECLARED, or a resend is requested against a source that is not FAILED_ATTEMPT or whose total_attempt_count has reached FUNDING_MAX_TOTAL_ATTEMPTS."
  - id: ERR_ITEM_ALREADY_SETTLED
    http: 409
    condition: "A settle call targets a DepositItem whose status is not PENDING."
  - id: ERR_HOLD_NOT_ACTIVE
    http: 409
    condition: "An override review is created, submitted, decided or executed against a CheckHold whose status is not ACTIVE."
  - id: ERR_HOLD_ALREADY_MATURED
    http: 422
    condition: "An override review is created when the logical clock is at or past the hold's hold_release_at."
  - id: ERR_RELEASE_WINDOW_OVERLAP
    http: 409
    condition: "The requested half-open early-release window overlaps a window already claimed on the same account by a DRAFT, SUBMITTED, RETURNED_FOR_INFO, APPROVED or EXECUTED review."
  - id: ERR_RELEASE_EXCEEDS_HOLD
    http: 422
    condition: "requested_release_cents exceeds the referenced CheckHold's current held_amount_cents."
  - id: ERR_REVIEW_NOT_SUBMITTED
    http: 409
    condition: "A decision is recorded on a review that is not SUBMITTED, or a submit is attempted on a review that is neither DRAFT nor RETURNED_FOR_INFO."
  - id: ERR_REVIEW_NOT_APPROVED
    http: 409
    condition: "An execute is attempted on a review that is not APPROVED."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The operator deciding a hold-override review prepared it, or the counsel signing a subpoena response performed its legal review."
  - id: ERR_EXPOSURE_EXCEEDS_AUTHORITY
    http: 422
    condition: "A review whose adjusted_exposure_cents exceeds SUPERVISOR_APPROVAL_LIMIT_CENTS is approved or executed."
  - id: ERR_CASE_INVALID_STATE
    http: 409
    condition: "advance on a case that is not OPENED, SUBSTANTIATE/UNSUBSTANTIATE on a case that is not INVESTIGATING, REOPEN on a case that is not UNSUBSTANTIATED, or close on a case that is neither SUBSTANTIATED nor UNSUBSTANTIATED."
  - id: ERR_CASE_NOT_SUBSTANTIATED
    http: 409
    condition: "A BSA referral is drafted against, or submitted for, a case whose status is not SUBSTANTIATED."
  - id: ERR_PRESERVATION_HOLD_ACTIVE
    http: 409
    condition: "A fraud case is closed while the owning Customer's preservation_hold_active is true."
  - id: ERR_BSA_REFERRAL_REQUIRED
    http: 409
    condition: "A SUBSTANTIATED case is closed with no BsaReferral in status ACCEPTED."
  - id: ERR_REFERRAL_INVALID_STATE
    http: 409
    condition: "A referral is submitted while neither DRAFT nor RETURNED, or adjudicated while not SUBMITTED."
  - id: ERR_PRESERVATION_WINDOW_CONFLICT
    http: 409
    condition: "A new preservation window sits within PRESERVATION_BUFFER_DAYS of another live window on the same Customer."
  - id: ERR_SUBPOENA_INVALID_STATE
    http: 409
    condition: "legal-review on a subpoena that is not RECEIVED, or respond on a subpoena that is not UNDER_LEGAL_REVIEW."
  - id: ERR_LATE_JUSTIFICATION_REQUIRED
    http: 422
    condition: "A subpoena response is signed after response_due_at without a late_justification."
  - id: ERR_ACCOUNT_NOT_CLOSED
    http: 409
    condition: "A charge-off is booked while the account's lifecycle_status is not CLOSED."
  - id: ERR_CHARGE_OFF_INVALID_STATE
    http: 409
    condition: "approve on a charge-off that is not PROPOSED, book on one that is not APPROVED, a recovery posting on one that is neither REFERRED_TO_RECOVERY nor RECOVERED_PARTIAL, or a reversal on one that is PROPOSED, APPROVED, REVERSED or SUPERSEDED."
  - id: ERR_NO_NET_LOSS
    http: 422
    condition: "gross_loss_cents minus collateral_offset_cents is zero or negative."
  - id: ERR_RECOVERY_EXCEEDS_LOSS
    http: 422
    condition: "A recovery posting exceeds the remaining fee bucket plus the remaining principal bucket."
  - id: ERR_RECOVERY_ALREADY_POSTED
    http: 409
    condition: "A reversal is attempted on a charge-off whose principal_recovered_cents or fee_recovered_cents is non-zero."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: OperationsAdmin
    description: "Deposit-operations back office: onboards customers and accounts, drives funding verification, takes and settles deposits, books write-offs and posts recoveries, and controls the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /deposit-fraud/customers"
      - "POST /deposit-fraud/accounts"
      - "POST /deposit-fraud/accounts/{id}/funding-sources"
      - "POST /deposit-fraud/funding-sources/{id}/verification-attempts"
      - "POST /deposit-fraud/funding-sources/{id}/resend"
      - "POST /deposit-fraud/accounts/{id}/deposit-items"
      - "POST /deposit-fraud/deposit-items/{id}/settle"
      - "POST /deposit-fraud/charge-offs/{id}/book"
      - "POST /deposit-fraud/charge-offs/{id}/recovery-postings"
      - "POST /deposit-fraud/_clock/set_current_utc"
    shared_operations:
      - "POST /deposit-fraud/account-links (shared with FraudAnalyst)"
      - "Every GET read declared in the 1.5 table, since OperationsAdmin appears in each of their roles lists"

  - name: FraudAnalyst
    description: "Deposit fraud investigator: runs kiting scans, opens and works cases, prepares hold-override reviews, drafts and files BSA referrals, proposes charge-offs and records takeover indicators."
    identity: "opaque"
    exclusive_operations:
      - "POST /deposit-fraud/accounts/{id}/kiting-scan"
      - "POST /deposit-fraud/fraud-cases"
      - "POST /deposit-fraud/fraud-cases/{id}/advance"
      - "POST /deposit-fraud/fraud-cases/{id}/bsa-referrals"
      - "POST /deposit-fraud/bsa-referrals/{id}/submit"
      - "POST /deposit-fraud/accounts/{id}/charge-offs"
    shared_operations:
      - "POST /deposit-fraud/account-links (shared with OperationsAdmin)"
      - "POST /deposit-fraud/check-holds/{id}/override-reviews (shared with FraudSupervisor)"
      - "POST /deposit-fraud/hold-override-reviews/{id}/submit (shared with FraudSupervisor)"
      - "POST /deposit-fraud/accounts/{id}/access-review (shared with FraudSupervisor, but reset_posture is honoured only for FraudSupervisor)"
      - "Investigative GET reads"

  - name: FraudSupervisor
    description: "Second line of the fraud unit: decides and executes hold-override releases, disposes and closes cases, approves and reverses charge-offs, and resets a locked access posture. May also prepare a review, which is exactly what the duty-separation rule bites on."
    identity: "opaque"
    exclusive_operations:
      - "POST /deposit-fraud/hold-override-reviews/{id}/decide"
      - "POST /deposit-fraud/hold-override-reviews/{id}/execute"
      - "POST /deposit-fraud/fraud-cases/{id}/disposition"
      - "POST /deposit-fraud/fraud-cases/{id}/close"
      - "POST /deposit-fraud/charge-offs/{id}/approve"
      - "POST /deposit-fraud/charge-offs/{id}/reverse"
    shared_operations:
      - "POST /deposit-fraud/check-holds/{id}/override-reviews (shared with FraudAnalyst)"
      - "POST /deposit-fraud/hold-override-reviews/{id}/submit (shared with FraudAnalyst)"
      - "POST /deposit-fraud/accounts/{id}/access-review (shared with FraudAnalyst)"
      - "Investigative GET reads"

  - name: BsaOfficer
    description: "Bank Secrecy Act unit: adjudicates suspicious-activity referrals filed by the fraud unit. Holds no write authority over accounts, holds, cases or charge-offs."
    identity: "opaque"
    exclusive_operations:
      - "POST /deposit-fraud/bsa-referrals/{id}/adjudicate"
    shared_operations:
      - "GET /deposit-fraud/customers/{id}, GET /deposit-fraud/customers/{id}/accounts, GET /deposit-fraud/customers/{id}/subpoenas, GET /deposit-fraud/accounts/{id}, GET /deposit-fraud/accounts/{id}/deposit-items, GET /deposit-fraud/accounts/{id}/fraud-cases, GET /deposit-fraud/deposit-items/{id}, GET /deposit-fraud/fraud-cases/{id}, GET /deposit-fraud/fraud-cases/{id}/bsa-referrals"

  - name: LegalCounsel
    description: "Bank legal: logs law-enforcement process, takes it under review and signs the response. The duty-separation rule forbids the same counsel from doing both halves."
    identity: "opaque"
    exclusive_operations:
      - "POST /deposit-fraud/customers/{id}/subpoenas"
      - "POST /deposit-fraud/subpoenas/{id}/legal-review"
      - "POST /deposit-fraud/subpoenas/{id}/respond"
    shared_operations:
      - "GET /deposit-fraud/customers/{id}, GET /deposit-fraud/customers/{id}/accounts, GET /deposit-fraud/customers/{id}/subpoenas, GET /deposit-fraud/accounts/{id}, GET /deposit-fraud/fraud-cases/{id}, GET /deposit-fraud/subpoenas/{id}"

  - name: AccountHolder
    description: "The depositor acting on their own account. X-User-ID is the Customer id, so ownership is checked by comparing it to DepositAccount.customer_id."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /deposit-fraud/accounts/{id}/step-up-response"
    shared_operations:
      - "GET /deposit-fraud/accounts/{id} for accounts whose customer_id equals the caller's X-User-ID"
