            - "The clock is then advanced to 2026-08-05T00:00:00Z, strictly after that deadline."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
