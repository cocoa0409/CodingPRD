  # ===========================================================================
  # RULE 6 — boundary / precision checks on three DIFFERENT metrics at three
  #          DIFFERENT endpoints
  #   instance 1 : completeness_score == 70.00        @ POST /exposure-submissions/{id}/signoff
  #   instance 2 : written_line_total_pct == 100.0000 @ POST /layers/{id}/sign-down
  #   instance 3 : aggregate_available_minor == 0     @ POST /layers/{id}/claim-advocacies
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: completeness_score_exactly_seventy_passes_signoff_while_sixty_eight_rejects
        grounds:
          - calculations.submission_completeness_score
          - validations[priority=40]
          - errors.ERR_SIGNOFF_SCORE_TOO_LOW
          - state_machines.ExposureSubmission.transitions.ACTUARY_REVIEW_to_SIGNED_OFF
        distinguishing_aspect: |
          Metric: ExposureSubmission.completeness_score against SIGNOFF_MIN_SCORE (70.00),
          asserted at POST /exposure-submissions/{submission_id}/signoff. Twin packages differ
          only in data_quality_flags_count (100 vs 150), landing on exactly 70.00 (>= passes)
          and 68.00 (fails). Instances 2 and 3 probe a percentage total and a money aggregate at
          other endpoints.
        test_recipe:
          setup:
            - "One cedent with two programs in different lines of business, both in placement_status DRAFT."
            - "PROPERTY carries a package with exposure_records_count 1000, data_quality_flags_count 100, historical_years_supplied 4, loss_history_completeness_pct 56.0000 and actuarial_report_attached false, which scores exactly 70.00."
            - "MARINE carries the same package with data_quality_flags_count 150, which scores 68.00."
            - "Both packages are moved to status ACTUARY_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property CAT 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_pass: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Marine CAT 2026", line_of_business: "MARINE", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_fail: $.data.id }
            - call: "POST /programs/${prog_pass}/exposure-submissions"
              payload: { package_label: "NW-PROP-2026-EDP", exposure_records_count: 1000, data_quality_flags_count: 100, historical_years_supplied: 4, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 56.0000, actuarial_report_attached: false }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_pass: $.data.id, score_pass: $.data.completeness_score }
            - call: "POST /programs/${prog_fail}/exposure-submissions"
              payload: { package_label: "NW-MAR-2026-EDP", exposure_records_count: 1000, data_quality_flags_count: 150, historical_years_supplied: 4, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 56.0000, actuarial_report_attached: false }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_fail: $.data.id, score_fail: $.data.completeness_score }
            - call: "POST /exposure-submissions/${sub_pass}/submit-for-review"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /exposure-submissions/${sub_fail}/submit-for-review"
              payload: {}
              as: BrokerPlacementLead
          trigger:
            - call: "POST /exposure-submissions/${sub_pass}/signoff"
              payload: { decision: "SIGNED_OFF", review_note: "at the floor but acceptable" }
              as: BrokerActuary
              as_user_id: "act-1"
            - call: "POST /exposure-submissions/${sub_fail}/signoff"
              payload: { decision: "SIGNED_OFF" }
              as: BrokerActuary
              as_user_id: "act-1"
              captures: { err: $.data.error_id }
          assert:
            - "${score_pass} == 70.00 and ${score_fail} == 68.00"
            - "ExposureSubmission.${sub_pass}.status == SIGNED_OFF  # equality passes"
            - "ExposureSubmission.${sub_pass}.actuary_signoff_user_id == 'act-1'"
            - "ExposureSubmission.${sub_pass}.signed_off_at == 2026-01-01T00:00:00.000Z"
            - "Program.${prog_pass}.placement_status == SUBMISSION_READY"
            - "the second signoff returns HTTP 422 with ${err} == ERR_SIGNOFF_SCORE_TOO_LOW"
            - "ExposureSubmission.${sub_fail}.status == ACTUARY_REVIEW and ExposureSubmission.${sub_fail}.actuary_signoff_user_id == null"
            - "Program.${prog_fail}.placement_status == DRAFT"

      - name: layer_written_total_exactly_one_hundred_cannot_be_signed_down
        grounds:
          - validations[priority=58]
          - errors.ERR_LAYER_NOT_OVERSUBSCRIBED
          - entities.Layer.fields.written_line_total_pct
          - state_machines.Layer.transitions.PARTIALLY_PLACED_to_FULLY_PLACED
        distinguishing_aspect: |
          Metric: Layer.written_line_total_pct against the 100.0000 strict boundary, asserted at
          POST /layers/{layer_id}/sign-down. Two lines of 60.0000 and 40.0000 land the layer on
          exactly 100.0000, which is FULLY_PLACED and NOT oversubscribed — one more basis point
          (100.0001) would admit the sign-down. Instances 1 and 3 probe a 2-decimal score and a
          money aggregate at other endpoints.
        test_recipe:
          setup:
            - "One cedent, two markets: Alpha Re (max_line 60.0000, capacity 1000000000, lead_authorised) and Bravo Re (max_line 40.0000, capacity 1000000000)."
