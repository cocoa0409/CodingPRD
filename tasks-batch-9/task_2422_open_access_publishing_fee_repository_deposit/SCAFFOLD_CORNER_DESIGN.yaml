      - name: corner_temporal_and_referential_inputs_are_rejected_at_their_own_codes
        claim_type: unprocessable_error
        grounds:
          - errors[ERR_APPOINTMENT_WINDOW_EXPIRED]
          - errors[ERR_COVERAGE_JOURNAL_PUBLISHER_MISMATCH]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          An accepted_on of 2026-07-05 one day past an appointment ending 2026-07-04 is
          ERR_APPOINTMENT_WINDOW_EXPIRED 422; a coverage line naming a journal owned by another
          publisher is ERR_COVERAGE_JOURNAL_PUBLISHER_MISMATCH 422 (the journal exists, so this
          is not a 404); and an agreement whose effective_until equals its effective_from is
          ERR_INVALID_REQUEST 400 because the window rule is strict.
        test_recipe:
          setup:
            - "publishers MERID (with journal J1) and HALDEN (with journal J2)"
            - "author appointed 2024-01-01..2026-07-04"
            - "DRAFT agreement on MERID"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: AgreementAdmin
              captures: { x8_p1_id: $.data.id, x8_p1_v: $.data.version }
            - call: "POST /publishers"
              payload: { name: "Halden Open Science", publisher_code: "HALDEN", country_code: "NO" }
              as: AgreementAdmin
              captures: { x8_p2_id: $.data.id, x8_p2_v: $.data.version }
            - call: "POST /journals"
              payload: { publisher_id: "${x8_p1_id}", issn: "2041-1723", title: "Meridian Journal of Cell Signalling", oa_model: "HYBRID", list_apc_cents: 380000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { x8_j1_id: $.data.id }
            - call: "POST /journals"
              payload: { publisher_id: "${x8_p2_id}", issn: "2515-0847", title: "Halden Journal of Open Metabolism", oa_model: "HYBRID", list_apc_cents: 300000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { x8_j2_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Rosa Delgado", email: "rosa.delgado@uni.example", orcid: "0000-0004-8888-9999", department_code: "CEL", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2026-07-04", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { x8_au_id: $.data.id }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${x8_p1_id}", agreement_code: "TA-MERID-2027", effective_from: "2026-07-01", effective_until: "2027-07-01", article_quota: 5, discount_pct: 0.20, covered_oa_models: ["HYBRID"], expected_publisher_version: "${x8_p1_v}" }
              as: AgreementAdmin
              captures: { x8_ta_id: $.data.id }
            - call: "GET /publishers/${x8_p1_id}"
              as: AgreementAdmin
              captures: { x8_p1_v2: $.data.version }
          trigger:
            - call: "POST /articles"
              payload: { journal_id: "${x8_j1_id}", corresponding_author_id: "${x8_au_id}", manuscript_title: "One day past the appointment", accepted_on: "2026-07-05" }
              as: ScholCommLibrarian
              captures: { x8_err_appointment: $.data.error_id }
            - call: "POST /transformative-agreements/${x8_ta_id}/coverages"
              payload: { journal_id: "${x8_j2_id}", coverage_type: "FULL_APC", covered_from: "2026-07-01", covered_until: "2027-06-30" }
              as: AgreementAdmin
              captures: { x8_err_mismatch: $.data.error_id }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${x8_p2_id}", agreement_code: "TA-HALDEN-2027", effective_from: "2026-07-01", effective_until: "2026-07-01", article_quota: 5, discount_pct: 0.10, covered_oa_models: ["HYBRID"], expected_publisher_version: "${x8_p2_v}" }
              as: AgreementAdmin
              captures: { x8_err_window: $.data.error_id }
          assert:
            - "${x8_err_appointment} == ERR_APPOINTMENT_WINDOW_EXPIRED"
            - "the first response returned HTTP 422"
            - "${x8_err_mismatch} == ERR_COVERAGE_JOURNAL_PUBLISHER_MISMATCH"
            - "the second response returned HTTP 422"
            - "${x8_err_window} == ERR_INVALID_REQUEST"
            - "the third response returned HTTP 400"
            - "${x8_p1_v2} == 2"
            - "the coverages list for ${x8_ta_id} returns 0 rows with total_count 0"
            - "no Article row exists"

  - section: rbac
    instances:
      - name: corner_fund_creation_is_exclusive_and_rejects_the_four_other_roles
        claim_type: exclusive_operation
        grounds:
          - roles.FundManager.exclusive_operations
          - endpoints[POST /apc-funds]
        distinguishing_aspect: |
          POST /apc-funds lists FundManager alone. AgreementAdmin, ScholCommLibrarian,
          RepositoryCurator and CorrespondingAuthor each get ERR_UNAUTHORIZED 403 with the
          identical body that a FundManager creates successfully, so the endpoint is genuinely
          single-role rather than "any staff role".
