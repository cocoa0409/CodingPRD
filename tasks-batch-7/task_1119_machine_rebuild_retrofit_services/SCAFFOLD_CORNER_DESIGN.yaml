# =============================================================================
# Task 1119 — Machine Rebuild & Retrofit Services
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth coverage of every §1.1–§1.7 claim not already covered by §1.8.
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_creation_and_retrieval
        claim_type: creation
        grounds: [entities.Customer, "endpoints.POST /api/customers", "endpoints.GET /api/customers/{id}"]
        distinguishing_aspect: "POST with all required fields returns 201 with system fields; GET returns the same stored data inside the §1.0 envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id, cust_ver: $.data.version, cust_created: $.data.created_at } }
            - { call: "GET /api/customers/${cust}", payload: {}, as: PlatformAdmin, captures: { got_name: $.data.name, got_credit: $.data.credit_limit_cents } }
          assert:
            - "create returns 201; data.id is a server-minted UUID, version == 1, created_at present"
            - "GET returns name == Acme Corp, credit_limit_cents == 500000000"
            - "response envelope contains meta.api_request_id and meta.api_request_timestamp; response_type == object"

      - name: machine_creation_missing_required_serial_number_rejected
        claim_type: required_fields
        grounds: [entities.Machine.fields.serial_number, "endpoints.POST /api/machines", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required serial_number yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 1000 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "rejected with ERR_INVALID_REQUEST (400); no machine is persisted"

      - name: machine_creation_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Machine.fields.machine_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "machine_type DRILL is outside {LATHE, MILL, GRINDER} and yields ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-201", machine_type: "DRILL", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 1000 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "rejected with ERR_INVALID_REQUEST (400)"

      - name: machine_duplicate_serial_number_rejected
        claim_type: type_constraints
        grounds: [entities.Machine.fields.serial_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "serial_number is unique across all machines; the second create with the same serial fails."
        test_recipe:
          setup: ["one machine with serial SN-202 exists"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-202", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 1000 }, as: PlatformAdmin, captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-202", machine_type: "MILL", year_of_manufacture: 2020, control_generation: "MODERN", spindle_hours: 500 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "rejected with ERR_INVALID_REQUEST (400) — uniqueness on serial_number"

      - name: machine_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["endpoints.GET /api/machines/{id}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/machines/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "rejected with ERR_NOT_FOUND (404)"

      - name: machines_list_pagination_defaults
        claim_type: listing
        grounds: ["endpoints.GET /api/machines", response_envelope]
        distinguishing_aspect: "List endpoint returns pagination fields with §1.0 defaults (limit 10, offset 0)."
        test_recipe:
          setup: ["one machine registered"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-203", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 1000 }, as: PlatformAdmin }
          trigger:
            - { call: "GET /api/machines?customer_id=${cust}", payload: {}, as: ProjectManager }
          assert:
            - "response_type == array; total_count == 1; has_more == false; limit == 10 and offset == 0 applied by default"

      - name: assessment_computed_wear_index_input_ignored
        claim_type: computed_fields
        grounds: [entities.Assessment.fields.wear_index, calculations.wear_index]
        distinguishing_aspect: "Client-supplied wear_index is ignored; the server computes 57.0 from the three measurements."
        test_recipe:
          setup: ["registered machine"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-204", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
          trigger:
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", wear_index: 999, expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { a: $.data.id, a_wear: $.data.wear_index } }
          assert:
            - "assessment wear_index == 57.0 (server-computed); the input value 999 was ignored"

      - name: system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Machine, "endpoints.POST /api/machines"]
        distinguishing_aspect: "Client-supplied id/created_at/version on create are ignored; the server mints all three."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-205", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 1000, id: "11111111-1111-1111-1111-111111111111", version: 42 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
          assert:
            - "returned id != 11111111-1111-1111-1111-111111111111 (server-minted), version == 1 (not 42)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: assessment_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.Assessment]
        distinguishing_aspect: "A newly created assessment starts in DRAFT, before any submit."
        test_recipe:
          setup: ["registered machine"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-210", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
          trigger:
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { a_status: $.data.status } }
            - { call: "GET /api/machines/${m}", payload: {}, as: ProjectManager, captures: { m_status: $.data.status } }
          assert:
            - "assessment status == DRAFT on creation"
            - "machine status == UNDER_ASSESSMENT after the first assessment is created"

      - name: assessment_return_resubmit_cycle
        claim_type: valid_transition
        grounds: [state_machines.Assessment.SUBMITTED_to_RETURNED, state_machines.Assessment.RETURNED_to_SUBMITTED]
        distinguishing_aspect: "The SUBMITTED -> RETURNED -> SUBMITTED resubmit cycle works and is the Assessment machine's cyclic shape claim."
        test_recipe:
          setup: ["assessment created and submitted"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-211", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
          trigger:
            - { call: "POST /api/assessments/${asmt}/return", payload: {}, as: ProjectManager, captures: { s1: $.data.status } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1", captures: { s2: $.data.status } }
          assert:
            - "return moves SUBMITTED -> RETURNED"
            - "resubmit moves RETURNED -> SUBMITTED (cycle)"

      - name: assessment_accept_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Assessment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "accept is only valid from SUBMITTED; from DRAFT it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["assessment in DRAFT"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-212", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
          trigger:
            - { call: "POST /api/assessments/${asmt}/accept", payload: {}, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "rejected with ERR_INVALID_STATE (409); assessment remains DRAFT and no project is created (GET /api/projects?assessment_id=${asmt} returns an empty array)"

      - name: assessment_terminal_lockdown_submit_after_accept_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Assessment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ACCEPTED is terminal; a submit after accept fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["assessment ACCEPTED (project auto-created)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-213", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
            - { call: "POST /api/assessments/${asmt}/accept", payload: {}, as: ProjectManager }
          trigger:
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1", captures: { err: $.data.error_id } }
          assert:
            - "rejected with ERR_INVALID_STATE (409); ACCEPTED is locked"

      - name: rejob_validate_by_fabricator_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ReverseEngineeringJob.PROTOTYPE_FABRICATED_to_VALIDATED, "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: the QualityInspector validating a prototype must not be the engineer who fabricated it; X-User-ID == fabricated_by_id fails with ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["RE job PROTOTYPE_FABRICATED by eng-2"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-214", machine_type: "MILL", year_of_manufacture: 2017, control_generation: "LEGACY", spindle_hours: 60000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
            - { call: "POST /api/assessments/${asmt}/accept", payload: {}, as: ProjectManager }
            - { call: "GET /api/projects?assessment_id=${asmt}", payload: {}, as: ProjectManager, captures: { proj: "$.data[0].id" } }
            - { call: "POST /api/projects/${proj}/decision", payload: { decision: "MECHANICAL_REBUILD", assigned_engineer_id: "eng-1" }, as: ProjectManager }
            - { call: "POST /api/parts", payload: { part_number: "P-B-214", description: "NC board", oem_status: "OBSOLETE", unit_cost_cents: 800000, stock_quantity: 0, lead_time_days: 60 }, as: PlatformAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/projects/${proj}/part-lines", payload: { part_id: "${pb}", quantity: 1 }, as: ProjectManager }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectManager, captures: { p_v: $.data.version } }
            - { call: "POST /api/projects/${proj}/quote", payload: { expected_project_version: "${p_v}" }, as: ProjectManager }
            - { call: "POST /api/projects/${proj}/quote/send", payload: {}, as: ProjectManager }
            - { call: "POST /api/projects/${proj}/quote/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /api/projects/${proj}/begin-sourcing", payload: {}, as: ProjectManager }
            - { call: "GET /api/re-jobs?project_id=${proj}", payload: {}, as: ProjectManager, captures: { rej: "$.data[0].id" } }
            - { call: "POST /api/re-jobs/${rej}/capture-spec", payload: {}, as: RebuildEngineer, as_user_id: "eng-2" }
            - { call: "POST /api/re-jobs/${rej}/fabricate", payload: { re_cost_cents: 500000 }, as: RebuildEngineer, as_user_id: "eng-2" }
          trigger:
            - { call: "POST /api/re-jobs/${rej}/validate", payload: {}, as: QualityInspector, as_user_id: "eng-2", captures: { err: $.data.error_id } }
          assert:
            - "rejected with ERR_SEGREGATION_OF_DUTIES (403); job remains PROTOTYPE_FABRICATED"

      - name: acceptance_inspector_equals_assigned_engineer_rejected
        claim_type: precondition_enforcement
        grounds: ["endpoints.POST /api/projects/{id}/acceptance-tests", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The acceptance inspector must differ from the project's assigned rebuild engineer; identical X-User-ID fails with ERR_SEGREGATION_OF_DUTIES even with the QualityInspector role."
        test_recipe:
          setup: ["project AWAITING_ACCEPTANCE with assigned_engineer_id eng-1"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-215", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
            - { call: "POST /api/assessments/${asmt}/accept", payload: {}, as: ProjectManager }
            - { call: "GET /api/projects?assessment_id=${asmt}", payload: {}, as: ProjectManager, captures: { proj: "$.data[0].id" } }
            - { call: "POST /api/projects/${proj}/decision", payload: { decision: "MECHANICAL_REBUILD", assigned_engineer_id: "eng-1" }, as: ProjectManager }
            - { call: "POST /api/parts", payload: { part_number: "P-A-215", description: "Ball screw", oem_status: "ACTIVE", unit_cost_cents: 1250000, stock_quantity: 10, lead_time_days: 14 }, as: PlatformAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/projects/${proj}/part-lines", payload: { part_id: "${pa}", quantity: 1 }, as: ProjectManager, captures: { line_a: $.data.id } }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectManager, captures: { p_v: $.data.version } }
            - { call: "POST /api/projects/${proj}/quote", payload: { expected_project_version: "${p_v}" }, as: ProjectManager }
            - { call: "POST /api/projects/${proj}/quote/send", payload: {}, as: ProjectManager }
            - { call: "POST /api/projects/${proj}/quote/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /api/projects/${proj}/begin-sourcing", payload: {}, as: ProjectManager }
            - { call: "POST /api/part-lines/${line_a}/fulfill", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /api/projects/${proj}/start-rebuild", payload: {}, as: ProjectManager }
            - { call: "POST /api/projects/${proj}/declare-ready", payload: {}, as: RebuildEngineer, as_user_id: "eng-1" }
          trigger:
            - { call: "POST /api/projects/${proj}/acceptance-tests", payload: {}, as: QualityInspector, as_user_id: "eng-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/projects/${proj}/acceptance-tests", payload: {}, as: QualityInspector, as_user_id: "qi-1", captures: { t1: $.data.id, t1_status: $.data.status } }
          assert:
            - "creation with X-User-ID == assigned_engineer_id rejected with ERR_SEGREGATION_OF_DUTIES (403)"
            - "creation with a distinct inspector qi-1 succeeds: status == SCHEDULED"

      - name: window_cancel_locked_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DowntimeWindow, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "LOCKED windows (referenced by a stage) cannot be cancelled; only OPEN windows can."
        test_recipe:
          setup: ["DECIDED project; window with one referencing stage (auto-LOCKED)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-216", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
            - { call: "POST /api/assessments/${asmt}/accept", payload: {}, as: ProjectManager }
            - { call: "GET /api/projects?assessment_id=${asmt}", payload: {}, as: ProjectManager, captures: { proj: "$.data[0].id" } }
            - { call: "POST /api/projects/${proj}/decision", payload: { decision: "MECHANICAL_REBUILD", assigned_engineer_id: "eng-1" }, as: ProjectManager }
            - { call: "POST /api/downtime-windows", payload: { customer_id: "${cust}", starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-07-01T00:00:00Z" }, as: LogisticsCoordinator, captures: { win: $.data.id } }
            - { call: "POST /api/projects/${proj}/shipment-stages", payload: { window_id: "${win}", stage_sequence: 1, planned_ship_date: "2026-06-10T00:00:00Z", planned_return_date: "2026-06-15T00:00:00Z" }, as: LogisticsCoordinator }
          trigger:
            - { call: "POST /api/downtime-windows/${win}/cancel", payload: {}, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "rejected with ERR_INVALID_STATE (409); window remains LOCKED"

      - name: stage_ship_before_acceptance_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ShipmentStage.PLANNED_to_SHIPPED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Guarded transition: ship requires the project in {ACCEPTED, TRAINING_IN_PROGRESS, HANDOVER_READY}; while AWAITING_ACCEPTANCE the ship fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["project AWAITING_ACCEPTANCE with a PLANNED stage"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-217", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
