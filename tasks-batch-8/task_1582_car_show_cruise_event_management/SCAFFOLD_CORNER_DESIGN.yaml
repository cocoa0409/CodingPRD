  - section: validations
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is rejected ERR_UNAUTHENTICATED (401) before any role check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /events", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "error == ERR_UNAUTHENTICATED (HTTP 401)"

      - name: participant_publish_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Participant is not in the roles list of POST /events/{id}/publish -> ERR_FORBIDDEN even when the participant exists."
        test_recipe:
          setup: ["Event in DRAFT with class+zone; a registrant exists"]
          setup_api_calls:
            - { call: "POST /events", payload: { name: "RBAC1", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /registrants", payload: { full_name: "RB", email: "rb@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /events/${ev}/publish", payload: {}, as: Participant, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
            - "error == ERR_FORBIDDEN (HTTP 403); event stays DRAFT"

      - name: participant_pays_others_registration_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_OWNERSHIP_VIOLATION]"]
        distinguishing_aspect: "Participant role is allowed on the endpoint, but paying a registration whose registrant_id != X-User-ID is an ownership violation, distinct from role-level ERR_FORBIDDEN."
        test_recipe:
          setup: ["Event REGISTRATION_OPEN; registration R1 (fee 3000) owned by registrant P1; second registrant P2"]
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Own", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "O1", email: "o1@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
            - { call: "POST /registrants", payload: { full_name: "O2", email: "o2@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /registrations/${r1}/payments", payload: { amount_cents: 3000, method: "CASH" }, as: Participant, as_user_id: "${p2}", captures: { err: $.data.error_id } }
          assert:
            - "error == ERR_OWNERSHIP_VIOLATION (HTTP 403); Registration.${r1} remains PENDING_PAYMENT with paid_cents 0"

      - name: payment_amount_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PAYMENT_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "A payment of 2999 against a 3000 fee is rejected; exact-amount payment then succeeds, proving the check is equality, not at-least."
        test_recipe:
          setup: ["Event REGISTRATION_OPEN; registration PENDING_PAYMENT fee 3000"]
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Mismatch", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "MM", email: "mm@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /registrations/${r1}/payments", payload: { amount_cents: 2999, method: "CASH" }, as: RegistrationDesk, captures: { err: $.data.error_id } }
            - { call: "POST /registrations/${r1}/payments", payload: { amount_cents: 3000, method: "CASH" }, as: RegistrationDesk, captures: { pay: $.data.id } }
          assert:
            - "2999 fails with ERR_PAYMENT_AMOUNT_MISMATCH (422); no payment row, registration stays PENDING_PAYMENT"
            - "3000 succeeds; Registration.${r1}.status == CONFIRMED"

      - name: duplicate_vehicle_registration_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_REGISTRATION]"]
        distinguishing_aspect: "One non-terminal registration per vehicle per event: re-registering the same vehicle (even in a different class) is rejected."
        test_recipe:
