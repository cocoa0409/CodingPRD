  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_fill_conservation_confirm_then_remove
        grounds:
          - state_machines.Appointment.NOMINATED_to_CONFIRMED
          - state_machines.Term.ACTIVE_to_VACATED
          - entities.Seat.fields.occupancy_status
        distinguishing_aspect: "Conserved quantity = filled seats (== active terms): confirm increments both by 1, executing removal decrements both by 1; after the compensating removal the board roster returns to filled_seat_count == active_member_count == 0."
        test_recipe:
          setup:
            - "A seated ACTIVE member (roster filled_seat_count==1, active_member_count==1) with an INITIATED removal."
