            - { call: "POST /api/dossier-items", payload: { case_id: "${case_b}", category: "RESEARCH", title: "R1", page_count: 12, is_peer_reviewed: true, expected_case_version: "${case_b_v} + 2" }, as: Candidate, as_user_id: "${cand_b}", captures: { b_r1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_b}", category: "RESEARCH", title: "R2", page_count: 12, expected_case_version: "${case_b_v} + 3" }, as: Candidate, as_user_id: "${cand_b}", captures: { b_r2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_b}", category: "RESEARCH", title: "R3", page_count: 12, expected_case_version: "${case_b_v} + 4" }, as: Candidate, as_user_id: "${cand_b}", captures: { b_r3: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_b}", category: "SERVICE", title: "S1", page_count: 5, expected_case_version: "${case_b_v} + 5" }, as: Candidate, as_user_id: "${cand_b}", captures: { b_s1: $.data.id } }
            - { call: "POST /api/dossier-items/${b_t1}/submit", as: Candidate, as_user_id: "${cand_b}" }
            - { call: "POST /api/dossier-items/${b_t2}/submit", as: Candidate, as_user_id: "${cand_b}" }
            - { call: "POST /api/dossier-items/${b_r1}/submit", as: Candidate, as_user_id: "${cand_b}" }
            - { call: "POST /api/dossier-items/${b_r2}/submit", as: Candidate, as_user_id: "${cand_b}" }
            - { call: "POST /api/dossier-items/${b_r3}/submit", as: Candidate, as_user_id: "${cand_b}" }
            - { call: "POST /api/dossier-items/${b_s1}/submit", as: Candidate, as_user_id: "${cand_b}" }
            - { call: "POST /api/cases/${case_b}/submit-dossier", as: Candidate, as_user_id: "${cand_b}", captures: { case_b_v8: $.data.version } }
            - { call: "POST /api/reviewers", payload: { full_name: "Rev B1", institution: "MIT", email: "rb1@mit.edu", expertise_area: "MATH" }, as: ProvostOfficer, captures: { rev_b1: $.data.id } }
            - { call: "POST /api/reviewers", payload: { full_name: "Rev B2", institution: "CMU", email: "rb2@cmu.edu", expertise_area: "MATH" }, as: ProvostOfficer, captures: { rev_b2: $.data.id } }
            - { call: "POST /api/reviewers", payload: { full_name: "Rev B3", institution: "Stanford", email: "rb3@stanford.edu", expertise_area: "MATH" }, as: ProvostOfficer, captures: { rev_b3: $.data.id } }
            - { call: "POST /api/invitations", payload: { case_id: "${case_b}", reviewer_id: "${rev_b1}", review_window_start: "2026-08-10", review_window_end: "2026-09-10", is_arm_length: true, declared_coauthor: false, expected_case_version: "${case_b_v8}" }, as: ProvostOfficer, captures: { inv_b1: $.data.id } }
            - { call: "POST /api/invitations", payload: { case_id: "${case_b}", reviewer_id: "${rev_b2}", review_window_start: "2026-08-10", review_window_end: "2026-09-10", is_arm_length: true, declared_coauthor: false, expected_case_version: "${case_b_v8} + 1" }, as: ProvostOfficer, captures: { inv_b2: $.data.id } }
            - { call: "POST /api/invitations", payload: { case_id: "${case_b}", reviewer_id: "${rev_b3}", review_window_start: "2026-08-10", review_window_end: "2026-09-10", is_arm_length: true, declared_coauthor: false, expected_case_version: "${case_b_v8} + 2" }, as: ProvostOfficer, captures: { inv_b3: $.data.id } }
            - { call: "POST /api/invitations/${inv_b1}/accept", as: ExternalReviewer, as_user_id: "${rev_b1}" }
            - { call: "POST /api/invitations/${inv_b1}/submit-letter", payload: { letter_text: "Strong." }, as: ExternalReviewer, as_user_id: "${rev_b1}" }
