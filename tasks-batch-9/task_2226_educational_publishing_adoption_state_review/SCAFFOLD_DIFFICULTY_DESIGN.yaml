  # ===========================================================================
  # Rule 6 - boundary and precision checks on four different metrics
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: volume_tier_boundary_at_exactly_five_thousand_units
        grounds:
          - calculations.state_net_price.constants.VOLUME_TIERS
          - entities.PricingProposal.fields.volume_discount_pct
          - endpoints[POST /pricing-proposals]
        distinguishing_aspect: |
          Metric: projected_adoption_units against the 5000-unit VOLUME_TIERS edge on
          POST /pricing-proposals - 4999 units earns volume_discount_pct 0.00 and a net of 10000
          cents, while exactly 5000 units earns 0.07 and a net of 9300 cents, so an implementation
          using a strict > comparison fails on the second filing.
        test_recipe:
          setup:
            - "State UT is OPEN_TERRITORY with sampling_copies_required 0 and min_verified_coverage_pct 50.00, and sets no price cap"
            - "The submission is FILED in an OPEN 2027 cycle at clock 2026-09-15"
            - "A first proposal quotes base_price_cents 10000, term_years 1, annual_escalator_bps 0 and projected_adoption_units 4999, one unit below the tier edge"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "UT", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_ut_id: $.data.id }
