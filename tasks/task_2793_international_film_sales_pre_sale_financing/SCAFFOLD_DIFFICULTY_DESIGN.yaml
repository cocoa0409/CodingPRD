          setup:
            - "Clock starts at 2026-08-01T00:00:00Z; contract MG 2000000.00 EXECUTED with all four milestones unpaid."
            - "Facility bonded, APPROVED then DRAWN for 1000000.00 while the collateral is still 1343649.60."
