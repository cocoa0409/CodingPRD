            - { call: "GET /farm/labor-shifts/${sh5}", as: LaborPlanner, captures: { sh5_ot: "$.data.overtime_hours" } }
            - { call: "POST /farm/labor-shifts/${sh6}/assignments", payload: { worker_id: "${w1}", expected_labor_shift_version: "${v6}" }, as: LaborPlanner }
            - { call: "GET /farm/labor-shifts/${sh6}", as: LaborPlanner, captures: { sh6_ot: "$.data.overtime_hours" } }
            - { call: "GET /farm/workers/${w1}", as: LaborPlanner, captures: { hrs: "$.data.scheduled_hours_current_week" } }
            - { call: "POST /farm/labor-shifts/${sh7}/assignments", payload: { worker_id: "${w1}", expected_labor_shift_version: "${v7}" }, as: LaborPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "after 5 assignments: worker.scheduled_hours_current_week == 40.00 and shift5.overtime_hours == 0.00 (exactly 40 is NOT overtime)"
            - "after 6th assignment: scheduled_hours_current_week == 48.00 — exactly at the hard cap, still allowed — and shift6.overtime_hours == 8.00"
            - "7th assignment (would make 50.00) -> error_id == ERR_WEEKLY_HOURS_EXCEEDED (strictly-above rejected)"

