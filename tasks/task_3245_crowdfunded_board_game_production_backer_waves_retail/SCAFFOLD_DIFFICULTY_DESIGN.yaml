# =============================================================================
# §1.8 — Scaffold Difficulty Design
# task_3245_crowdfunded_board_game_production_backer_waves_retail
# Nine §0.5 Difficulty Rules × 2 instances each = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: manufacturing_quote_provisional_differs_from_final
        grounds:
          - calculations.manufacturing_tier_price
          - entities.ManufacturingQuote.fields.provisional_units
          - entities.ManufacturingQuote.fields.final_units
        distinguishing_aspect: |
          Dual-variant on ManufacturingQuote: provisional counts PENDING pledges
          and excludes RESERVED distributor units; final excludes PENDING and
          includes RESERVED. Setup: 2 PENDING + 1 CHARGED pledges, 1 allocation
          of 5 RESERVED units. provisional_units = 3 → tier1 (price 5000);
          final_units = 6 → tier2 (price 4000).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Campaign LIVE with one OPEN pledge level price=10000c."
            - "Three pledges: p1 CHARGED, p2 PENDING, p3 PENDING."
            - "Clock advanced past closes_at → campaign CLOSED_SUCCESS."
            - "Quote tier_breaks [{min_units:1,unit_price_cents:5000},{min_units:5,unit_price_cents:4000}], SUBMITTED."
            - "One ProductionRun referencing the quote; one DistributorAllocation units_reserved=5 RESERVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "T1", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-09-05T00:00:00Z", pledge_levels: [{name: "Core", price_cents: 10000, contents: ["base"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${camp_id}", backer_user_id: "b1", backer_email: "b1@x", region_code: "NA", pledge_level_name: "Core", expected_campaign_version: "${v0}" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /pledges/${p1}/transition"
              payload: { action: "charge" }
              as: CampaignOwner
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${camp_id}", backer_user_id: "b2", backer_email: "b2@x", region_code: "NA", pledge_level_name: "Core", expected_campaign_version: "${v1}" }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v2: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${camp_id}", backer_user_id: "b3", backer_email: "b3@x", region_code: "NA", pledge_level_name: "Core", expected_campaign_version: "${v2}" }
              as: PlatformAdmin
              captures: { p3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /manufacturing-quotes"
              payload: { campaign_id: "${camp_id}", factory_name: "F1", tier_breaks: [{min_units: 1, unit_price_cents: 5000}, {min_units: 5, unit_price_cents: 4000}] }
              as: FactoryCoordinator
              captures: { q: $.data.id, prov_u: $.data.provisional_units, prov_p: $.data.provisional_unit_price_cents }
            - call: "POST /manufacturing-quotes/${q}/transition"
              payload: { action: "submit" }
              as: FactoryCoordinator
            - call: "POST /production-runs"
              payload: { campaign_id: "${camp_id}", quote_id: "${q}" }
              as: FactoryCoordinator
              captures: { run: $.data.id }
            - call: "POST /distributor-allocations"
              payload: { campaign_id: "${camp_id}", distributor_user_id: "d-1", distributor_name: "DistA", region_code: "NA", msrp_positioning_pct: 0.45, allocation_priority: 1, production_run_id: "${run}", units_reserved: 5 }
              as: PlatformAdmin
          trigger:
            - call: "POST /manufacturing-quotes/${q}/transition"
              payload: { action: "finalize" }
              as: FactoryCoordinator
              captures: { fin_u: $.data.final_units, fin_p: $.data.final_unit_price_cents }
          assert:
            - "ManufacturingQuote.${q}.provisional_units == 3 (1 CHARGED + 2 PENDING; excludes RESERVED)"
            - "ManufacturingQuote.${q}.provisional_unit_price_cents == 5000 (tier1 since 3 < 5)"
            - "ManufacturingQuote.${q}.final_units == 6 (1 CHARGED + 5 RESERVED; excludes PENDING)"
            - "ManufacturingQuote.${q}.final_unit_price_cents == 4000 (tier2 since 6 >= 5)"
            - "provisional_units != final_units AND provisional price != final price"

      - name: customs_duty_lower_of_two_variants_pinned
        grounds:
          - calculations.customs_duty_calculation
          - entities.FreightShipment.fields.customs_duty_cents
          - entities.FreightShipment.fields.duty_variant_used
        distinguishing_aspect: |
          Dual-variant on FreightShipment: declared (client-supplied) vs
          transaction (derived from run economics pro-rated by containers).
          The LOWER of the two is pinned into customs_duty_cents; variant name
          recorded in duty_variant_used. Setup: declared=100000c; transaction
          = planned_units(1) * final_unit_price(20000c) * (1/1) = 20000c.
          NA rate 0.040: declared=4000c, transaction=800c → pick 800,
          variant TRANSACTION_VALUE.
        test_recipe:
          setup:
            - "Campaign CLOSED_SUCCESS; 1 CHARGED pledge of 10000c."
            - "Quote single tier {min_units:1, unit_price_cents:20000} FINAL."
            - "ProductionRun LOCKED, planned_units=1."
            - "FreightShipment BOOKED region=NA declared_value_cents=100000 container_count=1; departed and arrived."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "T2", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-09-05T00:00:00Z", pledge_levels: [{name: "Core", price_cents: 10000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${camp_id}", backer_user_id: "b1", backer_email: "b1@x", region_code: "NA", pledge_level_name: "Core", expected_campaign_version: "${v0}" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /pledges/${p1}/transition"
              payload: { action: "charge" }
              as: CampaignOwner
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /manufacturing-quotes"
              payload: { campaign_id: "${camp_id}", factory_name: "F", tier_breaks: [{min_units: 1, unit_price_cents: 20000}] }
              as: FactoryCoordinator
              captures: { q: $.data.id }
            - call: "POST /manufacturing-quotes/${q}/transition"
              payload: { action: "submit" }
              as: FactoryCoordinator
            - call: "POST /manufacturing-quotes/${q}/transition"
              payload: { action: "finalize" }
              as: FactoryCoordinator
            - call: "POST /production-runs"
              payload: { campaign_id: "${camp_id}", quote_id: "${q}" }
              as: FactoryCoordinator
              captures: { run: $.data.id }
            - call: "POST /production-runs/${run}/transition"
              payload: { action: "lock" }
              as: FactoryCoordinator
            - call: "POST /freight-shipments"
              payload: { production_run_id: "${run}", region_code: "NA", container_count: 1, declared_value_cents: 100000, departs_at: "2026-09-07T00:00:00Z", arrives_at: "2026-09-20T00:00:00Z" }
              as: FreightBroker
              captures: { sh: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-shipments/${sh}/transition"
              payload: { action: "depart" }
              as: FreightBroker
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-shipments/${sh}/transition"
              payload: { action: "arrive" }
              as: FreightBroker
          trigger:
            - call: "POST /freight-shipments/${sh}/transition"
              payload: { action: "assess-duty" }
              as: CustomsAgent
              captures: { duty: $.data.customs_duty_cents, variant: $.data.duty_variant_used }
          assert:
            - "FreightShipment.${sh}.customs_duty_cents == 800 (lower of declared 4000 and transaction 800)"
            - "FreightShipment.${sh}.duty_variant_used == \"TRANSACTION_VALUE\""

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: pledge_total_per_line_rounding_then_sum
        grounds:
          - calculations.pledge_total_with_late_premium
          - entities.Pledge.fields.pledge_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding — per-line round_half_up THEN sum is pinned.
          Level 995c, late premium 0.10, is_late_pledge=true; one add-on line
          sku=X price=435c qty=1.
          level line = round(995*1.10) = round(1094.5) = 1095
          addon line = round(435*1.10) = round(478.5) = 479
          total = 1574. Sum-then-round would give round((995+435)*1.10)=1573.
        test_recipe:
          setup:
            - "Campaign LIVE. Level price=995 premium=0.10. Add-on catalog {sku:X, price_cents:435, per_backer_cap:5, status:OPEN}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "T3", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-10-01T00:00:00Z", pledge_levels: [{name: "L1", price_cents: 995, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.10, status: "OPEN"}], add_on_catalog: [{sku: "X", price_cents: 435, per_backer_cap: 5, status: "OPEN"}] }
              as: CampaignOwner
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /pledges"
              payload: { campaign_id: "${camp_id}", backer_user_id: "b1", backer_email: "b1@x", region_code: "NA", pledge_level_name: "L1", is_late_pledge: true, add_on_lines: [{sku: "X", quantity: 1}], expected_campaign_version: "${v0}" }
              as: PlatformAdmin
              captures: { total: $.data.pledge_total_cents }
          assert:
            - "Pledge.pledge_total_cents == 1574 (per-line: 1095 + 479)"

      - name: campaign_net_payable_evaluation_order
        grounds:
          - calculations.campaign_net_payable
          - calculations.campaign_platform_fee
          - calculations.campaign_payment_fee
        distinguishing_aspect: |
          Mode (c) circular-looking dependency pinned by evaluation order:
          platform fee on gross (tier-2 average-rate at gross=2000000 → 0.06);
          payment fee per-pledge round(2000000*0.029)+30 = 58030;
          net = 2000000 - 120000 - 58030 = 1821970.
        test_recipe:
          setup:
            - "Campaign LIVE with one level price=2000000c. One pledge CHARGED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "T4", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-10-01T00:00:00Z", pledge_levels: [{name: "Big", price_cents: 2000000, contents: ["d"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${camp_id}", backer_user_id: "b1", backer_email: "b1@x", region_code: "NA", pledge_level_name: "Big", expected_campaign_version: "${v0}" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /pledges/${p1}/transition"
              payload: { action: "charge" }
              as: CampaignOwner
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { gross: $.data.gross_charged_cents, plat: $.data.platform_fee_cents, pay: $.data.payment_fee_cents, net: $.data.net_payable_cents }
          assert:
            - "gross_charged_cents == 2000000"
            - "platform_fee_cents == 120000 (tier2 average rate 0.06; NOT marginal 80000+60000=140000)"
            - "payment_fee_cents == 58030 (round(2000000*0.029)+30)"
            - "net_payable_cents == 1821970 (2000000 - 120000 - 58030)"

      - name: freight_consolidation_nested_min_max
        grounds:
          - calculations.freight_consolidation_cost
        distinguishing_aspect: |
          Mode (a) — nested min/max + tier branches. container_count=2, region=EU
          (base 420000), weight=25000, volume=80:
          dim_wt = max(25000, 80*250) = 25000; wt_sur = (25000-22000)*8 = 24000;
          vol_sur = (80-67)*4000 = 52000; cost = 2*420000 + 24000 + 52000 = 916000.
        test_recipe:
          setup:
            - "ProductionRun exists (status QUOTED is sufficient — dry_run does not persist a shipment)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "T5", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-10-01T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${camp_id}", backer_user_id: "b1", backer_email: "b1@x", region_code: "NA", pledge_level_name: "L", expected_campaign_version: "${v0}" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /pledges/${p1}/transition"
              payload: { action: "charge" }
              as: CampaignOwner
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /manufacturing-quotes"
              payload: { campaign_id: "${camp_id}", factory_name: "F", tier_breaks: [{min_units: 1, unit_price_cents: 5000}] }
              as: FactoryCoordinator
              captures: { q: $.data.id }
            - call: "POST /manufacturing-quotes/${q}/transition"
              payload: { action: "submit" }
              as: FactoryCoordinator
            - call: "POST /manufacturing-quotes/${q}/transition"
              payload: { action: "finalize" }
              as: FactoryCoordinator
            - call: "POST /production-runs"
              payload: { campaign_id: "${camp_id}", quote_id: "${q}" }
              as: FactoryCoordinator
              captures: { run: $.data.id }
          trigger:
            - call: "POST /freight-shipments"
              payload: { production_run_id: "${run}", region_code: "EU", container_count: 2, declared_value_cents: 1, departs_at: "2026-10-05T00:00:00Z", arrives_at: "2026-10-20T00:00:00Z", dry_run: true, total_weight_kg: 25000, total_volume_m3: 80 }
              as: FreightBroker
              captures: { cost: $.data.cost_cents }
          assert:
            - "cost_cents == 916000 (2*420000 + 24000 + 52000)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: pledge_parallel_state_dimensions
        grounds:
          - state_machines.Pledge
          - entities.Pledge.fields.charge_status
          - entities.Pledge.fields.address_status
          - entities.Pledge.fields.fulfillment_status
        distinguishing_aspect: |
          Pledge carries three independent dimensions on one row. Confirming
          address does NOT change charge_status; refunding moves charge_status
          to REFUNDED while address stays CONFIRMED and fulfillment stays
          QUEUED. A linear pipeline cannot express this.
        test_recipe:
          setup:
            - "Campaign LIVE. Pledge created (PENDING, UNCONFIRMED, QUEUED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "T6", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-10-01T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${camp_id}", backer_user_id: "b1", backer_email: "b1@x", region_code: "NA", pledge_level_name: "L", expected_campaign_version: "${v0}" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /pledges/${p1}/transition"
              payload: { action: "confirm-address" }
              as: Backer
              as_user_id: "b1"
            - call: "GET /pledges/${p1}"
              payload: {}
              as: PlatformAdmin
              captures: { cs_mid: $.data.charge_status, as_mid: $.data.address_status }
            - call: "POST /pledges/${p1}/transition"
              payload: { action: "charge" }
              as: CampaignOwner
            - call: "POST /pledges/${p1}/transition"
              payload: { action: "refund" }
              as: CampaignOwner
            - call: "GET /pledges/${p1}"
              payload: {}
              as: PlatformAdmin
              captures: { cs: $.data.charge_status, as_: $.data.address_status, fs: $.data.fulfillment_status }
          assert:
            - "after confirm-address: charge_status == PENDING AND address_status == CONFIRMED (dimensions independent)"
            - "final: charge_status == REFUNDED AND address_status == CONFIRMED AND fulfillment_status == QUEUED"

      - name: localization_cyclic_renegotiation
        grounds:
          - state_machines.LocalizationAgreement
        distinguishing_aspect: |
          Cyclic SIGNED → NEGOTIATING → SIGNED loop on LocalizationAgreement.
          The second sign re-validates the print window against freight and
          re-adds print_commitment_units to quote recompute.
        test_recipe:
          setup:
            - "Campaign CLOSED_SUCCESS. One LocalizationAgreement NEGOTIATING with print window 2026-10-01..2026-11-01 (no freight shipments exist)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "T7", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-09-05T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${camp_id}", backer_user_id: "b1", backer_email: "b1@x", region_code: "NA", pledge_level_name: "L", expected_campaign_version: "${v0}" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /pledges/${p1}/transition"
              payload: { action: "charge" }
              as: CampaignOwner
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /localization-agreements"
              payload: { campaign_id: "${camp_id}", partner_name: "LA", language_code: "fr", royalty_pct: 0.10, print_commitment_units: 100, print_window_start: "2026-10-01T00:00:00Z", print_window_end: "2026-11-01T00:00:00Z" }
              as: LocalizationPartner
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /localization-agreements/${loc}/transition"
              payload: { action: "sign" }
              as: LocalizationPartner
              captures: { st1: $.data.status }
            - call: "POST /localization-agreements/${loc}/transition"
              payload: { action: "renegotiate" }
              as: LocalizationPartner
              captures: { st2: $.data.status }
            - call: "POST /localization-agreements/${loc}/transition"
              payload: { action: "sign" }
              as: LocalizationPartner
              captures: { st3: $.data.status }
          assert:
            - "after first sign: status == SIGNED"
            - "after renegotiate: status == NEGOTIATING (cyclic loop)"
            - "after second sign: status == SIGNED"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth ≥3 and ≥2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: charge_triggers_stretch_unlock_then_level_contents_then_sibling_repricing
        grounds:
          - calculations.stretch_goal_unlock
          - state_machines.Campaign.transitions.LIVE_to_CLOSED_SUCCESS
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /pledges/{id}/transition
          action=charge: charge (link 1) bumps gross → triggers
          stretch_goal_unlock (link 2) which mutates pledge_levels[].contents
          → which triggers pledge_total recompute on sibling pledges
          (link 3) → which triggers campaign aggregate recompute (link 4).
          Setup: two pledges already CHARGED (gross=10000); goal threshold
          15000; charging third pledge (gross→15000) crosses the threshold.
        test_recipe:
          setup:
            - "Campaign LIVE, level price=5000c, embedded stretch_goal threshold=15000 targeting the level."
