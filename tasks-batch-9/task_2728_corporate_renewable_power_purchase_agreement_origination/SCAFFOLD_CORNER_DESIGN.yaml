            - call: "POST /ppa/conditions-precedent/${cp_permit_id}/resolution"
              payload: { resolution: "FAIL" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DealCommittee
              as_user_id: "u_committee_1"
          trigger:
            - call: "POST /ppa/deals/${deal_id}/terminate"
