scaffold_corner_design:
- section: entities
  instances:
  - name: stroke_center_creation_applies_every_declared_default
    claim_type: creation
    grounds:
    - entities.StrokeCenter
    - endpoints.POST /stroke-network/stroke-centers
    distinguishing_aspect: 'A bare create with only the four required inputs must materialise all nine defaulted fields at once, including the two that are easy to get wrong: public_dtn_compliance_pct must be null (never 0.0) and equipment_readiness_posture must be READY because both readiness flags default true.'
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      trigger:
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Lakeside Regional Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          nc_id: $.data.id
          nc_cert: $.data.certification_status
          nc_ct: $.data.ct_scanner_ready
          nc_cart: $.data.video_cart_ready
          nc_eq: $.data.equipment_readiness_posture
          nc_open: $.data.open_case_count
          nc_ems: $.data.ems_routing_posture
          nc_pub: $.data.public_dtn_compliance_pct
          nc_den: $.data.consecutive_denied_report_count
      assert:
      - HTTP 201 with response_type object
      - ${nc_cert} == PROVISIONAL, ${nc_ct} == true, ${nc_cart} == true, ${nc_eq} == READY
      - ${nc_open} == 0 and ${nc_ems} == ROUTINE
      - ${nc_pub} == null (NOT 0.0) and public_report_published_at == null
      - ${nc_den} == 0 and suspension_reason == null
      - name, facility_type, state_code and ems_region_code echo the request exactly
  - name: get_stroke_center_returns_the_stored_row_unchanged
    claim_type: retrieval
    grounds:
    - entities.StrokeCenter
    - endpoints.GET /stroke-network/stroke-centers/{id}
    distinguishing_aspect: 'A read must not mutate: the version stays 1 and updated_at stays equal to created_at after two consecutive GETs, which catches an implementation that touches updated_at on read.'
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; one SPOKE centre created at that instant.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          rc_id: $.data.id
      trigger:
      - call: GET /stroke-network/stroke-centers/${rc_id}
        as: ProgramCoordinator
        captures:
          rc_name: $.data.name
          rc_type: $.data.facility_type
          rc_state: $.data.state_code
          rc_v: $.data.version
          rc_created: $.data.created_at
          rc_updated: $.data.updated_at
      assert:
      - HTTP 200 with ${rc_name} == 'Riverside Community Spoke', ${rc_type} == SPOKE and ${rc_state} == CA
      - ${rc_v} == 1 and ${rc_created} == 2026-09-01T08:00:00Z
      - ${rc_updated} == ${rc_created} — a GET performs no write
      - a second identical GET returns byte-identical data with version still 1
  - name: list_stroke_centers_paginates_with_total_count_and_has_more
    claim_type: listing
    grounds:
    - entities.StrokeCenter
    - endpoints.GET /stroke-network/stroke-centers
    - response_envelope.pagination_fields
    distinguishing_aspect: Three rows read through a limit of 2 must report total_count 3 (the unpaged total, not the page size) with has_more true on the first page and false on the second, and the facility_type filter must narrow total_count as well as the page.
    test_recipe:
      setup:
      - 'Clock set to 2026-09-01T08:00:00Z; three centres created in order: one HUB_PRIMARY, one SPOKE, one THROMBECTOMY_CAPABLE.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          l1_id: $.data.id
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          l2_id: $.data.id
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Summit Thrombectomy Center
          facility_type: THROMBECTOMY_CAPABLE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          l3_id: $.data.id
      trigger:
      - call: GET /stroke-network/stroke-centers?limit=2&offset=0
        payload:
          limit: 2
          offset: 0
        as: ProgramCoordinator
        captures:
          p1_first: $.data[0].id
          p1_second: $.data[1].id
      - call: GET /stroke-network/stroke-centers?limit=2&offset=2
        payload:
          limit: 2
          offset: 2
        as: ProgramCoordinator
        captures:
          p2_first: $.data[0].id
      - call: GET /stroke-network/stroke-centers?facility_type=SPOKE&limit=10&offset=0
        payload:
          facility_type: SPOKE
          limit: 10
          offset: 0
        as: ProgramCoordinator
        captures:
          f_first: $.data[0].id
      assert:
      - page 1 returns response_type array with exactly 2 elements, total_count 3 and has_more true
      - ${p1_first} == ${l1_id} and ${p1_second} == ${l2_id} — created_at ASC ordering
      - page 2 returns exactly 1 element, total_count 3 and has_more false, with ${p2_first} == ${l3_id}
      - the filtered read returns exactly 1 element with total_count 1 and has_more false, and ${f_first} == ${l2_id}
      - 'the filter narrows total_count too: an implementation that counts before filtering would report 3'
  - name: get_unknown_center_id_returns_center_not_found
    claim_type: not_found
    grounds:
    - validations priority 15 -> ERR_CENTER_NOT_FOUND (404)
    - endpoints.GET /stroke-network/stroke-centers/{id}
    distinguishing_aspect: A well-formed UUID that addresses no row must give the collection-specific 404 ERR_CENTER_NOT_FOUND rather than a generic not-found or an empty 200 body.
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; one unrelated centre exists so the collection is non-empty.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          nf_id: $.data.id
      trigger:
      - call: GET /stroke-network/stroke-centers/11111111-1111-4111-8111-111111111111
        as: ProgramCoordinator
        captures:
          nf_id: $.data.error_id
          nf_msg: $.data.message
      assert:
      - HTTP 404 with ${nf_id} == ERR_CENTER_NOT_FOUND and a non-empty ${nf_msg}
      - response_type is error and data carries exactly error_id and message
      - the existing centre ${nf_id} is untouched
  - name: code_stroke_activation_omitting_arrival_mode_is_refused
    claim_type: required_fields
    grounds:
    - validations priority 10 -> ERR_INVALID_REQUEST (422)
    - endpoints.POST /stroke-network/code-strokes input arrival_mode
    distinguishing_aspect: arrival_mode carries no default in §1.1, so omitting it must be a 422 rather than a silent EMS assumption; no CodeStrokeCase row and no open_case_count increment may result.
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; one SPOKE centre with open_case_count 0.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          rq_id: $.data.id
      trigger:
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${rq_id}
          patient_ref: P-RQ-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          last_known_well_at: '2026-09-01T07:40:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          rq_id: $.data.error_id
          rq_msg: $.data.message
      assert:
      - HTTP 422 with ${rq_id} == ERR_INVALID_REQUEST
      - GET /stroke-network/code-strokes?center_id=${rq_id} returns total_count 0
      - StrokeCenter.${rq_id}.open_case_count is still 0, ems_routing_posture ROUTINE and version 1
  - name: spoke_agreement_creation_defaults_to_draft_with_no_credentials
    claim_type: defaults
    grounds:
    - entities.SpokeAgreement
    - endpoints.POST /stroke-network/spoke-agreements
    distinguishing_aspect: The agreement must land in DRAFT with an EMPTY proxy_credentials array and active_consult_count 0 — an implementation that activates on create would let consults through before the coordinator ever calls /activate.
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; a HUB_PRIMARY centre and a SPOKE centre.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          dh_id: $.data.id
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          ds_id: $.data.id
      trigger:
      - call: POST /stroke-network/spoke-agreements
        payload:
          hub_center_id: ${dh_id}
          spoke_center_id: ${ds_id}
          coverage_tier: TIER_1_FULL
          max_concurrent_consults: 3
          effective_from: '2026-08-01T00:00:00Z'
          effective_until: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
        captures:
          da_id: $.data.id
          da_status: $.data.status
          da_creds: $.data.proxy_credentials
          da_active: $.data.active_consult_count
          da_reason: $.data.suspension_reason
          da_v: $.data.version
      assert:
      - HTTP 201 with ${da_status} == DRAFT
      - ${da_creds} == [] (empty array, not null) and ${da_active} == 0
      - ${da_reason} == null and ${da_v} == 1
      - coverage_tier, max_concurrent_consults, effective_from and effective_until echo the request
  - name: checklist_screening_score_is_recomputed_on_every_inclusion_item
    claim_type: computed_fields
    grounds:
    - entities.ThrombolyticChecklist.screening_eligibility_score (source computed)
    - calculations.eligibility_score SCREENING variant, INCLUSION_ITEM_POINTS 15.0
    - endpoints.POST /stroke-network/checklists/{id}/inclusion-items
    distinguishing_aspect: 'screening_eligibility_score is computed, never supplied, and must advance by exactly 15.00 per confirmed item: 15.00, 30.00, 45.00, 60.00. attested_eligibility_score must stay null throughout, so the two computed score fields are provably independent.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; hub, spoke, ACTIVE agreement and one board-certified ON_CALL Neurologist.
      - One CodeStrokeCase at the spoke and one empty ThrombolyticChecklist on it (documentation_status NOT_STARTED, screening_eligibility_score 0.00).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          hub_id: $.data.id
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          spoke_id: $.data.id
      - call: POST /stroke-network/spoke-agreements
        payload:
          hub_center_id: ${hub_id}
          spoke_center_id: ${spoke_id}
          coverage_tier: TIER_1_FULL
          max_concurrent_consults: 3
          effective_from: '2026-08-01T00:00:00Z'
          effective_until: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
        captures:
          agr_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/activate
        payload: {}
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists
        payload:
          full_name: Dr Nora Ainsley
          home_center_id: ${hub_id}
          licensed_state_codes:
          - CA
          board_certified: true
          roster_rank: 10
          concurrent_consult_limit: 2
        as: ProgramCoordinator
        captures:
          n1_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/proxy-credentials
        payload:
          neurologist_id: ${n1_id}
          privilege_scope: CONSULT_AND_THROMBOLYSIS
          expires_at: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists/${n1_id}/on-call-state
        payload:
          on_call_state: ON_CALL
        as: ProgramCoordinator
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${spoke_id}
          patient_ref: P-CF-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: EMS
          last_known_well_at: '2026-09-01T07:45:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          cf_id: $.data.id
      - call: POST /stroke-network/checklists
        payload:
          case_id: ${cf_id}
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          cf_ck: $.data.id
      trigger:
      - call: POST /stroke-network/checklists/${cf_ck}/inclusion-items
        payload:
          item_code: INC_ONSET_CONFIRMED
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          s1: $.data.screening_eligibility_score
          c1: $.data.confirmed_inclusion_item_count
          d1: $.data.documentation_status
      - call: POST /stroke-network/checklists/${cf_ck}/inclusion-items
        payload:
          item_code: INC_NIHSS_RECORDED
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          s2: $.data.screening_eligibility_score
      - call: POST /stroke-network/checklists/${cf_ck}/inclusion-items
        payload:
          item_code: INC_BP_CONTROLLED
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          s3: $.data.screening_eligibility_score
      - call: POST /stroke-network/checklists/${cf_ck}/inclusion-items
        payload:
          item_code: INC_ANTICOAG_REVIEWED
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          s4: $.data.screening_eligibility_score
          c4: $.data.confirmed_inclusion_item_count
          a4: $.data.attested_eligibility_score
          det4: $.data.determination_status
      assert:
      - ${s1} == 15.00, ${s2} == 30.00, ${s3} == 45.00, ${s4} == 60.00 — exactly INCLUSION_ITEM_POINTS per item
      - ${c1} == 1 and ${c4} == 4, and confirmed_inclusion_item_codes holds the four codes in confirmation order
      - '${d1} == IN_PROGRESS: the first item moves documentation_status off NOT_STARTED'
      - ${a4} == null and ${det4} == PENDING — the ATTESTED variant does not run outside /determine
      - every value carries exactly 2 decimal places
  - name: code_stroke_case_system_fields_are_generated_not_supplied
    claim_type: system_fields
    grounds:
    - entities.CodeStrokeCase common fields
    - endpoints.POST /stroke-network/code-strokes
    distinguishing_aspect: 'id, created_at, updated_at and version are system-sourced: created_at must equal the LOGICAL clock instant (not wall time), version must start at 1, and the pair created_at == updated_at must hold on a fresh row.'
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:30:00Z; one SPOKE centre.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:30:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          sf_ctr: $.data.id
      trigger:
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${sf_ctr}
          patient_ref: P-SF-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: EMS
          last_known_well_at: '2026-09-01T07:40:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          sf_id: $.data.id
          sf_created: $.data.created_at
          sf_updated: $.data.updated_at
          sf_v: $.data.version
          sf_status: $.data.status
          sf_disp: $.data.disposition
      assert:
      - HTTP 201; ${sf_id} is a UUID that was not present in the request
      - ${sf_created} == 2026-09-01T08:30:00Z — the LOGICAL clock, deliberately later than the supplied door_at 08:00:00Z
      - ${sf_updated} == ${sf_created} and ${sf_v} == 1
      - ${sf_status} == ACTIVATED and ${sf_disp} == PENDING (initial_state and default, not inputs)
      - door_at is stored as supplied at 2026-09-01T08:00:00Z and is NOT overwritten with created_at
  - name: code_stroke_activation_with_an_undeclared_arrival_mode_value
    claim_type: type_constraints
    grounds:
    - validations priority 12 -> ERR_INVALID_ENUM_VALUE (422)
    - entities.CodeStrokeCase.arrival_mode constraints
    distinguishing_aspect: arrival_mode admits exactly {EMS, WALK_IN, INTERFACILITY_TRANSFER}; a plausible-looking 'AMBULANCE' must be a 422 ERR_INVALID_ENUM_VALUE and not a stored free-text value.
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; one SPOKE centre.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          en_ctr: $.data.id
      trigger:
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${en_ctr}
          patient_ref: P-EN-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: AMBULANCE
          last_known_well_at: '2026-09-01T07:40:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          en_id: $.data.error_id
          en_msg: $.data.message
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${en_ctr}
          patient_ref: P-EN-002
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: WALK_IN
          last_known_well_at: '2026-09-01T07:40:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          en_ok: $.data.id
          en_mode: $.data.arrival_mode
      assert:
      - HTTP 422 with ${en_id} == ERR_INVALID_ENUM_VALUE for the 'AMBULANCE' request
      - no case row was created by the rejected request and StrokeCenter.${en_ctr}.open_case_count stayed 0
      - the immediately following WALK_IN request succeeds with ${en_mode} == WALK_IN, proving only the value was at fault
  - name: spoke_agreement_period_must_be_strictly_increasing
    claim_type: type_constraints
    grounds:
    - validations priority 67 -> ERR_INVALID_PERIOD_RANGE (422)
    - endpoints.POST /stroke-network/spoke-agreements
    distinguishing_aspect: effective_from must be STRICTLY earlier than effective_until, so equal endpoints are a 422 as well as inverted ones — the degenerate empty window is the case a naive `>` check lets through.
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; a HUB_PRIMARY centre and a SPOKE centre.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          pr_hub: $.data.id
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          pr_spoke: $.data.id
      trigger:
      - call: POST /stroke-network/spoke-agreements
        payload:
          hub_center_id: ${pr_hub}
          spoke_center_id: ${pr_spoke}
          coverage_tier: TIER_1_FULL
          max_concurrent_consults: 3
          effective_from: '2027-01-01T00:00:00Z'
          effective_until: '2026-01-01T00:00:00Z'
        as: ProgramCoordinator
        captures:
          pr1_id: $.data.error_id
          pr1_msg: $.data.message
      - call: POST /stroke-network/spoke-agreements
        payload:
          hub_center_id: ${pr_hub}
          spoke_center_id: ${pr_spoke}
          coverage_tier: TIER_1_FULL
          max_concurrent_consults: 3
          effective_from: '2026-08-01T00:00:00Z'
          effective_until: '2026-08-01T00:00:00Z'
        as: ProgramCoordinator
        captures:
          pr2_id: $.data.error_id
          pr2_msg: $.data.message
      - call: POST /stroke-network/spoke-agreements
        payload:
          hub_center_id: ${pr_hub}
          spoke_center_id: ${pr_spoke}
          coverage_tier: TIER_1_FULL
          max_concurrent_consults: 3
          effective_from: '2026-08-01T00:00:00Z'
          effective_until: '2026-08-01T00:00:01Z'
        as: ProgramCoordinator
        captures:
          pr_ok: $.data.id
      assert:
      - the inverted window returns HTTP 422 with ${pr1_id} == ERR_INVALID_PERIOD_RANGE
      - the EQUAL-endpoint window also returns HTTP 422 with ${pr2_id} == ERR_INVALID_PERIOD_RANGE — strictness matters
      - a one-second window is accepted with HTTP 201, so the rule is strictly-less-than and nothing more
