        grounds:
          - validations[priority=7]
          - errors.ERR_CONDITION_OUT_OF_SCOPE
        distinguishing_aspect: "A BURN condition against an ORTHOPEDIC program is rejected 422 ERR_CONDITION_OUT_OF_SCOPE at priority 7 — before the international and capacity checks that would also be irrelevant here."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1, program P1 (ORTHOPEDIC 0..215), source RS1."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
