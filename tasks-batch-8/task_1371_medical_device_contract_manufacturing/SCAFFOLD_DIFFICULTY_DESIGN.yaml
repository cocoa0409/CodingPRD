# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7. Clock default: 2026-08-01T00:00:00Z.
scaffold_difficulty_design:
  # ------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: lot_expiry_provisional_vs_final
        grounds:
          - calculations.lot_expiry
          - entities.DeviceLot.fields.expiry_date
          - entities.DeviceLot.fields.expiry_basis
          - state_machines.SterileBarrierStudy.IN_PROGRESS_to_PASSED
        distinguishing_aspect: |
          Dual-variant on the DeviceLot/sterility domain: the SAME lot with the SAME manufactured_at
          yields expiry 2027-06-02 under the PROVISIONAL formula (min(ceil(20*0.5),12)=10 months) and
          2028-08-02 under the FINAL formula (min(24,60)=24 months) once the study passes.
        test_recipe:
          setup:
            - "DMR DEV-E1 rev A (sterile, claim 20 months) APPROVED; protocol VP-E1 VALIDATED"
            - "lot LT-E1 (qty 10, mfg 2026-08-02T00:00:00Z) IN_PRODUCTION with provisional expiry"
            - "sterile barrier study for the DMR IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /api/manufacturing-lines", payload: { line_code: "L-E1", changeover_buffer_hours: 24 }, as: QMSAdmin, as_user_id: "admin-1", captures: { line_id: "$.data.id" } }
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-E1", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols", payload: { protocol_code: "VP-E1", dmr_id: "${dmr_id}", line_id: "${line_id}", planned_start: "2026-09-01T00:00:00Z", planned_end: "2026-09-10T00:00:00Z" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { proto_id: "$.data.id" } }
            - { call: "POST /api/validation-protocols/${proto_id}/execute-phase", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/device-lots", payload: { lot_number: "LT-E1", dmr_id: "${dmr_id}", validation_protocol_id: "${proto_id}", quantity: 10, manufactured_at: "2026-08-02T00:00:00Z" }, as: ProductionOperator, as_user_id: "po-1", captures: { lot_id: "$.data.id", expiry_prov: "$.data.expiry_date", basis_prov: "$.data.expiry_basis" } }
            - { call: "POST /api/sterile-barrier-studies", payload: { dmr_id: "${dmr_id}", study_type: "ACCELERATED", claimed_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { study_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/sterile-barrier-studies/${study_id}/complete", payload: { passed: true, result_months_confirmed: 24 }, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "GET /api/device-lots/${lot_id}", payload: {}, as: QualityManager, as_user_id: "qm-bob", captures: { expiry_final: "$.data.expiry_date", basis_final: "$.data.expiry_basis" } }
          assert:
            - "DeviceLot.${lot_id}.expiry_basis before study pass == PROVISIONAL (captured basis_prov)"
            - "DeviceLot.${lot_id}.expiry_date before study pass == 2027-06-02T00:00:00Z (captured expiry_prov: 2026-08-02 + 10 months)"
            - "after PASSED(24): DeviceLot.${lot_id}.expiry_basis == FINAL"
            - "after PASSED(24): DeviceLot.${lot_id}.expiry_date == 2028-08-02T00:00:00Z (2026-08-02 + 24 months)"
            - "DeviceMasterRecord.${dmr_id}.confirmed_shelf_life_months == 24"

      - name: supplier_score_current_vs_finalized
        grounds:
          - calculations.supplier_quality_score
          - entities.Supplier.fields.quality_score
          - entities.Supplier.fields.quality_score_finalized
          - state_machines.NonconformanceReport.CONTAINED_to_DISPOSITIONED
          - state_machines.NonconformanceReport.DISPOSITIONED_to_CLOSED
        distinguishing_aspect: |
          Dual-variant on the Supplier/risk domain: one CRITICAL supplier-fault NCR in DISPOSITIONED
          drops quality_score to 70 but leaves quality_score_finalized at 100 (risk_tier stays LOW);
          only closing the NCR moves the finalized variant to 70 and flips risk_tier to MEDIUM.
        test_recipe:
          setup:
            - "supplier SUP-E2 QUALIFIED with ACTIVE agreement; part PN-E2 QUALIFIED"
            - "NCR-E2 (CRITICAL, on part) CONTAINED"
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-E2", name: "Acme Components" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-E2", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
            - { call: "POST /api/quality-agreements/${agr_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/parts", payload: { part_number: "PN-E2", description: "housing", critical: false }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /api/nonconformance-reports", payload: { ncr_code: "NCR-E2", description: "cracked housing", severity: "CRITICAL", supplier_part_id: "${part_id}" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { ncr_id: "$.data.id" } }
            - { call: "POST /api/nonconformance-reports/${ncr_id}/contain", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/nonconformance-reports/${ncr_id}/disposition", payload: { disposition: "RETURN_TO_SUPPLIER", fault: "SUPPLIER" }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "GET /api/suppliers/${sup_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { score_mid: "$.data.quality_score", fin_mid: "$.data.quality_score_finalized", tier_mid: "$.data.risk_tier" } }
          trigger:
            - { call: "POST /api/nonconformance-reports/${ncr_id}/close", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "GET /api/suppliers/${sup_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { score_end: "$.data.quality_score", fin_end: "$.data.quality_score_finalized", tier_end: "$.data.risk_tier" } }
          assert:
            - "while DISPOSITIONED: Supplier.${sup_id}.quality_score == 70 (100 - 30 CRITICAL)"
            - "while DISPOSITIONED: Supplier.${sup_id}.quality_score_finalized == 100 (penalty not yet finalized)"
            - "while DISPOSITIONED: Supplier.${sup_id}.risk_tier == LOW (finalized 100 >= 90)"
            - "after close: Supplier.${sup_id}.quality_score_finalized == 70"
            - "after close: Supplier.${sup_id}.risk_tier == MEDIUM (70 <= finalized < 90; boundary 70 is inclusive MEDIUM)"
            - "NonconformanceReport.${ncr_id}.status == CLOSED"

  # ------------------------------------------------------------------
  # Rule 2 — combinatorial_formula
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: sterile_sample_qty_tiered_maturity
        grounds:
          - calculations.sterile_sample_qty
          - state_machines.DeviceLot.complete
          - entities.DeviceLot.fields.sample_qty
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: quantity tier (151->32), critical-part
          multiplier (ceil(32*1.5)=48), and process-maturity branch (<3 prior released lots => 100%).
          Pins: lot1 sample=10 (maturity), lot4 sample=32 releasable=119, lot5 (critical) sample=48.
        test_recipe:
          setup:
            - "DMR DEV-S rev A APPROVED (sterile, claim 20); protocol VP-S VALIDATED on line L-S"
            - "supplier SUP-S QUALIFIED; parts PN-S (non-critical) and PN-SC (critical), quantities received"
            - "three priming lots released under VP-S (maturity ramp); target lots LT-S4 (qty 151, non-critical) and LT-S5 (qty 151, critical) completed"
          setup_api_calls:
            - { call: "POST /api/manufacturing-lines", payload: { line_code: "L-S", changeover_buffer_hours: 24 }, as: QMSAdmin, as_user_id: "admin-1", captures: { line_id: "$.data.id" } }
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-S", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols", payload: { protocol_code: "VP-S", dmr_id: "${dmr_id}", line_id: "${line_id}", planned_start: "2026-09-01T00:00:00Z", planned_end: "2026-09-10T00:00:00Z" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { proto_id: "$.data.id" } }
            - { call: "POST /api/validation-protocols/${proto_id}/execute-phase", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-S", name: "Sterile Parts Co" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-S", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
            - { call: "POST /api/quality-agreements/${agr_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/parts", payload: { part_number: "PN-S", description: "seal", critical: false }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /api/supplier-parts/${part_id}/receive", payload: { quantity: 1000 }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/parts", payload: { part_number: "PN-SC", description: "valve", critical: true }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { partc_id: "$.data.id" } }
            - { call: "POST /api/supplier-parts/${partc_id}/receive", payload: { quantity: 1000 }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            # priming lot 1 (maturity 0 -> 100% sample)
            - { call: "POST /api/device-lots", payload: { lot_number: "LT-S1", dmr_id: "${dmr_id}", validation_protocol_id: "${proto_id}", quantity: 10, manufactured_at: "2026-08-02T00:00:00Z" }, as: ProductionOperator, as_user_id: "po-1", captures: { lot1_id: "$.data.id" } }
            - { call: "POST /api/device-lots/${lot1_id}/components", payload: { supplier_part_id: "${part_id}", quantity_used: 10, supplier_lot_number: "SL-S1" }, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot1_id}/complete", payload: {}, as: ProductionOperator, as_user_id: "po-1", captures: { lot1_sample: "$.data.sample_qty" } }
            - { call: "POST /api/device-lots/${lot1_id}/record-sterility-result", payload: { result: "PASSED" }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/device-lots/${lot1_id}/udi-labels", payload: { udi_di: "12345678901231" }, as: ProductionOperator, as_user_id: "po-1", captures: { lbl1_id: "$.data.id" } }
            - { call: "POST /api/udi-labels/${lbl1_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/udi-labels/${lbl1_id}/print", payload: {}, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot1_id}/release", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            # priming lot 2 (maturity 1 -> 100%)
            - { call: "POST /api/device-lots", payload: { lot_number: "LT-S2", dmr_id: "${dmr_id}", validation_protocol_id: "${proto_id}", quantity: 10, manufactured_at: "2026-08-02T00:00:00Z" }, as: ProductionOperator, as_user_id: "po-1", captures: { lot2_id: "$.data.id" } }
            - { call: "POST /api/device-lots/${lot2_id}/components", payload: { supplier_part_id: "${part_id}", quantity_used: 10, supplier_lot_number: "SL-S2" }, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot2_id}/complete", payload: {}, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot2_id}/record-sterility-result", payload: { result: "PASSED" }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/device-lots/${lot2_id}/udi-labels", payload: { udi_di: "12345678901231" }, as: ProductionOperator, as_user_id: "po-1", captures: { lbl2_id: "$.data.id" } }
            - { call: "POST /api/udi-labels/${lbl2_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/udi-labels/${lbl2_id}/print", payload: {}, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot2_id}/release", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            # priming lot 3 (maturity 2 -> 100%)
            - { call: "POST /api/device-lots", payload: { lot_number: "LT-S3", dmr_id: "${dmr_id}", validation_protocol_id: "${proto_id}", quantity: 10, manufactured_at: "2026-08-02T00:00:00Z" }, as: ProductionOperator, as_user_id: "po-1", captures: { lot3_id: "$.data.id" } }
            - { call: "POST /api/device-lots/${lot3_id}/components", payload: { supplier_part_id: "${part_id}", quantity_used: 10, supplier_lot_number: "SL-S3" }, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot3_id}/complete", payload: {}, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot3_id}/record-sterility-result", payload: { result: "PASSED" }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/device-lots/${lot3_id}/udi-labels", payload: { udi_di: "12345678901231" }, as: ProductionOperator, as_user_id: "po-1", captures: { lbl3_id: "$.data.id" } }
            - { call: "POST /api/udi-labels/${lbl3_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/udi-labels/${lbl3_id}/print", payload: {}, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot3_id}/release", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            # target lots created + components (still IN_PRODUCTION)
            - { call: "POST /api/device-lots", payload: { lot_number: "LT-S4", dmr_id: "${dmr_id}", validation_protocol_id: "${proto_id}", quantity: 151, manufactured_at: "2026-08-02T00:00:00Z" }, as: ProductionOperator, as_user_id: "po-1", captures: { lot4_id: "$.data.id" } }
            - { call: "POST /api/device-lots/${lot4_id}/components", payload: { supplier_part_id: "${part_id}", quantity_used: 151, supplier_lot_number: "SL-S4" }, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots", payload: { lot_number: "LT-S5", dmr_id: "${dmr_id}", validation_protocol_id: "${proto_id}", quantity: 151, manufactured_at: "2026-08-02T00:00:00Z" }, as: ProductionOperator, as_user_id: "po-1", captures: { lot5_id: "$.data.id" } }
            - { call: "POST /api/device-lots/${lot5_id}/components", payload: { supplier_part_id: "${partc_id}", quantity_used: 151, supplier_lot_number: "SL-S5" }, as: ProductionOperator, as_user_id: "po-1" }
          trigger:
            - { call: "POST /api/device-lots/${lot4_id}/complete", payload: {}, as: ProductionOperator, as_user_id: "po-1", captures: { lot4_sample: "$.data.sample_qty", lot4_rel: "$.data.releasable_qty" } }
            - { call: "POST /api/device-lots/${lot5_id}/complete", payload: {}, as: ProductionOperator, as_user_id: "po-1", captures: { lot5_sample: "$.data.sample_qty" } }
          assert:
            - "DeviceLot.${lot1_id}.sample_qty == 10 (maturity < 3 released lots => 100% inspection)"
            - "DeviceLot.${lot4_id}.sample_qty == 32 (tier 151..1200, maturity reached, non-critical)"
            - "DeviceLot.${lot4_id}.releasable_qty == 119 (151 - 32)"
            - "DeviceLot.${lot5_id}.sample_qty == 48 (ceil(32 * 1.5) critical multiplier)"

      - name: complaint_rate_feedback_evaluation_order
        grounds:
          - calculations.complaint_rate_per_100k
          - state_machines.Complaint.UNDER_INVESTIGATION_to_INVESTIGATED
          - state_machines.FieldAction.DRAFT_to_ISSUED
          - entities.DeviceMasterRecord.fields.field_action_review_required
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency: the field-action flag depends on the rate, the recall
          issued because of it removes the very lots from the rate denominator. Pinned evaluation order
          (mutations -> denominator -> numerator -> rate -> flag) yields rate 5.0000 -> flag true after
          confirmation, then rate 0 -> flag false after the recall of all 4 released lots.
        test_recipe:
          setup:
            - "DMR DEV-C rev A APPROVED; protocol VP-C VALIDATED; supplier SUP-C QUALIFIED with part PN-C (30000 units)"
            - "three priming lots released (qty 10 each, 100% sampled); lot LT-C4 qty 20125 released (sample 125, releasable 20000)"
            - "complaint CMP-C1 SERIOUS_INJURY on LT-C4 under investigation"
