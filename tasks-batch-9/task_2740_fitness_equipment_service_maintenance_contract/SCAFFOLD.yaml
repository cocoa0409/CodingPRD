# =============================================================================
# FleetCare — Fitness Equipment Service & Maintenance Contract seed tables
# Task 2740 · difficulty target: beyond Expert (§0.4 upper band, density-first)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2740. Fitness Equipment Service & Maintenance Contract (fitness equipment service company):
  contract structure across preventive maintenance visits, parts inclusion and response time
  commitments, equipment inventory with model, serial and usage-hour tracking per club,
  preventive visit scheduling with checklist execution and consumable replacement, service call
  dispatch with technician routing, parts availability and loaner or swap options, parts
  obsolescence for older equipment with refurbished sourcing and end-of-support notification,
  downtime tracking with contractual credits and equipment replacement recommendations, safety
  inspection documentation and liability considerations for member injuries, contract renewal
  pricing based on fleet age and service history

domain_name: fleetcare-service-contracts
api_prefix: /fleetcare

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - Dual-variant calculation
    - Cascading side effects
    - Optimistic concurrency
    - Selector policy

  entity_topology: flat
  # Every entity is a peer addressed at `/fleetcare/<collection>/{id}`; parentage is
  # expressed only through FK fields, never through nested URL paths. Contract, Equipment,
  # ServiceCall, PreventiveVisit and DowntimeEvent all reference each other laterally
  # (DowntimeEvent carries contract_id AND equipment_id AND service_call_id), which is
  # exactly the shape a hierarchical URL tree cannot express.

  state_machine_shape: parallel
  # PreventiveVisit carries two independent dimensions (visit_status × safety_doc_status)
  # that advance on separate triggers and are only read together by `pm_credit_earned`.
  # ServiceCall is cyclic (ON_SITE → PARTS_HOLD → ON_SITE), ServiceContract is branching
  # plus cyclic (RENEWAL_QUOTED → RENEWAL_QUOTED on re-quote, then fork to RENEWED|EXPIRED).

  relationship_patterns:
    - one_to_many          # Club → Equipment, ServiceContract → ServiceCall
    - cross_aggregate      # DowntimeEvent spans ServiceCall + Equipment + ServiceContract
    - polymorphic          # TechnicianAssignment points at EITHER a ServiceCall or a PreventiveVisit

  role_model: segregation_of_duties
  # The technician who executed a preventive visit may not certify its own safety document,
  # and the technician who worked a member-injury service call may not sign its safety
  # clearance. Both are enforced by comparing X-User-ID against the resource's technician FK.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- Club -----
  - name: Club
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Club (site) display name", constraints: "1..120 chars" }
      - { name: region_code, type: string, source: input, description: "Service region the club sits in; technician eligibility is filtered on an exact match of this value", constraints: "2..4 uppercase letters" }
      - name: operating_open_minute
        type: integer
        source: input
        default: 300
        description: "Minutes after UTC midnight at which the club opens (300 = 05:00Z). Used by the operating-hours downtime variant."
        constraints: "0..1439"
      - name: operating_close_minute
        type: integer
        source: input
        default: 1380
        description: "Minutes after UTC midnight at which the club closes (1380 = 23:00Z); must be strictly greater than operating_open_minute."
        constraints: "1..1440 and > operating_open_minute"
      - name: max_concurrent_visits
        type: integer
        source: input
        default: 1
        description: "Aggregate capacity: how many PreventiveVisit closed intervals may overlap on this club at one instant."
        constraints: ">= 1"
      - { name: covered_unit_count, type: integer, source: computed, description: "Count of Equipment rows whose club_id == this Club.id, all lifecycle_status values included", default: 0 }
      - { name: open_safety_lockout_count, type: integer, source: computed, description: "Count of Equipment rows whose club_id == this Club.id AND lifecycle_status == TAGGED_OUT", default: 0 }

  # ------------------------------------------------------- EquipmentModel ----
  - name: EquipmentModel
    parent: null
    common_fields: true
    fields:
      - { name: manufacturer, type: string, source: input, description: "Manufacturer name", constraints: "1..80 chars" }
      - { name: model_code, type: string, source: input, description: "Manufacturer model code; unique per manufacturer", constraints: "1..40 chars" }
      - { name: category, type: enum, source: input, description: "Equipment family; a technician may only be routed to categories present in skill_categories", constraints: "TREADMILL | ELLIPTICAL | BIKE | STRENGTH" }
      - { name: model_year, type: integer, source: input, description: "Year the model was released", constraints: "1990..2100" }
      - { name: pm_interval_hours, type: integer, source: input, description: "Usage hours between preventive maintenance visits", constraints: ">= 1" }
      - { name: expected_service_life_hours, type: integer, source: input, description: "Design life in usage hours; denominator of the usage-based health score", constraints: ">= 1" }
      - { name: base_annual_service_cents, type: integer, source: input, description: "Per-unit annual service list price in cents; the renewal quote line base", constraints: ">= 0" }
      - name: checklist_template
        type: array
        source: input
        default: []
        description: "Ordered template copied onto every PreventiveVisit for this model. Each element is { code, is_safety_critical, consumable }; codes are unique within the template. An empty template is legal."
        constraints: "0..20 elements; element.code 1..40 chars"

  # ----------------------------------------------------------- Equipment -----
  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id; the club the unit is installed in" }
      - { name: model_id, type: string, source: input, description: "FK -> EquipmentModel.id; pins pm_interval_hours, expected_service_life_hours and the checklist template" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique within (club_id, serial_number)", constraints: "1..40 chars" }
      - { name: install_date, type: string, source: input, description: "Calendar date the unit entered service, YYYY-MM-DD; age_years is derived from it", constraints: "ISO 8601 date" }
      - { name: usage_hours, type: number, source: computed, default: 0, description: "Latest cumulative usage hours reported for the unit; seeded from initial_usage_hours at creation and only ever non-decreasing", constraints: ">= 0, one decimal place" }
      - { name: usage_hours_at_last_pm, type: number, source: computed, default: 0, description: "Value of usage_hours captured when the most recent PreventiveVisit reached visit_status COMPLETED; seeded to initial_usage_hours at creation" }
      - { name: pm_status, type: enum, source: computed, default: OK, description: "OK | DUE | OVERDUE — recomputed from (usage_hours - usage_hours_at_last_pm) on every usage reading and on visit completion", constraints: "OK | DUE | OVERDUE" }
      - { name: lifecycle_status, type: enum, source: computed, default: IN_SERVICE, description: "IN_SERVICE | DOWN | TAGGED_OUT — DOWN while a non-injury service call is open, TAGGED_OUT after an inspector tag-out, a rejected safety document, a failed safety-critical checklist item or a member-injury report", constraints: "IN_SERVICE | DOWN | TAGGED_OUT" }
      - { name: support_status, type: enum, source: computed, default: SUPPORTED, description: "SUPPORTED | END_OF_SUPPORT_ANNOUNCED | UNSUPPORTED — set by the end-of-support cascade on a critical spare of this unit's model", constraints: "SUPPORTED | END_OF_SUPPORT_ANNOUNCED | UNSUPPORTED" }
      - { name: eos_notified_at, type: datetime, source: computed, default: null, description: "Logical-clock instant at which the end-of-support cascade first touched this unit; null while support_status == SUPPORTED" }
      - { name: health_score, type: number, source: computed, default: 100, description: "0.00..100.00 condition score produced by calculations.equipment_health_score using exactly one of its two variants", constraints: "2 decimal places" }
      - { name: health_score_variant, type: enum, source: computed, default: USAGE_BASED, description: "USAGE_BASED | FAILURE_BASED — which variant produced the current health_score", constraints: "USAGE_BASED | FAILURE_BASED" }
      - { name: replacement_recommended, type: boolean, source: computed, default: false, description: "True once health_score <= 40.00, or health_score <= 60.00 while support_status == UNSUPPORTED" }
      - { name: downtime_minutes_ytd, type: integer, source: computed, default: 0, description: "Sum of DowntimeEvent.downtime_minutes for this unit over events whose status is CLOSED or RECONCILED", constraints: ">= 0" }
      - { name: loaner_active, type: boolean, source: computed, default: false, description: "True once a PartOrder with source LOANER_SWAP reached status INSTALLED for a service call on this unit" }
      - { name: last_safety_clearance_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of the most recent safety clearance signed on a resolve of this unit's service call" }
      - { name: safety_lockout_reason, type: enum, source: computed, default: null, description: "Why the unit is TAGGED_OUT; cleared to null when lifecycle_status leaves TAGGED_OUT", constraints: "INSPECTOR_TAG_OUT | SAFETY_DOC_REJECTED | SAFETY_CRITICAL_FAIL | MEMBER_INJURY | null" }

  # ------------------------------------------------------ ServiceContract ----
  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id; the covered site. The contract's covered fleet is every Equipment whose club_id equals this value." }
      - { name: coverage_tier, type: enum, source: input, description: "BRONZE | SILVER | GOLD — drives sla_response_minutes, the downtime grace window and the credit rate", constraints: "BRONZE | SILVER | GOLD" }
      - { name: parts_inclusion, type: enum, source: input, description: "NONE | WEAR_ONLY | FULL — which PartCatalogEntry categories the contract covers", constraints: "NONE | WEAR_ONLY | FULL; GOLD requires FULL, BRONZE forbids FULL" }
      - { name: pm_visits_per_year, type: integer, source: input, description: "Contracted preventive visit count per term year", constraints: ">= tier minimum: BRONZE 1, SILVER 2, GOLD 4" }
      - { name: annual_base_cents, type: integer, source: input, description: "Annual contract value in cents for the current term; the credit cap and the renewal floor/cap are percentages of it", constraints: ">= 1" }
      - { name: initial_parts_allowance_cents, type: integer, source: input, description: "Parts allowance granted at contract creation, in cents", constraints: ">= 0" }
      - { name: term_start_date, type: string, source: input, description: "First calendar date of the term, YYYY-MM-DD; lower bound of the service-history counting window", constraints: "ISO 8601 date" }
      - { name: term_end_date, type: string, source: input, description: "Last calendar date of the term, YYYY-MM-DD; must be strictly after term_start_date", constraints: "ISO 8601 date" }
      - { name: sla_response_minutes, type: integer, source: computed, description: "Contracted arrival window in minutes, taken from SLA_RESPONSE_MINUTES_BY_TIER at creation (BRONZE 480, SILVER 240, GOLD 120)" }
      - { name: status, type: enum, source: computed, default: DRAFT, description: "DRAFT | ACTIVE | SUSPENDED | RENEWAL_QUOTED | RENEWED | EXPIRED", constraints: "see state_machines.ServiceContract" }
      - { name: suspension_reason, type: string, source: computed, default: null, description: "Free-text reason captured on suspend; cleared to null on reinstate" }
      - { name: parts_allowance_total_cents, type: integer, source: computed, description: "= initial_parts_allowance_cents + sum of every parts-allowance adjustment amount_cents applied to this contract" }
      - { name: parts_allowance_remaining_cents, type: integer, source: computed, description: "= parts_allowance_total_cents - sum(PartOrder.allowance_draw_cents for orders on this contract's service calls with status IN {ALLOCATED, INSTALLED})", constraints: ">= 0" }
      - { name: credit_provisional_cents, type: integer, source: computed, default: 0, description: "Sum of DowntimeEvent.provisional_credit_cents for events on this contract with status IN {CLOSED, RECONCILED}; the wall-clock estimate shown before reconciliation" }
      - { name: credit_accrued_cents, type: integer, source: computed, default: 0, description: "Sum of DowntimeEvent.posted_credit_cents for events on this contract with status == RECONCILED; never exceeds credit_cap_cents" }
      - { name: credit_forgone_cents, type: integer, source: computed, default: 0, description: "Final credit that was clipped away by credit_cap_cents, in cents" }
      - { name: credit_cap_cents, type: integer, source: computed, description: "= round_half_up(annual_base_cents * 0.15); hard ceiling on credit_accrued_cents for the term" }
      - { name: pm_visits_completed_count, type: integer, source: computed, default: 0, description: "Count of PreventiveVisit rows on this contract with visit_status == COMPLETED" }
      - { name: pm_visits_missed_count, type: integer, source: computed, default: 0, description: "Count of PreventiveVisit rows on this contract with visit_status == MISSED" }
      - { name: pm_compliance_pct, type: number, source: computed, default: 100, description: "= 100.00 when pm_visits_completed_count + pm_visits_missed_count == 0, else round_half_up(100 * completed / (completed + missed), 2)", constraints: "0.00..100.00" }
      - { name: obsolete_unit_count, type: integer, source: computed, default: 0, description: "Count of covered Equipment with support_status == UNSUPPORTED" }
      - { name: replacement_candidate_count, type: integer, source: computed, default: 0, description: "Count of covered Equipment with replacement_recommended == true" }
      - { name: fleet_renewal_risk, type: enum, source: computed, default: LOW, description: "HIGH when replacement_candidate_count / covered_unit_count >= 0.30, MODERATE at >= 0.15, else LOW; LOW when covered_unit_count == 0", constraints: "LOW | MODERATE | HIGH" }
      - { name: last_reconciled_period_key, type: string, source: computed, default: null, description: "Most recent period_key ('YYYY-MM') passed to a successful credit reconciliation on this contract" }

  # -------------------------------------------------------- Technician -------
  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician display name", constraints: "1..80 chars" }
      - { name: region_code, type: string, source: input, description: "Region the technician serves; must equal the club's region_code to be routable", constraints: "2..4 uppercase letters" }
      - { name: skill_categories, type: array, source: input, description: "EquipmentModel.category values this technician may work on", constraints: "1..4 distinct values from TREADMILL | ELLIPTICAL | BIKE | STRENGTH" }
      - { name: is_safety_inspector, type: boolean, source: input, default: false, description: "True when the technician holds the safety-inspector credential required to certify or reject a visit safety document, tag out equipment, or sign an injury clearance" }
      - { name: max_committed_minutes, type: integer, source: input, default: 480, description: "Ceiling on committed_minutes; a reservation that would push committed_minutes past it is rejected", constraints: ">= 1" }
      - { name: duty_status, type: enum, source: computed, default: ON_DUTY, description: "ON_DUTY | OFF_DUTY — set through the duty-status endpoint; OFF_DUTY technicians are excluded from routing and rejected when named explicitly", constraints: "ON_DUTY | OFF_DUTY" }
      - { name: committed_minutes, type: integer, source: computed, default: 0, description: "= sum(TechnicianAssignment.planned_minutes for assignments on this technician with status IN {RESERVED, CONFIRMED}); also the routing sort key", constraints: ">= 0" }

  # ------------------------------------------------ TechnicianAssignment -----
  - name: TechnicianAssignment
    parent: null
    common_fields: true
    fields:
      - { name: technician_id, type: string, source: computed, description: "FK -> Technician.id; the technician whose calendar this interval occupies" }
      - { name: service_call_id, type: string, source: computed, default: null, description: "FK -> ServiceCall.id; set when the assignment was created by a service-call dispatch, else null" }
      - { name: preventive_visit_id, type: string, source: computed, default: null, description: "FK -> PreventiveVisit.id; set when the assignment was created by a preventive-visit schedule, else null" }
      - { name: start_at, type: datetime, source: computed, description: "Interval start; the dispatch start_at for a service call, the window_start for a preventive visit" }
      - { name: end_at, type: datetime, source: computed, description: "Interval end; start_at + SEVERITY_PLANNED_MINUTES for a service call, the window_end for a preventive visit" }
      - { name: planned_minutes, type: integer, source: computed, description: "= floor((end_at - start_at) / 60s); the amount added to Technician.committed_minutes while RESERVED or CONFIRMED" }
      - { name: status, type: enum, source: computed, default: RESERVED, description: "RESERVED | CONFIRMED | RELEASED | COMPLETED", constraints: "see state_machines.TechnicianAssignment" }
      - { name: release_reason, type: string, source: computed, default: null, description: "Reason recorded when the assignment moved to RELEASED (operator reason, CONTRACT_SUSPENDED, or VISIT_CANCELLED)" }

  # ---------------------------------------------------- PreventiveVisit ------
  - name: PreventiveVisit
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; the contract the visit is billed against" }
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; must belong to the contract's club" }
      - { name: assigned_technician_id, type: string, source: computed, description: "FK -> Technician.id; the request's technician_id when supplied, otherwise the winner of calculations.technician_routing_selection" }
      - { name: window_start, type: datetime, source: input, description: "Start of the scheduled visit window" }
      - { name: window_end, type: datetime, source: input, description: "End of the scheduled visit window; must be strictly after window_start and at most 480 minutes later" }
      - { name: planned_minutes, type: integer, source: computed, description: "= floor((window_end - window_start) / 60s)" }
      - { name: visit_status, type: enum, source: computed, default: SCHEDULED, description: "Execution dimension: SCHEDULED | IN_PROGRESS | COMPLETED | MISSED | CANCELLED", constraints: "see state_machines.PreventiveVisit (visit_status dimension)" }
      - { name: safety_doc_status, type: enum, source: computed, default: PENDING, description: "Documentation dimension, advanced by its own triggers: PENDING | SUBMITTED | CERTIFIED | REJECTED", constraints: "see state_machines.PreventiveVisit (safety_doc_status dimension)" }
      - { name: checklist, type: array, source: computed, description: "Copied from EquipmentModel.checklist_template at creation. Each element is { code, is_safety_critical, consumable, result, note, consumable_replaced } with result seeded to PENDING." }
      - { name: checklist_total_count, type: integer, source: computed, description: "Number of checklist elements copied from the template; 0 when the template was empty" }
      - { name: checklist_resolved_count, type: integer, source: computed, default: 0, description: "Number of checklist elements whose result is not PENDING" }
      - { name: checklist_failed_count, type: integer, source: computed, default: 0, description: "Number of checklist elements whose result is FAIL" }
      - { name: safety_critical_failed_count, type: integer, source: computed, default: 0, description: "Number of checklist elements with is_safety_critical == true and result == FAIL" }
      - { name: consumables_replaced_count, type: integer, source: computed, default: 0, description: "Number of checklist elements recorded with consumable_replaced == true" }
      - { name: started_at, type: datetime, source: computed, default: null, description: "Logical-clock instant the visit moved to IN_PROGRESS" }
      - { name: completed_at, type: datetime, source: computed, default: null, description: "Logical-clock instant the visit moved to COMPLETED" }
      - { name: usage_hours_at_visit, type: number, source: computed, default: null, description: "Equipment.usage_hours captured at completion; also written back to Equipment.usage_hours_at_last_pm" }
      - { name: inspection_summary, type: string, source: computed, default: null, description: "Safety inspection narrative supplied when safety_doc_status moved to SUBMITTED" }
      - { name: safety_doc_certified_by_id, type: string, source: computed, default: null, description: "Technician id (X-User-ID of the certifying SafetyInspector) recorded when safety_doc_status became CERTIFIED; never equal to assigned_technician_id" }
      - { name: safety_doc_rejection_reason, type: string, source: computed, default: null, description: "Reason recorded when safety_doc_status became REJECTED" }
      - { name: pm_credit_earned, type: boolean, source: computed, default: false, description: "= (visit_status == COMPLETED AND safety_doc_status == CERTIFIED); the only field that reads both dimensions" }
      - { name: cancellation_reason, type: string, source: computed, default: null, description: "Reason recorded when visit_status became CANCELLED (operator reason or CONTRACT_SUSPENDED)" }

  # -------------------------------------------------------- ServiceCall ------
  - name: ServiceCall
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; the contract whose SLA and parts terms govern the call" }
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; must belong to the contract's club" }
      - { name: assigned_technician_id, type: string, source: computed, default: null, description: "FK -> Technician.id; null until dispatch, then the request's technician_id or the routing winner" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | MAJOR | MINOR — scales the SLA target and the reserved technician minutes", constraints: "CRITICAL | MAJOR | MINOR" }
      - { name: symptom_code, type: string, source: input, description: "Reported symptom shorthand", constraints: "1..40 chars" }
      - { name: injury_reported, type: boolean, source: input, default: false, description: "True when a member injury was reported with the fault; forces severity CRITICAL, tags the unit out instead of marking it DOWN, and requires a safety clearance at resolve" }
      - { name: reported_at, type: datetime, source: computed, description: "Logical clock at creation; the start of the SLA window and of the downtime event" }
      - { name: dispatched_at, type: datetime, source: computed, default: null, description: "Logical clock when the call moved to DISPATCHED" }
      - { name: arrived_at, type: datetime, source: computed, default: null, description: "Logical clock when the call moved to ON_SITE the first time; later PARTS_HOLD → ON_SITE cycles never overwrite it" }
      - { name: resolved_at, type: datetime, source: computed, default: null, description: "Logical clock when the call moved to RESOLVED" }
      - { name: sla_target_minutes, type: integer, source: computed, description: "Pinned at creation = round_half_up(contract.sla_response_minutes * SEVERITY_SLA_FACTOR[severity]); later contract changes never re-pin it" }
      - { name: response_minutes, type: integer, source: computed, default: null, description: "= floor((arrived_at - reported_at) / 60s); null until the first arrival" }
      - { name: sla_met, type: boolean, source: computed, default: null, description: "= (response_minutes <= sla_target_minutes); an exactly-equal response counts as met" }
      - { name: status, type: enum, source: computed, default: OPEN, description: "OPEN | DISPATCHED | ON_SITE | PARTS_HOLD | RESOLVED | CANCELLED", constraints: "see state_machines.ServiceCall" }
      - { name: resolution_code, type: string, source: computed, default: null, description: "Resolution shorthand recorded at resolve" }
      - { name: cancellation_reason, type: string, source: computed, default: null, description: "Reason recorded when the call moved to CANCELLED" }
      - { name: safety_review_required, type: boolean, source: computed, default: false, description: "= injury_reported OR equipment was TAGGED_OUT when the call was created; when true a resolve must carry safety_clearance_technician_id" }
      - { name: safety_clearance_technician_id, type: string, source: computed, default: null, description: "Technician id that signed the safety clearance at resolve; never equal to assigned_technician_id" }
      - { name: parts_hold_count, type: integer, source: computed, default: 0, description: "How many times the call has entered PARTS_HOLD; a fourth entry is rejected", constraints: "0..3" }

  # ---------------------------------------------------- PartCatalogEntry -----
  - name: PartCatalogEntry
    parent: null
    common_fields: true
    fields:
      - { name: model_id, type: string, source: input, description: "FK -> EquipmentModel.id; the model the part fits. A part may only be ordered for equipment of this model." }
      - { name: part_number, type: string, source: input, description: "Manufacturer part number", constraints: "1..40 chars" }
      - { name: category, type: enum, source: input, description: "CONSUMABLE | WEAR | STRUCTURAL | ELECTRONIC — decides whether the contract's parts_inclusion covers it", constraints: "CONSUMABLE | WEAR | STRUCTURAL | ELECTRONIC" }
      - { name: unit_price_cents, type: integer, source: input, description: "New-part list price per unit in cents", constraints: ">= 0" }
      - { name: is_critical_spare, type: boolean, source: input, default: false, description: "True when the part is indispensable for its model; only a critical spare's end-of-support declaration cascades onto equipment support_status" }
      - { name: on_hand_qty, type: integer, source: computed, default: 0, description: "New-condition units in stock; seeded from initial_on_hand_qty, decremented on NEW allocation, restored on order cancellation", constraints: ">= 0" }
      - { name: refurb_on_hand_qty, type: integer, source: computed, default: 0, description: "Refurbished units in stock; seeded from initial_refurb_qty, decremented on REFURBISHED or LOANER_SWAP allocation, restored on order cancellation", constraints: ">= 0" }
      - { name: allocated_qty, type: integer, source: computed, default: 0, description: "Units currently held by PartOrder rows with status == ALLOCATED", constraints: ">= 0" }
      - { name: lifecycle_status, type: enum, source: computed, default: ACTIVE, description: "ACTIVE | END_OF_SUPPORT_ANNOUNCED | OBSOLETE — OBSOLETE blocks NEW sourcing; END_OF_SUPPORT_ANNOUNCED is reached when an obsolete critical spare still has refurbished stock", constraints: "ACTIVE | END_OF_SUPPORT_ANNOUNCED | OBSOLETE" }
      - { name: eos_declared_at, type: datetime, source: computed, default: null, description: "Logical clock at which end of support was declared for this part" }

  # ---------------------------------------------------------- PartOrder ------
  - name: PartOrder
    parent: null
    common_fields: true
    fields:
      - { name: service_call_id, type: string, source: computed, description: "FK -> ServiceCall.id; the parts-hold that created the order" }
      - { name: part_id, type: string, source: computed, description: "FK -> PartCatalogEntry.id; the catalogue line being sourced" }
      - { name: qty, type: integer, source: computed, description: "Units ordered, copied from the parts-hold request", constraints: ">= 1" }
      - { name: source, type: enum, source: computed, description: "NEW | REFURBISHED | LOANER_SWAP — sets the price factor 1.00 / 0.60 / 0.00 and which stock bucket is drawn", constraints: "NEW | REFURBISHED | LOANER_SWAP" }
      - { name: list_total_cents, type: integer, source: computed, description: "= round_half_up(part.unit_price_cents * qty * SOURCE_PRICE_FACTOR[source])" }
      - { name: covered_cents, type: integer, source: computed, description: "= list_total_cents when the contract's parts_inclusion covers part.category, else 0" }
      - { name: allowance_draw_cents, type: integer, source: computed, description: "= min(covered_cents, contract.parts_allowance_remaining_cents at allocation time); returned to the contract when the order is cancelled" }
      - { name: club_billable_cents, type: integer, source: computed, description: "= list_total_cents - allowance_draw_cents; what the club is invoiced" }
      - { name: status, type: enum, source: computed, default: ALLOCATED, description: "ALLOCATED | INSTALLED | CANCELLED", constraints: "see state_machines.PartOrder" }
      - { name: installed_at, type: datetime, source: computed, default: null, description: "Logical clock when the order reached INSTALLED" }
      - { name: cancellation_reason, type: string, source: computed, default: null, description: "Reason recorded when the order reached CANCELLED" }

  # ------------------------------------------------------ DowntimeEvent ------
  - name: DowntimeEvent
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: computed, description: "FK -> ServiceContract.id; copied from the originating service call" }
      - { name: equipment_id, type: string, source: computed, description: "FK -> Equipment.id; the unit that was out of service" }
      - { name: service_call_id, type: string, source: computed, description: "FK -> ServiceCall.id; exactly one open event per call" }
      - { name: started_at, type: datetime, source: computed, description: "= service_call.reported_at" }
      - { name: ended_at, type: datetime, source: computed, default: null, description: "Logical clock when the call was resolved" }
      - { name: mitigated_at, type: datetime, source: computed, default: null, description: "Logical clock when a LOANER_SWAP part order for this call reached INSTALLED; caps the billable window" }
      - { name: effective_end_at, type: datetime, source: computed, default: null, description: "= mitigated_at when mitigated_at is not null, else ended_at; the right edge of both credit variants" }
      - { name: downtime_minutes, type: integer, source: computed, default: null, description: "= floor((effective_end_at - started_at) / 60s); wall-clock minutes, the input of the provisional variant" }
      - { name: operating_downtime_minutes, type: integer, source: computed, default: null, description: "Minutes of [started_at, effective_end_at) that fall inside the club's daily [open, close) window, summed per UTC calendar day; the input of the final variant" }
      - { name: provisional_credit_cents, type: integer, source: computed, default: null, description: "Wall-clock credit computed at closure by calculations.downtime_credit variant provisional_wall_clock" }
      - { name: final_credit_cents, type: integer, source: computed, default: null, description: "Operating-hours credit computed at reconciliation by calculations.downtime_credit variant final_operating_hours" }
      - { name: posted_credit_cents, type: integer, source: computed, default: null, description: "Portion of final_credit_cents that fitted under the contract's credit_cap_cents and was posted to credit_accrued_cents" }
      - { name: status, type: enum, source: computed, default: OPEN, description: "OPEN | CLOSED | RECONCILED | WAIVED", constraints: "see state_machines.DowntimeEvent" }
      - { name: period_key, type: string, source: computed, default: null, description: "'YYYY-MM' of effective_end_at; the reconciliation batch key" }
      - { name: waive_reason, type: string, source: computed, default: null, description: "Reason recorded when the event was waived" }

  # ------------------------------------------------------- RenewalQuote ------
  - name: RenewalQuote
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: computed, description: "FK -> ServiceContract.id; the contract being re-priced" }
      - { name: issued_at, type: datetime, source: computed, description: "Logical clock at quote creation; also the right edge of the service-history counting window" }
      - { name: expires_at, type: datetime, source: computed, description: "= issued_at + 30 days; an accept or decline after this instant is rejected" }
      - { name: line_items, type: array, source: computed, description: "One element per covered Equipment ordered by Equipment.created_at ASC: { equipment_id, age_years, age_multiplier, condition_multiplier, line_cents }" }
      - { name: quoted_base_cents, type: integer, source: computed, description: "= sum of line_items[].line_cents, each already rounded to whole cents before the sum" }
      - { name: parts_surcharge_cents, type: integer, source: computed, description: "= round_half_up(quoted_base_cents * PARTS_SURCHARGE_PCT[contract.parts_inclusion]); keyed on quoted_base_cents, never on any later subtotal" }
      - { name: history_surcharge_cents, type: integer, source: computed, description: "= round_half_up(quoted_base_cents * history_load_pct); keyed on quoted_base_cents" }
      - { name: history_load_pct, type: number, source: computed, description: "= min(0.25, 0.03 * sla_breach_count + 0.015 * critical_call_count)", constraints: "0.000..0.250" }
      - { name: subtotal_cents, type: integer, source: computed, description: "= quoted_base_cents + parts_surcharge_cents + history_surcharge_cents" }
      - { name: compliance_discount_pct, type: number, source: computed, description: "0.05 when pm_compliance_pct_snapshot >= 90.00, 0.02 when >= 75.00, else 0.00" }
      - { name: compliance_discount_cents, type: integer, source: computed, description: "= round_half_up(subtotal_cents * compliance_discount_pct); keyed on subtotal_cents" }
      - { name: quoted_annual_cents, type: integer, source: computed, description: "Floor then cap: max(subtotal_cents - compliance_discount_cents, round_half_up(contract.annual_base_cents * 0.90)) then min(that, round_half_up(contract.annual_base_cents * 1.35))" }
      - { name: fleet_age_index, type: number, source: computed, description: "= round_half_up(sum(line_items[].age_multiplier) / covered_unit_count, 2)", constraints: "2 decimal places" }
      - { name: sla_breach_count, type: integer, source: computed, description: "Count of ServiceCall rows on the contract with status == RESOLVED AND sla_met == false AND reported_at in [term_start_date 00:00:00Z, issued_at)" }
      - { name: critical_call_count, type: integer, source: computed, description: "Count of ServiceCall rows on the contract with status == RESOLVED AND severity == CRITICAL AND reported_at in [term_start_date 00:00:00Z, issued_at)" }
      - { name: pm_compliance_pct_snapshot, type: number, source: computed, description: "contract.pm_compliance_pct read at issue time" }
      - { name: floor_applied, type: boolean, source: computed, description: "True when the 90%-of-prior-base floor raised the quote" }
      - { name: cap_applied, type: boolean, source: computed, description: "True when the 135%-of-prior-base cap lowered the quote" }
      - { name: status, type: enum, source: computed, default: ISSUED, description: "ISSUED | ACCEPTED | DECLINED | SUPERSEDED", constraints: "see state_machines.RenewalQuote" }
      - { name: decline_reason, type: string, source: computed, default: null, description: "Reason recorded when the quote was declined" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # -------------------------------------------------- ServiceContract --------
  # Shape: branching + cyclic. ACTIVE ⇄ SUSPENDED is a revision loop,
  # RENEWAL_QUOTED → RENEWAL_QUOTED is a re-quote cycle, and RENEWAL_QUOTED
  # forks into RENEWED or EXPIRED with disjoint side-effect sets.
  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [RENEWED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /fleetcare/contracts/{contractId}/activate"
        actor: ContractAdministrator
        preconditions:
          - "contract.status == DRAFT"
          - "no other ServiceContract on the same club_id has status IN {ACTIVE, SUSPENDED, RENEWAL_QUOTED}"
        side_effects:
          - "contract.status = ACTIVE"
          - "increments ServiceContract.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fleetcare/contracts/{contractId}/suspend"
        actor: ContractAdministrator
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "contract.status = SUSPENDED, contract.suspension_reason = request.reason"
          - "CASCADE hop 1: every PreventiveVisit with contract_id == contract.id AND visit_status == SCHEDULED moves to visit_status CANCELLED with cancellation_reason = 'CONTRACT_SUSPENDED' (visits already IN_PROGRESS, COMPLETED, MISSED or CANCELLED are untouched)"
          - "CASCADE hop 2: because those visits became CANCELLED, each of their TechnicianAssignment rows with status == RESERVED moves to status RELEASED with release_reason = 'CONTRACT_SUSPENDED'"
          - "CASCADE hop 3: because those assignments became RELEASED, each affected Technician.committed_minutes is reduced by that assignment's planned_minutes"
          - "increments ServiceContract.version by 1"
        note: "Open ServiceCall rows are deliberately left alone — safety work continues while commercial terms are frozen."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fleetcare/contracts/{contractId}/reinstate"
        actor: ContractAdministrator
        preconditions:
          - "contract.status == SUSPENDED"
          - "CROSS-ENTITY: Club.open_safety_lockout_count == 0 for the contract's club — no covered Equipment may sit in lifecycle_status TAGGED_OUT"
        side_effects:
          - "contract.status = ACTIVE, contract.suspension_reason = null"
          - "increments ServiceContract.version by 1"

      - from: ACTIVE
        to: RENEWAL_QUOTED
        trigger: "POST /fleetcare/contracts/{contractId}/renewal-quotes"
        actor: ContractAdministrator
        preconditions:
          - "contract.status == ACTIVE"
          - "request.expected_contract_version == contract.version"
          - "the contract's covered fleet is non-empty (Club.covered_unit_count >= 1)"
        side_effects:
          - "creates one RenewalQuote in status ISSUED whose numbers come from calculations.renewal_quote_pricing"
          - "contract.status = RENEWAL_QUOTED"
          - "increments ServiceContract.version by 1"

      - from: RENEWAL_QUOTED
        to: RENEWAL_QUOTED
        trigger: "POST /fleetcare/contracts/{contractId}/renewal-quotes (re-quote)"
        actor: ContractAdministrator
        preconditions:
          - "contract.status == RENEWAL_QUOTED"
          - "request.expected_contract_version == contract.version"
          - "the contract's covered fleet is non-empty"
        side_effects:
          - "the existing RenewalQuote with status ISSUED on this contract moves to status SUPERSEDED"
          - "creates a fresh RenewalQuote in status ISSUED re-priced against current fleet and history"
          - "contract.status stays RENEWAL_QUOTED"
          - "increments ServiceContract.version by 1"
        note: "Cycle. This legitimate supersede is why the endpoint is guarded by OCC (§1.2.1 quote-create-stale-contract) instead of a state precondition."

      - from: RENEWAL_QUOTED
        to: RENEWED
        trigger: "POST /fleetcare/renewal-quotes/{quoteId}/accept"
        actor: ClubManager
        preconditions:
          - "contract.status == RENEWAL_QUOTED"
          - "quote.status == ISSUED"
          - "current logical clock < quote.expires_at"
        side_effects:
          - "quote.status = ACCEPTED"
          - "contract.status = RENEWED"
          - "increments ServiceContract.version by 1"
        note: "Fork branch A. Terminal for this term; the renewed term is transacted as a new contract row."

      - from: RENEWAL_QUOTED
        to: EXPIRED
        trigger: "POST /fleetcare/renewal-quotes/{quoteId}/decline"
        actor: ClubManager
        preconditions:
          - "contract.status == RENEWAL_QUOTED"
          - "quote.status == ISSUED"
          - "current logical clock < quote.expires_at"
        side_effects:
          - "quote.status = DECLINED, quote.decline_reason = request.reason"
          - "contract.status = EXPIRED"
          - "every PreventiveVisit with contract_id == contract.id AND visit_status == SCHEDULED moves to CANCELLED with cancellation_reason = 'CONTRACT_EXPIRED', and each such visit's RESERVED TechnicianAssignment moves to RELEASED, reducing that Technician.committed_minutes by planned_minutes"
          - "increments ServiceContract.version by 1"
        note: "Fork branch B — divergent side-effect set from ACCEPT: only the decline branch tears down the forward schedule."

  # ------------------------------------------------------- ServiceCall -------
  # Shape: cyclic. ON_SITE → PARTS_HOLD → ON_SITE may repeat up to three times.
  - entity: ServiceCall
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /fleetcare/service-calls (creation)"
        actor: ClubManager
        preconditions:
          - "contract.status == ACTIVE"
          - "equipment.club_id == contract.club_id"
          - "no other ServiceCall on the same equipment_id has status IN {OPEN, DISPATCHED, ON_SITE, PARTS_HOLD}"
          - "when request.injury_reported == true then request.severity == CRITICAL"
        side_effects:
          - "call.reported_at = current logical clock; call.sla_target_minutes = round_half_up(contract.sla_response_minutes * SEVERITY_SLA_FACTOR[severity])"
          - "call.safety_review_required = (injury_reported == true OR equipment.lifecycle_status == TAGGED_OUT at creation)"
          - "equipment.lifecycle_status = TAGGED_OUT with safety_lockout_reason = 'MEMBER_INJURY' when injury_reported == true; otherwise equipment.lifecycle_status = DOWN when it was IN_SERVICE (a unit already TAGGED_OUT stays TAGGED_OUT)"
          - "creates one DowntimeEvent in status OPEN with started_at = call.reported_at, contract_id, equipment_id and service_call_id copied from the call"
          - "Club.open_safety_lockout_count is recomputed"
        note: "Creation row; the state machine's initial_state is OPEN."

      - from: OPEN
        to: DISPATCHED
        trigger: "POST /fleetcare/service-calls/{callId}/dispatch"
        actor: ServiceCoordinator
        preconditions:
          - "call.status == OPEN"
          - "CROSS-ENTITY: contract.status == ACTIVE (a SUSPENDED or EXPIRED contract cannot dispatch)"
          - "the chosen technician is eligible per calculations.technician_routing_selection (duty_status ON_DUTY, region match, skill match, committed-minutes headroom, no interval collision)"
          - "when equipment.lifecycle_status == TAGGED_OUT the chosen technician must have is_safety_inspector == true"
        side_effects:
          - "call.assigned_technician_id = the request's technician_id, or the routing winner when technician_id was omitted"
          - "call.dispatched_at = current logical clock; call.status = DISPATCHED"
          - "creates one TechnicianAssignment in status RESERVED with start_at = request.start_at, end_at = start_at + SEVERITY_PLANNED_MINUTES[severity], planned_minutes = that span, service_call_id = call.id, preventive_visit_id = null"
          - "Technician.committed_minutes increases by the assignment's planned_minutes"

      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /fleetcare/service-calls/{callId}/arrive"
        actor: FieldTechnician
        preconditions:
          - "call.status == DISPATCHED"
          - "X-User-ID == call.assigned_technician_id"
        side_effects:
          - "call.arrived_at = current logical clock; call.response_minutes = floor((arrived_at - reported_at)/60s); call.sla_met = (response_minutes <= sla_target_minutes)"
          - "call.status = ON_SITE"
          - "the call's TechnicianAssignment moves from RESERVED to CONFIRMED (committed_minutes unchanged)"

      - from: ON_SITE
        to: PARTS_HOLD
        trigger: "POST /fleetcare/service-calls/{callId}/parts-hold"
        actor: FieldTechnician
        preconditions:
          - "call.status == ON_SITE"
          - "X-User-ID == call.assigned_technician_id"
          - "call.parts_hold_count < 3"
          - "part.model_id == equipment.model_id"
          - "the requested source is available per validations priority 22/23 (stock on hand, lifecycle_status)"
          - "when the part category is covered by contract.parts_inclusion then contract.parts_allowance_remaining_cents > 0"
        side_effects:
          - "creates one PartOrder in status ALLOCATED with the money fields from calculations.part_order_cost_allocation"
          - "part.on_hand_qty (source NEW) or part.refurb_on_hand_qty (source REFURBISHED or LOANER_SWAP) decreases by qty; part.allocated_qty increases by qty"
          - "contract.parts_allowance_remaining_cents decreases by the order's allowance_draw_cents"
          - "call.status = PARTS_HOLD; call.parts_hold_count increases by 1"

      - from: PARTS_HOLD
        to: ON_SITE
        trigger: "POST /fleetcare/service-calls/{callId}/resume"
        actor: FieldTechnician
        preconditions:
          - "call.status == PARTS_HOLD"
          - "X-User-ID == call.assigned_technician_id"
          - "no PartOrder for this call is still in status ALLOCATED"
        side_effects:
          - "call.status = ON_SITE (call.arrived_at and call.response_minutes are NOT recomputed)"
        note: "Closes the cycle; a call may traverse ON_SITE → PARTS_HOLD → ON_SITE up to three times."

      - from: ON_SITE
        to: RESOLVED
        trigger: "POST /fleetcare/service-calls/{callId}/resolve"
        actor: FieldTechnician
        preconditions:
          - "call.status == ON_SITE"
          - "X-User-ID == call.assigned_technician_id"
          - "when call.safety_review_required == true then request.safety_clearance_technician_id is present, references a Technician with is_safety_inspector == true, and differs from call.assigned_technician_id"
        side_effects:
          - "call.status = RESOLVED, call.resolved_at = current logical clock, call.resolution_code = request.resolution_code, call.safety_clearance_technician_id = request.safety_clearance_technician_id"
          - "the call's TechnicianAssignment moves from CONFIRMED to COMPLETED and Technician.committed_minutes is reduced by its planned_minutes"
          - "CASCADE hop 1: the call's DowntimeEvent moves OPEN → CLOSED with ended_at = clock, effective_end_at, downtime_minutes, operating_downtime_minutes, period_key and provisional_credit_cents all computed"
          - "CASCADE hop 2: because that event closed, Equipment.downtime_minutes_ytd increases by event.downtime_minutes, contract.credit_provisional_cents increases by event.provisional_credit_cents, and equipment.lifecycle_status returns to IN_SERVICE (from DOWN always; from TAGGED_OUT only when a safety clearance was signed, which also sets equipment.last_safety_clearance_at and clears safety_lockout_reason)"
          - "CASCADE hop 3: because Equipment.downtime_minutes_ytd and the resolved-call history changed, equipment.health_score and health_score_variant are recomputed by calculations.equipment_health_score"
          - "CASCADE hop 4: because health_score changed, equipment.replacement_recommended is re-evaluated against the 40.00 / 60.00 thresholds"
          - "CASCADE hop 5: because replacement_recommended flipped, contract.replacement_candidate_count is recomputed and contract.fleet_renewal_risk is re-derived from the new ratio"
          - "Club.open_safety_lockout_count is recomputed"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /fleetcare/service-calls/{callId}/cancel"
        actor: ServiceCoordinator
        preconditions:
          - "call.status IN {OPEN, DISPATCHED}"
        side_effects:
          - "call.status = CANCELLED, call.cancellation_reason = request.reason"
          - "the call's DowntimeEvent (status OPEN) moves to WAIVED with waive_reason = 'CALL_CANCELLED'; no credit is computed"
          - "equipment.lifecycle_status returns to IN_SERVICE when it was DOWN (a TAGGED_OUT unit stays TAGGED_OUT)"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /fleetcare/service-calls/{callId}/cancel"
        actor: ServiceCoordinator
        preconditions:
          - "call.status IN {OPEN, DISPATCHED}"
        side_effects:
          - "call.status = CANCELLED, call.cancellation_reason = request.reason"
          - "the call's TechnicianAssignment moves from RESERVED to RELEASED with release_reason = 'CALL_CANCELLED' and Technician.committed_minutes is reduced by its planned_minutes"
          - "the call's DowntimeEvent (status OPEN) moves to WAIVED with waive_reason = 'CALL_CANCELLED'"
          - "equipment.lifecycle_status returns to IN_SERVICE when it was DOWN"

  # ---------------------------------------------------- PreventiveVisit ------
  # Shape: two independent dimensions on one row. `visit_status` is driven by
  # start/complete/cancel/mark-missed; `safety_doc_status` is driven by the
  # safety-doc endpoints and may advance before, during or after completion.
  - entity: PreventiveVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /fleetcare/preventive-visits (creation)"
        actor: ServiceCoordinator
        preconditions:
          - "contract.status == ACTIVE"
          - "equipment.club_id == contract.club_id"
          - "window_end > window_start and (window_end - window_start) <= 480 minutes"
          - "the club's closed-interval visit capacity is not exceeded (validations priority 43)"
          - "the chosen technician has no colliding interval under the 45-minute buffer rule (validations priority 44)"
        side_effects:
          - "visit.visit_status = SCHEDULED, visit.safety_doc_status = PENDING"
          - "visit.checklist is copied element-by-element from EquipmentModel.checklist_template with result = PENDING; checklist_total_count is set, all other counters 0"
          - "visit.assigned_technician_id = request.technician_id or the routing winner"
          - "creates one TechnicianAssignment in status RESERVED with start_at = window_start, end_at = window_end, preventive_visit_id = visit.id, service_call_id = null"
          - "Technician.committed_minutes increases by the assignment's planned_minutes"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /fleetcare/preventive-visits/{visitId}/start"
        actor: FieldTechnician
        preconditions:
          - "visit.visit_status == SCHEDULED"
          - "X-User-ID == visit.assigned_technician_id"
          - "CROSS-ENTITY: equipment.lifecycle_status != TAGGED_OUT"
        side_effects:
          - "visit.visit_status = IN_PROGRESS, visit.started_at = current logical clock"
          - "the visit's TechnicianAssignment moves from RESERVED to CONFIRMED"

      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /fleetcare/preventive-visits/{visitId}/checklist-results"
        actor: FieldTechnician
        preconditions:
          - "visit.visit_status == IN_PROGRESS"
          - "X-User-ID == visit.assigned_technician_id"
          - "request.item_code matches a checklist element code on this visit"
        side_effects:
          - "the matching checklist element's result, note and consumable_replaced are overwritten (recording the same code twice replaces the earlier result)"
          - "checklist_resolved_count, checklist_failed_count, safety_critical_failed_count and consumables_replaced_count are recomputed from the checklist array"
          - "when the element has is_safety_critical == true and the recorded result is FAIL: equipment.lifecycle_status = TAGGED_OUT with safety_lockout_reason = 'SAFETY_CRITICAL_FAIL' and Club.open_safety_lockout_count is recomputed"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /fleetcare/preventive-visits/{visitId}/complete"
        actor: FieldTechnician
        preconditions:
          - "visit.visit_status == IN_PROGRESS"
          - "X-User-ID == visit.assigned_technician_id"
          - "checklist_resolved_count == checklist_total_count (an empty checklist satisfies this trivially)"
          - "safety_critical_failed_count == 0"
        side_effects:
          - "visit.visit_status = COMPLETED, visit.completed_at = current logical clock, visit.usage_hours_at_visit = equipment.usage_hours"
          - "equipment.usage_hours_at_last_pm = equipment.usage_hours and equipment.pm_status is recomputed to OK"
          - "the visit's TechnicianAssignment moves from CONFIRMED to COMPLETED and Technician.committed_minutes is reduced by its planned_minutes"
          - "contract.pm_visits_completed_count increases by 1 and contract.pm_compliance_pct is recomputed"
          - "visit.pm_credit_earned becomes true only if safety_doc_status is already CERTIFIED"

      - from: SCHEDULED
        to: MISSED
        trigger: "POST /fleetcare/preventive-visits/{visitId}/mark-missed"
        actor: ServiceCoordinator
        preconditions:
          - "visit.visit_status == SCHEDULED"
          - "current logical clock >= visit.window_end"
        side_effects:
          - "visit.visit_status = MISSED"
          - "the visit's RESERVED TechnicianAssignment moves to RELEASED with release_reason = 'VISIT_MISSED' and Technician.committed_minutes is reduced by planned_minutes"
          - "contract.pm_visits_missed_count increases by 1 and contract.pm_compliance_pct is recomputed"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fleetcare/preventive-visits/{visitId}/cancel"
        actor: ServiceCoordinator
        preconditions:
          - "visit.visit_status == SCHEDULED"
        side_effects:
          - "visit.visit_status = CANCELLED, visit.cancellation_reason = request.reason"
          - "the visit's RESERVED TechnicianAssignment moves to RELEASED with release_reason = 'VISIT_CANCELLED' and Technician.committed_minutes is reduced by planned_minutes"
          - "contract.pm_compliance_pct is NOT affected — cancelled visits enter neither the completed nor the missed counter"

      - from: PENDING
        to: SUBMITTED
        trigger: "POST /fleetcare/preventive-visits/{visitId}/safety-doc/submit"
        actor: FieldTechnician
        preconditions:
          - "visit.safety_doc_status IN {PENDING, REJECTED}"
          - "visit.visit_status IN {IN_PROGRESS, COMPLETED}"
          - "X-User-ID == visit.assigned_technician_id"
        side_effects:
          - "visit.safety_doc_status = SUBMITTED, visit.inspection_summary = request.inspection_summary, visit.safety_doc_rejection_reason = null"
        note: "safety_doc_status dimension. REJECTED → SUBMITTED is the documentation dimension's own cycle."

      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /fleetcare/preventive-visits/{visitId}/safety-doc/certify"
        actor: SafetyInspector
        preconditions:
          - "visit.safety_doc_status == SUBMITTED"
          - "the acting Technician has is_safety_inspector == true"
          - "SEGREGATION OF DUTIES: X-User-ID != visit.assigned_technician_id"
        side_effects:
          - "visit.safety_doc_status = CERTIFIED, visit.safety_doc_certified_by_id = X-User-ID"
          - "visit.pm_credit_earned becomes true when visit_status is already COMPLETED"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /fleetcare/preventive-visits/{visitId}/safety-doc/reject"
        actor: SafetyInspector
        preconditions:
          - "visit.safety_doc_status == SUBMITTED"
          - "the acting Technician has is_safety_inspector == true"
          - "SEGREGATION OF DUTIES: X-User-ID != visit.assigned_technician_id"
        side_effects:
          - "visit.safety_doc_status = REJECTED, visit.safety_doc_rejection_reason = request.rejection_reason, visit.pm_credit_earned = false"
          - "CASCADE hop 1: equipment.lifecycle_status = TAGGED_OUT with safety_lockout_reason = 'SAFETY_DOC_REJECTED' and Club.open_safety_lockout_count is recomputed"
          - "CASCADE hop 2: because the unit is now TAGGED_OUT, any ServiceContract on that club in status SUSPENDED can no longer be reinstated until a clearance is signed (enforced as the reinstate precondition, not as a stored field)"

  # ---------------------------------------------------------- Equipment ------
  - entity: Equipment
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: DOWN
        trigger: "POST /fleetcare/service-calls (creation with injury_reported == false)"
        actor: ClubManager
        preconditions: ["equipment.lifecycle_status == IN_SERVICE"]
        side_effects: ["equipment.lifecycle_status = DOWN", "a DowntimeEvent is opened for the call"]

      - from: IN_SERVICE
        to: TAGGED_OUT
        trigger: "POST /fleetcare/equipment/{equipmentId}/tag-out, a rejected visit safety document, a failed safety-critical checklist item, or a service call with injury_reported == true"
        actor: SafetyInspector
        preconditions: ["equipment.lifecycle_status IN {IN_SERVICE, DOWN}"]
        side_effects:
          - "equipment.lifecycle_status = TAGGED_OUT, equipment.safety_lockout_reason set to the triggering reason"
          - "Club.open_safety_lockout_count increases by 1"

      - from: DOWN
        to: TAGGED_OUT
        trigger: "POST /fleetcare/equipment/{equipmentId}/tag-out while a service call is open"
        actor: SafetyInspector
        preconditions: ["equipment.lifecycle_status == DOWN"]
        side_effects:
          - "equipment.lifecycle_status = TAGGED_OUT, safety_lockout_reason = 'INSPECTOR_TAG_OUT'"
          - "the open ServiceCall on this unit gets safety_review_required = true, so its resolve will demand a clearance signature"
          - "Club.open_safety_lockout_count increases by 1"

      - from: DOWN
        to: IN_SERVICE
        trigger: "POST /fleetcare/service-calls/{callId}/resolve or /cancel"
        actor: FieldTechnician
        preconditions: ["equipment.lifecycle_status == DOWN"]
        side_effects: ["equipment.lifecycle_status = IN_SERVICE", "health_score and replacement_recommended are recomputed on resolve"]

      - from: TAGGED_OUT
        to: IN_SERVICE
        trigger: "POST /fleetcare/service-calls/{callId}/resolve carrying safety_clearance_technician_id"
        actor: FieldTechnician
        preconditions:
          - "equipment.lifecycle_status == TAGGED_OUT"
          - "the resolve request carries a valid clearance signature from an inspector other than the assigned technician"
        side_effects:
          - "equipment.lifecycle_status = IN_SERVICE, equipment.safety_lockout_reason = null, equipment.last_safety_clearance_at = current logical clock"
          - "Club.open_safety_lockout_count decreases by 1"
        note: "The only exit from TAGGED_OUT — a lockout is cleared by documented clearance work, never by a bare status write."

  # ------------------------------------------------------- DowntimeEvent -----
  - entity: DowntimeEvent
    initial_state: OPEN
    terminal_states: [WAIVED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /fleetcare/service-calls/{callId}/resolve"
        actor: FieldTechnician
        preconditions: ["event.status == OPEN", "the owning ServiceCall is transitioning ON_SITE → RESOLVED"]
        side_effects:
          - "event.ended_at = clock; event.effective_end_at = mitigated_at when set, else ended_at"
          - "event.downtime_minutes, event.operating_downtime_minutes, event.period_key and event.provisional_credit_cents are computed (calculations.downtime_credit variant provisional_wall_clock)"
          - "Equipment.downtime_minutes_ytd and contract.credit_provisional_cents increase accordingly"

      - from: CLOSED
        to: RECONCILED
        trigger: "POST /fleetcare/contracts/{contractId}/credit-reconciliations"
        actor: ContractAdministrator
        preconditions:
          - "event.status == CLOSED"
          - "event.period_key == request.period_key"
          - "event.contract_id == the contract being reconciled"
        side_effects:
          - "event.final_credit_cents is computed with calculations.downtime_credit variant final_operating_hours"
          - "event.posted_credit_cents = the part of final_credit_cents that fits under contract.credit_cap_cents (events are reconciled in created_at ASC order and the cap is consumed in that order)"
          - "event.status = RECONCILED"
          - "contract.credit_accrued_cents increases by posted_credit_cents; contract.credit_forgone_cents increases by (final_credit_cents - posted_credit_cents); contract.last_reconciled_period_key = request.period_key"
          - "increments ServiceContract.version by 1"

      - from: OPEN
        to: WAIVED
        trigger: "POST /fleetcare/downtime-events/{eventId}/waive or a service-call cancellation"
        actor: ContractAdministrator
        preconditions: ["event.status == OPEN"]
        side_effects:
          - "event.status = WAIVED, event.waive_reason recorded; no credit fields are populated"

      - from: CLOSED
        to: WAIVED
        trigger: "POST /fleetcare/downtime-events/{eventId}/waive"
        actor: ContractAdministrator
        preconditions: ["event.status == CLOSED"]
        side_effects:
          - "event.status = WAIVED, event.waive_reason = request.waive_reason"
          - "COMPENSATION: contract.credit_provisional_cents decreases by event.provisional_credit_cents and Equipment.downtime_minutes_ytd decreases by event.downtime_minutes, restoring both to their pre-closure values"
          - "equipment.health_score, health_score_variant and replacement_recommended are recomputed, then contract.replacement_candidate_count and fleet_renewal_risk are re-derived"

      - from: RECONCILED
        to: WAIVED
        trigger: "POST /fleetcare/downtime-events/{eventId}/waive"
        actor: ContractAdministrator
        preconditions: ["event.status == RECONCILED"]
        side_effects:
          - "event.status = WAIVED, event.waive_reason = request.waive_reason"
          - "COMPENSATION: contract.credit_accrued_cents decreases by event.posted_credit_cents, contract.credit_forgone_cents decreases by (event.final_credit_cents - event.posted_credit_cents), and contract.credit_provisional_cents decreases by event.provisional_credit_cents"
          - "Equipment.downtime_minutes_ytd decreases by event.downtime_minutes, then health_score and replacement_recommended are recomputed and the contract's replacement_candidate_count / fleet_renewal_risk re-derived"

  # -------------------------------------------- TechnicianAssignment ---------
  - entity: TechnicianAssignment
    initial_state: RESERVED
    terminal_states: [RELEASED, COMPLETED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /fleetcare/service-calls/{callId}/arrive or POST /fleetcare/preventive-visits/{visitId}/start"
        actor: FieldTechnician
        preconditions: ["assignment.status == RESERVED"]
        side_effects: ["assignment.status = CONFIRMED", "Technician.committed_minutes unchanged (RESERVED and CONFIRMED both occupy the calendar)"]

      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /fleetcare/service-calls/{callId}/resolve or POST /fleetcare/preventive-visits/{visitId}/complete"
        actor: FieldTechnician
        preconditions: ["assignment.status == CONFIRMED"]
        side_effects: ["assignment.status = COMPLETED", "Technician.committed_minutes decreases by assignment.planned_minutes"]

      - from: RESERVED
        to: RELEASED
        trigger: "POST /fleetcare/technician-assignments/{assignmentId}/release, visit cancel / mark-missed, contract suspend or expire, service-call cancel"
        actor: ServiceCoordinator
        preconditions: ["assignment.status == RESERVED"]
        side_effects:
          - "assignment.status = RELEASED, assignment.release_reason recorded"
          - "Technician.committed_minutes decreases by assignment.planned_minutes"
          - "when the assignment belonged to a SCHEDULED PreventiveVisit reached through the release endpoint, the visit's visit_status is unchanged and assigned_technician_id is retained for audit"

      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /fleetcare/technician-assignments/{assignmentId}/release"
        actor: ServiceCoordinator
        preconditions: ["assignment.status == CONFIRMED"]
        side_effects:
          - "assignment.status = RELEASED, assignment.release_reason = request.reason"
          - "Technician.committed_minutes decreases by assignment.planned_minutes"

  # ------------------------------------------------------------ PartOrder ----
  - entity: PartOrder
    initial_state: ALLOCATED
    terminal_states: [INSTALLED, CANCELLED]
    transitions:
      - from: ALLOCATED
        to: INSTALLED
        trigger: "POST /fleetcare/part-orders/{orderId}/install"
        actor: FieldTechnician
        preconditions:
          - "order.status == ALLOCATED"
          - "the owning ServiceCall.status == PARTS_HOLD"
          - "X-User-ID == the owning call's assigned_technician_id"
        side_effects:
          - "order.status = INSTALLED, order.installed_at = clock; part.allocated_qty decreases by qty (stock buckets are not restored — the unit was consumed)"
          - "when order.source == LOANER_SWAP: equipment.loaner_active = true and the call's OPEN DowntimeEvent gets mitigated_at = clock, which caps both credit variants at the loaner swap instant"

      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /fleetcare/part-orders/{orderId}/cancel"
        actor: ServiceCoordinator
        preconditions: ["order.status == ALLOCATED"]
        side_effects:
          - "order.status = CANCELLED, order.cancellation_reason = request.reason"
          - "COMPENSATION: contract.parts_allowance_remaining_cents increases by order.allowance_draw_cents, then order.allowance_draw_cents = 0 and order.club_billable_cents = 0"
          - "COMPENSATION: part.on_hand_qty (source NEW) or part.refurb_on_hand_qty (source REFURBISHED or LOANER_SWAP) increases by qty and part.allocated_qty decreases by qty"

  # -------------------------------------------------------- RenewalQuote -----
  - entity: RenewalQuote
    initial_state: ISSUED
    terminal_states: [ACCEPTED, DECLINED, SUPERSEDED]
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /fleetcare/renewal-quotes/{quoteId}/accept"
        actor: ClubManager
        preconditions: ["quote.status == ISSUED", "clock < quote.expires_at", "contract.status == RENEWAL_QUOTED"]
        side_effects: ["quote.status = ACCEPTED", "contract.status = RENEWED", "increments ServiceContract.version by 1"]

      - from: ISSUED
        to: DECLINED
        trigger: "POST /fleetcare/renewal-quotes/{quoteId}/decline"
        actor: ClubManager
        preconditions: ["quote.status == ISSUED", "clock < quote.expires_at", "contract.status == RENEWAL_QUOTED"]
        side_effects: ["quote.status = DECLINED, quote.decline_reason recorded", "contract.status = EXPIRED with the forward-schedule teardown described on the contract transition", "increments ServiceContract.version by 1"]

      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /fleetcare/contracts/{contractId}/renewal-quotes (re-quote)"
        actor: ContractAdministrator
        preconditions: ["quote.status == ISSUED", "a fresh quote is being issued on the same contract"]
        side_effects: ["quote.status = SUPERSEDED (its numbers are frozen for audit)"]

  # ------------------------------------------------------- PartCatalogEntry --
  - entity: PartCatalogEntry
    initial_state: ACTIVE
    terminal_states: [OBSOLETE]
    transitions:
      - from: ACTIVE
        to: END_OF_SUPPORT_ANNOUNCED
        trigger: "POST /fleetcare/parts/{partId}/declare-end-of-support while refurb_on_hand_qty > 0"
        actor: PartsPlanner
        preconditions: ["part.lifecycle_status == ACTIVE", "part.refurb_on_hand_qty > 0"]
        side_effects:
          - "part.lifecycle_status = END_OF_SUPPORT_ANNOUNCED, part.eos_declared_at = clock"
          - "CASCADE hop 1 (only when is_critical_spare == true): every Equipment with model_id == part.model_id gets support_status = END_OF_SUPPORT_ANNOUNCED and eos_notified_at = clock"
          - "CASCADE hop 2: because support_status changed, each touched Equipment's replacement_recommended is re-evaluated (the 60.00 threshold applies only to UNSUPPORTED units, so an ANNOUNCED unit keeps the 40.00 threshold)"
          - "CASCADE hop 3: because those flags changed, each affected ServiceContract's obsolete_unit_count, replacement_candidate_count and fleet_renewal_risk are recomputed"

      - from: ACTIVE
        to: OBSOLETE
        trigger: "POST /fleetcare/parts/{partId}/declare-end-of-support while refurb_on_hand_qty == 0"
        actor: PartsPlanner
        preconditions: ["part.lifecycle_status == ACTIVE", "part.refurb_on_hand_qty == 0"]
        side_effects:
          - "part.lifecycle_status = OBSOLETE, part.eos_declared_at = clock; NEW sourcing of this part is refused from now on"
          - "CASCADE hop 1 (only when is_critical_spare == true): every Equipment with model_id == part.model_id gets support_status = UNSUPPORTED and eos_notified_at = clock"
          - "CASCADE hop 2: because support_status became UNSUPPORTED, replacement_recommended is re-evaluated against the relaxed 60.00 threshold and flips true for any unit whose health_score is at or below it"
          - "CASCADE hop 3: because obsolete_unit_count and replacement_candidate_count changed on the covering ServiceContract, contract.fleet_renewal_risk is re-derived"
        note: "Conditional cascade: a part with is_critical_spare == false changes only its own row."

      - from: END_OF_SUPPORT_ANNOUNCED
        to: OBSOLETE
        trigger: "POST /fleetcare/parts/{partId}/inventory-adjustments that drives refurb_on_hand_qty to 0"
        actor: PartsPlanner
        preconditions: ["part.lifecycle_status == END_OF_SUPPORT_ANNOUNCED", "the adjustment leaves refurb_on_hand_qty == 0"]
        side_effects:
          - "part.lifecycle_status = OBSOLETE"
          - "CASCADE (only when is_critical_spare == true): every Equipment with model_id == part.model_id moves support_status from END_OF_SUPPORT_ANNOUNCED to UNSUPPORTED, then replacement_recommended, contract.obsolete_unit_count, contract.replacement_candidate_count and contract.fleet_renewal_risk are recomputed in that order"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on ServiceContract.version only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-create-stale-contract
    parent_entity: ServiceContract
    write_endpoint: "POST /fleetcare/contracts/{contractId}/renewal-quotes"
    occ_field: "expected_contract_version"
    description: |
      Issuing a renewal quote against a ServiceContract whose version has advanced
      since the client last read it is rejected. A re-quote is a legitimate product
      operation — it supersedes the previously ISSUED quote — so a writer holding a
      stale view of the contract would otherwise silently discard a quote it never
      saw, together with the fleet and history changes that produced it.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: credit-reconciliation-stale-contract
    parent_entity: ServiceContract
    write_endpoint: "POST /fleetcare/contracts/{contractId}/credit-reconciliations"
    occ_field: "expected_contract_version"
    description: |
      Running a credit reconciliation against a ServiceContract whose version has
      advanced since the client last read it is rejected. Reconciliation is not
      idempotent on the ledger: a writer working from a stale contract view would
      post credits against a credit_cap_cents and a set of CLOSED events that no
      longer reflect the contract, so the cap could be consumed twice over.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: sla_response_evaluation
    trigger: "sla_target_minutes at POST /fleetcare/service-calls; response_minutes and sla_met at POST /fleetcare/service-calls/{callId}/arrive"
    algorithm: threshold
    formula: |
      # at call creation
      contract.sla_response_minutes = SLA_RESPONSE_MINUTES_BY_TIER[contract.coverage_tier]   # pinned when the contract is created
      call.sla_target_minutes = round_half_up(contract.sla_response_minutes * SEVERITY_SLA_FACTOR[call.severity])
      # at arrival
      call.response_minutes = floor((call.arrived_at - call.reported_at) / 60 seconds)
      call.sla_met          = (call.response_minutes <= call.sla_target_minutes)   # AT the target is MET
    input_set: "One ServiceCall. sla_response_minutes is read from the contract snapshot pinned at contract creation, NOT re-read from the tier table at arrival time."
    constants:
      SLA_RESPONSE_MINUTES_BY_TIER: { BRONZE: 480, SILVER: 240, GOLD: 120 }
      SEVERITY_SLA_FACTOR: { CRITICAL: 0.5, MAJOR: 1.0, MINOR: 2.0 }
    precision: "sla_target_minutes and response_minutes are whole minutes; the factor product is rounded round_half_up to 0 decimal places; elapsed seconds are floored to whole minutes"

  - name: pm_status_evaluation
    trigger: "POST /fleetcare/equipment/{equipmentId}/usage-readings and POST /fleetcare/preventive-visits/{visitId}/complete"
    algorithm: threshold
    formula: |
      hours_since_pm = equipment.usage_hours - equipment.usage_hours_at_last_pm
      interval       = model.pm_interval_hours
      if hours_since_pm < interval:                                  pm_status = OK
      elif hours_since_pm < interval * PM_OVERDUE_FACTOR:            pm_status = DUE
      else:                                                         pm_status = OVERDUE
    input_set: "One Equipment row plus its EquipmentModel. usage_hours_at_last_pm is reset to usage_hours only by a COMPLETED PreventiveVisit — never by a service call, a checklist result or a usage reading."
    constants:
      PM_OVERDUE_FACTOR: 1.25
    precision: "usage hours carry 2 decimal places, round_half_up; the DUE boundary is inclusive of the interval itself (hours_since_pm == interval is DUE, not OK)"

  - name: equipment_health_score
    trigger: "POST /fleetcare/service-calls/{callId}/resolve, POST /fleetcare/downtime-events/{eventId}/waive, POST /fleetcare/equipment/{equipmentId}/usage-readings, POST /fleetcare/parts/{partId}/declare-end-of-support"
    algorithm: weighted_scoring
    formula: |
      resolved_recent = ServiceCall rows where equipment_id == equipment.id
                        AND status == RESOLVED
                        AND resolved_at >= (clock - 365 days)
      if count(resolved_recent) >= HEALTH_FAILURE_HISTORY_MIN_CALLS:  variant = FAILURE_BASED
      else:                                                          variant = USAGE_BASED

      # USAGE_BASED
      usage_ratio  = equipment.usage_hours / model.expected_service_life_hours
      age_years    = floor((clock_date - equipment.install_date) / 365 days)
      raw          = 100 - (USAGE_WEIGHT * usage_ratio) - (AGE_PENALTY_PER_YEAR * age_years)

      # FAILURE_BASED
      raw = 100
            - (CRITICAL_PENALTY * count(resolved_recent where severity == CRITICAL))
            - (MAJOR_PENALTY    * count(resolved_recent where severity == MAJOR))
            - (MINOR_PENALTY    * count(resolved_recent where severity == MINOR))
            - (DOWNTIME_PENALTY_PER_HOUR * (equipment.downtime_minutes_ytd / 60))

      equipment.health_score         = clamp(round_half_up(raw, 2), 0.00, 100.00)
      equipment.health_score_variant = variant

      # replacement recommendation (re-evaluated in the same hop)
      threshold = REPLACEMENT_THRESHOLD_UNSUPPORTED if equipment.support_status == UNSUPPORTED
                  else REPLACEMENT_THRESHOLD_BASE
      equipment.replacement_recommended = (equipment.health_score <= threshold)
    input_set: "Resolved ServiceCall rows in the trailing 365 days of the logical clock decide the variant; CANCELLED, OPEN, DISPATCHED, ON_SITE and PARTS_HOLD calls never count. downtime_minutes_ytd is the Equipment counter maintained by DowntimeEvent closure and reversed on waive."
    constants:
      HEALTH_FAILURE_HISTORY_MIN_CALLS: 3
      USAGE_WEIGHT: 100
      AGE_PENALTY_PER_YEAR: 2
      CRITICAL_PENALTY: 8
      MAJOR_PENALTY: 4
      MINOR_PENALTY: 2
      DOWNTIME_PENALTY_PER_HOUR: 1
      REPLACEMENT_THRESHOLD_BASE: 40.00
      REPLACEMENT_THRESHOLD_UNSUPPORTED: 60.00
    precision: "2 decimal places, round_half_up, clamped to [0.00, 100.00]; the recommendation boundary is inclusive (health_score exactly 40.00 recommends replacement)"
    variants:
      - name: USAGE_BASED
        when: "the unit has fewer than 3 RESOLVED service calls in the trailing 365 days — a young service history cannot outvote wear and age"
        difference: "scores from cumulative usage against the model's expected service life plus a flat age penalty; ignores failure history and accumulated downtime entirely"
      - name: FAILURE_BASED
        when: "the unit has 3 or more RESOLVED service calls in the trailing 365 days"
        difference: "ignores usage_hours, install_date and expected_service_life_hours; scores from severity-weighted failure counts plus one point per hour of year-to-date downtime, so the same row can score higher or lower than its usage-based value"

  - name: downtime_credit
    trigger: "provisional at POST /fleetcare/service-calls/{callId}/resolve (event OPEN -> CLOSED); final at POST /fleetcare/contracts/{contractId}/credit-reconciliations (event CLOSED -> RECONCILED)"
    algorithm: interval_merge
    formula: |
      event.effective_end_at = event.mitigated_at if event.mitigated_at is not null else event.ended_at

      event.downtime_minutes = floor((event.effective_end_at - event.started_at) / 60 seconds)

      # operating minutes: intersect [started_at, effective_end_at) with the club's daily
      # operating window [Club.operating_open_minute, Club.operating_close_minute) in UTC,
      # summed day by day. Minutes outside the window (overnight, pre-open) are excluded.
      event.operating_downtime_minutes = sum over each UTC calendar day D of
            overlap_minutes( [started_at, effective_end_at),
                             [D 00:00 + operating_open_minute, D 00:00 + operating_close_minute) )

      grace = DOWNTIME_GRACE_MINUTES_BY_TIER[contract.coverage_tier]
      rate  = CREDIT_RATE_CENTS_PER_HOUR_BY_TIER[contract.coverage_tier]

      # variant provisional_wall_clock  (charged at closure)
      billable = max(0, event.downtime_minutes - grace)
      event.provisional_credit_cents = round_half_up(billable / 60 * rate)

      # variant final_operating_hours   (charged at reconciliation)
      billable = max(0, event.operating_downtime_minutes - grace)
      event.final_credit_cents = round_half_up(billable / 60 * rate)
    input_set: "One DowntimeEvent, its ServiceContract (for tier) and its Club (for the operating window). The grace allowance is applied PER EVENT, never once per period, and each event is rounded to whole cents before any period-level summation."
    constants:
      DOWNTIME_GRACE_MINUTES_BY_TIER: { BRONZE: 720, SILVER: 360, GOLD: 180 }
      CREDIT_RATE_CENTS_PER_HOUR_BY_TIER: { BRONZE: 400, SILVER: 900, GOLD: 1600 }
    precision: "whole cents, round_half_up, applied per event before summation; minutes are floored to whole minutes"
    variants:
      - name: provisional_wall_clock
        when: "the DowntimeEvent closes as its ServiceCall is resolved — the field crew has no authority over club hours, so the provisional accrual bills every wall-clock minute the unit was unavailable"
        difference: "uses downtime_minutes (raw wall-clock span). Overnight and pre-opening minutes are billable, so an outage crossing a closed period accrues strictly more than its final value."
      - name: final_operating_hours
        when: "the period is reconciled by a contract administrator"
        difference: "uses operating_downtime_minutes (only minutes inside the club's daily operating window). Identical event rows therefore produce two different credit numbers, and the reconciliation posts the final one while leaving provisional_credit_cents on the row for audit."

  - name: credit_reconciliation
    trigger: "POST /fleetcare/contracts/{contractId}/credit-reconciliations"
    algorithm: waterfall_allocation
    formula: |
      contract.credit_cap_cents = round_half_up(contract.annual_base_cents * CREDIT_CAP_PCT)   # pinned at contract creation

      events = DowntimeEvent rows where contract_id == contract.id
               AND status == CLOSED
               AND period_key == request.period_key
      ordered by created_at ASC          # chronological, never by id

      for each event in order:
          event.final_credit_cents  = downtime_credit[final_operating_hours](event)
          remaining_cap             = contract.credit_cap_cents - contract.credit_accrued_cents
          event.posted_credit_cents = min(event.final_credit_cents, max(0, remaining_cap))
          forgone                   = event.final_credit_cents - event.posted_credit_cents
          event.status              = RECONCILED
          contract.credit_accrued_cents += event.posted_credit_cents
          contract.credit_forgone_cents += forgone

      contract.last_reconciled_period_key = request.period_key
    input_set: "Only CLOSED events whose period_key equals the requested period. OPEN events (their call is unresolved), WAIVED events and already-RECONCILED events are excluded; a period whose key equals contract.last_reconciled_period_key cannot be reconciled twice."
    constants:
      CREDIT_CAP_PCT: 0.15
    precision: "whole cents, round_half_up per event; the annual cap is consumed in created_at ASC order, so which event gets clipped depends on creation order, not on magnitude"

  - name: part_order_cost_allocation
    trigger: "POST /fleetcare/service-calls/{callId}/parts-hold"
    algorithm: waterfall_allocation
    formula: |
      unit_cents  = round_half_up(part.unit_price_cents * SOURCE_PRICE_FACTOR[request.source])
      list_total  = unit_cents * request.qty

      covered = 0
      if contract.parts_inclusion == FULL:                                    covered = list_total
      elif contract.parts_inclusion == WEAR_ONLY and part.category == WEAR:   covered = list_total
      else:                                                                   covered = 0     # NONE, or a non-WEAR part under WEAR_ONLY

      order.allowance_draw_cents = min(covered, contract.parts_allowance_remaining_cents)
      order.club_billable_cents  = list_total - order.allowance_draw_cents
      contract.parts_allowance_remaining_cents -= order.allowance_draw_cents
    input_set: "One PartCatalogEntry, one ServiceContract and the requested qty/source. The allowance bucket fills first and the club is billed only the remainder, so a partially exhausted allowance splits a single order across both buckets."
    constants:
      SOURCE_PRICE_FACTOR: { NEW: 1.00, REFURBISHED: 0.60, LOANER_SWAP: 0.00 }
    precision: "per-unit price rounded round_half_up to whole cents BEFORE multiplying by qty; allowance and club buckets are whole cents and always sum to list_total_cents"

  - name: parts_allowance_invariant
    trigger: "recomputed after POST /fleetcare/service-calls/{callId}/parts-hold, POST /fleetcare/part-orders/{orderId}/cancel and POST /fleetcare/contracts/{contractId}/parts-allowance-adjustments"
    algorithm: aggregation
    formula: |
      contract.parts_allowance_total_cents
        == contract.parts_allowance_remaining_cents
           + sum(order.allowance_draw_cents for PartOrder rows on this contract's calls
                 where order.status IN {ALLOCATED, INSTALLED})
    input_set: "PartOrder rows reachable through ServiceCall.contract_id. CANCELLED orders are excluded because cancellation zeroes their draw and returns the money to remaining."
    precision: "exact integer cents — the identity must hold after every parts operation, including a cancel that follows a partially-covered draw"

  - name: technician_capacity_invariant
    trigger: "recomputed after every TechnicianAssignment create, release, or completion"
    algorithm: aggregation
    formula: |
      technician.committed_minutes
        == sum(assignment.planned_minutes for TechnicianAssignment rows on this technician
               where assignment.status IN {RESERVED, CONFIRMED})
      # capacity gate on any new reservation:
      technician.committed_minutes + candidate.planned_minutes <= technician.max_committed_minutes
    input_set: "RESERVED and CONFIRMED assignments occupy the calendar; RELEASED and COMPLETED assignments do not. Every teardown path (visit cancel, visit mark-missed, call cancel, contract suspend, contract expire, explicit release) must return the minutes."
    constants:
      SEVERITY_PLANNED_MINUTES: { CRITICAL: 180, MAJOR: 120, MINOR: 60 }
    precision: "exact integer minutes; the capacity gate is inclusive (landing exactly on max_committed_minutes is allowed, one minute more is refused)"

  - name: part_inventory_invariant
    trigger: "recomputed after parts-hold, part-order install, part-order cancel and inventory-adjustments"
    algorithm: aggregation
    formula: |
      part.allocated_qty
        == sum(order.qty for PartOrder rows on this part where order.status == ALLOCATED)
      # bucket movement:
      #   allocate NEW          : on_hand_qty      -= qty ; allocated_qty += qty
      #   allocate REFURBISHED  : refurb_on_hand_qty -= qty ; allocated_qty += qty
      #   allocate LOANER_SWAP  : refurb_on_hand_qty -= qty ; allocated_qty += qty
      #   install               : allocated_qty    -= qty   (consumed, no bucket restore)
      #   cancel                : allocated_qty    -= qty ; the ORIGINATING bucket += qty
    input_set: "PartOrder rows per PartCatalogEntry. Cancellation must credit back the same bucket the allocation debited — a REFURBISHED cancel must not inflate on_hand_qty."
    precision: "exact integer units; no bucket may go negative"

  - name: technician_calendar_conflict
    trigger: "POST /fleetcare/service-calls/{callId}/dispatch and POST /fleetcare/preventive-visits (creation)"
    algorithm: interval_merge
    formula: |
      # assignment intervals are HALF-OPEN: [start_at, end_at) — a new interval may begin
      # exactly when an existing one ends, subject to the travel buffer below.
      buffer = TRAVEL_BUFFER_MINUTES   # symmetric, applied to the EXISTING interval on both sides
      collides(candidate, existing) =
            candidate.start_at < (existing.end_at   + buffer)
        AND existing.start_at  < (candidate.end_at  + buffer)
      conflict = any existing TechnicianAssignment on the same technician
                 with status IN {RESERVED, CONFIRMED} where collides(candidate, existing)
    input_set: "TechnicianAssignment rows for the candidate technician in status RESERVED or CONFIRMED. RELEASED and COMPLETED rows never block, so releasing an assignment immediately frees the slot."
    constants:
      TRAVEL_BUFFER_MINUTES: 45
    precision: "minute granularity; a gap of exactly 45 minutes between two assignments is legal, 44 minutes is a conflict"

  - name: club_visit_capacity
    trigger: "POST /fleetcare/preventive-visits (creation)"
    algorithm: aggregation
    formula: |
      # visit windows are CLOSED intervals: [window_start, window_end] — two visits that
      # merely touch at an endpoint DO collide, the opposite of the technician rule.
      overlaps(candidate, existing) =
            candidate.window_start <= existing.window_end
        AND existing.window_start  <= candidate.window_end
      concurrent = count(PreventiveVisit rows whose equipment belongs to this club
                         AND visit_status IN {SCHEDULED, IN_PROGRESS}
                         AND overlaps(candidate, that visit))
      reject when (concurrent + 1) > Club.max_concurrent_visits
    input_set: "SCHEDULED and IN_PROGRESS visits on any Equipment of the same Club, regardless of contract or technician. COMPLETED, MISSED and CANCELLED visits free their slot."
    precision: "integer count; the limit is inclusive (a club with max_concurrent_visits 1 accepts the first visit and refuses any window that touches it)"

  - name: technician_routing_selection
    trigger: "POST /fleetcare/service-calls/{callId}/dispatch and POST /fleetcare/preventive-visits (creation) when technician_id is omitted"
    algorithm: constraint_propagation
    formula: |
      eligible = Technician rows where
            duty_status == ON_DUTY
        AND region_code == club.region_code
        AND model.category IN skill_categories
        AND no calendar conflict per technician_calendar_conflict
        AND committed_minutes + candidate.planned_minutes <= max_committed_minutes
        AND (equipment.lifecycle_status != TAGGED_OUT OR is_safety_inspector == true)
      if eligible is empty:  raise ERR_NO_ELIGIBLE_TECHNICIAN
      winner = eligible ordered by (committed_minutes ASC, created_at ASC) -> first
    input_set: "All Technician rows; eligibility is evaluated against the club's region, the equipment model's category, the technician's live calendar and the requested window. Selection order NEVER consults id."
    precision: "integer minutes; ties on committed_minutes are broken by created_at ASC (earliest-created technician wins), never by id"

  - name: pm_compliance_pct
    trigger: "POST /fleetcare/preventive-visits/{visitId}/complete, POST /fleetcare/preventive-visits/{visitId}/mark-missed, and read at renewal quoting"
    algorithm: aggregation
    formula: |
      denominator = contract.pm_visits_completed_count + contract.pm_visits_missed_count
      if denominator == 0:  contract.pm_compliance_pct = 100.00      # a contract with no history is fully compliant
      else:                 contract.pm_compliance_pct = round_half_up(100 * contract.pm_visits_completed_count / denominator, 2)
    input_set: "Only COMPLETED and MISSED visits. CANCELLED visits are excluded from BOTH numerator and denominator, so cancelling a visit cannot damage compliance while missing one can. SCHEDULED and IN_PROGRESS visits are not yet history."
    precision: "2 decimal places, round_half_up; the empty-history case returns exactly 100.00 rather than 0.00 or null"

  - name: renewal_quote_pricing
    trigger: "POST /fleetcare/contracts/{contractId}/renewal-quotes"
    algorithm: tiered_pricing
    formula: |
      fleet = Equipment rows where club_id == contract.club_id       # ordered created_at ASC
      if fleet is empty:  raise ERR_FLEET_EMPTY

      # ---- step 1: per-unit line pricing (each line rounded to whole cents) ----
      for each unit in fleet:
          age_years  = floor((issued_at_date - unit.install_date) / 365 days)
          age_mult   = AGE_MULTIPLIER_BY_YEARS[age_years]           # step table below
          cond_mult  = 1.00
                     + (REPLACEMENT_ADDER  if unit.replacement_recommended else 0)
                     + (UNSUPPORTED_ADDER  if unit.support_status == UNSUPPORTED else 0)
                     + (ANNOUNCED_ADDER    if unit.support_status == END_OF_SUPPORT_ANNOUNCED else 0)
          line_cents = round_half_up(model.base_annual_service_cents * age_mult * cond_mult)
          append {equipment_id, age_years, age_multiplier, condition_multiplier, line_cents} to quote.line_items

      quote.quoted_base_cents = sum(line_cents)                      # per-line rounding, then sum

      # ---- step 2: parts inclusion surcharge ----
      quote.parts_surcharge_cents = round_half_up(quoted_base_cents * PARTS_SURCHARGE_PCT[contract.parts_inclusion])

      # ---- step 3: service-history load ----
      quote.sla_breach_count   = count(ServiceCall on this contract where sla_met == false)
      quote.critical_call_count= count(ServiceCall on this contract where severity == CRITICAL and status == RESOLVED)
      quote.history_load_pct   = min(HISTORY_LOAD_CAP_PCT,
                                     SLA_BREACH_LOAD_PCT * sla_breach_count
                                   + CRITICAL_CALL_LOAD_PCT * critical_call_count)
      quote.history_surcharge_cents = round_half_up(quoted_base_cents * history_load_pct)

      # ---- step 4: subtotal ----
      quote.subtotal_cents = quoted_base_cents + parts_surcharge_cents + history_surcharge_cents

      # ---- step 5: compliance discount ----
      quote.pm_compliance_pct_snapshot = contract.pm_compliance_pct
      if pm_compliance_pct_snapshot >= 90.00:  quote.compliance_discount_pct = 0.05
      elif pm_compliance_pct_snapshot >= 75.00: quote.compliance_discount_pct = 0.02
      else:                                    quote.compliance_discount_pct = 0.00
      quote.compliance_discount_cents = round_half_up(subtotal_cents * compliance_discount_pct)

      # ---- step 6: collar against the expiring term, FLOOR FIRST then CAP ----
      quoted = subtotal_cents - compliance_discount_cents
      floor  = round_half_up(contract.annual_base_cents * RENEWAL_FLOOR_PCT)
      cap    = round_half_up(contract.annual_base_cents * RENEWAL_CAP_PCT)
      if quoted < floor:  quoted = floor ; quote.floor_applied = true
      if quoted > cap:    quoted = cap   ; quote.cap_applied   = true
      quote.quoted_annual_cents = quoted

      # ---- step 7: fleet age index and validity ----
      quote.fleet_age_index = round_half_up(sum(age_multiplier over line_items) / count(line_items), 2)
      quote.issued_at  = clock
      quote.expires_at = clock + QUOTE_VALIDITY_DAYS days
    input_set: "Every Equipment row of the contract's club at issue time, plus the contract's own service history (all ServiceCall rows on the contract, any status, for sla_met; RESOLVED only for the critical count) and its live pm_compliance_pct. Line values are PINNED into quote.line_items, so a later fleet change never mutates an already-ISSUED quote."
    constants:
      AGE_MULTIPLIER_BY_YEARS: { "0-2": 1.00, "3-5": 1.15, "6-8": 1.35, "9+": 1.60 }
      REPLACEMENT_ADDER: 0.25
      UNSUPPORTED_ADDER: 0.20
      ANNOUNCED_ADDER: 0.10
      PARTS_SURCHARGE_PCT: { NONE: 0.00, WEAR_ONLY: 0.08, FULL: 0.18 }
      SLA_BREACH_LOAD_PCT: 0.03
      CRITICAL_CALL_LOAD_PCT: 0.015
      HISTORY_LOAD_CAP_PCT: 0.25
      RENEWAL_FLOOR_PCT: 0.90
      RENEWAL_CAP_PCT: 1.35
      QUOTE_VALIDITY_DAYS: 30
    precision: "whole cents, round_half_up, rounded per line before summation and again after each percentage step; fleet_age_index is 2 decimal places round_half_up; age tier boundaries are inclusive of the lower year (a unit exactly 6 years old prices at 1.35)"

  - name: fleet_renewal_risk
    trigger: "recomputed whenever Equipment.replacement_recommended or Equipment.support_status changes, and whenever equipment is added to a club"
    algorithm: threshold
    formula: |
      Club.covered_unit_count             = count(Equipment where club_id == club.id)
      contract.replacement_candidate_count= count(Equipment on this club where replacement_recommended == true)
      contract.obsolete_unit_count        = count(Equipment on this club where support_status == UNSUPPORTED)
      ratio = replacement_candidate_count / covered_unit_count   (0 when the fleet is empty)
      if ratio >= FLEET_RISK_HIGH_RATIO:      fleet_renewal_risk = HIGH
      elif ratio >= FLEET_RISK_MODERATE_RATIO: fleet_renewal_risk = MODERATE
      else:                                    fleet_renewal_risk = LOW
    input_set: "Every Equipment row of the contract's club, regardless of lifecycle_status — a TAGGED_OUT or DOWN unit still counts toward the fleet and toward the candidate ratio."
    constants:
      FLEET_RISK_HIGH_RATIO: 0.30
      FLEET_RISK_MODERATE_RATIO: 0.15
    precision: "ratio compared at full float precision with inclusive boundaries (exactly 0.30 is HIGH, exactly 0.15 is MODERATE)"

# =============================================================================
# 1.4 Validation Rules Table  (evaluated strictly in ascending priority order;
#     the FIRST violated rule decides the response)
# =============================================================================
validations:

  # ---- 1-5: authentication and authorization -------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "when the acting role is ClubManager, X-User-ID equals the Club.id that owns the target resource (resolved through equipment.club_id or contract.club_id)"
    error_id: ERR_CLUB_SCOPE_FORBIDDEN
    http_status: 403
    applies_to: "all ClubManager operations: service-call creation, quote accept/decline, and every scoped read"
  - priority: 4
    category: auth
    check: "when the acting role is FieldTechnician, X-User-ID equals the target ServiceCall.assigned_technician_id or PreventiveVisit.assigned_technician_id (or the owning call's assignee for part-order install)"
    error_id: ERR_TECHNICIAN_NOT_ASSIGNED
    http_status: 403
    applies_to: "call arrive/parts-hold/resume/resolve, visit start/checklist-results/complete, visit safety-doc submit, part-order install"
  - priority: 5
    category: auth
    check: "when the acting role is SafetyInspector, the Technician row identified by X-User-ID has is_safety_inspector == true"
    error_id: ERR_INSPECTOR_NOT_CERTIFIED
    http_status: 403
    applies_to: "visit safety-doc certify/reject, equipment tag-out"

  # ---- 6-17: path-parameter existence, left to right -----------------------
  - priority: 6
    category: existence
    check: "{clubId} in the path resolves to a Club"
    error_id: ERR_CLUB_NOT_FOUND
    http_status: 404
    applies_to: "GET /fleetcare/clubs/{clubId}"
  - priority: 7
    category: existence
    check: "{modelId} in the path resolves to an EquipmentModel"
    error_id: ERR_MODEL_NOT_FOUND
    http_status: 404
    applies_to: "GET /fleetcare/equipment-models/{modelId}"
  - priority: 8
    category: existence
    check: "{equipmentId} in the path resolves to an Equipment"
    error_id: ERR_EQUIPMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /fleetcare/equipment/{equipmentId}, usage-readings, tag-out"
  - priority: 9
    category: existence
    check: "{contractId} in the path resolves to a ServiceContract"
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "every /fleetcare/contracts/{contractId}/... endpoint"
  - priority: 10
    category: existence
    check: "{technicianId} in the path resolves to a Technician"
    error_id: ERR_TECHNICIAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /fleetcare/technicians/{technicianId}, duty-status"
  - priority: 11
    category: existence
    check: "{visitId} in the path resolves to a PreventiveVisit"
    error_id: ERR_VISIT_NOT_FOUND
    http_status: 404
    applies_to: "every /fleetcare/preventive-visits/{visitId}/... endpoint"
  - priority: 12
    category: existence
    check: "{callId} in the path resolves to a ServiceCall"
    error_id: ERR_CALL_NOT_FOUND
    http_status: 404
    applies_to: "every /fleetcare/service-calls/{callId}/... endpoint"
  - priority: 13
    category: existence
    check: "{assignmentId} in the path resolves to a TechnicianAssignment"
    error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /fleetcare/technician-assignments/{assignmentId}, release"
  - priority: 14
    category: existence
    check: "{partId} in the path resolves to a PartCatalogEntry"
    error_id: ERR_PART_NOT_FOUND
    http_status: 404
    applies_to: "GET /fleetcare/parts/{partId}, inventory-adjustments, declare-end-of-support"
  - priority: 15
    category: existence
    check: "{orderId} in the path resolves to a PartOrder"
    error_id: ERR_PART_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /fleetcare/part-orders/{orderId}, install, cancel"
  - priority: 16
    category: existence
    check: "{eventId} in the path resolves to a DowntimeEvent"
    error_id: ERR_DOWNTIME_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /fleetcare/downtime-events/{eventId}, waive"
  - priority: 17
    category: existence
    check: "{quoteId} in the path resolves to a RenewalQuote"
    error_id: ERR_QUOTE_NOT_FOUND
    http_status: 404
    applies_to: "GET /fleetcare/renewal-quotes/{quoteId}, accept, decline"

  # ---- 18: request shape ---------------------------------------------------
  - priority: 18
    category: existence
    check: "all required body fields are present, enums hold declared values, integers are non-negative where the field is a count/amount/qty, timestamps parse as ISO-8601 UTC, and qty >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  # ---- 19: body-referenced existence --------------------------------------
  - priority: 19
    category: existence
    check: "every id carried in the request body resolves: club_id -> Club, model_id -> EquipmentModel, equipment_id -> Equipment, contract_id -> ServiceContract, technician_id / safety_clearance_technician_id -> Technician, part_id -> PartCatalogEntry"
    error_id: "the matching not-found error for the referenced entity"
    http_status: 404
    applies_to: "POST /fleetcare/equipment, POST /fleetcare/contracts, POST /fleetcare/preventive-visits, POST /fleetcare/service-calls, dispatch, parts-hold, resolve, POST /fleetcare/parts"

  # ---- 20: optimistic concurrency -----------------------------------------
  - priority: 20
    category: state
    check: "request.expected_contract_version equals the live ServiceContract.version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /fleetcare/contracts/{contractId}/renewal-quotes, POST /fleetcare/contracts/{contractId}/credit-reconciliations"

  # ---- 21-30: state preconditions -----------------------------------------
  - priority: 21
    category: state
    check: "the ServiceContract is in a status the requested lifecycle action allows (activate needs DRAFT, suspend needs ACTIVE, reinstate needs SUSPENDED, renewal-quotes needs ACTIVE or RENEWAL_QUOTED)"
    error_id: ERR_CONTRACT_INVALID_STATE
    http_status: 409
    applies_to: "contract activate/suspend/reinstate/renewal-quotes"
  - priority: 22
    category: state
    check: "the covering ServiceContract.status == ACTIVE for operational work (service-call creation and dispatch, preventive-visit creation, parts-allowance adjustment, credit reconciliation)"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /fleetcare/service-calls, service-call dispatch, POST /fleetcare/preventive-visits, parts-allowance-adjustments, credit-reconciliations"
  - priority: 23
    category: state
    check: "the ServiceCall is in the status the action requires (dispatch needs OPEN, arrive needs DISPATCHED, parts-hold and resolve need ON_SITE, resume needs PARTS_HOLD, cancel needs OPEN or DISPATCHED)"
    error_id: ERR_CALL_INVALID_STATE
    http_status: 409
    applies_to: "service-call dispatch/arrive/parts-hold/resume/resolve/cancel"
  - priority: 24
    category: state
    check: "the PreventiveVisit.visit_status is what the action requires (start needs SCHEDULED, checklist-results and complete need IN_PROGRESS, cancel needs SCHEDULED, mark-missed needs SCHEDULED and clock >= window_end)"
    error_id: ERR_VISIT_INVALID_STATE
    http_status: 409
    applies_to: "visit start/checklist-results/complete/cancel/mark-missed"
  - priority: 25
    category: state
    check: "the PreventiveVisit.safety_doc_status is what the action requires (submit needs PENDING or REJECTED with visit_status IN_PROGRESS or COMPLETED; certify and reject need SUBMITTED)"
    error_id: ERR_SAFETY_DOC_INVALID_STATE
    http_status: 409
    applies_to: "visit safety-doc submit/certify/reject"
  - priority: 26
    category: state
    check: "the PartOrder.status == ALLOCATED for install or cancel, and for install the owning ServiceCall.status == PARTS_HOLD"
    error_id: ERR_PART_ORDER_INVALID_STATE
    http_status: 409
    applies_to: "part-order install/cancel"
  - priority: 27
    category: state
    check: "the DowntimeEvent.status is waivable (OPEN, CLOSED or RECONCILED — an already WAIVED event cannot be waived again)"
    error_id: ERR_DOWNTIME_INVALID_STATE
    http_status: 409
    applies_to: "downtime-event waive"
  - priority: 28
    category: state
    check: "the TechnicianAssignment.status is RESERVED or CONFIRMED (a RELEASED or COMPLETED assignment cannot be released)"
    error_id: ERR_ASSIGNMENT_INVALID_STATE
    http_status: 409
    applies_to: "technician-assignment release"
  - priority: 29
    category: state
    check: "the RenewalQuote.status == ISSUED and the owning contract.status == RENEWAL_QUOTED"
    error_id: ERR_QUOTE_NOT_ISSUED
    http_status: 409
    applies_to: "renewal-quote accept/decline"
  - priority: 30
    category: state
    check: "the current logical clock is strictly before RenewalQuote.expires_at"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "renewal-quote accept/decline"

  # ---- 31-36: safety and compliance (outrank every commercial rule) --------
  - priority: 31
    category: business_safety
    check: "the target Equipment.lifecycle_status != TAGGED_OUT for preventive work, and Club.open_safety_lockout_count == 0 before a contract may be reinstated"
    error_id: ERR_SAFETY_LOCKOUT_OPEN
    http_status: 409
    applies_to: "visit start, contract reinstate"
  - priority: 32
    category: business_safety
    check: "when ServiceCall.safety_review_required == true, resolve carries safety_clearance_technician_id referencing a Technician with is_safety_inspector == true"
    error_id: ERR_SAFETY_CLEARANCE_REQUIRED
    http_status: 422
    applies_to: "service-call resolve"
  - priority: 33
    category: business_safety
    check: "when the target Equipment.lifecycle_status == TAGGED_OUT, the technician chosen (or routed) for dispatch has is_safety_inspector == true"
    error_id: ERR_SAFETY_CERTIFICATION_REQUIRED
    http_status: 422
    applies_to: "service-call dispatch"
  - priority: 34
    category: business_safety
    check: "the acting user is not the same person on both sides of a control: the safety-doc certifier/rejecter differs from visit.assigned_technician_id, and the resolve clearance signer differs from call.assigned_technician_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "visit safety-doc certify/reject, service-call resolve"
  - priority: 35
    category: business_safety
    check: "a service call reporting a member injury (injury_reported == true) is filed at severity CRITICAL"
    error_id: ERR_INJURY_SEVERITY_MISMATCH
    http_status: 422
    applies_to: "POST /fleetcare/service-calls"
  - priority: 36
    category: business_safety
    check: "no checklist element marked is_safety_critical has result FAIL when a visit is completed (safety_critical_failed_count == 0)"
    error_id: ERR_SAFETY_CRITICAL_FAIL_BLOCKS_COMPLETION
    http_status: 409
    applies_to: "visit complete"

  # ---- 37-41: referential coherence between entities ----------------------
  - priority: 37
    category: business_referential
    check: "the referenced Equipment.club_id equals the referenced ServiceContract.club_id"
    error_id: ERR_EQUIPMENT_CLUB_MISMATCH
    http_status: 422
    applies_to: "POST /fleetcare/service-calls, POST /fleetcare/preventive-visits"
  - priority: 38
    category: business_referential
    check: "the requested PartCatalogEntry.model_id equals the serviced Equipment.model_id"
    error_id: ERR_PART_MODEL_MISMATCH
    http_status: 422
    applies_to: "service-call parts-hold"
  - priority: 39
    category: business_referential
    check: "the chosen Technician.region_code equals the Club.region_code of the serviced equipment"
    error_id: ERR_TECHNICIAN_REGION_MISMATCH
    http_status: 422
    applies_to: "service-call dispatch, POST /fleetcare/preventive-visits"
  - priority: 40
    category: business_referential
    check: "the EquipmentModel.category of the serviced unit is present in the chosen Technician.skill_categories"
    error_id: ERR_TECHNICIAN_SKILL_MISMATCH
    http_status: 422
    applies_to: "service-call dispatch, POST /fleetcare/preventive-visits"
  - priority: 41
    category: business_referential
    check: "the chosen Technician.duty_status == ON_DUTY"
    error_id: ERR_TECHNICIAN_OFF_DUTY
    http_status: 409
    applies_to: "service-call dispatch, POST /fleetcare/preventive-visits"

  # ---- 42-45: temporal and calendar conflicts -----------------------------
  - priority: 42
    category: business_temporal
    check: "window_end > window_start and (window_end - window_start) <= 480 minutes, and the window lies inside the club's daily operating window"
    error_id: ERR_VISIT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /fleetcare/preventive-visits"
  - priority: 43
    category: business_temporal
    check: "the club's closed-interval concurrent-visit count including the candidate does not exceed Club.max_concurrent_visits (calculations.club_visit_capacity)"
    error_id: ERR_CLUB_VISIT_CAPACITY
    http_status: 409
    applies_to: "POST /fleetcare/preventive-visits"
  - priority: 44
    category: business_temporal
    check: "the candidate interval does not collide with any RESERVED or CONFIRMED assignment of the chosen technician under the symmetric 45-minute travel buffer (calculations.technician_calendar_conflict)"
    error_id: ERR_TECHNICIAN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "service-call dispatch, POST /fleetcare/preventive-visits"
  - priority: 45
    category: business_temporal
    check: "technician.committed_minutes + candidate.planned_minutes <= technician.max_committed_minutes"
    error_id: ERR_TECHNICIAN_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "service-call dispatch, POST /fleetcare/preventive-visits"

  # ---- 46-60: domain constraints -----------------------------------------
  - priority: 46
    category: business_constraint
    check: "the club has no other ServiceContract in status ACTIVE, SUSPENDED or RENEWAL_QUOTED"
    error_id: ERR_ACTIVE_CONTRACT_EXISTS
    http_status: 409
    applies_to: "contract activate"
  - priority: 47
    category: business_constraint
    check: "serial_number is unique across all Equipment rows"
    error_id: ERR_SERIAL_DUPLICATE
    http_status: 409
    applies_to: "POST /fleetcare/equipment"
  - priority: 48
    category: business_constraint
    check: "the coverage tier permits the requested parts_inclusion: BRONZE allows only NONE or WEAR_ONLY; FULL requires SILVER or GOLD"
    error_id: ERR_TIER_PARTS_MISMATCH
    http_status: 422
    applies_to: "POST /fleetcare/contracts"
  - priority: 49
    category: business_constraint
    check: "pm_visits_per_year >= PM_MIN_VISITS_BY_TIER[coverage_tier] (BRONZE 1, SILVER 2, GOLD 4)"
    error_id: ERR_PM_FREQUENCY_BELOW_TIER
    http_status: 422
    applies_to: "POST /fleetcare/contracts"
  - priority: 50
    category: business_constraint
    check: "a usage reading is monotonic: request.usage_hours >= equipment.usage_hours"
    error_id: ERR_USAGE_REGRESSION
    http_status: 422
    applies_to: "POST /fleetcare/equipment/{equipmentId}/usage-readings"
  - priority: 51
    category: business_constraint
    check: "request.item_code matches an element code on this visit's checklist"
    error_id: ERR_CHECKLIST_ITEM_UNKNOWN
    http_status: 422
    applies_to: "visit checklist-results"
  - priority: 52
    category: business_constraint
    check: "checklist_resolved_count == checklist_total_count (every element has a recorded result)"
    error_id: ERR_CHECKLIST_INCOMPLETE
    http_status: 409
    applies_to: "visit complete"
  - priority: 53
    category: business_constraint
    check: "the equipment has no other ServiceCall in status OPEN, DISPATCHED, ON_SITE or PARTS_HOLD"
    error_id: ERR_DUPLICATE_OPEN_CALL
    http_status: 409
    applies_to: "POST /fleetcare/service-calls"
  - priority: 54
    category: business_constraint
    check: "call.parts_hold_count < PARTS_HOLD_MAX (3) — a call may enter the parts cycle at most three times"
    error_id: ERR_PARTS_HOLD_LIMIT
    http_status: 409
    applies_to: "service-call parts-hold"
  - priority: 55
    category: business_constraint
    check: "the requested source bucket holds at least qty units: NEW draws on_hand_qty, REFURBISHED and LOANER_SWAP draw refurb_on_hand_qty"
    error_id: ERR_PART_OUT_OF_STOCK
    http_status: 409
    applies_to: "service-call parts-hold"
  - priority: 56
    category: business_constraint
    check: "the requested source is permitted for the part's lifecycle_status: source NEW is refused once lifecycle_status == OBSOLETE (refurbished or loaner sourcing must be used instead)"
    error_id: ERR_PART_SOURCE_UNAVAILABLE
    http_status: 422
    applies_to: "service-call parts-hold"
  - priority: 57
    category: business_constraint
    check: "when technician_id is omitted, calculations.technician_routing_selection yields a non-empty eligible pool"
    error_id: ERR_NO_ELIGIBLE_TECHNICIAN
    http_status: 422
    applies_to: "service-call dispatch, POST /fleetcare/preventive-visits"
  - priority: 58
    category: business_constraint
    check: "no ALLOCATED PartOrder remains on the call before it resumes on-site work"
    error_id: ERR_UNRESOLVED_PART_ORDER
    http_status: 409
    applies_to: "service-call resume"
  - priority: 59
    category: business_constraint
    check: "the contract's club owns at least one Equipment row"
    error_id: ERR_FLEET_EMPTY
    http_status: 422
    applies_to: "contract renewal-quotes"
  - priority: 60
    category: business_constraint
    check: "request.period_key differs from contract.last_reconciled_period_key and at least one CLOSED event exists in that period"
    error_id: ERR_PERIOD_ALREADY_RECONCILED
    http_status: 409
    applies_to: "contract credit-reconciliations"

  # ---- 61-63: fiscal checks (deliberately last) ---------------------------
  - priority: 61
    category: business_fiscal
    check: "when the part is covered by the contract's parts_inclusion, contract.parts_allowance_remaining_cents > 0"
    error_id: ERR_PARTS_ALLOWANCE_EXHAUSTED
    http_status: 409
    applies_to: "service-call parts-hold"
  - priority: 62
    category: business_fiscal
    check: "a parts-allowance adjustment must not drive parts_allowance_remaining_cents or parts_allowance_total_cents below 0"
    error_id: ERR_ALLOWANCE_ADJUSTMENT_INVALID
    http_status: 422
    applies_to: "contract parts-allowance-adjustments"
  - priority: 63
    category: business_fiscal
    check: "an inventory adjustment must not drive on_hand_qty or refurb_on_hand_qty below 0"
    error_id: ERR_INVENTORY_ADJUSTMENT_INVALID
    http_status: 422
    applies_to: "part inventory-adjustments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- test-driving surface (outside the business API) ---------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every timestamp, window, expiry and trailing-365-day lookback reads. The server's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["sets the logical clock used by every subsequent request"]

  # ---- Club ----------------------------------------------------------------
  - method: POST
    path: "/fleetcare/clubs"
    description: "Registers a club site with its region and daily operating window (minutes from UTC midnight)."
    roles: [ContractAdministrator]
    code: 201
    input: [name, region_code, "operating_open_minute?", "operating_close_minute?", "max_concurrent_visits?"]
    output: Club
    side_effects: ["covered_unit_count = 0, open_safety_lockout_count = 0"]
  - method: GET
    path: "/fleetcare/clubs"
    description: "Lists clubs."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: ["region_code?", "limit?", "offset?"]
    output: Club[]
    side_effects: []
  - method: GET
    path: "/fleetcare/clubs/{clubId}"
    description: "Reads one club including its derived fleet counters."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: []
    output: Club
    side_effects: []

  # ---- EquipmentModel ------------------------------------------------------
  - method: POST
    path: "/fleetcare/equipment-models"
    description: "Registers an equipment model with its PM interval, expected service life, base annual service price and the safety checklist template its visits inherit."
    roles: [ContractAdministrator, PartsPlanner]
    code: 201
    input: [manufacturer, model_code, category, model_year, pm_interval_hours, expected_service_life_hours, base_annual_service_cents, "checklist_template?"]
    output: EquipmentModel
    side_effects: ["checklist_template defaults to an empty array when omitted"]
  - method: GET
    path: "/fleetcare/equipment-models"
    description: "Lists equipment models."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: ["category?", "manufacturer?", "limit?", "offset?"]
    output: EquipmentModel[]
    side_effects: []
  - method: GET
    path: "/fleetcare/equipment-models/{modelId}"
    description: "Reads one equipment model."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: []
    output: EquipmentModel
    side_effects: []

  # ---- Equipment -----------------------------------------------------------
  - method: POST
    path: "/fleetcare/equipment"
    description: "Adds a unit to a club's fleet with its serial number, install date and starting usage hours."
    roles: [ContractAdministrator, ServiceCoordinator]
    code: 201
    input: [club_id, model_id, serial_number, install_date, "initial_usage_hours?"]
    output: Equipment
    side_effects:
      - "usage_hours = initial_usage_hours (default 0.00), usage_hours_at_last_pm = the same value, pm_status = OK"
      - "lifecycle_status = IN_SERVICE, support_status = SUPPORTED, downtime_minutes_ytd = 0"
      - "runs calculations.equipment_health_score (variant USAGE_BASED) and sets replacement_recommended"
      - "increments Club.covered_unit_count and re-derives the covering contract's replacement_candidate_count and fleet_renewal_risk"
  - method: GET
    path: "/fleetcare/equipment"
    description: "Lists fleet units, filterable by club, model, lifecycle, PM status and support status."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: ["club_id?", "model_id?", "lifecycle_status?", "pm_status?", "support_status?", "limit?", "offset?"]
    output: Equipment[]
    side_effects: []
  - method: GET
    path: "/fleetcare/equipment/{equipmentId}"
    description: "Reads one unit including health_score, health_score_variant, replacement_recommended and downtime_minutes_ytd."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: []
    output: Equipment
    side_effects: []
  - method: POST
    path: "/fleetcare/equipment/{equipmentId}/usage-readings"
    description: "Records a monotonic usage-hour meter reading for a unit."
    roles: [ContractAdministrator, ServiceCoordinator, FieldTechnician]
    code: 200
    input: [usage_hours]
    output: Equipment
    side_effects:
      - "equipment.usage_hours = request.usage_hours"
      - "runs calculations.pm_status_evaluation and calculations.equipment_health_score"
      - "re-derives replacement_recommended, then the contract's replacement_candidate_count and fleet_renewal_risk"
  - method: POST
    path: "/fleetcare/equipment/{equipmentId}/tag-out"
    description: "A certified safety inspector locks a unit out of service pending documented clearance."
    roles: [SafetyInspector]
    code: 200
    input: [reason]
    output: Equipment
    side_effects:
      - "lifecycle_status = TAGGED_OUT, safety_lockout_reason = request.reason"
      - "Club.open_safety_lockout_count increases by 1"
      - "any ServiceCall on this unit in status OPEN, DISPATCHED, ON_SITE or PARTS_HOLD gets safety_review_required = true"

  # ---- ServiceContract -----------------------------------------------------
  - method: POST
    path: "/fleetcare/contracts"
    description: "Drafts a service contract for a club: coverage tier, parts inclusion, PM frequency, annual base price, parts allowance and term."
    roles: [ContractAdministrator]
    code: 201
    input: [club_id, coverage_tier, parts_inclusion, pm_visits_per_year, annual_base_cents, initial_parts_allowance_cents, term_start_date, term_end_date]
    output: ServiceContract
    side_effects:
      - "status = DRAFT; sla_response_minutes pinned from SLA_RESPONSE_MINUTES_BY_TIER[coverage_tier]"
      - "parts_allowance_total_cents = parts_allowance_remaining_cents = initial_parts_allowance_cents"
      - "credit_cap_cents = round_half_up(annual_base_cents * 0.15); every credit counter starts at 0"
      - "pm_compliance_pct = 100.00, fleet_renewal_risk derived from the club's current fleet"
  - method: GET
    path: "/fleetcare/contracts"
    description: "Lists service contracts, filterable by club, status and tier."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: ["club_id?", "status?", "coverage_tier?", "limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []
  - method: GET
    path: "/fleetcare/contracts/{contractId}"
    description: "Reads one contract including its version (the OCC token for quoting and reconciliation), credit ledger and PM compliance."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []
  - method: POST
    path: "/fleetcare/contracts/{contractId}/activate"
    description: "Activates a drafted contract, making the club eligible for visits, calls and credits."
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status = ACTIVE", "increments ServiceContract.version by 1"]
  - method: POST
    path: "/fleetcare/contracts/{contractId}/suspend"
    description: "Suspends an active contract, cancelling its scheduled preventive visits and releasing their technician reservations."
    roles: [ContractAdministrator]
    code: 200
    input: [reason]
    output: ServiceContract
    side_effects:
      - "status = SUSPENDED, suspension_reason recorded"
      - "cascades SCHEDULED visits to CANCELLED, their RESERVED assignments to RELEASED, and reduces each technician's committed_minutes"
      - "increments ServiceContract.version by 1"
  - method: POST
    path: "/fleetcare/contracts/{contractId}/reinstate"
    description: "Returns a suspended contract to active service; refused while any covered unit is locked out."
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status = ACTIVE, suspension_reason cleared", "increments ServiceContract.version by 1"]
  - method: POST
    path: "/fleetcare/contracts/{contractId}/parts-allowance-adjustments"
    description: "Credits or debits the contract's parts allowance (positive or negative amount_cents) with an audit memo."
    roles: [ContractAdministrator]
    code: 200
    input: [amount_cents, memo]
    output: ServiceContract
    side_effects:
      - "parts_allowance_total_cents and parts_allowance_remaining_cents both move by amount_cents"
      - "the parts_allowance_invariant identity must still hold afterwards"
  - method: POST
    path: "/fleetcare/contracts/{contractId}/credit-reconciliations"
    description: "Reconciles one calendar period of downtime credits: recomputes each CLOSED event with the final operating-hours variant, posts credits in created_at order until the annual cap is consumed, and records the remainder as forgone."
    roles: [ContractAdministrator]
    code: 200
    input: [period_key, expected_contract_version]
    output: { period_key: string, reconciled_event_count: integer, final_credit_total_cents: integer, posted_credit_cents: integer, forgone_credit_cents: integer, contract_credit_accrued_cents: integer, contract_version: integer }
    side_effects:
      - "each matching CLOSED DowntimeEvent moves to RECONCILED with final_credit_cents and posted_credit_cents populated"
      - "contract.credit_accrued_cents, credit_forgone_cents and last_reconciled_period_key are updated"
      - "increments ServiceContract.version by 1"
  - method: GET
    path: "/fleetcare/contracts/{contractId}/credit-summary"
    description: "Computed read of the contract's downtime-credit ledger and the event counts behind it."
    roles: [ContractAdministrator, ClubManager, ServiceCoordinator]
    code: 200
    input: []
    output: { contract_id: string, credit_provisional_cents: integer, credit_accrued_cents: integer, credit_forgone_cents: integer, credit_cap_cents: integer, open_event_count: integer, closed_event_count: integer, reconciled_event_count: integer }
    side_effects: []
  - method: POST
    path: "/fleetcare/contracts/{contractId}/renewal-quotes"
    description: "Issues a renewal quote priced from fleet age, unit condition, parts inclusion, service history and PM compliance; supersedes any previously ISSUED quote on the contract."
    roles: [ContractAdministrator]
    code: 201
    input: [expected_contract_version]
    output: RenewalQuote
    side_effects:
      - "runs calculations.renewal_quote_pricing and pins each unit's line into quote.line_items"
      - "any prior ISSUED quote on the contract becomes SUPERSEDED"
      - "contract.status = RENEWAL_QUOTED; increments ServiceContract.version by 1"

  # ---- RenewalQuote --------------------------------------------------------
  - method: GET
    path: "/fleetcare/renewal-quotes"
    description: "Lists renewal quotes, filterable by contract and status."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: RenewalQuote[]
    side_effects: []
  - method: GET
    path: "/fleetcare/renewal-quotes/{quoteId}"
    description: "Reads one renewal quote including its pinned line items and pricing breakdown."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: []
    output: RenewalQuote
    side_effects: []
  - method: POST
    path: "/fleetcare/renewal-quotes/{quoteId}/accept"
    description: "The club accepts an unexpired issued quote, renewing the term."
    roles: [ClubManager]
    code: 200
    input: []
    output: RenewalQuote
    side_effects: ["quote.status = ACCEPTED", "contract.status = RENEWED", "increments ServiceContract.version by 1"]
  - method: POST
    path: "/fleetcare/renewal-quotes/{quoteId}/decline"
    description: "The club declines an unexpired issued quote, expiring the contract and tearing down its forward schedule."
    roles: [ClubManager]
    code: 200
    input: [reason]
    output: RenewalQuote
    side_effects:
      - "quote.status = DECLINED with decline_reason; contract.status = EXPIRED"
      - "SCHEDULED visits cascade to CANCELLED, their RESERVED assignments to RELEASED, and technician committed_minutes are returned"
      - "increments ServiceContract.version by 1"

  # ---- Technician ---------------------------------------------------------
  - method: POST
    path: "/fleetcare/technicians"
    description: "Registers a field technician with region, skill categories, safety-inspector credential and daily minute capacity."
    roles: [ContractAdministrator, ServiceCoordinator]
    code: 201
    input: [full_name, region_code, skill_categories, "is_safety_inspector?", "max_committed_minutes?"]
    output: Technician
    side_effects: ["duty_status = ON_DUTY, committed_minutes = 0"]
  - method: GET
    path: "/fleetcare/technicians"
    description: "Lists technicians, filterable by region, duty status and inspector credential."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: ["region_code?", "duty_status?", "is_safety_inspector?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []
  - method: GET
    path: "/fleetcare/technicians/{technicianId}"
    description: "Reads one technician including live committed_minutes."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: POST
    path: "/fleetcare/technicians/{technicianId}/duty-status"
    description: "Sets a technician ON_DUTY or OFF_DUTY; an off-duty technician is ineligible for routing and cannot be named on a dispatch."
    roles: [ContractAdministrator, ServiceCoordinator]
    code: 200
    input: [duty_status]
    output: Technician
    side_effects: ["duty_status updated; existing RESERVED and CONFIRMED assignments are left intact and still occupy the calendar"]

  # ---- TechnicianAssignment ----------------------------------------------
  - method: GET
    path: "/fleetcare/technician-assignments"
    description: "Lists technician calendar reservations, filterable by technician, service call, preventive visit and status."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: ["technician_id?", "service_call_id?", "preventive_visit_id?", "status?", "limit?", "offset?"]
    output: TechnicianAssignment[]
    side_effects: []
  - method: GET
    path: "/fleetcare/technician-assignments/{assignmentId}"
    description: "Reads one calendar reservation."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: []
    output: TechnicianAssignment
    side_effects: []
  - method: POST
    path: "/fleetcare/technician-assignments/{assignmentId}/release"
    description: "Releases a reserved or confirmed calendar slot back to the technician, returning the committed minutes."
    roles: [ServiceCoordinator, ContractAdministrator]
    code: 200
    input: [reason]
    output: TechnicianAssignment
    side_effects:
      - "assignment.status = RELEASED, release_reason recorded"
      - "Technician.committed_minutes decreases by planned_minutes, and the freed interval no longer blocks new reservations"

  # ---- PreventiveVisit ----------------------------------------------------
  - method: POST
    path: "/fleetcare/preventive-visits"
    description: "Schedules a preventive-maintenance visit for one unit inside a club window, reserving a technician (named explicitly or chosen by the routing selector) and copying the model's checklist template onto the visit."
    roles: [ServiceCoordinator]
    code: 201
    input: [contract_id, equipment_id, window_start, window_end, "technician_id?"]
    output: PreventiveVisit
    side_effects:
      - "visit_status = SCHEDULED, safety_doc_status = PENDING, planned_minutes = window span"
      - "checklist copied from EquipmentModel.checklist_template with every result PENDING; checklist_total_count set"
      - "creates a RESERVED TechnicianAssignment over [window_start, window_end) and increases Technician.committed_minutes"
      - "enforces calculations.club_visit_capacity and calculations.technician_calendar_conflict"
  - method: GET
    path: "/fleetcare/preventive-visits"
    description: "Lists preventive visits, filterable by contract, equipment, technician, visit status and safety-doc status."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: ["contract_id?", "equipment_id?", "assigned_technician_id?", "visit_status?", "safety_doc_status?", "limit?", "offset?"]
    output: PreventiveVisit[]
    side_effects: []
  - method: GET
    path: "/fleetcare/preventive-visits/{visitId}"
    description: "Reads one preventive visit including its checklist array and both status dimensions."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: []
    output: PreventiveVisit
    side_effects: []
  - method: POST
    path: "/fleetcare/preventive-visits/{visitId}/start"
    description: "The assigned technician starts the visit on site."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: PreventiveVisit
    side_effects: ["visit_status = IN_PROGRESS, started_at = clock", "the visit's assignment moves RESERVED -> CONFIRMED"]
  - method: POST
    path: "/fleetcare/preventive-visits/{visitId}/checklist-results"
    description: "Records the result of one checklist element, optionally flagging that a consumable was replaced; recording the same item_code again overwrites the earlier result."
    roles: [FieldTechnician]
    code: 200
    input: [item_code, result, "consumable_replaced?", "note?"]
    output: PreventiveVisit
    side_effects:
      - "the checklist element is overwritten and checklist_resolved_count, checklist_failed_count, safety_critical_failed_count and consumables_replaced_count are recomputed"
      - "a FAIL on a safety-critical element tags the unit out and increments Club.open_safety_lockout_count"
  - method: POST
    path: "/fleetcare/preventive-visits/{visitId}/complete"
    description: "Completes an in-progress visit once every checklist element is resolved and no safety-critical element failed."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: PreventiveVisit
    side_effects:
      - "visit_status = COMPLETED, completed_at = clock, usage_hours_at_visit snapshot taken"
      - "equipment.usage_hours_at_last_pm reset and pm_status recomputed to OK"
      - "the assignment moves CONFIRMED -> COMPLETED and Technician.committed_minutes is returned"
      - "contract.pm_visits_completed_count increases and pm_compliance_pct is recomputed"
      - "pm_credit_earned becomes true when safety_doc_status is already CERTIFIED"
  - method: POST
    path: "/fleetcare/preventive-visits/{visitId}/cancel"
    description: "Cancels a scheduled visit without touching PM compliance."
    roles: [ServiceCoordinator]
    code: 200
    input: [reason]
    output: PreventiveVisit
    side_effects:
      - "visit_status = CANCELLED with cancellation_reason; the RESERVED assignment is RELEASED and committed_minutes returned"
      - "pm_visits_completed_count and pm_visits_missed_count are both untouched, so pm_compliance_pct does not move"
  - method: POST
    path: "/fleetcare/preventive-visits/{visitId}/mark-missed"
    description: "Marks a scheduled visit missed once its window has closed, damaging PM compliance."
    roles: [ServiceCoordinator]
    code: 200
    input: []
    output: PreventiveVisit
    side_effects:
      - "visit_status = MISSED; the RESERVED assignment is RELEASED and committed_minutes returned"
      - "contract.pm_visits_missed_count increases and pm_compliance_pct is recomputed"
  - method: POST
    path: "/fleetcare/preventive-visits/{visitId}/safety-doc/submit"
    description: "The assigned technician files the visit's safety inspection documentation for review."
    roles: [FieldTechnician]
    code: 200
    input: [inspection_summary]
    output: PreventiveVisit
    side_effects: ["safety_doc_status = SUBMITTED, inspection_summary stored, any prior rejection reason cleared"]
  - method: POST
    path: "/fleetcare/preventive-visits/{visitId}/safety-doc/certify"
    description: "A certified inspector who is NOT the visiting technician signs off the safety documentation."
    roles: [SafetyInspector]
    code: 200
    input: []
    output: PreventiveVisit
    side_effects:
      - "safety_doc_status = CERTIFIED, safety_doc_certified_by_id = acting user"
      - "pm_credit_earned becomes true when visit_status is already COMPLETED"
  - method: POST
    path: "/fleetcare/preventive-visits/{visitId}/safety-doc/reject"
    description: "A certified inspector rejects the safety documentation, which locks the unit out until documented clearance."
    roles: [SafetyInspector]
    code: 200
    input: [rejection_reason]
    output: PreventiveVisit
    side_effects:
      - "safety_doc_status = REJECTED with the reason, pm_credit_earned = false"
      - "equipment.lifecycle_status = TAGGED_OUT with safety_lockout_reason SAFETY_DOC_REJECTED and Club.open_safety_lockout_count increases"

  # ---- ServiceCall --------------------------------------------------------
  - method: POST
    path: "/fleetcare/service-calls"
    description: "Opens a reactive service call for a covered unit, pinning the SLA target from tier and severity and opening a downtime event."
    roles: [ClubManager, ServiceCoordinator]
    code: 201
    input: [contract_id, equipment_id, severity, symptom_code, "injury_reported?"]
    output: ServiceCall
    side_effects:
      - "status = OPEN, reported_at = clock, parts_hold_count = 0"
      - "sla_target_minutes = round_half_up(contract.sla_response_minutes * SEVERITY_SLA_FACTOR[severity])"
      - "equipment moves IN_SERVICE -> DOWN, or is TAGGED_OUT when injury_reported == true (safety_review_required = true)"
      - "creates a DowntimeEvent in status OPEN with started_at = reported_at"
  - method: GET
    path: "/fleetcare/service-calls"
    description: "Lists service calls, filterable by contract, equipment, technician, status and severity."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: ["contract_id?", "equipment_id?", "assigned_technician_id?", "status?", "severity?", "limit?", "offset?"]
    output: ServiceCall[]
    side_effects: []
  - method: GET
    path: "/fleetcare/service-calls/{callId}"
    description: "Reads one service call including sla_target_minutes, response_minutes and sla_met."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: []
    output: ServiceCall
    side_effects: []
  - method: POST
    path: "/fleetcare/service-calls/{callId}/dispatch"
    description: "Dispatches a technician to an open call for a window starting at start_at; when technician_id is omitted the routing selector picks the eligible technician with the fewest committed minutes."
    roles: [ServiceCoordinator]
    code: 200
    input: [start_at, "technician_id?"]
    output: ServiceCall
    side_effects:
      - "status = DISPATCHED, dispatched_at = clock, assigned_technician_id set"
      - "creates a RESERVED TechnicianAssignment of SEVERITY_PLANNED_MINUTES[severity] and increases Technician.committed_minutes"
      - "enforces the contract-active, region, skill, duty, buffer-conflict and capacity validations"
  - method: POST
    path: "/fleetcare/service-calls/{callId}/arrive"
    description: "The assigned technician records arrival, freezing the response time and the SLA verdict."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: ServiceCall
    side_effects:
      - "arrived_at = clock, response_minutes computed, sla_met = (response_minutes <= sla_target_minutes)"
      - "status = ON_SITE; the assignment moves RESERVED -> CONFIRMED"
  - method: POST
    path: "/fleetcare/service-calls/{callId}/parts-hold"
    description: "Places the call on hold for a part, allocating stock from the requested source (new, refurbished, or a loaner swap) and drawing the covered portion from the contract's parts allowance."
    roles: [FieldTechnician]
    code: 201
    input: [part_id, qty, source]
    output: PartOrder
    side_effects:
      - "creates a PartOrder in status ALLOCATED with list_total_cents, covered_cents, allowance_draw_cents and club_billable_cents per calculations.part_order_cost_allocation"
      - "decrements the source stock bucket and increases part.allocated_qty"
      - "decrements contract.parts_allowance_remaining_cents by allowance_draw_cents"
      - "call.status = PARTS_HOLD and call.parts_hold_count increases by 1"
  - method: POST
    path: "/fleetcare/service-calls/{callId}/resume"
    description: "Returns a call from parts hold to on-site work once no allocation is outstanding; the response clock is not restarted."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: ServiceCall
    side_effects: ["status = ON_SITE; arrived_at, response_minutes and sla_met are left untouched"]
  - method: POST
    path: "/fleetcare/service-calls/{callId}/resolve"
    description: "Resolves an on-site call, closing its downtime event with the provisional wall-clock credit and cascading through equipment health to the contract's renewal risk. A call flagged for safety review must carry a clearance signature from a different certified inspector."
    roles: [FieldTechnician]
    code: 200
    input: [resolution_code, "safety_clearance_technician_id?"]
    output: ServiceCall
    side_effects:
      - "status = RESOLVED, resolved_at = clock; the assignment moves CONFIRMED -> COMPLETED and committed_minutes are returned"
      - "the DowntimeEvent closes with downtime_minutes, operating_downtime_minutes, period_key and provisional_credit_cents"
      - "equipment.downtime_minutes_ytd and contract.credit_provisional_cents increase; the unit returns to IN_SERVICE"
      - "equipment.health_score and health_score_variant are recomputed, replacement_recommended re-evaluated, and the contract's replacement_candidate_count / fleet_renewal_risk re-derived"
  - method: POST
    path: "/fleetcare/service-calls/{callId}/cancel"
    description: "Cancels an open or dispatched call, waiving its downtime event and releasing any reservation."
    roles: [ServiceCoordinator, ClubManager]
    code: 200
    input: [reason]
    output: ServiceCall
    side_effects:
      - "status = CANCELLED with cancellation_reason"
      - "the DowntimeEvent moves to WAIVED with no credit computed; a RESERVED assignment is RELEASED and minutes returned"
      - "equipment returns to IN_SERVICE when it was DOWN"

  # ---- PartCatalogEntry ---------------------------------------------------
  - method: POST
    path: "/fleetcare/parts"
    description: "Registers a spare part for a model with its price, criticality and opening new/refurbished stock."
    roles: [PartsPlanner, ContractAdministrator]
    code: 201
    input: [model_id, part_number, category, unit_price_cents, "is_critical_spare?", "initial_on_hand_qty?", "initial_refurb_qty?"]
    output: PartCatalogEntry
    side_effects: ["lifecycle_status = ACTIVE, allocated_qty = 0, stock buckets set from the initial quantities (default 0)"]
  - method: GET
    path: "/fleetcare/parts"
    description: "Lists spare parts, filterable by model, category, lifecycle status and criticality."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: ["model_id?", "category?", "lifecycle_status?", "is_critical_spare?", "limit?", "offset?"]
    output: PartCatalogEntry[]
    side_effects: []
  - method: GET
    path: "/fleetcare/parts/{partId}"
    description: "Reads one spare part including its three stock buckets and obsolescence state."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: []
    output: PartCatalogEntry
    side_effects: []
  - method: POST
    path: "/fleetcare/parts/{partId}/inventory-adjustments"
    description: "Adjusts the new and refurbished stock buckets by signed deltas; driving an announced part's refurbished bucket to zero completes its slide into obsolescence."
    roles: [PartsPlanner]
    code: 200
    input: [new_qty_delta, refurb_qty_delta]
    output: PartCatalogEntry
    side_effects:
      - "on_hand_qty and refurb_on_hand_qty move by their deltas; neither may go negative"
      - "an END_OF_SUPPORT_ANNOUNCED part whose refurb_on_hand_qty reaches 0 becomes OBSOLETE and cascades support_status UNSUPPORTED onto every unit of its model when it is a critical spare"
  - method: POST
    path: "/fleetcare/parts/{partId}/declare-end-of-support"
    description: "Declares manufacturer end-of-support for a part: it becomes END_OF_SUPPORT_ANNOUNCED while refurbished stock remains and OBSOLETE otherwise, notifying every affected unit when the part is a critical spare."
    roles: [PartsPlanner]
    code: 200
    input: []
    output: PartCatalogEntry
    side_effects:
      - "lifecycle_status = END_OF_SUPPORT_ANNOUNCED when refurb_on_hand_qty > 0, else OBSOLETE; eos_declared_at = clock"
      - "critical spares cascade support_status and eos_notified_at onto every Equipment of the model"
      - "each touched unit re-evaluates replacement_recommended (relaxed 60.00 threshold once UNSUPPORTED), then the covering contract's obsolete_unit_count, replacement_candidate_count and fleet_renewal_risk are recomputed"

  # ---- PartOrder ----------------------------------------------------------
  - method: GET
    path: "/fleetcare/part-orders"
    description: "Lists part orders, filterable by service call, part, status and source."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: ["service_call_id?", "part_id?", "status?", "source?", "limit?", "offset?"]
    output: PartOrder[]
    side_effects: []
  - method: GET
    path: "/fleetcare/part-orders/{orderId}"
    description: "Reads one part order including its allowance and club-billable split."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: []
    output: PartOrder
    side_effects: []
  - method: POST
    path: "/fleetcare/part-orders/{orderId}/install"
    description: "The assigned technician installs an allocated part; a loaner swap additionally mitigates the open downtime event from this instant."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: PartOrder
    side_effects:
      - "status = INSTALLED, installed_at = clock, part.allocated_qty decreases (the unit is consumed, no bucket restore)"
      - "source LOANER_SWAP sets equipment.loaner_active = true and stamps mitigated_at on the call's OPEN DowntimeEvent, capping both credit variants at that instant"
  - method: POST
    path: "/fleetcare/part-orders/{orderId}/cancel"
    description: "Cancels an allocated part order, restoring the originating stock bucket and returning the allowance draw."
    roles: [ServiceCoordinator, PartsPlanner]
    code: 200
    input: [reason]
    output: PartOrder
    side_effects:
      - "status = CANCELLED with cancellation_reason; allowance_draw_cents and club_billable_cents are zeroed"
      - "contract.parts_allowance_remaining_cents is credited back the original draw"
      - "the exact bucket that was debited (on_hand_qty for NEW, refurb_on_hand_qty for REFURBISHED and LOANER_SWAP) is restored and allocated_qty decreases"

  # ---- DowntimeEvent ------------------------------------------------------
  - method: GET
    path: "/fleetcare/downtime-events"
    description: "Lists downtime events, filterable by contract, equipment, service call, status and period key."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: ["contract_id?", "equipment_id?", "service_call_id?", "status?", "period_key?", "limit?", "offset?"]
    output: DowntimeEvent[]
    side_effects: []
  - method: GET
    path: "/fleetcare/downtime-events/{eventId}"
    description: "Reads one downtime event with both credit variants side by side (provisional wall-clock and final operating-hours)."
    roles: [ContractAdministrator, ServiceCoordinator, PartsPlanner, FieldTechnician, SafetyInspector, ClubManager]
    code: 200
    input: []
    output: DowntimeEvent
    side_effects: []
  - method: POST
    path: "/fleetcare/downtime-events/{eventId}/waive"
    description: "Waives a downtime event as a goodwill or data-quality correction, reversing every ledger and health effect it had already produced."
    roles: [ContractAdministrator]
    code: 200
    input: [waive_reason]
    output: DowntimeEvent
    side_effects:
      - "status = WAIVED with waive_reason"
      - "a CLOSED event returns its provisional credit and downtime minutes; a RECONCILED event additionally returns posted and forgone credit"
      - "equipment.health_score, replacement_recommended, contract.replacement_candidate_count and fleet_renewal_risk are recomputed after the reversal"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - id: ERR_ROLE_FORBIDDEN
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_CLUB_SCOPE_FORBIDDEN
    http: 403
    condition: "a ClubManager acts on a resource belonging to a different club"
  - id: ERR_TECHNICIAN_NOT_ASSIGNED
    http: 403
    condition: "a FieldTechnician acts on a call, visit or part order that is not assigned to them"
  - id: ERR_INSPECTOR_NOT_CERTIFIED
    http: 403
    condition: "the acting SafetyInspector's Technician row has is_safety_inspector == false"

  # ---- not found ----------------------------------------------------------
  - id: ERR_CLUB_NOT_FOUND
    http: 404
    condition: "no Club matches the id in the path or body"
  - id: ERR_MODEL_NOT_FOUND
    http: 404
    condition: "no EquipmentModel matches the id in the path or body"
  - id: ERR_EQUIPMENT_NOT_FOUND
    http: 404
    condition: "no Equipment matches the id in the path or body"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no ServiceContract matches the id in the path or body"
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "no Technician matches the id in the path, or a technician_id / safety_clearance_technician_id in the body"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "no PreventiveVisit matches the id in the path"
  - id: ERR_CALL_NOT_FOUND
    http: 404
    condition: "no ServiceCall matches the id in the path"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no TechnicianAssignment matches the id in the path"
  - id: ERR_PART_NOT_FOUND
    http: 404
    condition: "no PartCatalogEntry matches the id in the path or body"
  - id: ERR_PART_ORDER_NOT_FOUND
    http: 404
    condition: "no PartOrder matches the id in the path"
  - id: ERR_DOWNTIME_EVENT_NOT_FOUND
    http: 404
    condition: "no DowntimeEvent matches the id in the path"
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "no RenewalQuote matches the id in the path"

  # ---- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, an enum carries an undeclared value, a count/amount/qty is negative where it must not be, or a timestamp does not parse as ISO-8601 UTC"

  # ---- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal the live ServiceContract.version on renewal quoting or credit reconciliation"

  # ---- state preconditions ------------------------------------------------
  - id: ERR_CONTRACT_INVALID_STATE
    http: 409
    condition: "the contract lifecycle action does not match the contract's status (activate needs DRAFT, suspend needs ACTIVE, reinstate needs SUSPENDED, quoting needs ACTIVE or RENEWAL_QUOTED)"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "operational work (call creation, dispatch, visit scheduling, allowance adjustment, reconciliation) is attempted while the covering contract is not ACTIVE"
  - id: ERR_CALL_INVALID_STATE
    http: 409
    condition: "the service-call action does not match the call's status"
  - id: ERR_VISIT_INVALID_STATE
    http: 409
    condition: "the visit action does not match visit_status, or mark-missed is attempted before window_end"
  - id: ERR_SAFETY_DOC_INVALID_STATE
    http: 409
    condition: "the safety-documentation action does not match safety_doc_status, or submission is attempted before the visit has started"
  - id: ERR_PART_ORDER_INVALID_STATE
    http: 409
    condition: "install or cancel is attempted on a part order that is not ALLOCATED, or install runs while the owning call is not on parts hold"
  - id: ERR_DOWNTIME_INVALID_STATE
    http: 409
    condition: "waive is attempted on an already WAIVED downtime event"
  - id: ERR_ASSIGNMENT_INVALID_STATE
    http: 409
    condition: "release is attempted on an assignment that is already RELEASED or COMPLETED"
  - id: ERR_QUOTE_NOT_ISSUED
    http: 409
    condition: "accept or decline is attempted on a quote that is not ISSUED, or whose contract is no longer RENEWAL_QUOTED"
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "accept or decline is attempted at or after the quote's expires_at"

  # ---- safety and compliance ---------------------------------------------
  - id: ERR_SAFETY_LOCKOUT_OPEN
    http: 409
    condition: "preventive work is started on a TAGGED_OUT unit, or a contract is reinstated while its club still has an open safety lockout"
  - id: ERR_SAFETY_CLEARANCE_REQUIRED
    http: 422
    condition: "a call flagged safety_review_required is resolved without a valid inspector clearance signature"
  - id: ERR_SAFETY_CERTIFICATION_REQUIRED
    http: 422
    condition: "a TAGGED_OUT unit is dispatched to a technician who is not a certified safety inspector"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the same technician both performs the work and signs the safety control (certifying or rejecting their own visit documentation, or clearing their own call)"
  - id: ERR_INJURY_SEVERITY_MISMATCH
    http: 422
    condition: "a call with injury_reported == true is filed at a severity other than CRITICAL"
  - id: ERR_SAFETY_CRITICAL_FAIL_BLOCKS_COMPLETION
    http: 409
    condition: "a visit is completed while at least one safety-critical checklist element has result FAIL"

  # ---- referential coherence ---------------------------------------------
  - id: ERR_EQUIPMENT_CLUB_MISMATCH
    http: 422
    condition: "the referenced equipment belongs to a club other than the referenced contract's club"
  - id: ERR_PART_MODEL_MISMATCH
    http: 422
    condition: "the requested part belongs to a different equipment model than the unit being serviced"
  - id: ERR_TECHNICIAN_REGION_MISMATCH
    http: 422
    condition: "the named technician's region_code differs from the club's region_code"
  - id: ERR_TECHNICIAN_SKILL_MISMATCH
    http: 422
    condition: "the unit's model category is absent from the named technician's skill_categories"
  - id: ERR_TECHNICIAN_OFF_DUTY
    http: 409
    condition: "the named technician's duty_status is OFF_DUTY"

  # ---- temporal and calendar ---------------------------------------------
  - id: ERR_VISIT_WINDOW_INVALID
    http: 422
    condition: "window_end is not after window_start, the span exceeds 480 minutes, or the window falls outside the club's daily operating window"
  - id: ERR_CLUB_VISIT_CAPACITY
    http: 409
    condition: "the club's concurrent-visit limit would be exceeded over the requested closed interval (touching windows count as concurrent)"
  - id: ERR_TECHNICIAN_WINDOW_CONFLICT
    http: 409
    condition: "the requested interval collides with an existing RESERVED or CONFIRMED assignment of the technician under the symmetric 45-minute travel buffer"
  - id: ERR_TECHNICIAN_CAPACITY_EXCEEDED
    http: 409
    condition: "the new reservation would push the technician's committed_minutes past max_committed_minutes"

  # ---- domain constraints -------------------------------------------------
  - id: ERR_ACTIVE_CONTRACT_EXISTS
    http: 409
    condition: "the club already has a contract in status ACTIVE, SUSPENDED or RENEWAL_QUOTED"
  - id: ERR_SERIAL_DUPLICATE
    http: 409
    condition: "another Equipment row already carries the submitted serial_number"
  - id: ERR_TIER_PARTS_MISMATCH
    http: 422
    condition: "the requested parts_inclusion is not offered at the requested coverage_tier (FULL requires SILVER or GOLD)"
  - id: ERR_PM_FREQUENCY_BELOW_TIER
    http: 422
    condition: "pm_visits_per_year is below the tier minimum (BRONZE 1, SILVER 2, GOLD 4)"
  - id: ERR_USAGE_REGRESSION
    http: 422
    condition: "a usage reading is lower than the unit's stored usage_hours"
  - id: ERR_CHECKLIST_ITEM_UNKNOWN
    http: 422
    condition: "the submitted item_code is not an element of this visit's checklist"
  - id: ERR_CHECKLIST_INCOMPLETE
    http: 409
    condition: "a visit is completed while at least one checklist element is still PENDING"
  - id: ERR_DUPLICATE_OPEN_CALL
    http: 409
    condition: "the unit already has a service call in status OPEN, DISPATCHED, ON_SITE or PARTS_HOLD"
  - id: ERR_PARTS_HOLD_LIMIT
    http: 409
    condition: "a fourth parts hold is attempted on the same service call"
  - id: ERR_PART_OUT_OF_STOCK
    http: 409
    condition: "the requested source bucket holds fewer than qty units"
  - id: ERR_PART_SOURCE_UNAVAILABLE
    http: 422
    condition: "source NEW is requested for a part whose lifecycle_status is OBSOLETE"
  - id: ERR_NO_ELIGIBLE_TECHNICIAN
    http: 422
    condition: "automatic routing finds no technician satisfying duty, region, skill, calendar and capacity eligibility"
  - id: ERR_UNRESOLVED_PART_ORDER
    http: 409
    condition: "a call is resumed while one of its part orders is still ALLOCATED"
  - id: ERR_FLEET_EMPTY
    http: 422
    condition: "a renewal quote is requested for a club with no equipment"
  - id: ERR_PERIOD_ALREADY_RECONCILED
    http: 409
    condition: "the requested period_key equals contract.last_reconciled_period_key, or no CLOSED event exists in that period"

  # ---- fiscal -------------------------------------------------------------
  - id: ERR_PARTS_ALLOWANCE_EXHAUSTED
    http: 409
    condition: "a covered part is requested while contract.parts_allowance_remaining_cents is 0"
  - id: ERR_ALLOWANCE_ADJUSTMENT_INVALID
    http: 422
    condition: "a parts-allowance adjustment would drive the total or the remaining balance below zero"
  - id: ERR_INVENTORY_ADJUSTMENT_INVALID
    http: 422
    condition: "an inventory adjustment would drive a stock bucket below zero"

# =============================================================================
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: ContractAdministrator
    description: "Owns the commercial contract: drafting, activation, suspension, allowance adjustments, credit reconciliation, renewal quoting and goodwill waivers. Never performs field work and never signs a safety control."
    identity: opaque
    exclusive_operations:
      - "POST /fleetcare/clubs"
      - "POST /fleetcare/contracts"
      - "POST /fleetcare/contracts/{contractId}/activate"
      - "POST /fleetcare/contracts/{contractId}/suspend"
      - "POST /fleetcare/contracts/{contractId}/reinstate"
      - "POST /fleetcare/contracts/{contractId}/parts-allowance-adjustments"
      - "POST /fleetcare/contracts/{contractId}/credit-reconciliations"
      - "POST /fleetcare/contracts/{contractId}/renewal-quotes"
      - "POST /fleetcare/downtime-events/{eventId}/waive"
    shared_operations:
      - "POST /fleetcare/equipment-models (with PartsPlanner)"
      - "POST /fleetcare/equipment (with ServiceCoordinator)"
      - "POST /fleetcare/equipment/{equipmentId}/usage-readings (with ServiceCoordinator, FieldTechnician)"
      - "POST /fleetcare/technicians and duty-status (with ServiceCoordinator)"
      - "POST /fleetcare/parts (with PartsPlanner)"
      - "POST /fleetcare/technician-assignments/{assignmentId}/release (with ServiceCoordinator)"
      - "GET /fleetcare/contracts/{contractId}/credit-summary (with ClubManager, ServiceCoordinator)"
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"

  - name: ServiceCoordinator
    description: "Runs the dispatch board and the preventive schedule: books visits, dispatches technicians, cancels or marks visits missed, and releases calendar slots."
    identity: opaque
    exclusive_operations:
      - "POST /fleetcare/preventive-visits"
      - "POST /fleetcare/preventive-visits/{visitId}/cancel"
      - "POST /fleetcare/preventive-visits/{visitId}/mark-missed"
      - "POST /fleetcare/service-calls/{callId}/dispatch"
    shared_operations:
      - "POST /fleetcare/service-calls (with ClubManager)"
      - "POST /fleetcare/service-calls/{callId}/cancel (with ClubManager)"
      - "POST /fleetcare/equipment (with ContractAdministrator)"
      - "POST /fleetcare/equipment/{equipmentId}/usage-readings"
      - "POST /fleetcare/technicians and duty-status (with ContractAdministrator)"
      - "POST /fleetcare/technician-assignments/{assignmentId}/release (with ContractAdministrator)"
      - "POST /fleetcare/part-orders/{orderId}/cancel (with PartsPlanner)"
      - "GET /fleetcare/contracts/{contractId}/credit-summary"
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"

  - name: PartsPlanner
    description: "Owns the spare-parts catalogue and its obsolescence lifecycle: stock adjustments, end-of-support declarations and refurbished sourcing policy."
    identity: opaque
    exclusive_operations:
      - "POST /fleetcare/parts/{partId}/inventory-adjustments"
      - "POST /fleetcare/parts/{partId}/declare-end-of-support"
    shared_operations:
      - "POST /fleetcare/parts (with ContractAdministrator)"
      - "POST /fleetcare/equipment-models (with ContractAdministrator)"
      - "POST /fleetcare/part-orders/{orderId}/cancel (with ServiceCoordinator)"
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"

  - name: FieldTechnician
    description: "Performs the work: starts and completes preventive visits, records checklist results, files safety documentation, arrives at and resolves service calls, and installs parts. X-User-ID is the Technician row's id and must match the assignment on the target work item."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /fleetcare/preventive-visits/{visitId}/start"
      - "POST /fleetcare/preventive-visits/{visitId}/checklist-results"
      - "POST /fleetcare/preventive-visits/{visitId}/complete"
      - "POST /fleetcare/preventive-visits/{visitId}/safety-doc/submit"
      - "POST /fleetcare/service-calls/{callId}/arrive"
      - "POST /fleetcare/service-calls/{callId}/parts-hold"
      - "POST /fleetcare/service-calls/{callId}/resume"
      - "POST /fleetcare/service-calls/{callId}/resolve"
      - "POST /fleetcare/part-orders/{orderId}/install"
    shared_operations:
      - "POST /fleetcare/equipment/{equipmentId}/usage-readings"
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"

  - name: SafetyInspector
    description: "A Technician carrying the inspector credential (is_safety_inspector == true). Tags units out of service and certifies or rejects visit safety documentation — never for a visit they performed themselves. X-User-ID is the Technician row's id."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /fleetcare/equipment/{equipmentId}/tag-out"
      - "POST /fleetcare/preventive-visits/{visitId}/safety-doc/certify"
      - "POST /fleetcare/preventive-visits/{visitId}/safety-doc/reject"
    shared_operations:
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"
    note: "Segregation of duties: the inspector signing a visit's documentation must differ from visit.assigned_technician_id, and the clearance signer named on a resolve must differ from call.assigned_technician_id."

  - name: ClubManager
    description: "The club site itself. Reports equipment problems, cancels its own calls, and accepts or declines renewal quotes. X-User-ID is the Club row's id and every scoped operation is confined to that club."
    identity: "entity_backed:Club"
    exclusive_operations:
      - "POST /fleetcare/renewal-quotes/{quoteId}/accept"
      - "POST /fleetcare/renewal-quotes/{quoteId}/decline"
    shared_operations:
      - "POST /fleetcare/service-calls (with ServiceCoordinator)"
      - "POST /fleetcare/service-calls/{callId}/cancel (with ServiceCoordinator)"
      - "GET /fleetcare/contracts/{contractId}/credit-summary"
      - "every GET read endpoint (club-scoped)"
      - "POST /_clock/set_current_utc"
