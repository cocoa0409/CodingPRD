      - name: calc_reconciliation_scope_excludes_other_agreement_and_refunded_charges
        claim_type: input_set_filtering
        grounds:
          - calculations.reconciliation_totals
          - calculations.drop_refund
          - endpoints[POST /reconciliation-runs]
          - endpoints[GET /reconciliation-runs]
        distinguishing_aspect: |
          A run is scoped by (agreement, term) through charge -> adoption -> title -> agreement, so
          PUB-B's 11088-cent share never leaks into PUB-A's invoice and vice versa. Within PUB-A the
          fully reversed charge (dropped before add/drop, billing_status REFUNDED) is excluded from
