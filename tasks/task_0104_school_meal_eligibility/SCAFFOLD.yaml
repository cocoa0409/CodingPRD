# =============================================================================
# Task 0104 — K-12 School Meal Eligibility Review (scaffold §1.0–§1.7)
# =============================================================================

scenario: |
  K-12 School Meal Eligibility Review: Free/Reduced Lunch (FRL) application,
  household income review, automatic renewal, allergy profile, menu nutrition
  labeling, USDA reimbursement, parent account top-up.

domain_name: school-meal-eligibility
api_prefix: /districts

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - scheduled_deferred_actions
    - version_pinning_on_approval
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "School district name" }
      - { name: school_year_start, type: datetime, source: input, description: "ISO date for start of the current school year (UTC midnight)" }
      - { name: usda_reimbursement_total_cents, type: integer, source: computed, description: "Sum of finalized USDA reimbursement claims minted under this district, in whole cents" }
      - { name: top_up_outstanding_cents, type: integer, source: computed, description: "Sum of (PaidLedgerEntry.amount_cents for type=TOP_UP) - (PaidLedgerEntry.amount_cents for type=CHARGE) - (PaidLedgerEntry.amount_cents for type=REFUND, sign-aware) across all ParentAccounts in this district, computed by waterfall_consumption" }

  - name: Student
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "Owning district id" }
      - { name: parent_account_id, type: string, source: input, description: "ParentAccount that funds this student's meals" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: grade_level, type: integer, source: input, description: "Grade level 0..12 (0 = kindergarten)", constraints: "0..12 inclusive" }
      - { name: eligibility_tier, type: enum, source: computed, description: "Current FRL tier: FREE | REDUCED | PAID — derived from the latest APPROVED FrlApplication for this student in the current school year; PAID when none exists" }
      - { name: eligibility_application_id, type: string, source: computed, description: "id of the FrlApplication that minted the current eligibility_tier, or null when eligibility_tier=PAID with no application" }
      - { name: allergy_block_active, type: boolean, source: computed, description: "True iff student has at least one AllergyProfileEntry with status=ACTIVE that intersects today's menu items" }
      - { name: meals_served_today_count, type: integer, source: computed, description: "Number of MealServingRecord rows for this student with serving_date == District.school_year_start-anchored current day, status=SERVED" }

  - name: ParentAccount
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "Owning district id" }
      - { name: parent_email, type: string, source: input, description: "Parent contact email; unique within District" }
      - { name: prepaid_balance_cents, type: integer, source: computed, description: "Sum of TOP_UP minus CHARGE minus REFUND ledger entries; never negative" }

  - name: FrlApplication
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "Owning district id" }
      - { name: student_id, type: string, source: input, description: "Student this application is for" }
      - { name: school_year_start, type: datetime, source: system, description: "Captured at submission time from District.school_year_start; pins which year this application governs" }
      - { name: household_size, type: integer, source: input, description: "Number of people in the household; >= 1" }
      - { name: declared_annual_income_cents, type: integer, source: input, description: "Annual household income in whole cents" }
      - { name: documents_attached_count, type: integer, source: input, description: "Number of supporting documents attached", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | INFO_REQUESTED | APPROVED | DENIED | RENEWED_FROM_PRIOR" }
      - { name: decided_tier, type: enum, source: computed, description: "Tier minted at approval: FREE | REDUCED | DENIED_PAID; set on APPROVED transition; null otherwise" }
      - { name: federal_poverty_guideline_cents, type: integer, source: system, description: "Snapshot of the federal poverty guideline (cents/year) for this household_size at the moment of APPROVED" }
      - { name: prior_year_application_id, type: string, source: input, description: "FrlApplication id from prior school year used for auto-renewal (null otherwise)" }
      - { name: review_note, type: string, source: input, description: "Reviewer note attached on INFO_REQUESTED or DENIED" }
      - { name: reviewer_user_id, type: string, source: system, description: "id of the DistrictReviewer who decided the application" }

  - name: AllergyProfileEntry
    parent: Student
    common_fields: false
    fields:
      - { name: student_id, type: string, source: system, description: "Owning student id" }
      - { name: allergen, type: enum, source: input, description: "PEANUT | TREE_NUT | DAIRY | EGG | SOY | WHEAT | FISH | SHELLFISH" }
      - { name: severity, type: enum, source: input, description: "MILD | MODERATE | SEVERE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED — ACTIVE on creation, REVOKED on delete" }
      - { name: doctor_note_attached, type: boolean, source: input, description: "True iff doctor note submitted with this entry" }

  - name: MenuItem
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "Owning district id" }
      - { name: name, type: string, source: input, description: "Menu item display name" }
      - { name: contains_allergens, type: array, source: input, description: "Array of allergen enums (PEANUT, TREE_NUT, DAIRY, EGG, SOY, WHEAT, FISH, SHELLFISH); empty when no labeled allergens" }
      - { name: calories, type: integer, source: input, description: "Per-serving calories, integer >= 0" }
      - { name: sodium_mg, type: integer, source: input, description: "Per-serving sodium in milligrams, integer >= 0" }
      - { name: full_price_cents, type: integer, source: input, description: "Full price (PAID tier) for this item, in whole cents" }
      - { name: reimbursable, type: boolean, source: input, description: "True iff USDA-reimbursable when served as part of a reimbursable meal" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: MealServingRecord
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "Owning district id" }
      - { name: student_id, type: string, source: input, description: "Student receiving the meal" }
      - { name: menu_item_id, type: string, source: input, description: "MenuItem served" }
      - { name: serving_date, type: datetime, source: system, description: "Calendar date the meal was served (UTC midnight)" }
      - { name: status, type: enum, source: system, description: "SERVED | VOIDED — SERVED on creation; VOIDED on cancellation" }
      - { name: tier_at_serving, type: enum, source: system, description: "Snapshot of Student.eligibility_tier at moment of SERVED: FREE | REDUCED | PAID" }
      - { name: charged_cents, type: integer, source: computed, description: "Amount charged to ParentAccount for this serving (0 for FREE; REDUCED_COPAY_CENTS for REDUCED; MenuItem.full_price_cents for PAID)" }
      - { name: provisional_reimbursement_cents, type: integer, source: computed, description: "USDA reimbursement minted at SERVED time using the tier_at_serving snapshot" }

  - name: UsdaReimbursementClaim
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "Owning district id" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start (UTC midnight) of the claim period" }
      - { name: period_end, type: datetime, source: input, description: "Inclusive end (UTC midnight) of the claim period; period_end >= period_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | FINALIZED | REJECTED" }
      - { name: serving_record_ids, type: array, source: computed, description: "Snapshot of MealServingRecord ids included at FINALIZED time; ordered by created_at ASC, tie-break by id ASC" }
      - { name: final_reimbursement_cents, type: integer, source: computed, description: "Total chronological reimbursement after dedupe and allergy-block adjustment, computed on FINALIZED transition" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Sum of MealServingRecord.provisional_reimbursement_cents for the included rows" }

  - name: PaidLedgerEntry
    parent: ParentAccount
    common_fields: false
    fields:
      - { name: parent_account_id, type: string, source: system, description: "Owning ParentAccount id" }
      - { name: type, type: enum, source: system, description: "TOP_UP | CHARGE | REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Positive integer cents; sign meaning is encoded by type" }
      - { name: serving_record_id, type: string, source: system, description: "MealServingRecord id this entry was caused by (null for TOP_UP)" }
      - { name: occurred_at, type: datetime, source: system, description: "Server-stamped event time (ISO 8601 UTC, 3 fractional digits)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FrlApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, RENEWED_FROM_PRIOR]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /districts/{district_id}/frl-applications/{id}/submit"
        actor: Parent
        preconditions:
          - "FrlApplication.status == DRAFT"
          - "household_size >= 1"
          - "declared_annual_income_cents >= 0"
        side_effects:
          - "FrlApplication.school_year_start := District.school_year_start (snapshot)"

      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /districts/{district_id}/frl-applications/{id}/request-info"
        actor: DistrictReviewer
        preconditions:
          - "FrlApplication.status == SUBMITTED"
          - "review_note in body is non-empty"
        side_effects:
          - "FrlApplication.review_note := body.review_note"
          - "FrlApplication.reviewer_user_id := X-User-ID"

      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /districts/{district_id}/frl-applications/{id}/resubmit"
        actor: Parent
        preconditions:
          - "FrlApplication.status == INFO_REQUESTED"
          - "Acting parent must own Student.parent_account_id"
        side_effects:
          - "FrlApplication.documents_attached_count := body.documents_attached_count"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /districts/{district_id}/frl-applications/{id}/approve"
        actor: DistrictReviewer
        preconditions:
          - "FrlApplication.status == SUBMITTED"
          - "Reviewer is not the parent who submitted (segregation of duties)"
          - "frl_tier_classification produces FREE or REDUCED (i.e., decided_tier != DENIED_PAID)"
        side_effects:
          - "FrlApplication.decided_tier := frl_tier_classification.output"
          - "FrlApplication.federal_poverty_guideline_cents := snapshot from constants for household_size"
          - "FrlApplication.reviewer_user_id := X-User-ID"
          - "Student.eligibility_tier := decided_tier (FREE or REDUCED)"
          - "Student.eligibility_application_id := FrlApplication.id"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /districts/{district_id}/frl-applications/{id}/deny"
        actor: DistrictReviewer
        preconditions:
          - "FrlApplication.status == SUBMITTED"
          - "Reviewer is not the parent who submitted (segregation of duties)"
          - "review_note in body is non-empty"
        side_effects:
          - "FrlApplication.decided_tier := DENIED_PAID"
          - "FrlApplication.reviewer_user_id := X-User-ID"
          - "Student.eligibility_tier := PAID (only if no other APPROVED application in current school year)"
          - "Student.eligibility_application_id := null"

      - from: DRAFT
        to: RENEWED_FROM_PRIOR
        trigger: "POST /districts/{district_id}/frl-applications/{id}/auto-renew"
        actor: system
        preconditions:
          - "FrlApplication.status == DRAFT"
          - "prior_year_application_id is not null and resolves to an APPROVED application in the prior school year"
          - "Prior application's decided_tier in {FREE, REDUCED}"
          - "household_size and declared_annual_income_cents on new application match prior application's snapshot (within ±5% tolerance on income, exact match on household_size)"
        side_effects:
          - "FrlApplication.decided_tier := prior application's decided_tier"
          - "FrlApplication.federal_poverty_guideline_cents := snapshot from constants for household_size"
          - "FrlApplication.reviewer_user_id := 'SYSTEM_AUTO_RENEW'"
          - "Student.eligibility_tier := decided_tier"
          - "Student.eligibility_application_id := FrlApplication.id"

  - entity: MealServingRecord
    initial_state: SERVED
    terminal_states: [VOIDED]
    transitions:
      - from: (none)
        to: SERVED
        trigger: "POST /districts/{district_id}/meal-servings"
        actor: CafeteriaManager
        preconditions:
          - "Student.allergy_block_active is false (no ACTIVE allergen intersects MenuItem.contains_allergens)"
          - "MenuItem.status == ACTIVE"
          - "Student.meals_served_today_count == 0 (at most one SERVED record per Student per serving_date)"
          - "If tier_at_serving == PAID: ParentAccount.prepaid_balance_cents >= MenuItem.full_price_cents"
        side_effects:
          - "MealServingRecord.tier_at_serving := Student.eligibility_tier (snapshot)"
          - "MealServingRecord.charged_cents := meal_charge_calc.output"
          - "MealServingRecord.provisional_reimbursement_cents := usda_reimbursement_provisional.output"
          - "If charged_cents > 0: append PaidLedgerEntry(type=CHARGE, amount_cents=charged_cents, serving_record_id=this.id) → ParentAccount.prepaid_balance_cents decreases by charged_cents"
          - "Student.meals_served_today_count := 1"

      - from: SERVED
        to: VOIDED
        trigger: "POST /districts/{district_id}/meal-servings/{id}/void"
        actor: CafeteriaManager
        preconditions:
          - "MealServingRecord.status == SERVED"
          - "MealServingRecord.id is not present in any UsdaReimbursementClaim.serving_record_ids with claim.status in {SUBMITTED, FINALIZED}"
        side_effects:
          - "MealServingRecord.status := VOIDED"
          - "If charged_cents > 0: append PaidLedgerEntry(type=REFUND, amount_cents=charged_cents, serving_record_id=this.id) → ParentAccount.prepaid_balance_cents increases by charged_cents"
          - "MealServingRecord.provisional_reimbursement_cents := 0"
          - "Student.meals_served_today_count decreases by 1 if serving_date is today"

  - entity: UsdaReimbursementClaim
    initial_state: DRAFT
    terminal_states: [FINALIZED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /districts/{district_id}/usda-claims/{id}/submit"
        actor: AuditOfficer
        preconditions:
          - "UsdaReimbursementClaim.status == DRAFT"
          - "period_end >= period_start"
          - "No other claim with status in {SUBMITTED, FINALIZED} overlaps this period for the same district (overlap = period_end_existing >= period_start_new AND period_start_existing <= period_end_new)"
        side_effects:
          - "Claim is locked: contained MealServingRecord rows cannot be VOIDED while SUBMITTED"

      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /districts/{district_id}/usda-claims/{id}/finalize"
        actor: AuditOfficer
        preconditions:
          - "UsdaReimbursementClaim.status == SUBMITTED"
          - "AuditOfficer must not be the DistrictReviewer who approved any contained FrlApplication (segregation of duties on claim finalization)"
        side_effects:
          - "UsdaReimbursementClaim.serving_record_ids := snapshot of MealServingRecord ids where status=SERVED AND serving_date in [period_start, period_end], ordered by created_at ASC, tie-break id ASC"
          - "UsdaReimbursementClaim.provisional_total_cents := sum of provisional_reimbursement_cents for snapshot rows"
          - "UsdaReimbursementClaim.final_reimbursement_cents := usda_reimbursement_final.output"
          - "District.usda_reimbursement_total_cents increases by final_reimbursement_cents"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /districts/{district_id}/usda-claims/{id}/reject"
        actor: AuditOfficer
        preconditions:
          - "UsdaReimbursementClaim.status == SUBMITTED"
        side_effects:
          - "Claim no longer locks contained servings"

  - entity: MenuItem
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /districts/{district_id}/menu-items/{id}/retire"
        actor: CafeteriaManager
        preconditions:
          - "MenuItem.status == ACTIVE"
          - "No MealServingRecord with status=SERVED references this MenuItem on serving_date >= today (UTC midnight today)"
        side_effects:
          - "MenuItem.status := RETIRED"

  - entity: AllergyProfileEntry
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "DELETE /districts/{district_id}/students/{student_id}/allergy-entries/{id}"
        actor: Parent
        preconditions:
          - "AllergyProfileEntry.status == ACTIVE"
          - "Acting parent must own Student.parent_account_id"
        side_effects:
          - "AllergyProfileEntry.status := REVOKED"
          - "Student.allergy_block_active is recomputed against remaining ACTIVE entries"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two CafeteriaManagers concurrently POST /meal-servings for the same Student on the same serving_date"
    guarantee: "Exactly one SERVED record per (student_id, serving_date) — second request rejected"
    error_id: ERR_MEAL_ALREADY_SERVED_TODAY
    http_status: 409
    serialization: "First-writer-wins on (student_id, serving_date) uniqueness"

  - scenario: "DistrictReviewer approves and another DistrictReviewer denies the same FrlApplication simultaneously"
    guarantee: "Exactly one decision succeeds; loser receives ERR_INVALID_STATE because the status is no longer SUBMITTED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on FrlApplication.status"

  - scenario: "Two AuditOfficers concurrently submit two UsdaReimbursementClaims whose periods overlap"
    guarantee: "Exactly one claim transitions to SUBMITTED; the second is rejected because its period overlaps the now-locked claim"
    error_id: ERR_CLAIM_PERIOD_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on (district_id, period overlap) check at SUBMITTED time"

  - scenario: "Two TOP_UP requests on the same ParentAccount race; a CHARGE for a PAID serving is concurrent"
    guarantee: "Ledger entries serialize on PaidLedgerEntry.occurred_at; a CHARGE that would drive prepaid_balance_cents below zero based on the snapshot at validation time is rejected"
    error_id: ERR_PREPAID_BALANCE_INSUFFICIENT
    http_status: 409
    serialization: "First-writer-wins on PaidLedgerEntry append; balance check re-evaluated at commit"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: frl_tier_classification
    trigger: "FrlApplication.SUBMITTED → APPROVED transition (also evaluated on RENEWED_FROM_PRIOR for snapshot)"
    algorithm: threshold
    formula: |
      ratio = declared_annual_income_cents / FEDERAL_POVERTY_GUIDELINE_BY_SIZE[household_size]
      if ratio <= FREE_THRESHOLD_RATIO (1.30): output = FREE
      elif ratio <= REDUCED_THRESHOLD_RATIO (1.85): output = REDUCED
      else: output = DENIED_PAID
      Inequality is `<=` (inclusive upper bound on each band).
    input_set: "FrlApplication.declared_annual_income_cents (whole cents), FrlApplication.household_size, constants table FEDERAL_POVERTY_GUIDELINE_BY_SIZE"
    constants:
      FREE_THRESHOLD_RATIO: 1.30
      REDUCED_THRESHOLD_RATIO: 1.85
      FEDERAL_POVERTY_GUIDELINE_BY_SIZE:
        "1": 1500000     # $15,000.00
        "2": 2030000     # $20,300.00
        "3": 2560000     # $25,600.00
        "4": 3090000     # $30,900.00
        "5": 3620000     # $36,200.00
        "6": 4150000     # $41,500.00
        "7": 4680000     # $46,800.00
        "8": 5210000     # $52,100.00
    precision: "ratio computed as floating point, compared exactly to thresholds; cents stored as integers"

  - name: meal_charge_calc
    trigger: "MealServingRecord creation (SERVED)"
    algorithm: tiered_pricing
    formula: |
      switch (MealServingRecord.tier_at_serving):
        case FREE:    charged_cents = 0
        case REDUCED: charged_cents = REDUCED_COPAY_CENTS (40)
        case PAID:    charged_cents = MenuItem.full_price_cents
      Returned as integer cents.
    input_set: "tier_at_serving (snapshot at SERVED), MenuItem.full_price_cents"
    constants:
      REDUCED_COPAY_CENTS: 40
    precision: "integer cents"

  - name: usda_reimbursement_provisional
    trigger: "MealServingRecord creation (SERVED)"
    algorithm: forward_looking
    formula: |
      if MenuItem.reimbursable == false: output = 0
      else:
        switch tier_at_serving:
          case FREE:    output = USDA_FREE_RATE_CENTS (480)
          case REDUCED: output = USDA_REDUCED_RATE_CENTS (420)
          case PAID:    output = USDA_PAID_RATE_CENTS (50)
      Provisional value is stamped on the row at SERVED time and never recomputed.
    input_set: "MealServingRecord.tier_at_serving, MenuItem.reimbursable"
    constants:
      USDA_FREE_RATE_CENTS: 480
      USDA_REDUCED_RATE_CENTS: 420
      USDA_PAID_RATE_CENTS: 50
    precision: "integer cents"
    variants:
      - name: provisional
        when: "computed at SERVED time using tier_at_serving snapshot"
        difference: "Uses snapshot tier; never adjusted afterward; sum over the period is provisional_total_cents."

  - name: usda_reimbursement_final
    trigger: "UsdaReimbursementClaim.SUBMITTED → FINALIZED transition"
    algorithm: chronological
    formula: |
      sorted_rows = MealServingRecord rows in claim.serving_record_ids, already ordered by created_at ASC, tie-break id ASC.
      For each row in sorted_rows (chronological):
        if row.status != SERVED at finalize time: skip
        eff_tier = Student.eligibility_tier AT FINALIZE TIME (NOT the snapshot tier_at_serving)
        if row.menu_item.reimbursable == false: rate = 0
        elif eff_tier == FREE:    rate = USDA_FREE_RATE_CENTS
        elif eff_tier == REDUCED: rate = USDA_REDUCED_RATE_CENTS
        else:                     rate = USDA_PAID_RATE_CENTS
        if Student.allergy_block_active at finalize time AND the row's menu_item contains any of the Student's ACTIVE allergens: rate = 0
        running_total += rate
      output = running_total
      This produces a different number from sum(provisional_reimbursement_cents) whenever any
      Student's eligibility_tier changed (e.g., FrlApplication was APPROVED) between SERVED and FINALIZED,
      or any allergy was added after the SERVED rows.
    input_set: "claim.serving_record_ids (ordered snapshot), Student.eligibility_tier AT finalize time, AllergyProfileEntry ACTIVE rows AT finalize time, MenuItem.reimbursable + MenuItem.contains_allergens"
    constants:
      USDA_FREE_RATE_CENTS: 480
      USDA_REDUCED_RATE_CENTS: 420
      USDA_PAID_RATE_CENTS: 50
    precision: "integer cents"
    variants:
      - name: final
        when: "computed at FINALIZE time using current eligibility and allergy state"
        difference: "Re-resolves tier per row using current Student.eligibility_tier (chronological replay), nullifies any row whose menu item now intersects an ACTIVE allergen. The same input rows that produced provisional_total_cents can yield a strictly different final_reimbursement_cents."

  - name: parent_balance_waterfall
    trigger: "PaidLedgerEntry insertion; balance read"
    algorithm: waterfall_allocation
    formula: |
      Process all PaidLedgerEntry rows for the ParentAccount in occurred_at ASC order, tie-break by row id ASC.
      For each entry:
        if type == TOP_UP:   running += amount_cents
        elif type == CHARGE: running -= amount_cents
        elif type == REFUND: running += amount_cents
      Pre-commit validation for a new CHARGE: simulated_running_after = running_at_now - amount_cents; must be >= 0 (`>=`, not `>`).
      Pre-commit validation for a new REFUND: refund.amount_cents must equal the linked CHARGE.amount_cents (no partial refunds).
      Final ParentAccount.prepaid_balance_cents = running after all committed entries.
    input_set: "PaidLedgerEntry rows for this parent_account_id, ordered by occurred_at ASC then id ASC"
    constants: {}
    precision: "integer cents; sort is order-sensitive; tie-break is id ASC"

  - name: meal_nutrition_label
    trigger: "GET /districts/{district_id}/menu-items/{id}/nutrition-label"
    algorithm: aggregation
    formula: |
      Returns: { calories_per_serving: MenuItem.calories,
                 sodium_per_serving_mg: MenuItem.sodium_mg,
                 allergens: sorted(MenuItem.contains_allergens) deduplicated,
                 high_sodium_flag: (sodium_mg >= HIGH_SODIUM_THRESHOLD_MG) }
      HIGH_SODIUM_THRESHOLD_MG inequality is `>=` (a value exactly equal to the threshold is FLAGGED).
    input_set: "MenuItem.calories, MenuItem.sodium_mg, MenuItem.contains_allergens"
    constants:
      HIGH_SODIUM_THRESHOLD_MG: 600

  - name: student_allergy_block_check
    trigger: "POST /districts/{district_id}/meal-servings; AllergyProfileEntry create/revoke"
    algorithm: aggregation
    formula: |
      allergy_block_active = exists(AllergyProfileEntry e where e.student_id=Student.id AND e.status=ACTIVE
                                    AND any(a in MenuItem.contains_allergens of the target MenuItem
                                            where a == e.allergen))
      For Student-level allergy_block_active (no specific menu item context), evaluate against the union of
      contains_allergens across MenuItem rows with status=ACTIVE on today's serving_date.
    input_set: "Student's ACTIVE AllergyProfileEntry rows; MenuItem.contains_allergens"
    constants: {}

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-segment ids exist, validated left-to-right; cross-aggregate references (e.g., body.student_id, body.menu_item_id) exist and belong to the same district"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state that permits this transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Meal serving rejected when Student has an ACTIVE AllergyProfileEntry whose allergen intersects MenuItem.contains_allergens"
    error_id: ERR_ALLERGEN_BLOCK
    http_status: 409
    applies_to: "POST /districts/{district_id}/meal-servings"

  - priority: 6
    category: business_safety
    check: "Severity=SEVERE AllergyProfileEntry creation requires doctor_note_attached == true"
    error_id: ERR_DOCTOR_NOTE_REQUIRED
    http_status: 422
    applies_to: "POST /districts/{district_id}/students/{student_id}/allergy-entries"

  - priority: 7
    category: business_referential
    check: "Segregation of duties — DistrictReviewer who would approve/deny must not be the Parent who owns the Student; AuditOfficer finalizing a UsdaReimbursementClaim must not be a DistrictReviewer who approved any contained FrlApplication"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /frl-applications/{id}/approve, /deny; POST /usda-claims/{id}/finalize"

  - priority: 8
    category: business_constraint
    check: "At most one SERVED MealServingRecord per (student_id, serving_date)"
    error_id: ERR_MEAL_ALREADY_SERVED_TODAY
    http_status: 409
    applies_to: "POST /districts/{district_id}/meal-servings"

  - priority: 9
    category: business_temporal
    check: "Two UsdaReimbursementClaims in {SUBMITTED, FINALIZED} status MUST NOT have overlapping periods (closed-closed; overlap = period_end_existing >= period_start_new AND period_start_existing <= period_end_new)"
    error_id: ERR_CLAIM_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /districts/{district_id}/usda-claims/{id}/submit"

  - priority: 10
    category: business_referential
    check: "Auto-renewal requires prior_year_application_id to be APPROVED, in the prior school year (District.school_year_start - 365±5 days), household_size exact match, declared_annual_income_cents within ±5% of prior snapshot"
    error_id: ERR_RENEWAL_INELIGIBLE
    http_status: 422
    applies_to: "POST /frl-applications/{id}/auto-renew"

  - priority: 11
    category: business_fiscal
    check: "PAID-tier meal serving requires ParentAccount.prepaid_balance_cents >= MenuItem.full_price_cents (`>=`, exact equality permitted)"
    error_id: ERR_PREPAID_BALANCE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /districts/{district_id}/meal-servings"

  - priority: 12
    category: business_constraint
    check: "AllergyProfileEntry creation forbids duplicate (student_id, allergen) where status=ACTIVE"
    error_id: ERR_DUPLICATE_ALLERGEN
    http_status: 409
    applies_to: "POST /districts/{district_id}/students/{student_id}/allergy-entries"

  - priority: 13
    category: business_constraint
    check: "ParentAccount.parent_email unique within District"
    error_id: ERR_PARENT_EMAIL_TAKEN
    http_status: 409
    applies_to: "POST /districts/{district_id}/parent-accounts"

  - priority: 14
    category: business_constraint
    check: "FrlApplication.household_size in [1, 8] and declared_annual_income_cents >= 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /districts/{district_id}/frl-applications"

  - priority: 15
    category: business_referential
    check: "REFUND PaidLedgerEntry must reference a CHARGE on the same ParentAccount with equal amount_cents; partial refunds rejected"
    error_id: ERR_REFUND_MISMATCH
    http_status: 422
    applies_to: "POST /districts/{district_id}/parent-accounts/{id}/refund"

  - priority: 16
    category: business_constraint
    check: "MenuItem cannot be RETIRED while a future-dated SERVED MealServingRecord references it"
    error_id: ERR_MENU_ITEM_IN_USE
    http_status: 409
    applies_to: "POST /districts/{district_id}/menu-items/{id}/retire"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- District ---
  - method: POST
    path: "/districts"
    description: "Create a District"
    roles: [AuditOfficer]
    code: 201
    input: [name, school_year_start]
    output: District
    side_effects: ["usda_reimbursement_total_cents := 0; top_up_outstanding_cents := 0"]

  - method: GET
    path: "/districts/{district_id}"
    description: "Get a District (recomputes derived fields)"
    roles: [Parent, DistrictReviewer, CafeteriaManager, AuditOfficer]
    code: 200
    input: []
    output: District

  # --- ParentAccount ---
  - method: POST
    path: "/districts/{district_id}/parent-accounts"
    description: "Create a ParentAccount (the Parent role's identity will be backed by this entity)"
    roles: [AuditOfficer]
    code: 201
    input: [parent_email]
    output: ParentAccount
    side_effects: ["prepaid_balance_cents := 0"]

  - method: GET
    path: "/districts/{district_id}/parent-accounts/{id}"
    description: "Get a ParentAccount with current balance"
    roles: [Parent, AuditOfficer]
    code: 200
    input: []
    output: ParentAccount

  - method: POST
    path: "/districts/{district_id}/parent-accounts/{id}/top-up"
    description: "Add funds to a ParentAccount; appends TOP_UP ledger entry"
    roles: [Parent]
    code: 200
    input: [amount_cents]
    output: ParentAccount
    side_effects:
      - "append PaidLedgerEntry(type=TOP_UP, amount_cents)"
      - "ParentAccount.prepaid_balance_cents increases by amount_cents"

  - method: POST
    path: "/districts/{district_id}/parent-accounts/{id}/refund"
    description: "Refund a specific CHARGE entry (full refund only)"
    roles: [AuditOfficer]
    code: 200
    input: [serving_record_id]
    output: ParentAccount
    side_effects:
      - "append PaidLedgerEntry(type=REFUND, amount_cents = matched CHARGE amount, serving_record_id)"
      - "ParentAccount.prepaid_balance_cents increases by amount"

  # --- Student ---
  - method: POST
    path: "/districts/{district_id}/students"
    description: "Create a Student under a ParentAccount"
    roles: [Parent, AuditOfficer]
    code: 201
    input: [parent_account_id, full_name, grade_level]
    output: Student
    side_effects: ["eligibility_tier := PAID; eligibility_application_id := null"]

  - method: GET
    path: "/districts/{district_id}/students/{id}"
    description: "Get a Student including derived eligibility and allergy_block_active"
    roles: [Parent, DistrictReviewer, CafeteriaManager, AuditOfficer]
    code: 200
    input: []
    output: Student

  # --- AllergyProfileEntry ---
  - method: POST
    path: "/districts/{district_id}/students/{student_id}/allergy-entries"
    description: "Add an allergen entry for a Student"
    roles: [Parent]
    code: 201
    input: [allergen, severity, doctor_note_attached]
    output: AllergyProfileEntry

  - method: DELETE
    path: "/districts/{district_id}/students/{student_id}/allergy-entries/{id}"
    description: "Revoke an allergen entry (sets status=REVOKED)"
    roles: [Parent]
    code: 200
    input: []
    output: AllergyProfileEntry

  # --- FrlApplication ---
  - method: POST
    path: "/districts/{district_id}/frl-applications"
    description: "Create a DRAFT FrlApplication"
    roles: [Parent]
    code: 201
    input: [student_id, household_size, declared_annual_income_cents, "documents_attached_count?", "prior_year_application_id?"]
    output: FrlApplication
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/districts/{district_id}/frl-applications/{id}"
    description: "Get an FrlApplication"
    roles: [Parent, DistrictReviewer, AuditOfficer]
    code: 200
    input: []
    output: FrlApplication

  - method: POST
    path: "/districts/{district_id}/frl-applications/{id}/submit"
    description: "Parent submits a DRAFT application"
    roles: [Parent]
    code: 200
    input: []
    output: FrlApplication
    side_effects: ["status := SUBMITTED", "snapshot school_year_start"]

  - method: POST
    path: "/districts/{district_id}/frl-applications/{id}/request-info"
    description: "Reviewer requests more info; transition SUBMITTED → INFO_REQUESTED"
    roles: [DistrictReviewer]
    code: 200
    input: [review_note]
    output: FrlApplication

  - method: POST
    path: "/districts/{district_id}/frl-applications/{id}/resubmit"
    description: "Parent resubmits an INFO_REQUESTED application"
    roles: [Parent]
    code: 200
    input: [documents_attached_count]
    output: FrlApplication

  - method: POST
    path: "/districts/{district_id}/frl-applications/{id}/approve"
    description: "Reviewer approves: runs frl_tier_classification; mints Student.eligibility_tier"
    roles: [DistrictReviewer]
    code: 200
    input: []
    output: FrlApplication
    side_effects: ["decided_tier set", "Student.eligibility_tier := decided_tier", "Student.eligibility_application_id := this.id"]

  - method: POST
    path: "/districts/{district_id}/frl-applications/{id}/deny"
    description: "Reviewer denies"
    roles: [DistrictReviewer]
    code: 200
    input: [review_note]
    output: FrlApplication
    side_effects: ["decided_tier := DENIED_PAID"]

  - method: POST
    path: "/districts/{district_id}/frl-applications/{id}/auto-renew"
    description: "System-driven auto-renew of a DRAFT application from a prior year's APPROVED record"
    roles: [Parent, AuditOfficer]
    code: 200
    input: []
    output: FrlApplication
    side_effects: ["status := RENEWED_FROM_PRIOR", "Student.eligibility_tier := prior application's decided_tier"]

  # --- MenuItem ---
  - method: POST
    path: "/districts/{district_id}/menu-items"
    description: "Create a MenuItem"
    roles: [CafeteriaManager]
    code: 201
    input: [name, contains_allergens, calories, sodium_mg, full_price_cents, reimbursable]
    output: MenuItem
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/districts/{district_id}/menu-items/{id}/nutrition-label"
    description: "Return computed nutrition label with high_sodium_flag and allergen list"
    roles: [Parent, DistrictReviewer, CafeteriaManager, AuditOfficer]
    code: 200
    input: []
    output: "object{calories_per_serving, sodium_per_serving_mg, allergens, high_sodium_flag}"

  - method: POST
    path: "/districts/{district_id}/menu-items/{id}/retire"
    description: "Retire a MenuItem"
    roles: [CafeteriaManager]
    code: 200
    input: []
    output: MenuItem

  # --- MealServingRecord ---
  - method: POST
    path: "/districts/{district_id}/meal-servings"
    description: "Record a meal served to a student"
    roles: [CafeteriaManager]
    code: 201
    input: [student_id, menu_item_id]
    output: MealServingRecord
    side_effects:
      - "status := SERVED; tier_at_serving snapshot; charged_cents and provisional_reimbursement_cents computed"
      - "If charged_cents > 0: PaidLedgerEntry(type=CHARGE) appended; ParentAccount.prepaid_balance_cents decreases"

  - method: POST
    path: "/districts/{district_id}/meal-servings/{id}/void"
    description: "Void a SERVED meal (refund + zero out reimbursement)"
    roles: [CafeteriaManager, AuditOfficer]
    code: 200
    input: []
    output: MealServingRecord

  # --- UsdaReimbursementClaim ---
  - method: POST
    path: "/districts/{district_id}/usda-claims"
    description: "Create a DRAFT claim with a period"
    roles: [AuditOfficer]
    code: 201
    input: [period_start, period_end]
    output: UsdaReimbursementClaim

  - method: POST
    path: "/districts/{district_id}/usda-claims/{id}/submit"
    description: "Submit a DRAFT claim; locks contained meal servings against VOID"
    roles: [AuditOfficer]
    code: 200
    input: []
    output: UsdaReimbursementClaim

  - method: POST
    path: "/districts/{district_id}/usda-claims/{id}/finalize"
    description: "Finalize a SUBMITTED claim; computes usda_reimbursement_final (chronological)"
    roles: [AuditOfficer]
    code: 200
    input: []
    output: UsdaReimbursementClaim
    side_effects: ["final_reimbursement_cents computed; District.usda_reimbursement_total_cents increases"]

  - method: POST
    path: "/districts/{district_id}/usda-claims/{id}/reject"
    description: "Reject a SUBMITTED claim"
    roles: [AuditOfficer]
    code: 200
    input: []
    output: UsdaReimbursementClaim

  - method: GET
    path: "/districts/{district_id}/usda-claims/{id}"
    description: "Get a claim and its current totals"
    roles: [AuditOfficer]
    code: 200
    input: []
    output: UsdaReimbursementClaim

  # --- Test-driving (clock) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance server logical clock to a target ISO 8601 UTC instant (test-only). Required for school-year crossover, auto-renewal eligibility checks, and serving_date computation."
    roles: [AuditOfficer]
    code: 200
    input: [target_instant]
    output: "object{now}"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_VALIDATION
    http: 422
    condition: "Request body fails schema/range validation (e.g., household_size out of range, negative income)"

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-segment id does not exist, or referenced cross-aggregate id does not exist within the district"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits this transition"

  - id: ERR_ALLERGEN_BLOCK
    http: 409
    condition: "Meal serving blocked: Student has an ACTIVE allergy whose allergen appears in MenuItem.contains_allergens"

  - id: ERR_DOCTOR_NOTE_REQUIRED
    http: 422
    condition: "SEVERE AllergyProfileEntry requires doctor_note_attached == true"

  - id: ERR_DUPLICATE_ALLERGEN
    http: 409
    condition: "An ACTIVE AllergyProfileEntry already exists for this (student_id, allergen)"

  - id: ERR_MEAL_ALREADY_SERVED_TODAY
    http: 409
    condition: "Student already has a SERVED MealServingRecord on this serving_date"

  - id: ERR_PREPAID_BALANCE_INSUFFICIENT
    http: 409
    condition: "PAID-tier meal would drive ParentAccount.prepaid_balance_cents below zero"

  - id: ERR_CLAIM_PERIOD_OVERLAP
    http: 409
    condition: "Another UsdaReimbursementClaim in {SUBMITTED, FINALIZED} overlaps this claim's period"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Acting user is forbidden from this step because they performed (or are) a conflicting prior actor"

  - id: ERR_RENEWAL_INELIGIBLE
    http: 422
    condition: "Auto-renewal preconditions not met (no prior APPROVED record, mismatched household_size, income drift outside ±5%, or prior decision was DENIED_PAID)"

  - id: ERR_REFUND_MISMATCH
    http: 422
    condition: "Refund amount or linked CHARGE does not match exactly (partial refunds rejected)"

  - id: ERR_PARENT_EMAIL_TAKEN
    http: 409
    condition: "ParentAccount.parent_email is already used by another ParentAccount in this district"

  - id: ERR_MENU_ITEM_IN_USE
    http: 409
    condition: "MenuItem cannot be RETIRED while a future-dated SERVED MealServingRecord references it"

  - id: ERR_VERSION_MISMATCH
    http: 412
    condition: "version field in body does not match current version (optimistic concurrency)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Parent
    description: "Submits FRL applications, manages allergy profile, tops up account"
    identity: "entity_backed:ParentAccount"
    exclusive_operations:
      - "POST /frl-applications/{id}/submit"
      - "POST /frl-applications/{id}/resubmit"
      - "POST /parent-accounts/{id}/top-up"
      - "POST /students/{student_id}/allergy-entries"
      - "DELETE /students/{student_id}/allergy-entries/{id}"
    shared_operations:
      - "POST /frl-applications (create DRAFT)"
      - "POST /students (create student)"
      - "POST /frl-applications/{id}/auto-renew"
      - "GET endpoints scoped to own ParentAccount and its Students"

  - name: DistrictReviewer
    description: "Reviews FRL applications for eligibility"
    identity: "opaque"
    exclusive_operations:
      - "POST /frl-applications/{id}/request-info"
      - "POST /frl-applications/{id}/approve"
      - "POST /frl-applications/{id}/deny"
    shared_operations:
      - "GET /frl-applications/{id}"
      - "GET /students/{id}"
      - "GET /menu-items/{id}/nutrition-label"

  - name: CafeteriaManager
    description: "Records meal servings; manages menu items"
    identity: "opaque"
    exclusive_operations:
      - "POST /menu-items"
      - "POST /menu-items/{id}/retire"
      - "POST /meal-servings"
    shared_operations:
      - "POST /meal-servings/{id}/void"
      - "GET /students/{id}"
      - "GET /menu-items/{id}/nutrition-label"

  - name: AuditOfficer
    description: "Manages USDA reimbursement claims and district-level configuration; refunds"
    identity: "opaque"
    exclusive_operations:
      - "POST /districts"
      - "POST /parent-accounts (create on behalf)"
      - "POST /usda-claims"
      - "POST /usda-claims/{id}/submit"
      - "POST /usda-claims/{id}/finalize"
      - "POST /usda-claims/{id}/reject"
      - "POST /parent-accounts/{id}/refund"
      - "POST /_clock/advance"
    shared_operations:
      - "POST /students (create on behalf)"
      - "POST /frl-applications/{id}/auto-renew"
      - "POST /meal-servings/{id}/void"
      - "GET endpoints"
