  - rule_id: resource_temporal_overlap
    instances:

      - name: appraisal_half_open_validity_windows_touching_at_the_boundary_are_permitted
        grounds:
          - calculations.appraisal_validity_window
          - validations.priority_40
          - entities.Appraisal.fields.validity_end_date
          - endpoints.POST_appraisals_appraisal_id_submit
        distinguishing_aspect: |
          The shared resource is the Parcel and the interval convention is HALF-OPEN, so the instant
          that closes one appraisal's validity is the instant that opens the next one's and the two
          rows coexist. The second appraisal's effective_date is set to exactly the first appraisal's
          derived validity_end_date (2027-07-01), the single date at which a closed-interval
          implementation would reject and this one must accept.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with one parcel."
            - "INITIAL Appraisal A on that parcel, effective_date 2026-07-01, ACCEPTED, so its half-open validity interval is [2026-07-01, 2027-07-01)."
            - "INITIAL Appraisal B on the same parcel in DRAFT, effective_date 2027-07-01."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "RTO-A", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2029-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: $.data.id }
