# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules (§0.5) x 2 instances = 18 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7; setup_api_calls drive empty-DB -> setup.
# Standard "listing -> LISTED" prelude used throughout:
#   POST /hosts; POST /guests; POST /listings; POST /listings/{id}/permits;
#   POST /permits/{id}/submit; POST /permits/{id}/decision(APPROVE);
#   POST /listings/{id}/seasonal-rates; POST /listings/{id}/publish.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: booking_quote_vs_final_diverge_on_reprice
        grounds:
          - calculations.booking_quote_total
          - calculations.booking_final_total
          - entities.Booking.fields.quoted_total_cents
          - entities.Booking.fields.final_total_cents
          - state_machines.Booking.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          Same booking (Booking domain): quoted_total_cents is snapshotted at REQUEST time
          from the seasonal rate then in effect (25000) and final_total_cents is re-snapshotted
          at ACCEPT after the host repriced that window to 30000, so 89600 != 106400.
        test_recipe:
          setup:
            - "Host H, Guest G, listing L LISTED with cleaning 5000, MODERATE, a July rate window @25000."
            - "Guest requested a 3-night booking (07-10..07-13) quoted at 89600; host then repriced the window to 30000; host accepts."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Alpine Host", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /guests"
              payload: { display_name: "Guest G", email: "g@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "Cliff Yurt", site_type: "YURT", max_guests: 4, min_nights: 2, base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000, cancellation_policy: "MODERATE" }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/permits"
              payload: { listing_id: "${listing_id}", permit_type: "STRUCTURE", authority_name: "County" }
              as: Host
              as_user_id: "${host_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PermitReviewer
            - call: "POST /listings/${listing_id}/seasonal-rates"
              payload: { listing_id: "${listing_id}", start_date: "2026-07-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", nightly_rate_cents: 25000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { rate_id: $.data.id }
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { listing_v: $.data.version }
            - call: "POST /listings/${listing_id}/bookings"
              payload: { listing_id: "${listing_id}", guest_id: "${guest_id}", check_in: "2026-07-10T00:00:00Z", check_out: "2026-07-13T00:00:00Z", guest_count: 2, expected_listing_version: "${listing_v}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
            - call: "PATCH /seasonal-rates/${rate_id}"
              payload: { nightly_rate_cents: 30000 }
              as: Host
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/accept"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
          assert:
            - "Booking.${booking_id}.quoted_total_cents == 89600"
            - "Booking.${booking_id}.final_total_cents == 106400"
            - "Booking.${booking_id}.status == CONFIRMED"

      - name: payout_estimated_vs_final_on_partial_cancel
        grounds:
          - calculations.payout_estimated
          - calculations.payout_on_cancel
          - entities.Payout.fields.estimated_amount_cents
          - entities.Payout.fields.final_amount_cents
          - state_machines.Payout.SCHEDULED_to_PARTIAL
        distinguishing_aspect: |
          Host/Payout domain (distinct from the Booking-cost dual-variant): estimated_amount_cents
          fixed at accept is 77750, but final_amount_cents settled at a MODERATE 6-day cancel is
          the host's retained share 38800 -> the two variants diverge on the Payout entity.
        test_recipe:
          setup:
            - "Listing L LISTED (cleaning 5000, MODERATE, July rate @25000); booking 07-10..07-13 CONFIRMED; payout SCHEDULED estimated 77750."
            - "Clock at 2026-07-04 (6 days before check-in)."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Alpine Host", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /guests"
              payload: { display_name: "Guest G", email: "g@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "Cliff Yurt", site_type: "YURT", max_guests: 4, min_nights: 2, base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000, cancellation_policy: "MODERATE" }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/permits"
              payload: { listing_id: "${listing_id}", permit_type: "STRUCTURE", authority_name: "County" }
              as: Host
              as_user_id: "${host_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PermitReviewer
            - call: "POST /listings/${listing_id}/seasonal-rates"
              payload: { listing_id: "${listing_id}", start_date: "2026-07-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", nightly_rate_cents: 25000 }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { listing_v: $.data.version }
            - call: "POST /listings/${listing_id}/bookings"
              payload: { listing_id: "${listing_id}", guest_id: "${guest_id}", check_in: "2026-07-10T00:00:00Z", check_out: "2026-07-13T00:00:00Z", guest_count: 2, expected_listing_version: "${listing_v}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/accept"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-04T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
          assert:
            - "Payout for Booking.${booking_id}: estimated_amount_cents == 77750"
            - "Payout for Booking.${booking_id}: final_amount_cents == 38800"
            - "Payout for Booking.${booking_id}: status == PARTIAL"

  - rule_id: combinatorial_formula
    instances:
      - name: multi_input_tiered_total_two_windows_and_addons
        grounds:
          - calculations.booking_quote_total
          - entities.SeasonalRate.fields.nightly_rate_cents
          - entities.AddOn.fields.pricing_unit
          - entities.Booking.fields.quoted_total_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — 10 nights split across two rate
          windows (3@20000 + 7@30000), a length-of-stay weekly-discount tier selected by max,
          plus PER_NIGHT and PER_GUEST add-on modes, yielding quoted_total_cents == 297920.
        test_recipe:
          setup:
            - "Listing LISTED (cleaning 4000, max_guests 6, min_nights 1) with two adjacent July rate windows and two add-ons (PER_NIGHT firewood 1500, PER_GUEST breakfast 1000)."
            - "Guest requests a 10-night stay 07-05..07-15, guest_count 4, then attaches both add-ons."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Ridge Host", email: "h2@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /guests"
              payload: { display_name: "Guest G2", email: "g2@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "Two-Season Cabin", site_type: "CABIN", max_guests: 6, min_nights: 1, base_nightly_rate_cents: 20000, cleaning_fee_cents: 4000, cancellation_policy: "FLEXIBLE" }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/permits"
              payload: { listing_id: "${listing_id}", permit_type: "CAMPING", authority_name: "County" }
              as: Host
              as_user_id: "${host_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PermitReviewer
            - call: "POST /listings/${listing_id}/seasonal-rates"
              payload: { listing_id: "${listing_id}", start_date: "2026-07-01T00:00:00Z", end_date: "2026-07-08T00:00:00Z", nightly_rate_cents: 20000 }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /listings/${listing_id}/seasonal-rates"
              payload: { listing_id: "${listing_id}", start_date: "2026-07-08T00:00:00Z", end_date: "2026-08-01T00:00:00Z", nightly_rate_cents: 30000 }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /listings/${listing_id}/add-ons"
              payload: { listing_id: "${listing_id}", name: "Firewood", category: "AMENITY", pricing_unit: "PER_NIGHT", price_cents: 1500 }
              as: Host
              as_user_id: "${host_id}"
              captures: { firewood_id: $.data.id }
            - call: "POST /listings/${listing_id}/add-ons"
              payload: { listing_id: "${listing_id}", name: "Breakfast", category: "AMENITY", pricing_unit: "PER_GUEST", price_cents: 1000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { breakfast_id: $.data.id }
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { listing_v: $.data.version }
            - call: "POST /listings/${listing_id}/bookings"
              payload: { listing_id: "${listing_id}", guest_id: "${guest_id}", check_in: "2026-07-05T00:00:00Z", check_out: "2026-07-15T00:00:00Z", guest_count: 4, expected_listing_version: "${listing_v}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/add-ons"
              payload: { add_on_id: "${firewood_id}" }
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/add-ons"
              payload: { add_on_id: "${breakfast_id}" }
              as: Guest
              as_user_id: "${guest_id}"
          assert:
            - "Booking.${booking_id}.nights == 10"
            - "Booking.${booking_id}.quoted_total_cents == 297920"

      - name: rounding_order_discount_sum_then_round
        grounds:
          - calculations.booking_quote_total
          - entities.Booking.fields.quoted_total_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned as "apply the weekly discount to the summed nightly
          subtotal, THEN round once" — 7 nights @33333 give round(233331*0.9)=209998, whereas
          per-night-round-then-sum would give 210000; quoted_total_cents == 235198.
        test_recipe:
          setup:
            - "Listing LISTED (cleaning 0, min_nights 1) with a July rate window @33333."
            - "Guest requests a 7-night stay 07-10..07-17, guest_count 1 (crosses the weekly discount tier)."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Cent Host", email: "h3@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /guests"
              payload: { display_name: "Guest G3", email: "g3@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "Odd-Cent Dome", site_type: "DOME", max_guests: 2, min_nights: 1, base_nightly_rate_cents: 33333, cleaning_fee_cents: 0, cancellation_policy: "STRICT" }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/permits"
              payload: { listing_id: "${listing_id}", permit_type: "SPECIAL_USE", authority_name: "County" }
              as: Host
              as_user_id: "${host_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PermitReviewer
            - call: "POST /listings/${listing_id}/seasonal-rates"
              payload: { listing_id: "${listing_id}", start_date: "2026-07-01T00:00:00Z", end_date: "2026-08-01T00:00:00Z", nightly_rate_cents: 33333 }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { listing_v: $.data.version }
          trigger:
            - call: "POST /listings/${listing_id}/bookings"
              payload: { listing_id: "${listing_id}", guest_id: "${guest_id}", check_in: "2026-07-10T00:00:00Z", check_out: "2026-07-17T00:00:00Z", guest_count: 1, expected_listing_version: "${listing_v}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
          assert:
            - "Booking.${booking_id}.nights == 7"
            - "Booking.${booking_id}.quoted_total_cents == 235198"

  - rule_id: non_linear_state_machine
    instances:
      - name: listing_suspend_reinstate_cycle
        grounds:
          - state_machines.Listing.LISTED_to_SUSPENDED
          - state_machines.Listing.SUSPENDED_to_LISTED
          - entities.Listing.fields.status
        distinguishing_aspect: |
          Cyclic shape on Listing: LISTED -> SUSPENDED -> LISTED returns to a previously visited
          state (not a forward-only pipeline); status ends LISTED after the round trip.
        test_recipe:
          setup:
            - "Listing L LISTED with APPROVED permit and one rate."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Cyc Host", email: "h4@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "Loop Cabin", site_type: "CABIN", max_guests: 4, min_nights: 1, base_nightly_rate_cents: 20000, cancellation_policy: "MODERATE" }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/permits"
              payload: { listing_id: "${listing_id}", permit_type: "STRUCTURE", authority_name: "County" }
              as: Host
              as_user_id: "${host_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PermitReviewer
            - call: "POST /listings/${listing_id}/seasonal-rates"
              payload: { listing_id: "${listing_id}", start_date: "2026-07-01T00:00:00Z", end_date: "2026-08-01T00:00:00Z", nightly_rate_cents: 20000 }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /listings/${listing_id}/suspend"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /listings/${listing_id}/reinstate"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
          assert:
            - "Listing.${listing_id}.status == LISTED"

      - name: permit_reject_resubmit_cycle
        grounds:
          - state_machines.Permit.SUBMITTED_to_REJECTED
          - state_machines.Permit.REJECTED_to_SUBMITTED
          - entities.Permit.fields.status
          - entities.Permit.fields.review_notes
        distinguishing_aspect: |
          Cyclic/branching shape on Permit (distinct entity from Listing): SUBMITTED -> REJECTED
          -> SUBMITTED revisits SUBMITTED and clears review_notes to null, a revision loop.
        test_recipe:
          setup:
            - "Permit P for listing L, SUBMITTED then REJECTED with review_notes set."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Perm Host", email: "h5@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "Permit Cabin", site_type: "CABIN", max_guests: 4, min_nights: 1, base_nightly_rate_cents: 20000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/permits"
              payload: { listing_id: "${listing_id}", permit_type: "CAMPING", authority_name: "County" }
              as: Host
              as_user_id: "${host_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "REJECT", review_notes: "Setback too small" }
              as: PermitReviewer
          trigger:
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
          assert:
            - "Permit.${permit_id}.status == SUBMITTED"
            - "Permit.${permit_id}.review_notes == null"

  - rule_id: transitive_cascade
    instances:
      - name: delist_cascade_booking_payout_host_ledger
        grounds:
          - state_machines.Listing.LISTED_to_DELISTED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Payout.SCHEDULED_to_VOIDED
          - entities.Host.fields.pending_payout_cents
          - entities.Guest.fields.wallet_credit_cents
        distinguishing_aspect: |
          Depth-4 chain from a single delist trigger: delist -> Booking CANCELLED (link1) ->
          that booking's Payout VOIDED (link2, caused by the cancel) -> Host.pending_payout_cents
          decremented AND Guest.wallet_credit_cents credited AND Listing.reserved_nights_count
          decremented (link3, caused by the void/cancel). Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "Listing L LISTED (cleaning 5000, MODERATE, July rate @25000); booking 07-10..07-13 CONFIRMED; payout SCHEDULED estimated 77750; Host.pending_payout_cents 77750; reserved_nights_count 3; clock at default 2026-07-01."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Casc Host", email: "h6@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /guests"
              payload: { display_name: "Guest G6", email: "g6@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${host_id}", title: "Casc Yurt", site_type: "YURT", max_guests: 4, min_nights: 2, base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000, cancellation_policy: "MODERATE" }
              as: Host
              as_user_id: "${host_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/permits"
              payload: { listing_id: "${listing_id}", permit_type: "STRUCTURE", authority_name: "County" }
              as: Host
              as_user_id: "${host_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits/${permit_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PermitReviewer
            - call: "POST /listings/${listing_id}/seasonal-rates"
              payload: { listing_id: "${listing_id}", start_date: "2026-07-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", nightly_rate_cents: 25000 }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { listing_v: $.data.version }
            - call: "POST /listings/${listing_id}/bookings"
              payload: { listing_id: "${listing_id}", guest_id: "${guest_id}", check_in: "2026-07-10T00:00:00Z", check_out: "2026-07-13T00:00:00Z", guest_count: 2, expected_listing_version: "${listing_v}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/accept"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /listings/${listing_id}/delist"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
          assert:
            - "Listing.${listing_id}.status == DELISTED"
            - "Booking.${booking_id}.status == CANCELLED"
            - "Booking.${booking_id}.payment_status == REFUNDED"
            - "Payout for Booking.${booking_id}: status == VOIDED and final_amount_cents == 0"
            - "Host.${host_id}.pending_payout_cents == 0"
