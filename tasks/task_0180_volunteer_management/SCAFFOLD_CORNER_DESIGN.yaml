  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_shift_version_on_group_allocate
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[signup-create-stale-shift]
          - errors[ERR_STALE_SHIFT_VERSION]
          - endpoints
        distinguishing_aspect: "Allocating a group with an expected_shift_version that is stale (an individual signup advanced the shift version after the client last read it) returns ERR_STALE_SHIFT_VERSION (412)."
        test_recipe:
          setup: ["A PUBLISHED group-event Opportunity, a capacity-10 shift whose version was advanced by an individual signup after the client last read it, and an APPROVED group."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "V", email: "v@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Corp", is_group_event: true }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 10 }
              as: ShiftCoordinator
              captures: { shift_id: $.data.id }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/corporate-groups"
              payload: { opportunity_id: "${opp_id}", sponsor_name: "Acme", requested_seats: 2, target_shift_id: "${shift_id}" }
              as: CorporateSponsor
              captures: { grp_id: $.data.id }
            - call: "POST /vm/corporate-groups/${grp_id}/approve"
              payload: {}
              as: ShiftCoordinator
            - call: "GET /vm/shifts/${shift_id}"
              payload: {}
              as: ShiftCoordinator
              captures: { shift_v_stale: $.data.version }
            - call: "POST /vm/shifts/${shift_id}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_v_stale}" }
              as: Volunteer
              as_user_id: "${vol_id}"
          trigger:
            - call: "POST /vm/corporate-groups/${grp_id}/allocate"
              payload: { expected_shift_version: "${shift_v_stale}" }
              as: ShiftCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_SHIFT_VERSION"

      - name: occ_org_version_archive_then_stale_archive
        claim_type: optimistic_concurrency
        grounds:
          - errors[ERR_STALE_ORGANIZATION_VERSION]
          - entities.Organization.fields.version
          - endpoints
        distinguishing_aspect: "Archiving an Organization with the correct expected_organization_version succeeds (ARCHIVED, version 2); a subsequent archive carrying the now-stale original version returns ERR_STALE_ORGANIZATION_VERSION (412)."
        test_recipe:
          setup: ["A fresh Organization at version 1."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v1: $.data.version }
          trigger:
            - call: "POST /vm/organizations/${org_id}/archive"
              payload: { expected_organization_version: "${org_v1}" }
              as: ComplianceOfficer
              captures: { st: $.data.status, org_v2: $.data.version }
            - call: "POST /vm/organizations/${org_id}/archive"
              payload: { expected_organization_version: "${org_v1}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "first archive response status == 200, Organization.${org_id}.status == ARCHIVED, version == 2"
            - "second archive response status == 412 and data.error_id == ERR_STALE_ORGANIZATION_VERSION"

