  - rule_id: transitive_cascade
    instances:
      - name: agency_probation_cascade_four_links_to_cycle_restriction
        grounds:
          - state_machines.AgencyReview.PENDING_to_CERTIFIED
          - state_machines.Agency.UNDER_FINANCIAL_REVIEW_to_PROBATION
          - state_machines.AllocationRequest.SUBMITTED_to_SUSPENDED_REVIEW
          - state_machines.AllocationCycle.OPEN_to_RESTRICTED
          - calculations.agency_financial_standing_score
          - entities.AllocationRequest.fields.status_before_suspension
          - entities.AllocationCycle.fields.suspended_request_ratio
          - entities.AllocationCycle.fields.awards_blocked
        distinguishing_aspect: |
          Depth-4 cascade whose triggering transition is AgencyReview PENDING -> CERTIFIED:
          link 1 certifies the review, link 2 is caused by link 1's certified_score 69.50 landing
          in the probation band and moves the Agency to PROBATION, link 3 is caused by link 2's
          membership change and suspends that agency's SUBMITTED request, link 4 is caused by
          link 3's status change and recomputes the cycle's suspended_request_ratio to 0.5000,
          tripping OPEN -> RESTRICTED. Each hop is caused by the previous hop, not by the certify
          call, and the trigger differs from the write-off cascade instance.
        test_recipe:
          setup:
            - "Two agencies A and B, both driven to GOOD_STANDING by a certified review scoring 100.00; A's open_review_count is back to 0."
            - "One OPEN AllocationCycle (focus EDUCATION, pool 500000.00, max_award_per_agency 200000.00) with three conflict-free panel seats."
            - "One SUBMITTED AllocationRequest per agency, so cycle.submitted_request_count == 2, suspended_request_count == 0, suspended_request_ratio == 0.0000, posture OPEN, awards_blocked false."
            - "A SECOND, PENDING AgencyReview filed for agency A with self-reported program 0.7800 / admin 0.1900 / reserve 4.00 / 8 governance items / UNQUALIFIED, which moved A to UNDER_FINANCIAL_REVIEW and set open_review_count to 1."
            - "Logical clock left at its 2026-08-01T00:00:00Z default, inside the cycle request window."
