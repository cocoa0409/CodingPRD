  # =====================================================================
  # Section: cross_cutting_layers
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_statement_build_stale_offer_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[statement-build-stale-offer]
        distinguishing_aspect: "Statement build carrying a stale expected_offer_version (one behind) returns 412 ERR_STALE_VERSION; correct version succeeds."
        test_recipe:
          setup: ["Offer ACCEPTED at version Vx; contingencies waived; DRAFT statement created"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "O2 House", home_state_code: "FL", escrow_account_ref: "T-O2", license_no: "FL-BRK-O2" }
              as: PlatformAdmin
              captures: { brkO2: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkO2}", full_name: "LAO2", license_no: "FL-AG-O21", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laO2: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkO2}", full_name: "SAO2", license_no: "FL-AG-O22", split_pct_basis: 5000 }
              as: PlatformAdmin
              captures: { saO2: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "SO2", residency_state_code: "FL", tax_id_last4: "3601" }
              as: PlatformAdmin
              captures: { selO2: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "BO2", residency_state_code: "FL", tax_id_last4: "3602" }
              as: PlatformAdmin
              captures: { buyO2: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USOCC2123456", make: "A", model: "B", year_built: 2020, length_overall_ft: 40.0, documentation_mode: "USCG", uscg_official_no: "1234586", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesO2: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkO2}", listing_agent_id: "${laO2}", seller_id: "${selO2}", vessel_id: "${vesO2}", agreement_type: "CENTRAL", list_price_cents: 100000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laO2}"
              captures: { lstO2: $.data.id }
            - call: "POST /yacht/listings/${lstO2}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${laO2}"
            - call: "POST /yacht/offers"
              payload: { listing_id: "${lstO2}", buyer_id: "${buyO2}", selling_agent_id: "${saO2}", offer_price_cents: 100000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-05T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${saO2}"
              captures: { offO2: $.data.id, offO2_v0: $.data.version }
            - call: "POST /yacht/offers/${offO2}/accept"
              payload: { expected_offer_version: "${offO2_v0}" }
              as: ListingAgent
              as_user_id: "${laO2}"
              captures: { offO2_v1: $.data.version }
            - call: "GET /yacht/offers/${offO2}/contingencies"
              payload: {}
              as: SellingAgent
              as_user_id: "${saO2}"
              captures: { oa: "$.data[0].id", ob: "$.data[1].id", oc: "$.data[2].id" }
            - call: "POST /yacht/contingencies/${oa}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saO2}"
            - call: "POST /yacht/contingencies/${ob}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saO2}"
            - call: "POST /yacht/contingencies/${oc}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saO2}"
            - call: "POST /yacht/closing-statements"
              payload: { offer_id: "${offO2}", rounding_mode: "PER_LINE_THEN_SUM" }
              as: ClosingOfficer
              captures: { csO2: $.data.id }
          trigger:
            - call: "POST /yacht/closing-statements/${csO2}/build"
              payload: { expected_offer_version: "${offO2_v1} - 1" }
              as: ClosingOfficer
              captures: { err_ob: $.data.error_id }
          assert:
            - "err_ob == ERR_STALE_VERSION"
            - "ClosingStatement.${csO2}.status remains DRAFT"

      - name: derived_liens_status_reconciles_on_lien_release
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Vessel.fields.liens_status
          - state_machines.LienRecord.RECORDED_to_RELEASED
        distinguishing_aspect: "Vessel.liens_status flips ENCUMBERED -> CLEAN when the last RECORDED lien is RELEASED; the derived field reconciles on the source mutation."
        test_recipe:
          setup: ["Vessel with one RECORDED UCC1 lien (liens_status ENCUMBERED)"]
          setup_api_calls:
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Rec House", home_state_code: "FL", escrow_account_ref: "T-RC", license_no: "FL-BRK-RC" }
              as: PlatformAdmin
              captures: { brkRC: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkRC}", full_name: "LARC", license_no: "FL-AG-RC1", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laRC: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USRECN123456", make: "A", model: "B", year_built: 2020, length_overall_ft: 40.0, documentation_mode: "USCG", uscg_official_no: "1234587", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesRC: $.data.id }
            - call: "POST /yacht/vessels/${vesRC}/liens"
              payload: { lienholder_name: "Yard", instrument_type: "UCC1", amount_cents: 500000, priority_rank: 1 }
              as: ListingAgent
              as_user_id: "${laRC}"
              captures: { lienRC: $.data.id }
          trigger:
            - call: "POST /yacht/liens/${lienRC}/release"
              payload: { release_ref: "REL-2026-001" }
              as: ListingAgent
              as_user_id: "${laRC}"
            - call: "GET /yacht/vessels/${vesRC}"
              payload: {}
              as: ListingAgent
              as_user_id: "${laRC}"
              captures: { liens_after: $.data.liens_status }
          assert:
            - "liens_after == CLEAN"
            - "LienRecord.${lienRC}.status == RELEASED"

  # =====================================================================
