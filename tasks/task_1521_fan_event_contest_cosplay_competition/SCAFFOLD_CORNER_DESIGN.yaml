            - { call: "POST /prize-awards/${aw1}/mark-tax-reported", payload: {}, as: Treasurer, as_user_id: "tr_2", captures: { aw1_st: $.data.status } }
            - { call: "GET /contest-events/${cont}/tax-summary", payload: {}, as: Treasurer, captures: { v1: $.data.total_prize_value_cents, w1: $.data.total_withheld_cents, r1: $.data.reportable_award_count, d1: $.data.disbursed_award_count } }
            - { call: "POST /prize-awards/${aw2}/approve", payload: {}, as: Treasurer, as_user_id: "tr_2" }
