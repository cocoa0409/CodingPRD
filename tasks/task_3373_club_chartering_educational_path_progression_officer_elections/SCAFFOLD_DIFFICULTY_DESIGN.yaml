              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { mtg_a_id: "$.data.id" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { club_v2: "$.data.version" }
          trigger:
            - call: "POST /toastmasters/meetings"
              payload: { club_id: "${club_id}", scheduled_at: "2026-09-10T19:00:00Z", duration_minutes: 90, venue_name: "Riverside Library", expected_club_version: "${club_v2}" }
