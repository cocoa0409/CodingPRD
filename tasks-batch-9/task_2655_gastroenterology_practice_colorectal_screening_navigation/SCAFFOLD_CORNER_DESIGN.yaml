          - state_machines.ScreeningEpisode
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: episode_parallel_dimensions_advance_independently
          rationale: "The parallel-shape corner - each dimension moving without disturbing the other and the combined pair being read back - is the whole subject of that depth instance, which walks both dimensions across seven writes; repeating it here would only re-assert the same transitions with fewer steps."
      - name: pathology_finalize_side_effect_chain_corner
        claim_type: side_effect_execution
        grounds:
          - state_machines.PathologyReport.RECEIVED_to_FINALIZED
          - state_machines.ScreeningEpisode.PATHOLOGY_PENDING_to_CLOSED_SURVEILLANCE_SET
        excluded_because:
          difficulty_instance: pathology_finalize_four_hop_cascade
          rationale: "Every declared side effect of the finalize edge - report aggregation, episode closure, recommendation creation and the episode interval copy - is asserted hop by hop in that depth instance, so a breadth instance would duplicate its assertions rather than add a new corner."
