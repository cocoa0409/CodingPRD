      - name: certification_coverage_empty_at_exact_valid_until_instant_blocks_limited_approval
        grounds:
          - calculations.certification_coverage
          - validations[priority=70].ERR_CERTIFICATION_MISSING
          - endpoints.POST_/ad-policy/review-tasks/{review_task_id}/decision
          - entities.AdCreative.fields.approved_under_certification_id
          - calculations.creative_risk_score
        distinguishing_aspect: |
          A different metric (a validity instant, not a confidence) probed on a different
          endpoint (POST /ad-policy/review-tasks/{review_task_id}/decision). The coverage
          window is half-open: valid_from is inclusive and valid_until is exclusive. One
          second before valid_until the candidate set holds the certification and the
          limited approval succeeds with an 8.00 credit that floors risk_score_final at
          0.00; at exactly valid_until the candidate set is empty and the identical request
          is refused with ERR_CERTIFICATION_MISSING even though the Certification row is
          still status ACTIVE because no sweep has run.
