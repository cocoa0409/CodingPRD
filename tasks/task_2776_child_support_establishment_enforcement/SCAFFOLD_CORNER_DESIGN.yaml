              as: CaseWorker
              captures: { guideline: "$.data.guideline_monthly_cents" }
            - call: "POST /child-support/orders/${order_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monthly: "$.data.monthly_obligation_cents" }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
              captures: { ch1: "$.data.id" }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-09-01", period_end_date: "2026-10-01", due_date: "2026-09-15" }
              as: FinanceOfficer
              captures: { ch2: "$.data.id" }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
