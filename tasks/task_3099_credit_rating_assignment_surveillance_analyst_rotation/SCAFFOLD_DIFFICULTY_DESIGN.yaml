  - rule_id: boundary_precision_check
    instances:

      - name: committee_quorum_at_exactly_required_members
        grounds:
          - entities.RatingCommittee.fields.quorum_met
          - state_machines.RatingCommittee.IN_SESSION_to_DECIDED
          - validations[priority=32]
          - endpoints.POST_/rating-committees/{id}/decide
        distinguishing_aspect: |
          Quorum uses >= on the vote count: with required_voting_members 2, one
