      - name: val_close_on_an_open_period_reports_the_state_error_before_the_reserve_floor
        claim_type: Priority conflict
        grounds:
          - validations[priority=54]
          - validations[priority=13]
          - errors[ERR_RESERVE_FLOOR_BREACH]
        distinguishing_aspect: >-
          A CLOSE on an OPEN period whose reserve is under one month reports
          ERR_INVALID_STATE, not ERR_RESERVE_FLOOR_BREACH, because the source-state guard at
          priority 13 outranks the floor check at priority 54.
        excluded_because:
          difficulty_instance: pp_close_on_open_period_reports_invalid_state_before_reserve_floor_breach
          rationale: >-
            The §1.8 instance already drives exactly this pair of rules from an OPEN period with
            a sub-one-month reserve, asserting ERR_INVALID_STATE first and ERR_RESERVE_FLOOR_BREACH
            only after the period is locked; a corner recipe would duplicate its setup and asserts.

      - name: val_restricted_funder_error_outranks_the_cooling_off_error_on_submit
        claim_type: Priority conflict
        grounds:
          - validations[priority=20]
          - validations[priority=34]
          - errors[ERR_FUNDER_COOLING_OFF_VIOLATION]
        distinguishing_aspect: >-
          A proposal for a funder that is still RESTRICTED reports ERR_FUNDER_RESTRICTED, and
          only after the funder is re-cleared does the 30-day cooling-off clock surface as
          ERR_FUNDER_COOLING_OFF_VIOLATION.
        excluded_because:
          difficulty_instance: pp_restricted_funder_outranks_cooling_off_on_proposal_submit
          rationale: >-
            That §1.8 instance already sequences restriction, rehabilitation and the day-29 /
            day-30 cooling-off boundary on the same proposal, covering both error codes and
            their ordering.

      - name: val_third_condition_round_on_a_gift_offer_is_refused
        claim_type: Violation → Error
        grounds:
          - validations[priority=26]
          - errors[ERR_CONDITION_ROUNDS_EXHAUSTED]
          - state_machines.GiftOffer.INDEPENDENCE_REVIEW_to_CONDITIONS_REQUESTED
        distinguishing_aspect: >-
          The second REQUEST_CONDITIONS is allowed and the third is refused, because the guard
          is conditions_round_count < 2 evaluated before the increment.
        excluded_because:
          difficulty_instance: nl_gift_offer_conditions_cycle_bounded_at_two_rounds
          rationale: >-
            The §1.8 instance walks the negotiation loop twice and asserts the exact refusal on
            the third request, so the boundary claim is already pinned there.

      - name: val_proposal_clearance_requires_a_disclosure_for_the_exact_funder_area_pair
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=22]
          - errors[ERR_DISCLOSURE_REQUIRED]
          - state_machines.GrantProposal.INDEPENDENCE_REVIEW_to_CLEARED
        distinguishing_aspect: >-
          A disclosure for the same funder on a different beat does not satisfy the floor: the
          ACTIVE disclosure must name the exact (funder_id, coverage_area_id) pair being funded.
        excluded_because:
          difficulty_instance: ce_proposal_clearance_requires_disclosure_for_exact_funder_area_pair
          rationale: >-
            The §1.8 instance already files a decoy disclosure on a neighbouring beat, shows the
            clearance refused, then files the matching one and shows it accepted.

      - name: val_board_ratification_is_required_before_a_large_gift_can_be_accepted
        claim_type: Conditional validation
        grounds:
          - validations[priority=27]
          - errors[ERR_BOARD_RATIFICATION_REQUIRED]
          - calculations.gift_stewardship_netting
        distinguishing_aspect: >-
          Acceptance is barred while board_ratification_required is true and
          board_ratified_by_user_id is null, and the flag is derived from the gross offer and
          the funder's risk score rather than supplied by the officer.
        excluded_because:
          difficulty_instance: ce_gift_acceptance_gated_by_funder_risk_derived_board_ratification
          rationale: >-
            The §1.8 instance already derives the ratification flag from the funder's risk score,
            shows the refusal, records the board ratification and then accepts the same offer.

      - name: val_third_restricted_award_on_one_beat_is_refused
        claim_type: Aggregate validation
        grounds:
          - validations[priority=42]
          - errors[ERR_RESTRICTED_GRANT_CAP_EXCEEDED]
          - entities.CoverageArea.fields.restricted_grant_count
        distinguishing_aspect: >-
          Two restricted awards on one beat are individually and collectively legal; the third
          is refused even though it satisfies every per-proposal rule.
        excluded_because:
          difficulty_instance: rt_third_restricted_award_on_one_area_exceeds_aggregate_cap
          rationale: >-
            The §1.8 instance already builds three individually valid restricted proposals on one
            beat and asserts the aggregate refusal on the third award.

      - name: val_activating_an_overlapping_collaboration_window_is_refused
        claim_type: Temporal validation
        grounds:
          - validations[priority=35]
          - errors[ERR_COLLABORATION_WINDOW_OVERLAP]
          - state_machines.Collaboration.DRAFT_to_ACTIVE
        distinguishing_aspect: >-
          Windows are half-open, so a collaboration starting exactly when another ends may
          activate while one starting a day earlier may not.
        excluded_because:
          difficulty_instance: rt_collaboration_half_open_windows_permit_adjacency_and_bar_overlap
          rationale: >-
            The §1.8 instance already activates the adjacent window and refuses the one-day
            overlap on the same beat, covering both sides of the half-open comparison.

      - name: val_last_confirmed_partner_cannot_withdraw
        claim_type: Violation → Error
        grounds:
          - validations[priority=45]
          - errors[ERR_LAST_PARTNER_WITHDRAWAL]
          - state_machines.CollaborationPartner.CONFIRMED_to_WITHDRAWN
        distinguishing_aspect: >-
          The withdrawal guard counts CONFIRMED partners after the hypothetical withdrawal, so
          the second-to-last partner may leave and the last may not.
        excluded_because:
          difficulty_instance: ci_partner_withdrawal_refolds_shares_and_preserves_allocated_cost
          rationale: >-
            The §1.8 instance already withdraws down to a single partner, refuses the final
            withdrawal and reconciles the refolded shares against total_cost_cents.

      - name: val_benefit_at_exactly_the_insubstantial_threshold_is_excluded
        claim_type: Conditional validation
        grounds:
          - calculations.tier_quid_pro_quo_value
          - entities.MembershipTier.fields.insubstantial_benefit_codes
        distinguishing_aspect: >-
          A per-period benefit value exactly equal to the insubstantial threshold is excluded
          from the quid pro quo, because the test is per_period_fmv <= threshold.
        excluded_because:
          difficulty_instance: bp_insubstantial_benefit_equal_to_threshold_is_excluded
          rationale: >-
            The §1.8 instance already places one benefit exactly on the threshold and one a cent
            above it on the same tier and asserts the resulting quid pro quo and code list.

      - name: val_reserve_balance_at_exactly_half_the_target_is_watch
        claim_type: Satisfaction → Pass
        grounds:
          - calculations.reserve_policy_posture
          - entities.FiscalPeriod.fields.sustainability_posture
        distinguishing_aspect: >-
          A balance exactly equal to round_half_up(target / 2) is WATCH with a 6000 bps cap, not
          CONSTRAINED with 2500, because the half-target comparison is strict.
        excluded_because:
          difficulty_instance: bp_reserve_balance_exactly_half_target_is_watch_not_constrained
          rationale: >-
            The §1.8 instance already sits the balance on the half-target boundary and one cent
            below it, asserting the posture and cap flip.

      - name: val_returned_report_resubmission_recomputes_the_variance
        claim_type: Violation → Error
        grounds:
          - validations[priority=33]
          - entities.GrantReport.fields.variance_bps
          - state_machines.GrantReport.RETURNED_to_SUBMITTED
        distinguishing_aspect: >-
          A RETURNED report clears its spend and variance, and the resubmitted figure is
          re-tested against the same 2000 bps tolerance rather than the original one.
        excluded_because:
          difficulty_instance: nl_grant_report_returned_resubmission_recomputes_variance
          rationale: >-
            The §1.8 instance already returns a report for an unacceptable variance, resubmits a
            compliant figure and asserts the recomputed variance and acceptance.

  - section: Endpoints
    instances:

      - name: ep_transparency_report_is_a_computed_read_over_disclosures_and_awards
        claim_type: Computed read
        grounds:
          - entities.CoverageArea.fields.disclosed_funder_count
          - entities.CoverageArea.fields.restricted_grant_count
          - entities.Funder.fields.lifetime_committed_cents
        distinguishing_aspect: >-
          The public read is assembled from other rows at request time: one disclosed funder
          holding a 350000-cent restricted award yields disclosed_funder_count 1,
          restricted_grant_count 1 and total_committed_cents 350000, with no stored column of
          its own on CoverageArea.
        test_recipe:
          setup: "HOUSING carries one ACTIVE disclosure for a CLEARED foundation that holds a PROJECT_RESTRICTED 350000-cent award."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              as_user_id: user-fc-1
              captures: { fp_id: "$.data.id" }
            - call: "POST /coverage-areas"
              payload: { area_code: "HOUSING", name: "Housing", editorial_lead_user_id: "user-ed-2" }
              as: EditorialDirector
              as_user_id: user-ed-1
              captures: { ca_id: "$.data.id" }
            - call: "POST /funders"
              payload: { legal_name: "Ironwood Trust", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { f_id: "$.data.id" }
            - call: "POST /funders/${f_id}/independence-clearance"
              payload: { decision: "CLEAR", basis: "SELF_ATTESTED" }
              as: EditorialDirector
              as_user_id: user-ed-1
              captures: { f_v1: "$.data.version" }
            - call: "POST /firewall-disclosures"
              payload: { funder_id: "${f_id}", coverage_area_id: "${ca_id}", disclosure_text: "Ironwood funds housing coverage; the housing desk retains editorial control.", expected_funder_version: "${f_v1}" }
              as: EditorialDirector
              as_user_id: user-ed-1
            - call: "POST /grant-proposals"
              payload: { funder_id: "${f_id}", fiscal_period_id: "${fp_id}", title: "Housing accountability project", requested_amount_cents: 350000, restriction_type: "PROJECT_RESTRICTED", coverage_area_id: "${ca_id}", restriction_start_date: "2026-09-01", restriction_end_date: "2027-07-31", reporting_cadence: "ANNUAL" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { gp_id: "$.data.id" }
            - call: "POST /grant-proposals/${gp_id}/pipeline-actions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /grant-proposals/${gp_id}/internal-review"
              payload: { decision: "CLEAR" }
              as: EditorialDirector
              as_user_id: user-ed-1
            - call: "POST /grant-proposals/${gp_id}/pipeline-actions"
              payload: { action: "SUBMIT" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /grant-proposals/${gp_id}/record-outcome"
              payload: { outcome: "AWARDED", awarded_amount_cents: 350000, award_date: "2026-08-01" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
          trigger:
            - call: "GET /coverage-areas/${ca_id}/transparency-report"
              payload: {}
              as: BoardOversight
              as_user_id: user-bo-1
          assert:
            - "trigger[0]: area_code == HOUSING, publication_gate == OPEN, disclosure_status == CURRENT"
            - "trigger[0]: disclosed_funder_count == 1, restricted_grant_count == 1, total_committed_cents == 350000"
            - "trigger[0]: disclosed_funder_ids contains exactly ${f_id}"

      - name: ep_board_override_is_rejected_when_concentration_is_not_elevated
        claim_type: Conditional action
        grounds:
          - validations[priority=15]
          - errors[ERR_BOARD_OVERRIDE_NOT_WARRANTED]
          - calculations.reserve_policy_posture
        distinguishing_aspect: >-
          On an empty period holding five months of reserve the posture is HEALTHY and the HHI
          is 0, so the override endpoint refuses to record anything - the action is warranted
          only by an elevated HHI or a CONSTRAINED/CRITICAL posture.
        test_recipe:
          setup: "One empty period with a 1000000-cent reserve against a 200000-cent monthly base."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 1000000 }
              as: FinanceController
              as_user_id: user-fc-1
              captures: { fp_id: "$.data.id" }
          trigger:
            - call: "GET /fiscal-periods/${fp_id}/sustainability"
              payload: {}
              as: BoardOversight
              as_user_id: user-bo-1
            - call: "POST /fiscal-periods/${fp_id}/board-override"
              payload: { justification: "Pre-emptive override before any revenue is recognized." }
              as: BoardOversight
              as_user_id: user-bo-1
              captures: { err_id: "$.data.error_id" }
          assert:
            - "trigger[0]: recognized_revenue_cents == 0, concentration_hhi == 0, reserve_months_target == 3, operating_reserve_target_cents == 600000, reserve_months_ratio_bps == 50000, sustainability_posture == HEALTHY, restricted_release_cap_pct_bps == 10000"
            - "trigger[1]: 409 with data.error_id == ERR_BOARD_OVERRIDE_NOT_WARRANTED"
            - "GET /fiscal-periods/${fp_id}: board_override_active == false and board_override_justification == null"

      - name: ep_member_cancel_action_clears_the_renewal_schedule_and_locks_the_row
        claim_type: Action endpoint
        grounds:
          - state_machines.Member.ACTIVE_to_CANCELLED
          - entities.Member.fields.next_renewal_date
        distinguishing_aspect: >-
          The one action endpoint carries three different verbs, and CANCEL both moves the row to
          CANCELLED and nulls next_renewal_date, after which REINSTATE on the same endpoint is
          refused as terminal rather than as an unknown action.
        test_recipe:
          setup: "A member activated on 2026-08-01 by settling a 2500-cent monthly membership contribution; the clock is never advanced."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              as_user_id: user-fc-1
              captures: { fp_id: "$.data.id" }
            - call: "POST /membership-tiers"
              payload: { tier_code: "SUSTAINER", name: "Sustainer", renewal_cadence: "MONTHLY", contribution_amount_cents: 2500, benefits: [] }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { tier_id: "$.data.id" }
            - call: "POST /membership-tiers/${tier_id}/publish"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /members"
              payload: { tier_id: "${tier_id}", email: "ana@example.org", full_name: "Ana Ruiz" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { m_id: "$.data.id" }
            - call: "POST /contributions"
              payload: { fiscal_period_id: "${fp_id}", revenue_stream: "MEMBERSHIP", amount_cents: 2500, received_date: "2026-08-01", member_id: "${m_id}" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { c_id: "$.data.id" }
            - call: "POST /contributions/${c_id}/settlement"
              payload: { outcome: "SETTLED" }
              as: FinanceController
              as_user_id: user-fc-1
          trigger:
            - call: "GET /members/${m_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /members/${m_id}/lifecycle-actions"
              payload: { action: "CANCEL" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /members/${m_id}/lifecycle-actions"
              payload: { action: "REINSTATE" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err_id: "$.data.error_id" }
          assert:
            - "trigger[0]: status == ACTIVE, next_renewal_date == 2026-09-01, grace_expires_at == null, consecutive_renewals == 0"
            - "trigger[1]: 200 with status == CANCELLED, next_renewal_date == null, grace_expires_at == null"
            - "trigger[2]: 409 with data.error_id == ERR_TERMINAL_STATE"

      - name: ep_disclosure_link_requires_both_the_funder_and_the_coverage_area_to_exist
        claim_type: Cross-reference link
        grounds:
          - validations[priority=4]
          - errors[ERR_COVERAGE_AREA_NOT_FOUND]
          - entities.FirewallDisclosure.fields.coverage_area_id
        distinguishing_aspect: >-
          The disclosure endpoint links two independent rows, so an unknown coverage_area_id is
          reported as ERR_COVERAGE_AREA_NOT_FOUND rather than ERR_FUNDER_NOT_FOUND, and only the
          fully resolved pair raises the area's disclosed_funder_count to 1.
        test_recipe:
          setup: "One CLEARED foundation and one coverage area CLIMATE with no disclosures."
          setup_api_calls:
            - call: "POST /coverage-areas"
              payload: { area_code: "CLIMATE", name: "Climate", editorial_lead_user_id: "user-ed-2" }
              as: EditorialDirector
              as_user_id: user-ed-1
              captures: { ca_id: "$.data.id" }
            - call: "POST /funders"
              payload: { legal_name: "Ironwood Trust", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { f_id: "$.data.id" }
            - call: "POST /funders/${f_id}/independence-clearance"
              payload: { decision: "CLEAR", basis: "SELF_ATTESTED" }
              as: EditorialDirector
              as_user_id: user-ed-1
              captures: { f_v1: "$.data.version" }
          trigger:
            - call: "POST /firewall-disclosures"
              payload: { funder_id: "${f_id}", coverage_area_id: "00000000-0000-4000-8000-000000000000", disclosure_text: "Ironwood funds a beat that does not exist in this newsroom.", expected_funder_version: "${f_v1}" }
              as: EditorialDirector
              as_user_id: user-ed-1
              captures: { err_id: "$.data.error_id" }
            - call: "POST /firewall-disclosures"
              payload: { funder_id: "${f_id}", coverage_area_id: "${ca_id}", disclosure_text: "Ironwood funds climate coverage; the climate desk retains editorial control.", expected_funder_version: "${f_v1}" }
              as: EditorialDirector
              as_user_id: user-ed-1
          assert:
            - "trigger[0]: 404 with data.error_id == ERR_COVERAGE_AREA_NOT_FOUND"
            - "trigger[1]: 201 with status == ACTIVE, attested_by_user_id == user-ed-1, reattestation_reason == null"
            - "GET /coverage-areas/${ca_id}: disclosed_funder_count == 1, disclosure_status == CURRENT, publication_gate == OPEN"

      - name: ep_funder_list_combines_status_and_type_filters_with_pagination
        claim_type: Standard CRUD
        grounds:
          - entities.Funder.fields.status
          - entities.Funder.fields.funder_type
        distinguishing_aspect: >-
          The filters intersect the created_at ASC ordering rather than replacing it, so
          limit=2&offset=1 returns the second and third funders while status=CLEARED returns
          only the cleared one.
        test_recipe:
          setup: "Three funders created in order: a PROSPECT foundation, a PROSPECT corporate donor and a foundation that is then CLEARED."
          setup_api_calls:
            - call: "POST /funders"
              payload: { legal_name: "Ironwood Trust", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { f1: "$.data.id" }
            - call: "POST /funders"
              payload: { legal_name: "Meridian Energy Corp", funder_type: "CORPORATE" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { f2: "$.data.id" }
            - call: "POST /funders"
              payload: { legal_name: "Delta Family Foundation", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { f3: "$.data.id" }
            - call: "POST /funders/${f3}/independence-clearance"
              payload: { decision: "CLEAR", basis: "SELF_ATTESTED" }
              as: EditorialDirector
              as_user_id: user-ed-1
          trigger:
            - call: "GET /funders?status=CLEARED"
              payload: {}
              as: BoardOversight
              as_user_id: user-bo-1
            - call: "GET /funders?funder_type=CORPORATE"
              payload: {}
              as: BoardOversight
              as_user_id: user-bo-1
            - call: "GET /funders?limit=2&offset=1"
              payload: {}
              as: BoardOversight
              as_user_id: user-bo-1
          assert:
            - "trigger[0]: total_count == 1, has_more == false, the single row is ${f3} with independence_risk_score == 10"
            - "trigger[1]: total_count == 1, the single row is ${f2} with independence_risk_score == 25"
            - "trigger[2]: total_count == 3, has_more == false, rows are [${f2}, ${f3}] in created_at ASC order"

      - name: ep_sustainability_read_diverges_between_the_recognized_and_pipeline_bases
        claim_type: Computed read
        grounds:
          - calculations.revenue_diversification_index
          - calculations.reserve_policy_posture
        distinguishing_aspect: >-
          The same stored rows return a different reserve_months_target and posture under
          ?basis=PIPELINE than under the persisted RECOGNIZED basis, and the projection is
          never written back to the period.
        excluded_because:
          difficulty_instance: dv_recognized_vs_pipeline_diverge_on_hhi_top_source_and_reserve_target
          rationale: >-
            The §1.8 instance already reads both bases off one fixture and asserts the divergence
            in HHI, top source share, reserve target and posture, plus the absence of any write.

