  - rule_id: resource_temporal_overlap
    instances:

      - name: interpreter_half_open_touch_allowed_but_cross_courthouse_travel_buffer_enforced
        grounds:
          - calculations.interpreter_interval_conflict
          - calculations.interpreter_interval_conflict.constants
          - validations[priority=30]
          - validations[priority=31]
          - errors[ERR_INTERPRETER_DOUBLE_BOOKED]
          - errors[ERR_TRAVEL_BUFFER_VIOLATION]
        distinguishing_aspect: |
          The interpreter is the occupied resource, and the same fixture exercises
          all four corners of the interval rule with one live calendar: a
          back-to-back booking that TOUCHES at 11:00 is accepted (half-open
          windows), a 59-minute gap to a DIFFERENT courthouse is rejected at
          priority 31, a gap of exactly 60 minutes is accepted (inclusive
          comparison), and a genuinely overlapping window is rejected at priority
          30. Same-courthouse legs need no gap at all, so the buffer is
          conditional on the courthouse pair, not on the times alone.
