      - "action is HANDOFF, ACCEPT, REJECT or RECYCLE; runs the matching §1.2 ExpansionOpportunity transition"
      - "RECYCLE creates a successor row in IDENTIFIED with recycled_from_opportunity_id pointing at this row and a freshly computed qualification_score"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_EXPANSION_OPPORTUNITY_NOT_FOUND, ERR_INVALID_REQUEST, ERR_NOT_HANDOFF_OWNER, ERR_INVALID_STATE_TRANSITION, ERR_COVERAGE_POSTURE_FROZEN, ERR_COVERAGE_POSTURE_RESTRICTED, ERR_HEALTH_TIER_INELIGIBLE, ERR_QUALIFICATION_SCORE_TOO_LOW]

  # --- AdvocacyEnrollment --------------------------------------------------
  - id: E52
    method: POST
    path: /accounts/{id}/advocacy-enrollments
    roles: [AdvocacyManager]
    input: [program_type]
    output: AdvocacyEnrollment
    side_effects:
      - "state = NOMINATED, reference_calls_used = 0"
      - "reference_calls_cap snapshotted from Account.reference_calls_cap per calculations.reference_calls_cap_derivation"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ACCOUNT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_COVERAGE_POSTURE_FROZEN]

  - id: E53
    method: GET
    path: /accounts/{id}/advocacy-enrollments
    roles: [CsmUser, CsOpsAdmin, AdvocacyManager]
    input: ["state?", "program_type?", "limit?", "offset?"]
    output: "AdvocacyEnrollment[]"
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ACCOUNT_NOT_FOUND, ERR_INVALID_REQUEST]

  - id: E54
    method: POST
    path: /advocacy-enrollments/{id}/transition
    roles: [AdvocacyManager]
    input: [action]
    output: AdvocacyEnrollment
    side_effects:
      - "action is APPROVE, ACTIVATE, SUSPEND, LOG_REFERENCE_CALL, GRADUATE or REVOKE; runs the matching §1.2 AdvocacyEnrollment transition"
      - "LOG_REFERENCE_CALL increments reference_calls_used and stamps last_reference_call_at"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ADVOCACY_ENROLLMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE_TRANSITION, ERR_COVERAGE_POSTURE_RESTRICTED, ERR_HEALTH_TIER_INELIGIBLE, ERR_REFERENCE_CALL_CAP_REACHED]

  # --- Test-driving endpoints (§1.5 priority ladder, last resort) ----------
  - id: E55
    method: POST
    path: /_clock/set_current_utc
    roles: [CsOpsAdmin]
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock used by every window, sweep and date difference in §1.3"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: |
      MANDATORY DEFAULT: when this endpoint has never been called, the logical
      clock is 2026-08-01T00:00:00Z. Every §1.8 and §1.9 instance that does not
      call it relies on that default.
      Justification for a test-driving endpoint: the 90-day support window, the
      180-day executive window, TTV breach detection, milestone overdue sweeps,
      commitment breach sweeps and opportunity staleness are all clock-relative
      and cannot be reached by composing business endpoints alone.

  - id: E56
    method: POST
    path: /_ops/daily-sweep
    roles: [CsOpsAdmin]
    input: []
    output: "{ milestones_marked_overdue: integer, commitments_breached: integer, opportunities_expired: integer, accounts_repostured: integer }"
    side_effects:
      - "PENDING OnboardingMilestone rows past due_date -> OVERDUE"
      - "ACCEPTED RemediationCommitment rows past due_date on a COMMITTED case -> BREACHED, which cascades case -> DISPUTED, SavePlay -> FAILED and the account health debit"
      - "IDENTIFIED ExpansionOpportunity rows older than OPPORTUNITY_STALE_DAYS -> EXPIRED"
      - "raises or clears Account.ttv_breach_flag per calculations.time_to_value_days and re-derives coverage_posture, which blocks or unblocks onboarding milestones"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED]
    note: |
      Justification for a test-driving endpoint: OVERDUE, BREACHED, EXPIRED and
      ttv_breach_flag are time-driven states with no business trigger. Composing
      existing endpoints cannot reach them, and adding a per-entity business
      endpoint for each would multiply surface for no domain value.

# =============================================================================
# 1.6 Error Catalog  (43 error_ids; every one is triggerable)
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message_template: "Authentication headers are missing or name an unknown role."
    triggered_by: "any endpoint called without X-User-ID or without a recognised X-Role"

  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message_template: "Role {role} may not call {method} {path}."
    triggered_by: "any endpoint called by a role outside its §1.5 roles list"

  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message_template: "Request is invalid: {detail}."
    triggered_by: "missing required body field, out-of-range enum, negative integer where §1.1 forbids it, malformed date or datetime, limit outside 1..100, or a conditional lifecycle/transition field omitted"

  - error_id: ERR_INVALID_ENGAGEMENT_INTERVAL
    http_status: 400
    message_template: "Interval end {end} must be after start {start}."
    triggered_by: "POST /accounts/{id}/executive-engagements with end_at <= start_at; POST /save-plays with window_end_date < window_start_date; POST /accounts with contract_end_date <= contract_start_date"

  - error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    message_template: "Account {id} does not exist."
    triggered_by: "any path or body reference to an unknown account"

  - error_id: ERR_CSM_NOT_FOUND
    http_status: 404
    message_template: "Csm {id} does not exist."
    triggered_by: "GET/PATCH /csms/{id}, or an unknown csm_id / owner_csm_id in a body"

  - error_id: ERR_COVERAGE_ASSIGNMENT_NOT_FOUND
    http_status: 404
    message_template: "CoverageAssignment {id} does not exist."
    triggered_by: "GET /coverage-assignments/{id}, POST /coverage-assignments/{id}/release"

  - error_id: ERR_SPONSOR_CONTACT_NOT_FOUND
    http_status: 404
    message_template: "SponsorContact {id} does not exist."
    triggered_by: "GET/PATCH /sponsor-contacts/{id}, GET /sponsor-contacts/{id}/executive-engagements, or an unknown sponsor_contact_id in a body"

  - error_id: ERR_EXECUTIVE_ENGAGEMENT_NOT_FOUND
    http_status: 404
    message_template: "ExecutiveEngagement {id} does not exist."
    triggered_by: "POST /executive-engagements/{id}/outcome"

  - error_id: ERR_OUTCOME_GOAL_NOT_FOUND
    http_status: 404
    message_template: "OutcomeGoal {id} does not exist."
    triggered_by: "POST /outcome-goals/{id}/progress"

  - error_id: ERR_ONBOARDING_MILESTONE_NOT_FOUND
    http_status: 404
    message_template: "OnboardingMilestone {id} does not exist."
    triggered_by: "POST /onboarding-milestones/{id}/transition"

  - error_id: ERR_SAVE_PLAY_NOT_FOUND
    http_status: 404
    message_template: "SavePlay {id} does not exist."
    triggered_by: "GET /save-plays/{id}, POST /save-plays/{id}/transition, or an unknown save_play_id in a body"

  - error_id: ERR_ESCALATION_CASE_NOT_FOUND
    http_status: 404
    message_template: "EscalationCase {id} does not exist."
    triggered_by: "GET /escalation-cases/{id}, its transition and remediation-commitment sub-routes"

  - error_id: ERR_REMEDIATION_COMMITMENT_NOT_FOUND
    http_status: 404
    message_template: "RemediationCommitment {id} does not exist."
    triggered_by: "POST /remediation-commitments/{id}/transition"

  - error_id: ERR_RENEWAL_FORECAST_NOT_FOUND
    http_status: 404
    message_template: "RenewalForecast {id} does not exist."
    triggered_by: "GET /renewal-forecasts/{id}, its submit and reconcile routes"

  - error_id: ERR_EXPANSION_OPPORTUNITY_NOT_FOUND
    http_status: 404
    message_template: "ExpansionOpportunity {id} does not exist."
    triggered_by: "GET /expansion-opportunities/{id}, POST /expansion-opportunities/{id}/transition"

  - error_id: ERR_ADVOCACY_ENROLLMENT_NOT_FOUND
    http_status: 404
    message_template: "AdvocacyEnrollment {id} does not exist."
    triggered_by: "POST /advocacy-enrollments/{id}/transition"

  - error_id: ERR_NOT_HANDOFF_OWNER
    http_status: 403
    message_template: "Only the account executive named in handoff_ae_user_id may accept or reject this opportunity."
    triggered_by: "POST /expansion-opportunities/{id}/transition ACCEPT or REJECT from a different X-User-ID"

  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message_template: "User {user_id} accepted this commitment and may not also deliver it."
    triggered_by: "POST /remediation-commitments/{id}/transition DELIVER by the accepting user"

  - error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    message_template: "expected_account_version {expected} does not match the account's current version {actual}."
    triggered_by: "POST /coverage-assignments with a stale expected_account_version (§1.2.1 coverage-assignment-create-stale-account)"

  - error_id: ERR_STALE_ESCALATION_VERSION
    http_status: 412
    message_template: "expected_escalation_case_version {expected} does not match the case's current version {actual}."
    triggered_by: "POST /escalation-cases/{id}/remediation-commitments with a stale expected_escalation_case_version (§1.2.1 remediation-commitment-create-stale-case)"

  - error_id: ERR_ACCOUNT_LIFECYCLE_INVALID
    http_status: 409
    message_template: "Lifecycle action {action} is not available from lifecycle_state {state}."
    triggered_by: "POST /accounts/{id}/lifecycle with an action that has no §1.2 edge from the current lifecycle_state, or whose lifecycle precondition fails (RENEW without a LOCKED forecast, WIN_BACK_TARGET on a MERGER_ACQUISITION churn, WAIVE_TTV_BREACH with ttv_breach_flag false)"

  - error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    message_template: "{entity} {id} cannot move from {from_state} via {action}."
    triggered_by: "any transition endpoint whose action has no §1.2 edge from the current state, including every attempt out of a terminal state and any submit/reconcile on a LOCKED forecast"

  - error_id: ERR_COVERAGE_POSTURE_FROZEN
    http_status: 409
    message_template: "Account {account_id} has coverage_posture FROZEN; {operation} is blocked."
    triggered_by: "creating goals, engagements, milestones, forecasts, save plays, opportunities or enrollments on a CHURNED / WIN_BACK_TARGETED / ARCHIVED account, or on an ONBOARDING account with ttv_breach_flag true"

  - error_id: ERR_COVERAGE_POSTURE_RESTRICTED
    http_status: 409
    message_template: "Account {account_id} has coverage_posture RESTRICTED; {operation} requires OPEN."
    triggered_by: "POST /expansion-opportunities/{id}/transition HANDOFF or POST /advocacy-enrollments/{id}/transition APPROVE while a save play, an open escalation, or a missing COMMITTED assignment holds the account at RESTRICTED"

  - error_id: ERR_COVERAGE_TIER_UNASSIGNED
    http_status: 409
    message_template: "Account {account_id} has coverage_tier UNASSIGNED; run segmentation first."
    triggered_by: "POST /coverage-assignments before POST /accounts/{id}/segmentation has ever run"

  - error_id: ERR_FORECAST_NOT_SUBMITTED
    http_status: 409
    message_template: "RenewalForecast {id} is in cs_state {cs_state}; finance actions require SUBMITTED."
    triggered_by: "POST /renewal-forecasts/{id}/reconcile while cs_state is DRAFT"

  - error_id: ERR_SPONSOR_DEPARTED
    http_status: 422
    message_template: "Sponsor coverage is unavailable: {detail}."
    triggered_by: "scheduling an engagement against a DEPARTED sponsor, or committing an escalation with no ACTIVE economic buyer on the account"

  - error_id: ERR_HEALTH_TIER_INELIGIBLE
    http_status: 422
    message_template: "Account health_tier {tier} is not in the set {allowed} required by {operation}."
    triggered_by: "activating a save play on a GREEN account, handing off an opportunity on a RED account, approving an enrollment on a non-GREEN account, activating an enrollment on a RED account"

  - error_id: ERR_ENGAGEMENT_WINDOW_CONFLICT
    http_status: 409
    message_template: "Sponsor {sponsor_contact_id} already has an engagement within {buffer_minutes} minutes of {start_at}."
    triggered_by: "POST /accounts/{id}/executive-engagements violating calculations.engagement_window_conflict"

  - error_id: ERR_SAVE_PLAY_WINDOW_CAPACITY
    http_status: 409
    message_template: "Account {account_id} already has {max} active save plays covering {date}."
    triggered_by: "POST /save-plays/{id}/transition ACTIVATE violating calculations.save_play_window_capacity"

  - error_id: ERR_CONTRACT_END_IN_PAST
    http_status: 422
    message_template: "contract_end_date {date} must be after the current date {clock_date}."
    triggered_by: "REACTIVATE with a new_contract_end_date at or before the clock, or PATCH /accounts/{id} setting contract_end_date at or before the clock"

  - error_id: ERR_MILESTONE_SEQUENCE_VIOLATION
    http_status: 422
    message_template: "Milestone {milestone_code} cannot complete while sequence_index {blocking_index} is still open."
    triggered_by: "POST /onboarding-milestones/{id}/transition COMPLETE with an earlier milestone still PENDING, OVERDUE or BLOCKED"

  - error_id: ERR_MILESTONE_CODE_DUPLICATE
    http_status: 409
    message_template: "Account {account_id} already has a milestone with {field} {value}."
    triggered_by: "POST /accounts/{id}/onboarding-milestones repeating a milestone_code or a sequence_index"

  - error_id: ERR_FORECAST_PERIOD_DUPLICATE
    http_status: 409
    message_template: "Account {account_id} already has a forecast for fiscal_period {fiscal_period}."
    triggered_by: "POST /renewal-forecasts repeating a fiscal_period for the same account"

  - error_id: ERR_CROSS_ACCOUNT_REFERENCE
    http_status: 422
    message_template: "{entity} {id} belongs to account {other_account_id}, not {account_id}."
    triggered_by: "POST /escalation-cases with a save_play_id from another account, or POST /accounts/{id}/executive-engagements with a sponsor_contact_id from another account"

  - error_id: ERR_NO_ACCEPTED_COMMITMENT
    http_status: 422
    message_template: "EscalationCase {id} has no {required_state} remediation commitment for round {round}."
    triggered_by: "COMMIT with no ACCEPTED commitment at the current remediation_round, or RESOLVE with no DELIVERED commitment or with commitments still PROPOSED/ACCEPTED"

  - error_id: ERR_QUALIFICATION_SCORE_TOO_LOW
    http_status: 422
    message_template: "qualification_score {score} is below the handoff floor {floor}."
    triggered_by: "POST /expansion-opportunities/{id}/transition HANDOFF with qualification_score < 65.00"

  - error_id: ERR_WEIGHT_TOTAL_INVALID
    http_status: 422
    message_template: "Total outcome weight would reach {total} basis points, exceeding {max}."
    triggered_by: "POST /accounts/{id}/outcome-goals pushing the non-WAIVED weight_bp sum past 10000"

  - error_id: ERR_CREDIT_EXCEEDS_CAP
    http_status: 422
    message_template: "credit_cents {credit} exceeds {cap_bp} basis points of the account ARR."
    triggered_by: "POST /escalation-cases/{id}/remediation-commitments with credit_cents above 10% of arr_cents"

  - error_id: ERR_NO_ELIGIBLE_CSM
    http_status: 409
    message_template: "No ACTIVE Csm has coverage_specialty {coverage_tier}."
    triggered_by: "POST /coverage-assignments with an empty eligible pool, or an explicit csm_id that is not ACTIVE or whose specialty does not match"

  - error_id: ERR_CSM_CAPACITY_EXHAUSTED
    http_status: 409
    message_template: "capacity_units_total {requested} is below capacity_units_committed {committed}."
    triggered_by: "PATCH /csms/{id} lowering capacity_units_total below the CSM's committed load"

  - error_id: ERR_REFERENCE_CALL_CAP_REACHED
    http_status: 409
    message_template: "AdvocacyEnrollment {id} has used {used} of {cap} reference calls."
    triggered_by: "POST /advocacy-enrollments/{id}/transition LOG_REFERENCE_CALL at or past the cap, or on a CAB enrollment"

# =============================================================================
# 1.7 RBAC Table
# =============================================================================
roles:
  - name: CsmUser
    identity: "entity_backed:Csm"
    description: |
      The customer success manager who owns day-to-day account work. Backed by a
      Csm row, so X-User-ID is a Csm.id and the role is the one whose capacity is
      consumed by CoverageAssignment.load_units.
    exclusive_operations:
      - "POST /accounts/{id}/outcome-goals"
      - "POST /outcome-goals/{id}/progress"
      - "POST /save-plays"
      - "POST /save-plays/{id}/transition"
      - "POST /renewal-forecasts"
      - "POST /renewal-forecasts/{id}/submit"
      - "POST /expansion-opportunities"
    shared_operations:
      - "GET /accounts, GET /accounts/{id}, GET /accounts/{id}/health-summary"
      - "POST /accounts/{id}/health-recompute (with CsOpsAdmin)"
      - "POST /accounts/{id}/signals (with CsOpsAdmin)"
      - "POST /accounts/{id}/sponsor-contacts, PATCH /sponsor-contacts/{id} (with CsOpsAdmin)"
      - "POST /accounts/{id}/executive-engagements, POST /executive-engagements/{id}/outcome (with CsExecutive)"
      - "POST /accounts/{id}/onboarding-milestones, POST /onboarding-milestones/{id}/transition (with CsOpsAdmin)"
      - "POST /escalation-cases (with CsExecutive)"
      - "POST /remediation-commitments/{id}/transition (with CsExecutive; DELIVER is the CSM-side step)"
      - "POST /expansion-opportunities/{id}/transition (HANDOFF and RECYCLE; with SalesAccountExecutive for ACCEPT and REJECT)"
      - "every GET listed in §1.5 whose roles include CsmUser"

  - name: CsOpsAdmin
    identity: opaque
    description: "CS operations. Owns account records, segmentation, CSM roster, coverage assignment and the clock/sweep test-driving endpoints."
    exclusive_operations:
      - "POST /accounts"
      - "PATCH /accounts/{id}"
      - "POST /accounts/{id}/lifecycle"
      - "POST /accounts/{id}/segmentation"
      - "POST /csms"
      - "PATCH /csms/{id}"
      - "POST /coverage-assignments"
      - "POST /coverage-assignments/{id}/release"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/daily-sweep"
    shared_operations:
      - "POST /accounts/{id}/health-recompute (with CsmUser)"
      - "POST /accounts/{id}/signals (with CsmUser)"
      - "POST /accounts/{id}/sponsor-contacts, PATCH /sponsor-contacts/{id} (with CsmUser)"
      - "POST /accounts/{id}/onboarding-milestones, POST /onboarding-milestones/{id}/transition (with CsmUser)"
      - "every GET listed in §1.5 whose roles include CsOpsAdmin"

  - name: CsExecutive
    identity: opaque
    description: "Executive sponsor on the vendor side. Owns escalation adjudication and remediation acceptance; the ACCEPT half of the segregation-of-duties pair."
    exclusive_operations:
      - "POST /escalation-cases/{id}/transition"
      - "POST /escalation-cases/{id}/remediation-commitments"
    shared_operations:
      - "POST /escalation-cases (with CsmUser)"
      - "POST /accounts/{id}/executive-engagements, POST /executive-engagements/{id}/outcome (with CsmUser)"
      - "POST /remediation-commitments/{id}/transition (with CsmUser; ACCEPT and REJECT are the executive-side steps)"
      - "GET /accounts/{id}, GET /accounts/{id}/health-summary and the escalation, save-play, sponsor and engagement GETs"

  - name: FinanceAnalyst
    identity: opaque
    description: "Finance owner of the reconciliation axis of RenewalForecast. Cannot author or submit a CS forecast, only reconcile and lock one."
    exclusive_operations:
      - "POST /renewal-forecasts/{id}/reconcile"
    shared_operations:
      - "GET /accounts, GET /accounts/{id}"
      - "GET /renewal-forecasts/{id}, GET /accounts/{id}/renewal-forecasts (with CsmUser and CsOpsAdmin)"

  - name: SalesAccountExecutive
    identity: opaque
    description: "Sales counterpart who accepts or rejects an expansion handoff. Authority is further narrowed to the specific X-User-ID recorded in handoff_ae_user_id."
    exclusive_operations: []
    shared_operations:
      - "POST /expansion-opportunities/{id}/transition (ACCEPT and REJECT only; HANDOFF and RECYCLE belong to CsmUser)"
      - "GET /expansion-opportunities, GET /expansion-opportunities/{id}, GET /accounts, GET /accounts/{id}"

  - name: AdvocacyManager
    identity: opaque
    description: "Runs the customer advisory board and the reference program."
    exclusive_operations:
      - "POST /accounts/{id}/advocacy-enrollments"
      - "POST /advocacy-enrollments/{id}/transition"
    shared_operations:
      - "GET /accounts/{id}/advocacy-enrollments (with CsmUser and CsOpsAdmin)"
      - "GET /accounts, GET /accounts/{id}"
