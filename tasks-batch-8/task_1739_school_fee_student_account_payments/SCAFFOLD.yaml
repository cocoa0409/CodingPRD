# =============================================================================
# SCAFFOLD.yaml — task_1739_school_fee_student_account_payments
# School Fee & Student Account Payments (school bookkeeper domain)
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  School Fee & Student Account Payments (school bookkeeper): fee assessment by
  course/activity & optional purchase, online payment & family balance, fee
  waiver eligibility & automatic application, refund policy on withdrawal or
  activity cancellation, negative balance & graduation hold policy, department
  revenue distribution & reconciliation, payment plan for large fees,
  collections & write-off.

domain_name: school-fee-student-account-payments
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - scheduled_actions
    - ops_run_checkpoint
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SchoolYear
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Display label, e.g. '2026-27'" }
      - { name: start_date, type: string, source: input, description: "ISO-8601 date, first day of school year" }
      - { name: end_date, type: string, source: input, description: "ISO-8601 date, last day of school year; must be > start_date" }
      - { name: refund_full_days, type: integer, source: input, description: "Days from offering start eligible for FULL refund (inclusive boundary)" }
      - { name: refund_partial_days, type: integer, source: input, description: "Days from offering start eligible for PARTIAL refund (inclusive); must be > refund_full_days" }
      - { name: partial_refund_pct_bp, type: integer, source: input, description: "Partial refund percentage in basis points (0-10000)" }
      - { name: payment_plan_min_cents, type: integer, source: input, description: "Minimum total assessed balance required to open a payment plan" }
      - { name: payment_plan_max_installments, type: integer, source: input, description: "Maximum installments allowed in a payment plan (>=2)" }
      - { name: writeoff_max_cents, type: integer, source: input, description: "Maximum single write-off amount a Bookkeeper may execute without Superintendent co-approval" }
      - { name: aging_interval_days, type: integer, source: input, description: "Days between collections aging buckets" }
      - { name: graduation_hold_threshold_cents, type: integer, source: input, description: "Negative-of; balance owed strictly greater than this triggers GRADUATION_HOLD on posture recompute (boundary: owed > threshold)" }
      - { name: status, type: enum, source: system, description: "DRAFT → OPEN → CLOSED (terminal). Constraints: DRAFT|OPEN|CLOSED" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: external_ref, type: string, source: input, description: "District SIS identifier; unique per school year scope not required — globally unique" }
      - { name: full_name, type: string, source: input, description: "Student legal name" }
      - { name: grade_level, type: integer, source: input, description: "Grade 9-12; grade 12 students are graduation candidates" }
      - { name: family_id, type: string, source: input, description: "Family grouping identifier shared by siblings; family balance is computed over all accounts of students with same family_id" }
      - { name: status, type: enum, source: system, description: "ENROLLED → WITHDRAWN | GRADUATED. Constraints: ENROLLED|WITHDRAWN|GRADUATED" }

  - name: StudentAccount
    parent: SchoolYear
    common_fields: true
    fields:
      - { name: school_year_id, type: string, source: system, description: "FK -> SchoolYear.id; owning school year" }
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; owning student" }
      - { name: assessed_cents, type: integer, source: computed, description: "Sum of assessed_amount_cents over FeeAssessment rows with status IN {ASSESSED, PARTIALLY_PAID, PAID, PAYMENT_PLAN, DELINQUENT, WAIVED}, PLUS sum of allocated_cents over REFUNDED rows (retained portion kept by policy); VOID rows contribute 0" }
      - { name: waived_cents, type: integer, source: computed, description: "Sum of waived_amount_cents over all non-VOID FeeAssessment rows of this account" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of amount_cents over SUCCEEDED Payment rows on this account minus Refund.refund_cents for EXECUTED refunds on this account (gross receipts net of refunds; includes unallocated overpayment so credit balances go negative)" }
      - { name: balance_cents, type: integer, source: computed, description: "= assessed_cents - waived_cents - paid_cents; positive = owed by family, negative = credit owed to family" }
      - { name: family_balance_cents, type: integer, source: computed, description: "Sum of balance_cents over all StudentAccount rows whose student shares this account student's family_id and whose school_year status is OPEN" }
      - { name: posture, type: enum, source: computed, description: "CLEAR | GRADUATION_HOLD | COLLECTIONS | WRITTEN_OFF. Derived per posture_recompute calculation. Constraints: CLEAR|GRADUATION_HOLD|COLLECTIONS|WRITTEN_OFF" }
      - { name: last_posture_check_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent posture recompute" }

  - name: Department
    parent: SchoolYear
    common_fields: true
    fields:
      - { name: school_year_id, type: string, source: system, description: "FK -> SchoolYear.id; owning school year" }
      - { name: code, type: string, source: input, description: "Short code unique within the school year, e.g. 'SCI', 'ATH'" }
      - { name: name, type: string, source: input, description: "Department display name" }
      - { name: distributed_cents, type: integer, source: computed, description: "Sum of LedgerEntry.amount_cents with entry_type = DISTRIBUTION_CREDIT for this department minus amount_cents with entry_type = DISTRIBUTION_REVERSAL" }
      - { name: reconciled_cents, type: integer, source: computed, description: "Distributed cents acknowledged by reconciliation runs; advanced only by POST .../reconciliation-runs" }
      - { name: unreconciled_cents, type: integer, source: computed, description: "= distributed_cents - reconciled_cents" }

  - name: Offering
    parent: SchoolYear
    common_fields: true
    fields:
      - { name: school_year_id, type: string, source: system, description: "FK -> SchoolYear.id; owning school year" }
      - { name: kind, type: enum, source: input, description: "COURSE | ACTIVITY. Constraints: COURSE|ACTIVITY" }
      - { name: title, type: string, source: input, description: "Course or activity title" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; revenue-receiving department" }
      - { name: fee_item_id, type: string, source: input, description: "FK -> FeeCatalogItem.id; fee assessed per enrollment" }
      - { name: start_date, type: string, source: input, description: "ISO-8601 date the offering begins; refund proration measures days from this date" }
      - { name: end_date, type: string, source: input, description: "ISO-8601 date the offering ends; must be >= start_date; enrollment schedule-conflict check uses half-open [start_date, end_date)" }
      - { name: capacity, type: integer, source: input, description: "Maximum concurrently-enrolled students (>=1)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → IN_SESSION → COMPLETED | CANCELLED. Constraints: SCHEDULED|IN_SESSION|COMPLETED|CANCELLED" }

  - name: FeeCatalogItem
    parent: SchoolYear
    common_fields: true
    fields:
      - { name: school_year_id, type: string, source: system, description: "FK -> SchoolYear.id; owning school year" }
      - { name: name, type: string, source: input, description: "Fee name, e.g. 'AP Lab Fee'" }
      - { name: amount_cents, type: integer, source: input, description: "Gross assessed amount in cents (>0)" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; default revenue department (Offering.department_id wins when both present — offering-level attribution)" }
      - { name: waiverable, type: boolean, source: input, default: true, description: "Whether waivers may apply to this fee" }
      - { name: refundable, type: boolean, source: input, default: true, description: "Whether withdrawals/cancellations generate refunds for this fee" }
      - { name: status, type: enum, source: system, description: "ACTIVE → RETIRED. Constraints: ACTIVE|RETIRED" }

  - name: OptionalPurchaseItem
    parent: SchoolYear
    common_fields: true
    fields:
      - { name: school_year_id, type: string, source: system, description: "FK -> SchoolYear.id; owning school year" }
      - { name: name, type: string, source: input, description: "Item name, e.g. 'Yearbook', 'Parking Pass'" }
      - { name: amount_cents, type: integer, source: input, description: "Purchase price in cents (>0)" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; revenue department" }
      - { name: refundable, type: boolean, source: input, default: true, description: "Whether the purchase can be refunded on withdrawal" }
      - { name: inventory_cap, type: integer, source: input, description: "Max units sellable per school year (>=1)" }
      - { name: sold_count, type: integer, source: computed, default: 0, description: "Count of Purchase rows with status IN {COMPLETED} for this item (refunded purchases decrement)" }

  - name: Enrollment
    parent: StudentAccount
    common_fields: true
    fields:
      - { name: student_account_id, type: string, source: system, description: "FK -> StudentAccount.id; owning account" }
      - { name: offering_id, type: string, source: input, description: "FK -> Offering.id; enrolled offering" }
      - { name: enrolled_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: withdrawn_at, type: datetime, source: system, description: "Logical-clock timestamp at withdrawal; null until withdrawn" }
      - { name: status, type: enum, source: system, description: "ACTIVE → WITHDRAWN | COMPLETED | DROPPED_BY_CANCELLATION. Constraints: ACTIVE|WITHDRAWN|COMPLETED|DROPPED_BY_CANCELLATION" }

  - name: FeeAssessment
    parent: StudentAccount
    common_fields: true
    fields:
      - { name: student_account_id, type: string, source: system, description: "FK -> StudentAccount.id; owning account" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; originating enrollment (null for ad-hoc assessments)" }
      - { name: fee_item_id, type: string, source: input, description: "FK -> FeeCatalogItem.id; fee definition" }
      - { name: department_id, type: string, source: system, description: "FK -> Department.id; resolved revenue department = Offering.department_id when enrollment-linked else FeeCatalogItem.department_id" }
      - { name: assessed_amount_cents, type: integer, source: input, description: "Gross assessed amount in cents (>0); enrollment-driven assessments pin FeeCatalogItem.amount_cents at assessment time" }
      - { name: waived_amount_cents, type: integer, source: computed, default: 0, description: "Total waiver applied via waiver_stacking calculation" }
      - { name: allocated_cents, type: integer, source: computed, default: 0, description: "Sum of PaymentAllocation.allocated_cents targeting this assessment" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Sum of Refund.refund_cents for refunds sourced from this assessment (informational; allocated_cents is already net of refunds)" }
      - { name: outstanding_cents, type: integer, source: computed, description: "= assessed_amount_cents - waived_amount_cents - allocated_cents" }
      - { name: payment_plan_id, type: string, source: system, description: "FK -> PaymentPlan.id; set when the assessment is governed by a payment plan" }
      - { name: status, type: enum, source: system, description: "ASSESSED → PARTIALLY_PAID → PAID | PAYMENT_PLAN | DELINQUENT | REFUNDED | WAIVED | VOID. Parallel note: REFUNDED terminal only via full refund. Constraints: ASSESSED|PARTIALLY_PAID|PAID|PAYMENT_PLAN|DELINQUENT|REFUNDED|WAIVED|VOID" }

  - name: Purchase
    parent: StudentAccount
    common_fields: true
    fields:
      - { name: student_account_id, type: string, source: system, description: "FK -> StudentAccount.id; owning account" }
      - { name: item_id, type: string, source: input, description: "FK -> OptionalPurchaseItem.id; purchased item" }
      - { name: amount_cents, type: integer, source: system, description: "Price pinned from OptionalPurchaseItem.amount_cents at purchase time" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Sum of refunds sourced from this purchase" }
      - { name: status, type: enum, source: system, description: "PENDING → COMPLETED | REFUNDED | VOID. Constraints: PENDING|COMPLETED|REFUNDED|VOID" }

  - name: WaiverProgram
    parent: SchoolYear
    common_fields: true
    fields:
      - { name: school_year_id, type: string, source: system, description: "FK -> SchoolYear.id; owning school year" }
      - { name: name, type: string, source: input, description: "Program name, e.g. 'Free Lunch Waiver'" }
      - { name: waiver_pct_bp, type: integer, source: input, description: "Waiver percentage in basis points of the post-prior-waiver base (1-10000)" }
      - { name: stacking_priority, type: integer, source: input, description: "Application order; lower applies first; ties broken by program created_at ASC" }
      - { name: max_waived_per_student_cents, type: integer, source: input, description: "Per-student per-year cap on this program's total waived cents (>=0)" }
      - { name: eligibility_grade_min, type: integer, source: input, description: "Minimum grade_level eligible (inclusive)" }
      - { name: eligibility_grade_max, type: integer, source: input, description: "Maximum grade_level eligible (inclusive; >= eligibility_grade_min)" }
      - { name: status, type: enum, source: system, description: "ACTIVE → SUSPENDED. Constraints: ACTIVE|SUSPENDED" }

  - name: WaiverApplication
    parent: StudentAccount
    common_fields: true
    fields:
      - { name: student_account_id, type: string, source: system, description: "FK -> StudentAccount.id; account the waiver would benefit" }
      - { name: waiver_program_id, type: string, source: input, description: "FK -> WaiverProgram.id; program applied for" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the FamilyMember who submitted; drives segregation-of-duties (approver must differ)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of reviewing Bookkeeper; set on APPROVED/DENIED" }
      - { name: status, type: enum, source: system, description: "PENDING → APPROVED | DENIED | REVOKED. Constraints: PENDING|APPROVED|DENIED|REVOKED" }

  - name: Payment
    parent: StudentAccount
    common_fields: true
    fields:
      - { name: student_account_id, type: string, source: system, description: "FK -> StudentAccount.id; account being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents (>0)" }
      - { name: method, type: enum, source: input, description: "CARD | ACH | CASH | CHECK. Constraints: CARD|ACH|CASH|CHECK" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied dedupe key; unique per account" }
      - { name: overpayment_policy, type: enum, source: input, default: "CREDIT_BALANCE", description: "CREDIT_BALANCE = excess becomes negative balance; REJECT = reject when amount exceeds allocatable outstanding. Constraints: CREDIT_BALANCE|REJECT" }
      - { name: allocated_cents, type: integer, source: computed, default: 0, description: "Sum of PaymentAllocation.allocated_cents for this payment" }
      - { name: status, type: enum, source: system, description: "PENDING → SUCCEEDED | FAILED | VOIDED. Constraints: PENDING|SUCCEEDED|FAILED|VOIDED" }

  - name: PaymentAllocation
    parent: Payment
    common_fields: false
    fields:
      - { name: payment_id, type: string, source: system, description: "FK -> Payment.id; source payment" }
      - { name: fee_assessment_id, type: string, source: system, description: "FK -> FeeAssessment.id; target assessment" }
      - { name: allocated_cents, type: integer, source: system, description: "Cents allocated to this assessment by the allocation waterfall (>0)" }
      - { name: allocation_rule, type: enum, source: system, description: "Which waterfall stage produced this row: INSTALLMENT_DUE for Stage-1 rows, OLDEST_OUTSTANDING for Stage-2 rows; Stage-3 overpayment writes no row. Constraints: INSTALLMENT_DUE|OLDEST_OUTSTANDING" }

  - name: PaymentPlan
    parent: StudentAccount
    common_fields: true
    fields:
      - { name: student_account_id, type: string, source: system, description: "FK -> StudentAccount.id; owning account" }
      - { name: installment_count, type: integer, source: input, description: "Number of installments (2..school_year.payment_plan_max_installments)" }
      - { name: first_due_date, type: string, source: input, description: "ISO-8601 date of first installment; must be >= current logical date" }
      - { name: interval_days, type: integer, source: input, description: "Days between consecutive installments (>0)" }
      - { name: covered_amount_cents, type: integer, source: computed, description: "Sum of outstanding_cents over covered assessments at plan creation" }
      - { name: installment_amount_cents, type: integer, source: computed, description: "Per-installment amount per installment_schedule calculation (equal split with remainder on LAST installment)" }
      - { name: status, type: enum, source: system, description: "ACTIVE → COMPLETED | DEFAULTED | CANCELLED. Constraints: ACTIVE|COMPLETED|DEFAULTED|CANCELLED" }

  - name: PaymentPlanInstallment
    parent: PaymentPlan
    common_fields: true
    fields:
      - { name: payment_plan_id, type: string, source: system, description: "FK -> PaymentPlan.id; owning plan" }
      - { name: sequence, type: integer, source: system, description: "1-based installment index" }
      - { name: due_date, type: string, source: system, description: "Computed due date = first_due_date + (sequence-1)*interval_days" }
      - { name: amount_cents, type: integer, source: system, description: "Scheduled amount; last installment absorbs rounding remainder" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Cents allocated to this installment via INSTALLMENT_DUE allocation rows" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → DUE → PAID | PAST_DUE | WAIVED_BY_DEFAULT. Constraints: SCHEDULED|DUE|PAID|PAST_DUE|WAIVED_BY_DEFAULT" }

  - name: Refund
    parent: StudentAccount
    common_fields: true
    fields:
      - { name: student_account_id, type: string, source: system, description: "FK -> StudentAccount.id; account receiving the refund" }
      - { name: fee_assessment_id, type: string, source: system, description: "FK -> FeeAssessment.id; source assessment (null unless reason is WITHDRAWAL/ACTIVITY_CANCELLATION on an enrollment fee)" }
      - { name: purchase_id, type: string, source: system, description: "FK -> Purchase.id; source purchase (null unless refund sourced from a Purchase); both FKs null for OVERPAYMENT_RETURN" }
      - { name: reason, type: enum, source: system, description: "WITHDRAWAL | ACTIVITY_CANCELLATION | OVERPAYMENT_RETURN | WRITE_OFF_REVERSAL. Constraints: WITHDRAWAL|ACTIVITY_CANCELLATION|OVERPAYMENT_RETURN|WRITE_OFF_REVERSAL" }
      - { name: refund_cents, type: integer, source: computed, description: "Computed by refund_proration (fees) or full purchase amount (purchases)" }
      - { name: status, type: enum, source: system, description: "PENDING → EXECUTED | DENIED. Constraints: PENDING|EXECUTED|DENIED" }

  - name: LedgerEntry
    parent: StudentAccount
    common_fields: false
    fields:
      - { name: student_account_id, type: string, source: system, description: "FK -> StudentAccount.id; account context" }
      - { name: department_id, type: string, source: system, description: "FK -> Department.id; credited/debited department" }
      - { name: entry_type, type: enum, source: system, description: "DISTRIBUTION_CREDIT | DISTRIBUTION_REVERSAL | WRITE_OFF_DEBIT | WRITE_OFF_REVERSAL. Constraints: DISTRIBUTION_CREDIT|DISTRIBUTION_REVERSAL|WRITE_OFF_DEBIT|WRITE_OFF_REVERSAL" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents; DISTRIBUTION_CREDIT positive, DISTRIBUTION_REVERSAL negative" }
      - { name: source_payment_id, type: string, source: system, description: "FK -> Payment.id; payment whose allocation produced this distribution (null for write-off rows)" }
      - { name: reconciliation_run_id, type: string, source: system, description: "FK -> ReconciliationRun.id; run that reconciled this entry (null until reconciled)" }

  - name: ReconciliationRun
    parent: SchoolYear
    common_fields: true
    fields:
      - { name: school_year_id, type: string, source: system, description: "FK -> SchoolYear.id; reconciled year" }
      - { name: run_at, type: datetime, source: system, description: "Logical-clock timestamp of the run" }
      - { name: entries_reconciled, type: integer, source: computed, description: "Count of LedgerEntry rows stamped with this run id" }
      - { name: drift_detected, type: boolean, source: computed, description: "True when any department's distribution sum differs from the sum over its assessments' allocations (reconciliation_invariant check)" }
      - { name: status, type: enum, source: system, description: "COMPLETED (runs are atomic; single terminal state). Constraints: COMPLETED" }

  - name: CollectionsCase
    parent: StudentAccount
    common_fields: true
    fields:
      - { name: student_account_id, type: string, source: system, description: "FK -> StudentAccount.id; delinquent account" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp when case opened (by aging sweep)" }
      - { name: principal_cents, type: integer, source: system, description: "Balance owed at case open (snapshot)" }
      - { name: aging_bucket, type: enum, source: computed, description: "CURRENT | BUCKET_1 | BUCKET_2 | BUCKET_3 per collections_aging calculation. Constraints: CURRENT|BUCKET_1|BUCKET_2|BUCKET_3" }
      - { name: written_off_cents, type: integer, source: computed, default: 0, description: "Cents written off against this case" }
      - { name: approved_writeoff_cents, type: integer, source: system, description: "Amount authorized by Superintendent co-approval (0 until co-approved; required when write-off > school_year.writeoff_max_cents)" }
      - { name: status, type: enum, source: system, description: "OPEN → PAYMENT_PROMISED → RESOLVED | WRITTEN_OFF. Constraints: OPEN|PAYMENT_PROMISED|RESOLVED|WRITTEN_OFF" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SchoolYear
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /school-years/{id}/open"
        actor: Bookkeeper
        preconditions:
          - "At least one Department exists for the year (ERR_YEAR_NOT_CONFIGURABLE)"
          - "end_date > start_date"
        side_effects:
          - "status → OPEN; increments SchoolYear.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /school-years/{id}/close"
        actor: Bookkeeper
        preconditions:
          - "Every CollectionsCase under the year's accounts is in a terminal state (RESOLVED or WRITTEN_OFF) (ERR_OPEN_COLLECTIONS_CASES)"
          - "No PaymentPlan under the year's accounts is ACTIVE (ERR_ACTIVE_PAYMENT_PLANS)"
        side_effects:
          - "status → CLOSED; blocks all enrollment/assessment/payment writes for the year"
          - "increments SchoolYear.version by 1"

  - entity: Student
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN, GRADUATED]
    transitions:
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /students/{id}/withdraw"
        actor: Bookkeeper
        preconditions:
          - "Student has no account whose posture is COLLECTIONS (ERR_STUDENT_IN_COLLECTIONS)"
        side_effects:
          - "Every ACTIVE Enrollment on every StudentAccount of this student → WITHDRAWN, which itself triggers refund_proration per enrollment (depth-3 cascade: withdraw → enrollment withdrawal → refund creation)"
          - "Every COMPLETED Purchase with refundable item on this student's accounts spawns a PENDING Refund with reason WITHDRAWAL"
          - "Every ACTIVE PaymentPlan on this student's accounts → CANCELLED; its SCHEDULED/DUE installments → WAIVED_BY_DEFAULT"
          - "Posture recompute on each affected StudentAccount; increments Student.version and each affected account's version by 1"
      - from: ENROLLED
        to: GRADUATED
        trigger: "POST /students/{id}/graduate"
        actor: Bookkeeper
        preconditions:
          - "Student.grade_level == 12 (ERR_NOT_GRADUATION_CANDIDATE)"
          - "No StudentAccount of this student (current year) has posture GRADUATION_HOLD or COLLECTIONS (ERR_ACCOUNT_HOLD_BLOCKS_GRADUATION)"
        side_effects:
          - "status → GRADUATED; increments Student.version by 1"

  - entity: Offering
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "system (logical clock reaching Offering.start_date while offering is SCHEDULED; observed on POST /school-years/{id}/ops-runs or any read of the offering)"
        actor: system
        preconditions:
          - "logical clock date >= Offering.start_date"
        side_effects:
          - "status → IN_SESSION; increments Offering.version by 1"
      - from: IN_SESSION
        to: COMPLETED
        trigger: "POST /school-years/{id}/offerings/{offeringId}/complete"
        actor: Bookkeeper
        preconditions:
          - "Offering.status == IN_SESSION"
        side_effects:
          - "Every ACTIVE Enrollment on this offering → COMPLETED"
          - "increments Offering.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /school-years/{id}/offerings/{offeringId}/cancel"
        actor: Bookkeeper
        preconditions:
          - "Offering.status == SCHEDULED (a started activity cannot be cancelled, only completed)"
        side_effects:
          - "Every ACTIVE Enrollment → DROPPED_BY_CANCELLATION, each spawning a PENDING Refund with reason ACTIVITY_CANCELLATION computed at FULL rate (fee cancelled before start)"
          - "increments Offering.version by 1"
      - from: IN_SESSION
        to: CANCELLED
        trigger: "POST /school-years/{id}/offerings/{offeringId}/cancel"
        actor: Bookkeeper
        preconditions:
          - "Offering.status == IN_SESSION"
        side_effects:
          - "Every ACTIVE Enrollment → DROPPED_BY_CANCELLATION, each spawning a PENDING Refund with reason ACTIVITY_CANCELLATION computed at the proration tier for days-elapsed since Offering.start_date at cancellation time"
          - "increments Offering.version by 1"

  - entity: FeeCatalogItem
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /school-years/{id}/fee-catalog-items/{itemId}/retire"
        actor: Bookkeeper
        preconditions:
          - "No FeeAssessment references this item with status IN {ASSESSED, PARTIALLY_PAID, PAYMENT_PLAN, DELINQUENT} (ERR_FEE_ITEM_IN_USE)"
        side_effects:
          - "status → RETIRED; blocks new assessments against the item"

  - entity: Enrollment
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN, COMPLETED, DROPPED_BY_CANCELLATION]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /student-accounts/{id}/enrollments/{enrollmentId}/withdraw"
        actor: Bookkeeper
        preconditions:
          - "Enrollment.status == ACTIVE"
          - "SchoolYear.status == OPEN"
        side_effects:
          - "withdrawn_at := logical clock now"
          - "Spawns PENDING Refund (reason WITHDRAWAL) on the enrollment's FeeAssessment when the fee item is refundable; refund_cents computed by refund_proration"
          - "StudentAccount derived fields recompute (assessed/paid/balance); posture recompute; increments account version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (cascade from Offering IN_SESSION → COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DROPPED_BY_CANCELLATION
        trigger: "system (cascade from Offering → CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "Spawns PENDING Refund (reason ACTIVITY_CANCELLATION) per cancellation tier rules"

  - entity: FeeAssessment
    initial_state: ASSESSED
    terminal_states: [PAID, REFUNDED, WAIVED, VOID]
    transitions:
      - from: ASSESSED
        to: PARTIALLY_PAID
        trigger: "system (payment allocation: 0 < allocated_cents < outstanding obligation)"
        actor: system
        preconditions: []
        side_effects:
          - "StudentAccount.paid_cents / balance_cents recompute; LedgerEntry DISTRIBUTION_CREDIT rows written to the assessment's department"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system (payment allocation bringing allocated_cents + waived_amount_cents to assessed_amount_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "StudentAccount recompute; distribution ledger credit"
      - from: ASSESSED
        to: PAID
        trigger: "system (single allocation fully covering outstanding)"
        actor: system
        preconditions: []
        side_effects:
          - "StudentAccount recompute; distribution ledger credit"
      - from: ASSESSED
        to: WAIVED
        trigger: "system (waiver stacking covers 100% of assessed_amount_cents on WaiverApplication approval)"
        actor: system
        preconditions: []
        side_effects:
          - "waived_amount_cents := assessed_amount_cents; account recompute"
      - from: ASSESSED
        to: PAYMENT_PLAN
        trigger: "system (POST payment-plans covering this assessment succeeds)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_plan_id set; account recompute"
      - from: PAYMENT_PLAN
        to: PAID
        trigger: "system (final installment fully paid; allocation waterfall settles assessment)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_plan_id cleared; account recompute"
      - from: PAYMENT_PLAN
        to: DELINQUENT
        trigger: "system (plan DEFAULTED via aging sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "assessment flagged DELINQUENT; CollectionsCase opened or updated; account posture recompute"
      - from: ASSESSED
        to: DELINQUENT
        trigger: "system (aging sweep: unpaid past threshold)"
        actor: system
        preconditions: []
        side_effects:
          - "CollectionsCase opened or bucket advanced"
      - from: ASSESSED
        to: VOID
        trigger: "POST /student-accounts/{id}/fee-assessments/{assessmentId}/void"
        actor: Bookkeeper
        preconditions:
          - "allocated_cents == 0 AND refunded_cents == 0 (ERR_ASSESSMENT_HAS_ACTIVITY)"
          - "status == ASSESSED"
        side_effects:
          - "Assessment excluded from account aggregates; account recompute"
      - from: PARTIALLY_PAID
        to: REFUNDED
        trigger: "system (WITHDRAWAL/ACTIVITY_CANCELLATION refund EXECUTED against this assessment)"
        actor: system
        preconditions: []
        side_effects:
          - "allocated_cents reduced by refund_cents; refunded_cents updated; obligation collapses to retained portion; account recompute; DISTRIBUTION_REVERSAL ledger rows"
      - from: PAID
        to: REFUNDED
        trigger: "system (WITHDRAWAL/ACTIVITY_CANCELLATION refund EXECUTED against fully paid assessment)"
        actor: system
        preconditions: []
        side_effects:
          - "allocated_cents reduced by refund_cents; account recompute; DISTRIBUTION_REVERSAL ledger rows"
      - from: DELINQUENT
        to: PAID
        trigger: "system (payment allocation settling the assessment while case open)"
        actor: system
        preconditions: []
        side_effects:
          - "Linked OPEN/PAYMENT_PROMISED CollectionsCase re-evaluates; may → RESOLVED"

  - entity: Purchase
    initial_state: PENDING
    terminal_states: [COMPLETED, REFUNDED, VOID]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "system (payment covering the purchase succeeds; purchase rows are paid atomically at creation — creation immediately charges)"
        actor: system
        preconditions: []
        side_effects:
          - "OptionalPurchaseItem.sold_count += 1; LedgerEntry DISTRIBUTION_CREDIT to item's department"
      - from: COMPLETED
        to: REFUNDED
        trigger: "system (Refund with purchase_id EXECUTED)"
        actor: system
        preconditions: []
        side_effects:
          - "OptionalPurchaseItem.sold_count -= 1; DISTRIBUTION_REVERSAL ledger row"
      - from: PENDING
        to: VOID
        trigger: "system (payment for the purchase FAILED or VOIDED before completion)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WaiverApplication
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, REVOKED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /student-accounts/{id}/waiver-applications/{applicationId}/approve"
        actor: Bookkeeper
        preconditions:
          - "WaiverProgram.status == ACTIVE (ERR_WAIVER_PROGRAM_SUSPENDED)"
          - "Student.grade_level within program eligibility band (ERR_WAIVER_INELIGIBLE)"
          - "reviewed_by_user_id != submitted_by_user_id (segregation of duties: ERR_WAIVER_SELF_APPROVAL)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
          - "waiver_stacking calculation runs across the account's ASSESSED/PARTIALLY_PAID waiverable assessments; waived_amount_cents updated per assessment; assessments at 100% waiver → WAIVED"
          - "StudentAccount.waived_cents/balance_cents recompute; posture recompute"
      - from: PENDING
        to: DENIED
        trigger: "POST /student-accounts/{id}/waiver-applications/{applicationId}/deny"
        actor: Bookkeeper
        preconditions:
          - "reviewed_by_user_id != submitted_by_user_id (ERR_WAIVER_SELF_APPROVAL)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /student-accounts/{id}/waiver-applications/{applicationId}/revoke"
        actor: Bookkeeper
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_WAIVER_SELF_APPROVAL)"
        side_effects:
          - "waiver_stacking recomputed WITHOUT this program; waived amounts roll back; WAIVED assessments that lose full coverage return to ASSESSED or PARTIALLY_PAID per remaining obligation (cyclic reversal)"
          - "Account recompute; posture recompute"

  - entity: Payment
    initial_state: PENDING
    terminal_states: [SUCCEEDED, FAILED, VOIDED]
    transitions:
      - from: PENDING
        to: SUCCEEDED
        trigger: "POST /student-accounts/{id}/payments/{paymentId}/settle with outcome=SUCCEEDED"
        actor: FamilyMember
        preconditions:
          - "Payment.status == PENDING"
          - "Account posture != WRITTEN_OFF (ERR_ACCOUNT_WRITTEN_OFF)"
        side_effects:
          - "allocation_waterfall runs: INSTALLMENT_DUE stage then OLDEST_OUTSTANDING stage; PaymentAllocation rows written; FeeAssessment status transitions per coverage"
          - "LedgerEntry DISTRIBUTION_CREDIT rows per allocation to each assessment's department_id"
          - "StudentAccount paid_cents/balance_cents/family_balance_cents recompute; posture recompute (may clear GRADUATION_HOLD; may RESOLVE CollectionsCase)"
      - from: PENDING
        to: FAILED
        trigger: "POST /student-accounts/{id}/payments/{paymentId}/settle with outcome=FAILED"
        actor: FamilyMember
        preconditions:
          - "Payment.status == PENDING"
        side_effects:
          - "No allocations; no ledger writes"
      - from: PENDING
        to: VOIDED
        trigger: "POST /student-accounts/{id}/payments/{paymentId}/void"
        actor: Bookkeeper
        preconditions:
          - "Payment.status == PENDING"
        side_effects: []

  - entity: PaymentPlan
    initial_state: ACTIVE
    terminal_states: [COMPLETED, DEFAULTED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (all installments reach PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "Covered assessments transition PAYMENT_PLAN → PAID; account recompute"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (aging sweep: any installment PAST_DUE beyond grace — see collections_aging)"
        actor: system
        preconditions: []
        side_effects:
          - "Unpaid SCHEDULED/DUE/PAST_DUE installments → WAIVED_BY_DEFAULT"
          - "Covered assessments → DELINQUENT; CollectionsCase opened for the account (or bucket advanced if one exists)"
          - "Account posture recompute"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /student-accounts/{id}/payment-plans/{planId}/cancel"
        actor: Bookkeeper
        preconditions:
          - "Plan.status == ACTIVE"
          - "No installment is PAID (ERR_PLAN_HAS_PAYMENTS)"
        side_effects:
          - "Installments SCHEDULED/DUE → WAIVED_BY_DEFAULT"
          - "Covered assessments PAYMENT_PLAN → ASSESSED (obligation returns to normal waterfall)"

  - entity: PaymentPlanInstallment
    initial_state: SCHEDULED
    terminal_states: [PAID, WAIVED_BY_DEFAULT]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system (logical clock reaches due_date; observed on ops-run or account read)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: PAID
        trigger: "system (allocation waterfall fully covers this installment — early payment allowed)"
        actor: system
        preconditions: []
        side_effects:
          - "If last installment, plan → COMPLETED"
      - from: DUE
        to: PAID
        trigger: "system (allocation waterfall covers this installment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DUE
        to: PAST_DUE
        trigger: "system (aging sweep: logical clock date > due_date and paid_cents < amount_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "CollectionsCase bucket recompute"
      - from: PAST_DUE
        to: PAID
        trigger: "system (allocation waterfall covers this installment — recovery loop)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: WAIVED_BY_DEFAULT
        trigger: "system (plan DEFAULTED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DUE
        to: WAIVED_BY_DEFAULT
        trigger: "system (plan DEFAULTED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAST_DUE
        to: WAIVED_BY_DEFAULT
        trigger: "system (plan DEFAULTED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Refund
    initial_state: PENDING
    terminal_states: [EXECUTED, DENIED]
    transitions:
      - from: PENDING
        to: EXECUTED
        trigger: "POST /student-accounts/{id}/refunds/{refundId}/execute"
        actor: Bookkeeper
        preconditions:
          - "Refund.status == PENDING"
          - "refund_cents > 0 (ERR_ZERO_REFUND)"
        side_effects:
          - "Assessment-sourced refunds (WITHDRAWAL, ACTIVITY_CANCELLATION): source FeeAssessment.allocated_cents -= refund_cents; refunded_cents += refund_cents; status → REFUNDED (the obligation collapses to the retained portion = allocated_cents after reduction; assessed_cents counts REFUNDED rows at retained value)"
          - "Purchase-sourced refunds (WITHDRAWAL): Purchase → REFUNDED; OptionalPurchaseItem.sold_count -= 1"
          - "OVERPAYMENT_RETURN refunds: no assessment/purchase linkage; only account paid_cents is reduced"
          - "LedgerEntry DISTRIBUTION_REVERSAL rows against original department(s) for assessment/purchase-sourced refunds"
          - "Account paid_cents/balance_cents recompute; posture recompute"
      - from: PENDING
        to: DENIED
        trigger: "POST /student-accounts/{id}/refunds/{refundId}/deny"
        actor: Bookkeeper
        preconditions:
          - "Refund.status == PENDING"
        side_effects:
          - "No ledger or assessment changes"

  - entity: CollectionsCase
    initial_state: OPEN
    terminal_states: [RESOLVED, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: PAYMENT_PROMISED
        trigger: "POST /student-accounts/{id}/collections-cases/{caseId}/promise"
        actor: Bookkeeper
        preconditions:
          - "Case.status == OPEN"
        side_effects: []
      - from: PAYMENT_PROMISED
        to: OPEN
        trigger: "system (aging sweep finds no SUCCEEDED payment on the account since promise — broken-promise reversion loop)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: RESOLVED
        trigger: "system (account balance_cents <= 0 after payment settlement)"
        actor: system
        preconditions: []
        side_effects:
          - "Account posture recompute (COLLECTIONS clears)"
      - from: PAYMENT_PROMISED
        to: RESOLVED
        trigger: "system (account balance_cents <= 0 after payment settlement)"
        actor: system
        preconditions: []
        side_effects:
          - "Account posture recompute"
      - from: OPEN
        to: WRITTEN_OFF
        trigger: "POST /student-accounts/{id}/collections-cases/{caseId}/write-off"
        actor: Bookkeeper
        preconditions:
          - "Case.aging_bucket == BUCKET_3 (ERR_CASE_NOT_AGED)"
          - "When amount > school_year.writeoff_max_cents: case.approved_writeoff_cents >= requested amount (Superintendent co-approval required; ERR_WRITEOFF_NEEDS_APPROVAL)"
          - "Segregation of duties: write-off actor's X-User-ID must differ from the user who recorded the most recent SUCCEEDED payment on the account, when one exists (ERR_WRITEOFF_SOD)"
        side_effects:
          - "written_off_cents := amount; LedgerEntry WRITE_OFF_DEBIT row against each department with outstanding distributed cents for this account (prorated by department share of outstanding)"
          - "Account posture → WRITTEN_OFF; family_balance recompute"
          - "Assessments still DELINQUENT/ASSESSED under the case → VOID with zero-balance effect through write-off ledger (write_off_reconciliation invariant)"
      - from: PAYMENT_PROMISED
        to: WRITTEN_OFF
        trigger: "POST /student-accounts/{id}/collections-cases/{caseId}/write-off"
        actor: Bookkeeper
        preconditions:
          - "Same as OPEN → WRITTEN_OFF"
        side_effects:
          - "Same as OPEN → WRITTEN_OFF"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; serial-observable)
# =============================================================================
concurrency_rules:
  - rule_id: payment-plan-create-stale-account
    parent_entity: StudentAccount
    write_endpoint: "POST /student-accounts/{id}/payment-plans"
    occ_field: "expected_account_version"
    description: |
      Creating a PaymentPlan against a StudentAccount whose version has
      advanced since the client last observed it is rejected. The canonical
      case: a waiver approval or a payment settlement has just recomputed the
      account's covered outstanding set, so the new plan's covered_amount_cents
      derived from the client's stale view would be wrong.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: waiver-approve-stale-account
    parent_entity: StudentAccount
    write_endpoint: "POST /student-accounts/{id}/waiver-applications/{applicationId}/approve"
    occ_field: "expected_account_version"
    description: |
      Approving a WaiverApplication against a StudentAccount whose version has
      advanced since the reviewer last observed it is rejected — the waiver
      stacking base (set of ASSESSED/PARTIALLY_PAID assessments) may have
      changed under the reviewer.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: year-close-stale-year
    parent_entity: SchoolYear
    write_endpoint: "POST /school-years/{id}/close"
    occ_field: "expected_year_version"
    description: |
      Closing a SchoolYear whose version has advanced since the closer last
      observed it is rejected — a new CollectionsCase or PaymentPlan may have
      appeared, invalidating the close preconditions the closer verified.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: waiver_stacking
    trigger: "WaiverApplication approval or revocation; also re-evaluated when a new FeeAssessment is created on an account holding APPROVED applications (automatic application)"
    algorithm: waterfall_allocation
    formula: |
      Let P = approved waiver programs for the account, sorted by
      stacking_priority ASC, ties by program created_at ASC.
      For each waiverable assessment A (status IN {ASSESSED, PARTIALLY_PAID}):
        base = A.assessed_amount_cents - A.allocated_cents  # waive against unpaid remainder
        remaining_base = base
        for p in P (in sorted order):
          if A.fee_item.waiverable == false: skip
          already_waived_by_p = waived portions recorded for (A, p) — on
            recompute, each program's contribution is recomputed from scratch
            and differences are applied as deltas.
          p_remaining_cap = p.max_waived_per_student_cents - sum of p's waived
            cents across OTHER assessments of this account (chronological by
            assessment created_at ASC; an assessment that was created earlier
            consumes cap first)
          w = floor(remaining_base * p.waiver_pct_bp / 10000)
          w = min(w, p_remaining_cap, remaining_base)
          A.waived_amount_cents += w ; remaining_base -= w
      Precision note: per-program truncation (floor) is applied BEFORE the cap
      min() — pinned rounding order; the alternative (cap first then floor)
      produces different cents.
    constants:
      BP_DENOMINATOR: 10000
    precision: "integer cents; floor per program application; rounding order pinned: floor-then-cap"
    variants:
      - name: provisional_stacking
        when: "New assessment created on account with existing APPROVED applications"
        difference: "Computes waiver against assessed_amount_cents in full (allocated_cents == 0 at creation); if a payment settles before recomputation, the waived base differs from the post-payment base — final stacking recomputed on next approval/revoke event"
      - name: final_stacking
        when: "Approval or revoke events"
        difference: "Recomputes all programs' contributions from scratch against current unpaid remainders"

  - name: refund_proration
    trigger: "Enrollment withdrawal or offering cancellation producing a fee refund"
    algorithm: threshold
    formula: |
      days_elapsed = (logical_clock_date - Offering.start_date) in whole days,
        floor; for SCHEDULED offering cancellations, days_elapsed := 0.
      paid_toward = assessment.allocated_cents (cents actually collected)
      if fee_item.refundable == false: refund_cents = 0
      elif days_elapsed <= school_year.refund_full_days: tier = FULL
      elif days_elapsed <= school_year.refund_partial_days: tier = PARTIAL
      else: tier = NONE
      FULL:    refund_cents = paid_toward
      PARTIAL: refund_cents = floor(paid_toward * partial_refund_pct_bp / 10000)
      NONE:    refund_cents = 0
      Boundary is INCLUSIVE at both tier edges (<=). Waived portions are never
      refunded — only collected cents.
    constants: {}
    precision: "integer cents; floor"
    variants:
      - name: withdrawal_variant
        when: "reason == WITHDRAWAL (student-initiated)"
        difference: "days_elapsed measured at withdrawal date; refunds only when the withdrawal happens while Enrollment is ACTIVE"
      - name: cancellation_variant
        when: "reason == ACTIVITY_CANCELLATION (school-initiated)"
        difference: "SCHEDULED offering ⇒ tier := FULL regardless of date; IN_SESSION offering ⇒ proration tiers measured at cancellation date"

  - name: allocation_waterfall
    trigger: "Payment settle with outcome=SUCCEEDED"
    algorithm: waterfall_allocation
    formula: |
      remaining = payment.amount_cents
      Stage 1 — INSTALLMENT_DUE: if account has ACTIVE PaymentPlan, iterate its
        installments ordered by due_date ASC, then sequence ASC; for each
        installment with paid_cents < amount_cents:
          take = min(remaining, installment.amount_cents - installment.paid_cents)
          allocate take to the plan's covered assessments proportionally to
            their outstanding at plan-creation (creation-time snapshot weights;
            per-assessment rows rounded half_up to cents; remainder cent
            assigned to the covered assessment with the earliest created_at)
          installment.paid_cents += take ; remaining -= take
      Stage 2 — OLDEST_OUTSTANDING: iterate account's FeeAssessments with
        outstanding_cents > 0 and status IN {ASSESSED, PARTIALLY_PAID,
        DELINQUENT} (plan-covered assessments in PAYMENT_PLAN status are ONLY
        reachable via Stage 1) ordered by created_at ASC, tie by
        assessed_amount_cents DESC, tie by assessment created_at ASC is the
        final order (ids never used):
          take = min(remaining, outstanding_cents)
          write PaymentAllocation(rule=OLDEST_OUTSTANDING, take)
          remaining -= take
      Stage 3 — OVERPAYMENT: if remaining > 0:
          overpayment_policy == REJECT (pre-check): reject the whole settle
            with ERR_OVERPAYMENT_REJECTED when amount_cents > allocatable
          else: leave remaining unallocated — it flows into balance_cents as a
            negative (credit) via paid_cents recompute
      Stage-1 pre-check: when overpayment_policy == REJECT, the allocatable
        ceiling = Stage1-capacity + Stage2-outstanding; the settle is rejected
        BEFORE any allocation rows are written (atomicity).
    constants: {}
    precision: "integer cents; half_up on proportional split; remainder to earliest-created covered assessment"

  - name: installment_schedule
    trigger: "PaymentPlan creation"
    algorithm: aggregation
    formula: |
      covered = account FeeAssessments with status IN {ASSESSED, PARTIALLY_PAID}
        and outstanding_cents > 0, ordered by created_at ASC — ALL of them are
        covered (plan covers the account's full outstanding; no cherry-picking)
      covered_amount_cents = sum(outstanding_cents over covered)
      base = floor(covered_amount_cents / installment_count)
      remainder = covered_amount_cents - base * installment_count
      installment i (1..count): amount_cents = base; LAST installment
        amount_cents = base + remainder   # remainder pinned to LAST, not first
      due_date(i) = first_due_date + (i-1) * interval_days
    constants: {}
    precision: "integer cents; floor division; remainder on last installment"

  - name: collections_aging
    trigger: "POST /school-years/{id}/ops-runs (aging sweep over OPEN/PAYMENT_PROMISED cases and unpaid assessments/plans)"
    algorithm: chronological
    formula: |
      For each CollectionsCase with status IN {OPEN, PAYMENT_PROMISED}:
        age_days = floor((logical_clock_date - case.opened_at) in days)
        k = school_year.aging_interval_days
        bucket = CURRENT        if age_days <  k
               = BUCKET_1       if k <= age_days < 2k
               = BUCKET_2       if 2k <= age_days < 3k
               = BUCKET_3       if age_days >= 3k
        (boundary: >= on lower edge, strict < on upper edge)
      Sweep side-effects (ordered):
        1. PaymentPlanInstallment DUE with logical date > due_date → PAST_DUE
        2. PaymentPlan ACTIVE with ANY installment PAST_DUE for more than
           k days past its due_date → DEFAULTED (cascade per state machine)
        3. FeeAssessment ASSESSED/PARTIALLY_PAID with created_at older than
           k days and outstanding > 0 → DELINQUENT; opens a CollectionsCase
           (principal = balance owed) when none OPEN exists for the account
        4. PAYMENT_PROMISED case with no SUCCEEDED payment created_at >
           promise timestamp → reverts to OPEN (broken promise)
    constants: {}
    precision: "whole days, floor; boundaries pinned >= lower / < upper"

  - name: posture_recompute
    trigger: "Any mutation of account-level aggregates (assessment create/void, waiver apply/revoke, payment settle, refund execute, write-off, aging sweep)"
    algorithm: threshold
    formula: |
      owed = account.balance_cents   (positive = family owes)
      if account has CollectionsCase with status == WRITTEN_OFF:
        posture = WRITTEN_OFF
      elif account has CollectionsCase with status IN {OPEN, PAYMENT_PROMISED}:
        posture = COLLECTIONS
      elif owed > school_year.graduation_hold_threshold_cents:
        posture = GRADUATION_HOLD     # boundary: strictly greater
      else:
        posture = CLEAR
      last_posture_check_at := logical clock now
    constants: {}
    precision: "integer cents; strict > boundary"

  - name: department_distribution
    trigger: "Payment allocation writes (Stage 1 / Stage 2), refund execution, write-off"
    algorithm: aggregation
    formula: |
      On PaymentAllocation row of X cents to assessment A:
        LedgerEntry(entry_type=DISTRIBUTION_CREDIT, amount_cents=X,
                    department_id=A.department_id, source_payment_id=payment)
      On Refund EXECUTED of R cents against assessment A:
        LedgerEntry(entry_type=DISTRIBUTION_REVERSAL, amount_cents=-R,
                    department_id=A.department_id)
      On write-off of W cents: prorate W across departments by their share of
        the account's outstanding (floor per department; remainder cent to the
        department whose LedgerEntry for this account has earliest created_at)
      department.distributed_cents = sum(DISTRIBUTION_CREDIT) + sum(DISTRIBUTION_REVERSAL) [reversals negative]
    constants: {}
    precision: "integer cents"

  - name: family_balance
    trigger: "Any account aggregate recompute for any student sharing family_id"
    algorithm: aggregation
    formula: |
      account.family_balance_cents = sum(balance_cents) over StudentAccounts
        whose student's family_id == this student's family_id AND whose
        school_year.status == OPEN
      Computed identically for every sibling account — every member of the
        family reports the same family total.
    constants: {}
    precision: "integer cents"

  - name: write_off_reconciliation
    trigger: "POST reconciliation-runs"
    algorithm: aggregation
    formula: |
      For each LedgerEntry L with reconciliation_run_id == null:
        L.reconciliation_run_id := this run
      For each Department d in the year:
        expected_d = (sum of PaymentAllocation.allocated_cents over SUCCEEDED
          payments targeting assessments with department_id == d [gross,
          immutable rows])
          + (sum of Purchase.amount_cents over Purchase rows with status IN
             {COMPLETED, REFUNDED} on items of department d)
          - (sum of Refund.refund_cents over EXECUTED refunds sourced from
             department d's assessments or purchases)
          - (sum of WRITE_OFF_DEBIT cents against d)
        actual_d = d.distributed_cents (ledger-derived)
        drift_detected |= (expected_d != actual_d)
        d.reconciled_cents := actual_d ; d.unreconciled_cents recomputed
      INVARIANT (compensating): for the whole year,
        sum(department.distributed_cents)
          == sum(PaymentAllocation.allocated_cents over SUCCEEDED payments)
             + sum(Purchase.amount_cents over COMPLETED/REFUNDED purchases)
             - sum(Refund.refund_cents over EXECUTED refunds)
             - sum(CollectionsCase.written_off_cents)
        must hold exactly after every mutation; a reconciliation run reports
        drift_detected=true when violated.
    constants: {}
    precision: "integer cents"

  - name: purchase_charge
    trigger: "Purchase creation"
    algorithm: aggregation
    formula: |
      Purchase pins item.amount_cents at creation and is charged atomically:
      the Purchase row is created directly in COMPLETED status, a
      LedgerEntry(DISTRIBUTION_CREDIT, amount_cents, item.department_id) is
      written, and OptionalPurchaseItem.sold_count increments.
      Purchases are NOT FeeAssessments and NEVER enter assessed_cents,
      paid_cents, or balance_cents — the fee ledger and the purchase ledger
      are disjoint; purchase refunds write DISTRIBUTION_REVERSAL and decrement
      sold_count without touching account balance math.
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role must be permitted for the endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids must exist, validated left-to-right (year, account, then leaf resource)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Body-referenced ids must exist and belong to the same school year scope (offering_id, fee_item_id, department_id, waiver_program_id, item_id)"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with FK body fields"
  - priority: 5
    category: state
    check: "SchoolYear.status must be OPEN for any enrollment/assessment/purchase/payment/plan write under the year"
    error_id: ERR_YEAR_NOT_OPEN
    http_status: 409
    applies_to: "write endpoints nested under /school-years/{id} and account-scoped writes"
  - priority: 6
    category: state
    check: "Target resource must be in the from-state required by its state machine"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_constraint
    check: "Request shape: required fields present, enums valid, integers in range (amount_cents > 0, end_date > start_date, refund_partial_days > refund_full_days, pct in 0..10000, capacity >= 1)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 8
    category: business_referential
    check: "Enrollment uniqueness: no second ACTIVE Enrollment for the same (student_account_id, offering_id)"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /student-accounts/{id}/enrollments"
  - priority: 9
    category: business_referential
    check: "Offering capacity: count of ACTIVE Enrollments on the offering must be < capacity"
    error_id: ERR_OFFERING_FULL
    http_status: 409
    applies_to: "POST /student-accounts/{id}/enrollments"
  - priority: 10
    category: business_temporal
    check: "Enrollment window: offering.status must be SCHEDULED (cannot join IN_SESSION/COMPLETED/CANCELLED offerings)"
    error_id: ERR_ENROLLMENT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /student-accounts/{id}/enrollments"
  - priority: 11
    category: business_temporal
    check: "Enrollment schedule conflict: target offering's half-open window [start_date, end_date) must not intersect the half-open window of any other offering with an ACTIVE enrollment on the same account; shared endpoint date (B.start == A.end) does NOT collide"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /student-accounts/{id}/enrollments"
  - priority: 12
    category: business_temporal
    check: "SchoolYear date-range overlap: new year's [start_date, end_date] must not intersect any existing non-CLOSED year's range under CLOSED-interval semantics — a shared endpoint date (new.start == existing.end) DOES collide"
    error_id: ERR_YEAR_OVERLAP
    http_status: 409
    applies_to: "POST /school-years"
  - priority: 13
    category: business_safety
    check: "Segregation of duties on waiver review: X-User-ID != WaiverApplication.submitted_by_user_id"
    error_id: ERR_WAIVER_SELF_APPROVAL
    http_status: 403
    applies_to: "waiver-applications approve/deny/revoke"
  - priority: 14
    category: business_safety
    check: "Waiver eligibility: program ACTIVE and student grade within [eligibility_grade_min, eligibility_grade_max]"
    error_id: ERR_WAIVER_INELIGIBLE
    http_status: 422
    applies_to: "waiver-applications approve"
  - priority: 15
    category: business_fiscal
    check: "Payment idempotency: idempotency_key must be unique per account among non-FAILED payments"
    error_id: ERR_DUPLICATE_PAYMENT
    http_status: 409
    applies_to: "POST /student-accounts/{id}/payments"
  - priority: 16
    category: business_fiscal
    check: "Overpayment policy REJECT: settle amount must not exceed allocatable capacity"
    error_id: ERR_OVERPAYMENT_REJECTED
    http_status: 402
    applies_to: "POST /student-accounts/{id}/payments/{paymentId}/settle"
  - priority: 17
    category: business_fiscal
    check: "Payment plan floor: covered outstanding >= school_year.payment_plan_min_cents and installment_count within [2, payment_plan_max_installments]"
    error_id: ERR_PLAN_TERMS_VIOLATION
    http_status: 422
    applies_to: "POST /student-accounts/{id}/payment-plans"
  - priority: 18
    category: business_fiscal
    check: "Purchase inventory: OptionalPurchaseItem.sold_count < inventory_cap"
    error_id: ERR_ITEM_SOLD_OUT
    http_status: 409
    applies_to: "POST /student-accounts/{id}/purchases"
  - priority: 19
    category: business_safety
    check: "Graduation gate: no account of the student may hold posture GRADUATION_HOLD or COLLECTIONS"
    error_id: ERR_ACCOUNT_HOLD_BLOCKS_GRADUATION
    http_status: 409
    applies_to: "POST /students/{id}/graduate"
  - priority: 20
    category: business_fiscal
    check: "Write-off aging gate: case aging_bucket must be BUCKET_3"
    error_id: ERR_CASE_NOT_AGED
    http_status: 409
    applies_to: "POST /student-accounts/{id}/collections-cases/{caseId}/write-off"
  - priority: 21
    category: business_fiscal
    check: "Write-off governance: amount above school_year.writeoff_max_cents requires approved_writeoff_cents coverage"
    error_id: ERR_WRITEOFF_NEEDS_APPROVAL
    http_status: 403
    applies_to: "POST /student-accounts/{id}/collections-cases/{caseId}/write-off"
  - priority: 22
    category: business_safety
    check: "Write-off segregation of duties: actor differs from recorder of most recent SUCCEEDED payment on the account"
    error_id: ERR_WRITEOFF_SOD
    http_status: 403
    applies_to: "POST /student-accounts/{id}/collections-cases/{caseId}/write-off"
  - priority: 23
    category: state
    check: "OCC: expected_*_version must equal current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "concurrency-guarded write endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server default before any call is exactly 2026-08-01T00:00:00Z (never wall-clock)."
    roles: [Bookkeeper]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string }"
    side_effects: ["Lazy system transitions observe the new clock on next read/ops-run"]

  # --- SchoolYear ---
  - method: POST
    path: "/school-years"
    description: "Create a school year (DRAFT)"
    roles: [Bookkeeper]
    code: 201
    input: [label, start_date, end_date, refund_full_days, refund_partial_days, partial_refund_pct_bp, payment_plan_min_cents, payment_plan_max_installments, writeoff_max_cents, aging_interval_days, graduation_hold_threshold_cents]
    output: SchoolYear
    side_effects: []
  - method: GET
    path: "/school-years"
    description: "List school years"
    roles: [Bookkeeper, FamilyMember, Superintendent]
    code: 200
    input: ["limit?", "offset?"]
    output: "SchoolYear[]"
    side_effects: []
  - method: GET
    path: "/school-years/{id}"
    description: "Get a school year"
    roles: [Bookkeeper, FamilyMember, Superintendent]
    code: 200
    input: []
    output: SchoolYear
    side_effects: []
  - method: POST
    path: "/school-years/{id}/open"
    description: "Open a DRAFT year"
    roles: [Bookkeeper]
    code: 200
    input: []
    output: SchoolYear
    side_effects: ["status → OPEN", "increments SchoolYear.version by 1"]
  - method: POST
    path: "/school-years/{id}/close"
    description: "Close an OPEN year (OCC-guarded)"
    roles: [Bookkeeper]
    code: 200
    input: [expected_year_version]
    output: SchoolYear
    side_effects: ["status → CLOSED", "increments SchoolYear.version by 1"]
  - method: POST
    path: "/school-years/{id}/ops-runs"
    description: "Run the aging/posture sweep for the year (collections_aging, installment transitions, clock-driven offering transitions)"
    roles: [Bookkeeper]
    code: 200
    input: []
    output: "{ swept_cases: integer, defaulted_plans: integer, advanced_installments: integer, opened_cases: integer }"
    side_effects: ["collections_aging sweep", "installment DUE/PAST_DUE transitions", "plan DEFAULTED cascades", "SCHEDULED offerings whose start_date has passed → IN_SESSION"]

  # --- Department ---
  - method: POST
    path: "/school-years/{id}/departments"
    description: "Create a department"
    roles: [Bookkeeper]
    code: 201
    input: [code, name]
    output: Department
    side_effects: []
  - method: GET
    path: "/school-years/{id}/departments"
    description: "List departments for a year"
    roles: [Bookkeeper, FamilyMember, Superintendent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Department[]"
    side_effects: []
  - method: GET
    path: "/school-years/{id}/departments/{departmentId}"
    description: "Get a department"
    roles: [Bookkeeper, FamilyMember, Superintendent]
    code: 200
    input: []
    output: Department
    side_effects: []

  # --- FeeCatalogItem ---
  - method: POST
    path: "/school-years/{id}/fee-catalog-items"
