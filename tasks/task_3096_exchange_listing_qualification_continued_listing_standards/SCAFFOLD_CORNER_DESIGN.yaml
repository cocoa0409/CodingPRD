# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Task: task_3096_exchange_listing_qualification_continued_listing_standards
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# covers appear as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: issuer_create_returns_every_declared_field_and_starts_pre_listing
        claim_type: Creation
        grounds:
          - entities.Issuer
          - endpoints.POST_/issuers
        distinguishing_aspect: "An issuer created with only legal_name and ticker_symbol returns 201 with status PRE_LISTING, version 1, and system-minted id / created_at / updated_at — status and version are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ListingAnalyst
          trigger:
            - &c_issuer
              call: "POST /issuers"
              payload: { legal_name: "Corner Creation Corp", ticker_symbol: "CCRT" }
              as: ListingAnalyst
              captures: { issuer_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Issuer.${issuer_id}.legal_name == \"Corner Creation Corp\" and ticker_symbol == \"CCRT\""
            - "Issuer.${issuer_id}.status == PRE_LISTING and version == 1"
            - "the response data carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: issuer_get_returns_stored_fields_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Issuer
          - endpoints.GET_/issuers/{issuerId}
        distinguishing_aspect: "GET round-trips the stored issuer exactly as posted; a GET by any permitted role sees the same row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One issuer registered."
          setup_api_calls:
            - *c_clock
            - *c_issuer
          trigger:
            - call: "GET /issuers/${issuer_id}"
              payload: {}
              as: FinanceOfficer
          assert:
            - "the response status is 200"
            - "Issuer.${issuer_id}.legal_name == \"Corner Creation Corp\" and ticker_symbol == \"CCRT\" and status == PRE_LISTING"

      - name: issuers_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/issuers
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three issuers on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the remaining 1 row with has_more false; status filter narrows the counted set."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Three issuers registered, all PRE_LISTING."
          setup_api_calls:
            - *c_clock
            - *c_issuer
            - call: "POST /issuers"
              payload: { legal_name: "Second Corner Corp", ticker_symbol: "CRN2" }
              as: ListingAnalyst
            - call: "POST /issuers"
              payload: { legal_name: "Third Corner Corp", ticker_symbol: "CRN3" }
              as: ListingAnalyst
          trigger:
            - call: "GET /issuers"
              payload: { limit: 2, offset: 0 }
              as: ListingAnalyst
          assert:
            - "the response status is 200 and response_type is array"
            - "the page carries exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /issuers with limit 2 and offset 2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /issuers with status PRE_LISTING returns 3 rows; with status LISTED returns 0 rows"
            - "GET /issuers with no query parameters returns 3 rows under the default limit 10 and offset 0"

      - name: issuer_get_unknown_id_returns_issuer_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/issuers/{issuerId}
          - errors.ERR_ISSUER_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated issuer id produces the entity-specific 404 ERR_ISSUER_NOT_FOUND, not a generic error and not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /issuers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ListingAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_ISSUER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: application_create_missing_audit_committee_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ListingApplication.fields.audit_committee
          - validations[priority=19]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "audit_committee is a required input with no default; omitting it entirely is a 400 ERR_INVALID_REQUEST from the schema check at priority 19 — not the 422 ERR_GOVERNANCE_COMPOSITION that a present-but-defective committee produces at priority 7."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One issuer registered."
          setup_api_calls:
            - *c_clock
            - *c_issuer
          trigger:
            - call: "POST /issuers/${issuer_id}/listing-applications"
              payload: { target_tier: "CAPITAL", board_directors: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }, { director_name: "D3", is_independent: true }], compensation_committee: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }], stockholders_equity_cents: 1000000000, market_value_listed_securities_cents: 600000000000, market_value_unrestricted_publicly_held_cents: 500000000, total_revenue_cents: 1000000000, income_from_continuing_operations_cents: 100000000, bid_price_cents: 500, publicly_held_shares: 2000000, unrestricted_publicly_held_shares: 2000000, round_lot_holders: 400, total_shareholders: 400, market_makers: 4, operating_history_months: 60 }
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_GOVERNANCE_COMPOSITION"
            - "GET /issuers/${issuer_id}/listing-applications returns 0 rows"

      - name: application_create_defaults_is_transfer_and_kind
        claim_type: Defaults
        grounds:
          - entities.ListingApplication.fields.is_transfer_from_exchange
          - entities.ListingApplication.fields.application_kind
        distinguishing_aspect: "Omitting is_transfer_from_exchange and application_kind stores false and INITIAL respectively — defaults are applied at creation, visible on the response."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One issuer registered."
          setup_api_calls:
            - *c_clock
            - *c_issuer
          trigger:
            - call: "POST /issuers/${issuer_id}/listing-applications"
              payload: { target_tier: "CAPITAL", board_directors: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }, { director_name: "D3", is_independent: true }], audit_committee: [{ director_name: "D1", is_independent: true, is_financial_expert: true }, { director_name: "D2", is_independent: true, is_financial_expert: false }, { director_name: "D3", is_independent: true, is_financial_expert: false }], compensation_committee: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }], stockholders_equity_cents: 1000000000, market_value_listed_securities_cents: 600000000000, market_value_unrestricted_publicly_held_cents: 500000000, total_revenue_cents: 1000000000, income_from_continuing_operations_cents: 100000000, bid_price_cents: 500, publicly_held_shares: 2000000, unrestricted_publicly_held_shares: 2000000, round_lot_holders: 400, total_shareholders: 400, market_makers: 4, operating_history_months: 60 }
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
              captures: { app_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ListingApplication.${app_id}.is_transfer_from_exchange == false"
            - "ListingApplication.${app_id}.application_kind == INITIAL"
            - "ListingApplication.${app_id}.status == DRAFT and version == 1"

      - name: listing_tier_is_computed_from_approving_application
        claim_type: Computed Fields
        grounds:
          - entities.Listing.fields.tier
          - state_machines.ListingApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Listing.tier is never client input — it is seeded from the approving application's target_tier at approval; a CAPITAL-targeted application produces a tier == CAPITAL listing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer with a submitted CAPITAL application that passes A1 (equity 1000000000 >= 500000000)."
          setup_api_calls:
            - *c_clock
            - *c_issuer
            - &c_app_capital
              call: "POST /issuers/${issuer_id}/listing-applications"
              payload: { target_tier: "CAPITAL", board_directors: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }, { director_name: "D3", is_independent: true }], audit_committee: [{ director_name: "D1", is_independent: true, is_financial_expert: true }, { director_name: "D2", is_independent: true, is_financial_expert: false }, { director_name: "D3", is_independent: true, is_financial_expert: false }], compensation_committee: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }], stockholders_equity_cents: 1000000000, market_value_listed_securities_cents: 600000000000, market_value_unrestricted_publicly_held_cents: 500000000, total_revenue_cents: 1000000000, income_from_continuing_operations_cents: 100000000, bid_price_cents: 500, publicly_held_shares: 2000000, unrestricted_publicly_held_shares: 2000000, round_lot_holders: 400, total_shareholders: 400, market_makers: 4, operating_history_months: 60 }
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
              captures: { app_id: $.data.id }
            - &c_submit
              call: "POST /issuers/${issuer_id}/listing-applications/${app_id}/submit"
              payload: {}
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
            - &c_gv
              call: "GET /issuers/${issuer_id}"
              payload: {}
              as: ListingAnalyst
              captures: { issuer_v: $.data.version }
          trigger:
            - &c_approve
              call: "POST /issuers/${issuer_id}/listing-applications/${app_id}/approve"
              payload: { expected_issuer_version: "${issuer_v}" }
              as: ListingAnalyst
            - &c_listings
              call: "GET /issuers/${issuer_id}/listings"
              payload: {}
              as: ListingAnalyst
              captures: { listing_id: "$.data[0].id" }
          assert:
            - "exactly 1 listing exists for the issuer"
            - "Listing.${listing_id}.tier == CAPITAL and status == ACTIVE"
            - "Listing.${listing_id}.application_id == ${app_id}"
            - "Issuer.${issuer_id}.status == LISTED"

      - name: application_create_extra_status_field_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.ListingApplication.fields.status
          - endpoints.POST_/issuers/{issuerId}/listing-applications
        distinguishing_aspect: "ListingApplication.status is source system; a client that sends status APPROVED (a field the endpoint does not declare as input) is ignored — the row is created DRAFT with version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One issuer registered."
          setup_api_calls:
            - *c_clock
            - *c_issuer
          trigger:
            - call: "POST /issuers/${issuer_id}/listing-applications"
              payload: { target_tier: "CAPITAL", status: "APPROVED", version: 99, board_directors: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }, { director_name: "D3", is_independent: true }], audit_committee: [{ director_name: "D1", is_independent: true, is_financial_expert: true }, { director_name: "D2", is_independent: true, is_financial_expert: false }, { director_name: "D3", is_independent: true, is_financial_expert: false }], compensation_committee: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }], stockholders_equity_cents: 1000000000, market_value_listed_securities_cents: 600000000000, market_value_unrestricted_publicly_held_cents: 500000000, total_revenue_cents: 1000000000, income_from_continuing_operations_cents: 100000000, bid_price_cents: 500, publicly_held_shares: 2000000, unrestricted_publicly_held_shares: 2000000, round_lot_holders: 400, total_shareholders: 400, market_makers: 4, operating_history_months: 60 }
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
              captures: { app_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ListingApplication.${app_id}.status == DRAFT (client-supplied APPROVED ignored)"
            - "ListingApplication.${app_id}.version == 1 (client-supplied 99 ignored)"

      - name: application_create_out_of_enum_target_tier_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.ListingApplication.fields.target_tier
          - validations[priority=19]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "target_tier is a closed enum {GLOBAL_SELECT, GLOBAL, CAPITAL}; MAIN_MARKET is rejected with 400 ERR_INVALID_REQUEST rather than coerced."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One issuer registered."
          setup_api_calls:
            - *c_clock
            - *c_issuer
          trigger:
            - call: "POST /issuers/${issuer_id}/listing-applications"
              payload: { target_tier: "MAIN_MARKET", board_directors: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }, { director_name: "D3", is_independent: true }], audit_committee: [{ director_name: "D1", is_independent: true, is_financial_expert: true }, { director_name: "D2", is_independent: true, is_financial_expert: false }, { director_name: "D3", is_independent: true, is_financial_expert: false }], compensation_committee: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }], stockholders_equity_cents: 1000000000, market_value_listed_securities_cents: 600000000000, market_value_unrestricted_publicly_held_cents: 500000000, total_revenue_cents: 1000000000, income_from_continuing_operations_cents: 100000000, bid_price_cents: 500, publicly_held_shares: 2000000, unrestricted_publicly_held_shares: 2000000, round_lot_holders: 400, total_shareholders: 400, market_makers: 4, operating_history_months: 60 }
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /issuers/${issuer_id}/listing-applications returns 0 rows"

      - name: snapshot_create_with_denominator_one_split_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.CorporateAction.fields.split_ratio_denominator
          - validations[priority=19]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "split_ratio_denominator declares >= 2; a 1-for-1 'reverse split' is a range violation rejected at priority 19 with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One issuer registered."
          setup_api_calls:
            - *c_clock
            - *c_issuer
          trigger:
            - call: "POST /issuers/${issuer_id}/corporate-actions"
              payload: { action_type: "REVERSE_SPLIT", split_ratio_denominator: 1 }
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /issuers/${issuer_id}/corporate-actions returns 0 rows"

      - name: market_data_snapshot_is_immutable_no_update_path
        claim_type: Immutability
        grounds:
          - entities.MarketDataSnapshot
          - complexity_profile.entity_topology
        distinguishing_aspect: "MarketDataSnapshot declares common_fields false (id + created_at only, no version / updated_at) and §1.5 exposes no PUT/PATCH/DELETE for it — the observation log is append-only; the only writes are POST create."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One issuer with one snapshot for 2026-09-01."
          setup_api_calls:
            - *c_clock
            - *c_issuer
            - call: "POST /issuers/${issuer_id}/market-data-snapshots"
              payload: { trade_date: "2026-09-01", closing_bid_cents: 150, market_value_publicly_held_cents: 500000000, market_value_listed_securities_cents: 600000000000, round_lot_holders: 400, total_shareholders: 400 }
              as: ListingAnalyst
              captures: { snap_id: $.data.id }
          trigger:
            - call: "GET /issuers/${issuer_id}/market-data-snapshots"
              payload: {}
              as: ListingAnalyst
          assert:
            - "the list contains exactly 1 row and MarketDataSnapshot.${snap_id} carries id and created_at but no version field"
            - "the row's closing_bid_cents == 150 and cannot be altered through any declared endpoint"
            - "GET /issuers/${issuer_id}/market-data-snapshots supports only the list form — there is no snapshot mutation endpoint in §1.5"

      - name: nested_application_under_unknown_issuer_returns_issuer_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=3]
          - endpoints.GET_/issuers/{issuerId}/listing-applications/{applicationId}
          - errors.ERR_ISSUER_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The hybrid topology nests applications under issuers; path ids validate left-to-right, so an unknown issuerId 404s as ERR_ISSUER_NOT_FOUND even when the applicationId is equally unknown."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /issuers/00000000-0000-4000-8000-000000000001/listing-applications/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ListingAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_ISSUER_NOT_FOUND"
            - "error_id != ERR_APPLICATION_NOT_FOUND — the left-to-right existence walk stops at the issuer segment"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: second_submit_on_submitted_application_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ListingApplication.DRAFT_to_SUBMITTED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Submit is a DRAFT-only transition; re-submitting a SUBMITTED application fails 409 ERR_INVALID_STATE and does not re-run governance or tier evaluation (evaluated_standards unchanged)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer with one application already SUBMITTED."
          setup_api_calls:
            - *c_clock
            - *c_issuer
            - *c_app_capital
            - *c_submit
          trigger:
            - call: "POST /issuers/${issuer_id}/listing-applications/${app_id}/submit"
              payload: {}
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "ListingApplication.${app_id}.status == SUBMITTED (unchanged)"

      - name: approve_already_approved_application_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ListingApplication.SUBMITTED_to_APPROVED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "APPROVED is terminal; a second approve with the now-current issuer version still fails 409 ERR_INVALID_STATE — OCC is not the gate here, the terminal state is."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer LISTED with its application APPROVED."
          setup_api_calls:
            - *c_clock
            - *c_issuer
            - *c_app_capital
            - *c_submit
            - *c_gv
            - *c_approve
          trigger:
            - call: "GET /issuers/${issuer_id}"
              payload: {}
              as: ListingAnalyst
              captures: { issuer_v2: $.data.version }
            - call: "POST /issuers/${issuer_id}/listing-applications/${app_id}/approve"
              payload: { expected_issuer_version: "${issuer_v2}" }
              as: ListingAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "ListingApplication.${app_id}.status == APPROVED (terminal, unchanged)"
            - "GET /issuers/${issuer_id}/listings still returns exactly 1 row — no second listing was minted"

      - name: application_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.ListingApplication.DRAFT_to_SUBMITTED
          - entities.ListingApplication.fields.status
        distinguishing_aspect: "A freshly created application reads DRAFT before any transition endpoint is called."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One issuer registered."
          setup_api_calls:
            - *c_clock
            - *c_issuer
          trigger:
            - *c_app_capital
          assert:
            - "ListingApplication.${app_id}.status == DRAFT immediately after creation"
            - "ListingApplication.${app_id}.evaluated_standards is empty (evaluation only runs at submit)"

      - name: mark_paid_from_pending_fee_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.FeeAssessment.INVOICED_to_PAID
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Fee transitions are INVOICED-only; an ENTRY fee row that somehow remains PENDING cannot be marked paid — and in practice the PENDING window is unobservable because creation invoices immediately, so the assertion runs against a PAID row re-payment instead: the second mark-paid on a PAID fee fails 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer LISTED on CAPITAL; its ENTRY fee is INVOICED and then PAID."
          setup_api_calls:
            - *c_clock
            - *c_issuer
            - *c_app_capital
            - *c_submit
            - *c_gv
            - *c_approve
            - &c_entry_fee
              call: "GET /issuers/${issuer_id}/fee-assessments"
              payload: { fee_kind: "ENTRY" }
              as: FinanceOfficer
              captures: { fee_id: "$.data[0].id" }
            - call: "POST /issuers/${issuer_id}/fee-assessments/${fee_id}/mark-paid"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /issuers/${issuer_id}/fee-assessments/${fee_id}/mark-paid"
              payload: {}
              as: FinanceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "FeeAssessment.${fee_id}.status == PAID (terminal, unchanged)"

      - name: waive_paid_fee_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.FeeAssessment.INVOICED_to_WAIVED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "PAID is terminal for FeeAssessment; waiving a paid fee fails 409 ERR_INVALID_STATE with no status change."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer LISTED on CAPITAL; ENTRY fee PAID."
          setup_api_calls:
            - *c_clock
            - *c_issuer
            - *c_app_capital
            - *c_submit
            - *c_gv
            - *c_approve
            - *c_entry_fee
            - call: "POST /issuers/${issuer_id}/fee-assessments/${fee_id}/mark-paid"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /issuers/${issuer_id}/fee-assessments/${fee_id}/waive"
              payload: {}
              as: FinanceOfficer
