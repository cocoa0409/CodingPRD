  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: restore_reversal_conserves_account_download_volume
        grounds:
          - state_machines.RestoreRequest.READY_to_REVERSED
          - state_machines.RestoreRequest.READY_to_COMPLETED
          - calculations.billable_egress_gb
          - entities.Account.fields.restore_download_gb
        distinguishing_aspect: "The forward completion adds RestoreRequest.egress_gb to Account.restore_download_gb and the compensating reversal subtracts exactly the same field, so with one other live restore in the period the account volume returns to its pre-restore total — a volume invariant, distinct from the currency invariant of the deposit ledger."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-04T00:00:00Z. PERSONAL account (PRO tier) with one ACTIVE set holding a 600 GB archive, and one unrelated completed restore already contributing 0.0 GB."
          setup_api_calls:
            - call: "POST /backup-provider/_clock/set_current_utc"
