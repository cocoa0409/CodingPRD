scenario: |
  Construction material testing laboratory: sample registration with sample profile (material/source-project/specification), client information, witness-sampling record, sample identification code, sample-handover record, and sample-storage assignment; testing task assignment with test-item configuration by material type, tester qualification matching, workload balancing, urgent-task expedited handling, task-status tracking, and task-reassignment rules; instrument scheduling with instrument ledger (calibration-status/capability), instrument-availability slot booking, calibration-period blocking, instrument-failure handling, and instrument-usage log; testing data entry with data-entry by tester, instrument-output direct integration, raw-data and calculated-result separation, data-modification log, abnormal-data flagging, and re-testing workflow; report review and issuance with multi-level review (tester/reviewer/authorized-signatory), report-template by test type, report-version control, electronic-signature embedding, report-issuance to client, and report-archiving; qualification monitoring with laboratory accreditation scope, instrument-calibration validity, tester-qualification validity, expiration alerts, periodic internal audit, and external-inspection response support; fee settlement with test-item pricing, urgent-handling surcharge, package and contract pricing, deposit deduction, refund rules for failed tests, invoice issuance, and periodic settlement; event-driven synchronization with payment, accreditation-authority, and project-management systems; audit logging for data changes and report issuance.

domain_name: "material-testing-lab"
api_prefix: "/samples"

complexity_profile:
  primary_archetype: "compliance / audit"
  secondary_archetype: "temporal windowing"
  complexity_layers:
    - "cascading side effects"
    - "dual-variant calculation"
    - "derived field reconciliation"
    - "ops-run checkpoint"
    - "optimistic concurrency"
  entity_topology: "hybrid"
  state_machine_shape: "branching"            # plus a cyclic revision loop on Report and Task
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "cross_aggregate"
  role_model: "segregation_of_duties"
  consistency_model: "immediate"

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Client/owner organization name (project owner)."
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email for report issuance and invoices."
      - name: contract_id
        type: string
        source: input
        description: "Optional reference to an external master contract."
        default: null
      - name: deposit_balance_cents
        type: integer
        source: computed
        description: "Outstanding prepaid deposit in integer cents; debited by invoice settlement, credited by external PaymentReceived event."
        default: 0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Net amount owed across all ISSUED unpaid invoices in cents."
        default: 0

  - name: Tester
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Tester's legal name."
      - name: qualifications
        type: array
        source: input
        description: "Array of qualification objects: { material_category: enum, valid_from: date, valid_to: date }. Tester is qualified for a TestTask if at least one qualification entry covers the task's material_category and (today_date BETWEEN valid_from AND valid_to)."
      - name: max_concurrent_tasks
        type: integer
        source: input
        description: "Workload cap. Server tracks active_task_count and rejects assignment if it would exceed this value."
        default: 5
      - name: active_task_count
        type: integer
        source: computed
        description: "Count of TestTasks where assigned_tester_id = this.id AND status IN {ASSIGNED, IN_PROGRESS, AWAITING_RETEST}."
        default: 0
      - name: qualification_posture
        type: enum
        source: computed
        description: "Derived field reconciled at every qualification mutation and at every clock-advance. Pinned formula in calculations.tester_qualification_posture."
        default: "QUALIFIED"
        constraints: "enum: QUALIFIED | EXPIRING_SOON | LAPSED"

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Reviewer's legal name."
      - name: scope_categories
        type: array
        source: input
        description: "Array of material_category enum values the reviewer may review."

  - name: Signatory
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Authorized signatory's legal name."
      - name: signature_certificate_id
        type: string
        source: input
        description: "Reference to the electronic-signature certificate to embed in issued reports."
      - name: scope_categories
        type: array
        source: input
        description: "Array of material_category enum values within the signatory's authorization scope."

  - name: Instrument
    parent: null
    common_fields: true
    fields:
      - name: asset_code
        type: string
        source: input
        description: "Lab-internal instrument identifier (e.g., 'UTM-014')."
        constraints: "Unique across all Instrument rows."
      - name: capabilities
        type: array
        source: input
        description: "Array of test_method enum values the instrument can perform."
      - name: calibration_valid_from
        type: datetime
        source: input
        description: "Start of current calibration validity window (inclusive)."
      - name: calibration_valid_to
        type: datetime
        source: input
        description: "End of current calibration validity window (inclusive). Beyond this datetime the instrument enters CALIBRATION_DUE and may not be booked."
      - name: status
        type: enum
        source: computed
        description: "Driven by state machine."
        default: "AVAILABLE"
        constraints: "enum: AVAILABLE | CALIBRATION_DUE | OUT_OF_SERVICE | RETIRED"
      - name: usage_minutes_total
        type: integer
        source: computed
        description: "Running total of minutes the instrument has been booked across all COMPLETED bookings."
        default: 0

  - name: Sample
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "Foreign key to Client.id."
      - name: source_project
        type: string
        source: input
        description: "Name of the construction project the sample was taken from."
      - name: material_category
        type: enum
        source: input
        description: "Drives test-item selection, qualification matching, and reviewer scope."
        constraints: "enum: CONCRETE | STEEL_REBAR | SOIL | ASPHALT | CEMENT"
      - name: specification
        type: string
        source: input
        description: "Specification string (e.g., 'C30 cube 150mm', 'HRB400 D16'). Free text."
      - name: witness_sampled
        type: boolean
        source: input
        description: "Whether sampling was witnessed by an authorized inspector."
      - name: witness_name
        type: string
        source: input
        description: "Witness name. REQUIRED when witness_sampled = true; MUST be null when witness_sampled = false."
        default: null
      - name: sample_code
        type: string
        source: computed
        description: "Server-minted identification code with format '{MATERIAL3}-{YYYYMMDD}-{SEQ4}', where MATERIAL3 is the first three letters of material_category (CON, STE, SOI, ASP, CEM), YYYYMMDD is the registration date in UTC, and SEQ4 is a four-digit sequence (zero-padded) restarting at 0001 each (material_category, UTC date)."
        constraints: "Globally unique."
      - name: handover_record
        type: object
        source: input
        description: "Handover metadata: { delivered_by: string, received_by: string, handover_at: ISO8601 }. All three keys required at registration."
      - name: storage_location
        type: string
        source: computed
        description: "Allocated storage bin identifier in format 'BIN-{material_category}-{NN}'. Assigned at registration."
      - name: status
        type: enum
        source: computed
        description: "Driven by state machine."
        default: "REGISTERED"
        constraints: "enum: REGISTERED | IN_TESTING | RETESTING | TESTED | DISPOSED"

  - name: TestTask
    parent: null
    common_fields: true
    fields:
      - name: sample_id
        type: string
        source: input
        description: "Foreign key to Sample.id."
      - name: test_method
        type: enum
        source: input
        description: "Specific test method (each test_method has exactly one allowed material_category — see calculations.test_item_pricing)."
        constraints: "enum: COMPRESSION_STRENGTH | TENSILE_STRENGTH | COMPACTION_DENSITY | MARSHALL_STABILITY | SETTING_TIME"
      - name: urgent
        type: boolean
        source: input
        description: "If true, expedited handling: a 50% surcharge applies and the task jumps to the head of the assignment queue."
        default: false
      - name: assigned_tester_id
        type: string
        source: computed
        description: "Foreign key to Tester.id. Set by selector policy in calculations.tester_assignment_selection."
        default: null
      - name: instrument_booking_id
        type: string
        source: input
        description: "Foreign key to InstrumentBooking.id. REQUIRED before status leaves ASSIGNED."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Driven by state machine."
        default: "PENDING_ASSIGNMENT"
        constraints: "enum: PENDING_ASSIGNMENT | ASSIGNED | IN_PROGRESS | AWAITING_RETEST | COMPLETED | CANCELLED"
      - name: retest_count
        type: integer
        source: computed
        description: "Number of retests triggered for this task. Pinned cap in validations."
        default: 0
      - name: priority_seq
        type: integer
        source: computed
        description: "Server-minted monotonic sequence: urgent tasks always rank before non-urgent; within the same urgency bucket, earlier created_at ranks first. Used as the deterministic ranking key in tester_assignment_selection."

  - name: InstrumentBooking
    parent: null
    common_fields: false
    fields:
      - name: instrument_id
        type: string
        source: input
        description: "Foreign key to Instrument.id."
      - name: task_id
        type: string
        source: input
        description: "Foreign key to TestTask.id."
      - name: slot_start
        type: datetime
        source: input
        description: "Inclusive start datetime of the booked slot."
      - name: slot_end
        type: datetime
        source: input
        description: "Exclusive end datetime of the booked slot. Slots use the half-open interval [slot_start, slot_end). Two bookings on the same instrument overlap iff their half-open intervals intersect."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of the booking."
        default: "RESERVED"
        constraints: "enum: RESERVED | COMPLETED | CANCELLED"

  - name: TestRecord
    parent: null
    common_fields: true
    fields:
      - name: task_id
        type: string
        source: input
        description: "Foreign key to TestTask.id."
      - name: tester_id
        type: string
        source: input
        description: "Foreign key to Tester.id. MUST equal TestTask.assigned_tester_id."
      - name: raw_data
        type: object
        source: input
        description: "Frozen instrument-output blob: { peak_load_kn: number, ... } depending on test_method. Stored verbatim; never overwritten."
      - name: calculated_result
        type: number
        source: computed
        description: "Derived per calculations.test_result_calculation from raw_data and Sample.specification. Stored separately from raw_data."
      - name: abnormal_flag
        type: boolean
        source: computed
        description: "true iff calculated_result falls outside the [lower, upper] expected band declared in calculations.test_result_calculation.constants for this test_method. Triggers retest workflow if record is the FIRST submission for its task; subsequent abnormal records do NOT re-trigger retest."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Lifecycle for a single TestRecord row."
        default: "DRAFT"
        constraints: "enum: DRAFT | SUBMITTED | SUPERSEDED"
      - name: supersedes_record_id
        type: string
        source: input
        description: "If this record is a retest, the previous TestRecord it replaces. The previous record transitions to SUPERSEDED but remains queryable."
        default: null

  - name: DataModification
    parent: null
    common_fields: false
    fields:
      - name: record_id
        type: string
        source: input
        description: "Foreign key to TestRecord.id."
      - name: actor_role
        type: string
        source: system
        description: "Role of the user performing the modification (X-User-Role)."
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID of the actor."
      - name: field_path
        type: string
        source: input
        description: "Dot-path of the modified field (e.g., 'raw_data.peak_load_kn', 'calculated_result')."
      - name: previous_value
        type: string
        source: system
        description: "JSON-serialized previous value."
      - name: new_value
        type: string
        source: system
        description: "JSON-serialized new value."
      - name: reason
        type: string
        source: input
        description: "Free-text justification (REQUIRED). Modifications without reason are rejected."

  - name: Report
    parent: null
    common_fields: true
    fields:
      - name: task_id
        type: string
        source: input
        description: "Foreign key to TestTask.id. Exactly one Report per TestTask."
      - name: template_code
        type: string
        source: computed
        description: "Template id chosen by test_method (e.g., 'TPL-COMPRESSION-V2')."
      - name: version
        type: integer
        source: computed
        description: "Report version number, starts at 1, incremented on each revision loop."
        default: 1
      - name: reviewer_id
        type: string
        source: computed
        description: "Foreign key to Reviewer.id. Set when reviewer accepts the report; cleared when sent back."
        default: null
      - name: signatory_id
        type: string
        source: computed
        description: "Foreign key to Signatory.id. Set when signatory signs."
        default: null
      - name: signature_payload
        type: string
        source: computed
        description: "Base64 payload representing the embedded electronic signature; populated on signatory approval, cleared if report is recalled."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Driven by state machine."
        default: "DRAFTED"
        constraints: "enum: DRAFTED | UNDER_REVIEW | SIGNED | ISSUED | ARCHIVED | RECALLED"
      - name: issued_at
        type: datetime
        source: computed
        description: "Set when status → ISSUED. Drives 30-day archive auto-transition on clock-advance sweep."
        default: null

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "Foreign key to Client.id."
      - name: line_items
        type: array
        source: computed
        description: "Array of { task_id, base_fee_cents, surcharge_cents, refund_cents }. Built from a server-supplied task_ids list at issuance."
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of line_items[].base_fee_cents."
      - name: surcharge_total_cents
        type: integer
        source: computed
        description: "Sum of line_items[].surcharge_cents."
      - name: refund_total_cents
        type: integer
        source: computed
        description: "Sum of line_items[].refund_cents."
      - name: package_discount_cents
        type: integer
        source: computed
        description: "Discount applied when item count and/or client's contract_id qualifies for package pricing. See calculations.invoice_total."
      - name: deposit_applied_cents
        type: integer
        source: computed
        description: "Portion of Client.deposit_balance_cents debited at issuance, capped by the gross-of-deposit total."
      - name: total_due_cents
        type: integer
        source: computed
        description: "Final net amount the client owes."
      - name: status
        type: enum
        source: computed
        description: "Invoice lifecycle."
        default: "ISSUED"
        constraints: "enum: ISSUED | PAID | VOIDED"
      - name: paid_at
        type: datetime
        source: computed
        description: "Timestamp of external PaymentReceived event applying to this invoice."
        default: null

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: event_type
        type: enum
        source: system
        description: "Audit event taxonomy."
        constraints: "enum: REPORT_ISSUED | REPORT_RECALLED | DATA_MODIFIED | EXTERNAL_INSPECTION_RESPONDED | INTERNAL_AUDIT_RUN | QUALIFICATION_LAPSED | INSTRUMENT_CALIBRATION_LAPSED"
      - name: subject_type
        type: string
        source: system
        description: "Entity type of the subject (e.g., 'Report', 'Instrument', 'Tester')."
      - name: subject_id
        type: string
        source: system
        description: "Subject entity id."
      - name: actor_role
        type: string
        source: system
        description: "X-User-Role of the triggering actor, or 'system' for clock-advance derived events."
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID of the actor, or 'system'."
      - name: payload
        type: object
        source: system
        description: "Event-specific metadata (e.g., { version: 2 } for REPORT_ISSUED, { lapsed_at: ISO8601 } for QUALIFICATION_LAPSED)."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Sample
    initial_state: REGISTERED
    terminal_states: [DISPOSED]
    transitions:
      - from: REGISTERED
        to: IN_TESTING
        trigger: "POST /samples/{id}/tasks creates the first TestTask"
        actor: LabClerk
        preconditions:
          - "Sample.status == REGISTERED"
        side_effects:
          - "Sample.status = IN_TESTING"
        note: "Auto-fires the first time a TestTask is created for this Sample."

      - from: IN_TESTING
        to: RETESTING
        trigger: "First abnormal TestRecord submitted for any task under this sample"
        actor: system
        preconditions:
          - "There exists at least one TestTask under this sample with retest_count == 0 and a SUBMITTED TestRecord whose abnormal_flag is true"
        side_effects:
          - "Sample.status = RETESTING"
          - "Associated TestTask.status -> AWAITING_RETEST (cascade hop 1)"
          - "AWAITING_RETEST task increments retest_count by 1 on next record submission (cascade hop 2)"

      - from: RETESTING
        to: IN_TESTING
        trigger: "Retest TestRecord submitted that supersedes the abnormal record (POST /tasks/{id}/records)"
        actor: Tester
        preconditions:
          - "Submitted TestRecord.supersedes_record_id references an abnormal SUBMITTED record under this sample"

      - from: IN_TESTING
        to: TESTED
        trigger: "All TestTasks under this sample reach status == COMPLETED"
        actor: system
        preconditions:
          - "Count of TestTasks with sample_id == this.id AND status != COMPLETED equals 0"
        side_effects:
          - "Sample.status = TESTED"

      - from: TESTED
        to: DISPOSED
        trigger: "DELETE /samples/{id} (post-archive disposal)"
        actor: LabClerk
        preconditions:
          - "All Reports for this sample's tasks are in {ISSUED, ARCHIVED}"

  - entity: TestTask
    initial_state: PENDING_ASSIGNMENT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING_ASSIGNMENT
        to: ASSIGNED
        trigger: "POST /tasks/{id}/assign (system-selected tester via calculations.tester_assignment_selection) or auto-fire on creation"
        actor: system
        preconditions:
          - "Tester.qualification_posture == QUALIFIED for at least one candidate tester whose qualifications cover the task's material_category"
          - "Selected tester's active_task_count < max_concurrent_tasks"
        side_effects:
          - "TestTask.assigned_tester_id = selected_tester.id"
          - "Selected Tester.active_task_count += 1 (cascade hop 1)"

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /tasks/{id}/start"
        actor: Tester
        preconditions:
          - "TestTask.assigned_tester_id == X-User-ID"
          - "TestTask.instrument_booking_id is not null"
          - "Referenced InstrumentBooking.status == RESERVED"
          - "Referenced Instrument.status == AVAILABLE"

      - from: ASSIGNED
        to: PENDING_ASSIGNMENT
        trigger: "POST /tasks/{id}/reassign — Lab manager reassignment; OR system-fired when assigned tester's qualification_posture flips to LAPSED during clock-advance sweep"
        actor: LabManager
        preconditions:
          - "TestTask.status == ASSIGNED"
        side_effects:
          - "Previous Tester.active_task_count -= 1 (cascade hop 1)"
          - "TestTask.assigned_tester_id = null (cascade hop 2)"

      - from: IN_PROGRESS
        to: AWAITING_RETEST
        trigger: "First SUBMITTED TestRecord on this task with abnormal_flag == true (auto on POST /tasks/{id}/records)"
        actor: system
        preconditions:
          - "TestRecord.status == SUBMITTED AND abnormal_flag == true AND TestTask.retest_count == 0"
        side_effects:
          - "TestTask.status = AWAITING_RETEST"
          - "Sample.status -> RETESTING (cascade hop 2)"

      - from: AWAITING_RETEST
        to: IN_PROGRESS
        trigger: "POST /tasks/{id}/records with supersedes_record_id present"
        actor: Tester
        preconditions:
          - "TestTask.retest_count < 1 (cap: at most one retest)"
        side_effects:
          - "TestTask.retest_count += 1"
          - "Previous SUBMITTED TestRecord.status = SUPERSEDED"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "Tester marks task complete after a non-abnormal SUBMITTED record exists (POST /tasks/{id}/complete)"
        actor: Tester
        preconditions:
          - "There exists exactly one TestRecord on this task with status == SUBMITTED AND abnormal_flag == false"
        side_effects:
          - "TestTask.status = COMPLETED"
          - "Tester.active_task_count -= 1 (cascade hop 1)"
          - "Referenced InstrumentBooking.status = COMPLETED (cascade hop 2)"
          - "Instrument.usage_minutes_total += duration_minutes(slot_end - slot_start) (cascade hop 3)"
          - "If all sibling tasks under same Sample are COMPLETED, Sample.status -> TESTED (cascade hop 3 alt)"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /tasks/{id}/cancel before any TestRecord submitted"
        actor: LabManager
        preconditions:
          - "No TestRecord exists with task_id == this.id"
        side_effects:
          - "Tester.active_task_count -= 1"
          - "Linked InstrumentBooking.status = CANCELLED"

  - entity: Report
    initial_state: DRAFTED
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFTED
        to: UNDER_REVIEW
        trigger: "POST /reports/{id}/submit-for-review (by Tester who authored the underlying TestRecord)"
        actor: Tester
        preconditions:
          - "Linked TestTask.status == COMPLETED"
          - "Tester.id == TestTask.assigned_tester_id"

      - from: UNDER_REVIEW
        to: DRAFTED
        trigger: "POST /reports/{id}/send-back (Reviewer rejects with revision request)"
        actor: Reviewer
        preconditions:
          - "Reviewer.scope_categories CONTAINS linked Sample.material_category"
        side_effects:
          - "Report.version += 1 (cyclic revision loop)"
          - "Report.reviewer_id = null"

      - from: UNDER_REVIEW
        to: SIGNED
        trigger: "POST /reports/{id}/sign (Signatory approval)"
        actor: Signatory
        preconditions:
          - "Reviewer has approved (Report.reviewer_id is not null)"
          - "Signatory.scope_categories CONTAINS linked Sample.material_category"
          - "Signatory.id != Reviewer.id AND Signatory.id != Tester.id (segregation of duties)"
        side_effects:
          - "Report.signatory_id = acting signatory"
          - "Report.signature_payload populated with electronic signature"

      - from: SIGNED
        to: ISSUED
        trigger: "POST /reports/{id}/issue (delivery to Client)"
        actor: Signatory
        preconditions:
          - "Report.signature_payload is not null"
          - "Invoice for the underlying task exists with status IN {ISSUED, PAID}"
        side_effects:
          - "Report.issued_at = now()"
          - "AuditEvent emitted (event_type=REPORT_ISSUED)"

      - from: ISSUED
        to: ARCHIVED
        trigger: "Clock-advance sweep at issued_at + 30 days"
        actor: system
        preconditions:
          - "now() >= Report.issued_at + 30 days"
        side_effects:
          - "Report.status = ARCHIVED"

      - from: ISSUED
        to: RECALLED
        trigger: "POST /reports/{id}/recall (compliance recall before archive)"
        actor: Signatory
        preconditions:
          - "now() < Report.issued_at + 30 days"
        side_effects:
          - "Report.signature_payload = null"
          - "AuditEvent emitted (event_type=REPORT_RECALLED)"

      - from: RECALLED
        to: DRAFTED
        trigger: "POST /reports/{id}/reopen"
        actor: LabManager
        preconditions:
          - "Report.status == RECALLED"
        side_effects:
          - "Report.version += 1"

  - entity: Instrument
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: CALIBRATION_DUE
        trigger: "Clock-advance sweep at calibration_valid_to + 1ms; auto"
        actor: system
        preconditions:
          - "now() > Instrument.calibration_valid_to"
        side_effects:
          - "All future-dated RESERVED InstrumentBookings whose slot_start > calibration_valid_to are CANCELLED (cascade hop 1)"
          - "Each cancelled booking's TestTask transitions ASSIGNED -> PENDING_ASSIGNMENT (cascade hop 2)"
          - "Each reverted task decrements its prior Tester.active_task_count by 1 (cascade hop 3)"
          - "AuditEvent (INSTRUMENT_CALIBRATION_LAPSED)"

      - from: CALIBRATION_DUE
        to: AVAILABLE
        trigger: "PATCH /instruments/{id} updating calibration_valid_from/calibration_valid_to to cover now()"
        actor: LabManager
        preconditions:
          - "now() BETWEEN new calibration_valid_from AND new calibration_valid_to (inclusive)"

      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /instruments/{id}/report-failure"
        actor: LabManager
        preconditions:
          - "Instrument.status == AVAILABLE"
        side_effects:
          - "All RESERVED InstrumentBookings whose slot_end > now() are CANCELLED (cascade hop 1)"
          - "Each affected TestTask transitions ASSIGNED -> PENDING_ASSIGNMENT or IN_PROGRESS -> PENDING_ASSIGNMENT (cascade hop 2)"

      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /instruments/{id}/return-to-service"
        actor: LabManager
        preconditions:
          - "Instrument.status == OUT_OF_SERVICE"

      - from: AVAILABLE
        to: RETIRED
        trigger: "DELETE /instruments/{id}"
        actor: LabManager
        preconditions:
          - "No RESERVED InstrumentBooking references this instrument"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /_events/emit body { event_type: 'PaymentReceived', invoice_id, amount_cents }"
        actor: system
        preconditions:
          - "amount_cents == Invoice.total_due_cents"
        side_effects:
          - "Invoice.paid_at = event timestamp"
          - "Client.outstanding_balance_cents -= Invoice.total_due_cents (cascade hop 1)"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /invoices/{id}/void (only if no associated Report has been ISSUED)"
        actor: LabManager
        preconditions:
          - "All Reports referencing tasks in this invoice's line_items[] are NOT in {ISSUED, ARCHIVED}"
        side_effects:
          - "Client.outstanding_balance_cents -= Invoice.total_due_cents"
          - "Client.deposit_balance_cents += Invoice.deposit_applied_cents (restore)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two RESERVED bookings created for the same instrument with overlapping half-open intervals submitted simultaneously"
    guarantee: "At most one booking succeeds; the second is rejected. Half-open [start, end) interval arithmetic: bookings touching at exactly slot_end == other.slot_start do NOT overlap."
    error_id: ERR_INSTRUMENT_SLOT_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on InstrumentBooking creation per (instrument_id, overlapping interval) pair"

  - scenario: "Two reviewers concurrently send-back vs sign the same UNDER_REVIEW Report"
    guarantee: "Exactly one succeeds; loser rejected because Report.status no longer matches the expected from-state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Report.status transition"

  - scenario: "Tester submits a final record while LabManager simultaneously cancels the task"
    guarantee: "Exactly one wins; loser rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on TestTask.status"

  - scenario: "Two assignment attempts target the last available qualified Tester (active_task_count = max - 1) for two different tasks"
    guarantee: "Exactly one assignment succeeds; the loser receives a workload-exceeded error and the task remains PENDING_ASSIGNMENT"
    error_id: ERR_TESTER_WORKLOAD_EXCEEDED
    http_status: 409
    serialization: "First-writer-wins on Tester.active_task_count increment"

  - scenario: "Two PATCH /clients/{id} requests with the same version concurrently modify Client.contact_email"
    guarantee: "Only one succeeds; the second observes a stale version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency on Client.version"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: tester_qualification_posture
    trigger: "On every PATCH /testers/{id} that mutates qualifications[], and on every POST /_clock/advance"
    algorithm: threshold
    formula: |
      today = current_date_utc()
      categories_qualified = [q for q in qualifications if q.valid_from <= today <= q.valid_to]
      categories_expiring  = [q for q in qualifications
                              if q.valid_from <= today <= q.valid_to
                              AND (q.valid_to - today) <= 30 days]
      if categories_qualified is empty: posture = LAPSED
      elif categories_expiring is non-empty: posture = EXPIRING_SOON
      else: posture = QUALIFIED
    input_set: "All entries in Tester.qualifications regardless of category. Excludes entries with valid_to strictly less than today (already expired) from the QUALIFIED count."
    constants:
      EXPIRING_WINDOW_DAYS: 30
    precision: "boundary: '<= 30 days' is inclusive — 30 days exactly counts as expiring"
    variants:
      - name: at_mutation
        when: "Trigger is a PATCH /testers/{id} on qualifications"
        difference: "Recomputed once; no side-effect cascade beyond the tester row itself."
      - name: at_clock_advance
        when: "Trigger is POST /_clock/advance crossing a qualification's valid_to"
        difference: "If posture flips to LAPSED, every TestTask currently ASSIGNED to this Tester is auto-reverted to PENDING_ASSIGNMENT (cascade), unlike the at_mutation variant which only recomputes the field."

  - name: tester_assignment_selection
    trigger: "POST /tasks (auto-assignment) and POST /tasks/{id}/assign (explicit assignment)"
    algorithm: weighted_scoring
    formula: |
      eligible = [t for t in Tester
                  where t.qualification_posture IN {QUALIFIED, EXPIRING_SOON}
                  AND exists q in t.qualifications
                      where q.material_category == task.sample.material_category
                      AND valid_from <= today <= valid_to
                  AND t.active_task_count < t.max_concurrent_tasks]
      if eligible is empty: raise ERR_NO_QUALIFIED_TESTER
      rank by (active_task_count ASC, created_at ASC, id ASC)   # workload balancing
      select first
    input_set: "Tester rows whose posture is QUALIFIED or EXPIRING_SOON. LAPSED testers excluded."
    constants:
      WORKLOAD_SORT_KEY: "active_task_count"
    precision: "tie-break order is (active_task_count, created_at, id)"
    variants:
      - name: urgent_task
        when: "TestTask.urgent == true"
        difference: "task.priority_seq is set so the task is processed AHEAD of any non-urgent task in the queue. The selector is invoked synchronously at task creation; if no eligible tester is available, the task remains PENDING_ASSIGNMENT and a retry happens at the next /_clock/advance — non-urgent tasks defer."
      - name: regular_task
        when: "TestTask.urgent == false"
        difference: "task.priority_seq places it after any concurrent urgent task. If the queue at creation time contains urgent tasks needing assignment, they win even if this task arrived earlier."

  - name: test_result_calculation
    trigger: "POST /tasks/{id}/records on record submission (status SUBMITTED)"
    algorithm: threshold
    formula: |
      # Per-test-method formula:
      if test_method == COMPRESSION_STRENGTH:
        # raw_data.peak_load_kn / cross_section_area_mm2 * 1000  → MPa
        area = parse_specification_area(sample.specification)   # e.g. 150*150 = 22500 mm^2 for 'C30 cube 150mm'
        result_mpa = round(raw_data.peak_load_kn * 1000 / area, 1)
        abnormal = result_mpa < LOWER[COMPRESSION_STRENGTH] OR result_mpa > UPPER[COMPRESSION_STRENGTH]
        return (result_mpa, abnormal)
      elif test_method == TENSILE_STRENGTH:
        result_mpa = round(raw_data.peak_load_kn * 1000 / cross_section_from_spec(sample.specification), 1)
        abnormal = result_mpa < LOWER[TENSILE_STRENGTH] OR result_mpa > UPPER[TENSILE_STRENGTH]
        return (result_mpa, abnormal)
      # ... other methods analogously
    input_set: "raw_data fields specific to test_method, plus Sample.specification."
    constants:
      LOWER:
        COMPRESSION_STRENGTH: 20.0
        TENSILE_STRENGTH: 400.0
        COMPACTION_DENSITY: 1.9
        MARSHALL_STABILITY: 7.5
        SETTING_TIME: 45.0
      UPPER:
        COMPRESSION_STRENGTH: 60.0
        TENSILE_STRENGTH: 600.0
        COMPACTION_DENSITY: 2.6
        MARSHALL_STABILITY: 18.0
        SETTING_TIME: 600.0
    precision: "round_half_up to 1 decimal place. Boundary: result == LOWER[m] is NOT abnormal (>= LOWER); result == UPPER[m] is NOT abnormal (<= UPPER)."
    variants:
      - name: initial_submission
        when: "TestRecord.supersedes_record_id is null"
        difference: "If abnormal_flag is true AND TestTask.retest_count == 0, the system triggers retest workflow (TestTask -> AWAITING_RETEST, Sample -> RETESTING)."
      - name: retest_submission
        when: "TestRecord.supersedes_record_id is not null"
        difference: "Even if abnormal_flag is true, the retest workflow is NOT re-triggered (cap of 1 retest). The new record is recorded; the task transitions back to IN_PROGRESS pending a non-abnormal record OR explicit completion."

  - name: test_item_pricing
    trigger: "Reference table consulted by invoice_total at Invoice creation. Also enforces test_method ↔ material_category coupling at task creation."
    algorithm: aggregation
    formula: |
      method_to_category = {
        COMPRESSION_STRENGTH: CONCRETE,
        TENSILE_STRENGTH: STEEL_REBAR,
        COMPACTION_DENSITY: SOIL,
        MARSHALL_STABILITY: ASPHALT,
        SETTING_TIME: CEMENT
      }
      base_fee_cents[method] = {
        COMPRESSION_STRENGTH: 20000,
        TENSILE_STRENGTH: 25000,
        COMPACTION_DENSITY: 18000,
        MARSHALL_STABILITY: 30000,
        SETTING_TIME: 15000
      }
      # Validation: at TestTask creation, reject if method_to_category[task.test_method] != sample.material_category (ERR_TEST_METHOD_NOT_SUPPORTED).
    input_set: "TestTask.test_method only."
    constants:
      URGENT_SURCHARGE_RATE: 0.50          # 50% of base
      REFUND_RATE_ON_ABNORMAL_AFTER_RETEST: 0.30   # 30% refund if retest still abnormal
      PACKAGE_THRESHOLD_COUNT: 5            # 5+ line items qualifies for package discount
      PACKAGE_DISCOUNT_RATE: 0.10           # 10% off (subtotal + surcharge - refund) when threshold met OR contract pricing
    precision: "All monetary fields are integers in cents; conversion uses round_half_up at each pinned step."

  - name: invoice_total
    trigger: "POST /clients/{id}/invoices issuance"
    algorithm: tiered_pricing
    formula: |
      # Inputs: task_ids[] supplied in request body. Only COMPLETED tasks of this client are accepted.
      # Step 1 — Per-line:
      for task in task_ids:
        base_fee = test_item_pricing.base_fee_cents[task.test_method]
        surcharge = round_half_up(base_fee * URGENT_SURCHARGE_RATE) if task.urgent else 0
        # Refund: if final SUBMITTED record on the task has abnormal_flag == true AND retest_count == 1
        if task has retest_count == 1 AND final TestRecord (non-superseded) has abnormal_flag == true:
          refund = round_half_up(base_fee * REFUND_RATE_ON_ABNORMAL_AFTER_RETEST)
        else:
          refund = 0
        line_items.append({task_id, base_fee_cents=base_fee, surcharge_cents=surcharge, refund_cents=refund})

      # Step 2 — Aggregate:
      subtotal       = sum(line.base_fee_cents      for line in line_items)
      surcharge_total= sum(line.surcharge_cents     for line in line_items)
      refund_total   = sum(line.refund_cents        for line in line_items)
      gross          = subtotal + surcharge_total - refund_total

      # Step 3 — Package discount (EVALUATION ORDER PINNED: package discount applies to `gross`, BEFORE deposit):
      if len(line_items) >= PACKAGE_THRESHOLD_COUNT OR client.contract_id is not null:
        package_discount = round_half_up(gross * PACKAGE_DISCOUNT_RATE)
      else:
        package_discount = 0
      pre_deposit_total = gross - package_discount

      # Step 4 — Deposit deduction:
      deposit_applied = min(client.deposit_balance_cents, pre_deposit_total)
      total_due       = pre_deposit_total - deposit_applied

      # Step 5 — Side effects:
      client.deposit_balance_cents -= deposit_applied
      client.outstanding_balance_cents += total_due
    input_set: "TestTask rows with status==COMPLETED belonging to this client that have not appeared in any prior Invoice.line_items[]."
    constants:
      URGENT_SURCHARGE_RATE: 0.50
      PACKAGE_THRESHOLD_COUNT: 5
      PACKAGE_DISCOUNT_RATE: 0.10
      REFUND_RATE_ON_ABNORMAL_AFTER_RETEST: 0.30
    precision: "Rounding order pinned per step: each line's surcharge and refund are rounded individually (per-line round) BEFORE aggregation. Then package_discount is rounded on the aggregate gross. round_half_up throughout."
    variants:
      - name: per_line_round
        when: "Standard invoice path (this is the pinned path)"
        difference: "Round each line's surcharge and refund to integer cents BEFORE summing. This is the canonical evaluation order."
      - name: contract_pricing_path
        when: "Client.contract_id is not null"
        difference: "Package discount applies regardless of line count (the count gate is skipped). Computation still uses per_line_round."

  - name: instrument_usage_log
    trigger: "TestTask transition IN_PROGRESS -> COMPLETED (cascade hop 3 in TestTask state machine)"
    algorithm: aggregation
    formula: |
      duration_minutes = ceil((booking.slot_end - booking.slot_start) / 60_seconds)
      instrument.usage_minutes_total += duration_minutes
    input_set: "InstrumentBooking rows that just transitioned to COMPLETED."
    constants: {}
    precision: "ceil to whole minute"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID headers MUST be present and non-empty"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all except /_clock/advance and /_events/emit"

  - priority: 2
    category: auth
    check: "X-User-Role value MUST be one of the declared role names in §1.7"
    error_id: ERR_AUTH_INVALID
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Caller role is permitted to invoke this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every path-segment id resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path params"

  - priority: 5
    category: existence
    check: "Every foreign-key field in request body references an existing resource (sample_id, task_id, client_id, instrument_id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all mutating endpoints"

  - priority: 6
    category: state
    check: "Target resource is in a status that permits this transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transitioning endpoints"

  - priority: 7
    category: business_safety
    check: "On Report.sign — Signatory.id MUST NOT equal Report.reviewer_id AND MUST NOT equal underlying TestRecord.tester_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: ["POST /reports/{id}/sign"]

  - priority: 8
    category: business_safety
    check: "Signatory.scope_categories CONTAINS linked Sample.material_category"
    error_id: ERR_SIGNATORY_SCOPE_MISMATCH
    http_status: 422
    applies_to: ["POST /reports/{id}/sign"]

  - priority: 9
    category: business_safety
    check: "Reviewer.scope_categories CONTAINS linked Sample.material_category"
    error_id: ERR_REVIEWER_SCOPE_MISMATCH
    http_status: 422
    applies_to: ["POST /reports/{id}/send-back", "POST /reports/{id}/approve-review"]

  - priority: 10
    category: business_safety
    check: "On Report.issue — referenced Instrument's calibration_valid_to MUST be >= TestRecord.created_at for every TestRecord (non-superseded) under this report's task"
    error_id: ERR_REPORT_BLOCKED_INSTRUMENT_LAPSED
    http_status: 422
    applies_to: ["POST /reports/{id}/issue"]

  - priority: 11
    category: business_referential
    check: "On TestTask creation: test_item_pricing.method_to_category[test_method] == sample.material_category"
    error_id: ERR_TEST_METHOD_NOT_SUPPORTED
    http_status: 422
    applies_to: ["POST /samples/{id}/tasks"]

  - priority: 12
    category: business_referential
    check: "On Sample creation: if witness_sampled == true then witness_name MUST be non-empty; if witness_sampled == false then witness_name MUST be null"
    error_id: ERR_WITNESS_RECORD_INCONSISTENT
    http_status: 422
    applies_to: ["POST /samples"]

  - priority: 13
    category: business_temporal
    check: "On InstrumentBooking creation: slot_start MUST be strictly before slot_end AND [slot_start, slot_end) MUST be entirely within the Instrument's calibration window [calibration_valid_from, calibration_valid_to]; touching the boundary at slot_end == calibration_valid_to is allowed because the interval is half-open"
    error_id: ERR_BOOKING_OUTSIDE_CALIBRATION
    http_status: 422
    applies_to: ["POST /instruments/{id}/bookings"]

  - priority: 14
    category: business_temporal
    check: "On InstrumentBooking creation: the new [slot_start, slot_end) MUST NOT intersect any existing RESERVED or COMPLETED booking on the same instrument; bookings touching at exactly slot_end == other.slot_start do NOT collide (half-open)"
    error_id: ERR_INSTRUMENT_SLOT_CONFLICT
    http_status: 409
    applies_to: ["POST /instruments/{id}/bookings"]

  - priority: 15
    category: business_constraint
    check: "On tester assignment: chosen Tester.active_task_count + 1 MUST be <= Tester.max_concurrent_tasks (boundary: > NOT >=)"
    error_id: ERR_TESTER_WORKLOAD_EXCEEDED
    http_status: 409
    applies_to: ["POST /tasks/{id}/assign", "POST /samples/{id}/tasks"]

  - priority: 16
    category: business_constraint
    check: "On tester assignment: at least one Tester satisfies eligible filter in calculations.tester_assignment_selection"
    error_id: ERR_NO_QUALIFIED_TESTER
    http_status: 422
    applies_to: ["POST /tasks/{id}/assign", "POST /samples/{id}/tasks"]

  - priority: 17
    category: business_constraint
    check: "On retest submission: TestTask.retest_count + 1 MUST be <= 1 (cap of one retest)"
    error_id: ERR_RETEST_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /tasks/{id}/records"]

  - priority: 18
    category: business_constraint
    check: "On Invoice issuance: all supplied task_ids belong to the client AND have status == COMPLETED AND have not been previously invoiced"
    error_id: ERR_INVOICE_INELIGIBLE_TASKS
    http_status: 422
    applies_to: ["POST /clients/{id}/invoices"]

  - priority: 19
    category: business_fiscal
    check: "On Invoice issuance: deposit_applied_cents MUST be <= Client.deposit_balance_cents (computed as min(); never exceeds)"
    error_id: ERR_DEPOSIT_OVERDRAW
    http_status: 422
    applies_to: ["POST /clients/{id}/invoices"]

  - priority: 20
    category: business_constraint
    check: "On DataModification creation: reason field MUST be non-empty (data-modification log requirement)"
    error_id: ERR_DATA_MODIFICATION_REASON_REQUIRED
    http_status: 422
    applies_to: ["PATCH /records/{id}"]

  - priority: 21
    category: business_constraint
    check: "On PATCH operations carrying a 'version' field: client-supplied version MUST equal current row version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

  - priority: 22
    category: business_constraint
    check: "Pagination query params limit and offset are within bounds (1 <= limit <= 100, offset >= 0)"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"

  - priority: 23
    category: business_constraint
    check: "Numeric and enum field values match declared type/constraints (final shape check)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ----- Clients -----
  - method: POST
    path: "/clients"
    description: "Register a Client. Initial deposit may be applied via separate /_events/emit PaymentReceived with no invoice_id (credits deposit_balance)."
    roles: [LabManager]
    code: 201
    input: ["name", "contact_email", "contract_id?"]
    output: Client
    side_effects: []

  - method: GET
    path: "/clients/{id}"
    description: "Read Client."
    roles: [LabManager, LabClerk]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: PATCH
    path: "/clients/{id}"
    description: "Update Client contact info (OCC via version)."
    roles: [LabManager]
    code: 200
    input: ["contact_email?", "contract_id?", "version"]
    output: Client
    side_effects: []

  # ----- Testers -----
  - method: POST
    path: "/testers"
    description: "Create Tester."
    roles: [LabManager]
    code: 201
    input: ["full_name", "qualifications", "max_concurrent_tasks?"]
    output: Tester
    side_effects: ["calculations.tester_qualification_posture runs (at_mutation variant)"]

  - method: GET
    path: "/testers/{id}"
    description: "Read Tester."
    roles: [LabManager, LabClerk, Tester]
    code: 200
    input: []
    output: Tester
    side_effects: []

  - method: PATCH
    path: "/testers/{id}"
    description: "Update Tester qualifications and workload cap."
    roles: [LabManager]
    code: 200
    input: ["qualifications?", "max_concurrent_tasks?", "version"]
    output: Tester
    side_effects: ["calculations.tester_qualification_posture runs (at_mutation variant)"]

  - method: GET
    path: "/testers"
    description: "List testers with optional filters."
    roles: [LabManager]
    code: 200
    input: ["posture?", "material_category?", "limit?", "offset?"]
    output: Tester[]
    side_effects: []

  # ----- Reviewers / Signatories -----
  - method: POST
    path: "/reviewers"
    description: "Create Reviewer."
    roles: [LabManager]
    code: 201
    input: [full_name, scope_categories]
    output: Reviewer
    side_effects: []

  - method: POST
    path: "/signatories"
    description: "Create Signatory."
    roles: [LabManager]
    code: 201
    input: [full_name, signature_certificate_id, scope_categories]
    output: Signatory
    side_effects: []

  # ----- Instruments -----
  - method: POST
    path: "/instruments"
    description: "Add Instrument to ledger."
    roles: [LabManager]
    code: 201
    input: [asset_code, capabilities, calibration_valid_from, calibration_valid_to]
    output: Instrument
    side_effects: []

  - method: GET
    path: "/instruments/{id}"
    description: "Read Instrument (includes computed status and usage_minutes_total)."
    roles: [LabManager, LabClerk, Tester]
    code: 200
    input: []
    output: Instrument
    side_effects: []

  - method: PATCH
    path: "/instruments/{id}"
    description: "Update calibration window or capabilities."
    roles: [LabManager]
    code: 200
    input: ["calibration_valid_from?", "calibration_valid_to?", "capabilities?", "version"]
    output: Instrument
    side_effects: ["If new window covers now() and status was CALIBRATION_DUE, status -> AVAILABLE"]

  - method: POST
    path: "/instruments/{id}/report-failure"
    description: "Mark instrument OUT_OF_SERVICE; cascade-cancel future bookings."
    roles: [LabManager]
    code: 200
    input: []
    output: Instrument
    side_effects: ["Cascade: bookings -> CANCELLED -> affected tasks -> PENDING_ASSIGNMENT"]

  - method: POST
    path: "/instruments/{id}/return-to-service"
    description: "Return instrument to AVAILABLE."
    roles: [LabManager]
    code: 200
    input: []
    output: Instrument
    side_effects: []

  - method: DELETE
    path: "/instruments/{id}"
    description: "Retire instrument."
    roles: [LabManager]
    code: 204
    input: []
    output: null
    side_effects: []

  - method: POST
    path: "/instruments/{id}/bookings"
    description: "Reserve an instrument slot for a TestTask."
    roles: [LabClerk, Tester]
    code: 201
    input: [task_id, slot_start, slot_end]
    output: InstrumentBooking
    side_effects: ["TestTask.instrument_booking_id set"]

  - method: GET
    path: "/instruments/{id}/bookings"
    description: "List bookings for an instrument (paginated, with slot range filter)."
    roles: [LabManager, LabClerk]
    code: 200
    input: ["from?", "to?", "limit?", "offset?"]
    output: InstrumentBooking[]
    side_effects: []

  # ----- Samples -----
  - method: POST
    path: "/samples"
    description: "Register a sample (mints sample_code and storage_location). Sets Sample.status = REGISTERED."
    roles: [LabClerk]
    code: 201
    input: ["client_id", "source_project", "material_category", "specification", "witness_sampled", "witness_name?", "handover_record"]
    output: Sample
    side_effects: ["sample_code minted", "storage_location assigned"]

  - method: GET
    path: "/samples/{id}"
    description: "Read Sample."
    roles: [LabManager, LabClerk, Tester]
    code: 200
    input: []
    output: Sample
    side_effects: []

  - method: GET
    path: "/samples"
    description: "List samples."
    roles: [LabManager, LabClerk]
    code: 200
    input: ["client_id?", "status?", "material_category?", "limit?", "offset?"]
    output: Sample[]
    side_effects: []

  - method: DELETE
    path: "/samples/{id}"
    description: "Dispose sample (Sample -> DISPOSED)."
    roles: [LabClerk]
    code: 204
    input: []
    output: null
    side_effects: []

  # ----- Test Tasks (nested under samples for create; flat for everything else) -----
  - method: POST
    path: "/samples/{id}/tasks"
    description: "Create a TestTask under a sample. Synchronously runs tester_assignment_selection if a tester is eligible; otherwise leaves the task PENDING_ASSIGNMENT for the next /_clock/advance retry."
    roles: [LabClerk]
    code: 201
    input: ["test_method", "urgent?"]
    output: TestTask
    side_effects: ["priority_seq minted", "Tester.active_task_count++ on success", "Sample.status -> IN_TESTING on first task"]

  - method: GET
    path: "/tasks/{id}"
    description: "Read TestTask."
    roles: [LabManager, LabClerk, Tester]
    code: 200
    input: []
    output: TestTask
    side_effects: []

  - method: POST
    path: "/tasks/{id}/assign"
    description: "Manually trigger assignment (for tasks that are PENDING_ASSIGNMENT)."
    roles: [LabManager]
    code: 200
    input: []
    output: TestTask
    side_effects: ["selector + cascade"]

  - method: POST
    path: "/tasks/{id}/reassign"
    description: "Force reassignment back to PENDING_ASSIGNMENT (releases tester and booking)."
    roles: [LabManager]
    code: 200
    input: []
    output: TestTask
    side_effects: ["cascade: Tester.active_task_count--, InstrumentBooking -> CANCELLED"]

  - method: POST
    path: "/tasks/{id}/start"
    description: "Tester begins work (ASSIGNED -> IN_PROGRESS)."
    roles: [Tester]
    code: 200
    input: []
    output: TestTask
    side_effects: []

  - method: POST
    path: "/tasks/{id}/complete"
    description: "Tester marks task complete (IN_PROGRESS -> COMPLETED)."
    roles: [Tester]
    code: 200
    input: []
    output: TestTask
    side_effects: ["Tester.active_task_count--; InstrumentBooking -> COMPLETED; Instrument.usage_minutes_total += duration_minutes; possibly Sample -> TESTED"]

  - method: POST
    path: "/tasks/{id}/cancel"
    description: "Cancel a task (ASSIGNED -> CANCELLED) before any record submitted."
    roles: [LabManager]
    code: 200
    input: []
    output: TestTask
    side_effects: []

  - method: POST
    path: "/tasks/{id}/records"
    description: "Submit a TestRecord (DRAFT minted then auto SUBMITTED). Runs test_result_calculation; sets abnormal_flag; may trigger retest workflow."
    roles: [Tester]
    code: 201
    input: ["raw_data", "supersedes_record_id?"]
    output: TestRecord
    side_effects: ["calculations.test_result_calculation runs", "may cascade Task -> AWAITING_RETEST -> Sample -> RETESTING"]

  - method: GET
    path: "/tasks/{id}/records"
    description: "List TestRecords for a task (includes superseded rows for traceability)."
    roles: [LabManager, LabClerk, Tester, Reviewer, Signatory]
    code: 200
    input: ["limit?", "offset?"]
    output: TestRecord[]
    side_effects: []

  - method: PATCH
    path: "/records/{id}"
    description: "Modify raw_data or calculated_result on a SUBMITTED record. Creates an immutable DataModification entry per field changed."
    roles: [Tester]
    code: 200
    input: ["raw_data?", "reason", "version"]
    output: TestRecord
    side_effects: ["DataModification rows appended; calculated_result recomputed; AuditEvent (DATA_MODIFIED)"]

  - method: GET
    path: "/records/{id}/modifications"
    description: "List DataModification entries for a record."
    roles: [LabManager, Reviewer, Signatory]
    code: 200
    input: ["limit?", "offset?"]
    output: DataModification[]
    side_effects: []

  # ----- Reports -----
  - method: POST
    path: "/tasks/{id}/report"
    description: "Mint Report for a COMPLETED task (status DRAFTED, version 1, template_code resolved)."
    roles: [Tester]
    code: 201
    input: []
    output: Report
    side_effects: []

  - method: POST
    path: "/reports/{id}/submit-for-review"
    description: "DRAFTED -> UNDER_REVIEW."
    roles: [Tester]
    code: 200
    input: []
    output: Report
    side_effects: []

  - method: POST
    path: "/reports/{id}/approve-review"
    description: "Reviewer signs off on review (sets reviewer_id but stays UNDER_REVIEW until signatory)."
    roles: [Reviewer]
    code: 200
    input: []
    output: Report
    side_effects: []

  - method: POST
    path: "/reports/{id}/send-back"
    description: "UNDER_REVIEW -> DRAFTED with version++."
    roles: [Reviewer]
    code: 200
    input: []
    output: Report
    side_effects: ["Report.version += 1; reviewer_id cleared"]

  - method: POST
    path: "/reports/{id}/sign"
    description: "UNDER_REVIEW -> SIGNED. Embeds signature_payload."
    roles: [Signatory]
    code: 200
    input: []
    output: Report
    side_effects: []

  - method: POST
    path: "/reports/{id}/issue"
    description: "SIGNED -> ISSUED. Emits AuditEvent REPORT_ISSUED. Requires invoice for the underlying task to exist."
    roles: [Signatory]
    code: 200
    input: []
    output: Report
    side_effects: ["AuditEvent emitted"]

  - method: POST
    path: "/reports/{id}/recall"
    description: "ISSUED -> RECALLED before 30-day archive."
    roles: [Signatory]
    code: 200
    input: []
    output: Report
    side_effects: ["AuditEvent emitted"]

  - method: POST
    path: "/reports/{id}/reopen"
    description: "RECALLED -> DRAFTED with version++."
    roles: [LabManager]
    code: 200
    input: []
    output: Report
    side_effects: []

  - method: GET
    path: "/reports/{id}"
    description: "Read Report."
    roles: [LabManager, LabClerk, Reviewer, Signatory, Tester]
    code: 200
    input: []
    output: Report
    side_effects: []

  # ----- Invoices -----
  - method: POST
    path: "/clients/{id}/invoices"
    description: "Issue an Invoice for a list of COMPLETED tasks. Runs calculations.invoice_total."
    roles: [LabManager]
    code: 201
    input: [task_ids]
    output: Invoice
    side_effects: ["Client.deposit_balance_cents and outstanding_balance_cents updated"]

  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an unpaid invoice."
    roles: [LabManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["restore deposit_balance_cents; reduce outstanding_balance_cents"]

  - method: GET
    path: "/invoices/{id}"
    description: "Read Invoice."
    roles: [LabManager, LabClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  # ----- Audit & internal audit -----
  - method: GET
    path: "/audit-events"
    description: "Query audit log."
    roles: [LabManager]
    code: 200
    input: ["event_type?", "subject_type?", "subject_id?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

  - method: POST
    path: "/_audit/run-internal"
    description: "Trigger periodic internal audit sweep that emits an INTERNAL_AUDIT_RUN AuditEvent with snapshot stats. Idempotent within the same UTC date."
    roles: [LabManager]
    code: 200
    input: []
    output: AuditEvent
    side_effects: ["AuditEvent emitted"]

  - method: POST
    path: "/_audit/respond-external"
    description: "Record an external-inspection response and emit EXTERNAL_INSPECTION_RESPONDED AuditEvent."
    roles: [LabManager]
    code: 200
    input: [inspection_id, response_note]
    output: AuditEvent
    side_effects: []

  # ----- Test-driving / system endpoints -----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the system clock to a future datetime. Runs sweeps: instrument calibration lapses, qualification expirations, 30-day report archival."
    roles: [LabManager]
    code: 200
    input: [to]
    output: object
    side_effects: ["all auto-transitions described in §1.2 with actor=system"]

  - method: POST
    path: "/_events/emit"
    description: "Inject an external event for synchronization (event_type IN {PaymentReceived, AccreditationScopeChanged, ProjectStatusUpdate})."
    roles: [LabManager]
    code: 200
    input: [event_type, payload]
    output: object
    side_effects: ["PaymentReceived: credits Client.deposit_balance_cents OR marks Invoice PAID; AccreditationScopeChanged: updates internal accreditation allowed-categories; ProjectStatusUpdate: no-op snapshot stored"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty"

  - id: ERR_AUTH_INVALID
    http: 401
    condition: "X-User-Role not one of the declared roles"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Caller role lacks permission for this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist (path or body FK)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that permits this operation"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic concurrency: supplied version stale"

  - id: ERR_INSTRUMENT_SLOT_CONFLICT
    http: 409
    condition: "New booking interval overlaps an existing booking on the same instrument"

  - id: ERR_BOOKING_OUTSIDE_CALIBRATION
    http: 422
    condition: "Booking interval extends outside the instrument's current calibration window"

  - id: ERR_TESTER_WORKLOAD_EXCEEDED
    http: 409
    condition: "Assigning this task would push the tester's active_task_count above max_concurrent_tasks"

  - id: ERR_NO_QUALIFIED_TESTER
    http: 422
    condition: "No tester satisfies the qualification + workload + posture filter"

  - id: ERR_TEST_METHOD_NOT_SUPPORTED
    http: 422
    condition: "TestTask.test_method does not match Sample.material_category per test_item_pricing.method_to_category"

  - id: ERR_WITNESS_RECORD_INCONSISTENT
    http: 422
    condition: "witness_sampled flag and witness_name presence disagree"

  - id: ERR_RETEST_LIMIT_EXCEEDED
    http: 422
    condition: "TestTask.retest_count already at cap (1)"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Signatory equals Reviewer or Tester on Report.sign"

  - id: ERR_REVIEWER_SCOPE_MISMATCH
    http: 422
    condition: "Reviewer.scope_categories does not include the Sample's material_category"

  - id: ERR_SIGNATORY_SCOPE_MISMATCH
    http: 422
    condition: "Signatory.scope_categories does not include the Sample's material_category"

  - id: ERR_REPORT_BLOCKED_INSTRUMENT_LAPSED
    http: 422
    condition: "On Report.issue: a referenced instrument's calibration_valid_to was before a TestRecord.created_at"

  - id: ERR_INVOICE_INELIGIBLE_TASKS
    http: 422
    condition: "Invoice issuance includes a task that is not COMPLETED, not owned by client, or already invoiced"

  - id: ERR_DEPOSIT_OVERDRAW
    http: 422
    condition: "Computed deposit_applied_cents exceeds Client.deposit_balance_cents (safety net; invariant)"

  - id: ERR_DATA_MODIFICATION_REASON_REQUIRED
    http: 422
    condition: "PATCH /records/{id} without a non-empty reason field"

  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit or offset query params out of allowed range"

  - id: ERR_VALIDATION
    http: 422
    condition: "Generic request body shape / enum value / type mismatch"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: LabClerk
    description: "Front-desk staff: registers samples, creates tasks, books instruments."
    identity: "opaque"
    exclusive_operations:
      - "POST /samples"
      - "DELETE /samples/{id}"
      - "POST /samples/{id}/tasks"
    shared_operations:
      - "GET /samples"
      - "GET /samples/{id}"
      - "POST /instruments/{id}/bookings"
      - "GET /instruments/{id}/bookings"
      - "GET /tasks/{id}"
      - "GET /tasks/{id}/records"
      - "GET /reports/{id}"
      - "GET /clients/{id}"
      - "GET /invoices/{id}"
      - "GET /testers/{id}"
      - "GET /instruments/{id}"

  - name: Tester
    description: "Performs tests; submits records; drafts reports."
    identity: "entity_backed:Tester"
    exclusive_operations:
      - "POST /tasks/{id}/start"
      - "POST /tasks/{id}/complete"
      - "POST /tasks/{id}/records"
      - "PATCH /records/{id}"
      - "POST /tasks/{id}/report"
      - "POST /reports/{id}/submit-for-review"
    shared_operations:
      - "GET /tasks/{id}"
      - "GET /tasks/{id}/records"
      - "GET /samples/{id}"
      - "GET /reports/{id}"
      - "GET /testers/{id}"
      - "GET /instruments/{id}"
      - "POST /instruments/{id}/bookings"
    notes: "GET /testers/{id} is restricted to the calling Tester's own row (X-User-ID == path id)."

  - name: Reviewer
    description: "Second-level review of reports."
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /reports/{id}/approve-review"
      - "POST /reports/{id}/send-back"
    shared_operations:
      - "GET /reports/{id}"
      - "GET /records/{id}/modifications"
      - "GET /tasks/{id}/records"

  - name: Signatory
    description: "Authorized signatory: signs, issues, recalls reports."
    identity: "entity_backed:Signatory"
    exclusive_operations:
      - "POST /reports/{id}/sign"
      - "POST /reports/{id}/issue"
      - "POST /reports/{id}/recall"
    shared_operations:
      - "GET /reports/{id}"
      - "GET /records/{id}/modifications"
      - "GET /tasks/{id}/records"

  - name: LabManager
    description: "Manages laboratory operations: clients, testers, reviewers, signatories, instruments, invoices, audit."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients"
      - "PATCH /clients/{id}"
      - "POST /testers"
      - "PATCH /testers/{id}"
      - "GET /testers"
      - "POST /reviewers"
      - "POST /signatories"
      - "POST /instruments"
      - "PATCH /instruments/{id}"
      - "DELETE /instruments/{id}"
      - "POST /instruments/{id}/report-failure"
      - "POST /instruments/{id}/return-to-service"
      - "POST /tasks/{id}/assign"
      - "POST /tasks/{id}/reassign"
      - "POST /tasks/{id}/cancel"
      - "POST /clients/{id}/invoices"
      - "POST /invoices/{id}/void"
      - "POST /reports/{id}/reopen"
      - "GET /audit-events"
      - "POST /_audit/run-internal"
      - "POST /_audit/respond-external"
      - "POST /_clock/advance"
      - "POST /_events/emit"
    shared_operations:
      - "GET /clients/{id}"
      - "GET /samples"
      - "GET /samples/{id}"
      - "GET /tasks/{id}"
      - "GET /tasks/{id}/records"
      - "GET /records/{id}/modifications"
      - "GET /reports/{id}"
      - "GET /invoices/{id}"
      - "GET /instruments/{id}"
      - "GET /instruments/{id}/bookings"
      - "GET /testers/{id}"
