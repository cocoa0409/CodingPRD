            - "Trigger call 3 -> HTTP 422 ERR_ACCESS_WINDOW_INVALID (2026-12-13 > term_end_date + 1 day)"
            - "CourseSection.${sec_id}.version is still 1 after the three refusals - a rejected create never bumps the OCC parent version, which is why the same ${sec_v} is reusable"
            - "Trigger call 4 -> HTTP 201: Adoption.${ok_adoption_id}.access_start_date == 2026-08-24, access_end_date == 2026-12-12, status DRAFT"
            - "CourseSection.${sec_id}.version == 2 after trigger call 4"
            - "GET /sections/${sec_id}/adoptions returns total_count == 1"

      - name: validation_opt_out_window_boundary_and_duplicate_open_request
        claim_type: violation_to_error
        grounds:
          - validations[priority=77]
          - validations[priority=89]
          - errors[ERR_OPT_OUT_WINDOW_CLOSED]
          - errors[ERR_DUPLICATE_OPT_OUT_OPEN]
          - state_machines.OptOutRequest.SUBMITTED_to_GRANTED
        distinguishing_aspect: |
          The window boundary is inclusive to the millisecond: filing at exactly
          2026-09-04T23:59:59.999Z succeeds while 2026-09-05T00:00:00.000Z is one millisecond too
          late, and the same gate applies to the bursar's grant - a request filed in time cannot be
          granted after the window closes. Meanwhile only one SUBMITTED/GRANTED request may exist per
          charge, so the duplicate is refused at priority 89 while the window is still open.
        test_recipe:
          setup:
            - "FA26 OPEN; PUB-A ACTIVE; T1 with tiers [1,2] -> 9000 and [3,null] -> 7500; section ECON-101-001 FLAGGED on an APPROVED adoption of T1; two students enrolled 2026-08-24 and charged 9450 each at 2026-08-24T09:00:00Z, so both charges carry opt_out_deadline_at 2026-09-04T23:59:59.999Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terms/${term_id}/open"
              as: ProgramAdmin
            - call: "POST /agreements"
              payload: { publisher_name: "Northgate Academic", agreement_code: "PUB-A", effective_from: "2026-07-01", effective_to: "2027-01-01", admin_fee_pct: 0.05, bookstore_margin_pct: 0.12, price_floor_cents: 2500, rebate_threshold_cents: 16500, rebate_pct: 0.03, max_list_price_pct: 0.60 }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /titles"
              payload: { agreement_id: "${agr_id}", isbn: "978-0-11-000001-0", title: "Principles of Economics", list_price_cents: 18000, format: "DIGITAL" }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 1, max_enrollment: 2, per_student_price_cents: 9000 }
              as: ProgramAdmin
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 3, per_student_price_cents: 7500 }
              as: ProgramAdmin
            - call: "POST /agreements/${agr_id}/activate"
              as: ProgramAdmin
            - call: "POST /sections"
              payload: { term_id: "${term_id}", subject_code: "ECON", catalog_number: "101", section_number: "001", instructor_user_id: "fac-1", max_concurrent_titles: 2 }
              as: Registrar
              captures: { sec_id: $.data.id, sec_v: $.data.version }
            - call: "POST /adoptions"
              payload: { section_id: "${sec_id}", title_id: "${t1_id}", access_start_date: "2026-08-24", access_end_date: "2026-12-12", expected_section_version: "${sec_v}" }
              as: Faculty
              as_user_id: "fac-1"
              captures: { adopt1_id: $.data.id }
            - call: "POST /adoptions/${adopt1_id}/submit"
              as: Faculty
              as_user_id: "fac-1"
            - call: "POST /adoptions/${adopt1_id}/approve"
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /sections/${sec_id}/flag-inclusive-access"
              as: ProgramAdmin
            - call: "POST /students"
              payload: { external_id: "S-1001", full_name: "Ada Lin", email: "ada@u.edu", program_code: "ECON-BA" }
              as: Registrar
              captures: { stu1_id: $.data.id }
            - call: "POST /students"
              payload: { external_id: "S-1002", full_name: "Ben Ortiz", email: "ben@u.edu", program_code: "ECON-BA" }
              as: Registrar
              captures: { stu2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /enrollments"
              payload: { section_id: "${sec_id}", student_id: "${stu1_id}", enrolled_on: "2026-08-24" }
              as: Registrar
            - call: "POST /enrollments"
              payload: { section_id: "${sec_id}", student_id: "${stu2_id}", enrolled_on: "2026-08-24" }
              as: Registrar
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sections/${sec_id}/post-charges"
              as: BursarOfficer
              captures: { chg1_id: "$.data[0].id", chg2_id: "$.data[1].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T23:59:59.999Z" }
              as: ProgramAdmin
            - call: "POST /opt-out-requests"
              payload: { charge_id: "${chg1_id}", reason_code: "COST" }
              as: Student
              as_user_id: "${stu1_id}"
              captures: { oo1_id: $.data.id }
            - call: "POST /opt-out-requests"
              payload: { charge_id: "${chg1_id}", reason_code: "OWNS_COPY" }
              as: Student
              as_user_id: "${stu1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /opt-out-requests"
              payload: { charge_id: "${chg2_id}", reason_code: "COST" }
              as: Student
              as_user_id: "${stu2_id}"
            - call: "POST /opt-out-requests/${oo1_id}/grant"
              as: BursarOfficer
              as_user_id: "bo-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T23:59:59.999Z" }
              as: ProgramAdmin
            - call: "POST /opt-out-requests/${oo1_id}/grant"
              as: BursarOfficer
              as_user_id: "bo-1"
          assert:
            - "Trigger call 2 -> HTTP 201 at the exact deadline instant: OptOutRequest.${oo1_id}.status == SUBMITTED, cycle_count == 0, refund_amount_cents == 0"
            - "Trigger call 3 -> HTTP 409 ERR_DUPLICATE_OPT_OUT_OPEN (89 fires while the window gate at 77 is still satisfied) and GET /charges/${chg1_id}/opt-out-requests returns total_count == 1"
            - "Trigger call 5 -> HTTP 409 ERR_OPT_OUT_WINDOW_CLOSED one millisecond past 2026-09-04T23:59:59.999Z and no OptOutRequest row exists for ${chg2_id}"
            - "Trigger call 6 -> HTTP 409 ERR_OPT_OUT_WINDOW_CLOSED: the grant is window-gated too, and OptOutRequest.${oo1_id}.status is still SUBMITTED"
            - "Trigger call 8 -> HTTP 200: OptOutRequest.${oo1_id}.status == GRANTED, refund_amount_cents == 9450, decided_by_user_id == bo-1, decided_at == 2026-09-04T23:59:59.999Z"
            - "StudentCharge.${chg1_id}: billing_status == REFUNDED, access_status == REVOKED, refunded_amount_cents == 9450, net_billed_cents == 0, publisher_share_cents == 0"
            - "GET /charges/${chg1_id}/ledger-entries returns total_count == 2 (CHARGE +9450 then REFUND -9450) summing to 0 and Student.${stu1_id}.bursar_balance_cents == 0"
            - "CourseSection.${sec_id}: enrolled_count == 2, provisioned_access_count == 1, revoked_access_count == 1, participation_rate == 0.5000, ia_status == BILLED (>= MIN_PARTICIPATION_RATE)"

      - name: validation_settlement_requires_locked_term
