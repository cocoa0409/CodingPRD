            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v1}", check_type: "REFERENCE" }, as: Volunteer, as_user_id: "${v1}", captures: { c_rf: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v1}", check_type: "SAFE_MINISTRY_TRAINING" }, as: Volunteer, as_user_id: "${v1}", captures: { c_tr: $.data.id } }
            - { call: "POST /vbs/screening-checks/${c_bg}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /vbs/screening-checks/${c_rf}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "GET /vbs/role-assignments/${asg1}", payload: {}, as: VolunteerCoordinator, captures: { asg_mid: $.data.status } }
          trigger:
            - { call: "POST /vbs/screening-checks/${c_tr}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "GET /vbs/volunteers/${v1}", payload: {}, as: VolunteerCoordinator, captures: { v_status: $.data.status } }
