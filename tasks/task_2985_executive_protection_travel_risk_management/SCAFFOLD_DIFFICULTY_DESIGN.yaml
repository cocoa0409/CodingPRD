  - rule_id: cross_entity_state_dependency
    instances:

      - name: trip_submit_gated_on_risk_assessment_status_then_unblocked_by_approval
        grounds:
          - validations[priority=42]
          - errors.ERR_ASSESSMENT_NOT_APPROVED
          - state_machines.Trip.DRAFT_to_PENDING_REVIEW
          - state_machines.RiskAssessment.SUBMITTED_to_APPROVED
          - state_machines.ProtectiveDetailAssignment.null_to_CONFIRMED
          - entities.Trip.risk_assessment_id
        distinguishing_aspect: |
          Entity pair TRIP -> RISK_ASSESSMENT. The Trip is complete in every respect that can
          be observed on the Trip itself — it has a leg, its advance work is recorded
          COMPLETE, it carries a VERIFIED policy with ample coverage, and its cost fits the
          budget — yet submit-for-approval must fail solely because a DIFFERENT entity, the
          RiskAssessment it points at, is still DRAFT. Nothing about the trip changes between
          the failing call and the succeeding one: the only mutation is two calls against the
          assessment. The same dependency is visible a second time on
          POST /exec-protection/detail-assignments, which cannot be issued at all while the
          assessment is DRAFT, which is why the trip's provisional cost is 0 on the first
          attempt and 112500 on the second.
