              captures: { launch_c3_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/launch-queues"
              payload: { member_id: "${mem_chain}", launch_id: "${launch_c3}", priority_class: "GENERAL", requested_units: 2 }
              as: StoreAssociate
              captures: { q_chain: $.data.id }
            - call: "POST /stores/launch-queues/grant"
              payload: { launch_id: "${launch_c3}", expected_theme_launch_version: "${launch_c3_v1}" }
              as: StoreAssociate
              captures: { q_chain_v1: "$.data[0].version" }
            - call: "POST /stores/launch-queues/{id}/verify-identity"
              payload: { check_result: "PASS", expected_queue_version: "${q_chain_v1}" }
              as: StoreAssociate
              captures: { q_chain_v2: $.data.version }
            - call: "POST /stores/fusion-orders"
              payload: { store_id: "${store8_id}", member_id: "${mem_chain}", cup_size: "LARGE", pricing_model: "CUP_FILL", declared_mass_grams: 400 }
              as: StoreAssociate
              captures: { ord_chain: $.data.id }
            - call: "POST /stores/fusion-orders/{id}/allocations"
              payload: { wall_bin_id: "${bin_h01}", allocation_grams: 400 }
              as: StoreAssociate
              captures: { ord_chain_v1: $.data.version }
            - call: "POST /stores/fusion-orders/{id}/checkout"
              payload: { expected_fusion_order_version: "${ord_chain_v1}", exclusive_launch_id: "${launch_c3}" }
              as: Member
              as_user_id: "${mem_chain}"
              captures: { ord_chain_v2: $.data.version }
            - call: "POST /stores/fusion-orders/{id}/void"
              payload: { expected_fusion_order_version: "${ord_chain_v2}" }
              as: Member
              as_user_id: "${mem_chain}"
              captures: { ord_chain_void: $.data.status }
          trigger:
            - call: "POST /stores/{id}/run_epoch"
              payload: {}
              as: PlatformAdmin
              captures: { store8_v2: $.data.version, q_chain_status: $.data.stage }
          assert:
            - "FusionOrder.${ord_chain}.status == VOID after the void"
            - "LaunchQueue.${q_chain}.status == WAITING after the wave-reconcile rollback hop"
            - "ThemeLaunch.${launch_c3}.exclusive_set_units_remaining == 1 and ThemeLaunch.${launch_c3}.stage == STAGED_OPEN"

      - name: suspended_promotion_restocks_the_wall_and_returns_the_store_to_trading
        grounds:
          - state_machines.MiniBuildReservation.REGISTERED_to_PASSED
          - calculations.launch_queue_priority_reclass
          - calculations.waitlist_promotion
          - calculations.wall_engine_mass_and_posture
          - state_machines.Store.RESTRICTED_to_TRADING
        distinguishing_aspect: "A depth-2 chain where each hop is caused by the previous one: the check-in promotes a waitlisted member, that promotion reclassifies the member's queue row to VIP_EARLY, and it is the VIP eligibility that the grant batch then consumes."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0009 with wall_bin_capacity_grams 2000, element 3040, two members, one bin holding 600 g where element 3040 sits in a RETIRED bin so the empty bin cannot auto-backfill, event on 2026-09-02 with capacity 1, and launch LEGO-C4 releasing on 2026-09-02 with 5 units."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "LEGO-0009", display_name: "Brick Yard Promote", wall_bin_capacity_grams: 2000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { store9_id: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "3040", element_name: "Plate 2x4", theme: "Icons", unit_mass_grams: 1.6, cost_basis_cents: 5, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { elem_3040: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_pro@example.com", display_name: "Promoted Member", home_store_id: "${store9_id}" }
              as: PlatformAdmin
              captures: { mem_pro: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_wait@example.com", display_name: "Waiting Member", home_store_id: "${store9_id}" }
              as: PlatformAdmin
              captures: { mem_wait: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store9_id}", element_id: "${elem_3040}", bin_label: "I01", bin_capacity_grams: 2000, bin_mass_grams: 600 }
              as: StoreAssociate
              captures: { bin_i01: $.data.id }
            - call: "POST /stores/store-events"
              payload: { store_id: "${store9_id}", event_kind: "MINI_BUILD", title: "Monthly Mini Build", capacity_units: 1, days_from_default_clock: 1, duration_hours: 2 }
              as: StoreAssociate
              captures: { ev_pro: $.data.id }
            - call: "POST /stores/mini-build-reservations"
              payload: { store_event_id: "${ev_pro}", member_id: "${mem_pro}", seats: 1 }
              as: StoreAssociate
              captures: { res_pro: $.data.id }
            - call: "POST /stores/mini-build-reservations"
              payload: { store_event_id: "${ev_pro}", member_id: "${mem_wait}", seats: 1 }
              as: StoreAssociate
              captures: { res_wait: $.data.id }
            - call: "POST /stores/theme-launches"
              payload: { theme: "Icons", exclusive_set_sku: "LEGO-C4", allocated_exclusive_units: 5, exclusive_set_unit_price_cents: 1300, per_customer_limit: 1, days_from_default_clock: 1, vip_early_days_before_release: 0 }
              as: PlatformAdmin
              captures: { launch_c4: $.data.id }
            - call: "POST /stores/launch-queues"
              payload: { member_id: "${mem_wait}", launch_id: "${launch_c4}", priority_class: "GENERAL", requested_units: 1 }
              as: StoreAssociate
              captures: { q_wait: $.data.id }
          trigger:
            - call: "POST /stores/mini-build-reservations/{id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_wait}"
              captures: { res_wait_status: $.data.status }
            - call: "POST /stores/mini-build-reservations/{id}/check-in"
              payload: {}
              as: Member
              as_user_id: "${mem_wait}"
              captures: { res_wait_v: $.data.version }
            - call: "POST /stores/mini-build-reservations/{id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_pro}"
              captures: { res_pro_status: $.data.status }
          assert:
            - "the promotion returns MiniBuildReservation.${res_wait}.status == PROMOTED"
            - "Member.${mem_wait}.tier == VIP and LaunchQueue.${q_wait}.priority_class == VIP_EARLY"
            - "StoreEvent.${ev_pro}.registered_count == 1"
            - "Member.${mem_wait}.passed_mb_reservations == 1"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: touching_event_slots_are_admitted_by_half_open_semantics
        grounds:
          - errors[ERR_EVENT_SLOT_OVERLAP]
          - endpoints.POST_/stores/store-events
          - entities.StoreEvent.fields.start_utc
        distinguishing_aspect: "Event slots use half-open [start, end) intervals with no buffer: a second slot starting exactly at the first slot's end is admitted, while a slot starting one minute earlier is rejected with ERR_EVENT_SLOT_OVERLAP."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0016 with wall_bin_capacity_grams 1000, one element, one bin holding 600 g, and one event slot on 2026-09-02 from 10:00 to 12:00."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "LEGO-0016", display_name: "Brick Yard Window", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { store16_id: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "3110", element_name: "Brick 1x6", theme: "Town", unit_mass_grams: 1.3, cost_basis_cents: 5, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { elem_3110: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store16_id}", element_id: "${elem_3110}", bin_label: "Q01", bin_capacity_grams: 1000, bin_mass_grams: 600 }
              as: StoreAssociate
              captures: { bin_q01: $.data.id }
            - call: "POST /stores/store-events"
              payload: { store_id: "${store16_id}", event_kind: "BUILD_EVENT", title: "Morning Build", capacity_units: 1, days_from_default_clock: 1, duration_hours: 2, start_offset_hours: 10 }
              as: StoreAssociate
              captures: { ev_morning: $.data.id, ev_morning_start: $.data.start_utc, ev_morning_end: $.data.end_utc }
          trigger:
            - call: "POST /stores/store-events"
              payload: { store_id: "${store16_id}", event_kind: "BUILD_EVENT", title: "Noon Build", capacity_units: 1, days_from_default_clock: 1, duration_hours: 2, start_offset_hours: 12 }
              as: StoreAssociate
              captures: { ev_noon: $.data.id, ev_noon_start: $.data.start_utc }
            - call: "POST /stores/store-events"
              payload: { store_id: "${store16_id}", event_kind: "BUILD_EVENT", title: "Overlap Build", capacity_units: 1, days_from_default_clock: 1, duration_hours: 1, start_offset_hours: 11 }
              as: StoreAssociate
              captures: { overlap_err: $.data.error_id }
          assert:
            - "StoreEvent.${ev_morning}.start_utc == \"2026-09-02T10:00:00Z\" and StoreEvent.${ev_morning}.end_utc == \"2026-09-02T12:00:00Z\""
            - "StoreEvent.${ev_noon}.start_utc == \"2026-09-02T12:00:00Z\" and it is admitted because the boundary touches"
            - "the 11:00 slot returns error_id == ERR_EVENT_SLOT_OVERLAP"

      - name: launch_identity_windows_use_positive_width_and_closed_open_overlap
        grounds:
          - errors[ERR_LAUNCH_WINDOW_INVALID]
          - errors[ERR_LAUNCH_WINDOW_OVERLAP]
          - entities.ThemeLaunch.fields.vip_early_access_utc
        distinguishing_aspect: "Launch identity windows are half-open [vip_early_access_utc, release_utc) and may touch, but a window of zero width is a different failure: a third launch whose early-access instant equals its own release instant returns ERR_LAUNCH_WINDOW_INVALID rather than the overlap error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0017 with wall_bin_capacity_grams 1000, one element, one bin holding 600 g, and a Town launch on 2026-09-04 with one day of early access and an Icons launch on 2026-09-05 with one day of early access."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "LEGO-0017", display_name: "Brick Yard Launch", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { store17_id: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "3120", element_name: "Slope 2x4", theme: "Town", unit_mass_grams: 1.7, cost_basis_cents: 6, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { elem_3120: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store17_id}", element_id: "${elem_3120}", bin_label: "R01", bin_capacity_grams: 1000, bin_mass_grams: 600 }
              as: StoreAssociate
              captures: { bin_r01: $.data.id }
            - call: "POST /stores/theme-launches"
              payload: { theme: "Town", exclusive_set_sku: "LEGO-E1", allocated_exclusive_units: 5, exclusive_set_unit_price_cents: 1400, per_customer_limit: 1, days_from_default_clock: 10, vip_early_days_before_release: 1 }
              as: PlatformAdmin
              captures: { launch_e1: $.data.id, e1_early: $.data.vip_early_access_utc }
            - call: "POST /stores/theme-launches"
              payload: { theme: "Icons", exclusive_set_sku: "LEGO-E2", allocated_exclusive_units: 5, exclusive_set_unit_price_cents: 1400, per_customer_limit: 1, days_from_default_clock: 11, vip_early_days_before_release: 1 }
              as: PlatformAdmin
              captures: { launch_e2: $.data.id, e2_early: $.data.vip_early_access_utc }
          trigger:
            - call: "POST /stores/theme-launches"
              payload: { theme: "Town", exclusive_set_sku: "LEGO-E3", allocated_exclusive_units: 5, exclusive_set_unit_price_cents: 1400, per_customer_limit: 1, days_from_default_clock: 13, vip_early_days_before_release: 1 }
              as: PlatformAdmin
              captures: { e3_overlap_err: $.data.error_id }
            - call: "POST /stores/theme-launches"
              payload: { theme: "Technic", exclusive_set_sku: "LEGO-E4", allocated_exclusive_units: 5, exclusive_set_unit_price_cents: 1400, per_customer_limit: 1, days_from_default_clock: 6, vip_early_days_before_release: 0 }
              as: PlatformAdmin
              captures: { e4_invalid_err: $.data.error_id }
          assert:
            - "the Town relaunch whose window is 2026-09-10..2026-09-11 returns error_id == ERR_LAUNCH_WINDOW_OVERLAP, because that interval sits inside the 2026-09-09..2026-09-11 window"
            - "the Technic launch of zero width returns error_id == ERR_LAUNCH_WINDOW_INVALID"
            - "ThemeLaunch.${launch_e1}.vip_early_access_utc == \"2026-09-09T00:00:00Z\""
            - "ThemeLaunch.${launch_e2}.vip_early_access_utc == \"2026-09-10T00:00:00Z\""

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: void_then_checkout_again_conserves_the_wall_engine_mass
        grounds:
          - state_machines.FusionOrder.SETTLED_to_VOID
          - state_machines.Store.RESTRICTED_to_TRADING
          - calculations.wall_engine_mass_and_posture
          - calculations.store_shrinkage_basis_points
        distinguishing_aspect: "A forward cup draw paired with its voiding leaves the store's bin_engine_mass_grams exactly where it started at 600 g, so the posture walks RESTRICTED then back to TRADING with zero drift in the conserved mass."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0018 with wall_bin_capacity_grams 2000, one element, one often-voided bin holding 600 g, and one member."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "LEGO-0018", display_name: "Brick Yard Conserve", wall_bin_capacity_grams: 2000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { store18_id: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "3130", element_name: "Technic Pin", theme: "Technic", unit_mass_grams: 0.5, cost_basis_cents: 2, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { elem_3130: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_inv@example.com", display_name: "Invariant Member", home_store_id: "${store18_id}" }
              as: PlatformAdmin
              captures: { mem_inv: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store18_id}", element_id: "${elem_3130}", bin_label: "S01", bin_capacity_grams: 2000, bin_mass_grams: 600 }
              as: StoreAssociate
              captures: { bin_s01: $.data.id }
          trigger:
            - call: "POST /stores/fusion-orders"
              payload: { store_id: "${store18_id}", member_id: "${mem_inv}", cup_size: "LARGE", pricing_model: "CUP_FILL", declared_mass_grams: 400 }
              as: StoreAssociate
              captures: { ord_inv: $.data.id }
            - call: "POST /stores/fusion-orders/{id}/allocations"
              payload: { wall_bin_id: "${bin_s01}", allocation_grams: 400 }
              as: StoreAssociate
              captures: { ord_inv_v1: $.data.version }
            - call: "POST /stores/fusion-orders/{id}/checkout"
              payload: { expected_fusion_order_version: "${ord_inv_v1}" }
              as: Member
              as_user_id: "${mem_inv}"
              captures: { ord_inv_v2: $.data.version }
            - call: "POST /stores/fusion-orders/{id}/void"
              payload: { expected_fusion_order_version: "${ord_inv_v2}" }
              as: Member
              as_user_id: "${mem_inv}"
              captures: { ord_inv_void: $.data.status }
          assert:
            - "Store.${store18_id}.bin_engine_mass_grams == 200 after the draw, below the 200 g restricted edge"
            - "WallBin.${bin_s01}.bin_mass_grams == 200 immediately after the draw"
            - "FusionOrder.${ord_inv}.status == VOID"
            - "WallBin.${bin_s01}.bin_mass_grams == 600 after the void, restoring the opening mass exactly"
            - "Store.${store18_id}.bin_engine_mass_grams == 600 after the void"

      - name: additive_points_ledger_conserves_the_member_balance
        grounds:
          - calculations.replacement_points_award
          - calculations.per_customer_limit_check
          - endpoints.POST_/stores/loyalty-ledger
          - entities.Member.fields.points_balance
        distinguishing_aspect: "A different conserved quantity from the wall mass: a positive ledger posting, a negative ledger posting and a substitute transfer all move points around a closed ledger, so the member's balance returns to 500 cents-equivalent points with zero creation or destruction."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0019 with wall_bin_capacity_grams 1000, one element, one bin holding 600 g, one member opened with a 500-point ledger grant, a third-party member, and a launch LEGO-F1 allocated 2 units with per_customer_limit 1."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "LEGO-0019", display_name: "Brick Yard Points", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { store19_id: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "3140", element_name: "Trans Clear Plate", theme: "Town", unit_mass_grams: 0.6, cost_basis_cents: 3, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { elem_3140: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_pts@example.com", display_name: "Points Member", home_store_id: "${store19_id}" }
              as: PlatformAdmin
              captures: { mem_pts: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_other@example.com", display_name: "Other Member", home_store_id: "${store19_id}" }
              as: PlatformAdmin
              captures: { mem_other: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store19_id}", element_id: "${elem_3140}", bin_label: "T01", bin_capacity_grams: 1000, bin_mass_grams: 600 }
              as: StoreAssociate
              captures: { bin_t01: $.data.id }
            - call: "POST /stores/loyalty-ledger"
              payload: { member_id: "${mem_pts}", entry_kind: "MANUAL_ADJUSTMENT", points_delta: 500, reason: "Welcome bonus" }
              as: PlatformAdmin
              captures: { ledger_bonus: $.data.id }
            - call: "POST /stores/theme-launches"
              payload: { theme: "Town", exclusive_set_sku: "LEGO-F1", allocated_exclusive_units: 2, exclusive_set_unit_price_cents: 1400, per_customer_limit: 1, days_from_default_clock: 3, vip_early_days_before_release: 1 }
              as: PlatformAdmin
              captures: { launch_f1: $.data.id }
          trigger:
            - call: "POST /stores/loyalty-ledger"
              payload: { member_id: "${mem_pts}", entry_kind: "REDEMPTION", points_delta: -250, reason: "In-store reward" }
              as: PlatformAdmin
              captures: { ledger_redeem: $.data.id }
            - call: "POST /stores/loyalty-ledger"
              payload: { member_id: "${mem_other}", entry_kind: "MANUAL_ADJUSTMENT", points_delta: 250, reason: "Replacement grant" }
              as: PlatformAdmin
              captures: { ledger_grant: $.data.id }
          assert:
            - "Member.${mem_pts}.points_balance == 250 after the redemption"
            - "Member.${mem_other}.points_balance == 250 after the compensating grant"
            - "Member.${mem_pts}.version == 3"
