              captures: { dv_k600_est: "$.data.unearned_premium_estimate_cents", dv_k600_earned: "$.data.earned_days" }
            - call: "GET /policies/${dv_k302}"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-execute"
              captures: { dv_k302_est: "$.data.unearned_premium_estimate_cents" }
            - call: "GET /policies/${dv_k305}"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-execute"
              captures: { dv_k305_est: "$.data.unearned_premium_estimate_cents" }
            - call: "GET /carrier-cancellation-requests"
              payload: { agreement_id: "${dv_k}", limit: 50 }
              as: FinanceAnalyst
              as_user_id: "analyst-execute"
              captures: { dv_k_req_status: "$.data[0].status" }
          assert:
            - "the two notes priced normally before anything was cancelled: ${dv_t_top} == 539650 for note T, and for note K ${dv_k_af} == 1109000 == 1207000 - 100000 + 2000, ${dv_k_fc} == 83175 == round_half_up(1109000 * 1500 * 6 / 120000) and ${dv_k_top} == 1192175"
            - "both notes went delinquent on the same sweep and were noticed on the same day: ${dv_sweep_late} == 2, ${dv_sweep_fees} == 2 (4497 on note T's 89941 installment and 9935 == round_half_up(198695 * 500 / 10000) on note K's), and ${dv_t_notice_eff} == ${dv_k_notice_eff} == '2026-10-22'"
            - "VARIANT DIVERGENCE ON THE IDENTICAL POLICY: policy ${dv_t600} and policy ${dv_k600} carry the same 600000 premium, the same 2026-09-01 to 2027-09-01 term and the same 2026-10-22 cancellation, yet ${dv_t600_est} == 516164 == round_half_up(600000 * 314 / 365) under PRO_RATA while ${dv_k600_est} == 464548 == round_half_up(516164 * 9000 / 10000) under SHORT_RATE — a delta of exactly 51616, which is the 1000-bps penalty the OK regime withholds"
            - "the earned/unearned split itself is regime-independent: ${dv_t600_earned} == ${dv_k600_earned} == 51 == min(365, max(0, days from 2026-09-01 to 2026-10-22)), so unearned_days == 314 in both cases and only the method differs"
            - "PENALTY APPLIED TO THE ALREADY ROUNDED PRO-RATA FIGURE: ${dv_k302_est} == 233823 == round_half_up(259803 * 9000 / 10000), NOT 233822 == round_half_up(302000 * 314 * 9000 / (365 * 10000)); and ${dv_k305_est} == 236146 == round_half_up(262384 * 9000 / 10000), NOT 236145 — collapsing the two roundings into one expression is off by a cent on both policies"
            - "AGGREGATE ROUNDS PER POLICY THEN SUMS: ${dv_k_unearned} == 934517 == 233823 + 236146 + 464548, NOT 934516 == round_half_up((259803 + 262384 + 516164) * 9000 / 10000) — summing the pro-rata figures and applying the penalty once is a different number"
            - "the PRO_RATA note needs no such care because it has one policy: ${dv_t_unearned} == 516164 and ${dv_t_reqs} == 1, while ${dv_k_reqs} == 3 (one carrier request per VERIFIED policy)"
            - "the rest of each settlement is untouched by the variant: ${dv_t_rebate} == 37650 and ${dv_t_gross} == 506497 == 502000 + 37650 - 37650 + 4497; ${dv_k_rebate} == 83175 and ${dv_k_gross} == 1118935 == 1109000 + 83175 - 83175 + 9935; in both cases r == 6 because no installment ever reached PAID"
            - "the executions really did cancel the policies rather than only estimate: ${dv_t600_status} == 'CANCELLED' and ${dv_k_req_status} == 'REQUESTED' with total_count == 3 for note K"

  # ---------------------------------------------------------------------------
  # §1.9 — Consistency Model. complexity_profile.consistency_model is `immediate`,
  # so there is exactly one row to walk: every derived field is correct inside the
  # response of the write that caused it, and an immediate read agrees with it.
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:

      - name: immediate_consistency_every_derived_field_is_correct_in_the_causing_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
          - endpoints.POST_/agreements/{id}/activate
        distinguishing_aspect: |
          `immediate` is the easiest row to state and the easiest to violate by accident, because this
          domain's derived state is spread across entities: a policy write moves the note's
          policy_count, an attestation moves verified_policy_count and re-derives
          financed_premium_cents, activation materialises six Installment rows, and a payment moves
          three balances plus the payoff quote. The claim is deliberately made in the strong form —
          the value must be right in the response of the write ITSELF, and a read issued immediately
          afterwards must return the identical number. No re-read, retry or settling delay is
          permitted anywhere, and a list endpoint's total_count must already count the row created by
          the request immediately before it. This also pins the response envelope: each write returns
          the full post-write representation of its entity under `data`, not an acknowledgement stub
          that a client would have to follow with a GET to interpret.
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15 and the canonical TX regime has an effective License"
            - "an insured, an agency and a carrier exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { ic_rule: "$.data.id" }
            - call: "POST /state-rate-rules/${ic_rule}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Cascade Logistics Inc", mailing_state_code: "TX", email: "ap@cascade.example" }
              as: FinanceAnalyst
              captures: { ic_insured: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { ic_agent: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { ic_insurer: "$.data.id" }
          trigger:
            - call: "POST /agreements"
              payload: { insured_id: "${ic_insured}", producer_agent_id: "${ic_agent}", state_rule_id: "${ic_rule}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_agr: "$.data.id", ic_w_status: "$.data.status", ic_w_stage: "$.data.delinquency_stage", ic_w_count: "$.data.policy_count" }
            - call: "GET /agreements/${ic_agr}"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_r_status: "$.data.status", ic_r_stage: "$.data.delinquency_stage", ic_r_count: "$.data.policy_count" }
            - call: "POST /agreements/${ic_agr}/policies"
              payload: { insurer_id: "${ic_insurer}", policy_number: "MC-IC-1", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_pol: "$.data.id", ic_w_financed: "$.data.financed_premium_cents", ic_w_pol_status: "$.data.status" }
            - call: "GET /agreements/${ic_agr}"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_r_count2: "$.data.policy_count" }
            - call: "POST /agreements/${ic_agr}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_w_top: "$.data.total_of_payments_cents", ic_w_basis: "$.data.quote_basis", ic_w_rate: "$.data.effective_annual_rate_bps" }
            - call: "POST /policies/${ic_pol}/verifications"
              payload: { decision: "CONFIRMED" }
              as: Insurer
              as_user_id: "${ic_insurer}"
            - call: "GET /policies/${ic_pol}"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_r_pol_half: "$.data.status" }
            - call: "POST /policies/${ic_pol}/verifications"
              payload: { decision: "CONFIRMED" }
              as: ProducerAgent
              as_user_id: "${ic_agent}"
            - call: "GET /policies/${ic_pol}"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_r_pol_full: "$.data.status", ic_r_verified_prem: "$.data.verified_premium_cents", ic_r_financed: "$.data.financed_premium_cents" }
            - call: "GET /agreements/${ic_agr}"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_r_vcount: "$.data.verified_policy_count" }
            - call: "POST /agreements/${ic_agr}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_w_prin: "$.data.principal_balance_cents", ic_w_ufc: "$.data.unpaid_finance_charge_cents", ic_w_act_at: "$.data.activated_at", ic_w_basis2: "$.data.quote_basis" }
            - call: "GET /agreements/${ic_agr}/installments"
              payload: { limit: 50 }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_r_i1_amt: "$.data[0].amount_cents", ic_r_i1_status: "$.data[0].status" }
            - call: "POST /agreements/${ic_agr}/payments"
              payload: { amount_cents: 89941, received_date: "2026-08-15", method: "ACH" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_w_pay_variant: "$.data.allocation_variant", ic_w_pay_fc: "$.data.applied_finance_charge_cents", ic_w_pay_prin: "$.data.applied_principal_cents", ic_w_pay_fee: "$.data.applied_late_fee_cents", ic_w_pay_unapp: "$.data.applied_unapplied_cents", ic_w_pay_rebate: "$.data.rebate_applied_cents" }
            - call: "GET /agreements/${ic_agr}"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_r_prin: "$.data.principal_balance_cents", ic_r_ufc: "$.data.unpaid_finance_charge_cents" }
            - call: "GET /agreements/${ic_agr}/installments"
              payload: { status: "PAID", limit: 50 }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_r_paid_status: "$.data[0].status" }
            - call: "GET /agreements/${ic_agr}/payments"
              payload: { limit: 50 }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_r_pay_id: "$.data[0].id" }
            - call: "GET /agreements/${ic_agr}/payoff-quote"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ic_r_q_rebate: "$.data.unearned_finance_charge_rebate_cents", ic_r_q_net: "$.data.net_payoff_cents" }
          assert:
            - "THE CREATE RESPONSE IS ALREADY THE FULL ROW: ${ic_w_status} == 'DRAFT', ${ic_w_stage} == 'CURRENT' and ${ic_w_count} == 0, and the immediate read agrees field for field — ${ic_r_status} == ${ic_w_status}, ${ic_r_stage} == ${ic_w_stage}, ${ic_r_count} == ${ic_w_count}"
            - "A CROSS-ENTITY COUNTER MOVES INSIDE THE SAME REQUEST: the policy write returns ${ic_w_financed} == 600000 provisionally with ${ic_w_pol_status} == 'PENDING_VERIFICATION', and the very next read shows ${ic_r_count2} == 1 — policy_count is not a nightly rollup"
            - "the submit response itself carries the recomputed quote, with no follow-up GET needed to see it: ${ic_w_top} == 539650, ${ic_w_rate} == 1500 and ${ic_w_basis} == 'PROVISIONAL'"
            - "a half-attested policy is visible as half-attested rather than as an optimistic guess: ${ic_r_pol_half} == 'PENDING_VERIFICATION' after the carrier's record and ${ic_r_pol_full} == 'VERIFIED' immediately after the agency's, with ${ic_r_verified_prem} == 600000 and ${ic_r_financed} == 600000 re-derived in that same instant, and ${ic_r_vcount} == 1 on the note"
            - "ACTIVATION IS COMPLETE WHEN IT RETURNS: ${ic_w_prin} == 502000, ${ic_w_ufc} == 37650, ${ic_w_basis2} == 'FINAL' and ${ic_w_act_at} == '2026-08-15T00:00:00Z', and the schedule is queryable at once — ${ic_r_i1_amt} == 89941 == floor(539650 / 6) with ${ic_r_i1_status} == 'SCHEDULED' and total_count == 6"
            - "THE PAYMENT RESPONSE CARRIES ITS OWN ALLOCATION: ${ic_w_pay_variant} == 'STANDARD' (89941 is far below the 502000 net payoff), ${ic_w_pay_fee} == 0, ${ic_w_pay_fc} == 6275, ${ic_w_pay_prin} == 83666, ${ic_w_pay_unapp} == 0 and ${ic_w_pay_rebate} == 0"
            - "and every consequence of that payment is already visible: ${ic_r_prin} == 418334 == 502000 - 83666, ${ic_r_ufc} == 31375 == 37650 - 6275, ${ic_r_paid_status} == 'PAID' with total_count == 1 for the PAID filter, and ${ic_r_pay_id} is the id the POST just returned with total_count == 1"
            - "even the recomputed derived read follows immediately: ${ic_r_q_rebate} == 26893 == round_half_up(37650 * 5 * 6 / (6 * 7)) with r == 5 after exactly one installment reached PAID, and ${ic_r_q_net} == 422816 == 418334 + 31375 - 26893 + 0 - 0"
            - "no assertion in this instance is allowed a retry, a sleep or a second read to become true — the consistency_model is `immediate`, not `eventual`"
