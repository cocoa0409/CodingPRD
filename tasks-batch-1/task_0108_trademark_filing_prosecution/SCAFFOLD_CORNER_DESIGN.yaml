scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_applicant_returns_201_with_computed_foreign_flag
        claim_type: Creation
        grounds: [entities.Applicant.fields.is_foreign_domiciled, "endpoints[POST /applicants]"]
        distinguishing_aspect: "POST /applicants with country_code 'GB' returns 201 and is_foreign_domiciled == true; a 'US' applicant returns is_foreign_domiciled == false."
        test_recipe:
          setup: ["empty DB; an Attorney exists to act"]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-200", bar_state: "NY" }
              as: Attorney
          trigger:
            - call: "POST /applicants"
              payload: { legal_name: "Foreign Ltd", entity_type: "CORPORATION", country_code: "GB" }
              as: Attorney
              captures: { foreign_id: $.data.id, ff: $.data.is_foreign_domiciled }
          assert:
            - "response status == 201"
            - "data.is_foreign_domiciled == true"
            - "data.open_application_count == 0"

      - name: get_application_not_found_returns_404
        claim_type: Not Found
        grounds: ["endpoints[GET /applications/{id}]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /applications/{random-uuid} for a non-existent id returns ERR_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_application_missing_filing_basis_returns_validation
        claim_type: Required Fields
        grounds: [entities.TrademarkApplication.fields.filing_basis, "endpoints[POST /applications]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /applications omitting the required filing_basis field returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["an Attorney and US Applicant exist"]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-201", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Acme US", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { acme_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "NOBASIS", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_VALIDATION"

      - name: create_application_invalid_filing_basis_enum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.TrademarkApplication.fields.filing_basis, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /applications with filing_basis 'SECTION_44' (not in {USE, INTENT}) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["an Attorney and US Applicant exist"]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-202", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Acme US", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { acme_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "BADENUM", filing_basis: "SECTION_44", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_VALIDATION"

      - name: computed_class_count_ignores_duplicate_nice_class
        claim_type: Computed Fields
        grounds: [entities.TrademarkApplication.fields.class_count, "endpoints[POST /applications/{id}/goods-services]"]
        distinguishing_aspect: "Adding two GoodsServicesItem rows under the SAME nice_class_id yields class_count == 1 (distinct count), not 2."
        test_recipe:
          setup: ["clock 2026-01-01; class 9 seeded; Attorney; US Applicant; a DRAFT app with two items in the same class 9"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-203", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Acme US", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { acme_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "DISTINCT", filing_basis: "USE", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software" }
              as: Attorney
              as_user_id: "${att_id}"
          trigger:
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "mobile apps" }
              as: Attorney
              as_user_id: "${att_id}"
          assert:
            - "GET /applications/${app_id} returns data.class_count == 1"

      - name: nice_class_immutable_computed_service_flag
        claim_type: Immutability
        grounds: [entities.NiceClass, entities.NiceClass.fields.is_service_class, "endpoints[POST /nice-classes]"]
        distinguishing_aspect: "NiceClass has common_fields:false and no update endpoint; seeding class 42 returns is_service_class == true (42 in 35..45)."
        test_recipe:
          setup: ["clock 2026-01-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
          trigger:
            - call: "POST /nice-classes"
              payload: { class_number: 42, title: "Tech services" }
              as: Examiner
              captures: { svc: $.data.is_service_class }
          assert:
            - "response status == 201"
            - "data.is_service_class == true"

      - name: duplicate_nice_class_number_returns_conflict
        claim_type: Type Constraints
        grounds: [entities.NiceClass.fields.class_number, "errors[ERR_DUPLICATE_NICE_CLASS]"]
        distinguishing_aspect: "Seeding class_number 9 twice returns ERR_DUPLICATE_NICE_CLASS (409) on the second POST."
        test_recipe:
          setup: ["class 9 already seeded"]
          setup_api_calls:
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
          trigger:
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software dup" }
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_DUPLICATE_NICE_CLASS"

      - name: duplicate_attorney_bar_number_returns_conflict
        claim_type: Type Constraints
        grounds: [entities.Attorney.fields.bar_number, "errors[ERR_DUPLICATE_BAR_NUMBER]"]
        distinguishing_aspect: "Registering a second Attorney with the same bar_number returns ERR_DUPLICATE_BAR_NUMBER (409)."
        test_recipe:
          setup: ["one Attorney with bar_number BAR-300 exists"]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "First Counsel", bar_number: "BAR-300", bar_state: "NY" }
              as: Attorney
          trigger:
            - call: "POST /attorneys"
              payload: { full_name: "Second Counsel", bar_number: "BAR-300", bar_state: "CA" }
              as: Attorney
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_DUPLICATE_BAR_NUMBER"

  # =========================================================================
  - section: state_machines
    instances:
      - name: assign_examination_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TrademarkApplication.FILED_to_UNDER_EXAMINATION, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /applications/{id}/assign-examination on a DRAFT (never-filed) application returns ERR_INVALID_STATE (409); status stays DRAFT."
        test_recipe:
          setup: ["clock 2026-01-01; class 9; Attorney; US Applicant; a DRAFT app with one item (never filed)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-301", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Acme US", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { acme_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "DRAFTONLY", filing_basis: "USE", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software" }
              as: Attorney
              as_user_id: "${att_id}"
          trigger:
            - call: "POST /applications/${app_id}/assign-examination"
              payload: {}
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "GET /applications/${app_id} returns data.status == DRAFT"

      - name: respond_twice_to_office_action_returns_already_closed
        claim_type: Idempotency
        grounds: [state_machines.TrademarkApplication.OFFICE_ACTION_ISSUED_to_UNDER_EXAMINATION, "validations[priority=6]", "errors[ERR_ACTION_ALREADY_CLOSED]"]
        distinguishing_aspect: "A second POST /office-action-responses against an OfficeAction already RESPONDED returns ERR_ACTION_ALREADY_CLOSED (409)."
        test_recipe:
          setup: ["clock 2026-01-01; class 9; Attorney; US Applicant; app filed, examined, non-final OA issued and responded once"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-302", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Acme US", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { acme_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "TWICE", filing_basis: "USE", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/assign-examination"
              payload: {}
              as: Examiner
            - call: "POST /office-actions"
              payload: { application_id: "${app_id}", ground: "IDENTIFICATION_INDEFINITE", is_final: false }
              as: Examiner
              captures: { oa_id: $.data.id }
            - call: "POST /office-action-responses"
              payload: { office_action_id: "${oa_id}", argument_text: "first response" }
              as: Attorney
              as_user_id: "${att_id}"
          trigger:
            - call: "POST /office-action-responses"
              payload: { office_action_id: "${oa_id}", argument_text: "second response" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_ACTION_ALREADY_CLOSED"

      - name: forward_from_pending_certification_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.MadridApplication.CERTIFIED_to_FORWARDED_TO_WIPO, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /madrid-applications/{id}/forward while still PENDING_CERTIFICATION (not yet certified) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["clock 2026-01-01; class 9; Attorney; US Applicant; USE app filed; a PENDING_CERTIFICATION Madrid app on it"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-303", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Acme US", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { acme_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "INTL", filing_basis: "USE", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /madrid-applications"
              payload: { basic_application_id: "${app_id}", designated_countries: ["FR"] }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { madrid_id: $.data.id }
          trigger:
            - call: "POST /madrid-applications/${madrid_id}/forward"
              payload: {}
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: ttab_enter_default_after_answer_deadline_sustains_and_abandons
        claim_type: Side Effect Execution
        grounds: [state_machines.TTABProceeding.defense_status=AWAITING_ANSWER_to_defense_status=DEFAULTED, entities.TrademarkApplication.fields.status]
        distinguishing_aspect: "Past the answer_deadline (2026-01-01 filed +40d => 2026-02-10) with no answer, enter-default sets defense_status DEFAULTED, claim_status SUSTAINED, and abandons the opposed application."
        test_recipe:
          setup: ["clock 2026-01-01; class 9; Attorney; owner + rival; USE app published; opposition instituted; clock advanced to 2026-03-01 (past answer_deadline 2026-02-10)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-304", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Owner Co", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { owner_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Rival Co", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { rival_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${owner_id}", attorney_id: "${att_id}", mark_text: "DEFAULTED", filing_basis: "USE", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/assign-examination"
              payload: {}
              as: Examiner
            - call: "POST /applications/${app_id}/approve-publication"
              payload: {}
              as: Examiner
            - call: "POST /ttab-proceedings"
              payload: { proceeding_type: "OPPOSITION", target_application_id: "${app_id}", petitioner_applicant_id: "${rival_id}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { proc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Examiner
          trigger:
            - call: "POST /ttab-proceedings/${proc_id}/enter-default"
              payload: {}
              as: TTABClerk
          assert:
            - "TTABProceeding.${proc_id}.defense_status == DEFAULTED"
            - "TTABProceeding.${proc_id}.claim_status == SUSTAINED"
            - "TrademarkApplication.${app_id}.status == ABANDONED"

      - name: register_terminal_lockdown_rejects_further_transition
        claim_type: Terminal State Lockdown
        grounds: [state_machines.TrademarkApplication.PUBLISHED_to_REGISTERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REGISTERED application (terminal) rejects POST /applications/{id}/approve-publication with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["clock 2026-01-01; class 9; Attorney; US Applicant; a USE app that has reached REGISTERED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-305", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Acme US", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { acme_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "LOCKED", filing_basis: "USE", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/assign-examination"
              payload: {}
              as: Examiner
            - call: "POST /applications/${app_id}/approve-publication"
              payload: {}
              as: Examiner
            - call: "POST /applications/${app_id}/register"
              payload: {}
              as: Examiner
          trigger:
            - call: "POST /applications/${app_id}/approve-publication"
              payload: {}
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: registration_grace_then_expire_terminal
        claim_type: Side Effect Execution
        grounds: [state_machines.Registration.GRACE_to_EXPIRED, entities.Registration.fields.next_maintenance_due_at]
        distinguishing_aspect: "A GRACE registration whose grace window elapsed (due 2032-01-01 + 180d = 2032-06-29) expires via POST /registrations/{id}/expire to EXPIRED with next_maintenance_due_at null."
        test_recipe:
          setup: ["clock 2026-01-01; class 9; Attorney; US Applicant; app registered; clock advanced past due (2032-01-02) and registration moved to GRACE; clock then 2032-07-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-306", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Acme US", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { acme_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "LAPSE", filing_basis: "USE", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/assign-examination"
              payload: {}
              as: Examiner
            - call: "POST /applications/${app_id}/approve-publication"
              payload: {}
              as: Examiner
            - call: "POST /applications/${app_id}/register"
              payload: {}
              as: Examiner
              captures: { reg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2032-01-02T00:00:00Z" }
              as: Examiner
            - call: "POST /registrations/${reg_id}/enter-grace"
              payload: {}
              as: Examiner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2032-07-01T00:00:00Z" }
              as: Examiner
          trigger:
            - call: "POST /registrations/${reg_id}/expire"
              payload: {}
              as: Examiner
          assert:
