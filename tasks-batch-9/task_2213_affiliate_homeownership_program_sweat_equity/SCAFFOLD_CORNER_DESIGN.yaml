            - "PAYOFF with a live balance: HTTP 409 and ${e_bal} == ERR_LIEN_BALANCE_OUTSTANDING — closing was 0 months ago so nothing has been forgiven and lien_outstanding_cents is still 1950000"
            - "TRANSFER_NOTICE: HTTP 200, lien_status == TRANSFER_PENDING and right_of_first_refusal_expires_on == 2026-09-04T12:00:00.000Z"
            - "RECAPTURE fifteen days in: HTTP 409 and ${e_rofr} == ERR_ROFR_WINDOW_OPEN — 2026-08-20T12:00 is before 2026-09-04T12:00"
            - "Application re-read: lien_status is still TRANSFER_PENDING, status still CLOSED, forbearance_counseling_sessions still 2, lien_outstanding_cents still 1950000"
            - "Program re-read: subsidy_disbursed_cents == 1950000 and subsidy_pool_cents == 5000000 — the refused recapture returned nothing to the pool"

      - name: an_impact_report_before_the_period_closes_is_refused
        claim_type: temporal_validation
        grounds: ["validations[priority=42]", errors.ERR_REPORTING_PERIOD_OPEN, entities.GrantAward.fields.period_end, entities.GrantAward.fields.status, "endpoints.POST /homeownership/grant-awards/{id}/impact-reports", "endpoints.POST /_clock/set_current_utc"]
        distinguishing_aspect: "Reporting is gated on the clock reaching the award's inclusive period_end, so the identical request is a 409 on 2026-08-01 and a 200 on 2026-10-01, and the award's status flips from OPEN to REPORTED only on the successful call."
        setup_note: "The grant is created with the endpoint's declared input names donor_name and amount_cents; entities.GrantAward spells the same two columns funder_name and award_amount_cents, an aliasing the PRD accepts. A repeat report on an already-REPORTED award is deliberately NOT probed: §1.6 says it errors, but no §1.4 row covers it and GrantAward.status has no state machine, so no error id is derivable."
        test_recipe:
          setup:
            - "Canonical program with one grant award covering 2026-08-01T00:00:00.000Z through 2026-09-30T23:59:59.999Z, targeting 3 households served, status OPEN. The logical clock is still at 2026-08-01T00:00:00.000Z, inside the period."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/grant-awards", payload: { program_id: "${prog_id}", award_code: "FHLB-2026-Q3", donor_name: "Federal Home Loan Bank", amount_cents: 2500000, period_start: "2026-08-01T00:00:00.000Z", period_end: "2026-09-30T23:59:59.999Z", households_served_target: 3 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { grant_id: $.data.id } }
          trigger:
            - { call: "POST /homeownership/grant-awards/${grant_id}/impact-reports", payload: {}, as: ProgramAdmin, as_user_id: "admin-1", captures: { e_open: $.data.error_id } }
            - { call: "GET /homeownership/grant-awards/${grant_id}", as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-10-01T00:00:00.000Z" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/grant-awards/${grant_id}/impact-reports", payload: {}, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "GET /homeownership/grant-awards/${grant_id}", as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "Report inside the period: HTTP 409 and ${e_open} == ERR_REPORTING_PERIOD_OPEN"
            - "Award re-read after the refusal: status is still OPEN"
            - "Report after the clock passes period_end: HTTP 200 with response_type == object"
            - "Award re-read after the success: status == REPORTED, award_code still FHLB-2026-Q3 and households_served_target still 3"

      - name: waitlist_promotion_without_ready_site_capacity_is_refused
