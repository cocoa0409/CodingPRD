# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — Task 1166: Inpatient Coding & DRG Assignment
# §1.9 Coverage Index: every testable claim of §1.1–§1.7 not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Sections follow references/claim-extraction-
# guide.md. Instances already exercised by §1.8 appear as excluded_because stubs.
# =============================================================================

scaffold_corner_design:

  # ================================================== From Table 1 (Entities)
  - section: entities
    instances:
      - name: account_creation_defaults
        claim_type: creation
        grounds: [entities.PatientAccount]
        distinguishing_aspect: "Create with all required fields -> 201; system fields defaulted: status ADMITTED, dnfb_flag false, discharge_at null, version 1."
        test_recipe:
          setup: ["Empty database; logical clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-EN1", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
          assert:
            - "Response 201; PatientAccount.${acct_id}.status == ADMITTED"
            - "dnfb_flag == false and dnfb_flagged_at == null and discharge_at == null"
            - "version == 1 and id is a server-minted UUID"

      - name: list_accounts_pagination_envelope
        claim_type: listing
        grounds: [entities.PatientAccount, response_envelope]
        distinguishing_aspect: "List endpoint returns the fixed envelope: meta.api_request_id present, response_type 'array', pagination fields with defaults limit=10, offset=0, total_count, has_more."
        test_recipe:
          setup: ["Exactly one account exists"]
          setup_api_calls:
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-EN2", admit_at: "2026-04-20T08:00:00Z", patient_class: "OBSERVATION", financial_class: "SELF_PAY", total_charges_cents: 100000 }, as: CodingManager }
          trigger:
            - { call: "GET /patient-accounts", payload: {}, as: BillingClerk }
          assert:
            - "response_type == 'array'; meta.api_request_id present"
            - "data has length 1; total_count == 1; limit == 10 (default); offset == 0; has_more == false"

      - name: chart_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Chart, "errors[ERR_CHART_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID -> 404 ERR_CHART_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /charts/00000000-0000-0000-0000-000000000000", payload: {}, as: CodingManager, captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 404 and error_id == ERR_CHART_NOT_FOUND"

      - name: create_account_missing_mrn_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.PatientAccount.fields.mrn, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field mrn -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /patient-accounts", payload: { admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: create_diagnosis_invalid_poa_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.DiagnosisLine.fields.poa, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "poa value 'X' outside enum {Y,N,U,W,EXEMPT} -> 400 ERR_INVALID_REQUEST even though chart state and ownership are valid."
        test_recipe:
          setup: ["READY MEDICAL_LOW chart assigned to a CCS coder and started (chart IN_CODING)"]
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-EN5", full_name: "Enum Test", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-EN5", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
          trigger:
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "X", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${coder_id}", captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: dnfb_flag_computed_field
        claim_type: computed_fields
        grounds: [entities.PatientAccount.fields.dnfb_flag]
        excluded_because:
          difficulty_instance: dnfb_threshold_exactly_3_days
          rationale: "dnfb_flag computation (and its >= threshold boundary) is asserted directly by the named §1.8 instance."

  # ============================================ From Table 2 (State Machines)
  - section: state_machines
    instances:
      - name: chart_readies_after_last_deficiency_resolved
        claim_type: side_effect_execution
        grounds: [state_machines.Chart.OPEN_to_READY_FOR_CODING, state_machines.ChartDeficiency.OPEN_to_RESOLVED]
        distinguishing_aspect: "Chart stays OPEN after discharge while a deficiency is OPEN; resolving the last deficiency auto-transitions the chart to READY_FOR_CODING (bubble-up on open_deficiency_count == 0 + DISCHARGED)."
        test_recipe:
          setup: ["Account with a chart carrying one OPEN deficiency; account then discharged (chart remains OPEN)"]
          setup_api_calls:
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-SM1", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /deficiencies", payload: { chart_id: "${chart_id}", type: "MISSING_DISCHARGE_SUMMARY", due_at: "2026-04-30T00:00:00Z" }, as: CodingManager, captures: { def_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
          trigger:
            - { call: "POST /deficiencies/${def_id}/resolve", payload: {}, as: CodingManager }
          assert:
            - "Before trigger: Chart.${chart_id}.status == OPEN and open_deficiency_count == 1 (discharge alone did not ready the chart)"
            - "After trigger: ChartDeficiency.${def_id}.status == RESOLVED and resolved_at set"
            - "After trigger: Chart.${chart_id}.status == READY_FOR_CODING and open_deficiency_count == 0"

      - name: submit_assignment_from_assigned_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CodingAssignment.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "submit is declared only from IN_PROGRESS; from ASSIGNED it MUST fail with ERR_INVALID_STATE and create no CodedCase."
        test_recipe:
          setup: ["READY chart with an ASSIGNED assignment (never started)"]
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-SM2", full_name: "Skip Start", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-SM2", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
          trigger:
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}", captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 409 and error_id == ERR_INVALID_STATE"
            - "GET /coded-cases?chart_id=${chart_id} returns an empty array (no case created)"

      - name: record_payment_on_rebilled_bill_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Bill.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REBILLED is terminal: record-payment on a REBILLED bill MUST fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Full lifecycle: coded+accepted chart; bill finalized (billed 1365000) and paid in full; review claiming -200000; rebill created and APPROVED by a different compliance officer -> bill REBILLED"]
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-SM3", full_name: "Term Inal", credential: "RHIA" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-SM3", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 2000000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "N18.6", poa: "Y", sequence: 2, cc_level: "MCC" }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: CodingManager }
            - { call: "POST /bills", payload: { account_id: "${acct_id}" }, as: BillingClerk, captures: { bill_id: $.data.id } }
            - { call: "POST /bills/${bill_id}/finalize", payload: {}, as: BillingClerk }
            - { call: "POST /bills/${bill_id}/record-payment", payload: { paid_amount_cents: 1365000, paid_at: "2026-05-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /bills/${bill_id}/post-payment-reviews", payload: { payer_ref: "PR-SM3", claimed_delta_cents: -200000 }, as: BillingClerk, captures: { review_id: $.data.id } }
            - { call: "GET /bills/${bill_id}", payload: {}, as: BillingClerk, captures: { bill_v: $.data.version } }
            - { call: "POST /rebill-requests", payload: { review_id: "${review_id}", delta_cents: -200000, expected_bill_version: "${bill_v}" }, as: BillingClerk, as_user_id: "clerk-sm3", captures: { rebill_id: $.data.id } }
            - { call: "POST /rebill-requests/${rebill_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "officer-sm3" }
          trigger:
            - { call: "POST /bills/${bill_id}/record-payment", payload: { paid_amount_cents: 100, paid_at: "2026-05-02T00:00:00Z" }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "Pre-trigger: Bill.${bill_id}.status == REBILLED and net_receivable_cents == -200000 (1365000 - 1365000 + (-200000))"
            - "Trigger response http_status == 409 and error_id == ERR_INVALID_STATE"

      - name: resolve_finding_dismiss_keeps_case
        claim_type: side_effect_execution
        grounds: [state_machines.AuditFinding.OPEN_to_DISMISSED]
        distinguishing_aspect: "The DISMISS branch applies no correction: CodedCase version, severity and expected reimbursement are byte-identical before/after; finding.delta_reimbursement_cents == 0."
        test_recipe:
          setup: ["Coded+accepted chart (principal only, expected 650000); audit on the subject coder with one OPEN POA_CORRECTION finding"]
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-SM4A", full_name: "Sub Ject", credential: "CCS" }, as: CodingManager, captures: { subj_id: $.data.id } }
            - { call: "POST /coders", payload: { employee_no: "E-SM4B", full_name: "Aud Itor", credential: "RHIA" }, as: CodingManager, captures: { auditor_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-SM4", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${subj_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${subj_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${subj_id}", captures: { pdx_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${subj_id}" }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: CodingManager }
            - { call: "GET /coded-cases?chart_id=${chart_id}", payload: {}, as: Auditor, as_user_id: "${auditor_id}", captures: { case_id: "$.data[0].id", case_v: "$.data[0].version" } }
            - { call: "POST /audits", payload: { subject_coder_id: "${subj_id}", window_start: "2026-04-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", sample_size: 5 }, as: Auditor, as_user_id: "${auditor_id}", captures: { audit_id: $.data.id } }
            - { call: "POST /audits/${audit_id}/findings", payload: { coded_case_id: "${case_id}", finding_type: "POA_CORRECTION", target_diagnosis_id: "${pdx_id}", corrected_poa: "W" }, as: Auditor, as_user_id: "${auditor_id}", captures: { finding_id: $.data.id } }
          trigger:
            - { call: "POST /audit-findings/${finding_id}/resolve", payload: { resolution: "DISMISS" }, as: Auditor, as_user_id: "${auditor_id}" }
          assert:
            - "AuditFinding.${finding_id}.status == DISMISSED and delta_reimbursement_cents == 0"
            - "CodedCase.${case_id}.version unchanged == ${case_v}; expected_reimbursement_cents == 650000"
            - "DiagnosisLine.${pdx_id}.poa == Y (unchanged)"

      - name: assignment_initial_state_assigned
        claim_type: valid_transition
        grounds: [state_machines.CodingAssignment]
        distinguishing_aspect: "Create with coder_id lands in initial state ASSIGNED with assigned_at set and priority_score computed; coder workload debited."
        test_recipe:
          setup: ["READY MEDICAL_HIGH chart; ACTIVE CCS coder with workload_units 0"]
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-SM5", full_name: "Ini Tial", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-SM5", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
          trigger:
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
          assert:
            - "CodingAssignment.${asg_id}.status == ASSIGNED and returned_count == 0"
            - "Coder.${coder_id}.workload_units == 2 (MEDICAL_HIGH weight)"

      - name: accept_cascade_bill_ready
        claim_type: side_effect_execution
        grounds: [state_machines.Bill.DRAFT_to_READY]
        excluded_because:
          difficulty_instance: accept_cascades_chart_and_bill
          rationale: "The accept -> chart CODED -> bill READY bubble-up is asserted end-to-end by the named §1.8 cascade instance."

      - name: finding_apply_cascade_effects
        claim_type: side_effect_execution
        grounds: [state_machines.AuditFinding.OPEN_to_APPLIED]
        excluded_because:
          difficulty_instance: audit_apply_poa_cascade
          rationale: "The APPLY branch's 4-hop cascade is asserted hop-by-hop by the named §1.8 cascade instance."

  # ============================================== From Table 3 (Calculations)
  - section: calculations
    instances:
      - name: grouping_excludes_poa_n_secondary
        claim_type: input_set_filtering
        grounds: [calculations.drg_grouping]
        distinguishing_aspect: "A secondary line with cc_level MCC but poa=N is excluded from CC/MCC capture: severity stays WITHOUT_CC_MCC, weight 1.0000, expected 650000 — only ACTIVE non-principal lines with poa != 'N' enter the input set."
        test_recipe:
          setup: ["MEDICAL_HIGH chart coded with principal I21.09 and secondary N18.6 MCC poa=N; submitted"]
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-CL1", full_name: "Poa Enn", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-CL1", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 2000000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "N18.6", poa: "N", sequence: 2, cc_level: "MCC" }, as: Coder, as_user_id: "${coder_id}" }
          trigger:
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "GET /coded-cases?chart_id=${chart_id}", payload: {}, as: CodingManager, captures: { case_id: "$.data[0].id" } }
          assert:
            - "CodedCase.${case_id}.severity_level == WITHOUT_CC_MCC (MCC line excluded by poa=N)"
            - "CodedCase.${case_id}.relative_weight == 1.0000 and expected_reimbursement_cents == 650000"

      - name: productivity_weighted_units_after_accept
        claim_type: correct_result
        grounds: [calculations.coder_productivity]
        distinguishing_aspect: "Accepting one SURGICAL chart yields accepted_weighted_units == 3 and productivity_units_per_day == 0.10 (3 / 30, round_half_up 2dp) — acuity-weighted aggregation, not a raw chart count."
        test_recipe:
          setup: ["RHIA coder coded a SURGICAL chart (principal + one OR procedure) through SUBMITTED"]
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-CL2", full_name: "Prod Uct", credential: "RHIA" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-CL2", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "COMMERCIAL", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "SURGICAL" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /procedure-lines", payload: { chart_id: "${chart_id}", pcs_code: "0210093", is_or: true, performed_at: "2026-04-22T09:00:00Z" }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
          trigger:
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: CodingManager }
          assert:
            - "Coder.${coder_id}.accepted_count == 1 and accepted_weighted_units == 3 (SURGICAL weight)"
            - "Coder.${coder_id}.productivity_units_per_day == 0.10"
            - "Coder.${coder_id}.workload_units == 0 after accept"

      - name: outlier_nested_rounding
        claim_type: correct_result
        grounds: [calculations.expected_reimbursement]
        excluded_because:
          difficulty_instance: reimbursement_per_component_rounding
          rationale: "Per-component rounding with outlier arithmetic asserted by the named §1.8 instance."

      - name: dnfb_backlog_ordering
        claim_type: correct_result
        grounds: [calculations.dnfb_aging_scan]
        excluded_because:
          difficulty_instance: dnfb_threshold_exactly_3_days
          rationale: "Sweep flagging and flagged_account_ids membership asserted by the named §1.8 instance."

  # ============================================== From Table 4 (Validations)
  - section: validations
    instances:
      - name: list_accounts_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request without X-User-Role -> 401 ERR_UNAUTHENTICATED regardless of endpoint."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /patient-accounts", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 401 and error_id == ERR_UNAUTHENTICATED"

      - name: create_coder_as_coder_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Role Coder invoking CodingManager-exclusive POST /coders -> 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["One coder exists to act as the caller"]
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-VA2", full_name: "For Bidder", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
          trigger:
            - { call: "POST /coders", payload: { employee_no: "E-VA2X", full_name: "Nope", credential: "CCA" }, as: Coder, as_user_id: "${coder_id}", captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 403 and error_id == ERR_FORBIDDEN"

      - name: create_assignment_forbidden_before_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "A request that is both role-forbidden (Coder on POST /assignments) and references a non-existent chart MUST return ERR_FORBIDDEN — authorization (p2) precedes existence (p3)."
        test_recipe:
          setup: ["One coder exists"]
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-VA3", full_name: "Prio Auth", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
          trigger:
            - { call: "POST /assignments", payload: { chart_id: "00000000-0000-0000-0000-000000000000", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: Coder, as_user_id: "${coder_id}", captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 403 and error_id == ERR_FORBIDDEN (not ERR_CHART_NOT_FOUND)"

      - name: create_chart_unknown_account_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_ACCOUNT_NOT_FOUND]"]
        distinguishing_aspect: "FK integrity: chart creation against a non-existent account_id -> 404 ERR_ACCOUNT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /charts", payload: { account_id: "00000000-0000-0000-0000-000000000000", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 404 and error_id == ERR_ACCOUNT_NOT_FOUND"

      - name: assign_with_unknown_coder_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_CODER_NOT_FOUND]"]
        distinguishing_aspect: "Assignment creation with a non-existent coder_id on an existing READY chart -> 404 ERR_CODER_NOT_FOUND."
        test_recipe:
          setup: ["READY chart on a discharged account"]
          setup_api_calls:
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-VA5", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { chart_id: $.data.id } }
