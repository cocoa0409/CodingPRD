  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_booking_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appointment-book-stale-routeday]", entities.RouteDay.fields.version]
        distinguishing_aspect: "Booking with the correct expected_route_day_version succeeds, increments RouteDay.version from 1 to 2, and sets booked_stop_count to 1."
        test_recipe:
          setup: ["OPEN route day rd at version 1; ORDERED order"]
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "CMP", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"] }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /phlebotomists"
              payload: { full_name: "Pat", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { phleb_id: $.data.id }
            - call: "POST /phlebotomists/${phleb_id}/route-days"
              payload: { territory_code: "SF_BAY", service_date: "2026-02-01", shift_start_utc: "2026-02-01T08:00:00Z", shift_end_utc: "2026-02-01T18:00:00Z", stop_capacity: 10 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /lab-orders/${o_id}/appointments"
              payload: { route_day_id: "${rd_id}", window_start_utc: "2026-02-01T09:00:00Z", window_end_utc: "2026-02-01T09:30:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "GET /route-days/${rd_id}"
              payload: {}
              as: Dispatcher
              captures: { rd_v_new: $.data.version, booked: $.data.booked_stop_count }
          assert:
            - "rd_v == 1"
            - "RouteDay.${rd_id}.version == 2"
            - "RouteDay.${rd_id}.booked_stop_count == 1"
            - "LabOrder.${o_id}.status == SCHEDULED"

      - name: occ_stale_version_excluded
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appointment-book-stale-routeday]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_version_beats_window_conflict
          rationale: "Stale expected_route_day_version → ERR_ROUTE_DAY_VERSION_STALE is asserted by the named §1.8 instance."

      - name: derived_field_booked_stop_count_after_redraw_excluded
        claim_type: derived_field_reconciliation
        grounds: [entities.RouteDay.fields.booked_stop_count]
        excluded_because:
          difficulty_instance: compensating_invariant / route_day_booked_stop_count_conserved_on_cancel
          rationale: "booked_stop_count reconciliation on cancel is asserted by the named §1.8 invariant instance."

