              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { adv_cat: $.data.id, cat_ceded: $.data.ceded_claim_minor, cat_collectible: $.data.collectible_minor, cat_reinst: $.data.reinstatement_triggered, cat_arb0: $.data.arbitration_cost_minor }
            - call: "POST /claim-advocacies/${adv_cat}/review"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /claim-advocacies/${adv_cat}/cession-disputes"
              payload: { signing_line_id: "${sl_cat}", disputed_minor: 100000000, dispute_reason: "EXCLUSION_APPLIES" }
              as: ReinsurerUnderwriter
              as_user_id: "${bravo_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /claim-advocacies/${adv_cat}/advocacy-route"
