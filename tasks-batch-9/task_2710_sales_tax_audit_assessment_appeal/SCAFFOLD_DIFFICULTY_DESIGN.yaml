# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2710 Sales Tax Audit & Assessment Appeal
#
# Nine §0.5 rule_ids, 22 instances. Every instance grounds only in elements
# declared in SCAFFOLD.yaml §1.1–§1.7; deleting this file would leave the
# scaffold's behavior identical.
#
# Two reusable fixtures are referenced by name in the `setup:` prose, but every
# instance spells its own chain out in full so it is independently executable
# from an empty database:
#   * BIG   — Harbor Foods, scope 2023-01-01..2024-12-31, a 2-stratum agreement
#             over a 2400-unit / 1_200_000_000-cent population and two examined
#             sample units carrying 62500 + 18750 cents of error.
#   * MINI  — Ridgeline Tools, scope 2026-01-01..2026-06-30, clock parked on
#             2026-06-30 so interest_days == 0, one NO_ERROR sample unit (so the
#             projection contributes 0) and a single CONSUMABLE use-tax purchase
#             that dials the deficiency to the exact cent the instance needs.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: projection_variant_ratio_vs_mean_same_sample
        grounds:
          - calculations.sample_projection
          - entities.SamplingAgreement.fields.methodology
          - entities.Audit.fields.projected_deficiency_cents
          - entities.Audit.fields.sample_error_rate_bp
        distinguishing_aspect: |
          Two audits whose examined sample units, strata, population base and
          population unit count are byte-identical produce projected_deficiency_cents
          44280000 under RATIO_ESTIMATION and 97500000 under MEAN_PER_UNIT, because
          RATIO_ESTIMATION consumes only population_base_amount_cents while
          MEAN_PER_UNIT consumes only population_unit_count.
        test_recipe:
          setup:
            - "Two taxpayers, each with one audit in FIELDWORK over scope 2023-01-01..2024-12-31."
            - "Both audits carry the same two strata (1000 units / 500000000 cents, then 1400 units / 700000000 cents) and the same two examined units (invoice 1000000 with 62500 of error, invoice 1200000 with 18750 of error)."
            - "Audit A's agreed agreement is RATIO_ESTIMATION; audit B's is MEAN_PER_UNIT. Nothing else differs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
            - call: "POST /taxpayers"
              payload: { legal_name: "Harbor Foods LLC", permit_number: "P-2710-A", industry_naics_code: "445110", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 250000000, delinquent_period_count: 2 }
              as: SelectionAnalyst
              captures: { ta_id: "$.data.id" }
            - call: "POST /taxpayers"
              payload: { legal_name: "Harbor Foods South LLC", permit_number: "P-2710-B", industry_naics_code: "445110", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 250000000, delinquent_period_count: 2 }
              as: SelectionAnalyst
              captures: { tb_id: "$.data.id" }
            - call: "POST /industry-projects"
              payload: { project_name: "Grocery 2026", industry_naics_code: "445110", industry_error_rate_bp: 4200, selection_mode: "THRESHOLD", selection_threshold_score: 0, selection_quota: 4 }
              as: SelectionAnalyst
              captures: { proj_id: "$.data.id" }
            - call: "POST /industry-projects/${proj_id}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_id}", taxpayer_id: "${ta_id}", status: "SELECTED" }
              as: SelectionAnalyst
              captures: { lead_a_id: "$.data[0].id" }
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_id}", taxpayer_id: "${tb_id}", status: "SELECTED" }
              as: SelectionAnalyst
              captures: { lead_b_id: "$.data[0].id" }
            - call: "POST /audit-leads/${lead_a_id}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "FIELD" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { audit_a_id: "$.data.id" }
            - call: "POST /audit-leads/${lead_b_id}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "FIELD" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { audit_b_id: "$.data.id" }
            - call: "POST /audits/${audit_a_id}/scope"
              payload: { audit_type: "FIELD", scope_period_start: "2023-01-01", scope_period_end: "2024-12-31" }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { audit_a_v: "$.data.version" }
            - call: "POST /audits/${audit_b_id}/scope"
              payload: { audit_type: "FIELD", scope_period_start: "2023-01-01", scope_period_end: "2024-12-31" }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { audit_b_v: "$.data.version" }
            - call: "POST /sampling-agreements"
              payload: { audit_id: "${audit_a_id}", expected_audit_version: "${audit_a_v}", methodology: "RATIO_ESTIMATION", confidence_level_bp: 9500, minimum_sample_size: 2, strata: [{ period_start: "2023-01-01", period_end: "2024-01-01", population_base_amount_cents: 500000000, population_unit_count: 1000 }, { period_start: "2024-01-01", period_end: "2025-01-01", population_base_amount_cents: 700000000, population_unit_count: 1400 }] }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { agr_a_id: "$.data.id" }
            - call: "POST /sampling-agreements"
              payload: { audit_id: "${audit_b_id}", expected_audit_version: "${audit_b_v}", methodology: "MEAN_PER_UNIT", confidence_level_bp: 9500, minimum_sample_size: 2, strata: [{ period_start: "2023-01-01", period_end: "2024-01-01", population_base_amount_cents: 500000000, population_unit_count: 1000 }, { period_start: "2024-01-01", period_end: "2025-01-01", population_base_amount_cents: 700000000, population_unit_count: 1400 }] }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { agr_b_id: "$.data.id" }
            - call: "POST /sampling-agreements/${agr_a_id}/agree"
              payload: { agreed_by_name: "R. Chen" }
              as: Taxpayer
              as_user_id: "${ta_id}"
            - call: "POST /sampling-agreements/${agr_b_id}/agree"
              payload: { agreed_by_name: "R. Chen" }
              as: Taxpayer
              as_user_id: "${tb_id}"
            - call: "POST /sample-units"
              payload: { sampling_agreement_id: "${agr_a_id}", stratum_index: 0, invoice_reference: "A-1", invoice_date: "2023-03-15", invoice_amount_cents: 1000000, error_class: "UNREPORTED_TAXABLE_SALE", declared_error_amount_cents: 62500 }
              as: FieldAuditor
              as_user_id: "auditor-1"
            - call: "POST /sample-units"
              payload: { sampling_agreement_id: "${agr_a_id}", stratum_index: 1, invoice_reference: "A-2", invoice_date: "2024-05-20", invoice_amount_cents: 1200000, error_class: "UNREPORTED_TAXABLE_SALE", declared_error_amount_cents: 18750 }
              as: FieldAuditor
              as_user_id: "auditor-1"
            - call: "POST /sample-units"
              payload: { sampling_agreement_id: "${agr_b_id}", stratum_index: 0, invoice_reference: "B-1", invoice_date: "2023-03-15", invoice_amount_cents: 1000000, error_class: "UNREPORTED_TAXABLE_SALE", declared_error_amount_cents: 62500 }
              as: FieldAuditor
              as_user_id: "auditor-1"
            - call: "POST /sample-units"
              payload: { sampling_agreement_id: "${agr_b_id}", stratum_index: 1, invoice_reference: "B-2", invoice_date: "2024-05-20", invoice_amount_cents: 1200000, error_class: "UNREPORTED_TAXABLE_SALE", declared_error_amount_cents: 18750 }
              as: FieldAuditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /audits/${audit_a_id}/project-sample"
              payload: {}
              as: FieldAuditor
              as_user_id: "auditor-1"
            - call: "POST /audits/${audit_b_id}/project-sample"
              payload: {}
              as: FieldAuditor
              as_user_id: "auditor-1"
          assert:
            - "Audit.${audit_a_id}.sample_error_rate_bp == 369"
            - "Audit.${audit_a_id}.projected_deficiency_cents == 44280000"
            - "Audit.${audit_a_id}.projection_method == RATIO_ESTIMATION"
            - "Audit.${audit_b_id}.sample_error_rate_bp == 369"
            - "Audit.${audit_b_id}.projected_deficiency_cents == 97500000"
            - "Audit.${audit_b_id}.projection_method == MEAN_PER_UNIT"
            - "Audit.${audit_a_id}.examined_unit_count == 2 and Audit.${audit_b_id}.examined_unit_count == 2"

      - name: risk_score_screening_vs_full_flips_ranking
        grounds:
          - calculations.taxpayer_risk_score
          - entities.Taxpayer.fields.screening_score
          - entities.AuditLead.fields.risk_score
          - entities.AuditLead.fields.rank_position
          - entities.AuditLead.fields.score_variant
        distinguishing_aspect: |
          The SCREENING variant scores Harbor 350 and Vantage 300, while the FULL
          variant scores the same two unchanged taxpayers 314 and 349 — so the two
          variants disagree about which taxpayer is riskiest, and the FULL variant
          alone consumes the industry, magnitude and neutral-prior components.
        test_recipe:
          setup:
            - "Harbor Foods: one information return reporting 120000000 against a matched 90000000, 2 delinquent periods, 250000000 gross receipts, no prior audit."
            - "Vantage Supply: one information return reporting 200000000 against a matched 100000000, 0 delinquent periods, 1000000000 gross receipts, prior_audit_error_rate_bp 6000."
            - "One project in the shared NAICS with industry_error_rate_bp 4200 and threshold 0 so both are selected."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
            - call: "POST /taxpayers"
              payload: { legal_name: "Harbor Foods LLC", permit_number: "P-2710-A", industry_naics_code: "445110", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 250000000, delinquent_period_count: 2 }
              as: SelectionAnalyst
              captures: { ta_id: "$.data.id" }
            - call: "POST /taxpayers"
              payload: { legal_name: "Vantage Supply Co", permit_number: "P-2710-C", industry_naics_code: "445110", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 1000000000, delinquent_period_count: 0, prior_audit_error_rate_bp: 6000 }
              as: SelectionAnalyst
              captures: { tc_id: "$.data.id" }
            - call: "POST /information-returns"
              payload: { taxpayer_id: "${ta_id}", source_type: "FEDERAL_1099K", period_start: "2024-01-01", period_end: "2024-12-31", reported_amount_cents: 120000000, matched_return_amount_cents: 90000000 }
              as: SelectionAnalyst
            - call: "POST /information-returns"
              payload: { taxpayer_id: "${tc_id}", source_type: "MARKETPLACE_REPORT", period_start: "2024-01-01", period_end: "2024-12-31", reported_amount_cents: 200000000, matched_return_amount_cents: 100000000 }
              as: SelectionAnalyst
            - call: "POST /industry-projects"
              payload: { project_name: "Grocery 2026", industry_naics_code: "445110", industry_error_rate_bp: 4200, selection_mode: "THRESHOLD", selection_threshold_score: 0, selection_quota: 4 }
              as: SelectionAnalyst
              captures: { proj_id: "$.data.id" }
          trigger:
            - call: "POST /taxpayers/${ta_id}/rescore-screening"
              payload: {}
              as: SelectionAnalyst
            - call: "POST /taxpayers/${tc_id}/rescore-screening"
              payload: {}
              as: SelectionAnalyst
            - call: "POST /industry-projects/${proj_id}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_id}", taxpayer_id: "${ta_id}" }
              as: SelectionAnalyst
              captures: { lead_a_id: "$.data[0].id" }
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_id}", taxpayer_id: "${tc_id}" }
              as: SelectionAnalyst
              captures: { lead_c_id: "$.data[0].id" }
          assert:
            - "Taxpayer.${ta_id}.screening_score == 350"
            - "Taxpayer.${tc_id}.screening_score == 300"
            - "AuditLead.${lead_a_id}.risk_score == 314"
            - "AuditLead.${lead_c_id}.risk_score == 349"
            - "AuditLead.${lead_a_id}.score_variant == FULL and AuditLead.${lead_c_id}.score_variant == FULL"
            - "AuditLead.${lead_c_id}.rank_position == 1 and AuditLead.${lead_a_id}.rank_position == 2"
            - "Taxpayer.${ta_id}.info_variance_bp == 2500 and Taxpayer.${ta_id}.delinquency_bp == 5000 and Taxpayer.${ta_id}.magnitude_bp == 500 and Taxpayer.${ta_id}.prior_audit_bp == 3500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: projection_rate_rounded_to_whole_bp_before_population_multiply
        grounds:
          - calculations.sample_projection
          - entities.Audit.fields.sample_error_rate_bp
          - entities.Audit.fields.projected_deficiency_cents
        distinguishing_aspect: |
          Mode (b), rounding order: the error rate 81250/2200000 must be rounded to
          the whole basis point 369 BEFORE it is applied to the 1200000000-cent
          population, giving 44280000; applying the unrounded ratio first and
          rounding at the end gives 44318182, so the two orders are 38182 cents apart.
        test_recipe:
          setup:
            - "The BIG fixture: Harbor Foods, scope 2023-01-01..2024-12-31, RATIO_ESTIMATION over two strata totalling 1200000000 cents and 2400 units."
            - "Exactly two examined units: invoice 1000000 with 62500 of error and invoice 1200000 with 18750 of error, so sum_err/sum_base = 81250/2200000 = 3.6931...%."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
            - call: "POST /taxpayers"
              payload: { legal_name: "Harbor Foods LLC", permit_number: "P-2710-A", industry_naics_code: "445110", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 250000000, delinquent_period_count: 2 }
              as: SelectionAnalyst
              captures: { ta_id: "$.data.id" }
            - call: "POST /industry-projects"
              payload: { project_name: "Grocery 2026", industry_naics_code: "445110", industry_error_rate_bp: 4200, selection_mode: "THRESHOLD", selection_threshold_score: 0, selection_quota: 2 }
              as: SelectionAnalyst
              captures: { proj_id: "$.data.id" }
            - call: "POST /industry-projects/${proj_id}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_id}", status: "SELECTED" }
              as: SelectionAnalyst
              captures: { lead_a_id: "$.data[0].id" }
            - call: "POST /audit-leads/${lead_a_id}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "FIELD" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { audit_id: "$.data.id" }
            - call: "POST /audits/${audit_id}/scope"
              payload: { audit_type: "FIELD", scope_period_start: "2023-01-01", scope_period_end: "2024-12-31" }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { audit_v: "$.data.version" }
            - call: "POST /sampling-agreements"
              payload: { audit_id: "${audit_id}", expected_audit_version: "${audit_v}", methodology: "RATIO_ESTIMATION", confidence_level_bp: 9500, minimum_sample_size: 2, strata: [{ period_start: "2023-01-01", period_end: "2024-01-01", population_base_amount_cents: 500000000, population_unit_count: 1000 }, { period_start: "2024-01-01", period_end: "2025-01-01", population_base_amount_cents: 700000000, population_unit_count: 1400 }] }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /sampling-agreements/${agr_id}/agree"
              payload: { agreed_by_name: "R. Chen" }
              as: Taxpayer
              as_user_id: "${ta_id}"
            - call: "POST /sample-units"
              payload: { sampling_agreement_id: "${agr_id}", stratum_index: 0, invoice_reference: "A-1", invoice_date: "2023-03-15", invoice_amount_cents: 1000000, error_class: "UNREPORTED_TAXABLE_SALE", declared_error_amount_cents: 62500 }
              as: FieldAuditor
              as_user_id: "auditor-1"
            - call: "POST /sample-units"
              payload: { sampling_agreement_id: "${agr_id}", stratum_index: 1, invoice_reference: "A-2", invoice_date: "2024-05-20", invoice_amount_cents: 1200000, error_class: "UNREPORTED_TAXABLE_SALE", declared_error_amount_cents: 18750 }
              as: FieldAuditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /audits/${audit_id}/project-sample"
              payload: {}
              as: FieldAuditor
              as_user_id: "auditor-1"
          assert:
            - "Audit.${audit_id}.sample_error_rate_bp == 369"
            - "Audit.${audit_id}.projected_deficiency_cents == 44280000"
            - "Audit.${audit_id}.projected_deficiency_cents != 44318182"
            - "Audit.${audit_id}.projection_status == CURRENT"

      - name: small_balance_waiver_recomputes_interest_on_bare_tax
        grounds:
          - calculations.assessment_liability_rollup
          - entities.Assessment.fields.penalty_waived_small_balance
          - entities.Assessment.fields.provisional_total_due_cents
          - entities.Assessment.fields.interest_cents
          - entities.Assessment.fields.total_due_cents
        distinguishing_aspect: |
          Mode (c), circular dependency: the small-balance test reads the provisional
          total 4954 that already contains the 234-cent penalty, and once the penalty
          is waived the interest must be recomputed on the bare 4688-cent tax, giving
          31 rather than the 32 first computed — so total_due_cents is 4719, and an
          implementation that merely subtracts the penalty lands on 4720.
        test_recipe:
          setup:
            - "The MINI fixture on Ridgeline Tools with the clock parked on 2026-07-30, 30 days past the 2026-06-30 scope end, so interest_days == 30."
            - "One NO_ERROR sample unit (projection contributes 0) and one CONSUMABLE use-tax purchase of 75000 cents, giving tax_deficiency_cents 4688."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-30T00:00:00Z" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
            - call: "POST /taxpayers"
              payload: { legal_name: "Ridgeline Tools Inc", permit_number: "P-2710-M", industry_naics_code: "444140", filing_frequency: "QUARTERLY", gross_receipts_annual_cents: 100000000, delinquent_period_count: 0 }
              as: SelectionAnalyst
              captures: { tm_id: "$.data.id" }
            - call: "POST /industry-projects"
              payload: { project_name: "Hardware 2026", industry_naics_code: "444140", industry_error_rate_bp: 3000, selection_mode: "THRESHOLD", selection_threshold_score: 0, selection_quota: 2 }
              as: SelectionAnalyst
              captures: { projm_id: "$.data.id" }
            - call: "POST /industry-projects/${projm_id}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${projm_id}", status: "SELECTED" }
              as: SelectionAnalyst
              captures: { leadm_id: "$.data[0].id" }
            - call: "POST /audit-leads/${leadm_id}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "DESK" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { audit_id: "$.data.id" }
            - call: "POST /audits/${audit_id}/scope"
              payload: { audit_type: "DESK", scope_period_start: "2026-01-01", scope_period_end: "2026-06-30" }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { audit_v: "$.data.version" }
            - call: "POST /sampling-agreements"
              payload: { audit_id: "${audit_id}", expected_audit_version: "${audit_v}", methodology: "RATIO_ESTIMATION", confidence_level_bp: 9000, minimum_sample_size: 1, strata: [{ period_start: "2026-01-01", period_end: "2026-07-01", population_base_amount_cents: 10000000, population_unit_count: 100 }] }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /sampling-agreements/${agr_id}/agree"
              payload: { agreed_by_name: "T. Alvarez" }
              as: Taxpayer
              as_user_id: "${tm_id}"
            - call: "POST /sample-units"
              payload: { sampling_agreement_id: "${agr_id}", stratum_index: 0, invoice_reference: "M-1", invoice_date: "2026-03-02", invoice_amount_cents: 100000, error_class: "NO_ERROR" }
              as: FieldAuditor
              as_user_id: "auditor-1"
            - call: "POST /use-tax-purchases"
              payload: { audit_id: "${audit_id}", vendor_name: "Northline Abrasives", invoice_date: "2026-04-01", purchase_price_cents: 75000, asset_class: "CONSUMABLE" }
              as: FieldAuditor
              as_user_id: "auditor-1"
            - call: "POST /audits/${audit_id}/project-sample"
              payload: {}
              as: FieldAuditor
              as_user_id: "auditor-1"
            - call: "POST /audits/${audit_id}/close-fieldwork"
              payload: { fraud_indicator: false }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
          trigger:
            - call: "POST /assessments"
              payload: { audit_id: "${audit_id}" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { asmt_id: "$.data.id" }
          assert:
            - "Assessment.${asmt_id}.tax_deficiency_cents == 4688"
            - "Assessment.${asmt_id}.penalty_rate_bp == 500"
            - "Assessment.${asmt_id}.interest_days == 30"
            - "Assessment.${asmt_id}.provisional_total_due_cents == 4954"
            - "Assessment.${asmt_id}.penalty_waived_small_balance == true"
            - "Assessment.${asmt_id}.penalty_cents == 0"
            - "Assessment.${asmt_id}.interest_cents == 31"
            - "Assessment.${asmt_id}.total_due_cents == 4719"
            - "Assessment.${asmt_id}.total_due_cents != 4720"
            - "Assessment.${asmt_id}.balance_due_cents == 4719"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sampling_agreement_negotiation_cycle_hits_round_cap
        grounds:
          - state_machines.SamplingAgreement
          - endpoints.POST /sampling-agreements/{id}/counter
          - endpoints.POST /sampling-agreements/{id}/revise
          - errors.ERR_NEGOTIATION_ROUNDS_EXHAUSTED
        distinguishing_aspect: |
          The PROPOSED <-> COUNTERED loop is traversed twice legally, raising
          round_number 1 -> 2 -> 3, and the third revise attempt is refused with
          ERR_NEGOTIATION_ROUNDS_EXHAUSTED (422) while the agreement stays in
          COUNTERED at round_number 3 — a cyclic machine with a bounded loop count,
          not a linear one.
        test_recipe:
          setup:
            - "Ridgeline Tools scoped 2026-01-01..2026-06-30 with a single-stratum RATIO_ESTIMATION proposal; the logical clock is left at its 2026-08-01 default."
          setup_api_calls:
            - call: "POST /taxpayers"
