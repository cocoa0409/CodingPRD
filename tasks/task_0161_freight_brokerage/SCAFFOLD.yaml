# =============================================================================
# Freight Brokerage Platform — Seed Tables (Scaffold §1.0–§1.7)
# =============================================================================

scenario: |
  Freight Brokerage Platform: shipper quote request, carrier qualification
  (MC#/USDOT), Spot/Contract rates, Detention/Accessorial, factoring financing,
  dispute claims, SmartWay compliance.

domain_name: freight-brokerage
api_prefix: /brokerages

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation       # Spot vs Contract rate paths, Provisional vs Final detention
    - cascading_side_effects         # Dispute → Invoice → FactoringAdvance recourse → Carrier safety
    - rate_threshold_triggers        # Free-time, advance haircut tiers, SmartWay penalty bands
    - derived_field_reconciliation   # Carrier.safety_score, Invoice.balance_due_cents
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Brokerage
    parent: null
    common_fields: true
    fields:
      - { name: name,                          type: string,   source: input,    description: "Brokerage legal name" }
      - { name: mc_number,                     type: string,   source: input,    description: "Motor Carrier authority number issued by FMCSA" }
      - { name: factoring_reserve_pct,         type: number,   source: input,    description: "Holdback percentage retained on every factoring advance (0–100, two decimals)" }
      - { name: detention_free_minutes,        type: integer,  source: input,    default: 120, description: "Free time (minutes) before detention accrues on any load tendered by this brokerage" }
      - { name: detention_rate_cents_per_15min, type: integer, source: input,    default: 1500, description: "Cents charged per 15-minute increment of chargeable detention" }
      - { name: clock_now_iso,                 type: datetime, source: system,   description: "Server-controlled clock; advanced via POST /_clock/advance" }

  - name: Shipper
    parent: Brokerage
    common_fields: true
    fields:
      - { name: brokerage_id,                  type: string,   source: system,   description: "Owning brokerage id" }
      - { name: company_name,                  type: string,   source: input,    description: "Shipper company name" }
      - { name: smartway_required,             type: boolean,  source: input,    default: false, description: "If true, only SmartWay-certified carriers may be coverage candidates for this shipper's loads" }
      - { name: credit_limit_cents,            type: integer,  source: input,    description: "Maximum outstanding invoiced amount before new loads are refused" }
      - { name: outstanding_invoiced_cents,    type: integer,  source: computed, default: 0, description: "Sum of Invoice.balance_due_cents across this shipper's non-VOIDED invoices" }
      - { name: status,                        type: enum,     source: system,   default: ACTIVE, constraints: "ACTIVE | SUSPENDED", description: "ACTIVE until manually suspended; suspension blocks new quote requests" }

  - name: Carrier
    parent: Brokerage
    common_fields: true
    fields:
      - { name: brokerage_id,                  type: string,   source: system,   description: "Owning brokerage id" }
      - { name: legal_name,                    type: string,   source: input,    description: "Carrier legal name" }
      - { name: mc_number,                     type: string,   source: input,    description: "Carrier MC#, unique per brokerage among non-REVOKED carriers" }
      - { name: usdot_number,                  type: string,   source: input,    description: "USDOT number, unique per brokerage among non-REVOKED carriers" }
      - { name: insurance_expires_on,          type: datetime, source: input,    description: "Cargo + auto-liability policy expiry timestamp" }
      - { name: smartway_certified,            type: boolean,  source: input,    default: false, description: "Whether the carrier holds an active SmartWay certification" }
      - { name: safety_score,                  type: integer,  source: computed, default: 1000, description: "Read-only safety score, starts at 1000; penalised by accepted claims and SmartWay breaches; floor 0" }
      - { name: status,                        type: enum,     source: system,   default: PENDING_QUALIFICATION, constraints: "PENDING_QUALIFICATION | QUALIFIED | SUSPENDED | REVOKED", description: "Lifecycle gate for being tendered loads" }

  - name: QuoteRequest
    parent: Shipper
    common_fields: true
    fields:
      - { name: shipper_id,                    type: string,   source: system,   description: "Owning shipper id" }
      - { name: brokerage_id,                  type: string,   source: system,   description: "Owning brokerage id (denormalised from shipper for tenancy checks)" }
      - { name: origin_zip,                    type: string,   source: input,    description: "Pickup ZIP" }
      - { name: destination_zip,               type: string,   source: input,    description: "Delivery ZIP" }
      - { name: equipment_type,                type: enum,     source: input,    constraints: "DRY_VAN | REEFER | FLATBED", description: "Required trailer" }
      - { name: pickup_window_start,           type: datetime, source: input,    description: "Earliest pickup time" }
      - { name: pickup_window_end,             type: datetime, source: input,    description: "Latest pickup time; MUST be > pickup_window_start" }
      - { name: rate_contract_id,              type: string,   source: input,    description: "Optional active RateContract id; if present quote is CONTRACT-sourced, else SPOT" }
      - { name: rate_source,                   type: enum,     source: computed, constraints: "SPOT | CONTRACT", description: "CONTRACT iff rate_contract_id was supplied and contract resolves; else SPOT" }
      - { name: quoted_linehaul_cents,         type: integer,  source: computed, description: "Result of quote_linehaul calculation; null until QUOTED" }
      - { name: status,                        type: enum,     source: system,   default: OPEN, constraints: "OPEN | QUOTED | ACCEPTED | REJECTED | EXPIRED", description: "OPEN→QUOTED→{ACCEPTED|REJECTED|EXPIRED}" }

  - name: RateContract
    parent: Brokerage
    common_fields: true
    fields:
      - { name: brokerage_id,                  type: string,   source: system,   description: "Owning brokerage id" }
      - { name: shipper_id,                    type: string,   source: input,    description: "Counterparty shipper id" }
      - { name: lane_origin_zip,               type: string,   source: input,    description: "Lane origin ZIP" }
      - { name: lane_destination_zip,          type: string,   source: input,    description: "Lane destination ZIP" }
      - { name: equipment_type,                type: enum,     source: input,    constraints: "DRY_VAN | REEFER | FLATBED", description: "Lane equipment" }
      - { name: flat_rate_cents,               type: integer,  source: input,    description: "Per-load all-in linehaul (overrides spot pricing)" }
      - { name: effective_from,                type: datetime, source: input,    description: "Inclusive start of validity" }
      - { name: effective_to,                  type: datetime, source: input,    description: "Exclusive end of validity; MUST be > effective_from" }
      - { name: status,                        type: enum,     source: system,   default: ACTIVE, constraints: "ACTIVE | TERMINATED", description: "TERMINATED when superseded or expired by clock" }

  - name: Load
    parent: Shipper
    common_fields: true
    fields:
      - { name: shipper_id,                    type: string,   source: system,   description: "Owning shipper id" }
      - { name: brokerage_id,                  type: string,   source: system,   description: "Owning brokerage id" }
      - { name: quote_request_id,              type: string,   source: input,    description: "Source QuoteRequest (MUST be ACCEPTED at tender time)" }
      - { name: carrier_id,                    type: string,   source: input,    description: "Assigned carrier (MUST be QUALIFIED, insured, and SmartWay-eligible if required)" }
      - { name: rate_source,                   type: enum,     source: computed, constraints: "SPOT | CONTRACT", description: "Copied from QuoteRequest at tender" }
      - { name: linehaul_cents,                type: integer,  source: computed, description: "Frozen at TENDERED = QuoteRequest.quoted_linehaul_cents" }
      - { name: provisional_detention_cents,   type: integer,  source: computed, default: 0, description: "Computed at DELIVERED using actual_arrive_at; revised at INVOICED to final_detention_cents" }
      - { name: final_detention_cents,         type: integer,  source: computed, description: "Locked at INVOICED; null beforehand" }
      - { name: accessorial_total_cents,       type: integer,  source: computed, default: 0, description: "Sum of AccessorialCharge.amount_cents for APPROVED charges on this load" }
      - { name: actual_arrive_at,              type: datetime, source: input,    description: "Carrier-reported arrival at consignee; set at DELIVERED" }
      - { name: actual_depart_at,              type: datetime, source: input,    description: "Carrier-reported depart from consignee; set at DELIVERED; MUST be >= actual_arrive_at" }
      - { name: status,                        type: enum,     source: system,   default: TENDERED, constraints: "TENDERED | ACCEPTED | IN_TRANSIT | DELIVERED | INVOICED | SETTLED | CANCELLED", description: "Lifecycle gate for carrier and billing actions" }

  - name: AccessorialCharge
    parent: Load
    common_fields: true
    fields:
      - { name: load_id,                       type: string,   source: system,   description: "Parent load id" }
      - { name: brokerage_id,                  type: string,   source: system,   description: "Owning brokerage id" }
      - { name: charge_type,                   type: enum,     source: input,    constraints: "LAYOVER | TONU | REWEIGH | LUMPER", description: "Detention is computed separately on Load itself" }
      - { name: amount_cents,                  type: integer,  source: input,    description: "Requested cents; MUST be > 0" }
      - { name: status,                        type: enum,     source: system,   default: REQUESTED, constraints: "REQUESTED | APPROVED | DENIED", description: "Approval gates inclusion in invoice" }

  - name: Invoice
    parent: Load
    common_fields: false
    fields:
      - { name: load_id,                       type: string,   source: system,   description: "Backing load id; one Invoice per load" }
      - { name: shipper_id,                    type: string,   source: system,   description: "Denormalised shipper id" }
      - { name: brokerage_id,                  type: string,   source: system,   description: "Owning brokerage id" }
      - { name: linehaul_cents,                type: integer,  source: system,   description: "Frozen copy of Load.linehaul_cents at ISSUED" }
      - { name: detention_cents,               type: integer,  source: system,   description: "Frozen copy of Load.final_detention_cents at ISSUED" }
      - { name: accessorial_cents,             type: integer,  source: system,   description: "Frozen copy of Load.accessorial_total_cents at ISSUED" }
      - { name: invoice_total_cents,           type: integer,  source: computed, description: "linehaul_cents + detention_cents + accessorial_cents (frozen at ISSUED, decreased only by APPROVED claims)" }
      - { name: amount_paid_cents,             type: integer,  source: computed, default: 0, description: "Cumulative cash applied (factoring advance + remittance)" }
      - { name: amount_credited_cents,         type: integer,  source: computed, default: 0, description: "Cumulative credits from APPROVED DisputeClaims" }
      - { name: balance_due_cents,             type: integer,  source: computed, description: "= invoice_total_cents - amount_paid_cents - amount_credited_cents (never < 0)" }
      - { name: factoring_status,              type: enum,     source: system,   default: NOT_FACTORED, constraints: "NOT_FACTORED | FACTORED | RECOURSED", description: "Independent of settlement_status (parallel dimension)" }
      - { name: settlement_status,             type: enum,     source: system,   default: ISSUED, constraints: "ISSUED | PAID | WRITTEN_OFF", description: "Independent of factoring_status (parallel dimension)" }

  - name: FactoringAdvance
    parent: Invoice
    common_fields: false
    fields:
      - { name: invoice_id,                    type: string,   source: system,   description: "Backing invoice id; one advance per invoice" }
      - { name: brokerage_id,                  type: string,   source: system,   description: "Owning brokerage id" }
      - { name: invoice_total_at_advance_cents,type: integer,  source: system,   description: "Frozen invoice_total_cents at advance time (immutable anchor for haircut/reserve math)" }
      - { name: haircut_cents,                 type: integer,  source: computed, description: "Factor's fee held off the advance (tiered_pricing on invoice_total_at_advance_cents)" }
      - { name: reserve_cents,                 type: integer,  source: computed, description: "= round_half_up(invoice_total_at_advance_cents * Brokerage.factoring_reserve_pct / 100), 0 decimals" }
      - { name: advanced_cents,                type: integer,  source: computed, description: "= invoice_total_at_advance_cents - haircut_cents - reserve_cents (the cash wired to brokerage)" }
      - { name: recourse_owed_cents,           type: integer,  source: computed, default: 0, description: "Amount the brokerage owes the factor back after RECOURSED transition; 0 while FACTORED" }

  - name: DisputeClaim
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id,                    type: string,   source: system,   description: "Disputed invoice id" }
      - { name: brokerage_id,                  type: string,   source: system,   description: "Owning brokerage id" }
      - { name: claim_type,                    type: enum,     source: input,    constraints: "DAMAGE | SHORTAGE | OVERCHARGE | LATE_DELIVERY", description: "Drives carrier safety-score penalty when APPROVED" }
      - { name: claimed_cents,                 type: integer,  source: input,    description: "Shipper-claimed credit amount; MUST be > 0 and <= Invoice.balance_due_cents at filing" }
      - { name: counter_offer_cents,           type: integer,  source: input,    description: "Broker counter; populated only on COUNTER_OFFERED" }
      - { name: settled_credit_cents,          type: integer,  source: computed, description: "Final credit applied to invoice on RESOLVED; null otherwise" }
      - { name: status,                        type: enum,     source: system,   default: OPEN, constraints: "OPEN | IN_REVIEW | COUNTER_OFFERED | RESOLVED | ESCALATED | WITHDRAWN", description: "Cyclic: COUNTER_OFFERED can revert to IN_REVIEW on shipper rejection" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Carrier
    initial_state: PENDING_QUALIFICATION
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_QUALIFICATION
        to: QUALIFIED
        trigger: POST /brokerages/{brokerageId}/carriers/{carrierId}/qualify
        actor: CarrierOps
        preconditions:
          - "mc_number and usdot_number both non-empty (ERR_INVALID_CARRIER_AUTHORITY)"
          - "insurance_expires_on > Brokerage.clock_now_iso (ERR_INSURANCE_EXPIRED)"
        side_effects:
          - "safety_score initialised to 1000 if previously null"

      - from: QUALIFIED
        to: SUSPENDED
        trigger: "system (automatic on Carrier.safety_score < SAFETY_SUSPEND_THRESHOLD) OR POST /brokerages/{brokerageId}/carriers/{carrierId}/suspend"
        actor: system | CarrierOps
        preconditions:
          - "No Load in TENDERED, ACCEPTED, IN_TRANSIT for this carrier (ERR_CARRIER_HAS_OPEN_LOADS) when manual"
        side_effects:
          - "All future tenders for this carrier blocked"

      - from: SUSPENDED
        to: QUALIFIED
        trigger: POST /brokerages/{brokerageId}/carriers/{carrierId}/requalify
        actor: CarrierOps
        preconditions:
          - "insurance_expires_on > clock_now_iso (ERR_INSURANCE_EXPIRED)"
          - "safety_score >= SAFETY_REQUALIFY_THRESHOLD (ERR_SAFETY_SCORE_TOO_LOW)"
        side_effects: []
        note: "Cycle SUSPENDED → QUALIFIED → SUSPENDED → … is permitted"

      - from: SUSPENDED
        to: REVOKED
        trigger: POST /brokerages/{brokerageId}/carriers/{carrierId}/revoke
        actor: CarrierOps
        preconditions:
          - "Carrier currently SUSPENDED (ERR_CARRIER_NOT_SUSPENDED)"
        side_effects:
          - "mc_number/usdot_number uniqueness lifted (REVOKED rows excluded from uniqueness set)"

  - entity: QuoteRequest
    initial_state: OPEN
    terminal_states: [REJECTED, EXPIRED, ACCEPTED]
    transitions:
      - from: OPEN
        to: QUOTED
        trigger: POST /brokerages/{brokerageId}/shippers/{shipperId}/quote-requests/{quoteId}/quote
        actor: BrokerOps
        preconditions:
          - "Shipper.status == ACTIVE (ERR_SHIPPER_SUSPENDED)"
        side_effects:
          - "rate_source set to CONTRACT iff rate_contract_id resolves to an ACTIVE RateContract whose lane+equipment match and whose effective window contains clock_now_iso; otherwise SPOT"
          - "quoted_linehaul_cents computed via quote_linehaul calculation"

      - from: QUOTED
        to: ACCEPTED
        trigger: POST /brokerages/{brokerageId}/shippers/{shipperId}/quote-requests/{quoteId}/accept
        actor: ShipperUser
        preconditions:
          - "clock_now_iso <= pickup_window_end (ERR_QUOTE_EXPIRED)"
          - "Shipper.outstanding_invoiced_cents + quoted_linehaul_cents <= Shipper.credit_limit_cents (ERR_SHIPPER_CREDIT_LIMIT_EXCEEDED)"
        side_effects: []

      - from: QUOTED
        to: REJECTED
        trigger: POST /brokerages/{brokerageId}/shippers/{shipperId}/quote-requests/{quoteId}/reject
        actor: ShipperUser
        preconditions: []
        side_effects: []

      - from: OPEN
        to: EXPIRED
        trigger: "system (automatic when clock_now_iso > pickup_window_end and status == OPEN)"
        actor: system
        preconditions: []
        side_effects: []

      - from: QUOTED
        to: EXPIRED
        trigger: "system (automatic when clock_now_iso > pickup_window_end and status == QUOTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Load
    initial_state: TENDERED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: TENDERED
        to: ACCEPTED
        trigger: POST /brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}/carrier-accept
        actor: CarrierUser
        preconditions:
          - "Carrier.status == QUALIFIED (ERR_CARRIER_NOT_QUALIFIED)"
          - "Carrier.insurance_expires_on > clock_now_iso (ERR_INSURANCE_EXPIRED)"
          - "If Shipper.smartway_required: Carrier.smartway_certified == true (ERR_SMARTWAY_REQUIRED)"
        side_effects: []

      - from: ACCEPTED
        to: IN_TRANSIT
        trigger: POST /brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}/depart
        actor: CarrierUser
        preconditions: []
        side_effects: []

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: POST /brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}/deliver
        actor: CarrierUser
        preconditions:
          - "actual_depart_at >= actual_arrive_at (ERR_INVALID_DELIVERY_TIMES)"
        side_effects:
          - "provisional_detention_cents computed via detention_provisional calculation (uses pickup_window_end as the appointment baseline)"

      - from: DELIVERED
        to: INVOICED
        trigger: POST /brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}/invoice
        actor: BrokerOps
        preconditions:
          - "All AccessorialCharge rows on this load are APPROVED or DENIED (no REQUESTED) (ERR_ACCESSORIAL_PENDING)"
        side_effects:
          - "final_detention_cents computed via detention_final calculation"
          - "accessorial_total_cents = sum of APPROVED AccessorialCharge.amount_cents"
          - "Create Invoice with frozen linehaul_cents, detention_cents = final_detention_cents, accessorial_cents = accessorial_total_cents; settlement_status = ISSUED, factoring_status = NOT_FACTORED"
          - "Shipper.outstanding_invoiced_cents += Invoice.balance_due_cents (== invoice_total_cents at this moment)"

      - from: INVOICED
        to: SETTLED
        trigger: "system (automatic when Invoice.balance_due_cents == 0 AND Invoice.factoring_status != FACTORED)"
        actor: system
        preconditions: []
        side_effects:
          - "Invoice.settlement_status → PAID"

      - from: TENDERED
        to: CANCELLED
        trigger: POST /brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}/cancel
        actor: ShipperUser | BrokerOps
        preconditions: []
        side_effects:
          - "QuoteRequest stays ACCEPTED (terminal); no Invoice produced"

      - from: ACCEPTED
        to: CANCELLED
        trigger: POST /brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}/cancel
        actor: ShipperUser | BrokerOps
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      # --- factoring_status dimension (parallel to settlement_status) ---
      - from: NOT_FACTORED
        to: FACTORED
        trigger: POST /brokerages/{brokerageId}/invoices/{invoiceId}/factor
        actor: BrokerOps
        preconditions:
          - "settlement_status == ISSUED (ERR_INVOICE_NOT_FACTORABLE)"
          - "balance_due_cents == invoice_total_cents (no payments/credits yet) (ERR_INVOICE_NOT_FACTORABLE)"
          - "No DisputeClaim on this invoice in OPEN, IN_REVIEW, or COUNTER_OFFERED (ERR_INVOICE_HAS_OPEN_DISPUTE)"
        side_effects:
          - "Create FactoringAdvance with invoice_total_at_advance_cents = invoice_total_cents"
          - "Compute haircut_cents via factoring_haircut calculation"
          - "Compute reserve_cents and advanced_cents per FactoringAdvance field formulas"
          - "Invoice.amount_paid_cents += FactoringAdvance.invoice_total_at_advance_cents (full face value is treated as paid against the invoice; factor now holds receivable)"
          - "Invoice.balance_due_cents recomputed"

      - from: FACTORED
        to: RECOURSED
        trigger: "system (automatic when, after a DisputeClaim resolves and Invoice.amount_credited_cents > 0 on a FACTORED invoice)"
        actor: system
        preconditions: []
        side_effects:
          - "recourse_owed_cents = FactoringAdvance.invoice_total_at_advance_cents - Invoice.invoice_total_cents (the credit amount, since the factor recoups face value)"
          - "Invoice.amount_paid_cents -= recourse_owed_cents (the brokerage is buying back the receivable to that extent)"
          - "Invoice.balance_due_cents recomputed; SmartWay penalty independently applied to carrier safety_score per claim"

      # --- settlement_status dimension (parallel) ---
      - from: ISSUED
        to: PAID
        trigger: "system (automatic when balance_due_cents reaches 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Shipper.outstanding_invoiced_cents -= invoice_total_cents (the original frozen total, not balance)"

      - from: ISSUED
        to: WRITTEN_OFF
        trigger: POST /brokerages/{brokerageId}/invoices/{invoiceId}/write-off
        actor: BrokerOps
        preconditions:
          - "balance_due_cents > 0 (ERR_INVOICE_NOTHING_TO_WRITE_OFF)"
          - "No DisputeClaim in OPEN, IN_REVIEW, or COUNTER_OFFERED on this invoice (ERR_INVOICE_HAS_OPEN_DISPUTE)"
        side_effects:
          - "amount_credited_cents += balance_due_cents (drives balance_due_cents to 0)"
          - "Shipper.outstanding_invoiced_cents -= invoice_total_cents"

  - entity: DisputeClaim
    initial_state: OPEN
    terminal_states: [RESOLVED, ESCALATED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: POST /brokerages/{brokerageId}/dispute-claims/{claimId}/start-review
        actor: BrokerOps
        preconditions: []
        side_effects: []

      - from: IN_REVIEW
        to: COUNTER_OFFERED
        trigger: POST /brokerages/{brokerageId}/dispute-claims/{claimId}/counter
        actor: BrokerOps
        preconditions:
          - "counter_offer_cents > 0 (ERR_COUNTER_OFFER_INVALID)"
          - "counter_offer_cents < claimed_cents (ERR_COUNTER_OFFER_INVALID)"
        side_effects: []

      - from: COUNTER_OFFERED
        to: IN_REVIEW
        trigger: POST /brokerages/{brokerageId}/dispute-claims/{claimId}/reject-counter
        actor: ShipperUser
        preconditions: []
        side_effects:
          - "counter_offer_cents cleared to null"
        note: "Cycle: a claim may oscillate IN_REVIEW ↔ COUNTER_OFFERED any number of times before resolving"

      - from: IN_REVIEW
        to: RESOLVED
        trigger: POST /brokerages/{brokerageId}/dispute-claims/{claimId}/resolve
        actor: BrokerOps
        preconditions:
          - "settled_credit_cents (request body) >= 0 (ERR_SETTLED_CREDIT_INVALID)"
          - "settled_credit_cents <= claimed_cents (ERR_SETTLED_CREDIT_INVALID)"
          - "settled_credit_cents <= Invoice.balance_due_cents (ERR_SETTLED_CREDIT_INVALID)"
        side_effects:
          - "Invoice.amount_credited_cents += settled_credit_cents (claim_credit_application calculation)"
          - "Invoice.invoice_total_cents -= settled_credit_cents (the face value of the receivable shrinks)"
          - "If Invoice.factoring_status == FACTORED AND settled_credit_cents > 0: Invoice.factoring_status → RECOURSED with recourse_owed_cents = settled_credit_cents (cascade)"
          - "Carrier.safety_score -= SmartWay penalty per safety_score_update (claim_type-dependent), floored at 0"
          - "If Invoice.balance_due_cents == 0 AND factoring_status != FACTORED: Invoice.settlement_status → PAID (further cascade)"

      - from: COUNTER_OFFERED
        to: RESOLVED
        trigger: POST /brokerages/{brokerageId}/dispute-claims/{claimId}/accept-counter
        actor: ShipperUser
        preconditions: []
        side_effects:
          - "settled_credit_cents = counter_offer_cents"
          - "Same Invoice / Carrier / cascading side-effects as IN_REVIEW → RESOLVED"

      - from: IN_REVIEW
        to: ESCALATED
        trigger: POST /brokerages/{brokerageId}/dispute-claims/{claimId}/escalate
        actor: BrokerOps
        preconditions: []
        side_effects:
          - "No credit applied; claim is parked for external arbitration"

      - from: OPEN
        to: WITHDRAWN
        trigger: POST /brokerages/{brokerageId}/dispute-claims/{claimId}/withdraw
        actor: ShipperUser
        preconditions: []
        side_effects: []

      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: POST /brokerages/{brokerageId}/dispute-claims/{claimId}/withdraw
        actor: ShipperUser
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two QuoteRequest /accept calls submitted simultaneously for the same quote"
    guarantee: "At most one ACCEPT succeeds; the second sees the already-accepted state"
    error_id: ERR_QUOTE_NOT_QUOTED
    http_status: 409
    serialization: "First-writer-wins on QuoteRequest.status"

  - scenario: "Two carrier /carrier-accept calls submitted simultaneously for the same TENDERED Load"
    guarantee: "Exactly one tender acceptance succeeds; loser sees ERR_LOAD_NOT_TENDERED"
    error_id: ERR_LOAD_NOT_TENDERED
    http_status: 409
    serialization: "First-writer-wins on Load.status"

  - scenario: "Two /factor calls submitted simultaneously for the same Invoice"
    guarantee: "At most one FactoringAdvance is created per invoice"
    error_id: ERR_INVOICE_NOT_FACTORABLE
    http_status: 409
    serialization: "First-writer-wins on Invoice.factoring_status"

  - scenario: "/factor race against /dispute-claims POST on the same invoice — both arrive before either commits"
    guarantee: "Either the dispute is filed first and the factor sees ERR_INVOICE_HAS_OPEN_DISPUTE, or the factor wins and the dispute is rejected for ERR_INVOICE_NOT_DISPUTABLE_AFTER_FACTORING"
    error_id: ERR_INVOICE_HAS_OPEN_DISPUTE
    http_status: 409
    serialization: "First-writer-wins on Invoice; loser receives the corresponding gate error for its operation"

  - scenario: "/factor race against /dispute-claims POST on the same invoice — dispute loses to factor"
    guarantee: "If the factor commits first, the subsequent dispute filing is rejected"
    error_id: ERR_INVOICE_NOT_DISPUTABLE_AFTER_FACTORING
    http_status: 409
    serialization: "First-writer-wins on Invoice.factoring_status"

  - scenario: "Concurrent /qualify and /revoke on the same Carrier"
    guarantee: "Exactly one operation succeeds; loser sees a state-precondition error"
    error_id: ERR_CARRIER_NOT_SUSPENDED
    http_status: 409
    serialization: "First-writer-wins on Carrier.status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_linehaul
    trigger: "POST /quote-requests/{id}/quote (QuoteRequest OPEN → QUOTED)"
    algorithm: forward_looking
    formula: |
      Inputs: equipment_type, rate_contract_id (optional), origin_zip, destination_zip,
              Brokerage spot rate book (constants below).

      Step 1: If rate_contract_id is non-null:
        - Resolve RateContract r: status == ACTIVE, r.shipper_id == QuoteRequest.shipper_id,
          r.lane_origin_zip == origin_zip, r.lane_destination_zip == destination_zip,
          r.equipment_type == equipment_type, r.effective_from <= clock_now_iso < r.effective_to.
        - If exactly one r matches:
            rate_source = CONTRACT
            quoted_linehaul_cents = r.flat_rate_cents
            RETURN.
        - If no r matches OR rate_contract_id is null: FALL THROUGH to Step 2 with rate_source = SPOT.
        - If MORE THAN ONE r matches: reject with ERR_RATE_CONTRACT_AMBIGUOUS (the scaffold
          forbids overlapping ACTIVE contracts on the same lane+equipment+shipper, but if data
          is corrupted the request is rejected rather than silently picking one).

      Step 2 (SPOT path):
        base_cents = SPOT_BASE_CENTS_PER_EQUIPMENT[equipment_type]
        # ZIP distance proxy: absolute difference of the numeric ZIP codes, treated as miles.
        distance_units = abs(int(destination_zip) - int(origin_zip))
        quoted_linehaul_cents = base_cents + distance_units * SPOT_PER_UNIT_CENTS[equipment_type]
    input_set: "QuoteRequest fields; RateContract rows ACTIVE at clock_now_iso for this shipper+lane+equipment"
    constants:
      SPOT_BASE_CENTS_PER_EQUIPMENT:
        DRY_VAN: 30000
        REEFER:  50000
        FLATBED: 40000
      SPOT_PER_UNIT_CENTS:
        DRY_VAN: 10
        REEFER:  18
        FLATBED: 14
    precision: "Integer cents (no rounding required — inputs are integers)"
    variants:
      - name: contract
        when: "rate_contract_id resolves to exactly one ACTIVE RateContract for the lane+equipment+shipper at clock_now_iso"
        difference: "Quoted price is the contract's flat_rate_cents; spot base/per-unit constants are ignored"
      - name: spot
        when: "rate_contract_id is null OR no matching ACTIVE RateContract"
        difference: "Quoted price = SPOT_BASE_CENTS_PER_EQUIPMENT[eq] + distance_units * SPOT_PER_UNIT_CENTS[eq]"

  - name: detention_provisional
    trigger: "POST /loads/{id}/deliver (Load IN_TRANSIT → DELIVERED)"
    algorithm: threshold
    formula: |
      # PINNED rounding order (mode-(b) nested rounding — order matters):
      # Step 1: chargeable_minutes = max(0, floor((depart-arrive).total_seconds()/60) - free_minutes)
      # Step 2: chargeable_increments = ceil(chargeable_minutes / 15)
      # Step 3: provisional_detention_cents = chargeable_increments * rate_cents_per_15min
      #
      # ALTERNATIVE ORDER (FORBIDDEN — would produce different cents):
      #   rate_per_minute_cents = rate_cents_per_15min / 15
      #   raw_cents = chargeable_minutes * rate_per_minute_cents
      #   provisional_detention_cents = ceil(raw_cents)        # ceil at cents granularity
      # For chargeable=1 min, rate=1500: pinned order = 1500 cents, forbidden order = 100 cents.
    input_set: "Load.actual_arrive_at, Load.actual_depart_at (carrier-reported at /deliver); Brokerage detention constants frozen at delivery"
    constants:
      INCREMENT_MINUTES: 15
      ROUNDING_ORDER: "ceil-to-increment FIRST, then multiply by rate (NOT multiply then ceil to cent)"
    precision: "Integer cents"
    variants:
      - name: provisional
        when: "Computed at /deliver using carrier-reported times"
        difference: "Stored on Load.provisional_detention_cents; may be revised by /invoice"

  - name: detention_final
    trigger: "POST /loads/{id}/invoice (Load DELIVERED → INVOICED)"
    algorithm: chronological
    formula: |
      Recompute identically to detention_provisional using the SAME actual_arrive_at /
      actual_depart_at on Load, but using the Brokerage.detention_free_minutes and
      Brokerage.detention_rate_cents_per_15min IN EFFECT AT /invoice TIME (which may differ
      from the values used at /deliver if Brokerage settings were updated in between).
      Store the result on Load.final_detention_cents and freeze it into Invoice.detention_cents.
    input_set: "Same actual times as provisional; latest Brokerage detention constants at invoice time"
    constants:
      INCREMENT_MINUTES: 15
      ROUNDING: "ceil to next INCREMENT_MINUTES"
    precision: "Integer cents"
    variants:
      - name: final
        when: "Computed at /invoice; uses the latest Brokerage detention settings"
        difference: "Provisional and final may differ when Brokerage constants are updated between /deliver and /invoice; final is the authoritative number on the Invoice"

  - name: factoring_haircut
    trigger: "POST /invoices/{id}/factor (Invoice NOT_FACTORED → FACTORED)"
    algorithm: tiered_pricing
    formula: |
      Let T = invoice_total_at_advance_cents.
      Apply marginal tiers (allocate T into buckets, sum bucket * rate):
        Tier A: first  100_000 cents (i.e., the slice in [0, 100_000])           rate = 0.030
        Tier B: next   400_000 cents (i.e., the slice in (100_000, 500_000])     rate = 0.020
        Tier C: above  500_000 cents (i.e., the slice > 500_000)                 rate = 0.010
      haircut_raw = A_slice*0.030 + B_slice*0.020 + C_slice*0.010
      # Pinned rounding order: round the FINAL haircut_raw to nearest cent (round_half_up).
      # Do NOT round per-tier and then sum — that is explicitly forbidden and will produce
      # a different result on totals such as T = 250_001.
      haircut_cents = round_half_up(haircut_raw)
    input_set: "FactoringAdvance.invoice_total_at_advance_cents only"
    constants:
      TIER_A_CAP_CENTS: 100000
      TIER_B_CAP_CENTS: 500000
      TIER_A_RATE: 0.030
      TIER_B_RATE: 0.020
      TIER_C_RATE: 0.010
    precision: "0 decimals (round once at the end, round_half_up)"
    variants:
      - name: marginal_tiered
        when: "Always"
        difference: "Marginal slices, not flat-rate by tier; the per-tier rate applies only to the slice within that tier"

  - name: claim_credit_application
    trigger: "DisputeClaim → RESOLVED (both via /resolve and /accept-counter)"
    algorithm: aggregation
    formula: |
      Let c = settled_credit_cents (= counter_offer_cents on /accept-counter,
                                       or the request body value on /resolve).
      Invoice.amount_credited_cents += c
      Invoice.invoice_total_cents   -= c   # the face value of the receivable shrinks
      Invoice.balance_due_cents      = max(0, Invoice.invoice_total_cents
                                              - Invoice.amount_paid_cents
                                              - Invoice.amount_credited_cents)
      # Conservation invariant (compensating_invariant rule_id):
      # Before-resolve total_obligation_cents = Invoice.invoice_total_cents_pre + 0
      # After-resolve  total_obligation_cents = Invoice.invoice_total_cents_post + Invoice.amount_credited_cents_delta
      # Must equal the pre-value: invoice_total_pre == invoice_total_post + credited_delta.
    input_set: "Single DisputeClaim row + its target Invoice"
    constants: {}
    precision: "Integer cents"

  - name: safety_score_update
    trigger: "DisputeClaim → RESOLVED with settled_credit_cents > 0; Load.tender on SmartWay-violating carrier (rejected before mutation, so penalty only fires from RESOLVED)"
    algorithm: weighted_scoring
    formula: |
      For each newly-RESOLVED DisputeClaim with settled_credit_cents > 0:
        penalty = CLAIM_TYPE_PENALTY[claim_type]
        if Invoice.shipper.smartway_required AND NOT Carrier.smartway_certified:
            penalty += SMARTWAY_BREACH_PENALTY
        Carrier.safety_score = max(0, Carrier.safety_score - penalty)
      # No bonus path; safety_score only decays from this calculation.
      # If Carrier.safety_score < SAFETY_SUSPEND_THRESHOLD after the update,
      # the Carrier QUALIFIED → SUSPENDED transition fires automatically (cascade).
    input_set: "DisputeClaim + Invoice (for shipper) + Carrier (from Invoice.load.carrier_id)"
    constants:
      CLAIM_TYPE_PENALTY:
        DAMAGE:        100
        SHORTAGE:       60
        OVERCHARGE:     30
        LATE_DELIVERY:  40
      SMARTWAY_BREACH_PENALTY: 50
      SAFETY_SUSPEND_THRESHOLD: 600   # safety_score < this triggers SUSPENDED
      SAFETY_REQUALIFY_THRESHOLD: 700 # safety_score >= this required for /requalify
      SCORE_FLOOR: 0
    precision: "Integer points"
    variants:
      - name: standard
        when: "Shipper.smartway_required == false OR Carrier.smartway_certified == true"
        difference: "Only the base CLAIM_TYPE_PENALTY is deducted"
      - name: smartway_breach
        when: "Shipper.smartway_required == true AND Carrier.smartway_certified == false (carrier shouldn't have been tendered; the breach surfaces at claim time)"
        difference: "Additional SMARTWAY_BREACH_PENALTY is added"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                  check: "X-User-ID and X-User-Role headers present and well-formed",                                                       error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2,  category: auth,                  check: "Role permitted for this endpoint per RBAC matrix",                                                                 error_id: ERR_INSUFFICIENT_PERMISSIONS,               http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,             check: "All path-segment IDs resolve, validated left-to-right (Brokerage → Shipper/Carrier → child)",                     error_id: "ERR_{RESOURCE}_NOT_FOUND",                 http_status: 404, applies_to: "all nested routes" }
  - { priority: 4,  category: existence,             check: "Body-referenced IDs (carrier_id, rate_contract_id, quote_request_id, invoice_id) resolve",                        error_id: "ERR_{RESOURCE}_NOT_FOUND",                 http_status: 404, applies_to: "endpoints accepting these in the body" }
  - { priority: 5,  category: state,                 check: "Target entity is in the precondition state for this transition",                                                  error_id: "varies (ERR_LOAD_NOT_TENDERED, ERR_QUOTE_NOT_QUOTED, ERR_INVOICE_NOT_FACTORABLE, ERR_CARRIER_NOT_SUSPENDED, etc.)", http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 6,  category: business_safety,       check: "Carrier qualification + insurance + SmartWay gate when tendering or carrier-accepting a load",                    error_id: ERR_CARRIER_NOT_QUALIFIED,                  http_status: 409, applies_to: "POST .../loads, POST .../loads/{id}/carrier-accept" }
  - { priority: 7,  category: business_safety,       check: "Insurance must not be expired at clock_now_iso",                                                                  error_id: ERR_INSURANCE_EXPIRED,                      http_status: 409, applies_to: "POST .../carriers/{id}/qualify, POST .../carriers/{id}/requalify, POST .../loads/{id}/carrier-accept" }
  - { priority: 8,  category: business_safety,       check: "SmartWay-required shippers may only tender to SmartWay-certified carriers",                                       error_id: ERR_SMARTWAY_REQUIRED,                      http_status: 409, applies_to: "POST .../loads, POST .../loads/{id}/carrier-accept" }
  - { priority: 9,  category: business_referential,  check: "RateContract referenced by quote must be unique across ACTIVE rows on the lane+equipment+shipper at clock_now_iso", error_id: ERR_RATE_CONTRACT_AMBIGUOUS,              http_status: 409, applies_to: "POST .../quote-requests/{id}/quote" }
  - { priority: 10, category: business_temporal,     check: "Two ACTIVE RateContracts on the same shipper+lane+equipment must not overlap in [effective_from, effective_to)",  error_id: ERR_RATE_CONTRACT_OVERLAP,                  http_status: 409, applies_to: "POST .../rate-contracts" }
  - { priority: 11, category: business_constraint,   check: "MC#/USDOT must be unique per brokerage across non-REVOKED carriers",                                              error_id: ERR_CARRIER_AUTHORITY_DUPLICATE,            http_status: 409, applies_to: "POST .../carriers" }
  - { priority: 12, category: business_constraint,   check: "DisputeClaim claimed_cents > 0 AND <= Invoice.balance_due_cents at filing",                                       error_id: ERR_CLAIM_AMOUNT_INVALID,                   http_status: 422, applies_to: "POST .../invoices/{id}/dispute-claims" }
  - { priority: 13, category: business_constraint,   check: "Factor requires zero payments/credits, no open disputes; reject if any of those fail",                            error_id: ERR_INVOICE_NOT_FACTORABLE,                 http_status: 409, applies_to: "POST .../invoices/{id}/factor" }
  - { priority: 14, category: business_referential,  check: "Disputes cannot be filed on a FACTORED or RECOURSED invoice",                                                     error_id: ERR_INVOICE_NOT_DISPUTABLE_AFTER_FACTORING, http_status: 409, applies_to: "POST .../invoices/{id}/dispute-claims" }
  - { priority: 15, category: business_fiscal,       check: "Shipper.outstanding_invoiced_cents + quoted_linehaul_cents must not exceed Shipper.credit_limit_cents at /accept", error_id: ERR_SHIPPER_CREDIT_LIMIT_EXCEEDED,         http_status: 402, applies_to: "POST .../quote-requests/{id}/accept" }
  - { priority: 16, category: business_temporal,     check: "Quote may only be accepted while clock_now_iso <= pickup_window_end",                                             error_id: ERR_QUOTE_EXPIRED,                          http_status: 409, applies_to: "POST .../quote-requests/{id}/accept" }
  - { priority: 17, category: business_constraint,   check: "Load.actual_depart_at >= Load.actual_arrive_at at /deliver",                                                      error_id: ERR_INVALID_DELIVERY_TIMES,                 http_status: 422, applies_to: "POST .../loads/{id}/deliver" }
  - { priority: 18, category: business_constraint,   check: "No AccessorialCharge may be REQUESTED at /invoice time (all must be APPROVED or DENIED)",                         error_id: ERR_ACCESSORIAL_PENDING,                    http_status: 409, applies_to: "POST .../loads/{id}/invoice" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Brokerage ----------
  - { method: POST,  path: "/brokerages",                                                                              description: "Create a brokerage",                          roles: [PlatformAdmin],                       code: 201, input: ["name", "mc_number", "factoring_reserve_pct", "detention_free_minutes?", "detention_rate_cents_per_15min?"], output: Brokerage,         side_effects: ["clock_now_iso initialised"] }
  - { method: GET,   path: "/brokerages/{brokerageId}",                                                                description: "Get a brokerage",                             roles: [PlatformAdmin, BrokerOps, CarrierOps, ShipperUser, CarrierUser], code: 200, input: [],                                            output: Brokerage,         side_effects: [] }
  - { method: POST,  path: "/brokerages/{brokerageId}/_clock/advance",                                                  description: "Advance server clock (test driver)",          roles: [PlatformAdmin],                       code: 200, input: ["to_iso"],                                                                                       output: Brokerage,         side_effects: ["clock_now_iso updated", "system QuoteRequest expiry sweep triggered"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/_sweep/expire-quotes",                                            description: "Manual sweep equivalent to clock-advance expiry pass (test driver)", roles: [PlatformAdmin],   code: 200, input: [],                                                                                             output: "QuoteRequest[]",  side_effects: ["All QuoteRequest in OPEN/QUOTED past pickup_window_end transition to EXPIRED"] }

  # ---------- Shipper ----------
  - { method: POST,  path: "/brokerages/{brokerageId}/shippers",                                                         description: "Create a shipper",                            roles: [BrokerOps],                            code: 201, input: ["company_name", "smartway_required", "credit_limit_cents"],                                          output: Shipper,           side_effects: ["status = ACTIVE", "outstanding_invoiced_cents = 0"] }
  - { method: GET,   path: "/brokerages/{brokerageId}/shippers",                                                         description: "List shippers",                               roles: [BrokerOps, PlatformAdmin],             code: 200, input: ["limit?", "offset?"],                                                                          output: "Shipper[]",       side_effects: [] }
  - { method: GET,   path: "/brokerages/{brokerageId}/shippers/{shipperId}",                                             description: "Get a shipper",                               roles: [BrokerOps, ShipperUser, PlatformAdmin], code: 200, input: [],                                                                                           output: Shipper,           side_effects: [] }
  - { method: POST,  path: "/brokerages/{brokerageId}/shippers/{shipperId}/suspend",                                     description: "Suspend a shipper",                           roles: [BrokerOps],                            code: 200, input: [],                                                                                             output: Shipper,           side_effects: ["status → SUSPENDED; future /quote-requests rejected"] }

  # ---------- Carrier ----------
  - { method: POST,  path: "/brokerages/{brokerageId}/carriers",                                                         description: "Create a carrier (PENDING_QUALIFICATION)",    roles: [CarrierOps],                           code: 201, input: ["legal_name", "mc_number", "usdot_number", "insurance_expires_on", "smartway_certified?"],               output: Carrier,           side_effects: ["status = PENDING_QUALIFICATION", "safety_score = 1000"] }
  - { method: GET,   path: "/brokerages/{brokerageId}/carriers",                                                         description: "List carriers (filterable)",                  roles: [BrokerOps, CarrierOps, PlatformAdmin],  code: 200, input: ["status?", "smartway_certified?", "limit?", "offset?"],                                        output: "Carrier[]",       side_effects: [] }
  - { method: GET,   path: "/brokerages/{brokerageId}/carriers/{carrierId}",                                             description: "Get a carrier",                               roles: [BrokerOps, CarrierOps, CarrierUser, PlatformAdmin], code: 200, input: [],                                                                              output: Carrier,           side_effects: [] }
  - { method: POST,  path: "/brokerages/{brokerageId}/carriers/{carrierId}/qualify",                                     description: "Qualify a PENDING_QUALIFICATION carrier",     roles: [CarrierOps],                           code: 200, input: [],                                                                                             output: Carrier,           side_effects: ["status → QUALIFIED"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/carriers/{carrierId}/suspend",                                     description: "Manually suspend a QUALIFIED carrier",        roles: [CarrierOps],                           code: 200, input: [],                                                                                             output: Carrier,           side_effects: ["status → SUSPENDED (only if no open loads)"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/carriers/{carrierId}/requalify",                                   description: "Move SUSPENDED carrier back to QUALIFIED",    roles: [CarrierOps],                           code: 200, input: [],                                                                                             output: Carrier,           side_effects: ["status → QUALIFIED (safety_score gate, insurance gate)"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/carriers/{carrierId}/revoke",                                      description: "Permanently revoke a SUSPENDED carrier",      roles: [CarrierOps],                           code: 200, input: [],                                                                                             output: Carrier,           side_effects: ["status → REVOKED; MC#/USDOT freed for reuse"] }

  # ---------- RateContract ----------
  - { method: POST,  path: "/brokerages/{brokerageId}/rate-contracts",                                                   description: "Create an ACTIVE rate contract",              roles: [BrokerOps],                            code: 201, input: ["shipper_id", "lane_origin_zip", "lane_destination_zip", "equipment_type", "flat_rate_cents", "effective_from", "effective_to"], output: RateContract, side_effects: ["status = ACTIVE; overlap check vs other ACTIVE contracts"] }
  - { method: GET,   path: "/brokerages/{brokerageId}/rate-contracts",                                                   description: "List rate contracts",                         roles: [BrokerOps, ShipperUser, PlatformAdmin], code: 200, input: ["shipper_id?", "status?", "limit?", "offset?"],                                               output: "RateContract[]",  side_effects: [] }
  - { method: POST,  path: "/brokerages/{brokerageId}/rate-contracts/{contractId}/terminate",                            description: "Terminate an ACTIVE rate contract",           roles: [BrokerOps],                            code: 200, input: [],                                                                                             output: RateContract,      side_effects: ["status → TERMINATED"] }

  # ---------- QuoteRequest ----------
  - { method: POST,  path: "/brokerages/{brokerageId}/shippers/{shipperId}/quote-requests",                              description: "Shipper files a quote request",               roles: [ShipperUser],                          code: 201, input: ["origin_zip", "destination_zip", "equipment_type", "pickup_window_start", "pickup_window_end", "rate_contract_id?"], output: QuoteRequest, side_effects: ["status = OPEN; Shipper.status must be ACTIVE"] }
  - { method: GET,   path: "/brokerages/{brokerageId}/shippers/{shipperId}/quote-requests/{quoteId}",                    description: "Get a quote request",                         roles: [BrokerOps, ShipperUser],               code: 200, input: [],                                                                                             output: QuoteRequest,      side_effects: [] }
  - { method: POST,  path: "/brokerages/{brokerageId}/shippers/{shipperId}/quote-requests/{quoteId}/quote",              description: "Broker quotes a price",                       roles: [BrokerOps],                            code: 200, input: [],                                                                                             output: QuoteRequest,      side_effects: ["rate_source set; quoted_linehaul_cents via quote_linehaul; status → QUOTED"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/shippers/{shipperId}/quote-requests/{quoteId}/accept",             description: "Shipper accepts a quote",                     roles: [ShipperUser],                          code: 200, input: [],                                                                                             output: QuoteRequest,      side_effects: ["status → ACCEPTED (credit + expiry checks)"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/shippers/{shipperId}/quote-requests/{quoteId}/reject",             description: "Shipper rejects a quote",                     roles: [ShipperUser],                          code: 200, input: [],                                                                                             output: QuoteRequest,      side_effects: ["status → REJECTED"] }

  # ---------- Load ----------
  - { method: POST,  path: "/brokerages/{brokerageId}/shippers/{shipperId}/loads",                                       description: "Tender a load on an ACCEPTED quote",          roles: [BrokerOps],                            code: 201, input: ["quote_request_id", "carrier_id"],                                                                  output: Load,              side_effects: ["rate_source/linehaul_cents copied from quote", "Carrier gate checks", "status = TENDERED"] }
  - { method: GET,   path: "/brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}",                              description: "Get a load",                                  roles: [BrokerOps, ShipperUser, CarrierUser],  code: 200, input: [],                                                                                             output: Load,              side_effects: [] }
  - { method: POST,  path: "/brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}/carrier-accept",               description: "Carrier accepts the tender",                  roles: [CarrierUser],                          code: 200, input: [],                                                                                             output: Load,              side_effects: ["status → ACCEPTED"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}/depart",                       description: "Carrier departs pickup",                      roles: [CarrierUser],                          code: 200, input: [],                                                                                             output: Load,              side_effects: ["status → IN_TRANSIT"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}/deliver",                      description: "Carrier delivers; provisional detention computed", roles: [CarrierUser],                     code: 200, input: ["actual_arrive_at", "actual_depart_at"],                                                          output: Load,              side_effects: ["status → DELIVERED", "provisional_detention_cents via detention_provisional"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}/invoice",                      description: "Broker invoices the shipper",                 roles: [BrokerOps],                            code: 201, input: [],                                                                                             output: Invoice,           side_effects: ["status → INVOICED", "final_detention_cents via detention_final", "Invoice row created and frozen", "Shipper.outstanding_invoiced_cents incremented"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}/cancel",                       description: "Cancel a TENDERED/ACCEPTED load",             roles: [BrokerOps, ShipperUser],               code: 200, input: [],                                                                                             output: Load,              side_effects: ["status → CANCELLED"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}/accessorial-charges",          description: "Carrier requests an accessorial",             roles: [CarrierUser],                          code: 201, input: ["charge_type", "amount_cents"],                                                                    output: AccessorialCharge, side_effects: ["status = REQUESTED"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/accessorial-charges/{chargeId}/approve",                           description: "Broker approves an accessorial",              roles: [BrokerOps],                            code: 200, input: [],                                                                                             output: AccessorialCharge, side_effects: ["status → APPROVED"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/accessorial-charges/{chargeId}/deny",                              description: "Broker denies an accessorial",                roles: [BrokerOps],                            code: 200, input: [],                                                                                             output: AccessorialCharge, side_effects: ["status → DENIED"] }

  # ---------- Invoice / Factoring / Disputes ----------
  - { method: GET,   path: "/brokerages/{brokerageId}/invoices",                                                          description: "List invoices",                              roles: [BrokerOps, ShipperUser, PlatformAdmin], code: 200, input: ["shipper_id?", "factoring_status?", "settlement_status?", "limit?", "offset?"],                output: "Invoice[]",       side_effects: [] }
  - { method: GET,   path: "/brokerages/{brokerageId}/invoices/{invoiceId}",                                              description: "Get an invoice",                             roles: [BrokerOps, ShipperUser, PlatformAdmin], code: 200, input: [],                                                                                             output: Invoice,           side_effects: [] }
  - { method: POST,  path: "/brokerages/{brokerageId}/invoices/{invoiceId}/factor",                                       description: "Factor the invoice",                          roles: [BrokerOps],                            code: 201, input: [],                                                                                             output: FactoringAdvance,  side_effects: ["factoring_status → FACTORED; FactoringAdvance created"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/invoices/{invoiceId}/write-off",                                    description: "Write off an unpaid invoice",                 roles: [BrokerOps],                            code: 200, input: [],                                                                                             output: Invoice,           side_effects: ["settlement_status → WRITTEN_OFF; balance_due_cents driven to 0 via amount_credited_cents"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/invoices/{invoiceId}/dispute-claims",                               description: "Shipper files a dispute claim",               roles: [ShipperUser],                          code: 201, input: ["claim_type", "claimed_cents"],                                                                    output: DisputeClaim,      side_effects: ["status = OPEN"] }
  - { method: GET,   path: "/brokerages/{brokerageId}/dispute-claims/{claimId}",                                          description: "Get a dispute claim",                         roles: [BrokerOps, ShipperUser],               code: 200, input: [],                                                                                             output: DisputeClaim,      side_effects: [] }
  - { method: POST,  path: "/brokerages/{brokerageId}/dispute-claims/{claimId}/start-review",                             description: "Broker starts reviewing",                     roles: [BrokerOps],                            code: 200, input: [],                                                                                             output: DisputeClaim,      side_effects: ["status → IN_REVIEW"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/dispute-claims/{claimId}/counter",                                  description: "Broker issues a counter-offer",               roles: [BrokerOps],                            code: 200, input: ["counter_offer_cents"],                                                                          output: DisputeClaim,      side_effects: ["status → COUNTER_OFFERED"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/dispute-claims/{claimId}/accept-counter",                           description: "Shipper accepts the counter",                 roles: [ShipperUser],                          code: 200, input: [],                                                                                             output: DisputeClaim,      side_effects: ["status → RESOLVED; cascade: claim_credit_application + safety_score_update + possible RECOURSE + possible Invoice → PAID"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/dispute-claims/{claimId}/reject-counter",                           description: "Shipper rejects the counter (cycle back)",    roles: [ShipperUser],                          code: 200, input: [],                                                                                             output: DisputeClaim,      side_effects: ["status → IN_REVIEW; counter_offer_cents cleared"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/dispute-claims/{claimId}/resolve",                                  description: "Broker resolves with a final credit",         roles: [BrokerOps],                            code: 200, input: ["settled_credit_cents"],                                                                         output: DisputeClaim,      side_effects: ["status → RESOLVED; same cascade as accept-counter"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/dispute-claims/{claimId}/escalate",                                 description: "Broker escalates to arbitration",             roles: [BrokerOps],                            code: 200, input: [],                                                                                             output: DisputeClaim,      side_effects: ["status → ESCALATED; no credit applied"] }
  - { method: POST,  path: "/brokerages/{brokerageId}/dispute-claims/{claimId}/withdraw",                                 description: "Shipper withdraws a claim",                   roles: [ShipperUser],                          code: 200, input: [],                                                                                             output: DisputeClaim,      side_effects: ["status → WITHDRAWN"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Authentication / Authorisation ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS,                http: 403, condition: "Role not permitted for this endpoint" }

  # --- Not found ---
  - { id: ERR_BROKERAGE_NOT_FOUND,                     http: 404, condition: "Brokerage id does not resolve" }
  - { id: ERR_SHIPPER_NOT_FOUND,                       http: 404, condition: "Shipper id does not resolve under the brokerage" }
  - { id: ERR_CARRIER_NOT_FOUND,                       http: 404, condition: "Carrier id does not resolve under the brokerage" }
  - { id: ERR_QUOTE_REQUEST_NOT_FOUND,                 http: 404, condition: "QuoteRequest id does not resolve" }
  - { id: ERR_RATE_CONTRACT_NOT_FOUND,                 http: 404, condition: "RateContract id does not resolve" }
  - { id: ERR_LOAD_NOT_FOUND,                          http: 404, condition: "Load id does not resolve" }
  - { id: ERR_ACCESSORIAL_CHARGE_NOT_FOUND,            http: 404, condition: "AccessorialCharge id does not resolve" }
  - { id: ERR_INVOICE_NOT_FOUND,                       http: 404, condition: "Invoice id does not resolve" }
  - { id: ERR_DISPUTE_CLAIM_NOT_FOUND,                 http: 404, condition: "DisputeClaim id does not resolve" }

  # --- Input validation ---
  - { id: ERR_INVALID_REQUEST,                         http: 400, condition: "Request body malformed or required field missing" }
  - { id: ERR_INVALID_CARRIER_AUTHORITY,               http: 400, condition: "mc_number or usdot_number missing/empty on /qualify" }
  - { id: ERR_INVALID_DELIVERY_TIMES,                  http: 422, condition: "actual_depart_at < actual_arrive_at on /deliver" }
  - { id: ERR_COUNTER_OFFER_INVALID,                   http: 422, condition: "counter_offer_cents <= 0 or >= claimed_cents" }
  - { id: ERR_SETTLED_CREDIT_INVALID,                  http: 422, condition: "settled_credit_cents < 0, > claimed_cents, or > Invoice.balance_due_cents" }
  - { id: ERR_CLAIM_AMOUNT_INVALID,                    http: 422, condition: "DisputeClaim claimed_cents <= 0 or > Invoice.balance_due_cents at filing" }

  # --- Carrier qualification / safety ---
  - { id: ERR_INSURANCE_EXPIRED,                       http: 409, condition: "Carrier.insurance_expires_on <= clock_now_iso" }
  - { id: ERR_SMARTWAY_REQUIRED,                       http: 409, condition: "Shipper.smartway_required and carrier is not SmartWay-certified" }
  - { id: ERR_SAFETY_SCORE_TOO_LOW,                    http: 409, condition: "Carrier.safety_score < SAFETY_REQUALIFY_THRESHOLD on /requalify" }
  - { id: ERR_CARRIER_AUTHORITY_DUPLICATE,             http: 409, condition: "mc_number or usdot_number duplicates an existing non-REVOKED carrier in this brokerage" }
  - { id: ERR_CARRIER_HAS_OPEN_LOADS,                  http: 409, condition: "Manual /suspend while carrier has TENDERED/ACCEPTED/IN_TRANSIT loads" }

  # --- State preconditions ---
  - { id: ERR_SHIPPER_SUSPENDED,                       http: 409, condition: "Shipper.status == SUSPENDED on /quote-requests or /quote" }
  - { id: ERR_QUOTE_NOT_OPEN,                          http: 409, condition: "/quote on a QuoteRequest not in OPEN" }
  - { id: ERR_QUOTE_NOT_QUOTED,                        http: 409, condition: "/accept or /reject on a QuoteRequest not in QUOTED" }
  - { id: ERR_QUOTE_EXPIRED,                           http: 409, condition: "/accept after clock_now_iso > pickup_window_end" }
  - { id: ERR_QUOTE_NOT_ACCEPTED,                      http: 409, condition: "/loads tender on a QuoteRequest not in ACCEPTED" }
  - { id: ERR_LOAD_NOT_TENDERED,                       http: 409, condition: "/carrier-accept on a Load not in TENDERED" }
  - { id: ERR_LOAD_NOT_ACCEPTED,                       http: 409, condition: "/depart on a Load not in ACCEPTED" }
  - { id: ERR_LOAD_NOT_IN_TRANSIT,                     http: 409, condition: "/deliver on a Load not in IN_TRANSIT" }
  - { id: ERR_LOAD_NOT_DELIVERED,                      http: 409, condition: "/invoice on a Load not in DELIVERED" }
  - { id: ERR_LOAD_NOT_CANCELLABLE,                    http: 409, condition: "/cancel on a Load past ACCEPTED" }
  - { id: ERR_CARRIER_NOT_PENDING,                     http: 409, condition: "/qualify on a Carrier not in PENDING_QUALIFICATION" }
  - { id: ERR_CARRIER_NOT_QUALIFIED,                   http: 409, condition: "Tender/carrier-accept on a Carrier not in QUALIFIED" }
  - { id: ERR_CARRIER_NOT_SUSPENDED,                   http: 409, condition: "/requalify or /revoke on a Carrier not in SUSPENDED" }
  - { id: ERR_ACCESSORIAL_NOT_REQUESTED,               http: 409, condition: "/approve or /deny on an AccessorialCharge not in REQUESTED" }
  - { id: ERR_ACCESSORIAL_PENDING,                     http: 409, condition: "/invoice while AccessorialCharge rows are REQUESTED on the load" }

  # --- Invoice / factoring / dispute states ---
  - { id: ERR_INVOICE_NOT_FACTORABLE,                  http: 409, condition: "Factor attempted on an invoice that is not ISSUED with full balance and zero open disputes" }
  - { id: ERR_INVOICE_HAS_OPEN_DISPUTE,                http: 409, condition: "Factor or write-off while a DisputeClaim is OPEN/IN_REVIEW/COUNTER_OFFERED" }
  - { id: ERR_INVOICE_NOT_DISPUTABLE_AFTER_FACTORING,  http: 409, condition: "Dispute filed on a FACTORED or RECOURSED invoice" }
  - { id: ERR_INVOICE_NOTHING_TO_WRITE_OFF,            http: 409, condition: "/write-off when balance_due_cents == 0" }
  - { id: ERR_CLAIM_NOT_OPEN,                          http: 409, condition: "/start-review or /withdraw on a claim not in OPEN/IN_REVIEW" }
  - { id: ERR_CLAIM_NOT_IN_REVIEW,                     http: 409, condition: "/counter, /resolve, /escalate on a claim not in IN_REVIEW" }
  - { id: ERR_CLAIM_NOT_COUNTER_OFFERED,               http: 409, condition: "/accept-counter or /reject-counter on a claim not in COUNTER_OFFERED" }

  # --- Rate contracts / referential ---
  - { id: ERR_RATE_CONTRACT_OVERLAP,                   http: 409, condition: "POST /rate-contracts overlaps an existing ACTIVE row on shipper+lane+equipment" }
  - { id: ERR_RATE_CONTRACT_AMBIGUOUS,                 http: 409, condition: "Quote resolution finds >1 ACTIVE RateContract for shipper+lane+equipment at clock_now_iso" }

  # --- Fiscal ---
  - { id: ERR_SHIPPER_CREDIT_LIMIT_EXCEEDED,           http: 402, condition: "Outstanding + new linehaul exceeds Shipper.credit_limit_cents at /accept" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator persona; creates brokerages, drives the test clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /brokerages"
      - "POST /brokerages/{brokerageId}/_clock/advance"
      - "POST /brokerages/{brokerageId}/_sweep/expire-quotes"

  - name: BrokerOps
    description: "Brokerage employees managing shippers, contracts, quotes, loads, invoices, and disputes"
    identity: "opaque"
    exclusive_operations:
      - "POST /brokerages/{brokerageId}/shippers"
      - "POST /brokerages/{brokerageId}/shippers/{shipperId}/suspend"
      - "POST /brokerages/{brokerageId}/rate-contracts"
      - "POST /brokerages/{brokerageId}/rate-contracts/{contractId}/terminate"
      - "POST .../quote-requests/{quoteId}/quote"
      - "POST .../loads (tender)"
      - "POST .../loads/{loadId}/invoice"
      - "POST .../accessorial-charges/{chargeId}/approve"
      - "POST .../accessorial-charges/{chargeId}/deny"
      - "POST .../invoices/{invoiceId}/factor"
      - "POST .../invoices/{invoiceId}/write-off"
      - "POST .../dispute-claims/{claimId}/start-review"
      - "POST .../dispute-claims/{claimId}/counter"
      - "POST .../dispute-claims/{claimId}/resolve"
      - "POST .../dispute-claims/{claimId}/escalate"
    shared_operations:
      - "POST .../loads/{loadId}/cancel (shared with ShipperUser)"
      - "Read-only listing/get on shippers, carriers, contracts, loads, invoices, claims"

  - name: CarrierOps
    description: "Brokerage's carrier-onboarding team; manages carrier qualification lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /brokerages/{brokerageId}/carriers"
      - "POST .../carriers/{carrierId}/qualify"
      - "POST .../carriers/{carrierId}/suspend"
      - "POST .../carriers/{carrierId}/requalify"
      - "POST .../carriers/{carrierId}/revoke"
    shared_operations:
      - "Read-only listing/get on carriers"

  - name: ShipperUser
    description: "End-user acting AS a specific Shipper; X-User-ID == Shipper.id"
    identity: "entity_backed:Shipper"
    exclusive_operations:
      - "POST .../shippers/{shipperId}/quote-requests (own shipper only)"
      - "POST .../quote-requests/{quoteId}/accept (own shipper only)"
      - "POST .../quote-requests/{quoteId}/reject (own shipper only)"
      - "POST .../invoices/{invoiceId}/dispute-claims (only invoices for own shipper)"
      - "POST .../dispute-claims/{claimId}/accept-counter (own shipper's claim only)"
      - "POST .../dispute-claims/{claimId}/reject-counter (own shipper's claim only)"
      - "POST .../dispute-claims/{claimId}/withdraw (own shipper's claim only)"
    shared_operations:
      - "POST .../loads/{loadId}/cancel (shared with BrokerOps; own shipper only)"
      - "Read-only access scoped to own shipper's quotes/loads/invoices/claims"

  - name: CarrierUser
    description: "End-user acting AS a specific Carrier; X-User-ID == Carrier.id"
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST .../loads/{loadId}/carrier-accept (own carrier only)"
      - "POST .../loads/{loadId}/depart (own carrier only)"
      - "POST .../loads/{loadId}/deliver (own carrier only)"
      - "POST .../loads/{loadId}/accessorial-charges (own carrier only)"
    shared_operations:
      - "Read-only access to loads assigned to own carrier"
