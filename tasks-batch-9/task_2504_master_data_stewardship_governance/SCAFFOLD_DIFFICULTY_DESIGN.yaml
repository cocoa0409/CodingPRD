  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: withdraw_after_schedule_restores_counters_and_notifications
        grounds:
          - state_machines.ChangeRequest.SCHEDULED_to_WITHDRAWN
          - entities.Domain.fields.scheduled_change_count
          - entities.ConsumerSubscription.fields.pending_change_request_id
          - entities.Domain.fields.reference_data_revision
        distinguishing_aspect: |
          Withdrawing a SCHEDULED request must undo exactly what scheduling did - release the
          freeze window, decrement scheduled_change_count back to 0 and clear the notification
          quartet on the notified consumer including an acknowledgement already given - while
          leaving reference_data_revision untouched (only apply advances it) and preserving the
          request's own audit numbers impact_consumer_count / required_lead_days. Overshooting
          the compensation by decrementing reference_data_revision or by resetting the audit
          numbers is the failure mode.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Domain CUSTOMER ACTIVE / OPEN, notification_lead_days_floor 5, classification INTERNAL."
            - "Consumers C1 (TIER1, required_lead_days 10) and C2 (TIER2, required_lead_days 3) are ACTIVE."
            - "A non-structural REFERENCE_VALUE_ADD request is SUBMITTED (impact 1 TIER1 consumer, lead 10 days), APPROVED, SCHEDULED for 2026-08-16T00:00:00Z, and C1 has acknowledged."
