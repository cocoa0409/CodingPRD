  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: start_analysis_blocked_by_lapsed_method_validation_on_a_third_entity
        grounds:
          - state_machines.ExaminationRequest.ASSIGNED_to_IN_ANALYSIS
          - validations[priority=12]
          - errors[ERR_METHOD_VALIDATION_EXPIRED]
          - entities.Method.fields.validation_expires_at_utc
          - entities.EvidenceItem.fields.checkout_count
        distinguishing_aspect: |
          The gate lives on a third entity that the acting call never names: the request is ASSIGNED,
          the analyst is QUALIFIED and the evidence item is IN_VAULT, yet start-analysis is refused
          because the Method row it points at has a validation_expires_at_utc that the logical clock
          has reached. The comparison is strictly-after, so the clock sitting exactly ON the expiry
          instant refuses, and one second earlier admits - and the refused attempt must leave the
          evidence item's checkout_count at 0 rather than checking it out and rolling back the status
          only.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z while the fixtures are built."
            - "Analyst A1: BIOLOGY, competency 4, weekly_capacity_hours 40.00, training_hours_per_week 8.00, QUALIFIED, employment_status ACTIVE."
            - "Method M1 VALIDATED at 2026-08-01T00:00:00Z with validation_expires_at_utc exactly 2026-09-01T00:00:00Z, discipline BIOLOGY, standard_hours_per_item 4.00, min_competency_level 3, max_items_per_request 6."
            - "Case C1 (AGG_ASSAULT) ACCEPTED with one BIOLOGICAL vault item E1 (checkout_count 0)."
            - "Request R1 (C1, E1, M1, item_count 2) assigned to A1 -> status ASSIGNED, estimated_hours 8.00, E1 still IN_VAULT."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
