scenario: "On-Demand Interpretation Scheduling: request & language pair/modality (phone/video/onsite), interpreter pool & certification (medical/legal/court), on-demand vs scheduled assignment, per-minute/per-hour billing, no-show/cancellation, quality/rating & complaint, client (hospital/court) account, encounter reporting"
domain_name: "interpretation-scheduling"
api_prefix: "/interpretation"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions

  entity_topology: graph
  # Peer entities linked by FKs (flat/graph): Request references LanguagePair,
  # Client, RatePlan; Assignment references Request + Interpreter; Interpreter
  # holds many Certifications; Session derives from Assignment; Encounter,
  # Rating, Complaint, Invoice reference Session. Many-to-many between
  # Interpreter and LanguagePair via InterpreterLanguage junction.

  state_machine_shape: parallel
  # Assignment runs two independent dimensions (lifecycle_status × billing_status).
  # Session has a cyclic dispute loop. Request has branching (on-demand vs
  # scheduled). Complaint has a revert cycle. Multiple non-linear machines.

  relationship_patterns:
    - one_to_many        # Client -> Request, Interpreter -> Certification
    - many_to_many       # Interpreter <-> LanguagePair via InterpreterLanguage
    - cross_aggregate    # Assignment references Request and Interpreter

  role_model: peer_roles
  # ClientAccount owns Requests; Interpreter owns Assignment acceptance/sessions;
  # PlatformAdmin/CoordinatorOps operate the pool, rates, and clock.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: ClientAccount
    parent: null
    common_fields: true
    fields:
      - name: org_name
        type: string
        source: input
        description: "Legal name of the client organization"
      - name: org_type
        type: enum
        source: input
        description: "Sector of the client"
        constraints: "one of {HOSPITAL, COURT, CLINIC, LAW_FIRM}"
      - name: contact_email
        type: string
        source: input
        description: "Primary billing/contact email"
      - name: status
        type: enum
        source: system
        description: "Account lifecycle status"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, SUSPENDED}; SUSPENDED set by PlatformAdmin"
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum unpaid invoice balance permitted before new requests are blocked"
        default: 5000000
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Sum of Invoice.total_cents for this client whose status IN {ISSUED} (unpaid); recomputed on every invoice issue and settlement"
        default: 0

  - name: RatePlan
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> ClientAccount.id; the client this negotiated rate plan applies to"
      - name: certification_tier
        type: enum
        source: input
        description: "Certification tier this rate row covers"
        constraints: "one of {MEDICAL, LEGAL, COURT}"
      - name: modality
        type: enum
        source: input
        description: "Modality this rate row covers"
        constraints: "one of {PHONE, VIDEO, ONSITE}"
      - name: billing_mode
        type: enum
        source: input
        description: "Whether sessions under this plan bill per-minute or per-hour"
        constraints: "one of {PER_MINUTE, PER_HOUR}"
      - name: rate_cents
        type: integer
        source: input
        description: "Cents per minute (PER_MINUTE) or cents per hour (PER_HOUR)"
      - name: min_block_units
        type: integer
        source: input
        description: "Minimum billable block: minutes if PER_MINUTE, hours if PER_HOUR"
        default: 10
      - name: travel_surcharge_cents
        type: integer
        source: input
        description: "Flat surcharge added once per ONSITE session; must be 0 for PHONE/VIDEO"
        default: 0
      - name: active
        type: boolean
        source: system
        description: "Whether this rate row is the current effective row for its (client,tier,modality) key"
        default: true

  - name: LanguagePair
    parent: null
    common_fields: true
    fields:
      - name: source_lang
        type: string
        source: input
        description: "ISO 639 code of the spoken-from language (e.g. en)"
      - name: target_lang
        type: string
        source: input
        description: "ISO 639 code of the spoken-to language (e.g. es)"
      - name: rare
        type: boolean
        source: input
        description: "Whether this pair is flagged rare (affects fulfillment SLA, never billing)"
        default: false

  - name: Interpreter
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Interpreter display name"
      - name: status
        type: enum
        source: system
        description: "Pool availability status"
        default: "AVAILABLE"
        constraints: "one of {AVAILABLE, BUSY, OFFLINE, DEACTIVATED}"
      - name: max_concurrent_load
        type: integer
        source: input
        description: "Maximum number of in-flight ACTIVE assignments (active_load ceiling) this interpreter may hold at once"
        default: 1
      - name: active_load
        type: integer
        source: computed
        description: "Count of this interpreter's Assignment rows with lifecycle_status IN {ACCEPTED, IN_SESSION}; recomputed on every assignment transition"
        default: 0
      - name: rating_avg
        type: number
        source: computed
        description: "Mean of Rating.score over this interpreter's rated sessions, 1 decimal round_half_up; null until first rating"
      - name: rating_count
        type: integer
        source: computed
        description: "Count of Rating rows attributed to this interpreter"
        default: 0
      - name: acceptance_pct
        type: number
        source: computed
        description: "Percentage of offered Assignments this interpreter ACCEPTED vs DECLINED+EXPIRED, 0-100; defaults to 100 with no history"
        default: 100
      - name: no_show_strikes
        type: integer
        source: computed
        description: "Count of sessions where this interpreter was marked INTERPRETER_NO_SHOW; at 3 the system DEACTIVATES the interpreter"
        default: 0

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - name: interpreter_id
        type: string
        source: input
        description: "FK -> Interpreter.id; the interpreter holding this credential"
      - name: tier
        type: enum
        source: input
        description: "Credential tier"
        constraints: "one of {MEDICAL, LEGAL, COURT}"
      - name: expires_at
        type: datetime
        source: input
        description: "ISO 8601 UTC expiry instant; certification is valid only while clock < expires_at"
      - name: revoked
        type: boolean
        source: system
        description: "Whether this credential has been administratively revoked"
        default: false

  - name: InterpreterLanguage
    parent: null
    common_fields: true
    fields:
      - name: interpreter_id
        type: string
        source: input
        description: "FK -> Interpreter.id; junction side A"
      - name: language_pair_id
        type: string
        source: input
        description: "FK -> LanguagePair.id; junction side B (the pair this interpreter can service)"

  - name: InterpretationRequest
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> ClientAccount.id; the requesting client"
      - name: language_pair_id
        type: string
        source: input
        description: "FK -> LanguagePair.id; required language pair"
      - name: modality
        type: enum
        source: input
        description: "Requested modality"
        constraints: "one of {PHONE, VIDEO, ONSITE}"
      - name: required_tier
        type: enum
        source: input
        description: "Minimum certification tier required"
        constraints: "one of {MEDICAL, LEGAL, COURT}"
      - name: scheduling_mode
        type: enum
        source: input
        description: "ON_DEMAND fulfills now; SCHEDULED reserves a future window"
        constraints: "one of {ON_DEMAND, SCHEDULED}"
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the reserved window; required when scheduling_mode=SCHEDULED, must be omitted/null for ON_DEMAND"
      - name: window_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the reserved window; required when scheduling_mode=SCHEDULED; window_end must be strictly after window_start"
      - name: status
        type: enum
        source: system
        description: "Request lifecycle"
        default: "OPEN"
        constraints: "one of {OPEN, ASSIGNED, FULFILLED, CANCELLED, UNFULFILLABLE}"
      - name: cancellation_fee_cents
        type: integer
        source: computed
        description: "Fee charged on late cancellation or client no-show; 0 until such an event"
        default: 0

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> InterpretationRequest.id; the request this assignment fulfills"
      - name: interpreter_id
        type: string
        source: input
        description: "FK -> Interpreter.id; the interpreter offered/assigned"
      - name: lifecycle_status
        type: enum
        source: system
        description: "Assignment lifecycle dimension (independent of billing_status)"
        default: "OFFERED"
        constraints: "one of {OFFERED, ACCEPTED, DECLINED, EXPIRED, IN_SESSION, COMPLETED, CANCELLED}"
      - name: billing_status
        type: enum
        source: system
        description: "Assignment billing dimension, evolves independently of lifecycle_status"
        default: "UNBILLED"
        constraints: "one of {UNBILLED, BILLABLE, INVOICED, WAIVED}"
      - name: offered_at
        type: datetime
        source: system
        description: "Clock instant the offer was made; offer EXPIRES if not accepted within OFFER_TTL_SECONDS"
      - name: assignment_type
        type: enum
        source: system
        description: "ON_DEMAND or SCHEDULED, copied from the request at offer time"
        constraints: "one of {ON_DEMAND, SCHEDULED}"

  - name: Session
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the assignment this session realizes"
      - name: status
        type: enum
        source: system
        description: "Session lifecycle"
        default: "CONNECTING"
        constraints: "one of {CONNECTING, ACTIVE, ENDED, DISPUTED, RECONCILED, CLIENT_NO_SHOW, INTERPRETER_NO_SHOW}"
      - name: connected_at
        type: datetime
        source: system
        description: "Clock instant the session became ACTIVE; null until then"
      - name: ended_at
        type: datetime
        source: system
        description: "Clock instant the session ENDED; null until then"
      - name: billed_units
        type: integer
        source: computed
        description: "Whole billable units (minutes or hours) after min-block flooring; computed at end-session"
        default: 0
      - name: billed_amount_cents
        type: integer
        source: computed
        description: "Final session charge in cents per the effective RatePlan; computed at end-session, recomputed on dispute reconcile"
        default: 0

  - name: Encounter
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> Session.id; the session this encounter report documents"
      - name: subject_ref
        type: string
        source: input
        description: "Opaque client-side reference (e.g. case number, MRN placeholder); never used in any business decision"
      - name: summary
        type: string
        source: input
        description: "Free-text encounter notes filed by the client after the session ENDS"
      - name: filed_at
        type: datetime
        source: system
        description: "Clock instant the encounter report was filed"

  - name: Rating
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> Session.id; the session being rated (one rating per session)"
      - name: interpreter_id
        type: string
        source: system
        description: "FK -> Interpreter.id; copied from the session's assignment at rating time"
      - name: score
        type: integer
        source: input
        description: "Quality score 1-5 inclusive"
        constraints: "integer in [1,5]"
      - name: comment
        type: string
        source: input
        description: "Optional free-text rating comment"

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> Session.id; the session complained about"
      - name: client_id
        type: string
        source: system
        description: "FK -> ClientAccount.id; copied from the session's request at file time"
      - name: category
        type: enum
        source: input
        description: "Complaint reason"
        constraints: "one of {QUALITY, CONDUCT, BILLING, NO_SHOW}"
      - name: status
        type: enum
        source: system
        description: "Complaint lifecycle"
        default: "FILED"
        constraints: "one of {FILED, UNDER_REVIEW, NEEDS_INFO, UPHELD, DISMISSED}"
      - name: remedy_credit_cents
        type: integer
        source: computed
        description: "Credit applied to the client when an UPHELD complaint waives a session charge; 0 otherwise"
        default: 0

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> ClientAccount.id; the billed client"
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle"
        default: "DRAFT"
        constraints: "one of {DRAFT, ISSUED, SETTLED, VOID}"
      - name: line_count
        type: integer
        source: computed
        description: "Number of billable sessions swept into this invoice"
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of swept Session.billed_amount_cents"
        default: 0
      - name: fees_cents
        type: integer
        source: computed
        description: "Sum of cancellation/no-show fees swept into this invoice"
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents + fees_cents, pinned at issue time"
        default: 0

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: InterpretationRequest
    initial_state: OPEN
    terminal_states: [FULFILLED, CANCELLED, UNFULFILLABLE]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /interpretation/requests/{id}/dispatch (system selects interpreter and creates Assignment)"
        actor: CoordinatorOps
        preconditions:
          - "request.status == OPEN"
          - "ClientAccount.status == ACTIVE"
          - "expected_request_version matches request.version"
          - "at least one eligible interpreter exists per selection rule interpreter_selection"
        side_effects:
          - "creates one Assignment with lifecycle_status=OFFERED, billing_status=UNBILLED, offered_at=clock, assignment_type=request.scheduling_mode"
          - "sets request.status=ASSIGNED"
          - "increments InterpretationRequest.version by 1"
        note: "If no eligible interpreter exists the request instead goes OPEN->UNFULFILLABLE (separate transition)."
      - from: OPEN
        to: UNFULFILLABLE
        trigger: "POST /interpretation/requests/{id}/dispatch when candidate pool is empty"
        actor: CoordinatorOps
        preconditions:
          - "request.status == OPEN"
          - "selection rule interpreter_selection yields an empty candidate set"
        side_effects:
          - "sets request.status=UNFULFILLABLE"
          - "increments InterpretationRequest.version by 1"
      - from: ASSIGNED
        to: FULFILLED
        trigger: "system: Session for this request's Assignment reaches RECONCILED or ENDED"
        actor: system
        preconditions:
          - "the Assignment's Session.status IN {ENDED, RECONCILED}"
        side_effects:
          - "sets request.status=FULFILLED"
      - from: ASSIGNED
        to: OPEN
        trigger: "system: the offered Assignment EXPIRES or is DECLINED"
        actor: system
        preconditions:
          - "Assignment.lifecycle_status IN {EXPIRED, DECLINED}"
        side_effects:
          - "sets request.status=OPEN so it can be re-dispatched to a different interpreter"
          - "increments InterpretationRequest.version by 1 (a client holding the pre-decline version is now stale for OCC on re-dispatch)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /interpretation/requests/{id}/cancel"
        actor: ClientAccount
        preconditions:
          - "request.status IN {OPEN, ASSIGNED}"
          - "acting client owns the request"
        side_effects:
          - "runs cancellation_fee calc; sets request.cancellation_fee_cents"
          - "if an Assignment is OFFERED/ACCEPTED, cascades Assignment lifecycle_status->CANCELLED and decrements Interpreter.active_load and recomputes Interpreter.status"
          - "sets request.status=CANCELLED"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /interpretation/requests/{id}/cancel"
        actor: ClientAccount
        preconditions:
          - "request.status == ASSIGNED"
          - "acting client owns the request"
          - "the Assignment's Session has not yet reached ACTIVE"
        side_effects:
          - "runs cancellation_fee calc (late-cancel band may apply for SCHEDULED inside the late window); sets request.cancellation_fee_cents"
          - "cascades Assignment lifecycle_status->CANCELLED; if a late fee applies sets Assignment.billing_status=BILLABLE else WAIVED"
          - "decrements Interpreter.active_load by 1 and, if interpreter was BUSY at load 0, sets Interpreter.status=AVAILABLE"
          - "sets request.status=CANCELLED"

  - entity: Assignment
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED, COMPLETED, CANCELLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /interpretation/assignments/{id}/accept"
        actor: Interpreter
        preconditions:
          - "assignment.lifecycle_status == OFFERED"
          - "acting interpreter owns this assignment"
          - "clock < assignment.offered_at + OFFER_TTL_SECONDS"
          - "Interpreter.active_load < Interpreter.max_concurrent_load"
        side_effects:
          - "sets lifecycle_status=ACCEPTED"
          - "increments Interpreter.active_load by 1; if active_load reaches max_concurrent_load sets Interpreter.status=BUSY"
          - "recomputes Interpreter.acceptance_pct"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /interpretation/assignments/{id}/decline"
        actor: Interpreter
        preconditions:
          - "assignment.lifecycle_status == OFFERED"
          - "acting interpreter owns this assignment"
        side_effects:
          - "sets lifecycle_status=DECLINED"
          - "recomputes Interpreter.acceptance_pct"
          - "bubbles up: request.status ASSIGNED->OPEN (re-dispatchable)"
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /interpretation/_clock/set_current_utc advances clock past offered_at+OFFER_TTL_SECONDS, then GET reflects EXPIRED; or system sweep"
        actor: system
        preconditions:
          - "assignment.lifecycle_status == OFFERED"
          - "clock >= assignment.offered_at + OFFER_TTL_SECONDS"
        side_effects:
          - "sets lifecycle_status=EXPIRED"
          - "recomputes Interpreter.acceptance_pct"
          - "bubbles up: request.status ASSIGNED->OPEN"
      - from: ACCEPTED
        to: IN_SESSION
        trigger: "POST /interpretation/assignments/{id}/start-session"
        actor: Interpreter
        preconditions:
          - "assignment.lifecycle_status == ACCEPTED"
          - "no Session already exists for this assignment"
          - "for SCHEDULED: clock >= request.window_start - EARLY_START_GRACE_SECONDS"
        side_effects:
          - "creates Session with status=CONNECTING"
          - "sets lifecycle_status=IN_SESSION"
      - from: IN_SESSION
        to: COMPLETED
        trigger: "system: the Session reaches ENDED, RECONCILED, CLIENT_NO_SHOW, or INTERPRETER_NO_SHOW"
        actor: system
        preconditions:
          - "Session.status IN {ENDED, RECONCILED, CLIENT_NO_SHOW, INTERPRETER_NO_SHOW}"
        side_effects:
          - "sets lifecycle_status=COMPLETED"
          - "decrements Interpreter.active_load by 1; if interpreter was BUSY sets Interpreter.status=AVAILABLE"
          - "sets billing_status=BILLABLE unless the session was WAIVED (no-show/complaint) in which case WAIVED"

  - entity: Session
    initial_state: CONNECTING
    terminal_states: [RECONCILED, CLIENT_NO_SHOW, INTERPRETER_NO_SHOW]
    transitions:
      - from: CONNECTING
        to: ACTIVE
        trigger: "POST /interpretation/sessions/{id}/connect"
        actor: Interpreter
        preconditions:
          - "session.status == CONNECTING"
          - "acting interpreter owns the parent assignment"
        side_effects:
          - "sets connected_at=clock; status=ACTIVE"
      - from: CONNECTING
        to: CLIENT_NO_SHOW
        trigger: "POST /interpretation/sessions/{id}/mark-no-show with party=CLIENT"
        actor: CoordinatorOps
        preconditions:
          - "session.status == CONNECTING"
          - "clock >= scheduled start + NO_SHOW_GRACE_SECONDS (for SCHEDULED) or offer accept + NO_SHOW_GRACE_SECONDS (for ON_DEMAND)"
        side_effects:
          - "sets status=CLIENT_NO_SHOW"
          - "runs no_show_fee calc; sets request.cancellation_fee_cents and Assignment.billing_status=BILLABLE"
          - "bubbles up: Assignment IN_SESSION->COMPLETED; request ASSIGNED->FULFILLED"
      - from: CONNECTING
        to: INTERPRETER_NO_SHOW
        trigger: "POST /interpretation/sessions/{id}/mark-no-show with party=INTERPRETER"
        actor: CoordinatorOps
        preconditions:
          - "session.status == CONNECTING"
          - "clock >= scheduled/accepted start + NO_SHOW_GRACE_SECONDS"
        side_effects:
          - "sets status=INTERPRETER_NO_SHOW; Assignment.billing_status=WAIVED (no client charge)"
          - "increments Interpreter.no_show_strikes by 1"
          - "cascade: when no_show_strikes reaches DEACTIVATION_STRIKES, Interpreter.status=DEACTIVATED and active_load reset; that deactivation in turn CANCELS every other OFFERED Assignment held by the interpreter (lifecycle_status->CANCELLED) which in turn bubbles each affected request ASSIGNED->OPEN"
          - "bubbles up: Assignment IN_SESSION->COMPLETED; request ASSIGNED->FULFILLED"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /interpretation/sessions/{id}/end"
        actor: Interpreter
        preconditions:
          - "session.status == ACTIVE"
          - "acting interpreter owns the parent assignment"
        side_effects:
          - "sets ended_at=clock"
          - "runs session_billing calc; sets billed_units, billed_amount_cents"
          - "sets status=ENDED"
          - "bubbles up: Assignment IN_SESSION->COMPLETED with billing_status=BILLABLE; request ASSIGNED->FULFILLED"
      - from: ENDED
        to: DISPUTED
        trigger: "POST /interpretation/sessions/{id}/dispute"
        actor: ClientAccount
        preconditions:
          - "session.status == ENDED"
          - "acting client owns the session's request"
          - "session not yet swept into an ISSUED Invoice"
        side_effects:
          - "sets status=DISPUTED"
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /interpretation/sessions/{id}/reconcile"
        actor: CoordinatorOps
        preconditions:
          - "session.status == DISPUTED"
          - "reconcile payload supplies corrected_billed_units >= 0"
        side_effects:
          - "recomputes billed_amount_cents from corrected_billed_units against the effective RatePlan"
          - "sets status=RECONCILED"
        note: "Dispute loop: a session may go ENDED->DISPUTED->RECONCILED; RECONCILED is terminal and re-pins Assignment.billing_status=BILLABLE with the corrected amount."
      - from: DISPUTED
        to: ACTIVE
        trigger: "POST /interpretation/sessions/{id}/reopen (coordinator reopens a disputed session for additional billable time)"
        actor: CoordinatorOps
        preconditions:
          - "session.status == DISPUTED"
        side_effects:
          - "clears ended_at; sets status=ACTIVE"
        note: "Cyclic: ACTIVE->ENDED->DISPUTED->ACTIVE is the revision loop; each ACTIVE->ENDED re-runs session_billing."

  - entity: Complaint
    initial_state: FILED
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /interpretation/complaints/{id}/review"
        actor: PlatformAdmin
        preconditions:
          - "complaint.status == FILED"
        side_effects:
          - "sets status=UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /interpretation/complaints/{id}/request-info"
        actor: PlatformAdmin
        preconditions:
          - "complaint.status == UNDER_REVIEW"
        side_effects:
          - "sets status=NEEDS_INFO"
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /interpretation/complaints/{id}/resubmit"
        actor: ClientAccount
        preconditions:
          - "complaint.status == NEEDS_INFO"
          - "acting client owns the complaint"
        side_effects:
          - "sets status=UNDER_REVIEW"
        note: "Revert cycle: UNDER_REVIEW<->NEEDS_INFO may loop before resolution."
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /interpretation/complaints/{id}/resolve with disposition=UPHELD"
        actor: PlatformAdmin
        preconditions:
          - "complaint.status == UNDER_REVIEW"
        side_effects:
          - "if category==BILLING or NO_SHOW: cascade waives the session charge — Session's Assignment.billing_status->WAIVED, sets complaint.remedy_credit_cents = session.billed_amount_cents, and that waiver in turn debits ClientAccount.outstanding_balance_cents by the same amount if the session was already swept into an ISSUED invoice"
          - "sets status=UPHELD"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /interpretation/complaints/{id}/resolve with disposition=DISMISSED"
        actor: PlatformAdmin
        preconditions:
          - "complaint.status == UNDER_REVIEW"
        side_effects:
          - "sets status=DISMISSED; no billing effect"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: dispatch-stale-request
    parent_entity: InterpretationRequest
    write_endpoint: "POST /interpretation/requests/{id}/dispatch"
    occ_field: "expected_request_version"
    description: |
      Dispatching a request whose version has advanced since the client last
      observed it is rejected. This captures the case where another coordinator
      has already dispatched the request (creating an Assignment that
      legitimately advances the request to ASSIGNED and bumps its version) and
      the current caller's view of the request is therefore stale; a second
      dispatch must not create a duplicate competing Assignment.
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: session_billing
    trigger: "Session ACTIVE->ENDED, and re-run on DISPUTED->RECONCILED with corrected units"
    algorithm: tiered_pricing
    formula: |
      effective_plan = the RatePlan row where client_id == request.client_id
                       AND certification_tier == request.required_tier
                       AND modality == request.modality AND active == true
      duration_seconds = ended_at - connected_at
      if effective_plan.billing_mode == PER_MINUTE:
          raw_units = ceil(duration_seconds / 60)
          billed_units = max(raw_units, effective_plan.min_block_units)
          billed_amount_cents = billed_units * effective_plan.rate_cents
      else:  # PER_HOUR
          raw_units = ceil(duration_seconds / 3600)
          billed_units = max(raw_units, effective_plan.min_block_units)
          billed_amount_cents = billed_units * effective_plan.rate_cents
                                + (effective_plan.travel_surcharge_cents if modality==ONSITE else 0)
      # On RECONCILE, raw_units is replaced by the supplied corrected_billed_units
      # (already whole units), still floored to min_block_units, and the same
      # rate/surcharge applies.
    input_set: "Exactly one session; the single active RatePlan row matching (client, tier, modality)."
    constants:
      SECONDS_PER_MINUTE: 60
      SECONDS_PER_HOUR: 3600
    precision: "integer cents; ceil applied to time->units BEFORE multiply; surcharge added AFTER multiply (per-line order pinned)"
    variants:
      - name: per_minute_block
        when: "effective_plan.billing_mode == PER_MINUTE"
        difference: "ceil to whole minutes, floor to min_block_units minutes, never adds travel surcharge"
      - name: per_hour_block
        when: "effective_plan.billing_mode == PER_HOUR"
        difference: "ceil to whole hours, floor to min_block_units hours, adds travel_surcharge_cents once when modality==ONSITE"

  - name: cancellation_fee
    trigger: "InterpretationRequest OPEN/ASSIGNED->CANCELLED and Session CONNECTING->CLIENT_NO_SHOW"
    algorithm: threshold
    formula: |
      effective_plan = active RatePlan for (client, required_tier, modality)
      estimated_min_charge = effective_plan.min_block_units * effective_plan.rate_cents
                             + (effective_plan.travel_surcharge_cents if modality==ONSITE else 0)
      if scheduling_mode == ON_DEMAND:
          fee = 0      # on-demand requests cancel free until a session connects
      else:  # SCHEDULED
          lead_seconds = window_start - clock_now
          if lead_seconds >= LATE_CANCEL_WINDOW_SECONDS:
              fee = 0                                  # cancelled early, no fee
          elif lead_seconds >= 0:
              fee = round(estimated_min_charge * LATE_CANCEL_PCT)   # inside late window
          else:
              fee = round(estimated_min_charge * NO_SHOW_PCT)       # past window => no-show band
    input_set: "Single request + its active RatePlan; clock-relative lead time decides the band."
    constants:
      LATE_CANCEL_WINDOW_SECONDS: 7200
      LATE_CANCEL_PCT: 0.50
      NO_SHOW_PCT: 0.50
    precision: "integer cents, round_half_up at the single multiply"
    variants:
      - name: ondemand_free_cancel
        when: "scheduling_mode == ON_DEMAND"
        difference: "fee is always 0; the boundary is whether a Session has reached ACTIVE, not lead time"
      - name: scheduled_late_band
        when: "scheduling_mode == SCHEDULED and 0 <= lead_seconds < LATE_CANCEL_WINDOW_SECONDS"
        difference: "fee = 50% of estimated minimum block; depends on clock-vs-window_start arithmetic, not on duration"

  - name: no_show_fee
    trigger: "Session CONNECTING->CLIENT_NO_SHOW"
    algorithm: threshold
    formula: |
      effective_plan = active RatePlan for (client, required_tier, modality)
      estimated_min_charge = effective_plan.min_block_units * effective_plan.rate_cents
                             + (effective_plan.travel_surcharge_cents if modality==ONSITE else 0)
      fee = round(estimated_min_charge * NO_SHOW_PCT)
    input_set: "Single session's request + active RatePlan; independent of any elapsed time."
    constants:
      NO_SHOW_PCT: 0.50
    precision: "integer cents, round_half_up"
    variants:
      - name: client_no_show_charge
        when: "party == CLIENT"
        difference: "client charged 50% of estimated minimum block; Assignment.billing_status=BILLABLE"
      - name: interpreter_no_show_waive
        when: "party == INTERPRETER"
        difference: "no client charge (fee=0, billing_status=WAIVED); instead interpreter no_show_strikes increment"

  - name: interpreter_selection
    trigger: "POST /interpretation/requests/{id}/dispatch"
    algorithm: weighted_scoring
    formula: |
      candidates = Interpreter where
          status == AVAILABLE
          AND active_load < max_concurrent_load
          AND EXISTS InterpreterLanguage(interpreter, request.language_pair_id)
          AND EXISTS Certification(interpreter) with tier == request.required_tier
              AND revoked == false AND clock < expires_at
          AND (request.scheduling_mode != SCHEDULED OR NOT double_booked(interpreter, request))
      # double_booked(i, req): the interpreter holds another non-terminal (OFFERED/ACCEPTED/IN_SESSION)
      # SCHEDULED assignment whose request window [ws,we] shares ANY instant with req's window
      # under CLOSED-interval semantics (touching endpoints conflict) — see validations[priority=10].
      if candidates empty: return EMPTY  (caller transitions request->UNFULFILLABLE)
      rating_for(i) = i.rating_avg if i.rating_count > 0 else DEFAULT_RATING
      score(i) = rating_for(i) * 100 * W_RATING
                 + i.acceptance_pct * W_ACCEPT
                 + (1 - i.active_load / i.max_concurrent_load) * 100 * W_LOAD
      winner = argmax score(i)
      tie-break: lowest active_load, then earliest Interpreter.created_at (NEVER id)
    input_set: "All Interpreter rows meeting the eligibility filter for this request."
    constants:
      W_RATING: 0.5
      W_ACCEPT: 0.3
      W_LOAD: 0.2
      DEFAULT_RATING: 4.0
    precision: "score to 4 decimals; tie-break on active_load ASC then created_at ASC"
    variants:
      - name: rated_candidate
        when: "candidate.rating_count > 0"
        difference: "uses the interpreter's real rating_avg in the score"
      - name: unrated_candidate
        when: "candidate.rating_count == 0"
        difference: "substitutes DEFAULT_RATING=4.0 so brand-new interpreters are not ranked at 0"

  - name: rating_aggregate
    trigger: "POST /interpretation/sessions/{id}/rating creates a Rating; recomputed on complaint-driven recompute"
    algorithm: aggregation
    formula: |
      interpreter_ratings = Rating where interpreter_id == X
                            (one Rating per session; all included regardless of session status)
      rating_count = count(interpreter_ratings)
      rating_avg = round(sum(score) / rating_count, 1)   # round_half_up, 1 decimal
    input_set: "All Rating rows for the interpreter; no status filter (every filed rating counts)."
    constants: {}
    precision: "1 decimal place, round_half_up; null avg until first rating"
    variants:
      - name: first_rating
        when: "rating_count transitions 0->1"
        difference: "rating_avg becomes exactly that score; interpreter selection switches from DEFAULT_RATING to real avg"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /interpretation/_clock/set_current_utc which still requires PlatformAdmin"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path-referenced resource exists, validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing paths"
  - priority: 4
    category: business_referential
    check: "Every FK in the body resolves to an existing resource (client_id, language_pair_id, interpreter_id, session_id, assignment_id, request_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "all create endpoints with FK body fields"
  - priority: 5
    category: business_constraint
    check: "Request body is well-formed: enum members valid, score in [1,5], required fields present, modality/scheduling_mode field-presence rules (window_start/window_end required iff SCHEDULED), travel_surcharge_cents==0 unless modality==ONSITE on RatePlan"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"
  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: business_referential
    check: "Acting entity_backed user owns the target resource (client owns request/session/complaint; interpreter owns assignment/session)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "ClientAccount and Interpreter ownership-scoped endpoints"
  - priority: 8
    category: business_safety
    check: "On dispatch/selection, the chosen interpreter holds a valid (non-revoked, non-expired) Certification at the required tier and can service the language pair"
    error_id: ERR_NO_QUALIFIED_INTERPRETER
    http_status: 409
    applies_to: "POST /interpretation/requests/{id}/dispatch"
  - priority: 9
    category: business_temporal
    check: "Offer accept occurs within OFFER_TTL_SECONDS of offered_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /interpretation/assignments/{id}/accept"
  - priority: 10
    category: business_temporal
    check: "A SCHEDULED request's window does not overlap any other ACTIVE/CONNECTING session window of the SAME interpreter; closed-interval overlap (touching endpoints conflict)"
    error_id: ERR_INTERPRETER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /interpretation/requests/{id}/dispatch (SCHEDULED)"
  - priority: 11
    category: business_temporal
    check: "A SCHEDULED request's [window_start, window_end) must not overlap any other OPEN/ASSIGNED SCHEDULED request of the SAME client; half-open interval (adjacent windows that only touch are allowed)"
    error_id: ERR_CLIENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /interpretation/requests (SCHEDULED create)"
  - priority: 12
    category: business_constraint
    check: "Accepting interpreter's active_load < max_concurrent_load (pool capacity)"
    error_id: ERR_INTERPRETER_AT_CAPACITY
    http_status: 409
    applies_to: "POST /interpretation/assignments/{id}/accept"
  - priority: 13
    category: business_constraint
    check: "Exactly one Rating per session; second rating rejected"
    error_id: ERR_ALREADY_RATED
    http_status: 409
    applies_to: "POST /interpretation/sessions/{id}/rating"
  - priority: 14
    category: business_fiscal
    check: "Issuing/creating a request would not push ClientAccount.outstanding_balance_cents above credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /interpretation/requests, POST /interpretation/invoices/{id}/issue"
  - priority: 15
    category: state
    check: "OCC: expected_request_version matches current InterpretationRequest.version on dispatch"
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412
    applies_to: "POST /interpretation/requests/{id}/dispatch"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- ClientAccount ----
  - method: POST
    path: "/interpretation/clients"
    description: "Create a client (hospital/court) account"
    roles: [PlatformAdmin]
    code: 201
    input: ["org_name", "org_type", "contact_email", "credit_limit_cents?"]
    output: ClientAccount
    side_effects: ["status=ACTIVE", "outstanding_balance_cents=0"]
  - method: GET
    path: "/interpretation/clients/{id}"
    description: "Fetch a client account incl. computed outstanding_balance_cents"
    roles: [PlatformAdmin, ClientAccount, CoordinatorOps]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []
  - method: POST
    path: "/interpretation/clients/{id}/suspend"
    description: "Suspend a client account (blocks new requests)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ClientAccount
    side_effects: ["status=SUSPENDED"]

  # ---- RatePlan ----
  - method: POST
    path: "/interpretation/rate-plans"
    description: "Create/replace the active rate row for a (client,tier,modality) key; supersedes the prior active row"
    roles: [PlatformAdmin]
    code: 201
    input: ["client_id", "certification_tier", "modality", "billing_mode", "rate_cents", "min_block_units?", "travel_surcharge_cents?"]
    output: RatePlan
    side_effects: ["sets active=true; flips any prior active row for the same key to active=false"]
  - method: GET
    path: "/interpretation/rate-plans/{id}"
    description: "Fetch a single rate plan row"
    roles: [PlatformAdmin, CoordinatorOps]
    code: 200
    input: []
    output: RatePlan
    side_effects: []
  - method: GET
    path: "/interpretation/rate-plans"
    description: "List rate plan rows, filterable by client"
    roles: [PlatformAdmin, CoordinatorOps]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: RatePlan[]
    side_effects: []

  # ---- LanguagePair ----
  - method: POST
    path: "/interpretation/language-pairs"
    description: "Register a language pair"
    roles: [PlatformAdmin]
    code: 201
    input: ["source_lang", "target_lang", "rare?"]
    output: LanguagePair
    side_effects: []
  - method: GET
    path: "/interpretation/language-pairs/{id}"
    description: "Fetch a language pair"
    roles: [PlatformAdmin, CoordinatorOps, Interpreter]
    code: 200
    input: []
    output: LanguagePair
    side_effects: []

  # ---- Interpreter ----
  - method: POST
    path: "/interpretation/interpreters"
    description: "Onboard an interpreter into the pool"
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "max_concurrent_load?"]
    output: Interpreter
    side_effects: ["status=AVAILABLE", "active_load=0", "acceptance_pct=100", "no_show_strikes=0"]
  - method: GET
    path: "/interpretation/interpreters/{id}"
    description: "Fetch an interpreter incl. computed rating/load fields"
    roles: [PlatformAdmin, CoordinatorOps, Interpreter]
    code: 200
    input: []
    output: Interpreter
    side_effects: []
  - method: GET
    path: "/interpretation/interpreters"
    description: "List interpreters in the pool"
    roles: [PlatformAdmin, CoordinatorOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Interpreter[]
    side_effects: []
  - method: POST
    path: "/interpretation/interpreters/{id}/status"
    description: "Set an interpreter's availability (AVAILABLE/OFFLINE)"
    roles: [PlatformAdmin, Interpreter]
    code: 200
    input: [status]
    output: Interpreter
    side_effects: ["sets Interpreter.status"]

  # ---- Certification (child of Interpreter) ----
  - method: POST
    path: "/interpretation/interpreters/{id}/certifications"
    description: "Attach a certification to an interpreter"
    roles: [PlatformAdmin]
    code: 201
    input: [tier, expires_at]
    output: Certification
    side_effects: []
  - method: GET
    path: "/interpretation/interpreters/{id}/certifications"
    description: "List an interpreter's certifications (reverse-reachability for Certification.interpreter_id)"
    roles: [PlatformAdmin, CoordinatorOps, Interpreter]
    code: 200
    input: []
    output: Certification[]
    side_effects: []
  - method: POST
    path: "/interpretation/certifications/{id}/revoke"
    description: "Administratively revoke a certification"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Certification
    side_effects: ["sets revoked=true"]

  # ---- InterpreterLanguage (junction) ----
  - method: POST
    path: "/interpretation/interpreters/{id}/languages"
    description: "Grant an interpreter the ability to service a language pair"
    roles: [PlatformAdmin]
    code: 201
    input: [language_pair_id]
    output: InterpreterLanguage
    side_effects: []
  - method: GET
    path: "/interpretation/interpreters/{id}/languages"
    description: "List an interpreter's language grants (reverse-reachability for InterpreterLanguage.interpreter_id)"
    roles: [PlatformAdmin, CoordinatorOps]
    code: 200
    input: []
    output: InterpreterLanguage[]
    side_effects: []
  - method: GET
    path: "/interpretation/interpreter-languages/{id}"
    description: "Fetch a single language-grant junction"
    roles: [PlatformAdmin, CoordinatorOps]
    code: 200
    input: []
    output: InterpreterLanguage
    side_effects: []
  - method: GET
    path: "/interpretation/interpreter-languages"
    description: "List language-grant junctions, filterable by language_pair_id (reverse-reachability for InterpreterLanguage.language_pair_id)"
    roles: [PlatformAdmin, CoordinatorOps]
    code: 200
    input: ["language_pair_id?", "interpreter_id?", "limit?", "offset?"]
    output: InterpreterLanguage[]
    side_effects: []

  # ---- InterpretationRequest ----
  - method: POST
    path: "/interpretation/requests"
    description: "Client files an interpretation request (on-demand or scheduled)"
    roles: [ClientAccount]
    code: 201
    input: ["client_id", "language_pair_id", "modality", "required_tier", "scheduling_mode", "window_start?", "window_end?"]
    output: InterpretationRequest
    side_effects: ["status=OPEN", "credit + client-window-overlap validations"]
  - method: GET
    path: "/interpretation/requests/{id}"
    description: "Fetch a request"
    roles: [PlatformAdmin, CoordinatorOps, ClientAccount]
    code: 200
    input: []
    output: InterpretationRequest
    side_effects: []
  - method: GET
    path: "/interpretation/requests"
    description: "List requests, filterable by client (reverse-reachability for InterpretationRequest.client_id)"
    roles: [PlatformAdmin, CoordinatorOps, ClientAccount]
    code: 200
    input: ["client_id?", "language_pair_id?", "status?", "limit?", "offset?"]
    output: InterpretationRequest[]
    side_effects: []
  - method: POST
    path: "/interpretation/requests/{id}/dispatch"
    description: "Coordinator dispatches a request: selects an interpreter and creates an Assignment (OCC-guarded). Default clock startup time is 2026-03-01T00:00:00Z."
    roles: [CoordinatorOps]
    code: 201
    input: [expected_request_version]
    output: Assignment
    side_effects: ["runs interpreter_selection", "creates Assignment OFFERED", "request OPEN->ASSIGNED or ->UNFULFILLABLE", "increments InterpretationRequest.version by 1"]
  - method: POST
    path: "/interpretation/requests/{id}/cancel"
    description: "Client cancels a request; may incur a cancellation_fee"
    roles: [ClientAccount]
    code: 200
    input: []
    output: InterpretationRequest
    side_effects: ["runs cancellation_fee", "cascades Assignment->CANCELLED + interpreter load recompute", "request->CANCELLED"]

  # ---- Assignment ----
  - method: GET
    path: "/interpretation/assignments/{id}"
    description: "Fetch an assignment (both status dimensions)"
    roles: [PlatformAdmin, CoordinatorOps, Interpreter]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: GET
    path: "/interpretation/assignments"
    description: "List assignments, filterable by request_id and interpreter_id (reverse-reachability for Assignment.request_id and Assignment.interpreter_id)"
    roles: [PlatformAdmin, CoordinatorOps, Interpreter]
    code: 200
    input: ["request_id?", "interpreter_id?", "lifecycle_status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []
  - method: POST
    path: "/interpretation/assignments/{id}/accept"
    description: "Interpreter accepts an offered assignment"
    roles: [Interpreter]
    code: 200
    input: []
    output: Assignment
    side_effects: ["lifecycle ACCEPTED", "interpreter active_load+1, status->BUSY at cap", "recompute acceptance_pct"]
  - method: POST
    path: "/interpretation/assignments/{id}/decline"
    description: "Interpreter declines an offered assignment"
    roles: [Interpreter]
    code: 200
    input: []
    output: Assignment
    side_effects: ["lifecycle DECLINED", "request ASSIGNED->OPEN", "recompute acceptance_pct"]
  - method: POST
    path: "/interpretation/assignments/{id}/start-session"
    description: "Interpreter starts the session for an accepted assignment (creates a Session)"
    roles: [Interpreter]
    code: 201
    input: []
    output: Session
    side_effects: ["creates Session CONNECTING", "lifecycle IN_SESSION"]

  # ---- Session ----
  - method: GET
    path: "/interpretation/sessions/{id}"
    description: "Fetch a session incl. computed billing fields"
    roles: [PlatformAdmin, CoordinatorOps, Interpreter, ClientAccount]
    code: 200
    input: []
    output: Session
    side_effects: []
  - method: GET
    path: "/interpretation/sessions"
    description: "List sessions, filterable by assignment_id (reverse-reachability for Session.assignment_id)"
    roles: [PlatformAdmin, CoordinatorOps, Interpreter, ClientAccount]
    code: 200
    input: ["assignment_id?", "status?", "limit?", "offset?"]
    output: Session[]
    side_effects: []
  - method: POST
    path: "/interpretation/sessions/{id}/connect"
    description: "Interpreter connects; session ACTIVE, connected_at stamped"
    roles: [Interpreter]
    code: 200
    input: []
    output: Session
    side_effects: ["connected_at=clock", "status=ACTIVE"]
  - method: POST
    path: "/interpretation/sessions/{id}/end"
    description: "Interpreter ends the session; runs session_billing"
    roles: [Interpreter]
    code: 200
    input: []
    output: Session
    side_effects: ["ended_at=clock", "session_billing", "Assignment COMPLETED billing_status=BILLABLE", "request->FULFILLED"]
  - method: POST
    path: "/interpretation/sessions/{id}/mark-no-show"
    description: "Coordinator records a no-show for client or interpreter"
    roles: [CoordinatorOps]
    code: 200
    input: [party]
    output: Session
    side_effects: ["CLIENT: no_show_fee, billing BILLABLE; INTERPRETER: strikes+1 (cascade DEACTIVATE at threshold cancelling other OFFERED assignments), billing WAIVED"]
  - method: POST
    path: "/interpretation/sessions/{id}/dispute"
    description: "Client disputes an ended session's billing"
    roles: [ClientAccount]
    code: 200
    input: []
    output: Session
    side_effects: ["status=DISPUTED"]
  - method: POST
    path: "/interpretation/sessions/{id}/reopen"
    description: "Coordinator reopens a disputed session to ACTIVE for additional billable time"
    roles: [CoordinatorOps]
    code: 200
    input: []
    output: Session
    side_effects: ["clears ended_at", "status=ACTIVE"]
  - method: POST
    path: "/interpretation/sessions/{id}/reconcile"
    description: "Coordinator reconciles a disputed session with corrected units"
    roles: [CoordinatorOps]
    code: 200
    input: [corrected_billed_units]
    output: Session
    side_effects: ["recompute billed_amount_cents", "status=RECONCILED", "Assignment billing_status=BILLABLE"]

  # ---- Rating (child of Session) ----
  - method: POST
    path: "/interpretation/sessions/{id}/rating"
    description: "Client rates a completed session (one per session)"
    roles: [ClientAccount]
    code: 201
    input: ["score", "comment?"]
    output: Rating
    side_effects: ["recompute interpreter rating_avg/rating_count via rating_aggregate"]
  - method: GET
    path: "/interpretation/sessions/{id}/ratings"
    description: "List ratings for a session (reverse-reachability for Rating.session_id; 0 or 1)"
    roles: [PlatformAdmin, CoordinatorOps, ClientAccount]
    code: 200
    input: []
    output: Rating[]
    side_effects: []
  - method: GET
    path: "/interpretation/ratings/{id}"
    description: "Fetch a single rating"
    roles: [PlatformAdmin, CoordinatorOps]
    code: 200
    input: []
    output: Rating
    side_effects: []
  - method: GET
    path: "/interpretation/ratings"
    description: "List ratings, filterable by interpreter_id (reverse-reachability for Rating.interpreter_id)"
    roles: [PlatformAdmin, CoordinatorOps]
    code: 200
    input: ["interpreter_id?", "session_id?", "limit?", "offset?"]
    output: Rating[]
    side_effects: []

  # ---- Encounter (child of Session) ----
  - method: POST
    path: "/interpretation/sessions/{id}/encounters"
    description: "Client files an encounter report after a session ends"
    roles: [ClientAccount]
    code: 201
    input: [subject_ref, summary]
    output: Encounter
    side_effects: ["filed_at=clock"]
  - method: GET
    path: "/interpretation/sessions/{id}/encounters"
    description: "List encounter reports for a session (reverse-reachability for Encounter.session_id)"
    roles: [PlatformAdmin, CoordinatorOps, ClientAccount]
    code: 200
    input: []
    output: Encounter[]
    side_effects: []

  # ---- Complaint ----
  - method: POST
    path: "/interpretation/complaints"
    description: "Client files a complaint about a session"
    roles: [ClientAccount]
    code: 201
    input: [session_id, category]
    output: Complaint
    side_effects: ["status=FILED", "client_id copied from session's request"]
  - method: GET
    path: "/interpretation/complaints/{id}"
    description: "Fetch a complaint"
    roles: [PlatformAdmin, CoordinatorOps, ClientAccount]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: GET
    path: "/interpretation/complaints"
    description: "List complaints, filterable by client_id and session_id (reverse-reachability for Complaint.client_id and Complaint.session_id)"
    roles: [PlatformAdmin, CoordinatorOps, ClientAccount]
    code: 200
    input: ["client_id?", "session_id?", "status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []
  - method: POST
    path: "/interpretation/complaints/{id}/review"
    description: "Admin moves a complaint into review"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status=UNDER_REVIEW"]
  - method: POST
    path: "/interpretation/complaints/{id}/request-info"
    description: "Admin requests more info from the client"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status=NEEDS_INFO"]
  - method: POST
    path: "/interpretation/complaints/{id}/resubmit"
    description: "Client resubmits a NEEDS_INFO complaint"
    roles: [ClientAccount]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status=UNDER_REVIEW"]
  - method: POST
    path: "/interpretation/complaints/{id}/resolve"
    description: "Admin resolves a complaint UPHELD or DISMISSED; UPHELD billing/no-show waives the session charge"
    roles: [PlatformAdmin]
    code: 200
    input: [disposition]
    output: Complaint
    side_effects: ["UPHELD billing/no_show: Assignment billing_status=WAIVED, remedy_credit_cents set, outstanding_balance adjusted; DISMISSED: no effect"]

  # ---- Invoice ----
  - method: POST
    path: "/interpretation/invoices"
    description: "Coordinator opens a DRAFT invoice for a client and sweeps that client's BILLABLE (un-invoiced) assignments + fees into it"
    roles: [CoordinatorOps]
    code: 201
    input: [client_id]
    output: Invoice
    side_effects: ["sweeps BILLABLE Assignment sessions + request fees", "computes line_count/subtotal_cents/fees_cents/total_cents", "marks swept Assignment.billing_status=INVOICED"]
  - method: GET
    path: "/interpretation/invoices/{id}"
    description: "Fetch an invoice"
    roles: [PlatformAdmin, CoordinatorOps, ClientAccount]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/interpretation/invoices"
    description: "List invoices, filterable by client_id (reverse-reachability for Invoice.client_id)"
    roles: [PlatformAdmin, CoordinatorOps, ClientAccount]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/interpretation/invoices/{id}/issue"
    description: "Issue a DRAFT invoice; pins total and increments client outstanding_balance_cents"
    roles: [CoordinatorOps]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status=ISSUED", "ClientAccount.outstanding_balance_cents += total_cents (credit-limit checked)"]
  - method: POST
    path: "/interpretation/invoices/{id}/settle"
    description: "Mark an issued invoice settled; decrements client outstanding_balance_cents"
    roles: [CoordinatorOps]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status=SETTLED", "ClientAccount.outstanding_balance_cents -= total_cents"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/interpretation/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances logical clock; may cause OFFERED assignments to be observed EXPIRED on next read"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role is not permitted for this endpoint"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path-referenced resource does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 422
    condition: "A foreign-key field in the body references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: bad enum, score out of [1,5], missing required field, window fields present/absent in violation of scheduling_mode, travel surcharge set on non-ONSITE rate"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition is defined"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Acting entity_backed user is not the owner of the target resource"
  - id: ERR_NO_QUALIFIED_INTERPRETER
    http: 409
    condition: "Dispatch found no interpreter holding a valid required-tier certification for the language pair"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "Assignment accept attempted after offered_at + OFFER_TTL_SECONDS"
  - id: ERR_INTERPRETER_DOUBLE_BOOKED
    http: 409
    condition: "A SCHEDULED dispatch window collides (closed-interval) with another active session window of the chosen interpreter"
  - id: ERR_CLIENT_WINDOW_CONFLICT
    http: 409
    condition: "A new SCHEDULED request's half-open window overlaps another OPEN/ASSIGNED SCHEDULED request of the same client"
  - id: ERR_INTERPRETER_AT_CAPACITY
    http: 409
    condition: "Accepting would push interpreter active_load to/over max_concurrent_load"
  - id: ERR_ALREADY_RATED
    http: 409
    condition: "A Rating already exists for this session"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "Creating a request or issuing an invoice would push outstanding_balance_cents above credit_limit_cents"
  - id: ERR_STALE_REQUEST_VERSION
    http: 412
    condition: "expected_request_version does not match current InterpretationRequest.version on dispatch"
  - id: ERR_CLIENT_SUSPENDED
    http: 403
    condition: "A SUSPENDED client account attempts to create a request or dispatch"
  - id: ERR_INVALID_WINDOW
    http: 400
    condition: "window_end is not strictly after window_start on a SCHEDULED request"
  - id: ERR_SESSION_NOT_ENDED
    http: 409
    condition: "Dispute filed against a session that is not in ENDED state"
  - id: ERR_NO_RATE_PLAN
    http: 409
    condition: "No active RatePlan exists for the request's (client, tier, modality) at billing time"
  - id: ERR_INVALID_NO_SHOW_PARTY
    http: 400
    condition: "mark-no-show party is not CLIENT or INTERPRETER"
  - id: ERR_INVALID_CORRECTED_UNITS
    http: 400
    condition: "corrected_billed_units on reconcile is negative or non-integer"
  - id: ERR_SESSION_ALREADY_INVOICED
    http: 409
    condition: "Dispute attempted on a session already swept into an ISSUED invoice"
  - id: ERR_INVOICE_NOT_DRAFT
    http: 409
    condition: "Issue attempted on an invoice not in DRAFT state"
  - id: ERR_INVOICE_NOT_ISSUED
    http: 409
    condition: "Settle attempted on an invoice not in ISSUED state"
  - id: ERR_NOTHING_TO_INVOICE
    http: 409
    condition: "Invoice create found no BILLABLE assignments or pending fees for the client"
  - id: ERR_INTERPRETER_DEACTIVATED
    http: 409
    condition: "Dispatch/accept involving a DEACTIVATED interpreter"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: PlatformAdmin
    description: "Operates the platform: onboarding, rate plans, certifications, complaint adjudication, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /interpretation/clients"
      - "POST /interpretation/clients/{id}/suspend"
      - "POST /interpretation/rate-plans"
      - "POST /interpretation/language-pairs"
      - "POST /interpretation/interpreters"
      - "POST /interpretation/interpreters/{id}/certifications"
      - "POST /interpretation/certifications/{id}/revoke"
      - "POST /interpretation/interpreters/{id}/languages"
      - "POST /interpretation/complaints/{id}/review"
      - "POST /interpretation/complaints/{id}/request-info"
      - "POST /interpretation/complaints/{id}/resolve"
      - "POST /interpretation/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across the platform"
      - "POST /interpretation/interpreters/{id}/status"
  - name: CoordinatorOps
    description: "Operates the assignment pool: dispatch, no-show, reopen/reconcile, invoicing"
    identity: "opaque"
    exclusive_operations:
      - "POST /interpretation/requests/{id}/dispatch"
      - "POST /interpretation/sessions/{id}/mark-no-show"
      - "POST /interpretation/sessions/{id}/reopen"
      - "POST /interpretation/sessions/{id}/reconcile"
      - "POST /interpretation/invoices"
      - "POST /interpretation/invoices/{id}/issue"
      - "POST /interpretation/invoices/{id}/settle"
    shared_operations:
      - "GET endpoints across the platform"
  - name: ClientAccount
    description: "A hospital/court/clinic/law-firm client; files requests, rates, disputes, complains"
    identity: "entity_backed:ClientAccount"
    exclusive_operations:
      - "POST /interpretation/requests"
      - "POST /interpretation/requests/{id}/cancel"
      - "POST /interpretation/sessions/{id}/dispute"
      - "POST /interpretation/sessions/{id}/rating"
      - "POST /interpretation/sessions/{id}/encounters"
      - "POST /interpretation/complaints"
      - "POST /interpretation/complaints/{id}/resubmit"
    shared_operations:
      - "GET endpoints scoped to own resources"
  - name: Interpreter
    description: "A pooled interpreter; accepts/declines offers, runs sessions"
    identity: "entity_backed:Interpreter"
    exclusive_operations:
      - "POST /interpretation/assignments/{id}/accept"
      - "POST /interpretation/assignments/{id}/decline"
      - "POST /interpretation/assignments/{id}/start-session"
      - "POST /interpretation/sessions/{id}/connect"
      - "POST /interpretation/sessions/{id}/end"
    shared_operations:
      - "GET endpoints scoped to own assignments/sessions"
      - "POST /interpretation/interpreters/{id}/status"
