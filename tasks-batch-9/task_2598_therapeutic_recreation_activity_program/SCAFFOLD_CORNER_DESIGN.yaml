          - entities.ActivityProgram.fields.council_preference_weight
        distinguishing_aspect: "The adoption cascade is conditional on BOTH the resident's interest_domains containing requested_domain AND the plan's domain_frequency_targets[requested_domain] == 0: the resident whose plan already targets PHYSICAL is left ACTIVE while the resident whose target is 0 is driven UNDER_REVISION with review_reason COUNCIL_INPUT."
