          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Half Cent Tie Hotel", owner_entity_name: "Half Up Owner LP", base_fee_pct: 0.0325, incentive_fee_pct: 0.10, incentive_tier2_pct: 0.15, incentive_tier2_threshold_cents: 5000000, owner_priority_cents: 12000000, centralized_services_cap_pct: 0.015, working_capital_floor_cents: 500000, initial_working_capital_cents: 1000000 }
