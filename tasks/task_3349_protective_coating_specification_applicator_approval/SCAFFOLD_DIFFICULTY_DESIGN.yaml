              as: TechnicalServiceEngineer
              captures: { sys_id: "$.data.id" }
            - call: "POST /coating/qualification-programs"
              payload: { program_code: "QP-INV-100", coating_system_id: "${sys_id}", min_quality_history_score: 300, min_consecutive_passed_inspections: 0, requires_training: false, requires_equipment_audit: false }
              as: TechnicalServiceEngineer
              captures: { prog_id: "$.data.id" }
            - call: "POST /coating/applicators"
              payload: { company_name: "Invariant Applicators", contact_email: "ops@invariant.example" }
              as: PlatformAdmin
              captures: { app_id: "$.data.id", app_v: "$.data.version" }
            - call: "POST /coating/applicators/${app_id}/qualifications"
