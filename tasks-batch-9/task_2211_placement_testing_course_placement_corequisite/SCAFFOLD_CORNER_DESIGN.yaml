              captures: { cand_status_after: $.data.status, cand_activated: $.data.activated_at }
            - call: "GET /validation-studies/${study}"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { st_state_after: $.data.state, st_decided_by: $.data.decided_by_user_id }
            - call: "POST /validation-studies/${study}/decide"
              payload: { decision: "REJECT", decision_note: "Disproportionate impact on one subgroup; revise the cut score." }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { st_rejected: $.data.state, st_decided_by2: $.data.decided_by_user_id }
          assert:
            - "${aw_scaled} == 625, ${dw_measure} == \"TEST_SCORE\", ${dh_measure} == \"TEST_SCORE\", ${dw_course} == \"${c_105}\", ${rw1_state} == \"ENROLLED\", ${rw1_graded} == \"2026-08-01T00:00:00Z\" (setup) — with no hs_gpa the TEST_SCORE rule is the only candidate, so both students land in the strict cohort"
            - "${st_state} == \"COMPLETED\" and ${st_runs} == 1"
            - "${st_strict_n} == 20, ${st_strict_s} == 17 and ${st_strict_r} == 0.85 — 20 graded rows for the target course inside the window, 17 of them A grades; 0.85 >= VALIDATION_MIN_SUCCESS_RATE 0.7, so the rate gate is SATISFIED"
            - "${st_incl_n} == 20 and ${st_incl_r} == 0.85 — with no W grades and no non-test placements the two cohort variants coincide, which isolates the DI metric as the only thing that can fail"
            - "${st_di} == 0.7 and ${st_ref} == \"WHITE\" — n[WHITE] == 10 and n[HISPANIC] == 10 are both >= MIN_SUBGROUP_N 10, rate[WHITE] == 1.0 is the highest so WHITE is the reference, and the index is min(1.0/1.0, 0.7/1.0) == 0.7000"
            - "${e_di} == \"ERR_DISPROPORTIONATE_IMPACT\" with HTTP 422 at priority 27 — 0.7 < DI_MIN_INDEX 0.8 blocks the approval even though the overall success rate passed"
            - "${cand_status_after} == \"DRAFT\" and ${cand_activated} == null — the refused approval did NOT activate the candidate rule"
            - "${st_state_after} == \"COMPLETED\" and ${st_decided_by} == null — a refused decision leaves neither the state nor the decider stamped"
            - "${st_rejected} == \"REJECTED\" and ${st_decided_by2} == \"director-1\" — REJECT is NOT gated on either metric, so the same director can close the study out"

  # ===========================================================================
  # 7. From Table 7 (RBAC)
  # ===========================================================================
  - section: RBAC
    instances:

      - name: no_role_may_reach_another_roles_exclusive_operation
        claim_type: peer_roles
        grounds: ["errors[ERR_UNAUTHORIZED]", "validations[priority=3]", rbac]
        distinguishing_aspect: |
          Priority 3 sits ABOVE every lookup, so a role denial answers 403 even when the
          path identifier does not exist at all — an implementation that resolves the
          path first would leak a 404 to an unauthorised caller. Eight different
          exclusive operations are probed by the wrong role, and the shared read leg
          shows Student is not simply blocked from everything.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "One Course MATH-050 and one Student SU1 exist so the Student-role legs can authenticate."
            - "The probe UUID 99999999-8888-4777-8666-555555555555 belongs to no entity."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /students"
              payload: { student_number: "SU1", full_name: "Student U One", race_ethnicity_code: "UNKNOWN" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { su1: $.data.id, su1_v: $.data.version }
          trigger:
            - call: "POST /courses"
              payload: { course_code: "MATH-060", title: "Arithmetic", subject_area: "MATH", level_rank: 40, units: 5.0, is_support_course: false, transfer_level: false }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { e_course: $.data.error_id }
            - call: "POST /placement-rules/99999999-8888-4777-8666-555555555555/activate"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e_activate: $.data.error_id }
            - call: "POST /placement-determinations"
              payload: { student_id: "${su1}", subject_area: "MATH", expected_student_version: "${su1_v}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { e_determine: $.data.error_id }
            - call: "POST /sections"
              payload: { course_id: "${c_050}", term_code: "2026FA", room_code: "R799", meets_start_at: "2026-09-01T21:00:00Z", meets_end_at: "2026-09-01T22:00:00Z", seat_capacity: 5 }
              as: Instructor
              as_user_id: "instructor-1"
              captures: { e_section: $.data.error_id }
            - call: "POST /prerequisite-overrides"
              payload: { student_id: "${su1}", course_id: "${c_050}", requisite_id: "99999999-8888-4777-8666-555555555555", justification: "Registrar trying to self-authorise an override.", expires_at: "2027-01-01T00:00:00Z" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { e_override: $.data.error_id }
            - call: "POST /registrations/99999999-8888-4777-8666-555555555555/grade"
              payload: { final_grade: "A" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { e_grade: $.data.error_id }
            - call: "POST /validation-studies/99999999-8888-4777-8666-555555555555/decide"
              payload: { decision: "APPROVE", decision_note: "Staff trying to approve their own study." }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e_decide: $.data.error_id }
            - call: "POST /test-attempts/99999999-8888-4777-8666-555555555555/score"
              payload: { raw_score: 100 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e_score: $.data.error_id }
            - call: "GET /courses/${c_050}/equity-summary"
              payload: { disaggregation_key: "RACE_ETHNICITY", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-02T00:00:00Z" }
              as: Student
              as_user_id: "${su1}"
              captures: { e_equity: $.data.error_id }
            - call: "GET /courses/${c_050}"
              payload: {}
              as: Student
              as_user_id: "${su1}"
              captures: { ok_code: $.data.course_code }
          assert:
            - "${e_course} == \"ERR_UNAUTHORIZED\" (403) — POST /courses is SystemAdmin-exclusive"
            - "${e_activate} == \"ERR_UNAUTHORIZED\" (403) — rule activation is AssessmentDirector-exclusive, and the 403 answers even though the rule_id does not exist, because priority 3 precedes the priority 5 lookup"
            - "${e_determine} == \"ERR_UNAUTHORIZED\" (403) — minting determinations is AssessmentStaff-exclusive; note the version carried is the live one, so the role denial is the only possible answer"
            - "${e_section} == \"ERR_UNAUTHORIZED\" (403) — section creation is Registrar-exclusive"
            - "${e_override} == \"ERR_UNAUTHORIZED\" (403) — only an Instructor may issue a prerequisite override, which is the whole point of the override authority"
            - "${e_grade} == \"ERR_UNAUTHORIZED\" (403) — grade posting is Instructor-exclusive"
            - "${e_decide} == \"ERR_UNAUTHORIZED\" (403) — study decisions are AssessmentDirector-exclusive"
            - "${e_score} == \"ERR_UNAUTHORIZED\" (403) — scoring is Proctor-exclusive"
            - "${e_equity} == \"ERR_UNAUTHORIZED\" (403) — the disaggregated equity report is closed to Students"
            - "${ok_code} == \"MATH-050\" — the satisfaction leg: the catalogue read is shared with Students"

      - name: a_study_may_not_be_decided_by_the_hand_that_proposed_it
        claim_type: approval_chain
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", "validations[priority=10]", calculations.disproportionate_impact_index]
        distinguishing_aspect: |
          SoD-1 compares X-User-ID against proposed_by_user_id, not against the ROLE, so
          a person who holds both hats is refused while any other director succeeds on
          the identical request. The state check has to be cleared first for the SoD
          check to be observable at all, and the approval that follows exposes a real
          corner of the impact index: with only ONE row in the cohort no subgroup reaches
          MIN_SUBGROUP_N, the eligible set is empty, and the index is 1.0000 with a NULL
          reference group — so the DI gate cannot block a tiny study.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Course M105 (units 3.0) with an ACTIVE rule TEST_SCORE -> M105 (min_score 500) and a DRAFT candidate TEST_SCORE -> M105 (min_score 600)."
            - "TestAdministration K2 (room T71, MATH, proctor-71, 2026-08-01T00:00:00Z-02:00:00Z, capacity 5) OPEN."
