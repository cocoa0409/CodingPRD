              as: StoreManager
          assert:
            - "hop 1: BoatDeal.${d_id}.deal_stage == SETTLED and BoatDeal.${d_id}.points_awarded == 1346"
            - "hop 2: Member.${m_id}.points_lifetime_earned == 1346 and Member.${m_id}.club_tier == BASE, so the tier boundary has not flipped on this hop"
            - "hop 3: Member.${m_id}.redeemable_points == 1346 and Member.${m_id}.club_card_status == NONE, so the pending application is reported but not converted"
            - "hop 4: ClubCardApplication.${ca_id}.status == PENDING and its credit_limit_cents == 0, so no redemption capacity was minted by the settle call"
            - "hop 5: Member.${m_id}.conservation_match_cents == 0, because the settle hop awards points and only a REDEEM event feeds conservation_match_accrue"
