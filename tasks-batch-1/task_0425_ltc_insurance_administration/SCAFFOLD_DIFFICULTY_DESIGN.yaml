              payload: {}
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Note: provider suspend cascaded claim to VOID, so the start-review hits the state precondition first (claim no longer SUBMITTED), demonstrating the cross-entity dependency end-to-end."

      - name: open_claim_requires_policy_in_force_and_premium_current
        grounds:
          - state_machines.Policy.coverage_status
          - state_machines.Policy.premium_status
          - validations[priority=9]
          - entities.Claim.fields.policy_id
        distinguishing_aspect: |
          A different entity pair (Claim->Policy): opening a Claim depends on the SAME-row Policy's
          premium_status axis; with premium_status GRACE (not in {PAID_CURRENT,WAIVED,NONFORFEITURE_PAID_UP})
          the open is rejected ERR_PREMIUM_NOT_CURRENT even though coverage_status is IN_FORCE.
        test_recipe:
          setup:
            - "An IN_FORCE, benefits-triggered policy whose premium_status is GRACE (clock advanced past due_date but within grace), with an ACTIVE care plan on an ELIGIBLE provider."
