      - name: installment_schedule_total_conservation_across_payment_and_refund
        grounds:
          - calculations.installment_schedule
          - entities.Enrollment.fields.paid_cents
          - entities.Enrollment.fields.refunded_cents
        distinguishing_aspect: |
          Conserved quantity = money: sum(Installment.amount_cents) ==
          sessions_total_price_basis (80000) regardless of how many installments are
          PAID or how much has been refunded; after paying installment 1 (26666) and
          approving a PRO_RATA refund, paid_cents - refunded_cents == 5000 (the
          retained admin fee) and the schedule total still sums to 80000.
        test_recipe:
          setup:
            - "Coach A VERIFIED, Coach B assessor; Client Q; Tier PKG-8 installment_count_allowed 3"
            - "Enrollment EQ with installment_count 3 -> schedule [26666, 26666, 26668]; installment 1 PAID at activation 2026-08-03"
            - "Clock at 2026-08-20 (day 17 -> PRO_RATA); 0 sessions consumed"
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
