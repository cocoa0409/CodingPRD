            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: LabDirector }
          trigger:
            - { call: "POST /sensory-lab/evaluation-sessions/${sess_id}/open", payload: {}, as: PanelCoordinator, captures: { err_open: $.data.error_id } }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_id}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_id}", quantity: 1, unit_purpose: "EVALUATION" }, as: SensoryScientist }
            - { call: "POST /sensory-lab/evaluation-sessions/${sess_id}/open", payload: {}, as: PanelCoordinator, captures: { st_open: $.data.status } }
          assert:
            - "first open rejected: error_id == ERR_NO_PULLED_SAMPLES (http 409)"
            - "after pull, second open succeeds: EvaluationSession.${sess_id}.status == OPEN"

      - name: report_release_requires_all_claims_supported
        grounds:
          - state_machines.StudyReport.CLIENT_REVIEW_to_RELEASED
          - state_machines.ClaimSubstantiation.PENDING_to_SUPPORTED
          - state_machines.Study.REPORTING_to_COMPLETED
        distinguishing_aspect: |
          Entity pair StudyReport -> ClaimSubstantiation (distinct from the
          session/sample pair): release with a PENDING claim fails with
          ERR_UNVERIFIED_CLAIMS; after QA verifies SUPPORTED, release succeeds
          and cascades Study -> COMPLETED with the RETAIN unit's
          retention_until_utc set to release-clock + 90 days.
        test_recipe:
          setup:
            - "REAL_TIME study (target 60 -> fallback computed_days 42), 1 control arm, tp0 with 1 EVALUATION + 1 RETAIN unit pulled; tp0 skipped (EVALUATION unit discarded, RETAIN preserved); study ANALYSIS -> rec ACCEPTED -> REPORTING"
            - "Report by sci-author with the recommendation attached, submitted, qa-approved by qa-1 -> CLIENT_REVIEW; one SHELF_LIFE_DAYS claim (claimed_value 42) PENDING"
            - "Client balance 100 - 16 reserve = 84 before release; clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Claim Co", contact_email: "claim@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Juice", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_id: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp_id: $.data.id } }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-CL", temp_c: 20, capacity_units: 10 }, as: LabDirector, captures: { chamber_id: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_id}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_id}", quantity: 1, unit_purpose: "EVALUATION" }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_id}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_id}", quantity: 1, unit_purpose: "RETAIN" }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_id}/skip", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/close-fieldwork", payload: {}, as: SensoryScientist }
            - { call: "GET /sensory-lab/studies/${study_id}", payload: {}, as: SensoryScientist, captures: { study_v: $.data.version } }
            - { call: "POST /sensory-lab/date-code-recommendations", payload: { study_id: "${study_id}", arm_id: "${arm_id}", expected_study_version: "${study_v}" }, as: SensoryScientist, captures: { rec_id: $.data.id } }
            - { call: "POST /sensory-lab/date-code-recommendations/${rec_id}/accept", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/study-reports", payload: { study_id: "${study_id}", title: "Juice report" }, as: SensoryScientist, as_user_id: "sci-author", captures: { report_id: $.data.id } }
            - { call: "POST /sensory-lab/study-reports/${report_id}/attach-recommendation", payload: { recommendation_id: "${rec_id}" }, as: SensoryScientist, as_user_id: "sci-author" }
            - { call: "POST /sensory-lab/claims", payload: { report_id: "${report_id}", claim_type: "SHELF_LIFE_DAYS", claim_text: "Keeps 42 days", claimed_value: 42 }, as: SensoryScientist, as_user_id: "sci-author", captures: { claim_id: $.data.id } }
            - { call: "POST /sensory-lab/study-reports/${report_id}/submit", payload: {}, as: SensoryScientist, as_user_id: "sci-author" }
            - { call: "POST /sensory-lab/study-reports/${report_id}/qa-approve", payload: {}, as: QAOfficer, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /sensory-lab/study-reports/${report_id}/release", payload: {}, as: LabDirector, captures: { err_release: $.data.error_id } }
            - { call: "POST /sensory-lab/claims/${claim_id}/verify", payload: { verdict: "SUPPORTED" }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /sensory-lab/study-reports/${report_id}/release", payload: {}, as: LabDirector }
          assert:
            - "first release rejected: error_id == ERR_UNVERIFIED_CLAIMS (http 409) while claim ${claim_id} is PENDING"
            - "ClaimSubstantiation.${claim_id}.verdict == SUPPORTED and verified_by == qa-1 (42 <= computed_days 42)"
            - "second release succeeds: StudyReport.${report_id}.status == RELEASED"
            - "Study.${study_id}.status == COMPLETED"
            - "RETAIN SampleUnit retention_until_utc == 2026-10-30T00:00:00Z (clock 2026-08-01 + 90 days) — observable via GET /sensory-lab/sample-units?study_id=${study_id}&unit_purpose=RETAIN"
            - "ClientAccount.${client_id}.retainer_hours_balance == 100.0 (refund 16 - 0 consumed) and Study.${study_id}.consumed_hours == 0.0"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (half-open panelist intervals vs aggregate chamber capacity)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: panelist_half_open_adjacency
        grounds:
          - validations[priority=8]
          - entities.PanelAssignment.fields.session_id
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on the Panelist resource.
          S2 starting exactly when S1 ends (11:00 == 11:00) is LEGAL; S3
          strictly intersecting (10:30-11:30 vs 10:00-11:00) is rejected with
          ERR_PANELIST_DOUBLE_BOOKED. Resource: Panelist's schedule.
        test_recipe:
          setup:
            - "Study SCHEDULED (approved, never activated) with arms STANDARD_FILM (control) + MAP, tps day 0 and day 1"
            - "Sessions S1 (tp0, ctrl, 10:00-11:00), S2 (tp0, var, 11:00-12:00), S3 (tp1, ctrl, 10:30-11:30)"
            - "Panelist P QUALIFIED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Over Co", contact_email: "over@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Tea", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_c: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "MAP", is_control: false }, as: SensoryScientist, captures: { arm_v: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp0: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 1 }, as: SensoryScientist, captures: { tp1: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/evaluation-sessions", payload: { study_id: "${study_id}", time_point_id: "${tp0}", arm_id: "${arm_c}", scheduled_start_utc: "2026-08-02T10:00:00Z", scheduled_end_utc: "2026-08-02T11:00:00Z" }, as: PanelCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /sensory-lab/evaluation-sessions", payload: { study_id: "${study_id}", time_point_id: "${tp0}", arm_id: "${arm_v}", scheduled_start_utc: "2026-08-02T11:00:00Z", scheduled_end_utc: "2026-08-02T12:00:00Z" }, as: PanelCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /sensory-lab/evaluation-sessions", payload: { study_id: "${study_id}", time_point_id: "${tp1}", arm_id: "${arm_c}", scheduled_start_utc: "2026-08-02T10:30:00Z", scheduled_end_utc: "2026-08-02T11:30:00Z" }, as: PanelCoordinator, captures: { s3: $.data.id } }
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "O Verlap", email: "o1@lab.com", qualified_attributes: ["OVERALL"] }, as: PanelCoordinator, captures: { p: $.data.id } }
            - { call: "POST /sensory-lab/panelists/${p}/record-screening", payload: { acuity_score: 85 }, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator }
          trigger:
            - { call: "POST /sensory-lab/panel-assignments", payload: { session_id: "${s1}", panelist_id: "${p}" }, as: PanelCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /sensory-lab/panel-assignments", payload: { session_id: "${s2}", panelist_id: "${p}" }, as: PanelCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /sensory-lab/panel-assignments", payload: { session_id: "${s3}", panelist_id: "${p}" }, as: PanelCoordinator, captures: { err_overlap: $.data.error_id } }
          assert:
            - "PanelAssignment.${a1}.status == ASSIGNED (S1 10:00-11:00)"
            - "PanelAssignment.${a2}.status == ASSIGNED — back-to-back [11:00,12:00) after [10:00,11:00) is legal under half-open semantics"
            - "third assignment rejected: error_id == ERR_PANELIST_DOUBLE_BOOKED (S3 [10:30,11:30) strictly intersects S1 [10:00,11:00))"

      - name: chamber_aggregate_capacity_across_studies
        grounds:
          - calculations.chamber_occupancy
          - entities.StorageChamber.fields.reserved_units
        distinguishing_aspect: |
          Interval semantics: aggregate concurrent day-capacity on the
          StorageChamber resource (unit occupies from pull until
          consume/discard/expiry; the SUM over concurrent occupants is capped,
          no pairwise adjacency notion) — different resource and different
          semantics than the panelist half-open rule. Study B's pull collides at
          4+3 > 6, then succeeds at 2+3 <= 6 after A consumes 2 units.
        test_recipe:
          setup:
            - "Chamber CH-SH (20C, capacity 6); REAL_TIME studies A and B (both storage 20C), each with 1 control arm and tp0, both IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Share Co", contact_email: "share@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-SH", temp_c: 20, capacity_units: 6 }, as: LabDirector, captures: { chamber_id: $.data.id } }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Pasta A", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_a: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_a}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_a: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_a}", day_index: 0 }, as: SensoryScientist, captures: { tp_a: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_a}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_a}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_a}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Pasta B", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_b: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_b}", packaging_variant: "VACUUM", is_control: true }, as: SensoryScientist, captures: { arm_b: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_b}", day_index: 0 }, as: SensoryScientist, captures: { tp_b: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_b}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_b}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_b}/activate", payload: {}, as: SensoryScientist }
          trigger:
            - { call: "POST /sensory-lab/sampling-time-points/${tp_a}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_a}", quantity: 4, unit_purpose: "RETAIN" }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_b}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_b}", quantity: 3, unit_purpose: "RETAIN" }, as: SensoryScientist, captures: { err_b1: $.data.error_id } }
            - { call: "GET /sensory-lab/sample-units", payload: { study_id: "${study_a}" }, as: LabDirector, captures: { u1: "$.data[0].id", u2: "$.data[1].id" } }
            - { call: "POST /sensory-lab/sample-units/${u1}/checkout", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/sample-units/${u1}/consume", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/sample-units/${u2}/checkout", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/sample-units/${u2}/consume", payload: {}, as: PanelCoordinator }
            - { call: "GET /sensory-lab/chambers/${chamber_id}", payload: {}, as: LabDirector, captures: { res_mid: $.data.reserved_units } }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_b}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_b}", quantity: 3, unit_purpose: "RETAIN" }, as: SensoryScientist }
          assert:
            - "study B pull #1 (3 units) rejected: error_id == ERR_CHAMBER_CAPACITY_EXCEEDED (4 + 3 > 6 across BOTH studies' concurrent occupancy)"
            - "after consuming 2 of study A's units: StorageChamber.${chamber_id}.reserved_units == 2"
            - "study B pull #2 (3 units) succeeds: 2 + 3 = 5 <= 6; reserved_units == 5"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (physical unit count vs fiscal hours)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: chamber_pull_discard_conserves_headroom
        grounds:
          - calculations.chamber_occupancy
          - state_machines.SampleUnit.STORED_to_DISCARDED
        distinguishing_aspect: |
          Conserved quantity: physical chamber headroom. Invariant
          reserved_units == count(units in {STORED, CHECKED_OUT}) holds after
          the forward action (pull 4 -> 4) and after its compensation
          (discard 4 -> 0); capacity - reserved_units returns to baseline with
          zero drift.
        test_recipe:
          setup:
            - "REAL_TIME study IN_PROGRESS; chamber CH-INV (20C, capacity 6); tp0; control arm"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Inv Co", contact_email: "inv@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Rice", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_id: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp_id: $.data.id } }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-INV", temp_c: 20, capacity_units: 6 }, as: LabDirector, captures: { chamber_id: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
          trigger:
            - { call: "POST /sensory-lab/sampling-time-points/${tp_id}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_id}", quantity: 4, unit_purpose: "RETAIN" }, as: SensoryScientist }
            - { call: "GET /sensory-lab/chambers/${chamber_id}", payload: {}, as: LabDirector, captures: { res_after_pull: $.data.reserved_units } }
            - { call: "GET /sensory-lab/sample-units", payload: { study_id: "${study_id}" }, as: LabDirector, captures: { u1: "$.data[0].id", u2: "$.data[1].id", u3: "$.data[2].id", u4: "$.data[3].id" } }
            - { call: "POST /sensory-lab/sample-units/${u1}/discard", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/sample-units/${u2}/discard", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/sample-units/${u3}/discard", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/sample-units/${u4}/discard", payload: {}, as: LabDirector }
            - { call: "GET /sensory-lab/chambers/${chamber_id}", payload: {}, as: LabDirector, captures: { res_after_discard: $.data.reserved_units } }
          assert:
            - "after pull: StorageChamber.${chamber_id}.reserved_units == 4"
            - "after discarding all 4 units: reserved_units == 0 (invariant restored exactly, no drift)"
            - "SampleUnits ${u1}..${u4}.status == DISCARDED"
            - "invariant pinned: reserved_units == count(SampleUnits with chamber_id == ${chamber_id} and status in {STORED, CHECKED_OUT}) at every step"

      - name: retainer_activate_abort_conserves_hours
        grounds:
          - calculations.retainer_hours_settlement
          - state_machines.Study.SCHEDULED_to_IN_PROGRESS
          - state_machines.Study.IN_PROGRESS_to_ABORTED
        distinguishing_aspect: |
          Conserved quantity: fiscal lab-hours. Invariant
          retainer_hours_balance + reserved_hours_escrow == 100.0 holds after
          activation (82.0 + 18.0) and after abort (100.0 + 0.0): reserve and
          refund are exact compensating actions. Distinct quantity type from the
          physical-unit invariant.
        test_recipe:
          setup:
            - "Client topped up 100 hours; REAL_TIME study with 1 control arm and 2 time points (reserve = 10 + 2*2 + 4*1 = 18 hours), approved to SCHEDULED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Escrow Co", contact_email: "escrow@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Oats", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 7 }, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
          trigger:
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist, captures: { escrow_after: $.data.reserved_hours_escrow } }
            - { call: "GET /sensory-lab/clients/${client_id}", payload: {}, as: LabDirector, captures: { bal_after_activate: $.data.retainer_hours_balance, active_after_activate: $.data.active_study_count } }
            - { call: "POST /sensory-lab/studies/${study_id}/abort", payload: {}, as: LabDirector }
            - { call: "GET /sensory-lab/clients/${client_id}", payload: {}, as: LabDirector, captures: { bal_after_abort: $.data.retainer_hours_balance, active_after_abort: $.data.active_study_count } }
          assert:
            - "after activate: ClientAccount.${client_id}.retainer_hours_balance == 82.0 and Study.${study_id}.reserved_hours_escrow == 18.0 (sum 100.0)"
            - "after activate: ClientAccount.${client_id}.active_study_count == 1"
            - "after abort: retainer_hours_balance == 100.0 and Study.${study_id}.reserved_hours_escrow == 0 (sum 100.0 — escrow fully refunded, zero drift)"
            - "after abort: Study.${study_id}.status == ABORTED and active_study_count == 0"
            - "invariant pinned: retainer_hours_balance + reserved_hours_escrow == 100.0 across the activate/abort pair"
