              captures: { over_error: $.data.error_id }
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${pass_cat}", pretax_amount_cents: 11500, posttax_amount_cents: 0, expected_account_version: "${pass_acct_v}" }
              as: ProgramAdmin
              captures: { fit_el: $.data.id, fit_excl: $.data.excluded_amount_cents, fit_spill: $.data.posttax_spill_cents }
          assert:
            - "${van_group} == TRANSIT"
            - "${pass_group} == TRANSIT"
            - "${van_excl} == 20000"
            - "${van_spill} == 0"
            - "the 15000 attempt returns HTTP 422"
            - "${over_error} == ERR_EXCLUSION_LIMIT_EXCEEDED"
            - "the 11500 attempt returns HTTP 201"
            - "${fit_excl} == 11500"
            - "${fit_spill} == 0"
            - "Election.${van_el}.excluded_amount_cents is still 20000 - the rejected sibling changed nothing"

      - name: mid_month_change_flag_gates_the_amendment_and_the_single_change_limit_follows
        claim_type: Conditional validation
        grounds:
          - validations[priority=72]
          - validations[priority=73]
          - errors.ERR_MID_MONTH_CHANGE_NOT_ALLOWED
          - errors.ERR_CHANGE_LIMIT_EXCEEDED
          - entities.ElectionWindow.fields.mid_month_change_allowed
          - endpoints.PATCH_/benefits/elections/{election_id}
        distinguishing_aspect: "Both sides of a config flag plus the counter that only exists behind it, on one employer: a LOCKED window with mid_month_change_allowed true accepts exactly ONE amendment (change_count 1) and rejects the second with ERR_CHANGE_LIMIT_EXCEEDED (priority 73), while an adjacent LOCKED window with the flag false rejects its own election's identical amendment with ERR_MID_MONTH_CHANGE_NOT_ALLOWED (priority 72) - the flag gate must run before the counter gate, otherwise the flag-false window returns the wrong error."
        test_recipe:
          setup:
            - "The clock is moved to 2026-07-15T00:00:00Z so both windows below are still inside their cutoffs."
            - "Employer 'Mid Month Co' is ACTIVE in US-TX-AUS with an ACTIVE TRANSIT_PASS category (limit 30000), pretax_ratio_cap_pct 100 and program_cap_cents 5000000."
            - "Window A (benefit_month 2026-07) occupies [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z) with mid_month_change_allowed true; window B (benefit_month 2026-08) occupies the adjacent [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) with mid_month_change_allowed false."
            - "One ACTIVE employee holds one TRANSIT_PASS BenefitAccount; election EA (5000 pre-tax) lives in window A and election EB (6000 pre-tax) in window B, and both windows have been LOCKED, so EA and EB are FUNDED with change_count 0."
            - "That single account therefore carries contributed_cents 11000, available_balance_cents 11000 and 2 CONTRIBUTION ledger rows, and the employer's total_pretax_committed_cents is 11000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /benefits/employers"
              payload: { legal_name: "Mid Month Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000, pretax_ratio_cap_pct: 100 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "AUS-MM-1", work_region_code: "US-TX-AUS", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_id}" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id, acct_v1: $.data.version }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-07", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-01T00:00:00Z", mid_month_change_allowed: true }
              as: ProgramAdmin
              captures: { win_a: $.data.id, win_a_flag: $.data.mid_month_change_allowed }
            - call: "POST /benefits/election-windows/${win_a}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_a}", benefit_category_id: "${cat_id}", pretax_amount_cents: 5000, posttax_amount_cents: 0, expected_account_version: "${acct_v1}" }
              as: ProgramAdmin
              captures: { el_a: $.data.id }
            - call: "POST /benefits/election-windows/${win_a}/lock"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", cutoff_at: "2026-09-01T00:00:00Z", mid_month_change_allowed: false }
              as: ProgramAdmin
              captures: { win_b: $.data.id, win_b_flag: $.data.mid_month_change_allowed }
            - call: "POST /benefits/election-windows/${win_b}/open"
              payload: {}
              as: ProgramAdmin
            - call: "GET /benefits/benefit-accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { acct_v2: $.data.version }
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_b}", benefit_category_id: "${cat_id}", pretax_amount_cents: 6000, posttax_amount_cents: 0, expected_account_version: "${acct_v2}" }
              as: ProgramAdmin
              captures: { el_b: $.data.id }
            - call: "POST /benefits/election-windows/${win_b}/lock"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "PATCH /benefits/elections/${el_a}"
              payload: { pretax_amount_cents: 4000 }
              as: ProgramAdmin
              captures: { a_excl: $.data.excluded_amount_cents, a_changes: $.data.change_count, a_basis: $.data.exclusion_basis }
            - call: "PATCH /benefits/elections/${el_b}"
              payload: { pretax_amount_cents: 4000 }
              as: ProgramAdmin
              captures: { b_error: $.data.error_id }
            - call: "PATCH /benefits/elections/${el_a}"
              payload: { pretax_amount_cents: 3000 }
              as: ProgramAdmin
              captures: { a_second_error: $.data.error_id }
            - call: "GET /benefits/benefit-accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { acct_contrib: $.data.contributed_cents, acct_avail: $.data.available_balance_cents, acct_entries: $.data.ledger_entry_count }
            - call: "GET /benefits/employers/${er_id}"
              payload: {}
              as: ProgramAdmin
              captures: { er_committed: $.data.total_pretax_committed_cents, er_status: $.data.program_status }
          assert:
            - "${win_a_flag} == true"
            - "${win_b_flag} == false"
            - "the first PATCH on the flag-true window returns HTTP 200"
            - "${a_excl} == 4000"
            - "${a_changes} == 1"
            - "${a_basis} == ELECTED_BASIS"
            - "the PATCH on the flag-false window returns HTTP 422"
            - "${b_error} == ERR_MID_MONTH_CHANGE_NOT_ALLOWED"
            - "Election.${el_b}.pretax_amount_cents is still 6000 and Election.${el_b}.change_count == 0"
            - "the second PATCH on the flag-true window returns HTTP 422"
            - "${a_second_error} == ERR_CHANGE_LIMIT_EXCEEDED"
            - "Election.${el_a}.pretax_amount_cents is still 4000 and Election.${el_a}.change_count == 1"
            - "${acct_contrib} == 10000"
            - "${acct_avail} == 10000"
            - "${acct_entries} == 3"
            - "the account's third LedgerEntry is {entry_type: CONTRIBUTION_ADJUSTMENT, amount_cents: -1000, balance_after_cents: 10000, source_entity: Election, source_id: ${el_a}}"
            - "${er_committed} == 10000"
            - "${er_status} == ACTIVE"

      - name: retired_category_check_runs_before_the_media_region_check_that_depends_on_it
        claim_type: Cascading validation
        grounds:
          - validations[priority=58]
          - validations[priority=60]
          - errors.ERR_BENEFIT_CATEGORY_RETIRED
          - errors.ERR_MEDIA_REGION_INELIGIBLE
        distinguishing_aspect: "Check B (priority 60) cannot be evaluated without check A's result: the media eligibility comparison reads benefit_category.category_type, so the category row must be resolved and validated first. One request violates BOTH (RETIRED category AND a US-CA-SFO medium for a US-TX-AUS employee) and must return ERR_BENEFIT_CATEGORY_RETIRED; a second employer with an ACTIVE category and the same mismatched medium proves rule 60 really is violated by returning ERR_MEDIA_REGION_INELIGIBLE."
        test_recipe:
          setup:
            - "A US-CA-SFO PAPER_PASS medium SFO-XR (eligible_category_type TRANSIT_PASS, 4000 cents) is ACTIVE in the catalog; every employee below works in US-TX-AUS, so the medium is region-ineligible for all of them."
            - "Employer R ('Retired Cat Co') is ACTIVE in US-TX-AUS; its TRANSIT_PASS category was retired AFTER the employee's BenefitAccount was opened, so the account exists while the category is RETIRED."
            - "Employer K ('Active Cat Co') is ACTIVE in US-TX-AUS with an ACTIVE TRANSIT_PASS category and an employee holding a BenefitAccount."
            - "Both employers have an OPEN 2026-08 window and the clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /benefits/transit-media"
              payload: { sku: "SFO-XR", media_type: "PAPER_PASS", region_code: "US-CA-SFO", eligible_category_type: "TRANSIT_PASS", unit_price_cents: 4000 }
              as: OrderDesk
              as_user_id: "desk-catalog"
              captures: { med_id: $.data.id, med_region: $.data.region_code }
            - call: "POST /benefits/employers"
              payload: { legal_name: "Retired Cat Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_r: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_r}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_r: $.data.id }
            - call: "POST /benefits/employers/${er_r}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_r}", external_ref: "AUS-XR-1", work_region_code: "US-TX-AUS", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_r: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_r}", benefit_category_id: "${cat_r}" }
              as: ProgramAdmin
              captures: { acct_r_v: $.data.version }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_r}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_r: $.data.id }
            - call: "POST /benefits/election-windows/${win_r}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/benefit-categories/${cat_r}/retire"
              payload: {}
              as: ProgramAdmin
              captures: { cat_r_status: $.data.status }
            - call: "POST /benefits/employers"
              payload: { legal_name: "Active Cat Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_k: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_k}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_k: $.data.id, cat_k_status: $.data.status }
            - call: "POST /benefits/employers/${er_k}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_k}", external_ref: "AUS-XK-1", work_region_code: "US-TX-AUS", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_k: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_k}", benefit_category_id: "${cat_k}" }
              as: ProgramAdmin
              captures: { acct_k_v: $.data.version }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_k}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_k: $.data.id }
