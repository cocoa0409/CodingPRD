      - name: lot_capacity_charge_ceils_the_footprint_and_keeps_amps_at_one_decimal
        claim_type: precision
        grounds:
          - calculations.lot_capacity_charge.precision
          - calculations.lot_capacity_charge.constants.SPACING_MULTIPLIER
          - calculations.lot_capacity_charge.constants.STARTUP_SURGE_PCT
          - entities.RouteStop.fields.allocated_sqft_used
          - entities.RouteStop.fields.power_amps_used
        distinguishing_aspect: |
          Two rides with deliberately fractional products pin the two different rounding modes in the same
          formula: 4010 * 1.35 = 5413.5 ceils to 5414 (never rounds to 5413) and 1603 * 1.20 = 1923.6 ceils to
          1924, while amperage uses round_half_up to one decimal — 90 * 1.15 = 103.5 stays 103.5 and the stop
          ledger sums to 478.5 A rather than being truncated to 478 or inflated to 479.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1 (usable_lot_sqft 69999, allowed_amps 1080.0), Route R1 in DRAFT with PLANNED stop A."
            - "Ride Giant Wheel (MAJOR, 4010 sqft, 300 A) is already RESERVED on stop A, charging 5414 sqft and 375.0 A."
            - "Ride Chair Swings (FLAT, 1603 sqft, 90 A) is not yet allocated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_c4: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_c4}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_c4: "$.data.id" }
            - call: "POST /rides"
              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_c4a: "$.data.id" }
            - call: "POST /rides"
              payload: { name: "Chair Swings", ride_class: "FLAT", footprint_sqft: 1603, power_amps: 90, crew_size_setup: 3, setup_hours: 4, axle_count: 2, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_c4b: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_c4: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_c4}", venue_id: "${ven_c4}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_c4: "$.data.id" }
            - call: "GET /route-stops/${stop_c4}"
              payload: {}
              as: LotBoss
              captures: { sv_c4a: "$.data.version" }
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_c4a}", route_stop_id: "${stop_c4}", expected_route_stop_version: "${sv_c4a}" }
              as: LotBoss
              captures: { alloc_c4a: "$.data.id" }
            - call: "GET /route-stops/${stop_c4}"
              payload: {}
              as: LotBoss
              captures: { sv_c4b: "$.data.version" }
          trigger:
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_c4b}", route_stop_id: "${stop_c4}", expected_route_stop_version: "${sv_c4b}" }
              as: LotBoss
              captures: { alloc_c4b: "$.data.id" }
            - call: "GET /route-stops/${stop_c4}"
              payload: {}
              as: LotBoss
          assert:
            - "HTTP 201 and RideAllocation.${alloc_c4b}.footprint_charged_sqft == 1924 (ceil(1603 * 1.20 = 1923.6))"
            - "RideAllocation.${alloc_c4b}.power_charged_amps == 103.5 (round_half_up(90 * 1.15, 1))"
            - "RideAllocation.${alloc_c4a}.footprint_charged_sqft == 5414 (ceil(4010 * 1.35 = 5413.5)) and power_charged_amps == 375.0"
            - "RouteStop.${stop_c4}.allocated_sqft_used == 7338 and power_amps_used == 478.5"
            - "Both allocations remain RESERVED: neither ledger write changes allocation status"

      - name: overlapping_closures_merge_and_stay_below_the_two_hour_abatement_floor
        claim_type: interval_merge
        grounds:
          - calculations.weather_abatement_hours
          - calculations.weather_abatement_hours.constants.ABATEMENT_MIN_HOURS
          - entities.WeatherClosure.fields.abated_hours
          - entities.WeatherClosure.fields.closure_hours_raw
          - entities.RouteStop.fields.closure_hours_adjudicated
        distinguishing_aspect: |
          Two overlapping closures on the same operating day merge to [14:00, 15:30) = 1.50 h, and the
          chronological first-claim rule splits that between the rows as 1.00 (the WIND row, claimed first) and
          0.50 (the RAIN row's uncovered tail) — never 1.00 + 1.00 = 2.00 double count. Because the merged total
          1.50 sits below ABATEMENT_MIN_HOURS = 2, RouteStop.closure_hours_adjudicated must snap to 0 while the
          per-row abated_hours keep their fractional values.
        test_recipe:
          setup:
            - "Jurisdiction OH (requires_state_ride_inspection false), Venue V1, Ride Giant Wheel, Worker Op One certified MAJOR."
            - "Route R1 COMMITTED, Contract C1 EXECUTED, both permits APPROVED, one allocation, one RIDE_OPERATOR shift, so stop A is OPEN with operating_days 3 and daily windows [12:00, 20:00Z)."
            - "Clock parked at 2026-09-05T00:00Z; two LOGGED closures exist on stop A: WIND 2026-09-04T14:00Z..15:00Z and RAIN 2026-09-04T14:30Z..15:30Z."
