  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers (depths ≥3, ≥2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: incident_resolve_cascades_unresolved_count_posture_and_feed_score_depth_3
        grounds:
          - state_machines.Incident.ACKNOWLEDGED_to_RESOLVED
          - calculations.neighborhood_safety_posture
          - calculations.post_feed_score
          - entities.Neighborhood.fields.unresolved_critical_count
          - entities.Neighborhood.fields.safety_posture
          - entities.Post.fields.local_relevance_score
        distinguishing_aspect: |
          Depth-3 chain: RESOLVE (action) -> Neighborhood.unresolved_critical_count
          decrements (link 1); the decrement causes safety_posture to recompute
          and flip from EMERGENCY to OPEN (link 2, caused by link 1's value
          crossing the threshold); the posture flip causes every PUBLISHED
          Post's local_relevance_score in that Neighborhood to recompute (link
          3, caused by link 2 not by the original RESOLVE action).
        test_recipe:
          setup:
            - "Neighborhood N1; Verified Residents R1, R2; Moderator MOD."
            - "Three CRITICAL Incidents reported in N1 by R2 with statuses OPEN, ACKNOWLEDGED, ACKNOWLEDGED (unresolved_critical_count=3, safety_posture=EMERGENCY)."
            - "SAFETY-category Post P1 by R1 in N1 with local_relevance_score=3.10 under EMERGENCY."
            - "One incident I_ACK is ACKNOWLEDGED by AgencyOfficer OFF1."
            - "Logical clock 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
