            - "${mc16_delta} == 0.0700 and ${mc16_tier} == MODERATE and ${mc16_deadline} == 2026-08-26T00:00:00Z - only the tuning sub-score is non-zero: 0.35 * 0.2"
            - "${mc16_notified} == 2, ${note_a_client} == ${cl_a_id} and ${note_b_client} == ${cl_b_id} - notifications are created in client created_at ASC order"
            - "Before the trigger: MethodologyChange.${mc16_id}.acknowledged_client_count == 1, ClientNotification.${note_a_id}.state == ACKNOWLEDGED and ClientNotification.${note_b_id}.state == SENT"
            - "Trigger call 1: HTTP 409 with data.error_id == ERR_ACKNOWLEDGEMENTS_MISSING - not ERR_NOTIFICATION_PERIOD_OPEN, because the clock sits exactly on notification_deadline_at and the lead period is satisfied at equality"
            - "Trigger call 1 leaves MethodologyChange.${mc16_id}.state == NOTIFIED, .activated_at == null, EditRuleSet.${rs16_proposed_id}.status == DRAFT and EditRuleSet.${rs16_target_id}.status == PUBLISHED"
            - "Trigger call 2: HTTP 200; ClientNotification.${note_b_id}.state == ACKNOWLEDGED with acknowledged_at == 2026-08-26T00:00:00Z and MethodologyChange.${mc16_id}.acknowledged_client_count == 2"
            - "Trigger call 3: HTTP 200; MethodologyChange.${mc16_id}.state == EFFECTIVE with activated_at == 2026-08-26T00:00:00Z"
            - "Trigger call 3: EditRuleSet.${rs16_proposed_id}.status == PUBLISHED and EditRuleSet.${rs16_target_id}.status == SUPERSEDED"
            - "Trigger call 3: ProcessingRun.${run16_id}.state == PUBLISHED and .repin_required_reason == null - a terminal run pinned to the superseded rule set is never dragged into PENDING_REPIN"
            - "MethodologyChange.${mc16_id}.notified_client_count == 2 and .revision_count == 0 throughout"

  # ----------------------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:

      - name: tuning_interval_half_open_overlap_on_one_meter
        grounds:
          - validations[priority=31]
          - errors[ERR_INTERVAL_OVERLAP]
          - endpoints[POST /tuning-intervals]
          - calculations.interval_editing
          - entities.TuningInterval.fields.state
          - entities.TuningInterval.fields.invalidation_reason
          - calculations.household_compliance_rate
        distinguishing_aspect: |
          The contended resource is a single Meter and the interval semantics are viewing records
          [start_iso, end_iso): touching endpoints never collide, and the blocking set is state-filtered
          - the byte-identical request that is refused while the covering record is RAW is accepted once
          the edit pass has moved that record to INVALIDATED, while an EDITED record still blocks.
        test_recipe:
          setup:
            - "Market DMA-517 with one quota cell (target 1), a published 2026Q3 universe of 120000 households and a published edit rule set whose invalid_tuning_max_minutes is only 300."
            - "One ACTIVE household with an installed HEALTHY TV_TUNER."
            - "Clock at 2026-08-11T00:00:00Z. Interval t1 = [2026-08-10T18:00:00Z, 2026-08-10T23:50:00Z) with tuning_minutes 350, and interval t2 = [2026-08-10T23:50:00Z, 2026-08-10T23:59:00Z) with tuning_minutes 9 - accepted because t1.end_iso == t2.start_iso and touching endpoints do not overlap."
            - "The market version is read before the trigger so the run creation can pin it; a rejected interval ingest never bumps Market.version."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Rho", market_code: "DMA-517", dma_rank: 17, incentive_budget_cents: 1000000 }
              as: PanelOperationsManager
              captures: { m17_id: "$.data.id" }
            - call: "POST /markets/${m17_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 1, base_incentive_cents: 2000 }
              as: PanelOperationsManager
              captures: { cell_t_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-2026Q3", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 300, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs17_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs17_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "GET /markets/${m17_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m17_v_before_universe: "$.data.version" }
            - call: "POST /universe-estimates"
              payload: { market_id: "${m17_id}", vintage_label: "2026Q3", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", cell_populations: [{ quota_cell_id: "${cell_t_id}", population_households: 120000, population_persons: 300000 }], expected_market_version: "${m17_v_before_universe}" }
              as: MethodologyStatistician
              captures: { ue17_id: "$.data.id" }
            - call: "POST /universe-estimates/${ue17_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /households"
              payload: { market_id: "${m17_id}", quota_cell_id: "${cell_t_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { ht1_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${ht1_id}", meter_type: "TV_TUNER", serial_no: "MT-001501" }
              as: FieldTechnician
              captures: { mtt1_id: "$.data.id" }
            - call: "POST /meters/${mtt1_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${ht1_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: MethodologyStatistician
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mtt1_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-10T18:00:00Z", end_iso: "2026-08-10T23:50:00Z", station_code: "WXYZ", tuning_minutes: 350 }
              as: MethodologyStatistician
              captures: { t1_state_at_ingest: "$.data.state" }
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mtt1_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-10T23:50:00Z", end_iso: "2026-08-10T23:59:00Z", station_code: "WXYZ", tuning_minutes: 9 }
              as: MethodologyStatistician
              captures: { t2_id: "$.data.id" }
            - call: "GET /markets/${m17_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m17_v_before_run: "$.data.version" }
          trigger:
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mtt1_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-10T19:00:00Z", end_iso: "2026-08-10T20:00:00Z", station_code: "WPQR", tuning_minutes: 60 }
              as: MethodologyStatistician
            - call: "POST /processing-runs"
              payload: { market_id: "${m17_id}", universe_estimate_id: "${ue17_id}", edit_rule_set_id: "${rs17_id}", window_start_iso: "2026-08-10T00:00:00Z", window_end_iso: "2026-08-11T00:00:00Z", expected_market_version: "${m17_v_before_run}" }
              as: MethodologyStatistician
              as_user_id: "stat-opener-17"
              captures: { run17_id: "$.data.id" }
            - call: "POST /processing-runs/${run17_id}/edit"
              payload: {}
              as: MethodologyStatistician
              captures: { run17_invalidated: "$.data.invalidated_interval_count", run17_contributing: "$.data.contributing_household_count" }
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mtt1_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-10T19:00:00Z", end_iso: "2026-08-10T20:00:00Z", station_code: "WPQR", tuning_minutes: 60 }
              as: MethodologyStatistician
              captures: { t4_id: "$.data.id", t4_state: "$.data.state" }
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mtt1_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-10T23:45:00Z", end_iso: "2026-08-10T23:55:00Z", station_code: "WPQR", tuning_minutes: 10 }
              as: MethodologyStatistician
          assert:
            - "${t1_state_at_ingest} == RAW and the touching interval ${t2_id} was accepted with HTTP 201 - prev.end_iso == new.start_iso is not an overlap"
            - "Trigger call 1: HTTP 409 with data.error_id == ERR_INTERVAL_OVERLAP - [19:00, 20:00) sits inside the RAW record [18:00, 23:50)"
            - "Trigger call 1 created nothing: GET /tuning-intervals?meter_id=${mtt1_id} returns total_count == 2"
            - "Trigger call 3: ${run17_invalidated} == 1 and ${run17_contributing} == 1"
            - "Trigger call 3: the [18:00, 23:50) record is INVALIDATED with invalidation_reason OVER_MAX_TUNING and usable_minutes 0, because 350 > invalid_tuning_max_minutes 300"
            - "Trigger call 3: TuningInterval.${t2_id}.state == EDITED with usable_minutes == 9 (9 * 1.0 for INHOME_TUNER) and no ASCRIBED record was created - one surviving record per meter leaves no adjacent pair"
            - "Trigger call 4: HTTP 201 and ${t4_state} == RAW - the byte-identical request refused in call 1 now succeeds, purely because the covering record is INVALIDATED and INVALIDATED rows do not block re-ingest"
            - "Trigger call 5: HTTP 409 with data.error_id == ERR_INTERVAL_OVERLAP - [23:45, 23:55) overlaps ${t2_id}, which is EDITED, and EDITED rows DO block"
            - "After the trigger: GET /tuning-intervals?meter_id=${mtt1_id} returns total_count == 3 (one INVALIDATED, one EDITED, one RAW)"
            - "After the trigger: Household.${ht1_id}.compliance_rate_rolling_30 == 1.0000 - the 2026-08-10 date carries 9 + 60 == 69 reported minutes across the EDITED and RAW rows, over 1 reported day"

      - name: run_window_identical_supersedes_partial_overlap_rejected
