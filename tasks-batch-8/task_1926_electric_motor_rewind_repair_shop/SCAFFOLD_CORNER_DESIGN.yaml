  # ==========================================================================
  # Section: validations
  # ==========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role/existence check."
        test_recipe:
          setup: ["shop exists"]
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "GET /shops/${shop_id}"
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and http status == 400 when the driver omits the X-User-Role header on this call (negative trigger: header omission is the point of the test)"

      - name: nonexistent_work_order_returns_404
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /shops/{shopId}/work-orders/{random-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["shop exists"]
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "GET /shops/${shop_id}/work-orders/00000000-0000-0000-0000-000000000000"
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"

      - name: work_order_create_with_dangling_motor_reference
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /shops/{id}/work-orders with a motor_id that does not exist returns 422 ERR_REFERENCE_NOT_FOUND (body FK), distinct from path 404."
