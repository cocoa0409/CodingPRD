  - rule_id: priority_pair_validation_conflict
    instances:
      - name: self_approval_conflict_beats_budget_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_SELF_APPROVAL_FORBIDDEN]
          - errors[ERR_CAPITAL_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_fiscal: one approval request that
          violates BOTH SoD (approver == proposer) AND available capital at once
          MUST return ERR_SELF_APPROVAL_FORBIDDEN (priority 6 beats 11).
        test_recipe:
          setup:
            - "FY2027 plan APPROVED with CAPITAL 36,000,000 (available 36,000,000)"
            - "Project P_BIG requested 40,000,000 by user am-1 (exceeds available)"
