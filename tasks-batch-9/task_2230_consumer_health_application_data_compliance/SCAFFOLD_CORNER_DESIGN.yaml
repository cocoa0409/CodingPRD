            - "AppProduct.${prod_id}.regulated_element_count == 6"

      - name: projection_consent_posture_replays_grant_withdraw_regrant_on_the_share_axis
        claim_type: projection
        grounds: ["calculations.consent_posture_derivation", "state_machines.ConsentRecord", "entities.ConsentRecord.fields.last_withdrawn_axis"]
        distinguishing_aspect: "Replaying grant SHARE, withdraw SHARE, grant SHARE leaves sharing_state GRANTED with active_share_consent_count back at 1, while last_withdrawn_axis and processing_halt_deadline_at keep the withdrawal event that happened in between."
