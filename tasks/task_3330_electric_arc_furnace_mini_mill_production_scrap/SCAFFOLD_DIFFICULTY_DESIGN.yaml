            - call: "POST /mills/${mill_id}/heats/${heat_1}/charges"
              payload: { scrap_lot_id: "${lot_id}", tons: 8 }
              as: MillOperator
            - call: "POST /mills/${mill_id}/heats/${heat_1}/meltdown-sheets"
