            - "${big_n} == 10 and ${big_c} == 2     # ceil(sqrt(100)) = 10, no offset, tier n>8 -> c 2"
            - "${big_retests} == 1"
            - "${big_n2} == 20 and ${big_c2} == 1   # tightened: min(10*2, 20) and max(2-1, 0)"
            - "${big_rev2} == 3   # the RETEST hop itself already redrew the plan as revision 2 with the same tightened 20/1, and the explicit redraw makes it revision 3"
