          trigger:
            - call: "POST /imaging-studies"
              payload: { patient_id: "${adult_id}", modality: "PANORAMIC", justification_code: "THIRD_MOLAR_ASSESSMENT", acquired_at: "2026-06-01T09:00:00Z", dose_mgy_cm2: 40.0 }
