    roles: [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
    code: 200
    input: ["equipment_id?", "requirement_id?", "retest_of_test_id?", "status?", "limit?", "offset?"]
    output: "FunctionalTest[]"
    side_effects: []

  - method: GET
    path: "/functional-tests/{id}"
    description: "Read one functional test"
    roles: [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
    code: 200
    input: []
    output: FunctionalTest
    side_effects: []

  - method: POST
    path: "/functional-tests/{id}/start"
    description: "Begin witnessing a scheduled test"
    roles: [CxAuthority]
    code: 200
    input: []
    output: FunctionalTest
    side_effects: ["status = IN_PROGRESS, started_at stamped"]

  - method: POST
    path: "/functional-tests/{id}/record-result"
    description: "Record the measured value; the server derives PASSED / PASSED_WITH_EXCEPTIONS / FAILED from the requirement tolerance and runs the matching branch"
    roles: [CxAuthority]
    code: 200
    input: [measured_value, "note?"]
    output: FunctionalTest
    side_effects: ["writes outcome_deviation_pct and witness_user_id = X-User-ID", "PASSED promotes the unit to FUNCTIONAL_ACCEPTED", "PASSED_WITH_EXCEPTIONS opens a non-blocking S3 issue and conditionally accepts the unit", "FAILED opens a blocking issue and runs the four-hop cascade through equipment demotion, evidence staling and credit withdrawal", "increments CxProject.version by 1"]

  - method: POST
    path: "/functional-tests/{id}/schedule-retest"
    description: "Mint a retest row linked to a failed or conditionally passed test"
    roles: [CxAuthority]
    code: 201
    input: [scheduled_start, scheduled_end]
    output: FunctionalTest
    side_effects: ["new SCHEDULED row with retest_of_test_id set and equipment_id / requirement_id / script_code copied", "the buffered window is reserved against CxProject.witness_capacity"]

  # ----------------------------------------------------------------- Issue
  - method: POST
    path: "/issues"
