      - name: commitment_links_to_a_joint_trench_slot_and_fills_its_occupancy
        claim_type: Cross-reference link
        grounds: ["endpoints.POST_/uro/joint-trench-slots", "endpoints.POST_/uro/commitments", "endpoints.GET_/uro/projects/{id}/joint-trench-slots", "entities.JointTrenchSlot"]
        distinguishing_aspect: "The optional joint_trench_slot_id is a genuine association, not a label: supplying it stores the link on the commitment, increments JointTrenchSlot.occupant_count and leaves the slot OPEN while occupant_count 1 is below max_occupants 2. Both sides must exist first - an unknown slot id is a body foreign key at priority 5 - and the link is discoverable from either direction, through GET /uro/commitments?joint_trench_slot_id= and through GET /uro/projects/{id}/joint-trench-slots."
