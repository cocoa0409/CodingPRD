            - "ProjectRegistration.${regb}.status unchanged: SUBMITTED"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: attainment_tier_boundary_inclusive
        grounds:
          - calculations.quota_attainment
          - calculations.order_line_commission
        distinguishing_aspect: |
          Metric = quota attainment basis points on POST .../invoice. Crediting
          exactly 10,000,000c against a 10,000,000c quota gives attainment_bp ==
          10000, which SATISFIES min_attainment_bp == 10000 (>=, inclusive) ->
          multiplier 12500 -> applied rate 1250bp -> 62,500c on a 500,000c line.
        test_recipe:
          setup:
            - "BASE principal/agreement/schedule/reps/customer"
            - "O_A invoiced: CONNECTORS 2000x5000 = exactly 10,000,000c = 100% of quota -> credited_ytd 10,000,000"
            - "O_B shipped: CONNECTORS 100x5000 = 500,000c"
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA", "TX"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000, registered_protection_share_bp: 10000, tail_period_days: 180 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }, { family_code: "CABLES", base_rate_bp: 800 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }, { min_attainment_bp: 8000, multiplier_bp: 11000 }, { min_attainment_bp: 10000, multiplier_bp: 12500 }], registration_bonus_bp: 200, expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-A", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 2000, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { oa: $.data.id }
            - call: "POST /rep-agency/orders/${oa}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/orders/${oa}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-B", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 100, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { ob: $.data.id }
            - call: "POST /rep-agency/orders/${ob}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
          trigger:
            - call: "POST /rep-agency/orders/${ob}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
          assert:
            - "Order.${ob} line L1 applied_rate_bp == 1250 (attainment exactly 10000bp qualifies for tier {10000, 12500}; 9999bp would give 1100)"
            - "Order.${ob} line L1 commission_cents == 62500 (round_half_up(500000 x 1250 / 10000))"

      - name: protection_end_exclusive
        grounds:
          - calculations.order_line_commission
          - state_machines.ProjectRegistration.APPROVED_to_EXPIRED
          - entities.ProjectRegistration.fields.protection_end
        distinguishing_aspect: |
          Metric = wall-clock timestamp equality on POST /orders (different
          metric and endpoint from attainment_tier_boundary_inclusive). An order
          placed_at == protection_end (2027-01-28T00:00:00Z) is NOT protected —
          the window is half-open [start, end) — while one placed 12h earlier is.
        test_recipe:
          setup:
            - "BASE principal/agreement/schedule/reps/customer"
            - "reg1 APPROVED at 2026-08-01 -> protection [2026-08-01T00:00:00Z, 2027-01-28T00:00:00Z)"
            - "clock 2027-01-27T12:00:00Z; order PO-IN placed then (inside window)"
            - "clock 2027-01-28T00:00:00Z -> sweep expires reg1"
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA", "TX"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000, registered_protection_share_bp: 10000, tail_period_days: 180 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }, { family_code: "CABLES", base_rate_bp: 800 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }, { min_attainment_bp: 8000, multiplier_bp: 11000 }, { min_attainment_bp: 10000, multiplier_bp: 12500 }], registration_bonus_bp: 200, expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/project-registrations"
              payload: { principal_id: "${p1}", customer_id: "${c1}", family_code: "CONNECTORS", project_name: "Project Window" }
              as: Rep
              as_user_id: "${r1}"
              captures: { reg1: $.data.id }
            - call: "POST /rep-agency/project-registrations/${reg1}/approve"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-27T12:00:00Z" }
              as: AgencyAdmin
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-IN", placed_at: "2027-01-27T12:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 10, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { oin: $.data.id }
            - call: "POST /rep-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-28T00:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-OUT", placed_at: "2027-01-28T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 10, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { oout: $.data.id }
          assert:
            - "ProjectRegistration.${reg1}.status == EXPIRED (sweep at clock == protection_end)"
            - "Order.${oin} line L1 protected_registration_id == ${reg1} and its split row is REGISTERED ${r1} 10000"
            - "Order.${oout} line L1 protected_registration_id is null and splits are SPECIFY ${r1} 6000 + SHIP_TO ${r2} 4000 (placed_at == protection_end excluded)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_attribution_requires_approved_registration
        grounds:
          - state_machines.Order.PLACED_to_SHIPPED
          - state_machines.ProjectRegistration.SUBMITTED_to_APPROVED
          - calculations.split_waterfall
        distinguishing_aspect: |
          Entity pair = Order x ProjectRegistration. Attribution reads the
          registration's state AT ORDER CREATION: an order placed while the
          registration is SUBMITTED gets SPECIFY/SHIP_TO splits, and a later
          approval does NOT retro-apply; an order placed after approval gets
          the REGISTERED 10000 row for the same family/customer.
        test_recipe:
          setup:
            - "BASE principal/agreement/schedule/reps/customer"
            - "reg1 SUBMITTED by R1 at 2026-08-01 but NOT yet approved when order PO-EARLY is created"
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA", "TX"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000, registered_protection_share_bp: 10000, tail_period_days: 180 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
