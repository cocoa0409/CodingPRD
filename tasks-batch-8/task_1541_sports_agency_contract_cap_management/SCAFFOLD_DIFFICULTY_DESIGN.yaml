            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 15000000, guaranteed_cents: 15000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_old_id}"
              captures: { con_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals"
              payload: { proposed_by_agent_id: "${a_old_id}", proposed_aav_cents: 15000000, proposed_guaranteed_cents: 15000000 }
              as: Agent
              as_user_id: "${a_old_id}"
              captures: { p_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
