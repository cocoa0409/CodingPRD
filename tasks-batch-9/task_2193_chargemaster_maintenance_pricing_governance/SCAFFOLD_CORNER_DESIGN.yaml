  # ===========================================================================
  # §1.3 calculations — every rule, every pinned variant, every boundary
  # ===========================================================================
  - section: calculations
    instances:
      - name: price_rule_selector_half_open_interval_switches_rule_at_the_abutting_instant
        claim_type: constants_applied
        grounds:
          - calculations.price_rule_selector
          - validations[priority=34]
          - endpoints[POST /chargemaster/charge-items/{charge_item_id}/reprice]
        distinguishing_aspect: "Two abutting ACTIVE rules for the same (facility, revenue code) scope are legal because the interval is half-open; at exactly 2026-10-01T00:00:00Z the older rule [2026-01-01, 2026-10-01) is NOT a candidate (now < effective_to fails) so the reprice switches to the newer rule and the gross moves 240000 -> 300000 with prior_gross_charge_cents 240000."
        test_recipe:
          setup:
            - "Clock starts at 2026-09-30T00:00:00Z."
            - "Rule A for (facility, 0300): COST_PLUS_MARKUP, default tiers, [2026-01-01, 2026-10-01)."
            - "Rule B for the same scope: COST_PLUS_MARKUP, single tier 30000 bp, [2026-10-01, open) — abutting, so no overlap error."
            - "DRAFT item CDM-1001 with cost 100000, medicare 50000, market_p75 900000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { rule_a: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-10-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 30000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { rule_b: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-30T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id }
          trigger:
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { gross_before: $.data.gross_charge_cents, rule_before: $.data.applied_price_rule_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { gross_after: $.data.gross_charge_cents, rule_after: $.data.applied_price_rule_id }
          assert:
            - "${gross_before} == 240000 and ${rule_before} == ${rule_a}"
            - "${gross_after} == 300000 and ${rule_after} == ${rule_b}"
            - "ChargeItem.${item}.gross_charge_cents == 300000"
            - "ChargeItem.${item}.prior_gross_charge_cents == 240000"
            - "ChargeItem.${item}.applied_price_rule_id == ${rule_b}"
            - "ChargeItem.${item}.price_status == PRICED_CURRENT"
            - "ChargeItem.${item}.price_conflict == false"
            - "ChargeItem.${item}.version == 3"
            - "PriceRule.${rule_a}.status == ACTIVE"
            - "PriceRule.${rule_a}.applied_item_count == 0"
            - "PriceRule.${rule_b}.applied_item_count == 1"

