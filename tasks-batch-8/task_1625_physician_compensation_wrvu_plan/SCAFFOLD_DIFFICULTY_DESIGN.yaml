            - { call: "POST /comp/physician-agreements/${agr}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
          assert:
            - "Agreement status after first activation == \"EFFECTIVE\""
            - "submit-fmv from EFFECTIVE succeeds: status == \"PENDING_FMV\" (cycle, not terminal lockout)"
            - "Second FMV approval -> \"FMV_APPROVED\" with fmv_benchmark_percentile == 60 (refreshed)"
