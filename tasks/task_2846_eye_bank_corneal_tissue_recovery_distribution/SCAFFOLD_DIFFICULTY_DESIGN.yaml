              as: MedicalDirector
              captures: { status_approved: $.data.status }
          assert:
            - "${v_created} == 1 and ${status_after_screening} == \"SCREENING\" and ${v_screening} == 2"
            - "${status_after_consent} == \"CONSENT_OBTAINED\" and ${v_consent} == 3"
            - "${status_deferred} == \"DEFERRED\" and ${reason_deferred} == \"AWAITING_MEDICAL_RECORDS\" and ${v_deferred} == 4"
            - "${status_reinstated} == \"SCREENING\" — the donor RE-ENTERS a state it already left"
            - "${reason_reinstated} == null and ${scope_reinstated} == \"TRANSPLANT_AND_RESEARCH\" (consent survived the cycle)"
