              as: VendorRelationshipManager
              captures: { p_ac: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_ac}/submit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/due-diligence-packages/${p_ac}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/engagements/${e_ac}"
              payload: {}
              as: RiskOfficer
              captures: { e_ac_v: $.data.version }
            - call: "POST /tprm/due-diligence-packages/${p_ac}/approve"
              payload: { expected_engagement_version: "${e_ac_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_ac}/contracts"
              payload: { contract_reference: "AC-C1", effective_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", has_right_to_audit_clause: true, has_sla_terms: true, has_exit_plan_section: false, sla_uptime_pct: 99.5, breach_cure_window_days: 30, renewal_notice_days: 60 }
              as: VendorRelationshipManager
              captures: { c_ac: $.data.id }
            - call: "GET /tprm/engagements/${e_ac}"
              payload: {}
              as: RiskOfficer
              captures: { e_ac_v2: $.data.version }
            - call: "POST /tprm/contracts/${c_ac}/execute"
              payload: { expected_engagement_version: "${e_ac_v2}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_ac}/audits"
              payload: { scope: "SECURITY" }
              as: InternalAuditor
              captures: { au_ac: $.data.id }
            - call: "POST /tprm/audits/${au_ac}/begin-fieldwork"
              payload: {}
              as: InternalAuditor
            - call: "POST /tprm/audits/${au_ac}/findings"
              payload: { severity: "SEV_2", description: "Unpatched CVE in production" }
              as: InternalAuditor
              captures: { f_ac: $.data.id }
          trigger:
            - call: "POST /tprm/audits/${au_ac}/issue-findings"
