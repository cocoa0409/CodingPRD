          CYCLE on the VendorDispute entity: SUBMITTED -> INFO_REQUESTED -> SUBMITTED returns the row
          to a state it already occupied with round_count advanced 1 -> 2, and the loop's termination
          condition (round_count < DISPUTE_MAX_ROUNDS) rejects the third lap with
