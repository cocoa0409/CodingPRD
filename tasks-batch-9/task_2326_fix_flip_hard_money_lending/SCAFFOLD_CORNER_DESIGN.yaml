        distinguishing_aspect: "The PATCH is a partial update with one required field: appraisal_date and arv_cents move, as_is_value_cents and purchase_price_cents are untouched because they were not sent, valuation_revision_count goes 0 -> 1 and version 1 -> 2 - and there is no DELETE for a Property anywhere on the surface."
        test_recipe:
          setup:
