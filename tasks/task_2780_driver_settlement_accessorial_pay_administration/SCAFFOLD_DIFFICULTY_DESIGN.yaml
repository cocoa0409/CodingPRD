  - rule_id: transitive_cascade
    instances:
      - name: mileage_uphold_depth4_settlement_hold_cascade
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_UPHELD
          - state_machines.Load.SETTLED_to_ADJUSTED
          - entities.RetroCorrection.fields.status
          - calculations.retro_correction_delta
          - entities.Driver.fields.pending_retro_correction_cents
          - entities.Driver.fields.settlement_hold
          - validations[priority=34]
        distinguishing_aspect: |
          Depth-4 chain rooted at ONE call (dispute resolve): hop 1 flips the Dispute to UPHELD,
          hop 2 mints a PENDING RetroCorrection of +50020 and flips the Load to ADJUSTED, hop 3
          accumulates Driver.pending_retro_correction_cents, hop 4 crosses the 50000 hold threshold
          and sets Driver.settlement_hold, which then blocks a completely different driver-level
          operation (prepare of the NEXT settlement) - the failure surfaces three entities away.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "package PKG_I: LEASED_OPERATOR, PRACTICAL, per_diem_method NONE, escrow_required false, PER_MILE 58 and REVENUE_PERCENT 2500 bps"
