  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: appeal_fully_reverses_dispute_credit_and_preserves_total_gross
        grounds:
          - state_machines.DemurrageDispute.DECIDED_to_APPEALED
          - calculations.invoice_rollup_and_status_derivation
          - entities.Invoice.fields.total_gross_cents
          - entities.Invoice.fields.total_credit_cents
          - entities.Customer.fields.credit_balance_cents
        distinguishing_aspect: |
          The invariant is the money identity
          total_net_cents + total_credit_cents == total_gross_cents together with
          total_gross_cents being frozen at 47550 across the whole dispute
          lifecycle. The forward action posts 30908 of credit through three
          entities; the compensating action is a real business operation
          (POST .../appeal), not a delete or a test-only reset, and it must
          return every one of those three entities to its pre-decision value
          while the dispute itself advances to a NEW state (APPEALED, round 2) —
          so the compensation is not a rollback of the transaction, it is an
          inverse of the money effect only.
        test_recipe:
          setup:
            - "logical clock at 2026-08-15T10:00:00Z rising to 2026-09-01T09:00:00Z"
            - "one ISSUED single-charge Invoice: total_gross_cents 47550, total_credit_cents 0, total_net_cents 47550, status ISSUED"
            - "one WHOLE_INVOICE dispute UNDER_REVIEW with claimed_credit_cents 47550, evidence weight 3, first_level_adjudicator_id adj-r9i1-a"
            - "Customer.credit_balance_cents is 0 before the forward action"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "R9I1-CUST", name: "Invariant Iron", serving_station_code: "STN22", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "R9I1-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "R9I1-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R9I1-IHB01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R9I1-001", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T09:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/actual-placement"
              payload: { actual_placement_at: "2026-08-05T10:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/release"
              payload: { released_at: "2026-08-10T16:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
