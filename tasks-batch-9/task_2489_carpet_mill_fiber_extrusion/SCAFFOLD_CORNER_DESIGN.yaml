      - name: credit_hold_outranks_the_credit_limit_check_corner
        claim_type: priority_conflict
        grounds:
          - validations[priority 9]
          - validations[priority 30]
        excluded_because:
          difficulty_instance: account_credit_hold_state_beats_credit_limit_fiscal_on_order_create
          rationale: "The named §1.8 instance violates both rules with one payload and pins ERR_ACCOUNT_CREDIT_HOLD as the reported error."

      - name: flammability_certificate_outranks_roll_eligibility_corner
        claim_type: priority_conflict
        grounds:
          - validations[priority 11]
          - validations[priority 28]
        excluded_because:
          difficulty_instance: flammability_cert_safety_beats_no_eligible_rolls_referential_on_allocate
          rationale: "The named §1.8 instance allocates with neither an effective certificate nor an eligible roll and pins ERR_FLAMMABILITY_CERT_REQUIRED."

      - name: body_fk_existence_outranks_the_occ_check_corner
        claim_type: priority_conflict
        grounds:
          - validations[priority 6]
          - validations[priority 10]
        excluded_because:
          difficulty_instance: body_fk_existence_beats_occ_then_occ_beats_yardage_on_manual_allocation
          rationale: "The named §1.8 instance sends an unknown roll_good_id together with a stale version and pins ERR_ROLL_GOOD_NOT_FOUND."

      - name: three_rule_priority_ladder_on_manual_allocation_corner
        claim_type: priority_ordering
        grounds:
          - validations[priority 6]
          - validations[priority 10]
          - validations[priority 27]
        excluded_because:
          difficulty_instance: body_fk_existence_beats_occ_then_occ_beats_yardage_on_manual_allocation
          rationale: "The named §1.8 instance walks the same endpoint down the ladder — FK, then OCC, then yardage — with one violation peeled off per call."

      - name: machine_window_temporal_validation_corner
        claim_type: temporal_validation
        grounds:
          - validations[priority 22]
          - errors[ERR_MACHINE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: tufter_window_exclusive_with_leading_changeover_and_half_open_end
          rationale: "The named §1.8 instance books a run that is individually legal but collides with an existing window once the changeover lead-in is applied."

      - name: vessel_capacity_aggregate_validation_corner
        claim_type: aggregate_validation
        grounds:
          - validations[priority 23]
          - errors[ERR_VESSEL_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: dye_vessel_capacity_aggregates_over_closed_touching_windows
          rationale: "The named §1.8 instance admits each lot individually and refuses the third only on the summed load at the shared boundary instant."

  # ===========================================================================
  # SECTION 5 — ENDPOINTS
  # ===========================================================================
  - section: endpoints
    instances:
      - name: patching_an_account_credit_limit_updates_it_and_bumps_the_version
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /mill/accounts/{account_id}]
          - entities.Account.fields.credit_limit_cents
          - complexity_profile.complexity_layers.optimistic_concurrency
        distinguishing_aspect: |
          A partial update touches only the supplied key: credit_limit_cents changes, version goes
          1 -> 2, updated_at moves and the computed credit_used_cents and status are untouched. The
          re-read returns the same row, so the write is persisted rather than echoed.
        test_recipe:
          setup:
            - "Account AC-01 with credit_limit_cents 500000."
          setup_api_calls:
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 500000 }
              as: MillPlanner
              captures: { acct: $.data.id }
          trigger:
            - call: "PATCH /mill/accounts/${acct}"
              payload: { credit_limit_cents: 900000 }
              as: MillPlanner
            - call: "GET /mill/accounts/${acct}"
              payload: {}
              as: MillPlanner
          assert:
            - "the PATCH returns HTTP 200 with data.credit_limit_cents == 900000"
            - "data.version == 2 and data.account_code == AC-01"
            - "data.credit_used_cents == 0 and data.status == ACTIVE"
            - "the GET returns credit_limit_cents == 900000 and version == 2"
            - "data.created_at is unchanged and data.updated_at is not earlier than created_at"

      - name: recycled_content_read_reports_zero_under_both_bases_for_a_virgin_style
        claim_type: computed_read
        grounds:
          - endpoints[GET /mill/styles/{style_id}/recycled-content]
          - calculations.style_recycled_content_pct
        distinguishing_aspect: |
          A GREIGE run already qualifies, so the read reports the full 4000.000 kg of qualifying mass
          and names its fibre batch, yet both bases read 0.00 because the feedstock lot is virgin.
          Zero recycled content is therefore distinguishable from an empty qualifying set.
        test_recipe:
          setup:
            - "ACTIVE solution-dyed style ST-SD-01 with one GREIGE run PR-01 fed by FiberBatch FB-01 (4000.000 kg from a virgin lot)."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 0, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_10", pile_height_set_mm: 8.0, pattern_repeat_loaded_mm: 300.0, stitch_rate_per_inch: 10.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/complete-greige"
              payload: { greige_yards: 400.0 }
              as: MillPlanner
          trigger:
            - call: "GET /mill/styles/${st}/recycled-content"
              payload: {}
              as: CertificationOfficer
              as_user_id: "cert-officer-1"
          assert:
            - "HTTP 200"
            - "data.mass_balance_pct == 0.00 and data.physical_segregation_pct == 0.00"
            - "data.qualifying_kg == 4000.000"
            - "data.qualifying_fiber_batch_ids == [${fb}]"
            - "ProductionRun.${pr}.status == GREIGE"

      - name: issuing_a_certificate_links_the_style_and_its_evidence_both_ways
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /mill/certifications]
          - entities.Certification.fields.source_test_ids
          - entities.ProductTest.fields.style_id
        distinguishing_aspect: |
          The certificate is a link row between a style and specific ProductTest evidence: the
          returned source_test_ids echo the cited test, the style-scoped certificate list finds it,
          and the style-scoped product-test list still resolves the evidence independently. Both ends
          must pre-exist, and the test's tested_by_user_id differs from the issuer.
