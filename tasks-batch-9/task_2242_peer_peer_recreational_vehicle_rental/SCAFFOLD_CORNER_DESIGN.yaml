            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
            - call: "POST /rv-marketplace/owners/${owner_id}/penalty-adjustments"
              payload: { points_delta: 12, reason: "repeat owner cancellations" }
              as: PlatformAdmin
          trigger:
