        claim_type: boundary_edge
        grounds: [calculations.compensation_amount]
        distinguishing_aspect: "Distance tier boundary: 1500 km -> 25000, 1501 km -> 40000, both at actual delay 260 min vs orig_sched_arr_utc (>= 180, inclusive tier edges, <= comparison)."
        test_recipe:
          setup:
            - "Event E (MECHANICAL) ASSESSING; flight T1 (1500 km) with booking B1; flight T2 (1501 km) with booking B2; both retimed to arr 13:00 under E"
