  - rule_id: boundary_precision_check
    instances:
      - name: kit_reserve_succeeds_at_exact_availability_then_shortage
        grounds:
          - calculations.required_kits
          - state_machines.ClassroomDelivery
          - errors.ERR_KIT_SHORTAGE
        distinguishing_aspect: |
          Boundary on kit count via POST /deliveries/{id}/transition: RESERVE_KITS compares
          available_count >= required_kits — at exact equality (23 available vs 23 required) the
          reservation succeeds and drains the pool to 0; the next delivery's reservation of 23
          against 0 fails with ERR_KIT_SHORTAGE. Off-by-one in the comparison (">" instead of
          ">=") flips the first outcome.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Base territory/school; partner1 ACTIVE with eligible vol1."
            - "Program JA-ECO5 (5 sessions -> required_kits 23 for enrolled 20); agreement ACTIVE (pledge 200000)."
