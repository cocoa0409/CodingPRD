# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2477 — School Psychologist Evaluation Scheduling & Timeline Compliance
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every numeric literal below was computed by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: pressure_index_variant_divergence_drives_selector
        grounds:
          - calculations.caseload_pressure_index
          - calculations.psychologist_assignment_rank_score
          - calculations.psychologist_open_case_points
          - entities.Psychologist.fields.pressure_index_assigned_basis
          - entities.Psychologist.fields.pressure_index_clock_weighted
          - state_machines.Evaluation.PENDING_ASSIGNMENT_to_ASSIGNED
        distinguishing_aspect: |
          This instance's dual variants live on the Psychologist entity domain (caseload pressure): with
          identical raw caseloads the ASSIGNED_BASIS variant ranks psychologist B as less loaded (0.25 vs
          0.45) while the CLOCK_WEIGHTED_BASIS variant ranks B as more loaded (0.50 vs 0.45), and because the
          selector consumes only CLOCK_WEIGHTED_BASIS the auto-assignment lands on A — the opposite of what
          the assigned-basis view would predict.
        test_recipe:
          setup:
            - "Logical clock starts at its default 2026-08-01T00:00:00Z and is later advanced to 2026-10-01T00:00:00Z."
            - "One building NS01 with two ACTIVE SSP psychologists, both covering NS01, both weekly_capacity_points = 20."
            - "Psychologist B carries exactly one open Evaluation worth 5 caseload points (INITIAL, 1 domain, no interpreter) whose compliance_status has been driven to BREACHED by a compliance run."
            - "Psychologist A carries exactly one open Evaluation worth 9 caseload points (INITIAL, 3 domains, interpreter required) consented on 2026-10-01 and therefore still ON_TRACK."
            - "A third referral at NS01 (INITIAL, 1 domain, no interpreter -> 5 points) is consented and sits in PENDING_ASSIGNMENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Northside Elementary", building_code: "NS01", grade_band: "ELEMENTARY", concurrent_meeting_capacity: 1, enrollment_count: 480 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Ana Reyes", employee_number: "E-1001", credential_type: "SSP", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Ben Okoro", employee_number: "E-1002", credential_type: "SSP", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pb: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-B", referral_type: "INITIAL", primary_language: "en", interpreter_required: false, bilingual_evaluation_required: false, requested_domains: ["COGNITIVE"], intervention_team_summary: "tier 3 reading" }
              as: IntakeCoordinator
              captures: { rb: $.data.id }
            - call: "POST /psych-services/referrals/${rb}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-B-1" }
              as: IntakeCoordinator
              captures: { eval_b: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval_b}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver_b: $.data.version }
            - call: "POST /psych-services/evaluations/${eval_b}/assign"
              payload: { expected_evaluation_version: "${ver_b}", psychologist_id: "${pb}" }
              as: PsychServicesSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/compliance-runs"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-A", referral_type: "INITIAL", primary_language: "en", interpreter_required: true, bilingual_evaluation_required: false, requested_domains: ["COGNITIVE", "ACADEMIC", "SOCIAL_EMOTIONAL"], intervention_team_summary: "tier 3 multi-domain" }
              as: IntakeCoordinator
              captures: { ra: $.data.id }
            - call: "POST /psych-services/referrals/${ra}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-10-01T09:00:00Z", parent_signature_reference: "SIG-A-1" }
              as: IntakeCoordinator
              captures: { eval_a: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval_a}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver_a: $.data.version }
            - call: "POST /psych-services/evaluations/${eval_a}/assign"
              payload: { expected_evaluation_version: "${ver_a}", psychologist_id: "${pa}" }
              as: PsychServicesSupervisor
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-C", referral_type: "INITIAL", primary_language: "en", interpreter_required: false, bilingual_evaluation_required: false, requested_domains: ["COGNITIVE"], intervention_team_summary: "tier 2 math" }
              as: IntakeCoordinator
              captures: { rc: $.data.id }
            - call: "POST /psych-services/referrals/${rc}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-10-01T09:00:00Z", parent_signature_reference: "SIG-C-1" }
              as: IntakeCoordinator
              captures: { eval_c: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval_c}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver_c: $.data.version }
          trigger:
            - call: "POST /psych-services/evaluations/${eval_c}/assign"
              payload: { expected_evaluation_version: "${ver_c}" }
              as: PsychServicesSupervisor
          assert:
            - "GET /psych-services/psychologists/${pa} immediately before the trigger returns open_case_points == 9, pressure_index_assigned_basis == 0.45 and pressure_index_clock_weighted == 0.45"
            - "GET /psych-services/psychologists/${pb} immediately before the trigger returns open_case_points == 5, pressure_index_assigned_basis == 0.25 and pressure_index_clock_weighted == 0.50"
            - "Psychologist.${pb}.pressure_index_assigned_basis (0.25) < Psychologist.${pa}.pressure_index_assigned_basis (0.45) while Psychologist.${pb}.pressure_index_clock_weighted (0.50) > Psychologist.${pa}.pressure_index_clock_weighted (0.45) — the two variants order the same two rows oppositely"
            - "Evaluation.${eval_c}.psychologist_id == ${pa} — rank_score(A) == 0.35 (0.45 + 0.25*max(0, 0-1 -> 0) - 0.10*min(2,1)) beats rank_score(B) == 0.40 (0.50 + 0 - 0.10)"
            - "Evaluation.${eval_c}.assessment_status == ASSIGNED and Evaluation.${eval_c}.caseload_points == 5"
            - "After the trigger Psychologist.${pa}.open_case_points == 14, pressure_index_assigned_basis == 0.70 and pressure_index_clock_weighted == 0.70"
            - "After the trigger Psychologist.${pb}.open_case_points == 5 (unchanged)"

      - name: compensatory_minutes_basis_divergence_on_breach
        grounds:
          - calculations.compensatory_minutes
          - entities.TimelineBreach.fields.minutes_breach_day_basis
          - entities.TimelineBreach.fields.minutes_missed_service_basis
          - entities.TimelineBreach.fields.remedy_minutes_awarded
          - state_machines.TimelineBreach.DETECTED_to_REMEDY_PROPOSED
        distinguishing_aspect: |
          This instance's dual variants live on the TimelineBreach entity domain (compensatory service
          minutes), not on Psychologist caseload: for the same frozen breach_days == 8 the BREACH_DAY_BASIS
          variant yields 300 minutes while the MISSED_SERVICE_BASIS variant yields 375, and the proposal
          commits to one basis with no reconciliation of the delta.
        test_recipe:
          setup:
            - "Clock default 2026-08-01T00:00:00Z; one building, one ACTIVE SSP psychologist covering it."
            - "One INITIAL referral (1 domain, no interpreter) consented at 2026-08-01T09:00:00Z, so clock_start_date = 2026-08-01 and base_due_date = 2026-09-30."
            - "The evaluation is ASSIGNED, the clock is advanced to 2026-10-08T00:00:00Z and a compliance run has opened a TimelineBreach with breach_days = 8 (elapsed_statutory_days 68, days_remaining -8)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Eastview Middle", building_code: "EV02", grade_band: "MIDDLE", concurrent_meeting_capacity: 1, enrollment_count: 610 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Cara Blum", employee_number: "E-1003", credential_type: "SSP", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-D", referral_type: "INITIAL", primary_language: "en", interpreter_required: false, bilingual_evaluation_required: false, requested_domains: ["COGNITIVE"], intervention_team_summary: "tier 3 behaviour" }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-D-1" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver1: $.data.version }
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${ver1}", psychologist_id: "${pa}" }
              as: PsychServicesSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-08T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/compliance-runs"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /psych-services/evaluations/${eval1}/timeline-breaches"
              payload: {}
              as: ComplianceOfficer
              captures: { breach_id: "$.data[0].id" }
          trigger:
            - call: "POST /psych-services/timeline-breaches/${breach_id}/propose-remedy"
              payload: { remedy_basis: "MISSED_SERVICE_BASIS", additional_minutes: 25, corrective_action_note: "Weekly compensatory counselling blocks plus intake audit" }
              as: ComplianceOfficer
          assert:
            - "TimelineBreach.${breach_id}.breach_days == 8 and severity == MODERATE"
            - "TimelineBreach.${breach_id}.minutes_breach_day_basis == 300"
            - "TimelineBreach.${breach_id}.minutes_missed_service_basis == 375"
            - "minutes_missed_service_basis - minutes_breach_day_basis == 75 — the two variants diverge on identical inputs"
            - "TimelineBreach.${breach_id}.remedy_basis == MISSED_SERVICE_BASIS and remedy_minutes_awarded == 400"
            - "TimelineBreach.${breach_id}.status == REMEDY_PROPOSED"
            - "Evaluation.${eval1}.compliance_status == BREACHED and Evaluation.${eval1}.days_remaining == -8"

  - rule_id: combinatorial_formula
    instances:
      - name: protocol_order_independent_rounding_order_pin
        grounds:
          - calculations.protocol_order_total_cost
          - entities.ProtocolOrder.fields.unit_price_cents
          - entities.ProtocolOrder.fields.contract_discount_cents
          - entities.ProtocolOrder.fields.rush_surcharge_cents
          - entities.ProtocolOrder.fields.total_cost_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters: the scaffold pins three INDEPENDENT
          round_half_up steps (unit price, contract discount, rush surcharge) before summing, so unit cost
          1799 c at quantity 30 with rush yields exactly 52039 cents, whereas the sum-then-round order yields
          52041 cents on the same inputs.
        test_recipe:
          setup:
            - "Clock default 2026-08-01T00:00:00Z."
            - "One AssessmentInstrument with protocol_unit_cost_cents = 1799 and a valid licence."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/assessment-instruments"
              payload: { name: "WISC-V", instrument_code: "WISC5", protocol_stock_count: 0, protocol_units_per_administration: 1, protocol_unit_cost_cents: 1799, license_seat_total: 2, license_expires_on: "2027-06-30", supported_language_editions: ["en", "es"] }
              as: DistrictAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /psych-services/protocol-orders"
              payload: { instrument_id: "${inst}", quantity_requested: 30, rush_flag: true }
              as: PsychServicesSupervisor
              captures: { order1: $.data.id }
          assert:
            - "ProtocolOrder.${order1}.unit_price_cents == 1709 (round_half_up(1799 * 0.95) on 1709.05)"
            - "ProtocolOrder.${order1}.base_cents == 51270"
            - "ProtocolOrder.${order1}.contract_discount_cents == 3589 (round_half_up(51270 * 0.07) on 3588.90)"
            - "ProtocolOrder.${order1}.rush_surcharge_cents == 4358 (round_half_up(51270 * 0.085) on 4357.95)"
            - "ProtocolOrder.${order1}.handling_fee_cents == 0 (quantity_requested 30 >= TIER1_MIN_QTY 25)"
            - "ProtocolOrder.${order1}.total_cost_cents == 52039 and NOT 52041 (the sum-then-round order)"
            - "ProtocolOrder.${order1}.auto_approved == false and status == SUBMITTED (52039 > 40000)"
            - "AssessmentInstrument.${inst}.protocol_stock_count == 0 — ordering never moves stock"

      - name: timeline_clock_base_window_evaluation_order_pin
        grounds:
          - calculations.evaluation_timeline_clock
          - calculations.exclusion_day_credit
          - state_machines.TimelineExclusion.CLAIMED_to_APPROVED
          - validations[priority=21]
          - entities.Evaluation.fields.statutory_due_date
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order: the credit window depends
          on the due date and the due date depends on the credit, and the scaffold pins step 2 to intersect
          against the BASE window [clock_start_date, base_due_date] = [2026-08-01, 2026-09-30]. A second claim
          for 2026-10-05..2026-10-14 therefore credits 0 days and is rejected, whereas an implementation that
          intersected against the already-extended statutory_due_date 2026-10-14 would credit 10 days and
          return 200.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z; consent effective 2026-08-01T09:00:00Z gives clock_start_date 2026-08-01 and base_due_date 2026-09-30."
            - "One approved BREAK_CLOSURE exclusion 2026-08-10..2026-08-24 has already credited 14 days, moving statutory_due_date to 2026-10-14."
            - "The clock is then advanced to 2026-10-15T00:00:00Z and a second PARENT_UNAVAILABLE claim covering 2026-10-05..2026-10-14 sits in CLAIMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Westgate High", building_code: "WG03", grade_band: "HIGH", concurrent_meeting_capacity: 1, enrollment_count: 1200 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Dan Ivers", employee_number: "E-1004", credential_type: "PHD", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-E", referral_type: "INITIAL", primary_language: "en", interpreter_required: false, bilingual_evaluation_required: false, requested_domains: ["COGNITIVE"], intervention_team_summary: "tier 3 writing" }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-E-1" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver1: $.data.version }
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${ver1}", psychologist_id: "${pa}" }
              as: PsychServicesSupervisor
            - call: "POST /psych-services/timeline-exclusions"
              payload: { evaluation_id: "${eval1}", exclusion_type: "BREAK_CLOSURE", start_date: "2026-08-10", end_date: "2026-08-24", claim_note: "District summer closure" }
              as: SchoolPsychologist
              as_user_id: "${pa}"
              captures: { excl1: $.data.id }
            - call: "POST /psych-services/timeline-exclusions/${excl1}/decision"
              payload: { decision: "APPROVE" }
              as: PsychServicesSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/timeline-exclusions"
              payload: { evaluation_id: "${eval1}", exclusion_type: "PARENT_UNAVAILABLE", start_date: "2026-10-05", end_date: "2026-10-14", claim_note: "Parent out of district" }
              as: SchoolPsychologist
              as_user_id: "${pa}"
              captures: { excl2: $.data.id }
          trigger:
            - call: "POST /psych-services/timeline-exclusions/${excl2}/decision"
              payload: { decision: "APPROVE" }
              as: PsychServicesSupervisor
          assert:
            - "TimelineExclusion.${excl1}.days_claimed == 15 and days_credited == 14 (PER_TYPE_CAP_DAYS[BREAK_CLOSURE])"
            - "Evaluation.${eval1}.base_due_date == \"2026-09-30\" and credited_exclusion_days == 14 and statutory_due_date == \"2026-10-14\""
            - "TimelineExclusion.${excl2}.days_claimed == 10"
            - "The trigger returns HTTP 422 with error_id == ERR_EXCLUSION_ZERO_DAYS because the intersection window is the BASE window [2026-08-01, 2026-09-30], giving overlap_days == 0"
            - "TimelineExclusion.${excl2}.status remains CLAIMED and days_credited == 0"
            - "Evaluation.${eval1}.credited_exclusion_days is still 14 and statutory_due_date is still \"2026-10-14\" — the second claim never extended the window"

  - rule_id: non_linear_state_machine
    instances:
      - name: evaluation_parallel_dimensions_report_final_while_breached
        grounds:
          - state_machines.Evaluation.REPORT_DRAFTED_to_REPORT_FINAL
          - state_machines.Evaluation.ON_TRACK_to_BREACHED
          - entities.Evaluation.fields.assessment_status
          - entities.Evaluation.fields.compliance_status
          - calculations.psychologist_open_case_points
        distinguishing_aspect: |
          Non-linearity on the Evaluation entity takes the form of two PARALLEL state dimensions on one row:
          assessment_status walks to REPORT_FINAL while compliance_status independently sits at BREACHED, and
          neither dimension's transition consumes or blocks the other's.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z; instrument with 10 protocols in stock, licence valid to 2027-06-30, 2 licence seats."
            - "Psychologist A holds a scoring seat and is assigned an INITIAL 1-domain evaluation consented 2026-08-01T09:00:00Z (5 caseload points); psychologist R is a second ACTIVE peer at the same building."
            - "A has driven the evaluation through IN_TESTING, SCORED and REPORT_DRAFTED; the clock is then advanced to 2026-10-08T00:00:00Z and a compliance run has moved compliance_status to BREACHED (breach_days 8) while assessment_status is still REPORT_DRAFTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Lakeside Elementary", building_code: "LS04", grade_band: "ELEMENTARY", concurrent_meeting_capacity: 1, enrollment_count: 390 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Elle Marsh", employee_number: "E-1005", credential_type: "SSP", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Raj Patel", employee_number: "E-1006", credential_type: "PHD", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pr: $.data.id }
            - call: "POST /psych-services/assessment-instruments"
              payload: { name: "KTEA-3", instrument_code: "KTEA3", protocol_stock_count: 10, protocol_units_per_administration: 1, protocol_unit_cost_cents: 1000, license_seat_total: 2, license_expires_on: "2027-06-30", supported_language_editions: ["en"] }
              as: DistrictAdmin
              captures: { inst: $.data.id }
            - call: "POST /psych-services/assessment-instruments/${inst}/license-seats"
              payload: { psychologist_id: "${pa}" }
              as: DistrictAdmin
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-F", referral_type: "INITIAL", primary_language: "en", interpreter_required: false, bilingual_evaluation_required: false, requested_domains: ["ACADEMIC"], intervention_team_summary: "tier 3 fluency" }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-F-1" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver1: $.data.version }
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${ver1}", psychologist_id: "${pa}" }
              as: PsychServicesSupervisor
            - call: "POST /psych-services/evaluations/${eval1}/testing-start"
              payload: { instrument_id: "${inst}" }
              as: SchoolPsychologist
              as_user_id: "${pa}"
            - call: "POST /psych-services/evaluations/${eval1}/scores"
              payload: { score_summary: "KTEA-3 composite 78, fluency 71" }
              as: SchoolPsychologist
              as_user_id: "${pa}"
            - call: "POST /psych-services/evaluations/${eval1}/report-draft"
              payload: { report_narrative: "Draft: specific learning disability in reading fluency suspected." }
              as: SchoolPsychologist
              as_user_id: "${pa}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-08T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/compliance-runs"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /psych-services/evaluations/${eval1}/timeline-breaches"
              payload: {}
              as: ComplianceOfficer
              captures: { breach_id: "$.data[0].id" }
          trigger:
            - call: "POST /psych-services/evaluations/${eval1}/report-review"
              payload: { decision: "APPROVE" }
              as: SchoolPsychologist
              as_user_id: "${pr}"
          assert:
            - "Immediately before the trigger Evaluation.${eval1}.assessment_status == REPORT_DRAFTED while compliance_status == BREACHED — the two dimensions hold independent values on the same row"
            - "Evaluation.${eval1}.assessment_status == REPORT_FINAL after the trigger"
            - "Evaluation.${eval1}.compliance_status == BREACHED after the trigger — finalising the report does NOT clear the compliance dimension"
            - "TimelineBreach.${breach_id}.status == DETECTED and breach_days == 8"
            - "Psychologist.${pa}.open_case_points == 0 and caseload_status == BALANCED (the evaluation left the open window)"
            - "Psychologist.${pa}.pressure_index_assigned_basis == 0.00 and pressure_index_clock_weighted == 0.00"
            - "Evaluation.${eval1}.protocol_units_consumed == 1 and AssessmentInstrument.${inst}.protocol_stock_count == 9"

      - name: eligibility_meeting_notice_reschedule_cycle_bounded
        grounds:
          - state_machines.EligibilityMeeting.PROPOSED_to_NOTICED
          - state_machines.EligibilityMeeting.NOTICED_to_RESCHEDULE_REQUESTED
          - state_machines.EligibilityMeeting.RESCHEDULE_REQUESTED_to_NOTICED
          - validations[priority=23]
          - entities.EligibilityMeeting.fields.reschedule_count
        distinguishing_aspect: |
          Non-linearity on the EligibilityMeeting entity is a CYCLE, not parallel dimensions: the row
          re-enters NOTICED twice via RESCHEDULE_REQUESTED, and the loop is terminated by the
          reschedule_count < MAX_RESCHEDULES guard rather than by reaching a sink state.
        test_recipe:
          setup:
            - "Clock stays at 2026-08-01T00:00:00Z throughout, so every notice clears the 10-day lead."
            - "One building (concurrent_meeting_capacity 1) and one consented INITIAL referral whose Evaluation exists."
            - "A meeting has been proposed for 2026-09-20T15:00:00Z-16:00:00Z and taken twice around the NOTICED -> RESCHEDULE_REQUESTED -> NOTICED loop, landing on 2026-09-28T15:00:00Z-16:00:00Z with reschedule_count == 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Riverbend Middle", building_code: "RB05", grade_band: "MIDDLE", concurrent_meeting_capacity: 1, enrollment_count: 700 }
              as: DistrictAdmin
