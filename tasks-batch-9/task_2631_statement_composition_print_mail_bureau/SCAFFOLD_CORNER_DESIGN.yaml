              as: BureauAdmin
              captures: { e6_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${e6_template_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/data-files"
              payload: { client_id: "${e6_client_id}", file_name: "e6a.csv", format_spec_code: "DELIMITED", declared_record_count: 1, declared_control_total_cents: 5000 }
              as: ClientLiaison
              captures: { e6_file_1: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${e6_file_1}", account_ref: "ABC3501", sequence_no: 1, statement_amount_cents: 5000, address_line1: "3800 Selector Circle", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "3801" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${e6_file_1}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${e6_file_1}/control-check"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${e6_file_1}", template_id: "${e6_template_id}", rush_requested: false }
              as: CompositionOperator
              as_user_id: "op-1"
              captures: { e6_job_1: "$.data.id" }
            - call: "POST /bureau/composition-jobs/${e6_job_1}/presort"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files"
              payload: { client_id: "${e6_client_id}", file_name: "e6b.csv", format_spec_code: "DELIMITED", declared_record_count: 1, declared_control_total_cents: 5000 }
              as: ClientLiaison
              captures: { e6_file_2: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${e6_file_2}", account_ref: "ABC3502", sequence_no: 1, statement_amount_cents: 5000, address_line1: "3802 Selector Circle", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "3802" }
              as: ClientLiaison
