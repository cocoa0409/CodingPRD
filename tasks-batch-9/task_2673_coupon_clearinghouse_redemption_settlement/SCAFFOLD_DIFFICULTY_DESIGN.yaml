              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { lot_day14_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
