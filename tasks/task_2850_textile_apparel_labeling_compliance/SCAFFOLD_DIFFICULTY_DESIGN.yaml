            - "${t1_state} == \"BENCH_RESERVED\" and ${t2_state} == \"BENCH_RESERVED\" (one overlap is under the capacity of 2)"
            - "${err_capacity} == \"ERR_LAB_BENCH_CAPACITY\" with HTTP 409"
            - "LabTest.${t1_id}.state == \"PASSED\" and LabTest.${t1_id}.valid_until == \"2027-08-03T09:00:00Z\""
            - "${t3_state} == \"BENCH_RESERVED\" (the identical request now fits, because only T2 is still occupying the bench)"
            - "${err_touching} == \"ERR_LAB_BENCH_CAPACITY\" with HTTP 409 - the start instant 2026-08-07T09:00:00Z equals T2 occupancy end (2026-08-06T09:00:00Z plus 24h) and also falls inside T3 occupancy, so two rows overlap under CLOSED-end semantics"
            - "${t5_state} == \"BENCH_RESERVED\" (a different method is a different bench pair, so occupancy never interacts)"
            - "GET /labeling/styles/${s4_id}/lab-tests returns exactly 1 row"

  - rule_id: compensating_invariant
    instances:
      - name: full_prompt_correction_returns_the_penalty_ledger_to_its_pre_review_value
        grounds:
          - calculations.penalty_mitigation
          - calculations.brand_penalty_ledger
          - calculations.marking_penalty_assessment
          - entities.Brand.fields.outstanding_penalty_usd
          - entities.ImportShipment.fields.penalty_mitigated_usd
          - state_machines[entity=ImportShipment]
        distinguishing_aspect: |
          Money is the conserved quantity: a deficient entry adds 4800.00 to the brand ledger and a fully prompt correction of every unit mitigates exactly 4800.00, so outstanding_penalty_usd must come back to the byte-identical 0.00 it held before the review - while a second, identical entry corrected only halfway leaves exactly 3600.00 behind, which shows the compensation is computed from the correction ratio and rate rather than simply deleting the row from the ledger.
        test_recipe:
          setup:
            - "Market US is registered with marking_duty_rate 0.100; the logical clock stays at 2026-08-01T00:00:00Z, which is inside both the 10-day prompt window and the 30-day redelivery window of every review below."
            - "Brand Northline Apparel Co owns style S1 with ISSUED VN determination, PASSED fiber and care evidence, and a PUBLISHED permanent label L1 to correct against."
            - "Two identical entries ENT-5001 and ENT-5002 each declare 48000.00 USD over 12000 units."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id, ledger_initial: $.data.outstanding_penalty_usd }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 37.0, ornamentation_exempt: false }, { fiber_generic_name: "ELASTANE", declared_pct: 3.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "FIBER", country_code: "IN", value_added_usd: 2.00, weight_grams: 500.0, is_ornamentation: false }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n1_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "CUT_AND_SEW", country_code: "VN", value_added_usd: 9.00, weight_grams: 900.0, is_ornamentation: false, parent_input_id: "${n1_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { sv1: $.data.version }
            - call: "POST /labeling/origin-determinations"
              payload: { style_id: "${style_id}", expected_style_version: "${sv1}" }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { od_id: $.data.id }
            - call: "POST /labeling/origin-determinations/${od_id}/issue"
              payload: { method: "SUBSTANTIAL_TRANSFORMATION" }
              as: ComplianceAdmin
            - call: "POST /labeling/lab-tests"
              payload: { style_id: "${style_id}", test_type: "FIBER_CONTENT", lab_code: "LAB-ATL-1", method: "AATCC_20A", specimen_received_at: "2026-08-03T09:00:00Z", results_due_at: "2026-08-05T09:00:00Z" }
              as: AccreditedLab
              captures: { t1_id: $.data.id }
            - call: "POST /labeling/lab-tests/${t1_id}/results"
              payload: { measured_fibers: [{ fiber_generic_name: "COTTON", measured_pct: 57.0 }, { fiber_generic_name: "POLYESTER", measured_pct: 40.0 }, { fiber_generic_name: "ELASTANE", measured_pct: 3.0 }] }
              as: AccreditedLab
            - call: "POST /labeling/lab-tests"
              payload: { style_id: "${style_id}", test_type: "CARE_PERFORMANCE", lab_code: "LAB-ATL-1", method: "AATCC_135", specimen_received_at: "2026-08-03T09:00:00Z", results_due_at: "2026-08-05T09:00:00Z", wash_temp_c: 30 }
              as: AccreditedLab
              captures: { c1_id: $.data.id }
            - call: "POST /labeling/lab-tests/${c1_id}/results"
              payload: { cycles_run: 5, dimensional_change_pct: 2.0, colorfastness_grade: 4.0, legibility_cycles: 40 }
              as: AccreditedLab
            - call: "POST /labeling/label-specs"
              payload: { style_id: "${style_id}", market_codes: ["US"], languages: ["en"], placement_code: "NECK_CENTER_INSIDE", durability_cycles_rating: 40, wash_temp_c: 30, bleach_code: "NO_BLEACH", dry_code: "TUMBLE_LOW", iron_code: "IRON_LOW", dryclean_code: "DO_NOT_DRYCLEAN", identity_display_mode: "RN", fiber_content_text: "60.0% COTTON, 37.0% POLYESTER, 3.0% OTHER FIBER", origin_text: "Made in VN", origin_determination_id: "${od_id}", care_test_id: "${c1_id}" }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { l1_id: $.data.id }
            - call: "POST /labeling/label-specs/${l1_id}/submit"
              payload: {}
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
            - call: "POST /labeling/label-specs/${l1_id}/approve"
              payload: {}
              as: LabelingApprover
              as_user_id: "user-appr-1"
            - call: "POST /labeling/label-specs/${l1_id}/publish"
              payload: { effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z" }
              as: LabelingApprover
              as_user_id: "user-appr-1"
            - call: "POST /labeling/import-shipments"
              payload: { importer_brand_id: "${brand_id}", style_id: "${style_id}", entry_number: "ENT-5001", quantity_units: 12000, declared_value_usd: 48000.00, entry_market_code: "US" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { sh1_id: $.data.id }
            - call: "POST /labeling/import-shipments"
              payload: { importer_brand_id: "${brand_id}", style_id: "${style_id}", entry_number: "ENT-5002", quantity_units: 12000, declared_value_usd: 48000.00, entry_market_code: "US" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { sh2_id: $.data.id }
          trigger:
            - call: "POST /labeling/import-shipments/${sh1_id}/marking-review"
              payload: { outcome: "DEFICIENT", deficiency_code: "MISSING_ORIGIN" }
              as: CustomsOfficer
              captures: { sh1_assessed: $.data.penalty_assessed_usd, sh1_deadline: $.data.redelivery_deadline_at }
            - call: "GET /labeling/brands/${brand_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { ledger_after_review: $.data.outstanding_penalty_usd }
            - call: "POST /labeling/import-shipments/${sh1_id}/correct"
              payload: { corrective_label_spec_id: "${l1_id}", corrected_units: 12000 }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { sh1_mitigated: $.data.penalty_mitigated_usd, sh1_state: $.data.marking_state }
            - call: "GET /labeling/brands/${brand_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { ledger_restored: $.data.outstanding_penalty_usd, posture_restored: $.data.posture }
            - call: "POST /labeling/import-shipments/${sh2_id}/marking-review"
              payload: { outcome: "DEFICIENT", deficiency_code: "WRONG_ORIGIN" }
              as: CustomsOfficer
              captures: { sh2_posture_at_review: $.data.posture_at_review, sh2_assessed: $.data.penalty_assessed_usd }
            - call: "POST /labeling/import-shipments/${sh2_id}/correct"
              payload: { corrective_label_spec_id: "${l1_id}", corrected_units: 6000 }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { sh2_mitigated: $.data.penalty_mitigated_usd }
            - call: "GET /labeling/brands/${brand_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { ledger_partial: $.data.outstanding_penalty_usd }
          assert:
            - "${ledger_initial} == 0.00"
            - "${sh1_assessed} == 4800.00 and ${sh1_deadline} == \"2026-08-31T00:00:00Z\" (review instant plus 30 days)"
            - "${ledger_after_review} == 4800.00"
            - "${sh1_mitigated} == 4800.00 and ${sh1_state} == \"MARKING_CORRECTED\""
            - "${ledger_restored} == 0.00 and ${posture_restored} == \"OPEN\" (byte-identical to the pre-review ledger)"
            - "${sh2_posture_at_review} == \"OPEN\" and ${sh2_assessed} == 4800.00"
            - "${sh2_mitigated} == 1200.00 (rate 0.50 for a partial correction times a correction_ratio of one half, single rounding at the end)"
            - "${ledger_partial} == 3600.00"
            - "ImportShipment.${sh1_id}.penalty_assessed_usd == 4800.00 (the assessment itself is never rewritten by the correction)"
            - "ImportShipment.${sh1_id}.corrected_units == 12000 and ImportShipment.${sh2_id}.corrected_units == 6000"

      - name: finding_units_are_conserved_across_disposition_and_reopen
        grounds:
          - calculations.finding_unit_conservation
          - calculations.audit_rollup
          - validations[priority=85]
          - errors.ERR_DISPOSITION_INCOMPLETE
          - entities.AuditFinding.fields.units_unresolved
          - entities.ComplianceAudit.fields.units_in_scope
        distinguishing_aspect: |
          units_affected is the conserved quantity: a disposition may only split it across the three buckets, a short split of 90 of 100 units is ERR_DISPOSITION_INCOMPLETE and must leave every counter untouched, and a reopen must restore units_unresolved to the original 100 by zeroing all three buckets - while ComplianceAudit.units_in_scope, which is summed with no state filter, must read 100 at every single one of those points.
        test_recipe:
          setup:
            - "Brand Northline Apparel Co owns style S1."
            - "Audit A1 carries one finding F1 (PLACEMENT_NON_PERMANENT, 100 units), so it starts OPEN with units_unresolved 100 and the audit reads units_in_scope 100."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-E-01", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 300.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/compliance-audits"
              payload: { brand_id: "${brand_id}", scope: "STYLE_DOSSIER", audit_window_from: "2026-01-01T00:00:00Z", audit_window_to: "2026-12-31T00:00:00Z" }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { audit_id: $.data.id }
            - call: "POST /labeling/compliance-audits/${audit_id}/findings"
              payload: { style_id: "${style_id}", finding_code: "PLACEMENT_NON_PERMANENT", units_affected: 100 }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { f1_id: $.data.id, unresolved_initial: $.data.units_unresolved }
          trigger:
            - call: "POST /labeling/audit-findings/${f1_id}/disposition"
              payload: { units_relabeled: 0, units_destroyed: 60, units_released: 30 }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { err_short: $.data.error_id }
            - call: "GET /labeling/audit-findings/${f1_id}"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { state_after_reject: $.data.state, destroyed_after_reject: $.data.units_destroyed, unresolved_after_reject: $.data.units_unresolved }
            - call: "POST /labeling/audit-findings/${f1_id}/disposition"
              payload: { units_relabeled: 0, units_destroyed: 60, units_released: 40 }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { unresolved_after_disposition: $.data.units_unresolved, state_after_disposition: $.data.state }
            - call: "POST /labeling/audit-findings/${f1_id}/verify"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { state_after_verify: $.data.state }
            - call: "POST /labeling/audit-findings/${f1_id}/reopen"
              payload: { reopen_reason: "The destroyed lot was found back in the distribution centre." }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { unresolved_after_reopen: $.data.units_unresolved, destroyed_after_reopen: $.data.units_destroyed, released_after_reopen: $.data.units_released }
            - call: "GET /labeling/compliance-audits/${audit_id}"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { scope_final: $.data.units_in_scope, state_final: $.data.state, open_final: $.data.open_finding_count }
          assert:
            - "${unresolved_initial} == 100"
            - "${err_short} == \"ERR_DISPOSITION_INCOMPLETE\" with HTTP 422"
            - "${state_after_reject} == \"OPEN\" and ${destroyed_after_reject} == 0 and ${unresolved_after_reject} == 100"
            - "${state_after_disposition} == \"REMEDIATED\" and ${unresolved_after_disposition} == 0"
            - "${state_after_verify} == \"CLOSED\""
            - "${unresolved_after_reopen} == 100 and ${destroyed_after_reopen} == 0 and ${released_after_reopen} == 0"
            - "AuditFinding.${f1_id}.units_affected == 100 at every point above, and units_relabeled + units_destroyed + units_released + units_unresolved == 100 after every one of the six calls"
            - "AuditFinding.${f1_id}.verified_at == null and AuditFinding.${f1_id}.disposition_recorded_at == null after the reopen"
            - "${scope_final} == 100 and ${state_final} == \"IN_REVIEW\" and ${open_final} == 1"
