# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0712
# Difficulty: Expert
# Single top-level key: scaffold_difficulty_design
# Every grounds[*] resolves to a real element in SCAFFOLD.yaml §1.1–§1.7.
# 9 rule_ids × 2 instances = 18 instances total.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_total_hourly_vs_retainer_diverge_on_engagement
        grounds:
          - calculations.invoice_total
          - entities.Engagement.fields.fee_model
          - entities.Invoice.fields.total_cents
          - entities.TimeEntry.fields.minutes
        distinguishing_aspect: |
          Domain = Engagement billing. Identical swept time (120 minutes / 2.0h) yields a
          DIFFERENT total under the HOURLY variant (floor((120/60)*15000)=30000) versus the
          RETAINER variant (500000 + floor(max(0,2.0-10)*8000)=500000); same inputs, two valid
          formulas, divergent total_cents — and a different entity domain than instance #2 (Client scoring).
        test_recipe:
          setup:
            - "Two ACTIVE engagements on the same ACTIVE client: eng_h with fee_model=HOURLY (hourly_rate_cents=15000); eng_r with fee_model=RETAINER (retainer_monthly_cents=500000, retainer_included_hours=10, overage_rate_cents=8000)."
            - "Each engagement has LOGGED TimeEntries totalling 120 minutes in period 202603."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Helix Org", ein: "11-1110001", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "h@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 15000 }
              as: AccountManager
              captures: { eng_h: $.data.id }
            - call: "POST /grant-desk/engagements/${eng_h}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "RETAINER", retainer_monthly_cents: 500000, retainer_included_hours: 10, overage_rate_cents: 8000 }
              as: AccountManager
              captures: { eng_r: $.data.id }
            - call: "POST /grant-desk/engagements/${eng_r}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/time-entries"
              payload: { engagement_id: "${eng_h}", minutes: 90, period_yyyymm: "202603" }
              as: GrantWriter
            - call: "POST /grant-desk/time-entries"
              payload: { engagement_id: "${eng_h}", minutes: 30, period_yyyymm: "202603" }
              as: GrantWriter
            - call: "POST /grant-desk/time-entries"
              payload: { engagement_id: "${eng_r}", minutes: 90, period_yyyymm: "202603" }
              as: GrantWriter
            - call: "POST /grant-desk/time-entries"
              payload: { engagement_id: "${eng_r}", minutes: 30, period_yyyymm: "202603" }
              as: GrantWriter
          trigger:
            - call: "POST /grant-desk/invoices"
              payload: { engagement_id: "${eng_h}", period_start_yyyymm: "202603", period_end_yyyymm: "202603" }
              as: AccountManager
              captures: { inv_h: $.data.id }
            - call: "POST /grant-desk/invoices"
              payload: { engagement_id: "${eng_r}", period_start_yyyymm: "202603", period_end_yyyymm: "202603" }
              as: AccountManager
              captures: { inv_r: $.data.id }
          assert:
            - "Invoice.${inv_h}.total_cents == 30000"
            - "Invoice.${inv_r}.total_cents == 500000"
            - "Invoice.${inv_h}.total_cents != Invoice.${inv_r}.total_cents"
            - "Invoice.${inv_h}.line_count == 2"
            - "Invoice.${inv_r}.line_count == 0"

      - name: match_score_headroom_inclusion_set_diverges_on_client
        grounds:
          - calculations.match_score
          - entities.MatchAssessment.fields.score
          - entities.MatchAssessment.fields.status
          - entities.Client.fields.mission_areas
        distinguishing_aspect: |
          Domain = Client match scoring (different entity domain than instance #1 Engagement billing).
          The headroom component's inclusion set (count of the client's PURSUING MatchAssessments)
          makes the same Client+Opportunity pair score 100 when open_pursuits<3 but 90 once the
          client already has 4 PURSUING pursuits — two valid readings of "current pursuits" diverge.
        test_recipe:
          setup:
            - "Client with mission_areas=[EDUCATION,HEALTH], annual_budget_cents=5000000."
            - "Opportunity focus_areas=[EDUCATION,HEALTH], ceiling_amount_cents=5000000, min_org_budget_cents=1000000."
            - "Client already has 4 OTHER MatchAssessments moved to PURSUING (open_pursuits=4 at the moment the measured match is scored)."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Score Org", ein: "11-1110002", mission_areas: ["EDUCATION","HEALTH"], annual_budget_cents: 5000000, contact_email: "s@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "Fund A", title: "Ed+Health", focus_areas: ["EDUCATION","HEALTH"], ceiling_amount_cents: 5000000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z", min_org_budget_cents: 1000000 }
              as: AccountManager
              captures: { opp_a: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "Fund B", title: "Ed+Health B", focus_areas: ["EDUCATION","HEALTH"], ceiling_amount_cents: 5000000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z", min_org_budget_cents: 1000000 }
              as: AccountManager
              captures: { opp_b: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "Fund C", title: "Ed+Health C", focus_areas: ["EDUCATION","HEALTH"], ceiling_amount_cents: 5000000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z", min_org_budget_cents: 1000000 }
              as: AccountManager
              captures: { opp_c: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "Fund D", title: "Ed+Health D", focus_areas: ["EDUCATION","HEALTH"], ceiling_amount_cents: 5000000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z", min_org_budget_cents: 1000000 }
              as: AccountManager
              captures: { opp_d: $.data.id }
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp_a}" }
              as: AccountManager
              captures: { m_a: $.data.id }
            - call: "POST /grant-desk/matches/${m_a}/pursue"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp_b}" }
              as: AccountManager
              captures: { m_b: $.data.id }
            - call: "POST /grant-desk/matches/${m_b}/pursue"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp_c}" }
              as: AccountManager
              captures: { m_c: $.data.id }
            - call: "POST /grant-desk/matches/${m_c}/pursue"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp_d}" }
              as: AccountManager
              captures: { m_d: $.data.id }
            - call: "POST /grant-desk/matches/${m_d}/pursue"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "Fund Z", title: "Measured", focus_areas: ["EDUCATION","HEALTH"], ceiling_amount_cents: 5000000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z", min_org_budget_cents: 1000000 }
              as: AccountManager
              captures: { opp_z: $.data.id }
          trigger:
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp_z}" }
              as: AccountManager
              captures: { m_z: $.data.id }
          assert:
            - "MatchAssessment.${m_z}.score == 90"
            - "MatchAssessment.${m_z}.eligible == true"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: budget_total_round_per_indirect_line_then_sum_mode_b
        grounds:
          - calculations.budget_total
          - entities.BudgetLine.fields.category
          - entities.BudgetLine.fields.amount_cents
          - entities.BudgetLine.fields.indirect_rate_pct
          - entities.Proposal.fields.budget_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order is pinned — EQUIPMENT is EXCLUDED from the indirect
          base, INDIRECT lines floor( direct_base * rate/100 ) are computed BEFORE summing. With
          PERSONNEL=100000 + EQUIPMENT=100000 + INDIRECT@10%, the pinned order gives
          floor(100000*10/100)=10000 and budget_total=210000; summing equipment into the base
          would wrongly yield 220000. Distinct mode from instance #2 (mode (a) nested min/branch).
        test_recipe:
          setup:
            - "An ACTIVE engagement under an ACTIVE client; a PURSUING match; a DRAFTING proposal."
            - "Proposal has BudgetLines: PERSONNEL amount_cents=100000, EQUIPMENT amount_cents=100000, INDIRECT indirect_rate_pct=10."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Budget Org", ein: "11-1110003", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "b@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "Fund B2", title: "B2", focus_areas: ["EDUCATION"], ceiling_amount_cents: 9000000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z", min_org_budget_cents: 0 }
              as: AccountManager
              captures: { opp: $.data.id }
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp}" }
              as: GrantWriter
              captures: { match_id: $.data.id }
            - call: "POST /grant-desk/matches/${match_id}/pursue"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 12000 }
              as: AccountManager
              captures: { eng: $.data.id }
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/proposals"
              payload: { engagement_id: "${eng}", match_id: "${match_id}", requested_amount_cents: 210000 }
              as: GrantWriter
              captures: { prop: $.data.id }
            - call: "POST /grant-desk/budget-lines"
              payload: { proposal_id: "${prop}", category: "PERSONNEL", label: "Staff", amount_cents: 100000 }
              as: GrantWriter
            - call: "POST /grant-desk/budget-lines"
              payload: { proposal_id: "${prop}", category: "EQUIPMENT", label: "Server", amount_cents: 100000 }
              as: GrantWriter
          trigger:
            - call: "POST /grant-desk/budget-lines"
              payload: { proposal_id: "${prop}", category: "INDIRECT", label: "Overhead", indirect_rate_pct: 10 }
              as: GrantWriter
              captures: { indirect_line: $.data.id }
          assert:
            - "BudgetLine.${indirect_line}.amount_cents == 10000"
            - "Proposal.${prop}.budget_total_cents == 210000"

      - name: match_score_three_input_nonlinear_min_branch_mode_a
        grounds:
          - calculations.match_score
          - entities.Client.fields.annual_budget_cents
          - entities.FundingOpportunity.fields.ceiling_amount_cents
          - entities.FundingOpportunity.fields.focus_areas
          - entities.MatchAssessment.fields.eligible
        distinguishing_aspect: |
          Mode (a): a formula with ≥3 inputs (focus_component, budget_fit, headroom) and non-linear
          interaction — budget_fit uses min(1.0, budget/ceiling) and a hard eligibility branch gates
          the whole score to 0. With partial focus overlap 1/2, budget_fit=1.0, headroom=1.0 the
          weighted raw = 50*0.5+30*1.0+20*1.0 = 75. Distinct mode from instance #1's mode (b) rounding order.
        test_recipe:
          setup:
            - "Client mission_areas=[EDUCATION], annual_budget_cents=5000000."
            - "Opportunity focus_areas=[EDUCATION,HEALTH], ceiling_amount_cents=5000000, min_org_budget_cents=1000000; client has 0 PURSUING pursuits."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Partial Org", ein: "11-1110004", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "p@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "Fund P", title: "Partial Focus", focus_areas: ["EDUCATION","HEALTH"], ceiling_amount_cents: 5000000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z", min_org_budget_cents: 1000000 }
              as: AccountManager
              captures: { opp: $.data.id }
          trigger:
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp}" }
              as: AccountManager
              captures: { m: $.data.id }
          assert:
            - "MatchAssessment.${m}.score == 75"
            - "MatchAssessment.${m}.eligible == true"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: proposal_revision_cycle_in_review_back_to_drafting
        grounds:
          - state_machines.Proposal.IN_REVIEW_to_DRAFTING
          - state_machines.Proposal.DRAFTING_to_IN_REVIEW
          - entities.Proposal.fields.revision_round
          - entities.Proposal.fields.status
        distinguishing_aspect: |
          Non-linear shape = CYCLE on the Proposal entity: DRAFTING -> IN_REVIEW -> DRAFTING repeats,
          incrementing revision_round each loop (0 -> 1 -> 2), proving the back-edge exists rather
          than a pure A->B->C pipeline. Different entity than instance #2 (Deliverable parallel axes).
        test_recipe:
          setup:
            - "A DRAFTING proposal owned by an ACTIVE engagement/ACTIVE client, with one NARRATIVE deliverable and a non-zero budget so submit-for-review passes."
            - "A ClientContact whose X-User-ID is the owning client's id."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Cycle Org", ein: "11-1110005", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "c5@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "Fund C5", title: "C5", focus_areas: ["EDUCATION"], ceiling_amount_cents: 9000000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z", min_org_budget_cents: 0 }
              as: AccountManager
              captures: { opp: $.data.id }
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp}" }
              as: GrantWriter
              captures: { match_id: $.data.id }
            - call: "POST /grant-desk/matches/${match_id}/pursue"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 12000 }
              as: AccountManager
              captures: { eng: $.data.id }
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/proposals"
              payload: { engagement_id: "${eng}", match_id: "${match_id}", requested_amount_cents: 100000 }
              as: GrantWriter
              captures: { prop: $.data.id }
            - call: "POST /grant-desk/budget-lines"
              payload: { proposal_id: "${prop}", category: "PERSONNEL", label: "Staff", amount_cents: 100000 }
              as: GrantWriter
            - call: "POST /grant-desk/deliverables"
              payload: { proposal_id: "${prop}", kind: "NARRATIVE", title: "Narrative", body: "draft text" }
              as: GrantWriter
              captures: { deliv: $.data.id }
            - call: "POST /grant-desk/proposals/${prop}/submit-for-review"
              payload: {}
              as: GrantWriter
          trigger:
            - call: "POST /grant-desk/proposals/${prop}/request-changes"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /grant-desk/proposals/${prop}/submit-for-review"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/proposals/${prop}/request-changes"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
          assert:
            - "Proposal.${prop}.status == DRAFTING"
            - "Proposal.${prop}.revision_round == 2"

      - name: deliverable_parallel_content_and_approval_axes_evolve_independently
        grounds:
          - state_machines.Deliverable.content_status=OUTLINE_to_content_status=DRAFTED
          - state_machines.Deliverable.approval_status=UNREVIEWED_to_approval_status=APPROVED
          - entities.Deliverable.fields.content_status
          - entities.Deliverable.fields.approval_status
        distinguishing_aspect: |
          Non-linear shape = PARALLEL state dimensions on the Deliverable entity: content_status
          (OUTLINE->DRAFTED) advances via advance-content while approval_status (UNREVIEWED->APPROVED)
          advances independently via approve, so the combined state (DRAFTED, APPROVED) is reached by
          two independent edges. Different entity than instance #1 (Proposal cycle).
        test_recipe:
          setup:
            - "A DRAFTING proposal under ACTIVE engagement/ACTIVE client with a NARRATIVE deliverable whose body is non-empty (content can advance) and no open revisions (approval can advance)."
            - "ClientContact owns the proposal's client."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Parallel Org", ein: "11-1110006", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "c6@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "Fund C6", title: "C6", focus_areas: ["EDUCATION"], ceiling_amount_cents: 9000000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z", min_org_budget_cents: 0 }
              as: AccountManager
              captures: { opp: $.data.id }
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp}" }
              as: GrantWriter
              captures: { match_id: $.data.id }
            - call: "POST /grant-desk/matches/${match_id}/pursue"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 12000 }
              as: AccountManager
              captures: { eng: $.data.id }
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/proposals"
              payload: { engagement_id: "${eng}", match_id: "${match_id}", requested_amount_cents: 100000 }
              as: GrantWriter
              captures: { prop: $.data.id }
            - call: "POST /grant-desk/deliverables"
              payload: { proposal_id: "${prop}", kind: "NARRATIVE", title: "Narrative", body: "drafted body" }
              as: GrantWriter
              captures: { deliv: $.data.id }
          trigger:
            - call: "POST /grant-desk/deliverables/${deliv}/advance-content"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/deliverables/${deliv}/approve"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
          assert:
            - "Deliverable.${deliv}.content_status == DRAFTED"
            - "Deliverable.${deliv}.approval_status == APPROVED"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: submission_withdraw_cascades_proposal_then_client_counter_depth3
        grounds:
          - state_machines.Submission.FILED_to_WITHDRAWN
          - state_machines.Proposal.IN_REVIEW_to_WITHDRAWN
          - entities.Proposal.fields.status
          - entities.Client.fields.proposals_submitted_count
        distinguishing_aspect: |
          Depth-≥3 cascade triggered by submission withdraw: (A) Submission FILED->WITHDRAWN causes
          (B) its owning Proposal -> WITHDRAWN, and (B) in turn causes (C) Client.proposals_submitted_count
          recomputed downward (the proposal no longer counts as submitted). Each link is caused by the
          previous link. Different trigger than instance #2 (decision recorded).
        test_recipe:
          setup:
            - "A Submission in FILED status on a proposal owned by an ACTIVE client, with the opportunity still OPEN and clock < deadline; the client's proposals_submitted_count is 1 (this lone submission)."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Cascade Org", ein: "11-1110007", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "c7@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "Fund C7", title: "C7", focus_areas: ["EDUCATION"], ceiling_amount_cents: 9000000, floor_amount_cents: 0, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z", min_org_budget_cents: 0 }
              as: AccountManager
              captures: { opp: $.data.id }
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp}" }
              as: GrantWriter
              captures: { match_id: $.data.id }
            - call: "POST /grant-desk/matches/${match_id}/pursue"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 12000 }
              as: AccountManager
              captures: { eng: $.data.id }
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/proposals"
              payload: { engagement_id: "${eng}", match_id: "${match_id}", requested_amount_cents: 100000 }
              as: GrantWriter
              captures: { prop: $.data.id, prop_v0: $.data.version }
            - call: "POST /grant-desk/budget-lines"
              payload: { proposal_id: "${prop}", category: "PERSONNEL", label: "Staff", amount_cents: 100000 }
              as: GrantWriter
            - call: "POST /grant-desk/deliverables"
              payload: { proposal_id: "${prop}", kind: "NARRATIVE", title: "Narrative", body: "b" }
              as: GrantWriter
              captures: { deliv: $.data.id }
            - call: "POST /grant-desk/deliverables/${deliv}/approve"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /grant-desk/proposals/${prop}/submit-for-review"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/proposals/${prop}/approve"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "GET /grant-desk/proposals/${prop}"
              payload: {}
              as: GrantWriter
              captures: { prop_v_approved: $.data.version }
            - call: "POST /grant-desk/submissions"
              payload: { proposal_id: "${prop}", expected_proposal_version: "${prop_v_approved}" }
              as: GrantWriter
              captures: { sub: $.data.id }
          trigger:
