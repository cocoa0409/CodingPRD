      - name: corner_clock_and_complaint_error_codes
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CLOCK_MOVED_BACKWARD
          - errors.ERR_COMPLAINT_NOT_TRIAGEABLE
          - endpoints.POST_/srts/_clock/set_current_utc
        distinguishing_aspect: |
          The clock is monotonic but not strictly increasing: re-setting it to the value it
          already holds must return 200 with both sweep counters at 0, while any earlier
          instant is ERR_CLOCK_MOVED_BACKWARD (422) and must leave the clock where it was.
          Separately, triage is a one-shot transition out of RECEIVED: a second triage of a
          TRIAGED complaint is ERR_COMPLAINT_NOT_TRIAGEABLE (409) and must not overwrite
          the stored disposition or triaged_by_user_id.
        test_recipe:
          setup:
            - "One intersection with a single HIGH SPEEDING complaint already triaged REFER_TO_ENGINEERING by eng-1."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_id: $.data.id }
            - call: "POST /srts/intersections"
              payload: { school_id: "${school_id}", cross_streets: "Maple St & 3rd Ave", control_type: "UNCONTROLLED", speed_limit_mph: 30, lanes_crossed: 2, posted_school_zone: true }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { isx_id: $.data.id }
            - call: "POST /srts/intersections/${isx_id}/complaints"
              payload: { complaint_type: "SPEEDING", reporter_name: "Dana Whitfield", reporter_contact: "dana@example.org", occurred_at: "2026-09-14T14:50:00Z", narrative: "Vehicles routinely exceed the posted school-zone limit at dismissal.", severity_claim: "HIGH" }
              as: PublicReporter
              as_user_id: "pub-1"
              captures: { cmp_id: $.data.id }
            - call: "POST /srts/complaints/${cmp_id}/triage"
              payload: { disposition: "REFER_TO_ENGINEERING", triage_note: "Refer for engineering review." }
              as: TrafficEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /srts/complaints/${cmp_id}/triage"
              payload: { disposition: "CLOSE_NO_ACTION", triage_note: "Reversing the referral." }
              as: TrafficEngineer
              as_user_id: "eng-2"
            - call: "POST /srts/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-1"
            - call: "POST /srts/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-1"
            - call: "POST /srts/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-1"
          assert:
            - "trigger call 1 returns ERR_COMPLAINT_NOT_TRIAGEABLE with HTTP 409"
            - "Complaint.${cmp_id}.status == TRIAGED with disposition == REFER_TO_ENGINEERING and triaged_by_user_id == eng-1"
            - "Intersection.${isx_id}.open_complaint_count == 1 — the rejected CLOSE_NO_ACTION did not decrement it"
            - "trigger call 2 returns HTTP 200 with data.current_utc == 2026-09-01T00:00:00Z"
            - "trigger call 3 returns ERR_CLOCK_MOVED_BACKWARD with HTTP 422"
            - "trigger call 4 returns HTTP 200 with data.current_utc == 2026-09-01T00:00:00Z, activated_assignment_count 0 and ended_assignment_count 0"

      - name: corner_count_window_overlap_error_stub
        claim_type: error_triggerable
        grounds:
          - errors.ERR_COUNT_WINDOW_OVERLAP
        excluded_because:
          difficulty_instance: warrant_count_window_half_open_overlap_with_thirty_day_cooloff
          rationale: |
            The §1.8 resource temporal overlap instance triggers this code at the exact
            cool-off boundary (29 days rejected, 30 days accepted), which subsumes any
            plainer trigger.

      - name: corner_post_not_warranted_error_stub
        claim_type: error_triggerable
        grounds:
          - errors.ERR_POST_NOT_WARRANTED
        excluded_because:
          difficulty_instance: post_activation_gated_on_intersection_warrant_status
          rationale: |
            The §1.8 cross-entity state dependency instance triggers this code from a
            NOT_WARRANTED intersection and asserts it is not confused with
            ERR_POST_NOT_ACTIVATABLE or ERR_POST_SHIFT_NOT_PERMITTED.

      - name: corner_guard_not_certified_error_stub
        claim_type: error_triggerable
        grounds:
          - errors.ERR_GUARD_NOT_CERTIFIED
        excluded_because:
          difficulty_instance: assignment_creation_gated_on_guard_certification_state
          rationale: |
            The §1.8 cross-entity state dependency instance triggers this code for an
            IN_TRAINING guard and then shows the same request succeeding once the guard is
            CERTIFIED.

      - name: corner_guard_cert_expired_error_stub
        claim_type: error_triggerable
        grounds:
          - errors.ERR_GUARD_CERT_EXPIRED
        excluded_because:
          difficulty_instance: expiring_certification_beats_assignment_overlap_on_same_guard
          rationale: |
            The §1.8 priority-pair instance triggers this code on a window whose end_date
            falls one day past the certification expiry, while a competing overlap
            violation is also present.

      - name: corner_assignment_overlap_error_stub
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ASSIGNMENT_OVERLAP
        excluded_because:
          difficulty_instance: guard_assignment_closed_interval_overlap_and_shift_matrix
          rationale: |
            The §1.8 resource temporal overlap instance triggers this code across the full
            shift-conflict matrix and confirms the back-to-back window is accepted.

      - name: corner_route_publish_gate_error_stub
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ROUTE_CROSSING_NOT_WARRANTED
          - errors.ERR_ROUTE_SEGMENT_SCHOOL_MISMATCH
        excluded_because:
          difficulty_instance: unwarranted_crossing_beats_out_of_district_segment_at_publish
          rationale: |
            The §1.8 priority-pair instance triggers ERR_ROUTE_CROSSING_NOT_WARRANTED on a
            route that also violates the school-ownership rule, and then triggers
            ERR_ROUTE_SEGMENT_SCHOOL_MISMATCH once the warrant gate is satisfied.

      - name: corner_route_hazard_ceiling_error_stub
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ROUTE_HAZARD_SCORE_EXCEEDED
        excluded_because:
          difficulty_instance: route_hazard_score_exactly_at_publish_ceiling_publishes
          rationale: |
            The §1.8 boundary instance publishes at exactly 25.00 and triggers this code at
            28.00, covering both sides of the ceiling.

      - name: corner_project_not_scored_error_stub
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PROJECT_NOT_SCORED
        excluded_because:
          difficulty_instance: deferred_and_unaffordable_project_reports_state_error_not_fiscal_error
          rationale: |
            The §1.8 priority-pair instance triggers this code for a DEFERRED fund target
            and proves it wins over the fiscal error.

  - section: rbac
    instances:
      - name: corner_each_role_exercises_its_own_operations
        claim_type: permitted_operations
        grounds:
          - roles.ProgramAdmin.exclusive_operations
          - roles.TrafficEngineer.exclusive_operations
          - roles.CrossingSupervisor.exclusive_operations
          - roles.SchoolLiaison.shared_operations
          - roles.PublicReporter.shared_operations
        distinguishing_aspect: |
          The positive half of the RBAC matrix: one operation from every role's own column
          succeeds when the matching role calls it, so later denial instances cannot be
          passed by a blanket 403. ProgramAdmin creates a grant program, CrossingSupervisor
          staffs an ACTIVE post, TrafficEngineer triages a complaint, SchoolLiaison drafts a
          walking route under its own school identity, and PublicReporter files a complaint
          — five different roles, five different endpoints, all 200/201.
