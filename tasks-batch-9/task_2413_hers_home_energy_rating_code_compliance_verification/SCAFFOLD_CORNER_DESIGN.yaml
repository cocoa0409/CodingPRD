  - section: rbac
    instances:
      - name: builder_rep_cannot_certify_a_rater
        claim_type: Role exclusive operation
        grounds:
          - rbac.RatingProviderAdmin.exclusive_operations
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Rater certification is exclusive to RatingProviderAdmin: the identical payload is 403 ERR_FORBIDDEN_ROLE for a BuilderRep holding a valid X-User-ID and 201 for RatingProviderAdmin, so the refusal is role-driven and not payload-driven."
        test_recipe:
          setup:
            - "Builder Bristol Homes exists and its rep is a valid entity-backed user"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Bristol Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { z_b1: $.data.id }
          trigger:
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: BuilderRep
              as_user_id: "${z_b1}"
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { z_r1: $.data.id }
          assert:
            - "the first trigger returns HTTP status == 403 with error_id == ERR_FORBIDDEN_ROLE"
            - "the 403 body carries only error_id and message, with no data.id, so no Rater was allocated"
            - "the second trigger returns HTTP status == 201"
            - "Rater.${z_r1}.cert_level == RATER"
            - "Rater.${z_r1}.effective_certification_status == ACTIVE"
            - "Rater.${z_r1}.qa_failure_count == 0"

      - name: request_with_no_role_header_is_unauthenticated
        claim_type: Authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - rbac.identity
        distinguishing_aspect: "Priority 1 precedes every other check: the same well-formed builder payload is 401 ERR_UNAUTHENTICATED when X-User-Role is absent — never 403 or 422 — and is 201 once the header is supplied."
        test_recipe:
          setup:
            - "An empty system"
            - "The first trigger call is issued with neither an X-User-Role nor an X-User-ID header"
          setup_api_calls: []
          trigger:
            - call: "POST /builders"
              payload: { name: "Bristol Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: none
            - call: "POST /builders"
              payload: { name: "Bristol Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { z_b1b: $.data.id }
          assert:
            - "the first trigger returns HTTP status == 401 with error_id == ERR_UNAUTHENTICATED"
            - "the 401 body carries only error_id and message, with no data.id, so no Builder was allocated"
            - "the second trigger returns HTTP status == 201"
            - "Builder.${z_b1b}.status == ACTIVE"
            - "Builder.${z_b1b}.certified_incentive_cents == 0"

      - name: rep_of_another_builder_cannot_register_a_home
        claim_type: Role ownership
        grounds:
          - validations[priority=6]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - rbac.BuilderRep
        distinguishing_aspect: "Ownership is resolved through Home -> Subdivision -> builder_id: the rep of builder Cardinal Homes is refused with 403 ERR_NOT_RESOURCE_OWNER when registering a lot in Bristol Homes' subdivision, while Bristol's own rep succeeds on the identical payload."
        test_recipe:
          setup:
            - "Builders Bristol Homes and Cardinal Homes each exist; subdivision Foxglove with plan STD-2400 belongs to Bristol Homes"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Bristol Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { z_b2a: $.data.id }
            - call: "POST /builders"
              payload: { name: "Cardinal Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { z_b2b: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${z_b2a}", name: "Foxglove", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { z_sd2: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { z_r2: $.data.id }
            - call: "POST /plan-models"
              payload: { subdivision_id: "${z_sd2}", plan_code: "STD-2400", conditioned_floor_area_sqft: 2400, conditioned_volume_cuft: 21600, bedrooms: 4, envelope_ua_btu_per_hr_f: 320, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 9, pv_capacity_kw_dc: 0 }
              as: CertifiedRater
              as_user_id: "${z_r2}"
              captures: { z_pm2: $.data.id }
          trigger:
            - call: "POST /homes"
              payload: { subdivision_id: "${z_sd2}", plan_model_id: "${z_pm2}", lot_number: "L-7401", permit_date: "2026-08-05" }
              as: BuilderRep
              as_user_id: "${z_b2b}"
            - call: "POST /homes"
              payload: { subdivision_id: "${z_sd2}", plan_model_id: "${z_pm2}", lot_number: "L-7401", permit_date: "2026-08-05" }
              as: BuilderRep
              as_user_id: "${z_b2a}"
              captures: { z_h2: $.data.id }
          assert:
