      - The unparameterised page returns exactly 10 data rows — §1.0's declared limit default of 10 —
        with the tenth row present as ${default_tenth} and the first as ${default_first}
      - That page reports total_count == 12 and has_more == true, since offset 0 + limit 10 < 12
      - 'limit=100, the §1.0 declared max, is accepted: meta.api_request_id == ${max_req_id} is a fresh
        request id and the page returns all 12 rows, with the twelfth present as ${max_last}'
      - That page reports total_count == 12 and has_more == false, since offset 0 + limit 100 >= 12
      - 'limit=101 exceeds the declared max and is rejected: HTTP 400 with data.error_id == ${err_limit}
        == "ERR_INVALID_REQUEST", the priority-17 numeric-range rule'
      - offset defaults to 0 per §1.0, which is why the default page starts at ${default_first} rather
        than skipping rows
