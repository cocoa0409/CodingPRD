            - "At deadline exactly: filing succeeds (<= is inclusive); SARReport.${sar1}.status == FILED and filed_at == 2026-05-31T00:00:00Z"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: sar_create_gated_by_case_state
        grounds: [state_machines.Case.INVESTIGATING_to_SAR_IN_PROGRESS, "endpoints.POST /cases/{id}/sar-reports, entities.SARReport.fields.case_id"]
        distinguishing_aspect: "Entity pair SARReport<-Case: POST /cases/{id}/sar-reports is valid only while the Case is SAR_IN_PROGRESS; the same request against the same case one transition earlier (INVESTIGATING, decision NONE) is rejected with ERR_INVALID_STATE, and succeeds after the SAR_REQUIRED decision flips the case."
        test_recipe:
          setup:
            - "Case c1 for customer cu1, assigned and INVESTIGATING, no decision yet"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${c1}/start-investigation", as: BSAAnalyst, as_user_id: "${an1}", captures: { c1_v: $.data.version } }
          trigger:
            - { call: "POST /cases/${c1}/sar-reports", payload: { activity_start_date: "2026-03-10", activity_end_date: "2026-04-10" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { err: $.data.error_id } }
            - { call: "POST /cases/${c1}/sar-decision", payload: { decision: "SAR_REQUIRED", decision_rationale: "Unexplained structuring pattern", expected_case_version: "${c1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /cases/${c1}/sar-reports", payload: { activity_start_date: "2026-03-10", activity_end_date: "2026-04-10" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { sar1: $.data.id, sar1_status: $.data.status, sar1_deadline: $.data.deadline_at } }
          assert:
            - "First create (case INVESTIGATING): 409 ERR_INVALID_STATE — the SARReport transition is gated by the Case entity's state"
            - "After sar-decision SAR_REQUIRED (case SAR_IN_PROGRESS): create returns 201, SARReport.${sar1}.status == DRAFT"
            - "SARReport.${sar1}.deadline_at == 2026-05-31T00:00:00Z (case created at default clock 2026-05-01, no alerts, identified subject)"

      - name: threshold_activate_gated_by_scenario_state
        grounds: [state_machines.ScenarioThreshold.APPROVED_to_ACTIVE, state_machines.MonitoringScenario.ACTIVE_to_SUSPENDED, "errors[ERR_SCENARIO_NOT_ACTIVE]"]
        distinguishing_aspect: "A DIFFERENT entity pair, ScenarioThreshold<-MonitoringScenario: activating an APPROVED threshold version is rejected while its parent scenario is SUSPENDED, and succeeds once the scenario is resumed to ACTIVE — the child transition reads the parent's state."
        test_recipe:
          setup:
            - "Scenario sc1 ACTIVE with threshold th1 APPROVED (not yet ACTIVE); then sc1 suspended"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "VELOCITY-WIRE-1D", name: "Wire velocity 1d", applies_to_txn_types: ["WIRE_OUT"], direction_filter: "DEBIT" }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_v: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 5000000, lookback_days: 1, min_transaction_count: 5, weight_amount: 0.5, weight_velocity: 0.4, weight_geo: 0.1, effective_from: "2026-04-01T00:00:00Z", tuning_rationale: "Initial calibration", backtest_precision: 0.66, backtest_recall: 0.72 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th1: $.data.id } }
            - { call: "POST /threshold-versions/${th1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/suspend", as: BSAManager, as_user_id: "${mg1}", captures: { sc1_state: $.data.status } }
          trigger:
            - { call: "POST /threshold-versions/${th1}/activate", as: BSAManager, as_user_id: "${mg1}", captures: { err: $.data.error_id } }
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /threshold-versions/${th1}/activate", as: BSAManager, as_user_id: "${mg1}", captures: { th1_status: $.data.status } }
          assert:
            - "While scenario SUSPENDED: 409 ERR_SCENARIO_NOT_ACTIVE; threshold remains APPROVED"
            - "After scenario resumed to ACTIVE: threshold activation succeeds, ScenarioThreshold.${th1}.status == ACTIVE"
            - "GET /monitoring-scenarios/${sc1}: current_active_threshold_id == ${th1}"

  - rule_id: resource_temporal_overlap
    instances:
      - name: threshold_window_half_open_overlap
        grounds: ["validations[priority=10]", entities.ScenarioThreshold.fields.effective_from, entities.ScenarioThreshold.fields.effective_to, "errors[ERR_THRESHOLD_WINDOW_OVERLAP]"]
        distinguishing_aspect: "HALF-OPEN interval semantics on the ScenarioThreshold resource: pipeline versions [effective_from, effective_to) may touch (v4.effective_from == v2.effective_to is adjacency, allowed) but may not share any instant (v3 starting inside v2's window is rejected); the comparison uses an exclusive upper bound."
        test_recipe:
          setup:
            - "Scenario sc1 ACTIVE with v1 ACTIVE (effective_from 2026-04-01, open-ended)"
            - "v2 PROPOSED with window [2026-06-01, 2026-07-01)"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "STRUCT-CASH-7D", name: "Structuring cash 7d", applies_to_txn_types: ["CASH_DEPOSIT"], direction_filter: "CREDIT" }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_v: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 1000000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.5, weight_velocity: 0.3, weight_geo: 0.2, effective_from: "2026-04-01T00:00:00Z", tuning_rationale: "Initial calibration", backtest_precision: 0.7, backtest_recall: 0.6 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th1: $.data.id } }
            - { call: "POST /threshold-versions/${th1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /threshold-versions/${th1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "GET /monitoring-scenarios/${sc1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { sc1_v4: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v4}", threshold_amount_cents: 950000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.55, weight_velocity: 0.3, weight_geo: 0.15, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z", tuning_rationale: "Summer tuning experiment", backtest_precision: 0.78, backtest_recall: 0.63 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th2: $.data.id } }
            - { call: "GET /monitoring-scenarios/${sc1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { sc1_v5: $.data.version } }
          trigger:
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v5}", threshold_amount_cents: 900000, lookback_days: 7, min_transaction_count: 2, weight_amount: 0.6, weight_velocity: 0.3, weight_geo: 0.1, effective_from: "2026-06-15T00:00:00Z", tuning_rationale: "Overlapping proposal", backtest_precision: 0.7, backtest_recall: 0.7 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { err: $.data.error_id } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v5}", threshold_amount_cents: 900000, lookback_days: 7, min_transaction_count: 2, weight_amount: 0.6, weight_velocity: 0.3, weight_geo: 0.1, effective_from: "2026-07-01T00:00:00Z", tuning_rationale: "Adjacent proposal starting exactly at v2.effective_to", backtest_precision: 0.7, backtest_recall: 0.7 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th4: $.data.id } }
          assert:
            - "Overlapping proposal (2026-06-15 inside [2026-06-01, 2026-07-01)): 409 ERR_THRESHOLD_WINDOW_OVERLAP, no version created"
            - "Adjacent proposal (effective_from == v2.effective_to exactly): 201 created, ScenarioThreshold.${th4}.status == PROPOSED — half-open semantics treat touching windows as non-overlapping"
            - "Failed overlap proposal did not increment the scenario version (second proposal reused ${sc1_v5} successfully)"

      - name: sar_activity_window_closed_overlap
        grounds: ["validations[priority=11]", entities.SARReport.fields.activity_start_date, entities.SARReport.fields.activity_end_date, "errors[ERR_ACTIVITY_WINDOW_OVERLAP]"]
        distinguishing_aspect: "CLOSED-interval semantics on a DIFFERENT resource (SARReport activity windows, date granularity): sharing even a single calendar day with a FILED SAR of the same customer conflicts (continuing window starting 2026-04-10 == prior end 2026-04-10 is rejected), whereas the adjacent window starting 2026-04-11 (prior end + 1 day) is allowed — the opposite edge treatment from the half-open threshold windows."
        test_recipe:
          setup:
            - "SAR1 for customer cu1 FILED at 2026-05-05 with activity window [2026-03-10, 2026-04-10] (closed); its case QA-closed"
            - "Continuing review completed with FILE_CONTINUING_SAR producing continuing draft SAR2 (default window [2026-04-11, 2026-07-10]); SAR2 narrative amended to start 2026-04-10 (overlaps by one day), then submitted, QA-passed, approved"
            - "Clock at 2026-05-20T00:00:00Z — inside SAR2's deadline (2026-09-02), so ONLY the window overlap can fail"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Quinn QA", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { qa1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${c1}/start-investigation", as: BSAAnalyst, as_user_id: "${an1}", captures: { c1_v: $.data.version } }
            - { call: "POST /cases/${c1}/sar-decision", payload: { decision: "SAR_REQUIRED", decision_rationale: "Unexplained structuring pattern", expected_case_version: "${c1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /cases/${c1}/sar-reports", payload: { activity_start_date: "2026-03-10", activity_end_date: "2026-04-10" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { sar1: $.data.id, sar1_v: $.data.version } }
            - { call: "PUT /sar-reports/${sar1}/narrative", payload: { narrative: "Narrative: Between 2026-03-10 and 2026-04-10 the subject account received a pattern of cash deposits in amounts between 300000 and 500000 cents, each below the 1000000-cent reporting threshold, aggregating 1300000 cents across three branch and ATM visits within seven days. The customer could not explain the source of funds when contacted, the stated occupation is inconsistent with cash-intensive activity, and the deposits were followed by rapid transfers out of the account. This activity is consistent with structuring designed to evade currency transaction reporting requirements under 31 USC 5324 and is being reported as suspicious.", expected_sar_version: "${sar1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /sar-reports/${sar1}/submit-qa", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /sar-reports/${sar1}/qa-review", payload: { outcome: "PASS" }, as: QAReviewer, as_user_id: "${qa1}" }
            - { call: "POST /sar-reports/${sar1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /sar-reports/${sar1}/file", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${c1}/qa-review", payload: { outcome: "PASS" }, as: QAReviewer, as_user_id: "${qa1}" }
            - { call: "GET /sar-reports/${sar1}/continuing-reviews", as: BSAAnalyst, as_user_id: "${an1}", captures: { rev1: "$.data[0].id" } }
            - { call: "POST /continuing-reviews/${rev1}/start", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /continuing-reviews/${rev1}/complete", payload: { outcome: "FILE_CONTINUING_SAR" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { sar2: $.data.created_continuing_sar_id } }
            - { call: "GET /sar-reports/${sar2}", as: BSAAnalyst, as_user_id: "${an1}", captures: { sar2_v: $.data.version } }
            - { call: "PUT /sar-reports/${sar2}/narrative", payload: { narrative: "Narrative: Continuing activity review found that the structuring pattern reported in the initial SAR persisted into the next review period, with additional cash deposits below the reporting threshold aggregating 900000 cents. The window recorded here intentionally starts one day earlier than standard, on the final day of the previously reported period, to test closed-interval window enforcement. All other facts mirror the initial filing: same branches, same amounts, same unexplained source of funds, and the same rapid onward movement of funds within days of each deposit.", activity_start_date: "2026-04-10", expected_sar_version: "${sar2_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /sar-reports/${sar2}/submit-qa", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /sar-reports/${sar2}/qa-review", payload: { outcome: "PASS" }, as: QAReviewer, as_user_id: "${qa1}" }
            - { call: "POST /sar-reports/${sar2}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /sar-reports/${sar2}/file", as: BSAManager, as_user_id: "${mg1}", captures: { err: $.data.error_id } }
          assert:
            - "Filing SAR2 with activity_start_date == 2026-04-10 (== SAR1's inclusive end date) is rejected: 409 ERR_ACTIVITY_WINDOW_OVERLAP — closed intervals sharing one calendar day conflict"
            - "SARReport.${sar2}.status remains APPROVED; filed_at null"
            - "Contrast (proven in sar_file_risk_restriction_cascade): the adjacent window starting 2026-04-11 files successfully — adjacency at day granularity is permitted"

  - rule_id: compensating_invariant
    instances:
      - name: alert_dismiss_reopen_disposition_conservation
        grounds: [state_machines.Alert.UNDER_TRIAGE_to_DISMISSED, state_machines.Alert.DISMISSED_to_UNDER_TRIAGE]
        distinguishing_aspect: "Conserved quantity = per-scenario alert disposition histogram total: for any scenario, count(NEW)+count(UNDER_TRIAGE)+count(DISMISSED)+count(LINKED)+count(AUTO_CLOSED) == 3 (all generated alerts) at every step; the dismiss/reopen compensating pair moves one alert between buckets and nets to zero drift."
        test_recipe:
          setup:
            - "Scenario with 3 generated alerts al1, al2, al3 (one per account, each 3 x 400000 = 1200000 >= 1000000), all NEW; al1 triaged to UNDER_TRIAGE"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-7101" }, as: ComplianceAdmin, captures: { ac1: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-7102" }, as: ComplianceAdmin, captures: { ac2: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-7103" }, as: ComplianceAdmin, captures: { ac3: $.data.id } }
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "STRUCT-CASH-7D", name: "Structuring cash 7d", applies_to_txn_types: ["CASH_DEPOSIT"], direction_filter: "CREDIT" }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_v: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 1000000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.5, weight_velocity: 0.3, weight_geo: 0.2, effective_from: "2026-04-01T00:00:00Z", tuning_rationale: "Initial calibration", backtest_precision: 0.7, backtest_recall: 0.6 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th1: $.data.id } }
            - { call: "POST /threshold-versions/${th1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /threshold-versions/${th1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-28T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-29T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-30T10:00:00Z", channel: "ATM" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac2}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-28T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac2}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-29T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac2}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-30T10:00:00Z", channel: "ATM" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac3}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-28T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac3}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-29T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac3}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-30T10:00:00Z", channel: "ATM" }, as: ComplianceAdmin }
            - { call: "POST /monitoring-scenarios/${sc1}/evaluate", payload: { account_id: "${ac1}", evaluated_at: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin, captures: { al1: $.data.alert_id } }
            - { call: "POST /monitoring-scenarios/${sc1}/evaluate", payload: { account_id: "${ac2}", evaluated_at: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin, captures: { al2: $.data.alert_id } }
            - { call: "POST /monitoring-scenarios/${sc1}/evaluate", payload: { account_id: "${ac3}", evaluated_at: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin, captures: { al3: $.data.alert_id } }
            - { call: "POST /alerts/${al1}/triage", as: BSAAnalyst, as_user_id: "${an1}" }
          trigger:
            - { call: "POST /alerts/${al1}/dismiss", payload: { dismissal_rationale: "Matches known payroll pattern" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { al1_mid: $.data.status } }
            - { call: "GET /alerts/${al2}", as: BSAAnalyst, as_user_id: "${an1}", captures: { al2_mid: $.data.status } }
            - { call: "GET /alerts/${al3}", as: BSAAnalyst, as_user_id: "${an1}", captures: { al3_mid: $.data.status } }
            - { call: "POST /alerts/${al1}/reopen", as: BSAAnalyst, as_user_id: "${an1}", captures: { al1_end: $.data.status, al1_dismissed_at: $.data.dismissed_at } }
          assert:
            - "After dismiss: al1 == DISMISSED, al2 == NEW, al3 == NEW — histogram (NEW 2, UNDER_TRIAGE 0, DISMISSED 1) sums to 3"
            - "After reopen (compensation): al1 == UNDER_TRIAGE with dismissed_at == null and dismissal_rationale == null — histogram (NEW 2, UNDER_TRIAGE 1, DISMISSED 0) again sums to 3"
            - "No alert was created or destroyed by the pair: exactly 3 alerts exist for scenario ${sc1} throughout (conserved total)"

      - name: analyst_assignment_workload_conservation
        grounds: [state_machines.Case.OPEN_to_ASSIGNED, state_machines.Case.ASSIGNED_to_ASSIGNED, state_machines.Case.PENDING_QA_to_CLOSED, entities.Analyst.fields.assigned_open_cases]
        distinguishing_aspect: "A DIFFERENT conserved quantity — total assigned open cases across all analysts: sum over Analyst.assigned_open_cases == count(Case with assigned_analyst_id set AND status != CLOSED); a reassignment moves one unit between analysts (A-1, B+1, sum invariant), and a case close decrements the total by exactly 1."
        test_recipe:
          setup:
            - "Analysts A and B (capacity 5 each); cases k1 and k2 both assigned to A"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 5 }, as: ComplianceAdmin, captures: { anA: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Bob Backup", capacity_max_cases: 5 }, as: ComplianceAdmin, captures: { anB: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Quinn QA", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { qa1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${anA}", captures: { k1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${anA}", captures: { k2: $.data.id } }
            - { call: "POST /cases/${k1}/assign", payload: { analyst_id: "${anA}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${k2}/assign", payload: { analyst_id: "${anA}" }, as: BSAManager, as_user_id: "${mg1}" }
          trigger:
            - { call: "GET /analysts/${anA}", as: BSAManager, as_user_id: "${mg1}", captures: { a_mid1: $.data.assigned_open_cases } }
            - { call: "POST /cases/${k1}/assign", payload: { analyst_id: "${anB}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "GET /analysts/${anA}", as: BSAManager, as_user_id: "${mg1}", captures: { a_mid2: $.data.assigned_open_cases } }
            - { call: "GET /analysts/${anB}", as: BSAManager, as_user_id: "${mg1}", captures: { b_mid2: $.data.assigned_open_cases } }
            - { call: "POST /cases/${k2}/start-investigation", as: BSAAnalyst, as_user_id: "${anA}", captures: { k2_v: $.data.version } }
            - { call: "POST /cases/${k2}/sar-decision", payload: { decision: "NO_SAR", decision_rationale: "Documented legitimate activity", expected_case_version: "${k2_v}" }, as: BSAAnalyst, as_user_id: "${anA}" }
            - { call: "POST /cases/${k2}/qa-review", payload: { outcome: "PASS" }, as: QAReviewer, as_user_id: "${qa1}" }
            - { call: "GET /analysts/${anA}", as: BSAManager, as_user_id: "${mg1}", captures: { a_end: $.data.assigned_open_cases } }
            - { call: "GET /analysts/${anB}", as: BSAManager, as_user_id: "${mg1}", captures: { b_end: $.data.assigned_open_cases } }
          assert:
            - "After two assigns to A: A.assigned_open_cases == 2 (sum across analysts == 2 == open assigned cases)"
            - "After reassigning k1 to B: A == 1 and B == 1 — the reassignment conserves the total (still 2), it only moves the unit"
            - "After k2 closes: A == 0 and B == 1 — total 1 == the single remaining open assigned case k1"
            - "Case.${k2}.status == CLOSED with closed_reason == NO_SAR_CONFIRMED"
