      - name: complaint_closed_is_terminal_against_every_remaining_trigger
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Complaint.terminal_states
          - errors.ERR_COMPLAINT_STATE_INVALID
        distinguishing_aspect: "CLOSED is the single terminal state of a fork-join machine, so it must reject all four remaining triggers including a repeat close; and because the complaint was non-reportable, closure was legal with reported_at still null, which is the case an over-eager ERR_MALFUNCTION_REPORT_PENDING guard breaks."
        test_recipe:
          setup:
            - "Clock at 2026-09-05T00:00:00Z. One PLANNED ReagentLot SM-LOT-11 of IVD-SM-11 (never released, so released_by_user_id is null and the segregation rule cannot bite)."
