              captures: { ap1_v1: $.data.version }
            - call: "POST /appraisal-desk/appraisals/${ap1_id}/run-rule-checks"
              payload: { expected_appraisal_version: "${ap1_v1}" }
              as: AppraisalDeskReviewer
