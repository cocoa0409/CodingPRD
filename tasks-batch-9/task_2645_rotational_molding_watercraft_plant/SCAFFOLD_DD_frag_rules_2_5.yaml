            - "the second seal returns 200, Shipment.${shp}.status is \"SEALED\" again and sealed_at == \"2026-08-01T15:00:00Z\" — the SAME state is re-entered with a DIFFERENT stamp"
            - "Shipment.${shp}.quoted_freight_cents == 29657 on the second seal: per-line 14640 + 7320 + 7320 == 29280 (each line's chargeable_kg is max(unit_weight_kg 24.000, round(nested_cube * 120.000, 3)), so 240.000 * 61 and 120.000 * 61), then the 75.00 discount tier at 7.50 percent gives round_half_up(29280 * 7.50 / 100) == 2196, after_discount 27084, fuel round_half_up(27084 * 9.50 / 100) == 2573, total 27084 + 2573"
            - "29657 is NOT 23325 (the pre-unseal quote is not restored), NOT 23325 + 7320 == 30645 (the quote is not incrementally patched), and NOT 30645 - round_half_up(30645 * 7.50 / 100) == 28347 — the whole quote is recomputed from scratch over the new line set with a re-selected tier"
            - "the tier re-selection is the load-bearing consequence of the revert: utilization moved 60.00 -> 80.00, so the row chosen changed from {min_utilization_pct 60.00, rate_pct 3.00} to {min_utilization_pct 75.00, rate_pct 7.50}, and holding the first tier would have produced 29280 - 878 + 2698 == 31100 instead"

  # ===========================================================================
  # RULE 4 — transitive_cascade
  # One chain of depth 5 (CASCADE-B, triggered by COOLING -> DEMOLDED) and one
  # of depth 3 (CASCADE-D, triggered by SELLABLE -> REWORK): different
  # triggering transitions, and every `assert:` pins the TERMINAL effect.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: demold_service_cascade_unblocks_three_resin_blocked_orders
        grounds:
          - state_machines.MoldingCycle.COOLING_to_DEMOLDED
          - state_machines.Mold.AVAILABLE_to_MAINTENANCE
          - state_machines.MoldingCycle.SCHEDULED_to_ABORTED
          - state_machines.ResinCharge.RESERVED_to_RELEASED
          - state_machines.ResinLot.DEPLETED_to_AVAILABLE
          - state_machines.ProductionOrder.BLOCKED_RESIN_to_READY_TO_SCHEDULE
          - calculations.mold_service_counter
          - calculations.qualified_resin_lot_count
          - calculations.mold_selection
        distinguishing_aspect: |
          Depth 5, and the triggering transition is MoldingCycle
