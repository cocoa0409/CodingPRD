  # ===========================================================================
  # Rule 9 — compensating_invariant (3 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: stock_conservation_reserve_release
        grounds:
          - calculations.stock_reservation_waterfall
          - state_machines.Order.OPEN_to_CANCELLED
          - entities.StockLot.fields.on_hand_qty
          - entities.StockLot.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity: per StockLot, on_hand_qty + reserved_qty ==
          received_qty across the reserve/release pair. Accept moves 400 units
          on_hand -> reserved (sum unchanged); cancel releases exactly those
          400 back (sum AND both fields restored to pre-accept values) — a
          cancel that drifts by even one unit fails.
        test_recipe:
          setup:
            - "WATER lot received 10,000; order for 400 accepted then cancelled; capture lot fields before and after each step"
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent Chi", settlement_currency: USD, credit_limit_cents: 5000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agent22: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "WATER-22", name: "Water 1L", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 120, duty_rate_pct: 0 }
              as: ChandlerOpsManager
              captures: { water22: $.data.id }
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${water22}", lot_code: "DS-W22", storage_tier: DRY_STORE, received_qty: 10000, capacity_qty: 0 }
              as: WarehouseSupervisor
              captures: { lot22: $.data.id }
            - call: "POST /chandlery/vessel-calls"
              payload: { vessel_name: "MV Chloe", imo_number: "9074752", agent_id: "${agent22}", port_code: "SGSIN", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-14T12:00:00Z", foreign_going: false }
              as: ChandlerOpsManager
              captures: { vc22: $.data.id }
            - call: "POST /chandlery/vessel-calls/${vc22}/requisitions"
              payload: { title: "Water", lines: [{ catalog_item_id: "${water22}", requested_qty: 400, allows_substitution: false }] }
              as: VesselCateringOfficer
              as_user_id: "${vc22}"
              captures: { req22: $.data.id }
            - call: "POST /chandlery/requisitions/${req22}/submit"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vc22}"
            - call: "POST /chandlery/requisitions/${req22}/quotations"
              payload: { lines: [{ catalog_item_id: "${water22}", qty: 400, unit_price_cents: 120, is_substitution: false }], valid_until: "2026-08-12T00:00:00Z" }
              as: ChandlerSalesRep
              captures: { quo22: $.data.id }
            - call: "POST /chandlery/quotations/${quo22}/send"
              payload: {}
              as: ChandlerSalesRep
            - call: "POST /chandlery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ChandlerOpsManager
            - call: "POST /chandlery/vessel-calls/${vc22}/arrive"
              payload: {}
              as: ChandlerOpsManager
            - call: "POST /chandlery/quotations/${quo22}/accept"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vc22}"
              captures: { ord22: $.data.id }
            - call: "GET /chandlery/stock-lots/${lot22}"
              payload: {}
              as: WarehouseSupervisor
              captures: { lot22_oh_after_accept: $.data.on_hand_qty, lot22_res_after_accept: $.data.reserved_qty }
          trigger:
            - call: "POST /chandlery/orders/${ord22}/cancel"
              payload: {}
              as: ChandlerOpsManager
            - call: "GET /chandlery/stock-lots/${lot22}"
              payload: {}
              as: WarehouseSupervisor
          assert:
            - "after accept: on_hand_qty == 9600 AND reserved_qty == 400 AND on_hand_qty + reserved_qty == 10000 (conservation across the forward action)"
            - "after cancel: on_hand_qty == 10000 AND reserved_qty == 0 (compensating action restores both fields exactly; invariant on_hand + reserved == received_qty holds at every step)"

      - name: invoice_money_conservation_credit_cycle
        grounds:
          - calculations.credit_note_amount
          - state_machines.Invoice
          - state_machines.CreditNote.APPLIED_to_REVOKED
          - entities.Invoice.fields.outstanding_cents
        distinguishing_aspect: |
          Conserved quantity: money on the Invoice — paid + credited + writeoff
          + outstanding == total_cents at every step of the credit apply/revoke
          pair. Different conserved quantity than stock units (Rule-9 instance
          1) and than risk exposure (instance 3).
        test_recipe:
          setup:
