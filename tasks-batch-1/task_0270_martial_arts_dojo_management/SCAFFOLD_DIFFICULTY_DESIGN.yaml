scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: buyout_provisional_live_vs_final_pinned_discount
        grounds:
          - calculations.early_termination_buyout
          - calculations.family_discount_tier
          - entities.Contract.fields.locked_family_discount_pct
          - state_machines.Contract.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          The provisional buyout quote (GET buyout-quote) uses the family's LIVE discount tier while
          the final BUYOUT invoice at terminate uses Contract.locked_family_discount_pct pinned at
          signing — same contract, two algorithms, different cents (28800 vs 32400).
        test_recipe:
          setup:
            - "A 2-member family (discount tier 0.10) signs a 6-month contract at base 12000; locked_family_discount_pct pinned to 0.10."
            - "A second sibling is added so the live family tier rises to 0.20 (4 active members), but the contract's pinned discount stays 0.10."
            - "Clock at 2026-01-01; contract has months_billed=0."
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/programs"
              payload: { name: "Adult BJJ", discipline: "BJJ", base_monthly_tuition_cents: 12000, test_fee_cents: 5000, min_attendance_for_test: 10, min_days_in_rank: 30 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/families"
              payload: { surname: "Sato", billing_email: "sato@x.com" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /dojo/members"
              payload: { full_name: "Aki Sato", email: "aki@x.com", date_of_birth: "1990-06-01", family_id: "${fam_id}", waiver_signed: true }
              as: FrontDesk
              captures: { m1_id: $.data.id, m1_v: $.data.version }
            - call: "POST /dojo/members"
              payload: { full_name: "Beni Sato", email: "beni@x.com", date_of_birth: "1992-06-01", family_id: "${fam_id}", waiver_signed: true }
              as: FrontDesk
            - call: "POST /dojo/contracts"
              payload: { member_id: "${m1_id}", program_id: "${prog_id}", term_months: 6, billing_anchor_day: 1, expected_member_version: "${m1_v}" }
              as: FrontDesk
              captures: { ctr_id: $.data.id, ctr_v: $.data.version }
            - call: "POST /dojo/members"
              payload: { full_name: "Ceni Sato", email: "ceni@x.com", date_of_birth: "1994-06-01", family_id: "${fam_id}", waiver_signed: true }
              as: FrontDesk
            - call: "POST /dojo/members"
              payload: { full_name: "Deni Sato", email: "deni@x.com", date_of_birth: "1996-06-01", family_id: "${fam_id}", waiver_signed: true }
              as: FrontDesk
          trigger:
            - call: "GET /dojo/contracts/${ctr_id}/buyout-quote"
              payload: {}
              as: FrontDesk
              captures: { quote: $.data }
            - call: "POST /dojo/contracts/${ctr_id}/terminate"
              payload: { expected_contract_version: "${ctr_v}" }
              as: FrontDesk
              captures: { final_ctr: $.data }
          assert:
            - "GET buyout-quote provisional_buyout_cents == 28800 (live 0.20 discount: monthly 9600, 6 months, 0.5 rate)"
            - "GET buyout-quote live_discount_pct == 0.20"
            - "The BUYOUT Invoice generated at terminate has amount_due_cents == 32400 (pinned 0.10 discount: monthly 10800, 6 months, 0.5 rate)"
            - "Contract.${ctr_id}.status == TERMINATED"

      - name: family_tier_live_recompute_vs_contract_pinned
        grounds:
          - calculations.family_discount_tier
          - entities.Family.fields.active_member_count
          - entities.Contract.fields.locked_family_discount_pct
          - state_machines.Member.ACTIVE_to_WITHDRAWN
        distinguishing_aspect: |
          Family.active_member_count and its derived live tier recompute when a member withdraws
          (3 active -> 2 active, live tier 0.15 -> 0.10), but a Contract signed at the 3-member tier
          keeps locked_family_discount_pct == 0.15 — distinct subjects (Family roster vs Contract pin).
        test_recipe:
          setup:
            - "A 3-member family (live tier 0.15). One member signs a contract, pinning 0.15."
            - "One OTHER member is withdrawn, dropping the live family tier to 0.10 (2 active)."
          setup_api_calls:
            - call: "POST /dojo/programs"
              payload: { name: "Karate", discipline: "KARATE", base_monthly_tuition_cents: 10000, test_fee_cents: 4000, min_attendance_for_test: 8, min_days_in_rank: 20 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/families"
              payload: { surname: "Kim", billing_email: "kim@x.com" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /dojo/members"
              payload: { full_name: "Kim One", email: "k1@x.com", date_of_birth: "1985-01-01", family_id: "${fam_id}", waiver_signed: true }
              as: FrontDesk
              captures: { m1_id: $.data.id, m1_v: $.data.version }
            - call: "POST /dojo/members"
              payload: { full_name: "Kim Two", email: "k2@x.com", date_of_birth: "1987-01-01", family_id: "${fam_id}", waiver_signed: true }
              as: FrontDesk
              captures: { m2_id: $.data.id, m2_v: $.data.version }
            - call: "POST /dojo/members"
              payload: { full_name: "Kim Three", email: "k3@x.com", date_of_birth: "1989-01-01", family_id: "${fam_id}", waiver_signed: true }
              as: FrontDesk
            - call: "POST /dojo/contracts"
              payload: { member_id: "${m1_id}", program_id: "${prog_id}", term_months: 12, billing_anchor_day: 1, expected_member_version: "${m1_v}" }
              as: FrontDesk
              captures: { ctr_id: $.data.id }
          trigger:
            - call: "POST /dojo/members/${m2_id}/withdraw"
              payload: { expected_member_version: "${m2_v}" }
              as: FrontDesk
            - call: "GET /dojo/families/${fam_id}"
              payload: {}
              as: FrontDesk
              captures: { fam: $.data }
            - call: "GET /dojo/contracts/${ctr_id}"
              payload: {}
              as: FrontDesk
              captures: { ctr: $.data }
          assert:
            - "Family.${fam_id}.active_member_count == 2 after the withdraw"
            - "Contract.${ctr_id}.locked_family_discount_pct == 0.15 (unchanged by the roster drop)"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pro_shop_round_per_line_then_sum
        grounds:
          - calculations.pro_shop_pricing
          - entities.ProShopOrder.fields.net_cents
          - entities.ProShopOrder.fields.gross_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: two 105-cent lines at 0.10 round-per-line
          (rhu(10.5)=11 each) then sum -> net 188, whereas sum-then-round would give 189. The
          scaffold pins round-per-line-then-sum, so net MUST equal 188.
        test_recipe:
          setup:
            - "A white-belt member (no ACTIVE enrollment -> member_pct 0.00... wait, need 0.10 tier)."
            - "Member holds an ACTIVE enrollment at a rank_order==2 belt so member_pct == 0.10."
            - "Order two line items of unit_price_cents 105, qty 1 each."
          setup_api_calls:
            - call: "POST /dojo/programs"
              payload: { name: "Judo", discipline: "JUDO", base_monthly_tuition_cents: 9000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "WHITE", rank_order: 0, next_rank_code: "YELLOW", is_entry_rank: true }
              as: FrontDesk
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "YELLOW", rank_order: 1, next_rank_code: "GREEN" }
              as: FrontDesk
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "GREEN", rank_order: 2, next_rank_code: "BROWN", requires_chief_signoff: false }
              as: FrontDesk
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "BROWN", rank_order: 3, next_rank_code: null }
              as: FrontDesk
            - call: "POST /dojo/members"
              payload: { full_name: "Pat Shop", email: "pat@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /dojo/enrollments"
              payload: { member_id: "${m_id}", program_id: "${prog_id}", expected_member_version: "${m_v}" }
              as: FrontDesk
              captures: { enr_id: $.data.id }
            - call: "POST /dojo/instructors"
              payload: { full_name: "Sensei A", email: "sa@x.com", rank_level: "INSTRUCTOR" }
              as: FrontDesk
              captures: { ins_id: $.data.id }
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/promotion-tests"
              payload: { enrollment_id: "${enr_id}", examiner_instructor_id: "${ins_id}", scheduled_for: "2026-02-02T00:00:00Z" }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /dojo/promotion-tests/${t1_id}/grade"
              payload: { score: 90 }
              as: Instructor
              as_user_id: "${ins_id}"
            - call: "POST /dojo/promotion-tests"
              payload: { enrollment_id: "${enr_id}", examiner_instructor_id: "${ins_id}", scheduled_for: "2026-02-03T00:00:00Z" }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /dojo/promotion-tests/${t2_id}/grade"
              payload: { score: 90 }
              as: Instructor
              as_user_id: "${ins_id}"
          trigger:
            - call: "POST /dojo/pro-shop-orders"
              payload: { member_id: "${m_id}", line_items: [{ sku: "PATCH", unit_price_cents: 105, qty: 1 }, { sku: "STRIPE", unit_price_cents: 105, qty: 1 }] }
              as: Member
              as_user_id: "${m_id}"
              captures: { order: $.data }
          assert:
            - "ProShopOrder gross_cents == 210"
            - "ProShopOrder net_cents == 188 (round-per-line: each line 105 - rhu(10.5)=94, summed)"
            - "net_cents != 189 (the sum-then-round result is explicitly NOT used)"

      - name: buyout_evaluation_order_monthly_then_cap
        grounds:
          - calculations.early_termination_buyout
          - calculations.recurring_tuition_charge
          - entities.Contract.fields.term_months
          - state_machines.Contract.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          Mode (c) circular-looking evaluation order: buyout needs monthly, monthly needs the pinned
          discount, and the BUYOUT_CAP applies LAST. With base 12000, pinned 0.10, term 12, billed 2,
          raw = rhu(10*10800*0.5) = 54000 then capped to 50000 — the cap is applied after, not before.
        test_recipe:
          setup:
            - "Solo member (no family, pinned discount 0.00... need 0.10). Use a 2-member family to pin 0.10."
            - "12-month contract base 12000, run billing twice so months_billed==2, then terminate."
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/programs"
              payload: { name: "Muay Thai", discipline: "MUAY_THAI", base_monthly_tuition_cents: 12000, test_fee_cents: 5000, min_attendance_for_test: 10, min_days_in_rank: 30 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/families"
              payload: { surname: "Wu", billing_email: "wu@x.com" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /dojo/members"
              payload: { full_name: "Wu A", email: "wua@x.com", date_of_birth: "1990-01-01", family_id: "${fam_id}", waiver_signed: true }
              as: FrontDesk
              captures: { m1_id: $.data.id, m1_v: $.data.version }
            - call: "POST /dojo/members"
              payload: { full_name: "Wu B", email: "wub@x.com", date_of_birth: "1992-01-01", family_id: "${fam_id}", waiver_signed: true }
              as: FrontDesk
            - call: "POST /dojo/contracts"
              payload: { member_id: "${m1_id}", program_id: "${prog_id}", term_months: 12, billing_anchor_day: 1, expected_member_version: "${m1_v}" }
              as: FrontDesk
              captures: { ctr_id: $.data.id, ctr_v: $.data.version }
            - call: "POST /dojo/contracts/${ctr_id}/run-billing"
              payload: {}
              as: FrontDesk
            - call: "POST /dojo/contracts/${ctr_id}/run-billing"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /dojo/contracts/${ctr_id}/terminate"
              payload: { expected_contract_version: "${ctr_v}" }
              as: FrontDesk
              captures: { ctr: $.data }
            - call: "GET /dojo/invoices?member_id=${m1_id}&kind=BUYOUT"
              payload: {}
              as: FrontDesk
              captures: { buyout_list: $.data }
          assert:
            - "Contract.${ctr_id}.months_billed == 2 before terminate"
            - "The BUYOUT Invoice amount_due_cents == 50000 (raw 54000 capped to 50000; cap applied after the rate multiply)"

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: promotion_test_fork_join_pass_fail_signoff
        grounds:
          - state_machines.PromotionTest.SCHEDULED_to_PASSED
          - state_machines.PromotionTest.SCHEDULED_to_PASSED_PENDING_SIGNOFF
          - state_machines.PromotionTest.SCHEDULED_to_FAILED
          - state_machines.PromotionTest.PASSED_PENDING_SIGNOFF_to_PASSED
        distinguishing_aspect: |
          PromotionTest is branching fork-join on the PromotionTest entity: SCHEDULED forks to PASSED,
          PASSED_PENDING_SIGNOFF, or FAILED with divergent side-effects (immediate promote vs deferred
          vs none), and PASSED_PENDING_SIGNOFF rejoins PASSED only via chief signoff.
        test_recipe:
          setup:
            - "Program with a chief-signoff rank (BLUE) as the next rank after WHITE; member enrolled, eligible."
            - "Member has rank_attendance_count >= min and days-in-rank >= min."
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/programs"
              payload: { name: "TKD", discipline: "TAEKWONDO", base_monthly_tuition_cents: 9000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "WHITE", rank_order: 0, next_rank_code: "BLUE", is_entry_rank: true }
              as: FrontDesk
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "BLUE", rank_order: 1, next_rank_code: null, requires_chief_signoff: true }
              as: FrontDesk
            - call: "POST /dojo/members"
              payload: { full_name: "Forky", email: "forky@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /dojo/enrollments"
              payload: { member_id: "${m_id}", program_id: "${prog_id}", expected_member_version: "${m_v}" }
              as: FrontDesk
              captures: { enr_id: $.data.id }
            - call: "POST /dojo/instructors"
              payload: { full_name: "InsT", email: "inst@x.com", rank_level: "INSTRUCTOR" }
              as: FrontDesk
              captures: { ins_id: $.data.id }
            - call: "POST /dojo/instructors"
              payload: { full_name: "Chief", email: "chief@x.com", rank_level: "CHIEF_INSTRUCTOR" }
              as: FrontDesk
              captures: { chief_id: $.data.id }
            - call: "POST /dojo/promotion-tests"
              payload: { enrollment_id: "${enr_id}", examiner_instructor_id: "${ins_id}", scheduled_for: "2026-01-02T00:00:00Z" }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { test_id: $.data.id }
          trigger:
            - call: "POST /dojo/promotion-tests/${test_id}/grade"
              payload: { score: 88 }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { graded: $.data }
            - call: "POST /dojo/promotion-tests/${test_id}/signoff"
              payload: {}
              as: ChiefInstructor
              as_user_id: "${chief_id}"
              captures: { signed: $.data }
          assert:
            - "After grade (score 88 >= PASS_SCORE 70, BLUE requires_chief_signoff) PromotionTest.status == PASSED_PENDING_SIGNOFF"
            - "Enrollment.${enr_id}.current_rank_code == WHITE immediately after grade (promotion deferred)"
            - "After signoff PromotionTest.status == PASSED and chief_signoff_instructor_id == ${chief_id}"
            - "After signoff Enrollment.${enr_id}.current_rank_code == BLUE and status == COMPLETED (BLUE is terminal)"

      - name: contract_cyclic_billing_loop
        grounds:
          - state_machines.Contract.ACTIVE_to_ACTIVE
          - state_machines.Contract.ACTIVE_to_FULFILLED
          - entities.Contract.fields.months_billed
        distinguishing_aspect: |
          Contract is a cyclic state machine on the Contract entity: ACTIVE_to_ACTIVE self-loops on
          each run-billing (months_billed increments, status stays ACTIVE) until the final term month
          flips it to FULFILLED — a loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Solo-equivalent member (2-member family, pinned 0.10), 3-month contract base 10000."
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/programs"
              payload: { name: "Loop BJJ", discipline: "BJJ", base_monthly_tuition_cents: 10000, test_fee_cents: 3000, min_attendance_for_test: 10, min_days_in_rank: 30 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/families"
              payload: { surname: "Loop", billing_email: "loop@x.com" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /dojo/members"
              payload: { full_name: "Loop A", email: "la@x.com", date_of_birth: "1990-01-01", family_id: "${fam_id}", waiver_signed: true }
              as: FrontDesk
              captures: { m1_id: $.data.id, m1_v: $.data.version }
            - call: "POST /dojo/members"
              payload: { full_name: "Loop B", email: "lb@x.com", date_of_birth: "1992-01-01", family_id: "${fam_id}", waiver_signed: true }
              as: FrontDesk
            - call: "POST /dojo/contracts"
              payload: { member_id: "${m1_id}", program_id: "${prog_id}", term_months: 3, billing_anchor_day: 1, expected_member_version: "${m1_v}" }
              as: FrontDesk
              captures: { ctr_id: $.data.id }
            - call: "POST /dojo/contracts/${ctr_id}/run-billing"
              payload: {}
              as: FrontDesk
            - call: "POST /dojo/contracts/${ctr_id}/run-billing"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /dojo/contracts/${ctr_id}/run-billing"
              payload: {}
              as: FrontDesk
              captures: { ctr: $.data }
          assert:
            - "After two run-billing calls Contract.${ctr_id}.status == ACTIVE and months_billed == 2 (self-loop)"
            - "After the third run-billing Contract.${ctr_id}.status == FULFILLED and months_billed == 3"
            - "Each TUITION Invoice amount_due_cents == 9000 (10000 - rhu(10000*0.10)=1000)"

  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: billing_overdue_suspend_pastdue_tournament_withdraw_chain
        grounds:
          - state_machines.Contract.ACTIVE_to_ACTIVE
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Contract.ACTIVE_to_PAST_DUE
          - state_machines.TournamentRegistration.REGISTERED_to_WITHDRAWN
          - entities.Member.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Depth-4 transitive chain from a single run-billing: Invoice generated -> Member balance crosses
          SUSPEND_THRESHOLD so Member -> SUSPENDED -> that suspension drives Contract -> PAST_DUE -> which
          itself withdraws the member's REGISTERED future TournamentRegistration. Each link is caused by
          the previous link, not by the original billing call.
        test_recipe:
          setup:
            - "Member with a registered future tournament and an ACTIVE contract whose tuition will push the balance past SUSPEND_THRESHOLD_CENTS (15000)."
            - "base_monthly 16000 so one TUITION invoice (pinned 0.00, solo) > 15000."
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/programs"
              payload: { name: "Pricey", discipline: "BJJ", base_monthly_tuition_cents: 16000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "WHITE", rank_order: 0, next_rank_code: null, is_entry_rank: true }
              as: FrontDesk
            - call: "POST /dojo/members"
              payload: { full_name: "Solo P", email: "solop@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /dojo/enrollments"
              payload: { member_id: "${m_id}", program_id: "${prog_id}", expected_member_version: "${m_v}" }
              as: FrontDesk
              captures: { enr_id: $.data.id, m_v2: $.data.version }
            - call: "GET /dojo/members/${m_id}"
              payload: {}
              as: FrontDesk
              captures: { m_v3: $.data.version }
            - call: "POST /dojo/tournament-registrations"
              payload: { member_id: "${m_id}", enrollment_id: "${enr_id}", tournament_name: "Spring Open", event_date: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /dojo/contracts"
              payload: { member_id: "${m_id}", program_id: "${prog_id}", term_months: 12, billing_anchor_day: 1, expected_member_version: "${m_v3}" }
              as: FrontDesk
              captures: { ctr_id: $.data.id }
          trigger:
            - call: "POST /dojo/contracts/${ctr_id}/run-billing"
              payload: {}
              as: FrontDesk
            - call: "GET /dojo/members/${m_id}"
              payload: {}
              as: FrontDesk
              captures: { m_after: $.data }
            - call: "GET /dojo/contracts/${ctr_id}"
              payload: {}
              as: FrontDesk
              captures: { ctr_after: $.data }
            - call: "GET /dojo/tournament-registrations/${reg_id}"
              payload: {}
              as: FrontDesk
              captures: { reg_after: $.data }
          assert:
            - "Member.${m_id}.outstanding_balance_cents == 16000 after billing"
            - "Member.${m_id}.account_status == SUSPENDED (16000 > 15000 threshold)"
            - "Contract.${ctr_id}.status == PAST_DUE"
            - "TournamentRegistration.${reg_id}.status == WITHDRAWN (cascade from contract past_due)"

      - name: member_freeze_enrollment_onhold_chain
        grounds:
          - state_machines.Member.ACTIVE_to_FROZEN
          - state_machines.Enrollment.ACTIVE_to_ON_HOLD
          - entities.Enrollment.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (member freeze): freezing the Member sets
          account_status FROZEN -> that change cascades each ACTIVE Enrollment to ON_HOLD. The
          enrollment hold is caused by the member freeze link, distinct origin from the billing chain.
        test_recipe:
          setup:
            - "Member with two ACTIVE enrollments in two programs."
          setup_api_calls:
            - call: "POST /dojo/programs"
              payload: { name: "Prog X", discipline: "KARATE", base_monthly_tuition_cents: 9000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { px_id: $.data.id }
            - call: "POST /dojo/programs"
              payload: { name: "Prog Y", discipline: "JUDO", base_monthly_tuition_cents: 9000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { py_id: $.data.id }
            - call: "POST /dojo/members"
              payload: { full_name: "Freezo", email: "freezo@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /dojo/enrollments"
              payload: { member_id: "${m_id}", program_id: "${px_id}", expected_member_version: "${m_v}" }
              as: FrontDesk
              captures: { ex_id: $.data.id }
            - call: "GET /dojo/members/${m_id}"
              payload: {}
              as: FrontDesk
              captures: { m_v2: $.data.version }
            - call: "POST /dojo/enrollments"
              payload: { member_id: "${m_id}", program_id: "${py_id}", expected_member_version: "${m_v2}" }
              as: FrontDesk
              captures: { ey_id: $.data.id }
            - call: "GET /dojo/members/${m_id}"
              payload: {}
              as: FrontDesk
              captures: { m_v3: $.data.version }
          trigger:
            - call: "POST /dojo/members/${m_id}/freeze"
              payload: { expected_member_version: "${m_v3}" }
              as: FrontDesk
            - call: "GET /dojo/enrollments/${ex_id}"
              payload: {}
              as: FrontDesk
              captures: { ex_after: $.data }
            - call: "GET /dojo/enrollments/${ey_id}"
              payload: {}
              as: FrontDesk
              captures: { ey_after: $.data }
          assert:
            - "Member.${m_id}.account_status == FROZEN"
            - "Enrollment.${ex_id}.status == ON_HOLD"
            - "Enrollment.${ey_id}.status == ON_HOLD"

  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: waiver_vs_balance_on_promotion_test
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - errors[ERR_WAIVER_NOT_SIGNED]
          - errors[ERR_TEST_BALANCE_TOO_HIGH]
        distinguishing_aspect: |
          A promotion-test request that violates BOTH the business_safety waiver gate (priority 9) and
          the business_fiscal balance ceiling (priority 12) must surface ERR_WAIVER_NOT_SIGNED, because
          priority 9 (safety) precedes priority 12 (fiscal) — a safety-vs-fiscal category pair.
        test_recipe:
          setup:
            - "Member with waiver_signed=false AND outstanding_balance_cents 12000 (> 10000 ceiling) from a fulfilled pro-shop order; enrolled with a non-terminal rank."
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/programs"
              payload: { name: "PV BJJ", discipline: "BJJ", base_monthly_tuition_cents: 9000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "WHITE", rank_order: 0, next_rank_code: "BLUE", is_entry_rank: true }
              as: FrontDesk
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "BLUE", rank_order: 1, next_rank_code: null }
              as: FrontDesk
            - call: "POST /dojo/members"
              payload: { full_name: "NoWaiver", email: "nw@x.com", date_of_birth: "1990-01-01", waiver_signed: false }
              as: FrontDesk
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /dojo/enrollments"
              payload: { member_id: "${m_id}", program_id: "${prog_id}", expected_member_version: "${m_v}" }
              as: FrontDesk
              captures: { enr_id: $.data.id }
            - call: "POST /dojo/instructors"
              payload: { full_name: "Ex1", email: "ex1@x.com" }
              as: FrontDesk
              captures: { ins_id: $.data.id }
            - call: "POST /dojo/pro-shop-orders"
              payload: { member_id: "${m_id}", line_items: [{ sku: "GI", unit_price_cents: 12000, qty: 1 }] }
              as: Member
              as_user_id: "${m_id}"
              captures: { order_id: $.data.id }
