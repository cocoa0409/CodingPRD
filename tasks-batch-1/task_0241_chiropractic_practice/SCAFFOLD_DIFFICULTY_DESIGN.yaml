              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /patients/${pt_id}/treatment-plans/${plan_id}/series"
              payload: { plan_phase_id: "${phase_id}", provider_id: "${prov_id}", treatment_room_id: "${room_id}", start_date: "2026-03-16", weekday_pattern: [0, 2], start_time_minutes: 540, duration_minutes: 15, insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: safety_dismissed_beats_temporal_double_book
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors[ERR_PATIENT_DISMISSED]
          - errors[ERR_PROVIDER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          A DIFFERENT error-category pair — BUSINESS_SAFETY (priority 9, ERR_PATIENT_DISMISSED) vs BUSINESS_TEMPORAL
