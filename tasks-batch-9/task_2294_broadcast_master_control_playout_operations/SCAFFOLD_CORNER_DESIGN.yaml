          assert:
            - "every response has status 404 and response_type error"
            - "${e404_tx} == ERR_TRANSMITTER_NOT_FOUND and ${e404_mux} == ERR_MULTIPLEX_NOT_FOUND and ${e404_ch} == ERR_CHANNEL_NOT_FOUND"
            - "${e404_op} == ERR_OPERATOR_NOT_FOUND and ${e404_as} == ERR_ASSET_NOT_FOUND and ${e404_qc} == ERR_QC_REPORT_NOT_FOUND"
            - "${e404_pl} == ERR_PLAYLIST_NOT_FOUND and ${e404_it} == ERR_PLAYLIST_ITEM_NOT_FOUND and ${e404_ord} == ERR_SPOT_ORDER_NOT_FOUND"
            - "${e404_fw} == ERR_FEED_WINDOW_NOT_FOUND and ${e404_ov} == ERR_OVERRIDE_NOT_FOUND"
            - "${e404_flt} == ERR_FAULT_NOT_FOUND and ${e404_ntf} == ERR_NOTIFICATION_NOT_FOUND"

      - name: missing_required_fields_return_422_before_any_row_is_written
        claim_type: Required Fields
        grounds: "§1.4 priority 8 ERR_MISSING_REQUIRED_FIELD (422); §1.5 required input lists for POST /transmitters, POST /multiplexes, POST /operators, POST /assets, POST /spot-orders, POST /transmitters/{id}/power-state"
        distinguishing_aspect: "Every field declared without a `?` is mandatory, and the conditional requirement (power-state OFF_AIR needs a reason) is enforced with the same error; an implementation that substitutes nulls or defaults for absent required fields fails."
        test_recipe:
          setup: "Base graph through mux1 so the FK targets exist and only the shape is wrong."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
            - *mux1
          trigger:
            - call: "POST /transmitters"
              payload: { facility_id: "FAC-70099", call_sign: "WNEW" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_req_tx: "$.data.error_id" }
            - call: "POST /multiplexes"
              payload: { transmitter_id: "${tx1_id}", name: "MUX-NO-CAP" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_req_mux: "$.data.error_id" }
            - call: "POST /operators"
              payload: { full_name: "Eve Stone", role_class: QC, override_authority: NONE }
              as: StationAdmin
              captures: { e_req_op: "$.data.error_id" }
            - call: "POST /assets"
              payload: { house_number: "HN-NOFIELDS", title: "Orphan", source: SATELLITE_FEED, expected_duration_seconds: 60 }
              as: TrafficCoordinator
              captures: { e_req_asset: "$.data.error_id" }
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: OFF_AIR }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_req_reason: "$.data.error_id" }
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: REDUCED_POWER }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_req_pct: "$.data.error_id" }
          assert:
            - "${e_req_tx} == ERR_MISSING_REQUIRED_FIELD (authorized_erp_kw absent) with status 422"
            - "${e_req_mux} == ERR_MISSING_REQUIRED_FIELD (total_capacity_kbps absent)"
            - "${e_req_op} == ERR_MISSING_REQUIRED_FIELD (certification_expires_utc absent)"
            - "${e_req_asset} == ERR_MISSING_REQUIRED_FIELD (delivery_deadline_utc, required_resolution_class and captions_required absent)"
            - "${e_req_reason} == ERR_MISSING_REQUIRED_FIELD — OFF_AIR requires a reason even though §1.5 marks it reason?"
            - "${e_req_pct} == ERR_MISSING_REQUIRED_FIELD — REDUCED_POWER requires power_pct"
            - "Transmitter.${tx1_id}.operational_state is still FULL_POWER and version is still 1: no partial write survived"

      - name: enum_and_range_type_constraints_are_rejected_with_invalid_enum_or_field_value
        claim_type: Type Constraints
        grounds: "§1.4 priorities 9 ERR_INVALID_ENUM_VALUE and 10 ERR_INVALID_FIELD_VALUE; §1.1 declared enum domains and numeric ranges (authorized_erp_kw > 0, total_capacity_kbps >= 1000, floor_bitrate_kbps >= 100, priority_rank >= 1, unit_duration_seconds >= 5, channel_number pattern ^[0-9]{1,3}\\.[0-9]{1,2}$, guard_seconds 0..30, crawl_text 1..200)"
        distinguishing_aspect: "A value outside an enum domain must return ERR_INVALID_ENUM_VALUE (priority 9) while a well-typed but out-of-range value must return ERR_INVALID_FIELD_VALUE (priority 10); collapsing both into one id, or accepting channel_number '121' against the declared regex, fails."
        test_recipe:
          setup: "Base graph through ch1 with a fresh multiplex version to spend."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
          trigger:
            - call: "POST /assets"
              payload: { house_number: "HN-ENUM-01", title: "Bad Source", source: BLURAY_DISC, expected_duration_seconds: 60, delivery_deadline_utc: "2026-08-01T10:00:00Z", required_resolution_class: HD_1080I, captions_required: false }
              as: TrafficCoordinator
              captures: { e_enum_source: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${mux1_v2}", call_sign: "WXYZ-DT8", channel_number: "12.8", service_class: PRIMARY, resolution_class: UHD_2160P, requested_bitrate_kbps: 16000, floor_bitrate_kbps: 8000, priority_rank: 1 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_enum_res: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${mux1_v2}", call_sign: "WXYZ-DT9", channel_number: "121", service_class: PRIMARY, resolution_class: HD_720P, requested_bitrate_kbps: 6000, floor_bitrate_kbps: 5000, priority_rank: 1 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_pattern_chnum: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${mux1_v2}", call_sign: "WXYZ-DT10", channel_number: "12.10", service_class: PRIMARY, resolution_class: HD_720P, requested_bitrate_kbps: 6000, floor_bitrate_kbps: 5000, priority_rank: 0 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_rank_zero: "$.data.error_id" }
            - call: "POST /multiplexes"
              payload: { transmitter_id: "${tx1_id}", name: "MUX-TINY", total_capacity_kbps: 999 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_cap_low: "$.data.error_id" }
            - call: "POST /spot-orders"
              payload: { channel_id: "${ch1_id}", advertiser_name: "Tiny Spot", order_reference: "ORD-2026-BAD1", ordered_spots: 2, unit_duration_seconds: 4, rate_cents_total: 1000, daypart: PRIME, priority_class: REMNANT, makegood_deadline_utc: "2026-08-31T00:00:00Z" }
              as: TrafficCoordinator
              captures: { e_unit_low: "$.data.error_id" }
            - call: "POST /spot-orders"
              payload: { channel_id: "${ch1_id}", advertiser_name: "Bad Daypart", order_reference: "ORD-2026-BAD2", ordered_spots: 2, unit_duration_seconds: 30, rate_cents_total: 1000, daypart: OVERNIGHT, priority_class: REMNANT, makegood_deadline_utc: "2026-08-31T00:00:00Z" }
              as: TrafficCoordinator
              captures: { e_enum_daypart: "$.data.error_id" }
          assert:
            - "${e_enum_source} == ERR_INVALID_ENUM_VALUE (Asset.source domain is SATELLITE_FEED|FILE_DELIVERY|LIVE_LINE|LOCAL_ARCHIVE)"
            - "${e_enum_res} == ERR_INVALID_ENUM_VALUE (resolution_class domain is HD_1080I|HD_720P|SD_480I)"
            - "${e_enum_daypart} == ERR_INVALID_ENUM_VALUE (daypart domain is EARLY_MORNING|DAYTIME|EARLY_FRINGE|PRIME|LATE_NIGHT)"
            - "${e_pattern_chnum} == ERR_INVALID_FIELD_VALUE (channel_number must match ^[0-9]{1,3}\\.[0-9]{1,2}$)"
            - "${e_rank_zero} == ERR_INVALID_FIELD_VALUE (priority_rank >= 1)"
            - "${e_cap_low} == ERR_INVALID_FIELD_VALUE (total_capacity_kbps >= 1000)"
            - "${e_unit_low} == ERR_INVALID_FIELD_VALUE (unit_duration_seconds >= 5)"
            - "all seven responses are 422 with response_type error and no row was created"

      - name: playlist_ingest_defaults_window_duration_and_seeds_item_system_fields
        claim_type: Defaults
        grounds: "§1.1 Playlist (window_duration_seconds default 86400, traffic_revision default 1, computed item_count/blocked_item_count/scheduled_total_seconds/commercial_seconds_by_hour/variances) and PlaylistItem (max_trim_seconds default 0, playout_status/clearance_status, house_number snapshot); §1.2 Playlist IMPORTING -> IMPORTED"
        distinguishing_aspect: "Omitting window_duration_seconds must default to 86400, making projected_end_variance_seconds = 630 - 86400 = -85770 (a large negative, which is exactly why ARM would refuse); item rows must be seeded SCHEDULED/CLEARED with the house_number copied from the asset, is_makegood false and trim_applied_seconds 0."
        test_recipe:
          setup: "Base graph through ch2, with HN-PROG-01 and HN-SPOT-01 both QC_PASSED; a two-item playlist is ingested on ch2 without a window override."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *op_qc
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
            - *ch2
            - *as_prog
            - *dl_prog
            - *qc_prog
            - *as_spot
            - *dl_spot
            - *qc_spot
          trigger:
            - call: "POST /playlists"
              payload:
                channel_id: "${ch2_id}"
                broadcast_day: "2026-08-01"
                schedule_start_utc: "2026-08-01T14:00:00Z"
                items:
                  - { sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-01T14:00:00Z", scheduled_duration_seconds: 600 }
                  - { sequence_number: 2, element_kind: COMMERCIAL, asset_id: "${aspot_id}", scheduled_start_utc: "2026-08-01T14:10:00Z", scheduled_duration_seconds: 30 }
              as: TrafficCoordinator
              captures: { pld_id: "$.data.id" }
            - call: "GET /playlists/${pld_id}/items"
              as: TrafficCoordinator
