        claim_type: correct_result
        grounds:
          - calculations.challenge_deposit_requirement
          - endpoints[POST /appraisals/{id}/challenges]
          - entities.AppraisalChallenge.fields.required_deposit_cents
        distinguishing_aspect: "On an appraisal reported at 100000000 the frozen required_deposit_cents is exactly round_half_up(100000000 * 0.01) == 1000000, strictly between CHALLENGE_DEPOSIT_MIN_CENTS (100000) and CHALLENGE_DEPOSIT_MAX_CENTS (2500000) so neither clamp is active, and the admissibility floor on the value delta is round_half_up(100000000 * 0.05) == 5000000, which an asserted value of 95000000 meets exactly."
