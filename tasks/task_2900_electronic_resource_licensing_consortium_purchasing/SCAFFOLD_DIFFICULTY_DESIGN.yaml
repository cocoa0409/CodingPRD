          Conserved quantity: the package itself - entitled_title_count together with
          negotiated_price_cents. The executed RESTRUCTURE removed three titles, added one and added
          250000 cents (400 -> 398 titles, 9000000 -> 9250000 cents). Reverting must put back exactly
          what the execution changed - 398 + 3 - 1 = 400 titles and 9250000 - 250000 = 9000000 cents -
          and re-price the confirmed commitment back to 4500000 with the member ledger following, a
          different conserved quantity and a different compensating endpoint from the ledger case.
