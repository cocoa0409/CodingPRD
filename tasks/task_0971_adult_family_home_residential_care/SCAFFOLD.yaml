scenario: "971. Adult Family Home (small residential care): resident & bed, admission & assessment/care plan, med & ADL log, private-pay vs Medicaid rate, staffing ratio & schedule, incident & state compliance, billing, discharge"
domain_name: "adult-family-home-residential-care"
api_prefix: "/api"
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1  Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Home
    parent: null
    common_fields: true
    fields:
      - name: license_number
        type: string
        source: input
        description: "State-issued AFH license number; unique across homes"
        constraints: "required; unique"
      - name: name
        type: string
        source: input
        description: "Operating name of the adult family home"
        constraints: "required"
      - name: licensed_bed_capacity
        type: integer
        source: input
        description: "Maximum beds the state license permits"
        constraints: "required; 2 <= value <= 6"
      - name: timezone
        type: string
        source: input
        description: "IANA timezone of the home, used for day boundary in billing and staffing windows"
        default: "America/Los_Angeles"
      - name: status
        type: enum
        source: system
        description: "Lifecycle: PROVISIONAL -> LICENSED -> SUSPENDED -> LICENSED (reinstate) -> CLOSED; CLOSED terminal"
        constraints: "values: PROVISIONAL, LICENSED, SUSPENDED, CLOSED"
      - name: open_case_count
        type: integer
        source: computed
        description: "Count of ComplianceCase rows with status IN {OPEN, SUBSTANTIATED} for this home; recomputed on every case status change"
      - name: current_census
        type: integer
        source: computed
        description: "Count of Resident rows with status == ADMITTED for this home; recomputed on every admission and discharge"

  - name: Bed
    parent: Home
    common_fields: true
    fields:
      - name: home_id
        type: string
        source: input
        description: "FK -> Home.id; the home this bed belongs to"
        constraints: "required"
      - name: label
        type: string
        source: input
        description: "Human label such as Room 1-A"
        constraints: "required; unique within home"
      - name: medicaid_certified
        type: boolean
        source: input
        description: "Whether this bed is certified to accept Medicaid-funded residents"
        default: false
      - name: status
        type: enum
        source: system
        description: "AVAILABLE -> HELD -> OCCUPIED; both HELD and OCCUPIED can return to AVAILABLE; OUT_OF_SERVICE is a side branch reachable from any non-terminal status and returns to AVAILABLE"
        constraints: "values: AVAILABLE, HELD, OCCUPIED, OUT_OF_SERVICE"

  - name: Resident
    parent: Home
    common_fields: true
    fields:
      - name: home_id
        type: string
        source: input
        description: "FK -> Home.id; the home where this resident is registered"
        constraints: "required"
      - name: full_name
        type: string
        source: input
        description: "Resident legal name"
        constraints: "required"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date"
        constraints: "required"
      - name: payer_type
        type: enum
        source: input
        description: "Funding source; drives rate schedule selection and bed certification checks"
        constraints: "values: PRIVATE_PAY, MEDICAID"
      - name: status
        type: enum
        source: system
        description: "PROSPECT -> APPLICANT -> ADMITTED -> DISCHARGED; APPLICANT may revert to PROSPECT (withdrawal); DISCHARGED terminal"
        constraints: "values: PROSPECT, APPLICANT, ADMITTED, DISCHARGED"
      - name: admitted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the ADMITTED transition; null until admitted"
      - name: discharged_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the DISCHARGED transition; null until discharged"

  - name: Assessment
    parent: Resident
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
        constraints: "required"
      - name: assessed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the assessment was recorded"
      - name: nursing_hours_per_week
        type: number
        source: input
        description: "Assessed direct nursing hours needed per week; input to Medicaid acuity rate band"
        constraints: "required; 0 <= value <= 40"
      - name: adl_dependency_score
        type: integer
        source: input
        description: "Count of ADLs (of 6) the resident needs full assistance with; input to acuity band and care-plan minimums"
        constraints: "required; 0 <= value <= 6"
      - name: care_plan
        type: object
        source: input
        description: "Structured care plan: diet, mobility, medication assistance level, ADL assist flags"
        constraints: "required"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> FINALIZED -> SUPERSEDED; a FINALIZED assessment can be superseded by a newer FINALIZED one for the same resident (cyclic re-assessment loop); SUPERSEDED terminal"
        constraints: "values: DRAFT, FINALIZED, SUPERSEDED"

  - name: Admission
    parent: Resident
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
        constraints: "required"
      - name: bed_id
        type: string
        source: input
        description: "FK -> Bed.id; bed this admission will occupy on approval"
        constraints: "required"
      - name: assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; version-pinned FINALIZED assessment that authorizes this admission"
        constraints: "required"
      - name: expected_admission_date
        type: string
        source: input
        description: "ISO 8601 date the resident is expected to move in"
        constraints: "required"
      - name: status
        type: enum
        source: system
        description: "PENDING -> APPROVED -> COMPLETED; PENDING -> REJECTED; APPROVED -> CANCELLED (bed released); COMPLETED, REJECTED, CANCELLED terminal"
        constraints: "values: PENDING, APPROVED, REJECTED, COMPLETED, CANCELLED"
      - name: decided_by
        type: string
        source: system
        description: "X-User-ID of the Provider who approved or rejected; segregation-of-duties anchor"
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the approve/reject decision"

  - name: MedicationOrder
    parent: Resident
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
        constraints: "required"
      - name: drug_name
        type: string
        source: input
        description: "Medication name"
        constraints: "required"
      - name: dose
        type: string
        source: input
        description: "Dose and route, e.g. '5mg oral'"
        constraints: "required"
      - name: schedule_times
        type: array
        source: input
        description: "List of local wall-clock administration times per day, e.g. ['08:00','20:00']; med windows derive from these"
        constraints: "required; 1 <= length <= 6"
      - name: status
        type: enum
        source: system
        description: "ACTIVE -> DISCONTINUED; DISCONTINUED terminal; no further administrations may be logged against a DISCONTINUED order"
        constraints: "values: ACTIVE, DISCONTINUED"

  - name: MedicationLog
    parent: Resident
    common_fields: false
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
        constraints: "required"
      - name: order_id
        type: string
        source: input
        description: "FK -> MedicationOrder.id; order this administration fulfils"
        constraints: "required"
      - name: administered_at
        type: datetime
        source: input
        description: "Logical-clock timestamp of administration; must fall inside an open med window for the order's schedule_times"
        constraints: "required"
      - name: outcome
        type: enum
        source: input
        description: "Result of the administration attempt"
        constraints: "values: GIVEN, REFUSED, HELD, SELF_ADMINISTERED"
      - name: caregiver_id
        type: string
        source: input
        description: "FK -> Caregiver.id; who performed or witnessed the administration; must be assigned to a shift covering administered_at"
        constraints: "required"
      - name: note
        type: string
        source: input
        description: "Free-text note; required when outcome is REFUSED or HELD"
        constraints: "optional unless outcome IN {REFUSED, HELD}"

  - name: ADLLog
    parent: Resident
    common_fields: false
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
        constraints: "required"
      - name: adl_type
        type: enum
        source: input
        description: "Which activity of daily living was assisted"
        constraints: "values: BATHING, DRESSING, GROOMING, TOILETING, TRANSFERRING, EATING"
      - name: assistance_level
        type: enum
        source: input
        description: "Degree of help provided"
        constraints: "values: INDEPENDENT, SUPERVISION, PARTIAL, FULL"
      - name: performed_at
        type: datetime
        source: input
        description: "Logical-clock timestamp of the assistance"
        constraints: "required"
      - name: caregiver_id
        type: string
        source: input
        description: "FK -> Caregiver.id; must be assigned to a shift covering performed_at"
        constraints: "required"

  - name: Caregiver
    parent: Home
    common_fields: true
    fields:
      - name: home_id
        type: string
        source: input
        description: "FK -> Home.id"
        constraints: "required"
      - name: full_name
        type: string
        source: input
        description: "Caregiver legal name"
        constraints: "required"
      - name: credential_id
        type: string
        source: input
        description: "State credential number (HCA/NAC); unique across homes"
        constraints: "required; unique"
      - name: awake_overnight_qualified
        type: boolean
        source: input
        description: "Whether this caregiver may staff an AWAKE overnight shift"
        default: false
      - name: status
        type: enum
        source: system
        description: "ACTIVE -> SUSPENDED -> ACTIVE; SUSPENDED caregivers may not be newly scheduled; ACTIVE -> TERMINATED terminal"
        constraints: "values: ACTIVE, SUSPENDED, TERMINATED"

  - name: Shift
    parent: Home
    common_fields: true
    fields:
      - name: home_id
        type: string
        source: input
        description: "FK -> Home.id"
        constraints: "required"
      - name: caregiver_id
        type: string
        source: input
        description: "FK -> Caregiver.id"
        constraints: "required"
      - name: start_at
        type: datetime
        source: input
        description: "Shift start (logical clock domain); half-open interval [start_at, end_at)"
        constraints: "required"
      - name: end_at
        type: datetime
        source: input
        description: "Shift end; must be strictly after start_at; duration <= 16 hours"
        constraints: "required"
      - name: overnight_mode
        type: enum
        source: input
        description: "AWAKE = overnight hours count at ratio 1:2 and require awake_overnight_qualified; ASLEEP = 1:3 aggregate with co-scheduled caregiver"
        constraints: "values: AWAKE, ASLEEP; required when shift covers 22:00-06:00, otherwise ignored"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED -> CANCELLED; CANCELLED terminal; CANCELLED shifts are excluded from all staffing computations"
        constraints: "values: SCHEDULED, CANCELLED"

  - name: Incident
    parent: Resident
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
        constraints: "required"
      - name: incident_type
        type: enum
        source: input
        description: "Category of reportable event"
        constraints: "values: FALL, MED_ERROR, ELOPEMENT, ABUSE_ALLEGATION, INJURY"
      - name: severity
        type: enum
        source: input
        description: "MINOR = internal review only; MAJOR or CRITICAL = state reportable; CRITICAL also suspends new admissions"
        constraints: "values: MINOR, MAJOR, CRITICAL"
      - name: occurred_at
        type: datetime
        source: input
        description: "Logical-clock timestamp of the event"
        constraints: "required"
      - name: reported_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the incident was filed; drives the 24h reporting-deadline check against occurred_at for MAJOR/CRITICAL"
      - name: description
        type: string
        source: input
        description: "Narrative of the event"
        constraints: "required"
      - name: status
        type: enum
        source: system
        description: "REPORTED -> UNDER_REVIEW -> RESOLVED -> CLOSED; UNDER_REVIEW -> REPORTED (reopen loop for additional findings); CLOSED terminal"
        constraints: "values: REPORTED, UNDER_REVIEW, RESOLVED, CLOSED"

  - name: ComplianceCase
    parent: Home
    common_fields: true
    fields:
      - name: home_id
        type: string
        source: input
        description: "FK -> Home.id"
        constraints: "required"
      - name: incident_id
        type: string
        source: input
        description: "FK -> Incident.id; the reportable incident this case investigates; unique (one case per incident)"
        constraints: "required; unique"
      - name: citation_code
        type: string
        source: input
        description: "WAC citation issued by the inspector; null until SUBSTANTIATED"
        constraints: "optional"
      - name: correction_plan_due_at
        type: datetime
        source: system
        description: "Set to decision timestamp + 14 days when status becomes SUBSTANTIATED"
      - name: correction_plan_submitted_at
        type: datetime
        source: input
        description: "Logical-clock timestamp the home submits its plan of correction; must be <= correction_plan_due_at for on-time closure"
        constraints: "required on the submit-correction-plan endpoint"
      - name: status
        type: enum
        source: system
        description: "OPEN -> SUBSTANTIATED -> CLOSED; OPEN -> UNFOUNDED -> CLOSED; CLOSED terminal; open_case_count on Home tracks non-terminal cases"
        constraints: "values: OPEN, SUBSTANTIATED, UNFOUNDED, CLOSED"

  - name: Invoice
    parent: Resident
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
        constraints: "required"
      - name: period_start
        type: string
        source: input
        description: "ISO 8601 date, inclusive start of the billing period"
        constraints: "required"
      - name: period_end
        type: string
        source: input
        description: "ISO 8601 date, exclusive end of the billing period; must be after period_start"
        constraints: "required"
      - name: payer_type_snapshot
        type: enum
        source: system
        description: "Copy of Resident.payer_type at generation time; rate selection is pinned to this snapshot even if the resident's payer type later changes"
        constraints: "values: PRIVATE_PAY, MEDICAID"
      - name: line_items
        type: array
        source: system
        description: "Computed line items: one per occupied day (room_and_board or acuity-band care) plus flat ancillary rows; each line carries day, description, qty, unit_price_cents, amount_cents"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of line_items[*].amount_cents; each line amount already rounded to cents (round per line, then sum)"
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Applied once on ISSUE when logical clock is past due_date: 5% of subtotal_cents, min 2500, max 15000, round_half_up"
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents + late_fee_cents"
      - name: due_date
        type: string
        source: input
        description: "ISO 8601 date payment is due; late fee applies when issued after this date"
        constraints: "required"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> ISSUED -> PARTIALLY_PAID -> PAID; ISSUED -> VOID; PARTIALLY_PAID -> PAID; PAID and VOID terminal; DRAFT -> VOID also allowed"
        constraints: "values: DRAFT, ISSUED, PARTIALLY_PAID, PAID, VOID"

  - name: Payment
    parent: Resident
    common_fields: false
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
        constraints: "required"
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id"
        constraints: "required"
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in cents; must be positive and must not exceed the invoice's outstanding balance"
        constraints: "required; value > 0"
      - name: method
        type: enum
        source: input
        description: "Payment channel"
        constraints: "values: CASH, CHECK, ACH, CARD, MEDICAID_REMIT"
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of payment receipt"

  - name: RateSchedule
    parent: Home
    common_fields: true
    fields:
      - name: home_id
        type: string
        source: input
        description: "FK -> Home.id"
        constraints: "required"
      - name: payer_type
        type: enum
        source: input
        description: "Which payer population this schedule prices"
        constraints: "values: PRIVATE_PAY, MEDICAID"
      - name: room_and_board_daily_cents
        type: integer
        source: input
        description: "Daily room-and-board charge; used by the base PRIVATE_PAY formula and as the R&B floor inside Medicaid bands"
        constraints: "required; value > 0"
      - name: care_low_daily_cents
        type: integer
        source: input
        description: "Daily add-on for acuity band LOW"
        constraints: "required; value >= 0"
      - name: care_medium_daily_cents
        type: integer
        source: input
        description: "Daily add-on for acuity band MEDIUM; must be >= care_low_daily_cents"
        constraints: "required; value >= care_low_daily_cents"
      - name: care_high_daily_cents
        type: integer
        source: input
        description: "Daily add-on for acuity band HIGH; must be >= care_medium_daily_cents"
        constraints: "required; value >= care_medium_daily_cents"
      - name: effective_from
        type: string
        source: input
        description: "ISO 8601 date from which this schedule applies (inclusive)"
        constraints: "required"
      - name: effective_to
        type: string
        source: input
        description: "ISO 8601 date until which this schedule applies (exclusive); null = open-ended; must be after effective_from when present"
        constraints: "optional; exclusive upper bound"

  - name: DischargeRecord
    parent: Resident
    common_fields: false
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
        constraints: "required"
      - name: reason
        type: enum
        source: input
        description: "Discharge reason"
        constraints: "values: VOLUNTARY, HOSPITALIZATION, LEVEL_OF_CARE_EXCEEDED, NONPAYMENT, DECEASED"
      - name: notice_days
        type: integer
        source: input
        description: "Days of advance notice given; must be >= 30 unless reason is HOSPITALIZATION or DECEASED"
        constraints: "required; value >= 0"
      - name: discharged_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the discharge was finalized; copied onto Resident.discharged_at"
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "Prepaid room-and-board refund computed by discharge_refund; applied against the final invoice"

# ---------------------------------------------------------------------------
# §1.2  State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Home
    initial_state: PROVISIONAL
    terminal_states: [CLOSED]
    transitions:
      - from: PROVISIONAL
        to: LICENSED
        trigger: "POST /homes/{id}/license"
        actor: Provider
        preconditions:
          - "Home has at least one Bed with status != OUT_OF_SERVICE"
          - "At least one ACTIVE Caregiver exists for the home"
        side_effects:
          - "Home.status = LICENSED; bumps Home.version"
      - from: LICENSED
        to: SUSPENDED
        trigger: "POST /homes/{id}/suspend OR automatic side effect of a ComplianceCase transitioning to SUBSTANTIATED with citation_code starting 'WAC388-76-10'"
        actor: Provider | system
        preconditions:
          - "For manual suspend: no precondition beyond state"
          - "For auto-suspend: the ComplianceCase carries citation_code prefix WAC388-76-10 (abuse/neglect findings)"
        side_effects:
          - "Home.status = SUSPENDED; new Admission approvals are blocked while SUSPENDED"
      - from: SUSPENDED
        to: LICENSED
        trigger: "POST /homes/{id}/reinstate"
        actor: Provider
        preconditions:
          - "Home.open_case_count == 0 (no ComplianceCase in OPEN or SUBSTANTIATED)"
        side_effects:
          - "Home.status = LICENSED"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /homes/{id}/close"
        actor: Provider
        preconditions:
          - "Home.current_census == 0 (no ADMITTED residents)"
        side_effects:
          - "Home.status = CLOSED"
          - "Every non-OUT_OF_SERVICE Bed -> OUT_OF_SERVICE; a HELD bed's transition itself forces its linked PENDING Admission -> REJECTED (bed-caused compensation; the admission's normal bed-release side effect is suppressed because the bed is leaving service) — depth-3 chain: Home closure -> Bed mutation -> Admission mutation"
          - "All SCHEDULED shifts -> CANCELLED (staffing-ratio revalidation is skipped for closure cascades)"
      - from: LICENSED
        to: CLOSED
        trigger: "POST /homes/{id}/close"
        actor: Provider
        preconditions:
          - "Home.current_census == 0"
        side_effects:
          - "Home.status = CLOSED"
          - "Every non-OUT_OF_SERVICE Bed -> OUT_OF_SERVICE; HELD beds force linked PENDING Admissions -> REJECTED as above (depth-3 chain)"
          - "All SCHEDULED shifts -> CANCELLED"

  - entity: Bed
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: HELD
        trigger: "POST /admissions (creation of a PENDING admission referencing this bed)"
        actor: Provider
        preconditions:
          - "Bed.status == AVAILABLE"
          - "Bed.home.status IN {PROVISIONAL, LICENSED}"
          - "If the resident's payer_type == MEDICAID then bed.medicaid_certified must be true"
        side_effects:
          - "Bed.status = HELD; bumps Bed.version"
      - from: HELD
        to: OCCUPIED
        trigger: "POST /admissions/{id}/complete (admission completion)"
        actor: Provider
        preconditions:
          - "Admission.status == APPROVED and admission.bed_id == this bed"
        side_effects:
          - "Bed.status = OCCUPIED; Home.current_census recomputed"
      - from: HELD
        to: AVAILABLE
        trigger: "Admission REJECTED or CANCELLED (compensation releases the hold)"
        actor: system
        preconditions: []
        side_effects:
          - "Bed.status = AVAILABLE"
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "Resident discharge finalization (POST /residents/{id}/discharge)"
        actor: system
        preconditions: []
        side_effects:
          - "Bed.status = AVAILABLE; Home.current_census recomputed"
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /beds/{id}/take-out-of-service"
        actor: Provider
        preconditions: []
        side_effects:
          - "Bed.status = OUT_OF_SERVICE"
      - from: HELD
        to: OUT_OF_SERVICE
        trigger: "POST /beds/{id}/take-out-of-service (forces the linked PENDING admission to REJECTED first)"
        actor: Provider
        preconditions:
          - "The PENDING admission holding this bed is auto-rejected as a compensating action"
        side_effects:
          - "Linked PENDING Admission -> REJECTED (decided_by = system); the admission's normal bed-release compensation (Bed -> AVAILABLE) is suppressed because the bed is leaving service; then Bed.status = OUT_OF_SERVICE"
      - from: OCCUPIED
        to: OUT_OF_SERVICE
        trigger: "Forbidden — an occupied bed cannot leave service until the resident is discharged"
        actor: Provider
        preconditions:
          - "NEVER satisfied; attempts return ERR_BED_OCCUPIED"
        side_effects: []
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /beds/{id}/return-to-service"
        actor: Provider
        preconditions:
          - "Home.status IN {PROVISIONAL, LICENSED}"
        side_effects:
          - "Bed.status = AVAILABLE"

  - entity: Resident
    initial_state: PROSPECT
    terminal_states: [DISCHARGED]
    transitions:
      - from: PROSPECT
        to: APPLICANT
        trigger: "POST /residents/{id}/assessments followed by POST /assessments/{id}/finalize (first FINALIZED assessment promotes the resident)"
        actor: Nurse
        preconditions:
          - "Assessment.status transitioned DRAFT -> FINALIZED for this resident"
        side_effects:
          - "Resident.status = APPLICANT"
      - from: APPLICANT
        to: PROSPECT
        trigger: "POST /residents/{id}/withdraw (applicant withdraws before admission)"
        actor: Provider
        preconditions:
          - "No Admission with status IN {PENDING, APPROVED} exists for this resident"
        side_effects:
          - "Resident.status = PROSPECT; all FINALIZED assessments for the resident remain FINALIZED"
      - from: APPLICANT
        to: ADMITTED
        trigger: "POST /admissions/{id}/complete"
        actor: Provider
        preconditions:
          - "Admission.status == APPROVED"
          - "Home.status == LICENSED"
          - "Home.current_census < Home.licensed_bed_capacity"
          - "Resident has no Invoice with status == ISSUED that is past due_date with total unpaid (move-in blocked by delinquent final bill is NOT applied here; block applies only to NEW admission when a prior unpaid final invoice exists and admission would exceed capacity)"
        side_effects:
          - "Resident.status = ADMITTED; Resident.admitted_at = now"
          - "Bed -> OCCUPIED (bed-level transition)"
          - "Admission -> COMPLETED"
          - "Home.current_census recomputed"
      - from: ADMITTED
        to: DISCHARGED
        trigger: "POST /residents/{id}/discharge"
        actor: Provider
        preconditions:
          - "DischargeRecord.notice_days >= 30 OR reason IN {HOSPITALIZATION, DECEASED}"
          - "No Incident with status IN {REPORTED, UNDER_REVIEW} and severity == CRITICAL exists for this resident (critical incident under investigation blocks discharge)"
        side_effects:
          - "Resident.status = DISCHARGED; Resident.discharged_at = now"
          - "Occupied Bed -> AVAILABLE"
          - "All ACTIVE MedicationOrders for the resident -> DISCONTINUED"
          - "Final invoice generation is enabled for the occupancy window (invoice_window_provisional vs invoice_window_final divergence starts here)"
          - "Home.current_census recomputed"
          - "discharge_refund computed onto DischargeRecord.refund_amount_cents"

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /assessments/{id}/finalize"
        actor: Nurse
        preconditions:
          - "Resident.status IN {PROSPECT, APPLICANT, ADMITTED}"
          - "assessed fields complete (nursing_hours_per_week, adl_dependency_score, care_plan present)"
        side_effects:
          - "Assessment.status = FINALIZED"
          - "If resident was PROSPECT, resident promotes to APPLICANT"
          - "Any previously FINALIZED assessment for the same resident -> SUPERSEDED (version-pinned replacement)"
          - "Any Admission with status == PENDING that pinned the now-superseded assessment is unaffected (pin is to the assessment id, which remains FINALIZED-then-SUPERSEDED; approval of such an admission is rejected with ERR_ASSESSMENT_SUPERSEDED)"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "A newer Assessment for the same resident is FINALIZED"
        actor: system
        preconditions: []
        side_effects:
          - "This assessment -> SUPERSEDED"

  - entity: Admission
    initial_state: PENDING
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /admissions/{id}/approve"
        actor: Provider
        preconditions:
          - "Actor X-User-ID != X-User-ID of the admission's creator (segregation of duties: requester cannot approve own admission)"
          - "Pinned assessment is still FINALIZED (not SUPERSEDED) — else ERR_ASSESSMENT_SUPERSEDED"
          - "Home.status == LICENSED"
          - "Bed.status == HELD by this admission"
        side_effects:
          - "Admission.status = APPROVED; decided_by and decided_at stamped"
      - from: PENDING
        to: REJECTED
        trigger: "POST /admissions/{id}/reject OR forced by bed take-out-of-service"
        actor: Provider | system
        preconditions: []
        side_effects:
          - "Admission.status = REJECTED; decided stamps; held Bed -> AVAILABLE (compensation)"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /admissions/{id}/complete (resident physically moves in)"
        actor: Provider
        preconditions:
          - "Home.status == LICENSED"
          - "Home.current_census < Home.licensed_bed_capacity"
        side_effects:
          - "Admission -> COMPLETED; resident ADMITTED; bed OCCUPIED (chain spelled out on Resident and Bed machines)"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /admissions/{id}/cancel (move-in abandoned before completion)"
        actor: Provider
        preconditions: []
        side_effects:
          - "Admission.status = CANCELLED; held Bed -> AVAILABLE (compensation)"

  - entity: MedicationOrder
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /medication-orders/{id}/discontinue OR automatic on resident discharge"
        actor: Nurse | system
        preconditions:
          - "For manual discontinue: resident not DISCHARGED"
        side_effects:
          - "Order -> DISCONTINUED; future MedicationLog rows against this order are rejected"

  - entity: Shift
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /shifts/{id}/cancel OR automatic on home closure"
        actor: Provider | system
        preconditions:
          - "Cancelling the shift must not leave any already-occupied hour of the home below the required staffing ratio (validated by staffing_ratio check against remaining SCHEDULED shifts)"
        side_effects:
          - "Shift -> CANCELLED; excluded from staffing computations"

  - entity: Incident
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /incidents/{id}/open-case (creates the linked ComplianceCase)"
        actor: Provider
        preconditions:
          - "severity IN {MAJOR, CRITICAL} (MINOR incidents never open state cases and instead close directly)"
          - "reported_at - occurred_at <= 24 hours (late filing is itself reportable: returns ERR_LATE_REPORT and refuses the transition)"
        side_effects:
          - "Incident -> UNDER_REVIEW; a ComplianceCase is created with status OPEN (cascade: incident -> case)"
      - from: REPORTED
        to: CLOSED
        trigger: "POST /incidents/{id}/close-minor"
        actor: Provider
        preconditions:
          - "severity == MINOR"
        side_effects:
          - "Incident -> CLOSED without a compliance case"
      - from: UNDER_REVIEW
        to: REPORTED
        trigger: "POST /incidents/{id}/reopen (additional findings reset the review)"
        actor: Provider
        preconditions:
          - "Linked ComplianceCase.status == OPEN (a case already SUBSTANTIATED or UNFOUNDED cannot be reopened through the incident)"
        side_effects:
          - "Incident -> REPORTED; linked ComplianceCase stays OPEN"
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "ComplianceCase reaches SUBSTANTIATED or UNFOUNDED (bubble-up from case decision)"
        actor: system
        preconditions: []
        side_effects:
          - "Incident -> RESOLVED"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /incidents/{id}/close"
        actor: Provider
        preconditions:
          - "Linked ComplianceCase.status == CLOSED"
        side_effects:
          - "Incident -> CLOSED"

  - entity: ComplianceCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /compliance-cases/{id}/substantiate"
        actor: Provider
        preconditions:
          - "citation_code provided"
        side_effects:
          - "Case -> SUBSTANTIATED; correction_plan_due_at = now + 14 days"
          - "Linked Incident -> RESOLVED (bubble-up)"
          - "Home.open_case_count recomputed"
          - "If citation_code starts with WAC388-76-10 then Home -> SUSPENDED (cross-entity cascade; blocks new admissions)"
      - from: OPEN
        to: UNFOUNDED
        trigger: "POST /compliance-cases/{id}/mark-unfounded"
        actor: Provider
        preconditions: []
        side_effects:
          - "Case -> UNFOUNDED; linked Incident -> RESOLVED; Home.open_case_count recomputed"
      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "POST /compliance-cases/{id}/close (with correction_plan_submitted_at)"
        actor: Provider
        preconditions:
          - "correction_plan_submitted_at present and <= correction_plan_due_at (late plans return ERR_LATE_CORRECTION_PLAN)"
        side_effects:
          - "Case -> CLOSED; Home.open_case_count recomputed"
      - from: UNFOUNDED
        to: CLOSED
        trigger: "POST /compliance-cases/{id}/close"
        actor: Provider
        preconditions: []
        side_effects:
          - "Case -> CLOSED; Home.open_case_count recomputed"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: Provider
        preconditions:
          - "Invoice has at least one line item"
        side_effects:
          - "Late fee evaluated against logical clock vs due_date; total_cents finalized; Invoice -> ISSUED"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: Provider
        preconditions: []
        side_effects:
          - "Invoice -> VOID; never payable"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /payments with amount_cents < outstanding balance"
        actor: Provider
        preconditions:
          - "Invoice.status == ISSUED"
        side_effects:
          - "Invoice -> PARTIALLY_PAID"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void (only when no payments recorded)"
        actor: Provider
        preconditions:
          - "No Payment rows exist for this invoice"
        side_effects:
          - "Invoice -> VOID"
      - from: ISSUED
        to: PAID
        trigger: "POST /payments with amount_cents == outstanding balance"
        actor: Provider
        preconditions: []
        side_effects:
          - "Invoice -> PAID"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /payments bringing cumulative payments to total_cents"
        actor: Provider
        preconditions:
          - "Payment amount must not exceed outstanding balance (overpayment -> ERR_OVERPAYMENT)"
        side_effects:
          - "Invoice -> PAID"

# ---------------------------------------------------------------------------
# §1.2.1  Concurrency Rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: admission-create-stale-bed
    parent_entity: Bed
    write_endpoint: "POST /admissions"
    occ_field: "expected_bed_version"
    description: |
      Creating an Admission against a Bed whose version has advanced since the
      client last observed it is rejected. Another writer may have just taken
      the bed out of service or had a competing admission hold it; the current
      writer's view of the bed is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: shift-create-stale-caregiver
    parent_entity: Caregiver
    write_endpoint: "POST /shifts"
    occ_field: "expected_caregiver_version"
    description: |
      Creating a Shift against a Caregiver whose version has advanced since the
      client last observed it is rejected. A credential or status change (for
      example suspension) may have landed in between, so the stale write is
      refused rather than silently re-validated against old data.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: invoice-generate-stale-resident
    parent_entity: Resident
    write_endpoint: "POST /residents/{id}/invoices/generate"
    occ_field: "expected_resident_version"
    description: |
      Generating an Invoice against a Resident whose version has advanced since
      the client last observed it is rejected. A payer-type change or discharge
      in between changes which rate schedule and which occupancy window apply;
      the stale generation is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3  Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: invoice_window_provisional
    trigger: "POST /residents/{id}/invoices/generate while the resident is still ADMITTED (in-stay billing estimate)"
    algorithm: forward_looking
    formula: |
      occupied_days = for each local date d in [period_start, period_end):
        include d when a Bed-stay exists: resident ADMITTED and admitted_at <= d_end AND
        (discharged_at is null OR discharged_at > d_start)
        where [d_start, d_end) is the home-timezone day containing d.
      Projected days through period_end are counted even though they have not elapsed.
      For each included day select the RateSchedule with matching payer_type_snapshot where
      effective_from <= d < effective_to (or effective_to null); overlapping schedules are
      forbidden by validation so the selector is unique; missing schedule -> ERR_RATE_NOT_FOUND.
      PRIVATE_PAY line per day: room_and_board_daily_cents + band_add_on(band pinned from the
      resident's current FINALIZED assessment).
      MEDICAID line per day: medicaid_acuity_rate(band, schedule).
      Each line amount is rounded to cents (already integer cents); line sum = subtotal_cents.
    input_set: "Residents with status == ADMITTED at generation time; days in [period_start, period_end) including future days"
    constants:
      ROUNDING: "integer cents per line; sum of rounded lines (round per line, then sum)"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "resident ADMITTED; window extends into the future"
        difference: "Future days inside [period_start, period_end) are projected and billed forward-looking"

  - name: invoice_window_final
    trigger: "POST /residents/{id}/invoices/generate after the resident is DISCHARGED (final bill)"
    algorithm: chronological
    formula: |
      occupied_days = for each local date d in [period_start, period_end):
        include d only when admitted_at <= d_end AND discharged_at > d_start
        (chronological replay of the actual stay; nothing projected).
      Partial discharge day: the calendar day containing discharged_at is INCLUDED
      (charged) because discharged_at > d_start of that day.
      Per-day rates use the same pinned RateSchedule selector as invoice_window_provisional
      and the band pinned from the FINALIZED assessment that was current at discharge time.
      Rounding order is identical: round per line, then sum.
    input_set: "Residents with status == DISCHARGED; only elapsed days of the actual stay"
    constants:
      ROUNDING: "integer cents per line; sum of rounded lines"
    precision: "integer cents"
    variants:
      - name: final
        when: "resident DISCHARGED"
        difference: "No future projection; identical [period_start, period_end) yields a smaller (or equal) subtotal than the provisional variant whenever the period extends beyond discharged_at"

  - name: medicaid_acuity_rate
    trigger: "Per-day Medicaid line computation inside invoice_window_* calculations"
    algorithm: tiered_pricing
    formula: |
      Band selection (from FINALIZED assessment fields):
        LOW    when adl_dependency_score <= 2 AND nursing_hours_per_week < 5
        HIGH   when adl_dependency_score >= 5 OR  nursing_hours_per_week >= 15
        MEDIUM otherwise
      MEDICAID daily rate (non-linear interaction of three inputs: R&B floor, band add-on, nursing cap):
        daily = room_and_board_daily_cents
              + band_add_on where LOW -> care_low_daily_cents,
                                MEDIUM -> care_medium_daily_cents,
                                HIGH   -> care_high_daily_cents
              + nursing_component = min(nursing_hours_per_week * 1500, 9000) / 7
        The nursing_component is prorated per day (weekly hours / 7) and truncated to cents;
        final daily rate = round_half_up(daily) to integer cents.
      PRIVATE_PAY uses the same band for the add-on but SKIPS the nursing_component entirely
      (medicaid-only state supplement): daily = room_and_board_daily_cents + band_add_on.
    input_set: "One FINALIZED Assessment (latest by assessed_at; tie-break created_at ASC) per resident plus one RateSchedule day"
    constants:
      NURSING_HOURLY_CENTS: 1500
      NURSING_WEEKLY_CAP_CENTS: 9000
      DAYS_PER_WEEK: 7
      LOW_ADL_MAX: 2
      HIGH_ADL_MIN: 5
      LOW_NURSING_HOURS_MAX_EXCLUSIVE: 5
      HIGH_NURSING_HOURS_MIN: 15
    precision: "integer cents, round_half_up on the final daily rate; nursing_component truncated before summing"
    variants:
      - name: medicaid
        when: "payer_type_snapshot == MEDICAID"
        difference: "Includes prorated, capped nursing_component"
      - name: private_pay
        when: "payer_type_snapshot == PRIVATE_PAY"
        difference: "Same band add-on but no nursing_component; identical inputs produce a lower daily rate than the medicaid variant"

  - name: late_fee
    trigger: "POST /invoices/{id}/issue when the logical clock date is strictly after due_date"
    algorithm: threshold
    formula: |
      if current_date > due_date (home-local date of the logical clock):
        raw = subtotal_cents * 5 / 100
        late_fee_cents = min(max(round_half_up(raw), 2500), 15000)
      else:
        late_fee_cents = 0
      Boundary: issue on due_date exactly (current_date == due_date) incurs NO fee (strictly-greater semantics).
      total_cents = subtotal_cents + late_fee_cents.
    input_set: "One DRAFT invoice at issue time"
    constants:
      RATE_NUMERATOR: 5
      RATE_DENOMINATOR: 100
      MIN_FEE_CENTS: 2500
      MAX_FEE_CENTS: 15000
    precision: "integer cents, round_half_up before clamping"

  - name: staffing_ratio
    trigger: "POST /shifts (validate new shift does not break ratio is NOT required — instead every shift creation and cancellation validates the FORWARD window) and GET /homes/{id}/staffing-compliance"
    algorithm: interval_merge
    formula: |
      Sweep the union of all SCHEDULED (non-cancelled) shift intervals for the home,
      split at every shift boundary into atomic half-open segments [t_i, t_{i+1}).
      For each segment:
        on_duty = count of SCHEDULED shifts covering the segment (start_at <= t < end_at)
        Day segments (any overlap with 06:00-22:00 local and no overlap with 22:00-06:00):
          required = ceil(current_census_at_that_time / 4)
        Overnight segments (any overlap with 22:00-06:00 local):
          AWAKE shifts count individually; required = ceil(census / 2) covered by AWAKE-qualified
          caregivers, OR the segment passes if at least one AWAKE-qualified caregiver covers it
          AND total on_duty >= ceil(census / 3) (mixed AWAKE/ASLEEP staffing).
        Segment is NON_COMPLIANT when on_duty < required.
      Shift creation is rejected with ERR_UNDERSTAFFED when its addition would leave any
      currently-occupied hour (home has census > 0 during that hour) NON_COMPLIANT.
      Shift cancellation is rejected with ERR_UNDERSTAFFED when removal makes an occupied
      hour NON_COMPLIANT.
      Interval semantics: half-open [start_at, end_at); two shifts that merely touch at an
      endpoint do NOT overlap and do NOT both cover the boundary instant.
    input_set: "All Shift rows with status == SCHEDULED for the home; census from Home.current_census"
    constants:
      DAY_RATIO_NUMERATOR: 1
      DAY_RATIO_DENOMINATOR: 4
      AWAKE_OVERNIGHT_RATIO_DENOMINATOR: 2
      MIXED_OVERNIGHT_RATIO_DENOMINATOR: 3
      DAY_START_LOCAL: "06:00"
      DAY_END_LOCAL: "22:00"
    precision: "integer caregiver counts via ceil"

  - name: med_admin_window
    trigger: "POST /medication-logs (validation) — the administration must fall inside an open window"
    algorithm: threshold
    formula: |
      For the order's schedule_times, the window for scheduled time T on local date D is
      the half-open interval [T - 60 minutes, T + 60 minutes).
      administered_at must fall inside SOME window of the order AND no other MedicationLog
      with outcome == GIVEN or SELF_ADMINISTERED exists in the SAME window for the SAME order
      (duplicate dose detection).
      Boundary: administered_at == T - 60min exactly is INSIDE (inclusive lower bound);
      administered_at == T + 60min exactly is OUTSIDE (exclusive upper bound).
      Outcomes REFUSED and HELD do not consume the window (a later GIVEN inside the same
      window is permitted).
    input_set: "One MedicationOrder (must be ACTIVE) and all its MedicationLog rows"
    constants:
      WINDOW_BEFORE_MINUTES: 60
      WINDOW_AFTER_MINUTES: 60
    precision: "minute granularity on logical clock"

  - name: caregiver_overlap_check
    trigger: "POST /shifts — a caregiver may not hold two SCHEDULED shifts that overlap"
    algorithm: interval_merge
    formula: |
      New shift [s, e) conflicts with an existing SCHEDULED shift [s2, e2) for the same
      caregiver when s < e2 AND s2 < e (strict half-open overlap).
      Back-to-back shifts (e == s2 or s == e2) do NOT conflict.
      Aggregate-capacity variant (different semantics from staffing_ratio): total SCHEDULED
      hours for one caregiver in any rolling 24-hour window must stay <= 16; the rolling
      window slides in 1-minute steps, so touching intervals still accumulate.
    input_set: "All SCHEDULED shifts of the caregiver"
    constants:
      MAX_HOURS_PER_ROLLING_24H: 16
      ROLLING_STEP_MINUTES: 1
    precision: "minute granularity"

  - name: discharge_refund
    trigger: "POST /residents/{id}/discharge"
    algorithm: waterfall_allocation
    formula: |
      prepaid = sum of Payment.amount_cents across all the resident's PAID/ISSUED invoices'
      payments attributable to room_and_board lines dated strictly AFTER discharged_at's date
      (payments map to invoices; invoice line_items carry the day).
      Refund waterfall: prepaid_room_and_board_after_discharge
        -> minus outstanding balances on any ISSUED/PARTIALLY_PAID invoices (oldest invoice
           by period_start first; tie-break created_at ASC)
        -> remainder is refund_amount_cents (floor 0; no negative refunds).
    input_set: "Resident's Payment rows, Invoice rows and their line_items"
    constants:
      REFUND_FLOOR_CENTS: 0
    precision: "integer cents"

  - name: report_deadline_check
    trigger: "POST /incidents (creation-time evaluation for severity MAJOR/CRITICAL) and POST /incidents/{id}/open-case"
    algorithm: threshold
    formula: |
      delay_hours = (reported_at - occurred_at) in whole minutes / 60
      MAJOR/CRITICAL filed with delay_hours > 24 sets a late_flag (the incident is accepted
      but the subsequent open-case transition is refused with ERR_LATE_REPORT).
      Boundary: delay_hours exactly == 24 is NOT late (strictly-greater semantics on 24);
      delay 24h00m passes, 24h01m fails.
    input_set: "The incident being filed"
    constants:
      REPORT_DEADLINE_HOURS: 24
    precision: "whole minutes"

# ---------------------------------------------------------------------------
# §1.4  Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every id referenced in path and body exists (resident, bed, assessment, caregiver, invoice, order, home), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "OCC expected_<parent>_version matches the parent's current version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /admissions, POST /shifts, POST /residents/{id}/invoices/generate"
  - priority: 5
    category: state
    check: "Target resource is in a state that permits the transition (state-machine from-state and terminal lockdown)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: the Provider approving an admission must not be the same X-User-ID that created it"
    error_id: ERR_SELF_APPROVAL
    http_status: 409
    applies_to: "POST /admissions/{id}/approve"
  - priority: 7
    category: business_safety
    check: "CRITICAL incident with status IN {REPORTED, UNDER_REVIEW} blocks resident discharge; occupied bed blocks take-out-of-service"
    error_id: ERR_BLOCKED_BY_INCIDENT
    http_status: 409
    applies_to: "POST /residents/{id}/discharge"
  - priority: 8
    category: business_safety
    check: "Late state report: MAJOR/CRITICAL incident filed more than 24h after occurred_at cannot open a compliance case"
    error_id: ERR_LATE_REPORT
    http_status: 422
    applies_to: "POST /incidents/{id}/open-case"
  - priority: 9
    category: business_temporal
    check: "Med administration outside every open window for the order, or duplicate GIVEN in the same window"
    error_id: ERR_OUTSIDE_MED_WINDOW
    http_status: 422
    applies_to: "POST /medication-logs"
  - priority: 10
    category: business_temporal
    check: "Caregiver shift overlap (half-open) or > 16 scheduled hours in a rolling 24h window"
    error_id: ERR_SHIFT_CONFLICT
    http_status: 409
    applies_to: "POST /shifts"
  - priority: 11
    category: business_temporal
    check: "Shift creation or cancellation would leave an occupied hour below the required staffing ratio"
    error_id: ERR_UNDERSTAFFED
    http_status: 422
    applies_to: "POST /shifts, POST /shifts/{id}/cancel"
  - priority: 12
    category: business_constraint
    check: "Bed certification: MEDICAID resident admissions require bed.medicaid_certified == true"
    error_id: ERR_BED_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /admissions"
  - priority: 13
    category: business_constraint
    check: "Discharge notice: notice_days >= 30 unless reason IN {HOSPITALIZATION, DECEASED}"
    error_id: ERR_INSUFFICIENT_NOTICE
    http_status: 422
    applies_to: "POST /residents/{id}/discharge"
  - priority: 14
    category: business_constraint
    check: "Admission pinned assessment must still be FINALIZED at approval time"
    error_id: ERR_ASSESSMENT_SUPERSEDED
    http_status: 409
    applies_to: "POST /admissions/{id}/approve"
  - priority: 15
    category: business_referential
    check: "MedicationLog.caregiver_id and ADLLog.caregiver_id must reference a caregiver with a SCHEDULED shift covering the performed/administered timestamp"
    error_id: ERR_CAREGIVER_NOT_ON_SHIFT
    http_status: 422
    applies_to: "POST /medication-logs, POST /adl-logs"
  - priority: 16
    category: business_referential
    check: "MedicationOrder must be ACTIVE to accept new MedicationLog rows"
    error_id: ERR_ORDER_DISCONTINUED
    http_status: 409
    applies_to: "POST /medication-logs"
  - priority: 17
    category: business_fiscal
    check: "Rate schedule exists and is non-overlapping for every occupied day; capacity: current_census < licensed_bed_capacity on admission completion"
    error_id: ERR_RATE_NOT_FOUND
    http_status: 422
    applies_to: "POST /residents/{id}/invoices/generate"
  - priority: 18
    category: business_fiscal
    check: "Payment amount_cents > 0 and <= outstanding balance of the invoice"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /payments"
  - priority: 19
    category: business_fiscal
    check: "Admission completion blocked when home census is already at licensed capacity"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /admissions/{id}/complete"
  - priority: 20
    category: business_constraint
    check: "Correction plan submitted on or before correction_plan_due_at when closing a SUBSTANTIATED case"
    error_id: ERR_LATE_CORRECTION_PLAN
    http_status: 422
    applies_to: "POST /compliance-cases/{id}/close"
  - priority: 21
    category: business_constraint
    check: "Occupied bed cannot be taken out of service"
    error_id: ERR_BED_OCCUPIED
    http_status: 409
    applies_to: "POST /beds/{id}/take-out-of-service"
  - priority: 22
    category: business_constraint
    check: "Malformed payload: missing required field, wrong type, enum outside declared set, end <= start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# ---------------------------------------------------------------------------
# §1.5  API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time. All timestamps this scaffold calls 'now' come from this clock."
    roles: [Provider]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["All subsequent reported_at/decided_at/discharged_at stamps and late-fee/deadline checks use the new clock value"]

  # --- Home ---
  - method: POST
    path: "/api/homes"
    description: "Register a new adult family home (starts PROVISIONAL)"
    roles: [Provider]
    code: 201
    input: [license_number, name, licensed_bed_capacity, "timezone?"]
    output: Home
    side_effects: []
  - method: GET
    path: "/api/homes"
    description: "List homes with pagination"
    roles: [Provider, Nurse, CaregiverRole]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Home[]
    side_effects: []
  - method: GET
    path: "/api/homes/{id}"
    description: "Get one home including computed open_case_count and current_census"
    roles: [Provider, Nurse, CaregiverRole]
    code: 200
    input: []
    output: Home
    side_effects: []
  - method: POST
    path: "/api/homes/{id}/license"
    description: "Transition PROVISIONAL -> LICENSED"
    roles: [Provider]
    code: 200
    input: []
    output: Home
    side_effects: ["Home.version increments by 1"]
  - method: POST
    path: "/api/homes/{id}/suspend"
    description: "Transition LICENSED -> SUSPENDED"
    roles: [Provider]
    code: 200
    input: []
    output: Home
    side_effects: ["Home.version increments by 1"]
  - method: POST
    path: "/api/homes/{id}/reinstate"
    description: "Transition SUSPENDED -> LICENSED; requires open_case_count == 0"
    roles: [Provider]
    code: 200
    input: []
    output: Home
    side_effects: ["Home.version increments by 1"]
  - method: POST
    path: "/api/homes/{id}/close"
    description: "Transition to CLOSED (terminal); cascades beds and shifts"
    roles: [Provider]
    code: 200
    input: []
    output: Home
    side_effects: ["Beds -> OUT_OF_SERVICE", "SCHEDULED shifts -> CANCELLED", "Home.version increments by 1"]
  - method: GET
    path: "/api/homes/{id}/staffing-compliance"
    description: "Run staffing_ratio over a window and return per-segment compliance"
    roles: [Provider, Nurse]
    code: 200
    input: [from_iso8601, to_iso8601]
    output: { segments: array, compliant: boolean }
    side_effects: []

  # --- Bed ---
  - method: POST
    path: "/api/homes/{id}/beds"
    description: "Add a bed to a home"
    roles: [Provider]
    code: 201
    input: [label, "medicaid_certified?"]
    output: Bed
    side_effects: []
  - method: GET
    path: "/api/homes/{id}/beds"
    description: "List beds of a home (FK reverse-reachability for Bed.home_id)"
    roles: [Provider, Nurse, CaregiverRole]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Bed[]
    side_effects: []
  - method: GET
    path: "/api/beds/{id}"
    description: "Get one bed"
    roles: [Provider, Nurse]
    code: 200
    input: []
    output: Bed
    side_effects: []
  - method: POST
    path: "/api/beds/{id}/take-out-of-service"
    description: "AVAILABLE/HELD -> OUT_OF_SERVICE; HELD forces linked PENDING admission to REJECTED; OCCUPIED -> ERR_BED_OCCUPIED"
    roles: [Provider]
    code: 200
    input: []
    output: Bed
    side_effects: ["Linked PENDING Admission -> REJECTED (compensation)", "Bed.version increments by 1"]
  - method: POST
    path: "/api/beds/{id}/return-to-service"
    description: "OUT_OF_SERVICE -> AVAILABLE"
    roles: [Provider]
    code: 200
    input: []
    output: Bed
    side_effects: ["Bed.version increments by 1"]

  # --- Resident ---
  - method: POST
    path: "/api/homes/{id}/residents"
    description: "Register a prospective resident (starts PROSPECT)"
    roles: [Provider, Nurse]
    code: 201
    input: [full_name, date_of_birth, payer_type]
    output: Resident
    side_effects: []
  - method: GET
    path: "/api/homes/{id}/residents"
    description: "List residents of a home (FK reverse-reachability for Resident.home_id)"
    roles: [Provider, Nurse, CaregiverRole]
    code: 200
    input: ["limit?", "offset?", "status?", "payer_type?"]
    output: Resident[]
    side_effects: []
  - method: GET
    path: "/api/residents/{id}"
    description: "Get one resident"
    roles: [Provider, Nurse, CaregiverRole]
    code: 200
    input: []
    output: Resident
    side_effects: []
  - method: POST
    path: "/api/residents/{id}/withdraw"
    description: "APPLICANT -> PROSPECT when no live admission exists"
    roles: [Provider]
    code: 200
    input: []
    output: Resident
    side_effects: ["Resident.version increments by 1"]
  - method: POST
    path: "/api/residents/{id}/discharge"
    description: "ADMITTED -> DISCHARGED; creates DischargeRecord; computes discharge_refund; cascades bed and medication orders"
    roles: [Provider]
    code: 200
    input: [reason, notice_days]
    output: DischargeRecord
    side_effects:
      - "Bed -> AVAILABLE"
      - "ACTIVE MedicationOrders -> DISCONTINUED"
      - "Home.current_census recomputed"
      - "discharge_refund computed onto refund_amount_cents"
      - "Resident.version increments by 1"

  # --- Assessment / care plan ---
  - method: POST
    path: "/api/residents/{id}/assessments"
    description: "Create a DRAFT assessment with care plan"
    roles: [Nurse]
    code: 201
    input: [nursing_hours_per_week, adl_dependency_score, care_plan]
    output: Assessment
    side_effects: []
  - method: GET
    path: "/api/residents/{id}/assessments"
    description: "List assessments of a resident (FK reverse-reachability for Assessment.resident_id)"
    roles: [Provider, Nurse]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Assessment[]
    side_effects: []
  - method: GET
    path: "/api/assessments/{id}"
    description: "Get one assessment"
    roles: [Provider, Nurse]
    code: 200
    input: []
    output: Assessment
    side_effects: []
  - method: POST
    path: "/api/assessments/{id}/finalize"
    description: "DRAFT -> FINALIZED; supersedes prior FINALIZED assessment; promotes PROSPECT resident to APPLICANT"
    roles: [Nurse]
    code: 200
    input: []
    output: Assessment
    side_effects: ["Prior FINALIZED assessment -> SUPERSEDED", "PROSPECT resident -> APPLICANT", "Assessment.version increments by 1"]

  # --- Admission ---
  - method: POST
    path: "/api/admissions"
    description: "Create a PENDING admission (holds the bed). OCC-guarded on Bed.version via expected_bed_version."
    roles: [Provider]
    code: 201
    input: [resident_id, bed_id, assessment_id, expected_admission_date, expected_bed_version]
    output: Admission
    side_effects: ["Bed AVAILABLE -> HELD", "Bed.version increments by 1"]
  - method: GET
    path: "/api/admissions"
    description: "List admissions, filterable (FK reverse-reachability for Admission.resident_id, Admission.bed_id, and Admission.assessment_id)"
    roles: [Provider, Nurse]
    code: 200
    input: ["limit?", "offset?", "resident_id?", "bed_id?", "assessment_id?", "status?"]
    output: Admission[]
    side_effects: []
  - method: GET
    path: "/api/admissions/{id}"
    description: "Get one admission"
    roles: [Provider, Nurse]
    code: 200
    input: []
    output: Admission
    side_effects: []
  - method: POST
    path: "/api/admissions/{id}/approve"
    description: "PENDING -> APPROVED; segregation of duties enforced"
    roles: [Provider]
    code: 200
    input: []
    output: Admission
    side_effects: ["decided_by/decided_at stamped", "Admission.version increments by 1"]
  - method: POST
    path: "/api/admissions/{id}/reject"
    description: "PENDING -> REJECTED; releases bed hold"
    roles: [Provider]
    code: 200
    input: []
    output: Admission
    side_effects: ["Held Bed -> AVAILABLE", "Bed.version increments by 1", "Admission.version increments by 1"]
  - method: POST
    path: "/api/admissions/{id}/cancel"
    description: "APPROVED -> CANCELLED; releases bed hold"
    roles: [Provider]
    code: 200
    input: []
    output: Admission
    side_effects: ["Held Bed -> AVAILABLE", "Bed.version increments by 1", "Admission.version increments by 1"]
  - method: POST
    path: "/api/admissions/{id}/complete"
    description: "APPROVED -> COMPLETED; resident ADMITTED; bed OCCUPIED; capacity enforced"
    roles: [Provider]
    code: 200
    input: []
    output: Admission
    side_effects: ["Resident -> ADMITTED", "Bed -> OCCUPIED", "Home.current_census recomputed", "Bed.version increments by 1", "Resident.version increments by 1", "Admission.version increments by 1"]

  # --- Medication orders & logs ---
  - method: POST
    path: "/api/residents/{id}/medication-orders"
    description: "Create an ACTIVE medication order for an ADMITTED resident"
    roles: [Nurse]
    code: 201
    input: [drug_name, dose, schedule_times]
    output: MedicationOrder
    side_effects: []
  - method: GET
    path: "/api/residents/{id}/medication-orders"
    description: "List medication orders of a resident (FK reverse-reachability for MedicationOrder.resident_id)"
    roles: [Provider, Nurse, CaregiverRole]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: MedicationOrder[]
    side_effects: []
  - method: POST
    path: "/api/medication-orders/{id}/discontinue"
    description: "ACTIVE -> DISCONTINUED"
    roles: [Nurse]
    code: 200
    input: []
    output: MedicationOrder
    side_effects: ["MedicationOrder.version increments by 1"]
  - method: POST
    path: "/api/medication-logs"
    description: "Log an administration; window + duplicate + on-shift validation"
    roles: [Nurse, CaregiverRole]
    code: 201
    input: [resident_id, order_id, administered_at, outcome, caregiver_id, "note?"]
    output: MedicationLog
    side_effects: []
  - method: GET
    path: "/api/medication-logs"
    description: "List medication logs (FK reverse-reachability for MedicationLog.resident_id, MedicationLog.order_id, and MedicationLog.caregiver_id)"
    roles: [Provider, Nurse]
    code: 200
    input: ["limit?", "offset?", "resident_id?", "order_id?", "caregiver_id?"]
    output: MedicationLog[]
    side_effects: []
  - method: GET
    path: "/api/medication-logs/{id}"
    description: "Get one medication log"
    roles: [Provider, Nurse]
    code: 200
    input: []
    output: MedicationLog
    side_effects: []

  # --- ADL logs ---
  - method: POST
    path: "/api/adl-logs"
    description: "Log ADL assistance; on-shift validation"
    roles: [Nurse, CaregiverRole]
    code: 201
    input: [resident_id, adl_type, assistance_level, performed_at, caregiver_id]
    output: ADLLog
    side_effects: []
  - method: GET
    path: "/api/adl-logs"
    description: "List ADL logs (FK reverse-reachability for ADLLog.resident_id and ADLLog.caregiver_id)"
    roles: [Provider, Nurse]
    code: 200
    input: ["limit?", "offset?", "resident_id?", "caregiver_id?"]
    output: ADLLog[]
    side_effects: []
  - method: GET
    path: "/api/adl-logs/{id}"
    description: "Get one ADL log"
    roles: [Provider, Nurse]
    code: 200
    input: []
    output: ADLLog
    side_effects: []

  # --- Caregivers & shifts ---
  - method: POST
    path: "/api/homes/{id}/caregivers"
    description: "Register a caregiver"
    roles: [Provider]
    code: 201
    input: [full_name, credential_id, "awake_overnight_qualified?"]
    output: Caregiver
    side_effects: []
  - method: GET
    path: "/api/homes/{id}/caregivers"
    description: "List caregivers of a home (FK reverse-reachability for Caregiver.home_id)"
    roles: [Provider, Nurse]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Caregiver[]
    side_effects: []
  - method: GET
    path: "/api/caregivers/{id}"
    description: "Get one caregiver"
    roles: [Provider, Nurse, CaregiverRole]
    code: 200
    input: []
    output: Caregiver
    side_effects: []
  - method: POST
    path: "/api/caregivers/{id}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [Provider]
    code: 200
    input: []
    output: Caregiver
    side_effects: ["Caregiver.version increments by 1"]
  - method: POST
    path: "/api/caregivers/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE"
    roles: [Provider]
    code: 200
    input: []
    output: Caregiver
    side_effects: ["Caregiver.version increments by 1"]
  - method: POST
    path: "/api/caregivers/{id}/terminate"
    description: "ACTIVE/SUSPENDED -> TERMINATED (terminal); future SCHEDULED shifts are CANCELLED"
    roles: [Provider]
    code: 200
    input: []
    output: Caregiver
    side_effects: ["Future SCHEDULED shifts (start_at after now) -> CANCELLED", "Caregiver.version increments by 1"]
  - method: POST
    path: "/api/shifts"
    description: "Schedule a shift; overlap, rolling-16h, and forward staffing-ratio validated. OCC-guarded on Caregiver.version via expected_caregiver_version."
    roles: [Provider]
    code: 201
    input: [home_id, caregiver_id, start_at, end_at, "overnight_mode?", expected_caregiver_version]
    output: Shift
    side_effects: ["Caregiver.version increments by 1"]
  - method: GET
    path: "/api/shifts"
    description: "List shifts (FK reverse-reachability for Shift.home_id and Shift.caregiver_id)"
    roles: [Provider, Nurse]
    code: 200
    input: ["limit?", "offset?", "home_id?", "caregiver_id?", "status?"]
    output: Shift[]
    side_effects: []
  - method: GET
    path: "/api/shifts/{id}"
    description: "Get one shift"
    roles: [Provider, Nurse]
    code: 200
    input: []
    output: Shift
    side_effects: []
  - method: POST
    path: "/api/shifts/{id}/cancel"
    description: "SCHEDULED -> CANCELLED when staffing ratio stays satisfied"
    roles: [Provider]
    code: 200
    input: []
    output: Shift
    side_effects: ["Shift.version increments by 1"]

  # --- Incidents & compliance ---
  - method: POST
    path: "/api/incidents"
    description: "File an incident (stamps reported_at from the logical clock)"
    roles: [Provider, Nurse, CaregiverRole]
    code: 201
    input: [resident_id, incident_type, severity, occurred_at, description]
    output: Incident
    side_effects: ["late flag evaluated by report_deadline_check"]
  - method: GET
    path: "/api/incidents"
    description: "List incidents (FK reverse-reachability for Incident.resident_id)"
    roles: [Provider, Nurse]
    code: 200
    input: ["limit?", "offset?", "resident_id?", "status?", "severity?"]
    output: Incident[]
    side_effects: []
  - method: GET
    path: "/api/incidents/{id}"
    description: "Get one incident"
    roles: [Provider, Nurse]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: POST
    path: "/api/incidents/{id}/open-case"
    description: "REPORTED -> UNDER_REVIEW; creates linked ComplianceCase (OPEN); late reports refused"
    roles: [Provider]
    code: 201
    input: []
    output: ComplianceCase
    side_effects: ["Incident -> UNDER_REVIEW", "ComplianceCase created OPEN", "Home.open_case_count recomputed", "Incident.version increments by 1", "Home.version increments by 1"]
  - method: POST
    path: "/api/incidents/{id}/reopen"
    description: "UNDER_REVIEW -> REPORTED while case still OPEN"
    roles: [Provider]
    code: 200
    input: []
    output: Incident
    side_effects: ["Incident.version increments by 1"]
  - method: POST
    path: "/api/incidents/{id}/close"
    description: "RESOLVED -> CLOSED when the linked case is CLOSED"
    roles: [Provider]
    code: 200
    input: []
    output: Incident
    side_effects: ["Incident.version increments by 1"]
  - method: POST
    path: "/api/incidents/{id}/close-minor"
    description: "REPORTED -> CLOSED for MINOR severity only"
    roles: [Provider]
    code: 200
    input: []
    output: Incident
    side_effects: ["Incident.version increments by 1"]
  - method: GET
    path: "/api/compliance-cases"
    description: "List compliance cases (FK reverse-reachability for ComplianceCase.home_id and ComplianceCase.incident_id)"
    roles: [Provider, Nurse]
    code: 200
    input: ["limit?", "offset?", "home_id?", "incident_id?", "status?"]
    output: ComplianceCase[]
    side_effects: []
  - method: GET
    path: "/api/compliance-cases/{id}"
    description: "Get one compliance case"
    roles: [Provider, Nurse]
    code: 200
    input: []
    output: ComplianceCase
    side_effects: []
  - method: POST
    path: "/api/compliance-cases/{id}/substantiate"
    description: "OPEN -> SUBSTANTIATED; sets correction_plan_due_at; may suspend the home on abuse citations"
    roles: [Provider]
    code: 200
    input: [citation_code]
    output: ComplianceCase
    side_effects: ["Incident -> RESOLVED", "Home.open_case_count recomputed", "If citation_code starts WAC388-76-10: Home -> SUSPENDED", "ComplianceCase.version increments by 1", "Incident.version increments by 1", "Home.version increments by 1"]
  - method: POST
    path: "/api/compliance-cases/{id}/mark-unfounded"
    description: "OPEN -> UNFOUNDED"
    roles: [Provider]
    code: 200
    input: []
    output: ComplianceCase
    side_effects: ["Incident -> RESOLVED", "Home.open_case_count recomputed", "ComplianceCase.version increments by 1", "Incident.version increments by 1", "Home.version increments by 1"]
  - method: POST
    path: "/api/compliance-cases/{id}/close"
    description: "SUBSTANTIATED (on-time plan) or UNFOUNDED -> CLOSED"
    roles: [Provider]
    code: 200
    input: ["correction_plan_submitted_at?"]
    output: ComplianceCase
    side_effects: ["Home.open_case_count recomputed", "ComplianceCase.version increments by 1", "Home.version increments by 1"]

  # --- Billing ---
  - method: POST
    path: "/api/homes/{id}/rate-schedules"
    description: "Publish a rate schedule; overlapping effective windows for the same payer_type rejected"
    roles: [Provider]
    code: 201
    input: [payer_type, room_and_board_daily_cents, care_low_daily_cents, care_medium_daily_cents, care_high_daily_cents, effective_from, "effective_to?"]
    output: RateSchedule
    side_effects: []
  - method: GET
    path: "/api/homes/{id}/rate-schedules"
    description: "List rate schedules of a home (FK reverse-reachability for RateSchedule.home_id)"
    roles: [Provider, Nurse]
    code: 200
    input: ["limit?", "offset?", "payer_type?"]
    output: RateSchedule[]
    side_effects: []
  - method: POST
    path: "/api/residents/{id}/invoices/generate"
    description: "Generate a DRAFT invoice for [period_start, period_end). Runs invoice_window_provisional when ADMITTED, invoice_window_final when DISCHARGED. OCC-guarded on Resident.version via expected_resident_version."
    roles: [Provider]
    code: 201
    input: [period_start, period_end, due_date, expected_resident_version]
    output: Invoice
    side_effects: ["line_items/subtotal_cents computed", "payer_type_snapshot pinned", "Resident.version increments by 1"]
  - method: GET
    path: "/api/residents/{id}/invoices"
    description: "List invoices of a resident (FK reverse-reachability for Invoice.resident_id)"
    roles: [Provider, Nurse]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/api/invoices/{id}"
    description: "Get one invoice with line items"
    roles: [Provider, Nurse]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/api/invoices/{id}/issue"
    description: "DRAFT -> ISSUED; late fee evaluated against the logical clock"
    roles: [Provider]
    code: 200
    input: []
    output: Invoice
    side_effects: ["late_fee computed", "Invoice.version increments by 1"]
  - method: POST
    path: "/api/invoices/{id}/void"
    description: "DRAFT/ISSUED -> VOID (ISSUED only with zero payments)"
    roles: [Provider]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice.version increments by 1"]
  - method: POST
    path: "/api/payments"
    description: "Record a payment against an ISSUED or PARTIALLY_PAID invoice"
    roles: [Provider]
    code: 201
    input: [resident_id, invoice_id, amount_cents, method]
    output: Payment
    side_effects: ["Invoice status may advance to PARTIALLY_PAID or PAID", "Invoice.version increments by 1"]
  - method: GET
    path: "/api/payments"
    description: "List payments (FK reverse-reachability for Payment.resident_id and Payment.invoice_id)"
    roles: [Provider, Nurse]
    code: 200
    input: ["limit?", "offset?", "resident_id?", "invoice_id?"]
    output: Payment[]
    side_effects: []
  - method: GET
    path: "/api/payments/{id}"
    description: "Get one payment"
    roles: [Provider, Nurse]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # --- Discharge records ---
  - method: GET
    path: "/api/discharge-records"
    description: "List discharge records (FK reverse-reachability for DischargeRecord.resident_id)"
    roles: [Provider, Nurse]
    code: 200
    input: ["limit?", "offset?", "resident_id?"]
    output: DischargeRecord[]
    side_effects: []
  - method: GET
    path: "/api/discharge-records/{id}"
    description: "Get one discharge record"
    roles: [Provider, Nurse]
    code: 200
    input: []
    output: DischargeRecord
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6  Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unknown X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role is authenticated but not permitted on this endpoint (e.g., CaregiverRole creating a rate schedule, Nurse approving an admission)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed payload: missing required field, wrong type, enum outside declared set, period_end <= period_start, shift end <= start"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version on an OCC-guarded write"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "State-machine from-state mismatch or transition from a terminal state (generic fallback when no more specific error applies)"
  - id: ERR_SELF_APPROVAL
    http: 409
    condition: "The Provider approving an admission is the same X-User-ID that created it"
  - id: ERR_BLOCKED_BY_INCIDENT
    http: 409
    condition: "Discharge attempted while a CRITICAL incident for the resident is REPORTED or UNDER_REVIEW"
  - id: ERR_LATE_REPORT
    http: 422
    condition: "MAJOR/CRITICAL incident filed more than 24h after occurred_at; compliance case cannot be opened"
  - id: ERR_OUTSIDE_MED_WINDOW
    http: 422
    condition: "administered_at falls outside every open med window, or a GIVEN/SELF_ADMINISTERED log already exists in the same window for the order"
  - id: ERR_SHIFT_CONFLICT
    http: 409
    condition: "Caregiver already has an overlapping SCHEDULED shift, or the shift would exceed 16 scheduled hours in a rolling 24h window"
  - id: ERR_UNDERSTAFFED
    http: 422
    condition: "Shift creation or cancellation would leave an occupied hour below the required staffing ratio"
  - id: ERR_BED_NOT_CERTIFIED
    http: 422
    condition: "MEDICAID resident admission references a bed with medicaid_certified == false"
  - id: ERR_INSUFFICIENT_NOTICE
    http: 422
    condition: "Discharge notice_days < 30 for a reason other than HOSPITALIZATION or DECEASED"
  - id: ERR_ASSESSMENT_SUPERSEDED
    http: 409
    condition: "Admission approval attempted while its pinned assessment is SUPERSEDED"
  - id: ERR_CAREGIVER_NOT_ON_SHIFT
    http: 422
    condition: "MedicationLog/ADLLog references a caregiver with no SCHEDULED shift covering the event timestamp"
  - id: ERR_ORDER_DISCONTINUED
    http: 409
    condition: "MedicationLog targets a DISCONTINUED MedicationOrder"
  - id: ERR_RATE_NOT_FOUND
    http: 422
    condition: "No (or overlapping) rate schedule covers an occupied day in the billing window"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Payment amount is non-positive or exceeds the invoice's outstanding balance"
  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "Admission completion when current_census == licensed_bed_capacity"
  - id: ERR_LATE_CORRECTION_PLAN
    http: 422
    condition: "Closing a SUBSTANTIATED case with correction_plan_submitted_at after correction_plan_due_at or missing"
  - id: ERR_BED_OCCUPIED
    http: 409
    condition: "Take-out-of-service attempted on an OCCUPIED bed"
  - id: ERR_RATE_OVERLAP
    http: 409
    condition: "New rate schedule's effective window overlaps an existing schedule for the same home and payer_type (half-open intersection)"

# ---------------------------------------------------------------------------
# §1.7  RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Provider
    description: "Licensed AFH provider / administrator; operates the home, billing, admissions decisions, compliance responses"
    identity: "opaque"
    exclusive_operations:
      - "create/license/suspend/reinstate/close homes"
      - "create beds, take beds out of service, return beds to service"
      - "approve/reject/cancel/complete admissions"
      - "create caregivers; suspend/reinstate/terminate caregivers"
      - "create and cancel shifts"
      - "open/reopen/close incidents and compliance cases; substantiate/unfound cases"
      - "publish rate schedules; generate/issue/void invoices; record payments"
      - "discharge residents; withdraw applicants"
      - "set the logical clock"
    shared_operations:
      - "read any resource in the home"
      - "file incidents"
  - name: Nurse
    description: "Assessing nurse; owns assessments/care plans and medication orders; may register residents and log care"
    identity: "opaque"
    exclusive_operations:
      - "create and finalize assessments (care plans)"
      - "create and discontinue medication orders"
    shared_operations:
      - "register residents"
      - "log medication administrations and ADL assistance"
      - "file incidents"
      - "read resources in the home"
  - name: CaregiverRole
    description: "Direct-care staff member; identity is the persisted Caregiver entity, used for on-shift validation"
    identity: "entity_backed:Caregiver"
    exclusive_operations: []
    shared_operations:
      - "log medication administrations and ADL assistance (only when on shift)"
      - "file incidents"
      - "read residents, beds, and medication orders of the home"
