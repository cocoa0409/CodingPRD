  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_proposal_create_stale_version_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[proposal-create-stale-prospect]", "errors[ERR_STALE_VERSION]", "validations[priority=7]"]
        distinguishing_aspect: "Creating a second proposal with the prospect version captured before the first create (which bumped the version) is rejected 412 — sequential determinism, no simultaneity."
        test_recipe:
          setup: ["prospect rated band C, assigned, CULTIVATION; version captured once"]
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
