# =============================================================================
# PRD Benchmark Seed Tables — Poultry Hatchery & Breeder Flock Management
# Difficulty band: beyond-expert
# =============================================================================

scenario: |
  2300. Poultry Hatchery & Breeder Flock Management (poultry hatchery): breeder flock placement,
  lighting programs and nutrition management to maximize hatching egg production, hatching egg
  collection, grading, sanitation and storage with age-of-egg tracking, setter and hatcher loading
  schedules with incubation profiles and temperature and humidity control, hatch window management
  with pull timing affecting chick quality, chick processing with sexing, vaccination, counting and
  box loading, hatchery sanitation, biosecurity and disease monitoring with laboratory testing
  programs, chick delivery scheduling to grower farms matched to placement plans, hatchability and
  chick quality analytics by flock age and source with breeder flock corrective action

domain_name: poultry-hatchery-breeder-flock
api_prefix: "/"

complexity_profile:
  primary_axis: temporal_windowing
  secondary_axis: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (fixed)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: FlockProgram
    parent: null
    common_fields: true
    fields:
      - {name: code, type: string, source: input, required: true, description: "Program code, unique among non-retired programs", constraints: "1..40 chars"}
      - {name: breed, type: enum, source: input, required: true, description: "Breed the program is written for", constraints: "ROSS_308 | COBB_500 | HUBBARD_JA87"}
      - {name: stimulation_week, type: integer, source: input, required: true, description: "Flock age in weeks at which photostimulation begins; a flock cannot enter IN_LAY before this age", constraints: ">= 18 and <= 30"}
      - {name: lighting_steps, type: array, source: input, required: true, description: "Ascending step table of {age_weeks:int, photoperiod_hours:number}; applicable step is the last entry whose age_weeks <= flock age_weeks; below the first entry the flock is on BASE_PHOTOPERIOD_HOURS", constraints: "1..8 entries, strictly ascending age_weeks, photoperiod_hours in [8.0, 17.0]"}
      - {name: feed_steps, type: array, source: input, required: true, description: "Ascending step table of {age_weeks:int, feed_grams_per_hen_day:number}; same last-step-wins lookup as lighting_steps", constraints: "1..8 entries, strictly ascending age_weeks, feed_grams_per_hen_day in [90.0, 200.0]"}
      - {name: retired, type: boolean, source: system, required: true, description: "true after POST /flock-programs/{id}/retire; retired programs reject new flock placement", default: false}

  - name: IncubationProfile
    parent: null
    common_fields: true
    fields:
      - {name: code, type: string, source: input, required: true, description: "Profile code", constraints: "1..40 chars"}
      - {name: breed, type: enum, source: input, required: true, description: "Breed the profile is validated for; must equal the breed of every egg lot loaded under it", constraints: "ROSS_308 | COBB_500 | HUBBARD_JA87"}
      - {name: transfer_hours, type: integer, source: input, required: true, description: "Elapsed incubation hours from set to setter->hatcher transfer", constraints: ">= 300 and < total_hours"}
      - {name: total_hours, type: integer, source: input, required: true, description: "Elapsed incubation hours from set to nominal pull", constraints: "> transfer_hours and <= 600"}
      - {name: stages, type: array, source: input, required: true, description: "Contiguous stage table of {from_hour:int, to_hour:int, temp_c:number, humidity_pct:number}; from_hour of the first stage is 0, to_hour of the last stage equals total_hours, and each stage's from_hour equals the previous stage's to_hour. Target temp for an EnvironmentReading is the stage whose half-open range [from_hour, to_hour) contains the reading's elapsed incubation hours", constraints: "2..6 entries, temp_c in [36.0, 39.0], humidity_pct in [40.0, 75.0]"}
      - {name: retired, type: boolean, source: system, required: true, description: "true after retirement; retired profiles reject new setter loads", default: false}

  - name: IncubationUnit
    parent: null
    common_fields: true
    fields:
      - {name: code, type: string, source: input, required: true, description: "Machine code", constraints: "1..40 chars"}
      - {name: unit_type, type: enum, source: input, required: true, description: "SETTER units accept setter loads; HATCHER units accept transfers", constraints: "SETTER | HATCHER"}
      - {name: capacity_eggs, type: integer, source: input, required: true, description: "Maximum eggs the unit may hold for one load", constraints: ">= 1000 and <= 200000"}
      - {name: sanitation_status, type: enum, source: system, required: true, description: "SANITIZED is consumed when a load starts in the unit, returning it to DIRTY", default: DIRTY, constraints: "DIRTY | SANITIZED"}
      - {name: sanitized_at, type: datetime, source: system, required: false, description: "Logical-clock time of the last successful sanitize call; null until first sanitize"}
      - {name: occupancy_status, type: enum, source: system, required: true, description: "OCCUPIED while a non-terminal load holds the unit; released by transfer, abort, or pull", default: FREE, constraints: "FREE | OCCUPIED"}

  - name: BreederFlock
    parent: null
    common_fields: true
    fields:
      - {name: code, type: string, source: input, required: true, description: "Flock code", constraints: "1..40 chars"}
      - {name: program_id, type: string, source: input, required: true, description: "FK -> FlockProgram.id; lighting and nutrition program governing this flock"}
      - {name: source_flock_id, type: string, source: input, required: false, description: "FK -> BreederFlock.id; self-referential parent-stock lineage for source analytics; null for imported grandparent stock"}
      - {name: breed, type: enum, source: input, required: true, description: "Must equal FlockProgram.breed of program_id", constraints: "ROSS_308 | COBB_500 | HUBBARD_JA87"}
      - {name: house_code, type: string, source: input, required: true, description: "Breeder house identifier", constraints: "1..20 chars"}
      - {name: hatch_date, type: datetime, source: input, required: true, description: "UTC instant the flock itself hatched; the origin for age_weeks", constraints: "must be strictly before placed_at"}
      - {name: placed_at, type: datetime, source: input, required: true, description: "UTC instant the flock was placed in the breeder house", constraints: "must be <= current logical clock"}
      - {name: hen_count, type: integer, source: input, required: true, description: "Hens in production; drives settable_forecast", constraints: ">= 1"}
      - {name: status, type: enum, source: system, required: true, description: "Lifecycle state", default: PLACED, constraints: "PLACED | IN_LAY | EGG_HOLD | DEPLETED"}
      - {name: age_weeks, type: integer, source: computed, required: true, description: "floor((current logical clock - hatch_date) / 7 days); recomputed on every read of the flock and on every recompute-forecast call"}
      - {name: photoperiod_hours, type: number, source: computed, required: true, description: "Applicable lighting step for age_weeks, else BASE_PHOTOPERIOD_HOURS (8.0)"}
      - {name: feed_grams_per_hen_day, type: number, source: computed, required: true, description: "Applicable feed step for age_weeks, else TARGET_FEED_G (160.0)"}
      - {name: production_rate_pct, type: number, source: computed, required: true, description: "Age-tiered hen-day production percentage, calculation flock_settable_forecast"}
      - {name: lighting_factor, type: number, source: computed, required: true, description: "Lighting multiplier from photoperiod_hours, 4 decimal places"}
      - {name: nutrition_factor, type: number, source: computed, required: true, description: "Nutrition multiplier from feed_grams_per_hen_day, 4 decimal places"}
      - {name: settable_forecast, type: integer, source: computed, required: true, description: "Forecast settable hatching eggs per day, calculation flock_settable_forecast"}
      - {name: hatchability_rolling_pct, type: number, source: computed, required: false, description: "SET_BASIS variant of flock_hatchability_rolling over the last ROLLING_WINDOW_SETS completed sets; null until the flock's first ChickBatch is boxed"}
      - {name: hatchability_fertile_pct, type: number, source: computed, required: false, description: "FERTILE_BASIS variant of flock_hatchability_rolling over the same window; null until the flock's first ChickBatch is boxed"}
      - {name: corrective_action_count, type: integer, source: computed, required: true, description: "Number of CorrectiveAction rows auto-opened for this flock; a value >= 1 activates CORRECTIVE_DERATE in flock_settable_forecast", default: 0}
      - {name: late_pull_count, type: integer, source: computed, required: true, description: "Number of LATE_PULLED hatcher loads traced to this flock as primary source", default: 0}
      - {name: egg_hold_opened_by_user_id, type: string, source: system, required: false, description: "X-User-ID that drove the flock into EGG_HOLD; not a foreign key, opaque user identifier used for segregation of duties on release-hold"}
      - {name: egg_hold_opened_at, type: datetime, source: system, required: false, description: "Logical-clock time the current EGG_HOLD began; null when not on hold"}

  - name: EggLot
    parent: null
    common_fields: true
    fields:
      - {name: flock_id, type: string, source: input, required: true, description: "FK -> BreederFlock.id; the flock that laid the eggs"}
      - {name: collected_at, type: datetime, source: input, required: true, description: "UTC instant collection closed; the origin for age-of-egg tracking", constraints: "must be <= current logical clock"}
      - {name: collected_count, type: integer, source: input, required: true, description: "Eggs collected before grading", constraints: ">= 1"}
      - {name: grade_a_count, type: integer, source: system, required: false, description: "Settable grade-A eggs recorded at grading; null before grading"}
      - {name: cracked_count, type: integer, source: system, required: false, description: "Cracked eggs recorded at grading"}
      - {name: dirty_count, type: integer, source: system, required: false, description: "Dirty eggs recorded at grading"}
      - {name: small_count, type: integer, source: system, required: false, description: "Undersized eggs recorded at grading"}
      - {name: settable_count, type: integer, source: computed, required: true, description: "Equals grade_a_count once graded; 0 before grading. Left side of the egg conservation invariant", default: 0}
      - {name: eggs_remaining, type: integer, source: computed, required: true, description: "settable_count minus the sum of eggs_taken over ACTIVE SetterLoadItems of this lot", default: 0}
      - {name: storage_temp_c, type: number, source: system, required: false, description: "Cooler temperature recorded at storage; > STORAGE_TEMP_BOUNDARY_C ages eggs faster; null before storage"}
      - {name: stored_at, type: datetime, source: system, required: false, description: "Logical-clock time the lot entered IN_STORAGE the first time"}
      - {name: sanitation_cycle_count, type: integer, source: computed, required: true, description: "Number of completed SANITATION_HOLD cycles; each adds SANITATION_AGE_PENALTY_DAYS to effective_age_days", default: 0}
      - {name: effective_age_days, type: number, source: computed, required: true, description: "Age-of-egg in effective days, calculation egg_lot_effective_age_days, 2 decimal places", default: 0}
      - {name: status, type: enum, source: system, required: true, description: "Lifecycle state", default: COLLECTED, constraints: "COLLECTED | GRADED | IN_STORAGE | SANITATION_HOLD | ALLOCATED | SET | CONSUMED | CONDEMNED"}
      - {name: condemned_reason, type: string, source: system, required: false, description: "Reason recorded when the lot reaches CONDEMNED, including the cascade reason FLOCK_EGG_HOLD"}

  - name: SetterLoad
    parent: null
    common_fields: true
    fields:
      - {name: unit_id, type: string, source: input, required: true, description: "FK -> IncubationUnit.id; must be a SETTER unit"}
      - {name: profile_id, type: string, source: input, required: true, description: "FK -> IncubationProfile.id; incubation temperature and humidity profile"}
      - {name: planned_set_at, type: datetime, source: input, required: true, description: "Planned start of incubation; used for IncubationUnit window conflict detection at creation", constraints: "must be >= current logical clock"}
      - {name: set_at, type: datetime, source: system, required: false, description: "Logical-clock time incubation actually started; null while PLANNED"}
      - {name: total_eggs_set, type: integer, source: computed, required: true, description: "Sum of eggs_taken over ACTIVE SetterLoadItems; denominator of the SET_BASIS hatchability variant", default: 0}
      - {name: weighted_age_days, type: number, source: computed, required: false, description: "Egg-count-weighted mean effective_age_days_at_set over ACTIVE items, 4 decimal places; null while PLANNED"}
      - {name: storage_delay_hours, type: integer, source: computed, required: false, description: "Incubation delay in whole hours derived from weighted_age_days, calculation incubation_pull_window"}
      - {name: planned_transfer_at, type: datetime, source: computed, required: false, description: "set_at + profile.transfer_hours + storage_delay_hours"}
      - {name: planned_pull_at, type: datetime, source: computed, required: false, description: "set_at + profile.total_hours + storage_delay_hours"}
      - {name: pull_window_start_at, type: datetime, source: computed, required: false, description: "planned_pull_at - PULL_WINDOW_EARLY_HOURS"}
      - {name: pull_window_end_at, type: datetime, source: computed, required: false, description: "planned_pull_at + PULL_WINDOW_LATE_HOURS"}
      - {name: fertile_count, type: integer, source: system, required: false, description: "Fertile eggs counted at candling; denominator of the FERTILE_BASIS hatchability variant"}
      - {name: fertility_pct, type: number, source: computed, required: false, description: "round(fertile_count / total_eggs_set * 100, 2)"}
      - {name: deviation_degree_hours, type: number, source: computed, required: true, description: "Cumulative out-of-tolerance degree-hours, calculation deviation_degree_hours, 3 decimal places", default: 0}
      - {name: environment_status, type: enum, source: system, required: true, description: "Independent environment dimension, changes without affecting status", default: NOMINAL, constraints: "NOMINAL | DEVIATION_OPEN | DEVIATION_RESOLVED"}
      - {name: deviation_opened_at, type: datetime, source: system, required: false, description: "recorded_at of the reading that most recently opened a deviation"}
      - {name: status, type: enum, source: system, required: true, description: "Incubation lifecycle dimension", default: PLANNED, constraints: "PLANNED | INCUBATING | CANDLED | TRANSFERRED | ABORTED"}
      - {name: abort_reason, type: string, source: system, required: false, description: "Reason recorded on ABORTED, including the cascade reason EGG_LOTS_CONDEMNED"}

  - name: SetterLoadItem
    parent: SetterLoad
    common_fields: true
    fields:
      - {name: setter_load_id, type: string, source: input, required: true, description: "FK -> SetterLoad.id; owning load"}
      - {name: egg_lot_id, type: string, source: input, required: true, description: "FK -> EggLot.id; source lot the eggs were drawn from; many-to-many bridge between lots and loads"}
      - {name: eggs_taken, type: integer, source: input, required: true, description: "Eggs drawn from the lot into this load", constraints: ">= 1"}
      - {name: effective_age_days_at_set, type: number, source: computed, required: true, description: "Snapshot of EggLot.effective_age_days at the instant the item was created; frozen thereafter, 2 decimal places"}
      - {name: item_status, type: enum, source: system, required: true, description: "VOIDED items are excluded from every aggregate and return their eggs to the lot", default: ACTIVE, constraints: "ACTIVE | VOIDED"}

  - name: EnvironmentReading
    parent: SetterLoad
    common_fields: false
    fields:
      - {name: id, type: string, source: system, required: true, description: "Reading identifier, opaque UUID, never used in a business decision"}
      - {name: created_at, type: datetime, source: system, required: true, description: "Logical-clock time the reading was ingested; the only sanctioned tie-break when two readings share recorded_at"}
      - {name: setter_load_id, type: string, source: input, required: true, description: "FK -> SetterLoad.id; load being monitored"}
      - {name: recorded_at, type: datetime, source: input, required: true, description: "UTC instant the probe sampled; must be >= set_at and <= current logical clock, and strictly after the recorded_at of the load's latest reading", constraints: "strictly increasing per load"}
      - {name: temp_c, type: number, source: input, required: true, description: "Measured dry-bulb temperature", constraints: ">= 30.0 and <= 45.0"}
      - {name: humidity_pct, type: number, source: input, required: true, description: "Measured relative humidity", constraints: ">= 20.0 and <= 90.0"}
      - {name: elapsed_hours, type: number, source: computed, required: true, description: "(recorded_at - set_at) in hours, 2 decimal places; selects the applicable IncubationProfile stage"}
      - {name: target_temp_c, type: number, source: computed, required: true, description: "temp_c of the applicable profile stage"}
      - {name: abs_deviation_c, type: number, source: computed, required: true, description: "round(abs(temp_c - target_temp_c), 2)"}
      - {name: segment_degree_hours, type: number, source: computed, required: true, description: "Degree-hours accrued over the segment this reading closes, computed from the PREVIOUS reading's excess deviation held constant; 0 for the first reading of a load, 3 decimal places"}

  - name: HatcherLoad
    parent: null
    common_fields: true
    fields:
      - {name: setter_load_id, type: string, source: input, required: true, description: "FK -> SetterLoad.id; the load transferred in"}
      - {name: unit_id, type: string, source: input, required: true, description: "FK -> IncubationUnit.id; must be a HATCHER unit"}
      - {name: transferred_at, type: datetime, source: system, required: true, description: "Logical-clock time of transfer"}
      - {name: eggs_transferred, type: integer, source: computed, required: true, description: "Copy of SetterLoad.total_eggs_set at transfer; frozen thereafter"}
      - {name: planned_pull_at, type: datetime, source: computed, required: true, description: "Copy of SetterLoad.planned_pull_at at transfer"}
      - {name: pull_window_start_at, type: datetime, source: computed, required: true, description: "Copy of SetterLoad.pull_window_start_at at transfer"}
      - {name: pull_window_end_at, type: datetime, source: computed, required: true, description: "Copy of SetterLoad.pull_window_end_at at transfer"}
      - {name: inherited_degree_hours, type: number, source: computed, required: true, description: "Copy of SetterLoad.deviation_degree_hours at transfer; frozen input to chick_quality_score, 3 decimal places"}
      - {name: actual_pull_at, type: datetime, source: system, required: false, description: "Logical-clock time chicks were pulled; null while HATCHING"}
      - {name: pull_offset_hours, type: number, source: computed, required: false, description: "Signed hours outside the pull window: negative when actual_pull_at < pull_window_start_at, positive when actual_pull_at > pull_window_end_at, 0 inside the window, 2 decimal places"}
      - {name: pull_class, type: enum, source: computed, required: false, description: "EARLY | WINDOW | LATE, derived from pull_offset_hours"}
      - {name: quality_flag, type: enum, source: computed, required: true, description: "Branch-specific chick quality flag", default: NONE, constraints: "NONE | UNHEALED_NAVEL | DEHYDRATION"}
      - {name: hold_release_at, type: datetime, source: computed, required: false, description: "Only set on the EARLY branch: actual_pull_at + EARLY_HOLD_HOURS; chicks may not be boxed before this instant"}
      - {name: status, type: enum, source: system, required: true, description: "Hatch window lifecycle", default: HATCHING, constraints: "HATCHING | EARLY_PULLED | WINDOW_PULLED | LATE_PULLED | PROCESSED"}

  - name: ChickBatch
    parent: HatcherLoad
    common_fields: true
    fields:
      - {name: hatcher_load_id, type: string, source: input, required: true, description: "FK -> HatcherLoad.id; the pull that produced this batch"}
      - {name: primary_flock_id, type: string, source: input, required: true, description: "FK -> BreederFlock.id; flock contributing the most eggs to the originating setter load, ties broken by the contributing SetterLoadItem with the earliest created_at"}
      - {name: breed, type: enum, source: computed, required: true, description: "Breed of primary_flock_id; must match a placement order's requested breed to be allocatable", constraints: "ROSS_308 | COBB_500 | HUBBARD_JA87"}
      - {name: hatched_count, type: integer, source: input, required: true, description: "Live chicks counted at pull", constraints: ">= 1 and <= HatcherLoad.eggs_transferred"}
      - {name: male_count, type: integer, source: system, required: false, description: "Males counted at sexing; null before sexing"}
      - {name: female_count, type: integer, source: system, required: false, description: "Females counted at sexing"}
      - {name: unsexed_count, type: integer, source: system, required: false, description: "Chicks left unsexed"}
      - {name: sexing_cull_count, type: integer, source: system, required: false, description: "Culls removed at sexing"}
      - {name: preliminary_yield_pct, type: number, source: computed, required: false, description: "round((hatched_count - sexing_cull_count) / hatched_count * 100, 2); selects the vaccine reject tier"}
      - {name: vaccine_reject_rate, type: number, source: computed, required: false, description: "Tiered reject rate keyed on preliminary_yield_pct, calculation chick_yield_resolution"}
      - {name: vaccine_cull_count, type: integer, source: computed, required: false, description: "ceil((hatched_count - sexing_cull_count) * vaccine_reject_rate)"}
      - {name: cull_count, type: integer, source: computed, required: false, description: "sexing_cull_count + vaccine_cull_count"}
      - {name: saleable_count, type: integer, source: computed, required: false, description: "hatched_count - cull_count; left side of the chick conservation invariant"}
      - {name: final_yield_pct, type: number, source: computed, required: false, description: "round(saleable_count / hatched_count * 100, 2)"}
      - {name: box_count, type: integer, source: computed, required: false, description: "ceil(saleable_count / BOX_SIZE)"}
      - {name: unassigned_chicks, type: integer, source: computed, required: false, description: "saleable_count minus the sum of chicks_assigned over DeliveryAssignments in ASSIGNED or DELIVERED"}
      - {name: quality_score_provisional, type: number, source: computed, required: false, description: "PROVISIONAL variant of chick_quality_score, frozen at pull, 2 decimal places"}
      - {name: quality_score_final, type: number, source: computed, required: false, description: "FINAL variant of chick_quality_score, computed at boxing, 2 decimal places"}
      - {name: status, type: enum, source: system, required: true, description: "Chick processing lifecycle", default: PULLED, constraints: "PULLED | SEXED | VACCINATED | BOXED"}

  - name: GrowerFarm
    parent: null
    common_fields: true
    fields:
      - {name: code, type: string, source: input, required: true, description: "Farm code", constraints: "1..40 chars"}
      - {name: operator_user_id, type: string, source: input, required: true, description: "X-User-ID of the GrowerFarm-role principal that owns this farm's scope; not a foreign key, opaque user identifier"}
      - {name: capacity_chicks, type: integer, source: input, required: true, description: "Maximum chicks the farm may hold across all overlapping placement cycles", constraints: ">= 1000"}
      - {name: biosecurity_status, type: enum, source: system, required: true, description: "Only CLEARED farms may receive allocations; a POSITIVE farm lab test drives it to QUARANTINED", default: PENDING, constraints: "PENDING | CLEARED | QUARANTINED"}
      - {name: cleared_at, type: datetime, source: system, required: false, description: "Logical-clock time of the last clearance"}

  - name: GrowerPlacementOrder
    parent: GrowerFarm
    common_fields: true
    fields:
      - {name: farm_id, type: string, source: input, required: true, description: "FK -> GrowerFarm.id; destination farm"}
      - {name: requested_breed, type: enum, source: input, required: true, description: "Breed the grower placed the order for", constraints: "ROSS_308 | COBB_500 | HUBBARD_JA87"}
      - {name: requested_placement_date, type: datetime, source: input, required: true, description: "UTC date the grower wants the chicks placed; the ranking key of the allocation waterfall", constraints: "must be >= current logical clock date"}
      - {name: requested_chicks, type: integer, source: input, required: true, description: "Chicks requested", constraints: ">= BOX_SIZE"}
      - {name: allocated_chicks, type: integer, source: computed, required: true, description: "Sum of chicks_assigned over this order's DeliveryAssignments in ASSIGNED or DELIVERED", default: 0}
      - {name: remaining_need, type: integer, source: computed, required: true, description: "requested_chicks - allocated_chicks"}
      - {name: status, type: enum, source: system, required: true, description: "Order lifecycle", default: REQUESTED, constraints: "REQUESTED | CONFIRMED | PARTIALLY_FULFILLED | FULFILLED"}

  - name: DeliveryAssignment
    parent: null
    common_fields: true
    fields:
      - {name: chick_batch_id, type: string, source: input, required: true, description: "FK -> ChickBatch.id; batch the chicks come from"}
      - {name: placement_order_id, type: string, source: input, required: true, description: "FK -> GrowerPlacementOrder.id; order being served; cross-aggregate link"}
      - {name: chicks_assigned, type: integer, source: computed, required: true, description: "Whole-box grant produced by chick_allocation_waterfall; always a multiple of BOX_SIZE"}
      - {name: boxes_assigned, type: integer, source: computed, required: true, description: "chicks_assigned / BOX_SIZE"}
      - {name: scheduled_delivery_date, type: datetime, source: computed, required: true, description: "Copy of the order's requested_placement_date at allocation time"}
      - {name: delivered_at, type: datetime, source: system, required: false, description: "Logical-clock time of delivery confirmation"}
      - {name: reversal_reason, type: string, source: system, required: false, description: "Reason recorded when the assignment is compensated to REVERSED"}
      - {name: status, type: enum, source: system, required: true, description: "Assignment lifecycle", default: ASSIGNED, constraints: "ASSIGNED | DELIVERED | REVERSED"}

  - name: LabTest
    parent: null
    common_fields: true
    fields:
      - {name: subject_type, type: enum, source: input, required: true, description: "Polymorphic subject discriminator", constraints: "BREEDER_FLOCK | INCUBATION_UNIT | GROWER_FARM"}
      - {name: subject_id, type: string, source: input, required: true, description: "Polymorphic subject identifier, resolved against BreederFlock.id when subject_type is BREEDER_FLOCK, IncubationUnit.id when INCUBATION_UNIT, GrowerFarm.id when GROWER_FARM; an id that does not resolve in the discriminated table yields ERR_LAB_SUBJECT_INVALID even if it resolves in another table"}
      - {name: test_code, type: enum, source: input, required: true, description: "Assay performed", constraints: "SALMONELLA_PULLORUM | MYCOPLASMA_GALLISEPTICUM | AVIAN_INFLUENZA | SHELL_HYGIENE"}
      - {name: collected_at, type: datetime, source: input, required: true, description: "UTC instant the sample was taken", constraints: "must be <= current logical clock"}
      - {name: released_at, type: datetime, source: system, required: false, description: "Logical-clock time the result was released"}
      - {name: result, type: enum, source: system, required: false, description: "Released result; POSITIVE drives the biosecurity cascade", constraints: "NEGATIVE | POSITIVE | INVALID"}
      - {name: status, type: enum, source: system, required: true, description: "Test lifecycle", default: PENDING, constraints: "PENDING | NEGATIVE | POSITIVE | INVALID"}

  - name: CorrectiveAction
    parent: BreederFlock
    common_fields: true
    fields:
      - {name: flock_id, type: string, source: input, required: true, description: "FK -> BreederFlock.id; flock under corrective action"}
      - {name: trigger_reason, type: enum, source: computed, required: true, description: "Why the action was opened", constraints: "HATCHABILITY_BELOW_THRESHOLD | REPEATED_LATE_PULL | LAB_POSITIVE"}
      - {name: observed_hatchability_pct, type: number, source: computed, required: false, description: "SET_BASIS rolling hatchability that tripped the threshold; null for non-hatchability triggers"}
      - {name: opened_at, type: datetime, source: computed, required: true, description: "Logical-clock time the action was auto-opened"}
      - {name: opened_by_user_id, type: string, source: system, required: true, description: "X-User-ID of the principal whose call triggered the auto-open; not a foreign key, opaque user identifier compared against the verifier for segregation of duties"}
      - {name: implementation_note, type: string, source: system, required: false, description: "Note recorded on the most recent implement call"}
      - {name: verification_round, type: integer, source: computed, required: true, description: "Increments by 1 each time verification fails and the action reopens", default: 1}
      - {name: status, type: enum, source: system, required: true, description: "Corrective action lifecycle", default: OPEN, constraints: "OPEN | ACKNOWLEDGED | IMPLEMENTED | VERIFIED"}

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: BreederFlock
    initial_state: PLACED
    terminal_states: [DEPLETED]
    transitions:
      - from: PLACED
        to: IN_LAY
        trigger: "POST /breeder-flocks/{id}/start-lay"
        actor: FlockManager
        preconditions:
          - "flock status is PLACED"
          - "age_weeks >= FlockProgram.stimulation_week of the flock's program, else ERR_FLOCK_NOT_MATURE"
          - "at least one LabTest with subject_type BREEDER_FLOCK, subject_id = this flock, test_code SALMONELLA_PULLORUM and status NEGATIVE exists, else ERR_LAB_CLEARANCE_MISSING"
          - "FlockProgram.retired is false, else ERR_PROGRAM_RETIRED"
        side_effects:
          - "recompute age_weeks, photoperiod_hours, feed_grams_per_hen_day, production_rate_pct, lighting_factor, nutrition_factor, settable_forecast"
          - "increments version by 1"
      - from: IN_LAY
        to: EGG_HOLD
        trigger: "POST /lab-tests/{id}/release with result POSITIVE on a BREEDER_FLOCK subject (cascade, not directly callable)"
        actor: Veterinarian
        preconditions:
          - "flock status is IN_LAY"
        side_effects:
          - "set egg_hold_opened_at = current logical clock and egg_hold_opened_by_user_id = X-User-ID of the release call"
          - "cascade: every EggLot of this flock in IN_STORAGE or ALLOCATED moves to CONDEMNED with condemned_reason FLOCK_EGG_HOLD"
          - "increments version by 1"
      - from: EGG_HOLD
        to: IN_LAY
        trigger: "POST /breeder-flocks/{id}/release-hold"
        actor: Veterinarian
        preconditions:
          - "flock status is EGG_HOLD"
          - "X-User-ID differs from egg_hold_opened_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the flock's most recently collected LabTest with test_code SALMONELLA_PULLORUM has status NEGATIVE, else ERR_LAB_CLEARANCE_MISSING"
        side_effects:
          - "clear egg_hold_opened_at and egg_hold_opened_by_user_id to null"
          - "recompute settable_forecast"
          - "increments version by 1"
      - from: IN_LAY
        to: DEPLETED
        trigger: "POST /breeder-flocks/{id}/deplete"
        actor: FlockManager
        preconditions:
          - "flock status is IN_LAY"
          - "no EggLot of this flock is in ALLOCATED, else ERR_FLOCK_INVALID_STATE"
        side_effects:
          - "set settable_forecast = 0 and production_rate_pct = 0"
          - "increments version by 1"
      - from: PLACED
        to: DEPLETED
        trigger: "POST /breeder-flocks/{id}/deplete"
        actor: FlockManager
        preconditions:
          - "flock status is PLACED"
        side_effects:
          - "set settable_forecast = 0 and production_rate_pct = 0"
          - "increments version by 1"

  - entity: EggLot
    initial_state: COLLECTED
    terminal_states: [CONSUMED, CONDEMNED]
    transitions:
      - from: COLLECTED
        to: GRADED
        trigger: "POST /egg-lots/{id}/grade"
        actor: FlockManager
        preconditions:
          - "lot status is COLLECTED"
          - "grade_a_count + cracked_count + dirty_count + small_count == collected_count, else ERR_GRADE_COUNT_MISMATCH"
          - "grade_a_count >= 1, else ERR_NO_SETTABLE_EGGS"
        side_effects:
          - "set settable_count = grade_a_count and eggs_remaining = grade_a_count"
          - "recompute effective_age_days with the UNSTORED factor"
          - "increments version by 1"
      - from: GRADED
        to: IN_STORAGE
        trigger: "POST /egg-lots/{id}/store"
        actor: IncubationOperator
        preconditions:
          - "lot status is GRADED"
          - "owning flock status is IN_LAY, else ERR_FLOCK_EGG_HOLD"
        side_effects:
          - "set stored_at = current logical clock and storage_temp_c from the request"
          - "recompute effective_age_days with the WARM or COOL factor selected by storage_temp_c"
          - "increments version by 1"
      - from: IN_STORAGE
        to: SANITATION_HOLD
        trigger: "POST /egg-lots/{id}/sanitation-hold"
        actor: Veterinarian
        preconditions:
          - "lot status is IN_STORAGE"
        side_effects:
          - "increments version by 1"
      - from: SANITATION_HOLD
        to: IN_STORAGE
        trigger: "POST /egg-lots/{id}/sanitation-release"
        actor: IncubationOperator
        preconditions:
          - "lot status is SANITATION_HOLD"
        side_effects:
          - "sanitation_cycle_count += 1 (cyclic; the lot may re-enter SANITATION_HOLD any number of times and each completed cycle permanently ages the lot)"
          - "recompute effective_age_days including SANITATION_AGE_PENALTY_DAYS * sanitation_cycle_count"
          - "increments version by 1"
      - from: IN_STORAGE
        to: ALLOCATED
        trigger: "POST /setter-loads/{id}/items"
        actor: IncubationOperator
        preconditions:
          - "lot status is IN_STORAGE"
          - "eggs_taken <= eggs_remaining, else ERR_INSUFFICIENT_SETTABLE_EGGS"
        side_effects:
          - "create SetterLoadItem in ACTIVE and freeze effective_age_days_at_set"
          - "eggs_remaining -= eggs_taken"
          - "SetterLoad.total_eggs_set and weighted_age_days recomputed"
          - "increments version by 1"
      - from: ALLOCATED
        to: ALLOCATED
        trigger: "POST /setter-loads/{id}/items (further draws from the same lot into another PLANNED load)"
        actor: IncubationOperator
        preconditions:
          - "lot status is ALLOCATED and eggs_remaining >= eggs_taken"
        side_effects:
          - "eggs_remaining -= eggs_taken"
          - "increments version by 1"
      - from: ALLOCATED
        to: IN_STORAGE
        trigger: "POST /setter-loads/{id}/abort (cascade when the void returns all outstanding eggs)"
        actor: HatcheryManager
        preconditions:
          - "every SetterLoadItem of this lot is VOIDED after the abort"
        side_effects:
          - "eggs_remaining restored to settable_count"
          - "increments version by 1"
      - from: ALLOCATED
        to: SET
        trigger: "POST /setter-loads/{id}/start"
        actor: IncubationOperator
        preconditions:
          - "lot has at least one ACTIVE SetterLoadItem on the load being started"
        side_effects:
          - "increments version by 1"
      - from: SET
        to: CONSUMED
        trigger: "POST /setter-loads/{id}/transfer"
        actor: IncubationOperator
        preconditions:
          - "every ACTIVE SetterLoadItem of this lot belongs to a load that has reached TRANSFERRED"
        side_effects:
          - "eggs_remaining set to 0"
          - "increments version by 1"
      - from: IN_STORAGE
        to: CONDEMNED
        trigger: "POST /egg-lots/{id}/condemn, or cascade from a POSITIVE BREEDER_FLOCK lab test"
        actor: Veterinarian
        preconditions:
          - "lot status is not CONSUMED and not CONDEMNED"
        side_effects:
          - "set condemned_reason, eggs_remaining = 0 and settable_count unchanged for audit"
          - "increments version by 1"
      - from: ALLOCATED
        to: CONDEMNED
        trigger: "POST /egg-lots/{id}/condemn, or cascade from a POSITIVE BREEDER_FLOCK lab test"
        actor: Veterinarian
        preconditions:
          - "lot status is ALLOCATED"
        side_effects:
          - "every ACTIVE SetterLoadItem of this lot becomes VOIDED and its load's total_eggs_set and weighted_age_days are recomputed"
          - "any PLANNED SetterLoad left with total_eggs_set = 0 moves to ABORTED with abort_reason EGG_LOTS_CONDEMNED and releases its IncubationUnit to FREE"
          - "increments version by 1"
      - from: SANITATION_HOLD
        to: CONDEMNED
        trigger: "POST /egg-lots/{id}/condemn"
        actor: Veterinarian
        preconditions:
          - "lot status is SANITATION_HOLD"
        side_effects:
          - "set condemned_reason and eggs_remaining = 0"
          - "increments version by 1"

  - entity: SetterLoad
    initial_state: PLANNED
    terminal_states: [TRANSFERRED, ABORTED]
    transitions:
      - from: PLANNED
        to: INCUBATING
        trigger: "POST /setter-loads/{id}/start"
        actor: IncubationOperator
        preconditions:
          - "load status is PLANNED"
          - "at least one ACTIVE SetterLoadItem exists, else ERR_NO_EGGS_LOADED"
          - "IncubationUnit.sanitation_status is SANITIZED, else ERR_UNIT_NOT_SANITIZED"
          - "IncubationUnit.occupancy_status is FREE, else ERR_UNIT_OCCUPIED"
          - "total_eggs_set <= IncubationUnit.capacity_eggs, else ERR_UNIT_CAPACITY_EXCEEDED"
        side_effects:
          - "set set_at = current logical clock"
          - "compute weighted_age_days, storage_delay_hours, planned_transfer_at, planned_pull_at, pull_window_start_at, pull_window_end_at (calculation incubation_pull_window)"
          - "IncubationUnit.occupancy_status = OCCUPIED and sanitation_status = DIRTY"
          - "every contributing EggLot moves ALLOCATED -> SET"
          - "increments version by 1"
      - from: INCUBATING
        to: CANDLED
        trigger: "POST /setter-loads/{id}/candle"
        actor: IncubationOperator
        preconditions:
          - "load status is INCUBATING"
          - "fertile_count <= total_eggs_set, else ERR_COUNT_EXCEEDS_SOURCE"
          - "current logical clock >= set_at, else ERR_TIMESTAMP_OUT_OF_RANGE"
        side_effects:
          - "set fertile_count and compute fertility_pct"
          - "increments version by 1"
      - from: CANDLED
        to: TRANSFERRED
        trigger: "POST /setter-loads/{id}/transfer"
        actor: IncubationOperator
        preconditions:
          - "load status is CANDLED"
          - "environment_status is not DEVIATION_OPEN, else ERR_ENVIRONMENT_DEVIATION_OPEN"
          - "target hatcher unit is unit_type HATCHER, SANITIZED and FREE"
        side_effects:
          - "create HatcherLoad in HATCHING copying eggs_transferred, planned_pull_at, pull_window_start_at, pull_window_end_at and inherited_degree_hours"
          - "setter IncubationUnit.occupancy_status = FREE; hatcher unit becomes OCCUPIED and DIRTY"
          - "every contributing EggLot moves SET -> CONSUMED"
          - "increments version by 1"
      - from: PLANNED
        to: ABORTED
        trigger: "POST /setter-loads/{id}/abort"
        actor: HatcheryManager
        preconditions:
          - "load status is PLANNED"
        side_effects:
          - "every ACTIVE SetterLoadItem becomes VOIDED and returns eggs_taken to its lot's eggs_remaining"
          - "total_eggs_set recomputed to 0"
          - "each fully restored lot returns ALLOCATED -> IN_STORAGE"
          - "increments version by 1"
      - from: INCUBATING
        to: ABORTED
        trigger: "POST /setter-loads/{id}/abort"
        actor: HatcheryManager
        preconditions:
          - "load status is INCUBATING"
        side_effects:
          - "every ACTIVE SetterLoadItem becomes VOIDED; contributing lots in SET move to CONDEMNED with condemned_reason LOAD_ABORTED"
          - "IncubationUnit.occupancy_status = FREE"
          - "increments version by 1"
      - from: CANDLED
        to: ABORTED
        trigger: "POST /setter-loads/{id}/abort"
        actor: HatcheryManager
        preconditions:
          - "load status is CANDLED"
        side_effects:
          - "every ACTIVE SetterLoadItem becomes VOIDED; contributing lots in SET move to CONDEMNED with condemned_reason LOAD_ABORTED"
          - "IncubationUnit.occupancy_status = FREE"
          - "increments version by 1"

  - entity: SetterLoad
    dimension: environment_status
    initial_state: NOMINAL
    terminal_states: []
    transitions:
      - from: NOMINAL
        to: DEVIATION_OPEN
        trigger: "POST /setter-loads/{id}/environment-readings whose closed segment_degree_hours > DEVIATION_OPEN_THRESHOLD_DH"
        actor: IncubationOperator
        preconditions:
          - "load status is INCUBATING"
        side_effects:
          - "deviation_degree_hours += segment_degree_hours"
          - "set deviation_opened_at = recorded_at of the ingested reading"
          - "increments version by 1"
      - from: DEVIATION_OPEN
        to: DEVIATION_RESOLVED
        trigger: "POST /setter-loads/{id}/environment-readings that closes a run of at least DEVIATION_CLEAR_HOURS of within-tolerance segments"
        actor: IncubationOperator
        preconditions:
          - "environment_status is DEVIATION_OPEN"
        side_effects:
          - "deviation_degree_hours += segment_degree_hours (0 for within-tolerance segments)"
          - "increments version by 1"
      - from: DEVIATION_RESOLVED
        to: DEVIATION_OPEN
        trigger: "POST /setter-loads/{id}/environment-readings whose closed segment_degree_hours > DEVIATION_OPEN_THRESHOLD_DH"
        actor: IncubationOperator
        preconditions:
          - "environment_status is DEVIATION_RESOLVED"
        side_effects:
          - "deviation_degree_hours += segment_degree_hours (cumulative across cycles, never reset)"
          - "set deviation_opened_at = recorded_at of the ingested reading"
          - "increments version by 1"
      - from: NOMINAL
        to: NOMINAL
        trigger: "POST /setter-loads/{id}/environment-readings within tolerance"
        actor: IncubationOperator
        preconditions:
          - "load status is INCUBATING"
        side_effects:
          - "deviation_degree_hours unchanged (segment_degree_hours is 0)"
          - "increments version by 1"

  - entity: HatcherLoad
    initial_state: HATCHING
    terminal_states: [PROCESSED]
    transitions:
      - from: HATCHING
        to: EARLY_PULLED
        trigger: "POST /hatcher-loads/{id}/pull with current logical clock < pull_window_start_at"
        actor: ChickProcessor
        preconditions:
          - "load status is HATCHING"
          - "hatched_count <= eggs_transferred, else ERR_COUNT_EXCEEDS_SOURCE"
        side_effects:
          - "set actual_pull_at, pull_offset_hours (negative), pull_class EARLY"
          - "set quality_flag = UNHEALED_NAVEL"
          - "set hold_release_at = actual_pull_at + EARLY_HOLD_HOURS"
          - "create ChickBatch in PULLED with quality_score_provisional from the PROVISIONAL variant"
          - "increments version by 1"
      - from: HATCHING
        to: WINDOW_PULLED
        trigger: "POST /hatcher-loads/{id}/pull with pull_window_start_at <= current logical clock <= pull_window_end_at"
        actor: ChickProcessor
        preconditions:
          - "load status is HATCHING"
          - "hatched_count <= eggs_transferred"
        side_effects:
          - "set actual_pull_at, pull_offset_hours = 0, pull_class WINDOW"
          - "quality_flag stays NONE and hold_release_at stays null"
          - "create ChickBatch in PULLED with quality_score_provisional from the PROVISIONAL variant"
          - "increments version by 1"
      - from: HATCHING
        to: LATE_PULLED
        trigger: "POST /hatcher-loads/{id}/pull with current logical clock > pull_window_end_at"
        actor: ChickProcessor
        preconditions:
          - "load status is HATCHING"
          - "hatched_count <= eggs_transferred"
        side_effects:
          - "set actual_pull_at, pull_offset_hours (positive), pull_class LATE"
          - "set quality_flag = DEHYDRATION"
          - "BreederFlock.late_pull_count += 1 on the batch's primary flock"
          - "create ChickBatch in PULLED with quality_score_provisional from the PROVISIONAL variant"
          - "increments version by 1"
      - from: EARLY_PULLED
        to: PROCESSED
        trigger: "POST /chick-batches/{id}/box"
        actor: ChickProcessor
        preconditions:
          - "current logical clock >= hold_release_at, else ERR_EARLY_HOLD_ACTIVE"
        side_effects:
          - "IncubationUnit.occupancy_status = FREE"
          - "increments version by 1"
      - from: WINDOW_PULLED
        to: PROCESSED
        trigger: "POST /chick-batches/{id}/box"
        actor: ChickProcessor
        preconditions:
          - "the batch reached BOXED"
        side_effects:
          - "IncubationUnit.occupancy_status = FREE"
          - "increments version by 1"
      - from: LATE_PULLED
        to: PROCESSED
        trigger: "POST /chick-batches/{id}/box"
        actor: ChickProcessor
        preconditions:
          - "the batch reached BOXED"
        side_effects:
          - "IncubationUnit.occupancy_status = FREE"
          - "increments version by 1"

  - entity: ChickBatch
    initial_state: PULLED
    terminal_states: [BOXED]
    transitions:
      - from: PULLED
        to: SEXED
        trigger: "POST /chick-batches/{id}/sex"
        actor: ChickProcessor
        preconditions:
          - "batch status is PULLED"
          - "male_count + female_count + unsexed_count + sexing_cull_count == hatched_count, else ERR_SEX_COUNT_MISMATCH"
        side_effects:
          - "store the four counts and compute preliminary_yield_pct"
          - "increments version by 1"
      - from: SEXED
        to: VACCINATED
        trigger: "POST /chick-batches/{id}/vaccinate"
        actor: ChickProcessor
        preconditions:
          - "batch status is SEXED"
        side_effects:
          - "compute vaccine_reject_rate, vaccine_cull_count, cull_count, saleable_count, final_yield_pct (calculation chick_yield_resolution)"
          - "increments version by 1"
      - from: VACCINATED
        to: BOXED
        trigger: "POST /chick-batches/{id}/box"
        actor: ChickProcessor
        preconditions:
          - "batch status is VACCINATED"
          - "HatcherLoad.hold_release_at is null or current logical clock >= hold_release_at, else ERR_EARLY_HOLD_ACTIVE"
        side_effects:
          - "compute box_count, unassigned_chicks = saleable_count and quality_score_final from the FINAL variant"
          - "HatcherLoad moves to PROCESSED and its unit is released"
          - "primary BreederFlock.hatchability_rolling_pct and hatchability_fertile_pct recomputed"
          - "if hatchability_rolling_pct < HATCHABILITY_THRESHOLD_PCT, auto-open a CorrectiveAction and increment BreederFlock.corrective_action_count, then recompute settable_forecast with CORRECTIVE_DERATE"
          - "increments version by 1"

  - entity: GrowerPlacementOrder
    initial_state: REQUESTED
    terminal_states: [FULFILLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /placement-orders/{id}/confirm"
        actor: HatcheryManager
        preconditions:
          - "order status is REQUESTED"
          - "GrowerFarm.biosecurity_status is CLEARED, else ERR_FARM_NOT_CLEARED"
          - "aggregate chicks over farm placement cycles overlapping [requested_placement_date, requested_placement_date + FARM_CYCLE_DAYS) stays <= GrowerFarm.capacity_chicks, else ERR_FARM_CAPACITY_EXCEEDED"
        side_effects:
          - "increments version by 1"
      - from: CONFIRMED
        to: PARTIALLY_FULFILLED
        trigger: "POST /chick-batches/{id}/allocations granting less than remaining_need"
        actor: HatcheryManager
        preconditions:
          - "order is eligible for the waterfall"
        side_effects:
          - "allocated_chicks += chicks_assigned and remaining_need recomputed"
          - "increments version by 1"
      - from: PARTIALLY_FULFILLED
        to: PARTIALLY_FULFILLED
        trigger: "POST /chick-batches/{id}/allocations granting less than remaining_need again (self-loop)"
        actor: HatcheryManager
        preconditions:
          - "remaining_need > 0"
        side_effects:
          - "allocated_chicks += chicks_assigned"
          - "increments version by 1"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /chick-batches/{id}/allocations granting exactly remaining_need"
        actor: HatcheryManager
        preconditions:
          - "order is eligible and the grant equals remaining_need"
        side_effects:
          - "allocated_chicks = requested_chicks and remaining_need = 0"
          - "increments version by 1"
      - from: PARTIALLY_FULFILLED
        to: FULFILLED
        trigger: "POST /chick-batches/{id}/allocations closing the remaining need"
        actor: HatcheryManager
        preconditions:
          - "the grant equals remaining_need"
        side_effects:
          - "remaining_need = 0"
          - "increments version by 1"
      - from: FULFILLED
        to: PARTIALLY_FULFILLED
        trigger: "POST /delivery-assignments/{id}/reverse leaving remaining_need > 0 with allocated_chicks > 0 (compensating)"
        actor: HatcheryManager
        preconditions:
          - "the reversed assignment belongs to this order"
          - "allocated_chicks after reversal is > 0"
        side_effects:
          - "allocated_chicks -= chicks_assigned and remaining_need recomputed"
          - "increments version by 1"
      - from: FULFILLED
        to: CONFIRMED
        trigger: "POST /delivery-assignments/{id}/reverse leaving allocated_chicks = 0 (compensating)"
        actor: HatcheryManager
        preconditions:
          - "the reversal returns the order to zero allocation"
        side_effects:
          - "allocated_chicks = 0 and remaining_need = requested_chicks"
          - "increments version by 1"
      - from: PARTIALLY_FULFILLED
        to: CONFIRMED
        trigger: "POST /delivery-assignments/{id}/reverse leaving allocated_chicks = 0 (compensating)"
        actor: HatcheryManager
        preconditions:
          - "the reversal returns the order to zero allocation"
        side_effects:
          - "allocated_chicks = 0 and remaining_need = requested_chicks"
          - "increments version by 1"

  - entity: DeliveryAssignment
    initial_state: ASSIGNED
    terminal_states: [DELIVERED, REVERSED]
    transitions:
      - from: ASSIGNED
        to: DELIVERED
        trigger: "POST /delivery-assignments/{id}/deliver"
        actor: HatcheryManager
        preconditions:
          - "assignment status is ASSIGNED"
          - "GrowerFarm.biosecurity_status is still CLEARED, else ERR_FARM_NOT_CLEARED"
          - "abs(current logical clock date - scheduled_delivery_date) <= DELIVERY_TOLERANCE_DAYS, else ERR_TIMESTAMP_OUT_OF_RANGE"
        side_effects:
          - "set delivered_at"
          - "increments version by 1"
      - from: ASSIGNED
        to: REVERSED
        trigger: "POST /delivery-assignments/{id}/reverse"
        actor: HatcheryManager
        preconditions:
          - "assignment status is ASSIGNED"
        side_effects:
          - "ChickBatch.unassigned_chicks += chicks_assigned"
          - "GrowerPlacementOrder.allocated_chicks -= chicks_assigned and the order steps back from FULFILLED to PARTIALLY_FULFILLED or CONFIRMED"
          - "set reversal_reason"
          - "increments version by 1"

  - entity: LabTest
    initial_state: PENDING
    terminal_states: [NEGATIVE, POSITIVE, INVALID]
    transitions:
      - from: PENDING
        to: NEGATIVE
        trigger: "POST /lab-tests/{id}/release with result NEGATIVE"
        actor: Veterinarian
        preconditions:
          - "test status is PENDING, else ERR_LAB_TEST_ALREADY_RELEASED"
        side_effects:
          - "set released_at and result"
          - "increments version by 1"
      - from: PENDING
        to: POSITIVE
        trigger: "POST /lab-tests/{id}/release with result POSITIVE"
        actor: Veterinarian
        preconditions:
          - "test status is PENDING"
        side_effects:
          - "subject_type BREEDER_FLOCK: the flock moves IN_LAY -> EGG_HOLD and the egg condemnation cascade runs"
          - "subject_type INCUBATION_UNIT: unit sanitation_status = DIRTY"
          - "subject_type GROWER_FARM: farm biosecurity_status = QUARANTINED"
          - "increments version by 1"
      - from: PENDING
        to: INVALID
        trigger: "POST /lab-tests/{id}/release with result INVALID"
        actor: Veterinarian
        preconditions:
          - "test status is PENDING"
        side_effects:
          - "set released_at and result; no subject side effects, and the test does not satisfy any clearance precondition"
          - "increments version by 1"

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /corrective-actions/{id}/acknowledge"
        actor: FlockManager
        preconditions:
          - "action status is OPEN, else ERR_CORRECTIVE_ACTION_INVALID_STATE"
        side_effects:
          - "increments version by 1"
      - from: ACKNOWLEDGED
        to: IMPLEMENTED
        trigger: "POST /corrective-actions/{id}/implement"
        actor: FlockManager
        preconditions:
          - "action status is ACKNOWLEDGED"
        side_effects:
          - "store implementation_note"
          - "increments version by 1"
      - from: IMPLEMENTED
        to: VERIFIED
        trigger: "POST /corrective-actions/{id}/verify with outcome PASS"
        actor: Veterinarian
        preconditions:
          - "action status is IMPLEMENTED"
          - "X-User-ID differs from opened_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "BreederFlock.corrective_action_count -= 1 and settable_forecast recomputed (CORRECTIVE_DERATE drops once the count returns to 0)"
          - "increments version by 1"
      - from: IMPLEMENTED
        to: OPEN
        trigger: "POST /corrective-actions/{id}/verify with outcome FAIL"
        actor: Veterinarian
        preconditions:
          - "action status is IMPLEMENTED"
          - "X-User-ID differs from opened_by_user_id"
        side_effects:
          - "verification_round += 1 (cyclic; the action re-enters the OPEN -> ACKNOWLEDGED -> IMPLEMENTED loop)"
          - "clear implementation_note to null"
          - "increments version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (optimistic concurrency on the parent version)
# =============================================================================
concurrency_rules:
  - name: egg-lot-draw-stale-version
    parent_entity: EggLot
    write_endpoint: "POST /setter-loads/{id}/items"
    occ_field: expected_egg_lot_version
    guarantee: "A draw against an EggLot must carry the lot version the caller last read. If it does not match EggLot.version at the time the write is applied, the write is rejected with ERR_STALE_VERSION (412) and no eggs move. On success EggLot.version increments by 1, so a replay of the same request with the same expected_egg_lot_version is rejected."
    error_id: ERR_STALE_VERSION
    http_status: 412
    serialization: "If an exact ordering fallback is required, use created_at; never use id"

  - name: chick-batch-allocate-stale-version
    parent_entity: ChickBatch
    write_endpoint: "POST /chick-batches/{id}/allocations"
    occ_field: expected_chick_batch_version
    guarantee: "An allocation run against a ChickBatch must carry the batch version the caller last read. A mismatch is rejected with ERR_STALE_VERSION (412) and no DeliveryAssignment rows are created. A successful run increments ChickBatch.version by 1, so the same expected_chick_batch_version cannot be replayed to double-allocate the same chicks."
    error_id: ERR_STALE_VERSION
    http_status: 412
    serialization: "If an exact ordering fallback is required, use created_at; never use id"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: flock_settable_forecast
    description: "Forecast of daily settable hatching eggs for a breeder flock, combining an age tier, a lighting factor, a nutrition factor, a settable ratio and a corrective-action derate."
    trigger: "On BreederFlock creation, on start-lay, on release-hold, on POST /breeder-flocks/{id}/recompute-forecast, and whenever corrective_action_count changes"
    inputs: [hen_count, age_weeks, photoperiod_hours, feed_grams_per_hen_day, corrective_action_count]
    algorithm: tiered_pricing
    formula: |
      age_weeks = floor((clock_now - hatch_date) / 86400 / 7)
      photoperiod_hours       = last lighting_steps entry with age_weeks <= flock.age_weeks, else BASE_PHOTOPERIOD_HOURS
      feed_grams_per_hen_day  = last feed_steps entry with age_weeks <= flock.age_weeks, else TARGET_FEED_G
      production_rate_pct =
          0.0   if age_weeks < 21
         45.0   if 21 <= age_weeks <= 24
         82.0   if 25 <= age_weeks <= 30
         74.0   if 31 <= age_weeks <= 45
         61.0   if age_weeks >= 46
      lighting_factor  = round(min(1.00, 0.70 + 0.03 * max(0, photoperiod_hours - 11.0)), 4)
      nutrition_factor = round(min(1.10, max(0.80, feed_grams_per_hen_day / TARGET_FEED_G)), 4)
      derate           = CORRECTIVE_DERATE if corrective_action_count >= 1 else 1.0
      settable_forecast = floor(hen_count
                                * (production_rate_pct / 100)
                                * lighting_factor
                                * nutrition_factor
                                * SETTABLE_RATIO
                                * derate)
      # Pinned evaluation order: the five multiplicands are applied to hen_count in the order
      # written above and only the final product is floored. lighting_factor and nutrition_factor
      # are each rounded to 4 dp BEFORE multiplication; no other intermediate rounding occurs.
    constants:
      BASE_PHOTOPERIOD_HOURS: 8.0
      TARGET_FEED_G: 160.0
      SETTABLE_RATIO: 0.94
      CORRECTIVE_DERATE: 0.95
    precision: "lighting_factor and nutrition_factor 4 decimal places round_half_up; production_rate_pct 1 decimal place; settable_forecast is an integer produced by floor of the final product"

  - name: egg_lot_effective_age_days
    description: "Age-of-egg in effective days: calendar age scaled by a storage-temperature factor plus a permanent penalty for every completed sanitation cycle."
    trigger: "On egg lot grading, storage, sanitation release, and on every read of the lot; snapshotted into SetterLoadItem.effective_age_days_at_set when eggs are drawn"
    inputs: [collected_at, storage_temp_c, status, sanitation_cycle_count]
    algorithm: threshold
    formula: |
      base_days = (clock_now - collected_at) / 86400          # fractional days, not rounded here
      factor    = 2.0  if the lot has never been stored (stored_at is null)     # UNSTORED
                = 1.5  if storage_temp_c > STORAGE_TEMP_BOUNDARY_C              # WARM
                = 1.0  otherwise                                               # COOL, includes exactly 18.0
      effective_age_days = round(base_days * factor
                                 + SANITATION_AGE_PENALTY_DAYS * sanitation_cycle_count, 2)
      # STORAGE_TEMP_BOUNDARY_C is exclusive: storage_temp_c == 18.0 is COOL, 18.01 is WARM.
    constants:
      SANITATION_AGE_PENALTY_DAYS: 0.75
      STORAGE_TEMP_BOUNDARY_C: 18.0
      WARM_FACTOR: 1.5
      COOL_FACTOR: 1.0
      UNSTORED_FACTOR: 2.0
    precision: "2 decimal places, round_half_up; the sanitation penalty is added before the single rounding step"

  - name: incubation_pull_window
    description: "Derives the incubation delay caused by egg storage age and the resulting transfer time, nominal pull time and hatch window for a setter load."
    trigger: "POST /setter-loads/{id}/start"
    inputs: [ACTIVE SetterLoadItems, IncubationProfile.transfer_hours, IncubationProfile.total_hours, set_at]
    algorithm: weighted_scoring
    formula: |
      # Step 1 — egg-count weighted mean over ACTIVE items only (VOIDED items excluded):
      weighted_age_days = round( sum(item.eggs_taken * item.effective_age_days_at_set)
                                 / sum(item.eggs_taken), 4 )
      # Step 2 — free storage allowance, then ceiling. The order is pinned: the weighted mean is
      # computed and rounded to 4 dp FIRST, then the allowance is subtracted, then a single ceil is
      # applied to the whole expression. Ceiling each item's own delay and then weighting produces a
      # different answer and is wrong.
      storage_delay_hours = max(0, ceil( max(0.0, weighted_age_days - FREE_STORAGE_DAYS)
                                         * HOUR_PER_STORAGE_DAY ))
      planned_transfer_at  = set_at + (profile.transfer_hours + storage_delay_hours) hours
      planned_pull_at      = set_at + (profile.total_hours    + storage_delay_hours) hours
      pull_window_start_at = planned_pull_at - PULL_WINDOW_EARLY_HOURS hours
      pull_window_end_at   = planned_pull_at + PULL_WINDOW_LATE_HOURS  hours
    constants:
      FREE_STORAGE_DAYS: 3
      HOUR_PER_STORAGE_DAY: 1.0
      PULL_WINDOW_EARLY_HOURS: 6
      PULL_WINDOW_LATE_HOURS: 6
    precision: "weighted_age_days 4 decimal places round_half_up; storage_delay_hours is a whole number of hours produced by a single ceil"

  - name: deviation_degree_hours
    description: "Cumulative out-of-tolerance degree-hours for a setter load, integrated as a left-endpoint step function over the load's environment readings."
    trigger: "POST /setter-loads/{id}/environment-readings (incremental, once per ingested reading)"
    inputs: [EnvironmentReading.recorded_at, EnvironmentReading.temp_c, IncubationProfile.stages]
    algorithm: chronological
    formula: |
      # Readings are processed in recorded_at ASC order, created_at ASC as the only tie-break.
      # Ingesting reading R_n closes the segment [R_{n-1}.recorded_at, R_n.recorded_at) and charges
      # it at the PREVIOUS reading's excess, held constant across the segment (left-endpoint step):
      excess_prev   = max(0.0, R_{n-1}.abs_deviation_c - TEMP_TOLERANCE_C)
      span_hours    = (R_n.recorded_at - R_{n-1}.recorded_at) / 3600
      segment_degree_hours = round(excess_prev * span_hours, 3)
      deviation_degree_hours += segment_degree_hours     # accumulated, never reset
      # The first reading of a load closes no segment: segment_degree_hours = 0.
      # Each reading's abs_deviation_c uses the target temp of the profile stage whose half-open
      # range [from_hour, to_hour) contains that reading's elapsed_hours.
      #
      # Environment status transitions, evaluated after the accumulation above:
      if segment_degree_hours > DEVIATION_OPEN_THRESHOLD_DH:
          environment_status = DEVIATION_OPEN; deviation_opened_at = R_n.recorded_at
      elif environment_status == DEVIATION_OPEN and
           the uninterrupted run of within-tolerance segments ending at R_n spans
           >= DEVIATION_CLEAR_HOURS hours:
          environment_status = DEVIATION_RESOLVED
      # A segment is within tolerance when its segment_degree_hours is exactly 0.
      # The comparison against DEVIATION_OPEN_THRESHOLD_DH is strictly greater-than: a segment of
      # exactly 1.500 degree-hours does NOT open a deviation.
    constants:
      TEMP_TOLERANCE_C: 0.30
      DEVIATION_OPEN_THRESHOLD_DH: 1.50
      DEVIATION_CLEAR_HOURS: 2.0
    precision: "abs_deviation_c 2 decimal places; segment_degree_hours and deviation_degree_hours 3 decimal places, round_half_up; each segment is rounded before it is added to the running total"

  - name: chick_yield_resolution
    description: "Resolves sexing counts and the vaccination reject tier into culls, saleable chicks, final yield and box count. The tier is keyed on a preliminary yield that must be computed before the tier is known, so the seven steps run in a pinned order."
    trigger: "POST /chick-batches/{id}/sex (steps 1-2) and POST /chick-batches/{id}/vaccinate (steps 3-6) and POST /chick-batches/{id}/box (step 7)"
    inputs: [hatched_count, male_count, female_count, unsexed_count, sexing_cull_count]
    algorithm: constraint_propagation
    formula: |
      # Pinned order — each step consumes only outputs of earlier steps. The apparent circularity
      # (reject rate depends on yield, yield depends on rejects) is resolved by keying the tier on
      # the PRELIMINARY yield, which excludes vaccine culls.
      1. male_count + female_count + unsexed_count + sexing_cull_count == hatched_count  (else ERR_SEX_COUNT_MISMATCH)
      2. preliminary_yield_pct = round((hatched_count - sexing_cull_count) / hatched_count * 100, 2)
      3. vaccine_reject_rate =
             0.004  if preliminary_yield_pct >= 96.0
             0.008  if 92.0 <= preliminary_yield_pct < 96.0
             0.015  if 85.0 <= preliminary_yield_pct < 92.0
             0.028  if preliminary_yield_pct < 85.0
      4. vaccine_cull_count = ceil((hatched_count - sexing_cull_count) * vaccine_reject_rate)
      5. cull_count     = sexing_cull_count + vaccine_cull_count
         saleable_count = hatched_count - cull_count
      6. final_yield_pct = round(saleable_count / hatched_count * 100, 2)
      7. box_count = ceil(saleable_count / BOX_SIZE)
      # The tier lookup uses the ROUNDED preliminary_yield_pct: an unrounded 95.996 rounds to 96.00
      # and therefore selects the 0.004 tier.
    constants:
      BOX_SIZE: 100
      TIER_A_MIN_PCT: 96.0
      TIER_B_MIN_PCT: 92.0
      TIER_C_MIN_PCT: 85.0
      TIER_A_RATE: 0.004
      TIER_B_RATE: 0.008
      TIER_C_RATE: 0.015
      TIER_D_RATE: 0.028
    precision: "percentages 2 decimal places round_half_up; vaccine_cull_count and box_count are integers produced by ceil"

  - name: chick_quality_score
    description: "Chick quality score out of 100, penalising pull timing outside the hatch window, inherited incubation temperature deviation, culls and branch quality flags."
    trigger: "PROVISIONAL at POST /hatcher-loads/{id}/pull; FINAL at POST /chick-batches/{id}/box"
    inputs: [pull_offset_hours, pull_class, inherited_degree_hours, cull_count, hatched_count, quality_flag]
    algorithm: weighted_scoring
    formula: |
      early_penalty = round(EARLY_PENALTY_PER_H * abs(pull_offset_hours), 2) if pull_class == EARLY else 0.00
      late_penalty  = round(LATE_PENALTY_PER_H  * pull_offset_hours,      2) if pull_class == LATE  else 0.00
      env_penalty   = min(ENV_PENALTY_CAP, round(DEG_HOUR_WEIGHT * inherited_degree_hours, 2))
      cull_penalty  = round(CULL_WEIGHT * (cull_count / hatched_count * 100), 2)
      flag_penalty  = FLAG_PENALTY if quality_flag != NONE else 0.00
      score = round(100.00 - early_penalty - late_penalty - env_penalty
                           - cull_penalty - flag_penalty, 2)
      # Each penalty is rounded to 2 dp before subtraction; the subtraction order is as written.
      # cull_penalty is computed from the UNROUNDED cull rate percentage.
    constants:
      EARLY_PENALTY_PER_H: 1.80
      LATE_PENALTY_PER_H: 2.40
      DEG_HOUR_WEIGHT: 3.00
      ENV_PENALTY_CAP: 25.00
      CULL_WEIGHT: 0.90
      FLAG_PENALTY: 4.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "Computed at POST /hatcher-loads/{id}/pull and stored in ChickBatch.quality_score_provisional"
        difference: "cull_penalty is forced to 0.00 (no culls are known yet) and flag_penalty is forced to 0.00 even when the branch already set quality_flag. Only the pull-timing penalty and the inherited environment penalty apply."
      - name: FINAL
        when: "Computed at POST /chick-batches/{id}/box and stored in ChickBatch.quality_score_final"
        difference: "cull_penalty uses the resolved cull_count (sexing culls plus vaccine culls) and flag_penalty applies in full when quality_flag is UNHEALED_NAVEL or DEHYDRATION. The pull-timing and environment penalties are identical to the PROVISIONAL variant, so the delta is exactly cull_penalty + flag_penalty."

  - name: flock_hatchability_rolling
    description: "Rolling hatchability for a breeder flock over its most recent completed sets, on two different denominators. The SET_BASIS variant is the only one that gates corrective action."
    trigger: "POST /chick-batches/{id}/box"
    inputs: [boxed ChickBatch.saleable_count, SetterLoad.total_eggs_set, SetterLoad.fertile_count]
    algorithm: aggregation
    formula: |
      # Window: the flock's completed sets ordered by SetterLoad.set_at DESC, created_at DESC as the
      # only tie-break, truncated to the first ROLLING_WINDOW_SETS entries. A completed set is one
      # whose HatcherLoad produced a ChickBatch that has reached BOXED. ABORTED loads never enter
      # the window. The flock enters the window as the primary_flock_id of the ChickBatch.
      hatchability_rolling_pct = round( sum(window.saleable_count)
                                        / sum(window.total_eggs_set) * 100, 2 )   # SET_BASIS
      hatchability_fertile_pct = round( sum(window.saleable_count)
                                        / sum(window.fertile_count)  * 100, 2 )   # FERTILE_BASIS
      # Corrective-action gate — SET_BASIS only, strictly less than:
      if hatchability_rolling_pct < HATCHABILITY_THRESHOLD_PCT:
          open a CorrectiveAction with trigger_reason HATCHABILITY_BELOW_THRESHOLD
      # Both variants are pooled ratios (sum of numerators over sum of denominators), NOT the mean
      # of the per-set percentages.
    constants:
      ROLLING_WINDOW_SETS: 3
      HATCHABILITY_THRESHOLD_PCT: 82.0
    precision: "2 decimal places, round_half_up; the ratio is rounded once, after both sums are complete"
    variants:
      - name: SET_BASIS
        when: "Stored in BreederFlock.hatchability_rolling_pct and used by the corrective-action threshold"
        difference: "Denominator is the sum of SetterLoad.total_eggs_set (all eggs set, fertile or not), so infertility depresses the number and can trip the threshold."
      - name: FERTILE_BASIS
        when: "Stored in BreederFlock.hatchability_fertile_pct and reported for analytics only"
        difference: "Denominator is the sum of SetterLoad.fertile_count from candling, isolating incubation performance from flock fertility. It is always >= the SET_BASIS value and never gates corrective action."

  - name: chick_allocation_waterfall
    description: "Allocates a boxed batch's unassigned chicks across eligible grower placement orders in whole boxes, highest priority order first."
    trigger: "POST /chick-batches/{id}/allocations"
    inputs: [ChickBatch.unassigned_chicks, ChickBatch.breed, eligible GrowerPlacementOrders, clock_now]
    algorithm: waterfall_allocation
    formula: |
      # Eligibility filter — an order qualifies only when ALL hold:
      #   order.status IN {CONFIRMED, PARTIALLY_FULFILLED}
      #   order.requested_breed == batch.breed
      #   order.farm.biosecurity_status == CLEARED
      #   abs(date(order.requested_placement_date) - date(clock_now)) <= DELIVERY_TOLERANCE_DAYS
      #   order.remaining_need > 0
      # Ranking — requested_placement_date ASC, then remaining_need DESC,
      #           then created_at ASC as the only tie-break. id is never used.
      pool = batch.unassigned_chicks
      for order in ranked_eligible_orders:
          if pool < BOX_SIZE: break
          grant = floor(min(order.remaining_need, pool) / BOX_SIZE) * BOX_SIZE
          if grant == 0: continue
          create DeliveryAssignment(chicks_assigned = grant,
                                    boxes_assigned  = grant / BOX_SIZE,
                                    scheduled_delivery_date = order.requested_placement_date)
          pool -= grant
      batch.unassigned_chicks = pool     # the sub-box remainder is never allocated
      if no order qualified at all: reject the whole call with ERR_NO_ELIGIBLE_PLACEMENT_ORDER
      # Earlier orders are filled to the whole box before any chicks reach a later order, even when
      # that leaves a later order at zero.
    constants:
      BOX_SIZE: 100
      DELIVERY_TOLERANCE_DAYS: 2
    precision: "integer chicks; every grant is an exact multiple of BOX_SIZE produced by floor division"

  - name: conservation_invariants
    description: "Two counting invariants that must hold after every write, in the same response that performed the write."
    trigger: "Evaluated after every mutation touching egg lots, setter load items, chick batches or delivery assignments"
    inputs: [EggLot.settable_count, SetterLoadItem.eggs_taken, ChickBatch.saleable_count, DeliveryAssignment.chicks_assigned]
    algorithm: aggregation
    formula: |
      # Egg conservation:
      EggLot.settable_count == EggLot.eggs_remaining
                               + sum(eggs_taken over SetterLoadItems of the lot with item_status ACTIVE)
      # Chick conservation:
      ChickBatch.saleable_count == ChickBatch.unassigned_chicks
                                   + sum(chicks_assigned over DeliveryAssignments of the batch
                                         with status IN {ASSIGNED, DELIVERED})
      # VOIDED items and REVERSED assignments drop out of the sums, and the compensating side effect
      # must restore the counterpart field in the same request so neither invariant ever drifts.
      # A CONDEMNED lot keeps settable_count for audit but has eggs_remaining 0 and no ACTIVE items.
    constants:
      BOX_SIZE: 100
    precision: "exact integer equality; no tolerance"

  - name: unit_and_farm_window_occupancy
    description: "Two overlap tests with deliberately different interval semantics: incubation units use a closed interval plus a sanitation turnaround buffer, grower farms use a half-open placement cycle with an aggregate capacity ceiling."
    trigger: "POST /setter-loads (unit window) and POST /placement-orders/{id}/confirm (farm cycle)"
    inputs: [planned_set_at, IncubationProfile.total_hours, requested_placement_date, requested_chicks, GrowerFarm.capacity_chicks]
    algorithm: interval_merge
    formula: |
      # (a) IncubationUnit — CLOSED interval, single-occupancy, plus turnaround:
      busy_from = existing.planned_set_at
      busy_to   = existing.planned_set_at + existing.profile.total_hours hours
                                          + SETTER_TURNAROUND_HOURS hours
      conflict when new.planned_set_at <= busy_to AND busy_from <= new_to,
        where new_to = new.planned_set_at + new.profile.total_hours + SETTER_TURNAROUND_HOURS hours
      # Touching endpoints CONFLICT: a new load starting exactly at busy_to is rejected with
      # ERR_UNIT_WINDOW_CONFLICT. Loads in ABORTED or TRANSFERRED do not occupy the unit.
      #
      # (b) GrowerFarm — HALF-OPEN cycle, aggregate capacity:
      cycle = [requested_placement_date, requested_placement_date + FARM_CYCLE_DAYS days)
      overlapping = other orders of the same farm in CONFIRMED, PARTIALLY_FULFILLED or FULFILLED
                    whose cycle intersects the new cycle
      conflict when requested_chicks + sum(overlapping.requested_chicks) > farm.capacity_chicks
        -> ERR_FARM_CAPACITY_EXCEEDED
      # Touching endpoints DO NOT conflict: an order placed exactly FARM_CYCLE_DAYS after an
      # existing one shares no time and consumes no shared capacity. Individually valid orders can
      # still fail on the aggregate.
    constants:
      SETTER_TURNAROUND_HOURS: 12
      FARM_CYCLE_DAYS: 21
    precision: "whole hours for unit windows, whole days for farm cycles; both comparisons are exact"

# =============================================================================
# Table 4: Validation Rules Table (strict priority order; the FIRST violated rule
# in this list determines the response, and no later rule may mask an earlier one)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Every endpoint except POST /_clock/set_current_utc requires an X-User-ID header. Evaluated before the request body is parsed, so a request that is both unauthenticated and malformed returns ERR_UNAUTHENTICATED."

  - priority: 2
    category: auth
    check: "X-Role header present, a known role name, and authorized for the endpoint"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
    description: "Role authorization from the RBAC matrix. An unknown role string is treated as unauthorized, not as a shape error."

  - priority: 3
    category: auth
    check: "A GrowerFarm principal only touches resources whose farm.operator_user_id equals its X-User-ID"
    error_id: ERR_FARM_SCOPE_VIOLATION
    http_status: 403
    applies_to: ["POST /placement-orders", "GET /placement-orders/{id}", "GET /placement-orders", "GET /delivery-assignments/{id}", "GET /delivery-assignments", "GET /grower-farms/{id}"]
    description: "Row-level scoping for the only entity-backed role. Checked after role authorization and before existence, so an out-of-scope id returns ERR_FARM_SCOPE_VIOLATION rather than leaking whether it exists."

  - priority: 4
    category: existence
    check: "Every {id} path parameter resolves to a live row of the addressed entity"
    error_id: ERR_<ENTITY>_NOT_FOUND
    http_status: 404
    applies_to: all
    description: "Resolves the addressed row. The entity-specific code is used, e.g. ERR_EGG_LOT_NOT_FOUND for /egg-lots/{id}."

  - priority: 5
    category: existence
    check: "Every foreign-key field in the request body resolves to a live row of its parent entity"
    error_id: ERR_<PARENT>_NOT_FOUND
    http_status: 404
    applies_to: ["POST /breeder-flocks", "POST /egg-lots", "POST /setter-loads", "POST /setter-loads/{id}/items", "POST /setter-loads/{id}/transfer", "POST /placement-orders", "POST /lab-tests"]
    description: "Body references are resolved in the order the fields are declared in the entity table. LabTest.subject_id is resolved against the table selected by subject_type only."

  - priority: 6
    category: shape
    check: "All required body fields present with the declared type, and every enum value inside its declared set"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    description: "Structural validation. Unknown extra body fields are ignored, not rejected. Fields declared source: computed or source: system are ignored when supplied by a client."

  - priority: 7
    category: shape
    check: "limit within [1, 100] and offset >= 0 on list endpoints"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: ["GET /breeder-flocks", "GET /egg-lots", "GET /setter-loads", "GET /setter-loads/{id}/items", "GET /setter-loads/{id}/environment-readings", "GET /egg-lots/{id}/setter-load-items", "GET /hatcher-loads", "GET /chick-batches", "GET /placement-orders", "GET /delivery-assignments", "GET /lab-tests", "GET /corrective-actions"]
    description: "limit defaults to 10 and offset to 0. limit 0, limit 101 and negative offset are all rejected."

  - priority: 8
    category: shape
    check: "Every count field in the body is >= its declared minimum and never negative"
    error_id: ERR_NON_POSITIVE_COUNT
    http_status: 400
    applies_to: ["POST /breeder-flocks", "POST /egg-lots", "POST /egg-lots/{id}/grade", "POST /setter-loads/{id}/items", "POST /setter-loads/{id}/candle", "POST /hatcher-loads/{id}/pull", "POST /chick-batches/{id}/sex", "POST /placement-orders", "POST /grower-farms", "POST /incubation-units"]
    description: "Distinguishes a semantically impossible count from a type error: eggs_taken 0 or -5 is ERR_NON_POSITIVE_COUNT, eggs_taken \"many\" is ERR_INVALID_REQUEST. Zero-valued grading sub-counts other than grade_a_count are allowed."

  - priority: 9
    category: segregation_of_duties
    check: "The acting X-User-ID differs from the user recorded on the opposite side of the duty split"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /breeder-flocks/{id}/release-hold", "POST /corrective-actions/{id}/verify"]
    description: "The user who drove a flock into EGG_HOLD may not release it, and the user whose call auto-opened a CorrectiveAction may not verify it. Checked before state, so a same-user call against a wrongly-stated row still returns ERR_SEGREGATION_OF_DUTIES."

  - priority: 10
    category: concurrency
    check: "expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /setter-loads/{id}/items", "POST /chick-batches/{id}/allocations"]
    description: "Optimistic concurrency on the parent row (EggLot, ChickBatch). Evaluated before any state or business rule, so a stale version against an ineligible parent returns ERR_STALE_VERSION."

  - priority: 11
    category: state
    check: "BreederFlock is in a state that admits the requested transition"
    error_id: ERR_FLOCK_INVALID_STATE
    http_status: 409
    applies_to: ["POST /breeder-flocks/{id}/start-lay", "POST /breeder-flocks/{id}/deplete", "POST /breeder-flocks/{id}/release-hold"]
    description: "Covers repeat triggers (start-lay twice) and terminal lockdown (any transition out of DEPLETED)."

  - priority: 12
    category: state
    check: "EggLot is in a state that admits the requested transition"
    error_id: ERR_EGG_LOT_INVALID_STATE
    http_status: 409
    applies_to: ["POST /egg-lots/{id}/grade", "POST /egg-lots/{id}/store", "POST /egg-lots/{id}/sanitation-hold", "POST /egg-lots/{id}/sanitation-release", "POST /egg-lots/{id}/condemn", "POST /setter-loads/{id}/items"]
    description: "A lot in CONSUMED or CONDEMNED admits nothing; a lot in COLLECTED cannot be stored; a lot in GRADED cannot be drawn from."

  - priority: 13
    category: state
    check: "SetterLoad is in a state that admits the requested transition"
    error_id: ERR_INCUBATION_INVALID_STATE
    http_status: 409
    applies_to: ["POST /setter-loads/{id}/items", "POST /setter-loads/{id}/start", "POST /setter-loads/{id}/candle", "POST /setter-loads/{id}/transfer", "POST /setter-loads/{id}/abort", "POST /setter-loads/{id}/environment-readings"]
    description: "Items may only be added while PLANNED; readings only while INCUBATING; transfer only from CANDLED; nothing from TRANSFERRED or ABORTED."

  - priority: 14
    category: state
    check: "HatcherLoad is in a state that admits the requested transition"
    error_id: ERR_INCUBATION_INVALID_STATE
    http_status: 409
    applies_to: ["POST /hatcher-loads/{id}/pull"]
    description: "A load may be pulled exactly once; a second pull against any of the three pulled states is rejected."

  - priority: 15
    category: state
    check: "ChickBatch is in a state that admits the requested transition"
    error_id: ERR_CHICK_FLOW_INVALID_STATE
    http_status: 409
    applies_to: ["POST /chick-batches/{id}/sex", "POST /chick-batches/{id}/vaccinate", "POST /chick-batches/{id}/box", "POST /chick-batches/{id}/allocations"]
    description: "The chick flow is strictly PULLED -> SEXED -> VACCINATED -> BOXED; skipping vaccination or allocating before boxing is rejected."

  - priority: 16
    category: state
    check: "GrowerPlacementOrder is in a state that admits the requested transition"
    error_id: ERR_ORDER_INVALID_STATE
    http_status: 409
    applies_to: ["POST /placement-orders/{id}/confirm"]
    description: "An order may be confirmed only from REQUESTED."

  - priority: 17
    category: state
    check: "DeliveryAssignment is in a state that admits the requested transition"
    error_id: ERR_ASSIGNMENT_INVALID_STATE
    http_status: 409
    applies_to: ["POST /delivery-assignments/{id}/deliver", "POST /delivery-assignments/{id}/reverse"]
    description: "DELIVERED and REVERSED are terminal; neither deliver nor reverse is possible from either."

  - priority: 18
    category: state
    check: "LabTest has not been released yet"
    error_id: ERR_LAB_TEST_ALREADY_RELEASED
    http_status: 409
    applies_to: ["POST /lab-tests/{id}/release"]
    description: "A released test is terminal in NEGATIVE, POSITIVE or INVALID and cannot be re-released, including with the same result."

  - priority: 19
    category: state
    check: "CorrectiveAction is in a state that admits the requested transition"
    error_id: ERR_CORRECTIVE_ACTION_INVALID_STATE
    http_status: 409
    applies_to: ["POST /corrective-actions/{id}/acknowledge", "POST /corrective-actions/{id}/implement", "POST /corrective-actions/{id}/verify"]
    description: "VERIFIED is terminal. After a FAIL verification the action is back in OPEN and must be acknowledged again before it can be implemented."

  - priority: 20
    category: state
    check: "Referenced configuration row is not retired"
    error_id: ERR_PROGRAM_RETIRED
    http_status: 409
    applies_to: ["POST /breeder-flocks", "POST /breeder-flocks/{id}/start-lay", "POST /setter-loads"]
    description: "A retired FlockProgram cannot back a new flock or a photostimulation start; a retired IncubationProfile cannot back a new setter load."

  - priority: 21
    category: business_safety
    check: "The flock has a NEGATIVE SALMONELLA_PULLORUM lab test on record"
    error_id: ERR_LAB_CLEARANCE_MISSING
    http_status: 422
    applies_to: ["POST /breeder-flocks/{id}/start-lay", "POST /breeder-flocks/{id}/release-hold"]
    description: "Biosecurity gate. A PENDING or INVALID test does not clear the flock; on release-hold the most recently collected test of that code must be NEGATIVE."

  - priority: 22
    category: business_safety
    check: "The IncubationUnit is SANITIZED before a load starts in it, and the load's environment dimension is not DEVIATION_OPEN when it transfers"
    error_id: ERR_UNIT_NOT_SANITIZED
    http_status: 422
    applies_to: ["POST /setter-loads/{id}/start", "POST /setter-loads/{id}/transfer"]
    description: "Hatchery sanitation gate. Starting a load consumes the sanitation, so a second load in the same unit needs a fresh sanitize call. On transfer this same priority also raises ERR_ENVIRONMENT_DEVIATION_OPEN when the load's independent environment_status dimension is still DEVIATION_OPEN, with the sanitation check evaluated first."

  - priority: 23
    category: business_safety
    check: "The GrowerFarm is CLEARED at both allocation and delivery time"
    error_id: ERR_FARM_NOT_CLEARED
    http_status: 422
    applies_to: ["POST /placement-orders/{id}/confirm", "POST /delivery-assignments/{id}/deliver"]
    description: "A farm quarantined by a POSITIVE GROWER_FARM lab test after its orders were confirmed can no longer receive deliveries, and its orders drop out of the allocation waterfall."

  - priority: 24
    category: business_temporal
    check: "The egg lot is young enough to set"
    error_id: ERR_EGG_TOO_OLD
    http_status: 422
    applies_to: ["POST /setter-loads/{id}/items"]
    description: "effective_age_days must be <= MAX_SETTABLE_AGE_DAYS (10.00) at the instant of the draw. Exactly 10.00 is allowed; 10.01 is rejected. The sanitation penalty counts toward this limit."

  - priority: 25
    category: business_temporal
    check: "Timestamps supplied by the client are inside the admissible range relative to the logical clock"
    error_id: ERR_TIMESTAMP_OUT_OF_RANGE
    http_status: 422
    applies_to: ["POST /egg-lots", "POST /breeder-flocks", "POST /setter-loads", "POST /setter-loads/{id}/environment-readings", "POST /lab-tests", "POST /placement-orders", "POST /delivery-assignments/{id}/deliver"]
    description: "Collection, placement and sampling instants may not be in the future; planned_set_at and requested_placement_date may not be in the past; a reading's recorded_at must be strictly after the load's latest reading and not before set_at; delivery must land within DELIVERY_TOLERANCE_DAYS of the scheduled date."

  - priority: 26
    category: business_temporal
    check: "An EARLY-pulled batch is not boxed before its hold expires"
    error_id: ERR_EARLY_HOLD_ACTIVE
    http_status: 422
    applies_to: ["POST /chick-batches/{id}/box"]
    description: "Chicks pulled before the hatch window need EARLY_HOLD_HOURS (4) of navel healing. Boxing at exactly hold_release_at is allowed."

  - priority: 27
    category: business_constraint
    check: "Grading sub-counts reconcile to collected_count"
    error_id: ERR_GRADE_COUNT_MISMATCH
    http_status: 422
    applies_to: ["POST /egg-lots/{id}/grade"]
    description: "grade_a_count + cracked_count + dirty_count + small_count must equal collected_count exactly."

  - priority: 28
    category: business_constraint
    check: "Grading yields at least one settable egg"
    error_id: ERR_NO_SETTABLE_EGGS
    http_status: 422
    applies_to: ["POST /egg-lots/{id}/grade"]
    description: "A lot that grades out to zero grade-A eggs cannot become GRADED; it must be condemned instead."

  - priority: 29
    category: business_constraint
    check: "Sexing counts reconcile to hatched_count"
    error_id: ERR_SEX_COUNT_MISMATCH
    http_status: 422
    applies_to: ["POST /chick-batches/{id}/sex"]
    description: "male_count + female_count + unsexed_count + sexing_cull_count must equal hatched_count exactly."

  - priority: 30
    category: business_constraint
    check: "A derived count never exceeds its source count"
    error_id: ERR_COUNT_EXCEEDS_SOURCE
    http_status: 422
    applies_to: ["POST /setter-loads/{id}/candle", "POST /hatcher-loads/{id}/pull"]
    description: "fertile_count <= SetterLoad.total_eggs_set and hatched_count <= HatcherLoad.eggs_transferred."

  - priority: 31
    category: business_constraint
    check: "A load has at least one ACTIVE item before it can start"
    error_id: ERR_NO_EGGS_LOADED
    http_status: 422
    applies_to: ["POST /setter-loads/{id}/start"]
    description: "A PLANNED load whose only items were voided by an egg condemnation cascade cannot be started."

  - priority: 32
    category: business_constraint
    check: "The unit is not already holding a non-terminal load, and the load fits the unit"
    error_id: ERR_UNIT_OCCUPIED
    http_status: 409
    applies_to: ["POST /setter-loads/{id}/start", "POST /setter-loads/{id}/transfer"]
    description: "Single-occupancy at run time, complementing the planning-time window conflict check. ERR_UNIT_CAPACITY_EXCEEDED is returned instead when total_eggs_set exceeds capacity_eggs, and ERR_UNIT_TYPE_MISMATCH when a HATCHER unit is used as a setter or vice versa."

  - priority: 33
    category: business_referential
    check: "The eggs' owning flock is not on EGG_HOLD"
    error_id: ERR_FLOCK_EGG_HOLD
    http_status: 422
    applies_to: ["POST /egg-lots", "POST /egg-lots/{id}/store", "POST /setter-loads/{id}/items"]
    description: "Cross-entity gate: while a flock is in EGG_HOLD none of its eggs may be collected, stored or drawn, even for lots that were already in storage before the hold."

  - priority: 34
    category: business_referential
    check: "The flock is old enough to be photostimulated"
    error_id: ERR_FLOCK_NOT_MATURE
    http_status: 422
    applies_to: ["POST /breeder-flocks/{id}/start-lay"]
    description: "age_weeks must be >= the program's stimulation_week. Exactly stimulation_week is allowed."

  - priority: 35
    category: business_referential
    check: "Breed agreement across the reference chain"
    error_id: ERR_BREED_MISMATCH
    http_status: 422
    applies_to: ["POST /breeder-flocks", "POST /setter-loads/{id}/items"]
    description: "A flock's breed must equal its program's breed, and an egg lot's flock breed must equal the setter load profile's breed."

  - priority: 36
    category: business_referential
    check: "A polymorphic lab-test subject resolves in the table selected by its discriminator"
    error_id: ERR_LAB_SUBJECT_INVALID
    http_status: 422
    applies_to: ["POST /lab-tests"]
    description: "subject_id must exist in BreederFlock, IncubationUnit or GrowerFarm as selected by subject_type. An id that exists in a different one of the three tables is still invalid."

  - priority: 37
    category: business_fiscal
    check: "A draw never exceeds the lot's remaining settable eggs"
    error_id: ERR_INSUFFICIENT_SETTABLE_EGGS
    http_status: 422
    applies_to: ["POST /setter-loads/{id}/items"]
    description: "eggs_taken <= EggLot.eggs_remaining. The egg conservation invariant is what makes this exact: two draws of 4000 against a 6000-egg lot fail on the second."

  - priority: 38
    category: business_fiscal
    check: "The planned unit window does not collide with another load's occupancy plus turnaround"
    error_id: ERR_UNIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /setter-loads"]
    description: "Closed-interval overlap against every PLANNED, INCUBATING or CANDLED load of the same unit, extended by SETTER_TURNAROUND_HOURS. Touching endpoints conflict."

  - priority: 39
    category: business_fiscal
    check: "Aggregate chicks across overlapping farm placement cycles stay within farm capacity, and at least one order is allocatable"
    error_id: ERR_FARM_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /placement-orders/{id}/confirm", "POST /chick-batches/{id}/allocations"]
    description: "Half-open 21-day cycles, aggregate ceiling: individually valid orders can still breach capacity together, while an order placed exactly 21 days later does not. On allocations, an empty eligible-order set is reported as ERR_NO_ELIGIBLE_PLACEMENT_ORDER instead."

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Every age, window, deviation and delivery-tolerance rule reads this clock."
    roles: [HatcheryManager, FlockManager, IncubationOperator, ChickProcessor, Veterinarian, GrowerFarm]
    code: 200
    input: [current_utc]
    output: {current_utc: datetime}
    side_effects: ["logical clock moves; no entity is mutated"]

  # --- configuration -------------------------------------------------------
  - method: POST
    path: "/flock-programs"
    description: "Creates a lighting and nutrition program"
    roles: [HatcheryManager]
    code: 201
    input: [code, breed, stimulation_week, lighting_steps, feed_steps]
    output: FlockProgram
    side_effects: ["retired defaults to false"]
  - method: GET
    path: "/flock-programs/{id}"
    description: "Reads one program"
    roles: [HatcheryManager, FlockManager, Veterinarian]
    code: 200
    input: []
    output: FlockProgram
    side_effects: []
  - method: POST
    path: "/flock-programs/{id}/retire"
    description: "Retires a program so no new flock may be placed under it"
    roles: [HatcheryManager]
    code: 200
    input: []
    output: FlockProgram
    side_effects: ["retired = true; increments version by 1"]
  - method: POST
    path: "/incubation-profiles"
    description: "Creates an incubation temperature and humidity profile"
    roles: [HatcheryManager]
    code: 201
    input: [code, breed, transfer_hours, total_hours, stages]
    output: IncubationProfile
    side_effects: []
  - method: GET
    path: "/incubation-profiles/{id}"
    description: "Reads one profile"
    roles: [HatcheryManager, IncubationOperator]
    code: 200
    input: []
    output: IncubationProfile
    side_effects: []
  - method: POST
    path: "/incubation-units"
    description: "Registers a setter or hatcher machine"
    roles: [HatcheryManager]
    code: 201
    input: [code, unit_type, capacity_eggs]
    output: IncubationUnit
    side_effects: ["sanitation_status DIRTY, occupancy_status FREE"]
  - method: GET
    path: "/incubation-units/{id}"
    description: "Reads one machine"
    roles: [HatcheryManager, IncubationOperator, Veterinarian]
    code: 200
    input: []
    output: IncubationUnit
    side_effects: []
  - method: POST
    path: "/incubation-units/{id}/sanitize"
    description: "Records a sanitation cycle on a machine"
    roles: [IncubationOperator]
    code: 200
    input: []
    output: IncubationUnit
    side_effects: ["sanitation_status = SANITIZED, sanitized_at = clock; increments version by 1"]

  # --- breeder flocks ------------------------------------------------------
  - method: POST
    path: "/breeder-flocks"
    description: "Places a breeder flock under a lighting and nutrition program"
    roles: [FlockManager]
    code: 201
    input: [code, program_id, breed, house_code, hatch_date, placed_at, hen_count, "source_flock_id?"]
    output: BreederFlock
    side_effects: ["status PLACED; flock_settable_forecast computed"]
  - method: GET
    path: "/breeder-flocks/{id}"
    description: "Reads one flock with its recomputed age and forecast fields"
    roles: [HatcheryManager, FlockManager, Veterinarian]
    code: 200
    input: []
    output: BreederFlock
    side_effects: ["age_weeks and the forecast chain are recomputed against the current clock; version unchanged"]
  - method: GET
    path: "/breeder-flocks"
    description: "Lists flocks, filterable by program, lineage source and status"
    roles: [HatcheryManager, FlockManager, Veterinarian]
    code: 200
    input: ["program_id?", "source_flock_id?", "status?", "limit?", "offset?"]
    output: "BreederFlock[]"
    side_effects: []
  - method: POST
    path: "/breeder-flocks/{id}/start-lay"
    description: "Photostimulates the flock into production"
    roles: [FlockManager]
    code: 200
    input: []
    output: BreederFlock
    side_effects: ["PLACED -> IN_LAY; forecast chain recomputed; increments version by 1"]
  - method: POST
    path: "/breeder-flocks/{id}/deplete"
    description: "Retires the flock at end of lay"
    roles: [FlockManager]
    code: 200
    input: []
    output: BreederFlock
    side_effects: ["-> DEPLETED; settable_forecast = 0; increments version by 1"]
  - method: POST
    path: "/breeder-flocks/{id}/release-hold"
    description: "Releases an EGG_HOLD after a clean re-test, by a different user than the one who opened it"
    roles: [Veterinarian]
    code: 200
    input: []
    output: BreederFlock
    side_effects: ["EGG_HOLD -> IN_LAY; hold audit fields cleared; increments version by 1"]
  - method: POST
    path: "/breeder-flocks/{id}/recompute-forecast"
    description: "Recomputes the age tier, lighting and nutrition factors and settable forecast against the current clock"
    roles: [FlockManager]
    code: 200
    input: []
    output: BreederFlock
    side_effects: ["flock_settable_forecast recomputed; increments version by 1"]

  # --- hatching eggs -------------------------------------------------------
  - method: POST
    path: "/egg-lots"
    description: "Records a hatching egg collection"
    roles: [FlockManager]
    code: 201
    input: [flock_id, collected_at, collected_count]
    output: EggLot
    side_effects: ["status COLLECTED; effective_age_days computed with the UNSTORED factor"]
  - method: GET
    path: "/egg-lots/{id}"
    description: "Reads one lot with its recomputed effective age"
    roles: [HatcheryManager, FlockManager, IncubationOperator, Veterinarian]
    code: 200
    input: []
    output: EggLot
    side_effects: ["effective_age_days recomputed against the current clock; version unchanged"]
  - method: GET
    path: "/egg-lots"
    description: "Lists lots, filterable by owning flock and status"
    roles: [HatcheryManager, FlockManager, IncubationOperator, Veterinarian]
    code: 200
    input: ["flock_id?", "status?", "limit?", "offset?"]
    output: "EggLot[]"
    side_effects: []
  - method: POST
    path: "/egg-lots/{id}/grade"
    description: "Grades a collected lot into settable and rejected eggs"
    roles: [FlockManager]
    code: 200
    input: [grade_a_count, cracked_count, dirty_count, small_count]
    output: EggLot
    side_effects: ["COLLECTED -> GRADED; settable_count and eggs_remaining set; increments version by 1"]
  - method: POST
    path: "/egg-lots/{id}/store"
    description: "Moves a graded lot into the egg cooler at a recorded temperature"
    roles: [IncubationOperator]
    code: 200
    input: [storage_temp_c]
    output: EggLot
    side_effects: ["GRADED -> IN_STORAGE; storage factor selected; increments version by 1"]
  - method: POST
    path: "/egg-lots/{id}/sanitation-hold"
    description: "Pulls a stored lot for a sanitation cycle"
    roles: [Veterinarian]
    code: 200
    input: []
    output: EggLot
    side_effects: ["IN_STORAGE -> SANITATION_HOLD; increments version by 1"]
  - method: POST
    path: "/egg-lots/{id}/sanitation-release"
    description: "Returns a sanitized lot to storage, permanently ageing it"
    roles: [IncubationOperator]
    code: 200
    input: []
    output: EggLot
    side_effects: ["SANITATION_HOLD -> IN_STORAGE; sanitation_cycle_count += 1; effective_age_days recomputed; increments version by 1"]
  - method: POST
    path: "/egg-lots/{id}/condemn"
    description: "Condemns a lot, voiding any outstanding setter draws"
    roles: [Veterinarian]
    code: 200
    input: [reason]
    output: EggLot
    side_effects: ["-> CONDEMNED; ACTIVE items voided; emptied PLANNED loads aborted and their units released; increments version by 1"]
  - method: GET
    path: "/egg-lots/{id}/setter-load-items"
    description: "Lists every draw made against this lot, including voided ones"
    roles: [HatcheryManager, IncubationOperator]
    code: 200
    input: ["item_status?", "limit?", "offset?"]
    output: "SetterLoadItem[]"
    side_effects: []

  # --- setter loads --------------------------------------------------------
  - method: POST
    path: "/setter-loads"
    description: "Plans a setter load in a machine under an incubation profile"
    roles: [IncubationOperator]
    code: 201
    input: [unit_id, profile_id, planned_set_at]
    output: SetterLoad
    side_effects: ["status PLANNED, environment_status NOMINAL; unit window conflict checked"]
  - method: GET
    path: "/setter-loads/{id}"
    description: "Reads one load with both state dimensions and the derived window"
    roles: [HatcheryManager, IncubationOperator, Veterinarian]
    code: 200
    input: []
    output: SetterLoad
    side_effects: []
  - method: GET
    path: "/setter-loads"
    description: "Lists loads, filterable by machine, profile and status"
    roles: [HatcheryManager, IncubationOperator, Veterinarian]
    code: 200
    input: ["unit_id?", "profile_id?", "status?", "environment_status?", "limit?", "offset?"]
    output: "SetterLoad[]"
    side_effects: []
  - method: POST
    path: "/setter-loads/{id}/items"
    description: "Draws eggs from a stored lot into a planned load under optimistic concurrency on the lot"
    roles: [IncubationOperator]
    code: 201
    input: [egg_lot_id, eggs_taken, expected_egg_lot_version]
    output: SetterLoadItem
    side_effects: ["lot eggs_remaining decremented and lot -> ALLOCATED; load total_eggs_set and weighted_age_days recomputed; EggLot version increments by 1"]
  - method: GET
    path: "/setter-loads/{id}/items"
    description: "Lists the load's draws"
    roles: [HatcheryManager, IncubationOperator]
    code: 200
    input: ["item_status?", "limit?", "offset?"]
    output: "SetterLoadItem[]"
    side_effects: []
  - method: POST
    path: "/setter-loads/{id}/start"
    description: "Starts incubation, deriving the storage delay, transfer time and hatch window"
    roles: [IncubationOperator]
    code: 200
    input: []
    output: SetterLoad
    side_effects: ["PLANNED -> INCUBATING; incubation_pull_window computed; unit OCCUPIED and DIRTY; contributing lots -> SET; increments version by 1"]
  - method: POST
    path: "/setter-loads/{id}/environment-readings"
    description: "Ingests one probe reading, closing the previous segment and updating the environment dimension"
    roles: [IncubationOperator]
    code: 201
    input: [recorded_at, temp_c, humidity_pct]
    output: EnvironmentReading
    side_effects: ["segment_degree_hours computed and accumulated into the load; environment_status may open or resolve a deviation; load version increments by 1"]
  - method: GET
    path: "/setter-loads/{id}/environment-readings"
    description: "Lists the load's readings in recorded_at order"
    roles: [HatcheryManager, IncubationOperator, Veterinarian]
    code: 200
    input: ["limit?", "offset?"]
    output: "EnvironmentReading[]"
    side_effects: []
  - method: POST
    path: "/setter-loads/{id}/candle"
    description: "Records the fertile egg count at candling"
    roles: [IncubationOperator]
    code: 200
    input: [fertile_count]
    output: SetterLoad
    side_effects: ["INCUBATING -> CANDLED; fertility_pct computed; increments version by 1"]
  - method: POST
    path: "/setter-loads/{id}/abort"
    description: "Aborts a load, voiding its draws and releasing its machine"
    roles: [HatcheryManager]
    code: 200
    input: [reason]
    output: SetterLoad
    side_effects: ["-> ABORTED; items voided; lots restored or condemned by stage; unit FREE; increments version by 1"]
  - method: POST
    path: "/setter-loads/{id}/transfer"
    description: "Transfers a candled load into a hatcher machine"
    roles: [IncubationOperator]
    code: 201
    input: [hatcher_unit_id]
    output: HatcherLoad
    side_effects: ["CANDLED -> TRANSFERRED; HatcherLoad created in HATCHING with the frozen window and inherited degree-hours; setter unit FREE, hatcher unit OCCUPIED and DIRTY; contributing lots -> CONSUMED"]

  # --- hatcher loads and hatch window --------------------------------------
  - method: GET
    path: "/hatcher-loads/{id}"
    description: "Reads one hatcher load with its window, pull class and quality flag"
    roles: [HatcheryManager, IncubationOperator, ChickProcessor]
    code: 200
    input: []
    output: HatcherLoad
    side_effects: []
  - method: GET
    path: "/hatcher-loads"
    description: "Lists hatcher loads, filterable by source load, machine and status"
    roles: [HatcheryManager, IncubationOperator, ChickProcessor]
    code: 200
    input: ["setter_load_id?", "unit_id?", "status?", "pull_class?", "limit?", "offset?"]
    output: "HatcherLoad[]"
    side_effects: []
  - method: POST
    path: "/hatcher-loads/{id}/pull"
    description: "Pulls chicks; the clock position relative to the hatch window selects the EARLY, WINDOW or LATE branch"
    roles: [ChickProcessor]
    code: 201
    input: [hatched_count]
    output: ChickBatch
    side_effects: ["branch-specific quality_flag, hold_release_at and flock late_pull_count; ChickBatch created in PULLED with the PROVISIONAL quality score"]

  # --- chick processing ----------------------------------------------------
  - method: GET
    path: "/chick-batches/{id}"
    description: "Reads one chick batch with both quality scores and the allocation pool"
    roles: [HatcheryManager, ChickProcessor, Veterinarian]
    code: 200
    input: []
    output: ChickBatch
    side_effects: []
  - method: GET
    path: "/chick-batches"
    description: "Lists chick batches, filterable by hatcher load and primary flock"
    roles: [HatcheryManager, ChickProcessor, Veterinarian]
    code: 200
    input: ["hatcher_load_id?", "primary_flock_id?", "status?", "limit?", "offset?"]
    output: "ChickBatch[]"
    side_effects: []
  - method: POST
    path: "/chick-batches/{id}/sex"
    description: "Records sexing counts and the preliminary yield"
    roles: [ChickProcessor]
    code: 200
    input: [male_count, female_count, unsexed_count, sexing_cull_count]
    output: ChickBatch
    side_effects: ["PULLED -> SEXED; preliminary_yield_pct computed; increments version by 1"]
  - method: POST
    path: "/chick-batches/{id}/vaccinate"
    description: "Vaccinates the batch, resolving the reject tier, culls, saleable count and final yield"
    roles: [ChickProcessor]
    code: 200
    input: [vaccine_code]
    output: ChickBatch
    side_effects: ["SEXED -> VACCINATED; chick_yield_resolution steps 3-6; increments version by 1"]
  - method: POST
    path: "/chick-batches/{id}/box"
    description: "Boxes the batch, freezing the final quality score and driving the flock hatchability and corrective-action cascade"
    roles: [ChickProcessor]
    code: 200
    input: []
    output: ChickBatch
    side_effects: ["VACCINATED -> BOXED; box_count and FINAL quality score computed; HatcherLoad -> PROCESSED and unit released; flock rolling hatchability recomputed; a below-threshold flock gets a CorrectiveAction, an incremented corrective_action_count and a derated settable_forecast; increments version by 1"]
  - method: POST
    path: "/chick-batches/{id}/allocations"
    description: "Runs the whole-box allocation waterfall over eligible placement orders under optimistic concurrency on the batch"
    roles: [HatcheryManager]
    code: 201
    input: [expected_chick_batch_version]
    output: "DeliveryAssignment[]"
    side_effects: ["DeliveryAssignment rows created in ASSIGNED; batch unassigned_chicks reduced; each served order advances to PARTIALLY_FULFILLED or FULFILLED; ChickBatch version increments by 1"]

  # --- grower farms and placement orders -----------------------------------
  - method: POST
    path: "/grower-farms"
    description: "Registers a grower farm and the operator principal that owns its scope"
    roles: [HatcheryManager]
    code: 201
    input: [code, operator_user_id, capacity_chicks]
    output: GrowerFarm
    side_effects: ["biosecurity_status PENDING"]
  - method: GET
    path: "/grower-farms/{id}"
    description: "Reads one farm"
    roles: [HatcheryManager, Veterinarian, GrowerFarm]
    code: 200
    input: []
    output: GrowerFarm
    side_effects: []
  - method: POST
    path: "/grower-farms/{id}/clear"
    description: "Clears a farm for chick placement after biosecurity review"
    roles: [Veterinarian]
    code: 200
    input: []
    output: GrowerFarm
    side_effects: ["biosecurity_status = CLEARED, cleared_at = clock; increments version by 1"]
  - method: POST
    path: "/placement-orders"
    description: "Places a chick placement order for a farm"
    roles: [HatcheryManager, GrowerFarm]
    code: 201
    input: [farm_id, requested_breed, requested_placement_date, requested_chicks]
    output: GrowerPlacementOrder
    side_effects: ["status REQUESTED; remaining_need = requested_chicks"]
  - method: GET
    path: "/placement-orders/{id}"
    description: "Reads one placement order"
    roles: [HatcheryManager, GrowerFarm]
    code: 200
    input: []
    output: GrowerPlacementOrder
    side_effects: []
  - method: GET
    path: "/placement-orders"
    description: "Lists placement orders, filterable by farm and status"
    roles: [HatcheryManager, GrowerFarm]
    code: 200
    input: ["farm_id?", "status?", "requested_breed?", "limit?", "offset?"]
    output: "GrowerPlacementOrder[]"
    side_effects: []
  - method: POST
    path: "/placement-orders/{id}/confirm"
    description: "Confirms an order against farm clearance and the aggregate 21-day cycle capacity"
    roles: [HatcheryManager]
    code: 200
    input: []
    output: GrowerPlacementOrder
    side_effects: ["REQUESTED -> CONFIRMED; order becomes eligible for the waterfall; increments version by 1"]

  # --- delivery ------------------------------------------------------------
  - method: GET
    path: "/delivery-assignments/{id}"
    description: "Reads one delivery assignment"
    roles: [HatcheryManager, GrowerFarm]
    code: 200
    input: []
    output: DeliveryAssignment
    side_effects: []
  - method: GET
    path: "/delivery-assignments"
    description: "Lists assignments, filterable by batch and order"
    roles: [HatcheryManager, GrowerFarm]
    code: 200
    input: ["chick_batch_id?", "placement_order_id?", "status?", "limit?", "offset?"]
    output: "DeliveryAssignment[]"
    side_effects: []
  - method: POST
    path: "/delivery-assignments/{id}/deliver"
    description: "Confirms delivery of the boxed chicks to the grower farm"
    roles: [HatcheryManager]
    code: 200
    input: []
    output: DeliveryAssignment
    side_effects: ["ASSIGNED -> DELIVERED; delivered_at set; increments version by 1"]
  - method: POST
    path: "/delivery-assignments/{id}/reverse"
    description: "Compensates an assignment, returning the chicks to the batch pool and stepping the order back"
    roles: [HatcheryManager]
    code: 200
    input: [reason]
    output: DeliveryAssignment
    side_effects: ["ASSIGNED -> REVERSED; batch unassigned_chicks restored; order allocated_chicks reduced and status stepped back; increments version by 1"]

  # --- laboratory and corrective action ------------------------------------
  - method: POST
    path: "/lab-tests"
    description: "Registers a laboratory sample against a flock, machine or farm"
    roles: [Veterinarian]
    code: 201
    input: [subject_type, subject_id, test_code, collected_at]
    output: LabTest
    side_effects: ["status PENDING"]
  - method: GET
    path: "/lab-tests/{id}"
    description: "Reads one laboratory test"
    roles: [HatcheryManager, Veterinarian, FlockManager]
    code: 200
    input: []
    output: LabTest
    side_effects: []
  - method: GET
    path: "/lab-tests"
    description: "Lists laboratory tests, filterable by polymorphic subject and status"
    roles: [HatcheryManager, Veterinarian, FlockManager]
    code: 200
    input: ["subject_type?", "subject_id?", "test_code?", "status?", "limit?", "offset?"]
    output: "LabTest[]"
    side_effects: []
  - method: POST
    path: "/lab-tests/{id}/release"
    description: "Releases a result; POSITIVE drives the subject-specific biosecurity cascade"
    roles: [Veterinarian]
    code: 200
    input: [result]
    output: LabTest
    side_effects: ["PENDING -> NEGATIVE | POSITIVE | INVALID; on POSITIVE the flock hold and egg condemnation cascade, the machine de-sanitation, or the farm quarantine runs; increments version by 1"]
  - method: GET
    path: "/corrective-actions/{id}"
    description: "Reads one breeder flock corrective action"
    roles: [HatcheryManager, FlockManager, Veterinarian]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: []
  - method: GET
    path: "/corrective-actions"
    description: "Lists corrective actions, filterable by flock and status"
    roles: [HatcheryManager, FlockManager, Veterinarian]
    code: 200
    input: ["flock_id?", "status?", "trigger_reason?", "limit?", "offset?"]
    output: "CorrectiveAction[]"
    side_effects: []
  - method: POST
    path: "/corrective-actions/{id}/acknowledge"
    description: "Acknowledges an open corrective action"
    roles: [FlockManager]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: ["OPEN -> ACKNOWLEDGED; increments version by 1"]
  - method: POST
    path: "/corrective-actions/{id}/implement"
    description: "Records the implemented corrective measure"
    roles: [FlockManager]
    code: 200
    input: [note]
    output: CorrectiveAction
    side_effects: ["ACKNOWLEDGED -> IMPLEMENTED; implementation_note stored; increments version by 1"]
  - method: POST
    path: "/corrective-actions/{id}/verify"
    description: "Verifies an implemented action; a FAIL outcome reopens it with an incremented verification round"
    roles: [Veterinarian]
    code: 200
    input: [outcome]
    output: CorrectiveAction
    side_effects: ["IMPLEMENTED -> VERIFIED on PASS, releasing the forecast derate; IMPLEMENTED -> OPEN on FAIL with verification_round += 1; increments version by 1"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - {id: ERR_UNAUTHENTICATED, http_status: 401, condition: "X-User-ID header missing or empty", applies_to: ["all endpoints except POST /_clock/set_current_utc"]}
  - {id: ERR_FORBIDDEN_ROLE, http_status: 403, condition: "X-Role missing, unknown, or not in the endpoint's roles list", applies_to: ["all endpoints"]}
  - {id: ERR_FARM_SCOPE_VIOLATION, http_status: 403, condition: "A GrowerFarm principal addresses a farm, order or assignment whose farm.operator_user_id is not its X-User-ID", applies_to: ["POST /placement-orders", "GET /placement-orders/{id}", "GET /placement-orders", "GET /delivery-assignments/{id}", "GET /delivery-assignments", "GET /grower-farms/{id}"]}
  - {id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, condition: "The acting user is the same user recorded on the opposite side of a duty split", applies_to: ["POST /breeder-flocks/{id}/release-hold", "POST /corrective-actions/{id}/verify"]}
  - {id: ERR_INVALID_REQUEST, http_status: 400, condition: "Missing required field, wrong type, or enum value outside its declared set", applies_to: ["all write endpoints"]}
  - {id: ERR_INVALID_PAGINATION, http_status: 400, condition: "limit outside [1, 100] or offset < 0", applies_to: ["all list endpoints"]}
  - {id: ERR_NON_POSITIVE_COUNT, http_status: 400, condition: "A count field is below its declared minimum, e.g. eggs_taken <= 0 or hen_count <= 0", applies_to: ["POST /breeder-flocks", "POST /egg-lots", "POST /egg-lots/{id}/grade", "POST /setter-loads/{id}/items", "POST /setter-loads/{id}/candle", "POST /hatcher-loads/{id}/pull", "POST /chick-batches/{id}/sex", "POST /placement-orders", "POST /grower-farms", "POST /incubation-units"]}
  - {id: ERR_STALE_VERSION, http_status: 412, condition: "expected_egg_lot_version or expected_chick_batch_version does not match the parent's current version", applies_to: ["POST /setter-loads/{id}/items", "POST /chick-batches/{id}/allocations"]}
  - {id: ERR_FLOCK_PROGRAM_NOT_FOUND, http_status: 404, condition: "program_id or /flock-programs/{id} does not resolve", applies_to: ["GET /flock-programs/{id}", "POST /flock-programs/{id}/retire", "POST /breeder-flocks"]}
  - {id: ERR_INCUBATION_PROFILE_NOT_FOUND, http_status: 404, condition: "profile_id or /incubation-profiles/{id} does not resolve", applies_to: ["GET /incubation-profiles/{id}", "POST /setter-loads"]}
  - {id: ERR_INCUBATION_UNIT_NOT_FOUND, http_status: 404, condition: "unit_id, hatcher_unit_id or /incubation-units/{id} does not resolve", applies_to: ["GET /incubation-units/{id}", "POST /incubation-units/{id}/sanitize", "POST /setter-loads", "POST /setter-loads/{id}/transfer"]}
  - {id: ERR_BREEDER_FLOCK_NOT_FOUND, http_status: 404, condition: "flock_id, source_flock_id or /breeder-flocks/{id} does not resolve", applies_to: ["GET /breeder-flocks/{id}", "POST /breeder-flocks", "POST /breeder-flocks/{id}/start-lay", "POST /breeder-flocks/{id}/deplete", "POST /breeder-flocks/{id}/release-hold", "POST /breeder-flocks/{id}/recompute-forecast", "POST /egg-lots"]}
  - {id: ERR_EGG_LOT_NOT_FOUND, http_status: 404, condition: "egg_lot_id or /egg-lots/{id} does not resolve", applies_to: ["GET /egg-lots/{id}", "GET /egg-lots/{id}/setter-load-items", "POST /egg-lots/{id}/grade", "POST /egg-lots/{id}/store", "POST /egg-lots/{id}/sanitation-hold", "POST /egg-lots/{id}/sanitation-release", "POST /egg-lots/{id}/condemn", "POST /setter-loads/{id}/items"]}
  - {id: ERR_SETTER_LOAD_NOT_FOUND, http_status: 404, condition: "/setter-loads/{id} does not resolve", applies_to: ["GET /setter-loads/{id}", "GET /setter-loads/{id}/items", "GET /setter-loads/{id}/environment-readings", "POST /setter-loads/{id}/items", "POST /setter-loads/{id}/start", "POST /setter-loads/{id}/environment-readings", "POST /setter-loads/{id}/candle", "POST /setter-loads/{id}/abort", "POST /setter-loads/{id}/transfer"]}
  - {id: ERR_HATCHER_LOAD_NOT_FOUND, http_status: 404, condition: "/hatcher-loads/{id} does not resolve", applies_to: ["GET /hatcher-loads/{id}", "POST /hatcher-loads/{id}/pull"]}
  - {id: ERR_CHICK_BATCH_NOT_FOUND, http_status: 404, condition: "/chick-batches/{id} does not resolve", applies_to: ["GET /chick-batches/{id}", "POST /chick-batches/{id}/sex", "POST /chick-batches/{id}/vaccinate", "POST /chick-batches/{id}/box", "POST /chick-batches/{id}/allocations"]}
  - {id: ERR_GROWER_FARM_NOT_FOUND, http_status: 404, condition: "farm_id or /grower-farms/{id} does not resolve", applies_to: ["GET /grower-farms/{id}", "POST /grower-farms/{id}/clear", "POST /placement-orders"]}
  - {id: ERR_PLACEMENT_ORDER_NOT_FOUND, http_status: 404, condition: "/placement-orders/{id} does not resolve", applies_to: ["GET /placement-orders/{id}", "POST /placement-orders/{id}/confirm"]}
  - {id: ERR_DELIVERY_ASSIGNMENT_NOT_FOUND, http_status: 404, condition: "/delivery-assignments/{id} does not resolve", applies_to: ["GET /delivery-assignments/{id}", "POST /delivery-assignments/{id}/deliver", "POST /delivery-assignments/{id}/reverse"]}
  - {id: ERR_LAB_TEST_NOT_FOUND, http_status: 404, condition: "/lab-tests/{id} does not resolve", applies_to: ["GET /lab-tests/{id}", "POST /lab-tests/{id}/release"]}
  - {id: ERR_CORRECTIVE_ACTION_NOT_FOUND, http_status: 404, condition: "/corrective-actions/{id} does not resolve", applies_to: ["GET /corrective-actions/{id}", "POST /corrective-actions/{id}/acknowledge", "POST /corrective-actions/{id}/implement", "POST /corrective-actions/{id}/verify"]}
  - {id: ERR_FLOCK_INVALID_STATE, http_status: 409, condition: "The flock's status does not admit the requested transition, including any transition out of DEPLETED and depleting a flock with ALLOCATED eggs", applies_to: ["POST /breeder-flocks/{id}/start-lay", "POST /breeder-flocks/{id}/deplete", "POST /breeder-flocks/{id}/release-hold"]}
  - {id: ERR_EGG_LOT_INVALID_STATE, http_status: 409, condition: "The lot's status does not admit the requested transition, including any transition out of CONSUMED or CONDEMNED", applies_to: ["POST /egg-lots/{id}/grade", "POST /egg-lots/{id}/store", "POST /egg-lots/{id}/sanitation-hold", "POST /egg-lots/{id}/sanitation-release", "POST /egg-lots/{id}/condemn", "POST /setter-loads/{id}/items"]}
  - {id: ERR_INCUBATION_INVALID_STATE, http_status: 409, condition: "The setter or hatcher load's status does not admit the requested transition, including a second pull of the same hatcher load", applies_to: ["POST /setter-loads/{id}/items", "POST /setter-loads/{id}/start", "POST /setter-loads/{id}/environment-readings", "POST /setter-loads/{id}/candle", "POST /setter-loads/{id}/abort", "POST /setter-loads/{id}/transfer", "POST /hatcher-loads/{id}/pull"]}
  - {id: ERR_CHICK_FLOW_INVALID_STATE, http_status: 409, condition: "The chick batch's status does not admit the requested step, e.g. vaccinating before sexing or allocating before boxing", applies_to: ["POST /chick-batches/{id}/sex", "POST /chick-batches/{id}/vaccinate", "POST /chick-batches/{id}/box", "POST /chick-batches/{id}/allocations"]}
  - {id: ERR_ORDER_INVALID_STATE, http_status: 409, condition: "The placement order is not in REQUESTED when confirmation is attempted", applies_to: ["POST /placement-orders/{id}/confirm"]}
  - {id: ERR_ASSIGNMENT_INVALID_STATE, http_status: 409, condition: "The delivery assignment is already DELIVERED or REVERSED", applies_to: ["POST /delivery-assignments/{id}/deliver", "POST /delivery-assignments/{id}/reverse"]}
  - {id: ERR_LAB_TEST_ALREADY_RELEASED, http_status: 409, condition: "The laboratory test has already been released", applies_to: ["POST /lab-tests/{id}/release"]}
  - {id: ERR_CORRECTIVE_ACTION_INVALID_STATE, http_status: 409, condition: "The corrective action's status does not admit the requested step, including any step from VERIFIED", applies_to: ["POST /corrective-actions/{id}/acknowledge", "POST /corrective-actions/{id}/implement", "POST /corrective-actions/{id}/verify"]}
  - {id: ERR_PROGRAM_RETIRED, http_status: 409, condition: "The referenced FlockProgram or IncubationProfile is retired", applies_to: ["POST /breeder-flocks", "POST /breeder-flocks/{id}/start-lay", "POST /setter-loads"]}
  - {id: ERR_LAB_CLEARANCE_MISSING, http_status: 422, condition: "No NEGATIVE SALMONELLA_PULLORUM test on record for the flock, or the latest such test is not NEGATIVE", applies_to: ["POST /breeder-flocks/{id}/start-lay", "POST /breeder-flocks/{id}/release-hold"]}
  - {id: ERR_UNIT_NOT_SANITIZED, http_status: 422, condition: "The target incubation machine's sanitation_status is DIRTY", applies_to: ["POST /setter-loads/{id}/start", "POST /setter-loads/{id}/transfer"]}
  - {id: ERR_ENVIRONMENT_DEVIATION_OPEN, http_status: 422, condition: "The setter load's independent environment dimension is still DEVIATION_OPEN, so the eggs may not be transferred to a hatcher", applies_to: ["POST /setter-loads/{id}/transfer"]}
  - {id: ERR_FARM_NOT_CLEARED, http_status: 422, condition: "The grower farm's biosecurity_status is not CLEARED", applies_to: ["POST /placement-orders/{id}/confirm", "POST /delivery-assignments/{id}/deliver"]}
  - {id: ERR_EGG_TOO_OLD, http_status: 422, condition: "The lot's effective_age_days exceeds MAX_SETTABLE_AGE_DAYS (10.00) at the instant of the draw", applies_to: ["POST /setter-loads/{id}/items"]}
  - {id: ERR_TIMESTAMP_OUT_OF_RANGE, http_status: 422, condition: "A client timestamp is on the wrong side of the logical clock, a reading is not strictly after the load's latest reading, or a delivery falls outside DELIVERY_TOLERANCE_DAYS", applies_to: ["POST /breeder-flocks", "POST /egg-lots", "POST /setter-loads", "POST /setter-loads/{id}/candle", "POST /setter-loads/{id}/environment-readings", "POST /lab-tests", "POST /placement-orders", "POST /delivery-assignments/{id}/deliver"]}
  - {id: ERR_EARLY_HOLD_ACTIVE, http_status: 422, condition: "An EARLY-pulled batch is boxed before HatcherLoad.hold_release_at", applies_to: ["POST /chick-batches/{id}/box"]}
  - {id: ERR_GRADE_COUNT_MISMATCH, http_status: 422, condition: "The four grading sub-counts do not sum to collected_count", applies_to: ["POST /egg-lots/{id}/grade"]}
  - {id: ERR_NO_SETTABLE_EGGS, http_status: 422, condition: "grade_a_count is 0", applies_to: ["POST /egg-lots/{id}/grade"]}
  - {id: ERR_SEX_COUNT_MISMATCH, http_status: 422, condition: "The four sexing counts do not sum to hatched_count", applies_to: ["POST /chick-batches/{id}/sex"]}
  - {id: ERR_COUNT_EXCEEDS_SOURCE, http_status: 422, condition: "fertile_count exceeds total_eggs_set, or hatched_count exceeds eggs_transferred", applies_to: ["POST /setter-loads/{id}/candle", "POST /hatcher-loads/{id}/pull"]}
  - {id: ERR_NO_EGGS_LOADED, http_status: 422, condition: "The setter load has no ACTIVE item when a start is attempted", applies_to: ["POST /setter-loads/{id}/start"]}
  - {id: ERR_UNIT_OCCUPIED, http_status: 409, condition: "The target machine's occupancy_status is OCCUPIED", applies_to: ["POST /setter-loads/{id}/start", "POST /setter-loads/{id}/transfer"]}
  - {id: ERR_UNIT_TYPE_MISMATCH, http_status: 422, condition: "A HATCHER machine is used for a setter load or a SETTER machine is used as a transfer target", applies_to: ["POST /setter-loads", "POST /setter-loads/{id}/transfer"]}
  - {id: ERR_UNIT_CAPACITY_EXCEEDED, http_status: 422, condition: "total_eggs_set exceeds the machine's capacity_eggs at start", applies_to: ["POST /setter-loads/{id}/start"]}
  - {id: ERR_FLOCK_EGG_HOLD, http_status: 422, condition: "The eggs' owning flock is in EGG_HOLD", applies_to: ["POST /egg-lots", "POST /egg-lots/{id}/store", "POST /setter-loads/{id}/items"]}
  - {id: ERR_FLOCK_NOT_MATURE, http_status: 422, condition: "age_weeks is below the program's stimulation_week", applies_to: ["POST /breeder-flocks/{id}/start-lay"]}
  - {id: ERR_BREED_MISMATCH, http_status: 422, condition: "Flock breed differs from its program's breed, or a drawn lot's flock breed differs from the load profile's breed", applies_to: ["POST /breeder-flocks", "POST /setter-loads/{id}/items"]}
  - {id: ERR_LAB_SUBJECT_INVALID, http_status: 422, condition: "subject_id does not resolve in the table selected by subject_type", applies_to: ["POST /lab-tests"]}
  - {id: ERR_INSUFFICIENT_SETTABLE_EGGS, http_status: 422, condition: "eggs_taken exceeds the lot's eggs_remaining", applies_to: ["POST /setter-loads/{id}/items"]}
  - {id: ERR_UNIT_WINDOW_CONFLICT, http_status: 409, condition: "The planned load's occupancy window plus turnaround touches or overlaps another non-terminal load of the same machine", applies_to: ["POST /setter-loads"]}
  - {id: ERR_FARM_CAPACITY_EXCEEDED, http_status: 422, condition: "Aggregate requested chicks across overlapping 21-day farm cycles exceeds the farm's capacity_chicks", applies_to: ["POST /placement-orders/{id}/confirm"]}
  - {id: ERR_NO_ELIGIBLE_PLACEMENT_ORDER, http_status: 422, condition: "The allocation waterfall finds no eligible placement order at all", applies_to: ["POST /chick-batches/{id}/allocations"]}

