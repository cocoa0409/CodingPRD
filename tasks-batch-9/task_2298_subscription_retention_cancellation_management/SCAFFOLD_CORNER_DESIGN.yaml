      - name: renewal_sweep_abandons_stale_session_and_expires_its_grant
        claim_type: conditional_cascade
        grounds:
          - endpoints["POST /subscriptions/{id}/renewals"].side_effects
          - state_machines.CancellationSession.transitions.REASON_CAPTURED_to_ABANDONED
          - state_machines.SaveOfferGrant.transitions.PRESENTED_to_EXPIRED
          - global_constants.SESSION_TTL_HOURS
        distinguishing_aspect: |
          Step 3 of the renewal run is conditional on age, not on existence: a session started
          2026-01-10 is 28 days old at the 2026-02-07 renewal, so it is swept to ABANDONED and its
          PRESENTED grant to EXPIRED, while the renewal still issues the cycle-1 invoice for 4999
          in the same call.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A; template T_PAUSE (PAUSE 2 cycles, reason TOO_MUCH_PRODUCT, rank 20)."
            - "A session captured reason TOO_MUCH_PRODUCT and a specialist presented the pause offer; nobody accepted or declined it."
