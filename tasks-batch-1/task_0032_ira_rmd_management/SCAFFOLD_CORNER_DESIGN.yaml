  # =========================================================================
  # Section: consistency_model — immediate
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_balance_visible_in_same_response
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Contribution.PENDING_to_CONFIRMED
        distinguishing_aspect: "Confirming a contribution makes the new cash_balance_cents and ytd_contribution_cents visible to the very next GET in the same caller's session - no eventual-consistency lag."
        excluded_because:
          difficulty_instance: compensating_invariant / contribution_confirm_then_reverse_conserves_account_balance_and_ytd
          rationale: "The §1.8 instance asserts mid_cash and mid_ytd captured immediately after the confirm via a follow-up GET, demonstrating immediate consistency."
