  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: invoice_state_precedence_over_budget_cap
        grounds:
          - validations[priority=8]
          - validations[priority=26]
          - validation_priority_notes[pair="priority 8 (state) vs priority 26 (business_fiscal)"]
          - state_machines.DefenseInvoice.UNDER_AUDIT_to_ADJUSTED
          - calculations.defense_invoice_audit
        distinguishing_aspect: |
          Error-category pair: `state` (priority 8, ERR_INVOICE_NOT_APPROVABLE) beats
          `business_fiscal` (priority 26, ERR_BUDGET_CAP_EXCEEDED). Both conditions are
          genuinely true at the moment of the call — the invoice sits in ADJUSTED
          rather than UNDER_AUDIT, AND its already-recomputed allowed_amount_cents of
          3081500 exceeds the assignment's budget_cap_cents of 1000000 — and the
          response carries the priority-8 error.
        test_recipe:
          setup:
            - "Chain P: CA (T4) / TX (T2), ACTIVE RatePlan, applicant 'Northgate Retail Group' (primary CA), policy ACTIVE / OPEN [2026-08-01, 2027-08-01), aggregate_limit_cents 200000000, per_claim_retention_cents 5000000."
            - "DefensePanelFirm 'Ashford & Vance LLP' (NATIONAL, CA/TX, 92000 / 51000 / 18000, capacity 3) is PANEL_ACTIVE."
            - "A RETALIATION / EMPLOYEE claim is accepted (applied_retention_cents 5000000, retention_satisfied_cents 0) and a CLIENT_DIRECTED DefenseAssignment for [2026-08-01, 2026-11-01) carries a deliberately small budget_cap_cents of 1000000."
            - "Panel counsel submitted the invoice, adj-001 audited it (allowed_amount_cents 2957705), counsel disputed it withdrawing the block-billed hours and reducing expenses to 200000, so it is now ADJUSTED with allowed_amount_cents 3081500 and audited_by_user_id null."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "CA", name: "California", hazard_tier: "T4", admin_agency_name: "California Civil Rights Department", pre_suit_window_days: 180, wage_hour_multiplier: 1.60, class_action_propensity_pct: 42.00, pre_suit_mediation_required: true }
