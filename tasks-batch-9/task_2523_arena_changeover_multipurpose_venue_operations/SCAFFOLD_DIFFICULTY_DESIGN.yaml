  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stale_venue_version_at_priority_45_outranks_expired_hold_at_priority_78_on_confirm
        grounds:
          - validations[priority=45]
          - validations[priority=78]
          - concurrency_rules.booking-confirm-stale-venue
          - calculations.hold_expires_at
          - errors.ERR_STALE_VENUE_VERSION
          - errors.ERR_HOLD_EXPIRED
        distinguishing_aspect: |
          One confirm request violates both rules at once — the captured expected_venue_version is
          one behind after a sibling hold bumped Venue.version, and the TIER_3 hold expired at
          2026-08-04T00:00:00.000Z while the clock reads 2026-08-05T00:00:00Z — and the server must
          answer 412 ERR_STALE_VENUE_VERSION (priority 45) rather than the 409 ERR_HOLD_EXPIRED
          (priority 78) that the same request earns once a fresh version is supplied, so the two
          calls differ only in expected_venue_version yet return different status codes.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z while the holds are placed."
            - "Lakeside Arena registered with PROFILE ICE declared."
            - "Anchor tenant Harbor Curling at TIER_3 with 5 guaranteed holds, so its holds expire 72 hours after placement."
            - "Booking 1 (the booking under test) is HELD with hold_expires_at 2026-08-04T00:00:00.000Z; Venue.version is captured immediately after that hold."
            - "Booking 2 is then also placed on hold, which increments Venue.version and makes the captured value stale by exactly one."
            - "Logical clock advanced to 2026-08-05T00:00:00Z, which is 24 hours past booking 1's expiry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /venues/${venue_id}/anchor-tenants"
              payload: { name: "Harbor Curling", hold_priority_tier: "TIER_3", guaranteed_holds_per_season: 5 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { t3: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", tenant_id: "${t3}", config_profile_id: "${p_ice}", title: "Harbor Curling draw 1", event_start_utc: "2026-09-12T00:00:00Z", event_end_utc: "2026-09-12T03:00:00Z", expected_attendance: 9000, rigging_load_kg: 1500 }
              as: BookingManager
              captures: { b1: $.data.id }
            - call: "POST /event-bookings/${b1}/hold"
              payload: {}
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v_stale: $.data.version }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", tenant_id: "${t3}", config_profile_id: "${p_ice}", title: "Harbor Curling draw 2", event_start_utc: "2026-09-13T00:00:00Z", event_end_utc: "2026-09-13T03:00:00Z", expected_attendance: 9000, rigging_load_kg: 1500 }
              as: BookingManager
              captures: { b2: $.data.id }
            - call: "POST /event-bookings/${b2}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: VenueOperationsDirector
