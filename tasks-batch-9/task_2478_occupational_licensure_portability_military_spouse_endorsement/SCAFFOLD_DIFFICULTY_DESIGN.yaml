            - call: "POST /licensure/review-assignments"
              payload: { evaluator_id: "${evr}", application_id: "${app_y}", window_start_at: "2026-08-11T00:00:00Z", window_end_at: "2026-08-14T00:00:00Z", expected_evaluator_version: "${evr_v1}" }
              as: LicensingAnalyst
              as_user_id: "anl_1"
              captures: { ra_y: $.data.id }
            - call: "POST /licensure/credential-evaluations/${ev_x}/discipline-finding"
