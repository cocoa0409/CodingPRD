            - call: "POST /sale-lots/${lotO}/tickets"
              payload: { animal_id: "${o10}", gross_weight_kg: 500.0, expected_sale_lot_version: "${lotO_v0}" }
              as: SaleClerk
          trigger:
            - call: "POST /sale-lots/${lotO}/tickets"
