            - "the second create returns HTTP 422 with error_id == ERR_CPLR_HEADROOM_EXCEEDED because the rounded increment 0.1798 exceeds 0.1793"
            - "the second response is NOT ERR_INSUFFICIENT_UNALLOCATED_TONS even though 80.200 also exceeds the 80.000 remaining unallocated tons (priority 52 precedes 54)"
            - "LandApplicationSite.${site_id}.status == PERMITTED and the site has 0 LoadingLedgerEntry rows (scheduling never writes the ledger)"
            - "SolidsBatch.${batch_id}.unallocated_dry_tons == 80.000"

      - name: storage_projection_with_zero_net_change_returns_sentinel
        metric: days_of_capacity when projected daily net storage change is exactly zero
        endpoint: GET /treatment-facilities/{facilityId}/storage-projection
        grounds:
          - calculations.storage_drawdown_projection
          - calculations.storage_ledger
          - endpoints.GET_/treatment-facilities/{facilityId}/storage-projection
        distinguishing_aspect: |
          Production of 10.00 wet tons/day is matched exactly by a single COMMITTED diversion of
          300.00 wet tons over the 30-day horizon: daily_removal 10.0000, daily_net 0.0000. The
          <= 0 branch returns the 9999 sentinel rather than dividing by zero, and a COMMITTED
          order counts toward the projection while leaving storage_used_wet_tons untouched at
          800.00 - only settlement debits storage.
        test_recipe:
          setup:
            - "TreatmentFacility with 5000.00 wet tons of capacity and 10.00 wet tons/day of production."
            - "One DEWATERED SolidsBatch of 800.00 wet tons / 160.000 dry tons, so storage_used_wet_tons is 800.00 and utilization 16.00%."
            - "One ACCEPTING COMPOST outlet and one COMMITTED DiversionOrder of 300.00 wet tons / 60.000 dry tons."
            - "No ApplicationEvents at all, so the event side of the removal set is empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 10.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /pollutant-limits"
              payload: { analyte: "CADMIUM", ceiling_mg_kg: 85.0, monthly_avg_mg_kg: 39.0, aplr_kg_per_hectare_yr: 1.9, cplr_kg_per_hectare: 39.0 }
              as: ComplianceOfficer
            - call: "POST /solids-batches"
              payload: { facility_id: "${fac_id}", batch_code: "B-2026-001", wet_tons: 800.00, dry_tons_in: 200.000, volatile_solids_in_pct: 70.00, percent_solids: 20.0, detention_days: 20.0, digester_temp_c: 36.0, stabilization_process: "ANAEROBIC_DIGESTION", pathogen_option: "PSRP_ALT1_TIME_TEMP", vector_option: "VAR_OPTION_1_VSR", nh4_n_mg_kg: 4000.0, organic_n_mg_kg: 30000.0, nitrate_n_mg_kg: 100.0, total_p_mg_kg: 25000.0 }
              as: FacilityOperator
              captures: { batch_id: $.data.id }
            - call: "POST /solids-batches/${batch_id}/advance-process"
              payload: { to_status: "DIGESTED", dry_tons_out: 160.000, volatile_solids_out_pct: 55.00, detention_days: 20.0, digester_temp_c: 36.0 }
              as: FacilityOperator
            - call: "POST /solids-batches/${batch_id}/advance-process"
              payload: { to_status: "DEWATERED", percent_solids: 20.0 }
              as: FacilityOperator
              captures: { batch_v: $.data.version }
            - call: "POST /alternative-outlets"
              payload: { name: "Greenfield Compost", outlet_type: "COMPOST", gate_fee_per_wet_ton: 12.00, haul_rate_per_mile_per_wet_ton: 0.2400, min_load_wet_tons: 25.00, max_annual_wet_tons: 5000, min_percent_solids: 15.0 }
              as: FacilityOperator
              captures: { outlet_id: $.data.id }
            - call: "POST /diversion-orders"
              payload: { batch_id: "${batch_id}", outlet_id: "${outlet_id}", expected_batch_version: "${batch_v}", dry_tons: 60.000, wet_tons: 300.00, haul_miles: 30.0 }
              as: FacilityOperator
              captures: { order_id: $.data.id }
            - call: "POST /diversion-orders/${order_id}/commit"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "GET /treatment-facilities/${fac_id}/storage-projection"
              payload: {}
              as: FacilityOperator
              captures: { days: $.data.days_of_capacity, outflow: $.data.projected_outflow_wet_tons }
          assert:
            - "the response days_of_capacity == 9999"
            - "the response projected_outflow_wet_tons == 300.00"
            - "the response storage_used_wet_tons == 800.00 and storage_utilization_pct == 16.00"
            - "the response storage_capacity_wet_tons == 5000.00 and posture == OPEN"
            - "DiversionOrder.${order_id}.status == COMMITTED and SolidsBatch.${batch_id}.unallocated_dry_tons == 100.000"

