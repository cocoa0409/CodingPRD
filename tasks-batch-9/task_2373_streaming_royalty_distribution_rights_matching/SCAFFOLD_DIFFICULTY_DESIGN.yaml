      - name: usage_matching_threshold_variant_divergence
        grounds:
          - calculations.usage_line_matching
          - entities.UsageLine.fields.match_status
          - entities.UsageLine.fields.match_confidence_bps
          - state_machines.RightsRegistration.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          The identical (usage line, candidate work) pair scoring exactly 5000 bps is REFUSED by
          the AUTO_MATCH variant (threshold 7500, line stays UNMATCHED with work_id null) and
          ACCEPTED by the CLAIM_MATCH variant reached through the approval cascade (threshold
          5000, line becomes CLAIM_MATCHED with work_id set) — same data, opposite outcome, and
          the resulting line_type on the statement changes from USAGE to HOLDING_RELEASE.
        test_recipe:
          setup:
            - "Catalogue contains a RECORDING titled 'Neon Ledger' with artist_credit 'Halfsleep'."
            - "One sealed batch containing a GB/INDIVIDUAL line reporting title 'Neon Ledger' with no ISRC and no artist, so only the title-only 5000 bps tier can fire."
            - "The batch has been matched, leaving that line UNMATCHED."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Northbeam Records", holder_type: "LABEL", home_territory_code: "GB", direct_deal_rate_bps: 800 }
              as: RoyaltyAdmin
              captures: { lbl: "$.data.id" }
