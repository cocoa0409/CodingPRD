# =============================================================================
# Task 0567 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. All numbers pre-computed against §1.3.
# Clock default: 2026-05-01T00:00:00Z. Dates are UTC midnights.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_billing
        grounds:
          - calculations.invoice_settlement
          - calculations.invoice_rate_proration
          - state_machines.Stay.ACTIVE_to_COMPLETED_EARLY
          - entities.Invoice.fields.amount_due_cents
        distinguishing_aspect: |
          Same stay: provisional invoice (planned 60 nights) bills 642000 cents; final invoice after
          a 29-night early departure bills 353040 cents — a 288960-cent divergence in the Invoice/billing domain.
        test_recipe:
          setup:
            - "RatePlan RP1: monthly 300000, utility 15000, cleaning 12000, tax 1200 bps."
            - "One AVAILABLE unit; a retail stay move_in 2026-05-01, planned_move_out 2026-06-30 (60 nights), deposit 100000; checked in => PROVISIONAL invoice (DRAFT, amount_due 642000)."
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 100000 }
              as: PropertyManager
              captures: { s1: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
            - call: "GET /invoices"
              payload: { stay_id: "${s1}" }
              as: PropertyManager
              captures: { prov_due: "$.data[0].amount_due_cents", inv1: "$.data[0].id" }
          trigger:
            - call: "POST /stays/${s1}/depart"
              payload: { actual_move_out: "2026-05-30T00:00:00Z" }
              as: PropertyManager
          assert:
            - "provisional amount_due captured before departure (prov_due) == 642000"
            - "GET /invoices/${inv1} -> data.invoice_kind == FINAL"
            - "GET /invoices/${inv1} -> data.amount_due_cents == 353040"
            - "GET /invoices/${inv1} -> data.occupancy_tax_cents == 36540"
            - "GET /invoices/${inv1} -> data.rate_subtotal_cents == 304500"

      - name: deposit_estimated_vs_final_refund
        grounds:
          - calculations.deposit_ledger
          - state_machines.DamageCharge.ASSESSED_to_CHARGED
          - entities.Stay.fields.deposit_refundable_cents
        distinguishing_aspect: |
          Deposit refund estimated (100000, no damage) vs final (75000, net of one charged 25000 damage) —
          the dual-variant lives on the Stay deposit-ledger domain, not the Invoice billing domain.
        test_recipe:
          setup:
            - "RatePlan RP1; retail stay deposit 100000, checked in, departed at planned (COMPLETED)."
            - "One damage of 25000 ASSESSED against the stay; estimated refund (pre-charge) == deposit_refundable 100000."
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 100000 }
              as: PropertyManager
              captures: { s1: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
            - call: "POST /stays/${s1}/depart"
              payload: { actual_move_out: "2026-06-30T00:00:00Z" }
              as: PropertyManager
            - call: "POST /damage-charges"
              payload: { stay_id: "${s1}", amount_cents: 25000, description: "Carpet stain" }
              as: PropertyManager
              captures: { dc1: $.data.id }
            - call: "GET /stays/${s1}"
              payload: {}
              as: PropertyManager
              captures: { est_refund: $.data.deposit_refundable_cents }
          trigger:
            - call: "POST /damage-charges/${dc1}/charge"
              payload: {}
              as: PropertyManager
          assert:
            - "estimated refund captured before charge (est_refund) == 100000"
            - "GET /stays/${s1} -> data.deposit_charged_cents == 25000"
            - "GET /stays/${s1} -> data.deposit_refundable_cents == 75000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: occupancy_tax_conditional_combination
        grounds:
          - calculations.occupancy_tax
          - calculations.invoice_rate_proration
          - entities.Invoice.fields.occupancy_tax_cents
        distinguishing_aspect: |
          Mode (a): occupancy tax is a conditional branch (nights_billed < 30) applied to a 3+-input
          combination (monthly_rate + utility -> rate_subtotal, occupancy_tax_rate_bps) — non-linear, not a flat charge.
        test_recipe:
          setup:
            - "RatePlan RP1 (rate 300000, util 15000, clean 12000, tax 1200 bps); retail stay planned 60 nights, checked in."
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s1: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /stays/${s1}/depart"
              payload: { actual_move_out: "2026-05-30T00:00:00Z" }
              as: PropertyManager
            - call: "GET /invoices"
              payload: { stay_id: "${s1}" }
              as: PropertyManager
              captures: { inv1: "$.data[0].id" }
          assert:
            - "GET /invoices/${inv1} -> data.rate_subtotal_cents == 304500"
            - "GET /invoices/${inv1} -> data.occupancy_tax_cents == 36540"
            - "GET /invoices/${inv1} -> data.amount_due_cents == 353040"

      - name: proration_rounding_order_per_line
        grounds:
          - calculations.invoice_rate_proration
          - entities.Invoice.fields.rate_subtotal_cents
        distinguishing_aspect: |
          Mode (b): four line items each round_half_up to the cent then sum -> 246666; the sum-then-round
          alternative would give 246667. The scaffold pins per-line rounding, so 246666 is correct.
        test_recipe:
          setup:
            - "RatePlan RP2: monthly 100000, utility 100000, cleaning 0, tax 0 bps; retail stay planned 60 nights, checked in."
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP2", monthly_rate_cents: 100000, utility_monthly_cents: 100000, cleaning_fee_cents: 0, occupancy_tax_rate_bps: 0 }
              as: PropertyManager
              captures: { rp2: $.data.id }
            - call: "POST /units"
              payload: { name: "U2", property_name: "Oak Ridge", bedrooms: 2 }
              as: PropertyManager
              captures: { u2: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u2}", rate_plan_id: "${rp2}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s2: $.data.id }
            - call: "POST /stays/${s2}/check-in"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /stays/${s2}/depart"
              payload: { actual_move_out: "2026-06-07T00:00:00Z" }
              as: PropertyManager
            - call: "GET /invoices"
              payload: { stay_id: "${s2}" }
              as: PropertyManager
              captures: { inv2: "$.data[0].id" }
          assert:
            - "GET /invoices/${inv2} -> data.nights_billed == 37"
            - "GET /invoices/${inv2} -> data.rate_subtotal_cents == 246666"
            - "GET /invoices/${inv2} -> data.amount_due_cents == 246666"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: unit_availability_cycle
        grounds:
          - state_machines.Unit.AVAILABLE_to_OCCUPIED
          - state_machines.Unit.OCCUPIED_to_TURNOVER
          - state_machines.Unit.TURNOVER_to_AVAILABLE
        distinguishing_aspect: |
          Unit traverses AVAILABLE -> OCCUPIED -> TURNOVER -> AVAILABLE, a closed cycle returning to its
          initial state on the Unit entity.
        test_recipe:
          setup:
            - "RatePlan RP1; retail stay checked in (unit OCCUPIED) then departed (unit TURNOVER, one SCHEDULED Turnover row)."
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s1: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
            - call: "POST /stays/${s1}/depart"
              payload: { actual_move_out: "2026-06-30T00:00:00Z" }
              as: PropertyManager
            - call: "GET /turnovers"
              payload: { unit_id: "${u1}" }
              as: PropertyManager
              captures: { t1: "$.data[0].id" }
          trigger:
            - call: "POST /turnovers/${t1}/complete"
              payload: {}
              as: PropertyManager
          assert:
            - "GET /units/${u1} -> data.status == AVAILABLE"
            - "GET /turnovers/${t1} -> data.status == COMPLETED"

      - name: master_lease_suspend_resume_cycle
        grounds:
          - state_machines.MasterLease.ACTIVE_to_SUSPENDED
          - state_machines.MasterLease.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          MasterLease loops ACTIVE -> SUSPENDED -> ACTIVE (a revision cycle) on a different entity than the Unit cycle.
        test_recipe:
          setup:
            - "One corporate account; a master lease activated then suspended."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.test" }
              as: PropertyManager
              captures: { ca: $.data.id }
            - call: "POST /master-leases"
              payload: { corporate_account_id: "${ca}", committed_units: 5, negotiated_monthly_rate_cents: 280000, start_date: "2026-05-01T00:00:00Z", end_date: "2027-05-01T00:00:00Z" }
              as: PropertyManager
              captures: { ml: $.data.id }
            - call: "POST /master-leases/${ml}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /master-leases/${ml}/suspend"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /master-leases/${ml}/resume"
              payload: {}
              as: PropertyManager
          assert:
            - "GET /master-leases/${ml} -> data.status == ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: early_departure_unit_turnover_cascade
        grounds:
          - state_machines.Stay.ACTIVE_to_COMPLETED_EARLY
          - state_machines.Unit.OCCUPIED_to_TURNOVER
          - entities.Turnover.fields.status
        distinguishing_aspect: |
          Depth-3 chain: depart mutates Stay (-> COMPLETED_EARLY); Stay completion mutates Unit
          (OCCUPIED -> TURNOVER); Unit entering TURNOVER creates a SCHEDULED Turnover row — each hop caused by the prior.
        test_recipe:
          setup:
            - "RatePlan RP1; retail stay planned 60 nights, checked in (unit OCCUPIED)."
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s1: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /stays/${s1}/depart"
              payload: { actual_move_out: "2026-05-30T00:00:00Z" }
              as: PropertyManager
            - call: "GET /turnovers"
              payload: { unit_id: "${u1}" }
              as: PropertyManager
              captures: { t1: "$.data[0].id" }
          assert:
            - "GET /stays/${s1} -> data.status == COMPLETED_EARLY"
            - "GET /units/${u1} -> data.status == TURNOVER"
            - "GET /turnovers/${t1} -> data.status == SCHEDULED"
            - "GET /turnovers/${t1} -> data.stay_id == ${s1}"

      - name: damage_charge_deposit_invoice_cascade
        grounds:
          - state_machines.DamageCharge.ASSESSED_to_CHARGED
          - entities.Stay.fields.deposit_charged_cents
          - entities.Invoice.fields.total_settlement_cents
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (charge): DamageCharge -> CHARGED mutates the Stay deposit
          ledger, which recomputes the FINAL Invoice settlement (total_settlement, deposit_refund).
        test_recipe:
          setup:
            - "RatePlan RP1; retail stay deposit 100000, checked in, departed at planned (COMPLETED, FINAL invoice amount_due 642000)."
            - "One 25000 damage ASSESSED against the stay."
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 100000 }
              as: PropertyManager
              captures: { s1: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
            - call: "POST /stays/${s1}/depart"
              payload: { actual_move_out: "2026-06-30T00:00:00Z" }
              as: PropertyManager
            - call: "GET /invoices"
              payload: { stay_id: "${s1}" }
              as: PropertyManager
              captures: { inv1: "$.data[0].id" }
            - call: "POST /damage-charges"
              payload: { stay_id: "${s1}", amount_cents: 25000, description: "Broken lamp" }
              as: PropertyManager
              captures: { dc1: $.data.id }
          trigger:
            - call: "POST /damage-charges/${dc1}/charge"
              payload: {}
              as: PropertyManager
          assert:
            - "GET /damage-charges/${dc1} -> data.status == CHARGED"
            - "GET /stays/${s1} -> data.deposit_charged_cents == 25000"
            - "GET /invoices/${inv1} -> data.damage_total_cents == 25000"
            - "GET /invoices/${inv1} -> data.total_settlement_cents == 667000"
            - "GET /invoices/${inv1} -> data.deposit_refund_cents == 75000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_referential_on_checkin
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.Stay.RESERVED_to_ACTIVE
        distinguishing_aspect: |
          Re-checking-in an already-ACTIVE stay fails BOTH state (pri 6, stay not RESERVED) and
          referential (pri 7, its unit is OCCUPIED); the state error (ERR_INVALID_STATE) wins.
        test_recipe:
          setup:
            - "RatePlan RP1; retail stay checked in once (now ACTIVE, its unit OCCUPIED)."
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s1: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_INVALID_STATE"
            - "trigger response HTTP status == 409"

      - name: temporal_beats_fiscal_on_booking
        grounds:
          - validations[priority=10]
          - validations[priority=14]
          - errors[ERR_UNIT_TIME_CONFLICT]
        distinguishing_aspect: |
          Booking a stay that both overlaps an existing stay on the same unit (temporal, pri 10) and
          exceeds the master-lease cap (fiscal, pri 14) returns ERR_UNIT_TIME_CONFLICT (pri 10 wins).
        test_recipe:
          setup:
            - "Corporate account + employee; master lease committed_units 1, ACTIVE; stay s1 booked [2026-05-01,2026-06-30) on unit u (RESERVED, consumes the single committed unit)."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.test" }
              as: PropertyManager
              captures: { ca: $.data.id }
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /master-leases"
              payload: { corporate_account_id: "${ca}", committed_units: 1, negotiated_monthly_rate_cents: 280000, start_date: "2026-05-01T00:00:00Z", end_date: "2027-05-01T00:00:00Z" }
              as: PropertyManager
              captures: { ml: $.data.id }
            - call: "POST /master-leases/${ml}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /employees"
              payload: { corporate_account_id: "${ca}", full_name: "Dana Lee", email: "dana@acme.test" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { emp: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0, master_lease_id: "${ml}", employee_id: "${emp}" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-06-01T00:00:00Z", planned_move_out: "2026-07-31T00:00:00Z", deposit_held_cents: 0, master_lease_id: "${ml}", employee_id: "${emp}" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_UNIT_TIME_CONFLICT"
            - "trigger response HTTP status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tax_exemption_30_night_boundary
        grounds:
          - calculations.occupancy_tax
          - entities.Invoice.fields.occupancy_tax_cents
        distinguishing_aspect: |
          Tax-exemption threshold on nights: 29 billable nights is taxed (36540 cents), exactly 30 is
          exempt (0) — the >= boundary reached through POST /stays/{id}/depart.
        test_recipe:
          setup:
            - "RatePlan RP1; two units; two identical retail stays (move_in 2026-05-01, planned 2026-06-30), both checked in."
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /units"
              payload: { name: "U2", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u2: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u2}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s2: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
            - call: "POST /stays/${s2}/check-in"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /stays/${s1}/depart"
              payload: { actual_move_out: "2026-05-30T00:00:00Z" }
              as: PropertyManager
            - call: "POST /stays/${s2}/depart"
              payload: { actual_move_out: "2026-05-31T00:00:00Z" }
              as: PropertyManager
            - call: "GET /invoices"
              payload: { stay_id: "${s1}" }
              as: PropertyManager
              captures: { inv1: "$.data[0].id" }
            - call: "GET /invoices"
              payload: { stay_id: "${s2}" }
              as: PropertyManager
              captures: { inv2: "$.data[0].id" }
          assert:
            - "GET /invoices/${inv1} -> data.nights_billed == 29 and data.occupancy_tax_cents == 36540"
            - "GET /invoices/${inv2} -> data.nights_billed == 30 and data.occupancy_tax_cents == 0"

      - name: minimum_lease_term_30_day_boundary
        grounds:
          - validations[priority=13]
          - errors[ERR_MIN_TERM_NOT_MET]
          - entities.Stay.fields.planned_nights
        distinguishing_aspect: |
          Minimum-term gate at booking: planned_nights 29 is rejected with ERR_MIN_TERM_NOT_MET, exactly
          30 is accepted — a different metric (term length) and endpoint (POST /stays) than the tax-nights boundary.
        test_recipe:
          setup:
            - "RatePlan RP1; two AVAILABLE units."
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /units"
              payload: { name: "U2", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u2: $.data.id }
          trigger:
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-05-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { err: $.data.error_id }
            - call: "POST /stays"
              payload: { unit_id: "${u2}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-05-31T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s_ok: $.data.id }
          assert:
            - "first trigger (29 nights) response data.error_id == ERR_MIN_TERM_NOT_MET (HTTP 422)"
            - "second trigger (30 nights) succeeds: GET /stays/${s_ok} -> data.planned_nights == 30 and data.status == RESERVED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: stay_checkin_requires_unit_available
        grounds:
          - state_machines.Stay.RESERVED_to_ACTIVE
          - entities.Unit.fields.status
          - validations[priority=7]
        distinguishing_aspect: |
          Stay RESERVED -> ACTIVE (check-in) is blocked when its Unit is OCCUPIED by another stay:
          cross-entity dependency on the (Stay, Unit) pair -> ERR_UNIT_NOT_AVAILABLE.
        test_recipe:
          setup:
            - "RatePlan RP1; one unit u1; stay s1 checked in (u1 OCCUPIED); stay s2 booked on u1 for a later non-overlapping window (RESERVED)."
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s1: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-08-01T00:00:00Z", planned_move_out: "2026-09-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s2: $.data.id }
          trigger:
            - call: "POST /stays/${s2}/check-in"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_UNIT_NOT_AVAILABLE (HTTP 409)"
            - "GET /stays/${s2} -> data.status == RESERVED"

      - name: housekeeping_requires_active_stay
        grounds:
          - validations[priority=9]
          - entities.Stay.fields.status
          - errors[ERR_STAY_NOT_ACTIVE]
        distinguishing_aspect: |
          Scheduling a HousekeepingVisit is blocked when the referenced Stay is still RESERVED
          (not ACTIVE): cross-entity dependency on the (HousekeepingVisit, Stay) pair.
        test_recipe:
          setup:
            - "RatePlan RP1; unit u1; stay s1 booked but NOT checked in (RESERVED)."
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /housekeeping-visits"
              payload: { stay_id: "${s1}", scheduled_date: "2026-05-10T00:00:00Z" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_STAY_NOT_ACTIVE (HTTP 409)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: unit_overlap_with_turnover_buffer
        grounds:
          - validations[priority=10]
          - errors[ERR_UNIT_TIME_CONFLICT]
        distinguishing_aspect: |
          Unit occupancy requires a >=1-day turnover buffer: a new stay starting exactly on the prior
          stay's move-out (gap 0) is rejected; starting one day later (gap == buffer) is accepted.
        test_recipe:
          setup:
            - "RatePlan RP1; unit u1; stay s1 booked [2026-05-01, 2026-06-30) RESERVED."
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-06-30T00:00:00Z", planned_move_out: "2026-08-29T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { err: $.data.error_id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-07-01T00:00:00Z", planned_move_out: "2026-08-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s_ok: $.data.id }
          assert:
            - "first trigger (gap 0, move_in == prior move_out) -> data.error_id == ERR_UNIT_TIME_CONFLICT (409)"
            - "second trigger (gap 1 == buffer) succeeds: GET /stays/${s_ok} -> data.status == RESERVED"

      - name: employee_overlap_no_buffer_adjacency_allowed
        grounds:
          - validations[priority=11]
          - errors[ERR_EMPLOYEE_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Employee double-booking uses half-open intervals with NO buffer: an overlapping stay is rejected
          but exact adjacency (new move_in == prior move_out) is accepted — distinct geometry on the Employee resource.
        test_recipe:
          setup:
            - "Corporate account + employee emp; master lease committed 10 ACTIVE; two units u1,u2; stay s1 for emp on u1 [2026-05-01,2026-06-30) RESERVED."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.test" }
              as: PropertyManager
              captures: { ca: $.data.id }
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /units"
              payload: { name: "U2", property_name: "Oak Ridge", bedrooms: 1 }
              as: PropertyManager
              captures: { u2: $.data.id }
            - call: "POST /master-leases"
              payload: { corporate_account_id: "${ca}", committed_units: 10, negotiated_monthly_rate_cents: 280000, start_date: "2026-05-01T00:00:00Z", end_date: "2027-05-01T00:00:00Z" }
              as: PropertyManager
              captures: { ml: $.data.id }
            - call: "POST /master-leases/${ml}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /employees"
              payload: { corporate_account_id: "${ca}", full_name: "Dana Lee", email: "dana@acme.test" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { emp: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0, master_lease_id: "${ml}", employee_id: "${emp}" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /stays"
              payload: { unit_id: "${u2}", rate_plan_id: "${rp1}", move_in: "2026-06-15T00:00:00Z", planned_move_out: "2026-08-14T00:00:00Z", deposit_held_cents: 0, master_lease_id: "${ml}", employee_id: "${emp}" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { err: $.data.error_id }
            - call: "POST /stays"
              payload: { unit_id: "${u2}", rate_plan_id: "${rp1}", move_in: "2026-06-30T00:00:00Z", planned_move_out: "2026-08-29T00:00:00Z", deposit_held_cents: 0, master_lease_id: "${ml}", employee_id: "${emp}" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { s_ok: $.data.id }
          assert:
            - "first trigger (overlaps emp's 05-01..06-30 stay) -> data.error_id == ERR_EMPLOYEE_DOUBLE_BOOKED (409)"
            - "second trigger (move_in 06-30 == prior move_out, adjacency) succeeds: GET /stays/${s_ok} -> data.status == RESERVED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_conservation_charge_then_waive
        grounds:
          - calculations.deposit_ledger
          - state_machines.DamageCharge.CHARGED_to_WAIVED
          - entities.Stay.fields.deposit_held_cents
        distinguishing_aspect: |
          Charge (refundable 100000->75000, charged 0->25000) then waive-reversal (back to 100000/0) keeps
          deposit_held_cents == deposit_refundable_cents + deposit_charged_cents == 100000 at every step; conserved quantity is deposit cents.
        test_recipe:
          setup:
            - "RatePlan RP1; retail stay deposit 100000, departed; damage 25000 assessed then charged (charged 25000, refundable 75000)."
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 100000 }
              as: PropertyManager
              captures: { s1: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
            - call: "POST /stays/${s1}/depart"
              payload: { actual_move_out: "2026-06-30T00:00:00Z" }
              as: PropertyManager
            - call: "POST /damage-charges"
              payload: { stay_id: "${s1}", amount_cents: 25000, description: "Wall damage" }
              as: PropertyManager
              captures: { dc1: $.data.id }
            - call: "POST /damage-charges/${dc1}/charge"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /damage-charges/${dc1}/waive"
              payload: {}
              as: PropertyManager
          assert:
            - "GET /damage-charges/${dc1} -> data.status == WAIVED"
            - "GET /stays/${s1} -> data.deposit_charged_cents == 0"
            - "GET /stays/${s1} -> data.deposit_refundable_cents == 100000"
            - "GET /stays/${s1} -> data.deposit_held_cents == 100000 (unchanged; held == refundable + charged holds throughout)"

      - name: master_lease_units_conservation_book_then_cancel
        grounds:
          - calculations.master_lease_capacity
          - state_machines.Stay.RESERVED_to_CANCELLED
          - entities.MasterLease.fields.committed_units
        distinguishing_aspect: |
          Book (consumed 1, free 2) then cancel (consumed 0, free 3) conserves committed_units ==
          units_consumed + units_free == 3 — a unit-count invariant, distinct from the deposit-cents invariant.
        test_recipe:
          setup:
            - "Corporate account + employee; master lease committed_units 3 ACTIVE; stay s1 booked on it (RESERVED; consumed 1, free 2)."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.test" }
              as: PropertyManager
              captures: { ca: $.data.id }
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /master-leases"
              payload: { corporate_account_id: "${ca}", committed_units: 3, negotiated_monthly_rate_cents: 280000, start_date: "2026-05-01T00:00:00Z", end_date: "2027-05-01T00:00:00Z" }
              as: PropertyManager
              captures: { ml: $.data.id }
            - call: "POST /master-leases/${ml}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /employees"
              payload: { corporate_account_id: "${ca}", full_name: "Dana Lee", email: "dana@acme.test" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { emp: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0, master_lease_id: "${ml}", employee_id: "${emp}" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /stays/${s1}/cancel"
              payload: {}
              as: CorporateAdmin
              as_user_id: "${ca}"
          assert:
            - "GET /stays/${s1} -> data.status == CANCELLED"
            - "GET /master-leases/${ml} -> data.units_consumed == 0"
            - "GET /master-leases/${ml} -> data.units_free == 3"
            - "GET /master-leases/${ml} -> data.committed_units == 3 (committed == consumed + free at every step)"
