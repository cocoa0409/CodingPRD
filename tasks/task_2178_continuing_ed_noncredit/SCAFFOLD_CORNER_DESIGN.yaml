      - name: unknown_path_ids_return_their_specific_not_found_errors
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_REGISTRATION_NOT_FOUND]", "errors[ERR_PETITION_NOT_FOUND]", "errors[ERR_VOUCHER_NOT_FOUND]", "errors[ERR_CONTRACT_NOT_FOUND]"]
        distinguishing_aspect: "Each resource family reports its own 404 code rather than a shared generic: a missing registration yields ERR_REGISTRATION_NOT_FOUND, a missing petition ERR_PETITION_NOT_FOUND, a missing voucher ERR_VOUCHER_NOT_FOUND and a missing contract ERR_CONTRACT_NOT_FOUND, all with HTTP 404."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /registrations/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { e1: $.data.error_id }
            - call: "GET /cpl-petitions/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { e2: $.data.error_id }
            - call: "GET /vouchers/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { e3: $.data.error_id }
            - call: "GET /instructor-contracts/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { e4: $.data.error_id }
          assert:
            - "${e1} == ERR_REGISTRATION_NOT_FOUND"
            - "${e2} == ERR_PETITION_NOT_FOUND"
            - "${e3} == ERR_VOUCHER_NOT_FOUND"
            - "${e4} == ERR_CONTRACT_NOT_FOUND"
            - "all four calls return HTTP 404 with response_type error"

      - name: offering_create_on_retired_course_returns_course_retired
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_COURSE_RETIRED]", "state_machines.Course.ACTIVE_to_RETIRED"]
        distinguishing_aspect: "Once a course is RETIRED (active_offering_count 0 at retire time), POST /offerings against it returns ERR_COURSE_RETIRED with HTTP 422, which is a distinct code from the 404 raised for a course that never existed."
        test_recipe:
          setup:
            - "Course EXT-101 exists with no offerings and has been retired."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /courses/${c_base_id}/retire"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_status: $.data.status }
          trigger:
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${c_status} == RETIRED"
            - "${err} == ERR_COURSE_RETIRED"
            - "HTTP status is 422"
            - "Course.${c_base_id}.active_offering_count == 0"

