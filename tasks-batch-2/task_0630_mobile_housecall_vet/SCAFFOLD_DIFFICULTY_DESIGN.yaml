              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /rolling-clinics"
              payload: { plate: "VAN-17", controlled_stock_ml: 0, vaccine_stock_count: 5 }
              as: Dispatcher
              captures: { van_id: $.data.id }
            - call: "POST /patients"
