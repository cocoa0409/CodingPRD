scenario: |
  1230. Gymnastics Meet & Judging Administration (USA Gymnastics sanctioned meet):
  session/level scheduling & rotation assignment, judge panel assignment & conflict
  avoidance, score entry (difficulty/execution/deduction) & inquiry process,
  equipment/warm-up timing & meet flow, awards ceremony ordering & tie-break rules,
  coach credentialing & floor access, spectator admission & live scoring display,
  qualification to next level meet

domain_name: gymnastics-meet-judging-administration
api_prefix: "/api/v1"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: Meet
    parent: null
    common_fields: true
    fields:
      - { name: meet_name, type: string, source: input, description: "Human-readable meet title; unique within sanction_year" }
      - { name: sanction_year, type: integer, source: input, description: "USAG competitive season year (e.g., 2026)" }
      - { name: sanction_number, type: string, source: input, description: "USAG-issued sanction identifier; globally unique", constraints: "must match ^USAG-[0-9]{4}-[0-9]{4}$" }
      - { name: venue_name, type: string, source: input, description: "Facility name" }
      - { name: start_date, type: datetime, source: input, description: "Meet day-1 open-of-doors timestamp (UTC)" }
      - { name: end_date, type: datetime, source: input, description: "Meet final-day close timestamp (UTC); must be >= start_date" }
      - { name: posture, type: enum, source: computed, description: "Aggregate gate: DRAFT | SCHEDULED | WARMUP_OPEN | IN_COMPETITION | SCORING_CLOSED | FINALIZED | ARCHIVED; derived from Session states and scoring completeness" }
      - { name: tiebreak_policy, type: enum, source: input, description: "Tie-break rule set: USAG_CLASSIC | NCAA_MODIFIED; defaults to USAG_CLASSIC", default: "USAG_CLASSIC" }
      - { name: qualifying_score_rule, type: enum, source: input, description: "Qualification rule: ALL_AROUND_ONLY | PER_EVENT | BOTH; defaults to BOTH", default: "BOTH" }
      - { name: inquiry_window_minutes, type: integer, source: input, description: "Minutes after score publication during which a coach may file an inquiry; defaults to 5", default: 5 }
      - { name: max_athletes_per_squad, type: integer, source: input, description: "Squad size cap; defaults to 12", default: 12 }

  - name: Session
    parent: Meet
    common_fields: true
    fields:
      - { name: meet_id, type: string, source: input, description: "FK -> Meet.id; owning meet" }
      - { name: session_label, type: string, source: input, description: "e.g., 'Session 1 — Level 4/5 Women'; unique within meet" }
      - { name: level_band, type: enum, source: input, description: "USAG level band: L2 | L3 | L4 | L5 | L6 | L7 | L8 | L9 | L10 | XCEL_BRONZE | XCEL_SILVER | XCEL_GOLD | XCEL_PLATINUM | XCEL_DIAMOND" }
      - { name: scheduled_start, type: datetime, source: input, description: "Scheduled competition start (UTC); must lie within parent Meet's [start_date, end_date]" }
      - { name: scheduled_end, type: datetime, source: input, description: "Scheduled competition end (UTC); must be > scheduled_start and <= Meet.end_date + 2h overflow buffer" }
      - { name: warmup_open_offset_minutes, type: integer, source: input, description: "Minutes before scheduled_start when warm-up opens; defaults to 90", default: 90 }
      - { name: march_in_offset_minutes, type: integer, source: input, description: "Minutes before scheduled_start when athletes march in; defaults to 15", default: 15 }
      - { name: apparatus_set, type: array, source: input, description: "Ordered apparatus list for this session, each element {apparatus: VAULT|UNEVEN_BARS|BALANCE_BEAM|FLOOR_EXERCISE, flight_count: integer}; all four must appear exactly once" }
      - { name: state, type: enum, source: computed, description: "SCHEDULED | WARMUP_OPEN | MARCH_IN | IN_ROTATION | SCORING | CLOSED" }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp when session reached CLOSED; null until then" }

  - name: Squad
    parent: Session
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> Session.id; owning session" }
      - { name: squad_label, type: string, source: input, description: "e.g., 'Squad A'; unique within session" }
      - { name: starting_apparatus, type: enum, source: input, description: "Apparatus on which this squad starts rotation: VAULT | UNEVEN_BARS | BALANCE_BEAM | FLOOR_EXERCISE" }
      - { name: rotation_index, type: integer, source: computed, description: "0-based current rotation number (0..3); advances as Rotation records close" }
      - { name: athlete_count, type: integer, source: computed, description: "Derived count of AthleteEntry rows linked to this squad with entry_status IN {REGISTERED, CHECKED_IN}" }

  - name: Gymnast
    parent: null
    common_fields: true
    fields:
      - { name: usag_member_number, type: string, source: input, description: "USAG athlete membership number; globally unique", constraints: "must match ^A[0-9]{7}$" }
      - { name: legal_name, type: string, source: input, description: "Full legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "DOB (UTC midnight); used to derive competitive age as of Dec 31 of sanction_year" }
      - { name: competitive_level, type: enum, source: input, description: "USAG level at time of entry; same enum as Session.level_band" }
      - { name: home_gym, type: string, source: input, description: "Affiliated club name" }

  - name: AthleteEntry
    parent: Session
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> Session.id; session this entry belongs to" }
      - { name: gymnast_id, type: string, source: input, description: "FK -> Gymnast.id; the athlete" }
      - { name: squad_id, type: string, source: computed, description: "FK -> Squad.id; assigned squad; null until squad assignment; derived by Squad assignment algorithm" }
      - { name: entry_status, type: enum, source: computed, description: "REGISTERED | CHECKED_IN | SCRATCHED | COMPETING | COMPLETED" }
      - { name: scratch_reason, type: enum, source: input, description: "Required iff entry_status == SCRATCHED: INJURY | COACH_DECISION | NO_SHOW | DISQUALIFICATION" }
      - { name: all_around_total, type: number, source: computed, description: "Sum of final Score.total_score across all four apparatus for this entry; 0.000 until all four FINAL" }
      - { name: all_around_rank, type: integer, source: computed, description: "1-based rank within session by all_around_total DESC; null until session CLOSED" }
      - { name: qualified_for_next_meet, type: boolean, source: computed, description: "Derived from qualification_rule; false until session CLOSED" }
      - { name: qualification_mobility_score, type: number, source: computed, description: "The specific score that determined qualification (AA total or best event total, per Meet.qualifying_score_rule)" }

  - name: Coach
    parent: null
    common_fields: true
    fields:
      - { name: usag_coach_number, type: string, source: input, description: "USAG professional membership; globally unique", constraints: "must match ^C[0-9]{7}$" }
      - { name: legal_name, type: string, source: input, description: "Full legal name" }
      - { name: affiliated_gym, type: string, source: input, description: "Club name this coach represents at this meet" }
      - { name: background_check_expiry, type: datetime, source: input, description: "USAG background check expiry (UTC)" }
      - { name: safety_cert_expiry, type: datetime, source: input, description: "USAG safety/risk-management cert expiry (UTC)" }
      - { name: credential_state, type: enum, source: computed, description: "PENDING_VERIFICATION | CREDENTIALED | SUSPENDED | REVOKED" }

  - name: CoachMeetPass
    parent: Meet
    common_fields: true
    fields:
      - { name: meet_id, type: string, source: input, description: "FK -> Meet.id" }
      - { name: coach_id, type: string, source: input, description: "FK -> Coach.id" }
      - { name: pass_state, type: enum, source: computed, description: "ISSUED | FLOOR_ACCESS_GRANTED | FLOOR_ACCESS_SUSPENDED | REVOKED" }
      - { name: issued_at, type: datetime, source: system, description: "When the pass was issued" }
      - { name: floor_access_granted_at, type: datetime, source: system, description: "When floor access was first granted; null until granted" }
      - { name: suspension_reason, type: enum, source: input, description: "Required iff pass_state == FLOOR_ACCESS_SUSPENDED: CREDENTIAL_LAPSE | CONDUCT | SAFE_SPORT_HOLD" }

  - name: Judge
    parent: null
    common_fields: true
    fields:
      - { name: usag_judge_number, type: string, source: input, description: "USAG judge membership; globally unique", constraints: "must match ^J[0-9]{7}$" }
      - { name: legal_name, type: string, source: input, description: "Full legal name" }
      - { name: rating, type: enum, source: input, description: "USAG judging rating: BREVET | NATIONAL | USA | LEVEL_10 | LEVEL_9 | LEVEL_8 | LEVEL_7 | LEVEL_4_5 | XCEL" }
      - { name: affiliated_gym, type: string, source: input, description: "Club this judge is affiliated with; drives conflict-of-interest exclusion" }
      - { name: availability_start, type: datetime, source: input, description: "Judge availability window start (UTC)" }
      - { name: availability_end, type: datetime, source: input, description: "Judge availability window end (UTC); must be > availability_start" }

  - name: JudgePanel
    parent: Meet
    common_fields: true
    fields:
      - { name: meet_id, type: string, source: input, description: "FK -> Meet.id" }
      - { name: session_id, type: string, source: input, description: "FK -> Session.id" }
      - { name: apparatus, type: enum, source: input, description: "Apparatus this panel covers: VAULT | UNEVEN_BARS | BALANCE_BEAM | FLOOR_EXERCISE" }
      - { name: panel_state, type: enum, source: computed, description: "FORMING | FULL | ACTIVE | RELEASED" }
      - { name: required_judge_count, type: integer, source: computed, description: "From apparatus + session level band: BALANCE_BEAM/FLOOR_EXERCISE need 4, others need 2 (USAG rule)" }

  - name: PanelAssignment
    parent: JudgePanel
    common_fields: true
    fields:
      - { name: judge_panel_id, type: string, source: input, description: "FK -> JudgePanel.id" }
      - { name: judge_id, type: string, source: input, description: "FK -> Judge.id" }
      - { name: role, type: enum, source: input, description: "PANEL_CHIEF | D_JUDGE | E_JUDGE | LINE_JUDGE | TIMER" }
      - { name: assignment_state, type: enum, source: computed, description: "PROPOSED | CONFIRMED | RECUSED | RELEASED" }
      - { name: conflict_flag, type: boolean, source: computed, description: "True iff Judge.affiliated_gym matches any Gymnast.home_gym of an AthleteEntry in this Session AND Judge is not RECUSED; computed on assignment and on any entry add/remove" }

  - name: Rotation
    parent: Session
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> Session.id" }
      - { name: rotation_number, type: integer, source: input, description: "1-based rotation ordinal within session (1..4)" }
      - { name: apparatus, type: enum, source: input, description: "Apparatus contested in this rotation for squads scheduled to it" }
      - { name: scheduled_start, type: datetime, source: input, description: "Rotation start (UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Rotation end (UTC); must be > scheduled_start" }
      - { name: actual_start, type: datetime, source: system, description: "When the rotation was actually opened; null until opened" }
      - { name: actual_end, type: datetime, source: system, description: "When the rotation was actually closed; null until closed" }
      - { name: state, type: enum, source: computed, description: "PENDING | WARMUP | TIMED_WARMUP_HELD | OPEN_FOR_SCORING | SCORING_CLOSED | FINALIZED" }

  - name: WarmupBlock
    parent: Rotation
    common_fields: true
    fields:
      - { name: rotation_id, type: string, source: input, description: "FK -> Rotation.id" }
      - { name: squad_id, type: string, source: input, description: "FK -> Squad.id" }
      - { name: apparatus, type: enum, source: input, description: "Apparatus being warmed" }
      - { name: block_start, type: datetime, source: input, description: "UTC start; must lie within parent Rotation's [scheduled_start - 60min, scheduled_start]" }
      - { name: block_end, type: datetime, source: input, description: "UTC end; must be > block_start and <= Rotation.scheduled_start" }
      - { name: state, type: enum, source: computed, description: "SCHEDULED | IN_PROGRESS | COMPLETE | SKIPPED" }

  - name: Score
    parent: AthleteEntry
    common_fields: true
    fields:
      - { name: athlete_entry_id, type: string, source: input, description: "FK -> AthleteEntry.id" }
      - { name: rotation_id, type: string, source: input, description: "FK -> Rotation.id; rotation in which this routine was performed" }
      - { name: apparatus, type: enum, source: input, description: "Apparatus of this routine" }
      - { name: difficulty_score, type: number, source: input, description: "D-score submitted by D panel; range 0.000..10.000, precision 3 dp" }
      - { name: execution_score, type: number, source: input, description: "E-score submitted by E panel; range 0.000..10.000, precision 3 dp" }
      - { name: neutral_deduction, type: number, source: input, description: "Neutral deductions (out of bounds, overtime); range 0.000..5.000, precision 3 dp; defaults to 0.000", default: 0.0 }
      - { name: provisional_total, type: number, source: computed, description: "difficulty_score + execution_score - neutral_deduction; rounded to 3 dp half-up; computed on entry" }
      - { name: final_total, type: number, source: computed, description: "Post-inquiry resolved total; equals provisional_total unless an inquiry resolved in athlete's favor; rounded to 3 dp half-up" }
      - { name: score_state, type: enum, source: computed, description: "DRAFT | PUBLISHED | UNDER_INQUIRY | INQUIRY_RESOLVED | FINAL | VOID" }
      - { name: published_at, type: datetime, source: system, description: "When score was published (moves DRAFT->PUBLISHED); null until published" }
      - { name: finalized_at, type: datetime, source: system, description: "When score reached FINAL; null until then" }
      - { name: is_tied, type: boolean, source: computed, description: "True iff another Score on the same apparatus+session has identical final_total; computed during award ordering" }
      - { name: tiebreak_rank, type: integer, source: computed, description: "1-based rank within apparatus+session after tiebreak policy; null until session CLOSED" }

  - name: Inquiry
    parent: Score
    common_fields: true
    fields:
      - { name: score_id, type: string, source: input, description: "FK -> Score.id; the score being challenged" }
      - { name: filed_by_coach_id, type: string, source: input, description: "FK -> Coach.id; must hold a CoachMeetPass with pass_state == FLOOR_ACCESS_GRANTED on this Meet" }
      - { name: filed_at, type: datetime, source: system, description: "When inquiry was filed" }
      - { name: inquiry_state, type: enum, source: computed, description: "FILED | UNDER_REVIEW | UPHELD | DENIED | WITHDRAWN | EXPIRED" }
      - { name: resolution, type: enum, source: input, description: "Required iff inquiry_state IN {UPHELD, DENIED}: D_RAISED | D_UNCHANGED | E_ADJUSTED | DEDUCTION_REMOVED | NO_CHANGE" }
      - { name: d_score_delta, type: number, source: input, description: "Change to difficulty_score if UPHELD with D_RAISED; range -2.000..+2.000; defaults to 0", default: 0.0 }
      - { name: e_score_delta, type: number, source: input, description: "Change to execution_score if UPHELD with E_ADJUSTED; range -2.000..+2.000; defaults to 0", default: 0.0 }
      - { name: deduction_delta, type: number, source: input, description: "Change to neutral_deduction if UPHELD with DEDUCTION_REMOVED; range -5.000..0.000; defaults to 0", default: 0.0 }
      - { name: resolved_at, type: datetime, source: system, description: "When UPHELD/DENIED/WITHDRAWN/EXPIRED was recorded" }
      - { name: resolution_reason, type: string, source: input, description: "Free-text justification (max 512 chars)" }

  - name: Award
    parent: Session
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> Session.id" }
      - { name: category, type: enum, source: input, description: "VAULT | UNEVEN_BARS | BALANCE_BEAM | FLOOR_EXERCISE | ALL_AROUND" }
      - { name: place, type: integer, source: input, description: "1 = gold, 2 = silver, 3 = bronze, ... up to Meet's award depth" }
      - { name: athlete_entry_id, type: string, source: input, description: "FK -> AthleteEntry.id" }
      - { name: awarded_at, type: datetime, source: system, description: "When award was recorded" }
      - { name: ceremony_order, type: integer, source: computed, description: "Sequence number for award ceremony presentation; derived from place ascending within category, category ordering VAULT->UNEVEN_BARS->BALANCE_BEAM->FLOOR_EXERCISE->ALL_AROUND" }
      - { name: was_tiebroken, type: boolean, source: computed, description: "True iff this award's recipient was selected via tie-break rather than raw score ordering" }

  - name: SpectatorTicket
    parent: Meet
    common_fields: true
    fields:
      - { name: meet_id, type: string, source: input, description: "FK -> Meet.id" }
      - { name: session_id, type: string, source: input, description: "FK -> Session.id; ticket grants admission to one session only" }
      - { name: holder_name, type: string, source: input, description: "Ticket holder's name" }
      - { name: holder_email, type: string, source: input, description: "Contact email; lowercase; unique per (session_id, holder_email) among tickets with ticket_state != VOID" }
      - { name: ticket_class, type: enum, source: input, description: "GENERAL_ADMISSION | RESERVED | VIP | COMP" }
      - { name: seat_section, type: string, source: input, description: "Required iff ticket_class IN {RESERVED, VIP}; null otherwise" }
      - { name: price_cents, type: integer, source: input, description: "Face value in cents; COMP must be 0" }
      - { name: ticket_state, type: enum, source: computed, description: "ISSUED | SCANNED | REDEEMED | REFUNDED | VOID" }
      - { name: scanned_at, type: datetime, source: system, description: "First gate scan timestamp; null until scanned" }
      - { name: redeemed_at, type: datetime, source: system, description: "Final admission timestamp; null until redeemed" }

  - name: QualificationRecord
    parent: AthleteEntry
    common_fields: true
    fields:
      - { name: athlete_entry_id, type: string, source: input, description: "FK -> AthleteEntry.id; the entry whose qualification this records" }
      - { name: target_meet_level, type: enum, source: input, description: "Level of the next-level meet this entry qualified for: STATE | REGIONAL | NATIONAL" }
      - { name: qualifying_score_used, type: number, source: computed, description: "Score value that met the threshold (AA total or single-event total per Meet.qualifying_score_rule)" }
      - { name: threshold_applied, type: number, source: computed, description: "The threshold constant that was compared against; pinned at computation time for auditability" }
      - { name: qualification_state, type: enum, source: computed, description: "PROVISIONAL | CONFIRMED | DECLINED | REVOKED" }
      - { name: confirmed_at, type: datetime, source: system, description: "When state reached CONFIRMED; null until then" }

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: Meet
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /api/v1/meets/{meet_id}/publish"
        actor: MeetDirector
        preconditions:
          - "meet.posture == DRAFT"
          - "every Session in meet has scheduled_start >= meet.start_date AND scheduled_end <= meet.end_date + 2h"
          - "every Session has at least one Squad assigned"
        side_effects:
          - "cascade: every Session.state transitions SCHEDULED (no-op if already)"
          - "cascade: every JudgePanel.panel_state transitions FORMING -> FULL when its required_judge_count is met"
          - "increments Meet.version by 1"
      - from: SCHEDULED
        to: WARMUP_OPEN
        trigger: "system clock reaching earliest Session.scheduled_start - warmup_open_offset_minutes"
        actor: system
        preconditions:
          - "meet.posture == SCHEDULED"
          - "logical clock >= min(Session.scheduled_start) - warmup_open_offset_minutes"
        side_effects:
          - "cascade: each Session.state SCHEDULED -> WARMUP_OPEN when its own offset is reached"
          - "increments Meet.version by 1"
      - from: WARMUP_OPEN
        to: IN_COMPETITION
        trigger: "system clock reaching earliest Session.scheduled_start"
        actor: system
        preconditions:
          - "meet.posture == WARMUP_OPEN"
        side_effects:
          - "cascade: each Session.state -> IN_ROTATION at its own scheduled_start"
          - "cascade: each JudgePanel.panel_state FULL -> ACTIVE"
          - "increments Meet.version by 1"
      - from: IN_COMPETITION
        to: SCORING_CLOSED
        trigger: "POST /api/v1/meets/{meet_id}/close-scoring"
        actor: MeetDirector
        preconditions:
          - "every Session.state == CLOSED"
          - "every Score.score_state IN {FINAL, VOID}"
          - "no Inquiry.inquiry_state IN {FILED, UNDER_REVIEW}"
        side_effects:
          - "cascade: triggers Award ordering calculation (calculation: award_ordering)"
          - "cascade: triggers QualificationRecord generation (calculation: qualification_evaluation)"
          - "cascade: AthleteEntry.all_around_rank computed for every entry"
          - "increments Meet.version by 1"
      - from: SCORING_CLOSED
        to: FINALIZED
        trigger: "POST /api/v1/meets/{meet_id}/finalize"
        actor: MeetDirector
        preconditions:
          - "meet.posture == SCORING_CLOSED"
          - "every Award row for this meet has ceremony_order assigned"
          - "every QualificationRecord.qualification_state IN {CONFIRMED, DECLINED, REVOKED}"
        side_effects:
          - "no further Score mutations accepted (gate enforced by validation)"
          - "increments Meet.version by 1"
      - from: FINALIZED
        to: ARCHIVED
        trigger: "POST /api/v1/meets/{meet_id}/archive"
        actor: MeetDirector
        preconditions:
          - "meet.posture == FINALIZED"
        side_effects:
          - "increments Meet.version by 1"

  - entity: Session
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: WARMUP_OPEN
        trigger: "system clock reaching Session.scheduled_start - warmup_open_offset_minutes"
        actor: system
        preconditions:
          - "session.state == SCHEDULED"
        side_effects:
          - "each linked WarmupBlock.state SCHEDULED -> IN_PROGRESS when its block_start reached"
          - "increments Session.version by 1"
      - from: WARMUP_OPEN
        to: MARCH_IN
        trigger: "system clock reaching Session.scheduled_start - march_in_offset_minutes"
        actor: system
        preconditions:
          - "session.state == WARMUP_OPEN"
        side_effects:
          - "increments Session.version by 1"
      - from: MARCH_IN
        to: IN_ROTATION
        trigger: "system clock reaching Session.scheduled_start"
        actor: system
        preconditions:
          - "session.state == MARCH_IN"
        side_effects:
          - "Rotation(state == PENDING, rotation_number == 1).state -> WARMUP"
          - "increments Session.version by 1"
      - from: IN_ROTATION
        to: SCORING
        trigger: "system: all Rotation rows for session reach SCORING_CLOSED or FINALIZED"
        actor: system
        preconditions:
          - "every Rotation.state IN {SCORING_CLOSED, FINALIZED}"
        side_effects:
          - "increments Session.version by 1"
      - from: SCORING
        to: CLOSED
        trigger: "POST /api/v1/sessions/{session_id}/close"
        actor: MeetDirector
        preconditions:
          - "session.state == SCORING"
          - "every Score linked to entries in this session has score_state IN {FINAL, VOID}"
          - "no Inquiry for any such score has inquiry_state IN {FILED, UNDER_REVIEW}"
        side_effects:
          - "cascade: bubble-up — parent Meet re-evaluates posture"
          - "calculation award_ordering executes for this session"
          - "calculation qualification_evaluation executes for each AthleteEntry"
          - "session.closed_at := current logical clock"
          - "increments Session.version by 1"

  - entity: Rotation
    initial_state: PENDING
    terminal_states: [FINALIZED]
    transitions:
      - from: PENDING
        to: WARMUP
        trigger: "system clock reaching Rotation.scheduled_start - 60min"
        actor: system
        preconditions:
          - "rotation.state == PENDING"
        side_effects:
          - "cascade: linked WarmupBlock rows with state == SCHEDULED and block_start <= now transition to IN_PROGRESS"
          - "increments Rotation.version by 1"
      - from: WARMUP
        to: TIMED_WARMUP_HELD
        trigger: "system: all linked WarmupBlock rows reach COMPLETE or SKIPPED"
        actor: system
        preconditions:
          - "every WarmupBlock.state IN {COMPLETE, SKIPPED}"
        side_effects:
          - "increments Rotation.version by 1"
      - from: TIMED_WARMUP_HELD
        to: OPEN_FOR_SCORING
        trigger: "POST /api/v1/rotations/{rotation_id}/open-scoring"
        actor: MeetDirector
        preconditions:
          - "rotation.state == TIMED_WARMUP_HELD"
          - "JudgePanel for (rotation.session_id, rotation.apparatus) has panel_state == ACTIVE"
          - "logical clock >= rotation.scheduled_start"
        side_effects:
          - "rotation.actual_start := current logical clock"
          - "increments Rotation.version by 1"
      - from: OPEN_FOR_SCORING
        to: SCORING_CLOSED
        trigger: "POST /api/v1/rotations/{rotation_id}/close-scoring"
        actor: MeetDirector
        preconditions:
          - "rotation.state == OPEN_FOR_SCORING"
          - "every AthleteEntry with squad_id's starting rotation mapping to this rotation has either a Score row with score_state IN {FINAL, PUBLISHED, UNDER_INQUIRY, INQUIRY_RESOLVED, VOID} OR entry_status == SCRATCHED"
        side_effects:
          - "rotation.actual_end := current logical clock"
          - "cascade: Squad.rotation_index += 1 for every squad in this rotation (advances their position)"
          - "increments Rotation.version by 1"
      - from: SCORING_CLOSED
        to: FINALIZED
        trigger: "system: all linked Score rows reach FINAL"
        actor: system
        preconditions:
          - "every Score with rotation_id == this has score_state IN {FINAL, VOID}"
        side_effects:
          - "increments Rotation.version by 1"

  - entity: Score
    initial_state: DRAFT
    terminal_states: [FINAL, VOID]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/v1/scores/{score_id}/publish"
        actor: JudgePanelChief
        preconditions:
          - "score.score_state == DRAFT"
          - "score.rotation_id's Rotation.state == OPEN_FOR_SCORING"
          - "acting Judge holds PanelAssignment with role == PANEL_CHIEF on the panel for this apparatus+session AND assignment_state == CONFIRMED"
        side_effects:
          - "score.published_at := current logical clock"
          - "calculation provisional_score computes score.provisional_total"
          - "cascade: live scoring display update (read model only)"
          - "increments Score.version by 1"
      - from: PUBLISHED
        to: UNDER_INQUIRY
        trigger: "POST /api/v1/scores/{score_id}/inquiries (creates Inquiry)"
        actor: Coach
        preconditions:
          - "score.score_state == PUBLISHED"
          - "logical clock <= score.published_at + Meet.inquiry_window_minutes"
          - "acting coach has CoachMeetPass.pass_state == FLOOR_ACCESS_GRANTED on this meet"
          - "no other Inquiry for this score has inquiry_state IN {FILED, UNDER_REVIEW}"
        side_effects:
          - "creates Inquiry(inquiry_state=FILED)"
          - "increments Score.version by 1"
      - from: UNDER_INQUIRY
        to: INQUIRY_RESOLVED
        trigger: "POST /api/v1/inquiries/{inquiry_id}/resolve"
        actor: MeetReferee
        preconditions:
          - "score.score_state == UNDER_INQUIRY"
          - "linked Inquiry.inquiry_state IN {FILED, UNDER_REVIEW}"
        side_effects:
          - "if Inquiry.resolved as UPHELD: apply d_score_delta, e_score_delta, deduction_delta to score; recompute provisional_total"
          - "calculation final_score computes score.final_total"
          - "increments Score.version by 1"
      - from: UNDER_INQUIRY
        to: PUBLISHED
        trigger: "POST /api/v1/inquiries/{inquiry_id}/withdraw (Coach) OR POST /api/v1/inquiries/{inquiry_id}/expire (system)"
        actor: Coach | system
        preconditions:
          - "score.score_state == UNDER_INQUIRY"
        side_effects:
          - "Inquiry.inquiry_state -> WITHDRAWN or EXPIRED"
          - "score.final_total := score.provisional_total (unchanged)"
          - "increments Score.version by 1"
      - from: PUBLISHED
        to: FINAL
        trigger: "system: inquiry window expires with no Inquiry filed (logical clock > published_at + inquiry_window_minutes AND no Inquiry in {FILED, UNDER_REVIEW})"
        actor: system
        preconditions:
          - "score.score_state == PUBLISHED"
          - "logical clock > score.published_at + Meet.inquiry_window_minutes"
        side_effects:
          - "score.final_total := score.provisional_total"
          - "score.finalized_at := current logical clock"
          - "cascade: bubble-up — parent Rotation re-evaluates SCORING_CLOSED -> FINALIZED"
          - "increments Score.version by 1"
      - from: INQUIRY_RESOLVED
        to: FINAL
        trigger: "POST /api/v1/scores/{score_id}/finalize"
        actor: MeetReferee
        preconditions:
          - "score.score_state == INQUIRY_RESOLVED"
          - "linked Inquiry.inquiry_state IN {UPHELD, DENIED}"
        side_effects:
          - "score.finalized_at := current logical clock"
          - "cascade: bubble-up — parent Rotation re-evaluates SCORING_CLOSED -> FINALIZED"
          - "increments Score.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /api/v1/scores/{score_id}/void"
        actor: MeetReferee
        preconditions:
          - "score.score_state == DRAFT"
          - "score.athlete_entry_id's AthleteEntry.entry_status == SCRATCHED"
        side_effects:
          - "increments Score.version by 1"

  - entity: Inquiry
    initial_state: FILED
    terminal_states: [UPHELD, DENIED, WITHDRAWN, EXPIRED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /api/v1/inquiries/{inquiry_id}/begin-review"
        actor: MeetReferee
        preconditions:
          - "inquiry.inquiry_state == FILED"
        side_effects:
          - "increments Inquiry.version by 1"
      - from: UNDER_REVIEW
        to: FILED
        trigger: "POST /api/v1/inquiries/{inquiry_id}/return-to-queue"
        actor: MeetReferee
        preconditions:
          - "inquiry.inquiry_state == UNDER_REVIEW"
          - "no resolution has been written yet"
        side_effects:
          - "increments Inquiry.version by 1"
        note: "Cyclic loop allows referee to defer without resolution"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /api/v1/inquiries/{inquiry_id}/resolve with resolution != NO_CHANGE and at least one non-zero delta"
        actor: MeetReferee
        preconditions:
          - "inquiry.inquiry_state == UNDER_REVIEW"
          - "at least one of d_score_delta, e_score_delta, deduction_delta != 0"
        side_effects:
          - "cascade: linked Score.score_state UNDER_INQUIRY -> INQUIRY_RESOLVED with deltas applied; final_total recomputed"
          - "inquiry.resolved_at := current logical clock"
          - "increments Inquiry.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/v1/inquiries/{inquiry_id}/resolve with resolution == NO_CHANGE and all deltas == 0"
        actor: MeetReferee
        preconditions:
          - "inquiry.inquiry_state == UNDER_REVIEW"
          - "all of d_score_delta, e_score_delta, deduction_delta == 0"
        side_effects:
          - "cascade: linked Score.score_state UNDER_INQUIRY -> INQUIRY_RESOLVED; final_total := provisional_total"
          - "inquiry.resolved_at := current logical clock"
          - "increments Inquiry.version by 1"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /api/v1/inquiries/{inquiry_id}/withdraw"
        actor: Coach
        preconditions:
          - "inquiry.inquiry_state == FILED"
          - "acting coach == inquiry.filed_by_coach_id"
        side_effects:
          - "cascade: linked Score.score_state UNDER_INQUIRY -> PUBLISHED (returns to pre-inquiry state)"
          - "inquiry.resolved_at := current logical clock"
          - "increments Inquiry.version by 1"
      - from: FILED
        to: EXPIRED
        trigger: "system: logical clock > score.published_at + 4 * Meet.inquiry_window_minutes AND inquiry still FILED"
        actor: system
        preconditions:
          - "inquiry.inquiry_state == FILED"
        side_effects:
          - "cascade: linked Score.score_state UNDER_INQUIRY -> PUBLISHED"
          - "inquiry.resolved_at := current logical clock"
          - "increments Inquiry.version by 1"

  - entity: CoachMeetPass
    initial_state: ISSUED
    terminal_states: [REVOKED]
    transitions:
      - from: ISSUED
        to: FLOOR_ACCESS_GRANTED
        trigger: "POST /api/v1/coach-meet-passes/{pass_id}/grant-floor-access"
        actor: MeetDirector
        preconditions:
          - "pass.pass_state == ISSUED"
          - "Coach.background_check_expiry > current logical clock"
          - "Coach.safety_cert_expiry > current logical clock"
          - "Coach.credential_state == CREDENTIALED"
        side_effects:
          - "pass.floor_access_granted_at := current logical clock"
          - "increments CoachMeetPass.version by 1"
      - from: FLOOR_ACCESS_GRANTED
        to: FLOOR_ACCESS_SUSPENDED
        trigger: "POST /api/v1/coach-meet-passes/{pass_id}/suspend"
        actor: MeetDirector
        preconditions:
          - "pass.pass_state == FLOOR_ACCESS_GRANTED"
        side_effects:
          - "cascade: any Inquiry filed by this coach with inquiry_state == FILED is cascade-transitioned to EXPIRED (loses standing)"
          - "increments CoachMeetPass.version by 1"
      - from: FLOOR_ACCESS_SUSPENDED
        to: FLOOR_ACCESS_GRANTED
        trigger: "POST /api/v1/coach-meet-passes/{pass_id}/reinstate"
        actor: MeetDirector
        preconditions:
          - "pass.pass_state == FLOOR_ACCESS_SUSPENDED"
          - "Coach.background_check_expiry > current logical clock"
          - "Coach.safety_cert_expiry > current logical clock"
        side_effects:
          - "increments CoachMeetPass.version by 1"
      - from: FLOOR_ACCESS_SUSPENDED
        to: REVOKED
        trigger: "POST /api/v1/coach-meet-passes/{pass_id}/revoke"
        actor: MeetDirector
        preconditions:
          - "pass.pass_state IN {FLOOR_ACCESS_SUSPENDED, FLOOR_ACCESS_GRANTED, ISSUED}"
        side_effects:
          - "cascade: any Inquiry filed by this coach with inquiry_state == FILED is cascade-transitioned to EXPIRED"
          - "increments CoachMeetPass.version by 1"

  - entity: PanelAssignment
    initial_state: PROPOSED
    terminal_states: [RELEASED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /api/v1/panel-assignments/{assignment_id}/confirm"
        actor: MeetReferee
        preconditions:
          - "assignment.assignment_state == PROPOSED"
          - "panel_assignment.conflict_flag == false"
          - "Judge.availability window covers parent JudgePanel.session's [scheduled_start, scheduled_end]"
        side_effects:
          - "cascade: parent JudgePanel.panel_state recomputed (FORMING -> FULL when required_judge_count CONFIRMED judges reached)"
          - "increments PanelAssignment.version by 1"
      - from: CONFIRMED
        to: RECUSED
        trigger: "POST /api/v1/panel-assignments/{assignment_id}/recuse"
        actor: MeetReferee
        preconditions:
          - "assignment.assignment_state == CONFIRMED"
          - "either assignment.conflict_flag == true OR acting referee cites conflict"
        side_effects:
          - "cascade: parent JudgePanel.panel_state recomputed (may drop FULL -> FORMING)"
          - "increments PanelAssignment.version by 1"
      - from: RECUSED
        to: RELEASED
        trigger: "POST /api/v1/panel-assignments/{assignment_id}/release"
        actor: MeetReferee
        preconditions:
          - "assignment.assignment_state IN {RECUSED, CONFIRMED}"
        side_effects:
          - "increments PanelAssignment.version by 1"

  - entity: AthleteEntry
    initial_state: REGISTERED
    terminal_states: [COMPLETED, SCRATCHED]
    transitions:
      - from: REGISTERED
        to: CHECKED_IN
        trigger: "POST /api/v1/athlete-entries/{entry_id}/check-in"
        actor: Coach
        preconditions:
          - "entry.entry_status == REGISTERED"
          - "acting coach holds CoachMeetPass on parent Meet with pass_state == FLOOR_ACCESS_GRANTED"
          - "Coach.affiliated_gym == Gymnast.home_gym"
        side_effects:
          - "increments AthleteEntry.version by 1"
      - from: CHECKED_IN
        to: COMPETING
        trigger: "system: parent Session.state reaches IN_ROTATION"
        actor: system
        preconditions:
          - "entry.entry_status == CHECKED_IN"
        side_effects:
          - "increments AthleteEntry.version by 1"
      - from: COMPETING
        to: COMPLETED
        trigger: "system: all four apparatus Score rows for this entry reach FINAL or VOID"
        actor: system
        preconditions:
          - "count(Score where athlete_entry_id == this and score_state IN {FINAL, VOID}) == 4"
        side_effects:
          - "calculation all_around_total computes entry.all_around_total"
          - "calculation qualification_evaluation computes entry.qualified_for_next_meet and may create QualificationRecord"
          - "increments AthleteEntry.version by 1"
      - from: REGISTERED
        to: SCRATCHED
        trigger: "POST /api/v1/athlete-entries/{entry_id}/scratch"
        actor: Coach
        preconditions:
          - "entry.entry_status IN {REGISTERED, CHECKED_IN, COMPETING}"
        side_effects:
          - "cascade: any Score rows for this entry in DRAFT state transition to VOID"
          - "cascade: parent Squad.athlete_count recomputed"
          - "cascade: PanelAssignment.conflict_flag recomputed for all panels in session"
          - "increments AthleteEntry.version by 1"
      - from: CHECKED_IN
        to: SCRATCHED
        trigger: "POST /api/v1/athlete-entries/{entry_id}/scratch"
        actor: Coach
        preconditions:
          - "entry.entry_status IN {REGISTERED, CHECKED_IN, COMPETING}"
        side_effects:
          - "cascade: any Score rows for this entry in DRAFT state transition to VOID"
          - "cascade: parent Squad.athlete_count recomputed"
          - "cascade: PanelAssignment.conflict_flag recomputed for all panels in session"
          - "increments AthleteEntry.version by 1"
      - from: COMPETING
        to: SCRATCHED
        trigger: "POST /api/v1/athlete-entries/{entry_id}/scratch"
        actor: Coach
        preconditions:
          - "entry.entry_status IN {REGISTERED, CHECKED_IN, COMPETING}"
        side_effects:
          - "cascade: any Score rows for this entry in DRAFT state transition to VOID; non-DRAFT scores retained as historical record"
          - "cascade: parent Squad.athlete_count recomputed"
          - "increments AthleteEntry.version by 1"

  - entity: SpectatorTicket
    initial_state: ISSUED
    terminal_states: [REDEEMED, REFUNDED, VOID]
    transitions:
      - from: ISSUED
        to: SCANNED
        trigger: "POST /api/v1/spectator-tickets/{ticket_id}/scan"
        actor: GateAttendant
        preconditions:
          - "ticket.ticket_state == ISSUED"
          - "parent Meet.posture IN {WARMUP_OPEN, IN_COMPETITION}"
          - "logical clock >= Session.scheduled_start - 2h AND <= Session.scheduled_end"
        side_effects:
          - "ticket.scanned_at := current logical clock"
          - "increments SpectatorTicket.version by 1"
      - from: SCANNED
        to: REDEEMED
        trigger: "POST /api/v1/spectator-tickets/{ticket_id}/redeem"
        actor: GateAttendant
        preconditions:
          - "ticket.ticket_state == SCANNED"
        side_effects:
          - "ticket.redeemed_at := current logical clock"
          - "increments SpectatorTicket.version by 1"
      - from: ISSUED
        to: REFUNDED
        trigger: "POST /api/v1/spectator-tickets/{ticket_id}/refund"
        actor: MeetDirector
        preconditions:
          - "ticket.ticket_state == ISSUED"
          - "logical clock < Session.scheduled_start (no refunds after doors)"
        side_effects:
          - "increments SpectatorTicket.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /api/v1/spectator-tickets/{ticket_id}/void"
        actor: MeetDirector
        preconditions:
          - "ticket.ticket_state == ISSUED"
          - "parent Meet.posture == DRAFT"
        side_effects:
          - "increments SpectatorTicket.version by 1"

  - entity: QualificationRecord
    initial_state: PROVISIONAL
    terminal_states: [CONFIRMED, DECLINED, REVOKED]
    transitions:
      - from: PROVISIONAL
        to: CONFIRMED
        trigger: "POST /api/v1/qualification-records/{record_id}/confirm"
        actor: MeetDirector
        preconditions:
          - "record.qualification_state == PROVISIONAL"
          - "parent AthleteEntry.entry_status == COMPLETED"
          - "parent Meet.posture IN {SCORING_CLOSED, FINALIZED}"
        side_effects:
          - "record.confirmed_at := current logical clock"
          - "increments QualificationRecord.version by 1"
      - from: PROVISIONAL
        to: DECLINED
        trigger: "POST /api/v1/qualification-records/{record_id}/decline"
        actor: Coach
        preconditions:
          - "record.qualification_state == PROVISIONAL"
          - "acting coach holds CoachMeetPass on parent Meet with pass_state == FLOOR_ACCESS_GRANTED"
          - "Coach.affiliated_gym == Gymnast.home_gym of the AthleteEntry"
        side_effects:
          - "increments QualificationRecord.version by 1"
      - from: CONFIRMED
        to: REVOKED
        trigger: "POST /api/v1/qualification-records/{record_id}/revoke"
        actor: MeetDirector
        preconditions:
          - "record.qualification_state == CONFIRMED"
          - "a previously FINAL Score for this AthleteEntry was found erroneous and corrected in a way that drops below threshold (audit path)"
        side_effects:
          - "increments QualificationRecord.version by 1"

# ============================================================================
# §1.2.1 Concurrency Rules
# ============================================================================
concurrency_rules:
  - rule_id: score-publish-stale-score
    parent_entity: Score
    write_endpoint: "POST /api/v1/scores/{score_id}/publish"
    occ_field: "expected_score_version"
    description: |
      Publishing a Score whose version has advanced since the panel chief last
      observed it is rejected. This captures the case where another writer has
      just edited the D/E/deduction inputs (a legitimate pre-publish amendment)
      and the current publisher's view of the score is therefore stale.
    error_id: ERR_STALE_SCORE_VERSION
    http_status: 412

  - rule_id: inquiry-resolve-stale-inquiry
    parent_entity: Inquiry
    write_endpoint: "POST /api/v1/inquiries/{inquiry_id}/resolve"
    occ_field: "expected_inquiry_version"
    description: |
      Resolving an Inquiry whose version has advanced since the referee last
      observed it is rejected. This captures the case where the inquiry was
      returned-to-queue (FILED) or had resolution fields edited and the
      resolving referee's view is stale.
    error_id: ERR_STALE_INQUIRY_VERSION
    http_status: 412

  - rule_id: session-close-stale-session
    parent_entity: Session
    write_endpoint: "POST /api/v1/sessions/{session_id}/close"
    occ_field: "expected_session_version"
    description: |
      Closing a Session whose version has advanced since the meet director last
      observed it is rejected. A late score finalization or rotation close
      advances the session's version, so a close request carrying the old
      version is stale.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: provisional_score
    trigger: "POST /api/v1/scores/{score_id}/publish (Score DRAFT -> PUBLISHED)"
    algorithm: aggregation
    formula: |
      raw = difficulty_score + execution_score - neutral_deduction
      provisional_total = round_half_up(raw, 3)
      # Clamp: provisional_total >= 0.000 (a routine cannot score negative)
      if provisional_total < 0: provisional_total = 0.000
    input_set: "Single Score row in DRAFT state being published"
    constants:
      DECIMAL_PLACES: 3
      ROUNDING: half_up
      FLOOR: 0.000
    precision: "3 decimal places, round_half_up"
    variants:
      - name: provisional_at_publish
        when: "Score transitions DRAFT -> PUBLISHED"
        difference: "Computed from input fields; final_total NOT yet set"
      - name: provisional_after_inquiry
        when: "Inquiry UPHELD applies deltas"
        difference: "Recomputed as (difficulty_score + d_score_delta) + (execution_score + e_score_delta) - (neutral_deduction + deduction_delta); rounding applied after sum"

  - name: final_score
    trigger: "Score transitions to FINAL (via inquiry window expiry, referee finalize, or inquiry withdrawal)"
    algorithm: aggregation
    formula: |
      if linked Inquiry exists AND Inquiry.inquiry_state == UPHELD:
        # Use the post-delta provisional_total (already rounded)
        final_total = provisional_total
      else:
        final_total = provisional_total
      # Note: provisional_score variant 'provisional_after_inquiry' already applied rounding
    input_set: "Single Score row; optional linked Inquiry"
    constants:
      DECIMAL_PLACES: 3
      ROUNDING: half_up
    precision: "3 decimal places, round_half_up"
    variants:
      - name: final_no_inquiry
        when: "Inquiry window expired with no Inquiry, OR Inquiry WITHDRAWN/EXPIRED/DENIED"
        difference: "final_total = provisional_total (unchanged)"
      - name: final_after_upheld_inquiry
        when: "Inquiry resolved UPHELD"
        difference: "final_total = provisional_total AFTER deltas applied (recomputed by provisional_score variant 'provisional_after_inquiry')"

  - name: all_around_total
    trigger: "AthleteEntry COMPETING -> COMPLETED (all four apparatus FINAL/VOID)"
    algorithm: aggregation
    formula: |
      # Per USAG: only FINAL scores count; VOID (scratched) apparatus contributes 0.000
      aa = 0.000
      for apparatus in [VAULT, UNEVEN_BARS, BALANCE_BEAM, FLOOR_EXERCISE]:
        s = Score where athlete_entry_id == this AND apparatus == apparatus
        if s exists AND s.score_state == FINAL:
          aa = aa + s.final_total
        # else contributes 0.000
      # Rounding pinned: per-apparatus finals are already 3dp; sum, then round to 3dp
      all_around_total = round_half_up(aa, 3)
    input_set: "All Score rows for one AthleteEntry with score_state == FINAL; VOID apparatus excluded (contributes 0)"
    constants:
      APPARATUS_COUNT: 4
      DECIMAL_PLACES: 3
    precision: "3 decimal places, round_half_up; rounding pinned to per-apparatus-final-then-sum order (NOT sum-then-round-raw)"
    variants:
      - name: aa_complete
        when: "All four apparatus FINAL"
        difference: "Sum of four final_total values"
      - name: aa_with_scratch
        when: "One or more apparatus VOID (scratch)"
        difference: "Scratched apparatus contributes 0.000; AA total is partial"

  - name: award_ordering
    trigger: "Session SCORING -> CLOSED; cascade-triggered by Meet IN_COMPETITION -> SCORING_CLOSED"
    algorithm: weighted_scoring
    formula: |
      # Tie-break rule (USAG_CLASSIC):
      # 1. Sort by final_total DESC
      # 2. If tied: higher execution_score wins
      # 3. If still tied: higher difficulty_score wins
      # 4. If still tied: lower neutral_deduction wins
      # 5. If still tied: shared rank (both receive same place; next place skipped)
      # Tie-break rule (NCAA_MODIFIED):
      # 1. Sort by final_total DESC
      # 2. If tied: shared rank (no further tie-break)
      if meet.tiebreak_policy == "USAG_CLASSIC":
        sort_key = (-final_total, -execution_score, -difficulty_score, neutral_deduction, created_at ASC)
      else:  # NCAA_MODIFIED
        sort_key = (-final_total, created_at ASC)
      # Assign tiebreak_rank 1..N, skipping ranks after shared ties
    input_set: "All Score rows in this Session for one apparatus with score_state == FINAL"
    constants:
      CATEGORIES: [VAULT, UNEVEN_BARS, BALANCE_BEAM, FLOOR_EXERCISE, ALL_AROUND]
      APPARATUS_ORDER: [VAULT, UNEVEN_BARS, BALANCE_BEAM, FLOOR_EXERCISE]
    precision: "ranks are integers; ties share rank, next rank skips"
    variants:
      - name: award_usag_classic
        when: "Meet.tiebreak_policy == USAG_CLASSIC"
        difference: "Applies E-score -> D-score -> deduction tie-break chain before shared rank"
      - name: award_ncaa_modified
        when: "Meet.tiebreak_policy == NCAA_MODIFIED"
        difference: "Tied final_total yields shared rank immediately; no E/D/deduction cascade"

  - name: ceremony_ordering
    trigger: "Session SCORING -> CLOSED (after award_ordering)"
    algorithm: chronological
    formula: |
      # Ceremony presents awards in reverse order of prestige within each category:
      # - Within a category: highest place number first (bronze before silver before gold)
      # - Categories ordered: VAULT, UNEVEN_BARS, BALANCE_BEAM, FLOOR_EXERCISE, ALL_AROUND
      # - ALL_AROUND is always LAST (highest prestige)
      # ceremony_order = (category_index * 100) + (max_place_in_category - place + 1)
      # where category_index = 0 for VAULT, 1 for UB, 2 for BB, 3 for FX, 4 for AA
      ceremony_order = category_index * 100 + (max_place - place + 1)
    input_set: "All Award rows for one Session"
    constants:
      CATEGORY_ORDER: { VAULT: 0, UNEVEN_BARS: 1, BALANCE_BEAM: 2, FLOOR_EXERCISE: 3, ALL_AROUND: 4 }
      PLACE_STRIDE: 100
    precision: "integer ordering; deterministic"
    variants: []

  - name: qualification_evaluation
    trigger: "AthleteEntry COMPETING -> COMPLETED AND parent Session SCORING -> CLOSED"
    algorithm: threshold
    formula: |
      # Thresholds by competitive level (USAG mobility scores):
      # L4/L5: AA >= 32.000 -> STATE
      # L6/L7/L8: AA >= 34.000 -> STATE; AA >= 35.500 -> REGIONAL
      # L9/L10: AA >= 34.500 -> STATE; AA >= 36.000 -> REGIONAL; AA >= 37.500 -> NATIONAL (L10 only)
      # Per-event rule (when Meet.qualifying_score_rule IN {PER_EVENT, BOTH}):
      #   single apparatus final_total >= 9.000 qualifies to STATE regardless of AA
      level = gymnast.competitive_level
      if level in [L4, L5]: state_threshold = 32.000; regional_threshold = null; national_threshold = null
      if level in [L6, L7, L8]: state_threshold = 34.000; regional_threshold = 35.500; national_threshold = null
      if level in [L9, L10]: state_threshold = 34.500; regional_threshold = 36.000; national_threshold = 37.500 if level == L10 else null

      aa_qualifies_state = (state_threshold != null) AND (all_around_total >= state_threshold)
      aa_qualifies_regional = (regional_threshold != null) AND (all_around_total >= regional_threshold)
      aa_qualifies_national = (national_threshold != null) AND (all_around_total >= national_threshold)

      # Boundary precision: >= is inclusive — a score of exactly 32.000 qualifies L4/L5 to STATE
      # Per-event check
      best_event_total = max(Score.final_total for apparatus scores where score_state == FINAL)
      event_qualifies_state = best_event_total >= 9.000

      # Combine per Meet.qualifying_score_rule
      if meet.qualifying_score_rule == "ALL_AROUND_ONLY":
        qualified = aa_qualifies_state OR aa_qualifies_regional OR aa_qualifies_national
      elif meet.qualifying_score_rule == "PER_EVENT":
        qualified = event_qualifies_state
      else:  # BOTH
        qualified = (aa_qualifies_state OR aa_qualifies_regional OR aa_qualifies_national) OR event_qualifies_state

      # Mobility score pinned: the value that drove the qualification decision
      if qualified:
        if meet.qualifying_score_rule == "PER_EVENT":
          qualification_mobility_score = best_event_total
        elif meet.qualifying_score_rule == "ALL_AROUND_ONLY":
          qualification_mobility_score = all_around_total
        else:  # BOTH — use the higher of the two paths' scores
          qualification_mobility_score = max(all_around_total, best_event_total) if event_qualifies_state else all_around_total
    input_set: "One AthleteEntry in COMPLETED; its four Score rows; Meet.qualifying_score_rule; Gymnast.competitive_level"
    constants:
      L45_STATE_AA: 32.000
      L678_STATE_AA: 34.000
      L678_REGIONAL_AA: 35.500
      L910_STATE_AA: 34.500
      L910_REGIONAL_AA: 36.000
      L10_NATIONAL_AA: 37.500
      EVENT_STATE_THRESHOLD: 9.000
    precision: "3 decimal places; threshold comparisons use >= (inclusive lower bound)"
    variants:
      - name: qual_aa_only
        when: "Meet.qualifying_score_rule == ALL_AROUND_ONLY"
        difference: "Only AA total considered; per-event 9.000 rule suppressed"
      - name: qual_per_event_only
        when: "Meet.qualifying_score_rule == PER_EVENT"
        difference: "Only single-apparatus >= 9.000 rule applied; AA total ignored"
      - name: qual_both
        when: "Meet.qualifying_score_rule == BOTH"
        difference: "Either path qualifies; mobility score = max of the paths that fired"

  - name: squad_assignment
    trigger: "POST /api/v1/sessions/{session_id}/assign-squads (bulk selector)"
    algorithm: constraint_propagation
    formula: |
      # Selector: distribute AthleteEntry rows (entry_status == REGISTERED) across Squad rows
      # Eligibility: entry_status == REGISTERED AND squad_id IS NULL
      # Ranking: created_at ASC (registration order; FIFO)
      # Tie-break: created_at ties broken by Gymnast.usag_member_number ASC (lexicographic — deterministic, not id)
      # Constraint: no Squad may exceed Meet.max_athletes_per_squad
      # Constraint: athletes from same home_gym MUST land in same Squad (USAG team cohesion rule)
      # Fallback: if total registered > capacity, overflow entries remain unassigned (squad_id stays NULL)
      eligible = [e for e in AthleteEntry where session_id == session AND entry_status == REGISTERED AND squad_id IS NULL]
      sort eligible by (created_at ASC, gymnast.usag_member_number ASC)
      group by gymnast.home_gym preserving order
      squads = [s for s in Squad where session_id == session]
      for each gym_group in eligible:
        target_squad = first squad with (athlete_count + len(gym_group)) <= Meet.max_athletes_per_squad
        if target_squad is None: leave group unassigned; continue
        assign all entries in gym_group to target_squad
        target_squad.athlete_count += len(gym_group)
    input_set: "AthleteEntry rows for one Session in REGISTERED with squad_id NULL; Squad rows for that Session"
    constants:
      FIFO_KEY: created_at
      TIEBREAK: usag_member_number_lexicographic
    precision: "integer squad sizes; assignments are deterministic"
    variants: []

  - name: judge_panel_selector
    trigger: "POST /api/v1/judge-panels/{panel_id}/auto-assign (selector policy)"
    algorithm: constraint_propagation
    formula: |
      # Selector: pick N judges for a JudgePanel
      # Eligibility: Judge.rating allows this level_band (BREVET/NATIONAL/USA can judge any; LEVEL_10 only L10 and below; etc.)
      #   AND Judge.availability window covers Session's [scheduled_start, scheduled_end]
      #   AND Judge has no CONFIRMED PanelAssignment on another panel whose Session overlaps temporally
      #   AND Judge.affiliated_gym NOT IN {home_gym of any AthleteEntry in this session} (conflict-of-interest exclusion)
      # Ranking: rating tier DESC (BREVET > NATIONAL > USA > LEVEL_10 > ... > XCEL)
      # Tie-break: usag_judge_number ASC (lexicographic)
      # Fallback: if eligible pool < required_judge_count, return ERR_INSUFFICIENT_JUDGE_POOL
      eligible = [j for j in Judge where rating_allows(j.rating, session.level_band)
                  AND j.availability_start <= session.scheduled_start
                  AND j.availability_end >= session.scheduled_end
                  AND NOT has_temporal_overlap_with_confirmed_assignment(j, session)
                  AND j.affiliated_gym NOT IN session_gyms]
      sort eligible by (rating_tier DESC, usag_judge_number ASC)
      if len(eligible) < required_judge_count: raise ERR_INSUFFICIENT_JUDGE_POOL
      take first required_judge_count
    input_set: "All Judge rows; Session's AthleteEntry home_gym set; other JudgePanel assignments in the same Meet"
    constants:
      RATING_TIERS: { BREVET: 8, NATIONAL: 7, USA: 6, LEVEL_10: 5, LEVEL_9: 4, LEVEL_8: 3, LEVEL_7: 2, LEVEL_4_5: 1, XCEL: 0 }
      REQUIRED_COUNT_BB_FX: 4
      REQUIRED_COUNT_VT_UB: 2
    precision: "deterministic selection"
    variants: []

  - name: rotation_temporal_layout
    trigger: "POST /api/v1/sessions/{session_id}/rotations/generate"
    algorithm: interval_merge
    formula: |
      # Generate 4 Rotation rows (one per apparatus) for a session
      # Each rotation duration = ceil(squad_athlete_total / squads_per_rotation) * per_athlete_seconds
      # per_athlete_seconds: VAULT=30, UNEVEN_BARS=90, BALANCE_BEAM=120, FLOOR_EXERCISE=90
      # Rotation gaps: 5 minutes between rotations (rotation changeover)
      # Rotations are half-open intervals [start, end) — adjacent rotations with gap=0 share boundary but do NOT overlap
      total_athletes = sum(Squad.athlete_count)
      duration_per_rotation_apparatus = ceil(total_athletes * per_athlete_seconds[apparatus] / 60) minutes
      # Schedule in order: each squad starts on its starting_apparatus; olympic order VAULT -> UB -> BB -> FX
      current_time = session.scheduled_start
      for rotation_num in 1..4:
        apparatus = apparatus_at_position(rotation_num)
        rotation[rotation_num].scheduled_start = current_time
        rotation[rotation_num].scheduled_end = current_time + duration_per_rotation_apparatus[apparatus]
        current_time = rotation[rotation_num].scheduled_end + 5 minutes  # changeover gap
    input_set: "Session, its Squads with athlete_count, apparatus_set ordering"
    constants:
      PER_ATHLETE_SECONDS: { VAULT: 30, UNEVEN_BARS: 90, BALANCE_BEAM: 120, FLOOR_EXERCISE: 90 }
      CHANGEOVER_GAP_MINUTES: 5
      WARMUP_LOOKBACK_MINUTES: 60
    precision: "minute-granularity scheduling; half-open intervals"
    variants: []

  - name: warmup_block_layout
    trigger: "POST /api/v1/rotations/{rotation_id}/warmup-blocks/generate"
    algorithm: waterfall_allocation
    formula: |
      # Allocate warm-up blocks within the 60-minute window before Rotation.scheduled_start
      # Each Squad gets a block; block duration = ceil(athlete_count * 2 minutes) but min 8 min, max 20 min
      # Blocks are allocated in Squad.rotation_index order (ascending); earlier index = earlier block
      # Remainder time (if any) is allocated to the LAST squad as overflow buffer
      # Blocks are closed intervals [block_start, block_end]; consecutive blocks share boundary timestamp
      window_start = rotation.scheduled_start - 60 minutes
      window_end = rotation.scheduled_start
      squads_sorted = squads in rotation sorted by rotation_index ASC, then created_at ASC
      total_minutes = 60
      allocated = 0
      for squad in squads_sorted:
        raw = ceil(squad.athlete_count * 2)
        block_minutes = max(8, min(20, raw))
        if allocated + block_minutes > total_minutes:
          block_minutes = total_minutes - allocated  # waterfall: remainder
        squad.block_start = window_start + allocated
        squad.block_end = squad.block_start + block_minutes
        allocated += block_minutes
      if allocated < total_minutes AND squads_sorted non-empty:
        last_squad.block_end += (total_minutes - allocated)  # overflow to last
    input_set: "One Rotation and its Squads"
    constants:
      WINDOW_MINUTES: 60
      MIN_BLOCK_MINUTES: 8
      MAX_BLOCK_MINUTES: 20
      PER_ATHLETE_WARMUP_MINUTES: 2
    precision: "minute granularity; closed intervals; last block may absorb overflow"
    variants: []

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint (RBAC matrix)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated resource IDs exist (validated left-to-right)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys resolve to existing entities"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PUT/PATCH with FK fields"

  - priority: 5
    category: state
    check: "Parent Meet.posture permits the requested child mutation (e.g., no Score edits when Meet FINALIZED; no Session create when Meet IN_COMPETITION)"
    error_id: ERR_MEET_POSTURE_FORBIDS
    http_status: 409
    applies_to: "child-mutating endpoints under /meets/{meet_id}/..."

  - priority: 6
    category: state
    check: "Entity-specific state precondition for the transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_safety
    check: "Coach credential validity: Coach.background_check_expiry > now AND Coach.safety_cert_expiry > now when granting floor access or filing inquiry"
    error_id: ERR_COACH_CREDENTIAL_LAPSED
    http_status: 422
    applies_to: "POST /api/v1/coach-meet-passes/{id}/grant-floor-access; POST /api/v1/scores/{id}/inquiries"

  - priority: 8
    category: business_safety
    check: "Judge conflict-of-interest: Judge.affiliated_gym NOT IN home_gym set of session's AthleteEntry rows (when conflict_flag would be true)"
    error_id: ERR_JUDGE_CONFLICT_OF_INTEREST
    http_status: 422
    applies_to: "POST /api/v1/panel-assignments/{id}/confirm; POST /api/v1/judge-panels/{id}/auto-assign"

  - priority: 9
    category: business_temporal
    check: "Inquiry filing window: logical clock <= score.published_at + Meet.inquiry_window_minutes (strict: filing AT exactly published_at + window is allowed; after is rejected)"
    error_id: ERR_INQUIRY_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /api/v1/scores/{id}/inquiries"

  - priority: 10
    category: business_temporal
    check: "Rotation warm-up blocks must fit within [Rotation.scheduled_start - 60min, Rotation.scheduled_start]; half-open overlap with another block rejected"
    error_id: ERR_WARMUP_BLOCK_OVERLAP
    http_status: 422
    applies_to: "POST /api/v1/rotations/{id}/warmup-blocks; POST /api/v1/rotations/{id}/warmup-blocks/generate"

  - priority: 11
    category: business_temporal
    check: "Rotation scheduled intervals within one Session must not overlap (half-open [start, end); adjacent with gap >= 0 is OK)"
    error_id: ERR_ROTATION_OVERLAP
    http_status: 422
    applies_to: "POST /api/v1/sessions/{id}/rotations; POST /api/v1/sessions/{id}/rotations/generate"

  - priority: 12
    category: business_temporal
    check: "Judge availability window must cover Session [scheduled_start, scheduled_end] when assigning to panel"
    error_id: ERR_JUDGE_UNAVAILABLE
    http_status: 422
    applies_to: "POST /api/v1/judge-panels/{id}/assignments; POST /api/v1/panel-assignments/{id}/confirm"

  - priority: 13
    category: business_temporal
    check: "SpectatorTicket scan window: logical clock in [Session.scheduled_start - 2h, Session.scheduled_end]"
    error_id: ERR_TICKET_OUTSIDE_SCAN_WINDOW
    http_status: 422
    applies_to: "POST /api/v1/spectator-tickets/{id}/scan"

  - priority: 14
    category: business_constraint
    check: "Squad capacity: assigning athletes must not exceed Meet.max_athletes_per_squad"
    error_id: ERR_SQUAD_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /api/v1/sessions/{id}/assign-squads; POST /api/v1/athlete-entries/{id}/assign-squad"

  - priority: 15
    category: business_constraint
    check: "JudgePanel required_judge_count met before panel can transition to FULL; BALANCE_BEAM/FLOOR_EXERCISE require 4, others 2"
    error_id: ERR_PANEL_UNDERSTAFFED
    http_status: 422
    applies_to: "POST /api/v1/judge-panels/{id}/activate; POST /api/v1/rotations/{id}/open-scoring"

  - priority: 16
    category: business_constraint
    check: "Session.scheduled_start >= parent Meet.start_date AND Session.scheduled_end <= Meet.end_date + 2h"
    error_id: ERR_SESSION_OUTSIDE_MEET_WINDOW
    http_status: 422
    applies_to: "POST /api/v1/meets/{id}/sessions; PUT /api/v1/sessions/{id}"

  - priority: 17
    category: business_constraint
    check: "Score field ranges: difficulty_score in [0.000, 10.000]; execution_score in [0.000, 10.000]; neutral_deduction in [0.000, 5.000]; precision 3dp"
    error_id: ERR_SCORE_FIELD_RANGE
    http_status: 422
    applies_to: "POST /api/v1/athlete-entries/{id}/scores; PUT /api/v1/scores/{id}"

  - priority: 18
    category: business_constraint
    check: "Inquiry resolution consistency: if resolution == UPHELD then at least one delta != 0; if resolution == DENIED then all deltas == 0"
    error_id: ERR_INQUIRY_RESOLUTION_INCONSISTENT
    http_status: 422
    applies_to: "POST /api/v1/inquiries/{id}/resolve"

  - priority: 19
    category: business_constraint
    check: "SpectatorTicket uniqueness: (session_id, holder_email) unique among tickets with ticket_state != VOID"
    error_id: ERR_TICKET_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /api/v1/meets/{id}/sessions/{sid}/spectator-tickets"

  - priority: 20
    category: business_constraint
    check: "SpectatorTicket COMP class must have price_cents == 0; non-COMP must have price_cents > 0"
    error_id: ERR_TICKET_PRICE_MISMATCH
    http_status: 422
    applies_to: "POST /api/v1/meets/{id}/sessions/{sid}/spectator-tickets"

  - priority: 21
    category: business_constraint
    check: "SpectatorTicket RESERVED/VIP requires seat_section; GENERAL_ADMISSION/COMP must have seat_section NULL"
    error_id: ERR_TICKET_SEAT_SECTION_INVALID
    http_status: 422
    applies_to: "POST /api/v1/meets/{id}/sessions/{sid}/spectator-tickets"

  - priority: 22
    category: business_referential
    check: "AthleteEntry gymnast_id's competitive_level must be compatible with Session.level_band (exact match for compulsory levels L2-L5; optional levels L6-L10 and XCEL may cross one band up/down)"
    error_id: ERR_LEVEL_BAND_MISMATCH
    http_status: 422
    applies_to: "POST /api/v1/sessions/{id}/athlete-entries"

  - priority: 23
    category: business_referential
    check: "AthleteEntry gymnast must not already have an entry in another Session of the same Meet with entry_status NOT IN {SCRATCHED}"
    error_id: ERR_GYMNAST_DOUBLE_ENTERED
    http_status: 409
    applies_to: "POST /api/v1/sessions/{id}/athlete-entries"

  - priority: 24
    category: business_fiscal
    check: "Inquiry resolution deltas bounded: d_score_delta, e_score_delta in [-2.000, +2.000]; deduction_delta in [-5.000, 0.000]"
    error_id: ERR_INQUIRY_DELTA_RANGE
    http_status: 422
    applies_to: "POST /api/v1/inquiries/{id}/resolve"

  - priority: 25
    category: business_fiscal
    check: "SpectatorTicket refund only when logical clock < Session.scheduled_start (no refunds after doors open)"
    error_id: ERR_REFUND_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /api/v1/spectator-tickets/{id}/refund"

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================
endpoints:
  # --- Meet lifecycle ---
  - method: POST
    path: "/api/v1/meets"
    description: "Create a Meet in DRAFT posture"
    roles: [MeetDirector]
    code: 201
    input: [meet_name, sanction_year, sanction_number, venue_name, start_date, end_date, "tiebreak_policy?", "qualifying_score_rule?", "inquiry_window_minutes?", "max_athletes_per_squad?"]
    output: Meet
    side_effects: ["Meet created in DRAFT posture; posture = DRAFT"]

  - method: GET
    path: "/api/v1/meets"
    description: "List meets with pagination and optional filters"
    roles: [MeetDirector, MeetReferee, JudgePanelChief, Coach, Spectator, GateAttendant]
    code: 200
    input: ["limit?", "offset?", "posture?", "sanction_year?"]
    output: Meet[]
    side_effects: []

  - method: GET
    path: "/api/v1/meets/{id}"
    description: "Get one Meet"
    roles: [MeetDirector, MeetReferee, JudgePanelChief, Coach, Spectator, GateAttendant]
    code: 200
    input: []
    output: Meet
    side_effects: []

  - method: POST
    path: "/api/v1/meets/{id}/publish"
    description: "Transition Meet DRAFT -> SCHEDULED"
    roles: [MeetDirector]
    code: 200
    input: []
    output: Meet
    side_effects: ["Session state cascade", "JudgePanel FORMING -> FULL evaluation", "increments Meet.version by 1"]

  - method: POST
    path: "/api/v1/meets/{id}/close-scoring"
    description: "Transition Meet IN_COMPETITION -> SCORING_CLOSED"
    roles: [MeetDirector]
    code: 200
    input: []
    output: Meet
    side_effects: ["triggers award_ordering", "triggers qualification_evaluation", "increments Meet.version by 1"]

  - method: POST
    path: "/api/v1/meets/{id}/finalize"
    description: "Transition Meet SCORING_CLOSED -> FINALIZED"
    roles: [MeetDirector]
    code: 200
    input: []
    output: Meet
    side_effects: ["increments Meet.version by 1"]

  - method: POST
    path: "/api/v1/meets/{id}/archive"
    description: "Transition Meet FINALIZED -> ARCHIVED"
    roles: [MeetDirector]
    code: 200
    input: []
    output: Meet
    side_effects: ["increments Meet.version by 1"]

  # --- Session ---
  - method: POST
    path: "/api/v1/meets/{id}/sessions"
    description: "Create a Session within a Meet"
    roles: [MeetDirector]
    code: 201
    input: [session_label, level_band, scheduled_start, scheduled_end, "warmup_open_offset_minutes?", "march_in_offset_minutes?", apparatus_set]
    output: Session
    side_effects: ["Session created in SCHEDULED state"]

  - method: GET
    path: "/api/v1/meets/{id}/sessions"
    description: "List sessions for a meet (sub-resource form of Session reverse-reachability)"
    roles: [MeetDirector, MeetReferee, JudgePanelChief, Coach, Spectator]
    code: 200
    input: ["limit?", "offset?", "level_band?", "state?"]
    output: Session[]
    side_effects: []

  - method: GET
    path: "/api/v1/sessions/{id}"
    description: "Get one Session"
    roles: [MeetDirector, MeetReferee, JudgePanelChief, Coach, Spectator]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: POST
    path: "/api/v1/sessions/{id}/close"
    description: "Transition Session SCORING -> CLOSED; OCC-guarded"
    roles: [MeetDirector]
    code: 200
    input: [expected_session_version]
    output: Session
    side_effects: ["triggers award_ordering", "triggers qualification_evaluation", "session.closed_at set", "increments Session.version by 1"]

  # --- Squad ---
  - method: POST
    path: "/api/v1/sessions/{id}/squads"
    description: "Create a Squad within a Session"
    roles: [MeetDirector]
    code: 201
    input: [squad_label, starting_apparatus]
    output: Squad
    side_effects: []

  - method: GET
    path: "/api/v1/sessions/{id}/squads"
    description: "List squads for a session (sub-resource reverse-reachability for Squad)"
    roles: [MeetDirector, MeetReferee, JudgePanelChief, Coach]
    code: 200
    input: ["limit?", "offset?"]
    output: Squad[]
    side_effects: []

  - method: GET
    path: "/api/v1/squads/{id}"
    description: "Get one Squad"
    roles: [MeetDirector, MeetReferee, JudgePanelChief, Coach]
    code: 200
    input: []
    output: Squad
    side_effects: []

  - method: GET
    path: "/api/v1/squads/{id}/athlete-entries"
    description: "List athlete entries assigned to a squad (sub-resource reverse-reachability for AthleteEntry.squad_id)"
    roles: [MeetDirector, MeetReferee, JudgePanelChief, Coach]
    code: 200
    input: ["limit?", "offset?"]
    output: AthleteEntry[]
    side_effects: []

  - method: POST
    path: "/api/v1/sessions/{id}/assign-squads"
    description: "Run squad_assignment selector to distribute REGISTERED AthleteEntry rows across Squads"
    roles: [MeetDirector]
    code: 200
    input: []
    output: Squad[]
    side_effects: ["executes squad_assignment calculation", "updates AthleteEntry.squad_id", "updates Squad.athlete_count"]

  # --- Gymnast ---
  - method: POST
    path: "/api/v1/gymnasts"
    description: "Register a Gymnast (master record)"
    roles: [MeetDirector]
    code: 201
    input: [usag_member_number, legal_name, date_of_birth, competitive_level, home_gym]
    output: Gymnast
    side_effects: []

  - method: GET
    path: "/api/v1/gymnasts"
    description: "List gymnasts"
    roles: [MeetDirector, MeetReferee, Coach]
    code: 200
    input: ["limit?", "offset?", "competitive_level?", "home_gym?"]
    output: Gymnast[]
    side_effects: []

  - method: GET
    path: "/api/v1/gymnasts/{id}"
    description: "Get one Gymnast"
    roles: [MeetDirector, MeetReferee, Coach]
    code: 200
    input: []
