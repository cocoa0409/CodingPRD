          CONFIRMED with confirmed_at stamped from the LOGICAL clock (2026-08-01T00:00:00Z, not wall
          time) and consumed_window_id filled, while the room shows the recomputed subtotal 600000, tier
          TIER_1 and burn 800000.
        test_recipe:
