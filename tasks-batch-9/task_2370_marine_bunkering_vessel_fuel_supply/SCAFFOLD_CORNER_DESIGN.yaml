scaffold_corner_design:
  - section: entities
    instances:
      - name: port_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Port
          - endpoints["POST /ports"]
          - response_envelope
        distinguishing_aspect: "A fully specified Port create returns 201 with every declared field echoed inside the success envelope, including the operator-supplied eca_sulfur_limit_pct 0.100 and spill_response_tier TIER_1."
        test_recipe:
          setup:
            - "Empty database, logical clock set to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsCoordinator
          trigger:
            - call: "POST /ports"
              payload: { port_code: "NLRTM", name: "Rotterdam", eca_zone: true, eca_sulfur_limit_pct: 0.100, notice_lead_hours: 24, concurrent_ops_capacity: 2, spill_response_tier: "TIER_1" }
              as: OpsCoordinator
              captures: { port_id: $.data.id }
          assert:
            - "HTTP 201 and the body is the success envelope with a single data object"
            - "Port.${port_id}.port_code == NLRTM, name == Rotterdam, eca_zone == true"
            - "Port.${port_id}.eca_sulfur_limit_pct == 0.100, notice_lead_hours == 24, concurrent_ops_capacity == 2, spill_response_tier == TIER_1"
            - "Port.${port_id}.id, created_at, updated_at and version are all present, with version == 1 and created_at == 2026-08-01T00:00:00Z"

      - name: port_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.Port.fields.eca_zone
          - entities.Port.fields.eca_sulfur_limit_pct
          - entities.Port.fields.notice_lead_hours
          - entities.Port.fields.concurrent_ops_capacity
          - entities.Port.fields.spill_response_tier
        distinguishing_aspect: "Omitting all five optional Port inputs must apply the declared defaults exactly - eca_zone false, eca_sulfur_limit_pct 0.10, notice_lead_hours 24, concurrent_ops_capacity 2, spill_response_tier TIER_2 - rather than nulls."
        test_recipe:
          setup:
            - "Empty database, logical clock set to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsCoordinator
          trigger:
            - call: "POST /ports"
              payload: { port_code: "SGSIN", name: "Singapore" }
              as: OpsCoordinator
              captures: { port_id: $.data.id }
          assert:
            - "Port.${port_id}.eca_zone == false"
            - "Port.${port_id}.eca_sulfur_limit_pct == 0.10"
            - "Port.${port_id}.notice_lead_hours == 24"
            - "Port.${port_id}.concurrent_ops_capacity == 2"
            - "Port.${port_id}.spill_response_tier == TIER_2"

      - name: fuel_grade_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints["GET /fuel-grades/{id}"]
          - entities.FuelGrade
        distinguishing_aspect: "A GET by id returns the FuelGrade exactly as stored, including the 3dp max_sulfur_pct 0.100 and the DISTILLATE contamination group, with no field dropped or re-derived."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, one fuel grade MGO-DMA registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsCoordinator
            - call: "POST /fuel-grades"
              payload: { grade_code: "MGO-DMA", max_sulfur_pct: 0.100, eca_permitted: true, test_tolerance_pct: 0.010, index_code: "MGO-ARA", base_barging_rate_usd_per_mt: 9.50, min_barging_fee_usd: 2000.00, cross_contamination_group: "DISTILLATE" }
              as: OpsCoordinator
              captures: { grade_id: $.data.id }
          trigger:
            - call: "GET /fuel-grades/${grade_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-001"
          assert:
            - "HTTP 200 with FuelGrade.${grade_id}.grade_code == MGO-DMA"
            - "FuelGrade.${grade_id}.max_sulfur_pct == 0.100, test_tolerance_pct == 0.010, eca_permitted == true"
            - "FuelGrade.${grade_id}.base_barging_rate_usd_per_mt == 9.50, min_barging_fee_usd == 2000.00, cross_contamination_group == DISTILLATE"

      - name: delivery_asset_listing_filters_and_paginates
        claim_type: listing
        grounds:
          - endpoints["GET /delivery-assets"]
          - entities.DeliveryAsset.fields.home_port_id
          - entities.DeliveryAsset.fields.asset_type
        distinguishing_aspect: "The asset list endpoint must combine the home_port_id and asset_type filters with limit/offset: of three barges at NLRTM plus one truck, a filtered page of limit 2 offset 1 returns exactly the second and third barge in created_at order and never the truck."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, port NLRTM registered"
            - "Three barges (Alpha, Bravo, Charlie) and one truck (Truck One) all homed at NLRTM, created in that order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsCoordinator
            - call: "POST /ports"
              payload: { port_code: "NLRTM", name: "Rotterdam", eca_zone: true }
              as: OpsCoordinator
              captures: { port_id: $.data.id }
            - call: "POST /delivery-assets"
              payload: { name: "Bunker Alpha", asset_type: "BARGE", capacity_mt: 3000.000, home_port_id: "${port_id}", boom_certified: true }
              as: OpsCoordinator
              captures: { asset_a_id: $.data.id }
            - call: "POST /delivery-assets"
              payload: { name: "Bunker Bravo", asset_type: "BARGE", capacity_mt: 2000.000, home_port_id: "${port_id}", boom_certified: true }
              as: OpsCoordinator
              captures: { asset_b_id: $.data.id }
            - call: "POST /delivery-assets"
              payload: { name: "Bunker Charlie", asset_type: "BARGE", capacity_mt: 1500.000, home_port_id: "${port_id}", boom_certified: false }
              as: OpsCoordinator
              captures: { asset_c_id: $.data.id }
            - call: "POST /delivery-assets"
              payload: { name: "Truck One", asset_type: "TRUCK", capacity_mt: 40.000, home_port_id: "${port_id}", boom_certified: true }
              as: OpsCoordinator
              captures: { truck_id: $.data.id }
          trigger:
            - call: "GET /delivery-assets"
              payload: { home_port_id: "${port_id}", asset_type: "BARGE", limit: 2, offset: 1 }
              as: OpsCoordinator
          assert:
            - "HTTP 200 and the list envelope reports total_count == 3 and has_more == false"
            - "The returned page contains exactly two rows, ${asset_b_id} then ${asset_c_id}, in created_at ascending order"
            - "${asset_a_id} is skipped by the offset and ${truck_id} is excluded by the asset_type filter"

      - name: nomination_not_found_returns_404
        claim_type: not_found
        grounds:
          - validations[priority 7].ERR_NOMINATION_NOT_FOUND
          - endpoints["GET /nominations/{id}"]
        distinguishing_aspect: "A GET for a syntactically valid but unknown nomination id must return 404 ERR_NOMINATION_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, no Nomination rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsCoordinator
          trigger:
            - call: "GET /nominations/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: OpsCoordinator
          assert:
            - "HTTP 404 with error_id ERR_NOMINATION_NOT_FOUND in the error envelope"

      - name: nomination_missing_required_vessel_imo_rejected
        claim_type: required_fields
        grounds:
          - validations[priority 16].ERR_INVALID_REQUEST
          - entities.Nomination.fields.vessel_imo
          - endpoints["POST /nominations"]
        distinguishing_aspect: "vessel_imo has source input with no default, so omitting it must fail with 422 ERR_INVALID_REQUEST before any business rule (ECA, window, credit) is evaluated, and no Nomination row is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; port NLRTM, grade MGO-DMA and customer Aegean Lines all registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsCoordinator
            - call: "POST /ports"
              payload: { port_code: "NLRTM", name: "Rotterdam", eca_zone: true, eca_sulfur_limit_pct: 0.100 }
              as: OpsCoordinator
              captures: { port_id: $.data.id }
            - call: "POST /fuel-grades"
              payload: { grade_code: "MGO-DMA", max_sulfur_pct: 0.100, eca_permitted: true, index_code: "MGO-ARA", base_barging_rate_usd_per_mt: 9.50, min_barging_fee_usd: 2000.00, cross_contamination_group: "DISTILLATE" }
              as: OpsCoordinator
              captures: { grade_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Aegean Lines", credit_limit_usd: 5000000.00 }
              as: CreditController
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /nominations"
              payload: { customer_id: "${cust_id}", port_id: "${port_id}", grade_id: "${grade_id}", vessel_name: "MV Anemos", nominated_quantity_mt: 1200.000, window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-11T06:00:00Z", delivery_mode: "BARGE", declared_sulfur_pct: 0.100, eca_documentation_ref: "CHG-2026-0001" }
              as: OpsCoordinator
          assert:
            - "HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "GET /nominations returns total_count == 0"

      - name: index_quote_system_fields_generated
        claim_type: system_fields
        grounds:
          - entities.IndexQuote
          - endpoints["POST /index-quotes"]
        distinguishing_aspect: "IndexQuote id and created_at are system-generated: created_at equals the logical clock 2026-08-01T00:00:00Z rather than the business quote_date 2026-08-03T00:00:00Z, and the two fields are independent."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, grade MGO-DMA registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsCoordinator
            - call: "POST /fuel-grades"
              payload: { grade_code: "MGO-DMA", max_sulfur_pct: 0.100, eca_permitted: true, index_code: "MGO-ARA", base_barging_rate_usd_per_mt: 9.50, min_barging_fee_usd: 2000.00, cross_contamination_group: "DISTILLATE" }
              as: OpsCoordinator
              captures: { grade_id: $.data.id }
          trigger:
            - call: "POST /index-quotes"
              payload: { grade_id: "${grade_id}", quote_date: "2026-08-03T00:00:00Z", price_usd_per_mt: 705.00 }
              as: OpsCoordinator
              captures: { quote_id: $.data.id }
          assert:
            - "HTTP 201 with IndexQuote.${quote_id}.id present and server-minted"
            - "IndexQuote.${quote_id}.created_at == 2026-08-01T00:00:00Z"
            - "IndexQuote.${quote_id}.quote_date == 2026-08-03T00:00:00Z and price_usd_per_mt == 705.00"
            - "IndexQuote.${quote_id}.source == PLATTS (declared default applied)"

      - name: index_quote_has_no_version_field_and_cannot_be_updated
        claim_type: immutability
        grounds:
          - entities.IndexQuote
          - endpoints["GET /fuel-grades/{id}/index-quotes"]
        distinguishing_aspect: "IndexQuote is declared with common_fields false, so it exposes no version and no updated_at and §1.5 offers no update or delete endpoint for it; correcting a quote is done by posting a later-created quote for the same date, not by mutation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, grade MGO-DMA with one quote of 705.00 for 2026-08-03"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsCoordinator
            - call: "POST /fuel-grades"
              payload: { grade_code: "MGO-DMA", max_sulfur_pct: 0.100, eca_permitted: true, index_code: "MGO-ARA", base_barging_rate_usd_per_mt: 9.50, min_barging_fee_usd: 2000.00, cross_contamination_group: "DISTILLATE" }
              as: OpsCoordinator
              captures: { grade_id: $.data.id }
            - call: "POST /index-quotes"
              payload: { grade_id: "${grade_id}", quote_date: "2026-08-03T00:00:00Z", price_usd_per_mt: 705.00 }
              as: OpsCoordinator
              captures: { quote_id: $.data.id }
          trigger:
            - call: "GET /fuel-grades/${grade_id}/index-quotes"
              payload: {}
              as: CreditController
              as_user_id: "cc-001"
          assert:
            - "HTTP 200 with exactly one IndexQuote row, ${quote_id}"
            - "The row carries id, grade_id, quote_date, price_usd_per_mt and source but NO version and NO updated_at field"
            - "No PATCH, PUT or DELETE endpoint for /index-quotes exists anywhere in the API surface"

      - name: fuel_grade_invalid_enum_contamination_group_rejected
        claim_type: type_constraints
        grounds:
          - entities.FuelGrade.fields.cross_contamination_group
          - validations[priority 16].ERR_INVALID_REQUEST
        distinguishing_aspect: "cross_contamination_group is constrained to DISTILLATE | RESIDUAL | BIOBLEND, so the out-of-enum value NAPHTHA must be rejected with 422 ERR_INVALID_REQUEST and not silently stored."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, no FuelGrade rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsCoordinator
          trigger:
            - call: "POST /fuel-grades"
              payload: { grade_code: "NAPH-01", max_sulfur_pct: 0.500, eca_permitted: false, index_code: "NAPH-ARA", base_barging_rate_usd_per_mt: 9.50, min_barging_fee_usd: 2000.00, cross_contamination_group: "NAPHTHA" }
              as: OpsCoordinator
          assert:
            - "HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "No FuelGrade row is persisted (a subsequent create with grade_code NAPH-01 and a legal group succeeds rather than colliding on ERR_DUPLICATE_REFERENCE_CODE)"

      - name: nomination_rejects_unknown_customer_parent
        claim_type: parent_relationships
        grounds:
          - validations[priority 5].ERR_CUSTOMER_NOT_FOUND
          - entities.Nomination.fields.customer_id
        distinguishing_aspect: "Nomination.customer_id is an FK to Customer.id, so an unknown customer must yield 404 ERR_CUSTOMER_NOT_FOUND from the existence tier (priority 5) even though every other payload field is valid."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; port NLRTM and grade MGO-DMA registered, no Customer rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsCoordinator
            - call: "POST /ports"
              payload: { port_code: "NLRTM", name: "Rotterdam", eca_zone: true, eca_sulfur_limit_pct: 0.100 }
              as: OpsCoordinator
              captures: { port_id: $.data.id }
            - call: "POST /fuel-grades"
              payload: { grade_code: "MGO-DMA", max_sulfur_pct: 0.100, eca_permitted: true, index_code: "MGO-ARA", base_barging_rate_usd_per_mt: 9.50, min_barging_fee_usd: 2000.00, cross_contamination_group: "DISTILLATE" }
              as: OpsCoordinator
              captures: { grade_id: $.data.id }
          trigger:
            - call: "POST /nominations"
              payload: { customer_id: "00000000-0000-0000-0000-0000000000ff", port_id: "${port_id}", grade_id: "${grade_id}", vessel_imo: "9123456", vessel_name: "MV Anemos", nominated_quantity_mt: 1200.000, window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-11T06:00:00Z", delivery_mode: "BARGE", declared_sulfur_pct: 0.100, eca_documentation_ref: "CHG-2026-0001" }
              as: OpsCoordinator
          assert:
            - "HTTP 404 with error_id ERR_CUSTOMER_NOT_FOUND"
            - "GET /nominations returns total_count == 0"

      - name: delivery_order_rejects_unknown_asset_reference
        claim_type: parent_relationships
        grounds:
          - validations[priority 6].ERR_ASSET_NOT_FOUND
          - entities.DeliveryOrder.fields.asset_id
          - complexity_profile.entity_topology
        distinguishing_aspect: "In this flat topology the DeliveryOrder create carries two independent FKs; with a valid nomination_id but an unknown asset_id the existence tier must answer 404 ERR_ASSET_NOT_FOUND, and the nomination must be left in CONFIRMED with its version unchanged (no partial write, no OCC bump)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; port NLRTM, grade MGO-DMA with quote 705.00, customer Aegean Lines"
            - "Nomination for 1200.000 mt with compliance APPROVED and fulfillment CONFIRMED; no DeliveryAsset rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: OpsCoordinator
            - call: "POST /ports"
              payload: { port_code: "NLRTM", name: "Rotterdam", eca_zone: true, eca_sulfur_limit_pct: 0.100, notice_lead_hours: 24, concurrent_ops_capacity: 2 }
              as: OpsCoordinator
              captures: { port_id: $.data.id }
            - call: "POST /fuel-grades"
              payload: { grade_code: "MGO-DMA", max_sulfur_pct: 0.100, eca_permitted: true, test_tolerance_pct: 0.010, index_code: "MGO-ARA", base_barging_rate_usd_per_mt: 9.50, min_barging_fee_usd: 2000.00, cross_contamination_group: "DISTILLATE" }
              as: OpsCoordinator
              captures: { grade_id: $.data.id }
            - call: "POST /index-quotes"
              payload: { grade_id: "${grade_id}", quote_date: "2026-08-03T00:00:00Z", price_usd_per_mt: 705.00 }
              as: OpsCoordinator
            - call: "POST /customers"
              payload: { name: "Aegean Lines", credit_limit_usd: 5000000.00 }
              as: CreditController
              captures: { cust_id: $.data.id }
            - call: "POST /nominations"
              payload: { customer_id: "${cust_id}", port_id: "${port_id}", grade_id: "${grade_id}", vessel_imo: "9123456", vessel_name: "MV Anemos", nominated_quantity_mt: 1200.000, window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-11T06:00:00Z", delivery_mode: "BARGE", declared_sulfur_pct: 0.100, eca_documentation_ref: "CHG-2026-0001" }
              as: OpsCoordinator
              captures: { nom_id: $.data.id }
            - call: "POST /nominations/${nom_id}/compliance-review"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "POST /nominations/${nom_id}/confirm"
              payload: {}
              as: OpsCoordinator
              captures: { nom_v: $.data.version }
          trigger:
            - call: "POST /delivery-orders"
              payload: { nomination_id: "${nom_id}", asset_id: "00000000-0000-0000-0000-0000000000ff", planned_quantity_mt: 1200.000, slot_start: "2026-08-10T06:00:00Z", slot_end: "2026-08-10T12:00:00Z", expected_nomination_version: "${nom_v}" }
              as: OpsCoordinator
          assert:
            - "HTTP 404 with error_id ERR_ASSET_NOT_FOUND"
            - "Nomination.${nom_id}.fulfillment_status == CONFIRMED and version == ${nom_v} (no OCC bump on a rejected write)"
            - "GET /delivery-orders returns total_count == 0"

      - name: bdn_computed_fields_derived_from_delivery_order
        claim_type: computed_fields
        grounds:
          - entities.BunkerDeliveryNote.fields.delivered_quantity_mt
          - entities.BunkerDeliveryNote.fields.sample_retention_until
          - entities.BunkerDeliveryNote.fields.sample_custody_status
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / bdn_issuance_blocked_until_measurement_agreed
          rationale: "That instance already asserts delivered_quantity_mt == 1191.850 copied from the order's agreed figure, sample_custody_status == RETAINED and sample_retention_until == 2026-11-08T14:30:00Z on the successful issuance."

  - section: state_machines
    instances:
      - name: nomination_starts_in_draft_and_pending_review
        claim_type: initial_state
        grounds:
          - state_machines.Nomination.fulfillment.initial_state
          - state_machines.Nomination.compliance.initial_state
        distinguishing_aspect: "A freshly created Nomination must occupy the initial state of BOTH parallel dimensions at once - fulfillment_status DRAFT and compliance_status PENDING_REVIEW - with compliance_reviewer_user_id null."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; port NLRTM (ECA), grade MGO-DMA, customer Aegean Lines registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsCoordinator
            - call: "POST /ports"
              payload: { port_code: "NLRTM", name: "Rotterdam", eca_zone: true, eca_sulfur_limit_pct: 0.100 }
              as: OpsCoordinator
              captures: { port_id: $.data.id }
            - call: "POST /fuel-grades"
              payload: { grade_code: "MGO-DMA", max_sulfur_pct: 0.100, eca_permitted: true, index_code: "MGO-ARA", base_barging_rate_usd_per_mt: 9.50, min_barging_fee_usd: 2000.00, cross_contamination_group: "DISTILLATE" }
              as: OpsCoordinator
              captures: { grade_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Aegean Lines", credit_limit_usd: 5000000.00 }
              as: CreditController
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /nominations"
              payload: { customer_id: "${cust_id}", port_id: "${port_id}", grade_id: "${grade_id}", vessel_imo: "9123456", vessel_name: "MV Anemos", nominated_quantity_mt: 1200.000, window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-11T06:00:00Z", delivery_mode: "BARGE", declared_sulfur_pct: 0.100, eca_documentation_ref: "CHG-2026-0001" }
              as: OpsCoordinator
              captures: { nom_id: $.data.id }
          assert:
            - "HTTP 201 with Nomination.${nom_id}.fulfillment_status == DRAFT"
            - "Nomination.${nom_id}.compliance_status == PENDING_REVIEW"
            - "Nomination.${nom_id}.compliance_reviewer_user_id == null and version == 1"
            - "Nomination.${nom_id}.scrubber_fitted == false (declared default)"

      - name: compliance_approve_records_reviewer_identity
        claim_type: valid_transition
        grounds:
          - state_machines.Nomination.PENDING_REVIEW_to_APPROVED
          - entities.Nomination.fields.compliance_reviewer_user_id
          - endpoints["POST /nominations/{id}/compliance-review"]
        distinguishing_aspect: "The APPROVE decision must move compliance_status PENDING_REVIEW -> APPROVED and persist the acting X-User-ID co-007 in compliance_reviewer_user_id, which is what the later segregation-of-duties check on BDN issuance reads."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; port NLRTM (ECA), grade MGO-DMA, customer Aegean Lines, one nomination in PENDING_REVIEW / DRAFT"
          setup_api_calls:
