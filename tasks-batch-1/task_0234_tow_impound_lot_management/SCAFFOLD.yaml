# =============================================================================
# Tow & Impound Lot Management — benchmark seed tables (Expert tier)
# §1.0–§1.7 only. Difficulty design (§1.8) and corner design (§1.9) live in
# their sibling files. Flat multi-root topology: peer collections referenced
# by foreign keys; api_prefix is "/" so every top-level collection is a peer.
# =============================================================================

scenario: |
  Tow & Impound Lot Management: tow intake (police/private/abandoned), daily
  storage-fee accrual, lienholder/owner notification, release authorization &
  fees, statutory-period auction, fee waiver/dispute, photo/inventory
  documentation, rotation list

domain_name: tow-impound-lot-management
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
    - selector_policy

  entity_topology: flat
  # Peer entities (ImpoundLot, TowProvider, Lienholder, TowOrder, Auction,
  # RotationAssignment) linked by FK; TowOrder owns append-only/child records
  # (Notification, InventoryItem, FeeWaiver, ReleaseRecord, StorageLedgerEntry)
  # exposed as sub-resources. No deep URL nesting between peers.

  state_machine_shape: cyclic
  # TowOrder carries a cyclic lifecycle (AUCTION_ELIGIBLE->STORED claim-back,
  # RELEASE_AUTHORIZED->STORED authorization lapse) plus a parallel hold_status
  # dimension; Notification / FeeWaiver / RotationAssignment are branching.

  relationship_patterns:
    - one_to_many        # ImpoundLot -> TowOrder; TowOrder -> Notification/InventoryItem/...
    - cross_aggregate    # TowOrder -> TowProvider, Lienholder, RotationAssignment, Auction
    - polymorphic        # Notification.recipient_type (OWNER | LIENHOLDER)

  role_model: peer_roles
  # LotOperator / PoliceOfficer / TowProvider / Claimant / AuctionOfficial each
  # own distinct operations; FeeWaiver decisioning is segregated from filing.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ImpoundLot
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Impound facility display name" }
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction / state code governing statutory rules (e.g. CA)" }
      - { name: daily_storage_rate_cents, type: integer, source: input, description: "Per-calendar-day storage rate applied to every TowOrder at this lot", constraints: "> 0" }
      - { name: admin_fee_cents, type: integer, source: input, description: "Flat administrative/processing fee charged once per TowOrder at release or auction", constraints: ">= 0" }
      - { name: lien_processing_fee_cents, type: integer, source: input, description: "Flat fee added when the order has a lienholder on record", constraints: ">= 0" }
      - { name: statutory_hold_days, type: integer, source: input, description: "Days a vehicle must be held (from intake) before it becomes auction-eligible", constraints: ">= 1" }
      - { name: notice_grace_days, type: integer, source: input, description: "Days after lienholder/owner notice delivery that must elapse before auction eligibility", constraints: ">= 0" }
      - { name: max_provider_concurrent_offers, type: integer, source: input, default: 2, description: "Capacity cap on the number of RotationAssignments in status OFFERED a single provider may hold at once for this lot", constraints: ">= 1" }
      - { name: rotation_cursor, type: integer, source: system, default: 0, description: "Index into the ordered rotation list pointing at the provider to offer next" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | SUSPENDED (SUSPENDED blocks new intake)", constraints: "OPEN | SUSPENDED" }

  - name: TowProvider
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Tow company display name" }
      - { name: license_number, type: string, source: input, description: "Operating license; unique across all providers" }
      - { name: rotation_rank, type: integer, source: input, description: "Ordering position in the rotation list; lower rank is offered first", constraints: ">= 1, unique among ACTIVE providers" }
      - { name: offers_received_count, type: integer, source: system, default: 0, description: "Cumulative count of rotation offers ever dispatched to this provider" }
      - { name: offers_accepted_count, type: integer, source: system, default: 0, description: "Cumulative count of rotation offers this provider ACCEPTED" }
      - { name: trailing_window_size, type: integer, source: input, default: 10, description: "Number of most-recent offers used by the TRAILING standing variant", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED (only ACTIVE may be offered rotation calls; SUSPENDED via suspend, restored via reinstate)", constraints: "ACTIVE | SUSPENDED" }
      - { name: raw_standing_pct, type: number, source: computed, description: "INSTANTANEOUS standing variant (see calculations.provider_standing)" }
      - { name: effective_standing_pct, type: number, source: computed, description: "TRAILING standing variant (see calculations.provider_standing)" }

  - name: Lienholder
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Lienholder legal name (bank / finance company)" }
      - { name: mailing_address, type: string, source: input, description: "Certified-mail address for statutory notices" }
      - { name: state_code, type: string, source: input, description: "Lienholder state of record" }

  - name: RotationAssignment
    parent: ImpoundLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> ImpoundLot.id; lot dispatching this rotation call" }
      - { name: provider_id, type: string, source: system, description: "FK -> TowProvider.id; provider the call was offered to (server-selected from rotation list)" }
      - { name: offered_at, type: datetime, source: system, description: "UTC instant the offer was dispatched (current clock)" }
      - { name: expires_at, type: datetime, source: system, description: "offered_at + offer_ttl_minutes; offer auto-EXPIRES past this instant" }
      - { name: offer_ttl_minutes, type: integer, source: input, default: 30, description: "Minutes the provider has to ACCEPT before the offer expires", constraints: ">= 1" }
      - { name: superseded_by_id, type: string, source: system, description: "Self-reference audit back-pointer to the RotationAssignment.id of the re-offer that replaced this DECLINED/EXPIRED offer (null if none); set by the re-offer cascade, not a discovery FK" }
      - { name: status, type: enum, source: system, default: "OFFERED", description: "OFFERED | ACCEPTED | DECLINED | EXPIRED | CANCELLED", constraints: "OFFERED | ACCEPTED | DECLINED | EXPIRED | CANCELLED" }

  - name: TowOrder
    parent: ImpoundLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> ImpoundLot.id; lot storing the vehicle" }
      - { name: provider_id, type: string, source: input, description: "FK -> TowProvider.id; provider that performed the tow (null for owner-arranged PRIVATE tows)" }
      - { name: rotation_assignment_id, type: string, source: input, description: "FK -> RotationAssignment.id; the ACCEPTED rotation call that produced this tow (null when not rotation-dispatched)" }
      - { name: lienholder_id, type: string, source: input, description: "FK -> Lienholder.id; recorded lienholder (null when vehicle is lien-free)" }
      - { name: auction_id, type: string, source: system, description: "FK -> Auction.id; the auction this order was swept into (null until AUCTIONED)" }
      - { name: tow_type, type: enum, source: input, description: "POLICE | PRIVATE | ABANDONED", constraints: "POLICE | PRIVATE | ABANDONED" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number" }
      - { name: plate, type: string, source: input, description: "License plate" }
      - { name: owner_name, type: string, source: input, description: "Registered owner name of record" }
      - { name: owner_address, type: string, source: input, description: "Registered owner mailing address for notices" }
      - { name: intake_at, type: datetime, source: system, description: "UTC instant the vehicle entered storage (current clock at create); day 0 of accrual" }
      - { name: stored_at, type: datetime, source: system, description: "UTC instant the order moved to STORED (accrual baseline)" }
      - { name: accrual_frozen_at, type: datetime, source: system, description: "UTC instant accrual was last frozen (set on AUCTION_ELIGIBLE / RELEASE_AUTHORIZED / AUCTIONED; cleared on revert to STORED)" }
      - { name: accrued_days, type: integer, source: computed, description: "Whole calendar days of storage counted by the ACCRUED variant up to the freeze point or current clock" }
      - { name: estimated_storage_cents, type: integer, source: computed, description: "ESTIMATE variant: daily_storage_rate_cents * statutory_hold_days, fixed at intake" }
      - { name: accrued_storage_cents, type: integer, source: computed, description: "ACCRUED variant: chronological day-by-day storage charge to date (see calculations.storage_fee_accrual)" }
      - { name: balance_due_cents, type: integer, source: computed, description: "Pre-waiver amount owed to release: accrued_storage + admin + lien fee (see calculations.release_fee_breakdown)" }
      - { name: waiver_credit_cents, type: integer, source: computed, description: "Approved fee-waiver credit applied against balance_due_cents (see calculations.waiver_credit)" }
      - { name: net_due_cents, type: integer, source: computed, description: "balance_due_cents - waiver_credit_cents, floored at 0" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Cumulative cents paid via ReleaseRecord" }
      - { name: hold_status, type: enum, source: system, default: "NONE", description: "Parallel dimension independent of status: NONE | POLICE_HOLD | EVIDENCE_HOLD; any non-NONE hold blocks release", constraints: "NONE | POLICE_HOLD | EVIDENCE_HOLD" }
      - { name: status, type: enum, source: system, default: "TOWED", description: "TOWED | STORED | RELEASE_AUTHORIZED | RELEASED | AUCTION_ELIGIBLE | AUCTIONED | VOIDED", constraints: "TOWED | STORED | RELEASE_AUTHORIZED | RELEASED | AUCTION_ELIGIBLE | AUCTIONED | VOIDED" }

  - name: Notification
    parent: TowOrder
    common_fields: true
    fields:
      - { name: tow_order_id, type: string, source: input, description: "FK -> TowOrder.id; order the notice concerns" }
      - { name: recipient_type, type: enum, source: input, description: "OWNER | LIENHOLDER", constraints: "OWNER | LIENHOLDER" }
      - { name: method, type: enum, source: input, description: "CERTIFIED_MAIL | PUBLICATION | EMAIL", constraints: "CERTIFIED_MAIL | PUBLICATION | EMAIL" }
      - { name: sent_at, type: datetime, source: system, description: "UTC instant the notice was SENT (current clock on send)" }
      - { name: resolved_at, type: datetime, source: system, description: "UTC instant the notice reached a terminal SENT-branch state (delivery clock start)" }
      - { name: republished_from_id, type: string, source: system, description: "Self-reference audit back-pointer to the Notification.id of the UNDELIVERABLE notice this republication replaces (null for first attempt); lineage metadata, not a discovery FK" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SENT | DELIVERY_CONFIRMED | CERTIFIED_RETURNED | UNDELIVERABLE", constraints: "DRAFT | SENT | DELIVERY_CONFIRMED | CERTIFIED_RETURNED | UNDELIVERABLE" }

  - name: InventoryItem
    parent: TowOrder
    common_fields: true
    fields:
      - { name: tow_order_id, type: string, source: input, description: "FK -> TowOrder.id; order whose contents are documented" }
      - { name: category, type: enum, source: input, description: "PERSONAL_PROPERTY | VEHICLE_DAMAGE | EXTERIOR_PHOTO", constraints: "PERSONAL_PROPERTY | VEHICLE_DAMAGE | EXTERIOR_PHOTO" }
      - { name: description, type: string, source: input, description: "Free-text item / photo description" }
      - { name: photo_ref, type: string, source: input, description: "Opaque storage reference for the documenting photo" }
      - { name: condition_note, type: string, source: input, description: "Condition annotation at intake" }

  - name: FeeWaiver
    parent: TowOrder
    common_fields: true
    fields:
      - { name: tow_order_id, type: string, source: input, description: "FK -> TowOrder.id; order whose fees are disputed/waived" }
      - { name: reason, type: enum, source: input, description: "WRONGFUL_TOW | HARDSHIP | LAW_ENFORCEMENT_ERROR | BILLING_DISPUTE", constraints: "WRONGFUL_TOW | HARDSHIP | LAW_ENFORCEMENT_ERROR | BILLING_DISPUTE" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Cents the claimant asks to be waived", constraints: "> 0" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "Cents actually waived after the tiered cap is applied (set on APPROVED)" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the LotOperator who decided (segregation: must differ from filer)" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the Claimant who filed" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | UNDER_REVIEW | APPROVED | DENIED | WITHDRAWN", constraints: "REQUESTED | UNDER_REVIEW | APPROVED | DENIED | WITHDRAWN" }

  - name: ReleaseRecord
    parent: TowOrder
    common_fields: true
    fields:
      - { name: tow_order_id, type: string, source: input, description: "FK -> TowOrder.id; order being released" }
      - { name: amount_paid_cents, type: integer, source: input, description: "Cents tendered for this release", constraints: ">= 0" }
      - { name: released_to_name, type: string, source: input, description: "Name of person taking possession" }
      - { name: authorized_at, type: datetime, source: system, description: "UTC instant release was authorized (current clock)" }

  - name: Auction
    parent: ImpoundLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> ImpoundLot.id; lot conducting the auction" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled auction window start (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled auction window end (UTC); must be > window_start" }
      - { name: gross_proceeds_cents, type: integer, source: system, default: 0, description: "Sum of recorded sale prices across all swept orders" }
      - { name: distributed_cents, type: integer, source: computed, description: "Sum of storage+admin+lien recovered across sold orders (see calculations.auction_proceeds_distribution)" }
      - { name: lien_payoff_cents, type: integer, source: computed, description: "Total paid to lienholders across sold orders" }
      - { name: surplus_to_owner_cents, type: integer, source: computed, description: "Residual returned to owners across sold orders" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | OPEN | SETTLED | CANCELLED", constraints: "SCHEDULED | OPEN | SETTLED | CANCELLED" }

  - name: StorageLedgerEntry
    parent: TowOrder
    common_fields: false
    fields:
      - { name: tow_order_id, type: string, source: input, description: "FK -> TowOrder.id; order this accrual segment belongs to" }
      - { name: segment_start, type: datetime, source: system, description: "UTC start of this continuous accrual segment" }
      - { name: segment_end, type: datetime, source: system, description: "UTC end of this segment (freeze instant)" }
      - { name: days_counted, type: integer, source: system, description: "Whole calendar days charged in this segment (ceil of fractional day)" }
      - { name: segment_charge_cents, type: integer, source: system, description: "days_counted * lot.daily_storage_rate_cents for this segment" }
      - { name: kind, type: enum, source: system, description: "ACCRUAL | FREEZE | RESUME | SETTLEMENT", constraints: "ACCRUAL | FREEZE | RESUME | SETTLEMENT" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TowOrder
    initial_state: TOWED
    terminal_states: [RELEASED, AUCTIONED, VOIDED]
    note: |
      Two independent dimensions on one row. (1) status (lifecycle below).
      (2) hold_status (NONE | POLICE_HOLD | EVIDENCE_HOLD) — placed/lifted by
      PoliceOfficer independent of status; any non-NONE hold blocks the
      STORED->RELEASE_AUTHORIZED transition. Lifecycle is cyclic:
      AUCTION_ELIGIBLE->STORED and RELEASE_AUTHORIZED->STORED both loop back.
    transitions:
      - from: TOWED
        to: STORED
        trigger: "POST /tow-orders/{id}/store"
        actor: LotOperator
        preconditions:
          - "TowOrder.status == TOWED (else ERR_INVALID_STATE)"
          - "At least one InventoryItem exists for the order (intake documentation, else ERR_INVENTORY_REQUIRED)"
        side_effects:
          - "stored_at = current clock; intake_at unchanged"
          - "Open the first StorageLedgerEntry (kind=ACCRUAL, segment_start=stored_at, segment_end=null)"
          - "Recompute accrued_storage_cents, balance_due_cents, net_due_cents"

      - from: STORED
        to: RELEASE_AUTHORIZED
        trigger: "POST /tow-orders/{id}/authorize-release"
        actor: LotOperator
        preconditions:
          - "TowOrder.status == STORED (else ERR_INVALID_STATE)"
          - "hold_status == NONE (cross-dimension; else ERR_HOLD_ACTIVE)"
          - "No FeeWaiver for this order in status REQUESTED or UNDER_REVIEW (else ERR_WAIVER_PENDING)"
          - "amount_paid_cents >= net_due_cents (fees satisfied; else ERR_BALANCE_UNPAID)"
        side_effects:
          - "Freeze accrual: close current StorageLedgerEntry (segment_end=current clock, kind=FREEZE), set accrual_frozen_at"
          - "Recompute accrued_storage_cents / balance_due_cents (final at freeze instant)"

      - from: RELEASE_AUTHORIZED
        to: RELEASED
        trigger: "POST /tow-orders/{id}/release-records"
        actor: LotOperator
        preconditions:
          - "TowOrder.status == RELEASE_AUTHORIZED (else ERR_INVALID_STATE)"
          - "hold_status == NONE (else ERR_HOLD_ACTIVE)"
        side_effects:
          - "Create ReleaseRecord; status -> RELEASED (terminal)"

      - from: RELEASE_AUTHORIZED
        to: STORED
        trigger: "POST /tow-orders/{id}/lapse-authorization"
        actor: LotOperator
        preconditions:
          - "TowOrder.status == RELEASE_AUTHORIZED (else ERR_INVALID_STATE)"
        side_effects:
          - "Resume accrual: open new StorageLedgerEntry (kind=RESUME, segment_start=current clock); clear accrual_frozen_at"
          - "Compensating invariant: accrued_days continues from frozen value; no day double-counted across the FREEZE/RESUME boundary"

      - from: STORED
        to: AUCTION_ELIGIBLE
        trigger: "POST /tow-orders/{id}/mark-auction-eligible"
        actor: LotOperator
        preconditions:
          - "TowOrder.status == STORED (else ERR_INVALID_STATE)"
          - "hold_status == NONE (else ERR_HOLD_ACTIVE)"
          - "calculations.statutory_eligibility == true (statutory_hold_days elapsed AND a qualifying delivered/published Notification grace window elapsed; else ERR_STATUTORY_PERIOD_NOT_ELAPSED)"
        side_effects:
          - "Freeze accrual: close current StorageLedgerEntry (segment_end=current clock, kind=FREEZE), set accrual_frozen_at"

      - from: AUCTION_ELIGIBLE
        to: STORED
        trigger: "POST /tow-orders/{id}/reclaim"
        actor: LotOperator
        preconditions:
          - "TowOrder.status == AUCTION_ELIGIBLE (else ERR_INVALID_STATE)"
          - "auction_id == null (not yet swept into an OPEN/SETTLED auction; else ERR_ALREADY_IN_AUCTION)"
        side_effects:
          - "Resume accrual: open new StorageLedgerEntry (kind=RESUME, segment_start=current clock); clear accrual_frozen_at"
          - "Compensating invariant: accrued_days continues from frozen value; no day double-counted"

      - from: AUCTION_ELIGIBLE
        to: AUCTIONED
        trigger: "POST /auctions/{id}/record-sale (system, per swept order)"
        actor: AuctionOfficial
        preconditions:
          - "TowOrder.status == AUCTION_ELIGIBLE (else ERR_INVALID_STATE)"
          - "TowOrder.auction_id == the auction id (must be swept into this OPEN auction; else ERR_NOT_IN_AUCTION)"
          - "hold_status == NONE (else ERR_HOLD_ACTIVE)"
        side_effects:
          - "status -> AUCTIONED (terminal)"
          - "Write SETTLEMENT StorageLedgerEntry finalizing accrued_storage_cents"
          - "Cascade: Auction.gross_proceeds_cents += sale_price; recompute distribution waterfall (distributed/lien_payoff/surplus)"

      - from: TOWED
        to: VOIDED
        trigger: "POST /tow-orders/{id}/void"
        actor: PoliceOfficer
        preconditions:
          - "TowOrder.status IN {TOWED, STORED} (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> VOIDED (terminal); zero all fee accrual; close open StorageLedgerEntry"

      - from: STORED
        to: VOIDED
        trigger: "POST /tow-orders/{id}/void"
        actor: PoliceOfficer
        preconditions:
          - "TowOrder.status IN {TOWED, STORED} (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> VOIDED (terminal); zero all fee accrual; close open StorageLedgerEntry"

      # --- parallel hold_status dimension (independent of status) ---
      - from: "hold_status=NONE"
        to: "hold_status=POLICE_HOLD"
        trigger: "POST /tow-orders/{id}/place-hold"
        actor: PoliceOfficer
        preconditions:
          - "TowOrder.status NOT IN {RELEASED, AUCTIONED, VOIDED} (else ERR_INVALID_STATE)"
          - "hold_status == NONE (else ERR_HOLD_ACTIVE)"
        side_effects:
          - "hold_status -> POLICE_HOLD or EVIDENCE_HOLD per request; blocks release/auction transitions"

      - from: "hold_status=POLICE_HOLD"
        to: "hold_status=NONE"
        trigger: "POST /tow-orders/{id}/lift-hold"
        actor: PoliceOfficer
        preconditions:
          - "hold_status != NONE (else ERR_NO_HOLD)"
        side_effects:
          - "hold_status -> NONE; status-dimension transitions become available again"

  - entity: Notification
    initial_state: DRAFT
    terminal_states: [DELIVERY_CONFIRMED, CERTIFIED_RETURNED]
    note: "Branching: SENT forks to {DELIVERY_CONFIRMED, CERTIFIED_RETURNED, UNDELIVERABLE} with divergent side-effects; UNDELIVERABLE is a non-terminal dead-end requiring republication."
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /tow-orders/{id}/notifications/{nid}/send"
        actor: LotOperator
        preconditions:
          - "Notification.status == DRAFT (else ERR_INVALID_STATE)"
          - "If recipient_type==LIENHOLDER, parent TowOrder.lienholder_id != null (else ERR_NO_LIENHOLDER)"
        side_effects:
          - "sent_at = current clock"

      - from: SENT
        to: DELIVERY_CONFIRMED
        trigger: "POST /tow-orders/{id}/notifications/{nid}/confirm-delivery"
        actor: LotOperator
        preconditions:
          - "Notification.status == SENT (else ERR_INVALID_STATE)"
        side_effects:
          - "resolved_at = current clock (starts notice_grace_days clock on the TowOrder)"
          - "Recompute TowOrder statutory_eligibility"

      - from: SENT
        to: CERTIFIED_RETURNED
        trigger: "POST /tow-orders/{id}/notifications/{nid}/mark-returned"
        actor: LotOperator
        preconditions:
          - "Notification.status == SENT (else ERR_INVALID_STATE)"
          - "method == CERTIFIED_MAIL (else ERR_METHOD_NOT_CERTIFIED)"
        side_effects:
          - "resolved_at = current clock; CERTIFIED_RETURNED counts as constructive delivery and starts notice_grace_days clock"
          - "Recompute TowOrder statutory_eligibility"

      - from: SENT
        to: UNDELIVERABLE
        trigger: "POST /tow-orders/{id}/notifications/{nid}/mark-undeliverable"
        actor: LotOperator
        preconditions:
          - "Notification.status == SENT (else ERR_INVALID_STATE)"
        side_effects:
          - "resolved_at = current clock; does NOT start the grace clock (statutory_eligibility unaffected); requires republication via PUBLICATION method"

  - entity: FeeWaiver
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    note: "Branching with segregation of duties: filer (Claimant) and decider (LotOperator) must be different users."
    transitions:
      - from: REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /tow-orders/{id}/fee-waivers/{wid}/start-review"
        actor: LotOperator
        preconditions:
          - "FeeWaiver.status == REQUESTED (else ERR_INVALID_STATE)"
        side_effects:
          - "Records reviewer start"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /tow-orders/{id}/fee-waivers/{wid}/approve"
        actor: LotOperator
        preconditions:
          - "FeeWaiver.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "X-User-ID != filed_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_amount_cents = min(requested_amount_cents, tiered waiver cap) per calculations.waiver_credit"
          - "Cascade: TowOrder.waiver_credit_cents += approved_amount_cents; recompute net_due_cents"
          - "decided_by_user_id = X-User-ID"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /tow-orders/{id}/fee-waivers/{wid}/deny"
        actor: LotOperator
        preconditions:
          - "FeeWaiver.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "X-User-ID != filed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id = X-User-ID; no balance change"

      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /tow-orders/{id}/fee-waivers/{wid}/withdraw"
        actor: Claimant
        preconditions:
          - "FeeWaiver.status == REQUESTED (else ERR_INVALID_STATE)"
          - "X-User-ID == filed_by_user_id (only filer may withdraw; else ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []

  - entity: RotationAssignment
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, CANCELLED]
    note: "Branching: OFFERED forks to {ACCEPTED, DECLINED, EXPIRED, CANCELLED}; DECLINED/EXPIRED cascade a re-offer to the next provider."
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /rotation-assignments/{id}/accept"
        actor: TowProvider
        preconditions:
          - "RotationAssignment.status == OFFERED (else ERR_INVALID_STATE)"
          - "X-User-ID == provider_id (only the offered provider may accept; else ERR_FORBIDDEN_FOR_ROLE)"
          - "current clock <= expires_at (else ERR_OFFER_EXPIRED)"
          - "TowProvider.status == ACTIVE (cross-entity; else ERR_PROVIDER_NOT_ACTIVE)"
        side_effects:
          - "offers_accepted_count += 1 on the provider; recompute provider standing variants"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /rotation-assignments/{id}/decline"
        actor: TowProvider
        preconditions:
          - "RotationAssignment.status == OFFERED (else ERR_INVALID_STATE)"
          - "X-User-ID == provider_id (else ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "Cascade hop 1: this assignment -> DECLINED"
          - "Cascade hop 2: server advances lot.rotation_cursor and dispatches a new RotationAssignment (OFFERED) to the next ACTIVE provider; superseded_by_id set on this row"
          - "Cascade hop 3: next provider.offers_received_count += 1; recompute that provider's standing"

      - from: OFFERED
        to: EXPIRED
        trigger: "POST /rotation-assignments/{id}/expire (clock past expires_at)"
        actor: LotOperator
        preconditions:
          - "RotationAssignment.status == OFFERED (else ERR_INVALID_STATE)"
          - "current clock > expires_at (else ERR_OFFER_NOT_EXPIRED)"
        side_effects:
          - "this assignment -> EXPIRED; re-offer cascade identical to DECLINE (advance cursor, dispatch next, bump next provider counter)"

      - from: OFFERED
        to: CANCELLED
        trigger: "POST /rotation-assignments/{id}/cancel"
        actor: LotOperator
        preconditions:
          - "RotationAssignment.status == OFFERED (else ERR_INVALID_STATE)"
        side_effects:
          - "this assignment -> CANCELLED; no re-offer dispatched"

  - entity: Auction
    initial_state: SCHEDULED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /auctions/{id}/open"
        actor: AuctionOfficial
        preconditions:
          - "Auction.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "current clock >= window_start (else ERR_AUCTION_WINDOW_NOT_STARTED)"
        side_effects:
          - "status -> OPEN; sale recording enabled"

      - from: OPEN
        to: SETTLED
        trigger: "POST /auctions/{id}/settle"
        actor: AuctionOfficial
        preconditions:
          - "Auction.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> SETTLED (terminal); finalize distribution waterfall"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /auctions/{id}/cancel"
        actor: AuctionOfficial
        preconditions:
          - "Auction.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> CANCELLED; unlink any swept orders (auction_id -> null, orders stay AUCTION_ELIGIBLE)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC — true CREATE-with-supersede race only)
# =============================================================================
concurrency_rules:
  - rule_id: rotation-dispatch-stale-lot
    parent_entity: ImpoundLot
    write_endpoint: "POST /impound-lots/{id}/dispatch-rotation"
    occ_field: "expected_lot_version"
    description: |
      Dispatching a rotation call advances the lot's rotation_cursor and mints
      a new RotationAssignment for the next provider. A dispatch carrying a lot
      version older than the lot's current version is rejected: another dispatch
      has already advanced the cursor and minted the next offer, so this caller's
      view of which provider is "next" is stale and would double-offer the slot.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: storage_fee_accrual
    trigger: "TowOrder store / authorize-release / mark-auction-eligible / reclaim / lapse-authorization; and any computed read of accrued_storage_cents"
    algorithm: chronological
    formula: |
      # ACCRUED variant (chronological, day-by-day; pinned day boundary):
      # accrual runs over concatenated StorageLedgerEntry segments
      # (kind in {ACCRUAL, RESUME}, plus the open segment to current clock).
      # For each segment:
      #   raw_hours = (segment_end_or_now - segment_start) in hours
      #   days_counted = ceil(raw_hours / 24)        # any started day is a full day
      #   segment_charge = days_counted * lot.daily_storage_rate_cents
      # accrued_days       = sum(days_counted over all segments)
      # accrued_storage_cents = sum(segment_charge over all segments)
      # Day boundary is '>' on hours: exactly 24.0 hours == 1 day (not 2);
      #   24.0h -> ceil(24/24)=1; 24.01h -> ceil=2.
    input_set: "All StorageLedgerEntry segments for the order with kind in {ACCRUAL, RESUME}; the currently-open segment counts to accrual_frozen_at if frozen, else current clock."
    constants: {}
    precision: "integer cents; days via ceil(hours/24)"
    variants:
      - name: ESTIMATE
        when: "Set once at intake; shown as estimated_storage_cents"
        difference: "Forward-looking projection = daily_storage_rate_cents * lot.statutory_hold_days, ignores actual elapsed time; never re-counted day-by-day."
      - name: ACCRUED
        when: "Used at release / auction / any balance read; shown as accrued_storage_cents"
        difference: "Chronological per-segment day count to the freeze instant (or current clock). Identical inputs yield a different number than ESTIMATE whenever actual days != statutory_hold_days."

  - name: provider_standing
    trigger: "RotationAssignment accept / decline / expire (provider counters change)"
    algorithm: weighted_scoring
    formula: |
      # RAW (INSTANTANEOUS) variant -> raw_standing_pct:
      #   raw = (offers_accepted_count / offers_received_count) * 100, round_half_up 2 dp
      #   if offers_received_count == 0 -> raw = 100.00
      # EFFECTIVE (TRAILING) variant -> effective_standing_pct:
      #   consider only the most recent trailing_window_size RotationAssignments
      #   offered to this provider, ordered by offered_at ASC then created_at ASC;
      #   eff = (accepted_in_window / offered_in_window) * 100, round_half_up 2 dp
      #   if SUSPENDED, subtract SUSPENSION_PENALTY_PCT, floor at 0.00
    input_set: "RotationAssignments where provider_id == provider.id; RAW over all-time counters, EFFECTIVE over the trailing window."
    constants:
      SUSPENSION_PENALTY_PCT: 20.0
    precision: "percentage, 2 decimal places, round_half_up; floor 0.00 ceil 100.00"
    variants:
      - name: RAW
        when: "All-time standing (raw_standing_pct)"
        difference: "Uses cumulative all-time counters, no window."
      - name: EFFECTIVE
        when: "Eligibility gate (effective_standing_pct)"
        difference: "Window-limited + suspension penalty; diverges from RAW once history exceeds the window or provider is SUSPENDED."

  - name: release_fee_breakdown
    trigger: "Any read of balance_due_cents; finalized on authorize-release"
    algorithm: aggregation
    formula: |
      # Per-component rounding then sum (PINNED ORDER — round each component to
      # whole cents independently, THEN add; do NOT sum-then-round):
      #   c_storage = accrued_storage_cents                      # already whole cents
      #   c_admin   = lot.admin_fee_cents                        # whole cents
      #   c_lien    = (lienholder_id != null) ? lot.lien_processing_fee_cents : 0
      #   balance_due_cents = c_storage + c_admin + c_lien
      # Each component is independently whole-cent; the pinned order guarantees
      # the same total regardless of evaluator, and is the contract for tests.
    input_set: "The TowOrder plus its parent ImpoundLot fee fields; lien fee gated on lienholder_id presence."
    constants: {}
    precision: "integer cents; per-component round then sum"

  - name: waiver_credit
    trigger: "FeeWaiver approve"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency resolved by a PINNED evaluation order:
      # the waiver cap is a percentage of balance_due_cents, but the tier
      # (which percentage) is itself keyed on balance_due_cents. Order:
      #   1. pre_waiver_balance = balance_due_cents   (release_fee_breakdown, pre-waiver)
      #   2. tier selection on pre_waiver_balance:
      #        balance <  TIER1_CENTS (50000)   -> cap_pct = 100  (full waiver allowed)
      #        TIER1 <= balance < TIER2 (150000) -> cap_pct = 50
      #        balance >= TIER2_CENTS (150000)   -> cap_pct = 25
      #   3. cap_cents = floor(pre_waiver_balance * cap_pct / 100)
      #   4. approved_amount_cents = min(requested_amount_cents, cap_cents)
      # Evaluation order is fixed so the value is well-defined (tier from the
      # pre-waiver balance, never from the post-waiver balance).
    input_set: "The approving FeeWaiver, its TowOrder pre-waiver balance_due_cents."
    constants:
      TIER1_CENTS: 50000
      TIER2_CENTS: 150000
    precision: "integer cents; floor on cap, min against request"

  - name: statutory_eligibility
    trigger: "mark-auction-eligible precondition; Notification confirm-delivery / mark-returned"
    algorithm: threshold
    formula: |
      # Boolean gate. Eligible iff BOTH:
      #   (1) hold_days_elapsed: (current_clock - intake_at) in days  >= lot.statutory_hold_days
      #       using ceil(hours/24) day count, '>=' boundary (exactly N days qualifies).
      #   (2) notice_grace_elapsed: there EXISTS a Notification on the order with
      #       status in {DELIVERY_CONFIRMED, CERTIFIED_RETURNED} whose
      #       (current_clock - resolved_at) in days >= lot.notice_grace_days.
      #       UNDELIVERABLE and SENT notices do NOT satisfy (2).
    input_set: "The TowOrder, its parent lot's statutory_hold_days / notice_grace_days, and all child Notifications."
    constants: {}
    precision: "whole-day comparison via ceil(hours/24); '>=' boundary on both clocks"

  - name: auction_proceeds_distribution
    trigger: "auctions/{id}/record-sale; auctions/{id}/settle"
    algorithm: waterfall_allocation
    formula: |
      # Per sold order, distribute sale_price_cents across ordered buckets
      # (waterfall; remainder cascades to the next bucket):
      #   1. lot recovery  = min(sale_price, accrued_storage_cents + admin_fee_cents)
      #   2. lien payoff   = min(remaining, lot.lien_processing_fee_cents if lienholder else 0)
      #   3. surplus_to_owner = remaining after buckets 1-2 (floored at 0)
      # Conservation invariant (Rule 9): for every sold order,
      #   sale_price_cents == lot_recovery + lien_payoff + surplus_to_owner.
      # Auction aggregates: gross_proceeds_cents = sum(sale_price);
      #   distributed_cents = sum(lot_recovery); lien_payoff_cents = sum(lien payoff);
      #   surplus_to_owner_cents = sum(surplus). Order of orders: created_at ASC.
    input_set: "Sold TowOrders (status AUCTIONED) linked to the auction; each with its accrued_storage_cents, admin fee, lien fee."
    constants: {}
    precision: "integer cents; waterfall, no rounding (whole-cent inputs)"

  - name: rotation_selection
    trigger: "POST /impound-lots/{id}/dispatch-rotation; decline/expire re-offer cascade"
    algorithm: forward_looking
    formula: |
      # Selector policy (deterministic, no random fields):
      #   candidate set: TowProviders with status == ACTIVE for this lot whose
      #     count of OFFERED RotationAssignments < lot.max_provider_concurrent_offers.
      #   ranking: rotation_rank ASC starting from lot.rotation_cursor (cyclic scan
      #     over the rank-ordered list); first eligible provider at/after the cursor.
      #   tie-break: rotation_rank is unique among ACTIVE providers, so no tie; if
      #     two share a rank due to data, created_at ASC (never id).
      #   empty set: no eligible provider -> ERR_NO_ELIGIBLE_PROVIDER (deferred, no offer).
    input_set: "ACTIVE TowProviders ordered by rotation_rank; lot.rotation_cursor; each provider's OFFERED assignment count."
    constants: {}
    precision: "exact integer rank comparison; cursor advances by 1 (mod list length) per dispatch"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right in path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, amounts non-negative where required, window_end > window_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: business_referential
    check: "Stated FK ids resolve and are mutually consistent (e.g. rotation_assignment_id's provider_id matches provider_id; lienholder exists)"
    error_id: ERR_REFERENCE_MISMATCH
    http_status: 409
    applies_to: "POST /tow-orders, notification send, dispatch-rotation"

  - priority: 6
    category: state
    check: "Target resource in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_safety
    check: "Segregation of duties: FeeWaiver decider (approve/deny) X-User-ID must differ from filed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "fee-waiver approve / deny"

  - priority: 8
    category: business_safety
    check: "Active hold (POLICE_HOLD / EVIDENCE_HOLD) blocks release authorization, release, and auction sale"
    error_id: ERR_HOLD_ACTIVE
    http_status: 409
    applies_to: "authorize-release, release-records, mark-auction-eligible, record-sale"

  - priority: 9
    category: business_temporal
    check: "Statutory hold period AND notice grace window must both have elapsed before auction eligibility"
    error_id: ERR_STATUTORY_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "mark-auction-eligible"

  - priority: 10
    category: business_temporal
    check: "Rotation offer accept only while current clock <= expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "rotation-assignments accept"

  - priority: 11
    category: business_constraint
    check: "A pending FeeWaiver (REQUESTED / UNDER_REVIEW) blocks release authorization"
    error_id: ERR_WAIVER_PENDING
    http_status: 409
    applies_to: "authorize-release"

  - priority: 12
    category: business_fiscal
    check: "amount_paid_cents must cover net_due_cents before release authorization"
    error_id: ERR_BALANCE_UNPAID
    http_status: 409
    applies_to: "authorize-release"

  - priority: 13
    category: business_constraint
    check: "Lot must be OPEN (not SUSPENDED) to accept new TowOrder intake"
    error_id: ERR_LOT_SUSPENDED
    http_status: 409
    applies_to: "POST /tow-orders"

  - priority: 14
    category: business_temporal
    check: "Two auctions on the same lot must not have overlapping [window_start, window_end] intervals"
    error_id: ERR_AUCTION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /auctions"

  - priority: 15
    category: concurrency
    check: "dispatch-rotation expected_lot_version must equal current ImpoundLot.version"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "dispatch-rotation"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------- ImpoundLot ----------------
  - method: POST
    path: "/impound-lots"
    description: "Create an impound lot"
    roles: [LotOperator]
    code: 201
    input: [name, jurisdiction_code, daily_storage_rate_cents, admin_fee_cents, lien_processing_fee_cents, statutory_hold_days, notice_grace_days, "max_provider_concurrent_offers?"]
    output: ImpoundLot
    side_effects: ["status=OPEN, rotation_cursor=0, version=1"]

  - method: GET
    path: "/impound-lots/{id}"
    description: "Get an impound lot"
    roles: [LotOperator, PoliceOfficer, TowProvider, Claimant, AuctionOfficial]
    code: 200
    input: []
    output: ImpoundLot
    side_effects: []

  - method: POST
    path: "/impound-lots/{id}/suspend"
    description: "Suspend a lot (blocks new intake)"
    roles: [LotOperator]
    code: 200
    input: ["expected_lot_version"]
    output: ImpoundLot
    side_effects: ["status -> SUSPENDED", "increments ImpoundLot.version by 1"]

  - method: POST
    path: "/impound-lots/{id}/dispatch-rotation"
    description: "Dispatch the next rotation call: select next ACTIVE provider, mint an OFFERED RotationAssignment, advance rotation_cursor"
    roles: [LotOperator]
    code: 201
    input: ["expected_lot_version", "offer_ttl_minutes?"]
    output: RotationAssignment
    side_effects:
      - "rotation_selection picks next provider; create RotationAssignment(status=OFFERED)"
      - "selected provider.offers_received_count += 1; recompute provider standing"
      - "advance lot.rotation_cursor by 1 (mod list length)"
      - "increments ImpoundLot.version by 1"

  # ---------------- TowProvider ----------------
  - method: POST
    path: "/tow-providers"
    description: "Register a tow provider on the rotation list"
    roles: [LotOperator]
    code: 201
    input: [company_name, license_number, rotation_rank, "trailing_window_size?"]
    output: TowProvider
    side_effects: ["status=ACTIVE, counters=0"]

  - method: GET
    path: "/tow-providers/{id}"
    description: "Get a tow provider (includes raw_standing_pct / effective_standing_pct)"
    roles: [LotOperator, TowProvider, AuctionOfficial]
    code: 200
    input: []
    output: TowProvider
    side_effects: []

  - method: POST
    path: "/tow-providers/{id}/suspend"
    description: "Suspend a provider (excluded from rotation, standing penalized)"
    roles: [LotOperator]
    code: 200
    input: []
    output: TowProvider
    side_effects: ["status -> SUSPENDED; recompute effective_standing_pct (apply penalty)"]

  - method: POST
    path: "/tow-providers/{id}/reinstate"
    description: "Reinstate a SUSPENDED provider to ACTIVE"
    roles: [LotOperator]
    code: 200
    input: []
    output: TowProvider
    side_effects: ["status -> ACTIVE; recompute standing"]

  # ---------------- Lienholder ----------------
  - method: POST
    path: "/lienholders"
    description: "Create a lienholder record"
    roles: [LotOperator]
    code: 201
    input: [name, mailing_address, state_code]
    output: Lienholder
    side_effects: []

  - method: GET
    path: "/lienholders/{id}"
    description: "Get a lienholder"
    roles: [LotOperator, Claimant]
    code: 200
    input: []
    output: Lienholder
    side_effects: []

  # ---------------- RotationAssignment ----------------
  - method: GET
    path: "/rotation-assignments/{id}"
    description: "Get a rotation assignment"
    roles: [LotOperator, TowProvider]
    code: 200
    input: []
    output: RotationAssignment
    side_effects: []

  - method: GET
    path: "/rotation-assignments"
    description: "List/filter rotation assignments (reverse-reachability for provider_id / lot_id)"
    roles: [LotOperator, TowProvider]
    code: 200
    input: ["provider_id?", "lot_id?", "status?"]
    output: "RotationAssignment[]"
    side_effects: []

  - method: POST
    path: "/rotation-assignments/{id}/accept"
    description: "Provider accepts a rotation offer"
    roles: [TowProvider]
    code: 200
    input: []
    output: RotationAssignment
    side_effects: ["status -> ACCEPTED", "provider.offers_accepted_count += 1; recompute standing"]

  - method: POST
    path: "/rotation-assignments/{id}/decline"
    description: "Provider declines; cascade re-offer to next provider"
    roles: [TowProvider]
    code: 200
    input: []
    output: RotationAssignment
    side_effects: ["status -> DECLINED", "advance lot.rotation_cursor, mint next OFFERED assignment, bump next provider counter, set superseded_by_id"]

  - method: POST
    path: "/rotation-assignments/{id}/expire"
    description: "Expire an offer past its TTL; cascade re-offer to next provider"
    roles: [LotOperator]
    code: 200
    input: []
    output: RotationAssignment
    side_effects: ["status -> EXPIRED", "re-offer cascade (advance cursor, mint next, bump next counter)"]

  - method: POST
    path: "/rotation-assignments/{id}/cancel"
    description: "Cancel an offer without re-offering"
    roles: [LotOperator]
    code: 200
    input: []
    output: RotationAssignment
    side_effects: ["status -> CANCELLED"]

  # ---------------- TowOrder ----------------
  - method: POST
    path: "/tow-orders"
    description: "Create a tow intake order (TOWED)"
    roles: [LotOperator, PoliceOfficer]
    code: 201
    input: [lot_id, tow_type, vin, plate, owner_name, owner_address, "provider_id?", "rotation_assignment_id?", "lienholder_id?"]
    output: TowOrder
    side_effects:
      - "status=TOWED; intake_at=current clock"
      - "estimated_storage_cents = daily_storage_rate_cents * statutory_hold_days (ESTIMATE variant)"
      - "validate FK consistency (ERR_REFERENCE_MISMATCH); lot must be OPEN (ERR_LOT_SUSPENDED)"

  - method: GET
    path: "/tow-orders/{id}"
    description: "Get a tow order (computed accrual/balance fields)"
    roles: [LotOperator, PoliceOfficer, Claimant, AuctionOfficial]
    code: 200
    input: []
    output: TowOrder
    side_effects: []

  - method: GET
    path: "/tow-orders"
    description: "List/filter tow orders (reverse-reachability for provider_id / lienholder_id / rotation_assignment_id / auction_id)"
    roles: [LotOperator, PoliceOfficer, AuctionOfficial, Claimant]
    code: 200
    input: ["lot_id?", "provider_id?", "lienholder_id?", "rotation_assignment_id?", "auction_id?", "status?"]
    output: "TowOrder[]"
    side_effects: []

  - method: POST
    path: "/tow-orders/{id}/store"
    description: "Move order to STORED; open accrual ledger"
    roles: [LotOperator]
    code: 200
    input: []
    output: TowOrder
    side_effects: ["status -> STORED; stored_at set; open StorageLedgerEntry(ACCRUAL); recompute accrued/balance"]

  - method: POST
    path: "/tow-orders/{id}/authorize-release"
    description: "Authorize release once fees satisfied / waived and no hold"
    roles: [LotOperator]
    code: 200
    input: []
    output: TowOrder
    side_effects: ["status -> RELEASE_AUTHORIZED; freeze accrual (FREEZE ledger entry); set accrual_frozen_at"]

  - method: POST
    path: "/tow-orders/{id}/lapse-authorization"
    description: "Lapse a release authorization; resume accrual (cyclic back to STORED)"
    roles: [LotOperator]
    code: 200
    input: []
    output: TowOrder
    side_effects: ["status -> STORED; open RESUME ledger entry; clear accrual_frozen_at"]

  - method: POST
    path: "/tow-orders/{id}/mark-auction-eligible"
    description: "Mark order auction-eligible after statutory period; freeze accrual"
    roles: [LotOperator]
    code: 200
    input: []
    output: TowOrder
    side_effects: ["status -> AUCTION_ELIGIBLE; freeze accrual; set accrual_frozen_at"]

  - method: POST
    path: "/tow-orders/{id}/reclaim"
    description: "Claimant comes forward before auction; revert AUCTION_ELIGIBLE -> STORED, resume accrual (cyclic)"
    roles: [LotOperator]
    code: 200
    input: []
    output: TowOrder
    side_effects: ["status -> STORED; open RESUME ledger entry; clear accrual_frozen_at"]

  - method: POST
    path: "/tow-orders/{id}/void"
    description: "Void a wrongful/erroneous tow"
    roles: [PoliceOfficer]
    code: 200
    input: []
    output: TowOrder
    side_effects: ["status -> VOIDED; zero accrual; close open ledger entry"]

  - method: POST
    path: "/tow-orders/{id}/place-hold"
    description: "Place a police/evidence hold (parallel dimension)"
    roles: [PoliceOfficer]
    code: 200
    input: [hold_status]
    output: TowOrder
    side_effects: ["hold_status -> POLICE_HOLD | EVIDENCE_HOLD"]

  - method: POST
    path: "/tow-orders/{id}/lift-hold"
    description: "Lift the active hold"
    roles: [PoliceOfficer]
    code: 200
    input: []
    output: TowOrder
    side_effects: ["hold_status -> NONE"]

  - method: GET
    path: "/tow-orders/{id}/ledger-entries"
    description: "List storage ledger entries (reverse-reachability for StorageLedgerEntry.tow_order_id)"
    roles: [LotOperator, Claimant, AuctionOfficial]
    code: 200
    input: ["kind?"]
    output: "StorageLedgerEntry[]"
    side_effects: []

  # ---------------- Notification ----------------
  - method: POST
    path: "/tow-orders/{id}/notifications"
    description: "Create a DRAFT notification for owner/lienholder"
    roles: [LotOperator]
    code: 201
    input: [recipient_type, method]
    output: Notification
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/tow-orders/{id}/notifications"
    description: "List notifications (reverse-reachability for Notification.tow_order_id)"
    roles: [LotOperator, Claimant]
    code: 200
    input: ["recipient_type?", "status?"]
    output: "Notification[]"
    side_effects: []

  - method: GET
    path: "/tow-orders/{id}/notifications/{nid}"
    description: "Get a single notification"
    roles: [LotOperator, Claimant]
    code: 200
    input: []
    output: Notification
    side_effects: []

  - method: POST
    path: "/tow-orders/{id}/notifications/{nid}/send"
    description: "Send a notification"
    roles: [LotOperator]
    code: 200
    input: []
    output: Notification
    side_effects: ["status -> SENT; sent_at set"]

  - method: POST
    path: "/tow-orders/{id}/notifications/{nid}/confirm-delivery"
    description: "Confirm delivery; starts notice grace clock (cascade to statutory eligibility)"
    roles: [LotOperator]
    code: 200
    input: []
    output: Notification
    side_effects: ["status -> DELIVERY_CONFIRMED; resolved_at set; recompute TowOrder statutory_eligibility"]

  - method: POST
    path: "/tow-orders/{id}/notifications/{nid}/mark-returned"
    description: "Mark certified mail returned (constructive delivery)"
    roles: [LotOperator]
    code: 200
    input: []
    output: Notification
    side_effects: ["status -> CERTIFIED_RETURNED; resolved_at set; recompute statutory_eligibility"]

  - method: POST
    path: "/tow-orders/{id}/notifications/{nid}/mark-undeliverable"
    description: "Mark notice undeliverable (does not start grace clock)"
    roles: [LotOperator]
    code: 200
    input: []
    output: Notification
    side_effects: ["status -> UNDELIVERABLE"]

  # ---------------- InventoryItem ----------------
  - method: POST
    path: "/tow-orders/{id}/inventory-items"
    description: "Document a photo/inventory item"
    roles: [LotOperator]
    code: 201
    input: [category, description, photo_ref, "condition_note?"]
    output: InventoryItem
    side_effects: []

  - method: GET
    path: "/tow-orders/{id}/inventory-items"
    description: "List inventory items (reverse-reachability for InventoryItem.tow_order_id)"
    roles: [LotOperator, Claimant]
    code: 200
    input: ["category?"]
    output: "InventoryItem[]"
    side_effects: []

  # ---------------- FeeWaiver ----------------
  - method: POST
    path: "/tow-orders/{id}/fee-waivers"
    description: "Claimant files a fee waiver / dispute"
    roles: [Claimant]
    code: 201
    input: [reason, requested_amount_cents]
    output: FeeWaiver
    side_effects: ["status=REQUESTED; filed_by_user_id = X-User-ID"]

  - method: GET
    path: "/tow-orders/{id}/fee-waivers"
    description: "List fee waivers (reverse-reachability for FeeWaiver.tow_order_id)"
    roles: [LotOperator, Claimant]
    code: 200
    input: ["status?"]
    output: "FeeWaiver[]"
    side_effects: []

  - method: GET
    path: "/tow-orders/{id}/fee-waivers/{wid}"
    description: "Get a fee waiver"
    roles: [LotOperator, Claimant]
    code: 200
    input: []
    output: FeeWaiver
    side_effects: []

  - method: POST
    path: "/tow-orders/{id}/fee-waivers/{wid}/start-review"
    description: "Begin review of a fee waiver"
    roles: [LotOperator]
    code: 200
    input: []
    output: FeeWaiver
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/tow-orders/{id}/fee-waivers/{wid}/approve"
    description: "Approve a fee waiver (segregated from filer); applies tiered credit"
    roles: [LotOperator]
    code: 200
    input: []
    output: FeeWaiver
    side_effects: ["status -> APPROVED; approved_amount_cents via waiver_credit; TowOrder.waiver_credit_cents += approved; recompute net_due_cents; decided_by_user_id set"]

  - method: POST
    path: "/tow-orders/{id}/fee-waivers/{wid}/deny"
    description: "Deny a fee waiver (segregated from filer)"
    roles: [LotOperator]
    code: 200
    input: []
    output: FeeWaiver
    side_effects: ["status -> DENIED; decided_by_user_id set"]

  - method: POST
    path: "/tow-orders/{id}/fee-waivers/{wid}/withdraw"
    description: "Filer withdraws their waiver"
    roles: [Claimant]
    code: 200
    input: []
    output: FeeWaiver
    side_effects: ["status -> WITHDRAWN"]

  # ---------------- ReleaseRecord ----------------
  - method: POST
    path: "/tow-orders/{id}/release-records"
    description: "Record physical release (RELEASE_AUTHORIZED -> RELEASED)"
    roles: [LotOperator]
    code: 201
    input: [amount_paid_cents, released_to_name]
    output: ReleaseRecord
    side_effects: ["TowOrder.status -> RELEASED; amount_paid_cents += amount; authorized_at set"]

  - method: GET
    path: "/tow-orders/{id}/release-records"
    description: "List release records (reverse-reachability for ReleaseRecord.tow_order_id)"
    roles: [LotOperator, Claimant]
    code: 200
    input: []
    output: "ReleaseRecord[]"
    side_effects: []

  # ---------------- Payment toward balance (so amount_paid_cents can reach net_due) ----------------
  - method: POST
    path: "/tow-orders/{id}/payments"
    description: "Record a payment toward the order balance (increments amount_paid_cents)"
    roles: [LotOperator, Claimant]
    code: 200
    input: [amount_cents]
    output: TowOrder
    side_effects: ["TowOrder.amount_paid_cents += amount_cents"]

  # ---------------- Auction ----------------
  - method: POST
    path: "/auctions"
    description: "Schedule an auction window for a lot"
    roles: [AuctionOfficial, LotOperator]
    code: 201
    input: [lot_id, window_start, window_end]
    output: Auction
    side_effects: ["status=SCHEDULED; reject overlapping window on same lot (ERR_AUCTION_WINDOW_OVERLAP)"]

  - method: GET
    path: "/auctions/{id}"
    description: "Get an auction (aggregated proceeds/distribution)"
    roles: [AuctionOfficial, LotOperator]
    code: 200
    input: []
    output: Auction
    side_effects: []

  - method: GET
    path: "/auctions"
    description: "List/filter auctions (reverse-reachability for Auction.lot_id)"
    roles: [AuctionOfficial, LotOperator]
    code: 200
    input: ["lot_id?", "status?"]
    output: "Auction[]"
    side_effects: []

  - method: GET
    path: "/auctions/{id}/tow-orders"
    description: "List orders swept into an auction (reverse-reachability for TowOrder.auction_id)"
    roles: [AuctionOfficial, LotOperator]
    code: 200
    input: ["status?"]
    output: "TowOrder[]"
    side_effects: []

  - method: POST
    path: "/auctions/{id}/open"
    description: "Open a scheduled auction (window started)"
    roles: [AuctionOfficial]
    code: 200
    input: []
    output: Auction
    side_effects: ["status -> OPEN"]

  - method: POST
    path: "/auctions/{id}/sweep"
    description: "Sweep an AUCTION_ELIGIBLE order into this auction (links auction_id)"
    roles: [AuctionOfficial, LotOperator]
    code: 200
    input: [tow_order_id]
    output: TowOrder
    side_effects: ["TowOrder.auction_id = auction.id (must be AUCTION_ELIGIBLE, hold NONE; else ERR_INVALID_STATE / ERR_HOLD_ACTIVE)"]

  - method: POST
    path: "/auctions/{id}/record-sale"
    description: "Record a sale of a swept order; cascade proceeds distribution"
    roles: [AuctionOfficial]
    code: 200
    input: [tow_order_id, sale_price_cents]
    output: TowOrder
    side_effects:
      - "TowOrder.status -> AUCTIONED; write SETTLEMENT ledger entry"
      - "Auction.gross_proceeds_cents += sale_price_cents; recompute distribution waterfall"

  - method: POST
    path: "/auctions/{id}/void-sale"
    description: "Void a recorded sale (compensating action); reverse distribution, order back to AUCTION_ELIGIBLE"
    roles: [AuctionOfficial]
    code: 200
    input: [tow_order_id]
    output: TowOrder
    side_effects:
      - "TowOrder.status -> AUCTION_ELIGIBLE; remove SETTLEMENT ledger entry"
      - "Auction.gross_proceeds_cents -= sale_price; recompute distribution (conservation invariant restored)"

  - method: POST
    path: "/auctions/{id}/settle"
    description: "Settle an open auction (finalize distribution)"
    roles: [AuctionOfficial]
    code: 200
    input: []
    output: Auction
    side_effects: ["status -> SETTLED"]

  - method: POST
    path: "/auctions/{id}/cancel"
    description: "Cancel a scheduled auction; unlink swept orders"
    roles: [AuctionOfficial]
    code: 200
    input: []
    output: Auction
    side_effects: ["status -> CANCELLED; swept orders auction_id -> null"]

  # ---------------- Test-driving clock ----------------
  - method: POST
    path: "/_clock/set"
    description: "Test-driving endpoint: set the server's current UTC clock to an explicit instant (drives time-gated accrual / statutory / offer-expiry scenarios)"
    roles: [LotOperator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server current clock = to_iso8601 for all subsequent now() reads"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for endpoint, or ownership/segregation actor mismatch" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, invalid enum, negative amount, window_end <= window_start" }
  - { id: ERR_REFERENCE_MISMATCH, http: 409, condition: "FK ids inconsistent (rotation_assignment provider != provider_id, lienholder missing, lot mismatch)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_INVENTORY_REQUIRED, http: 409, condition: "Cannot move to STORED without at least one InventoryItem documented" }
  - { id: ERR_HOLD_ACTIVE, http: 409, condition: "Active POLICE_HOLD / EVIDENCE_HOLD blocks release or auction action" }
  - { id: ERR_NO_HOLD, http: 409, condition: "lift-hold called when hold_status is already NONE" }
  - { id: ERR_WAIVER_PENDING, http: 409, condition: "A REQUESTED/UNDER_REVIEW FeeWaiver blocks release authorization" }
  - { id: ERR_BALANCE_UNPAID, http: 409, condition: "amount_paid_cents does not cover net_due_cents at release authorization" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "FeeWaiver decider X-User-ID equals filer X-User-ID" }
  - { id: ERR_STATUTORY_PERIOD_NOT_ELAPSED, http: 409, condition: "Statutory hold period or notice grace window not yet elapsed for auction eligibility" }
  - { id: ERR_NO_LIENHOLDER, http: 409, condition: "Lienholder notification send with no lienholder on the order" }
  - { id: ERR_METHOD_NOT_CERTIFIED, http: 409, condition: "mark-returned on a notice whose method is not CERTIFIED_MAIL" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Rotation offer accept after expires_at" }
  - { id: ERR_OFFER_NOT_EXPIRED, http: 409, condition: "expire called before expires_at" }
  - { id: ERR_PROVIDER_NOT_ACTIVE, http: 409, condition: "Rotation accept when provider is not ACTIVE" }
  - { id: ERR_NO_ELIGIBLE_PROVIDER, http: 409, condition: "dispatch-rotation / re-offer found no eligible ACTIVE provider under capacity" }
  - { id: ERR_LOT_SUSPENDED, http: 409, condition: "New TowOrder intake on a SUSPENDED lot" }
  - { id: ERR_AUCTION_WINDOW_OVERLAP, http: 409, condition: "Scheduled auction window overlaps an existing window on the same lot" }
  - { id: ERR_AUCTION_WINDOW_NOT_STARTED, http: 409, condition: "open called before window_start" }
  - { id: ERR_ALREADY_IN_AUCTION, http: 409, condition: "reclaim when order already swept into an auction (auction_id != null)" }
  - { id: ERR_NOT_IN_AUCTION, http: 409, condition: "record-sale for an order not swept into this auction" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "dispatch-rotation / suspend expected_lot_version != current ImpoundLot.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LotOperator
    description: "Impound lot staff: configures lots/providers/lienholders, runs intake, accrual, notifications, releases, rotation dispatch, fee-waiver decisioning."
    identity: "opaque"
    exclusive_operations:
      - "POST /impound-lots — create lot"
      - "POST /impound-lots/{id}/suspend — suspend lot"
      - "POST /impound-lots/{id}/dispatch-rotation — dispatch rotation call"
      - "POST /tow-providers — register provider"
      - "POST /tow-providers/{id}/suspend — suspend provider"
      - "POST /tow-providers/{id}/reinstate — reinstate provider"
      - "POST /lienholders — create lienholder"
      - "POST /rotation-assignments/{id}/expire — expire offer"
      - "POST /rotation-assignments/{id}/cancel — cancel offer"
      - "POST /tow-orders/{id}/store — store"
      - "POST /tow-orders/{id}/authorize-release — authorize release"
      - "POST /tow-orders/{id}/lapse-authorization — lapse authorization"
      - "POST /tow-orders/{id}/mark-auction-eligible — mark eligible"
      - "POST /tow-orders/{id}/reclaim — reclaim"
      - "POST /tow-orders/{id}/notifications/** — manage notifications"
      - "POST /tow-orders/{id}/inventory-items — document inventory"
      - "POST /tow-orders/{id}/fee-waivers/{wid}/start-review|approve|deny — decide waivers"
      - "POST /tow-orders/{id}/release-records — record release"
      - "POST /_clock/set — set test clock"
    shared_operations:
      - "POST /tow-orders — intake (with PoliceOfficer)"
      - "POST /tow-orders/{id}/payments — record payment (with Claimant)"
      - "POST /auctions — schedule auction (with AuctionOfficial)"
      - "POST /auctions/{id}/sweep — sweep order (with AuctionOfficial)"
      - "GET ** — reads"

  - name: PoliceOfficer
    description: "Law enforcement: authorizes police/abandoned intake, places and lifts evidence/police holds, voids wrongful tows."
    identity: "opaque"
    exclusive_operations:
      - "POST /tow-orders/{id}/void — void wrongful tow"
      - "POST /tow-orders/{id}/place-hold — place hold"
      - "POST /tow-orders/{id}/lift-hold — lift hold"
    shared_operations:
      - "POST /tow-orders — intake (with LotOperator)"
      - "GET /tow-orders/** — reads"

  - name: TowProvider
    description: "Rotation-list tow company; accepts/declines rotation offers it was dispatched."
    identity: "entity_backed:TowProvider"
    exclusive_operations:
      - "POST /rotation-assignments/{id}/accept — accept offer (X-User-ID == provider_id)"
      - "POST /rotation-assignments/{id}/decline — decline offer (X-User-ID == provider_id)"
    shared_operations:
      - "GET /rotation-assignments/** — reads"
      - "GET /tow-providers/{id} — read own record"

  - name: Claimant
    description: "Vehicle owner/agent: files and withdraws fee waivers/disputes, records payments, reads order/notice/inventory."
    identity: "opaque"
    exclusive_operations:
      - "POST /tow-orders/{id}/fee-waivers — file waiver (filed_by_user_id = X-User-ID)"
      - "POST /tow-orders/{id}/fee-waivers/{wid}/withdraw — withdraw own waiver"
    shared_operations:
      - "POST /tow-orders/{id}/payments — record payment (with LotOperator)"
      - "GET /tow-orders/** — reads"

  - name: AuctionOfficial
    description: "Conducts statutory-period auctions: schedules, opens, sweeps eligible orders, records/voids sales, settles."
    identity: "opaque"
    exclusive_operations:
      - "POST /auctions/{id}/open — open auction"
      - "POST /auctions/{id}/record-sale — record sale"
      - "POST /auctions/{id}/void-sale — void sale"
      - "POST /auctions/{id}/settle — settle auction"
      - "POST /auctions/{id}/cancel — cancel auction"
    shared_operations:
      - "POST /auctions — schedule auction (with LotOperator)"
      - "POST /auctions/{id}/sweep — sweep order (with LotOperator)"
      - "GET /auctions/** — reads"
