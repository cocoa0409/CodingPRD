  # ---------------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict (≥ 2 instances, different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_invalid_state_beats_invalid_rental_terms
        grounds:
          - validations[priority=5]
          - validations[priority=16]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INVALID_RENTAL_TERMS]
        distinguishing_aspect: |
          Category pair: state vs business_fiscal.
          Scenario: attempt POST /booking-agreements/{id}/counter on a
          BookingAgreement already in ACCEPTED state (state violation,
          priority 5) AND with a payload containing floor_pct > week_one_rental_pct
          (fiscal violation, priority 16). State check wins.
        test_recipe:
          setup:
            - "BookingAgreement BA1 in ACCEPTED state"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 90, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-08T00:00:00Z", min_screens_for_wide: 0 }
