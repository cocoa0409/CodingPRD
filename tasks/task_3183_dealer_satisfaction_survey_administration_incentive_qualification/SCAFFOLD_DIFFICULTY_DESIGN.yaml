              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /survey/question-sets"
              payload: { code: "QS-N", questions: [{question_code: "q1", prompt: "A", weight: 1}], comparability_factor: 1.0 }
              as: PlatformAdmin
              captures: { qs_id: $.data.id }
            - call: "POST /survey/question-sets/${qs_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /survey/waves"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", question_set_id: "${qs_id}" }
              as: PlatformAdmin
              captures: { wave_a: $.data.id }
            - call: "POST /survey/waves"
              payload: { period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", question_set_id: "${qs_id}" }
              as: PlatformAdmin
              captures: { wave_b: $.data.id }
            - call: "POST /survey/transactions"
              payload: { dealer_id: "${dealer_id}", department_id: "${dept_id}", customer_id: "${cust_id}", kind: "SALE", completed_at: "2026-09-10T00:00:00Z", margin_cents: 1000 }
              as: PlatformAdmin
            - call: "POST /survey/waves/${wave_a}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /survey/transactions"
              payload: { dealer_id: "${dealer_id}", department_id: "${dept_id}", customer_id: "${cust_id}", kind: "SERVICE_VISIT", completed_at: "2026-10-15T00:00:00Z", margin_cents: 500 }
              as: PlatformAdmin
