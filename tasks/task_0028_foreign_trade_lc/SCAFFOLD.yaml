# =============================================================================
# Foreign Trade Letter of Credit Management System — Scaffold (v1)
# =============================================================================

scenario: |
  Foreign trade letter of credit management system: L/C issuance, amendment,
  and advising with application submission, issuing-bank/advising-bank/confirming-bank
  routing, SWIFT message generation (MT700/707/710), L/C term review, and
  amendment-consent workflow; document examination (strict compliance) with
  required-document checklist (commercial invoice/bill of lading/packing list/
  insurance policy/certificate of origin), term-by-term comparison against L/C,
  multi-reviewer cross-check, and examination report generation; discrepancy
  handling with discrepancy item recording, applicant-acceptance workflow,
  document-amendment notification, discrepancy-fee calculation, and
  refusal-and-return process; payment, acceptance, and negotiation workflow
  with sight payment execution, usance acceptance recording, negotiation-bank
  advance, beneficiary fund settlement, and reimbursement claim from issuing
  bank; expiration management with L/C validity period tracking, presentation
  period monitoring, expiration alerts, post-expiration handling, and
  unused-L/C cancellation; event-driven synchronization with banking, customs,
  logistics, and SWIFT network; audit logging for L/C lifecycle events and
  document-examination records.

domain_name: foreign-trade-lc
api_prefix: /letters-of-credit

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - derived_field_reconciliation
    - idempotency
    - bulk_operations

  entity_topology: hybrid
  # LC root with hierarchical children (Presentation -> Document, Presentation -> Examination -> Discrepancy)
  # plus cross-cutting flat references (Amendment <-> SwiftMessage, ReimbursementClaim <-> Settlement)

  state_machine_shape: parallel
  # LetterOfCredit carries two independent status axes: lifecycle_status (issuance/active/expired/closed)
  # and amendment_consent_status (NONE / PENDING_APPLICANT / PENDING_BENEFICIARY / PENDING_CONFIRMING_BANK / CONSENTED / REJECTED).
  # Amendment, Presentation, Examination, Settlement, Discrepancy each carry their own non-linear lifecycle.

  relationship_patterns:
    - one_to_many   # LC -> Amendment, LC -> Presentation, Presentation -> Document, Presentation -> Discrepancy
    - cross_aggregate  # ReimbursementClaim references PaymentSettlement which references Presentation
    - polymorphic   # SwiftMessage.subject_type in {LC, AMENDMENT, SETTLEMENT, REIMBURSEMENT}

  role_model: peer_roles
  # Three banks (IssuingBank, AdvisingBank, ConfirmingBank) plus Applicant, Beneficiary, NegotiatingBank, Operator, Auditor.
  # Each role owns disjoint operations on different lifecycle steps.

  consistency_model: saga
  # Multi-step workflow: amendment-consent, examination cross-check, discrepancy refusal-and-return,
  # negotiation advance + reimbursement claim each compensate on failure.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: LetterOfCredit
    parent: null
    common_fields: true
    fields:
      - { name: lc_number, type: string, source: system, description: "Server-generated LC number, immutable, unique global; format LC-YYYY-NNNNNN" }
      - { name: applicant_id, type: string, source: input, description: "Foreign-key to Applicant (entity_backed). The corporate buyer requesting the LC." }
      - { name: beneficiary_id, type: string, source: input, description: "Foreign-key to Beneficiary (entity_backed). The exporter/seller." }
      - { name: issuing_bank_id, type: string, source: input, description: "Foreign-key to IssuingBank (entity_backed)." }
      - { name: advising_bank_id, type: string, source: input, description: "Foreign-key to AdvisingBank (entity_backed). Required at issuance." }
      - { name: confirming_bank_id, type: string, source: input, description: "Foreign-key to ConfirmingBank (entity_backed). Optional; null when LC is unconfirmed." }
      - { name: lc_type, type: enum, source: input, description: "SIGHT | USANCE", constraints: "Determines settlement variant at payment_settlement creation." }
      - { name: usance_tenor_days, type: integer, source: input, description: "Days from acceptance to maturity. Required when lc_type=USANCE; must be in {30,60,90,120,180}; null when lc_type=SIGHT." }
      - { name: currency, type: string, source: input, description: "ISO 4217 code (e.g., USD, EUR, JPY, CNY)." }
      - { name: amount_minor_units, type: integer, source: input, description: "LC face amount in minor currency units (e.g., cents)." }
      - { name: tolerance_pct, type: number, source: input, default: 0, description: "Allowed amount tolerance (0..10) — applied to drawing amount. 0 means exact." }
      - { name: drawn_amount_minor_units, type: integer, source: computed, default: 0, description: "Cumulative successfully-paid drawings (PAID/NEGOTIATED/REIMBURSED). Subtracts on payment compensation." }
      - { name: available_amount_minor_units, type: integer, source: computed, description: "= amount_minor_units * (1 + tolerance_pct/100) - drawn_amount_minor_units, floored at 0." }
      - { name: latest_shipment_date, type: datetime, source: input, description: "ISO 8601 UTC. Last permissible shipment date. Used in compliance comparison." }
      - { name: presentation_period_days, type: integer, source: input, default: 21, description: "Days after shipment within which beneficiary must present documents. UCP600 default 21." }
      - { name: expiry_date, type: datetime, source: input, description: "ISO 8601 UTC. LC expiry date (last day documents may be presented at the place of expiry)." }
      - { name: confirmation_required, type: boolean, source: input, default: false, description: "Whether applicant requested confirmation. If true, confirming_bank_id must be set." }
      - { name: required_documents, type: array, source: input, description: "Required document checklist; array of enums from {COMMERCIAL_INVOICE, BILL_OF_LADING, PACKING_LIST, INSURANCE_POLICY, CERTIFICATE_OF_ORIGIN}. Must contain COMMERCIAL_INVOICE and BILL_OF_LADING at minimum." }
      - { name: lifecycle_status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | ISSUED | ADVISED | ACTIVE | EXPIRED | CANCELLED | CLOSED. Linear-ish but can revert UNDER_REVIEW->DRAFT and ISSUED->CANCELLED before drawings." }
      - { name: amendment_consent_status, type: enum, source: system, default: NONE, description: "NONE | PENDING_APPLICANT | PENDING_BENEFICIARY | PENDING_CONFIRMING_BANK | CONSENTED | REJECTED. Independent of lifecycle_status; cycles back to NONE when amendment closes." }
      - { name: confirmation_status, type: enum, source: system, default: NOT_REQUIRED, description: "NOT_REQUIRED | PENDING | CONFIRMED | DECLINED" }
      - { name: cancelled_reason, type: string, source: system, description: "Free text; null unless lifecycle_status=CANCELLED." }
      - { name: discrepancy_fee_minor_units, type: integer, source: input, default: 7500, description: "Per-presentation discrepancy fee in minor currency units; default = 75.00 of LC currency." }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Corporate buyer name." }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2." }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Exporter / seller corporate name." }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2." }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: Bank
    parent: null
    common_fields: true
    fields:
      - { name: bank_role, type: enum, source: input, description: "ISSUING | ADVISING | CONFIRMING | NEGOTIATING. A single Bank record is permitted to play any role; the LC entity references the per-role id directly." }
      - { name: swift_bic, type: string, source: input, description: "ISO 9362 BIC, 8 or 11 chars, unique." }
      - { name: name, type: string, source: input, description: "Bank legal name." }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2." }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: LcAmendment
    parent: LetterOfCredit
    common_fields: true
    fields:
      - { name: lc_id, type: string, source: system, description: "Parent LC id." }
      - { name: amendment_seq, type: integer, source: system, description: "Per-LC sequence starting at 1; immutable." }
      - { name: changes, type: object, source: input, description: "Field-level diff: { amount_minor_units?, expiry_date?, latest_shipment_date?, tolerance_pct?, required_documents? }. At least one field required." }
      - { name: applicant_consent, type: enum, source: system, default: PENDING, description: "PENDING | CONSENTED | REJECTED" }
      - { name: beneficiary_consent, type: enum, source: system, default: PENDING, description: "PENDING | CONSENTED | REJECTED" }
      - { name: confirming_bank_consent, type: enum, source: system, default: NOT_REQUIRED, description: "NOT_REQUIRED | PENDING | CONSENTED | REJECTED. PENDING when LC has confirming_bank_id." }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | CONSENTED | REJECTED | WITHDRAWN" }
      - { name: rejected_by_role, type: enum, source: system, description: "APPLICANT | BENEFICIARY | CONFIRMING_BANK; set when status=REJECTED." }
      - { name: applied_at, type: datetime, source: system, description: "Timestamp the amendment was merged into the parent LC; null until status=CONSENTED." }

  - name: SwiftMessage
    parent: null
    common_fields: false  # immutable event log; only id and created_at
    fields:
      - { name: message_type, type: enum, source: system, description: "MT700 | MT707 | MT710. MT700 = LC issuance, MT707 = LC amendment, MT710 = LC advising (third-bank advice)." }
      - { name: subject_type, type: enum, source: system, description: "LC | AMENDMENT" }
      - { name: subject_id, type: string, source: system, description: "Polymorphic foreign key to LetterOfCredit.id when subject_type=LC, or LcAmendment.id when subject_type=AMENDMENT." }
      - { name: lc_id, type: string, source: system, description: "Always set to the LC the message ultimately concerns (denormalized for auditing)." }
      - { name: sender_bic, type: string, source: system, description: "Originating bank BIC (issuing or advising)." }
      - { name: receiver_bic, type: string, source: system, description: "Destination bank BIC." }
      - { name: payload, type: object, source: system, description: "Generated structured fields per MT spec; never null." }
      - { name: idempotency_key, type: string, source: system, description: "Server-derived: f(subject_type, subject_id, message_type). Unique. Re-issue on the same triplet returns the existing message." }

  - name: Presentation
    parent: LetterOfCredit
    common_fields: true
    fields:
      - { name: lc_id, type: string, source: system, description: "Parent LC id." }
      - { name: presentation_seq, type: integer, source: system, description: "Per-LC sequence starting at 1; immutable." }
      - { name: shipment_date, type: datetime, source: input, description: "ISO 8601 UTC. Date goods were shipped; must be <= LC.latest_shipment_date and <= now()." }
      - { name: presented_at, type: datetime, source: system, description: "Server clock when presentation was created." }
      - { name: drawing_amount_minor_units, type: integer, source: input, description: "Amount drawn under this presentation; must be > 0 and within available_amount_minor_units, including tolerance." }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_EXAMINATION | EXAMINED_CLEAN | EXAMINED_DISCREPANT | ACCEPTED_BY_APPLICANT | REFUSED | RETURNED | SETTLED" }
      - { name: refusal_notified_at, type: datetime, source: system, description: "Set when REFUSED. Combined with refusal-deadline calculation." }
      - { name: refusal_deadline, type: datetime, source: computed, description: "= refusal_notified_at + 5 banking days; null until REFUSED. Once exceeded the IssuingBank loses its right to refuse — automatic transition to EXAMINED_CLEAN." }

  - name: Document
    parent: Presentation
    common_fields: true
    fields:
      - { name: presentation_id, type: string, source: system, description: "Parent Presentation id." }
      - { name: document_type, type: enum, source: input, description: "COMMERCIAL_INVOICE | BILL_OF_LADING | PACKING_LIST | INSURANCE_POLICY | CERTIFICATE_OF_ORIGIN" }
      - { name: issuer, type: string, source: input, description: "Document issuer name (free text)." }
      - { name: document_date, type: datetime, source: input, description: "ISO 8601 UTC. Issued/dated date on the document." }
      - { name: stated_amount_minor_units, type: integer, source: input, description: "Amount on this document (e.g., commercial invoice amount). 0 if N/A for the type." }
      - { name: stated_currency, type: string, source: input, description: "ISO 4217. For documents that state a currency; otherwise the LC currency mirror." }
      - { name: payload, type: object, source: input, description: "Structured fields varying by document_type (e.g., bill_of_lading.shipped_on_board_date, certificate_of_origin.country_of_origin)." }

  - name: ExaminationReport
    parent: Presentation
    common_fields: true
    fields:
      - { name: presentation_id, type: string, source: system, description: "Parent Presentation id; one report per presentation." }
      - { name: primary_reviewer_id, type: string, source: input, description: "User id of the first reviewer; must have role=Operator." }
      - { name: secondary_reviewer_id, type: string, source: input, description: "User id of the cross-check reviewer; must differ from primary_reviewer_id." }
      - { name: status, type: enum, source: system, default: IN_PROGRESS, description: "IN_PROGRESS | PRIMARY_DONE | CROSS_CHECK_DONE | CONFLICT | FINALIZED" }
      - { name: primary_outcome, type: enum, source: system, description: "CLEAN | DISCREPANT; null until primary_reviewer submits." }
      - { name: secondary_outcome, type: enum, source: system, description: "CLEAN | DISCREPANT; null until secondary_reviewer submits." }
      - { name: final_outcome, type: enum, source: computed, description: "CLEAN | DISCREPANT; computed on FINALIZED. CLEAN iff both primary_outcome=CLEAN and secondary_outcome=CLEAN." }
      - { name: examined_at, type: datetime, source: system, description: "Set when status=FINALIZED." }
      - { name: deadline_at, type: datetime, source: computed, description: "= Presentation.presented_at + 5 banking days. UCP600 reasonable-time-not-to-exceed-five-banking-days standard." }
      - { name: report_payload, type: object, source: computed, description: "Generated narrative including required-document checklist outcome and term-by-term comparison findings." }

  - name: Discrepancy
    parent: ExaminationReport
    common_fields: true
    fields:
      - { name: examination_report_id, type: string, source: system, description: "Parent ExaminationReport id." }
      - { name: presentation_id, type: string, source: system, description: "Denormalized parent Presentation id." }
      - { name: discrepancy_code, type: enum, source: input, description: "MISSING_DOCUMENT | LATE_PRESENTATION | LATE_SHIPMENT | AMOUNT_MISMATCH | DESCRIPTION_MISMATCH | INCONSISTENT_DOCS | EXPIRED_LC | CURRENCY_MISMATCH" }
      - { name: description, type: string, source: input, description: "Reviewer-authored description; required." }
      - { name: cited_document_id, type: string, source: input, description: "Document.id this discrepancy cites; null when discrepancy is about an absent document." }
      - { name: applicant_action, type: enum, source: system, default: PENDING, description: "PENDING | ACCEPTED | REJECTED | TIMED_OUT" }
      - { name: action_at, type: datetime, source: system, description: "Set when applicant_action moves out of PENDING." }

  - name: PaymentSettlement
    parent: Presentation
    common_fields: true
    fields:
      - { name: presentation_id, type: string, source: system, description: "Parent Presentation id; one settlement per presentation." }
      - { name: lc_id, type: string, source: system, description: "Denormalized LC id." }
      - { name: settlement_type, type: enum, source: system, description: "SIGHT_PAYMENT | USANCE_ACCEPTANCE | NEGOTIATION. Mirrors LC.lc_type at creation, except NEGOTIATION when negotiating bank advances funds before reimbursement." }
      - { name: principal_minor_units, type: integer, source: system, description: "= Presentation.drawing_amount_minor_units." }
      - { name: discrepancy_fee_minor_units, type: integer, source: computed, description: "Discrepancy fee deducted from beneficiary proceeds when presentation was discrepant. 0 otherwise." }
      - { name: negotiation_advance_minor_units, type: integer, source: computed, description: "Amount advanced to beneficiary by NegotiatingBank. 0 unless settlement_type=NEGOTIATION." }
      - { name: negotiation_discount_minor_units, type: integer, source: computed, description: "Discount charged by NegotiatingBank for funds-time-value. 0 unless settlement_type=NEGOTIATION." }
      - { name: beneficiary_proceeds_minor_units, type: integer, source: computed, description: "Net amount paid to beneficiary; computed by the settlement formula in §1.3." }
      - { name: maturity_date, type: datetime, source: computed, description: "Set when settlement_type=USANCE_ACCEPTANCE: = accepted_at + LC.usance_tenor_days. Null otherwise." }
      - { name: accepted_at, type: datetime, source: system, description: "Acceptance recording time for USANCE; null otherwise." }
      - { name: paid_at, type: datetime, source: system, description: "Funds-disbursed time for SIGHT/NEGOTIATION; null otherwise. For USANCE set on maturity payment." }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ACCEPTED | PAID | COMPENSATED" }

  - name: ReimbursementClaim
    parent: PaymentSettlement
    common_fields: true
    fields:
      - { name: payment_settlement_id, type: string, source: system, description: "Parent PaymentSettlement id; exactly one claim per settlement when settlement_type=NEGOTIATION." }
      - { name: lc_id, type: string, source: system, description: "Denormalized LC id." }
      - { name: claimed_amount_minor_units, type: integer, source: system, description: "= PaymentSettlement.principal_minor_units." }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | HONORED | DISPUTED | EXTINGUISHED" }
      - { name: honored_amount_minor_units, type: integer, source: system, default: 0, description: "Funds actually returned by issuing bank." }
      - { name: honored_at, type: datetime, source: system, description: "Set when status=HONORED." }

  - name: ExpiryAlert
    parent: LetterOfCredit
    common_fields: false
    fields:
      - { name: lc_id, type: string, source: system, description: "Parent LC id." }
      - { name: alert_kind, type: enum, source: system, description: "T_MINUS_15 | T_MINUS_5 | EXPIRED | PRESENTATION_PERIOD_LAPSED" }
      - { name: triggered_at, type: datetime, source: system, description: "When the clock-driven sweep emitted this alert." }
      - { name: details, type: object, source: system, description: "Snapshot of LC.expiry_date / latest_shipment_date / status at trigger." }

  - name: ExternalEvent
    parent: null
    common_fields: false
    fields:
      - { name: source_system, type: enum, source: input, description: "BANKING | CUSTOMS | LOGISTICS | SWIFT" }
      - { name: event_type, type: enum, source: input, description: "BANK_PAYMENT_CONFIRMED | CUSTOMS_DECLARATION_FILED | SHIPMENT_DEPARTED | SHIPMENT_DELIVERED | SWIFT_ACK | SWIFT_NAK" }
      - { name: lc_id, type: string, source: input, description: "Foreign-key LC the event concerns. Required." }
      - { name: presentation_id, type: string, source: input, description: "Optional foreign-key Presentation when event_type names a presentation-scoped event." }
      - { name: idempotency_key, type: string, source: input, description: "Caller-supplied. Re-emission with same key returns the prior event row without side effects." }
      - { name: payload, type: object, source: input, description: "Source-system-specific structured payload." }
      - { name: processed_at, type: datetime, source: system, description: "Server clock at ingestion; immutable." }
      - { name: applied_side_effects, type: array, source: system, description: "Names of state transitions or calculations triggered by this event for audit replay." }

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - { name: actor_role, type: enum, source: system, description: "Applicant | Beneficiary | IssuingBank | AdvisingBank | ConfirmingBank | NegotiatingBank | Operator | Auditor | system" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID at the time of the action; null for system." }
      - { name: action, type: string, source: system, description: "Endpoint canonical name (e.g., 'lc.issue', 'presentation.refuse')." }
      - { name: subject_type, type: enum, source: system, description: "LC | AMENDMENT | PRESENTATION | DOCUMENT | EXAMINATION | DISCREPANCY | SETTLEMENT | REIMBURSEMENT" }
      - { name: subject_id, type: string, source: system, description: "Subject row id." }
      - { name: lc_id, type: string, source: system, description: "Always populated for traceability (resolves polymorphic subject to its LC)." }
      - { name: before_state, type: string, source: system, description: "Optional from-state for state transitions." }
      - { name: after_state, type: string, source: system, description: "Optional to-state for state transitions." }
      - { name: payload_digest, type: string, source: system, description: "SHA-256 hex of canonical request body." }

  - name: Clock
    parent: null
    common_fields: false
    fields:
      - { name: now, type: datetime, source: system, description: "Server clock — singleton row id='clock'. Mutable only via /_clock/advance for tests." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # 1. LetterOfCredit — parallel state dimensions: lifecycle_status x amendment_consent_status
  # ---------------------------------------------------------------------------
  - entity: LetterOfCredit
    initial_state: DRAFT          # lifecycle_status
    terminal_states: [CLOSED, CANCELLED]
    note: |
      LetterOfCredit carries TWO independent state dimensions on the same row:
      (a) lifecycle_status (DRAFT → UNDER_REVIEW → ISSUED → ADVISED → ACTIVE → EXPIRED → CLOSED, with cancellation branch).
      (b) amendment_consent_status (NONE ↔ PENDING_APPLICANT ↔ PENDING_BENEFICIARY ↔ PENDING_CONFIRMING_BANK ↔ CONSENTED/REJECTED → NONE).
      Transitions on dimension (a) and (b) execute independently — e.g., an LC in lifecycle_status=ACTIVE can be in any
      amendment_consent_status. Both dimensions revert to terminal independently.
    transitions:

      # lifecycle dimension
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: POST /letters-of-credit/{lcId}/submit
        actor: Applicant
        preconditions:
          - "Applicant.status = ACTIVE (else ERR_APPLICANT_SUSPENDED)"
          - "required_documents contains COMMERCIAL_INVOICE and BILL_OF_LADING (else ERR_INVALID_REQUEST)"
          - "If lc_type=USANCE then usance_tenor_days IN {30,60,90,120,180} (else ERR_INVALID_REQUEST)"
          - "If confirmation_required=true then confirming_bank_id is set (else ERR_CONFIRMING_BANK_REQUIRED)"
          - "expiry_date > now() (else ERR_EXPIRY_IN_PAST)"
          - "latest_shipment_date <= expiry_date (else ERR_SHIPMENT_AFTER_EXPIRY)"
        side_effects:
          - "AuditLogEntry created with action='lc.submit'"

      - from: UNDER_REVIEW
        to: DRAFT
        trigger: POST /letters-of-credit/{lcId}/return-to-applicant
        actor: IssuingBank
        preconditions: []
        side_effects:
          - "AuditLogEntry created with action='lc.return_to_applicant'"

      - from: UNDER_REVIEW
        to: ISSUED
        trigger: POST /letters-of-credit/{lcId}/issue
        actor: IssuingBank
        preconditions:
          - "All term-review checks pass (validations §1.4 priority 6, 7)"
        side_effects:
          - "lc_number assigned (idempotent — re-issue on ISSUED returns existing number)"
          - "SwiftMessage MT700 generated (idempotency_key=hash(LC,id,MT700))"
          - "If confirmation_required=true: confirmation_status → PENDING; else NOT_REQUIRED"
          - "AuditLogEntry created with action='lc.issue'"

      - from: ISSUED
        to: ADVISED
        trigger: POST /letters-of-credit/{lcId}/advise
        actor: AdvisingBank
        preconditions:
          - "MT700 SwiftMessage exists for this LC (else ERR_SWIFT_NOT_DELIVERED)"
        side_effects:
          - "SwiftMessage MT710 generated when AdvisingBank routes to a different downstream advising bank (idempotent)"
          - "AuditLogEntry created with action='lc.advise'"

      - from: ADVISED
        to: ACTIVE
        trigger: |
          system (automatic transition: confirmation_status in {NOT_REQUIRED, CONFIRMED})
        actor: system
        preconditions:
          - "If confirmation_required=true then confirmation_status=CONFIRMED (else stays ADVISED)"
        side_effects:
          - "Eligible for presentations and amendments"

      - from: ISSUED
        to: CANCELLED
        trigger: POST /letters-of-credit/{lcId}/cancel
        actor: IssuingBank
        preconditions:
          - "drawn_amount_minor_units = 0 (else ERR_LC_HAS_DRAWINGS)"
          - "No Presentation in (SUBMITTED, UNDER_EXAMINATION, EXAMINED_CLEAN, EXAMINED_DISCREPANT, ACCEPTED_BY_APPLICANT) (else ERR_LC_HAS_OPEN_PRESENTATIONS)"
          - "No LcAmendment in PENDING (else ERR_AMENDMENT_PENDING)"
        side_effects:
          - "cancelled_reason set"
          - "AuditLogEntry created with action='lc.cancel'"

      - from: ADVISED
        to: CANCELLED
        trigger: POST /letters-of-credit/{lcId}/cancel
        actor: IssuingBank
        preconditions:
          - "drawn_amount_minor_units = 0"
          - "No Presentation in non-terminal state"
          - "No LcAmendment in PENDING"
        side_effects:
          - "cancelled_reason set"

      - from: ACTIVE
        to: CANCELLED
        trigger: POST /letters-of-credit/{lcId}/cancel
        actor: IssuingBank
        preconditions:
          - "drawn_amount_minor_units = 0"
          - "No Presentation in non-terminal state"
          - "No LcAmendment in PENDING"
        side_effects:
          - "cancelled_reason set"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic: clock-driven sweep when now() > expiry_date)"
        actor: system
        preconditions:
          - "now() > expiry_date"
        side_effects:
          - "ExpiryAlert with alert_kind=EXPIRED emitted (idempotent on lc_id)"
          - "Open Presentations in SUBMITTED/UNDER_EXAMINATION → forced to RETURNED via cascading transition"

      - from: EXPIRED
        to: CLOSED
        trigger: "system (automatic when all Presentations terminal AND drawn_amount_minor_units stable for 30 days post-expiry)"
        actor: system
        preconditions:
          - "All child Presentations in terminal state {RETURNED, SETTLED}"
          - "now() >= expiry_date + 30 days"
        side_effects:
          - "AuditLogEntry created with action='lc.close'"

      - from: ACTIVE
        to: CLOSED
        trigger: "system (automatic when drawn_amount_minor_units = available headroom upper bound AND no open presentations)"
        actor: system
        preconditions:
          - "available_amount_minor_units = 0"
          - "No Presentation in non-terminal state"
        side_effects:
          - "AuditLogEntry created"

      # amendment_consent_status dimension (parallel to lifecycle)
      - from: NONE
        to: PENDING_APPLICANT
        trigger: POST /letters-of-credit/{lcId}/amendments
        actor: IssuingBank
        preconditions:
          - "lifecycle_status IN {ISSUED, ADVISED, ACTIVE} (else ERR_LC_NOT_AMENDABLE)"
          - "amendment_consent_status=NONE (else ERR_AMENDMENT_PENDING)"
        side_effects:
          - "LcAmendment row created in status=PENDING with applicant_consent=PENDING"
          - "SwiftMessage MT707 generated (idempotency_key=hash(AMENDMENT,id,MT707))"

      - from: PENDING_APPLICANT
        to: PENDING_BENEFICIARY
        trigger: POST /letters-of-credit/{lcId}/amendments/{amendmentId}/applicant-consent
        actor: Applicant
        preconditions:
          - "LcAmendment.applicant_consent=PENDING"
        side_effects:
          - "LcAmendment.applicant_consent=CONSENTED"

      - from: PENDING_APPLICANT
        to: REJECTED
        trigger: POST /letters-of-credit/{lcId}/amendments/{amendmentId}/applicant-consent
        actor: Applicant
        preconditions:
          - "Request body decision=REJECTED"
        side_effects:
          - "LcAmendment.applicant_consent=REJECTED, status=REJECTED, rejected_by_role=APPLICANT"

      - from: PENDING_BENEFICIARY
        to: PENDING_CONFIRMING_BANK
        trigger: POST /letters-of-credit/{lcId}/amendments/{amendmentId}/beneficiary-consent
        actor: Beneficiary
        preconditions:
          - "LcAmendment.beneficiary_consent=PENDING"
          - "LC.confirming_bank_id is set"
        side_effects:
          - "LcAmendment.beneficiary_consent=CONSENTED, confirming_bank_consent → PENDING"

      - from: PENDING_BENEFICIARY
        to: CONSENTED
        trigger: POST /letters-of-credit/{lcId}/amendments/{amendmentId}/beneficiary-consent
        actor: Beneficiary
        preconditions:
          - "LcAmendment.beneficiary_consent=PENDING"
          - "LC.confirming_bank_id is null"
        side_effects:
          - "LcAmendment.beneficiary_consent=CONSENTED, status=CONSENTED, applied_at=now()"
          - "Cascade: LC fields merged from LcAmendment.changes (amount/expiry/latest_shipment_date/tolerance/required_documents)"
          - "If amount_minor_units increased: drawn_amount_minor_units recomputed (unchanged numerator) — reconciliation calc"
          - "amendment_consent_status → NONE (cycle reset)"

      - from: PENDING_BENEFICIARY
        to: REJECTED
        trigger: POST /letters-of-credit/{lcId}/amendments/{amendmentId}/beneficiary-consent
        actor: Beneficiary
        preconditions: ["Request body decision=REJECTED"]
        side_effects:
          - "LcAmendment.status=REJECTED, rejected_by_role=BENEFICIARY"

      - from: PENDING_CONFIRMING_BANK
        to: CONSENTED
        trigger: POST /letters-of-credit/{lcId}/amendments/{amendmentId}/confirming-bank-consent
        actor: ConfirmingBank
        preconditions:
          - "LcAmendment.confirming_bank_consent=PENDING"
        side_effects:
          - "LcAmendment.confirming_bank_consent=CONSENTED, status=CONSENTED, applied_at=now()"
          - "Cascade: LC fields merged from changes"
          - "amendment_consent_status → NONE (cycle reset)"

      - from: PENDING_CONFIRMING_BANK
        to: REJECTED
        trigger: POST /letters-of-credit/{lcId}/amendments/{amendmentId}/confirming-bank-consent
        actor: ConfirmingBank
        preconditions: ["Request body decision=REJECTED"]
        side_effects:
          - "LcAmendment.status=REJECTED, rejected_by_role=CONFIRMING_BANK"

      - from: REJECTED
        to: NONE
        trigger: "system (automatic when LcAmendment row reaches terminal status REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "amendment_consent_status reset to NONE; subsequent amendments allowed"

      - from: CONSENTED
        to: NONE
        trigger: "system (automatic on amendment-application cascade)"
        actor: system
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------------------
  # 2. LcAmendment — branching with rejection
  # ---------------------------------------------------------------------------
  - entity: LcAmendment
    initial_state: PENDING
    terminal_states: [CONSENTED, REJECTED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: CONSENTED
        trigger: "system (automatic when all required consents collected)"
        actor: system
        preconditions:
          - "applicant_consent=CONSENTED"
          - "beneficiary_consent=CONSENTED"
          - "If LC.confirming_bank_id set: confirming_bank_consent=CONSENTED"
        side_effects:
          - "applied_at=now()"
          - "LC.amendment_consent_status → NONE"
      - from: PENDING
        to: REJECTED
        trigger: "system (automatic when any consent flips to REJECTED)"
        actor: system
        preconditions: ["any of applicant_consent/beneficiary_consent/confirming_bank_consent = REJECTED"]
        side_effects:
          - "rejected_by_role recorded"
      - from: PENDING
        to: WITHDRAWN
        trigger: POST /letters-of-credit/{lcId}/amendments/{amendmentId}/withdraw
        actor: IssuingBank
        preconditions:
          - "applicant_consent=PENDING (cannot withdraw after applicant consented)"
        side_effects:
          - "LC.amendment_consent_status → NONE"

  # ---------------------------------------------------------------------------
  # 3. Presentation — branching cyclic with refusal-deadline auto-clean
  # ---------------------------------------------------------------------------
  - entity: Presentation
    initial_state: SUBMITTED
    terminal_states: [SETTLED, RETURNED]
    transitions:
      - from: SUBMITTED
        to: UNDER_EXAMINATION
        trigger: POST /presentations/{presentationId}/start-examination
        actor: IssuingBank
        preconditions:
          - "LC.lifecycle_status IN {ACTIVE, EXPIRED} (cross-entity dependency)"
          - "ExaminationReport row created in same request"
        side_effects:
          - "ExaminationReport created in IN_PROGRESS"

      - from: UNDER_EXAMINATION
        to: EXAMINED_CLEAN
        trigger: POST /examinations/{examinationId}/finalize
        actor: IssuingBank
        preconditions:
          - "ExaminationReport.status=CROSS_CHECK_DONE"
          - "ExaminationReport.final_outcome=CLEAN"
        side_effects:
          - "ExaminationReport.status → FINALIZED, examined_at=now()"

      - from: UNDER_EXAMINATION
        to: EXAMINED_DISCREPANT
        trigger: POST /examinations/{examinationId}/finalize
        actor: IssuingBank
        preconditions:
          - "ExaminationReport.status=CROSS_CHECK_DONE"
          - "ExaminationReport.final_outcome=DISCREPANT"
          - "At least one Discrepancy row exists for this report"
        side_effects:
          - "ExaminationReport.status → FINALIZED"

      - from: EXAMINED_DISCREPANT
        to: ACCEPTED_BY_APPLICANT
        trigger: POST /presentations/{presentationId}/applicant-decision
        actor: Applicant
        preconditions:
          - "All Discrepancy.applicant_action transitioned to ACCEPTED OR explicit accept-all body"
        side_effects:
          - "Each Discrepancy row → ACCEPTED, action_at=now()"

      - from: EXAMINED_DISCREPANT
        to: REFUSED
        trigger: POST /presentations/{presentationId}/applicant-decision
        actor: Applicant
        preconditions:
          - "Request body decision=REJECTED OR within-deadline auto-refusal"
        side_effects:
          - "Each Discrepancy row → REJECTED"
          - "refusal_notified_at=now(), refusal_deadline=now()+5banking_days"

      - from: EXAMINED_DISCREPANT
        to: REFUSED
        trigger: POST /presentations/{presentationId}/refuse
        actor: IssuingBank
        preconditions:
          - "Issuing bank elects to refuse (independent of applicant)"
          - "Within 5 banking days of presentation receipt"
        side_effects:
          - "refusal_notified_at=now(), refusal_deadline=now()+5banking_days"

      - from: EXAMINED_DISCREPANT
        to: EXAMINED_CLEAN
        trigger: "system (automatic: refusal-deadline-elapsed sweep) — IssuingBank lost right to refuse per UCP600 art.16(d)/(f)"
        actor: system
        preconditions:
          - "now() > Presentation.presented_at + 5 banking days AND Presentation.status still EXAMINED_DISCREPANT AND refusal_notified_at IS NULL"
        side_effects:
          - "Presentation auto-promotes to EXAMINED_CLEAN; documents are deemed compliant"

      - from: REFUSED
        to: RETURNED
        trigger: POST /presentations/{presentationId}/return-documents
        actor: IssuingBank
        preconditions:
          - "now() <= refusal_notified_at + 7 banking days"
          - "Applicant has not subsequently issued ACCEPTED_BY_APPLICANT"
        side_effects:
          - "AuditLogEntry created"

      - from: REFUSED
        to: ACCEPTED_BY_APPLICANT
        trigger: POST /presentations/{presentationId}/applicant-override
        actor: Applicant
        preconditions:
          - "Presentation in REFUSED"
          - "now() <= refusal_deadline"
        side_effects:
          - "Compensating action: refusal_notified_at=null, refusal_deadline=null"
          - "Each Discrepancy row → ACCEPTED"

      - from: EXAMINED_CLEAN
        to: SETTLED
        trigger: POST /presentations/{presentationId}/settle
        actor: IssuingBank
        preconditions:
          - "PaymentSettlement created with corresponding settlement_type"
        side_effects:
          - "Cascade: PaymentSettlement created and immediately advanced (sight) or recorded (usance)"
          - "Cascade: LC.drawn_amount_minor_units += Presentation.drawing_amount_minor_units"
          - "Cascade: LC.available_amount_minor_units recomputed (derived field reconciliation)"

      - from: ACCEPTED_BY_APPLICANT
        to: SETTLED
        trigger: POST /presentations/{presentationId}/settle
        actor: IssuingBank
        preconditions:
          - "All Discrepancy.applicant_action=ACCEPTED"
          - "PaymentSettlement created"
        side_effects:
          - "Cascade: PaymentSettlement.discrepancy_fee_minor_units = LC.discrepancy_fee_minor_units"
          - "Cascade: LC.drawn_amount_minor_units += Presentation.drawing_amount_minor_units"

  # ---------------------------------------------------------------------------
  # 4. ExaminationReport — multi-reviewer cross-check with conflict revert
  # ---------------------------------------------------------------------------
  - entity: ExaminationReport
    initial_state: IN_PROGRESS
    terminal_states: [FINALIZED]
    transitions:
      - from: IN_PROGRESS
        to: PRIMARY_DONE
        trigger: POST /examinations/{examinationId}/primary-review
        actor: Operator
        preconditions:
          - "X-User-ID = primary_reviewer_id"
          - "primary_outcome IN {CLEAN, DISCREPANT}"
          - "If DISCREPANT: at least one Discrepancy row exists"
        side_effects:
          - "primary_outcome stored"

      - from: PRIMARY_DONE
        to: CROSS_CHECK_DONE
        trigger: POST /examinations/{examinationId}/cross-check
        actor: Operator
        preconditions:
          - "X-User-ID = secondary_reviewer_id"
          - "secondary_reviewer_id != primary_reviewer_id"
          - "secondary_outcome IN {CLEAN, DISCREPANT}"
          - "If primary_outcome != secondary_outcome: status → CONFLICT instead"
        side_effects:
          - "secondary_outcome stored"

      - from: PRIMARY_DONE
        to: CONFLICT
        trigger: POST /examinations/{examinationId}/cross-check
        actor: Operator
        preconditions:
          - "primary_outcome != secondary_outcome"
        side_effects:
          - "secondary_outcome stored, status=CONFLICT"

      - from: CONFLICT
        to: IN_PROGRESS
        trigger: POST /examinations/{examinationId}/reset
        actor: IssuingBank
        preconditions: []
        side_effects:
          - "primary_outcome=null, secondary_outcome=null, all Discrepancy rows deleted"

      - from: CROSS_CHECK_DONE
        to: FINALIZED
        trigger: POST /examinations/{examinationId}/finalize
        actor: IssuingBank
        preconditions:
          - "primary_outcome=secondary_outcome (consistent)"
          - "now() <= deadline_at (UCP600 5-banking-day reasonable time)"
        side_effects:
          - "examined_at=now(), final_outcome computed"
          - "Cascade: parent Presentation → EXAMINED_CLEAN or EXAMINED_DISCREPANT"

  # ---------------------------------------------------------------------------
  # 5. PaymentSettlement — branching settlement variants
  # ---------------------------------------------------------------------------
  - entity: PaymentSettlement
    initial_state: PENDING
    terminal_states: [PAID, COMPENSATED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: POST /settlements/{settlementId}/execute-sight
        actor: IssuingBank
        preconditions:
          - "settlement_type=SIGHT_PAYMENT"
          - "Parent Presentation in {EXAMINED_CLEAN, ACCEPTED_BY_APPLICANT}"
        side_effects:
          - "paid_at=now()"
          - "beneficiary_proceeds_minor_units computed via §1.3 settlement_proceeds calc"

      - from: PENDING
        to: ACCEPTED
        trigger: POST /settlements/{settlementId}/record-acceptance
        actor: IssuingBank
        preconditions:
          - "settlement_type=USANCE_ACCEPTANCE"
          - "Parent Presentation in {EXAMINED_CLEAN, ACCEPTED_BY_APPLICANT}"
        side_effects:
          - "accepted_at=now(), maturity_date=accepted_at + LC.usance_tenor_days"

      - from: ACCEPTED
        to: PAID
        trigger: "system (automatic: clock-driven sweep when now() >= maturity_date)"
        actor: system
        preconditions:
          - "now() >= maturity_date"
        side_effects:
          - "paid_at=now()"
          - "beneficiary_proceeds_minor_units computed"

      - from: PENDING
        to: PAID
        trigger: POST /settlements/{settlementId}/negotiation-advance
        actor: NegotiatingBank
        preconditions:
          - "settlement_type=NEGOTIATION"
          - "Parent Presentation in EXAMINED_CLEAN"
        side_effects:
          - "negotiation_advance_minor_units, negotiation_discount_minor_units, beneficiary_proceeds_minor_units computed"
          - "paid_at=now()"
          - "Cascade: ReimbursementClaim auto-created in SUBMITTED status"

      - from: PAID
        to: COMPENSATED
        trigger: POST /settlements/{settlementId}/compensate
        actor: IssuingBank
        preconditions:
          - "ReimbursementClaim.status=DISPUTED OR external bank payment reversed (ExternalEvent of type BANK_PAYMENT_CONFIRMED missing or BANK_PAYMENT_CONFIRMED with reversal=true)"
        side_effects:
          - "Cascade: LC.drawn_amount_minor_units -= principal_minor_units (compensating-invariant: invariant_delta_drawn = +principal then -principal must be zero)"
          - "Cascade: LC.available_amount_minor_units recomputed"
          - "Parent Presentation reverts to EXAMINED_CLEAN; new settlement may be initiated"

  # ---------------------------------------------------------------------------
  # 6. ReimbursementClaim — linear with dispute branch
  # ---------------------------------------------------------------------------
  - entity: ReimbursementClaim
    initial_state: SUBMITTED
    terminal_states: [HONORED, EXTINGUISHED]
    transitions:
      - from: SUBMITTED
        to: HONORED
        trigger: POST /reimbursement-claims/{claimId}/honor
        actor: IssuingBank
        preconditions:
          - "claimed_amount_minor_units within LC available headroom + already-drawn"
        side_effects:
          - "honored_amount_minor_units = claimed_amount_minor_units, honored_at=now()"
      - from: SUBMITTED
        to: DISPUTED
        trigger: POST /reimbursement-claims/{claimId}/dispute
        actor: IssuingBank
        preconditions: []
        side_effects:
          - "Cascade: PaymentSettlement.status → COMPENSATED"
      - from: DISPUTED
        to: EXTINGUISHED
        trigger: POST /reimbursement-claims/{claimId}/extinguish
        actor: IssuingBank
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: HONORED
        trigger: POST /reimbursement-claims/{claimId}/honor
        actor: IssuingBank
        preconditions: []
        side_effects:
          - "honored_amount_minor_units = claimed_amount_minor_units"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Two reviewers submit the same primary-review on an ExaminationReport simultaneously"
    guarantee: "Exactly one primary-review wins; second is rejected"
    error_id: ERR_REVIEW_ALREADY_RECORDED
    http_status: 409
    serialization: "First-writer-wins on ExaminationReport.primary_outcome"

  - scenario: "Issuing bank issues an LC while applicant tries to return-to-applicant the same submission"
    guarantee: "Exactly one wins; loser sees stale-state error"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    serialization: "First-writer-wins on LC.lifecycle_status"

  - scenario: "Two beneficiaries submit a presentation against the same LC simultaneously, both within tolerance individually but together overdrawing"
    guarantee: "First reaches LC.available_amount_minor_units check; second rejected"
    error_id: ERR_LC_INSUFFICIENT_AVAILABLE
    http_status: 409
    serialization: "Serialize on LC.id; deduct drawn_amount_minor_units atomically"

  - scenario: "Applicant accepts discrepancies while issuing bank refuses presentation simultaneously"
    guarantee: "Exactly one wins; loser sees stale-state error"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    serialization: "First-writer-wins on Presentation.status"

  - scenario: "Two amendments created concurrently on the same LC"
    guarantee: "At most one PENDING amendment per LC; second is rejected"
    error_id: ERR_AMENDMENT_PENDING
    http_status: 409
    serialization: "First-writer-wins on LC.amendment_consent_status flip from NONE"

  - scenario: "Two SwiftMessage emissions for the same (subject_type, subject_id, message_type) triplet"
    guarantee: "Idempotent: second call returns the existing message; no duplicate"
    error_id: ERR_IDEMPOTENT_REPLAY
    http_status: 200
    serialization: "Unique constraint on idempotency_key"

  - scenario: "Two ExternalEvent ingestions with the same caller idempotency_key"
    guarantee: "Second call is a no-op returning the original row; no double side-effect"
    error_id: ERR_IDEMPOTENT_REPLAY
    http_status: 200
    serialization: "Unique constraint on (source_system, idempotency_key)"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: lc_available_amount
    trigger: "On LC creation; on amendment-application; on Presentation.settle (status → SETTLED); on PaymentSettlement.compensate; on amendment-merge of amount_minor_units or tolerance_pct"
    algorithm: aggregation
    formula: |
      cap = floor(amount_minor_units * (100 + tolerance_pct) / 100)        # integer cents, floor on tolerance ceiling
      drawn = sum(PaymentSettlement.principal_minor_units                   #   for settlements whose status IN {ACCEPTED, PAID}
                  where lc_id = self.id
                  and status IN ('ACCEPTED','PAID'))
      available_amount_minor_units = max(0, cap - drawn)
    input_set: |
      Source = PaymentSettlement rows where lc_id matches AND status IN {ACCEPTED, PAID}.
      Excludes PENDING (not yet drawn) and COMPENSATED (drawn-then-reversed).
    constants: {}
    precision: "integer minor currency units; tolerance applied as floor((amount * (100 + tolerance_pct))/100)"
    variants: []

  - name: settlement_proceeds
    trigger: "PaymentSettlement.execute-sight; PaymentSettlement.negotiation-advance; PaymentSettlement.maturity-payment"
    algorithm: tiered_pricing
    formula: |
      principal = Presentation.drawing_amount_minor_units
      fee = (Presentation came from EXAMINED_DISCREPANT branch via ACCEPTED_BY_APPLICANT) ? LC.discrepancy_fee_minor_units : 0
      base = principal - fee
      Order of operations: subtract fee BEFORE applying negotiation discount.
      Pin: rounding is done on the final beneficiary_proceeds_minor_units after both deductions, NOT per-step.
    constants: {}
    precision: "integer minor currency units; floor on each multiplicative discount; final round_half_up to integer minor"
    variants:
      - name: SIGHT_PAYMENT
        when: "PaymentSettlement.settlement_type=SIGHT_PAYMENT"
        difference: |
          discount = 0
          beneficiary_proceeds_minor_units = base
          maturity_date = null
      - name: USANCE_ACCEPTANCE
        when: "PaymentSettlement.settlement_type=USANCE_ACCEPTANCE; computed at maturity payment, not at acceptance"
        difference: |
          discount = 0
          beneficiary_proceeds_minor_units = base
          maturity_date = accepted_at + LC.usance_tenor_days
          paid_at is delayed until maturity sweep advances state PENDING→ACCEPTED→PAID
      - name: NEGOTIATION
        when: "PaymentSettlement.settlement_type=NEGOTIATION; computed at advance time"
        difference: |
          NEGOTIATION_RATE_BPS = 350         # 3.50% annualized discount
          DAYS_TO_REIMBURSEMENT = 7
          rate_fraction = NEGOTIATION_RATE_BPS / 10000 * (DAYS_TO_REIMBURSEMENT / 360)
          negotiation_discount_minor_units = floor(base * rate_fraction)
          negotiation_advance_minor_units = base - negotiation_discount_minor_units
          beneficiary_proceeds_minor_units = negotiation_advance_minor_units
          (issuing bank later reimburses claimed_amount_minor_units = principal,
           NOT base — discrepancy fee stays with issuing bank, negotiation discount stays with negotiating bank)

  - name: presentation_compliance_check
    trigger: "ExaminationReport.cross-check (secondary-review submission); ExaminationReport.finalize"
    algorithm: weighted_scoring
    formula: |
      Inputs (≥3, with non-linear interactions):
        I1: required_documents_present  = (set(LC.required_documents) ⊆ set(Document.document_type for doc in presentation))
        I2: term_match_amount           = (sum_of_invoice_amounts <= LC.amount * (100 + LC.tolerance_pct)/100)
        I3: term_match_currency         = all docs.stated_currency == LC.currency
        I4: shipment_in_window          = max(BoL.shipped_on_board_date) <= LC.latest_shipment_date
        I5: presentation_in_window      = Presentation.presented_at <= max(BoL.shipped_on_board_date) + LC.presentation_period_days
        I6: presentation_before_expiry  = Presentation.presented_at <= LC.expiry_date
        I7: documents_internally_consistent = (CommercialInvoice.country_of_origin == CertificateOfOrigin.country_of_origin) when both present
      Combined:
        if (I1 AND I2 AND I3 AND I4 AND I5 AND I6 AND I7):
          outcome = CLEAN
        else:
          outcome = DISCREPANT
          discrepancies = list(failed_input_to_discrepancy_code(I_k) for each failed I_k)
      Tier mapping I_k → discrepancy_code:
        I1 → MISSING_DOCUMENT
        I2 → AMOUNT_MISMATCH
        I3 → CURRENCY_MISMATCH
        I4 → LATE_SHIPMENT
        I5 → LATE_PRESENTATION
        I6 → EXPIRED_LC
        I7 → INCONSISTENT_DOCS
      Pin: I-checks are evaluated in order I1..I7. The discrepancy list is emitted in the same order.
      Pin: presentation_period_days = 21 (LC default) but is overridden if LC carries a different value.
    input_set: |
      Source = Documents where presentation_id = ExaminationReport.presentation_id.
      Source LC = ExaminationReport.presentation.lc_id (post any applied amendments).
    constants: {}
    precision: "boolean per check; result is enum CLEAN | DISCREPANT"
    variants:
      - name: PRIMARY_REVIEW
        when: "Submitted by ExaminationReport.primary_reviewer_id"
        difference: "Reviewer authors discrepancy rows; primary_outcome stored on report."
      - name: CROSS_CHECK_REVIEW
        when: "Submitted by ExaminationReport.secondary_reviewer_id"
        difference: |
          Reviewer authors their own discrepancy list independent of primary's.
          Two valid algorithms produce different results:
          - PRIMARY_REVIEW operates on documents-as-presented (snapshot at primary review).
          - CROSS_CHECK_REVIEW operates on documents-as-of-now (any post-primary doc edits show up).
          Pin: cross-check reviewer reads the same Document rows as primary; documents are FROZEN
          on the start-examination transition (Document table immutable while Presentation in
          UNDER_EXAMINATION). This is the explicit pinning that resolves the ambiguity.

  - name: discrepancy_fee_calculation
    trigger: "Presentation transitions to ACCEPTED_BY_APPLICANT (settle); also computed at REFUSED → return-documents (no fee)"
    algorithm: threshold
    formula: |
      if Presentation.status was EXAMINED_DISCREPANT before final state:
        discrepancy_fee_minor_units = LC.discrepancy_fee_minor_units      # flat per-presentation fee, NOT per-discrepancy
      else:
        discrepancy_fee_minor_units = 0
      Boundary precision: status check uses 'was-ever-EXAMINED_DISCREPANT' history, not current status,
      because automatic refusal-deadline-elapsed transitions EXAMINED_DISCREPANT → EXAMINED_CLEAN
      and in that case the fee MUST NOT be charged (issuing bank lost right to refuse).
    constants: {}
    precision: "integer minor currency units; flat fee, no rounding"
    variants:
      - name: AT_SETTLE
        when: "Presentation.settle, where prior history includes EXAMINED_DISCREPANT and ACCEPTED_BY_APPLICANT"
        difference: "Fee charged"
      - name: AT_AUTO_PROMOTION
        when: "Presentation auto-promoted EXAMINED_DISCREPANT→EXAMINED_CLEAN by refusal-deadline sweep"
        difference: "No fee charged (issuing bank lost refusal right; UCP600 art.16(d)/(f))"

  - name: refusal_deadline_check
    trigger: "Clock sweep on every /clock/advance; Presentation.refuse"
    algorithm: threshold
    formula: |
      banking_days_elapsed = banking_day_count(from=Presentation.presented_at, to=now())
      where banking_day_count counts Mon-Fri days strictly greater than the start date
      and STOPS counting on Sat (6) and Sun (7); holidays not modeled (assume bank operates on weekdays).
      Boundary:
        - banking_days_elapsed > 5  →  IssuingBank's right to refuse expires (auto-promote to EXAMINED_CLEAN if still EXAMINED_DISCREPANT)
        - banking_days_elapsed = 5  →  still within window
        - banking_days_elapsed < 5  →  within window
      Pin: comparison is strictly > 5 (not >=). The boundary is "more than five banking days have elapsed".
    constants:
      WINDOW_BANKING_DAYS: 5
    precision: "integer banking days"
    variants: []

  - name: lc_expiry_alert_emission
    trigger: "Clock sweep on every /clock/advance"
    algorithm: chronological
    formula: |
      For each LC in lifecycle_status IN {ACTIVE, ADVISED, ISSUED}:
        days_to_expiry = ceil((LC.expiry_date - now()) / 86400 seconds)
        Emit ExpiryAlert exactly once per (lc_id, alert_kind) combo:
          if days_to_expiry == 15 and no T_MINUS_15 alert exists for lc_id: emit T_MINUS_15
          if days_to_expiry == 5  and no T_MINUS_5  alert exists for lc_id: emit T_MINUS_5
          if days_to_expiry <= 0 and no EXPIRED alert exists for lc_id: emit EXPIRED + transition LC to EXPIRED
        For each LC.Presentation in {EXAMINED_DISCREPANT, REFUSED}:
          if Presentation.shipment_date + LC.presentation_period_days < now() and no PRESENTATION_PERIOD_LAPSED alert exists:
            emit PRESENTATION_PERIOD_LAPSED
      Order: alerts emitted in (lc_id ASC, alert_kind sorted alphabetically) deterministic order.
    input_set: |
      Source = LetterOfCredit rows whose lifecycle_status NOT in terminal {CANCELLED, CLOSED}.
      Window: snapshot of clock at sweep entry; subsequent /clock/advance calls do not emit duplicates.
    constants:
      ALERT_DAYS: [15, 5, 0]
    precision: "integer day comparison"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (priority ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per RBAC matrix §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist (validated left-to-right per path segment)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: existence
    check: "All body-referenced foreign keys (applicant_id, beneficiary_id, *_bank_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /letters-of-credit; POST /letters-of-credit/{lcId}/presentations; etc."

  - priority: 5
    category: state
    check: "Resource is in a state where the requested transition is allowed (per §1.2 transitions)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-mutation endpoints"

  - priority: 6
    category: business_referential
    check: "On amendment-merge: amended fields do not violate cross-entity referential rules (e.g., new latest_shipment_date >= every existing Presentation.shipment_date)"
    error_id: ERR_AMENDMENT_VIOLATES_PRESENTATIONS
    http_status: 409
    applies_to: "applicant-consent, beneficiary-consent, confirming-bank-consent (the consent that flips amendment to CONSENTED)"

  - priority: 7
    category: business_temporal
    check: "expiry_date > now() at LC.submit; latest_shipment_date <= expiry_date; usance_tenor_days IN allowed set when lc_type=USANCE"
    error_id: "ERR_EXPIRY_IN_PAST | ERR_SHIPMENT_AFTER_EXPIRY | ERR_INVALID_REQUEST"
    http_status: "400 / 409"
    applies_to: "POST /letters-of-credit; POST .../submit"

  - priority: 8
    category: business_compliance
    check: "Confirmation requirement consistency: confirmation_required=true ↔ confirming_bank_id is set"
    error_id: ERR_CONFIRMING_BANK_REQUIRED
    http_status: 409
    applies_to: "POST /letters-of-credit; POST .../submit"

  - priority: 9
    category: business_safety
    check: "Reviewer segregation: ExaminationReport.secondary_reviewer_id must differ from primary_reviewer_id"
    error_id: ERR_REVIEWER_SAME_PERSON
    http_status: 422
    applies_to: "POST /letters-of-credit/{lcId}/presentations/{presentationId}/start-examination; POST /examinations/{examinationId}/cross-check"

  - priority: 10
    category: business_safety
    check: "On Document creation: document_type must appear in LC.required_documents OR be optional. Duplicate document_type per presentation rejected unless type is COMMERCIAL_INVOICE."
    error_id: ERR_DOCUMENT_NOT_REQUIRED_OR_DUPLICATE
    http_status: 422
    applies_to: "POST /presentations/{presentationId}/documents"

  - priority: 11
    category: business_safety
    check: "Documents are FROZEN once Presentation enters UNDER_EXAMINATION; no further document creation/mutation until examination FINALIZED or reset"
    error_id: ERR_DOCUMENTS_FROZEN
    http_status: 409
    applies_to: "POST /presentations/{presentationId}/documents (and any document mutation)"

  - priority: 12
    category: business_referential
    check: "Presentation.shipment_date <= LC.latest_shipment_date AND Presentation.shipment_date <= now()"
    error_id: ERR_SHIPMENT_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /letters-of-credit/{lcId}/presentations"

  - priority: 13
    category: business_temporal
    check: "Presentation.presented_at <= LC.expiry_date (cannot present against an EXPIRED LC)"
    error_id: ERR_PRESENTATION_AFTER_EXPIRY
    http_status: 409
    applies_to: "POST /letters-of-credit/{lcId}/presentations"

  - priority: 14
    category: business_fiscal
    check: "Presentation.drawing_amount_minor_units must be > 0 AND <= LC.available_amount_minor_units"
    error_id: ERR_LC_INSUFFICIENT_AVAILABLE
    http_status: 409
    applies_to: "POST /letters-of-credit/{lcId}/presentations"

  - priority: 15
    category: business_constraint
    check: "At most one PENDING amendment per LC at a time"
    error_id: ERR_AMENDMENT_PENDING
    http_status: 409
    applies_to: "POST /letters-of-credit/{lcId}/amendments"

  - priority: 16
    category: business_constraint
    check: "No LC cancellation while drawn_amount_minor_units > 0 OR presentations open OR amendment pending"
    error_id: "ERR_LC_HAS_DRAWINGS | ERR_LC_HAS_OPEN_PRESENTATIONS | ERR_AMENDMENT_PENDING"
    http_status: 409
    applies_to: "POST /letters-of-credit/{lcId}/cancel"

  - priority: 17
    category: business_compliance
    check: "Banks have correct bank_role for the LC slot they fill (issuing/advising/confirming/negotiating)"
    error_id: ERR_BANK_ROLE_MISMATCH
    http_status: 422
    applies_to: "POST /letters-of-credit; POST /presentations/{presentationId}/settlements/negotiation"

  - priority: 18
    category: business_compliance
    check: "MT700 must exist before MT710 (advising bank cannot pre-advise issuance)"
    error_id: ERR_SWIFT_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /letters-of-credit/{lcId}/advise"

  - priority: 19
    category: business_constraint
    check: "Idempotency: SwiftMessage uniqueness on (subject_type, subject_id, message_type); ExternalEvent uniqueness on (source_system, idempotency_key)"
    error_id: ERR_IDEMPOTENT_REPLAY
    http_status: 200
    applies_to: "system-internal SwiftMessage emission; POST /external-events"

  - priority: 20
    category: business_safety
    check: "OCC: PATCH/mutation requests carrying optional `version?` must match current row version; on mismatch reject"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all mutation endpoints supporting version field"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Reference data (banks, applicants, beneficiaries) ---
  - method: POST
    path: "/banks"
    description: "Register a Bank (issuing/advising/confirming/negotiating role)"
    roles: [Operator]
    code: 201
    input: [bank_role, swift_bic, name, country_code]
    output: Bank
    side_effects: ["status=ACTIVE; swift_bic uniqueness enforced"]

  - method: GET
    path: "/banks/{bankId}"
    description: "Get a Bank"
    roles: [Operator, Auditor, IssuingBank, AdvisingBank, ConfirmingBank, NegotiatingBank, Applicant, Beneficiary]
    code: 200
    input: []
    output: Bank
    side_effects: []

  - method: POST
    path: "/applicants"
    description: "Register an Applicant"
    roles: [Operator]
    code: 201
    input: [name, country_code]
    output: Applicant
    side_effects: ["status=ACTIVE"]

  - method: POST
    path: "/beneficiaries"
    description: "Register a Beneficiary"
    roles: [Operator]
    code: 201
    input: [name, country_code]
    output: Beneficiary
    side_effects: ["status=ACTIVE"]

  # --- LC root ---
  - method: POST
    path: "/letters-of-credit"
    description: "Create a draft LC application"
    roles: [Applicant]
    code: 201
    input: [applicant_id, beneficiary_id, issuing_bank_id, advising_bank_id, "confirming_bank_id?", lc_type, "usance_tenor_days?", currency, amount_minor_units, "tolerance_pct?", latest_shipment_date, "presentation_period_days?", expiry_date, "confirmation_required?", required_documents, "discrepancy_fee_minor_units?"]
    output: LetterOfCredit
    side_effects: ["lifecycle_status=DRAFT, amendment_consent_status=NONE"]

  - method: GET
    path: "/letters-of-credit/{lcId}"
    description: "Get LC"
    roles: [Applicant, Beneficiary, IssuingBank, AdvisingBank, ConfirmingBank, NegotiatingBank, Operator, Auditor]
    code: 200
    input: []
    output: LetterOfCredit
    side_effects: []

  - method: GET
    path: "/letters-of-credit"
    description: "List LCs"
    roles: [Operator, Auditor, IssuingBank, AdvisingBank, ConfirmingBank, Applicant, Beneficiary]
    code: 200
    input: ["lifecycle_status?", "applicant_id?", "beneficiary_id?", "issuing_bank_id?", "limit?", "offset?"]
    output: "LetterOfCredit[]"
    side_effects: []

  - method: POST
    path: "/letters-of-credit/{lcId}/submit"
    description: "Applicant submits the LC for issuing-bank review"
    roles: [Applicant]
    code: 200
    input: []
    output: LetterOfCredit
    side_effects: ["lifecycle_status DRAFT → UNDER_REVIEW"]

  - method: POST
    path: "/letters-of-credit/{lcId}/return-to-applicant"
    description: "Issuing bank returns LC to applicant for revision"
    roles: [IssuingBank]
    code: 200
    input: []
    output: LetterOfCredit
    side_effects: ["lifecycle_status UNDER_REVIEW → DRAFT"]

  - method: POST
    path: "/letters-of-credit/{lcId}/issue"
    description: "Issuing bank issues the LC; generates MT700"
    roles: [IssuingBank]
    code: 200
    input: []
    output: LetterOfCredit
    side_effects: ["lifecycle_status UNDER_REVIEW → ISSUED", "SwiftMessage MT700 created", "lc_number assigned"]

  - method: POST
    path: "/letters-of-credit/{lcId}/advise"
    description: "Advising bank advises the LC; may generate MT710"
    roles: [AdvisingBank]
    code: 200
    input: ["downstream_advising_bank_bic?"]
    output: LetterOfCredit
    side_effects: ["lifecycle_status ISSUED → ADVISED; MT710 emitted iff downstream_advising_bank_bic provided"]

  - method: POST
    path: "/letters-of-credit/{lcId}/confirm"
    description: "Confirming bank confirms the LC"
    roles: [ConfirmingBank]
    code: 200
    input: []
    output: LetterOfCredit
    side_effects: ["confirmation_status PENDING → CONFIRMED; if lifecycle=ADVISED → ACTIVE"]

  - method: POST
    path: "/letters-of-credit/{lcId}/cancel"
    description: "Cancel an unused LC"
    roles: [IssuingBank]
    code: 200
    input: [cancelled_reason]
    output: LetterOfCredit
    side_effects: ["lifecycle_status → CANCELLED"]

  # --- Amendments ---
  - method: POST
    path: "/letters-of-credit/{lcId}/amendments"
    description: "Issuing bank initiates an LC amendment"
    roles: [IssuingBank]
    code: 201
    input: [changes]
    output: LcAmendment
    side_effects: ["LcAmendment status=PENDING; LC.amendment_consent_status NONE → PENDING_APPLICANT", "SwiftMessage MT707 generated"]

  - method: GET
    path: "/letters-of-credit/{lcId}/amendments/{amendmentId}"
    description: "Get amendment"
    roles: [Applicant, Beneficiary, IssuingBank, AdvisingBank, ConfirmingBank, Operator, Auditor]
    code: 200
    input: []
    output: LcAmendment
    side_effects: []

  - method: GET
    path: "/letters-of-credit/{lcId}/amendments"
    description: "List amendments under an LC"
    roles: [Applicant, Beneficiary, IssuingBank, AdvisingBank, ConfirmingBank, Operator, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "LcAmendment[]"
    side_effects: []

  - method: POST
    path: "/letters-of-credit/{lcId}/amendments/{amendmentId}/applicant-consent"
    description: "Applicant consents to or rejects amendment"
    roles: [Applicant]
    code: 200
    input: [decision]   # CONSENTED | REJECTED
    output: LcAmendment
    side_effects: ["amendment_consent_status flips per §1.2; on REJECTED reverts to NONE"]

  - method: POST
    path: "/letters-of-credit/{lcId}/amendments/{amendmentId}/beneficiary-consent"
    description: "Beneficiary consents to or rejects amendment"
    roles: [Beneficiary]
    code: 200
    input: [decision]
    output: LcAmendment
    side_effects: ["See §1.2"]

  - method: POST
    path: "/letters-of-credit/{lcId}/amendments/{amendmentId}/confirming-bank-consent"
    description: "Confirming bank consents to or rejects amendment (only when LC has confirming bank)"
    roles: [ConfirmingBank]
    code: 200
    input: [decision]
    output: LcAmendment
    side_effects: ["See §1.2"]

  - method: POST
    path: "/letters-of-credit/{lcId}/amendments/{amendmentId}/withdraw"
    description: "Issuing bank withdraws a pending amendment (only valid before applicant has consented)"
    roles: [IssuingBank]
    code: 200
    input: []
    output: LcAmendment
    side_effects: ["amendment_consent_status → NONE"]

  # --- Presentation ---
  - method: POST
    path: "/letters-of-credit/{lcId}/presentations"
    description: "Beneficiary submits a document presentation"
    roles: [Beneficiary]
    code: 201
    input: [shipment_date, drawing_amount_minor_units]
    output: Presentation
    side_effects: ["status=SUBMITTED, presented_at=now()"]

  - method: GET
    path: "/presentations/{presentationId}"
    description: "Get presentation"
    roles: [Applicant, Beneficiary, IssuingBank, ConfirmingBank, NegotiatingBank, Operator, Auditor]
    code: 200
    input: []
    output: Presentation
    side_effects: []

  - method: GET
    path: "/letters-of-credit/{lcId}/presentations"
    description: "List presentations under an LC"
    roles: [Applicant, Beneficiary, IssuingBank, ConfirmingBank, NegotiatingBank, Operator, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Presentation[]"
    side_effects: []

  - method: POST
    path: "/presentations/{presentationId}/documents"
    description: "Beneficiary attaches a document to a presentation"
    roles: [Beneficiary]
    code: 201
    input: [document_type, issuer, document_date, "stated_amount_minor_units?", "stated_currency?", payload]
    output: Document
    side_effects: ["Documents frozen once Presentation enters UNDER_EXAMINATION"]

  - method: POST
    path: "/presentations/{presentationId}/start-examination"
    description: "Issuing bank starts examination, naming both reviewers"
    roles: [IssuingBank]
    code: 201
    input: [primary_reviewer_id, secondary_reviewer_id]
    output: ExaminationReport
    side_effects: ["Presentation SUBMITTED → UNDER_EXAMINATION; ExaminationReport created in IN_PROGRESS; documents FROZEN"]

  - method: POST
    path: "/examinations/{examinationId}/primary-review"
    description: "Primary reviewer submits review (CLEAN | DISCREPANT plus discrepancies)"
    roles: [Operator]
    code: 200
    input: [primary_outcome, "discrepancies?"]
    output: ExaminationReport
    side_effects: ["status IN_PROGRESS → PRIMARY_DONE; Discrepancy rows created when DISCREPANT"]

  - method: POST
    path: "/examinations/{examinationId}/cross-check"
    description: "Secondary reviewer submits cross-check"
    roles: [Operator]
    code: 200
    input: [secondary_outcome, "discrepancies?"]
    output: ExaminationReport
    side_effects: ["status PRIMARY_DONE → CROSS_CHECK_DONE or CONFLICT (when outcomes diverge); Discrepancy rows updated"]

  - method: POST
    path: "/examinations/{examinationId}/reset"
    description: "Reset examination after CONFLICT (clears reviews + discrepancies; documents remain frozen)"
    roles: [IssuingBank]
    code: 200
    input: []
    output: ExaminationReport
    side_effects: ["status CONFLICT → IN_PROGRESS; primary_outcome/secondary_outcome cleared; Discrepancies deleted"]

  - method: POST
    path: "/examinations/{examinationId}/finalize"
    description: "Issuing bank finalizes examination — promotes Presentation to EXAMINED_CLEAN or EXAMINED_DISCREPANT"
    roles: [IssuingBank]
    code: 200
    input: []
    output: ExaminationReport
    side_effects: ["Cascade: Presentation status update; examined_at=now(); ExaminationReport report_payload computed"]

  - method: GET
    path: "/examinations/{examinationId}"
    description: "Get examination report"
    roles: [Applicant, IssuingBank, ConfirmingBank, NegotiatingBank, Operator, Auditor]
    code: 200
    input: []
    output: ExaminationReport
    side_effects: []

  - method: GET
    path: "/examinations/{examinationId}/discrepancies"
    description: "List discrepancies for an examination"
    roles: [Applicant, IssuingBank, Operator, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Discrepancy[]"
    side_effects: []

  # --- Discrepancy / refusal flow ---
  - method: POST
    path: "/presentations/{presentationId}/applicant-decision"
    description: "Applicant decides on discrepancies (accept all or reject all)"
    roles: [Applicant]
    code: 200
    input: [decision]    # ACCEPTED | REJECTED
    output: Presentation
    side_effects: ["See §1.2 Presentation transitions"]

  - method: POST
    path: "/presentations/{presentationId}/refuse"
    description: "Issuing bank refuses presentation (independent of applicant)"
    roles: [IssuingBank]
    code: 200
    input: [refusal_reason]
    output: Presentation
    side_effects: ["status → REFUSED; refusal_notified_at, refusal_deadline computed"]

  - method: POST
    path: "/presentations/{presentationId}/applicant-override"
    description: "Applicant overrides refusal and accepts documents anyway"
    roles: [Applicant]
    code: 200
    input: []
    output: Presentation
    side_effects: ["status REFUSED → ACCEPTED_BY_APPLICANT; refusal fields nulled (compensating action)"]

  - method: POST
    path: "/presentations/{presentationId}/return-documents"
    description: "Issuing bank returns refused documents to presenter"
    roles: [IssuingBank]
    code: 200
    input: []
    output: Presentation
    side_effects: ["status REFUSED → RETURNED"]

  # --- Settlement ---
  - method: POST
    path: "/presentations/{presentationId}/settlements"
    description: "Create settlement skeleton (PENDING) — settlement_type derived from LC.lc_type"
    roles: [IssuingBank, NegotiatingBank]
    code: 201
    input: ["settlement_type_override?"]   # only NEGOTIATION valid override
    output: PaymentSettlement
    side_effects: ["status=PENDING, principal_minor_units = Presentation.drawing_amount_minor_units"]

  - method: POST
    path: "/settlements/{settlementId}/execute-sight"
    description: "Issuing bank executes sight payment"
    roles: [IssuingBank]
    code: 200
    input: []
    output: PaymentSettlement
    side_effects: ["status PENDING → PAID; beneficiary_proceeds_minor_units computed; LC.drawn_amount_minor_units incremented"]

  - method: POST
    path: "/settlements/{settlementId}/record-acceptance"
    description: "Issuing bank records usance acceptance (sets maturity_date)"
    roles: [IssuingBank]
    code: 200
    input: []
    output: PaymentSettlement
    side_effects: ["status PENDING → ACCEPTED; maturity_date computed; LC.drawn_amount_minor_units incremented"]

  - method: POST
    path: "/settlements/{settlementId}/negotiation-advance"
    description: "Negotiating bank advances funds against negotiated documents"
    roles: [NegotiatingBank]
    code: 200
    input: []
    output: PaymentSettlement
    side_effects: ["status → PAID; negotiation_advance + discount computed; ReimbursementClaim auto-created"]

  - method: POST
    path: "/settlements/{settlementId}/compensate"
    description: "Compensating action — reverses a paid/accepted settlement"
    roles: [IssuingBank]
    code: 200
    input: [reason]
    output: PaymentSettlement
    side_effects: ["status → COMPENSATED; LC.drawn_amount_minor_units decremented; cascade to Presentation EXAMINED_CLEAN"]

  - method: GET
    path: "/settlements/{settlementId}"
    description: "Get settlement"
    roles: [Applicant, Beneficiary, IssuingBank, NegotiatingBank, ConfirmingBank, Operator, Auditor]
    code: 200
    input: []
    output: PaymentSettlement
    side_effects: []

  # --- Reimbursement ---
  - method: GET
    path: "/reimbursement-claims/{claimId}"
    description: "Get reimbursement claim"
    roles: [IssuingBank, NegotiatingBank, Operator, Auditor]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: []

  - method: POST
    path: "/reimbursement-claims/{claimId}/honor"
    description: "Issuing bank honors the reimbursement claim"
    roles: [IssuingBank]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["status SUBMITTED|DISPUTED → HONORED; honored_at=now()"]

  - method: POST
    path: "/reimbursement-claims/{claimId}/dispute"
    description: "Issuing bank disputes the claim (cascades to settlement compensation)"
    roles: [IssuingBank]
    code: 200
    input: [reason]
    output: ReimbursementClaim
    side_effects: ["status SUBMITTED → DISPUTED; cascade settlement.compensate()"]

  - method: POST
    path: "/reimbursement-claims/{claimId}/extinguish"
    description: "Extinguish disputed claim (negotiating bank gives up)"
    roles: [NegotiatingBank]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["status → EXTINGUISHED"]

  # --- SWIFT message ---
  - method: GET
    path: "/swift-messages/{messageId}"
    description: "Get a SWIFT message (immutable)"
    roles: [IssuingBank, AdvisingBank, ConfirmingBank, Operator, Auditor]
    code: 200
    input: []
    output: SwiftMessage
    side_effects: []

  - method: GET
    path: "/letters-of-credit/{lcId}/swift-messages"
    description: "List SWIFT messages bound to an LC"
    roles: [IssuingBank, AdvisingBank, ConfirmingBank, Operator, Auditor]
    code: 200
    input: ["message_type?", "limit?", "offset?"]
    output: "SwiftMessage[]"
    side_effects: []

  # --- Expiry ---
  - method: GET
    path: "/letters-of-credit/{lcId}/expiry-alerts"
    description: "List expiry alerts for an LC"
    roles: [Applicant, Beneficiary, IssuingBank, Operator, Auditor]
    code: 200
    input: []
    output: "ExpiryAlert[]"
    side_effects: []

  # --- External event sync ---
  - method: POST
    path: "/external-events"
    description: "Ingest an external event from banking/customs/logistics/SWIFT"
    roles: [Operator]
    code: 201
    input: [source_system, event_type, lc_id, "presentation_id?", idempotency_key, payload]
    output: ExternalEvent
    side_effects: ["See §1.3 calculations and §1.2 transitions; idempotent on key"]

  - method: GET
    path: "/external-events/{eventId}"
    description: "Get an external event"
    roles: [Operator, Auditor]
    code: 200
    input: []
    output: ExternalEvent
    side_effects: []

  # --- Audit ---
  - method: GET
    path: "/letters-of-credit/{lcId}/audit-log"
    description: "Read the audit log for an LC"
    roles: [Operator, Auditor, IssuingBank]
    code: 200
    input: ["subject_type?", "limit?", "offset?"]
    output: "AuditLogEntry[]"
    side_effects: []

  # --- Test-driving endpoints (clock + sweep) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance server clock (test-driving endpoint). Triggers all clock-driven sweeps."
    roles: [Operator]
    code: 200
    input: [seconds]
    output: Clock
    side_effects:
      - "Clock.now += seconds"
      - "Sweep: refusal-deadline-elapsed → auto-promote EXAMINED_DISCREPANT to EXAMINED_CLEAN"
      - "Sweep: maturity reached → PaymentSettlement ACCEPTED → PAID"
      - "Sweep: LC.expiry_date passed → LC ACTIVE → EXPIRED"
      - "Sweep: ExpiryAlert emission (T_MINUS_15, T_MINUS_5, EXPIRED, PRESENTATION_PERIOD_LAPSED)"

  - method: GET
    path: "/_clock"
    description: "Get current server clock"
    roles: [Operator, Auditor]
    code: 200
    input: []
    output: Clock
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role lacks permission for this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or body-referenced resource id does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, invalid enum value, invalid usance_tenor_days"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch on PATCH/mutation"

  - id: ERR_IDEMPOTENT_REPLAY
    http: 200
    condition: "Idempotency key matched; existing record returned (success-shaped, NOT an error in the envelope)"

  # --- LC issuance / lifecycle ---
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Transition not allowed from current state"

  - id: ERR_APPLICANT_SUSPENDED
    http: 409
    condition: "Applicant.status=SUSPENDED at LC submit"

  - id: ERR_BENEFICIARY_SUSPENDED
    http: 409
    condition: "Beneficiary.status=SUSPENDED at LC submit"

  - id: ERR_BANK_ROLE_MISMATCH
    http: 422
    condition: "Bank assigned to a role-slot is not registered with that bank_role"

  - id: ERR_CONFIRMING_BANK_REQUIRED
    http: 409
    condition: "confirmation_required=true but confirming_bank_id missing OR vice versa"

  - id: ERR_EXPIRY_IN_PAST
    http: 422
    condition: "expiry_date <= now() at submit"

  - id: ERR_SHIPMENT_AFTER_EXPIRY
    http: 422
    condition: "latest_shipment_date > expiry_date"

  - id: ERR_SWIFT_NOT_DELIVERED
    http: 409
    condition: "MT700 not yet generated; LC cannot be advised"

  - id: ERR_LC_HAS_DRAWINGS
    http: 409
    condition: "Cannot cancel LC with non-zero drawn_amount_minor_units"

  - id: ERR_LC_HAS_OPEN_PRESENTATIONS
    http: 409
    condition: "Cannot cancel LC with non-terminal presentations"

  - id: ERR_LC_INSUFFICIENT_AVAILABLE
    http: 409
    condition: "Drawing amount exceeds LC.available_amount_minor_units"

  - id: ERR_LC_NOT_AMENDABLE
    http: 409
    condition: "Amendment attempted while lifecycle_status NOT IN {ISSUED, ADVISED, ACTIVE}"

  - id: ERR_PRESENTATION_AFTER_EXPIRY
    http: 409
    condition: "Presentation submitted after LC.expiry_date"

  - id: ERR_SHIPMENT_OUT_OF_WINDOW
    http: 422
    condition: "Presentation.shipment_date > LC.latest_shipment_date OR shipment_date > now()"

  # --- Amendment ---
  - id: ERR_AMENDMENT_PENDING
    http: 409
    condition: "Another amendment already pending on this LC"

  - id: ERR_AMENDMENT_VIOLATES_PRESENTATIONS
    http: 409
    condition: "Amendment-merge cross-entity violation (e.g., new latest_shipment_date < an existing Presentation.shipment_date)"

  - id: ERR_AMENDMENT_CONSENT_OUT_OF_ORDER
    http: 409
    condition: "Beneficiary or confirming-bank consent attempted before applicant consent"

  - id: ERR_AMENDMENT_ALREADY_DECIDED
    http: 409
    condition: "Consent attempted on already CONSENTED/REJECTED amendment"

  # --- Examination ---
  - id: ERR_REVIEWER_SAME_PERSON
    http: 422
    condition: "primary_reviewer_id = secondary_reviewer_id"

  - id: ERR_REVIEW_ALREADY_RECORDED
    http: 409
    condition: "Primary or secondary review already submitted"

  - id: ERR_REVIEW_OUT_OF_ORDER
    http: 409
    condition: "Cross-check submitted before primary review"

  - id: ERR_DOCUMENTS_FROZEN
    http: 409
    condition: "Document mutation while Presentation is UNDER_EXAMINATION (or later)"

  - id: ERR_DOCUMENT_NOT_REQUIRED_OR_DUPLICATE
    http: 422
    condition: "document_type not in LC.required_documents or duplicates an existing non-COMMERCIAL_INVOICE document"

  - id: ERR_EXAMINATION_DEADLINE_PASSED
    http: 409
    condition: "Finalize attempted after Presentation.presented_at + 5 banking days; UCP600 reasonable-time exhausted"

  # --- Discrepancy / refusal ---
  - id: ERR_REFUSAL_DEADLINE_PASSED
    http: 409
    condition: "Issuing bank refuse() called after 5 banking days from presented_at; right to refuse expired"

  - id: ERR_RETURN_WINDOW_PASSED
    http: 409
    condition: "return-documents called more than 7 banking days after refusal_notified_at"

  # --- Settlement / reimbursement ---
  - id: ERR_SETTLEMENT_TYPE_MISMATCH
    http: 422
    condition: "execute-sight on USANCE settlement, record-acceptance on SIGHT settlement, or negotiation-advance on non-NEGOTIATION settlement"

  - id: ERR_MATURITY_NOT_REACHED
    http: 409
    condition: "USANCE settlement payment attempted before maturity_date (manual override blocked)"

  - id: ERR_REIMBURSEMENT_ALREADY_HONORED
    http: 409
    condition: "Honor or dispute on already-HONORED claim"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Corporate buyer requesting the LC"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /letters-of-credit — Create LC"
      - "POST /letters-of-credit/{lcId}/submit — Submit LC for issuance"
      - "POST /letters-of-credit/{lcId}/amendments/{amendmentId}/applicant-consent"
      - "POST /presentations/{presentationId}/applicant-decision"
      - "POST /presentations/{presentationId}/applicant-override"
    shared_operations:
      - "GET /letters-of-credit/{lcId}"
      - "GET /letters-of-credit"
      - "GET /letters-of-credit/{lcId}/amendments/*"
      - "GET /presentations/{presentationId}"
      - "GET /letters-of-credit/{lcId}/presentations"
      - "GET /examinations/{examinationId}"
      - "GET /examinations/{examinationId}/discrepancies"
      - "GET /settlements/{settlementId}"
      - "GET /letters-of-credit/{lcId}/expiry-alerts"

  - name: Beneficiary
    description: "Exporter / seller named on the LC"
    identity: "entity_backed:Beneficiary"
    exclusive_operations:
      - "POST /letters-of-credit/{lcId}/presentations"
      - "POST /presentations/{presentationId}/documents"
      - "POST /letters-of-credit/{lcId}/amendments/{amendmentId}/beneficiary-consent"
    shared_operations:
      - "GET /letters-of-credit/{lcId}"
      - "GET /letters-of-credit"
      - "GET /letters-of-credit/{lcId}/amendments/*"
      - "GET /presentations/{presentationId}"
      - "GET /settlements/{settlementId}"
      - "GET /letters-of-credit/{lcId}/expiry-alerts"

  - name: IssuingBank
    description: "Bank issuing the LC; performs term review, examination, refusal, payment"
    identity: "entity_backed:Bank"
    exclusive_operations:
      - "POST /letters-of-credit/{lcId}/return-to-applicant"
      - "POST /letters-of-credit/{lcId}/issue"
      - "POST /letters-of-credit/{lcId}/cancel"
      - "POST /letters-of-credit/{lcId}/amendments"
      - "POST /letters-of-credit/{lcId}/amendments/{amendmentId}/withdraw"
      - "POST /presentations/{presentationId}/start-examination"
      - "POST /examinations/{examinationId}/reset"
      - "POST /examinations/{examinationId}/finalize"
      - "POST /presentations/{presentationId}/refuse"
      - "POST /presentations/{presentationId}/return-documents"
      - "POST /settlements/{settlementId}/execute-sight"
      - "POST /settlements/{settlementId}/record-acceptance"
      - "POST /settlements/{settlementId}/compensate"
      - "POST /reimbursement-claims/{claimId}/honor"
      - "POST /reimbursement-claims/{claimId}/dispute"
    shared_operations:
      - "GET /letters-of-credit/{lcId}"
      - "GET /letters-of-credit"
      - "GET /letters-of-credit/{lcId}/audit-log"
      - "GET /presentations/{presentationId}"
      - "POST /presentations/{presentationId}/settlements (with NegotiatingBank)"

  - name: AdvisingBank
    description: "Bank advising the LC to the beneficiary"
    identity: "entity_backed:Bank"
    exclusive_operations:
      - "POST /letters-of-credit/{lcId}/advise"
    shared_operations:
      - "GET /letters-of-credit/{lcId}"
      - "GET /letters-of-credit/{lcId}/swift-messages"

  - name: ConfirmingBank
    description: "Bank adding its own undertaking to the LC"
    identity: "entity_backed:Bank"
    exclusive_operations:
      - "POST /letters-of-credit/{lcId}/confirm"
      - "POST /letters-of-credit/{lcId}/amendments/{amendmentId}/confirming-bank-consent"
    shared_operations:
      - "GET /letters-of-credit/{lcId}"
      - "GET /letters-of-credit/{lcId}/swift-messages"

  - name: NegotiatingBank
    description: "Bank advancing funds against negotiated documents and claiming reimbursement"
    identity: "entity_backed:Bank"
    exclusive_operations:
      - "POST /settlements/{settlementId}/negotiation-advance"
      - "POST /reimbursement-claims/{claimId}/extinguish"
    shared_operations:
      - "POST /presentations/{presentationId}/settlements (with IssuingBank, only when override=NEGOTIATION)"
      - "GET /presentations/{presentationId}"
      - "GET /reimbursement-claims/{claimId}"

  - name: Operator
    description: "Platform operator: registers reference data, reviews documents (primary/secondary), ingests external events, advances test clock"
    identity: opaque
    exclusive_operations:
      - "POST /banks"
      - "POST /applicants"
      - "POST /beneficiaries"
      - "POST /examinations/{examinationId}/primary-review"
      - "POST /examinations/{examinationId}/cross-check"
      - "POST /external-events"
      - "POST /_clock/advance"
      - "GET /_clock"
    shared_operations:
      - "GET /letters-of-credit/{lcId}/audit-log"
      - "GET /external-events/{eventId}"

  - name: Auditor
    description: "Read-only audit role"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /letters-of-credit/{lcId}"
      - "GET /letters-of-credit"
      - "GET /letters-of-credit/{lcId}/audit-log"
      - "GET /letters-of-credit/{lcId}/swift-messages"
      - "GET /external-events/{eventId}"
