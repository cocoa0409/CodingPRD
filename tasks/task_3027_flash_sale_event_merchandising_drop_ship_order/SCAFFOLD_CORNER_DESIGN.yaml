            - "the penalty is min(round_half_up(4000 * 1.50) == 6000, round_half_up(10000 * 0.40) == 4000) == 4000"
            - "sell_through is 10 / max(6, 1) == 1.6667 so buffer_credit_cents is round_half_up(1.6667 * 2500) == 4167"
            - "Event.${event_id}.net_contribution_cents == 4167 — max(10000 - 6000 - 4000 + 4167, round_half_up(10000 * 0.15) == 1500)"
