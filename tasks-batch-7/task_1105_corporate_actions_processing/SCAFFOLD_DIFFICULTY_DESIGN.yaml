  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: election_state_error_beats_deadline_error
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_EVENT_NOT_ACCEPTING_ELECTIONS]
          - errors[ERR_ELECTION_DEADLINE_PASSED]
        distinguishing_aspect: |
          Category pair state-vs-business_temporal: the event is DRAFT (state
          failure, priority 6) AND the clock is past the deadline (temporal
          failure, priority 10); the higher-priority state error
          ERR_EVENT_NOT_ACCEPTING_ELECTIONS must win.
        test_recipe:
          setup:
            - "ACME + NEWCO securities; account A1 (10 sh); MERGER event left in DRAFT; deadline 2026-05-10T16:00:00Z already past at clock 2026-05-11"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSP000901", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/securities", payload: { ticker: "NWC", cusip: "CUSP000902", name: "Newco Inc" }, as: DeskAdministrator, captures: { newco_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One" }, as: DeskAdministrator, captures: { a1: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 10, acquisition_date: "2026-04-01", cost_basis_total_cents: 50000 }, as: DeskAdministrator }
