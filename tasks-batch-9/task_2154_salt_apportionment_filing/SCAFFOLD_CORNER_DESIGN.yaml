              payload: {name: "OCC Payment Group", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED", safe_harbor_basis: "PRIOR_YEAR_110", prior_year_tax: 40000}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
          trigger:
            - call: "GET /salt/registrations/${reg_ca_id}"
              payload: {}
              as: Controller
              captures: {reg_v1: $.data.version}
            - call: "POST /salt/registrations/${reg_ca_id}/payments"
              payload: {tax_year: 2026, installment_number: 1, amount: 8000.00, paid_on_date: "2026-04-15T00:00:00Z", expected_registration_version: "${reg_v1}"}
              as: Controller
              captures: {pay1_id: $.data.id}
            - call: "POST /salt/registrations/${reg_ca_id}/payments"
              payload: {tax_year: 2026, installment_number: 2, amount: 8000.00, paid_on_date: "2026-06-15T00:00:00Z", expected_registration_version: "${reg_v1}"}
              as: Controller
              captures: {err_id: $.data.error_id}
            - call: "GET /salt/registrations/${reg_ca_id}"
              payload: {}
              as: Controller
              captures: {reg_v2: $.data.version}
            - call: "POST /salt/registrations/${reg_ca_id}/payments"
              payload: {tax_year: 2026, installment_number: 2, amount: 8000.00, paid_on_date: "2026-06-15T00:00:00Z", expected_registration_version: "${reg_v2}"}
              as: Controller
              captures: {pay2_id: $.data.id}
          assert:
            - "the second trigger returns HTTP 412 with data.error_id == ERR_STALE_REGISTRATION_VERSION"
            - "after the second trigger StateRegistration.${reg_ca_id}.total_payments_received == 8000.00"
            - "the fourth trigger returns HTTP 201 and EstimatedPayment.${pay2_id}.safe_harbor_required_amount == 22000.00"
            - "EstimatedPayment.${pay2_id}.underpayment_amount == 6000.00 and underpayment_penalty == 300.00"
            - "StateRegistration.${reg_ca_id}.total_payments_received == 16000.00 at the end"

      - name: filing_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.StateFiling.fields.version
          - endpoints[POST /salt/filings/{id}/modifications]
          - endpoints[POST /salt/filings/{id}/compute-factors]
        distinguishing_aspect: "StateFiling.version starts at 1 on create and increments by exactly 1 on each of the three following mutations, reaching 4 after two modification writes and one compute-factors run."
        test_recipe:
          setup:
            - "Baseline CA fixture through registration completion, with a freshly created DRAFT 2026 return and no modifications yet."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Meridian Industries", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Meridian Manufacturing", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_a_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Meridian Services", incorporation_state_code: "NV", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_b_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED", due_month: 4, due_day: 15, extension_months: 6}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 1200000, origin_sales: 300000, purchaser_taxable_in_state: false, property_average_value: 800000, rented_property_annual_rent: 25000, payroll_compensation: 500000, employee_days_in_state: 40, protected_solicitation_only: false}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_b_id}", tax_year: 2026, destination_sales: 400000, service_receipts: 250000, cost_of_performance_state_code: "NV", payroll_compensation: 100000, employee_days_in_state: 5, protected_solicitation_only: true}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/evaluate-nexus"
              payload: {as_of_tax_year: 2026}
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/complete-registration"
              payload: {state_account_number: "CA-99887766"}
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/filings"
              payload: {tax_year: 2026, filing_basis: "COMBINED_UNITARY", federal_taxable_income: 5000000}
              as: StateAnalyst
              captures: {f_id: $.data.id}
          trigger:
            - call: "GET /salt/filings/${f_id}"
              payload: {}
              as: StateAnalyst
              captures: {v0: $.data.version}
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "STATE_TAX_ADDBACK", direction: "ADDITION", raw_amount: 125042.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "MUNI_INTEREST_SUB", direction: "SUBTRACTION", raw_amount: 92379.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/compute-factors"
              payload: {apportionment_variant: "JOYCE"}
              as: StateAnalyst
              captures: {v3: $.data.version}
          assert:
            - "the first trigger shows StateFiling.${f_id}.version == 1"
            - "after the two modification writes StateFiling.${f_id}.version == 3"
            - "after compute-factors StateFiling.${f_id}.version == 4"
            - "StateFiling.${f_id}.modification_total == 261.31 and updated_at advanced on every mutation"

  - section: consistency_model
    instances:

      - name: cascade_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - calculations.filing_balance_due
          - endpoints[POST /salt/filings/{id}/compute-factors]
        excluded_because:
          difficulty_instance: transitive_cascade / compute_factors_four_link_liability_cascade
          rationale: "That difficulty instance asserts all four cascade links are already reflected in the state observed immediately after the single triggering request, with no deferred reconciliation step."

