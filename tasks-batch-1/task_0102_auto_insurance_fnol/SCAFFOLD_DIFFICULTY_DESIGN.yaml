          - validations[priority=11]
          - state_machines.Claim.UNDER_REVIEW_to_REPAIR_APPROVED
        distinguishing_aspect: |
          Category pair state (priority 5, ERR_INVALID_STATE) vs business_constraint (priority 11,
          ERR_NO_SUBMITTED_ESTIMATE). The claim is only COVERAGE_VERIFIED (never assigned, so the
          decide-disposition from-state UNDER_REVIEW is unsatisfiable) AND has no SUBMITTED estimate
          — both checks are genuinely violated; the lower-numbered state check wins, so the observed
          error is ERR_INVALID_STATE, not ERR_NO_SUBMITTED_ESTIMATE.
        test_recipe:
          setup:
