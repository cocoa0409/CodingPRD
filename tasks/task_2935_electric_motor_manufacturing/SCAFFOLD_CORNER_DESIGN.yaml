            - "${e_range} == ERR_INVALID_REQUEST with HTTP 400 (rated_output_kw floor is 4.0)"
            - "${e_instant} == ERR_INVALID_REQUEST with HTTP 400 (instant lacks the three fractional digits)"
            - "${e_limit} == ERR_INVALID_REQUEST with HTTP 400 (pagination limit maximum is 100)"
            - "the logical clock is still 2026-08-01T00:00:00.000Z after the rejected clock write"
            - "GET /motor-designs with no params returns total_count == 0 — no design row was created"

      - name: body_foreign_keys_are_validated_across_peer_collections
        claim_type: parent_relationships
        grounds:
