            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq}", as: PadOperator, captures: { op: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op}/start", payload: { oat_celsius: 0 }, as: PadOperator }
          trigger:
            - { call: "POST /deice-ops/deice-operations/${op}/complete", payload: { actual_liters: 3, collected_liters: 2 }, as: PadOperator, captures: { pct: $.data.collection_pct, flg: $.data.collection_flag } }
          assert:
            - "collection_pct == 66.67 (2/3 rounded half-up to 2 decimals)"
            - "collection_flag == OK (66.67 >= 50.0)"

      - name: tier_boundary_straddle_at_5000
        claim_type: boundary_edge
        grounds: [calculations.invoice_charges]
        distinguishing_aspect: "With monthly_billed_liters base 4999, a 2 L operation straddles the tier-1/tier-2 boundary: 1 L @ 90 c + 1 L @ 82.8 c rounded to 83 c = 173 c fluid charge."
        test_recipe:
          setup:
            - "Station with ACTIVE permit, TYPE_I tank (50000 L), MEDIUM and SMALL pads, airline"
            - "Op1 (MEDIUM pad, actual 4999 L) CLEARED + invoice ISSUED so monthly_billed_liters == 4999"
            - "Op2 (SMALL pad, actual 2 L) CLEARED; no weather event ACTIVE"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 50000, on_hand_liters: 50000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "PM", max_size_class: "MEDIUM", rated_collection_pct: 60 }, as: StationAdmin, captures: { pdm: $.data.id } }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "PS", max_size_class: "SMALL", rated_collection_pct: 60 }, as: StationAdmin, captures: { pds: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq1: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq1}/assign", payload: { pad_id: "${pdm}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq1}", as: PadOperator, captures: { op1: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op1}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op1}/start", payload: { oat_celsius: 0 }, as: PadOperator }
            - { call: "POST /deice-ops/deice-operations/${op1}/complete", payload: { actual_liters: 4999, collected_liters: 2600 }, as: PadOperator }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op1}", kind: "POST_TREATMENT", result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "GET /deice-ops/airlines/${al}", as: BillingClerk, captures: { av1: $.data.version } }
            - { call: "POST /deice-ops/invoices", payload: { operation_id: "${op1}", expected_airline_version: "${av1}" }, as: BillingClerk, captures: { inv1: $.data.id } }
            - { call: "POST /deice-ops/invoices/${inv1}/issue", payload: {}, as: BillingClerk }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA2", aircraft_type: "E190", size_class: "SMALL", scheduled_departure: "2026-05-01T13:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq2: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq2}/assign", payload: { pad_id: "${pds}", window_start: "2026-05-01T11:00:00Z", window_end: "2026-05-01T11:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq2}", as: PadOperator, captures: { op2: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op2}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op2}/start", payload: { oat_celsius: 0 }, as: PadOperator }
            - { call: "POST /deice-ops/deice-operations/${op2}/complete", payload: { actual_liters: 2, collected_liters: 2 }, as: PadOperator }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op2}", kind: "POST_TREATMENT", result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "GET /deice-ops/airlines/${al}", as: BillingClerk, captures: { av2: $.data.version } }
          trigger:
            - { call: "POST /deice-ops/invoices", payload: { operation_id: "${op2}", expected_airline_version: "${av2}" }, as: BillingClerk, captures: { fc: $.data.fluid_charge_cents, tc: $.data.total_cents } }
          assert:
            - "fluid_charge_cents == 173 (1 L at index 4999 in tier 1 = 90 c; 1 L at index 5000 in tier 2 = round_half_up(82.8) = 83 c)"
            - "total_cents == 20173 (pad SMALL 20000 + 173, no storm)"

      - name: reserved_liters_reconciled_on_abort
        claim_type: aggregation_reconciliation
        grounds: [calculations.reserved_liters_calc]
        distinguishing_aspect: "Aborting a QUEUED request removes it from the reserved_liters input set: the tank's reserved 500 drops to 0 and available_liters returns to on_hand_liters."
        test_recipe:
          setup: ["Station with TYPE_I tank (5000 L), airline; RESERVED MEDIUM request QUEUED"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id } }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin, captures: { tk: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
            - { call: "GET /deice-ops/fluid-tanks/${tk}", as: PadOperator, captures: { res0: $.data.reserved_liters } }
          trigger:
            - { call: "POST /deice-ops/deice-requests/${rq}/abort", payload: {}, as: AirlineRep, as_user_id: "${al}", captures: { stt: $.data.status } }
            - { call: "GET /deice-ops/fluid-tanks/${tk}", as: PadOperator, captures: { res1: $.data.reserved_liters, av1: $.data.available_liters } }
          assert:
            - "Before abort: reserved_liters == 500"
            - "After abort: status == ABORTED, reserved_liters == 0, available_liters == 5000"

      - name: replenish_retries_unreserved_request_via_selector
        claim_type: selector_fallback_retry
        grounds: [calculations.tank_selector]
        distinguishing_aspect: "Empty-pool fallback then retry: with the only TYPE_I tank EMPTY the request is created UNRESERVED with null tank; replenishing that tank re-runs the selector and reserves it (queue-order retry on replenish)."
        test_recipe:
          setup: ["Station with TYPE_I tank on_hand 0 (status EMPTY); one SMALL request created UNRESERVED"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id } }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 0, reorder_threshold_liters: 300 }, as: StationAdmin, captures: { tk: $.data.id, tk_st: $.data.status } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "E190", size_class: "SMALL", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id, frs0: $.data.fluid_reservation_status } }
          trigger:
            - { call: "POST /deice-ops/fluid-tanks/${tk}/replenish", payload: { liters: 1000 }, as: StationAdmin, captures: { tk_st2: $.data.status } }
            - { call: "GET /deice-ops/deice-requests/${rq}", as: PadOperator, captures: { frs1: $.data.fluid_reservation_status, tid1: $.data.assigned_tank_id } }
            - { call: "GET /deice-ops/stations/${st}", as: StationAdmin, captures: { alert: $.data.active_supply_alert } }
          assert:
            - "At creation: tank status EMPTY; request fluid_reservation_status == UNRESERVED and assigned_tank_id == null"
            - "After replenish 1000 L: request RESERVED with assigned_tank_id == ${tk}; tank reserved_liters == 200 (SMALL estimate)"
            - "Station active_supply_alert == false after replenish (available 800 >= threshold 300)"

      - name: weather_severity_drives_required_crew
        claim_type: correct_result
        grounds: [calculations.staffing_requirement]
        distinguishing_aspect: "LEVEL_2 maps to required_crew_count 8; escalating with 5 keeps staffing SHORT, escalating to exactly 8 flips it ADEQUATE (>= semantics), and escalation_level accumulates."
        test_recipe:
          setup: ["Station with a FORECASTED LEVEL_2 weather event"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id } }
            - { call: "POST /deice-ops/weather-events", payload: { station_id: "${st}", precip_type: "FREEZING_RAIN", precip_rate: "MODERATE", severity: "LEVEL_2", started_at: "2026-05-01T00:00:00Z" }, as: StationAdmin, captures: { we: $.data.id, rc: $.data.required_crew_count, ss0: $.data.staffing_status } }
          trigger:
            - { call: "POST /deice-ops/weather-events/${we}/escalate", payload: { assigned_crew_count: 5 }, as: StationAdmin, captures: { ss1: $.data.staffing_status, el1: $.data.escalation_level } }
            - { call: "POST /deice-ops/weather-events/${we}/escalate", payload: { assigned_crew_count: 8 }, as: StationAdmin, captures: { ss2: $.data.staffing_status, el2: $.data.escalation_level } }
          assert:
            - "required_crew_count == 8 at creation; staffing_status == SHORT (assigned 0)"
            - "After escalate 5: staffing_status == SHORT, escalation_level == 1"
            - "After escalate 8: staffing_status == ADEQUATE (8 >= 8), escalation_level == 2"

  # =================================================================
  # Section: validations
  # =================================================================
  - section: validations
    instances:
      - name: missing_role_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without a declared X-User-Role is rejected ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Nothing needed beyond a reachable endpoint"]
          setup_api_calls: []
          trigger:
            - { call: "POST /deice-ops/pads", payload: { station_id: "123e4567-e89b-42d3-a456-426614174000", code: "P1", max_size_class: "SMALL", rated_collection_pct: 60 }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and HTTP status 401 (role header absent/unknown wins over existence)"

      - name: priority_state_beats_safety_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        excluded_because:
          difficulty_instance: start_state_violation_beats_sod_safety
          rationale: "The state vs business_safety priority conflict is asserted as the failure path of the named §1.8 instance."

      - name: priority_safety_beats_constraint_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=6]"]
        excluded_because:
          difficulty_instance: permit_suspension_beats_pad_incompatibility
          rationale: "The business_safety vs business_constraint priority conflict is asserted as the failure path of the named §1.8 instance."

  # =================================================================
  # Section: endpoints
  # =================================================================
  - section: endpoints
    instances:
      - name: list_pagination_envelope_fields
        claim_type: pagination
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoints honor limit/offset and report total_count and has_more: two pads with limit=1 page into two single-item pages with has_more true then false."
        test_recipe:
          setup: ["Station with two pads P1, P2"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id } }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "SMALL", rated_collection_pct: 60 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P2", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin }
          trigger:
            - { call: "GET /deice-ops/pads?station_id=${st}&limit=1&offset=0", as: StationAdmin }
            - { call: "GET /deice-ops/pads?station_id=${st}&limit=1&offset=1", as: StationAdmin }
          assert:
            - "Page 1: exactly 1 item, total_count == 2, has_more == true"
            - "Page 2: exactly 1 item, total_count == 2, has_more == false"
            - "Envelope carries meta.api_request_id and meta.api_request_timestamp and response_type == array"

      - name: create_response_envelope_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "A successful create returns the fixed envelope: meta block with api_request_id/timestamp, response_type object, and the entity under data."
        test_recipe:
          setup: ["Nothing"]
          setup_api_calls: []
          trigger:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { sid: $.data.id } }
          assert:
            - "HTTP 201; body has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == object; data.id present; data.posture == NORMAL; data.ops_epoch_index == 0"

  # =================================================================
  # Section: errors
  # =================================================================
  - section: errors
    instances:
      - name: replenish_beyond_tank_capacity_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_TANK_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Replenish that would push on_hand above capacity rejects; a replenish landing exactly at capacity succeeds (<= semantics)."
        test_recipe:
          setup: ["Station with TYPE_I tank on_hand 900, capacity 1000"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id } }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 1000, on_hand_liters: 900, reorder_threshold_liters: 300 }, as: StationAdmin, captures: { tk: $.data.id } }
          trigger:
            - { call: "POST /deice-ops/fluid-tanks/${tk}/replenish", payload: { liters: 200 }, as: StationAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /deice-ops/fluid-tanks/${tk}/replenish", payload: { liters: 100 }, as: StationAdmin, captures: { onh: $.data.on_hand_liters } }
          assert:
            - "200 L replenish: error_id == ERR_TANK_CAPACITY_EXCEEDED (900+200 > 1000)"
            - "100 L replenish: succeeds, on_hand_liters == 1000 (exactly at capacity allowed)"

      - name: small_pad_rejects_large_request
        claim_type: violation_to_error
        grounds: ["errors[ERR_PAD_INCOMPATIBLE]"]
        distinguishing_aspect: "Pad max_size_class SMALL cannot serve a LARGE request: assign fails ERR_PAD_INCOMPATIBLE while posture and availability are fine."
        test_recipe:
          setup: ["Station with ACTIVE permit, TYPE_I tank (5000 L), SMALL pad AVAILABLE, airline, RESERVED LARGE request"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "PS", max_size_class: "SMALL", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "B77W", size_class: "LARGE", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
          trigger:
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PAD_INCOMPATIBLE; request stays QUEUED"

      - name: operation_void_blocked_by_open_invoice
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPERATION_INVOICED]"]
        distinguishing_aspect: "A CLEARED operation with a DRAFT invoice cannot be voided: ERR_OPERATION_INVOICED protects billing referential integrity."
        test_recipe:
          setup: ["Full flow: op CLEARED (actual 300); DRAFT invoice exists for it"]
          setup_api_calls:
