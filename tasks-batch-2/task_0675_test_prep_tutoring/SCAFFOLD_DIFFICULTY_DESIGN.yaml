              as: Registrar
              captures: { cohort_v1: $.data.version }
            - call: "POST /students/register"
              payload: { email: "a@x.com", full_name: "A" }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /students/register"
              payload: { email: "b@x.com", full_name: "B" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${a_id}", cohort_id: "${cohort_id}", expected_cohort_version: "${cohort_v1}" }
              as: Student
              as_user_id: "${a_id}"
              captures: { enr_a: $.data.id, cohort_v2: $.data.version }
            - call: "POST /enrollments"
              payload: { student_id: "${b_id}", cohort_id: "${cohort_id}", expected_cohort_version: "${cohort_v2}" }
