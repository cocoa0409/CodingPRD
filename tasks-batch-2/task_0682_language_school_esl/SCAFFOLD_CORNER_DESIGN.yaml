              captures: { sb: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${sa}", cohort_id: "${cid}" }
              as: Registrar
              captures: { enrA: $.data.id }
          trigger:
            - call: "POST /add-ons"
              payload: { student_id: "${sb}", enrollment_id: "${enrA}", add_on_type: "CONVERSATION_CLUB", units: 4 }
              as: Registrar
              captures: { eid: $.data.error_id }
          assert:
