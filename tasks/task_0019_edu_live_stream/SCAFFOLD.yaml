# =============================================================================
# task_0019_edu_live_stream — Online Education Live Streaming Platform
# Generated by prd-bench-scaffold-generator (§1.0–§1.7)
# =============================================================================

scenario: |
  Online education live streaming platform: course publishing with course catalog,
  instructor profile, syllabus and outline, pricing and discount configuration, and
  shelving/delisting review; class management with student enrollment, class grouping,
  teaching assistant assignment, and class-level announcements; live class scheduling
  with time slot configuration, instructor availability, room conflict check,
  makeup-class arrangement, and recording playback configuration; student attendance
  with check-in rules (time window/code/face), late and absence marking, leave
  application, and attendance statistics; assignment grading with assignment
  publishing, submission collection, multi-format support (text/file/code), grading
  workflow, plagiarism check, and feedback delivery; learning progress tracking with
  chapter-level completion, video watch duration, quiz score aggregation, milestone
  achievement, and at-risk student alerts; refund rule calculation with refund
  eligibility by course progress, time-based refund ratios, partial-refund for hybrid
  courses, deduction rules for materials/services, and refund approval workflow;
  event-driven synchronization with payment, IM, video streaming, and
  certificate-issuance systems; audit logging for enrollment changes and refund records.

domain_name: edu-live-stream
api_prefix: /courses

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine            # refund rule calculation: tiered ratios, deductions, dual interpretations
  secondary_archetype: temporal_windowing      # live-class scheduling, room/instructor availability with distinct interval semantics
  complexity_layers:
    - dual_variant_calculation                 # refund: provisional@request vs final@approval; progress: completion% vs watch-duration%
    - cascading_side_effects                   # course delisting → enrollment freeze → live-class cancellation → refund eligibility flip
    - version_pinning_on_approval              # course shelving snapshots a SyllabusRevision id onto the course
    - rate_threshold_triggers                  # progress thresholds (5/30/60%), time cutoffs (7d/30d), late/absent boundary
    - derived_field_reconciliation             # Enrollment.progress_percent, attendance_count, course.posture
  entity_topology: hybrid                       # Course tree (Course→Chapter, Course→LiveClass) + cross-cutting Enrollment, Attendance, Submission
  state_machine_shape: branching                # Course (DRAFT→UNDER_REVIEW→{PUBLISHED|REJECTED}→DELISTED), with cyclic Submission revision loop and parallel Enrollment dimensions
  relationship_patterns:
    - one_to_many                               # Course→Chapter, Course→LiveClass, Course→Assignment
    - many_to_many                              # Enrollment is the junction between Student and Course
    - cross_aggregate                           # Attendance references LiveClass and Enrollment across aggregates; Submission references Assignment and Enrollment
  role_model: peer_roles                        # Instructor, TeachingAssistant, Student, AcademicAdmin own non-overlapping operations
  consistency_model: immediate                  # all cascading side effects committed in the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Course
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Human-readable course title" }
      - { name: instructor_id, type: string, source: input, description: "FK → Instructor.id (the lead instructor)" }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog price in integer cents; must be >= 0" }
      - { name: discount_percent, type: integer, source: input, default: 0, description: "Promotional discount applied at enrollment time, 0..80" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | PUBLISHED | REJECTED | DELISTED" }
      - { name: posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — derived from status + outstanding refund queue" }
      - { name: published_syllabus_revision_id, type: string, source: computed, description: "FK → SyllabusRevision.id snapshotted at PUBLISHED transition; null otherwise" }
      - { name: total_chapters, type: integer, source: computed, description: "Count of Chapter rows where chapter.course_id == this.id" }
      - { name: total_video_seconds, type: integer, source: computed, description: "Sum of Chapter.video_duration_seconds across all chapters of this course" }
      - { name: enrollment_count, type: integer, source: computed, description: "Count of Enrollment rows with status IN {ACTIVE, AT_RISK, COMPLETED, REFUND_PENDING}" }

  - name: SyllabusRevision
    parent: Course
    common_fields: false                                    # immutable snapshot — id + created_at only
    fields:
      - { name: course_id, type: string, source: system, description: "FK → Course.id" }
      - { name: revision_number, type: integer, source: system, description: "Monotonic per-course revision number, starts at 1" }
      - { name: outline, type: array, source: input, description: "Ordered array of {chapter_title, learning_objectives}; minimum 1 entry" }
      - { name: pricing_snapshot_cents, type: integer, source: system, description: "Course.list_price_cents at the moment this revision was submitted for review" }
      - { name: discount_snapshot_percent, type: integer, source: system, description: "Course.discount_percent at the moment this revision was submitted for review" }

  - name: Chapter
    parent: Course
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "FK → Course.id" }
      - { name: title, type: string, source: input, description: "Chapter title" }
      - { name: ordinal, type: integer, source: input, description: "1-based position; unique within (course_id)" }
      - { name: video_duration_seconds, type: integer, source: input, description: "Authoritative length of the recorded video in seconds; > 0" }
      - { name: required_for_completion, type: boolean, source: input, default: true, description: "If false, chapter is optional and excluded from chapter-completion progress" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Public name shown on course page" }
      - { name: email, type: string, source: input, description: "Unique contact email" }
      - { name: bio, type: string, source: input, description: "Free-form profile bio" }
      - { name: availability_windows, type: array, source: input, description: "Array of {start_ts, end_ts} closed intervals (Unix seconds) when this instructor may be scheduled for live classes" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Public student name" }
      - { name: email, type: string, source: input, description: "Unique contact email" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK → Course.id" }
      - { name: student_id, type: string, source: input, description: "FK → Student.id" }
      - { name: class_group_id, type: string, source: system, description: "FK → ClassGroup.id; assigned at enrollment time, nullable until grouping" }
      - { name: payment_status, type: enum, source: system, description: "PAID | REFUND_PENDING | REFUNDED — independent of learning_status" }
      - { name: learning_status, type: enum, source: system, description: "ACTIVE | AT_RISK | COMPLETED | WITHDRAWN — independent of payment_status" }
      - { name: paid_amount_cents, type: integer, source: system, description: "Amount actually paid at enrollment = list_price_cents * (100 - discount_percent) / 100, integer cents (round_half_up)" }
      - { name: enrolled_at, type: datetime, source: system, description: "ISO 8601 UTC timestamp at the moment of successful enrollment; refund time-window is computed against this" }
      - { name: chapter_completion_percent, type: number, source: computed, description: "Read-only: 100 * required_chapters_completed / total_required_chapters; rounded half-up to 1 decimal" }
      - { name: watch_duration_percent, type: number, source: computed, description: "Read-only: 100 * sum(WatchSession.seconds_watched per chapter capped at chapter.video_duration_seconds) / total_video_seconds; rounded half-up to 1 decimal" }
      - { name: progress_percent, type: number, source: computed, description: "max(chapter_completion_percent, watch_duration_percent); ties resolved to chapter_completion_percent" }
      - { name: attendance_count, type: integer, source: computed, description: "Number of Attendance rows where enrollment_id == this.id AND mark IN {ATTENDED, LATE}" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Final refund amount in cents once refund is APPROVED; null otherwise" }

  - name: ClassGroup
    parent: Course
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "FK → Course.id" }
      - { name: name, type: string, source: input, description: "Group label, e.g. 'Cohort-A'" }
      - { name: capacity, type: integer, source: input, description: "Maximum students; > 0" }
      - { name: ta_instructor_id, type: string, source: input, description: "FK → Instructor.id assigned as Teaching Assistant for this group; nullable" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of Enrollment rows where class_group_id == this.id AND learning_status != WITHDRAWN" }

  - name: Announcement
    parent: ClassGroup
    common_fields: false                                    # immutable post — id + created_at only
    fields:
      - { name: class_group_id, type: string, source: system, description: "FK → ClassGroup.id" }
      - { name: course_id, type: string, source: system, description: "FK → Course.id (denormalized for convenience)" }
      - { name: author_role, type: enum, source: system, description: "INSTRUCTOR | TEACHING_ASSISTANT" }
      - { name: author_id, type: string, source: system, description: "Instructor.id of the author" }
      - { name: body, type: string, source: input, description: "Announcement body; non-empty" }

  - name: LiveClass
    parent: Course
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "FK → Course.id" }
      - { name: chapter_id, type: string, source: input, description: "FK → Chapter.id; the chapter this live session covers; nullable for review sessions" }
      - { name: instructor_id, type: string, source: input, description: "FK → Instructor.id; usually the course's lead but may be a substitute for makeup classes" }
      - { name: room_id, type: string, source: input, description: "Logical room/streaming-channel identifier (string), shared across courses" }
      - { name: start_ts, type: integer, source: input, description: "Unix seconds; class start (inclusive)" }
      - { name: end_ts, type: integer, source: input, description: "Unix seconds; class end (exclusive); end_ts > start_ts" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | LIVE | ENDED | CANCELLED | RESCHEDULED" }
      - { name: checkin_code, type: string, source: system, description: "6-digit alphanumeric code generated at LIVE transition; required for code-based check-in" }
      - { name: recording_playback_enabled, type: boolean, source: input, default: true, description: "If true, ENDED class produces a playback record; if false, no playback contribution to watch_duration" }
      - { name: original_live_class_id, type: string, source: input, default: null, description: "If this is a makeup class, FK → original LiveClass.id; null for primary classes" }

  - name: Attendance
    parent: LiveClass
    common_fields: false                                    # append-only event row — id + created_at only
    fields:
      - { name: live_class_id, type: string, source: system, description: "FK → LiveClass.id" }
      - { name: enrollment_id, type: string, source: system, description: "FK → Enrollment.id" }
      - { name: mark, type: enum, source: computed, description: "ATTENDED | LATE | ABSENT | EXCUSED — derived from check-in time vs window or set by leave-application approval" }
      - { name: checkin_method, type: enum, source: input, description: "TIME_WINDOW | CODE | FACE | LEAVE — which rule produced this row" }
      - { name: checkin_ts, type: integer, source: input, description: "Unix seconds; null when mark == ABSENT or EXCUSED" }
      - { name: code_provided, type: string, source: input, description: "Raw code submitted; null unless checkin_method == CODE" }

  - name: LeaveRequest
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK → Enrollment.id" }
      - { name: live_class_id, type: string, source: input, description: "FK → LiveClass.id; the class to be excused" }
      - { name: reason, type: string, source: input, description: "Free-form reason; non-empty" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }

  - name: Assignment
    parent: Course
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "FK → Course.id" }
      - { name: chapter_id, type: string, source: input, description: "FK → Chapter.id; nullable for course-wide assignments" }
      - { name: title, type: string, source: input, description: "Assignment title" }
      - { name: format, type: enum, source: input, description: "TEXT | FILE | CODE — determines which submission payload field is required" }
      - { name: due_ts, type: integer, source: input, description: "Unix seconds; submissions accepted strictly before due_ts" }
      - { name: max_score, type: integer, source: input, description: "Maximum score for grading; > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | CLOSED" }

  - name: Submission
    parent: Assignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK → Assignment.id" }
      - { name: enrollment_id, type: string, source: input, description: "FK → Enrollment.id" }
      - { name: payload_text, type: string, source: input, description: "Text body when assignment.format == TEXT; otherwise null" }
      - { name: payload_file_url, type: string, source: input, description: "URL when assignment.format == FILE; otherwise null" }
      - { name: payload_code, type: string, source: input, description: "Source code when assignment.format == CODE; otherwise null" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | GRADED — REVISION_REQUESTED → SUBMITTED forms the cyclic revision loop" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of times this submission has re-entered SUBMITTED from REVISION_REQUESTED; capped at 3" }
      - { name: plagiarism_score, type: number, source: computed, description: "0.0..1.0 similarity score; computed at SUBMITTED transition" }
      - { name: score, type: integer, source: input, description: "Final grade in 0..max_score; set at GRADED transition" }
      - { name: feedback, type: string, source: input, description: "Grader feedback text; required for GRADED and REVISION_REQUESTED transitions" }

  - name: WatchSession
    parent: Enrollment
    common_fields: false                                    # append-only telemetry — id + created_at only
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK → Enrollment.id" }
      - { name: chapter_id, type: string, source: input, description: "FK → Chapter.id" }
      - { name: seconds_watched, type: integer, source: input, description: "Seconds of video watched in this session; > 0" }

  - name: RefundRequest
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK → Enrollment.id" }
      - { name: course_id, type: string, source: system, description: "FK → Course.id (denormalized)" }
      - { name: requested_at, type: datetime, source: system, description: "ISO 8601 UTC at request creation; used for time-window in provisional calculation" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED — workflow gated by AcademicAdmin" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Refund computed at request creation using progress at requested_at" }
      - { name: provisional_progress_percent, type: number, source: computed, description: "Enrollment.progress_percent snapshot at requested_at, rounded half-up to 1 decimal" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Refund computed at APPROVED transition using progress at approval time; nullable until APPROVED" }
      - { name: materials_kit_count, type: integer, source: input, default: 0, description: "Shipped material kits to deduct at MATERIALS_KIT_DEDUCTION_CENTS each" }
      - { name: rejection_reason, type: string, source: input, description: "Required for REJECTED transition; null otherwise" }

  - name: AuditLogEntry
    parent: null
    common_fields: false                                    # append-only — id + created_at only
    fields:
      - { name: actor_role, type: enum, source: system, description: "INSTRUCTOR | TEACHING_ASSISTANT | STUDENT | ACADEMIC_ADMIN" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the actor" }
      - { name: action, type: enum, source: system, description: "ENROLLMENT_CREATED | ENROLLMENT_GROUPED | ENROLLMENT_WITHDRAWN | REFUND_REQUESTED | REFUND_APPROVED | REFUND_REJECTED" }
      - { name: subject_type, type: enum, source: system, description: "ENROLLMENT | REFUND_REQUEST" }
      - { name: subject_id, type: string, source: system, description: "id of the subject row" }
      - { name: detail, type: object, source: system, description: "JSON snapshot of relevant before/after fields for the action" }

  - name: Clock
    parent: null
    common_fields: false
    fields:
      - { name: now_ts, type: integer, source: system, description: "Test-driving wall-clock value in Unix seconds; advanced via POST /_clock/advance to drive time-gated transitions" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- Course (BRANCHING with revert) -----
  - entity: Course
    initial_state: DRAFT
    terminal_states: [DELISTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: POST /courses/{courseId}/submit-for-review
        actor: Instructor
        preconditions:
          - "Course.instructor_id == X-User-ID (ERR_FORBIDDEN_NOT_OWNER)"
          - "At least one Chapter exists with required_for_completion=true (ERR_COURSE_NO_CHAPTERS)"
          - "list_price_cents >= 0 and discount_percent in [0,80] (ERR_INVALID_PRICING)"
        side_effects:
          - "A new SyllabusRevision row is created (revision_number = max+1) capturing pricing_snapshot_cents and discount_snapshot_percent"

      - from: UNDER_REVIEW
        to: PUBLISHED
        trigger: POST /courses/{courseId}/approve
        actor: AcademicAdmin
        preconditions:
          - "Course must be UNDER_REVIEW (ERR_COURSE_NOT_UNDER_REVIEW)"
        side_effects:
          - "published_syllabus_revision_id is set to the latest SyllabusRevision.id (version-pinning)"
          - "posture recomputed → OPEN"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: POST /courses/{courseId}/reject
        actor: AcademicAdmin
        preconditions:
          - "Course must be UNDER_REVIEW (ERR_COURSE_NOT_UNDER_REVIEW)"
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: POST /courses/{courseId}/return-to-draft
        actor: Instructor
        preconditions:
          - "Course.instructor_id == X-User-ID (ERR_FORBIDDEN_NOT_OWNER)"
          - "Course must be REJECTED (ERR_COURSE_NOT_REJECTED)"
        side_effects: []
        note: "Forms the revert leg of the branching shape (DRAFT→UNDER_REVIEW→{PUBLISHED|REJECTED}→DRAFT)."

      - from: PUBLISHED
        to: DELISTED
        trigger: POST /courses/{courseId}/delist
        actor: AcademicAdmin
        preconditions:
          - "Course must be PUBLISHED (ERR_COURSE_NOT_PUBLISHED)"
        side_effects:
          - "Cascade depth-3 (link 1): all SCHEDULED LiveClass rows for this course → CANCELLED with reason='COURSE_DELISTED'"
          - "Cascade link 2: every CANCELLED transition above auto-fires its own side effect — for each ACTIVE Enrollment.learning_status whose attendance window overlaps a cancelled live class, learning_status → AT_RISK"
          - "Cascade link 3: every Enrollment that flipped to AT_RISK in link 2 has its refund_eligibility re-derived; any PENDING RefundRequest on those enrollments has provisional_amount_cents recomputed using the now-frozen course"
          - "posture recomputed → FROZEN"

  # ----- Enrollment (PARALLEL DIMENSIONS: payment_status × learning_status) -----
  - entity: Enrollment
    initial_state: "PAID×ACTIVE"          # tuple of (payment_status, learning_status)
    terminal_states: ["REFUNDED×WITHDRAWN", "PAID×COMPLETED"]
    transitions:
      # learning_status axis (independent of payment_status)
      - from: "*×ACTIVE"
        to: "*×AT_RISK"
        trigger: "system (automatic when at_risk_alert_calc evaluates true)"
        actor: system
        preconditions:
          - "Enrollment.progress_percent < AT_RISK_PROGRESS_THRESHOLD AND days_since_enrolled >= AT_RISK_DAYS_THRESHOLD"
        side_effects: []

      - from: "*×AT_RISK"
        to: "*×ACTIVE"
        trigger: "system (automatic when at_risk_alert_calc evaluates false)"
        actor: system
        preconditions:
          - "Enrollment.progress_percent >= AT_RISK_PROGRESS_THRESHOLD"
        side_effects: []

      - from: "*×ACTIVE"
        to: "*×COMPLETED"
        trigger: "system (automatic when chapter_completion_percent reaches 100.0)"
        actor: system
        preconditions:
          - "All Chapter rows with required_for_completion=true have a completion mark for this enrollment"
        side_effects:
          - "External event certificate.issued emitted (logged in AuditLogEntry)"

      - from: "*×ACTIVE"
        to: "*×WITHDRAWN"
        trigger: "system (cascade from refund APPROVED)"
        actor: system
        preconditions: []
        side_effects: []

      # payment_status axis (independent of learning_status)
      - from: "PAID×*"
        to: "REFUND_PENDING×*"
        trigger: POST /enrollments/{enrollmentId}/refund-requests
        actor: Student
        preconditions:
          - "Enrollment.student_id == X-User-ID (ERR_FORBIDDEN_NOT_OWNER)"
          - "Enrollment.payment_status must be PAID (ERR_REFUND_ALREADY_REQUESTED)"
        side_effects:
          - "RefundRequest created in PENDING; provisional_amount_cents computed via refund_provisional"

      - from: "REFUND_PENDING×*"
        to: "REFUNDED×*"
        trigger: POST /refund-requests/{refundRequestId}/approve
        actor: AcademicAdmin
        preconditions:
          - "RefundRequest must be PENDING (ERR_REFUND_NOT_PENDING)"
        side_effects:
          - "RefundRequest.final_amount_cents computed via refund_final using progress at approval time"
          - "Enrollment.refund_amount_cents = RefundRequest.final_amount_cents"
          - "learning_status → WITHDRAWN (parallel-axis side effect)"
          - "AuditLogEntry(action=REFUND_APPROVED) appended"

      - from: "REFUND_PENDING×*"
        to: "PAID×*"
        trigger: POST /refund-requests/{refundRequestId}/reject
        actor: AcademicAdmin
        preconditions:
          - "RefundRequest must be PENDING (ERR_REFUND_NOT_PENDING)"
          - "rejection_reason non-empty (ERR_REFUND_REJECTION_REASON_REQUIRED)"
        side_effects:
          - "RefundRequest → REJECTED"
          - "AuditLogEntry(action=REFUND_REJECTED) appended"

  # ----- LiveClass (linear with cascading cancel) -----
  - entity: LiveClass
    initial_state: SCHEDULED
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: LIVE
        trigger: POST /live-classes/{liveClassId}/start
        actor: Instructor
        preconditions:
          - "Course.posture must be OPEN (ERR_COURSE_FROZEN — cross-entity state dependency on Course)"
          - "now_ts >= start_ts - 600 (ERR_LIVE_CLASS_TOO_EARLY)"
          - "LiveClass.instructor_id == X-User-ID (ERR_FORBIDDEN_NOT_OWNER)"
        side_effects:
          - "checkin_code generated (6-digit alphanumeric)"

      - from: LIVE
        to: ENDED
        trigger: POST /live-classes/{liveClassId}/end
        actor: Instructor
        preconditions:
          - "LiveClass must be LIVE (ERR_LIVE_CLASS_NOT_LIVE)"
        side_effects:
          - "Any Enrollment with no Attendance row for this live_class_id receives mark=ABSENT (autofill)"
          - "If recording_playback_enabled, the chapter referenced gets a virtual playback record contributing to watch_duration_percent"

      - from: SCHEDULED
        to: RESCHEDULED
        trigger: POST /live-classes/{liveClassId}/reschedule
        actor: Instructor
        preconditions:
          - "LiveClass must be SCHEDULED (ERR_LIVE_CLASS_NOT_SCHEDULED)"
          - "New room_id, start_ts, end_ts pass room_overlap_check and instructor_availability_check (ERR_ROOM_CONFLICT, ERR_INSTRUCTOR_UNAVAILABLE)"
        side_effects:
          - "Original LiveClass row stays in RESCHEDULED state (retained for audit)"
          - "A new LiveClass row is created with original_live_class_id pointing back; new row is the makeup class"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from Course DELISTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: LIVE
        to: CANCELLED
        trigger: "system (cascade from Course DELISTED)"
        actor: system
        preconditions: []
        side_effects: []

  # ----- Submission (CYCLIC revision loop) -----
  - entity: Submission
    initial_state: SUBMITTED
    terminal_states: [GRADED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: POST /submissions/{submissionId}/start-review
        actor: Instructor
        preconditions:
          - "Submission must be SUBMITTED (ERR_SUBMISSION_NOT_SUBMITTED)"
          - "Course.instructor_id == X-User-ID OR ClassGroup.ta_instructor_id == X-User-ID"
        side_effects: []

      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: POST /submissions/{submissionId}/request-revision
        actor: Instructor
        preconditions:
          - "Submission must be UNDER_REVIEW (ERR_SUBMISSION_NOT_UNDER_REVIEW)"
          - "feedback non-empty (ERR_FEEDBACK_REQUIRED)"
          - "revision_count < REVISION_CAP (ERR_REVISION_CAP_REACHED)"
        side_effects:
          - "feedback delivered to student (logged)"

      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: PUT /submissions/{submissionId}/payload
        actor: Student
        preconditions:
          - "Submission must be REVISION_REQUESTED (ERR_SUBMISSION_NOT_AWAITING_REVISION)"
          - "Enrollment.student_id == X-User-ID (ERR_FORBIDDEN_NOT_OWNER)"
        side_effects:
          - "revision_count += 1"
          - "plagiarism_score recomputed against the new payload"
        note: "Closes the cyclic loop: SUBMITTED → UNDER_REVIEW → REVISION_REQUESTED → SUBMITTED"

      - from: UNDER_REVIEW
        to: GRADED
        trigger: POST /submissions/{submissionId}/grade
        actor: Instructor
        preconditions:
          - "Submission must be UNDER_REVIEW (ERR_SUBMISSION_NOT_UNDER_REVIEW)"
          - "score in [0, Assignment.max_score] (ERR_SCORE_OUT_OF_RANGE)"
          - "feedback non-empty (ERR_FEEDBACK_REQUIRED)"
          - "plagiarism_score < PLAGIARISM_BLOCK_THRESHOLD OR override_plagiarism flag set (ERR_PLAGIARISM_BLOCKED)"
        side_effects:
          - "Enrollment.progress recomputed (quiz_score aggregation contributes to milestone_check)"

  # ----- LeaveRequest (linear) -----
  - entity: LeaveRequest
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: POST /leave-requests/{leaveRequestId}/approve
        actor: TeachingAssistant
        preconditions:
          - "LeaveRequest must be PENDING (ERR_LEAVE_NOT_PENDING)"
          - "LiveClass.status == SCHEDULED (ERR_LIVE_CLASS_ALREADY_STARTED)"
        side_effects:
          - "An Attendance row is created with mark=EXCUSED, checkin_method=LEAVE for the (live_class_id, enrollment_id)"

      - from: PENDING
        to: REJECTED
        trigger: POST /leave-requests/{leaveRequestId}/reject
        actor: TeachingAssistant
        preconditions:
          - "LeaveRequest must be PENDING (ERR_LEAVE_NOT_PENDING)"
        side_effects: []

  # ----- RefundRequest (linear, but its transitions cascade — see cross-references) -----
  - entity: RefundRequest
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: POST /refund-requests/{refundRequestId}/approve
        actor: AcademicAdmin
        preconditions:
          - "Course.posture must be RESTRICTED or OPEN (ERR_COURSE_FROZEN)"
        side_effects:
          - "final_amount_cents computed via refund_final calculation"
          - "Enrollment payment_status → REFUNDED, learning_status → WITHDRAWN"
          - "External event payment.refund.requested emitted"
          - "AuditLogEntry appended"

      - from: PENDING
        to: REJECTED
        trigger: POST /refund-requests/{refundRequestId}/reject
        actor: AcademicAdmin
        preconditions:
          - "rejection_reason non-empty"
        side_effects:
          - "Enrollment payment_status reverts to PAID"
          - "AuditLogEntry appended"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two Student requests create a refund on the same Enrollment simultaneously"
    guarantee: "At most one RefundRequest exists per Enrollment in non-terminal status; second request rejected"
    error_id: ERR_REFUND_ALREADY_REQUESTED
    http_status: 409
    serialization: "First-writer-wins on RefundRequest creation keyed by enrollment_id"

  - scenario: "AcademicAdmin approves and rejects the same RefundRequest concurrently"
    guarantee: "Exactly one transition wins; loser sees stale state"
    error_id: ERR_REFUND_NOT_PENDING
    http_status: 409
    serialization: "First-writer-wins on RefundRequest.status"

  - scenario: "Two LiveClass create requests target the same room with overlapping time"
    guarantee: "At most one survives; loser is rejected before commit"
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on (room_id, start_ts) overlap detection"

  - scenario: "Student check-in and instructor end-class fire concurrently at boundary +30:00"
    guarantee: "Either Attendance row is committed with mark=LATE or end-class wins and the row is committed with mark=ABSENT; never both for the same enrollment_id"
    error_id: ERR_LIVE_CLASS_NOT_LIVE
    http_status: 409
    serialization: "First-writer-wins on LiveClass.status; once ENDED no new check-in is accepted"

  - scenario: "Two Instructor grade calls finalize the same Submission"
    guarantee: "First grade wins; second sees ERR_SUBMISSION_NOT_UNDER_REVIEW"
    error_id: ERR_SUBMISSION_NOT_UNDER_REVIEW
    http_status: 409
    serialization: "First-writer-wins on Submission.status"

  - scenario: "Course delist and live-class start fire concurrently while course is PUBLISHED"
    guarantee: "If delist commits first, start sees frozen course; if start commits first, the live class proceeds and the cascade cancellation does not include it"
    error_id: ERR_COURSE_FROZEN
    http_status: 409
    serialization: "First-writer-wins on Course.status; LiveClass.start reads Course.posture under the same write lock"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---------- DUAL-VARIANT CALC #1: refund (provisional vs final) ----------
  - name: refund_provisional
    trigger: "POST /enrollments/{enrollmentId}/refund-requests (RefundRequest creation)"
    algorithm: forward_looking
    formula: |
      # Inputs at the moment of request
      enrollment = Enrollment[enrollmentId]
      paid = enrollment.paid_amount_cents          # already in integer cents
      progress = snapshot of Enrollment.progress_percent at requested_at
      days_elapsed = floor((requested_at - enrollment.enrolled_at) / 86400)
      attended_count = count(Attendance where enrollment_id=enrollment.id AND mark IN {ATTENDED, LATE})
      kits = RefundRequest.materials_kit_count

      # Tiered ratio table (evaluated top-to-bottom, first match wins)
      if days_elapsed <= 7  AND progress <= 5.0:
        ratio = 1.00
      elif days_elapsed <= 30 AND progress <= 30.0:
        ratio = 0.70
      elif progress <= 60.0:
        ratio = 0.30
      else:
        ratio = 0.00

      gross_cents = round_half_up(paid * ratio)                # banker’s NOT used; round_half_up
      materials_deduction_cents = kits * MATERIALS_KIT_DEDUCTION_CENTS
      services_deduction_cents = attended_count * SERVICE_PER_LIVE_CLASS_CENTS

      provisional_amount_cents = max(0, gross_cents - materials_deduction_cents - services_deduction_cents)
    input_set: "Enrollment + its Attendance rows (mark IN {ATTENDED, LATE}) + WatchSession rows up to requested_at"
    constants:
      MATERIALS_KIT_DEDUCTION_CENTS: 5000        # 50.00 per kit
      SERVICE_PER_LIVE_CLASS_CENTS: 1500         # 15.00 per attended class
      FULL_REFUND_DAYS: 7
      FULL_REFUND_PROGRESS: 5.0
      MID_REFUND_DAYS: 30
      MID_REFUND_PROGRESS: 30.0
      LATE_REFUND_PROGRESS: 60.0
    precision: "All monetary amounts in integer cents; ratio*paid rounded half-up to integer cents BEFORE deductions"
    variants:
      - name: provisional
        when: "evaluated at RefundRequest creation; uses progress as of requested_at"
        difference: "Locks in deductions using attendance count at requested_at; may differ from final because progress and attendance can both change before approval"

  - name: refund_final
    trigger: "POST /refund-requests/{refundRequestId}/approve (RefundRequest → APPROVED)"
    algorithm: chronological
    formula: |
      # Same tier table, but inputs are re-snapshotted at approval time
      progress = current Enrollment.progress_percent     # at approval time, NOT requested_at
      days_elapsed = floor((approval_ts - enrollment.enrolled_at) / 86400)
      attended_count = count(Attendance where ... AND created_at <= approval_ts)
      apply identical tier table, identical rounding order, identical deductions
      final_amount_cents = max(0, gross_cents - materials_deduction_cents - services_deduction_cents)
    input_set: "Enrollment + Attendance + WatchSession rows whose created_at <= approval_ts"
    constants:
      # Same constants as refund_provisional — values are pinned identically
      MATERIALS_KIT_DEDUCTION_CENTS: 5000
      SERVICE_PER_LIVE_CLASS_CENTS: 1500
      FULL_REFUND_DAYS: 7
      FULL_REFUND_PROGRESS: 5.0
      MID_REFUND_DAYS: 30
      MID_REFUND_PROGRESS: 30.0
      LATE_REFUND_PROGRESS: 60.0
    precision: "All monetary amounts in integer cents; ratio*paid rounded half-up to integer cents BEFORE deductions"
    variants:
      - name: final
        when: "evaluated at APPROVED transition; uses progress and attendance as of approval_ts"
        difference: "Same prose, two well-defined points in time; for identical data with no-change-between-times the two MUST agree, but the system MUST recompute and may differ"

  # ---------- DUAL-VARIANT CALC #2: progress_percent (chapter-completion vs watch-duration) ----------
  - name: chapter_completion_percent
    trigger: "Recomputed on each WatchSession creation, Submission GRADED, and Enrollment read"
    algorithm: aggregation
    formula: |
      required_chapters = [c for c in Chapter where c.course_id=enrollment.course_id AND c.required_for_completion=true]
      if len(required_chapters) == 0: return 0.0
      completed = count(c in required_chapters such that
        sum(WatchSession.seconds_watched for ws.enrollment_id=enrollment.id AND ws.chapter_id=c.id) >= c.video_duration_seconds)
      raw = 100 * completed / len(required_chapters)
      chapter_completion_percent = round_half_up(raw, 1)        # 1 decimal place
    input_set: "Required chapters of the enrolled course; WatchSession rows for the enrollment"
    constants: {}
    precision: "1 decimal place, round_half_up"
    variants:
      - name: completion_centric
        when: "always — this is the chapter-based variant"
        difference: "A chapter counts as 'completed' on a binary threshold (full duration met). Watching 99% of one chapter and 0% of another yields completion=0%, watch_duration≈49.5%"

  - name: watch_duration_percent
    trigger: "Recomputed on each WatchSession creation and Enrollment read"
    algorithm: aggregation
    formula: |
      total = sum(c.video_duration_seconds for c in required_chapters)
      if total == 0: return 0.0
      capped_per_chapter = sum( min( sum(ws.seconds_watched for that chapter) , chapter.video_duration_seconds ) )
      raw = 100 * capped_per_chapter / total
      watch_duration_percent = round_half_up(raw, 1)
    input_set: "Same as chapter_completion_percent but uses summed seconds rather than threshold-cross"
    constants: {}
    precision: "1 decimal place, round_half_up"
    variants:
      - name: duration_centric
        when: "always — this is the watch-time-based variant"
        difference: "Continuous accumulation. Same WatchSession data can produce a different number from chapter_completion_percent; final progress_percent picks max() with documented tie-break"

  # ---------- COMBINATORIAL #1: discount + refund pricing (mode (a) — ≥3 inputs nonlinear) ----------
  - name: enrollment_paid_amount
    trigger: "POST /courses/{courseId}/enrollments (Enrollment creation)"
    algorithm: tiered_pricing
    formula: |
      # Three inputs: list_price_cents, discount_percent, course.posture
      if course.status != PUBLISHED: reject ERR_COURSE_NOT_PUBLISHED
      effective_pct = max(0, min(80, discount_percent))          # bounded
      raw_cents = list_price_cents * (100 - effective_pct) / 100
      paid_amount_cents = round_half_up(raw_cents)               # integer cents
    input_set: "Course.list_price_cents, Course.discount_percent, Course.status — three inputs interact non-linearly via the publication gate and percent clamp"
    constants:
      MAX_DISCOUNT_PERCENT: 80
    precision: "Round percent product to integer cents using round_half_up"

  # ---------- COMBINATORIAL #2: at-risk score (mode (c) — circular-looking, evaluation order pinned) ----------
  - name: at_risk_alert
    trigger: "Recomputed on each WatchSession, Attendance, Submission state change; runs after chapter_completion_percent and watch_duration_percent are recomputed"
    algorithm: weighted_scoring
    formula: |
      # Note: progress_percent itself depends on the two variants above (chapter & watch),
      # and AT_RISK depends on progress_percent. Evaluation order is pinned:
      #   1. Recompute chapter_completion_percent
      #   2. Recompute watch_duration_percent
      #   3. progress_percent = max(chapter_completion_percent, watch_duration_percent); tie → chapter_completion_percent
      #   4. days_since_enrolled = floor((now_ts - enrolled_at_ts) / 86400)
      #   5. attendance_rate = count(mark IN {ATTENDED,LATE}) / count(LiveClass scheduled <= now_ts where status IN {LIVE, ENDED}); 1.0 if denom=0
      #   6. risk_score = 0.6 * (AT_RISK_PROGRESS_THRESHOLD - progress_percent)
      #                 + 0.4 * (AT_RISK_ATTENDANCE_THRESHOLD - 100*attendance_rate)
      #                   evaluated AFTER step 5; values float
      #   7. Enrollment.learning_status flips to AT_RISK iff
      #        days_since_enrolled >= AT_RISK_DAYS_THRESHOLD
      #        AND ( progress_percent < AT_RISK_PROGRESS_THRESHOLD OR risk_score > 0 )
      #      It flips back to ACTIVE iff progress_percent >= AT_RISK_PROGRESS_THRESHOLD AND risk_score <= 0
    input_set: "Enrollment + its WatchSession + Attendance + Submission rows; LiveClass rows of the same course"
    constants:
      AT_RISK_PROGRESS_THRESHOLD: 30.0       # boundary used in §1.4 priority 9
      AT_RISK_ATTENDANCE_THRESHOLD: 70.0
      AT_RISK_DAYS_THRESHOLD: 14
    precision: "risk_score floats; comparisons use strict < and > (boundary exact)"

  # ---------- Helper: room overlap check ----------
  - name: room_overlap_check
    trigger: "POST /courses/{courseId}/live-classes (create) and POST /live-classes/{id}/reschedule"
    algorithm: interval_merge
    formula: |
      # Half-open interval semantics with 600-second post-buffer
      candidate = [start_ts, end_ts)              # half-open
      occupied  = [s, e + ROOM_BUFFER_SECONDS)    # all SCHEDULED or LIVE LiveClass with same room_id
                  for that room across all courses (rooms are shared)
      reject ERR_ROOM_CONFLICT iff candidate ∩ any_occupied != ∅, i.e.
        candidate.start_ts < occupied.end_ts AND candidate.end_ts > occupied.start_ts
    input_set: "All LiveClass rows with same room_id and status IN {SCHEDULED, LIVE}"
    constants:
      ROOM_BUFFER_SECONDS: 600                 # 10-minute buffer after each session
    precision: "Strict half-open; buffer applies only to existing session’s end"

  # ---------- Helper: instructor availability (CLOSED interval semantics — different from room) ----------
  - name: instructor_availability_check
    trigger: "POST /courses/{courseId}/live-classes (create) and POST /live-classes/{id}/reschedule"
    algorithm: interval_merge
    formula: |
      # Closed interval semantics, no buffer
      For some w in instructor.availability_windows:
        if w.start_ts <= start_ts AND end_ts <= w.end_ts:
          OK
      Else: reject ERR_INSTRUCTOR_UNAVAILABLE
    input_set: "Instructor.availability_windows (closed [start_ts, end_ts] intervals)"
    constants: {}
    precision: "Closed-on-both-ends; an end_ts exactly equal to window end_ts is allowed"

  # ---------- Helper: attendance mark derivation (boundary precision: late vs absent) ----------
  - name: attendance_mark_derivation
    trigger: "POST /live-classes/{id}/check-in (per check-in event); also fired at LiveClass END for autofill ABSENT"
    algorithm: threshold
    formula: |
      delta = checkin_ts - live_class.start_ts
      if delta < -CHECKIN_OPEN_LEAD_SECONDS: reject ERR_CHECKIN_WINDOW_CLOSED   # too early
      if delta <= 0: mark = ATTENDED
      elif delta <= LATE_BOUNDARY_SECONDS: mark = LATE                          # 1..1800 inclusive
      else: reject ERR_CHECKIN_WINDOW_CLOSED                                    # > 30min → window closed; ABSENT autofilled at LiveClass END
    constants:
      CHECKIN_OPEN_LEAD_SECONDS: 900            # window opens 15 min before start
      LATE_BOUNDARY_SECONDS: 1800               # 30 min — boundary exact: delta==1800 → LATE; delta==1801 → window closed
    precision: "Strict <= and >; the integer-second boundary at delta==1800 produces LATE, not ABSENT"

# =============================================================================
# §1.4 Validation Rules Table (priority-ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role must be permitted for the endpoint per §1.5/§1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist and parent linkage is correct (left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_COURSE_NOT_FOUND, ERR_CHAPTER_NOT_FOUND, ERR_INSTRUCTOR_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_LIVE_CLASS_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_SUBMISSION_NOT_FOUND, ERR_REFUND_NOT_FOUND, ERR_LEAVE_NOT_FOUND, ERR_CLASS_GROUP_NOT_FOUND)"
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 4
    category: business_referential
    check: "X-User-ID matches resource ownership for entity_backed roles (Student owns Enrollment, Instructor owns Course, etc.)"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "Student-scoped and Instructor-scoped mutation endpoints"

  - priority: 5
    category: state
    check: "Source entity is in the required state for the requested transition (e.g., Course UNDER_REVIEW for approve, Submission UNDER_REVIEW for grade)"
    error_id: "varies (ERR_COURSE_NOT_UNDER_REVIEW, ERR_SUBMISSION_NOT_UNDER_REVIEW, ERR_REFUND_NOT_PENDING, ERR_LIVE_CLASS_NOT_LIVE, ERR_LIVE_CLASS_NOT_SCHEDULED, ERR_LEAVE_NOT_PENDING, ERR_COURSE_NOT_PUBLISHED, ERR_COURSE_NOT_REJECTED)"
    http_status: 409
    applies_to: state transition endpoints

  - priority: 6
    category: state
    check: "Cross-entity state precondition: parent Course.posture must allow the operation (live-class start, enrollment, refund approval blocked when posture=FROZEN)"
    error_id: ERR_COURSE_FROZEN
    http_status: 409
    applies_to: "POST live-classes/start, POST enrollments, POST refund-requests/approve"

  - priority: 7
    category: business_safety
    check: "Plagiarism block: cannot grade when plagiarism_score >= PLAGIARISM_BLOCK_THRESHOLD unless override flag set"
    error_id: ERR_PLAGIARISM_BLOCKED
    http_status: 403
    applies_to: "POST /submissions/{id}/grade"

  - priority: 8
    category: business_temporal
    check: "Room overlap: half-open interval with 10-min post-buffer (room_overlap_check formula)"
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST live-classes (create), POST live-classes/{id}/reschedule"

  - priority: 9
    category: business_temporal
    check: "Instructor availability: closed-interval containment (instructor_availability_check formula)"
    error_id: ERR_INSTRUCTOR_UNAVAILABLE
    http_status: 409
    applies_to: "POST live-classes (create), POST live-classes/{id}/reschedule"

  - priority: 10
    category: business_temporal
    check: "Check-in window: 15-min lead, 30-min boundary; submissions outside window rejected"
    error_id: ERR_CHECKIN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /live-classes/{id}/check-in"

  - priority: 11
    category: business_constraint
    check: "Class group capacity: enrolled_count < capacity"
    error_id: ERR_CLASS_GROUP_FULL
    http_status: 409
    applies_to: "POST /class-groups/{id}/assign-enrollment"

  - priority: 12
    category: business_constraint
    check: "Submission revision cap: revision_count < REVISION_CAP (=3) when requesting revision"
    error_id: ERR_REVISION_CAP_REACHED
    http_status: 409
    applies_to: "POST /submissions/{id}/request-revision"

  - priority: 13
    category: business_constraint
    check: "Assignment payload format match (TEXT requires payload_text; FILE requires payload_file_url; CODE requires payload_code; conflict if multiple set)"
    error_id: ERR_PAYLOAD_FORMAT_MISMATCH
    http_status: 400
    applies_to: "POST /assignments/{id}/submissions, PUT /submissions/{id}/payload"

  - priority: 14
    category: business_constraint
    check: "Late submission: now_ts < Assignment.due_ts strictly"
    error_id: ERR_SUBMISSION_PAST_DUE
    http_status: 409
    applies_to: "POST /assignments/{id}/submissions, PUT /submissions/{id}/payload"

  - priority: 15
    category: business_fiscal
    check: "Refund request idempotency: at most one non-terminal RefundRequest per enrollment"
    error_id: ERR_REFUND_ALREADY_REQUESTED
    http_status: 409
    applies_to: "POST /enrollments/{id}/refund-requests"

  - priority: 16
    category: business_fiscal
    check: "Refund pricing inputs: list_price_cents >= 0; discount_percent in [0,80]"
    error_id: ERR_INVALID_PRICING
    http_status: 400
    applies_to: "POST /courses, PATCH /courses/{id}, POST /courses/{id}/submit-for-review"

  - priority: 17
    category: business_constraint
    check: "Score in [0, max_score] when grading"
    error_id: ERR_SCORE_OUT_OF_RANGE
    http_status: 400
    applies_to: "POST /submissions/{id}/grade"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Course -----
  - { method: POST,   path: "/courses",                                    description: "Create a course in DRAFT", roles: [Instructor], code: 201, input: [title, list_price_cents, discount_percent, instructor_id], output: Course, side_effects: ["status=DRAFT, posture=RESTRICTED"] }
  - { method: GET,    path: "/courses",                                    description: "List courses with filters", roles: [Any], code: 200, input: ["limit?", "offset?", "status?"], output: "Course[]", side_effects: [] }
  - { method: GET,    path: "/courses/{courseId}",                         description: "Get a course", roles: [Any], code: 200, input: [], output: Course, side_effects: [] }
  - { method: PATCH,  path: "/courses/{courseId}",                         description: "Update title/pricing while DRAFT or REJECTED", roles: [Instructor], code: 200, input: ["title?", "list_price_cents?", "discount_percent?", "version?"], output: Course, side_effects: [] }
  - { method: POST,   path: "/courses/{courseId}/submit-for-review",       description: "DRAFT → UNDER_REVIEW", roles: [Instructor], code: 200, input: [], output: Course, side_effects: ["new SyllabusRevision created"] }
  - { method: POST,   path: "/courses/{courseId}/approve",                 description: "UNDER_REVIEW → PUBLISHED", roles: [AcademicAdmin], code: 200, input: [], output: Course, side_effects: ["published_syllabus_revision_id pinned, posture=OPEN"] }
  - { method: POST,   path: "/courses/{courseId}/reject",                  description: "UNDER_REVIEW → REJECTED", roles: [AcademicAdmin], code: 200, input: [], output: Course, side_effects: [] }
  - { method: POST,   path: "/courses/{courseId}/return-to-draft",         description: "REJECTED → DRAFT", roles: [Instructor], code: 200, input: [], output: Course, side_effects: [] }
  - { method: POST,   path: "/courses/{courseId}/delist",                  description: "PUBLISHED → DELISTED with depth-3 cascade", roles: [AcademicAdmin], code: 200, input: [], output: Course, side_effects: ["all SCHEDULED LiveClass→CANCELLED → affected Enrollment.learning_status→AT_RISK → PENDING refunds recomputed; posture=FROZEN"] }
  - { method: GET,    path: "/courses/{courseId}/syllabus-revisions",      description: "List syllabus revisions", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "SyllabusRevision[]", side_effects: [] }

  # ----- Chapter -----
  - { method: POST,   path: "/courses/{courseId}/chapters",                description: "Add a chapter (DRAFT/REJECTED only)", roles: [Instructor], code: 201, input: [title, ordinal, video_duration_seconds, "required_for_completion?"], output: Chapter, side_effects: [] }
  - { method: GET,    path: "/courses/{courseId}/chapters",                description: "List chapters", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "Chapter[]", side_effects: [] }

  # ----- Instructor / Student -----
  - { method: POST,   path: "/instructors",                                description: "Register an instructor", roles: [AcademicAdmin], code: 201, input: [display_name, email, bio, availability_windows], output: Instructor, side_effects: [] }
  - { method: GET,    path: "/instructors/{instructorId}",                 description: "Get instructor profile", roles: [Any], code: 200, input: [], output: Instructor, side_effects: [] }
  - { method: PATCH,  path: "/instructors/{instructorId}/availability",    description: "Replace availability_windows", roles: [Instructor, AcademicAdmin], code: 200, input: [availability_windows, "version?"], output: Instructor, side_effects: [] }
  - { method: POST,   path: "/students",                                   description: "Register a student", roles: [AcademicAdmin, Student], code: 201, input: [display_name, email], output: Student, side_effects: [] }

  # ----- Enrollment -----
  - { method: POST,   path: "/courses/{courseId}/enrollments",             description: "Student enrolls in PUBLISHED course", roles: [Student], code: 201, input: [student_id], output: Enrollment, side_effects: ["paid_amount_cents computed; AuditLogEntry(action=ENROLLMENT_CREATED)"] }
  - { method: GET,    path: "/enrollments/{enrollmentId}",                 description: "Get enrollment incl. derived progress", roles: [Student, Instructor, TeachingAssistant, AcademicAdmin], code: 200, input: [], output: Enrollment, side_effects: [] }

  # ----- Class group + announcement -----
  - { method: POST,   path: "/courses/{courseId}/class-groups",            description: "Create class group", roles: [Instructor, AcademicAdmin], code: 201, input: [name, capacity, "ta_instructor_id?"], output: ClassGroup, side_effects: [] }
  - { method: POST,   path: "/class-groups/{classGroupId}/assign-enrollment", description: "Move enrollment into a group", roles: [Instructor, AcademicAdmin], code: 200, input: [enrollment_id], output: Enrollment, side_effects: ["AuditLogEntry(action=ENROLLMENT_GROUPED)"] }
  - { method: POST,   path: "/class-groups/{classGroupId}/announcements",  description: "Post announcement", roles: [Instructor, TeachingAssistant], code: 201, input: [body], output: Announcement, side_effects: ["External event im.message.broadcast emitted"] }

  # ----- Live class + attendance + leave -----
  - { method: POST,   path: "/courses/{courseId}/live-classes",            description: "Schedule a live class", roles: [Instructor], code: 201, input: ["chapter_id?", instructor_id, room_id, start_ts, end_ts, "recording_playback_enabled?"], output: LiveClass, side_effects: ["room_overlap_check + instructor_availability_check"] }
  - { method: POST,   path: "/live-classes/{liveClassId}/start",           description: "SCHEDULED → LIVE", roles: [Instructor], code: 200, input: [], output: LiveClass, side_effects: ["checkin_code generated; cross-entity Course.posture check"] }
  - { method: POST,   path: "/live-classes/{liveClassId}/end",             description: "LIVE → ENDED", roles: [Instructor], code: 200, input: [], output: LiveClass, side_effects: ["ABSENT autofill for un-checked-in enrollments"] }
  - { method: POST,   path: "/live-classes/{liveClassId}/reschedule",      description: "SCHEDULED → RESCHEDULED + creates makeup class", roles: [Instructor], code: 201, input: [room_id, start_ts, end_ts], output: LiveClass, side_effects: ["new makeup LiveClass created with original_live_class_id back-link"] }
  - { method: POST,   path: "/live-classes/{liveClassId}/check-in",        description: "Student check-in; computes attendance mark", roles: [Student], code: 201, input: [checkin_method, checkin_ts, "code_provided?"], output: Attendance, side_effects: ["mark derived via attendance_mark_derivation"] }
  - { method: POST,   path: "/leave-requests",                             description: "Apply for leave", roles: [Student], code: 201, input: [enrollment_id, live_class_id, reason], output: LeaveRequest, side_effects: [] }
  - { method: POST,   path: "/leave-requests/{leaveRequestId}/approve",    description: "Approve leave (creates EXCUSED Attendance)", roles: [TeachingAssistant], code: 200, input: [], output: LeaveRequest, side_effects: ["Attendance row mark=EXCUSED appended"] }
  - { method: POST,   path: "/leave-requests/{leaveRequestId}/reject",     description: "Reject leave", roles: [TeachingAssistant], code: 200, input: [], output: LeaveRequest, side_effects: [] }

  # ----- Assignment + submission -----
  - { method: POST,   path: "/courses/{courseId}/assignments",             description: "Publish an assignment", roles: [Instructor], code: 201, input: ["chapter_id?", title, format, due_ts, max_score], output: Assignment, side_effects: ["status=PUBLISHED"] }
  - { method: POST,   path: "/assignments/{assignmentId}/submissions",     description: "Student submits", roles: [Student], code: 201, input: [enrollment_id, "payload_text?", "payload_file_url?", "payload_code?"], output: Submission, side_effects: ["plagiarism_score computed"] }
  - { method: PUT,    path: "/submissions/{submissionId}/payload",         description: "Resubmit after revision request (cyclic: REVISION_REQUESTED → SUBMITTED)", roles: [Student], code: 200, input: ["payload_text?", "payload_file_url?", "payload_code?"], output: Submission, side_effects: ["revision_count += 1; plagiarism_score recomputed"] }
  - { method: POST,   path: "/submissions/{submissionId}/start-review",    description: "SUBMITTED → UNDER_REVIEW", roles: [Instructor, TeachingAssistant], code: 200, input: [], output: Submission, side_effects: [] }
  - { method: POST,   path: "/submissions/{submissionId}/request-revision",description: "UNDER_REVIEW → REVISION_REQUESTED", roles: [Instructor, TeachingAssistant], code: 200, input: [feedback], output: Submission, side_effects: ["External event im.message.send for feedback"] }
  - { method: POST,   path: "/submissions/{submissionId}/grade",           description: "UNDER_REVIEW → GRADED", roles: [Instructor], code: 200, input: [score, feedback, "override_plagiarism?"], output: Submission, side_effects: ["progress recomputed; possible learning_status flip"] }

  # ----- Watch sessions (telemetry) -----
  - { method: POST,   path: "/enrollments/{enrollmentId}/watch-sessions",  description: "Log watch session", roles: [Student], code: 201, input: [chapter_id, seconds_watched], output: WatchSession, side_effects: ["progress_percent recomputed; at_risk_alert evaluated"] }

  # ----- Refund -----
  - { method: POST,   path: "/enrollments/{enrollmentId}/refund-requests", description: "Create refund request (provisional calc)", roles: [Student], code: 201, input: ["materials_kit_count?"], output: RefundRequest, side_effects: ["provisional_amount_cents computed; payment_status=REFUND_PENDING; AuditLogEntry(action=REFUND_REQUESTED)"] }
  - { method: POST,   path: "/refund-requests/{refundRequestId}/approve",  description: "PENDING → APPROVED (final calc)", roles: [AcademicAdmin], code: 200, input: [], output: RefundRequest, side_effects: ["final_amount_cents; cascade enrollment WITHDRAWN; im+payment events; AuditLogEntry(action=REFUND_APPROVED)"] }
  - { method: POST,   path: "/refund-requests/{refundRequestId}/reject",   description: "PENDING → REJECTED (revert to PAID)", roles: [AcademicAdmin], code: 200, input: [rejection_reason], output: RefundRequest, side_effects: ["AuditLogEntry(action=REFUND_REJECTED)"] }
  - { method: GET,    path: "/refund-requests",                            description: "List refund requests with filters", roles: [AcademicAdmin], code: 200, input: ["limit?", "offset?", "status?", "enrollment_id?"], output: "RefundRequest[]", side_effects: [] }

  # ----- Audit + test-driving (mandatory testability completeness) -----
  - { method: GET,    path: "/audit-logs",                                 description: "List AuditLogEntry rows for enrollment + refund actions", roles: [AcademicAdmin], code: 200, input: ["limit?", "offset?", "subject_type?", "subject_id?", "action?"], output: "AuditLogEntry[]", side_effects: [] }
  - { method: POST,   path: "/_clock/advance",                             description: "Test-driving endpoint to advance now_ts (for time-gated transitions like at_risk_alert and refund time-window)", roles: [AcademicAdmin], code: 200, input: [seconds], output: Clock, side_effects: ["at_risk_alert re-evaluated for all enrollments"] }
  - { method: POST,   path: "/_sweep/at-risk",                             description: "Test-driving endpoint to force at_risk_alert evaluation", roles: [AcademicAdmin], code: 200, input: [], output: null, side_effects: ["learning_status flips per at_risk_alert"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE,                          http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_FORBIDDEN_NOT_OWNER,                     http: 403, condition: "Acting entity does not own the target resource" }

  - { id: ERR_COURSE_NOT_FOUND,                        http: 404, condition: "Course id absent" }
  - { id: ERR_CHAPTER_NOT_FOUND,                       http: 404, condition: "Chapter id absent" }
  - { id: ERR_INSTRUCTOR_NOT_FOUND,                    http: 404, condition: "Instructor id absent" }
  - { id: ERR_STUDENT_NOT_FOUND,                       http: 404, condition: "Student id absent" }
  - { id: ERR_ENROLLMENT_NOT_FOUND,                    http: 404, condition: "Enrollment id absent" }
  - { id: ERR_LIVE_CLASS_NOT_FOUND,                    http: 404, condition: "LiveClass id absent" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND,                    http: 404, condition: "Assignment id absent" }
  - { id: ERR_SUBMISSION_NOT_FOUND,                    http: 404, condition: "Submission id absent" }
  - { id: ERR_REFUND_NOT_FOUND,                        http: 404, condition: "RefundRequest id absent" }
  - { id: ERR_LEAVE_NOT_FOUND,                         http: 404, condition: "LeaveRequest id absent" }
  - { id: ERR_CLASS_GROUP_NOT_FOUND,                   http: 404, condition: "ClassGroup id absent" }

  - { id: ERR_COURSE_NO_CHAPTERS,                      http: 409, condition: "submit-for-review with zero required chapters" }
  - { id: ERR_COURSE_NOT_UNDER_REVIEW,                 http: 409, condition: "approve/reject called on Course not in UNDER_REVIEW" }
  - { id: ERR_COURSE_NOT_REJECTED,                     http: 409, condition: "return-to-draft called on Course not in REJECTED" }
  - { id: ERR_COURSE_NOT_PUBLISHED,                    http: 409, condition: "delist called on Course not in PUBLISHED, or enrollment created against non-PUBLISHED course" }
  - { id: ERR_COURSE_FROZEN,                           http: 409, condition: "operation blocked because Course.posture == FROZEN" }
  - { id: ERR_INVALID_PRICING,                         http: 400, condition: "list_price_cents < 0 or discount_percent outside [0,80]" }

  - { id: ERR_LIVE_CLASS_NOT_LIVE,                     http: 409, condition: "end called on LiveClass not in LIVE" }
  - { id: ERR_LIVE_CLASS_NOT_SCHEDULED,                http: 409, condition: "reschedule called on LiveClass not in SCHEDULED" }
  - { id: ERR_LIVE_CLASS_TOO_EARLY,                    http: 409, condition: "start called more than 10 min before start_ts" }
  - { id: ERR_ROOM_CONFLICT,                           http: 409, condition: "room_overlap_check fails (half-open + 10-min buffer)" }
  - { id: ERR_INSTRUCTOR_UNAVAILABLE,                  http: 409, condition: "instructor_availability_check fails (closed-interval containment)" }
  - { id: ERR_CHECKIN_WINDOW_CLOSED,                   http: 409, condition: "check-in outside [start-15min, start+30min]" }

  - { id: ERR_LEAVE_NOT_PENDING,                       http: 409, condition: "approve/reject called on LeaveRequest not in PENDING" }
  - { id: ERR_LIVE_CLASS_ALREADY_STARTED,              http: 409, condition: "leave approve called when target LiveClass already LIVE/ENDED" }

  - { id: ERR_SUBMISSION_NOT_SUBMITTED,                http: 409, condition: "start-review called on Submission not in SUBMITTED" }
  - { id: ERR_SUBMISSION_NOT_UNDER_REVIEW,             http: 409, condition: "grade/request-revision called on Submission not in UNDER_REVIEW" }
  - { id: ERR_SUBMISSION_NOT_AWAITING_REVISION,        http: 409, condition: "PUT payload called on Submission not in REVISION_REQUESTED" }
  - { id: ERR_REVISION_CAP_REACHED,                    http: 409, condition: "request-revision called when revision_count == 3" }
  - { id: ERR_PAYLOAD_FORMAT_MISMATCH,                 http: 400, condition: "submission payload field set does not match Assignment.format" }
  - { id: ERR_SUBMISSION_PAST_DUE,                     http: 409, condition: "submission attempted at or after Assignment.due_ts" }
  - { id: ERR_SCORE_OUT_OF_RANGE,                      http: 400, condition: "score outside [0, max_score] when grading" }
  - { id: ERR_FEEDBACK_REQUIRED,                       http: 400, condition: "request-revision or grade missing feedback" }
  - { id: ERR_PLAGIARISM_BLOCKED,                      http: 403, condition: "grade attempted with plagiarism_score >= threshold and no override flag" }

  - { id: ERR_REFUND_ALREADY_REQUESTED,                http: 409, condition: "non-terminal RefundRequest already exists for the enrollment" }
  - { id: ERR_REFUND_NOT_PENDING,                      http: 409, condition: "approve/reject called on RefundRequest not in PENDING" }
  - { id: ERR_REFUND_REJECTION_REASON_REQUIRED,        http: 400, condition: "reject called without rejection_reason" }

  - { id: ERR_CLASS_GROUP_FULL,                        http: 409, condition: "assign-enrollment when enrolled_count == capacity" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Instructor
    description: "Course owner; publishes courses, schedules live classes, grades submissions"
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /courses (create)"
      - "POST /courses/{id}/submit-for-review"
      - "POST /courses/{id}/return-to-draft"
      - "POST /courses/{id}/chapters"
      - "POST /courses/{id}/live-classes (create)"
      - "POST /live-classes/{id}/start"
      - "POST /live-classes/{id}/end"
      - "POST /live-classes/{id}/reschedule"
      - "POST /courses/{id}/assignments (publish)"
      - "POST /submissions/{id}/grade"
    shared_operations:
      - "PATCH /courses/{id} (with TA in some flows)"
      - "POST /courses/{id}/class-groups (with AcademicAdmin)"
      - "PATCH /instructors/{id}/availability (with AcademicAdmin)"
      - "POST /class-groups/{id}/assign-enrollment (with AcademicAdmin)"
      - "POST /class-groups/{id}/announcements (with TA)"
      - "POST /submissions/{id}/start-review (with TA)"
      - "POST /submissions/{id}/request-revision (with TA)"

  - name: TeachingAssistant
    description: "Class-group helper; reviews submissions, posts announcements, processes leave"
    identity: "entity_backed:Instructor"   # TAs are stored as Instructor rows but may not own Courses; the class_group.ta_instructor_id link grants TA scope
    exclusive_operations:
      - "POST /leave-requests/{id}/approve"
      - "POST /leave-requests/{id}/reject"
    shared_operations:
      - "POST /submissions/{id}/start-review (with Instructor)"
      - "POST /submissions/{id}/request-revision (with Instructor)"
      - "POST /class-groups/{id}/announcements (with Instructor)"

  - name: Student
    description: "Course consumer; enrolls, watches, submits, attends, requests refunds"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /courses/{id}/enrollments"
      - "POST /enrollments/{id}/watch-sessions"
      - "POST /assignments/{id}/submissions"
      - "PUT /submissions/{id}/payload"
      - "POST /live-classes/{id}/check-in"
      - "POST /leave-requests"
      - "POST /enrollments/{id}/refund-requests"
    shared_operations:
      - "POST /students (registration; also AcademicAdmin)"

  - name: AcademicAdmin
    description: "Platform operator; reviews courses, approves/rejects refunds, manages clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /courses/{id}/approve"
      - "POST /courses/{id}/reject"
      - "POST /courses/{id}/delist"
      - "POST /refund-requests/{id}/approve"
      - "POST /refund-requests/{id}/reject"
      - "POST /instructors (register)"
      - "GET /audit-logs"
      - "GET /refund-requests (list)"
      - "POST /_clock/advance"
      - "POST /_sweep/at-risk"
    shared_operations:
      - "POST /courses/{id}/class-groups (with Instructor)"
      - "POST /class-groups/{id}/assign-enrollment (with Instructor)"
      - "PATCH /instructors/{id}/availability (with Instructor)"
      - "POST /students (with Student self-registration)"
