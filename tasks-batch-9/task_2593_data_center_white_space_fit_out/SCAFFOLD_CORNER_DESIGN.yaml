# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Task 2593 — Data Center White Space Fit-Out
#
# Walks references/claim-extraction-guide.md section by section against
# SCAFFOLD.yaml §1.1-§1.7. `section:` values are the guide's nine sections;
# `claim_type:` values are the guide's per-section table rows (snake_cased).
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub naming that instance and no test_recipe.
#
# Hall codes CX01..CX50 are reserved for §1.9 so no fixture collides with the
# HA1..HT1 codes used by §1.8.
#
# Pre-computed literals reused below (all executed against §1.3 formulas):
#   busway 400 A / 415 V / N_PLUS_1 under a 300.00 kW PDU: raw_kw 273.136,
#       DESIGN usable_kw 196.66 (trunk 196.658208 binds, PDU cap 240.000)
#   breaker derate ceilings: 32 A -> 17.48, 60 A -> 32.78, 100 A -> 54.63,
#       200 A -> 109.25 kW
#   airflow_capacity_kw: 22000 cfm / dT 18.0 F @ 5 % leak -> 119.07855
#                        12000 cfm / dT 18.0 F @ 5 % leak ->  64.95193
#                         3000 cfm / dT 12.0 F @ 5 % leak ->  10.82532
#   rack overhead (x 1.045):  5.00 -> 5.23, 10.00 -> 10.45, 15.00 -> 15.68
#   diversity   (x 0.85):    10.00 -> 8.50, 15.00 -> 12.75, 35.00 -> 29.75
#   load bank tolerance (x 0.95): target 10.00 -> 9.50, target 20.00 -> 19.00
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: hall_creation_returns_declared_field_set
        claim_type: creation
        grounds:
          - entities.Hall
          - endpoints[POST /halls]
        distinguishing_aspect: "POST /halls with all seven input fields returns 201 and echoes every input field verbatim while stamping id, version, created_at and status PLANNING."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /halls"
              payload: { name: "Corner Hall 01", code: "CX01", tenant_mode: "MULTI_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 10 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Hall.${hall_id}.name == 'Corner Hall 01'"
            - "Hall.${hall_id}.code == 'CX01'"
            - "Hall.${hall_id}.tenant_mode == MULTI_TENANT"
            - "Hall.${hall_id}.design_kw_capacity == 400.00"
            - "Hall.${hall_id}.gross_area_sqm == 600.0"
            - "Hall.${hall_id}.cooling_redundancy == N"
            - "Hall.${hall_id}.planned_rack_count == 10"
            - "Hall.${hall_id}.status == PLANNING"
            - "Hall.${hall_id}.version == 1"
            - "Hall.${hall_id}.id is a non-empty string and created_at is a non-null ISO 8601 UTC timestamp"

      - name: hall_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /halls/{hall_id}]
          - entities.Hall
        distinguishing_aspect: "GET /halls/{hall_id} returns exactly the row POST /halls created, including the computed ledger fields, with no re-derivation drift."
        test_recipe:
          setup:
            - "One hall CX02 exists in PLANNING with design_kw_capacity 250.00."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 02", code: "CX02", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 250.00, gross_area_sqm: 400.0, cooling_redundancy: "N", planned_rack_count: 6 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
          trigger:
            - call: "GET /halls/${hall_id}"
              payload: {}
              as: OperationsManager
          assert:
            - "HTTP status is 200"
            - "Hall.${hall_id}.code == 'CX02'"
            - "Hall.${hall_id}.committed_kw == 0.00"
            - "Hall.${hall_id}.commissioning_reserve_kw == 25.00"
            - "Hall.${hall_id}.spare_kw == 225.00"
            - "Hall.${hall_id}.thermal_posture == NOMINAL"
            - "Hall.${hall_id}.release_posture == OPEN"

      - name: hall_listing_paginates_and_filters_by_status
        claim_type: listing
        grounds:
          - endpoints[GET /halls]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /halls returns the paginated envelope with total_count 3 and has_more true at page_size 2, and the status filter narrows the same collection to the single FIT_OUT hall."
        test_recipe:
          setup:
            - "Three halls exist: CX03 and CX04 in PLANNING, CX05 advanced to FIT_OUT."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 03", code: "CX03", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 100.00, gross_area_sqm: 200.0, cooling_redundancy: "N", planned_rack_count: 4 }
              as: FacilityPlanner
            - call: "POST /halls"
              payload: { name: "Corner Hall 04", code: "CX04", tenant_mode: "MULTI_TENANT", design_kw_capacity: 100.00, gross_area_sqm: 200.0, cooling_redundancy: "N", planned_rack_count: 4 }
              as: FacilityPlanner
            - call: "POST /halls"
              payload: { name: "Corner Hall 05", code: "CX05", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall5_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall5_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall5_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_b_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall5_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
            - call: "POST /halls/${hall5_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
          trigger:
            - call: "GET /halls?page=1&page_size=2"
              payload: {}
              as: FacilityPlanner
            - call: "GET /halls?status=FIT_OUT"
              payload: {}
              as: FacilityPlanner
          assert:
            - "the first response's data array holds exactly 2 Hall rows, total_count == 3 and has_more == true"
            - "the second response's data array holds exactly 1 Hall row, that row's code == 'CX05', total_count == 1 and has_more == false"

      - name: hall_missing_required_design_kw_capacity_rejected
        claim_type: required_fields
        grounds:
          - entities.Hall.fields.design_kw_capacity
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting the required input field design_kw_capacity from POST /halls returns ERR_VALIDATION 422 and creates no Hall row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /halls"
              payload: { name: "Corner Hall 06", code: "CX06", tenant_mode: "SINGLE_TENANT", gross_area_sqm: 200.0, cooling_redundancy: "N", planned_rack_count: 4 }
              as: FacilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and ${err} == ERR_VALIDATION"
            - "GET /halls returns total_count == 0"

      - name: hall_invalid_tenant_mode_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Hall.fields.tenant_mode
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "tenant_mode accepts only SINGLE_TENANT | MULTI_TENANT; the out-of-domain value DUAL_TENANT is refused with ERR_VALIDATION 422 rather than being stored."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /halls"
              payload: { name: "Corner Hall 07", code: "CX07", tenant_mode: "DUAL_TENANT", design_kw_capacity: 100.00, gross_area_sqm: 200.0, cooling_redundancy: "N", planned_rack_count: 4 }
              as: FacilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and ${err} == ERR_VALIDATION"
            - "GET /halls returns total_count == 0"

      - name: hall_system_and_computed_fields_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Hall.fields.status
          - entities.Hall.fields.committed_kw
          - entities.Hall.fields.spare_kw
          - endpoints[POST /halls]
        distinguishing_aspect: "status, committed_kw and spare_kw are source system/computed: a POST /halls body that supplies status LIVE and committed_kw 999.00 still yields status PLANNING, committed_kw 0.00 and spare_kw 275.00."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /halls"
              payload: { name: "Corner Hall 08", code: "CX08", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 300.00, gross_area_sqm: 400.0, cooling_redundancy: "N", planned_rack_count: 6, status: "LIVE", committed_kw: 999.00, spare_kw: 999.00, version: 42 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
          assert:
            - "Hall.${hall_id}.status == PLANNING (the supplied LIVE is ignored)"
            - "Hall.${hall_id}.committed_kw == 0.00"
            - "Hall.${hall_id}.spare_kw == 275.00"
            - "Hall.${hall_id}.version == 1 (the supplied 42 is ignored)"

      - name: hall_capacity_fields_default_to_zero_on_create
        claim_type: defaults
        grounds:
          - calculations.hall_power_ledger
          - entities.Hall.fields.commissioning_reserve_kw
          - entities.Hall.fields.rack_total_count
        distinguishing_aspect: "A brand-new hall with no feeds sits in reserve tier 1, so commissioning_reserve_kw defaults to 25.00 and spare_kw to design_kw_capacity - 25.00 = 375.00, with every custody counter at 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /halls"
              payload: { name: "Corner Hall 09", code: "CX09", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N_PLUS_1", planned_rack_count: 10 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
          assert:
            - "Hall.${hall_id}.committed_kw == 0.00"
            - "Hall.${hall_id}.commissioning_reserve_kw == 25.00"
            - "Hall.${hall_id}.spare_kw == 375.00"
            - "Hall.${hall_id}.chargeable_kw == 0.00"
            - "Hall.${hall_id}.thermal_load_kw == 0.00"
            - "Hall.${hall_id}.cooling_capacity_kw == 0.00"
            - "Hall.${hall_id}.cooling_margin_kw == 0.00"
            - "Hall.${hall_id}.rack_total_count == 0 and custody_ops_count == 0 and custody_fitout_count == 0 and at_risk_rack_count == 0 and open_mop_count == 0"

      - name: tenant_creation_defaults_allocated_kw_to_zero
        claim_type: defaults
        grounds:
          - entities.Tenant.fields.allocated_kw
          - endpoints[POST /tenants]
        distinguishing_aspect: "Tenant.allocated_kw is computed from installed racks only, so a tenant created before any rack exists reports allocated_kw 0.00 against contracted_kw 200.00."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /tenants"
              payload: { name: "Northwind Systems", code: "CXT1", contracted_kw: 200.00, contract_start_date: "2026-01-01T00:00:00Z" }
              as: FacilityPlanner
              captures: { tenant_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Tenant.${tenant_id}.contracted_kw == 200.00"
            - "Tenant.${tenant_id}.allocated_kw == 0.00"

      - name: pdu_defaults_measured_derate_factor_to_one
        claim_type: defaults
        grounds:
          - entities.PowerDistributionUnit.fields.measured_derate_factor
          - entities.PowerDistributionUnit.fields.usable_cap_kw
          - entities.PowerDistributionUnit.fields.status
        distinguishing_aspect: "A PDU created without measured_derate_factor defaults to 1.0, status PLANNED and usable_cap_kw round(300.00 * 0.8, 3) == 240.000."
        test_recipe:
          setup:
            - "Hall CX10 exists in PLANNING."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 10", code: "CX10", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
          trigger:
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_id: $.data.id }
          assert:
            - "PowerDistributionUnit.${pdu_id}.measured_derate_factor == 1.0"
            - "PowerDistributionUnit.${pdu_id}.status == PLANNED"
            - "PowerDistributionUnit.${pdu_id}.usable_cap_kw == 240.000"
            - "PowerDistributionUnit.${pdu_id}.feed_side == A"

      - name: pdu_parent_hall_must_exist_not_found
        claim_type: parent_relationships
        grounds:
          - entities.PowerDistributionUnit.fields.hall_id
          - validations[priority=6]
          - errors[ERR_HALL_NOT_FOUND]
        distinguishing_aspect: "POST /pdus with a well-formed but unknown hall_id resolves the body FK before any other check and returns ERR_HALL_NOT_FOUND 404, creating no PDU."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /pdus"
              payload: { hall_id: "00000000-0000-0000-0000-0000000000aa", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and ${err} == ERR_HALL_NOT_FOUND"
            - "GET /pdus returns total_count == 0"

      - name: busway_feed_side_and_hall_id_copied_from_pdu
        claim_type: computed_fields
        grounds:
          - entities.Busway.fields.hall_id
          - entities.Busway.fields.feed_side
          - entities.Busway.fields.usable_variant
          - calculations.busway_usable_kw
        distinguishing_aspect: "Busway.hall_id and Busway.feed_side are not inputs: creating a busway on the B-side PDU of hall CX11 yields feed_side B, that hall's id, usable_variant DESIGN and usable_kw 196.66 without either value appearing in the request."
        test_recipe:
          setup:
            - "Hall CX11 in PLANNING owns PDU-B1 (feed_side B, rated 300.00 kW)."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 11", code: "CX11", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_b_id: $.data.id }
          trigger:
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_b_id}", name: "BW-B1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_id: $.data.id }
          assert:
            - "Busway.${bw_id}.hall_id == ${hall_id}"
            - "Busway.${bw_id}.feed_side == B"
            - "Busway.${bw_id}.raw_kw == 273.136"
            - "Busway.${bw_id}.usable_variant == DESIGN"
            - "Busway.${bw_id}.usable_kw == 196.66"
            - "Busway.${bw_id}.status == INSTALLED and committed_kw == 0.00 and feed_count == 0"

      - name: rack_defaults_required_feed_count_and_u_height
        claim_type: defaults
        grounds:
          - entities.Rack.fields.required_feed_count
          - entities.Rack.fields.u_height
          - entities.Rack.fields.status
          - entities.Rack.fields.chargeable_kw
        distinguishing_aspect: "A rack created without required_feed_count, u_height, cage_id, tenant_id or asset_tag defaults to 2 / 42 / null / null / null, status PLANNED, connected_kw 0.00 and chargeable_kw round(10.00 * 1.045, 2) == 10.45."
        test_recipe:
          setup:
            - "Hall CX12 in PLANNING owns containment zone CA-1."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 12", code: "CX12", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
          trigger:
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "A", grid_col: 1, design_kw: 10.00 }
              as: FacilityPlanner
              captures: { rack_id: $.data.id }
          assert:
            - "Rack.${rack_id}.required_feed_count == 2"
            - "Rack.${rack_id}.u_height == 42"
            - "Rack.${rack_id}.cage_id is null and tenant_id is null and asset_tag is null"
            - "Rack.${rack_id}.status == PLANNED and pre_risk_status is null"
            - "Rack.${rack_id}.connected_kw == 0.00 and energized_feed_count == 0"
            - "Rack.${rack_id}.chargeable_kw == 10.45"
            - "Hall.${hall_id}.rack_total_count == 1 and Hall.${hall_id}.custody_fitout_count == 1 and Hall.${hall_id}.chargeable_kw == 0.00"

      - name: rack_feed_allocated_kw_and_feed_side_computed
        claim_type: computed_fields
        grounds:
          - entities.RackFeed.fields.allocated_kw
          - entities.RackFeed.fields.feed_side
          - entities.RackFeed.fields.status
          - entities.Busway.fields.committed_kw
        distinguishing_aspect: "RackFeed.allocated_kw is round(requested_kw, 3) == 7.500 and feed_side is copied from the busway (A), while the request's own feed_side value is not what determines it; the parent busway's committed_kw and feed_count reconcile to 7.500 and 1."
        test_recipe:
          setup:
            - "Hall CX13 is in FIT_OUT with PDU-A1/PDU-B1 COMMISSIONED, busways BW-A1/BW-B1 ENERGIZED, containment zone CA-1 UNTESTED and rack R-1-1 (design_kw 15.00) PLANNED."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 13", code: "CX13", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_b_id: $.data.id }
            - call: "PATCH /pdus/${pdu_a_id}"
              payload: { measured_derate_factor: 1.00 }
              as: ElectricalContractor
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 1, design_kw: 15.00, u_height: 45, required_feed_count: 2 }
              as: FacilityPlanner
              captures: { rack1_id: $.data.id }
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
            - call: "POST /busways/${bw_a_id}/energize"
              payload: {}
              as: ElectricalContractor
          trigger:
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_a_id}", feed_side: "A", requested_kw: 7.50, breaker_amps: 32 }
              as: ElectricalContractor
              captures: { feed_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "RackFeed.${feed_id}.allocated_kw == 7.500"
            - "RackFeed.${feed_id}.feed_side == A"
            - "RackFeed.${feed_id}.status == RESERVED and released_at is null"
            - "Busway.${bw_a_id}.committed_kw == 7.500 and Busway.${bw_a_id}.feed_count == 1"
            - "Rack.${rack1_id}.connected_kw == 7.50 and Rack.${rack1_id}.energized_feed_count == 0"
            - "Hall.${hall_id}.committed_kw == 7.50 and Hall.${hall_id}.spare_kw == 367.50"

      - name: cooling_unit_measured_airflow_null_until_commissioned
        claim_type: defaults
        grounds:
          - entities.CoolingUnit.fields.measured_airflow_cfm
          - entities.CoolingUnit.fields.airflow_capacity_kw
          - entities.CoolingUnit.fields.status
        distinguishing_aspect: "A freshly created cooling unit reports measured_airflow_cfm null, airflow_capacity_kw 0.0 and status INSTALLED, and it contributes nothing to the hall's two capacity variants until it reaches IN_SERVICE."
        test_recipe:
          setup:
            - "Hall CX14 exists in PLANNING."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 14", code: "CX14", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
          trigger:
            - call: "POST /cooling-units"
              payload: { hall_id: "${hall_id}", name: "CU-1", rated_sensible_kw: 120.00, design_airflow_cfm: 22000, supply_delta_t_f: 18.0, redundancy_role: "PRIMARY" }
              as: MechanicalContractor
              captures: { cu_id: $.data.id }
          assert:
            - "CoolingUnit.${cu_id}.status == INSTALLED"
            - "CoolingUnit.${cu_id}.measured_airflow_cfm is null"
            - "CoolingUnit.${cu_id}.airflow_capacity_kw == 0.0"
            - "Hall.${hall_id}.cooling_capacity_nameplate_kw == 0.00 and Hall.${hall_id}.cooling_capacity_airflow_kw == 0.00 and Hall.${hall_id}.cooling_capacity_kw == 0.00"

      - name: containment_zone_measured_fields_null_until_tested
        claim_type: defaults
        grounds:
          - entities.ContainmentZone.fields.measured_leakage_pct
          - entities.ContainmentZone.fields.measured_static_pressure_pa
          - entities.ContainmentZone.fields.leakage_status
          - entities.ContainmentZone.fields.test_count
        distinguishing_aspect: "A new containment zone carries leakage_status UNTESTED, test_count 0 and both measured_* fields null, so the hall's worst-leakage input set is empty and leak_fraction stays 0.00."
        test_recipe:
          setup:
            - "Hall CX15 exists in PLANNING."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 15", code: "CX15", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
          trigger:
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "HOT_AISLE", containment_kind: "CHIMNEY", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
              captures: { zone_id: $.data.id }
          assert:
            - "ContainmentZone.${zone_id}.leakage_status == UNTESTED"
            - "ContainmentZone.${zone_id}.test_count == 0"
            - "ContainmentZone.${zone_id}.measured_leakage_pct is null and measured_static_pressure_pa is null"
            - "GET /halls/${hall_id}/capacity-summary returns worst_leakage_pct == 0.00"

      - name: cage_defaults_coverage_and_reader_requirements
