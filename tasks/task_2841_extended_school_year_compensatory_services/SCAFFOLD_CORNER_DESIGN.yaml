            - "Clock 2027-06-01T00:00:00Z; Student S1 ELIGIBLE via a FINALIZED PROBE_BASED determination whose max_regression_pct is 26.0; program P1 OPEN with commitment C1 ACTIVE; four ServiceLog rows on C1, the PARTIAL one voided."
