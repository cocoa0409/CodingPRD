              payload: { market_segment: "MG3_SOUTH", target_yield_kg_per_ha: 10000.00, required_disease_resistances: ["RUST"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
            - call: "GET /breeding-programs/${prog_id}/pipeline-report"
              payload: {}
              as: PipelineDirector
          assert:
            - "the close -> 200 and BreedingProgram.${prog_id}.status == CLOSED"
            - "the line, the entry and the second objective all -> 409 with data.error_id == ERR_PROGRAM_CLOSED"
            - "the pipeline report still -> 200 with status == CLOSED, active_line_count == 1, committed_plot_count == 0"
            - "BreedingProgram.${prog_id}.active_line_count == 1 - the refused line was never created"
            - "TrialSeries.${series_id}.entry_count == 0 and status == PLANNING"

      - name: line_discard_four_level_cascade
        claim_type: Cascade down
        grounds:
          - state_machines.BreedingLine.pipeline_stage_DISCARDED
        excluded_because:
          difficulty_instance: transitive_cascade / line_discard_cascades_entries_sites_program_lots_and_backcross
          rationale: "The full L1-L4 cascade down both branches, including the TrialSite posture re-derivation and the lot/backcross fan-out, is the asserted subject of that §1.8 instance."

      - name: line_parallel_state_dimensions_move_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / line_parallel_dimensions_advance_without_disturbing_stewardship
          rationale: "Independent movement of pipeline_stage while stewardship_status holds at APPROVED is exactly what that §1.8 instance asserts."

      - name: agreement_review_loop_is_re_enterable
        claim_type: cyclic
        grounds:
          - state_machines.StewardshipAgreement
        excluded_because:
          difficulty_instance: non_linear_state_machine / agreement_submit_changes_requested_cycle_bumps_revision_round
          rationale: "The SUBMITTED <-> CHANGES_REQUESTED loop, its revision_round counter and its exit are asserted there."

      - name: stewardship_suspension_puts_lots_on_hold
        claim_type: Conditional cascade
        grounds:
          - state_machines.StewardshipAgreement.APPROVED_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / stewardship_suspension_cascades_lots_line_bags_and_program_rollup
          rationale: "The status-filtered lot cascade (RESERVED and IN_PRODUCTION only) and the rollup recomputation are asserted there."

  - section: calculations
    instances:
      - name: entry_rollup_excludes_rejected_outlier_and_other_traits
