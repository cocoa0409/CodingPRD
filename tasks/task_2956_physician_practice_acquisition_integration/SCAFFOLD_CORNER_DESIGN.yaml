      - name: staff_offer_computed_wage_fields_present_on_create
        claim_type: Computed Fields
        grounds:
          - calculations.staff_offer_wage_harmonization
          - entities.StaffTransitionOffer.fields.uplift_component_cents
          - entities.StaffTransitionOffer.fields.pto_component_cents
          - entities.StaffTransitionOffer.fields.wage_floor_applied
        distinguishing_aspect: |
          A DRAFT StaffTransitionOffer already carries every derived wage figure:
          an MA on 3600000 with 40 PTO hours harmonises to 3778615, falls under the
          SYSTEM_PAY_SCALE_MIN_CENTS floor of 4200000, and is therefore stored with
          wage_floor_applied true — while the retention pool ledger stays untouched
          because DRAFT offers commit nothing.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING with retention_pool_total_cents 3000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
