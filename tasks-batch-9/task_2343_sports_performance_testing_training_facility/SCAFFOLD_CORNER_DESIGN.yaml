          difficulty_instance: readiness_decay_grace_boundary_at_day_30_versus_day_31_on_progress_report
          rationale: "GET /athletes/{id}/progress-report is the only computed-read endpoint; the cited §1.8 instance asserts its derived readiness_index at a decay boundary, and progress_report_delta_between_two_finalized_batteries in this file asserts the remaining derived fields."

      - name: bulk_action_partial_success_semantics
        claim_type: Bulk action
        excluded_because:
          difficulty_instance: third_no_show_strike_cascades_suspension_refund_and_waitlist_promotion
          rationale: "No endpoint in §1.5 accepts a batch of independent items, so there is no bulk endpoint to test. The closest multi-row operation is the completion sweep and the suspension cascade, whose per-row semantics the cited §1.8 instance asserts row by row."

