            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 10, manufacture_date: "2026-04-01" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 1, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_COLD_CHAIN_NOT_CERTIFIED and HTTP status == 403"

      - name: credit_limit_exceeded_returns_402
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_CREDIT_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Projected total 1800 (product 1000 + STANDARD estimate 800) against credit_limit 100 fails with 402 ERR_CREDIT_LIMIT_EXCEEDED; the order stays DRAFT."
        test_recipe:
          setup: ["warehouse, zone, product 1000, lot of 10; customer credit_limit 100; DRAFT order qty 1"]
          setup_api_calls:
