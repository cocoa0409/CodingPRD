        excluded_because:
          difficulty_instance: clearance_revocation_cascades_to_assignment_plan_roster_and_posture
          rationale: "The §1.8 multi_hop_cascade instance already walks the full four-level chain (clearance -> assignment -> plan -> affiliate counters -> agreement posture) and its companion instance walks the assignment-revocation chain, so an additional §1.9 cascade instance would only re-test the same ordering."

      - name: both_workload_variants_on_identical_logs
