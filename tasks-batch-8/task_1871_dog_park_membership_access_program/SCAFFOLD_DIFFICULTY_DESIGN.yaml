  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: capacity_boundary_exact_full
        grounds:
          - calculations.effective_capacity
          - calculations.occupancy_count
          - errors[ERR_AREA_AT_CAPACITY]
        distinguishing_aspect: |
          Metric = area OPEN-visit count at POST check-in: occupancy 0 and 1 admit
          (count < capacity 2), occupancy == 2 rejects — the >= boundary fires at
          exactly capacity, distinct metric and endpoint from the strike instance.
        test_recipe:
          setup:
            - "Clock 2026-08-03 10:00 (no peak windows); SMALL area capacity 2; three members each with VERIFIED SMALL dog and ACTIVE membership"
          setup_api_calls:
