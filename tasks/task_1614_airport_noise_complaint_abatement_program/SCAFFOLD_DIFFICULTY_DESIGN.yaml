            - { call: "POST /noise-program/noise-studies", payload: { title: "Part150 Theta", baseline_year: 2025 }, as: StudyCoordinator, captures: { st_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/start-data-collection", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-LOW", land_use: "RESIDENTIAL", dnl_db_measured: 64.9, dnl_db_modeled: 66.5, zone_code: "Z1" }, as: StudyCoordinator, captures: { p_low: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-EXACT", land_use: "RESIDENTIAL", dnl_db_measured: 65.0, dnl_db_modeled: 66.5, zone_code: "Z1" }, as: StudyCoordinator, captures: { p_exact: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/release-draft", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/open-public-comment", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/adopt", payload: {}, as: NoiseOfficeAdmin }
          trigger:
            - { call: "POST /noise-program/sound-insulation-applications", payload: { parcel_id: "${p_low}", dwelling_type: "SINGLE_FAMILY", rooms_count: 4, est_cost_cents: 500000 }, as: CommunityLiaison, captures: { err: $.data.error_id } }
            - { call: "POST /noise-program/sound-insulation-applications", payload: { parcel_id: "${p_exact}", dwelling_type: "SINGLE_FAMILY", rooms_count: 4, est_cost_cents: 500000 }, as: CommunityLiaison, captures: { ok_id: $.data.id, ok_es: $.data.eligibility_status } }
          assert:
            - "err == ERR_PARCEL_NOT_INCOMPATIBLE (64.9 < 65.0)"
            - "ok_es == NEW (65.0 >= 65.0 boundary inclusive)"

      - name: uptime_floor_80_0_passes_79_9_rejected
        grounds:
          - calculations.monitor_uptime_30d
          - errors[ERR_UPTIME_BELOW_FLOOR]
          - state_machines.NoiseEvent.CLASSIFIED_COMMUNITY_to_VERIFIED
        distinguishing_aspect: |
          Boundary on uptime_pct_30d via event verify: monitor M1 with an 8,640-minute
          outage in the trailing 30 days reads exactly 80.0 and verify passes;
          monitor M2 with 8,700 minutes reads 79.9 and verify fails. Distinct metric
          and endpoint from the complaint-count and DNL boundaries.
        test_recipe:
