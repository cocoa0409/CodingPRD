            - { call: "POST /tariff-rates", payload: { car_type: "TANK_GENERAL", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 60 }, as: LeaseAdmin }
