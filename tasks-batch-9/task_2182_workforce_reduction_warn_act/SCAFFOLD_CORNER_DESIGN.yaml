  - section: endpoints
    instances:

      - name: roster_import_creates_every_entry_and_refreshes_site_counters
        claim_type: bulk_action
        grounds: ["endpoints.POST_/sites/{id}/roster-import", entities.Site.fields.roster_count]
        distinguishing_aspect: "One roster-import of three entries answers created_count 3 with employee_ids in the exact order the entries array was supplied, and the site reports roster_count 3 / active_headcount 3 / pending_separation_count 0."
        test_recipe:
          setup:
            - "One TX site with no employees."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /sites/${site_id}/roster-import"
              payload: { entries: [ { full_name: "Alice Nunez", job_title: "Senior Analyst", birth_date: "1978-05-10", hire_date: "2015-04-01", annual_base_cents: 8700000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }, { full_name: "Ben Okafor", job_title: "Analyst", birth_date: "1990-02-20", hire_date: "2020-01-15", annual_base_cents: 6240000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }, { full_name: "Carla Reyes", job_title: "Ops Manager", birth_date: "1972-11-05", hire_date: "2018-06-01", annual_base_cents: 7280000, weekly_hours: 40, demographic_code: "CLASS_B", monthly_premium_cents: 90000 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { count: $.data.created_count, first_id: "$.data.employee_ids[0]", third_id: "$.data.employee_ids[2]" }
          assert:
            - "HTTP status == 201"
            - "${count} == 3"
            - "Employee.${first_id}.full_name == Alice Nunez"
            - "Employee.${third_id}.full_name == Carla Reyes"
            - "Site.${site_id}.roster_count == 3"
            - "Site.${site_id}.active_headcount == 3"
            - "Site.${site_id}.pending_separation_count == 0"
            - "GET /employees?site_id=${site_id} returns exactly 3 rows"

      - name: decide_batch_reports_selected_and_exempted_counts_separately
        claim_type: bulk_action
        grounds: ["endpoints.POST_/reduction-plans/{id}/decide-batch", "endpoints.POST_/reduction-plans/{id}/selection-batch"]
        distinguishing_aspect: "A decide-batch of three SELECT ids answers decided_count 3 / selected_count 3 / exempted_count 0, and a following EXEMPT batch of one answers decided_count 1 / selected_count 0 / exempted_count 1; the plan ends at selected_count 3 and pool_count 4."
        test_recipe:
          setup:
            - "TX site with four employees and a plan with LOCKED criteria holding four PROPOSED selections."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/roster-import"
              payload: { entries: [ { full_name: "Alice Nunez", job_title: "Senior Analyst", birth_date: "1978-05-10", hire_date: "2015-04-01", annual_base_cents: 8700000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }, { full_name: "Ben Okafor", job_title: "Analyst", birth_date: "1990-02-20", hire_date: "2020-01-15", annual_base_cents: 6240000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }, { full_name: "Carla Reyes", job_title: "Ops Manager", birth_date: "1972-11-05", hire_date: "2018-06-01", annual_base_cents: 7280000, weekly_hours: 40, demographic_code: "CLASS_B", monthly_premium_cents: 90000 }, { full_name: "Dan Whitfield", job_title: "Ops Specialist", birth_date: "1985-03-15", hire_date: "2021-09-01", annual_base_cents: 5720000, weekly_hours: 40, demographic_code: "CLASS_B", monthly_premium_cents: 90000 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { alice_id: "$.data.employee_ids[0]", ben_id: "$.data.employee_ids[1]", carla_id: "$.data.employee_ids[2]", dan_id: "$.data.employee_ids[3]" }
            - call: "POST /reduction-plans"
              payload: { name: "Austin Reduction", decisional_unit_name: "Austin Operations", selection_criteria: [ { criterion_code: "PERFORMANCE", weight_pct: 50, description: "Most recent performance rating" }, { criterion_code: "CRITICAL_SKILLS", weight_pct: 30, description: "Retained-skill criticality" }, { criterion_code: "TENURE", weight_pct: 20, description: "Length of continuous service" } ], severance_budget_cents: 20000000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { plan_id: $.data.id }
            - call: "POST /reduction-plans/${plan_id}/lock-criteria"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "POST /reduction-plans/${plan_id}/selection-batch"
              payload: { employee_ids: ["${alice_id}", "${carla_id}", "${dan_id}", "${ben_id}"], proposed_separation_date: "2026-12-01", criterion_scores: [ { criterion_code: "PERFORMANCE", score: 72 }, { criterion_code: "CRITICAL_SKILLS", score: 55 }, { criterion_code: "TENURE", score: 88 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { created: $.data.created_count, s_alice: "$.data.selection_ids[0]", s_carla: "$.data.selection_ids[1]", s_dan: "$.data.selection_ids[2]", s_ben: "$.data.selection_ids[3]" }
          trigger:
            - call: "POST /reduction-plans/${plan_id}/decide-batch"
              payload: { selection_ids: ["${s_alice}", "${s_carla}", "${s_dan}"], decision: "SELECT" }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { d1: $.data.decided_count, sel1: $.data.selected_count, ex1: $.data.exempted_count }
            - call: "POST /reduction-plans/${plan_id}/decide-batch"
              payload: { selection_ids: ["${s_ben}"], decision: "EXEMPT", exemption_reason: "Retained for critical skills." }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { d2: $.data.decided_count, sel2: $.data.selected_count, ex2: $.data.exempted_count }
          assert:
            - "${created} == 4"
            - "${d1} == 3"
            - "${sel1} == 3"
            - "${ex1} == 0"
            - "${d2} == 1"
            - "${sel2} == 0"
            - "${ex2} == 1"
            - "ReductionPlan.${plan_id}.selected_count == 3"
            - "ReductionPlan.${plan_id}.pool_count == 4"
            - "Site.${site_id}.active_headcount == 1"
            - "Site.${site_id}.pending_separation_count == 3"

      - name: logical_clock_starts_at_the_declared_default_and_moves_on_demand
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/_clock/set_current_utc", entities.Selection.fields.notice_delivered_utc]
        distinguishing_aspect: "Before any set_current_utc call the server clock reads exactly 2026-08-01T00:00:00.000Z, never real wall-clock time, and setting it to 2026-09-10T12:00:00.000Z is echoed back verbatim in current_utc."
        test_recipe:
          setup:
            - "Empty database, clock untouched."
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00.000Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
              captures: { now_after: $.data.current_utc }
          assert:
            - "${now_after} == 2026-09-10T12:00:00.000Z"
            - "before this call the server clock reads exactly 2026-08-01T00:00:00.000Z"
            - "HTTP status == 200"

      - name: severance_offers_filtered_list_by_plan_and_status
        claim_type: standard_crud
        grounds: ["endpoints.GET_/severance-offers", entities.SeveranceOffer.fields.plan_id]
        excluded_because:
          difficulty_instance: severance_offer_blocked_while_latest_analysis_is_not_cleared
          rationale: "The named 1.8 instance already exercises GET /severance-offers?selection_id=... as its zero-row reverse-reachability assertion for the SeveranceOffer FK set."

