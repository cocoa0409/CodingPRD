# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2908 — Wholesale Auction Arbitration & Condition Disputes
#
# Nine rule_ids from §0.5, each with >= 2 differentiated instances.
# Every literal below is pre-computed from the formulas in SCAFFOLD.yaml §1.3.
# The logical clock starts at its mandatory default 2026-08-01T00:00:00Z, so no
# instance needs an opening /_clock/set_current_utc call.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: allowance_negotiated_accept_exceeds_arbitrator_formula
        grounds:
          - calculations.repair_allowance_amount
          - state_machines.ArbitrationCase.NEGOTIATION_to_RESOLVED_ALLOWANCE
          - entities.ArbitrationDecision.fields.allowance_variant
          - entities.ArbitrationDecision.fields.computed_award_cents
          - entities.AuctionSale.fields.light_channel
        distinguishing_aspect: |
          This instance pins the NEGOTIATED_ACCEPT variant of the money-domain dual
          variant: on one and the same case the accepted seller offer (200000) and the
          arbitrator formula output (171000) are both persisted on the decision row, so
          a single response proves the two variants diverge by 29000 cents on identical
          inputs and that the negotiated path is NOT bounded by the formula.
        test_recipe:
          setup:
            - "one Seller SL-1001 in GOOD_STANDING and one Buyer BL-2001 with claim_privilege_status ACTIVE"
            - "one FRAME_DAMAGE ArbitrationPolicy: window_hours 168, mileage_limit 1000, min_claim_amount_cents 50000, requires_third_party_verification true, max_allowance_bps 3000, psi_extension_hours 72, psi_clean_waives_rights false"
            - "one AuctionSale at sale_price_cents 1450000, announced_odometer_miles 84000, light_channel RED, hammer_time_utc 2026-08-01T00:00:00Z (equal to the default logical clock)"
            - "one FRAME_DAMAGE ArbitrationCase in status NEGOTIATION carrying a verified INSPECTION_REPORT with repair_estimate_cents 285000 and a verified THIRD_PARTY_VERIFICATION with no estimate"
            - "one NegotiationRound in status OPEN with seller_offer_cents 200000 and response_deadline_utc 2026-08-03T00:00:00Z"
            - "the case has zero TransportLeg rows, so every transport share is 0"
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "FRAME_DAMAGE", window_hours: 168, mileage_limit: 1000, min_claim_amount_cents: 50000, requires_third_party_verification: true, max_allowance_bps: 3000, psi_extension_hours: 72, psi_clean_waives_rights: false }
              as: AuctionAdmin
              captures: { policy_frame_id: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "RED", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_id}", defect_class: "FRAME_DAMAGE", claim_amount_cents: 285000, odometer_at_claim: 84120, complaint_text: "Frame rail repair found on the lift" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_id: $.data.id }
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "INSPECTION_REPORT", provider_name: "AutoCheck Bay 4", document_reference: "IR-88120", repair_estimate_cents: 285000 }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "THIRD_PARTY_VERIFICATION", provider_name: "National Frame Verify", document_reference: "TPV-4471" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases/${case_id}/open-review"
              payload: {}
              as: Arbitrator
              as_user_id: "arb-intake-01"
            - call: "POST /arbitration/cases/${case_id}/seller-response"
              payload: { response_type: "OFFER_REPAIR_ALLOWANCE", response_note: "Goodwill allowance offered", seller_offer_cents: 200000 }
              as: SellerRep
              as_user_id: "${seller_id}"
              captures: { round_id: $.data.id }
          trigger:
            - call: "POST /arbitration/cases/${case_id}/negotiation-rounds/${round_id}/accept"
              payload: {}
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { decision_id: $.data.id }
          assert:
            - "HTTP 201 and response.data.allowance_variant == \"NEGOTIATED_ACCEPT\""
            - "response.data.allowance_cents == 200000"
            - "response.data.computed_award_cents == 171000   # round_half_up(285000 * 6000 / 10000) = 171000, min with cap round_half_up(1450000 * 3000 / 10000) = 435000"
            - "response.data.allowance_cents - response.data.computed_award_cents == 29000"
            - "response.data.outcome == \"REPAIR_ALLOWANCE\" and response.data.fault_party == \"SELLER\""
            - "response.data.transport_total_cents == 0 and response.data.transport_buyer_share_cents == 0 and response.data.transport_seller_share_cents == 0 and response.data.transport_auction_share_cents == 0"
            - "GET /arbitration/cases/${case_id} returns status == \"RESOLVED_ALLOWANCE\""
            - "GET /arbitration/cases/${case_id}/negotiation-rounds returns exactly 1 row with status == \"ACCEPTED\""
            - "GET /arbitration/cases/${case_id}/ledger-entries returns exactly 2 rows: (party BUYER, entry_type REPAIR_ALLOWANCE, amount_signed_cents +200000) and (party SELLER, entry_type REPAIR_ALLOWANCE, amount_signed_cents -200000)"

      - name: allowance_arbitrator_award_clipped_by_severity_formula
        grounds:
          - calculations.repair_allowance_amount
          - state_machines.ArbitrationCase.ARBITRATOR_REVIEW_to_RESOLVED_ALLOWANCE
          - entities.ArbitrationDecision.fields.allowance_variant
          - validations[priority=47]
        distinguishing_aspect: |
          Same case data as allowance_negotiated_accept_exceeds_arbitrator_formula but
          routed through the ARBITRATOR_AWARD variant, which IS bounded: the arbitrator
          asks for 250000 and receives min(250000, 171000) = 171000, so the identical
          285000 estimate under a RED light channel yields 171000 here versus 200000 on
          the negotiated path — the delta is caused only by the variant selector.
        test_recipe:
          setup:
            - "identical registry, policy, sale, case and evidence as the negotiated-accept instance"
            - "the seller answered with response_type DISPUTE, so ArbitrationCase.status is ARBITRATOR_REVIEW, seller_conceded is false and current_round_index is 1"
            - "intake_arbitrator_user_id is arb-intake-01, so the decision must be issued by a different operator"
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "FRAME_DAMAGE", window_hours: 168, mileage_limit: 1000, min_claim_amount_cents: 50000, requires_third_party_verification: true, max_allowance_bps: 3000, psi_extension_hours: 72, psi_clean_waives_rights: false }
              as: AuctionAdmin
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "RED", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_id}", defect_class: "FRAME_DAMAGE", claim_amount_cents: 285000, odometer_at_claim: 84120, complaint_text: "Frame rail repair found on the lift" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_id: $.data.id }
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "INSPECTION_REPORT", provider_name: "AutoCheck Bay 4", document_reference: "IR-88120", repair_estimate_cents: 285000 }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "THIRD_PARTY_VERIFICATION", provider_name: "National Frame Verify", document_reference: "TPV-4471" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases/${case_id}/open-review"
              payload: {}
              as: Arbitrator
              as_user_id: "arb-intake-01"
            - call: "POST /arbitration/cases/${case_id}/seller-response"
              payload: { response_type: "DISPUTE", response_note: "Damage was pre-existing and disclosed on the condition report" }
              as: SellerRep
              as_user_id: "${seller_id}"
          trigger:
            - call: "POST /arbitration/cases/${case_id}/decision"
              payload: { outcome: "REPAIR_ALLOWANCE", fault_party: "SELLER", rationale: "Frame repair substantiated; award set by the severity formula", requested_allowance_cents: 250000 }
              as: Arbitrator
              as_user_id: "arb-decide-02"
          assert:
            - "HTTP 201 and response.data.allowance_variant == \"ARBITRATOR_AWARD\""
            - "response.data.computed_award_cents == 171000"
            - "response.data.allowance_cents == 171000   # min(requested 250000, computed 171000)"
            - "response.data.allowance_cents != 250000 and response.data.allowance_cents != 200000"
            - "GET /arbitration/cases/${case_id} returns status == \"RESOLVED_ALLOWANCE\""
            - "GET /arbitration/sales/${sale_id} returns settlement_status == \"UNSETTLED\"   # the allowance branch never touches the settlement dimension"
            - "GET /arbitration/cases/${case_id}/ledger-entries returns exactly 2 rows summing to 0, with the BUYER row at +171000"

      - name: seller_rate_rolling_diverges_from_lifetime_and_only_rolling_tiers
        grounds:
          - calculations.seller_arbitration_rate
          - state_machines.Seller.GOOD_STANDING_to_BLOCKED
          - entities.Seller.fields.rolling_arbitration_rate_bps
          - entities.Seller.fields.lifetime_arbitration_rate_bps
          - entities.Seller.fields.policy_tier
        distinguishing_aspect: |
          A structurally unrelated second dual variant in the RISK domain, not the money
          domain: the same seller yields rolling 2500 bps and lifetime 2000 bps because
          one of its five sales hammered outside the 90-day window, and the BLOCKED tier
          is produced by the rolling variant alone — a tier derived from the lifetime
          variant would have read 2000 bps and stopped at PROBATION.
        test_recipe:
          setup:
            - "one Seller SL-1001 and one Buyer BL-2001"
            - "one TITLE_BRANDED ArbitrationPolicy with window_hours omitted (an UNLIMITED window), mileage_limit omitted, min_claim_amount_cents 0, requires_third_party_verification true, max_allowance_bps 0, psi_extension_hours 0, psi_clean_waives_rights false"
            - "five AuctionSale rows for that seller: four with hammer_time_utc 2026-07-01T00:00:00Z (inside the 90-day window that opens at 2026-05-03T00:00:00Z) and one with hammer_time_utc 2026-03-01T00:00:00Z (outside it)"
            - "the logical clock is left at its default 2026-08-01T00:00:00Z throughout"
            - "one TITLE_BRANDED case on the first in-window sale, evidenced, reviewed and disputed, so it sits in ARBITRATOR_REVIEW"
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "TITLE_BRANDED", min_claim_amount_cents: 0, requires_third_party_verification: true, max_allowance_bps: 0, psi_extension_hours: 0, psi_clean_waives_rights: false }
              as: AuctionAdmin
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE10001", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-07-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "GREEN", title_status: "BRANDED_SALVAGE" }
              as: BlockClerk
              captures: { sale_in_1: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE10002", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 900000, hammer_time_utc: "2026-07-01T00:00:00Z", announced_odometer_miles: 60000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_in_2: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE10003", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 900000, hammer_time_utc: "2026-07-01T00:00:00Z", announced_odometer_miles: 61000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_in_3: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE10004", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 900000, hammer_time_utc: "2026-07-01T00:00:00Z", announced_odometer_miles: 62000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_in_4: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE10005", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 900000, hammer_time_utc: "2026-03-01T00:00:00Z", announced_odometer_miles: 63000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_out_5: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_in_1}", defect_class: "TITLE_BRANDED", claim_amount_cents: 100000, odometer_at_claim: 84300, complaint_text: "Title came back branded salvage, announced as clean" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_id: $.data.id }
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "TITLE_DOCUMENT", provider_name: "State DMV", document_reference: "TTL-90211" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "THIRD_PARTY_VERIFICATION", provider_name: "TitleTrace", document_reference: "TPV-5500" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases/${case_id}/open-review"
              payload: {}
              as: Arbitrator
              as_user_id: "arb-intake-01"
            - call: "POST /arbitration/cases/${case_id}/seller-response"
              payload: { response_type: "DISPUTE", response_note: "Branding postdates the sale" }
              as: SellerRep
              as_user_id: "${seller_id}"
          trigger:
            - call: "POST /arbitration/cases/${case_id}/decision"
              payload: { outcome: "UNWIND", fault_party: "SELLER", rationale: "Branded title, unlimited window, sale unwound" }
              as: Arbitrator
              as_user_id: "arb-decide-02"
            - call: "GET /arbitration/sellers/${seller_id}/scorecard"
              payload: {}
              as: AuctionAdmin
          assert:
            - "the scorecard read returns rolling_window_sales_count == 4 and lifetime_sales_count == 5"
            - "the scorecard read returns rolling_window_upheld_count == 1 and lifetime_upheld_count == 1"
            - "the scorecard read returns rolling_arbitration_rate_bps == 2500   # round_half_up(10000 * 1 / 4)"
            - "the scorecard read returns lifetime_arbitration_rate_bps == 2000   # round_half_up(10000 * 1 / 5)"
            - "rolling_arbitration_rate_bps - lifetime_arbitration_rate_bps == 500"
            - "the scorecard read returns policy_tier == \"BLOCKED\"   # 2500 >= TIER_BLOCK_BPS 2500, decided by the rolling variant only"
            - "GET /arbitration/sellers/${seller_id} returns policy_tier == \"BLOCKED\" and blocked_at_utc == \"2026-08-01T00:00:00Z\""
            - "GET /arbitration/sellers/${seller_id}/policy-actions returns exactly 1 row with action_type == \"BLOCK\", from_tier == \"GOOD_STANDING\", to_tier == \"BLOCKED\", triggered_by_case_id == ${case_id}"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: window_eligibility_three_dimension_conjunction_with_psi_extension
        grounds:
          - calculations.arbitration_window_evaluation
          - state_machines.PostSaleInspection.REQUESTED_to_COMPLETED
          - entities.ArbitrationPolicy.fields.psi_extension_hours
          - entities.ArbitrationCase.fields.effective_window_hours
          - validations[priority=33]
          - validations[priority=34]
        distinguishing_aspect: |
          Mode (a) — the verdict is a conjunction over THREE independent dimensions that
          interact: the nullable time window, the nullable mileage limit, and the
          post-sale-inspection extension. Here the raw 100.0 elapsed hours exceed the
          48h MECHANICAL window, yet the claim is admitted because a COMPLETED inspection
          whose findings name MECHANICAL adds 96h, moving the effective window to 144h;
          collapsing any one dimension flips the verdict.
        test_recipe:
          setup:
            - "one Seller SL-1001, one Buyer BL-2001 with claim_privilege_status ACTIVE"
            - "one MECHANICAL ArbitrationPolicy: window_hours 48, mileage_limit 250, min_claim_amount_cents 60000, requires_third_party_verification false, max_allowance_bps 2000, psi_extension_hours 96, psi_clean_waives_rights true"
            - "one AuctionSale with hammer_time_utc 2026-08-01T00:00:00Z, announced_odometer_miles 84000, sale_price_cents 1450000, light_channel GREEN"
            - "one PostSaleInspection on that sale in status COMPLETED with findings [\"MECHANICAL\"], completed_at_utc 2026-08-02T00:00:00Z"
            - "the logical clock stands at 2026-08-05T04:00:00Z, exactly 100 hours after hammer time"
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "MECHANICAL", window_hours: 48, mileage_limit: 250, min_claim_amount_cents: 60000, requires_third_party_verification: false, max_allowance_bps: 2000, psi_extension_hours: 96, psi_clean_waives_rights: true }
              as: AuctionAdmin
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_id: $.data.id }
            - call: "POST /arbitration/post-sale-inspections"
              payload: { sale_id: "${sale_id}", program_tier: "PREMIUM" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { psi_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: AuctionAdmin
            - call: "POST /arbitration/post-sale-inspections/${psi_id}/complete"
              payload: { findings: ["MECHANICAL"] }
              as: Inspector
              as_user_id: "insp-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T04:00:00Z" }
              as: AuctionAdmin
          trigger:
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_id}", defect_class: "MECHANICAL", claim_amount_cents: 60000, odometer_at_claim: 84200, complaint_text: "Transmission slips under load" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_id: $.data.id }
          assert:
            - "HTTP 201 and response.data.status == \"SUBMITTED\""
            - "response.data.hours_elapsed_at_claim == 100.0"
            - "response.data.miles_driven_at_claim == 200"
            - "response.data.psi_extension_applied_hours == 96"
            - "response.data.effective_window_hours == 144   # 48 + 96"
            - "response.data.window_eligible == true"
            - "response.data.policy_version_at_intake == 1"
            - "GET /arbitration/sales/${sale_id} returns arbitration_status == \"ACTIVE\" and open_case_count == 1"
            - "GET /arbitration/sales/${sale_id}/post-sale-inspections returns exactly 1 row with status == \"COMPLETED\" and fee_cents == 27500"

      - name: transport_allocation_per_leg_rounding_order_beats_sum_then_round
        grounds:
          - calculations.transport_cost_allocation
          - entities.TransportLeg.fields.cost_cents
          - entities.SettlementLedgerEntry.fields.amount_signed_cents
          - concurrency_rules[transport-leg-stale-case]
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER is observable: two legs of 137 and 201
          miles cost 32735 and 42655 cents, and rounding each party's 2000/7000 bps share
          per leg then summing yields seller 52774 / auction 7538, whereas summing the
          75390 total first and rounding once yields seller 52773 / auction 7539. The
          three-band marginal mileage formula is itself a second nesting inside the same
          calculation.
        test_recipe:
          setup:
            - "the FRAME_DAMAGE registry, sale and evidenced case of the dual-variant instances, in status UNDER_REVIEW with ArbitrationCase.version 2"
            - "two TransportLeg rows on the case, created in this order: 137 miles then 201 miles, each recorded with the case version the client last observed"
            - "one NegotiationRound in status OPEN with seller_offer_cents 200000"
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "FRAME_DAMAGE", window_hours: 168, mileage_limit: 1000, min_claim_amount_cents: 50000, requires_third_party_verification: true, max_allowance_bps: 3000, psi_extension_hours: 72, psi_clean_waives_rights: false }
              as: AuctionAdmin
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "RED", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_id}", defect_class: "FRAME_DAMAGE", claim_amount_cents: 285000, odometer_at_claim: 84120, complaint_text: "Frame rail repair found on the lift" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_id: $.data.id }
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "INSPECTION_REPORT", provider_name: "AutoCheck Bay 4", document_reference: "IR-88120", repair_estimate_cents: 285000 }
              as: BuyerRep
              as_user_id: "${buyer_id}"
