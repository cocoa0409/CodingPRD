  # =========================================================================
  # Section: errors — every error triggerable
  # =========================================================================
  - section: errors
    instances:
      - name: err_invalid_request_on_missing_required
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_REQUEST]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_business_safety_dye_approve
          rationale: "Covered by §1.9 instance fiber_lot_missing_required_field_returns_invalid_request."

      - name: err_unauthenticated_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]"]
        excluded_because:
          difficulty_instance: validations / missing_auth_header_returns_unauthenticated
          rationale: "Already exercised by §1.9 instance missing_auth_header_returns_unauthenticated."

  # =========================================================================
  # Section: rbac — role isolation
  # =========================================================================
  - section: rbac
    instances:
      - name: dye_house_operator_cannot_approve_recipe
        claim_type: role_isolation
        grounds: ["roles.MillPlanner", "roles.DyeHouseOperator"]
        distinguishing_aspect: "Recipe approve is MillPlanner-exclusive; DyeHouseOperator is denied."
        test_recipe:
          setup: ["A DRAFT BlendRecipe exists"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "RBAC-A", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 100.0 }
              as: MillPlanner
          trigger:
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: DyeHouseOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_FORBIDDEN"

      - name: quality_inspector_cannot_create_yarn_lot
        claim_type: role_isolation
        grounds: ["roles.SpinningSupervisor", "roles.QualityInspector"]
        distinguishing_aspect: "Yarn lot creation is SpinningSupervisor-exclusive."
        test_recipe:
          setup: ["An approved recipe exists"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "RBAC-B", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 100.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
          trigger:
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 100.0, actual_yarn_count_ne: 20.0 }
              as: QualityInspector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_FORBIDDEN"

      - name: mill_admin_cannot_create_fiber_lot
        claim_type: role_isolation
        grounds: ["roles.MillAdmin", "roles.MillPlanner"]
        distinguishing_aspect: "MillAdmin is restricted to machine registration only."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 100.0, unit_cost_per_lb: 1.5 }
              as: MillAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_FORBIDDEN"

  # =========================================================================
  # Section: cross-cutting — OCC stale version
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_recipe_approve
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[recipe-approve-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Stale expected_recipe_version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["DRAFT recipe with components; client holds version 1"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "OCC-A", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 100.0 }
              as: MillPlanner
          trigger:
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v} - 1" }
              as: MillPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_VERSION"

      - name: occ_stale_version_on_order_allocate
