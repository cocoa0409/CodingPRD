      - name: report_line_acres_exceed_field_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_LINE_ACRES_EXCEED_FIELD]"]
        distinguishing_aspect: "A report line whose planted+prevented acres exceed the parent Field.acres is rejected."
        test_recipe:
          setup: ["Field of 50.00 acres; report DRAFT"]
          setup_api_calls:
