  - rule_id: priority_pair_validation_conflict
    instances:

      - name: entry_state_gate_outranks_handicap_ceiling
        grounds:
          - validations.priority_30
          - validations.priority_51
          - errors.ERR_INVALID_TOURNAMENT_STATE
          - errors.ERR_HANDICAP_ABOVE_LIMIT
        distinguishing_aspect: |
          Priority 30 (tournament state) versus priority 51 (handicap ceiling), a 21-step gap. The
          request violates BOTH: the tournament is ENTRY_CLOSED and the member's handicap_index
          12.5 exceeds max_handicap_index 8.4. The single error_id returned must be
          ERR_INVALID_TOURNAMENT_STATE. An implementation that validates business constraints before
          the state gate returns ERR_HANDICAP_ABOVE_LIMIT and fails.
        test_recipe:
          setup:
            - "One season and one VERIFIED U17 member m4 whose handicap_index is 12.5."
            - "One REGIONAL tournament with max_handicap_index 8.4 that has been opened and then closed, so its status is ENTRY_CLOSED."
            - "The clock is 2026-09-01T00:00:00Z, which is also at entry_close_at, so priority 60's window rule is violated too - but it sits below both rules under test and must not surface either."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
