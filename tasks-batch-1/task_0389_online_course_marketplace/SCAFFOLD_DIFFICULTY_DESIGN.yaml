  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: refund_invalid_state_beats_refund_window_closed
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REFUND_WINDOW_CLOSED]
        distinguishing_aspect: |
          state (p4 ERR_INVALID_STATE) vs business_temporal (p8 ERR_REFUND_WINDOW_CLOSED):
          refunding an already-REFUNDED enrollment after the clock has also passed the
          refund_deadline triggers both; the higher-priority state check wins, returning
          ERR_INVALID_STATE (409), not ERR_REFUND_WINDOW_CLOSED (422).
        test_recipe:
          setup:
            - "Enrollment already REFUNDED (refunded at 2026-06-01), then clock advanced past its refund_deadline (refund_window 5 days -> deadline 2026-06-06) to 2026-07-01."
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "Inst I", email: "insti@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Sol", email: "sol@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Win", list_price_cents: 1000, refund_window_days: 5 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/enroll"
              payload: { learner_id: "${learner_id}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/refund"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /enrollments/${enr_id}/refund"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "data.error_id == ERR_INVALID_STATE (state p4 wins over temporal p8 ERR_REFUND_WINDOW_CLOSED)"

      - name: payout_invalid_state_beats_insufficient_balance
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_BALANCE]
        distinguishing_aspect: |
          state (p4 ERR_INVALID_STATE) vs business_fiscal (p9 ERR_INSUFFICIENT_BALANCE):
          rejecting an already-REJECTED payout while the instructor balance is also 0
          triggers both; the higher-priority state check wins with ERR_INVALID_STATE,
          a different error-category pair from the refund conflict above.
        test_recipe:
          setup:
            - "Instructor with payout_balance_cents == 0; a payout already REJECTED."
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "Inst J", email: "instj@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /payouts"
              payload: { instructor_id: "${inst_id}", requested_amount_cents: 500 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { payout_id: $.data.id }
            - call: "POST /payouts/${payout_id}/reject"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /payouts/${payout_id}/approve"
              payload: { expected_instructor_version: "${inst_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "data.error_id == ERR_INVALID_STATE (state p4 wins over fiscal p9 ERR_INSUFFICIENT_BALANCE)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: passing_score_inclusive_ge_boundary_on_lesson_completion
        grounds:
          - calculations.lesson_completion_score
          - entities.LessonCompletion.fields.passed
          - entities.Course.fields.passing_score_pct
        distinguishing_aspect: |
          Numeric threshold crossing on POST /lesson-completions: passing_score_pct=0.70,
          question_count=10. correct_answers=7 -> score 0.70 passes (inclusive >=);
          correct_answers=6 -> 0.60 fails. The >= boundary is exact at 0.70.
        test_recipe:
          setup:
            - "PUBLISHED course passing_score_pct=0.70, completion_threshold 1.00; one graded lesson question_count=10 weight 1; learner ACTIVE-enrolled."
          setup_api_calls:
            - call: "POST /instructors"
