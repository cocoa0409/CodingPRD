        claim_type: filtered_listing
        grounds:
          - endpoints.GET /reservations
          - entities.Reservation.fields.compliance_status
        distinguishing_aspect: "The list endpoint filters on the compliance dimension independently of booking_status: both reservations are still PENDING, yet compliance_status VERIFIED matches only the one that has been swept, and total_count reflects the filter rather than the table size."
