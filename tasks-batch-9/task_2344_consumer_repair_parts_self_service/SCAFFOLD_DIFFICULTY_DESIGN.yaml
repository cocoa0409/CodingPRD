            - "A VALID consumer EligibilityAssessment with decision ELIGIBLE exists for that (model, part)."
            - "The consumer order sits in PENDING_DISCLOSURE with disclosure_acknowledged_at still NULL, which is what keeps it in scope for the conditional fourth hop."
