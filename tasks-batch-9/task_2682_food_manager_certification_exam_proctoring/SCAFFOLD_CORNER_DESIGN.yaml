      - name: remote_sitting_in_a_jurisdiction_that_refuses_remote_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=27]
          - errors.ERR_REMOTE_PROCTORING_NOT_ACCEPTED
          - endpoints[POST /exam-sessions]
        distinguishing_aspect: |
          accepts_remote_proctoring defaults to false, and the gate is read from the CANDIDATE's
          jurisdiction. With a remote_certified proctor and no testing_site_id — so neither priority 34 nor
          priority 36 is violated — the only failure left is ERR_REMOTE_PROCTORING_NOT_ACCEPTED (422), and
          the identical booking as IN_PERSON at the same site succeeds.
        test_recipe:
          setup:
            - "A jurisdiction created WITHOUT accepts_remote_proctoring, so the default false applies."
            - "Provider prepaid 500000 / EN form / 2-seat site / candidate / a REGISTERED proctor with remote_certified true / a 2-unit EXAM_ONLY batch with one code assigned."
