# =============================================================================
# Task 1698: Office Furniture Dealer & Space Planning — scaffold seed tables
# =============================================================================

scenario: |
  Office Furniture Dealer & Space Planning (Steelcase/MillerKnoll dealer): space plan & typicals development, product configuration & lead time by manufacturer, project install schedule & after-hours labor, warehouse receipt & staging, punch/deficiency & manufacturer claim, reconfiguration & asset inventory service, used/liquidation credit, contract pricing (state/co-op) compliance

domain_name: office-furniture-dealer
api_prefix: /api

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [cross_aggregate, self_referential]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: Dealership
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dealership name" }
      - { name: staging_capacity_units, type: integer, source: input, description: "Total warehouse staging capacity in units; aggregate occupancy ceiling" }
      - { name: standard_labor_rate_cents_per_hour, type: integer, source: input, description: "Default install labor hourly rate in cents" }
      - { name: after_hours_start_minute, type: integer, source: input, default: 1080, description: "Minute-of-day (0-1439) at which after-hours premium billing starts; 1080 = 18:00" }
      - { name: after_hours_multiplier_bp, type: integer, source: input, default: 15000, description: "After-hours labor multiplier in basis points; 15000 = 1.5x" }
      - { name: turnover_buffer_minutes, type: integer, source: input, default: 30, description: "Mandatory turnover buffer between two confirmed install events on the same crew" }
      - { name: credit_cap_pct, type: integer, source: input, default: 25, description: "Max percent of (total_net + install_fee) payable by liquidation credit per order" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: input, description: "FK -> Dealership.id; owning dealership" }
      - { name: name, type: string, source: input, description: "Customer organization name" }
      - { name: external_ref, type: string, source: input, description: "External reference; unique per dealership" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CREDIT_HOLD | CLOSED" }
      - { name: liquidation_credit_balance_cents, type: integer, source: computed, default: 0, description: "Redeemable credit ledger: issued lot credits + settled CREDIT-remedy claim amounts minus credit_applied on non-CANCELLED orders" }

  - name: PricingContract
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; customer purchasing against this contract" }
      - { name: contract_type, type: enum, source: input, description: "STATE | COOP | NEGOTIATED" }
      - { name: pricing_tiers, type: array, source: input, description: "Array of {category, min_qty, discount_pct}; applicable tier = highest min_qty <= line quantity within the line's category" }
      - { name: default_discount_pct, type: integer, source: input, description: "Fallback discount percent when no tier matches the line category/quantity" }
      - { name: labor_rate_cents_per_hour, type: integer, source: input, required: false, description: "Contract labor rate override; null falls back to dealership rate" }
      - { name: after_hours_multiplier_bp, type: integer, source: input, required: false, description: "Contract after-hours multiplier override in basis points; null falls back to dealership default" }
      - { name: effective_from, type: string, source: input, description: "First date (YYYY-MM-DD, inclusive) on which orders may be submitted against this contract" }
      - { name: effective_to, type: string, source: input, description: "Last date (YYYY-MM-DD, inclusive) on which orders may be submitted against this contract" }
      - { name: supersedes_contract_id, type: string, source: input, required: false, description: "FK -> PricingContract.id; predecessor contract this amendment replaces on activation" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator, captured at POST time; used for segregation-of-duties on activate" }
      - { name: activated_by_user_id, type: string, source: system, required: false, description: "X-User-ID that activated the contract" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SUPERSEDED | TERMINATED | EXPIRED" }

  - name: SpacePlan
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; customer the plan is drawn for" }
      - { name: name, type: string, source: input, description: "Plan name" }
      - { name: revision_no, type: integer, source: system, default: 1, description: "Revision counter; increments on each entry into IN_REVISION" }
      - { name: supersedes_plan_id, type: string, source: input, required: false, description: "FK -> SpacePlan.id; earlier plan this revision replaces when approved" }
      - { name: approved_version, type: integer, source: system, required: false, description: "Value of this plan's version field captured at approval; version-pinning anchor for order submit/acknowledge" }
      - { name: budget_cents, type: integer, source: computed, default: 0, description: "Sum over typicals of quantity * target_budget_cents_per_instance" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED -> IN_REVISION -> SUBMITTED (cycle); APPROVED -> SUPERSEDED" }

  - name: Typical
    parent: null
    common_fields: true
    fields:
      - { name: space_plan_id, type: string, source: input, description: "FK -> SpacePlan.id; plan this typical belongs to" }
      - { name: code, type: string, source: input, description: "Typical code, e.g. WS-A; unique within the space plan" }
      - { name: quantity, type: integer, source: input, description: "Number of instances of this typical in the plan; >= 1" }
      - { name: target_budget_cents_per_instance, type: integer, source: input, description: "Budgeted product cost per instance" }
      - { name: extended_budget_cents, type: integer, source: computed, description: "= quantity * target_budget_cents_per_instance" }

  - name: ProductSeries
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: input, description: "FK -> Dealership.id; catalog owner" }
      - { name: manufacturer, type: enum, source: input, description: "STEELCASE | MILLERKNOLL" }
      - { name: category, type: enum, source: input, description: "SEATING | SYSTEMS | CASEGOODS | TABLES | STORAGE" }
      - { name: series_code, type: string, source: input, description: "Manufacturer series code; unique per dealership" }
      - { name: base_list_price_cents, type: integer, source: input, description: "List price of the unoptioned unit" }
      - { name: base_lead_time_days, type: integer, source: input, description: "Manufacturer standard lead time in days" }
      - { name: option_catalog, type: array, source: input, description: "Array of {option_code, price_uplift_pct, extra_lead_days} defining configurable options" }
      - { name: quality_hold, type: boolean, source: system, default: false, description: "True while a CRITICAL punch-item-spawned claim cascade has flagged the series; blocks new order lines" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> DISCONTINUED" }

  - name: ProjectOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: contract_id, type: string, source: input, description: "FK -> PricingContract.id; pricing agreement the order bills against" }
      - { name: space_plan_id, type: string, source: input, description: "FK -> SpacePlan.id; approved plan the order is drawn from" }
      - { name: pinned_contract_version, type: integer, source: system, required: false, description: "PricingContract.version captured at submit; acknowledge re-validates it" }
      - { name: pinned_plan_version, type: integer, source: system, required: false, description: "SpacePlan.approved_version captured at submit; acknowledge re-validates it" }
      - { name: total_list_cents, type: integer, source: computed, default: 0, description: "Sum of unit_list_price_cents * quantity over non-CANCELLED lines" }
      - { name: total_net_cents, type: integer, source: computed, default: 0, description: "Sum of line_total_cents over non-CANCELLED lines" }
      - { name: install_fee_cents, type: integer, source: computed, default: 0, description: "Fee band on total_list applied to total_net; see order_total_rollup" }
      - { name: credit_applied_cents, type: integer, source: computed, default: 0, description: "Liquidation/settlement credit applied to this order; capped per credit_cap_pct" }
      - { name: grand_total_cents, type: integer, source: computed, default: 0, description: "= total_net_cents + install_fee_cents - credit_applied_cents" }
      - { name: promised_date, type: string, source: computed, required: false, description: "Max confirmed_promise_date (post-ack) else provisional_promise_date over non-CANCELLED lines; null when no lines" }
      - { name: cancel_fee_cents, type: integer, source: computed, default: 0, description: "Restocking fee recorded at cancellation" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> ACKNOWLEDGED -> DELIVERED -> INSTALLED -> CLOSED; SUBMITTED -> DRAFT (revise); DRAFT/SUBMITTED/ACKNOWLEDGED -> CANCELLED" }
      - { name: install_posture, type: enum, source: computed, description: "NOT_SCHEDULED | SCHEDULED | IN_PROGRESS | COMPLETE | BLOCKED; derived from install events and critical punch items" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ProjectOrder.id" }
      - { name: series_id, type: string, source: input, description: "FK -> ProductSeries.id" }
      - { name: typical_id, type: string, source: input, required: false, description: "FK -> Typical.id; optional plan typical this line fulfills" }
      - { name: quantity, type: integer, source: input, description: "Units ordered; >= 1" }
      - { name: selected_options, type: array, source: input, description: "Array of option_code values drawn from the series option_catalog" }
      - { name: is_replacement, type: boolean, source: system, default: false, description: "True when created by a claim-settlement REPLACE cascade; replacement lines are warranty-priced at zero (unit_list/unit_net/line_total all 0)" }
      - { name: unit_list_price_cents, type: integer, source: computed, description: "Configured list price per unit; see configured_unit_list_price" }
      - { name: unit_net_price_cents, type: integer, source: computed, description: "Contract-discounted net per unit, rounded per unit before extension" }
      - { name: line_total_cents, type: integer, source: computed, description: "= unit_net_price_cents * quantity" }
      - { name: provisional_lead_time_days, type: integer, source: computed, description: "Manufacturer-mode lead time computed at order submit" }
      - { name: provisional_promise_date, type: string, source: computed, required: false, description: "Submit date + provisional lead time in calendar days" }
      - { name: confirmed_lead_time_days, type: integer, source: computed, required: false, description: "Lead time re-anchored at manufacturer acknowledgment" }
      - { name: confirmed_promise_date, type: string, source: computed, required: false, description: "Acknowledgment date + confirmed lead time in business days" }
      - { name: received_units, type: integer, source: computed, default: 0, description: "Sum of received_units over non-CANCELLED staging reservations for this line" }
      - { name: status, type: enum, source: system, description: "OPEN -> PLACED -> ACKNOWLEDGED -> RECEIVED -> CLOSED; OPEN -> CANCELLED" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: input, description: "FK -> Dealership.id" }
      - { name: name, type: string, source: input, description: "Crew name" }
      - { name: size, type: integer, source: input, description: "Headcount" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: InstallEvent
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ProjectOrder.id" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; the resource whose calendar is exclusively occupied" }
      - { name: kind, type: enum, source: input, description: "NEW_INSTALL | RECONFIGURATION" }
      - { name: scheduled_date, type: string, source: input, description: "Event date YYYY-MM-DD; single-day window" }
      - { name: start_minute, type: integer, source: input, description: "Window start minute-of-day 0-1439; half-open interval start" }
      - { name: end_minute, type: integer, source: input, description: "Window end minute-of-day 1-1440; half-open interval end; must be > start_minute" }
      - { name: after_hours, type: boolean, source: computed, description: "True when any billed minute falls at or after the pricing after_hours_start_minute" }
      - { name: labor_hours_estimated, type: number, source: input, required: false, description: "Estimated labor hours" }
      - { name: labor_hours_actual, type: number, source: input, required: false, description: "Actual labor hours recorded at completion" }
      - { name: labor_cost_cents, type: integer, source: computed, required: false, description: "Computed at completion; see install_event_labor_cost" }
      - { name: asset_moves, type: array, source: input, required: false, description: "RECONFIGURATION only: array of {asset_tag_id, to_location} applied at completion" }
      - { name: status, type: enum, source: system, description: "TENTATIVE -> CONFIRMED -> IN_PROGRESS -> COMPLETED; CONFIRMED -> TENTATIVE; TENTATIVE/CONFIRMED -> CANCELLED" }

  - name: StagingReservation
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; line whose units occupy staging" }
      - { name: units, type: integer, source: input, description: "Units staged under this reservation; >= 1" }
      - { name: start_date, type: string, source: input, description: "First occupancy date YYYY-MM-DD (inclusive)" }
      - { name: end_date, type: string, source: input, description: "Last occupancy date YYYY-MM-DD (inclusive); must be >= start_date" }
      - { name: received_units, type: integer, source: computed, default: 0, description: "Units physically received against this reservation" }
      - { name: status, type: enum, source: system, description: "RESERVED -> OCCUPIED -> RELEASED; RESERVED -> CANCELLED" }

  - name: PunchItem
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ProjectOrder.id" }
      - { name: order_line_id, type: string, source: input, required: false, description: "FK -> OrderLine.id; line the deficiency is attributed to" }
      - { name: install_event_id, type: string, source: input, required: false, description: "FK -> InstallEvent.id; event during which the deficiency was found" }
      - { name: severity, type: enum, source: input, description: "STANDARD | CRITICAL" }
      - { name: description, type: string, source: input, description: "Deficiency description" }
      - { name: source, type: enum, source: system, description: "INSTALL | WAREHOUSE" }
      - { name: affected_units, type: integer, source: input, default: 1, description: "Units affected; drives replacement-line quantity" }
      - { name: status, type: enum, source: system, description: "OPEN -> READY_FOR_VERIFY -> VERIFIED -> CLOSED; READY_FOR_VERIFY -> OPEN (failed verification)" }

  - name: ManufacturerClaim
    parent: null
    common_fields: true
    fields:
      - { name: punch_item_id, type: string, source: input, description: "FK -> PunchItem.id; verified deficiency this claim pursues" }
      - { name: series_id, type: string, source: system, description: "FK -> ProductSeries.id; derived from the punch item's order line at creation" }
      - { name: claim_type, type: enum, source: input, description: "DEFECT | FREIGHT_DAMAGE | SHORTAGE" }
      - { name: remedy_requested, type: enum, source: input, description: "REPAIR | REPLACE | CREDIT" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount claimed from the manufacturer" }
      - { name: settlement_amount_cents, type: integer, source: input, required: false, description: "Amount offered by the manufacturer at SETTLEMENT_OFFERED" }
      - { name: settled_amount_cents, type: integer, source: computed, required: false, description: "Final accepted amount recorded at SETTLED" }
      - { name: replacement_order_line_id, type: string, source: system, required: false, description: "FK -> OrderLine.id; replacement line created when a REPLACE settlement is accepted" }
      - { name: origin, type: enum, source: system, default: "MANUAL", description: "MANUAL | AUTO_CRITICAL_PUNCH" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> ACKNOWLEDGED -> SETTLEMENT_OFFERED -> SETTLED | DENIED | WITHDRAWN; SETTLEMENT_OFFERED -> SUBMITTED (counter cycle)" }

  - name: AssetTag
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of the tagged asset" }
      - { name: series_id, type: string, source: input, required: false, description: "FK -> ProductSeries.id; optional catalog link" }
      - { name: description, type: string, source: input, description: "Asset description" }
      - { name: condition, type: enum, source: input, description: "NEW | GOOD | FAIR | POOR" }
      - { name: current_location, type: string, source: input, description: "Free-form location; updated by reconfiguration event completion" }
      - { name: source, type: enum, source: input, description: "PURCHASED | TRADED_IN" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | IN_STORAGE -> DISPOSED" }

  - name: LiquidationLot
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner trading in used furniture" }
      - { name: description, type: string, source: input, description: "Lot description" }
      - { name: item_count, type: integer, source: input, description: "Number of items in the lot; >= 1" }
      - { name: condition_grade, type: enum, source: system, required: false, description: "A | B | C; set at appraisal" }
      - { name: estimated_credit_cents, type: integer, source: computed, description: "Provisional estimate computed at offer; assumes grade B with haircut" }
      - { name: appraised_value_cents, type: integer, source: input, required: false, description: "Gross appraised value set by the appraiser" }
      - { name: appraised_at, type: string, source: system, required: false, description: "Date (YYYY-MM-DD) of the latest appraisal; drives the 30-day validity sweep" }
      - { name: appraised_by_user_id, type: string, source: system, required: false, description: "X-User-ID of the appraiser; segregation-of-duties anchor for issue_credit" }
      - { name: issued_by_user_id, type: string, source: system, required: false, description: "X-User-ID that issued the credit" }
      - { name: final_credit_cents, type: integer, source: computed, required: false, description: "Credit issued after liquidation fee and refurbishment deduction" }
      - { name: redeemed_cents, type: integer, source: computed, default: 0, description: "Portion of final_credit_cents consumed by order credit applications" }
      - { name: status, type: enum, source: system, description: "OFFERED -> APPRAISED -> CREDIT_ISSUED -> REDEEMED; APPRAISED -> APPRAISED (re-appraisal); OFFERED/APPRAISED -> DECLINED; APPRAISED -> EXPIRED" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "POST /api/customers/{id}/hold"
        actor: AccountExecutive
        preconditions: []
        side_effects: ["Customer can no longer submit new orders (ERR_CUSTOMER_NOT_ACTIVE)"]
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "POST /api/customers/{id}/release_hold"
        actor: AccountExecutive
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/customers/{id}/close"
        actor: AccountExecutive
        preconditions:
          - "liquidation_credit_balance_cents == 0"
          - "No ProjectOrder for this customer in status DRAFT, SUBMITTED, ACKNOWLEDGED, DELIVERED, or INSTALLED (ERR_CUSTOMER_NOT_SETTLED)"
        side_effects: []

  - entity: PricingContract
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/pricing-contracts/{id}/activate"
        actor: ContractsOfficer
        preconditions:
          - "X-User-ID != created_by_user_id (segregation of duties; ERR_SOD_VIOLATION)"
          - "Every pricing_tiers entry and default_discount_pct must be <= MAX_DISCOUNT_PCT (55) (ERR_CONTRACT_PRICING_VIOLATION)"
          - "effective_from <= effective_to (ERR_INVALID_DATE_RANGE)"
        side_effects:
          - "activated_by_user_id = X-User-ID"
          - "If supersedes_contract_id is set and that contract is ACTIVE: predecessor -> SUPERSEDED"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /api/pricing-contracts/{id}/terminate"
        actor: ContractsOfficer
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/pricing-contracts/{id}/terminate"
        actor: ContractsOfficer
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when an activated successor contract names this contract in supersedes_contract_id)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic sweep on POST /api/_clock/set_current_utc when current UTC date > effective_to)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SpacePlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/space-plans/{id}/submit"
        actor: Designer
        preconditions: ["At least one Typical exists for the plan (ERR_INVALID_STATE)"]
        side_effects: []
      - from: IN_REVISION
        to: SUBMITTED
        trigger: "POST /api/space-plans/{id}/submit"
        actor: Designer
        preconditions: ["At least one Typical exists for the plan (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/space-plans/{id}/approve"
        actor: ClientApprover
        preconditions: []
        side_effects:
          - "approved_version = this plan's current version (version-pinning)"
          - "If supersedes_plan_id is set and that plan is APPROVED: predecessor plan -> SUPERSEDED"
      - from: APPROVED
        to: IN_REVISION
        trigger: "POST /api/space-plans/{id}/revise"
        actor: Designer
        preconditions: []
        side_effects:
          - "revision_no += 1"
          - "approved_version cleared (null); typicals editable again"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when a successor plan naming this plan in supersedes_plan_id is approved)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProductSeries
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /api/product-series/{id}/discontinue"
        actor: DealerAdmin
        preconditions: []
        side_effects: ["New order lines rejected with ERR_SERIES_DISCONTINUED"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "system (quality_hold set true when a CRITICAL punch item verification cascade fires; cleared by POST /api/product-series/{id}/clear_quality_hold)"
        actor: system | DealerAdmin
        preconditions: []
        side_effects: ["quality_hold flag toggled; status unchanged"]

  - entity: ProjectOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    parallel_dimensions:
      - field: status
        description: "Commercial lifecycle; independent of install_posture except where gated"
      - field: install_posture
        description: "Computed from InstallEvents and CRITICAL PunchItems; see order_install_posture; gates event start and order close"
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/project-orders/{id}/submit"
        actor: AccountExecutive
        preconditions:
          - "At least one OrderLine with status OPEN exists for the order (ERR_INVALID_STATE)"
          - "Customer status == ACTIVE (ERR_CUSTOMER_NOT_ACTIVE)"
          - "Contract status == ACTIVE and current UTC date within [effective_from, effective_to] inclusive (ERR_CONTRACT_NOT_EFFECTIVE)"
          - "SpacePlan status == APPROVED and plan.approved_version == plan.version (ERR_PLAN_NOT_APPROVED / ERR_PLAN_SUPERSEDED)"
          - "Every line's typical_id (when set) belongs to the order's space_plan_id (ERR_TYPICAL_PLAN_MISMATCH)"
          - "Pricing compliance: every line's resolved discount_pct <= MAX_DISCOUNT_PCT (55) (ERR_CONTRACT_PRICING_VIOLATION)"
        side_effects:
          - "pinned_contract_version = contract.version; pinned_plan_version = plan.approved_version"
          - "Recompute all line pricing and provisional lead times; recompute order totals per order_total_rollup"
          - "Each OPEN line -> PLACED"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /api/project-orders/{id}/revise"
        actor: AccountExecutive
        preconditions: []
        side_effects:
          - "pinned_contract_version and pinned_plan_version cleared"
          - "Each PLACED line -> OPEN"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /api/project-orders/{id}/acknowledge"
        actor: ManufacturerRep
        preconditions:
          - "pinned_contract_version == contract.version and contract.status == ACTIVE (ERR_CONTRACT_NOT_EFFECTIVE)"
          - "pinned_plan_version == plan.approved_version and plan.status == APPROVED (ERR_PLAN_SUPERSEDED)"
        side_effects:
          - "Each PLACED line -> ACKNOWLEDGED; confirmed lead times and confirmed_promise_date computed per lead_time_confirmed"
          - "promised_date recomputed (max of confirmed promise dates)"
      - from: ACKNOWLEDGED
        to: DELIVERED
        trigger: "system (automatic when every non-CANCELLED line reaches RECEIVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: INSTALLED
        trigger: "system (automatic when install_posture becomes COMPLETE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /api/project-orders/{id}/close"
        actor: ProjectManager
        preconditions:
          - "install_posture == COMPLETE (ERR_INSTALL_NOT_COMPLETE)"
          - "Every PunchItem for the order is CLOSED (ERR_ORDER_HAS_OPEN_PUNCH)"
        side_effects: ["Each RECEIVED line -> CLOSED"]
      - from: INSTALLED
        to: CLOSED
        trigger: "POST /api/project-orders/{id}/close"
        actor: ProjectManager
        preconditions:
          - "install_posture == COMPLETE (ERR_INSTALL_NOT_COMPLETE)"
          - "Every PunchItem for the order is CLOSED (ERR_ORDER_HAS_OPEN_PUNCH)"
        side_effects: ["Each RECEIVED line -> CLOSED"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/project-orders/{id}/cancel"
        actor: AccountExecutive
        preconditions: []
        side_effects:
          - "credit_applied_cents returned to customer credit ledger (balance restored)"
          - "cancel_fee_cents = 0"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/project-orders/{id}/cancel"
        actor: AccountExecutive
        preconditions: []
        side_effects:
          - "credit_applied_cents returned to customer credit ledger"
          - "cancel_fee_cents = 0"
          - "Each PLACED line -> CANCELLED"
      - from: ACKNOWLEDGED
        to: CANCELLED
        trigger: "POST /api/project-orders/{id}/cancel"
        actor: AccountExecutive
        preconditions: []
        side_effects:
          - "cancel_fee_cents computed per restocking_fee"
          - "credit_applied_cents returned to customer credit ledger; restocking fee debited from the credit ledger first, any remainder stays recorded on the order"
          - "Each ACKNOWLEDGED line -> CANCELLED; RESERVED staging reservations for those lines -> CANCELLED"

  - entity: OrderLine
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: PLACED
        trigger: "system (parent order submit)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLACED
        to: OPEN
        trigger: "system (parent order revise)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLACED
        to: ACKNOWLEDGED
        trigger: "system (parent order acknowledge)"
        actor: system
        preconditions: []
        side_effects: ["confirmed_lead_time_days and confirmed_promise_date computed"]
      - from: ACKNOWLEDGED
        to: RECEIVED
        trigger: "system (automatic when received_units == quantity after a staging receive)"
        actor: system
        preconditions: []
        side_effects: ["If all sibling non-CANCELLED lines RECEIVED: parent order -> DELIVERED"]
      - from: OPEN
        to: RECEIVED
        trigger: "system (replacement lines only: automatic when received_units == quantity after a staging receive)"
        actor: system
        preconditions: ["is_replacement == true"]
        side_effects: []
      - from: RECEIVED
        to: CLOSED
        trigger: "system (parent order close)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/order-lines/{id}/cancel"
        actor: AccountExecutive
        preconditions: ["Parent order status == DRAFT (ERR_INVALID_STATE)"]
        side_effects: ["Parent order totals recomputed excluding this line"]

  - entity: Crew
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/crews/{id}/suspend"
        actor: DealerAdmin
        preconditions: []
        side_effects: ["New install events for this crew rejected with ERR_CREW_NOT_ACTIVE"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/crews/{id}/activate"
        actor: DealerAdmin
        preconditions: []
        side_effects: []

  - entity: InstallEvent
    initial_state: TENTATIVE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: TENTATIVE
        to: CONFIRMED
        trigger: "POST /api/install-events/{id}/confirm"
        actor: ProjectManager
        preconditions:
          - "Crew status == ACTIVE (ERR_CREW_NOT_ACTIVE)"
          - "Order status in {ACKNOWLEDGED, DELIVERED} (ERR_INVALID_STATE)"
          - "No confirmed/in-progress overlap incl. turnover buffer on the same crew and date (ERR_CREW_OVERLAP)"
        side_effects: ["Order install_posture recomputed"]
      - from: CONFIRMED
        to: TENTATIVE
        trigger: "POST /api/install-events/{id}/unconfirm OR system (promise-date cascade demotion)"
        actor: ProjectManager | system
        preconditions: []
        side_effects: ["Order install_posture recomputed"]
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /api/install-events/{id}/start"
        actor: ProjectManager
        preconditions: ["Order install_posture != BLOCKED (ERR_ORDER_BLOCKED)"]
        side_effects: ["Order install_posture recomputed"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/install-events/{id}/complete"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "labor_cost_cents computed per install_event_labor_cost"
          - "For RECONFIGURATION: each asset_moves entry sets AssetTag.current_location = to_location (ERR_ASSET_NOT_MOVABLE if a referenced asset is DISPOSED)"
          - "Order install_posture recomputed; if COMPLETE and order DELIVERED: order -> INSTALLED"
      - from: TENTATIVE
        to: CANCELLED
        trigger: "POST /api/install-events/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Order install_posture recomputed"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/install-events/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Order install_posture recomputed"]

  - entity: StagingReservation
    initial_state: RESERVED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: RESERVED
        to: OCCUPIED
        trigger: "POST /api/staging-reservations/{id}/receive"
        actor: WarehouseLead
        preconditions:
          - "received_units input >= 1 and reservation.received_units + received_units <= reservation.units and <= line remaining (line.quantity - line.received_units) (ERR_OVER_RECEIPT)"
        side_effects:
          - "reservation.received_units += received_units; line.received_units recomputed"
          - "If condition == DAMAGED: auto-create PunchItem (source=WAREHOUSE, severity=STANDARD, status=OPEN) for the line's order and line"
          - "If line.received_units == line.quantity: line -> RECEIVED; possible order bubble-up to DELIVERED"
      - from: OCCUPIED
        to: RELEASED
        trigger: "POST /api/staging-reservations/{id}/release"
        actor: WarehouseLead
        preconditions: []
        side_effects: ["Units freed from staging occupancy"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /api/staging-reservations/{id}/cancel OR system (parent order cancel)"
        actor: ProjectManager | system
        preconditions: []
        side_effects: ["Units freed from staging occupancy"]

  - entity: PunchItem
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: READY_FOR_VERIFY
        trigger: "POST /api/punch-items/{id}/ready_for_verify"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: READY_FOR_VERIFY
        to: VERIFIED
        trigger: "POST /api/punch-items/{id}/verify (passed=true)"
        actor: ClaimsCoordinator
        preconditions: []
        side_effects:
          - "If severity == CRITICAL and no ManufacturerClaim yet references this punch item: auto-create ManufacturerClaim (origin=AUTO_CRITICAL_PUNCH, claim_type=DEFECT, remedy_requested=REPLACE, claimed_amount_cents = order line's unit_net_price_cents * affected_units, status=DRAFT)"
          - "That claim creation sets ProductSeries.quality_hold = true on the claim's series"
      - from: READY_FOR_VERIFY
        to: OPEN
        trigger: "POST /api/punch-items/{id}/verify (passed=false)"
        actor: ClaimsCoordinator
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: CLOSED
        trigger: "POST /api/punch-items/{id}/close"
        actor: ProjectManager
        preconditions: ["Every ManufacturerClaim referencing this punch item is SETTLED, DENIED, or WITHDRAWN (ERR_CLAIM_NOT_SETTLED)"]
        side_effects: []

  - entity: ManufacturerClaim
    initial_state: DRAFT
    terminal_states: [SETTLED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/manufacturer-claims/{id}/submit"
        actor: ClaimsCoordinator
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /api/manufacturer-claims/{id}/acknowledge"
        actor: ManufacturerRep
        preconditions: []
        side_effects: []
      - from: ACKNOWLEDGED
        to: SETTLEMENT_OFFERED
        trigger: "POST /api/manufacturer-claims/{id}/offer_settlement"
        actor: ManufacturerRep
        preconditions: []
        side_effects: []
      - from: SETTLEMENT_OFFERED
        to: SUBMITTED
        trigger: "POST /api/manufacturer-claims/{id}/counter"
        actor: ClaimsCoordinator
        preconditions: []
        side_effects: ["settlement_amount_cents cleared; negotiation cycle repeats"]
      - from: SETTLEMENT_OFFERED
        to: SETTLED
        trigger: "POST /api/manufacturer-claims/{id}/accept_settlement"
        actor: ClaimsCoordinator
        preconditions: []
        side_effects:
          - "settled_amount_cents = settlement_amount_cents"
          - "If remedy_requested == REPLACE: create replacement OrderLine (is_replacement=true, same series, quantity = punch.affected_units, status OPEN) on the punch item's order"
          - "Replacement line creation recomputes the order totals and promised_date"
          - "If promised_date advanced: every InstallEvent of the order in CONFIRMED with scheduled_date < promised_date -> TENTATIVE (re-confirmation required)"
          - "If remedy_requested == CREDIT: customer.liquidation_credit_balance_cents += settled_amount_cents"
      - from: ACKNOWLEDGED
        to: DENIED
        trigger: "POST /api/manufacturer-claims/{id}/deny"
        actor: ManufacturerRep
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/manufacturer-claims/{id}/withdraw"
        actor: ClaimsCoordinator
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/manufacturer-claims/{id}/withdraw"
        actor: ClaimsCoordinator
        preconditions: []
        side_effects: []
      - from: ACKNOWLEDGED
        to: WITHDRAWN
        trigger: "POST /api/manufacturer-claims/{id}/withdraw"
        actor: ClaimsCoordinator
        preconditions: []
        side_effects: []

  - entity: AssetTag
    initial_state: IN_SERVICE
    terminal_states: [DISPOSED]
    transitions:
      - from: IN_SERVICE
        to: IN_STORAGE
        trigger: "system (RECONFIGURATION install event completion whose asset_moves entry has to_location == 'STORAGE')"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_STORAGE
        to: IN_SERVICE
        trigger: "system (RECONFIGURATION install event completion whose asset_moves entry has to_location != 'STORAGE')"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SERVICE
        to: DISPOSED
        trigger: "POST /api/asset-tags/{id}/dispose"
        actor: AccountExecutive
        preconditions: []
        side_effects: []
      - from: IN_STORAGE
        to: DISPOSED
        trigger: "POST /api/asset-tags/{id}/dispose"
        actor: AccountExecutive
        preconditions: []
        side_effects: []

  - entity: LiquidationLot
    initial_state: OFFERED
    terminal_states: [REDEEMED, DECLINED, EXPIRED]
    transitions:
      - from: OFFERED
        to: APPRAISED
        trigger: "POST /api/liquidation-lots/{id}/appraise"
        actor: LiquidationAppraiser
        preconditions: ["expected_lot_version matches lot.version (OCC; ERR_STALE_VERSION)"]
        side_effects:
          - "condition_grade, appraised_value_cents, appraised_at = current UTC date, appraised_by_user_id recorded"
          - "lot.version incremented by 1"
      - from: APPRAISED
        to: APPRAISED
        trigger: "POST /api/liquidation-lots/{id}/appraise (re-appraisal supersedes the prior appraisal)"
        actor: LiquidationAppraiser
        preconditions: ["expected_lot_version matches lot.version (OCC; ERR_STALE_VERSION)"]
        side_effects:
          - "Prior appraisal values overwritten; appraised_at reset to current UTC date"
          - "lot.version incremented by 1"
      - from: APPRAISED
        to: CREDIT_ISSUED
        trigger: "POST /api/liquidation-lots/{id}/issue_credit"
        actor: FinanceManager
        preconditions:
          - "X-User-ID != appraised_by_user_id (segregation of duties; ERR_SOD_VIOLATION)"
        side_effects:
          - "final_credit_cents computed per liquidation_credit_valuation (final variant)"
          - "customer.liquidation_credit_balance_cents += final_credit_cents"
          - "issued_by_user_id = X-User-ID"
      - from: CREDIT_ISSUED
        to: REDEEMED
        trigger: "system (automatic when redeemed_cents == final_credit_cents) OR POST /api/liquidation-lots/{id}/redeem (forfeits any remainder)"
        actor: system | FinanceManager
        preconditions: []
        side_effects: ["On manual redeem with remainder: unredeemed balance is forfeited (ledger decremented)"]
      - from: OFFERED
        to: DECLINED
        trigger: "POST /api/liquidation-lots/{id}/decline"
        actor: AccountExecutive
        preconditions: []
        side_effects: []
      - from: APPRAISED
        to: DECLINED
        trigger: "POST /api/liquidation-lots/{id}/decline"
        actor: AccountExecutive
        preconditions: []
        side_effects: []
      - from: APPRAISED
        to: EXPIRED
        trigger: "system (automatic sweep on POST /api/_clock/set_current_utc when current UTC date > appraised_at + APPRAISAL_VALIDITY_DAYS (30))"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1) — true races only, resolved by OCC
# =============================================================================
concurrency_rules:
  - rule_id: contract-amend-stale-version
    parent_entity: PricingContract
    write_endpoint: "POST /api/pricing-contracts/{id}/amend"
    occ_field: expected_contract_version
    description: |
      Creating an amendment (successor draft contract) against a PricingContract
      whose version has advanced since the client last observed it is rejected.
      Amending legitimately supersedes the contract's terms, so a client acting on
      a stale view of the contract would otherwise fork two divergent successors.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: lot-appraisal-stale-version
    parent_entity: LiquidationLot
    write_endpoint: "POST /api/liquidation-lots/{id}/appraise"
    occ_field: expected_lot_version
    description: |
      Recording an appraisal against a LiquidationLot whose version has advanced
      since the client last observed it is rejected. A new appraisal legitimately
      supersedes the previous one, so a client pricing off a stale appraisal would
      silently overwrite fresher valuation data.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: configured_unit_list_price
    trigger: "order line creation; order submit re-pricing"
    algorithm: aggregation
    formula: |
      uplift_pct_sum = sum(option.price_uplift_pct for option in series.option_catalog
                           where option.option_code in line.selected_options)
      unit_list_price_cents = round_half_up(base_list_price_cents * (1 + uplift_pct_sum / 100))
    input_set: "The OrderLine's ProductSeries (any status) and its selected_options; unknown option codes are rejected with ERR_INVALID_REQUEST"
    precision: "0 decimal places (integer cents), round_half_up"

  - name: contract_net_unit_price
    trigger: "order line creation; order submit re-pricing"
    algorithm: tiered_pricing
    formula: |
      tiers = [t for t in contract.pricing_tiers where t.category == series.category]
      applicable = tier with maximum min_qty such that min_qty <= line.quantity (min_qty <= quantity, inclusive)
      if applicable: discount_pct = applicable.discount_pct
      else: discount_pct = contract.default_discount_pct
      if discount_pct > MAX_DISCOUNT_PCT: reject with ERR_CONTRACT_PRICING_VIOLATION (checked at submit)
      unit_net_price_cents = round_half_up(unit_list_price_cents * (100 - discount_pct) / 100)
    input_set: "The order's PricingContract tiers, the line's ProductSeries.category, and line.quantity"
    constants:
      MAX_DISCOUNT_PCT: 55
    precision: "0 decimal places (integer cents), round_half_up; per-unit rounding happens BEFORE quantity extension"

  - name: per_line_extension_rounding
    trigger: "order line creation; order submit re-pricing"
    algorithm: tiered_pricing
    formula: |
      # PINNED ROUNDING ORDER: round the NET UNIT price to whole cents first, then extend.
      line_total_cents = unit_net_price_cents * quantity        # unit_net already rounded
      # The alternative (extend list*qty*(1-disc), then round the line total) is REJECTED;
      # the two orders differ by cents whenever unit_list * (100 - disc) / 100 is fractional.
    input_set: "One OrderLine at a time"
    precision: "0 decimal places (integer cents), round_half_up; rounding order: per-unit-then-extend"

  - name: order_total_rollup
    trigger: "order submit; line cancel; credit apply; replacement line creation"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER (the credit cap depends on install_fee which depends on total_net):
      # (1) list totals, (2) per-line net, (3) total_net, (4) fee band from total_list,
      # (5) install_fee, (6) credit cap, (7) grand total.
      total_list_cents   = sum(unit_list_price_cents * quantity for lines where status != CANCELLED)
      total_net_cents    = sum(line_total_cents for lines where status != CANCELLED)
      fee_pct            = 8  if total_list_cents >= VOLUME_FEE_BAND_CENTS else 12
      install_fee_cents  = round_half_up(total_net_cents * fee_pct / 100)
      credit_cap_cents   = floor((total_net_cents + install_fee_cents) * dealership.credit_cap_pct / 100)
      # credit_applied_cents <= credit_cap_cents enforced on apply_credit
      grand_total_cents  = total_net_cents + install_fee_cents - credit_applied_cents
    input_set: "All OrderLines of the order with status != CANCELLED; replacement lines (is_replacement=true) contribute zero to all sums; dealership.credit_cap_pct"
    constants:
      VOLUME_FEE_BAND_CENTS: 5000000
      FEE_PCT_HIGH_VOLUME: 8
      FEE_PCT_DEFAULT: 12
    precision: "0 decimal places (integer cents), round_half_up; cap uses floor"

  - name: lead_time_provisional
    trigger: "order submit"
    algorithm: forward_looking
    formula: |
      extra = { STEELCASE:  sum(option.extra_lead_days for selected options),
                MILLERKNOLL: max(option.extra_lead_days for selected options, default 0) }
      provisional_lead_time_days = series.base_lead_time_days + extra
      provisional_promise_date = submit_date + provisional_lead_time_days (calendar days)
    input_set: "Lines of the order with status PLACED at submit"
    variants:
      - name: provisional
        when: "At order submit (quotation stage)"
        difference: "Calendar-day arithmetic anchored at the submit date; STEELCASE sums option lead days, MILLERKNOLL takes the max"

  - name: lead_time_confirmed
    trigger: "order acknowledge"
    algorithm: forward_looking
    formula: |
      confirmed_lead_time_days = same day-count as provisional (base + manufacturer-mode option days)
      confirmed_promise_date = acknowledge_date + confirmed_lead_time_days in BUSINESS days
      (count Mon-Fri only, starting the day after the acknowledgment date; holidays not modeled)
    input_set: "Lines of the order with status PLACED at acknowledge"
    variants:
      - name: confirmed
        when: "At manufacturer acknowledgment"
        difference: "Same lead-day count but re-anchored to the acknowledgment date and advanced in business days, so identical configuration data yields a different promise date than the provisional variant"

  - name: install_event_labor_cost
    trigger: "install event completion"
    algorithm: threshold
    formula: |
      rate_cents_per_hour = contract.labor_rate_cents_per_hour if set else dealership.standard_labor_rate_cents_per_hour
      multiplier_bp       = contract.after_hours_multiplier_bp if set else dealership.after_hours_multiplier_bp
      total_minutes       = end_minute - start_minute
      premium_minutes     = count of minutes m in [start_minute, end_minute) with m >= after_hours_start_minute
                          = max(0, end_minute - max(start_minute, after_hours_start_minute))
      standard_minutes    = total_minutes - premium_minutes
      labor_cost_cents    = round_half_up( (standard_minutes * rate + premium_minutes * rate * multiplier_bp / 10000) / 60 )
      after_hours         = premium_minutes > 0
      # PINNED ROUNDING: rounded ONCE per event at completion; project labor totals are sums of per-event rounded costs.
    input_set: "The completed InstallEvent, its order's PricingContract overrides, and the Dealership defaults"
    precision: "0 decimal places (integer cents), round_half_up"

  - name: staging_capacity_utilization
    trigger: "staging reservation create"
    algorithm: interval_merge
    formula: |
      For each calendar date d in [new.start_date, new.end_date] (BOTH bounds inclusive):
        occupied(d) = sum(r.units for r in StagingReservation
                          where r.status in {RESERVED, OCCUPIED}
                          and r.start_date <= d <= r.end_date)
      Reject with ERR_CAPACITY_EXCEEDED if any d has occupied(d) + new.units > dealership.staging_capacity_units.
      Equality (occupied + new == capacity) is ALLOWED.
    input_set: "Reservations with status RESERVED or OCCUPIED for the same dealership; CANCELLED/RELEASED excluded"
    precision: "integer units"

  - name: liquidation_credit_valuation
    trigger: "lot offer (estimated variant); credit issuance (final variant)"
    algorithm: weighted_scoring
    formula: |
      estimated (provisional, at offer):
        estimated_credit_cents = round_half_up(item_count * EST_VALUE_PER_ITEM_CENTS[B] * (1 - ESTIMATION_HAIRCUT_PCT / 100))
      final (at issue_credit):
        fee_deducted = round_half_up(appraised_value_cents * (1 - LIQUIDATION_FEE_PCT / 100))
        final_credit_cents = max(0, fee_deducted - REFURB_FEE_PER_ITEM_CENTS[condition_grade] * item_count)
    input_set: "The LiquidationLot; final variant requires condition_grade and appraised_value_cents from the latest appraisal"
    constants:
      EST_VALUE_PER_ITEM_CENTS: { A: 120000, B: 75000, C: 30000 }
      ESTIMATION_ASSUMED_GRADE: B
      ESTIMATION_HAIRCUT_PCT: 20
      LIQUIDATION_FEE_PCT: 15
      REFURB_FEE_PER_ITEM_CENTS: { A: 5000, B: 15000, C: 25000 }
      APPRAISAL_VALIDITY_DAYS: 30
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: estimated
        when: "Lot in OFFERED (pre-appraisal); always assumes condition grade B"
        difference: "Optimistic catalog estimate with 20% haircut; ignores actual appraised value"
      - name: final
        when: "Credit issuance after appraisal"
        difference: "Appraised value minus 15% liquidation fee minus per-item refurbishment deduction by actual grade, floored at 0; differs from the estimate for the same lot"

  - name: customer_credit_ledger
    trigger: "issue_credit; claim CREDIT settlement; apply_credit; order cancel; manual lot redeem"
    algorithm: aggregation
    formula: |
      liquidation_credit_balance_cents =
          sum(lot.final_credit_cents for lots in {CREDIT_ISSUED, REDEEMED})
        + sum(claim.settled_amount_cents for SETTLED claims with remedy_requested == CREDIT
              whose punch item belongs to an order of this customer)
        - sum(order.credit_applied_cents for orders of this customer with status != CANCELLED)
        - sum(lot.final_credit_cents - lot.redeemed_cents for lots manually redeemed with remainder forfeited)
      # CONSERVED QUANTITY (Rule 9 anchor): apply_credit(x) followed by order cancel restores the prior balance exactly.
    input_set: "Customer's lots, claims (via punch->order), and orders"
    precision: "0 decimal places (integer cents)"

  - name: restocking_fee
    trigger: "order cancel from ACKNOWLEDGED"
    algorithm: threshold
    formula: |
      unreceived_net = sum(line_total_cents for lines where status == ACKNOWLEDGED and received_units == 0)
      cancel_fee_cents = max(MIN_RESTOCK_FEE_CENTS, round_half_up(unreceived_net * RESTOCK_PCT / 100))
      Debit from customer credit ledger first; any remainder above the balance stays recorded as cancel_fee_cents due.
      Cancel from DRAFT or SUBMITTED: cancel_fee_cents = 0.
    constants:
      RESTOCK_PCT: 20
      MIN_RESTOCK_FEE_CENTS: 25000
    precision: "0 decimal places (integer cents), round_half_up"

  - name: order_install_posture
    trigger: "install event create/confirm/unconfirm/start/complete/cancel; punch item create/verify/close"
    algorithm: aggregation
    formula: |
      events = InstallEvents of the order with status != CANCELLED
      if any PunchItem of the order has severity == CRITICAL and status in {OPEN, READY_FOR_VERIFY}:
        install_posture = BLOCKED
      elif events non-empty and every event status == COMPLETED:
        install_posture = COMPLETE
      elif any event status == IN_PROGRESS:
        install_posture = IN_PROGRESS
      elif any event status == CONFIRMED:
        install_posture = SCHEDULED
      else:
        install_posture = NOT_SCHEDULED
    input_set: "InstallEvents (excluding CANCELLED) and PunchItems of the order"
    precision: "n/a"

# =============================================================================
# Table 4: Validation Rules Table (§1.4, ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Caller role must be listed on the endpoint"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Every id in the path and every FK id in the body must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Target resource must be in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties and safety holds, in this sub-order: (5a) SoD — contract activator != contract creator, credit issuer != lot appraiser (ERR_SOD_VIOLATION); (5b) series quality_hold blocks new order lines (ERR_SERIES_ON_QUALITY_HOLD); (5c) crew suspension blocks event create/confirm (ERR_CREW_NOT_ACTIVE); (5d) BLOCKED install posture blocks event start (ERR_ORDER_BLOCKED)"
    error_id: "ERR_SOD_VIOLATION / ERR_SERIES_ON_QUALITY_HOLD / ERR_CREW_NOT_ACTIVE / ERR_ORDER_BLOCKED"
    http_status: 409
    applies_to: "contract activate; issue_credit; order line create; install event create/confirm/start"

  - priority: 6
    category: business_temporal
    check: "Contract effectiveness: contract ACTIVE and current UTC date within [effective_from, effective_to] inclusive; pinned contract version still current at acknowledge"
    error_id: ERR_CONTRACT_NOT_EFFECTIVE
    http_status: 409
    applies_to: "order submit; order acknowledge"

  - priority: 7
    category: business_referential
    check: "Referenced-object freshness and linkage, in this sub-order: (7a) plan APPROVED with approved_version == version (ERR_PLAN_NOT_APPROVED / ERR_PLAN_SUPERSEDED); (7b) typical belongs to order's plan (ERR_TYPICAL_PLAN_MISMATCH); (7c) series not DISCONTINUED (ERR_SERIES_DISCONTINUED); (7d) order ACKNOWLEDGED before staging/event creation (ERR_ORDER_NOT_ACKNOWLEDGED); (7e) punch VERIFIED before manual claim creation (ERR_PUNCH_NOT_VERIFIED); (7f) order close gates (ERR_INSTALL_NOT_COMPLETE then ERR_ORDER_HAS_OPEN_PUNCH); (7g) punch close requires linked claims terminal (ERR_CLAIM_NOT_SETTLED)"
    error_id: "ERR_PLAN_NOT_APPROVED / ERR_PLAN_SUPERSEDED / ERR_TYPICAL_PLAN_MISMATCH / ERR_SERIES_DISCONTINUED / ERR_ORDER_NOT_ACKNOWLEDGED / ERR_PUNCH_NOT_VERIFIED / ERR_INSTALL_NOT_COMPLETE / ERR_ORDER_HAS_OPEN_PUNCH / ERR_CLAIM_NOT_SETTLED"
    http_status: 409
    applies_to: "order submit/acknowledge/close; order line create; staging reservation create; install event create; claim create; punch close"

  - priority: 8
    category: business_constraint
    check: "Structural constraints, in this sub-order: (8a) field shape/range/enum errors (ERR_INVALID_REQUEST); (8b) date ranges start <= end (ERR_INVALID_DATE_RANGE); (8c) uniqueness: customer external_ref per dealership, contract code, plan typical code per plan, series_code per dealership (ERR_DUPLICATE_REFERENCE); (8d) crew overlap with buffer (ERR_CREW_OVERLAP); (8e) staging aggregate capacity (ERR_CAPACITY_EXCEEDED); (8f) over-receipt (ERR_OVER_RECEIPT); (8g) asset movability (ERR_ASSET_NOT_MOVABLE)"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_DATE_RANGE / ERR_DUPLICATE_REFERENCE / ERR_CREW_OVERLAP / ERR_CAPACITY_EXCEEDED / ERR_OVER_RECEIPT / ERR_ASSET_NOT_MOVABLE"
    http_status: 409
    applies_to: "create endpoints; install event create/confirm; staging receive/reserve; event complete"

  - priority: 9
    category: business_fiscal
    check: "Money rules last: pricing compliance at contract activate and order submit (ERR_CONTRACT_PRICING_VIOLATION); credit cap per order (ERR_CREDIT_CAP_EXCEEDED); sufficient customer credit balance (ERR_INSUFFICIENT_CREDIT)"
    error_id: "ERR_CONTRACT_PRICING_VIOLATION / ERR_CREDIT_CAP_EXCEEDED / ERR_INSUFFICIENT_CREDIT"
    http_status: 422
    applies_to: "contract activate; order submit; order apply_credit"

# =============================================================================
# Response Envelope (§1.0, FIXED — do not modify)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

