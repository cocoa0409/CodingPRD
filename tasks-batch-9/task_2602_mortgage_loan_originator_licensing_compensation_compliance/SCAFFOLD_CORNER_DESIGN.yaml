      - name: investigation_finding_with_mismatched_restitution_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=36]
          - errors[ERR_RESTITUTION_MISMATCH]
          - state_machines.UnlicensedActivityInvestigation.OPEN_to_SUBSTANTIATED
        distinguishing_aspect: |
          The restitution amount must agree with the finding in both directions: SUBSTANTIATED
          with restitution_cents 0 is rejected 422 ERR_RESTITUTION_MISMATCH, and so is
          UNSUBSTANTIATED with restitution_cents 500; the investigation stays OPEN through both
          rejections and only SUBSTANTIATED with 500 transitions it.
        test_recipe:
          setup:
            - "Originator 2200001 with an ACTIVE sponsored CA licence, one LOCKED CA loan, and
               one manually opened UnlicensedActivityInvestigation in status OPEN."
