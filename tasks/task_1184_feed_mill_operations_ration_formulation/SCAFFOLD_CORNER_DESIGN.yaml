            - "err_mat == ERR_FLUSH_MATERIAL_INVALID (corn has is_flush_material false)"
            - "err_qty == ERR_FLUSH_QUANTITY_BELOW_MIN (0.4 < 0.5)"
            - "quantity exactly 0.5 accepted: FlushRecord.${fl_id}.status == RECORDED"

