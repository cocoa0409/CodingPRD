            - call: "POST /network/merchants"
              payload: { acquirer_member_id: "${m_a}", mcc: "5411", region: "NA", declared_monthly_volume_cents: 10000000 }
              as: SponsorshipManager
              captures: { mc2: $.data.id }
            - call: "POST /network/fraud-cases"
              payload: { merchant_id: "${mc1}", reported_by_member_id: "${m_i}", fraud_amount_cents: 10000 }
              as: FraudAnalyst
              captures: { fc1: $.data.id }
            - call: "POST /network/fraud-cases/${fc1}/confirm"
              payload: {}
              as: FraudAnalyst
            - call: "POST /network/fraud-cases"
              payload: { merchant_id: "${mc2}", reported_by_member_id: "${m_i}", fraud_amount_cents: 9999 }
              as: FraudAnalyst
              captures: { fc2: $.data.id }
            - call: "POST /network/fraud-cases/${fc2}/confirm"
              payload: {}
              as: FraudAnalyst
            - call: "POST /network/fraud-program-cycles"
              payload: { cycle_label: "CYC", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-16T00:00:00Z" }
              as: FraudAnalyst
              captures: { cyc: $.data.id }
            - call: "POST /network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: NetworkOperator
          trigger:
            - call: "POST /network/fraud-program-cycles/${cyc}/evaluate"
              payload: {}
              as: FraudAnalyst
              captures: { cyc_flagged: $.data.merchants_flagged }
          assert:
            - "Merchant.${mc1}.fraud_monitoring_status == REMEDIATION_REQUIRED (10000*10000/10000000 = 100 bps >= 100)"
            - "Merchant.${mc2}.fraud_monitoring_status == NOT_MONITORED (9999*10000/10000000 < 100 bps)"
            - "FraudProgramCycle.${cyc}.merchants_flagged == 1"
            - "Exactly one RemediationPlan with subject_type MERCHANT and subject_id == ${mc1} exists for cycle ${cyc}"

      - name: settlement_reconcile_blocked_by_single_draft_line
        grounds:
          - state_machines.SettlementWindow.OPEN_to_RECONCILED
          - errors[ERR_DRAFT_LINES_REMAIN]
        distinguishing_aspect: |
          Empty/zero-collection boundary on a different metric (child-line counts, not rates): a window
          containing exactly one DRAFT line cannot reconcile (ERR_DRAFT_LINES_REMAIN), but the same window
          reconciles once that single line is committed — the boundary sits at zero remaining DRAFT lines,
          reached through POST /network/settlement-windows/{id}/reconcile.
        test_recipe:
          setup:
            - "Two ACTIVE members M1, M2; window W covering logical now opened; one DRAFT line L (1000 cents, M1 -> M2)"
