  # ===========================================================================
  # 6. From Table 6 (Errors) — every catalogue code must be triggerable
  # ===========================================================================
  - section: errors
    instances:

      - name: logical_clock_rejects_an_equal_or_earlier_instant
        claim_type: Error triggerable
        grounds:
          - endpoints.POST_clock_set_current_utc
          - validations.priority_12
          - errors.ERR_CLOCK_REGRESSION
        distinguishing_aspect: |
          The clock is the substrate every temporal rule reads, so its own guard is tested standalone:
          the check is STRICTLY greater, so re-setting the clock to the value it already holds is a 409
          rather than a no-op, and a rejected set leaves the clock exactly where it was.
        test_recipe:
          setup:
            - "no business rows at all; the logical clock is at its startup default 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { now1: $.data.current_utc, prev1: $.data.previous_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { equal_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T23:59:59Z" }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { back_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:01Z" }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { now2: $.data.current_utc, prev2: $.data.previous_utc }
          assert:
            - "the first set returns current_utc '2026-08-05T00:00:00Z' and previous_utc '2026-08-01T00:00:00Z', confirming the startup default is the pinned instant and not wall-clock time"
            - "EQUAL: re-setting the same instant returns HTTP 409 'ERR_CLOCK_REGRESSION' — the comparison is strictly greater, so equality is a regression"
            - "EARLIER: one second earlier also returns HTTP 409 'ERR_CLOCK_REGRESSION'"
            - "the two rejections did not move the clock: the next accepted set reports previous_utc '2026-08-05T00:00:00Z' and current_utc '2026-08-05T00:00:01Z'"
            - "one second forward is enough — the guard is on ordering, not on granularity"

