              as: NetworkManager
            - call: "POST /ipa/physicians/${p_c1}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_c1}/physicians"
              payload: { npi: "4100000002", full_name: "Bruno Castellani", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_c2: "$.data.id" }
            - call: "POST /ipa/physicians/${p_c2}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_c2}/state"
