  # =====================================================================
  # Rule 4 — transitive cascades from different triggering transitions
  #   4a: depth 4 from Ballot.CLOSED_to_EVALUATED (POST /sdo/ballots/{ballotId}/close)
  #   4b: depth 4 from Appeal.ACCEPTED_FOR_REVIEW_to_UPHELD (POST /sdo/appeals/{appealId}/decide)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: ballot_close_cascade_reaches_work_item_gate_through_vote_and_draft
        grounds:
          - state_machines.Ballot.CLOSED_to_EVALUATED
          - state_machines.Vote.NOT_APPLICABLE_to_PENDING
          - state_machines.Draft.SUBCOMMITTEE_BALLOT_to_COMMENT_RESOLUTION
          - calculations.consensus_gate_evaluation
          - entities.WorkItem.fields.consensus_gate
        distinguishing_aspect: |
          Four hops, each caused by the previous one and not by the close request itself: closing the
          ballot evaluates it (hop 1); because it evaluated, the CAST NEGATIVE Vote moves
          NOT_APPLICABLE -> PENDING (hop 2); because a PENDING negative now exists, the Draft moves
          SUBCOMMITTEE_BALLOT -> COMMENT_RESOLUTION (hop 3); because a draft sits in
          COMMENT_RESOLUTION, the WorkItem's consensus_gate becomes BLOCKED (hop 4).
        test_recipe:
          setup:
            - "Balanced committee TC-14 with 3 voting seats in 3 distinct interest categories, chaired by the PRODUCER."
            - "Work item STD-1400 in development with a revision-1 draft of 40 clauses; consensus_gate is OPEN before the close."
            - "An OPEN SUBCOMMITTEE ballot over 2026-08-01 .. 2026-08-15 holding 2 AFFIRMATIVE returns and 1 NEGATIVE return with adjudication_status NOT_APPLICABLE."
            - "Logical clock left at its 2026-08-01T00:00:00Z default; the ballot may be closed early because all 3 seats returned."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
