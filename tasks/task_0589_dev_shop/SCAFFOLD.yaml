scenario: "589. Web / Software Development Shop: lead & SOW/estimate (fixed/T&M), sprint/milestone & ticket, time tracking & burn-rate, change request & scope, staging/QA & acceptance, deployment & maintenance retainer, milestone billing & invoice, support SLA"
domain_name: "dev-shop-delivery"
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Flat topology: every entity is addressed at its own top-level collection
    (/engagements, /sprints, /tickets, /time-entries, ...) and links to peers via
    FK fields in the request body; no nested URL paths. The read surface is
    therefore larger than a nested design (one single-resource GET plus one
    filtered-list GET per FK-bearing entity) — this is required by the FK
    reverse-reachability rule of §1.5, not padding.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Client company name
      - name: billing_email
        type: string
        source: input
        description: Where invoices are sent
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country code
        constraints: "2 uppercase letters"

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client this engagement belongs to"
      - name: title
        type: string
        source: input
        description: Engagement / project title
      - name: source_channel
        type: enum
        source: input
        description: How the lead arrived
        constraints: "REFERRAL | INBOUND | OUTBOUND | PARTNER"
      - name: status
        type: enum
        source: computed
        description: Lead-to-delivery lifecycle state
        default: LEAD
        constraints: "LEAD | QUALIFIED | DISQUALIFIED | SOW_ISSUED | ACTIVE | CLOSED"
      - name: billing_status
        type: enum
        source: computed
        description: Independent billing dimension, recomputed from Invoice rows
        default: UNBILLED
        constraints: "UNBILLED | PARTIALLY_BILLED | FULLY_BILLED"
      - name: billing_model
        type: enum
        source: input
        description: Set on the SOW step; null until then
        default: null
        constraints: "FIXED | TIME_AND_MATERIALS"
      - name: contract_value
        type: number
        source: computed
        description: SOW contract value; increased by approved ChangeRequest.quoted_amount
        default: null
        constraints: "> 0 at SOW time; 2 decimal places"
      - name: budget_hours_cap
        type: number
        source: computed
        description: SOW hour cap; increased by approved ChangeRequest.delta_hours
        default: null
        constraints: "> 0 at SOW time"
      - name: standard_hourly_rate
        type: number
        source: input
        description: Blended hourly rate used by burn-rate, invoicing and CR quoting
        default: null
        constraints: "> 0; 2 decimal places"
      - name: start_date
        type: string
        source: input
        description: SOW start date (YYYY-MM-DD, inclusive)
        default: null
      - name: end_date
        type: string
        source: input
        description: SOW end date (YYYY-MM-DD, inclusive)
        default: null
      - name: signed_at
        type: datetime
        source: system
        description: Logical-clock instant the ClientContact signed the SOW
        default: null
      - name: approved_hours
        type: number
        source: computed
        description: See calculations.engagement_burn_rate (approved_only variant)
        default: 0
      - name: burned_cost
        type: number
        source: computed
        description: See calculations.engagement_burn_rate (approved_only variant)
        default: 0
      - name: burn_ratio
        type: number
        source: computed
        description: burned_cost / contract_value, 4 decimal places
        default: 0
      - name: budget_posture
        type: enum
        source: computed
        description: See calculations.budget_posture; gates sprint spend
        default: HEALTHY
        constraints: "HEALTHY | AT_RISK | OVERBURNED"
      - name: invoiced_amount
        type: number
        source: computed
        description: "Sum of Invoice.subtotal where Invoice.engagement_id == this and Invoice.status IN {ISSUED, PAID}"
        default: 0
      - name: scope_hours_added
        type: number
        source: computed
        description: "Sum of ChangeRequest.delta_hours where status == APPROVED"
        default: 0

  - name: Milestone
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id"
      - name: sequence
        type: integer
        source: input
        description: Ordering index within the engagement
        constraints: ">= 1; unique per engagement_id"
      - name: title
        type: string
        source: input
        description: Milestone title
      - name: amount
        type: number
        source: input
        description: Fixed-fee amount billed when this milestone is accepted
        constraints: "> 0; 2 decimal places"
      - name: due_date
        type: string
        source: input
        description: Target date (YYYY-MM-DD)
      - name: status
        type: enum
        source: computed
        description: Milestone lifecycle
        default: PLANNED
        constraints: "PLANNED | COMPLETED | BILLED"
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant the linked Release was accepted
        default: null

  - name: Sprint
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id"
      - name: milestone_id
        type: string
        source: input
        description: "FK -> Milestone.id; optional, must belong to the same engagement"
        default: null
      - name: name
        type: string
        source: input
        description: Sprint name
      - name: start_date
        type: string
        source: input
        description: Sprint window start (YYYY-MM-DD), inclusive
      - name: end_date
        type: string
        source: input
        description: Sprint window end (YYYY-MM-DD), EXCLUSIVE (half-open interval)
      - name: status
        type: enum
        source: computed
        description: Sprint lifecycle
        default: PLANNED
        constraints: "PLANNED | ACTIVE | CLOSED"
      - name: spend_frozen
        type: boolean
        source: computed
        description: Set true when the parent engagement's budget_posture is AT_RISK or OVERBURNED
        default: false
      - name: committed_hours
        type: number
        source: computed
        description: "Sum of Ticket.estimated_hours where Ticket.sprint_id == this and Ticket.status != CANCELLED"
        default: 0

  - name: Ticket
    parent: Sprint
    common_fields: true
    fields:
      - name: sprint_id
        type: string
        source: input
        description: "FK -> Sprint.id"
      - name: blocking_ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; optional self-reference; this ticket cannot start until the blocker is DONE"
        default: null
      - name: title
        type: string
        source: input
        description: Ticket title
      - name: estimated_hours
        type: number
        source: input
        description: Estimate used for committed_hours and variance_ratio
        constraints: "> 0"
      - name: assignee_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the Engineer who owns the ticket
      - name: status
        type: enum
        source: computed
        description: Ticket lifecycle (cyclic through REWORK)
        default: TODO
        constraints: "TODO | IN_PROGRESS | IN_QA | REWORK | DONE | CANCELLED"
      - name: actual_hours
        type: number
        source: computed
        description: "Sum of TimeEntry.hours where TimeEntry.ticket_id == this and TimeEntry.status == APPROVED"
        default: 0
      - name: variance_ratio
        type: number
        source: computed
        description: "round(actual_hours / estimated_hours, 4)"
        default: 0
      - name: rework_rounds
        type: integer
        source: computed
        description: Number of times this ticket entered REWORK
        default: 0

  - name: TimeEntry
    parent: Ticket
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id"
      - name: employee_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the submitting Engineer
      - name: work_date
        type: string
        source: input
        description: Date the work happened (YYYY-MM-DD)
      - name: hours
        type: number
        source: input
        description: Hours worked
        constraints: "> 0 and <= 12; 2 decimal places"
      - name: billable
        type: boolean
        source: input
        description: Non-billable entries never enter burn or invoices
        default: true
      - name: note
        type: string
        source: input
        description: Free-text note
        default: null
      - name: status
        type: enum
        source: computed
        description: Review lifecycle
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | REJECTED | REVERSED"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the DeliveryLead who reviewed the entry
        default: null

  - name: ChangeRequest
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id"
      - name: title
        type: string
        source: input
        description: Change request title
      - name: delta_hours
        type: number
        source: input
        description: Additional hours requested
        constraints: "> 0"
      - name: rush
        type: boolean
        source: input
        description: Rush delivery flag; adds RUSH_PCT on top of labor + overhead
        default: false
      - name: quoted_amount
        type: number
        source: computed
        description: See calculations.change_request_quote
        default: 0
      - name: status
        type: enum
        source: computed
        description: Negotiation lifecycle (cyclic through REVISION_REQUESTED)
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | REJECTED"
      - name: revision_rounds
        type: integer
        source: computed
        description: Number of REQUEST_REVISION decisions taken so far
        default: 0

  - name: Release
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id"
      - name: milestone_id
        type: string
        source: input
        description: "FK -> Milestone.id; the milestone this release delivers; must belong to the same engagement"
      - name: version_label
        type: string
        source: input
        description: Build label, e.g. "v1.2.0"
      - name: status
        type: enum
        source: computed
        description: Staging/QA/acceptance/deployment lifecycle (cyclic through REWORK)
        default: BUILDING
        constraints: "BUILDING | QA_PASSED | REWORK | ACCEPTED | DEPLOYED"
      - name: defect_count
        type: integer
        source: computed
        description: Defect count reported by the most recent QA result
        default: 0
      - name: qa_rounds
        type: integer
        source: computed
        description: Number of QA results recorded on this release
        default: 0
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant of client acceptance
        default: null
      - name: environment
        type: string
        source: input
        description: Deployment target recorded at deploy time
        default: null

  - name: Invoice
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id"
      - name: milestone_id
        type: string
        source: input
        description: "FK -> Milestone.id; required when kind == MILESTONE, else null"
        default: null
      - name: retainer_id
        type: string
        source: input
        description: "FK -> RetainerContract.id; required when kind == RETAINER, else null"
        default: null
      - name: kind
        type: enum
        source: input
        description: Invoice kind; must be compatible with Engagement.billing_model
        constraints: "MILESTONE | TIME_AND_MATERIALS | RETAINER"
      - name: period_start
        type: string
        source: input
        description: Inclusive period start (YYYY-MM-DD); required for TIME_AND_MATERIALS and RETAINER
        default: null
      - name: period_end
        type: string
        source: input
        description: Inclusive period end (YYYY-MM-DD); required for TIME_AND_MATERIALS and RETAINER
        default: null
      - name: lines
        type: array
        source: computed
        description: "Ordered array of { label, amount } objects; see calculations.invoice_total"
        default: []
      - name: subtotal
        type: number
        source: computed
        description: Sum of the per-line rounded amounts
        default: 0
      - name: tax
        type: number
        source: computed
        description: "round(subtotal * TAX_RATE, 2)"
        default: 0
      - name: total
        type: number
        source: computed
        description: subtotal + tax
        default: 0
      - name: status
        type: enum
        source: computed
        description: Invoice lifecycle
        default: DRAFT
        constraints: "DRAFT | ISSUED | PAID | VOID"
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issue
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock instant of payment
        default: null

  - name: RetainerContract
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the delivery engagement this retainer maintains"
      - name: start_date
        type: string
        source: input
        description: Coverage window start (YYYY-MM-DD), INCLUSIVE
      - name: end_date
        type: string
        source: input
        description: Coverage window end (YYYY-MM-DD), INCLUSIVE
      - name: monthly_fee
        type: number
        source: input
        description: Flat monthly retainer fee
        constraints: "> 0; 2 decimal places"
      - name: included_hours
        type: number
        source: input
        description: Support hours included in the monthly fee
        constraints: ">= 0"
      - name: sla_tier
        type: enum
        source: input
        description: Determines the SLA credit percentage per breach
        constraints: "GOLD | SILVER | BRONZE"

  - name: SupportIncident
    parent: RetainerContract
    common_fields: true
    fields:
      - name: retainer_id
        type: string
        source: input
        description: "FK -> RetainerContract.id"
      - name: severity
        type: enum
        source: input
        description: Drives both the SLA thresholds and the SLA clock variant
        constraints: "SEV1 | SEV2 | SEV3"
      - name: summary
        type: string
        source: input
        description: Incident summary
      - name: status
        type: enum
        source: computed
        description: Incident lifecycle
        default: OPEN
        constraints: "OPEN | RESPONDED | RESOLVED"
      - name: opened_at
        type: datetime
        source: system
        description: Logical-clock instant at creation
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant of first response
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant of resolution
        default: null
      - name: response_minutes
        type: integer
        source: computed
        description: See calculations.sla_clock (variant chosen by severity)
        default: null
      - name: resolution_minutes
        type: integer
        source: computed
        description: See calculations.sla_clock (variant chosen by severity)
        default: null
      - name: sla_response_breached
        type: boolean
        source: computed
        description: "response_minutes > SLA_RESPONSE_MINUTES[severity]"
        default: false
      - name: sla_resolution_breached
        type: boolean
        source: computed
        description: "resolution_minutes > SLA_RESOLUTION_MINUTES[severity]"
        default: false
      - name: sla_credit_amount
        type: number
        source: computed
        description: See calculations.sla_credit; computed at resolve time
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Engagement
    dimension: status
    initial_state: LEAD
    terminal_states: [DISQUALIFIED, CLOSED]
    transitions:
      - from: LEAD
        to: QUALIFIED
        trigger: "POST /engagements/{id}/qualify with outcome=QUALIFY"
        actor: AccountManager
        preconditions: ["engagement.status == LEAD"]
        side_effects: ["engagement.updated_at refreshed", "engagement.version += 1"]
      - from: LEAD
        to: DISQUALIFIED
        trigger: "POST /engagements/{id}/qualify with outcome=DISQUALIFY"
        actor: AccountManager
        preconditions: ["engagement.status == LEAD"]
        side_effects: ["engagement.version += 1"]
        note: "Terminal; no SOW may be issued afterwards."
      - from: QUALIFIED
        to: SOW_ISSUED
        trigger: "POST /engagements/{id}/sow"
        actor: AccountManager
        preconditions:
          - "engagement.status == QUALIFIED"
          - "contract_value > 0, budget_hours_cap > 0, standard_hourly_rate > 0"
          - "start_date <= end_date"
        side_effects:
          - "billing_model, contract_value, budget_hours_cap, standard_hourly_rate, start_date, end_date persisted"
          - "burn_ratio recomputed = 0.0; budget_posture = HEALTHY"
          - "engagement.version += 1"
      - from: SOW_ISSUED
        to: ACTIVE
        trigger: "POST /engagements/{id}/sign"
        actor: ClientContact
        preconditions:
          - "engagement.status == SOW_ISSUED"
          - "X-User-ID == engagement.client_id"
        side_effects:
          - "engagement.signed_at = current logical clock"
          - "engagement.version += 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /engagements/{id}/close"
        actor: DeliveryLead
        preconditions:
          - "engagement.status == ACTIVE"
          - "no Sprint with sprint.engagement_id == engagement.id has status == ACTIVE"
        side_effects:
          - "every Ticket in status TODO under a PLANNED sprint of this engagement is set to CANCELLED"
          - "engagement.version += 1"

  - entity: Engagement
    dimension: billing_status
    initial_state: UNBILLED
    terminal_states: []
    transitions:
      - from: UNBILLED
        to: PARTIALLY_BILLED
        trigger: "system: recompute after POST /invoices/{id}/issue"
        actor: system
        preconditions: ["0 < engagement.invoiced_amount < engagement.contract_value"]
        side_effects: ["engagement.invoiced_amount recomputed", "engagement.version += 1"]
        note: "Independent of the status dimension; an ACTIVE engagement can be UNBILLED, PARTIALLY_BILLED or FULLY_BILLED."
      - from: PARTIALLY_BILLED
        to: FULLY_BILLED
        trigger: "system: recompute after POST /invoices/{id}/issue"
        actor: system
        preconditions: ["engagement.invoiced_amount >= engagement.contract_value"]
        side_effects: ["engagement.version += 1"]
      - from: PARTIALLY_BILLED
        to: UNBILLED
        trigger: "system: recompute after POST /invoices/{id}/void"
        actor: system
        preconditions: ["engagement.invoiced_amount == 0"]
        side_effects: ["engagement.version += 1"]
      - from: FULLY_BILLED
        to: PARTIALLY_BILLED
        trigger: "system: recompute after POST /invoices/{id}/void"
        actor: system
        preconditions: ["0 < engagement.invoiced_amount < engagement.contract_value"]
        side_effects: ["engagement.version += 1"]
      - from: UNBILLED
        to: FULLY_BILLED
        trigger: "system: recompute after POST /invoices/{id}/issue"
        actor: system
        preconditions: ["engagement.invoiced_amount >= engagement.contract_value"]
        side_effects: ["engagement.version += 1"]

  - entity: Milestone
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "system: cascade from POST /releases/{id}/acceptance with action=ACCEPT (release.milestone_id == milestone.id)"
        actor: system
        preconditions: ["milestone.status == PLANNED"]
        side_effects:
          - "milestone.accepted_at = current logical clock"
          - "IF engagement.billing_model == FIXED: a new Invoice is created with kind=MILESTONE, status=DRAFT, milestone_id = this milestone, lines/subtotal/tax/total computed per calculations.invoice_total (conditional cascade — nothing is created for TIME_AND_MATERIALS engagements)"
      - from: COMPLETED
        to: BILLED
        trigger: "system: cascade from POST /invoices/{id}/issue where invoice.kind == MILESTONE"
        actor: system
        preconditions: ["milestone.status == COMPLETED"]
        side_effects: ["engagement.invoiced_amount recomputed", "engagement.billing_status recomputed"]
      - from: BILLED
        to: COMPLETED
        trigger: "system: compensating cascade from POST /invoices/{id}/void where invoice.kind == MILESTONE"
        actor: system
        preconditions: ["milestone.status == BILLED"]
        side_effects: ["engagement.invoiced_amount recomputed", "engagement.billing_status recomputed"]

  - entity: Sprint
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /sprints/{id}/transition with target_status=ACTIVE"
        actor: DeliveryLead
        preconditions:
          - "sprint.status == PLANNED"
          - "engagement.status == ACTIVE"
        side_effects:
          - "sprint.spend_frozen = (engagement.budget_posture != HEALTHY)"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /sprints/{id}/transition with target_status=CLOSED"
        actor: DeliveryLead
        preconditions: ["sprint.status == ACTIVE"]
        side_effects:
          - "every Ticket with sprint_id == sprint.id and status == TODO is set to CANCELLED"
          - "sprint.committed_hours recomputed over non-CANCELLED tickets"

  - entity: Ticket
    initial_state: TODO
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: TODO
        to: IN_PROGRESS
        trigger: "POST /tickets/{id}/transition with target_status=IN_PROGRESS"
        actor: Engineer | DeliveryLead
        preconditions:
          - "ticket.status == TODO"
          - "sprint.status == ACTIVE"
          - "sprint.spend_frozen == false"
          - "IF ticket.blocking_ticket_id is not null: blocker.status == DONE"
        side_effects: []
      - from: IN_PROGRESS
        to: IN_QA
        trigger: "POST /tickets/{id}/transition with target_status=IN_QA"
        actor: Engineer | DeliveryLead
        preconditions: ["ticket.status == IN_PROGRESS", "sprint.status == ACTIVE"]
        side_effects: []
      - from: IN_QA
        to: REWORK
        trigger: "POST /tickets/{id}/transition with target_status=REWORK"
        actor: Engineer | DeliveryLead
        preconditions: ["ticket.status == IN_QA", "sprint.status == ACTIVE"]
        side_effects: ["ticket.rework_rounds += 1"]
        note: "Cycle entry point: IN_QA -> REWORK -> IN_PROGRESS -> IN_QA."
      - from: REWORK
        to: IN_PROGRESS
        trigger: "POST /tickets/{id}/transition with target_status=IN_PROGRESS"
        actor: Engineer | DeliveryLead
        preconditions:
          - "ticket.status == REWORK"
          - "sprint.status == ACTIVE"
          - "sprint.spend_frozen == false"
        side_effects: []
      - from: IN_QA
        to: DONE
        trigger: "POST /tickets/{id}/transition with target_status=DONE"
        actor: Engineer | DeliveryLead
        preconditions:
          - "ticket.status == IN_QA"
          - "sprint.status == ACTIVE"
          - "X-User-ID != ticket.assignee_user_id (segregation of duties: the assignee may not sign off their own ticket)"
        side_effects: ["ticket.variance_ratio recomputed"]
      - from: TODO
        to: CANCELLED
        trigger: "POST /tickets/{id}/transition with target_status=CANCELLED"
        actor: DeliveryLead
        preconditions: ["ticket.status == TODO"]
        side_effects: ["sprint.committed_hours recomputed"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /tickets/{id}/transition with target_status=CANCELLED"
        actor: DeliveryLead
        preconditions: ["ticket.status == IN_PROGRESS"]
        side_effects: ["sprint.committed_hours recomputed"]

  - entity: TimeEntry
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /time-entries/{id}/review with decision=APPROVE"
        actor: DeliveryLead
        preconditions:
          - "time_entry.status == SUBMITTED"
          - "sprint.status == ACTIVE (sprint of the entry's ticket)"
          - "X-User-ID != time_entry.employee_user_id (segregation of duties)"
          - "engagement.approved_hours + time_entry.hours <= engagement.budget_hours_cap (only when time_entry.billable == true)"
        side_effects:
          - "LINK 1: time_entry.status = APPROVED, reviewed_by_user_id = X-User-ID"
          - "LINK 2 (caused by LINK 1): ticket.actual_hours += time_entry.hours; ticket.variance_ratio recomputed"
          - "LINK 3 (caused by LINK 2): engagement.approved_hours / burned_cost / burn_ratio recomputed per calculations.engagement_burn_rate"
          - "LINK 4 (caused by LINK 3): engagement.budget_posture recomputed per calculations.budget_posture"
          - "LINK 5 (caused by LINK 4): if budget_posture is AT_RISK or OVERBURNED, every Sprint of the engagement with status == ACTIVE gets spend_frozen = true; if it is HEALTHY, they get spend_frozen = false"
          - "engagement.version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /time-entries/{id}/review with decision=REJECT"
        actor: DeliveryLead
        preconditions:
          - "time_entry.status == SUBMITTED"
          - "X-User-ID != time_entry.employee_user_id"
        side_effects: ["time_entry.reviewed_by_user_id = X-User-ID", "no ledger change (ticket.actual_hours untouched)"]
      - from: APPROVED
        to: REVERSED
        trigger: "POST /time-entries/{id}/reverse"
        actor: DeliveryLead
        preconditions: ["time_entry.status == APPROVED"]
        side_effects:
          - "COMPENSATION LINK 1: time_entry.status = REVERSED"
          - "COMPENSATION LINK 2 (caused by LINK 1): ticket.actual_hours -= time_entry.hours; ticket.variance_ratio recomputed"
          - "COMPENSATION LINK 3 (caused by LINK 2): engagement.approved_hours / burned_cost / burn_ratio recomputed"
          - "COMPENSATION LINK 4 (caused by LINK 3): engagement.budget_posture recomputed; on return to HEALTHY every ACTIVE sprint gets spend_frozen = false"
          - "engagement.version += 1"
        note: "Exact inverse of SUBMITTED->APPROVED; see calculations.hours_ledger_invariant."

  - entity: ChangeRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /change-requests/{id}/submit"
        actor: DeliveryLead
        preconditions: ["change_request.status == DRAFT", "engagement.status == ACTIVE"]
        side_effects: ["change_request.quoted_amount recomputed per calculations.change_request_quote"]
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /change-requests/{id}/decision with action=REQUEST_REVISION"
        actor: ClientContact
        preconditions:
          - "change_request.status == SUBMITTED"
          - "X-User-ID == engagement.client_id"
          - "change_request.revision_rounds < MAX_CR_REVISION_ROUNDS (2)"
        side_effects: ["change_request.revision_rounds += 1"]
        note: "Cycle entry: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED (negotiation rounds)."
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /change-requests/{id}/submit"
        actor: DeliveryLead
        preconditions: ["change_request.status == REVISION_REQUESTED", "engagement.status == ACTIVE"]
        side_effects: ["change_request.quoted_amount recomputed per calculations.change_request_quote"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /change-requests/{id}/decision with action=APPROVE"
        actor: ClientContact
        preconditions:
          - "change_request.status == SUBMITTED"
          - "X-User-ID == engagement.client_id"
          - "engagement.status == ACTIVE"
        side_effects:
          - "LINK 1: change_request.status = APPROVED"
          - "LINK 2 (caused by LINK 1): engagement.contract_value += change_request.quoted_amount; engagement.budget_hours_cap += change_request.delta_hours; engagement.scope_hours_added recomputed"
          - "LINK 3 (caused by LINK 2): engagement.burn_ratio recomputed against the NEW contract_value"
          - "LINK 4 (caused by LINK 3): engagement.budget_posture recomputed; if it drops back to HEALTHY, every ACTIVE sprint of the engagement gets spend_frozen = false"
          - "engagement.version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /change-requests/{id}/decision with action=REJECT"
        actor: ClientContact
        preconditions: ["change_request.status == SUBMITTED", "X-User-ID == engagement.client_id"]
        side_effects: ["no scope change; engagement.contract_value and budget_hours_cap untouched"]

  - entity: Release
    initial_state: BUILDING
    terminal_states: [DEPLOYED]
    transitions:
      - from: BUILDING
        to: QA_PASSED
        trigger: "POST /releases/{id}/qa-result with outcome=PASS"
        actor: Engineer
        preconditions:
          - "release.status == BUILDING"
          - "engagement.status == ACTIVE"
          - "defect_count == 0"
        side_effects: ["release.qa_rounds += 1", "release.defect_count = 0"]
      - from: BUILDING
        to: REWORK
        trigger: "POST /releases/{id}/qa-result with outcome=FAIL"
        actor: Engineer
        preconditions: ["release.status == BUILDING", "engagement.status == ACTIVE", "defect_count >= 1"]
        side_effects: ["release.qa_rounds += 1", "release.defect_count = payload defect_count"]
      - from: REWORK
        to: QA_PASSED
        trigger: "POST /releases/{id}/qa-result with outcome=PASS"
        actor: Engineer
        preconditions: ["release.status == REWORK", "engagement.status == ACTIVE", "defect_count == 0"]
        side_effects: ["release.qa_rounds += 1", "release.defect_count = 0"]
        note: "Cycle: QA_PASSED -> REWORK -> QA_PASSED."
      - from: QA_PASSED
        to: REWORK
        trigger: "POST /releases/{id}/acceptance with action=REJECT"
        actor: ClientContact
        preconditions:
          - "release.status == QA_PASSED"
          - "X-User-ID == engagement.client_id"
        side_effects: ["milestone.status unchanged (still PLANNED)"]
      - from: QA_PASSED
        to: ACCEPTED
        trigger: "POST /releases/{id}/acceptance with action=ACCEPT"
        actor: ClientContact
        preconditions:
          - "release.status == QA_PASSED"
          - "engagement.status == ACTIVE"
          - "X-User-ID == engagement.client_id"
        side_effects:
          - "LINK 1: release.status = ACCEPTED; release.accepted_at = current logical clock"
          - "LINK 2 (caused by LINK 1): the Milestone referenced by release.milestone_id transitions PLANNED -> COMPLETED and gets accepted_at set"
          - "LINK 3 (caused by LINK 2, conditional): if engagement.billing_model == FIXED, a DRAFT Invoice with kind=MILESTONE for that milestone is created with lines/subtotal/tax/total computed per calculations.invoice_total"
      - from: ACCEPTED
        to: DEPLOYED
        trigger: "POST /releases/{id}/deploy"
        actor: Engineer
        preconditions: ["release.status == ACCEPTED"]
        side_effects: ["release.environment = payload environment"]

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: FinanceOfficer
        preconditions:
          - "invoice.status == DRAFT"
          - "len(invoice.lines) >= 1"
          - "IF invoice.kind == MILESTONE: milestone.status == COMPLETED"
        side_effects:
          - "invoice.issued_at = current logical clock"
          - "IF kind == MILESTONE: milestone.status COMPLETED -> BILLED"
          - "engagement.invoiced_amount recomputed = sum(Invoice.subtotal where status IN {ISSUED, PAID})"
          - "engagement.billing_status recomputed (UNBILLED / PARTIALLY_BILLED / FULLY_BILLED)"
          - "engagement.version += 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: FinanceOfficer
        preconditions: ["invoice.status == ISSUED", "paid_amount == invoice.total"]
        side_effects: ["invoice.paid_at = current logical clock", "engagement.invoiced_amount unchanged (ISSUED and PAID both count)"]
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: FinanceOfficer
        preconditions: ["invoice.status == ISSUED"]
        side_effects:
          - "COMPENSATION LINK 1: invoice.status = VOID"
          - "COMPENSATION LINK 2 (caused by LINK 1): IF kind == MILESTONE: milestone.status BILLED -> COMPLETED"
          - "COMPENSATION LINK 3 (caused by LINK 2): engagement.invoiced_amount recomputed; engagement.billing_status recomputed"
          - "engagement.version += 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: FinanceOfficer
        preconditions: ["invoice.status == DRAFT"]
        side_effects: ["no ledger change (a DRAFT invoice was never counted in invoiced_amount)"]

  - entity: SupportIncident
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /support-incidents/{id}/respond"
        actor: Engineer
        preconditions: ["incident.status == OPEN"]
        side_effects:
          - "incident.responded_at = current logical clock"
          - "incident.response_minutes computed per calculations.sla_clock (variant selected by severity)"
          - "incident.sla_response_breached = response_minutes > SLA_RESPONSE_MINUTES[severity]"
      - from: RESPONDED
        to: RESOLVED
        trigger: "POST /support-incidents/{id}/resolve"
        actor: Engineer
        preconditions: ["incident.status == RESPONDED"]
        side_effects:
          - "incident.resolved_at = current logical clock"
          - "incident.resolution_minutes computed per calculations.sla_clock"
          - "incident.sla_resolution_breached = resolution_minutes > SLA_RESOLUTION_MINUTES[severity]"
          - "incident.sla_credit_amount computed per calculations.sla_credit"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on Engagement.version)
# =============================================================================
concurrency_rules:
  - rule_id: change-request-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /change-requests"
    occ_field: "expected_engagement_version"
    description: |
      Creating a ChangeRequest against an Engagement whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A ChangeRequest legitimately supersedes the scope assumptions of the
      engagement (its approval mutates contract_value and budget_hours_cap), so a
      second create against the same observed version would be accepted under the
      natural product semantics; OCC pins the writer's view of the engagement.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /invoices"
    occ_field: "expected_engagement_version"
    description: |
      Creating an Invoice snapshots the engagement's billing ledger (approved
      hours, milestone status, contract value). If the engagement's version has
      advanced since the FinanceOfficer last read it, the snapshot is stale and
      the create is rejected.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: engagement_burn_rate
    trigger: "Recomputed on TimeEntry SUBMITTED->APPROVED, APPROVED->REVERSED, ChangeRequest SUBMITTED->APPROVED, and on read of GET /engagements/{id}/burn-rate"
    algorithm: aggregation
    formula: |
      # approved_only variant (the persisted ledger; drives posture and budget checks)
      approved_hours = sum(te.hours
                           for te in TimeEntry
                           where te.status == 'APPROVED'
                             and te.billable == true
                             and ticket(te.ticket_id).sprint.engagement_id == E.id)
      burned_cost = round(approved_hours * E.standard_hourly_rate, 2)   # round ONCE on the aggregate
      burn_ratio  = round(burned_cost / E.contract_value, 4)            # E.contract_value already includes approved CRs

      # committed variant (forward-looking; exposed ONLY on GET /engagements/{id}/burn-rate)
      committed_hours = sum(te.hours
                            for te in TimeEntry
                            where te.status IN ('SUBMITTED', 'APPROVED')
                              and te.billable == true
                              and ticket(te.ticket_id).sprint.engagement_id == E.id)
      committed_burned_cost = round(committed_hours * E.standard_hourly_rate, 2)
      committed_burn_ratio  = round(committed_burned_cost / E.contract_value, 4)
    input_set: |
      approved_only: TimeEntry.status == APPROVED AND billable == true.
      committed: TimeEntry.status IN {SUBMITTED, APPROVED} AND billable == true.
      REJECTED, REVERSED and non-billable entries are excluded from BOTH variants.
      If E.contract_value is null (SOW not issued) both ratios are 0.0 and posture is HEALTHY.
      If approved_hours == 0 the ratio is exactly 0.0 (no division is attempted against a null contract_value).
    constants: {}
    precision: "hours: 2 decimals; cost: 2 decimals round_half_up; ratio: 4 decimals round_half_up"
    variants:
      - name: approved_only
        when: "Persisted on the Engagement row; the only variant that drives budget_posture, spend freezing and budget checks"
        difference: "Excludes SUBMITTED entries — an engagement whose team has logged but not yet had time approved shows a LOWER burn than reality"
      - name: committed
        when: "Returned only by GET /engagements/{id}/burn-rate as committed_hours / committed_burned_cost / committed_burn_ratio"
        difference: "Includes SUBMITTED entries, so for identical data it returns a strictly higher burn than approved_only whenever any SUBMITTED billable entry exists"
    note: |
      Deliberate divergence with invoice_total: burned_cost rounds ONCE on the aggregate
      (round(hours_total * rate, 2)) while invoice_total rounds PER LINE then sums. For the
      same hours these can differ by a cent; both are correct by their own pinned rule.

  - name: budget_posture
    trigger: "Recomputed immediately after engagement_burn_rate runs (TimeEntry approve/reverse, ChangeRequest approve, SOW issue)"
    algorithm: threshold
    formula: |
      if burn_ratio >= OVERBURNED_THRESHOLD:   budget_posture = 'OVERBURNED'
      elif burn_ratio >= AT_RISK_THRESHOLD:    budget_posture = 'AT_RISK'
      else:                                    budget_posture = 'HEALTHY'

      # gating cascade (applies on every recompute)
      if budget_posture in ('AT_RISK', 'OVERBURNED'):
          for s in Sprint where s.engagement_id == E.id and s.status == 'ACTIVE':
              s.spend_frozen = true
      else:
          for s in Sprint where s.engagement_id == E.id and s.status == 'ACTIVE':
              s.spend_frozen = false
    input_set: "Engagement.burn_ratio (approved_only variant). Sprints with status == ACTIVE only; PLANNED and CLOSED sprints are never touched by the freeze cascade."
    constants:
      AT_RISK_THRESHOLD: 0.90
      OVERBURNED_THRESHOLD: 1.00
    precision: "Comparison uses the 4-decimal rounded burn_ratio; boundaries are inclusive (>=), so exactly 0.9000 IS AT_RISK and exactly 1.0000 IS OVERBURNED"

  - name: change_request_quote
    trigger: "Recomputed on ChangeRequest DRAFT->SUBMITTED and REVISION_REQUESTED->SUBMITTED"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED. The discount tier LOOKS like it should key on the
      # final quoted_amount (which contains overhead + rush), but it is keyed on
      # labor_subtotal ONLY. Evaluating in any other order changes the number.
      # 1
      labor_subtotal = round(cr.delta_hours * E.standard_hourly_rate, 2)
      # 2  tier keyed on labor_subtotal (NOT on quoted_amount)
      if   labor_subtotal >= TIER2_FLOOR: scope_discount_pct = TIER2_DISCOUNT
      elif labor_subtotal >= TIER1_FLOOR: scope_discount_pct = TIER1_DISCOUNT
      else:                               scope_discount_pct = 0.00
      # 3
      discounted_labor = round(labor_subtotal * (1 - scope_discount_pct), 2)
      # 4
      pm_overhead = round(discounted_labor * PM_OVERHEAD_PCT, 2)
      # 5
      rush_fee = round((discounted_labor + pm_overhead) * RUSH_PCT, 2) if cr.rush else 0.00
      # 6
      quoted_amount = discounted_labor + pm_overhead + rush_fee     # already 2dp, no further rounding
    input_set: "The ChangeRequest's own delta_hours and rush flag, plus the Engagement's standard_hourly_rate at submit time. Prior approved CRs do not affect the tier."
    constants:
      TIER1_FLOOR: 5000.00
      TIER1_DISCOUNT: 0.05
      TIER2_FLOOR: 20000.00
      TIER2_DISCOUNT: 0.10
      PM_OVERHEAD_PCT: 0.12
      RUSH_PCT: 0.15
    precision: "2 decimal places, round_half_up, applied at steps 1, 3, 4 and 5 (never on the final sum)"

  - name: invoice_total
    trigger: "Runs at Invoice creation (POST /invoices) and at the system cascade that creates a MILESTONE invoice when a Milestone becomes COMPLETED"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round EACH line to 2dp, THEN sum. Summing raw
      # products and rounding once at the end produces a different cent value.
      lines = []
      if kind == 'MILESTONE':
          lines = [ { label: milestone.title, amount: round(milestone.amount, 2) } ]

      elif kind == 'TIME_AND_MATERIALS':
          # eligibility filter
          eligible = [te for te in TimeEntry
                      where te.status == 'APPROVED'
                        and te.billable == true
                        and period_start <= te.work_date <= period_end     # both bounds INCLUSIVE
                        and ticket(te.ticket_id).sprint.engagement_id == E.id]
          # grouped by ticket, ordered by Ticket.created_at ASC (tie-break: Ticket.created_at is
          # unique per ticket because creation is serialized; id is NEVER used for ordering)
          for t in sorted(distinct tickets of eligible, key=Ticket.created_at ASC):
              ticket_hours = sum(te.hours for te in eligible if te.ticket_id == t.id)
              lines.append({ label: t.title, amount: round(ticket_hours * E.standard_hourly_rate, 2) })

      elif kind == 'RETAINER':
          lines = [ { label: 'Monthly retainer', amount: round(retainer.monthly_fee, 2) } ]
          credit = sum(i.sla_credit_amount for i in SupportIncident
                       where i.retainer_id == retainer.id
                         and i.status == 'RESOLVED'
                         and period_start <= date(i.resolved_at) <= period_end)     # both bounds INCLUSIVE
          if credit > 0:
              lines.append({ label: 'SLA credit', amount: -round(credit, 2) })

      subtotal = sum(line.amount for line in lines)      # sum of ALREADY-ROUNDED line amounts
      tax      = round(max(subtotal, 0) * TAX_RATE, 2)
      total    = subtotal + tax
    input_set: |
      MILESTONE: exactly the one referenced milestone.
      TIME_AND_MATERIALS: APPROVED + billable TimeEntries whose work_date falls in the inclusive
        [period_start, period_end] window and whose ticket rolls up to this engagement. SUBMITTED,
        REJECTED, REVERSED and non-billable entries are excluded.
      RETAINER: the retainer's monthly_fee plus a negative SLA-credit line summed over RESOLVED
        incidents whose resolved_at date falls in the inclusive period window.
      An invoice whose computed `lines` array is empty is created but can never be issued
      (ERR_INVOICE_NO_LINES on POST /invoices/{id}/issue).
    constants:
      TAX_RATE: 0.0825
    precision: "Per-line: 2 decimals round_half_up. Subtotal: plain sum of rounded lines (no re-round). Tax: round(subtotal * TAX_RATE, 2) round_half_up. Total: subtotal + tax, no further rounding."

  - name: sla_clock
    trigger: "Runs on POST /support-incidents/{id}/respond (response_minutes) and POST /support-incidents/{id}/resolve (resolution_minutes)"
    algorithm: interval_merge
    formula: |
      # Two valid clocks over the SAME opened_at -> responded_at/resolved_at span.
      # The variant is selected by severity; they return DIFFERENT minute counts for
      # any span that crosses a night or a weekend.
      def calendar_minutes(a, b):
          return floor((b - a).total_seconds() / 60)          # every wall minute counts

      def business_minutes(a, b):
          # count ONLY minutes inside [BUSINESS_START_HOUR, BUSINESS_END_HOUR) UTC on Mon-Fri
          total = 0
          for each UTC day D from date(a) to date(b) inclusive:
              if weekday(D) in (SAT, SUN): continue
              win_start = D at BUSINESS_START_HOUR:00 UTC
              win_end   = D at BUSINESS_END_HOUR:00 UTC
              lo = max(a, win_start); hi = min(b, win_end)
              if hi > lo: total += floor((hi - lo).total_seconds() / 60)
          return total

      clock = calendar_minutes if severity == 'SEV1' else business_minutes
      response_minutes   = clock(opened_at, responded_at)
      resolution_minutes = clock(opened_at, resolved_at)      # measured from opened_at, NOT from responded_at

      sla_response_breached   = response_minutes   > SLA_RESPONSE_MINUTES[severity]
      sla_resolution_breached = resolution_minutes > SLA_RESOLUTION_MINUTES[severity]
    input_set: "The incident's own opened_at / responded_at / resolved_at, all stamped from the logical clock. Both durations are measured from opened_at."
    constants:
      BUSINESS_START_HOUR: 9
      BUSINESS_END_HOUR: 17
      SLA_RESPONSE_MINUTES: { SEV1: 60, SEV2: 240, SEV3: 480 }
      SLA_RESOLUTION_MINUTES: { SEV1: 480, SEV2: 1440, SEV3: 2880 }
    precision: "Whole minutes, floor. Breach uses STRICT `>` — a duration exactly equal to the threshold is NOT a breach."
    variants:
      - name: calendar_clock
        when: "severity == SEV1 (round-the-clock coverage)"
        difference: "Counts every wall-clock minute including nights and weekends"
      - name: business_hours_clock
        when: "severity IN {SEV2, SEV3}"
        difference: "Counts only 09:00-17:00 UTC Mon-Fri minutes, so an identical opened->responded span yields far fewer minutes and can flip a breach into a non-breach"

  - name: sla_credit
    trigger: "Runs on POST /support-incidents/{id}/resolve (RESPONDED -> RESOLVED)"
    algorithm: weighted_scoring
    formula: |
      pct = 0.00
      if incident.sla_response_breached:   pct += TIER_CREDIT_PCT[retainer.sla_tier]
      if incident.sla_resolution_breached: pct += TIER_CREDIT_PCT[retainer.sla_tier]
      pct = min(pct, CREDIT_CAP_PCT)
      sla_credit_amount = round(retainer.monthly_fee * pct, 2)
    input_set: "The two breach booleans on this incident plus the parent retainer's sla_tier and monthly_fee. Incidents that are OPEN or RESPONDED have sla_credit_amount == 0."
    constants:
      TIER_CREDIT_PCT: { GOLD: 0.10, SILVER: 0.05, BRONZE: 0.02 }
      CREDIT_CAP_PCT: 0.25
    precision: "2 decimal places, round_half_up"

  - name: hours_ledger_invariant
    trigger: "Asserted after every TimeEntry review/reverse cascade"
    algorithm: aggregation
    formula: |
      Engagement.approved_hours == sum(te.hours for te in TimeEntry
                                       where te.status == 'APPROVED' and te.billable == true
                                         and ticket(te.ticket_id).sprint.engagement_id == E.id)
      Ticket.actual_hours       == sum(te.hours for te in TimeEntry
                                       where te.ticket_id == T.id and te.status == 'APPROVED')
      # Conserved quantity: HOURS. approve(te) followed by reverse(te) must leave both
      # sums, and therefore burned_cost / burn_ratio / budget_posture / Sprint.spend_frozen,
      # at exactly their pre-approve values. Zero drift is permitted.
    input_set: "All TimeEntry rows rolling up to the engagement through Ticket -> Sprint."
    constants: {}
    precision: "Exact equality on 2-decimal hours"

  - name: money_ledger_invariant
    trigger: "Asserted after every Invoice issue/void cascade"
    algorithm: aggregation
    formula: |
      Engagement.invoiced_amount == sum(inv.subtotal for inv in Invoice
                                        where inv.engagement_id == E.id
                                          and inv.status IN ('ISSUED', 'PAID'))
      # Conserved quantity: INVOICED CURRENCY (subtotal, tax-exclusive). issue(inv) followed by
      # void(inv) must leave invoiced_amount, billing_status AND the milestone's status at
      # exactly their pre-issue values (BILLED reverts to COMPLETED). Zero drift is permitted.
      Engagement.billing_status = 'UNBILLED'         if invoiced_amount == 0
                                  'FULLY_BILLED'     if invoiced_amount >= contract_value
                                  'PARTIALLY_BILLED' otherwise
    input_set: "All Invoice rows of the engagement with status IN {ISSUED, PAID}. DRAFT and VOID invoices contribute 0."
    constants: {}
    precision: "Exact equality on 2-decimal currency"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 10
    category: existence
    check: "Every path id resolves to an existing resource, validated left-to-right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 15
    category: existence
    check: "Every FK id in the request body resolves (client_id, engagement_id, milestone_id, sprint_id, ticket_id, retainer_id, blocking_ticket_id)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /engagements, POST /milestones, POST /sprints, POST /tickets, POST /time-entries, POST /change-requests, POST /releases, POST /invoices, POST /retainers, POST /support-incidents"

  - priority: 20
    category: business_constraint
    check: "Body is well-formed: required fields present, enums valid, numbers positive where required, dates ISO YYYY-MM-DD, hours in (0, 12], limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 25
    category: auth
    check: "When the acting role is ClientContact, X-User-ID must equal the client_id of the engagement/retainer/release/change-request being read or written"
    error_id: ERR_CLIENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints touching an Engagement, Release, ChangeRequest, RetainerContract or SupportIncident"

  - priority: 30
    category: state
    check: "expected_engagement_version equals the current Engagement.version"
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
    applies_to: "POST /change-requests, POST /invoices"

  - priority: 40
    category: state
    check: "The parent Engagement is in status ACTIVE"
    error_id: ERR_ENGAGEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /milestones, POST /sprints, POST /sprints/{id}/transition, POST /change-requests, POST /change-requests/{id}/submit, POST /releases, POST /releases/{id}/qa-result, POST /releases/{id}/acceptance, POST /retainers"

  - priority: 42
    category: state
    check: "For ticket creation the target Sprint must not be CLOSED (both PLANNED and ACTIVE sprints accept new tickets)"
    error_id: ERR_SPRINT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /tickets"

  - priority: 43
    category: state
    check: "For ticket transitions, time-entry creation and time-entry review, the Sprint that owns the ticket must have status == ACTIVE"
    error_id: ERR_SPRINT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /tickets/{id}/transition, POST /time-entries, POST /time-entries/{id}/review"

  - priority: 44
    category: state
    check: "The requested transition exists from the resource's current state (§1.2)"
    error_id: ERR_INVALID_TRANSITION
    http_status: 409
    applies_to: "POST /engagements/{id}/qualify, POST /engagements/{id}/sow, POST /engagements/{id}/sign, POST /engagements/{id}/close, POST /sprints/{id}/transition, POST /tickets/{id}/transition, POST /time-entries/{id}/review, POST /time-entries/{id}/reverse, POST /change-requests/{id}/submit, POST /change-requests/{id}/decision, POST /releases/{id}/qa-result, POST /releases/{id}/acceptance, POST /releases/{id}/deploy, POST /invoices/{id}/issue, POST /invoices/{id}/pay, POST /invoices/{id}/void, POST /support-incidents/{id}/respond, POST /support-incidents/{id}/resolve"

  - priority: 46
    category: state
    check: "Issuing a MILESTONE invoice requires the referenced Milestone.status == COMPLETED"
    error_id: ERR_MILESTONE_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /invoices/{id}/issue"

  - priority: 48
    category: state
    check: "Closing an Engagement requires that no Sprint of that engagement is in status ACTIVE"
    error_id: ERR_ENGAGEMENT_HAS_ACTIVE_SPRINT
    http_status: 409
    applies_to: "POST /engagements/{id}/close"

  - priority: 50
    category: business_safety
    check: "Segregation of duties: X-User-ID must differ from TimeEntry.employee_user_id when reviewing a time entry, and from Ticket.assignee_user_id when moving a ticket IN_QA -> DONE"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /time-entries/{id}/review, POST /tickets/{id}/transition"

  - priority: 55
    category: business_referential
    check: "The Engineer logging time must be the ticket's assignee (X-User-ID == Ticket.assignee_user_id)"
    error_id: ERR_NOT_TICKET_ASSIGNEE
    http_status: 422
    applies_to: "POST /time-entries"

  - priority: 56
    category: business_referential
    check: "blocking_ticket_id must not create a cycle in the blocker graph (self-reference or transitive loop reachable by following blocking_ticket_id links)"
    error_id: ERR_TICKET_CYCLE
    http_status: 422
    applies_to: "POST /tickets, POST /tickets/{id}/block"

  - priority: 57
    category: business_referential
    check: "A referenced milestone_id must belong to the same engagement_id as the sprint/release/invoice being created"
    error_id: ERR_MILESTONE_ENGAGEMENT_MISMATCH
    http_status: 422
    applies_to: "POST /sprints, POST /releases, POST /invoices"

  - priority: 60
    category: business_temporal
    check: "TimeEntry.work_date must fall inside the ticket's sprint half-open window: sprint.start_date <= work_date < sprint.end_date"
    error_id: ERR_WORK_DATE_OUT_OF_SPRINT
    http_status: 422
    applies_to: "POST /time-entries"

  - priority: 61
    category: business_temporal
    check: "A new Sprint must not overlap any existing Sprint of the same engagement with status IN {PLANNED, ACTIVE}. Intervals are HALF-OPEN [start_date, end_date): two sprints overlap iff new.start_date < old.end_date AND old.start_date < new.end_date. Exact adjacency (new.start_date == old.end_date) is allowed."
    error_id: ERR_SPRINT_OVERLAP
    http_status: 409
    applies_to: "POST /sprints"

  - priority: 62
    category: business_temporal
    check: "A new RetainerContract must not collide with any existing RetainerContract of the same client_id. Intervals are CLOSED [start_date, end_date] and carry a RETAINER_COOLDOWN_DAYS = 7 buffer on both sides: collision iff new.start_date <= old.end_date + 7 days AND old.start_date <= new.end_date + 7 days."
    error_id: ERR_RETAINER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /retainers"

  - priority: 63
    category: business_temporal
    check: "A SupportIncident may only be opened while the logical clock's date is inside the retainer's closed window: retainer.start_date <= today <= retainer.end_date"
    error_id: ERR_RETAINER_WINDOW_INACTIVE
    http_status: 422
    applies_to: "POST /support-incidents"

  - priority: 65
    category: business_constraint
    check: "The ticket's sprint must not have spend_frozen == true when moving a ticket to IN_PROGRESS"
    error_id: ERR_SPRINT_SPEND_FROZEN
    http_status: 409
    applies_to: "POST /tickets/{id}/transition"

  - priority: 66
    category: business_constraint
    check: "A ticket with a blocking_ticket_id may not enter IN_PROGRESS until the blocker's status == DONE"
    error_id: ERR_TICKET_BLOCKED
    http_status: 409
    applies_to: "POST /tickets/{id}/transition"

  - priority: 67
    category: business_constraint
    check: "A ChangeRequest may be sent back for revision at most MAX_CR_REVISION_ROUNDS = 2 times; the third REQUEST_REVISION is rejected"
    error_id: ERR_CR_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /change-requests/{id}/decision"

  - priority: 68
    category: business_constraint
    check: "Invoice kind must match the engagement's billing_model: MILESTONE requires billing_model == FIXED; TIME_AND_MATERIALS requires billing_model == TIME_AND_MATERIALS; RETAINER requires a retainer_id whose engagement_id matches"
    error_id: ERR_INVOICE_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /invoices"

  - priority: 69
    category: business_constraint
    check: "An invoice with zero computed lines cannot be issued (empty-set boundary)"
    error_id: ERR_INVOICE_NO_LINES
    http_status: 422
    applies_to: "POST /invoices/{id}/issue"

  - priority: 70
    category: business_constraint
    check: "At most one Invoice with status IN {DRAFT, ISSUED, PAID} may exist per milestone_id"
    error_id: ERR_DUPLICATE_MILESTONE_INVOICE
    http_status: 409
    applies_to: "POST /invoices"

  - priority: 75
    category: business_fiscal
    check: "Approving a billable TimeEntry must not push engagement.approved_hours + entry.hours above engagement.budget_hours_cap"
    error_id: ERR_BUDGET_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /time-entries/{id}/review"

  - priority: 76
    category: business_fiscal
    check: "The sum of hours already logged by this employee_user_id on this work_date (entries with status IN {SUBMITTED, APPROVED}) plus the new entry must not exceed DAILY_HOURS_CAP = 12"
    error_id: ERR_DAILY_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /time-entries"

  - priority: 77
    category: business_fiscal
    check: "The sum of Milestone.amount for an engagement must not exceed engagement.contract_value"
    error_id: ERR_MILESTONE_AMOUNT_EXCEEDS_CONTRACT
    http_status: 422
    applies_to: "POST /milestones"

  - priority: 78
    category: business_fiscal
    check: "paid_amount must equal invoice.total exactly"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /invoices/{id}/pay"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clients -------------------------------------------------------------
  - method: POST
    path: "/clients"
    description: "Register a client company"
    roles: [AccountManager, PlatformAdmin]
    code: 201
    input: ["name", "billing_email", "country_code"]
    output: Client
    side_effects: []

  - method: GET
    path: "/clients/{id}"
    description: "Read a client"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []

  # --- Engagements (lead -> SOW -> active) ---------------------------------
  - method: POST
    path: "/engagements"
    description: "Create a lead for a client; the engagement starts in status LEAD"
    roles: [AccountManager]
    code: 201
    input: ["client_id", "title", "source_channel"]
    output: Engagement
    side_effects: ["Engagement created with status=LEAD, billing_status=UNBILLED, budget_posture=HEALTHY, version=1"]

  - method: GET
    path: "/engagements/{id}"
    description: "Read an engagement including its computed burn ledger and version"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Engagement
    side_effects: []

  - method: GET
    path: "/engagements"
    description: "List engagements, filterable by client and status"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["client_id?", "status?", "billing_model?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []

  - method: POST
    path: "/engagements/{id}/qualify"
    description: "Qualify or disqualify a lead"
    roles: [AccountManager]
    code: 200
    input: ["outcome", "note?"]
    output: Engagement
    side_effects: ["status LEAD -> QUALIFIED or LEAD -> DISQUALIFIED", "increments Engagement.version by 1"]

  - method: POST
    path: "/engagements/{id}/sow"
    description: "Issue the SOW/estimate: pins billing model, contract value, hour cap and blended rate"
    roles: [AccountManager]
    code: 200
    input: ["billing_model", "contract_value", "budget_hours_cap", "standard_hourly_rate", "start_date", "end_date"]
    output: Engagement
    side_effects: ["status QUALIFIED -> SOW_ISSUED", "burn_ratio = 0.0, budget_posture = HEALTHY", "increments Engagement.version by 1"]

  - method: POST
    path: "/engagements/{id}/sign"
    description: "Client signs the SOW; the engagement becomes ACTIVE"
    roles: [ClientContact]
    code: 200
    input: ["signed_by_name"]
    output: Engagement
    side_effects: ["status SOW_ISSUED -> ACTIVE", "signed_at stamped from the logical clock", "increments Engagement.version by 1"]

  - method: POST
    path: "/engagements/{id}/close"
    description: "Close an active engagement"
    roles: [DeliveryLead]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status ACTIVE -> CLOSED", "TODO tickets under PLANNED sprints are CANCELLED", "increments Engagement.version by 1"]

  - method: GET
    path: "/engagements/{id}/burn-rate"
    description: "Computed read exposing BOTH burn variants side by side (approved_only and committed)"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: "{ engagement_id: string, approved_hours: number, burned_cost: number, burn_ratio: number, budget_posture: string, committed_hours: number, committed_burned_cost: number, committed_burn_ratio: number, contract_value: number, budget_hours_cap: number }"
    side_effects: []

  # --- Milestones -----------------------------------------------------------
  - method: POST
    path: "/milestones"
    description: "Add a billing milestone to an active engagement"
    roles: [DeliveryLead]
    code: 201
    input: ["engagement_id", "sequence", "title", "amount", "due_date"]
    output: Milestone
    side_effects: ["Milestone created with status=PLANNED"]

  - method: GET
    path: "/milestones/{id}"
    description: "Read a milestone"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Milestone
    side_effects: []

  - method: GET
    path: "/milestones"
    description: "List milestones, filterable by engagement"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "status?", "limit?", "offset?"]
    output: Milestone[]
    side_effects: []

  # --- Sprints --------------------------------------------------------------
  - method: POST
    path: "/sprints"
    description: "Create a sprint window on an active engagement (half-open [start_date, end_date))"
    roles: [DeliveryLead]
    code: 201
    input: ["engagement_id", "name", "start_date", "end_date", "milestone_id?"]
    output: Sprint
    side_effects: ["Sprint created with status=PLANNED, spend_frozen=false, committed_hours=0"]

  - method: GET
    path: "/sprints/{id}"
    description: "Read a sprint"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Sprint
    side_effects: []

  - method: GET
    path: "/sprints"
    description: "List sprints, filterable by engagement and milestone"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "milestone_id?", "status?", "limit?", "offset?"]
    output: Sprint[]
    side_effects: []

  - method: POST
    path: "/sprints/{id}/transition"
    description: "Activate or close a sprint"
    roles: [DeliveryLead]
    code: 200
    input: ["target_status"]
    output: Sprint
    side_effects: ["PLANNED -> ACTIVE (spend_frozen seeded from engagement.budget_posture)", "ACTIVE -> CLOSED (TODO tickets cancelled, committed_hours recomputed)"]

  # --- Tickets --------------------------------------------------------------
  - method: POST
    path: "/tickets"
    description: "Create a ticket inside a sprint; may declare a blocking ticket"
    roles: [DeliveryLead]
    code: 201
    input: ["sprint_id", "title", "estimated_hours", "assignee_user_id", "blocking_ticket_id?"]
    output: Ticket
    side_effects: ["Ticket created with status=TODO, actual_hours=0", "sprint.committed_hours recomputed"]

  - method: GET
    path: "/tickets/{id}"
    description: "Read a ticket"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: GET
    path: "/tickets"
    description: "List tickets, filterable by sprint, assignee and blocker"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["sprint_id?", "assignee_user_id?", "blocking_ticket_id?", "status?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []

  - method: POST
    path: "/tickets/{id}/transition"
    description: "Drive the ticket lifecycle (TODO / IN_PROGRESS / IN_QA / REWORK / DONE / CANCELLED). IN_QA -> DONE is subject to segregation of duties."
    roles: [Engineer, DeliveryLead]
    code: 200
    input: ["target_status", "note?"]
    output: Ticket
    side_effects: ["state transition per §1.2", "rework_rounds / variance_ratio / sprint.committed_hours recomputed as applicable"]

  - method: POST
    path: "/tickets/{id}/block"
    description: "Set or replace the ticket's blocking ticket; rejected when it would create a cycle in the blocker graph"
    roles: [DeliveryLead]
    code: 200
    input: ["blocking_ticket_id"]
    output: Ticket
    side_effects: ["ticket.blocking_ticket_id updated after the cycle check (self-reference or transitive loop -> ERR_TICKET_CYCLE)"]

  # --- Time tracking --------------------------------------------------------
  - method: POST
    path: "/time-entries"
    description: "Log time against a ticket; only the ticket's assignee may log"
    roles: [Engineer]
    code: 201
    input: ["ticket_id", "work_date", "hours", "billable?", "note?"]
    output: TimeEntry
    side_effects: ["TimeEntry created with status=SUBMITTED, employee_user_id = X-User-ID", "no ledger change until approval"]

  - method: GET
    path: "/time-entries/{id}"
    description: "Read a time entry"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: TimeEntry
    side_effects: []

  - method: GET
    path: "/time-entries"
    description: "List time entries, filterable by ticket, employee and status"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["ticket_id?", "employee_user_id?", "status?", "limit?", "offset?"]
    output: TimeEntry[]
    side_effects: []

  - method: POST
    path: "/time-entries/{id}/review"
    description: "Approve or reject a submitted time entry (a DeliveryLead may not review their own entry)"
    roles: [DeliveryLead]
    code: 200
    input: ["decision", "note?"]
    output: TimeEntry
    side_effects: ["APPROVE: 5-link cascade — entry APPROVED -> ticket.actual_hours -> engagement burn ledger -> budget_posture -> Sprint.spend_frozen", "increments Engagement.version by 1 on APPROVE"]

  - method: POST
    path: "/time-entries/{id}/reverse"
    description: "Reverse a previously approved time entry (compensating action)"
    roles: [DeliveryLead]
    code: 200
    input: ["reason"]
    output: TimeEntry
    side_effects: ["exact inverse of the approval cascade; hours_ledger_invariant restored", "increments Engagement.version by 1"]

  # --- Change requests ------------------------------------------------------
  - method: POST
    path: "/change-requests"
    description: "Open a scope change request against an active engagement (OCC on the engagement's version)"
    roles: [DeliveryLead]
    code: 201
    input: ["engagement_id", "title", "delta_hours", "rush", "expected_engagement_version"]
    output: ChangeRequest
    side_effects: ["ChangeRequest created with status=DRAFT, revision_rounds=0, quoted_amount=0", "increments Engagement.version by 1"]

  - method: GET
    path: "/change-requests/{id}"
    description: "Read a change request"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: []

  - method: GET
    path: "/change-requests"
    description: "List change requests, filterable by engagement and status"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "status?", "limit?", "offset?"]
    output: ChangeRequest[]
    side_effects: []

  - method: POST
    path: "/change-requests/{id}/submit"
    description: "Send (or re-send after a revision) the change request to the client; re-quotes it"
    roles: [DeliveryLead]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: ["DRAFT|REVISION_REQUESTED -> SUBMITTED", "quoted_amount recomputed per calculations.change_request_quote"]

  - method: POST
    path: "/change-requests/{id}/decision"
    description: "Client approves, rejects, or requests a revision (negotiation round)"
    roles: [ClientContact]
    code: 200
    input: ["action", "note?"]
    output: ChangeRequest
    side_effects: ["APPROVE: 4-link cascade — CR APPROVED -> engagement.contract_value/budget_hours_cap -> burn_ratio -> budget_posture -> sprint unfreeze; increments Engagement.version by 1", "REQUEST_REVISION: revision_rounds += 1"]

  # --- Releases (staging/QA, acceptance, deployment) ------------------------
  - method: POST
    path: "/releases"
    description: "Cut a staging build for a milestone"
    roles: [Engineer]
    code: 201
    input: ["engagement_id", "milestone_id", "version_label"]
    output: Release
    side_effects: ["Release created with status=BUILDING, qa_rounds=0, defect_count=0"]

  - method: GET
    path: "/releases/{id}"
    description: "Read a release"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Release
    side_effects: []

  - method: GET
    path: "/releases"
    description: "List releases, filterable by engagement and milestone"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "milestone_id?", "status?", "limit?", "offset?"]
    output: Release[]
    side_effects: []

  - method: POST
    path: "/releases/{id}/qa-result"
    description: "Record a staging QA result (PASS requires defect_count == 0)"
    roles: [Engineer]
    code: 200
    input: ["outcome", "defect_count"]
    output: Release
    side_effects: ["BUILDING|REWORK -> QA_PASSED on PASS; BUILDING -> REWORK on FAIL", "qa_rounds += 1"]

  - method: POST
    path: "/releases/{id}/acceptance"
    description: "Client accepts or rejects a QA-passed release"
    roles: [ClientContact]
    code: 200
    input: ["action", "note?"]
    output: Release
    side_effects: ["ACCEPT: 3-link cascade — release ACCEPTED -> milestone COMPLETED -> (FIXED engagements only) DRAFT MILESTONE Invoice auto-created", "REJECT: QA_PASSED -> REWORK"]

  - method: POST
    path: "/releases/{id}/deploy"
    description: "Deploy an accepted release to an environment"
    roles: [Engineer]
    code: 200
    input: ["environment"]
    output: Release
    side_effects: ["ACCEPTED -> DEPLOYED", "release.environment recorded"]

  # --- Invoices -------------------------------------------------------------
  - method: POST
    path: "/invoices"
    description: "Create a DRAFT invoice (MILESTONE / TIME_AND_MATERIALS / RETAINER); lines and totals are computed server-side. OCC on the engagement's version."
    roles: [FinanceOfficer]
    code: 201
    input: ["engagement_id", "kind", "expected_engagement_version", "milestone_id?", "retainer_id?", "period_start?", "period_end?"]
    output: Invoice
    side_effects: ["Invoice created with status=DRAFT and computed lines/subtotal/tax/total", "increments Engagement.version by 1"]

  - method: GET
    path: "/invoices/{id}"
    description: "Read an invoice including its computed lines"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List invoices, filterable by engagement, milestone and retainer (this is how cascade-created invoices are discovered)"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "milestone_id?", "retainer_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue a draft invoice to the client"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["DRAFT -> ISSUED", "MILESTONE kind: milestone COMPLETED -> BILLED", "engagement.invoiced_amount and billing_status recomputed", "increments Engagement.version by 1"]

  - method: POST
    path: "/invoices/{id}/pay"
    description: "Record full payment of an issued invoice"
    roles: [FinanceOfficer]
    code: 200
    input: ["paid_amount"]
    output: Invoice
    side_effects: ["ISSUED -> PAID", "paid_at stamped"]

  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an invoice (compensating action; restores the money ledger)"
    roles: [FinanceOfficer]
    code: 200
    input: ["reason"]
    output: Invoice
    side_effects: ["ISSUED|DRAFT -> VOID", "MILESTONE kind: milestone BILLED -> COMPLETED", "engagement.invoiced_amount and billing_status recomputed", "increments Engagement.version by 1"]

  # --- Maintenance retainer & support SLA -----------------------------------
  - method: POST
    path: "/retainers"
    description: "Open a maintenance retainer for a client against an active engagement"
    roles: [AccountManager]
    code: 201
    input: ["client_id", "engagement_id", "start_date", "end_date", "monthly_fee", "included_hours", "sla_tier"]
    output: RetainerContract
    side_effects: ["RetainerContract created (closed [start_date, end_date] window with a 7-day cooldown buffer against sibling retainers of the same client)"]

  - method: GET
    path: "/retainers/{id}"
    description: "Read a retainer"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: RetainerContract
    side_effects: []

  - method: GET
    path: "/retainers"
    description: "List retainers, filterable by client and engagement"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["client_id?", "engagement_id?", "sla_tier?", "limit?", "offset?"]
    output: RetainerContract[]
    side_effects: []

  - method: POST
    path: "/support-incidents"
    description: "Client raises a support incident under a retainer; opened_at is stamped from the logical clock"
    roles: [ClientContact]
    code: 201
    input: ["retainer_id", "severity", "summary"]
    output: SupportIncident
    side_effects: ["SupportIncident created with status=OPEN, opened_at = current logical clock"]

  - method: GET
    path: "/support-incidents/{id}"
    description: "Read a support incident with its SLA clock fields"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: SupportIncident
    side_effects: []

  - method: GET
    path: "/support-incidents"
    description: "List support incidents, filterable by retainer, status and severity"
    roles: [AccountManager, DeliveryLead, Engineer, ClientContact, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["retainer_id?", "status?", "severity?", "limit?", "offset?"]
    output: SupportIncident[]
    side_effects: []

  - method: POST
    path: "/support-incidents/{id}/respond"
    description: "First engineer response; computes response_minutes with the severity-selected SLA clock"
    roles: [Engineer]
    code: 200
    input: ["note?"]
    output: SupportIncident
    side_effects: ["OPEN -> RESPONDED", "response_minutes and sla_response_breached computed"]

  - method: POST
    path: "/support-incidents/{id}/resolve"
    description: "Resolve the incident; computes resolution_minutes and the SLA credit"
    roles: [Engineer]
    code: 200
    input: ["resolution_note"]
    output: SupportIncident
    side_effects: ["RESPONDED -> RESOLVED", "resolution_minutes, sla_resolution_breached and sla_credit_amount computed"]

  # --- Test-driving endpoint ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-05-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. Every opened_at / responded_at / resolved_at / signed_at / issued_at / accepted_at stamp is read from this clock."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["logical clock repositioned; no entity is mutated"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's §1.5 roles"
  - id: ERR_CLIENT_SCOPE_VIOLATION
    http: 403
    condition: "A ClientContact acts on a resource whose owning engagement/retainer belongs to a different client_id than X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, non-positive amount/hours, malformed date, hours outside (0,12], or pagination out of range"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "client_id does not resolve"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "engagement_id does not resolve"
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "milestone_id does not resolve"
  - id: ERR_SPRINT_NOT_FOUND
    http: 404
    condition: "sprint_id does not resolve"
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "ticket_id or blocking_ticket_id does not resolve"
  - id: ERR_TIME_ENTRY_NOT_FOUND
    http: 404
    condition: "time entry id does not resolve"
  - id: ERR_CHANGE_REQUEST_NOT_FOUND
    http: 404
    condition: "change request id does not resolve"
  - id: ERR_RELEASE_NOT_FOUND
    http: 404
    condition: "release id does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice id does not resolve"
  - id: ERR_RETAINER_NOT_FOUND
    http: 404
    condition: "retainer_id does not resolve"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "support incident id does not resolve"
  - id: ERR_STALE_ENGAGEMENT_VERSION
    http: 412
    condition: "expected_engagement_version does not equal the engagement's current version (OCC)"
  - id: ERR_ENGAGEMENT_NOT_ACTIVE
    http: 409
    condition: "An operation requiring an ACTIVE engagement is attempted while the engagement is in any other status"
  - id: ERR_SPRINT_NOT_ACTIVE
    http: 409
    condition: "An operation requiring an ACTIVE sprint is attempted while the sprint is PLANNED or CLOSED"
  - id: ERR_INVALID_TRANSITION
    http: 409
    condition: "The requested transition does not exist from the resource's current state"
  - id: ERR_MILESTONE_NOT_COMPLETED
    http: 409
    condition: "Issuing a MILESTONE invoice whose milestone is not COMPLETED"
  - id: ERR_ENGAGEMENT_HAS_ACTIVE_SPRINT
    http: 409
    condition: "Closing an engagement that still has an ACTIVE sprint"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The acting user reviews their own time entry, or signs off (IN_QA -> DONE) a ticket they are assigned to"
  - id: ERR_NOT_TICKET_ASSIGNEE
    http: 422
    condition: "An Engineer logs time on a ticket assigned to someone else"
  - id: ERR_TICKET_CYCLE
    http: 422
    condition: "blocking_ticket_id would create a self-reference or a transitive cycle in the blocker graph"
  - id: ERR_MILESTONE_ENGAGEMENT_MISMATCH
    http: 422
    condition: "A referenced milestone belongs to a different engagement than the sprint/release/invoice being created"
  - id: ERR_WORK_DATE_OUT_OF_SPRINT
    http: 422
    condition: "work_date is outside the sprint's half-open [start_date, end_date) window"
  - id: ERR_SPRINT_OVERLAP
    http: 409
    condition: "A new sprint's half-open window overlaps an existing PLANNED/ACTIVE sprint of the same engagement (exact adjacency is allowed)"
  - id: ERR_RETAINER_WINDOW_CONFLICT
    http: 409
    condition: "A new retainer's closed window (plus the 7-day cooldown buffer) collides with an existing retainer of the same client"
  - id: ERR_RETAINER_WINDOW_INACTIVE
    http: 422
    condition: "A support incident is opened while the logical clock is outside the retainer's closed coverage window"
  - id: ERR_SPRINT_SPEND_FROZEN
    http: 409
    condition: "A ticket is moved to IN_PROGRESS while its sprint is spend-frozen by the engagement's AT_RISK/OVERBURNED posture"
  - id: ERR_TICKET_BLOCKED
    http: 409
    condition: "A ticket is moved to IN_PROGRESS while its blocking ticket is not DONE"
  - id: ERR_CR_ROUND_LIMIT
    http: 409
    condition: "A third REQUEST_REVISION decision is taken on the same change request"
  - id: ERR_INVOICE_KIND_MISMATCH
    http: 422
    condition: "Invoice kind is incompatible with the engagement's billing_model, or the required milestone_id/retainer_id/period is absent for the kind"
  - id: ERR_INVOICE_NO_LINES
    http: 422
    condition: "An invoice with zero computed lines is issued"
  - id: ERR_DUPLICATE_MILESTONE_INVOICE
    http: 409
    condition: "A second non-void invoice is created for a milestone that already has one in DRAFT/ISSUED/PAID"
  - id: ERR_BUDGET_HOURS_EXCEEDED
    http: 422
    condition: "Approving a billable time entry would push approved_hours above budget_hours_cap"
  - id: ERR_DAILY_HOURS_EXCEEDED
    http: 422
    condition: "An employee's SUBMITTED+APPROVED hours for a single work_date would exceed 12"
  - id: ERR_MILESTONE_AMOUNT_EXCEEDS_CONTRACT
    http: 422
    condition: "The sum of milestone amounts would exceed the engagement's contract_value"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "paid_amount does not equal invoice.total"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AccountManager
    description: "Owns the commercial funnel: clients, leads, SOW/estimates, retainers"
    identity: opaque
    exclusive_operations:
      - "POST /clients"
      - "POST /engagements"
      - "POST /engagements/{id}/qualify"
      - "POST /engagements/{id}/sow"
      - "POST /retainers"
    shared_operations: ["all GET endpoints"]

  - name: DeliveryLead
    description: "Project manager: plans milestones/sprints/tickets, reviews time, opens change requests, closes the engagement"
    identity: opaque
    exclusive_operations:
      - "POST /milestones"
      - "POST /sprints"
      - "POST /sprints/{id}/transition"
      - "POST /tickets"
      - "POST /tickets/{id}/block"
      - "POST /time-entries/{id}/review"
      - "POST /time-entries/{id}/reverse"
      - "POST /change-requests"
      - "POST /change-requests/{id}/submit"
      - "POST /engagements/{id}/close"
    shared_operations: ["POST /tickets/{id}/transition", "all GET endpoints"]

  - name: Engineer
    description: "Builds: works tickets, logs time, cuts releases, runs staging QA, deploys, handles support incidents"
    identity: opaque
    exclusive_operations:
      - "POST /time-entries"
      - "POST /releases"
      - "POST /releases/{id}/qa-result"
      - "POST /releases/{id}/deploy"
      - "POST /support-incidents/{id}/respond"
      - "POST /support-incidents/{id}/resolve"
    shared_operations: ["POST /tickets/{id}/transition", "all GET endpoints"]

  - name: ClientContact
    description: "The client side: signs the SOW, decides change requests, accepts releases, raises support incidents"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /engagements/{id}/sign"
      - "POST /change-requests/{id}/decision"
      - "POST /releases/{id}/acceptance"
      - "POST /support-incidents"
    shared_operations: ["all GET endpoints (restricted to their own client's resources by ERR_CLIENT_SCOPE_VIOLATION)"]

  - name: FinanceOfficer
    description: "Billing: creates, issues, pays and voids invoices"
    identity: opaque
    exclusive_operations:
      - "POST /invoices"
      - "POST /invoices/{id}/issue"
      - "POST /invoices/{id}/pay"
      - "POST /invoices/{id}/void"
    shared_operations: ["all GET endpoints"]

  - name: PlatformAdmin
    description: "Operator: manages the logical clock and can register clients"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: ["POST /clients", "all GET endpoints"]

segregation_of_duties:
  description: |
    The SoD constraint of this role model (enforced by ERR_SEGREGATION_OF_DUTIES, §1.4 priority 50):
    (1) the DeliveryLead who reviews a TimeEntry MUST NOT be its employee_user_id;
    (2) the actor who moves a Ticket IN_QA -> DONE MUST NOT be its assignee_user_id.
    Both comparisons are made against the opaque X-User-ID header.
