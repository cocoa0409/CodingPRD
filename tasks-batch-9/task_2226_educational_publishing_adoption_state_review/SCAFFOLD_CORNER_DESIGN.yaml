          setup:
            - "State PA demands WCAG_2_2_AA accessibility, ONEROSTER_1_2 rostering and a signed privacy addendum, with min_verified_coverage_pct 50.00"
            - "Title PA-M-6 has a FILED submission and three bundles: b-access conforms only to WCAG_2_1_AA, b-privacy has privacy_addendum_signed false, and b-roster uses ONEROSTER_1_1"
