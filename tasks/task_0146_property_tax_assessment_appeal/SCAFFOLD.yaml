# =============================================================================
# Property Tax Assessment & Appeal — SCAFFOLD (§1.0–§1.7)
# =============================================================================

scenario: |
  Property Tax Assessment & Appeal: assessed value, exemptions
  (Homestead/Senior/Veteran/Disability), Mill Rate, annual growth cap
  (Prop 13 style), Board of Equalization hearing, repayment deferral.

domain_name: property-tax-assessment-appeal
api_prefix: /properties

# -----------------------------------------------------------------------------
# Step 0: Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - version_pinning_on_approval

  entity_topology: hybrid
  # Property is the natural parent; Appeal, TaxBill, DeferralPlan, Payment are
  # nested under Property. ExemptionApplication links Owner ↔ Property as a
  # cross-cutting association (peer-style).

  state_machine_shape: branching
  # Appeal has branching outcomes (UPHELD/REDUCED/INCREASED/WITHDRAWN);
  # Assessment cycles between ISSUED ↔ UNDER_APPEAL; TaxBill has parallel
  # payment dimensions; ExemptionApplication has revoke cycle.

  relationship_patterns:
    - one_to_many        # Property → Assessment, Appeal, TaxBill, DeferralPlan, Payment
    - cross_aggregate    # ExemptionApplication: Owner ↔ Property
    - self_referential   # Assessment.prior_assessment_id points to previous year's Assessment

  role_model: segregation_of_duties
  # Owner files appeals/exemptions; Assessor issues assessments;
  # HearingOfficer (BoE) decides appeals (cannot also be the Assessor);
  # Treasurer issues bills and approves deferral plans.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name of the property owner" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; used for SENIOR exemption eligibility" }
      - { name: veteran_status, type: boolean, source: input, default: false, description: "Whether owner is a recognized veteran (VETERAN exemption eligibility)" }
      - { name: disability_rating, type: integer, source: input, default: 0, description: "Disability percentage 0..100; DISABILITY exemption requires >= 50" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK to Owner.id — current legal owner of record" }
      - { name: parcel_number, type: string, source: input, description: "Unique parcel identifier; immutable; tax-jurisdiction unique key" }
      - { name: market_value, type: number, source: input, description: "Current fair-market value in dollars; updated by Assessor" }
      - { name: capped_value, type: number, source: computed, description: "Current capped assessed value after Prop-13-style growth cap; equals market_value on reset" }
      - { name: ownership_change_date, type: datetime, source: system, description: "Timestamp of most recent owner transfer; resets cap basis" }
      - { name: current_assessment_year, type: integer, source: system, description: "Last roll year the Property has an ISSUED or FINALIZED Assessment for" }

  - name: Assessment
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK to Property.id" }
      - { name: roll_year, type: integer, source: input, description: "Tax roll year, e.g. 2026; unique per property" }
      - { name: prior_assessment_id, type: string, source: system, description: "Self-referential FK to previous year's Assessment.id (null on first roll)" }
      - { name: prior_capped_value, type: number, source: computed, description: "capped_value of the prior_assessment_id, or 0 if first roll" }
      - { name: market_value_at_roll, type: number, source: input, description: "Market value snapshot for this roll year" }
      - { name: capped_value, type: number, source: computed, description: "min(market_value_at_roll, prior_capped_value*(1+GROWTH_CAP)) unless ownership reset triggers" }
      - { name: cap_reset_applied, type: boolean, source: computed, description: "True when ownership_change_date falls inside the roll year and capped_value == market_value_at_roll" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | UNDER_APPEAL | FINALIZED", constraints: "set {DRAFT, ISSUED, UNDER_APPEAL, FINALIZED}" }
      - { name: issued_at, type: datetime, source: system, description: "Timestamp when transitioned DRAFT→ISSUED" }
      - { name: finalized_at, type: datetime, source: system, description: "Timestamp when transitioned to FINALIZED" }
      - { name: appeal_window_closes_at, type: datetime, source: computed, description: "issued_at + APPEAL_WINDOW_DAYS; after this, no new Appeal accepted" }

  - name: ExemptionApplication
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK to Property.id" }
      - { name: owner_id, type: string, source: system, description: "FK to Owner.id — must be the Property's current owner_id at filing time" }
      - { name: exemption_type, type: enum, source: input, description: "HOMESTEAD | SENIOR | VETERAN | DISABILITY", constraints: "set {HOMESTEAD, SENIOR, VETERAN, DISABILITY}" }
      - { name: effective_roll_year, type: integer, source: input, description: "Roll year this exemption applies to" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | REVOKED", constraints: "set {SUBMITTED, APPROVED, DENIED, REVOKED}" }
      - { name: approved_amount, type: number, source: computed, description: "Dollar exemption value, populated on APPROVED per exemption_type formula" }
      - { name: approved_at, type: datetime, source: system, description: "Timestamp when APPROVED" }
      - { name: revoked_reason, type: enum, source: input, description: "OWNERSHIP_CHANGE | INELIGIBLE | WITHDRAWN; null if not REVOKED", constraints: "set {OWNERSHIP_CHANGE, INELIGIBLE, WITHDRAWN}" }

  - name: Appeal
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK to Property.id" }
      - { name: assessment_id, type: string, source: input, description: "FK to Assessment.id being appealed; must be ISSUED" }
      - { name: assessment_version, type: integer, source: system, description: "Version of the Assessment captured when appeal was FILED (version pinning)" }
      - { name: owner_id, type: string, source: system, description: "FK to Owner.id of the appellant" }
      - { name: filed_grounds, type: enum, source: input, description: "OVER_MARKET | EXEMPTION_DENIED | CAP_MISAPPLIED | CLERICAL_ERROR", constraints: "set {OVER_MARKET, EXEMPTION_DENIED, CAP_MISAPPLIED, CLERICAL_ERROR}" }
      - { name: claimed_value, type: number, source: input, description: "Owner's claimed assessed value in dollars" }
      - { name: status, type: enum, source: system, description: "FILED | SCHEDULED | HEARD | DECIDED | WITHDRAWN", constraints: "set {FILED, SCHEDULED, HEARD, DECIDED, WITHDRAWN}" }
      - { name: decision_outcome, type: enum, source: system, description: "UPHELD | REDUCED | INCREASED; null until DECIDED", constraints: "set {UPHELD, REDUCED, INCREASED}" }
      - { name: decided_value, type: number, source: system, description: "Final capped_value selected by Board, set on DECIDED" }

  - name: Hearing
    parent: Appeal
    common_fields: true
    fields:
      - { name: appeal_id, type: string, source: system, description: "FK to Appeal.id (1:1 with the live SCHEDULED hearing)" }
      - { name: property_id, type: string, source: system, description: "FK to Property.id, denormalized for routing" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC start of hearing window" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 UTC end of hearing window; must be strictly after scheduled_start and within HEARING_MAX_DURATION_MIN" }
      - { name: hearing_room, type: enum, source: input, description: "ROOM_A | ROOM_B | ROOM_C — physical resource booked", constraints: "set {ROOM_A, ROOM_B, ROOM_C}" }
      - { name: officer_id, type: string, source: input, description: "FK to HearingOfficer.id — presiding officer" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONDUCTED | RESCHEDULED | CANCELLED", constraints: "set {SCHEDULED, CONDUCTED, RESCHEDULED, CANCELLED}" }

  - name: HearingOfficer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Board of Equalization officer name" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the officer can be assigned to new hearings" }

  - name: TaxBill
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK to Property.id" }
      - { name: assessment_id, type: string, source: system, description: "FK to the FINALIZED Assessment used to compute this bill" }
      - { name: roll_year, type: integer, source: system, description: "Mirrors Assessment.roll_year; unique per property" }
      - { name: taxable_value, type: number, source: computed, description: "capped_value − total_exemption_amount (floored at 0)" }
      - { name: total_exemption_amount, type: number, source: computed, description: "Sum of approved exemption amounts applied in priority order" }
      - { name: mill_rate, type: number, source: system, description: "Mill rate (per $1000 of taxable value) in effect for roll_year" }
      - { name: base_tax_amount, type: number, source: computed, description: "taxable_value * mill_rate / 1000, rounded per CALC precision rule" }
      - { name: amount_due, type: number, source: computed, description: "base_tax_amount − total_payments_applied + accrued_deferral_interest" }
      - { name: total_payments_applied, type: number, source: computed, description: "Sum of Payment.amount where Payment.status=APPLIED on this bill" }
      - { name: status, type: enum, source: system, description: "PENDING | ISSUED | PARTIALLY_PAID | PAID | IN_DEFERRAL | DELINQUENT", constraints: "set {PENDING, ISSUED, PARTIALLY_PAID, PAID, IN_DEFERRAL, DELINQUENT}" }
      - { name: due_date, type: datetime, source: system, description: "issued_at + DUE_WINDOW_DAYS; after this and unpaid → DELINQUENT" }
      - { name: issued_at, type: datetime, source: system, description: "When the bill transitioned PENDING→ISSUED" }

  - name: DeferralPlan
    parent: TaxBill
    common_fields: true
    fields:
      - { name: tax_bill_id, type: string, source: system, description: "FK to TaxBill.id (1:1 with the bill's active deferral)" }
      - { name: property_id, type: string, source: system, description: "FK to Property.id, denormalized" }
      - { name: principal_deferred, type: number, source: system, description: "Deferred amount captured at REQUESTED→ACTIVE; equals bill.amount_due at that moment" }
      - { name: annual_interest_rate, type: number, source: system, description: "Decimal rate in effect at ACTIVE; e.g. 0.05 for 5%/year, compounded daily" }
      - { name: accrued_interest, type: number, source: computed, description: "Compound interest accrued since started_at via deferral_interest_accrual calculation" }
      - { name: started_at, type: datetime, source: system, description: "Timestamp of REQUESTED→ACTIVE transition" }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp of ACTIVE→COMPLETED or ACTIVE→DEFAULTED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ACTIVE | COMPLETED | DEFAULTED", constraints: "set {REQUESTED, ACTIVE, COMPLETED, DEFAULTED}" }

  - name: Payment
    parent: TaxBill
    common_fields: false
    fields:
      - { name: tax_bill_id, type: string, source: system, description: "FK to TaxBill.id" }
      - { name: amount, type: number, source: input, description: "Payment amount in dollars; must be > 0" }
      - { name: applied_at, type: datetime, source: system, description: "Timestamp the payment was APPLIED (== created; payments are immutable)" }
      - { name: status, type: enum, source: system, description: "APPLIED | REFUNDED", constraints: "set {APPLIED, REFUNDED}" }
      - { name: refund_reason, type: enum, source: system, description: "APPEAL_REDUCED | OVERPAYMENT; null unless REFUNDED", constraints: "set {APPEAL_REDUCED, OVERPAYMENT}" }

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /properties/{property_id}/assessments/{assessment_id}/issue"
        actor: Assessor
        preconditions:
          - "Assessment.status == DRAFT"
          - "No other Assessment for same Property.roll_year is in {ISSUED, UNDER_APPEAL, FINALIZED} (ERR_DUPLICATE_ROLL_YEAR)"
        side_effects:
          - "Assessment.status = ISSUED; issued_at = now"
          - "Assessment.appeal_window_closes_at = issued_at + APPEAL_WINDOW_DAYS"
          - "Property.current_assessment_year = roll_year"
          - "capped_value computed via capped_assessed_value calculation"

      - from: ISSUED
        to: UNDER_APPEAL
        trigger: "POST /properties/{property_id}/appeals (first Appeal filed on this Assessment)"
        actor: Owner
        preconditions:
          - "Now < appeal_window_closes_at (ERR_APPEAL_WINDOW_CLOSED)"
          - "Cross-entity: a new Appeal with assessment_id=Assessment.id and status=FILED is being created"
        side_effects:
          - "Assessment.status = UNDER_APPEAL"
          - "Appeal.assessment_version = Assessment.version captured at filing (version pinning)"

      - from: UNDER_APPEAL
        to: ISSUED
        trigger: "POST /properties/{property_id}/appeals/{appeal_id}/withdraw (when last open Appeal is withdrawn)"
        actor: Owner
        preconditions:
          - "Appeal.status moves FILED|SCHEDULED|HEARD → WITHDRAWN"
          - "No other Appeal on this Assessment remains in {FILED, SCHEDULED, HEARD}"
        side_effects:
          - "Assessment.status reverts to ISSUED"
          - "Appeal-cycle revert: Assessment becomes appeal-eligible again until appeal_window_closes_at"

      - from: UNDER_APPEAL
        to: FINALIZED
        trigger: "POST /properties/{property_id}/appeals/{appeal_id}/decide (last open Appeal DECIDED)"
        actor: HearingOfficer
        preconditions:
          - "Appeal moves HEARD → DECIDED with decision_outcome in {UPHELD, REDUCED, INCREASED}"
          - "No other Appeal on this Assessment remains in {FILED, SCHEDULED, HEARD}"
        side_effects:
          - "Assessment.status = FINALIZED; finalized_at = now"
          - "Assessment.capped_value = decided_value (if REDUCED or INCREASED) — recompute_assessed_on_decision calculation"
          - "Cascade: TaxBill for (property_id, roll_year) recomputed via tax_bill_computation; if already ISSUED, refund/credit logic via appeal_bill_reconciliation"

      - from: ISSUED
        to: FINALIZED
        trigger: "POST /_clock/advance (system) — now >= appeal_window_closes_at and no Appeal filed"
        actor: system
        preconditions:
          - "now >= appeal_window_closes_at"
          - "No Appeal exists for assessment_id"
        side_effects:
          - "Assessment.status = FINALIZED; finalized_at = now"
          - "TaxBill auto-created in PENDING with computed taxable_value, base_tax_amount"

  - entity: ExemptionApplication
    initial_state: SUBMITTED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /properties/{property_id}/exemption_applications/{exemption_application_id}/approve"
        actor: Assessor
        preconditions:
          - "Eligibility per exemption_type (SENIOR: Owner age >= SENIOR_AGE on Jan 1 of effective_roll_year; VETERAN: Owner.veteran_status == true; DISABILITY: Owner.disability_rating >= DISABILITY_MIN_PCT)"
          - "Owner.id of application equals Property.owner_id at approval moment (ERR_OWNERSHIP_MISMATCH)"
          - "No other APPROVED ExemptionApplication of same exemption_type for same (property_id, effective_roll_year) (ERR_EXEMPTION_DUPLICATE)"
        side_effects:
          - "status = APPROVED; approved_at = now"
          - "approved_amount computed by exemption_stack calculation"
          - "Cascade: any TaxBill for (property_id, roll_year=effective_roll_year) in {PENDING, ISSUED, PARTIALLY_PAID} recomputed via tax_bill_computation"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /properties/{property_id}/exemption_applications/{exemption_application_id}/deny"
        actor: Assessor
        preconditions: []
        side_effects:
          - "status = DENIED"

      - from: APPROVED
        to: REVOKED
        trigger: "POST /properties/{property_id}/exemption_applications/{exemption_application_id}/revoke"
        actor: Assessor
        preconditions:
          - "revoked_reason provided"
        side_effects:
          - "status = REVOKED; approved_amount no longer counts toward exemption_stack"
          - "Cascade: TaxBill for (property_id, effective_roll_year) recomputed; if newly underpaid → status = PARTIALLY_PAID and amount_due grows"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [DECIDED, WITHDRAWN]
    transitions:
      - from: FILED
        to: SCHEDULED
        trigger: "POST /properties/{property_id}/appeals/{appeal_id}/schedule"
        actor: Treasurer
        preconditions:
          - "Hearing entity is created in same request (scheduled_start, scheduled_end, hearing_room, officer_id)"
          - "scheduled_end strictly > scheduled_start"
          - "Hearing.officer_id refers to active HearingOfficer"
          - "Hearing.officer_id != Assessor.id (segregation_of_duties: ERR_BOE_OFFICER_CONFLICT) — represented as 'the officer must not be the user who issued the underlying Assessment'"
          - "Room/officer overlap rules: no other Hearing in {SCHEDULED} for same hearing_room with [scheduled_start, scheduled_end) overlap (ERR_ROOM_DOUBLE_BOOKED); no Hearing in {SCHEDULED} for same officer_id with intervals separated by less than OFFICER_BUFFER_MIN minutes (ERR_OFFICER_BUFFER_VIOLATED)"
        side_effects:
          - "Appeal.status = SCHEDULED; Hearing.status = SCHEDULED"

      - from: SCHEDULED
        to: HEARD
        trigger: "POST /properties/{property_id}/appeals/{appeal_id}/conduct"
        actor: HearingOfficer
        preconditions:
          - "now >= Hearing.scheduled_start"
          - "now < Hearing.scheduled_end + GRACE_MIN"
        side_effects:
          - "Appeal.status = HEARD; Hearing.status = CONDUCTED"

      - from: HEARD
        to: DECIDED
        trigger: "POST /properties/{property_id}/appeals/{appeal_id}/decide"
        actor: HearingOfficer
        preconditions:
          - "decision_outcome in {UPHELD, REDUCED, INCREASED}"
          - "If REDUCED: decided_value < Assessment.capped_value at time of FILED (ERR_DECISION_VALUE_INCONSISTENT)"
          - "If INCREASED: decided_value > Assessment.capped_value at time of FILED"
          - "If UPHELD: decided_value == Assessment.capped_value at time of FILED"
          - "Acting officer_id == Hearing.officer_id (ERR_OFFICER_MISMATCH)"
        side_effects:
          - "Appeal.status = DECIDED; decision_outcome set; decided_value set"
          - "Cascade (depth 3): Appeal DECIDED → Assessment.capped_value updated → TaxBill recomputed via appeal_bill_reconciliation → if Payment.amount > new amount_due, oldest APPLIED Payments REFUNDED (refund_reason=APPEAL_REDUCED) until total_payments_applied <= amount_due"
          - "If all sibling appeals on the Assessment are no longer in {FILED, SCHEDULED, HEARD}, Assessment auto-transitions UNDER_APPEAL → FINALIZED"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /properties/{property_id}/appeals/{appeal_id}/withdraw"
        actor: Owner
        preconditions: []
        side_effects:
          - "Appeal.status = WITHDRAWN"
          - "Check sibling appeals to potentially revert Assessment UNDER_APPEAL → ISSUED"

      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /properties/{property_id}/appeals/{appeal_id}/withdraw"
        actor: Owner
        preconditions: []
        side_effects:
          - "Appeal.status = WITHDRAWN; Hearing.status = CANCELLED"
          - "Check sibling appeals to potentially revert Assessment UNDER_APPEAL → ISSUED"

      - from: HEARD
        to: WITHDRAWN
        trigger: "POST /properties/{property_id}/appeals/{appeal_id}/withdraw"
        actor: Owner
        preconditions: []
        side_effects:
          - "Appeal.status = WITHDRAWN"
          - "Check sibling appeals to potentially revert Assessment UNDER_APPEAL → ISSUED"

  - entity: TaxBill
    initial_state: PENDING
    terminal_states: [PAID]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /properties/{property_id}/tax_bills/{tax_bill_id}/issue"
        actor: Treasurer
        preconditions:
          - "Linked Assessment.status == FINALIZED (cross-entity: ERR_ASSESSMENT_NOT_FINALIZED)"
          - "All ExemptionApplications for (property_id, roll_year) are in {APPROVED, DENIED, REVOKED} — none still SUBMITTED (ERR_EXEMPTIONS_PENDING)"
        side_effects:
          - "status = ISSUED; issued_at = now; due_date = now + DUE_WINDOW_DAYS"
          - "amount_due locked to base_tax_amount"

      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /properties/{property_id}/tax_bills/{tax_bill_id}/payments (amount < amount_due)"
        actor: Owner
        preconditions:
          - "amount > 0; amount <= amount_due (ERR_OVERPAYMENT)"
        side_effects:
          - "Payment created status=APPLIED"
          - "total_payments_applied += amount; amount_due decreases"

      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /properties/{property_id}/tax_bills/{tax_bill_id}/payments (amount < remaining amount_due)"
        actor: Owner
        preconditions:
          - "amount > 0; amount < amount_due"
        side_effects:
          - "Payment created status=APPLIED"
          - "total_payments_applied += amount"

      - from: ISSUED
        to: PAID
        trigger: "POST /properties/{property_id}/tax_bills/{tax_bill_id}/payments (amount == amount_due)"
        actor: Owner
        preconditions:
          - "amount == amount_due exactly"
        side_effects:
          - "Payment created status=APPLIED; status = PAID"

      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /properties/{property_id}/tax_bills/{tax_bill_id}/payments (amount == amount_due)"
        actor: Owner
        preconditions:
          - "amount == amount_due exactly"
        side_effects:
          - "status = PAID"

      - from: ISSUED
        to: IN_DEFERRAL
        trigger: "POST /properties/{property_id}/tax_bills/{tax_bill_id}/deferral_plans/{deferral_plan_id}/activate"
        actor: Treasurer
        preconditions:
          - "DeferralPlan.status moves REQUESTED → ACTIVE"
          - "Bill is ISSUED (not yet PARTIALLY_PAID/PAID/DELINQUENT)"
        side_effects:
          - "status = IN_DEFERRAL"
          - "DeferralPlan.principal_deferred captured = amount_due at activation"

      - from: PARTIALLY_PAID
        to: IN_DEFERRAL
        trigger: "POST /properties/{property_id}/tax_bills/{tax_bill_id}/deferral_plans/{deferral_plan_id}/activate"
        actor: Treasurer
        preconditions:
          - "DeferralPlan.status moves REQUESTED → ACTIVE"
        side_effects:
          - "status = IN_DEFERRAL"
          - "DeferralPlan.principal_deferred captured = remaining amount_due at activation"

      - from: IN_DEFERRAL
        to: PAID
        trigger: "POST /properties/{property_id}/tax_bills/{tax_bill_id}/payments (full payoff including accrued_interest)"
        actor: Owner
        preconditions:
          - "amount == DeferralPlan.principal_deferred + DeferralPlan.accrued_interest (at time of payment, computed via deferral_interest_accrual)"
        side_effects:
          - "status = PAID; DeferralPlan.status = COMPLETED; closed_at = now"

      - from: ISSUED
        to: DELINQUENT
        trigger: "POST /_clock/advance — now > due_date and no active DeferralPlan"
        actor: system
        preconditions:
          - "now > due_date"
          - "No DeferralPlan in status ACTIVE for this bill"
        side_effects:
          - "status = DELINQUENT"

      - from: PARTIALLY_PAID
        to: DELINQUENT
        trigger: "POST /_clock/advance — now > due_date and no active DeferralPlan"
        actor: system
        preconditions:
          - "now > due_date"
          - "No DeferralPlan in status ACTIVE for this bill"
        side_effects:
          - "status = DELINQUENT"

      - from: IN_DEFERRAL
        to: DELINQUENT
        trigger: "POST /_clock/advance — DeferralPlan defaults (now > started_at + DEFERRAL_MAX_TERM_DAYS)"
        actor: system
        preconditions:
          - "DeferralPlan.status transitions ACTIVE → DEFAULTED"
        side_effects:
          - "status = DELINQUENT; DeferralPlan.status = DEFAULTED; closed_at = now"

  - entity: DeferralPlan
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DEFAULTED]
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /properties/{property_id}/tax_bills/{tax_bill_id}/deferral_plans/{deferral_plan_id}/activate"
        actor: Treasurer
        preconditions:
          - "Linked TaxBill in {ISSUED, PARTIALLY_PAID} (cross-entity precondition)"
          - "Property.owner_id == Owner with hardship flag — modeled as eligibility check: Owner.disability_rating >= DEFERRAL_DISABILITY_MIN_PCT OR (date_of_birth implies age >= SENIOR_AGE) — ERR_DEFERRAL_NOT_ELIGIBLE"
          - "annual_interest_rate captured from system constant DEFERRAL_INTEREST_RATE"
        side_effects:
          - "status = ACTIVE; started_at = now"
          - "principal_deferred = TaxBill.amount_due at this moment"
          - "TaxBill state transitions to IN_DEFERRAL"

      - from: ACTIVE
        to: COMPLETED
        trigger: "Implicit on TaxBill transition IN_DEFERRAL → PAID"
        actor: system
        preconditions: []
        side_effects:
          - "status = COMPLETED; closed_at = now"

      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /_clock/advance — now > started_at + DEFERRAL_MAX_TERM_DAYS"
        actor: system
        preconditions:
          - "now > started_at + DEFERRAL_MAX_TERM_DAYS"
        side_effects:
          - "status = DEFAULTED; closed_at = now"
          - "TaxBill state transitions to DELINQUENT"

      - from: REQUESTED
        to: DEFAULTED
        trigger: "POST /properties/{property_id}/tax_bills/{tax_bill_id}/deferral_plans/{deferral_plan_id}/cancel"
        actor: Owner
        preconditions: []
        side_effects:
          - "status = DEFAULTED (treated as cancelled; bill remains in prior state)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Two Owners simultaneously file Appeal on same ISSUED Assessment after appeal_window has only seconds remaining"
    guarantee: "Both Appeals may file (multiple are permitted); only the first request to flip Assessment.status to UNDER_APPEAL succeeds atomically; later requests observe UNDER_APPEAL and append themselves"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    serialization: "First-writer-wins on Assessment.version when transitioning ISSUED→UNDER_APPEAL"

  - scenario: "Owner withdraws last Appeal while Treasurer simultaneously schedules another Appeal on the same Assessment"
    guarantee: "Exactly one of (withdraw causing UNDER_APPEAL→ISSUED revert) and (schedule that requires Assessment in UNDER_APPEAL) succeeds; the loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Assessment.status"

  - scenario: "Two requests attempt to schedule different Appeals for the same hearing_room with overlapping intervals"
    guarantee: "At most one Hearing in SCHEDULED per room with overlapping intervals; second is rejected"
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    serialization: "First-writer-wins on (hearing_room, [scheduled_start, scheduled_end)) overlap check"

  - scenario: "Two payments for the same TaxBill arrive concurrently and each individually equals the remaining amount_due"
    guarantee: "Exactly one Payment is APPLIED to fully pay the bill; the second is rejected as overpayment"
    error_id: ERR_OVERPAYMENT
    http_status: 409
    serialization: "First-writer-wins on TaxBill.version when computing amount_due"

  - scenario: "Owner activates a DeferralPlan while a Payment that would fully pay the bill is being applied"
    guarantee: "Exactly one succeeds; if Payment wins, bill becomes PAID and deferral activation is rejected as invalid state; if deferral wins, payment is rejected as overpayment against IN_DEFERRAL flow"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on TaxBill.version"

  - scenario: "Two Assessor requests attempt to APPROVE different ExemptionApplications of the same exemption_type for the same (property_id, effective_roll_year)"
    guarantee: "At most one APPROVED ExemptionApplication per (property_id, effective_roll_year, exemption_type)"
    error_id: ERR_EXEMPTION_DUPLICATE
    http_status: 409
    serialization: "First-writer-wins on the (property_id, effective_roll_year, exemption_type) uniqueness predicate"

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: capped_assessed_value
    trigger: "Assessment.DRAFT → ISSUED transition"
    algorithm: threshold
    formula: |
      # Inputs (named, no paraphrase):
      #   market_value_at_roll  (Assessment.market_value_at_roll)
      #   prior_capped_value    (Assessment.prior_capped_value; 0 if first roll)
      #   ownership_change_date (Property.ownership_change_date; nullable)
      #   roll_year             (Assessment.roll_year)
      #   ROLL_YEAR_START = datetime(roll_year, 1, 1, 0, 0, 0, UTC)
      #   ROLL_YEAR_END   = datetime(roll_year, 12, 31, 23, 59, 59, UTC)
      #
      # Step 1 — RESET DETECTION (variant A path):
      if prior_capped_value == 0
         OR (ownership_change_date is not null
             AND ROLL_YEAR_START <= ownership_change_date <= ROLL_YEAR_END):
          capped_value = market_value_at_roll
          cap_reset_applied = True
      # Step 2 — GROWTH CAP (variant B path):
      else:
          capped_ceiling = round_half_up(prior_capped_value * (1 + GROWTH_CAP), 2)
          capped_value   = min(market_value_at_roll, capped_ceiling)
          cap_reset_applied = False
      # Evaluation order is pinned: reset detection BEFORE growth-cap math.
    input_set: "All Assessments for the (property_id, roll_year) being issued; the immediate prior_assessment_id and the parent Property"
    constants:
      GROWTH_CAP: 0.02   # 2% annual growth cap (Prop-13 style)
    precision: "2 decimal places, round_half_up"
    variants:
      - name: growth_capped
        when: "prior_capped_value > 0 AND ownership_change_date NOT inside roll_year"
        difference: "capped_value = min(market_value_at_roll, prior_capped_value * 1.02); growth ceiling dominates whenever market grew >2%"
      - name: reset_to_market
        when: "first roll OR ownership_change_date is inside roll_year"
        difference: "capped_value = market_value_at_roll; growth cap is bypassed; cap_reset_applied=True"

  - name: exemption_stack
    trigger: "ExemptionApplication.SUBMITTED → APPROVED, or APPROVED → REVOKED (recompute remaining stack)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluate per (property_id, roll_year). Pinned evaluation order:
      #   1. Compute base = Assessment.capped_value
      #   2. Iterate APPROVED ExemptionApplications in fixed priority:
      #         HOMESTEAD, SENIOR, VETERAN, DISABILITY
      #   3. For each, compute its dollar amount against the residual base,
      #      append to the stack, then subtract from base. Each layer floors
      #      its residual at 0.
      #
      base = Assessment.capped_value
      total_exemption_amount = 0
      for exemption_type in ["HOMESTEAD", "SENIOR", "VETERAN", "DISABILITY"]:
          if no APPROVED ExemptionApplication of this type:
              continue
          if exemption_type == "HOMESTEAD":
              amt = round_half_up(min(HOMESTEAD_PCT * base, HOMESTEAD_CAP_DOLLARS), 2)
          elif exemption_type == "SENIOR":
              amt = SENIOR_FLAT
          elif exemption_type == "VETERAN":
              amt = VETERAN_FLAT
          elif exemption_type == "DISABILITY":
              # Conditional on rating tier:
              if Owner.disability_rating >= 70: amt = DISABILITY_FULL
              else:                              amt = round_half_up(0.50 * DISABILITY_FULL, 2)
          amt = min(amt, base)        # floor base at 0
          base -= amt
          total_exemption_amount += amt
          record approved_amount = amt on the ExemptionApplication
    input_set: "All ExemptionApplications with status=APPROVED for the (property_id, effective_roll_year=Assessment.roll_year). REVOKED and SUBMITTED are excluded."
    constants:
      HOMESTEAD_PCT: 0.20            # 20% of capped value
      HOMESTEAD_CAP_DOLLARS: 75000   # absolute cap
      SENIOR_FLAT: 25000
      VETERAN_FLAT: 15000
      DISABILITY_FULL: 30000
      DISABILITY_MIN_PCT: 50         # eligibility threshold for DISABILITY
      SENIOR_AGE: 65                 # eligibility threshold for SENIOR
    precision: "2 decimal places, round_half_up; per-layer rounding (not per-final-sum)"

  - name: tax_bill_computation
    trigger: "TaxBill creation; ExemptionApplication state change; Assessment FINALIZED with capped_value change"
    algorithm: tiered_pricing
    formula: |
      # Pinned evaluation order:
      #   1. capped_value             (from Assessment, already rounded to 2dp)
      #   2. total_exemption_amount   (from exemption_stack)
      #   3. taxable_value            = max(capped_value - total_exemption_amount, 0)
      #   4. base_tax_amount          = round_half_up(taxable_value * mill_rate / 1000, 2)
      #   5. amount_due               = base_tax_amount - total_payments_applied
      #                                                  + accrued_deferral_interest
      #
      # mill_rate is a per-roll_year jurisdictional constant pinned at TaxBill creation
      # and NOT updated by later mill_rate changes (version pinning at bill issuance).
      taxable_value          = max(round_half_up(capped_value - total_exemption_amount, 2), 0)
      base_tax_amount        = round_half_up(taxable_value * mill_rate / 1000.0, 2)
      total_payments_applied = sum(Payment.amount where status=APPLIED for this bill)
      amount_due             = max(round_half_up(base_tax_amount - total_payments_applied + accrued_deferral_interest, 2), 0)
    input_set: "Assessment in FINALIZED state for (property_id, roll_year); APPROVED ExemptionApplications for same roll_year; APPLIED Payments on this bill; ACTIVE DeferralPlan if any."
    constants:
      DEFAULT_MILL_RATE: 12.5   # default mill rate (12.5 per $1000) at bill creation
    precision: "2 decimal places, round_half_up. Rounding order pinned: subtract → round at taxable_value step; multiply → round at base_tax_amount step."

  - name: appeal_bill_reconciliation
    trigger: "Appeal.HEARD → DECIDED transition (decision_outcome in {REDUCED, INCREASED, UPHELD})"
    algorithm: forward_looking
    formula: |
      # Two variants — same inputs, different operational shape, different cash effects.
      # Variant A (refund_first):
      #   1. Recompute tax_bill_computation with Assessment.capped_value = decided_value
      #   2. new_amount_due_pre_payments = base_tax_amount(new)
      #   3. excess_paid = max(total_payments_applied - new_amount_due_pre_payments, 0)
      #   4. REFUND oldest APPLIED Payments in applied_at ASC, tie-break id ASC,
      #      flipping each to REFUNDED(reason=APPEAL_REDUCED) until cumulative
      #      refunded >= excess_paid (last refund may be partial — split a Payment
      #      into two rows: APPLIED remainder + REFUNDED chunk, both immutable).
      #   5. amount_due = max(new base_tax_amount - sum(APPLIED Payments), 0)
      #
      # Variant B (credit_carry):
      #   1. Recompute tax_bill_computation with new capped_value
      #   2. amount_due = base_tax_amount(new) - total_payments_applied
      #      (allowed to be negative → credit_balance held against the next roll_year's bill;
      #       no Payment refunds)
      #
      # Pinned choice: ALWAYS use Variant A (refund_first) for decision_outcome=REDUCED.
      # Variant B (credit_carry) is reserved for decision_outcome=INCREASED where new
      # amount_due > old — no refund, just amount_due grows.
    input_set: "The TaxBill for (property_id, roll_year=Assessment.roll_year); all APPLIED Payments on that bill; the Appeal.decided_value."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: refund_first
        when: "decision_outcome == REDUCED and total_payments_applied > new base_tax_amount"
        difference: "Excess payment is refunded to oldest Payments; amount_due may go to 0 with refunded delta. Net property-holder cash position: refund issued now."
      - name: credit_carry
        when: "decision_outcome == INCREASED"
        difference: "No payments refunded; amount_due simply increases; if it pushes status DELINQUENT after due_date, that cascades. Net cash position: owner owes more, no refund."

  - name: deferral_interest_accrual
    trigger: "Read on DeferralPlan; recompute on POST /_clock/advance"
    algorithm: chronological
    formula: |
      # Compound DAILY at annual_interest_rate; pinned chronological order.
      #
      #   days_elapsed = floor((now - started_at) / 1 day)
      #   daily_rate   = annual_interest_rate / 365.0
      #   accrued_interest = round_half_up(
      #       principal_deferred * ((1 + daily_rate) ** days_elapsed - 1),
      #       2
      #   )
      #
      # NOT continuous; rounding applied exactly once at the end.
      # If days_elapsed == 0, accrued_interest == 0.0 (boundary: same-day deferral).
    input_set: "DeferralPlan with status=ACTIVE; clock state. COMPLETED/DEFAULTED plans freeze accrued_interest at closed_at."
    constants:
      DEFERRAL_INTEREST_RATE: 0.05      # 5% annual default
      DEFERRAL_MAX_TERM_DAYS: 365       # default itself defaults after 1 year
      DEFERRAL_DISABILITY_MIN_PCT: 50
    precision: "2 decimal places, round_half_up — single rounding at the end of the compound formula"

  - name: appeal_window_check
    trigger: "POST /properties/{property_id}/appeals (create) and POST /_clock/advance"
    algorithm: threshold
    formula: |
      # Boundary precision: >= vs > matters.
      #   appeal_window_closes_at = Assessment.issued_at + APPEAL_WINDOW_DAYS
      #   Appeal acceptable iff: now < appeal_window_closes_at (STRICT <)
      #   Auto-finalize iff:     now >= appeal_window_closes_at (>=)
      # Exact equality goes to auto-finalize (no Appeal acceptance at the boundary).
    input_set: "Assessment.issued_at; current clock"
    constants:
      APPEAL_WINDOW_DAYS: 30
    precision: "instantaneous comparison; clock advance is monotonic"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID headers must be present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints (except /_clock/advance which still requires headers but accepts any role)"

  - priority: 2
    category: auth
    check: "Role must be one of {Assessor, HearingOfficer, Treasurer, Owner}; role must be permitted for the operation per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resource IDs must exist; FK fields in body (assessment_id, officer_id, exemption_type targets) must resolve. Validated strictly left-to-right; first missing wins."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or FK references"

  - priority: 4
    category: business_referential
    check: "For Owner-scoped writes, the X-User-ID must equal the Property.owner_id (e.g., Owner filing an Appeal or Payment for a property they don't own)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /properties/.../appeals, POST /properties/.../exemption_applications, POST /properties/.../tax_bills/.../payments, POST /properties/.../tax_bills/.../deferral_plans"

  - priority: 5
    category: state
    check: "Target resource must be in a state that permits this transition (per §1.2 state-machine)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_referential
    check: "Cross-entity preconditions: TaxBill issue requires Assessment.status==FINALIZED (ERR_ASSESSMENT_NOT_FINALIZED); DeferralPlan activate requires TaxBill in {ISSUED, PARTIALLY_PAID}"
    error_id: ERR_ASSESSMENT_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /properties/.../tax_bills/.../issue, POST /properties/.../tax_bills/.../deferral_plans/.../activate"

  - priority: 7
    category: business_temporal
    check: "Appeal creation: now < Assessment.appeal_window_closes_at (STRICT inequality). At exact equality, appeal is rejected."
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /properties/{property_id}/appeals"

  - priority: 8
    category: business_temporal
    check: "Hearing scheduling: scheduled_end strictly > scheduled_start; (scheduled_end - scheduled_start) <= HEARING_MAX_DURATION_MIN"
    error_id: ERR_HEARING_INTERVAL_INVALID
    http_status: 422
    applies_to: "POST /properties/{property_id}/appeals/{appeal_id}/schedule"

  - priority: 9
    category: business_constraint
    check: "Hearing room overlap: no other SCHEDULED Hearing in same hearing_room with [scheduled_start, scheduled_end) overlapping the requested interval (half-open intervals; instant-adjacent allowed)"
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /properties/{property_id}/appeals/{appeal_id}/schedule"

  - priority: 10
    category: business_constraint
    check: "Officer buffer: no other SCHEDULED Hearing for same officer_id where the gap to the new interval is < OFFICER_BUFFER_MIN minutes (rejects even non-overlapping but tightly packed bookings)"
    error_id: ERR_OFFICER_BUFFER_VIOLATED
    http_status: 409
    applies_to: "POST /properties/{property_id}/appeals/{appeal_id}/schedule"

  - priority: 11
    category: business_safety
    check: "Segregation of duties (BoE): Hearing.officer_id must not be the same user who issued the underlying Assessment (Assessor != HearingOfficer per appeal)"
    error_id: ERR_BOE_OFFICER_CONFLICT
    http_status: 403
    applies_to: "POST /properties/{property_id}/appeals/{appeal_id}/schedule"

  - priority: 12
    category: business_constraint
    check: "Exemption uniqueness: at most one APPROVED ExemptionApplication per (property_id, effective_roll_year, exemption_type)"
    error_id: ERR_EXEMPTION_DUPLICATE
    http_status: 409
    applies_to: "POST /properties/{property_id}/exemption_applications/{exemption_application_id}/approve"

  - priority: 13
    category: business_constraint
    check: "Exemption eligibility: SENIOR requires Owner.age (computed from date_of_birth) >= SENIOR_AGE on Jan 1 of effective_roll_year; VETERAN requires Owner.veteran_status; DISABILITY requires Owner.disability_rating >= DISABILITY_MIN_PCT; HOMESTEAD requires Owner == Property.owner_id"
    error_id: ERR_EXEMPTION_INELIGIBLE
    http_status: 422
    applies_to: "POST /properties/{property_id}/exemption_applications/{exemption_application_id}/approve"

  - priority: 14
    category: business_fiscal
    check: "Payment amount: amount > 0 AND amount <= current amount_due (zero or negative rejected; overpayment rejected)"
    error_id: ERR_OVERPAYMENT
    http_status: 409
    applies_to: "POST /properties/{property_id}/tax_bills/{tax_bill_id}/payments"

  - priority: 15
    category: business_fiscal
    check: "Bill duplicate: at most one TaxBill per (property_id, roll_year)"
    error_id: ERR_DUPLICATE_BILL
    http_status: 409
    applies_to: "POST /properties/{property_id}/tax_bills (and auto-creation at Assessment FINALIZED)"

  - priority: 16
    category: business_fiscal
    check: "Assessment duplicate: no other Assessment for same (property_id, roll_year) is in {ISSUED, UNDER_APPEAL, FINALIZED} at issue time"
    error_id: ERR_DUPLICATE_ROLL_YEAR
    http_status: 409
    applies_to: "POST /properties/{property_id}/assessments/{assessment_id}/issue"

  - priority: 17
    category: business_fiscal
    check: "Deferral eligibility: Owner must have hardship indicator (disability_rating >= DEFERRAL_DISABILITY_MIN_PCT OR age >= SENIOR_AGE)"
    error_id: ERR_DEFERRAL_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /properties/{property_id}/tax_bills/{tax_bill_id}/deferral_plans/{deferral_plan_id}/activate"

  - priority: 18
    category: business_constraint
    check: "Exemptions-pending gate: TaxBill cannot transition PENDING→ISSUED while any ExemptionApplication for (property_id, roll_year) is still in SUBMITTED"
    error_id: ERR_EXEMPTIONS_PENDING
    http_status: 409
    applies_to: "POST /properties/{property_id}/tax_bills/{tax_bill_id}/issue"

  - priority: 19
    category: state
    check: "Appeal decision: decided_value must satisfy decision_outcome (REDUCED ⇒ decided_value < captured capped_value; UPHELD ⇒ ==; INCREASED ⇒ >)"
    error_id: ERR_DECISION_VALUE_INCONSISTENT
    http_status: 422
    applies_to: "POST /properties/{property_id}/appeals/{appeal_id}/decide"

  - priority: 20
    category: business_constraint
    check: "Acting HearingOfficer must equal Hearing.officer_id captured at scheduling (no substitution allowed at conduct/decide)"
    error_id: ERR_OFFICER_MISMATCH
    http_status: 403
    applies_to: "POST /properties/{property_id}/appeals/{appeal_id}/conduct, POST /properties/{property_id}/appeals/{appeal_id}/decide"

  - priority: 21
    category: business_fiscal
    check: "Optimistic concurrency: PATCH/transition requests must carry version matching server's current; mismatch rejects"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "all transition endpoints with version body field"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:

  # --- Owners ---
  - method: POST
    path: "/owners"
    description: "Register a property owner (fixture for tests)"
    roles: [Assessor, Treasurer]
    code: 201
    input: [full_name, date_of_birth, "veteran_status?", "disability_rating?"]
    output: Owner
    side_effects: []

  - method: GET
    path: "/owners/{owner_id}"
    description: "Fetch owner profile"
    roles: [Assessor, Treasurer, HearingOfficer, Owner]
    code: 200
    input: []
    output: Owner
    side_effects: []

  # --- HearingOfficers ---
  - method: POST
    path: "/hearing_officers"
    description: "Register a Board of Equalization hearing officer"
    roles: [Treasurer]
    code: 201
    input: [full_name, "active?"]
    output: HearingOfficer
    side_effects: []

  - method: GET
    path: "/hearing_officers/{officer_id}"
    description: "Fetch a hearing officer"
    roles: [Assessor, Treasurer, HearingOfficer, Owner]
    code: 200
    input: []
    output: HearingOfficer
    side_effects: []

  # --- Properties ---
  - method: POST
    path: "/properties"
    description: "Register a property"
    roles: [Assessor]
    code: 201
    input: [owner_id, parcel_number, market_value]
    output: Property
    side_effects:
      - "capped_value initialised to market_value (no prior roll basis)"
      - "ownership_change_date = now"

  - method: GET
    path: "/properties/{property_id}"
    description: "Fetch a property with derived capped_value"
    roles: [Assessor, Treasurer, HearingOfficer, Owner]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: PATCH
    path: "/properties/{property_id}/owner"
    description: "Transfer ownership (sets new owner_id and ownership_change_date)"
    roles: [Assessor]
    code: 200
    input: [new_owner_id, version]
    output: Property
    side_effects:
      - "Property.owner_id updated; ownership_change_date = now"
      - "Cascade: APPROVED ExemptionApplications for current roll_year auto-REVOKED (revoked_reason=OWNERSHIP_CHANGE) → exemption_stack recomputed → any non-finalized TaxBill recomputed"

  # --- Assessments ---
  - method: POST
    path: "/properties/{property_id}/assessments"
    description: "Create a DRAFT Assessment for a roll year"
    roles: [Assessor]
    code: 201
    input: [roll_year, market_value_at_roll]
    output: Assessment
    side_effects:
      - "status = DRAFT; prior_assessment_id resolved as latest Assessment for property with roll_year < this"

  - method: GET
    path: "/properties/{property_id}/assessments/{assessment_id}"
    description: "Fetch an Assessment"
    roles: [Assessor, Treasurer, HearingOfficer, Owner]
    code: 200
    input: []
    output: Assessment
    side_effects: []

  - method: POST
    path: "/properties/{property_id}/assessments/{assessment_id}/issue"
    description: "Issue an Assessment (DRAFT → ISSUED). Triggers capped_assessed_value calculation."
    roles: [Assessor]
    code: 200
    input: [version]
    output: Assessment
    side_effects:
      - "status = ISSUED; appeal_window_closes_at set; capped_value, cap_reset_applied computed"
      - "Property.current_assessment_year updated"

  # --- ExemptionApplications ---
  - method: POST
    path: "/properties/{property_id}/exemption_applications"
    description: "Submit an exemption application"
    roles: [Owner]
    code: 201
    input: [exemption_type, effective_roll_year]
    output: ExemptionApplication
    side_effects:
      - "status = SUBMITTED; owner_id captured from X-User-ID"

  - method: POST
    path: "/properties/{property_id}/exemption_applications/{exemption_application_id}/approve"
    description: "Approve an exemption application (SUBMITTED → APPROVED)"
    roles: [Assessor]
    code: 200
    input: [version]
    output: ExemptionApplication
    side_effects:
      - "status = APPROVED; approved_at set; approved_amount via exemption_stack"
      - "Cascade: TaxBill for (property_id, effective_roll_year) recomputed if it exists in non-terminal state"

  - method: POST
    path: "/properties/{property_id}/exemption_applications/{exemption_application_id}/deny"
    description: "Deny an exemption application (SUBMITTED → DENIED)"
    roles: [Assessor]
    code: 200
    input: [version]
    output: ExemptionApplication
    side_effects: ["status = DENIED"]

  - method: POST
    path: "/properties/{property_id}/exemption_applications/{exemption_application_id}/revoke"
    description: "Revoke an APPROVED exemption (APPROVED → REVOKED)"
    roles: [Assessor]
    code: 200
    input: [revoked_reason, version]
    output: ExemptionApplication
    side_effects:
      - "status = REVOKED; approved_amount excluded from stack"
      - "Cascade: TaxBill recomputed"

  # --- Appeals ---
  - method: POST
    path: "/properties/{property_id}/appeals"
    description: "File an appeal against an ISSUED Assessment"
    roles: [Owner]
    code: 201
    input: [assessment_id, filed_grounds, claimed_value]
    output: Appeal
    side_effects:
      - "status = FILED; assessment_version pinned"
      - "Cascade: Assessment ISSUED → UNDER_APPEAL (idempotent if already UNDER_APPEAL)"

  - method: GET
    path: "/properties/{property_id}/appeals/{appeal_id}"
    description: "Fetch an appeal"
    roles: [Assessor, Treasurer, HearingOfficer, Owner]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/properties/{property_id}/appeals/{appeal_id}/schedule"
    description: "Schedule a hearing for a FILED appeal; creates Hearing"
    roles: [Treasurer]
    code: 200
    input: [scheduled_start, scheduled_end, hearing_room, officer_id, version]
    output: Appeal
    side_effects:
      - "Hearing created status=SCHEDULED; Appeal.status = SCHEDULED"

  - method: POST
    path: "/properties/{property_id}/appeals/{appeal_id}/conduct"
    description: "Conduct the hearing (SCHEDULED → HEARD)"
    roles: [HearingOfficer]
    code: 200
    input: [version]
    output: Appeal
    side_effects: ["Appeal.status = HEARD; Hearing.status = CONDUCTED"]

  - method: POST
    path: "/properties/{property_id}/appeals/{appeal_id}/decide"
    description: "Render decision (HEARD → DECIDED); triggers appeal_bill_reconciliation cascade"
    roles: [HearingOfficer]
    code: 200
    input: [decision_outcome, decided_value, version]
    output: Appeal
    side_effects:
      - "Appeal.status = DECIDED; decision_outcome and decided_value set"
      - "3-hop cascade: Assessment.capped_value updated → TaxBill recomputed → Payments REFUNDED if excess"
      - "If no remaining open Appeals on Assessment, Assessment auto-FINALIZED"

  - method: POST
    path: "/properties/{property_id}/appeals/{appeal_id}/withdraw"
    description: "Owner withdraws an appeal (FILED/SCHEDULED/HEARD → WITHDRAWN)"
    roles: [Owner]
    code: 200
    input: [version]
    output: Appeal
    side_effects:
      - "Appeal.status = WITHDRAWN; if any Hearing SCHEDULED, it is CANCELLED"
      - "If no remaining open Appeals on Assessment, Assessment reverts UNDER_APPEAL → ISSUED"

  # --- TaxBills ---
  - method: POST
    path: "/properties/{property_id}/tax_bills"
    description: "Create a TaxBill (PENDING) for a FINALIZED Assessment year"
    roles: [Treasurer]
    code: 201
    input: [roll_year, "mill_rate?"]
    output: TaxBill
    side_effects:
      - "status = PENDING; mill_rate captured (defaults DEFAULT_MILL_RATE)"
      - "taxable_value, total_exemption_amount, base_tax_amount computed via tax_bill_computation"

  - method: GET
    path: "/properties/{property_id}/tax_bills/{tax_bill_id}"
    description: "Fetch a tax bill"
    roles: [Assessor, Treasurer, HearingOfficer, Owner]
    code: 200
    input: []
    output: TaxBill
    side_effects: []

  - method: POST
    path: "/properties/{property_id}/tax_bills/{tax_bill_id}/issue"
    description: "Issue a PENDING bill (PENDING → ISSUED)"
    roles: [Treasurer]
    code: 200
    input: [version]
    output: TaxBill
    side_effects: ["status = ISSUED; issued_at set; due_date computed"]

  - method: POST
    path: "/properties/{property_id}/tax_bills/{tax_bill_id}/payments"
    description: "Apply a payment to a TaxBill"
    roles: [Owner]
    code: 201
    input: [amount]
    output: Payment
    side_effects:
      - "Payment created APPLIED"
      - "TaxBill.total_payments_applied increases; amount_due recomputed; status may advance to PARTIALLY_PAID or PAID"

  - method: GET
    path: "/properties/{property_id}/tax_bills/{tax_bill_id}/payments"
    description: "List payments for a tax bill (supports limit, offset filters)"
    roles: [Assessor, Treasurer, HearingOfficer, Owner]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Payment[]
    side_effects: []

  # --- DeferralPlans ---
  - method: POST
    path: "/properties/{property_id}/tax_bills/{tax_bill_id}/deferral_plans"
    description: "Request a deferral plan (REQUESTED) for a bill"
    roles: [Owner]
    code: 201
    input: []
    output: DeferralPlan
    side_effects: ["status = REQUESTED"]

  - method: POST
    path: "/properties/{property_id}/tax_bills/{tax_bill_id}/deferral_plans/{deferral_plan_id}/activate"
    description: "Activate a deferral plan (REQUESTED → ACTIVE); flips bill to IN_DEFERRAL"
    roles: [Treasurer]
    code: 200
    input: [version]
    output: DeferralPlan
    side_effects:
      - "status = ACTIVE; principal_deferred captured; annual_interest_rate captured"
      - "TaxBill.status transitions to IN_DEFERRAL"

  - method: POST
    path: "/properties/{property_id}/tax_bills/{tax_bill_id}/deferral_plans/{deferral_plan_id}/cancel"
    description: "Cancel a REQUESTED deferral plan (REQUESTED → DEFAULTED treated as cancellation)"
    roles: [Owner]
    code: 200
    input: [version]
    output: DeferralPlan
    side_effects: ["status = DEFAULTED (cancelled); bill state unchanged"]

  - method: GET
    path: "/properties/{property_id}/tax_bills/{tax_bill_id}/deferral_plans/{deferral_plan_id}"
    description: "Fetch a deferral plan with live accrued_interest"
    roles: [Assessor, Treasurer, HearingOfficer, Owner]
    code: 200
    input: []
    output: DeferralPlan
    side_effects: ["accrued_interest recomputed via deferral_interest_accrual at read time"]

  # --- Hearings ---
  - method: GET
    path: "/properties/{property_id}/appeals/{appeal_id}/hearing"
    description: "Fetch the Hearing associated with an Appeal"
    roles: [Assessor, Treasurer, HearingOfficer, Owner]
    code: 200
    input: []
    output: Hearing
    side_effects: []

  # --- Test-driving endpoint: clock advance (drives time-gated transitions) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the system clock to a target ISO 8601 timestamp; triggers auto Assessment FINALIZED on expired appeal windows, TaxBill DELINQUENT, DeferralPlan DEFAULTED, interest accrual recompute"
    roles: [Assessor, Treasurer, HearingOfficer, Owner]
    code: 200
    input: [target_timestamp]
    output: null
    side_effects:
      - "Auto Assessment ISSUED → FINALIZED for all assessments where now >= appeal_window_closes_at and no open Appeals"
      - "Auto TaxBill {ISSUED, PARTIALLY_PAID} → DELINQUENT for bills where now > due_date and no ACTIVE DeferralPlan"
      - "Auto DeferralPlan ACTIVE → DEFAULTED for plans where now > started_at + DEFERRAL_MAX_TERM_DAYS"
      - "deferral_interest_accrual values become fresh for next reads"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this operation"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource ID or FK does not resolve"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is in a state that does not permit this transition"

  - id: ERR_VERSION_MISMATCH
    http: 409
    condition: "Submitted version does not match server's current version (OCC)"

  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: "Acting Owner is not the Property.owner_id"

  - id: ERR_DUPLICATE_ROLL_YEAR
    http: 409
    condition: "Another Assessment for (property_id, roll_year) is in {ISSUED, UNDER_APPEAL, FINALIZED}"

  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "now >= Assessment.appeal_window_closes_at"

  - id: ERR_HEARING_INTERVAL_INVALID
    http: 422
    condition: "scheduled_end <= scheduled_start, or interval exceeds HEARING_MAX_DURATION_MIN"

  - id: ERR_ROOM_DOUBLE_BOOKED
    http: 409
    condition: "Another SCHEDULED Hearing exists in the same hearing_room with overlapping [start, end) interval"

  - id: ERR_OFFICER_BUFFER_VIOLATED
    http: 409
    condition: "Another SCHEDULED Hearing for the same officer_id is within OFFICER_BUFFER_MIN minutes"

  - id: ERR_BOE_OFFICER_CONFLICT
    http: 403
    condition: "Hearing.officer_id is the same user who issued the underlying Assessment (segregation of duties)"

  - id: ERR_OFFICER_MISMATCH
    http: 403
    condition: "Acting officer at conduct/decide is not the officer assigned at scheduling"

  - id: ERR_DECISION_VALUE_INCONSISTENT
    http: 422
    condition: "decided_value does not satisfy decision_outcome ordering relative to captured capped_value"

  - id: ERR_EXEMPTION_DUPLICATE
    http: 409
    condition: "Another APPROVED ExemptionApplication exists for the same (property_id, effective_roll_year, exemption_type)"

  - id: ERR_EXEMPTION_INELIGIBLE
    http: 422
    condition: "Owner does not satisfy exemption eligibility (age, veteran_status, disability_rating, or homestead ownership)"

  - id: ERR_OVERPAYMENT
    http: 409
    condition: "Payment amount exceeds remaining amount_due (or is <= 0)"

  - id: ERR_DUPLICATE_BILL
    http: 409
    condition: "Another TaxBill exists for (property_id, roll_year)"

  - id: ERR_ASSESSMENT_NOT_FINALIZED
    http: 409
    condition: "Linked Assessment is not in FINALIZED state when issuing a TaxBill"

  - id: ERR_EXEMPTIONS_PENDING
    http: 409
    condition: "At least one ExemptionApplication for (property_id, roll_year) is still SUBMITTED at bill issuance"

  - id: ERR_DEFERRAL_NOT_ELIGIBLE
    http: 422
    condition: "Owner does not meet hardship criteria for deferral (age or disability threshold)"

  - id: ERR_VALIDATION_FAILED
    http: 400
    condition: "Generic input shape / type validation failure (missing required fields, wrong types)"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:
  - name: Assessor
    description: "County assessor; manages Properties, ExemptionApplications, and Assessments. Cannot decide appeals (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /properties — register property"
      - "PATCH /properties/{id}/owner — transfer ownership"
      - "POST /properties/{id}/assessments — create Assessment DRAFT"
      - "POST /properties/{id}/assessments/{id}/issue — issue Assessment"
      - "POST /properties/{id}/exemption_applications/{id}/approve — approve exemption"
      - "POST /properties/{id}/exemption_applications/{id}/deny — deny exemption"
      - "POST /properties/{id}/exemption_applications/{id}/revoke — revoke exemption"
      - "POST /owners — register owner (test fixture)"
    shared_operations:
      - "GET /* — read all"
      - "POST /_clock/advance"

  - name: Treasurer
    description: "County treasurer; issues TaxBills, schedules hearings, activates DeferralPlans."
    identity: "opaque"
    exclusive_operations:
      - "POST /hearing_officers — register hearing officer"
      - "POST /properties/{id}/tax_bills — create TaxBill"
      - "POST /properties/{id}/tax_bills/{id}/issue — issue bill"
      - "POST /properties/{id}/appeals/{id}/schedule — schedule hearing"
      - "POST /properties/{id}/tax_bills/{id}/deferral_plans/{id}/activate — activate deferral"
    shared_operations:
      - "POST /owners — register owner (test fixture)"
      - "GET /* — read all"
      - "POST /_clock/advance"

  - name: HearingOfficer
    description: "Board of Equalization officer; conducts and decides hearings. Cannot be the same user as the Assessor for the appeal in question (segregation of duties enforced per-appeal)."
    identity: "entity_backed:HearingOfficer"
    exclusive_operations:
      - "POST /properties/{id}/appeals/{id}/conduct — conduct hearing"
      - "POST /properties/{id}/appeals/{id}/decide — render decision"
    shared_operations:
      - "GET /* — read all"
      - "POST /_clock/advance"

  - name: Owner
    description: "Property owner; files appeals, submits exemption applications, makes payments, requests deferrals. All write operations are scoped to properties they own (X-User-ID == Property.owner_id)."
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /properties/{id}/exemption_applications — submit exemption application"
      - "POST /properties/{id}/appeals — file appeal"
      - "POST /properties/{id}/appeals/{id}/withdraw — withdraw appeal"
      - "POST /properties/{id}/tax_bills/{id}/payments — make payment"
      - "POST /properties/{id}/tax_bills/{id}/deferral_plans — request deferral"
      - "POST /properties/{id}/tax_bills/{id}/deferral_plans/{id}/cancel — cancel deferral"
    shared_operations:
      - "GET /properties/{id} and child resources owned by the Owner"
      - "POST /_clock/advance"
