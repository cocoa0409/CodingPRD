  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_employee_scope_half_open_overlap
        grounds:
          - validations[priority=19]
          - errors[ERR_AUTH_WINDOW_OVERLAP]
          - entities.SpendAuthorization.fields.window_start
          - entities.SpendAuthorization.fields.window_end
          - entities.SpendAuthorization.fields.scope
        distinguishing_aspect: |
          EMPLOYEE-scope uses plain half-open overlap (touching allowed). An existing ACTIVE
          [2026-06-01, 2026-06-10) authorization makes a new [2026-06-05, 2026-06-15) overlap and be
          rejected, but a touching [2026-06-10, 2026-06-20) would be accepted. Resource: Employee.
        test_recipe:
          setup:
            - "CHARGE company; one employee; one ACTIVE EMPLOYEE-scope authorization [2026-06-01,2026-06-10)."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme TO1", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h12@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-authorizations"
              payload: { company_id: "${co}", scope: "EMPLOYEE", employee_id: "${emp_h}", budget_cents: 50000, window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-10T00:00:00Z" }
              as: FinanceAdmin
              captures: { auth1: "$.data.id" }
          trigger:
            - call: "POST /spend-authorizations"
              payload: { company_id: "${co}", scope: "EMPLOYEE", employee_id: "${emp_h}", budget_cents: 30000, window_start: "2026-06-05T00:00:00Z", window_end: "2026-06-15T00:00:00Z" }
              as: FinanceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_AUTH_WINDOW_OVERLAP"

      - name: rto_card_scope_buffered_adjacency
        grounds:
          - validations[priority=20]
          - errors[ERR_AUTH_WINDOW_TOO_CLOSE]
          - entities.SpendAuthorization.fields.card_id
          - entities.SpendAuthorization.fields.scope
        distinguishing_aspect: |
          CARD-scope uses BUFFERED adjacency (AUTH_BUFFER_DAYS=2), unlike EMPLOYEE-scope's touching-OK
          semantics: an existing ACTIVE CARD authorization [2026-06-01,2026-06-10) rejects a touching
          [2026-06-10,2026-06-20) with ERR_AUTH_WINDOW_TOO_CLOSE because the gap (0 days) is < 2 days.
          Resource: Card.
        test_recipe:
          setup:
            - "CHARGE company; one employee; one card; one ACTIVE CARD-scope authorization [2026-06-01,2026-06-10)."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme TO2", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h13@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /spend-authorizations"
              payload: { company_id: "${co}", scope: "CARD", employee_id: "${emp_h}", card_id: "${card}", budget_cents: 50000, window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-10T00:00:00Z" }
              as: FinanceAdmin
              captures: { auth1: "$.data.id" }
          trigger:
            - call: "POST /spend-authorizations"
              payload: { company_id: "${co}", scope: "CARD", employee_id: "${emp_h}", card_id: "${card}", budget_cents: 30000, window_start: "2026-06-10T00:00:00Z", window_end: "2026-06-20T00:00:00Z" }
              as: FinanceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_AUTH_WINDOW_TOO_CLOSE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_transaction_reverse_restores_available_credit
        grounds:
          - state_machines.Transaction.auth_status=PENDING_to_auth_status=REVERSED
          - entities.Company.fields.available_credit_cents
          - entities.Card.fields.held_cents
          - calculations.available_credit
        distinguishing_aspect: |
          Conserved quantity: Company.available_credit_cents. After capture (hold) then reverse, the
          named invariant available_credit_cents == credit_limit_cents - open_holds - posted_unpaid must
          return to its pre-authorization value 1,000,000 with held_cents back to 0; zero drift.
        test_recipe:
          setup:
            - "CHARGE company credit_limit 1,000,000; one card; one PENDING tx of 25000 (available 975000, held 25000)."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme CI1", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h14@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 25000 }
              as: FinanceAdmin
              captures: { tx: "$.data.id" }
          trigger:
            - call: "POST /transactions/${tx}/reverse"
              payload: {}
              as: FinanceAdmin
            - call: "GET /companies/${co}"
              payload: {}
              as: FinanceAdmin
              captures: { ac: "$.data.available_credit_cents" }
            - call: "GET /cards/${card}"
              payload: {}
              as: FinanceAdmin
              captures: { hc: "$.data.held_cents" }
          assert:
            - "Company.${co}.available_credit_cents == 1000000"
            - "Card.${card}.held_cents == 0"
            - "Transaction.${tx}.auth_status == REVERSED"

      - name: ci_repayment_reverse_restores_repaid_and_unpays_statement
        grounds:
          - state_machines.Repayment.CLEARED_to_REVERSED
          - entities.Statement.fields.amount_repaid_cents
          - state_machines.Statement.PAID_to_DUE
          - entities.Company.fields.available_credit_cents
        distinguishing_aspect: |
          Conserved quantity: Statement.amount_repaid_cents (a different conserved quantity than
          available credit). A cleared repayment of 40000 that PAID the statement, when reversed,
          drives amount_repaid_cents back to 0 and the statement back to DUE; no drift in the repaid total.
        test_recipe:
          setup:
            - "CHARGE company; settled tx 40000; statement CLOSED+ISSUED (DUE, min_due 40000); a repayment 40000 CLEARED so statement is PAID (amount_repaid 40000)."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme CI2", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
