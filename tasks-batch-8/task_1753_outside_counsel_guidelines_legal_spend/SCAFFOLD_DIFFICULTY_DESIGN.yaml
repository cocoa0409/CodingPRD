  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (≥2 instances, different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: matter_engage_gated_by_firm_status
        grounds:
          - state_machines.Matter.PENDING_to_ENGAGED
          - errors[ERR_FIRM_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Matter → PanelFirm: Matter's PENDING→ENGAGED transition
          is gated on the linked PanelFirm's status being ACTIVE; suspending
          the firm before engage blocks the transition.
        test_recipe:
          setup:
            - "Firm created (ACTIVE) then suspended; Matter created against the firm still in PENDING"
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "XDept", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "XFirm" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id, firm_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/matters"
              payload: { panel_firm_id: "${firm_id}", title: "M X", budget_cents: 1000000 }
              as: LegalOpsReviewer
              captures: { matter_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/suspend"
              payload: {}
              as: LegalOpsReviewer
          trigger:
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/engage"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FIRM_NOT_ACTIVE"
            - "Matter.${matter_id}.engagement_status == PENDING"

      - name: rate_card_submit_gated_by_timekeeper_qualification
        grounds:
          - state_machines.RateCard.DRAFT_to_SUBMITTED
          - errors[ERR_TIMEKEEPER_NOT_QUALIFIED]
        distinguishing_aspect: |
          Entity pair RateCard → Timekeeper (distinct from Matter → PanelFirm):
          DRAFT→SUBMITTED is gated on every referenced Timekeeper being
          QUALIFIED; a PENDING timekeeper blocks submission.
        test_recipe:
          setup:
            - "Firm ACTIVE; timekeeper registered but NOT qualified (still PENDING); DRAFT rate card with a rate row for that timekeeper"
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "QualDept", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "QualFirm" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id, firm_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "NotYet", tk_class: "ASSOCIATE" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { tk_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards"
              payload: { effective_year: 2026, expected_panel_firm_version: "${firm_v}" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { card_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/rates"
              payload: { timekeeper_id: "${tk_id}", hourly_rate_cents: 50000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
          trigger:
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/submit"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TIMEKEEPER_NOT_QUALIFIED"
            - "RateCard.${card_id}.status == DRAFT"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (≥2 instances, different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_card_year_uniqueness_point_semantics
        grounds:
          - state_machines.RateCard.DRAFT_to_SUBMITTED
          - errors[ERR_RATE_CARD_YEAR_CONFLICT]
        distinguishing_aspect: |
          Interval semantic: point/year equality on RateCard resource — two
          cards for the same firm with the same effective_year cannot both be
          SUBMITTED/APPROVED. Adjacent years (2026 and 2027) do NOT conflict.
        test_recipe:
          setup:
            - "Firm has a SUBMITTED 2026 card; firm creates a second 2026 card and attempts submit"
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "YrDept", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
