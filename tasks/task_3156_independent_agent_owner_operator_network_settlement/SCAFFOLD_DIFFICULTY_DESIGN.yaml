        distinguishing_aspect: "A depth-3 chain whose links are each caused by the previous one: suspending the BCO aborts its en-route trip, the abort returns the load to the board, and the load's return flips the previously ACCEPTED offer to DECLINED — a provider that only applies the first hop leaves the load in AWARDED and the offer in ACCEPTED."
