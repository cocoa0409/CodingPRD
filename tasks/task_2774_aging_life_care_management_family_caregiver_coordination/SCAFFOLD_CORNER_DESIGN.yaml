              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te_08: $.data.id, f_08: $.data.after_hours_factor, amt_08: $.data.billable_amount_cents }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-10T17:00:00Z", end_at: "2026-08-10T17:15:00Z", service_location_id: "OFFICE" }
              as: CareManager
