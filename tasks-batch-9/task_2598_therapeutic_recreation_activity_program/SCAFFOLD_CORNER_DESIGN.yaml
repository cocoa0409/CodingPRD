      - name: packet_attestation_without_remediation_note_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_REMEDIATION_NOTE_REQUIRED
          - validations.priority_43_ERR_REMEDIATION_NOTE_REQUIRED
        distinguishing_aspect: "The narrative is required exactly when deficiency_flags is non-empty: the empty-cohort packet compiles to provision_score 0.0 with flag F248_INSUFFICIENT_FREQUENCY, so a bare ATTEST is refused and the identical call with a remediation_note succeeds."
        test_recipe:
          setup:
            - "no residents at all, so the surveyed cohort is empty and compilation is fully determined: base_score 0.0, preliminary_score 0.0, deficiency_flags [\"F248_INSUFFICIENT_FREQUENCY\"], provision_score 0.0"
            - "the clock stays at 2026-08-01T00:00:00Z and the window is the single day 2026-08-01, so window_end equals the calendar date of current_utc"
            - "the packet is compiled by compliance-A so a different attester satisfies the segregation rule at priority 3"
          setup_api_calls:
            - call: "POST /recreation/survey-packets"
              payload: { window_start: "2026-08-01", window_end: "2026-08-01" }
              as: ComplianceOfficer
              as_user_id: "compliance-A"
              captures: { pkt_id: $.data.id }
            - call: "POST /recreation/survey-packets/${pkt_id}/compile"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-A"
          trigger:
            - call: "POST /recreation/survey-packets/${pkt_id}/attestation"
              payload: { action: "ATTEST" }
