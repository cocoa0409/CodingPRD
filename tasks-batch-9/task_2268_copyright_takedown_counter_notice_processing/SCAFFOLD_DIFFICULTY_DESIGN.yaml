          Mode (a) non-linear formula over four inputs: median of an even-sized
          latency set (12.00 and 36.00 -> 24.00) feeds a clamped ratio
          40*max(0,min(1,(48-24)/48)) = 20.00, added to a floored penalty
          max(0,30-6*1) = 24 plus two conditional gates (20 + 10), scoring exactly
