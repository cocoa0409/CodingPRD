              captures: { e3: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { e4: $.data.error_id }
            - call: "POST /scoring-runs"
              payload: { note: "Officer attempting a program run." }
