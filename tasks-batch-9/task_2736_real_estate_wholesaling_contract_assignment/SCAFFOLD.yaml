# =============================================================================
# PRD Benchmark Seed Tables — task_2736 Real Estate Wholesaling & Contract Assignment
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2736. Real Estate Wholesaling & Contract Assignment (real estate wholesaler): seller lead
  generation with marketing compliance and disclosure of intent to assign, purchase contract
  with inspection period, earnest money and assignment rights, buyer list management with
  proof-of-funds verification and assignment fee negotiation, double-close versus assignment
  structuring with title company coordination, state licensure boundaries and disclosure
  requirements for unlicensed wholesaling, deal analysis with repair estimates and
  after-repair value comparables, contract cancellation, earnest money forfeiture and seller
  dispute handling, distressed seller protections and equity-skimming prohibitions

domain_name: wholesaling-assignment-desk

# Flat topology: every aggregate root is its own top-level collection, so the API prefix is
# the server root. Child records hang off their parent only for reverse-reachability reads.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer aggregate roots (Wholesaler, SellerLead, DealAnalysis, PurchaseContract, CashBuyer,
  # AssignmentOffer, AssignmentAgreement, TitleOrder, ComplianceReview, DisputeCase) linked by
  # foreign keys, not by URL nesting. Only three records are addressed as sub-resources
  # (DisclosureAcknowledgement, ProofOfFunds, EarnestMoneyDeposit) because they are created or
  # discovered strictly through their parent.

  state_machine_shape: cyclic
  # AssignmentOffer cycles COUNTERED_BY_WHOLESALER -> REVISED_BY_BUYER -> COUNTERED_BY_WHOLESALER
  # under a round cap; MarketingCampaign cycles PUBLISHED -> SUSPENDED -> PUBLISHED;
  # PurchaseContract carries three independent parallel status dimensions;
  # DisputeCase is a two-branch fork-join on party evidence.

  relationship_patterns:
    - one_to_many          # Wholesaler -> SellerLead / CashBuyer / MarketingCampaign
    - self_referential     # AssignmentOffer.supersedes_offer_id -> AssignmentOffer.id
    - cross_aggregate      # AssignmentAgreement reaches Wholesaler through offer -> contract -> lead
    - polymorphic          # ComplianceReview.subject_seller_lead_id is optional; review_type selects the subject kind

  role_model: segregation_of_duties
  # The ComplianceOfficer who opened a review may not adjudicate it; the TitleAgent who cleared
  # a title order to fund may not be the one who funds and closes it.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Wholesaler
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the wholesaling entity.
        constraints: non-empty, max 200 chars
      - name: state_code
        type: string
        source: input
        description: Home state in which the wholesaler operates.
        constraints: exactly 2 uppercase letters
      - name: licensure_status
        type: enum
        source: input
        description: Real-estate licensure posture, which decides which disclosure and brokerage-boundary rules apply.
        default: UNLICENSED
        constraints: one of UNLICENSED, LICENSED_AGENT, LICENSED_BROKER
      - name: disclosure_template_version
        type: string
        source: input
        description: Version tag of the intent-to-assign disclosure packet this wholesaler serves to sellers; a DisclosureAcknowledgement must cite exactly this value.
        constraints: non-empty, max 32 chars
      - name: funding_window_capacity
        type: integer
        source: input
        description: How many buffered DOUBLE_CLOSE funding windows this wholesaler's transactional lender line supports at once.
        default: 1
        constraints: integer >= 1
      - name: adverse_finding_count
        type: integer
        source: computed
        description: Count of ComplianceReview rows with wholesaler_id == this.id AND status == ADJUDICATED_ADVERSE.
        default: 0
      - name: compliance_hold
        type: boolean
        source: computed
        description: True once adverse_finding_count >= COMPLIANCE_HOLD_THRESHOLD (2); blocks lead generation and assignment execution.
        default: false
      - name: executed_assignment_count
        type: integer
        source: computed
        description: Count of AssignmentAgreement rows reachable through this wholesaler's contracts whose settlement_status IN {PENDING_SETTLEMENT, SETTLED}.
        default: 0

  - name: MarketingCampaign
    parent: null
    common_fields: true
    fields:
      - name: wholesaler_id
        type: string
        source: input
        description: FK -> Wholesaler.id; owning wholesaler whose compliance posture gates publication.
      - name: channel
        type: enum
        source: input
        description: Outbound channel; SMS and COLD_CALL additionally require a do-not-call scrub.
        constraints: one of DIRECT_MAIL, SMS, COLD_CALL, BANDIT_SIGN, ONLINE_AD
      - name: headline
        type: string
        source: input
        description: Creative headline shown to prospective sellers.
        constraints: non-empty, max 200 chars
      - name: target_state_code
        type: string
        source: input
        description: State the campaign advertises into.
        constraints: exactly 2 uppercase letters
      - name: discloses_intent_to_assign
        type: boolean
        source: input
        description: Whether the creative states that the buyer intends to assign the resulting purchase contract rather than close on it.
        default: false
      - name: discloses_unlicensed_status
        type: boolean
        source: input
        description: Whether the creative states that the advertiser is not a licensed real-estate broker or agent.
        default: false
      - name: dnc_scrubbed
        type: boolean
        source: input
        description: Whether the target list was scrubbed against the do-not-call registry.
        default: false
      - name: status
        type: enum
        source: computed
        description: Lifecycle status; SUSPENDED is written only by the compliance-hold cascade.
        default: DRAFT
        constraints: one of DRAFT, PUBLISHED, SUSPENDED, ARCHIVED
      - name: published_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent successful publish; null while DRAFT.
      - name: suspension_count
        type: integer
        source: computed
        description: Number of times this campaign has been driven to SUSPENDED by a compliance-hold cascade.
        default: 0

  - name: SellerLead
    parent: null
    common_fields: true
    fields:
      - name: wholesaler_id
        type: string
        source: input
        description: FK -> Wholesaler.id; the wholesaler that owns this lead.
      - name: marketing_campaign_id
        type: string
        source: input
        description: FK -> MarketingCampaign.id; nullable, and when present the campaign MUST be in status PUBLISHED at lead-creation time.
        default: null
      - name: owner_name
        type: string
        source: input
        description: Name of the record owner of the subject property.
        constraints: non-empty, max 200 chars
      - name: property_address
        type: string
        source: input
        description: Street address of the subject property; the property is the occupancy resource for contract-overlap checks.
        constraints: non-empty, max 300 chars
      - name: state_code
        type: string
        source: input
        description: State in which the subject property sits.
        constraints: exactly 2 uppercase letters
      - name: estimated_market_value_cents
        type: integer
        source: input
        description: As-is market value estimate for the property, in cents.
        constraints: integer > 0
      - name: recorded_senior_lien_cents
        type: integer
        source: input
        description: Balance of recorded first-position lien(s), in cents.
        constraints: integer >= 0
      - name: junior_lien_cents
        type: integer
        source: input
        description: Balance of junior liens not reflected in the recorded senior position, in cents.
        default: 0
        constraints: integer >= 0
      - name: delinquent_property_tax_cents
        type: integer
        source: input
        description: Delinquent property tax owed, in cents.
        default: 0
        constraints: integer >= 0
      - name: distress_flags
        type: array
        source: input
        description: Distress indicators observed on the seller; the count feeds the protection-tier decision.
        default: []
        constraints: "array of distinct values from {FORECLOSURE_NOTICE, PROBATE, TAX_DELINQUENT, CODE_VIOLATION, DIVORCE, RELOCATION}"
      - name: status
        type: enum
        source: computed
        description: Lead lifecycle status.
        default: PROSPECT
        constraints: one of PROSPECT, SCREENED, UNDER_CONTRACT, CLOSED
      - name: screening_variant
        type: enum
        source: computed
        description: Which equity-exposure variant produced the currently stored protection_tier; null until first screen.
        constraints: one of STATUTORY, EFFECTIVE
      - name: net_equity_cents
        type: integer
        source: computed
        description: Net seller equity in cents as computed by the stored screening_variant; null until first screen. May be negative.
      - name: equity_pct
        type: number
        source: computed
        description: net_equity_cents / estimated_market_value_cents, rounded half-up to 4 decimal places; null until first screen.
      - name: protection_tier
        type: enum
        source: computed
        description: Distressed-seller protection tier derived from equity_pct and the distress_flags count; null until first screen.
        constraints: one of STANDARD, ELEVATED, PROTECTED
      - name: screened_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent protection screen; null until first screen.
      - name: lead_gen_blocked
        type: boolean
        source: computed
        description: True when the owning Wholesaler.compliance_hold == true OR marketing_campaign_id is non-null and that campaign's status == SUSPENDED.
        default: false

  - name: DealAnalysis
    parent: null
    common_fields: true
    fields:
      - name: seller_lead_id
        type: string
        source: input
        description: FK -> SellerLead.id; subject property being underwritten.
      - name: subject_gla_sqft
        type: integer
        source: input
        description: Gross living area of the subject property, used as the centre of the comparable size band.
        constraints: integer > 0
      - name: comparables
        type: array
        source: input
        description: "After-repair-value comparable sales. Each element is an object { sale_price_cents: integer > 0, distance_miles: number >= 0, closed_days_ago: integer >= 0, gla_sqft: integer > 0, adjustment_cents: integer (may be negative) }."
        constraints: array, 0..20 elements
      - name: repair_scope_items
        type: array
        source: input
        description: "Repair line items. Each element is an object { code: string, low_cents: integer >= 0, high_cents: integer >= low_cents }."
        constraints: array, 0..40 elements
      - name: valuation_variant
        type: enum
        source: computed
        description: Which after-repair-value / max-allowable-offer algorithm was applied at finalize; null while DRAFT.
        constraints: one of CONSERVATIVE, AGGRESSIVE
      - name: qualifying_comp_count
        type: integer
        source: computed
        description: Number of comparables passing the distance, recency and size band filters; recomputed on create.
        default: 0
      - name: arv_cents
        type: integer
        source: computed
        description: After-repair value in cents produced by the stored valuation_variant; null while DRAFT.
      - name: repair_estimate_cents
        type: integer
        source: computed
        description: Repair estimate in cents produced by the stored valuation_variant; null while DRAFT.
      - name: max_allowable_offer_cents
        type: integer
        source: computed
        description: Ceiling on PurchaseContract.purchase_price_cents produced by the stored valuation_variant; null while DRAFT.
      - name: status
        type: enum
        source: computed
        description: Analysis lifecycle status; a newly created analysis for the same lead drives the prior one to SUPERSEDED.
        default: DRAFT
        constraints: one of DRAFT, FINALIZED, SUPERSEDED
      - name: finalized_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the analysis was finalized; null while DRAFT.

  - name: DisclosureAcknowledgement
    parent: PurchaseContract
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-generated identifier.
      - name: purchase_contract_id
        type: string
        source: input
        description: FK -> PurchaseContract.id; the contract whose intent-to-assign disclosure the seller is acknowledging. Supplied via the path.
      - name: disclosure_template_version
        type: string
        source: input
        description: Template version the seller acknowledges; MUST equal the owning Wholesaler.disclosure_template_version.
        constraints: non-empty, max 32 chars
      - name: acknowledged_intent_to_assign
        type: boolean
        source: input
        description: Seller states in writing that they understand the buyer may assign the contract to a third party for a fee.
      - name: acknowledged_unlicensed_status
        type: boolean
        source: input
        description: Seller states in writing that they understand the buyer is not a licensed real-estate broker or agent.
      - name: signature_ref
        type: string
        source: input
        description: Opaque reference to the stored signature artifact.
        constraints: non-empty, max 120 chars
      - name: acknowledged_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the acknowledgement was recorded. Immutable; there is no update or delete endpoint for this entity.
      - name: created_at
        type: datetime
        source: system
        description: Logical-clock instant of record creation.

  - name: PurchaseContract
    parent: null
    common_fields: true
    fields:
      - name: seller_lead_id
        type: string
        source: input
        description: FK -> SellerLead.id; the lead being put under contract. The lead MUST be in status SCREENED.
      - name: deal_analysis_id
        type: string
        source: input
        description: FK -> DealAnalysis.id; the FINALIZED analysis whose max_allowable_offer_cents caps purchase_price_cents. MUST reference the same seller_lead_id.
      - name: purchase_price_cents
        type: integer
        source: input
        description: Contract price payable to the seller, in cents.
        constraints: integer > 0
      - name: earnest_money_cents
        type: integer
        source: input
        description: Earnest money the wholesaler places into escrow, in cents.
        constraints: integer > 0
      - name: inspection_period_days
        type: integer
        source: input
        description: Length of the inspection/due-diligence period in whole days, measured from signed_at.
        constraints: integer between 1 and 30 inclusive
      - name: assignment_rights_granted
        type: boolean
        source: input
        description: Whether the contract grants the buyer the right to assign it. When false, only DOUBLE_CLOSE structuring is available.
        default: true
      - name: option_start_at
        type: datetime
        source: input
        description: Start of the period during which this contract encumbers the property; used as the left edge of the occupancy interval.
      - name: closing_window_start_at
        type: datetime
        source: input
        description: Earliest permitted close; the assignment deadline is derived by backing off from this instant.
        constraints: strictly after option_start_at
      - name: closing_window_end_at
        type: datetime
        source: input
        description: Latest permitted close; the right edge of the occupancy interval.
        constraints: strictly after closing_window_start_at
      - name: contract_status
        type: enum
        source: computed
        description: Execution dimension of the contract lifecycle. Advances independently of assignment_status and structure_election.
        default: DRAFT
        constraints: one of DRAFT, SIGNED, PENDING_CLOSE, CLOSED, CANCELLED
      - name: assignment_status
        type: enum
        source: computed
        description: Marketing/assignment dimension. Advances independently of contract_status and structure_election.
        default: NOT_MARKETED
        constraints: one of NOT_MARKETED, MARKETED, ASSIGNED
      - name: structure_election
        type: enum
        source: computed
        description: Exit-structure dimension. Advances independently of contract_status and assignment_status.
        default: UNDECIDED
        constraints: one of UNDECIDED, ASSIGNMENT_ELECTED, DOUBLE_CLOSE_ELECTED
      - name: signed_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the seller signed; null while DRAFT.
      - name: inspection_deadline_at
        type: datetime
        source: computed
        description: signed_at + inspection_period_days * 24h; null while DRAFT. Half-open, so cancellation is permitted while current_utc < inspection_deadline_at.
      - name: assignment_deadline_at
        type: datetime
        source: computed
        description: closing_window_start_at - ASSIGNMENT_CUTOFF_HOURS (48h). Offers may not be accepted at or after this instant.
      - name: funding_base_cents
        type: integer
        source: computed
        description: Step 1 of the double-close funding schedule; null until structure_election == DOUBLE_CLOSE_ELECTED.
      - name: transactional_lender_fee_cents
        type: integer
        source: computed
        description: Step 3 of the double-close funding schedule; null until structure_election == DOUBLE_CLOSE_ELECTED.
      - name: total_funding_required_cents
        type: integer
        source: computed
        description: Step 4 of the double-close funding schedule; null until structure_election == DOUBLE_CLOSE_ELECTED.
      - name: double_close_spread_cents
        type: integer
        source: computed
        description: Step 5; accepted AssignmentOffer.buyer_price_cents - total_funding_required_cents. Null until both a DOUBLE_CLOSE election and an ACCEPTED offer exist. May be negative.
      - name: cancellation_reason
        type: string
        source: computed
        description: Reason recorded when the contract was cancelled; null otherwise.
      - name: cancelled_at
        type: datetime
        source: computed
        description: Logical-clock instant of cancellation; null otherwise.

  - name: EarnestMoneyDeposit
    parent: PurchaseContract
    common_fields: true
    fields:
      - name: purchase_contract_id
        type: string
        source: input
        description: FK -> PurchaseContract.id; the contract whose earnest money this record holds. System-populated when the contract is signed.
      - name: amount_cents
        type: integer
        source: system
        description: Copied from PurchaseContract.earnest_money_cents at signing; never client-supplied and never mutated afterwards.
      - name: status
        type: enum
        source: computed
        description: Escrow disposition status.
        default: HELD
        constraints: one of HELD, APPLIED_AT_CLOSING, REFUNDED_TO_WHOLESALER, FORFEITED_TO_SELLER, SPLIT_SETTLED
      - name: held_cents
        type: integer
        source: computed
        description: Portion still in escrow. Bucket in the conservation invariant.
        default: 0
      - name: refunded_to_wholesaler_cents
        type: integer
        source: computed
        description: Portion returned to the wholesaler. Bucket in the conservation invariant.
        default: 0
      - name: forfeited_to_seller_cents
        type: integer
        source: computed
        description: Portion released to the seller. Bucket in the conservation invariant.
        default: 0
      - name: applied_at_closing_cents
        type: integer
        source: computed
        description: Portion credited against the purchase price at closing. Bucket in the conservation invariant.
        default: 0
      - name: disposition_event_count
        type: integer
        source: computed
        description: Number of disposition events (forfeiture, refund, closing application, dispute award) applied to this deposit.
        default: 0

  - name: CashBuyer
    parent: null
    common_fields: true
    fields:
      - name: wholesaler_id
        type: string
        source: input
        description: FK -> Wholesaler.id; the wholesaler whose buyer list this buyer sits on.
      - name: legal_name
        type: string
        source: input
        description: Legal name of the cash buyer or their acquisition entity.
        constraints: non-empty, max 200 chars
      - name: contact_email
        type: string
        source: input
        description: Contact email for offer correspondence.
        constraints: non-empty, must contain '@', max 200 chars
      - name: verified_funds_cents
        type: integer
        source: computed
        description: Largest verified_funds_cents across this buyer's VERIFIED, unexpired ProofOfFunds records; 0 when none.
        default: 0
      - name: committed_deposit_cents
        type: integer
        source: computed
        description: Sum of buyer_deposit_cents across this buyer's AssignmentOffer rows in a live negotiation status. Subject of the capital conservation invariant.
        default: 0
      - name: available_funds_cents
        type: integer
        source: computed
        description: verified_funds_cents - committed_deposit_cents. May be negative only if a verification is downgraded; otherwise >= 0.
        default: 0
      - name: buyer_tier
        type: enum
        source: computed
        description: Tier derived from verified and available funds; drives no pricing but is asserted after cascades.
        default: SUSPENDED
        constraints: one of SUSPENDED, STANDARD, PRIORITY
      - name: active_offer_count
        type: integer
        source: computed
        description: Count of this buyer's AssignmentOffer rows in a live negotiation status.
        default: 0

  - name: ProofOfFunds
    parent: CashBuyer
    common_fields: true
    fields:
      - name: cash_buyer_id
        type: string
        source: input
        description: FK -> CashBuyer.id; the buyer whose liquidity this document evidences. Supplied via the path.
      - name: stated_funds_cents
        type: integer
        source: input
        description: Funds the buyer claims are available, in cents.
        constraints: integer > 0
      - name: document_ref
        type: string
        source: input
        description: Opaque reference to the uploaded bank letter or statement.
        constraints: non-empty, max 120 chars
      - name: expires_at
        type: datetime
        source: input
        description: Instant after which this proof of funds is stale and no longer counts toward verified funds.
      - name: verification_status
        type: enum
        source: computed
        description: Verification outcome recorded by the wholesaler.
        default: SUBMITTED
        constraints: one of SUBMITTED, VERIFIED, REJECTED
      - name: verified_funds_cents
        type: integer
        source: computed
        description: Funds the wholesaler actually verified; defaults to stated_funds_cents when the verifier supplies no override. Null while SUBMITTED or REJECTED.
      - name: verified_at
        type: datetime
        source: computed
        description: Logical-clock instant of verification; null while SUBMITTED.
      - name: verified_by_user_id
        type: string
        source: computed
        description: X-User-ID of the wholesaler user who recorded the verification decision; null while SUBMITTED.

  - name: AssignmentOffer
    parent: null
    common_fields: true
    fields:
      - name: purchase_contract_id
        type: string
        source: input
        description: FK -> PurchaseContract.id; the signed contract the buyer is bidding to take over.
      - name: cash_buyer_id
        type: string
        source: input
        description: FK -> CashBuyer.id; the bidding buyer. MUST belong to the same Wholesaler as the contract's lead.
      - name: supersedes_offer_id
        type: string
        source: input
        description: FK -> AssignmentOffer.id; self-referential, nullable. When present the referenced offer MUST belong to the same contract and buyer and is driven to WITHDRAWN on successful creation.
        default: null
      - name: buyer_price_cents
        type: integer
        source: input
        description: Total price the buyer will pay, in cents. Must be at least the contract purchase price.
        constraints: integer > 0
      - name: buyer_deposit_cents
        type: integer
        source: input
        description: Non-refundable deposit the buyer commits with the offer, in cents. Encumbers the buyer's available funds while the offer is live.
        constraints: integer > 0
      - name: status
        type: enum
        source: computed
        description: Negotiation status. COUNTERED_BY_WHOLESALER and REVISED_BY_BUYER form the negotiation cycle; CONSUMED is set when an AssignmentAgreement is executed against the offer.
        default: SUBMITTED
        constraints: one of SUBMITTED, COUNTERED_BY_WHOLESALER, REVISED_BY_BUYER, ACCEPTED, CONSUMED, WITHDRAWN, LAPSED
      - name: negotiation_round
        type: integer
        source: computed
        description: Increments on every counter and on every revise; capped by MAX_NEGOTIATION_ROUNDS.
        default: 1
      - name: countered_price_cents
        type: integer
        source: computed
        description: Price named in the wholesaler's most recent counter; null until first counter.
      - name: accepted_at
        type: datetime
        source: computed
        description: Logical-clock instant of acceptance; null unless the offer reached ACCEPTED.
      - name: assignment_fee_cents
        type: integer
        source: computed
        description: buyer_price_cents - PurchaseContract.purchase_price_cents at the moment of acceptance; null until ACCEPTED.

  - name: AssignmentAgreement
    parent: null
    common_fields: true
    fields:
      - name: assignment_offer_id
        type: string
        source: input
        description: FK -> AssignmentOffer.id; the ACCEPTED offer this agreement papers. One agreement per offer.
      - name: structure
        type: enum
        source: input
        description: Exit structure being papered; MUST match the contract's structure_election.
        constraints: one of ASSIGNMENT, DOUBLE_CLOSE
      - name: assignment_fee_cents
        type: integer
        source: computed
        description: Copied from the ACCEPTED AssignmentOffer.assignment_fee_cents at execution; the base of every settlement component.
      - name: title_holdback_cents
        type: integer
        source: computed
        description: Title company holdback component of the settlement, rounded independently of the other components.
        default: 0
      - name: state_transfer_surcharge_cents
        type: integer
        source: computed
        description: State transfer surcharge component of the settlement, rounded independently.
        default: 0
      - name: marketing_cost_recovery_cents
        type: integer
        source: computed
        description: Marketing cost recovery component of the settlement, rounded independently.
        default: 0
      - name: wholesaler_net_cents
        type: integer
        source: computed
        description: assignment_fee_cents minus the three independently rounded components.
        default: 0
      - name: settlement_status
        type: enum
        source: computed
        description: Settlement lifecycle; TERMINATED_UPSTREAM is written only by the contract-cancellation cascade.
        default: PENDING_SETTLEMENT
        constraints: one of PENDING_SETTLEMENT, SETTLED, TERMINATED_UPSTREAM
      - name: settlement_reference
        type: string
        source: computed
        description: Reference recorded by the title agent at settlement; null until SETTLED.
      - name: settled_at
        type: datetime
        source: computed
        description: Logical-clock instant of settlement; null until SETTLED.
      - name: executed_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the agreement was executed (created).

  - name: TitleOrder
    parent: null
    common_fields: true
    fields:
      - name: purchase_contract_id
        type: string
        source: input
        description: FK -> PurchaseContract.id; the contract whose closing this title order coordinates.
      - name: title_company_name
        type: string
        source: input
        description: Name of the coordinating title company.
        constraints: non-empty, max 200 chars
      - name: escrow_officer_ref
        type: string
        source: input
        description: Reference for the escrow officer handling the file.
        constraints: non-empty, max 120 chars
      - name: funding_window_start_at
        type: datetime
        source: input
        description: Start of the wired-funds window the transactional lender must reserve. Left edge of the funding interval.
      - name: funding_window_end_at
        type: datetime
        source: input
        description: End of the wired-funds window. Right edge of the funding interval, treated as exclusive.
        constraints: strictly after funding_window_start_at
      - name: status
        type: enum
        source: computed
        description: Title order lifecycle.
        default: OPENED
        constraints: one of OPENED, CLEARED_TO_FUND, FUNDED_AND_CLOSED, CANCELLED
      - name: structure
        type: enum
        source: computed
        description: Copied from the contract's structure_election at order creation; decides whether this order consumes a funding window.
        constraints: one of ASSIGNMENT, DOUBLE_CLOSE
      - name: cleared_by_user_id
        type: string
        source: computed
        description: X-User-ID of the title agent who cleared the order to fund; null while OPENED.
      - name: funded_by_user_id
        type: string
        source: computed
        description: X-User-ID of the title agent who funded and closed; MUST differ from cleared_by_user_id.
      - name: buffered_window_end_at
        type: datetime
        source: computed
        description: funding_window_end_at + DOUBLE_CLOSE_BUFFER_HOURS (48h); only DOUBLE_CLOSE orders project this buffered interval for conflict detection.

  - name: ComplianceReview
    parent: null
    common_fields: true
    fields:
      - name: wholesaler_id
        type: string
        source: input
        description: FK -> Wholesaler.id; the wholesaler under review.
      - name: subject_seller_lead_id
        type: string
        source: input
        description: FK -> SellerLead.id; nullable. Populated for lead-specific allegations such as equity skimming; null for review types that concern the wholesaler as a whole.
        default: null
      - name: review_type
        type: enum
        source: input
        description: Nature of the allegation being reviewed.
        constraints: one of LICENSURE_BOUNDARY, MARKETING_COMPLIANCE, EQUITY_SKIMMING
      - name: allegation_note
        type: string
        source: input
        description: Narrative description of the allegation.
        constraints: non-empty, max 1000 chars
      - name: status
        type: enum
        source: computed
        description: Review lifecycle.
        default: OPENED
        constraints: one of OPENED, ADJUDICATED_CLEARED, ADJUDICATED_ADVERSE
      - name: finding
        type: enum
        source: computed
        description: Adjudicated finding; null while OPENED.
        constraints: one of NO_VIOLATION, UNLICENSED_BROKERAGE_ACTIVITY, DISCLOSURE_FAILURE, EQUITY_SKIMMING
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID captured from the compliance officer who opened the review; never client-supplied in the body.
      - name: adjudicated_by_user_id
        type: string
        source: computed
        description: X-User-ID of the adjudicating compliance officer; MUST differ from opened_by_user_id.
      - name: adjudicated_at
        type: datetime
        source: computed
        description: Logical-clock instant of adjudication; null while OPENED.

  - name: DisputeCase
    parent: null
    common_fields: true
    fields:
      - name: purchase_contract_id
        type: string
        source: input
        description: FK -> PurchaseContract.id; the contract the dispute concerns.
      - name: dispute_basis
        type: enum
        source: input
        description: Legal basis the seller asserts.
        constraints: one of EARNEST_MONEY_FORFEITURE, UNDISCLOSED_ASSIGNMENT, EQUITY_SKIMMING, FAILURE_TO_CLOSE
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Amount the seller claims, in cents.
        constraints: integer > 0
      - name: status
        type: enum
        source: computed
        description: Two-branch fork-join lifecycle; EVIDENCE_COMPLETE requires evidence from both parties.
        default: OPENED
        constraints: one of OPENED, EVIDENCE_PARTIAL, EVIDENCE_COMPLETE, ADJUDICATED
      - name: seller_evidence_ref
        type: string
        source: computed
        description: Reference to the seller's evidence bundle; null until submitted.
      - name: wholesaler_evidence_ref
        type: string
        source: computed
        description: Reference to the wholesaler's evidence bundle; null until submitted.
      - name: award
        type: enum
        source: computed
        description: Adjudicated award direction; null until ADJUDICATED.
        constraints: one of SELLER_KEEPS_EARNEST_MONEY, REFUND_TO_WHOLESALER, SPLIT_50_50
      - name: award_seller_cents
        type: integer
        source: computed
        description: Cents awarded to the seller out of the earnest money deposit; null until ADJUDICATED.
      - name: award_wholesaler_cents
        type: integer
        source: computed
        description: Cents awarded back to the wholesaler out of the earnest money deposit; null until ADJUDICATED.
      - name: adjudicated_by_user_id
        type: string
        source: computed
        description: X-User-ID of the compliance officer who adjudicated the dispute; null until ADJUDICATED.

# =============================================================================
# §1.2 State Machine Table
# PurchaseContract carries three parallel dimensions, each declared as its own
# machine over the same entity (see `dimension`). They advance independently.
# =============================================================================
state_machines:
  - entity: MarketingCampaign
    dimension: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: POST /marketing-campaigns/{marketing_campaign_id}/publish
        actor: Wholesaler
        preconditions:
          - campaign status == DRAFT (re-publishing a PUBLISHED campaign is ERR_INVALID_STATE)
          - owning Wholesaler.compliance_hold == false
          - discloses_intent_to_assign == true
          - if owning Wholesaler.licensure_status == UNLICENSED then discloses_unlicensed_status == true
          - if channel IN {SMS, COLD_CALL} then dnc_scrubbed == true
        side_effects:
          - set published_at = current_utc
      - from: SUSPENDED
        to: PUBLISHED
        trigger: POST /marketing-campaigns/{marketing_campaign_id}/publish
        actor: Wholesaler
        preconditions:
          - owning Wholesaler.compliance_hold == false (the hold must have been lifted first)
          - same disclosure and DNC preconditions as the DRAFT -> PUBLISHED edge
        side_effects:
          - set published_at = current_utc
          - "recompute lead_gen_blocked on every SellerLead whose marketing_campaign_id == this campaign"
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "cascade from POST /compliance-reviews/{compliance_review_id}/adjudicate (adverse finding drives Wholesaler.compliance_hold true)"
        actor: system
        preconditions:
          - owning Wholesaler.compliance_hold transitioned false -> true in this request
        side_effects:
          - increment suspension_count by 1
          - "set lead_gen_blocked = true on every SellerLead whose marketing_campaign_id == this campaign"
      - from: DRAFT
        to: ARCHIVED
        trigger: POST /marketing-campaigns/{marketing_campaign_id}/archive
        actor: Wholesaler
        preconditions:
          - campaign status != ARCHIVED
        side_effects: []
      - from: PUBLISHED
        to: ARCHIVED
        trigger: POST /marketing-campaigns/{marketing_campaign_id}/archive
        actor: Wholesaler
        preconditions:
          - campaign status != ARCHIVED
        side_effects: []
      - from: SUSPENDED
        to: ARCHIVED
        trigger: POST /marketing-campaigns/{marketing_campaign_id}/archive
        actor: Wholesaler
        preconditions:
          - campaign status != ARCHIVED
        side_effects: []

  - entity: SellerLead
    dimension: status
    initial_state: PROSPECT
    terminal_states: [CLOSED]
    transitions:
      - from: PROSPECT
        to: SCREENED
        trigger: POST /seller-leads/{seller_lead_id}/protection-screen
        actor: Wholesaler
        preconditions:
          - lead_gen_blocked == false
        side_effects:
          - run calculation seller_equity_exposure with the requested screening_variant
          - set screening_variant, net_equity_cents, equity_pct, protection_tier, screened_at
      - from: SCREENED
        to: SCREENED
        trigger: POST /seller-leads/{seller_lead_id}/protection-screen
        actor: Wholesaler
        preconditions:
          - lead_gen_blocked == false
        side_effects:
          - recompute the equity fields under the newly requested screening_variant, overwriting the prior tier
          - set screened_at = current_utc
      - from: SCREENED
        to: UNDER_CONTRACT
        trigger: POST /purchase-contracts
        actor: Wholesaler
        preconditions:
          - no other PurchaseContract on this lead occupies an overlapping option-to-closing interval
        side_effects: []
      - from: UNDER_CONTRACT
        to: UNDER_CONTRACT
        trigger: POST /purchase-contracts
        actor: Wholesaler
        preconditions:
          - "the new contract's option-to-closing interval does not collide with any live contract on this lead (a non-overlapping backup contract is permitted)"
        side_effects:
          - "status is unchanged; only the occupancy set on the lead grows"
      - from: UNDER_CONTRACT
        to: SCREENED
        trigger: POST /purchase-contracts/{purchase_contract_id}/cancel
        actor: Wholesaler | Seller | ComplianceOfficer
        preconditions:
          - the cancelled contract is the only non-terminal contract on this lead
        side_effects:
          - lead becomes eligible for a new purchase contract (cyclic re-entry)
      - from: UNDER_CONTRACT
        to: CLOSED
        trigger: POST /title-orders/{title_order_id}/fund-and-close
        actor: TitleAgent
        preconditions:
          - the lead's contract reached contract_status == CLOSED in this request
        side_effects: []

  - entity: DealAnalysis
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: POST /deal-analyses/{deal_analysis_id}/finalize
        actor: Wholesaler
        preconditions:
          - status == DRAFT
          - qualifying_comp_count >= MIN_QUALIFYING_COMPS (3)
        side_effects:
          - run calculation arv_and_mao under the requested valuation_variant
          - set valuation_variant, arv_cents, repair_estimate_cents, max_allowable_offer_cents, finalized_at
      - from: DRAFT
        to: SUPERSEDED
        trigger: POST /deal-analyses (a newer analysis is created for the same seller_lead_id)
        actor: Wholesaler
        preconditions:
          - the new analysis references the same seller_lead_id
        side_effects: []
      - from: FINALIZED
        to: SUPERSEDED
        trigger: POST /deal-analyses (a newer analysis is created for the same seller_lead_id)
        actor: Wholesaler
        preconditions:
          - the new analysis references the same seller_lead_id
          - no non-terminal PurchaseContract already cites this analysis
        side_effects: []

  - entity: PurchaseContract
    dimension: contract_status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: POST /purchase-contracts/{purchase_contract_id}/sign
        actor: Seller
        preconditions:
          - contract_status == DRAFT
          - a DisclosureAcknowledgement exists for this contract with acknowledged_intent_to_assign == true
          - if the owning Wholesaler.licensure_status == UNLICENSED then that acknowledgement also has acknowledged_unlicensed_status == true
        side_effects:
          - set signed_at = current_utc
          - set inspection_deadline_at = signed_at + inspection_period_days * 24h
          - create the EarnestMoneyDeposit with amount_cents = earnest_money_cents, status HELD, held_cents = amount_cents
          - increment version
      - from: SIGNED
        to: PENDING_CLOSE
        trigger: POST /title-orders/{title_order_id}/clear-to-fund
        actor: TitleAgent
        preconditions:
          - the title order references this contract and is in status OPENED
        side_effects: []
      - from: PENDING_CLOSE
        to: CLOSED
        trigger: POST /title-orders/{title_order_id}/fund-and-close
        actor: TitleAgent
        preconditions:
          - the title order is in status CLEARED_TO_FUND
        side_effects:
          - move the EarnestMoneyDeposit from HELD to APPLIED_AT_CLOSING (held_cents -> applied_at_closing_cents)
          - set the owning SellerLead.status = CLOSED
      - from: DRAFT
        to: CANCELLED
        trigger: POST /purchase-contracts/{purchase_contract_id}/cancel
        actor: Wholesaler | Seller | ComplianceOfficer
        preconditions:
          - contract_status NOT IN {CLOSED, CANCELLED}
        side_effects:
          - set cancellation_reason and cancelled_at
          - set the owning SellerLead.status = SCREENED
      - from: SIGNED
        to: CANCELLED
        trigger: POST /purchase-contracts/{purchase_contract_id}/cancel
        actor: Wholesaler | Seller | ComplianceOfficer
        preconditions:
          - contract_status NOT IN {CLOSED, CANCELLED}
          - "if the actor is Wholesaler: current_utc < inspection_deadline_at (half-open window)"
        side_effects:
          - set cancellation_reason and cancelled_at
          - "cascade level 2: every AssignmentOffer on this contract in {SUBMITTED, COUNTERED_BY_WHOLESALER, REVISED_BY_BUYER, ACCEPTED} -> LAPSED"
          - "cascade level 3: every AssignmentAgreement whose offer just LAPSED and whose settlement_status == PENDING_SETTLEMENT -> TERMINATED_UPSTREAM"
          - "cascade level 4: recompute committed_deposit_cents, available_funds_cents, buyer_tier and active_offer_count on every affected CashBuyer"
          - move the EarnestMoneyDeposit from HELD to REFUNDED_TO_WHOLESALER
          - every TitleOrder on this contract in {OPENED, CLEARED_TO_FUND} -> CANCELLED, releasing its funding window
          - set the owning SellerLead.status = SCREENED
      - from: PENDING_CLOSE
        to: CANCELLED
        trigger: POST /purchase-contracts/{purchase_contract_id}/cancel
        actor: Wholesaler | Seller | ComplianceOfficer
        preconditions:
          - contract_status NOT IN {CLOSED, CANCELLED}
          - "if the actor is Wholesaler: current_utc < inspection_deadline_at"
        side_effects:
          - same cascade and escrow effects as the SIGNED -> CANCELLED edge

  - entity: PurchaseContract
    dimension: assignment_status
    initial_state: NOT_MARKETED
    terminal_states: [ASSIGNED]
    transitions:
      - from: NOT_MARKETED
        to: MARKETED
        trigger: POST /assignment-offers
        actor: CashBuyer
        preconditions:
          - contract_status == SIGNED or PENDING_CLOSE
          - assignment_rights_granted == true OR structure_election == DOUBLE_CLOSE_ELECTED
        side_effects:
          - increment version on the contract (the OCC parent write)
      - from: MARKETED
        to: ASSIGNED
        trigger: POST /assignment-agreements
        actor: Wholesaler
        preconditions:
          - an AssignmentOffer on this contract is in status ACCEPTED
          - the agreement's structure matches structure_election
        side_effects:
          - "recompute double_close_spread_cents when structure_election == DOUBLE_CLOSE_ELECTED"

  - entity: PurchaseContract
    dimension: structure_election
    initial_state: UNDECIDED
    terminal_states: []
    transitions:
      - from: UNDECIDED
        to: ASSIGNMENT_ELECTED
        trigger: POST /purchase-contracts/{purchase_contract_id}/elect-structure
        actor: Wholesaler
        preconditions:
          - contract_status NOT IN {CLOSED, CANCELLED}
          - assignment_rights_granted == true
        side_effects: []
      - from: UNDECIDED
        to: DOUBLE_CLOSE_ELECTED
        trigger: POST /purchase-contracts/{purchase_contract_id}/elect-structure
        actor: Wholesaler
        preconditions:
          - contract_status NOT IN {CLOSED, CANCELLED}
        side_effects:
          - run calculation double_close_funding_schedule and set funding_base_cents, transactional_lender_fee_cents, total_funding_required_cents
      - from: ASSIGNMENT_ELECTED
        to: DOUBLE_CLOSE_ELECTED
        trigger: POST /purchase-contracts/{purchase_contract_id}/elect-structure
        actor: Wholesaler
        preconditions:
          - assignment_status != ASSIGNED (no agreement has been executed yet)
        side_effects:
          - run calculation double_close_funding_schedule
      - from: DOUBLE_CLOSE_ELECTED
        to: ASSIGNMENT_ELECTED
        trigger: POST /purchase-contracts/{purchase_contract_id}/elect-structure
        actor: Wholesaler
        preconditions:
          - assignment_status != ASSIGNED
          - assignment_rights_granted == true
          - no TitleOrder on this contract is in status OPENED or CLEARED_TO_FUND with structure == DOUBLE_CLOSE
        side_effects:
          - clear funding_base_cents, transactional_lender_fee_cents, total_funding_required_cents and double_close_spread_cents to null

  - entity: EarnestMoneyDeposit
    dimension: status
    initial_state: HELD
    terminal_states: [APPLIED_AT_CLOSING, SPLIT_SETTLED]
    transitions:
      - from: HELD
        to: FORFEITED_TO_SELLER
        trigger: POST /earnest-money-deposits/{earnest_money_deposit_id}/forfeit
        actor: TitleAgent
        preconditions:
          - status == HELD
          - the owning contract's inspection_deadline_at has passed (current_utc >= inspection_deadline_at)
        side_effects:
          - move held_cents into forfeited_to_seller_cents
          - increment disposition_event_count
      - from: HELD
        to: REFUNDED_TO_WHOLESALER
        trigger: "cascade from POST /purchase-contracts/{purchase_contract_id}/cancel"
        actor: system
        preconditions:
          - status == HELD
        side_effects:
          - move held_cents into refunded_to_wholesaler_cents
          - increment disposition_event_count
      - from: HELD
        to: APPLIED_AT_CLOSING
        trigger: "cascade from POST /title-orders/{title_order_id}/fund-and-close"
        actor: system
        preconditions:
          - status == HELD
        side_effects:
          - move held_cents into applied_at_closing_cents
          - increment disposition_event_count
      - from: FORFEITED_TO_SELLER
        to: SPLIT_SETTLED
        trigger: "POST /dispute-cases/{dispute_case_id}/adjudicate with award == SPLIT_50_50"
        actor: ComplianceOfficer
        preconditions:
          - status == FORFEITED_TO_SELLER
        side_effects:
          - "set forfeited_to_seller_cents = floor(amount_cents / 2) and refunded_to_wholesaler_cents = amount_cents - forfeited_to_seller_cents"
          - increment disposition_event_count
      - from: FORFEITED_TO_SELLER
        to: REFUNDED_TO_WHOLESALER
        trigger: "POST /dispute-cases/{dispute_case_id}/adjudicate with award == REFUND_TO_WHOLESALER"
        actor: ComplianceOfficer
        preconditions:
          - status == FORFEITED_TO_SELLER
        side_effects:
          - move forfeited_to_seller_cents into refunded_to_wholesaler_cents
          - increment disposition_event_count

  - entity: ProofOfFunds
    dimension: verification_status
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: POST /proof-of-funds/{proof_of_funds_id}/verify
        actor: Wholesaler
        preconditions:
          - verification_status == SUBMITTED
          - expires_at > current_utc
        side_effects:
          - "set verified_funds_cents (defaulting to stated_funds_cents), verified_at, verified_by_user_id"
          - recompute the owning CashBuyer's verified_funds_cents, available_funds_cents and buyer_tier
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /proof-of-funds/{proof_of_funds_id}/verify
        actor: Wholesaler
        preconditions:
          - verification_status == SUBMITTED
        side_effects:
          - recompute the owning CashBuyer's verified_funds_cents, available_funds_cents and buyer_tier

  - entity: AssignmentOffer
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [CONSUMED, WITHDRAWN, LAPSED]
    transitions:
      - from: SUBMITTED
        to: COUNTERED_BY_WHOLESALER
        trigger: POST /assignment-offers/{assignment_offer_id}/counter
        actor: Wholesaler
        preconditions:
          - status IN {SUBMITTED, REVISED_BY_BUYER}
          - negotiation_round < MAX_NEGOTIATION_ROUNDS (4)
          - the owning contract is not in a terminal contract_status
        side_effects:
          - set countered_price_cents
          - increment negotiation_round
      - from: REVISED_BY_BUYER
        to: COUNTERED_BY_WHOLESALER
        trigger: POST /assignment-offers/{assignment_offer_id}/counter
        actor: Wholesaler
        preconditions:
          - negotiation_round < MAX_NEGOTIATION_ROUNDS (4)
        side_effects:
          - set countered_price_cents
          - increment negotiation_round
      - from: COUNTERED_BY_WHOLESALER
        to: REVISED_BY_BUYER
        trigger: POST /assignment-offers/{assignment_offer_id}/revise
        actor: CashBuyer
        preconditions:
          - status == COUNTERED_BY_WHOLESALER
          - negotiation_round < MAX_NEGOTIATION_ROUNDS (4)
          - "the revised buyer_price_cents still satisfies the contract-price floor and the buyer's available funds"
        side_effects:
          - overwrite buyer_price_cents and buyer_deposit_cents
          - increment negotiation_round
          - recompute the owning CashBuyer's committed_deposit_cents, available_funds_cents and buyer_tier
      - from: SUBMITTED
        to: ACCEPTED
        trigger: POST /assignment-offers/{assignment_offer_id}/accept
        actor: Wholesaler
        preconditions:
          - status IN {SUBMITTED, COUNTERED_BY_WHOLESALER, REVISED_BY_BUYER}
          - the buyer has a VERIFIED, unexpired ProofOfFunds
          - current_utc < the contract's assignment_deadline_at
          - "buyer_price_cents - purchase_price_cents does not exceed the seller's protection-tier fee cap"
        side_effects:
          - set accepted_at and assignment_fee_cents
          - all sibling offers on the same contract in a live status -> LAPSED
      - from: COUNTERED_BY_WHOLESALER
        to: ACCEPTED
        trigger: POST /assignment-offers/{assignment_offer_id}/accept
        actor: Wholesaler
        preconditions:
          - same preconditions as the SUBMITTED -> ACCEPTED edge
        side_effects:
          - same side effects as the SUBMITTED -> ACCEPTED edge
      - from: REVISED_BY_BUYER
        to: ACCEPTED
        trigger: POST /assignment-offers/{assignment_offer_id}/accept
        actor: Wholesaler
        preconditions:
          - same preconditions as the SUBMITTED -> ACCEPTED edge
        side_effects:
          - same side effects as the SUBMITTED -> ACCEPTED edge
      - from: ACCEPTED
        to: CONSUMED
        trigger: POST /assignment-agreements
        actor: Wholesaler
        preconditions:
          - status == ACCEPTED
          - no AssignmentAgreement already references this offer
        side_effects:
          - the contract's assignment_status -> ASSIGNED
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: POST /assignment-offers (a new offer is created with supersedes_offer_id == this offer)
        actor: CashBuyer
        preconditions:
          - status IN {SUBMITTED, COUNTERED_BY_WHOLESALER, REVISED_BY_BUYER}
        side_effects:
          - release this offer's buyer_deposit_cents from the buyer's committed_deposit_cents
      - from: ACCEPTED
        to: LAPSED
        trigger: "cascade from POST /purchase-contracts/{purchase_contract_id}/cancel"
        actor: system
        preconditions:
          - the owning contract moved to CANCELLED in this request
        side_effects:
          - "cascade level 3: the offer's PENDING_SETTLEMENT AssignmentAgreement -> TERMINATED_UPSTREAM"
          - "cascade level 4: the buyer's committed_deposit_cents, available_funds_cents and buyer_tier are recomputed"

  - entity: AssignmentAgreement
    dimension: settlement_status
    initial_state: PENDING_SETTLEMENT
    terminal_states: [SETTLED, TERMINATED_UPSTREAM]
    transitions:
      - from: PENDING_SETTLEMENT
        to: SETTLED
        trigger: POST /assignment-agreements/{assignment_agreement_id}/settle
        actor: TitleAgent
        preconditions:
          - settlement_status == PENDING_SETTLEMENT
          - the owning contract is not CANCELLED
        side_effects:
          - run calculation assignment_fee_settlement and write the four settlement components
          - set settlement_reference and settled_at
      - from: PENDING_SETTLEMENT
        to: TERMINATED_UPSTREAM
        trigger: "cascade from POST /purchase-contracts/{purchase_contract_id}/cancel"
        actor: system
        preconditions:
          - the referenced offer moved to LAPSED in this request
        side_effects:
          - zero the four settlement components
          - "cascade level 4: recompute the buyer's committed capital and tier"

  - entity: TitleOrder
    dimension: status
    initial_state: OPENED
    terminal_states: [FUNDED_AND_CLOSED, CANCELLED]
    transitions:
      - from: OPENED
        to: CLEARED_TO_FUND
        trigger: POST /title-orders/{title_order_id}/clear-to-fund
        actor: TitleAgent
        preconditions:
          - status == OPENED
          - "the contract's assignment_status == ASSIGNED (structure ASSIGNMENT) or structure_election == DOUBLE_CLOSE_ELECTED (structure DOUBLE_CLOSE)"
        side_effects:
          - set cleared_by_user_id from the X-User-ID header
          - the owning contract's contract_status -> PENDING_CLOSE
      - from: CLEARED_TO_FUND
        to: FUNDED_AND_CLOSED
        trigger: POST /title-orders/{title_order_id}/fund-and-close
        actor: TitleAgent
        preconditions:
          - status == CLEARED_TO_FUND
          - "the acting X-User-ID differs from cleared_by_user_id (dual control)"
        side_effects:
          - set funded_by_user_id
          - the owning contract's contract_status -> CLOSED
          - the owning SellerLead.status -> CLOSED
          - the EarnestMoneyDeposit -> APPLIED_AT_CLOSING
      - from: OPENED
        to: CANCELLED
        trigger: "cascade from POST /purchase-contracts/{purchase_contract_id}/cancel"
        actor: system
        preconditions:
          - status IN {OPENED, CLEARED_TO_FUND}
        side_effects:
          - release the buffered funding window so a later DOUBLE_CLOSE order may reuse it
      - from: CLEARED_TO_FUND
        to: CANCELLED
        trigger: "cascade from POST /purchase-contracts/{purchase_contract_id}/cancel"
        actor: system
        preconditions:
          - status IN {OPENED, CLEARED_TO_FUND}
        side_effects:
          - release the buffered funding window

  - entity: ComplianceReview
    dimension: status
    initial_state: OPENED
    terminal_states: [ADJUDICATED_CLEARED, ADJUDICATED_ADVERSE]
    transitions:
      - from: OPENED
        to: ADJUDICATED_CLEARED
        trigger: POST /compliance-reviews/{compliance_review_id}/adjudicate
        actor: ComplianceOfficer
        preconditions:
          - status == OPENED
          - "the acting X-User-ID differs from opened_by_user_id (segregation of duties)"
          - decision == CLEAR and finding == NO_VIOLATION
        side_effects:
          - set adjudicated_by_user_id and adjudicated_at
      - from: OPENED
        to: ADJUDICATED_ADVERSE
        trigger: POST /compliance-reviews/{compliance_review_id}/adjudicate
        actor: ComplianceOfficer
        preconditions:
          - status == OPENED
          - "the acting X-User-ID differs from opened_by_user_id"
          - decision == ADVERSE and finding != NO_VIOLATION
        side_effects:
          - "cascade level 1: set finding, adjudicated_by_user_id, adjudicated_at; increment Wholesaler.adverse_finding_count"
          - "cascade level 2: when adverse_finding_count reaches COMPLIANCE_HOLD_THRESHOLD (2), set Wholesaler.compliance_hold = true"
          - "cascade level 3: while compliance_hold is true, every PUBLISHED MarketingCampaign of that wholesaler -> SUSPENDED with suspension_count incremented"
          - "cascade level 4: every SellerLead attached to a suspended campaign, and every SellerLead of that wholesaler, gets lead_gen_blocked = true"

  - entity: DisputeCase
    dimension: status
    initial_state: OPENED
    terminal_states: [ADJUDICATED]
    transitions:
      - from: OPENED
        to: EVIDENCE_PARTIAL
        trigger: POST /dispute-cases/{dispute_case_id}/submit-evidence
        actor: Seller | Wholesaler
        preconditions:
          - status IN {OPENED, EVIDENCE_PARTIAL}
          - the submitting party has not already submitted
        side_effects:
          - "record seller_evidence_ref or wholesaler_evidence_ref according to the acting role (fork branch)"
      - from: EVIDENCE_PARTIAL
        to: EVIDENCE_COMPLETE
        trigger: POST /dispute-cases/{dispute_case_id}/submit-evidence
        actor: Seller | Wholesaler
        preconditions:
          - the other party's evidence reference is already present
        side_effects:
          - "join point: both evidence references are now non-null"
      - from: EVIDENCE_COMPLETE
        to: ADJUDICATED
        trigger: POST /dispute-cases/{dispute_case_id}/adjudicate
        actor: ComplianceOfficer
        preconditions:
          - status == EVIDENCE_COMPLETE
          - the contract's EarnestMoneyDeposit is not in status HELD or APPLIED_AT_CLOSING
        side_effects:
          - run calculation escrow_disposition for the requested award
          - set award, award_seller_cents, award_wholesaler_cents, adjudicated_by_user_id
          - re-bucket the EarnestMoneyDeposit so the conservation invariant still holds

# =============================================================================
# §1.2.1 Concurrency Rules (optimistic concurrency on the parent aggregate)
# =============================================================================
concurrency_rules:
  - rule_id: offer-create-stale-contract
    pattern: create_with_parent_version_check
    parent_entity: PurchaseContract
    child_entity: AssignmentOffer
    write_endpoint: POST /assignment-offers
    occ_field: expected_purchase_contract_version
    guarantee: >-
      A client that read the contract before an intervening write (a counter, a structure
      election, a sign, or a superseding offer) submits a version that no longer matches
      PurchaseContract.version, and the create is rejected without side effects.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    serialization: "PurchaseContract.version increments on every write that alters the contract or its offer set; ordering falls back to created_at, never to id"

  - rule_id: analysis-create-stale-lead
    pattern: create_with_parent_version_check
    parent_entity: SellerLead
    child_entity: DealAnalysis
    write_endpoint: POST /deal-analyses
    occ_field: expected_seller_lead_version
    guarantee: >-
      A client that underwrote a lead before it was re-screened onto a different protection
      tier submits a version that no longer matches SellerLead.version, and the analysis
      create is rejected so the analysis can never be built on a stale equity picture.
    error_id: ERR_STALE_LEAD_VERSION
    http_status: 412
    serialization: "SellerLead.version increments on every screen and on every contract status change; ordering falls back to created_at, never to id"

# =============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents. `round_half_up(x)` means Decimal quantize to a whole
# cent with ROUND_HALF_UP. `floor(x)` means mathematical floor toward negative
# infinity. Ordering of any input list is by the caller-supplied array index unless a
# rule states otherwise; entity ordering falls back to created_at ascending, never to id.
# =============================================================================
calculations:
  - name: arv_and_mao
    entity: DealAnalysis
    description: >-
      Derives the after-repair value, the repair estimate and the maximum allowable offer for a
      subject property from its comparable sales and repair scope. The two variants disagree on
      every one of the three outputs, so the same comparable set yields two different price
      ceilings depending on which variant the wholesaler finalizes under.
    trigger: POST /deal-analyses/{deal_analysis_id}/finalize (variant chosen by the request body); qualifying_comp_count alone is also recomputed on POST /deal-analyses
    inputs:
      - DealAnalysis.subject_gla_sqft
      - DealAnalysis.comparables[] (sale_price_cents, distance_miles, closed_days_ago, gla_sqft, adjustment_cents)
      - DealAnalysis.repair_scope_items[] (low_cents, high_cents)
      - the requested valuation_variant
    algorithm: weighted_scoring
    formula: |
      STEP 1 — qualification filter (identical under both variants):
        A comparable qualifies iff ALL of:
          distance_miles          <= DISTANCE_MAX_MILES        (0.50, inclusive)
          closed_days_ago         <= RECENCY_MAX_DAYS          (180, inclusive)
          abs(gla_sqft - subject_gla_sqft) * 100 <= subject_gla_sqft * 20
            (i.e. within +/- GLA_TOLERANCE_PCT of the subject GLA, inclusive, evaluated in
             integer arithmetic so the band edge is exact)
        qualifying_comp_count = number of qualifying comparables.
        adjusted_price_cents(c) = c.sale_price_cents + c.adjustment_cents   (may be negative)

      STEP 2 — after-repair value:
        variant CONSERVATIVE  (median of the qualifying adjusted prices):
          sort the qualifying comparables by adjusted_price_cents ASC,
            tie-break closed_days_ago ASC, then original array index ASC
          if the count is odd  -> arv_cents = adjusted_price_cents of the middle element
          if the count is even -> arv_cents = floor((lower_middle + upper_middle) / 2)
        variant AGGRESSIVE    (recency-weighted mean of the qualifying adjusted prices):
          weight(c) = RECENCY_MAX_DAYS + 1 - c.closed_days_ago      (181 - closed_days_ago, always >= 1)
          arv_cents = round_half_up( SUM(adjusted_price_cents(c) * weight(c)) / SUM(weight(c)) )
            The numerator and denominator are accumulated in full precision and divided once;
            no intermediate per-comparable rounding.

      STEP 3 — repair estimate:
        variant CONSERVATIVE:
          repair_estimate_cents = round_half_up( SUM(item.high_cents) * CONTINGENCY_MULTIPLIER )
            Sum first, multiply once, round once. The contingency is NOT applied per line item.
        variant AGGRESSIVE:
          repair_estimate_cents = SUM(item.low_cents)      (no contingency)

      STEP 4 — maximum allowable offer:
        multiplier = CONSERVATIVE_ARV_MULTIPLIER (0.70) under CONSERVATIVE
                     AGGRESSIVE_ARV_MULTIPLIER   (0.75) under AGGRESSIVE
        max_allowable_offer_cents = floor(arv_cents * multiplier)
                                    - repair_estimate_cents
                                    - MIN_ASSIGNMENT_MARGIN_CENTS
        The result is stored as computed and is NOT clamped at zero; a thin deal legitimately
        yields a negative ceiling, which then rejects every positive purchase price.
    constants:
      DISTANCE_MAX_MILES: 0.50
      RECENCY_MAX_DAYS: 180
      GLA_TOLERANCE_PCT: 0.20
      CONSERVATIVE_ARV_MULTIPLIER: 0.70
      AGGRESSIVE_ARV_MULTIPLIER: 0.75
      CONTINGENCY_MULTIPLIER: 1.10
      MIN_ASSIGNMENT_MARGIN_CENTS: 1000000
      MIN_QUALIFYING_COMPS: 3
    precision: "integer cents; round_half_up on the weighted mean and on the contingency product; floor on the ARV multiplier product and on the even-count median"
    variants:
      - name: CONSERVATIVE
        when: "POST /deal-analyses/{deal_analysis_id}/finalize with valuation_variant == CONSERVATIVE"
        difference: "median ARV, high-side repairs inflated by a 1.10 contingency, 0.70 ARV multiplier — the lowest of the two ceilings"
      - name: AGGRESSIVE
        when: "POST /deal-analyses/{deal_analysis_id}/finalize with valuation_variant == AGGRESSIVE"
        difference: "recency-weighted mean ARV, low-side repairs with no contingency, 0.75 ARV multiplier — the highest of the two ceilings"

  - name: seller_equity_exposure
    entity: SellerLead
    description: >-
      Measures how much equity a distressed seller actually stands to lose, and maps that onto a
      protection tier that later caps the assignment fee and imposes a cooling-off period. The
      statutory variant looks only at recorded encumbrances; the effective variant also deducts
      unrecorded junior debt, delinquent taxes and the seller's own closing costs.
    trigger: POST /seller-leads/{seller_lead_id}/protection-screen (variant chosen by the request body); re-runnable, overwriting the stored tier
    inputs:
      - SellerLead.estimated_market_value_cents
      - SellerLead.recorded_senior_lien_cents
      - SellerLead.junior_lien_cents
      - SellerLead.delinquent_property_tax_cents
      - SellerLead.distress_flags (count only)
      - the requested screening_variant
    algorithm: threshold
    formula: |
      MV     = estimated_market_value_cents
      SENIOR = recorded_senior_lien_cents
      flags  = number of distinct entries in distress_flags

      variant STATUTORY:
        net_equity_cents = MV - SENIOR
      variant EFFECTIVE:
        net_equity_cents = MV - SENIOR - junior_lien_cents - delinquent_property_tax_cents
                              - round_half_up(MV * SELLER_CLOSING_COST_PCT)

      equity_pct = round_half_up(net_equity_cents / MV, 4 decimal places)
        (full-precision division, quantized once to 4 places; may be negative)

      protection_tier =
        PROTECTED  if equity_pct >= HIGH_EQUITY_PCT AND flags >= 2
        ELEVATED   if (equity_pct >= HIGH_EQUITY_PCT AND flags == 1)
                   OR (equity_pct <  HIGH_EQUITY_PCT AND flags >= 2)
        STANDARD   otherwise
        The HIGH_EQUITY_PCT comparison is inclusive: a lead landing exactly on 0.3500 counts
        as high equity.
    constants:
      SELLER_CLOSING_COST_PCT: 0.08
      HIGH_EQUITY_PCT: 0.35
    precision: "net equity in integer cents; equity_pct to exactly 4 decimal places, round_half_up"
    variants:
      - name: STATUTORY
        when: "protection-screen with screening_variant == STATUTORY"
        difference: "deducts only the recorded senior lien, so equity — and therefore the protection tier — reads high"
      - name: EFFECTIVE
        when: "protection-screen with screening_variant == EFFECTIVE"
        difference: "additionally deducts junior liens, delinquent taxes and an 8% seller closing-cost allowance, which can drop the same lead a whole tier"

  - name: assignment_fee_settlement
    entity: AssignmentAgreement
    description: >-
      Splits the assignment fee into three independently rounded deduction components and a
      residual net to the wholesaler. Each component is rounded to the cent on its own before
      any addition, so collapsing the three rates into a single 0.0555 rate produces a
      one-cent-different deduction total on unfriendly fee amounts.
    trigger: POST /assignment-agreements/{assignment_agreement_id}/settle
    inputs:
      - AssignmentAgreement.assignment_fee_cents (copied from the ACCEPTED AssignmentOffer at execution)
    algorithm: aggregation
    formula: |
      FEE = assignment_fee_cents

      title_holdback_cents            = round_half_up(FEE * TITLE_HOLDBACK_RATE)
      state_transfer_surcharge_cents   = round_half_up(FEE * STATE_TRANSFER_SURCHARGE_RATE)
      marketing_cost_recovery_cents    = round_half_up(FEE * MARKETING_RECOVERY_RATE)

      wholesaler_net_cents = FEE
                             - title_holdback_cents
                             - state_transfer_surcharge_cents
                             - marketing_cost_recovery_cents

      MANDATORY EVALUATION ORDER: round each of the three components to a whole cent FIRST,
      then subtract the three rounded values. Computing
        round_half_up(FEE * (TITLE_HOLDBACK_RATE + STATE_TRANSFER_SURCHARGE_RATE + MARKETING_RECOVERY_RATE))
      is a different number for fee amounts whose fractional cents straddle the half.
    constants:
      TITLE_HOLDBACK_RATE: 0.0325
      STATE_TRANSFER_SURCHARGE_RATE: 0.0075
      MARKETING_RECOVERY_RATE: 0.0155
    precision: "each component quantized to integer cents with round_half_up before summation"

  - name: double_close_funding_schedule
    entity: PurchaseContract
    description: >-
      Sizes the transactional funding a double close requires. The lender's fee tier is keyed on
      the grossed-up funding base, not on the raw purchase price and not on the final total, so
      a contract whose purchase price sits just under a tier edge is nevertheless priced in the
      next tier up.
    trigger: POST /purchase-contracts/{purchase_contract_id}/elect-structure with structure_election == DOUBLE_CLOSE_ELECTED; step 5 is re-evaluated when an AssignmentOffer on the contract reaches ACCEPTED
    inputs:
      - PurchaseContract.purchase_price_cents
      - the ACCEPTED AssignmentOffer.buyer_price_cents (step 5 only)
    algorithm: tiered_pricing
    formula: |
      STEP 1 — gross up the purchase price with closing and recording costs:
        funding_base_cents = purchase_price_cents
                             + round_half_up(purchase_price_cents * CLOSING_COST_GROSS_UP_RATE)

      STEP 2 — select the lender tier FROM funding_base_cents (never from purchase_price_cents,
               never from total_funding_required_cents):
        funding_base_cents <  TIER_1_CEILING_CENTS                    -> rate TIER_1_RATE, floor TIER_1_MIN_FEE_CENTS
        TIER_1_CEILING_CENTS <= funding_base_cents < TIER_2_CEILING_CENTS
                                                                      -> rate TIER_2_RATE, floor TIER_2_MIN_FEE_CENTS
        funding_base_cents >= TIER_2_CEILING_CENTS                    -> rate TIER_3_RATE, floor TIER_3_MIN_FEE_CENTS
        Tier edges are half-open: a base landing exactly on TIER_1_CEILING_CENTS is tier 2.

      STEP 3 — apply the tier with its minimum-fee floor:
        transactional_lender_fee_cents = max(tier_min_fee_cents,
                                             round_half_up(funding_base_cents * tier_rate))

      STEP 4 — total:
        total_funding_required_cents = funding_base_cents + transactional_lender_fee_cents

      STEP 5 — spread (null until an AssignmentOffer on this contract is ACCEPTED):
        double_close_spread_cents = accepted_offer.buyer_price_cents
                                    - total_funding_required_cents
        May be negative, in which case the double close is underwater but is not rejected.
    constants:
      CLOSING_COST_GROSS_UP_RATE: 0.021
      TIER_1_CEILING_CENTS: 15000000
      TIER_2_CEILING_CENTS: 30000000
      TIER_1_RATE: 0.0300
      TIER_2_RATE: 0.0225
      TIER_3_RATE: 0.0175
      TIER_1_MIN_FEE_CENTS: 25000
      TIER_2_MIN_FEE_CENTS: 45000
      TIER_3_MIN_FEE_CENTS: 70000
    precision: "integer cents; round_half_up on the gross-up and on the tier product; the minimum-fee floor is applied after rounding"

  - name: assignment_fee_cap
    entity: AssignmentOffer
    description: >-
      Caps the assignment fee a wholesaler may extract from a distressed seller as a share of the
      contract price, tightening as the seller's protection tier rises.
    trigger: POST /assignment-offers/{assignment_offer_id}/accept and POST /assignment-agreements
    inputs:
      - PurchaseContract.purchase_price_cents
      - AssignmentOffer.buyer_price_cents
      - SellerLead.protection_tier
    algorithm: threshold
    formula: |
      implied_fee_cents = offer.buyer_price_cents - contract.purchase_price_cents
      cap_pct = FEE_CAP_PCT_STANDARD  (0.12) when protection_tier == STANDARD
                FEE_CAP_PCT_ELEVATED  (0.08) when protection_tier == ELEVATED
                FEE_CAP_PCT_PROTECTED (0.05) when protection_tier == PROTECTED
      cap_cents = floor(contract.purchase_price_cents * cap_pct)
      The operation is rejected iff implied_fee_cents > cap_cents. The comparison is strict, so
      a fee landing exactly on cap_cents is permitted.
    constants:
      FEE_CAP_PCT_STANDARD: 0.12
      FEE_CAP_PCT_ELEVATED: 0.08
      FEE_CAP_PCT_PROTECTED: 0.05
    precision: "integer cents; floor on the cap product"

  - name: escrow_disposition
    entity: EarnestMoneyDeposit
    description: >-
      Moves earnest money between four mutually exclusive buckets. Every disposition event is a
      transfer, never a mint or a burn, so the four buckets always re-sum to the original amount.
    trigger: "POST /earnest-money-deposits/{earnest_money_deposit_id}/forfeit; cascades from contract cancellation and from title funding; POST /dispute-cases/{dispute_case_id}/adjudicate"
    inputs:
      - EarnestMoneyDeposit.amount_cents
      - the disposition event being applied
      - DisputeCase.award (adjudication only)
    algorithm: waterfall_allocation
    formula: |
      INVARIANT Q1 (must hold after every request that touches the deposit):
        held_cents
        + refunded_to_wholesaler_cents
        + forfeited_to_seller_cents
        + applied_at_closing_cents
        == amount_cents
      and every bucket is >= 0.

      Event transfers:
        signing            -> held_cents = amount_cents, all other buckets 0
        forfeit            -> forfeited_to_seller_cents += held_cents; held_cents = 0
        contract cancel    -> refunded_to_wholesaler_cents += held_cents; held_cents = 0
        fund and close     -> applied_at_closing_cents += held_cents; held_cents = 0
        dispute award SELLER_KEEPS_EARNEST_MONEY
                           -> buckets unchanged; award_seller_cents = forfeited_to_seller_cents,
                              award_wholesaler_cents = 0
        dispute award REFUND_TO_WHOLESALER
                           -> refunded_to_wholesaler_cents += forfeited_to_seller_cents;
                              forfeited_to_seller_cents = 0;
                              award_seller_cents = 0; award_wholesaler_cents = amount_cents
        dispute award SPLIT_50_50
                           -> seller_share = floor(amount_cents / 2)
                              forfeited_to_seller_cents     = seller_share
                              refunded_to_wholesaler_cents  = amount_cents - seller_share
                              award_seller_cents = seller_share
                              award_wholesaler_cents = amount_cents - seller_share
                              (an odd amount leaves the extra cent with the wholesaler)
      disposition_event_count increments by exactly 1 per applied event.
    constants: {}
    precision: "integer cents; floor on the 50/50 split so the remainder cent is explicitly assigned"

  - name: buyer_committed_capital
    entity: CashBuyer
    description: >-
      Reconciles a buyer's verified liquidity against the deposits their live offers encumber, so
      that a buyer cannot commit the same dollars to two contracts and so that the tier returns
      to its pre-offer value once an offer dies.
    trigger: "POST /proof-of-funds/{proof_of_funds_id}/verify; every AssignmentOffer create, revise, accept, withdraw and lapse; the contract-cancellation cascade; the logical clock advancing past a proof-of-funds expiry"
    inputs:
      - the buyer's ProofOfFunds rows (verification_status, verified_funds_cents, expires_at)
      - the buyer's AssignmentOffer rows (status, buyer_deposit_cents)
      - current_utc
    algorithm: aggregation
    formula: |
      LIVE_OFFER_STATUSES = {SUBMITTED, COUNTERED_BY_WHOLESALER, REVISED_BY_BUYER, ACCEPTED}
        (CONSUMED, WITHDRAWN and LAPSED offers release their deposit)

      verified_funds_cents = MAX(p.verified_funds_cents) over the buyer's ProofOfFunds rows with
                             p.verification_status == VERIFIED AND p.expires_at > current_utc
                             (0 when no such row exists — proofs do not stack)

      INVARIANT Q2 (must hold after every request that touches the buyer's offers):
        committed_deposit_cents == SUM(o.buyer_deposit_cents)
                                   over the buyer's AssignmentOffer rows whose status is in
                                   LIVE_OFFER_STATUSES
      active_offer_count       == COUNT of those same rows

      available_funds_cents = verified_funds_cents - committed_deposit_cents

      buyer_tier =
        SUSPENDED if verified_funds_cents == 0
        PRIORITY  if available_funds_cents >= PRIORITY_TIER_MIN_AVAILABLE_CENTS
        STANDARD  otherwise
      The PRIORITY comparison is inclusive at the threshold.
    constants:
      PRIORITY_TIER_MIN_AVAILABLE_CENTS: 25000000
    precision: "integer cents; no rounding — pure summation"

  - name: contract_deadlines
    entity: PurchaseContract
    description: >-
      Derives the two deadlines that gate cancellation and assignment. The inspection window is
      half-open on the right, so the last instant of the window is still inside it; the
      assignment cutoff is a backward offset from the earliest permitted close.
    trigger: POST /purchase-contracts/{purchase_contract_id}/sign (inspection deadline) and POST /purchase-contracts (assignment deadline)
    inputs:
      - PurchaseContract.signed_at
      - PurchaseContract.inspection_period_days
      - PurchaseContract.closing_window_start_at
    algorithm: chronological
    formula: |
      inspection_deadline_at = signed_at + inspection_period_days * 24 hours
        Wholesaler-initiated cancellation is permitted while current_utc <  inspection_deadline_at
        and is rejected once        current_utc >= inspection_deadline_at.
        Earnest-money forfeiture is the mirror image: permitted only once
                                    current_utc >= inspection_deadline_at.

      assignment_deadline_at = closing_window_start_at - ASSIGNMENT_CUTOFF_HOURS
        Offer acceptance and agreement execution are permitted while
                                    current_utc <  assignment_deadline_at
        and are rejected once       current_utc >= assignment_deadline_at.

      PROTECTED-tier cooling off:
        cooling_off_ends_at = SellerLead.screened_at + PROTECTED_COOLING_OFF_HOURS
        When the lead's protection_tier == PROTECTED, offer acceptance and agreement execution
        are rejected while current_utc < cooling_off_ends_at.

      DOUBLE_CLOSE funding buffer:
        buffered_window_end_at = TitleOrder.funding_window_end_at + DOUBLE_CLOSE_BUFFER_HOURS
    constants:
      ASSIGNMENT_CUTOFF_HOURS: 48
      PROTECTED_COOLING_OFF_HOURS: 72
      DOUBLE_CLOSE_BUFFER_HOURS: 48
    precision: "whole seconds, UTC; all arithmetic against the logical clock exposed by POST /_clock/set_current_utc"

# =============================================================================
# §1.3.1 Resource / Temporal Overlap Rules
# Two overlap checks with deliberately different interval semantics.
# =============================================================================
resource_temporal_overlap_rules:
  - rule_id: double-close-funding-window
    resource_entity: Wholesaler
    interval_entity: TitleOrder
    interval_fields: [funding_window_start_at, funding_window_end_at]
    occupancy_filter: "TitleOrder.structure == DOUBLE_CLOSE AND TitleOrder.status IN {OPENED, CLEARED_TO_FUND}"
    capacity_field: Wholesaler.funding_window_capacity
    semantics: |
      Half-open on the right, PLUS a trailing buffer on each existing interval:
        buffered_window_end_at = funding_window_end_at + DOUBLE_CLOSE_BUFFER_HOURS (48h)
      A candidate interval conflicts with an existing one iff
        candidate.funding_window_start_at <  existing.buffered_window_end_at
        AND existing.funding_window_start_at < candidate.buffered_window_end_at
      Touching edges do NOT conflict: a candidate starting exactly at an existing buffered end
      is accepted. The request is rejected only when the number of conflicting occupants
      reaches Wholesaler.funding_window_capacity.
    error_id: ERR_FUNDING_WINDOW_CONFLICT
    http_status: 409
    checked_on: POST /title-orders

  - rule_id: property-occupancy
    resource_entity: SellerLead
    interval_entity: PurchaseContract
    interval_fields: [option_start_at, closing_window_end_at]
    occupancy_filter: "PurchaseContract.contract_status IN {DRAFT, SIGNED, PENDING_CLOSE}"
    capacity_field: null
    semantics: |
      Fully CLOSED intervals with no buffer and no capacity allowance — a property can be under
      exactly one live contract at a time, and adjacency collides:
        candidate.option_start_at      <= existing.closing_window_end_at
        AND candidate.closing_window_end_at >= existing.option_start_at
      A candidate whose option_start_at equals an existing contract's closing_window_end_at to
      the second IS a conflict; one second later is accepted. Terminal contracts (CLOSED,
      CANCELLED) release the property immediately.
    error_id: ERR_PROPERTY_OCCUPANCY_CONFLICT
    http_status: 409
    checked_on: POST /purchase-contracts

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first violation wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header absent, empty, or not one of the six declared roles; or X-User-ID absent on any endpoint whose actor identity is recorded or compared"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: Authentication is resolved before anything else, including path-id existence.

  - priority: 2
    category: auth
    check: "the caller's X-User-Role is not listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
    description: Role authorization precedes request-body validation and existence checks.

  - priority: 3
    category: business_constraint
    check: "malformed body: unknown-typed value, missing required field, enum value outside the declared set, integer outside its declared range, datetime not ISO-8601 UTC, closing_window_start_at not strictly after option_start_at, closing_window_end_at not strictly after closing_window_start_at, funding_window_end_at not strictly after funding_window_start_at, inspection_period_days outside 1..30, repair_scope_items element with high_cents < low_cents"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    description: Schema and range validation runs before any database lookup, so a malformed body against a non-existent id still returns 400.

  - priority: 4
    category: business_constraint
    check: "limit < 1, limit > 100, or offset < 0 on any list endpoint"
    error_id: ERR_PAGINATION_OUT_OF_RANGE
    http_status: 400
    applies_to:
      - "GET /wholesalers"
      - "GET /seller-leads"
      - "GET /purchase-contracts"
      - "GET /assignment-offers"
      - "GET /compliance-reviews"
      - "GET /marketing-campaigns"
      - "GET /cash-buyers"
      - "GET /deal-analyses"
      - "GET /earnest-money-deposits"
      - "GET /title-orders"
      - "GET /dispute-cases"
      - "GET /disclosure-acknowledgements"
      - "GET /proof-of-funds"
      - "GET /assignment-agreements"
    description: Pagination bounds are part of schema validation and are checked before the parent path id is resolved.

  - priority: 5
    category: existence
    check: "any templated path segment resolves to no row"
    error_id: "ERR_<ENTITY>_NOT_FOUND (see §1.6)"
    http_status: 404
    applies_to: all
    description: Path ids are resolved left to right, so a bad parent id is reported before a bad child id.

  - priority: 6
    category: existence
    check: "any foreign key supplied in the request body resolves to no row"
    error_id: "ERR_<ENTITY>_NOT_FOUND (see §1.6)"
    http_status: 404
    applies_to: [POST /marketing-campaigns, POST /seller-leads, POST /deal-analyses, POST /purchase-contracts, POST /cash-buyers, POST /assignment-offers, POST /assignment-agreements, POST /title-orders, POST /compliance-reviews, POST /dispute-cases]
    description: Body foreign keys are resolved after path ids, in the field order declared by the endpoint's input list.

  - priority: 7
    category: auth
    check: "the acting principal does not own the target aggregate — a Wholesaler acting on another wholesaler's lead, campaign, contract, buyer, offer, agreement or analysis; a Seller whose X-User-ID is not the target contract's seller_lead_id; a CashBuyer whose X-User-ID is not the target offer's cash_buyer_id; an AssignmentOffer whose cash_buyer_id belongs to a different Wholesaler than the contract"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to:
      - "POST /marketing-campaigns/{marketing_campaign_id}/publish"
      - "POST /marketing-campaigns/{marketing_campaign_id}/archive"
      - "POST /seller-leads/{seller_lead_id}/protection-screen"
      - "POST /deal-analyses"
      - "POST /deal-analyses/{deal_analysis_id}/finalize"
      - "POST /purchase-contracts"
      - "POST /purchase-contracts/{purchase_contract_id}/sign"
      - "POST /purchase-contracts/{purchase_contract_id}/elect-structure"
      - "POST /purchase-contracts/{purchase_contract_id}/cancel"
      - "POST /disclosure-acknowledgements"
      - "POST /proof-of-funds"
      - "POST /proof-of-funds/{proof_of_funds_id}/verify"
      - "POST /assignment-offers"
      - "POST /assignment-offers/{assignment_offer_id}/counter"
      - "POST /assignment-offers/{assignment_offer_id}/revise"
      - "POST /assignment-offers/{assignment_offer_id}/accept"
      - "POST /assignment-agreements"
      - "POST /dispute-cases"
      - "POST /dispute-cases/{dispute_case_id}/submit-evidence"
    description: Ownership is an authorization concern and therefore outranks every state precondition.

  - priority: 8
    category: auth
    check: "the adjudicating X-User-ID equals ComplianceReview.opened_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to:
      - "POST /compliance-reviews/{compliance_review_id}/adjudicate"
    description: The officer who opened a review may never adjudicate it, even while the review is still OPENED.

  - priority: 9
    category: auth
    check: "the funding X-User-ID equals TitleOrder.cleared_by_user_id"
    error_id: ERR_DUAL_CONTROL_REQUIRED
    http_status: 403
    applies_to:
      - "POST /title-orders/{title_order_id}/fund-and-close"
    description: Clearing to fund and wiring the funds must be performed by two different title agents.

  - priority: 10
    category: state
    check: "expected_purchase_contract_version != PurchaseContract.version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: [POST /assignment-offers]
    description: Optimistic concurrency on the parent contract; rejected with no side effects.

  - priority: 11
    category: state
    check: "expected_seller_lead_version != SellerLead.version"
    error_id: ERR_STALE_LEAD_VERSION
    http_status: 412
    applies_to: [POST /deal-analyses]
    description: Optimistic concurrency on the parent lead; rejected with no side effects.

  - priority: 12
    category: state
    check: "the target entity is not in a state from which the requested trigger has an outgoing transition, and no more specific rule below covers the case (re-publishing a PUBLISHED campaign, archiving an ARCHIVED campaign, signing an already SIGNED contract, finalizing a FINALIZED or SUPERSEDED analysis, verifying an already-decided proof of funds, countering an ACCEPTED or terminal offer, revising an offer that is not COUNTERED_BY_WHOLESALER, settling an already SETTLED or TERMINATED_UPSTREAM agreement, clearing a title order that is not OPENED, funding a title order that is not CLEARED_TO_FUND, adjudicating an already-adjudicated review or dispute, submitting evidence twice for the same party, forfeiting a deposit that already left HELD)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all
    description: Generic state-machine guard; the more specific state rules at priorities 13 through 22 are checked first where they apply.

  - priority: 13
    category: state
    check: "the governing PurchaseContract.contract_status is CLOSED or CANCELLED"
    error_id: ERR_CONTRACT_TERMINAL
    http_status: 409
    applies_to:
      - "POST /purchase-contracts/{purchase_contract_id}/sign"
      - "POST /purchase-contracts/{purchase_contract_id}/elect-structure"
      - "POST /disclosure-acknowledgements"
      - "POST /assignment-offers"
      - "POST /assignment-offers/{assignment_offer_id}/counter"
      - "POST /assignment-offers/{assignment_offer_id}/revise"
      - "POST /assignment-offers/{assignment_offer_id}/accept"
      - "POST /assignment-agreements"
      - "POST /assignment-agreements/{assignment_agreement_id}/settle"
      - "POST /title-orders"
      - "POST /title-orders/{title_order_id}/clear-to-fund"
      - "POST /title-orders/{title_order_id}/fund-and-close"
    description: >-
      Deliberately NOT applied to POST /dispute-cases, POST /dispute-cases/{id}/submit-evidence,
      POST /dispute-cases/{id}/adjudicate or POST /earnest-money-deposits/{id}/forfeit — a seller
      must still be able to open and prosecute a dispute over a cancelled deal, and escrow must
      still be dispositive after cancellation.

  - priority: 14
    category: state
    check: "the referenced MarketingCampaign.status is not PUBLISHED"
    error_id: ERR_CAMPAIGN_NOT_PUBLISHED
    http_status: 409
    applies_to: [POST /seller-leads]
    description: A lead may only be attributed to a campaign that was live when the lead arrived; omitting marketing_campaign_id skips this check entirely.

  - priority: 15
    category: state
    check: "the referenced SellerLead.status is PROSPECT or CLOSED"
    error_id: ERR_LEAD_NOT_SCREENED
    http_status: 409
    applies_to: [POST /purchase-contracts]
    description: >-
      A lead must have been protection-screened before it can be put under contract, and a closed
      lead can never be re-contracted. A lead already UNDER_CONTRACT passes this rule, so a
      non-overlapping backup contract is reachable and the occupancy conflict at priority 34 is
      the rule that actually rejects double encumbrance.

  - priority: 16
    category: state
    check: "the referenced DealAnalysis.status is not FINALIZED, or the analysis references a different seller_lead_id than the contract"
    error_id: ERR_DEAL_ANALYSIS_NOT_FINALIZED
    http_status: 409
    applies_to: [POST /purchase-contracts]
    description: A contract price can only be justified against a finalized underwriting of the same property.

  - priority: 17
    category: state
    check: "the governing PurchaseContract.contract_status is DRAFT (never signed)"
    error_id: ERR_CONTRACT_NOT_SIGNED
    http_status: 409
    applies_to:
      - "POST /assignment-offers"
      - "POST /title-orders"
      - "POST /earnest-money-deposits/{earnest_money_deposit_id}/forfeit"
    description: Nothing may be marketed, escrowed out or coordinated with title until the seller has signed.

  - priority: 18
    category: state
    check: "the bidding CashBuyer has no ProofOfFunds row with verification_status == VERIFIED"
    error_id: ERR_POF_NOT_VERIFIED
    http_status: 409
    applies_to:
      - "POST /assignment-offers/{assignment_offer_id}/accept"
    description: Checked before the expiry rule at priority 33, so an unverified proof reports as unverified rather than as expired.

  - priority: 19
    category: state
    check: "the referenced AssignmentOffer.status is not ACCEPTED"
    error_id: ERR_OFFER_NOT_ACCEPTED
    http_status: 409
    applies_to: [POST /assignment-agreements]
    description: An agreement can only paper an accepted offer; this outranks every fiscal check on the same request.

  - priority: 20
    category: state
    check: "TitleOrder.structure == ASSIGNMENT and the contract's assignment_status != ASSIGNED"
    error_id: ERR_CONTRACT_NOT_ASSIGNED
    http_status: 409
    applies_to:
      - "POST /title-orders/{title_order_id}/clear-to-fund"
    description: An assignment-structured closing may not be cleared to fund until the assignment has actually been executed.

  - priority: 21
    category: state
    check: "the EarnestMoneyDeposit is not in the status the requested disposition requires"
    error_id: ERR_DEPOSIT_NOT_HELD
    http_status: 409
    applies_to:
      - "POST /earnest-money-deposits/{earnest_money_deposit_id}/forfeit"
      - "POST /dispute-cases/{dispute_case_id}/adjudicate"
    description: Forfeiture requires status HELD; dispute adjudication requires status FORFEITED_TO_SELLER.

  - priority: 22
    category: state
    check: "DisputeCase.seller_evidence_ref or DisputeCase.wholesaler_evidence_ref is null"
    error_id: ERR_EVIDENCE_INCOMPLETE
    http_status: 409
    applies_to:
      - "POST /dispute-cases/{dispute_case_id}/adjudicate"
    description: "The fork-join is enforced: both parties must have filed before the officer may rule."

  - priority: 23
    category: business_safety
    check: "the governing Wholesaler.compliance_hold == true"
    error_id: ERR_WHOLESALER_COMPLIANCE_HOLD
    http_status: 403
    applies_to:
      - "POST /marketing-campaigns"
      - "POST /marketing-campaigns/{marketing_campaign_id}/publish"
      - "POST /seller-leads"
      - "POST /seller-leads/{seller_lead_id}/protection-screen"
      - "POST /purchase-contracts"
      - "POST /assignment-offers/{assignment_offer_id}/accept"
      - "POST /assignment-agreements"
    description: A wholesaler under a compliance hold may not originate new business or execute assignments, but may still cancel, cooperate with disputes and let existing closings settle.

  - priority: 24
    category: business_safety
    check: "MarketingCampaign.discloses_intent_to_assign == false"
    error_id: ERR_INTENT_TO_ASSIGN_NOT_DISCLOSED
    http_status: 422
    applies_to:
      - "POST /marketing-campaigns/{marketing_campaign_id}/publish"
    description: Marketing that solicits sellers without disclosing an intent to assign is prohibited.

  - priority: 25
    category: business_safety
    check: "the owning Wholesaler.licensure_status == UNLICENSED and MarketingCampaign.discloses_unlicensed_status == false"
    error_id: ERR_LICENSURE_DISCLOSURE_MISSING
    http_status: 422
    applies_to:
      - "POST /marketing-campaigns/{marketing_campaign_id}/publish"
    description: An unlicensed wholesaler must say so in the creative; a licensed agent or broker need not.

  - priority: 26
    category: business_safety
    check: "MarketingCampaign.channel IN {SMS, COLD_CALL} and dnc_scrubbed == false"
    error_id: ERR_DNC_SCRUB_REQUIRED
    http_status: 422
    applies_to:
      - "POST /marketing-campaigns/{marketing_campaign_id}/publish"
    description: Conditional validation — the scrub is only required for the two telephonic channels.

  - priority: 27
    category: business_safety
    check: "no DisclosureAcknowledgement exists for the contract with acknowledged_intent_to_assign == true, or the owning Wholesaler is UNLICENSED and no acknowledgement has acknowledged_unlicensed_status == true, or the acknowledgement's disclosure_template_version differs from the wholesaler's current disclosure_template_version"
    error_id: ERR_DISCLOSURE_ACKNOWLEDGEMENT_MISSING
    http_status: 422
    applies_to:
      - "POST /purchase-contracts/{purchase_contract_id}/sign"
    description: The seller must have acknowledged the current disclosure packet before the contract can be signed.

  - priority: 28
    category: business_safety
    check: "the lead's protection_tier IN {ELEVATED, PROTECTED} and purchase_price_cents < floor((estimated_market_value_cents - recorded_senior_lien_cents) * EQUITY_FLOOR_PCT) + recorded_senior_lien_cents"
    error_id: ERR_EQUITY_SKIMMING_PROHIBITED
    http_status: 422
    applies_to: [POST /purchase-contracts]
    description: >-
      A protected seller must be left at least EQUITY_FLOOR_PCT (0.60) of their statutory equity
      above the senior lien. Conditional validation — STANDARD-tier leads are exempt. This safety
      rule deliberately outranks the fiscal max-allowable-offer ceiling at priority 40.

  - priority: 29
    category: business_safety
    check: "the lead's protection_tier == PROTECTED and current_utc < SellerLead.screened_at + PROTECTED_COOLING_OFF_HOURS"
    error_id: ERR_COOLING_OFF_NOT_ELAPSED
    http_status: 422
    applies_to:
      - "POST /assignment-offers/{assignment_offer_id}/accept"
      - "POST /assignment-agreements"
    description: >-
      A protected seller gets a 72-hour cooling-off window measured from the screen, during which
      the wholesaler may not monetise the contract. Deliberately ranked above the temporal
      assignment-deadline rule at priority 32, so a request that is both inside the cooling-off
      window and past the assignment cutoff reports the seller-protection failure.

  - priority: 30
    category: business_safety
    check: "the owning Wholesaler.licensure_status == UNLICENSED and the requested action would have the wholesaler negotiate on the seller's behalf — namely countering an offer on a contract whose assignment_rights_granted == false, or executing an ASSIGNMENT-structured agreement on such a contract"
    error_id: ERR_UNLICENSED_BROKERAGE_ACTIVITY
    http_status: 422
    applies_to:
      - "POST /assignment-offers/{assignment_offer_id}/counter"
      - "POST /assignment-agreements"
    description: Without assignment rights an unlicensed wholesaler brokering the resale crosses the licensure boundary; the compliant path is a double close.

  - priority: 31
    category: business_temporal
    check: "wholesaler-initiated cancellation with current_utc >= inspection_deadline_at; or forfeiture with current_utc < inspection_deadline_at"
    error_id: ERR_INSPECTION_PERIOD_EXPIRED
    http_status: 409
    applies_to:
      - "POST /purchase-contracts/{purchase_contract_id}/cancel"
      - "POST /earnest-money-deposits/{earnest_money_deposit_id}/forfeit"
    description: Half-open window — the wholesaler may cancel at any instant strictly before the deadline and forfeiture becomes available at exactly the deadline. Seller- and ComplianceOfficer-initiated cancellation is not time-boxed.

  - priority: 32
    category: business_temporal
    check: "current_utc >= PurchaseContract.assignment_deadline_at"
    error_id: ERR_ASSIGNMENT_DEADLINE_PASSED
    http_status: 409
    applies_to:
      - "POST /assignment-offers/{assignment_offer_id}/accept"
      - "POST /assignment-agreements"
    description: Assignment must be locked in at least ASSIGNMENT_CUTOFF_HOURS (48h) before the earliest permitted close.

  - priority: 33
    category: business_temporal
    check: "the buyer's only VERIFIED ProofOfFunds rows all have expires_at <= current_utc; or a verify request targets a proof whose expires_at <= current_utc"
    error_id: ERR_PROOF_OF_FUNDS_EXPIRED
    http_status: 422
    applies_to:
      - "POST /assignment-offers/{assignment_offer_id}/accept"
      - "POST /proof-of-funds/{proof_of_funds_id}/verify"
    description: Expiry is exclusive at the boundary — a proof expiring exactly at current_utc is already stale.

  - priority: 34
    category: business_temporal
    check: "the candidate option-to-closing interval collides with a live PurchaseContract interval on the same SellerLead per §1.3.1 property-occupancy"
    error_id: ERR_PROPERTY_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: [POST /purchase-contracts]
    description: Closed intervals with no buffer — adjacency collides.

  - priority: 35
    category: business_temporal
    check: "the candidate DOUBLE_CLOSE funding window collides with at least Wholesaler.funding_window_capacity live buffered windows per §1.3.1 double-close-funding-window"
    error_id: ERR_FUNDING_WINDOW_CONFLICT
    http_status: 409
    applies_to: [POST /title-orders]
    description: Half-open intervals extended by a 48-hour trailing buffer, gated by an explicit capacity field.

  - priority: 36
    category: business_referential
    check: "AssignmentAgreement.structure does not match the contract's structure_election (ASSIGNMENT requires ASSIGNMENT_ELECTED, DOUBLE_CLOSE requires DOUBLE_CLOSE_ELECTED); or structure_election is still UNDECIDED"
    error_id: ERR_STRUCTURE_MISMATCH
    http_status: 409
    applies_to: [POST /assignment-agreements]
    description: The papered structure must match the elected structure exactly.

  - priority: 37
    category: business_constraint
    check: "AssignmentOffer.negotiation_round >= MAX_NEGOTIATION_ROUNDS (4)"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 409
    applies_to:
      - "POST /assignment-offers/{assignment_offer_id}/counter"
      - "POST /assignment-offers/{assignment_offer_id}/revise"
    description: The counter/revise cycle terminates after four rounds; acceptance is still available on the fourth-round offer.

  - priority: 38
    category: business_constraint
    check: "DealAnalysis.qualifying_comp_count < MIN_QUALIFYING_COMPS (3)"
    error_id: ERR_INSUFFICIENT_QUALIFYING_COMPS
    http_status: 422
    applies_to:
      - "POST /deal-analyses/{deal_analysis_id}/finalize"
    description: An analysis cannot be finalized on fewer than three comparables that pass the distance, recency and size filters.

  - priority: 39
    category: business_constraint
    check: "the same CashBuyer already has an AssignmentOffer on the same PurchaseContract in a live status, and the request does not supersede it via supersedes_offer_id"
    error_id: ERR_DUPLICATE_ACTIVE_OFFER
    http_status: 409
    applies_to: [POST /assignment-offers]
    description: One live offer per buyer per contract; a buyer improves a bid by superseding, not by stacking.

  - priority: 40
    category: business_fiscal
    check: "purchase_price_cents > the referenced DealAnalysis.max_allowable_offer_cents"
    error_id: ERR_MAO_EXCEEDED
    http_status: 422
    applies_to: [POST /purchase-contracts]
    description: The finalized underwriting ceiling is binding, and which ceiling applies depends on the variant the analysis was finalized under.

  - priority: 41
    category: business_fiscal
    check: "buyer_price_cents < the contract's purchase_price_cents"
    error_id: ERR_OFFER_BELOW_CONTRACT_PRICE
    http_status: 422
    applies_to:
      - "POST /assignment-offers"
      - "POST /assignment-offers/{assignment_offer_id}/revise"
    description: An assignment can never be sold for less than the wholesaler owes the seller.

  - priority: 42
    category: business_fiscal
    check: "buyer_deposit_cents > the buyer's available_funds_cents, or buyer_price_cents > the buyer's verified_funds_cents"
    error_id: ERR_INSUFFICIENT_VERIFIED_FUNDS
    http_status: 422
    applies_to:
      - "POST /assignment-offers"
      - "POST /assignment-offers/{assignment_offer_id}/revise"
    description: Aggregate validation — each individual offer may look affordable while the buyer's live deposits collectively exceed verified liquidity. On a superseding offer the superseded offer's deposit is released first, so the replacement is measured against the freed capacity.

  - priority: 43
    category: business_fiscal
    check: "the implied assignment fee exceeds the protection-tier cap per §1.3 assignment_fee_cap"
    error_id: ERR_ASSIGNMENT_FEE_CAP_EXCEEDED
    http_status: 422
    applies_to:
      - "POST /assignment-offers/{assignment_offer_id}/accept"
      - "POST /assignment-agreements"
    description: Strict comparison — a fee landing exactly on the cap is permitted. Lowest priority of all, so any state or safety failure on the same request masks it.

# =============================================================================
# §1.5 API Endpoint Table
# api_prefix is "/", so every aggregate root is a top-level collection and every
# child is reverse-reachable through its own filtered list endpoint.
# Path ids are always named <entity>_id. Query/body fields ending in `?` are optional.
# =============================================================================
endpoints:

  # ---- Wholesaler -----------------------------------------------------------
  - method: POST
    path: /wholesalers
    description: Register a wholesaling entity with its licensure posture and disclosure template version.
    roles: [PlatformAdmin]
    success_code: 201
    input: ["legal_name", "state_code", "disclosure_template_version", "licensure_status?", "funding_window_capacity?"]
    output: Wholesaler
    side_effects:
      - "initialise adverse_finding_count 0, compliance_hold false, executed_assignment_count 0"

  - method: GET
    path: /wholesalers/{wholesaler_id}
    description: Read one wholesaler with its live compliance counters.
    roles: [Wholesaler, Seller, CashBuyer, TitleAgent, ComplianceOfficer, PlatformAdmin]
    success_code: 200
    input: []
    output: Wholesaler
    side_effects: []

  - method: GET
    path: /wholesalers
    description: Paginated wholesaler roster for platform and compliance staff.
    roles: [ComplianceOfficer, PlatformAdmin]
    success_code: 200
    input: ["state_code?", "licensure_status?", "limit?", "offset?"]
    output: Wholesaler[]
    side_effects: []

  # ---- MarketingCampaign ----------------------------------------------------
  - method: POST
    path: /marketing-campaigns
    description: Draft a seller-acquisition campaign for one wholesaler.
    roles: [Wholesaler]
    success_code: 201
    input: ["wholesaler_id", "channel", "headline", "target_state_code", "discloses_intent_to_assign?", "discloses_unlicensed_status?", "dnc_scrubbed?"]
    output: MarketingCampaign
    side_effects:
      - "campaign enters status DRAFT with suspension_count 0"

  - method: GET
    path: /marketing-campaigns/{marketing_campaign_id}
    description: Read one marketing campaign.
    roles: [Wholesaler, Seller, CashBuyer, TitleAgent, ComplianceOfficer, PlatformAdmin]
    success_code: 200
    input: []
    output: MarketingCampaign
    side_effects: []

  - method: GET
    path: /marketing-campaigns
    description: Filtered, paginated campaign list; reverse lookup for MarketingCampaign.wholesaler_id.
    roles: [Wholesaler, ComplianceOfficer, PlatformAdmin]
    success_code: 200
    input: ["wholesaler_id?", "status?", "channel?", "limit?", "offset?"]
    output: MarketingCampaign[]
    side_effects: []

  - method: POST
    path: /marketing-campaigns/{marketing_campaign_id}/publish
    description: Publish a drafted or previously suspended campaign after the disclosure and do-not-call gates pass.
    roles: [Wholesaler]
    success_code: 200
    input: []
    output: MarketingCampaign
    side_effects:
      - "set published_at and status PUBLISHED"
      - "recompute lead_gen_blocked on the campaign's leads"

  - method: POST
    path: /marketing-campaigns/{marketing_campaign_id}/archive
    description: Retire a campaign permanently.
    roles: [Wholesaler]
    success_code: 200
    input: []
    output: MarketingCampaign
    side_effects:
      - "status ARCHIVED, a terminal state"

