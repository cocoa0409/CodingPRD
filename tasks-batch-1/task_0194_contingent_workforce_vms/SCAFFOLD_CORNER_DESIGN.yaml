            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${sup_id}"] }
              as: ProgramManager
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${sup_id}", worker_profile_id: "${wkr_id}", pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vms/submittals/${sub_id}/shortlist"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/start_interview"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/propose_rate"
              payload: { pay_rate_cents: 8001 }
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/submittals/${sub_id}/counter_rate"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/propose_rate"
              payload: { pay_rate_cents: 8002 }
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/submittals/${sub_id}/counter_rate"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/propose_rate"
              payload: { pay_rate_cents: 8003 }
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/submittals/${sub_id}/counter_rate"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/propose_rate"
              payload: { pay_rate_cents: 8004 }
              as: Supplier
