  - section: endpoints
    instances:
      - name: off_enum_status_filter_returns_an_empty_page_not_an_enum_error
        claim_type: Standard CRUD
        grounds: ['endpoints["GET /engagements"]', 'validations[priority=6]', 'entities.Engagement.fields.status']
        distinguishing_aspect: "Rung 6's enum list is closed and names no list-filter parameter, so status=ARCHIVED on GET /engagements returns 200 with total_count 0 rather than 400 ERR_INVALID_ENUM, while status=ACTIVE returns the one engagement."
        test_recipe:
          setup: ["One ACTIVE HOURLY STUDIO engagement."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
          trigger:
            - call: "GET /engagements"
              payload: { status: "ARCHIVED" }
              as: MOVE_MANAGER
            - call: "GET /engagements"
              payload: { status: "ACTIVE" }
              as: MOVE_MANAGER
            - call: "GET /engagements"
              payload: { client_id: "${cl}" }
              as: MOVE_MANAGER
          assert:
            - "the status=ARCHIVED read responds 200 with total_count == 0 and has_more == false"
            - "the status=ACTIVE read responds 200 with total_count == 1 and data[0].id == ${eng}"
            - "the client_id read responds 200 with total_count == 1"
            - "no call in the trigger returns ERR_INVALID_ENUM"

      - name: milestone_list_orders_by_sequence_index_while_invoice_lines_order_by_created_at
        claim_type: Standard CRUD
        grounds: ['endpoints["GET /milestones"]', 'endpoints["GET /invoice-lines"]', 'entities.Milestone.fields.sequence_index', 'calculations.invoice_subtotal']
        distinguishing_aspect: "GET /milestones returns the six rows in sequence_index ascending order so index 0 is ASSESSMENT and index 5 is CLOSE_OUT, whereas GET /invoice-lines returns lines in created_at ascending order so the PACKAGE_BASE line minted at engagement creation precedes both manual adjustments in the order they were appended."
        test_recipe:
          setup: ["One PACKAGE STUDIO engagement whose invoice carries the PACKAGE_BASE line plus two manual adjustments appended in a known order."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "PACKAGE", package_tier: "STUDIO", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "GET /invoices"
              payload: { engagement_id: "${eng}" }
              as: BILLING_ADMIN
              captures: { inv: "$.data[0].id", invv: "$.data[0].version" }
            - call: "POST /invoice-lines"
              payload: { invoice_id: "${inv}", line_type: "MANUAL_ADJUSTMENT", amount_cents: 1000, memo: "adjustment one", expected_invoice_version: "${invv}" }
              as: BILLING_ADMIN
            - call: "GET /invoices/${inv}"
              payload: {}
              as: BILLING_ADMIN
              captures: { invv2: "$.data.version" }
            - call: "POST /invoice-lines"
              payload: { invoice_id: "${inv}", line_type: "MANUAL_ADJUSTMENT", amount_cents: 2000, memo: "adjustment two", expected_invoice_version: "${invv2}" }
              as: BILLING_ADMIN
          trigger:
            - call: "GET /milestones"
              payload: { engagement_id: "${eng}" }
              as: MOVE_MANAGER
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv}" }
              as: BILLING_ADMIN
          assert:
            - "the milestone read returns total_count == 6 with data[0].milestone_key == ASSESSMENT and data[0].sequence_index == 1"
            - "the milestone read returns data[5].milestone_key == CLOSE_OUT and data[5].sequence_index == 6"
            - "the invoice-line read returns total_count == 3"
            - "data[0].line_type == PACKAGE_BASE and data[0].amount_cents == 185000"
            - "data[1].memo == adjustment one and data[2].memo == adjustment two"
            - "Invoice.${inv}.subtotal_cents == 188000"

