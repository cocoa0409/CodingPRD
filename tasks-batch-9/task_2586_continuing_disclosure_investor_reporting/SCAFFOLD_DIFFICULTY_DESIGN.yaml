            - "hop 5: ${billable_after} == 1 and ${invoice_after} == 300000 — subtotal 250000 + 45000 == 295000 is raised by the floor, so the floor is provably applied"
            - "cross-aggregate hop: ${os_count_after} == 1 and ${os_adeq_after} == INCOMPLETE, even though the official statement belongs to a DIFFERENT BondIssue in the same issuer_program_code"
            - "OfficialStatement.${os_id}.required_disclosure_event_ids == [\"${fte_id}\"]"
            - "POST /disclosure/official-statements/${os_id}/post as ComplianceReviewer rev-2 now returns ERR_DISCLOSURE_INADEQUATE (409) — the failure minted between review and posting blocks the post"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_precondition_at_priority_8_outranks_engagement_not_active_at_11
        grounds:
          - validations.priority_8_ERR_INVALID_STATE_TRANSITION
          - validations.priority_11_ERR_ENGAGEMENT_NOT_ACTIVE
          - state_machines.DisseminationEngagement.ACTIVE_to_SUSPENDED
          - calculations.engagement_monitoring_lapse
        distinguishing_aspect: |
          Two confirm calls made through the SAME suspended engagement in the same state of the
          world differ only in the target filing's own status, and that alone decides which error
          surfaces: the CONFIRMED filing yields priority 8's ERR_INVALID_STATE_TRANSITION even
          though priority 11 is equally violated, while the SUBMITTED filing yields priority 11's
          ERR_ENGAGEMENT_NOT_ACTIVE. Both are HTTP 409, so an implementation cannot pass by
          guessing from the status code.
        test_recipe:
          setup:
            - "One BondIssue with one Undertaking, one 10000-bp ContentRequirement, and one DisseminationEngagement whose effective_date and last_calendar_ack_date are both 2026-07-01."
            - "Filing 1 is an ANNUAL_REPORT for cycle FY2025 (due 2026-01-26); it was submitted and CONFIRMED at clock 2026-07-05."
            - "Filing 2 is a MATERIAL_EVENT_NOTICE for a MATERIAL notice (occurrence 2026-07-01, deadline 2026-07-16); it was submitted at clock 2026-07-05 and is still SUBMITTED."
            - "The clock then moves to 2026-08-20 and a calendar sweep runs: monitoring_lapse_days is 50 > 45, so the engagement is SUSPENDED. Filing 2's notice is FILING_IN_PROGRESS, not MATERIAL, so sweep step 3 leaves it alone."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "COUNTYGO", series_designation: "2015A", security_type: "GENERAL_OBLIGATION", dated_date: "2015-08-01", final_maturity_date: "2045-08-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id", und_v: "$.data.version" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 10000, waivable: false }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_id}", agent_name: "Lakeside Agent Group", effective_date: "2026-07-01", expiration_date: "2027-12-31", retainer_cents: 250000, last_calendar_ack_date: "2026-07-01", expected_undertaking_version: "${und_v}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_id: "$.data.id" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2025", period_start_date: "2024-07-01", period_end_date: "2025-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_id: "$.data[0].id" }
            - call: "PATCH /disclosure/cycle-content-items/${item_id}"
              payload: { data_as_of_date: "2025-06-30", source_document_ref: "OPDATA-FY2025.pdf" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/cycle-content-items/${item_id}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/annual-report-cycles/${cycle_id}/assemble"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-asm"
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { iv1: "$.data.version" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_id}", filing_type: "ANNUAL_REPORT", cycle_id: "${cycle_id}", expected_issue_version: "${iv1}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { filing1_id: "$.data.id" }
            - call: "POST /disclosure/filings/${filing1_id}/submit"
              payload: {}
              as: DisseminationAgent
              as_user_id: "${eng_id}"
            - call: "POST /disclosure/filings/${filing1_id}/confirm"
              payload: { repository_receipt_id: "EMMA-CG-2026-0001" }
              as: DisseminationAgent
              as_user_id: "${eng_id}"
              captures: { filing1_status: "$.data.status" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "UNSCHEDULED_DRAW_ON_RESERVE", occurrence_date: "2026-07-01" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { notice_id: "$.data.id", notice_deadline: "$.data.filing_deadline_date" }
            - call: "POST /disclosure/material-event-notices/${notice_id}/determine"
              payload: { determination: "MATERIAL", determination_note: "Reserve draw is material." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { iv2: "$.data.version" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_id}", filing_type: "MATERIAL_EVENT_NOTICE", material_event_id: "${notice_id}", expected_issue_version: "${iv2}" }
              as: DisclosureOfficer
