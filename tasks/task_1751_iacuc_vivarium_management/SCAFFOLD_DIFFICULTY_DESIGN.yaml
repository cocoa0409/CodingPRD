              as: Investigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /iacuc/cages"
              payload: { cage_barcode: "RAT-CAGE", room_code: "VIV-301", species: "RAT", cage_kind: "STANDARD", capacity_adults: 2, protocol_id: "${proto_id}" }
              as: FacilityManager
              captures: { cage_id: $.data.id }
          trigger:
            - call: "POST /iacuc/animals"
              payload: { animal_tag: "X-1", cage_id: "${cage_id}", protocol_id: "${proto_id}", species: "MOUSE", date_of_birth: "2026-05-01T00:00:00Z", sex: "M" }
              as: AnimalCareStaff
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_PROTOCOL_NOT_APPROVED (409), not ERR_CAGE_MISMATCH (422)"
            - "No Animal row created (GET /iacuc/protocols/${proto_id}/animals is empty)"


  # ===========================================================================
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: animal_cap_at_exact_max
        grounds:
          - calculations.protocol_animal_cap
          - validations[priority=10]
          - errors[ERR_ANIMAL_CAP_EXCEEDED]
        distinguishing_aspect: |
          Numeric threshold boundary: with max_animals_justified == 2 and
          animals_used_count == 2, adding one more animal is rejected (>= not >);
          the second animal at count 1→2 succeeds — the boundary is exactly at
          the cap on POST /iacuc/animals.
        test_recipe:
          setup:
            - "APPROVED mouse protocol with max_animals_justified == 2"
            - "Cage capacity 5; 2 animals already added"
          setup_api_calls:
            - call: "POST /iacuc/investigators"
