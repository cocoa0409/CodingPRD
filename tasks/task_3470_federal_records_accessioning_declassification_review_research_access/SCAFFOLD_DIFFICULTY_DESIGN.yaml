# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3470_federal_records_accessioning_declassification_review_research_access
# Nine Difficulty Rules x 2 instances each, grounded in SCAFFOLD.yaml §1.1-§1.7.
# Logical-clock default: 2026-09-01T00:00:00Z (startup default per §1.5 clock endpoint).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: reproduction_fee_rounding_order_divergence
        grounds:
          - calculations.reproduction_fee
          - entities.ReproductionRequest.fields.fee_cents
        distinguishing_aspect: |
          Two defensible compositions of the academic discount and the rush multiplier
          yield different cents for identical inputs; the scaffold pins discount-per-tier
          THEN rush (canonical, entity domain: reproduction charging), so 25 ACADEMIC
          rush pages cost 2360 cents, not the 2359 cents the rush-first reading gives.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agency DOJ with an APPROVED FEDERAL PERMANENT schedule (classification NONE); a PHYSICAL transfer accessioned into a DESCRIBED, PUBLIC collection with 50 units; researcher Ada (ACADEMIC) ACTIVE."
          setup_api_calls:
            - &d_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - &d_ag_doj
              call: "POST /records/agencies"
              payload: { agency_code: "DOJ", name: "Department of Justice" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_doj: $.data.id }
            - &d_sch_s2_create
              call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-002", title: "Administrative Program Files", records_domain: "FEDERAL", disposition: "PERMANENT", transfer_lag_years: 20, classification_default: "NONE" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { sch_s2: $.data.id }
            - &d_sch_s2_submit
              call: "POST /records/schedules/${sch_s2}/submit"
              payload: {}
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - &d_sch_s2_appraise
              call: "POST /records/schedules/${sch_s2}/appraise"
              payload: { appraisal_recommendation: "APPROVE" }
              as: AppraisalArchivist
              as_user_id: "arch-ap-1"
            - &d_sch_s2_decide
              call: "POST /records/schedules/${sch_s2}/decide"
              payload: { decision: "APPROVE", decision_note: "permanent value confirmed" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
            - &d_tr_t2_create
              call: "POST /records/transfers"
              payload: { schedule_id: "${sch_s2}", agency_id: "${ag_doj}", transfer_method: "PHYSICAL", metadata_standard: "EAD_2002", unit_count: 50, records_cutoff_date: "2001-03-15T00:00:00Z", linear_feet: 12.5 }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { tr_t2: $.data.id }
            - &d_tr_t2_meta
              call: "POST /records/transfers/${tr_t2}/submit-metadata"
              payload: { metadata_elements: ["title", "creator", "date_span", "extent"] }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - &d_tr_t2_accession
              call: "POST /records/transfers/${tr_t2}/accession"
              payload: { receipt_note: "condition report CR-77 filed" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_c2: $.data.collection_id }
            - &d_col_c2_begin
              call: "POST /records/collections/${col_c2}/begin-processing"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - &d_col_c2_describe
              call: "POST /records/collections/${col_c2}/complete-description"
              payload: { scope_note: "case files 1995-2001", arrangement_note: "alphabetical", container_list_summary: "50 boxes" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - &d_res_ada
              call: "POST /records/researchers"
              payload: { full_name: "Ada Research", email: "ada@example.org", affiliation: "ACADEMIC", id_document: "DL-1001" }
              as: Anonymous
              captures: { res_ada: $.data.id }
            - &d_res_ada_act
              call: "POST /records/researchers/${res_ada}/activate"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
          trigger:
            - call: "POST /records/reproduction-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c2}", page_count: 25, format: "DIGITAL_SCAN", rush: true }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { rr_id: $.data.id, fee: $.data.fee_cents }
          assert:
            - "the response status is 201"
            - "ReproductionRequest.${rr_id}.fee_cents == 2360 (tier1 20*80=1600 -> 1360 after 0.85, tier2 5*50=250 -> 213 after round_half_up, sum 1573, rush 1573*1.5=2359.5 -> 2360)"
            - "ReproductionRequest.${rr_id}.fee_cents != 2359 (the rush-before-discount reading: 2040 + round_half_up(318.75)=319)"
            - "ReproductionRequest.${rr_id}.status == QUOTED"

      - name: digitization_priority_weighting_divergence
        grounds:
          - calculations.digitization_priority
          - entities.Collection.fields.digitization_priority
        distinguishing_aspect: |
          A second dual-variant calculation on a different entity domain (Collection
          digitization): the canonical DEMAND_WEIGHTED score and the AGE_WEIGHTED
          alternative rank identical inputs differently — a 30-year collection with
          no demand scores 60 canonically, not the 150 the age-weighted reading gives.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agency DOJ with one APPROVED FEDERAL PERMANENT NONE schedule; two accessioned, DESCRIBED, PUBLIC collections: A with records_cutoff_date 1996-03-15 (age 30) and B with 2001-03-15 (age 25); all demand counters zero; neither declassified."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-010", title: "Program Subject Files", records_domain: "FEDERAL", disposition: "PERMANENT", transfer_lag_years: 20, classification_default: "NONE" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { sch_s10: $.data.id }
            - call: "POST /records/schedules/${sch_s10}/submit"
              payload: {}
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - call: "POST /records/schedules/${sch_s10}/appraise"
              payload: { appraisal_recommendation: "APPROVE" }
              as: AppraisalArchivist
              as_user_id: "arch-ap-1"
            - call: "POST /records/schedules/${sch_s10}/decide"
              payload: { decision: "APPROVE" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
            - call: "POST /records/transfers"
              payload: { schedule_id: "${sch_s10}", agency_id: "${ag_doj}", transfer_method: "PHYSICAL", metadata_standard: "EAD_2002", unit_count: 20, records_cutoff_date: "1996-03-15T00:00:00Z", linear_feet: 5.0 }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { tr_a: $.data.id }
            - call: "POST /records/transfers/${tr_a}/submit-metadata"
              payload: { metadata_elements: ["title", "creator", "date_span", "extent"] }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - call: "POST /records/transfers/${tr_a}/accession"
              payload: { receipt_note: "received A" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_a: $.data.collection_id }
            - call: "POST /records/transfers"
              payload: { schedule_id: "${sch_s10}", agency_id: "${ag_doj}", transfer_method: "PHYSICAL", metadata_standard: "EAD_2002", unit_count: 20, records_cutoff_date: "2001-03-15T00:00:00Z", linear_feet: 5.0 }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { tr_b: $.data.id }
            - call: "POST /records/transfers/${tr_b}/submit-metadata"
              payload: { metadata_elements: ["title", "creator", "date_span", "extent"] }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - call: "POST /records/transfers/${tr_b}/accession"
              payload: { receipt_note: "received B" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_b: $.data.collection_id }
            - call: "POST /records/collections/${col_a}/begin-processing"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - call: "POST /records/collections/${col_a}/complete-description"
              payload: { scope_note: "A", arrangement_note: "A", container_list_summary: "A" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - call: "POST /records/collections/${col_b}/begin-processing"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - call: "POST /records/collections/${col_b}/complete-description"
              payload: { scope_note: "B", arrangement_note: "B", container_list_summary: "B" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
          trigger:
            - call: "POST /records/collections/${col_a}/enqueue-digitization"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - call: "POST /records/collections/${col_b}/enqueue-digitization"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - call: "GET /records/digitization-queue"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
          assert:
            - "Collection.${col_a}.digitization_priority == 60 (2*min(30,50) + 0 + 0 + 0 + 0)"
            - "Collection.${col_a}.digitization_priority != 150 (the AGE_WEIGHTED variant 5*min(30,50))"
            - "Collection.${col_b}.digitization_priority == 50 (2*min(25,50)); the variant would give 125"
            - "GET /records/digitization-queue returns exactly [${col_a}, ${col_b}] in that order (priority DESC)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: reproduction_fee_nested_rounding_order
        grounds:
          - calculations.reproduction_fee
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order is per-tier academic discount
          (round_half_up per tier) -> sum -> rush multiplier (round_half_up). With
          45 ACADEMIC rush pages the tier-2 fraction (1250*0.85=1062.5) makes the
          pinned order yield 3635 cents while rounding rush-first yields 3634.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The standard DESCRIBED PUBLIC collection (50 units) and ACTIVE ACADEMIC researcher Ada."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - *d_sch_s2_create
            - *d_sch_s2_submit
            - *d_sch_s2_appraise
            - *d_sch_s2_decide
            - *d_tr_t2_create
            - *d_tr_t2_meta
            - *d_tr_t2_accession
            - *d_col_c2_begin
            - *d_col_c2_describe
            - *d_res_ada
            - *d_res_ada_act
          trigger:
            - call: "POST /records/reproduction-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c2}", page_count: 45, format: "CERTIFIED_COPY", rush: true }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { rr45_id: $.data.id, fee45: $.data.fee_cents }
          assert:
            - "the response status is 201"
            - "ReproductionRequest.${rr45_id}.fee_cents == 3635 (1360 + round_half_up(1250*0.85)=1063 -> 2423; 2423*1.5=3634.5 -> round_half_up 3635)"
            - "ReproductionRequest.${rr45_id}.fee_cents != 3634 (rush-first alternative: 2400*0.85=2040 + round_half_up(1875*0.85)=1594 -> 3634)"

      - name: digitization_priority_caps_and_conditional_bonus
        grounds:
          - calculations.digitization_priority
          - calculations.restriction_posture
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — per-input min()
          caps (age capped at 50 years so a 70-year collection scores 100 base, not 140)
          plus a conditional +25 branch that fires only when declass_outcome ==
          DECLASSIFIED, separating two otherwise identical 1956-cutoff collections.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Collection X: SECRET FEDERAL, cutoff 1956-03-15, then declassified (DECLASSIFIED outcome), DESCRIBED, posture PUBLIC. Collection Y: NONE FEDERAL, same cutoff 1956-03-15, DESCRIBED, PUBLIC. All demand counters zero on both."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-011", title: "Intelligence Reports", records_domain: "FEDERAL", disposition: "PERMANENT", transfer_lag_years: 20, classification_default: "SECRET" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { sch_s11: $.data.id }
            - call: "POST /records/schedules/${sch_s11}/submit"
              payload: {}
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - call: "POST /records/schedules/${sch_s11}/appraise"
              payload: { appraisal_recommendation: "APPROVE" }
              as: AppraisalArchivist
              as_user_id: "arch-ap-1"
            - call: "POST /records/schedules/${sch_s11}/decide"
              payload: { decision: "APPROVE" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
            - call: "POST /records/transfers"
              payload: { schedule_id: "${sch_s11}", agency_id: "${ag_doj}", transfer_method: "ELECTRONIC", metadata_standard: "PREMIS_3_0", unit_count: 40, records_cutoff_date: "1956-03-15T00:00:00Z", checksum_manifest: "sha256:aa11" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { tr_x: $.data.id }
            - call: "POST /records/transfers/${tr_x}/submit-metadata"
              payload: { metadata_elements: ["object_id", "fixity", "format", "provenance"] }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - call: "POST /records/transfers/${tr_x}/accession"
              payload: { receipt_note: "ingest X verified" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_x: $.data.collection_id }
            - call: "GET /records/collections/${col_x}"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_x_v: $.data.version }
            - call: "POST /records/declass-reviews"
              payload: { collection_id: "${col_x}", review_type: "SYSTEMATIC", expected_collection_version: "${col_x_v}" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { rev_x: $.data.id }
            - call: "POST /records/declass-reviews/${rev_x}/begin"
              payload: {}
              as: DeclassReviewer
              as_user_id: "rev-1"
            - call: "POST /records/declass-reviews/${rev_x}/complete"
              payload: { reviewer_assessment: "DECLASSIFY" }
              as: DeclassReviewer
              as_user_id: "rev-1"
            - call: "POST /records/collections/${col_x}/begin-processing"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - call: "POST /records/collections/${col_x}/complete-description"
              payload: { scope_note: "X", arrangement_note: "X", container_list_summary: "X" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-012", title: "Open Administrative Files", records_domain: "FEDERAL", disposition: "PERMANENT", transfer_lag_years: 20, classification_default: "NONE" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { sch_s12: $.data.id }
            - call: "POST /records/schedules/${sch_s12}/submit"
              payload: {}
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - call: "POST /records/schedules/${sch_s12}/appraise"
              payload: { appraisal_recommendation: "APPROVE" }
              as: AppraisalArchivist
              as_user_id: "arch-ap-1"
            - call: "POST /records/schedules/${sch_s12}/decide"
              payload: { decision: "APPROVE" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
            - call: "POST /records/transfers"
              payload: { schedule_id: "${sch_s12}", agency_id: "${ag_doj}", transfer_method: "PHYSICAL", metadata_standard: "EAD_2002", unit_count: 10, records_cutoff_date: "1956-03-15T00:00:00Z", linear_feet: 2.5 }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { tr_y: $.data.id }
            - call: "POST /records/transfers/${tr_y}/submit-metadata"
              payload: { metadata_elements: ["title", "creator", "date_span", "extent"] }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - call: "POST /records/transfers/${tr_y}/accession"
              payload: { receipt_note: "received Y" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_y: $.data.collection_id }
            - call: "POST /records/collections/${col_y}/begin-processing"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - call: "POST /records/collections/${col_y}/complete-description"
              payload: { scope_note: "Y", arrangement_note: "Y", container_list_summary: "Y" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
          trigger:
            - call: "POST /records/collections/${col_x}/enqueue-digitization"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - call: "POST /records/collections/${col_y}/enqueue-digitization"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
          assert:
            - "Collection.${col_x}.digitization_priority == 125 (2*min(70,50)=100 + 0 demand + 25 DECLASSIFIED bonus)"
            - "Collection.${col_x}.digitization_priority != 165 (would-be value without the 50-year age cap)"
            - "Collection.${col_y}.digitization_priority == 100 (same capped age base, no bonus)"
            - "Collection.${col_x}.declass_outcome == DECLASSIFIED and classification_level == NONE and restriction_posture == PUBLIC"
            - "GET /records/digitization-queue returns ${col_x} before ${col_y}"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: foia_appeal_remand_cycle
        grounds:
          - state_machines.FoiaRequest.APPEALED_to_IN_REVIEW
          - state_machines.FoiaRequest.IN_REVIEW_to_DENIED
        distinguishing_aspect: |
          The FOIA machine is cyclic (appeal-remand loop): DENIED -> APPEALED ->
          REMAND returns the request to IN_REVIEW for re-adjudication, and the
          request can be DENIED a second time with remand_count tracking the loop.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Classified (SECRET) collection C1 with posture CLASSIFIED_REVIEW_REQUIRED; ACTIVE JOURNALIST researcher Bob; one FOIA request filed by Bob against C1."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - &d_sch_s1_create
              call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-001", title: "Criminal Investigative Case Files", records_domain: "FEDERAL", disposition: "PERMANENT", transfer_lag_years: 20, classification_default: "SECRET" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { sch_s1: $.data.id }
            - &d_sch_s1_submit
              call: "POST /records/schedules/${sch_s1}/submit"
              payload: {}
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - &d_sch_s1_appraise
              call: "POST /records/schedules/${sch_s1}/appraise"
              payload: { appraisal_recommendation: "APPROVE" }
              as: AppraisalArchivist
              as_user_id: "arch-ap-1"
            - &d_sch_s1_decide
              call: "POST /records/schedules/${sch_s1}/decide"
              payload: { decision: "APPROVE" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
            - &d_tr_t1_create
              call: "POST /records/transfers"
              payload: { schedule_id: "${sch_s1}", agency_id: "${ag_doj}", transfer_method: "ELECTRONIC", metadata_standard: "PREMIS_3_0", unit_count: 50, records_cutoff_date: "2001-03-15T00:00:00Z", checksum_manifest: "sha256:9f2c" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { tr_t1: $.data.id }
            - &d_tr_t1_meta
              call: "POST /records/transfers/${tr_t1}/submit-metadata"
              payload: { metadata_elements: ["object_id", "fixity", "format", "provenance"] }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - &d_tr_t1_accession
              call: "POST /records/transfers/${tr_t1}/accession"
              payload: { receipt_note: "ingest verified, virus scan clean" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_c1: $.data.collection_id }
            - &d_res_bob
              call: "POST /records/researchers"
              payload: { full_name: "Bob Press", email: "bob@example.org", affiliation: "JOURNALIST", id_document: "PP-2002" }
              as: Anonymous
              captures: { res_bob: $.data.id }
            - &d_res_bob_act
              call: "POST /records/researchers/${res_bob}/activate"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
            - call: "POST /records/foia-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c1}", description_of_records: "all memos re Operation Cedar" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { foia_id: $.data.id }
          trigger:
            - call: "POST /records/foia-requests/${foia_id}/adjudicate"
              payload: { decision: "DENY", claimed_exemptions: ["B1"] }
              as: FoiaOfficer
              as_user_id: "foia-1"
            - call: "POST /records/foia-requests/${foia_id}/appeal"
              payload: { appeal_reason: "public interest outweighs" }
              as: Researcher
              as_user_id: "${res_bob}"
            - call: "POST /records/foia-requests/${foia_id}/decide-appeal"
              payload: { appeal_decision: "REMAND" }
              as: FoiaAppealsOfficer
              as_user_id: "foia-ap-1"
            - call: "POST /records/foia-requests/${foia_id}/adjudicate"
              payload: { decision: "DENY", claimed_exemptions: ["B1", "B3"] }
              as: FoiaOfficer
              as_user_id: "foia-1"
            - call: "POST /records/foia-requests/${foia_id}/appeal"
              payload: { appeal_reason: "second appeal" }
              as: Researcher
              as_user_id: "${res_bob}"
            - call: "POST /records/foia-requests/${foia_id}/decide-appeal"
              payload: { appeal_decision: "UPHOLD" }
              as: FoiaAppealsOfficer
              as_user_id: "foia-ap-1"
            - call: "POST /records/foia-requests/${foia_id}/appeal"
              payload: { appeal_reason: "third appeal on terminal request" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { err_term: $.data.error_id }
          assert:
            - "after the first adjudicate: FoiaRequest.${foia_id}.status == DENIED and claimed_exemptions == [\"B1\"] and adjudicator_id == \"foia-1\""
            - "after REMAND: status == IN_REVIEW and remand_count == 1"
            - "after the second adjudicate: status == DENIED and claimed_exemptions == [\"B1\", \"B3\"] and adjudicator_id restamped \"foia-1\""
            - "after UPHOLD: status == APPEAL_UPHELD (terminal) and remand_count == 1"
            - "the terminal appeal attempt returns 409 and err_term == ERR_APPEAL_NOT_ALLOWED_STATE"

      - name: schedule_return_resubmit_cycle
        grounds:
          - state_machines.RecordsSchedule.RETURNED_to_SUBMITTED
          - state_machines.RecordsSchedule.APPRAISED_to_RETURNED
        distinguishing_aspect: |
          A different entity's non-linear machine: the schedule revision cycle
          APPRAISED -> RETURNED -> SUBMITTED -> APPRAISED -> APPROVED, with
          appraisal fields cleared on resubmission and version climbing 1..7.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agency DOJ registered; one DRAFT schedule."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-020", title: "Field Office General Files", records_domain: "FEDERAL", disposition: "PERMANENT", transfer_lag_years: 20, classification_default: "CONFIDENTIAL" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { sch_cyc: $.data.id, sch_cyc_v0: $.data.version }
          trigger:
            - call: "POST /records/schedules/${sch_cyc}/submit"
              payload: {}
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - call: "POST /records/schedules/${sch_cyc}/appraise"
              payload: { appraisal_recommendation: "RETURN" }
              as: AppraisalArchivist
              as_user_id: "arch-ap-1"
            - call: "POST /records/schedules/${sch_cyc}/decide"
              payload: { decision: "RETURN", decision_note: "insufficient appraisal rationale" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
              captures: { sch_ret_v: $.data.version }
            - call: "POST /records/schedules/${sch_cyc}/submit"
              payload: {}
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { sch_resub: $.data.appraiser_id }
            - call: "POST /records/schedules/${sch_cyc}/appraise"
              payload: { appraisal_recommendation: "APPROVE" }
              as: AppraisalArchivist
              as_user_id: "arch-ap-2"
            - call: "POST /records/schedules/${sch_cyc}/decide"
              payload: { decision: "APPROVE" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
              captures: { sch_final_v: $.data.version }
          assert:
            - "schedule.${sch_cyc} traversed DRAFT -> SUBMITTED -> APPRAISED -> RETURNED -> SUBMITTED -> APPRAISED -> APPROVED"
            - "RecordsSchedule.${sch_cyc}.version == 7 at the end (sch_cyc_v0 == 1, six transitions)"
            - "sch_ret_v == 4 (create + submit + appraise + decide)"
            - "immediately after resubmission sch_resub is null (appraiser_id cleared by the RETURNED -> SUBMITTED transition)"
            - "final status == APPROVED, appraiser_id == \"arch-ap-2\", decided_by == \"arch-chief-1\""

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: presidential_release_posture_foia_cascade
        grounds:
          - state_machines.PresidentialRestriction.NOTIFIED_to_RELEASED
          - calculations.restriction_posture
          - state_machines.FoiaRequest.RECEIVED_to_CLOSED
        distinguishing_aspect: |
          Depth-3 cascade originating at POST /records/presidential-restrictions/{id}/release:
          restriction RELEASED (hop 1) forces the collection posture recompute, the flip
          into PUBLIC (hop 2) itself auto-closes the collection's pending FOIA request
          (hop 3) — each hop caused by the previous one, not by the original call.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PRESIDENTIAL-domain collection C3 (classification NONE). An IMPOSED P5 restriction flips C3 to PRESIDENTIAL_HOLD; researcher Ada has a RECEIVED FOIA request against C3. Restriction: representative designated, notified at 2026-09-01."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - &d_sch_s3_create
              call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-003", title: "Presidential Office Files", records_domain: "PRESIDENTIAL", disposition: "PERMANENT", transfer_lag_years: 12, classification_default: "NONE" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { sch_s3: $.data.id }
            - &d_sch_s3_submit
              call: "POST /records/schedules/${sch_s3}/submit"
              payload: {}
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - &d_sch_s3_appraise
              call: "POST /records/schedules/${sch_s3}/appraise"
              payload: { appraisal_recommendation: "APPROVE" }
              as: AppraisalArchivist
              as_user_id: "arch-ap-1"
            - &d_sch_s3_decide
              call: "POST /records/schedules/${sch_s3}/decide"
              payload: { decision: "APPROVE" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
            - &d_tr_t3_create
              call: "POST /records/transfers"
              payload: { schedule_id: "${sch_s3}", agency_id: "${ag_doj}", transfer_method: "PHYSICAL", metadata_standard: "EAD_2002", unit_count: 30, records_cutoff_date: "2009-01-20T00:00:00Z", linear_feet: 9.0 }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { tr_t3: $.data.id }
            - &d_tr_t3_meta
              call: "POST /records/transfers/${tr_t3}/submit-metadata"
              payload: { metadata_elements: ["title", "creator", "date_span", "extent"] }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - &d_tr_t3_accession
              call: "POST /records/transfers/${tr_t3}/accession"
              payload: { receipt_note: "received at presidential library" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_c3: $.data.collection_id }
            - call: "POST /records/presidential-restrictions"
              payload: { collection_id: "${col_c3}", category: "P5_CONFIDENTIAL_ADVICE" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
              captures: { restr_id: $.data.id }
            - *d_res_ada
            - *d_res_ada_act
            - call: "POST /records/foia-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c3}", description_of_records: "advice memoranda 2001-2004" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { foia_p: $.data.id }
            - call: "POST /records/presidential-restrictions/${restr_id}/designate"
              payload: { representative_id: "rep-44" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
            - call: "POST /records/presidential-restrictions/${restr_id}/notify"
              payload: {}
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /records/presidential-restrictions/${restr_id}/release"
              payload: {}
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
          assert:
            - "PresidentialRestriction.${restr_id}.status == RELEASED and released_at == 2026-10-01T00:00:00Z (hop 1)"
            - "Collection.${col_c3}.restriction_posture == PUBLIC (hop 2: recomputed because the last active restriction released)"
            - "FoiaRequest.${foia_p}.status == CLOSED and close_reason == RECORDS_MADE_PUBLIC (hop 3: posture flip auto-closed the pending request)"
            - "Collection.${col_c3}.version advanced past its post-restriction value (both the restriction cascade and the posture recompute bumped it)"

      - name: declass_completion_posture_foia_cascade
        grounds:
          - state_machines.DeclassReview.IN_PROGRESS_to_COMPLETED
          - calculations.restriction_posture
          - state_machines.FoiaRequest.RECEIVED_to_CLOSED
        distinguishing_aspect: |
          A second depth-3 cascade from a different originating trigger
          (POST /records/declass-reviews/{id}/complete): completion clears
          classification_level (hop 1), which flips restriction_posture to PUBLIC
          (hop 2), which auto-closes the pending FOIA request (hop 3).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Classified (SECRET) collection C1, posture CLASSIFIED_REVIEW_REQUIRED. Ada (ACADEMIC) ACTIVE with a RECEIVED FOIA request on C1. An MDR review is OPEN on C1 and has been begun (IN_PROGRESS), no referrals."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - *d_sch_s1_create
            - *d_sch_s1_submit
            - *d_sch_s1_appraise
            - *d_sch_s1_decide
            - *d_tr_t1_create
            - *d_tr_t1_meta
            - *d_tr_t1_accession
            - *d_res_ada
            - *d_res_ada_act
            - call: "POST /records/foia-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c1}", description_of_records: "classified memos" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { foia_d: $.data.id }
            - call: "GET /records/collections/${col_c1}"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_c1_v: $.data.version }
            - call: "POST /records/declass-reviews"
              payload: { collection_id: "${col_c1}", review_type: "MANDATORY", requester_researcher_id: "${res_ada}", justification: "scholarly research on 2001 decisions", expected_collection_version: "${col_c1_v}" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { rev_d: $.data.id }
            - call: "POST /records/declass-reviews/${rev_d}/begin"
              payload: {}
              as: DeclassReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /records/declass-reviews/${rev_d}/complete"
              payload: { reviewer_assessment: "DECLASSIFY" }
              as: DeclassReviewer
              as_user_id: "rev-1"
          assert:
            - "DeclassReview.${rev_d}.status == COMPLETED and outcome == DECLASSIFIED"
            - "Collection.${col_c1}.classification_level == NONE and declass_outcome == DECLASSIFIED (hop 1)"
            - "Collection.${col_c1}.restriction_posture == PUBLIC (hop 2: recompute caused by the classification mutation)"
            - "FoiaRequest.${foia_d}.status == CLOSED and close_reason == RECORDS_MADE_PUBLIC (hop 3: caused by the posture flip, not by the review call directly)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: appeal_state_beats_window_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors.ERR_APPEAL_NOT_ALLOWED_STATE
          - errors.ERR_APPEAL_WINDOW_CLOSED
        distinguishing_aspect: |
          Category pair state vs business_temporal: an appeal against a GRANTED
          request at clock decided_at+44 days violates both the state gate and the
          appeal window; the state error (priority 7) wins over the temporal error
          (priority 11).
        test_recipe:
          setup:
            - "Logical clock initially 2026-09-01T00:00:00Z. Classified collection C1; Ada ACTIVE; her FOIA request adjudicated GRANT at 2026-09-01 (decided_at). Clock then advanced to 2026-10-15T00:00:00Z, past the 30-day appeal window."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - *d_sch_s1_create
            - *d_sch_s1_submit
            - *d_sch_s1_appraise
            - *d_sch_s1_decide
            - *d_tr_t1_create
            - *d_tr_t1_meta
            - *d_tr_t1_accession
            - *d_res_ada
            - *d_res_ada_act
            - call: "POST /records/foia-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c1}", description_of_records: "full case file" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { foia_g: $.data.id }
            - call: "POST /records/foia-requests/${foia_g}/adjudicate"
              payload: { decision: "GRANT" }
              as: FoiaOfficer
              as_user_id: "foia-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /records/foia-requests/${foia_g}/appeal"
              payload: { appeal_reason: "too late and wrong state" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { err_dual: $.data.error_id }
          assert:
            - "the response status is 409"
            - "err_dual == ERR_APPEAL_NOT_ALLOWED_STATE (state check at priority 7 fires first)"
            - "err_dual != ERR_APPEAL_WINDOW_CLOSED (temporal check at priority 11 is shadowed)"

      - name: restriction_safety_beats_quota_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=15]
          - errors.ERR_COLLECTION_RESTRICTED
          - errors.ERR_DAILY_PAGE_LIMIT_EXCEEDED
        distinguishing_aspect: |
          Category pair business_safety vs business_fiscal: a reproduction request
          against a CLASSIFIED_RESTRICTED collection by a researcher whose 200-page
          daily quota is already exhausted violates both gates; the safety error
          (priority 8) wins over the fiscal quota error (priority 15).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PUBLIC DESCRIBED collection C2; CLASSIFIED_REVIEW_REQUIRED but DESCRIBED collection C1; ACTIVE JOURNALIST Bob has already committed exactly 200 pages today on C2."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - *d_sch_s2_create
            - *d_sch_s2_submit
            - *d_sch_s2_appraise
            - *d_sch_s2_decide
            - *d_tr_t2_create
            - *d_tr_t2_meta
            - *d_tr_t2_accession
            - *d_col_c2_begin
            - *d_col_c2_describe
            - *d_sch_s1_create
            - *d_sch_s1_submit
            - *d_sch_s1_appraise
            - *d_sch_s1_decide
            - *d_tr_t1_create
            - *d_tr_t1_meta
            - *d_tr_t1_accession
            - call: "POST /records/collections/${col_c1}/begin-processing"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - call: "POST /records/collections/${col_c1}/complete-description"
              payload: { scope_note: "S", arrangement_note: "S", container_list_summary: "S" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - *d_res_bob
            - *d_res_bob_act
            - call: "POST /records/reproduction-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", page_count: 200, format: "DIGITAL_SCAN" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { rr_200: $.data.id }
          trigger:
            - call: "POST /records/reproduction-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c1}", page_count: 10, format: "DIGITAL_SCAN" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { err_dual2: $.data.error_id }
          assert:
            - "ReproductionRequest.${rr_200}.status == QUOTED (the 200-page request exactly filled the daily quota)"
            - "the trigger response status is 403"
            - "err_dual2 == ERR_COLLECTION_RESTRICTED (safety at priority 8)"
            - "err_dual2 != ERR_DAILY_PAGE_LIMIT_EXCEEDED (fiscal quota at priority 15 is shadowed)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: systematic_review_age_threshold
        grounds:
          - calculations.systematic_review_age_gate
          - calculations.records_age_years
        distinguishing_aspect: |
          Metric: whole years since records_cutoff_date under the anniversary rule;
          the 25-year gate is INCLUSIVE — at age 24 a SYSTEMATIC review is premature
          (409), at exactly the 25th anniversary it is accepted (201).
        test_recipe:
          setup:
            - "Classified (SECRET) collection C1, records_cutoff_date 2001-03-15T00:00:00Z, posture CLASSIFIED_REVIEW_REQUIRED. Logical clock initially moved back to 2026-03-14T00:00:00Z (age 24)."
          setup_api_calls:
            - *d_ag_doj
            - *d_sch_s1_create
            - *d_sch_s1_submit
            - *d_sch_s1_appraise
            - *d_sch_s1_decide
            - *d_tr_t1_create
            - *d_tr_t1_meta
            - *d_tr_t1_accession
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-14T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /records/collections/${col_c1}"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_c1_v24: $.data.version }
          trigger:
            - call: "POST /records/declass-reviews"
              payload: { collection_id: "${col_c1}", review_type: "SYSTEMATIC", expected_collection_version: "${col_c1_v24}" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { err_premature: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /records/collections/${col_c1}"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_c1_v25: $.data.version }
            - call: "POST /records/declass-reviews"
              payload: { collection_id: "${col_c1}", review_type: "SYSTEMATIC", expected_collection_version: "${col_c1_v25}" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { rev_sys: $.data.id }
          assert:
            - "the first create returns 409 and err_premature == ERR_SYSTEMATIC_REVIEW_PREMATURE (age 24 at 2026-03-14)"
            - "the second create returns 201 at exactly the 25th anniversary (2026-03-15) — the >= boundary is inclusive"
            - "DeclassReview.${rev_sys}.status == OPEN and review_type == SYSTEMATIC and requester_researcher_id is null"
            - "col_c1_v25 == col_c1_v24 (the failed create did not mutate the collection)"

      - name: daily_page_quota_limit
        grounds:
          - calculations.daily_committed_pages
        distinguishing_aspect: |
          Metric: integer committed pages per UTC day on a different endpoint
          (POST /records/reproduction-requests); 200 committed + 80 more lands exactly
          on the inclusive 200 limit and succeeds, while the 201st page is rejected.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PUBLIC DESCRIBED collection C2; ACTIVE JOURNALIST Bob with zero committed pages today."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - *d_sch_s2_create
            - *d_sch_s2_submit
            - *d_sch_s2_appraise
            - *d_sch_s2_decide
            - *d_tr_t2_create
            - *d_tr_t2_meta
            - *d_tr_t2_accession
            - *d_col_c2_begin
            - *d_col_c2_describe
            - *d_res_bob
            - *d_res_bob_act
          trigger:
            - call: "POST /records/reproduction-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", page_count: 120, format: "DIGITAL_SCAN" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { rr_120: $.data.id, fee_120: $.data.fee_cents }
            - call: "POST /records/reproduction-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", page_count: 80, format: "PHOTOPRINT" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { rr_80: $.data.id }
            - call: "POST /records/reproduction-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", page_count: 1, format: "DIGITAL_SCAN" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { err_quota: $.data.error_id }
          assert:
            - "first create (120 pages) returns 201"
            - "second create (80 pages) returns 201 — 120 + 80 == 200, the inclusive boundary"
            - "third create (1 page) returns 409 and err_quota == ERR_DAILY_PAGE_LIMIT_EXCEEDED (200 + 1 > 200)"
            - "fee_120 == 6100 (1600 + 4000 + 20*25, no affiliation discount for JOURNALIST)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: pull_create_gated_by_collection_state
        grounds:
          - state_machines.PullRequest
          - validations[priority=8]
          - validations[priority=13]
          - errors.ERR_COLLECTION_RESTRICTED
          - errors.ERR_COLLECTION_NOT_DESCRIBED
        distinguishing_aspect: |
          Entity pair PullRequest x Collection: the same pull body is rejected with
          ERR_COLLECTION_RESTRICTED when the collection is DESCRIBED but posture
          CLASSIFIED_REVIEW_REQUIRED, and with ERR_COLLECTION_NOT_DESCRIBED when the
          collection is PUBLIC but UNPROCESSED — two different collection-state gates.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. C1: SECRET, DESCRIBED, posture CLASSIFIED_REVIEW_REQUIRED. C3: PRESIDENTIAL-domain, UNPROCESSED, posture PUBLIC (no restrictions). Ada ACTIVE."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - *d_sch_s1_create
            - *d_sch_s1_submit
            - *d_sch_s1_appraise
            - *d_sch_s1_decide
            - *d_tr_t1_create
            - *d_tr_t1_meta
            - *d_tr_t1_accession
            - call: "POST /records/collections/${col_c1}/begin-processing"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - call: "POST /records/collections/${col_c1}/complete-description"
              payload: { scope_note: "S", arrangement_note: "S", container_list_summary: "S" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - *d_sch_s3_create
            - *d_sch_s3_submit
            - *d_sch_s3_appraise
            - *d_sch_s3_decide
            - *d_tr_t3_create
            - *d_tr_t3_meta
            - *d_tr_t3_accession
            - *d_res_ada
            - *d_res_ada_act
          trigger:
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c1}", unit_start: 1, unit_end: 5, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { err_restr: $.data.error_id }
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c3}", unit_start: 1, unit_end: 5, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { err_undesc: $.data.error_id }
          assert:
            - "the first pull returns 403 and err_restr == ERR_COLLECTION_RESTRICTED (posture CLASSIFIED_REVIEW_REQUIRED)"
            - "the second pull returns 409 and err_undesc == ERR_COLLECTION_NOT_DESCRIBED (PUBLIC but UNPROCESSED)"
            - "GET /records/pull-requests?researcher_id=${res_ada} returns 0 rows (neither rejection persisted anything)"

      - name: review_complete_gated_by_referral_states
        grounds:
          - state_machines.DeclassReview.IN_PROGRESS_to_COMPLETED
          - state_machines.EquityReferral.SENT_to_RESPONDED
          - errors.ERR_REFERRALS_OUTSTANDING
        distinguishing_aspect: |
          Entity pair DeclassReview x EquityReferral: completion is gated on the
          child referrals' states — a SENT non-overdue referral blocks completion
          (ERR_REFERRALS_OUTSTANDING), and only after that referral flips to
          RESPONDED does the same complete call succeed.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Classified collection C1; MDR review by Ada OPEN and begun (IN_PROGRESS); one equity referral to agency CIA SENT (response_due_at 2026-09-22T00:00:00Z, not overdue)."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - &d_ag_cia
              call: "POST /records/agencies"
              payload: { agency_code: "CIA", name: "Central Intelligence Agency" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_cia: $.data.id }
            - *d_sch_s1_create
            - *d_sch_s1_submit
            - *d_sch_s1_appraise
            - *d_sch_s1_decide
            - *d_tr_t1_create
            - *d_tr_t1_meta
            - *d_tr_t1_accession
            - *d_res_ada
            - *d_res_ada_act
            - call: "GET /records/collections/${col_c1}"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_c1_vr: $.data.version }
            - call: "POST /records/declass-reviews"
              payload: { collection_id: "${col_c1}", review_type: "MANDATORY", requester_researcher_id: "${res_ada}", justification: "request for 2001 files", expected_collection_version: "${col_c1_vr}" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { rev_r: $.data.id }
            - call: "POST /records/declass-reviews/${rev_r}/begin"
              payload: {}
              as: DeclassReviewer
              as_user_id: "rev-1"
            - call: "POST /records/declass-reviews/${rev_r}/referrals"
              payload: { agency_ids: ["${ag_cia}"] }
              as: DeclassReviewer
              as_user_id: "rev-1"
              captures: { ref_id: $.data.0.id }
          trigger:
            - call: "POST /records/declass-reviews/${rev_r}/complete"
              payload: { reviewer_assessment: "DECLASSIFY" }
              as: DeclassReviewer
              as_user_id: "rev-1"
              captures: { err_outst: $.data.error_id }
            - call: "POST /records/equity-referrals/${ref_id}/respond"
              payload: { decision: "DECLASSIFY" }
              as: AgencyLiaison
              as_user_id: "${ag_cia}"
            - call: "POST /records/declass-reviews/${rev_r}/complete"
              payload: { reviewer_assessment: "DECLASSIFY" }
              as: DeclassReviewer
              as_user_id: "rev-1"
          assert:
            - "the first complete returns 409 and err_outst == ERR_REFERRALS_OUTSTANDING (referral SENT, clock 2026-09-01 <= due 2026-09-22)"
            - "after respond, EquityReferral.${ref_id}.status == RESPONDED and decision == DECLASSIFY"
            - "the second complete returns 200: DeclassReview.${rev_r}.status == COMPLETED and outcome == DECLASSIFIED"
            - "Collection.${col_c1}.classification_level == NONE after completion"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: unit_range_pairwise_exclusion
        grounds:
          - calculations.unit_reservation_overlap
          - errors.ERR_UNIT_RESERVATION_CONFLICT
        distinguishing_aspect: |
          Interval semantics: inclusive integer unit ranges on the collection resource
          combined with half-open 2-day occupation windows; [15,25] collides with
          [10,20] on the same day, adjacent [21,30] does not, and an identical range
          on a disjoint window does not.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PUBLIC DESCRIBED collection C2 (50 units). Ada and Bob ACTIVE. Ada holds a REQUESTED pull on units [10,20] visiting 2026-09-10."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - *d_sch_s2_create
            - *d_sch_s2_submit
            - *d_sch_s2_appraise
            - *d_sch_s2_decide
            - *d_tr_t2_create
            - *d_tr_t2_meta
            - *d_tr_t2_accession
            - *d_col_c2_begin
            - *d_col_c2_describe
            - *d_res_ada
            - *d_res_ada_act
            - *d_res_bob
            - *d_res_bob_act
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c2}", unit_start: 10, unit_end: 20, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { pull_a: $.data.id }
          trigger:
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", unit_start: 15, unit_end: 25, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", unit_start: 21, unit_end: 30, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { pull_b: $.data.id }
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c2}", unit_start: 10, unit_end: 20, visit_date: "2026-09-20T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { pull_c: $.data.id }
          assert:
            - "the [15,25] pull returns 409 and err_overlap == ERR_UNIT_RESERVATION_CONFLICT (shares units 15-20 and the same window)"
            - "the [21,30] pull returns 201 — adjacent inclusive ranges share no unit"
            - "the [10,20] pull on 2026-09-20 returns 201 — identical range but the occupation windows [09-10,09-12) and [09-20,09-22) are disjoint"
            - "PullRequest.${pull_b}.status == REQUESTED and PullRequest.${pull_c}.status == REQUESTED"

      - name: reading_room_seat_aggregate_capacity
        grounds:
          - calculations.reading_room_seat_capacity
          - errors.ERR_READING_ROOM_CAPACITY
        distinguishing_aspect: |
          Different interval semantics on a different resource: aggregate per-day seat
          counting on the reading room (8 seats/day over the half-open [visit, visit+2d)
          window) instead of pairwise range exclusion; the 8th pull on a day succeeds
          and the 9th is rejected even though no unit ranges overlap.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PUBLIC DESCRIBED collection C2 (50 units). Researchers Ada, Bob, Cid ACTIVE. Eight pulls with disjoint 5-unit ranges already REQUESTED for visit 2026-09-10 (Ada 3, Bob 3, Cid 2), occupying all 8 seats on 2026-09-10 and 2026-09-11."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - *d_sch_s2_create
            - *d_sch_s2_submit
            - *d_sch_s2_appraise
            - *d_sch_s2_decide
            - *d_tr_t2_create
            - *d_tr_t2_meta
            - *d_tr_t2_accession
            - *d_col_c2_begin
            - *d_col_c2_describe
            - *d_res_ada
            - *d_res_ada_act
            - *d_res_bob
            - *d_res_bob_act
            - &d_res_cid
              call: "POST /records/researchers"
              payload: { full_name: "Cid Dealer", email: "cid@example.org", affiliation: "COMMERCIAL", id_document: "PP-3003" }
              as: Anonymous
              captures: { res_cid: $.data.id }
            - &d_res_cid_act
              call: "POST /records/researchers/${res_cid}/activate"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c2}", unit_start: 1, unit_end: 5, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_ada}"
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c2}", unit_start: 6, unit_end: 10, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_ada}"
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c2}", unit_start: 11, unit_end: 15, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_ada}"
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", unit_start: 16, unit_end: 20, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_bob}"
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", unit_start: 21, unit_end: 25, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_bob}"
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", unit_start: 26, unit_end: 30, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_bob}"
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_cid}", collection_id: "${col_c2}", unit_start: 31, unit_end: 35, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_cid}"
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_cid}", collection_id: "${col_c2}", unit_start: 36, unit_end: 40, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_cid}"
          trigger:
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_cid}", collection_id: "${col_c2}", unit_start: 41, unit_end: 45, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_cid}"
              captures: { err_seats: $.data.error_id }
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_cid}", collection_id: "${col_c2}", unit_start: 41, unit_end: 45, visit_date: "2026-09-12T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_cid}"
              captures: { pull_shift: $.data.id }
          assert:
            - "all eight setup pulls return 201 (the 8th pull exactly fills the day — inclusive capacity)"
            - "the ninth same-day pull returns 409 and err_seats == ERR_READING_ROOM_CAPACITY"
            - "the shifted pull on 2026-09-12 returns 201 — its window [09-12, 09-14) shares no day with the eight [09-10, 09-12) windows"
            - "PullRequest.${pull_shift}.status == REQUESTED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: daily_committed_pages_conserved
        grounds:
          - calculations.daily_committed_pages
          - state_machines.ReproductionRequest.QUOTED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: a researcher's committed daily pages. The forward action
          (create 40 pages) paired with its compensating action (cancel that QUOTED
          request) leaves the committed total unchanged at 0 — proven by a subsequent
          200-page create succeeding where it would fail had any pages leaked.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PUBLIC DESCRIBED collection C2. ACTIVE JOURNALIST Bob, zero committed pages."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - *d_sch_s2_create
            - *d_sch_s2_submit
            - *d_sch_s2_appraise
            - *d_sch_s2_decide
            - *d_tr_t2_create
            - *d_tr_t2_meta
            - *d_tr_t2_accession
            - *d_col_c2_begin
            - *d_col_c2_describe
            - *d_res_bob
            - *d_res_bob_act
          trigger:
            - call: "POST /records/reproduction-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", page_count: 40, format: "DIGITAL_SCAN" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { rr_40: $.data.id, fee_40: $.data.fee_cents }
            - call: "POST /records/reproduction-requests/${rr_40}/cancel"
              payload: {}
              as: Researcher
              as_user_id: "${res_bob}"
            - call: "POST /records/reproduction-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", page_count: 200, format: "DIGITAL_SCAN" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { rr_200b: $.data.id, fee_200: $.data.fee_cents }
            - call: "POST /records/reproduction-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", page_count: 1, format: "DIGITAL_SCAN" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { err_over: $.data.error_id }
          assert:
            - "ReproductionRequest.${rr_40}.status == CANCELLED (compensating action applied)"
            - "the 200-page create returns 201 and fee_200 == 8100 — impossible unless cancellation restored the committed total to 0 (cancelled rows are excluded from daily_committed_pages)"
            - "the final 1-page create returns 409 and err_over == ERR_DAILY_PAGE_LIMIT_EXCEEDED, pinning the conserved total at exactly 200"
            - "fee_40 == 2600 (1600 + 20*50) for the cancelled request"

      - name: active_pull_count_conserved
        grounds:
          - calculations.active_pull_count
          - state_machines.PullRequest.PULLED_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity: a researcher's active pull count (REQUESTED + PULLED,
          cap 3). A 4th create is rejected at count 3; the compensating fulfill+return
          of one pull restores a slot and the identical create then succeeds — the
          count is conserved across the create/return pair.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PUBLIC DESCRIBED collection C2 (50 units). ACTIVE researcher Ada holding three REQUESTED pulls on disjoint ranges and dates."
          setup_api_calls:
            - *d_clock
            - *d_ag_doj
            - *d_sch_s2_create
            - *d_sch_s2_submit
            - *d_sch_s2_appraise
            - *d_sch_s2_decide
            - *d_tr_t2_create
            - *d_tr_t2_meta
            - *d_tr_t2_accession
            - *d_col_c2_begin
            - *d_col_c2_describe
            - *d_res_ada
            - *d_res_ada_act
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c2}", unit_start: 1, unit_end: 5, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { pull_1: $.data.id }
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c2}", unit_start: 6, unit_end: 10, visit_date: "2026-09-12T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { pull_2: $.data.id }
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c2}", unit_start: 11, unit_end: 15, visit_date: "2026-09-14T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { pull_3: $.data.id }
          trigger:
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c2}", unit_start: 16, unit_end: 20, visit_date: "2026-09-16T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { err_limit: $.data.error_id }
            - call: "POST /records/pull-requests/${pull_3}/fulfill"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
            - call: "POST /records/pull-requests/${pull_3}/return"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c2}", unit_start: 16, unit_end: 20, visit_date: "2026-09-16T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { pull_4: $.data.id }
          assert:
            - "the first 4th-pull attempt returns 409 and err_limit == ERR_ACTIVE_PULL_LIMIT_EXCEEDED (count == 3 at cap)"
            - "PullRequest.${pull_3}.status == RETURNED and late_return == false (returned at 2026-09-01, due_back_at 2026-09-15T00:00:00Z)"
            - "the retry returns 201 and PullRequest.${pull_4}.status == REQUESTED — the create+return pair conserved the active count at 3, never exceeding it"
            - "GET /records/pull-requests?researcher_id=${res_ada}&status=REQUESTED returns exactly 3 rows"
