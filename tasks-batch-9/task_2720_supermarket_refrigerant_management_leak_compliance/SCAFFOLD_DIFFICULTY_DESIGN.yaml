            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", service_type: "ROUTINE_MAINTENANCE", performed_at: "2026-08-01T08:00:00Z", duration_minutes: 60, expected_system_version: "${sys1_v}" }
              as: Technician
