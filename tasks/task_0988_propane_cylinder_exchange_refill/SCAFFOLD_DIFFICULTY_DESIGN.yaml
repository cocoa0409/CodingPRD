            - call: "POST /cylinders"
              payload: { serial_number: "FD-002", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FD-003", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FD-004", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FD-005", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FD-006", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FD-007", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /technicians"
              payload: { name: "Tech One", cert_level: FULL }
              as: PlatformAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech Two", cert_level: FULL }
              as: PlatformAdmin
              captures: { t2_id: $.data.id }
            - call: "GET /sites/${s_id}"
              as: PlatformAdmin
              captures: { s_full_pre: $.data.full_on_hand, s_alert_pre: $.data.restock_alert }
            - call: "POST /certification-records"
              payload: { cylinder_id: "${cd_id}", method: VISUAL, outcome: CONDEMN, note: "dent at collar" }
              as: Technician
              as_user_id: "${t1_id}"
              captures: { rec_id: $.data.id, rec_st: $.data.status }
          trigger:
            - call: "POST /certification-records/${rec_id}/confirm"
              payload: {}
              as: Technician
              as_user_id: "${t2_id}"
              captures: { rec_st2: $.data.status }
            - call: "GET /cylinders/${cd_id}"
              as: PlatformAdmin
              captures: { cd_cert: $.data.cert_status }
            - call: "GET /sites/${s_id}"
              as: PlatformAdmin
              captures: { s_full_post: $.data.full_on_hand, s_alert_post: $.data.restock_alert }
          assert:
            - "before confirm: HostSite.full_on_hand == 7 and restock_alert == false (7 > floor 6)"
            - "CertificationRecord status == PENDING_SECOND before confirm, == CONFIRMED after (hop 1)"
            - "Cylinder.${cd_id}.cert_status == CONDEMNED (hop 1 effect)"
            - "HostSite.full_on_hand == 6 (hop 2: CONDEMNED excluded from counts)"
            - "HostSite.restock_alert == true (hop 3: 6 <= 6, inclusive floor)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: complete_voided_order_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_PAYMENT]
        distinguishing_aspect: |
          Pair = state vs business_fiscal: completing a VOIDED order while also
          tendering less than the total must return ERR_INVALID_STATE (priority
          6), never ERR_INSUFFICIENT_PAYMENT (priority 13).
