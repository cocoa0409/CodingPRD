              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:30:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights/${fid}/launch"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "GET /drone-ops/airspace-zones/${zid}"
              payload: {}
              as: AirspaceAuthority
              as_user_id: "aa-41"
              captures: { slots_in_flight: $.data.reserved_slot_count }
            - call: "POST /drone-ops/flights/${fid}/complete"
              payload: { actual_end: "2026-08-20T10:30:00Z", max_altitude_reached_ft: 375, incident_occurred: false }
              as: Pilot
              as_user_id: "${pid}"
            - call: "GET /drone-ops/airspace-zones/${zid}"
              payload: {}
              as: AirspaceAuthority
              as_user_id: "aa-41"
              captures: { slots_final: $.data.reserved_slot_count }
          assert:
            - "${slots_initial} == 0 and ${slots_after_approve1} == 1 - approval takes exactly one slot"
            - "${a1_state} == \"APPROVED\" and ${a1_final} == \"REVOKED\""
            - "${slots_after_revoke} == 0 - the revoke releases exactly the one slot the approve took, with no drift"
            - "${a2_state} == \"APPROVED\" and after the launch ${slots_in_flight} == 1: an ACTIVE authorization still occupies its slot, so the APPROVED -> ACTIVE transition must not decrement"
            - "${slots_final} == 0 after completion moves the authorization ACTIVE -> CONSUMED - the second compensating path releases the same single slot"
            - "at every observation reserved_slot_count equals count(AirspaceAuthorization where zone_id == ${zid} and status IN {APPROVED, ACTIVE}), and it is never negative"
            - "AirspaceZone.${zid}.version is strictly greater after each of approve, revoke, approve and consume - the count returns to 0 but the version never rewinds"
            - "a second revoke of ${a1} is rejected (REVOKED is terminal) and does not drive reserved_slot_count to -1"

      - name: coverage_ledger_conservation_under_file_then_withdraw
        grounds:
          - calculations.coverage_ledger_conservation
          - calculations.accident_settlement
          - state_machines.InsurancePolicy
          - state_machines.AccidentReport
          - endpoints.POST_/drone-ops/accident-reports/{id}/withdraw
        distinguishing_aspect: |
          A different conserved quantity from the slot instance: insured money on one policy, in
          integer cents, split three ways as remaining + open reserved + settled ==
          coverage_limit. Filing a report holds 1250000 cents and demotes the policy to
          INSUFFICIENT; withdrawing it must release exactly that hold - restoring 2000000 /
          0 / 0 and the ACTIVE status - while the irreversible consequences of the demotion
          (a flight already cancelled) are deliberately NOT undone.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-11T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-08-05T00:00:00Z, one REGISTERED 249 g airframe, one uncontrolled class G zone."
            - "One ACTIVE indemnified InsurancePolicy: coverage_limit_cents 2000000, deductible_cents 50000, remaining_coverage_cents 2000000, open_reserved_cents_total 0, settled_cents_total 0."
            - "Flight A: COMPLETED COMMERCIAL 2026-08-10T09:00:00Z .. 2026-08-10T10:00:00Z with incident_occurred true, covered by that policy."
            - "Flight B: PLANNED COMMERCIAL for 2026-08-20T09:00:00Z .. 2026-08-20T10:00:00Z, covered by the same policy."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Clara Nunes", email: "clara.nunes@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 85 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Courier 3", serial_number: "SN-LEDG-01", takeoff_weight_g: 249, max_altitude_ft: 1000 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Aerial Indemnity", policy_number: "POL-LEDG-01", coverage_limit_cents: 2000000, deductible_cents: 50000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { polid: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${polid}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-LEDG", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 3 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "COMMERCIAL", planned_start: "2026-08-10T09:00:00Z", planned_end: "2026-08-10T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.53, launch_longitude: -122.25 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fa: $.data.id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "COMMERCIAL", planned_start: "2026-08-20T09:00:00Z", planned_end: "2026-08-20T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.53, launch_longitude: -122.25 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fb: $.data.id }
            - call: "POST /drone-ops/flights/${fa}/preflight-check"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights/${fa}/launch"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/flights/${fa}/complete"
              payload: { actual_end: "2026-08-10T10:00:00Z", max_altitude_reached_ft: 360, incident_occurred: true, incident_summary: "Package release mechanism jammed; airframe struck a light pole." }
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /drone-ops/accident-reports"
              payload: { flight_id: "${fa}", occurred_at: "2026-08-10T09:45:00Z", injury_level: "MINOR", reported_property_damage_cents: 800000, narrative: "Light pole and airframe damaged; one pedestrian treated for a graze." }
              as: InvestigationOfficer
              as_user_id: "inv-51"
              captures: { arid: $.data.id, reserve: $.data.reserved_cents }
            - call: "GET /drone-ops/insurance-policies/${polid}"
              payload: {}
              as: InvestigationOfficer
              as_user_id: "inv-51"
              captures: { remaining_held: $.data.remaining_coverage_cents, status_held: $.data.coverage_status }
            - call: "POST /drone-ops/accident-reports/${arid}/withdraw"
              payload: { probable_cause: "Filed against the wrong flight; the damage belongs to a ground handling incident." }
              as: InvestigationOfficer
              as_user_id: "inv-51"
              captures: { report_final: $.data.status, reserve_final: $.data.reserved_cents }
            - call: "GET /drone-ops/insurance-policies/${polid}"
              payload: {}
              as: InvestigationOfficer
              as_user_id: "inv-51"
              captures: { remaining_after: $.data.remaining_coverage_cents, open_after: $.data.open_reserved_cents_total, settled_after: $.data.settled_cents_total, status_after: $.data.coverage_status }
          assert:
            - "${reserve} == 1250000 (round_half_up(800000 * 1.25) == 1000000 plus the MINOR reserve 250000)"
            - "while the report is open: ${remaining_held} == 750000, open_reserved_cents_total == 1250000, settled_cents_total == 0, ${status_held} == \"INSUFFICIENT\", and 2000000 == 750000 + 1250000 + 0"
            - "${report_final} == \"WITHDRAWN\" and ${reserve_final} == 0"
            - "${remaining_after} == 2000000, ${open_after} == 0 and ${settled_after} == 0 - the release is exact, with no rounding drift and nothing shifted into the settled bucket"
            - "${status_after} == \"ACTIVE\" - the INSUFFICIENT -> ACTIVE transition fires on withdrawal because the ledger is whole again"
            - "2000000 == 2000000 + 0 + 0 holds after the compensation, exactly as it did before the filing"
            - "Flight.${fa}.investigation_status == \"CLOSED\" (the investigation dimension closes on withdrawal) while Flight.${fa}.status is still \"COMPLETED\""
            - "Flight.${fb}.status is still \"CANCELLED\" with cancellation_reason \"COVERAGE_INSUFFICIENT\" - money is conserved but a cancelled flight is never resurrected"
            - "a second withdraw of ${arid} is rejected (WITHDRAWN is terminal) and does not credit the policy twice"
