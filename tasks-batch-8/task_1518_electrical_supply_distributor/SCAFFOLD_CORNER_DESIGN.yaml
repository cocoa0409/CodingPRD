              payload: { contractor_id: "${c_id}", job_name: "OCC Job 2", jobsite_address: "55 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id, j_v: $.data.version }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /distributor/quote-lines"
              payload: { quote_id: "${q_id}", catalog_item_id: "${item_id}", qty: 5, unit_price_cents: 5000 }
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/award"
              payload: {}
              as: BranchManager
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${j_id}", quote_id: "${q_id}", expected_job_account_version: "${j_v}", lines: [{ catalog_item_id: "${item_id}", qty: 1 }] }
              as: SalesRep
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${j_id}", quote_id: "${q_id}", expected_job_account_version: "${j_v}", lines: [{ catalog_item_id: "${item_id}", qty: 1 }] }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_JOB_ACCOUNT_VERSION and http status == 412"
            - "only one release exists on the job (the second create was refused)"

      - name: firm_vs_escalation_variant_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.billed_release_line_amount]
        excluded_because:
          difficulty_instance: release_billing_firm_vs_escalation
          rationale: "Variant divergence and selection are the named §1.8 instance."

      - name: stock_conservation_on_cancel_covered
        claim_type: cascading_side_effects
        grounds: [calculations.backorder_waterfall, state_machines.Release.ALLOCATED_to_CANCELLED]
        excluded_because:
          difficulty_instance: allocate_then_cancel_conserves_stock
          rationale: "Allocate/cancel compensation leaving stock conserved is the named §1.8 instance."

  # ===========================================================================
