  # ==========================================================================
  # Rule 3 — non_linear_state_machine (three different entities, cyclic shapes)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: logic_model_revision_loop
        grounds:
          - state_machines.LogicModel.SUBMITTED_to_REJECTED
          - state_machines.LogicModel.REJECTED_to_DRAFT
          - state_machines.LogicModel.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          LogicModel supports a revision loop DRAFT -> SUBMITTED -> REJECTED ->
          DRAFT -> SUBMITTED -> APPROVED; after the loop back to DRAFT its
          indicators are mutable again (PATCH succeeds), which a linear
          pipeline would forbid.
        test_recipe:
          setup:
            - "Program ACTIVE; logic model LM1 with indicator I1 (target_value 20)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Arts", code: "ART" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/logic-models"
              payload: { title: "LM1" }
              as: EvaluationLead
              captures: { lm: $.data.id }
            - call: "POST /logic-models/${lm}/indicators"
              payload: { code: "I1", level: "OUTCOME", unit: "SCORE", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 20, measurement_frequency: "MONTHLY" }
              as: EvaluationLead
              captures: { ind1: $.data.id }
          trigger:
            - call: "POST /logic-models/${lm}/submit"
              payload: {}
              as: EvaluationLead
            - call: "POST /logic-models/${lm}/reject"
              payload: { reason: "weak outcomes" }
              as: EvaluationLead
            - call: "POST /logic-models/${lm}/revise"
              payload: {}
              as: EvaluationLead
            - call: "PATCH /indicators/${ind1}"
              payload: { target_value: 95 }
              as: EvaluationLead
            - call: "POST /logic-models/${lm}/submit"
              payload: {}
              as: EvaluationLead
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v: $.data.version }
            - call: "POST /logic-models/${lm}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: EvaluationLead
            - call: "GET /indicators/${ind1}"
              payload: {}
              as: EvaluationLead
              captures: { ind_status: $.data.status, ind_target: $.data.target_value }
          assert:
            - "after reject: model status REJECTED; after revise: DRAFT again (loop)"
            - "PATCH in the second DRAFT period succeeds: indicator.target_value == 95"
            - "after second submit + approve: model APPROVED, indicator status == ACTIVE"

      - name: report_returned_rework_cycle
        grounds:
          - state_machines.Report.DELIVERED_to_RETURNED
          - state_machines.Report.RETURNED_to_GENERATED
        distinguishing_aspect: |
          Report supports the rework cycle DELIVERED -> RETURNED -> GENERATED;
          regeneration re-pins snapshot fields (snapshot_dq_score 100.00,
          snapshot_overall_impact_index 60.00) rather than reusing the first
          generation's pinned values by reference — a terminal-only design
          would make RETURNED a dead end.
        test_recipe:
          setup:
            - "Program ACTIVE; cycle UNDER_REVIEW with latest_dq_score 100.00 (one VALIDATED obs value 60 on the single indicator)"
            - "Funder ACTIVE; report created under OCC"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Youth", code: "YTH" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/logic-models"
              payload: { title: "LM1" }
              as: EvaluationLead
              captures: { lm: $.data.id }
            - call: "POST /logic-models/${lm}/indicators"
              payload: { code: "I1", level: "OUTCOME", unit: "SCORE", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 100, weight: 1.0, measurement_frequency: "END_OF_CYCLE" }
              as: EvaluationLead
              captures: { ind1: $.data.id }
            - call: "POST /logic-models/${lm}/submit"
              payload: {}
              as: EvaluationLead
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v: $.data.version }
            - call: "POST /logic-models/${lm}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: EvaluationLead
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc: $.data.id }
            - call: "POST /cycles/${cyc}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-001" }
              as: ProgramDirector
              captures: { p1: $.data.id }
            - call: "POST /participants/${p1}/consents"
              payload: { form_version: 1, scope: "FULL", expires_at: "2027-01-01T00:00:00Z" }
              as: PrivacyOfficer
            - call: "POST /programs/${prog}/instruments"
              payload: { code: "SURV", title: "Survey" }
              as: EvaluationLead
              captures: { instr: $.data.id }
            - call: "POST /instruments/${instr}/publish"
              payload: {}
              as: EvaluationLead
            - call: "POST /certifications"
              payload: { staff_user_id: "collector-1", instrument_id: "${instr}", expires_at: "2027-01-01T00:00:00Z" }
              as: EvaluationLead
            - call: "POST /participants/${p1}/observations"
              payload: { indicator_id: "${ind1}", instrument_id: "${instr}", value: 60, collected_at: "2026-09-05T00:00:00Z" }
              as: FieldCollector
              as_user_id: "collector-1"
              captures: { o1: $.data.id }
            - call: "POST /observations/${o1}/validate"
              payload: {}
              as: DataSteward
              as_user_id: "steward-1"
            - call: "POST /cycles/${cyc}/close-data"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/audits"
              payload: {}
              as: DataSteward
              as_user_id: "steward-1"
              captures: { aud: $.data.id }
            - call: "POST /cycles/${cyc}/begin-review"
              payload: {}
              as: ProgramDirector
            - call: "POST /funders"
              payload: { name: "Foundation F", code: "FND-F" }
              as: ProgramDirector
              captures: { fund: $.data.id }
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: EvaluationLead
              captures: { cyc_v: $.data.version }
          trigger:
            - call: "POST /cycles/${cyc}/reports"
              payload: { funder_id: "${fund}", report_type: "FUNDER_STANDARD", expected_program_cycle_version: "${cyc_v}" }
              as: EvaluationLead
              captures: { rep: $.data.id }
            - call: "POST /reports/${rep}/generate"
              payload: {}
              as: EvaluationLead
            - call: "POST /reports/${rep}/deliver"
              payload: {}
              as: EvaluationLead
            - call: "POST /reports/${rep}/return"
              payload: { reason: "needs cohort breakdown" }
