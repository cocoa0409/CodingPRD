- section: cross_cutting_layers
  instances:

    - name: occ_stale_production_version_rejected_on_release
      claim_type: optimistic_concurrency
      grounds:
        - concurrency_rules[release-stale-production]
        - errors[ERR_STALE_VERSION]
        - endpoints.POST_/allocations/{allocation_id}/releases/{release_epoch}
      distinguishing_aspect: "A release carrying an expected_production_version one below the production's live version is refused with ERR_STALE_VERSION at status 412, and the successful replay with the live version advances the production's version so the stale request can never succeed later."
      test_recipe:
        setup:
          - "Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production and an ONSALE performance."
          - "One RUSH allocation scheduled and ready to release; the production's activation has already advanced its version past the value the release will present."
        setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-12T09:00:00Z" }
            as: PlatformAdmin
          - call: "POST /markets"
            payload: { market_code: "NYC", city: "New York", handoff_model: "MOBILE_PUSH" }
            as: PlatformAdmin
          - call: "POST /productions"
            payload: { title: "OCC Theatre Play", producer_org: "Corner Partners", refund_window_hours: 720, exchange_fee_cents: 300, exchange_allowed: true }
            as: OpsManager
            captures: { prod_id: $.data.id, prod_v_created: $.data.version }
          - call: "POST /productions/${prod_id}/status-transitions"
            payload: { to_status: "ACTIVE", expected_production_version: "${prod_v_created}" }
            as: OpsManager
            captures: { prod_v: $.data.version }
          - call: "POST /performances"
            payload: { production_id: "${prod_id}", market_code: "NYC", venue_name: "OCC Theatre", starts_at: "2026-10-05T19:00:00Z", face_value_cents: 10000, total_seat_capacity: 30 }
            as: OpsManager
            captures: { perf_id: $.data.id, perf_v_created: $.data.version }
          - call: "POST /performances/${perf_id}/status-transitions"
            payload: { to_status: "ONSALE", expected_performance_version: "${perf_v_created}" }
            as: OpsManager
            captures: { perf_v: $.data.version }
          - call: "POST /performances/${perf_id}/allocations"
            payload: { ticket_type: "RUSH", daily_quantity: 5, discount_pct: 0.5, release_time_local: "09:00", refundable: true, per_order_limit: 2 }
            as: AllocationsCoordinator
            captures: { alloc_id: $.data.id, alloc_v_created: $.data.version }
          - call: "POST /allocations/${alloc_id}/scheduling"
            payload: { expected_allocation_version: "${alloc_v_created}" }
            as: AllocationsCoordinator
            captures: { alloc_v: $.data.version }
        trigger:
          - call: "POST /allocations/${alloc_id}/releases/2026-09-12"
            payload: { expected_production_version: "${prod_v_created}", expected_performance_version: "${perf_v}", expected_allocation_version: "${alloc_v}" }
            as: OpsManager
            captures: { err: $.data.error_id }
          - call: "POST /allocations/${alloc_id}/releases/2026-09-12"
            payload: { expected_production_version: "${prod_v}", expected_performance_version: "${perf_v}", expected_allocation_version: "${alloc_v}" }
            as: OpsManager
            captures: { rel_ok: $.data.quantity_released_today }
        assert:
          - "the stale attempt returned status 412 with ${err} == ERR_STALE_VERSION, because ${prod_v_created} was taken before activation advanced the production"
          - "RushAllocation.${alloc_id}.status == SCHEDULED and quantity_released_today == 0 after the stale attempt"
          - "the replay carrying the live ${prod_v} returned 200 and reported ${rel_ok} == 5"
          - "the successful release advanced Production.${prod_id}.version by one beyond ${prod_v}"

    - name: idempotent_purchase_replay_returns_the_original_order
      claim_type: idempotency
      grounds:
        - entities.TicketPurchase.fields.idempotency_key
        - endpoints.POST_/purchases
        - validations[priority=16]
      distinguishing_aspect: "Repeating a purchase with the same idempotency_key and payload replays the original order rather than consuming a second seat, so quantity_sold_today advances exactly once across two identical requests."
      test_recipe:
        setup:
          - "Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production, an ONSALE performance and a released RUSH allocation with daily_quantity 5."
          - "One patron holds an ADMITTED queue position."
        setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-12T09:00:00Z" }
            as: PlatformAdmin
          - call: "POST /markets"
            payload: { market_code: "NYC", city: "New York", handoff_model: "MOBILE_PUSH" }
            as: PlatformAdmin
          - call: "POST /productions"
            payload: { title: "Idempotent Theatre Play", producer_org: "Corner Partners", refund_window_hours: 720, exchange_fee_cents: 300, exchange_allowed: true }
