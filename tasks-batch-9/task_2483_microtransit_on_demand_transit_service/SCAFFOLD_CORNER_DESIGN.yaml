          assert:
            - "the 601-metre approve returns HTTP 422 with data.error_id == ERR_WALK_DISTANCE_EXCEEDED"
            - "VirtualStop.${s_over_id}.status == PROPOSED (the create itself was never blocked)"
            - "the 600-metre approve returns HTTP 200 and VirtualStop.${s_edge_id}.status == APPROVED"

