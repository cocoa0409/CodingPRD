scenario: |
  Community Care Referral, Eligibility Standards & Administrator Claims (Veterans Health Administration Community Care): eligibility determination against access standards including drive time, wait time and service availability with veteran choice elements, referral authorization specifying episode scope, duration and number of visits with extension requests, community provider network administration through third-party administrators with credentialing and contracting, appointment scheduling responsibility split between the health system and administrator with timeliness measurement, medical documentation return requirements from community providers before subsequent authorizations, claim submission through the administrator with timely filing rules and payment rate references, urgent care benefit with copayment tiers and pharmacy limitations, coordination of care and prescription filling back through the system pharmacy

domain_name: community-care-referral
api_prefix: /community-care

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat            # peer entities linked by FK references; no nested ownership tree
  state_machine_shape: cyclic      # Claim resubmission loop, Documentation review loop, Authorization DOCS_SUSPENDED loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles           # VAMC-side roles, TPA-side roles, provider, veteran; non-overlapping exclusive ops
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CareStation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "VA medical station name" }
      - { name: latitude, type: number, source: input, description: "Station geodetic latitude (decimal degrees, -90..90)" }
      - { name: longitude, type: number, source: input, description: "Station geodetic longitude (decimal degrees, -180..180)" }
      - { name: primary_wait_days, type: integer, source: input, description: "Current average next-available wait in days for PRIMARY_CARE at this station (>= 0)" }
      - { name: specialty_wait_days, type: integer, source: input, description: "Current average next-available wait in days for SPECIALTY_CARE at this station (>= 0)" }
      - { name: service_codes, type: array, source: input, description: "Service codes clinically available at this station (array of strings, may be empty)" }

  - name: ThirdPartyAdministrator
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "TPA network name" }
      - { name: region_code, type: string, source: input, description: "Region identifier this TPA administers" }
      - { name: contract_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED. SUSPENDED reached only via the denial-rate auto-suspension cascade; no manual transition exists." }
      - { name: adjudicated_events, type: integer, source: computed, default: 0, description: "Count of claim-finalization events in this TPA network: each adjudicate decision (PAID or DENIED) and each cascade auto-denial. Resubmission and reversal do not change it." }
      - { name: denied_events, type: integer, source: computed, default: 0, description: "Count of adjudicated_events whose outcome was DENIED." }
      - { name: denial_rate, type: number, source: computed, default: 0, description: "= denied_events / adjudicated_events when adjudicated_events > 0 else 0 (4 decimal places, round_half_up)" }

  - name: CommunityProvider
    parent: null
    common_fields: true
    fields:
      - { name: tpa_id, type: string, source: system, description: "FK -> ThirdPartyAdministrator.id; administering TPA taken from the creation path" }
      - { name: name, type: string, source: input, description: "Practice / facility name" }
      - { name: service_codes, type: array, source: input, description: "Service codes this provider is contracted to deliver" }
      - { name: contract_rates, type: object, source: input, default: "{}", description: "Optional map service_code -> per-unit allowed rate in cents; overrides the Medicare base rate for that service_code on claims" }
      - { name: contract_scheduling, type: enum, source: input, description: "TPA | VAMC — which side schedules appointments for episodes routed to this provider" }
      - { name: credentialing_status, type: enum, source: system, default: PENDING, description: "PENDING | CREDENTIALED | SUSPENDED | DECREDENTIALED" }
      - { name: latitude, type: number, source: input, description: "Practice latitude" }
      - { name: longitude, type: number, source: input, description: "Practice longitude" }
      - { name: lifetime_paid_cents, type: integer, source: computed, default: 0, description: "Monotonic sum of paid_amount_cents over every claim adjudication decided PAID in this provider's history (reversals do not decrement)" }
      - { name: current_paid_cents, type: integer, source: computed, default: 0, description: "Sum of paid_amount_cents over this provider's claims currently in PAID status" }
      - { name: reversed_cents, type: integer, source: computed, default: 0, description: "Sum of paid_amount_cents over this provider's claims currently in REVERSED status" }

  - name: Veteran
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Veteran full name" }
      - { name: home_station_id, type: string, source: input, description: "FK -> CareStation.id; the veteran's VA home station used for access-standard measurement" }
      - { name: priority_group, type: integer, source: input, description: "Enrollment priority group 1..8; bands: LOW={1,2,3}, MID={4,5,6}, HIGH={7,8}" }
      - { name: home_latitude, type: number, source: input, description: "Residence latitude used as drive-time origin" }
      - { name: home_longitude, type: number, source: input, description: "Residence longitude used as drive-time origin" }

  - name: EligibilityAssessment
    parent: null
    common_fields: true
    fields:
      - { name: veteran_id, type: string, source: system, description: "FK -> Veteran.id; taken from the creation path" }
      - { name: service_code, type: string, source: input, description: "Service code being evaluated (e.g. PT_EVAL)" }
      - { name: service_category, type: enum, source: input, description: "PRIMARY_CARE | SPECIALTY_CARE — selects the drive-time and wait-time standards" }
      - { name: geo_classification, type: enum, source: input, description: "URBAN | RURAL — selects the drive-time variant (circuity factor and assumed speed)" }
      - { name: choice_requested, type: boolean, source: input, description: "True when the veteran invokes the community-care choice element" }
      - { name: drive_time_minutes, type: number, source: computed, description: "Drive time veteran home -> home station per the geo_classification variant (1 decimal, round_half_up)" }
      - { name: wait_days, type: integer, source: computed, description: "Wait days read from the home station field matching service_category at assessment time" }
      - { name: service_available, type: boolean, source: computed, description: "True iff home station service_codes contains service_code" }
      - { name: drive_standard_failed, type: boolean, source: computed, description: "True iff drive_time_minutes > DRIVE_TIME_STANDARD for the category (strictly greater; exactly equal passes)" }
      - { name: wait_standard_failed, type: boolean, source: computed, description: "True iff wait_days > WAIT_TIME_STANDARD for the category (strictly greater; exactly equal passes)" }
      - { name: choice_granted, type: boolean, source: computed, description: "True iff choice_requested AND priority_group <= CHOICE_PRIORITY_MAX(4)" }
      - { name: eligible, type: boolean, source: computed, description: "True iff (NOT service_available) OR drive_standard_failed OR wait_standard_failed OR choice_granted" }
      - { name: status, type: enum, source: system, default: CURRENT, description: "CURRENT | SUPERSEDED. Creating a new assessment for the same (veteran_id, service_code) supersedes the prior CURRENT one." }

  - name: ReferralAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: veteran_id, type: string, source: input, description: "FK -> Veteran.id" }
      - { name: assessment_id, type: string, source: input, description: "FK -> EligibilityAssessment.id; must be CURRENT and eligible" }
      - { name: provider_id, type: string, source: input, description: "FK -> CommunityProvider.id; must be CREDENTIALED and offer service_code" }
      - { name: tpa_id, type: string, source: computed, description: "FK -> ThirdPartyAdministrator.id; copied from provider.tpa_id at creation" }
      - { name: service_code, type: string, source: input, description: "Must equal the referenced assessment's service_code" }
      - { name: authorized_visits, type: integer, source: input, description: "Initially authorized visits, 1..INITIAL_VISIT_MAX(12)" }
      - { name: duration_days, type: integer, source: input, description: "Episode duration in days, 1..DURATION_MAX_DAYS(365)" }
      - { name: start_date, type: string, source: input, description: "Episode start date ISO yyyy-mm-dd" }
      - { name: end_date_exclusive, type: string, source: computed, description: "= start_date + duration_days + sum of requested_extra_days over APPROVED extensions; episode window is half-open [start_date, end_date_exclusive) on calendar dates" }
      - { name: extended_visits, type: integer, source: computed, default: 0, description: "Sum of requested_visits over APPROVED ExtensionRequests" }
      - { name: reserved_visits, type: integer, source: computed, default: 0, description: "Appointments currently SCHEDULED against this authorization" }
      - { name: completed_visits, type: integer, source: computed, default: 0, description: "Appointments currently COMPLETED against this authorization" }
      - { name: remaining_visits, type: integer, source: computed, description: "= authorized_visits + extended_visits - completed_visits - reserved_visits" }
      - { name: scheduling_responsibility, type: enum, source: computed, description: "TPA iff provider.contract_scheduling == TPA else VAMC" }
      - { name: authorized_at, type: datetime, source: system, description: "Set when the authorize transition fires; null while PENDING_REVIEW" }
      - { name: docs_suspension_return_state, type: enum, source: system, description: "AUTHORIZED | ACTIVE | null — remembered state to restore when a documentation suspension clears" }
      - { name: status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW | AUTHORIZED | ACTIVE | DOCS_SUSPENDED | EXPIRED | EXHAUSTED | CLOSED | CANCELLED" }

  - name: ExtensionRequest
    parent: null
    common_fields: true
    fields:
      - { name: referral_authorization_id, type: string, source: system, description: "FK -> ReferralAuthorization.id; taken from the creation path" }
      - { name: requested_visits, type: integer, source: input, description: "Additional visits requested, 1..EXTENSION_VISIT_MAX(12)" }
      - { name: requested_extra_days, type: integer, source: input, description: "Additional episode days requested, 0..EXTENSION_DAYS_MAX(180)" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | DENIED" }
      - { name: denial_reason, type: string, source: system, description: "Set on decide-DENIED or on cascade auto-denial (DOCS_OVERDUE | AUTH_CANCELLED | reviewer free text)" }
      - { name: decided_at, type: datetime, source: system, description: "Set when decided; null while PENDING" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: referral_authorization_id, type: string, source: system, description: "FK -> ReferralAuthorization.id; taken from the creation path" }
      - { name: provider_id, type: string, source: computed, description: "Provider reference copied from the authorization at creation (denormalized read cache; canonical link is referral_authorization_id)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Appointment start ISO8601 UTC; occupies the half-open slot [scheduled_start, scheduled_start + APPT_SLOT_MINUTES(60))" }
      - { name: requested_date, type: string, source: input, description: "Date the veteran requested the appointment (yyyy-mm-dd); VAMC timeliness anchor" }
      - { name: timeliness_anchor, type: enum, source: computed, description: "AUTHORIZED_AT when scheduling_responsibility == TPA, else REQUESTED_DATE" }
      - { name: within_standard, type: boolean, source: computed, description: "True iff (date(scheduled_start) - anchor_date) <= SCHEDULE_TIMELINESS_DAYS(5) calendar days, anchor per timeliness_anchor" }
      - { name: completed_at, type: datetime, source: system, description: "Set on completion; null otherwise" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: MedicalDocumentation
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: system, description: "FK -> Appointment.id; exactly one record per appointment, auto-created AWAITED on appointment completion" }
      - { name: referral_authorization_id, type: string, source: computed, description: "Authorization reference copied from the appointment at creation (denormalized read cache; canonical link is appointment_id)" }
      - { name: content_ref, type: string, source: input, description: "Document bundle reference supplied by the community provider" }
      - { name: status, type: enum, source: system, default: AWAITED, description: "AWAITED | RECEIVED | OVERDUE | ACCEPTED" }
      - { name: deadline_at, type: datetime, source: computed, description: "= appointment.completed_at + DOC_RETURN_DEADLINE_DAYS(30); on reviewer REJECT resets to rejected_at + DOC_RESUBMIT_GRACE_DAYS(15)" }
      - { name: rejection_count, type: integer, source: computed, default: 0, description: "Number of reviewer rejections (RECEIVED -> AWAITED cycles)" }
      - { name: submitted_at, type: datetime, source: system, description: "Set on each provider submission; null until first submission" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: referral_authorization_id, type: string, source: input, description: "FK -> ReferralAuthorization.id" }
      - { name: provider_id, type: string, source: computed, description: "FK -> CommunityProvider.id; copied from the authorization (the submitting ProviderRep must own it)" }
      - { name: tpa_id, type: string, source: computed, description: "FK -> ThirdPartyAdministrator.id; copied from the authorization" }
      - { name: service_date, type: string, source: input, description: "Date of service yyyy-mm-dd; must fall inside the episode window and match a COMPLETED appointment's scheduled date" }
      - { name: service_lines, type: array, source: input, description: "Array of {service_code, service_category (PRIMARY_CARE|SPECIALTY_CARE), units (int>=1), unit_billed_cents (int>0)}; at least one line" }
      - { name: billed_total_cents, type: integer, source: computed, description: "Sum of unit_billed_cents * units over lines" }
      - { name: paid_amount_cents, type: integer, source: computed, description: "Net payment computed at adjudicate-PAID per claim_payment; null until PAID" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | PAID | DENIED | REVERSED" }
      - { name: denial_reason, type: enum, source: system, description: "PROVIDER_DECREDENTIALED | CLINICAL_REVIEW | DUPLICATE | OTHER; required when decided DENIED" }
      - { name: resubmit_count, type: integer, source: computed, default: 0, description: "Number of DENIED -> RECEIVED resubmissions; hard cap RESUBMISSION_MAX(2)" }
      - { name: reversed_reason, type: string, source: system, description: "Free-text reason recorded on reverse-payment" }
      - { name: submitted_at, type: datetime, source: system, description: "Current submission timestamp (reset on each resubmission)" }

  - name: UrgentCareVisit
    parent: null
    common_fields: true
    fields:
      - { name: veteran_id, type: string, source: input, description: "FK -> Veteran.id; a Veteran-role caller must act on their own id" }
      - { name: facility_name, type: string, source: input, description: "In-network urgent care facility name" }
      - { name: visit_date, type: string, source: computed, description: "Calendar date (yyyy-mm-dd) of the logical clock at creation" }
      - { name: fiscal_year, type: integer, source: computed, description: "FY bucket of visit_date: year+1 when month >= 10 else year (FY starts Oct 1)" }
      - { name: priority_band, type: enum, source: computed, description: "LOW (priority_group 1..3) | MID (4..6) | HIGH (7..8)" }
      - { name: visit_index_in_fy, type: integer, source: computed, description: "= count of the veteran's RECORDED urgent care visits in the same fiscal_year strictly before this one + 1" }
      - { name: copay_cents, type: integer, source: computed, description: "Per urgent_care_copay: LOW always 0; MID 1500 for visit_index<=3 else 3000; HIGH 3000 for visit_index<=3 else 4500" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED (single-state; no transitions exist in this contract)" }

  - name: PrescriptionFillRequest
    parent: null
    common_fields: true
    fields:
      - { name: urgent_care_visit_id, type: string, source: input, description: "FK -> UrgentCareVisit.id; exactly one of urgent_care_visit_id / appointment_id must be present" }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; exactly one of urgent_care_visit_id / appointment_id must be present" }
      - { name: medication_name, type: string, source: input, description: "Medication description" }
      - { name: days_supply, type: integer, source: input, description: "Days of supply; <= RX_URGENT_MAX_DAYS(14) when urgent-linked, <= RX_REFERRAL_MAX_DAYS(90) when appointment-linked" }
      - { name: controlled_substance, type: boolean, source: input, description: "Controlled substances are never fillable through this channel" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | FILLED | REFUSED" }
      - { name: decided_at, type: datetime, source: system, description: "Set on decide; null while REQUESTED" }
      - { name: refusal_reason, type: string, source: system, description: "Set when REFUSED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ThirdPartyAdministrator
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when denial_rate recompute after a claim-finalization event yields adjudicated_events >= MIN_ADJUDICATED_EVENTS(5) AND denial_rate > DENIAL_RATE_THRESHOLD(0.20))"
        actor: system
        preconditions:
          - "adjudicated_events >= 5"
          - "denial_rate > 0.20 (strictly greater; exactly 0.20 does not suspend)"
        side_effects:
          - "contract_status -> SUSPENDED; new Claim submissions for authorizations under this TPA are rejected with ERR_TPA_SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "none (no reinstatement path exists in this contract)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Declared only to document that SUSPENDED is absorbing for the benchmark."

  - entity: CommunityProvider
    initial_state: PENDING
    terminal_states: [DECREDENTIALED]
    transitions:
      - from: PENDING
        to: CREDENTIALED
        trigger: "POST /community-care/providers/{id}/credential-decision with target_status=CREDENTIALED"
        actor: NetworkManager
        preconditions:
          - "credentialing_status == PENDING (else ERR_INVALID_STATE)"
        side_effects: []
      - from: PENDING
        to: DECREDENTIALED
        trigger: "POST /community-care/providers/{id}/credential-decision with target_status=DECREDENTIALED"
        actor: NetworkManager
        preconditions:
          - "credentialing_status == PENDING (else ERR_INVALID_STATE)"
        side_effects: []
      - from: CREDENTIALED
        to: SUSPENDED
        trigger: "POST /community-care/providers/{id}/credential-decision with target_status=SUSPENDED"
        actor: NetworkManager
        preconditions:
          - "credentialing_status == CREDENTIALED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: CREDENTIALED
        trigger: "POST /community-care/providers/{id}/credential-decision with target_status=CREDENTIALED"
        actor: NetworkManager
        preconditions:
          - "credentialing_status == SUSPENDED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: CREDENTIALED
        to: DECREDENTIALED
        trigger: "POST /community-care/providers/{id}/credential-decision with target_status=DECREDENTIALED"
        actor: NetworkManager
        preconditions:
          - "credentialing_status == CREDENTIALED (else ERR_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: every Claim of this provider in RECEIVED status -> DENIED with denial_reason=PROVIDER_DECREDENTIALED"
          - "Cascade link 2 (caused by link 1, per auto-denied claim): claim.tpa's adjudicated_events += 1 and denied_events += 1; denial_rate recomputed; if adjudicated_events >= 5 AND denial_rate > 0.20 the TPA auto-transitions ACTIVE -> SUSPENDED"

  - entity: EligibilityAssessment
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system (when POST /community-care/veterans/{veteranId}/eligibility-assessments succeeds for the same (veteran_id, service_code))"
        actor: system
        preconditions:
          - "the new assessment's service_code equals this assessment's service_code"
        side_effects:
          - "veteran.version increments by 1 (supersede is a Veteran mutation)"

  - entity: ReferralAuthorization
    initial_state: PENDING_REVIEW
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PENDING_REVIEW
        to: AUTHORIZED
        trigger: "POST /community-care/referral-authorizations/{id}/authorize"
        actor: CareCoordinator
        preconditions:
          - "status == PENDING_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "authorized_at := current logical clock; version increments by 1"
      - from: AUTHORIZED
        to: ACTIVE
        trigger: "system (automatic when the first Appointment is created against the authorization)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (automatic when remaining_visits reaches 0 after an appointment completion or cancellation recompute)"
        actor: system
        preconditions:
          - "remaining_visits == 0"
        side_effects:
          - "If no MedicalDocumentation of this authorization is in {AWAITED, RECEIVED, OVERDUE}: immediately continue to CLOSED"
      - from: AUTHORIZED
        to: EXPIRED
        trigger: "system (on logical-clock set when current date >= end_date_exclusive and remaining_visits > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 1: every Appointment of this authorization in SCHEDULED status -> CANCELLED (reserved_visits released)"
          - "Cascade link 2 (caused by link 1, per cancelled appointment): remaining_visits recomputed; any PENDING ExtensionRequest of this authorization -> DENIED with denial_reason=AUTH_CANCELLED"
          - "If no MedicalDocumentation of this authorization is in {AWAITED, RECEIVED, OVERDUE}: immediately continue to CLOSED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (on logical-clock set when current date >= end_date_exclusive and remaining_visits > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 1: every Appointment of this authorization in SCHEDULED status -> CANCELLED (reserved_visits released)"
          - "Cascade link 2 (caused by link 1, per cancelled appointment): remaining_visits recomputed; any PENDING ExtensionRequest of this authorization -> DENIED with denial_reason=AUTH_CANCELLED"
          - "If no MedicalDocumentation of this authorization is in {AWAITED, RECEIVED, OVERDUE}: immediately continue to CLOSED"
      - from: EXPIRED
        to: CLOSED
        trigger: "system (automatic when the last non-ACCEPTED MedicalDocumentation of this authorization becomes ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: CLOSED
        trigger: "system (automatic when the last non-ACCEPTED MedicalDocumentation of this authorization becomes ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AUTHORIZED
        to: DOCS_SUSPENDED
        trigger: "system (when a MedicalDocumentation of this authorization becomes OVERDUE)"
        actor: system
        preconditions: []
        side_effects:
          - "docs_suspension_return_state := AUTHORIZED"
          - "Cascade link 1: every PENDING ExtensionRequest of this authorization -> DENIED with denial_reason=DOCS_OVERDUE"
      - from: ACTIVE
        to: DOCS_SUSPENDED
        trigger: "system (when a MedicalDocumentation of this authorization becomes OVERDUE)"
        actor: system
        preconditions: []
        side_effects:
          - "docs_suspension_return_state := ACTIVE"
          - "Cascade link 1: every PENDING ExtensionRequest of this authorization -> DENIED with denial_reason=DOCS_OVERDUE"
      - from: DOCS_SUSPENDED
        to: AUTHORIZED
        trigger: "system (when the last OVERDUE/AWAITED MedicalDocumentation of this authorization becomes ACCEPTED and return state was AUTHORIZED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DOCS_SUSPENDED
        to: ACTIVE
        trigger: "system (when the last OVERDUE/AWAITED MedicalDocumentation of this authorization becomes ACCEPTED and return state was ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AUTHORIZED
        to: CANCELLED
        trigger: "POST /community-care/referral-authorizations/{id}/cancel"
        actor: CareCoordinator | Veteran
        preconditions:
          - "status in {AUTHORIZED, ACTIVE, DOCS_SUSPENDED} (else ERR_INVALID_STATE)"
          - "Veteran-role caller must own referral_authorization.veteran_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "Cascade link 1: every Appointment in SCHEDULED status -> CANCELLED (reserved_visits released)"
          - "Cascade link 2 (caused by link 1): PENDING ExtensionRequests -> DENIED with denial_reason=AUTH_CANCELLED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /community-care/referral-authorizations/{id}/cancel"
        actor: CareCoordinator | Veteran
        preconditions:
          - "status in {AUTHORIZED, ACTIVE, DOCS_SUSPENDED} (else ERR_INVALID_STATE)"
          - "Veteran-role caller must own referral_authorization.veteran_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "Cascade link 1: every Appointment in SCHEDULED status -> CANCELLED (reserved_visits released)"
          - "Cascade link 2 (caused by link 1): PENDING ExtensionRequests -> DENIED with denial_reason=AUTH_CANCELLED"
      - from: DOCS_SUSPENDED
        to: CANCELLED
        trigger: "POST /community-care/referral-authorizations/{id}/cancel"
        actor: CareCoordinator | Veteran
        preconditions:
          - "status in {AUTHORIZED, ACTIVE, DOCS_SUSPENDED} (else ERR_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: every Appointment in SCHEDULED status -> CANCELLED"
          - "Cascade link 2 (caused by link 1): PENDING ExtensionRequests -> DENIED with denial_reason=AUTH_CANCELLED"

  - entity: ExtensionRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /community-care/referral-authorizations/{id}/extension-requests/{extId}/decide with decision=APPROVED"
        actor: CareCoordinator
        preconditions:
          - "status == PENDING (else ERR_INVALID_STATE)"
          - "expected_referral_authorization_version == referral_authorization.version (else ERR_STALE_VERSION)"
          - "no MedicalDocumentation of the authorization in {AWAITED, RECEIVED, OVERDUE} (else ERR_DOCS_NOT_ACCEPTED)"
        side_effects:
          - "authorization.extended_visits += requested_visits; end_date_exclusive recomputed with requested_extra_days; authorization.version += 1"
      - from: PENDING
        to: DENIED
        trigger: "POST .../decide with decision=DENIED, or system cascade (DOCS_OVERDUE | AUTH_CANCELLED)"
        actor: CareCoordinator | system
        preconditions:
          - "status == PENDING (else ERR_INVALID_STATE); reviewer denial also requires expected_referral_authorization_version match"
        side_effects:
          - "denial_reason set; decided_at set; on reviewer decision authorization.version += 1"

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /community-care/appointments/{id}/complete"
        actor: ProviderRep
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE)"
          - "acting ProviderRep id == appointment.provider_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "completed_at := current logical clock"
          - "MedicalDocumentation record auto-created: status AWAITED, deadline_at = completed_at + 30 days"
          - "authorization: reserved_visits - 1, completed_visits + 1, remaining_visits recomputed; if remaining_visits == 0 authorization -> EXHAUSTED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /community-care/appointments/{id}/cancel, or system cascade (authorization expiry / cancel)"
        actor: CareCoordinator | TPAAdministrator | system
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "authorization: reserved_visits - 1, remaining_visits recomputed (the reserved visit is released)"

  - entity: MedicalDocumentation
    initial_state: AWAITED
    terminal_states: [ACCEPTED]
    transitions:
      - from: AWAITED
        to: RECEIVED
        trigger: "POST /community-care/appointments/{id}/documentation"
        actor: ProviderRep
        preconditions:
          - "documentation record for the appointment exists and is in {AWAITED, OVERDUE} (else ERR_DOCUMENTATION_NOT_PENDING)"
          - "acting ProviderRep id == appointment.provider_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "content_ref, submitted_at set"
      - from: OVERDUE
        to: RECEIVED
        trigger: "POST /community-care/appointments/{id}/documentation"
        actor: ProviderRep
        preconditions:
          - "documentation record in {AWAITED, OVERDUE} (else ERR_DOCUMENTATION_NOT_PENDING)"
        side_effects:
          - "content_ref, submitted_at set; the authorization stays DOCS_SUSPENDED until reviewer ACCEPT"
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /community-care/medical-documentation/{id}/review with decision=ACCEPTED"
        actor: CareCoordinator
        preconditions:
          - "status == RECEIVED (else ERR_DOC_NOT_REVIEWABLE)"
        side_effects:
          - "If no other documentation of the authorization is in {AWAITED, OVERDUE, RECEIVED}: authorization DOCS_SUSPENDED -> docs_suspension_return_state, or EXPIRED/EXHAUSTED -> CLOSED"
      - from: RECEIVED
        to: AWAITED
        trigger: "POST /community-care/medical-documentation/{id}/review with decision=REJECTED"
        actor: CareCoordinator
        preconditions:
          - "status == RECEIVED (else ERR_DOC_NOT_REVIEWABLE)"
        side_effects:
          - "rejection_count += 1; deadline_at := current logical clock + DOC_RESUBMIT_GRACE_DAYS(15); content_ref cleared"
      - from: AWAITED
        to: OVERDUE
        trigger: "system (on logical-clock set when current timestamp > deadline_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 1: authorization (AUTHORIZED or ACTIVE) -> DOCS_SUSPENDED with return state remembered"
          - "Cascade link 2 (caused by link 1): every PENDING ExtensionRequest of the authorization -> DENIED with denial_reason=DOCS_OVERDUE"

  - entity: Claim
    initial_state: RECEIVED
    terminal_states: [REVERSED]
    transitions:
      - from: RECEIVED
        to: PAID
        trigger: "POST /community-care/claims/{id}/adjudicate with decision=PAID"
        actor: TPAAdministrator
        preconditions:
          - "status == RECEIVED (else ERR_INVALID_STATE)"
          - "acting TPAAdministrator id == claim.tpa_id (else ERR_OWNERSHIP_MISMATCH)"
          - "provider.credentialing_status == CREDENTIALED (else ERR_PROVIDER_NOT_CREDENTIALED)"
        side_effects:
          - "paid_amount_cents computed per claim_payment; provider.lifetime_paid_cents += paid_amount_cents; provider.current_paid_cents += paid_amount_cents"
          - "tpa.adjudicated_events += 1; denial_rate recomputed; auto-suspend check runs"
      - from: RECEIVED
        to: DENIED
        trigger: "POST /community-care/claims/{id}/adjudicate with decision=DENIED, or system cascade (provider decredentialing)"
        actor: TPAAdministrator | system
        preconditions:
          - "status == RECEIVED (else ERR_INVALID_STATE); reviewer denial requires denial_reason present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "tpa.adjudicated_events += 1; tpa.denied_events += 1; denial_rate recomputed; auto-suspend check runs"
      - from: DENIED
        to: RECEIVED
        trigger: "POST /community-care/claims/{id}/resubmit"
        actor: ProviderRep
        preconditions:
          - "status == DENIED (else ERR_INVALID_STATE)"
          - "resubmit_count < RESUBMISSION_MAX(2) (else ERR_RESUBMISSION_LIMIT)"
          - "timely filing re-checked against service_date at resubmission time (else ERR_UNTIMELY_FILED)"
          - "claim.tpa.contract_status == ACTIVE (else ERR_TPA_SUSPENDED)"
        side_effects:
          - "resubmit_count += 1; submitted_at reset to current logical clock; service_lines replaced"
      - from: PAID
        to: REVERSED
        trigger: "POST /community-care/claims/{id}/reverse-payment"
        actor: TPAAdministrator
        preconditions:
          - "status == PAID (else ERR_INVALID_STATE)"
          - "acting TPAAdministrator id == claim.tpa_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "provider.current_paid_cents -= paid_amount_cents; provider.reversed_cents += paid_amount_cents (lifetime_paid_cents unchanged)"

  - entity: UrgentCareVisit
    initial_state: RECORDED
    terminal_states: []
    transitions: []

  - entity: PrescriptionFillRequest
    initial_state: REQUESTED
    terminal_states: [FILLED, REFUSED]
    transitions:
      - from: REQUESTED
        to: FILLED
        trigger: "POST /community-care/prescription-fill-requests/{id}/decide with decision=FILLED"
        actor: SystemPharmacist
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_STATE)"
        side_effects:
          - "decided_at set"
      - from: REQUESTED
        to: REFUSED
        trigger: "POST /community-care/prescription-fill-requests/{id}/decide with decision=REFUSED"
        actor: SystemPharmacist
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_STATE)"
          - "refusal_reason present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "decided_at set; refusal_reason set"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: assessment-create-stale-veteran
    parent_entity: Veteran
    write_endpoint: "POST /community-care/veterans/{id}/eligibility-assessments"
    occ_field: expected_veteran_version
    description: |
      Creating an EligibilityAssessment against a Veteran whose version has
      advanced since the client last observed it is rejected. A prior successful
      assessment creation for the same veteran legitimately supersedes the older
      CURRENT assessment and bumps veteran.version, so a stale expected version
      means the caller's view of which assessment is current is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: extension-decision-stale-authorization
    parent_entity: ReferralAuthorization
    write_endpoint: "POST /community-care/referral-authorizations/{id}/extension-requests/{extId}/decide"
    occ_field: expected_referral_authorization_version
    description: |
      Deciding an ExtensionRequest against a ReferralAuthorization whose version
      has advanced since the reviewer last observed it is rejected. An approved
      extension legitimately mutates extended_visits / end_date_exclusive and
      bumps the authorization version, so a stale expected version means the
      reviewer decided on an obsolete episode scope.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: drive_time_minutes
    trigger: "EligibilityAssessment creation"
    algorithm: dual_variant_geodesic
    formula: |
      d = haversine_miles(veteran.home_latitude, veteran.home_longitude,
                          station.latitude, station.longitude)   # earth radius 3958.8 mi
      URBAN variant:  minutes = d * URBAN_CIRCUITY(1.4) / URBAN_SPEED_MPH(40) * 60
      RURAL variant:  minutes = d * RURAL_CIRCUITY(1.2) / RURAL_SPEED_MPH(55) * 60
      drive_time_minutes = round(minutes, 1, round_half_up)
    input_set: "Veteran (origin) and the veteran's home CareStation (destination); geo_classification selects the variant"
    constants:
      EARTH_RADIUS_MI: 3958.8
      URBAN_CIRCUITY: 1.4
      URBAN_SPEED_MPH: 40
      RURAL_CIRCUITY: 1.2
      RURAL_SPEED_MPH: 55
    precision: "1 decimal place, round_half_up"
    variants:
      - name: urban
        when: "assessment.geo_classification == URBAN"
        difference: "circuity 1.4 and 40 mph — 2.1000 min per crow-fly mile"
      - name: rural
        when: "assessment.geo_classification == RURAL"
        difference: "circuity 1.2 and 55 mph — 1.3091 min per crow-fly mile; identical coordinates yield lower minutes than urban"

  - name: eligibility_determination
    trigger: "EligibilityAssessment creation, after drive_time_minutes is computed"
    algorithm: boolean_rule_composition
    formula: |
      service_available = (service_code IN station.service_codes)
      drive_failed = drive_time_minutes > DRIVE_TIME_STANDARD[service_category]   # strict >
      wait_failed  = wait_days > WAIT_TIME_STANDARD[service_category]            # strict >
      choice_granted = choice_requested AND (veteran.priority_group <= CHOICE_PRIORITY_MAX)
      eligible = (NOT service_available) OR drive_failed OR wait_failed OR choice_granted
    input_set: "the assessment being created, its veteran, and the veteran's home station"
    constants:
      DRIVE_TIME_STANDARD_PRIMARY_MIN: 30
      DRIVE_TIME_STANDARD_SPECIALTY_MIN: 60
      WAIT_TIME_STANDARD_PRIMARY_DAYS: 20
      WAIT_TIME_STANDARD_SPECIALTY_DAYS: 28
      CHOICE_PRIORITY_MAX: 4
    precision: "boolean"

  - name: claim_payment
    trigger: "Claim adjudication with decision=PAID"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED: per line first, then sum. Never sum-then-round.
      for each line in claim.service_lines:
        rate_i = provider.contract_rates[line.service_code] if present
                 else MEDICARE_BASE_RATE_CENTS[line.service_category]
        allowed_i = min(line.unit_billed_cents * line.units, rate_i * line.units)
        fee_i     = round_half_up(allowed_i * TPA_ADMIN_FEE_RATE)   # integer cents, per line
        net_i     = allowed_i - fee_i
      paid_amount_cents = sum(net_i)
      # NOTE: fee_i per line then sum != round(sum(allowed_i) * RATE) in general;
      # the per-line rounding order above is the contract.
    input_set: "the claim being adjudicated and its provider's contract_rates"
    constants:
      TPA_ADMIN_FEE_RATE: 0.025
      MEDICARE_BASE_RATE_PRIMARY_CENTS: 10000
      MEDICARE_BASE_RATE_SPECIALTY_CENTS: 18000
    precision: "integer cents; per-line round_half_up then sum"
    variants:
      - name: contract_rate
        when: "provider.contract_rates contains the line's service_code"
        difference: "allowed uses the negotiated per-unit rate"
      - name: medicare_fallback
        when: "no contract rate for the line's service_code"
        difference: "allowed uses MEDICARE_BASE_RATE_CENTS[service_category]; identical lines price differently across the two variants"

  - name: urgent_care_copay
    trigger: "UrgentCareVisit creation"
    algorithm: threshold
    formula: |
      # PINNED evaluation order (circular-looking dependency resolved):
      # 1. fiscal_year of the new visit := year(visit_date)+1 if month>=10 else year(visit_date)
      # 2. prior_count := count of the veteran's OTHER visits with status RECORDED
      #    and the same fiscal_year (the new visit is NOT yet counted)
      # 3. visit_index_in_fy := prior_count + 1
      # 4. band := LOW if priority_group<=3, MID if <=6, HIGH if 7..8
      # 5. copay := band LOW -> 0
      #             band MID -> 1500 if visit_index_in_fy <= 3 else 3000
      #             band HIGH -> 3000 if visit_index_in_fy <= 3 else 4500
    input_set: "the veteran's RECORDED UrgentCareVisits (status filter: RECORDED only), same fiscal_year"
    constants:
      URGENT_VISIT_LOWER_TIER_MAX: 3
      COPAY_LOW_CENTS: 0
      COPAY_MID_FIRST_CENTS: 1500
      COPAY_MID_REPEAT_CENTS: 3000
      COPAY_HIGH_FIRST_CENTS: 3000
      COPAY_HIGH_REPEAT_CENTS: 4500
    precision: "integer cents"

  - name: appointment_timeliness
    trigger: "Appointment creation"
    algorithm: threshold
    formula: |
      anchor_date = authorization.authorized_at (date part) if scheduling_responsibility == TPA
                    else appointment.requested_date
      lag_days = date(scheduled_start) - anchor_date   # calendar days
      within_standard = (lag_days <= SCHEDULE_TIMELINESS_DAYS)   # inclusive; negative lag counts as within
    input_set: "the appointment and its authorization"
    constants:
      SCHEDULE_TIMELINESS_DAYS: 5
    precision: "boolean"
    variants:
      - name: tpa_anchor
        when: "authorization.scheduling_responsibility == TPA"
        difference: "measured from authorized_at"
      - name: vamc_anchor
        when: "authorization.scheduling_responsibility == VAMC"
        difference: "measured from the veteran's requested_date; identical scheduled_start can flip within_standard across variants"

  - name: remaining_visits_ledger
    trigger: "appointment create / complete / cancel; extension approval"
    algorithm: aggregation
    formula: |
      remaining_visits = authorized_visits + extended_visits - completed_visits - reserved_visits
      CONSERVED QUANTITY (visit ledger): at all times,
        authorized_visits + extended_visits == completed_visits + reserved_visits + remaining_visits
      Forward action: appointment create (reserved +1, remaining -1).
      Compensating action: appointment cancel (reserved -1, remaining +1).
    input_set: "the single authorization"
    precision: "integer"

  - name: tpa_denial_rate
    trigger: "every claim-finalization event (adjudicate PAID/DENIED, cascade auto-denial)"
    algorithm: threshold
    formula: |
      adjudicated_events += 1; if outcome == DENIED: denied_events += 1
      denial_rate = round(denied_events / adjudicated_events, 4, round_half_up) when adjudicated_events > 0 else 0
      if adjudicated_events >= MIN_ADJUDICATED_EVENTS AND denial_rate > DENIAL_RATE_THRESHOLD:
        tpa.contract_status -> SUSPENDED
    input_set: "claims whose tpa_id == this TPA"
    constants:
      MIN_ADJUDICATED_EVENTS: 5
      DENIAL_RATE_THRESHOLD: 0.20
    precision: "4 decimal places, round_half_up"

  - name: episode_window
    trigger: "authorization creation; extension approval"
    algorithm: calendar_arithmetic
    formula: |
      end_date_exclusive = start_date + duration_days days + sum(requested_extra_days over APPROVED extensions) days
      A date d is inside the episode iff start_date <= d < end_date_exclusive (half-open).
      Appointment window check uses date(scheduled_start); claim check uses service_date.
    input_set: "the authorization and its APPROVED extensions"
    precision: "calendar dates"

  - name: provider_payment_invariant
    trigger: "claim adjudicate PAID; claim reverse-payment"
    algorithm: aggregation
    formula: |
      CONSERVED QUANTITY (payment buckets): for each provider,
        lifetime_paid_cents == current_paid_cents + reversed_cents
      Forward action: adjudicate PAID adds paid_amount_cents to lifetime and current.
      Compensating action: reverse-payment moves paid_amount_cents from current to reversed;
      lifetime is unchanged, so the equality holds across the pair.
    input_set: "claims whose provider_id == this provider, status filter PAID and REVERSED"
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body-supplied FK references exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 3.2
    category: existence
    check: "Request shape: required fields present, types correct, enum members valid, array lengths >= 1 where required, exactly-one-of (urgent_care_visit_id, appointment_id) on PrescriptionFillRequest"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"
  - priority: 3.5
    category: existence
    check: "OCC: expected_<parent>_version equals the parent entity's current version (only on endpoints declaring an occ_field)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /community-care/veterans/{veteranId}/eligibility-assessments; POST /community-care/referral-authorizations/{id}/extension-requests/{extId}/decide"
  - priority: 4
    category: auth
    check: "Ownership: entity-backed caller owns the target (Veteran acts on own veteran_id; ProviderRep acts on own provider's appointments/claims/documentation; TPAAdministrator acts on own tpa's providers/claims; scheduler role must match authorization.scheduling_responsibility — TPAAdministrator of auth.tpa_id when TPA, CareCoordinator when VAMC)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "ownership-scoped endpoints"
  - priority: 5
    category: state
    check: "Lifecycle state permits the operation: claim create requires authorization in {ACTIVE, EXPIRED, EXHAUSTED, CLOSED} (ERR_REFERRAL_NOT_ACTIVE) and tpa.contract_status == ACTIVE (ERR_TPA_SUSPENDED); referral create requires assessment.status == CURRENT (ERR_ASSESSMENT_SUPERSEDED); extension create requires authorization in {AUTHORIZED, ACTIVE} (ERR_EXTENSION_WINDOW_CLOSED); all other transition guards per state machine (ERR_INVALID_STATE)"
    error_id: "ERR_INVALID_STATE | ERR_REFERRAL_NOT_ACTIVE | ERR_TPA_SUSPENDED | ERR_ASSESSMENT_SUPERSEDED | ERR_EXTENSION_WINDOW_CLOSED"
    http_status: 409
    applies_to: "state-gated endpoints"
  - priority: 6
    category: business_safety
    check: "Rx create: acting ProviderRep must be CREDENTIALED, and for appointment-linked requests must own the appointment (appointment must be COMPLETED — state gate). Regulatory/safety gates: referral create requires assessment.eligible == true (ERR_SERVICE_NOT_ELIGIBLE), provider CREDENTIALED (ERR_PROVIDER_NOT_CREDENTIALED), and no OVERDUE MedicalDocumentation on any of the veteran's authorizations (ERR_DOCS_OUTSTANDING); claim create AND claim adjudicate each require provider CREDENTIALED (ERR_PROVIDER_NOT_CREDENTIALED); rx create rejects controlled_substance == true (ERR_CONTROLLED_RX_NOT_ALLOWED); extension approve requires every documentation of the authorization ACCEPTED — none in {AWAITED, RECEIVED, OVERDUE} (ERR_DOCS_NOT_ACCEPTED)"
    error_id: "ERR_SERVICE_NOT_ELIGIBLE | ERR_PROVIDER_NOT_CREDENTIALED | ERR_CONTROLLED_RX_NOT_ALLOWED | ERR_DOCS_OUTSTANDING | ERR_DOCS_NOT_ACCEPTED"
    http_status: 422
    applies_to: "referral create; claim adjudicate; rx create"
  - priority: 7
    category: business_temporal
    check: "Temporal rules: claim service_date within TIMELY_FILING_DAYS(180) inclusive of the submission date (ERR_UNTIMELY_FILED); claim service_date inside episode window (ERR_SERVICE_DATE_OUTSIDE_EPISODE); appointment date(scheduled_start) inside episode window (ERR_AUTH_WINDOW_VIOLATION); urgent care second visit on the same calendar date for the same veteran (ERR_SAME_DAY_URGENT_VISIT)"
    error_id: "ERR_UNTIMELY_FILED | ERR_SERVICE_DATE_OUTSIDE_EPISODE | ERR_AUTH_WINDOW_VIOLATION | ERR_SAME_DAY_URGENT_VISIT"
    http_status: 422
    applies_to: "claim create/resubmit; appointment create; urgent care create"
  - priority: 8
    category: business_constraint
    check: "Constraint rules: provider 60-minute half-open slot collision (ERR_APPOINTMENT_SLOT_CONFLICT); overlapping non-terminal episode for same veteran+service_code (ERR_EPISODE_OVERLAP); requested_visits > EXTENSION_VISIT_MAX or requested_extra_days > EXTENSION_DAYS_MAX (ERR_EXTENSION_CAP); appointment create with remaining_visits == 0 (ERR_NO_VISITS_REMAINING); days_supply above the link-type cap (ERR_DAYS_SUPPLY_EXCEEDED); resubmit_count == RESUBMISSION_MAX (ERR_RESUBMISSION_LIMIT)"
    error_id: "ERR_APPOINTMENT_SLOT_CONFLICT | ERR_EPISODE_OVERLAP | ERR_EXTENSION_CAP | ERR_NO_VISITS_REMAINING | ERR_DAYS_SUPPLY_EXCEEDED | ERR_RESUBMISSION_LIMIT"
    http_status: 409
    applies_to: "appointment create; referral create; extension create; rx create; claim resubmit"
  - priority: 9
    category: business_referential
    check: "Referential consistency: referral service_code == assessment.service_code (ERR_SERVICE_CODE_MISMATCH); provider.service_codes contains service_code (ERR_PROVIDER_SERVICE_MISMATCH); claim create requires a COMPLETED appointment on the authorization whose date(scheduled_start) == service_date (ERR_NO_MATCHING_COMPLETED_APPOINTMENT)"
    error_id: "ERR_SERVICE_CODE_MISMATCH | ERR_PROVIDER_SERVICE_MISMATCH | ERR_NO_MATCHING_COMPLETED_APPOINTMENT"
    http_status: 422
    applies_to: "referral create; claim create"
  - priority: 10
    category: business_fiscal
    check: "Fiscal sanity: every claim service line has units >= 1 and unit_billed_cents > 0 (ERR_AMOUNT_INVALID)"
    error_id: ERR_AMOUNT_INVALID
    http_status: 422
    applies_to: "claim create; claim resubmit"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving logical clock ---
  - method: POST
    path: "/community-care/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z (never wall-clock). On each set, system sweeps run in order: (1) AUTHORIZED/ACTIVE authorizations with current date >= end_date_exclusive and remaining_visits > 0 -> EXPIRED (with cascades); (2) AWAITED documentations with deadline_at < now -> OVERDUE (with DOCS_SUSPENDED + extension auto-denial cascades); (3) EXPIRED/EXHAUSTED authorizations with no documentation in {AWAITED, RECEIVED, OVERDUE} -> CLOSED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["expiry sweep", "documentation overdue sweep + suspension cascade", "auto-close sweep"]

  # --- Care Stations ---
  - method: POST
    path: "/community-care/care-stations"
    description: "Register a VA care station"
    roles: [PlatformAdmin]
    code: 201
    input: [name, latitude, longitude, primary_wait_days, specialty_wait_days, service_codes]
    output: CareStation
    side_effects: []

  # --- Third-Party Administrators ---
  - method: POST
    path: "/community-care/tpas"
    description: "Register a TPA"
    roles: [PlatformAdmin]
    code: 201
    input: [name, region_code]
    output: ThirdPartyAdministrator
    side_effects: ["contract_status = ACTIVE; adjudicated_events = denied_events = 0; denial_rate = 0"]
  - method: GET
    path: "/community-care/tpas/{id}"
    description: "Get a TPA (includes live denial metrics and contract_status)"
    roles: &ALL_ROLES [PlatformAdmin, EligibilityClerk, CareCoordinator, NetworkManager, TPAAdministrator, ProviderRep, Veteran, SystemPharmacist]
    code: 200
    input: []
    output: ThirdPartyAdministrator
    side_effects: []

  # --- Community Providers ---
  - method: POST
    path: "/community-care/tpas/{id}/providers"
    description: "Onboard a community provider into a TPA network; acting TPAAdministrator must own {id}"
    roles: [TPAAdministrator]
    code: 201
    input: [name, service_codes, contract_scheduling, latitude, longitude, "contract_rates?"]
    output: CommunityProvider
    side_effects: ["credentialing_status = PENDING"]
  - method: GET
    path: "/community-care/tpas/{id}/providers"
    description: "List the providers of one TPA network (includes payment bucket totals and credentialing status)"
    roles: *ALL_ROLES
    code: 200
    input: ["credentialing_status?", "limit?", "offset?"]
    output: "CommunityProvider[]"
    side_effects: []
  - method: POST
    path: "/community-care/providers/{id}/credential-decision"
    description: "Credentialing lifecycle decision per the CommunityProvider state machine"
    roles: [NetworkManager]
    code: 200
    input: [target_status]
    output: CommunityProvider
    side_effects: ["on CREDENTIALED -> DECREDENTIALED: RECEIVED claims auto-DENIED (PROVIDER_DECREDENTIALED), TPA denial metrics updated, possible TPA auto-suspension"]

  # --- Veterans ---
  - method: POST
    path: "/community-care/veterans"
    description: "Enroll a veteran"
    roles: [EligibilityClerk]
    code: 201
    input: [full_name, home_station_id, priority_group, home_latitude, home_longitude]
    output: Veteran
    side_effects: []
  - method: GET
    path: "/community-care/veterans/{id}"
    description: "Get a veteran"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Veteran
    side_effects: []
  - method: GET
    path: "/community-care/veterans"
    description: "List veterans; filterable by home_station_id"
    roles: *ALL_ROLES
    code: 200
    input: ["home_station_id?", "priority_group?", "limit?", "offset?"]
    output: "Veteran[]"
    side_effects: []

  # --- Eligibility Assessments ---
  - method: POST
    path: "/community-care/veterans/{id}/eligibility-assessments"
    description: "Run an eligibility determination against access standards; supersedes the CURRENT assessment for the same (veteran, service_code). OCC-guarded on veteran.version."
    roles: [EligibilityClerk]
    code: 201
    input: [service_code, service_category, geo_classification, choice_requested, expected_veteran_version]
    output: EligibilityAssessment
    side_effects: ["drive_time_minutes / wait_days / flags / eligible computed", "prior CURRENT assessment for same (veteran_id, service_code) -> SUPERSEDED", "increments Veteran.version by 1"]
  - method: GET
    path: "/community-care/veterans/{id}/eligibility-assessments"
    description: "List a veteran's assessments (CURRENT and SUPERSEDED history)"
    roles: *ALL_ROLES
    code: 200
    input: ["status?", "service_code?", "limit?", "offset?"]
    output: "EligibilityAssessment[]"
    side_effects: []

  # --- Referral Authorizations ---
  - method: POST
    path: "/community-care/referral-authorizations"
    description: "Create a referral authorization (episode scope: visits + duration); status PENDING_REVIEW"
    roles: [CareCoordinator]
    code: 201
    input: [veteran_id, assessment_id, provider_id, service_code, authorized_visits, duration_days, start_date]
    output: ReferralAuthorization
    side_effects: ["tpa_id and scheduling_responsibility derived from provider", "end_date_exclusive computed", "remaining_visits = authorized_visits"]
  - method: GET
    path: "/community-care/referral-authorizations/{id}"
    description: "Get an authorization (includes visit ledger fields)"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ReferralAuthorization
    side_effects: []
  - method: GET
    path: "/community-care/referral-authorizations"
    description: "List authorizations; filterable"
    roles: *ALL_ROLES
    code: 200
    input: ["veteran_id?", "provider_id?", "tpa_id?", "assessment_id?", "status?", "limit?", "offset?"]
    output: "ReferralAuthorization[]"
    side_effects: []
  - method: POST
    path: "/community-care/referral-authorizations/{id}/authorize"
    description: "Authorize a PENDING_REVIEW referral"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: ReferralAuthorization
    side_effects: ["status -> AUTHORIZED; authorized_at set; increments ReferralAuthorization.version by 1"]
  - method: POST
    path: "/community-care/referral-authorizations/{id}/cancel"
    description: "Cancel an authorization (CareCoordinator, or the owning Veteran)"
    roles: [CareCoordinator, Veteran]
    code: 200
    input: []
    output: ReferralAuthorization
    side_effects: ["status -> CANCELLED", "SCHEDULED appointments -> CANCELLED (reserved released)", "PENDING extension requests -> DENIED (AUTH_CANCELLED)"]

  # --- Extension Requests ---
  - method: POST
    path: "/community-care/referral-authorizations/{id}/extension-requests"
    description: "Request more visits and/or days on an episode"
    roles: [ProviderRep, CareCoordinator]
    code: 201
    input: [requested_visits, requested_extra_days]
    output: ExtensionRequest
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/community-care/referral-authorizations/{id}/extension-requests"
    description: "List extension requests of an authorization"
    roles: *ALL_ROLES
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ExtensionRequest[]"
    side_effects: []
  - method: POST
    path: "/community-care/referral-authorizations/{id}/extension-requests/{extId}/decide"
    description: "Approve or deny an extension; OCC-guarded on authorization version; approval requires every documentation of the episode ACCEPTED"
    roles: [CareCoordinator]
    code: 200
    input: [decision, "denial_reason?", expected_referral_authorization_version]
    output: ExtensionRequest
    side_effects: ["on APPROVED: extended_visits += requested_visits; end_date_exclusive += requested_extra_days; increments ReferralAuthorization.version by 1", "on reviewer DENIED: increments ReferralAuthorization.version by 1"]

  # --- Appointments ---
  - method: POST
    path: "/community-care/referral-authorizations/{id}/appointments"
    description: "Schedule an appointment. Caller role must match scheduling_responsibility: TPAAdministrator owning auth.tpa_id when TPA, CareCoordinator when VAMC."
    roles: [CareCoordinator, TPAAdministrator]
    code: 201
    input: [scheduled_start, requested_date]
    output: Appointment
    side_effects: ["reserves one visit (reserved_visits += 1)", "first appointment flips AUTHORIZED -> ACTIVE", "within_standard computed"]
  - method: GET
    path: "/community-care/referral-authorizations/{id}/appointments"
    description: "List appointments of an authorization"
    roles: *ALL_ROLES
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []
  - method: GET
    path: "/community-care/appointments/{id}"
    description: "Get an appointment"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/community-care/appointments/{id}/complete"
    description: "Mark appointment completed by the treating provider; auto-creates AWAITED documentation"
    roles: [ProviderRep]
    code: 200
    input: []
    output: Appointment
    side_effects: ["completed_at set", "MedicalDocumentation created (AWAITED, deadline = completed_at + 30d)", "reserved -> completed; possible EXHAUSTED"]
  - method: POST
    path: "/community-care/appointments/{id}/cancel"
    description: "Cancel a SCHEDULED appointment; releases the reserved visit"
    roles: [CareCoordinator, TPAAdministrator]
    code: 200
    input: []
    output: Appointment
    side_effects: ["reserved_visits -= 1"]

  # --- Medical Documentation ---
  - method: POST
    path: "/community-care/appointments/{id}/documentation"
    description: "Provider submits/returns the episode documentation bundle"
    roles: [ProviderRep]
    code: 200
    input: [content_ref, "note?"]
    output: MedicalDocumentation
    side_effects: ["status AWAITED|OVERDUE -> RECEIVED; submitted_at set"]
  - method: GET
    path: "/community-care/appointments/{id}/documentation"
    description: "Get the appointment's documentation record (array of length 0 or 1)"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: "MedicalDocumentation[]"
    side_effects: []
  - method: POST
    path: "/community-care/medical-documentation/{id}/review"
    description: "Reviewer accepts or rejects returned documentation"
    roles: [CareCoordinator]
    code: 200
    input: [decision, "rejection_note?"]
    output: MedicalDocumentation
    side_effects: ["ACCEPTED: may clear DOCS_SUSPENDED or close a terminal authorization", "REJECTED: back to AWAITED, rejection_count += 1, deadline reset to now + 15d"]

  # --- Claims ---
  - method: POST
    path: "/community-care/claims"
    description: "Submit a claim through the administrator for care delivered under an authorization"
    roles: [ProviderRep]
    code: 201
    input: [referral_authorization_id, service_date, service_lines]
    output: Claim
    side_effects: ["provider_id/tpa_id copied from authorization", "billed_total_cents computed", "status = RECEIVED"]
  - method: GET
    path: "/community-care/claims/{id}"
    description: "Get a claim"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/community-care/claims"
    description: "List claims; filterable"
    roles: *ALL_ROLES
    code: 200
    input: ["provider_id?", "referral_authorization_id?", "tpa_id?", "status?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []
  - method: POST
    path: "/community-care/claims/{id}/adjudicate"
    description: "TPA adjudicates a RECEIVED claim; PAID computes claim_payment"
    roles: [TPAAdministrator]
    code: 200
    input: [decision, "denial_reason?"]
    output: Claim
    side_effects: ["on PAID: paid_amount_cents computed; provider lifetime/current buckets updated", "TPA adjudicated/denied metrics updated; auto-suspension check"]
  - method: POST
    path: "/community-care/claims/{id}/resubmit"
    description: "Resubmit a DENIED claim with corrected lines (max RESUBMISSION_MAX times)"
    roles: [ProviderRep]
    code: 200
    input: [service_lines]
    output: Claim
    side_effects: ["status -> RECEIVED; resubmit_count += 1; submitted_at reset; billed_total_cents recomputed"]
  - method: POST
    path: "/community-care/claims/{id}/reverse-payment"
    description: "Reverse a PAID claim (payment recoupment)"
    roles: [TPAAdministrator]
    code: 200
    input: [reason]
    output: Claim
    side_effects: ["status -> REVERSED; provider current_paid_cents -> reversed_cents (lifetime unchanged)"]

  # --- Urgent Care ---
  - method: POST
    path: "/community-care/urgent-care-visits"
    description: "Record an in-network urgent care visit (no referral required); computes copay tier"
    roles: [Veteran, EligibilityClerk]
    code: 201
    input: [veteran_id, facility_name]
    output: UrgentCareVisit
    side_effects: ["visit_date/fiscal_year from logical clock", "visit_index_in_fy and copay_cents computed per urgent_care_copay"]

  - method: GET
    path: "/community-care/veterans/{id}/urgent-care-visits"
    description: "List a veteran's urgent care visits (copay history)"
    roles: *ALL_ROLES
    code: 200
    input: ["fiscal_year?", "limit?", "offset?"]
    output: "UrgentCareVisit[]"
    side_effects: []

  # --- Prescription Fill Requests (coordination of care back to system pharmacy) ---
  - method: POST
    path: "/community-care/prescription-fill-requests"
    description: "Route a community-originated prescription to the system pharmacy; exactly one of urgent_care_visit_id / appointment_id"
    roles: [ProviderRep]
    code: 201
    input: ["urgent_care_visit_id?", "appointment_id?", medication_name, days_supply, controlled_substance]
    output: PrescriptionFillRequest
    side_effects: ["status = REQUESTED"]
  - method: GET
    path: "/community-care/prescription-fill-requests/{id}"
    description: "Get a fill request"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: PrescriptionFillRequest
    side_effects: []
  - method: GET
    path: "/community-care/prescription-fill-requests"
    description: "List fill requests; filterable"
    roles: *ALL_ROLES
    code: 200
    input: ["urgent_care_visit_id?", "appointment_id?", "status?", "limit?", "offset?"]
    output: "PrescriptionFillRequest[]"
    side_effects: []
  - method: POST
    path: "/community-care/prescription-fill-requests/{id}/decide"
    description: "System pharmacist fills or refuses the request"
    roles: [SystemPharmacist]
    code: 200
    input: [decision, "refusal_reason?"]
    output: PrescriptionFillRequest
    side_effects: ["status -> FILLED | REFUSED; decided_at set"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's allowed roles" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/malformed field, invalid enum member, empty service_lines, both-or-neither of (urgent_care_visit_id, appointment_id), DENIED decision without denial_reason, REFUSED without refusal_reason" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed caller does not own the target resource, or scheduler role does not match scheduling_responsibility" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State machine has no transition for this trigger from the current state (generic lifecycle guard)" }
  - { id: ERR_REFERRAL_NOT_ACTIVE, http: 409, condition: "Claim create: authorization not in {ACTIVE, EXPIRED, EXHAUSTED, CLOSED}" }
  - { id: ERR_TPA_SUSPENDED, http: 409, condition: "Claim create/resubmit: the authorization's TPA is contract_status == SUSPENDED" }
  - { id: ERR_ASSESSMENT_SUPERSEDED, http: 409, condition: "Referral create: referenced assessment is SUPERSEDED" }
  - { id: ERR_EXTENSION_WINDOW_CLOSED, http: 409, condition: "Extension create: authorization not in {AUTHORIZED, ACTIVE}" }
  - { id: ERR_SERVICE_NOT_ELIGIBLE, http: 422, condition: "Referral create: assessment.eligible is false" }
  - { id: ERR_PROVIDER_NOT_CREDENTIALED, http: 422, condition: "Referral create or claim adjudicate: provider credentialing_status != CREDENTIALED" }
  - { id: ERR_CONTROLLED_RX_NOT_ALLOWED, http: 422, condition: "Rx create: controlled_substance is true" }
  - { id: ERR_DOCS_OUTSTANDING, http: 422, condition: "Referral create: any MedicalDocumentation of this veteran (any authorization) is OVERDUE" }
  - { id: ERR_DOCS_NOT_ACCEPTED, http: 422, condition: "Extension approve: a documentation of this authorization is in {AWAITED, RECEIVED, OVERDUE}" }
  - { id: ERR_UNTIMELY_FILED, http: 422, condition: "Claim create/resubmit: submission date - service_date > TIMELY_FILING_DAYS(180)" }
  - { id: ERR_SERVICE_DATE_OUTSIDE_EPISODE, http: 422, condition: "Claim create/resubmit: service_date outside half-open episode window" }
  - { id: ERR_AUTH_WINDOW_VIOLATION, http: 422, condition: "Appointment create: date(scheduled_start) outside half-open episode window" }
  - { id: ERR_SAME_DAY_URGENT_VISIT, http: 422, condition: "Urgent care create: veteran already has a RECORDED visit with the same visit_date (closed day-granularity collision)" }
  - { id: ERR_APPOINTMENT_SLOT_CONFLICT, http: 409, condition: "Appointment create: provider already has a SCHEDULED appointment whose half-open 60-minute slot overlaps" }
  - { id: ERR_EPISODE_OVERLAP, http: 409, condition: "Referral create: a non-terminal authorization exists for the same veteran + service_code whose half-open episode window overlaps the requested one" }
  - { id: ERR_EXTENSION_CAP, http: 409, condition: "Extension create: requested_visits > 12 or requested_extra_days > 180" }
  - { id: ERR_NO_VISITS_REMAINING, http: 409, condition: "Appointment create: remaining_visits == 0" }
  - { id: ERR_DAYS_SUPPLY_EXCEEDED, http: 409, condition: "Rx create: days_supply > 14 (urgent-linked) or > 90 (appointment-linked)" }
  - { id: ERR_RESUBMISSION_LIMIT, http: 409, condition: "Claim resubmit: resubmit_count == 2" }
  - { id: ERR_SERVICE_CODE_MISMATCH, http: 422, condition: "Referral create: service_code differs from assessment.service_code" }
  - { id: ERR_PROVIDER_SERVICE_MISMATCH, http: 422, condition: "Referral create: provider.service_codes does not contain service_code" }
  - { id: ERR_NO_MATCHING_COMPLETED_APPOINTMENT, http: 422, condition: "Claim create/resubmit: no COMPLETED appointment on the authorization with date(scheduled_start) == service_date" }
  - { id: ERR_AMOUNT_INVALID, http: 422, condition: "Claim line with units < 1 or unit_billed_cents <= 0" }
  - { id: ERR_DOCUMENTATION_NOT_PENDING, http: 409, condition: "Documentation submit: no record for the appointment, or record is RECEIVED/ACCEPTED" }
  - { id: ERR_DOC_NOT_REVIEWABLE, http: 409, condition: "Documentation review: record not in RECEIVED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; seeds reference data and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /community-care/_clock/set_current_utc"
      - "POST /community-care/care-stations"
      - "POST /community-care/tpas"
    shared_operations: ["all GET endpoints"]
  - name: EligibilityClerk
    description: "VAMC enrollment/eligibility clerk; enrolls veterans, runs eligibility determinations, may register urgent care visits on a veteran's behalf"
    identity: opaque
    exclusive_operations:
      - "POST /community-care/veterans"
      - "POST /community-care/veterans/{id}/eligibility-assessments"
    shared_operations: ["POST /community-care/urgent-care-visits (with Veteran)", "all GET endpoints"]
  - name: CareCoordinator
    description: "VAMC care coordinator; authors and authorizes referrals, schedules VAMC-side appointments, reviews returned documentation, decides extensions"
    identity: opaque
    exclusive_operations:
      - "POST /community-care/referral-authorizations"
      - "POST /community-care/referral-authorizations/{id}/authorize"
      - "POST /community-care/referral-authorizations/{id}/extension-requests/{extId}/decide"
      - "POST /community-care/medical-documentation/{id}/review"
    shared_operations:
      - "POST /community-care/referral-authorizations/{id}/cancel (with Veteran)"
      - "POST /community-care/referral-authorizations/{id}/extension-requests (with ProviderRep)"
      - "POST /community-care/referral-authorizations/{id}/appointments (with TPAAdministrator; VAMC-side only per scheduling_responsibility)"
      - "POST /community-care/appointments/{id}/cancel (with TPAAdministrator)"
      - "all GET endpoints"
  - name: NetworkManager
    description: "VAMC community-care network manager; runs credentialing and contracting decisions"
    identity: opaque
    exclusive_operations:
      - "POST /community-care/providers/{id}/credential-decision"
    shared_operations: ["all GET endpoints"]
  - name: TPAAdministrator
    description: "Third-party administrator operator; onboards providers into its own network, schedules TPA-side appointments, adjudicates and reverses claims"
    identity: "entity_backed:ThirdPartyAdministrator"
    exclusive_operations:
      - "POST /community-care/tpas/{tpaId}/providers (own tpaId only)"
      - "POST /community-care/claims/{id}/adjudicate (own network's claims only)"
      - "POST /community-care/claims/{id}/reverse-payment (own network's claims only)"
    shared_operations:
      - "POST /community-care/referral-authorizations/{id}/appointments (TPA-side only per scheduling_responsibility)"
      - "POST /community-care/appointments/{id}/cancel (with CareCoordinator)"
      - "all GET endpoints"
  - name: ProviderRep
    description: "Community provider representative; completes appointments, returns documentation, submits and resubmits claims, originates prescriptions"
    identity: "entity_backed:CommunityProvider"
    exclusive_operations:
      - "POST /community-care/appointments/{id}/complete (own appointments only)"
      - "POST /community-care/appointments/{id}/documentation (own appointments only)"
      - "POST /community-care/claims (as the authorization's provider)"
      - "POST /community-care/claims/{id}/resubmit (own claims only)"
      - "POST /community-care/prescription-fill-requests"
    shared_operations:
      - "POST /community-care/referral-authorizations/{id}/extension-requests (with CareCoordinator)"
      - "all GET endpoints"
  - name: Veteran
    description: "The veteran; self-registers urgent care visits and may cancel own referrals"
    identity: "entity_backed:Veteran"
    exclusive_operations: []
    shared_operations:
      - "POST /community-care/urgent-care-visits (own veteran_id only; with EligibilityClerk)"
      - "POST /community-care/referral-authorizations/{id}/cancel (own referrals only; with CareCoordinator)"
      - "all GET endpoints"
  - name: SystemPharmacist
    description: "System pharmacy operator; fills or refuses routed prescriptions"
    identity: opaque
    exclusive_operations:
      - "POST /community-care/prescription-fill-requests/{id}/decide"
    shared_operations: ["all GET endpoints"]
