      - name: state_beats_fiscal_on_estimate_approve
        grounds:
          - validations[priority=8]
          - validations[priority=38]
        distinguishing_aspect: |
          Pair state-vs-business_fiscal: a DRAFT (never submitted) estimate whose total 102425
          exceeds the fleet limit 100000 is approve-attempted by a Dispatcher. Both
          ERR_INVALID_STATE (priority 8) and ERR_AUTHORIZATION_REQUIRED (priority 38) are
          satisfiable; priority 8 must win.
        test_recipe:
          setup:
            - "Fleet call DIAGNOSED (business hours, STANDARD tech); estimate 1.0h / 30 est miles / parts 80000 -> total 102425 > limit 100000, left in DRAFT."
          setup_api_calls:
