          assert:
            - "${cert_after} == DECERTIFIED after the DRAFT -> DECERTIFIED arc"
            - "${err} == ERR_FUND_DECERTIFIED with HTTP 409, not ERR_ALREADY_TERMINAL (priority 12 precedes 14)"
            - "${err_certify} == ERR_FUND_DECERTIFIED with HTTP 409 (self-certify is in priority 12's list too)"
            - "No AssetTest row was created for Fund.${fund_id} and its certification_status stays DECERTIFIED"

      - name: ordinary_character_and_mismatched_1231_basis_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=17]
          - errors[ERR_GAIN_NOT_ELIGIBLE]
          - entities.EligibleGain.gain_character
        distinguishing_aspect: "Priority 17 has two independent limbs and both must be exercised: ORDINARY character is never deferrable, and deadline_basis == SECTION_1231_YEAR_END is legal ONLY with gain_character == SECTION_1231_NET. Both are legal enum members, so this is 422 ERR_GAIN_NOT_ELIGIBLE, not the 400 ERR_INVALID_REQUEST an out-of-enum value produces."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /qof/investors"
