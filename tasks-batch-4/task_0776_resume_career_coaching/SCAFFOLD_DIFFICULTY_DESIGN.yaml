              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CareerAdmin
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/sessions"
              payload: { coach_id: "${coach_inactive}", session_type: "COACHING", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T11:00:00Z", expected_order_version: "${v0}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CareerAdmin
              captures: { v1: $.data.version }
            - call: "POST /orders/${order_id}/sessions"
              payload: { coach_id: "${coach_active}", session_type: "COACHING", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T11:00:00Z", expected_order_version: "${v1}" }
