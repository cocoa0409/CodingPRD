  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_allocate_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-allocate-stale-version]", "entities.SalesOrder.fields.version"]
        distinguishing_aspect: "Allocating with the current expected_sales_order_version succeeds and increments SalesOrder.version by 1."
        test_recipe:
          setup: ["OPEN wholesale order with one stock line"]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "OCC-1", description: "Part", list_price_cents: 5000, cost_cents: 2000, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /parts/${pid}/receive-stock"
              payload: { qty: 5 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${pid}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { v2: $.data.version, fs: $.data.fulfillment_status }
          assert:
            - "SalesOrder.${order_id}.fulfillment_status == ALLOCATED"
            - "SalesOrder.${order_id}.version == ${v1} + 1"

      - name: occ_allocate_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-allocate-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Allocating with a stale expected_sales_order_version (one behind, after a second line bumped it) returns ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["OPEN order with one line (version captured), then a second line is added bumping version"]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "OCC-2", description: "Part", list_price_cents: 5000, cost_cents: 2000, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /parts/${pid}/receive-stock"
              payload: { qty: 10 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${pid}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v_stale: $.data.version }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${pid}", qty: 1 }
              as: WholesaleRep
          trigger:
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v_stale}" }
              as: WholesaleRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION with HTTP 412"
            - "SalesOrder.${order_id}.fulfillment_status == OPEN (unchanged)"

      - name: occ_ship_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-ship-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Shipping with the pre-allocate version (stale by one after allocate bumped it) returns ERR_STALE_VERSION 412 on a different write_endpoint than allocate."
        test_recipe:
          setup: ["an ALLOCATED order whose pre-allocate version was captured"]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
