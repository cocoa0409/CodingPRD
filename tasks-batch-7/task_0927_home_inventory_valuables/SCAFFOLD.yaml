    output: CategorySchedule
    side_effects: []

  - method: GET
    path: "/vault/category-schedules"
    description: "Lists the category configuration table."
    roles: [PlatformAdmin, Homeowner, HouseholdMember, InsuranceAgent]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: CategorySchedule[]
    side_effects: []

  - method: POST
