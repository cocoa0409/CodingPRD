  - rule_id: boundary_precision_check
    instances:
      - name: emission_ratio_exactly_one_is_accepted_then_freezes
        grounds:
          - calculations.plant_compliance_posture
          - validations[priority 16 -> ERR_EMISSION_BUDGET_EXCEEDED]
          - endpoints[POST /formation-runs]
          - state_machines.Plant.compliance_posture
        distinguishing_aspect: |
          Metric: the lead-emission ratio, on POST /formation-runs. Both breakpoints are
          inclusive and they point in OPPOSITE directions at the same instant - a
          reservation landing exactly on ratio 1.0000 is ACCEPTED by the quota rule
          (<= 1.0000) and simultaneously satisfies the freeze rule (>= 1.0000), so the
          very request that is allowed makes the plant FROZEN. An off-by-one-hundredth
          reduction of the permit turns the same request into a refusal.
        test_recipe:
          setup:
            - "Plant whose monthly_lead_emission_permit_g is exactly 255.00 g - the reservation a 6-hour, 20.00 kW lead formation run produces (102.00 kWh * 2.5 g/kWh)."
            - "Two lots in FORMATION and two bays, so the follow-up attempt is refused by the posture and not by the bay."
