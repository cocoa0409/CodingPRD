              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "P3-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "BE", contact_email: "be@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_1: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "BF", contact_email: "bf@x.com", base_bid_cents: 9100000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_2: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_2}/withdraw"
              as: BuyoutLead
          trigger:
            - call: "GET /trade-packages/${tp_id}/bids?status=WITHDRAWN"
              as: BuyoutLead
              captures: { row_status: "$.data[0].status", row_id: "$.data[0].id" }
          assert:
            - "filtered list length == 1 and row_status == WITHDRAWN and row_id == ${bid_2}"
            - "unfiltered list length == 2 (WITHDRAWN bids remain queryable)"

  # ===========================================================================
  # Section 6 — Errors (triggerability cross-check; §1.8-covered as stubs)
  # ===========================================================================
  - section: errors
    instances:
      - name: err_stub_bid_after_deadline
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BID_AFTER_DEADLINE]"
        excluded_because:
          difficulty_instance: bid_received_after_exact_bid_due_instant_rejected
          rationale: "Asserted as the failure path of the named §1.8 instance (one second past bid_due_at)."
      - name: err_stub_no_awardable_bid
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NO_AWARDABLE_BID]"
        excluded_because:
          difficulty_instance: leveling_empty_candidate_set_after_all_bids_withdrawn
          rationale: "Asserted as the failure path of the named §1.8 instance (empty eligible set preempts target-bid check)."
      - name: err_stub_negotiation_round_exceeded
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NEGOTIATION_ROUND_EXCEEDED]"
        excluded_because:
          difficulty_instance: negotiation_cycle_pending_to_draft_loop_with_two_round_cap
          rationale: "Asserted as the failure path of the named §1.8 instance (third recommend at cap)."
      - name: err_stub_co_cumulative_limit
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CO_CUMULATIVE_LIMIT]"
        excluded_because:
          difficulty_instance: authority_cumulative_ratio_exactly_at_ten_percent_boundary
          rationale: "Asserted as the failure path of the named §1.8 instance (100001 over the inclusive 0.10 boundary)."
      - name: err_stub_insurance_cert_expired_issue
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INSURANCE_CERT_EXPIRED]"
        excluded_because:
          difficulty_instance: insurance_certificate_expired_at_logical_clock_overlap
          rationale: "Asserted at the issue gate in the named §1.8 instance; the execute-time re-evaluation path is separately covered by corner cert_expiry_reevaluated_at_execute_after_clock_advance."
      - name: err_stub_sov_not_approved
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SOV_NOT_APPROVED]"
        excluded_because:
          difficulty_instance: change_order_create_gated_on_subcontract_executed_and_sov_approved
          rationale: "Asserted as the second failure path of the named §1.8 instance."
      - name: err_stub_unresolved_life_safety_gap_at_award
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_UNRESOLVED_LIFE_SAFETY_GAP]"
        excluded_because:
          difficulty_instance: safety_beats_fiscal_life_safety_gap_over_contingency_exceeded
          rationale: "Asserted as the priority-winning error of the named §1.8 instance; the gap-defer path is separately covered by corner defer_life_safety_gap_rejected."
      - name: err_stub_invalid_state_masks_contingency
        claim_type: priority_ordering
        grounds:
          - "errors[ERR_INVALID_STATE_TRANSITION]"
          - "errors[ERR_CONTINGENCY_EXCEEDED]"
        excluded_because:
          difficulty_instance: state_beats_fiscal_invalid_state_over_contingency_exceeded
          rationale: "Priority-conflict pair asserted by the named §1.8 instance; ERR_CONTINGENCY_EXCEEDED gets its own direct trigger in corner recommend_over_contingency_cap_rejected."

  # ===========================================================================
  # Section 7 — RBAC
  # ===========================================================================
  - section: rbac
    instances:
      - name: award_by_operations_manager_succeeds
        claim_type: satisfaction_pass
        grounds:
          - "roles.\"OperationsManager"
          - "state_machines.Subcontract.PENDING_AWARD_to_AWARDED"
        distinguishing_aspect: "The OperationsManager-exclusive award succeeds end-to-end (positive RBAC counterpart to the 403 denials): PENDING_AWARD -> AWARDED, bonding_requirement PENDING_DECISION under PER_TRADE_RISK."
        test_recipe:
          setup: ["subcontract PENDING_AWARD at 9000000, policy PER_TRADE_RISK"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-R1", project_number: "R1", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
