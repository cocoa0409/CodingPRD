# =============================================================================
# Specialty-Food & Gourmet DTC (hot sauce / coffee / snack) — Scaffold seed tables
# §1.0–§1.7  (Expert difficulty)
# =============================================================================

scenario: "724. Specialty-Food & Gourmet DTC (hot sauce/coffee/snack): SKU & batch/lot inventory, one-time vs subscription cadence, flavor/tier selection & swap, shipping (perishable/ambient) & zone, gift & corporate-bulk, allergen/labeling & FDA, referral & loyalty, churn/win-back"

domain_name: specialty-food-dtc
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation        # finite batch/lot inventory reserved -> committed -> released across orders & subscriptions
  secondary_archetype: pricing_engine        # multi-dimensional order/quote totals, tiered discounts, loyalty redemption
  complexity_layers:
    - dual_variant_calculation               # provisional vs final renewal charge; chronic vs acute churn risk
    - cascading_side_effects                 # ship -> lot decrement -> SKU availability -> subscription pause; cancel compensation chain
    - rate_threshold_triggers                # volume-discount tiers, churn AT_RISK/CHURN_IMMINENT breakpoints, lot expiry
    - optimistic_concurrency                 # OCC on Subscription.version for swap-supersede; OCC on Lot.version for allocation

  entity_topology: flat
  # Peer entities linked by foreign keys (Customer, Sku, Lot, Subscription, Order, ...). Orders/Subscriptions
  # reference Customer/Sku by FK in the body, not by nested URL ownership tree.

  state_machine_shape: parallel
  # Order carries two independent state axes (payment_status × fulfillment_status); Subscription is cyclic
  # (ACTIVE -> PAUSED -> ACTIVE renewal loop); Lot has a branching compliance/expiry shape.

  relationship_patterns:
    - one_to_many            # Customer 1..* Order / Subscription / Referral; Sku 1..* Lot
    - cross_aggregate        # OrderLine references Sku and reserves against a chosen Lot
    - self_referential       # Referral links referrer Customer -> referred Customer (both Customer rows)

  role_model: peer_roles
  # Customer acts on own subscriptions/orders; InventoryManager owns Sku/Lot; ComplianceOfficer owns
  # allergen/labeling holds; PlatformAdmin operational superset; CorporateBuyer files bulk quotes.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope  (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: email, type: string, source: input, description: "Unique account email" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: home_zone, type: enum, source: input, description: "Shipping zone for this address. One of Z1|Z2|Z3|Z4" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DORMANT | WON_BACK", default: "ACTIVE" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Refund/store credit balance, never negative", default: 0 }
      - { name: loyalty_points_balance, type: integer, source: computed, description: "Redeemable loyalty points; 1 point == 1 cent on redemption", default: 0 }
      - { name: lifetime_order_count, type: integer, source: computed, description: "Count of Orders that ever reached fulfillment_status SHIPPED", default: 0 }
      - { name: lifetime_failed_payment_count, type: integer, source: computed, description: "Lifetime count of FAILED payment attempts across the customer's orders/subscriptions", default: 0 }
      - { name: lifetime_skip_count, type: integer, source: computed, description: "Lifetime count of subscription cycles skipped", default: 0 }
      - { name: last_order_at, type: datetime, source: computed, description: "created_at of the most recent Order, or null" }
      - { name: churn_risk_score, type: integer, source: computed, description: "0..100 acute churn-risk score; recomputed on order/skip/payment events. See calc churn_risk_score (ACUTE variant)" }
      - { name: churn_band, type: enum, source: computed, description: "OK (<50) | AT_RISK (>=50 and <70) | CHURN_IMMINENT (>=70). Derived from churn_risk_score" }
      - { name: winback_eligible, type: boolean, source: computed, description: "True iff status==DORMANT AND churn_band==CHURN_IMMINENT and no active win-back offer outstanding" }

  - name: Sku
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: name, type: string, source: input, description: "Product name e.g. 'Ghost Reaper Hot Sauce'" }
      - { name: category, type: enum, source: input, description: "HOT_SAUCE | COFFEE | SNACK" }
      - { name: storage_class, type: enum, source: input, description: "AMBIENT | PERISHABLE — perishable lines drive cold-pack handling and expedited shipping" }
      - { name: unit_price_cents, type: integer, source: input, description: "List price per unit; minimum 1" }
      - { name: allergens, type: array, source: input, description: "Array of allergen tokens from {MILK,EGG,FISH,SHELLFISH,TREE_NUT,PEANUT,WHEAT,SOY,SESAME}", default: [] }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | LABEL_HOLD | DISCONTINUED", default: "DRAFT" }
      - { name: label_approved, type: boolean, source: computed, description: "True once ComplianceOfficer approves the allergen label; required before ACTIVE", default: false }
      - { name: available_units, type: integer, source: computed, description: "Sum of remaining_units over this SKU's Lots in RELEASED status whose expiry has not passed, minus reserved_units", default: 0 }
      - { name: reserved_units, type: integer, source: computed, description: "Sum of OrderLine.quantity for lines in PENDING reservation against this SKU", default: 0 }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: sku_id, type: string, source: input, description: "FK -> Sku.id; the SKU this batch/lot stocks" }
      - { name: lot_code, type: string, source: input, description: "Batch/lot code printed on packaging, e.g. 'L2026-014'" }
      - { name: produced_units, type: integer, source: input, description: "Units manufactured in this lot; minimum 1; immutable after release" }
      - { name: remaining_units, type: integer, source: computed, description: "produced_units minus units committed to shipped order lines drawing this lot, never negative", default: 0 }
      - { name: expiry_iso, type: datetime, source: input, description: "Best-by / expiry instant (ISO8601 UTC). A lot is consumable only while current clock < expiry_iso" }
      - { name: status, type: enum, source: system, description: "QUARANTINE | RELEASED | EXPIRED | RECALLED", default: "QUARANTINE" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the subscriber" }
      - { name: sku_id, type: string, source: input, description: "FK -> Sku.id; the selected flavor/product for this subscription" }
      - { name: tier, type: enum, source: input, description: "STARTER | CLASSIC | RESERVE — drives monthly base price and loyalty discount tier" }
      - { name: cadence_days, type: integer, source: input, description: "Renewal cadence in days; one of {14,28,56}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | CANCELLED", default: "ACTIVE" }
      - { name: next_renewal_iso, type: datetime, source: computed, description: "Clock instant of next scheduled renewal; advances by cadence_days on each renewal" }
      - { name: consecutive_skip_count, type: integer, source: computed, description: "Number of consecutive cycles skipped since last fulfilled renewal; auto-pauses at 3", default: 0 }
      - { name: provisional_charge_cents, type: integer, source: computed, description: "Forward-looking estimate of next renewal charge (PROVISIONAL variant). See calc subscription_renewal_charge" }
      - { name: pending_swap_sku_id, type: string, source: input, description: "FK -> Sku.id; staged flavor swap that takes effect at next renewal, or null", default: null }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the buyer" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; set when this order was created by a renewal, else null", default: null }
      - { name: order_kind, type: enum, source: input, description: "ONE_TIME | SUBSCRIPTION | GIFT | CORPORATE_BULK" }
      - { name: ship_zone, type: enum, source: input, description: "Destination zone Z1|Z2|Z3|Z4 (gift orders may differ from buyer home_zone)" }
      - { name: gift_recipient_email, type: string, source: input, description: "Required when order_kind==GIFT; recipient contact", default: null }
      - { name: gift_box_count, type: integer, source: input, description: "Number of gift-wrap boxes; 0 for non-gift", default: 0 }
      - { name: requested_redeem_points, type: integer, source: input, description: "Loyalty points the buyer asks to redeem at checkout; capped per calc order_total", default: 0 }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | FAILED | REFUNDED — independent axis (parallel state machine)", default: "UNPAID" }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT | RESERVED | SHIPPED | DELIVERED | CANCELLED — independent axis (parallel state machine)", default: "DRAFT" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line extensions before discount. See calc order_total" }
      - { name: discount_cents, type: integer, source: computed, description: "Volume discount applied to subtotal" }
      - { name: handling_cents, type: integer, source: computed, description: "Perishable cold-pack handling surcharge" }
      - { name: shipping_cents, type: integer, source: computed, description: "Zone + perishable-expedite shipping cost" }
      - { name: redeemed_points, type: integer, source: computed, description: "Loyalty points actually redeemed (capped)", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "Final charged total after discount/handling/shipping/redemption" }
      - { name: accrued_points, type: integer, source: computed, description: "Loyalty points accrued on this order's ambient lines; credited on SHIPPED. See calc loyalty_points_accrual", default: 0 }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; parent order" }
      - { name: sku_id, type: string, source: input, description: "FK -> Sku.id; product on this line" }
      - { name: lot_id, type: string, source: computed, description: "FK -> Lot.id; lot selected by the FEFO selector at reservation (earliest expiry_iso first)", default: null }
      - { name: quantity, type: integer, source: input, description: "Units ordered on this line; minimum 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Snapshot of Sku.unit_price_cents at reservation" }
      - { name: line_status, type: enum, source: system, description: "PENDING | COMMITTED | RELEASED — PENDING reserves availability, COMMITTED decrements lot, RELEASED frees on cancel", default: "PENDING" }

  - name: BulkQuote
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: corporate_buyer_id, type: string, source: input, description: "FK -> Customer.id; the corporate buyer account" }
      - { name: sku_id, type: string, source: input, description: "FK -> Sku.id; single-SKU bulk line" }
      - { name: quantity, type: integer, source: input, description: "Bulk unit count; minimum 1" }
      - { name: gift_box_count, type: integer, source: input, description: "Branded gift boxes for the bulk shipment", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | QUOTED | ACCEPTED | EXPIRED", default: "DRAFT" }
      - { name: line_subtotal_cents, type: integer, source: computed, description: "quantity * Sku.unit_price_cents" }
      - { name: discount_cents, type: integer, source: computed, description: "Bulk volume discount. See calc corporate_bulk_quote" }
      - { name: handling_cents, type: integer, source: computed, description: "Tier-keyed handling fee" }
      - { name: total_cents, type: integer, source: computed, description: "Final quoted total" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: referrer_id, type: string, source: input, description: "FK -> Customer.id; existing customer who referred" }
      - { name: referred_id, type: string, source: input, description: "FK -> Customer.id; the newly-referred customer (self-referential link between two Customers)" }
      - { name: status, type: enum, source: system, description: "PENDING | QUALIFIED | REWARDED | VOID", default: "PENDING" }
      - { name: reward_points, type: integer, source: computed, description: "Loyalty points granted to referrer when QUALIFIED->REWARDED", default: 0 }

  - name: WinbackOffer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the dormant high-risk customer targeted" }
      - { name: discount_pct, type: number, source: input, description: "Win-back discount fraction in [0.05, 0.50]" }
      - { name: expires_iso, type: datetime, source: input, description: "Offer expiry instant (ISO8601 UTC)" }
      - { name: status, type: enum, source: system, description: "OFFERED | REDEEMED | EXPIRED", default: "OFFERED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Order payment axis (parallel dimension 1) ---
  - entity: Order
    dimension: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /orders/{id}/pay"
        actor: Customer
        preconditions:
          - "Order.fulfillment_status != CANCELLED"
          - "payment outcome == SUCCEEDED (simulated)"
        side_effects:
          - "increments Order.version by 1"
      - from: UNPAID
        to: FAILED
        trigger: "POST /orders/{id}/pay"
        actor: Customer
        preconditions:
          - "payment outcome == DECLINED (simulated)"
        side_effects:
          - "Customer.lifetime_failed_payment_count += 1 (cross-entity)"
          - "recompute Customer.churn_risk_score and churn_band (cross-entity; see calc churn_risk_score)"
          - "increments Order.version by 1"
      - from: FAILED
        to: PAID
        trigger: "POST /orders/{id}/pay"
        actor: Customer
        preconditions:
          - "Order.fulfillment_status != CANCELLED"
          - "payment outcome == SUCCEEDED (simulated) — retry after decline"
        side_effects:
          - "increments Order.version by 1"
      - from: PAID
        to: REFUNDED
        trigger: "system: Order cancel (POST /orders/{id}/cancel) when payment_status==PAID"
        actor: system
        preconditions:
          - "Order.fulfillment_status in {DRAFT, RESERVED} (not yet SHIPPED)"
        side_effects:
          - "Customer.wallet_credit_cents += Order.total_cents (compensation; conserved quantity invariant)"
          - "increments Order.version by 1"

  # --- Order fulfillment axis (parallel dimension 2) ---
  - entity: Order
    dimension: fulfillment_status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: RESERVED
        trigger: "POST /orders/{id}/reserve"
        actor: Customer
        preconditions:
          - "Order has >=1 OrderLine"
          - "for each line: chosen Sku.status == ACTIVE"
          - "for each line: Sku.available_units >= line.quantity (FEFO lot selectable)"
        side_effects:
          - "for each OrderLine: set line.lot_id via FEFO selector (Lot.status==RELEASED, expiry_iso > clock, earliest expiry_iso; tie-break created_at ASC)"
          - "each OrderLine.line_status DRAFT-implied -> PENDING; Sku.reserved_units += line.quantity"
          - "compute Order subtotal/discount/handling/shipping/redeemed_points/total (calc order_total)"
          - "increments Order.version by 1"
      - from: RESERVED
        to: SHIPPED
        trigger: "POST /orders/{id}/ship"
        actor: InventoryManager
        preconditions:
          - "Order.payment_status == PAID"
          - "for each line: selected Lot.status == RELEASED and Lot.expiry_iso > clock"
          - "for each line: Lot.remaining_units >= line.quantity"
        side_effects:
          - "each OrderLine.line_status PENDING -> COMMITTED; Lot.remaining_units -= line.quantity (cascade hop 1)"
          - "Sku.reserved_units -= line.quantity; Sku.available_units recomputed (cascade hop 2)"
          - "when any drawn Lot.remaining_units reaches 0 -> Lot stays RELEASED but available_units drop; if Sku.available_units == 0 then any ACTIVE Subscription on that Sku auto-PAUSES (cascade hop 3; see Subscription machine)"
          - "credit Order.accrued_points to Customer.loyalty_points_balance (calc loyalty_points_accrual)"
          - "Customer.lifetime_order_count += 1; Customer.last_order_at = Order.created_at; recompute churn_risk_score/churn_band"
          - "if Customer.status==DORMANT -> Customer.status=WON_BACK"
          - "increments Order.version by 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /orders/{id}/deliver"
        actor: InventoryManager
        preconditions:
          - "Order.fulfillment_status == SHIPPED"
        side_effects:
          - "increments Order.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "Order.fulfillment_status in {DRAFT, RESERVED}"
        side_effects:
          - "increments Order.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "Order.fulfillment_status == RESERVED"
        side_effects:
          - "each OrderLine.line_status PENDING -> RELEASED; Sku.reserved_units -= line.quantity (free reservation; no lot decrement since none committed)"
          - "if Order.payment_status==PAID -> payment_status REFUNDED and Customer.wallet_credit_cents += Order.total_cents (compensation; conserved wallet+charge invariant)"
          - "if Order.accrued_points were not yet credited, none reversed; (points credit only happens on SHIPPED, so cancel-before-ship leaves loyalty balance unchanged — conserved loyalty invariant)"
          - "increments Order.version by 1"

  # --- Subscription cyclic machine (ACTIVE <-> PAUSED renewal loop) ---
  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/renew (cycle loop)"
        actor: system
        preconditions:
          - "clock >= Subscription.next_renewal_iso"
          - "selected Sku.status == ACTIVE and Sku.available_units >= 1"
        side_effects:
          - "if pending_swap_sku_id set: Subscription.sku_id = pending_swap_sku_id; pending_swap_sku_id = null (swap applied at renewal)"
          - "create a SUBSCRIPTION Order (1 line, qty 1) for this customer/sku; compute FINAL renewal charge (calc subscription_renewal_charge, FINAL variant)"
          - "Subscription.next_renewal_iso += cadence_days; consecutive_skip_count = 0"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/skip (cycle loop)"
        actor: Customer
        preconditions:
          - "Subscription.status == ACTIVE"
          - "consecutive_skip_count < 3 BEFORE this skip"
        side_effects:
          - "consecutive_skip_count += 1; Subscription.next_renewal_iso += cadence_days"
          - "Customer.lifetime_skip_count += 1; recompute Customer.churn_risk_score/churn_band (cross-entity)"
          - "if consecutive_skip_count reaches 3 -> Subscription.status = PAUSED (auto-pause)"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{id}/pause"
        actor: Customer
        preconditions:
          - "Subscription.status == ACTIVE"
        side_effects:
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "system: auto-pause when home Sku.available_units hits 0 on order ship (cascade hop 3)"
        actor: system
        preconditions:
          - "Subscription.status == ACTIVE and Subscription.sku_id == the depleted Sku.id"
        side_effects:
          - "increments Subscription.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/resume"
        actor: Customer
        preconditions:
          - "Subscription.status == PAUSED"
          - "selected Sku.status == ACTIVE and Sku.available_units >= 1"
        side_effects:
          - "consecutive_skip_count = 0; Subscription.next_renewal_iso = clock + cadence_days"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions: ["Subscription.status == ACTIVE"]
        side_effects: ["increments Subscription.version by 1"]
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions: ["Subscription.status == PAUSED"]
        side_effects: ["increments Subscription.version by 1"]

  # --- Sku label/compliance machine (branching with revert) ---
  - entity: Sku
    initial_state: DRAFT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /skus/{id}/activate"
        actor: InventoryManager
        preconditions:
          - "Sku.label_approved == true (ComplianceOfficer approved allergen label)"
          - "Sku has >=1 Lot in RELEASED status"
        side_effects: ["increments Sku.version by 1"]
      - from: DRAFT
        to: DRAFT
        trigger: "POST /skus/{id}/label/approve"
        actor: ComplianceOfficer
        preconditions: ["Sku.status == DRAFT"]
        side_effects:
          - "Sku.label_approved = true"
          - "increments Sku.version by 1"
      - from: ACTIVE
        to: LABEL_HOLD
        trigger: "POST /skus/{id}/label/hold"
        actor: ComplianceOfficer
        preconditions: ["Sku.status == ACTIVE"]
        side_effects:
          - "Sku.label_approved = false"
          - "every ACTIVE Subscription on this Sku auto-PAUSES (cascade)"
          - "increments Sku.version by 1"
      - from: LABEL_HOLD
        to: ACTIVE
        trigger: "POST /skus/{id}/label/approve"
        actor: ComplianceOfficer
        preconditions: ["Sku.status == LABEL_HOLD"]
        side_effects:
          - "Sku.label_approved = true"
          - "increments Sku.version by 1"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /skus/{id}/discontinue"
        actor: InventoryManager
        preconditions: ["Sku.status in {ACTIVE, LABEL_HOLD, DRAFT}"]
        side_effects: ["increments Sku.version by 1"]

  # --- Lot machine (branching: quarantine -> release | recall; expiry) ---
  - entity: Lot
    initial_state: QUARANTINE
    terminal_states: [EXPIRED, RECALLED]
    transitions:
      - from: QUARANTINE
        to: RELEASED
        trigger: "POST /lots/{id}/release"
        actor: InventoryManager
        preconditions:
          - "Lot.expiry_iso > current clock"
          - "parent Sku.label_approved == true"
        side_effects:
          - "Lot.remaining_units = Lot.produced_units"
          - "recompute parent Sku.available_units (cross-entity)"
          - "increments Lot.version by 1"
      - from: RELEASED
        to: RECALLED
        trigger: "POST /lots/{id}/recall"
        actor: ComplianceOfficer
        preconditions: ["Lot.status == RELEASED"]
        side_effects:
          - "Lot.remaining_units = 0"
          - "recompute parent Sku.available_units; if it reaches 0, ACTIVE Subscriptions on the Sku auto-PAUSE (cascade)"
          - "increments Lot.version by 1"
      - from: RELEASED
        to: EXPIRED
        trigger: "system: clock advances past Lot.expiry_iso, observed on next allocation/ship"
        actor: system
        preconditions: ["current clock >= Lot.expiry_iso"]
        side_effects:
          - "Lot excluded from FEFO selection and from Sku.available_units"
          - "increments Lot.version by 1"

  # --- Referral machine (linear with VOID branch) ---
  - entity: Referral
    initial_state: PENDING
    terminal_states: [REWARDED, VOID]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "system: referred Customer's first Order reaches SHIPPED"
        actor: system
        preconditions: ["referred Customer.lifetime_order_count transitions 0 -> 1"]
        side_effects: ["increments Referral.version by 1"]
      - from: QUALIFIED
        to: REWARDED
        trigger: "POST /referrals/{id}/reward"
        actor: PlatformAdmin
        preconditions: ["Referral.status == QUALIFIED"]
        side_effects:
          - "Referral.reward_points = REFERRAL_REWARD_POINTS (500)"
          - "referrer Customer.loyalty_points_balance += 500 (cross-entity)"
          - "increments Referral.version by 1"
      - from: PENDING
        to: VOID
        trigger: "POST /referrals/{id}/void"
        actor: PlatformAdmin
        preconditions: ["Referral.status == PENDING"]
        side_effects: ["increments Referral.version by 1"]

  # --- WinbackOffer machine ---
  - entity: WinbackOffer
    initial_state: OFFERED
    terminal_states: [REDEEMED, EXPIRED]
    transitions:
      - from: OFFERED
        to: REDEEMED
        trigger: "system: a CHURN_IMMINENT dormant customer's win-back order ships"
        actor: system
        preconditions: ["clock < WinbackOffer.expires_iso", "WinbackOffer.status == OFFERED"]
        side_effects: ["increments WinbackOffer.version by 1"]
      - from: OFFERED
        to: EXPIRED
        trigger: "system: clock advances past WinbackOffer.expires_iso"
        actor: system
        preconditions: ["clock >= WinbackOffer.expires_iso"]
        side_effects: ["increments WinbackOffer.version by 1"]

  # --- BulkQuote machine ---
  - entity: BulkQuote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /bulk-quotes/{id}/quote"
        actor: PlatformAdmin
        preconditions: ["referenced Sku.status == ACTIVE"]
        side_effects:
          - "compute line_subtotal/discount/handling/total (calc corporate_bulk_quote)"
          - "increments BulkQuote.version by 1"
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /bulk-quotes/{id}/accept"
        actor: CorporateBuyer
        preconditions: ["BulkQuote.status == QUOTED", "Sku.available_units >= BulkQuote.quantity"]
        side_effects: ["increments BulkQuote.version by 1"]
      - from: QUOTED
        to: EXPIRED
        trigger: "system: clock advances past quote validity window"
        actor: system
        preconditions: ["BulkQuote.status == QUOTED"]
        side_effects: ["increments BulkQuote.version by 1"]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules  (OCC on parent .version — true CREATE-with-supersede races only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: swap-stage-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/swap"
    occ_field: "expected_subscription_version"
    description: |
      Staging a flavor swap (writing pending_swap_sku_id) against a Subscription whose version has advanced
      since the client last observed it is rejected. A swap legitimately supersedes any previously-staged swap,
      so a stale view (e.g. another swap or a renewal already applied) must be detected via the version, not
      by inspecting the swap field alone.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: lot-release-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /lots/{id}/release"
    occ_field: "expected_lot_version"
    description: |
      Releasing a Lot whose version has advanced since the client last read it is rejected. Release legitimately
      recomputes Sku availability and may supersede an intervening recall/expiry mutation; the stale-version check
      guards against committing a release against an out-of-date lot view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: order_total
    trigger: "Order reserve (POST /orders/{id}/reserve); recomputed values frozen on the order"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED (mode-c circular-look guard: discount keyed on PRE-discount subtotal).
      subtotal_cents = sum over OrderLine of (line.unit_price_cents * line.quantity)
      disc_pct = volume_discount_pct(subtotal_cents)          # tier keyed on PRE-discount subtotal
      discount_cents = round_half_up(subtotal_cents * disc_pct)
      discounted_subtotal = subtotal_cents - discount_cents
      perishable_line_count = count of OrderLine whose Sku.storage_class == PERISHABLE
      handling_cents = PERISHABLE_HANDLING_CENTS * perishable_line_count
      ship_base = ZONE_BASE[Order.ship_zone]
      shipping_cents = round_half_up(ship_base * PERISHABLE_SHIP_MULT) if perishable_line_count > 0 else ship_base
      pre_redeem = discounted_subtotal + handling_cents + shipping_cents
      redeem_cap = floor(LOYALTY_MAX_REDEEM_PCT * discounted_subtotal)
      redeemed_points = min(Order.requested_redeem_points, redeem_cap, Customer.loyalty_points_balance)
      total_cents = pre_redeem - redeemed_points        # 1 point == 1 cent
    input_set: "OrderLines of this order (all lines, status PENDING after reserve); customer loyalty balance at reserve time"
    constants:
      PERISHABLE_HANDLING_CENTS: 450
      PERISHABLE_SHIP_MULT: 1.5
      LOYALTY_MAX_REDEEM_PCT: 0.30
      ZONE_BASE: { Z1: 500, Z2: 800, Z3: 1200, Z4: 1800 }
      VOLUME_TIERS: "subtotal>=20000 ->0.15; >=10000 ->0.10; >=5000 ->0.05; else 0.0"
    precision: "integer cents; round_half_up at each pinned rounding step"

  - name: loyalty_points_accrual
    trigger: "Order ship (RESERVED -> SHIPPED); accrued_points credited to Customer.loyalty_points_balance"
    algorithm: aggregation
    formula: |
      # Rounding ORDER is PINNED: round PER-LINE then SUM (NOT sum-then-round).
      # Perishable lines accrue 0 points (food-safety promo exclusion).
      accrued_points = sum over AMBIENT OrderLine of round_half_up(line.unit_price_cents * line.quantity * EARN_RATE_PER_CENT)
    input_set: "OrderLines whose Sku.storage_class == AMBIENT only"
    constants:
      EARN_RATE_PER_CENT: 0.015
    precision: "integer points; round_half_up per line BEFORE summation (order matters)"
    variants:
      - name: per_line_then_sum
        when: "the only sanctioned order"
        difference: "rounding each line then summing can differ from summing then rounding (e.g. two 350-cent lines: 5+5=10 vs round(10.5)=11). The scaffold pins per-line-then-sum == 10."

  - name: subscription_renewal_charge
    trigger: "PROVISIONAL: continuously as forward estimate on Subscription.provisional_charge_cents. FINAL: at renewal (ACTIVE->ACTIVE renew) on the generated Order."
    algorithm: forward_looking
    formula: |
      base = TIER_MONTHLY[tier]
      ship = ZONE_BASE[Customer.home_zone]
    input_set: "Subscription.tier, customer home zone, loyalty discount tier (FINAL only)"
    constants:
      TIER_MONTHLY: { STARTER: 2900, CLASSIC: 4900, RESERVE: 8900 }
      ZONE_BASE: { Z1: 500, Z2: 800, Z3: 1200, Z4: 1800 }
      LOYALTY_TIER_DISCOUNT: "RESERVE tier -> 0.10; CLASSIC -> 0.05; STARTER -> 0.0 (applied in FINAL only)"
    precision: "integer cents, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "forward estimate shown before the renewal actually fires (Subscription.provisional_charge_cents)"
        difference: "uses CURRENT tier price, NO loyalty discount: provisional_charge_cents = TIER_MONTHLY[current tier] + ZONE_BASE[home_zone]. Pending swap is NOT applied."
      - name: FINAL
        when: "computed when the renewal Order is generated"
        difference: "applies pending swap (if any) THEN loyalty tier discount: final = round_half_up(TIER_MONTHLY[effective tier] * (1 - LOYALTY_TIER_DISCOUNT[tier])) + ZONE_BASE[home_zone]. For CLASSIC, no swap: provisional=5700, final=round_half_up(4900*0.95)+800=5455 -> differs."

  - name: churn_risk_score
    trigger: "Recomputed on Customer order ship, subscription skip, and payment FAILED events"
    algorithm: weighted_scoring
    formula: |
      A = min(1.0, days_since_last_order / RECENCY_DIVISOR_DAYS)
      B = min(1.0, skip_count / SKIP_DIVISOR)
      C = min(1.0, failed_payment_count / FAIL_DIVISOR)
      raw = W_RECENCY*A + W_SKIP*B + W_FAIL*C
      churn_risk_score = min(100, round_half_up(raw))
      churn_band = CHURN_IMMINENT if score>=70 else AT_RISK if score>=50 else OK
    input_set: "ACUTE variant (default, drives the persisted field): counts within the trailing CHURN_WINDOW_DAYS. CHRONIC variant: lifetime counts."
    constants:
      W_RECENCY: 40
      W_SKIP: 35
      W_FAIL: 25
      RECENCY_DIVISOR_DAYS: 60
      SKIP_DIVISOR: 5
      FAIL_DIVISOR: 3
      CHURN_WINDOW_DAYS: 90
    precision: "integer 0..100, round_half_up"
    variants:
      - name: ACUTE
        when: "the persisted Customer.churn_risk_score / churn_band; default scoring"
        difference: "uses skip_count and failed_payment_count counted within trailing CHURN_WINDOW_DAYS only (lifetime_skip_count/lifetime_failed within window)."
      - name: CHRONIC
        when: "lifetime risk read via GET /customers/{id}/risk?variant=CHRONIC"
        difference: "uses LIFETIME skip_count and failed_payment_count (no window). Same recency term. Diverges from ACUTE when a customer had older skips/fails outside the 90-day window."

  - name: corporate_bulk_quote
    trigger: "BulkQuote quote (DRAFT -> QUOTED)"
    algorithm: tiered_pricing
    formula: |
      # Mode-c circular-look guard: handling % tier keyed on PRE-discount line_subtotal, applied to discounted subtotal.
      line_subtotal_cents = quantity * Sku.unit_price_cents
      (disc_pct, handling_pct) = BULK_TIER(line_subtotal_cents)   # keyed on PRE-discount subtotal
      discount_cents = round_half_up(line_subtotal_cents * disc_pct)
      discounted_subtotal = line_subtotal_cents - discount_cents
      handling_cents = round_half_up(discounted_subtotal * handling_pct)
      gift_wrap_cents = GIFT_WRAP_CENTS * gift_box_count
      total_cents = discounted_subtotal + handling_cents + gift_wrap_cents
    input_set: "single BulkQuote line"
    constants:
      GIFT_WRAP_CENTS: 350
      BULK_TIER: "line_subtotal>=100000 ->(0.20,0.03); >=50000 ->(0.12,0.04); >=20000 ->(0.07,0.05); else ->(0.0,0.06)"
    precision: "integer cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth, check: "X-User-Role and X-User-ID headers present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth, check: "role permitted for this operation per §1.7", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: auth, check: "entity_backed role acting on own resource (Customer owns subscription/order; CorporateBuyer owns own bulk quote)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "customer/subscription/order/bulk-quote write endpoints" }
  - { priority: 4,  category: existence, check: "path/body referenced resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all id-bearing" }
  - { priority: 5,  category: business_constraint, check: "required body fields present and well-typed (incl. gift_recipient_email when order_kind==GIFT)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all writes" }
  - { priority: 6,  category: business_constraint, check: "enum value within declared domain (category, zone, tier, cadence_days in {14,28,56})", error_id: ERR_INVALID_ENUM, http_status: 422, applies_to: "creates/updates" }
  - { priority: 7,  category: state, check: "OCC: expected_<parent>_version matches current parent.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /subscriptions/{id}/swap, POST /lots/{id}/release" }
  - { priority: 8,  category: state, check: "target entity in a legal from-state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 9,  category: business_safety, check: "Sku label_approved == true before activate / lot release (allergen/FDA labeling gate)", error_id: ERR_LABEL_NOT_APPROVED, http_status: 409, applies_to: "POST /skus/{id}/activate, POST /lots/{id}/release" }
  - { priority: 10, category: business_safety, check: "ordered SKU's allergens are a subset of the customer's declared accepted allergens is NOT required, BUT a GIFT order to a recipient with a recorded allergen conflict is blocked", error_id: ERR_ALLERGEN_CONFLICT, http_status: 409, applies_to: "POST /orders/{id}/reserve (GIFT orders)" }
  - { priority: 11, category: business_referential, check: "lot release/expiry: lot not past expiry_iso at the operative clock", error_id: ERR_LOT_EXPIRED, http_status: 409, applies_to: "POST /lots/{id}/release, POST /orders/{id}/ship" }
  - { priority: 12, category: business_temporal, check: "renewal only when clock >= next_renewal_iso; win-back redemption only while clock < expires_iso", error_id: ERR_NOT_DUE, http_status: 409, applies_to: "POST /subscriptions/{id}/renew, POST /winback-offers/{id}/redeem" }
  - { priority: 13, category: business_constraint, check: "win-back offer only for status==DORMANT AND churn_band==CHURN_IMMINENT customers", error_id: ERR_NOT_WINBACK_ELIGIBLE, http_status: 409, applies_to: "POST /winback-offers" }
  - { priority: 14, category: business_constraint, check: "referral referrer != referred; referred must be a distinct existing customer", error_id: ERR_SELF_REFERRAL, http_status: 422, applies_to: "POST /referrals" }
  - { priority: 15, category: business_fiscal, check: "requested_redeem_points <= customer loyalty_points_balance (overflow rejected before capping)", error_id: ERR_INSUFFICIENT_POINTS, http_status: 422, applies_to: "POST /orders/{id}/reserve" }
  - { priority: 16, category: business_fiscal, check: "reserve requires Sku.available_units >= line.quantity for every line (inventory capacity)", error_id: ERR_INSUFFICIENT_INVENTORY, http_status: 409, applies_to: "POST /orders/{id}/reserve" }
  - { priority: 17, category: business_fiscal, check: "ship requires drawn Lot.remaining_units >= line.quantity", error_id: ERR_LOT_UNDERSTOCK, http_status: 409, applies_to: "POST /orders/{id}/ship" }
  - { priority: 18, category: business_constraint, check: "duplicate email on customer create rejected", error_id: ERR_DUPLICATE_EMAIL, http_status: 409, applies_to: "POST /customers" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Customers ---
  - { method: POST, path: "/customers", description: "Register a customer", roles: [PlatformAdmin, CorporateBuyer], code: 201, input: [email, full_name, home_zone, "referrer_id?"], output: Customer, side_effects: ["if referrer_id set, create Referral PENDING"] }
  - { method: GET,  path: "/customers", description: "List customers (paginated; filter by status)", roles: [PlatformAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "Customer[]" }
  - { method: GET,  path: "/customers/{id}", description: "Get a customer", roles: [PlatformAdmin, Customer, CorporateBuyer], code: 200, input: [], output: Customer }
  - { method: GET,  path: "/customers/{id}/risk", description: "Compute churn risk (ACUTE default or CHRONIC variant)", roles: [PlatformAdmin, Customer], code: 200, input: ["variant?"], output: Customer }
  - { method: POST, path: "/customers/{id}/dormancy/mark", description: "Operator marks a customer DORMANT (no order within dormancy window)", roles: [PlatformAdmin], code: 200, input: [], output: Customer, side_effects: ["Customer.status ACTIVE->DORMANT; recompute churn band"] }
  - { method: GET,  path: "/customers/{id}/orders", description: "List a customer's orders (reverse-reachability for Order.customer_id)", roles: [PlatformAdmin, Customer], code: 200, input: [], output: "Order[]" }
  - { method: GET,  path: "/customers/{id}/subscriptions", description: "List a customer's subscriptions (reverse-reachability for Subscription.customer_id)", roles: [PlatformAdmin, Customer], code: 200, input: [], output: "Subscription[]" }

  # --- SKUs ---
  - { method: POST, path: "/skus", description: "Create a SKU (DRAFT)", roles: [InventoryManager, PlatformAdmin], code: 201, input: [name, category, storage_class, unit_price_cents, "allergens?"], output: Sku }
  - { method: GET,  path: "/skus", description: "List SKUs (filter by status/category)", roles: [PlatformAdmin, InventoryManager, Customer, CorporateBuyer], code: 200, input: ["status?", "category?", "limit?", "offset?"], output: "Sku[]" }
  - { method: GET,  path: "/skus/{id}", description: "Get a SKU", roles: [PlatformAdmin, InventoryManager, Customer, CorporateBuyer], code: 200, input: [], output: Sku }
  - { method: POST, path: "/skus/{id}/label/approve", description: "Approve allergen label (DRAFT or LABEL_HOLD)", roles: [ComplianceOfficer], code: 200, input: [], output: Sku, side_effects: ["label_approved=true; LABEL_HOLD->ACTIVE"] }
  - { method: POST, path: "/skus/{id}/label/hold", description: "Place allergen/FDA label hold (ACTIVE->LABEL_HOLD)", roles: [ComplianceOfficer], code: 200, input: [], output: Sku, side_effects: ["label_approved=false; auto-pause ACTIVE subscriptions on this SKU"] }
  - { method: POST, path: "/skus/{id}/activate", description: "Activate a SKU (DRAFT->ACTIVE)", roles: [InventoryManager], code: 200, input: [], output: Sku }
  - { method: POST, path: "/skus/{id}/discontinue", description: "Discontinue a SKU", roles: [InventoryManager], code: 200, input: [], output: Sku }
  - { method: GET,  path: "/skus/{id}/lots", description: "List lots for a SKU (reverse-reachability for Lot.sku_id)", roles: [PlatformAdmin, InventoryManager], code: 200, input: [], output: "Lot[]" }

  # --- Lots ---
  - { method: POST, path: "/lots", description: "Create a batch/lot (QUARANTINE)", roles: [InventoryManager], code: 201, input: [sku_id, lot_code, produced_units, expiry_iso], output: Lot }
  - { method: GET,  path: "/lots/{id}", description: "Get a lot", roles: [PlatformAdmin, InventoryManager], code: 200, input: [], output: Lot }
  - { method: POST, path: "/lots/{id}/release", description: "Release a lot to sellable inventory (OCC)", roles: [InventoryManager], code: 200, input: [expected_lot_version], output: Lot, side_effects: ["remaining_units=produced_units; recompute Sku.available_units; increments Lot.version by 1"] }
  - { method: POST, path: "/lots/{id}/recall", description: "Recall a released lot (FDA/safety)", roles: [ComplianceOfficer], code: 200, input: [], output: Lot, side_effects: ["remaining_units=0; recompute Sku.available_units; cascade auto-pause subscriptions"] }

  # --- Subscriptions ---
  - { method: POST, path: "/subscriptions", description: "Create a subscription (ACTIVE)", roles: [Customer, PlatformAdmin], code: 201, input: [customer_id, sku_id, tier, cadence_days], output: Subscription, side_effects: ["set next_renewal_iso=clock+cadence_days; compute provisional_charge_cents"] }
  - { method: GET,  path: "/subscriptions", description: "List subscriptions (reverse-reachability for Subscription.customer_id, .sku_id, .pending_swap_sku_id)", roles: [PlatformAdmin, Customer], code: 200, input: ["customer_id?", "sku_id?", "pending_swap_sku_id?", "limit?", "offset?"], output: "Subscription[]" }
  - { method: GET,  path: "/subscriptions/{id}", description: "Get a subscription", roles: [PlatformAdmin, Customer], code: 200, input: [], output: Subscription }
  - { method: POST, path: "/subscriptions/{id}/swap", description: "Stage a flavor swap for next renewal (OCC)", roles: [Customer], code: 200, input: [pending_swap_sku_id, expected_subscription_version], output: Subscription, side_effects: ["set pending_swap_sku_id; increments Subscription.version by 1"] }
  - { method: POST, path: "/subscriptions/{id}/skip", description: "Skip the next cycle", roles: [Customer], code: 200, input: [], output: Subscription, side_effects: ["consecutive_skip_count+=1; advance next_renewal_iso; lifetime_skip_count+=1; recompute churn; auto-pause at 3"] }
  - { method: POST, path: "/subscriptions/{id}/pause", description: "Pause a subscription", roles: [Customer], code: 200, input: [], output: Subscription }
  - { method: POST, path: "/subscriptions/{id}/resume", description: "Resume a paused subscription", roles: [Customer], code: 200, input: [], output: Subscription, side_effects: ["consecutive_skip_count=0; next_renewal_iso=clock+cadence_days"] }
  - { method: POST, path: "/subscriptions/{id}/renew", description: "Fire a due renewal (creates a SUBSCRIPTION order, applies pending swap, FINAL charge)", roles: [PlatformAdmin, Customer], code: 200, input: [], output: Subscription, side_effects: ["apply swap; create Order; advance next_renewal_iso; reset skip count"] }
  - { method: POST, path: "/subscriptions/{id}/cancel", description: "Cancel a subscription", roles: [Customer], code: 200, input: [], output: Subscription }

  # --- Orders ---
  - { method: POST, path: "/orders", description: "Create an order draft", roles: [Customer, PlatformAdmin, CorporateBuyer], code: 201, input: [customer_id, order_kind, ship_zone, "subscription_id?", "gift_recipient_email?", "gift_box_count?", "requested_redeem_points?"], output: Order }
  - { method: POST, path: "/orders/{id}/lines", description: "Add a line to a DRAFT order", roles: [Customer, PlatformAdmin], code: 201, input: [sku_id, quantity], output: OrderLine }
  - { method: GET,  path: "/orders", description: "List orders (reverse-reachability for Order.customer_id and .subscription_id)", roles: [PlatformAdmin, Customer], code: 200, input: ["customer_id?", "subscription_id?", "limit?", "offset?"], output: "Order[]" }
  - { method: GET,  path: "/orders/{id}", description: "Get an order", roles: [PlatformAdmin, Customer], code: 200, input: [], output: Order }
  - { method: GET,  path: "/orders/{id}/lines", description: "List an order's lines (reverse-reachability for OrderLine.order_id)", roles: [PlatformAdmin, Customer], code: 200, input: [], output: "OrderLine[]" }
  - { method: GET,  path: "/order-lines/{id}", description: "Get an order line", roles: [PlatformAdmin, Customer], code: 200, input: [], output: OrderLine }
  - { method: GET,  path: "/order-lines", description: "List order lines (reverse-reachability for OrderLine.sku_id and .lot_id)", roles: [PlatformAdmin, Customer], code: 200, input: ["order_id?", "sku_id?", "lot_id?", "limit?", "offset?"], output: "OrderLine[]" }
  - { method: POST, path: "/orders/{id}/reserve", description: "Reserve inventory (FEFO lot select) and freeze totals (DRAFT->RESERVED)", roles: [Customer, PlatformAdmin], code: 200, input: [], output: Order, side_effects: ["FEFO lot_id per line; Sku.reserved_units+=qty; calc order_total"] }
  - { method: POST, path: "/orders/{id}/pay", description: "Attempt payment (UNPAID/FAILED -> PAID|FAILED)", roles: [Customer, PlatformAdmin], code: 200, input: [outcome], output: Order, side_effects: ["on DECLINED: lifetime_failed_payment_count+=1; recompute churn"] }
  - { method: POST, path: "/orders/{id}/ship", description: "Ship a paid reserved order (RESERVED->SHIPPED)", roles: [InventoryManager], code: 200, input: [], output: Order, side_effects: ["commit lots; cascade availability; credit loyalty; advance customer counters; cascade subscription auto-pause"] }
  - { method: POST, path: "/orders/{id}/deliver", description: "Mark shipped order delivered", roles: [InventoryManager], code: 200, input: [], output: Order }
  - { method: POST, path: "/orders/{id}/cancel", description: "Cancel a DRAFT/RESERVED order (compensation if paid)", roles: [Customer, PlatformAdmin], code: 200, input: [], output: Order, side_effects: ["release reservation; refund-to-wallet if PAID"] }

  # --- Bulk quotes ---
  - { method: POST, path: "/bulk-quotes", description: "Create a corporate bulk quote draft", roles: [CorporateBuyer, PlatformAdmin], code: 201, input: [corporate_buyer_id, sku_id, quantity, "gift_box_count?"], output: BulkQuote }
  - { method: GET,  path: "/bulk-quotes/{id}", description: "Get a bulk quote", roles: [PlatformAdmin, CorporateBuyer], code: 200, input: [], output: BulkQuote }
  - { method: GET,  path: "/bulk-quotes", description: "List bulk quotes (reverse-reachability for BulkQuote.corporate_buyer_id and .sku_id)", roles: [PlatformAdmin, CorporateBuyer], code: 200, input: ["corporate_buyer_id?", "sku_id?", "limit?", "offset?"], output: "BulkQuote[]" }
  - { method: POST, path: "/bulk-quotes/{id}/quote", description: "Compute and lock a quote (DRAFT->QUOTED)", roles: [PlatformAdmin], code: 200, input: [], output: BulkQuote, side_effects: ["calc corporate_bulk_quote"] }
  - { method: POST, path: "/bulk-quotes/{id}/accept", description: "Accept a quote (QUOTED->ACCEPTED)", roles: [CorporateBuyer], code: 200, input: [], output: BulkQuote }

  # --- Referrals & win-back ---
  - { method: POST, path: "/referrals", description: "Create a referral linking referrer to referred (PENDING). Usually created implicitly via referrer_id on customer registration; this explicit form supports admin entry and self-referral validation.", roles: [PlatformAdmin], code: 201, input: [referrer_id, referred_id], output: Referral }
  - { method: GET,  path: "/referrals", description: "List referrals (reverse-reachability for Referral.referrer_id and .referred_id)", roles: [PlatformAdmin], code: 200, input: ["referrer_id?", "referred_id?", "limit?", "offset?"], output: "Referral[]" }
  - { method: GET,  path: "/referrals/{id}", description: "Get a referral", roles: [PlatformAdmin], code: 200, input: [], output: Referral }
  - { method: POST, path: "/referrals/{id}/reward", description: "Reward a qualified referral (QUALIFIED->REWARDED)", roles: [PlatformAdmin], code: 200, input: [], output: Referral, side_effects: ["referrer loyalty_points_balance += 500"] }
  - { method: POST, path: "/referrals/{id}/void", description: "Void a pending referral", roles: [PlatformAdmin], code: 200, input: [], output: Referral }
  - { method: POST, path: "/winback-offers", description: "Create a win-back offer for a dormant high-risk customer", roles: [PlatformAdmin], code: 201, input: [customer_id, discount_pct, expires_iso], output: WinbackOffer }
  - { method: GET,  path: "/winback-offers/{id}", description: "Get a win-back offer", roles: [PlatformAdmin, Customer], code: 200, input: [], output: WinbackOffer }
  - { method: GET,  path: "/winback-offers", description: "List win-back offers (reverse-reachability for WinbackOffer.customer_id)", roles: [PlatformAdmin], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "WinbackOffer[]" }
  - { method: POST, path: "/winback-offers/{id}/redeem", description: "Redeem a win-back offer (OFFERED->REDEEMED) while not expired", roles: [Customer, PlatformAdmin], code: 200, input: [], output: WinbackOffer }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Server startup default time is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }" }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity-backed user acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required body field or malformed payload" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "enum/value out of declared domain (zone, tier, cadence, category)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "entity not in a legal from-state for the transition" }
  - { id: ERR_LABEL_NOT_APPROVED, http: 409, condition: "SKU label not approved before activate / lot release" }
  - { id: ERR_ALLERGEN_CONFLICT, http: 409, condition: "GIFT order to a recipient with a recorded allergen conflict" }
  - { id: ERR_LOT_EXPIRED, http: 409, condition: "lot at/after expiry_iso at the operative clock" }
  - { id: ERR_NOT_DUE, http: 409, condition: "renewal before next_renewal_iso, or win-back redemption after expires_iso" }
  - { id: ERR_NOT_WINBACK_ELIGIBLE, http: 409, condition: "win-back offer for a customer not DORMANT+CHURN_IMMINENT" }
  - { id: ERR_SELF_REFERRAL, http: 422, condition: "referrer_id == referred_id" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "requested_redeem_points exceeds customer loyalty balance" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Sku.available_units < line.quantity on reserve" }
  - { id: ERR_LOT_UNDERSTOCK, http: 409, condition: "selected Lot.remaining_units < line.quantity on ship" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "customer email already registered" }
  - { id: ERR_VALIDATION, http: 422, condition: "generic semantic validation failure (e.g. discount_pct out of [0.05,0.50], produced_units < 1)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End consumer; owns own orders, subscriptions, redemptions"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /subscriptions/{id}/swap|skip|pause|resume|cancel"
      - "POST /orders/{id}/reserve|cancel (own)"
    shared_operations:
      - "POST /orders, POST /orders/{id}/lines, POST /orders/{id}/pay"
      - "POST /subscriptions, POST /subscriptions/{id}/renew"
      - "GET own customer/orders/subscriptions/risk; POST /winback-offers/{id}/redeem"
  - name: InventoryManager
    description: "Owns SKU lifecycle and batch/lot inventory and shipping"
    identity: "opaque"
    exclusive_operations:
      - "POST /skus, POST /skus/{id}/activate|discontinue"
      - "POST /lots, POST /lots/{id}/release"
      - "POST /orders/{id}/ship|deliver"
    shared_operations: ["GET /skus, GET /skus/{id}/lots, GET /lots/{id}"]
  - name: ComplianceOfficer
    description: "Owns allergen/FDA labeling holds and lot recalls"
    identity: "opaque"
    exclusive_operations:
      - "POST /skus/{id}/label/approve|hold"
      - "POST /lots/{id}/recall"
    shared_operations: ["GET /skus, GET /skus/{id}"]
  - name: CorporateBuyer
    description: "Files and accepts corporate-bulk quotes"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /bulk-quotes/{id}/accept"
    shared_operations: ["POST /customers, POST /bulk-quotes, GET /bulk-quotes, GET /skus"]
  - name: PlatformAdmin
    description: "Operational superset: clock, dormancy marking, referrals, win-back, renewals"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /customers/{id}/dormancy/mark"
      - "POST /referrals/{id}/reward|void"
      - "POST /winback-offers, POST /bulk-quotes/{id}/quote"
    shared_operations: ["broad read access; POST /customers; POST /orders; POST /subscriptions/{id}/renew"]
