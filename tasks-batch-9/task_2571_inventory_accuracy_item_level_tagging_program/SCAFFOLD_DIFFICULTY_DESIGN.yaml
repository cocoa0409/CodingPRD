            - "response error.code == \"ERR_INVESTIGATION_NOT_CLOSED\""
            - "Adjustment.${adj1}.posting_state is still \"UNPOSTED\" and posted_at is still null"
            - "StockPosition.${pos_tee1}.on_hand_units is still 100 and book_value_cents is still 123400"
            - "after POST /inventory-integrity/variance-investigations/${inv_a}/close moves the OTHER entity to CLOSED, the identical post request returns 200 with posting_state \"POSTED\" and StockPosition.${pos_tee1}.on_hand_units == 95"

      - name: physical_certify_requires_shrink_period_not_open
        grounds:
          - state_machines.PhysicalInventory.RECONCILING_to_CERTIFIED
          - validations.priority_54_ERR_SHRINK_PERIOD_STILL_OPEN
          - entities.ShrinkPeriod.fields.status
          - errors.ERR_SHRINK_PERIOD_STILL_OPEN
        distinguishing_aspect: |
          Entity pair: PhysicalInventory depends on ShrinkPeriod — a different pair from the
          Adjustment / VarianceInvestigation instance, and the polarity is inverted: here the guard
          demands that the other entity has LEFT its initial state, whereas the reconcile step one
          transition earlier demanded that the very same period still BE in OPEN. So the two steps
          make mutually exclusive demands on one foreign entity, and only sequencing the period's
          provisional close between them satisfies both.
        test_recipe:
          setup:
            - "Category APPAREL; Store S100; Vendor VEND1; Item TEE-001 at 1234 cents; a stock position at S100 with opening on-hand 100 units."
            - "CounterFirm CF1 at certification_level TIER_1 with max_lines_per_pass 500."
            - "An OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30 with sales_at_cost_cents 5000000, which contains the physical inventory's scheduled_end_date."
            - "A PhysicalInventory for (S100, CF1) scheduled 2026-09-10..2026-09-12 with recount_threshold_bps 150."
            - "It is started, given a single line counting 100 units against a 100-unit book snapshot so net_variance_cents is 0 and net_variance_bps is 0, and its first pass is completed."
            - "It is then reconciled while the period is still OPEN — reconcile REQUIRES the covering period to be OPEN — leaving status RECONCILING with no adjustments minted because no line had a non-zero variance."
            - "The period is deliberately left OPEN at the moment of the trigger."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/counter-firms"
              payload: { code: "CF1", name: "Counting Firm One", certification_level: "TIER_1", max_lines_per_pass: 500 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { firm1: "$.data.id" }
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-07-01", period_end: "2026-09-30", sales_at_cost_cents: 5000000 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { sp1: "$.data.id" }
            - call: "POST /inventory-integrity/physical-inventories"
              payload: { store_id: "${store_s100}", counter_firm_id: "${firm1}", scheduled_start_date: "2026-09-10", scheduled_end_date: "2026-09-12", recount_threshold_bps: 150 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { pi1: "$.data.id" }
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/start"
              payload: {}
              as: ThirdPartyCounter
              as_user_id: "${firm1}"
              captures: { pi_v1: "$.data.version" }
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/lines"
              payload: { item_id: "${item_tee1}", counted_units: 100, expected_physical_inventory_version: "${pi_v1}" }
              as: ThirdPartyCounter
              as_user_id: "${firm1}"
              captures: { pil1: "$.data.id" }
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/complete-pass"
              payload: {}
              as: ThirdPartyCounter
              as_user_id: "${firm1}"
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/reconcile"
              payload: {}
              as: ShrinkController
              as_user_id: "u_ctrl_1"
          trigger:
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/certify"
              payload: {}
              as: ShrinkController
              as_user_id: "u_ctrl_1"
          assert:
            - "after complete-pass, PhysicalInventory.${pi1}.book_value_cents == 123400, counted_value_cents == 123400, net_variance_cents == 0 and net_variance_bps == 0, so ERR_RECOUNT_REQUIRED cannot fire at reconcile"
            - "after reconcile, PhysicalInventory.${pi1}.status == \"RECONCILING\" and GET /inventory-integrity/adjustments?stock_position_id=${pos_tee1} returns total_count 0 — a zero-variance line mints nothing"
            - "response status 409"
            - "response error.code == \"ERR_SHRINK_PERIOD_STILL_OPEN\""
            - "PhysicalInventory.${pi1}.status is still \"RECONCILING\" and certified_at is still null"
            - "after POST /inventory-integrity/shrink-periods/${sp1}/provisional-close moves the OTHER entity to PROVISIONAL_CLOSED, the identical certify request returns 200 with data.status \"CERTIFIED\" and data.certified_at \"2026-08-01T00:00:00Z\""
            - "the pair of guards is mutually exclusive across two consecutive transitions: reconcile demanded ShrinkPeriod.status == OPEN and certify demands it != OPEN"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: count_window_half_open_adjacency_accepted_overlap_rejected
        grounds:
          - calculations.count_task_window_overlap
          - validations.priority_72_ERR_COUNT_WINDOW_OVERLAP
          - entities.CountTask.fields.window_start
          - errors.ERR_COUNT_WINDOW_OVERLAP
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [window_start, window_end) with no buffer and PAIRWISE
          exclusivity. Resource entity: the merchandise area identified by (Store, Category), held by
          a CountTask window. Adjacency is therefore legal — a new window whose start equals an
          existing window's end does NOT collide — which is exactly the opposite of the closed-interval
          instance. Different resource and different semantics from both the PhysicalInventory blackout
          instance (closed, padded, per Store) and the overhead reader-pool instance (k-capacity
          aggregate).
        test_recipe:
          setup:
            - "Category APPAREL with reader_mode_required EITHER; Store S100 with reader_capability BOTH and overhead_reader_capacity 2."
            - "An ACTIVE CountSchedule for (S100, APPAREL) with reader_mode HANDHELD, first_due_date 2026-08-01 and cadence_days 30, so every window below satisfies the priority-90 due check."
            - "One existing SCHEDULED CountTask on that schedule holding the window 2026-08-05T00:00:00Z..2026-08-07T00:00:00Z."
            - "No OVERHEAD task exists anywhere, so the reader-pool check cannot interfere."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-07T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { task_existing: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-08-06T00:00:00Z", window_end: "2026-08-08T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "response status 409"
            - "response error.code == \"ERR_COUNT_WINDOW_OVERLAP\""
            - "GET /inventory-integrity/count-tasks?count_schedule_id=${sched1} still returns total_count 1"
            - "ADJACENCY — the same request with window_start 2026-08-07T00:00:00Z and window_end 2026-08-09T00:00:00Z returns 201, because new.window_start == existing.window_end does not satisfy new.start < existing.end under half-open semantics"
            - "ADJACENCY, other side — a window 2026-08-03T00:00:00Z..2026-08-05T00:00:00Z ending exactly where the existing one starts also returns 201"
            - "RELEASE — voiding ${task_existing} moves it to VOIDED, which is outside the {SCHEDULED, IN_PROGRESS, COUNTED} input set, so the original 2026-08-06..2026-08-08 request then returns 201"

      - name: physical_inventory_closed_interval_blackout_buffer
        grounds:
          - calculations.physical_inventory_blackout_interval
          - validations.priority_74_ERR_PHYSICAL_INVENTORY_BLACKOUT_CONFLICT
          - global_constants.PHYSICAL_BLACKOUT_BUFFER_DAYS
          - errors.ERR_PHYSICAL_INVENTORY_BLACKOUT_CONFLICT
        distinguishing_aspect: |
          Interval semantics: CLOSED [start, end] on calendar DATES, symmetrically padded by
          PHYSICAL_BLACKOUT_BUFFER_DAYS, so touching endpoints DO collide — the exact inverse of the
          half-open count-window rule. Resource entity: the whole Store's counting capacity held by a
          PhysicalInventory, not a (store, category) merchandise area. The 2026-09-10..2026-09-12
          booking therefore blocks 2026-09-07..2026-09-15 inclusive, and 2026-09-15 is a collision
          while 2026-09-16 is free.
        test_recipe:
          setup:
            - "Store S100; CounterFirm CF1 at TIER_1 with max_lines_per_pass 500 and CounterFirm CF2 at TIER_2 with max_lines_per_pass 200 (a different firm cannot rescue an overlapping date range — the resource is the store)."
            - "One PLANNED PhysicalInventory for (S100, CF1) scheduled 2026-09-10..2026-09-12, whose padded blackout is 2026-09-07..2026-09-15 inclusive."
            - "No shrink period is required, because the blackout check runs at creation."
          setup_api_calls:
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/counter-firms"
              payload: { code: "CF1", name: "Counting Firm One", certification_level: "TIER_1", max_lines_per_pass: 500 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { firm1: "$.data.id" }
            - call: "POST /inventory-integrity/counter-firms"
              payload: { code: "CF2", name: "Counting Firm Two", certification_level: "TIER_2", max_lines_per_pass: 200 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { firm2: "$.data.id" }
            - call: "POST /inventory-integrity/physical-inventories"
              payload: { store_id: "${store_s100}", counter_firm_id: "${firm1}", scheduled_start_date: "2026-09-10", scheduled_end_date: "2026-09-12", recount_threshold_bps: 150 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { pi_existing: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/physical-inventories"
              payload: { store_id: "${store_s100}", counter_firm_id: "${firm2}", scheduled_start_date: "2026-09-15", scheduled_end_date: "2026-09-16", recount_threshold_bps: 150 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
          assert:
            - "response status 409"
            - "response error.code == \"ERR_PHYSICAL_INVENTORY_BLACKOUT_CONFLICT\" — 2026-09-15 <= the padded high bound 2026-09-15, and closed intervals collide on touching endpoints"
            - "GET /inventory-integrity/physical-inventories?store_id=${store_s100} still returns total_count 1"
            - "BOUNDARY+1 — the same request shifted to 2026-09-16..2026-09-17 returns 201, because 2026-09-16 > 2026-09-15"
            - "BOUNDARY, other side — a request for 2026-09-05..2026-09-06 returns 201 while 2026-09-06..2026-09-07 collides, since the padded low bound is 2026-09-07"
            - "RELEASE — POST /inventory-integrity/physical-inventories/${pi_existing}/abandon moves it to ABANDONED, which leaves the input set, so the original 2026-09-15..2026-09-16 request then returns 201"
            - "the counting firm is irrelevant: CF2 could not book the range even though CF1 holds it, because the resource is the Store"

      - name: overhead_reader_pool_aggregate_capacity_exceeded
        grounds:
          - calculations.count_task_window_overlap
          - validations.priority_73_ERR_OVERHEAD_READER_CAPACITY_EXCEEDED
          - entities.Store.fields.overhead_reader_capacity
          - errors.ERR_OVERHEAD_READER_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Interval semantics: half-open windows again, but the geometry is AGGREGATE k-CAPACITY
          occupancy rather than pairwise exclusivity — each individual pair of windows is perfectly
          legal because the categories differ, and only the collective count of 2 concurrent OVERHEAD
          windows against a capacity of 2 rejects the third. Resource entity: the Store's overhead
          reader hardware pool, which is neither the (store, category) merchandise area of the
          adjacency instance nor the store-wide date blackout of the physical-inventory instance.
        test_recipe:
          setup:
            - "Store S100 with reader_capability BOTH and overhead_reader_capacity 2."
            - "Three categories that all permit OVERHEAD: APPAREL, HOME and TOYS, each with reader_mode_required EITHER."
            - "Three ACTIVE CountSchedules at S100, one per category, all with reader_mode OVERHEAD, first_due_date 2026-08-01 and cadence_days 30."
            - "Two existing SCHEDULED OVERHEAD count tasks with mutually overlapping windows: APPAREL 2026-08-05T00:00:00Z..2026-08-08T00:00:00Z and HOME 2026-08-06T00:00:00Z..2026-08-09T00:00:00Z."
            - "Each existing pair is individually legal because CHECK A only compares tasks sharing a category, so nothing has been rejected yet."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/categories"
              payload: { code: "HOME", name: "Home", count_cadence_days: 30, variance_tolerance_units: 5, variance_tolerance_value_cents: 6000, min_accuracy_pct: 95.00, landed_cost_uplift_bps: 0, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_home: "$.data.id" }
            - call: "POST /inventory-integrity/categories"
              payload: { code: "TOYS", name: "Toys", count_cadence_days: 30, variance_tolerance_units: 3, variance_tolerance_value_cents: 9000, min_accuracy_pct: 96.00, landed_cost_uplift_bps: 500, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_toys: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "OVERHEAD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched_a: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_home}", reader_mode: "OVERHEAD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched_h: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_toys}", reader_mode: "OVERHEAD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched_t: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched_a}", reader_mode: "OVERHEAD", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-08T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { task_a: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched_h}", reader_mode: "OVERHEAD", window_start: "2026-08-06T00:00:00Z", window_end: "2026-08-09T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { task_h: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched_t}", reader_mode: "OVERHEAD", window_start: "2026-08-07T00:00:00Z", window_end: "2026-08-10T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "response status 409"
            - "response error.code == \"ERR_OVERHEAD_READER_CAPACITY_EXCEEDED\""
            - "response error.code != \"ERR_COUNT_WINDOW_OVERLAP\" — CHECK A finds no same-category sibling, so only the aggregate CHECK B can fire"
            - "GET /inventory-integrity/count-tasks?store_id=${store_s100} still returns total_count 2"
            - "CAPACITY-1 — the identical request with reader_mode HANDHELD returns 201, because the aggregate check only counts OVERHEAD tasks"
            - "NON-OVERLAP — the identical OVERHEAD request shifted to 2026-08-09T00:00:00Z..2026-08-11T00:00:00Z returns 201: it is adjacent to ${task_h} and disjoint from ${task_a}, so the concurrent occupancy is 0"
            - "RELEASE — voiding ${task_a} drops the overlapping OVERHEAD count to 1 < 2, so the original 2026-08-07..2026-08-10 request then returns 201"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: adjustment_reverse_conserves_on_hand_units
        grounds:
          - state_machines.Adjustment.POSTED_to_REVERSED
          - entities.StockPosition.fields.on_hand_units
          - entities.StockPosition.fields.baseline_on_hand_units
          - calculations.position_promising_state
          - calculations.store_fulfillment_posture
        distinguishing_aspect: |
          Conserved quantity: UNITS OF INVENTORY, pinned by the identity
          on_hand_units == baseline_on_hand_units + sum(delta_units over POSTED adjustments). Reversing
          the only posted adjustment removes it from the POSTED set, so the sum returns to 0 and
          on_hand_units returns to the baseline 5 with zero drift, dragging book_value_cents,
          promising_state and Store.fulfillment_status back with it. The instance also pins the
          deliberate NON-conservation: the CountSchedule cadence halved by the suspension cascade is
          not restored, so unit conservation and schedule state are independent. The other two
          instances conserve a shrink-attribution total and a vendor money balance instead.
        test_recipe:
          setup:
            - "Category APPAREL; Store S100; Vendor VEND1; Item TEE-001 at 1234 cents."
            - "Exactly ONE stock position at S100 — TEE-001 with baseline_on_hand_units 5 — so one blocked position is the whole store."
            - "One ACTIVE CountSchedule for (S100, APPAREL) with cadence_days 30 and first_due_date 2026-09-01."
            - "An adjustment of -10 units requested by u_analyst_1 (value_impact 12340 < threshold 20000, so NOT_REQUIRED) is posted, driving on_hand_units to -5, promising_state to BLOCKED, the store to SUSPENDED and the schedule cadence to 15 days with next_due_date 2026-08-01."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 5, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-09-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
            - call: "GET /inventory-integrity/stock-positions/${pos_tee1}"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { pos_v: "$.data.version" }
            - call: "POST /inventory-integrity/stock-positions/${pos_tee1}/adjustments"
              payload: { delta_units: -10, reason_code: "COUNT_VARIANCE", expected_stock_position_version: "${pos_v}" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { adj1: "$.data.id" }
            - call: "POST /inventory-integrity/adjustments/${adj1}/post"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
          trigger:
            - call: "POST /inventory-integrity/adjustments/${adj1}/reverse"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
          assert:
            - "before the trigger, StockPosition.${pos_tee1}.on_hand_units == -5, promising_state == \"BLOCKED\", Store.${store_s100}.fulfillment_status == \"SUSPENDED\" and CountSchedule.${sched1}.cadence_days == 15"
            - "response status 200"
            - "response data.posting_state == \"REVERSED\" and data.reversed_at == \"2026-08-01T00:00:00Z\""
            - "response data.approval_state == \"NOT_REQUIRED\" — reversal never touches the approval dimension"
            - "CONSERVED — StockPosition.${pos_tee1}.on_hand_units == 5 == baseline_on_hand_units 5 + sum(delta_units over POSTED adjustments) 0, with zero drift"
            - "CONSERVED — StockPosition.${pos_tee1}.book_value_cents == 6170 and promising_state == \"PROMISABLE\""
            - "CONSERVED — GET /inventory-integrity/stores/${store_s100}/fulfillment-eligibility returns blocked_position_count 0, accuracy_index_bps 10000 and fulfillment_status \"ELIGIBLE\""
            - "NOT CONSERVED, deliberately — CountSchedule.${sched1}.cadence_days is still 15 and next_due_date is still \"2026-08-01\"; schedule acceleration is one-way"
            - "the reversed row is retained: GET /inventory-integrity/adjustments?stock_position_id=${pos_tee1} still returns total_count 1, and a repeat reverse returns ERR_ADJUSTMENT_INVALID_STATE (409)"

      - name: count_return_to_count_waives_investigations_and_restores_shrink_unresolved
        grounds:
          - state_machines.CountTask.COUNTED_to_IN_PROGRESS
          - state_machines.VarianceInvestigation.OPEN_to_WAIVED
          - entities.ShrinkPeriod.fields.unresolved_cents
          - entities.ShrinkPeriod.fields.total_attributable_variance_cents
          - global_constants.MAX_RECOUNT_ROUNDS
        distinguishing_aspect: |
          Conserved quantity: the SHRINK ATTRIBUTION TOTAL of the covering period — a different
          conserved quantity from inventory units and from vendor money. Sending a COUNTED task back
          to counting deletes its lines and waives their OPEN investigations, and every waived amount
          must leave unresolved_cents, restoring the period to the exact 0 / 0 it held before the
          submit. The compensation is complete in the ledger while the count's own loop counter
          advances, so the undo is not a plain rollback.
        test_recipe:
          setup:
            - "Category APPAREL; Store S100; Vendor VEND1; Item TEE-001 at 1234 cents; one stock position at S100 with opening on-hand 100 units."
            - "An OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30 with sales_at_cost_cents 5000000, reading 0 in every bucket before the count."
            - "A started APPAREL count task with one HANDHELD line counting 105 against 100, which is out of tolerance at 5 units and 6633 cents."
            - "The task is submitted, so one OPEN VarianceInvestigation exists and the period's unresolved_cents reads 6633."
            - "CountTask.recount_round is 0, which is below MAX_RECOUNT_ROUNDS 1, so the return-to-count edge is available exactly once."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-07-01", period_end: "2026-09-30", sales_at_cost_cents: 5000000 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { sp1: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { task1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/start"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /inventory-integrity/count-tasks/${task1}/lines"
              payload: { item_id: "${item_tee1}", counted_units: 105, read_mode_used: "HANDHELD" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { line_a: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/submit"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "GET /inventory-integrity/variance-investigations"
              payload: { count_line_id: "${line_a}" }
              as: InventorySupervisor
              as_user_id: "u_super_1"
              captures: { inv_a: "$.data[0].id" }
          trigger:
            - call: "POST /inventory-integrity/count-tasks/${task1}/return-to-count"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
          assert:
            - "before the trigger, GET /inventory-integrity/shrink-periods/${sp1}/attribution returns data.unresolved_cents == 6633 and data.total_attributable_variance_cents == 6633, and VarianceInvestigation.${inv_a}.status == \"OPEN\""
            - "response status 200 and data.status == \"IN_PROGRESS\""
            - "response data.recount_round == 1 and data.counted_line_count == 0 and data.coverage_pct == 0.00 and data.variance_line_count == 0 and data.total_variance_value_cents == 0"
            - "CONSERVED — GET /inventory-integrity/shrink-periods/${sp1}/attribution now returns data.unresolved_cents == 0, data.total_attributable_variance_cents == 0, data.provisional_total_shrink_cents == 0, data.final_total_shrink_cents == 0 and data.provisional_shrink_rate_bps == 0, exactly the pre-submit reading"
            - "VarianceInvestigation.${inv_a}.status == \"WAIVED\" and it is a terminal row that no longer restricts anything"
            - "CountLine.${line_a} no longer exists: GET /inventory-integrity/count-lines?count_task_id=${task1} returns total_count 0"
            - "NOT CONSERVED, deliberately — StockPosition.${pos_tee1}.last_counted_at, last_count_system_units 100, last_variance_units 5 and last_variance_value_cents 6633 are retained as the audit snapshot of what was counted, so value_accuracy_pct stays 94.62 and promising_state stays \"RESTRICTED\""
            - "recount_round 1 == MAX_RECOUNT_ROUNDS, so a second submit-then-return cycle returns ERR_REWORK_LIMIT_REACHED (409)"

      - name: vendor_chargeback_credit_conserves_gross
        grounds:
          - endpoints.POST_/inventory-integrity/vendors/{vendor_id}/chargeback-credits
          - entities.Vendor.fields.lifetime_chargeback_gross_cents
          - entities.Vendor.fields.credited_cents
          - entities.Vendor.fields.chargeback_balance_cents
          - validations.priority_105_ERR_CREDIT_EXCEEDS_BALANCE
        distinguishing_aspect: |
          Conserved quantity: VENDOR MONEY, pinned by the identity
          lifetime_chargeback_gross_cents - credited_cents == chargeback_balance_cents. A rebuttal
          credit is a compensating write that may only move the credited leg: gross is never
          rewritten and never decremented, so the balance falls by exactly the credit and the identity
          re-closes at every step. Priority 105 is the invariant's guard rail — a credit larger than
          the outstanding balance is refused rather than allowed to push the balance negative, and a
          credit exactly equal to the balance drains it to 0 and no further. Distinct from the
          inventory-unit identity and from the shrink-attribution total conserved by the other two.
        test_recipe:
          setup:
            - "Category HOME with landed_cost_uplift_bps 0; Store S100; Vendor VEND1; Item SOFA-01 in HOME at 5000 cents with primary_vendor_id VEND1."
            - "One stock position at S100 for SOFA-01 with opening on-hand 100 units."
            - "An OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30 with sales_at_cost_cents 5000000."
            - "A submitted HOME count whose single line counts 141 against 100, driven to CLOSED with approved_root_cause VENDOR_SHORTAGE, so attributable shortage is 41 * 5000 = 205000 cents."
            - "A chargeback is issued out of that period: TIER_3, gross 205000, goodwill credit 10250, so the vendor ledger opens at gross 205000 / credited 10250 / balance 194750."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "HOME", name: "Home", count_cadence_days: 30, variance_tolerance_units: 5, variance_tolerance_value_cents: 6000, min_accuracy_pct: 95.00, landed_cost_uplift_bps: 0, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_home: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_home}", primary_vendor_id: "${vendor1}", sku: "SOFA-01", description: "Two-seat sofa", unit_cost_cents: 5000, retail_price_cents: 9999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_sofa: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_sofa}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_sofa: "$.data.id" }
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-07-01", period_end: "2026-09-30", sales_at_cost_cents: 5000000 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { sp1: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_home}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched_home: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched_home}", reader_mode: "HANDHELD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { task_home: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task_home}/start"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /inventory-integrity/count-tasks/${task_home}/lines"
              payload: { item_id: "${item_sofa}", counted_units: 141, read_mode_used: "HANDHELD" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { line_sofa: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task_home}/submit"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "GET /inventory-integrity/variance-investigations"
              payload: { count_line_id: "${line_sofa}" }
              as: InventorySupervisor
              as_user_id: "u_super_1"
              captures: { inv_sofa: "$.data[0].id" }
            - call: "POST /inventory-integrity/variance-investigations/${inv_sofa}/assign"
              payload: { assigned_investigator_id: "u_analyst_1" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { inv_sofa_v: "$.data.version" }
            - call: "POST /inventory-integrity/variance-investigations/${inv_sofa}/propose-cause"
              payload: { proposed_root_cause: "VENDOR_SHORTAGE", evidence_note: "ASN quantity exceeded the received tag population by 41", expected_investigation_version: "${inv_sofa_v}" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /inventory-integrity/variance-investigations/${inv_sofa}/approve-cause"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
            - call: "POST /inventory-integrity/variance-investigations/${inv_sofa}/close"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
            - call: "POST /inventory-integrity/vendors/${vendor1}/chargebacks"
              payload: { shrink_period_id: "${sp1}" }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
          trigger:
            - call: "POST /inventory-integrity/vendors/${vendor1}/chargeback-credits"
              payload: { credit_cents: 4750, note: "Rebuttal accepted for one mis-scanned pallet" }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
          assert:
            - "before the trigger, GET /inventory-integrity/vendors/${vendor1} returns lifetime_chargeback_gross_cents 205000, credited_cents 10250 and chargeback_balance_cents 194750, and 205000 - 10250 == 194750"
            - "response status 201"
            - "response data.credit_cents == 4750"
            - "CONSERVED — response data.lifetime_chargeback_gross_cents == 205000, unchanged: a credit never rewrites the gross leg"
            - "response data.credited_cents == 15000 and data.chargeback_balance_cents == 190000, so 205000 - 15000 == 190000 closes the identity again"
            - "GET /inventory-integrity/vendors/${vendor1} agrees with the response on all three ledger legs and shortage_event_count is still 1"
            - "a follow-up credit of 190001 cents returns ERR_CREDIT_EXCEEDS_BALANCE (422) and leaves credited_cents at 15000 and chargeback_balance_cents at 190000 untouched"
            - "a follow-up credit of exactly 190000 cents succeeds, giving credited_cents 205000 and chargeback_balance_cents 0, and a further credit of 1 cent then returns ERR_CREDIT_EXCEEDS_BALANCE (422) — the balance never goes negative"
            - "a second chargeback out of ${sp1} returns ERR_CHARGEBACK_ALREADY_ISSUED (409), so the gross leg cannot be inflated twice out of one period"
