scenario: |
  Transaction Coordinator Service (independent transaction coordinator): contract-to-close milestone checklist by state & contract type, document collection & compliance file audit, deadline tracking (inspection/appraisal/financing contingency) & reminder cadence, party communication log & escalation, amendment/addendum routing for signature, title/lender coordination & clear-to-close verification, per-file fee vs subscription pricing, post-close file archive

domain_name: transaction-coordinator-service
api_prefix: /tc

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Coordinator
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Coordinator legal name" }
      - { name: email, type: string, source: input, description: "Login email; unique across coordinators", constraints: "unique" }
      - { name: license_number, type: string, source: input, description: "TC license number" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: coordinator_id, type: string, source: system, description: "FK -> Coordinator.id; roster owner, set from the acting Coordinator's X-User-ID" }
      - { name: full_name, type: string, source: input, description: "Agent name" }
      - { name: email, type: string, source: input, description: "Agent email" }
      - { name: brokerage, type: string, source: input, description: "Brokerage name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE" }

  - name: ChecklistTemplate
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code this template applies to", constraints: "2 uppercase letters" }
      - { name: contract_type, type: enum, source: input, description: "PURCHASE_SALE | LISTING_ONLY" }
      - { name: milestone_defs, type: array, source: input, description: "Array of {name, offset_days, mandatory}; offset_days is calendar days from the file's effective_date; must be non-empty to publish" }
      - { name: required_doc_types, type: array, source: input, description: "Document doc_type values required by this template for audit PASS; may be empty" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT → ACTIVE → RETIRED; at most one ACTIVE per (state_code, contract_type)" }
      - { name: template_version, type: integer, source: system, default: 1, description: "Increments by 1 on every publish; pinned onto TransactionFile at activation" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: coordinator_id, type: string, source: system, description: "FK -> Coordinator.id; set from acting Coordinator; at most one ACTIVE subscription per coordinator" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly subscription fee in cents" }
      - { name: included_files_quota, type: integer, source: input, description: "Number of committed file slots included before overage; 0 allowed (every file is overage)", constraints: ">= 0" }
      - { name: overage_fee_cents, type: integer, source: input, description: "Per-file charge once included_files_used >= included_files_quota at file creation" }
      - { name: included_files_used, type: integer, source: computed, default: 0, description: "Committed slot counter: +1 at file creation under this subscription, -1 on eligible termination release" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CANCELLED" }

  - name: TransactionFile
    parent: null
    common_fields: true
    fields:
      - { name: coordinator_id, type: string, source: system, description: "FK -> Coordinator.id; owning coordinator (actor at creation)" }
      - { name: buyer_agent_id, type: string, source: input, description: "FK -> Agent.id; required when contract_type == PURCHASE_SALE, null allowed otherwise" }
      - { name: seller_agent_id, type: string, source: input, description: "FK -> Agent.id; always required" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; required iff billing_model == SUBSCRIPTION, forbidden otherwise" }
      - { name: billing_model, type: enum, source: input, description: "PER_FILE | SUBSCRIPTION" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code governing template selection and deadline day-count convention" }
      - { name: contract_type, type: enum, source: input, description: "PURCHASE_SALE | LISTING_ONLY" }
      - { name: property_address, type: string, source: input, description: "Street address of the property" }
      - { name: effective_date, type: string, source: input, description: "Contract execution date (YYYY-MM-DD); anchor for milestone/deadline offsets" }
      - { name: closing_date, type: string, source: input, description: "Target closing date (YYYY-MM-DD); occupies the coordinator's closing calendar" }
      - { name: inspection_offset_days, type: integer, source: input, description: "Days from effective_date to inspection contingency deadline", constraints: ">= 0" }
      - { name: appraisal_offset_days, type: integer, source: input, description: "Days from effective_date to appraisal contingency deadline", constraints: ">= 0" }
      - { name: financing_offset_days, type: integer, source: input, description: "Days from effective_date to financing contingency deadline; omit for cash deals", constraints: ">= 0" }
      - { name: list_price_cents, type: integer, source: input, description: "Contract price in cents" }
      - { name: template_id, type: string, source: system, description: "FK -> ChecklistTemplate.id; pinned at activation" }
      - { name: template_version, type: integer, source: system, description: "ChecklistTemplate.template_version pinned at activation (version pinning)" }
      - { name: fee_estimate_cents, type: integer, source: computed, description: "Estimated fee at activation (base + rush, or subscription overage); see file_fee_estimate" }
      - { name: fee_final_cents, type: integer, source: computed, description: "Final fee at close including amendment overage; see file_fee_final" }
      - { name: last_audit_status, type: enum, source: computed, default: NONE, description: "NONE | PASS | FAIL; reset to NONE on any Document status mutation after an audit" }
      - { name: open_escalation_count, type: integer, source: computed, default: 0, description: "Count of CommunicationEntry in ESCALATED status on this file" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT → ACTIVE → PENDING_CLOSE → CLOSED → ARCHIVED; ACTIVE/PENDING_CLOSE → TERMINATED" }
      - { name: terminated_reason, type: string, source: input, description: "Optional reason recorded at termination" }
      - { name: archived_at, type: datetime, source: system, description: "Timestamp of archival; set on CLOSED → ARCHIVED" }

  - name: Milestone
    parent: null
    common_fields: true
    fields:
      - { name: file_id, type: string, source: system, description: "FK -> TransactionFile.id" }
      - { name: name, type: string, source: system, description: "Milestone name copied from template milestone_defs" }
      - { name: offset_days, type: integer, source: system, description: "Calendar-day offset from file.effective_date, copied from template" }
      - { name: mandatory, type: boolean, source: system, description: "Mandatory milestones must be COMPLETED (not waived) before request-close" }
      - { name: due_date, type: string, source: computed, description: "effective_date + offset_days (calendar days); recomputed on amendment EFFECTIVE" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING → IN_PROGRESS → COMPLETED; PENDING/IN_PROGRESS/OVERDUE → WAIVED (non-mandatory only) or CANCELLED (cascade); system → OVERDUE" }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp of completion" }
      - { name: late_completion, type: boolean, source: computed, default: false, description: "True when completed from OVERDUE status" }

  - name: Deadline
    parent: null
    common_fields: true
    fields:
      - { name: file_id, type: string, source: system, description: "FK -> TransactionFile.id" }
      - { name: kind, type: enum, source: system, description: "INSPECTION | APPRAISAL | FINANCING" }
      - { name: offset_days, type: integer, source: system, description: "Offset copied from the file's inspection/appraisal/financing offset fields" }
      - { name: day_convention, type: enum, source: computed, description: "CALENDAR | BUSINESS; from state_code per deadline_due_date rule" }
      - { name: due_date, type: string, source: computed, description: "effective_date + offset under day_convention; recomputed on amendment EFFECTIVE" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING → MET | WAIVED | CANCELLED; system → EXPIRED" }
      - { name: met_at, type: datetime, source: system, description: "Timestamp when marked MET" }
      - { name: escalated, type: boolean, source: computed, default: false, description: "True once expiry has generated an escalation entry" }

  - name: Reminder
    parent: null
    common_fields: true
    fields:
      - { name: deadline_id, type: string, source: system, description: "FK -> Deadline.id" }
      - { name: sequence_no, type: integer, source: system, description: "1,2,3 in ascending scheduled_at order" }
      - { name: scheduled_at, type: datetime, source: computed, description: "due_date minus REMINDER_OFFSETS_DAYS days at 09:00:00Z; only future times are created" }
      - { name: sent_at, type: datetime, source: system, description: "Timestamp when sent" }
      - { name: status, type: enum, source: system, default: QUEUED, description: "QUEUED → SENT (system at scheduled_at) | CANCELLED (deadline terminal or reschedule)" }

  - name: Document
    parent: null
    common_fields: true
    fields:
      - { name: file_id, type: string, source: system, description: "FK -> TransactionFile.id" }
      - { name: doc_type, type: enum, source: input, description: "EXECUTED_CONTRACT | INSPECTION_REPORT | APPRAISAL_REPORT | LOAN_COMMITMENT | TITLE_COMMITMENT | T47_DISCLOSURE | NHD_REPORT | TDS_DISCLOSURE | HOA_ADDENDUM | CLOSING_DISCLOSURE | AMENDMENT_EXECUTED | OTHER" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED → RECEIVED → ACCEPTED | REJECTED; REJECTED → RECEIVED (resubmit cycle); any non-terminal → CANCELLED (cascade)" }
      - { name: submitted_by_agent_id, type: string, source: system, description: "FK -> Agent.id; set from the submitting Agent's X-User-ID" }
      - { name: review_round, type: integer, source: system, default: 1, description: "Increments by 1 on every resubmission from REJECTED" }
      - { name: reject_reason, type: string, source: input, description: "Required on reject" }

  - name: CommunicationEntry
    parent: null
    common_fields: false
    fields:
      - { name: file_id, type: string, source: system, description: "FK -> TransactionFile.id" }
      - { name: entry_kind, type: enum, source: system, default: LOG, description: "LOG | ESCALATION | SYSTEM" }
      - { name: author_role, type: string, source: system, description: "Role name recorded from X-User-Role" }
      - { name: party, type: enum, source: input, description: "BUYER_AGENT | SELLER_AGENT | LENDER | TITLE | COORDINATOR | SYSTEM" }
      - { name: direction, type: enum, source: input, description: "INBOUND | OUTBOUND | SYSTEM" }
      - { name: body, type: string, source: input, description: "Message text" }
      - { name: requires_response, type: boolean, source: input, default: false, description: "If true, response_due_at is required" }
      - { name: response_due_at, type: datetime, source: input, description: "Response deadline; must be strictly after current clock time" }
      - { name: in_reply_to_id, type: string, source: input, description: "FK -> CommunicationEntry.id; optional self-reference; answering marks the referenced OPEN entry ANSWERED" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN → ANSWERED | RESOLVED; OPEN → ESCALATED (system); ESCALATED → RESOLVED" }

  - name: Amendment
    parent: null
    common_fields: true
    fields:
      - { name: file_id, type: string, source: system, description: "FK -> TransactionFile.id" }
      - { name: round_number, type: integer, source: system, default: 1, description: "Increments by 1 on each revise (REJECTED → DRAFT)" }
      - { name: new_effective_date, type: string, source: input, description: "Optional replacement effective_date applied when EFFECTIVE" }
      - { name: new_closing_date, type: string, source: input, description: "Optional replacement closing_date applied when EFFECTIVE; must not be in the past at creation" }
      - { name: new_list_price_cents, type: integer, source: input, description: "Optional replacement price applied when EFFECTIVE" }
      - { name: effective_from, type: string, source: input, description: "Start of amendment effective window (inclusive, YYYY-MM-DD)" }
      - { name: effective_to, type: string, source: input, description: "End of amendment effective window (exclusive, YYYY-MM-DD); must be > effective_from" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT → ROUTED → PARTIALLY_SIGNED → FULLY_SIGNED → EFFECTIVE; ROUTED/PARTIALLY_SIGNED → REJECTED → DRAFT (revise cycle); DRAFT/ROUTED/PARTIALLY_SIGNED/FULLY_SIGNED → VOIDED" }

  - name: SignatureRequest
    parent: null
    common_fields: true
    fields:
      - { name: amendment_id, type: string, source: system, description: "FK -> Amendment.id" }
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; the agent who must sign" }
      - { name: signer_party, type: enum, source: system, description: "BUYER_AGENT | SELLER_AGENT" }
      - { name: round_number, type: integer, source: system, description: "Amendment round this request belongs to" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING → SIGNED | DECLINED | VOIDED" }
      - { name: signed_at, type: datetime, source: system, description: "Timestamp of signature" }

  - name: ClosingVerification
    parent: null
    common_fields: true
    fields:
      - { name: file_id, type: string, source: system, description: "FK -> TransactionFile.id; 1:1, created at request-close" }
      - { name: title_status, type: enum, source: system, default: PENDING, description: "PENDING → CLEARED (TitleRep confirm)" }
      - { name: lender_status, type: enum, source: system, description: "PENDING → CLEAR_TO_CLOSE (LenderRep confirm); initialized NOT_REQUIRED when the file has no financing contingency" }
      - { name: overall_status, type: enum, source: computed, default: PENDING, description: "PENDING | CLEAR_TO_CLOSE; CLEAR_TO_CLOSE iff title_status == CLEARED AND lender_status IN {CLEAR_TO_CLOSE, NOT_REQUIRED}" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: file_id, type: string, source: system, description: "FK -> TransactionFile.id; 1:1, created at file activation" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; null for PER_FILE billing" }
      - { name: line_items, type: array, source: computed, description: "Array of {label, amount_cents}; labels: BASE_FEE | RUSH_SURCHARGE | SUBSCRIPTION_OVERAGE | SUBSCRIPTION_INCLUDED | AMENDMENT_FEE | TERMINATION_CREDIT" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line item amounts (each already integer cents)" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "round_half_up(subtotal_cents * 0.05) when billing_model == SUBSCRIPTION, else 0; computed on the summed subtotal, never per line" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT → ISSUED → PAID; DRAFT → VOIDED (termination cascade)" }
      - { name: issued_at, type: datetime, source: system, description: "Timestamp of issuance" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: TransactionFile
    initial_state: DRAFT
    terminal_states: [ARCHIVED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /tc/files/{fileId}/activate"
        actor: Coordinator
        preconditions:
          - "File in DRAFT (ERR_FILE_NOT_DRAFT)"
          - "An ACTIVE ChecklistTemplate exists for (file.state_code, file.contract_type) (ERR_TEMPLATE_NOT_FOUND)"
          - "If billing_model == SUBSCRIPTION: subscription exists, is ACTIVE, and belongs to the acting coordinator (ERR_SUBSCRIPTION_INACTIVE)"
          - "closing_date is not before the current clock date (ERR_CLOSING_DATE_IN_PAST)"
          - "No other file of the same coordinator in status ACTIVE or PENDING_CLOSE has a closing_date within MIN_CLOSING_GAP_DAYS-1 days (ERR_CLOSING_DATE_CONFLICT)"
        side_effects:
          - "Pin template_id and template_version from the ACTIVE template"
          - "Instantiate one Milestone per template milestone_defs entry (due_date = effective_date + offset_days)"
          - "Instantiate Deadlines: INSPECTION (inspection_offset_days), APPRAISAL (appraisal_offset_days), and FINANCING iff financing_offset_days was provided"
          - "Compute each Deadline.due_date via deadline_due_date and generate its Reminder rows via reminder_schedule"
          - "Compute fee_estimate_cents via file_fee_estimate and create the file's Invoice in DRAFT with estimate lines"
        note: "Subscription slot is committed earlier, at file creation (POST /tc/files), not here."

      - from: ACTIVE
        to: PENDING_CLOSE
        trigger: "POST /tc/files/{fileId}/request-close"
        actor: Coordinator
        preconditions:
          - "File in ACTIVE (ERR_FILE_NOT_ACTIVE)"
          - "file.last_audit_status == PASS (ERR_AUDIT_NOT_PASSED)"
          - "Every mandatory Milestone is COMPLETED (ERR_MANDATORY_MILESTONES_OPEN)"
          - "file.open_escalation_count == 0 (ERR_OPEN_ESCALATIONS)"
        side_effects:
          - "Create the 1:1 ClosingVerification: title_status PENDING; lender_status NOT_REQUIRED when no FINANCING deadline exists on the file, else PENDING"

      - from: PENDING_CLOSE
        to: CLOSED
        trigger: "POST /tc/files/{fileId}/close"
        actor: Coordinator
        preconditions:
          - "File in PENDING_CLOSE (ERR_FILE_NOT_PENDING_CLOSE)"
          - "ClosingVerification.overall_status == CLEAR_TO_CLOSE (ERR_NOT_CLEAR_TO_CLOSE)"
        side_effects:
          - "Compute fee_final_cents via file_fee_final (includes amendment overage)"
          - "Rebuild Invoice line_items to the final set, recompute subtotal/discount/total, Invoice → ISSUED (issued_at set)"

      - from: CLOSED
        to: ARCHIVED
        trigger: "POST /tc/files/{fileId}/archive"
        actor: Coordinator
        preconditions:
          - "File in CLOSED (ERR_FILE_NOT_CLOSED)"
          - "Invoice.status == PAID (ERR_INVOICE_UNPAID)"
        side_effects:
          - "archived_at set to current clock time; file becomes read-only (post-close archive)"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /tc/files/{fileId}/terminate"
        actor: Coordinator
        preconditions:
          - "File in ACTIVE or PENDING_CLOSE (ERR_FILE_ALREADY_TERMINAL otherwise)"
        side_effects:
          - "Cascade 1: every Milestone in PENDING/IN_PROGRESS/OVERDUE → CANCELLED"
          - "Cascade 2: every Deadline in PENDING → CANCELLED; that cancellation itself cancels all of the deadline's QUEUED Reminders → CANCELLED"
          - "Cascade 3: every Amendment in DRAFT/ROUTED/PARTIALLY_SIGNED/FULLY_SIGNED → VOIDED; that voiding itself voids all of the amendment's PENDING SignatureRequests → VOIDED"
          - "Every CommunicationEntry in OPEN or ESCALATED → RESOLVED; open_escalation_count reset to 0"
          - "Invoice in DRAFT → VOIDED with TERMINATION_CREDIT lines offsetting every charge line (net line sum == 0)"
          - "Slot release: if billing_model == SUBSCRIPTION AND no Document on the file ever reached ACCEPTED, decrement Subscription.included_files_used by 1 and bump Subscription.version by 1"
          - "ClosingVerification (if it exists) is left with overall_status unchanged but the file is terminal"

      - from: PENDING_CLOSE
        to: TERMINATED
        trigger: "POST /tc/files/{fileId}/terminate"
        actor: Coordinator
        preconditions:
          - "File in ACTIVE or PENDING_CLOSE (ERR_FILE_ALREADY_TERMINAL otherwise)"
        side_effects:
          - "Same cascade as ACTIVE → TERMINATED"

  - entity: Milestone
    initial_state: PENDING
    terminal_states: [COMPLETED, WAIVED, CANCELLED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /tc/milestones/{milestoneId}/start"
        actor: Coordinator
        preconditions:
          - "Milestone in PENDING (ERR_MILESTONE_INVALID_STATE)"
          - "Owning TransactionFile in ACTIVE (ERR_FILE_NOT_ACTIVE)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /tc/milestones/{milestoneId}/complete"
        actor: Coordinator
        preconditions:
          - "Milestone in IN_PROGRESS or OVERDUE (ERR_MILESTONE_INVALID_STATE)"
        side_effects:
          - "completed_at set; late_completion = (previous status == OVERDUE)"

      - from: OVERDUE
        to: COMPLETED
        trigger: "POST /tc/milestones/{milestoneId}/complete"
        actor: Coordinator
        preconditions:
          - "Milestone in IN_PROGRESS or OVERDUE (ERR_MILESTONE_INVALID_STATE)"
        side_effects:
          - "completed_at set; late_completion = true"

      - from: PENDING
        to: WAIVED
        trigger: "POST /tc/milestones/{milestoneId}/waive"
        actor: Coordinator
        preconditions:
          - "Milestone in PENDING, IN_PROGRESS, or OVERDUE (ERR_MILESTONE_INVALID_STATE)"
          - "milestone.mandatory == false (ERR_MILESTONE_MANDATORY)"
        side_effects: []

      - from: IN_PROGRESS
        to: WAIVED
        trigger: "POST /tc/milestones/{milestoneId}/waive"
        actor: Coordinator
        preconditions:
          - "Milestone in PENDING, IN_PROGRESS, or OVERDUE"
          - "milestone.mandatory == false (ERR_MILESTONE_MANDATORY)"
        side_effects: []

      - from: OVERDUE
        to: WAIVED
        trigger: "POST /tc/milestones/{milestoneId}/waive"
        actor: Coordinator
        preconditions:
          - "Milestone in PENDING, IN_PROGRESS, or OVERDUE"
          - "milestone.mandatory == false (ERR_MILESTONE_MANDATORY)"
        side_effects: []

      - from: PENDING
        to: OVERDUE
        trigger: "system (POST /tc/_clock/set_current_utc advance: current date > due_date)"
        actor: system
        preconditions:
          - "Milestone in PENDING or IN_PROGRESS and current clock date > due_date"
        side_effects: []

      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "system (POST /tc/_clock/set_current_utc advance: current date > due_date)"
        actor: system
        preconditions:
          - "Milestone in PENDING or IN_PROGRESS and current clock date > due_date"
        side_effects: []

      - from: PENDING
        to: CANCELLED
        trigger: "system (file termination cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (file termination cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OVERDUE
        to: CANCELLED
        trigger: "system (file termination cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Deadline
    initial_state: PENDING
    terminal_states: [MET, WAIVED, EXPIRED, CANCELLED]
    transitions:
      - from: PENDING
        to: MET
        trigger: "POST /tc/deadlines/{deadlineId}/mark-met"
        actor: Coordinator
        preconditions:
          - "Deadline in PENDING (ERR_DEADLINE_INVALID_STATE)"
          - "Owning TransactionFile in ACTIVE or PENDING_CLOSE (ERR_FILE_NOT_ACTIVE)"
        side_effects:
          - "met_at set; all QUEUED Reminders of this deadline → CANCELLED"

      - from: PENDING
        to: WAIVED
        trigger: "POST /tc/deadlines/{deadlineId}/waive"
        actor: Coordinator
        preconditions:
          - "Deadline in PENDING (ERR_DEADLINE_INVALID_STATE)"
        side_effects:
          - "All QUEUED Reminders of this deadline → CANCELLED"

      - from: PENDING
        to: EXPIRED
        trigger: "system (POST /tc/_clock/set_current_utc advance: current date > due_date)"
        actor: system
        preconditions:
          - "Deadline in PENDING and current clock date > due_date"
        side_effects:
          - "All QUEUED Reminders of this deadline → CANCELLED"
          - "Create CommunicationEntry on the file: entry_kind ESCALATION, party SYSTEM, direction SYSTEM, status ESCALATED (link: this creation itself increments TransactionFile.open_escalation_count by 1)"
          - "deadline.escalated = true"

      - from: PENDING
        to: CANCELLED
        trigger: "system (file termination cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "All QUEUED Reminders of this deadline → CANCELLED"

  - entity: Reminder
    initial_state: QUEUED
    terminal_states: [SENT, CANCELLED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "system (POST /tc/_clock/set_current_utc advance: current time >= scheduled_at and deadline still PENDING)"
        actor: system
        preconditions:
          - "Reminder QUEUED, clock time >= scheduled_at, owning Deadline still PENDING"
        side_effects:
          - "sent_at set"

      - from: QUEUED
        to: CANCELLED
        trigger: "system (deadline MET/WAIVED/EXPIRED/CANCELLED, or amendment reschedule)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Document
    initial_state: REQUESTED
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /tc/documents/{documentId}/submit"
        actor: Agent
        preconditions:
          - "Document in REQUESTED or REJECTED (ERR_DOCUMENT_INVALID_STATE)"
          - "Acting agent is buyer_agent_id or seller_agent_id of the owning file (ERR_AGENT_NOT_ON_FILE)"
        side_effects:
          - "submitted_by_agent_id set to acting agent; file.last_audit_status → NONE"

      - from: REJECTED
        to: RECEIVED
        trigger: "POST /tc/documents/{documentId}/submit"
        actor: Agent
        preconditions:
          - "Document in REQUESTED or REJECTED (ERR_DOCUMENT_INVALID_STATE)"
          - "Acting agent is buyer_agent_id or seller_agent_id of the owning file (ERR_AGENT_NOT_ON_FILE)"
        side_effects:
          - "review_round += 1; submitted_by_agent_id set; file.last_audit_status → NONE"

      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /tc/documents/{documentId}/accept"
        actor: Coordinator
        preconditions:
          - "Document in RECEIVED (ERR_DOCUMENT_INVALID_STATE)"
        side_effects:
          - "file.last_audit_status → NONE (audit must be re-run)"

      - from: RECEIVED
        to: REJECTED
        trigger: "POST /tc/documents/{documentId}/reject"
        actor: Coordinator
        preconditions:
          - "Document in RECEIVED (ERR_DOCUMENT_INVALID_STATE)"
          - "reason provided (ERR_INVALID_REQUEST)"
        side_effects:
          - "reject_reason recorded; file.last_audit_status → NONE"

      - from: REQUESTED
        to: CANCELLED
        trigger: "system (file termination cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RECEIVED
        to: CANCELLED
        trigger: "system (file termination cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: REJECTED
        to: CANCELLED
        trigger: "system (file termination cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CommunicationEntry
    initial_state: OPEN
    terminal_states: [ANSWERED, RESOLVED]
    transitions:
      - from: OPEN
        to: ANSWERED
        trigger: "system (POST /tc/communications with in_reply_to_id referencing this entry)"
        actor: system
        preconditions:
          - "Referenced entry in OPEN"
        side_effects: []

      - from: OPEN
        to: ESCALATED
        trigger: "system (POST /tc/_clock/set_current_utc advance: requires_response AND clock time > response_due_at)"
        actor: system
        preconditions:
          - "Entry OPEN, requires_response == true, clock time > response_due_at"
        side_effects:
          - "TransactionFile.open_escalation_count += 1"

      - from: OPEN
        to: RESOLVED
        trigger: "POST /tc/communications/{communicationId}/resolve or system (file termination)"
        actor: Coordinator
        preconditions:
          - "Entry in OPEN or ESCALATED (ERR_COMMUNICATION_INVALID_STATE)"
        side_effects: []

      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /tc/communications/{communicationId}/resolve or system (file termination)"
        actor: Coordinator
        preconditions:
          - "Entry in OPEN or ESCALATED (ERR_COMMUNICATION_INVALID_STATE)"
        side_effects:
          - "TransactionFile.open_escalation_count -= 1"

  - entity: Amendment
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, VOIDED]
    transitions:
      - from: DRAFT
        to: ROUTED
        trigger: "POST /tc/amendments/{amendmentId}/route"
        actor: Coordinator
        preconditions:
          - "Amendment in DRAFT (ERR_AMENDMENT_INVALID_STATE)"
          - "Owning TransactionFile in ACTIVE (ERR_FILE_NOT_ACTIVE)"
          - "No other amendment of the same file in ROUTED, PARTIALLY_SIGNED, or FULLY_SIGNED (ERR_AMENDMENT_IN_FLIGHT)"
        side_effects:
          - "Create SignatureRequests for the current round: PURCHASE_SALE → one for buyer_agent_id (BUYER_AGENT) and one for seller_agent_id (SELLER_AGENT); LISTING_ONLY → one for seller_agent_id only"

      - from: ROUTED
        to: PARTIALLY_SIGNED
        trigger: "system (first SignatureRequest of the current round → SIGNED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ROUTED
        to: FULLY_SIGNED
        trigger: "system (all SignatureRequests of the current round SIGNED — single-signer case)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PARTIALLY_SIGNED
        to: FULLY_SIGNED
        trigger: "system (all SignatureRequests of the current round SIGNED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FULLY_SIGNED
        to: EFFECTIVE
        trigger: "POST /tc/amendments/{amendmentId}/apply"
        actor: Coordinator
        preconditions:
          - "Amendment in FULLY_SIGNED (ERR_AMENDMENT_INVALID_STATE)"
        side_effects:
          - "Link 1 — apply payload to TransactionFile: effective_date/closing_date/list_price_cents replaced where new_* fields are non-null; file.version incremented"
          - "Link 2 — the file's effective_date change recomputes every non-terminal Milestone.due_date (= new effective_date + offset_days) and every PENDING Deadline.due_date (via deadline_due_date under the file's convention)"
          - "Link 3 — each recomputed PENDING Deadline regenerates its reminders: QUEUED Reminders → CANCELLED, new future Reminders created per reminder_schedule; SENT Reminders are preserved untouched"

      - from: ROUTED
        to: REJECTED
        trigger: "system (any SignatureRequest of the current round → DECLINED)"
        actor: system
        preconditions: []
        side_effects:
          - "All remaining PENDING SignatureRequests of the current round → VOIDED"

      - from: PARTIALLY_SIGNED
        to: REJECTED
        trigger: "system (any SignatureRequest of the current round → DECLINED)"
        actor: system
        preconditions: []
        side_effects:
          - "All remaining PENDING SignatureRequests of the current round → VOIDED"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /tc/amendments/{amendmentId}/revise"
        actor: Coordinator
        preconditions:
          - "Amendment in REJECTED (ERR_AMENDMENT_INVALID_STATE)"
        side_effects:
          - "round_number += 1"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /tc/amendments/{amendmentId}/void or system (file termination cascade or superseded by a newer amendment creation)"
        actor: Coordinator
        preconditions:
          - "Amendment in DRAFT, ROUTED, PARTIALLY_SIGNED, or FULLY_SIGNED (ERR_AMENDMENT_INVALID_STATE)"
        side_effects:
          - "All PENDING SignatureRequests → VOIDED"

      - from: ROUTED
        to: VOIDED
        trigger: "POST /tc/amendments/{amendmentId}/void or system (file termination cascade)"
        actor: Coordinator
        preconditions:
          - "Amendment in DRAFT, ROUTED, PARTIALLY_SIGNED, or FULLY_SIGNED"
        side_effects:
          - "All PENDING SignatureRequests → VOIDED"

      - from: PARTIALLY_SIGNED
        to: VOIDED
        trigger: "system (file termination cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "All PENDING SignatureRequests → VOIDED"

      - from: FULLY_SIGNED
        to: VOIDED
        trigger: "system (file termination cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "All PENDING SignatureRequests → VOIDED"

  - entity: SignatureRequest
    initial_state: PENDING
    terminal_states: [SIGNED, DECLINED, VOIDED]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /tc/signature-requests/{signatureRequestId}/sign"
        actor: Agent
        preconditions:
          - "SignatureRequest in PENDING (ERR_SIGNATURE_INVALID_STATE)"
          - "Acting agent's X-User-ID == signature_request.agent_id (ERR_SIGNATURE_NOT_AUTHORIZED)"
          - "Owning Amendment in ROUTED or PARTIALLY_SIGNED (ERR_AMENDMENT_INVALID_STATE)"
        side_effects:
          - "signed_at set; amendment auto-transitions (PARTIALLY_SIGNED on first, FULLY_SIGNED when all current-round requests are SIGNED)"

      - from: PENDING
        to: DECLINED
        trigger: "POST /tc/signature-requests/{signatureRequestId}/decline"
        actor: Agent
        preconditions:
          - "SignatureRequest in PENDING (ERR_SIGNATURE_INVALID_STATE)"
          - "Acting agent's X-User-ID == signature_request.agent_id (ERR_SIGNATURE_NOT_AUTHORIZED)"
        side_effects:
          - "Owning Amendment → REJECTED; remaining PENDING SignatureRequests of the round → VOIDED"

      - from: PENDING
        to: VOIDED
        trigger: "system (amendment voided/rejected/superseded, or file terminated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ClosingVerification
    initial_state: PENDING
    terminal_states: [CLEAR_TO_CLOSE]
    transitions:
      - from: PENDING
        to: CLEAR_TO_CLOSE
        trigger: "system (derived: title_status == CLEARED AND lender_status IN {CLEAR_TO_CLOSE, NOT_REQUIRED})"
        actor: system
        preconditions: []
        side_effects: []
        note: "title_status and lender_status evolve as independent dimensions via confirm-title (TitleRep) and confirm-lender (LenderRep); overall_status is the derived join."

  - entity: ChecklistTemplate
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /tc/checklist-templates/{templateId}/publish"
        actor: SystemAdmin
        preconditions:
          - "Template in DRAFT (ERR_TEMPLATE_INVALID_STATE)"
          - "milestone_defs non-empty (ERR_INVALID_REQUEST)"
          - "No other ACTIVE template for the same (state_code, contract_type) (ERR_TEMPLATE_ALREADY_ACTIVE)"
        side_effects:
          - "template_version incremented by 1 on every publish"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /tc/checklist-templates/{templateId}/retire"
        actor: SystemAdmin
        preconditions:
          - "Template in ACTIVE (ERR_TEMPLATE_INVALID_STATE)"
        side_effects:
          - "Files that pinned this template_version are unaffected (version pinning)"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /tc/subscriptions/{subscriptionId}/cancel"
        actor: Coordinator
        preconditions:
          - "Subscription in ACTIVE (ERR_SUBSCRIPTION_INVALID_STATE)"
          - "No TransactionFile of this subscription in ACTIVE or PENDING_CLOSE (ERR_SUBSCRIPTION_HAS_ACTIVE_FILES)"
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /tc/invoices/{invoiceId}/issue or system (file close)"
        actor: Coordinator
        preconditions:
          - "Invoice in DRAFT (ERR_INVOICE_INVALID_STATE)"
          - "Owning file in ACTIVE or CLOSED (ERR_FILE_NOT_ACTIVE)"
        side_effects:
          - "issued_at set"

      - from: ISSUED
        to: PAID
        trigger: "POST /tc/invoices/{invoiceId}/mark-paid"
        actor: Coordinator
        preconditions:
          - "Invoice in ISSUED (ERR_INVOICE_INVALID_STATE)"
        side_effects: []

      - from: DRAFT
        to: VOIDED
        trigger: "system (file termination cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "TERMINATION_CREDIT lines appended offsetting every existing charge line (net line_items sum == 0; total_cents == 0)"

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: amendment-create-stale-file
    parent_entity: TransactionFile
    write_endpoint: "POST /tc/amendments"
    occ_field: "expected_file_version"
    description: |
      Creating an Amendment against a TransactionFile whose version has advanced
      since the client last observed it is rejected. Amendment creation legitimately
      supersedes any existing DRAFT amendment on the file and bumps file.version, so
      a second create carrying the previously observed version is stale.
    error_id: ERR_STALE_FILE_VERSION
    http_status: 412

  - rule_id: file-create-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /tc/files"
    occ_field: "expected_subscription_version"
    description: |
      Creating a SUBSCRIPTION-billed TransactionFile against a Subscription whose
      version has advanced since the client last observed it is rejected. File
      creation commits an included-files slot (included_files_used += 1) and bumps
      subscription.version, so a create carrying a previously observed version is
      stale even though quota semantics would otherwise allow the commitment.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: file_fee_estimate
    trigger: "TransactionFile activation (POST /tc/files/{id}/activate)"
    algorithm: tiered_pricing
    formula: |
      activation_date = current clock date (YYYY-MM-DD)
      if billing_model == PER_FILE:
          base = BASE_FEE_CENTS[contract_type]
          rush = RUSH_SURCHARGE_CENTS if (closing_date - activation_date) in days < RUSH_THRESHOLD_DAYS else 0
          fee_estimate_cents = base + rush
      if billing_model == SUBSCRIPTION:
          if included_files_used_at_commit < included_files_quota:
              fee_estimate_cents = 0        # included slot
          else:
              fee_estimate_cents = overage_fee_cents + (RUSH_SURCHARGE_CENTS if (closing_date - activation_date) in days < RUSH_THRESHOLD_DAYS else 0)
      Boundary: rush applies iff day-difference < 10 (a difference of exactly 10 does NOT trigger).
    input_set: "the file being activated; its subscription counters as committed at creation"
    constants:
      BASE_FEE_CENTS: { PURCHASE_SALE: 39500, LISTING_ONLY: 29500 }
      RUSH_THRESHOLD_DAYS: 10
      RUSH_SURCHARGE_CENTS: 7500
    precision: "integer cents; no rounding needed"
    variants:
      - name: per_file_variant
        when: "billing_model == PER_FILE"
        difference: "fee is base + rush, charged regardless of any subscription"
      - name: subscription_variant
        when: "billing_model == SUBSCRIPTION"
        difference: "fee is 0 while a committed slot is within quota, else overage_fee_cents + rush; identical file data prices differently under the two variants"

  - name: file_fee_final
    trigger: "TransactionFile close (POST /tc/files/{id}/close)"
    algorithm: tiered_pricing
    formula: |
      effective_amendments = count of the file's Amendments with status == EFFECTIVE
      amendment_fee = max(0, effective_amendments - FREE_AMENDMENTS) * AMENDMENT_FEE_CENTS
      if billing_model == PER_FILE:
          fee_final_cents = BASE_FEE_CENTS[contract_type] + rush (as computed at activation) + amendment_fee
      if billing_model == SUBSCRIPTION:
          base_component = 0 if the file committed within quota else overage_fee_cents
          fee_final_cents = base_component + rush + amendment_fee
      Evaluation order is fixed: (1) count EFFECTIVE amendments, (2) subtract FREE_AMENDMENTS with floor 0,
      (3) multiply by AMENDMENT_FEE_CENTS, (4) add to the activation-time components (base/overage, rush).
    input_set: "the file being closed; its Amendment rows in EFFECTIVE status only (DRAFT/ROUTED/PARTIALLY_SIGNED/FULLY_SIGNED/REJECTED/VOIDED excluded)"
    constants:
      BASE_FEE_CENTS: { PURCHASE_SALE: 39500, LISTING_ONLY: 29500 }
      FREE_AMENDMENTS: 1
      AMENDMENT_FEE_CENTS: 5000
      RUSH_THRESHOLD_DAYS: 10
      RUSH_SURCHARGE_CENTS: 7500
    precision: "integer cents"

  - name: invoice_total
    trigger: "Invoice creation at activation, rebuild at close, and void at termination"
    algorithm: aggregation
    formula: |
      1. Every charge component is computed and rounded to integer cents FIRST (round_half_up), one line per component.
      2. subtotal_cents = sum of line_items[*].amount_cents  (sum AFTER per-line rounding — never round a raw sum)
      3. if billing_model == SUBSCRIPTION: discount_cents = round_half_up(subtotal_cents * SUBSCRIPTION_DISCOUNT_PCT)
         else: discount_cents = 0
      4. total_cents = subtotal_cents - discount_cents
      The discount is computed once on the summed subtotal. Computing the discount per line and then summing
      is a different, non-conformant order and may differ by cents.
      On termination-void: append one TERMINATION_CREDIT line per charge line with amount = -1 * charge amount;
      subtotal_cents/total_cents then equal 0.
    input_set: "the Invoice's own line_items"
    constants:
      SUBSCRIPTION_DISCOUNT_PCT: 0.05
    precision: "integer cents, round_half_up at the two pinned points (per component; discount on subtotal)"

  - name: deadline_due_date
    trigger: "Deadline creation at activation; recomputation on amendment EFFECTIVE"
    algorithm: chronological
    formula: |
      convention = BUSINESS if state_code IN BUSINESS_DAY_STATES else CALENDAR
      CALENDAR: due_date = effective_date + offset_days calendar days
      BUSINESS: due_date = effective_date + offset_days business days, counting Mon-Fri only,
                starting the count on the day AFTER effective_date (day 0 = effective_date itself);
                holidays are NOT observed (weekends only).
      The convention is pinned per state; the two conventions produce different due dates for identical
      (effective_date, offset_days) inputs.
    input_set: "one Deadline row; the owning file's state_code and (possibly amended) effective_date"
    constants:
      BUSINESS_DAY_STATES: ["NY"]
    precision: "date granularity (YYYY-MM-DD)"
    variants:
      - name: calendar_convention
        when: "state_code not in BUSINESS_DAY_STATES"
        difference: "plain calendar-day addition"
      - name: business_convention
        when: "state_code in BUSINESS_DAY_STATES"
        difference: "weekend-skipping business-day count; same inputs yield a later due_date than calendar"

  - name: reminder_schedule
    trigger: "Deadline creation; regeneration when a PENDING deadline's due_date is recomputed"
    algorithm: chronological
    formula: |
      For a deadline with due_date D, candidate reminders are at (D - n days) T09:00:00Z for n in REMINDER_OFFSETS_DAYS,
      ordered ascending by scheduled_at with sequence_no 1..k in that order.
      Only candidates with scheduled_at strictly after the current clock time are created (past ones are skipped).
      On regeneration (amendment EFFECTIVE): all QUEUED reminders → CANCELLED; the rule above is re-run against the
      new due_date; SENT reminders are preserved and NOT counted toward the new sequence.
    input_set: "one Deadline in PENDING status"
    constants:
      REMINDER_OFFSETS_DAYS: [5, 2, 0]
      REMINDER_HOUR_UTC: 9
    precision: "second granularity, UTC"

  - name: compliance_audit
    trigger: "POST /tc/files/{id}/compliance-audit"
    algorithm: aggregation
    formula: |
      required_set = template.required_doc_types (in template declaration order)
                     concatenated with STATE_REQUIRED_DISCLOSURES[state_code] (in constant declaration order),
                     duplicates removed keeping first occurrence
      for each doc_type in required_set: satisfied iff the file has >= 1 Document with that doc_type in ACCEPTED status
      missing_doc_types = the unsatisfied doc_types, in required_set order
      result = PASS iff missing_doc_types is empty (an empty required_set therefore yields PASS with zero documents)
      Sets file.last_audit_status = result.
    input_set: "the file's Documents; only ACCEPTED status counts (REQUESTED/RECEIVED/REJECTED/CANCELLED excluded)"
    constants:
      STATE_REQUIRED_DISCLOSURES: { TX: ["T47_DISCLOSURE"], NY: ["NHD_REPORT"], CA: ["TDS_DISCLOSURE", "NHD_REPORT"], CO: [] }
    precision: "set cardinality"

  - name: subscription_commitment
    trigger: "POST /tc/files with billing_model == SUBSCRIPTION"
    algorithm: threshold
    formula: |
      committed_within_quota = (subscription.included_files_used < subscription.included_files_quota)
      evaluated BEFORE this file's commitment is applied
      Then: included_files_used += 1; subscription.version += 1
      Boundary: when included_files_used == included_files_quota exactly, the file is an OVERAGE commitment
      (the check is strictly <, not <=). The committed_within_quota flag is frozen on the file and reused by
      file_fee_estimate/file_fee_final (independent of later counter movements).
    input_set: "the Subscription row"
    constants: {}
    precision: "integer counter"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per the RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path ids and body FK ids must resolve, validated left-to-right"
    error_id: "ERR_COORDINATOR_NOT_FOUND | ERR_AGENT_NOT_FOUND | ERR_TEMPLATE_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_FILE_NOT_FOUND | ERR_MILESTONE_NOT_FOUND | ERR_DEADLINE_NOT_FOUND | ERR_REMINDER_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_COMMUNICATION_NOT_FOUND | ERR_AMENDMENT_NOT_FOUND | ERR_SIGNATURE_REQUEST_NOT_FOUND | ERR_CLOSING_VERIFICATION_NOT_FOUND | ERR_INVOICE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 4
    category: auth
    check: "Ownership/scope: coordinator owns the target file/subscription/child chain; agent is a party agent of the file; signer matches signature_request.agent_id"
    error_id: "ERR_RESOURCE_NOT_OWNED | ERR_AGENT_NOT_ON_FILE | ERR_SIGNATURE_NOT_AUTHORIZED"
    http_status: 403
    applies_to: "mutating endpoints on owned resources"

  - priority: 5
    category: state
    check: "OCC: expected_*_version fields must equal the parent entity's current version"
    error_id: "ERR_STALE_FILE_VERSION | ERR_STALE_SUBSCRIPTION_VERSION"
    http_status: 412
    applies_to: "POST /tc/amendments; POST /tc/files (SUBSCRIPTION billing)"

  - priority: 6
    category: state
    check: "Target entity must be in the required state for the transition"
    error_id: "ERR_FILE_NOT_DRAFT | ERR_FILE_NOT_ACTIVE | ERR_FILE_NOT_PENDING_CLOSE | ERR_FILE_NOT_CLOSED | ERR_FILE_ALREADY_TERMINAL | ERR_MILESTONE_INVALID_STATE | ERR_DEADLINE_INVALID_STATE | ERR_DOCUMENT_INVALID_STATE | ERR_AMENDMENT_INVALID_STATE | ERR_SIGNATURE_INVALID_STATE | ERR_COMMUNICATION_INVALID_STATE | ERR_TEMPLATE_INVALID_STATE | ERR_SUBSCRIPTION_INVALID_STATE | ERR_INVOICE_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Compliance gates in fixed sub-order: (a) last_audit_status == PASS, (b) all mandatory milestones COMPLETED, (c) open_escalation_count == 0, (d) closing verification CLEAR_TO_CLOSE"
    error_id: "ERR_AUDIT_NOT_PASSED | ERR_MANDATORY_MILESTONES_OPEN | ERR_OPEN_ESCALATIONS | ERR_NOT_CLEAR_TO_CLOSE"
    http_status: 409
    applies_to: "POST /tc/files/{id}/request-close, POST /tc/files/{id}/close"

  - priority: 8
    category: business_temporal
    check: "Temporal sanity: closing_date not before current clock date (file create and activate); amendment new_closing_date not in the past; amendment effective_to strictly after effective_from; communication response_due_at strictly after current clock time"
    error_id: "ERR_CLOSING_DATE_IN_PAST | ERR_AMENDMENT_DATE_IN_PAST | ERR_INVALID_AMENDMENT_WINDOW | ERR_RESPONSE_DUE_IN_PAST"
    http_status: 422
    applies_to: "POST /tc/files, POST /tc/files/{id}/activate, POST /tc/amendments, POST /tc/communications"
    note: "ERR_INVALID_AMENDMENT_WINDOW uses http 400; the rest use 422"

  - priority: 9
    category: business_constraint
    check: "Constraint satisfaction: single ACTIVE template per (state_code, contract_type); single ACTIVE subscription per coordinator; at most one amendment in flight (ROUTED/PARTIALLY_SIGNED/FULLY_SIGNED) per file at route time; amendment effective window [from,to) must not overlap another amendment's window in ROUTED/PARTIALLY_SIGNED/FULLY_SIGNED/EFFECTIVE (half-open: back-to-back windows allowed); closing-date min gap of MIN_CLOSING_GAP_DAYS=2 between same-coordinator ACTIVE/PENDING_CLOSE files; only non-mandatory milestones waivable"
    error_id: "ERR_TEMPLATE_ALREADY_ACTIVE | ERR_SUBSCRIPTION_ALREADY_ACTIVE | ERR_AMENDMENT_IN_FLIGHT | ERR_AMENDMENT_WINDOW_OVERLAP | ERR_CLOSING_DATE_CONFLICT | ERR_MILESTONE_MANDATORY"
    http_status: 409
    applies_to: "template publish; subscription create; amendment create/route; file activate; milestone waive"

  - priority: 10
    category: business_referential
    check: "Referenced configuration must be usable: ACTIVE template exists for (state_code, contract_type) at activation; subscription exists, ACTIVE, and owned for SUBSCRIPTION billing; agent ids exist on the coordinator's roster; buyer_agent_id present iff PURCHASE_SALE"
    error_id: "ERR_TEMPLATE_NOT_FOUND | ERR_SUBSCRIPTION_INACTIVE | ERR_AGENT_NOT_FOUND | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "POST /tc/files, POST /tc/files/{id}/activate"
    note: "ERR_TEMPLATE_NOT_FOUND and ERR_AGENT_NOT_FOUND use http 404"

  - priority: 11
    category: business_fiscal
    check: "Fiscal gates: archive requires the file's Invoice in PAID status"
    error_id: ERR_INVOICE_UNPAID
    http_status: 402
    applies_to: "POST /tc/files/{id}/archive"

  - priority: 12
    category: existence
    check: "Request shape: required fields present, enum members valid, no unknown fields"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
    note: "Malformed-body checks (missing required field, bad enum, unknown field) are lowest priority: a request failing both a state check and a shape check returns the state error"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Coordinator / Agent roster ---
  - method: POST
    path: "/tc/coordinators"
    description: "Register a coordinator"
    roles: [SystemAdmin]
    code: 201
    input: [full_name, email, license_number]
    output: Coordinator
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/tc/coordinators/{coordinatorId}"
    description: "Get a coordinator"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: []
    output: Coordinator
    side_effects: []

  - method: POST
    path: "/tc/agents"
    description: "Add an agent to the acting coordinator's roster (coordinator_id taken from X-User-ID)"
    roles: [Coordinator]
    code: 201
    input: [full_name, email, brokerage]
    output: Agent
    side_effects: ["coordinator_id set from actor", "status = ACTIVE"]

  - method: GET
    path: "/tc/agents/{agentId}"
    description: "Get an agent"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: []
    output: Agent
    side_effects: []

  - method: GET
    path: "/tc/agents"
    description: "List agents, optionally by roster owner"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: ["coordinator_id?", "limit?", "offset?"]
    output: "Agent[]"
    side_effects: []

  # --- ChecklistTemplate ---
  - method: POST
    path: "/tc/checklist-templates"
    description: "Create a milestone-checklist template for a (state_code, contract_type) pair"
    roles: [SystemAdmin]
    code: 201
    input: [state_code, contract_type, milestone_defs, required_doc_types]
    output: ChecklistTemplate
    side_effects: ["status = DRAFT", "template_version = 1"]

  - method: GET
    path: "/tc/checklist-templates/{templateId}"
    description: "Get a template"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: []
    output: ChecklistTemplate
    side_effects: []

  - method: GET
    path: "/tc/checklist-templates"
    description: "List templates"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: ["state_code?", "contract_type?", "status?", "limit?", "offset?"]
    output: "ChecklistTemplate[]"
    side_effects: []

  - method: POST
    path: "/tc/checklist-templates/{templateId}/publish"
    description: "Publish a template (DRAFT → ACTIVE); enforces one ACTIVE per (state_code, contract_type)"
    roles: [SystemAdmin]
    code: 200
    input: []
    output: ChecklistTemplate
    side_effects: ["status → ACTIVE", "template_version += 1"]

  - method: POST
    path: "/tc/checklist-templates/{templateId}/retire"
    description: "Retire an ACTIVE template"
    roles: [SystemAdmin]
    code: 200
    input: []
    output: ChecklistTemplate
    side_effects: ["status → RETIRED"]

  # --- Subscription ---
  - method: POST
    path: "/tc/subscriptions"
    description: "Open a subscription for the acting coordinator (one ACTIVE per coordinator)"
    roles: [Coordinator]
    code: 201
    input: [monthly_fee_cents, included_files_quota, overage_fee_cents]
    output: Subscription
    side_effects: ["status = ACTIVE", "included_files_used = 0"]

  - method: GET
    path: "/tc/subscriptions/{subscriptionId}"
    description: "Get a subscription"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/tc/subscriptions"
    description: "List subscriptions"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: ["coordinator_id?", "status?", "limit?", "offset?"]
    output: "Subscription[]"
    side_effects: []

  - method: POST
    path: "/tc/subscriptions/{subscriptionId}/cancel"
    description: "Cancel a subscription (no ACTIVE/PENDING_CLOSE files allowed)"
    roles: [Coordinator]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status → CANCELLED"]

  # --- TransactionFile ---
  - method: POST
    path: "/tc/files"
    description: "Create a transaction file in DRAFT; SUBSCRIPTION billing commits a slot immediately (OCC on subscription.version)"
    roles: [Coordinator]
    code: 201
    input: [billing_model, state_code, contract_type, property_address, effective_date, closing_date, list_price_cents, seller_agent_id, "buyer_agent_id?", "subscription_id?", "expected_subscription_version?", "inspection_offset_days?", "appraisal_offset_days?", "financing_offset_days?"]
    output: TransactionFile
    side_effects:
      - "status = DRAFT"
      - "If billing_model == SUBSCRIPTION: OCC check expected_subscription_version == subscription.version; subscription_commitment runs (included_files_used += 1); increments Subscription.version by 1"
    note: "buyer_agent_id required iff contract_type == PURCHASE_SALE; subscription_id + expected_subscription_version required iff billing_model == SUBSCRIPTION"

  - method: GET
    path: "/tc/files/{fileId}"
    description: "Get a transaction file"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: []
    output: TransactionFile
    side_effects: []

  - method: GET
    path: "/tc/files"
    description: "List transaction files"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: ["coordinator_id?", "buyer_agent_id?", "seller_agent_id?", "subscription_id?", "template_id?", "status?", "limit?", "offset?"]
    output: "TransactionFile[]"
    side_effects: []

  - method: POST
    path: "/tc/files/{fileId}/activate"
    description: "Activate a DRAFT file: pins template, instantiates milestones/deadlines/reminders, creates DRAFT invoice with fee estimate"
    roles: [Coordinator]
    code: 200
    input: []
    output: TransactionFile
    side_effects:
      - "status → ACTIVE; see TransactionFile DRAFT→ACTIVE side effects (template pin, milestone/deadline/reminder instantiation, fee_estimate_cents, Invoice DRAFT)"

  - method: POST
    path: "/tc/files/{fileId}/terminate"
    description: "Terminate an ACTIVE/PENDING_CLOSE file with the full cancellation cascade"
    roles: [Coordinator]
    code: 200
    input: ["reason?"]
    output: TransactionFile
    side_effects:
      - "status → TERMINATED; cascades: milestones CANCELLED; deadlines CANCELLED → their QUEUED reminders CANCELLED; amendments VOIDED → their PENDING signature requests VOIDED; communications RESOLVED; invoice VOIDED with TERMINATION_CREDIT lines; eligible subscription slot release"

  - method: POST
    path: "/tc/files/{fileId}/request-close"
    description: "Request close: requires audit PASS, mandatory milestones done, no open escalations; creates ClosingVerification"
    roles: [Coordinator]
    code: 200
    input: []
    output: TransactionFile
    side_effects: ["status → PENDING_CLOSE", "ClosingVerification created (lender_status NOT_REQUIRED for cash files)"]

  - method: POST
    path: "/tc/files/{fileId}/close"
    description: "Close a file once CLEAR_TO_CLOSE; finalizes fee and issues invoice"
    roles: [Coordinator]
    code: 200
    input: []
    output: TransactionFile
    side_effects: ["status → CLOSED", "fee_final_cents computed", "Invoice rebuilt → ISSUED"]

  - method: POST
    path: "/tc/files/{fileId}/archive"
    description: "Archive a CLOSED file whose invoice is PAID (post-close archive)"
    roles: [Coordinator]
    code: 200
    input: []
    output: TransactionFile
    side_effects: ["status → ARCHIVED", "archived_at set"]

  - method: POST
    path: "/tc/files/{fileId}/compliance-audit"
    description: "Run the compliance file audit; sets last_audit_status"
    roles: [Coordinator]
    code: 200
    input: []
    output: "{ result: string, missing_doc_types: string[] }"
    side_effects: ["file.last_audit_status = result"]

  # --- Milestone ---
  - method: GET
    path: "/tc/milestones/{milestoneId}"
    description: "Get a milestone"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: []
    output: Milestone
    side_effects: []

  - method: GET
    path: "/tc/milestones"
    description: "List milestones"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: ["file_id?", "status?", "name?", "limit?", "offset?"]
    output: "Milestone[]"
    side_effects: []

  - method: POST
    path: "/tc/milestones/{milestoneId}/start"
    description: "Start a PENDING milestone"
    roles: [Coordinator]
    code: 200
    input: []
    output: Milestone
    side_effects: ["status → IN_PROGRESS"]

  - method: POST
    path: "/tc/milestones/{milestoneId}/complete"
    description: "Complete an IN_PROGRESS or OVERDUE milestone (late_completion flagged from OVERDUE)"
    roles: [Coordinator]
    code: 200
    input: []
    output: Milestone
    side_effects: ["status → COMPLETED", "completed_at set", "late_completion computed"]

  - method: POST
    path: "/tc/milestones/{milestoneId}/waive"
    description: "Waive a non-mandatory milestone"
    roles: [Coordinator]
    code: 200
    input: []
    output: Milestone
    side_effects: ["status → WAIVED"]

  # --- Deadline ---
  - method: GET
    path: "/tc/deadlines/{deadlineId}"
    description: "Get a deadline"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: []
    output: Deadline
    side_effects: []

  - method: GET
    path: "/tc/deadlines"
    description: "List deadlines"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: ["file_id?", "kind?", "status?", "limit?", "offset?"]
    output: "Deadline[]"
    side_effects: []

  - method: POST
    path: "/tc/deadlines/{deadlineId}/mark-met"
    description: "Mark a PENDING deadline met; cancels its QUEUED reminders"
    roles: [Coordinator]
    code: 200
    input: []
    output: Deadline
    side_effects: ["status → MET", "met_at set", "QUEUED reminders → CANCELLED"]

  - method: POST
    path: "/tc/deadlines/{deadlineId}/waive"
    description: "Waive a PENDING deadline; cancels its QUEUED reminders"
    roles: [Coordinator]
    code: 200
    input: []
    output: Deadline
    side_effects: ["status → WAIVED", "QUEUED reminders → CANCELLED"]

  # --- Reminder ---
  - method: GET
    path: "/tc/reminders/{reminderId}"
    description: "Get a reminder"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: []
    output: Reminder
    side_effects: []

  - method: GET
    path: "/tc/reminders"
    description: "List reminders"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: ["deadline_id?", "status?", "limit?", "offset?"]
    output: "Reminder[]"
    side_effects: []

  # --- Document ---
  - method: POST
    path: "/tc/documents"
    description: "Request a document on a file (creates REQUESTED)"
    roles: [Coordinator]
    code: 201
    input: [file_id, doc_type]
    output: Document
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/tc/documents/{documentId}"
    description: "Get a document"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: []
    output: Document
    side_effects: []

  - method: GET
    path: "/tc/documents"
    description: "List documents"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: ["file_id?", "doc_type?", "status?", "submitted_by_agent_id?", "limit?", "offset?"]
    output: "Document[]"
    side_effects: []

  - method: POST
    path: "/tc/documents/{documentId}/submit"
    description: "Party agent submits a REQUESTED or REJECTED document (resubmission bumps review_round)"
    roles: [Agent]
    code: 200
    input: []
    output: Document
    side_effects: ["status → RECEIVED", "submitted_by_agent_id set", "file.last_audit_status → NONE"]

  - method: POST
    path: "/tc/documents/{documentId}/accept"
    description: "Accept a RECEIVED document"
    roles: [Coordinator]
    code: 200
    input: []
    output: Document
    side_effects: ["status → ACCEPTED", "file.last_audit_status → NONE"]

  - method: POST
    path: "/tc/documents/{documentId}/reject"
    description: "Reject a RECEIVED document with a reason"
    roles: [Coordinator]
    code: 200
    input: [reason]
    output: Document
    side_effects: ["status → REJECTED", "reject_reason set", "file.last_audit_status → NONE"]

  # --- CommunicationEntry ---
  - method: POST
    path: "/tc/communications"
    description: "Log a party communication; in_reply_to_id answers an OPEN entry"
    roles: [Coordinator, Agent]
    code: 201
    input: [file_id, party, direction, body, "requires_response?", "response_due_at?", "in_reply_to_id?"]
    output: CommunicationEntry
    side_effects: ["status = OPEN", "if in_reply_to_id references an OPEN entry: that entry → ANSWERED"]

  - method: GET
    path: "/tc/communications/{communicationId}"
    description: "Get a communication entry"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: []
    output: CommunicationEntry
    side_effects: []

  - method: GET
    path: "/tc/communications"
    description: "List communication entries"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: ["file_id?", "status?", "in_reply_to_id?", "limit?", "offset?"]
    output: "CommunicationEntry[]"
    side_effects: []

  - method: POST
    path: "/tc/communications/{communicationId}/resolve"
    description: "Resolve an OPEN or ESCALATED entry (ESCALATED resolution decrements the file's open_escalation_count)"
    roles: [Coordinator]
    code: 200
    input: []
    output: CommunicationEntry
    side_effects: ["status → RESOLVED", "file.open_escalation_count -= 1 when previously ESCALATED"]

  # --- Amendment ---
  - method: POST
    path: "/tc/amendments"
    description: "Draft an amendment against a file (OCC on file.version; supersedes an existing DRAFT amendment by voiding it)"
    roles: [Coordinator]
    code: 201
    input: [file_id, expected_file_version, effective_from, effective_to, "new_effective_date?", "new_closing_date?", "new_list_price_cents?"]
    output: Amendment
    side_effects:
      - "OCC check expected_file_version == file.version (ERR_STALE_FILE_VERSION)"
      - "status = DRAFT, round_number = 1"
      - "Existing DRAFT amendment on the same file (if any) → VOIDED"
      - "increments TransactionFile.version by 1"
      - "Window overlap check vs amendments in ROUTED/PARTIALLY_SIGNED/FULLY_SIGNED/EFFECTIVE (ERR_AMENDMENT_WINDOW_OVERLAP)"

  - method: GET
    path: "/tc/amendments/{amendmentId}"
    description: "Get an amendment"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: []
    output: Amendment
    side_effects: []

  - method: GET
    path: "/tc/amendments"
    description: "List amendments"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: ["file_id?", "status?", "limit?", "offset?"]
    output: "Amendment[]"
    side_effects: []

  - method: POST
    path: "/tc/amendments/{amendmentId}/route"
    description: "Route a DRAFT amendment for signature; creates the round's SignatureRequests"
    roles: [Coordinator]
    code: 200
    input: []
    output: Amendment
    side_effects: ["status → ROUTED", "SignatureRequests created per contract_type signer set"]

  - method: POST
    path: "/tc/amendments/{amendmentId}/revise"
    description: "Revise a REJECTED amendment back to DRAFT (round_number += 1)"
    roles: [Coordinator]
    code: 200
    input: []
    output: Amendment
    side_effects: ["status → DRAFT", "round_number += 1"]

  - method: POST
    path: "/tc/amendments/{amendmentId}/apply"
    description: "Apply a FULLY_SIGNED amendment: updates file fields and cascades date recomputation to milestones, deadlines, reminders"
    roles: [Coordinator]
    code: 200
    input: []
    output: Amendment
    side_effects: ["status → EFFECTIVE", "file fields updated", "milestone/deadline due dates recomputed", "QUEUED reminders regenerated"]

  - method: POST
    path: "/tc/amendments/{amendmentId}/void"
    description: "Void a non-terminal amendment"
    roles: [Coordinator]
    code: 200
    input: []
    output: Amendment
    side_effects: ["status → VOIDED", "PENDING SignatureRequests → VOIDED"]

  # --- SignatureRequest ---
  - method: GET
    path: "/tc/signature-requests/{signatureRequestId}"
    description: "Get a signature request"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: []
    output: SignatureRequest
    side_effects: []

  - method: GET
    path: "/tc/signature-requests"
    description: "List signature requests"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: ["amendment_id?", "agent_id?", "status?", "round_number?", "limit?", "offset?"]
    output: "SignatureRequest[]"
    side_effects: []

  - method: POST
    path: "/tc/signature-requests/{signatureRequestId}/sign"
    description: "Sign a PENDING signature request (must be the designated agent)"
    roles: [Agent]
    code: 200
    input: []
    output: SignatureRequest
    side_effects: ["status → SIGNED", "amendment auto-transition PARTIALLY_SIGNED / FULLY_SIGNED"]

  - method: POST
    path: "/tc/signature-requests/{signatureRequestId}/decline"
    description: "Decline a PENDING signature request; rejects the amendment round"
    roles: [Agent]
    code: 200
    input: ["reason?"]
    output: SignatureRequest
    side_effects: ["status → DECLINED", "amendment → REJECTED", "remaining round requests → VOIDED"]

  # --- ClosingVerification ---
  - method: GET
    path: "/tc/closing-verifications/{closingVerificationId}"
    description: "Get a closing verification"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: []
    output: ClosingVerification
    side_effects: []

  - method: GET
    path: "/tc/closing-verifications"
    description: "List closing verifications (file_id filter returns array of length 0 or 1)"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: ["file_id?", "limit?", "offset?"]
    output: "ClosingVerification[]"
    side_effects: []

  - method: POST
    path: "/tc/closing-verifications/{closingVerificationId}/confirm-title"
    description: "Title representative confirms title clear (segregated from coordinator and lender roles)"
    roles: [TitleRep]
    code: 200
    input: []
    output: ClosingVerification
    side_effects: ["title_status → CLEARED", "overall_status recomputed (→ CLEAR_TO_CLOSE when lender side satisfied)"]

  - method: POST
    path: "/tc/closing-verifications/{closingVerificationId}/confirm-lender"
    description: "Lender representative confirms clear-to-close from the lender side"
    roles: [LenderRep]
    code: 200
    input: []
    output: ClosingVerification
    side_effects: ["lender_status PENDING → CLEAR_TO_CLOSE", "overall_status recomputed"]

  # --- Invoice ---
  - method: GET
    path: "/tc/invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/tc/invoices"
    description: "List invoices (file_id filter returns array of length 0 or 1)"
    roles: [SystemAdmin, Coordinator, Agent, TitleRep, LenderRep]
    code: 200
    input: ["file_id?", "subscription_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/tc/invoices/{invoiceId}/issue"
    description: "Manually issue a DRAFT invoice while the file is ACTIVE or CLOSED"
    roles: [Coordinator]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → ISSUED", "issued_at set"]

  - method: POST
    path: "/tc/invoices/{invoiceId}/mark-paid"
    description: "Mark an ISSUED invoice paid"
    roles: [Coordinator]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → PAID"]

  # --- Test-driving logical clock ---
  - method: POST
    path: "/tc/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Advancing the clock processes, in order: due Reminders (QUEUED → SENT where scheduled_at <= now and deadline PENDING), Deadline expiries (PENDING → EXPIRED with escalation cascade), Milestone overdue transitions, and CommunicationEntry escalations."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ reminders_sent: integer, deadlines_expired: integer, milestones_marked_overdue: integer, communications_escalated: integer }"
    side_effects: ["time-based system transitions fire in the pinned order"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_RESOURCE_NOT_OWNED, http: 403, condition: "Coordinator attempts to mutate a file/subscription/child resource owned by another coordinator" }
  - { id: ERR_AGENT_NOT_ON_FILE, http: 403, condition: "Agent submits a document on a file where the agent is neither buyer_agent_id nor seller_agent_id" }
  - { id: ERR_SIGNATURE_NOT_AUTHORIZED, http: 403, condition: "Signing agent's X-User-ID does not match signature_request.agent_id" }

  # --- existence ---
  - { id: ERR_COORDINATOR_NOT_FOUND, http: 404, condition: "Coordinator id does not resolve" }
  - { id: ERR_AGENT_NOT_FOUND, http: 404, condition: "Agent id does not resolve" }
  - { id: ERR_TEMPLATE_NOT_FOUND, http: 404, condition: "Template id does not resolve, or no ACTIVE template exists for the file's (state_code, contract_type) at activation" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "Subscription id does not resolve" }
  - { id: ERR_FILE_NOT_FOUND, http: 404, condition: "TransactionFile id does not resolve" }
  - { id: ERR_MILESTONE_NOT_FOUND, http: 404, condition: "Milestone id does not resolve" }
  - { id: ERR_DEADLINE_NOT_FOUND, http: 404, condition: "Deadline id does not resolve" }
  - { id: ERR_REMINDER_NOT_FOUND, http: 404, condition: "Reminder id does not resolve" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "Document id does not resolve" }
  - { id: ERR_COMMUNICATION_NOT_FOUND, http: 404, condition: "CommunicationEntry id does not resolve" }
  - { id: ERR_AMENDMENT_NOT_FOUND, http: 404, condition: "Amendment id does not resolve" }
  - { id: ERR_SIGNATURE_REQUEST_NOT_FOUND, http: 404, condition: "SignatureRequest id does not resolve" }
  - { id: ERR_CLOSING_VERIFICATION_NOT_FOUND, http: 404, condition: "ClosingVerification id does not resolve" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not resolve" }

  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, unknown field, buyer_agent_id missing on PURCHASE_SALE, or reject without reason" }

  # --- OCC ---
  - { id: ERR_STALE_FILE_VERSION, http: 412, condition: "expected_file_version does not match TransactionFile.version on amendment creation" }
  - { id: ERR_STALE_SUBSCRIPTION_VERSION, http: 412, condition: "expected_subscription_version does not match Subscription.version on SUBSCRIPTION file creation" }

  # --- state ---
  - { id: ERR_FILE_NOT_DRAFT, http: 409, condition: "Activation requires file in DRAFT" }
  - { id: ERR_FILE_NOT_ACTIVE, http: 409, condition: "Operation requires file in ACTIVE (or ACTIVE/PENDING_CLOSE where stated)" }
  - { id: ERR_FILE_NOT_PENDING_CLOSE, http: 409, condition: "Close requires file in PENDING_CLOSE" }
  - { id: ERR_FILE_NOT_CLOSED, http: 409, condition: "Archive requires file in CLOSED" }
  - { id: ERR_FILE_ALREADY_TERMINAL, http: 409, condition: "Operation targets a file in a terminal state (ARCHIVED or TERMINATED)" }
  - { id: ERR_MILESTONE_INVALID_STATE, http: 409, condition: "Milestone not in a state that allows the requested transition" }
  - { id: ERR_DEADLINE_INVALID_STATE, http: 409, condition: "Deadline not PENDING for mark-met/waive" }
  - { id: ERR_DOCUMENT_INVALID_STATE, http: 409, condition: "Document not in a state that allows the requested transition" }
  - { id: ERR_AMENDMENT_INVALID_STATE, http: 409, condition: "Amendment not in a state that allows the requested transition" }
  - { id: ERR_SIGNATURE_INVALID_STATE, http: 409, condition: "SignatureRequest not PENDING" }
  - { id: ERR_COMMUNICATION_INVALID_STATE, http: 409, condition: "CommunicationEntry not in OPEN or ESCALATED for resolve, or reply target not OPEN" }
  - { id: ERR_TEMPLATE_INVALID_STATE, http: 409, condition: "Template not in the state required for publish/retire" }
  - { id: ERR_SUBSCRIPTION_INVALID_STATE, http: 409, condition: "Subscription not ACTIVE for cancel" }
  - { id: ERR_INVOICE_INVALID_STATE, http: 409, condition: "Invoice not in the state required for issue/mark-paid" }

  # --- business safety (compliance gates) ---
  - { id: ERR_AUDIT_NOT_PASSED, http: 409, condition: "request-close requires last_audit_status == PASS" }
  - { id: ERR_MANDATORY_MILESTONES_OPEN, http: 409, condition: "request-close requires every mandatory milestone COMPLETED" }
  - { id: ERR_OPEN_ESCALATIONS, http: 409, condition: "request-close requires open_escalation_count == 0" }
  - { id: ERR_NOT_CLEAR_TO_CLOSE, http: 409, condition: "close requires ClosingVerification.overall_status == CLEAR_TO_CLOSE" }

  # --- business temporal ---
  - { id: ERR_CLOSING_DATE_IN_PAST, http: 422, condition: "closing_date before current clock date at file create or activate" }
  - { id: ERR_AMENDMENT_DATE_IN_PAST, http: 422, condition: "amendment new_closing_date before current clock date" }
  - { id: ERR_INVALID_AMENDMENT_WINDOW, http: 400, condition: "amendment effective_to not strictly after effective_from" }
  - { id: ERR_RESPONSE_DUE_IN_PAST, http: 422, condition: "communication response_due_at not strictly after current clock time" }

  # --- business constraint ---
  - { id: ERR_TEMPLATE_ALREADY_ACTIVE, http: 409, condition: "Another ACTIVE template exists for the same (state_code, contract_type)" }
  - { id: ERR_SUBSCRIPTION_ALREADY_ACTIVE, http: 409, condition: "Coordinator already has an ACTIVE subscription" }
  - { id: ERR_AMENDMENT_IN_FLIGHT, http: 409, condition: "Another amendment of the file is ROUTED, PARTIALLY_SIGNED, or FULLY_SIGNED at route time" }
  - { id: ERR_AMENDMENT_WINDOW_OVERLAP, http: 409, condition: "Amendment effective window [effective_from, effective_to) overlaps a window of another amendment in ROUTED/PARTIALLY_SIGNED/FULLY_SIGNED/EFFECTIVE on the same file; half-open semantics: sharing exactly one boundary date is allowed" }
  - { id: ERR_CLOSING_DATE_CONFLICT, http: 409, condition: "Another ACTIVE/PENDING_CLOSE file of the same coordinator has a closing_date less than MIN_CLOSING_GAP_DAYS=2 days away (difference 0 or 1 day conflicts; 2 or more is allowed)" }
  - { id: ERR_MILESTONE_MANDATORY, http: 409, condition: "Waive attempted on a mandatory milestone" }
  - { id: ERR_SUBSCRIPTION_HAS_ACTIVE_FILES, http: 409, condition: "Subscription cancel attempted while files are ACTIVE or PENDING_CLOSE" }
  - { id: ERR_SUBSCRIPTION_INACTIVE, http: 409, condition: "SUBSCRIPTION billing references a missing, cancelled, or unowned subscription" }

  # --- business fiscal ---
  - { id: ERR_INVOICE_UNPAID, http: 402, condition: "Archive requires the file's Invoice in PAID status" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator: manages coordinators, checklist templates, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /tc/coordinators"
      - "POST /tc/checklist-templates, POST /tc/checklist-templates/{id}/publish, POST /tc/checklist-templates/{id}/retire"
      - "POST /tc/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: Coordinator
    description: "Independent transaction coordinator; owns files, roster, subscription, and all file lifecycle actions"
    identity: "entity_backed:Coordinator"
    exclusive_operations:
      - "POST /tc/agents"
      - "POST /tc/subscriptions, POST /tc/subscriptions/{id}/cancel"
      - "POST /tc/files and all POST /tc/files/{id}/* lifecycle actions including compliance-audit"
      - "POST /tc/milestones/{id}/start|complete|waive, POST /tc/deadlines/{id}/mark-met|waive"
      - "POST /tc/documents, POST /tc/documents/{id}/accept|reject"
      - "POST /tc/communications/{id}/resolve"
      - "POST /tc/amendments and all POST /tc/amendments/{id}/* actions"
      - "POST /tc/invoices/{id}/issue|mark-paid"
    shared_operations:
      - "POST /tc/communications (shared with Agent)"
      - "All GET endpoints"

  - name: Agent
    description: "Buyer or seller agent attached to files; submits documents and signs amendments"
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /tc/documents/{id}/submit"
      - "POST /tc/signature-requests/{id}/sign, POST /tc/signature-requests/{id}/decline"
    shared_operations:
      - "POST /tc/communications (shared with Coordinator)"
      - "All GET endpoints"

  - name: TitleRep
    description: "Title company representative; confirms title clearance (segregated from coordinator and lender duties)"
    identity: opaque
    exclusive_operations:
      - "POST /tc/closing-verifications/{id}/confirm-title"
    shared_operations:
      - "All GET endpoints"

  - name: LenderRep
    description: "Lender representative; confirms lender clear-to-close (segregated from coordinator and title duties)"
    identity: opaque
    exclusive_operations:
      - "POST /tc/closing-verifications/{id}/confirm-lender"
    shared_operations:
      - "All GET endpoints"
