scenario: |
  248. Private Adoption Agency: home study, birth-parent matching, consent/relinquishment timeline,
  ICPC interstate clearance, placement & finalization, post-placement visits, expense tracking/escrow,
  agency fee

domain_name: private-adoption-agency
api_prefix: ""   # flat topology: many top-level peer collections (/cases, /home-studies, /matches, ...) linked by FK

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys. Adoption Case is the hub; HomeStudy,
  # Match, ConsentRecord, IcpcClearance, Placement, PostPlacementVisit,
  # ExpenseEntry, AgencyFeeInvoice all reference it by FK, not by URL nesting.

  state_machine_shape: cyclic
  # ConsentRecord supports REVOKED (within revocation window) and re-collection;
  # HomeStudy supports a revision loop (DEFICIENT -> RESUBMITTED -> UNDER_REVIEW);
  # AdoptionCase is compound (its phase is gated by child entity states); ICPC
  # is branching with revert.

  relationship_patterns:
    - one_to_many        # AdoptionCase has many ExpenseEntry, PostPlacementVisit, ConsentRecord
    - cross_aggregate    # Placement transition gated by ConsentRecord + IcpcClearance + HomeStudy state
    - self_referential   # ConsentRecord.supersedes_consent_id points to a prior revoked consent

  role_model: segregation_of_duties
  # A Caseworker authoring a HomeStudy recommendation cannot be the Supervisor who
  # approves it; the Caseworker who logs an expense cannot be the FinanceOfficer
  # who disburses escrow against it.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agency legal name" }
      - { name: licensed_state, type: string, source: input, description: "Two-letter state code where the agency is licensed (e.g. CA)" }
      - { name: fee_schedule_cents, type: integer, source: input, description: "Base agency placement fee in cents, before sliding-scale adjustment", constraints: ">= 0" }
      - { name: current_utc, type: datetime, source: system, description: "Deterministic agency clock; advances only via POST /_clock/set_current_utc; defaults to creation time" }

  - name: AdoptionCase
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id" }
      - { name: case_label, type: string, source: input, description: "Human-readable case reference label" }
      - { name: child_state, type: string, source: input, description: "Two-letter state code where the child currently resides (ICPC sending state)" }
      - { name: family_state, type: string, source: input, description: "Two-letter state code where the adoptive family resides (ICPC receiving state)" }
      - { name: phase, type: enum, source: computed, default: INTAKE, description: "Compound phase derived from child entity states: INTAKE | HOME_STUDY | MATCHED | CONSENTED | ICPC_CLEARED | PLACED | FINALIZED | DISRUPTED; constraints: one of {INTAKE,HOME_STUDY,MATCHED,CONSENTED,ICPC_CLEARED,PLACED,FINALIZED,DISRUPTED}" }
      - { name: escrow_balance_cents, type: integer, source: computed, default: 0, description: "Derived: total escrow deposits minus disbursements minus refunds for this case" }
      - { name: reimbursable_expense_cents, type: integer, source: computed, default: 0, description: "Derived: sum of APPROVED ExpenseEntry.amount_cents for this case" }
      - { name: interstate, type: boolean, source: computed, default: false, description: "Derived: true when child_state != family_state (ICPC required)" }

  - name: AdoptiveFamily
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> AdoptionCase.id" }
      - { name: primary_applicant_name, type: string, source: input, description: "Primary applicant full name" }
      - { name: residence_state, type: string, source: input, description: "Two-letter state code of family residence" }
      - { name: household_size, type: integer, source: input, description: "Number of persons in the household", constraints: ">= 1" }
      - { name: annual_income_cents, type: integer, source: input, description: "Combined annual household income in cents; feeds sliding-scale fee", constraints: ">= 0" }

  - name: HomeStudy
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> AdoptionCase.id" }
      - { name: family_id, type: string, source: input, description: "FK -> AdoptiveFamily.id" }
      - { name: authoring_caseworker_id, type: string, source: system, description: "X-User-ID of the Caseworker who created the study" }
      - { name: approving_supervisor_id, type: string, source: system, default: null, description: "X-User-ID of the Supervisor who approved; null until approved" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Agency-clock timestamp set when study reaches APPROVED" }
      - { name: expires_at, type: datetime, source: computed, default: null, description: "Derived: completed_at + VALIDITY_DAYS; null until APPROVED" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of times the study has cycled back to DEFICIENT" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> UNDER_REVIEW -> APPROVED | DEFICIENT; DEFICIENT -> RESUBMITTED -> UNDER_REVIEW (revision loop); constraints: one of {DRAFT,UNDER_REVIEW,RESUBMITTED,DEFICIENT,APPROVED,EXPIRED}" }

  - name: BirthParent
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id" }
      - { name: legal_name, type: string, source: input, description: "Birth parent legal name" }
      - { name: birth_state, type: string, source: input, description: "Two-letter state code where birth occurs / child resides at birth" }
      - { name: parent_role, type: enum, source: input, description: "BIRTH_MOTHER | BIRTH_FATHER | LEGAL_GUARDIAN" }

  - name: CounselingSession
    parent: null
    common_fields: true
    fields:
      - { name: birth_parent_id, type: string, source: input, description: "FK -> BirthParent.id" }
      - { name: case_id, type: string, source: input, description: "FK -> AdoptionCase.id" }
      - { name: counselor_id, type: string, source: system, description: "X-User-ID of the Caseworker conducting counseling" }
      - { name: start_at, type: datetime, source: input, description: "Session start instant (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Session end instant (exclusive)" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED -> HELD | CANCELLED; constraints: one of {BOOKED,HELD,CANCELLED}" }

  - name: Match
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> AdoptionCase.id" }
      - { name: family_id, type: string, source: input, description: "FK -> AdoptiveFamily.id" }
      - { name: birth_parent_id, type: string, source: input, description: "FK -> BirthParent.id" }
      - { name: proposed_by_caseworker_id, type: string, source: system, description: "X-User-ID of proposing Caseworker" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED -> ACCEPTED | DECLINED; ACCEPTED -> DISSOLVED; constraints: one of {PROPOSED,ACCEPTED,DECLINED,DISSOLVED}" }

  - name: ConsentRecord
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> AdoptionCase.id" }
      - { name: birth_parent_id, type: string, source: input, description: "FK -> BirthParent.id" }
      - { name: supersedes_consent_id, type: string, source: input, required: false, description: "FK -> ConsentRecord.id; set when this record re-collects consent after a prior REVOKED record" }
      - { name: child_dob, type: datetime, source: input, description: "Child date of birth; consent cannot be signed before birth + MIN_HOURS_AFTER_BIRTH" }
      - { name: signed_at, type: datetime, source: system, default: null, description: "Agency-clock timestamp when consent moved to SIGNED" }
      - { name: revocation_deadline, type: datetime, source: computed, default: null, description: "Derived: last instant revocation is permitted; depends on revocation_basis variant" }
      - { name: revocation_basis, type: enum, source: input, description: "Which deadline rule applies: CALENDAR_DAYS | BUSINESS_DAYS" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> SIGNED -> IRREVOCABLE; SIGNED -> REVOKED (within window); constraints: one of {PENDING,SIGNED,REVOKED,IRREVOCABLE}" }

  - name: IcpcClearance
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> AdoptionCase.id" }
      - { name: sending_state, type: string, source: system, description: "Copied from AdoptionCase.child_state at creation" }
      - { name: receiving_state, type: string, source: system, description: "Copied from AdoptionCase.family_state at creation" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Agency-clock timestamp when packet submitted to sending-state compact administrator" }
      - { name: status, type: enum, source: system, default: NOT_REQUIRED, description: "NOT_REQUIRED | DRAFT -> SUBMITTED -> SENDING_APPROVED -> RECEIVING_APPROVED | REJECTED; REJECTED -> DRAFT (rework); constraints: one of {NOT_REQUIRED,DRAFT,SUBMITTED,SENDING_APPROVED,RECEIVING_APPROVED,REJECTED}" }

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> AdoptionCase.id" }
      - { name: family_id, type: string, source: input, description: "FK -> AdoptiveFamily.id" }
      - { name: required_visits, type: integer, source: computed, description: "Derived: REQUIRED_VISITS_INTERSTATE if case.interstate else REQUIRED_VISITS_INSTATE" }
      - { name: completed_visit_count, type: integer, source: computed, default: 0, description: "Derived: count of PostPlacementVisit in COMPLETED status for this case" }
      - { name: placed_at, type: datetime, source: system, default: null, description: "Agency-clock timestamp when child placed in the home" }
      - { name: finalized_at, type: datetime, source: system, default: null, description: "Agency-clock timestamp of court finalization" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> ACTIVE -> FINALIZED; ACTIVE -> DISRUPTED; constraints: one of {PENDING,ACTIVE,FINALIZED,DISRUPTED}" }

  - name: PostPlacementVisit
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> AdoptionCase.id" }
      - { name: placement_id, type: string, source: input, description: "FK -> Placement.id" }
      - { name: visiting_caseworker_id, type: string, source: system, description: "X-User-ID of the Caseworker conducting the visit" }
      - { name: window_start, type: datetime, source: input, description: "Start of the scheduled visit window (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "End of the scheduled visit window (exclusive)" }
      - { name: conducted_at, type: datetime, source: system, default: null, description: "Agency-clock timestamp when visit marked COMPLETED" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> COMPLETED | MISSED; constraints: one of {SCHEDULED,COMPLETED,MISSED}" }

  - name: ExpenseEntry
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> AdoptionCase.id" }
      - { name: logged_by_caseworker_id, type: string, source: system, description: "X-User-ID of the Caseworker who logged the expense" }
      - { name: approved_by_finance_id, type: string, source: system, default: null, description: "X-User-ID of the FinanceOfficer who approved; null until approved" }
      - { name: category, type: enum, source: input, description: "MEDICAL | LEGAL | LIVING | COUNSELING | TRAVEL | OTHER" }
      - { name: amount_cents, type: integer, source: input, description: "Expense amount in cents", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: LOGGED, description: "LOGGED -> APPROVED | REJECTED; APPROVED -> DISBURSED; constraints: one of {LOGGED,APPROVED,REJECTED,DISBURSED}" }

  - name: EscrowTransaction
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> AdoptionCase.id" }
      - { name: expense_id, type: string, source: input, required: false, description: "FK -> ExpenseEntry.id; set for DISBURSEMENT transactions tied to an approved expense" }
      - { name: txn_type, type: enum, source: input, description: "DEPOSIT | DISBURSEMENT | REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Transaction amount in cents", constraints: "> 0" }
      - { name: recorded_by_finance_id, type: string, source: system, description: "X-User-ID of the FinanceOfficer who recorded the transaction" }

  - name: AgencyFeeInvoice
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> AdoptionCase.id" }
      - { name: base_fee_cents, type: integer, source: computed, description: "Derived: agency.fee_schedule_cents at issuance" }
      - { name: sliding_scale_pct, type: number, source: computed, description: "Derived: discount/surcharge fraction from family income band" }
      - { name: total_due_cents, type: integer, source: computed, description: "Derived: combinatorial fee total; see calculations.agency_fee_total" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED -> PAID | VOID; constraints: one of {ISSUED,PAID,VOID}" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: HomeStudy
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /home-studies/{id}/submit"
        actor: Caseworker
        preconditions:
          - "study.status == DRAFT"
          - "acting Caseworker.id == study.authoring_caseworker_id"
        side_effects:
          - "increments HomeStudy.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /home-studies/{id}/approve"
        actor: Supervisor
        preconditions:
          - "study.status IN {UNDER_REVIEW}"
          - "acting Supervisor.id != study.authoring_caseworker_id (segregation of duties)"
        side_effects:
          - "sets HomeStudy.approving_supervisor_id = acting Supervisor.id"
          - "sets HomeStudy.completed_at = agency.current_utc"
          - "recomputes HomeStudy.expires_at = completed_at + VALIDITY_DAYS (calculation home_study_expiry)"
          - "recomputes AdoptionCase.phase (bubble up: case advances toward HOME_STUDY/MATCHED per phase rule)"
          - "increments HomeStudy.version by 1"

      - from: UNDER_REVIEW
        to: DEFICIENT
        trigger: "POST /home-studies/{id}/return"
        actor: Supervisor
        preconditions:
          - "study.status == UNDER_REVIEW"
          - "acting Supervisor.id != study.authoring_caseworker_id (segregation of duties)"
        side_effects:
          - "increments HomeStudy.revision_count by 1"
          - "increments HomeStudy.version by 1"

      - from: DEFICIENT
        to: RESUBMITTED
        trigger: "POST /home-studies/{id}/resubmit"
        actor: Caseworker
        preconditions:
          - "study.status == DEFICIENT"
          - "acting Caseworker.id == study.authoring_caseworker_id"
        side_effects:
          - "increments HomeStudy.version by 1"

      - from: RESUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /home-studies/{id}/submit"
        actor: Caseworker
        preconditions:
          - "study.status == RESUBMITTED"
          - "acting Caseworker.id == study.authoring_caseworker_id"
        side_effects:
          - "increments HomeStudy.version by 1"
        note: "Cyclic revision loop: DEFICIENT -> RESUBMITTED -> UNDER_REVIEW -> {APPROVED|DEFICIENT}"

      - from: APPROVED
        to: EXPIRED
        trigger: "POST /home-studies/{id}/check-expiry (system clock past expires_at)"
        actor: system
        preconditions:
          - "study.status == APPROVED"
          - "agency.current_utc >= study.expires_at"
        side_effects:
          - "recomputes AdoptionCase.phase (bubble up: if case not yet PLACED, phase reverts toward HOME_STUDY)"
          - "increments HomeStudy.version by 1"

  - entity: Match
    initial_state: PROPOSED
    terminal_states: [DECLINED, DISSOLVED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /matches/{id}/accept"
        actor: Supervisor
        preconditions:
          - "match.status == PROPOSED"
          - "the case's HomeStudy.status == APPROVED (cross-entity: Match->HomeStudy)"
          - "agency.current_utc < that HomeStudy.expires_at"
        side_effects:
          - "recomputes AdoptionCase.phase (bubble up: case advances to MATCHED)"
          - "increments Match.version by 1"

      - from: PROPOSED
        to: DECLINED
        trigger: "POST /matches/{id}/decline"
        actor: Supervisor
        preconditions:
          - "match.status == PROPOSED"
        side_effects:
          - "increments Match.version by 1"

      - from: ACCEPTED
        to: DISSOLVED
        trigger: "POST /matches/{id}/dissolve"
        actor: Supervisor
        preconditions:
          - "match.status == ACCEPTED"
          - "no ConsentRecord for this case is in IRREVOCABLE status (cross-entity: Match->ConsentRecord)"
        side_effects:
          - "recomputes AdoptionCase.phase (bubble up: case reverts to HOME_STUDY)"
          - "increments Match.version by 1"

  - entity: ConsentRecord
    initial_state: PENDING
    terminal_states: [IRREVOCABLE, REVOKED]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /consent-records/{id}/sign"
        actor: Caseworker
        preconditions:
          - "consent.status == PENDING"
          - "the case has an ACCEPTED Match (cross-entity: ConsentRecord->Match)"
          - "agency.current_utc >= consent.child_dob + MIN_HOURS_AFTER_BIRTH (calculation consent_eligibility)"
        side_effects:
          - "sets ConsentRecord.signed_at = agency.current_utc"
          - "recomputes ConsentRecord.revocation_deadline (calculation revocation_deadline, variant-selected by revocation_basis)"
          - "increments ConsentRecord.version by 1"

      - from: SIGNED
        to: REVOKED
        trigger: "POST /consent-records/{id}/revoke"
        actor: Caseworker
        preconditions:
          - "consent.status == SIGNED"
          - "agency.current_utc <= consent.revocation_deadline (boundary: <=, the deadline instant is still revocable)"
        side_effects:
          - "if the case has an ACTIVE Placement, transitions Placement PENDING/ACTIVE -> DISRUPTED (cascade hop 1)"
          - "that Placement disruption transitions all SCHEDULED PostPlacementVisit -> MISSED (cascade hop 2)"
          - "recomputes AdoptionCase.phase (bubble up: case -> DISRUPTED)"
          - "increments ConsentRecord.version by 1"

      - from: SIGNED
        to: IRREVOCABLE
        trigger: "POST /consent-records/{id}/finalize-consent (system clock past revocation_deadline)"
        actor: system
        preconditions:
          - "consent.status == SIGNED"
          - "agency.current_utc > consent.revocation_deadline (boundary: strictly greater)"
        side_effects:
          - "recomputes AdoptionCase.phase (bubble up: with an IRREVOCABLE consent the case advances to CONSENTED per calculation case_phase, unless a later milestone already applies)"
          - "increments ConsentRecord.version by 1"

  - entity: IcpcClearance
    initial_state: NOT_REQUIRED
    terminal_states: [RECEIVING_APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /icpc-clearances/{id}/submit"
        actor: Caseworker
        preconditions:
          - "clearance.status == DRAFT"
          - "the case has an ACCEPTED Match (cross-entity: IcpcClearance->Match)"
          - "case.interstate == true"
        side_effects:
          - "sets IcpcClearance.submitted_at = agency.current_utc"
          - "increments IcpcClearance.version by 1"

      - from: SUBMITTED
        to: SENDING_APPROVED
        trigger: "POST /icpc-clearances/{id}/approve-sending"
        actor: CompactAdministrator
        preconditions:
          - "clearance.status == SUBMITTED"
        side_effects:
          - "increments IcpcClearance.version by 1"

      - from: SENDING_APPROVED
        to: RECEIVING_APPROVED
        trigger: "POST /icpc-clearances/{id}/approve-receiving"
        actor: CompactAdministrator
        preconditions:
          - "clearance.status == SENDING_APPROVED"
        side_effects:
          - "recomputes AdoptionCase.phase (bubble up: case advances to ICPC_CLEARED)"
          - "increments IcpcClearance.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /icpc-clearances/{id}/reject"
        actor: CompactAdministrator
        preconditions:
          - "clearance.status IN {SUBMITTED, SENDING_APPROVED}"
        side_effects:
          - "increments IcpcClearance.version by 1"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /icpc-clearances/{id}/rework"
        actor: Caseworker
        preconditions:
          - "clearance.status == REJECTED"
        side_effects:
          - "clears IcpcClearance.submitted_at = null"
          - "increments IcpcClearance.version by 1"
        note: "Branch-with-revert: REJECTED -> DRAFT for rework, then re-submission."

  - entity: Placement
    initial_state: PENDING
    terminal_states: [FINALIZED, DISRUPTED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /placements/{id}/activate"
        actor: Supervisor
        preconditions:
          - "placement.status == PENDING"
          - "the case has a ConsentRecord in IRREVOCABLE status for the birth parent (cross-entity: Placement->ConsentRecord)"
          - "if case.interstate then the case's IcpcClearance.status == RECEIVING_APPROVED (cross-entity: Placement->IcpcClearance)"
          - "the case's HomeStudy.status == APPROVED and agency.current_utc < HomeStudy.expires_at (cross-entity: Placement->HomeStudy)"
        side_effects:
          - "sets Placement.placed_at = agency.current_utc"
          - "recomputes Placement.required_visits (calculation required_visit_count)"
          - "recomputes AdoptionCase.phase (bubble up: case -> PLACED)"
          - "increments Placement.version by 1"

      - from: ACTIVE
        to: FINALIZED
        trigger: "POST /placements/{id}/finalize"
        actor: Supervisor
        preconditions:
          - "placement.status == ACTIVE"
          - "placement.completed_visit_count >= placement.required_visits (boundary: >=)"
          - "no AgencyFeeInvoice for this case is in VOID status blocking finalization; an ISSUED or PAID invoice must exist"
        side_effects:
          - "sets Placement.finalized_at = agency.current_utc"
          - "recomputes AdoptionCase.phase (bubble up: case -> FINALIZED)"
          - "transitions all SIGNED ConsentRecord for this case -> IRREVOCABLE (cascade: finalization extinguishes residual revocation rights)"
          - "increments Placement.version by 1"

      - from: ACTIVE
        to: DISRUPTED
        trigger: "POST /placements/{id}/disrupt"
        actor: Supervisor
        preconditions:
          - "placement.status == ACTIVE"
        side_effects:
          - "transitions all SCHEDULED PostPlacementVisit for this placement -> MISSED (cascade hop)"
          - "recomputes AdoptionCase.phase (bubble up: case -> DISRUPTED)"
          - "increments Placement.version by 1"

  - entity: PostPlacementVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /post-placement-visits/{id}/complete"
        actor: Caseworker
        preconditions:
          - "visit.status == SCHEDULED"
          - "the case's Placement.status == ACTIVE (cross-entity: PostPlacementVisit->Placement)"
          - "visit.window_start <= agency.current_utc < visit.window_end (half-open window, boundary semantics)"
        side_effects:
          - "sets PostPlacementVisit.conducted_at = agency.current_utc"
          - "increments Placement.completed_visit_count (derived recompute on parent Placement)"
          - "increments PostPlacementVisit.version by 1"

      - from: SCHEDULED
        to: MISSED
        trigger: "POST /post-placement-visits/{id}/mark-missed (system, window elapsed)"
        actor: system
        preconditions:
          - "visit.status == SCHEDULED"
          - "agency.current_utc >= visit.window_end (boundary: >=, window has closed)"
        side_effects:
          - "increments PostPlacementVisit.version by 1"

  - entity: CounselingSession
    initial_state: BOOKED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: BOOKED
        to: HELD
        trigger: "POST /counseling-sessions/{id}/hold"
        actor: Caseworker
        preconditions:
          - "session.status == BOOKED"
          - "agency.current_utc >= session.start_at"
        side_effects:
          - "increments CounselingSession.version by 1"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /counseling-sessions/{id}/cancel"
        actor: Caseworker
        preconditions:
          - "session.status == BOOKED"
        side_effects:
          - "increments CounselingSession.version by 1"
        note: "A CANCELLED session frees its buffered interval so a replacement may be booked in the same slot."

  - entity: ExpenseEntry
    initial_state: LOGGED
    terminal_states: [REJECTED, DISBURSED]
    transitions:
      - from: LOGGED
        to: APPROVED
        trigger: "POST /expense-entries/{id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "expense.status == LOGGED"
          - "acting FinanceOfficer.id != expense.logged_by_caseworker_id (segregation of duties)"
        side_effects:
          - "sets ExpenseEntry.approved_by_finance_id = acting FinanceOfficer.id"
          - "recomputes AdoptionCase.reimbursable_expense_cents (derived: += amount_cents)"
          - "increments ExpenseEntry.version by 1"

      - from: LOGGED
        to: REJECTED
        trigger: "POST /expense-entries/{id}/reject"
        actor: FinanceOfficer
        preconditions:
          - "expense.status == LOGGED"
        side_effects:
          - "increments ExpenseEntry.version by 1"

      - from: APPROVED
        to: DISBURSED
        trigger: "POST /expense-entries/{id}/disburse"
        actor: FinanceOfficer
        preconditions:
          - "expense.status == APPROVED"
          - "case.escrow_balance_cents >= expense.amount_cents (cross-entity: ExpenseEntry->AdoptionCase escrow; boundary >=)"
        side_effects:
          - "creates an EscrowTransaction of txn_type DISBURSEMENT for amount_cents tied to this expense (cascade hop 1)"
          - "that DISBURSEMENT recomputes AdoptionCase.escrow_balance_cents (cascade hop 2; derived reconciliation)"
          - "increments ExpenseEntry.version by 1"

  - entity: AgencyFeeInvoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /agency-fee-invoices/{id}/pay"
        actor: FinanceOfficer
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "increments AgencyFeeInvoice.version by 1"

      - from: ISSUED
        to: VOID
        trigger: "POST /agency-fee-invoices/{id}/void"
        actor: Supervisor
        preconditions:
          - "invoice.status == ISSUED"
          - "the case's Placement.status != FINALIZED (cannot void a fee on a finalized case)"
        side_effects:
          - "increments AgencyFeeInvoice.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: consent-sign-stale-case
    parent_entity: AdoptionCase
    write_endpoint: "POST /consent-records"
    occ_field: "expected_case_version"
    description: |
      Creating a new ConsentRecord against an AdoptionCase whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has already collected (and possibly superseded)
      consent on the same case, so the current writer's view of the case — and
      of which prior consent it should supersede — is stale.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: escrow-deposit-stale-case
    parent_entity: AdoptionCase
    write_endpoint: "POST /escrow-transactions"
    occ_field: "expected_case_version"
    description: |
      Recording an EscrowTransaction (DEPOSIT/DISBURSEMENT/REFUND) against an
      AdoptionCase whose version has advanced since the client last observed it
      is rejected. A prior disbursement or refund that legitimately changed the
      escrow balance leaves the current writer's view of available funds stale.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: case_phase
    trigger: "any child-entity transition that lists 'recomputes AdoptionCase.phase'; also recomputed on GET /cases/{id}"
    algorithm: projection
    formula: |
      AdoptionCase.phase is derived from child-entity states, evaluated in this
      PINNED priority order (first matching rule wins, top to bottom):
        1. If any Placement for the case is FINALIZED            -> FINALIZED
        2. Else if any Placement is DISRUPTED, OR any ConsentRecord
           for the case is REVOKED                                -> DISRUPTED
        3. Else if any Placement is ACTIVE                        -> PLACED
        4. Else if case.interstate AND the case's IcpcClearance
           is RECEIVING_APPROVED                                  -> ICPC_CLEARED
        5. Else if any ConsentRecord for the case is IRREVOCABLE  -> CONSENTED
        6. Else if any Match for the case is ACCEPTED            -> MATCHED
        7. Else if any HomeStudy for the case is APPROVED and not
           EXPIRED (agency.current_utc < expires_at)              -> HOME_STUDY
        8. Else                                                   -> INTAKE
      Note rule 4 only applies to interstate cases; an in-state case skips
      ICPC_CLEARED and goes CONSENTED -> PLACED directly. An EXPIRED HomeStudy
      with no later milestone causes the case to fall back to INTAKE per rule 8.
    input_set: "All HomeStudy/Match/ConsentRecord/IcpcClearance/Placement rows for the case; reads case.interstate"
    precision: "enum projection; deterministic priority order pinned above"

  - name: revocation_deadline
    trigger: "ConsentRecord SIGNED transition (POST /consent-records/{id}/sign)"
    algorithm: temporal_windowing
    formula: |
      base = consent.signed_at  (an instant on the agency clock)
      VARIANT CALENDAR_DAYS:
        revocation_deadline = base + CALENDAR_WINDOW_DAYS * 24 hours
        (pure wall-clock addition; weekends/holidays counted)
      VARIANT BUSINESS_DAYS:
        Advance BUSINESS_WINDOW_DAYS business days from base, then take the
        end-of-that-business-day instant.
        Counting rule (pinned): start from the calendar day of `signed_at`.
        A "business day" is Mon-Fri (UTC weekday 0..4); Sat/Sun are skipped and
        do NOT consume a count. Step forward one calendar day at a time; each
        landed business day decrements the remaining count by 1. The deadline is
        23:59:59.000Z (UTC) of the day on which the count reaches 0.
        The day of signed_at itself does NOT count as business day 1 even if it
        is a weekday — counting begins on the NEXT calendar day.
    input_set: "Single ConsentRecord; variant selected by consent.revocation_basis"
    constants:
      CALENDAR_WINDOW_DAYS: 10
      BUSINESS_WINDOW_DAYS: 5
    precision: "millisecond instant, UTC; deadline-day end is 23:59:59.000Z"
    variants:
      - name: calendar_days
        when: "revocation_basis == CALENDAR_DAYS"
        difference: "Adds 10 * 24h wall-clock; weekends consumed"
      - name: business_days
        when: "revocation_basis == BUSINESS_DAYS"
        difference: "Skips Sat/Sun; lands on the 5th business day after signing and uses 23:59:59.000Z of that day"

  - name: agency_fee_total
    trigger: "AgencyFeeInvoice issuance (POST /agency-fee-invoices)"
    algorithm: tiered_pricing
    formula: |
      Inputs: base = agency.fee_schedule_cents; income = family.annual_income_cents;
              reimbursable = case.reimbursable_expense_cents (sum of {APPROVED,DISBURSED}).
      Step 1 (sliding scale band, threshold selection on income — non-linear branch):
        income <  LOW_BAND_CENTS                      -> sliding_scale_pct = -0.20  (20% discount)
        LOW_BAND_CENTS <= income < HIGH_BAND_CENTS    -> sliding_scale_pct =  0.00
        income >= HIGH_BAND_CENTS                     -> sliding_scale_pct = +0.15  (15% surcharge)
      Step 2 (cap the reimbursable pass-through — min() of two inputs):
        billable_reimbursable_cents = min(reimbursable, REIMBURSABLE_CAP_CENTS)
      Step 3 (apply the SAME sliding scale to BOTH components, then ROUND EACH
              COMPONENT SEPARATELY — rounding order is pinned to round-then-sum):
        adjusted_base_cents      = round_half_up(base * (1 + sliding_scale_pct))
        adjusted_reimb_cents     = round_half_up(billable_reimbursable_cents * (1 + sliding_scale_pct))
      Step 4 (total):
        total_due_cents = adjusted_base_cents + adjusted_reimb_cents
      PINNED ORDER (mode-b combinatorial): round EACH sliding-scaled component
      first, THEN sum — total = round(base*(1+pct)) + round(reimb*(1+pct)).
      The forbidden alternative round(base*(1+pct) + reimb*(1+pct)) (sum-then-
      round) yields a different cent total when both components carry a half-cent
      (e.g. base=30, reimb=10, pct=0.15: round(34.5)+round(11.5)=35+12=47 vs
      round(46.0)=46).
    input_set: "One AgencyFeeInvoice; reads agency.fee_schedule_cents, family.annual_income_cents, case.reimbursable_expense_cents"
    constants:
      LOW_BAND_CENTS: 4000000      # $40,000.00
      HIGH_BAND_CENTS: 12000000    # $120,000.00
      REIMBURSABLE_CAP_CENTS: 1500000  # $15,000.00 cap on pass-through
    precision: "integer cents; round_half_up applied per component (Step 3), NOT on the sum"

  - name: home_study_expiry
    trigger: "HomeStudy APPROVED transition"
    algorithm: temporal_windowing
    formula: |
      expires_at = completed_at + VALIDITY_DAYS * 24 hours (wall-clock).
      A HomeStudy is usable (for Match accept and Placement activate) only while
      agency.current_utc < expires_at. At exactly expires_at it is expired.
    input_set: "Single HomeStudy at approval"
    constants:
      VALIDITY_DAYS: 365
    precision: "millisecond instant, UTC"

  - name: escrow_balance
    trigger: "any EscrowTransaction create; ExpenseEntry disburse cascade"
    algorithm: aggregation
    formula: |
      escrow_balance_cents =
          sum(amount_cents for t in EscrowTransaction[case_id, txn_type=DEPOSIT])
        - sum(amount_cents for t in EscrowTransaction[case_id, txn_type=DISBURSEMENT])
        - sum(amount_cents for t in EscrowTransaction[case_id, txn_type=REFUND])
      Conserved-quantity invariant: for any DISBURSEMENT of amount A tied to an
      approved expense, escrow_balance_cents decreases by exactly A and the
      matching ExpenseEntry moves LOGGED/APPROVED -> DISBURSED; a subsequent
      REFUND of the same amount A restores escrow_balance_cents to its prior
      value (deposits - disbursements + refund offset nets to the pre-disburse
      balance). Total agency-held funds = escrow_balance + sum(disbursed).
    input_set: "All EscrowTransaction rows for the case, filtered by txn_type"
    precision: "integer cents; no rounding (all inputs integer)"

  - name: required_visit_count
    trigger: "Placement activate (POST /placements/{id}/activate)"
    algorithm: threshold
    formula: |
      required_visits = REQUIRED_VISITS_INTERSTATE if case.interstate
                        else REQUIRED_VISITS_INSTATE
      case.interstate is true iff case.child_state != case.family_state.
    input_set: "Single Placement; reads case.interstate (derived from child_state vs family_state)"
    constants:
      REQUIRED_VISITS_INSTATE: 3
      REQUIRED_VISITS_INTERSTATE: 6
    precision: "integer count"

  - name: reimbursable_expense_total
    trigger: "ExpenseEntry approve; ExpenseEntry disburse"
    algorithm: aggregation
    formula: |
      reimbursable_expense_cents =
        sum(amount_cents for e in ExpenseEntry[case_id]
            where e.status IN {APPROVED, DISBURSED})
      LOGGED and REJECTED expenses are excluded. Disbursement does NOT remove an
      expense from the reimbursable total (it stays APPROVED-or-DISBURSED).
    input_set: "All ExpenseEntry rows for the case with status in {APPROVED, DISBURSED}"
    precision: "integer cents"

  - name: consent_eligibility
    trigger: "ConsentRecord SIGNED transition (POST /consent-records/{id}/sign)"
    algorithm: threshold
    formula: |
      earliest_sign_instant = consent.child_dob + MIN_HOURS_AFTER_BIRTH * 1 hour
      Signing is permitted only when agency.current_utc >= earliest_sign_instant
      (boundary: >=, exactly at the threshold is eligible). Otherwise the sign
      transition is rejected with ERR_CONSENT_TOO_EARLY.
    input_set: "Single ConsentRecord; reads child_dob and agency.current_utc"
    constants:
      MIN_HOURS_AFTER_BIRTH: 72   # birth-parent consent cannot be taken until 72h after birth
    precision: "millisecond instant, UTC"

  - name: counseling_buffer_window
    trigger: "CounselingSession booking (POST /counseling-sessions)"
    algorithm: temporal_windowing
    formula: |
      For a candidate session C and any existing non-CANCELLED session E for the
      same birth_parent, the occupied (buffered-closed) interval of E is
      [E.start_at - COUNSELING_BUFFER_MINUTES, E.end_at + COUNSELING_BUFFER_MINUTES].
      C conflicts iff:
        C.start_at < E.end_at + COUNSELING_BUFFER_MINUTES AND
        E.start_at < C.end_at + COUNSELING_BUFFER_MINUTES
      Back-to-back sessions (C.start_at == E.end_at) DO conflict because the
      buffer is added to the closed interval — this is the key contrast with
      PostPlacementVisit's touching-allowed half-open semantics.
    input_set: "Candidate session vs all non-CANCELLED sessions for the birth_parent (status IN {BOOKED, HELD})"
    constants:
      COUNSELING_BUFFER_MINUTES: 60
    precision: "minute granularity on the buffer; instant comparison"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role in X-User-Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Pagination params in range: 1 <= limit <= 100 and offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list (GET collection) endpoints"

  - priority: 4
    category: existence
    check: "Every resource referenced in the path exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: existence
    check: "Every FK in the request body references an existing resource"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK fields"

  - priority: 6
    category: existence
    check: "Required body fields present and of declared type; enum values legal"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/action endpoints"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_referential
    check: "Segregation of duties — the acting user is not the same person who performed the conflicting prior step (HomeStudy approver != author; ExpenseEntry approver != logger)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /home-studies/{id}/approve, POST /home-studies/{id}/return, POST /expense-entries/{id}/approve"

  - priority: 9
    category: business_referential
    check: "Cross-entity gate — a transition that depends on a sibling entity's state finds that sibling in the wrong state (Match accept needs APPROVED HomeStudy; Placement activate needs IRREVOCABLE consent + ICPC RECEIVING_APPROVED when interstate)"
    error_id: ERR_PREREQUISITE_NOT_MET
    http_status: 409
    applies_to: "POST /matches/{id}/accept, POST /consent-records/{id}/sign, POST /placements/{id}/activate, POST /icpc-clearances/{id}/submit"

  - priority: 10
    category: business_temporal
    check: "Match accept / Placement activate requires a non-expired APPROVED HomeStudy (agency.current_utc < HomeStudy.expires_at). Checked AFTER the APPROVED-state prerequisite (priority 8) and BEFORE consent-timing rules."
    error_id: ERR_HOME_STUDY_EXPIRED
    http_status: 409
    applies_to: "POST /matches/{id}/accept, POST /placements/{id}/activate"

  - priority: 11
    category: business_temporal
    check: "Consent cannot be signed before child_dob + MIN_HOURS_AFTER_BIRTH"
    error_id: ERR_CONSENT_TOO_EARLY
    http_status: 409
    applies_to: "POST /consent-records/{id}/sign"

  - priority: 12
    category: business_temporal
    check: "Revocation attempted after revocation_deadline (current_utc > deadline)"
    error_id: ERR_REVOCATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /consent-records/{id}/revoke"

  - priority: 13
    category: business_temporal
    check: "Post-placement visit completion attempted outside the half-open window [window_start, window_end)"
    error_id: ERR_VISIT_WINDOW_INVALID
    http_status: 409
    applies_to: "POST /post-placement-visits/{id}/complete"

  - priority: 14
    category: business_constraint
    check: "Placement finalize requires completed_visit_count >= required_visits"
    error_id: ERR_VISITS_INCOMPLETE
    http_status: 409
    applies_to: "POST /placements/{id}/finalize"

  - priority: 15
    category: business_constraint
    check: "PostPlacementVisit window_start must be strictly before window_end; two SCHEDULED visits for the same placement may not overlap. Interval semantics: HALF-OPEN [window_start, window_end), TOUCHING-ALLOWED — visit B with window_start == visit A.window_end does NOT overlap (A occupies up to but not including its end). Overlap iff B.window_start < A.window_end AND A.window_start < B.window_end."
    error_id: ERR_VISIT_OVERLAP
    http_status: 409
    applies_to: "POST /post-placement-visits"

  - priority: 16
    category: business_constraint
    check: "CounselingSession start_at must be strictly before end_at; for the same birth_parent, two non-CANCELLED sessions may not fall within COUNSELING_BUFFER_MINUTES of each other. Interval semantics: BUFFERED-CLOSED — the occupied interval is [start_at - BUFFER, end_at + BUFFER]; back-to-back (B.start_at == A.end_at) IS rejected because the buffer makes the closed intervals collide. Overlap iff B.start_at < A.end_at + BUFFER AND A.start_at < B.end_at + BUFFER."
    error_id: ERR_SESSION_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /counseling-sessions"

  - priority: 17
    category: business_constraint
    check: "ICPC submit rejected when case.interstate == false (no clearance needed)"
    error_id: ERR_ICPC_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /icpc-clearances/{id}/submit"

  - priority: 18
    category: business_fiscal
    check: "Escrow disbursement/withdrawal would drive escrow_balance_cents negative (amount > available balance)"
    error_id: ERR_INSUFFICIENT_ESCROW
    http_status: 409
    applies_to: "POST /expense-entries/{id}/disburse, POST /escrow-transactions (DISBURSEMENT/REFUND)"

  - priority: 19
    category: business_fiscal
    check: "OCC — expected_case_version does not match current AdoptionCase.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /consent-records, POST /escrow-transactions"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Agency ----
  - { method: POST, path: "/agencies", description: "Create an agency", roles: [AgencyAdmin], code: 201, input: [name, licensed_state, fee_schedule_cents], output: Agency, side_effects: ["sets current_utc = creation time"] }
  - { method: GET,  path: "/agencies/{id}", description: "Get an agency", roles: [AgencyAdmin, Supervisor, Caseworker, FinanceOfficer, CompactAdministrator], code: 200, input: [], output: Agency }
  - { method: GET,  path: "/agencies", description: "List agencies", roles: [AgencyAdmin], code: 200, input: ["limit?", "offset?"], output: "Agency[]" }

  # ---- Test-driving clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the agency deterministic clock (test-driving)", roles: [AgencyAdmin], code: 200, input: [agency_id, to_iso8601], output: Agency, side_effects: ["sets Agency.current_utc"] }

  # ---- AdoptionCase ----
  - { method: POST, path: "/cases", description: "Open an adoption case", roles: [Supervisor], code: 201, input: [agency_id, case_label, child_state, family_state], output: AdoptionCase, side_effects: ["computes interstate = child_state != family_state", "phase = INTAKE", "escrow_balance_cents = 0", "reimbursable_expense_cents = 0"] }
  - { method: GET,  path: "/cases/{id}", description: "Get a case (derived phase, escrow_balance, reimbursable totals)", roles: [Supervisor, Caseworker, FinanceOfficer, CompactAdministrator], code: 200, input: [], output: AdoptionCase }
  - { method: GET,  path: "/cases", description: "List cases (filter by agency)", roles: [Supervisor, Caseworker, FinanceOfficer], code: 200, input: ["agency_id?", "limit?", "offset?"], output: "AdoptionCase[]" }

  # ---- AdoptiveFamily ----
  - { method: POST, path: "/families", description: "Register an adoptive family on a case", roles: [Caseworker], code: 201, input: [case_id, primary_applicant_name, residence_state, household_size, annual_income_cents], output: AdoptiveFamily }
  - { method: GET,  path: "/families/{id}", description: "Get a family", roles: [Supervisor, Caseworker, FinanceOfficer], code: 200, input: [], output: AdoptiveFamily }
  - { method: GET,  path: "/families", description: "List families (filter by case)", roles: [Supervisor, Caseworker], code: 200, input: ["case_id?", "limit?", "offset?"], output: "AdoptiveFamily[]" }

  # ---- HomeStudy ----
  - { method: POST, path: "/home-studies", description: "Create a home study (DRAFT)", roles: [Caseworker], code: 201, input: [case_id, family_id], output: HomeStudy, side_effects: ["authoring_caseworker_id = X-User-ID"] }
  - { method: GET,  path: "/home-studies/{id}", description: "Get a home study", roles: [Supervisor, Caseworker], code: 200, input: [], output: HomeStudy }
  - { method: GET,  path: "/home-studies", description: "List home studies (filter by case or family)", roles: [Supervisor, Caseworker], code: 200, input: ["case_id?", "family_id?", "limit?", "offset?"], output: "HomeStudy[]" }
  - { method: POST, path: "/home-studies/{id}/submit", description: "Submit study for review (DRAFT|RESUBMITTED -> UNDER_REVIEW)", roles: [Caseworker], code: 200, input: [], output: HomeStudy, side_effects: ["increments HomeStudy.version by 1"] }
  - { method: POST, path: "/home-studies/{id}/approve", description: "Approve study (UNDER_REVIEW -> APPROVED)", roles: [Supervisor], code: 200, input: [], output: HomeStudy, side_effects: ["sets approving_supervisor_id", "sets completed_at", "computes expires_at", "recomputes AdoptionCase.phase", "increments HomeStudy.version by 1"] }
  - { method: POST, path: "/home-studies/{id}/return", description: "Return study as deficient (UNDER_REVIEW -> DEFICIENT)", roles: [Supervisor], code: 200, input: [], output: HomeStudy, side_effects: ["increments revision_count", "increments HomeStudy.version by 1"] }
  - { method: POST, path: "/home-studies/{id}/resubmit", description: "Begin revision (DEFICIENT -> RESUBMITTED)", roles: [Caseworker], code: 200, input: [], output: HomeStudy, side_effects: ["increments HomeStudy.version by 1"] }
  - { method: POST, path: "/home-studies/{id}/check-expiry", description: "System check: expire an APPROVED study past its expires_at (APPROVED -> EXPIRED)", roles: [AgencyAdmin], code: 200, input: [], output: HomeStudy, side_effects: ["recomputes AdoptionCase.phase", "increments HomeStudy.version by 1"] }

  # ---- BirthParent ----
  - { method: POST, path: "/birth-parents", description: "Register a birth parent", roles: [Caseworker], code: 201, input: [agency_id, legal_name, birth_state, parent_role], output: BirthParent }
  - { method: GET,  path: "/birth-parents/{id}", description: "Get a birth parent", roles: [Supervisor, Caseworker], code: 200, input: [], output: BirthParent }
  - { method: GET,  path: "/birth-parents", description: "List birth parents (filter by agency)", roles: [Supervisor, Caseworker], code: 200, input: ["agency_id?", "limit?", "offset?"], output: "BirthParent[]" }

  # ---- CounselingSession ----
  - { method: POST, path: "/counseling-sessions", description: "Book a birth-parent counseling session (BOOKED); buffered-overlap checked", roles: [Caseworker], code: 201, input: [birth_parent_id, case_id, start_at, end_at], output: CounselingSession, side_effects: ["counselor_id = X-User-ID"] }
  - { method: GET,  path: "/counseling-sessions/{id}", description: "Get a counseling session", roles: [Supervisor, Caseworker], code: 200, input: [], output: CounselingSession }
  - { method: GET,  path: "/counseling-sessions", description: "List counseling sessions (filter by birth parent or case)", roles: [Supervisor, Caseworker], code: 200, input: ["birth_parent_id?", "case_id?", "limit?", "offset?"], output: "CounselingSession[]" }
  - { method: POST, path: "/counseling-sessions/{id}/hold", description: "Mark a session held (BOOKED -> HELD)", roles: [Caseworker], code: 200, input: [], output: CounselingSession, side_effects: ["increments CounselingSession.version by 1"] }
  - { method: POST, path: "/counseling-sessions/{id}/cancel", description: "Cancel a session (BOOKED -> CANCELLED)", roles: [Caseworker], code: 200, input: [], output: CounselingSession, side_effects: ["increments CounselingSession.version by 1"] }

  # ---- Match ----
  - { method: POST, path: "/matches", description: "Propose a match (PROPOSED)", roles: [Caseworker], code: 201, input: [case_id, family_id, birth_parent_id], output: Match, side_effects: ["proposed_by_caseworker_id = X-User-ID"] }
  - { method: GET,  path: "/matches/{id}", description: "Get a match", roles: [Supervisor, Caseworker], code: 200, input: [], output: Match }
  - { method: GET,  path: "/matches", description: "List matches (filter by case)", roles: [Supervisor, Caseworker], code: 200, input: ["case_id?", "birth_parent_id?", "family_id?", "limit?", "offset?"], output: "Match[]" }
  - { method: POST, path: "/matches/{id}/accept", description: "Accept a match (PROPOSED -> ACCEPTED); requires APPROVED non-expired HomeStudy", roles: [Supervisor], code: 200, input: [], output: Match, side_effects: ["recomputes AdoptionCase.phase", "increments Match.version by 1"] }
  - { method: POST, path: "/matches/{id}/decline", description: "Decline a match (PROPOSED -> DECLINED)", roles: [Supervisor], code: 200, input: [], output: Match, side_effects: ["increments Match.version by 1"] }
  - { method: POST, path: "/matches/{id}/dissolve", description: "Dissolve an accepted match (ACCEPTED -> DISSOLVED)", roles: [Supervisor], code: 200, input: [], output: Match, side_effects: ["recomputes AdoptionCase.phase", "increments Match.version by 1"] }

  # ---- ConsentRecord ----
  - { method: POST, path: "/consent-records", description: "Create a consent record (PENDING); OCC-guarded on case", roles: [Caseworker], code: 201, input: [case_id, birth_parent_id, child_dob, revocation_basis, "supersedes_consent_id?", expected_case_version], output: ConsentRecord, side_effects: ["increments AdoptionCase.version by 1"] }
  - { method: GET,  path: "/consent-records/{id}", description: "Get a consent record", roles: [Supervisor, Caseworker], code: 200, input: [], output: ConsentRecord }
  - { method: GET,  path: "/consent-records", description: "List consent records (filter by case or birth parent)", roles: [Supervisor, Caseworker], code: 200, input: ["case_id?", "birth_parent_id?", "supersedes_consent_id?", "limit?", "offset?"], output: "ConsentRecord[]" }
  - { method: POST, path: "/consent-records/{id}/sign", description: "Sign consent (PENDING -> SIGNED); sets revocation_deadline", roles: [Caseworker], code: 200, input: [], output: ConsentRecord, side_effects: ["sets signed_at", "computes revocation_deadline", "increments ConsentRecord.version by 1"] }
  - { method: POST, path: "/consent-records/{id}/revoke", description: "Revoke consent within window (SIGNED -> REVOKED)", roles: [Caseworker], code: 200, input: [], output: ConsentRecord, side_effects: ["disrupts any ACTIVE Placement", "marks SCHEDULED visits MISSED", "recomputes AdoptionCase.phase", "increments ConsentRecord.version by 1"] }
  - { method: POST, path: "/consent-records/{id}/finalize-consent", description: "System: make consent irrevocable past deadline (SIGNED -> IRREVOCABLE)", roles: [AgencyAdmin], code: 200, input: [], output: ConsentRecord, side_effects: ["recomputes AdoptionCase.phase", "increments ConsentRecord.version by 1"] }

  # ---- IcpcClearance ----
  - { method: POST, path: "/icpc-clearances", description: "Open an ICPC clearance for a case (DRAFT if interstate else NOT_REQUIRED)", roles: [Caseworker], code: 201, input: [case_id], output: IcpcClearance, side_effects: ["copies sending_state, receiving_state from case", "status = DRAFT if case.interstate else NOT_REQUIRED"] }
  - { method: GET,  path: "/icpc-clearances/{id}", description: "Get an ICPC clearance", roles: [Supervisor, Caseworker, CompactAdministrator], code: 200, input: [], output: IcpcClearance }
  - { method: GET,  path: "/icpc-clearances", description: "List ICPC clearances (filter by case)", roles: [Supervisor, Caseworker, CompactAdministrator], code: 200, input: ["case_id?", "limit?", "offset?"], output: "IcpcClearance[]" }
  - { method: POST, path: "/icpc-clearances/{id}/submit", description: "Submit packet (DRAFT -> SUBMITTED)", roles: [Caseworker], code: 200, input: [], output: IcpcClearance, side_effects: ["sets submitted_at", "increments IcpcClearance.version by 1"] }
  - { method: POST, path: "/icpc-clearances/{id}/approve-sending", description: "Sending-state approval (SUBMITTED -> SENDING_APPROVED)", roles: [CompactAdministrator], code: 200, input: [], output: IcpcClearance, side_effects: ["increments IcpcClearance.version by 1"] }
  - { method: POST, path: "/icpc-clearances/{id}/approve-receiving", description: "Receiving-state approval (SENDING_APPROVED -> RECEIVING_APPROVED)", roles: [CompactAdministrator], code: 200, input: [], output: IcpcClearance, side_effects: ["recomputes AdoptionCase.phase", "increments IcpcClearance.version by 1"] }
  - { method: POST, path: "/icpc-clearances/{id}/reject", description: "Reject clearance (SUBMITTED|SENDING_APPROVED -> REJECTED)", roles: [CompactAdministrator], code: 200, input: [], output: IcpcClearance, side_effects: ["increments IcpcClearance.version by 1"] }
  - { method: POST, path: "/icpc-clearances/{id}/rework", description: "Rework rejected clearance (REJECTED -> DRAFT)", roles: [Caseworker], code: 200, input: [], output: IcpcClearance, side_effects: ["clears submitted_at", "increments IcpcClearance.version by 1"] }

  # ---- Placement ----
  - { method: POST, path: "/placements", description: "Create a placement (PENDING)", roles: [Supervisor], code: 201, input: [case_id, family_id], output: Placement }
  - { method: GET,  path: "/placements/{id}", description: "Get a placement (derived required_visits, completed_visit_count)", roles: [Supervisor, Caseworker], code: 200, input: [], output: Placement }
  - { method: GET,  path: "/placements", description: "List placements (filter by case)", roles: [Supervisor, Caseworker], code: 200, input: ["case_id?", "family_id?", "limit?", "offset?"], output: "Placement[]" }
  - { method: POST, path: "/placements/{id}/activate", description: "Place the child (PENDING -> ACTIVE); requires IRREVOCABLE consent, ICPC RECEIVING_APPROVED if interstate, valid HomeStudy", roles: [Supervisor], code: 200, input: [], output: Placement, side_effects: ["sets placed_at", "computes required_visits", "recomputes AdoptionCase.phase", "increments Placement.version by 1"] }
  - { method: POST, path: "/placements/{id}/finalize", description: "Court finalization (ACTIVE -> FINALIZED); requires all required visits completed", roles: [Supervisor], code: 200, input: [], output: Placement, side_effects: ["sets finalized_at", "recomputes AdoptionCase.phase", "transitions SIGNED consents -> IRREVOCABLE", "increments Placement.version by 1"] }
  - { method: POST, path: "/placements/{id}/disrupt", description: "Disrupt an active placement (ACTIVE -> DISRUPTED)", roles: [Supervisor], code: 200, input: [], output: Placement, side_effects: ["marks SCHEDULED visits MISSED", "recomputes AdoptionCase.phase", "increments Placement.version by 1"] }

  # ---- PostPlacementVisit ----
  - { method: POST, path: "/post-placement-visits", description: "Schedule a post-placement visit (SCHEDULED)", roles: [Caseworker], code: 201, input: [case_id, placement_id, window_start, window_end], output: PostPlacementVisit, side_effects: ["visiting_caseworker_id = X-User-ID"] }
  - { method: GET,  path: "/post-placement-visits/{id}", description: "Get a visit", roles: [Supervisor, Caseworker], code: 200, input: [], output: PostPlacementVisit }
  - { method: GET,  path: "/post-placement-visits", description: "List visits (filter by case or placement)", roles: [Supervisor, Caseworker], code: 200, input: ["case_id?", "placement_id?", "limit?", "offset?"], output: "PostPlacementVisit[]" }
  - { method: POST, path: "/post-placement-visits/{id}/complete", description: "Complete a visit within its window (SCHEDULED -> COMPLETED)", roles: [Caseworker], code: 200, input: [], output: PostPlacementVisit, side_effects: ["sets conducted_at", "increments Placement.completed_visit_count", "increments PostPlacementVisit.version by 1"] }
  - { method: POST, path: "/post-placement-visits/{id}/mark-missed", description: "System: mark a visit missed after its window closes (SCHEDULED -> MISSED)", roles: [AgencyAdmin], code: 200, input: [], output: PostPlacementVisit, side_effects: ["increments PostPlacementVisit.version by 1"] }

  # ---- ExpenseEntry ----
  - { method: POST, path: "/expense-entries", description: "Log an expense (LOGGED)", roles: [Caseworker], code: 201, input: [case_id, category, amount_cents], output: ExpenseEntry, side_effects: ["logged_by_caseworker_id = X-User-ID"] }
  - { method: GET,  path: "/expense-entries/{id}", description: "Get an expense", roles: [Supervisor, Caseworker, FinanceOfficer], code: 200, input: [], output: ExpenseEntry }
  - { method: GET,  path: "/expense-entries", description: "List expenses (filter by case)", roles: [Supervisor, Caseworker, FinanceOfficer], code: 200, input: ["case_id?", "limit?", "offset?"], output: "ExpenseEntry[]" }
  - { method: POST, path: "/expense-entries/{id}/approve", description: "Approve an expense (LOGGED -> APPROVED); SoD against logger", roles: [FinanceOfficer], code: 200, input: [], output: ExpenseEntry, side_effects: ["sets approved_by_finance_id", "recomputes AdoptionCase.reimbursable_expense_cents", "increments ExpenseEntry.version by 1"] }
  - { method: POST, path: "/expense-entries/{id}/reject", description: "Reject an expense (LOGGED -> REJECTED)", roles: [FinanceOfficer], code: 200, input: [], output: ExpenseEntry, side_effects: ["increments ExpenseEntry.version by 1"] }
  - { method: POST, path: "/expense-entries/{id}/disburse", description: "Disburse an approved expense from escrow (APPROVED -> DISBURSED)", roles: [FinanceOfficer], code: 200, input: [], output: ExpenseEntry, side_effects: ["creates DISBURSEMENT EscrowTransaction", "recomputes AdoptionCase.escrow_balance_cents", "increments ExpenseEntry.version by 1"] }

  # ---- EscrowTransaction ----
  - { method: POST, path: "/escrow-transactions", description: "Record an escrow deposit/refund (or manual disbursement); OCC-guarded on case", roles: [FinanceOfficer], code: 201, input: [case_id, txn_type, amount_cents, "expense_id?", expected_case_version], output: EscrowTransaction, side_effects: ["recomputes AdoptionCase.escrow_balance_cents", "increments AdoptionCase.version by 1"] }
  - { method: GET,  path: "/escrow-transactions/{id}", description: "Get an escrow transaction", roles: [Supervisor, FinanceOfficer], code: 200, input: [], output: EscrowTransaction }
  - { method: GET,  path: "/escrow-transactions", description: "List escrow transactions (filter by case or expense)", roles: [Supervisor, FinanceOfficer], code: 200, input: ["case_id?", "expense_id?", "limit?", "offset?"], output: "EscrowTransaction[]" }

  # ---- AgencyFeeInvoice ----
  - { method: POST, path: "/agency-fee-invoices", description: "Issue an agency fee invoice (ISSUED); computes sliding-scale total", roles: [FinanceOfficer], code: 201, input: [case_id], output: AgencyFeeInvoice, side_effects: ["computes base_fee_cents, sliding_scale_pct, total_due_cents (calculation agency_fee_total)"] }
  - { method: GET,  path: "/agency-fee-invoices/{id}", description: "Get an invoice", roles: [Supervisor, FinanceOfficer], code: 200, input: [], output: AgencyFeeInvoice }
  - { method: GET,  path: "/agency-fee-invoices", description: "List invoices (filter by case)", roles: [Supervisor, FinanceOfficer], code: 200, input: ["case_id?", "limit?", "offset?"], output: "AgencyFeeInvoice[]" }
  - { method: POST, path: "/agency-fee-invoices/{id}/pay", description: "Mark invoice paid (ISSUED -> PAID)", roles: [FinanceOfficer], code: 200, input: [], output: AgencyFeeInvoice, side_effects: ["increments AgencyFeeInvoice.version by 1"] }
  - { method: POST, path: "/agency-fee-invoices/{id}/void", description: "Void an invoice (ISSUED -> VOID)", roles: [Supervisor], code: 200, input: [], output: AgencyFeeInvoice, side_effects: ["increments AgencyFeeInvoice.version by 1"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http: 404, condition: "Body FK references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required field, bad type, or illegal enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Acting user is the same person who performed the conflicting prior step" }
  - { id: ERR_PREREQUISITE_NOT_MET, http: 409, condition: "A required sibling-entity state precondition is not satisfied (e.g. HomeStudy not APPROVED, consent not IRREVOCABLE, ICPC not RECEIVING_APPROVED)" }
  - { id: ERR_CONSENT_TOO_EARLY, http: 409, condition: "Consent signed before child_dob + MIN_HOURS_AFTER_BIRTH" }
  - { id: ERR_REVOCATION_WINDOW_CLOSED, http: 409, condition: "Revocation attempted strictly after revocation_deadline" }
  - { id: ERR_VISIT_WINDOW_INVALID, http: 409, condition: "Visit completed outside the half-open window [window_start, window_end)" }
  - { id: ERR_VISIT_OVERLAP, http: 409, condition: "Scheduled visit window invalid (start >= end) or overlaps another SCHEDULED visit on the same placement (half-open, touching allowed)" }
  - { id: ERR_SESSION_BUFFER_CONFLICT, http: 409, condition: "Counseling session invalid (start >= end) or falls within COUNSELING_BUFFER_MINUTES of another non-CANCELLED session for the same birth parent (buffered-closed)" }
  - { id: ERR_VISITS_INCOMPLETE, http: 409, condition: "Placement finalize attempted with completed_visit_count < required_visits" }
  - { id: ERR_ICPC_NOT_APPLICABLE, http: 409, condition: "ICPC submit attempted on an in-state case (interstate == false)" }
  - { id: ERR_INSUFFICIENT_ESCROW, http: 409, condition: "Disbursement/refund would drive escrow_balance_cents negative" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version does not match current AdoptionCase.version (OCC)" }
  - { id: ERR_HOME_STUDY_EXPIRED, http: 409, condition: "Operation requires a non-expired APPROVED HomeStudy but current_utc >= expires_at" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit or offset out of allowed range (limit < 1, limit > 100, or offset < 0)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AgencyAdmin
    description: "Platform/agency operator; provisions agencies and drives system/clock and system-transition endpoints"
    identity: "opaque"
    exclusive_operations:
      - "POST /agencies"
      - "GET /agencies (list)"
      - "POST /_clock/set_current_utc"
      - "POST /home-studies/{id}/check-expiry"
      - "POST /consent-records/{id}/finalize-consent"
      - "POST /post-placement-visits/{id}/mark-missed"
    shared_operations:
      - "GET /agencies/{id}"

  - name: Supervisor
    description: "Senior caseworker; opens cases, approves/returns home studies, accepts/declines/dissolves matches, manages placements, voids invoices"
    identity: "opaque"
    exclusive_operations:
      - "POST /cases"
      - "POST /home-studies/{id}/approve"
      - "POST /home-studies/{id}/return"
      - "POST /matches/{id}/accept"
      - "POST /matches/{id}/decline"
      - "POST /matches/{id}/dissolve"
      - "POST /placements"
      - "POST /placements/{id}/activate"
      - "POST /placements/{id}/finalize"
      - "POST /placements/{id}/disrupt"
      - "POST /agency-fee-invoices/{id}/void"
    shared_operations:
      - "GET (read endpoints across cases, families, home-studies, matches, consents, icpc, placements, visits, expenses, escrow, invoices)"

  - name: Caseworker
    description: "Front-line worker; registers families/birth-parents, authors home studies, proposes matches, collects/signs/revokes consent, drives ICPC paperwork, schedules/completes visits, logs expenses"
    identity: "opaque"
    exclusive_operations:
      - "POST /families"
      - "POST /home-studies"
      - "POST /home-studies/{id}/submit"
      - "POST /home-studies/{id}/resubmit"
      - "POST /birth-parents"
      - "POST /matches"
      - "POST /consent-records"
      - "POST /consent-records/{id}/sign"
      - "POST /consent-records/{id}/revoke"
      - "POST /icpc-clearances"
      - "POST /icpc-clearances/{id}/submit"
      - "POST /icpc-clearances/{id}/rework"
      - "POST /post-placement-visits"
      - "POST /post-placement-visits/{id}/complete"
      - "POST /counseling-sessions"
      - "POST /counseling-sessions/{id}/hold"
      - "POST /counseling-sessions/{id}/cancel"
      - "POST /expense-entries"
    shared_operations:
      - "GET (read endpoints across the case lifecycle)"

  - name: FinanceOfficer
    description: "Manages escrow and agency billing; approves/rejects/disburses expenses, records escrow transactions, issues and pays invoices"
    identity: "opaque"
    exclusive_operations:
      - "POST /expense-entries/{id}/approve"
      - "POST /expense-entries/{id}/reject"
      - "POST /expense-entries/{id}/disburse"
      - "POST /escrow-transactions"
      - "POST /agency-fee-invoices"
      - "POST /agency-fee-invoices/{id}/pay"
    shared_operations:
      - "GET (read endpoints for cases, families, expenses, escrow, invoices)"

  - name: CompactAdministrator
    description: "State ICPC compact administrator; renders sending/receiving approvals and rejections on interstate clearances"
    identity: "opaque"
    exclusive_operations:
      - "POST /icpc-clearances/{id}/approve-sending"
      - "POST /icpc-clearances/{id}/approve-receiving"
      - "POST /icpc-clearances/{id}/reject"
    shared_operations:
      - "GET /icpc-clearances, GET /icpc-clearances/{id}, GET /agencies/{id}"
