# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# CRA Performance Management. Enumerates every §1.1–§1.7 testable claim not
# already covered by §1.8; stubs mark claims covered there.
# =============================================================================
scaffold_corner_design:
  # ------------------------------------------------------------- entities
  - section: entities
    instances:
      - name: create_assessment_area_returns_defaults
        claim_type: creation
        grounds: ["entities.AssessmentArea"]
        distinguishing_aspect: "POST with all required fields returns 201, status DRAFT, version 1, confirmed_loan_count 0, qualified_cd_total_cents 0, effective_end_date null."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-E1", name: "Entity Area", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
          assert:
            - "http 201; status == DRAFT; version == 1"
            - "confirmed_loan_count == 0 and qualified_cd_total_cents == 0 and effective_end_date == null"
            - "id is a server-minted UUID; created_at/updated_at present"

      - name: create_assessment_area_missing_required_field_returns_400
        claim_type: required_fields
        grounds: ["entities.AssessmentArea.fields.area_code", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required area_code yields ERR_VALIDATION 400; nothing persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cra/assessment-areas"
              payload: { name: "No Code", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION with http 400"

      - name: assessment_area_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ASSESSMENT_AREA_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_ASSESSMENT_AREA_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /cra/assessment-areas/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: CRAOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ASSESSMENT_AREA_NOT_FOUND with http 404"

      - name: demographic_profile_computed_percentages
        claim_type: computed_fields
        grounds: ["calculations.demographic_pct", "entities.DemographicProfile.fields.lmi_population_pct"]
        distinguishing_aspect: "lmi_population_pct = round_half_up(4500/10000, 4) = 0.45; lmi_tract_pct = round_half_up((2+2)/10, 4) = 0.4; status CURRENT."
        test_recipe:
          setup: ["AssessmentArea ACTIVE"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-E2", name: "Demo Area", msa_code: "12060", state_code: "GA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id, aa_v: $.data.version }
          trigger:
            - call: "POST /cra/assessment-areas/${aa_id}/demographic-profiles"
              payload: { expected_assessment_area_version: "${aa_v}", data_year: 2020, total_tracts: 10, low_income_tracts: 2, moderate_income_tracts: 2, total_population: 10000, lmi_population: 4500, median_family_income: 60000 }
              as: CRAOfficer
          assert:
            - "lmi_population_pct == 0.45 and lmi_tract_pct == 0.4 and status == CURRENT"
            - "AssessmentArea version incremented from ${aa_v} to ${aa_v} + 1"

      - name: demographic_profile_zero_denominators_yield_zero
        claim_type: computed_fields
        grounds: ["calculations.demographic_pct"]
        distinguishing_aspect: "total_population 0 and total_tracts 0 produce pct 0 without division errors (empty-set edge of the aggregation)."
        test_recipe:
          setup: ["AssessmentArea DRAFT"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-E3", name: "Zero Area", msa_code: "12060", state_code: "GA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id, aa_v: $.data.version }
          trigger:
            - call: "POST /cra/assessment-areas/${aa_id}/demographic-profiles"
              payload: { expected_assessment_area_version: "${aa_v}", data_year: 2021, total_tracts: 0, low_income_tracts: 0, moderate_income_tracts: 0, total_population: 0, lmi_population: 0, median_family_income: 0 }
              as: CRAOfficer
          assert:
            - "http 201; lmi_population_pct == 0 and lmi_tract_pct == 0"

      - name: loan_record_computed_flags_and_reporting_year
        claim_type: computed_fields
        grounds: ["entities.LoanRecord.fields.small_revenue_flag", "entities.LoanRecord.fields.inside_assessment_area", "entities.LoanRecord.fields.reporting_year"]
        distinguishing_aspect: "revenue exactly 100000000 cents hits the inclusive $1MM threshold (small_revenue_flag true); reporting_year derives from action_date; inside_assessment_area derives from area tract membership."
        test_recipe:
          setup: ["AssessmentArea ACTIVE with tracts [T1, T2]"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-E4", name: "Loan Flags Area", msa_code: "19100", state_code: "TX", census_tracts: ["T1", "T2"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
          trigger:
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "SMALL_FARM", loan_amount_cents: 9000000, borrower_gross_annual_revenue_cents: 100000000, action_date: "2024-07-04", census_tract: "T1", tract_income_level: "MODERATE" }
              as: ComplianceAnalyst
              captures: { l1: $.data.id }
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "SMALL_FARM", loan_amount_cents: 9000000, borrower_gross_annual_revenue_cents: 100000001, action_date: "2024-07-05", census_tract: "T2", tract_income_level: "MIDDLE" }
              as: ComplianceAnalyst
              captures: { l2: $.data.id }
          assert:
            - "LoanRecord.${l1}: small_revenue_flag == true (100000000 <= 100000000 inclusive), lmi_geography_flag == true, inside_assessment_area == true, reporting_year == 2024, status == DRAFT"
            - "LoanRecord.${l2}: small_revenue_flag == false (100000001 > 100000000), lmi_geography_flag == false (MIDDLE)"

      - name: public_file_creation_defaults_incomplete
        claim_type: defaults
        grounds: ["entities.PublicFile"]
        distinguishing_aspect: "New public file defaults branch_list_current=true, aa_list_current=true, disclosure_statement_present=false, pending_comment_count=0, so posture computes INCOMPLETE."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cra/public-files"
              payload: { bank_name: "Default Bank" }
              as: CRAOfficer
              captures: { pf_id: $.data.id }
          assert:
            - "http 201; branch_list_current == true; aa_list_current == true; disclosure_statement_present == false; pending_comment_count == 0; posture == INCOMPLETE"

      - name: public_comment_creation_defaults
        claim_type: defaults
        grounds: ["entities.PublicComment"]
        distinguishing_aspect: "New comment starts RECEIVED with response_text null and received_at equal to the logical clock default 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["empty database (no PublicFile -> no pending-count cascade)"]
          setup_api_calls: []
          trigger:
            - call: "POST /cra/public-comments"
              payload: { commenter_name: "Jane Public", channel: "EMAIL", subject_area: "LENDING", content: "Please lend more in our neighborhood." }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
          assert:
            - "http 201; status == RECEIVED; response_text == null; received_at == 2026-08-01T00:00:00Z"

      - name: loan_record_list_pagination_and_status_filter
        claim_type: listing
        grounds: ["response_envelope", "endpoints"]
        distinguishing_aspect: "limit/offset paginate with total_count and has_more; status filter narrows the set; filter+pagination compose."
        test_recipe:
          setup: ["AssessmentArea ACTIVE with 3 DRAFT loan records"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-E5", name: "Paging Area", msa_code: "16980", state_code: "IL", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "SMALL_BUSINESS", loan_amount_cents: 100000, borrower_gross_annual_revenue_cents: 1000000, action_date: "2025-01-10", census_tract: "T1", tract_income_level: "LOW" }
              as: ComplianceAnalyst
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "SMALL_BUSINESS", loan_amount_cents: 100000, borrower_gross_annual_revenue_cents: 1000000, action_date: "2025-01-11", census_tract: "T1", tract_income_level: "LOW" }
              as: ComplianceAnalyst
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "SMALL_FARM", loan_amount_cents: 100000, borrower_gross_annual_revenue_cents: 1000000, action_date: "2025-01-12", census_tract: "T1", tract_income_level: "LOW" }
              as: ComplianceAnalyst
          trigger:
            - call: "GET /cra/assessment-areas/${aa_id}/loan-records"
              payload: { limit: 2, offset: 0 }
              as: ComplianceAnalyst
            - call: "GET /cra/assessment-areas/${aa_id}/loan-records"
              payload: { limit: 2, offset: 2 }
              as: ComplianceAnalyst
            - call: "GET /cra/assessment-areas/${aa_id}/loan-records"
              payload: { status: "CONFIRMED" }
              as: ComplianceAnalyst
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 item, total_count == 3, has_more == false"
            - "status=CONFIRMED filter: 0 items, total_count == 0, has_more == false"

      - name: loan_record_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: ["entities.LoanRecord.fields.loan_type", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "loan_type BIG_BUSINESS is not in the declared enum and is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["AssessmentArea ACTIVE"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-E6", name: "Enum Area", msa_code: "16980", state_code: "IL", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
          trigger:
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "BIG_BUSINESS", loan_amount_cents: 100000, borrower_gross_annual_revenue_cents: 1000000, action_date: "2025-01-10", census_tract: "T1", tract_income_level: "LOW" }
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION with http 400"

  # -------------------------------------------------------- state machines
  - section: state_machines
    instances:
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: ["state_machines.AssessmentArea", "state_machines.LoanRecord", "state_machines.CommunityDevelopmentActivity", "state_machines.Branch", "state_machines.ExamCycle", "state_machines.ExpansionApplication"]
        distinguishing_aspect: "Each entity is created in its declared initial state: area DRAFT, loan DRAFT, activity SUBMITTED, branch PROPOSED, exam SCHEDULED, application DRAFT."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-SM1", name: "Init Area", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
          trigger:
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "SMALL_BUSINESS", loan_amount_cents: 100000, borrower_gross_annual_revenue_cents: 1000000, action_date: "2025-01-10", census_tract: "T1", tract_income_level: "LOW" }
              as: ComplianceAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /cra/community-development-activities"
              payload: { assessment_area_id: "${aa_id}", activity_type: "CD_LOAN", amount_cents: 100000, primary_purpose_category: "ECONOMIC_DEVELOPMENT", lmi_benefit_pct: 0.60, activity_date: "2026-01-10" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { a_id: $.data.id }
            - call: "POST /cra/branches"
              payload: { branch_code: "BR-I", assessment_area_id: "${aa_id}", census_tract: "T1", tract_income_level: "LOW" }
              as: BankExecutive
              captures: { b_id: $.data.id }
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2024-01-01", evaluation_window_end: "2024-12-31" }
              as: BankExaminer
              captures: { e_id: $.data.id }
            - call: "POST /cra/expansion-applications"
              payload: { application_type: "MERGER", target_assessment_area_id: "${aa_id}" }
              as: BankExecutive
              captures: { x_id: $.data.id }
          assert:
            - "AssessmentArea.${aa_id}.status == DRAFT; LoanRecord.${l_id}.status == DRAFT; CommunityDevelopmentActivity.${a_id}.status == SUBMITTED"
            - "Branch.${b_id}.status == PROPOSED; ExamCycle.${e_id}.status == SCHEDULED; ExpansionApplication.${x_id}.status == DRAFT"

      - name: activate_already_active_area_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.AssessmentArea", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "activate names only DRAFT as from-state; calling it on an ACTIVE area fails with ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["AssessmentArea ACTIVE"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-SM2", name: "Twice Area", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
          trigger:
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; area remains ACTIVE"

      - name: mark_reported_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.LoanRecord", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "mark-reported requires CONFIRMED; a DRAFT loan cannot skip confirmation."
        test_recipe:
          setup: ["AssessmentArea ACTIVE; one DRAFT loan"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-SM3", name: "Skip Area", msa_code: "12060", state_code: "GA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "SMALL_BUSINESS", loan_amount_cents: 100000, borrower_gross_annual_revenue_cents: 1000000, action_date: "2025-01-10", census_tract: "T1", tract_income_level: "LOW" }
              as: ComplianceAnalyst
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /cra/loan-records/${l_id}/mark-reported"
              payload: {}
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; loan remains DRAFT"

      - name: retired_area_is_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.AssessmentArea", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RETIRED is terminal: begin-review on a RETIRED area fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["AssessmentArea RETIRED"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-SM4", name: "Terminal Area", msa_code: "19100", state_code: "TX", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/assessment-areas/${aa_id}/retire"
              payload: {}
              as: CRAOfficer
          trigger:
            - call: "POST /cra/assessment-areas/${aa_id}/begin-review"
              payload: {}
              as: CRAOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; area remains RETIRED"

      - name: finalized_exam_is_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ExamCycle", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "FINALIZED is terminal: appeal on a FINALIZED exam fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["AssessmentArea ACTIVE; PublicFile COMPLETE; exam FINALIZED (S/S/S -> 6.0 SATISFACTORY)"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-SM5", name: "Final Area", msa_code: "19100", state_code: "TX", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/public-files"
              payload: { bank_name: "Final Bank" }
              as: CRAOfficer
              captures: { pf_id: $.data.id }
            - call: "POST /cra/public-files/${pf_id}/refresh-items"
              payload: { disclosure_statement: true }
              as: CRAOfficer
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2024-01-01", evaluation_window_end: "2024-12-31" }
              as: BankExaminer
              captures: { ex_id: $.data.id }
            - call: "POST /cra/exam-cycles/${ex_id}/begin-data-collection"
              payload: {}
              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/begin-fieldwork"
              payload: {}
              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/assign-preliminary-rating"
              payload: { lending_test_rating: "SATISFACTORY", investment_test_rating: "SATISFACTORY", service_test_rating: "SATISFACTORY" }
              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/finalize"
              payload: {}
              as: BankExaminer
          trigger:
            - call: "POST /cra/exam-cycles/${ex_id}/appeal"
              payload: { appeal_reason: "too late" }
              as: CRAOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; exam remains FINALIZED"

      - name: closed_branch_is_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Branch", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal: open on a CLOSED branch fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["AssessmentArea ACTIVE; branch OPEN then CLOSED (notice 2026-04-01, 122 days)"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-SM6", name: "Branch Term Area", msa_code: "16980", state_code: "IL", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/branches"
              payload: { branch_code: "BR-T", assessment_area_id: "${aa_id}", census_tract: "T1", tract_income_level: "LOW" }
              as: BankExecutive
              captures: { br_id: $.data.id }
            - call: "POST /cra/branches/${br_id}/open"
              payload: {}
              as: BankExecutive
            - call: "POST /cra/branches/${br_id}/close"
              payload: { notice_posted_date: "2026-04-01" }
              as: BankExecutive
          trigger:
            - call: "POST /cra/branches/${br_id}/open"
              payload: {}
              as: BankExecutive
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; branch remains CLOSED"

      - name: exam_appeal_cycle_recomputes_composite
        claim_type: valid_transition
        grounds: ["state_machines.ExamCycle.PRELIMINARY_RATING_to_APPEALED", "state_machines.ExamCycle.APPEALED_to_FIELDWORK", "calculations.exam_composite_rating"]
        distinguishing_aspect: "The appeal loop PRELIMINARY_RATING -> APPEALED -> FIELDWORK -> PRELIMINARY_RATING recomputes the composite: S/S/N gives 5.0 SATISFACTORY first, then O/O/S gives 9.0 OUTSTANDING after re-assignment."
        test_recipe:
          setup: ["AssessmentArea ACTIVE; PublicFile COMPLETE; exam in PRELIMINARY_RATING with composite 5.0"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-SM7", name: "Appeal Area", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/public-files"
              payload: { bank_name: "Appeal Bank" }
              as: CRAOfficer
              captures: { pf_id: $.data.id }
            - call: "POST /cra/public-files/${pf_id}/refresh-items"
              payload: { disclosure_statement: true }
              as: CRAOfficer
            - call: "POST /cra/exam-cycles"
