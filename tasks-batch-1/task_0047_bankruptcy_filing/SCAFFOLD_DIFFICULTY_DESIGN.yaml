scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: means_test_at_median_vs_above_median_variant
        grounds:
          - calculations.means_test_evaluation
          - entities.MeansTest.fields.result
          - entities.MeansTest.fields.annualized_cmi_cents
        distinguishing_aspect: |
          On the MeansTest entity domain: the at_median_boundary variant (annualized_cmi == median, uses <=)
          yields PRESUMPTION_OK, whereas an income one cent above median falls through to the disposable
          screen and can yield PRESUMPTION_ABUSE — same formula, two outcomes from the boundary.
        test_recipe:
          setup:
            - "A debtor and a CHAPTER_13 case exist (so the income screen is exercised without the Chapter 7 petition gate)."
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "At Median Debtor", email: "atmedian@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 500000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { mt_id: $.data.id }
          assert:
            - "MeansTest.${mt_id}.annualized_cmi_cents == 6000000"
            - "MeansTest.${mt_id}.disposable_monthly_cents == 200000"
            - "MeansTest.${mt_id}.result == PRESUMPTION_OK"
            - "Case.${case_id}.means_test_result == PRESUMPTION_OK"

      - name: discharge_exemption_settlement_over_exempt_clamp_variant
        grounds:
          - calculations.discharge_exemption_settlement
          - entities.Case.fields.nonexempt_estate_cents
          - entities.Case.fields.total_exempt_value_cents
          - state_machines.Case.MEETING_HELD_to_DISCHARGED
        distinguishing_aspect: |
          On a DIFFERENT entity domain (Case/Schedule estate accounting, not MeansTest income): the
          over_exempt_clamped variant floors nonexempt_estate_cents at 0 when claimed exemptions exceed
          gross asset value, versus the normal variant gross - exempt > 0.
        test_recipe:
          setup:
            - "A Chapter 7 case reaches MEETING_HELD with Schedule A asset 500000 and Schedule C exemption 600000 (over-claimed); discharge triggers the clamp."
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Over Exempt Debtor", email: "overexempt@x.com", prior_discharge_within_8y: false }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T-OE" }
              as: Trustee
              captures: { tr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_7", state_code: "TX", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "A", description: "house", asset_value_cents: 500000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "C", description: "homestead exemption", claimed_exempt_value_cents: 400000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "C", description: "extra exemption", claimed_exempt_value_cents: 200000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /meetings"
              payload: { case_id: "${case_id}", trustee_id: "${tr_id}", room_code: "R-OE", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T10:00:00Z" }
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { mtg_id: $.data.id }
            - call: "POST /meetings/${mtg_id}/hold"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
          trigger:
            - call: "POST /cases/${case_id}/discharge"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
          assert:
            - "Case.${case_id}.total_exempt_value_cents == 600000"
            - "Case.${case_id}.nonexempt_estate_cents == 0"
            - "Case.${case_id}.status == DISCHARGED"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: means_test_three_input_nested_branch_mode_a
        grounds:
          - calculations.means_test_evaluation
          - entities.MeansTest.fields.result
        distinguishing_aspect: |
          MODE (a): a formula with three inputs (cmi_monthly_cents, monthly_expenses_cents,
          median_annual_income_cents) and a nested conditional — income screen first, then the
          60-month disposable projection vs ABUSE_FLOOR_CENTS only on the else branch.
        test_recipe:
          setup:
            - "A CHAPTER_13 case exists; means test inputs above median with high disposable income."
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Abuse Debtor", email: "abuse@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 600000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { mt_id: $.data.id }
          assert:
            - "MeansTest.${mt_id}.annualized_cmi_cents == 7200000"
            - "MeansTest.${mt_id}.disposable_monthly_cents == 300000"
            - "MeansTest.${mt_id}.result == PRESUMPTION_ABUSE"

      - name: waterfall_evaluation_order_fill_in_full_mode_c
        grounds:
          - calculations.chapter13_waterfall_distribution
          - entities.Debt.fields.allowed_amount_cents
          - entities.Plan.fields.paid_to_date_cents
        distinguishing_aspect: |
          MODE (c): the distribution is order-dependent — the explicit evaluation order
          (class_rank ASC, then created_at ASC) makes the result well-defined; a fund that runs dry
          mid-class fills earlier-created debts fully and later ones $0 (NOT pro-rata).
        test_recipe:
          setup:
            - "A confirmed Chapter 13 plan with paid_to_date 500000; case has PRIORITY 200000, SECURED 250000, two UNSECURED 100000 each (the first created before the second). Distribution exhausts the fund mid-UNSECURED."
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "WF Debtor", email: "wf@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T-WF" }
              as: Trustee
              captures: { tr_id: $.data.id }
            - call: "POST /creditors"
              payload: { name: "Cr WF" }
              as: Creditor
              captures: { cr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id, case_v0: $.data.version }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "PRIORITY", scheduled_amount_cents: 200000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { p_debt_id: $.data.id }
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "SECURED", scheduled_amount_cents: 250000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { s_debt_id: $.data.id }
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "UNSECURED", scheduled_amount_cents: 100000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { u1_debt_id: $.data.id }
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "UNSECURED", scheduled_amount_cents: 100000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { u2_debt_id: $.data.id }
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_v: $.data.version }
            - call: "POST /plans"
              payload: { case_id: "${case_id}", monthly_payment_cents: 50000, plan_duration_months: 36, expected_case_version: "${case_v}" }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/file-plan"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /meetings"
              payload: { case_id: "${case_id}", trustee_id: "${tr_id}", room_code: "R-WF", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T10:00:00Z" }
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { mtg_id: $.data.id }
            - call: "POST /meetings/${mtg_id}/hold"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
            - call: "POST /plans/${plan_id}/confirm-plan"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
            - call: "POST /plan-payments"
              payload: { plan_id: "${plan_id}", amount_cents: 500000 }
              as: Trustee
              as_user_id: "${tr_id}"
          trigger:
            - call: "GET /plans/${plan_id}/distribution"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { surplus: $.data.surplus_cents }
          assert:
            - "distribution.${p_debt_id} == 200000"
            - "distribution.${s_debt_id} == 250000"
            - "distribution.${u1_debt_id} == 50000"
            - "distribution.${u2_debt_id} == 0"
            - "GET /plans/${plan_id}/distribution .data.surplus_cents == 0"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: plan_revision_cycle_denied_then_new_draft
        grounds:
          - state_machines.Plan.FILED_to_DENIED
          - state_machines.Plan.DRAFT_to_FILED
          - entities.Plan.fields.is_active
        distinguishing_aspect: |
          CYCLE on the Plan entity: a FILED plan is DENIED (is_active->false), then the debtor creates a
          fresh DRAFT plan that supersedes it — the lifecycle loops back to DRAFT rather than running a
          one-way linear pipeline.
        test_recipe:
          setup:
            - "A CHAPTER_13 case in FILED with a filed plan that the trustee denies; the debtor then drafts a replacement."
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Cycle Debtor", email: "cycle@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T-cycle" }
              as: Trustee
              captures: { tr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_v1: $.data.version }
            - call: "POST /plans"
              payload: { case_id: "${case_id}", monthly_payment_cents: 50000, plan_duration_months: 36, expected_case_version: "${case_v1}" }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { plan1_id: $.data.id }
            - call: "POST /plans/${plan1_id}/file-plan"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /plans/${plan1_id}/deny-plan"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /plans"
              payload: { case_id: "${case_id}", monthly_payment_cents: 60000, plan_duration_months: 36, expected_case_version: "${case_v2}" }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { plan2_id: $.data.id }
          assert:
            - "Plan.${plan1_id}.status == DENIED"
            - "Plan.${plan1_id}.is_active == false"
            - "Plan.${plan2_id}.status == DRAFT"
            - "Plan.${plan2_id}.is_active == true"

      - name: case_branch_chapter7_vs_chapter13_after_meeting
        grounds:
          - state_machines.Case.MEETING_HELD_to_DISCHARGED
          - state_machines.Case.MEETING_HELD_to_CONFIRMED
          - entities.Case.fields.filed_chapter
        distinguishing_aspect: |
          BRANCHING fork on the Case entity: from MEETING_HELD a CHAPTER_7 case forks to DISCHARGED
          (wiping unsecured debts) while a CHAPTER_13 case forks to CONFIRMED — divergent side-effect
          sets per branch from the same source state, on a different entity than Plan.
        test_recipe:
          setup:
            - "A CHAPTER_7 case has reached MEETING_HELD with means_test_result PRESUMPTION_OK and an UNSECURED debt of 80000."
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Branch Debtor", email: "branch@x.com", prior_discharge_within_8y: false }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T-BR" }
              as: Trustee
              captures: { tr_id: $.data.id }
            - call: "POST /creditors"
              payload: { name: "Cr BR" }
              as: Creditor
              captures: { cr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_7", state_code: "NY", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "UNSECURED", scheduled_amount_cents: 80000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { u_debt_id: $.data.id }
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /meetings"
              payload: { case_id: "${case_id}", trustee_id: "${tr_id}", room_code: "R-BR", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { mtg_id: $.data.id }
            - call: "POST /meetings/${mtg_id}/hold"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
          trigger:
            - call: "POST /cases/${case_id}/discharge"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
          assert:
            - "Case.${case_id}.status == DISCHARGED"
            - "Case.${case_id}.stay_posture == TERMINATED"
            - "Debt.${u_debt_id}.allowed_amount_cents == 0"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: claim_allow_cascade_to_debt_ledger_then_distribution_depth3
        grounds:
          - state_machines.ClaimRecord.FILED_to_ALLOWED
          - entities.ClaimRecord.fields.allowed_amount_cents
          - entities.Debt.fields.allowed_amount_cents
          - calculations.chapter13_waterfall_distribution
        distinguishing_aspect: |
          Depth-3 cascade triggered by claim allowance: allowing a ClaimRecord (A) sets its
          allowed_amount_cents, which sets the linked Debt.allowed_amount_cents (B), which changes the
          waterfall distribution computed for the plan (C) — each hop caused by the previous one.
        test_recipe:
          setup:
            - "A confirmed Chapter 13 plan with paid_to_date 200000 and a single PRIORITY debt scheduled 150000; a creditor has filed a claim for 200000 on that debt that is still FILED, so the debt's allowed amount currently equals the scheduled 150000."
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Casc Debtor", email: "casc@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T-CA" }
              as: Trustee
              captures: { tr_id: $.data.id }
            - call: "POST /creditors"
              payload: { name: "Cr CA" }
              as: Creditor
              captures: { cr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "PRIORITY", scheduled_amount_cents: 150000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { p_debt_id: $.data.id }
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /claims"
              payload: { case_id: "${case_id}", debt_id: "${p_debt_id}", filed_by_creditor_id: "${cr_id}", claimed_amount_cents: 200000 }
              as: Creditor
              as_user_id: "${cr_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_v: $.data.version }
            - call: "POST /plans"
              payload: { case_id: "${case_id}", monthly_payment_cents: 200000, plan_duration_months: 36, expected_case_version: "${case_v}" }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/file-plan"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /meetings"
              payload: { case_id: "${case_id}", trustee_id: "${tr_id}", room_code: "R-CA", scheduled_start: "2026-07-03T09:00:00Z", scheduled_end: "2026-07-03T10:00:00Z" }
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { mtg_id: $.data.id }
            - call: "POST /meetings/${mtg_id}/hold"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
            - call: "POST /plans/${plan_id}/confirm-plan"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
            - call: "POST /plan-payments"
              payload: { plan_id: "${plan_id}", amount_cents: 200000 }
              as: Trustee
              as_user_id: "${tr_id}"
          trigger:
            - call: "POST /claims/${claim_id}/allow"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
          assert:
            - "ClaimRecord.${claim_id}.status == ALLOWED"
            - "ClaimRecord.${claim_id}.allowed_amount_cents == 200000"
            - "Debt.${p_debt_id}.allowed_amount_cents == 200000"
            - "GET /plans/${plan_id}/distribution .data.distribution.${p_debt_id} == 200000"
            - "GET /plans/${plan_id}/distribution .data.surplus_cents == 0"

      - name: dismiss_cascade_terminates_stay_and_moots_motion_depth2
        grounds:
          - state_machines.Case.FILED_to_DISMISSED
          - entities.Case.fields.stay_posture
          - state_machines.StayReliefMotion.PENDING_to_DENIED
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (dismiss, not claim allowance): dismissing the case (A)
          sets Case.stay_posture=TERMINATED and, as the dependent hop, flips every PENDING StayReliefMotion
          on the case to DENIED (B).
