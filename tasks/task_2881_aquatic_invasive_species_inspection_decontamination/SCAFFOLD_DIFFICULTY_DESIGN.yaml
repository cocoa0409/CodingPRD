              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Hauser Lake", state_code: "MT", water_body_class: "RESERVOIR", risk_tier: "MODERATE", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
