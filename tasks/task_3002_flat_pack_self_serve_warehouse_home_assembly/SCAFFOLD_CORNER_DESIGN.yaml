              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${o_seed}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${o_seed}/pickup-complete"
              payload: {}
              as: StoreOps
            - call: "POST /api/orders/${o_seed}/close"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - *k_order
            - call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${art_id}", qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/orders/${order_id}/checkout"
              payload: { redeem_points: 500 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub: $.data.subtotal_cents, pd: $.data.points_discount_cents, tot: $.data.total_cents }
            - call: "GET /api/customers/${cust_id}"
              payload: {}
              as: StoreOps
              captures: { bal: $.data.points_balance }
          assert:
            - "subtotal_cents == 1000 and points_discount_cents == 200 (cap floor(1000 x 0.20), not the requested 500)"
            - "total_cents == 800"
            - "Customer.${cust_id}.points_balance == 800 (1000 earned minus exactly 200 applied)"

      - name: points_accrual_zero_for_non_member
        claim_type: Correct Result
        grounds:
          - calculations.points_accrual
          - entities.Order.fields.points_earned
        distinguishing_aspect: "A non-member closing a 1000-cent order earns exactly 0 points — accrual is gated on member_status ACTIVE, not on having a customer record."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Non-member N. Article A stock 5. Order qty 2 checked out and FULFILLED (total 1000)."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - *k_art_a
            - *k_carton_a
            - *k_stock5
            - *k_order
            - call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${art_id}", qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - *k_checkout
            - *k_pickup
          trigger:
            - call: "POST /api/orders/${order_id}/close"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
