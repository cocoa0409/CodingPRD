          - errors[ERR_PLAN_FROZEN]
          - state_machines.EquityPlan.ACTIVE_to_FROZEN
          - state_machines.VestingTranche.UNVESTED_to_VESTED
        distinguishing_aspect: |
          Priority 42 is a conditional validation with an explicit endpoint list: freezing the
          plan refuses POST /grants/{id}/submit with ERR_PLAN_FROZEN while
          POST /vesting-tranches/{id}/vest on the same frozen plan still succeeds, so the rule
          is scoped rather than a blanket plan-level lock.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; ACTIVE plan with an OPEN window covering the clock."
            - "Grant A (RSU 1000) is GRANTED with an UNVESTED TIME tranche scheduled 2026-01-05; Grant B (RSU 500) is left in DRAFT."
            - "The plan is then frozen with action FREEZE."
