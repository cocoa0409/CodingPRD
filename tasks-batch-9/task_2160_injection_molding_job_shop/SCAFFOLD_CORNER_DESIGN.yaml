  - section: calculations
    instances:

      - name: quote_piece_price_correct_result_for_known_inputs
        claim_type: Correct Result
        grounds: ["calculations.quote_piece_price"]
        excluded_because:
          difficulty_instance: combinatorial_formula / quote_price_tiered_margin_ownership_branch_and_price_floor
          rationale: "That instance already pins 95, 34 and 12 cents against the three tier/ownership/floor paths of the same formula."

      - name: dual_variant_divergence_between_quoted_and_as_run
        claim_type: Variant Divergence
        grounds: ["calculations.quote_piece_price"]
        excluded_because:
          difficulty_instance: dual_variant_calc / quote_estimate_vs_as_run_actual_piece_price
          rationale: "Asserted there as the 95-versus-98 divergence with price_variance_cents == 3."

      - name: press_and_mold_interval_geometry
        claim_type: interval_merge
        grounds: ["calculations.press_window_overlap", "calculations.mold_window_overlap"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / press_half_open_window_needs_full_changeover_buffer
          rationale: "Both interval geometries are asserted at their exact boundaries by the two resource_temporal_overlap instances."

      - name: reversed_reports_are_excluded_from_every_job_rollup
