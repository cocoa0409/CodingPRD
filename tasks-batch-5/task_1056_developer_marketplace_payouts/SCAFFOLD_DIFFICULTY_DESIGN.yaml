              captures: { batch2_id: $.data.id, batch2_status: $.data.status }
            - call: "POST /api/payout-batches"
              payload: { payout_currency: "USD", period_start: "2026-07-15T00:00:00Z", period_end: "2026-08-15T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { err: $.data.error_id }
          assert:
            - "The touching batch is created with HTTP 201 and ${batch2_status} == OPEN"
            - "${err} == ERR_BATCH_PERIOD_OVERLAP"
            - "The overlapping request returns HTTP 409"
            - "GET /api/payout-batches with payout_currency USD returns exactly 2 batches"

      - name: pricing_plan_closed_window_cooldown_exact_boundary_accepted_shortfall_rejected
        grounds:
          - validations[priority=60]
          - errors[ERR_PRICING_WINDOW_CONFLICT]
          - entities.PricingPlan.fields.effective_from
          - entities.PricingPlan.fields.effective_to
        distinguishing_aspect: |
          Interval semantics B on a different resource entity (App / PricingPlan): CLOSED windows
          plus a PRICING_COOLDOWN_HOURS separation buffer. A plan starting exactly 24 hours after
          the previous plan's inclusive end is accepted, while one starting 12 hours after is
          rejected - adjacency alone is not enough, unlike the half-open batch rule.
        test_recipe:
          setup:
            - "US jurisdiction configured; verified ACTIVE developer owning a DRAFT app."
            - "One ACTIVE ONE_TIME plan on that app with the closed window 2026-07-01T00:00:00Z through 2026-07-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "US", vat_rate_bps: 0, marketplace_facilitator: true }
              as: PlatformAdmin
            - call: "POST /api/developers"
              payload: { legal_name: "Cooldown Co", email: "c@cool.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/apps"
              payload: { developer_id: "${dev_id}", name: "Cooldown", category: "PRODUCTIVITY", listed_countries: ["US"] }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/apps/${app_id}/pricing-plans"
              payload: { kind: "ONE_TIME", price_cents: 500, currency: "USD", country_code: "US", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-07-10T00:00:00Z", expected_app_version: "${app_v0}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { plan1_id: $.data.id }
            - call: "GET /api/apps/${app_id}"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_v1: $.data.version }
          trigger:
            - call: "POST /api/apps/${app_id}/pricing-plans"
              payload: { kind: "ONE_TIME", price_cents: 600, currency: "USD", country_code: "US", effective_from: "2026-07-11T00:00:00Z", effective_to: "2026-08-11T00:00:00Z", expected_app_version: "${app_v1}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { plan2_id: $.data.id, plan2_status: $.data.status }
            - call: "GET /api/apps/${app_id}"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_v2: $.data.version }
            - call: "POST /api/apps/${app_id}/pricing-plans"
              payload: { kind: "ONE_TIME", price_cents: 700, currency: "USD", country_code: "US", effective_from: "2026-08-11T12:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_app_version: "${app_v2}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "The exactly-24-hours-later plan is created with HTTP 201 and ${plan2_status} == ACTIVE"
            - "${err} == ERR_PRICING_WINDOW_CONFLICT"
            - "The 12-hours-later request returns HTTP 409"
            - "GET /api/apps/${app_id}/pricing-plans returns exactly 2 plans"

  - rule_id: compensating_invariant
    instances:
      - name: full_refund_closes_per_purchase_ledger_sum_at_zero
        grounds:
          - calculations.refund_reversal_split
          - state_machines.Purchase.CAPTURED_to_REFUNDED
          - state_machines.Purchase.AUTHORIZED_to_CAPTURED
          - entities.LedgerEntry.fields.amount_cents
          - entities.Refund.fields.developer_net_reversal_cents
        distinguishing_aspect: |
          Conserved quantity 1 - the PER-PURCHASE ledger sum. Capture writes ACCRUAL +1762 and the
          closing full refund writes REFUND_REVERSAL -1762 under the full-refund clamp, so
          sum(LedgerEntry.amount_cents where purchase_id == P) is exactly 0; without the clamp the
          independent rounding would leave a 1-cent drift.
        test_recipe:
          setup:
            - "US and DE jurisdictions configured (DE at 1900 bps, marketplace_facilitator true); BASE tier 7000 bps."
            - "Verified ACTIVE developer with a LIVE app and an ACTIVE USD plan."
            - "A DE purchase of three 999-cent lines captured: gross 2997, tax 480, base 2517, provisional net 1762."
            - "A refund for the full 2997 cents requested and APPROVED."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "US", vat_rate_bps: 0, marketplace_facilitator: true }
              as: PlatformAdmin
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "DE", vat_rate_bps: 1900, marketplace_facilitator: true }
              as: PlatformAdmin
            - call: "POST /api/revenue-share-tiers"
              payload: { label: "BASE", min_cumulative_base_cents: 0, developer_share_bps: 7000 }
              as: PlatformAdmin
            - call: "POST /api/developers"
              payload: { legal_name: "Clamp Works", email: "c@clamp.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/apps"
              payload: { developer_id: "${dev_id}", name: "Clamp", category: "PRODUCTIVITY", listed_countries: ["US", "DE"] }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/apps/${app_id}/pricing-plans"
              payload: { kind: "ONE_TIME", price_cents: 999, currency: "USD", country_code: "US", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_app_version: "${app_v0}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /api/apps/${app_id}/submit-for-review"
              payload: { submitted_notes: "v1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/review-submissions/${sub_id}/triage"
              payload: {}
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/review-submissions/${sub_id}/decision"
              payload: { outcome: "PASSED", decision_reason: "ok" }
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/apps/${app_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /api/purchases"
              payload: { app_id: "${app_id}", pricing_plan_id: "${plan_id}", buyer_country_code: "DE", external_order_ref: "ORD-CLAMP", line_items: [{ sku: "seat-a", unit_price_cents: 999, quantity: 1 }, { sku: "seat-b", unit_price_cents: 999, quantity: 1 }, { sku: "seat-c", unit_price_cents: 999, quantity: 1 }] }
              as: StorefrontService
              captures: { p_id: $.data.id, prov_net: $.data.provisional_developer_net_cents }
            - call: "POST /api/purchases/${p_id}/capture"
              payload: {}
              as: StorefrontService
              captures: { prov_net_after_capture: $.data.provisional_developer_net_cents }
            - call: "POST /api/purchases/${p_id}/refunds"
              payload: { amount_cents: 2997, reason: "BUYER_REQUEST" }
              as: StorefrontService
              captures: { r_id: $.data.id }
            - call: "POST /api/refunds/${r_id}/decide"
              payload: { outcome: "APPROVED" }
              as: FinanceOps
              as_user_id: "fin-1"
          trigger:
            - call: "POST /api/refunds/${r_id}/execute"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { tax_rev: $.data.tax_reversal_cents, net_rev: $.data.developer_net_reversal_cents }
          assert:
            - "${prov_net_after_capture} == 1762"
            - "${tax_rev} == 480"
            - "${net_rev} == 1762"
            - "GET /api/ledger-entries with purchase_id ${p_id} returns entries whose amount_cents sum to exactly 0"
            - "Purchase.${p_id}.payment_status == REFUNDED"
            - "Purchase.${p_id}.refunded_gross_cents == 2997"
            - "Developer.${dev_id}.unpaid_accrual_cents == 0"

      - name: chargeback_reversal_restores_developer_unsettled_accrual_balance
        grounds:
          - state_machines.Chargeback.LOST_to_REVERSED
          - state_machines.Chargeback.RECEIVED_to_LOST
          - entities.Developer.fields.unpaid_accrual_cents
          - entities.Developer.fields.negative_balance_cents
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Conserved quantity 2 - the DEVELOPER-LEVEL unsettled accrual balance, a different
          quantity from the per-purchase ledger sum. The LOST resolution debits 7000 and the
          REVERSED compensation credits 7000, so Developer.unpaid_accrual_cents returns to its
          exact pre-dispute value of 7000 with negative_balance_cents back at 0.
        test_recipe:
          setup:
            - "US jurisdiction at 0 bps facilitator; BASE tier 7000 bps; verified ACTIVE developer with tax_id_provided true."
            - "A LIVE app with a captured 10000-cent purchase (provisional net 7000), never paid out, so unpaid_accrual_cents is 7000."
            - "A chargeback of 10000 cents on that purchase already resolved LOST, taking unpaid_accrual_cents to 0."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "US", vat_rate_bps: 0, marketplace_facilitator: true }
              as: PlatformAdmin
            - call: "POST /api/revenue-share-tiers"
              payload: { label: "BASE", min_cumulative_base_cents: 0, developer_share_bps: 7000 }
              as: PlatformAdmin
            - call: "POST /api/developers"
              payload: { legal_name: "Reversal Rangers", email: "r@rev.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/apps"
              payload: { developer_id: "${dev_id}", name: "Rev App", category: "GAMES", listed_countries: ["US"] }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/apps/${app_id}/pricing-plans"
              payload: { kind: "ONE_TIME", price_cents: 10000, currency: "USD", country_code: "US", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_app_version: "${app_v0}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /api/apps/${app_id}/submit-for-review"
              payload: { submitted_notes: "v1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/review-submissions/${sub_id}/triage"
              payload: {}
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/review-submissions/${sub_id}/decision"
              payload: { outcome: "PASSED", decision_reason: "ok" }
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/apps/${app_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /api/purchases"
              payload: { app_id: "${app_id}", pricing_plan_id: "${plan_id}", buyer_country_code: "US", external_order_ref: "ORD-REV", line_items: [{ sku: "base", unit_price_cents: 10000, quantity: 1 }] }
              as: StorefrontService
              captures: { p_id: $.data.id }
            - call: "POST /api/purchases/${p_id}/capture"
              payload: {}
              as: StorefrontService
            - call: "GET /api/developers/${dev_id}"
              payload: {}
              as: PlatformAdmin
              captures: { accrual_before: $.data.unpaid_accrual_cents }
            - call: "POST /api/purchases/${p_id}/chargebacks"
              payload: { network_case_ref: "CB-REV-1", amount_cents: 10000 }
              as: StorefrontService
              captures: { cb_id: $.data.id }
            - call: "POST /api/chargebacks/${cb_id}/resolve"
              payload: { outcome: "LOST" }
              as: FinanceOps
              as_user_id: "fin-1"
            - call: "GET /api/developers/${dev_id}"
              payload: {}
              as: PlatformAdmin
              captures: { accrual_mid: $.data.unpaid_accrual_cents }
          trigger:
            - call: "POST /api/chargebacks/${cb_id}/reverse"
              payload: { reason: "issuer reversed the dispute" }
              as: FinanceOps
              as_user_id: "fin-1"
          assert:
            - "${accrual_before} == 7000"
            - "${accrual_mid} == 0"
            - "Chargeback.${cb_id}.status == REVERSED"
            - "Developer.${dev_id}.unpaid_accrual_cents == 7000"
            - "Developer.${dev_id}.negative_balance_cents == 0"
            - "Developer.${dev_id}.payout_hold == false"
            - "Purchase.${p_id}.payment_status == CAPTURED"
            - "Purchase.${p_id}.settlement_status == ACCRUED"
            - "GET /api/ledger-entries with purchase_id ${p_id} and entry_type CLAWBACK_REVERSAL returns exactly one entry with amount_cents == 7000"
