            - call: "POST /qdro-cases/${case_id}/attorney-authorizations"
              payload: { represents: "ALTERNATE_PAYEE", attorney_name: "Twice Revoked", attorney_bar_number: "BAR-4", attorney_email: "tr@bar.example", disclosure_scope: "LIMITED", effective_from: "2026-08-01", expires_at: "2027-08-01T00:00:00Z" }
              as: QdroAnalyst
