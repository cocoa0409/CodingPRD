            - call: "POST /api/swap-requests/${sw2_id}/claim"
              as: Physician
              as_user_id: "${p2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "claim at exactly window_start - 48h accepted: swap status == CLAIMED (captured ${claim1_status})"
            - "claim with lead 47h59m59s rejected with ERR_SWAP_CUTOFF_VIOLATION (captured ${err})"
            - "SwapRequest.${sw2_id} remains POSTED with claimant_physician_id == null"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: swap_approve_requires_assignment_still_scheduled
        grounds:
          - state_machines.SwapRequest.CLAIMED_to_APPROVED
          - state_machines.CallAssignment.SCHEDULED_to_SERVED
          - errors[ERR_SWAP_ASSIGNMENT_NOT_SCHEDULED]
        distinguishing_aspect: |
          Entity pair SwapRequest -> CallAssignment: approval of a CLAIMED swap is gated on the
          referenced assignment still being SCHEDULED; once the offerer's assignment was served
          (clock past window end + mark-served), approve fails with
          ERR_SWAP_ASSIGNMENT_NOT_SCHEDULED. Distinct pair from CallAssignment -> CallProgram.
        test_recipe:
          setup:
            - "PUBLISHED program covering only 2026-09-08, 1 weekday primary; P1 assigned; swap POSTED then CLAIMED by P2 at the default clock 2026-08-01T00:00:00Z (cutoff satisfied)"
            - "Clock advanced to 2026-09-09T08:00:00Z and the offered assignment marked SERVED"
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Stale Swap", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Alvarez", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Becker", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p2_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot_id: $.data.0.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_id}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/swap-requests"
              payload: { assignment_id: "${a_id}" }
              as: Physician
              as_user_id: "${p1_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /api/swap-requests/${sw_id}/claim"
              as: Physician
              as_user_id: "${p2_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T08:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a_id}/mark-served"
              as: SchedulerAdmin
              captures: { a_status: $.data.status }
          trigger:
            - call: "POST /api/swap-requests/${sw_id}/approve"
              as: ChiefOfStaff
              captures: { err: $.data.error_id }
          assert:
            - "offered assignment is SERVED (captured ${a_status}) while the swap is CLAIMED"
            - "approve rejected with ERR_SWAP_ASSIGNMENT_NOT_SCHEDULED (captured ${err})"
            - "swap remains CLAIMED"

      - name: manual_assignment_requires_program_published
        grounds:
          - state_machines.CallProgram.GENERATED_to_PUBLISHED
          - validations[priority=6]
          - errors[ERR_PROGRAM_NOT_PUBLISHED]
        distinguishing_aspect: |
          Entity pair CallAssignment -> CallProgram: manual backfill is gated on the parent
          program being PUBLISHED; while the program is still GENERATED the create fails with
          ERR_PROGRAM_NOT_PUBLISHED. Distinct pair from SwapRequest -> CallAssignment.
        test_recipe:
          setup:
            - "Program covering only 2026-09-08 in GENERATED state (never published); generation ran with zero physicians so the single slot is OPEN"
            - "P1 STAFF cardiologist registered"
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Unpublished", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Alvarez", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot_id: $.data.0.id }
          trigger:
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_id}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "create rejected with ERR_PROGRAM_NOT_PUBLISHED (captured ${err})"
            - "slot remains OPEN and no assignment is created (GET /api/call-assignments?slot_id=${slot_id} returns empty)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: unavailability_window_closed_interval_touching_conflict
        grounds:
          - state_machines.UnavailabilityWindow.REQUESTED_to_APPROVED
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource: a physician's unavailability calendar; semantics: CLOSED date intervals —
          window A 2026-09-05..2026-09-10 and window B 2026-09-10..2026-09-12 share the single
          date 2026-09-10 and that touching endpoint alone triggers ERR_WINDOW_OVERLAP, while
          window C starting 2026-09-11 is accepted. Distinct interval semantics from the
          half-open assignment windows.
        test_recipe:
          setup:
            - "P1 (STAFF) has APPROVED window 2026-09-05..2026-09-10"
            - "P1 has REQUESTED windows 2026-09-10..2026-09-12 (touching) and 2026-09-11..2026-09-13 (disjoint)"
          setup_api_calls:
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Alvarez", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/unavailability-windows"
              payload: { physician_id: "${p1_id}", start_date: "2026-09-05", end_date: "2026-09-10", kind: "VACATION" }
              as: Physician
              as_user_id: "${p1_id}"
              captures: { w1_id: $.data.id }
            - call: "POST /api/unavailability-windows/${w1_id}/approve"
              as: SchedulerAdmin
            - call: "POST /api/unavailability-windows"
              payload: { physician_id: "${p1_id}", start_date: "2026-09-10", end_date: "2026-09-12", kind: "CME" }
              as: Physician
              as_user_id: "${p1_id}"
              captures: { w2_id: $.data.id }
            - call: "POST /api/unavailability-windows"
              payload: { physician_id: "${p1_id}", start_date: "2026-09-11", end_date: "2026-09-13", kind: "PERSONAL" }
              as: Physician
              as_user_id: "${p1_id}"
              captures: { w3_id: $.data.id }
          trigger:
            - call: "POST /api/unavailability-windows/${w2_id}/approve"
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
            - call: "POST /api/unavailability-windows/${w3_id}/approve"
              as: SchedulerAdmin
              captures: { w3_status: $.data.status }
          assert:
            - "window B (sharing only the closed endpoint 2026-09-10) rejected with ERR_WINDOW_OVERLAP (captured ${err})"
            - "window B remains REQUESTED"
            - "window C (2026-09-11..2026-09-13, first disjoint date after the closed window) approved: status == APPROVED (captured ${w3_status})"

      - name: assignment_half_open_adjacency_allowed_same_day_conflict
        grounds:
          - validations[priority=9]
          - errors[ERR_ASSIGNMENT_OVERLAP]
        distinguishing_aspect: |
          Resource: a physician's assignment schedule; semantics: HALF-OPEN datetime windows
          [dateT07:00, date+1T07:00) — back-to-back calls on 2026-09-08 and 2026-09-09 touch at
          2026-09-09T07:00:00Z and are allowed, while two same-day slots (identical windows)
          conflict. Distinct interval semantics (adjacency allowed) and resource from the
          closed-interval unavailability rule.
        test_recipe:
          setup:
            - "PUBLISHED program 2026-09-08..2026-09-10, 2 weekday primaries per day (position_index 1 and 2), budget 5000000"
            - "P1 STAFF with moonlight_cap_hours 192 already assigned to 09-08 pos1 and 09-09 pos1 (adjacent windows, both accepted) and to 09-10 pos1"
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Adjacency", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-10", payroll_budget_cents: 5000000, weekday_primary_required: 2, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Alvarez", specialty: "CARDIOLOGY", employment_type: "STAFF", moonlight_cap_hours: 192 }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { s_0908_p1: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-09"
              as: SchedulerAdmin
              captures: { s_0909_p1: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-10"
              as: SchedulerAdmin
              captures: { s_0910_p1: $.data.0.id, s_0910_p2: $.data.1.id }
          trigger:
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${s_0908_p1}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a1: $.data.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${s_0909_p1}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a2: $.data.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${s_0910_p1}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a3: $.data.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${s_0910_p2}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "09-08 and 09-09 assignments accepted (captures ${a1}, ${a2}): windows touch at 2026-09-09T07:00:00Z but half-open adjacency is not an overlap"
            - "09-10 position 1 accepted (captured ${a3})"
            - "09-10 position 2 (identical window) rejected with ERR_ASSIGNMENT_OVERLAP (captured ${err})"

  - rule_id: compensating_invariant
    instances:
      - name: fairness_points_conserved_under_swap_execute
        grounds:
          - calculations.fairness_points
          - state_machines.SwapRequest.APPROVED_to_EXECUTED
          - state_machines.CallAssignment.SCHEDULED_to_SWAPPED
        distinguishing_aspect: |
          Conserved quantity: program-wide total prospective fairness points. Swap execute moves
          the holiday slot's 3.0 points from offerer to claimant (SWAPPED leaves the prospective
          status set, the replacement SCHEDULED enters it); total stays 6.0 before and after.
        test_recipe:
          setup:
            - "PUBLISHED program 2026-09-07..2026-09-12, holiday_dates [2026-09-07], 1 primary per holiday/weekday/weekend day, budget 5000000"
            - "A assigned to 2026-09-07 (HOLIDAY, 3.0) and 2026-09-08 (weekday, 1.0); B assigned to 2026-09-12 (Saturday, 2.0); total prospective 6.0"
            - "A has offered the holiday assignment; B has claimed; ChiefOfStaff approved (post-swap: A 1.0, B 5.0, mean 3.0, 5.0 <= 3.0 + 4.0 band)"
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Conservation", service_line: "CARDIOLOGY", period_start: "2026-09-07", period_end: "2026-09-12", holiday_dates: ["2026-09-07"], payroll_budget_cents: 5000000, weekday_primary_required: 1, weekend_primary_required: 1, holiday_primary_required: 1, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Alvarez", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Becker", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { pb_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-07"
              as: SchedulerAdmin
              captures: { slot_hol: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot_wd: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-12"
              as: SchedulerAdmin
              captures: { slot_we: $.data.0.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_hol}", physician_id: "${pa_id}" }
              as: SchedulerAdmin
              captures: { a_hol: $.data.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_wd}", physician_id: "${pa_id}" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_we}", physician_id: "${pb_id}" }
              as: SchedulerAdmin
            - call: "GET /api/call-programs/${prog_id}/fairness-report"
              as: SchedulerAdmin
              captures: { tot_before: $.data.total_prospective_points }
            - call: "POST /api/swap-requests"
              payload: { assignment_id: "${a_hol}" }
              as: Physician
              as_user_id: "${pa_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /api/swap-requests/${sw_id}/claim"
              as: Physician
              as_user_id: "${pb_id}"
            - call: "POST /api/swap-requests/${sw_id}/approve"
              as: ChiefOfStaff
          trigger:
            - call: "POST /api/swap-requests/${sw_id}/execute"
              as: SchedulerAdmin
            - call: "GET /api/call-programs/${prog_id}/fairness-report"
              as: SchedulerAdmin
              captures: { tot_after: $.data.total_prospective_points, mean_after: $.data.mean_prospective_points }
          assert:
            - "total_prospective_points before execute == 6.0 (captured ${tot_before})"
            - "total_prospective_points after execute == 6.0 (captured ${tot_after}) — transfer conserves the program total"
            - "entry for ${pa_id}: prospective_points 4.0 before -> 1.0 after (holiday 3.0 transferred out)"
            - "entry for ${pb_id}: prospective_points 2.0 before -> 5.0 after"
            - "mean_prospective_points after == 3.0 (captured ${mean_after})"

      - name: payroll_reserve_conserved_under_cancel_then_backfill
        grounds:
          - calculations.program_payroll_total
          - state_machines.CallAssignment.SCHEDULED_to_CANCELLED
          - entities.CallProgram.fields.payroll_reserved_cents
        distinguishing_aspect: |
          Conserved quantity: payroll_reserved_cents. Create (reserve +50000) paired with its
          compensating cancel (reserve -50000) returns the reservation to exactly 0, and the
          replacement backfill re-debits exactly 50000 — a fiscal conserved quantity, distinct
          from fairness points.
        test_recipe:
          setup:
            - "PUBLISHED program 2026-09-08..2026-09-09, 1 primary per weekday, budget 100000; P1 and P2 STAFF cardiologists"
            - "payroll_reserved_cents observed at 0 after publish"
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Reserve", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-09", payroll_budget_cents: 100000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
              captures: { r0: $.data.payroll_reserved_cents }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Alvarez", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Becker", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p2_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot_id: $.data.0.id }
          trigger:
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_id}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a1_id: $.data.id }
            - call: "GET /api/call-programs/${prog_id}"
              as: SchedulerAdmin
              captures: { r1: $.data.payroll_reserved_cents }
            - call: "POST /api/call-assignments/${a1_id}/cancel"
              as: SchedulerAdmin
            - call: "GET /api/call-programs/${prog_id}"
              as: SchedulerAdmin
              captures: { r2: $.data.payroll_reserved_cents }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_id}", physician_id: "${p2_id}" }
              as: SchedulerAdmin
              captures: { a2_id: $.data.id }
            - call: "GET /api/call-programs/${prog_id}"
              as: SchedulerAdmin
              captures: { r3: $.data.payroll_reserved_cents }
            - call: "GET /api/coverage-gaps?slot_id=${slot_id}"
              as: SchedulerAdmin
              captures: { gap_status: $.data.0.status, gap_resolver: $.data.0.resolved_by_assignment_id }
          assert:
            - "reserve sequence: 0 after publish (${r0}), 50000 after P1 assignment (${r1}), 0 after cancel (${r2}), 50000 after P2 backfill (${r3})"
            - "create + cancel are exact compensating actions on payroll_reserved_cents (50000 - 50000 == 0 drift)"
            - "gap created by the cancel is RESOLVED with resolved_by_assignment_id == ${a2_id} (captured ${gap_status}, ${gap_resolver})"
            - "cancelled assignment ${a1_id} remains CANCELLED (no resurrection)"
