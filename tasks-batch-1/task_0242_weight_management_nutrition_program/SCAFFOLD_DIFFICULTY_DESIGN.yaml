# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 Difficulty Rules x 2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.6; every setup_api_calls
# chain drives empty-DB -> precondition using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: progress_scale_vs_lean_adjusted_diverge_on_member
        grounds:
          - calculations.scale_progress_pct
          - calculations.lean_adjusted_progress_pct
          - entities.Member.fields.scale_progress_pct
          - entities.Member.fields.lean_adjusted_progress_pct
        distinguishing_aspect: |
          On the SAME Member (baseline 95kg, latest counted weigh-in 90kg @ 25% body-fat),
          scale_progress_pct == 52.63 (raw scale delta) while lean_adjusted_progress_pct == 63.16
          (fat-mass-only delta) — two valid algorithms, different numbers, both on the Member domain.
        test_recipe:
          setup:
            - "Program with member (height 170cm), APPROVED intake at 95kg -> baseline 95kg, enrollment ACTIVE."
            - "One counted weigh-in at 90kg with body_fat_pct 25 -> latest_weight 90, latest_lean_mass 67.5."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P", coach_max_active_members: 50 }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "COACHING", name: "Coaching", monthly_fee_cents: 6000, enrollment_fee_cents: 2500 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "M", email: "m1@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_id: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_id}", weight_kg: 95 }, as: Member, as_user_id: "${mem_id}", captures: { intake_id: $.data.id } }
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /wm/intake-assessments/${intake_id}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${intake_id}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_id}", plan_id: "${plan_id}", intake_assessment_id: "${intake_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /wm/enrollments/${enr_id}/activate", payload: {}, as: ProgramAdmin, captures: { enr_v: $.data.version } }
            - { call: "POST /wm/weigh-ins", payload: { enrollment_id: "${enr_id}", weight_kg: 90, body_fat_pct: 25, counts: true, expected_enrollment_version: "${enr_v}" }, as: Coach, captures: { wi_id: $.data.id } }
          trigger:
            - { call: "GET /wm/members/${mem_id}", payload: {}, as: ProgramAdmin, captures: { sp: $.data.scale_progress_pct, lp: $.data.lean_adjusted_progress_pct } }
          assert:
            - "Member.${mem_id}.scale_progress_pct == 52.63"
            - "Member.${mem_id}.lean_adjusted_progress_pct == 63.16"
            - "Member.${mem_id}.scale_progress_pct != Member.${mem_id}.lean_adjusted_progress_pct"

      - name: invoice_provisional_full_vs_final_prorated_on_invoice
        grounds:
          - calculations.invoice_total
          - calculations.invoice_proration
          - entities.Invoice.fields.subtotal_cents
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
        distinguishing_aspect: |
          On the Invoice domain: cycle-0 invoice carries the full provisional charge (subtotal 8500 =
          6000 recurring + 2500 enrollment), while withdrawing 10 days into a 30-day cycle issues a
          final settlement invoice whose PRORATION_CREDIT == -4000 (daily rate 200 * 20 unused days).
        test_recipe:
          setup:
            - "ACTIVE enrollment, plan monthly 6000 + enrollment_fee 2500, cycle 30 days, clock at activation epoch."
            - "Clock advanced 10 days after activation, then withdraw."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/programs/${prog_id}/clock-set", payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }, as: ProgramAdmin }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "COACHING", name: "C", monthly_fee_cents: 6000, enrollment_fee_cents: 2500 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "M", email: "m2@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_id: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_id}", weight_kg: 95 }, as: Member, as_user_id: "${mem_id}", captures: { intake_id: $.data.id } }
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /wm/intake-assessments/${intake_id}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${intake_id}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_id}", plan_id: "${plan_id}", intake_assessment_id: "${intake_id}", cycle_length_days: 30 }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /wm/enrollments/${enr_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "GET /wm/invoices?enrollment_id=${enr_id}", payload: {}, as: BillingAgent, captures: { cyc0_sub: "$.data[0].subtotal_cents" } }
            - { call: "POST /wm/programs/${prog_id}/clock-set", payload: { to_iso8601: "2026-01-11T00:00:00.000Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /wm/enrollments/${enr_id}/withdraw", payload: {}, as: ProgramAdmin }
          assert:
            - "the cycle-0 Invoice subtotal_cents == 8500"
            - "the final settlement Invoice (cycle_index 1) has a PRORATION_CREDIT line amount_cents == -4000 and prorated == true"
            - "Member.${mem_id}.account_balance_cents == 4000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: eligibility_composite_score_nonlinear_three_inputs
        grounds:
          - calculations.eligibility_composite_score
          - entities.EligibilityDetermination.fields.composite_score
          - validations[priority=19]
        distinguishing_aspect: |
          Mode (a): composite_score = min(40,max(0,(bmi-25)*4)) + min(30,c*15) + tier_pts, a >=3-input
          formula with nested min/max and a conditional tier branch. For BMI 32.9, comorbidity 0, RX tier:
          31.6 + 0 + 20 == 51.6.
        test_recipe:
          setup:
            - "Member height 170, APPROVED intake 95kg (BMI 32.9), comorbidity 0; RX plan enrollment."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "RX", name: "Rx", monthly_fee_cents: 9000 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "M", email: "m3@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_id: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_id}", weight_kg: 95, comorbidity_count: 0 }, as: Member, as_user_id: "${mem_id}", captures: { intake_id: $.data.id } }
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /wm/intake-assessments/${intake_id}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${intake_id}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_id}", plan_id: "${plan_id}", intake_assessment_id: "${intake_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
          trigger:
            - { call: "POST /wm/eligibility-determinations", payload: { member_id: "${mem_id}", enrollment_id: "${enr_id}" }, as: Clinician, captures: { det_id: $.data.id, score: $.data.composite_score } }
          assert:
            - "EligibilityDetermination.${det_id}.composite_score == 51.6"

      - name: invoice_round_per_line_then_sum_order_pinned
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.line_items
          - entities.Invoice.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b): the cycle-0 invoice rounds each line independently (RECURRING_FEE round(7001)=7001,
          ENROLLMENT_FEE round(2499)=2499) THEN sums to 9500 — the pinned round-per-line-then-sum order;
          a sum-then-round implementation would also reach 9500 here only because both lines are already
          integers, so the structural claim is that each line_items[].amount_cents is the rounded line.
        test_recipe:
          setup:
            - "Plan monthly 7001, enrollment_fee 2499; activate enrollment -> cycle-0 invoice."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "MEAL", name: "Meal", monthly_fee_cents: 7001, enrollment_fee_cents: 2499 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "M", email: "m4@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_id: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_id}", weight_kg: 95 }, as: Member, as_user_id: "${mem_id}", captures: { intake_id: $.data.id } }
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /wm/intake-assessments/${intake_id}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${intake_id}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_id}", plan_id: "${plan_id}", intake_assessment_id: "${intake_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /wm/enrollments/${enr_id}/activate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "GET /wm/invoices?enrollment_id=${enr_id}", payload: {}, as: BillingAgent, captures: { sub: "$.data[0].subtotal_cents" } }
          assert:
            - "the cycle-0 Invoice has line_items containing {code: RECURRING_FEE, amount_cents: 7001} and {code: ENROLLMENT_FEE, amount_cents: 2499}"
            - "the cycle-0 Invoice subtotal_cents == 9500"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: intake_assessment_revision_cycle_increments_round
        grounds:
          - state_machines.IntakeAssessment.UNDER_REVIEW_to_NEEDS_REVISION
          - state_machines.IntakeAssessment.NEEDS_REVISION_to_SUBMITTED
          - entities.IntakeAssessment.fields.revision_round
        distinguishing_aspect: |
          IntakeAssessment is cyclic: SUBMITTED -> UNDER_REVIEW -> NEEDS_REVISION -> SUBMITTED, and a full
          loop increments revision_round to 1 (vs 0 on first submission) — a cycle on the IntakeAssessment entity.
        test_recipe:
          setup:
            - "Intake submitted, reviewed, revision requested, then resubmitted (one full cycle)."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "M", email: "m5@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_id: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_id}", weight_kg: 95 }, as: Member, as_user_id: "${mem_id}", captures: { intake_id: $.data.id } }
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /wm/intake-assessments/${intake_id}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${intake_id}/request-revision", payload: { review_notes: "please re-weigh" }, as: Clinician }
          trigger:
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: { weight_kg: 94 }, as: Member, as_user_id: "${mem_id}", captures: { st: $.data.status, rr: $.data.revision_round } }
          assert:
            - "IntakeAssessment.${intake_id}.status == SUBMITTED"
            - "IntakeAssessment.${intake_id}.revision_round == 1"

      - name: enrollment_parallel_billing_dimension_moves_independently
        grounds:
          - state_machines.Enrollment.CURRENT_to_PAST_DUE
          - entities.Enrollment.fields.clinical_status
          - entities.Enrollment.fields.billing_status
        distinguishing_aspect: |
          Enrollment carries two parallel dimensions: marking an invoice past-due moves billing_status
          CURRENT -> PAST_DUE while clinical_status stays ACTIVE (independent axes on one entity).
        test_recipe:
          setup:
            - "ACTIVE enrollment with cycle-0 ISSUED invoice; clinical_status ACTIVE, billing_status CURRENT."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "M", email: "m6@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_id: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_id}", weight_kg: 95 }, as: Member, as_user_id: "${mem_id}", captures: { intake_id: $.data.id } }
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /wm/intake-assessments/${intake_id}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${intake_id}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_id}", plan_id: "${plan_id}", intake_assessment_id: "${intake_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /wm/enrollments/${enr_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "GET /wm/invoices?enrollment_id=${enr_id}", payload: {}, as: BillingAgent, captures: { inv0: "$.data[0].id" } }
          trigger:
            - { call: "POST /wm/invoices/${inv0}/mark-past-due", payload: {}, as: BillingAgent }
          assert:
            - "Enrollment.${enr_id}.billing_status == PAST_DUE"
            - "Enrollment.${enr_id}.clinical_status == ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: graduate_cascade_depth3_goal_milestone_assignment_thread
        grounds:
          - state_machines.Enrollment.ACTIVE_to_GRADUATED
          - state_machines.Goal.OPEN_to_CLOSED
          - state_machines.Milestone.PENDING_to_VOIDED
          - state_machines.CoachAssignment.ACTIVE_to_ENDED
          - state_machines.MessageThread.OPEN_to_ARCHIVED
        distinguishing_aspect: |
          Depth>=3 chain triggered by graduate: enrollment->GRADUATED CLOSES the (non-achieved SECONDARY)
          Goal; that goal-closure VOIDs its PENDING Milestone; the closure step then ENDS the ACTIVE
          CoachAssignment; that ENDED step ARCHIVES the OPEN MessageThread. Each link caused by the prior.
        test_recipe:
          setup:
            - "ACTIVE enrollment, baseline 95kg; PRIMARY goal target 90 ACHIEVED via weigh-in at 90 (>=3 counted weigh-ins for graduation_eligible)."
            - "A SECONDARY OPEN goal target 80 with a PENDING 25% milestone; an ACTIVE coach assignment with an OPEN message thread."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /wm/coaches", payload: { program_id: "${prog_id}", full_name: "Co", email: "co1@x.com" }, as: ProgramAdmin, captures: { coach_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "M", email: "m7@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_id: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_id}", weight_kg: 95 }, as: Member, as_user_id: "${mem_id}", captures: { intake_id: $.data.id } }
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /wm/intake-assessments/${intake_id}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${intake_id}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_id}", plan_id: "${plan_id}", intake_assessment_id: "${intake_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /wm/enrollments/${enr_id}/activate", payload: {}, as: ProgramAdmin, captures: { enr_v0: $.data.version } }
            - { call: "POST /wm/goals", payload: { enrollment_id: "${enr_id}", kind: "PRIMARY", target_weight_kg: 90 }, as: Coach, as_user_id: "${coach_id}", captures: { pgoal_id: $.data.id } }
            - { call: "POST /wm/goals", payload: { enrollment_id: "${enr_id}", kind: "SECONDARY", target_weight_kg: 80 }, as: Coach, as_user_id: "${coach_id}", captures: { sgoal_id: $.data.id } }
            - { call: "POST /wm/milestones", payload: { goal_id: "${sgoal_id}", threshold_pct: 50 }, as: Coach, as_user_id: "${coach_id}", captures: { ms_id: $.data.id } }
            - { call: "POST /wm/coach-assignments", payload: { enrollment_id: "${enr_id}", coach_id: "${coach_id}" }, as: ProgramAdmin, captures: { asg_id: $.data.id } }
            - { call: "POST /wm/message-threads", payload: { coach_assignment_id: "${asg_id}", subject: "hi" }, as: Coach, as_user_id: "${coach_id}", captures: { thr_id: $.data.id } }
            - { call: "POST /wm/weigh-ins", payload: { enrollment_id: "${enr_id}", weight_kg: 92, counts: true, expected_enrollment_version: "${enr_v0}" }, as: Coach, as_user_id: "${coach_id}" }
            - { call: "GET /wm/enrollments/${enr_id}", payload: {}, as: ProgramAdmin, captures: { enr_v_a: $.data.version } }
            - { call: "POST /wm/weigh-ins", payload: { enrollment_id: "${enr_id}", weight_kg: 91, counts: true, expected_enrollment_version: "${enr_v_a}" }, as: Coach, as_user_id: "${coach_id}" }
            - { call: "GET /wm/enrollments/${enr_id}", payload: {}, as: ProgramAdmin, captures: { enr_v_b: $.data.version } }
            - { call: "POST /wm/weigh-ins", payload: { enrollment_id: "${enr_id}", weight_kg: 90, counts: true, expected_enrollment_version: "${enr_v_b}" }, as: Coach, as_user_id: "${coach_id}" }
          trigger:
            - { call: "POST /wm/enrollments/${enr_id}/graduate", payload: {}, as: ProgramAdmin }
          assert:
            - "Goal.${sgoal_id}.status == CLOSED"
            - "Milestone.${ms_id}.status == VOIDED"
            - "CoachAssignment.${asg_id}.status == ENDED"
            - "MessageThread.${thr_id}.status == ARCHIVED"
            - "Coach.${coach_id}.active_member_count == 0"

      - name: counted_weighin_cascade_depth2_goal_progress_milestone
        grounds:
          - state_machines.Goal.OPEN_to_ACHIEVED
          - state_machines.Milestone.PENDING_to_ACHIEVED
          - calculations.goal_progress_pct
        distinguishing_aspect: |
          Depth>=2 chain triggered by recording a counted WeighIn (DIFFERENT trigger from graduate):
          weigh-in -> Goal.progress_pct recompute to 100 -> Goal OPEN->ACHIEVED -> that achievement
          drives its PENDING 100% Milestone PENDING->ACHIEVED. Each link caused by the prior.
        test_recipe:
          setup:
            - "ACTIVE enrollment baseline 95kg, PRIMARY goal target 90, a PENDING 100% milestone on it."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "M", email: "m8@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_id: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_id}", weight_kg: 95 }, as: Member, as_user_id: "${mem_id}", captures: { intake_id: $.data.id } }
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /wm/intake-assessments/${intake_id}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${intake_id}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_id}", plan_id: "${plan_id}", intake_assessment_id: "${intake_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /wm/enrollments/${enr_id}/activate", payload: {}, as: ProgramAdmin, captures: { enr_v0: $.data.version } }
            - { call: "POST /wm/goals", payload: { enrollment_id: "${enr_id}", kind: "PRIMARY", target_weight_kg: 90 }, as: ProgramAdmin, captures: { goal_id: $.data.id } }
            - { call: "POST /wm/milestones", payload: { goal_id: "${goal_id}", threshold_pct: 100 }, as: ProgramAdmin, captures: { ms_id: $.data.id } }
          trigger:
            - { call: "POST /wm/weigh-ins", payload: { enrollment_id: "${enr_id}", weight_kg: 90, counts: true, expected_enrollment_version: "${enr_v0}" }, as: Coach }
          assert:
            - "Goal.${goal_id}.progress_pct == 100.0"
            - "Goal.${goal_id}.status == ACHIEVED"
            - "Milestone.${ms_id}.status == ACHIEVED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_graduate_inactive_and_ineligible
        grounds:
          - validations[priority=8]
          - validations[priority=20]
          - state_machines.Enrollment.ACTIVE_to_GRADUATED
        distinguishing_aspect: |
          Pair = state (priority 8, ERR_INVALID_STATE) vs business state-of-graduation (priority 20,
          ERR_GRADUATION_CRITERIA_NOT_MET). A graduate call on a PENDING_CLINICAL enrollment that is ALSO
          not graduation-eligible fails with the higher-priority ERR_INVALID_STATE (clinical_status not ACTIVE),
          not ERR_GRADUATION_CRITERIA_NOT_MET.
        test_recipe:
          setup:
            - "Enrollment in PENDING_CLINICAL (never activated), no goals -> not graduation-eligible."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "M", email: "m9@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_id: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_id}", weight_kg: 95 }, as: Member, as_user_id: "${mem_id}", captures: { intake_id: $.data.id } }
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /wm/intake-assessments/${intake_id}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${intake_id}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_id}", plan_id: "${plan_id}", intake_assessment_id: "${intake_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
          trigger:
            - { call: "POST /wm/enrollments/${enr_id}/graduate", payload: {}, as: ProgramAdmin, captures: { eid: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: safety_vs_referential_rx_issue_below_bmi_and_unapproved_eligibility
        grounds:
          - validations[priority=14]
          - validations[priority=15]
          - state_machines.RxAuthorization.REQUESTED_to_ISSUED
        distinguishing_aspect: |
          Pair = business_referential (priority 14, ERR_ELIGIBILITY_NOT_APPROVED) vs business_safety
          (priority 15, ERR_BMI_BELOW_RX_THRESHOLD). Issuing Rx for a member with BMI 27.0 (below 30, no
          comorbidity) AND a still-PENDING eligibility determination fails with the higher-priority
          ERR_ELIGIBILITY_NOT_APPROVED (14 before 15), not the BMI error.
        test_recipe:
          setup:
            - "Member height 170 intake 78kg (BMI 27.0) comorbidity 0; RX enrollment; Rx REQUESTED; eligibility still PENDING."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "RX", name: "Rx", monthly_fee_cents: 9000 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "M", email: "m10@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_id: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_id}", weight_kg: 78, comorbidity_count: 0 }, as: Member, as_user_id: "${mem_id}", captures: { intake_id: $.data.id } }
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /wm/intake-assessments/${intake_id}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${intake_id}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_id}", plan_id: "${plan_id}", intake_assessment_id: "${intake_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "GET /wm/enrollments/${enr_id}", payload: {}, as: ProgramAdmin, captures: { enr_v: $.data.version } }
            - { call: "POST /wm/eligibility-determinations", payload: { member_id: "${mem_id}", enrollment_id: "${enr_id}" }, as: Clinician, captures: { det_id: $.data.id } }
            - { call: "POST /wm/rx-authorizations", payload: { enrollment_id: "${enr_id}", eligibility_determination_id: "${det_id}" }, as: Clinician, captures: { rx_id: $.data.id } }
          trigger:
            - { call: "POST /wm/rx-authorizations/${rx_id}/issue", payload: { expected_enrollment_version: "${enr_v}" }, as: Clinician, captures: { eid: $.data.error_id } }
          assert:
            - "response error_id == ERR_ELIGIBILITY_NOT_APPROVED"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rx_bmi_threshold_exactly_30_passes_29_8_fails
        grounds:
          - validations[priority=15]
          - state_machines.RxAuthorization.REQUESTED_to_ISSUED
          - entities.RxAuthorization.fields.qualifying_bmi
        distinguishing_aspect: |
          Numeric >= boundary on the BMI metric at the issue endpoint: weight 87kg/170cm -> BMI 30.1
          (>= 30.0) ISSUES; weight 86kg -> BMI 29.8 (< 30.0, no comorbidity) is rejected
          ERR_BMI_BELOW_RX_THRESHOLD. Distinct metric (BMI) reachable through the rx-issue endpoint.
        test_recipe:
          setup:
            - "Member height 170 intake 87kg (BMI 30.1) comorbidity 0; APPROVED eligibility; Rx REQUESTED."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
