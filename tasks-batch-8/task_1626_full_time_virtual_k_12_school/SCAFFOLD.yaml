    roles: [EnrollmentOfficer]
    code: 200
    input: [excused_reason]
    output: AttendanceRecord
    side_effects: ["AttendanceRecord -> ABSENT_EXCUSED; recompute truancy fields"]

  # --- AssessmentWindow ---
