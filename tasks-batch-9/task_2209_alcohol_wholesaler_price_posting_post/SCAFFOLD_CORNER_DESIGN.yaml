      - name: hold_amendment_revoke_restores_prior_prices_and_reactivates_the_voided_combination_sale
        claim_type: compensation
        grounds: ["state_machines.HoldAmendment.transitions.ACCEPTED_to_REVOKED", calculations.tier_discounted_case_price, calculations.combination_sale_min_price]
        distinguishing_aspect: "The accepted amendment lowers the combination floor from 150000 to 149000, which drops the band from 0.10 to 0.05 and RAISES min_allowed_price_cents from 135000 to 141550, voiding a 136000 combination. Revoking must walk all three derived values back exactly — restored prices, recomputed tier and a combination returned from VOID to ACTIVE — with no residue."
        excluded_because:
          difficulty_instance: compensating_invariant / revoke_conserves_the_item_price_vector_and_every_derived_instrument_value
          rationale: "The named §1.8 instance revokes an accepted amendment on the same fixture and walks back the same three derived values — item prices and amendment_count, the tier's discounted_case_price_cents recomputed from the restored price, and the combination sale's floor_price_cents, min_allowed_price_cents and return from VOID to ACTIVE — pinning each as an explicit conserved formula, so this corner's compensation claim adds no distinct observation."

      - name: accepted_hold_amendment_applies_prices_and_recomputes_dependent_instruments
        claim_type: side_effect_execution
        grounds: [state_machines.HoldAmendment.transitions.PENDING_to_ACCEPTED, state_machines.HoldAmendment.transitions.PENDING_to_REJECTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / hold_amendment_accept_and_reject_branches_write_disjoint_side_effect_sets
          rationale: "The named §1.8 instance already drives both branches out of PENDING and asserts that the accept branch writes the price, prior-price snapshot, amendment_count and dependent-instrument recomputations while the reject branch writes only the wholesaler-side counters, and that neither branch leaks into the other's field set."

