        distinguishing_aspect: "Each of the three temporal rules is probed in its failing and then its passing configuration by moving only the logical clock or only the requested date: 517 days to expiration is outside the 420-day window while 395 is inside, a 31-day notice lead fails the 120-day RENEWAL_INTENT requirement while 182 passes, and a 2026-12 voucher cannot be submitted on 2026-12-01 but can on 2027-01-01."
