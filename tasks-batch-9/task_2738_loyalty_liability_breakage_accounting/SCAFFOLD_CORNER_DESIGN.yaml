              payload: { partner_agreement_id: "${agr_id}", period_id: "${per2_id}", expected_partner_agreement_version: "${agr_v2}" }
              as: LoyaltyAccountant
              captures: { err_suspended: $.data.error_id }
          assert:
            - "SettlementStatement.${st1_id}.net_due_cents == 4500 (round_half_up(5000 * 900 / 1000), GROSS basis) and its state is WRITTEN_OFF after the trigger"
            - "PartnerAgreement.${agr_id}.outstanding_settlement_cents == 0 - the write-off subtracts net_due just as payment would"
            - "PartnerAgreement.${agr_id}.status == SUSPENDED - CASCADE STEP: the write-off drives ACTIVE -> SUSPENDED"
            - "PointLot.${lot_partner_id}.settlement_state == WRITTEN_OFF but lifecycle_state is STILL OUTSTANDING with points_remaining 5000 - the settlement dimension moves independently of the redemption dimension"
            - "PointLot.${lot_own_id}.settlement_state == NOT_APPLICABLE - the non-partner lot is untouched by the cascade"
            - "AccountingPeriod.${per1_id}.issuance_deferred_cents is STILL 5400 - a write-off is a receivable event, not a deferred-revenue event"
            - "The follow-on POST /settlement-statements for per2 returns HTTP 409 with error_id == ERR_AGREEMENT_NOT_ACTIVE - the priority-63 gate now fails because of the cascade, even though the OCC version ${agr_v2} is current and per2 is OPEN"
            - "GET /settlement-statements?partner_agreement_id=${agr_id} returns total_count == 1"

  # ============================================================================
  # SECTION 5 of 9 - endpoints (6 instances)
  # Standard CRUD, action endpoint, bulk action, cross-reference link,
  # computed read and conditional action.
  # ============================================================================
  - section: endpoints
    instances:
      - name: endpoint_standard_crud_state_expiry_rule_create_list_get
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /state-expiry-rules]
          - endpoints[GET /state-expiry-rules]
          - endpoints[GET /state-expiry-rules/{id}]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The create / list / read triple is complete and mutation-free beyond create: the collection read honours program_id, state_code and expiry_permitted filters together with limit and offset, and there is no PATCH or DELETE anywhere in this API."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Two DRAFT programs 'Rules Core A' and 'Rules Core B'."
            - "Program A carries three StateExpiryRules: TX (expiry_permitted true), CA (expiry_permitted FALSE), DE (expiry_permitted true, escheatment_required true). Program B carries one rule TX."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Rules Core A", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_a_id: $.data.id }
            - call: "POST /programs"
              payload: { name: "Rules Core B", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_b_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_b_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
              captures: { rule_b_id: $.data.id }
          trigger:
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_a_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
              captures: { rule_tx_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_a_id}", state_code: "CA", expiry_permitted: false, min_dormancy_days: 1095, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
              captures: { rule_ca_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_a_id}", state_code: "DE", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: true, escheat_rate_bp: 6000 }
              as: ProgramAdmin
              captures: { rule_de_id: $.data.id }
            - call: "GET /state-expiry-rules?program_id=${prog_a_id}&limit=2&offset=0"
              payload: {}
              as: LoyaltyAccountant
            - call: "GET /state-expiry-rules?program_id=${prog_a_id}&expiry_permitted=true"
              payload: {}
              as: Controller
            - call: "GET /state-expiry-rules/${rule_de_id}"
              payload: {}
              as: Controller
          assert:
            - "Each POST returns HTTP 201 with a StateExpiryRule carrying id, program_id, version 1 and created_at / updated_at"
            - "GET /state-expiry-rules?program_id=${prog_a_id}&limit=2&offset=0 returns exactly 2 rows with total_count == 3, has_more == true, limit == 2 and offset == 0 - program B's TX rule is excluded"
            - "GET /state-expiry-rules?program_id=${prog_a_id}&expiry_permitted=true returns 2 rows with total_count == 2 - the CA rule is filtered out, so the two filters compose"
            - "GET /state-expiry-rules/${rule_de_id} returns escheatment_required true and escheat_rate_bp 6000 exactly as written"
            - "GET /state-expiry-rules?program_id=${prog_b_id} returns total_count == 1 and its single row's id == ${rule_b_id}"
            - "Every response carries meta.api_request_id and meta.api_request_timestamp with response_type set and the payload under data"
            - "There is no PATCH, PUT or DELETE on /state-expiry-rules - once written, a rule is superseded only by a ProgramChangeOrder or by a differently-scoped rule, never edited in place"

      - name: endpoint_action_allocate_advances_state_and_books_revenue
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /redemption-events/{id}/allocate]
          - state_machines.RedemptionEvent
          - calculations.redemption_revenue_release
        distinguishing_aspect: "The allocate action is a state-advancing POST with no request body that writes RedemptionAllocation ledger rows and books provisional revenue as a side effect."
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_redemption_provisional_vs_final_release
          rationale: "The §1.8 dual-variant instance drives allocate and then fulfill on the same event, asserting the per-line ledger rows, the provisional recognition and the remeasurement delta, so the action-endpoint corner is exercised at depth there."

      - name: endpoint_bulk_action_expiry_sweep_processes_every_eligible_lot
        claim_type: Bulk action
        grounds:
          - endpoints[POST /accounting-periods/{id}/expiry-sweep]
          - calculations.lot_expiry_and_escheat_measurement
        distinguishing_aspect: "One bodyless POST sweeps every eligible lot of the whole program in a deterministic order, silently skipping ineligible ones, and returns the swept AccountingPeriod rather than a per-lot collection."
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_expiry_to_escheat_to_program_disclosure_latch
          rationale: "The §1.8 cascade instance drives the sweep across eligible and skipped lots and asserts the period, lot, member and program effects, which is exactly the bulk-action contract."

      - name: endpoint_computed_read_rollforward_previews_then_matches_the_close
        claim_type: Computed read
        grounds:
          - endpoints[GET /accounting-periods/{id}/liability-rollforward]
          - calculations.period_close_rollforward
          - state_machines.AccountingPeriod.transitions[OPEN->SOFT_CLOSED]
        distinguishing_aspect: "The rollforward read re-runs STEPS 1-8 WITHOUT persisting: called on an OPEN period it previews the twelve figures and changes nothing, and the subsequent soft close persists exactly those numbers."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Rollfwd Core' ACTIVE (ssp 1200, cap 5000, COHORT_WEIGHTED, historical 7500 so current_breakage_rate_bp 2500), rule TX, ONE cohort C1 observed 8200 / adjustment 0, member M1 BASE/TX, period per1 [2026-08-01, 2026-09-01)."
            - "M1 holds one 1000-point lot: gross_ssp_cents 1200, breakage_reserve_cents 300, deferred_revenue_cents 900. No redemptions, no expiries."
            - "A BreakageEstimate has been prepared by user acct-1, submitted, and APPROVED by ctrl-1, installing current_breakage_rate_bp 1800 and giving the period an approved rate of 8200."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Rollfwd Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", memo_narrative: "Single-cohort estimate for the August close.", sensitivity_low_bp: 7700, sensitivity_high_bp: 8700 }
              as: LoyaltyAccountant
              as_user_id: acct-1
              captures: { est1_id: $.data.id }
            - call: "POST /breakage-estimates/${est1_id}/submit"
              payload: {}
              as: LoyaltyAccountant
              as_user_id: acct-1
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
              captures: { prog_v: $.data.version }
            - call: "POST /breakage-estimates/${est1_id}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: Controller
              as_user_id: ctrl-1
          trigger:
            - call: "GET /accounting-periods/${per1_id}/liability-rollforward"
              payload: {}
              as: LoyaltyAccountant
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Controller
            - call: "POST /accounting-periods/${per1_id}/soft-close"
              payload: {}
              as: Controller
            - call: "GET /accounting-periods/${per1_id}/liability-rollforward"
              payload: {}
              as: Controller
          assert:
            - "The FIRST read returns all twelve declared keys: opening_liability_cents 0, issuance_deferred_cents 900, redemption_recognized_cents 0, remeasurement_delta_cents 0, expiry_released_cents 0"
            - "The FIRST read returns pre_catchup_liability_cents == 900, outstanding_gross_ssp_cents == 1200, required_liability_cents == round_half_up(1200 * 8200 / 10000) == 984"
            - "The FIRST read returns catch_up_adjustment_cents == 84 (984 - 900), closing_liability_cents == 984, breakage_recognized_cents == -84 and approved_estimate_rate_bp == 8200"
            - "Immediately after the FIRST read, AccountingPeriod.${per1_id}.state is STILL OPEN with soft_closed_at null, closing_liability_cents 0 and catch_up_adjustment_cents 0 - the computed read persists nothing"
            - "GET /accounting-periods/${per1_id} shows version unchanged by the read"
            - "After soft-close, AccountingPeriod.${per1_id}.closing_liability_cents == 984, catch_up_adjustment_cents == 84, breakage_recognized_cents == -84, pre_catchup_liability_cents == 900 and approved_estimate_rate_bp == 8200 - the persisted figures equal the preview exactly"
            - "The SECOND read of the SOFT_CLOSED period returns the identical twelve values"
            - "PointLot.${lot1_id} is untouched by either read: lifecycle_state OUTSTANDING with points_remaining 1000"

      - name: endpoint_cross_reference_body_foreign_keys_resolved_in_declared_order
