    path: "/deli/price-files"
    description: "Create a scale price file"
    roles: [ScaleOperator, DeliManager]
    code: 201
    input: [store_id, file_label, effective_from, effective_to, item_price_count]
    output: ScalePriceFile
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/deli/price-files/{id}"
    description: "Get a scale price file"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: []
    output: ScalePriceFile
    side_effects: []

  - method: GET
    path: "/deli/price-files"
    description: "List scale price files filtered by store or status"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: ["limit?", "offset?", "store_id?", "status?"]
    output: ScalePriceFile[]
    side_effects: []

  - method: POST
    path: "/deli/price-files/{id}/activate"
    description: "Activate a price file, superseding the current one and cascading through labels to ticket remakes"
    roles: [ScaleOperator, DeliManager]
    code: 200
    input: []
    output: ScalePriceFile
    side_effects:
      - "status -> ACTIVE; activated_at stamped"
      - "the previously ACTIVE file, if any -> SUPERSEDED (cascade level 1)"
      - "every ISSUED Label written against the superseded file -> VOIDED (cascade level 2)"
      - "each SubTicket whose label was voided -> REMADE (cascade level 3)"
      - "Store.active_price_file_id recomputed; Store.version incremented"

  - method: POST
    path: "/deli/price-files/{id}/retract"
    description: "Withdraw a price file back into PENDING"
    roles: [ScaleOperator, DeliManager]
    code: 200
    input: []
    output: ScalePriceFile
    side_effects: ["status -> PENDING", "Store.active_price_file_id recomputed"]

  - method: POST
    path: "/deli/price-files/{id}/reactivate"
    description: "Reactivate a superseded file through the PENDING state"
    roles: [ScaleOperator, DeliManager]
    code: 200
    input: []
    output: ScalePriceFile
    side_effects: ["status -> PENDING, then ACTIVE", "Store.active_price_file_id recomputed"]

  - method: PATCH
    path: "/deli/run-production-day"
    description: "Close the production day chain-wide: increment ops_run_index for every store, expire lapsed certifications and hold windows, and recompute posture. A store_id filter narrows the sweep to one store."
    roles: [PlatformAdmin, DeliManager]
    code: 200
    input: ["store_id?"]
    output: Store[]
    side_effects:
      - "ops_run_index += 1 for every store in scope"
      - "logical_clock_at_last_run stamped from the logical clock"
      - "Batches whose hold window has closed -> DISCARDED; lapsed Certifications -> EXPIRED"
      - "posture, posture_reason and the derived counters recomputed per store"

  - method: POST
    path: "/deli/posture-gate"
    description: "Set or clear the operator posture gate for a store, forcing the derived posture to HALT with reason POSTURE_GATE_TRIGGERED when true"
    roles: [PlatformAdmin, DeliManager]
    code: 200
    input: [store_id, posture_gate_flag]
    output: Store
    side_effects: ["posture_gate_flag set", "posture / posture_reason recomputed; version incremented", "when the flag is true every non-terminal SubTicket in the store -> ABANDONED and each abandoned ticket releases its bread reserve"]

  - method: GET
    path: "/deli/active-price-file"
    description: "Resolve the ACTIVE price file for a store at the logical clock"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: [store_id]
    output: ScalePriceFile
    side_effects: []

  # --- Label ---
  - method: POST
    path: "/deli/labels"
    description: "Issue a standalone weight label for a batch or platter"
    roles: [ScaleOperator, DeliClerk, DeliManager]
    code: 201
    input: [store_id, subject_type, subject_ref_id, net_weight_lbs, unit_price_cents]
    output: Label
    side_effects: ["status=ISSUED", "printed_at stamped", "price_file_id resolved from the ACTIVE file", "total_price_cents recomputed", "the resolved price file's synced_scale_count recomputed"]

  - method: GET
    path: "/deli/labels/{id}"
    description: "Get a label"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: []
    output: Label
    side_effects: []

  - method: GET
    path: "/deli/labels"
    description: "List labels filtered by store, ticket, price file, subject type, or status"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: ["limit?", "offset?", "store_id?", "sub_ticket_id?", "price_file_id?", "subject_type?", "status?"]
    output: Label[]
    side_effects: []

  # --- CateringOrder ---
  - method: POST
    path: "/deli/catering-orders"
    description: "Take a catering platter inquiry"
    roles: [DeliClerk, DeliManager]
    code: 201
    input: [store_id, platter_deli_item_id, customer_name, platter_count, headcount, lead_time_hours, pickup_window_start, pickup_window_end, deposit_cents, certified_planner_associate_id, request_id, "parent_order_id?"]
    output: CateringOrder
    side_effects: ["status=INQUIRY", "quote_total_cents recomputed", "pickup_bucket_key computed", "the request_id is recorded for replay detection"]

  - method: GET
    path: "/deli/catering-orders/{id}"
    description: "Get a catering order"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: []
    output: CateringOrder
    side_effects: []

  - method: GET
    path: "/deli/catering-orders"
    description: "List catering orders filtered by store, status, parent order, platter item, or planner"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: ["limit?", "offset?", "store_id?", "status?", "parent_order_id?", "platter_deli_item_id?", "certified_planner_associate_id?"]
    output: CateringOrder[]
    side_effects: []

  - method: POST
    path: "/deli/catering-orders/{id}/confirm"
    description: "Confirm a catering order, checking lead time and aggregate pickup-window capacity"
    roles: [DeliClerk, DeliManager]
    code: 200
    input: []
    output: CateringOrder
    side_effects: ["status -> CONFIRMED", "pickup_bucket_key assigned; the 15-minute bucket headcount accumulator increases", "quote_total_cents recomputed"]

  - method: POST
    path: "/deli/catering-orders/{id}/revise"
    description: "Revise a confirmed catering order, returning it to INQUIRY for re-confirmation"
    roles: [DeliClerk, DeliManager]
    code: 200
    input: ["platter_count?", "headcount?", "pickup_window_start?", "pickup_window_end?"]
    output: CateringOrder
    side_effects: ["status -> INQUIRY", "the bucket headcount accumulator increases", "quote_total_cents recomputed"]

  - method: POST
    path: "/deli/catering-orders/{id}/start-production"
    description: "Begin building the platters"
    roles: [DeliClerk, DeliManager]
    code: 200
    input: []
    output: CateringOrder
    side_effects: ["status -> IN_PRODUCTION"]

  - method: POST
    path: "/deli/catering-orders/{id}/mark-ready"
    description: "Mark the platters ready for pickup"
    roles: [DeliClerk, DeliManager]
    code: 200
    input: []
    output: CateringOrder
    side_effects: ["status -> READY", "a Label is synthesized with subject_type=CATERING_PLATTER"]

  - method: POST
    path: "/deli/catering-orders/{id}/pickup"
    description: "Hand the platters to the customer inside the pickup window"
    roles: [DeliClerk, DeliManager]
    code: 200
    input: []
    output: CateringOrder
    side_effects: ["status -> PICKED_UP", "the bucket headcount accumulator decreases"]

  - method: POST
    path: "/deli/catering-orders/{id}/cancel"
    description: "Cancel a catering order"
    roles: [DeliClerk, DeliManager]
    code: 200
    input: [reason]
    output: CateringOrder
    side_effects: ["status -> CANCELLED", "the bucket headcount accumulator decreases", "when cancelled from READY, an unclaimed-platter WasteRecord is synthesized against the platter's batch and excluded from store_waste_liability"]

  # --- WasteRecord ---
  - method: POST
    path: "/deli/waste-records"
    description: "Open a waste record against a batch (the batch may also synthesize one through mark-down)"
    roles: [DeliClerk, DeliManager]
    code: 201
    input: [store_id, production_batch_id, markdown_by_associate_id, reason]
    output: WasteRecord
    side_effects: ["status=DRAFT", "pending_waste_verification_count recomputed"]

  - method: GET
    path: "/deli/waste-records/{id}"
    description: "Get a waste record"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: []
    output: WasteRecord
    side_effects: []

  - method: GET
    path: "/deli/waste-records"
    description: "List waste records filtered by store, batch, verifier, status, or reason"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: ["limit?", "offset?", "store_id?", "production_batch_id?", "verifier_associate_id?", "markdown_by_associate_id?", "status?", "reason?"]
    output: WasteRecord[]
    side_effects: []

  - method: POST
    path: "/deli/waste-records/{id}/mark-down"
    description: "Record the markdown leg of the mandate sequence"
    roles: [DeliClerk, DeliManager]
    code: 200
    input: [markdown_by_associate_id, markdown_sold_lbs]
    output: WasteRecord
    side_effects: ["status -> MARKED_DOWN", "markdown_sold_lbs and markdown_cents recorded", "the parent batch's markdown_sold_lbs and markdown_cents recomputed"]

  - method: POST
    path: "/deli/waste-records/{id}/discard"
    description: "Discard the batch, settling the waste liability"
    roles: [DeliClerk, DeliManager]
    code: 200
    input: [discard_lbs]
    output: WasteRecord
    side_effects: ["status -> DISCARDED; discarded_at stamped", "discard_value_cents, handling_fee_cents and total_liability_cents recomputed (tiered, prior-record-dependent)", "store_waste_liability recomputed", "the parent batch's hold_status -> DISCARDED"]

  - method: POST
    path: "/deli/waste-records/{id}/verify"
    description: "Verify the discard, settling the final case yield cost"
    roles: [DeliManager]
    code: 200
    input: [verifier_associate_id, verified_by_certification_id, expected_batch_version]
    output: WasteRecord
    side_effects: ["status -> VERIFIED", "the batch's discard_lbs recomputed", "the batch's case_yield_cost_final_cents recomputed (final variant)", "Store.verified_waste_liability_cents and store_waste_liability recomputed", "pending_waste_verification_count recomputed", "increments ProductionBatch.version by 1"]

  - method: POST
    path: "/deli/waste-records/{id}/unverify"
    description: "Unverify a discard under review, returning the record to DISCARDED"
    roles: [DeliManager]
    code: 200
    input: [reason]
    output: WasteRecord
    side_effects: ["status -> DISCARDED", "verified_waste_liability_cents decremented", "total_liability_cents recomputed"]

  - method: POST
    path: "/deli/waste-records/{id}/void"
    description: "Void a waste record that never reached a verified discard"
    roles: [DeliManager]
    code: 200
    input: [reason]
    output: WasteRecord
    side_effects: ["status -> VOIDED", "pending_waste_verification_count recomputed"]

  # --- FK reverse-reachability reads (§1.5) ---
  # These six reads are the ONLY nested paths in the scaffold. They exist because
  # a master record (item, associate, certification) has several distinct child
  # collections referencing it, and a single flat filtered list cannot disambiguate
  # "which children of which kind". All creation and mutation is flat (see the
  # Table 5 header). Each returns a derived array whose declared element type is
  # the referencing child; see the coupled reverse-reads in the repo metadata.
  - method: GET
    path: "/deli/items/{id}/slicer-usage"
    description: "Usage reverse-read: every SlicerAsset whose last_sliced_deli_item_id is this item"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: []
    output: SlicerAsset[]
    side_effects: []

  - method: GET
    path: "/deli/items/{id}/sanitation-usage"
    description: "Usage reverse-read: every SanitationCycle whose allergen_cleared_from_item_id is this item"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: []
    output: SanitationCycle[]
    side_effects: []

  - method: GET
    path: "/deli/items/{id}/certification-usage"
    description: "Usage reverse-read: every Certification whose deli_item_id scope is this item"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: []
    output: Certification[]
    side_effects: []

  - method: GET
    path: "/deli/associates/{id}/sanitation-usage"
    description: "Usage reverse-read: every SanitationCycle verified by this associate"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: []
    output: SanitationCycle[]
    side_effects: []

  - method: GET
    path: "/deli/associates/{id}/certification-usage"
    description: "Usage reverse-read: every Certification this associate revoked as a manager"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: []
    output: Certification[]
    side_effects: []

  - method: GET
    path: "/deli/certifications/{id}/waste-usage"
    description: "Usage reverse-read: every WasteRecord verified against this certification"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
    code: 200
    input: []
    output: WasteRecord[]
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or the role is unknown" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The acting role is not on the endpoint's roles: list" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, unknown field, or a required field missing" }
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "The addressed store does not exist" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "The addressed resource does not exist or belongs to a different store" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The resource is not in the state the requested transition requires" }
  - { id: ERR_HACCP_WINDOW_FREEZE, http: 409, condition: "A missed catering pickup window is still open for this store, so no fresh deli work may start" }
  - { id: ERR_HACCP_HOLD, http: 409, condition: "The store's haccp_safety_flag is true" }
  - { id: ERR_POSTURE_HALT, http: 409, condition: "Store posture is HALT; the store accepts no fresh work items" }
  - { id: ERR_POSTURE_RESTRICTED, http: 409, condition: "Store posture is RESTRICTED; new production batches are blocked (sub-ticket creation is not)" }
  - { id: ERR_UNVERIFIED_WASTE_BACKLOG, http: 409, condition: "Three or more waste records await verification; further production is blocked until they are verified" }
  - { id: ERR_ASSOCIATE_NOT_CERTIFIED, http: 409, condition: "The acting or named associate lacks an ACTIVE certification of the required type with expires_at after the logical clock" }
  - { id: ERR_ALLERGEN_CHANGEOVER_REQUIRED, http: 409, condition: "The slicer's previous allergen set is not cleared by an ALLERGEN_CHANGEOVER cycle before slicing a diverging item" }
  - { id: ERR_SLICER_WINDOW_CONFLICT, http: 409, condition: "The slicer is already committed in an overlapping half-open interval" }
  - { id: ERR_SLICER_NOT_SANITIZED, http: 409, condition: "The slicer is not CLEAN, or is SANITIZING" }
  - { id: ERR_SLICER_REQUIRED, http: 400, condition: "A slicer-required item was submitted without a slicer_id" }
  - { id: ERR_NO_CERTIFIED_STAFF, http: 409, condition: "No associate in the store holds an ACTIVE SLICER_OPERATION certification at ticketing time" }
  - { id: ERR_NO_CLEAN_SLICER, http: 409, condition: "No CLEAN slicer exists for a slicer-required line" }
  - { id: ERR_ALLERGY_HOLD_ACTIVE, http: 409, condition: "The completing associate's allergy_set does not cover every line's allergen_flags" }
  - { id: ERR_SHELF_OUT, http: 409, condition: "The store's case_on_hand_lbs cannot cover every line's required weight" }
  - { id: ERR_PRICE_FILE_STALE, http: 409, condition: "No ACTIVE scale price file covers the logical clock and every line's item" }
  - { id: ERR_LABEL_STALE, http: 409, condition: "The ticket's label has been voided; the ticket must be remade first" }
  - { id: ERR_BREAD_UNAVAILABLE, http: 409, condition: "The ticket's bread item is unavailable and the ticket sits in bread_status=BREAD_HOLD" }
  - { id: ERR_PICKUP_WINDOW_MISSED, http: 409, condition: "The pickup window is closed; the current logical clock is at or after pickup_window_end" }
  - { id: ERR_LEAD_TIME_VIOLATED, http: 409, condition: "Lead time is below 24 hours without a certified planner, or the lead time cannot fit before the pickup window" }
  - { id: ERR_PICKUP_CAPACITY_EXCEEDED, http: 409, condition: "The 15-minute pickup bucket's aggregate headcount would exceed the store's bucket limit" }
  - { id: ERR_PRICE_FILE_OVERLAP, http: 409, condition: "The requested price file overlaps an already-ACTIVE file on half-open intervals" }
  - { id: ERR_PRICE_FILE_IN_USE, http: 409, condition: "A price file with ISSUED labels cannot be withdrawn" }
  - { id: ERR_PROMO_STATE_BLOCKS_FILE_WITHDRAWAL, http: 409, condition: "The associated promotion must be CANCELLED before the price file may be withdrawn" }
  - { id: ERR_MARKDOWN_REQUIRED_BEFORE_DISCARD, http: 409, condition: "Discard attempted with no prior markdown while the markdown window is open; or a second OPEN waste record for the same batch" }
  - { id: ERR_MARKDOWN_WINDOW_CLOSED, http: 409, condition: "The half-open markdown window is closed at the current logical clock" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "The producer, markdown associate and verifier are not three distinct people" }
  - { id: ERR_EMPTY_CART, http: 400, condition: "A ticket with zero lines, or a line with half_lb_units below 1" }
  - { id: ERR_SANITATION_CYCLE_NOT_DUE, http: 409, condition: "The requested sanitation cycle type is not yet due at the current counters" }
  - { id: ERR_CYCLE_NOT_COMPLETE, http: 409, condition: "The sanitation cycle's cycle_minutes have not elapsed on the logical clock" }
  - { id: ERR_REOPEN_LIMIT_EXCEEDED, http: 409, condition: "A slicer has already been reopened twice in the current production day" }
  - { id: ERR_LABEL_WEIGHT_EXCEEDED, http: 400, condition: "The scale-locked label weight is zero, negative, or above 10 lbs" }
  - { id: ERR_DUPLICATE_REQUEST, http: 409, condition: "The catering order's request_id has already been used in this store" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_NO_COMPLETED_TICKET_YET, http: 409, condition: "The store has no prior COMPLETED sub ticket, so the slip basis is undefined" }
  - { id: ERR_SLIP_LOCK_VIOLATED, http: 409, condition: "A prior ticket completed late by T minutes and this ticket would exceed T minutes of its own promised_at" }
  - { id: ERR_QUEUE_DEPTH_BREACH, http: 409, condition: "The store's eligible sub queue already holds 8 tickets" }
  - { id: ERR_DELI_ITEM_UNAVAILABLE, http: 409, condition: "A referenced catalog item does not exist or is DISCONTINUED" }
  - { id: ERR_BATCH_WINDOW_INVALID, http: 400, condition: "The batch's hold window is not a well-formed half-open interval (case_life_minutes <= markdown_window_minutes)" }

# =============================================================================
# Table 7: RBAC Permission Matrix (§1.7)
# =============================================================================
# Identity semantics for every entity_backed role: when X-User-Role is
# DeliManager / DeliClerk / BakeryCoordinator, X-User-ID MUST be the id of an
# existing Associate row and the server evaluates certification, allergy and
# segregation checks against that Associate. The acting role determines
# permissions only and need not equal the associate's primary_role, so a store
# manager may act as DeliClerk for a shift.
roles:
  - name: PlatformAdmin
    description: "Chain-level operator with override power over every store; owns catalog, store, logical-clock and role-permission configuration."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — set the logical clock"
      - "POST /_rbac/role-permissions — replace a role's permission list"
      - "POST /deli/posture-gate — toggle the operator posture gate"
      - "POST /_payments/simulate — simulate a deposit outcome"
      - "POST /deli/stores/{id}/run-production-day — close the production day"
      - "PATCH /deli/items/{id} — update catalog pricing and shelf life"
    shared_operations:
      - "POST /deli/stores — create a store"
      - "POST /deli/items, /deli/associates, /deli/certifications, /deli/slicers — provision chain master data"
      - "All GET read endpoints"

  - name: DeliManager
    description: "Store deli manager: owns certifications, hardware events, price-file lifecycle, promotion lifecycle, bread commitments and waste verification. Cannot break producer/verifier separation."
    identity: entity_backed:Associate
    exclusive_operations:
      - "POST /deli/waste-records/{id}/verify — verify a discard (segregation: must differ from the producer and the markdown associate)"
      - "POST /deli/waste-records/{id}/unverify"
      - "POST /deli/certifications/{id}/revoke, /renew, /reopen"
      - "POST /deli/associates/{id}/suspend, /reinstate"
      - "POST /deli/promotions/{id}/activate, /settle, /reopen, /cancel"
      - "POST /deli/price-files/{id}/activate, /retract, /reactivate"
      - "POST /deli/bread-supply-orders/{id}/reopen"
      - "POST /deli/sanitation-cycles/{id}/reopen, /abort"
      - "POST /deli/slicers/{id}/assign-operator"
      - "POST /deli/production-batches/{id}/start, /mark-down, /complete"
    shared_operations:
      - "POST /deli/associates, /deli/certifications, /deli/catering-orders, /deli/sub-tickets, /deli/bread-supply-orders, /deli/sanitation-cycles"
      - "All GET read endpoints"

  - name: DeliClerk
    description: "Front-line deli associate: produces, slices, tickets, completes and hands over sub orders and platters. Cannot verify their own waste or revoke certifications."
    identity: entity_backed:Associate
    exclusive_operations:
      - "POST /deli/sub-tickets/{id}/ticket, /complete, /pickup, /abandon, /requeue"
      - "POST /deli/waste-records/{id}/mark-down, /discard"
      - "POST /deli/waste-records — open a waste record"
    shared_operations:
      - "POST /deli/production-batches, /deli/production-batches/{id}/start, /deli/production-batches/{id}/complete, /deli/production-batches/{id}/mark-down, /deli/production-batches/{id}/rework"
      - "POST /deli/sanitation-cycles, /deli/sanitation-cycles/{id}/complete"
      - "POST /deli/sub-tickets, /deli/catering-orders, /deli/catering-orders/{id}/confirm, /revise, /start-production, /mark-ready, /pickup, /cancel"
      - "POST /deli/labels"
      - "All GET read endpoints"

  - name: BakeryCoordinator
    description: "Bakery coordinator who commits bread supply against the promoted-sub forecast and drives delivery, which releases tickets held in BREAD_HOLD."
    identity: entity_backed:Associate
    exclusive_operations:
      - "POST /deli/bread-supply-orders — raise a promotions bread order"
    shared_operations:
      - "POST /deli/bread-supply-orders/{id}/submit, /confirm, /deliver"
      - "All GET read endpoints"

  - name: ScaleOperator
    description: "Scale operator who owns the scale price file and printed-label surface."
    identity: opaque
    exclusive_operations:
      - "POST /deli/price-files — create a scale price file"
    shared_operations:
      - "POST /deli/price-files/{id}/activate, /retract, /reactivate"
      - "POST /deli/labels"
      - "All GET read endpoints"
