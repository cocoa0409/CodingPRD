  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ppvc_state_before_seats
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_SEATS]
        distinguishing_aspect: "A reservation create on a DRAFT (not OPEN) event requesting more seats than capacity violates both state (priority 7, ERR_INVALID_STATE) and capacity (priority 16, ERR_INSUFFICIENT_SEATS); the higher-priority state check wins => ERR_INVALID_STATE. Category pair: state vs business_fiscal."
