        distinguishing_aspect: "The sixth counter (negotiation_rounds == 5 == MAX) is rejected with ERR_NEGOTIATION_ROUND_LIMIT; five full counter/revise rounds succeed first."
        test_recipe:
          setup: ["renter company; production; offer (5 performances @ 500,000) created and SENT"]
