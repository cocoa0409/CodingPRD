    description: "Begin counseling; requires certified counselor in the file's program area"
    roles: [MemberAdmin]
    code: 200
    input: []
    output: ClientFile
    side_effects: []
  - method: POST
    path: "/housing-network/client-files/{id}/record-outcome"
    description: "Record outcome and hours"
    roles: [MemberAdmin]
    code: 200
    input: [outcome_code, counseling_hours]
    output: ClientFile
    side_effects: []
  - method: POST
    path: "/housing-network/client-files/{id}/close"
    description: "Close a file once reviews pass"
    roles: [MemberAdmin]
    code: 200
    input: []
    output: ClientFile
    side_effects: []
  - method: POST
    path: "/housing-network/file-reviews"
    description: "Open a review on a client file"
    roles: [ComplianceReviewer]
    code: 201
    input: [client_file_id]
    output: FileReview
    side_effects: ["records reviewer_id"]
  - method: GET
    path: "/housing-network/file-reviews"
    description: "List file reviews"
    roles: [NetworkDirector, ComplianceReviewer, MemberAdmin]
    code: 200
    input: ["client_file_id?", "review_status?", "limit?", "offset?"]
    output: FileReview[]
    side_effects: []
  - method: GET
    path: "/housing-network/file-reviews/{id}"
    description: "Get a file review"
    roles: [NetworkDirector, ComplianceReviewer, MemberAdmin]
    code: 200
    input: []
    output: FileReview
    side_effects: []
  - method: POST
    path: "/housing-network/file-reviews/{id}/pass"
    description: "Pass a review"
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: FileReview
    side_effects: ["member posture recompute"]
  - method: POST
    path: "/housing-network/file-reviews/{id}/fail"
    description: "Fail a review with deficiency codes"
    roles: [ComplianceReviewer]
    code: 200
    input: [deficiency_codes]
    output: FileReview
    side_effects: ["member.open_finding_count += 1", "posture recompute", "failed_review_flag on ratio crossing"]
  - method: POST
    path: "/housing-network/file-reviews/{id}/remediate"
    description: "Remediate a FAILED review"
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: FileReview
    side_effects: ["member.open_finding_count -= 1", "posture recompute"]

  # --- expenditure & audit ---
  - method: POST
    path: "/housing-network/expenditure-reports"
    description: "Submit an expenditure report for an award period"
    roles: [MemberAdmin]
    code: 201
    input: [award_id, period_start, period_end, reported_spent_cents]
    output: ExpenditureReport
    side_effects: []
  - method: GET
    path: "/housing-network/expenditure-reports"
    description: "List expenditure reports"
    roles: [NetworkDirector, GrantOfficer, MemberAdmin, Auditor]
    code: 200
    input: ["award_id?", "report_status?", "limit?", "offset?"]
    output: ExpenditureReport[]
    side_effects: []
  - method: GET
    path: "/housing-network/expenditure-reports/{id}"
    description: "Get an expenditure report"
    roles: [NetworkDirector, GrantOfficer, MemberAdmin, Auditor]
    code: 200
    input: []
    output: ExpenditureReport
    side_effects: []
  - method: POST
    path: "/housing-network/expenditure-reports/{id}/accept"
    description: "Accept a report whose cumulative spend is within disbursed"
    roles: [GrantOfficer]
    code: 200
    input: []
    output: ExpenditureReport
    side_effects: ["cumulative_spent_cents recompute"]
  - method: POST
    path: "/housing-network/expenditure-reports/{id}/flag"
    description: "Flag a report; spawns an OPEN compliance audit"
    roles: [GrantOfficer]
    code: 200
    input: []
    output: ExpenditureReport
    side_effects: ["creates ComplianceAudit OPEN"]
  - method: GET
    path: "/housing-network/compliance-audits"
    description: "List compliance audits"
    roles: [NetworkDirector, Auditor, GrantOfficer]
    code: 200
    input: ["award_id?", "audit_status?", "parent_audit_id?", "limit?", "offset?"]
    output: ComplianceAudit[]
    side_effects: []
  - method: GET
    path: "/housing-network/compliance-audits/{id}"
    description: "Get an audit"
    roles: [NetworkDirector, Auditor, GrantOfficer]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: []
  - method: POST
    path: "/housing-network/compliance-audits/{id}/issue-findings"
    description: "Issue findings with disallowance"
    roles: [Auditor]
    code: 200
    input: [disallowance_cents]
    output: ComplianceAudit
    side_effects: ["linked report FLAGGED->AUDITED", "member posture recompute"]
  - method: POST
    path: "/housing-network/compliance-audits/{id}/resolve"
    description: "Resolve findings"
    roles: [Auditor]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: ["member posture recompute"]
  - method: POST
    path: "/housing-network/compliance-audits/{id}/escalate"
    description: "Escalate findings; suspends award, claws back disallowed funds to cycle pools, freezes member"
    roles: [Auditor]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: ["award SUSPENDED", "clawback waterfall competitive then formula", "member posture FROZEN"]
  - method: POST
    path: "/housing-network/compliance-audits/{id}/reopen"
    description: "Re-open findings as a successor audit"
    roles: [Auditor]
    code: 201
    input: []
    output: ComplianceAudit
    side_effects: ["creates successor audit with parent_audit_id"]

  # --- performance reviews & congressional reporting ---
  - method: POST
    path: "/housing-network/performance-reviews"
    description: "Open a performance review for a member and period"
    roles: [NetworkDirector]
    code: 201
    input: [member_id, review_period]
    output: PerformanceReview
    side_effects: []
  - method: GET
    path: "/housing-network/performance-reviews"
    description: "List performance reviews"
    roles: [NetworkDirector, MemberAdmin]
    code: 200
    input: ["member_id?", "review_status?", "limit?", "offset?"]
    output: PerformanceReview[]
    side_effects: []
  - method: GET
    path: "/housing-network/performance-reviews/{id}"
    description: "Get a performance review"
    roles: [NetworkDirector, MemberAdmin]
    code: 200
    input: []
    output: PerformanceReview
    side_effects: []
  - method: POST
    path: "/housing-network/performance-reviews/{id}/score"
    description: "Score a review; recomputes households served rollup"
    roles: [NetworkDirector]
    code: 200
    input: [review_score]
    output: PerformanceReview
    side_effects: ["households_served_rollup"]
  - method: POST
    path: "/housing-network/performance-reviews/{id}/resolve"
    description: "Resolve a scored review as SATISFACTORY or CORRECTIVE_ACTION"
    roles: [NetworkDirector]
    code: 200
    input: [verdict]
    output: PerformanceReview
    side_effects: ["branching side effects per verdict: SATISFACTORY none; CORRECTIVE_ACTION sets corrective_plan_due and failed_review_flag"]
  - method: POST
    path: "/housing-network/performance-reviews/{id}/close-plan"
    description: "Close a corrective plan within its deadline and zero findings"
    roles: [NetworkDirector]
    code: 200
    input: []
    output: PerformanceReview
    side_effects: ["failed_review_flag := false", "posture recompute"]
  - method: POST
    path: "/housing-network/performance-reviews/{id}/escalate"
    description: "Escalate an overdue corrective plan; member to PROBATION"
    roles: [NetworkDirector]
    code: 200
    input: []
    output: PerformanceReview
    side_effects: ["member CHARTERED->PROBATION", "posture recompute"]
  - method: GET
    path: "/housing-network/reports/congressional"
    description: "Households-served rollup across non-revoked members, grouped by program area, for a fiscal year"
    roles: [NetworkDirector, GrantOfficer]
    code: 200
    input: [fiscal_year]
    output: { fiscal_year: integer, total_households: integer, by_program_area: object }
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path id or body FK does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, invalid enum, range violation (score outside 0..100, period_end <= period_start)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not defined from the entity's current state"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the parent entity's current version"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "X-User-ID equals the recorded counterpart user (assessor/scorer, reviewer/awardee)"
  - id: ERR_MEMBER_POSTURE_BLOCKED
    http: 422
    condition: "member compliance_posture FROZEN (or RESTRICTED for application submission) blocks the operation"
  - id: ERR_MEMBER_NOT_CHARTERED
    http: 422
    condition: "operation requires charter_status CHARTERED (application submission, counselor reactivation)"
  - id: ERR_COURSE_FULL
    http: 422
    condition: "course seats_taken == capacity at enrollment time"
  - id: ERR_PREREQUISITE_NOT_MET
    http: 422
    condition: "counselor lacks COMPLETED enrollment in the course's prerequisite"
  - id: ERR_WINDOW_CLOSED
    http: 422
    condition: "logical clock outside the permitted window (cycle phase, lapse deadline, corrective plan due, delivery window)"
  - id: ERR_CROSS_ENTITY_MISMATCH
    http: 422
    condition: "FK-consistency violation across entities (counselor not of member, program_area mismatch)"
  - id: ERR_POOL_EXHAUSTED
    http: 422
    condition: "allocation, disbursement, or reported spending exceeds the available pool / award total / disbursed amount"
  - id: ERR_MATCH_NOT_MET
    http: 422
    condition: "verified_match_cents < required_match_cents at activation"
  - id: ERR_DUPLICATE
    http: 409
    condition: "uniqueness violation (ein, legal_name, email, course_code, fiscal_year, review_period per member, award per application)"
  - id: ERR_COMPETITIVE_SCORE_TOO_LOW
    http: 422
    condition: "competitive request with review_score below COMPETITIVE_SCORE_FLOOR (60) cannot be awarded a competitive component"
  - id: ERR_REVIEW_PENDING
    http: 422
    condition: "client file close blocked by a FileReview still OPEN or FAILED"
  - id: ERR_OUTCOME_HOURS_INSUFFICIENT
    http: 422
    condition: "NO_OUTCOME recorded with counseling_hours below MIN_HOURS_NO_OUTCOME (2.0)"
  - id: ERR_CERTIFICATION_REQUIREMENT_UNMET
    http: 422
    condition: "certify without a COMPLETED enrollment in the program area, or reinstate with insufficient CE credits"
  - id: ERR_AWARD_NOT_RECONCILABLE
    http: 422
    condition: "reconcile attempted while disbursed_cents != award total or reports unaccepted"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkDirector
    description: "Chartering authority and performance-review owner; apex operational role but cannot score grants, submit assessments, or audit"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing-network/members/{id}/charter"
      - "POST /housing-network/members/{id}/reinstate"
      - "POST /housing-network/members/{id}/revoke"
      - "POST /housing-network/assessments/{id}/score"
      - "POST /housing-network/assessments/{id}/adjudicate"
      - "POST /housing-network/counselors/{id}/suspend"
      - "POST /housing-network/counselors/{id}/reactivate"
      - "POST /housing-network/counselors/{id}/separate"
      - "POST /housing-network/performance-reviews"
      - "POST /housing-network/performance-reviews/{id}/score"
      - "POST /housing-network/performance-reviews/{id}/resolve"
      - "POST /housing-network/performance-reviews/{id}/close-plan"
      - "POST /housing-network/performance-reviews/{id}/escalate"
      - "POST /housing-network/_clock/set_current_utc"
    shared_operations:
      - "POST /housing-network/members"
      - "GET endpoints (all)"
  - name: Assessor
    description: "Organizational assessor; runs chartering assessments but cannot adjudicate them"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing-network/members/{id}/begin-assessment"
      - "POST /housing-network/assessments/{id}/submit"
      - "POST /housing-network/assessments/{id}/withdraw"
    shared_operations:
      - "GET /housing-network/members, GET /housing-network/assessments"
  - name: TrainingRegistrar
    description: "Training institute operator; owns courses, enrollments, grading, certifications"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing-network/courses"
      - "POST /housing-network/courses/{id}/cancel"
      - "POST /housing-network/enrollments/{id}/grade"
      - "POST /housing-network/certifications"
      - "POST /housing-network/certifications/{id}/certify"
      - "POST /housing-network/certifications/{id}/evaluate-continuing-requirement"
      - "POST /housing-network/certifications/{id}/reinstate"
    shared_operations:
      - "POST /housing-network/courses/{id}/enrollments (with MemberAdmin)"
      - "POST /housing-network/enrollments/{id}/withdraw (with MemberAdmin)"
      - "GET endpoints (courses, enrollments, certifications, counselors, members)"
  - name: GrantOfficer
    description: "Grant program operator; owns cycles, scoring, awards, disbursements, expenditure acceptance"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing-network/grant-cycles and all cycle phase transitions"
      - "POST /housing-network/grant-applications/{id}/score"
      - "POST /housing-network/grant-applications/{id}/award"
      - "POST /housing-network/grant-applications/{id}/decline"
      - "POST /housing-network/grant-awards/{id}/verify-match"
      - "POST /housing-network/grant-awards/{id}/activate"
      - "POST /housing-network/grant-awards/{id}/suspend"
      - "POST /housing-network/grant-awards/{id}/resume"
      - "POST /housing-network/grant-awards/{id}/reconcile"
      - "POST /housing-network/grant-awards/{id}/close"
      - "POST /housing-network/disbursements"
      - "POST /housing-network/disbursements/{id}/post"
      - "POST /housing-network/disbursements/{id}/void"
      - "POST /housing-network/expenditure-reports/{id}/accept"
      - "POST /housing-network/expenditure-reports/{id}/flag"
    shared_operations:
      - "GET endpoints (cycles, applications, awards, disbursements, reports, audits, members)"
  - name: MemberAdmin
    description: "Staff of a network member organization; acts on own member's applications, files, reports"
    identity: "entity_backed:NetworkMember"
    exclusive_operations:
      - "POST /housing-network/grant-applications"
      - "POST /housing-network/grant-applications/{id}/submit"
      - "POST /housing-network/grant-applications/{id}/withdraw"
      - "POST /housing-network/client-files and file lifecycle actions"
      - "POST /housing-network/expenditure-reports"
      - "POST /housing-network/counselors (for own member)"
    shared_operations:
      - "POST /housing-network/courses/{id}/enrollments (with TrainingRegistrar)"
      - "POST /housing-network/enrollments/{id}/withdraw (with TrainingRegistrar)"
      - "GET endpoints (own member scope)"
  - name: ComplianceReviewer
    description: "Client file reviewer; cannot audit expenditures or review performance"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing-network/file-reviews"
      - "POST /housing-network/file-reviews/{id}/pass"
      - "POST /housing-network/file-reviews/{id}/fail"
      - "POST /housing-network/file-reviews/{id}/remediate"
    shared_operations:
      - "GET endpoints (client files, file reviews, counselors, certifications, members)"
  - name: Auditor
    description: "Expenditure auditor; segregated from GrantOfficer who flags reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing-network/compliance-audits/{id}/issue-findings"
      - "POST /housing-network/compliance-audits/{id}/resolve"
      - "POST /housing-network/compliance-audits/{id}/escalate"
      - "POST /housing-network/compliance-audits/{id}/reopen"
    shared_operations:
      - "GET endpoints (audits, awards, reports, cycles, members)"
