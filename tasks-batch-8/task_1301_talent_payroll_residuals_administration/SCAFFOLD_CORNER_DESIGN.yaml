        distinguishing_aspect: "Threshold precision on the turnaround gap: a 9-hour gap (shortfall 1h) yields one TURNAROUND unit priced at round_half_up(day_rate/8) == 12500; a gap of exactly turnaround_min_hours (10h) is NOT a violation."
