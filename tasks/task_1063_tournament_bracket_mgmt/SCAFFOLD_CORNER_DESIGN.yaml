  # ---------------- Cross-cutting complexity layers ----------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_confirm_stale_match_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[confirm-match-stale-version]", "errors[ERR_STALE_MATCH_VERSION]"]
        distinguishing_aspect: "Confirming with an expected_match_version captured before the report (stale by one) is rejected with ERR_STALE_MATCH_VERSION (412); the version advanced on report."
        test_recipe:
          setup: ["2-player SINGLE_ELIM IN_PROGRESS; final SCHEDULED (version captured at schedule), then REPORTED (version advanced)."]
          setup_api_calls:
            - call: "POST /venues"
