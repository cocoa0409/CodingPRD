  - rule_id: non_linear_state_machine
    instances:

      - name: segment_fail_revalidation_cycle_restores_scope
        grounds:
          - state_machines.NetworkSegment.TEST_PLANNED_to_FAILED
          - state_machines.NetworkSegment.FAILED_to_TEST_PLANNED
          - state_machines.NetworkSegment.TEST_PLANNED_to_VALIDATED
          - entities.NetworkSegment.fields.revalidation_round
          - entities.NetworkSegment.fields.scope_expanded_by_failure
          - entities.NetworkSegment.fields.effective_class
          - entities.SystemComponent.fields.scope_class
        distinguishing_aspect: |
          NetworkSegment re-enters TEST_PLANNED from FAILED, so the same state is visited twice in one
          row's life and the two visits are distinguishable by revalidation_round (0 on the first visit,
          1 on the second) while the second visit's PASS reverses the first verdict's scope expansion -
          a linear machine could neither revisit TEST_PLANNED nor undo the cascade, and the loop
          terminates because VALIDATED is a terminal state.
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' (L1, approved_budget_amount 200000.00) is in SCOPING."
            - "NetworkSegment 'CDE-CORE' (segment_class CDE) is VALIDATED and holds three components at facility DC-EAST."
            - "NetworkSegment 'STORE-POS' (segment_class OUT_OF_SCOPE) is TEST_PLANNED with test_method TRAFFIC_ANALYSIS, revalidation_round 0, effective_class OUT_OF_SCOPE."
            - "Four POS_TERMINAL components (pos-01..pos-04, facility RETAIL-12) sit under STORE-POS with declared_scope_class OUT_OF_SCOPE and scope_class OUT_OF_SCOPE."
            - "Engagement counts are cde_component_count 3, out_of_scope_component_count 4, in_scope_component_count 3."
            - "No SamplingPlan row exists yet."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
