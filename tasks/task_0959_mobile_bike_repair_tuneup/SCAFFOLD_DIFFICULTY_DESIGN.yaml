  - rule_id: boundary_precision_check
    instances:
      - name: allowance_exhaustion_boundary
        grounds:
          - calculations.subscription_allowance
          - errors[ERR_ALLOWANCE_EXHAUSTED]
        distinguishing_aspect: |
          Metric: allowance unit count; endpoint: POST /v1/service-requests.
          allowance_remaining == 1 exactly suffices (201, reservation made);
          allowance_remaining == 0 rejects with ERR_ALLOWANCE_EXHAUSTED —
          pins the >= 1 boundary.
        test_recipe:
          setup:
            - "FLEET customer; subscription included_tunes_per_period=1 (May 2026); two mechanical bikes"
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
