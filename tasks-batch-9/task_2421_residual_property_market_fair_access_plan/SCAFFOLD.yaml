scenario: |
  2421. Residual Property Market & Fair Access Plan (state FAIR Plan): applicant eligibility requiring
  documented declinations from the voluntary market, coverage limits, peril scope and exclusions narrower
  than standard homeowners policies, property inspection with condition-based improvement requirements
  before binding, rate approval and premium comparison to the voluntary market, depopulation and take-out
  offers from voluntary carriers with policyholder election, assessment mechanism on member insurers when
  losses exceed reserves, catastrophe exposure concentration in high-risk areas, agent producer agreements
  and commission structure
domain_name: residual-property-fair-access-plan
api_prefix: /fair-plan

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: AssessmentAllocation is a junction between AssessmentEvent and MemberInsurer; TakeoutOffer is a
  # junction between Policy and MemberInsurer; DeclinationRecord is a junction between Application and
  # MemberInsurer; Policy.predecessor_policy_id is self-referential. No strict ownership tree exists —
  # Property, Application, Policy, RateFiling and AssessmentEvent all reference CatastropheZone laterally.

  state_machine_shape: parallel
  # Policy carries two independent state dimensions on the same row (coverage_status × depopulation_status).
  # Application is cyclic (IMPROVEMENTS_REQUIRED -> INSPECTION_PENDING -> IMPROVEMENTS_REQUIRED) and
  # branching (SUBMITTED -> {INSPECTION_PENDING, DECLINED}); Producer is cyclic (APPOINTED -> SUSPENDED ->
  # APPOINTED); Inspection and TakeoutOffer are branching fork points with divergent side-effect sets;
  # AssessmentEvent is compound (SETTLED derived from child AssessmentAllocation states).

  relationship_patterns:
    - one_to_many          # CatastropheZone -> Property/RateFiling/AssessmentEvent; Inspection -> ImprovementRequirement
    - many_to_many         # DeclinationRecord, TakeoutOffer, AssessmentAllocation are junction entities
    - self_referential     # Policy.predecessor_policy_id -> Policy.id (renewal chain)
    - cross_aggregate      # Policy exposure mutates CatastropheZone posture; TakeoutOffer mutates MemberInsurer credits

  role_model: segregation_of_duties
  # Three enforced separations, each keyed on X-User-ID (not on role): the Regulator approving a RateFiling
  # cannot be the RateAnalyst user who filed it; the Underwriter waiving an ImprovementRequirement cannot be
  # the Inspector user who raised it; the Underwriter binding a Policy cannot be the Underwriter user who
  # advanced the Application through eligibility review.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MemberInsurer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the voluntary-market carrier that is a member of the plan
      - name: naic_code
        type: string
        source: input
        description: regulator-issued carrier code; unique across all MemberInsurer rows
        constraints: "5 characters, unique"
      - name: market_share_pct
        type: number
        source: input
        description: statewide homeowners market share, percent with 2 decimals; MARKET_SHARE assessment basis weight
        constraints: "0.00 <= market_share_pct <= 100.00"
      - name: written_premium_share_pct
        type: number
        source: input
        description: share of statewide written premium, percent with 2 decimals; PREMIUM_VOLUME assessment basis weight
        constraints: "0.00 <= written_premium_share_pct <= 100.00"
      - name: status
        type: enum
        source: input
        description: membership standing; gates take-out offers and assessment eligibility
        default: ACTIVE
        constraints: "status IN {ACTIVE, RUNOFF, WITHDRAWN}"
      - name: takeout_credit_count
        type: integer
        source: computed
        description: unspent depopulation credits; +1 per TakeoutOffer that reaches ACCEPTED, decremented when an AssessmentEvent that consumed them reaches SETTLED
        default: 0
      - name: cumulative_assessed_cents
        type: integer
        source: computed
        description: sum of AssessmentAllocation.net_due_cents over this member's allocations whose status IN {PENDING, PAID}
        default: 0

  - name: Producer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: licensed agent name
      - name: license_number
        type: string
        source: input
        description: state producer license number; unique across all Producer rows
        constraints: unique
      - name: commission_tier
        type: enum
        source: input
        description: contractual tier selected in the producer agreement
        constraints: "commission_tier IN {STANDARD, PREFERRED}"
      - name: commission_rate_bps
        type: integer
        source: computed
        description: basis points applied to commissionable premium; 1000 when commission_tier == STANDARD, 1250 when PREFERRED; written when the agreement is executed, 0 while agreement_status == PENDING
        default: 0
      - name: e_and_o_expiry_date
        type: datetime
        source: input
        description: errors-and-omissions coverage expiry date (date only, YYYY-MM-DD)
      - name: agreement_status
        type: enum
        source: system
        description: producer-agreement lifecycle state
        default: PENDING
        constraints: "agreement_status IN {PENDING, APPOINTED, SUSPENDED, TERMINATED}"
      - name: agreement_effective_date
        type: datetime
        source: system
        description: date the producer agreement was executed (date only); null while PENDING
      - name: ytd_commission_cents
        type: integer
        source: computed
        description: "conserved quantity: sum over Policy rows with producer_id == this.id of (commission_credited_cents - commission_returned_cents)"
        default: 0

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: named insured / policyholder-of-record
      - name: email
        type: string
        source: input
        description: contact email; unique across all Applicant rows
        constraints: unique
      - name: phone
        type: string
        source: input
        description: optional contact phone
        default: null

  - name: CatastropheZone
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: rating/exposure territory code; unique across all CatastropheZone rows
        constraints: unique
      - name: peril
        type: enum
        source: input
        description: dominant catastrophe peril of the territory; gates which peril packages may be written
        constraints: "peril IN {HURRICANE, WILDFIRE, EARTHQUAKE}"
      - name: exposure_cap_cents
        type: integer
        source: input
        description: maximum aggregate insured value the plan will carry in this territory
        constraints: "> 0"
      - name: restricted_min_condition_score
        type: integer
        source: input
        description: minimum condition score required to bind while status == RESTRICTED (per-zone configuration)
        default: 70
        constraints: "0 <= restricted_min_condition_score <= 100"
      - name: aggregate_insured_value_cents
        type: integer
        source: computed
        description: sum of Policy.exposure_value_cents over policies in this zone whose coverage_status IN {BOUND, IN_FORCE}
        default: 0
      - name: concentration_ratio
        type: number
        source: computed
        description: aggregate_insured_value_cents / exposure_cap_cents, rounded half-up to 4 decimals
        default: 0.0
      - name: status
        type: enum
        source: computed
        description: exposure posture derived from concentration_ratio; gates binding in this territory
        default: OPEN
        constraints: "status IN {OPEN, RESTRICTED, CLOSED}"

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: cat_zone_id
        type: string
        source: input
        description: FK -> CatastropheZone.id; territory the risk sits in
      - name: address_line
        type: string
        source: input
        description: street address of the insured dwelling
      - name: zip_code
        type: string
        source: input
        description: postal code
      - name: construction_type
        type: enum
        source: input
        description: dominant construction class; drives the construction premium factor
        constraints: "construction_type IN {FRAME, MASONRY, MOBILE}"
      - name: roof_age_years
        type: integer
        source: input
        description: age of the roof covering in whole years
        constraints: ">= 0"
      - name: replacement_cost_cents
        type: integer
        source: input
        description: full replacement cost of the dwelling; caps the dwelling limit
        constraints: "> 0"
      - name: condition_score
        type: integer
        source: input
        description: producer-reported condition score used by the PROVISIONAL_QUOTE premium variant
        constraints: "0 <= condition_score <= 100"
      - name: occupancy
        type: enum
        source: input
        description: occupancy class; VACANT is ineligible to bind until a VACANCY_CURE requirement is CLEARED
        constraints: "occupancy IN {OWNER_OCCUPIED, TENANT_OCCUPIED, VACANT}"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id; the risk being submitted
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the named insured
      - name: producer_id
        type: string
        source: system
        description: FK -> Producer.id; set from the X-User-ID of the submitting Producer, never accepted in the request body
      - name: requested_dwelling_limit_cents
        type: integer
        source: input
        description: Coverage A dwelling limit requested
        constraints: "> 0"
      - name: requested_peril_package
        type: enum
        source: input
        description: narrower-than-homeowners peril package requested
        constraints: "requested_peril_package IN {BASIC_FIRE_EO, EXTENDED_WIND}"
      - name: status
        type: enum
        source: system
        description: eligibility/underwriting lifecycle state
        default: DRAFT
        constraints: "status IN {DRAFT, SUBMITTED, ELIGIBILITY_HELD, INSPECTION_PENDING, IMPROVEMENTS_REQUIRED, APPROVED_TO_BIND, BOUND, DECLINED, WITHDRAWN}"
      - name: declination_count
        type: integer
        source: computed
        description: number of qualifying DeclinationRecord rows per calculations.declination_sufficiency
        default: 0
      - name: eligibility_hold_reason
        type: string
        source: system
        description: reason recorded when submission routes to ELIGIBILITY_HELD; null otherwise
        default: null
      - name: decline_reason
        type: string
        source: system
        description: reason recorded when the application reaches DECLINED; null otherwise
        default: null
      - name: quoted_annual_premium_cents
        type: integer
        source: computed
        description: PROVISIONAL_QUOTE variant of calculations.policy_annual_premium, written on submission
        default: 0
      - name: voluntary_equivalent_premium_cents
        type: integer
        source: computed
        description: same premium formula evaluated with the pinned RateFiling.voluntary_market_avg_rate_per_1000_cents
        default: 0
      - name: voluntary_market_comparison_pct
        type: number
        source: computed
        description: (quoted_annual_premium_cents - voluntary_equivalent_premium_cents) / voluntary_equivalent_premium_cents, half-up to 4 decimals
        default: 0.0
      - name: quote_rate_filing_id
        type: string
        source: computed
        description: FK -> RateFiling.id; the APPROVED filing selected at submission time and pinned for the quote
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock timestamp of the most recent successful submission; anchors the declination lookback window
        default: null
      - name: eligibility_reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the Underwriter who advanced eligibility review; compared against the binding underwriter for segregation of duties
        default: null
      - name: approved_to_bind_at
        type: datetime
        source: system
        description: logical-clock timestamp the application entered APPROVED_TO_BIND
        default: null
      - name: bind_deadline_at
        type: datetime
        source: computed
        description: approved_to_bind_at + BIND_WINDOW_DAYS (30); binding at or before this instant is allowed
        default: null

  - name: DeclinationRecord
    parent: Application
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application the declination supports
      - name: member_insurer_id
        type: string
        source: input
        description: FK -> MemberInsurer.id; the voluntary-market carrier that declined the risk
      - name: declined_on
        type: datetime
        source: input
        description: date the carrier declined (date only, YYYY-MM-DD); must fall inside the lookback window to qualify
      - name: reason_code
        type: enum
        source: input
        description: carrier's stated reason
        constraints: "reason_code IN {CAT_EXPOSURE, CONDITION, LOSS_HISTORY, NON_RENEWAL, APPETITE}"
      - name: evidence_reference
        type: string
        source: input
        description: document locator for the written declination
        constraints: "non-empty string"
      - name: verified
        type: boolean
        source: computed
        description: true when the referenced MemberInsurer.status == ACTIVE at creation time and evidence_reference is non-empty; only verified rows count toward eligibility
        default: false

  - name: Inspection
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application under inspection
      - name: inspector_user_id
        type: string
        source: system
        description: X-User-ID of the Inspector who completed the inspection; compared against a waiving underwriter for segregation of duties
        default: null
      - name: ordered_at
        type: datetime
        source: system
        description: logical-clock timestamp the inspection was ordered
      - name: scheduled_for
        type: datetime
        source: input
        description: requested site-visit date (date only); informational
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock timestamp of completion; anchors the INSPECTION_VALIDITY_DAYS staleness test
        default: null
      - name: observed_condition_score
        type: integer
        source: system
        description: inspector-observed condition score used by the BOUND_FINAL premium variant
        default: null
        constraints: "0 <= observed_condition_score <= 100"
      - name: result
        type: enum
        source: system
        description: inspection outcome; branch point for the application lifecycle
        default: PENDING
        constraints: "result IN {PENDING, PASS, PASS_WITH_CONDITIONS, FAIL}"
      - name: open_requirement_count
        type: integer
        source: computed
        description: count of child ImprovementRequirement rows whose status IN {OPEN, EVIDENCE_SUBMITTED}
        default: 0
      - name: cleared_major_count
        type: integer
        source: computed
        description: count of child ImprovementRequirement rows with severity == MAJOR and status == CLEARED; feeds the improvement credit
        default: 0

  - name: ImprovementRequirement
    parent: Inspection
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: FK -> Inspection.id; the inspection that raised the requirement
      - name: code
        type: enum
        source: input
        description: prescribed remediation
        constraints: "code IN {ROOF_REPLACEMENT, ELECTRICAL_UPDATE, DEFENSIBLE_SPACE, VACANCY_CURE}"
      - name: severity
        type: enum
        source: input
        description: MAJOR requirements earn improvement credit and cannot be waived; MINOR may be waived
        constraints: "severity IN {MAJOR, MINOR}"
      - name: status
        type: enum
        source: system
        description: remediation lifecycle state
        default: OPEN
        constraints: "status IN {OPEN, EVIDENCE_SUBMITTED, CLEARED, WAIVED}"
      - name: due_at
        type: datetime
        source: computed
        description: inspection.completed_at + REQUIREMENT_WINDOW_DAYS (45); informational deadline shown to the producer
        default: null
      - name: evidence_reference
        type: string
        source: system
        description: document locator supplied when evidence is submitted
        default: null
      - name: cleared_at
        type: datetime
        source: system
        description: logical-clock timestamp of clearance or waiver
        default: null
      - name: waiver_reason
        type: string
        source: system
        description: underwriter's justification recorded on waiver
        default: null

  - name: RateFiling
    parent: null
    common_fields: true
    fields:
      - name: cat_zone_id
        type: string
        source: input
        description: FK -> CatastropheZone.id; territory the filing rates
      - name: peril_package
        type: enum
        source: input
        description: package the filed rate applies to
        constraints: "peril_package IN {BASIC_FIRE_EO, EXTENDED_WIND}"
      - name: filed_rate_per_1000_cents
        type: integer
        source: input
        description: filed plan rate in cents per $1,000 of dwelling limit
        constraints: "> 0"
      - name: voluntary_market_avg_rate_per_1000_cents
        type: integer
        source: input
        description: surveyed voluntary-market average rate in cents per $1,000; the non-competition floor is computed from it
        constraints: "> 0"
      - name: effective_date
        type: datetime
        source: input
        description: date the filed rate takes effect (date only); occupies a buffered window on (cat_zone_id, peril_package)
      - name: differential_pct
        type: number
        source: computed
        description: (filed_rate_per_1000_cents - voluntary_market_avg_rate_per_1000_cents) / voluntary_market_avg_rate_per_1000_cents, half-up to 4 decimals
        default: 0.0
      - name: status
        type: enum
        source: system
        description: filing lifecycle state
        default: FILED
        constraints: "status IN {FILED, APPROVED, DISAPPROVED, SUPERSEDED}"
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the RateAnalyst who filed; the reviewing Regulator's X-User-ID must differ
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the Regulator who approved or disapproved the filing
        default: null
      - name: review_note
        type: string
        source: system
        description: regulator's note recorded on review
        default: null

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application being bound
      - name: property_id
        type: string
        source: computed
        description: FK -> Property.id; copied from the application at bind
      - name: applicant_id
        type: string
        source: computed
        description: FK -> Applicant.id; copied from the application at bind; the Policyholder identity for election
      - name: producer_id
        type: string
        source: computed
        description: FK -> Producer.id; copied from the application at bind; receives commission
      - name: rate_filing_id
        type: string
        source: computed
        description: FK -> RateFiling.id; the APPROVED filing selected and version-pinned at bind
      - name: predecessor_policy_id
        type: string
        source: computed
        description: FK -> Policy.id; set on renewal to the policy being renewed, null on an original bind
        default: null
      - name: dwelling_limit_cents
        type: integer
        source: computed
        description: bound Coverage A limit; equals the application's requested limit (or the renewal request)
      - name: peril_package
        type: enum
        source: computed
        description: bound peril package copied from the application
        constraints: "peril_package IN {BASIC_FIRE_EO, EXTENDED_WIND}"
      - name: excluded_perils
        type: array
        source: computed
        description: perils outside the package; ["WINDSTORM","HAIL","WATER_DAMAGE","THEFT","LIABILITY"] for BASIC_FIRE_EO, ["WATER_DAMAGE","THEFT","LIABILITY"] for EXTENDED_WIND
      - name: condition_score_at_bind
        type: integer
        source: computed
        description: observed_condition_score of the inspection used at bind; snapshot for renewal rating
      - name: base_premium_cents
        type: integer
        source: computed
        description: pre-surcharge premium leg of calculations.policy_annual_premium
      - name: cat_surcharge_cents
        type: integer
        source: computed
        description: catastrophe concentration surcharge leg; excluded from commissionable premium
        default: 0
      - name: annual_premium_cents
        type: integer
        source: computed
        description: BOUND_FINAL (or RENEWAL_FINAL) result of calculations.policy_annual_premium
      - name: exposure_value_cents
        type: integer
        source: computed
        description: insured exposure this policy contributes to its zone; equals dwelling_limit_cents
      - name: commission_credited_cents
        type: integer
        source: computed
        description: commission credited to the producer at bind per calculations.producer_commission
        default: 0
      - name: commission_returned_cents
        type: integer
        source: computed
        description: commission returned/clawed back on cancellation or take-out election
        default: 0
      - name: coverage_status
        type: enum
        source: system
        description: coverage dimension of the policy state
        default: BOUND
        constraints: "coverage_status IN {BOUND, IN_FORCE, CANCELLED, EXPIRED, TAKEN_OUT}"
      - name: depopulation_status
        type: enum
        source: system
        description: depopulation dimension of the policy state, independent of coverage_status
        default: NOT_OFFERED
        constraints: "depopulation_status IN {NOT_OFFERED, OFFER_OUTSTANDING, ELECTED_TAKEOUT, ELECTED_RETAIN}"
      - name: effective_date
        type: datetime
        source: input
        description: first day of the policy term (date only); term interval is half-open [effective_date, expiration_date)
      - name: expiration_date
        type: datetime
        source: computed
        description: effective_date + POLICY_TERM_DAYS (365), date only; exclusive end of the term interval
      - name: cancel_reason
        type: enum
        source: system
        description: reason the coverage terminated early; TAKEOUT_ELECTION is written only by the election cascade
        default: null
        constraints: "cancel_reason IN {POLICYHOLDER_REQUEST, PLAN_INITIATED, TAKEOUT_ELECTION}"
      - name: cancellation_date
        type: datetime
        source: system
        description: date coverage ceased (date only)
        default: null
      - name: unearned_premium_cents
        type: integer
        source: computed
        description: unearned premium leg of calculations.cancellation_refund
        default: 0
      - name: cancellation_fee_cents
        type: integer
        source: computed
        description: fee tier keyed on unearned_premium_cents; always 0 when cancel_reason == TAKEOUT_ELECTION
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: unearned_premium_cents - cancellation_fee_cents, floored at 0
        default: 0

  - name: TakeoutOffer
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: FK -> Policy.id; the plan policy the carrier offers to depopulate
      - name: member_insurer_id
        type: string
        source: input
        description: FK -> MemberInsurer.id; the offering voluntary carrier; must equal the caller's X-User-ID
      - name: offered_premium_cents
        type: integer
        source: input
        description: annual premium the carrier offers; capped relative to the plan premium for comparability
        constraints: "> 0"
      - name: comparable_coverage_flag
        type: boolean
        source: input
        description: carrier attestation that coverage is at least as broad as the plan package
      - name: election_deadline_at
        type: datetime
        source: input
        description: last instant (inclusive) the policyholder may elect
      - name: status
        type: enum
        source: system
        description: offer lifecycle state
        default: OUTSTANDING
        constraints: "status IN {OUTSTANDING, ACCEPTED, DECLINED, WITHDRAWN, EXPIRED}"
      - name: elected_at
        type: datetime
        source: system
        description: logical-clock timestamp of the policyholder's election
        default: null
      - name: withdrawal_reason
        type: string
        source: system
        description: carrier's stated reason on withdrawal
        default: null
      - name: credit_units_granted
        type: integer
        source: computed
        description: depopulation credits granted to the offering member when the offer reaches ACCEPTED; 1 per accepted offer, 0 otherwise
        default: 0

  - name: AssessmentEvent
    parent: null
    common_fields: true
    fields:
      - name: cat_zone_id
        type: string
        source: input
        description: FK -> CatastropheZone.id; territory whose losses triggered the assessment
      - name: trigger_loss_cents
        type: integer
        source: input
        description: incurred catastrophe loss for the event
        constraints: ">= 0"
      - name: reserve_balance_cents_at_trigger
        type: integer
        source: input
        description: plan reserve available when the loss was booked
        constraints: ">= 0"
      - name: allocation_basis
        type: enum
        source: input
        description: which MemberInsurer weight the allocation uses
        constraints: "allocation_basis IN {MARKET_SHARE, PREMIUM_VOLUME}"
      - name: assessable_amount_cents
        type: integer
        source: computed
        description: max(0, trigger_loss_cents - reserve_balance_cents_at_trigger)
        default: 0
      - name: allocated_total_cents
        type: integer
        source: computed
        description: sum of AssessmentAllocation.gross_share_cents over this event's allocations whose status != ABATED; must equal assessable_amount_cents while status IN {ALLOCATED, INVOICED, SETTLED}
        default: 0
      - name: remainder_cents
        type: integer
        source: computed
        description: assessable_amount_cents minus the sum of per-member rounded raw shares; may be negative; absorbed by one member per the pinned rule
        default: 0
      - name: status
        type: enum
        source: system
        description: assessment lifecycle state; SETTLED is derived from child allocation states
        default: DRAFT
        constraints: "status IN {DRAFT, ALLOCATED, INVOICED, SETTLED, CANCELLED}"
      - name: allocation_run_count
        type: integer
        source: computed
        description: number of successful allocation runs; a re-run abates the prior allocation set and supersedes it
        default: 0
      - name: cancellation_reason
        type: string
        source: system
        description: reason recorded when the event is cancelled
        default: null

  - name: AssessmentAllocation
    parent: AssessmentEvent
    common_fields: true
    fields:
      - name: assessment_event_id
        type: string
        source: input
        description: FK -> AssessmentEvent.id; the event being apportioned
      - name: member_insurer_id
        type: string
        source: input
        description: FK -> MemberInsurer.id; the assessed member
      - name: basis_weight_pct
        type: number
        source: computed
        description: the member's weight snapshot under the event's allocation_basis at run time
      - name: gross_share_cents
        type: integer
        source: computed
        description: per-member rounded raw share, plus the remainder when this member is the pinned absorber
      - name: takeout_credit_applied_cents
        type: integer
        source: computed
        description: depopulation credit offset, capped at 50% of gross_share_cents
        default: 0
      - name: net_due_cents
        type: integer
        source: computed
        description: gross_share_cents - takeout_credit_applied_cents
      - name: credits_consumed
        type: integer
        source: computed
        description: floor(takeout_credit_applied_cents / CREDIT_UNIT_CENTS); deducted from the member when the event reaches SETTLED
        default: 0
      - name: status
        type: enum
        source: system
        description: allocation lifecycle state
        default: PENDING
        constraints: "status IN {PENDING, PAID, ABATED}"
      - name: paid_at
        type: datetime
        source: system
        description: logical-clock timestamp of payment
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MemberInsurer
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: RUNOFF
        trigger: "PATCH /fair-plan/member-insurers/{id} with status: RUNOFF"
        actor: PlanAdmin
        preconditions: ["member.status == ACTIVE"]
        side_effects:
          - "member remains assessable (RUNOFF is included in the allocation-run eligible set)"
          - "member may no longer create TakeoutOffer rows (validations priority 30)"
          - "increments MemberInsurer.version by 1"
      - from: RUNOFF
        to: WITHDRAWN
        trigger: "PATCH /fair-plan/member-insurers/{id} with status: WITHDRAWN"
        actor: PlanAdmin
        preconditions: ["member.status == RUNOFF"]
        side_effects:
          - "member is excluded from the allocation-run eligible set from this point forward"
          - "new DeclinationRecord rows naming this member are created with verified = false"
          - "increments MemberInsurer.version by 1"

  - entity: Producer
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: APPOINTED
        trigger: "POST /fair-plan/producers/{id}/agreement-execution"
        actor: PlanAdmin
        preconditions: ["producer.agreement_status == PENDING"]
        side_effects:
          - "writes Producer.commission_rate_bps = 1000 when commission_tier == STANDARD, 1250 when PREFERRED"
          - "writes Producer.agreement_effective_date from the request"
          - "increments Producer.version by 1"
      - from: APPOINTED
        to: SUSPENDED
        trigger: "POST /fair-plan/producers/{id}/status-actions with action: SUSPEND"
        actor: PlanAdmin
        preconditions: ["producer.agreement_status == APPOINTED"]
        side_effects:
          - "producer can no longer create or submit applications or have policies bound (validations priority 29)"
          - "existing Policy rows are untouched; ytd_commission_cents is unchanged"
          - "increments Producer.version by 1"
      - from: SUSPENDED
        to: APPOINTED
        trigger: "POST /fair-plan/producers/{id}/status-actions with action: REINSTATE"
        actor: PlanAdmin
        preconditions: ["producer.agreement_status == SUSPENDED"]
        side_effects:
          - "commission_rate_bps is retained from the original agreement execution (not recomputed)"
          - "increments Producer.version by 1"
        note: "APPOINTED -> SUSPENDED -> APPOINTED is a cycle; the plan may suspend and reinstate any number of times."
      - from: APPOINTED
        to: TERMINATED
        trigger: "POST /fair-plan/producers/{id}/status-actions with action: TERMINATE"
        actor: PlanAdmin
        preconditions: ["producer.agreement_status == APPOINTED"]
        side_effects: ["increments Producer.version by 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /fair-plan/producers/{id}/status-actions with action: TERMINATE"
        actor: PlanAdmin
        preconditions: ["producer.agreement_status == SUSPENDED"]
        side_effects: ["increments Producer.version by 1"]

  - entity: Application
    initial_state: DRAFT
    terminal_states: [BOUND, DECLINED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fair-plan/applications/{id}/submission"
        actor: Producer
        preconditions:
          - "application.status == DRAFT"
          - "Producer(application.producer_id).agreement_status == APPOINTED"
          - "an APPROVED RateFiling exists for (property.cat_zone_id, requested_peril_package) with effective_date <= clock date"
          - "calculations.declination_sufficiency yields declination_count >= MIN_DECLINATIONS (3)"
        side_effects:
          - "writes Application.submitted_at = current logical clock"
          - "writes Application.declination_count from calculations.declination_sufficiency"
          - "pins Application.quote_rate_filing_id to the selected APPROVED filing"
          - "writes Application.quoted_annual_premium_cents (PROVISIONAL_QUOTE variant), voluntary_equivalent_premium_cents and voluntary_market_comparison_pct"
          - "increments Application.version by 1"
      - from: DRAFT
        to: ELIGIBILITY_HELD
        trigger: "POST /fair-plan/applications/{id}/submission"
        actor: Producer
        preconditions:
          - "application.status == DRAFT"
          - "Producer(application.producer_id).agreement_status == APPOINTED"
          - "an APPROVED RateFiling exists for (property.cat_zone_id, requested_peril_package) with effective_date <= clock date"
          - "calculations.declination_sufficiency yields declination_count < MIN_DECLINATIONS (3)"
        side_effects:
          - "writes Application.submitted_at = current logical clock"
          - "writes Application.declination_count from calculations.declination_sufficiency"
          - "writes Application.eligibility_hold_reason = 'INSUFFICIENT_DECLINATIONS'"
          - "quote fields are still computed and pinned exactly as on the SUBMITTED branch"
          - "increments Application.version by 1"
        note: "Branch point: identical trigger, divergent side-effect sets keyed on the declination count."
      - from: ELIGIBILITY_HELD
        to: SUBMITTED
        trigger: "POST /fair-plan/applications/{id}/submission (re-submission after more declinations are recorded)"
        actor: Producer
        preconditions:
          - "application.status == ELIGIBILITY_HELD"
          - "calculations.declination_sufficiency yields declination_count >= MIN_DECLINATIONS (3)"
        side_effects:
          - "re-anchors Application.submitted_at to the current logical clock (the lookback window moves with it)"
          - "clears Application.eligibility_hold_reason to null"
          - "recomputes declination_count and all three quote fields, re-pinning quote_rate_filing_id"
          - "increments Application.version by 1"
      - from: SUBMITTED
        to: INSPECTION_PENDING
        trigger: "POST /fair-plan/applications/{id}/eligibility-review with decision: ADVANCE"
        actor: Underwriter
        preconditions:
          - "application.status IN {SUBMITTED, ELIGIBILITY_HELD}"
          - "calculations.declination_sufficiency still yields declination_count >= 3 at review time"
        side_effects:
          - "writes Application.eligibility_reviewer_user_id = caller X-User-ID"
          - "increments Application.version by 1"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /fair-plan/applications/{id}/eligibility-review with decision: DECLINE"
        actor: Underwriter
        preconditions: ["application.status IN {SUBMITTED, ELIGIBILITY_HELD}"]
        side_effects:
          - "writes Application.decline_reason from the request"
          - "writes Application.eligibility_reviewer_user_id = caller X-User-ID"
          - "increments Application.version by 1"
      - from: ELIGIBILITY_HELD
        to: DECLINED
        trigger: "POST /fair-plan/applications/{id}/eligibility-review with decision: DECLINE"
        actor: Underwriter
        preconditions: ["application.status == ELIGIBILITY_HELD"]
        side_effects:
          - "writes Application.decline_reason from the request"
          - "writes Application.eligibility_reviewer_user_id = caller X-User-ID"
          - "increments Application.version by 1"
      - from: INSPECTION_PENDING
        to: APPROVED_TO_BIND
        trigger: "POST /fair-plan/inspections/{id}/completion with result: PASS (system cascade)"
        actor: system
        preconditions: ["inspection.application_id == application.id", "inspection.result == PENDING before completion"]
        side_effects:
          - "writes Application.approved_to_bind_at = current logical clock and bind_deadline_at = approved_to_bind_at + 30 days"
          - "increments Application.version by 1"
      - from: INSPECTION_PENDING
        to: IMPROVEMENTS_REQUIRED
        trigger: "POST /fair-plan/inspections/{id}/completion with result: PASS_WITH_CONDITIONS (system cascade)"
        actor: system
        preconditions: ["at least one ImprovementRequirement row is created by the completion request"]
        side_effects:
          - "approved_to_bind_at and bind_deadline_at remain null"
          - "increments Application.version by 1"
      - from: INSPECTION_PENDING
        to: DECLINED
        trigger: "POST /fair-plan/inspections/{id}/completion with result: FAIL (system cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "writes Application.decline_reason = 'INSPECTION_FAILED'"
          - "increments Application.version by 1"
      - from: IMPROVEMENTS_REQUIRED
        to: INSPECTION_PENDING
        trigger: "POST /fair-plan/applications/{id}/inspections (re-inspection ordered)"
        actor: Underwriter
        preconditions: ["application.status == IMPROVEMENTS_REQUIRED"]
        side_effects:
          - "creates a new Inspection row in result == PENDING; requirements raised by the previous inspection keep their own status"
          - "increments Application.version by 1"
        note: "IMPROVEMENTS_REQUIRED -> INSPECTION_PENDING -> IMPROVEMENTS_REQUIRED is a cycle; re-inspection may repeat."
      - from: IMPROVEMENTS_REQUIRED
        to: APPROVED_TO_BIND
        trigger: "POST /fair-plan/improvement-requirements/{id}/clearance or .../waiver clearing the last open requirement (system cascade)"
        actor: system
        preconditions: ["the parent Inspection.open_requirement_count reached 0", "parent Inspection.result == PASS_WITH_CONDITIONS before the cascade"]
        side_effects:
          - "writes Application.approved_to_bind_at = current logical clock and bind_deadline_at = approved_to_bind_at + 30 days"
          - "increments Application.version by 1"
      - from: APPROVED_TO_BIND
        to: BOUND
        trigger: "POST /fair-plan/policies"
        actor: Underwriter
        preconditions:
          - "application.status == APPROVED_TO_BIND"
          - "caller X-User-ID != application.eligibility_reviewer_user_id"
          - "clock <= application.bind_deadline_at"
          - "the inspection used was completed within INSPECTION_VALIDITY_DAYS (90) of the bind date"
          - "CatastropheZone(property.cat_zone_id).status != CLOSED"
        side_effects:
          - "creates the Policy row (see Policy state machine for the downstream cascade)"
          - "increments Application.version by 1"
      - from: APPROVED_TO_BIND
        to: WITHDRAWN
        trigger: "POST /fair-plan/sweeps/expiration (system, clock > bind_deadline_at)"
        actor: system
        preconditions: ["application.status == APPROVED_TO_BIND", "clock > application.bind_deadline_at"]
        side_effects:
          - "writes Application.eligibility_hold_reason = 'BIND_WINDOW_LAPSED'"
          - "increments Application.version by 1"

  - entity: Inspection
    initial_state: PENDING
    terminal_states: [PASS, PASS_WITH_CONDITIONS, FAIL]
    transitions:
      - from: PENDING
        to: PASS
        trigger: "POST /fair-plan/inspections/{id}/completion with result: PASS"
        actor: Inspector
        preconditions: ["inspection.result == PENDING", "the request supplies no requirements"]
        side_effects:
          - "writes inspector_user_id, completed_at, observed_condition_score"
          - "cascades Application INSPECTION_PENDING -> APPROVED_TO_BIND"
          - "increments Inspection.version by 1"
      - from: PENDING
        to: PASS_WITH_CONDITIONS
        trigger: "POST /fair-plan/inspections/{id}/completion with result: PASS_WITH_CONDITIONS"
        actor: Inspector
        preconditions: ["inspection.result == PENDING", "the request supplies at least one requirement"]
        side_effects:
          - "writes inspector_user_id, completed_at, observed_condition_score"
          - "creates one ImprovementRequirement per requested entry in status OPEN with due_at = completed_at + 45 days"
          - "writes Inspection.open_requirement_count = number of created requirements and cleared_major_count = 0"
          - "cascades Application INSPECTION_PENDING -> IMPROVEMENTS_REQUIRED"
          - "increments Inspection.version by 1"
      - from: PENDING
        to: FAIL
        trigger: "POST /fair-plan/inspections/{id}/completion with result: FAIL"
        actor: Inspector
        preconditions: ["inspection.result == PENDING"]
        side_effects:
          - "writes inspector_user_id, completed_at, observed_condition_score"
          - "creates no ImprovementRequirement rows even if requirements are supplied"
          - "cascades Application INSPECTION_PENDING -> DECLINED"
          - "increments Inspection.version by 1"
        note: "Fork point with three divergent side-effect sets on one trigger."

  - entity: ImprovementRequirement
    initial_state: OPEN
    terminal_states: [CLEARED, WAIVED]
    transitions:
      - from: OPEN
        to: EVIDENCE_SUBMITTED
        trigger: "POST /fair-plan/improvement-requirements/{id}/evidence"
        actor: Producer
        preconditions: ["requirement.status == OPEN", "the requesting Producer owns the requirement's application"]
        side_effects:
          - "writes ImprovementRequirement.evidence_reference"
          - "parent Inspection.open_requirement_count is unchanged (EVIDENCE_SUBMITTED still counts as open)"
          - "increments ImprovementRequirement.version by 1"
      - from: EVIDENCE_SUBMITTED
        to: CLEARED
        trigger: "POST /fair-plan/improvement-requirements/{id}/clearance"
        actor: Inspector
        preconditions: ["requirement.status == EVIDENCE_SUBMITTED"]
        side_effects:
          - "writes cleared_at = current logical clock; increments ImprovementRequirement.version by 1"
          - "hop 2: decrements parent Inspection.open_requirement_count by 1 and, when severity == MAJOR, increments Inspection.cleared_major_count by 1; increments Inspection.version by 1"
          - "hop 3: because Inspection.open_requirement_count reached 0, Inspection.result flips PASS_WITH_CONDITIONS -> PASS and the Application cascades IMPROVEMENTS_REQUIRED -> APPROVED_TO_BIND with bind_deadline_at written"
      - from: OPEN
        to: WAIVED
        trigger: "POST /fair-plan/improvement-requirements/{id}/waiver"
        actor: Underwriter
        preconditions:
          - "requirement.status == OPEN"
          - "requirement.severity == MINOR"
          - "caller X-User-ID != parent Inspection.inspector_user_id"
        side_effects:
          - "writes waiver_reason and cleared_at; increments ImprovementRequirement.version by 1"
          - "hop 2: decrements parent Inspection.open_requirement_count by 1; cleared_major_count is NOT incremented (a waiver earns no improvement credit)"
          - "hop 3: when open_requirement_count reaches 0, Inspection.result flips to PASS and the Application cascades IMPROVEMENTS_REQUIRED -> APPROVED_TO_BIND"
      - from: EVIDENCE_SUBMITTED
        to: WAIVED
        trigger: "POST /fair-plan/improvement-requirements/{id}/waiver"
        actor: Underwriter
        preconditions:
          - "requirement.status == EVIDENCE_SUBMITTED"
          - "requirement.severity == MINOR"
          - "caller X-User-ID != parent Inspection.inspector_user_id"
        side_effects: ["same cascade as the OPEN -> WAIVED transition"]

  - entity: RateFiling
    initial_state: FILED
    terminal_states: [DISAPPROVED, SUPERSEDED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /fair-plan/rate-filings/{id}/review with decision: APPROVE"
        actor: Regulator
        preconditions:
          - "filing.status == FILED"
          - "caller X-User-ID != filing.filed_by_user_id"
          - "filing.effective_date >= (latest APPROVED filing on the same (cat_zone_id, peril_package)).effective_date + FILING_QUIET_BUFFER_DAYS (30)"
        side_effects:
          - "writes reviewed_by_user_id and review_note; increments RateFiling.version by 1"
          - "the previously APPROVED filing on the same (cat_zone_id, peril_package), if any, transitions APPROVED -> SUPERSEDED"
          - "increments CatastropheZone.version by 1 (the zone's rate posture changed)"
      - from: FILED
        to: DISAPPROVED
        trigger: "POST /fair-plan/rate-filings/{id}/review with decision: DISAPPROVE"
        actor: Regulator
        preconditions: ["filing.status == FILED", "caller X-User-ID != filing.filed_by_user_id"]
        side_effects:
          - "writes reviewed_by_user_id and review_note; increments RateFiling.version by 1"
          - "no filing is superseded and CatastropheZone.version is NOT incremented"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "approval of a later filing on the same (cat_zone_id, peril_package) (system cascade)"
        actor: system
        preconditions: ["filing.status == APPROVED", "the newly approved filing has a strictly later effective_date"]
        side_effects:
          - "increments RateFiling.version by 1"
          - "Policy rows already bound keep their pinned rate_filing_id and their annual_premium_cents unchanged"

  - entity: Policy
    initial_state: BOUND
    terminal_states: [CANCELLED, EXPIRED, TAKEN_OUT]
    transitions:
      - from: BOUND
        to: IN_FORCE
        trigger: "POST /fair-plan/sweeps/expiration (system, clock date >= effective_date)"
        actor: system
        preconditions: ["policy.coverage_status == BOUND", "clock date >= policy.effective_date"]
        side_effects:
          - "increments Policy.version by 1"
          - "CatastropheZone.aggregate_insured_value_cents is unchanged (BOUND already counted the exposure)"
        note: "A bind whose effective_date is already <= the clock date lands directly in IN_FORCE; this transition covers future-dated binds."
      - from: IN_FORCE
        to: CANCELLED
        trigger: "POST /fair-plan/policies/{id}/cancellation"
        actor: Underwriter
        preconditions: ["policy.coverage_status == IN_FORCE", "cancel_reason IN {POLICYHOLDER_REQUEST, PLAN_INITIATED}"]
        side_effects:
          - "writes cancel_reason, cancellation_date, unearned_premium_cents, cancellation_fee_cents, refund_cents per calculations.cancellation_refund"
          - "writes Policy.commission_returned_cents per calculations.producer_commission and decrements Producer.ytd_commission_cents by the same amount"
          - "hop 2: because the policy left {BOUND, IN_FORCE}, CatastropheZone.aggregate_insured_value_cents decreases by policy.exposure_value_cents and concentration_ratio is recomputed"
          - "hop 3: because concentration_ratio changed, CatastropheZone.status is re-derived (CLOSED -> RESTRICTED -> OPEN as the ratio falls); increments CatastropheZone.version by 1"
          - "increments Policy.version by 1"
      - from: BOUND
        to: CANCELLED
        trigger: "POST /fair-plan/policies/{id}/cancellation"
        actor: PlanAdmin
        preconditions: ["policy.coverage_status == BOUND", "cancel_reason == PLAN_INITIATED"]
        side_effects:
          - "same refund, commission and zone cascade as the IN_FORCE -> CANCELLED transition; unearned_fraction is 1 when cancellation_date == effective_date"
      - from: IN_FORCE
        to: TAKEN_OUT
        trigger: "POST /fair-plan/takeout-offers/{id}/election with election: ACCEPT (system cascade)"
        actor: system
        preconditions: ["policy.coverage_status == IN_FORCE", "offer.status == OUTSTANDING", "clock <= offer.election_deadline_at"]
        side_effects:
          - "writes cancel_reason = TAKEOUT_ELECTION, cancellation_date = clock date, cancellation_fee_cents = 0 and refund_cents = unearned_premium_cents (PRO_RATA variant)"
          - "writes depopulation_status = ELECTED_TAKEOUT on the same row"
          - "claws back commission: writes commission_returned_cents and decrements Producer.ytd_commission_cents"
          - "hop 3: CatastropheZone.aggregate_insured_value_cents decreases by exposure_value_cents; concentration_ratio recomputed"
          - "hop 4: CatastropheZone.status re-derived from the new ratio; increments CatastropheZone.version by 1"
          - "increments Policy.version by 1"
      - from: IN_FORCE
        to: EXPIRED
        trigger: "POST /fair-plan/sweeps/expiration (system, clock date >= expiration_date)"
        actor: system
        preconditions: ["policy.coverage_status == IN_FORCE", "clock date >= policy.expiration_date"]
        side_effects:
          - "CatastropheZone.aggregate_insured_value_cents decreases by exposure_value_cents; concentration_ratio and status re-derived; increments CatastropheZone.version by 1"
          - "no refund and no commission return (the full term was earned)"
          - "increments Policy.version by 1"
      - from: NOT_OFFERED
        to: OFFER_OUTSTANDING
        trigger: "POST /fair-plan/policies/{id}/takeout-offers"
        actor: MemberInsurerUser
        preconditions: ["policy.coverage_status == IN_FORCE", "policy.depopulation_status == NOT_OFFERED", "MemberInsurer.status == ACTIVE"]
        side_effects:
          - "creates the TakeoutOffer row in OUTSTANDING"
          - "increments Policy.version by 1"
        note: "depopulation_status is the second, independent state dimension on the Policy row; coverage_status is untouched by this transition."
      - from: OFFER_OUTSTANDING
        to: ELECTED_TAKEOUT
        trigger: "POST /fair-plan/takeout-offers/{id}/election with election: ACCEPT"
        actor: Policyholder
        preconditions: ["policy.depopulation_status == OFFER_OUTSTANDING", "offer.status == OUTSTANDING"]
        side_effects: ["drives the coverage dimension IN_FORCE -> TAKEN_OUT in the same request"]
      - from: OFFER_OUTSTANDING
        to: ELECTED_RETAIN
        trigger: "POST /fair-plan/takeout-offers/{id}/election with election: DECLINE"
        actor: Policyholder
        preconditions: ["policy.depopulation_status == OFFER_OUTSTANDING", "offer.status == OUTSTANDING"]
        side_effects:
          - "coverage_status is unchanged (the policy stays IN_FORCE), no refund, no commission clawback, no zone recomputation"
          - "MemberInsurer.takeout_credit_count is NOT incremented"
          - "increments Policy.version by 1"
      - from: OFFER_OUTSTANDING
        to: NOT_OFFERED
        trigger: "POST /fair-plan/takeout-offers/{id}/withdrawal, or POST /fair-plan/sweeps/expiration when clock > election_deadline_at"
        actor: MemberInsurerUser | system
        preconditions: ["policy.depopulation_status == OFFER_OUTSTANDING"]
        side_effects:
          - "the policy becomes offerable again by any ACTIVE member (this dimension is cyclic)"
          - "increments Policy.version by 1"

  - entity: TakeoutOffer
    initial_state: OUTSTANDING
    terminal_states: [ACCEPTED, DECLINED, WITHDRAWN, EXPIRED]
    transitions:
      - from: OUTSTANDING
        to: ACCEPTED
        trigger: "POST /fair-plan/takeout-offers/{id}/election with election: ACCEPT"
        actor: Policyholder
        preconditions:
          - "offer.status == OUTSTANDING"
          - "clock <= offer.election_deadline_at"
          - "Policy(offer.policy_id).applicant_id == caller X-User-ID"
        side_effects:
          - "writes elected_at and credit_units_granted = 1; increments TakeoutOffer.version by 1"
          - "hop 2: increments MemberInsurer.takeout_credit_count by credit_units_granted; increments MemberInsurer.version by 1"
          - "hop 2 (coverage branch): Policy coverage_status IN_FORCE -> TAKEN_OUT and depopulation_status -> ELECTED_TAKEOUT with refund and commission clawback"
          - "hop 3: CatastropheZone.aggregate_insured_value_cents drops by policy.exposure_value_cents; concentration_ratio recomputed"
          - "hop 4: CatastropheZone.status re-derived from the new ratio"
      - from: OUTSTANDING
        to: DECLINED
        trigger: "POST /fair-plan/takeout-offers/{id}/election with election: DECLINE"
        actor: Policyholder
        preconditions: ["offer.status == OUTSTANDING", "clock <= offer.election_deadline_at", "Policy(offer.policy_id).applicant_id == caller X-User-ID"]
        side_effects:
          - "writes elected_at and credit_units_granted = 0; increments TakeoutOffer.version by 1"
          - "Policy.depopulation_status -> ELECTED_RETAIN; coverage_status, zone exposure and producer commission are all untouched"
        note: "Same trigger as ACCEPT with a disjoint side-effect set — no credit, no refund, no zone recomputation."
      - from: OUTSTANDING
        to: WITHDRAWN
        trigger: "POST /fair-plan/takeout-offers/{id}/withdrawal"
        actor: MemberInsurerUser
        preconditions: ["offer.status == OUTSTANDING", "offer.member_insurer_id == caller X-User-ID"]
        side_effects:
          - "writes withdrawal_reason; increments TakeoutOffer.version by 1"
          - "Policy.depopulation_status OFFER_OUTSTANDING -> NOT_OFFERED"
      - from: OUTSTANDING
        to: EXPIRED
        trigger: "POST /fair-plan/sweeps/expiration (system, clock > election_deadline_at)"
        actor: system
        preconditions: ["offer.status == OUTSTANDING", "clock > offer.election_deadline_at"]
        side_effects:
          - "increments TakeoutOffer.version by 1"
          - "Policy.depopulation_status OFFER_OUTSTANDING -> NOT_OFFERED"
          - "MemberInsurer.takeout_credit_count is unchanged"

  - entity: AssessmentEvent
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ALLOCATED
        trigger: "POST /fair-plan/assessment-events/{id}/allocation-run"
        actor: PlanAdmin
        preconditions:
          - "event.status == DRAFT"
          - "expected_assessment_event_version == event.version"
          - "assessable_amount_cents > 0"
          - "the eligible member set is non-empty and its total basis weight > 0"
        side_effects:
          - "creates one AssessmentAllocation per eligible member per calculations.assessment_allocation_shares"
          - "writes allocated_total_cents, remainder_cents and increments allocation_run_count by 1"
          - "increases each member's cumulative_assessed_cents by its allocation.net_due_cents; increments each MemberInsurer.version by 1"
          - "increments AssessmentEvent.version by 1"
      - from: ALLOCATED
        to: ALLOCATED
        trigger: "POST /fair-plan/assessment-events/{id}/allocation-run (re-run supersedes the prior allocation set)"
        actor: PlanAdmin
        preconditions: ["event.status == ALLOCATED", "expected_assessment_event_version == event.version"]
        side_effects:
          - "every prior allocation on this event whose status == PENDING transitions PENDING -> ABATED"
          - "creates a fresh allocation set from the current member weights; increments allocation_run_count"
          - "each member's cumulative_assessed_cents is recomputed from non-ABATED allocations only"
          - "increments AssessmentEvent.version by 1"
        note: "This self-loop is why the allocation run needs OCC: a re-run is a legitimate supersede, so a stale caller cannot be rejected by a state precondition."
      - from: ALLOCATED
        to: INVOICED
        trigger: "POST /fair-plan/assessment-events/{id}/invoicing"
        actor: PlanAdmin
        preconditions: ["event.status == ALLOCATED", "allocated_total_cents == assessable_amount_cents"]
        side_effects:
          - "allocations become payable; increments AssessmentEvent.version by 1"
      - from: INVOICED
        to: SETTLED
        trigger: "POST /fair-plan/assessment-allocations/{id}/payment paying the last PENDING allocation (system cascade)"
        actor: system
        preconditions: ["event.status == INVOICED", "no allocation on the event remains in status PENDING"]
        side_effects:
          - "hop 3: for every allocation on the event, decrements MemberInsurer.takeout_credit_count by allocation.credits_consumed and increments MemberInsurer.version by 1"
          - "increments AssessmentEvent.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fair-plan/assessment-events/{id}/cancellation"
        actor: PlanAdmin
        preconditions: ["event.status == DRAFT"]
        side_effects: ["writes cancellation_reason; increments AssessmentEvent.version by 1"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /fair-plan/assessment-events/{id}/cancellation"
        actor: PlanAdmin
        preconditions: ["event.status == ALLOCATED"]
        side_effects:
          - "every allocation with status == PENDING transitions PENDING -> ABATED"
          - "each affected member's cumulative_assessed_cents decreases by that allocation's net_due_cents, restoring the pre-event value; increments each MemberInsurer.version by 1"
          - "writes allocated_total_cents = 0 and cancellation_reason; increments AssessmentEvent.version by 1"
      - from: INVOICED
        to: CANCELLED
        trigger: "POST /fair-plan/assessment-events/{id}/cancellation"
        actor: PlanAdmin
        preconditions: ["event.status == INVOICED"]
        side_effects:
          - "PENDING allocations are ABATED exactly as on the ALLOCATED -> CANCELLED transition; PAID allocations keep status PAID and their net_due_cents stays inside cumulative_assessed_cents"

  - entity: AssessmentAllocation
    initial_state: PENDING
    terminal_states: [PAID, ABATED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /fair-plan/assessment-allocations/{id}/payment"
        actor: MemberInsurerUser
        preconditions:
          - "allocation.status == PENDING"
          - "parent AssessmentEvent.status == INVOICED"
          - "allocation.member_insurer_id == caller X-User-ID"
          - "MemberInsurer.status IN {ACTIVE, RUNOFF}"
          - "amount_cents == allocation.net_due_cents"
        side_effects:
          - "writes paid_at; increments AssessmentAllocation.version by 1"
          - "hop 2: when this was the last PENDING allocation, parent AssessmentEvent INVOICED -> SETTLED"
          - "hop 3: because the event became SETTLED, every allocation's credits_consumed is deducted from its member's takeout_credit_count"
      - from: PENDING
        to: ABATED
        trigger: "POST /fair-plan/assessment-events/{id}/cancellation or a superseding allocation-run (system cascade)"
        actor: system
        preconditions: ["allocation.status == PENDING"]
        side_effects:
          - "member.cumulative_assessed_cents decreases by this allocation's net_due_cents"
          - "increments AssessmentAllocation.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: rate-filing-create-stale-zone
    parent_entity: CatastropheZone
    write_endpoint: "POST /fair-plan/rate-filings"
    occ_field: "expected_zone_version"
    description: |
      Filing a rate for a CatastropheZone whose version has advanced since the analyst last read it is
      rejected with a stale-version error. Multiple FILED filings may legitimately coexist on the same
      (cat_zone_id, peril_package), so a second filing is not blocked by any state precondition; the only
      thing that makes it wrong is that the zone's rate and exposure posture moved underneath the analyst
      (an approval superseded the prior filing, or a bind/cancellation re-derived the zone status) after
      the version the request carries.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: allocation-run-stale-assessment
    parent_entity: AssessmentEvent
    write_endpoint: "POST /fair-plan/assessment-events/{id}/allocation-run"
    occ_field: "expected_assessment_event_version"
    description: |
      Running the allocation for an AssessmentEvent whose version has advanced since the administrator last
      read it is rejected with a stale-version error. A re-run from ALLOCATED is a legitimate supersede (it
      abates the prior PENDING allocations and rebuilds the set from current member weights), so the state
      machine cannot reject the second caller; only the stale version can.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: declination_sufficiency
    trigger: "POST /fair-plan/applications/{id}/submission, and re-evaluated on POST /fair-plan/applications/{id}/eligibility-review with decision ADVANCE"
    algorithm: aggregation
    formula: |
      anchor_date = date(application.submitted_at)            # re-anchored on every submission
      window_start = anchor_date - DECLINATION_LOOKBACK_DAYS   # inclusive
      window_end   = anchor_date                              # inclusive
      qualifying = [ d for d in DeclinationRecord
                     where d.application_id == application.id
                       and d.verified == true
                       and window_start <= date(d.declined_on) <= window_end ]
      # distinct-carrier collapse: at most one row per member_insurer_id counts.
      # When one carrier has several qualifying rows, the row with the latest declined_on counts;
      # tie-break on identical declined_on: earliest created_at.
      declination_count = count(distinct d.member_insurer_id for d in qualifying)
      sufficient = (declination_count >= MIN_DECLINATIONS)
    input_set: |
      DeclinationRecord rows on this application with verified == true only. verified is false when the
      named MemberInsurer.status != ACTIVE at creation time, so declinations sourced from RUNOFF or
      WITHDRAWN carriers never count. Rows outside the inclusive 60-day window are excluded.
    constants:
      DECLINATION_LOOKBACK_DAYS: 60
      MIN_DECLINATIONS: 3
    precision: "integer count; date comparison at day granularity, both window bounds inclusive"
    variants:
      - name: SUBMISSION_ROUTING
        when: "evaluated inside POST /applications/{id}/submission"
        difference: "count >= 3 routes the application to SUBMITTED; count < 3 routes it to ELIGIBILITY_HELD and writes eligibility_hold_reason — no error is raised"
      - name: ADVANCE_GATE
        when: "evaluated inside POST /applications/{id}/eligibility-review with decision ADVANCE"
        difference: "count < 3 raises ERR_INSUFFICIENT_DECLINATIONS (422) instead of routing; the anchor date is the unchanged submitted_at, so declinations can age out of the window between submission and review"

  - name: policy_annual_premium
    trigger: "POST /fair-plan/applications/{id}/submission (PROVISIONAL_QUOTE), POST /fair-plan/policies (BOUND_FINAL), POST /fair-plan/policies/{id}/renewal (RENEWAL_FINAL)"
    algorithm: tiered_pricing
    formula: |
      # Step order is pinned. Every money step is rounded half-up to whole cents before the next step.
      rate = selected_filing.filed_rate_per_1000_cents          # see input_set for selection
      base_premium_cents = round_half_up( rate
                                          * (dwelling_limit_cents / 100000)
                                          * CONSTRUCTION_FACTOR[property.construction_type]
                                          * OCCUPANCY_FACTOR[property.occupancy]
                                          * PACKAGE_FACTOR[peril_package] )
      cat_surcharge_pct = min( CAT_SURCHARGE_CAP_PCT,
                               max( 0, (zone.concentration_ratio - CAT_SURCHARGE_FLOOR_RATIO)
                                        * CAT_SURCHARGE_SLOPE ) )
      cat_surcharge_cents = round_half_up(base_premium_cents * cat_surcharge_pct)
      pre_credit_premium_cents = base_premium_cents + cat_surcharge_cents
      # condition_adjustment_pct and improvement_credit_pct are BOTH keyed on pre_credit_premium_cents,
      # never on the running total — this pins the otherwise circular-looking dependency.
      condition_adjustment_pct = -0.10 if score >= 85
                            else -0.05 if score >= 70
                            else  0.00 if score >= 50
                            else  0.15
      condition_adjustment_cents = round_half_up(pre_credit_premium_cents * condition_adjustment_pct)
      improvement_credit_pct = min( IMPROVEMENT_CREDIT_CAP_PCT,
                                    IMPROVEMENT_CREDIT_PER_MAJOR_PCT * cleared_major_count )
      improvement_credit_cents = round_half_up(pre_credit_premium_cents * improvement_credit_pct)
      annual_premium_cents = max( MIN_ANNUAL_PREMIUM_CENTS,
                                  pre_credit_premium_cents
                                  + condition_adjustment_cents
                                  - improvement_credit_cents )
    input_set: |
      Rate selection: the RateFiling with status == APPROVED, matching (property.cat_zone_id, peril_package),
      and effective_date <= the reference date, choosing the row with the greatest effective_date; tie-break
      on identical effective_date: earliest created_at. Reference date is the clock date of the triggering
      request. zone.concentration_ratio is read BEFORE this policy's own exposure is added. cleared_major_count
      comes from the Inspection used by the variant (0 for PROVISIONAL_QUOTE and RENEWAL_FINAL).
    constants:
      CONSTRUCTION_FACTOR: { FRAME: 1.25, MASONRY: 1.00, MOBILE: 1.60 }
      OCCUPANCY_FACTOR: { OWNER_OCCUPIED: 1.00, TENANT_OCCUPIED: 1.15, VACANT: 1.45 }
      PACKAGE_FACTOR: { BASIC_FIRE_EO: 1.00, EXTENDED_WIND: 1.35 }
      CAT_SURCHARGE_FLOOR_RATIO: 0.60
      CAT_SURCHARGE_SLOPE: 0.45
      CAT_SURCHARGE_CAP_PCT: 0.25
      IMPROVEMENT_CREDIT_PER_MAJOR_PCT: 0.04
      IMPROVEMENT_CREDIT_CAP_PCT: 0.08
      MIN_ANNUAL_PREMIUM_CENTS: 35000
    precision: "whole cents, round_half_up at each pinned step; concentration_ratio read at 4 decimals"
    variants:
      - name: PROVISIONAL_QUOTE
        when: "written to Application.quoted_annual_premium_cents on submission"
        difference: "score = property.condition_score (producer-reported); cleared_major_count = 0 so no improvement credit exists; rate reference date is the submission clock date"
      - name: BOUND_FINAL
        when: "written to Policy.annual_premium_cents on POST /fair-plan/policies"
        difference: "score = inspection.observed_condition_score (inspector-observed, may differ from the reported score and move the condition tier); cleared_major_count = inspection.cleared_major_count so the improvement credit applies; rate reference date is the bind clock date"
      - name: RENEWAL_FINAL
        when: "written to the successor Policy on POST /fair-plan/policies/{id}/renewal"
        difference: "score = predecessor.condition_score_at_bind; cleared_major_count = 0 (improvement credits do not persist across terms); rate reference date is the renewal effective_date"
      - name: VOLUNTARY_EQUIVALENT
        when: "written to Application.voluntary_equivalent_premium_cents on submission"
        difference: "identical to PROVISIONAL_QUOTE except rate = selected_filing.voluntary_market_avg_rate_per_1000_cents"

  - name: voluntary_market_comparison
    trigger: "POST /fair-plan/applications/{id}/submission (writes Application.voluntary_market_comparison_pct); POST /fair-plan/rate-filings (writes RateFiling.differential_pct)"
    algorithm: threshold
    formula: |
      # filing-level differential, evaluated at filing time
      differential_pct = round_half_up_4( (filed_rate_per_1000_cents
                                           - voluntary_market_avg_rate_per_1000_cents)
                                          / voluntary_market_avg_rate_per_1000_cents )
      filing_admissible = (differential_pct >= MIN_VOLUNTARY_DIFFERENTIAL_PCT)   # >=, not >
      # application-level comparison, evaluated at submission
      voluntary_market_comparison_pct = round_half_up_4(
          (quoted_annual_premium_cents - voluntary_equivalent_premium_cents)
          / voluntary_equivalent_premium_cents )
    input_set: "the single RateFiling row being created (differential), or the filing pinned as Application.quote_rate_filing_id (comparison)"
    constants:
      MIN_VOLUNTARY_DIFFERENTIAL_PCT: 0.10
    precision: "ratio rounded half-up to 4 decimals; comparison at exactly 0.1000 is admissible"

  - name: zone_concentration_posture
    trigger: "any transition that adds or removes a Policy from {BOUND, IN_FORCE} — bind, renewal, cancellation, take-out acceptance, expiration sweep"
    algorithm: aggregation
    formula: |
      aggregate_insured_value_cents = sum( p.exposure_value_cents
                                           for p in Policy
                                           where p.property_id IN properties of this zone
                                             and p.coverage_status IN {BOUND, IN_FORCE} )
      concentration_ratio = round_half_up_4( aggregate_insured_value_cents / exposure_cap_cents )
      status = CLOSED     if concentration_ratio >= 1.0000
          else RESTRICTED if concentration_ratio >= 0.8500
          else OPEN
    input_set: |
      Only Policy rows whose coverage_status IN {BOUND, IN_FORCE} count. CANCELLED, EXPIRED and TAKEN_OUT
      policies are excluded, which is what makes the exposure-conservation invariant exact. Policies are
      attributed to a zone through Property.cat_zone_id.
    constants:
      RESTRICTED_RATIO: 0.85
      CLOSED_RATIO: 1.00
    precision: "ratio half-up to 4 decimals; thresholds are inclusive (>=)"

  - name: assessment_assessable_amount
    trigger: "POST /fair-plan/assessment-events (writes the field) and re-checked on POST /fair-plan/assessment-events/{id}/allocation-run"
    algorithm: threshold
    formula: |
      assessable_amount_cents = max(0, trigger_loss_cents - reserve_balance_cents_at_trigger)
      assessable = (assessable_amount_cents > 0)     # strictly greater than zero
    input_set: "the two input fields on the AssessmentEvent row; no aggregation over other entities"
    constants: {}
    precision: "whole cents; equality of loss and reserve yields exactly 0 and blocks the allocation run"

  - name: assessment_allocation_shares
    trigger: "POST /fair-plan/assessment-events/{id}/allocation-run"
    algorithm: waterfall_allocation
    formula: |
      eligible = [ m for m in MemberInsurer where m.status IN {ACTIVE, RUNOFF} ]     # WITHDRAWN excluded
      weight(m) = m.market_share_pct            if event.allocation_basis == MARKET_SHARE
                  m.written_premium_share_pct   if event.allocation_basis == PREMIUM_VOLUME
      total_weight = sum(weight(m) for m in eligible)
      # PINNED ROUNDING ORDER: round each member's raw share to whole cents FIRST, then reconcile the
      # residue. Summing raw shares and rounding once at the end is explicitly NOT the rule.
      raw_share(m)   = assessable_amount_cents * weight(m) / total_weight
      gross_share(m) = round_half_up(raw_share(m))
      remainder_cents = assessable_amount_cents - sum(gross_share(m) for m in eligible)   # may be negative
      absorber = the eligible member with the greatest weight(m);
                 tie-break on equal weight: earliest MemberInsurer.created_at
      gross_share(absorber) += remainder_cents
      takeout_credit_applied_cents(m) = min( round_half_up(gross_share(m) * MAX_CREDIT_OFFSET_PCT),
                                             m.takeout_credit_count * CREDIT_UNIT_CENTS )
      net_due_cents(m)  = gross_share(m) - takeout_credit_applied_cents(m)
      credits_consumed(m) = floor( takeout_credit_applied_cents(m) / CREDIT_UNIT_CENTS )
    input_set: |
      MemberInsurer rows with status IN {ACTIVE, RUNOFF} at run time; weights are snapshotted onto
      AssessmentAllocation.basis_weight_pct. A superseding re-run re-reads the current weights, so a member
      whose status moved to WITHDRAWN between runs drops out and total_weight changes.
    constants:
      MAX_CREDIT_OFFSET_PCT: 0.50
      CREDIT_UNIT_CENTS: 500000
    precision: "whole cents; per-member round_half_up before reconciliation; remainder assigned to exactly one member"
    variants:
      - name: MARKET_SHARE
        when: "event.allocation_basis == MARKET_SHARE"
        difference: "weight is MemberInsurer.market_share_pct; a member with a small market share but a large premium book is assessed less than under PREMIUM_VOLUME for the identical event"
      - name: PREMIUM_VOLUME
        when: "event.allocation_basis == PREMIUM_VOLUME"
        difference: "weight is MemberInsurer.written_premium_share_pct; both the per-member shares AND the identity of the remainder absorber can differ from MARKET_SHARE on the same event"

  - name: cancellation_refund
    trigger: "POST /fair-plan/policies/{id}/cancellation, and the take-out acceptance cascade on POST /fair-plan/takeout-offers/{id}/election"
    algorithm: decay_function
    formula: |
      days_in_force = (cancellation_date - policy.effective_date) in whole days
      unearned_fraction = max(0, POLICY_TERM_DAYS - days_in_force) / POLICY_TERM_DAYS
      unearned_premium_cents = round_half_up(policy.annual_premium_cents * unearned_fraction)          # PRO_RATA
                             | round_half_up(policy.annual_premium_cents * unearned_fraction * SHORT_RATE_FACTOR)  # SHORT_RATE
      # The fee tier is keyed on unearned_premium_cents, NOT on the refund it is subtracted from.
      cancellation_fee_cents = 0                                   if cancel_reason == TAKEOUT_ELECTION
                          else 0                                   if unearned_premium_cents == 0
                          else FEE_SMALL_CENTS                      if unearned_premium_cents <= FEE_TIER_1_CENTS
                          else FEE_MEDIUM_CENTS                     if unearned_premium_cents <= FEE_TIER_2_CENTS
                          else round_half_up(unearned_premium_cents * FEE_LARGE_PCT)
      refund_cents = max(0, unearned_premium_cents - cancellation_fee_cents)
    input_set: "the single Policy row being terminated; unearned_fraction always uses the PRO_RATA fraction even when the SHORT_RATE variant reduces the unearned premium"
    constants:
      POLICY_TERM_DAYS: 365
      SHORT_RATE_FACTOR: 0.90
      FEE_TIER_1_CENTS: 50000
      FEE_TIER_2_CENTS: 200000
      FEE_SMALL_CENTS: 2500
      FEE_MEDIUM_CENTS: 5000
      FEE_LARGE_PCT: 0.03
    precision: "whole cents, round_half_up; day arithmetic on dates only"
    variants:
      - name: PRO_RATA
        when: "cancel_reason IN {PLAN_INITIATED, TAKEOUT_ELECTION}"
        difference: "the full unearned fraction is refunded; for TAKEOUT_ELECTION the fee is additionally forced to 0"
      - name: SHORT_RATE
        when: "cancel_reason == POLICYHOLDER_REQUEST"
        difference: "the unearned premium is multiplied by 0.90 before the fee tier is selected, so the same policy and date yield both a smaller refund and possibly a lower fee tier"

  - name: producer_commission
    trigger: "POST /fair-plan/policies and POST /fair-plan/policies/{id}/renewal (credit); POST /fair-plan/policies/{id}/cancellation and the take-out acceptance cascade (return)"
    algorithm: aggregation
    formula: |
      commissionable_premium_cents = policy.annual_premium_cents - policy.cat_surcharge_cents
      commission_credited_cents = round_half_up( commissionable_premium_cents
                                                * producer.commission_rate_bps / 10000 )
      # on early termination, the same unearned_fraction used by cancellation_refund is applied
      commission_returned_cents = round_half_up( policy.commission_credited_cents * unearned_fraction )
      # conserved quantity, recomputed after every credit or return:
      producer.ytd_commission_cents = sum( p.commission_credited_cents - p.commission_returned_cents
                                           for p in Policy where p.producer_id == producer.id )
    input_set: |
      All Policy rows of the producer regardless of coverage_status — CANCELLED and TAKEN_OUT policies stay
      in the sum with their returned amounts, which is what keeps the identity exact.
    constants:
      RATE_BPS_STANDARD: 1000
      RATE_BPS_PREFERRED: 1250
    precision: "whole cents, round_half_up; the catastrophe surcharge is never commissionable"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the caller's role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request schema: required body fields present, enum members valid, integers non-negative, dates ISO-8601, condition scores within 0..100, limit within 1..100, offset >= 0, evidence_reference non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "every path id resolves, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the body resolves (cat_zone_id, applicant_id, property_id, application_id, member_insurer_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /fair-plan/properties, POST /fair-plan/applications, POST /fair-plan/applications/{id}/declinations, POST /fair-plan/rate-filings, POST /fair-plan/policies, POST /fair-plan/policies/{id}/takeout-offers, POST /fair-plan/assessment-events"
  - priority: 6
    category: auth
    check: "entity-backed ownership: Producer acts only on applications whose producer_id equals X-User-ID (and requirements reachable from them); Policyholder acts only on offers whose policy.applicant_id equals X-User-ID; MemberInsurerUser acts only where member_insurer_id equals X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /fair-plan/applications/{id}/submission, POST /fair-plan/applications/{id}/declinations, POST /fair-plan/improvement-requirements/{id}/evidence, POST /fair-plan/policies/{id}/takeout-offers, POST /fair-plan/takeout-offers/{id}/election, POST /fair-plan/takeout-offers/{id}/withdrawal, POST /fair-plan/assessment-allocations/{id}/payment"
  - priority: 7
    category: state
    check: "the supplied expected_*_version equals the parent entity's current version (see concurrency_rules)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fair-plan/rate-filings, POST /fair-plan/assessment-events/{id}/allocation-run"
  - priority: 8
    category: business_constraint
    check: "uniqueness of MemberInsurer.naic_code, Producer.license_number, CatastropheZone.code and Applicant.email"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /fair-plan/member-insurers, POST /fair-plan/producers, POST /fair-plan/cat-zones, POST /fair-plan/applicants"
  - priority: 9
    category: business_constraint
    check: "no existing DeclinationRecord has the same (application_id, member_insurer_id) pair"
    error_id: ERR_DUPLICATE_DECLINATION
    http_status: 409
    applies_to: "POST /fair-plan/applications/{id}/declinations"
  - priority: 10
    category: state
    check: "application.status IN {DRAFT, ELIGIBILITY_HELD}"
    error_id: ERR_APPLICATION_NOT_SUBMITTABLE
    http_status: 409
    applies_to: "POST /fair-plan/applications/{id}/submission"
  - priority: 11
    category: state
    check: "application.status IN {SUBMITTED, ELIGIBILITY_HELD}"
    error_id: ERR_APPLICATION_NOT_REVIEWABLE
    http_status: 409
    applies_to: "POST /fair-plan/applications/{id}/eligibility-review"
  - priority: 12
    category: state
    check: "application.status IN {INSPECTION_PENDING, IMPROVEMENTS_REQUIRED}"
    error_id: ERR_INSPECTION_NOT_ORDERABLE
    http_status: 409
    applies_to: "POST /fair-plan/applications/{id}/inspections"
  - priority: 13
    category: state
    check: "inspection.result == PENDING"
    error_id: ERR_INSPECTION_ALREADY_COMPLETED
    http_status: 409
    applies_to: "POST /fair-plan/inspections/{id}/completion"
  - priority: 14
    category: state
    check: "requirement.status == OPEN for evidence; == EVIDENCE_SUBMITTED for clearance; IN {OPEN, EVIDENCE_SUBMITTED} for waiver"
    error_id: ERR_REQUIREMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /fair-plan/improvement-requirements/{id}/evidence, POST /fair-plan/improvement-requirements/{id}/clearance, POST /fair-plan/improvement-requirements/{id}/waiver"
  - priority: 15
    category: state
    check: "filing.status == FILED"
    error_id: ERR_FILING_NOT_REVIEWABLE
    http_status: 409
    applies_to: "POST /fair-plan/rate-filings/{id}/review"
  - priority: 16
    category: state
    check: "application.status == APPROVED_TO_BIND"
    error_id: ERR_APPLICATION_NOT_BINDABLE
    http_status: 409
    applies_to: "POST /fair-plan/policies"
  - priority: 17
    category: state
    check: "policy.coverage_status == IN_FORCE (cancellation additionally accepts BOUND when cancel_reason == PLAN_INITIATED)"
    error_id: ERR_POLICY_NOT_IN_FORCE
    http_status: 409
    applies_to: "POST /fair-plan/policies/{id}/cancellation, POST /fair-plan/policies/{id}/renewal, POST /fair-plan/policies/{id}/takeout-offers"
  - priority: 18
    category: state
    check: "policy.depopulation_status == NOT_OFFERED"
    error_id: ERR_OFFER_ALREADY_OUTSTANDING
    http_status: 409
    applies_to: "POST /fair-plan/policies/{id}/takeout-offers"
  - priority: 19
    category: state
    check: "offer.status == OUTSTANDING"
    error_id: ERR_OFFER_NOT_OUTSTANDING
    http_status: 409
    applies_to: "POST /fair-plan/takeout-offers/{id}/election, POST /fair-plan/takeout-offers/{id}/withdrawal"
  - priority: 20
    category: state
    check: "event.status == DRAFT or ALLOCATED for allocation-run; == ALLOCATED for invoicing; IN {DRAFT, ALLOCATED, INVOICED} for cancellation"
    error_id: ERR_ASSESSMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /fair-plan/assessment-events/{id}/allocation-run, POST /fair-plan/assessment-events/{id}/invoicing, POST /fair-plan/assessment-events/{id}/cancellation"
  - priority: 21
    category: state
    check: "allocation.status == PENDING and parent AssessmentEvent.status == INVOICED"
    error_id: ERR_ALLOCATION_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /fair-plan/assessment-allocations/{id}/payment"
  - priority: 22
    category: state
    check: "producer.agreement_status == PENDING for agreement-execution; == APPOINTED for SUSPEND; == SUSPENDED for REINSTATE; IN {APPOINTED, SUSPENDED} for TERMINATE"
    error_id: ERR_PRODUCER_STATUS_INVALID
    http_status: 409
    applies_to: "POST /fair-plan/producers/{id}/agreement-execution, POST /fair-plan/producers/{id}/status-actions"
  - priority: 23
    category: business_safety
    check: "segregation of duties: the reviewing Regulator's X-User-ID differs from filing.filed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /fair-plan/rate-filings/{id}/review"
  - priority: 24
    category: business_safety
    check: "segregation of duties: the waiving Underwriter's X-User-ID differs from the parent Inspection.inspector_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /fair-plan/improvement-requirements/{id}/waiver"
  - priority: 25
    category: business_safety
    check: "segregation of duties: the binding Underwriter's X-User-ID differs from application.eligibility_reviewer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /fair-plan/policies"
  - priority: 26
    category: business_safety
    check: "requirement.severity == MINOR (MAJOR requirements must be physically remediated)"
    error_id: ERR_MAJOR_REQUIREMENT_NOT_WAIVABLE
    http_status: 422
    applies_to: "POST /fair-plan/improvement-requirements/{id}/waiver"
  - priority: 27
    category: business_safety
    check: "CatastropheZone(property.cat_zone_id).status != CLOSED"
    error_id: ERR_ZONE_CLOSED
    http_status: 409
    applies_to: "POST /fair-plan/policies, POST /fair-plan/policies/{id}/renewal"
  - priority: 28
    category: business_safety
    check: "when zone.status == RESTRICTED: property.construction_type == MASONRY AND the rating condition score (inspection.observed_condition_score at bind, predecessor.condition_score_at_bind at renewal) >= zone.restricted_min_condition_score"
    error_id: ERR_ZONE_RESTRICTED_INELIGIBLE
    http_status: 409
    applies_to: "POST /fair-plan/policies, POST /fair-plan/policies/{id}/renewal"
  - priority: 29
    category: business_referential
    check: "Producer(application.producer_id).agreement_status == APPOINTED"
    error_id: ERR_PRODUCER_NOT_APPOINTED
    http_status: 409
    applies_to: "POST /fair-plan/applications, POST /fair-plan/applications/{id}/submission, POST /fair-plan/policies, POST /fair-plan/policies/{id}/renewal"
  - priority: 30
    category: business_referential
    check: "MemberInsurer.status == ACTIVE to create a take-out offer; IN {ACTIVE, RUNOFF} to pay an allocation"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /fair-plan/policies/{id}/takeout-offers, POST /fair-plan/assessment-allocations/{id}/payment"
  - priority: 31
    category: business_referential
    check: "an APPROVED RateFiling exists for (property.cat_zone_id, peril_package) with effective_date <= the reference date"
    error_id: ERR_NO_APPROVED_RATE
    http_status: 409
    applies_to: "POST /fair-plan/applications/{id}/submission, POST /fair-plan/policies, POST /fair-plan/policies/{id}/renewal"
  - priority: 32
    category: business_constraint
    check: "calculations.declination_sufficiency yields declination_count >= 3 (ADVANCE_GATE variant)"
    error_id: ERR_INSUFFICIENT_DECLINATIONS
    http_status: 422
    applies_to: "POST /fair-plan/applications/{id}/eligibility-review with decision ADVANCE"
  - priority: 33
    category: business_constraint
    check: "requested_peril_package == EXTENDED_WIND is offered only where CatastropheZone.peril == HURRICANE"
    error_id: ERR_PERIL_NOT_OFFERED
    http_status: 422
    applies_to: "POST /fair-plan/applications"
  - priority: 34
    category: business_constraint
    check: "dwelling limit <= MAX_DWELLING_LIMIT_CENTS (150000000) AND <= property.replacement_cost_cents"
    error_id: ERR_COVERAGE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /fair-plan/applications, POST /fair-plan/policies/{id}/renewal"
  - priority: 35
    category: business_constraint
    check: "property.occupancy != VACANT unless the inspection used at bind has a VACANCY_CURE requirement in status CLEARED"
    error_id: ERR_VACANT_PROPERTY_INELIGIBLE
    http_status: 422
    applies_to: "POST /fair-plan/policies"
  - priority: 36
    category: business_temporal
    check: "the inspection used at bind has completed_at within INSPECTION_VALIDITY_DAYS (90) of the bind clock date, inclusive"
    error_id: ERR_INSPECTION_STALE
    http_status: 422
    applies_to: "POST /fair-plan/policies"
  - priority: 37
    category: business_temporal
    check: "the bind clock instant is <= application.bind_deadline_at"
    error_id: ERR_BIND_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /fair-plan/policies"
  - priority: 38
    category: business_temporal
    check: "half-open term overlap on the property: the new [effective_date, expiration_date) must not intersect the term of any Policy on the same property_id whose coverage_status IN {BOUND, IN_FORCE}; touching endpoints (new.effective_date == existing.expiration_date) do NOT collide"
    error_id: ERR_POLICY_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /fair-plan/policies, POST /fair-plan/policies/{id}/renewal"
  - priority: 39
    category: business_temporal
    check: "buffered closed window on (cat_zone_id, peril_package): the filing being approved must have effective_date >= latest APPROVED filing.effective_date + FILING_QUIET_BUFFER_DAYS (30); a date inside the buffer, including exactly the 29th day, collides"
    error_id: ERR_FILING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /fair-plan/rate-filings/{id}/review with decision APPROVE"
  - priority: 40
    category: business_temporal
    check: "the election clock instant is <= offer.election_deadline_at (inclusive)"
    error_id: ERR_ELECTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /fair-plan/takeout-offers/{id}/election"
  - priority: 41
    category: business_fiscal
    check: "differential_pct >= MIN_VOLUNTARY_DIFFERENTIAL_PCT (0.10) — the plan may not undercut the voluntary market"
    error_id: ERR_RATE_BELOW_VOLUNTARY_FLOOR
    http_status: 422
    applies_to: "POST /fair-plan/rate-filings"
  - priority: 42
    category: business_fiscal
    check: "comparable_coverage_flag == true AND offered_premium_cents <= round_half_up(policy.annual_premium_cents * 1.15)"
    error_id: ERR_OFFER_NOT_COMPARABLE
    http_status: 422
    applies_to: "POST /fair-plan/policies/{id}/takeout-offers"
  - priority: 43
    category: business_fiscal
    check: "zone.aggregate_insured_value_cents + this policy's exposure_value_cents <= zone.exposure_cap_cents"
    error_id: ERR_ZONE_EXPOSURE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /fair-plan/policies, POST /fair-plan/policies/{id}/renewal"
  - priority: 44
    category: business_fiscal
    check: "assessable_amount_cents > 0"
    error_id: ERR_LOSSES_WITHIN_RESERVES
    http_status: 422
    applies_to: "POST /fair-plan/assessment-events/{id}/allocation-run"
  - priority: 45
    category: business_fiscal
    check: "the eligible member set (status IN {ACTIVE, RUNOFF}) is non-empty and its total basis weight under the event's allocation_basis is > 0"
    error_id: ERR_NO_ASSESSABLE_MEMBERS
    http_status: 422
    applies_to: "POST /fair-plan/assessment-events/{id}/allocation-run"
  - priority: 46
    category: business_fiscal
    check: "amount_cents == allocation.net_due_cents (exact settlement only)"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /fair-plan/assessment-allocations/{id}/payment"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving / ops surface ---
  - method: POST
    path: "/fair-plan/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (fixed startup default) and never falls back to real wall-clock time."
    roles: [PlanAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["all subsequent deadline, lookback, staleness and term comparisons use the new instant"]
  - method: POST
    path: "/fair-plan/sweeps/expiration"
    description: "Nightly plan batch: activates future-dated binds, expires terms, expires lapsed take-out offers, withdraws applications whose bind window lapsed."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: "{ activated_policy_count: integer, expired_policy_count: integer, expired_offer_count: integer, withdrawn_application_count: integer }"
    side_effects:
      - "Policy BOUND -> IN_FORCE when clock date >= effective_date"
      - "Policy IN_FORCE -> EXPIRED when clock date >= expiration_date, releasing zone exposure and re-deriving zone status"
      - "TakeoutOffer OUTSTANDING -> EXPIRED when clock > election_deadline_at, resetting Policy.depopulation_status to NOT_OFFERED"
      - "Application APPROVED_TO_BIND -> WITHDRAWN when clock > bind_deadline_at"

  # --- member insurers ---
  - method: POST
    path: "/fair-plan/member-insurers"
    description: "Admit a voluntary-market carrier as a plan member."
    roles: [PlanAdmin]
    code: 201
    input: [name, naic_code, market_share_pct, written_premium_share_pct]
    output: MemberInsurer
    side_effects: ["status initialised to ACTIVE; takeout_credit_count and cumulative_assessed_cents to 0"]
  - method: PATCH
    path: "/fair-plan/member-insurers/{id}"
    description: "Move a member into run-off or withdrawal, or restate its assessment basis weights."
    roles: [PlanAdmin]
    code: 200
    input: ["status?", "market_share_pct?", "written_premium_share_pct?"]
    output: MemberInsurer
    side_effects:
      - "ACTIVE -> RUNOFF -> WITHDRAWN per the MemberInsurer state machine"
      - "increments MemberInsurer.version by 1"
      - "already-created AssessmentAllocation rows are not re-weighted; only a superseding allocation-run re-reads the weights"
  - method: GET
    path: "/fair-plan/member-insurers/{id}"
    description: "Read one member insurer including its credit and assessment counters."
    roles: [PlanAdmin, Regulator, MemberInsurerUser]
    code: 200
    input: []
    output: MemberInsurer
    side_effects: []
  - method: GET
    path: "/fair-plan/member-insurers"
    description: "List member insurers with optional status filter and pagination."
    roles: [PlanAdmin, Regulator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MemberInsurer[]
    side_effects: []
  - method: GET
    path: "/fair-plan/member-insurers/{id}/declinations"
    description: "Declinations this carrier has issued (reverse lookup for DeclinationRecord.member_insurer_id)."
    roles: [PlanAdmin, Regulator, MemberInsurerUser]
    code: 200
    input: ["limit?", "offset?"]
    output: DeclinationRecord[]
    side_effects: []
  - method: GET
    path: "/fair-plan/member-insurers/{id}/allocations"
    description: "Assessment allocations charged to this carrier (reverse lookup for AssessmentAllocation.member_insurer_id)."
    roles: [PlanAdmin, MemberInsurerUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AssessmentAllocation[]
    side_effects: []

  # --- catastrophe zones ---
  - method: POST
    path: "/fair-plan/cat-zones"
    description: "Define a catastrophe exposure territory with its aggregate cap."
    roles: [PlanAdmin]
    code: 201
    input: [code, peril, exposure_cap_cents, "restricted_min_condition_score?"]
    output: CatastropheZone
    side_effects: ["aggregate_insured_value_cents 0, concentration_ratio 0.0, status OPEN"]
  - method: GET
    path: "/fair-plan/cat-zones/{id}"
    description: "Read one territory including its derived exposure posture."
    roles: [PlanAdmin, Regulator, Underwriter, RateAnalyst]
    code: 200
    input: []
    output: CatastropheZone
    side_effects: []
  - method: GET
    path: "/fair-plan/cat-zones/{id}/properties"
    description: "Properties located in this territory (reverse lookup for Property.cat_zone_id)."
    roles: [PlanAdmin, Underwriter]
    code: 200
    input: ["limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: GET
    path: "/fair-plan/cat-zones/{id}/rate-filings"
    description: "Rate filings for this territory (reverse lookup for RateFiling.cat_zone_id)."
    roles: [PlanAdmin, RateAnalyst, Regulator, Underwriter]
    code: 200
    input: ["status?", "peril_package?", "limit?", "offset?"]
    output: RateFiling[]
    side_effects: []
  - method: GET
    path: "/fair-plan/cat-zones/{id}/assessment-events"
    description: "Assessment events triggered by losses in this territory (reverse lookup for AssessmentEvent.cat_zone_id)."
    roles: [PlanAdmin, Regulator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AssessmentEvent[]
    side_effects: []

  # --- producers ---
  - method: POST
    path: "/fair-plan/producers"
    description: "Register a licensed producer; the agreement starts unexecuted."
    roles: [PlanAdmin]
    code: 201
    input: [full_name, license_number, commission_tier, e_and_o_expiry_date]
    output: Producer
    side_effects: ["agreement_status PENDING, commission_rate_bps 0, ytd_commission_cents 0"]
  - method: POST
    path: "/fair-plan/producers/{id}/agreement-execution"
    description: "Execute the producer agreement, which appoints the producer and fixes the commission rate."
    roles: [PlanAdmin]
    code: 200
    input: [agreement_effective_date]
    output: Producer
    side_effects: ["PENDING -> APPOINTED", "writes commission_rate_bps from commission_tier", "increments Producer.version by 1"]
  - method: POST
    path: "/fair-plan/producers/{id}/status-actions"
    description: "Suspend, reinstate or terminate an appointed producer."
    roles: [PlanAdmin]
    code: 200
    input: [action, "reason?"]
    output: Producer
    side_effects: ["APPOINTED <-> SUSPENDED cycle and TERMINATE per the Producer state machine", "increments Producer.version by 1"]
  - method: GET
    path: "/fair-plan/producers/{id}"
    description: "Read one producer including the conserved ytd_commission_cents."
    roles: [PlanAdmin, Producer, Underwriter]
    code: 200
    input: []
    output: Producer
    side_effects: []

  # --- applicants & properties ---
  - method: POST
    path: "/fair-plan/applicants"
    description: "Create the named-insured record a producer will submit for."
    roles: [Producer]
    code: 201
    input: [full_name, email, "phone?"]
    output: Applicant
    side_effects: ["the returned id is the X-User-ID the Policyholder role authenticates with"]
  - method: POST
    path: "/fair-plan/properties"
    description: "Register the risk being submitted, inside a catastrophe territory."
    roles: [Producer]
    code: 201
    input: [cat_zone_id, address_line, zip_code, construction_type, roof_age_years, replacement_cost_cents, condition_score, occupancy]
    output: Property
    side_effects: []
  - method: GET
    path: "/fair-plan/properties/{id}"
    description: "Read one property."
    roles: [Producer, Underwriter, Inspector, PlanAdmin]
    code: 200
    input: []
    output: Property
    side_effects: []

  # --- applications ---
  - method: POST
    path: "/fair-plan/applications"
    description: "Open a FAIR Plan application in DRAFT; producer_id is taken from X-User-ID."
    roles: [Producer]
    code: 201
    input: [property_id, applicant_id, requested_dwelling_limit_cents, requested_peril_package]
    output: Application
    side_effects: ["status DRAFT, declination_count 0, all quote fields 0"]
  - method: GET
    path: "/fair-plan/applications/{id}"
    description: "Read one application including declination_count and the pinned quote fields."
    roles: [Producer, Underwriter, Inspector, PlanAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/fair-plan/applications"
    description: "List applications filtered by applicant, property, producer, pinned quote filing or status (reverse lookup for Application.applicant_id / property_id / producer_id / quote_rate_filing_id)."
    roles: [Underwriter, PlanAdmin]
    code: 200
    input: ["applicant_id?", "property_id?", "producer_id?", "quote_rate_filing_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/fair-plan/applications/{id}/declinations"
    description: "Record a documented voluntary-market declination supporting eligibility."
    roles: [Producer]
    code: 201
    input: [member_insurer_id, declined_on, reason_code, evidence_reference]
    output: DeclinationRecord
    side_effects: ["computes DeclinationRecord.verified from the named member's status and the evidence reference"]
  - method: GET
    path: "/fair-plan/applications/{id}/declinations"
    description: "Declinations recorded on this application (reverse lookup for DeclinationRecord.application_id)."
    roles: [Producer, Underwriter, PlanAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: DeclinationRecord[]
    side_effects: []
  - method: POST
    path: "/fair-plan/applications/{id}/submission"
    description: "Submit or re-submit the application; routes to SUBMITTED or ELIGIBILITY_HELD on the declination count and pins the quote."
    roles: [Producer]
    code: 200
    input: []
    output: Application
    side_effects:
      - "writes submitted_at, declination_count, quote_rate_filing_id, quoted_annual_premium_cents, voluntary_equivalent_premium_cents, voluntary_market_comparison_pct"
      - "DRAFT -> SUBMITTED | ELIGIBILITY_HELD, or ELIGIBILITY_HELD -> SUBMITTED"
      - "increments Application.version by 1"
  - method: POST
    path: "/fair-plan/applications/{id}/eligibility-review"
    description: "Underwriter advances or declines eligibility; ADVANCE re-checks the declination window."
    roles: [Underwriter]
    code: 200
    input: [decision, "decline_reason?"]
    output: Application
    side_effects: ["writes eligibility_reviewer_user_id", "SUBMITTED|ELIGIBILITY_HELD -> INSPECTION_PENDING | DECLINED", "increments Application.version by 1"]
  - method: POST
    path: "/fair-plan/applications/{id}/inspections"
    description: "Order a property inspection or a re-inspection."
    roles: [Underwriter]
    code: 201
    input: ["scheduled_for?"]
    output: Inspection
    side_effects: ["creates Inspection in result PENDING with ordered_at = clock", "IMPROVEMENTS_REQUIRED -> INSPECTION_PENDING when re-ordering", "increments Application.version by 1"]
  - method: GET
    path: "/fair-plan/applications/{id}/inspections"
    description: "Inspections ordered on this application (reverse lookup for Inspection.application_id)."
    roles: [Underwriter, Inspector, Producer, PlanAdmin]
    code: 200
    input: ["result?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  # --- inspections & improvement requirements ---
  - method: GET
    path: "/fair-plan/inspections/{id}"
    description: "Read one inspection including open_requirement_count and cleared_major_count."
    roles: [Underwriter, Inspector, Producer, PlanAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/fair-plan/inspections/{id}/completion"
    description: "Inspector completes the inspection with PASS, PASS_WITH_CONDITIONS (raising requirements) or FAIL."
    roles: [Inspector]
    code: 200
    input: [observed_condition_score, result, "requirements?"]
    output: Inspection
    side_effects:
      - "writes inspector_user_id, completed_at, observed_condition_score"
      - "PASS_WITH_CONDITIONS creates one ImprovementRequirement per supplied {code, severity} entry with due_at = completed_at + 45 days"
      - "cascades the Application to APPROVED_TO_BIND, IMPROVEMENTS_REQUIRED or DECLINED"
      - "increments Inspection.version and Application.version by 1"
  - method: GET
    path: "/fair-plan/inspections/{id}/requirements"
    description: "Improvement requirements raised by this inspection (reverse lookup for ImprovementRequirement.inspection_id)."
    roles: [Underwriter, Inspector, Producer, PlanAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ImprovementRequirement[]
    side_effects: []
  - method: POST
    path: "/fair-plan/improvement-requirements/{id}/evidence"
    description: "Producer submits remediation evidence for a requirement."
    roles: [Producer]
    code: 200
    input: [evidence_reference]
    output: ImprovementRequirement
    side_effects: ["OPEN -> EVIDENCE_SUBMITTED", "open_requirement_count unchanged", "increments ImprovementRequirement.version by 1"]
  - method: POST
    path: "/fair-plan/improvement-requirements/{id}/clearance"
    description: "Inspector clears a remediated requirement, driving the inspection and application cascade."
    roles: [Inspector]
    code: 200
    input: ["note?"]
    output: ImprovementRequirement
    side_effects:
      - "EVIDENCE_SUBMITTED -> CLEARED with cleared_at"
      - "decrements Inspection.open_requirement_count; increments cleared_major_count when severity == MAJOR"
      - "when open_requirement_count reaches 0: Inspection PASS_WITH_CONDITIONS -> PASS and Application IMPROVEMENTS_REQUIRED -> APPROVED_TO_BIND with bind_deadline_at"
  - method: POST
    path: "/fair-plan/improvement-requirements/{id}/waiver"
    description: "Underwriter waives a MINOR requirement; the raising inspector may not waive it."
    roles: [Underwriter]
    code: 200
    input: [reason]
    output: ImprovementRequirement
    side_effects:
      - "OPEN|EVIDENCE_SUBMITTED -> WAIVED with waiver_reason and cleared_at"
      - "decrements Inspection.open_requirement_count without touching cleared_major_count"
      - "same terminal cascade to APPROVED_TO_BIND when it was the last open requirement"

  # --- rate filings ---
  - method: POST
    path: "/fair-plan/rate-filings"
    description: "Rate analyst files a plan rate against a territory and package, carrying the zone version last observed."
    roles: [RateAnalyst]
    code: 201
    input: [cat_zone_id, peril_package, filed_rate_per_1000_cents, voluntary_market_avg_rate_per_1000_cents, effective_date, expected_zone_version]
    output: RateFiling
    side_effects:
      - "writes differential_pct and filed_by_user_id; status FILED"
      - "increments CatastropheZone.version by 1"
  - method: POST
    path: "/fair-plan/rate-filings/{id}/review"
    description: "Regulator approves or disapproves a filing; approval supersedes the prior approved filing."
    roles: [Regulator]
    code: 200
    input: [decision, "note?"]
    output: RateFiling
    side_effects:
      - "FILED -> APPROVED | DISAPPROVED with reviewed_by_user_id and review_note"
      - "on APPROVE: prior APPROVED filing on the same (cat_zone_id, peril_package) -> SUPERSEDED and CatastropheZone.version increments by 1"
  - method: GET
    path: "/fair-plan/rate-filings/{id}"
    description: "Read one rate filing including differential_pct."
    roles: [RateAnalyst, Regulator, Underwriter, PlanAdmin]
    code: 200
    input: []
    output: RateFiling
    side_effects: []

  # --- policies ---
  - method: POST
    path: "/fair-plan/policies"
    description: "Underwriter binds an approved application into a plan policy. The inspection used for rating and for the staleness, vacancy and restricted-zone checks is the application's most recently completed Inspection (greatest completed_at; tie-break earliest created_at)."
    roles: [Underwriter]
    code: 201
    input: [application_id, effective_date]
    output: Policy
    side_effects:
      - "computes the BOUND_FINAL premium, cat_surcharge_cents, exposure_value_cents, excluded_perils and condition_score_at_bind; pins rate_filing_id"
      - "credits producer commission and increases Producer.ytd_commission_cents"
      - "adds exposure_value_cents to CatastropheZone.aggregate_insured_value_cents, recomputes concentration_ratio and re-derives zone status; increments CatastropheZone.version by 1"
      - "coverage_status IN_FORCE when effective_date <= clock date, otherwise BOUND; depopulation_status NOT_OFFERED"
      - "Application APPROVED_TO_BIND -> BOUND; increments Application.version by 1"
  - method: GET
    path: "/fair-plan/policies/{id}"
    description: "Read one policy including both state dimensions and all premium legs."
    roles: [Underwriter, PlanAdmin, Policyholder, Producer, MemberInsurerUser]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: GET
    path: "/fair-plan/policies"
    description: "List policies filtered by any foreign key or either state dimension (reverse lookup for every Policy FK, including the self-referential predecessor_policy_id)."
    roles: [Underwriter, PlanAdmin, MemberInsurerUser]
    code: 200
    input: ["application_id?", "property_id?", "applicant_id?", "producer_id?", "rate_filing_id?", "predecessor_policy_id?", "coverage_status?", "depopulation_status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []
  - method: POST
    path: "/fair-plan/policies/{id}/cancellation"
    description: "Cancel coverage mid-term with the short-rate or pro-rata refund variant."
    roles: [Underwriter, PlanAdmin]
    code: 200
    input: [cancel_reason, cancel_date]
    output: Policy
    side_effects:
      - "writes unearned_premium_cents, cancellation_fee_cents, refund_cents per calculations.cancellation_refund"
      - "writes commission_returned_cents and decrements Producer.ytd_commission_cents"
      - "releases zone exposure, recomputes concentration_ratio and re-derives zone status; increments CatastropheZone.version by 1"
  - method: POST
    path: "/fair-plan/policies/{id}/renewal"
    description: "Renew an in-force policy into a successor term (RENEWAL_FINAL rating, predecessor_policy_id set)."
    roles: [Underwriter]
    code: 201
    input: [effective_date, "requested_dwelling_limit_cents?"]
    output: Policy
    side_effects:
      - "creates a successor Policy with predecessor_policy_id set and the RENEWAL_FINAL premium"
      - "adds the successor's exposure to the zone and re-derives zone status"
      - "credits producer commission on the successor policy"
  - method: POST
    path: "/fair-plan/policies/{id}/takeout-offers"
    description: "An ACTIVE member carrier offers to take the policy out of the plan."
    roles: [MemberInsurerUser]
    code: 201
    input: [member_insurer_id, offered_premium_cents, comparable_coverage_flag, election_deadline_at]
    output: TakeoutOffer
    side_effects: ["creates TakeoutOffer OUTSTANDING", "Policy.depopulation_status NOT_OFFERED -> OFFER_OUTSTANDING", "increments Policy.version by 1"]

  # --- take-out offers ---
  - method: GET
    path: "/fair-plan/takeout-offers/{id}"
    description: "Read one take-out offer."
    roles: [MemberInsurerUser, Policyholder, PlanAdmin, Underwriter]
    code: 200
    input: []
    output: TakeoutOffer
    side_effects: []
  - method: GET
    path: "/fair-plan/takeout-offers"
    description: "List take-out offers filtered by policy, member or status (reverse lookup for TakeoutOffer.policy_id and member_insurer_id)."
    roles: [PlanAdmin, Underwriter, MemberInsurerUser]
    code: 200
    input: ["policy_id?", "member_insurer_id?", "status?", "limit?", "offset?"]
    output: TakeoutOffer[]
    side_effects: []
  - method: POST
    path: "/fair-plan/takeout-offers/{id}/election"
    description: "Policyholder accepts (depopulates) or declines (retains) the take-out offer."
    roles: [Policyholder]
    code: 200
    input: [election]
    output: TakeoutOffer
    side_effects:
      - "ACCEPT: offer -> ACCEPTED with credit_units_granted 1; member takeout_credit_count +1; Policy -> TAKEN_OUT / ELECTED_TAKEOUT with pro-rata refund, zero fee and commission clawback; zone exposure released and status re-derived"
      - "DECLINE: offer -> DECLINED with credit_units_granted 0; Policy.depopulation_status -> ELECTED_RETAIN only"
  - method: POST
    path: "/fair-plan/takeout-offers/{id}/withdrawal"
    description: "Offering carrier withdraws an outstanding offer, freeing the policy for another offer."
    roles: [MemberInsurerUser]
    code: 200
    input: [reason]
    output: TakeoutOffer
    side_effects: ["OUTSTANDING -> WITHDRAWN", "Policy.depopulation_status -> NOT_OFFERED", "increments Policy.version by 1"]

  # --- assessments ---
  - method: POST
    path: "/fair-plan/assessment-events"
    description: "Open an assessment event for losses exceeding plan reserves."
    roles: [PlanAdmin]
    code: 201
    input: [cat_zone_id, trigger_loss_cents, reserve_balance_cents_at_trigger, allocation_basis]
    output: AssessmentEvent
    side_effects: ["writes assessable_amount_cents; status DRAFT; allocation_run_count 0"]
  - method: POST
    path: "/fair-plan/assessment-events/{id}/allocation-run"
    description: "Apportion the assessable amount across eligible members; a re-run supersedes the prior allocation set. Carries the event version last observed."
    roles: [PlanAdmin]
    code: 200
    input: [expected_assessment_event_version]
    output: AssessmentEvent
    side_effects:
      - "abates prior PENDING allocations on a re-run, then creates one AssessmentAllocation per eligible member"
      - "writes allocated_total_cents, remainder_cents, allocation_run_count"
      - "updates each member's cumulative_assessed_cents; increments MemberInsurer.version by 1 per touched member"
      - "increments AssessmentEvent.version by 1"
  - method: POST
    path: "/fair-plan/assessment-events/{id}/invoicing"
    description: "Invoice the allocated assessment, making allocations payable."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: AssessmentEvent
    side_effects: ["ALLOCATED -> INVOICED", "increments AssessmentEvent.version by 1"]
  - method: POST
    path: "/fair-plan/assessment-events/{id}/cancellation"
    description: "Cancel the assessment, abating every unpaid allocation and restoring member counters."
    roles: [PlanAdmin]
    code: 200
    input: [reason]
    output: AssessmentEvent
    side_effects:
      - "PENDING allocations -> ABATED; each member's cumulative_assessed_cents decreases by that allocation's net_due_cents"
      - "writes allocated_total_cents = 0 and cancellation_reason; increments AssessmentEvent.version by 1"
  - method: GET
    path: "/fair-plan/assessment-events/{id}"
    description: "Read one assessment event including assessable_amount_cents, allocated_total_cents and remainder_cents."
    roles: [PlanAdmin, Regulator, MemberInsurerUser]
    code: 200
    input: []
    output: AssessmentEvent
    side_effects: []
  - method: GET
    path: "/fair-plan/assessment-events/{id}/allocations"
    description: "Allocations of this event (reverse lookup for AssessmentAllocation.assessment_event_id)."
    roles: [PlanAdmin, Regulator, MemberInsurerUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AssessmentAllocation[]
    side_effects: []
  - method: POST
    path: "/fair-plan/assessment-allocations/{id}/payment"
    description: "Member carrier settles its allocation in full; the last payment settles the event and consumes depopulation credits."
    roles: [MemberInsurerUser]
    code: 200
    input: [amount_cents]
    output: AssessmentAllocation
    side_effects:
      - "PENDING -> PAID with paid_at"
      - "when no PENDING allocation remains: AssessmentEvent INVOICED -> SETTLED"
      - "on settlement each member's takeout_credit_count is reduced by its allocation.credits_consumed"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the eight declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not listed for the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity-backed role acts on a resource whose owning id differs from X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, out-of-range integer, malformed date, pagination outside 1..100, empty evidence_reference, or cancel_reason TAKEOUT_ELECTION supplied by a client"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path id or a body foreign key does not resolve to an existing row; the message names the resource type"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_zone_version or expected_assessment_event_version does not equal the parent's current version"
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "naic_code, license_number, zone code or applicant email already exists"
  - id: ERR_DUPLICATE_DECLINATION
    http: 409
    condition: "a DeclinationRecord already exists for this (application_id, member_insurer_id) pair"
  - id: ERR_APPLICATION_NOT_SUBMITTABLE
    http: 409
    condition: "submission attempted while application.status is not DRAFT or ELIGIBILITY_HELD"
  - id: ERR_APPLICATION_NOT_REVIEWABLE
    http: 409
    condition: "eligibility review attempted while application.status is not SUBMITTED or ELIGIBILITY_HELD"
  - id: ERR_INSPECTION_NOT_ORDERABLE
    http: 409
    condition: "inspection ordered while application.status is not INSPECTION_PENDING or IMPROVEMENTS_REQUIRED"
  - id: ERR_INSPECTION_ALREADY_COMPLETED
    http: 409
    condition: "completion attempted on an inspection whose result is not PENDING"
  - id: ERR_REQUIREMENT_STATE_INVALID
    http: 409
    condition: "evidence, clearance or waiver attempted from a status outside that transition's from-set"
  - id: ERR_FILING_NOT_REVIEWABLE
    http: 409
    condition: "review attempted on a filing whose status is not FILED"
  - id: ERR_APPLICATION_NOT_BINDABLE
    http: 409
    condition: "bind attempted while application.status is not APPROVED_TO_BIND"
  - id: ERR_POLICY_NOT_IN_FORCE
    http: 409
    condition: "cancellation, renewal or offer creation attempted on a policy outside the required coverage_status"
  - id: ERR_OFFER_ALREADY_OUTSTANDING
    http: 409
    condition: "take-out offer created while policy.depopulation_status is not NOT_OFFERED"
  - id: ERR_OFFER_NOT_OUTSTANDING
    http: 409
    condition: "election or withdrawal attempted on an offer whose status is not OUTSTANDING"
  - id: ERR_ASSESSMENT_STATE_INVALID
    http: 409
    condition: "allocation-run, invoicing or cancellation attempted from an assessment status outside that transition's from-set"
  - id: ERR_ALLOCATION_NOT_PAYABLE
    http: 409
    condition: "payment attempted on an allocation not in PENDING, or whose event is not INVOICED"
  - id: ERR_PRODUCER_STATUS_INVALID
    http: 409
    condition: "agreement execution or a status action attempted from an agreement_status outside that transition's from-set"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting X-User-ID is the same person who performed the incompatible prior step (filed the rate, raised the requirement, or advanced eligibility review)"
  - id: ERR_MAJOR_REQUIREMENT_NOT_WAIVABLE
    http: 422
    condition: "waiver attempted on a requirement whose severity is MAJOR"
  - id: ERR_ZONE_CLOSED
    http: 409
    condition: "bind or renewal attempted in a territory whose derived status is CLOSED (concentration_ratio >= 1.0000)"
  - id: ERR_ZONE_RESTRICTED_INELIGIBLE
    http: 409
    condition: "bind or renewal in a RESTRICTED territory where construction is not MASONRY or the rating condition score is below zone.restricted_min_condition_score"
  - id: ERR_PRODUCER_NOT_APPOINTED
    http: 409
    condition: "the application's producer is not in agreement_status APPOINTED"
  - id: ERR_MEMBER_NOT_ACTIVE
    http: 409
    condition: "a take-out offer is created by a member not ACTIVE, or an allocation payment is attempted by a WITHDRAWN member"
  - id: ERR_NO_APPROVED_RATE
    http: 409
    condition: "no APPROVED RateFiling covers (zone, peril_package) with effective_date on or before the reference date"
  - id: ERR_INSUFFICIENT_DECLINATIONS
    http: 422
    condition: "eligibility review ADVANCE while fewer than three verified declinations from distinct ACTIVE carriers fall inside the 60-day lookback window"
  - id: ERR_PERIL_NOT_OFFERED
    http: 422
    condition: "EXTENDED_WIND requested in a territory whose peril is not HURRICANE"
  - id: ERR_COVERAGE_LIMIT_EXCEEDED
    http: 422
    condition: "requested dwelling limit above 150000000 cents or above the property's replacement cost"
  - id: ERR_VACANT_PROPERTY_INELIGIBLE
    http: 422
    condition: "bind attempted on a VACANT property with no CLEARED VACANCY_CURE requirement on the inspection used"
  - id: ERR_INSPECTION_STALE
    http: 422
    condition: "the inspection used at bind was completed more than 90 days before the bind date"
  - id: ERR_BIND_DEADLINE_PASSED
    http: 422
    condition: "bind attempted after application.bind_deadline_at"
  - id: ERR_POLICY_TERM_OVERLAP
    http: 409
    condition: "the new half-open term intersects an existing BOUND or IN_FORCE term on the same property"
  - id: ERR_FILING_WINDOW_CONFLICT
    http: 409
    condition: "the filing being approved has an effective_date inside the 30-day quiet buffer after the latest APPROVED filing on the same territory and package"
  - id: ERR_ELECTION_WINDOW_CLOSED
    http: 422
    condition: "election attempted after offer.election_deadline_at"
  - id: ERR_RATE_BELOW_VOLUNTARY_FLOOR
    http: 422
    condition: "filed rate less than 1.10 times the surveyed voluntary-market average (differential_pct < 0.1000)"
  - id: ERR_OFFER_NOT_COMPARABLE
    http: 422
    condition: "comparable_coverage_flag false, or offered premium above 1.15 times the plan annual premium"
  - id: ERR_ZONE_EXPOSURE_CAP_EXCEEDED
    http: 422
    condition: "the bind or renewal would push the territory's aggregate insured value above its exposure cap"
  - id: ERR_LOSSES_WITHIN_RESERVES
    http: 422
    condition: "allocation run attempted when trigger loss does not exceed the reserve balance (assessable amount 0)"
  - id: ERR_NO_ASSESSABLE_MEMBERS
    http: 422
    condition: "allocation run attempted with an empty eligible member set or a total basis weight of 0"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "amount_cents does not exactly equal the allocation's net_due_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdmin
    description: "plan operations staff: membership, territories, producer agreements, assessments, batch sweeps and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /fair-plan/member-insurers"
      - "PATCH /fair-plan/member-insurers/{id}"
      - "POST /fair-plan/cat-zones"
      - "POST /fair-plan/producers"
      - "POST /fair-plan/producers/{id}/agreement-execution"
      - "POST /fair-plan/producers/{id}/status-actions"
      - "POST /fair-plan/assessment-events"
      - "POST /fair-plan/assessment-events/{id}/allocation-run"
      - "POST /fair-plan/assessment-events/{id}/invoicing"
      - "POST /fair-plan/assessment-events/{id}/cancellation"
      - "POST /fair-plan/sweeps/expiration"
      - "POST /fair-plan/_clock/set_current_utc"
    shared_operations:
      - "POST /fair-plan/policies/{id}/cancellation (with Underwriter)"
      - "all GET reads except GET /fair-plan/cat-zones/{id}/... shared with Regulator and Underwriter"
  - name: Producer
    description: "licensed agent who registers applicants and properties, files applications and declinations, and submits remediation evidence"
    identity: "entity_backed:Producer"
    exclusive_operations:
      - "POST /fair-plan/applicants"
      - "POST /fair-plan/properties"
      - "POST /fair-plan/applications"
      - "POST /fair-plan/applications/{id}/declinations"
      - "POST /fair-plan/applications/{id}/submission"
      - "POST /fair-plan/improvement-requirements/{id}/evidence"
    shared_operations:
      - "GET /fair-plan/applications/{id}, GET /fair-plan/properties/{id}, GET /fair-plan/inspections/{id} and their sub-resource reads"
      - "GET /fair-plan/producers/{id}"
      - "GET /fair-plan/policies/{id}"
  - name: Underwriter
    description: "plan underwriter who reviews eligibility, orders inspections, waives minor requirements and binds, renews or cancels policies"
    identity: opaque
    exclusive_operations:
      - "POST /fair-plan/applications/{id}/eligibility-review"
      - "POST /fair-plan/applications/{id}/inspections"
      - "POST /fair-plan/improvement-requirements/{id}/waiver"
      - "POST /fair-plan/policies"
      - "POST /fair-plan/policies/{id}/renewal"
    shared_operations:
      - "POST /fair-plan/policies/{id}/cancellation (with PlanAdmin)"
      - "GET reads on applications, properties, inspections, requirements, rate filings, policies, take-out offers, cat-zones"
  - name: Inspector
    description: "field inspector who completes inspections and clears remediated requirements"
    identity: opaque
    exclusive_operations:
      - "POST /fair-plan/inspections/{id}/completion"
      - "POST /fair-plan/improvement-requirements/{id}/clearance"
    shared_operations:
      - "GET /fair-plan/applications/{id}, GET /fair-plan/properties/{id}, GET /fair-plan/inspections/{id}, GET /fair-plan/inspections/{id}/requirements, GET /fair-plan/applications/{id}/inspections"
  - name: RateAnalyst
    description: "actuarial analyst who files plan rates and the surveyed voluntary-market averages"
    identity: opaque
    exclusive_operations:
      - "POST /fair-plan/rate-filings"
    shared_operations:
      - "GET /fair-plan/cat-zones/{id}, GET /fair-plan/cat-zones/{id}/rate-filings, GET /fair-plan/rate-filings/{id}"
  - name: Regulator
    description: "department of insurance reviewer who approves or disapproves filings and reads plan exposure and assessment records"
    identity: opaque
    exclusive_operations:
      - "POST /fair-plan/rate-filings/{id}/review"
    shared_operations:
      - "GET /fair-plan/member-insurers, GET /fair-plan/member-insurers/{id}, GET /fair-plan/member-insurers/{id}/declinations"
      - "GET /fair-plan/cat-zones/{id} and its sub-resource reads, GET /fair-plan/rate-filings/{id}"
      - "GET /fair-plan/assessment-events/{id}, GET /fair-plan/assessment-events/{id}/allocations"
  - name: MemberInsurerUser
    description: "operator acting for one member carrier: makes and withdraws take-out offers and settles assessment allocations"
    identity: "entity_backed:MemberInsurer"
    exclusive_operations:
      - "POST /fair-plan/policies/{id}/takeout-offers"
      - "POST /fair-plan/takeout-offers/{id}/withdrawal"
      - "POST /fair-plan/assessment-allocations/{id}/payment"
    shared_operations:
      - "GET /fair-plan/member-insurers/{id}, GET /fair-plan/member-insurers/{id}/declinations, GET /fair-plan/member-insurers/{id}/allocations"
      - "GET /fair-plan/policies, GET /fair-plan/policies/{id}, GET /fair-plan/takeout-offers, GET /fair-plan/takeout-offers/{id}"
      - "GET /fair-plan/assessment-events/{id}, GET /fair-plan/assessment-events/{id}/allocations"
  - name: Policyholder
    description: "named insured who elects whether to accept a take-out offer or retain plan coverage"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /fair-plan/takeout-offers/{id}/election"
    shared_operations:
      - "GET /fair-plan/policies/{id}, GET /fair-plan/takeout-offers/{id}"
