      - name: fee_band_ceiling_is_exclusive_so_one_extra_cent_of_gross_costs_less
        claim_type: threshold_boundary
        grounds:
          - calculations.fund_charge_composition
          - calculations.incentive_cap
          - global_constants.TIER_A_SCORE_FLOOR
        distinguishing_aspect: "FEE_BAND_1 is `gross < 100000.00`, so 99999.99 is charged 5% (fee 5000.00, total 104999.99) while 100000.00 drops to 4% (fee 4000.00, total 104000.00) - one extra cent of incentive makes the city's total outlay FALL by 999.99. Both decisions sit under the same 116000.00 cap, computed from a TIER_A planner sitting exactly on the 60-point floor with coverage 100.00."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; planner with legacy_definite_count 4 and legacy_definite_room_nights 6000, so relationship_score_lifetime == 4*12 + min(40, floor(6000/500)) == 60 and tier == TIER_A"
            - "fund FY2028 budget 500000.00; hotels Harborview 1200 and Bayside 1200"
            - "two QUALIFIED opportunities X and Y, each arrival 2028-04-10 departure 2028-04-22 (event_nights 12), peak_rooms_requested 1000, total_room_nights_requested 12000, rate_ceiling_amount 200.00, attendance_estimate 8000, exhibit_sqft_requested 200000; each fully covered by one hotel (1000 committed, coverage 100.00) so coverage_factor is 1.00"
            - "each opportunity has a DRAFT bid prepared by sales-11 and an incentive requested by sales-11: X requests 99999.99, Y requests 100000.00; both PROVISIONAL estimates yield lodging_spend 2400000.00 and lodging_tax_yield_amount 360000.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Tier A Federation", contact_email: "chair@tiera.org", legacy_definite_count: 4, legacy_definite_room_nights: 6000 }
              as: BureauAdmin
              captures: { planner_id: $.data.id, tier: $.data.tier, score: $.data.relationship_score_lifetime }
            - call: "POST /incentive-funds"
              payload: { fiscal_year: 2028, budget_amount: 500000.00 }
              as: BureauAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /bid-packages/${bid_x_id}/request-incentive"
              payload: { incentive_request_amount: 99999.99, service_commitment_codes: ["AIRPORT_SHUTTLE"] }
              as: SalesManager
              as_user_id: sales-11
              captures: { cap_x: $.data.incentive_cap_amount }
            - call: "POST /bid-packages/${bid_y_id}/request-incentive"
              payload: { incentive_request_amount: 100000.00, service_commitment_codes: ["AIRPORT_SHUTTLE"] }
              as: SalesManager
              as_user_id: sales-11
              captures: { cap_y: $.data.incentive_cap_amount }
          trigger:
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: IncentiveApprover
              captures: { fund_v_a: $.data.version }
            - call: "POST /bid-packages/${bid_x_id}/incentive-decisions"
              payload: { fund_id: "${fund_id}", decision: "APPROVED", approved_amount: 99999.99, rationale: "One cent below the fee band ceiling", expected_fund_version: "${fund_v_a}" }
              as: IncentiveApprover
              as_user_id: approver-01
              captures: { fee_x: $.data.admin_fee_amount, charge_x: $.data.total_charge_amount, payback_x: $.data.tax_payback_ratio }
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: IncentiveApprover
              captures: { fund_v_b: $.data.version, committed_mid: $.data.committed_amount }
            - call: "POST /bid-packages/${bid_y_id}/incentive-decisions"
              payload: { fund_id: "${fund_id}", decision: "APPROVED", approved_amount: 100000.00, rationale: "Exactly on the fee band ceiling", expected_fund_version: "${fund_v_b}" }
              as: IncentiveApprover
              as_user_id: approver-01
              captures: { fee_y: $.data.admin_fee_amount, charge_y: $.data.total_charge_amount, payback_y: $.data.tax_payback_ratio }
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: IncentiveApprover
              captures: { committed_end: $.data.committed_amount, uncommitted_end: $.data.uncommitted_amount, posture_end: $.data.posture }
          assert:
            - "${score} == 60 and ${tier} == TIER_A - the TIER_A floor is inclusive"
            - "${cap_x} == ${cap_y} == 116000.00 - band_cap 5000*12.00 + 7000*8.00 == 116000.00 is below yield_cap 360000.00 * 0.35 == 126000.00, and coverage_factor is 1.00"
            - "${fee_x} == 5000.00 (99999.99 * 0.05 == 4999.9995 rounded half up) and ${charge_x} == 104999.99"
            - "${fee_y} == 4000.00 and ${charge_y} == 104000.00 - a gross of exactly 100000.00 is NOT in band 1"
            - "${charge_y} < ${charge_x} - the fee ladder is deliberately non-monotonic at the boundary"
            - "${payback_x} == 3.43 (360000.00 / 104999.99) and ${payback_y} == 3.46 (360000.00 / 104000.00), both above the 3.00 floor"
            - "${committed_mid} == 104999.99, ${committed_end} == 208999.99, ${uncommitted_end} == 291000.01 and ${posture_end} == OPEN"

