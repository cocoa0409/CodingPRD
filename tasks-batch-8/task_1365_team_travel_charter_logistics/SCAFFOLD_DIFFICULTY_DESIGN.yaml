scaffold_difficulty_design:
  # =====================================================================
  # Rule 1: dual_variant_calc (>=2 instances, different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: trip_cost_provisional_vs_chronological_diverge
        grounds:
          - calculations.trip_estimated_cost
          - calculations.trip_actual_cost_chronological
          - entities.Trip.fields.estimated_cost_cents
          - entities.Trip.fields.actual_cost_cents
        distinguishing_aspect: |
          Same trip inputs yield different totals because the provisional variant
          (forward_looking, taken at trip lock) counts DRAFT PerDiemLedgers at
          projected base_amount_cents with zero meal deductions and counts OPEN
          ContingencyEvents at zero recovery_cost, whereas the chronological
          variant (at close) replays only ledger events that actually fired —
          a PerDiemLedger with meals_provided_count=2 contributes base minus
          5000 cents, and an unresolved ContingencyEvent contributes its final
          recovery_cost_cents.
        test_recipe:
          setup:
            - "Team T with season S (travel_budget_cents=100000000) OPEN"
            - "Trip TR in DRAFT, party contains member M1 (TIER_A)"
            - "PerDiemLedger L1 for M1 day_kind=GAME_DAY meals_provided_count=0"
            - "Trip locked: estimated_cost_cents includes L1 at base 15000"
            - "Clock advances; game day; L1 edited to meals_provided_count=2 (deduction 5000) -> net 10000"
            - "Trip reaches RECOVERING and is CLOSED"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "POR", display_name: "Portland", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "LAX", game_tipoff_utc: "2026-10-15T02:00:00Z", return_arrival_utc: "2026-10-16T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "P01", party_role: "PLAYER", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A" }
              as: TravelManager
              captures: { m1_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${m1_id}/per-diem"
              payload: { service_date: "2026-10-15", day_kind: "GAME_DAY", meals_provided_count: 0 }
              as: TravelFinanceLead
              captures: { l1_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks"
              payload: { hotel_code: "HLAX", room_count: 5, rate_cents_per_night: 30000, check_in_date: "2026-10-14", night_count: 2, cutoff_date: "2026-10-10" }
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 1, origin_code: "PDX", destination_code: "LAX", scheduled_depart_utc: "2026-10-14T18:00:00Z", scheduled_arrive_utc: "2026-10-14T21:00:00Z", is_charter: false }
              as: TravelCoordinator
              captures: { leg1_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg1_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/lock"
              payload: { expected_trip_version: "${trip_v0}" }
              as: TravelManager
              captures: { trip_at_lock: $.data.estimated_cost_cents }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${m1_id}/per-diem/${l1_id}/approve"
              payload: {}
              as: TravelFinanceLead
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${m1_id}/per-diem/${l1_id}/dispute"
              payload: {}
              as: TeamMember
              as_user_id: "${m1_id}"
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${m1_id}/per-diem/${l1_id}/resolve"
              payload: { meals_provided_count: 2 }
              as: TravelFinanceLead
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${m1_id}/per-diem/${l1_id}/pay"
              payload: {}
              as: TravelFinanceLead
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg1_id}/depart"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg1_id}/arrive"
              payload: {}
              as: TravelCoordinator
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/close"
              payload: {}
              as: TravelFinanceLead
              captures: { final_trip: $.data }
          assert:
            - "Trip.${trip_id}.posture == CLOSED"
            - "Trip.${trip_id}.estimated_cost_cents == 315000 (30000*2*5 hotel + 15000 per-diem provisional at zero meals)"
            - "Trip.${trip_id}.actual_cost_cents == 310000 (30000*2*5 hotel + 10000 per-diem actual with 5000 deduction)"
            - "actual_cost_cents != estimated_cost_cents (difference == 5000)"

      - name: per_diem_dispute_variant_floor_zero
        grounds:
          - calculations.per_diem_net
          - entities.PerDiemLedger.fields.net_amount_cents
          - state_machines.PerDiemLedger.DISPUTED_to_APPROVED
        distinguishing_aspect: |
          The per-diem net-amount calculation operates on the TravelPartyMember
          domain (not Trip) and applies a floor-at-zero rule — when
          meals_provided_count * MEAL_DEDUCTION_CENTS exceeds base_amount_cents,
          net_amount_cents is clamped to 0 (not negative), producing a
          different value than the raw subtraction.
        test_recipe:
          setup:
            - "Team T, season S, trip TR, member M2 TIER_C with day_kind=PARTIAL_DAY"
            - "TIER_C PARTIAL_DAY base = 3250; 3 provided meals = 7500 deduction"
            - "Raw subtraction would be -4250; floor clamps to 0"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "SEA", display_name: "Seattle", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "SFO", game_tipoff_utc: "2026-11-01T02:00:00Z", return_arrival_utc: "2026-11-02T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "S01", party_role: "STAFF", travel_class: "COMMERCIAL_COACH", per_diem_tier: "TIER_C" }
              as: TravelManager
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${m2_id}/per-diem"
              payload: { service_date: "2026-11-01", day_kind: "PARTIAL_DAY", meals_provided_count: 3 }
              as: TravelFinanceLead
              captures: { ledger: $.data }
          assert:
            - "PerDiemLedger.${ledger}.base_amount_cents == 3250"
            - "PerDiemLedger.${ledger}.deduction_cents == 7500"
            - "PerDiemLedger.${ledger}.net_amount_cents == 0 (floor applied, not -4250)"

  # =====================================================================
  # Rule 2: combinatorial_formula (>=2 instances, different modes a/b/c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: equipment_weight_tiered_straddle
        grounds:
          - calculations.equipment_weight_chargeback
          - entities.CharterContract.fields.cargo_capacity_lb
          - entities.EquipmentShipment.fields.chargeback_cents
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs (committed_lb, capacity_lb, declared_value_cents
          via shipment) and non-linear tier selection (85%/100% thresholds) producing
          different per-lb rates on different slices of the same shipment.
          A shipment that straddles the 85% tier boundary pays 0 on the first
          slice, 350/lb on the middle slice, 900/lb on the over-capacity slice.
        test_recipe:
          setup:
            - "Charter with cargo_capacity_lb = 10000"
            - "First shipment 8000 lb (under 85%, no chargeback)"
            - "Second shipment 2500 lb -> committed becomes 10500 lb, straddling both tiers"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "PHX", display_name: "Phoenix", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 1000000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "DEN", game_tipoff_utc: "2026-12-01T02:00:00Z", return_arrival_utc: "2026-12-02T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts"
              payload: { vendor_code: "V1", base_price_cents: 5000000, fuel_surcharge_cap_cents: 500000, seat_capacity: 30, cargo_capacity_lb: 10000, penalty_bands: [{days_before: 30, penalty_pct: 10}, {days_before: 7, penalty_pct: 50}] }
              as: TravelManager
              captures: { contract_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/submit"
              payload: {}
              as: TravelManager
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/countersign"
              payload: {}
              as: VendorRep
              captures: { contract_v_pre_exec: $.data.version }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/execute"
              payload: { expected_contract_version: "${contract_v_pre_exec}" }
              as: TravelFinanceLead
              captures: { contract_v: $.data.version }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 1, origin_code: "PHX", destination_code: "DEN", scheduled_depart_utc: "2026-11-30T18:00:00Z", scheduled_arrive_utc: "2026-11-30T20:00:00Z", is_charter: true, contract_id: "${contract_id}" }
              as: TravelCoordinator
              captures: { leg_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/equipment"
              payload: { shipment_kind: "TEAM_GEAR", gross_weight_lb: 8000, piece_count: 20, declared_value_cents: 100000, assigned_contract_id: "${contract_id}" }
              as: EquipmentManager
              captures: { ship1_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/equipment/${ship1_id}/load"
              payload: {}
              as: EquipmentManager
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/equipment"
              payload: { shipment_kind: "BROADCAST", gross_weight_lb: 2500, piece_count: 5, declared_value_cents: 200000, assigned_contract_id: "${contract_id}" }
              as: EquipmentManager
              captures: { ship2_id: $.data.id }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/equipment/${ship2_id}/load"
              payload: {}
              as: EquipmentManager
              captures: { ship2_after: $.data }
          assert:
            - "Shipment.${ship1_id}.chargeback_cents == 0 (under 85% tier)"
            - "Shipment.${ship2_id}.chargeback_cents == 975000 (committed=10500; tier2 slice = 10000-8500=1500lb*350=525000; tier3 slice = 10500-10000=500lb*900=450000; total=975000)"

      - name: rest_floor_compound_delay_circular
        grounds:
          - calculations.rest_floor
          - entities.FlightLeg.fields.delay_minutes
          - entities.FlightLeg.fields.scheduled_depart_utc
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — leg N+1's required departure floor
          depends on leg N's delay_minutes, but delay_minutes is only finalized when
          leg N ARRIVES. Booking leg N+1 BEFORE leg N departs must use the then-current
          scheduled delay; if leg N later departs late and accrues additional delay,
          leg N+1 must be revalidated and pushed into REBOOKING. The evaluation order
          (leg N settle-then-leg N+1 validate) is the pinned resolution.
        test_recipe:
          setup:
            - "Trip with 2 legs: L1 PDX->DEN (BOOKED), L2 DEN->PHX (initially PLANNED)"
            - "L1 initially scheduled_arrive = 20:00; L2 initially scheduled_depart = next day 08:00 (12h gap, satisfies STANDARD 600min rest)"
            - "L1.delay reports 90 minutes — new arrive 21:30, rest_required = 600 + 0 (delay <=60 threshold not crossed until full 60 beyond first hour; 90-60=30 -> integer division 30/60=0) => rest_required = 600, L2 still satisfies"
            - "L1.delay reports additional 120 minutes (total 210) — delay_minutes=210; rest_required = 600 + ((210-60)/60)*60 = 600 + 2*60 = 720; L2 depart now only 10.5h after arrive; 630min < 720 -> L2 must transition to REBOOKING"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "DAL", display_name: "Dallas", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "DEN", game_tipoff_utc: "2026-12-05T02:00:00Z", return_arrival_utc: "2026-12-07T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 1, origin_code: "DAL", destination_code: "DEN", scheduled_depart_utc: "2026-12-04T18:00:00Z", scheduled_arrive_utc: "2026-12-04T20:00:00Z", is_charter: false }
              as: TravelCoordinator
              captures: { leg1_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 2, origin_code: "DEN", destination_code: "PHX", scheduled_depart_utc: "2026-12-05T08:00:00Z", scheduled_arrive_utc: "2026-12-05T10:00:00Z", is_charter: false }
              as: TravelCoordinator
              captures: { leg2_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg1_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg2_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg1_id}/delay"
              payload: { delay_minutes: 90 }
              as: TravelCoordinator
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg1_id}/delay"
              payload: { delay_minutes: 210 }
              as: TravelCoordinator
          assert:
            - "FlightLeg.${leg1_id}.delay_minutes == 210"
            - "FlightLeg.${leg1_id}.scheduled_arrive_utc == '2026-12-04T23:30:00Z'"
            - "FlightLeg.${leg2_id}.status == REBOOKING (rest_required 720 > available 630)"

  # =====================================================================
  # Rule 3: non_linear_state_machine (>=2 instances, different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: flight_leg_cyclic_rebooking_loop
        grounds:
          - state_machines.FlightLeg
          - entities.FlightLeg.fields.rebook_generation
        distinguishing_aspect: |
          FlightLeg exhibits a CYCLE: BOOKED -> DELAYED -> BOOKED (via rebook)
          and BOOKED -> REBOOKING -> BOOKED (cascade from upstream delay).
          Each loop increments rebook_generation; the cycle can repeat
          arbitrarily many times before reaching ARRIVED.
        test_recipe:
          setup:
            - "Trip with single leg, BOOKED"
            - "Apply delay -> rebook -> delay -> rebook: rebook_generation must reach 2"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "CHI", display_name: "Chicago", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "NYC", game_tipoff_utc: "2026-12-10T00:00:00Z", return_arrival_utc: "2026-12-11T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 1, origin_code: "ORD", destination_code: "JFK", scheduled_depart_utc: "2026-12-09T14:00:00Z", scheduled_arrive_utc: "2026-12-09T17:00:00Z", is_charter: false }
              as: TravelCoordinator
              captures: { leg_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/delay"
              payload: { delay_minutes: 60 }
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/rebook"
              payload: { scheduled_depart_utc: "2026-12-09T16:00:00Z", scheduled_arrive_utc: "2026-12-09T19:00:00Z" }
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/delay"
              payload: { delay_minutes: 45 }
              as: TravelCoordinator
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/rebook"
              payload: { scheduled_depart_utc: "2026-12-09T18:00:00Z", scheduled_arrive_utc: "2026-12-09T21:00:00Z" }
              as: TravelCoordinator
              captures: { leg_after: $.data }
          assert:
            - "FlightLeg.${leg_id}.status == BOOKED"
            - "FlightLeg.${leg_id}.rebook_generation == 2"
            - "FlightLeg.${leg_id}.scheduled_depart_utc == '2026-12-09T18:00:00Z'"

      - name: per_diem_ledger_dispute_loop
        grounds:
          - state_machines.PerDiemLedger
        distinguishing_aspect: |
          PerDiemLedger (different entity than FlightLeg) exhibits its own
          non-linear shape: DRAFT -> APPROVED -> DISPUTED -> APPROVED -> PAID,
          a revert-loop that lets the member dispute, finance resolve, member
          dispute again — each pass recomputes net_amount_cents from the
          latest meals_provided_count.
        test_recipe:
          setup:
            - "Ledger L for TIER_B GAME_DAY; initial meals=0 -> net=11000; approve"
            - "Dispute -> resolve with meals=1 -> net=8500"
            - "Dispute again -> resolve with meals=2 -> net=6000"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "BOS", display_name: "Boston", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "MIA", game_tipoff_utc: "2026-12-15T00:00:00Z", return_arrival_utc: "2026-12-16T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "B01", party_role: "COACH", travel_class: "CHARTER_STANDARD", per_diem_tier: "TIER_B" }
              as: TravelManager
              captures: { m_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 1, origin_code: "BOS", destination_code: "MIA", scheduled_depart_utc: "2026-12-14T14:00:00Z", scheduled_arrive_utc: "2026-12-14T17:00:00Z", is_charter: false }
              as: TravelCoordinator
              captures: { leg_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "GET /travel/teams/${team_id}/trips/${trip_id}"
              payload: {}
              as: Any
              captures: { trip_v_pre_lock: $.data.version }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/lock"
              payload: { expected_trip_version: "${trip_v_pre_lock}" }
              as: TravelManager
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${m_id}/per-diem"
              payload: { service_date: "2026-12-15", day_kind: "GAME_DAY", meals_provided_count: 0 }
              as: TravelFinanceLead
              captures: { ledger_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${m_id}/per-diem/${ledger_id}/approve"
              payload: {}
              as: TravelFinanceLead
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${m_id}/per-diem/${ledger_id}/dispute"
              payload: {}
              as: TeamMember
              as_user_id: "${m_id}"
