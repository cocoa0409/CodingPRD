scenario: "1075. Telecom & SaaS Expense Management (TEM): inventory & contract/invoice, usage & optimization/rightsizing, dispute & credit recovery, allocation/chargeback & GL, renewal & sourcing, audit & savings, license & shadow-IT, reporting"
domain_name: "telecom-saas-expense-mgmt"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: hybrid
  # Roots (Vendor, CostCenter) plus a Vendor->Contract->Service ownership chain,
  # cross-cutting flat FK references (InvoiceLineItem->Service, Allocation->CostCenter,
  # Credit->Dispute) and reporting rollups.

  state_machine_shape: cyclic
  # Dispute is cyclic (VENDOR_RESPONDED <-> RESUBMITTED negotiation rounds);
  # Invoice is branching-with-revert (UNDER_REVIEW <-> DISPUTED, plus fork to APPROVED);
  # Recommendation is branching (PROPOSED -> {IMPLEMENTED, REJECTED, SUPERSEDED}).

  relationship_patterns:
    - one_to_many        # Contract -> Services, Invoice -> LineItems
    - cross_aggregate    # InvoiceLineItem -> Service, Allocation -> CostCenter, Credit -> Dispute

  role_model: segregation_of_duties
  # FinanceApprover who approves an invoice may not also pay it (SoD on X-User-ID);
  # CostCenterOwner (entity_backed) approves only chargebacks to its own cost center;
  # Vendor (entity_backed) responds to disputes; Analyst / Sourcing / SystemAdmin operational.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Vendor legal/display name."
      - name: vendor_type
        type: enum
        source: input
        description: "Category of provider."
        constraints: "one of {TELECOM, SAAS}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; starts ACTIVE, SUSPENDED via suspend action."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the provider this contract is with."
      - name: term_start
        type: datetime
        source: input
        description: "Inclusive contract term start (ISO 8601 UTC)."
      - name: term_end
        type: datetime
        source: input
        description: "Inclusive contract term end (ISO 8601 UTC). Closed interval for overlap checks."
      - name: renewal_notice_days
        type: integer
        source: input
        description: "Days before term_end that the renewal window opens."
      - name: renewal_term_months
        type: integer
        source: input
        description: "Months the term_end is extended on each renew."
        default: 12
      - name: auto_renew
        type: boolean
        source: input
        description: "Advisory flag; does not bypass the renewal-window check."
        default: false
      - name: volume_tier_enabled
        type: boolean
        source: input
        description: "When true, invoice expected-amount applies the volume tier discount ladder."
        default: true
      - name: status
        type: enum
        source: system
        description: "Lifecycle: DRAFT -> ACTIVE (activate/renew) -> TERMINATED."
        default: "DRAFT"
        constraints: "one of {DRAFT, ACTIVE, TERMINATED}"
      - name: monthly_committed_cost_cents
        type: integer
        source: computed
        description: "Sum over services with status IN {ACTIVE, RIGHTSIZED} of unit_rate_cents * contracted_quantity. Recomputed on service quantity/status change."
        default: 0
      - name: total_recovered_cents
        type: integer
        source: computed
        description: "Running ledger: sum of amount_cents of all Credits whose line item belongs to an invoice on this contract."
        default: 0
      - name: renewal_count
        type: integer
        source: system
        description: "Number of successful renewals."
        default: 0

  - name: Service
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract that governs this service."
      - name: service_type
        type: enum
        source: input
        description: "Kind of expense item."
        constraints: "one of {TELECOM_LINE, SAAS_SUBSCRIPTION}"
      - name: license_type
        type: enum
        source: input
        description: "Billing model of the service."
        constraints: "one of {PER_SEAT, FLAT, USAGE_BASED}"
      - name: unit_rate_cents
        type: integer
        source: input
        description: "Contracted monthly rate per unit/seat, in cents."
      - name: contracted_quantity
        type: integer
        source: input
        description: "Contracted number of units/seats."
      - name: active_quantity
        type: integer
        source: input
        description: "Currently active/assigned units; numerator of utilization."
        default: 0
      - name: discovery_source
        type: enum
        source: input
        description: "How the service entered inventory; SHADOW_IT flags unsanctioned SaaS."
        default: "SANCTIONED"
        constraints: "one of {SANCTIONED, SHADOW_IT}"
      - name: sanctioned
        type: boolean
        source: input
        description: "Whether the service is IT-approved."
        default: true
      - name: utilization_pct
        type: number
        source: computed
        description: "round_half_up(active_quantity / contracted_quantity * 100, 2); 0 when contracted_quantity == 0."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lifecycle: ACTIVE -> RIGHTSIZED (downgrade implemented) or RETIRED (terminate implemented / contract terminated)."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, RIGHTSIZED, RETIRED}"

  - name: Invoice
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract billed by this invoice."
      - name: period_start
        type: datetime
        source: input
        description: "Invoice billing period start (ISO 8601 UTC)."
      - name: period_end
        type: datetime
        source: input
        description: "Invoice billing period end (ISO 8601 UTC)."
      - name: status
        type: enum
        source: system
        description: "RECEIVED -> UNDER_REVIEW -> (DISPUTED <-> UNDER_REVIEW) -> APPROVED -> PAID."
        default: "RECEIVED"
        constraints: "one of {RECEIVED, UNDER_REVIEW, DISPUTED, APPROVED, PAID}"
      - name: billed_amount_cents
        type: integer
        source: computed
        description: "Sum of billed_amount_cents across this invoice's line items."
        default: 0
      - name: expected_amount_cents
        type: integer
        source: computed
        description: "Sum of the FINAL expected_amount_cents across line items; set on review."
        default: 0
      - name: variance_cents
        type: integer
        source: computed
        description: "billed_amount_cents - expected_amount_cents; set on review."
        default: 0
      - name: net_amount_cents
        type: integer
        source: computed
        description: "billed_amount_cents minus total credited across line items."
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "net_amount_cents while unpaid; 0 after PAID."
        default: 0
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceApprover who approved; used for SoD on pay."
        default: null

  - name: InvoiceLineItem
    parent: Invoice
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; the parent invoice."
      - name: service_id
        type: string
        source: input
        description: "FK -> Service.id; the service billed on this line."
      - name: billing_period_start
        type: datetime
        source: input
        description: "Line billing period start (ISO 8601 UTC). Half-open interval [start, end)."
      - name: billing_period_end
        type: datetime
        source: input
        description: "Line billing period end (ISO 8601 UTC), exclusive."
      - name: billed_quantity
        type: integer
        source: input
        description: "Units billed on this line."
      - name: billed_amount_cents
        type: integer
        source: input
        description: "Amount billed on this line, in cents."
      - name: expected_amount_cents
        type: integer
        source: computed
        description: "Provisional at create (contracted_quantity, proration 1.0); FINAL at invoice review (billed_quantity, actual proration). See calc invoice_line_expected_amount."
        default: 0
      - name: variance_cents
        type: integer
        source: computed
        description: "billed_amount_cents - expected_amount_cents (final)."
        default: 0
      - name: credited_amount_cents
        type: integer
        source: computed
        description: "Sum of Credit.amount_cents issued against this line."
        default: 0
      - name: net_amount_cents
        type: integer
        source: computed
        description: "billed_amount_cents - credited_amount_cents. Conserved target of chargeback allocation."
        default: 0
      - name: status
        type: enum
        source: system
        description: "BILLED -> DISPUTED (dispute opened) -> CREDITED (dispute accepted) or back to BILLED (dispute withdrawn)."
        default: "BILLED"
        constraints: "one of {BILLED, DISPUTED, CREDITED}"

  - name: Dispute
    parent: InvoiceLineItem
    common_fields: true
    fields:
      - name: invoice_line_item_id
        type: string
        source: input
        description: "FK -> InvoiceLineItem.id; the disputed line."
      - name: disputed_amount_cents
        type: integer
        source: input
        description: "Portion of the line's billed amount being contested."
      - name: claimed_credit_cents
        type: integer
        source: input
        description: "Credit amount the analyst is claiming; may be revised on resubmit."
      - name: offered_credit_cents
        type: integer
        source: system
        description: "Latest credit amount the vendor offered in its response."
        default: 0
      - name: recovered_credit_cents
        type: integer
        source: computed
        description: "Final accepted credit; equals offered_credit_cents at acceptance, else 0."
        default: 0
      - name: response_type
        type: enum
        source: system
        description: "Latest vendor response classification."
        default: "NONE"
        constraints: "one of {NONE, FULL_ACCEPT, PARTIAL, REJECT}"
      - name: round_count
        type: integer
        source: system
        description: "Number of resubmission rounds; capped at MAX_DISPUTE_ROUNDS."
        default: 0
      - name: reason
        type: string
        source: input
        description: "Free-text dispute reason (optional)."
        default: null
      - name: status
        type: enum
        source: system
        description: "SUBMITTED -> VENDOR_RESPONDED -> (RESUBMITTED -> VENDOR_RESPONDED)* -> ACCEPTED; or -> WITHDRAWN."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, VENDOR_RESPONDED, RESUBMITTED, ACCEPTED, WITHDRAWN}"

  - name: Credit
    parent: null
    common_fields: false
    fields:
      - name: dispute_id
        type: string
        source: system
        description: "FK -> Dispute.id; the accepted dispute that produced this credit."
      - name: invoice_line_item_id
        type: string
        source: system
        description: "FK -> InvoiceLineItem.id; the line the credit applies to."
      - name: amount_cents
        type: integer
        source: system
        description: "Credit amount in cents; equals the accepted dispute's offered_credit_cents."
      - name: status
        type: enum
        source: system
        description: "Append-only ledger entry; always ISSUED."
        default: "ISSUED"
        constraints: "one of {ISSUED}"

  - name: CostCenter
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Cost center code, unique among cost centers."
      - name: gl_account
        type: string
        source: input
        description: "General-ledger account the chargeback posts to."
      - name: owner_user_id
        type: string
        source: input
        description: "X-User-ID of the CostCenterOwner who may approve chargebacks here."
      - name: status
        type: enum
        source: system
        description: "ACTIVE -> FROZEN (freeze); FROZEN blocks allocation approval."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, FROZEN}"

  - name: Allocation
    parent: InvoiceLineItem
    common_fields: true
    fields:
      - name: invoice_line_item_id
        type: string
        source: input
        description: "FK -> InvoiceLineItem.id; the line whose cost is charged back."
      - name: cost_center_id
        type: string
        source: input
        description: "FK -> CostCenter.id; the cost center receiving this share."
      - name: weight_pct
        type: number
        source: input
        description: "Percent share of the line's net_amount for this cost center (0-100, two decimals)."
      - name: amount_cents
        type: integer
        source: computed
        description: "Chargeback share in cents; see calc chargeback_allocation. Sum across a line's allocations == line net_amount_cents."
        default: 0
      - name: status
        type: enum
        source: system
        description: "DRAFT (created) -> POSTED (approved) -> REVERSED (line credited)."
        default: "DRAFT"
        constraints: "one of {DRAFT, POSTED, REVERSED}"

  - name: Recommendation
    parent: Service
    common_fields: true
    fields:
      - name: service_id
        type: string
        source: input
        description: "FK -> Service.id; the service to optimize."
      - name: rec_type
        type: enum
        source: input
        description: "Optimization action proposed."
        constraints: "one of {DOWNGRADE_SEATS, TERMINATE, SANCTION}"
      - name: target_quantity
        type: integer
        source: input
        description: "Proposed new contracted_quantity (0 for TERMINATE; unchanged for SANCTION)."
      - name: projected_savings_cents
        type: integer
        source: computed
        description: "Forward-looking annualized savings at proposal; see calc rightsizing_savings (projected variant)."
        default: 0
      - name: realized_savings_cents
        type: integer
        source: computed
        description: "Chronological savings from implementation date to term_end; see calc rightsizing_savings (realized variant)."
        default: 0
      - name: status
        type: enum
        source: system
        description: "PROPOSED -> {IMPLEMENTED, REJECTED}; PROPOSED -> SUPERSEDED when a newer recommendation supersedes it."
        default: "PROPOSED"
        constraints: "one of {PROPOSED, IMPLEMENTED, REJECTED, SUPERSEDED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Vendor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vendors/{id}/suspend"
        actor: Sourcing
        preconditions: ["vendor.status == ACTIVE"]
        side_effects: ["set status=SUSPENDED", "increments Vendor.version by 1"]
        note: "Suspended vendors cannot have contracts activated or renewed."

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: Sourcing
        preconditions:
          - "contract.status == DRAFT"
          - "vendor.status == ACTIVE (cross-entity: Contract -> Vendor)"
          - "no other ACTIVE contract of the same vendor has a term [term_start, term_end] that intersects this one (closed-interval overlap; adjacency counts as overlap)"
        side_effects: ["set status=ACTIVE", "increments Contract.version by 1"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /contracts/{id}/renew"
        actor: Sourcing
        preconditions:
          - "contract.status == ACTIVE"
          - "vendor.status == ACTIVE (business_referential, priority 6)"
          - "current_utc within the renewal window: (term_end - renewal_notice_days) <= current_utc <= term_end (business_temporal, priority 7)"
        side_effects:
          - "set term_end = term_end + renewal_term_months months"
          - "increment renewal_count by 1"
          - "increments Contract.version by 1"
        note: "Self-loop; contract remains ACTIVE with an extended term."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: Sourcing
        preconditions: ["contract.status == ACTIVE"]
        side_effects:
          - "set status=TERMINATED"
          - "cascade: every Service under this contract with status != RETIRED -> RETIRED"
          - "recompute monthly_committed_cost_cents (excludes RETIRED)"
          - "increments Contract.version by 1"

  - entity: Service
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RIGHTSIZED
        trigger: "system: Recommendation(rec_type=DOWNGRADE_SEATS) implemented"
        actor: system
        preconditions: ["recommendation.rec_type == DOWNGRADE_SEATS"]
        side_effects:
          - "set contracted_quantity = recommendation.target_quantity"
          - "recompute utilization_pct"
          - "increments Service.version by 1"
          - "cascade up: parent Contract.monthly_committed_cost_cents recomputed"
      - from: ACTIVE
        to: RETIRED
        trigger: "system: Recommendation(rec_type=TERMINATE) implemented OR parent Contract terminated"
        actor: system
        preconditions: []
        side_effects:
          - "set contracted_quantity = 0 when via TERMINATE recommendation"
          - "increments Service.version by 1"
          - "cascade up: parent Contract.monthly_committed_cost_cents recomputed"

  - entity: Invoice
    initial_state: RECEIVED
    terminal_states: [PAID]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /invoices/{id}/review"
        actor: Analyst
        preconditions:
          - "invoice.status == RECEIVED"
          - "parent Contract.status == ACTIVE (cross-entity: Invoice -> Contract, business_referential)"
        side_effects:
          - "for each line item recompute FINAL expected_amount_cents and variance_cents"
          - "recompute invoice billed_amount_cents, expected_amount_cents, variance_cents, net_amount_cents, balance_due_cents"
          - "increments Invoice.version by 1"
      - from: UNDER_REVIEW
        to: DISPUTED
        trigger: "system: a Dispute is opened on one of this invoice's line items"
        actor: system
        preconditions: ["invoice.status == UNDER_REVIEW"]
        side_effects: ["set status=DISPUTED", "increments Invoice.version by 1"]
      - from: DISPUTED
        to: UNDER_REVIEW
        trigger: "system: last open Dispute on this invoice reaches ACCEPTED or WITHDRAWN"
        actor: system
        preconditions: ["invoice.status == DISPUTED", "no Dispute on this invoice in status IN {SUBMITTED, VENDOR_RESPONDED, RESUBMITTED}"]
        side_effects: ["set status=UNDER_REVIEW", "recompute net_amount_cents, balance_due_cents", "increments Invoice.version by 1"]
        note: "Revert edge back into review once disputes are resolved."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /invoices/{id}/approve"
        actor: FinanceApprover
        preconditions:
          - "invoice.status == UNDER_REVIEW"
          - "parent Contract.status == ACTIVE (cross-entity: Invoice -> Contract)"
        side_effects: ["set status=APPROVED", "set approved_by_user_id = X-User-ID", "increments Invoice.version by 1"]
      - from: APPROVED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: FinanceApprover
        preconditions:
          - "invoice.status == APPROVED"
          - "X-User-ID != invoice.approved_by_user_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["set status=PAID", "set balance_due_cents = 0", "increments Invoice.version by 1"]

  - entity: InvoiceLineItem
    initial_state: BILLED
    terminal_states: []
    transitions:
      - from: BILLED
        to: DISPUTED
        trigger: "POST /invoice-line-items/{id}/disputes"
        actor: Analyst
        preconditions: ["line.status == BILLED", "parent Invoice.status IN {UNDER_REVIEW, DISPUTED} (cross-entity: Dispute -> Invoice)"]
        side_effects: ["set status=DISPUTED", "bubble up: parent Invoice UNDER_REVIEW -> DISPUTED"]
      - from: DISPUTED
        to: CREDITED
        trigger: "system: Dispute on this line ACCEPTED"
        actor: system
        preconditions: ["line.status == DISPUTED"]
        side_effects:
          - "set credited_amount_cents += Credit.amount_cents"
          - "recompute net_amount_cents = billed_amount_cents - credited_amount_cents"
          - "cascade: POSTED/DRAFT Allocations on this line -> REVERSED"
      - from: DISPUTED
        to: BILLED
        trigger: "system: Dispute on this line WITHDRAWN"
        actor: system
        preconditions: ["line.status == DISPUTED"]
        side_effects: ["set status=BILLED", "no change to credited_amount_cents or net_amount_cents"]

  - entity: Dispute
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: VENDOR_RESPONDED
        trigger: "POST /disputes/{id}/respond"
        actor: Vendor
        preconditions: ["dispute.status == SUBMITTED", "offered_credit_cents <= claimed_credit_cents (ERR_OFFER_EXCEEDS_CLAIM)"]
        side_effects: ["set response_type, offered_credit_cents from body", "set status=VENDOR_RESPONDED"]
      - from: RESUBMITTED
        to: VENDOR_RESPONDED
        trigger: "POST /disputes/{id}/respond"
        actor: Vendor
        preconditions: ["dispute.status == RESUBMITTED", "offered_credit_cents <= claimed_credit_cents (ERR_OFFER_EXCEEDS_CLAIM)"]
        side_effects: ["set response_type, offered_credit_cents from body", "set status=VENDOR_RESPONDED"]
      - from: VENDOR_RESPONDED
        to: RESUBMITTED
        trigger: "POST /disputes/{id}/resubmit"
        actor: Analyst
        preconditions:
          - "dispute.status == VENDOR_RESPONDED"
          - "round_count < MAX_DISPUTE_ROUNDS (=2) (ERR_MAX_ROUNDS_EXCEEDED)"
          - "claimed_credit_cents <= line.billed_amount_cents (ERR_CREDIT_EXCEEDS_BILLED)"
        side_effects: ["set claimed_credit_cents from body", "increment round_count by 1", "set status=RESUBMITTED"]
        note: "Back-edge that creates the negotiation cycle VENDOR_RESPONDED -> RESUBMITTED -> VENDOR_RESPONDED."
      - from: VENDOR_RESPONDED
        to: ACCEPTED
        trigger: "POST /disputes/{id}/accept"
        actor: Analyst
        preconditions: ["dispute.status == VENDOR_RESPONDED"]
        side_effects:
          - "set recovered_credit_cents = offered_credit_cents"
          - "create Credit(status=ISSUED, amount_cents=offered_credit_cents) [hop B]"
          - "line item DISPUTED -> CREDITED: credited_amount_cents += amount, net_amount_cents recomputed [hop C]"
          - "parent Contract.total_recovered_cents += amount; invoice net_amount_cents/balance_due_cents recomputed [hop C]"
          - "POSTED/DRAFT Allocations on the line -> REVERSED [hop D]"
          - "if no more open disputes on the invoice, Invoice DISPUTED -> UNDER_REVIEW [hop D]"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Analyst
        preconditions: ["dispute.status == SUBMITTED"]
        side_effects:
          - "line item DISPUTED -> BILLED"
          - "if no more open disputes on the invoice, Invoice DISPUTED -> UNDER_REVIEW"
          - "no Credit created; Contract.total_recovered_cents unchanged (compensation conserves recovered ledger)"
      - from: VENDOR_RESPONDED
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Analyst
        preconditions: ["dispute.status == VENDOR_RESPONDED"]
        side_effects:
          - "line item DISPUTED -> BILLED"
          - "if no more open disputes on the invoice, Invoice DISPUTED -> UNDER_REVIEW"
          - "no Credit created; Contract.total_recovered_cents unchanged (compensation conserves recovered ledger)"
      - from: RESUBMITTED
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Analyst
        preconditions: ["dispute.status == RESUBMITTED"]
        side_effects:
          - "line item DISPUTED -> BILLED"
          - "if no more open disputes on the invoice, Invoice DISPUTED -> UNDER_REVIEW"
          - "no Credit created; Contract.total_recovered_cents unchanged (compensation conserves recovered ledger)"

  - entity: CostCenter
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /cost-centers/{id}/freeze"
        actor: SystemAdmin
        preconditions: ["cost_center.status == ACTIVE"]
        side_effects: ["set status=FROZEN", "increments CostCenter.version by 1"]
        note: "FROZEN cost centers reject allocation approval."

  - entity: Allocation
    initial_state: DRAFT
    terminal_states: [REVERSED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /allocations/{id}/approve"
        actor: CostCenterOwner
        preconditions:
          - "allocation.status == DRAFT"
          - "X-User-ID == cost_center.owner_user_id (ERR_NOT_COST_CENTER_OWNER)"
          - "cost_center.status == ACTIVE (cross-entity: Allocation -> CostCenter, ERR_COST_CENTER_FROZEN)"
        side_effects: ["set status=POSTED", "increments Allocation.version by 1"]
      - from: DRAFT
        to: REVERSED
        trigger: "system: line item credited (dispute accepted)"
        actor: system
        preconditions: ["allocation.status == DRAFT"]
        side_effects: ["set status=REVERSED"]
      - from: POSTED
        to: REVERSED
        trigger: "system: line item credited (dispute accepted)"
        actor: system
        preconditions: ["allocation.status == POSTED"]
        side_effects: ["set status=REVERSED", "compensation: chargeback for the line must be re-created against the new net_amount_cents"]

  - entity: Recommendation
    initial_state: PROPOSED
    terminal_states: [IMPLEMENTED, REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: IMPLEMENTED
        trigger: "POST /recommendations/{id}/implement"
        actor: FinanceApprover
        preconditions: ["recommendation.status == PROPOSED", "service.status == ACTIVE"]
        side_effects:
          - "compute realized_savings_cents (chronological variant) [hop A]"
          - "Service: contracted_quantity=target_quantity (or 0 for TERMINATE), status RIGHTSIZED/RETIRED, version++ [hop B]"
          - "parent Contract.monthly_committed_cost_cents recomputed [hop C]"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /recommendations/{id}/reject"
        actor: FinanceApprover
        preconditions: ["recommendation.status == PROPOSED"]
        side_effects: ["set status=REJECTED"]
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system: a newer Recommendation is created for the same service"
        actor: system
        preconditions: ["recommendation.status == PROPOSED"]
        side_effects: ["set status=SUPERSEDED"]
        note: "Triggered by the CREATE-with-supersede path guarded by OCC on Service.version."

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: recommendation-create-stale-service
    parent_entity: Service
    write_endpoint: "POST /services/{id}/recommendations"
    occ_field: "expected_service_version"
    description: |
      Creating a Recommendation against a Service whose version has advanced
      since the client last observed it is rejected. A newly created PROPOSED
      recommendation legitimately supersedes any prior PROPOSED recommendation
      for that service (setting it to SUPERSEDED and bumping Service.version);
      a second create still carrying the pre-supersede version is therefore
      operating on a stale view and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: invoice_line_expected_amount
    trigger: "Provisional at POST /invoices/{id}/line-items; FINAL recomputed at POST /invoices/{id}/review"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (a): >=3 inputs with tier selection, proration, and a
      # conditional platform fee branch.
      qty        = (variant == PROVISIONAL) ? service.contracted_quantity : line.billed_quantity
      billed_days= (variant == PROVISIONAL) ? 30 : days_between(line.billing_period_start, line.billing_period_end)   # half-open
      proration  = (variant == PROVISIONAL) ? 1.0 : (billed_days / 30.0)
      # Tier discount ladder (only when contract.volume_tier_enabled):
      #   qty >= 100 -> 0.15 ; qty >= 50 -> 0.10 ; qty >= 10 -> 0.05 ; else 0.00
      tier_discount = contract.volume_tier_enabled ? ladder(qty) : 0.00
      base       = service.unit_rate_cents * qty
      platform_fee = (service.service_type == SAAS_SUBSCRIPTION) ? SAAS_PLATFORM_FEE_CENTS : 0
      expected   = round_half_up( base * (1 - tier_discount) * proration ) + platform_fee
    input_set: "Single line item; PROVISIONAL uses service.contracted_quantity + full-period proration, FINAL uses the line's billed_quantity + actual half-open day count."
    constants:
      SAAS_PLATFORM_FEE_CENTS: 5000
      TIER_LADDER: "{100: 0.15, 50: 0.10, 10: 0.05, 0: 0.00}"
      CYCLE_DAYS: 30
    precision: "integer cents; round_half_up applied once to the discounted*prorated base before adding the (integer) platform fee"
    variants:
      - name: PROVISIONAL
        when: "line item creation, before usage is reconciled"
        difference: "uses service.contracted_quantity and proration 1.0"
      - name: FINAL
        when: "invoice review"
        difference: "uses line.billed_quantity and actual proration billed_days/30; tier is re-selected on billed_quantity so it can diverge from the provisional value"

  - name: chargeback_allocation
    trigger: "POST /invoice-line-items/{id}/allocations (bulk create over the weight set)"
    algorithm: waterfall_allocation
    formula: |
      # Combinatorial mode (b): nested rounding where order is pinned.
      # net = line.net_amount_cents at allocation time.
      # For each allocation i (given weight_pct_i, sum of weights == 100.00):
      #   raw_i     = net * weight_pct_i / 100
      #   rounded_i = round_half_up(raw_i)            # round EACH share first
      # remainder  = net - sum(rounded_i)             # signed; may be + or -
      # Assign the entire signed remainder to the single top-weight allocation
      # (highest weight_pct; tie-break: cost_center.created_at ASC):
      #   amount_top = rounded_top + remainder
      #   amount_i   = rounded_i (for i != top)
      # Pinned order: round-per-share THEN reconcile remainder to top-weight.
      # "sum-then-round" is explicitly NOT used.
    input_set: "All allocations created for one line item in a single request; their weight_pct values must sum to exactly 100.00."
    constants:
      WEIGHT_SUM_REQUIRED: 100.00
    precision: "integer cents; round_half_up per share; signed remainder to top-weight so sum(amount_cents) == net_amount_cents exactly"

  - name: rightsizing_savings
    trigger: "projected_savings at POST /services/{id}/recommendations; realized_savings at POST /recommendations/{id}/implement"
    algorithm: forward_looking
    formula: |
      seats_cut = service.contracted_quantity - recommendation.target_quantity   # >= 0
      # PROJECTED (forward-looking, at proposal): annualize over 12 months.
      projected = seats_cut * service.unit_rate_cents * 12
      # REALIZED (chronological, at implementation): only the months remaining
      # from the implementation date to the contract term_end are realized.
      months_remaining = (contract.term_end.year - now.year) * 12
                         + (contract.term_end.month - now.month) + 1     # inclusive of both endpoint months
      realized = seats_cut * service.unit_rate_cents * months_remaining
    input_set: "One recommendation and its service+contract; seats_cut = contracted_quantity - target_quantity (for TERMINATE target_quantity=0)."
    constants:
      ANNUAL_MONTHS: 12
    precision: "integer cents; exact multiplication, no rounding"
    variants:
      - name: PROJECTED
        when: "proposal time"
        difference: "annualized over 12 months regardless of contract time remaining"
      - name: REALIZED
        when: "implementation time"
        difference: "prorated over months_remaining from the logical clock date to contract.term_end; diverges from projected whenever months_remaining != 12"

  - name: service_utilization
    trigger: "on Service create, on POST /usage change, and evaluated at POST /services/{id}/recommendations"
    algorithm: threshold
    formula: |
      utilization_pct = (contracted_quantity == 0) ? 0
                        : round_half_up(active_quantity / contracted_quantity * 100, 2)
      # Eligibility gate for rec_type == DOWNGRADE_SEATS:
      #   eligible iff utilization_pct <= UTILIZATION_THRESHOLD_PCT   (<=, inclusive at boundary)
    input_set: "Single service; active_quantity / contracted_quantity."
    constants:
      UTILIZATION_THRESHOLD_PCT: 70.00
    precision: "2 decimal places, round_half_up"

  - name: contract_committed_cost
    trigger: "recomputed when a Service's contracted_quantity or status changes (rightsize/terminate/cascade)"
    algorithm: aggregation
    formula: |
      monthly_committed_cost_cents =
        sum over Service s where s.contract_id == contract.id
          and s.status IN {ACTIVE, RIGHTSIZED}
          of (s.unit_rate_cents * s.contracted_quantity)
      # RETIRED services are excluded.
    input_set: "All services of the contract with status IN {ACTIVE, RIGHTSIZED}."
    constants: {}
    precision: "integer cents; exact sum"

  - name: contract_recovered_ledger
    trigger: "recomputed when a Credit is issued (dispute accepted)"
    algorithm: aggregation
    formula: |
      total_recovered_cents =
        sum over Credit c where c.status == ISSUED
          and c.invoice_line_item_id belongs to an Invoice with contract_id == contract.id
          of c.amount_cents
      # Conserved invariant: withdrawing a dispute creates no Credit, so this
      # total is unchanged across an open->withdraw cycle.
    input_set: "All ISSUED Credits whose line item's invoice is on this contract."
    constants: {}
    precision: "integer cents; exact sum"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET reads that permit all roles still require a valid role header"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Required body fields present, enum values legal, numbers non-negative, weight_pct in [0,100]"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all writes"
  - priority: 4
    category: existence
    check: "Every path id and body FK references an existing resource (validated left-to-right in the path first)"
    error_id: ERR_VENDOR_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_SERVICE_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_LINE_ITEM_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_COST_CENTER_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_RECOMMENDATION_NOT_FOUND | ERR_CREDIT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 5
    category: state
    check: "Target resource is in a state that permits the transition (state-machine from-state / disputability / reviewability / approval)"
    error_id: ERR_INVALID_STATE | ERR_LINE_NOT_DISPUTABLE | ERR_INVOICE_NOT_REVIEWABLE | ERR_DISPUTE_NOT_RESPONDED | ERR_INVOICE_NOT_APPROVED
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_referential
    check: "Cross-entity state gates: vendor ACTIVE for activate/renew; parent contract ACTIVE for invoice review/approve; cost center ACTIVE (not FROZEN) for allocation approve"
    error_id: ERR_VENDOR_SUSPENDED | ERR_CONTRACT_NOT_ACTIVE | ERR_COST_CENTER_FROZEN
    http_status: 409
    applies_to: "POST /contracts/{id}/activate, POST /contracts/{id}/renew, POST /invoices/{id}/review, POST /invoices/{id}/approve, POST /allocations/{id}/approve"
  - priority: 7
    category: business_temporal
    check: "current_utc within the renewal window (term_end - renewal_notice_days) <= current_utc <= term_end"
    error_id: ERR_OUTSIDE_RENEWAL_WINDOW
    http_status: 422
    applies_to: "POST /contracts/{id}/renew"
  - priority: 8
    category: business_constraint
    check: "Contract term overlap (closed interval, same vendor, ACTIVE); billing-period overlap (half-open, same service); weight sum == 100.00; utilization <= threshold for DOWNGRADE_SEATS; segregation of duties on pay; max dispute rounds (MAX_DISPUTE_ROUNDS=2); cost-center ownership"
    error_id: ERR_CONTRACT_TERM_OVERLAP | ERR_BILLING_PERIOD_OVERLAP | ERR_INVALID_WEIGHT_SUM | ERR_UTILIZATION_ABOVE_THRESHOLD | ERR_SEGREGATION_OF_DUTIES | ERR_MAX_ROUNDS_EXCEEDED | ERR_NOT_COST_CENTER_OWNER
    http_status: 409
    applies_to: "POST /contracts/{id}/activate, POST /invoices/{id}/line-items, POST /invoice-line-items/{id}/allocations, POST /services/{id}/recommendations, POST /invoices/{id}/pay, POST /disputes/{id}/resubmit, POST /allocations/{id}/approve"
  - priority: 9
    category: business_fiscal
    check: "Dispute fiscal bounds: claimed_credit_cents <= line.billed_amount_cents; vendor offered_credit_cents <= claimed_credit_cents"
    error_id: ERR_CREDIT_EXCEEDS_BILLED | ERR_OFFER_EXCEEDS_CLAIM
    http_status: 422
    applies_to: "POST /invoice-line-items/{id}/disputes, POST /disputes/{id}/resubmit, POST /disputes/{id}/respond"
  - priority: 10
    category: business_constraint
    check: "OCC: expected_service_version matches Service.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /services/{id}/recommendations"

# =====================================================================
# §1.5 API Endpoint Table
# roles shorthand: ALL = [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
# =====================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["set logical clock to to_iso8601"]

  # ---- Vendor ----
  - method: POST
    path: "/vendors"
    description: "Create a vendor (starts ACTIVE)."
    roles: [Sourcing]
    code: 201
    input: [name, vendor_type]
    output: Vendor
    side_effects: []
  - method: GET
    path: "/vendors/{id}"
    description: "Fetch a vendor."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: POST
    path: "/vendors/{id}/suspend"
    description: "Suspend a vendor."
    roles: [Sourcing]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status=SUSPENDED", "increments Vendor.version by 1"]
  - method: GET
    path: "/vendors/{id}/contracts"
    description: "List contracts for a vendor (reverse reach Contract.vendor_id)."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Contract[]
    side_effects: []

  # ---- Contract ----
  - method: POST
    path: "/contracts"
    description: "Create a contract in DRAFT."
    roles: [Sourcing]
    code: 201
    input: [vendor_id, term_start, term_end, renewal_notice_days, "renewal_term_months?", "auto_renew?", "volume_tier_enabled?"]
    output: Contract
    side_effects: []
  - method: GET
    path: "/contracts/{id}"
    description: "Fetch a contract."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: POST
    path: "/contracts/{id}/activate"
    description: "Activate a DRAFT contract (checks vendor ACTIVE + closed-interval term overlap)."
    roles: [Sourcing]
    code: 200
    input: []
    output: Contract
    side_effects: ["status=ACTIVE", "increments Contract.version by 1"]
  - method: POST
    path: "/contracts/{id}/renew"
    description: "Renew an ACTIVE contract (vendor ACTIVE + inside renewal window)."
    roles: [Sourcing]
    code: 200
    input: []
    output: Contract
    side_effects: ["term_end += renewal_term_months months", "renewal_count += 1", "increments Contract.version by 1"]
  - method: POST
    path: "/contracts/{id}/terminate"
    description: "Terminate an ACTIVE contract; cascade services to RETIRED."
    roles: [Sourcing]
    code: 200
    input: []
    output: Contract
    side_effects: ["status=TERMINATED", "cascade services -> RETIRED", "recompute monthly_committed_cost_cents", "increments Contract.version by 1"]
  - method: GET
    path: "/contracts/{id}/services"
    description: "List services under a contract (reverse reach Service.contract_id)."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Service[]
    side_effects: []
  - method: GET
    path: "/contracts/{id}/invoices"
    description: "List invoices under a contract (reverse reach Invoice.contract_id)."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/contracts/{id}/savings-summary"
    description: "Reporting rollup of savings + recovery for a contract (computed read)."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: []
    output: "{ contract_id: string, total_projected_savings_cents: integer, total_realized_savings_cents: integer, total_recovered_cents: integer, monthly_committed_cost_cents: integer }"
    side_effects: []

  # ---- Service ----
  - method: POST
    path: "/services"
    description: "Create a service under a contract."
    roles: [Sourcing]
    code: 201
    input: [contract_id, service_type, license_type, unit_rate_cents, contracted_quantity, "active_quantity?", "discovery_source?", "sanctioned?"]
    output: Service
    side_effects: ["compute utilization_pct", "recompute parent Contract.monthly_committed_cost_cents"]
  - method: GET
    path: "/services/{id}"
    description: "Fetch a service."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: []
    output: Service
    side_effects: []
  - method: POST
    path: "/services/{id}/recommendations"
    description: "Propose an optimization recommendation. OCC on Service.version; supersedes prior PROPOSED rec."
    roles: [Analyst]
    code: 201
    input: [rec_type, target_quantity, expected_service_version]
    output: Recommendation
    side_effects:
      - "OCC check expected_service_version == Service.version"
      - "compute projected_savings_cents (projected variant)"
      - "for DOWNGRADE_SEATS enforce utilization_pct <= 70.00"
      - "supersede prior PROPOSED recommendation on this service -> SUPERSEDED"
      - "increments Service.version by 1"
  - method: GET
    path: "/services/{id}/recommendations"
    description: "List recommendations for a service (reverse reach Recommendation.service_id)."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Recommendation[]
    side_effects: []

  # ---- Recommendation actions ----
  - method: POST
    path: "/recommendations/{id}/implement"
    description: "Implement a PROPOSED recommendation; cascade Service + Contract; compute realized savings."
    roles: [FinanceApprover]
    code: 200
    input: []
    output: Recommendation
    side_effects: ["compute realized_savings_cents", "Service quantity/status/version updated", "parent Contract.monthly_committed_cost_cents recomputed"]
  - method: POST
    path: "/recommendations/{id}/reject"
    description: "Reject a PROPOSED recommendation."
    roles: [FinanceApprover]
    code: 200
    input: []
    output: Recommendation
    side_effects: ["status=REJECTED"]

  # ---- Invoice ----
  - method: POST
    path: "/invoices"
    description: "Create an invoice in RECEIVED."
    roles: [Analyst]
    code: 201
    input: [contract_id, period_start, period_end]
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch an invoice."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/line-items"
    description: "Add a line item (checks half-open billing-period overlap on the service); computes provisional expected."
    roles: [Analyst]
    code: 201
    input: [service_id, billing_period_start, billing_period_end, billed_quantity, billed_amount_cents]
    output: InvoiceLineItem
    side_effects: ["compute provisional expected_amount_cents", "recompute invoice billed_amount_cents, net_amount_cents"]
  - method: POST
    path: "/invoices/{id}/review"
    description: "Move RECEIVED -> UNDER_REVIEW; requires contract ACTIVE; recompute FINAL expected + variance."
    roles: [Analyst]
    code: 200
    input: []
    output: Invoice
    side_effects: ["recompute FINAL line expected/variance", "recompute invoice aggregates", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/approve"
    description: "Move UNDER_REVIEW -> APPROVED; requires contract ACTIVE and no open disputes."
    roles: [FinanceApprover]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status=APPROVED", "approved_by_user_id=X-User-ID", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Move APPROVED -> PAID; SoD: payer must differ from approver."
    roles: [FinanceApprover]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status=PAID", "balance_due_cents=0", "increments Invoice.version by 1"]

  # ---- InvoiceLineItem ----
  - method: GET
    path: "/invoice-line-items/{id}"
    description: "Fetch a line item."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: []
    output: InvoiceLineItem
    side_effects: []
  - method: GET
    path: "/invoice-line-items"
    description: "Filtered list of line items (reverse reach InvoiceLineItem.invoice_id and .service_id)."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: ["invoice_id?", "service_id?", "limit?", "offset?"]
    output: InvoiceLineItem[]
    side_effects: []
  - method: GET
    path: "/invoice-line-items/{id}/disputes"
    description: "List disputes on a line item (reverse reach Dispute.invoice_line_item_id)."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: GET
    path: "/invoice-line-items/{id}/allocations"
    description: "List allocations on a line item (reverse reach Allocation.invoice_line_item_id)."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Allocation[]
    side_effects: []
  - method: POST
    path: "/invoice-line-items/{id}/disputes"
    description: "Open a dispute on a line (line BILLED, invoice UNDER_REVIEW/DISPUTED, claimed <= billed)."
    roles: [Analyst]
    code: 201
    input: [disputed_amount_cents, claimed_credit_cents, "reason?"]
    output: Dispute
    side_effects: ["line -> DISPUTED", "invoice UNDER_REVIEW -> DISPUTED"]
  - method: POST
    path: "/invoice-line-items/{id}/allocations"
    description: "Bulk-create the chargeback set for a line (weights sum 100.00); computes shares with round-per-share + remainder-to-top-weight."
    roles: [Analyst]
    code: 201
    input: [allocations]
    output: Allocation[]
    side_effects: ["compute each amount_cents so sum == line net_amount_cents"]

  # ---- Dispute actions ----
  - method: POST
    path: "/disputes/{id}/respond"
    description: "Vendor responds (offered_credit_cents <= claimed_credit_cents)."
    roles: [Vendor]
    code: 200
    input: [response_type, offered_credit_cents]
    output: Dispute
    side_effects: ["set response_type, offered_credit_cents", "status=VENDOR_RESPONDED"]
  - method: POST
    path: "/disputes/{id}/resubmit"
    description: "Analyst starts another negotiation round (round_count < MAX_DISPUTE_ROUNDS; claimed <= billed)."
    roles: [Analyst]
    code: 200
    input: [claimed_credit_cents]
    output: Dispute
    side_effects: ["set claimed_credit_cents", "round_count += 1", "status=RESUBMITTED"]
  - method: POST
    path: "/disputes/{id}/accept"
    description: "Analyst accepts the vendor offer; depth-3 cascade issuing a Credit."
    roles: [Analyst]
    code: 200
    input: []
    output: Dispute
    side_effects: ["recovered_credit_cents=offered_credit_cents", "create Credit ISSUED", "line CREDITED + net recomputed", "contract.total_recovered_cents += amount", "allocations REVERSED", "invoice revert DISPUTED -> UNDER_REVIEW"]
  - method: POST
    path: "/disputes/{id}/withdraw"
    description: "Analyst withdraws; line -> BILLED; recovered ledger unchanged (compensation)."
    roles: [Analyst]
    code: 200
    input: []
    output: Dispute
    side_effects: ["line -> BILLED", "invoice revert if no open disputes", "no Credit; total_recovered_cents unchanged"]

  # ---- Credit ----
  - method: GET
    path: "/credits/{id}"
    description: "Fetch a credit."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: []
    output: Credit
    side_effects: []
  - method: GET
    path: "/credits"
    description: "Filtered list of credits (reverse reach Credit.dispute_id and .invoice_line_item_id)."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: ["dispute_id?", "invoice_line_item_id?", "limit?", "offset?"]
    output: Credit[]
    side_effects: []

  # ---- CostCenter ----
  - method: POST
    path: "/cost-centers"
    description: "Create a cost center (ACTIVE)."
    roles: [SystemAdmin]
    code: 201
    input: [code, gl_account, owner_user_id]
    output: CostCenter
    side_effects: []
  - method: GET
    path: "/cost-centers/{id}"
    description: "Fetch a cost center."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: []
    output: CostCenter
    side_effects: []
  - method: POST
    path: "/cost-centers/{id}/freeze"
    description: "Freeze a cost center; blocks allocation approval."
    roles: [SystemAdmin]
    code: 200
    input: []
    output: CostCenter
    side_effects: ["status=FROZEN", "increments CostCenter.version by 1"]
  - method: GET
    path: "/cost-centers/{id}/allocations"
    description: "List allocations charged to a cost center (reverse reach Allocation.cost_center_id)."
    roles: [Sourcing, Analyst, FinanceApprover, CostCenterOwner, Vendor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Allocation[]
    side_effects: []

  # ---- Allocation actions ----
  - method: POST
    path: "/allocations/{id}/approve"
    description: "CostCenterOwner posts a DRAFT allocation (owner match + cost center ACTIVE)."
    roles: [CostCenterOwner]
    code: 200
    input: []
    output: Allocation
    side_effects: ["status=POSTED", "increments Allocation.version by 1"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for the operation."
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required field, illegal enum, negative amount, or weight_pct outside [0,100]."
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "Referenced vendor does not exist."
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "Referenced contract does not exist."
  - id: ERR_SERVICE_NOT_FOUND
    http: 404
    condition: "Referenced service does not exist."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "Referenced invoice does not exist."
  - id: ERR_LINE_ITEM_NOT_FOUND
    http: 404
    condition: "Referenced invoice line item does not exist."
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "Referenced dispute does not exist."
  - id: ERR_COST_CENTER_NOT_FOUND
    http: 404
    condition: "Referenced cost center does not exist."
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "Referenced allocation does not exist."
  - id: ERR_RECOMMENDATION_NOT_FOUND
    http: 404
    condition: "Referenced recommendation does not exist."
  - id: ERR_CREDIT_NOT_FOUND
    http: 404
    condition: "Referenced credit does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition attempted from a state that does not permit it (generic)."
  - id: ERR_LINE_NOT_DISPUTABLE
    http: 409
    condition: "Dispute open attempted while line != BILLED or parent invoice not in {UNDER_REVIEW, DISPUTED}."
  - id: ERR_INVOICE_NOT_REVIEWABLE
    http: 409
    condition: "Review attempted on an invoice not in RECEIVED."
  - id: ERR_DISPUTE_NOT_RESPONDED
    http: 409
    condition: "Accept/resubmit attempted while dispute not in VENDOR_RESPONDED."
  - id: ERR_INVOICE_NOT_APPROVED
    http: 409
    condition: "Pay attempted while invoice not in APPROVED."
  - id: ERR_VENDOR_SUSPENDED
    http: 409
    condition: "Activate/renew attempted while the vendor is SUSPENDED."
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "Invoice review/approve attempted while the parent contract is not ACTIVE."
  - id: ERR_COST_CENTER_FROZEN
    http: 409
    condition: "Allocation approve attempted while the cost center is FROZEN."
  - id: ERR_OUTSIDE_RENEWAL_WINDOW
    http: 422
    condition: "Renew attempted with current_utc outside [term_end - renewal_notice_days, term_end]."
  - id: ERR_CONTRACT_TERM_OVERLAP
    http: 409
    condition: "Activation would create two ACTIVE contracts for one vendor with intersecting closed term intervals (adjacency counts)."
  - id: ERR_BILLING_PERIOD_OVERLAP
    http: 409
    condition: "New line item's half-open billing period overlaps an existing line for the same service (adjacency allowed)."
  - id: ERR_INVALID_WEIGHT_SUM
    http: 422
    condition: "Allocation set weight_pct values do not sum to exactly 100.00."
  - id: ERR_UTILIZATION_ABOVE_THRESHOLD
    http: 422
    condition: "DOWNGRADE_SEATS recommendation on a service whose utilization_pct > 70.00."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Pay attempted by the same X-User-ID that approved the invoice."
  - id: ERR_MAX_ROUNDS_EXCEEDED
    http: 409
    condition: "Resubmit attempted when round_count has reached MAX_DISPUTE_ROUNDS."
  - id: ERR_NOT_COST_CENTER_OWNER
    http: 403
    condition: "Allocation approve by a user who is not the cost center's owner_user_id."
  - id: ERR_CREDIT_EXCEEDS_BILLED
    http: 422
    condition: "claimed_credit_cents exceeds the line's billed_amount_cents."
  - id: ERR_OFFER_EXCEEDS_CLAIM
    http: 422
    condition: "Vendor offered_credit_cents exceeds the dispute's claimed_credit_cents."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_service_version does not match Service.version on recommendation create."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Sourcing
    description: "Manages vendors, contracts (activate/renew/terminate), and service inventory."
    identity: "opaque"
    exclusive_operations:
      - "POST /vendors"
      - "POST /vendors/{id}/suspend"
      - "POST /contracts"
      - "POST /contracts/{id}/activate"
      - "POST /contracts/{id}/renew"
      - "POST /contracts/{id}/terminate"
      - "POST /services"
    shared_operations: ["all GET reads"]
  - name: Analyst
    description: "Invoice intake and review, line items, disputes, chargeback creation, and proposing recommendations."
    identity: "opaque"
    exclusive_operations:
      - "POST /invoices"
      - "POST /invoices/{id}/line-items"
      - "POST /invoices/{id}/review"
      - "POST /services/{id}/recommendations"
      - "POST /invoice-line-items/{id}/disputes"
      - "POST /invoice-line-items/{id}/allocations"
      - "POST /disputes/{id}/resubmit"
      - "POST /disputes/{id}/accept"
      - "POST /disputes/{id}/withdraw"
    shared_operations: ["all GET reads"]
  - name: FinanceApprover
    description: "Approves and pays invoices (segregation of duties) and decides recommendations."
    identity: "opaque"
    exclusive_operations:
      - "POST /invoices/{id}/approve"
      - "POST /invoices/{id}/pay"
      - "POST /recommendations/{id}/implement"
      - "POST /recommendations/{id}/reject"
    shared_operations: ["all GET reads"]
  - name: CostCenterOwner
    description: "Approves chargeback allocations posted to the cost center they own."
    identity: "entity_backed:CostCenter"
    exclusive_operations:
      - "POST /allocations/{id}/approve"
    shared_operations: ["all GET reads"]
  - name: Vendor
    description: "Responds to disputes raised against their invoices."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /disputes/{id}/respond"
    shared_operations: ["all GET reads"]
  - name: SystemAdmin
    description: "Operational: logical clock and cost-center configuration."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /cost-centers"
      - "POST /cost-centers/{id}/freeze"
    shared_operations: ["all GET reads"]





