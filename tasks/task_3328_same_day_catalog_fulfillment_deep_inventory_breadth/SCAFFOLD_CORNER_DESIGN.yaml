          - entities.ReturnAuthorization.fields.damaged_units
          - constants.RESTOCK_RATIO_START
        distinguishing_aspect: "The waterfall walks the authorized lines in the declared rank order (delivered line_subtotal_cents DESC, created_at ASC) with the ratio decaying from 0.80 by 0.30 per line: the largest-subtotal line keeps 80% restockable, the second keeps 50%, and every later line is routed entirely to the damage path at exactly 0%."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T10:05:00Z (Monday), DC BOS local 06:05 after its cutoff."
            - "One account in region NORTHEAST; two curated items priced 3000 and 9000 cents so the second line outranks the first; BOS stock of 10 of each."
            - "One order with line one of 2 units and line two of 2 units, picked in full and cut off."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T10:05:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "RC-1001", description: "Restock rank item one", material_spec: "steel", long_tail: false, unit_price_cents: 3000, unit_weight_kg: 0.10, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_one_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "RC-1002", description: "Restock rank item two", material_spec: "steel", long_tail: false, unit_price_cents: 9000, unit_weight_kg: 0.10, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 11, nominal_width_mm: 11, nominal_height_mm: 11, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_two_id: $.data.id }
            - call: "POST /items/${item_one_id}/attributes"
              payload: { attribute_name: "Grade", attribute_value: "A", unit_of_measure: "n/a" }
              as: CatalogCurator
            - call: "POST /items/${item_two_id}/attributes"
              payload: { attribute_name: "Grade", attribute_value: "B", unit_of_measure: "n/a" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_one_id}", "${item_two_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_one_id}", dc_id: "${bos_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
            - call: "POST /stock"
              payload: { item_id: "${item_two_id}", dc_id: "${bos_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_one_id}", quantity: 2 }, { item_id: "${item_two_id}", quantity: 2 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}/lines"
              payload: { limit: 10, offset: 0 }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { line_one_id: "$.data[0].id", line_two_id: "$.data[1].id" }
            - call: "POST /orders/${order_id}/lines/${line_one_id}/pick"
              payload: { requested_units: 2 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_one_id}/pick_complete"
              payload: { actual_units: 2 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_two_id}/pick"
              payload: { requested_units: 2 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_two_id}/pick_complete"
              payload: { actual_units: 2 }
              as: WarehousePicker
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v_ready: $.data.version }
            - call: "POST /orders/${order_id}/confirm_cutoff"
              payload: { expected_order_version: "${order_v_ready}", service_level: "GROUND" }
              as: DCManager
            - call: "POST /returns"
              payload: { order_id: "${order_id}", lines: [{ line_id: "${line_one_id}", requested_return_units: 2 }, { line_id: "${line_two_id}", requested_return_units: 2 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /returns/${ret_id}/approve"
              payload: {}
              as: DCManager
          assert:
            - "the return's restock_units == 2: the higher-ranked line ${line_two_id} (subtotal 18000) keeps floor(2 * 0.80) == 1 and the lower-ranked line ${line_one_id} (subtotal 6000) keeps floor(2 * 0.50) == 1"
            - "the return's damaged_units == 2, the complement of the restock share"
            - "ReturnAuthorization.${ret_id}.return_status == APPROVED"
            - "the rank order is by delivered line_subtotal_cents DESC, so ${line_two_id} is walked first regardless of which line was created first"
            - "no line was walked at a restock ratio of 0 because the two authorised lines both fit inside the 0.80/0.50 decay window"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_role_header_returns_unauthenticated
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request carrying no X-User-Role at all is rejected at priority 1 with 401 ERR_UNAUTHENTICATED — not 403 ERR_UNAUTHORIZED, which is the answer to a present-but-unpermitted role."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One account exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /orders"
              payload: { limit: 10, offset: 0 }
              as: ""
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"
            - "error_id != ERR_UNAUTHORIZED"
            - "response_type is error and data carries both error_id and message"

      - name: unrelated_role_is_denied_before_existence_is_checked
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_ORDER_NOT_FOUND
        distinguishing_aspect: "Two failures at once — the caller's role is not permitted on POST /orders/{id}/release and the order id does not exist at all — resolve to the priority 2 authorization error 403 ERR_UNAUTHORIZED, proving the role check runs before the priority 3 existence walk."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One account exists; no order has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /orders/00000000-0000-4000-8000-000000000042/release"
              payload: {}
              as: WarehousePicker
              as_user_id: "wp-dana"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "error_id != ERR_ORDER_NOT_FOUND, so the priority 2 role check pre-empts the priority 3 existence check"
            - "no order was created as a side effect"

      - name: item_ownership_is_checked_before_the_order_state
        claim_type: Cross-Entity Validation
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors.ERR_FORBIDDEN_OWNERSHIP
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Ownership is a cross-entity check on a different table: a second account releasing an order it does not own receives 403 ERR_FORBIDDEN_OWNERSHIP, and the same request from the owning account proceeds past the ownership gate and then fails the state gate with 409 ERR_INVALID_STATE once the order is already released."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. Two accounts — Riverside Machine and a rival account School Street Supply — plus one curated item and one DRAFT order owned by Riverside Machine."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "School Street Supply", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { rival_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "OW-1001", description: "Ownership probe item", material_spec: "steel", long_tail: false, unit_price_cents: 1500, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Grade", attribute_value: "8.8", unit_of_measure: "n/a" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /orders"
              payload: { account_id: "${owner_id}", lines: [{ item_id: "${item_id}", quantity: 1 }] }
              as: CustomerAccount
              as_user_id: "${owner_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${rival_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${owner_id}"
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${owner_id}"
              captures: { error_id2: $.data.error_id }
          assert:
            - "the rival account's release returns 403 with error_id == ERR_FORBIDDEN_OWNERSHIP"
            - "the owner's release then succeeds with 200 and CatalogOrder.${order_id}.order_status == RELEASED"
            - "the owner's SECOND release returns 409 with error_id == ERR_INVALID_STATE, so ownership passed but state did not"
            - "the rival account never mutated the order: its version is the same as after the owner's first release"

      - name: confirm_cutoff_checks_state_before_the_windows_and_the_quota
        claim_type: Priority Ordering
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - validations[priority=13]
          - errors.ERR_INVALID_STATE
          - errors.ERR_PROMISE_DATE_IN_PAST
        distinguishing_aspect: "Three checks are violated by the one request — the order is only ALLOCATED (priority 6), no promised_delivery_by is supplied so the commitment window cannot be evaluated (priority 12), and the promise that a naive reading of the request implies is in the past (priority 13) — and the single returned error is the priority 6 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T10:05:00Z (Monday), DC BOS local 06:05 after its cutoff. One order allocated to BOS, line still ALLOCATED (nothing picked)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T10:05:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "PR-1001", description: "Priority probe item", material_spec: "steel", long_tail: false, unit_price_cents: 1500, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Grade", attribute_value: "8.8", unit_of_measure: "n/a" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${dc_id}", account_id: "${acct_id}", on_hand_units: 5, daily_demand_units: 1, inbound_daily_units: 1 }
              as: DCManager
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 1 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order_id}/confirm_cutoff"
              payload: { expected_order_version: "${order_v}", service_level: "GROUND" }
              as: DCManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_PROMISE_DATE_IN_PAST, so the priority 6 state check pre-empts both the priority 12 window check and the priority 13 past-promise check"
            - "CatalogOrder.${order_id}.fulfillment_status is still ALLOCATED"
            - "GET /orders/${order_id}/shipments returns 0 rows — no shipment was created"

      - name: inbound_capacity_is_a_fiscal_check_that_runs_last
        claim_type: Satisfaction to Pass
        grounds:
          - validations[priority=15]
          - errors.ERR_INBOUND_CAPACITY_EXCEEDED
          - entities.DistributionCenter.fields.inbound_capacity_units
        distinguishing_aspect: "Allocation is admitted while it fits inside inbound_capacity_units and refused once a further order would push the DC's inbound_reserved_units past it — the first order of 9 units succeeds against a capacity of 10 and the second order of 2 units returns 409 ERR_INBOUND_CAPACITY_EXCEEDED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. DC BOS with inbound_capacity_units 10; one account in region NORTHEAST; one curated item with 30 units of stock; two orders of 9 and 2 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 10, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "FC-1001", description: "Fiscal capacity item", material_spec: "steel", long_tail: false, unit_price_cents: 1000, unit_weight_kg: 0.10, curation_bundle_size: 20, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Grade", attribute_value: "8.8", unit_of_measure: "n/a" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${dc_id}", account_id: "${acct_id}", on_hand_units: 30, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 9 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_a_id: $.data.id }
            - call: "POST /orders/${order_a_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_a_v: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 2 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_b_id: $.data.id }
            - call: "POST /orders/${order_b_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_b_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_a_id}/allocate"
              payload: { expected_order_version: "${order_a_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_b_id}/allocate"
              payload: { expected_order_version: "${order_b_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the first allocation succeeds with 200 and DistributionCenter.${dc_id}.inbound_reserved_units == 9"
            - "the second allocation returns 409 with error_id == ERR_INBOUND_CAPACITY_EXCEEDED, because 9 + 2 would exceed the capacity of 10"
            - "CatalogOrder.${order_b_id}.fulfillment_status is still AWAITING_RELEASE and allocated_dc_id is null"
            - "DistributionCenter.${dc_id}.inbound_reserved_units is still 9, so the refused allocation reserved nothing"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: catalog_search_filters_all_declared_query_parameters
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET_/items
          - entities.CatalogItem.fields.catalog_status
          - entities.CatalogItem.fields.material_spec
        distinguishing_aspect: "Every declared search parameter narrows the same collection independently: the material_spec filter, the catalog_status filter and the region filter each return exactly the row that matches, while an unrelated parameter combination returns 0 rows."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One DC BOS in NORTHEAST; three items on file, one of which is later suspended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SE-1001", description: "Search item brass", material_spec: "brass", long_tail: false, unit_price_cents: 1000, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { brass_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SE-1002", description: "Search item steel", material_spec: "steel", long_tail: false, unit_price_cents: 1100, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 11, nominal_width_mm: 11, nominal_height_mm: 11, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { steel_id: $.data.id }
            - call: "POST /items"
