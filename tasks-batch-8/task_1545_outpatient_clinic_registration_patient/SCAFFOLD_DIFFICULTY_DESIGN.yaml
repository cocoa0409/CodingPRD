            - call: "GET /patient-access/referrals/${ref_id}"
              as: Registrar
              captures: { ref_status: $.data.status, ref_consumed: $.data.visits_consumed }
          assert:
            - "matched_ref == ${ref_id}"
            - "Appointment.${a_id}.status == ARRIVED"
            - "ref_consumed == 1"
            - "ref_status == EXHAUSTED"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_referral_business_safety
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REFERRAL_REQUIRED]
        distinguishing_aspect: |
          Category pair (state vs business_safety): mark-ready on an
          appointment that is simultaneously (i) in the wrong state
          (SCHEDULED, not PRE_CHECKED) and (ii) missing a required referral
          under an HMO plan must return ERR_INVALID_STATE (priority 4), not
          ERR_REFERRAL_REQUIRED (priority 6).
        test_recipe:
          setup:
            - "Registered patient with HMO policy; appointment created (no referral exists) and left in SCHEDULED (pre-check never performed because eligibility not posted)"
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Pri", last_name: "One", date_of_birth: "1981-01-15", sex_at_birth: "F", primary_phone: "+15556000001" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYERH", member_id: "MP1", plan_type: "HMO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "CARD", procedure_code: "99213", scheduled_start: "2026-08-18T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRI" }
              as: Registrar
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /patient-access/appointments/${a_id}/mark-ready"
              payload: {}
              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: business_safety_auth_beats_fiscal_deposit
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_AUTH_REQUIRED]
          - errors[ERR_DEPOSIT_SHORTFALL]
        distinguishing_aspect: |
          Category pair (business_safety vs business_fiscal): mark-ready on
          a PRE_CHECKED PROCEDURE appointment that simultaneously (i) lacks
