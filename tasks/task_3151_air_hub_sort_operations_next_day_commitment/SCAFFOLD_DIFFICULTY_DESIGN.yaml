              captures: { pkg_q2_v: $.data.version }
          trigger:
            - call: "POST /airhub/moves/${move_id}/assign-buildup"
              payload: { package_id: "${pkg_q1}", buildup_id: "${bd_id}" }
              as: LoadPlanner
              captures: { move_v: $.data.version }
            - call: "POST /airhub/moves/${move_id}/load-package"
              payload: { package_id: "${pkg_q1}", expected_load_move_version: "${move_v}", expected_package_version: "${pkg_q1_v}" }
              as: LoadPlanner
              captures: { move_v2: $.data.version }
            - call: "GET /airhub/buildups/${bd_id}"
              payload: {}
              as: LoadPlanner
              captures: { bd_v_pre: $.data.version }
            - call: "POST /airhub/buildups/${bd_id}/seal"
              payload: { expected_buildup_version: "${bd_v_pre}" }
              as: LoadPlanner
              captures: { seal_at_limit: $.data.status }
            - call: "POST /airhub/buildups/${bd_id}/unseal"
