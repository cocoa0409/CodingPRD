# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_0453_creator_membership  |  Difficulty tier: EXPERT
# 9 rule_ids × ≥2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- Instance 1: proration (Pledge domain) ---
      - name: dvc_proration_up_front_vs_end_of_month
        grounds:
          - calculations.initial_proration
          - entities.Creator.fields.charge_timing
          - entities.Charge.fields.charge_kind
          - state_machines.Pledge.DRAFT_to_ACTIVE
        distinguishing_aspect: "Same PLUS tier (1500c) pledged mid-cycle on the Pledge domain: UP_FRONT creator immediately produces an INITIAL_PRORATION Charge of 750c, while END_OF_MONTH creator produces no charge — divergent results from identical inputs."
        test_recipe:
          setup:
            - "Clock at 2026-06-16 (June, 30 days, remaining=15)."
            - "Creator C_UF with charge_timing=UP_FRONT; Creator C_EOM with charge_timing=END_OF_MONTH; each has a PUBLISHED MONTHLY tier monthly_fee_cents=1500."
            - "Two patrons, one pledging each creator."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { display_name: "C UF", email: "cuf@x.com", payout_account_ref: "acct_uf", charge_timing: "UP_FRONT", billing_mode: "MONTHLY" }
              as: Creator
              captures: { c_uf_id: $.data.id }
            - call: "POST /creators"
              payload: { display_name: "C EOM", email: "ceom@x.com", payout_account_ref: "acct_eom", charge_timing: "END_OF_MONTH", billing_mode: "MONTHLY" }
              as: Creator
              captures: { c_eom_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_uf_id}", name: "PLUS", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_uf_id}"
              captures: { tier_uf_id: $.data.id }
            - call: "POST /tiers/${tier_uf_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_uf_id}"
            - call: "POST /tiers"
              payload: { creator_id: "${c_eom_id}", name: "PLUS", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_eom_id}"
              captures: { tier_eom_id: $.data.id }
            - call: "POST /tiers/${tier_eom_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_eom_id}"
            - call: "POST /patrons"
              payload: { display_name: "P1", email: "p1@x.com" }
              as: Patron
              captures: { p1_id: $.data.id }
            - call: "POST /patrons"
              payload: { display_name: "P2", email: "p2@x.com" }
              as: Patron
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /pledges"
              payload: { patron_id: "${p1_id}", creator_id: "${c_uf_id}", tier_id: "${tier_uf_id}" }
              as: Patron
              as_user_id: "${p1_id}"
              captures: { pl_uf_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${p2_id}", creator_id: "${c_eom_id}", tier_id: "${tier_eom_id}" }
              as: Patron
              as_user_id: "${p2_id}"
              captures: { pl_eom_id: $.data.id }
            - call: "GET /charges?pledge_id=${pl_uf_id}"
              payload: {}
              as: PlatformAdmin
              captures: { uf_charge_gross: "$.data[0].gross_amount_cents", uf_charge_kind: "$.data[0].charge_kind" }
          assert:
            - "GET /charges?pledge_id=${pl_uf_id} returns exactly 1 Charge with charge_kind == INITIAL_PRORATION and gross_amount_cents == 750"
            - "GET /charges?pledge_id=${pl_eom_id} returns total_count == 0 (no immediate charge under END_OF_MONTH)"

      # --- Instance 2: payout settlement (Creator domain) ---
      - name: dvc_payout_settlement_vs_empty_sweep
        grounds:
          - calculations.payout_settlement
          - entities.Creator.fields.platform_plan
          - entities.Payout.fields.payout_amount_cents
          - errors[ERR_NOTHING_TO_PAYOUT]
        distinguishing_aspect: "On the Creator domain (distinct from the Pledge-domain proration above): a sweep over three SUCCEEDED charges yields a Payout with payout_amount_cents==3219, whereas the empty-sweep variant rejects with ERR_NOTHING_TO_PAYOUT and creates no Payout."
        test_recipe:
          setup:
            - "Clock at 2026-06-01. Creator STARTER (fee_rate 0.10) with one ACTIVE MONTHLY pledge."
            - "Three SUCCEEDED charges for cycle 2026-06-01 with net_amount_cents 1500, 800, 1500 (processing fees 74, 53, 74)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { display_name: "C STARTER", email: "cs@x.com", payout_account_ref: "acct_s", platform_plan: "STARTER", charge_timing: "UP_FRONT", billing_mode: "MONTHLY" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "BASE", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "PA", email: "pa@x.com" }
              as: Patron
              captures: { pa_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${pa_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${pa_id}"
              captures: { pl_id: $.data.id, pl_charge_id: $.data.id }
            - call: "GET /charges?pledge_id=${pl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ch1_id: "$.data[0].id" }
            - call: "POST /charges/${ch1_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /charges"
              payload: { pledge_id: "${pl_id}", charge_kind: "CYCLE_RENEWAL", gross_amount_cents: 800 }
              as: PlatformAdmin
              captures: { ch2_id: $.data.id }
            - call: "POST /charges/${ch2_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /charges"
              payload: { pledge_id: "${pl_id}", charge_kind: "CYCLE_RENEWAL", gross_amount_cents: 1500 }
              as: PlatformAdmin
              captures: { ch3_id: $.data.id }
            - call: "POST /charges/${ch3_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /payouts"
              payload: { creator_id: "${c_id}", cycle_anchor_date: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { payout_id: $.data.id, payout_amt: $.data.payout_amount_cents }
          assert:
            - "Payout.${payout_id}.gross_cents == 3800"
            - "Payout.${payout_id}.processing_fee_cents == 201"
            - "Payout.${payout_id}.platform_fee_cents == 380"
            - "Payout.${payout_id}.payout_amount_cents == 3219"
            - "A second POST /payouts {creator_id: ${c_id}, cycle_anchor_date: 2026-06-01T00:00:00Z} returns 409 ERR_NOTHING_TO_PAYOUT (all charges now swept)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- mode (b): rounding order — per-line then sum ---
      - name: cf_processing_fee_per_line_then_sum
        grounds:
          - calculations.processing_fee
          - calculations.payout_settlement
          - entities.Payout.fields.processing_fee_cents
        distinguishing_aspect: "Mode (b) nested-rounding-order: per-line fee rounding then summation yields processing_fee_cents==201, whereas sum-then-round yields 200 — the scaffold pins per-line; a 1-cent divergence is observable."
        test_recipe:
          setup:
            - "Same three SUCCEEDED charges (net 1500, 800, 1500) as dvc_payout_settlement, swept into a payout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { display_name: "C PL", email: "cpl@x.com", payout_account_ref: "acct_pl", platform_plan: "STARTER", charge_timing: "UP_FRONT", billing_mode: "MONTHLY" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "BASE", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "PB", email: "pb@x.com" }
              as: Patron
              captures: { pb_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${pb_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${pb_id}"
              captures: { pl_id: $.data.id }
            - call: "GET /charges?pledge_id=${pl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ch1_id: "$.data[0].id" }
            - call: "POST /charges/${ch1_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
              captures: { ch1_fee: $.data.processing_fee_cents }
            - call: "POST /charges"
              payload: { pledge_id: "${pl_id}", charge_kind: "CYCLE_RENEWAL", gross_amount_cents: 800 }
              as: PlatformAdmin
              captures: { ch2_id: $.data.id }
            - call: "POST /charges/${ch2_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
              captures: { ch2_fee: $.data.processing_fee_cents }
            - call: "POST /charges"
              payload: { pledge_id: "${pl_id}", charge_kind: "CYCLE_RENEWAL", gross_amount_cents: 1500 }
              as: PlatformAdmin
              captures: { ch3_id: $.data.id }
            - call: "POST /charges/${ch3_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
              captures: { ch3_fee: $.data.processing_fee_cents }
          trigger:
            - call: "POST /payouts"
              payload: { creator_id: "${c_id}", cycle_anchor_date: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { payout_id: $.data.id }
          assert:
            - "ch1_fee == 74 and ch2_fee == 53 and ch3_fee == 74 (per-line round_half_up of net*0.029 + 30)"
            - "Payout.${payout_id}.processing_fee_cents == 201 (sum of per-line fees, NOT 200 from sum-then-round)"

      # --- mode (a): ≥3-input nested min/max — per-creation cap ---
      - name: cf_per_creation_cap_nested_min_max
        grounds:
          - calculations.per_creation_charge
          - entities.Tier.fields.per_creation_fee_cents
          - entities.Tier.fields.per_creation_monthly_cap_cents
          - entities.Pledge.fields.current_cycle_charged_cents
        distinguishing_aspect: "Mode (a) nested min/max over 3 inputs (per_creation_fee_cents, per_creation_monthly_cap_cents, current_cycle_charged_cents): publishing three paid posts bills 500, 500, 200 then stops — distinct axis from the mode-(b) rounding instance."
        test_recipe:
          setup:
            - "Clock 2026-06-10. PER_CREATION creator; tier per_creation_fee_cents=500, cap=1200; one ACTIVE per-creation pledge with current_cycle_charged_cents=0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { display_name: "C PC", email: "cpc@x.com", payout_account_ref: "acct_pc", billing_mode: "PER_CREATION", charge_timing: "UP_FRONT" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "PC", billing_model: "PER_CREATION", rank: 1, per_creation_fee_cents: 500, per_creation_monthly_cap_cents: 1200 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "PC1", email: "pc1@x.com" }
              as: Patron
              captures: { pc1_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${pc1_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${pc1_id}"
              captures: { pl_id: $.data.id }
            - call: "POST /posts"
              payload: { creator_id: "${c_id}", title: "p1", body: "b1", min_tier_rank: 1, is_paid_creation: true }
              as: Creator
              as_user_id: "${c_id}"
              captures: { post1_id: $.data.id }
            - call: "POST /posts"
              payload: { creator_id: "${c_id}", title: "p2", body: "b2", min_tier_rank: 1, is_paid_creation: true }
              as: Creator
              as_user_id: "${c_id}"
              captures: { post2_id: $.data.id }
            - call: "POST /posts"
              payload: { creator_id: "${c_id}", title: "p3", body: "b3", min_tier_rank: 1, is_paid_creation: true }
              as: Creator
              as_user_id: "${c_id}"
              captures: { post3_id: $.data.id }
            - call: "POST /posts/${post1_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /posts/${post2_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /posts/${post3_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "GET /charges?pledge_id=${pl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ch_total: "$.data[0].gross_amount_cents" }
          assert:
            - "GET /charges?pledge_id=${pl_id} (charge_kind=PER_CREATION) returns 3 charges with gross_amount_cents 500, 500, 200 in creation order (third capped at cap-2*500=200)"
            - "Pledge.${pl_id}.current_cycle_charged_cents == 1200"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- cyclic: Pledge lifecycle CANCELLED+LAPSED -> ACTIVE via reactivate ---
      - name: nlsm_pledge_reactivate_cycle
        grounds:
          - state_machines.Pledge.LAPSED_REACTIVATE_to_ACTIVE
          - state_machines.Pledge.ACTIVE_to_CANCELLED
          - entities.Pledge.fields.lifecycle_status
        distinguishing_aspect: "Pledge lifecycle is cyclic (ACTIVE→CANCELLED→ACTIVE): a cancelled+lapsed pledge loops back to ACTIVE via reactivate — a non-linear shape on the Pledge entity."
        test_recipe:
          setup:
            - "Clock 2026-06-16. An ACTIVE PLUS pledge that is then cancelled (→CANCELLED+LAPSED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { display_name: "C CY", email: "ccy@x.com", payout_account_ref: "acct_cy", charge_timing: "UP_FRONT", billing_mode: "MONTHLY" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "PLUS", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "PCY", email: "pcy@x.com" }
              as: Patron
              captures: { p_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${p_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "GET /charges?pledge_id=${pl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /charges/${ch_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /pledges/${pl_id}/cancel"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /pledges/${pl_id}/reactivate"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { life: $.data.lifecycle_status, bill: $.data.billing_status }
          assert:
            - "Before trigger Pledge.${pl_id}.lifecycle_status == CANCELLED and billing_status == LAPSED"
            - "After reactivate Pledge.${pl_id}.lifecycle_status == ACTIVE and billing_status == CURRENT (cyclic re-entry)"

      # --- parallel: Pledge lifecycle axis vs billing axis evolve independently ---
      - name: nlsm_charge_branching_fork_join
        grounds:
          - state_machines.Charge.PENDING_to_SUCCEEDED
          - state_machines.Charge.PENDING_to_FAILED
          - entities.Charge.fields.status
        distinguishing_aspect: "The Charge machine (a different entity than the cyclic Pledge above) is branching fork-join: from PENDING the same trigger forks to SUCCEEDED vs FAILED with divergent side-effect sets — SUCCEEDED bumps Creator.pending_payout and activates the pledge, FAILED refunds wallet and advances billing_status — proving the divergent-branch non-linear shape on Charge."
        test_recipe:
          setup:
            - "Clock 2026-06-16. Two ACTIVE-pending PLUS pledges each with a PENDING INITIAL_PRORATION charge (gross 750)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { display_name: "C BR", email: "cbr@x.com", payout_account_ref: "acct_br", platform_plan: "STARTER", charge_timing: "UP_FRONT", billing_mode: "MONTHLY" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "PLUS", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "PS", email: "ps_br@x.com" }
              as: Patron
              captures: { ps_id: $.data.id }
            - call: "POST /patrons"
              payload: { display_name: "PF", email: "pf_br@x.com" }
              as: Patron
              captures: { pf_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${ps_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${ps_id}"
              captures: { pl_s_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${pf_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${pf_id}"
              captures: { pl_f_id: $.data.id }
            - call: "GET /charges?pledge_id=${pl_s_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ch_s_id: "$.data[0].id" }
            - call: "GET /charges?pledge_id=${pl_f_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ch_f_id: "$.data[0].id" }
          trigger:
            - call: "POST /charges/${ch_s_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /charges/${ch_f_id}/settle"
              payload: { outcome: "FAILED" }
              as: PlatformAdmin
            - call: "GET /pledges/${pl_s_id}"
              payload: {}
              as: PlatformAdmin
              captures: { life_s: $.data.lifecycle_status }
            - call: "GET /pledges/${pl_f_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bill_f: $.data.billing_status }
          assert:
            - "SUCCEEDED branch: Charge.${ch_s_id}.status == SUCCEEDED; Pledge.${pl_s_id}.lifecycle_status == ACTIVE; Creator.${c_id}.pending_payout_cents == 750"
            - "FAILED branch: Charge.${ch_f_id}.status == FAILED; Pledge.${pl_f_id}.lifecycle_status == DRAFT (not activated); Pledge.${pl_f_id}.billing_status == PAST_DUE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- depth >=3: run-cycle lapse cascade ---
      - name: tc_grace_lapse_cancel_cascade
        grounds:
          - state_machines.Pledge.GRACE_to_LAPSED
          - state_machines.Pledge.ACTIVE_to_CANCELLED
          - calculations.active_pledge_count
          - calculations.win_back_offer_expiry
        distinguishing_aspect: "Depth-3 chain from POST /_billing/run-cycle: (1) billing_status GRACE→LAPSED, which itself causes (2) lifecycle_status →CANCELLED, which itself causes (3) Tier.active_pledge_count decrement and a WinBackOffer auto-created — each link caused by the previous."
        test_recipe:
          setup:
            - "Clock 2026-06-01. ACTIVE PLUS pledge; a renewal charge fails twice → billing GRACE with grace_deadline 2026-06-08. Tier.active_pledge_count==1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { display_name: "C LAP", email: "clap@x.com", payout_account_ref: "acct_lap", charge_timing: "UP_FRONT", billing_mode: "MONTHLY" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "PLUS", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "PLAP", email: "plap@x.com" }
              as: Patron
              captures: { p_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${p_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
