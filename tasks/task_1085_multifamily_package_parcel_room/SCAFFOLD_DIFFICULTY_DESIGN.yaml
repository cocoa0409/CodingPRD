scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: locker_effective_vs_nominal_capacity
        grounds:
          - calculations.effective_locker_capacity
          - entities.LockerBank.fields.nominal_locker_count
          - entities.LockerBank.fields.available_locker_count
        distinguishing_aspect: "On LockerBank domain: nominal counts all 2 compartments while effective counts only the 1 AVAILABLE one after one is OCCUPIED, so the two variants diverge (2 vs 1)."
        test_recipe:
          setup:
            - "Property with a 2-compartment AMBIENT bank; one MEDIUM locker occupied by a notified package, one still AVAILABLE."
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Maple Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "A", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "MEDIUM", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker1_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "MEDIUM", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker2_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg1_id: $.data.id }
            - call: "POST /parcelroom/packages/${pkg1_id}/notify"
              payload: { storage_target: "LOCKER", locker_id: "${locker1_id}" }
              as: ConciergeStaff
          trigger:
            - call: "GET /parcelroom/locker-banks/${bank_id}"
              payload: {}
              as: PropertyManager
              captures: { nominal: $.data.nominal_locker_count, available: $.data.available_locker_count }
          assert:
            - "LockerBank.${bank_id}.nominal_locker_count == 2"
            - "LockerBank.${bank_id}.available_locker_count == 1"

      - name: holding_fee_provisional_vs_final
        grounds:
          - calculations.holding_fee
          - entities.Package.fields.provisional_fee_cents
          - entities.Package.fields.final_fee_cents
        distinguishing_aspect: "On Package domain: gross provisional_fee_cents=300 as of 2026-05-06 vs gross final_fee_cents=750 pinned at 2026-05-09 pickup — same package, the as-of-now variant and the frozen variant differ (the net 675 lands on the StorageCharge)."
        test_recipe:
          setup:
            - "Ambient package (loyalty 0.10) logged 2026-05-01, notified into a locker; clock advanced within the awaiting window."
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Maple Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com", loyalty_discount_pct: 0.10 }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "A", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "LARGE", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg_id: $.data.id }
            - call: "POST /parcelroom/packages/${pkg_id}/notify"
              payload: { storage_target: "LOCKER", locker_id: "${locker_id}" }
              as: ConciergeStaff
              captures: { code: $.data.pickup_code }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T00:00:00Z" }
              as: PropertyManager
            - call: "GET /parcelroom/packages/${pkg_id}"
              payload: {}
              as: ConciergeStaff
              captures: { prov: $.data.provisional_fee_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-09T00:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "POST /parcelroom/packages/${pkg_id}/pickup"
              payload: { pickup_code: "${code}" }
              as: ConciergeStaff
              captures: { fin: $.data.final_fee_cents }
          assert:
            - "Package.${pkg_id}.provisional_fee_cents observed at 2026-05-06 == 300"
            - "Package.${pkg_id}.final_fee_cents == 750"
            - "the resulting COLLECTED StorageCharge for Package.${pkg_id} has amount_cents == 675"
            - "Package.${pkg_id}.status == PICKED_UP"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: holding_fee_cap_min_max_nonlinear
        grounds:
          - calculations.holding_fee
          - entities.Package.fields.final_fee_cents
        distinguishing_aspect: "Mode (a): fee = min(cap, chargeable_days*daily*perishable_multiplier + oversize_surcharge) — three inputs with a conditional multiplier branch and a min-cap; COLD oversize at 16 chargeable days yields raw 5300 clamped to the 5000 cap."
        test_recipe:
          setup:
            - "COLD OVERSIZE package (loyalty 0), daily 150, multiplier 2, oversize 500, cap 5000; awaiting for 19 elapsed days then return-initiated."
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Cap Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "FDX", scac: "FDXN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "201", full_name: "Ben", email: "ben@x.com", loyalty_discount_pct: 0.0 }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "R", storage_class: "REFRIGERATED" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "OVERSIZE", storage_class: "REFRIGERATED" }
              as: PropertyManager
              captures: { locker_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-9", size_class: "OVERSIZE", storage_type: "COLD" }
              as: ConciergeStaff
              captures: { pkg_id: $.data.id }
            - call: "POST /parcelroom/packages/${pkg_id}/notify"
              payload: { storage_target: "LOCKER", locker_id: "${locker_id}" }
              as: ConciergeStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "POST /parcelroom/packages/${pkg_id}/return-initiate"
              payload: {}
              as: ConciergeStaff
              captures: { fin: $.data.final_fee_cents }
          assert:
            - "Package.${pkg_id}.final_fee_cents == 5000"
            - "Package.${pkg_id}.status == RETURN_INITIATED"

      - name: holding_fee_round_per_day_then_sum
        grounds:
          - calculations.holding_fee
          - entities.Package.fields.final_fee_cents
        distinguishing_aspect: "Mode (b): with daily 101 and multiplier 1.5 the per-day fee is 151.5; rounding each day first gives 4*152=608, whereas sum-then-round gives 606 — the scaffold pins round-per-day-then-sum, so final_fee_cents==608."
        test_recipe:
          setup:
            - "COLD package (loyalty 0), daily 101, multiplier 1.5, awaiting 7 elapsed days then picked up."
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Round Court", holding_fee_daily_cents: 101, perishable_fee_multiplier: 1.5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "301", full_name: "Cy", email: "cy@x.com", loyalty_discount_pct: 0.0 }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "R", storage_class: "REFRIGERATED" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "MEDIUM", storage_class: "REFRIGERATED" }
              as: PropertyManager
              captures: { locker_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-5", size_class: "MEDIUM", storage_type: "COLD" }
              as: ConciergeStaff
              captures: { pkg_id: $.data.id }
            - call: "POST /parcelroom/packages/${pkg_id}/notify"
              payload: { storage_target: "LOCKER", locker_id: "${locker_id}" }
              as: ConciergeStaff
              captures: { code: $.data.pickup_code }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-08T00:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "POST /parcelroom/packages/${pkg_id}/pickup"
              payload: { pickup_code: "${code}" }
              as: ConciergeStaff
              captures: { fin: $.data.final_fee_cents }
          assert:
            - "Package.${pkg_id}.final_fee_cents == 608"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: package_renotify_cyclic_reminder
        grounds:
          - state_machines.Package.AWAITING_PICKUP_to_AWAITING_PICKUP
          - entities.Package.fields.notify_count
          - entities.Package.fields.pickup_code
        distinguishing_aspect: "Package self-loop: a reminder keeps status AWAITING_PICKUP, increments notify_count to 2, reuses the same pickup_code, and appends a REMINDER Notification — a cyclic transition, not a linear step."
        test_recipe:
          setup:
            - "Package logged and notified once into a locker (AWAITING_PICKUP, notify_count 1)."
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Loop Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "A", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "LARGE", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg_id: $.data.id }
            - call: "POST /parcelroom/packages/${pkg_id}/notify"
              payload: { storage_target: "LOCKER", locker_id: "${locker_id}" }
              as: ConciergeStaff
              captures: { code1: $.data.pickup_code }
          trigger:
            - call: "POST /parcelroom/packages/${pkg_id}/notify"
              payload: {}
              as: ConciergeStaff
              captures: { code2: $.data.pickup_code, count: $.data.notify_count }
          assert:
            - "Package.${pkg_id}.status == AWAITING_PICKUP"
            - "Package.${pkg_id}.notify_count == 2"
            - "code2 == code1 (pickup_code unchanged across reminder)"

      - name: retail_return_branch_reject_vs_verify
        grounds:
          - state_machines.RetailReturn.DROPPED_OFF_to_REJECTED
          - state_machines.RetailReturn.DROPPED_OFF_to_AWAITING_CARRIER
          - entities.RetailReturn.fields.reject_reason
        distinguishing_aspect: "RetailReturn fork from DROPPED_OFF: the reject branch sets reject_reason and decrements staging, while the verify branch moves to AWAITING_CARRIER with no reject_reason — divergent side-effect sets on a different entity than the Package machine."
        test_recipe:
          setup:
            - "Two retail returns dropped off; one will be rejected, one verified."
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Return Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/retail-returns"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "RR-1" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { rr1_id: $.data.id }
            - call: "POST /parcelroom/retail-returns"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "RR-2" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { rr2_id: $.data.id }
            - call: "POST /parcelroom/retail-returns/${rr2_id}/verify-label"
              payload: {}
              as: ConciergeStaff
          trigger:
            - call: "POST /parcelroom/retail-returns/${rr1_id}/reject"
              payload: { reject_reason: "torn label" }
              as: ConciergeStaff
              captures: { st: $.data.status, reason: $.data.reject_reason }
          assert:
            - "RetailReturn.${rr1_id}.status == REJECTED"
            - "RetailReturn.${rr1_id}.reject_reason == 'torn label'"
            - "RetailReturn.${rr2_id}.status == AWAITING_CARRIER"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: pickup_release_recompute_posture_depth3
        grounds:
          - state_machines.Package.AWAITING_PICKUP_to_PICKED_UP
          - state_machines.Locker.OCCUPIED_to_AVAILABLE
          - calculations.property_occupancy_posture
          - entities.Property.fields.occupancy_posture
        distinguishing_aspect: "Depth-3 chain from pickup: Package->PICKED_UP causes Locker->AVAILABLE, which causes Property locker-count recompute, which flips Property.occupancy_posture RESTRICTED->OPEN."
        test_recipe:
          setup:
            - "Property threshold 0.5, 2 lockers, one occupied (posture RESTRICTED at utilization 0.5)."
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Cascade Court", overflow_threshold_pct: 0.5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "A", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "LARGE", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker1_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "LARGE", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker2_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg_id: $.data.id }
            - call: "POST /parcelroom/packages/${pkg_id}/notify"
              payload: { storage_target: "LOCKER", locker_id: "${locker1_id}" }
              as: ConciergeStaff
              captures: { code: $.data.pickup_code }
            - call: "GET /parcelroom/properties/${prop_id}"
              payload: {}
              as: PropertyManager
              captures: { posture_before: $.data.occupancy_posture }
          trigger:
            - call: "POST /parcelroom/packages/${pkg_id}/pickup"
              payload: { pickup_code: "${code}" }
              as: ConciergeStaff
          assert:
            - "posture_before == RESTRICTED"
            - "Property.${prop_id}.occupancy_posture == OPEN"
            - "Property.${prop_id}.occupied_locker_count == 0"
            - "Locker.${locker1_id}.status == AVAILABLE"

      - name: moveout_cascade_hold_and_notice_depth2
        grounds:
          - state_machines.Resident.ACTIVE_to_MOVED_OUT
          - state_machines.Package.AWAITING_PICKUP_to_HELD
          - entities.Notification.fields.kind
        distinguishing_aspect: "Depth-2 chain from a different trigger (pms MOVE_OUT): Resident->MOVED_OUT causes its AWAITING package->HELD, which causes a MOVE_OUT_HOLD Notification to be appended."
        test_recipe:
          setup:
            - "Resident ACTIVE with one AWAITING_PICKUP package in a locker."
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Move Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "A", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "LARGE", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg_id: $.data.id }
            - call: "POST /parcelroom/packages/${pkg_id}/notify"
              payload: { storage_target: "LOCKER", locker_id: "${locker_id}" }
              as: ConciergeStaff
          trigger:
            - call: "POST /parcelroom/residents/${res_id}/pms-sync"
              payload: { event_type: "MOVE_OUT" }
              as: PmsIntegration
          assert:
            - "Resident.${res_id}.status == MOVED_OUT"
            - "Package.${pkg_id}.status == HELD"
            - "GET /parcelroom/packages/${pkg_id}/notifications contains one Notification with kind == MOVE_OUT_HOLD"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: notify_referential_beats_safety
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_RESIDENT_NOT_ACTIVE]
        distinguishing_aspect: "business_referential (ERR_RESIDENT_NOT_ACTIVE, prio 6) outranks business_safety (ERR_STORAGE_FROZEN, prio 8): with a MOVED_OUT resident AND a FROZEN property, notify returns ERR_RESIDENT_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Property with a single locker occupied (posture FROZEN) by resident R1's first package; R1 then moved out; a second LOGGED package for R1 exists."
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Prio Court", overflow_threshold_pct: 0.85 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "A", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "LARGE", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg1_id: $.data.id }
            - call: "POST /parcelroom/packages/${pkg1_id}/notify"
              payload: { storage_target: "LOCKER", locker_id: "${locker_id}" }
              as: ConciergeStaff
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-2", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg2_id: $.data.id }
            - call: "POST /parcelroom/residents/${res_id}/pms-sync"
              payload: { event_type: "MOVE_OUT" }
              as: PmsIntegration
