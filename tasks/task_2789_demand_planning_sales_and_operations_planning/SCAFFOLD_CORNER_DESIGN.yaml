            - "The NONE filter returns ${plan_a} only, the CAPACITY filter ${plan_b} only and the MATERIAL filter ${plan_c} only"
            - "The status=STALE list returns total_count == 0 — status and constraint_type are independent filters over the same rows"
            - "${plan_value} == 2730000 == (1330 + 900 + 500) * 1000 and ${constrained_count} == 2 — the NONE plan is excluded from the constrained count but not from plan value"

      - name: scenario_evaluate_writes_only_the_scenario_and_leaves_cycle_money_untouched
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /sop/scenarios/{scenario_id}/evaluate]
          - calculations.calc_cycle_financials
          - state_machines.Scenario.DRAFT_to_EVALUATED
        distinguishing_aspect: |
          Evaluation is deliberately inert on the cycle: it writes all seven scenario money
          fields and moves DRAFT to EVALUATED, but calc_cycle_financials only counts SELECTED
          and EXECUTED scenarios, so selected_closure_cents, residual_gap_cents and even the
          cycle's version must be byte-identical before and after. An implementation that
          credits gap closure at evaluation time reports 812200 too early.
        test_recipe:
          setup:
            - "The base family, one MATURE item at service level 95.0 / cv 0.20 / lead time 30 (safety_stock 330) and one customer; a 9 h block inside 2026-09 (900 units)."
            - "A cycle over 2026-09..2026-09 with financial_commitment_cents 2000000, one locked 1000-unit forecast, one PLANNED plan (constrained 900, shortfall 430), advanced to SCENARIO_REVIEW."
            - "One DRAFT CAPACITY_INVESTMENT scenario for 5 added hours."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 9 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-INERT", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 2000000, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_id: $.data.id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/scenarios"
              payload: { cycle_id: "${cycle_id}", scenario_type: "CAPACITY_INVESTMENT", name: "Buy 5 hours", target_item_id: "${item_id}", added_capacity_hours: 5 }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { sc_id: $.data.id }
            - call: "GET /sop/planning-cycles/${cycle_id}"
              payload: {}
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { v_before: $.data.version, pv_before: $.data.plan_value_cents, gg_before: $.data.gross_gap_cents, sc_before: $.data.selected_closure_cents, rg_before: $.data.residual_gap_cents, posture_before: $.data.posture }
          trigger:
            - call: "POST /sop/scenarios/${sc_id}/evaluate"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { sc_status: $.data.status, inc: $.data.incremental_units, gross: $.data.gross_uplift_cents, inv: $.data.investment_cost_cents, pre: $.data.pre_trade_closure_cents, rate: $.data.trade_rate_pct, spend: $.data.trade_spend_cents, net: $.data.net_gap_closure_cents }
            - call: "GET /sop/planning-cycles/${cycle_id}"
              payload: {}
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { v_after: $.data.version, pv_after: $.data.plan_value_cents, gg_after: $.data.gross_gap_cents, sc_after: $.data.selected_closure_cents, rg_after: $.data.residual_gap_cents, posture_after: $.data.posture }
          assert:
            - "Before: ${pv_before} == 900000, ${gg_before} == 1100000, ${sc_before} == 0, ${rg_before} == 1100000 and ${posture_before} == \"AT_RISK\""
            - "The evaluate returns 200 with ${sc_status} == \"EVALUATED\", ${inc} == 430 == min(floor(5 * 100), 430), ${gross} == 430000, ${inv} == 125000, ${pre} == 305000, ${rate} == 4.0, ${spend} == 17200, ${net} == 287800"
            - "After: ${pv_after} == ${pv_before}, ${gg_after} == ${gg_before}, ${sc_after} == 0, ${rg_after} == 1100000 and ${posture_after} == \"AT_RISK\""
            - "${sc_after} is NOT 287800 and ${rg_after} is NOT 812200 — an EVALUATED scenario contributes nothing to calc_cycle_financials"
            - "${v_after} == ${v_before} — the evaluate did not write the PlanningCycle row at all"
            - "SupplyPlan.${plan_id}.status is still \"PLANNED\" with constrained_units 900: evaluation is a projection, not a replan"

  - section: errors
    instances:
      - name: unknown_id_reads_return_the_entity_specific_not_found_code
        claim_type: Violation to Error
        grounds:
          - errors.ERR_CAPACITY_BLOCK_NOT_FOUND
          - errors.ERR_FORECAST_NOT_FOUND
          - errors.ERR_ADJUSTMENT_NOT_FOUND
          - errors.ERR_ALLOCATION_NOT_FOUND
          - errors.ERR_SCENARIO_NOT_FOUND
          - errors.ERR_ACCURACY_RECORD_NOT_FOUND
          - validations[priority=40]
        distinguishing_aspect: |
          The catalog declares one 404 code PER entity type, so six single-row reads against six
          syntactically valid but unknown uuids must return six DIFFERENT error_id values at the
          same HTTP status. A single generic ERR_NOT_FOUND, or reusing the first entity's code
          everywhere, is wrong even though every response is a 404.
        test_recipe:
          setup:
            - "Completely empty database — no row of any type is ever created, so every path id is guaranteed unresolvable and no read can accidentally succeed."
          setup_api_calls: []
          trigger:
            - call: "GET /sop/capacity-blocks/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: SopAdmin
              captures: { e_block: $.data.error_id }
            - call: "GET /sop/demand-forecasts/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: SopAdmin
              captures: { e_forecast: $.data.error_id }
            - call: "GET /sop/consensus-adjustments/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: SopAdmin
              captures: { e_adjustment: $.data.error_id }
            - call: "GET /sop/allocations/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: SopAdmin
              captures: { e_allocation: $.data.error_id }
            - call: "GET /sop/scenarios/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: SopAdmin
              captures: { e_scenario: $.data.error_id }
            - call: "GET /sop/accuracy-records/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: SopAdmin
              captures: { e_record: $.data.error_id }
          assert:
            - "All six responses are HTTP 404 with ok == false and a null data payload apart from the error envelope"
            - "${e_block} == \"ERR_CAPACITY_BLOCK_NOT_FOUND\", ${e_forecast} == \"ERR_FORECAST_NOT_FOUND\", ${e_adjustment} == \"ERR_ADJUSTMENT_NOT_FOUND\""
            - "${e_allocation} == \"ERR_ALLOCATION_NOT_FOUND\", ${e_scenario} == \"ERR_SCENARIO_NOT_FOUND\", ${e_record} == \"ERR_ACCURACY_RECORD_NOT_FOUND\""
            - "The six values are pairwise distinct — no shared generic 404 code"
            - "The corresponding collection reads (GET /sop/capacity-blocks, /sop/scenarios, /sop/accuracy-records) all return 200 with total_count == 0, so an empty collection is never itself a 404"

      - name: scenario_status_guards_reject_second_evaluate_and_second_select
        claim_type: Violation to Error
        grounds:
          - errors.ERR_SCENARIO_NOT_EVALUATABLE
          - errors.ERR_SCENARIO_NOT_SELECTABLE
          - validations[priority=120]
          - state_machines.Scenario
        distinguishing_aspect: |
          Both scenario verbs are single-shot: evaluate is legal only from DRAFT and select only
          from EVALUATED, so repeating either one reports a DIFFERENT 409 code for the SAME
          scenario depending on where it now sits. The repeated select must also be inert — the
          cycle's selected_closure_cents may not be credited twice.
        test_recipe:
          setup:
            - "The base family, one MATURE item (service level 95.0 / cv 0.20 / lead time 30, safety_stock 330) and one customer; a 9 h capacity block inside 2026-09 (900 units)."
            - "A cycle over 2026-09..2026-09 with financial_commitment_cents 2000000, one locked 1000-unit forecast and one PLANNED plan (constrained 900, shortfall 430), advanced to SCENARIO_REVIEW."
            - "One CAPACITY_INVESTMENT scenario for 5 added hours, authored by supply-1."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
