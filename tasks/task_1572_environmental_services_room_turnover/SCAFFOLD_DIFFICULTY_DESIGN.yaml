              as: EVSAdministrator
              captures: { bi1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${bi1}", clean_type: "ISOLATION" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t1}" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${r1}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
          trigger:
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t2}" }
              as: EVSDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REQUEST_NOT_QUEUED (409): state priority 5 beats safety priority 6"
            - "CleanRequest.${r1}.status still IN_PROGRESS; assigned_staff_id still ${t1}"
            - "T2's certification gap (would-be ERR_STAFF_CERTIFICATION_MISMATCH) is never reported"

      - name: safety_error_beats_temporal_error_on_assign
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_STAFF_CERTIFICATION_MISMATCH]
          - errors[ERR_STAFF_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Category pair (business_safety, business_temporal) — distinct from
          the sibling's (state, business_safety): the request IS assignable,
          but the target staff both lacks ISO_CERT (safety) and would be
          double-booked inside the 10-minute buffer (temporal);
          ERR_STAFF_CERTIFICATION_MISMATCH must win (priority 6 before 7).
        test_recipe:
          setup:
