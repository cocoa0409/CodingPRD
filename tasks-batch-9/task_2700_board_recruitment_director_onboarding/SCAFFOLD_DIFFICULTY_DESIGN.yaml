            - "Candidate P and candidate Q both driven to SLATE_ELIGIBLE with clean screens, one COMPLETED interview each (score 4) and clean reference checks; conflict clearance is granted BEFORE any outside board is recorded."
            - "After clearance, candidate P is given ACTIVE ExternalDirectorship rows on 3 of the companies and candidate Q on all 4."
            - "A DRAFT slate for cycle 2026 with seat_count 9 and no fee budget cap."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z", min_completed_interviews: 1 }
