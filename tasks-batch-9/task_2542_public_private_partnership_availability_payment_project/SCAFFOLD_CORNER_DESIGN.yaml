      - name: adjacent_service_periods_do_not_overlap
        claim_type: temporal_validation
        grounds:
          - validations[priority=62]
          - errors[ERR_SERVICE_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: service_period_half_open_intervals_allow_exact_adjacency
          rationale: |
            Both halves of the overlap claim — adjacency at period_end == period_start is
            accepted, a one-day retreat is rejected — are asserted by that difficulty
            instance, which also pins the half-open semantics against the duplicate-index
            rule. A corner instance would repeat the same two calls.

      - name: two_relief_claims_of_one_type_need_a_clear_buffered_gap
        claim_type: temporal_validation
        grounds:
          - validations[priority=63]
          - errors[ERR_RELIEF_WINDOW_CONFLICT]
          - calculations.contractual_time_windows
        excluded_because:
          difficulty_instance: relief_claim_closed_windows_are_buffered_three_days_on_each_side_per_claim_type
          rationale: |
            The buffered-conflict claim (a 5-day gap conflicts, a 6-day gap clears, and a
            different claim_type never conflicts at all) is that instance's entire subject.
            The relief instances in the calculations section above already rely on the
            different-claim_type escape hatch, so the rule is exercised from both sides
            without a dedicated corner.

      - name: the_late_notification_answers_before_the_window_conflict
        claim_type: priority_conflict
        grounds:
          - validations[priority=55]
          - validations[priority=63]
          - errors[ERR_RELIEF_NOTIFICATION_LATE]
        excluded_because:
          difficulty_instance: relief_notification_deadline_beats_the_buffered_window_conflict
          rationale: |
            This exact pair (priority 55 versus 63 on a single claim that is both late and
            buffer-conflicting) is the priority_pair_validation_conflict depth probe, which
            additionally proves the ordering does not reverse when only one of the two
            conditions holds. Duplicating it would add no signal.

      - name: an_open_enforcement_answers_before_the_gain_test
        claim_type: priority_conflict
        grounds:
          - validations[priority=48]
          - validations[priority=76]
          - errors[ERR_CONCESSION_UNDER_ENFORCEMENT]
        excluded_because:
          difficulty_instance: open_enforcement_freeze_beats_the_no_gain_refinancing_check
          rationale: |
            The freeze-versus-fiscal-check ordering (priority 48 answering ahead of the
            no-gain rule at 76 on a proposal that violates both) is that difficulty
            instance's whole content, and it also shows the freeze lifting on CURED. A
            corner test would be a strict subset.

      - name: the_state_gate_answers_before_the_commitment_ceiling
        claim_type: priority_conflict
        grounds:
          - validations[priority=40]
          - validations[priority=68]
          - errors[ERR_INVALID_STATE_TRANSITION]
        excluded_because:
          difficulty_instance: state_beats_commitment_ceiling_on_a_second_milestone_approval
          rationale: |
            The pairing of the state gate at 40 with the commitment ceiling at 68 on a
            re-approval of an already-approved milestone is that instance verbatim. The
            aggregate side of rule 68 is covered here by
            individually_lawful_milestones_collectively_breach_the_debt_commitment, so the
            rule is not left untested.

  - section: endpoints
    instances:
      - name: the_payment_summary_publishes_both_cap_variants_side_by_side
        claim_type: computed_read
        grounds:
          - endpoints[GET /ppp/concessions/{id}/payment-summary]
          - calculations.period_deduction_cap_allocation
          - calculations.annual_deduction_cap_check
          - calculations.persistent_breach_evaluation
        distinguishing_aspect: |
          The only endpoint whose output is not a §1.1 entity, so nothing may be captured
          from it — every figure has to be asserted in place. It is also the only view where
          the SEQUENTIAL and PRO_RATA totals appear together: with raws 500000/750000/625000
          against a 1720833 cap the two variants allocate differently per event yet both sum
          to the cap, so the summary must show 1720833 twice while the per-event rows differ.
          The derived read must write nothing.
        test_recipe:
          setup:
            - "The base chain with ServicePeriod 1 verified at (100, 2, 4): gross 8604167, deduction_cap_cents 1720833."
            - "Three events issued by officer-alpha: 400 points (raw 500000), 600 points (raw 750000), 500 points (raw 625000). Raw total 1875000 exceeds the cap."
            - "SEQUENTIAL_CAP -> 500000 / 750000 / 470833 ; PRO_RATA_CAP -> 458888 / 688334 / 573611 ; both sum to 1720833."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
