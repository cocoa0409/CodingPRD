            - "${sd_counts}.MATH == 1 and ${sd_remaining}.MATH == 2 — only the SCORED attempt did"
            - "${err_parent_closed} == \"ERR_ADMINISTRATION_NOT_BOOKABLE\" with HTTP 409 — the same parent-state dependency on a different endpoint and a different error_id"

      - name: registration_confirm_gated_by_determination_evidence_and_placement_axes
        entity_pair: "Registration depends on PlacementDetermination (a different aggregate, reached through Section -> Course -> subject_area)"
        grounds:
          - validations[priority=9].ERR_PLACEMENT_NOT_ACTIONABLE
          - endpoints[POST /placement-determinations/{determination_id}/evidence]
          - endpoints[POST /registrations/{registration_id}/confirm]
        distinguishing_aspect: |
          A different entity pair, and one that crosses an aggregate boundary the
          URL never mentions: confirming a Registration depends on a
          PlacementDetermination found by walking Section -> Course -> subject_area
          for the same student. BOTH of the determination's independent axes gate the
          confirm — a DISPUTED evidence_state and a SUPERSEDED placement_state each
          block it with the same error — while POST /registrations itself is
          indifferent to either, so a seat can be held that can never be confirmed.
          The dependency is re-derived on every confirm, not cached at hold time.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Course MATH-050 (MATH, level_rank 50, units 5.0) with no requisite edges, so the closure returns SATISFIED for everyone."
            - "One ACTIVE PlacementRule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0, V1)."
            - "Student SG: hs_gpa 2.50, hs_transcript_status VERIFIED, transcript_recorded_at 2025-06-01T00:00:00Z, determination DET_G placing MATH-050."
            - "DET_G's evidence_state is driven UNVERIFIED -> DISPUTED BEFORE any registration exists, so the evidence cascade has nothing to deny and the observation is clean."
            - "Section sec050 of MATH-050, seat_capacity 5, OPEN, UNPAIRED — seats and units are never the binding constraint."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule: $.data.id }
            - call: "POST /placement-rules/${rule}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /sections"
              payload: { course_id: "${c_050}", term_code: "2026FA", room_code: "R901", meets_start_at: "2026-09-01T17:00:00Z", meets_end_at: "2026-09-01T18:00:00Z", seat_capacity: 5 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sec: $.data.id }
            - call: "POST /sections/${sec}/status"
              payload: { target_status: "OPEN" }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /students"
              payload: { student_number: "SG", full_name: "Student G", race_ethnicity_code: "HISPANIC", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sg: $.data.id, sg_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sg}", subject_area: "MATH", expected_student_version: "${sg_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det_g: $.data.id, det_g_place: $.data.placement_state, det_g_ev: $.data.evidence_state }
            - call: "POST /placement-determinations/${det_g}/evidence"
              payload: { target_evidence_state: "DISPUTED", note: "Transcript authenticity under review." }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det_g_ev_disputed: $.data.evidence_state, det_g_place_still: $.data.placement_state }
            - call: "GET /sections/${sec}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sec_v1: $.data.version }
          trigger:
            - call: "POST /registrations"
              payload: { student_id: "${sg}", section_id: "${sec}", expected_section_version: "${sec_v1}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg_g: $.data.id, reg_g_state: $.data.state, reg_g_prereq: $.data.prerequisite_status }
            - call: "POST /registrations/${reg_g}/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { err_evidence: $.data.error_id }
            - call: "POST /placement-determinations/${det_g}/evidence"
              payload: { target_evidence_state: "VERIFIED", note: "Transcript authenticated by the sending district." }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det_g_ev_ok: $.data.evidence_state }
            - call: "POST /registrations/${reg_g}/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg_g_confirmed: $.data.state, reg_g_units: $.data.term_units_at_confirm }
            - call: "POST /registrations/${reg_g}/drop"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg_g_dropped: $.data.state }
            - call: "GET /students/${sg}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sg_v2: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sg}", subject_area: "MATH", expected_student_version: "${sg_v2}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det_g2: $.data.id }
            - call: "GET /placement-determinations/${det_g}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det_g_superseded: $.data.placement_state, det_g_by: $.data.superseded_by_id }
            - call: "GET /sections/${sec}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sec_v2: $.data.version }
            - call: "POST /registrations"
              payload: { student_id: "${sg}", section_id: "${sec}", expected_section_version: "${sec_v2}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg_g2: $.data.id }
            - call: "POST /registrations/${reg_g2}/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg_g2_state: $.data.state }
          assert:
            - "${det_g_place} == \"PROVISIONAL\" and ${det_g_ev} == \"UNVERIFIED\" (setup)"
            - "${det_g_ev_disputed} == \"DISPUTED\" and ${det_g_place_still} == \"PROVISIONAL\" — the evidence axis moved alone (setup)"
            - "${reg_g_state} == \"PENDING\" and ${reg_g_prereq} == \"SATISFIED\" — POST /registrations does NOT consult the determination, so the hold succeeds"
            - "${err_evidence} == \"ERR_PLACEMENT_NOT_ACTIONABLE\" with HTTP 409 — priority 9 blocks the confirm on the evidence axis alone"
            - "${det_g_ev_ok} == \"VERIFIED\" and ${reg_g_confirmed} == \"ENROLLED\" and ${reg_g_units} == 5.0 — the SAME held row confirms once the dependency clears, proving the gate is re-derived per request"
            - "${reg_g_dropped} == \"DROPPED\" and ${det_g_superseded} == \"SUPERSEDED\" and ${det_g_by} == \"${det_g2}\""
            - "${reg_g2_state} == \"ENROLLED\" — the NEW determination governs, so the confirm passes on the placement axis"
            - "confirming against a SUPERSEDED determination is unreachable through this student because the governing lookup follows subject_area, which is exactly the point: the dependency is resolved by query, never by a stored determination_id on Registration"

      - name: study_run_gated_by_candidate_rule_remaining_draft
        entity_pair: "CutScoreValidationStudy depends on PlacementRule"
        grounds:
          - validations[priority=9].ERR_CANDIDATE_RULE_NOT_DRAFT
          - endpoints[POST /validation-studies/{study_id}/run]
          - endpoints[POST /placement-rules/{rule_id}/activate]
        distinguishing_aspect: |
          A third entity pair with an inverted polarity that is easy to get
          backwards: the study requires its candidate rule to still be DRAFT, so
          ACTIVATING the rule BREAKS the study rather than enabling it. The study's
          own state is a perfectly runnable DRAFT and its window has closed, yet the
          run is refused. Retiring the rule does not repair it either — the retire
          cascades the study to WITHDRAWN, after which the SAME request fails one
          rung higher, at priority 8, which pins the two gates in the right order.
          The cleared-gate leg then proves the dependency sits at priority 9 by
          showing the request advance past it to the priority 27 cohort check.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z, which is after both study windows close."
            - "Course MATH-100 (MATH, level_rank 100, units 4.0), ACTIVE."
            - "Candidate rule RA: DRAFT TEST_SCORE -> MATH-100 with min_score 500, V2."
            - "Candidate rule RB: DRAFT TEST_SCORE -> MATH-100 with min_score 550, V3."
            - "Study SA proposed on RA over 2026-01-01T00:00:00Z-2026-06-01T00:00:00Z, then RA is activated directly, breaking the dependency."
            - "Study SB proposed on RB over the same closed window; RB is left DRAFT."
            - "No graded Registration exists for MATH-100, so the strict cohort is empty for both studies."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TEST_SCORE", target_course_id: "${c_100}", priority_rank: 10, min_score: 500, effective_from: "2026-07-01T00:00:00Z", version_label: "V2" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { ra: $.data.id, ra_status: $.data.status }
            - call: "POST /validation-studies"
              payload: { subject_area: "MATH", candidate_rule_id: "${ra}", window_start_at: "2026-01-01T00:00:00Z", window_end_at: "2026-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sa: $.data.id, sa_state: $.data.state, sa_runs: $.data.run_count }
            - call: "POST /placement-rules/${ra}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { ra_active: $.data.status, ra_activated_at: $.data.activated_at }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TEST_SCORE", target_course_id: "${c_100}", priority_rank: 20, min_score: 550, effective_from: "2026-07-01T00:00:00Z", version_label: "V3" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rb: $.data.id, rb_status: $.data.status }
            - call: "POST /validation-studies"
              payload: { subject_area: "MATH", candidate_rule_id: "${rb}", window_start_at: "2026-01-01T00:00:00Z", window_end_at: "2026-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sb: $.data.id, sb_state: $.data.state }
          trigger:
            - call: "POST /validation-studies/${sa}/run"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_rule_active: $.data.error_id }
            - call: "GET /validation-studies/${sa}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sa_state_after: $.data.state, sa_runs_after: $.data.run_count, sa_strict: $.data.strict_cohort_size }
            - call: "POST /placement-rules/${ra}/retire"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { ra_retired: $.data.status }
            - call: "GET /validation-studies/${sa}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sa_state_retired: $.data.state, sa_runs_retired: $.data.run_count }
            - call: "POST /validation-studies/${sa}/run"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_rule_retired: $.data.error_id }
            - call: "POST /validation-studies/${sb}/run"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_cohort: $.data.error_id }
            - call: "GET /placement-rules/${rb}"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rb_status_after: $.data.status }
          assert:
            - "${ra_status} == \"DRAFT\" and ${sa_state} == \"DRAFT\" and ${sa_runs} == 0 (setup)"
            - "${ra_active} == \"ACTIVE\" and ${ra_activated_at} == \"2026-08-01T00:00:00Z\" (setup)"
            - "${err_rule_active} == \"ERR_CANDIDATE_RULE_NOT_DRAFT\" with HTTP 409 — activating the rule BROKE the study; the polarity is the trap"
            - "${sa_state_after} == \"DRAFT\" and ${sa_runs_after} == 0 and ${sa_strict} == null — the refused run neither advanced the state machine nor incremented run_count"
            - "${ra_retired} == \"RETIRED\" and ${sa_state_retired} == \"WITHDRAWN\" and ${sa_runs_retired} == 0 — retiring the candidate does not repair the dependency, it TERMINATES the dependent study by cascade"
            - "${err_rule_retired} == \"ERR_INVALID_STATE\" with HTTP 409 — the failure mode escalates: the study is no longer runnable from WITHDRAWN, so priority 8 now answers ahead of the priority 9 candidate-rule check"
            - "${rb_status_after} == \"DRAFT\" and ${err_cohort} == \"ERR_STUDY_COHORT_EMPTY\" with HTTP 422 — with the dependency satisfied the request advances past priority 9 and fails at priority 27, which is what locates the gate in the ordered list"
            - "${err_cohort} != \"ERR_CANDIDATE_RULE_NOT_DRAFT\" — a DRAFT candidate must never trip the priority 9 check"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: exam_room_turnaround_buffer_of_exactly_thirty_minutes_is_allowed
        resource: "the physical exam room, keyed by TestAdministration.room_code"
        interval_semantics: "symmetric pairwise overlap widened by a MANDATORY ROOM_TURNAROUND_MINUTES = 30 buffer on BOTH sides; a gap of exactly 30 minutes is allowed, 29 is not; CANCELLED sessions leave the resource entirely"
        grounds:
          - validations[priority=17].ERR_ROOM_TIME_CONFLICT
          - endpoints[POST /test-administrations]
        distinguishing_aspect: |
          The buffer makes non-overlapping windows conflict, which is the opposite
          of the usual half-open intuition, and it is symmetric: a candidate ending
          29 minutes BEFORE an existing session is just as illegal as one starting
          29 minutes after it ends. Both boundaries are probed at one-minute
          resolution. Finally, cancelling the incumbent frees the room for a
          candidate occupying its EXACT window, proving the conflict set is
          filtered by status and not merely by geometry.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z; all sessions are scheduled well in the future, so no window precondition participates."
            - "Incumbent A1: room T05, proctor-4, 2026-08-20T09:00:00Z-11:00:00Z, seat_capacity 5, SCHEDULED."
            - "Every candidate uses a DIFFERENT proctor_user_id so the priority 19 daily cap (480 minutes) never participates; every candidate is 120 minutes or less."
          setup_api_calls:
            - call: "POST /test-administrations"
              payload: { room_code: "T05", subject_area: "MATH", proctor_user_id: "proctor-4", starts_at: "2026-08-20T09:00:00Z", ends_at: "2026-08-20T11:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { a1: $.data.id, a1_minutes: $.data.duration_minutes }
          trigger:
            - call: "POST /test-administrations"
              payload: { room_code: "T05", subject_area: "MATH", proctor_user_id: "proctor-5", starts_at: "2026-08-20T11:29:00Z", ends_at: "2026-08-20T13:29:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_after_29: $.data.error_id }
            - call: "POST /test-administrations"
              payload: { room_code: "T05", subject_area: "MATH", proctor_user_id: "proctor-5", starts_at: "2026-08-20T11:30:00Z", ends_at: "2026-08-20T13:30:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { a2: $.data.id, a2_status: $.data.status }
            - call: "POST /test-administrations"
              payload: { room_code: "T05", subject_area: "MATH", proctor_user_id: "proctor-6", starts_at: "2026-08-20T08:29:00Z", ends_at: "2026-08-20T08:59:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_before_1: $.data.error_id }
            - call: "POST /test-administrations"
              payload: { room_code: "T05", subject_area: "MATH", proctor_user_id: "proctor-6", starts_at: "2026-08-20T08:00:00Z", ends_at: "2026-08-20T08:30:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { a3: $.data.id, a3_minutes: $.data.duration_minutes }
            - call: "POST /test-administrations/${a1}/status"
              payload: { target_status: "CANCELLED" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { a1_cancelled: $.data.status }
            - call: "POST /test-administrations"
              payload: { room_code: "T05", subject_area: "MATH", proctor_user_id: "proctor-7", starts_at: "2026-08-20T09:00:00Z", ends_at: "2026-08-20T11:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { a4: $.data.id, a4_status: $.data.status }
            - call: "GET /test-administrations"
              payload: { room_code: "T05" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { room_first_id: "$.data[0].id" }
          assert:
            - "${a1_minutes} == 120 (setup)"
            - "GAP 29 MINUTES AFTER: ${err_after_29} == \"ERR_ROOM_TIME_CONFLICT\" with HTTP 409, even though 11:29 > 11:00 and the windows do not overlap at all"
            - "GAP EXACTLY 30 MINUTES AFTER: ${a2_status} == \"SCHEDULED\" — the boundary is inclusive of the buffer"
            - "GAP 1 MINUTE BEFORE: ${err_before_1} == \"ERR_ROOM_TIME_CONFLICT\" with HTTP 409 — the buffer is symmetric; an implementation that only guards the forward direction accepts this and fails"
            - "GAP EXACTLY 30 MINUTES BEFORE: ${a3_minutes} == 30 — accepted, since A1 starts at 09:00 and this candidate ends at 08:30"
            - "${a1_cancelled} == \"CANCELLED\" and ${a4_status} == \"SCHEDULED\" — A4 occupies A1's EXACT window, so status filtering, not geometry, is what admits it"
            - "GET /test-administrations?room_code=T05 reports total_count 4 and ${room_first_id} is one of the four persisted ids — A1 (CANCELLED), A2, A3 and A4; neither rejected candidate was persisted"

      - name: paired_section_meeting_blocks_may_be_exactly_adjacent
        resource: "the student's class hour, expressed as the meeting block of a Section pair (a Section-to-Section constraint, not a room or a person)"
        interval_semantics: "HALF-OPEN and ZERO-BUFFER: conflict iff primary.meets_start_at < support.meets_end_at AND support.meets_start_at < primary.meets_end_at; back-to-back blocks touching at a single instant are ALLOWED"
        grounds:
          - validations[priority=18].ERR_COREQ_TIME_CONFLICT
          - validations[priority=15].ERR_COREQ_SECTION_MISMATCH
          - endpoints[POST /sections/{section_id}/pair]
        distinguishing_aspect: |
          A different resource and the OPPOSITE interval convention from the exam
          room: zero buffer and half-open, so a one-minute overlap is fatal while
          exact adjacency is fine — the same 18:00 instant that the room rule would
          reject is the accepted case here. The instance also fixes the check order
          against the referential rule at priority 15: a candidate that is both the
          wrong kind of course AND time-overlapping must report the mismatch, never
          the time conflict.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Courses MATH-100 (MATH, level_rank 100, units 4.0, is_support_course false) and MATH-100S (MATH, level_rank 100, units 2.0, is_support_course true)."
            - "ACTIVE COREQUISITE CourseRequisite MATH-100 -> MATH-100S; there is NO requisite edge from MATH-100 to itself."
            - "secP: MATH-100, term 2026FA, room R801, 2026-09-01T17:00:00Z-18:00:00Z, seat_capacity 20, PLANNED."
            - "secW: MATH-100 (a SECOND primary section, not a support course), term 2026FA, room R804, 2026-09-01T17:59:00Z-18:59:00Z — both mismatched AND overlapping."
            - "secS1: MATH-100S, term 2026FA, room R802, 2026-09-01T17:59:00Z-18:59:00Z — a ONE-MINUTE overlap with secP."
            - "secS2: MATH-100S, term 2026FA, room R803, 2026-09-01T18:00:00Z-19:00:00Z — EXACTLY adjacent to secP."
            - "All sections stay PLANNED; pairing precedes opening, which is what the priority-18 check is for."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "MATH-100S", title: "Algebra Support", subject_area: "MATH", level_rank: 100, units: 2.0, is_support_course: true, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100s: $.data.id }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_100}", requisite_course_id: "${c_100s}", requisite_type: "COREQUISITE" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { coreq_edge: $.data.id, coreq_status: $.data.status }
            - call: "POST /sections"
              payload: { course_id: "${c_100}", term_code: "2026FA", room_code: "R801", meets_start_at: "2026-09-01T17:00:00Z", meets_end_at: "2026-09-01T18:00:00Z", seat_capacity: 20 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secp: $.data.id, secp_pairing: $.data.pairing_state, secp_role: $.data.role_in_pair }
            - call: "POST /sections"
              payload: { course_id: "${c_100}", term_code: "2026FA", room_code: "R804", meets_start_at: "2026-09-01T17:59:00Z", meets_end_at: "2026-09-01T18:59:00Z", seat_capacity: 20 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secw: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${c_100s}", term_code: "2026FA", room_code: "R802", meets_start_at: "2026-09-01T17:59:00Z", meets_end_at: "2026-09-01T18:59:00Z", seat_capacity: 20 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secs1: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${c_100s}", term_code: "2026FA", room_code: "R803", meets_start_at: "2026-09-01T18:00:00Z", meets_end_at: "2026-09-01T19:00:00Z", seat_capacity: 20 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secs2: $.data.id }
          trigger:
            - call: "POST /sections/${secp}/pair"
              payload: { support_section_id: "${secw}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { err_order: $.data.error_id }
            - call: "POST /sections/${secp}/pair"
              payload: { support_section_id: "${secs1}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { err_one_minute: $.data.error_id }
            - call: "GET /sections/${secp}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secp_pairing_after_fail: $.data.pairing_state, secp_link_after_fail: $.data.linked_section_id }
            - call: "POST /sections/${secp}/pair"
              payload: { support_section_id: "${secs2}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secp_paired: $.data.pairing_state, secp_role_paired: $.data.role_in_pair, secp_link: $.data.linked_section_id, secp_avail: $.data.available_seats }
            - call: "GET /sections/${secs2}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secs2_pairing: $.data.pairing_state, secs2_role: $.data.role_in_pair, secs2_link: $.data.linked_section_id }
          assert:
            - "${coreq_status} == \"ACTIVE\" and ${secp_pairing} == \"UNPAIRED\" and ${secp_role} == \"NONE\" (setup)"
            - "CHECK ORDER: ${err_order} == \"ERR_COREQ_SECTION_MISMATCH\" with HTTP 422 — secW is BOTH a non-support course AND overlapping, and priority 15 precedes priority 18"
            - "${err_order} != \"ERR_COREQ_TIME_CONFLICT\" — reporting the temporal error here is the ordering failure this instance detects"
            - "ONE MINUTE OF OVERLAP: ${err_one_minute} == \"ERR_COREQ_TIME_CONFLICT\" with HTTP 409 — 17:00 < 18:59 AND 17:59 < 18:00"
            - "${secp_pairing_after_fail} == \"UNPAIRED\" and ${secp_link_after_fail} == null — neither rejected pair wrote a half-link"
            - "EXACT ADJACENCY: ${secp_paired} == \"PAIRED\", ${secp_role_paired} == \"PRIMARY\", ${secp_link} == \"${secs2}\" — 17:59 < 19:00 holds but 18:00 < 18:00 does NOT, so there is no conflict"
            - "${secs2_pairing} == \"PAIRED\", ${secs2_role} == \"SUPPORT\", ${secs2_link} == \"${secp}\" — the link is written on BOTH halves"
            - "${secp_avail} == 20 — pairing switches the reader to calculations.section_available_seats variant paired_conservative: min(20 - 0 - 0, 20 - 0 - 0)"
            - "a closed-interval implementation (start <= end on both sides) rejects the adjacency and fails; the exam-room rule in the same scaffold uses the opposite convention, so a single shared overlap helper cannot satisfy both"

      - name: proctor_daily_minutes_clipped_at_each_utc_midnight
        resource: "the proctor as a person, keyed by TestAdministration.proctor_user_id"
        interval_semantics: "per-UTC-calendar-day AGGREGATE rather than pairwise: each session's minutes are CLIPPED to the day boundaries, so a session spanning midnight contributes to BOTH days; the cap of 480 minutes is INCLUSIVE"
        grounds:
          - validations[priority=19].ERR_PROCTOR_DAILY_CAP_EXCEEDED
          - endpoints[POST /test-administrations]
        distinguishing_aspect: |
          A third resource under a third convention: not pairwise geometry at all
          but a per-day sum, and the discriminating detail is the clipping of a
          midnight-spanning session. A 240-minute session running 22:00 to 02:00
          must contribute 120 minutes to the earlier day AND 120 to the later one.
          The instance pins both halves at once: a 360-minute candidate is accepted
          on each day (reaching exactly 480), and a one-minute candidate is then
          refused. An implementation that charges the whole 240 minutes to the start
          day accepts the wrong pair of calls in both directions.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Session P1: room T07, proctor-8, 2026-08-25T22:00:00Z-2026-08-26T02:00:00Z, seat_capacity 5, SCHEDULED. duration_minutes 240, clipped to 120 on 2026-08-25 and 120 on 2026-08-26."
            - "proctor-8 has no other session; every candidate uses a room distinct from T07 and from every accepted candidate, so priority 17 never participates."
          setup_api_calls:
            - call: "POST /test-administrations"
              payload: { room_code: "T07", subject_area: "MATH", proctor_user_id: "proctor-8", starts_at: "2026-08-25T22:00:00Z", ends_at: "2026-08-26T02:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { p1: $.data.id, p1_minutes: $.data.duration_minutes, p1_status: $.data.status }
          trigger:
            - call: "POST /test-administrations"
              payload: { room_code: "T08", subject_area: "MATH", proctor_user_id: "proctor-8", starts_at: "2026-08-25T09:00:00Z", ends_at: "2026-08-25T17:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_day1_over: $.data.error_id }
            - call: "POST /test-administrations"
              payload: { room_code: "T08", subject_area: "MATH", proctor_user_id: "proctor-8", starts_at: "2026-08-25T09:00:00Z", ends_at: "2026-08-25T15:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { p3: $.data.id, p3_minutes: $.data.duration_minutes }
            - call: "POST /test-administrations"
              payload: { room_code: "T09", subject_area: "MATH", proctor_user_id: "proctor-8", starts_at: "2026-08-26T09:00:00Z", ends_at: "2026-08-26T15:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { p4: $.data.id, p4_minutes: $.data.duration_minutes }
            - call: "POST /test-administrations"
              payload: { room_code: "T10", subject_area: "MATH", proctor_user_id: "proctor-8", starts_at: "2026-08-26T16:00:00Z", ends_at: "2026-08-26T16:01:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_day2_over: $.data.error_id }
            - call: "POST /test-administrations"
              payload: { room_code: "T11", subject_area: "MATH", proctor_user_id: "proctor-12", starts_at: "2026-08-26T16:00:00Z", ends_at: "2026-08-26T16:01:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { p6: $.data.id, p6_minutes: $.data.duration_minutes }
            - call: "GET /test-administrations"
              payload: { proctor_user_id: "proctor-8" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { p8_first_room: "$.data[0].room_code" }
          assert:
            - "${p1_minutes} == 240 and ${p1_status} == \"SCHEDULED\" (setup)"
            - "EARLIER DAY OVER CAP: ${err_day1_over} == \"ERR_PROCTOR_DAILY_CAP_EXCEEDED\" with HTTP 409 — 2026-08-25 would reach 120 + 480 = 600 minutes"
            - "EARLIER DAY AT CAP: ${p3_minutes} == 360 — accepted, because 120 + 360 == 480 exactly and the cap is INCLUSIVE"
            - "LATER DAY AT CAP: ${p4_minutes} == 360 — accepted, and this is the clipping proof: 2026-08-26 already carried 120 minutes from a session that STARTED on 2026-08-25, so only 360 remained"
            - "LATER DAY OVER CAP BY ONE MINUTE: ${err_day2_over} == \"ERR_PROCTOR_DAILY_CAP_EXCEEDED\" with HTTP 409 — 480 + 1 exceeds the cap"
            - "${p6_minutes} == 1 — the identical window for a DIFFERENT proctor is accepted, so the cap is per-proctor and not global or per-room"
            - "GET /test-administrations?proctor_user_id=proctor-8 reports total_count 3 — P1, P3 and P4 only — and ${p8_first_room} is one of T07, T08 or T09; neither rejected candidate was persisted"
            - "an implementation that charges all 240 minutes of P1 to 2026-08-25 computes 240 + 360 = 600 and rejects P3, and computes 0 + 360 + 1 = 361 and accepts the final call: both observations flip"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: section_seat_ledger_returns_to_pre_confirm_values_after_drop
        conserved_quantity: "seat_ledger(S) = S.seats_taken + S.seats_held + S.waitlist_count + count(DENIED or DROPPED rows), which must always equal the total number of Registration rows for S, with S.seats_taken <= S.seat_capacity"
        grounds:
          - calculations.section_seat_ledger_invariant
          - endpoints[POST /registrations/{registration_id}/drop]
          - calculations.section_available_seats
        distinguishing_aspect: |
          The compensation is not a rollback: dropping the enrolled student frees a
          seat that the drop's own HOP 3 immediately hands to the waitlisted student.
          seats_taken therefore returns to EXACTLY its pre-drop value of 1 while the
          OCCUPANT changes, and the ledger identity holds across the whole sequence
          even though rows have moved into terminal states. Double-counting the freed
          seat (leaving seats_taken at 0 after promoting, or at 2 after promoting
          without releasing) breaks INVARIANT 1 immediately.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Course MATH-050 (MATH, level_rank 50, units 5.0) with NO requisite edges, so the closure returns SATISFIED and no override is involved."
            - "One ACTIVE PlacementRule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0, V1)."
            - "Section secX of MATH-050, term 2026FA, seat_capacity 1, OPEN, UNPAIRED — so calculations.section_available_seats uses variant committed_only."
            - "Students SA1 and SA2, hs_gpa 2.50 VERIFIED, transcript_recorded_at 2025-06-01T00:00:00Z, each with a determination placing MATH-050."
            - "SA1 confirms into the single seat; SA2 confirms and lands on the waitlist."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule: $.data.id }
            - call: "POST /placement-rules/${rule}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /sections"
              payload: { course_id: "${c_050}", term_code: "2026FA", room_code: "R950", meets_start_at: "2026-09-01T17:00:00Z", meets_end_at: "2026-09-01T18:00:00Z", seat_capacity: 1 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secx: $.data.id }
            - call: "POST /sections/${secx}/status"
              payload: { target_status: "OPEN" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secx_status: $.data.status, secx_v0: $.data.version }
            - call: "POST /students"
              payload: { student_number: "SA1", full_name: "Student A One", race_ethnicity_code: "BLACK", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sa1: $.data.id, sa1_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sa1}", subject_area: "MATH", expected_student_version: "${sa1_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det_a1: $.data.id }
            - call: "POST /students"
              payload: { student_number: "SA2", full_name: "Student A Two", race_ethnicity_code: "BLACK", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sa2: $.data.id, sa2_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sa2}", subject_area: "MATH", expected_student_version: "${sa2_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det_a2: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${sa1}", section_id: "${secx}", expected_section_version: "${secx_v0}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg1: $.data.id, reg1_state: $.data.state }
            - call: "POST /registrations/${reg1}/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg1_confirmed: $.data.state }
            - call: "GET /sections/${secx}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secx_v1: $.data.version, taken_1: $.data.seats_taken, held_1: $.data.seats_held, wait_1: $.data.waitlist_count, avail_1: $.data.available_seats }
            - call: "POST /registrations"
              payload: { student_id: "${sa2}", section_id: "${secx}", expected_section_version: "${secx_v1}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg2: $.data.id }
            - call: "POST /registrations/${reg2}/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg2_confirmed: $.data.state }
            - call: "GET /sections/${secx}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { taken_2: $.data.seats_taken, held_2: $.data.seats_held, wait_2: $.data.waitlist_count, avail_2: $.data.available_seats }
          trigger:
            - call: "POST /registrations/${reg1}/drop"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg1_dropped: $.data.state }
            - call: "GET /registrations/${reg2}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg2_after: $.data.state, reg2_units: $.data.term_units_at_confirm }
            - call: "GET /sections/${secx}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { taken_3: $.data.seats_taken, held_3: $.data.seats_held, wait_3: $.data.waitlist_count, avail_3: $.data.available_seats }
            - call: "GET /sections/${secx}/registrations"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { row_first_state: "$.data[0].state" }
            - call: "POST /registrations/${reg2}/drop"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg2_dropped: $.data.state }
            - call: "GET /sections/${secx}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { taken_4: $.data.seats_taken, held_4: $.data.seats_held, wait_4: $.data.waitlist_count, avail_4: $.data.available_seats }
          assert:
            - "${secx_status} == \"OPEN\" and ${reg1_state} == \"PENDING\" and ${reg1_confirmed} == \"ENROLLED\" (setup)"
            - "AFTER THE FIRST CONFIRM: ${taken_1} == 1, ${held_1} == 0, ${wait_1} == 0, ${avail_1} == 0 — committed_only gives max(0, 1 - 1)"
            - "AFTER THE SECOND CONFIRM: ${reg2_confirmed} == \"WAITLISTED\", ${taken_2} == 1, ${held_2} == 0, ${wait_2} == 1, ${avail_2} == 0 — priority 30 routes to the waitlist rather than erroring, because waitlist_count < 10"
            - "LEDGER BEFORE THE DROP: 1 + 0 + 1 + 0 == 2 == the number of Registration rows for secX"
            - "${reg1_dropped} == \"DROPPED\" and ${reg2_after} == \"ENROLLED\" and ${reg2_units} == 5.0 — HOP 3 promoted the waitlisted row within the same request"
            - "COMPENSATION: ${taken_3} == 1 and ${held_3} == 0 — seats_taken returns to EXACTLY its pre-drop value even though the occupant changed, and ${wait_3} == 0, ${avail_3} == 0"
            - "LEDGER AFTER THE DROP: ${taken_3} + ${held_3} + ${wait_3} + 1 DROPPED row == 2, and GET /sections/${secx}/registrations reports total_count 2 with ${row_first_state} IN {DROPPED, ENROLLED} — INVARIANT 1 holds with no drift"
            - "${reg2_dropped} == \"DROPPED\" and ${taken_4} == 0 and ${held_4} == 0 and ${wait_4} == 0 and ${avail_4} == 1 — with the waitlist exhausted there is nobody to promote, so the seat genuinely returns to the pool"
            - "LEDGER AT THE END: 0 + 0 + 0 + 2 DROPPED rows == 2 — the conserved quantity is unchanged across the entire sequence"
            - "${taken_4} <= 1 at every observation — INVARIANT 3 is never violated, in particular the promotion never pushes seats_taken to 2"

      - name: retake_budget_returns_to_pre_score_values_after_void
        conserved_quantity: "the per-(Student, subject_area) retake budget: attempt_counts[subj] + remaining_attempts[subj] == MAX_ATTEMPTS_PER_SUBJECT (3), with attempt_counts[subj] equal to the number of SCORED attempts"
        grounds:
          - calculations.retake_budget_invariant
          - calculations.retake_eligibility_window
          - endpoints[POST /test-attempts/{attempt_id}/void]
        distinguishing_aspect: |
          A different conserved quantity, and the compensation is entangled with a
          recomputation that must NOT drift: voiding the first attempt returns the
          budget to its pre-score value AND renumbers the surviving attempt from
          ordinal 2 to ordinal 1, which shortens its waiting period from 30 days to
          14 — recomputed from its OWN unchanged scored_at, not from the void
          instant. Voiding the second restores the budget exactly to 0/3. An
          implementation that decrements without renumbering, or that recomputes
          next_eligible_at from the clock, keeps the sum right while corrupting the
          gate.
        test_recipe:
          setup:
            - "Logical clock starts at its default 2026-08-01T00:00:00Z and is advanced ONCE, monotonically, to 2026-08-20T00:00:00Z."
            - "Session C1: room T11, proctor-9, 2026-08-01T00:00:00Z-02:00:00Z, seat_capacity 5, OPEN — brackets the first clock value."
            - "Session C2: room T12, proctor-10, 2026-08-20T00:00:00Z-02:00:00Z, seat_capacity 5, OPEN — brackets the second clock value, and its starts_at is at or after the first attempt's gate of 2026-08-15T00:00:00Z."
            - "Student SB with no transcript and no pathway; NO PlacementDetermination exists, so the void's HOP 2 through HOP 5 have nothing to touch and the budget is observed in isolation."
            - "Distinct rooms and distinct proctors keep priority 17 and priority 19 out of the way."
          setup_api_calls:
            - call: "POST /test-administrations"
