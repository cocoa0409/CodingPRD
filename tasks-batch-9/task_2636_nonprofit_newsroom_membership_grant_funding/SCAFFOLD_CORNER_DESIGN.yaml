      - name: val_membership_contribution_for_a_lapsed_member_is_refused_until_reinstatement
        claim_type: Conditional validation
        grounds:
          - validations[priority=17]
          - errors[ERR_MEMBER_NOT_ACTIVE]
          - state_machines.Member.LAPSED_to_ACTIVE
        distinguishing_aspect: >-
          A LAPSED member rejects a MEMBERSHIP contribution even at the full tier price, and
          only the explicit REINSTATE lifecycle action - not the payment itself - restores the
          member to ACTIVE.
        test_recipe:
          setup: "A member activated on 2026-08-01 whose renewal (2026-09-01) and grace expiry (2026-10-01) have both been swept past."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              as_user_id: user-fc-1
              captures: { fp_id: "$.data.id" }
            - call: "POST /membership-tiers"
              payload: { tier_code: "SUSTAINER", name: "Sustainer", renewal_cadence: "MONTHLY", contribution_amount_cents: 2500, benefits: [] }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { tier_id: "$.data.id" }
            - call: "POST /membership-tiers/${tier_id}/publish"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /members"
              payload: { tier_id: "${tier_id}", email: "ana@example.org", full_name: "Ana Ruiz" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { m_id: "$.data.id" }
            - call: "POST /contributions"
              payload: { fiscal_period_id: "${fp_id}", revenue_stream: "MEMBERSHIP", amount_cents: 2500, received_date: "2026-08-01", member_id: "${m_id}" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { c_id: "$.data.id" }
            - call: "POST /contributions/${c_id}/settlement"
              payload: { outcome: "SETTLED" }
              as: FinanceController
              as_user_id: user-fc-1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: FinanceController
              as_user_id: user-fc-1
            - call: "POST /ops/daily-sweep"
              payload: {}
              as: FinanceController
              as_user_id: user-fc-1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: FinanceController
              as_user_id: user-fc-1
            - call: "POST /ops/daily-sweep"
              payload: {}
              as: FinanceController
              as_user_id: user-fc-1
          trigger:
            - call: "GET /members/${m_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /contributions"
              payload: { fiscal_period_id: "${fp_id}", revenue_stream: "MEMBERSHIP", amount_cents: 2500, received_date: "2026-10-02", member_id: "${m_id}" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err_id: "$.data.error_id" }
            - call: "POST /members/${m_id}/lifecycle-actions"
              payload: { action: "REINSTATE" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /contributions"
              payload: { fiscal_period_id: "${fp_id}", revenue_stream: "MEMBERSHIP", amount_cents: 2500, received_date: "2026-10-02", member_id: "${m_id}" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
          assert:
            - "trigger[0]: status == LAPSED, lifetime_giving_cents == 2500, is_major_donor == false, cultivation_locked == false"
            - "trigger[1]: 409 with data.error_id == ERR_MEMBER_NOT_ACTIVE"
            - "trigger[2]: 200 with status == ACTIVE and consecutive_renewals == 0"
            - "trigger[3]: 201 with settlement_status == INITIATED"
            - "the two sweeps reported members_moved_to_grace == 1 and members_moved_to_lapsed == 1 respectively"

      - name: val_membership_writes_require_a_published_tier_and_at_least_the_tier_price
        claim_type: Violation → Error
        grounds:
          - validations[priority=16]
