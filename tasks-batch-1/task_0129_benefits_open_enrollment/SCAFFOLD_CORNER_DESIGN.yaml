# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Benefits Administration & Open Enrollment — Expert
# Breadth probe: every testable claim §1.1–§1.7 surface that §1.8 doesn't cover.
# Same seven-point contract as §1.8. excluded_because: stubs cite §1.8 instances.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_employee_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Employee, endpoints]
        distinguishing_aspect: "POST /employees with all required fields -> 201; response has server-minted id, created_at, version==1, eligibility_status==WAITING."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /employees"
              payload: { full_name: "Al Bone", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id, v: $.data.version, es: $.data.eligibility_status }
          assert:
            - "HTTP 201"
            - "Employee.${emp_id}.version == 1"
            - "Employee.${emp_id}.eligibility_status == WAITING"
            - "Employee.${emp_id}.pay_periods_processed == 0"

      - name: create_seasonal_employee_is_ineligible
        claim_type: Defaults
        grounds: [entities.Employee.eligibility_status, entities.Employee.employment_type]
        distinguishing_aspect: "A SEASONAL employee initializes eligibility_status==INELIGIBLE (never WAITING)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /employees"
              payload: { full_name: "Be Cain", hire_date: "2026-01-01", employment_type: "SEASONAL", payroll_schedule: "BIWEEKLY", monthly_household_income_cents: 300000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id, es: $.data.eligibility_status }
          assert:
            - "Employee.${emp_id}.eligibility_status == INELIGIBLE"

      - name: get_employee_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Employee, endpoints]
        distinguishing_aspect: "GET /employees/{id} returns the stored employee with matching full_name."
        test_recipe:
          setup: ["one employee created"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Cy Dunn", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { name: $.data.full_name }
          assert:
            - "HTTP 200"
            - "Employee.${emp_id}.full_name == 'Cy Dunn'"

      - name: list_employees_paginated_envelope
        claim_type: Listing
        grounds: [entities.Employee, endpoints]
        distinguishing_aspect: "GET /employees returns response_type array with total_count and has_more pagination fields."
        test_recipe:
          setup: ["two employees created"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Em F", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "En G", hire_date: "2026-01-01", employment_type: "PART_TIME", payroll_schedule: "BIWEEKLY", monthly_household_income_cents: 400000 }
              as: BenefitsAdmin
          trigger:
            - call: "GET /employees?limit=1&offset=0"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "response_type == array"
            - "meta total_count == 2 and has_more == true with limit=1"

      - name: get_employee_not_found
        claim_type: Not Found
        grounds: [entities.Employee, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /employees/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /employees/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and error_id == ERR_NOT_FOUND"

      - name: create_employee_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Employee, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /employees omitting payroll_schedule -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /employees"
              payload: { full_name: "No Sched", hire_date: "2026-01-01", employment_type: "FULL_TIME", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and error_id == ERR_INVALID_REQUEST"

      - name: create_employee_invalid_enum
        claim_type: Type Constraints
        grounds: [entities.Employee.employment_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /employees with employment_type=CONTRACTOR (not in enum) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /employees"
              payload: { full_name: "Bad Enum", hire_date: "2026-01-01", employment_type: "CONTRACTOR", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and error_id == ERR_INVALID_REQUEST"

      - name: enrollment_id_is_system_minted_input_ignored
        claim_type: System Fields
        grounds: [entities.Enrollment.status, entities.Enrollment.benefit_type]
        distinguishing_aspect: "POST /employees/{id}/enrollments: status is system-set DRAFT and benefit_type is copied from the tier's offering; client cannot set them."
        test_recipe:
          setup: ["employee + MEDICAL gold tier exist"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Sy Mint", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 60000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { tier_id: $.data.id }
          trigger:
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${tier_id}", coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id, st: $.data.status, bt: $.data.benefit_type }
          assert:
            - "Enrollment.${enr_id}.status == DRAFT (system-set)"
            - "Enrollment.${enr_id}.benefit_type == MEDICAL (copied from offering)"

      - name: create_enrollment_against_archived_offering
        claim_type: Parent Relationships
        grounds: [entities.PlanOffering.status, "errors[ERR_PLAN_ARCHIVED]", state_machines.PlanOffering.ACTIVE_to_ARCHIVED]
        distinguishing_aspect: "Creating an enrollment against a tier whose PlanOffering.status==ARCHIVED -> ERR_PLAN_ARCHIVED (409)."
        test_recipe:
          setup: ["employee created; MEDICAL offering with a tier; offering archived"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Ar Chiv", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 60000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /plan-offerings/${off_id}/archive"
              payload: {}
              as: BenefitsAdmin
          trigger:
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${tier_id}", coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_PLAN_ARCHIVED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_enrollment_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Enrollment.DRAFT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an enrollment already in ACTIVE -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["employee ELIGIBLE with one ACTIVE MEDICAL enrollment"]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Tw Ice", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 60000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${tier_id}", coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev1: $.data.version }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: { expected_employee_version: "${ev1}" }
              as: BenefitsAdmin
          trigger:
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev2: $.data.version }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: { expected_employee_version: "${ev2}" }
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_INVALID_STATE"
            - "Enrollment.${enr_id}.status unchanged == ACTIVE"

      - name: file_already_filed_1095c_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Form1095C.GENERATED_to_FILED, "errors[ERR_FORM_ALREADY_FILED]"]
        distinguishing_aspect: "Filing a Form1095C already in FILED (terminal) -> ERR_FORM_ALREADY_FILED (409)."
        test_recipe:
          setup: ["employee + lowest-cost MEDICAL tier; 1095-C generated and filed once"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Va File", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 100000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Silver PPO" }
              as: BenefitsAdmin
              captures: { off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 30000, employer_contribution_pct: 0.70, is_lowest_cost_self_only: true }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/form-1095c"
              payload: { tax_year: 2026 }
              as: ComplianceOfficer
              captures: { form_id: $.data.id }
            - call: "POST /form-1095c/${form_id}/file"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /form-1095c/${form_id}/file"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_FORM_ALREADY_FILED"
            - "Form1095C.${form_id}.status unchanged == FILED"

      - name: cancel_active_enrollment_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Enrollment.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel is only defined from DRAFT; cancelling an ACTIVE enrollment -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["employee ELIGIBLE with an ACTIVE enrollment"]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "We Cancl", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 60000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${tier_id}", coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev1: $.data.version }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: { expected_employee_version: "${ev1}" }
              as: BenefitsAdmin
          trigger:
            - call: "POST /enrollments/${enr_id}/cancel"
              payload: {}
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_INVALID_STATE"

      - name: verify_dependent_from_inforequested_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Dependent.PENDING_to_VERIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "verify is only defined from PENDING; verifying a dependent in INFO_REQUESTED -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["dependent moved to INFO_REQUESTED"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Xe Dep", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/dependents"
              payload: { relationship: "SPOUSE", full_name: "Sp Dep", date_of_birth: "1990-01-01" }
              as: BenefitsAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /dependents/${dep_id}/request-info"
              payload: {}
              as: DependentVerifier
          trigger:
            - call: "POST /dependents/${dep_id}/verify"
              payload: {}
              as: DependentVerifier
              as_user_id: "ver_a"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_INVALID_STATE"

      - name: newly_created_enrollment_initial_state_draft
        claim_type: Initial State
        grounds: [state_machines.Enrollment, entities.Enrollment.status]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / enrollment_branching_eoi_approve_vs_deny_revert"
          rationale: "Initial DRAFT state of a freshly created enrollment is exercised as the starting point of the EOI branch instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: voluntary_life_premium_rate_per_1000
        claim_type: Correct Result
        grounds: [calculations.compute_monthly_employee_cost, entities.Enrollment.monthly_employee_cost_cents]
        distinguishing_aspect: "VOLUNTARY_LIFE branch: coverage 20000000 (200 units of $1000) at 25 cents/1000 -> monthly_employee_cost_cents == 5000."
        test_recipe:
          setup: ["employee ELIGIBLE; VOLUNTARY_LIFE offering (requires_eoi false), tier rate 25/1000; coverage 20000000 (<= no GI needed since requires_eoi false)"]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Yo Life", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "VOLUNTARY_LIFE", name: "Voluntary Life", requires_eoi: false, guaranteed_issue_amount_cents: 50000000 }
              as: BenefitsAdmin
              captures: { off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 0, employer_contribution_pct: 0.0, rate_per_1000_monthly_cents: 25 }
              as: BenefitsAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${tier_id}", coverage_amount_cents: 20000000, coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev1: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/activate"
              payload: { expected_employee_version: "${ev1}" }
              as: BenefitsAdmin
              captures: { mec: $.data.monthly_employee_cost_cents }
          assert:
            - "Enrollment.${enr_id}.monthly_employee_cost_cents == 5000"

      - name: full_month_no_proration_carrier_premium
        claim_type: Constants Applied
        grounds: [calculations.reconcile_carrier_premium, entities.CarrierFeedRecord.reconciled_monthly_premium_cents]
        distinguishing_aspect: "coverage_start_date on day 1 -> days_covered == days_in_month -> reconciled_monthly_premium_cents == full premium 60000 (employer 42000 + employee 18000)."
        test_recipe:
          setup: ["employee ELIGIBLE; MEDICAL gold tier 60000/0.70; coverage_start 2026-02-01 (full month)"]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Za Full", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 60000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${tier_id}", coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev1: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/activate"
              payload: { expected_employee_version: "${ev1}" }
              as: BenefitsAdmin
            - call: "GET /carrier-feed-records?enrollment_id=${enr_id}&transaction_set=ADD"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "CarrierFeedRecord ADD reconciled_monthly_premium_cents == 60000 (no proration, day-1 start)"

      - name: aca_unaffordable_below_threshold
        claim_type: Variant Divergence
        grounds: [calculations.compute_aca_affordability, entities.Form1095C.affordability_indicator]
        excluded_because:
          difficulty_instance: "boundary_precision_check / aca_affordability_at_threshold_is_affordable"
          rationale: "The UNAFFORDABLE side at income 99000 (threshold 8930 < 9000) is asserted as the contrasting branch of the named §1.8 boundary instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: life_event_window_expired_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_LIFE_EVENT_WINDOW_EXPIRED]", state_machines.LifeEvent.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "Approving a life event whose event_date is > 30 days before the clock -> ERR_LIFE_EVENT_WINDOW_EXPIRED (409)."
        test_recipe:
          setup: ["employee ELIGIBLE; clock at 2026-04-01; life event event_date 2026-01-01 (>30 days prior)"]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Ab Late", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { off_id: $.data.id }
            - call: "POST /plan-tiers"
