          - validations.priority_40_ERR_RECOMMITMENT_BELOW_FLOOR
        distinguishing_aspect: "With a predecessor holding 20000000 unspent, the floor is exactly 20000000 + MIN_NEW_MONEY_CENTS 2500000 == 22500000: a counteroffer of 22499999 is refused with 422 ERR_RECOMMITMENT_BELOW_FLOOR while 22500000 is accepted, so the comparison is >= and not >."
