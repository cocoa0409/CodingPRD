    - name: dispute_amendment_cascades_five_levels_to_brand_index
      grounds:
      - state_machines.Dispute.EVIDENCE_REVIEW_to_AMENDED
      - state_machines.ScoredItem.UNDER_DISPUTE_to_AMENDED
      - state_machines.CorrectiveAction.ASSIGNED_to_VOIDED
      - calculations.visit_composite_score
      - calculations.location_standing_score
      - calculations.brand_risk_index
      distinguishing_aspect: |
        Depth 6, each link caused strictly by the previous one: resolving the Dispute AMENDED (1)
        amends the ScoredItem out of CRITICAL severity (2), which forces the visit to recompute its
        section percents, penalty and FINAL composite (3), which re-derives the Location standing and
        latest_grade (4), which - because the severity left CRITICAL - voids the item's CorrectiveAction
        and lowers the open count (5), which finally re-derives the Brand risk index (6). The trigger
        touches only the Dispute.
