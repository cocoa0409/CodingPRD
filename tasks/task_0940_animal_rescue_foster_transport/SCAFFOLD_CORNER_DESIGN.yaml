              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Rex", species: "DOG", size_class: "MEDIUM", weight_lb: 40.0, date_of_birth: "2022-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: IntakeOfficer
