          Boundary of the OVERTIME_THRESHOLD_MINUTES (480) split: with 470 already-approved billable
          minutes on the day, a 60-minute entry is split into 10 regular and 50 overtime minutes, giving
          round_half_up(10*20000/60)=3333 plus round_half_up(50*20000*1.5/60)=25000 => 28333 cents.
