- section: calculations
  instances:
  - name: barrier_score_normalises_after_the_weighted_sum
    claim_type: correct_result
    grounds:
    - calculations.participant_barrier_score
    - entities.Participant.fields.barrier_tier
    distinguishing_aspect: 'The five weights are applied to the 0..4 scores and only then divided by 4 and scaled
      to 100: (0.9 + 0.4 + 0.15 + 1.0 + 0.2) = 2.65 -> 66.25 -> 66.3 after ROUND_HALF_UP to one decimal. Scaling each
      score first, or truncating instead of rounding half up, gives 66.2 or 265.0.'
    test_recipe:
      setup:
      - one Participant p1 with no assessment yet (barrier_score null)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants
        payload:
          full_name: Marcus Reed
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - PROPERTY_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      trigger:
      - call: POST /participants/${p1_id}/assessment
        payload:
          assessment_domain_scores:
            housing_score: 3
            transportation_score: 2
            health_score: 1
            work_history_score: 4
            documentation_score: 2
        as: CaseManager
        as_user_id: cm-1
      assert:
      - HTTP 200
      - data.barrier_score == 66.3
      - data.barrier_tier == "HIGH" (>= TIER_HIGH_MIN 65.0)
      - 'data.assessment_domain_scores == {"housing_score": 3, "transportation_score": 2, "health_score": 1, "work_history_score":
        4, "documentation_score": 2}'
      - data.stage == "PRE_RELEASE" (doc_completeness_pct is still 0.0)
      - GET /participants?barrier_tier=HIGH returns total_count == 1
  - name: projected_subsidy_drops_cancelled_shifts_from_the_input_set
    claim_type: input_set_filtering
    grounds:
    - calculations.wage_subsidy_total
    - state_machines.WorkShift_status.transitions.SCHEDULED_to_CANCELLED
    distinguishing_aspect: The PROJECTED variant sums only shifts with status IN {SCHEDULED, WORKED}, so cancelling
      the middle 4.0h shift must take projected from 11100 to exactly 7400 — the cancelled row must not linger in
      the sum and must not be deleted from the collection either.
    test_recipe:
      setup:
      - logical clock parked at 2026-08-01T08:00:00.000Z
      - 'FunderGrant g1: authorized_cents 30000, per_participant_cap_cents 60000, retention_benchmark_pct 75.0, allowed_categories
        = all six, restricted_floor 4500, funding_posture OPEN'
      - EmployerPartnership pt1 ACTIVE, wotc_certified true, fidelity_bond_enabled true, max_concurrent_placements
        2
      - 'JobOpening jo1 OPEN: hourly_wage_cents 1850, weekly_hours 35, openings_count 2, transit_accessible true'
      - 'Participant p1 POST_RELEASE: record_categories [PROPERTY_OFFENSE], doc_completeness_pct 80.0, barrier_score
        66.3 (HIGH), transportation_plan_type TRANSIT_PASS, engagement_posture OPEN'
      - SupervisionCase sc1 ACTIVE with work_authorization_status APPROVED and window [480, 1020]
      - Placement pl1 employment_status ACTIVE (offer accepted), start_date 2026-08-03, projected_subsidy_cents 0,
        actual_subsidy_cents 0
      - three 4.0h WorkShifts on 2026-08-03, 08-04 and 08-05, 09:00-13:00Z, each worth ROUND_HALF_UP(4 * 1850 * 0.5)
        = 3700, so projected_subsidy_cents == 11100 and committed_cents == 11100
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /grants
        payload:
          funder_name: Reentry Workforce Fund
          program_year: 2026
          authorized_cents: 30000
          allowed_categories:
          - TOOLS
          - UNIFORM
          - TRANSIT_PASS
          - ID_FEE
          - LICENSE_FEE
          - WAGE_SUBSIDY
          per_participant_cap_cents: 60000
          retention_benchmark_pct: 75.0
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          g1_id: $.data.id
      - call: POST /employer-partnerships
        payload:
          employer_name: Northgate Logistics
          industry: LOGISTICS
          max_concurrent_placements: 2
          wotc_certified: true
          excluded_record_categories: []
        as: EmployerLiaison
        as_user_id: liaison-1
        captures:
          pt1_id: $.data.id
      - call: POST /employer-partnerships/${pt1_id}/bonding-agreement
        payload:
          bond_coverage_cents: 500000
          bond_effective_date: '2026-08-01'
        as: EmployerLiaison
        as_user_id: liaison-1
      - call: POST /employer-partnerships/${pt1_id}/status
        payload:
          to_status: ENGAGED
        as: EmployerLiaison
        as_user_id: liaison-1
      - call: POST /employer-partnerships/${pt1_id}/status
        payload:
          to_status: ACTIVE
        as: EmployerLiaison
        as_user_id: liaison-1
      - call: POST /job-openings
        payload:
          partnership_id: ${pt1_id}
          title: Warehouse Associate
          occupation_code: 53-7062
          hourly_wage_cents: 1850
          weekly_hours: 35
          openings_count: 2
          barred_record_categories: []
          requires_license: false
          requires_fidelity_bond: false
          transit_accessible: true
        as: EmployerLiaison
        as_user_id: liaison-1
        captures:
          jo1_id: $.data.id
      - call: POST /participants
        payload:
          full_name: Marcus Reed
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - PROPERTY_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: POST /participants/${p1_id}/assessment
        payload:
          assessment_domain_scores:
            housing_score: 3
            transportation_score: 2
            health_score: 1
            work_history_score: 4
            documentation_score: 2
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: STATE_ID
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: SSN_CARD
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: BIRTH_CERTIFICATE
        as: CaseManager
