            - "Account.${rcap_id}.available_balance_cents == 5000"

      - name: default_payout_selector_earliest_verified
        claim_type: Correct Result
        grounds: [calculations.default_payout_selector, entities.FundingSource.fields.is_default_payout]
        distinguishing_aspect: "Two FundingSources verified in order FS1 then FS2: is_default_payout is true on FS1 (earliest-VERIFIED by created_at ASC) and false on FS2."
        test_recipe:
          setup: ["Account A with two BANK funding sources, FS1 created and verified before FS2."]
          setup_api_calls:
