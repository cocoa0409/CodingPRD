  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: transport_window_half_open_buffer_admits_a_gap_of_exactly_ten_minutes
        grounds:
          - validations[priority=12].ERR_TRANSPORT_WINDOW_OVERLAP
          - calculations.transport_encumbrance
          - state_machines.TransportationAssignment.REQUESTED_to_ACTIVE
          - entities.TransportRoute.fields.seat_capacity
        distinguishing_aspect: |
          Route occupancy uses the HALF-OPEN interval [pickup_window_start_min,
          pickup_window_end_min + TURNAROUND_BUFFER_MIN) and the buffer expands only the END
          side. Against an ACTIVE A1 at 420..450 (occupying [420,460)), a second run at 460..490
          is ADMITTED because a gap of exactly 10 minutes is legal, while 455..485 (occupying
          [455,495)) is REFUSED because it intersects A1's buffered tail at [455,460). Seat
          capacity is 3 so nothing is ever waitlisted and the interval algebra is isolated: a
          closed-interval implementation rejects the legal 460..490 run, and an implementation
          that buffers both sides rejects it too.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z advanced to 2026-09-01T08:00:00Z."
            - "DistrictFiscalAccount FY2027 authorized_cents 100000000."
            - "One TransportRoute R-22 with seat_capacity 3, daily_rate_cents 6200, service window 360..600."
            - "Two students with ACTIVE DAY placements PL_A and PL_B, both transportation_required true."
            - "A1 on PL_A at 420..450, 5 days/week x 36 weeks -> ACTIVE with encumbrance_cents 1152270, occupying [420,460)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
