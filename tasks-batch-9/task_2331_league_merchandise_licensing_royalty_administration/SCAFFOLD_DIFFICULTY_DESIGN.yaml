        distinguishing_aspect: |
          Every stage of the waterfall floors or rounds, yet the sum of the club
          allocations plus the player pool plus the league admin fee must equal
          pool_gross_cents EXACTLY. The pool 1000003 is deliberately indivisible: the
          admin fee rounds 80000.24 down to 80000, the player pool rounds 250000.75 up
          to 250001, the equal component floors 502501.5 to 502501, and the three clubs
