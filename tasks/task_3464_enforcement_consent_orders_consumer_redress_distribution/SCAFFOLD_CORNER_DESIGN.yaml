        distinguishing_aspect: "Every error body is the fixed envelope: response_type == \"error\", data carries exactly error_id plus a non-empty message, and meta carries api_request_id and api_request_timestamp."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /enforcement/cids/00000000-0000-4000-8000-000000000000/transition"
              payload: { target_state: "ISSUED" }
              as: StaffAttorney
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CID_NOT_FOUND"
            - "response_type == \"error\" and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: single_resource_gets_with_unknown_ids_return_entity_specific_not_found
