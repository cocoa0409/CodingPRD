# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Ground Lease Administration - task_2653
# Sections and claim_type values are taken verbatim from references/claim-extraction-guide.md.
# The standard fixture is one Lessee plus one Lease on an empty DB with the logical clock at its
# 2026-08-01T00:00:00Z default; premises_code is varied per instance so nothing collides.
scaffold_corner_design:
  - section: entities
    instances:
      - name: lease_creation_seeds_every_computed_field_from_its_inputs
        claim_type: creation
        grounds:
          - endpoints.POST_/portfolio/leases
          - entities.Lease
          - state_machines.Lease.lease_status.initial_state
        distinguishing_aspect: |
          Sixteen inputs drive eleven derived fields at creation, and each has a specific seed rather
          than a zero: current_annual_base_rent_cents mirrors the initial rent, next_revaluation_date is
          commencement + interval years (2025-01-01, already in the past), deposit_held_cents mirrors the
          deposit while applied/refunded start at 0, and insurance starts LAPSED with a null expiry - a
          lease is uninsured until an endorsement is filed.
        test_recipe:
          setup:
            - "Empty DB, clock at its 2026-08-01T00:00:00Z default, one Lessee on file."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
          trigger:
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-71", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
          assert:
            - "returns 201 with every input echoed back unchanged, including premises_code 'PIER-71' and lessee_id ${lessee_id}"
            - "lease_status == ACTIVE and rent_status == BASE_ONLY"
            - "current_annual_base_rent_cents == 10000000 and next_revaluation_date == 2025-01-01T00:00:00Z"
            - "gfa_allocated_sqft == 0 and gfa_unallocated_sqft == 200000"
            - "deposit_held_cents == 5000000, deposit_applied_cents == 0, deposit_refunded_cents == 0"
            - "insurance_status == LAPSED, property_all_risk_limit_cents == 0, builders_risk_limit_cents == 0, lessor_additional_insured == false, insurance_expires_at == null"
            - "arrears_balance_cents == 0 and percentage_rent_sublease_base_cents == 0"
            - "predecessor_lease_id == null and origin_mortgage_id == null"
            - "id, created_at, updated_at are present and version == 1"

      - name: lease_and_lessee_retrieval_return_the_stored_rows
        claim_type: retrieval
        grounds:
          - endpoints.GET_/portfolio/leases/{id}
          - endpoints.GET_/portfolio/lessees/{id}
          - response_envelope
        distinguishing_aspect: |
          A GET must return the persisted row byte-for-byte inside the success envelope with
          response_type 'object' - not a re-derived projection - so the rent, envelope and deposit figures
          read back exactly what creation wrote, and meta.api_request_id is present on a read too.
        test_recipe:
          setup:
            - "One lessee and one lease as created above."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-72", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
          trigger:
            - call: "GET /portfolio/leases/${lease_id}"
              payload: {}
              as: LessorAdmin
            - call: "GET /portfolio/lessees/${lessee_id}"
              payload: {}
              as: AssetManager
              as_user_id: "am-1"
          assert:
            - "trigger[0] returns 200 with response_type 'object', meta.api_request_id and meta.api_request_timestamp present"
            - "trigger[0] data.id == ${lease_id}, premises_code 'PIER-72', current_annual_base_rent_cents 10000000, total_permitted_gfa_sqft 200000, deposit_held_cents 5000000, version 1"
            - "trigger[1] returns 200 with data.id == ${lessee_id}, legal_name 'Harborline Retail Holdings LLC', notice_email 'notices@harborline.example', credit_rating_code 'A'"

      - name: lease_listing_paginates_and_filters_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/portfolio/leases
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three leases under one lessee exercise limit/offset against a stable order plus the
          lease_status filter: page one returns 2 of 3 with has_more true, page two returns the last with
          has_more false and the same total_count, and response_type is 'array' on all of them. total_count
          must count the filtered population, not the page.
        test_recipe:
          setup:
            - "One lessee with three leases: PIER-73A, PIER-73B, PIER-73C, all ACTIVE."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-73A", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_a: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-73B", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_b: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-73C", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_c: $.data.id }
          trigger:
            - call: "GET /portfolio/leases?limit=2&offset=0"
              payload: {}
              as: LessorAdmin
            - call: "GET /portfolio/leases?limit=2&offset=2"
              payload: {}
              as: LessorAdmin
            - call: "GET /portfolio/leases?lessee_id=${lessee_id}&lease_status=IN_DEFAULT"
              payload: {}
              as: LessorAdmin
          assert:
            - "trigger[0] returns 200 with response_type 'array', 2 rows, limit 2, offset 0, total_count 3, has_more true"
            - "trigger[1] returns 1 row with limit 2, offset 2, total_count 3, has_more false"
            - "the union of the two pages is exactly {${lease_a}, ${lease_b}, ${lease_c}} with no row repeated"
            - "trigger[2] returns 200 with 0 rows, total_count 0 and has_more false - all three leases are ACTIVE"

      - name: lease_get_with_unknown_id_returns_404_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/portfolio/leases/{id}
          - errors.ERR_LEASE_NOT_FOUND
        distinguishing_aspect: |
          A syntactically valid but unknown id must produce the lease-specific 404 in the error envelope
          (response_type 'error', data.error_id), not a 500 and not an empty 200 body.
        test_recipe:
          setup:
            - "Empty DB - no leases at all, so any id is unknown."
          setup_api_calls: []
          trigger:
            - call: "GET /portfolio/leases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LessorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "returns 404 with response_type 'error' and data.error_id == 'ERR_LEASE_NOT_FOUND'"
            - "data.message is a non-empty string and no Lease row is created"

      - name: lease_creation_missing_required_reversion_standard_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_/portfolio/leases
          - validations.priority_3_body_shape
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Every one of the sixteen lease inputs is required - none carries a default - so omitting
          reversion_standard_code (which has no server-side fallback because it seeds the reversion
          standard snapshot) must fail at priority 3 before any FK or coherence check runs, and omitting
          security_deposit_cents must fail the same way rather than defaulting to 0.
        test_recipe:
          setup:
            - "One lessee on file so the FK would resolve if the body were complete."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
          trigger:
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-74", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, security_deposit_cents: 5000000 }
              as: LessorAdmin
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-74", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION" }
              as: LessorAdmin
          assert:
            - "trigger[0] returns ERR_INVALID_REQUEST (400) naming the missing reversion_standard_code"
            - "trigger[1] returns ERR_INVALID_REQUEST (400) for the missing security_deposit_cents - it does not default to 0"
            - "GET /portfolio/leases returns 0 rows: neither attempt persisted anything"

      - name: omitted_optional_fields_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Lessee.fields.credit_rating_code
          - entities.TransferRequest.fields.consent_deposit_cents
          - entities.TransferRequest.fields.transferee_credit_rating_code
          - entities.LossEvent.fields.damage_estimate_cents
        distinguishing_aspect: |
          Only four inputs in the whole surface carry defaults, and each must land without the client
          naming it: credit_rating_code BBB on a Lessee, transferee_credit_rating_code BBB and
          consent_deposit_cents 0 on a TransferRequest, and damage_estimate_cents / damaged_area_sqft 0 on
          a LossEvent - a null instead of 0 would break the later threshold comparison.
        test_recipe:
          setup:
            - "One lessee created without credit_rating_code and one lease under it."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-75", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /portfolio/transfer-requests"
              payload: { lease_id: "${lease_id}", transfer_type: "SUBLEASE", term_start: "2027-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", transferee_legal_name: "Wavelength Grocers LLC", premises_unit_code: "UNIT-A", annual_sublease_rent_cents: 12000000, sublet_area_sqft: 50000 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/loss-events"
              payload: { event_type: "CASUALTY", scope_code: "TEMPORARY", occurred_at: "2026-07-01T00:00:00Z" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { loss_id: $.data.id }
          assert:
            - "the setup lessee has credit_rating_code == 'BBB'"
            - "trigger[0] returns 201 with TransferRequest.${sub_id}.transferee_credit_rating_code == 'BBB', consent_deposit_cents == 0, parent_transfer_id == null, net_consideration_cents == null"
            - "trigger[1] returns 201 with LossEvent.${loss_id}.damage_estimate_cents == 0 and damaged_area_sqft == 0, not null"

      - name: transfer_request_computed_fields_are_server_derived_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.TransferRequest.fields.submitted_late
          - entities.TransferRequest.fields.tier_depth
          - entities.TransferRequest.fields.total_transfer_fee_cents
          - calculations.transfer_fee
        distinguishing_aspect: |
          submitted_late and tier_depth are fixed at creation from the clock and the parent chain, while
          every fee field stays null until consent runs the calculation. A client-supplied
          total_transfer_fee_cents or status must be ignored outright, and submitted_late must be false
          for a term that starts in the future even though the same lease could host a late one.
        test_recipe:
          setup:
            - "One lease; clock at its 2026-08-01T00:00:00Z default so a term starting 2027-01-01 is not late."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-76", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /portfolio/transfer-requests"
              payload: { lease_id: "${lease_id}", transfer_type: "SUBLEASE", term_start: "2027-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", transferee_legal_name: "Wavelength Grocers LLC", premises_unit_code: "UNIT-A", annual_sublease_rent_cents: 12000000, sublet_area_sqft: 50000, consent_deposit_cents: 0, total_transfer_fee_cents: 1, status: "ACTIVE", tier_depth: 9 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { sub_id: $.data.id }
          assert:
            - "returns 201 with TransferRequest.${sub_id}.status == 'SUBMITTED' - the supplied 'ACTIVE' is ignored"
            - "submitted_late == false (term_start 2027-01-01 is after the 2026-08-01 clock) and tier_depth == 1, not the supplied 9"
            - "allocable_base_rent_cents, transfer_fee_gross_cents, admin_charge_cents, late_surcharge_cents and total_transfer_fee_cents are all null - the supplied 1 is ignored because the fee is only computed at consent"
            - "transfer_fee_paid_cents == 0"

      - name: lease_system_fields_are_server_generated_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Lease
          - endpoints.POST_/portfolio/leases/{id}/terms
        distinguishing_aspect: |
          id, created_at, updated_at and version are server property: supplied values are dropped at
          creation, and the terms amendment - the only mutator of a Lease's own inputs - bumps version to
          2 and moves updated_at while created_at and id stay put. lease_status and rent_status are also
          system fields and cannot be set from the request body.
        test_recipe:
          setup:
            - "One lessee on file."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
          trigger:
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-77", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000, id: "11111111-1111-4111-8111-111111111111", version: 47, lease_status: "TERMINATED" }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/terms"
              payload: { percentage_rent_rate_bps: 800 }
              as: LessorAdmin
          assert:
            - "trigger[0] returns 201 with data.id != '11111111-1111-4111-8111-111111111111', version == 1 and lease_status == 'ACTIVE' - all three supplied system values are ignored"
            - "created_at and updated_at are server timestamps and are equal on the freshly created row"
            - "trigger[1] returns 200 with percentage_rent_rate_bps == 800, version == 2, the same id and created_at, and an updated_at at or after the created_at"
            - "the untouched terms are unchanged: percentage_rent_breakpoint_cents == 100000000 and permitted_use_code == 'RETAIL_MIXED'"

      - name: invalid_enum_and_out_of_range_values_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_3_body_shape
          - errors.ERR_INVALID_REQUEST
          - entities.Lease.fields.permitted_use_code
          - entities.ReversionAssessment.fields.structural_condition_score
        distinguishing_aspect: |
          Priority 3 screens four different shape faults on four different endpoints: an unknown enum
          member, negative money, a condition score above 100 and basis points above 10000. Each must be
          a 400 ERR_INVALID_REQUEST rather than a domain error, and none may persist a row.
        test_recipe:
          setup:
            - "One lessee and one lease on file."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-78", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /portfolio/leases/${lease_id}/alteration-requests"
              payload: { scope_code: "COSMETIC", proposed_use_code: "OFFICE_TOWER", requested_gfa_sqft: 1000, construction_window_start: "2027-01-01T00:00:00Z", construction_window_end: "2027-02-01T00:00:00Z", estimated_cost_cents: 100000 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/leases/${lease_id}/rent-charges"
              payload: { amount_cents: -500, memo: "negative charge" }
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /portfolio/leases/${lease_id}/terms"
              payload: { reval_collar_max_uplift_bps: 10001 }
              as: LessorAdmin
            - call: "POST /portfolio/leases/${lease_id}/loss-events"
              payload: { event_type: "FLOOD", scope_code: "PARTIAL", occurred_at: "2026-07-01T00:00:00Z" }
              as: AssetManager
              as_user_id: "am-1"
          assert:
            - "trigger[0] returns ERR_INVALID_REQUEST (400): 'OFFICE_TOWER' is not in {RETAIL_MIXED, INDUSTRIAL_LOGISTICS, RESIDENTIAL_RENTAL, LIFE_SCIENCE_LAB}, and it is not ERR_USE_NOT_PERMITTED"
            - "trigger[1] returns ERR_INVALID_REQUEST (400) for negative money and Lease.${lease_id}.arrears_balance_cents stays 0"
            - "trigger[2] returns ERR_INVALID_REQUEST (400) for basis points above 10000, and reval_collar_max_uplift_bps stays 5000 with version unchanged"
            - "trigger[3] returns ERR_INVALID_REQUEST (400): 'FLOOD' is not a declared event_type"
            - "no AlterationRequest and no LossEvent row exists after the four attempts"

      - name: appraisal_submission_is_immutable_with_no_version_and_no_mutator
        claim_type: immutability
        grounds:
          - entities.AppraisalSubmission
          - endpoints.GET_/portfolio/appraisal-submissions/{id}
          - validations.priority_5_uniqueness
        distinguishing_aspect: |
          AppraisalSubmission is the one entity declared without common_fields: a lodged appraisal is a
          sealed record of what a side swore to, so it carries no version and no updated_at, §1.5 exposes
