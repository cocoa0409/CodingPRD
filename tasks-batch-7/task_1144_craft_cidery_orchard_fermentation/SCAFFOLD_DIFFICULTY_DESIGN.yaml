              as: PlatformAdmin
            - call: "POST /cidery/fermentation-batches/${fb10}/ready"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/products"
              payload: { sku: "P10-SKU", name: "P10", style: "DRY", target_abv_pct: 5.0, vintage_year: 2026 }
              as: ComplianceOfficer
