            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "OV", tier_rank: 2, max_occupancy: 4, onboard_spend_lower_per_night_cents: 11000, onboard_spend_upper_per_night_cents: 7000 }
              as: RevenueManager
              captures: { cat_ov: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000, upgrade_to_category_id: "${cat_ov}" }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "ASG-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_s: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_s}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
              captures: { inv_s_ia: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_s}", cabin_category_id: "${cat_ov}", physical_cabins: 20, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_s_ov: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_s}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_s}", cabin_category_id: "${cat_ov}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 289995, third_berth_fare_cents: 80000, fourth_berth_fare_cents: 60000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_s}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_none: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_s}", cabin_category_id: "${cat_ia}", guest_id: "${g_none}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_s: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_s}/assign-guarantee"
              payload: { assigned_cabin_category_id: "${cat_ov}" }
              as: ReservationAgent
          assert:
            - "Booking.${bk_s}.assigned_cabin_category_id == ${cat_ov} while cabin_category_id is still ${cat_ia}"
            - "Booking.${bk_s}.net_ticket_cents == 379990 and gross_ticket_cents == 379990 - the guarantee fare is honoured, not repriced to the OV fare of 289995 * 2"
            - "Booking.${bk_s}.projected_onboard_gross_cents == 154000 (7 * 2 * 11000) and projected_onboard_net_cents == 154000"
            - "SailingInventory.${inv_s_ia}.booked_cabins == 0 and available_cabins == 64"
            - "SailingInventory.${inv_s_ov}.booked_cabins == 1 and available_cabins == 19"
            - "the capacity identity holds on both allotments: 60 + 4 == 64 + 0 + 0 and 20 + 0 == 19 + 1 + 0"
            - "Sailing.${sail_s}.projected_onboard_revenue_cents == 154000, gross_ticket_revenue_cents == 379990, ralbd_gross_cents == 381, ralbd_net_cents == 381, revenue_alert == true"
            - "Sailing.${sail_s}.lower_berths_sold == 2 and occupancy_pct == 1.00 (moving a cabin between categories does not change berths sold)"

      - name: ops_run_sails_the_voyage_and_credits_only_confirmed_travellers
        claim_type: cascade_down
        grounds:
          - state_machines.Sailing[INVENTORY_CLOSED -> SAILED].side_effects
          - state_machines.Booking[CONFIRMED -> SAILED]
          - calculations.guest_loyalty_tier
          - endpoints[POST /sailings/{id}/ops-run]
        distinguishing_aspect: |
          The sail cascade is three levels deep and CONDITIONAL at the first hop: only CONFIRMED
          bookings reach SAILED and credit their guest, while an unconfirmed OPTION booking is
          cancelled with cancel_reason SAILED_UNCONFIRMED and its guest earns nothing. The
          credited guest crosses the GOLD_FLOOR of 3 prior sailings in the same call, so the
          loyalty tier and offer percentage must be re-derived as part of the cascade rather than
          only on the next guest write.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing SLD-2701 (nights 4, total_lower_berths 40, embark 2026-09-01T12:00:00Z, days_to_sail 31) is OPEN_FOR_SALE with an IA allotment of 10 cabins and a 730..0 fare window at base 50000."
            - "Because days_to_sail 31 <= final_payment_days_before 75 both bookings are FULL_AT_BOOKING, so deposit_due_cents is overridden to net_ticket_cents 100000."
            - "Ada arrives with prior_sailings_count 2 (MEMBER, offer 0.00); she pays 100000 and confirms. Bo arrives with prior_sailings_count 0 (NONE); he pays 100000 but never confirms, so he stays OPTION."
            - "The clock is then advanced to the embarkation instant 2026-09-01T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "SLD-2701", embark_date: "2026-09-01T12:00:00Z", nights: 4, total_lower_berths: 40, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_l: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_l}", cabin_category_id: "${cat_ia}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_l: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_l}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 20000, fourth_berth_fare_cents: 15000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_l}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", prior_sailings_count: 2 }
              as: ReservationAgent
              captures: { g_ada: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_bo: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_l}", cabin_category_id: "${cat_ia}", guest_id: "${g_ada}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_ada: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_l}", cabin_category_id: "${cat_ia}", guest_id: "${g_bo}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_bo: $.data.id }
            - call: "POST /bookings/${bk_ada}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 100000 }
              as: ReservationAgent
            - call: "POST /bookings/${bk_bo}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 100000 }
              as: ReservationAgent
            - call: "POST /bookings/${bk_ada}/confirm"
              payload: {}
              as: ReservationAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: RevenueManager
          trigger:
            - call: "POST /sailings/${sail_l}/ops-run"
              payload: {}
              as: RevenueManager
          assert:
            - "Sailing.${sail_l}.status == SAILED"
            - "Booking.${bk_ada}.booking_status == SAILED and payment_status == PAID_IN_FULL"
            - "Guest.${g_ada}.prior_sailings_count == 3, loyalty_tier == GOLD, repeat_guest_offer_pct == 0.03 (the GOLD_FLOOR of 3 is crossed inside the cascade)"
            - "Booking.${bk_bo}.booking_status == CANCELLED with cancel_reason == SAILED_UNCONFIRMED"
            - "Guest.${g_bo}.prior_sailings_count == 0, loyalty_tier == NONE, repeat_guest_offer_pct == 0.00 - an unconfirmed traveller is never credited"
            - "Booking.${bk_ada}.loyalty_discount_cents == 0 and net_ticket_cents == 100000 - Ada's new GOLD tier does not retroactively reprice her sailed booking"
            - "Sailing.${sail_l}.lower_berths_sold == 2, occupancy_pct == 5.00, gross_ticket_revenue_cents == 100000, projected_onboard_revenue_cents == 72000"
            - "Sailing.${sail_l}.available_lower_berth_days_gross == 160, available_lower_berth_days_net == 160, ralbd_gross_cents == 1075, ralbd_net_cents == 1075, revenue_alert == true"
            - "SailingInventory.${inv_l}.booked_cabins == 1 and available_cabins == 9 (Bo's cabin is returned by his cancellation)"

      - name: cancelling_a_group_drawn_booking_returns_the_cabin_to_its_fence
        claim_type: compensation
        grounds:
          - endpoints[POST /bookings/{id}/cancel].side_effects
          - calculations.oversell_availability
          - entities.GroupBlock.fields.picked_up_cabins
        excluded_because:
          difficulty_instance: inventory_capacity_identity_across_group_and_booking_moves
          rationale: |
            That §1.8 instance already walks the full compensation loop - hold, draw a booking
            from the fence, cancel it - and asserts the capacity identity
            physical + effective_oversell == available + booked + group_held at every step,
            including that the returned cabin goes back to group_held_cabins rather than to open
            availability and that picked_up_cabins is decremented with no drift.

  # ===========================================================================
  - section: calculations
    instances:

      - name: booking_fare_buildup_emits_its_whole_output_vector
        claim_type: correct_result
        grounds:
          - calculations.booking_fare_buildup
          - calculations.booking_onboard_projection
          - endpoints[POST /bookings]
        distinguishing_aspect: |
          The simplest possible booking - no promotion, no loyalty offer, no upper berths - must
          still populate all seventeen declared outputs, including the ones an implementation is
          tempted to leave null: booked_days_to_sail 162, the pinned fare_rule_id and
          pinned_fare_rule_version, berth_discount_pct 0.10 (selected from the lower-berth
          subtotal even though there are no upper berths for it to apply to), both due dates and
          payment_terms STANDARD because 162 > 75.
