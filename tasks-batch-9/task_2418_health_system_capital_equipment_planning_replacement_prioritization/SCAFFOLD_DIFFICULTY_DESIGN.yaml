  # =========================================================================
  # 6. boundary_precision_check — three instances on three different metrics and
  #    three distinct endpoints: the RULS eligibility bar on submit, the audit
  #    attainment/variance bars on collect, and the expedite bar on score.
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ruls_eligibility_at_exactly_thirty_on_submit
        grounds:
          - calculations.asset_ruls_score
          - validations[priority=60]
          - entities.EquipmentAsset.fields.adjusted_ruls_score
          - errors.ERR_ASSET_NOT_REPLACEMENT_ELIGIBLE
        distinguishing_aspect: >-
          Metric = adjusted_ruls_score against the 30.00 ELIGIBILITY_THRESHOLD, endpoint
          POST /capital/requests/{id}/submit: two assets differing only by 0.01 downtime hour per
          event straddle the bar (8.00h -> penalty 10.00 -> 30.00 passes inclusively; 7.98h ->
          penalty 9.99 -> 30.01 is rejected), which fails under a strict "< 30.00" reading.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; facility NRH, department DEPT-A1."
            - "Asset A1: install 2020-08-02, expected_life_years 10, OEM support 2029-01-01, two CORRECTIVE events of 4.00 downtime hours -> nominal 40.00, penalty 10.00, adjusted exactly 30.00."
            - "Asset A2: identical except the two CORRECTIVE events carry 3.99 downtime hours -> penalty 9.99, adjusted 30.01."
            - "Cycle C1 plan_year 2027 in INTAKE_OPEN; requests R1 (asset A1) and R2 (asset A2) both in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-16", install_date: "2020-08-02T00:00:00Z", expected_life_years: 10, acquisition_cost_cents: 240000000, oem_support_end_date: "2029-01-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_a1_id: $.data.id }
            - call: "POST /capital/assets/${asset_a1_id}/service-events"
              payload: { event_date: "2026-05-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 4.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_a1_id}/service-events"
              payload: { event_date: "2026-06-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 4.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-16B", install_date: "2020-08-02T00:00:00Z", expected_life_years: 10, acquisition_cost_cents: 240000000, oem_support_end_date: "2029-01-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_a2_id: $.data.id }
            - call: "POST /capital/assets/${asset_a2_id}/service-events"
              payload: { event_date: "2026-05-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 3.99 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_a2_id}/service-events"
              payload: { event_date: "2026-06-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 3.99 }
