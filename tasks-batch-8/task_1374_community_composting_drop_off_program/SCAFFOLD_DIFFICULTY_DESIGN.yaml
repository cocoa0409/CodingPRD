              payload: { site_id: "${site_id}", host_name: "H", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /programs/${prog_id}/materials"
              payload: { code: "FOOD", description: "food", accepted_start_month_day: "01-01", accepted_end_month_day: "12-31", contamination_sensitivity: "LOW" }
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /programs/${prog_id}/host-agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
          assert:
            - "err1 == ERR_SITE_NO_ACTIVE_AGREEMENT (commission blocked while agreement DRAFT)"
            - "After agreement activation, commission succeeds: Site.status == OPERATIONAL"

      - name: allocation_distribute_requires_open_distribution
        grounds:
          - state_machines.DistributionAllocation.REQUESTED_to_DISTRIBUTED
          - state_machines.CompostDistribution.OPEN_to_CANCELLED
