              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/audits"
              payload: { facility_id: "${fac_id}", audit_type: "INITIAL", onsite_start_at: "2026-08-10T08:00:00Z", onsite_end_at: "2026-08-10T16:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { aud_id: $.data.id }
            - call: "POST /gfco/nonconformances"
              payload: { applicant_id: "${app_id}", source_type: "AUDIT", audit_id: "${aud_id}", category: "DOCUMENTATION", severity: "MAJOR", description: "Allergen changeover records incomplete for three shifts." }
              as: FieldAuditor
