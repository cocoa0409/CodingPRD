            - "trigger call 1 returns 201: odometer_at_inspection 80000 equals max_odometer_miles and equals Vehicle.odometer_miles, and started_at equals the clock"
            - "trigger call 2 returns 200 because credential_expires_at 2026-08-01T00:00:01Z is strictly after the clock, if only by a second"
            - "trigger call 6 returns 200 with warranty_end_miles == 92000 == min(80000 + 12000, 100000) and warranty_start_date == 2026-08-01"
            - "trigger call 6 bills fee_charged_cents == 121365: miles_over 40000 gives 4 blocks and a raw surcharge of 36000, which the cap floor(89900 * 0.35) == 31465 trims"
            - "trigger call 7 returns 201: repair_date equals the inclusive start of the coverage interval, repair_odometer_miles equals the inclusive mileage ceiling, and claimed_amount_cents equals the per-claim cap exactly"
            - "vehicle_age_days_at_inspection == 1179 and the certification's warranty_anchor_variant is CERTIFICATION_ANCHORED, since 80000 miles is past factory_basic_miles 36000"

      - name: vehicle_age_at_max_age_boundary_accepted_and_exceeded
        claim_type: temporal
        excluded_because:
          difficulty_instance: vehicle_age_days_at_max_age_boundary
          rationale: |
            Priority 12's inclusive day boundary is already driven from both sides there - exactly
            max_age_days accepted, one day more rejected with ERR_VEHICLE_AGE_EXCEEDED - using the
            same snapshot field vehicle_age_days_at_inspection.

      - name: branded_title_ineligible_rejected
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: stale_vehicle_version_412_precedes_branded_title_422
          rationale: |
            That instance fires ERR_BRANDED_TITLE_INELIGIBLE on a SALVAGE vehicle once the OCC token
            is current, which is the only way to observe priority 10 at certification submission, so
            the plain violation is covered by its second call.

      - name: eligibility_rejection_precedes_slot_conflict
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: vehicle_age_422_precedes_technician_slot_409
          rationale: |
            The 422-before-409 ordering between priority 12 and priority 28 is that instance's whole
            subject, with a request that violates both at once.

      - name: eligibility_rejection_precedes_documentation_check
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: branded_title_422_precedes_documentation_incomplete_422
          rationale: |
            Two same-status 422 rules in a fixed order (priority 10 before priority 22) are exercised
            there by a submission that is simultaneously branded-title ineligible and missing a
            required document.

      - name: suspended_dealer_blocked_from_pipeline
        claim_type: cross-entity
        excluded_because:
          difficulty_instance: dealer_privilege_gates_inspection_submission_and_syndication
          rationale: |
            Priority 14's asymmetric gate - SUSPENDED blocks everywhere, PROBATION still permits
            approval - is covered there across inspection creation, certification approval and
            syndication on one dealer.

      - name: technician_slot_conflict_rejected
        claim_type: cross-entity
        excluded_because:
          difficulty_instance: technician_buffered_slot_adjacency_forbidden
          rationale: |
            ERR_TECHNICIAN_SLOT_CONFLICT is triggered there on the touching-interval boundary, which
            is the strictest form of the overlap test; a plain mid-slot overlap adds nothing.

      - name: coverage_window_overlap_rejected
        claim_type: cross-entity
        excluded_because:
          difficulty_instance: vehicle_coverage_window_adjacency_allowed
          rationale: |
            ERR_COVERAGE_WINDOW_OVERLAP is triggered there by the one-day-earlier neighbour of an
            allowed adjacency, together with the retained-interval input set that decides which prior
            certifications still occupy the vehicle.

  # ===========================================================================
  # 5. From Table 1.5 (Endpoints)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: program_config_read_and_partial_update
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET /cpo/program-config
          - endpoints.PUT /cpo/program-config
          - entities.ProgramConfig
        distinguishing_aspect: |
          The singleton config has no id and no create endpoint: GET is readable by every role, PUT
          accepts any subset of the 34 tunables, and successive partial writes accumulate rather than
          reset - the second PUT must not restore audit_sample_pct to its default. Each accepted write
          bumps version by exactly one and a rejected write bumps nothing.
        test_recipe:
          setup:
            - "Nothing: the configuration exists at version 1 with the declared defaults before any call."
          trigger:
            - call: "GET /cpo/program-config"
              payload: {}
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "PUT /cpo/program-config"
              payload: { audit_sample_pct: 0.5 }
              as: ProgramAdministrator
            - call: "PUT /cpo/program-config"
              payload: { audit_sample_min_per_run: 2 }
              as: ProgramAdministrator
            - call: "PUT /cpo/program-config"
              payload: { surcharge_cap_pct: -1 }
              as: ProgramAdministrator
            - call: "GET /cpo/program-config"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "trigger call 1 returns 200 with response_type object, version 1, base_fee_cents 89900, audit_sample_pct 0.2, required_doc_types of length 4 and volume_discount_tiers of length 3"
            - "trigger call 2 returns 200 with audit_sample_pct 0.5 and version 2; every other field is unchanged"
            - "trigger call 3 returns 200 with version 3, audit_sample_min_per_run 2 AND audit_sample_pct still 0.5 - partial writes accumulate"
            - "trigger call 4 returns 422 ERR_INVALID_REQUEST for a negative fraction and leaves version at 3"
            - "trigger call 5 confirms version == 3 and that no field the four calls never mentioned has drifted from its default"

      - name: reconditioning_items_read_filters_paginates_and_reports_reimbursement
        claim_type: Computed read
        grounds:
          - endpoints.GET /cpo/inspections/{id}/reconditioning-items
          - calculations.reconditioning_reimbursement
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          One read surface must simultaneously carry the computed per-row reimbursement, honour both
          declared filters, and paginate with total_count reflecting the FILTERED set rather than the
          whole child collection. The three rows are deliberately in three different statuses so a
          filter that leaks or a total_count taken before filtering is visible.
        test_recipe:
          setup:
            - "Template MPI-172 with P1 plus three reconditioning-eligible points S1 (CRITICAL), B1 and T1 (both MAJOR); all three fail on attempt 1."
            - "T3 completes the B1 row at 1001 cents, the administrator waives T1, and the S1 row stays REQUIRED."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ben Tech", credential_id: "CR-2", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t2: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "S1", category: "SAFETY", severity: "CRITICAL", pass_criteria: "all airbag and restraint systems nominal", reconditioning_allowed: true, max_reconditioning_cost_cents: 200000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "B1", category: "BRAKES", severity: "MAJOR", pass_criteria: "pad thickness within 4.0..12.0 mm", min_measure: 4.0, max_measure: 12.0, reconditioning_allowed: true, max_reconditioning_cost_cents: 100000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "T1", category: "TIRES", severity: "MAJOR", pass_criteria: "tread depth above the wear bars on all four tires", reconditioning_allowed: true, max_reconditioning_cost_cents: 200000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000001", model_year: 2022, in_service_date: "2022-02-01", odometer_miles: 62000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 62000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i1: $.data.id }
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "S1", outcome: "FAIL", notes: "driver airbag fault" }, { item_code: "B1", outcome: "FAIL", measured_value: 2.0 }, { item_code: "T1", outcome: "FAIL", notes: "two tires below wear bars" }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "POST /cpo/inspections/${i1}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/inspections/${i1}/reconditioning-items"
              payload: { severity: "MAJOR" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { rb: "$.data[0].id", rt: "$.data[1].id" }
            - call: "POST /cpo/reconditioning-items/${rb}/complete"
              payload: { resolution: "COMPLETED", actual_cost_cents: 1001 }
              as: InspectionTechnician
              as_user_id: "${t2}"
            - call: "POST /cpo/reconditioning-items/${rt}/complete"
              payload: { resolution: "WAIVED", waiver_reason: "tire wear within regional tolerance" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /cpo/inspections/${i1}/reconditioning-items"
              payload: { limit: 2, offset: 0 }
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "GET /cpo/inspections/${i1}/reconditioning-items"
              payload: { limit: 2, offset: 2 }
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "GET /cpo/inspections/${i1}/reconditioning-items"
              payload: { status: "WAIVED" }
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "GET /cpo/inspections/${i1}/reconditioning-items"
              payload: { status: "COMPLETED", severity: "CRITICAL" }
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "GET /cpo/inspections/${i1}/reconditioning-items"
              payload: { limit: 101 }
              as: ProgramAuditor
              as_user_id: "auditor-1"
          assert:
            - "trigger call 1 returns response_type array with 2 rows, limit 2, offset 0, total_count 3 and has_more true"
            - "trigger call 2 returns the remaining 1 row with has_more false and the same total_count 3"
            - "trigger call 3 returns exactly the T1 row: status WAIVED, actual_cost_cents null, reimbursable_cents 0, waiver_reason preserved, and total_count 1 - the filtered count, not 3"
            - "trigger call 4 returns an empty array with total_count 0: the two filters intersect, and the only COMPLETED row is MAJOR"
            - "trigger call 5 returns 422 ERR_INVALID_REQUEST because limit exceeds the maximum of 100"
            - "the B1 row reads reimbursable_cents 601 == round_half_up(1001 * 0.60), and Inspection.${i1}.total_reimbursable_cents == 601"

      - name: results_batch_rejected_whole_on_a_single_bad_row
        claim_type: Bulk action
        grounds:
          - endpoints.PUT /cpo/inspections/{id}/results
          - validations.priority_18
          - state_machines.Inspection.IN_PROGRESS_to_IN_PROGRESS
        distinguishing_aspect: |
          The results endpoint takes an array but has no partial-success semantics: a batch of three
          rows whose last row contradicts its own measurement is rejected in full, and - crucially -
          it does not damage the attempt already on file. attempt_count, recorded_item_count and the
          previously stored attempt-1 rows must all survive unchanged, so a retry of the corrected
          batch produces attempt 2 rather than attempt 3.
        test_recipe:
          setup:
            - "Published MPI-172 with P1, S1 and measured B1; inspection I1 already holds a clean attempt 1."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
