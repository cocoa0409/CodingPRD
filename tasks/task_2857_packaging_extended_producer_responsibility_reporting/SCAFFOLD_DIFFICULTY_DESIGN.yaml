            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_id}", state_program_id: "${sp_ca_id}", effective_from: "2026-07-01", effective_to: null, membership_fee_cents: 250000, admin_fee_bps_low: 500, admin_fee_bps_high: 300, material_rates: [{ material_type: "PLASTIC", tier_min_kg: 0, tier_max_kg: 1000, rate_cents_per_kg: 42 }, { material_type: "PLASTIC", tier_min_kg: 1000, tier_max_kg: 5000, rate_cents_per_kg: 33 }, { material_type: "PLASTIC", tier_min_kg: 5000, tier_max_kg: null, rate_cents_per_kg: 25 }] }
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { fs_ca_id: $.data.id }
            - call: "GET /epr/pros/${pro_id}"
              payload: {}
              as: ProAdministrator
