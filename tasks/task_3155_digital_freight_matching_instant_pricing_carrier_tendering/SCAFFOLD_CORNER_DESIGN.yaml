- section: rbac
  instances:
  - name: claims_adjuster_cannot_create_a_load
    claim_type: Unauthorized role
    grounds:
    - roles.ClaimsAdjuster
    - roles.Shipper.exclusive_operations
    - endpoints.POST_/v1/loads
    distinguishing_aspect: POST /v1/loads lists only Shipper and PlatformAdmin, so a ClaimsAdjuster with a fully valid body
      is rejected at priority 2 with 403 ERR_UNAUTHORIZED and creates no row.
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. One shipper and two facilities.
      setup_api_calls:
      - call: POST /v1/shippers
        payload:
          name: Gulf Fabricators LLC
          billing_state_code: TX
          payment_terms_days: 30
          quick_pay_discount_pct: 0.03
          credit_limit_cents: 20000000
          load_credit_limit: 10
        as: PlatformAdmin
        captures:
          shipper_id: $.data.id
      - call: POST /v1/facilities
        payload:
          name: Gulf Fabricators Houston
          state_code: TX
          dock_capacity: 3
          default_appointment_minutes: 60
          free_dwell_minutes: 120
          detention_rate_per_hour_cents: 7500
        as: PlatformAdmin
        captures:
          origin_facility_id: $.data.id
      - call: POST /v1/facilities
        payload:
          name: Inland Empire DC
          state_code: CA
          dock_capacity: 3
          default_appointment_minutes: 60
          free_dwell_minutes: 120
          detention_rate_per_hour_cents: 7500
        as: PlatformAdmin
        captures:
          destination_facility_id: $.data.id
      trigger:
      - call: POST /v1/loads
        payload:
          shipper_id: ${shipper_id}
          origin_facility_id: ${origin_facility_id}
          destination_facility_id: ${destination_facility_id}
          pricing_mode: SPOT
          equipment_type: DRY_VAN
          commodity: GENERAL
          weight_lbs: 40000
          declared_cargo_value_cents: 5000000
          distance_miles: 1200
          pickup_window_start: '2026-10-05T08:00:00Z'
          pickup_window_end: '2026-10-05T12:00:00Z'
          delivery_deadline: '2026-10-07T18:00:00Z'
          market_band: BALANCED
        as: ClaimsAdjuster
        captures:
          error_id: $.data.error_id
      assert:
      - the response status is 403 and error_id == ERR_UNAUTHORIZED
      - GET /v1/loads?shipper_id=${shipper_id} returns 0 rows
      - Shipper.${shipper_id}.load_credits_committed == 0
  - name: shipper_cannot_read_another_shippers_file
    claim_type: Unauthorized role
    grounds:
    - roles.Shipper.identity
    - validations[priority=2]
    - errors.ERR_UNAUTHORIZED
    distinguishing_aspect: Shipper is entity_backed:Shipper, so reading a shipper file whose id differs from the caller's
      X-User-ID is 403 ERR_UNAUTHORIZED even though the read path itself declares Shipper as permitted.
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. Two shippers exist.
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-09-20T00:00:00Z'
        as: PlatformAdmin
      - call: POST /v1/shippers
        payload:
          name: Gulf Fabricators LLC
          billing_state_code: TX
          payment_terms_days: 30
          quick_pay_discount_pct: 0.03
          credit_limit_cents: 20000000
          load_credit_limit: 10
        as: PlatformAdmin
        captures:
          shipper_a: $.data.id
      - call: POST /v1/shippers
        payload:
          name: Pecos Aggregates LLC
          billing_state_code: TX
          payment_terms_days: 45
          quick_pay_discount_pct: 0.02
          credit_limit_cents: 5000000
          load_credit_limit: 4
        as: PlatformAdmin
        captures:
          shipper_b: $.data.id
      trigger:
      - call: GET /v1/shippers/${shipper_b}
        payload: {}
        as: Shipper
        as_user_id: ${shipper_a}
        captures:
          error_id: $.data.error_id
      - call: GET /v1/shippers/${shipper_a}
        payload: {}
        as: Shipper
        as_user_id: ${shipper_a}
      assert:
      - the cross-file read returns 403 with error_id == ERR_UNAUTHORIZED
      - the own-file read returns 200 with data.id == "${shipper_a}"
      - the caller's X-User-ID is ${shipper_a} and the target id is ${shipper_b}
