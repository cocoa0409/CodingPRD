  # =========================================================================
  # 6. From Table 6 (Errors) - every catalog entry must be triggerable
  # =========================================================================
  - section: errors
    instances:
      - name: every_existence_error_in_the_catalog_is_reachable_returns_not_found
        claim_type: error_triggerability
        grounds:
          - errors.ERR_ZONE_NOT_FOUND
          - errors.ERR_HOUSEHOLD_NOT_FOUND
          - errors.ERR_ROUTE_NOT_FOUND
          - errors.ERR_LOT_NOT_FOUND
          - errors.ERR_INSTALLATION_NOT_FOUND
          - errors.ERR_PARTNER_NOT_FOUND
          - errors.ERR_CREW_NOT_FOUND
          - errors.ERR_GRANT_NOT_FOUND
          - errors.ERR_PLAN_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
          - validations[priority 3 - existence]
          - validations[priority 5 - existence]
        distinguishing_aspect: "Sweeps the whole existence family in one instance and pins the per-entity error_id, so a server that returns a generic 404 for every unknown id fails: eight path-id reads plus the two body-id references (partner_id on grant create, crew_id on route create) each name their own entity. ERR_VISIT_NOT_FOUND is covered separately by entities.visit_get_with_unknown_id_returns_not_found."
        test_recipe:
          setup:
            - "One assessed zone (so the route create fails only on its unknown crew_id); no other rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v0}" }
              as: RiskAnalyst
          trigger:
            - call: "GET /crr/zones/00000000-0000-4000-8000-000000000001"
              as: ProgramAdmin
              captures: { e_zone: $.data.error_id }
            - call: "GET /crr/households/00000000-0000-4000-8000-000000000002"
              as: ProgramAdmin
              captures: { e_hh: $.data.error_id }
            - call: "GET /crr/routes/00000000-0000-4000-8000-000000000003"
              as: ProgramAdmin
              captures: { e_route: $.data.error_id }
            - call: "GET /crr/device-lots/00000000-0000-4000-8000-000000000004"
              as: ProgramAdmin
              captures: { e_lot: $.data.error_id }
            - call: "GET /crr/installations/00000000-0000-4000-8000-000000000005"
              as: ProgramAdmin
              captures: { e_inst: $.data.error_id }
            - call: "GET /crr/grants/00000000-0000-4000-8000-000000000006"
              as: ProgramAdmin
              captures: { e_grant: $.data.error_id }
            - call: "GET /crr/escape-plans/00000000-0000-4000-8000-000000000007"
              as: ProgramAdmin
              captures: { e_plan: $.data.error_id }
            - call: "GET /crr/grant-reports/00000000-0000-4000-8000-000000000008"
              as: ProgramAdmin
              captures: { e_report: $.data.error_id }
            - call: "POST /crr/grants"
              payload: { partner_id: "00000000-0000-4000-8000-000000000009", grant_code: "G-ORPHAN", authorized_cents: 500000, period_start_date: "2026-07-01", period_end_date: "2026-12-31", allowed_device_types: ["SMOKE_10YR"], unit_rate_cents_by_type: { SMOKE_10YR: 2195 }, reimbursement_basis: "UNIT_RATE", reimbursement_pct: 87.5, indirect_rate_pct: 12.5, match_pct: 20.0 }
              as: GrantOfficer
              captures: { e_partner: $.data.error_id }
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_id}", crew_id: "00000000-0000-4000-8000-00000000000a", service_date: "2026-08-01", window_start_utc: "2026-08-01T13:00:00Z", window_end_utc: "2026-08-01T21:00:00Z", planned_slots: 4 }
              as: CanvassCoordinator
              captures: { e_crew: $.data.error_id }
          assert:
            - "every one of the ten responses has status 404"
            - "${e_zone} == ERR_ZONE_NOT_FOUND"
            - "${e_hh} == ERR_HOUSEHOLD_NOT_FOUND"
            - "${e_route} == ERR_ROUTE_NOT_FOUND"
            - "${e_lot} == ERR_LOT_NOT_FOUND"
            - "${e_inst} == ERR_INSTALLATION_NOT_FOUND"
            - "${e_grant} == ERR_GRANT_NOT_FOUND"
            - "${e_plan} == ERR_PLAN_NOT_FOUND"
            - "${e_report} == ERR_REPORT_NOT_FOUND"
            - "${e_partner} == ERR_PARTNER_NOT_FOUND (body reference, priority 5, not a path id)"
            - "${e_crew} == ERR_CREW_NOT_FOUND (body reference, priority 5)"
            - "no row was created: GET /crr/grants returns total_count 0 and GET /crr/routes returns total_count 0"
            - "RiskZone.${z_id}.assessment_status == ASSESSED (the failed route create did not fire the ASSESSED_to_TARGETED transition)"

      - name: assessment_on_a_district_zone_returns_zone_not_assessable
        claim_type: error_triggerability
        grounds:
          - errors.ERR_ZONE_NOT_ASSESSABLE
          - state_machines[RiskZone.assessment_status]
          - calculations.district_risk_rollup
        distinguishing_aspect: "A zone becomes a DISTRICT implicitly, as a side effect of another zone naming it as parent. The district's score is a rollup only, so a direct assessment on it is refused with 409 even though the request carries the district's current version and would otherwise be valid - the OCC gate at priority 8 passes and the state gate at priority 9 is what rejects."
        test_recipe:
          setup:
            - "Zone Z-DIST-1 created first, then Z-B54 created with parent_zone_id pointing at it, which flips the parent to DISTRICT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-DIST-1", name: "Birchwood District", occupied_units: 4000, structure_fire_count_5yr: 20, fire_injury_count_5yr: 3, pre_1980_unit_pct: 30.0, senior_household_pct: 15.0, under5_household_pct: 6.0, disability_household_pct: 3.0, assumed_alarm_absence_pct: 40.0, daily_visit_cap: 20 }
              as: RiskAnalyst
              captures: { d_id: $.data.id }
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12, parent_zone_id: "${d_id}" }
              as: RiskAnalyst
              captures: { z_id: $.data.id }
            - call: "GET /crr/zones/${d_id}"
              as: RiskAnalyst
              captures: { d_v: $.data.version }
          trigger:
            - call: "POST /crr/zones/${d_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${d_v}" }
              as: RiskAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_ZONE_NOT_ASSESSABLE"
            - "RiskZone.${d_id}.zone_kind == DISTRICT"
            - "RiskZone.${d_id}.assessment_status == UNASSESSED"
            - "RiskZone.${d_id}.current_assessment_id == null"
            - "GET /crr/zones/${d_id}/assessments returns total_count 0"
            - "RiskZone.${z_id}.zone_kind == LEAF"

      - name: activating_an_already_active_grant_returns_grant_not_draft
        claim_type: error_triggerability
        grounds:
          - errors.ERR_GRANT_NOT_DRAFT
          - state_machines[PartnerGrant.status]
          - endpoints[POST /crr/grants/{id}/activate]
        distinguishing_aspect: "Idempotency is explicitly NOT granted to activate: the second call on the same grant returns 409 ERR_GRANT_NOT_DRAFT rather than a second 200, and the version must stay at 1 so the retry does not silently bump the OCC counter."
        test_recipe:
          setup:
            - "One DRAFT grant, activated once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/partners"
              payload: { org_name: "Firesafe Trust", org_type: "NONPROFIT", contact_email: "grants@firesafe.example", agreement_signed: true }
              as: ProgramAdmin
