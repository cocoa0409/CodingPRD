scenario: |
  654. Sunroom & Patio Enclosure: design & measure, structure type (3-season/4-season/screen)
  & material, permit/HOA & engineering, quote & financing, manufacture & lead time, install
  crew & weather, inspection, warranty
domain_name: sunroom-patio-enclosure
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency      # OCC on Project.version for quote-supersede race
    - dual_variant_calculation    # estimate-at-design vs final-at-manufacture quote
    - cascading_side_effects      # permit rejection / engineering fail cascades back through pipeline
    - rate_threshold_triggers     # wind/snow engineering thresholds, financing APR tiers
    - scheduled_actions           # install slots are scheduled against a logical clock + weather windows

  entity_topology: flat
  # Peer entities linked by foreign keys (Project, Quote, PermitApplication, ManufactureOrder,
  # InstallJob, Inspection, Warranty, FinancingApplication, InstallCrew, etc.) — most operations
  # reference the parent Project by FK in the body, not by deep URL nesting.

  state_machine_shape: cyclic
  # Project has a revision cycle (DESIGN ↔ MEASURE re-measure loop); PermitApplication has a
  # resubmission cycle (REJECTED → SUBMITTED); InstallJob has a parallel weather×progress shape;
  # Quote has branching accept/reject.

  relationship_patterns:
    - one_to_many        # Project has many Quotes (revisions), many Inspections
    - flat_fk_references # Quote -> Project, ManufactureOrder -> Quote, etc.
    - cross_aggregate    # InstallJob references both Project and InstallCrew

  role_model: peer_roles
  # Homeowner owns Projects/financing/quote-acceptance; SalesDesigner owns design+quote;
  # PermitOfficer (opaque) owns permit/engineering rulings; Manufacturer (opaque) owns build;
  # InstallManager (opaque) owns crew scheduling + install + inspection scheduling;
  # Inspector (opaque) owns inspection rulings.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Homeowner
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login email; unique among Homeowners."
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: "Homeowner display name."
      - name: hoa_governed
        type: boolean
        source: input
        description: "True if the property is inside an HOA-governed community; gates HOA approval requirement."
        default: false
      - name: ground_snow_load_psf
        type: number
        source: input
        description: "Site ground snow load in pounds per square foot, from the local building code map; drives roof engineering."
        constraints: ">= 0"
      - name: design_wind_speed_mph
        type: integer
        source: input
        description: "Site design wind speed (mph) from the local wind map; drives wall/frame engineering."
        constraints: ">= 0"

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: homeowner_id
        type: string
        source: input
        description: "FK -> Homeowner.id; the owner of this project."
      - name: address_line
        type: string
        source: input
        description: "Street address where the enclosure will be built."
      - name: structure_type
        type: enum
        source: input
        description: "Enclosure class."
        constraints: "one of SCREEN_ROOM, THREE_SEASON, FOUR_SEASON"
      - name: material
        type: enum
        source: input
        description: "Primary frame/glazing material."
        constraints: "one of ALUMINUM, VINYL, THERMAL_BREAK_ALUMINUM"
      - name: status
        type: enum
        source: system
        description: "Project lifecycle state. See §1.2 Project state machine."
        default: DRAFT
        constraints: "one of DRAFT, MEASURED, DESIGNED, QUOTED, PERMITTING, APPROVED_TO_BUILD, IN_MANUFACTURE, INSTALLING, INSPECTING, COMPLETED, CANCELLED"
      - name: width_in
        type: number
        source: computed
        description: "Enclosure width in inches; copied from the accepted Measurement on transition to MEASURED. 0 until measured."
        default: 0
      - name: depth_in
        type: number
        source: computed
        description: "Enclosure depth in inches; copied from the accepted Measurement on MEASURED. 0 until measured."
        default: 0
      - name: footprint_sqft
        type: number
        source: computed
        description: "Computed enclosure floor area = (width_in * depth_in)/144, round_half_up to 2 dp. See calc footprint_area. 0 until measured."
        default: 0
      - name: accepted_quote_id
        type: string
        source: computed
        description: "Pointer to the accepted Quote.id (read on this Project; discoverable via GET /projects/{id}/quotes). null until a quote is accepted. Not a canonical child FK — Project is not a child of Quote."
        default: null
      - name: requires_hoa
        type: boolean
        source: computed
        description: "True iff the owning Homeowner.hoa_governed is true at design time; gates HOA approval in permitting."
        default: false
      - name: requires_engineering
        type: boolean
        source: computed
        description: "True iff structure_type==FOUR_SEASON OR ground_snow_load_psf > 30 OR design_wind_speed_mph >= 130. See calc engineering_requirement."
        default: false

  - name: Measurement
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project being measured."
      - name: width_in
        type: number
        source: input
        description: "Field-measured width in inches."
        constraints: "> 0"
      - name: depth_in
        type: number
        source: input
        description: "Field-measured depth in inches."
        constraints: "> 0"
      - name: wall_height_in
        type: number
        source: input
        description: "Field-measured wall height in inches."
        constraints: "> 0"
      - name: existing_slab
        type: boolean
        source: input
        description: "Whether an existing concrete slab is present (no slab pour add-on needed)."
        default: false
      - name: status
        type: enum
        source: system
        description: "Measurement acceptance state. See §1.2 Measurement state machine."
        default: PENDING
        constraints: "one of PENDING, ACCEPTED, SUPERSEDED"

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Quote's owning project. FK -> Project.id."
      - name: revision_no
        type: integer
        source: system
        description: "1-based revision counter; the Nth quote created for the project."
        constraints: ">= 1"
      - name: variant
        type: enum
        source: system
        description: "Which pricing variant produced base_price_cents. ESTIMATE at design time; FINAL at manufacture confirmation."
        default: ESTIMATE
        constraints: "one of ESTIMATE, FINAL"
      - name: base_price_cents
        type: integer
        source: computed
        description: "Structure+material+area price before add-ons and tax. See calc quote_base_price."
      - name: addons_cents
        type: integer
        source: computed
        description: "Sum of add-on line items (slab pour, engineering stamp, HOA filing). See calc quote_addons_total."
      - name: tax_cents
        type: integer
        source: computed
        description: "Sales tax = round_half_up((base_price_cents+addons_cents) * TAX_RATE). See calc quote_tax."
      - name: total_cents
        type: integer
        source: computed
        description: "base_price_cents + addons_cents + tax_cents."
      - name: status
        type: enum
        source: system
        description: "Quote lifecycle. See §1.2 Quote state machine."
        default: ISSUED
        constraints: "one of ISSUED, ACCEPTED, REJECTED, SUPERSEDED"

  - name: FinancingApplication
    parent: null
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the accepted quote whose total is being financed."
      - name: project_id
        type: string
        source: input
        description: "Denormalized owning project id (equals the quote's project_id). Reverse discovery is via the canonical FK quote_id (GET /quotes/{id}/financing-applications). Not a canonical child FK."
      - name: amount_financed_cents
        type: integer
        source: computed
        description: "Principal financed = accepted Quote.total_cents - down_payment_cents."
      - name: down_payment_cents
        type: integer
        source: input
        description: "Up-front amount the Homeowner pays; reduces principal."
        constraints: ">= 0"
      - name: term_months
        type: integer
        source: input
        description: "Loan term in months."
        constraints: "one of 12, 24, 36, 60"
      - name: credit_score
        type: integer
        source: input
        description: "Applicant FICO score; selects the APR tier."
        constraints: "300..850"
      - name: apr_bps
        type: integer
        source: computed
        description: "Annual percentage rate in basis points, selected by credit_score tier. See calc financing_apr_tier."
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: "Amortized monthly payment over term_months at apr_bps. See calc financing_monthly_payment."
      - name: status
        type: enum
        source: system
        description: "Financing lifecycle. See §1.2 FinancingApplication state machine."
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, DECLINED"

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project requiring a building permit."
      - name: jurisdiction_code
        type: string
        source: input
        description: "Municipal jurisdiction code that issues the permit."
      - name: hoa_required
        type: boolean
        source: computed
        description: "Copied from Project.requires_hoa at submission; if true an HOA_APPROVED milestone must precede APPROVED."
      - name: hoa_status
        type: enum
        source: system
        description: "HOA review outcome. NOT_REQUIRED when hoa_required is false."
        default: PENDING
        constraints: "one of NOT_REQUIRED, PENDING, HOA_APPROVED, HOA_DENIED"
      - name: status
        type: enum
        source: system
        description: "Permit lifecycle. See §1.2 PermitApplication state machine."
        default: SUBMITTED
        constraints: "one of SUBMITTED, IN_REVIEW, REJECTED, APPROVED, EXPIRED"
      - name: resubmission_count
        type: integer
        source: system
        description: "Number of times this permit moved REJECTED -> SUBMITTED. Capped at MAX_RESUBMISSIONS."
        default: 0
      - name: expires_at
        type: datetime
        source: computed
        description: "Permit validity deadline = approval time + PERMIT_VALIDITY_DAYS. null until APPROVED."
        default: null

  - name: EngineeringReview
    parent: null
    common_fields: true
    fields:
      - name: permit_application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id; the permit this stamped review supports."
      - name: project_id
        type: string
        source: input
        description: "Denormalized owning project id (equals the permit's project_id). Reverse discovery is via the canonical FK permit_application_id (GET /permit-applications/{id}/engineering-reviews). Not a canonical child FK."
      - name: required_wind_mph
        type: integer
        source: computed
        description: "Design wind speed the structure must withstand; copied from Homeowner.design_wind_speed_mph."
      - name: required_snow_psf
        type: number
        source: computed
        description: "Ground snow load the roof must withstand; copied from Homeowner.ground_snow_load_psf."
      - name: rated_wind_mph
        type: integer
        source: input
        description: "Wind rating the submitted structural design achieves."
        constraints: ">= 0"
      - name: rated_snow_psf
        type: number
        source: input
        description: "Snow load rating the submitted roof design achieves."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Engineering review outcome. See §1.2 EngineeringReview state machine."
        default: PENDING
        constraints: "one of PENDING, PASSED, FAILED"

  - name: ManufactureOrder
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project whose enclosure is built."
      - name: quote_id
        type: string
        source: input
        description: "Denormalized accepted-quote id (equals Project.accepted_quote_id at order time); discoverable via the owning Project. Not a canonical child FK (project_id is the FK)."
      - name: lead_time_days
        type: integer
        source: computed
        description: "Manufacturing lead time in days, by material and footprint band. See calc manufacture_lead_time."
      - name: promised_ready_at
        type: datetime
        source: computed
        description: "Date the build is promised ready = order time + lead_time_days days."
      - name: ready_at
        type: datetime
        source: system
        description: "Actual time the build was marked ready. null until READY."
        default: null
      - name: status
        type: enum
        source: system
        description: "Manufacture lifecycle. See §1.2 ManufactureOrder state machine."
        default: QUEUED
        constraints: "one of QUEUED, IN_PRODUCTION, READY, CANCELLED"

  - name: InstallCrew
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Crew display name."
      - name: max_wind_mph
        type: integer
        source: input
        description: "Maximum forecast wind speed (mph) at which this crew will work; weather-window gate."
        constraints: ">= 0"
      - name: certified_four_season
        type: boolean
        source: input
        description: "Whether this crew is certified to install FOUR_SEASON enclosures."
        default: false
      - name: active
        type: boolean
        source: input
        description: "Whether the crew is currently rostered for assignment."
        default: true

  - name: InstallJob
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project being installed."
      - name: crew_id
        type: string
        source: input
        description: "FK -> InstallCrew.id; the assigned crew."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Scheduled install window start (inclusive)."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Scheduled install window end (exclusive). Half-open [start,end)."
      - name: forecast_wind_mph
        type: integer
        source: input
        description: "Forecast peak wind (mph) for the scheduled window; checked against crew.max_wind_mph."
        constraints: ">= 0"
      - name: progress_status
        type: enum
        source: system
        description: "Install progress dimension. See §1.2 InstallJob (progress axis)."
        default: SCHEDULED
        constraints: "one of SCHEDULED, IN_PROGRESS, INSTALLED"
      - name: weather_status
        type: enum
        source: system
        description: "Independent weather dimension. See §1.2 InstallJob (weather axis)."
        default: CLEAR
        constraints: "one of CLEAR, WEATHER_HOLD"

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project being inspected."
      - name: install_job_id
        type: string
        source: input
        description: "Denormalized id of the completed InstallJob under inspection (equals the project's current install job). Discoverable via GET /projects/{id}/install-jobs. Not a canonical child FK (project_id is the FK)."
      - name: attempt_no
        type: integer
        source: system
        description: "1-based inspection attempt counter for the project."
        constraints: ">= 1"
      - name: result
        type: enum
        source: system
        description: "Inspection ruling. See §1.2 Inspection state machine."
        default: SCHEDULED
        constraints: "one of SCHEDULED, PASSED, FAILED_PUNCHLIST"
      - name: punchlist_items
        type: integer
        source: input
        description: "Count of deficiencies recorded when failing; 0 on pass."
        default: 0
        constraints: ">= 0"

  - name: Warranty
    parent: null
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the completed project this warranty covers."
      - name: structure_type
        type: enum
        source: computed
        description: "Copied from Project.structure_type at issuance; selects coverage term."
        constraints: "one of SCREEN_ROOM, THREE_SEASON, FOUR_SEASON"
      - name: term_years
        type: integer
        source: computed
        description: "Coverage term in years by structure_type. See calc warranty_term."
      - name: starts_at
        type: datetime
        source: computed
        description: "Coverage start = the COMPLETED transition time (inspection pass time)."
      - name: expires_at
        type: datetime
        source: computed
        description: "Coverage end = starts_at + term_years*365 days."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- Project: cyclic pipeline (DESIGN/MEASURE re-measure loop) + cascades -----
  - entity: Project
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: MEASURED
        trigger: "POST /measurements/{id}/accept"
        actor: SalesDesigner
        preconditions:
          - "Measurement.project_id == this Project.id"
          - "Measurement.status == PENDING"
        side_effects:
          - "set Measurement.status = ACCEPTED"
          - "copy width_in, depth_in onto Project.width_in, Project.depth_in"
          - "recompute Project.footprint_sqft via calc footprint_area"
          - "increments Project.version by 1"

      - from: MEASURED
        to: DESIGNED
        trigger: "POST /projects/{id}/finalize-design"
        actor: SalesDesigner
        preconditions:
          - "Project.status == MEASURED"
          - "Project.structure_type and Project.material are set"
        side_effects:
          - "set Project.requires_hoa = owning Homeowner.hoa_governed (calc-free copy)"
          - "set Project.requires_engineering via calc engineering_requirement"
          - "increments Project.version by 1"

      - from: DESIGNED
        to: MEASURED
        trigger: "POST /measurements/{id}/accept (a NEW pending re-measure)"
        actor: SalesDesigner
        preconditions:
          - "Project.status == DESIGNED"
          - "the new Measurement.status == PENDING and Measurement.project_id == this Project.id"
          - "Project has no ACCEPTED Quote (Project.accepted_quote_id is null)"
        side_effects:
          - "set prior ACCEPTED Measurement.status = SUPERSEDED"
          - "set new Measurement.status = ACCEPTED"
          - "recopy width_in/depth_in; recompute Project.footprint_sqft"
          - "set every ISSUED Quote on this Project to SUPERSEDED (re-measure invalidates outstanding estimates)"
          - "increments Project.version by 1"
        note: "Revision cycle: re-measure returns DESIGNED projects to MEASURED so design can be re-finalized."

      - from: DESIGNED
        to: QUOTED
        trigger: "POST /quotes (first ESTIMATE quote issued)"
        actor: SalesDesigner
        preconditions:
          - "Project.status == DESIGNED"
        side_effects:
          - "create Quote with variant=ESTIMATE, revision_no = (max existing revision_no on project)+1"
          - "increments Project.version by 1"

      - from: QUOTED
        to: PERMITTING
        trigger: "POST /quotes/{id}/accept"
        actor: Homeowner
        preconditions:
          - "Quote.status == ISSUED and Quote.project_id == this Project.id"
          - "expected_project_version matches Project.version (OCC)"
        side_effects:
          - "set accepted Quote.status = ACCEPTED; set every OTHER ISSUED Quote on this Project to SUPERSEDED"
          - "set Project.accepted_quote_id = accepted Quote.id"
          - "increments Project.version by 1"
        note: "OCC guard: see §1.2.1 quote-accept-stale-project."

      - from: PERMITTING
        to: APPROVED_TO_BUILD
        trigger: "system: PermitApplication transitions to APPROVED for this project"
        actor: system
        preconditions:
          - "Project.status == PERMITTING"
          - "the project's PermitApplication.status becomes APPROVED"
          - "if Project.requires_engineering, an EngineeringReview for that permit is PASSED"
        side_effects:
          - "increments Project.version by 1"

      - from: APPROVED_TO_BUILD
        to: IN_MANUFACTURE
        trigger: "POST /manufacture-orders"
        actor: Manufacturer
        preconditions:
          - "Project.status == APPROVED_TO_BUILD (which structurally guarantees a non-null accepted_quote_id)"
          - "the project's APPROVED PermitApplication has not expired: clock_now < expires_at (else ERR_PERMIT_EXPIRED)"
        side_effects:
          - "create ManufactureOrder QUEUED; compute lead_time_days + promised_ready_at"
          - "increments Project.version by 1"

      - from: IN_MANUFACTURE
        to: INSTALLING
        trigger: "POST /install-jobs"
        actor: InstallManager
        preconditions:
          - "Project.status == IN_MANUFACTURE"
          - "the project's ManufactureOrder.status == READY"
          - "scheduled_start < scheduled_end (half-open window)"
          - "assigned InstallCrew.active == true; if structure_type==FOUR_SEASON, crew.certified_four_season == true"
          - "no crew double-booking: no non-terminal InstallJob on this crew overlaps [scheduled_start, scheduled_end) (no buffer)"
          - "no site conflict: no non-terminal InstallJob on this project whose window expanded by SITE_REST_BUFFER_HOURS (24h) on both ends intersects [scheduled_start, scheduled_end)"
        side_effects:
          - "create InstallJob (progress=SCHEDULED, weather=CLEAR)"
          - "increments Project.version by 1"

      - from: INSTALLING
        to: INSPECTING
        trigger: "POST /inspections"
        actor: InstallManager
        preconditions:
          - "Project.status == INSTALLING"
          - "the project's InstallJob.progress_status == INSTALLED"
        side_effects:
          - "create Inspection SCHEDULED, attempt_no = (max attempt_no on project)+1"
          - "increments Project.version by 1"

      - from: INSPECTING
        to: COMPLETED
        trigger: "POST /inspections/{id}/pass"
        actor: Inspector
        preconditions:
          - "Project.status == INSPECTING"
          - "Inspection.result == SCHEDULED"
        side_effects:
          - "set Inspection.result = PASSED"
          - "create Warranty (compute term_years, starts_at=now, expires_at) via calc warranty_term"
          - "increments Project.version by 1"

      - from: INSPECTING
        to: INSTALLING
        trigger: "POST /inspections/{id}/fail"
        actor: Inspector
        preconditions:
          - "Project.status == INSPECTING"
          - "Inspection.result == SCHEDULED"
          - "punchlist_items >= 1"
        side_effects:
          - "set Inspection.result = FAILED_PUNCHLIST"
          - "reopen the InstallJob: set progress_status = IN_PROGRESS (punchlist rework)"
          - "increments Project.version by 1"
        note: "Cyclic: failed inspection sends the project back to INSTALLING for rework, then a new inspection."

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: Homeowner
        preconditions: ["Project.status in {DRAFT, MEASURED, DESIGNED, QUOTED, PERMITTING}"]
        side_effects:
          - "set all ISSUED Quotes to SUPERSEDED"
          - "set the project's SUBMITTED/IN_REVIEW PermitApplication (if any) to EXPIRED"
          - "increments Project.version by 1"
        note: "from: applies to any non-terminal pre-build state listed in preconditions."

  # ----- Measurement: linear accept/supersede -----
  - entity: Measurement
    initial_state: PENDING
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /measurements/{id}/accept"
        actor: SalesDesigner
        preconditions: ["Measurement.status == PENDING", "Project not CANCELLED/COMPLETED"]
        side_effects: ["drives Project DRAFT->MEASURED or DESIGNED->MEASURED"]
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: a newer Measurement is accepted on the same project"
        actor: system
        preconditions: ["a new PENDING Measurement on the same project is accepted"]
        side_effects: ["none beyond status flip"]

  # ----- Quote: branching accept/reject + supersede -----
  - entity: Quote
    initial_state: ISSUED
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: Homeowner
        preconditions:
          - "Quote.status == ISSUED"
          - "expected_project_version matches Project.version (OCC)"
        side_effects:
          - "set Project.accepted_quote_id; supersede sibling ISSUED quotes; drive Project QUOTED->PERMITTING"
      - from: ISSUED
        to: REJECTED
        trigger: "POST /quotes/{id}/reject"
        actor: Homeowner
        preconditions: ["Quote.status == ISSUED"]
        side_effects: ["none; project stays QUOTED awaiting a new quote or cancel"]
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: a re-measure or a sibling accept invalidates this ISSUED quote"
        actor: system
        preconditions: ["Quote.status == ISSUED"]
        side_effects: ["none beyond status flip"]

  # ----- FinancingApplication: branching approve/decline (divergent side-effects) -----
  - entity: FinancingApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DECLINED]
    note: "Branching fork: one /decide endpoint resolves to APPROVED or DECLINED with divergent side-effect sets (APPROVED computes apr_bps+monthly_payment; DECLINED computes nothing)."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /financing-applications/{id}/decide"
        actor: SalesDesigner
        preconditions:
          - "FinancingApplication.status == SUBMITTED"
          - "credit_score >= MIN_APPROVAL_SCORE (650)"
          - "amount_financed_cents <= MAX_PRINCIPAL_CENTS (7500000)"
        side_effects: ["set apr_bps + monthly_payment_cents via calc financing_apr_tier + financing_monthly_payment"]
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /financing-applications/{id}/decide"
        actor: SalesDesigner
        preconditions:
          - "FinancingApplication.status == SUBMITTED"
          - "credit_score < MIN_APPROVAL_SCORE OR amount_financed_cents > MAX_PRINCIPAL_CENTS"
        side_effects: ["none beyond status flip; apr_bps and monthly_payment_cents remain unset"]

  # ----- PermitApplication: cyclic resubmission + HOA + engineering gate -----
  - entity: PermitApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /permit-applications/{id}/begin-review"
        actor: PermitOfficer
        preconditions: ["PermitApplication.status == SUBMITTED"]
        side_effects: ["if hoa_required and hoa_status==NOT_REQUIRED, set hoa_status=PENDING"]
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /permit-applications/{id}/decide (outcome=APPROVED)"
        actor: PermitOfficer
        preconditions:
          - "PermitApplication.status == IN_REVIEW"
          - "if hoa_required, hoa_status == HOA_APPROVED"
          - "if Project.requires_engineering, an EngineeringReview for this permit is PASSED"
        side_effects:
          - "set expires_at = clock_now + PERMIT_VALIDITY_DAYS days (PERMIT_VALIDITY_DAYS = 180)"
          - "drive Project PERMITTING -> APPROVED_TO_BUILD"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /permit-applications/{id}/decide (outcome=REJECTED)"
        actor: PermitOfficer
        preconditions: ["PermitApplication.status == IN_REVIEW"]
        side_effects: ["none; awaits resubmission"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /permit-applications/{id}/resubmit"
        actor: Homeowner
        preconditions:
          - "PermitApplication.status == REJECTED"
          - "resubmission_count < MAX_RESUBMISSIONS (3)"
        side_effects:
          - "increment resubmission_count by 1"
        note: "Cyclic: rejected permits loop back to SUBMITTED until the resubmission cap is hit."
      - from: APPROVED
        to: EXPIRED
        trigger: "system: logical clock passes expires_at while Project still PERMITTING/APPROVED_TO_BUILD"
        actor: system
        preconditions: ["clock now >= expires_at", "no ManufactureOrder yet created"]
        side_effects: ["none beyond status flip"]
        note: "Evaluated lazily on read/transition against the logical clock."

  # ----- EngineeringReview: pass/fail with cascade back to permit -----
  - entity: EngineeringReview
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /engineering-reviews/{id}/rule"
        actor: PermitOfficer
        preconditions:
          - "EngineeringReview.status == PENDING"
          - "rated_wind_mph >= required_wind_mph AND rated_snow_psf >= required_snow_psf"
        side_effects: ["none; unblocks the permit approve transition"]
      - from: PENDING
        to: FAILED
        trigger: "POST /engineering-reviews/{id}/rule"
        actor: PermitOfficer
        preconditions:
          - "EngineeringReview.status == PENDING"
          - "rated_wind_mph < required_wind_mph OR rated_snow_psf < required_snow_psf"
        side_effects:
          - "if the linked PermitApplication.status == IN_REVIEW, set it to REJECTED (engineering failure rejects the permit)"

  # ----- ManufactureOrder: linear build with final-quote reconciliation -----
  - entity: ManufactureOrder
    initial_state: QUEUED
    terminal_states: [READY, CANCELLED]
    transitions:
      - from: QUEUED
        to: IN_PRODUCTION
        trigger: "POST /manufacture-orders/{id}/start"
        actor: Manufacturer
        preconditions: ["ManufactureOrder.status == QUEUED"]
        side_effects:
          - "create a FINAL-variant Quote (revision_no+1, variant=FINAL) recomputed against current measurement; supersede the prior ACCEPTED quote and repoint Project.accepted_quote_id to the FINAL quote"
        note: "Dual-variant reconciliation: final price computed at production start may differ from the design-time estimate."
      - from: IN_PRODUCTION
        to: READY
        trigger: "POST /manufacture-orders/{id}/ready"
        actor: Manufacturer
        preconditions: ["ManufactureOrder.status == IN_PRODUCTION"]
        side_effects: ["set ready_at = clock now"]
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel (cascade)"
        actor: Homeowner
        preconditions: ["ManufactureOrder.status in {QUEUED, IN_PRODUCTION}"]
        side_effects: ["none beyond status flip"]

  # ----- InstallJob: PARALLEL dimensions (progress axis × weather axis) -----
  - entity: InstallJob
    initial_state: SCHEDULED
    terminal_states: [INSTALLED]
    note: "Two INDEPENDENT axes on one row that evolve separately: progress_status (SCHEDULED->IN_PROGRESS->INSTALLED) and weather_status (CLEAR<->WEATHER_HOLD). The weather axis gates the progress START and COMPLETE transitions but is never changed by them; progress transitions never touch weather_status and vice-versa."
    transitions:
      # --- progress axis ---
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /install-jobs/{id}/start"
        actor: InstallManager
        preconditions:
          - "progress_status == SCHEDULED"
          - "weather_status == CLEAR"
          - "forecast_wind_mph <= assigned InstallCrew.max_wind_mph"
        side_effects: ["progress_status -> IN_PROGRESS (weather_status untouched)"]
      - from: IN_PROGRESS
        to: INSTALLED
        trigger: "POST /install-jobs/{id}/complete"
        actor: InstallManager
        preconditions: ["progress_status == IN_PROGRESS", "weather_status == CLEAR"]
        side_effects: ["progress_status -> INSTALLED (weather_status untouched); enables Project INSTALLING->INSPECTING"]
      # --- weather axis (parallel; raised/cleared independently of progress) ---
      - from: CLEAR
        to: WEATHER_HOLD
        trigger: "POST /install-jobs/{id}/weather (weather_status=WEATHER_HOLD)"
        actor: InstallManager
        preconditions: ["weather_status == CLEAR", "progress_status in {SCHEDULED, IN_PROGRESS}"]
        side_effects: ["weather_status -> WEATHER_HOLD (progress_status untouched)"]
        note: "Parallel axis: a weather hold may be raised while progress is SCHEDULED or IN_PROGRESS."
      - from: WEATHER_HOLD
        to: CLEAR
        trigger: "POST /install-jobs/{id}/weather (weather_status=CLEAR)"
        actor: InstallManager
        preconditions: ["weather_status == WEATHER_HOLD"]
        side_effects: ["weather_status -> CLEAR (progress_status untouched)"]

  # ----- Inspection: pass/fail (fail loops project back) -----
  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspections/{id}/pass"
        actor: Inspector
        preconditions: ["Inspection.result == SCHEDULED"]
        side_effects: ["drive Project INSPECTING->COMPLETED; create Warranty"]
      - from: SCHEDULED
        to: FAILED_PUNCHLIST
        trigger: "POST /inspections/{id}/fail"
        actor: Inspector
        preconditions: ["Inspection.result == SCHEDULED", "punchlist_items >= 1"]
        side_effects: ["drive Project INSPECTING->INSTALLING; reopen InstallJob progress_status to IN_PROGRESS"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-accept-stale-project
    parent_entity: Project
    write_endpoint: "POST /quotes/{id}/accept"
    occ_field: "expected_project_version"
    description: |
      Accepting a Quote against a Project whose version has advanced since the
      client last observed it is rejected with a stale-version error. This
      captures the case where the design was re-measured (which supersedes all
      ISSUED quotes and bumps Project.version) after the client loaded the quote
      list, so the quote the client is trying to accept no longer reflects the
      current project state.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: footprint_area
    trigger: "on Measurement accept (Project DRAFT->MEASURED and DESIGNED->MEASURED transitions)"
    algorithm: aggregation
    formula: |
      footprint_sqft = round_half_up( (width_in * depth_in) / 144.0 , 2 )
    input_set: "the single ACCEPTED Measurement's width_in and depth_in"
    constants:
      SQIN_PER_SQFT: 144
    precision: "2 decimal places, round_half_up"

  - name: engineering_requirement
    trigger: "on Project finalize-design (MEASURED->DESIGNED)"
    algorithm: threshold
    formula: |
      requires_engineering =
        (structure_type == FOUR_SEASON)
        OR (ground_snow_load_psf > SNOW_THRESHOLD_PSF)
        OR (design_wind_speed_mph >= WIND_THRESHOLD_MPH)
    input_set: "Project.structure_type, owning Homeowner.ground_snow_load_psf, Homeowner.design_wind_speed_mph"
    constants:
      SNOW_THRESHOLD_PSF: 30
      WIND_THRESHOLD_MPH: 130
    precision: "boolean"
    note: "Boundary precision: snow uses strict > 30 (30.0 does NOT trigger); wind uses >= 130 (exactly 130 triggers)."

  - name: quote_base_price
    trigger: "on Quote creation (ESTIMATE at design; FINAL at manufacture start)"
    algorithm: tiered_pricing
    formula: |
      rate_per_sqft_cents = BASE_RATE_CENTS[structure_type]   # SCREEN_ROOM/THREE_SEASON/FOUR_SEASON
      material_multiplier_milli = MATERIAL_MULT_MILLI[material] # in thousandths
      raw_cents = footprint_sqft * rate_per_sqft_cents * material_multiplier_milli / 1000
      base_price_cents = round_half_up(raw_cents)   # integer cents
    input_set: "Project.footprint_sqft (from the currently ACCEPTED measurement), structure_type, material"
    constants:
      BASE_RATE_CENTS: { SCREEN_ROOM: 4500, THREE_SEASON: 9000, FOUR_SEASON: 16000 }
      MATERIAL_MULT_MILLI: { ALUMINUM: 1000, VINYL: 1150, THERMAL_BREAK_ALUMINUM: 1300 }
    precision: "integer cents, round_half_up on the final product"
    variants:
      - name: ESTIMATE
        when: "first computed at design time (Project DESIGNED->QUOTED), using the originally accepted measurement"
        difference: "uses the measurement accepted at design time; this is the provisional price the Homeowner accepts"
      - name: FINAL
        when: "recomputed at manufacture start (ManufactureOrder QUEUED->IN_PRODUCTION) against the CURRENTLY accepted measurement"
        difference: "if a re-measure changed footprint_sqft, FINAL base_price_cents differs from the ESTIMATE; the FINAL quote supersedes the accepted ESTIMATE quote"

  - name: quote_addons_total
    trigger: "on Quote creation (both variants)"
    algorithm: aggregation
    formula: |
      addons_cents = 0
      if NOT measurement.existing_slab: addons_cents += SLAB_POUR_CENTS
      if Project.requires_engineering:  addons_cents += ENGINEERING_STAMP_CENTS
      if Project.requires_hoa:          addons_cents += HOA_FILING_CENTS
    input_set: "the currently ACCEPTED Measurement.existing_slab, Project.requires_engineering, Project.requires_hoa"
    constants:
      SLAB_POUR_CENTS: 320150
      ENGINEERING_STAMP_CENTS: 95075
      HOA_FILING_CENTS: 25033
    precision: "integer cents"
    note: "Add-on cents are deliberately NOT round multiples of 1000 so that taxing each line item separately vs taxing the sum can diverge by a cent — see quote_tax order pin."

  - name: quote_tax
    trigger: "on Quote creation (both variants); evaluation order pinned: base -> addons -> tax -> total"
    algorithm: threshold
    formula: |
      # Rounding ORDER IS PINNED: tax is computed ONCE on the SUM of all taxable
      # line items (base_price_cents + addons_cents), then rounded — NOT by rounding
      # each line item's tax and summing those. "sum-then-round", never "round-per-line".
      #   sum_then_round  = round_half_up( (base_price_cents + addons_cents) * TAX_RATE_MILLI / 1000 )   # the rule
      #   round_per_line  = round_half_up(base*r) + round_half_up(slab*r) + round_half_up(eng*r) + ...    # FORBIDDEN
      # These can differ by one cent (e.g. base=517500, slab=320150, eng=95075 -> sum-then-round=69954, per-line=69955).
      taxable_cents = base_price_cents + addons_cents
      tax_cents = round_half_up( taxable_cents * TAX_RATE_MILLI / 1000 )
      total_cents = base_price_cents + addons_cents + tax_cents
    input_set: "base_price_cents and addons_cents already computed for this Quote"
    constants:
      TAX_RATE_MILLI: 75   # 7.5% expressed in thousandths
    precision: "integer cents, single round_half_up applied AFTER summing base+addons (sum-then-round, not round-per-line)"
    note: "Two pins here: (1) rounding ORDER (sum-then-round); (2) circular-looking dependency — total depends on tax, tax depends on (base+addons); evaluation order base->addons->tax->total is fixed so every value is well-defined."

  - name: financing_apr_tier
    trigger: "on FinancingApplication decide (SUBMITTED->APPROVED)"
    algorithm: tiered_pricing
    formula: |
      if   credit_score >= 760: apr_bps = 599
      elif credit_score >= 700: apr_bps = 999
      elif credit_score >= 650: apr_bps = 1499
      else: (not approvable — DECLINED path)
    input_set: "FinancingApplication.credit_score"
    constants:
      TIER_EXCELLENT_MIN: 760
      TIER_GOOD_MIN: 700
      TIER_FAIR_MIN: 650
      APR_EXCELLENT_BPS: 599
      APR_GOOD_BPS: 999
      APR_FAIR_BPS: 1499
      MIN_APPROVAL_SCORE: 650      # credit_score < this -> DECLINED (gate, not a tier)
      MAX_PRINCIPAL_CENTS: 7500000 # amount_financed above this -> DECLINED (ERR_PRINCIPAL_EXCEEDED)
    precision: "integer basis points"
    note: "Boundary precision: tier cutoffs use >= (a 700 score gets APR_GOOD, not APR_FAIR; a 650 score gets APR_FAIR and is approvable; a 649 is DECLINED)."

  - name: financing_monthly_payment
    trigger: "on FinancingApplication decide (SUBMITTED->APPROVED), after apr_bps selected"
    algorithm: aggregation
    formula: |
      # Standard amortization. Order pinned: principal -> monthly rate -> payment.
      P = amount_financed_cents                  # principal, integer cents
      r = (apr_bps / 10000.0) / 12.0             # monthly rate
      n = term_months
      if r == 0: monthly_payment_cents = round_half_up(P / n)
      else:
        factor = (r * (1+r)**n) / ((1+r)**n - 1)
        monthly_payment_cents = round_half_up(P * factor)
    input_set: "amount_financed_cents, apr_bps (from financing_apr_tier), term_months"
    constants: {}
    precision: "integer cents, round_half_up once on the final payment"

  - name: manufacture_lead_time
    trigger: "on ManufactureOrder creation (Project APPROVED_TO_BUILD->IN_MANUFACTURE)"
    algorithm: threshold
    formula: |
      base_days = MATERIAL_BASE_DAYS[material]
      if footprint_sqft > LARGE_FOOTPRINT_SQFT: base_days += LARGE_SURCHARGE_DAYS
      if structure_type == FOUR_SEASON: base_days += FOUR_SEASON_SURCHARGE_DAYS
      lead_time_days = base_days
      promised_ready_at = clock_now + lead_time_days days
    input_set: "Project.material, Project.footprint_sqft, Project.structure_type"
    constants:
      MATERIAL_BASE_DAYS: { ALUMINUM: 21, VINYL: 28, THERMAL_BREAK_ALUMINUM: 35 }
      LARGE_FOOTPRINT_SQFT: 200
      LARGE_SURCHARGE_DAYS: 14
      FOUR_SEASON_SURCHARGE_DAYS: 10
    precision: "integer days"
    note: "Boundary precision: large surcharge uses strict > 200 sqft (exactly 200.00 does NOT surcharge)."
    variants:
      - name: PROMISED
        when: "computed at ManufactureOrder creation; promised_ready_at = clock_now + lead_time_days days"
        difference: "the planning estimate stamped at order time; uses the clock as it stood when the order was created"
      - name: ACTUAL
        when: "recorded at ManufactureOrder ready (IN_PRODUCTION->READY); ready_at = clock_now at that moment"
        difference: "the realized completion instant; if the logical clock advanced more or less than lead_time_days between order and ready, ready_at differs from promised_ready_at — the elapsed actual lead time (ready_at - created_at) diverges from the promised lead_time_days"

  - name: warranty_term
    trigger: "on Inspection pass (Project INSPECTING->COMPLETED)"
    algorithm: threshold
    formula: |
      term_years = WARRANTY_YEARS[structure_type]
      starts_at = clock_now
      expires_at = starts_at + term_years*365 days
    input_set: "Project.structure_type at completion"
    constants:
      WARRANTY_YEARS: { SCREEN_ROOM: 1, THREE_SEASON: 5, FOUR_SEASON: 10 }
    precision: "integer years; expires_at to the day"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the role is permitted to call this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "for entity_backed Homeowner acting on a Project/Quote/Financing, X-User-ID equals the owning Homeowner.id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /projects/{id}/cancel, POST /quotes/{id}/accept, POST /quotes/{id}/reject, POST /financing-applications, POST /permit-applications/{id}/resubmit"

  - priority: 4
    category: existence
    check: "every path id and every body FK resolves to an existing entity, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 5
    category: state
    check: "the target entity is in a state from which the requested transition is allowed (§1.2 from:)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_project_version equals current Project.version on quote accept"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /quotes/{id}/accept"

  - priority: 7
    category: business_safety
    check: "engineering ruling: a structure cannot pass if rated_wind_mph < required_wind_mph or rated_snow_psf < required_snow_psf"
    error_id: ERR_ENGINEERING_UNDERRATED
    http_status: 422
    applies_to: "POST /engineering-reviews/{id}/rule"

  - priority: 8
    category: business_safety
    check: "an install cannot START while weather_status == WEATHER_HOLD or forecast_wind_mph > crew.max_wind_mph"
    error_id: ERR_WEATHER_UNSAFE
    http_status: 409
    applies_to: "POST /install-jobs/{id}/start, POST /install-jobs/{id}/complete"

  - priority: 9
    category: business_constraint
    check: "a FOUR_SEASON project may only be assigned to a crew with certified_four_season == true"
    error_id: ERR_CREW_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /install-jobs"

  - priority: 10
    category: business_constraint
    check: "the assigned crew must be active == true"
    error_id: ERR_CREW_INACTIVE
    http_status: 422
    applies_to: "POST /install-jobs"

  - priority: 11
    category: business_temporal
    check: "scheduled_start < scheduled_end (half-open window, start strictly before end)"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /install-jobs"

  - priority: 12
    category: business_temporal
    check: "the assigned crew has no other non-terminal InstallJob whose [scheduled_start, scheduled_end) overlaps this window — pure half-open overlap with NO buffer/adjacency allowance (a job ending exactly at another's start does NOT conflict)"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /install-jobs"

  - priority: 13
    category: business_temporal
    check: "the SAME project has no other non-terminal InstallJob whose window — expanded by SITE_REST_BUFFER_HOURS (24h) on BOTH ends — intersects the requested [scheduled_start, scheduled_end); i.e. two install visits on one site must be separated by at least 24h of rest, so adjacency within the buffer IS a conflict (buffered closed-interval semantics, distinct from the crew rule's no-buffer half-open semantics)"
    error_id: ERR_SITE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /install-jobs"

  - priority: 14
    category: business_temporal
    check: "creating a manufacture order is rejected when the project's APPROVED PermitApplication has logical-clock-now >= expires_at (the permit has lapsed into EXPIRED and can no longer authorize a build)"
    error_id: ERR_PERMIT_EXPIRED
    http_status: 409
    applies_to: "POST /manufacture-orders"

  - priority: 15
    category: business_constraint
    check: "resubmission cap: a permit cannot resubmit when resubmission_count >= MAX_RESUBMISSIONS (3)"
    error_id: ERR_RESUBMIT_LIMIT
    http_status: 409
    applies_to: "POST /permit-applications/{id}/resubmit"

  - priority: 16
    category: business_constraint
    check: "HOA gate: a permit cannot be APPROVED while hoa_required and hoa_status != HOA_APPROVED"
    error_id: ERR_HOA_NOT_APPROVED
    http_status: 409
    applies_to: "POST /permit-applications/{id}/decide (outcome=APPROVED)"

  - priority: 17
    category: business_constraint
    check: "engineering gate: a permit cannot be APPROVED while Project.requires_engineering and no PASSED EngineeringReview exists for it"
    error_id: ERR_ENGINEERING_PENDING
    http_status: 409
    applies_to: "POST /permit-applications/{id}/decide (outcome=APPROVED)"

  - priority: 18
    category: business_fiscal
    check: "financing principal cannot exceed MAX_PRINCIPAL_CENTS (7500000) — decided rows above this are DECLINED, not APPROVED"
    error_id: ERR_PRINCIPAL_EXCEEDED
    http_status: 422
    applies_to: "POST /financing-applications/{id}/decide"

  - priority: 19
    category: business_fiscal
    check: "down_payment_cents cannot exceed the accepted Quote.total_cents (would yield negative principal)"
    error_id: ERR_DOWNPAYMENT_EXCEEDS_TOTAL
    http_status: 422
    applies_to: "POST /financing-applications"

  - priority: 20
    category: business_constraint
    check: "inspection fail requires punchlist_items >= 1; passing requires punchlist_items == 0 in the request"
    error_id: ERR_PUNCHLIST_REQUIRED
    http_status: 422
    applies_to: "POST /inspections/{id}/fail"

  - priority: 21
    category: existence
    check: "request body required fields present and well-typed; enum values within declared sets"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH"

  - priority: 22
    category: business_constraint
    check: "pagination limit within [1,100] and offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Homeowner ----
  - method: POST
    path: "/homeowners"
    description: "Register a homeowner."
    roles: [SalesDesigner]
    code: 201
    input: [email, full_name, "hoa_governed?", ground_snow_load_psf, design_wind_speed_mph]
    output: Homeowner
    side_effects: []

  # ---- Project ----
  - method: POST
    path: "/projects"
    description: "Create a project in DRAFT for a homeowner."
    roles: [SalesDesigner]
    code: 201
    input: [homeowner_id, address_line, structure_type, material]
    output: Project
    side_effects: ["Project.status=DRAFT; version=1"]
  - method: GET
    path: "/projects"
    description: "List projects, filterable by homeowner_id (reverse-reachability for Project.homeowner_id)."
    roles: [SalesDesigner, Homeowner, InstallManager]
    code: 200
    input: ["homeowner_id?", "status?", "limit?", "offset?"]
    output: Project[]
  - method: GET
    path: "/projects/{id}"
    description: "Fetch a project."
    roles: [SalesDesigner, Homeowner, InstallManager, Manufacturer, PermitOfficer, Inspector]
    code: 200
    input: []
    output: Project
  - method: POST
    path: "/projects/{id}/finalize-design"
    description: "Lock structure_type/material design; MEASURED->DESIGNED; compute requires_engineering/requires_hoa."
    roles: [SalesDesigner]
    code: 200
    input: []
    output: Project
    side_effects: ["compute requires_engineering (calc engineering_requirement), requires_hoa; increments Project.version by 1"]
  - method: POST
    path: "/projects/{id}/cancel"
    description: "Cancel a non-terminal pre-build project; cascades to quotes/permit/manufacture."
    roles: [Homeowner]
    code: 200
    input: []
    output: Project
    side_effects: ["supersede ISSUED quotes; expire SUBMITTED/IN_REVIEW permit; cancel QUEUED/IN_PRODUCTION manufacture; increments Project.version by 1"]
  # ---- Project sub-resources (FK reverse-reachability for *.project_id) ----
  - method: GET
    path: "/projects/{id}/measurements"
    description: "List a project's measurements (reverse-reachability for Measurement.project_id)."
    roles: [SalesDesigner, Homeowner]
    code: 200
    input: ["limit?", "offset?"]
    output: Measurement[]
  - method: GET
    path: "/projects/{id}/quotes"
    description: "List a project's quotes (reverse-reachability for Quote.project_id; accepted_quote_id is discoverable here)."
    roles: [SalesDesigner, Homeowner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Quote[]
  - method: GET
    path: "/projects/{id}/permit-applications"
    description: "List a project's permit applications (reverse-reachability for PermitApplication.project_id)."
    roles: [SalesDesigner, Homeowner, PermitOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PermitApplication[]
  - method: GET
    path: "/projects/{id}/manufacture-orders"
    description: "List a project's manufacture orders (reverse-reachability for ManufactureOrder.project_id)."
    roles: [Manufacturer, InstallManager, SalesDesigner]
    code: 200
    input: ["limit?", "offset?"]
    output: ManufactureOrder[]
  - method: GET
    path: "/projects/{id}/install-jobs"
    description: "List a project's install jobs (reverse-reachability for InstallJob.project_id)."
    roles: [InstallManager, SalesDesigner, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: InstallJob[]
  - method: GET
    path: "/projects/{id}/inspections"
    description: "List a project's inspections (reverse-reachability for Inspection.project_id)."
    roles: [Inspector, InstallManager, SalesDesigner]
    code: 200
    input: ["limit?", "offset?"]
    output: Inspection[]
  - method: GET
    path: "/projects/{id}/warranties"
    description: "List a project's warranties (reverse-reachability for Warranty.project_id; 1:1 so array of 0-1)."
    roles: [Homeowner, SalesDesigner, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: Warranty[]

  # ---- Measurement ----
  - method: POST
    path: "/measurements"
    description: "Record a field measurement (PENDING) for a project."
    roles: [SalesDesigner]
    code: 201
    input: [project_id, width_in, depth_in, wall_height_in, "existing_slab?"]
    output: Measurement
    side_effects: []
  - method: POST
    path: "/measurements/{id}/accept"
    description: "Accept a PENDING measurement; drives Project DRAFT->MEASURED or DESIGNED->MEASURED; supersedes prior accepted measurement and ISSUED quotes on re-measure."
    roles: [SalesDesigner]
    code: 200
    input: []
    output: Measurement
    side_effects: ["copy width/depth to Project; recompute footprint_sqft (calc footprint_area); on re-measure supersede prior ACCEPTED measurement and all ISSUED quotes; increments Project.version by 1"]

  # ---- Quote ----
  - method: POST
    path: "/quotes"
    description: "Issue an ESTIMATE quote for a DESIGNED project; drives DESIGNED->QUOTED."
    roles: [SalesDesigner]
    code: 201
    input: [project_id]
    output: Quote
    side_effects: ["compute base_price (calc quote_base_price), addons (quote_addons_total), tax (quote_tax); revision_no assigned; increments Project.version by 1"]
  - method: GET
    path: "/quotes/{id}"
    description: "Fetch a quote."
    roles: [SalesDesigner, Homeowner]
    code: 200
    input: []
    output: Quote
  - method: GET
    path: "/quotes/{id}/financing-applications"
    description: "List a quote's financing applications (reverse-reachability for FinancingApplication.quote_id)."
    roles: [SalesDesigner, Homeowner]
    code: 200
    input: ["limit?", "offset?"]
    output: FinancingApplication[]
  - method: POST
    path: "/quotes/{id}/accept"
    description: "Homeowner accepts an ISSUED quote (OCC on Project.version); drives QUOTED->PERMITTING; supersedes sibling ISSUED quotes."
    roles: [Homeowner]
    code: 200
    input: [expected_project_version]
    output: Quote
    side_effects: ["set Project.accepted_quote_id; supersede sibling ISSUED quotes; drive Project to PERMITTING; increments Project.version by 1"]
  - method: POST
    path: "/quotes/{id}/reject"
    description: "Homeowner rejects an ISSUED quote."
    roles: [Homeowner]
    code: 200
    input: []
    output: Quote
    side_effects: ["set Quote.status=REJECTED"]

  # ---- Financing ----
  - method: POST
    path: "/financing-applications"
    description: "Submit a financing application against an accepted quote."
    roles: [Homeowner]
    code: 201
    input: [project_id, quote_id, down_payment_cents, term_months, credit_score]
    output: FinancingApplication
    side_effects: ["compute amount_financed_cents = Quote.total_cents - down_payment_cents"]
  - method: POST
    path: "/financing-applications/{id}/decide"
    description: "Underwriter decides: APPROVED (compute apr_bps + monthly_payment) or DECLINED per credit_score/principal gates."
    roles: [SalesDesigner]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: ["on approve compute apr_bps (calc financing_apr_tier) + monthly_payment_cents (calc financing_monthly_payment)"]

  # ---- Permit ----
  - method: POST
    path: "/permit-applications"
    description: "Submit a building permit application for a PERMITTING project; copies requires_hoa."
    roles: [SalesDesigner, Homeowner]
    code: 201
    input: [project_id, jurisdiction_code]
    output: PermitApplication
    side_effects: ["set hoa_required from Project.requires_hoa; hoa_status=NOT_REQUIRED or PENDING"]
  - method: GET
    path: "/permit-applications/{id}"
    description: "Fetch a permit application (lazily evaluates EXPIRED against logical clock)."
    roles: [SalesDesigner, Homeowner, PermitOfficer]
    code: 200
    input: []
    output: PermitApplication
  - method: GET
    path: "/permit-applications/{id}/engineering-reviews"
    description: "List a permit's engineering reviews (reverse-reachability for EngineeringReview.permit_application_id)."
    roles: [SalesDesigner, PermitOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: EngineeringReview[]
  - method: POST
    path: "/permit-applications/{id}/begin-review"
    description: "PermitOfficer starts review; SUBMITTED->IN_REVIEW."
    roles: [PermitOfficer]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["if hoa_required, set hoa_status=PENDING"]
  - method: POST
    path: "/permit-applications/{id}/hoa-decision"
    description: "PermitOfficer records the HOA review outcome (HOA_APPROVED or HOA_DENIED)."
    roles: [PermitOfficer]
    code: 200
    input: [hoa_status]
    output: PermitApplication
    side_effects: ["set hoa_status"]
  - method: POST
    path: "/permit-applications/{id}/decide"
    description: "PermitOfficer rules on the permit: APPROVED (sets expires_at, drives Project to APPROVED_TO_BUILD, gated by HOA+engineering) or REJECTED."
    roles: [PermitOfficer]
    code: 200
    input: [outcome]
    output: PermitApplication
    side_effects: ["on APPROVED set expires_at = clock_now + PERMIT_VALIDITY_DAYS and drive Project to APPROVED_TO_BUILD (increments Project.version by 1); on REJECTED no further effects"]
  - method: POST
    path: "/permit-applications/{id}/resubmit"
    description: "Homeowner resubmits a REJECTED permit; REJECTED->SUBMITTED; increments resubmission_count (capped)."
    roles: [Homeowner]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["increment resubmission_count by 1"]

  # ---- Engineering ----
  - method: POST
    path: "/engineering-reviews"
    description: "Submit a structural engineering review for a permit; copies required wind/snow from Homeowner."
    roles: [SalesDesigner]
    code: 201
    input: [permit_application_id, project_id, rated_wind_mph, rated_snow_psf]
    output: EngineeringReview
    side_effects: ["copy required_wind_mph/required_snow_psf from Homeowner"]
  - method: POST
    path: "/engineering-reviews/{id}/rule"
    description: "PermitOfficer rules PASSED/FAILED based on rated vs required; FAILED rejects an IN_REVIEW permit."
    roles: [PermitOfficer]
    code: 200
    input: []
    output: EngineeringReview
    side_effects: ["on FAILED, if linked permit IN_REVIEW set it REJECTED"]

  # ---- Manufacture ----
  - method: POST
    path: "/manufacture-orders"
    description: "Create a manufacture order for an APPROVED_TO_BUILD project; computes lead_time + promised_ready_at; drives APPROVED_TO_BUILD->IN_MANUFACTURE."
    roles: [Manufacturer]
    code: 201
    input: [project_id, quote_id]
    output: ManufactureOrder
    side_effects: ["compute lead_time_days (calc manufacture_lead_time) + promised_ready_at; increments Project.version by 1"]
  - method: POST
    path: "/manufacture-orders/{id}/start"
    description: "Manufacturer starts production; QUEUED->IN_PRODUCTION; issues a FINAL-variant Quote that supersedes the accepted ESTIMATE."
    roles: [Manufacturer]
    code: 200
    input: []
    output: ManufactureOrder
    side_effects: ["create FINAL Quote (calc quote_base_price FINAL variant); supersede accepted ESTIMATE quote; repoint Project.accepted_quote_id; increments Project.version by 1"]
  - method: POST
    path: "/manufacture-orders/{id}/ready"
    description: "Manufacturer marks build READY; IN_PRODUCTION->READY; sets ready_at."
    roles: [Manufacturer]
    code: 200
    input: []
    output: ManufactureOrder
    side_effects: ["set ready_at = clock_now"]

  # ---- Crew ----
  - method: POST
    path: "/crews"
    description: "Register an install crew."
    roles: [InstallManager]
    code: 201
    input: [name, max_wind_mph, "certified_four_season?", "active?"]
    output: InstallCrew
    side_effects: []
  - method: GET
    path: "/crews/{id}"
    description: "Fetch an install crew."
    roles: [InstallManager]
    code: 200
    input: []
    output: InstallCrew
  - method: GET
    path: "/crews/{id}/install-jobs"
    description: "List a crew's install jobs (reverse-reachability for InstallJob.crew_id)."
    roles: [InstallManager, SalesDesigner]
    code: 200
    input: ["limit?", "offset?"]
    output: InstallJob[]

  # ---- Install ----
  - method: POST
    path: "/install-jobs"
    description: "Schedule an install for an IN_MANUFACTURE project with a READY build; drives IN_MANUFACTURE->INSTALLING."
    roles: [InstallManager]
    code: 201
    input: [project_id, crew_id, scheduled_start, scheduled_end, forecast_wind_mph]
    output: InstallJob
    side_effects: ["create InstallJob progress=SCHEDULED weather=CLEAR; increments Project.version by 1"]
  - method: POST
    path: "/install-jobs/{id}/start"
    description: "Begin installation; SCHEDULED->IN_PROGRESS; requires CLEAR weather and forecast within crew limit."
    roles: [InstallManager]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["progress_status -> IN_PROGRESS"]
  - method: POST
    path: "/install-jobs/{id}/weather"
    description: "Set the independent weather axis: HOLD raises a weather hold (CLEAR->WEATHER_HOLD), CLEAR releases it (WEATHER_HOLD->CLEAR). Does not change progress_status."
    roles: [InstallManager]
    code: 200
    input: [weather_status]
    output: InstallJob
    side_effects: ["weather_status -> WEATHER_HOLD or CLEAR per input"]
  - method: POST
    path: "/install-jobs/{id}/complete"
    description: "Finish installation; IN_PROGRESS->INSTALLED (requires CLEAR weather)."
    roles: [InstallManager]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["progress_status -> INSTALLED; enables INSTALLING->INSPECTING"]

  # ---- Inspection ----
  - method: POST
    path: "/inspections"
    description: "Schedule a final inspection for an INSTALLING project whose InstallJob is INSTALLED; drives INSTALLING->INSPECTING."
    roles: [InstallManager]
    code: 201
    input: [project_id, install_job_id]
    output: Inspection
    side_effects: ["create Inspection SCHEDULED, attempt_no=(max on project)+1; increments Project.version by 1"]
  - method: POST
    path: "/inspections/{id}/pass"
    description: "Inspector passes the inspection; drives INSPECTING->COMPLETED; issues Warranty."
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["create Warranty (calc warranty_term); drive Project to COMPLETED; increments Project.version by 1"]
  - method: POST
    path: "/inspections/{id}/fail"
    description: "Inspector fails with a punchlist; drives INSPECTING->INSTALLING; reopens InstallJob."
    roles: [Inspector]
    code: 200
    input: [punchlist_items]
    output: Inspection
    side_effects: ["reopen InstallJob progress_status=IN_PROGRESS; drive Project to INSTALLING; increments Project.version by 1"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock for deterministic time-gated rules (permit expiry, lead time, warranty). Server startup default is 2026-04-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock."
    roles: [SalesDesigner, InstallManager, Manufacturer, PermitOfficer, Inspector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets logical clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "role not permitted for this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Homeowner acting on a project/quote/financing they do not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path id or body FK does not resolve to an existing entity"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, wrong type, or enum value outside declared set"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1,100] or offset < 0"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target entity not in a state from which this transition is allowed"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version != current Project.version on quote accept (OCC)"
  - id: ERR_ENGINEERING_UNDERRATED
    http: 422
    condition: "engineering rule attempted PASS while rated_wind_mph < required_wind_mph or rated_snow_psf < required_snow_psf"
  - id: ERR_ENGINEERING_PENDING
    http: 409
    condition: "permit approve while requires_engineering and no PASSED EngineeringReview exists"
  - id: ERR_HOA_NOT_APPROVED
    http: 409
    condition: "permit approve while hoa_required and hoa_status != HOA_APPROVED"
  - id: ERR_WEATHER_UNSAFE
    http: 409
    condition: "install start/complete while weather_status==WEATHER_HOLD or forecast_wind_mph > crew.max_wind_mph"
  - id: ERR_CREW_NOT_CERTIFIED
    http: 422
    condition: "FOUR_SEASON project assigned to a crew without certified_four_season"
  - id: ERR_CREW_INACTIVE
    http: 422
    condition: "assigned crew has active == false"
  - id: ERR_CREW_DOUBLE_BOOKED
    http: 409
    condition: "assigned crew has an overlapping non-terminal InstallJob window (half-open [start,end), no buffer)"
  - id: ERR_SITE_WINDOW_CONFLICT
    http: 409
    condition: "the same project already has a non-terminal InstallJob whose window, expanded by the SITE_REST_BUFFER_HOURS buffer on both sides, intersects the requested window (closed-interval-with-buffer)"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "scheduled_start >= scheduled_end on install job"
  - id: ERR_PERMIT_EXPIRED
    http: 409
    condition: "manufacture order against a project whose APPROVED permit has passed expires_at"
  - id: ERR_RESUBMIT_LIMIT
    http: 409
    condition: "permit resubmit while resubmission_count >= MAX_RESUBMISSIONS"
  - id: ERR_PRINCIPAL_EXCEEDED
    http: 422
    condition: "financing decide approve while amount_financed_cents > MAX_PRINCIPAL_CENTS"
  - id: ERR_DOWNPAYMENT_EXCEEDS_TOTAL
    http: 422
    condition: "financing submit with down_payment_cents > accepted Quote.total_cents"
  - id: ERR_PUNCHLIST_REQUIRED
    http: 422
    condition: "inspection fail with punchlist_items < 1"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Homeowner
    description: "Property owner; owns projects, accepts/rejects quotes, applies for financing, resubmits permits, cancels."
    identity: "entity_backed:Homeowner"
    exclusive_operations:
      - "POST /quotes/{id}/accept"
      - "POST /quotes/{id}/reject"
      - "POST /financing-applications"
      - "POST /permit-applications/{id}/resubmit"
      - "POST /projects/{id}/cancel"
    shared_operations:
      - "GET /projects, GET /projects/{id}"
      - "GET /quotes/{id}, GET /projects/{id}/quotes, GET /projects/{id}/measurements"
      - "GET /quotes/{id}/financing-applications, GET /projects/{id}/permit-applications, GET /permit-applications/{id}"
      - "GET /projects/{id}/warranties"
      - "POST /permit-applications"
  - name: SalesDesigner
    description: "Sales/design rep; registers homeowners and projects, records/accepts measurements, finalizes design, issues estimate quotes, submits engineering, decides financing."
    identity: "opaque"
    exclusive_operations:
      - "POST /homeowners"
      - "POST /projects"
      - "POST /measurements"
      - "POST /measurements/{id}/accept"
      - "POST /projects/{id}/finalize-design"
      - "POST /quotes"
      - "POST /financing-applications/{id}/decide"
      - "POST /engineering-reviews"
    shared_operations:
      - "POST /permit-applications"
      - "GET endpoints across projects/quotes/measurements/financing/permits/engineering/manufacture/install/inspections/warranties (all the project sub-resource and single-resource reads)"
  - name: PermitOfficer
    description: "Municipal reviewer; runs permit review, HOA decision, the approve/reject decision, and engineering rulings."
    identity: "opaque"
    exclusive_operations:
      - "POST /permit-applications/{id}/begin-review"
      - "POST /permit-applications/{id}/hoa-decision"
      - "POST /permit-applications/{id}/decide"
      - "POST /engineering-reviews/{id}/rule"
    shared_operations:
      - "GET /permit-applications/{id}, GET /projects/{id}/permit-applications, GET /permit-applications/{id}/engineering-reviews, GET /projects/{id}"
  - name: Manufacturer
    description: "Fabrication shop; creates manufacture orders and advances them through production to ready."
    identity: "opaque"
    exclusive_operations:
      - "POST /manufacture-orders"
      - "POST /manufacture-orders/{id}/start"
      - "POST /manufacture-orders/{id}/ready"
    shared_operations:
      - "GET /projects/{id}/manufacture-orders, GET /projects/{id}"
  - name: InstallManager
    description: "Field operations; manages crews, schedules and runs installs (progress + weather axes), schedules inspections."
    identity: "opaque"
    exclusive_operations:
      - "POST /crews"
      - "POST /install-jobs"
      - "POST /install-jobs/{id}/start"
      - "POST /install-jobs/{id}/weather"
      - "POST /install-jobs/{id}/complete"
      - "POST /inspections"
    shared_operations:
      - "GET /crews/{id}, GET /crews/{id}/install-jobs, GET /projects/{id}/install-jobs, GET /projects/{id}/manufacture-orders, GET /projects/{id}/inspections, GET /projects, GET /projects/{id}"
  - name: Inspector
    description: "Code inspector; passes or fails final inspections."
    identity: "opaque"
    exclusive_operations:
      - "POST /inspections/{id}/pass"
      - "POST /inspections/{id}/fail"
    shared_operations:
      - "GET /projects/{id}/inspections, GET /projects/{id}/warranties, GET /projects/{id}/install-jobs, GET /projects/{id}"
