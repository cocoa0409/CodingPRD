            - *c_add_1
            - *c_add_2
            - *c_add_3
            - *c_add_4
            - *c_add_5
            - *c_tr1
            - *c_tr1c
            - *c_tr2
            - *c_tr2c
            - *c_app
            - *c_submit
            - *c_vote1
            - *c_vote2
            - *c_vote3
            - *c_vote4
            - *c_disburse
            - *c_loan1
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-08T00:00:00Z" }
              as: ProgramAdmin
              captures: { sweep: $.data }
          assert:
            - "at 2026-10-08 the oldest due (2026-09-08) is 30 days past -> Loan.${c_loan1_id}.status == DEFAULTED and Member.${c_m1}.status == BLACKLISTED"
            - "Loan.${c_loan1_id}.installments_missed == 4 (dues of Sep 8, 15, 22, 29 all consumed; Oct 6 due is 2 days past, under the 8-day threshold)"
            - "Loan.${c_loan1_id}.next_due_date == 2026-10-13T00:00:00Z (advanced one week per consumed due)"
            - "SavingsAccount of Member.${c_m1} is FROZEN"
            - "a FINAL CreditBureauReport exists for Loan.${c_loan1_id}"

      - name: expansion_capacity_exactly_equal_is_feasible
        claim_type: Constants Applied
        grounds:
          - calculations.expansion_feasibility
        distinguishing_aspect: "The <= comparison makes exact-capacity plans feasible: 1 current manager + 2 hired = 3 managers x 60 members = 180 >= 0 + 180 target, and 3 x 3 - 1 = 8 >= 2 centers — the plan is created SUBMITTED; one more target member (181) makes it infeasible with 409 ERR_EXPANSION_INFEASIBLE."
        test_recipe:
          setup: ["Branch with 1 manager, 1 center, 0 members (tier SMALL: caps 60 members / 3 centers)."]
          setup_api_calls:
            - *c_branch
            - *c_mgr
            - *c_center
          trigger:
            - call: "POST /branches/${c_branch_id}/expansion-plans"
              payload: { new_centers: 2, new_managers_hired: 2, target_new_members: 180 }
              as: BranchManager
              captures: { plan_ok: $.data.id }
            - call: "POST /branches/${c_branch_id}/expansion-plans"
              payload: { new_centers: 2, new_managers_hired: 2, target_new_members: 181 }
              as: BranchManager
              captures: { err_id: $.data.error_id }
          assert:
            - "the first trigger call returns 201 with BranchExpansionPlan.${plan_ok}.status == SUBMITTED"
            - "BranchExpansionPlan.${plan_ok}.feasibility.feasible == true and available_member_capacity == 180"
            - "the second trigger call returns 409 with error_id ERR_EXPANSION_INFEASIBLE"

