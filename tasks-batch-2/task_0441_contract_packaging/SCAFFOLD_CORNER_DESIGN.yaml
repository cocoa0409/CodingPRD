              payload: { component_id: "${comp_id}", qty_per_unit: 2, expected_recipe_version: "${rv0}" }
              as: Scheduler
              captures: { rv1: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${pouch_id}", qty_per_unit: 1, expected_recipe_version: "${rv1}" }
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/approve"
              payload: {}
              as: QAInspector
            - call: "POST /copack/production-lines"
              payload: { name: "Line A", rated_units_per_hour: 50 }
              as: Scheduler
              captures: { line_id: $.data.id, lv0: $.data.version }
            - call: "POST /copack/crews"
              payload: { name: "Crew 1", rest_buffer_minutes: 0 }
              as: Scheduler
              captures: { crew1: $.data.id }
            - call: "POST /copack/crews"
              payload: { name: "Crew 2", rest_buffer_minutes: 0 }
              as: Scheduler
              captures: { crew2: $.data.id }
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_id}", crew_id: "${crew1}", planned_units: 100, scheduled_start: "2026-06-01T08:00:00Z" }
              as: Scheduler
              captures: { run1: $.data.id }
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_id}", crew_id: "${crew2}", planned_units: 100, scheduled_start: "2026-06-01T10:00:00Z" }
              as: Scheduler
              captures: { run2: $.data.id }
            - call: "POST /copack/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Scheduler
            - call: "POST /copack/production-runs/${run1}/start"
              payload: { expected_line_version: "${lv0}" }
              as: Scheduler
              captures: { lv1: $.data.version }
            - call: "POST /copack/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Scheduler
          trigger:
            - call: "POST /copack/production-runs/${run2}/start"
              payload: { expected_line_version: "${lv1} - 1" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "http status == 412"

