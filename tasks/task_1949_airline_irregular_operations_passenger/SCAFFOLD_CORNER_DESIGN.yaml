            - { call: "POST /irops/flights", payload: { flight_number: "OC80", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
