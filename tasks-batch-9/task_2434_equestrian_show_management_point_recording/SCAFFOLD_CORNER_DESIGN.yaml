      - name: prize_residual_folded_into_first_place_at_five_ribbons
        claim_type: waterfall_allocation
        grounds:
          - calculations.class_prize_allocation
          - calculations.class_prize_allocation
          - entities.ShowClass.fields.awarded_prize_cents
          - entities.Show.fields.allocated_prize_cents
        distinguishing_aspect: |
          The ladder pays 40/25/16/11/8 percent of the class purse, each place rounded
          on its own, and ONLY when the full five-ribbon ladder is paid is the
          rounding residual folded into first place so that the purse is exhausted to
          the cent. The two classes are chosen so the residual has opposite signs:
          purse 41721 rounds down to 41720 and first place is lifted 16688 -> 16689,
          while purse 24998 rounds UP to 24999 and first place is cut 9999 -> 9998.
          An implementation that only ever adds a residual (or that drops it) matches
          one class and fails the other.
        test_recipe:
          setup:
            - "APPROVED show (pool 750000), Ring A (buffer 10), JUMPER division share 3333 -> allotment 249975."
            - "Class 101 at 120 cm with class_share_bp 1669 -> class_purse_cents 41721; class 102 at 110 cm with class_share_bp 1000 -> class_purse_cents 24998. Both OPEN."
            - "Five riders, one horse each, one Entry each entered in BOTH classes; every Entry ACCEPTED and PAID (subtotal 50000 -> office fee 2500 -> total_due 52500) so each class holds five CONFIRMED rows."
            - "Judge + steward chair both slots: class 101 at 14:00 (duration 30, occupancy 13:30..14:30) and class 102 at 15:10 (duration 30, occupancy 14:40..15:40)."
            - "VETERINARIAN coverage 12:00..20:00 activated at clock 2026-09-10T13:30:00Z."
