      - name: meeting_status_and_minutes_axes_advance_independently
        grounds:
          - state_machines.Meeting.OPEN_to_ADJOURNED
          - state_machines.Meeting.NOT_DRAFTED_to_DRAFTED
          - state_machines.Meeting.DRAFTED_to_APPROVED
          - entities.Meeting.fields.minutes_status
          - entities.Meeting.fields.minutes_approved_at_meeting_id
        distinguishing_aspect: |
          Meeting carries two independent state dimensions on one row: `status` walks
          DRAFT -> NOTICED -> OPEN -> ADJOURNED under the notice/open/adjourn endpoints while
          `minutes_status` walks NOT_DRAFTED -> DRAFTED -> APPROVED under a completely different
          endpoint, and the approval step needs a second, strictly later meeting that is OPEN. M1
          reaches (ADJOURNED, APPROVED) while M2 sits at (OPEN, NOT_DRAFTED), proving the axes are
          not one combined state. The parallel dimension lives on Meeting, a different entity from
          the PolicyVersion that carries the cyclic instance.
