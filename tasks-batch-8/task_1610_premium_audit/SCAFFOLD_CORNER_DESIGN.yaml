            - { call: "POST /policies", payload: { policy_number: "WC-V6", insured_name: "Dupe Co", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 2000000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
