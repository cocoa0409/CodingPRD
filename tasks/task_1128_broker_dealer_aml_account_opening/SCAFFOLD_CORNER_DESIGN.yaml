# =============================================================================
# Task 1128 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across claim-extraction-guide sections; §1.8-covered corners are
# emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: rep_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.RegisteredRep.fields.status]
        distinguishing_aspect: "A rep created with only full_name + crd_number gets status ACTIVE (default) and version 1; server-minted id is a prefix-free UUID."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /aml/reps", payload: { full_name: "Default Rep", crd_number: "CRD-ENT1" }, as: SystemAdmin, captures: { rid: "$.data.id", rst: "$.data.status", rv: "$.data.version" } }
          trigger:
            - { call: "GET /aml/reps/${rid}", payload: {}, as: SystemAdmin, captures: { rst2: "$.data.status" } }
          assert:
            - "captured rst == ACTIVE and rst2 == ACTIVE"
            - "captured rv == 1"

      - name: customer_creation_missing_required_tax_id
        claim_type: required_fields
        grounds: [entities.Customer.fields.tax_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input tax_id on POST /aml/customers yields ERR_INVALID_REQUEST (400), no customer persisted."
        test_recipe:
          setup: ["Rep exists and is ACTIVE."]
          setup_api_calls:
            - { call: "POST /aml/reps", payload: { full_name: "Rep E2", crd_number: "CRD-ENT2" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
          trigger:
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "No Tin", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: customer_invalid_enum_customer_type_rejected
        claim_type: type_constraints
        grounds: [entities.Customer.fields.customer_type, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "customer_type outside {INDIVIDUAL, LEGAL_ENTITY} is rejected with ERR_INVALID_ENUM (400)."
        test_recipe:
          setup: ["Rep exists."]
          setup_api_calls:
            - { call: "POST /aml/reps", payload: { full_name: "Rep E3", crd_number: "CRD-ENT3" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
          trigger:
            - { call: "POST /aml/customers", payload: { customer_type: "TRUST", full_name: "Bad Enum", tax_id: "TIN-ENT3", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_ENUM"

      - name: account_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_ACCOUNT_NOT_FOUND]"]
        distinguishing_aspect: "GET /aml/accounts/{random-uuid} returns 404 ERR_ACCOUNT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /aml/reps", payload: { full_name: "Rep E4", crd_number: "CRD-ENT4" }, as: SystemAdmin }
          trigger:
            - { call: "GET /aml/accounts/00000000-0000-0000-0000-000000000000", payload: {}, as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_ACCOUNT_NOT_FOUND"
            - "HTTP status == 404"

      - name: customers_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "Three customers listed with limit=2 return 2 rows with total_count 3, has_more true, and meta.api_request_id present; offset=2 page returns the third row with has_more false."
        test_recipe:
          setup: ["Three customers created by one rep."]
          setup_api_calls:
            - { call: "POST /aml/reps", payload: { full_name: "Rep E5", crd_number: "CRD-ENT5" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "P1", tax_id: "TIN-E5a", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "P2", tax_id: "TIN-E5b", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "P3", tax_id: "TIN-E5c", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}" }
          trigger:
            - { call: "GET /aml/customers", payload: { limit: 2, offset: 0 }, as: ComplianceOfficer, captures: { page1: "$.data" } }
            - { call: "GET /aml/customers", payload: { limit: 2, offset: 2 }, as: ComplianceOfficer, captures: { page2: "$.data" } }
          assert:
            - "page 1 contains exactly 2 rows; envelope reports total_count == 3 and has_more == true; meta.api_request_id present"
            - "page 2 contains exactly 1 row; has_more == false"

      - name: security_transaction_amount_computed_client_amount_ignored
        claim_type: computed_fields
        grounds: [entities.SecurityTransaction.fields.amount]
        distinguishing_aspect: "For BUY the server computes amount = round_half_up(quantity*unit_price, 2) = 100*40.00 = 4000.00; a client-sent amount of 9999.00 is ignored."
        test_recipe:
          setup: ["OPEN LOW account."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep E6", crd_number: "CRD-ENT6" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "E6", tax_id: "TIN-ENT6", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-ENT6", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "BUY", security_id: "ACME", quantity: 100, unit_price: 40.00, amount: 9999.00 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { amt: "$.data.amount" } }
          assert:
            - "captured amt == 4000.00 (computed; 9999.00 ignored)"

      - name: beneficial_owner_creation_nonexistent_certification_not_found
        claim_type: parent_relationships
        grounds: [entities.BeneficialOwner.fields.certification_id, "errors[ERR_CERTIFICATION_NOT_FOUND]"]
        distinguishing_aspect: "Adding an owner under a bogus certification id returns 404 ERR_CERTIFICATION_NOT_FOUND (parent existence validated before any content rule)."
        test_recipe:
          setup: ["Rep exists."]
          setup_api_calls:
            - { call: "POST /aml/reps", payload: { full_name: "Rep E7", crd_number: "CRD-ENT7" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
          trigger:
            - { call: "POST /aml/beneficial-ownership-certifications/00000000-0000-0000-0000-000000000000/owners", payload: { full_name: "Orphan", ownership_pct: 30.00 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_CERTIFICATION_NOT_FOUND"
            - "HTTP status == 404"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: account_initial_state_pending_approval
        claim_type: initial_state
        grounds: [state_machines.BrokerageAccount]
        distinguishing_aspect: "A newly created account starts PENDING_APPROVAL with aml_posture STANDARD and risk_variant_used INITIAL."
        test_recipe:
          setup: ["Rep + LOW customer."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep S1", crd_number: "CRD-S01" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "S1", tax_id: "TIN-S01", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { lc: "$.data.lifecycle_status", posture: "$.data.aml_posture", variant: "$.data.risk_variant_used", v: "$.data.version" } }
          assert:
            - "captured lc == PENDING_APPROVAL, posture == STANDARD, variant == INITIAL, v == 1"

      - name: account_close_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.BrokerageAccount, "errors[ERR_ACCOUNT_CLOSED_TERMINAL]"]
        distinguishing_aspect: "From CLOSED every lifecycle action is rejected: restrict returns ERR_ACCOUNT_CLOSED_TERMINAL (409) and the account stays CLOSED."
        test_recipe:
          setup: ["OPEN LOW account with no cases/matches/deposits/flagged transactions."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep S2", crd_number: "CRD-S02" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "S2", tax_id: "TIN-S02", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-S02", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/accounts/${acct_id}/close", payload: {}, as: ComplianceOfficer, captures: { st: "$.data.lifecycle_status" } }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/restrict", payload: { reason: "too late" }, as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "captured st == CLOSED"
            - "captured err == ERR_ACCOUNT_CLOSED_TERMINAL"

      - name: account_reinstate_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BrokerageAccount, "errors[ERR_INVALID_LIFECYCLE_TRANSITION]"]
        distinguishing_aspect: "reinstate is defined only from RESTRICTED; calling it on an OPEN account returns ERR_INVALID_LIFECYCLE_TRANSITION and no state change."
        test_recipe:
          setup: ["OPEN LOW account."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep S3", crd_number: "CRD-S03" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "S3", tax_id: "TIN-S03", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-S03", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/reinstate", payload: {}, as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_LIFECYCLE_TRANSITION"

      - name: document_verify_supersedes_prior_same_type
        claim_type: side_effect_execution
        grounds: [state_machines.IdentificationDocument.SUBMITTED_to_VERIFIED]
        distinguishing_aspect: "Verifying doc2 of the same customer+doc_type SUPERSEDES the previously VERIFIED doc1; doc2 is VERIFIED."
        test_recipe:
          setup: ["Customer with doc1 VERIFIED (GOVERNMENT_ID), doc2 SUBMITTED (GOVERNMENT_ID)."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep S4", crd_number: "CRD-S04" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "S4", tax_id: "TIN-S04", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-S04a", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { d1: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${d1}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-S04b", expiry_date: "2031-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { d2: "$.data.id" } }
          trigger:
            - { call: "POST /aml/identification-documents/${d2}/verify", payload: {}, as: AMLAnalyst, captures: { d2st: "$.data.status" } }
            - { call: "GET /aml/identification-documents/${d1}", payload: {}, as: AMLAnalyst, captures: { d1st: "$.data.status" } }
          assert:
            - "captured d2st == VERIFIED and d1st == SUPERSEDED"

      - name: document_expiry_sweep_and_rejected_terminal
        claim_type: valid_transition
        grounds: [state_machines.IdentificationDocument.VERIFIED_to_EXPIRED, "errors[ERR_DOCUMENT_NOT_VERIFIABLE]"]
        distinguishing_aspect: "Daily sweep with clock past expiry_date flips VERIFIED -> EXPIRED; a REJECTED document cannot later be verified (ERR_DOCUMENT_NOT_VERIFIABLE)."
        test_recipe:
          setup: ["Customer with doc1 VERIFIED expiring 2026-05-03 and doc2 REJECTED."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep S5", crd_number: "CRD-S05" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "S5", tax_id: "TIN-S05", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-S05a", expiry_date: "2026-05-03" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { d1: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${d1}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "W9", document_number: "W-S05", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { d2: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${d2}/reject", payload: { reason: "illegible" }, as: AMLAnalyst }
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /aml/maintenance/run-daily-sweep", payload: {}, as: SystemAdmin, captures: { n_exp: "$.data.documents_expired" } }
            - { call: "GET /aml/identification-documents/${d1}", payload: {}, as: AMLAnalyst, captures: { d1st: "$.data.status" } }
            - { call: "POST /aml/identification-documents/${d2}/verify", payload: {}, as: AMLAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "captured n_exp == 1 and d1st == EXPIRED"
            - "captured err == ERR_DOCUMENT_NOT_VERIFIABLE (REJECTED is terminal for verify)"

      - name: edd_rejection_cascades_account_declined
        claim_type: side_effect_execution
        grounds: [state_machines.EDDReview.IN_REVIEW_to_REJECTED]
        distinguishing_aspect: "Completing an EDD review REJECTED while the account is PENDING_APPROVAL cascades the account to DECLINED with decline_reason set."
        test_recipe:
          setup: ["HIGH-tier account PENDING_APPROVAL with EDD review IN_REVIEW."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep S6", crd_number: "CRD-S06" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "S6 Pep", tax_id: "TIN-S06", country_risk_tier: "HIGH", is_pep: true }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["LOW_PRICED_SECURITIES", "MARGIN", "OPTIONS"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/edd-reviews", payload: { period_start: "2026-04-01", period_end: "2026-05-01", trigger_reason: "onboarding" }, as: AMLAnalyst, captures: { edd_id: "$.data.id" } }
            - { call: "POST /aml/edd-reviews/${edd_id}/begin", payload: {}, as: AMLAnalyst }
          trigger:
            - { call: "POST /aml/edd-reviews/${edd_id}/complete", payload: { decision: "REJECTED", notes: "unverifiable funds" }, as: ComplianceOfficer, captures: { edd_st: "$.data.status" } }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: ComplianceOfficer, captures: { lc: "$.data.lifecycle_status" } }
          assert:
            - "captured edd_st == REJECTED and lc == DECLINED"

      - name: alert_close_no_action_then_reopen
        claim_type: valid_transition
        grounds: [state_machines.MonitoringAlert.CLOSED_NO_ACTION_to_UNDER_REVIEW]
        distinguishing_aspect: "The alert machine is cyclic: UNDER_REVIEW -> CLOSED_NO_ACTION -> (reopen) UNDER_REVIEW; open_alert_count falls to 0 then returns to 1."
        test_recipe:
          setup: ["OPEN LOW account with a STRUCTURING alert UNDER_REVIEW."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep S7", crd_number: "CRD-S07" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "S7", tax_id: "TIN-S07", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-S07", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/monitoring-rules", payload: { rule_code: "STRUCTURING", threshold_amount: 10000.00, window_days: 2, min_transaction_count: 3 }, as: SystemAdmin }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "BUY", security_id: "ACME", quantity: 100, unit_price: 40.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "BUY", security_id: "ACME", quantity: 100, unit_price: 40.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "BUY", security_id: "ACME", quantity: 100, unit_price: 40.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/monitoring-scans/run", payload: {}, as: AMLAnalyst }
            - { call: "GET /aml/alerts", payload: { account_id: "${acct_id}" }, as: AMLAnalyst, captures: { alert_id: "$.data[0].id" } }
            - { call: "POST /aml/alerts/${alert_id}/begin-review", payload: {}, as: AMLAnalyst }
          trigger:
            - { call: "POST /aml/alerts/${alert_id}/close-no-action", payload: { rationale: "benign" }, as: AMLAnalyst, captures: { st1: "$.data.status" } }
            - { call: "POST /aml/alerts/${alert_id}/reopen", payload: {}, as: AMLAnalyst, captures: { st2: "$.data.status" } }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: AMLAnalyst, captures: { oac: "$.data.open_alert_count" } }
          assert:
            - "captured st1 == CLOSED_NO_ACTION and st2 == UNDER_REVIEW"
            - "captured oac == 1"

      - name: alert_escalate_from_new_rejected
        claim_type: precondition_enforcement
