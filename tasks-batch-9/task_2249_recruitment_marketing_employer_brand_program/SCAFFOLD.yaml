      - "DISQUALIFIED from SCREENED - assigns no credit at all; the branch's side-effect set is disjoint from the QUALIFIED branch."
      - "DISQUALIFIED from QUALIFIED - zeroes credit_bp on every touchpoint of the application, lowers Channel.credited_qualified_bp and MediaFlight.qualified_credit_bp by exactly the removed amounts, sets attributed_credit_bp_total 0 and attribution_model_applied null, lowers JobPosting.qualified_count by 1 and re-runs calculations.channel_cpqa."
