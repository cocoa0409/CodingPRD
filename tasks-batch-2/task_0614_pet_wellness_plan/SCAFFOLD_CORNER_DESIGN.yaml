# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Pet Wellness-Plan Membership — breadth probe over §1.1-§1.7.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_plan_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Plan.fields.tier
          - entities.Plan.fields.monthly_fee_cents
        distinguishing_aspect: "POST /wellness/plans with required fields -> 201, status defaults ACTIVE, alacarte_discount_pct defaults 0.0, enrollment_fee_cents defaults 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /wellness/plans"
              payload: { tier: "ESSENTIAL", name: "Ess", monthly_fee_cents: 2500, annual_value_cents: 30000 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "Plan.${plan_id}.status == ACTIVE"
            - "Plan.${plan_id}.alacarte_discount_pct == 0.0"
            - "Plan.${plan_id}.enrollment_fee_cents == 0"
            - "Plan.${plan_id}.version == 1"

      - name: get_plan_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Plan
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /wellness/plans/{id} with a random non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "GET /wellness/plans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_membership_missing_required_field_returns_422
        claim_type: Required Fields
        grounds:
          - entities.Membership.fields.plan_id
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /wellness/memberships omitting plan_id -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A clinic and a member account exist"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "rf@x.com", full_name: "RF", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_membership_anchor_day_out_of_range_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.Membership.fields.billing_anchor_day
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "billing_anchor_day = 31 (>28) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A plan, clinic, and member account exist"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "rg@x.com", full_name: "RG", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 31 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: duplicate_member_email_returns_409
        claim_type: Type Constraints
        grounds:
          - entities.MemberAccount.fields.email
          - "validations[priority=13]"
          - "errors[ERR_DUPLICATE_EMAIL]"
        distinguishing_aspect: "Second POST /wellness/member-accounts with a case-insensitively equal email -> ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["A clinic and one member account with email dup@x.com exist"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "dup@x.com", full_name: "First", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /wellness/member-accounts"
              payload: { email: "DUP@x.com", full_name: "Second", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DUPLICATE_EMAIL"

      - name: membership_initial_state_pending_payment
        claim_type: System Fields
        grounds:
          - entities.Membership.fields.status
          - entities.Membership.fields.monthly_fee_cents
        distinguishing_aspect: "Newly created membership starts status PENDING_PAYMENT with monthly_fee_cents snapshot == Plan.monthly_fee_cents and pet_count 0."
        test_recipe:
          setup: ["A PLUS plan (4500), clinic, and member account exist"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "rh@x.com", full_name: "RH", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
          assert:
            - "Membership.${mem_id}.status == PENDING_PAYMENT"
            - "Membership.${mem_id}.monthly_fee_cents == 4500"
            - "Membership.${mem_id}.pet_count == 0"

      - name: create_membership_with_nonexistent_plan_returns_reference_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Membership.fields.plan_id
          - "validations[priority=5]"
          - "errors[ERR_REFERENCE_NOT_FOUND]"
        distinguishing_aspect: "POST /wellness/memberships referencing a non-existent plan_id -> ERR_REFERENCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["A clinic and member account exist; plan_id is a random UUID"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "ri@x.com", full_name: "RI", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "00000000-0000-4000-8000-0000000000aa", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_REFERENCE_NOT_FOUND"

      - name: list_plans_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Plan
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /wellness/plans returns paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["Two plans created"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "ESSENTIAL", name: "E", monthly_fee_cents: 2500, annual_value_cents: 30000 }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "P", monthly_fee_cents: 4500, annual_value_cents: 60000 }
              as: PlanAdmin
          trigger:
            - call: "GET /wellness/plans?limit=1&offset=0"
              payload: {}
              as: PlanAdmin
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "has_more == true"

      - name: enrolled_pet_computed_enrolled_at_ignores_client_input
        claim_type: Computed Fields
        grounds:
          - entities.EnrolledPet.fields.enrolled_at
          - entities.EnrolledPet.fields.status
        distinguishing_aspect: "EnrolledPet.enrolled_at is set to the logical clock at add time (2026-01-01T00:00:00Z) and status defaults ENROLLED; client cannot set them."
        test_recipe:
          setup: ["A PLUS membership in PENDING_PAYMENT exists at clock 2026-01-01"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "rj@x.com", full_name: "RJ", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "Rex", species: "DOG", weight_kg: 12 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { pet_id: $.data.id }
          assert:
            - "EnrolledPet.${pet_id}.status == ENROLLED"
            - "EnrolledPet.${pet_id}.enrolled_at == 2026-01-01T00:00:00.000Z"
            - "Membership.${mem_id}.pet_count == 1"

      - name: clock_default_is_2026_01_01_before_any_set
        claim_type: System Fields
        grounds:
          - entities.ClockState.fields.current_utc
        distinguishing_aspect: "Before any set_current_utc call, GET /wellness/_clock reads exactly 2026-01-01T00:00:00Z (startup default, never wall-clock)."
        test_recipe:
          setup: ["Fresh server, no clock set"]
          setup_api_calls: []
          trigger:
            - call: "GET /wellness/_clock"
              payload: {}
              as: PlanAdmin
          assert:
            - "ClockState.current_utc == 2026-01-01T00:00:00.000Z"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: activate_from_already_enrolled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Membership.PENDING_PAYMENT_to_ENROLLED
          - "errors[ERR_MEMBERSHIP_NOT_PENDING]"
        distinguishing_aspect: "Calling activate on an already-ENROLLED membership -> ERR_MEMBERSHIP_NOT_PENDING (409); no second ContractTerm created."
        test_recipe:
          setup: ["PLUS membership ENROLLED"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "EXAM", included_quantity: 2, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "sa@x.com", full_name: "SA", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "Rex", species: "DOG", weight_kg: 12 }
              as: Member
              as_user_id: "${acct_id}"
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_MEMBERSHIP_NOT_PENDING"

      - name: activate_without_enrolled_pet_returns_no_enrolled_pet
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Membership.PENDING_PAYMENT_to_ENROLLED
          - "errors[ERR_NO_ENROLLED_PET]"
        distinguishing_aspect: "Activating a PENDING_PAYMENT membership with zero ENROLLED pets -> ERR_NO_ENROLLED_PET (409)."
        test_recipe:
          setup: ["PLUS membership PENDING_PAYMENT with no pets"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "sb@x.com", full_name: "SB", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_NO_ENROLLED_PET"

      - name: activate_on_retired_plan_returns_plan_retired
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Membership.PENDING_PAYMENT_to_ENROLLED
          - "errors[ERR_PLAN_RETIRED]"
        distinguishing_aspect: "Activating a membership whose plan was RETIRED after creation -> ERR_PLAN_RETIRED (409)."
        test_recipe:
          setup: ["PLUS membership PENDING_PAYMENT with one pet; plan retired before activate"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "EXAM", included_quantity: 2, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "sc@x.com", full_name: "SC", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "Rex", species: "DOG", weight_kg: 12 }
              as: Member
              as_user_id: "${acct_id}"
            - call: "POST /wellness/plans/${plus_id}/retire"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_PLAN_RETIRED"

      - name: resume_non_suspended_returns_not_suspended
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Membership.SUSPENDED_to_ENROLLED
          - "errors[ERR_MEMBERSHIP_NOT_SUSPENDED]"
        distinguishing_aspect: "Resuming an ENROLLED (not SUSPENDED) membership -> ERR_MEMBERSHIP_NOT_SUSPENDED (409)."
        test_recipe:
          setup: ["PLUS membership ENROLLED (never suspended)"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "EXAM", included_quantity: 2, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "sd@x.com", full_name: "SD", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "Rex", species: "DOG", weight_kg: 12 }
              as: Member
              as_user_id: "${acct_id}"
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /wellness/memberships/${mem_id}/resume"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_MEMBERSHIP_NOT_SUSPENDED"

      - name: finalize_cancel_then_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Membership.CANCEL_PENDING_to_CANCELLED
          - "errors[ERR_MEMBERSHIP_NOT_CANCELLABLE]"
        distinguishing_aspect: "After finalize-cancel (status CANCELLED, terminal), a further cancel returns ERR_MEMBERSHIP_NOT_CANCELLABLE (409)."
        test_recipe:
          setup: ["PLUS membership cancelled then finalized to CANCELLED"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "EXAM", included_quantity: 2, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "se@x.com", full_name: "SE", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "Rex", species: "DOG", weight_kg: 12 }
              as: Member
              as_user_id: "${acct_id}"
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
            - call: "POST /wellness/memberships/${mem_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
            - call: "POST /wellness/memberships/${mem_id}/finalize-cancel"
