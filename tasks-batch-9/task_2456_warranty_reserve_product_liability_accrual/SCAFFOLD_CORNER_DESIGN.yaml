            - call: "POST /warranty/field-actions/${fa_small_id}/remedy-options"
              payload: { option_code: "OPT-SMALL-1", remedy_class: "PERMANENT_REPAIR", parts_cost_cents: 1000, labor_hours_centi: 100, admin_cost_cents: 500, expected_take_rate_bps: 10000, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_small_id: $.data.id }
            - call: "POST /warranty/field-actions/${fa_small_id}/select-remedy"
              payload: { expected_field_action_version: "${fa_small_ver}", remedy_option_id: "${opt_small_id}" }
              as: QualityEngineer
            - call: "POST /warranty/field-actions/${fa_small_id}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "uq-1"
          trigger:
            - call: "POST /warranty/field-actions/${fa_big_id}/decision"
              payload: { decision: "APPROVED" }
              as: ReserveController
