            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
            - {call: "POST /transfer-applications/${app}/injury-analyses", payload: {method: SEASONAL_AVERAGE, pod_move_miles: 0.00, return_flow_credit_af: 58.00}, as: WaterRightsAnalyst}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v2: "$.data.version"}}
            - {call: "POST /transfer-applications/${app}/submit", payload: {expected_water_right_version: "${wr_v2}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications/${app}/publish", as: WaterRightsAnalyst}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-04-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications/${app}/close-protest-period", as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications/${app}/decide", payload: {disposition: APPROVE_WITH_CONDITIONS, decision_note: "Mitigation payment plus a measuring device.", conditions: [{condition_type: MITIGATION_PAYMENT, required_af: 20.00, compliance_due_date: "2026-06-01T00:00:00Z"}, {condition_type: MEASUREMENT_DEVICE, required_af: 20.00, compliance_due_date: "2026-06-01T00:00:00Z"}]}, as: DecisionAuthority}
            - {call: "GET /transfer-applications/${app}/approval-conditions", as: WaterRightsAnalyst, captures: {cond_fee: "$.data[0].id", cond_dev: "$.data[1].id"}}
          trigger:
            - {call: "POST /approval-conditions/${cond_dev}/pay", as: Claimant, as_user_id: "${cl_a}", captures: {err: "$.data.error_id"}}
            - {call: "POST /approval-conditions/${cond_fee}/pay", as: Claimant, as_user_id: "${cl_a}"}
            - {call: "GET /claimants/${cl_a}", as: WaterRightsAnalyst}
          assert:
            - "At decision time the MITIGATION_PAYMENT condition is priced base_fee_usd 2500.00 == round(20.00 * 125.0, 2), surcharge_pct 0.040 (the 2500.00 pre-surcharge subtotal is under the 5000.00 threshold), admin_surcharge_usd 100.00 and total_fee_usd 2600.00; the MEASUREMENT_DEVICE condition has all fee fields 0.00 and payment_status NOT_APPLICABLE."
            - "TransferApplication.mitigation_fee_total_usd 2600.00 and the claimant is DELINQUENT with outstanding_fee_balance_usd 2600.00."
            - "Paying the MEASUREMENT_DEVICE condition: HTTP 409 with error_id ERR_INVALID_STATE; its payment_status stays NOT_APPLICABLE and its version does not move."
            - "Paying the MITIGATION_PAYMENT condition: HTTP 200, payment_status OUTSTANDING -> PAID, and status STILL IMPOSED — payment does not satisfy compliance."
            - "Claimant outstanding_fee_balance_usd 0.00 and standing_status back to IN_GOOD_STANDING; a second pay on the same condition would find payment_status PAID."

      - name: ep_action_endpoints_return_the_full_mutated_entity_not_a_bare_ack
        claim_type: action_endpoint
