      - name: cancelled_and_waitlisted_bookings_are_excluded_from_sailing_aggregates
        claim_type: input_set_filtering
        grounds:
          - calculations.sailing_ralbd.inputs
          - calculations.sailing_occupancy_posture.inputs
          - calculations.booking_onboard_projection
        distinguishing_aspect: |
          The aggregate input set is booking_status IN {OPTION, CONFIRMED, SAILED}, so a cancelled
          booking and a waitlisted booking must both drop out of every sailing figure while their
          OWN stored money and projection fields survive untouched on the row. The waitlisted case
          is the trap: it carries a fully priced net_ticket_cents and a non-zero
          projected_onboard_gross_cents that must contribute nothing.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing FLT-2701 (nights 4, total_lower_berths 40, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment of 2 physical cabins and allowance 0, and a 730..0 fare window at base 50000."
            - "Ada and Bo each hold one of the two cabins at net_ticket_cents 100000 and projected_onboard_gross_cents 4 * 2 * 9000 == 72000; Cy books with allow_waitlist true and is WAITLISTED at the same figures."
            - "Bo then cancels at days_to_sail 162, which is inside the penalty-free band."
