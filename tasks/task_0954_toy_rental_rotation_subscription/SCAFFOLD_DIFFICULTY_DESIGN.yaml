            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Bath Boat", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 2, retail_value_cents: 4000, replacement_value_cents: 3000 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-SAN-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_id: $.data.id }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/ship"
              payload: { carrier: "UPS", tracking_number: "1Z-SAN-OUT" }
              as: OperationsManager
              captures: { sh_out: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-02T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-03T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/rotation-boxes/${b_id}/initiate-return"
              payload: { carrier: "UPS", tracking_number: "1Z-SAN-RET" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sh_ret: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_ret}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-07T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_ret}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-08T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-rental/rotation-boxes/${b_id}/inspect"
              payload:
                items:
                  - { box_item_id: "${it_id}", condition_returned: "GOOD", damage_severity: "NONE", missing_piece_count: 0, disposition: "RESTOCK" }
              as: OperationsManager
          trigger:
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-rental/copies/${c1}/complete-sanitization"
              as: OperationsManager
              captures: { err: $.data.error_id }
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-rental/copies/${c1}/complete-sanitization"
              as: OperationsManager
          assert:
            - "At +12h: err == ERR_SANITIZATION_BUFFER_ACTIVE (HTTP 422); copy remains SANITIZING"
            - "At exactly +24h (2026-05-11T00:00:00Z): completion succeeds — buffer is >= 24h, not >"
            - "ToyCopy.${c1}.status == AVAILABLE, last_sanitized_at == 2026-05-11T00:00:00Z, sanitization_cycle_count == 1"
            - "No wishlist demand exists, so the targeted sweep leaves the copy AVAILABLE (no HELD entries created)"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: wallet_charge_waive_conservation
        grounds:
          - calculations.wallet_balance_reconciliation
          - state_machines.FeeAssessment.INVOICED_to_WAIVED
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: |
          Conserved quantity: Member.wallet_credit_cents == SUM(ledger
          amounts). A LOSS charge (-600) followed by its waiver (+600) returns
          the wallet to the pre-charge value 500 exactly — forward action plus
          compensating action leave the named quantity unchanged.
        test_recipe:
          setup:
            - "Plan STD; member M with wallet 500 (one +500 PROMO_CREDIT); child born 2025-01-15; catalog item replacement 600 age [12,36]; NEW copy; box delivered 2026-05-03"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.inv1@x.com", full_name: "Inv Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/wallet/adjustments"
              payload: { amount_cents: 500, reason: "PROMO_CREDIT", note: "seed" }
              as: CustomerService
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Rattle", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 2, retail_value_cents: 1000, replacement_value_cents: 600 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-INV-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_id: $.data.id }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/ship"
              payload: { carrier: "UPS", tracking_number: "1Z-INV-OUT" }
              as: OperationsManager
              captures: { sh_out: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-02T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-03T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /toy-rental/box-items/${it_id}/report-lost"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /toy-rental/box-items/${it_id}/fees"
              as: Member
              as_user_id: "${m_id}"
              captures: { f_id: "$.data[0].id" }
            - call: "POST /toy-rental/fees/${f_id}/waive"
              payload: { reason: "goodwill" }
              as: CustomerService
            - call: "GET /toy-rental/members/${m_id}"
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /toy-rental/members/${m_id}/wallet/ledger"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Member.${m_id}.wallet_credit_cents == 500 after the charge+waive pair (500 - 600 + 600) — identical to the pre-charge balance"
            - "Ledger holds exactly 3 entries summing to 500: +500 PROMO_CREDIT, -600 FEE_CHARGE, +600 FEE_WAIVER"
            - "FeeAssessment.${f_id}.status == WAIVED; BoxItem.${it_id}.resolution_status == RESOLVED"
            - "Member.${m_id}.status == ACTIVE throughout (wallet never crossed below -5000)"

      - name: swap_slot_conservation
        grounds:
          - state_machines.BoxItem.PENDING_RETURN_to_SWAPPED_OUT
          - entities.BoxItem.fields.swapped_from_item_id
          - entities.RotationBox.fields.swap_count
        distinguishing_aspect: |
          Conserved quantity (different from wallet cents): the count of a
          box's ACTIVE slots (BoxItems with loan_status != SWAPPED_OUT/CANCELLED).
          A swap pair (C1 -> C3, then C3 -> C1) leaves the active slot count at
          exactly 2 after each hop, while the SWAPPED_OUT graveyard grows.
        test_recipe:
          setup:
            - "Plan STD (toys_per_box 2, swap_allowance 2); member M with child born 2025-01-15; item X copies C1, C3 and item Y copy C2, all NEW age [12,36]; no wishlist entries (released copies stay AVAILABLE)"
            - "PLANNED box holds C1 and C2 (2 active slots)"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.inv2@x.com", full_name: "Inv2 Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Xylophone", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 6, retail_value_cents: 5000, replacement_value_cents: 4000 }
              as: PlatformAdmin
              captures: { ci_x: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_x}/copies"
              payload: { barcode: "BC-INV2-X1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_x}/copies"
              payload: { barcode: "BC-INV2-X3", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c3: $.data.id }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Yo-yo", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 1, retail_value_cents: 1000, replacement_value_cents: 800 }
              as: PlatformAdmin
              captures: { ci_y: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_y}/copies"
              payload: { barcode: "BC-INV2-Y2", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_1: $.data.id }
            - call: "GET /toy-rental/rotation-boxes/${b_id}"
              as: Member
              as_user_id: "${m_id}"
              captures: { b_v2: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c2}", expected_rotation_box_version: "${b_v2}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_2: $.data.id }
          trigger:
            - call: "POST /toy-rental/box-items/${it_1}/swap"
              payload: { new_toy_copy_id: "${c3}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_3: $.data.id }
            - call: "POST /toy-rental/box-items/${it_3}/swap"
              payload: { new_toy_copy_id: "${c1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_4: $.data.id }
            - call: "GET /toy-rental/rotation-boxes/${b_id}/items"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "After the swap pair: exactly 2 BoxItems with loan_status == PENDING_RETURN (${it_2} holding C2, ${it_4} holding C1) — the active slot count is invariant at 2 across both swaps"
            - "Exactly 2 BoxItems with loan_status == SWAPPED_OUT (${it_1}, ${it_3}); ${it_3}.swapped_from_item_id == ${it_1} and ${it_4}.swapped_from_item_id == ${it_3}"
            - "RotationBox.${b_id}.swap_count == 2; ToyCopy.${c1}.status == RESERVED to ${m_id} again; no copy entered LOST/SOLD/QUARANTINED"
            - "RotationBox.${b_id}.status remains PLANNED (swap pair never left the planning state)"
