      - name: size_curve_upward_remainder_waterfall
        claim_type: waterfall_allocation
        grounds:
          - calculations.cluster_size_allocation
          - entities.SizeCurveCell.fields.raw_units_x10000
          - entities.SizeCurveCell.fields.allocated_units
          - endpoints[PUT /otb/option-plans/{id}/size-curve]
        distinguishing_aspect: "The remainder here runs UPWARD: per-cell round_half_up under-allocates by one unit, so the reconciliation must ADD a unit to the cell with the LARGEST fractional remainder rather than subtracting from the smallest. The curve is chosen so the largest-remainder cell (S, remainder 8000) is not the largest cell (XL, 230 units) and not the first by sort order in remainder terms, so any implementation that adds the unit to the biggest cell, the first cell, or the last cell produces a different row set while still summing to 276."
        test_recipe:
          setup:
            - "an OPEN option plan for the Metro A cluster with depth 6 and store_count 40, so target_units is round_half_up(6 * 40 * 11500 / 10000) == 276"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Metro A", climate_zone: "TEMPERATE", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op_id: $.data.id }
          trigger:
            - call: "PUT /otb/option-plans/${op_id}/size-curve"
              payload: { cells: [ { size_label: "S", size_sort_order: 1, pct_bps: 500 }, { size_label: "M", size_sort_order: 2, pct_bps: 525 }, { size_label: "L", size_sort_order: 3, pct_bps: 625 }, { size_label: "XL", size_sort_order: 4, pct_bps: 8350 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "GET /otb/option-plans/${op_id}/size-curve-cells"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { c0_label: "$.data[0].size_label", c0_raw: "$.data[0].raw_units_x10000", c0_units: "$.data[0].allocated_units", c1_units: "$.data[1].allocated_units", c2_units: "$.data[2].allocated_units", c3_units: "$.data[3].allocated_units" }
          assert:
            - "raw_units_x10000 per cell is round_half_up(6 * 40 * 11500 * pct_bps / 100000000 * 10000): S 138000, M 144900, L 172500, XL 2304600"
            - "per-cell round_half_up of those rationals gives S 14 (13.8), M 14 (14.49), L 17 (17.25), XL 230 (230.46) which sums to 275, one unit BELOW target_units 276"
            - "the deficit of +1 goes to the largest fractional remainder: S 8000 beats XL 4600, M 4900 and L 2500, so ${c0_label} == S with ${c0_units} == 15 and ${c0_raw} == 138000"
            - "${c1_units} == 14 (M), ${c2_units} == 17 (L) and ${c3_units} == 230 (XL) are all left at their rounded values, and 15 + 14 + 17 + 230 == 276 == OptionPlan.target_units_per_option"
            - "the rows come back in size_sort_order ASC, so index 0 is S and index 3 is XL regardless of allocated_units magnitude"
            - "no cell allocates 0 units, so ERR_SIZE_CURVE_ZERO_CELL does not fire even though the smallest cell is only 500 bps of the curve"

      - name: receipt_budget_turn_floor_and_seasonal_multiplier
        claim_type: constants_applied
        grounds:
          - calculations.plan_receipt_budget
          - calculations.plan_receipt_budget.constants
          - calculations.option_slot_capacity
          - entities.CategoryPlan.fields.receipt_budget_cents
        distinguishing_aspect: "Two named constants that stay dormant in the ordinary case do the work here: planned_turn_x100 is 150, BELOW TURN_FLOOR_X100 200, so the divisor is the floor and not the authored turn; and the category role is SEASONAL, whose multiplier 12500 is the largest in the table. The department is sized so DEPARTMENT_SHARE_CAP_BPS is NOT binding, which makes turn_capacity the winner of the inner max and the survivor of the outer min - the opposite outcome from the ordinary department-capped case."
        test_recipe:
          setup:
            - "a department with sales_target 900,000,000 (cap 108,000,000), a SEASONAL category, and a plan with planned_turn_x100 150 - below the floor"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
