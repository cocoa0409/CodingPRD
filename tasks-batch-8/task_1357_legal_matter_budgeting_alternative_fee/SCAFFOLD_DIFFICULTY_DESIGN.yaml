            - "Matter.actual_fees_cents == 50000  # 100000 - 50000"

  # -------------------------------------------------------------------------
  # Rule 3 — Non-linear state machines on different entities
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: budget_amendment_revision_loop_cycle
        grounds:
          - state_machines.BudgetAmendment
          - entities.BudgetAmendment.fields.supersedes_amendment_id
        distinguishing_aspect: |
          BudgetAmendment exhibits a cyclic/revision-loop shape: DRAFT →
          PENDING_REVIEW → REJECTED, then a NEW amendment referencing the
          REJECTED one via supersedes_amendment_id, whose approval causes the
          predecessor to transition to SUPERSEDED. The chain A→B→C→A'
          (re-entry via supersedes) is non-linear and distinct from the
          WriteDownRequest chain.
        test_recipe:
          setup:
            - "Matter M1 ACTIVE with PhaseBudget PB1 (L110, 100000) ACTIVE"
            - "Amendment A1 (+20000) submitted and REJECTED"
            - "Amendment A2 (+15000) referencing supersedes_amendment_id=A1, submitted and APPROVED"
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
