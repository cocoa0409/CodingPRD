scaffold_difficulty_design:
  # ------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: freight_estimate_provisional_uplift_vs_final
        grounds:
          - calculations.calc_freight_and_oversize
          - state_machines.Order.STOCK_RESERVED_to_SHIPPED
        distinguishing_aspect: |
          Same order, same lines, same zone: the provisional variant at submit
          carries the 1.10 uplift (163680 cents) while the final variant at
          ship drops it (148800 cents) — a freight-cost dual variant on the
          Order domain, distinct from the Return-credit domain of the sibling
          instance.
        test_recipe:
          setup:
            - "Warehouse ATL zone 2; account CORPORATE; stock product density 20 (class 70, rate 120 cents/lb), weight 10 lbs/unit; Inventory ATL on_hand 500; order ship_zone 5 (zone_distance 3, zone_factor 1.24) with one line qty 100 (1000 lbs)"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "BX-100", name: "12x12x12 Box", category: "BOXES", base_price_cents: 1000, uom: "EACH", case_qty: 1, pallet_qty: 500, weight_lbs_per_unit: 10, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 500 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 100 }
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { prov_freight: $.data.freight_estimate_cents, prov_grand: $.data.grand_total_cents, submit_status: $.data.status }
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/ship"
              payload: {}
              as: WarehouseOps
              captures: { final_freight: $.data.freight_estimate_cents, final_grand: $.data.grand_total_cents, ship_status: $.data.status }
          assert:
            - "Order.${ord} provisional freight_estimate_cents == 163680 (captured ${prov_freight})"
            - "Order.${ord} provisional grand_total_cents == 263680 (captured ${prov_grand})"
            - "submit_status == STOCK_RESERVED"
            - "Order.${ord} final freight_estimate_cents == 148800 (captured ${final_freight})"
            - "Order.${ord} final grand_total_cents == 248800 (captured ${final_grand})"
            - "ship_status == SHIPPED"

      - name: return_refund_stock_full_vs_custom_restock_fee
        grounds:
          - calculations.calc_return_restock
          - state_machines.Return.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Identical return shape (qty 10 at a 1000-cent-class unit price): a
          STOCK return refunds 100% (10000 cents, fee 0) while a CUSTOM return
          refunds 85% (9775 cents, fee 1725) — a return-credit dual variant on
          the Return domain, distinct from the Order freight domain of the
          sibling instance.
        test_recipe:
          setup:
            - "Warehouse ATL zone 2; account CORPORATE; stock product unit 1000 qty 10 shipped; custom product base 1000 -> surcharged unit 1150, qty 10 produced within tolerance and shipped; clock fixed 2026-08-03T10:00:00Z"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "BX-100", name: "12x12x12 Box", category: "BOXES", base_price_cents: 1000, uom: "EACH", case_qty: 1, pallet_qty: 500, weight_lbs_per_unit: 10, density_pcf: 20 }
              as: CatalogManager
              captures: { prod_s: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "BX-C1", name: "Custom 12x12x12", category: "BOXES", base_price_cents: 1000, uom: "EACH", case_qty: 1, pallet_qty: 500, weight_lbs_per_unit: 5, density_pcf: 20, is_custom_print: true, lead_time_days: 3 }
              as: CatalogManager
              captures: { prod_c: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod_s}", warehouse_id: "${wh_atl}", on_hand_qty: 100 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord_s: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord_s}/lines"
              payload: { product_id: "${prod_s}", qty: 10 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { line_s: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord_s}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord_s}/ship"
              payload: {}
              as: WarehouseOps
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord_c: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord_c}/lines"
              payload: { product_id: "${prod_c}", qty: 10, print_artwork_ref: "art-1", over_under_tolerance_pct: 10 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { line_c: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord_c}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
            - call: "GET /packaging-distribution/custom-print-jobs"
              payload: { order_line_id: "${line_c}" }
              as: PlatformAdmin
              captures: { job_c: "$.data[0].id" }
            - call: "POST /packaging-distribution/custom-print-jobs/${job_c}/start"
              payload: {}
              as: WarehouseOps
            - call: "POST /packaging-distribution/custom-print-jobs/${job_c}/advance"
              payload: {}
              as: WarehouseOps
            - call: "POST /packaging-distribution/custom-print-jobs/${job_c}/receive"
              payload: { actual_qty: 10 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/orders/${ord_c}/ship"
              payload: {}
              as: WarehouseOps
          trigger:
            - call: "POST /packaging-distribution/returns"
              payload: { order_id: "${ord_s}", return_type: "STOCK", reason_code: "WRONG_ITEM", lines: [ { order_line_id: "${line_s}", qty: 10 } ] }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ret_s: $.data.id }
            - call: "POST /packaging-distribution/returns/${ret_s}/approve"
              payload: {}
              as: CustomerService
              captures: { refund_s: $.data.refund_cents, fee_s: $.data.restock_fee_cents }
            - call: "POST /packaging-distribution/returns"
              payload: { order_id: "${ord_c}", return_type: "CUSTOM", reason_code: "PRINT_DEFECT", lines: [ { order_line_id: "${line_c}", qty: 10 } ] }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ret_c: $.data.id }
            - call: "POST /packaging-distribution/returns/${ret_c}/approve"
              payload: {}
              as: CustomerService
              captures: { refund_c: $.data.refund_cents, fee_c: $.data.restock_fee_cents }
          assert:
            - "Return.${ret_s}.refund_cents == 10000 (captured ${refund_s})"
            - "Return.${ret_s}.restock_fee_cents == 0 (captured ${fee_s})"
            - "Return.${ret_c}.refund_cents == 9775 (captured ${refund_c})"
            - "Return.${ret_c}.restock_fee_cents == 1725 (captured ${fee_c})"
            - "refund_c + fee_c == 11500 == 10 x 1150 (refund plus fee recompose the custom gross)"

  # ------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: break_surcharge_pallet_stacking_multi_input
        grounds:
          - calculations.calc_order_pricing
        distinguishing_aspect: |
          Mode (a) multi-input non-linear formula: quantity-break tier
          selection (200 >= min_qty 200 -> 400) feeds a multiplicative custom
          surcharge (ceil(400 x 1.15) = 460) which then feeds a floor-per-pallet
          rebate (4 pallets x floor(460 x 0.03) = 52) — three interacting
          inputs pinned in a fixed evaluation order, unlike the sibling
          instance's nested-rounding mode (b).
        test_recipe:
          setup:
            - "Warehouse ATL zone 2; account CORPORATE; custom product base 500 with breaks min 50 -> 450 and min 200 -> 400 (open-ended windows from 2026-08-01), pallet_qty 50, weight 2 lbs/unit, density 20; order ship_zone 5, line qty 200"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "BX-C2", name: "Custom Mailer", category: "MAILERS", base_price_cents: 500, uom: "EACH", case_qty: 1, pallet_qty: 50, weight_lbs_per_unit: 2, density_pcf: 20, is_custom_print: true, lead_time_days: 3 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/products/${prod}/quantity-breaks"
              payload: { min_qty: 50, unit_price_cents: 450, sort_seq: 1, effective_from: "2026-08-01T00:00:00Z" }
              as: CatalogManager
            - call: "POST /packaging-distribution/products/${prod}/quantity-breaks"
              payload: { min_qty: 200, unit_price_cents: 400, sort_seq: 2, effective_from: "2026-08-01T00:00:00Z" }
              as: CatalogManager
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 200, print_artwork_ref: "art-9", over_under_tolerance_pct: 10 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { line: $.data.id, line_unit: $.data.unit_price_cents }
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { subtotal: $.data.subtotal_cents, pallet_disc: $.data.pallet_discount_cents, freight: $.data.freight_estimate_cents, grand: $.data.grand_total_cents, status: $.data.status }
            - call: "GET /packaging-distribution/order-lines/${line}"
              payload: {}
              as: PlatformAdmin
              captures: { fclass: $.data.freight_class }
          assert:
            - "OrderLine.${line}.unit_price_cents == 460 (captured ${line_unit}: break 400 then ceil x1.15)"
            - "Order.${ord}.subtotal_cents == 92000 (captured ${subtotal})"
            - "Order.${ord}.pallet_discount_cents == 52 (captured ${pallet_disc}: 4 pallets x floor(460 x 0.03) = 4 x 13)"
            - "Order.${ord}.freight_estimate_cents == 65472 (captured ${freight}: 400 lbs class 70 provisional)"
            - "Order.${ord}.grand_total_cents == 157420 (captured ${grand}: 92000 - 52 + 0 + 65472)"
            - "OrderLine.${line}.freight_class == \"70\" (captured ${fclass})"
            - "Order.${ord}.status == CUSTOM_PRODUCTION (captured ${status})"

      - name: return_refund_per_line_round_then_sum
        grounds:
          - calculations.calc_return_restock
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order round_half_up per line THEN
          sum yields refund 562 (2 x round(331 x 0.85) = 2 x 281), while the
          unpinned sum-then-round alternative yields 563 (round(662 x 0.85) =
          round(562.7)) — a one-cent divergence that only the pinned order
          resolves, unlike the sibling instance's mode (a) tiered selection.
        test_recipe:
          setup:
            - "Warehouse ATL; account CORPORATE; custom product base 287 -> surcharged unit 331; order with TWO custom lines qty 1 each, both jobs completed at actual_qty 1 (within 10% tolerance), order shipped; CUSTOM return covering both lines qty 1 each"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "LB-C1", name: "Custom Label", category: "LABELS", base_price_cents: 287, uom: "EACH", case_qty: 1, pallet_qty: 100, weight_lbs_per_unit: 1, density_pcf: 20, is_custom_print: true, lead_time_days: 2 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 1, print_artwork_ref: "art-a", over_under_tolerance_pct: 10 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { line1: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 1, print_artwork_ref: "art-b", over_under_tolerance_pct: 10 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { line2: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
            - call: "GET /packaging-distribution/custom-print-jobs"
              payload: { order_line_id: "${line1}" }
              as: PlatformAdmin
              captures: { job1: "$.data[0].id" }
            - call: "GET /packaging-distribution/custom-print-jobs"
              payload: { order_line_id: "${line2}" }
              as: PlatformAdmin
              captures: { job2: "$.data[0].id" }
            - call: "POST /packaging-distribution/custom-print-jobs/${job1}/start"
              payload: {}
              as: WarehouseOps
            - call: "POST /packaging-distribution/custom-print-jobs/${job1}/advance"
              payload: {}
              as: WarehouseOps
            - call: "POST /packaging-distribution/custom-print-jobs/${job1}/receive"
              payload: { actual_qty: 1 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/custom-print-jobs/${job2}/start"
              payload: {}
              as: WarehouseOps
            - call: "POST /packaging-distribution/custom-print-jobs/${job2}/advance"
              payload: {}
              as: WarehouseOps
            - call: "POST /packaging-distribution/custom-print-jobs/${job2}/receive"
              payload: { actual_qty: 1 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/orders/${ord}/ship"
              payload: {}
              as: WarehouseOps
          trigger:
            - call: "POST /packaging-distribution/returns"
              payload: { order_id: "${ord}", return_type: "CUSTOM", reason_code: "PRINT_DEFECT", lines: [ { order_line_id: "${line1}", qty: 1 }, { order_line_id: "${line2}", qty: 1 } ] }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ret: $.data.id }
            - call: "POST /packaging-distribution/returns/${ret}/approve"
              payload: {}
              as: CustomerService
              captures: { refund: $.data.refund_cents, fee: $.data.restock_fee_cents }
          assert:
            - "Return.${ret}.refund_cents == 562 (captured ${refund}: 2 x round_half_up(331 x 0.85) = 2 x 281, NOT round(662 x 0.85) = 563)"
            - "Return.${ret}.restock_fee_cents == 100 (captured ${fee}: 2 x round_half_up(331 x 0.15) = 2 x 50)"
            - "refund + fee == 662 == 2 x 331 (per-line rounding recomposes the gross exactly)"

  # ------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: order_po_review_reject_resubmit_cycle
        grounds:
          - state_machines.Order.PO_REVIEW_to_DRAFT
          - state_machines.Order.DRAFT_to_PENDING
        distinguishing_aspect: |
          Branching revert cycle on the ORDER entity: DRAFT -> PENDING ->
          PO_REVIEW -> DRAFT -> PENDING -> PO_REVIEW -> STOCK_RESERVED, a
          loop with version progression 1->2->3->4->5; distinct entity from
          the sibling instance's CustomPrintJob cycle.
        test_recipe:
          setup:
            - "Warehouse ATL; CORPORATE account po_required=true credit 100000000; stock product base 100000, weight 10, density 20, inventory 100; order with po_number PO-77, line qty 11 -> grand 1118005 > 1000000 forces PO_REVIEW routing"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL", po_required: true }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "BX-900", name: "Gaylord Box", category: "BOXES", base_price_cents: 100000, uom: "EACH", case_qty: 1, pallet_qty: 1000, weight_lbs_per_unit: 10, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 100 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5, po_number: "PO-77" }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id, v_create: $.data.version }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 11 }
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { st_1: $.data.status, v_1: $.data.version }
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/reject"
              payload: { reason: "price too high" }
              as: AccountApprover
              as_user_id: "${acct}"
              captures: { st_2: $.data.status, v_2: $.data.version }
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { st_3: $.data.status, v_3: $.data.version }
            - call: "POST /packaging-distribution/orders/${ord}/approve"
              payload: {}
              as: AccountApprover
              as_user_id: "${acct}"
              captures: { st_4: $.data.status, v_4: $.data.version }
          assert:
            - "first submit: status == PO_REVIEW (captured ${st_1}), version == 2 (captured ${v_1})"
            - "reject: status == DRAFT (captured ${st_2}), version == 3 (captured ${v_2})"
            - "resubmit: status == PO_REVIEW (captured ${st_3}), version == 4 (captured ${v_3})"
            - "approve after the loop: status == STOCK_RESERVED (captured ${st_4}), version == 5 (captured ${v_4})"
            - "v_create == 1 (captured ${v_create})"

      - name: custom_job_scrap_rework_cycle
        grounds:
          - state_machines.CustomPrintJob.PRINTING_to_SCRAPPED
          - state_machines.OrderLine.IN_PRODUCTION_to_OPEN
        distinguishing_aspect: |
          Cyclic rework loop on the CUSTOMPRINTJOB/ORDERLINE entities: an
          out-of-tolerance receive scraps the job and spawns a replacement
          QUEUED job while the line cycles IN_PRODUCTION -> OPEN ->
          IN_PRODUCTION; distinct entity from the sibling instance's Order loop.
        test_recipe:
          setup:
            - "Warehouse ATL; account CORPORATE; custom product base 1000 (unit 1150), lead 3, tolerance 10%; order line qty 100 submitted -> CUSTOM_PRODUCTION with job1 QUEUED"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "ML-C1", name: "Custom Mailer 10x13", category: "MAILERS", base_price_cents: 1000, uom: "EACH", case_qty: 1, pallet_qty: 1000, weight_lbs_per_unit: 5, density_pcf: 20, is_custom_print: true, lead_time_days: 3 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
