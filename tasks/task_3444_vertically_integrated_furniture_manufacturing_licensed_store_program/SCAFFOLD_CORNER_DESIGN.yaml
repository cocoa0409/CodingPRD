# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3444 — furniture manufacturing + licensed store program
# Breadth probe over the §1.1–§1.7 surface. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: factory_create_applies_defaults_and_envelope
        claim_type: Creation
        grounds:
          - entities.Factory
          - response_envelope
        distinguishing_aspect: "A factory created with the four required inputs returns 201 with status ACTIVE, version 1, system id/created_at/updated_at, and the fixed meta envelope fields."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_factory
              call: "POST /api/factories"
              payload: { code: "FAC-D1", region: DOMESTIC, component_lines: [FOAM, FRAMES, UPHOLSTERY], weekly_capacity_units: 100 }
              as: PlatformAdmin
              captures: { f1: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Factory.${f1}.status == ACTIVE and version == 1"
            - "the response carries non-null id, created_at, updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: product_line_create_computes_clearance_price
        claim_type: Computed Fields
        grounds:
          - entities.ProductLine.fields.clearance_price_cents
          - calculations.order_pricing
        distinguishing_aspect: "clearance_price_cents is derived at create: round_half_up(89900 * 0.75) == 67425, and lifecycle starts CONCEPT."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - &c_line
              call: "POST /api/product-lines"
              payload: { name: "Alder Sofa Collection", category: UPHOLSTERY, price_point_cents: 89900, style_code: "ALD-SOFA-01" }
              as: PlatformAdmin
              captures: { pl1: $.data.id, pl1_cp: $.data.clearance_price_cents, pl1_lc: $.data.lifecycle }
          assert:
            - "ProductLine.${pl1}.lifecycle == CONCEPT"
            - "ProductLine.${pl1}.clearance_price_cents == 67425 even though the line is not yet in CLEARANCE"

      - name: licensee_create_applies_defaults_and_initial_state
        claim_type: Defaults
        grounds:
          - entities.Licensee
          - state_machines.Licensee
        distinguishing_aspect: "Omitting all optional fields yields royalty_rate 0.04, merchandising_standard_version MS-2026.1, latest_audit_score 80, status APPLICANT, null scores, and zeroed royalty ledger."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - &c_licensee
              call: "POST /api/licensees"
              payload: { business_name: "Summit Home Furnishings" }
              as: PlatformAdmin
              captures: { l1: $.data.id }
          assert:
            - "Licensee.${l1}.status == APPLICANT (initial state)"
            - "royalty_rate == 0.04, merchandising_standard_version == MS-2026.1, latest_audit_score == 80"
            - "last_cycle_score and seasoned_score are null; royalty_accrued_cents == 0, chargeback_cents == 0, net_royalty_cents == 0"

      - name: dc_create_default_crew_units_six
        claim_type: Defaults
        grounds:
          - entities.DistributionCenter.fields.daily_crew_units
        distinguishing_aspect: "Omitting daily_crew_units stores the default 6."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - &c_dc
              call: "POST /api/distribution-centers"
              payload: { code: "DC-KENT", supports_home_delivery: true, region_codes: ["T-SEA"] }
              as: PlatformAdmin
              captures: { dc1: $.data.id, dc1_crew: $.data.daily_crew_units }
          assert:
            - "DistributionCenter.${dc1}.daily_crew_units == 6 (default applied)"

      - name: order_get_round_trips_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.SupplyOrder
          - endpoints.GET_/api/orders/{id}
        distinguishing_aspect: "Every stored field of a drafted licensee freight order round-trips through GET unchanged, including the polymorphic buyer FK (retail_account_id null)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, ACTIVE line Alder 89900, ACTIVE licensee Summit, OPEN cycle week 2026-09-07."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - &c_line_active
              call: "POST /api/product-lines/${pl1}/advance"
              payload: {}
              as: PlatformAdmin
            - *c_licensee
            - &c_licensee_active
              call: "POST /api/licensees/${l1}/transition"
              payload: { to_state: ACTIVE }
              as: PlatformAdmin
            - &c_cycle1
              call: "POST /api/allocation-cycles"
              payload: { factory_id: "${f1}", week_start: "2026-09-07T00:00:00Z" }
              as: ProductionPlanner
              captures: { c1: $.data.id }
            - &c_fr_order
              call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 3, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { o1: $.data.id }
          trigger:
            - call: "GET /api/orders/${o1}"
              payload: {}
              as: WholesaleBuyer
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { g_unit: $.data.unit_price_cents, g_total: $.data.provisional_total_cents, g_rt: $.data.retail_account_id }
          assert:
            - "the response status is 200 and data.id == ${o1}"
            - "unit_price_cents == 62930 and provisional_total_cents == 188790 (round_half_up(89900*0.7) * 3)"
            - "retail_account_id is null, allocation_state == UNALLOCATED, fulfillment_state == PENDING"
            - "reads are role-agnostic: a WholesaleBuyer can GET the order"

      - name: orders_list_paginates_and_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/orders
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three orders listed with limit 2 / offset 0 return 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false; allocation_state filter narrows the set."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, ACTIVE line, ACTIVE licensee, OPEN cycle; three orders created, exactly one submitted (RESERVED)."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - *c_cycle1
            - *c_fr_order
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 1, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { o2: $.data.id }
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 1, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "POST /api/orders/${o2}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
          trigger:
            - call: "GET /api/orders"
              payload: { licensee_id: "${l1}", limit: 2, offset: 0 }
              as: PlatformAdmin
              captures: { page1: $.data }
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /api/orders?licensee_id=${l1}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /api/orders?licensee_id=${l1}&allocation_state=RESERVED returns exactly 1 row (the submitted order ${o2})"
            - "GET /api/orders?licensee_id=${l1} with no params uses defaults limit 10 / offset 0 and returns all 3 rows"

      - name: order_get_unknown_id_returns_order_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_ORDER_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "A well-formed but unallocated order id returns the entity-specific 404 ERR_ORDER_NOT_FOUND, not a generic error."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /api/orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response is 404 with error_id == ERR_ORDER_NOT_FOUND"

      - name: factory_create_missing_required_capacity_returns_400
        claim_type: Required Fields
        grounds:
          - entities.Factory.fields.weekly_capacity_units
          - errors.ERR_VALIDATION
        distinguishing_aspect: "Omitting the required weekly_capacity_units field is rejected 400 ERR_VALIDATION before any state exists."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /api/factories"
              payload: { code: "FAC-X1", region: DOMESTIC, component_lines: [FOAM] }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response is 400 with error_id == ERR_VALIDATION"

      - name: order_create_with_version_input_ignored
        claim_type: System Fields
        grounds:
          - entities.SupplyOrder
        distinguishing_aspect: "A client-supplied version: 99 in the create payload is ignored; the stored order has version 1 and system-stamped created_at."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, ACTIVE line, ACTIVE licensee, OPEN cycle."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - *c_cycle1
          trigger:
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 1, delivery_mode: FREIGHT_TO_STORE, version: 99 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { o_v: $.data.version }
          assert:
            - "the response is 201 and the order's version == 1 (client input ignored)"

      - name: price_point_off_ladder_rejected
        claim_type: Type Constraints
        grounds:
          - errors.ERR_PRICE_POINT_NOT_ON_LADDER
          - calculations.order_pricing
        distinguishing_aspect: "price_point_cents 99999 is not a member of PRICE_LADDER_CENTS and is rejected 422 at line create."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /api/product-lines"
              payload: { name: "Off Ladder Line", category: BEDDING, price_point_cents: 99999, style_code: "OFF-01" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response is 422 with error_id == ERR_PRICE_POINT_NOT_ON_LADDER"

      - name: buyer_mismatch_licensee_with_retail_fk_rejected
        claim_type: Type Constraints
        grounds:
          - errors.ERR_BUYER_MISMATCH
          - entities.SupplyOrder.fields.buyer_type
        distinguishing_aspect: "buyer_type LICENSEE carrying retail_account_id instead of licensee_id violates the polymorphic buyer shape: 422 ERR_BUYER_MISMATCH."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, ACTIVE line, retail account Metro, OPEN cycle."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - &c_retail
              call: "POST /api/retail-accounts"
              payload: { business_name: "Metro Discount Furniture", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - *c_cycle1
          trigger:
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, retail_account_id: "${r1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 1, delivery_mode: FREIGHT_TO_STORE }
              as: WholesaleBuyer
              as_user_id: "${r1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 422 with error_id == ERR_BUYER_MISMATCH"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: order_deliver_from_pending_returns_409
        claim_type: invalid_transition
        grounds:
          - state_machines.SupplyOrder
          - errors.ERR_INVALID_TRANSITION
        distinguishing_aspect: "DELIVER is only wired from SHIPPED; on a PENDING draft order the same action is 409 ERR_INVALID_TRANSITION with no side effects."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, ACTIVE line, ACTIVE licensee, OPEN cycle; one drafted freight order (never submitted)."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - *c_cycle1
            - *c_fr_order
          trigger:
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: DELIVER }
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_INVALID_TRANSITION"
            - "GET /api/orders/${o1} still shows allocation_state UNALLOCATED and fulfillment_state PENDING"

      - name: claim_denied_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.WarrantyClaim
          - errors.ERR_INVALID_TRANSITION
        distinguishing_aspect: "DENIED is terminal: a later adjudication attempt on the same claim is 409 ERR_INVALID_TRANSITION."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, ACTIVE line, ACTIVE licensee, OPEN cycle; freight order submitted, run, DELIVERED; DEFECT claim filed and DENIED."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - *c_cycle1
            - *c_fr_order
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - &c_run_c1
              call: "POST /api/allocation-cycles/${c1}/run-allocation"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SHIP }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: DELIVER }
              as: LogisticsCoordinator
            - call: "POST /api/warranty-claims"
              payload: { supply_order_id: "${o1}", claim_type: DEFECT, description: "Frame cracked" }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { cl1: $.data.id }
            - call: "POST /api/warranty-claims/${cl1}/transition"
              payload: { to_state: DENIED, decision_note: "Wear and tear, not a defect" }
              as: WarrantyAdmin
          trigger:
            - call: "POST /api/warranty-claims/${cl1}/transition"
              payload: { to_state: RESOLVED, decision_note: "reconsidered" }
              as: WarrantyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the claim is DENIED after the first decision (terminal)"
            - "the second adjudication is 409 ERR_INVALID_TRANSITION and the claim remains DENIED"

      - name: cycle_close_from_open_returns_409
        claim_type: invalid_transition
        grounds:
          - state_machines.AllocationCycle
          - errors.ERR_INVALID_TRANSITION
        distinguishing_aspect: "CLOSE is wired only from ALLOCATED; closing an OPEN cycle (run never executed) is 409 ERR_INVALID_TRANSITION."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory; OPEN cycle week 2026-09-07."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_cycle1
          trigger:
            - call: "POST /api/allocation-cycles/${c1}/close"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_INVALID_TRANSITION"
            - "GET /api/allocation-cycles/${c1} still shows status OPEN and closed_at null"

      - name: order_double_submit_returns_409
        claim_type: idempotency
        grounds:
          - state_machines.SupplyOrder.UNALLOCATED_to_RESERVED
          - errors.ERR_INVALID_TRANSITION
        distinguishing_aspect: "SUBMIT is not idempotent: the second SUBMIT on an already-RESERVED order is 409 ERR_INVALID_TRANSITION, and capacity is not double-counted."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, ACTIVE line, ACTIVE licensee, OPEN cycle; order qty 5 submitted once (RESERVED)."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - *c_cycle1
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 5, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
          trigger:
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { err: $.data.error_id }
            - call: "GET /api/allocation-cycles/${c1}"
              payload: {}
              as: ProductionPlanner
              captures: { c1_lic: $.data.licensee_reserved_units }
          assert:
            - "second SUBMIT is 409 ERR_INVALID_TRANSITION"
            - "AllocationCycle.${c1}.licensee_reserved_units == 5 (not 10 — no double reservation)"

      - name: parts_order_full_flow_bubbles_claim_to_resolved
        claim_type: side_effect_bubble_up
        grounds:
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_PARTS_ORDERED
          - state_machines.WarrantyClaim.PARTS_ORDERED_to_RESOLVED
          - state_machines.PartsOrder
        distinguishing_aspect: "Approval with parts creates QUEUED PartsOrders; shipping and delivering the last one auto-resolves the claim (PARTS_ORDERED -> RESOLVED) with resolved_at stamped."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, ACTIVE line, ACTIVE licensee, OPEN cycle; freight order submitted, run, DELIVERED; MISSING_PARTS claim filed."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - *c_cycle1
            - *c_fr_order
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - *c_run_c1
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SHIP }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: DELIVER }
              as: LogisticsCoordinator
            - call: "POST /api/warranty-claims"
              payload: { supply_order_id: "${o1}", claim_type: MISSING_PARTS, description: "Two bed legs missing" }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /api/warranty-claims/${cl1}/transition"
              payload: { to_state: PARTS_ORDERED, approved_parts: [{ sku: "LEG-42", quantity: 2 }], decision_note: "shipping replacement legs" }
              as: WarrantyAdmin
              captures: { cl_status: $.data.status }
            - call: "GET /api/parts-orders"
              payload: { claim_id: "${cl1}" }
              as: WarrantyAdmin
              captures: { po1: "$.data[0].id", po1_status: "$.data[0].status" }
            - call: "POST /api/parts-orders/${po1}/transition"
              payload: { to_state: SHIPPED }
              as: LogisticsCoordinator
            - call: "POST /api/parts-orders/${po1}/transition"
              payload: { to_state: DELIVERED }
              as: LogisticsCoordinator
            - call: "GET /api/warranty-claims/${cl1}"
              payload: {}
              as: WarrantyAdmin
              captures: { cl_final: $.data.status, cl_cb: $.data.chargeback_cents, cl_dec: $.data.decision }
          assert:
            - "after approval the claim is PARTS_ORDERED with decision == APPROVED"
            - "one PartsOrder exists with sku LEG-42, quantity 2, initial status QUEUED"
            - "after SHIPPED then DELIVERED, the claim auto-transitions to RESOLVED with resolved_at non-null"
            - "chargeback_cents is null (MISSING_PARTS carries no chargeback)"

      - name: missed_appointment_auto_sweep_reverts_order
        claim_type: automatic_transition
        grounds:
          - state_machines.DeliveryAppointment.CONFIRMED_to_MISSED
          - state_machines.SupplyOrder.SHIPPED_to_PICKED
        distinguishing_aspect: "Advancing the logical clock past window_end + 120 minutes flips a CONFIRMED appointment to MISSED in the same clock-set call and reverts its order SHIPPED -> PICKED."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Full home-delivery setup; order picked; appointment CONFIRMED for 2026-09-04 09:00-11:00 (order SHIPPED)."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - &c_terr_sea
              call: "POST /api/territories"
              payload: { region_code: "T-SEA", population_tier: METRO }
              as: PlatformAdmin
              captures: { t_sea: $.data.id }
            - &c_assign_sea
              call: "POST /api/territories/${t_sea}/transition"
              payload: { to_state: ASSIGNED, licensee_id: "${l1}" }
              as: PlatformAdmin
            - *c_dc
            - *c_cycle1
            - &c_hd_order
              call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 2, delivery_mode: HOME_DELIVERY }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { o1: $.data.id }
            - &c_submit_o1
              call: "POST /api/orders/${o1}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - *c_run_c1
            - &c_pick_o1
              call: "POST /api/orders/${o1}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
            - call: "POST /api/delivery-appointments"
              payload: { supply_order_id: "${o1}", dc_id: "${dc1}", zone: LOCAL, region_code: "T-SEA", window_start: "2026-09-04T09:00:00Z", window_end: "2026-09-04T11:00:00Z", crew_units: 1 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { ap1: $.data.id }
            - call: "POST /api/delivery-appointments/${ap1}/transition"
              payload: { to_state: CONFIRMED }
              as: LogisticsCoordinator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T13:01:00Z" }
              as: PlatformAdmin
            - call: "GET /api/delivery-appointments/${ap1}"
              payload: {}
              as: PlatformAdmin
              captures: { ap_status: $.data.status }
            - call: "GET /api/orders/${o1}"
              payload: {}
              as: PlatformAdmin
              captures: { o_ful: $.data.fulfillment_state }
          assert:
            - "window_end 11:00 + 120 min grace = 13:00; the clock move to 13:01 flips the appointment to MISSED atomically"
            - "DeliveryAppointment.${ap1}.status == MISSED"
            - "SupplyOrder.${o1}.fulfillment_state == PICKED (SHIPPED -> PICKED compensation)"

      - name: home_delivery_order_direct_ship_returns_409
        claim_type: guarded_transition
        grounds:
          - state_machines.SupplyOrder
          - errors.ERR_USE_APPOINTMENT_FLOW
        distinguishing_aspect: "A HOME_DELIVERY order's SHIP action on the order endpoint is rejected: only an appointment CONFIRM may ship it."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Full home-delivery setup; order submitted, run, PICKED."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - *c_terr_sea
            - *c_assign_sea
            - *c_dc
            - *c_cycle1
            - *c_hd_order
            - *c_submit_o1
            - *c_run_c1
            - *c_pick_o1
          trigger:
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SHIP }
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_USE_APPOINTMENT_FLOW"
            - "SupplyOrder.${o1}.fulfillment_state remains PICKED"

      - name: dit_approval_chargeback_adjusts_net_royalty
        claim_type: side_effect_cross_entity
        grounds:
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_RESOLVED
          - calculations.royalty_accrual
          - entities.Licensee.fields.net_royalty_cents
        distinguishing_aspect: "Approving a DAMAGE_IN_TRANSIT claim books chargeback_cents == round_half_up(83860 * 0.15) == 12579 on the licensee, driving net_royalty_cents negative (3354 - 12579 == -9225) against the accrued royalty."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, line Birch 59900 ACTIVE, licensee Summit ACTIVE, OPEN cycle; order qty 2 (total 83860) submitted, run, DELIVERED (royalty 3354 accrued); DAMAGE_IN_TRANSIT claim filed within 30 days."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - call: "POST /api/product-lines"
              payload: { name: "Birch Bedroom Set", category: CASEGOODS, price_point_cents: 59900, style_code: "BR-BED-01" }
              as: PlatformAdmin
              captures: { pl2: $.data.id }
            - call: "POST /api/product-lines/${pl2}/advance"
              payload: {}
              as: PlatformAdmin
            - *c_licensee
            - *c_licensee_active
            - *c_cycle1
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl2}", quantity: 2, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - *c_run_c1
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SHIP }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: DELIVER }
              as: LogisticsCoordinator
            - call: "POST /api/warranty-claims"
              payload: { supply_order_id: "${o1}", claim_type: DAMAGE_IN_TRANSIT, description: "Headboard crushed in transit" }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /api/warranty-claims/${cl1}/transition"
              payload: { to_state: RESOLVED, decision_note: "approved, carrier fault" }
              as: WarrantyAdmin
              captures: { cl_cb: $.data.chargeback_cents, cl_dec: $.data.decision }
            - call: "GET /api/licensees/${l1}"
              payload: {}
              as: PlatformAdmin
              captures: { l_accrued: $.data.royalty_accrued_cents, l_cb: $.data.chargeback_cents, l_net: $.data.net_royalty_cents }
          assert:
            - "WarrantyClaim.${cl1}.decision == APPROVED and chargeback_cents == 12579"
            - "Licensee.${l1}.royalty_accrued_cents == 3354 (from the delivered 83860 order)"
            - "Licensee.${l1}.chargeback_cents == 12579 and net_royalty_cents == -9225"

  # ===========================================================================
  - section: calculations
    instances:
      - name: wholesale_tier_boundary_qty9_full_price_qty10_five_pct
        claim_type: threshold_boundary
        grounds:
          - calculations.order_pricing
        distinguishing_aspect: "Tier boundary precision: quantity 9 earns no discount (unit 89900), quantity 10 crosses TIER1_QTY and earns 5% (unit 85405) — the breakpoint is >=, not >."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, line Alder 89900 ACTIVE, retail account Metro (limit 5000000), OPEN cycle."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_retail
            - *c_cycle1
          trigger:
            - call: "POST /api/orders"
              payload: { buyer_type: RETAIL_ACCOUNT, retail_account_id: "${r1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 9, delivery_mode: FREIGHT_TO_STORE }
              as: WholesaleBuyer
              as_user_id: "${r1}"
              captures: { o9: $.data.id, u9: $.data.unit_price_cents, t9: $.data.provisional_total_cents }
            - call: "POST /api/orders"
              payload: { buyer_type: RETAIL_ACCOUNT, retail_account_id: "${r1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 10, delivery_mode: FREIGHT_TO_STORE }
              as: WholesaleBuyer
              as_user_id: "${r1}"
              captures: { o10: $.data.id, u10: $.data.unit_price_cents, t10: $.data.provisional_total_cents }
          assert:
            - "qty 9: unit_price_cents == 89900 (tier 0, no discount) and total == 809100"
            - "qty 10: unit_price_cents == 85405 (round_half_up(89900 * 0.95)) and total == 854050"

      - name: submit_reprices_when_line_moves_to_clearance
        claim_type: variant_selection
        grounds:
          - calculations.order_pricing
          - entities.SupplyOrder.fields.provisional_total_cents
        distinguishing_aspect: "A draft created while the line is ACTIVE (unit 62930) is repriced at SUBMIT after the line advanced to CLEARANCE: licensee unit becomes round_half_up(67425 * 0.70) == 47198."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, line Alder ACTIVE, licensee Summit ACTIVE, OPEN cycle; draft licensee order qty 1 created while ACTIVE."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - *c_cycle1
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 1, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { o1: $.data.id, u_pre: $.data.unit_price_cents }
            - call: "POST /api/product-lines/${pl1}/advance"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { u_post: $.data.unit_price_cents, t_post: $.data.provisional_total_cents }
          assert:
            - "at create (line ACTIVE): unit_price_cents == 62930"
            - "at SUBMIT (line CLEARANCE): unit_price_cents == 47198 and provisional_total_cents == 47198 (repriced off the clearance base)"
            - "the order lands RESERVED (lifecycle CLEARANCE is orderable)"

      - name: credit_exposure_excludes_delivered_orders
        claim_type: input_set_filtering
        grounds:
          - calculations.credit_exposure
        distinguishing_aspect: "The exposure input set drops DELIVERED orders: after a submitted wholesale order is picked, shipped and delivered, credit_used_cents returns from 89900 to 0."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, line Alder ACTIVE, retail account Metro (limit 1000000), OPEN cycle; wholesale order qty 1 submitted (RESERVED), run (ALLOCATED)."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_retail
            - *c_cycle1
            - call: "POST /api/orders"
              payload: { buyer_type: RETAIL_ACCOUNT, retail_account_id: "${r1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 1, delivery_mode: FREIGHT_TO_STORE }
              as: WholesaleBuyer
              as_user_id: "${r1}"
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SUBMIT }
              as: WholesaleBuyer
              as_user_id: "${r1}"
            - *c_run_c1
            - call: "GET /api/retail-accounts/${r1}"
              payload: {}
              as: PlatformAdmin
              captures: { used_alloc: $.data.credit_used_cents }
          trigger:
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SHIP }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: DELIVER }
              as: LogisticsCoordinator
            - call: "GET /api/retail-accounts/${r1}"
              payload: {}
              as: PlatformAdmin
              captures: { used_post: $.data.credit_used_cents }
          assert:
            - "while ALLOCATED: credit_used_cents == 89900 (counts at final_total_cents)"
            - "after DELIVER: credit_used_cents == 0 (DELIVERED leaves the exposure input set)"

      - name: waterfall_demotes_early_wholesale_when_licensee_cap_binds
        claim_type: waterfall_allocation
        grounds:
          - calculations.capacity_waterfall
          - state_machines.SupplyOrder.RESERVED_to_WAITLISTED
        distinguishing_aspect: "The waterfall is not first-come-first-served at run time: an early wholesale RESERVED order of 18 units is DEMOTED to WAITLISTED because the licensee cap leaves wholesale only 10 units (capacity 20, floor 25%)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-W1 (cap 20), line Alder ACTIVE, retail account Metro (limit 5000000), licensee Summit ACTIVE, cycle week 2026-09-07 OPEN."
            - "WA qty 18 submitted first (RESERVED, unit 85405); LA qty 10 submitted second (WAITLISTED: 18 + 10 > 20)."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/factories"
              payload: { code: "FAC-W1", region: OVERSEAS, component_lines: [FRAMES], weekly_capacity_units: 20 }
              as: PlatformAdmin
              captures: { fW: $.data.id }
            - *c_line
            - *c_line_active
            - *c_retail
            - *c_licensee
            - *c_licensee_active
            - call: "POST /api/allocation-cycles"
              payload: { factory_id: "${fW}", week_start: "2026-09-07T00:00:00Z" }
              as: ProductionPlanner
              captures: { cW: $.data.id }
            - call: "POST /api/orders"
              payload: { buyer_type: RETAIL_ACCOUNT, retail_account_id: "${r1}", allocation_cycle_id: "${cW}", product_line_id: "${pl1}", quantity: 18, delivery_mode: FREIGHT_TO_STORE }
              as: WholesaleBuyer
              as_user_id: "${r1}"
              captures: { o_wa: $.data.id }
            - call: "POST /api/orders/${o_wa}/transition"
              payload: { action: SUBMIT }
              as: WholesaleBuyer
              as_user_id: "${r1}"
              captures: { wa_pre: $.data.allocation_state }
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${cW}", product_line_id: "${pl1}", quantity: 10, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { o_la: $.data.id }
            - call: "POST /api/orders/${o_la}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { la_pre: $.data.allocation_state }
          trigger:
            - call: "POST /api/allocation-cycles/${cW}/run-allocation"
              payload: {}
              as: ProductionPlanner
            - call: "GET /api/orders/${o_wa}"
              payload: {}
              as: PlatformAdmin
              captures: { wa_post: $.data.allocation_state }
            - call: "GET /api/orders/${o_la}"
              payload: {}
              as: PlatformAdmin
              captures: { la_post: $.data.allocation_state, la_final: $.data.final_total_cents }
            - call: "GET /api/allocation-cycles/${cW}"
              payload: {}
              as: ProductionPlanner
              captures: { cW_lic: $.data.licensee_reserved_units, cW_ws: $.data.wholesale_reserved_units, cW_av: $.data.available_units }
            - call: "GET /api/retail-accounts/${r1}"
              payload: {}
              as: PlatformAdmin
              captures: { r1_used: $.data.credit_used_cents }
          assert:
            - "before run: WA RESERVED (18 <= 20), LA WAITLISTED (28 > 20)"
            - "after run: LA ALLOCATED with final_total_cents == 629300 (licensee_cap == 20 - floor(20*0.25) == 15 covers 10)"
            - "after run: WA is WAITLISTED — wholesale_cap == 20 - 10 == 10 < 18 demotes the early bird"
            - "cycle: licensee_reserved_units == 10, wholesale_reserved_units == 0, available_units == 10"
            - "RetailAccount.${r1}.credit_used_cents == 0 (WAITLISTED holds no exposure)"

      - name: waitlist_ranking_preferred_tier_beats_earlier_creation
        claim_type: selector_determinism
        grounds:
          - calculations.waitlist_ranking
          - calculations.capacity_waterfall
        distinguishing_aspect: "Within the licensee group, standing tier dominates created_at: PREFERRED (seasoned 94.00 >= 75) licensee's later order is allocated while the STANDARD licensee's earlier RESERVED order is demoted to WAITLISTED."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-R1 (cap 10), line Alder ACTIVE."
            - "Licensee STAR earned seasoned 94.00 in a prior closed cycle (qty-2 order delivered, default audit 80, no claims): 0.5*100 + 0.3*80 + 0.2*100 = 94.00."
            - "Cycle B week 2026-09-14 OPEN: NEW's qty-6 order created FIRST (RESERVED), STAR's qty-6 order second (WAITLISTED at submit, 12 > 10)."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/factories"
              payload: { code: "FAC-R1", region: DOMESTIC, component_lines: [UPHOLSTERY], weekly_capacity_units: 10 }
              as: PlatformAdmin
              captures: { fR: $.data.id }
            - *c_line
            - *c_line_active
            - call: "POST /api/licensees"
