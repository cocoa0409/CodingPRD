  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: mark_ready_requires_received_title_record
        grounds:
          - state_machines.Vehicle.AWAITING_CONDITION_to_SALE_READY
          - state_machines.TitleRecord.PENDING_to_RECEIVED
          - errors.ERR_TITLE_NOT_RECEIVED
        distinguishing_aspect: |
          Entity pair Vehicle -> TitleRecord: Vehicle's
          AWAITING_CONDITION -> SALE_READY transition is gated on a DIFFERENT
          entity's state (TitleRecord.status == RECEIVED). Without any title
          the gate fails ERR_TITLE_NOT_RECEIVED; after POST
          /vehicles/{id}/title the same mark-ready succeeds.
        test_recipe:
          setup:
            - "CA yard; STANDARD seller; vehicle with condition + 5 images (AWAITING_CONDITION) but NO title record."
          setup_api_calls:
            - call: "POST /salvage-auction/yards"
              payload: { name: "CA Yard", state_code: "CA", daily_storage_rate_cents: 1000, free_storage_days: 1 }
              as: PlatformAdmin
              captures: { yard_id: $.data.id }
