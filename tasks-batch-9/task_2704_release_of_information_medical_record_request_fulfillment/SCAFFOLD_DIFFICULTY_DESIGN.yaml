      - name: unencrypted_delivery_safety_beats_recipient_mismatch_rejected
        grounds:
          - validation_priority_conflicts.pair_23_vs_25
          - validations.priority_23
          - validations.priority_25
          - errors.ERR_UNENCRYPTED_DELIVERY_NOT_DIRECTED
        distinguishing_aspect: >
          Both violated rules sit in the 422 band on the same endpoint, so the HTTP
          code cannot disambiguate them — only the error_id can. A third-party
          request delivered UNENCRYPTED_EMAIL with encryption NONE to a
          non-designated address must report the disclosure-safety failure (23),
          and a repair of only that leg then exposes the referential failure (25).
