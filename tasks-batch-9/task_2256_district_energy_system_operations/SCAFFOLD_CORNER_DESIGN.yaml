  - section: Errors
    instances:
      - name: every_remaining_not_found_error_id_is_reachable_with_an_unknown_path_id
        claim_type: Not Found
        grounds:
          - validations[priority 4 existence checks]
          - errors[ERR_SEGMENT_NOT_FOUND]
          - errors[ERR_FUEL_CONTRACT_NOT_FOUND]
          - errors[ERR_ASSET_NOT_FOUND]
          - errors[ERR_FORECAST_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_RATE_SCHEDULE_NOT_FOUND]
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_METERING_POINT_NOT_FOUND]
          - errors[ERR_READING_NOT_FOUND]
          - errors[ERR_INVOICE_NOT_FOUND]
          - errors[ERR_WORK_ORDER_NOT_FOUND]
          - errors[ERR_PROJECT_NOT_FOUND]
        distinguishing_aspect: "Each entity family owns its own 404 identifier rather than sharing one generic code, so twelve reads of twelve unknown ids must return twelve distinct error_id values — a single shared ERR_NOT_FOUND would pass a naive test but fail here."
        test_recipe:
          setup:
            - "An empty database with only the logical clock positioned; no rows of any entity exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
          trigger:
            - call: "GET /district-energy/pipe-segments/00000000-0000-0000-0000-000000000001"
              payload: {}
              as: NetworkEngineer
              captures: { e_segment: $.data.error_id }
            - call: "GET /district-energy/fuel-supply-contracts/00000000-0000-0000-0000-000000000002"
              payload: {}
              as: NetworkEngineer
              captures: { e_fuel: $.data.error_id }
            - call: "GET /district-energy/production-assets/00000000-0000-0000-0000-000000000003"
              payload: {}
              as: NetworkEngineer
              captures: { e_asset: $.data.error_id }
            - call: "GET /district-energy/load-forecasts/00000000-0000-0000-0000-000000000004"
              payload: {}
              as: NetworkEngineer
              captures: { e_forecast: $.data.error_id }
