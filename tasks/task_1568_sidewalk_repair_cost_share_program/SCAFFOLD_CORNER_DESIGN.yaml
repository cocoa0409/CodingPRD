            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-R7-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect1_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SETTLEMENT", area_sqft: 12 }, as: Inspector, as_user_id: "insp-1", captures: { defect2_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect1_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice1_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice1_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
          trigger:
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect2_id}"], prior_notice_id: "${notice1_id}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_NOTICE_REFERENCE (prior notice is ISSUED, not VOID)"

      - name: application_parcel_notice_mismatch
        claim_type: violation_to_error
        grounds:
